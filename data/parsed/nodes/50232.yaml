      <p>I also think the letters are much too abstract but I like your approach to “keeping it sharp”. </p>
      <p>I would definitely suggest doing a version that reads “TMA” left to right, instead of vertically. You also might play with the idea of sharpening up each individual letter. T could be soft, M could be a hybrid between soft and sharp, and A could be sharp. (Might be hard to do subtly enough, without looking silly and amateurish.) But the idea of making the type do what the company is about, is definitely worth pursuing.</p>
