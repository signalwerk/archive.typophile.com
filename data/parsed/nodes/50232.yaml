    html: <p>This is an excellent start. I think you are taking the drill bit motif too literally. You may have gone a little too far in abstracting the letters, especially the “A” - it is completely unreadable as an A. What I would imagine is very important in this kind of business is precision. Abstracting the letter forms is fine but their message still needs to be precise.</p>
