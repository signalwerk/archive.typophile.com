      <p>My first thought is that you are on the right track.</p>
      <p>My next thought is that you might not have to force everything to fit together so tool-like. I think the letters T, M, A stacked vertically would still feel “toolish”, even if they kept a little more of their letter-shapes. Router bits, or something that has been turned on a lathe, for example, don’t necessarily have edges that are flat all the way down the sides, as this logo is. Luckily, the letters are all symmetrical, so part of your “machined” look is already done for you (aren’t you glad the company isn’t RPJ?)</p>
      <p>I would try some that open the space up between the letters a bit, so that the TMA is a little more clearly “readable” at a glance... of course that is just my first thought of suggestion–you get to have the fun of playing around with it. Perhaps the point of the M could meet the upper point of the A?</p>
      <p>Have fun, and keep us posted.</p>
