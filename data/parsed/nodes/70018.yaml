    <p>Here I have some of the options I thought would make a good contrast with the "JUST" part, but I think there must be a more suitable typeface out there.</p>
    <p>Just communities is a non-profit organization, here is their vision and mission statements:</p>
    <p>Vision:<br>
    Just Communities envisions an equitable and inclusive network, where all people are connected, respected and valued.</p>
    <p>Mission:<br>
    Just Communities advances justice by building leadership, fostering change, and dismantling all forms of prejudice, discrimination and oppression.</p>
    <p>Thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/justcommunitiesdraft_6482.jpg"></div><p></p>
