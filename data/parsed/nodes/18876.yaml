    <p><a href="wiki/Grant Hutchinson" class="wiki">Grant Hutchinson</a>, part-time <a href="http://www.splorp.com">Splorp</a>er, and full-time <a href="http://www.veer.com">Veer</a>ster celebrates his 30-something birthday today. Grant is the quintessential Typophile, dipping his toes in every aspect of typography - fontographing, selling, writing, and all the tech stuff. He’s been around the block and knows what’s what and I’m proud to call him a pal.</p>
