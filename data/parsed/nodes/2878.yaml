    html: <p>Whithout seeing samples of the type you are trying to match this would be a hard question to answer. The tempting answer is to suggest one of the several Garamonds that have either an expert set or SC/OSF font included in the family. Adobe's Garamond No. 3 is a rather close approximation in terms of letterforms in the Roman and Italic, although the x-height is not the same. You might at least use the figures from that font with the letters from ITC Garamond. That would have less of an impact on appearance unless your book was largely numerals.</p>
