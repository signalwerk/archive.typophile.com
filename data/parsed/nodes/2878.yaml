  html: <p>I am  typesetting new material for a book originally published in the 1960s and I have to match the font. So far, the closest match I have found is ITC Garamond Book . It has a similar weight on the page to the original.  <br> <br>But ITC Garamond Book doesn't have old-style figures and I  need them! Does anyone have a suggestion?  <br> <br>thanks, garet</p>
