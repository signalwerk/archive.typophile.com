    html: <p>Thanks for such a rapid response, Mike. Stupid me forgot to mention that I did try Garamond 3 SC and OSF but they are too thin in comparison to the Garamond Book. I'm afraid I can't upload a sample of the font right now b/c the book went back to the client along with my unsatisfactory sample setting. If I can get the book back, I will post a scan. <br> <br>thanks again, garet</p>
