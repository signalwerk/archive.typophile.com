    html: <p>Garet,  <br> <br>That is the reason I suggested just using the numerals from the other font. Keep all your text in ITC Garamond Book, but use the numerals from one of the other fonts that has OSF. Adobe Garamond has a semibold weight for the Expert set with OSF which might work.</p>
