    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Typophile</strong></p>
    <p>Strictly speaking, a fanatic of all things <a href="/node/add/wiki?edit%5Btitle%5D=type" title="Create node &quot;type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">type</a>-related or <a href="/node/12026" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typographic</a>. In a broader sense, a lover of letters. This looser definition encompasses writing and lettering as areas of interest. See also <a href="/node/12636" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typophilism</a>.</p>
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12154" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Organizations</a>&nbsp;:&nbsp;Typophile</strong></p>
    <p><a href="http://www.typophile.com">Typophile</a> launched 16 April 2000. Typophile originally launched with exclusive articles and online courses from <a href="/node/12061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jonathan Hoefler</a> based on his <a href="/node/add/wiki?edit%5Btitle%5D=Yale" title="Create node &quot;Yale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Yale</a> lectures as well as articles from <a href="/node/add/wiki?edit%5Btitle%5D=Three%20Island%20Press" title="Create node &quot;Three Island Press&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Three Island Press</a> and <a href="/node/add/wiki?edit%5Btitle%5D=TypeRight" title="Create node &quot;TypeRight&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TypeRight</a>.</p>
    <p>Typophile’s stated aim is to further <a href="/node/12026" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typography</a> as a craft as well as a profession by providing an open, collaborative environment where users can contribute and access content for free. In the Typophile Forums members discuss everything from how to pronounce <a href="/node/14231" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Benguiat</a> to writing <a href="/node/14148" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">pangrams</a> or just getting help identifying a <a href="/node/16843" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typeface</a>.</p>
    <p>Aspiring and professional <a href="/node/add/wiki?edit%5Btitle%5D=type%20designers" title="Create node &quot;type designers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">type designers</a> post their work for peer critique. Currently there are over 500 fonts by designers from all over the world where English is commonly spoken – North America, South America, Europe and&nbsp;Russia.</p>
    <p>Typophile is produced, designed and maintained by <a href="/node/12021" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Punchcut</a> (<a href="http://www.punchcut.com">www.punchcut.com</a>), a San Francisco based interface design company. Typophile members, film fest sponsors and advertisers provide the sustaining financial support to keep Typophile&nbsp;thriving.</p>
    <p><span class="caps">TYPOPHILE</span> <span class="caps">FILM</span> <span class="caps">FEST</span></p>
    <p>In 2004 Typophile started the <a href="http://www.typophile.com/filmfest/">Typophile Film Fest</a> with the debut showing held at <a href="/node/12014" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeCon</a> 2004 in San Francisco. It has since been shown in New York, Boston, Seattle, St Petersburg and&nbsp;Vancouver.</p>
    <p>Typophile has been featured in <em><a href="/node/add/wiki?edit%5Btitle%5D=Tupigraphia" title="Create node &quot;Tupigraphia&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tupigraphia</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Metropolis" title="Create node &quot;Metropolis&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Metropolis</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Applied%20Arts%20Magazine" title="Create node &quot;Applied Arts Magazine&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Applied Arts Magazine</a>, <a href="/node/add/wiki?edit%5Btitle%5D=STEP" title="Create node &quot;STEP&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">STEP</span></a></em> and <em><a href="/node/44712" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">How</a></em>.</p>
    <p><span class="caps">CONTACT</span> <span class="caps">INFORMATION</span></p>
