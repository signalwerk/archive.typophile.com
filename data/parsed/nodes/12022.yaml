    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Typophile</strong></p>
    <p>Strictly speaking, a fanatic of all things <a href="/wiki/type" class="freelinking" rel="nofollow">type</a>-related or <a href="/wiki/typography" class="freelinking" rel="nofollow">typographic</a>. In a broader sense, a lover of letters. This looser definition encompasses writing and lettering as areas of interest. See also <a href="/wiki/typophilism" class="freelinking" rel="nofollow">typophilism</a>.</p>
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : Typophile</strong></p>
    <p><a href="http://www.typophile.com" rel="nofollow">Typophile</a> launched 16 April 2000. Typophile originally launched with exclusive articles and online courses from <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a> based on his <a href="/wiki/Yale" class="freelinking" rel="nofollow">Yale</a> lectures as well as articles from <a href="/wiki/Three%20Island%20Press" class="freelinking" rel="nofollow">Three Island Press</a> and <a href="/wiki/TypeRight" class="freelinking" rel="nofollow">TypeRight</a>.</p>
    <p>Typophile's stated aim is to further <a href="/wiki/typography" class="freelinking" rel="nofollow">typography</a> as a craft as well as a profession by providing an open, collaborative environment where users can contribute and access content for free. In the Typophile Forums members discuss everything from how to pronounce <a href="/wiki/Edward%20Benguiat" class="freelinking" rel="nofollow">Benguiat</a> to writing <a href="/wiki/Pangram" class="freelinking" rel="nofollow">pangrams</a> or just getting help identifying a <a href="/wiki/typeface" class="freelinking" rel="nofollow">typeface</a>.</p>
    <p>Aspiring and professional <a href="/wiki/type%20designers" class="freelinking" rel="nofollow">type designers</a> post their work for peer critique. Currently there are over 500 fonts by designers from all over the world where English is commonly spoken -- North America, South America, Europe and Russia.</p>
    <p>Typophile is produced, designed and maintained by <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> (<a href="http://www.punchcut.com" rel="nofollow">www.punchcut.com</a>), a San Francisco based interface design company. Typophile members, film fest sponsors and advertisers provide the sustaining financial support to keep Typophile thriving.</p>
    <p>TYPOPHILE FILM FEST</p>
    <p>In 2004 Typophile started the <a href="http://www.typophile.com/filmfest/" rel="nofollow">Typophile Film Fest</a> with the debut showing held at <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> 2004 in San Francisco. It has since been shown in New York, Boston, Seattle, St Petersburg and Vancouver.</p>
    <p>Typophile has been featured in <em><a href="/wiki/Tupigraphia" class="freelinking" rel="nofollow">Tupigraphia</a>, <a href="/wiki/Metropolis" class="freelinking" rel="nofollow">Metropolis</a>, <a href="/wiki/Applied%20Arts%20Magazine" class="freelinking" rel="nofollow">Applied Arts Magazine</a>, <a href="/wiki/STEP" class="freelinking" rel="nofollow">STEP</a></em> and <em><a href="/wiki/How" class="freelinking" rel="nofollow">How</a></em>.</p>
