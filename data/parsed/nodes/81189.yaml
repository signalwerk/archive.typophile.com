  html: <p>Curious if these two typefaces can be identified, or are original designs? Found on old Polish book cover. Closest match I've found to "botanika" is Neo Sans Ultra, but there are clear differences. </p><div class="imageWrap"><img src="http://typophile.com/files/botanika_kozlowska_6124.jpg"></div><p></p>
