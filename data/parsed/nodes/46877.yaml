  html: |-
    <p>Hello,</p>
    <p>I am looking for a ttf font which has at least some resemblance to "Arno pro caption". It doesnt need to be very close!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/trans1x1_6439.gif"></div><p></p>
    <p>Of course a free font would be best (because I need it only once) but I would be willing to pay for one if no other option.</p>
    <p>Why ttf? Because I want to export a document from OpenOffice into pdf (Open Office creates very solid, linked PDFs) and OpenOffice doesnt support otf in pdf.</p>
    <p>Thank you very much for any ideas</p>
    <p>PS.<br>
    I tried uploading an image of the font (<a href="http://www.itcfonts.com/Assets/images/trans1x1.gif" title="http://www.itcfonts.com/Assets/images/trans1x1.gif">http://www.itcfonts.com/Assets/images/trans1x1.gif</a>) but didnt succeed.</p>
