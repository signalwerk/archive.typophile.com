      <p>Hi Jonathan,</p>
      <p>The Mauer Sans capital ‘O’ looks as if the top and bottom curves are squashed towards the center, maybe make it more Evenly Circular  like O 1, O 2 or O 3. Similar treatment should be done on B, C, D, G, J, P, Q, S and U.</p>
      <p>It is going to become quite nice after some fine tuning.</p>
      <p>Boris</p>
