    <p>I’m curious: Has anyone had the opportunity to review an advance copy of the forthcoming book <a href="http://oakknoll.com/detail.php?d_booknr=105522" rel="nofollow"><em>Historical Types from Gutenberg to Ashendene</em></a> by Stan Knight, to be published by Oak Knoll soon?</p>
    <p>The book looks interesting from the promotion. I’d welcome any observations about the quality and breadth of the examples and illustrations from someone who’s seen them.</p>
