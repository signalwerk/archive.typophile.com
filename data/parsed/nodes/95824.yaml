    html: <p>I hadn't read Oak Knoll's blurb and can see it might make one think that the lighting has been used for ravishing but gimmicky typographic sensationalism. From what I have seen it is sensitively done to inform but you have made me think that there is no such thing as an objective reproduction - and, from the Dwiggins analogy, that the brain is inextricably involved in what and how we see. More decision making and bias pitfalls in Stan's approach than simply flattening everything out in two dimensions - but realise how crass and distorting that is too! There is no neutral. Clearly we need both approaches yet Stan's also get's closer to pointing to the truth that there is no substitute for perception that comes from encountering real thing - ideally handling it too. I have only seen some glossy prints so it remains to be seen how the reproductions  survive the production standards of the book. I'll certainly buy a copy!</p>
