      <p>Some of the best reproductions of historical printing that I have seen were in the original British Library / OUP edition of Scholderer's <em>Greek Printing Types</em> (1927). The reproductions were printed collotype, which gives an excellent impression of the stroke density of the originals without the ink gain problem of block printing that Dan describes.</p>
      <p>Is anyone aware of any books that use stochastic screening in reproductions of historical printing?</p>
