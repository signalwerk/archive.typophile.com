    html: |-
      <p>I found that a high-res grayscale scan converted to bitmap at 2400 pixels/inch, at the 50% Threshold setting, produces a close facsimile of letterpress type—without any 3-D information of course.</p>
      <p>I used this method for an article I wrote and designed for <em>Druk</em> magazine in 2000; it was printed on uncoated stock and the examples were reproduced size-as.</p>
      <p>I doubt the type in this new book will be as sharp as this bitmap method, but I could be wrong.</p>
      <p>**</p>
      <p>From a post-modern perspective, it’s a question of authenticity: should a reproduction be “warts and all” (which would include paper color), or should it be optimized and updated to remove reproduction of the original paper color, allowing the ﬁbre of the reproduction’s paper to substitute for the original? I’ll be interested to see what approach this new book takes.</p>
      <p>Patina is an issue: Vesalius’ (16th century) medical illustrations were reprinted in 1934 from the original blocks. People have commented on how puzzling the effect is, caused largely by the pure white paper.</p>
