      <blockquote><p>Even awesomer, make blocks and print in relief.</p></blockquote>
      <p>I’m very interested to see how this book’s photos will compare with books that make use of block-printed reproductions. I have seen a few dozen German books made between about 1900 and 1950 that reproduce historical books pages this way (well, primarily via etchings), and most of those are sub-par, from a type design analysis point of view. The type is usually made far too heavy in these reproductions. Sort the “dipping letters into chocolate” effect. These reproductions were made with the highest quality methods possible at the time, too; the publishers weren’t skimming on the printing or paper costs.</p>
      <p>I saw a book printed in the UK earlier this year that reproduced things in a similar style (<em>E.R. Weiss – Typography of an Artist</em>). I think that it used multiple polymer plates – one for each color – made from high-res scans. This worked pretty well, especially because the paper it was printed on.</p>
