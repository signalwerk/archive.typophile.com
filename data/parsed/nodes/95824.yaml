    votes: null
    html: "<p>This is a companion volume to his 'Historical scripts: from Classical times to the Renaissance' which is viewed as a definitive visual anthology. I have not seen the text for the new book and don't think it will try to add anything to the scholarship of the subject (though I'm sure it will be well researched and written) but that is not the point. The point is the illustrations and I have seen some of these. They are a revelation and will make this a very important and exciting book. Stan has carefully overseen the enormous task of rephotographing every example illustrated and, most importantly, controlled the lighting so that the crucial three dimensionality and tactile qualities of the originals are revealed with the subtleties of paper texture, bite and ink squash. Suddenly the usual two dimensional reproductions look hopelessly superficial, inadequate to understanding and lifeless. A huge contribution and absolutely stunning!</p>"
