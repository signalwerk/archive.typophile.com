    html: "<p>We used stochastic screening for the Microsoft <em>Mathematical Typesetting</em> book, initially because we used different colours to differentiate text elements in illustrations and couldn't afford spot colours. I was really happy with the result, although if there is even a slightly imperfect registration there will be a light haze around the coloured letters, betraying that it isn't a spot colour. I particularly encourage anyone who has a copy of the book to take a look at the ClearType screenshot on page 38 through a loop: being able to see the colours of the individual pixels of 12pt type on 145 ppi at actual size in print was only possible with stochastic screening.</p>"
