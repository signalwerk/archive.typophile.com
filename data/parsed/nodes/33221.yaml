      <p>It seems to me that the square brackets are not very well drawn and that the kerning between 9) is not taking into account the curved back of the 9. My take is that seeing the two together I prefer the stressed fences to the more monoline ones. The Mil of the modified doesn’t work as well as the Mil of the original, the modified is biased against the space between i and l.</p>
      <p>Tim</p>
