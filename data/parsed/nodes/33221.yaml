    html: |-
      <p>"I still think your monoline versions are out of character with the face, and worse than what’s already there"</p>
      <p>Thanks for your honesty! However, I would point out in my defense that the monoline form seems to be the historically more authentic one, though the only source for Garamond himself that I have at hand right now is the specimen on p. 5 of Adobe's Garamond Premier specimen book (and this has only the parentheses).</p>
      <p>Adobe Garamond is, of course, a modernized, or at least "polished", interpretation of Garamond's faces – but I don't think that it's too far from the original to have the original kind of parentheses and other fences. We're just used to seeing it with the now more common kind. </p>
      <p>Besides, Robert Bringhurst, to whom you referred above, uses monoline parentheses and brackets with <em>Minion</em> in the second edition (1996 printing) of <em>Elements</em>; see also his comments on pp. 84–85 of that book. (This was my main inspiration here.)</p>
      <p>It's another question whether my particular monoline versions are entirely successful; indeed, the brackets probably do need to have their quirks removed.</p>
      <p>"On your revised kerning … I’d have to see it in print, in context, to really judge"</p>
      <p>Yes, of course. Judging a PDF on screen, or even in a laser printout, is hard. I fear myself (actually, I'm quite certain) that I haven't been completely consistent in the amount of kerning.</p>
