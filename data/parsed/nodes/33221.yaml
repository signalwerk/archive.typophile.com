      <p>Thanks so much for your comments, Tim! I thought I wasn't getting anything at all.</p>
      <p>"the square brackets are not very well drawn"</p>
      <p>Agreed. I deliberately left them pretty rough, partly just to see what people would say. But their roughness is quite accidental, really, which is probably not a good thing – and in any case, I guess it clashes with the otherwise polished outlines of the face.</p>
      <p>"the kerning between 9) is not taking into account the curved back of the 9"</p>
      <p>Actually, there's no kerning here in either the original or the modified version. But I agree that the combination looks too loose in the modified one (so I should perhaps add a pair for this).</p>
      <p>"The Mil of the modified doesn’t work as well"</p>
      <p>Well, I sort of feel that caps need their space; but you might be right, now that I look at the combination. (The original Mi is -12, the modified -8.) I have to say that as I was modifying the kerning pairs, they just kept looking too tight; maybe I did go too far!</p>
      <p>What do others feel?  I would appreciate it very much if you took at least a quick look at the PDF (as unpolished as it is). But all comments are welcome!</p>
      <p>Olli</p>
