    user: 1551
    date: 2007-04-25T05:33:00
    date_raw: 25 Apr 2007 — 5:33am
    votes: null
    html: |-
      <p>&gt;uses monoline parentheses and brackets with Minion in the second edition</p>
      <p>I have that edition, too. But in the current, 'Pro' version of Minion, Slimbach has changed them to a stressed version. </p>
      <p>This is a small matter, but I do think the stressed ones are more harmonious with the face, and nothing is gained by monoline ones. </p>
      <p>By contrast, in the case of the relatively unstressed 0 of many old style numbers, you gain by having it differentiated from the lower case or small caps o. But you aren't going to confuse a parenthesis with anything else anyway.</p>
