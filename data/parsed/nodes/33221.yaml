      <p>Ok, I looked at the PDF. I think Slimbach's parentheses and curly braces are fine. I don't particularly like the way he's handled the right angle bits on the brackets, but there's nothing terrible about it. </p>
      <p>I still think your monoline versions are out of character with the face, and worse than what's already there. There is something to be said for these non-alphabetic characters to be somewhat different visually than alphabetic characters, but the 'fences' already distinguish themselves by their length. </p>
      <p>On your revised kerning. Though I am generally a big admirer of Slimbach's work, I do feel he has a tendency to overdo tightness in kerning, particularly with punctuation. So, yeah, in principle I like your approach better, but I'd have to see it in print, in context, to really judge.</p>
