    html: <p>Olli, Bringhurst complains that parentheses are often too skinny, and the brackets too fat. To my eyes, you're taking them these wrong direction, making them out of character with the face. Slimbach's are good. If anything, I would fatten Slimbach's vertical on the bracket, though the skinniness in your showing might just be a screen artifact.</p>
