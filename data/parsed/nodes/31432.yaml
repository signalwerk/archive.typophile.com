  html: <p>Somehow I have a feeling that of the European scripts, the Latin and Armenian scripts can't be the only one with a typographical history of <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a>.  Are there any common ligatures in Cyrillic/Georgian/Greek scripts?  Or any common ligatures in Latin/Armenian other than the standard ones defined in the <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> spec (in addition to other semi-common ligatures like fj, ct, ck, it, ip)?</p>
  html_clean: <p>Somehow I have a feeling that of the European scripts, the Latin and Armenian scripts can't be the only one with a typographical history of <a href="/wiki/ligature" class="freelinking link-lost" rel="nofollow">ligatures</a>.  Are there any common ligatures in Cyrillic/Georgian/Greek scripts?  Or any common ligatures in Latin/Armenian other than the standard ones defined in the <a href="/wiki/Unicode" class="freelinking link-lost" rel="nofollow">Unicode</a> spec (in addition to other semi-common ligatures like fj, ct, ck, it, ip)?</p>
