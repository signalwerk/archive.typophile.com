      <p><cite>... hyphenation on the fly in Adobe Suite apps</cite></p>
      <p>Really? Well, good for Adobe and their users. What about QuarkXPress/Passport and other apps? What's the status there? </p>
      <p>In any case, do you feel such Greek ligatures merit inclusion under "standard" (liga) or "discretionary" (dlig) or perhaps as contextual alternates (calt)? I'd opt for "discretionary" unless wiser counsel chimes in (e.g., John Hudson, Adam Twardoch, Gerry Leonidas).</p>
      <p>Regards,<br>
      Ernie</p>
