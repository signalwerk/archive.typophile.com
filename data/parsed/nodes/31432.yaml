      <p>ChrisL: <cite>The double lamda and double gamma are perhaps the most prevalent of Greek ligatures.</cite></p>
      <p>Right. But should they be stowed under "standard" ligatures? Probably not. They occur in medial positions only in Greek and can often appear at hyphenation break points. Depending on character design, other commonly doubled consonants that are candidates for ligation include: double mu, double sigma, double pi, double rho, and double nu. However, since none of these doubled consonants are found in initial occurrence in Greek (except, perhaps, in some transliterated "loan words" from foreign languages — though even that seems a stretch too far), the same hyphenation caveat would appear to apply. The upshot, then? At best, these all seem candidates for "discretionary" ligatures, not "standard" alongside fi, ff, ffl, and so on.</p>
      <p>Regards,<br>
      Ernie</p>
