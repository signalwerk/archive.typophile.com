      <p>Greek, as written by mediaeval scribes, used to have lots of ligatures that make it really difficult for me to read Greek manuscripts from that era. Adaptation to the typographic age must have had something to do with the fact that we don't see them so much anymore.</p>
      <p>Nowadays in Greek typography, I think ligatures serve mainly an aesthetic function rather than arising from scribal shorthand; some ligatures I see are for double lambda or double gamma and the like.</p>
