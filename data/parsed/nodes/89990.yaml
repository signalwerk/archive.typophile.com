      <p>Decimal fractions in a proportional font look particularly horrible. Once I read a book on calendars which contained many decimal fractions, each and every one in proportional figures, and these were oldstyle figures at that. This was just about the worst choice of type imaginable. Even when not in tables, reading decimal fractions in this type was like trying to use a funhouse mirror to aid in grooming oneself.</p>
      <p>Sure, if you show the digit 1 as a simple vertical stroke, then you get spacing problems. Another way you end up with problems is with a small, oldstyle digit 1 that looks like a scared child trying to hide.</p>
      <p>To me, the space around the digit 1 is almost part of the character. Maybe I just have different ideas about kerning. Once I saw the sequence "r." kerned so that the arm of the "r" was directly above the full stop, as though trying to conceal it. I thought that was just plain wrong, like going swirnrning in the surnrner.</p>
