      <p>agisaak: Oh, I see. Those pairs "71" and "14" are troublemakers, like the letter pair "LA". Just as the solution to "LA" might involve shortening the horizontal stroke of the "L", so might the solution to "714" lie in lengthening the serif on the "1". (Well, it <em>is</em> Eurostile, after all, and how do the Europeans write the digit 1?)</p>
      <p>I think it's maybe the order in which the designer does things: probably first design the digits, then worry about how much or how little space they use up. Hence, proportional digits. Not: decide how much space you want each digit to gobble up, then design accordingly.</p>
