      <p>Dates and times look perfectly fine to me set in proportional figures.</p>
      <p>Your example of a bus-schedule is one where the dates and times occur <em> in a table </em>. Of course you will want tabular figures in this context (after all, that's what they're designed for), but that certainly doesn't imply that tabular figures are preferable in <em>non</em>-tabular contexts.</p>
      <p>In running text tabular figures are awkward because they don't space well -- the digit one is inevitably going to create problems.</p>
      <p>This is precisely why many faces include both proportional and tabular figures. The proportional figures generally look better <em>except</em> in those contexts where a tabular arrangement is needed.</p>
      <p>André</p>
