      <p>And anyway, I generally do not like numbers as words. But then again, I am the kind of person who gets confused if you say "quarter to six" rather than "five forty-five". Personally, I feel that English number words, especially for large numbers, sound overly formal and long-winded, and the digits are often recited out of order. (For something better on both counts, see Turkish number words, or Hungarian.) And I don't think any of these languages can handle, for example, "4,000,750" without tripping up the listener.</p>
