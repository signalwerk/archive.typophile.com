      <p>@Luma Vine:<br>
      <cite>Asking typefaces to default to your favorite settings is not really a viable solution,</cite></p>
      <p>Actually, the correct solution is for all software that prepares formatted text (i.e. it lets you use proportionally-spaced fonts, and choose bold and italic) to also allow access to all the special options that any font might have.</p>
      <p>This might be achieved, for example, by changing how the standard text box controls in Windows operate, so that all these options are available, say, with a right click, without the writer of the application having to write code to handle them.</p>
      <p>Otherwise, people should be making the variations in their fonts accessible on all software, for example by including multiple fonts in the package, so that people can select the font with small capitals or old-style numerals from software that does not have OpenType support yet.</p>
      <p>Fonts that are only usable on very fancy and expensive software are less useful.</p>
