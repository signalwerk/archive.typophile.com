      <p>In a scoreboard-type situation (like the score in a video game) it makes sense to use lining numerals. Makes it quick and easy to read the number and compare scores.</p>
      <p>But numbers appearing in a sentence are a different situation and the rules can vary depending on which style guide the writer is using. The often-used Chicago Manual of Style, for example, says that in non-technical writing any number smaller than one hundred should be spelled out, such as "My daughter is two years old.". Larger numbers are written as numerals, such as "It's 237 miles to New York.". </p>
      <p>There are a number of exceptions for special circumstances.</p>
