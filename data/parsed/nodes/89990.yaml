      <p>You also objected vehemently to proportionally spaced as well as "oldstyle" (lowercase) figures when designing a calendar in another thread. (Note that proportional spacing and lowercase appearance are two different things, and numerals can be neither, either, or both.)</p>
      <p>I don't see anything particularly beautiful in your YouTube link, but I do notice that every example you've given of lining numerals is from video game typography, which is hugely different from print typography. You may be right that in video games, monospaced lining figures are best, for a variety of reasons including comparison of different scores, as well as users' expectations of a certain figure style. However, how often do numbers with four or more digits appear in, say, a novel? In situations where it is imperative to quickly read many places of digits, such as math texts, you'll notice that monospaced lining figures are, in fact, the norm. (Whether this is actually beneficial, though, I'm not sure.)</p>
      <p>I don't agree that in the context of running text numbers should be clearly different from words. In this context, numbers <em>are</em> words. They are just a shorthand form for writing, for instance, "seventeen seventy-six" with only four characters.</p>
      <p>Your other point about making similar figures clearly distinct is actually helped by using oldstyle figures. You can't confuse a 9 and a 6 when one drops below the line and the other doesn't. Same with with a 3 and an 8. Oldstyle figures, I would conclude, are much easier to scan, and I've always thought it would be worth reviving them even in very math-heavy texts, if only as an experiment.</p>
