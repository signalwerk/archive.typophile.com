      <p>Even a date and time look ludicrous with proportional digits.</p>
      <p>2012-02-13 02:30</p>
      <p>For example, a bus schedule with proportional digits would look laughable.</p>
      <p>I have a feeling that the root of the problem is this: Most, if not all, of these typefaces were designed for print, and for contexts in which numerals would be used only sparingly. For contexts which use a great many numerals, monospaced digits might be more preferable. Contexts in which numerals are animated, such as a digital clock, or a real-time display of a stock market index, practically cry out for monospaced digits.</p>
      <p>Just as I can easily select "bold" or "italic" for a font, I would like to be able to select "monospace" for digits. For fonts with proportional digits, the last-resort implementation of this could be simply to expand the space around thinner digits to make all digits the same width as the widest digit.</p>
