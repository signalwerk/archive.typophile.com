    html: |-
      <p>Problem with that is, what if the whole reason the user wants it is either for use on screen or in PDF? They'd have no way of getting a preview of their actual usage.</p>
      <p>I strongly recommend embedding the "real font." If you're really worried about piracy from the PDF, subset it and leave out at least one or two important glyphs.</p>
      <p>Obviously we at Adobe are not very worried, as we make and post PDFs showing every glyph in each font we sell. I have no reason to believe that piracy via ripping fonts out of the PDF is a significant portion of all piracy of our fonts. If it were 10% or more, I'd start to be concerned about doing things differently. But I have no reason to think it's even 1%. It's just so much easier to get the "actual" font from pirate sources.</p>
      <p>Cheers,</p>
      <p>T</p>
