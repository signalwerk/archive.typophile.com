    html: |-
      <p><cite>If you embed a full font in a PDF, it will always be possible to extract it.</cite></p>
      <p>That necessarily doesn’t make piracy of embedded fonts especially relevant from a business standpoint. People who have nothing better to do than extract fonts from PDFs probably aren’t ever going to be customers. At best it prevents people from running programs that download every specimen on a foundry web site, extract the fonts, and create new-but-screwy-versions that get released as large collections. But people do that with flash type testers already.</p>
      <p><cite>How do you mean? A password to open the file?<br>
      That would defeat the purpose of downloadable PDF specimens, wouldn’t it?</cite></p>
      <p>PDF encryption can place different limits on a file. One can encrypt a file that can still be viewed and printed, but not viewed as plaintext, converted to postscript, printed to another PDF, or embedded in other files. Reading the Acrobat manual would be an excellent idea for people outputting PDF specimens.</p>
