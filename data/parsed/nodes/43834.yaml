  html: |-
    <p>Hi,</p>
    <p>I am very interested in how you genereally think when you are making those specimen PDF sheets.</p>
    <p>I've seen that many foundries include a full character sets in the PDF, and we all know it is possible to break out the font from that. On the other hand maybe it is worth the risk.</p>
    <p>I am pending between including all characters (for the buyers sake) to give people the possibility to see all characters and by that I think it is good for buying customers – OR to put up the full character sets on my webpage as pixelbuilt images. And by this let the PDF serve more as inspiration. The negative side of the later is of course that people cant zoom in on the characters etc and get a full picture of the whole font.</p>
    <p>How do you all approach this? Thanks in advance.</p>
