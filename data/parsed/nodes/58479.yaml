      <p>Adrian Frutiger’s <a class="freelinking-external" href="http://new.myfonts.com/fonts/linotype/westside/">Westside</a> is the most similar font I have found so far.</p>
      <p>Garry, in the future, please use an image instead of PDF, and please try to use a more descriptive title. It’s hard for us to find a thread with such a common title, if they all say the same thing. “IVOR the engine” would have been a great title, as an example.</p>
      <p>- Mike Yanega</p>
