    html: |-
      <p>Well Bert, use of a particular style of lettering in a Nazi propaganda film would seem to be the kiss of death for a font based on it, unless there was some way to de-Nazify the context. Before the mid 1940s some "jackboot" blackletters were widely used as an "alpine style" to advertise mountain resorts in North America.<br>
      Heavy metal rock bands, bikers, etc. love punchy blackletters. But I have no idea what would actually work as a marketing strategy to kick the Nazi elephant out of the room.<br>
      Don</p>
