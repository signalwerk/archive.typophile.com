    html: |-
      <p>Looks like Goudy’s work.<br>
      After doing some research I suspect this to be Pabst Roman done for ATF, not digitized.<br>
      Goudy later licensed Pabst Oldstyle to the Lanston Type Library.<br>
      <a href="http://www.myfonts.com/fonts/lanston/ltc-pabst-oldstyle/" title="http://www.myfonts.com/fonts/lanston/ltc-pabst-oldstyle/">http://www.myfonts.com/fonts/lanston/ltc-pabst-oldstyle/</a><br>
      <a href="http://www.p22.com/lanston/pabst.html" title="http://www.p22.com/lanston/pabst.html">http://www.p22.com/lanston/pabst.html</a></p>
