  html: "<p>hi everybody, <br> <br>my name is gustavo ferreira, 24, product &amp; graphic design student at the esdi, rio de janeiro, brazil. <br> <br>i discovered this typography forum a week ago, when i was searching for information on bitmap-fonts... and i found it fantastic, i always wanted to have this kind of space to discuss work still in progress... <br> <br>so, i'm finally placing something here: this font is called 'gentileza' and is inpired by writings of a wandering 'prophet' in some walls in rio. the prophet's name, gentileza, means kindness; all his messages were about living as brothers, loving one another a.s.o... <br> <br>the normal font is based on a photographic reproduction of one of his walls; the italics, on a sample of his hand-drawn lettering. the numbers, punctuation and some characters (k, w, y) were artificially generated with pieces of other letters. <br> <br>so, enough talking, here they are: <br> <br>normal <br><img src=\"http://www.typophile.com/forums/messages/29/1440.gif\" alt=\"gentileza.gif\"> <br> <br>italic <br><img src=\"http://www.typophile.com/forums/messages/29/1441.gif\" alt=\"gentileza-i.gif\"></p>"
  html_clean: "<p>hi everybody, <br> <br>my name is gustavo ferreira, 24, product &amp; graphic design student at the esdi, rio de janeiro, brazil. <br> <br>i discovered this typography forum a week ago, when i was searching for information on bitmap-fonts... and i found it fantastic, i always wanted to have this kind of space to discuss work still in progress... <br> <br>so, i'm finally placing something here: this font is called 'gentileza' and is inpired by writings of a wandering 'prophet' in some walls in rio. the prophet's name, gentileza, means kindness; all his messages were about living as brothers, loving one another a.s.o... <br> <br>the normal font is based on a photographic reproduction of one of his walls; the italics, on a sample of his hand-drawn lettering. the numbers, punctuation and some characters (k, w, y) were artificially generated with pieces of other letters. <br> <br>so, enough talking, here they are: <br> <br>normal <br><img src=\"http://www.typophile.com/forums/messages/29/1440.gif\" alt=\"gentileza.gif\"> <br> <br>italic <br><img src=\"http://www.typophile.com/forums/messages/29/1441.gif\" alt=\"gentileza-i.gif\"></p>"
