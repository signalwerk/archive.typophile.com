    html: <p>thanks for the comments... <br> <br>this post is just to complement the information i provided before about this font... <br> <br>as i said, this font is a tribute to the prophet gentileza, the old man shown on the picture below... <br> <br><img src="http://www.typophile.com/forums/messages/29/1501.jpg" alt="profeta-2.jpg"> <br> <br>he used to write his messages with a brush on the walls with in a certain color scheme, creating a style which became his mark.</p>
