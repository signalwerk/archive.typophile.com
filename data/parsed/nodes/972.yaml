    html: "<p>Hey I just LOOVE this alphabet! This is exactly the kind of typography that is currently seen as out of fashion? not very useful? not functional? in short: it's too human for its own baseline! <br>It's a pity that with so few responses to these fonts' posts, designers sometimes foolishly sway into the tricky realms of the \"hip\" (read pix or \"extreme\" fonts). <br>10000 thumbs up, you had to be from latinamerica, pal. <br> <br> <br> <br>Go and release this letters commercially right now (needs some tips? send me an email) and make some money for your good taste. <br>its an OOORRRDDEERR!!</p>"
