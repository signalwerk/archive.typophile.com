    html: <p>Older versions of flexisign (or casmate, depending on how far back you go) were unable to import .pdf's at all. The .ai files were tough, but still possible as long as everything was converted to curves (outlines). Newer versions such as 7.5 through the newest 8.6 can import and even convert to .pdf's with relative ease. I have found in my 15 years of sign work, that I tend to gravitate toward FlexiSign Pro 8.0 more that anything else. Occasionally, I use Corel to do autotraces and certain color fill operations, but immediately export the design to Flexi to do the real chopping and sewing. And as mentioned above, you can't send stuff to cut or print to actual sign-producing equipment without some kind of sign software. I had the Gerber Omega, but just as Microsoft builds things to work together, Gerber makes life difficult if you are trying to output to machines other than their own. Drivers are more thoroughly checked out in Flexi. I ditched Omega, Illustrator, AnaGraph, CAD, etc...Now I use Flexi and Corel in tandem and can pretty much do anything required very quickly, except activate or load fonts...Flexi still drags on that issue.</p>
