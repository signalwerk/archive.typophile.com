    html: <p>Flexisign is made by Beacon Graphics. It is a dedicated program for making signs. There are several variations, from fairly expensive to really expensive. It is possible to design signs with Illustrator, but additional software is required to send files to something like a vinyl cutter. Dedicated sign programs tend to have a lot of ready-made effects that might have to be done manually if done in Illustrator.</p>
