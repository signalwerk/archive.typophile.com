    html: |-
      <p>I used to work in a sign shop too. While you could do most of the design work in illustrator, FlexiSign does have precise numerical controls for giving things specific sizes and positions a bit more easily than the equivalent functions in Illustrator. Also the maximum document dimensions are much greater, allowing one to design in full scale for very large signs. </p>
      <p>The "Pro" version has the most complete array of drawing tools, while more limited versions only import designs from other programs like Illustrator and allow scaling and positioning and other very simple edits along with supplying the plotter/vinyl cutter drivers.</p>
