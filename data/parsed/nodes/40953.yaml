    <p>I have to recreate this logo for AMA supercross sponsored by Monster Energy Drink, so I need to know Monster Energy drink’s font for the worg ’energy’ as it’s the same one used in the sample.</p>
    <p>It is very close to both Eurostile and Bank Gothic. The R is similar to Bank Gothic, yet it is more rounded in nature to Eurostile Bold Extended... Help. </p>
    <p>I have been using both fonts to recreate, but as this is from the web it’s not looking so perfect. Can’t seem to get the curves just so...</p>
