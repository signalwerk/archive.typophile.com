    html: |-
      <p>yes, and through out the site all the headings seem to be bank gothic, it’s just this one that is different. </p>
      <p>I have been using a combination of eurostile bold extended for the s, c and o. Mainly because those letter are rounder than those same characters in bank gothic, the end of the s is of course different than the bank goth s and those letters look most like eurostile. </p>
      <p>It’s just not perfect, the roundness is not just right. Eurostile has a slightly fuller curve- but these are slightly tighter, but not as tight at bank gothic. I will keep playing with the letters and see how close I can get.</p>
