    html: <p>I think Mystique and Method are opposed. Formality impedes instinct. Just drawing your font takes care of all that "concept development" and "research" stuff (assuming you're not just reviving/remixing something that already exists). On the other hand, doing research into things like readability is useful as a foundation - that any many other things (like exposure to the work of others over time) implicitly guide your drawing anyway. <br> <br>hhp <br></p>
