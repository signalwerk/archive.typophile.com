    html: <p>Miguel, I would suppose a lot of that has to do with  <br>whether the face is being commissioned (as so many good  <br>ones are) or whether it's going to become a pet project of a  <br>"serious hobbyist" (as so many good ones are). <br> <br>Since your purpose is academic, I'd think you would benefit  <br>from focusing on the commissioned side, where a client  <br>would hand the designer/foundry a list of requirements  <br>and/or desired attributes and/or research. <br> <br>[Dang, those are two very fine run-ons. Look out Jon.]</p>
