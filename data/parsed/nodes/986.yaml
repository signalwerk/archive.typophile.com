  - id: 137228
    user: 1203
    date: 2003-08-21T13:43:00
    date_raw: 21.Aug.2003 1.43pm
    votes: null
    html: <p>Miguel <br> <br> <br> <br>In idle moments I more or less "write" letters with a soft (4B) flat sketch pencil. This is a habit of a lot of years of comping layouts in pencil. In the early days, a person developed a representative sans and a roman etc. that could be used in a layout, and substitiuted for almost any typeface that was decided on in the production process. <br> <br>I save all the doodles, and go through them from time to time to find out what I think will work as a type. <br> <br>The scale I work at mostly is about a 3/4 to 1 inch x-  height. Once I have cut in with a fine point to delineate the forms. <br> <br>People work in many different ways. Whatever it takes to get there is good if it works for you. <br> <br>Jim Rimmer <br> <br> <br> <br></p>
