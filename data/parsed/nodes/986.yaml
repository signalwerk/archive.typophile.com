    html: <p>New Typeface Design Thesis <br> <br>1. Objectives of the Project  <br>- Objective functional  <br>- Objective semantic  <br>- Objective communicational  <br> <br>2. Foundations  <br>- Personal Foundations  <br>- Environmental Foundations  <br> <br>3. Development <br> <br>3.1 Presentation and concept <br>- Introduction to the project  <br>- Conceptual Development  <br>- Presentation of external antecedents  <br>- Previous references <br> <br>3.2 References of Development and formal analysis  <br>- Methodology and processes to occupy  <br>- Analysis of the evolution of the project <br>- conceptual formal Analysis  <br>- detailed formal Analysis  <br>- Analysis and conclusions of tests <br> <br>3.3 Final process presentation <br>  <br>- To present/display the finished typography      <br>- To show particularitities that it has  <br>- To show to particularitities in its use  <br> <br>4.Conclusion <br> <br>5.Bibliography  <br> <br>6.Specimen <br> <br> <br>If anyone have other similar structure for a thesis please post it here or send it to me. I think this kind of information is very useful for a professional typeface project development process. Maybe those who make a typeface for a thesis can contribute here, or something who was study in a typography design school. <br> <br>MH.</p>
    html_clean: <p>New Typeface Design Thesis <br> <br>1. Objectives of the Project  <br>- Objective functional  <br>- Objective semantic  <br>- Objective communicational  <br> <br>2. Foundations  <br>- Personal Foundations  <br>- Environmental Foundations  <br> <br>3. Development <br> <br>3.1 Presentation and concept <br>- Introduction to the project  <br>- Conceptual Development  <br>- Presentation of external antecedents  <br>- Previous references <br> <br>3.2 References of Development and formal analysis  <br>- Methodology and processes to occupy  <br>- Analysis of the evolution of the project <br>- conceptual formal Analysis  <br>- detailed formal Analysis  <br>- Analysis and conclusions of tests <br> <br>3.3 Final process presentation <br>  <br>- To present/display the finished typography      <br>- To show particularitities that it has  <br>- To show to particularitities in its use  <br> <br>4.Conclusion <br> <br>5.Bibliography  <br> <br>6.Specimen <br> <br> <br>If anyone have other similar structure for a thesis please post it here or send it to me. I think this kind of information is very useful for a professional typeface project development process. Maybe those who make a typeface for a thesis can contribute here, or something who was study in a typography design school. <br> <br>MH.</p>
