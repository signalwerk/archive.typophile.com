  html: |-
    <p>Searching for methods to understand easily the process of typeface production for a good thesis, i found some stuff but i want to call to typophiles to your personal "Mystique" for creating good work from the beginning to the end. <br> <br>I mean you can have a good idea for a typeface design, but without a process... or thinking about contribute...with a thousand mediocre free fonts around here will be good to know the importance of the process behind a good typeface. <br> <br>I found a good Factory Tour of the House Industries in the Idea magazine from Japan on is number 281, page 73.  <br> <br>They are seven steps <br>&gt; Concept Development <br>&gt; Research <br>&gt; Planning <br>&gt; Layout <br>&gt; Work Development <br>&gt; Copyright <br>&gt; Final Production <br> <br>What do you think about this? <br> <br>MH. <br> <br> <br> </p>
    <div class="forum-topic-navigation clear-block"><a href="/node/1005" class="topic-previous" title="Go to previous forum topic">‹ Arabic in InDesign</a> <a href="/node/1014" class="topic-next" title="Go to next forum topic">Spray paint and a stencil ›</a></div>
