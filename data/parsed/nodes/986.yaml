    html: <p>I'm perhaps crazy, but I dont use that at all. I just open FontLab when I have five minutes between to others type jobs, or when watching TV on a good chair... and draw some new glyphs for a current typeface in dev. <br> <br>Then, couple months later, a new family is done. <br> <br> <br>If I think a bit more, all the process you describe happen in some way, but in quite destructured way, during my dreams for example. <br> <br>Anyway I need to stop now, I'm busy right now, I have a meeting with my dreams in couple of minutes, bonne nuit... :-) <br> <br></p>
