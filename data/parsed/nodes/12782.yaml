    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Caslon</strong></p>
    <p><a href="/wiki/William%20Caslon" class="freelinking" rel="nofollow">William Caslon</a>'s types of the early eighteenth-century were extremely popular then, and strongly revived in the late nineteenth century, producing many versions.</p>
    <p>Since the <a href="/wiki/Caslon%20Foundry" class="freelinking" rel="nofollow">Caslon Foundry</a> was in business for a long time, there are many<br>
    Caslon typefaces. Caslon's designs were markedly different at different sizes (for instance, some of his uppercase <strong>C</strong>s had serifs at top and bottom, some only at the top); variation in design is not therefore necessarily a sign of "inauthenticity".</p>
    <p>Caslon's type was popular in every sense. It was popular in the eighteenth century (until it was eased out by modern faces in the early 19th). When the fashion of "old face" revived in the 19th, many in England and America looked to Caslon's type as the model. And, at a time when lay people probably knew less about font-names than they do now, "Caslon" was a name quite a few people did know. George Bernard Shaw, for example, absolutely insisted that his work be set in Caslon.</p>
    <p>This vast popularity of Caslon’s types led to a practically endless range of copies, among them Caslon 540 from <a href="/wiki/ATF" class="freelinking" rel="nofollow">American Type Founders</a> in 1902, and Caslon 3, a slightly bolder face also from ATF in 1905, which was later modified for use on <a href="/wiki/Intertype" class="freelinking" rel="nofollow">Intertype</a> and <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> technologies. Both designs have the warm, solid, straightforward style that has made Caslon popular for over 200 years; these Caslons, however, have shorter descenders, and higher contrast, features that enable them to hold up better with the faster presses and the new varieties of paper<br>
    introduced at the turn-of-the-century.</p>
    <p>As with <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a>, there are not only typefaces which use the Caslon name, but typefaces which are Caslon-inspired. Of some importance historically is <a href="http://www.myfonts.com/fonts/agfa/imprint/" rel="nofollow">Imprint</a>, which was designed by (English) Monotype in 1913 for use in the (short-lived) <cite>Imprint</cite> journal. Because the journal was interested in the "improvement" of typography, it chose to release its typeface for general use. It took the "cleaning up" of Caslon's type for modern use a stage further, deliberately increasing x-height, reducing the notoriously loose fit of some of Caslon's type, and removing some of its archaic character.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://www.typophile.com/node/2816" rel="nofollow">Caslon's Caslon's Caslon</a><br>
    <a href="http://typophile.com/node/13420" rel="nofollow">The first assignment: Caslon</a><br>
    <a href="http://typophile.com/node/20893" rel="nofollow">A Caslon to Call Home</a><br>
    <a href="http://typophile.com/node/16884" rel="nofollow">Variation of stress between characters in Caslon</a><br>
    <a href="http://typophile.com/node/13886" rel="nofollow">Caslon Catalogue</a><br>
    <a href="http://typophile.com/node/48823" rel="nofollow">What is the Best Version of Caslon?</a></p>
