    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Caslon</strong></p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=William%20Caslon" title="Create node &quot;William Caslon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">William Caslon</a>’s types of the early eighteenth-century were extremely popular then, and strongly revived in the late nineteenth century, producing many&nbsp;versions.</p>
    <p>Since the <a href="/node/add/wiki?edit%5Btitle%5D=Caslon%20Foundry" title="Create node &quot;Caslon Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Caslon Foundry</a> was in business for a long time, there are many<br>
    Caslon typefaces. Caslon’s designs were markedly different at different sizes (for instance, some of his uppercase <strong>C</strong>s had serifs at top and bottom, some only at the top); variation in design is not therefore necessarily a sign of&nbsp;“inauthenticity”.</p>
    <p>Caslon’s type was popular in every sense. It was popular in the eighteenth century (until it was eased out by modern faces in the early 19th). When the fashion of “old face” revived in the 19th, many in England and America looked to Caslon’s type as the model. And, at a time when lay people probably knew less about font-names than they do now, “Caslon” was a name quite a few people did know. George Bernard Shaw, for example, absolutely insisted that his work be set in&nbsp;Caslon.</p>
    <p>This vast popularity of Caslon’s types led to a practically endless range of copies, among them Caslon 540 from <a href="/node/13554" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">American Type Founders</a> in 1902, and Caslon 3, a slightly bolder face also from <span class="caps">ATF</span> in 1905, which was later modified for use on <a href="/node/add/wiki?edit%5Btitle%5D=Intertype" title="Create node &quot;Intertype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Intertype</a> and <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> technologies. Both designs have the warm, solid, straightforward style that has made Caslon popular for over 200 years; these Caslons, however, have shorter descenders, and higher contrast, features that enable them to hold up better with the faster presses and the new varieties of paper<br>
    introduced at the&nbsp;turn-of-the-century.</p>
    <p>As with <a href="/node/12481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Garamond</a>, there are not only typefaces which use the Caslon name, but typefaces which are Caslon-inspired. Of some importance historically is <a href="http://www.myfonts.com/fonts/agfa/imprint/">Imprint</a>, which was designed by (English) Monotype in 1913 for use in the (short-lived) <cite>Imprint</cite> journal. Because the journal was interested in the “improvement” of typography, it chose to release its typeface for general use. It took the “cleaning up” of Caslon’s type for modern use a stage further, deliberately increasing x-height, reducing the notoriously loose fit of some of Caslon’s type, and removing some of its archaic&nbsp;character.</p>
    <p><strong>Discussion:</strong><br><a href="http://www.typophile.com/node/2816">Caslon’s Caslon’s Caslon</a><br><a href="http://typophile.com/node/13420">The first assignment: Caslon</a><br><a href="http://typophile.com/node/20893">A Caslon to Call Home</a><br><a href="http://typophile.com/node/16884">Variation of stress between characters in Caslon</a><br><a href="http://typophile.com/node/13886">Caslon Catalogue</a><br><a href="http://typophile.com/node/48823">What is the Best Version of&nbsp;Caslon?</a></p>
