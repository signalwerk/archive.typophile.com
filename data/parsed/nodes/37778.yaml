    <p>Hi all,</p>
    <p>I’ve been using the method here:</p>
    <p><a href="http://briem.ismennt.is/2/2.3.4a/2.3.4.34.curves.htm" title="http://briem.ismennt.is/2/2.3.4a/2.3.4.34.curves.htm">http://briem.ismennt.is/2/2.3.4a/2.3.4.34.curves.htm</a></p>
    <p>to adjust the shape of curves for italics fonts, which is a great help in most cases. It is stated here that this is one method of doing this and I was curious if anyone knows of any other methods to compensate the curve in Italic fonts.</p>
