    html: |-
      <p>Something about the drawings seems off to me. I would try things like letting the u baseline serif dip under the baseline on its left side, and adjusting the the n/r top so the V-shaped counter's left side is more like | or \ than /.</p>
      <p>By the way, you should make sure your bowls at their thickest are wider than your straight stems, in order to be optically balanced. (See how the vertical of d looks blacker than the left side of e?)</p>
