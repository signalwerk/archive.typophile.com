  html: |-
    <p>For a while I've been too scared to attempt anything other than a display font because text faces are a totally different kind of beast. Alas, working off of the open-ness of the Baskervilles I've looked at, I'm trying to design my first for-text typeface. It's intended to be used at around 9pt. So, to further demystify the inner workings and details that create a readable text face, can I get a crit on the lowercase glyphs I have so far?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/kosal_serif.gif" width="553" height="742" alt="">
