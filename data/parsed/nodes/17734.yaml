      <p>I like it too; light and clean.</p>
      <p>Sticking with the handmade idea, you might try actually hand-writing the type and vectorizing it; the feeling of individuality could come through stronger that way. It may be cliché by now but you could also play with the dots in zoz<strong>i</strong>e<strong>i</strong>khet<strong>.</strong>nl — they are often ignored but when attention is paid to them it's a nice touch.</p>
      <p>Nice work; I'm interested to see how it turns out.<br>
      Dan</p>
