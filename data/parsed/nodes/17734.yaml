      <p>I like the mark very much as well. Very clever. I do agree with others that you need to better communicate the idea of personalized response. </p>
      <p>Planet Propoganda once created a logo for Adams Outdoor Advertising (attached) where they combined the idea of an A and a billboard. To convey the idea of customization, they interchanged the imagery on the billboards. Hopefully this is inspring. I'm not suggesting you rip of Planet Propoganda's mark. </p>
      <p>I look forward to watching this evolve. </p>
