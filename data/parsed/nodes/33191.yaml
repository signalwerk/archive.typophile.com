    <p>Hello masters, </p>
    <p>I’m designing a little brochure in 2 colors : black and yellow.<br>
    the layout is really grid based, and FF DIN has been obvious since day 1.</p>
    <p>I really like the german look of DIN, but I feel it is a bit overused these days.<br>
    I would love to use a font slightly different. The same, but different (like coke/ pepsi).</p>
    <p>For a moment, I thought about modifying DIN, but I’m not skilled enough to touch such a beauty.</p>
    <p>I was wondering if one of you type experts could suggest a substitute for DIN.</p>
    <p>thanks in advance for anyhelp you could give.</p>
    <p>And thanks anyway for the amazing quality of the content of this website.</p>
    <p>Cheers,</p>
    <p>J.</p>
