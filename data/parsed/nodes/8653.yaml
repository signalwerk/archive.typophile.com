    html: <p>Joe, as far as I can tell (from deduction using InD and reviewing the way the manual reads), hyphenation is a paragraph level kind of setting unless you alter the hyphenation and spelling dictionary preferences. <br> <br>Help &gt; Working with text &gt; Working with hyphenation and spelling dictionaries <br> <br>Jon</p>
