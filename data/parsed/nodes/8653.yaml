    html: "<p>Hi Joe, <br> <br>Re. your \"global setting\": <br>1.Fire up InDesign and  <br>2. Don't have ANY documents open,  <br>3. then enter your type specifications (like style, optical kerning, color, and H&amp;J settings) in the Character and Paragraph palettes. These settings become the defaults for any future documents you create. <br> <br>My initial settings for the Hyphenation slider are: <br>Words longer than: 6 <br>After first: 3 <br>Before last: 3 <br>Hyphen limit: 3 (when I'm setting justified text, that is) <br>The Hyphenation Zone slider: I bump it 2 notches to the left (of center) towards \"better spacing\". <br> <br>For ragged text, I try to use no hyphens (or as few as possible). A main aim of using a ragged setting (as I understand it) is to maintain even spacing.  <br> <br>all the best, <br> <br>Kaisa</p>"
    html_clean: "<p>Hi Joe, <br> <br>Re. your \"global setting\": <br>1.Fire up InDesign and  <br>2. Don't have ANY documents open,  <br>3. then enter your type specifications (like style, optical kerning, color, and H&amp;J settings) in the Character and Paragraph palettes. These settings become the defaults for any future documents you create. <br> <br>My initial settings for the Hyphenation slider are: <br>Words longer than: 6 <br>After first: 3 <br>Before last: 3 <br>Hyphen limit: 3 (when I'm setting justified text, that is) <br>The Hyphenation Zone slider: I bump it 2 notches to the left (of center) towards \"better spacing\". <br> <br>For ragged text, I try to use no hyphens (or as few as possible). A main aim of using a ragged setting (as I understand it) is to maintain even spacing.  <br> <br>all the best, <br> <br>Kaisa</p>"
