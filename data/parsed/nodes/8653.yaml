    html: <p>Joe, in some industries you don't have a choice. The banking industry for one, doesn't allow hypenation of any kind. As for my taste I like hypenation as long as its in InDesign and i can hang the hypens. I thought the informal rule was never more than 3 hypens in a row. <br> <br>On a simular thought do you know about the on-line InDesign magazine being published through Creative Pro. Those writers would have a better perspective of the "rules". You can get a free copy at Creative Pro.</p>
