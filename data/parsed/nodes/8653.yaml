  html: <p>Here's mine, (below) but I'm wondering what others suggest or  <br>use regularly. I think I'd rather have an 'ugly' rag than a string of  <br>hyphens. But I want to see what others prefer. <br> <br>By the way, is there a global setting for hyphenation in InDesign?  <br>So far, I'm forced to do this manually for each document. <br> <br><img src="http://www.typophile.com/forums/messages/4100/62966.gif" alt="Indesign_Hyphenation"></p>
