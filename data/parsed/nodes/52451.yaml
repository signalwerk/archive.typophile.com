      <p>Paul, I don't know anything really about commercial silkscreening but I do know that hand silkscreening uses hideous chemicals and needs to be done in a very well-ventilated space, such as outside. That is about the sum total of my knowledge on the subject, sorry! Photo darkroom chemicals are not so great either. The photography teacher in my high school (who smoked in the darkroom, everyone did) died at 40 of lung cancer. Obviously the smoking didn't help, but I'm just sayin...</p>
      <p>I think your prejudice against digital prints - while understandable - is something you'll just need to get over. You see them in museums and galleries all the time now. It's just a different technique but as AGL (and I) said, it takes just as much skill to coax a beautiful print out of your inkjet printer than to screen it or print it in a darkroom.</p>
