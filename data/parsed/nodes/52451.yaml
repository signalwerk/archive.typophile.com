      <p>To me, buying a digital print is kind of like buying a poster or a bumper sticker. It's not the classiest presentation in the world, but it's a perfect way to display certain content. </p>
      <p>Also, as others have mentioned, the cost plays a significant role here too. Depending on what art we're talking about, I would guess that most of the market for digital prints is people who couldn't afford a comparable piece of original art (or a print using a more expensive process).</p>
