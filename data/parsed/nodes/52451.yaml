  html: "<p>i'm a big fan of <a href=\"http://www.etsy.com\" rel=\"nofollow\">etsy.com</a> for advocating the handmade aesthetic, but i'm always a bit perplexed at the sale of 'digital prints'. it seems like an easy way out to me, i mean, i want something with more of a tactile presence: screen printed at least. can anyone give me some good reasons at why i shouldn't be such a snob about printing process and help me make peace with purchasing mass-produced, completely computer generated art? (not completely, you know what i mean!)</p>"
