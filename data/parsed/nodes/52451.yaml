      <p>A digitally created image is as hand made as any other thing. After all it takes a lot of hand work at it. It can be output to canvas using a ink jet printer. Assuming it is really art and not a “giglé” out of a famous painting. You may be surprise at the quality.</p>
      <p>Digital is cheaper!</p>
      <p>You would never get the same feel as if it was printed with litographic stone or fancy copper or brass plates; those are awesomely expensive. Silkscreen can do a good job but also costs more then the ink jet.</p>
      <p>I suppose it is a budget question.</p>
