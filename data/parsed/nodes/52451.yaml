      <p>Paul, go do some screenprinting yourself, and see what a mess it is. ;)</p>
      <p>Emulsions, inks (although those are usually waterbased these days), sodium hydroxide/lye/caustic soda (whatever it's called) to clean the screens of ink, etc. Printing usually also wastes alot of paper (adjusting trapping, etc.) So in that sense inkjets are probably greener.</p>
      <p>On the other hand, inkjet printers have to be made, cartridges and ink have to be made and the plastics end up in the environment, etc. So all in all it probably doesn't really matter. ;)</p>
