    html: |-
      <p>I have mixed feelings about digital prints. There are some really incredible artists out there working in digital—even guys like Jim Dine—who produce stellar digital prints with the assistance of exceptional printers who work with great printers and materials. And I do like the unpretentious, no-art-world-bullshit nature of people running off unlimited editions for sale online, or selling limited editions at low-prices by cutting out the galleries.</p>
      <p>But some of these people just don’t know what they’re doing. Many of them don’t list the materials used to make the prints. Inkjet prints are a total crapshot; AFAIK only Epson is really trying to make good pigmented inks that won’t fade. Other inks might fade in only months, the chemicals in some inkjet papers can also do weird things over time. The worst prints are shot out of a laser printer on heavy office paper that will yellow and become brittle.</p>
      <p>So I guess you really just have to be a snob, do your homework, and ask questions before you buy.</p>
