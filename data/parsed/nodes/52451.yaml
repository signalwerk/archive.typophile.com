      <p>&gt; <em>but I do know that hand silkscreening uses hideous chemicals and needs to be done in a very well-ventilated space, such as outside.</em></p>
      <p>Yep, thats true. We have a rather well equipped screenprinting workshop at my art academy. So I occasionally do some printing there. The workshop is completely ventilated.<br>
      But it isn't as bad as it used to be; the only chemicals that are somewhat nasty are lye (to clean ink off screens), which is slightly corrosive, and some other solvents. So it's smart to wear goggles when applying lye and blasting the screen clean with a pressure washer afterwards. The photo emulsions and such are probably also not the most healthy substances, but they aren't particularly irritating. They do not sting on your skin or throat and such.</p>
      <p>But most inks are water based these days. Back in the day especially the inks were quite nasty. So you don't really need very strong solvents anymore. We only use those old inks for printing on surfaces that repel water, like highly reflective plastics or something like that.</p>
      <p>But if we're talking green... tons of paper towels, masking tape, testing paper for aligning the printing surface, leftover ink you can't keep for long, water, etc.</p>
