      <p>&gt; <em>Inkjet prints are a total crapshot; AFAIK only Epson is really trying to make good pigmented inks that won’t fade. Other inks might fade in only months, the chemicals in some inkjet papers can also do weird things over time.</em></p>
      <p>While this is somewhat true, there are -- and have been for quite some years -- UV-resistant inks available for pretty much every brand. Those are usually pretty longlasting.</p>
      <p>You can also cover prints with UV-blocking laminate. I have one huge inkjet print that I covered with such laminate (we could do that where I worked at the time) and it hasn't faded at all in 4 or 5 years. Although I must add that I remember that the laminate used was quite expensive, something like 80 euros per meter square. But it really makes the prints last long, and gives it a nice finish.</p>
