      <p>Maybe having a unique object is not so very important. If you are buying something from Etsy then surely ( the dominant aesthetic aside for 2 seconds ) the reason you are getting it is 1) you can afford it 2) you like it. Those are good reasons - surely. That may not be the fine art market uses, but it is the model used by the record collector. Is that so bad? </p>
      <p>But even as I say these things I admit that it is not very often that I look at something that came out of a digital device and think... "oh that's nice" from the point of view of it's "object" values. Eg the texture, weight, kind of color it has and so on. But if it was a nice big poster, or an illustration that I loved - I feel like I could be cool with it's digital-ness.</p>
