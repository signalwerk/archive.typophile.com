      <p>Andreas,</p>
      <p>Although the examples of German handwriting you referenced don't show the double-s form I posted, they do show the components of that form. And, yes, that form is similar to a script Thorn: the primary difference is that the stroke terminates inside the loop on the thorn, and outside the loop (turning it into a counter) with the double-s.</p><div class="imageWrap"><img src="http://typophile.com/files/suetterlin.gif"></div><p></p>
