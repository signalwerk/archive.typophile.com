    <p>I can never spell it right, but how would you make a script <a href="/wiki/eszett" class="freelinking" rel="nofollow">eszett</a>? would it just be a long s + a short s? any authorities on the subject, please post.<br>
    oh, and another, related question: is it kosher to make a beta-looking eszett? i mean, is it okay for there to be a kink in the middle? or should that all be smooth through there?</p>
