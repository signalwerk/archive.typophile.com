    date: 2006-01-19T09:57:00
    date_raw: 19 Jan 2006 — 9:57am
    votes: null
    html: <p>Sorry, Andreas, I don't think I still have the book because I found it of limited value. The kind of cursive writing taught in Germany around the time that my mother's mother was a schoolgirl in Garmisch-Partenkirchen (just before the turn of the twentieth century) has several character shapes which are radically different (hence, pretty unreadable) from English or American takes on the same letters. This fact probably explains why, in the past, I have found a number of otherwise beautifully lettered old German posters almost impossible to read when the lettering was cursive or Italic. However, I did notice the rather unusual -- and, in terms of economy of design, rather clever -- double-s, and that's why it ended up in my swipe file.</p>
    html_clean: <p>Sorry, Andreas, I don't think I still have the book because I found it of limited value. The kind of cursive writing taught in Germany around the time that my mother's mother was a schoolgirl in Garmisch-Partenkirchen (just before the turn of the twentieth century) has several character shapes which are radically different (hence, pretty unreadable) from English or American takes on the same letters. This fact probably explains why, in the past, I have found a number of otherwise beautifully lettered old German posters almost impossible to read when the lettering was cursive or Italic. However, I did notice the rather unusual -- and, in terms of economy of design, rather clever -- double-s, and that's why it ended up in my swipe file.</p>
