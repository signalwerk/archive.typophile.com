      <p>For fine scripts like English scripts, zapfino &amp; co please use longs + s. The round B forms are more suited for didone designs.</p>
      <p>P22 Cezanne ß looks ok<br>
      P22 Da Vinci ß looks ugly</p>
      <p>Traditional black letter designs use longs + z (round z) </p>
      <p>Everyone who needs to design a proper ß schould studie type faces made by well crafted German type designers. Or more correct, naitive German speakers. </p>
      <p>One very good article about the history of this letter is available by Herbert E. Brekle. But its German only. I think this article is worth to be translated into English.</p>
      <p><a href="http://www-nw.uni-regensburg.de/%7E.brh22505.indogerm.sprachlit.uni-regensburg.de/Ligatur/LIGATUR.HTM" title="http://www-nw.uni-regensburg.de/%7E.brh22505.indogerm.sprachlit.uni-regensburg.de/Ligatur/LIGATUR.HTM">http://www-nw.uni-regensburg.de/%7E.brh22505.indogerm.sprachlit.uni-rege...</a></p>
      <p>The new <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=3&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=abc+schrift&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=Schlo%C3%9Fsteg" target="_blank" rel="nofollow">ABC Schrift</a> from <a href="/wiki/Hans%20Eduard%20Meier" class="freelinking" rel="nofollow">Hans Eduard Meier</a> is a type face series for writing beginners. Since its really contemporary, have a look to the ß, its nice.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
