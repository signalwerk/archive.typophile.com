      <p>&gt; I am curious aboutthe “fz” form eszett, its history, and current use?</p>
      <p>The current use of the form is such that if you see a sign like this, you know it's Berlin. These forms are rather peculiar to Berlin street signage and are still used in that context, but I'd be cautious in designing the glyphs as default in the situation. </p>
      <p>A.</p>
