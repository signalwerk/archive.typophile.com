      <p>"... I am looking for a smallish number of shapes to present to students to harmonise with regular Latin letters..."<br>
      I think there are 4 useful goals; using either meaningful or unmeaningful signs, to blend with a given design or not to blend. We know that all the glyphs in your garden variety modern font layout are not aimed at just one of these goals, and we know that blending with text can be a term massively relative to many things. But, per style presented, as I think we all know deep down, there is one best strategy per goal, per glyph, and per beyond (into things like output method, display environment and audience). I tend to stress the whole ball of wax to make each detailed decision mean something, at least in the learning stage, as opposed to allowing "because I felt like it" to rule.</p>
      <p>"...I am not looking for shapes from which to create an unexisting alphabet..."<br>
      Then you'll never run out and need to make stuff totally up, or at least not until 2134 when every student will already know how to draw all of unicode and beyond. ;)</p>
      <p>"Alberobanana by Alessio Leonardi is [...] shapes are [...] based on [..] stylization of different objects"<br>
      I think this is a great exercise assuming the students already appreciate fairly deeply the object stylization leading to the signs they usually use, or you plan to teach them that next. A single workshop has got to be tough unless they're pretty advanced. </p>
      <p>Cheers!</p>
