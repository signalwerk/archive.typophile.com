    html: |-
      <p>"These will be used to examine strategies for harmonising arbitrary shapes into sets, in the same way that we harmonise different letters into typefaces." It's of course an interesting problem to give, compared to the class I've just given the low resolution san serif assignment to do.:)</p>
      <p>The way that we harmonise different letters into a typeface are aimed to render meaning to others via matter and energy with some sort of tone of voice. So, there is a harmonization strategy leading to Gutenburg, to 11 point Old Dreadful 301, another leading to Helvetica, and yet another very slightly different leading to 11 point 96 dpi Arial</p>
      <p>The wide range through abstract, pictoral, and alphabetic signs yields a long history of harmonization strategy improvement efforts, but they are mostly based on improvement to the speed, depth or breadth of meaning, (or better performance, quality and functionality), imparted to readers from letters. So, as you know, the best solutions usually start with a good specification.</p>
      <p>If you only give monoline for a spec. and the meaning is absent, this leaves meaningless spaces to adjust contained by properly contrasted lines, doesn't it? So, what strategy(s)? The assignment can look more or less like real text, (the tools ya know), but at the end of the day what's the advantage of knowing how to make meaningless marks when there're but 26 of the real thing to make?</p>
      <p>Cheers!</p>
