      <p>All of this is pretty wonderful...let's not forget Mayan and Egyptian hieroglyphs, Chinese characters, Naxi pictographs all of which emerged from this sort of abstraction of real objects.</p>
      <p>One can generate new shapes randomly by using analog methods: Examples: 1- In Japan girls have a game where they peel an apple into as long a length of skin as they can, then toss the skin into the air behind them. When it lands on the floor it is supposed to spell the (Latin) letter of the person they will marry - most often an S ! 2- The old game when the nose on a card is made up of a thin chain and if you shake it horizontally the nose takes on different shapes. 3- Divination by throwing bones and studying the shapes.</p>
      <p>For the purposes of the typographic study a number pieces of wire of different shapes connected or unconnected to short lengths of rope can be tossed to generate an infinite number of proto-glyphs.  A variation of this would be to toss a frame shape onto a large jumble of such objects on the floor, and the frame 'selects' the glyph by outlining the random shapes within.  Or simply use a frame to look around you (or on photographs) and pick out the outlines of objects - the outline of a tree branch meeting the straight side of a house would be one line of the glyph, for example.</p>
    html_clean: |-
