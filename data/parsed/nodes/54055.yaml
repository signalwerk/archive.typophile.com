  html: |-
    <p>I am working on materials for a lecture and workshop I am planning, involving shapes that could be letters but are not, in fact, part of commonly recognised alphabets. These will be used to examine strategies for harmonising arbitrary shapes into sets, in the same way that we harmonise different letters into typefaces.</p>
    <p>I have come up with some shapes myself, but I thought it would be interesting to invite Typophilers to contribute possible shapes. I can't promise to use them all, but if I use yours I will include your name in acknowledgements at the end of my lecture.</p>
    <p>I am looking for roughly monoline shapes. They will be given to students, who will have the job of drawing the shapes in ways that harmonise with various type styles and scripts. I will post some images of the results here, and the students' responses to the experience will be incorporated into the lecture. I may revise the submitted shapes slightly, if I think this will provide particular kinds of challenges for the students that will increase the value of the exercise.</p>
    <p>Images can be posted in this thread. Thanks in advance to anyone who chooses to participate.</p>
