      <p>David: <em>But, per style presented, as I think we all know deep down, there is one best strategy per goal, per glyph...</em></p>
      <p>I agree. But we're seldom obliged to think about and find ways to describe that strategy, or how the strategy for one glyph in a typeface relates to the strategy for another glyph, and because we're usually starting with familiar letters and a whole typographic history, would-be type designers can achieve a lot by referencing 'tried and true' strategies, even those only partially understood. So what I want to do is to present unfamiliar shapes, in part in order to get the students thinking about the strategies they use for the familiar ones.</p>
      <p>And, as I mentioned, one of the key deliverables of the exercise will be reflections on process, and if the students were all to come back and say 'This is a stupid workshop and I didn't learn anything', that would be a viable result.</p>
