      <p>David, Claudio,</p>
      <p>Perhaps I could have been clearer: I am <em>not</em> looking for shapes from which to create an unexisting alphabet. I am looking for a smallish number of shapes to present to students to harmonise with regular Latin letters in a variety of typeface styles. Some of the shapes will be similar to the construction of Latin letters, in which case the strategies for harmonisation are expected to be similar to those used within the existing typefaces, but some of the shapes will be more difficult to harmonise, demanding the kind of strategies that are used when trying to harmonise different scripts.</p>
      <p>As David notes, there are multiple strategies, and one of the deliverables for the workshop will be student reflections on process and strategies tested or employed.</p>
      <p>[I'm not interested in imposing rules on the contributions made by people to this thread, since I can pick and choose which shapes, if any, to use in my workshop.]</p>
