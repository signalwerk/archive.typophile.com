      <p>I have not read everything with attention, but I think David Berlow is quite right (if I understand correctly) in saying the specifications are too loose to obtain a set of forms which could compose an unexisting alphabet.<br>
      Besides the immediate advantage told by Hrant, if forms are too complex, without some shared thing, and done by various people without knowing what inspired the others', well you end up in a quite arbitrary collection, where many forms could have an excess of detail, while others have just a few strokes and so on…</p>
      <p>So, to get "scriptural", I would not enjoy drawing an arbitrary alphabet composed by some Kanji ideograms, a few Arabic or Georgian letters, and so on…</p>
      <p>If you are not in an excessive hurry, try to fix some rules, i.e.: no more than two closed forms in a glyph, a sort of "x-height" or something like that.</p>
      <p>Alberobanana by Alessio Leonardi is basically the same thing, but done by him as an exercise. The shapes are not arbitrary, but based on an invented stylization of different objects, i.e. a tree (Albero in Italian), instead of the usual "Alif/Alef/Aleph/A"…</p>
      <p>EDIT: Tomi, if you want to have a spec of Alberobanana, it's published in <a class="freelinking external" href="http://www.aiap.it/libreria.php?ID=78" rel="nofollow">Italic 1.0</a><br>
      Or maybe just send an email to <a class="freelinking external" href="http://www.alessio.de/" rel="nofollow">Alessio Leonardi</a> and ask if he sends you a PDF or something…<br>
      I'm sure he will reply…</p>
