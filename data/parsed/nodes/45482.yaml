    <p>I am interested in any comments praising or otherwise. </p>
    <p>This is an obviously faux old-book; complete with a faux marbling job done with screenprinting.</p>
    <p></p><div class="imageWrap"><img src="/files/detail_3600.sm.jpg"></div><p></p>
    <p>I designed this from afar and the good folks at Objective Press Canada published - well really - made this with their own hands. It uses P22’s - LTF Calson Pro Long.</p>
    <p>See more here:</p>
    <p><a href="http://www.flickr.com/photos/ebensorkin/2505088220/" title="http://www.flickr.com/photos/ebensorkin/2505088220/">http://www.flickr.com/photos/ebensorkin/2505088220/</a></p>
    <p>Antonella, thanks for the photos!</p>
