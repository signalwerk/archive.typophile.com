    <p>Hi guys,</p>
    <p>I am doing a Sketch Layout for a A5 size Literary Magazine. It supposed to be a lot of text with very little or none photography at all. The cover will be in colour but inside text and photographs will be black and white. I can only use an extra ink which i think it will be red but i not sure yet. The printing cost is quite a factor here since is a small writers club but with good focus on design. I would like to ask you if</p>
    <p>1 - Do you know of good samples in Literary Magazine to learn or get ideas from? the style will be mostly text and black and white with one extra ink in colour. I am studying grids and columns combinations as crazy. A5 is an interesting challenge for the size!</p>
    <p>2 - Just for the start I am using Minion Pro/ Gill Sans Light [8,5pt/11 pt leading] or Plantin/Helvetica [8pt/10,5 pt leading] as my started font set combination. It is a very classic magazine style approach, but do you know of other typographic combinations that you might like? There is a tight balance of good legibility in A5 size considering doing two columns with nice white areas and well proportioned margins. Sorry, a bit of Swiss Design School here.</p>
    <p>3 - Do you know of any good text generator which can do foreign languages? I became a bit bored of the regular Lorem Ipsum Text Generator. I discovered </p>
    <p><a href="http://loremipscream.com/" title="http://loremipscream.com/">http://loremipscream.com/</a></p>
    <p>which generate dummy text in other languages. Unfortunately it just gives you a simple paragraph. I found German suits well this literary style project. I don't know maybe because the long and mysterious words (not for a german speaker of course, he). </p>
    <p>Sorry for so many questions and thanks for any help or ideas.</p>
    <p>Cheers,<br>
    S</p>
