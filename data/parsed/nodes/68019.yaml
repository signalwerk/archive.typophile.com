      <p>I second Andreas suggestion. Andron is a very interesting typeface (you can test the regular weight for free).</p>
      <p>But I don't like the Minion/Gill Sans combo (or Andron/Gill Sans). You can consider to use just one font and work with its variations (small caps, italics, swashes, etc.) which usually goes very well for this kind of publication. Or adopt a more even sans, like Info Text, Officina, Tabula or Eva. Myriad/Frutiger also work well, but you may want to escape from the 'Adobian' combo Minion/Myriad.</p>
      <p>And to use real texts is always better than these 'lorem' demos.</p>
