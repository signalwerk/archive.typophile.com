    html: |-
      <p>This is probably modified by lengthening the upper left &amp; bottom right leg of /x.<br>
      If this is the case, <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Typodermic&amp;ffam=Ethnocentric%20-%20Regular&amp;fid=482de819aa9631d27141f3d998cace18&amp;fsize=60&amp;text=x&amp;fit=1" rel="nofollow">Ethnocentric</a></strong> by Ray Larabie [Typodermic, 1999] could be a good starting point [the regular &amp; italic weights are free].</p>
