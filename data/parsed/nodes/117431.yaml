  html: <p>Please can someone have a go at identifying this font from a single letter X. Someone has added some slits to it and I think it was originally solid. Any help or suggestions would be appreciated, thanks</p><div class="imageWrap"><img src="http://typophile.com/files/X_5725.jpg"></div><p></p>
