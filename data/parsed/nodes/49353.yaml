      <p>Nick’s right, it is an Art Nouveau style, but none of the “Nouveau” results at MyFonts matched it very well. P22’s <a class="freelinking-external" href="http://www.myfonts.com/fonts/ihof/p22-mucha/">Mucha</a> was similar, and TypeArt’s <a class="freelinking-external" href="http://www.myfonts.com/fonts/typeart/miracolo/">Miracolo</a> was another.</p>
      <p>- Mike Yanega</p>
