    votes: null
    html: |-
      <p>Sorry it's been so long since an update.<br>
      The mark was finished early March and here it is, for the record.<br>
      Shirts, buttons, business cards and other assorted items were made for handing out and sharing with friends and interested parties at SXSW2010 and was, from what we could tell, a mild success for a logo revision.</p>
      <p>In short:</p>
      <p># the points were softened and rounded.<br>
      # the entire shape rotated 5º to encourage the old scripty feel of brush (hopefully)<br>
      # the spur was dropped. too out there.<br>
      # the internal letters received a curvy arch treatment, hopefully subtle enough not to notice, but it changed, to be sure.<br>
      # the leg on the "r" was tweaked, once to be more geometric, but that wasn't sensible, either.<br>
      # the "B" now intersects itself, but other solutions didn't work as well. our self-imposed deadline nixed any more changes on it.<br>
      # "LABEL" was dropped, despite it being a large part of the identity, considering my packaging background, it narrowed the identity to that alone and was confusing in other usages. Label is still part of the company name, though (which is probably confusing).</p>
      <p>Comments are still very welcome and appreciated. Thanks everyone.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/butter-logo-brown_6029.png"></div><p></p>
