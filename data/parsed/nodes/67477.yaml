    <p>Okay, so I'm revamping this logo a bit and would love some assistance in creating a logo that has a bit more of a properly swashing capital letter "B".<br>
    It's all in illustrator and was began from scratch in 2007.<br>
    There it sat, finished enough for production.<br>
    Yesterday i figured it needed updating.<br>
    I've enjoyed the changes so far, but the initial swash on the B is bugging me.</p>
    <p>If you have any tips on getting it right, ANY comments would be appreciated.<br>
    (I've used minimal bezier points forever, so that is my underlying style. Extra points dirty up the curves in my humble opinion.)</p>
    <p>Initial design: 2007<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/butter-before_4999.PNG"></div><p></p>
    <p>Idea going forward (not sold on the HIGH-water "B":<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/butter-idea_6318.PNG"></div><p></p>
    <p>Compared:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/butter-comp_3677.PNG"></div><p></p>
    <p>Thanks,<br>
    Luke</p>
