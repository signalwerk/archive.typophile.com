    html: |-
      <p>"the basics of type in a super dumbed down way"</p>
      <p>I think you succeeded in doing that — but who is your target audience supposed to be? Are the people whom you want to read your site likely to want things presented in a dumbed down way?</p>
      <p>I think there's a fine line between simple, laid back, and easily understood vs. patronizing. I'd be wary which side of the line you fall on — it's always good to be funny, but being "fun" in the way you're being might suggest "childish" or an attitude of talking down.</p>
      <p>As an exercise, it's well done.</p>
