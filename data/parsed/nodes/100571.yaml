    html: <p>I was referring to the thumbnails - quite honestly I didn't even realize they could be clicked on! However, my comment on the alignment examples still holds. They aren't sufficiently ragged to be noticeable. Similarly, the rivers aren't wide enough or long enough to be really disturbing (even if they're quite realistic). Pedagogically, exaggeration can be more effective than subtlety.</p>
