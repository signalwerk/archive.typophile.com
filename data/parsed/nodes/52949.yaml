    <p>I may be a bit misleading in the subject but Robert Bringhurst and David Blatner have mentioned it their books about setting H1, H2, Body etc so they share the same baseline without having to set to baselne, okay not so well explained but will try again</p>
    <p>If I set the H1 to be 18/10 H2 12/16 and Body as 10/18 that is should share the same baseline or be lining up when I have columns of text, its just that I dont have my books with me to check this out and know that both those books explain how to do it so they line up with having to set in indesign align to basegrid etc.</p>
    <p>Did I kinda make sense or you know what Im trying to say?<br>
    All critique welcome! ›</p>
