    html: |-
      <p>Achieving true shared baselines is very hard. You can never be sure which typefaces are used to display a webpage &amp; most browsers use the top offset of a font to render type, and not the baseline like most page design programs. The different x-heights mess up sharing baselines.</p>
      <p>Alistapart published an informative article about this:</p>
      <p><a href="http://www.alistapart.com/articles/settingtypeontheweb" title="http://www.alistapart.com/articles/settingtypeontheweb">http://www.alistapart.com/articles/settingtypeontheweb</a></p>
      <p>Rob Goodlatte built a small bookmarklet to help check whether you are on the right track:</p>
      <p><a href="http://robgoodlatte.com/2007/07/31/syncotype-your-baselines/" title="http://robgoodlatte.com/2007/07/31/syncotype-your-baselines/">http://robgoodlatte.com/2007/07/31/syncotype-your-baselines/</a></p>
      <p>Hope this helps.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
