    html: "<p>Yup, these all look like auto-traces of real fonts, with the usual weak pun names. \"Alps\" is an especially bad Helvetica, with the traps of the \"M\" filled in, and a rather ugly \"a\". <br> <br>It's too bad they didn't rip off a Centaur, because it would have gone well with my \"Digitization quality\" comparison in another thread, for comic relief if nothing else. <br> <br>Another very unappealing feature of the collection is the abundance of \"Thin\" and \"Wide\" variants, which are, of course, Smooshed�. <br> <br>My review: just another collection of hundreds of cheap TT fonts, now with OpenType�! Save your money.</p>"
