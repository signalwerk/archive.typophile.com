    html: "<p>Hi, Hrant — <br><br>No need to apologize, sir.  <br><br>I apologize to the group, certainly, if it was too adlike. It wasn’t meant to be addy and I did consider it carefully, trying to limit word length and trying to keep it non-commercial.  <br><br>Thanks for checking me on it. <br><br>By the way: One great byproduct of the thread for me was the surprise of a letter from Mr Giampa. After not talking with him for probably a decade or more (for no particular reason), I was very happy to hear that he’s well and still tirelessly devoted to keeping the Lanston collection vibrant as ever.  <br><br>A tip of the Aring to him for his long term devotion to quality! Congratulations, Gerald. <br><br>I plan to head back to his site now for a longer look. What I saw of it earlier today was a genuine visual treat. <br><br>Joe <br></p>"
