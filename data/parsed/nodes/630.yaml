    date_raw: 20 July 2003 - 9:49pm
    votes: 0
    html: '<p>Hi, again — <br><br>Thanks very much.  <br><br>I’m currently still reeling from all the interesting info and photos on Mr Giampa’s site. (I just returned from the virtual <span class="caps">PEI</span> tour. Wish I had packed the virtual <span class="caps">DEET</span>. Virtual <span class="caps">OUCH</span>! Those mosquitoes!) <br><br>The Optical Size discussion you note is surely interesting, yet I think that Mr Hudson has said everything that needs saying, in a way. I agree with his overall perspective on it, as written. <br><br>An aside: I mourn the passing of Multiple Masters from a technological point of view, but I’ve always imagined that it created endless gymnastics for the designers who worked to shoehorn their designs into it. Along the lines of all the ‘regularization’ technique discussions that used to take place in the late ’80s and early ’90s, for deﬁning seemingly ideal PostScript fonts. <br><br>Take care. <br><br>Joe <br></p>'
    html_clean: '<p>Hi, again — <br><br>Thanks very much.  <br><br>I’m currently still reeling from all the interesting info and photos on Mr Giampa’s site. (I just returned from the virtual <span class="caps">PEI</span> tour. Wish I had packed the virtual <span class="caps">DEET</span>. Virtual <span class="caps">OUCH</span>! Those mosquitoes!) <br><br>The Optical Size discussion you note is surely interesting, yet I think that Mr Hudson has said everything that needs saying, in a way. I agree with his overall perspective on it, as written. <br><br>An aside: I mourn the passing of Multiple Masters from a technological point of view, but I’ve always imagined that it created endless gymnastics for the designers who worked to shoehorn their designs into it. Along the lines of all the ‘regularization’ technique discussions that used to take place in the late ’80s and early ’90s, for deﬁning seemingly ideal PostScript fonts. <br><br>Take care. <br><br>Joe <br></p>'
