    html: '<p>My studio, Treacyfaces, is continually busy. So, I don’t get the luxury of hanging out here as much as I would like. I’ve just noticed the above post. <br><br>In the current iteration of our treacyfaces.com (up now for about a year), one can get pretty much anywhere — especially to all crucial services — in one click.  <br><br>I believe that’s called ideal convenience. <br><br>Indeed, we sell a lot of fonts via the site, and complaints probably amount to 1 in 5000 unique accesses. (You can’t be all things to all people.)  <br><br>Yet, we’re bookmarked constantly. We’re returned to constantly. We’re purchased from constantly.  <br><br>This year, our 19th in the type business, has already become our biggest sales year yet. <br><br>We have always designed treacyfaces.com to be accessible to the greatest number of people possible. <br><br>Unlike some sites, we choose not to shut out or frustrate some users by forcing browser or plug-in upgrades right at the entry. I want a happy prospect coming through the door, not one or one who feels frustrated or shunned. <br><br>About the <span class="caps">TFA</span>rrow inquiry above and what came of it: <br><br>The inquirer asked good questions by e-mail.  <br><br>As is typical for us, they were promptly provided well delineated buying information plus supplemental customized specimens to base a knowledgeable license purchase on.  <br><br>With personal service, we also ensured that the font/weight combination was an exact match. <br><br>The inquirer’s company promptly purchased the license they needed. <br><br>Looking back at the transaction details, I believe that the customer received our typically excellent brand of customer service, receiving their license materials promptly.  <br><br>There have been no customer complaints from that buyer, nor from any of our world wide customers who purchased via treacyfaces.com last week. <br><br>For instance, here’s one from Australasia who ordered a 4-weight volume this week using treacyfaces.com’s quick, one-page online order form:  <br><br>“Thank you for your great service. Very quick and easy with the personal touch! I will not hesitate to use your service again.” <br><br>This is actually the kind of enthusiasm we are greeted with continually. Of course, I thank our customers for it. <br><br></p>'
