    html: <p>Dear Joe, <br> <br>I am most embarrassed. My site is in the middle of a serious format change. Hopefully it has not caused you problems, or concerns that I had lost my touch. I am certainly very flattered. A compliment from someone I hold in such high regard means alot to an old man like myself. <br> <br>You are a gentleman to be sure. <br> <br>Perhaps I am a little out of date? Everyone else seems to have a site that reminds me of sitting in a jet plane. I am still on a horse and buggy. <br> <br>But I sometimes get a good view of things. <br> <br>Unfortunately not as good as I wish or I could make my web site work like yours. <br> <br>I am very interested in your work. Jim Rimmer and I, by the way, are fans of yours. Take that for a compliment! <br> <br>Gerald Giampa <br>Lanston Type Company. <br> <br></p>
