      <p>Actually I think the opposite would be true - large companies such as GE and BP would be more likely to have their desktops controlled, administered and locked down to prevent unauthorized software from being loaded. They'll also have corporate typefaces used for communications, limiting the need for employees to have a large number of unlicensed fonts.</p>
      <p>As for the piracy angle I think there are two distinct groups of potential offenders. There are the collectors who just want to have as many fonts as they can, much like the neighbor who hoards cats. And then there’s the guy who ‘needs’ a font for a project and will ask around, search the web etc., to locate it. As Bruno said at TypeCon the goal of Font Explorer X is to make it easier and cheaper for that type of user to license a font than find a pirate copy. This is going to be hard. I’ve had various end-user email me over the years saying “I’ve just spent the last five hours searching for a free version of font X” – essentially putting the value of their time at 4 bucks an hour. :-(</p>
