    html: |-
      <p>"Corporate" is responsible, indirectly, for many small design firms pirating fonts.<br>
      It's like, if you have to do some work for a corporation, and they use Meta or whatever, and you don't have it, a friend will help you out.</p>
      <p>I've found that large corporations are very responsible about their own software licensing, including fonts. They have IT people who don't want issues, and that includes piracy, conflicts, bad fonts, etc. Quite apart from ethics, playing it straight makes practical sense, you can get immediate foundry support if you have a problem, without having to worry whether you have a licence for the font in question.</p>
      <p>It's easy for a freelance designer to acquire all the fonts from where they're working. Do people do that?</p>
