    <p>Although I am aware of the fact that their is widespread piracy of type in the design community, I'm somewhat perplexed on how and who exactly it's done. Is the majority of font piracy done between people who know each other, or anonymously through the internet, or what? And is participation in it limited to students and hobbyists, or do professional designers themselves take part in it? And finally, what venue does the majority of piracy take place through (traditional websites/peer-to-peer networks/ect)?</p>
    <p>Just curious, I hope you guys could clarify the whole situation to me!</p>
