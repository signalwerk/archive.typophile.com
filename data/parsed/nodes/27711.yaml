      <p>I would assume that many designers use a lot of pirated fonts when they start out, simply because they can't afford to pay thousands of dollars  for fonts and have small clients who don't want to pay for them either. For instance, how many graphic design students do you think really own all the (hundreds of) fonts they use at their home computers?</p>
      <p>I think most people gradually drop the practice as they become more established and start to work for larger clients. For a really well known designer doing very visible work for an established firm it would be stupid to use unlicenced fonts, as well as unethical.</p>
      <p>However, I am aware of people who illegally copy fonts to use when they try out alternatives for a design. When the customer accepts something, they'll buy the font. Personally I can't see anything much wrong with this approach, since it helps designers without hurting foundries in any obvious way.</p>
