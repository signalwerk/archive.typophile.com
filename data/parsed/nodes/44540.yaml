      <p>Thomas hit on the most important consideration. Ultimately a UI font get crunched down to a bitmap that shows up on screen. How the outlines get rasterized vary significantly from platform to platform. Some of the common rendering engines are: ClearType (Windows), Freetype (lots of stuff uses this, including Linux and FontLab), Quartz (OS X), iType (Monotype) and Adobe uses custom engines for may of their apps. Different Adobe apps use different renderers; Photoshop, Fireworks and Flash even allow users to tweak with the parameters of the renderer.</p>
      <p>There is a hearty debate about type rendering engines here: <a class="freelinking external" href="http://typophile.com/node/34393" rel="nofollow">http://typophile.com/node/34393</a>.</p>
      <p>Some other points that come to mind: </p>
      <ul>
      <li>UI fonts rarely use italic, or even bold for that matter.</li>
      <li>UI fonts really need to get out of the way. If they are too much they can distract from the task at hand. (Obviously there are exceptions here: if we are talking about a UI font for a Barbie fashion game, the considerations are completely different, of course.) For a good example of a UI font that has some unique character check out the <a class="freelinking external" href="http://www.ascendercorp.com/pr/pr2005_10_18.html" rel="nofollow">XBox UI font</a> by Steve Matteson of Ascender Corp.</li>
      <li>UI fonts are almost always sans serif (for now).</li>
      <li>UI fonts often use extensive hinting tuned to the specific rendering engine, or even the specific display device.</li>
      <li>May devices don't support outline (TrueType or Postscript) types. There are probably thousands of bitmap type rendering engines, as may app and device manufacturers create their own engines. They all work pretty much the same way, though.</li>
      </ul>
