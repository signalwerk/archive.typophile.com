      <p>Foremost, like any good typeface, they are designed for the specific use and application where they will be deployed. In other words, good screen-based UI fonts were not originally designed for wood, metal or for a linotype machine decades ago. </p>
      <p>Second is that they are designed by designers. How many fonts in use in the handheld device industry were designed by engineers? I've been very encouraged by how much custom type is being commissioned by device manufacturers, game companies, console makers, etc. I'm sure Sii could comment here. </p>
      <p>Step magazine approached us last year about this topic for an article. Jared Benson shared some insights specific to mobile devices that may be worth reviewing. The irony with this link is that the article looked much better in print. <a href="http://www.stepinsidedesign.com/STEP/Article/28766" title="http://www.stepinsidedesign.com/STEP/Article/28766">http://www.stepinsidedesign.com/STEP/Article/28766</a></p>
