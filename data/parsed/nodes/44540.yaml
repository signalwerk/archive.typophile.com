      <p>You can't look at a printed font and know it will be a good UI font - but in some cases you can know it won't be! The goodness of a UI font has to do with it's ability - often with the help of programmed "hints" to render cleanly from 6 7 or 8 pixels to maybe 18-30 pts. Sometimes the range is more narrow like 8-18 pt. You do need special tools and you need to learn about different operating systems and how they render fonts. If you are working on the Ui for one device then you just need to know about it's rendering model. </p>
      <p><cite> Um... what sort of UI? </cite></p>
      <p>Exactly. A good UI font is often tied closely to it's device/OS.</p>
