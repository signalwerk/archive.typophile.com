    <p>Hi,</p>
    <p>I thought I posted this but I don't see it in the forum. I built this page for a client and used Georgia font for the profiles and Arial font for the rest of the page.<br>
    <a href="http://medicaid-los-angeles.medicaidconsultants.com/" title="http://medicaid-los-angeles.medicaidconsultants.com/">http://medicaid-los-angeles.medicaidconsultants.com/</a></p>
    <p>I'm wondering if someone can suggest a complementary font to the Arial for this page.</p>
    <p>I'm also wondering if there is a site that shows complementary fonts similar to a complementary colour chart.</p>
    <p>Thank you,<br>
    Victor</p>
