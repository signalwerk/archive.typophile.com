    html: <p>So, what you want to do is to make a DUMMY, which is simple enough. Simply go <a href="http://www.myfonts.com/fonts/spiecegraphics/quaint-gothic-sg/regular/" target="_blank" rel="nofollow">here</a>, and type your copy into the type tester. You can then save the image or print the screen, and insert that image, properly cropped, into your presentation. Yes, the image will be only 72 or 96 dpi (depending on your OS), but you can advise your potential client that it is "for position and general look" only. If/when you get the job...BUY the font (or another version thereof).</p>
