    html: |-
      <p>Misa - The original, predigital Quaint Gothic (AKA Desdemona Solid) didn't have a lowercase. Jim Spiece created those characters himself. So, you aren't going to find another version like that.</p>
      <p>Nick's idea sounds good, no.</p>
      <p>The only thing kind of close that comes to mind still isn't free, but it's cheaper. That would be Ray Larabie's revival from roughly the same period, <a href="http://www.myfonts.com/fonts/typodermic/silentina/" target="_blank" rel="nofollow">Silentina</a>.</p>
