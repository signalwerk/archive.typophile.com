    <p>I don't know if anyone else has this problem, but every time I get to designing an /x/ or /X/, I wonder "am I doing this correctly?". After 3-4 year of doing type design work, I still can't seem to figure out the correct approach to optically correcting an /X/! It is also frustrating because on just about every other glyph, I can see the problem areas, but for the /X/ I can't ever seem to tell what I need to do...</p>
    <p>It seems a bit easier on a sans, but i've referenced some serif and slab serifs and cannot seem to figure out how the designer got to the final thing (alignment of the points on the central joint, all the serifs are a bit different size...).</p>
    <p>Does anyone have any tips on how they approach the /X/, or maybe links to previous posts about this (I had a lot of trouble searching for a single letter on the forum).</p>
    <p>Thanks!</p>
