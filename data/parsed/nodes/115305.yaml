      <p>1. Draw it uncompensated, with the strokes crossing each other.<br>
      2. Cut the thinner stroke at the center of the intersection.<br>
      3. Lower the inner end of the upper piece and raise the inner end of the lower piece equally and incrementally until the optical illusion is gone and the thinner stoke looks like it shoots straight through.<br>
      4. At some point remove overlaps.</p>
      <p>Of course, there are other ways to do it (you could create four nodes on the thin stroke within the intersection to make a parallelogram, and then skew those, for example).</p>
