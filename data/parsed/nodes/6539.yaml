    html: <p>Huh. Well, I regenerated the font two different ways from FontLab 4.6.0 (Win). Once with hinting, and once with hinting suppressed. NEITHER version shows the problem. The developer says the TT was originally generated from FontLab in the first place, so color me confused. <br> <br>Seeing as it's not a problem specific to our rendering, it's easily fixable, and how it got messed up is not obvious, I'm giving up on this one for now. <br> <br>Cheers, <br> <br>T</p>
