  html: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;I really could use some help -- I'm having problems with a font I bought earlier today, and I've run out of ideas. <br> <br>The font is <a href=\"http://www.myfonts.com/fonts/aboutype/wade-vernacular/\">Wade Vernacular</a>. It comes as a set of  four versions (solid, shadowed, shaded, outline). I bought it as Windows TT, even though what I really needed it for was a project I'm doing on my Mac (the fabled zine), because Win TT is supposed to work under OSX, and I haven't had any problems doing that in the past, and I wanted to be able to use it on my Windows computer (e.g. it has a better printer). <br> <br>Three of the four versions are working just fine (solid, shadowed, shaded). The fourth, Wade V. Outline, is doing some really bizarre stuff in my Adobe programs. It works fine in everything except InDesign, Illustrator, and Photoshop. This is what it looks like: <br><img src=\"http://www.typophile.com/forums/messages/4101/48254.gif\" alt=\"Outline big\"> <br>This is what is should look like: <br><img src=\"http://www.typophile.com/forums/messages/4101/48255.gif\" alt=\"Outline textedit\"> <br>For comparison, the other versions, which look fine: <br><img src=\"http://www.typophile.com/forums/messages/4101/48256.gif\" alt=\"Solidshaded\"> <br> <br>Even more bizarre than the first image shows, the distortions change as you change the point size. For example: <br><img src=\"http://www.typophile.com/forums/messages/4101/48257.gif\" alt=\"Hs\"> <br> <br>I've tried resinstalling, converting the problem font from Win TT to Mac TT with a Mac program (TTConverter), with a PC program (CrossFont), and rebooting, with no luck. And this version (outline) was most of the reason I bought this font instead of some other slab serif. <br> <br>Anyone seen anything like this before?&lt;/font&gt;</p>"
  html_clean: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;I really could use some help -- I'm having problems with a font I bought earlier today, and I've run out of ideas. <br> <br>The font is <a href=\"http://www.myfonts.com/fonts/aboutype/wade-vernacular/\" class=\"link-external\">Wade Vernacular</a>. It comes as a set of  four versions (solid, shadowed, shaded, outline). I bought it as Windows TT, even though what I really needed it for was a project I'm doing on my Mac (the fabled zine), because Win TT is supposed to work under OSX, and I haven't had any problems doing that in the past, and I wanted to be able to use it on my Windows computer (e.g. it has a better printer). <br> <br>Three of the four versions are working just fine (solid, shadowed, shaded). The fourth, Wade V. Outline, is doing some really bizarre stuff in my Adobe programs. It works fine in everything except InDesign, Illustrator, and Photoshop. This is what it looks like: <br><img src=\"http://www.typophile.com/forums/messages/4101/48254.gif\" alt=\"Outline big\"> <br>This is what is should look like: <br><img src=\"http://www.typophile.com/forums/messages/4101/48255.gif\" alt=\"Outline textedit\"> <br>For comparison, the other versions, which look fine: <br><img src=\"http://www.typophile.com/forums/messages/4101/48256.gif\" alt=\"Solidshaded\"> <br> <br>Even more bizarre than the first image shows, the distortions change as you change the point size. For example: <br><img src=\"http://www.typophile.com/forums/messages/4101/48257.gif\" alt=\"Hs\"> <br> <br>I've tried resinstalling, converting the problem font from Win TT to Mac TT with a Mac program (TTConverter), with a PC program (CrossFont), and rebooting, with no luck. And this version (outline) was most of the reason I bought this font instead of some other slab serif. <br> <br>Anyone seen anything like this before?&lt;/font&gt;</p>"
