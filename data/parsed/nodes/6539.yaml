    html: <p>The designer was kind enough to send me a copy of the font, and I couldn't find anything wrong with it (other than the exclamation mark being in the slot for the space character, but that's another issue). Path winding order looks good. There are a few unnecessary control points, but nothing terrifying. <br> <br>My best guess is that FontLab's TT auto-hinting is messing things up a bit. I would hardly even blame it; an outline this complex is *really* poorly suited to TT auto-hinting. But who'd want to manually hint something like this, either? If I needed a TT version, I'd be tempted to leave it completely unhinted. But that's just me. <br> <br>Regards, <br> <br>T</p>
