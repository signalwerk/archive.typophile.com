    date: 2003-04-24T13:14:00
    date_raw: 24 Apr 2003 — 1:14pm
    votes: null
    html: <p>Hmm. It was supposed to be an alternative to written script, I think modelled somehow on the mind of a child (or something like that). And the fact that ISOTYPE means International System of Typographic Picture Education leads me to believe that it was supposed to cross linguistic and cultural boundaries. </p>
  - id: 263
    user: 1352
    date: 2003-04-24T15:46:00
    date_raw: 24 Apr 2003 — 3:46pm
    votes: null
    html: <p>Ok, that's enough messing around. <br> <br>These graphics were originally created for the 'Viennese Museum for Society and Economy', which bagan life in 1924. Neurath wanted to make complex social and economic information comprehensible for the man and woman in the street with no prior knowledge of that sort of thing. So him and his missus and Mr. Anrtz worked their respective backsides off for years and years and years so that they could fill a room with little pictures of men and women in Reading. <br> <br>How's that?</p>
