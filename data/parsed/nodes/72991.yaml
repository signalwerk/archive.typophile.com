      <p>Well, it looks to me like you've already made a distinctly original departure from the inspiration, whose top and bottom curves appear to be plain half-circles. So I'd suggest you do whatever helps make the most of what you've created.</p>
      <p>Also, these optical adjustments can be very subtle, and it bears asking the rhetorical question of what makes you so sure they aren't in the original. They can easily be lost in the perspective of a photograph.</p>
