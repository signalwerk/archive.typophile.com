      <p>Looking really good. Get ready for more picking.</p>
      <p>The diagonal of N is severely heavy. The diagonal of Z is tapering from one width to another. The vertical of P is thin, probably an accident.</p>
      <p>Now the tough stuff. The upper right corner of B,P,R is lumpy (i.e. its curves aren't matching up). The inside curve is formed well, while the outside curve starts sloping down too early and then bulges out.</p>
      <p>The S appears to be leaning to the right; I suggest nudging the top half to the left a tiny bit so it sits centered, and then working on the middle curves more.</p>
      <p>I think it's a good idea that you're holding onto the version with apparent reversed stress. It seems like the sort of face that people might <em>like</em> to use for setting sideways, and having a separate version optimized for that would be a neat selling point.</p>
