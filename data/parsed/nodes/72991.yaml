      <p>There's no single right answer to the question of keeping irregularities. It depends on what you're trying to achieve. How do you want the typeface to be used? Often you may have to trade off authenticity against utility/versatility. The relationship is usually non-linear. You may want to maximize the sum, or you may find one more valuable than the other.</p>
      <p>For reference, see the page here:<br>
      <a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html" title="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html">http://www.adobe.com/type/browser/landing/hypatia/hypatia.html</a></p>
      <p>Note the "flavor vs utility" graph. Same idea here with authenticity vs utility/versatility, IMO. But depending on what you're after, you may value one more than the other, in which case the ideal balance would be different (but still quite likely not right at either extreme, IMO).</p>
      <p>Regards,</p>
      <p>T</p>
