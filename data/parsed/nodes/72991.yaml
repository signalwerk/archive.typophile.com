      <p>The J would fit the style better if it turned up to a flat terminal like C and S. Tail of Q could use some weight. Otherwise, everything looks pretty good at this distance. A valid critique of weight and curvature would require a vector pdf for a closer look.</p>
      <p>It looks a little to me like you haven't compensated for the visual stress of horizontal vs vertical, or for visual center in S etc., but if so, it also seems like this face kind of pulls it off, making it a strong choice for sideways and other rotated designs while still looking good upright.</p>
