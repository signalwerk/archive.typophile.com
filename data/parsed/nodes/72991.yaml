    <p>Hello all,<br>
     After playing around with type design for a year or so I've worked up the courage to post something for critique. I've been working on this one for the last week or so. It's based off some signage on Toronto's King St that I am consistently charmed by (the Uniforms Registered building). I've done my best to keep the colour fairly consistent while keeping the existing glyphs as close as possible to their physical counter-parts.</p>
    <p>Any advice would be greatly appreciated as I'm thinking of starting on the lower-case.</p>
    <p>Thanks,<br>
    jr</p>
