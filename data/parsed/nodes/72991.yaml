      <p>Generally this is looking pretty good, but there are some global issues and a few specific things you probably ought to address before doing the lowercase.</p>
      <p>I'd say that you do need to compensate for the horizontal vs vertical. Making them physically the same thickness makes the horizontals look heavier than the verticals. You need to make the verticals about 5-10% thicker than the horizontals (or the horizontals that much thinner) to make them look the same weight. This is just how human perception works, so virtually all Latin/Greek/Cyrillic typefaces take it into account.</p>
      <p>Fiddly stuff: The join of the leg of the R needs some slight optical compensation. Same with the intersection on the B. The S looks top-heavy.</p>
      <p>Anyway, good luck with it! Doing a typeface is a major project.</p>
      <p>Cheers,</p>
      <p>T</p>
