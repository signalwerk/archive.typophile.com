      <p>Yeah, two weeks for the concepts seem way too long.</p>
      <p>1-2 days for a rough concept, with the students presenting their basic idea in rough sketches, maybe another 2 days to refine it. Then the rest of the time for execution. Maybe you could even cut down the whole thing to 3 weeks.<br>
      That would condense the work and I’m quite sure it would rather be a gain than a loss for the project.</p>
      <p>Edit: Oh, and I don’t think that a student project has to be perfect in terms of concept or execution. It’s about the process of creating something in a predefined frame of time and context. This is so much more relevant than creating bling-bling award winning student films, entirely edited and dictated by professionals in order to make it look more professional, with the students putting their names on it in order to plug their school.</p>
