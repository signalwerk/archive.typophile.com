      <p>I'll try to make it simple Ton,</p>
      <p>What I was trying to get across with my murky sentence was basically this: The verbal meanings of the quotations didn't seem to relate heavily to the visual choices made in some of the videos, and nor did the stories / scenarios / narrative arcs. </p>
      <p>This is not a problem for a piece of art (where folks often won't even agree on criteria for evaluation). I think it can be a problem for design, however.</p>
      <p>Design (in the sense of visual communications) is judged on how well the designer's choices reenforce the communicative intent (the core thing the design is trying to get across). Choices in, for example, typography, color, scale, repetition, space, sequence, tempo, rhythm, transition, speed, duration, sound, et cetera, all build toward a coherent vision, or they don't. They all work together to establish a certain sensibility / tone / mood / aura, or they don't. (I keep thinking of great film title designs and how they communicate a concept, or a tone that introduces and reenforces the theme of a film—The dizzy twists of "Vertigo," or the slow, foreboding typographic architecture of "Panic Room" for example). I'll say it again, though: The videos look like fun, experimental student work.</p>
