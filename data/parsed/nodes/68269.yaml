      <p>Hello! </p>
      <p>First of all, thank you for taking the time to watch our videos; I very much appreciate it! I am Angie Copolillo of the "Typographic Video" team. I'm excited to have our work here, and excited for the opportunity to learn and grow as a designer. </p>
      <p>I've been following this thread closely, and I wonder if the problem is that we won't be welcome to any criticism. I know that, at least for me, this isn't the case. You've said that you have a hard time finding things to compliment...well, that's all right. We're not looking for pats on the back. :-)  </p>
      <p>Can you tell us what might need to be improved? Essays aren't required, of course, but simply saying, "It ALL needs work" isn't quite helpful, even if it's how you feel. </p>
      <p>It might be good to pick one thing you saw and give us tips on how to improve it. As you can probably tell, I know that I am still VERY MUCH a beginner to Flash, AfterEffects, and editing in general! So even the most basic of suggestions would be perfect.</p>
      <p>Thank you again for your time! It's great to have you as a resource. :-)</p>
      <p>Sincerely,<br>
      Angie Copolillo<br>
      Graphic Design Senior<br>
      Arizona State University School of Design Innovation<br>
      Herberger College for Design and the Arts</p>
