    <p>Hello! For my first post, I'd like to introduce you to the work of a group of designers I teach.</p>
    <p>The first project this semester in <a href="http://tannerwoodford.com/syllabus/2010s" rel="nofollow">Advanced Media</a>, a course in the <a href="http://design.asu.edu/sdi/" rel="nofollow">School of Design Innovation</a> at <a href="http://www.asu.edu" rel="nofollow">Arizona State University</a>, was to create a 30-60 second typographic film, with copyright-free audio, based on a quote received on the first day of class. The first half of the four-week project was spent collaborating with a group of 7-8 peers to make and refine typography-inspired concepts. After this process, the students chose the best of three concepts, then spent two weeks executing it as a group. A well-rounded concept was emphasized. </p>
    <p>Following is the work that has been created thus far.</p>
    <p><a href="http://typophile.com/node/68263" rel="nofollow">Lemon Press</a><br>
    <a href="http://typophile.com/node/68264" rel="nofollow">Simple.</a><br>
    <a href="http://typophile.com/node/68265" rel="nofollow">Typographic Video</a><br>
    <a href="http://typophile.com/node/68266" rel="nofollow">Akzidenz Don't Happen</a><br>
    <a href="http://typophile.com/node/68267" rel="nofollow">If This Studio Could Talk</a><br>
    <a href="http://typophile.com/node/68268" rel="nofollow">Distance</a></p>
    <p>We look forward your feedback. It's an honor to be able to present our work-in-progress. Thanks!</p>
