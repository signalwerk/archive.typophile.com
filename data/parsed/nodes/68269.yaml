      <p>Hello to everyone, </p>
      <p>We are young designers, very well still learning, and helpful feedback allows us to grow. </p>
      <p>On the comments that 'two weeks may seem a long time for concept development', in actuality it is only 4 classes (we meet twice a week). Our class consists of a very diverse group of designers, so when asked to have 8 designers agree on one idea, it was a bit challenging for us. Each member came up with multiple concepts. After that, the group members combined multiple ideas or voted on which concept to move forward with. </p>
      <p>As I have seen some comments stating 'you can not comment on these videos', is neither helpful nor justified. We are open and welcome to hear the positive/negative comments, yet criticism should entail explanations so we can understand that point-of-view. We are honored to have criticism by professionals in the design field. Yet, I think a true professional would give constructive criticism with justification, especially to students who are trying to learn.</p>
      <p>Thank you to those who have taken the time out of their day to give our video's constructive criticism, it will help us in the editing process.</p>
      <p>Erin</p>
