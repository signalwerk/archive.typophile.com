      <p>I have to agree with Jennifer - school is exactly the right time to be experimenting with techniques and mediums. </p>
      <p>In regard to critiquing the work, I find it very difficult to comment on purely subjective terms. Your assignment [based on what I read] is to produce a piece of self expression by making a short movie based off of a quote. Based on that criteria, they've all succeeded.</p>
      <p>To be brutally honest, I think you've been too precious with the brief. Two weeks to come up with a concept is luxury they will probably never experience again. I would have liked to see what they could have accomplished given less time and more to do. Maybe they would have been more experimental since they wouldn't be as concerned with absolutely nailing it. I have discovered that over the course of my career, a vast majority of my best work has been created 'under the gun'. When given the time and the numbers involved, you get a committee.</p>
      <p>That would be my critique of the work, they feel born of a committee. I would have liked to see something where they tried something ambitious and failed, or succeeded spectacularly. Either way is correct for this point in their education.</p>
