      <p>The e’s are a bit sharp at 6 o’clock and a bit light compared to c and o, perhaps c and o could be a touch thinner and e’s a touch broader with the connector smoothed I think for the final e you could afford to make the last stoke a bit heavier. It is difficult to see with the scrolling but the Au space seems a bit wide and the loop at the beginning of the u might be a little more pronounced. The connector on the he seems a bit broad at the beginning of the out-turn.<br>
      Good advance from your first post.<br>
      Tim</p>
