      <p>I love that r, true it does draw attention to itself, but I think it is a charming shape and the weight is no more than the th, if anything the righthand side of the loop could be rounder. I still see something unsatisfactory about the last stroke of the last e, but I can’t put my finger on it, maybe somebody else can come up with an answer (probably that I’m wrong:).<br>
      As for the size it’s the devil and the deep blue sea – one is too large and the other too small, I think you have a happy medium.<br>
      Tim</p>
