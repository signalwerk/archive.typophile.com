    <p>It’s time to get your Milwaukee on!</p>
    <p>The <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> is pleased to announce that <a href="http://www.typecon.com/register" rel="nofollow">registration</a> for this year’s conference is now open. Take advantage of early bird pricing by registering by June 30th.</p>
    <p>This year’s incredible <a href="http://www.typecon.com/program/" rel="nofollow">conference program</a> has been coming together at a record pace and we’re eager to share it with you. Some of the brightest names in type and design will be sharing their knowledge and skills during TypeCon2012, including:</p>
    <p><a href="http://www.bethanyarmstrong.com/" rel="nofollow">Bethany Armstrong</a>, <a href="http://www.typojo.com/" rel="nofollow">Jo De Baerdemaeker</a>, <a href="http://stevebardolph.com/" rel="nofollow">Steve Bardolph</a>, Nathan Adam Beadel, <a href="http://scottboms.com/about/" rel="nofollow">Scott Boms</a>, <a href="http://tdc.org/about/carter.html" rel="nofollow">Matthew Carter</a>, <a href="http://cavedoni.com/" rel="nofollow">Antonio Cavedoni</a>, <a href="http://www.nancysharoncollinsstationer.com/" rel="nofollow">Nancy Sharon Collins</a>, <a href="http://www.flickr.com/photos/alkalinephoenix" rel="nofollow">Rafael Díaz</a>, <a href="http://www.fontbureau.com/people/JohnDowner/" rel="nofollow">John Downer</a>, <a href="http://design.concordia.ca/people/full-time-faculty/nathalie-dumont.php" rel="nofollow">Nathalie Dumont</a>, <a href="http://dailypangram.tumblr.com/" rel="nofollow">Craig Eliason</a>, <a href="http://www.lynda.com/jamesfritz" rel="nofollow">James Fritz</a>, <a href="http://www.patrickgiasson.com/" rel="nofollow">Patrick Giasson</a>, <a href="http://emdashes.com/" rel="nofollow">Emily Gordon</a>, <a href="http://theheadsofstate.com/" rel="nofollow">The Heads of State</a>, <a href="http://occupant.org/" rel="nofollow">Cyrus Highsmith</a>, <a href="http://www.linotype.com/724/markjamra.html" rel="nofollow">Mark Jamra</a>, <a href="http://www.linotypelibrary.com/469/akirakobayashi.html" rel="nofollow">Akira Kobayashi</a>, <a href="http://www.miniml.com/" rel="nofollow">Craig Kroeger</a>, <a href="http://kupferschrift.de/" rel="nofollow">Indra Kupferschmid</a>, <a href="http://www.leonidas.org/" rel="nofollow">Gerry Leonidas</a>, <a href="http://www.opto.fr/" rel="nofollow">Jean-Baptiste Levée</a>, <a href="http://ianlynam.com/" rel="nofollow">Ian Lynam</a>, <a href="http://unicode.org/iuc/iuc16/b021.html" rel="nofollow">Kamal Mansour</a>, <a href="http://www.koredesign.com.br/" rel="nofollow">Ricardo Martins</a>, <a href="http://www.ascendercorp.com/about/steve-matteson/" rel="nofollow">Steve Matteson</a>, <a href="http://www.erinmclaughlin.com/" rel="nofollow">Erin McLaughlin</a>, <a href="http://www.termsconditions.com/" rel="nofollow">Kathleen Meaney</a>, Ketty Miranda, <a href="http://www.mysticbluesigns.com/" rel="nofollow">Vince Mitchell</a>, Gillian Mothersill, <a href="http://blincpublishing.com/" rel="nofollow">Bill Moran</a>, <a href="http://woodtype.org/about/staff" rel="nofollow">Jim Moran</a>, <a href="http://adweb.aa.uic.edu/web/people/index.php?id=35" rel="nofollow">Sharon Oiga</a>, <a href="http://www.amypapaelias.com/" rel="nofollow">Amy Papaelias</a>, <a href="http://www.termsconditions.com/" rel="nofollow">Matthew Peterson</a>, <a href="http://www.thomasphinney.com/" rel="nofollow">Thomas Phinney</a>, <a href="http://ashleyjohnpigford.com/" rel="nofollow">Ashley John Pigford</a>, <a href="http://www.typeoff.de/" rel="nofollow">Dan Reynolds</a>, <a href="http://www.ultrasparky.org/" rel="nofollow">Daniel Rhatigan</a>, <a href="http://www.gridburo.com/" rel="nofollow">Steve Ross</a>, <a href="http://www.jayrutherford.net/" rel="nofollow">Jay Rutherford</a>, <a href="http://www.mysticbluesigns.com/" rel="nofollow">Yvette Rutledge</a>, <a href="http://www.fonts.com/aboutfonts/designerprofiles/stuart+sandler.htm" rel="nofollow">Stuart Sandler</a>, <a href="http://mekkablue.com/" rel="nofollow">Rainer Erich Scheichelbauer</a>, <a href="http://eyepopproductions.com/" rel="nofollow">Amie Segal</a>, <a href="http://www.finearts.utexas.edu/aah/design/faculty/shields.cfm" rel="nofollow">David Shields</a>, <a href="http://art.uga.edu/people.php?id=5029" rel="nofollow">Julie Spivey</a>, <a href="http://neilsummerour.com/" rel="nofollow">Neil Summerour</a>, <a href="http://www.jasonspeaking.com/" rel="nofollow">Jason Cranford Teague</a>, <a href="http://triciatreacy.com/" rel="nofollow">Tricia Treacy</a>, <a href="http://www.guyvilla.com/" rel="nofollow">Guy Villa</a>, <a href="http://erik.vorh.es/" rel="nofollow">Erik Vorhes</a>, <a href="http://www.uwp.edu/departments/art/faculty/watters.cfm" rel="nofollow">Carey Watters</a>, and many others.</p>
    <p>Presentations and workshops will explore topics such as: the library of the future; Marshall McLuhan and design; vernacular lettering; identity development with students; Cherokee syllabary; typeface legibility; the changing world of font licensing; stories from the Monotype archives; Mayan writing reform; responsive web fonts; press checks in the web age; creative pangramming; optimizing typefaces for the cockpit; wood type galore; and so much more.</p>
    <p>Keep an eye on the <a href="http://www.typecon.com/program/" rel="nofollow">conference program</a>, the <a href="http://www.typecon.com/education/" rel="nofollow">education forum</a> and <a href="http://www.typecon.com/workshops/" rel="nofollow">workshop</a> schedules, as well as the <a href="http://typecon.com/events/" rel="nofollow">special events</a> pages for the latest updates.</p>
    <p><a href="http://www.typecon.com/register" rel="nofollow">Register for TypeCon2012 now!</a></p>
