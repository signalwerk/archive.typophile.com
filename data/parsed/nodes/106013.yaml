      <p>It must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Adolphus%20-%20Regular&amp;fid=17e67c69c7d0f26badf62e2875bea9e4&amp;fsize=60&amp;text=Smile%20Center&amp;wrap=2" rel="nofollow">Adolphus</a></strong> free font by Adolfo Rojas with a modified /S.<br>
      Note though that this font looks like an outline theft of <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=Mixage%20ITC%20Std%20-%20Book&amp;fid=576c4b9b486163eb238124008f352f25&amp;fsize=60&amp;text=Smile%20Center&amp;fit=1" rel="nofollow">Mixage ITC</a></strong> by Aldo Novarese (1985), therefore I strongly recommend to use the original font and modified it to suit your needs, rather than using the knock-off.</p>
