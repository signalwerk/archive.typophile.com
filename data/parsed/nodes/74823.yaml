  html: |-
    <p>Hi,</p>
    <p>I'm desperately seeking the name of this typeface.</p>
    <p>It is used in some of the printed materials for T2 (the tea company) and is featured on the website for SAE Creative (<a href="http://www.saecreative.com.au/" title="http://www.saecreative.com.au/">http://www.saecreative.com.au/</a>). Please forgive the subtleties in the attached images, this typeface is used for animated sections that fade in and out, so it is virtually impossible to screen-capture them with any clarity. Please see the link to the SAE Creative website to see the typeface in action. The 1 in particular is very distinctive (see contact page on the SAE website, or second attached image).</p>
    <p>Would be so appreciative of any help.</p>
    <p>Thanks so much!</p>
