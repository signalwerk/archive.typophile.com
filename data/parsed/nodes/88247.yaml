    <p><strong>Vassil Kateliev</strong> is type and graphic designer based in Varna, Bulgaria. He specializes in designing high quality typefaces and is especially interested in producing cyrillic font sets. Since 2010 he has owned a small, but promising, type design studio called <a href="/wiki/Karandash" class="freelinking" rel="nofollow">Karandash</a> - Type &amp; Graphic foundry.</p>
    <p><strong>Additional information:</strong><br>
