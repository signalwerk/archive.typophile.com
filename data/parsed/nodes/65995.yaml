    <p><strong>Reviewing Typophile's Google Analytics reveals some interesting highlights from 2009. Presented in order of popularity, based on page views…</strong></p>
    <p>1// The high quality, free font, <a href="/wiki/Quicksand" class="freelinking" rel="nofollow">Quicksand</a> from Andrew (aka <a href="http://typophile.com/user/37327" rel="nofollow">alienbreed</a>). The page had 127,035 views in '09 and is still going strong.</p>
    <p>2// This <a href="http://typophile.com/node/61920" rel="nofollow">handmade subpixel font thread</a> blew up on Typophile: (87,901 views)</p>
    <p>3// The hottest controversy of 2009? <a href="http://typophile.com/node/61222" rel="nofollow">Ikea rebrands with Verdana</a>. (Still no comment from <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a> -- the man behind Verdana, not the man behind Ikea's design decision.) As a personal note, I'm still smiling at someone's suggestion that they'll miss the "warmth and cheer" of Futura when they visit Ikea.</p>
    <p>The second hottest controversy? <a href="http://typophile.com/node/58625" rel="nofollow">Apple's Menlo font</a> (<a href="/wiki/Menlo" class="freelinking" rel="nofollow">Menlo</a>) takes some heat for being a near duplicate of Bitstream's <a href="/wiki/Vera" class="freelinking" rel="nofollow">Vera</a>. (To my knowledge it's not an intellectual property kind of heat, but a street cred kind of heat.)</p>
    <p>4// The <a href="http://typophile.com/node/60577" rel="nofollow">sub-pixel YouTube favicon</a> magic. This post got picked up by YouTube's web crew who had it implemented on the site. Nice work.</p>
    <p>5// And the hottest user submitted how-to of '09: <a href="http://typophile.com/node/47265" rel="nofollow">Setting up a Baseline Grid in InDesign</a>.</p>
    <p>And other numbers?</p>
    <p><strong>12,350 new users</strong> registered to the site. Welcome everybody. Reading the site does not require registration and, so presumably all of these people have something to say.</p>
    <p>Users made <strong>8,650 type ID requests</strong> to the <a href="http://www.typophile.com/typeid" rel="nofollow">Type ID</a> forum in 2009. The overwhelming majority of which were solved (identified) by actual humans, for free. A testament to goodness in the world.</p>
