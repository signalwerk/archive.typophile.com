    html: <p>I've found a number of good newspaper design books at used book stores. I'm not sure about contemporary titles but there are plenty of old ones from back in the day. The one I have at my desk right now is titled Functional Newspaper Design and it's one of my favorite books (mainly because it's full of clippings and letters from the previous owner, who was an editor at the Detroit Free Press during the 60's). Try some old book shops or ebay. "Newspaper Design" would probably be a good search term.</p>
