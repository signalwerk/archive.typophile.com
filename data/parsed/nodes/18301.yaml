    html: <p>I've used a good basic book called "Newspaper Designer's Handbook" by Tim Harrower, that comes with a CD-Rom. It's spiral bound and is sort of a step by step guide to newspaper design. It has lots of examples and design ideas and I thought it was well explained and presented.</p>
