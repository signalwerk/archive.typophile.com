    html: <p>honestly, i would really suggest books on grid systems and typographic hierarchy. These two things, IMHO, are the most important aspects of a newspaper. The book on grid systems that I would recommend would be this one <a href="http://www.amazon.com/gp/product/3721201450/ref=wl_it_dp/104-0529799-6655911?%5Fencoding=UTF8&amp;colid=J1SPAXLSVHA0&amp;coliid=I2DHVK79XGR5SU&amp;v=glance&amp;n=283155" rel="nofollow">Grid Systems in Graphic Design by Josef Muller-Brockmann</a>I am sure you already have books on typography, so I wont bother mentioning any here, unless you need me to.</p>
