    html: <p>Harrington was released by Microsoft once in TT for Mac. The font is also sold as <a href="http://www.precisiontype.com/fontsearchres.asp?n=0&amp;tf=0&amp;s=1&amp;results=25" target="_blank">Hermosa</a> by Richard Beatty Design. Precision Type sells it in all formats except OTF. <br> <br>(I know this is a late post, but I was gone until yesterday, and Script fonts get my notice.)</p>
