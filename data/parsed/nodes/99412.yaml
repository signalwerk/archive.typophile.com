      <p>Ryuk, you might simply want to be helpful, and quite often you indeed are, but I'm sorry to say that by suggesting such free alternatives you're damaging the craft of type design as well as Typophile.</p>
      <p>To me these types of requests should go ignored, preferably discouraged here.</p>
      <p>Also, if WhatFontiS is in fact too easy to co-opt into bypassing quality commercial fonts I might suggest that it be censored here (or at very least direct links should be removed).</p>
      <p>I'm no policeman - I'm simply defending things I value.</p>
      <p>hhp</p>
