    <p>Bank of Toronto initials.<br>
    The Bank of Toronto merged with the Dominion Bank in 1955 to form the Toronto Dominion bank, now the TD Bank.<br>
    This is on a building in Stayner, a small town 60 miles NNW of Toronto.<br>
    I would date it 1920s/30s.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/BofT_4763.png"></div><p></p>
