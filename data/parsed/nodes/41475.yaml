    html: |-
      <p><a href="/wiki/Josef%252BM%2525C3%2525BCller-Brockmann" class="wiki">Brockmann</a>? Then it <em>is </em> <a href="/wiki/Akzidenz%252BGrotesk" class="wiki">Akzidenz Grotesk</a>.<br>
      Possibly a pre-digital version. Take into account that this family used to be quite patchworky, and still – even after GGL’s recut(s) and digitization – is far from being as systematical as Univers etc.</p>
      <p>From the Wiki:<br>
      <cite>The original series remained quite divers, individual weights showing not much resemblance but in name. […] That only changed when they cut Series 57, and then Series 58, named for the years of release. These had some sizes (but not all) recut under the direction of <a href="/wiki/G%2525C3%2525BCnter%252BGerhard%252BLange" class="wiki-create">Günter Gerhard Lange</a>, who was their (freelance) artistic director at the time.</cite></p>
