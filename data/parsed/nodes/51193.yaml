      <p>My interpretation of what you wrote is that you are looking at screen fonts, not optically-designed outline fonts. Screen fonts usually have a size indicator to represent what size they appear best at on a monitor. The associated outline font is not usually size-specific.</p>
      <p>If you were to print out a line of type with that font selected and the outline part was missing, you would get type that would be very bitmapped.</p>
