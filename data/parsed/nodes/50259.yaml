      <p>James- Thanks for your input. The flourishing trend is exactly why I wanted to stay away from flourishes at all. But like I said in my above comment, it was hard to not go in that direction. The name was chosen mainly for its alternate meaning, to succeed, to grow. As in “if you use me for design services your business will succeed.” The embellishment meaning was secondary and more of a nod toward the design meaning of the word. </p>
      <p>But, I think  you’re right, I can’t get it to go in the direction I want it to, so it’s time for a new idea. It’s coming off too dainty and crafty. I wanted to give it one last shot taken in the suggestions of others before I gave up.</p>
      <p>fyi- I was using Mrs Eaves (not that it makes too much difference), and I wasn’t using a flourish brush.</p>
