      <p>That last one looks like it was done with a couple generic flourish brushes. And Baskerville is, by nature, not a font that lends itself well to flourishing. </p>
      <p>I do think that your idea about starting over is probably best. If you can’t actually flourish by hand, it’s probably a bad name for a business. And the baroque/victorian flourishing trend is already on its deathbed, so you’ll just end up needing a new name/identity in a year or two with this one.</p>
