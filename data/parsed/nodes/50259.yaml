      <p>So I’ve given these comments much thought. I agree that using flourishes with the word is a bit obvious. It seems difficult not to go there though. Maybe I should try designing it upside down so I stop reading the words and designing by association. As far as Michael and Paul’s comments, I think you’re making a valid point. My only problem is that I don’t want to go completely organic or scripty. I also thought of bookplates with my former designs, and although I like them, it doesn’t make much sense unless I solely did book designs. It’s feeling a little too crafty.</p>
      <p>So here’s the problem. This word is just not lending itself to meshing in some flourish elements, unless of course I move to a font that lends itself better. But I just don’t want to go in that direction...it seems too “wedding invite” or “floral design”. </p>
      <p>Here’s my one poor attempt. Unless somebody says otherwise I think I’m going back to the drawing board and choosing a new name. I’m actually starting to read it flour-ish at this point. Ugh! I hate designing for myself...it’s impossible.</p>
      <p></p><div class="imageWrap"><img src="/files/flourish3_6536.gif"></div><p></p>
