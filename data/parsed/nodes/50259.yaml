      <p>“the baroque/victorian flourishing trend is already on its deathbed,”</p>
      <p>Properly applied to the “correct” product  any sort of flourishing will out live you and me James. One of the reasons devices such as flourishes come in and out of fashion is that they are overused or improperly used to excess. In this case, I think, it is ill advised and adds nothing to the product except a frame. First off, the elephant in the room is the OBVIOUS. Flourish on “flourish” is redundant and lends nothing to his desired (meaning) intent of the chosen word.</p>
      <p>Peter Thornton a British calligrapher one said... “if you cannot flourish, do not prove it.” I say, if the shoe does not fit, do not wear it!</p>
      <p>Before we dismiss flourishing in the future I think we should take a hard look at the popularity of Zapfino and all the similar spinoffs! Nuf said?</p>
      <p>Michael</p>
