    <p>So I’m trying to come up with a brand to pull in some freelance design business. I don’t want to use my name because it’s difficult to spell. So far the best I’ve come up with is “flourish”. I chose it for it’s double meaning. </p>
    <p>Here’s my first attempts at a logo. Is it too obvious a choice?<br>
    I wanted to try using Emigre’s Tribute font because it looks like there’s some nice ligatures in there but I can’t cough up the money for it now. Does anyone know of similar fonts families? I’ve gone with Mrs Eaves for now.</p>
    <p>First impressions of name and logo? Any suggestions for improvement?<br>
    Thanks in advance.</p>
    <p></p><div class="imageWrap"><img src="/files/flourish2_6654.gif"></div><p></p>
