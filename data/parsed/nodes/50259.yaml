      <p>I like what you’re on to so far. What I would say though, is that I think you should be a bit more subtle with the flourishes/flourish. The borders you have, I think, are just a bit too obvious. Try just the text, with maybe a subtle, unexpected flourish on one of the characters (as the ligatures alone may not be enough to carry the design).</p>
      <p>penn</p>
