      <p>Labels on frames were hand-drawn/hand-painted in that era (late 19th/very early 20th century).</p>
      <p>Best match = Vogue (just widen the letter spacing on RENOIR):<br>
      <a href="http://www.myfonts.com/fonts/ephemera/vogue/" title="http://www.myfonts.com/fonts/ephemera/vogue/">http://www.myfonts.com/fonts/ephemera/vogue/</a></p>
      <p>Treasure trove has a hand-made feel, though much looser than your sample:<br>
      <a href="http://www.myfonts.com/fonts/comicraft/treasure-trove/" title="http://www.myfonts.com/fonts/comicraft/treasure-trove/">http://www.myfonts.com/fonts/comicraft/treasure-trove/</a></p>
      <p>Same goes for Pelican and Antiquarian:<br>
      <a href="http://www.myfonts.com/fonts/adobe/pelican/" title="http://www.myfonts.com/fonts/adobe/pelican/">http://www.myfonts.com/fonts/adobe/pelican/</a><br>
      <a href="http://www.myfonts.com/fonts/3ip/antiquarian/" title="http://www.myfonts.com/fonts/3ip/antiquarian/">http://www.myfonts.com/fonts/3ip/antiquarian/</a></p>
