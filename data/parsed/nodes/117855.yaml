      <p>Reminds me of <a class="freelinking external" href="http://www.myfonts.com/search/Engravers" rel="nofollow">Engravers</a>. With some little adjustments (mainly /R leg and /4), you could get pretty much there. <a class="freelinking external" href="http://www.houseind.com/fonts/luxuryfonts" rel="nofollow">Luxury</a> Diamond is also interesting.<br>
      If you're particularly after such a /R leg but open-minded for a different overall design, you might be interested by <a class="freelinking external" href="http://typophile.com/node/99936" rel="nofollow">De Vinne</a> and especially in this case one of its reinterpretation <a class="freelinking external" href="http://www.myfonts.com/search/romana" rel="nofollow">Romana</a>. More '<a class="freelinking external" href="http://www.myfonts.com/search/de+vinne" rel="nofollow">De Vinne</a>'.</p>
