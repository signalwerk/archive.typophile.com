    html: |-
      <p>I do give a crap about pen constructions (and other theories) since they influences the feel/atmosphere of a typeface to a large extent.<br>
      That does not mean, that one always has to combine faces with the same construction (the safe way), but that they can guide you to lead the tone of your whole thing into various themes (the playful way). e.f. combine it with a Humanist Sans (constr.#1) with traditionally proportioned caps for a harmonious (maybe yet boring) feel, or a Grotesque face like Akzidenz Grotesk (constr.#2) for a more unusual, severe, stiff, contemporary atmosphere, or a Geometric (constr.#3) like Futura for a more modern (but also unsurprising) look. Of course you are free to try everything in between and beyond. </p>
      <p>Furthermore by suggesting directions or groups rather than concrete typefaces, you have a much bigger learning effect and need to figure out your own way in selecting typefaces – to "develop your own sense of style. Your own sense of ‘what goes with what’".</p>
