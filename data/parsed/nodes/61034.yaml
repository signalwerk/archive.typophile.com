      <p>@Andreas' mention of his Linea and @Nick Shinn's mention of Optima (influenced by Roman Carved Lettering itself) makes me realise that Paul RENNER's Futura - in a real thin weight has a similar structure to that of Roman (Trajan) lettering. The lowercase to uppercase relationship could be considered more of a classical proportion then Optima. Optima's cap height and x-height are relatively close together. The caps for Linea are interesting (like the B) but didn't see the lowercase on the reffered page. Stuff to think about. </p>
      <p>If it hasn't been mentioned before – be aware that letterspacing between all capitals and letterspacing between lowercase in sentences are different. This is something that can be easily overlooked when doing a typographic design.</p>
