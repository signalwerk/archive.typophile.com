    html: |-
      <p>The main problem with these questions isn't that they're lazy; more often than not, they're also completely missing the point. Font choices aren't variables to be solved on their own, easily isolated from the total equation that is good design (partly because the latter is actually more than the sum of its parts).<br>
      I'm sure there are about ten thousand sans serifs that could be paired with Trajan, and without talking about (a) what that font in question needs to be able to do, exactly, nor (b) what it should communicate and (c) how and (d) two whom, and (e) if it needs to harmonize or contrast with the existing font, to create a hint of tension and be a little bitchy or to sing with it and be beautiful, – and of course (f) what the overall concept &amp; other known factors/constituents of the design in question are, – without all that discussion, it doesn't make all that much sense to look for / suggest fonts that, on the surface, share – what? <em>pen construction?</em> :-\</p>
      <p>The beauty of typography and design is the search for the right combination of the right ingredients for all of it to click together. And pen construction isn't gonna be The Easy Formula That Provides A Clickin' Experience Every Time. Nor is anything else for that matter.<br>
      Stop trying to do what you think is the correct way to do it, and start playing.</p>
