      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Trajan_5677.png"></div><p></p>
      <p>I forgot to add in Kable.</p>
      <p>I have just recently become more sensitive to the narrowness of the E and L. I have been playing with how narrow I can make an L before it breaks and no longer looks like an L (perhaps might resemble an I) or no longer has a relationship with the E and F which it seems to have its closest relationship to.</p>
      <p>This example shows the capitals. Because we are considering a sans serif companion to Trajan, I would assume that Trajan is being used for titling and the sans serif for the body text, prelims etc.</p>
      <p>@Andreas. As you know, Roman letters are very geometric as well as Futura. Roman letters are suggestive of or made up of Circles, Squares and Triangles. However Futura is not as geometric as originally thought the more you look at it in detail. That is why there is a nice balance between the two - they sort of meet half way.</p>
