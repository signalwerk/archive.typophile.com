    <p>I'm looking for a sans-serif companion to Trajan for a photobook-like project of my own.<br>
    Trajan will be used for the main title and the "chapters" headers; I'd like to use a sans-serif for the inside text and photo captions.</p>
    <p>Any suggestion?</p>
    <p>Alessandro</p>
