      <p>Yeah Nick, I know.</p>
      <p>But I do think these "what goes with what" threads are the height of laziness and ultimately a cop out (I thought I'd use a 60s term given its the 40th anniversary of Woodstock).</p>
      <p>Just because the internet makes it easy to ask the question, does not make it reasonable to answer the question. The whole point of being a typographer is to develop your own sense of style. Your own sense of "what goes with what". It may take a bit of hard work, and it may take some time, but ultimately it is a personal decision, and no amount of internet inquiry is going to give you a real leg up. Hence my response. And ultimately, who give a crap about pen construction or any other theory anyway. Back to the Duke.</p>
