    <p>OurType is a <a href="/wiki/Belgium" class="freelinking" rel="nofollow">Belgian</a> type foundry launched by <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a> and <a href="/wiki/Rudy%20Geeraerts" class="freelinking" rel="nofollow">Rudy Geeraerts</a> in 2002. Since 2003 it is managed by Fred, Rudy, and <a href="/wiki/Corina%20Cotorobai" class="freelinking" rel="nofollow">Corina Cotorobai</a>.</p>
    <p><strong>OurType Designers</strong><br>
    Fred Smeijers<br>
    Peter Verheul<br>
    Merel Matzinger<br>
    Artur Schmal<br>
    Nikola Djurek<br>
    Thomas Thiemich<br>
    Hendrik Weber<br>
    Maurice Göldner</p>
