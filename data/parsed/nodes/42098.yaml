    <p>Hi all, I’m looking for some help in the direction of developing my personal identity and wanted to get some typeface thoughts.</p>
    <p>My renamed portfolio site will be figdigital, fig- being the shortened version of my last name and the -digital suffix being something vague enough to encompass all my design interests. I’m wanting to develop something that will appeal to my range of clients but lean towards the edgy side (I do work with some music clients and may be doing a good bit more) and be flexible enough to use in a variety of mediums.</p>
    <p></p><div class="imageWrap"><img src="/files/fd_type_5525.gif"></div><p></p>
    <p>I’ve spent hours sketching ideas with little to show, then recently ran across FF Disturbance and really love some of the letterforms (image above). The “fig” in particular really grabs me, I love the open letterform of the “g” and feel that it’s really unique. When combined with “digital” set in the same face, however, it seems to be a bit too much visually and loses it’s distinctiveness. I’ve been playing with the idea of some kind of a mark to use with this, but I feel like the typeface needs to be worked out first.</p>
    <p>Any ideas on possibly combining typefaces with this or other thoughts on direction for the logo in general? I’ve stared at it for so long that I’m needing some fresh opinions. Thanks for any thoughts.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/42113" class="topic-previous" title="Go to previous forum topic">‹ The project named 'Made in Clerkenwell'.</a> </div>
