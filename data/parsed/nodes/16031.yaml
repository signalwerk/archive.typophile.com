      <p>The idea behind the first logo was to keep it simple and bold to appeal to larger crowd.  I totally see what you’re saying about how when you first see the logo it doesn’t really relay exactly what we do.  What you talked about in your second post in the thread has been what was bothering me about the logo.  The average person wont know what Macari is, and that could be a problem.</p>
      <p>I talked with my partner after I sent him another logo that I had worked on previous for our project and we both seemed to agree that it sent a better message.</p>
      <p>Do you think this logo works better?  I believed from the get go that macari media sounded good.  The a’s repeat and it looks pleasing to the eye.  The idea behind the five squares that they have a technical feel to them but also contain a design feel.  They also create an “m” and guide the eye.  I’d like to go from there.  Do you think it works better and if so what can be done to improve it?</p>
      <p>thanks for the critique Eben </p>
