      <p>Re-reading my comment I realize I am being unclear. I guess I am asking : ’why this idea?’ Maybe you have good reasons but .... so far I can’t tell.</p>
      <p>To my eyes this idea could be for almost anything. Okay, not a bank or a lawyer, but an Italian furniture company? Sure! Or 90 other things.</p>
      <p>Actually that’s what I looks like to me. Without reading the text I would think Italian furniture company started in the 50’s or 60’s. It doesn’t read as ’web’ or ’design’ to me. Not at all. In fact it embraces a dated kind of industrial modernism. </p>
      <p>I suggest you define what you want this mark to do &amp; say &amp; then set out to hit that mark. Otherwise you just doodling. Maybe you have already done that &amp; this design is more deliberate ( &amp; coy ) than I think it is... But so far I would doubt it.</p>
      <p>I think you have more work to do.</p>
