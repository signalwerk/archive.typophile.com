      <p>All this talk has definitely got the ball rolling again.  Im reworking solutions to font and refining the current symbol. We’re definitely going with Macari Media.  The symbol and font choice will determine how people see the company.  Also I do agree that how the logo is does somewhat resemble macaromedia but by changing the weight and/or color of media or macari it does help to keep Macari Media from reading as one word.  I guess it could also be Macari space Media as well so i’ll have to consider this.</p>
      <p>Dan:  Akzidenz Grotesk Extended Bold does look a bit more welcoming.  I was also looking around at t26.com and found a few choices there.  Much of the webpage layout is done and I actually did start using the symbol throughout the webpage and it works well so I’ll likely keep that part of the logo.</p>
