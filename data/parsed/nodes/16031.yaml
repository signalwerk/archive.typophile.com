      <p>Your post came in just before mine - and you have started answer some of my questions already! So, it sounds like you will be a total solutions shop which in my mind leans more on the technical than the creative. What I mean is that the buyer could decide to use any of your services but if you do it all it will be the technical side that the client will be more concerned about. So you logo aught to reasure I think. </p>
      <p>But maybe you want to emphasize ’design’ over technical services. Do you?</p>
