    <p>Hello everyone,</p>
    <p>The attached logo is being designed for a webdesign company.  I decided to go with Eurostile because it has a bold outgoing feel to it.  I really would like to keep the logo simple and bold.  I’m also curious if anyone has any better suggestions for a font, both for the company name and what is located under it “Consulting, design, development”.  Colors are still undecided, first and foremost I want to peg the logo design.  </p>
    <p>Critique away</p>
    <p>Thanks,<br>
    Ray Macari</p>
