    html: |-
      <p>Hmm. Might be tough to find something heavy for display, but with modest contrast and classical serif structure. </p>
      <p>Substantial, titling, and bracketed serifs usually leads to high contrast. Conversely, substantial and low contrast usually leads to slab or wedge serifs.</p>
      <p>What about something like <a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/iowan-old-style/black-osf-bt/" rel="nofollow">Iowan Old Style Black</a>?</p>
