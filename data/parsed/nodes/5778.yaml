    html: <p>With regards to the ordering of fonts, the stated rules were that one was supposed to use the date of the original design, not the revival. Of course, on that basis the quizmasters goofed in marking Interstate as 1993. As Nick says, they were inconsistent. But they did say how it was supposed to work. (Of course, it was a pretty noisy environment, so it's not a shock that Nick didn't hear this rule being explained.) <br> <br>I *think* I would have gotten three more points had this question been marked correctly. But that would only have tied me with Kent for second, and who knows how many other folks would also have gotten more points.... <br> <br>Oh well! I think this just goes to show that we shouldn't take it too seriously. <br> <br>Oh yeah, there *were* a bunch of repeat questions from previous years' quizzes. I was particularly embarrassed by one question I missed *again*. <br> <br>Cheers, <br> <br>T</p>
