    html: <p>Nick, <br> <br>You raise a very good point! My quiz sheet is a scribbly mess, the epicenter of which lies on that very question. With regard to Bell, I first dated my answer to that of John Bell's specimens; then I recalled, just as you have written, that "Bell" wasn't released by that name until 1930 by Monotype, and so I changed my answer. In a moment of blind panic combined with nightmarish PSAT recall ("your first answer is usually the right one" -- whatever the hell that means), I changed my answer back. <br> <br>That question was indeed make-or-break, and I just happened to get fairly lucky.  <br> <br>Jon</p>
