    html: <p>Nick, you may have some points ... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Let's take a look. <br> <br>You finished with a 31. <br> <br>Had you gone 6/6 on the typeface birthdates, <br>you would've had 35. Didn't Mark and Stephen <br>have 35 or 36? <br> <br>Changing the "correct" order might have <br>had some Impact on Mark and Stephen <br>and you could've moved up. <br> <br>However, lots of others had scores in the <br>low 30s, too. <br> <br>There was a group in front that shared <br>answers <i>shhhh.</i> and they finished with 32, I think. <br> <br>Keith Tam had a 32, too. <br> <br>So I don't think you were robbed, per se. <br> <br>In fact, you didn't seem all that bothered <br>once the dance floor opened for business. <br> <br>Way to bust a move, man! <br> <br>And for the record, there were two correct <br>answers on the David Carson question. <br>Carson wasn't just a regular joe surfer,  <br>but a Professional Surfer, ranked as high as <br>eighth in the world. (And a sociology teacher.) <br> <br>So I'll take my 32 and know that I was only <br>a few away from some of the Type ID linchpins.  <br>There's always next year. <br> <br>bj <br> <br> <br>for the record, Jon scored a 42, pretty <br>much snapping the serifs off our collective stems,  <br>with luck playing absolutely no role. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
