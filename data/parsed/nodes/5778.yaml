    html: <p>On that ordering of fonts question, I got some mixed advice. I was going to put Clarendon in the fifties, but someone told me that everyone was saying they meant the original Clarendons. Seemed plausible, so I changed it and got it "right." I still think fifies is right for the same reason as Nick said. <br> <br>Then the same guy told me that Times pre-dated Futura. I was pretty sure it was the other way around, but he was adamant, so I changed it and got it wrong. I guess the judges hadn't heard this theory either.</p>
