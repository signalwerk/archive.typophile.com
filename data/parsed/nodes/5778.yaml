  date_raw: 26.Jul.2004 1.55pm
  votes: null
  html: '<p>Once again I failed to win the TypeCon quiz (top prize going to that damned amateur Coltz!) <br> <br>However, I coulda been a contender if not for the "put these typefaces in their order of release" question. <br> <br>There were several contentious faces: <br>Bell, which quizmasters placed in the 18th century <br>Clarendon, in the mid 19thC, and <br>Interstate, in the 1990s. <br> <br>The way I see it, there was no typeface named Bell until Monotype released one in 1930. <br>And no Clarendon till that of Eidenbenz in 1953. <br>Interstate was released in the 1990s, but it is an iteration of Highway Gothic (caps from the 1940s, lowercase from the 60s) <br> <br>I put my faces in order of named releases. <br>But the quizmasters mixed theirs up, determining some by date of typeface design (eg Bell), and others by date of typeface name (Interstate). Leaving aside Helvetica for now... <br> <br>Whadaya say, can I get some sympathy? <br> <br></p>'
  html_clean: '<p>Once again I failed to win the TypeCon quiz (top prize going to that damned amateur Coltz!) <br> <br>However, I coulda been a contender if not for the "put these typefaces in their order of release" question. <br> <br>There were several contentious faces: <br>Bell, which quizmasters placed in the 18th century <br>Clarendon, in the mid 19thC, and <br>Interstate, in the 1990s. <br> <br>The way I see it, there was no typeface named Bell until Monotype released one in 1930. <br>And no Clarendon till that of Eidenbenz in 1953. <br>Interstate was released in the 1990s, but it is an iteration of Highway Gothic (caps from the 1940s, lowercase from the 60s) <br> <br>I put my faces in order of named releases. <br>But the quizmasters mixed theirs up, determining some by date of typeface design (eg Bell), and others by date of typeface name (Interstate). Leaving aside Helvetica for now... <br> <br>Whadaya say, can I get some sympathy? <br> <br></p>'
