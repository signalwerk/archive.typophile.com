    html: <p>&gt;&gt;I believe the very first of the Clarendons was indeed known as "Clarendon"; in fact, wasn't Clarendon the first type face to get some sort of legal protection in the UK?  <br> <br>&gt;Hmmm. I don't recall seeing that name in any old specimen books, and it doesn't seem like the kind of name types were given then; however, my knowledge is somewhat spotty, so Clarendon it may have been. If anyone has visual proof, please post...  <br> <br>A late 1890s BB &amp; S specimen book shows a bracketed slab serif called Clarendon and several unbracketed slabs call French Clarendon. If BB &amp; S were using the names at that time, then they were probably common place. I can't scan the specimen however, it's too fragile. <br>George</p>
