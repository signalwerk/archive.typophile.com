    votes: null
    html: "<p>It's not a choice. If the convention of the document is that a break between two paragraphs is indicated by indenting, then that is what you do, regardless of what is adjacent to the text. Paragraphs are textual elements, and visually distinguishing them is an aid to the reader. Consider: if the last line of the previous paragraph happened to exactly or nearly extend to the right margin, removing the indent in this situation would remove all indication that these are two separate paragraphs. Basic rule: having established a document level convention for distinguishing textual elements, don't break that convention.</p>"
