    html: <p>At some newspapers/magazines I've worked at, custom fonts were made as part of various redesigns, containing graphical elements in this style. (Us page editors would pick a certain style or run a certain macro to get the graphics, but they'd reside in a font file.) Perhaps this is the case here, also? Did you check with whoever did the last magazine redesign?</p>
