  html: <p>Hello all <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I've heard of people lowering the x-scale of certain fonts by two or three percent when setting for extended reading. Could someone clarify why this is? I'm thinking it's something that obly applies to fonts with quite wide letterforms. <br> <br>thanks!</p>
