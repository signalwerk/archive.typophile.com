    html: <p>Hey, I never received the original post... <br>And I thought I'd noticed that in other threads recently too. Anybody else? <br>I hate missing posts. <br> <br>---- <br> <br>It has to do with optimal readability depending on point size. <br>Comparing the newspaper and the book for example, the latter format tends to point sizes optimal for immersive reading, while the former uses smaller sizes to promote portability and reduce cost. As a result, books use fonts with generous extenders to promote boumas (word shapes*, the core of immersive reading) while newspapers use fonts with generous x-heights to promote legibility (through plain old visibility) in adverse conditions (like a bumpy, dark train). <br> <br>* Or more accurately letter-cluster shapes. <br> <br>The optimal vertical proportions of a font depend on its intended balance between readability and legibility - as well as the particular language's usage of the Cartesian space. <br> <br>hhp <br></p>
