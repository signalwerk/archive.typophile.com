    date: 2004-03-15T01:58:00
    votes: null
    html: <p>Graham, your "This is the type of corrections you wanted, aren't they?" post came off, at least to me, as a pre-emptive attack. It sounds more like you don't really want to hear what we might have to say. <br> <br>There may be a value in critiquing a dead designer's work, but the designer himself gains no insight by it. <br> <br>I don't believe Mr. Meade will learn anything here.</p>
  - id: 27368
    user_id: 1626
    user_name: gmeade
    user_path: null
    user_image: null
    date_raw: 15 Mar 2004 — 2:19am
    date: 2004-03-15T02:19:00
    votes: null
    html: <p>Excuse me, Mr. Rigby, but I feel that remark is totally uncalled for. I posted the second image as it had some of the types of corrections, such as spine of S, length of decenders, The 5 and 6 sizes, etc. It was an enquiry to see if this the style of the corrections, as well as the proportions that Randy Jones was suggesting and not some form of attack. <br> <br>With the 'helpful assistance' you are imparting, it is obvious I will not learn anything. Would you prefer it if I didn't post stuff here, or ask questions ? Would you like me to carry on muddling along, teaching myself ?</p>
  - id: 27369
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 15 Mar 2004 — 9:29am
    date: 2004-03-15T09:29:00
    votes: null
    html: "<p>Take it easy, boys. <br>I think Graham's tone could be seen as offensive, but note that he did start off with \"You can rip into the criticism straight away\", so I don't think his point was \"please admire my perfect baby\". I think he does want to hear what we think of the font. On the other hand, again: I hope Graham is open to making a fixed one if he comes to feel that there's enough wrong with it as it stands - otherwise it's just Art. But font development/release is a matter of thresholds, not absolutes: there is always a point beyond which it's really not worth fixing a font. <br> <br>hhp <br></p>"
  - id: 27370
    user_id: 1626
    user_name: gmeade
    user_path: null
    user_image: null
    date_raw: 15 Mar 2004 — 1:30pm
    date: 2004-03-15T13:30:00
    votes: null
    html: <p>Hrant, there is a heap wrong with it, and further reflections with the suggestions have lead me to believe I should implement these changes. It will still only end up my interpretation of the font, and still carrying errors, but it will end up the best I could do at this time. <br> <br>I am not the best speaker/writer, so any assumptions I may be insulting, or rude, will be incorrect. Mr Rigby, While you probably felt what you said was right, I feel the remark about living designers and critique to be wrong. We do gain insight, well I do. I also believe others posting their work here also gain insight from remarks made about the work. Otherwise why bother posting ? <br></p>
  - id: 27371
    user_id: 1626
    user_name: gmeade
    user_path: null
    user_image: null
    date_raw: 15 Mar 2004 — 7:56pm
    date: 2004-03-15T19:56:00
    votes: null
    html: <p>I have changed the characters in regard to the critique given by Randy. The K bottom has been slightly more rounded to try to enhance the shape a bit more. There are still a few lines that need cleaning up. The change to the S seems to give it a slight odd shape. <br> <br>Should I lower the Middle bar in the G a bit ? It seems a bit high. Or should I shave a bit off the end curve on the top of it to open up the gap instead. <br><img src="http://www.typophile.com/forums/messages/29/28640.gif" alt=""></p>
