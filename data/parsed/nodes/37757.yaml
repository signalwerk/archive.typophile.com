    <p>I thought this might be of interest to some, even though it’s not necessarily Type-centric (though there are definitely some interesting posters in the collection with hand-made typefaces).</p>
    <p>I recently came across the WPA poster library at the libary of congress:</p>
    <p><a href="http://www.msnbc.msn.com/id/21111931/" title="http://www.msnbc.msn.com/id/21111931/">http://www.msnbc.msn.com/id/21111931/</a></p>
    <p>This is the poster that caught my eye:</p>
    <p></p><div class="imageWrap"><img src="/files/wpa1_teeth_4256.jpg"></div><p></p>
    <p>Anyways, I put a bit of a write up here:</p>
    <p><a href="http://brokesnob.wordpress.com/2007/09/21/diy-wpa-art-prints/" title="http://brokesnob.wordpress.com/2007/09/21/diy-wpa-art-prints/">http://brokesnob.wordpress.com/2007/09/21/diy-wpa-art-prints/</a></p>
    <p>and included a PDF of a version of said poster that I re-traced as vector art for those that’d like it for your bathroom too. ;o)</p>
