      <p>Often when a corporate identity package is created, one set of rules for designers and another for everyday use is specified. For instance, you might say that Dolly should be used on all events posters, committee logos, pamphlets, etc. and Georgia should be used for daily memos, correspondence, PowerPoint presentations, etc.</p>
      <p> - Lex</p>
