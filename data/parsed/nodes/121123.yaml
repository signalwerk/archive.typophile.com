    html: |-
      <p>'MAY THE BIRD...': completely new to me this one; a cross-genre French Clarendon/Italienne x Tuscan Concave; couldn't find anything similar; best option would be what Don said: start with 'Teutonic' (another version <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/teutonic" rel="nofollow">here</a>) and add large fat top serifs; you could also do it the other way round and starting from a Tuscan Concave Slab like <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/number-154" rel="nofollow">Number 154</a> reworking all bottoms;<br>
      'LITTLE JIMMY DICKENS': interesting digital alternative with Sergiy Tkachenko's <a class="freelinking external" href="http://www.behance.net/gallery/3373761/Sports-World-(Typeface)" rel="nofollow">Sports World</a> of 4th February;</p>
