    html: |-
      <div class="comment-spam-body"><p>The concave style in _MAY THE BIRD..._ may not have made it into the digital era.<br>
      The closest digital for the bottom three quarters could be  Fredericksburg NF, an interpretation of the 19th century design called "Teutonic"<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FredericksburgNFAsMaySM_5548.jpg"></div><br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/fredericksburg-wbw/" title="http://www.myfonts.com/fonts/nicksfonts/fredericksburg-wbw/">http://www.myfonts.com/fonts/nicksfonts/fredericksburg-wbw/</a> The top quarter is a "wanted poster" reverse contrast style as shown in many "wild west fonts" such as Buffalo Western <div class="imageWrap"><img src="http://typophile.com/files/BuffaloWesternasMAY_4327.jpg"></div> <a href="http://www.myfonts.com/fonts/kustomtype/buffalo-western/" title="http://www.myfonts.com/fonts/kustomtype/buffalo-western/">http://www.myfonts.com/fonts/kustomtype/buffalo-western/</a><br>
      Don<p></p>
      </div>
