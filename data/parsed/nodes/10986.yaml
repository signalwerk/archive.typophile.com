    html: <p>Go down to a shipping or stationary store and buy yourself a roll of brown package wrapping paper. They come in rolls about 3 feet wide, and make for a great cheap solution, although you'll need to flatten the paper before running it through a printer. <br> <br>Another alternate cheap paper source is printers masking paper, available by the roll at most hardware or paint stores. <br> <br>Here's a few samples, run through a black&amp;white laser printer. <br> <br><img src="http://www.typophile.com/forums/messages/29/881.gif" alt="tori"> <br> <br><img src="http://www.typophile.com/forums/messages/29/882.gif" alt="paper"> <br> <br>jb</p>
