    html: <p> I keep waiting for a design brief that lends itself to just sending off the copy to Hatch Show Print in Nashville, and get them to post me back the finished job, reading for scanning. <br> <br>I did a bunch of research into ephemeral woodtype poster printing here in Ireland (just as it was dying out), and was delighted to stumble across HSP in 1990. It's become something of a little industry since. </p>
