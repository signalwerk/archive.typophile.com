    html: <p> Overall, I'm fond of it Phil and enjoy the Hatch/Rural Concert Poster look to it. I would say one of the fonts you've selected really doesn't work as well as others in the poster. <br> <br>"DON'T MISS OUT!", "See Samples . . .", "Call Today w/ number", and "Phil Foss" are all in a Gill face or something similar and make the poster look like you didn't follow through to get the look consistant. <br> <br>I'd recommend replacing that face with the one used for "DESIGNER" or a Clarendon of sorts. <br> <br>You may also consider further distressing the elements in the poster as well as printing it on really heavy uncoated paper and sending it flat. I've had success with this technique for some mock Font Diner Airlines Luggage Tags I send out with one of my sets. <br> <br>Stuart :D </p>
    html_clean: <p> Overall, I'm fond of it Phil and enjoy the Hatch/Rural Concert Poster look to it. I would say one of the fonts you've selected really doesn't work as well as others in the poster. <br> <br>"DON'T MISS OUT!", "See Samples . . .", "Call Today w/ number", and "Phil Foss" are all in a Gill face or something similar and make the poster look like you didn't follow through to get the look consistant. <br> <br>I'd recommend replacing that face with the one used for "DESIGNER" or a Clarendon of sorts. <br> <br>You may also consider further distressing the elements in the poster as well as printing it on really heavy uncoated paper and sending it flat. I've had success with this technique for some mock Font Diner Airlines Luggage Tags I send out with one of my sets. <br> <br>Stuart :D </p>
  - id: 150248
    user: 3
    date: 2002-03-04T15:27:00
    date_raw: 4 Mar 2002 — 3:27pm
    votes: null
    html: <p> While I'm fond of the genre that you're drawing upon for inspiration for this poster, I would comment that it seems a bit much. Why not reduce the number of typographic elements (for example, removing "pro designer" and/or "performing live every sunday") and focus instead on really tightening the overall composition with less typefaces. <br> <br>You also might consider more overprinting, which can really add to the aesthetic. <br> <br>If you're planning to actually print these, I've had some success actually separating the plates and printing them separately. For example, if the poster is red and black, print all the red first, then load the paper back into the printer and print the black. <br> <br>jb </p>
    html_clean: <p> While I'm fond of the genre that you're drawing upon for inspiration for this poster, I would comment that it seems a bit much. Why not reduce the number of typographic elements (for example, removing "pro designer" and/or "performing live every sunday") and focus instead on really tightening the overall composition with less typefaces. <br> <br>You also might consider more overprinting, which can really add to the aesthetic. <br> <br>If you're planning to actually print these, I've had some success actually separating the plates and printing them separately. For example, if the poster is red and black, print all the red first, then load the paper back into the printer and print the black. <br> <br>jb </p>
