    html: |-
      <p>As you say, this is very small image and details are ambiguous.<br>
      In 1939 architects still had their own lettering designs which they used for building inscriptions, which were done by hand. The technology of the day did not provide for the direct transfer of fonts to large scale letters.<br>
      Nevertheless, the lettering might have been modeled on a font rather than an architectural lettering design.<br>
      I don't see any major conflicts with a 1926 design by Rudolf Weiss  for the Bauer foundry of Frankfurt, digitized as Weiss by Adobe <a href="https://www.myfonts.com/fonts/adobe/weiss/" title="https://www.myfonts.com/fonts/adobe/weiss/">https://www.myfonts.com/fonts/adobe/weiss/</a><br>
      Don</p>
