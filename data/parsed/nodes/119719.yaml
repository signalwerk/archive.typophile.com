      <p>OK 1929 would fit with a design from 1926. The architects might have wanted lettering with a contemporary feel rather than the traditional Trajan style inscriptions. Weiss reflects the ethos of the 1920s and is perhaps a fair match. Another digital version of it is Weiss Antiqua EF <a href="http://www.myfonts.com/fonts/ef/weiss-antiqua/" title="http://www.myfonts.com/fonts/ef/weiss-antiqua/">http://www.myfonts.com/fonts/ef/weiss-antiqua/</a><br>
      Don</p>
