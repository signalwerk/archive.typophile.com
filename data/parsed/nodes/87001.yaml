      <p>Element -&gt; Font Info -&gt; Lookups, right click and Save Feature File.</p>
      <p>I forgot to mention <a class="freelinking external" href="http://scripts.sil.org/FontUtils" rel="nofollow">FontUtils</a>, which have some interesting tools.</p>
