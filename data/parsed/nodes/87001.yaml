    <p>Hello,</p>
    <p>I am working with a font namely <a class="freelinking external" href="http://www.urdujahan.com/urdu-fonts/Jameel%20Noori%20Nastaleeq.zip" rel="nofollow">Jameel Noori Nastaleeq</a>. This is a ligature based font with around 20,000 ligatures contained. What I need to do is somehow extract the control points of the outline curves (cubic Bezier Curves) of each ligature. I have tried exporting ligatures to .EPS files from Fontlab and I would like to know is this an accurate approach or is there a more straight forward method? </p>
    <p>Secondly I also need to decompose each ligature into its corresponding characters. Now I opened the font in MS VOLT and it won't import any of the font's opentype tables, unless the tables were made in VOLT (which is not the case here). All I can do in VOLT is edit some individual glyph properties, in fact the ligature images are also read in as single component images as in the following, whereas it should have had three:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Capture_5223.JPG"></div><br>
       Also in FontLab I have tried extracting Opentype tables into FontLab's opentype panel. But there is no information on ligature composition or anything close to it.<p></p>
    <p>As a last resort, is there a tool with which I can interpret the binary font file, in order to extract ligature information from it?</p>
    <p>I would appreciate any guidance in terms of resources, links, software that I could use to accomplish this.</p>
    <p>-Aniqa</p>
