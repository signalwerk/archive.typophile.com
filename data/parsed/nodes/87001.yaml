    html: |-
      <p>I use FontForge and never had a problem editing existing OpenType features. With its python scripting, you can even automate converting ligatures into contextual substitution features, but you still have to edit the outlines manually. It can also export layout tables into feature files (as used by AFDKO), but not 100% reliable. FontForge can export glyph outlines to a variety of file formats.</p>
      <p>There is also fontttols' ttx, that can decompose the whole font (including OpenType tables) into a xml file, but it is quite low level for the task at hand.</p>
