      <p>Khaled Hosny- Thank you! Fontforge worked for me. It can export to its native .SFD file (Spline Font Database), and in fact its a comprehensive file listing <strong>everything</strong>, all the lookups, glyph definitions etcetera of the opentype font. Though its a 2 million line file(!), I guess I can write code to extract the relevant information.<br>
      I still couldn't export to the Adobe feature file though, can you guide me as to where that option is?</p>
      <p>blokland- It sounds like a great tool, but I was hoping for a cheaper alternative :)</p>
