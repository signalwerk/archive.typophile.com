    <p>Hi All,</p>
    <p>This is my first post, please bear with me.</p>
    <p>We are using Gotham and I'd like some ideas about which font would be nicely paired with it.</p>
    <p>- For copy text, should we use Gotham just for headlines and then a serif for the body text?</p>
    <p>- If so, what would you recommend that would look tasteful with Gotham.</p>
    <p>I am always humbled by the wealth of knowledge in these forums - thank you in advance.</p>
    <p>Sean</p>
