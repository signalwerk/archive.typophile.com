      <p>Cyrillic and Greek both use bold and italics. Greek italics is straightforward (I assume its forms are copied from the familiar Latin italics), but Cyrillic has a number of idiosyncrasies. An italic /t 'т', for example, looks like '<em>т</em>' -- and it depends on your viewing software what <em>that</em> looks like for you!</p>
      <p>The concept of "Italics" is hard, if not impossible, to translate to other scripts. Chinese, for example, only uses Bold and Light fonts, although I have seen my part of 'italicized' (through Word) and underlined Chinese text. Then again, I'm pretty sure the Chinese script has more subtleties to it than my inexperienced (round) eyes can discern.</p>
      <p>Uppercase is another thing simply not applicable to non-European fonts. Uppercase Hebrew? Uppercase Arabic? Uppercase Mayan hieroglyphs? That's like asking for an 'uppercase' digit.</p>
