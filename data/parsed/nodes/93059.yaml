      <p>Good topic.</p>
      <p>In Armenian we can place a floating emphasis mark* on any [number of] vowels, so although the need for Italics is not obviated, the need for emphasizing by style-change nicely is. Our Bold situation though is the same as in Latin.</p>
      <p>* Similarly we have floating elongation and question marks.</p>
      <p>In Georgian (which is a monocameral script) emphasis is often implemented via a full-height style (reminiscent of all-caps in Latin).</p>
      <p>BTW John, you forgot your favorite example: Ge'ez's use of red for emphasis.</p>
      <p>hhp</p>
