      <blockquote><p>I'm not sure what you mean by "limits of technology" or why these would vary with the medium such as being different when encoded in HTML or printed with metal sorts or in skywriting.</p></blockquote>
      <p>I said that because I suspect that since most implementations only supports bold, italic and underline perhaps some script are more forced to use those instead of what is more appropriate and elaborate. There's still a lot dedicated support for Asian and Middle East languages of course, but I'm worried about the usage of HTML stuff that is supposed to give semantic emphasis (&lt;em&gt;, &lt;strong&gt;), yet some script may ignore that and only use them based on their default look. That's the very reason the &lt;u&gt; element was added back on HTML5, as it was used on Chinese for indicating proper names (the current definition of the element is pretty awkward trying to make it having a more general semantic meaning).</p>
      <p>I believe that some Asian scripts empathize by placing dots over the characters. Not sure how is typed commonly, yet it can be archived with combining diacritics. <a class="freelinking external" href="http://www.w3.org/TR/css3-text/#emphasis-marks" rel="nofollow">A current CSS3 draft proposal</a> has a property (with no kind of implementation at the time of this writing) that adds dots over characters, along other symbols by default I don't know if they are used or if have a different meaning (circle, double-circle, triangle, sesame).</p>
      <p>I believe that Arabic empathize by placing an over-line in the text. It is supported in CSS, yet I don't remember much support in word processors.</p>
