      <p>There are many ways to indicate emphasis in written text;  typographically, verbally, and contextually, and maybe more. Verbally one can  write such things as, " …he said, emphatically."   Typographically, in addition to what you and John Hundson have mentioned, there's also underlining, all caps, change of font, surrounding the word or phrase with something like asterisks, isolation (putting  lots of space above and below the material), etc.  Contextually, some phraseologies can be stronger that others..</p>
      <p>I'm not sure what you mean by "limits of technology" or why these would vary with the medium such as being  different when encoded in HTML or printed with metal sorts or in skywriting.</p>
      <p>Here's a technology supported possibility - using eye-tracking technology on an electronic reading device, when the reader reads a particular word, the audio shouts it out!</p>
      <p> - Here</p>
