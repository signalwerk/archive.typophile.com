  html: <p>On Latin script at least, emphasis is given in text with italic and bold. I know that those don't apply for all languages, yet it seems that limits on technology kind of forces the same thing on other scripts. What other means uses other scripts to indicate emphasis? How those translate to HTML, text processors and stuff? Which scripts actually uses bold and/or italic for it?</p>
