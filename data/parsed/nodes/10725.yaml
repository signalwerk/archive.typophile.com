    html: "<p>Perhaps the best approach is to consider the 'spindliness' of the digital Electra independently of the metal version. I think we're too focused on whether the weight matches the letterpress, and not considering the more basic question: is the digital Electra <i>too</i> spindly to work as a text face in typical offset printing situations? Yes, I think it often is too spindly, especially on white or very light paper stocks. If the visual sense of a typeface is that it is being overwhelmed by the paper, then that typeface it too light to be used at that size on that stock. I've seen numerous books set in 11pt Electra that I would not want to read on account of the weakness of the type. This is irrelevant on the colour of the metal type, or the digital printed letterpress via polymer: this is something that can be judged soley with reference to the digital type as printed offset. Personally, if I intended to use Electra for anything printed offset, I would probably spend a couple of days beefing up the outlines in various ways. I wouldn't do this in reference to any letterpress printed specimen: I would do this in reference to what would read best at the type size I intended.</p>"
