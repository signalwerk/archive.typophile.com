    html: "<p>I'm a pygmy at this stuff, but since Gerald might have already started <br>his trip towards Pasadena (class tonight - yay!) let me show you something: <br><a href=\"http://www.themicrofoundry.com/other/joanna_c2.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/joanna_c2.gif</a> <br> <br>This is a lousy scan of a novice proof on lousy paper that I did in class a couple of weeks ago. It's Joanna 14 at two impression levels: the right side is 2 mils* deeper (the difference of one page added to the stack). You can see how much difference that makes in the letterform: the body on the left is not black enough, but the contour is great; on the right the thins and the serifs get chunky, and the cusp between the stem and the arch starts filling in (long live trapping). Conclusion: you need the impression depth on the left, but with more ink. But my hunch is that when you're in a hurry (saving money), you're more likely to just press it harder than regulate the ink. <br> <br>* A \"mil\" is 1/1000th of an inch. <br> <br>hhp <br></p>"
