    html: "<p>Gerald, you undoubtedly have a more discriminating eye than I do  <br>with regard to the quality of letterpress impression. And, unfortunately,  <br>I don't have a copy of Big Red (yet). To be clear, however, I do not base  <br>my judgement solely on the one example of the Mergenthaler booklet.  <br>It is based on a number of encounters with both fine and trade editions  <br>on various papers. I am not suggesting that digital Electra be made to  <br>look like a poorly reproduced letterpress specimen. I just wish it retained  <br>some of the substance and vigor of the original. <br> <br>Let me see if I can offer a counter example: <br> <br>I feel similarly about the digital version of Caledonia (at least Linotype  <br>chose to call it \"New\" Caledonia). I feel that it is too light and contrasty  <br>compared to the original metal Linotype, especially under modern  <br>printing conditions. <br> <br>However, Matthew Carter created a digital version of Caledonia for  <br><i>Time</i> magazine in 1993. Now this puts some of the ink back on  <br>the bones and reinstills vigor in the face. It is no historic mimic of the  <br>letterpress specimen; neither is it an anorexic specter. As could be  <br>expected of Carter, he has done a thoroughly modern job, but with an  <br>eye for the quality and spirit of the original design. He recently did the  <br>same thing with Linotype Monticello for the Princeton University Press. <br> <br>I wish the same might be done with Electra. It would be a great service  <br>to the book publishing field. <br> <br>-- Kent. <br> <br></p>"
