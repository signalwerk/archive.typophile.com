    html: <p>I have to agree with Kent on this. Electra is not a soft round old-style typeface. It does sparkle more than does the average Garamond (given the same printing conditions).  <br> <br>The biggest problem comes with how the user "sets" the typeface, and second what printing conditions they will use. <br> <br>I truly think that Dwiggins would have whole-heartedly embraced the technologies of today. He'd have tested his designs under all printing technologies too. He'd have wanted his snap and pop by-jiggidity and he'd have had it too.</p>
