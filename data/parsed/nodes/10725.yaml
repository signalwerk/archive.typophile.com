    html: <p>Hrant you write "&gt; The classic standard for beauty    <br>No such thing, my friend!" <br> <br>Ok, it's neoclassical. Francis Hutcheson, in the first book on aesthetics (1725) wrote that beauty is experienced when we are confronted with a "compound ratio of uniformity and variety." He influence the neoclassical movement.  <br> <br>When I did a google search on "unity, variety, balance", it came up with mainly pages from courses on design, so I'm not alone in thinking these concepts are useful. <br> <br>As this is a thread on logic and intuition, I would suggest that questions such as 'is the design unified? is there enough variety? is it balanced?' are useful. They are a way logic can critique intuition and spur more creativity.  <br> <br>When I read between the lines of Bringhurst, I have the feeling he thinks that a lot of the digital versions of the classics were done without enough care or thought (under commercial pressures?) and as a result are a comedown from the orginals.  <br> <br>The discussion of Electra here seems to confirm that, big time. <br></p>
