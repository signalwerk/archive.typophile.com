    html: <p>William <br> <br>Well, I think the designers did suit the font to the printing method. If they would have emboldened it to create a faux letterpress look, would not that have been the wrong thing to do? Electra is a spindly face, it was as a metal face as well. It is just more revealed as such on digital printing devices. <br> <br>Problem with trying to replicate a metal face with inkspread _in sito_ is that the gain is not uniform and also varies considerably based on presswork, substratum, printing press, etc. <br> <br>Yes there is significant difference in the inking of offset vs letterpress. Letterpress is a continual gain that must be monitored continually. Once the ink grows out beyond the letterform outline (not a significant factor in offset) it progressively gets worse as the ink is viscous and continues to draw. There is good letterpress and bad letterpress. But in any printing medium you would want the clarity of letterform to be revealed as the designer intended. In this case it would be as the revival designers intended, not Dwiggins.  <br> <br>Fournier said "the letter should not be blamed for the fault of the ink." This in reference to the punchcutter versus the presswork of the printer. I'd suspect any type designer would like to see their creations presented in the best light, would they not?</p>
