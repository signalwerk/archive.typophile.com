    html: <p>"About 3 years ago, motivated by the hunch that slight (I mean really very slight) fuzziness helps make letterpress more readable than offset, I had this crazy idea that all you'd need to do is unfocus the laser in your imagesetter by a hair..." <br> <br>Not a crazy idea, if you were dealing exclusively with letterforms with no halftones. You wouldn't "unfocus" the laser, though, you would merely set the base laser intensity a little higher than you would in a normal base linearization. That would give you slightly bolder letters and would probably come closer to approximating letterpress process with offset plates than anything else I can think of.  <br> <br>You'd need to find a pretty adventurous prepress house, though, and most -- needless to say -- are not.  <br> <br> <br> <br> <br></p>
