    html: <p>Gerald, yes it may be that the digital version of Electra, if printed by letter press - assuming your photopolymer plates have similar ink spread as metal did - would correct the problems of the digital version, and get a similar superb result. My point from the start was that the digital version should have taken into account that almost all the printing would be from computer to photo to offset press, and so should get the supurb result by the current common technology. However, if Kent Lew's observations are correct - and he seems to have made a deep study of the matter - the digitizer also made the font more uniform than Dwiggins had intended, and made other adjustments. If so, I suspect that the result will still be not as good, even though the problems with the weight, particularly of the thin strokes, will have been corrected by the printing process. <br> <br>I am not saying that letter press is inherently better, only that the change in technology sometimes wasn't taken into account properly in the digitizing of old typefaces. Now letter press can get 'sock', the slight embossing of the paper, which is nice. And you tell me, is there any difference in the density of the ink in letter press vs offset? To me these advantages may be real, but aren't that big. The main problem is suiting the font to the printing method. </p>
