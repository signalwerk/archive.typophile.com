    html: <p>William <br> <br>Well, let see it I have this right. I have a letterpress specimen produced by Linotype itself. Very well printed, with minimum impression on a fairly receptive stock, with just the right about of ink control given to it. Representative of what they would want the market to see. The 96 point they present would most likely have been photographically scaled from the 14pt and reproduced photomechanically. My scaling of the digital type to that size indicates a very near match with only the slightest variations built in to correspond to a new printing technology. <br> <br>So if I print the digital Electra with photopolymer plates I would expect a fairly accurate representation of the original, as a product of letterpress. <br> <br>If the letterpress process itself is really what is giving Electra its liveliness, then it really isn't a problem with the digital rendition as much as it is a preference for the way letterpress reveals the face. But, impression and ink gain will alter any typeface. <br> <br>I've printed with letterpress for near three decades now. I obviously prefer the printing process. But I also have a great deal of respect for the work being done with digital typefaces; the impetus "to" revive classical faces, the concerns for optimization and legibility. I don't believe the digital version is the travesty some of the folks here wish it were.</p>
