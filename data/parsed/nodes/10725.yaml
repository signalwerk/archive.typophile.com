    html: <p>I dragged out my Specimen Book of Linotype Faces (aka Big Red) and took a look at the Electra specimens. Revealed there, in 8, 10, 11, 12, and 14 point. The ink spread is held to an absolute minimum to allow the clarity of the letterforms to show. These are much "thinner" that the printed specimens show in this thread. Also the baseline disturbance is more prominent in the smaller sizes and is progressively adjusted thoughout the range. The 14 point baselines are hardly disturbed. The hanging or jumping lowercase characters mentioned previously seem to have been brought in line. These are quite vivid in the 8 point though. I'm suspecting this was a means for creating a certain legibility to the smaller sizes? It is fairly characteristic of many of the Linotype text offerings. </p>
