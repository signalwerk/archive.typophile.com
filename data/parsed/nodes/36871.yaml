    <p>September issue of the <a href="http://www.planet-typography.com/news/" rel="nofollow"><strong>Typographic Times</strong></a>:</p>
    <p><a href="http://www.planet-typography.com/news/designer/storm.html" rel="nofollow">Interview of František Štorm</a><br>
    “Typography happens in books, not on street.”</p>
    <p><a href="http://www.planet-typography.com/news/typeface/anselm.html" rel="nofollow">Portrait of his newly designed Anselm type system</a><br>
    “Our goal was to create an all-round type family, equally suitable for poetry, magazines, books, posters, and information systems.”</p>
    <p><a href="http://www.planet-typography.com/news/typo/pulp-fiction.html" rel="nofollow"> Pulp fiction in typography</a><br>
    “The assignment was to take an audio clip with words in it, and then try to capture the intonation of the scene.”</p>
    <p><a href="http://www.planet-typography.com/news/typo/fontplay.html" rel="nofollow">Free fonts in action with Fontplay.com</a><br>
    Playing with fonts or the art of expressive typography</p>
