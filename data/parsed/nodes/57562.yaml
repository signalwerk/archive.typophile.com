      <p><cite>i think the thing about these fonts that scares me is the extreme contrast, i have serious boubts about my ability to use them well.</cite></p>
      <p>Don’t let the rubbish from type textbooks scare you away from using high-contrast types. As Nick likes to point out, such types were the most popular types in use during the time when widespread literacy came into being, and they don’t seem to have held readers back. And back then they were being printed at smaller sizes, on crap paper, and often read under lighting conditions we would consider abominable. There’s no reason that a well-used transitional or modern face cannot be every bit as readable as an aldine, and the pedants who insist otherwise should be treated with suspicion. A few days ago I examined one of Baskerville’s original printings of Paradise Lost, and I assure you it is more readable (long s usage aside) than some of the best versions being printed today!</p>
