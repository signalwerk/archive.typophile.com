      <p>Caslon was first revived in 1844 with "Lady Willoughby's Diary", with the original matrices, I think. It caused something of a stir because it was so much more readable than the 'Moderns' that were then fashionable :)  Updike, who admittedly was a Caslon fanatic, said the revival was "The typographic event of the mid-nineteenth century".</p>
      <p>Following this, foundries gradually issued a lot of typefaces called 'old style' based on Caslon, but with larger x-heights and I believe also less contrast. According to Mac McGrew's book, Bruce Old Style originated in 1869, Binny Old Style around 1863, and Bookman Old Style originates in 1860. Caslon itself was revived in the US supposedly from English electroplates at about the same time, also under the name 'Old Style'. Later in the century they put the name Caslon back on it, and with hot metal type every foundry had versions of both Caslon and "Old Style", often with shortened descenders. One of the most refined of the higher x-height revivals was Imprint, which I think you can still see used occasionally.</p>
      <p>I don't know, but I would guess from the 1860s on you will see a lot of 'old styles' in print. The peak of the craze for Caslon was probably 1900 to 1925. After the Bembo and Garamond were revived, it lost some of its mystique as there were other good and refined old style revivals available, as well as the new stuff from Goudy, which was very popular also in the US. Today I sense we are about due for a new Caslon craze :)  </p>
      <p>By the way, I think the Scotch style, such as Nick has revived, in my eyes was never as problematic in text as the real Didones, which have more starved horizontals.</p>
