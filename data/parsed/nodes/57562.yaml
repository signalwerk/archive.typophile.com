      <p>Scotch Modern is a close revival of a "Modern" (Didone) face of the 19th century.<br>
      Such faces never had oldstyle figures, then or until now, AFAIK.<br>
      Therefore it is anachronistic, not to mention ironic, to include oldstyle figures in a modern face!</p>
      <p>However, Adobe made me do it.<br>
      By including "Proportional Oldstyle" and "Tabular Oldstyle" as non-bracketed options in the InDesign OpenType menu, it appears that there is an error in OpenType fonts that don't have oldstyle figures. (This is strange, not to mention ironic, as Adobe's own Trajan is without OSF.)<br>
      Therefore, to avoid looking like there is a mistake in the typeface, I decided to produce oldstyle modern figures for Scotch Modern. Or perhaps they are modern oldstyle figures. Other than massaging the proportions, the only structural change from the lining figures is the removal of the foot serifs on 4.</p>
      <p>At any rate, they work surprisingly well, and are quite interesting. In fact, Michaël Amzalag uses them pointedly, and copiously, in his <em>Interview</em> redesign, e.g.--<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Interview_contents_3572.jpg"></div><p></p>
