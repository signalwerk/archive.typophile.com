      <p><em>It caused something of a stir because it was so much more readable than the ’Moderns’ that were then fashionable :) Updike, who admittedly was a Caslon fanatic, said the revival was “The typographic event of the mid-nineteenth century”.</em></p>
      <p>Lady Willoughby's Diary was influential, but the idea that it was "so much more readable" is a non sequitur.<br>
      In fact, the revival was found wanting, and what grew out of it and did become popular, the Miller and Richard "Old Style" was, to all intents and purposes, a modern face, with high contrast and vertical stress! The same is true of the other "Old Styles" you mention.<br>
