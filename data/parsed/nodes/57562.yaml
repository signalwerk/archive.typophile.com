      <p><em>...objectively a problem...what my eyes have told me all my life.</em></p>
      <p>You're contradicting yourself.</p>
      <p>However, I have had the same view of high contrast faces, having tried various fonts in text settings from the 1970s on (for offset printed work), and always been disappointed with the results, in comparison with letterpress examples.</p>
      <p>I surmised that the genre is not ideally suited to offset, and also that the phototype and digital fonts available were lacking.<br>
      So I thought I'd have a go, hence Scotch Modern. Even if I have been successful, it is still a difficult genre to use for typographers, as optical size, paper stock and ink gain are so critical. Added to which is the prejudice which exists against it.</p>
