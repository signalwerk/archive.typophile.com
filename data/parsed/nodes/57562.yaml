      <p>Nick, unlike your scan of Scotch, I find that Didot pretty bad as far as readability. The weight of the stem in the Scotch is carried much further into the top arch, compared to Didot and Bodoni, where the horizontal arch is thinner throughout. </p>
      <p>The result to my eyes is that there is a lot of shimmer from the 'picket fence' effect in your scan, because the heavy verticals are so dominant. </p>
      <p>As far as the Old Style of Miller and Richard, here's what Jaspert's encyclopedia says: "The stress is vertical, but though not abruptly so. Note the curves of the c, e, and p."</p>
      <p>Remember that Caslon's o has a vertical stress, as well as some of his caps in many sizes. The c, e, and p have a slight old style stress in the Monotype version of Old Style that Jaspert shows. </p>
      <p>But the important point in that note is "not abruptly so". The gentler modulation is the main thing they took from Caslon, and with it lower contrast. Judging by the many later versions of Old Style, you are mistaken in saying that Phemister's original Old Style for Miller &amp; Richard has high contrast. In fact, the low contrast and big x-height is overdone, in my opinion, in the "Old Style", though it is very readable. (I don't have a sample of the original Miller &amp; Richard type.) My problem with the Old Style is an aesthetic one, namely that it is rather dull looking--something that certainly can't be said of the Scotches, including your revival. </p>
      <p>I never said that vertical stress was a problem in itself. There are great text faces with vertical stress, like Caledonia--a modified Scotch. What I do think is that those with vertical stress are less tolerant of higher contrast--you can push diagonal contrast a little more without getting into trouble. </p>
      <p>And in any case text type needs lower contrast, lower than in your scanned example immediately above, IMHO. Note that this issue also is not simply absolute thinness of the thins, but also how bold the stems are in relation to them. Here in your Didot scan the result is exactly the thing I have problems with in text. It is beautiful in display, but that is another story.</p>
    html_clean: |-
      <p>Nick, unlike your scan of Scotch, I find that Didot pretty bad as far as readability. The weight of the stem in the Scotch is carried much further into the top arch, compared to Didot and Bodoni, where the horizontal arch is thinner throughout. </p>
      <p>The result to my eyes is that there is a lot of shimmer from the 'picket fence' effect in your scan, because the heavy verticals are so dominant. </p>
      <p>As far as the Old Style of Miller and Richard, here's what Jaspert's encyclopedia says: "The stress is vertical, but though not abruptly so. Note the curves of the c, e, and p."</p>
      <p>Remember that Caslon's o has a vertical stress, as well as some of his caps in many sizes. The c, e, and p have a slight old style stress in the Monotype version of Old Style that Jaspert shows. </p>
      <p>But the important point in that note is "not abruptly so". The gentler modulation is the main thing they took from Caslon, and with it lower contrast. Judging by the many later versions of Old Style, you are mistaken in saying that Phemister's original Old Style for Miller &amp; Richard has high contrast. In fact, the low contrast and big x-height is overdone, in my opinion, in the "Old Style", though it is very readable. (I don't have a sample of the original Miller &amp; Richard type.) My problem with the Old Style is an aesthetic one, namely that it is rather dull looking--something that certainly can't be said of the Scotches, including your revival. </p>
      <p>I never said that vertical stress was a problem in itself. There are great text faces with vertical stress, like Caledonia--a modified Scotch. What I do think is that those with vertical stress are less tolerant of higher contrast--you can push diagonal contrast a little more without getting into trouble. </p>
      <p>And in any case text type needs lower contrast, lower than in your scanned example immediately above, IMHO. Note that this issue also is not simply absolute thinness of the thins, but also how bold the stems are in relation to them. Here in your Didot scan the result is exactly the thing I have problems with in text. It is beautiful in display, but that is another story.</p>
