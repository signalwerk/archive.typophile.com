      <p>On axis, I do think that higher contrast is less of a problem in old style type, such as Times New Roman, where the thins are more on the diagonal. </p>
      <p>On objectivity, I am not basing myself only on my eyes, but also history. The high contrast types of the 19th century went into eclipse. I believe that almost all popular text faces now have lower contrast than things like Bodoni, Didot, and the 19th century Scotch romans. I haven't studied the 19th century stuff in letter press, so I may be wrong, but my impression is that things like Century, Miller Text, and Chronicle all have lower contrast than the 19th century stuff. I suspect that this history indicates an underlying reality about the physiology and psychology of how we read.  So I don't think the "prejudice" is just prejudice, but rather a well founded belief that such high contrast, vertical stress stuff is a problem for the eye in extended text.</p>
