      <p><em>I don’t think I’m contradicting myself.</em></p>
      <p>Bill, you offered your own experience, which is by definition subjective, as an argument against the idea that high contrast types are in general "equally readable". </p>
      <p>The problem with high contrast types is not the contrast per se, but rather it's the too slight image of fine details, in particular serifs, in offset printing. So one might say that the difficulty in offset is actually the <strong>low</strong> contrast between paper and fine details. This is not an issue in letterpress, because even the slightest of serifs are substantial enough: on uncoated stock there is sufficient press gain, and on coated stock there is the bite of type into the paper, creating a crisp dimensional image.</p>
