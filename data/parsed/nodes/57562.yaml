      <p>Nick I don't think I'm contradicting myself. My eyes say that high contrast is a problem. I can't prove it, but I think it's objective, in the sense that it's a problem for our visual apparatus to read high contrast text at small sizes. </p>
      <p>Letter press has a built-in minimum for thins, and so has a kind of built-in optical adjustment, so you may be right that they worked significantly better as letter press. </p>
      <p>My prejudice against them for text arose when I was a student in high school and college in the early '60s, when almost all science books were in high contrast modern faces, on slick paper. [They had bigger character sets for math, I'm guessing.] </p>
      <p>They have a lot of flavor in display, and yours captures that well. </p>
      <p>With less contrast, they can work in text, though they are still not my favorite, though that, I admit, is subjective.</p>
