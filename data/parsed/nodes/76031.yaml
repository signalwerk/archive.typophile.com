      <p>hi matt! thanks for your comments!<br>
      yes, the caps are quite short. at first, the font was supposed to be caps only, so when i decided to add lowercase and did few letters, i found out that i really like how the short caps work with them. and what's a bonus –&nbsp;i don't need to design small capitals :)</p>
      <p>right now i'm working on diacritics and the ligatures. i think it could be finished before christmas. i'll drop a line when it's out.</p>
      <p>thank you! ondrej</p>
