      <p>This is really great. I particularly like how you've made the inner counter of the o, e, g, 2 and 6 with a vertical bit of a paperclip. The top of the T feels too narrow, and that glyph is maybe too short, but maybe I'm imagining that. The c feels pretty thin on the bottom, although I don't know how you'd correct that.</p>
      <p>If you feel like posting more characters, it would be interesting to see them.</p>
      <p>When does it go on sale? :) Let us know!</p>
