      <p>Agreed, this is great stuff.<br>
      I'd definitely raise the cap height.<br>
      Can you "cheat" a little and take a tiny bit of weight off the lines where you have those barely overlapping loops at the tops of letters (e.g. /o/a/e/B/C/&amp;/)<br>
      Looking forward to seeing how you solve /i/X/#/$/!</p>
