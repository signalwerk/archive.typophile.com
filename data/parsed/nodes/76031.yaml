    <p></p><div class="imageWrap"><img src="http://typophile.com/files/clip_6065.png"></div><br>
    hi fellow typophiles!<br>
    this is my latest creation - a display typeface inspired by the shape of a paperclip, but not just another minimalistic modular angular kind of thing. i wanted it to have classic proportions and high contrast and - here's the twist - drawn only with one single line per glyph.<br>
    it will have 3 weights, the heaviest is displayed on the picture. also lots of liga and dlig ligatures, and i'll try to make some starting and ending forms as well as some ornamental dropcaps, maybe...<p></p>
    <p>so, i would really appreciate your feedback. thanks! ondrej</p>
