    html: |-
      <p>Korean typewriters produce horizontal text, left-to-right and with lines going down, just like how the Roman alphabet is written. I think there are some “advance width” tricks to make sure the syllabic blocks are formed properly, but otherwise the mechanics are the same as in Roman alphabet typewriters.</p>
      <p>Traditionally, Hangul was written vertically, but nowadays Hangul is always written horizontally for longer text unless one is going for a faux-antique look. Now that I think about it, the introduction of Gong’s typewriter may very well mark the shift in momentum to horizontal writing for Hangul.</p>
      <p>The 20th-century shift from vertical to horizontal writing presents some interesting issues for Hangul typeface design. Digital revivals of pre-horizontal-writing typefaces have to pay attention to the horizontal alignment of the glyphs. Until around the 1980s, Hangul typefaces used the same sort of glyph designs as the pre-horizontal-writing typefaces, only arranged horizontally and with a centred alignment. Nowadays, text typefaces are being designed so that the lines have a slightly higher centre of weight, which I think works better for horizontal writing.</p>
      <p>For fun, I have tried out writing Hangul vertically by hand a few times, but I can’t quite seem to get the alignment and spacing right.</p>
