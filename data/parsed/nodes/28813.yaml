      <p>Well, my language is Korean, but you are talking about the writing system. Korean is written primarily in the native Hangul alphabet nowadays, but this wasn’t invented until the 15th century. Before that, Chinese ideographs were used, and nearly all written material was in classical Chinese. The educated elite continued to write in classical Chinese long after Hangul was invented, and Hangul didn’t really become predominant until the 20th century. Printing has a long tradition in Korea that precedes the invention of Hangul by centuries—in fact, the oldest surviving Korean printed document, a Buddhist scripture, dates from 751. So most pre-20th-century Korean type is for Chinese characters.</p>
      <p>As an aside, there’s a Chinese-Hangul bilingual inscription on a tombstone in northern Seoul that warns those who would disturb the tomb, and also declares that the Hangul version was added for the benefit of those who couldn’t read writing. Says a lot about the status of Hangul in those days when reading in the vernacular script didn’t even count as reading.</p>
      <p>Anyway, the thousands of glyphs needed for Chinese character type means that the evolution of type takes a very different course in Korea. Because of the amount of labour that went into producing type, type production was largely state-directed.</p>
      <p>Moveable metal type developed in the 13th century and by the time of King Sejong, the inventor of Hangul, metal type production was at a sophisticated phase. Typically metal type would be cast based on the hand of renowned calligraphers. The so-called <em>Gabin</em> casting of 1434 was based on a certain hand available in some hand-written books, and missing glyphs were supplied by the future King Sejo, one of Sejong’s sons.</p>
      <p>Hangul is a much more interesting example because upon its creation, it was immediately was cast in moveable type. It must be unique among the major writing systems in this respect. The very first document produced using this script, the <em>Hunmin Jeongeum</em> (1446) is a manuscript, but the first Hangul type was cast in 1447 for used in the mixed-script <em>Dongguk Jeong-un</em>, and it was followed in 1449 by <em>Seokbo Sangjeol</em>, the first Hangul document printed in moveable metal type. (Edited because I had this wrong—I thought <em>Hunmin Jeongeum</em> was printed.)</p>
      <p>Even though Hangul is an alphabet, the letters are arranged in syllabic blocks, so the blocks are the basic units for traditional Hangul typeface design. As the number of Hangul syllables is almost endless (see the Unicode chart for Hangul syllables), the situation was similar to that of Chinese characters and again producing Hangul type was a state monopoly until I think maybe the 18th or 19th century. As an invented script, the first Hangul typefaces had really geometric designs (think Futura), and it looks like the same type was used for the glyphs 눈 and 곡 for example, just flipped over. Later typefaces mimicked calligraphy more.</p>
      <p>I thought I would answer about Korean and type in general, but since you specifically asked about typewriters, I’ll add that the first Hangul typewriter was introduced in 1949 by Gong Byeong-u. There are a number of typewriter solutions for Hangul, but I think Gong’s separates syllable-initial consonants and syllable-final consonants as different keys, so it’s called <em>sebeolsik</em> (“three sets”, that is including vowels as the third set of keys). It’s a really beautiful solution, and many modern Hangul typeface designs owe a lot to the letterforms produced by Gong’s typewriter.</p>
