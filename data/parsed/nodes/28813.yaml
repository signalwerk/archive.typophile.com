    html: <p>First, you should clarify whether you really mean ‘alphabet’ in the technical sense of the term. Not all systems of writing are alphabets. The invention of the alphabet preceded type, and the invention of type preceded the use of alphabetic writing systems where it was first used (East Asia). Or do you mean to restrict the discussion to the use of type related to the Roman alphabet, and perhaps you are thinking about the evolution of the canonical letterforms of the alphabet?</p>
