      <p>Simon,<br>
      I studied design and typography with Basle graduates. Ken Hiebert was my typography teacher and a Basle grad. He was a student of Ruder and Hofmann. We used Univers exclusively in those classes in the 60s. Two years later, I met Peter Megert while working at the Westinghouse design Center. He is from Bern and apprenticed with Müller-Brockmann. He ALWAYS used Helvetica. It was clear to him that the Basle people were from a different planet. He would qualify anything about a Basle designer with, "But he is from Basle." said in such a way as if to excuse his failing do to an affliction :-) It would be like saying, "That man just walked into a wall, but then again he is blind." Peter is still a friend and was always a big joker so you have to understand his dry sense of humor. He made many jokes about his Swiss homeland, complaining how boring it was to see nothing but cheese and watches all day--he then would smile and say, "But the chocolate is good."</p>
      <p>ChrisL</p>
      <p>PS: The helvetica in the text of "Graphic Design Manual" may have been a Reinhold idea. Publishers have their workflows you know :-)</p>
