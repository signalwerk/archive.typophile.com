      <p>Simon, I don’t know any particulars, but it is very well possible that Ruder had some interest in Eastern graphics and/or philosophy (I was born after Ruder died, so I cannot speak from memory). However, this is a penchant—should I say a hobby—that many of the designers of the time shared. The view of Japanese and Chinese graphics being the ideal of printing and visual culture was extremely widespread. Not all designers had the insight and zeal of Tschichold, who did really some research on the topics. Others’ knowledge never got beyond Eugen Herrigel’s Zen-books.</p>
      <p>What strikes me is another thing: When I browse to new publications on "Swiss design", I sometimes find that one aspect is undervalued: the fact that almost all of the leading figures of Swiss design were teachers and saw themselves formost as teachers. This ›tradition‹ extends to living designers such as Hochuli and Bosshardt. It is also interesting to see that some of the designers of international fame were happy to live for thirty or forty years in one and the same Swiss city, almost without travelling further than their holiday home in the Swiss Alps once a year! If you compare that to hectic schedule of todays ›stars‹, you might find another reason for the quite and concentrated look of Swiss style of the time. And indeed, I sometimes wonder whether today’s extensive travelling and ›congressing‹ is that helpful for design itself.</p>
      <p>Now I really have to do my work<br>
      F</p>
