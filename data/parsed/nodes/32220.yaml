      <p>My family used to be good friends to the Ruders, and I litteraly grew up surrounded by Swiss style graphics and typography (I don’t think, however, that Emil Ruder—an excellent musician, by the way—was that close to Adrian Frutiger&nbsp;…). I’ve never thought about it, but I think what Simon wrote is perfectly true: There are considerable differences between a Basle version and a Zürich version of Swiss style. It undoubtedly has something to do with the respective protagonists—Ruder, Tschichold and Basel Gewerbeschule vs. Bill and Zürich Kunstgewerbeschule. Add to that a traditional rivalry between the two cities and the different styles of the respective publishers. Ironically, a lot of what is called "Swiss style" today (especially in American publications), Ruder and other Basel teachers would never have approved of. One easily forgets that many Swiss—or Basel—designers of the time had a rather different idea of "Swiss style", including many not-so-sober styles like the ones of Leupin or GGK agency.</p>
      <p>Tout d’ bon to all the Swiss typophiles<br>
      Florian</p>
