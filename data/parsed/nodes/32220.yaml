      <p>Florian &amp; Chris,<br>
      Thank you both for the very interesting info.<br>
      I’d really like to know if Florian remembers the Ruders being interested in Japanese art/eastern philosophy at all, as it seems to be a link between the two schools/currents. Emil Ruder wrote an article called “On drinking tea, typography, historicism, symmetry and asymmetry” for the Typographische Monatsblätter in 1952 (v.2 p.83) which links the relationship between printed and unprinted areas on a page to ideas of ‘empty’ and ‘full’ from Taoism. JM-B was a student of zen for many years and married a Japanese artist (Shizuko Yoshikawa) who studied at Ulm – which must have something to do with him going down to one point size and one weight for the “musica viva” posters in the late 50s and the famous “Akari” poster which is basically a big coloured ‘enso’.<br>
      Re: GKK, Good point, concrete art wasn’t just from Zurich as Basle has it’s own ‘graphic designer and concrete artist’ in GKK’s Karl Gerstner (who did the Swissair corporate identity as well as loads of geometric abstract art). </p>
      <p>Thierry,<br>
      Ha, Ha, very sorry. I somehow don’t think you are the only person on this website who spends too much money on typography books, though.<br>
      Best wishes.<br>
      Simon H.</p>
