    <p>Producing a book on Global Warming and want to study swiss design a little more. I live in BFE and have no library, etc. So I have to for the most part rely on purchasing books and the web. Any good sites out there with some classic swiss style?</p>
    <p>Design archives for AIGA are a little to modern, im looking for the ol' shite. </p>
    <p>Cheers</p>
    <p>James</p>
