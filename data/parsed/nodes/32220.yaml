      <p>I figured they might already be sitting on your bookshelf – but unfortunately a few minutes after I had pressed the “Post comment” button :) </p>
      <p>Re: fonts from Swiss books,<br>
      The interesting thing is that when you look closely at Swiss Typography/objective Typography/International Style you can actually distinguish between the graphic design coming out of Basel and Zurich. The differences seem to have origins in the surprisingly angry 1946 slagging match between Max Bill and Jan Tschichold in the pages of the Schweizer Graphische Mitteilungen, (more in the University of Reading Typography Papers 4, 2000) or a general long-term rivalry between the two cities. Using Univers in a book would be more associated with Basel - Emil Ruder used it a lot (and I believe he and Adrian Frutiger were good friends). For reproductions of Ruder’s book (and children’s book) designs in Univers (and one in Baskerville) check out the excellent article “Emil Ruder, Typography from the inside” by Helmut Schmidt in Baseline 36, 2002. In Zurich Max Bill and the people editing Neue Grafik magazine (Lohse, Müller-Brockmann, Neuburg, Vivarelli) seem to have been concerned with making graphic design that was actually modern (concrete) art for whome Univers was a bit too stylish and flashy and seem to only use AkzGrot and Helvetica in their attempt at ‘zero degrees’ typography that was pure communication with no style (which of course quickly became a style). This is mostly true for book design of the style and the period you are referring to but strangely enough my copy of “Graphic Design Manual” by Armin Hofmann is Univers 55 on the front cover and spine but the rest is Akzidenz which I’ve never really understood at all.</p>
      <p>Un grand “tout d’bon” helvétique,<br>
      Simon H. </p>
      <p>P.S. There’s a heavyweight study on this subject by Zurich-based academic Christoph Bignens called “Swiss Style 1914-1964”, but I’m not sure if it has come out in English yet.</p>
