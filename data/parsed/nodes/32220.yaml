      <p>Hi James,<br>
      For posters “inna Swiss Stylleeee” best is the archive of the Swiss national Library. Type in Emil Ruder, Carlo Vivarelli or whatever into the Search box.<br>
      <a href="http://posters.nb.admin.ch/cgi-bin/gw/chameleon?lng=en&amp;skin=posters" title="http://posters.nb.admin.ch/cgi-bin/gw/chameleon?lng=en&amp;skin=posters">http://posters.nb.admin.ch/cgi-bin/gw/chameleon?lng=en&amp;skin=posters</a></p>
      <p>For book design ask the Arts Council of Switzerland if they can send you “Book Design in Switzerland” by Jost Hochuli<br>
      <a href="http://www.prohelvetia.ch/" title="http://www.prohelvetia.ch/">http://www.prohelvetia.ch/</a></p>
      <p>Order “Designing Books, Practice and theory” by Jost Hochuli and Robin Kinross from Hyphen books.<br>
      <a href="http://www.hyphenpress.co.uk/titles/index.html" title="http://www.hyphenpress.co.uk/titles/index.html">http://www.hyphenpress.co.uk/titles/index.html</a></p>
      <p>If you want to splash out a bit more for some eye-poppingly beautiful coffee table books on the subject go for “The Typographic Grid” by Hans Rudolf Bosshard and “Printed matter, mainly books” by Jost Hochuli (yup, him again) from the Arthur Niggli publishing company.<br>
      <a href="http://www.niggli.ch/" title="http://www.niggli.ch/">http://www.niggli.ch/</a></p>
      <p>Best wishes,<br>
      Simon H.</p>
