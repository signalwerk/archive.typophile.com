  html: |-
    <p>Hey All,</p>
    <p>I'm a fourth year student in the York/Sheridan joint program in Design (York University in Toronto) and we're throwing a fundraiser next week for our fourth year grad show in May.</p>
    <p>There is a ton of lead type up for auction including full fonts (most include all majuscules, minuscules, punctuation and figures) of Univers, Kennerley, Goudy, Times New Roman, Lydian Cursive and almost full fonts of Cooper Black, Bodoni, Bembo, News Gothic. There's also mystery bags of type that include all sorts of different pieces of type in various fonts and weights as well as beautiful paper weights crafted from lead type. This is a once in a lifetime kind of opportunity if you live in the GTA!</p>
    <p>Our event, Ultraviolet, is happening next Sunday (February 8, 2009) at Bar 244 (at the corner of Duncan &amp; Adelaide) and tickets are $22. The night is going to include live music, comedy, hors d'oeurves, dancing, lots of door prizes and a silent auction! </p>
    <p>For more info and to buy tickets check out our <a class="freelinking external" href="http://ultraviolet.apassionatecuriosity.com/" rel="nofollow">website</a>.</p>
    <p>Check out auction <a class="freelinking external" href="http://www.flickr.com/photos/ysdn_ultraviolet/" rel="nofollow">Flickr photostream</a>. </p>
    <p>All money raised from this event will go towards the 2009 YSDN Grad Show, Wonderlust, May 10-14 at Steam Whistle Brewery. </p>
    <p>Thanks!!</p>
