      <p>@Tim</p>
      <p>&gt;Internet Explorer does not support style linking in connection with @font-face.</p>
      <p>This is incorrect, yes. font-style and font-weight are supported quite well. But in a different way than is proposed in the CSS3 spec. (In short, certain data must be congruent with the style and weight values in the @font-face declarations. Frankly, in some ways it is a more sure-footed system than what exists in the CSS3 proposal.)</p>
      <p>As the co-creator of <a href="http://eotfast.com">EOTFAST</a> I've had a bit of leg up on this because I was able to create compressed EOT files very quickly and easily and therefore test quickly and easily.<br>
      See the documentation for EOTFAST for more details on this.<br>
      In fact, I'm proposing to deliver a paper on preparing fonts for IE 6, 7, and 8 at Atypi in Dublin later this year.</p>
      <p>Also, here is a <a href="http://readableweb.com/fontface/sc/droidfamilytest.htm">test page</a> with a complete font-family declared and, in IE, you'll see the regular, italic, bold, and bold italic faces appearing just as they should.<br>
      A more complicated page, featuring a wide variety of fonts in different weights and styles is here:<br>
      <a href="http://readableweb.com/fontface/tenfree/tengreat.htm">Ten Great Free Fonts Cross Browser</a>. (Informal notes on what was done to prepare the fonts are at the bottom of the page.)</p>
      <p>Tip: There seems to be much blind ideological hatred of Microsoft and Internet Explorer. There is also a point of view that would like to see widespread use of @font-face postponed for as long as possible.<br>
      Unfortunately, in an effort to drive both agendas, it's gotten to the point where misleading statements like, "IE does not support style linking in connection with @font-face" are being made even by those who know it's inaccurate.</p>
      <p>Rich</p>
