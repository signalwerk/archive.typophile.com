      <p>@sii</p>
      <p>&gt;The alleged problems relate to styles beyond the basic four that GDI understands.</p>
      <p>I don't understand. What is the meaning of the "basic four styles" in this context?<br>
      CSS allows only two values for font-style. Normal or italic(or oblique).<br>
      Numeric values for font-weight aside, are the four you are referring to the four produced by the combination of font-style and <em>font-weight</em> which has "bold" and "normal"?<br>
      So that the two combined like this will have IE apply the bold italic, or bold...</p>
      <p>For Bold:<br>
      font-weight:bold;<br>
      font-style:normal;</p>
      <p>For Bold Italic:<br>
      font-weight:bold;<br>
      font-style:italic;</p>
      <p>Please explain.</p>
      <p>@tim ahrens<br>
      The CSS for the "Ten Great Free" page was taken exactly from the original page which used "raw" TTF and OTF fonts only and so did not display in IE.<br>
      The point of the page is to show that, as long as the fonts are appropriately prepared, exactly the same CSS will work cross-browser.<br>
      Yes, the way the font families are declared is quite strange, but that's the way it was done, I just preserved it.</p>
      <p><em>Looks like the style linking strategy for EOT will be the same as for normal fonts (at least with respect to those records intended for MS apps).</em></p>
      <p>Not quite sure what this means without seeing the match-up between the CSS and the fonts.</p>
      <p>The PDF documentation that accompanies <a href="http://eotfast.com">EOTFAST</a> might help some, too.</p>
      <p>Rich</p>
