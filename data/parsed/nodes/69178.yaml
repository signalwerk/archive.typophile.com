    <p>I have read many sources that say Internet Explorer does not support style linking in connection with @font-face.<br>
    However, everything I tried (with IE8/WinXP) worked just like it should, with style-linked fonts, I simply cannot produce that alleged bug.</p>
    <p>Have the problems been fixed now? Or are they version-specific? Are there any online examples/demonstration websites that use style linking and are not displayed correctly in IE?</p>
