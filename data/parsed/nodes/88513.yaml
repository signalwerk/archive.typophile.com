      <p>Your current choice looks a goot fit. However, I want to mind you it is "yet another bold Hei(=sans-serif) font" and may or may not be too common.</p>
      <p>As far as I remember, there are not many bold sans Simplified Chinese fonts shipped with OSes anyway. Check Microsoft Yahei-Bold(from Windows) and Hiragino Sans GB W6(from MacOSX) to see if your choice is too "common".</p>
      <p>And, here are some more foundries to look at:<br>
      <a href="http://www.foundertype.com/" title="http://www.foundertype.com/">http://www.foundertype.com/</a><br>
      <a href="http://www.arphic.com/" title="http://www.arphic.com/">http://www.arphic.com/</a></p>
      <p>Finally, for 汉鼎 fonts, I (as a native Chinese) googled a few times but failed to find the official website... So be ware.</p>
