      <p>A "bold slab serif" face would be roughly equivalent to a bold <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ming_(typefaces)" rel="nofollow">Song/Ming</a>-style face.</p>
      <p>[HDZB_35] may be a candidate.</p>
      <p><img src="http://www.clearchinese.com/images/fonts/HDZB_35.gif"></p>
      <p><a href="http://www.clearchinese.com/resources/fonts.htm" title="http://www.clearchinese.com/resources/fonts.htm">http://www.clearchinese.com/resources/fonts.htm</a></p>
      <p>Also check out <a class="freelinking external" href="http://www.dynalab.com/language/en-US/Products/OpenType_Fonts.aspx" rel="nofollow">DynaComware/Dynalab</a>.<br>
      (Products &gt; Opentype fonts &gt; Select platform &gt; Samples)</p>
      <p><img src="http://www.dynalab.com/Portals/18/img/culligraphic_list.gif"></p>
