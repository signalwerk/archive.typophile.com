      <p>Mandarin is the standard form of *spoken* Chinese in Beijing and is the most standard/common dialect in mainland China. For *written* Chinese, instead of "Mandarin" you should specify "Simplified Chinese" (for mainland China today) or "Traditional Chinese" (for Taiwan and pre-Communist diaspora). Simplified Chinese is used across China, even in all those parts of the country where Mandarin is not spoken.</p>
      <p>Trying to make sense of your second sentence, would it be more clear to say you want a typeface that is NOT the Times of Simplified Chinese? In that case, you should avoid system fonts such as these:<br>
      <a href="http://www.pinyinjoe.com/pinyin/pinyin_xpfonts.htm" title="http://www.pinyinjoe.com/pinyin/pinyin_xpfonts.htm">http://www.pinyinjoe.com/pinyin/pinyin_xpfonts.htm</a><br>
      <a href="http://www.pinyinjoe.com/windows-7/win7-chinese-intro.htm#fonts" title="http://www.pinyinjoe.com/windows-7/win7-chinese-intro.htm#fonts">http://www.pinyinjoe.com/windows-7/win7-chinese-intro.htm#fonts</a><br>
      <a href="http://en.wikipedia.org/wiki/List_of_typefaces_included_with_Mac_OS_X" title="http://en.wikipedia.org/wiki/List_of_typefaces_included_with_Mac_OS_X">http://en.wikipedia.org/wiki/List_of_typefaces_included_with_Mac_OS_X</a></p>
