    <p>Some people say handwriting is dying, but I don't believe them, and I decided it's high time we started bringing back the medieval practice of coming up with shortcuts for writing common words. I write a journal nightly, and last March I came up with a few such ligatures. The original short list has grown a fair amount, so here are the ones I use on a day-to-day basis now:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Bom 071_5240.jpg"></div><br>
    The typographical forms are hypothetical, but I put them here to show how they could be done in a text font and also because they help clarify the forms. Maybe someday I'll bother to put them in a font that I make, but for now I just use the handwriting forms.<p></p>
    <p>Here's an example of them in action in my journal.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Bom_4442.jpg"></div><br>
    (Sorry for the blurry uploads. I don't have a scanner where I am, so I have to make do with my camera.) And here's a transcription of the journal page:<p></p>
    <blockquote><p>websites. I need to keep in mind that focus I felt after / I watched <cite>The Call of the Wild. I had it [for] a little / while, [but] now I'm drifting again.</cite></p>
    <p>&gt;St Patrick's Day [........................] 0059</p>
    <p>The weather [was] wonderful today, [the] warmest it's been in / months. Sean [and] I originally intended to just get groceries / [and] cream cupcake things, [but] we decided it'd be a shame / not to do something outside. /<br>
    [  ¶  ]So after enjoying our cream cupcake things, we went / to try [and] fix that swing under [the] bridge south [of] town. / We managed to raise it, [but] not to get it narrower at [the] top, / [and] some weird kind [of] physics thus prevented us [from] / propelling ourselves by pumping our legs. A bit disappointing, / [but] we also went [and] saw a great little dam a short / walk away, [and] saw minnows swimming around. I waded / [and] it [was] refreshing. I missed liquid water.</p></blockquote>
    <p>So... what do you think?</p>
