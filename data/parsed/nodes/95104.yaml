      <p>I'm a very big fan of "heavy ligation" (by which I mean compounds that cannot be readily deciphered and require conscious learning) and lament the loss of that practice in Greek typography. However focusing on spreading new handwritten forms would put this very high on the list of Things That Cannot Happen. Even introducing new typographic forms (which laymen only have to read, not make) is in Everestian challenge. And when you think about it, since handwriting <em>is</em> become far less relevant (although not threatened with extinction - organisms die, but concepts don't, at most they become dormant) why handicap the results? Simply make notan. Yes, it's harder to make-look-pretty, but it's also harder to eat brussels sprouts than chocolate cake.</p>
      <p>Most of all, the central question is always: Why? If you do this purely as an act of self-expression, that's not design, it's self-centered. Better would be to figure out how it could help other people. I think there very much is a readability advantage to heavy ligation (when done with a lucid and meticulous strategy) but it's very hard to leverage, and even harder to sell.</p>
      <p>The one powerful weapon at your disposal is linguistic context: with the benefit of surrounding words even vaguely decipherable components can come together to deliver the content. But that does mean a ligation should only be deployed when there's enough context, otherwise the individual-letter version should show up. And that's not something our software does yet...</p>
      <p>hhp</p>
