    html: <p>@Number3Pencils – German can be a tad longwinded at times, so German orthographies had a number of rules that, as far as I could tell, existed to save resources and sometimes add a bit of elegance at the same time. One such rule (dropped during last reform) cut three-character runs to two. Hence, river boat traffic changed from 'Flusschiffahrt' to 'Flussschifffahrt'. Ickier than ichor.</p>
