    html: |-
      <p>Given that ß, at least in some older Roman-style typefaces, reveals itself as derived from a ligature of ſ and s, I can't get excited over its loss as "cultural damage"; not all typefaces used for setting English have the ff, fi, ffi, fl, and ffl ligatures - and most typefaces dropped the ct and st ligatures ages ago - and no one complains about that.</p>
      <p>If the Dutch suddenly decided that "ij" is just a digraph of two separate letters, and not a letter in any sense whatever, would this be "cultural damage"?</p>
      <p>While I don't think that the Germans are under any obligation to drop the ß to avoid confusing foreigners, if the increasing level of contact between speakers of different languages means that this unique feature of German is confusing or too much bother or whatever, I don't see this as a harmful form of homogenization.</p>
      <p>When it comes to the x-height of Armenian typefaces, I tend to take the opposite view, and root for the retention of Bolorgir tendencies, because in that case I can't see that anything is gained in making one script look like another.</p>
      <p>If the Armenians, on the other hand, switched to the Latin alphabet, then there would be a gain which <em>might</em> make the cultural loss worthwhile. But a very limited gain - since, after all, this wouldn't make anyone understand the Armenian language who didn't do so already. And the Armenian script has no inherent legibility issues.</p>
      <p>When it comes to the Hebrew alphabet, I could see switching to Latin as advisable. But of course it won't happen, because the cultural concerns are intense with a tie to religion. However, the ancient script was much more legible, and so a "trued-up" version of ancient Phoenician (unlike the nightmare Romanized versions of the Hebrew square script suggested by Gill and Schoenfeld, which I cannot in good conscience recommend) might be a possibility.</p>
