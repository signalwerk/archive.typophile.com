      <p>Basically my long-held (and oft-contested) view is that "painting" the black make sense (in the sense of being unavoidable) when you're writing by hand, but it's an arbitrary design constraint when making forms meant for reading. What does make sense is instead defining the relationship of the blacks and whites (notan) which can only be done "purely" by drawing the boundary between the two. So I would base the compounds not on how you'd [be forced to] originate their bodies by hand, but how their notan would best serve a purpose.</p>
      <p>However, if your purpose is merely to enjoy making and admiring them...</p>
      <p>In any case you might consider focusing in the most frequent words, which in English can be found in the rightmost column here:<br>
      <a href="http://themicrofoundry.com/s_quality.html" title="http://themicrofoundry.com/s_quality.html">http://themicrofoundry.com/s_quality.html</a></p>
      <p>hhp</p>
