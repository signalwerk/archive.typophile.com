      <p>If I were programming these, I would definitely leave them unencoded or put them in the Private Use area. I don't expect these to make it into Unicode unless by some miracle people suddenly think my little idea here is the best thing since alphabetic vowels and start using it all the time. </p>
      <p>The neuroscience angle is interesting, but I think in perspective it hardly matters. My image has 26 symbols on it, some of them analogous to others, all of them (except ampersand) built very recognizably out of relevant letters of the alphabet (and a number, in the case of "between"). That makes for a very light learning load compared to the one placed on, say, a Chinese child.</p>
