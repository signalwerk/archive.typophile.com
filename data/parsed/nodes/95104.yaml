    html: |-
      <p>Learning a new language is confusing. But it gives you power. Same thing with learning a new letter. To me simplification is a succubus, and something like the ß -beyond its nice and useful cultural richness- contains meaning beyond "ss", so it contains value. It also has a nice rich ascender, something lacking in Latin. I wouldn't mind seeing it adopted by English (as long as it's applied discriminately).</p>
      <p>The best reason for Armenians to keep their alphabet (shared to a good extent by Jews/Hebrew and others) is that it helps keep us Armenian, especially when you consider most of us live outside (because of the Genocide). It's something tangible for people -especially subsequent generations- to hang on to, to hang on from.</p>
      <p>BTW, when a script does have readability issues (and they all do) fixing it is much better than replacing the whole thing.</p>
      <p>hhp</p>
