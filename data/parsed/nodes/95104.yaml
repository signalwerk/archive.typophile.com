      <p>I find the image beautiful.</p>
      <p>I am not concerned, at this point, with the fact that these ligatures, or any other form of "heavy ligation", is not likely to come into general use any time soon. What you have done can still be useful, rather than merely self-indulgent, even if all it does is serve as an inspiration to others who might go on to produce something practical.</p>
      <p>Since heavy ligation adds to the burden of learning how to read and write, even if it makes the task easier after the learning is completed, that is a major strike against it. We want children to learn to read and write as quickly as possible, so that while myelinization of the brain is not yet completed they have as much time as possible available for other learning.</p>
      <p>(Ultimately, I think we're going to want to genetically modify ourselves so that our brains don't stop growing at age 2, and so that myelinization is postponed to reflect the fact that we spend more of our lives learning, and start doing later on. Why would we do that? Because some people - including some of those likely to be in positions of power - feel we need more advanced science, more advanced mathematics, than we now have. In order to figure out how to feed everyone, or how to defend ourselves in a nuclear age, and so on and so forth.)</p>
