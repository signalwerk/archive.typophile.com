      <p>This is an interesting attempt. In your above image for me the more worthy parts are not the cumbersomely drawn type designs but the tiny bits above them which you’ve actually written, this is where the music plays. In the designs you try to develop how this could look in formal type, alright. But these designs reveal that you are not familiar enough with the nature of type forms evolving from scribal forms. Many of them look artificial and constructed, not natural.<br>
      My advise would be: keep on with it. Exercise writing with a broad nib pen, study carefully and in extenso the works of Latin scribes. Study their way of writing (!!) abbreviations, and how those forms were subsequently transformed into cast type. Study the tiniest details of that with utmost care. You’ll see by time, your own  inventions will get better by that.</p>
      <p>And look into Capelli (if you didn’t already).<br>
      Last but not least, s a member of MUFI I may also suggest that you have a look at the MUFI recommendation. There are many abbreviational characters listed.</p>
