      <p>I should've been clearer about what I actually expect to happen with these in the future. Basically, I figure I'll always be the only one using them, but I enjoy them, so that's enough for me. However, if someone else picked them up and started writing with them, I'd be absolutely tickled. I have a vague idea that someday I'll write a book and then set it in a font of my own designing and maybe use these. That's the only thing I can think of that might even have half a chance of popularizing the ligatures, but I don't really believe it would. I guess it might make me a little bit more memorable as an author, though.</p>
      <p>Andreas, I looked at the MUFI code chart and there's some really interesting stuff in there. My initial reaction was going to be, "these ligatures are different from the old ligatures, because I don't have the same handwriting or circumstances as any of the old-time scribes. These ligatures are based on me, not the medieval." And I guess that can hold true for the handwritten forms. But looking at the symbols in MUFI, a lot of them do have a certain elegance to them that my drawings don't. If I decide to put these in an actual font, I'll take another look at MUFI. And someday I'll have a broad-nibbed pen to practice with.</p>
      <p>What's Capelli? And Hrant, what's notan? All I get from Google is the design principle of alternating dark and light, but that doesn't seem to make sense. And Té, I'd love to find out more about the German economic script. That wouldn't be Sütterlin, would it?</p>
