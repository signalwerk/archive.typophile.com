      <p><em>If they were to go into the standard, a case for their necessity as characters would have to be made first.</em></p>
      <p>Indeed. A subset of mediaeval Latin scribal contractions were encoded in Unicode, because mediaevalists wanted to be able to transcribe diplomatics as plain text. But it seems to me a poor solution, because a) the set is limited to the most common contractions so only works for some documents and not others, and b) ignores Gothic and Greek abbreviations that scholars also need to deal with. I recently made a font for transcribing diplomatics of both Greek and Latin Byzantine seals and coins, for which the encoded mediaevalist characters were no use at all. So we handle everything with just regular Greek and Latin characters, and the scholars use XML to mark up the diplomatic in the transcription, which is then displayed via OpenType Layout features.</p>
      <p><a href="http://people.mozilla.org/~jdaggett/tests/byzantineseal.html" rel="nofollow">Here is a sample</a>. Note S-like shape in the diplomatic transcription of the obverse side that is actually a contraction for 'ΚΑΙ', which becomes apparent if you copy and paste the text into a plain text editor.</p>
      <p>[The term 'diplomatic' refers to a transcription that represents the appearance of the original text, rather than its meaning. When seals and coins are published, it is usually with both kinds of transcription.]</p>
    html_clean: |-
