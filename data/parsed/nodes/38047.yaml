      <p><cite>&gt;&gt;&gt;the right hand usually gets the task of playing the more complex melodies</cite></p>
      <p>No, that's only true for special arrangements for beginners. In "real" piano scores the melody often moves seamlessly from one hand to the other and the chords are arranged as complex or even more complex as the melody. (The melody is usually just one or two notes, but the chords are 3 to 5 notes at the same time, which is far more difficult to play.)</p>
      <p><cite> &gt;&gt;&gt;The left hand is of course used in guitar playing too, but its job is simpler, holding down the strings.</cite></p>
      <p>No, with the usual guitar the right hand has just to learn to the position of the six strings, but the left hand has to perform a huge number of complicated patterns of chords pressed down over six strings and up to 4 or 5 frets.<br>
      (That's why I said it's stupid that left-handed players change their guitar position. They miss their advantage.)</p>
      <p><cite>&gt;&gt;&gt;I don’t think you can’t be trained to use your “wrong” hand. But it takes extensive training, far more than using your natural hand would.</cite></p>
      <p>But why is that? There's again an easy answer.<br>
      Even if there would be a gene to become left-handed or right-handed, there is no such thing as an imprinted knowledge how to press guitar strings or how to learn to write with the right hand. Like I said: It's all just training. And the training of fine motor skills works equally with both hands. What should cause this to be not equal? I can't think of any plausible reason.<br>
      Of course people "think" that they can learn something more easily with one hand. But why? Because they have already trained it more, so they just have to go the extra mile and don't have to start over with their "weak" hand.</p>
