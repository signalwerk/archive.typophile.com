      <p>Patty,</p>
      <p>The question about Hebrew and Arabic is interesting, and I don't have a really good answer.  Both derive from the Phoenician script, which was also written right to left.  The Phoenicians had access to clay tablets (a la cuneiform), papyrus, metal plates, and animal skins, as well as stone, as Eileen mentioned.  I imagine the early Hebrews had access to the same implements; seems like they wrote on a lot of scrolls.  If the tools most frequently used for writing worked better by being pushed than by being pulled, as perhaps with a chisel, that might incent a right-handed populace to write from right to left.</p>
