      <p>And I'm not disputing that you can train your "wrong" hand to perform at a pretty high level. After all, I'm touch-typing as I write this and most of the more commonly used keys are on the left side of the keyboard. But I maintain that we are born with a preference and yes, "because it's easier" most people just use that same hand both for fine motor stuff and strength.</p>
      <p>When I was a kid I tried to teach my self to write left-handed. I got so it was legible but never very fluid. It is nice to have activities such as guitar or even yoga that force you to use both.  </p>
      <p>It would be interesting to know how handedness works in other animals - how it evolved and why.</p>
