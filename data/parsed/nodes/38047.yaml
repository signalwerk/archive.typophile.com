      <p>There is a common misunderstanding with chiseled type: The stonecutters didn't made the shapes, they just chiseled along a preparatory drawing. The same is true for the Roman Capitals. The shapes (for example the serifs) have their origin in brush writings not in the chiseling itself. Looking at the shapes in the Hebrew alphabet, I would guess the same is true here.</p>
      <p>Ancient Egypt had different writing systems. Which is not surprising, because we speak of several thousand(!) years. Egyptian hieroglyphs were set left to right, right to left and top to bottom. There were also cursive hieroglyphs and later the right to left scripts Hieratic and Demotic. </p>
      <p>The Greeks wrote left to right, right to left and very often »boustrophedon«, where the direction changed in every line. That's why several of our letters got a symmetrical shape, like M which looked very differently in the Phoenician Alphabet.</p>
