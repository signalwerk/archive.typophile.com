    <p>This thread was inspired by the discussion on <a href="/wiki/Do%20designers%20use%20left%20or%20right%20brain%3F" class="freelinking" rel="nofollow">brain hemisphere dominance</a>.  Diagnosing brain hemisphere dominance is rather tricky, and society has associated some mythical properties with hemisphere dominance that have not been supported by science.  But one trait that's somewhat related to hemisphere dominance, and much easier to diagnose, is handedness.</p>
    <p>For present purposes, I suggest we discuss handedness in terms of the Edinburgh Handedness Inventory.  It's not a perfect instrument (there isn't one for assessing handedness)--it has a bias toward mixed handedness.  But it's more widely available than any other common handedness diagnostic.  So if you're game, spend a moment at <a href="http://airto.bmap.ucla.edu/BMCweb/Consent/edinburgh.html" title="http://airto.bmap.ucla.edu/BMCweb/Consent/edinburgh.html">http://airto.bmap.ucla.edu/BMCweb/Consent/edinburgh.html</a> and report your score.  And feel free to share thoughts, anecdotes, etc. about handedness.</p>
    <p>My laterality quotient is -50.0.  I'm primarily a lefty, but there are some things I prefer to do with my right hand, especially throwing and tooth-brushing.  And most of the things on the Edinburgh list other than writing or drawing I generally (but not exclusively) do left-handed.</p>
    <p>Left-handedness is in my genes.  My father is much more left-handed than me, my mother about as much.  I have two left-handed siblings; one is very left-handed and the other more like mom and me.  And I have five right-handed siblings who are all very right-handed as far as I know.  With five lefties and five righties, handedness was an important consideration, especially around the dinner table.</p>
