      <p><cite> True ambidextrousness is rare, but more common among the left-handed, perhaps because they are trying to adapt to a largely right-handed world. </cite></p>
      <p>Exactly! A right-handed has usually no reason whatsoever to train his left hand. The world just fits to his behaviour.<br>
