      <p><cite>I think handedness is very overrated and I even doubt that it lies in our genes. Prefering one hand is just easier, because you have to train just one hand instead of two. If someone thinks to be “very right-handed” or “very left-handed” in my opinion this just means he/she hasn’t tried very much to use the other.</cite></p>
      <p>Sure, you can learn to write with your "wrong" hand as injured people often do, but to say that we become right- or left-handed because it's "just easier" is ridiculous. Why, then, are there left-handed people at all? Have you ever watched a small child learn to throw a ball or start to draw? They always use the same hand.</p>
      <p>My father, who is 76, is left handed. He does everything with his left hand, sports, etc. But when he was a child, the left-handedness was seen as wrong, evil (the Italian word for left is sinistra; you throw spilled salt over your left shoulder to ward off the devil, etc; and by contrast right=right) so he was forced to learn to write with his right hand. As soon as he was old enough he switched back to his left hand but his writing, on both sides, is atrocious. Now, I'm not sure he would have won awards for penmanship either way, but he would probably have legible handwriting now if he'd been allowed to learn to write with the hand that was natural for him.</p>
