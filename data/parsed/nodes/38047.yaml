      <p>It's interesting to read everyone's comments.  Rather that saying that left-handedness was in my genes, I should have said that it runs in my family.  I agree that handedness is probably the result of a combination of genetics, environmental factors, and individual learning, which really muddies the waters when one tries to discuss it.  Still, it fascinates me that the vast majority of the human population ends up strongly right handed.  There must be something to that.</p>
      <p>I agree with Ralf that most of us can learn to do a variety of things with either hand.  I use a right-handed computer mouse, prefer <a class="freelinking external" href="http://www.handedness.org/action/fairdesks.html" rel="nofollow">right-handed desks</a> (although I carry a clipboard to compensate for the odd shape and small writing area), play right-handed musical instruments without complaint (but also without much skill), and so on.  I use right-handed scissors with my left hand, but some scissors are so right-handed (sharp contours for right hand fingers and thumb) that I can't use them.</p>
      <p>My right handed father-in-law practices forcing himself to do things with his left hand--he's a neurophysicist and believes that such exercises may help him retain normal functioning in the event of brain damage.  There's a wonderful book by Jeffrey Schwartz called <em>The Mind and the Brain: Neuroplasticity and the Power of Mental Force</em>.  The author, a neuropsychiatrist, doesn't address handedness specifically, but he does talk about the brain's ability to adapt as a result of conscious training, as when stroke victims teach themselves to use limbs they can no longer feel.  I have no problem believing that any of us could strengthen the neural pathways related to our non-dominant hands, if we invested enough time and effort.</p>
      <p>While there's no hard proof that genetics plays a role in predisposing people toward a certain dominance pattern, there is considerable evidence suggesting as much.  Left-handed parents are significantly more likely to have left-handed children than right-handed parents are, and this effect holds up even among adopted children.  And, for the first time ever, scientists earlier this year identified a specific gene that may influence handedness: <a class="freelinking external" href="http://www.nature.com/mp/journal/vaop/ncurrent/abs/4002053a.html" rel="nofollow">LRRTM1</a>.  But handedness is complex, and no one is near figuring it all out.</p>
      <p>I'd be interested to know whether the distribution of handedness among the Typophiles differs significantly from that of the general population, although such a study is probably not feasable.  I was once in a French class where almost half the class was left-handed.  I don't know what that means, if anything, but the probability of it occurring by chance must be relatively low.</p>
      <p>Patty,</p>
      <p>Thanks for all the interesting information.  It's interesting to hear of a righty who writes with a hooked hand.  Are there any advantages to that approach?</p>
      <p>Gary,</p>
      <p>I have the same problem with baseball (maybe because I've never tried to work on my catching).  I wonder how common it is for people to write with the left hand but throw with the right?</p>
      <p>Thanks everybody for the interesting discussion.</p>
