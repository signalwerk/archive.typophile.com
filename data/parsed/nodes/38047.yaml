      <p>I think handedness is very overrated and I even doubt that it lies in our genes.<br>
      Prefering one hand is just easier, because you have to train just one hand instead of two. If someone thinks to be "very right-handed" or "very left-handed" in my opinion this just means he/she hasn't tried very much to use the other. </p>
      <p>Take a piano player: To become a virtuosic player you need to train both your hand equally. The moves of your fingers are extremly subtle and difficult and require a lot of power and fine coordination of the muscles.<br>
      But if any piano player can use both his hands in such an elaborate way, this also means that everybody can use their "weak" hand for simple usage of household tools or a computer mouse. You just need to take the time to train your hand. </p>
      <p>I usually use my left hand, when it doesn't matter (spoon, tooth brush and so on), but whenever the right hand is more appropriate I use it, for example with the computer mouse. I think it is a very bad idea that left-handed people try to turn everything upside down. It's inevitable to use different scissors for the left hand, but it is stupid to ask for keyboards with a flipped layout or to play a guitar with the strings mounted in the wrong order. It makes everything even worse.</p>
