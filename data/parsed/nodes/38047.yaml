      <p>But the phenomena I refer to is my belief that people are born with a predilection to favor one hand over the other. I think it can be influenced by your upbringing, or by effort, but not triggered by it. I repeat my question, why would anybody be left-handed otherwise? There is nothing to be gained from "training" yourself that way. And given the extensive efforts of previous generations to "train" lefties to use their right hands (to wit: my father) why wouldn't left-handedness just have died out?</p>
