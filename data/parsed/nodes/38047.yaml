      <p>Ralf - just because they don't know WHY people are left- or right-handed, or that it isn't genetic, isn't reason to dismiss the phenomena. Our arms may be identical but our brains are not symmetrical. Before a certain age (like 7 or something) there is far more adaptibility between sides of the brain, as proven by kids with injuries to one half of the brain being able to use the other half for some of the tasks it's not normally programmed for.</p>
      <p>10% of the population is gay, they don't know why, they don't think it's genetic, surely you're not suggesting that's a choice too.</p>
