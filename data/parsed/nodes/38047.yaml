      <p>I've alway considered myself a lefty because I write with my left hand and draw or paint with it when I'm using a real pencil or brush. But I do a lot of things with my right hand---such as throwing a ball--and many things I do with either hand, depending on which is physically more practical in the circumstances. My score on the Edinburgh test was +33.</p>
      <p>Interestingly, I usually use my right hand to control the computer mouse, for routine clicking as well as for drawing and tracing. I think this is because I've used so many computers that weren't my setup that I simply kept the mouse where it had been placed on the right rather than switching it over. I can also use my left hand just as well though, and sometimes switch back and forth in long computer sessions.</p>
      <p>Being of somewhat ambiguous handedness can cause trouble. Playing baseball, for instance, I have to throw with my right hand because I'm totally inept with my left for that purpose. But I also prefer to catch with my right hand! It being impractical to take a glove on and off my right hand, I do use use my left hand, but it feels darned awkward and probably helps explain why I'm always one of the last picked when choosing teams. No problem in hockey, though, where I used to play goal and held the catching mitt in my right and felt totally comfortable with the stick in my left.</p>
      <p>People I don't even know who are lefties often comment when they see me write with my left--e.g. a store clerk when I'm signing a credit card slip. Being part of a "lefty minority" seems to create a brief little bond.</p>
