      <p><cite>You still have not explained why, in your magical world where our hands are equally adaptable, anybody at all would “choose” to be left-handed.</cite></p>
      <p>I think that's the wrong question. It rather should be: When it's not genetic and we could use both of our hands equally, why aren't their 50 % lefties? In my theory the handedness develops in in the first years after a child is born. And obviously a child doesn't make this choice intentionally in terms of how appropriate this might be for a mostly right-handed society. They start to explore the world with their hands. And once they gained some fine motor skills with one hand, there is no need to train the other hand equally, because they already know to handle their toys or whatever. (I already explained this at the beginning of this discussion.)<br>
      My non-scientific belief is, that if we would remove all outside or parental influence on children, we would end up with 50 % lefties and 50 % righties. That's exactly what happens with some animals like crabs. They need to learn motor skills and they develop a handedness. But since they are not tought how to do it, and they don't learn it by adapting their parents behaviour, they choice can go both ways. And so the rate is always 50:50.</p>
      <p><cite><br>
      And why would my father would persist in using his left hand when his teachers etc tried to “train” him out of it?<br>
      </cite></p>
      <p>In my opinion that's a different story. We have to be careful not to mix up the REASONS that cause handedness with the EFFECTS it has on our brains. You already mentioned brain lateralization. I don't deny all those effects, but I believe they are effects, not causes. </p>
      <p><cite><br>
      It could have to do with brain development in the womb or something.<br>
      </cite></p>
      <p>Possible. But isn't it much more likely that it happens in the moment we start to use (-&gt;train) our hands?</p>
