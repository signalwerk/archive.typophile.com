      <p>We obviously won't agree on this and I'm not going to pursue it further however obvious it seems to me.</p>
      <p>I just want to raise again the comparison of homosexuality - which also seems to involve about 10% of the population (except of course Iran, according to it's loony prez). Some argue it's genetic, others insist it's a choice. Nothing is proven. We are obviously born capable of being either homo- or hetero-. In many societies homosexuality is considered a sin, or even a punishable crime. And yet there are homosexuals. In previous generations (and probably still today if you consider Senator Larry Craig) people would try to "train" themselves to be straight, even marrying and having kids. And yet...</p>
      <p>So there are obviously behaviors or whatever you'd call them that are too complex to be attributed to simple nature or nurture. I'm going to repeat the quote that - to me - sums up this debate:</p>
      <p>”Handedness is a complex behavior,” Dr. Geschwind said, ”and no complex behavior has ever been shown to be due to only a single gene without any environmental influence.”</p>
