      <p>Here is very interesting talk by Jeff Hawkins about how the brain works:<br>
      <a href="http://www.ted.com/index.php/talks/view/id/125" title="http://www.ted.com/index.php/talks/view/id/125">http://www.ted.com/index.php/talks/view/id/125</a></p>
      <p>What reminded me of this discussion of handedness were Hawkins examples of facts that are "thumpingly obvious" to everybody but still were wrong, because they were so obvious that nobody was able to step back and see the bigger picture. One of his examples was the Heliocentric Solar System. Back then it was very obvious that the sun goes around the earth, because no one felt the earth moving at incredible speed thru the universe, but they saw the sun going up and down on the sky every day. The ones who studied the paths of the planets and stars found very confusing data. They couln't understand it, because they tried to fit it in the wrong theory. But once the framework was understood all the confusing data was suddenly easy to explain.</p>
      <p>In my humble opinion the same is true for the discussion of handedness. It seems obvious that we are born with a preference for one hand, but there is already enough data to have at least doubts in this theory. Just consider the fact that a very high rate of identical twins don't have the same handedness. To me, this makes it obvious that there must be something wrong with the theory, but some scientist even try desperately to squish those facts in their old theories instead of coming up with a new one.<br>
      Once they would embrace the fact that handedness "develops", suddenly all the data would become easliy explainable. You could explain the handedness of identical twins; you could explain why people like me or skilled musicans or surgeons have no problem at all training both hands equally; why there are more young lefties than old lefties; why crabs become left- and right-handed with a rate of 50:50; and so on and so forth. It could be so simple …</p>
