      <p>The original Hebrew script has straight lines, but in those ancient days, according to what I read, they had both clay and waxed tablets that they wrote in with a stylus. I seriously doubt that they normally wrote whacking away with a chisel and stone, even though they did that for monuments. The current alphabet is a pen-based script which they picked up during the exile in Babylonia (6th century BCE), and switched to. The current letters are written left to right, even though they are laid down right to left.</p>
