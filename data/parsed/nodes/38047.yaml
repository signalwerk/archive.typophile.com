      <p>elizabeth_355 and Quincunx and others point out some of the shortcomings of the Edinburgh inventory; there are so many things that we could do with one hand that it would be impossible to list them all (and the survey would quickly become boring).  With the exception of writing, the list of items seems somewhat arbitrary.  I haven't read up on the inventory enough to know how the particular items were chosen, or how well they predict lateralization of language functions.  It's possible that a different set of questions might yield quite different scores, especially for people who are mixed-handed to some extent.</p>
      <p>One of the uses for the Edinburgh survey in neuroscience is to weed out potential research subjects whose brains may be organized in a non-standard way.  In the vast majority of right-handed people, key language centers are located in the left hemisphere; a larger percentage of lefties (but still a minority) have these language centers in the right hemisphere, or in both hemisperes.  FMRI research involves looking in certain places in the brain for neural activity in response to stimuli, and usually the assumption is made that all subjects' brains are organized in roughly the same way.  The only sure way to validate this assumption would be to actually examine each subject's lateralization, via a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Wada_test" rel="nofollow">Wada test</a> or something similar.  But that would be expensive and time-consuming and expose subjects to unnecessary risks and discomfort, and in the end the researchers would find out that almost all right-handed subjects had the same lateralization (while a minority of the left-handed ones showed other patterns).  So whaddaya do?  Administer a handedness inventory and only accept participants with a score close to +100.  For this particular job, the imperfections of the Edinburgh inventory aren't terribly problematic.</p>
