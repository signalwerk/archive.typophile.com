  - id: 424259
    user: 1133
    date: 2010-08-10T07:24:00
    date_raw: 10 August 2010 - 7:24am
    votes: 0
    html: <p>I would say that the AFDKO 2.5 FontLab macros *might* work in FontLab 4.6, but there is no guarantee. I suppose Adobe never tested that situation, and never made a claim that those macros would work in FontLab 4.6. But the Python API in FontLab Studio 5 is a straight extension of that in FontLab 4.6, and many macros work in both versions.</p>
