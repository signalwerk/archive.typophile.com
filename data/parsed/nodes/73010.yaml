    html: <p>Thank you all for your input. What I am needing to do is add mark to base and mark to mark open type features in a right-to-left font. I know this needs to be done in VOLT or AFDKO which both are new to me. Since I work on Mac I was going to try AFDKO but have not updated to FontLab Studio 5 and in all I’ve read a version of FontLab wasn’t specified.</p>
