    html: <p>I think maybe he wants to use the AFDKO 2.5 FontLab macros in FL 4.6. I don't know if that's possible, but it seems like it could be. I couldn't find any mention in the documentation of which FL version is required. In the macro installation script, it shows where to put the macros if one is using FLS5/Mac, which seems to imply that you need FLS5. Or maybe not.</p>
