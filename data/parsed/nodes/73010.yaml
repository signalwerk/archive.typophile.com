    html: |-
      <p>What exactly do you want to do? Using AFDKO 2.5 (makeotf.exe) to build an OpenType font from a Type 1 font generated by FontLab Studio should be possible with any version.</p>
      <p>You would have to install AFDKO separately and use it outside of FontLab Studio in that case.</p>
