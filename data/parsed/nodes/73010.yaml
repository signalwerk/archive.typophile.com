    votes: 0
    html: <p>You can't do that kind of stuff from within FontLab Studio 5 anyway, even with AFDKO 2.5 and its macros installed. However, you can use AFDKO 2.5 outside of FontLab from the command line. You'll need to write your features as text files. It's all explained in the AFDKO documentation.</p>
    html_clean: <p>You can't do that kind of stuff from within FontLab Studio 5 anyway, even with AFDKO 2.5 and its macros installed. However, you can use AFDKO 2.5 outside of FontLab from the command line. You'll need to write your features as text files. It's all explained in the AFDKO documentation.</p>
  - id: 424566
    user: 1133
    date: 2010-08-12T04:59:00
    date_raw: 12 August 2010 - 4:59am
    votes: 0
    html: <p>If you don't like commandline, you can get Fontographer 5. You can open your FontLab VFBs, point to an AFDKO 2.5 feature definition file, and generate your OTF or TTF from there. The standalone AFDKO 2.5 only builds OTF fonts. Fontographer 5.0 has AFDKO 2.5 integrated but is also able to generate TTF fonts. FontLab Studio 5 only has AFDKO 1.6 integrated, which does not have mark support.</p>
