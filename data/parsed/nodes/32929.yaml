    <p>Hello all, I'm new here and very happy to find you with thanks to Thomas Phinney for pointing the way. Most of my font creation experience is with Type 1 PC fonts, but I'll try and contribute all I can as I learn the OTF format.</p>
    <p>I'm currently updating a Type 1 font we created a loooonnng time ago by opening the Type 1 files in FontLab 4 to create an OTF that we'll use in InDesign for Windows and pass off to a designer for InDesign on the Mac.</p>
    <p>InDesign, however, isn't using the kern pairs in the OTF font. If I generate new PC Type 1 files from FontLab InDesign uses the kern pairs, but not in the OTF font. Other programs including Word 2003 are seeing the kern pairs.</p>
    <p>I have a hunch it may be because InDesign is "smarter" with the OTF than the other programs, but I've not been able to find what it's looking at that is preventing the kerning.</p>
    <p>Many thanks,<br>
    Ken</p>
