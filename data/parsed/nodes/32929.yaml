    html: <p>I have a question which is partially related to this discussion. I'm trying to kern a hebrew font in fontlab (I know how to do it in VOLT, but for my purposes, fontlab is easier). The tip on GSUBs helped the kerning take, but it only works properly on som pairs. With others, instead of kerning the correct letters, it kerns the one before the pair. I don't see any clear pattern. What could be causing this? Also, in VOLT, you can control the values of both letters in the pair, can the same be done in fontlab?</p>
