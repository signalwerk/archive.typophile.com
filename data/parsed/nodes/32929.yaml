    html: <p>In addition to this issue with the kern feature, you also need to be sure InDesign isn't using it's own kerning algorithm. Set kerning to "Metrics" rather than "Optical". Optical kerning in InDesign means the built-in kerning is being ignored, and the kerning engine of InDesign is adjusting things on the fly. The kerning (and general fit) of everything under Optical kerning also changes depending on the size you set your type, so for type designers doing fit and kerning testing, you should avoid InDesign's Optical kerning.</p>
