      <p>Hello,</p>
      <p>FL4 is not really a good choice any more and if possible, you should update to FLS5.<br>
      I assume you already have used the "update kern feature" button in the Kerning Assistance, so that a 'kern' feature shows up in the OpenType Panel.<br>
      However, you also need to add a substitution feature. This can be something as simple as</p>
      <p>liga (<br>
      &nbsp;&nbsp;sub aring by aring;<br>
      ) liga;</p>
      <p>It doesn't do anything visible, it's just for the sake that it's there. (Please exchange the parentheses in the code by braces. Of course this requires that there is an 'aring' glyph in the font.)</p>
