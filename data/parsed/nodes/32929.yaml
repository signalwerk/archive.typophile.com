      <p>&gt; <em>The fact that ‘kern’ feature is not recognized in InDesign</em></p>
      <p>What was happening was that GPOS data was being treated as a subset of GSUB data. So if no GSUB table was included in the font, the GPOS table would be ignored.<br>
      Interestingly, if the font was processed through VOLT, the bug wouldn't be triggered, because VOLT always creates a GSUB table, even if it ends up empty.</p>
