      <p>K.K. -- <cite>Is that a bug in FL4 or something with the OTF format.</cite><br>
      M.S. -- <cite>Neither.</cite></p>
      <p>Sorry if my "better update to FLS5" in this context suggested that it's an FL4 issue.</p>
      <p>The fact that 'kern' feature is not recognized in InDesign is one thing, as Miguel said. (Good to hear this is fixed in the new version!)</p>
      <p>The "update to FLS5" suggestion is unrelated to this.<br>
      Some things have been much refined in FLS5, like the way FL4 generates font names for OTFs, or the way FL4 generates the 'kern' feature. -- However, these are <cite>not serious</cite> issues if I correctly understand your description of your use of FontLab. E.g. it seems you don't use classes for kerning, and in this case the 'kern' feature which FL4 generates should be ok.<br>
      But then, the update is a real bargain ... (If you don't plan to include OT features in future, TypeTools 3 looks like a great tool too. Fewer options, thus less confusing than FLS5 may be at times. I just had a quick look into the demo yesterday.)</p>
      <p>Karsten</p>
