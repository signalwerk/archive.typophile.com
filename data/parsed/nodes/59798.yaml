      <p>This may be disappointing, but Museo is rendered very poorly on Windows:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5851.png"></div><br>
      Problem is in Windows – it displays OpenType PS fonts in Standard rendering in greyscale, which was made for displaying headlines on CRT monitors.<p></p>
      <p>One solution is to convert Museo to OpenType TT (but license says no…) to render it with ClearType. But if ClearType is turned off, hinting becomes more important.</p>
      <p>I am asking myself: will be all good text typefaces for web with TT outlines?</p>
      <p>Some OpenType fonts are more equal than others.</p>
