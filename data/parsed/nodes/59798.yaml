      <p>Getting back to James' earlier advice:<br>
      <cite>Create a test file showing the typeface in use with a variety of since, line length, line spacing, tracking settings applied.</cite></p>
      <p>I made this quick page to test Museo 500 in various browsers:<br>
      <a href="http://nicewebtype.com/tools/rendering/" title="http://nicewebtype.com/tools/rendering/">http://nicewebtype.com/tools/rendering/</a></p>
      <p>... and here's a screenshot for folks without an @font-face-capable browser (thumbnail links to full-sized image):<br>
      <a href="http://farm3.static.flickr.com/2520/3719788306_9abc20120a_o.png" rel="nofollow"></a></p><div class="imageWrap"><a href="http://farm3.static.flickr.com/2520/3719788306_9abc20120a_o.png" rel="nofollow"><img src="http://typophile.com/files/test-page-thumb_5985.png"></a></div><p></p>
      <p>First, about the test page....</p>
      <ol>
      <li>Does this kind of test page have a traditional name? "Spec sheet" doesn't sound quite right.</li>
      <li>Does this include all of the kinds of things you might test?</li>
      <li>Is there a wide enough variety of example values?</li>
      </ol>
      <p>I realize that a test sheet like this is a starting point. Once you see how it looks, you adjust the numbers and check again. But I want to make sure this starting point can be used immediately. No "settings" to fix before using … just plug in a new typeface and go.</p>
      <p>Hmm. I think I need to also show:</p>
      <ul>
      <li>Instances of all-caps</li>
      <li>Light-on-dark text (some browsers thicken it up compared to dark-on-light)</li>
      <li>Colored text –&nbsp;several cases that will reveal how RGB sub-pixel orientation can affect rendering, such as: red on white, red on black, cyan (G+B) on white, cyan on black, and each of those reversed</li>
      </ul>
      <p>What do you all think?</p>
