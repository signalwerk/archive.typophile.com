      <p><em>Is delta hinting of TrueType fonts really necessary? Proper alignment zones and stem widths produce pretty good results.</em></p>
      <p>You can get away with very few delta hints <strong>if</strong> your readers have ClearType turned on.</p>
      <p>I can see it coming, after the web fonts hype will have settled, next thing is we have to explain to web developers what hinting is and why most fonts look like crap on the web, and different on every OS. And then tell them to educate their clients and readers to use a certain antialiasing technology. That's going to be fun.</p>
      <p>And everyone thought "This site is optimized for ..." messages were a thing of the past ;)</p>
