    html: |-
      <p>Given the variety of rasterizing techniques, it looks like it is pointless to expect a single font to perform optimally in all situations.</p>
      <p>It was a goal of OpenType to overcome cross-platform incompatibilities, and it does in some areas, but perhaps not in screen display. </p>
      <p>My feeling at the moment is that I will continue to produce ".otf" PostScript flavored fonts for print work, and these will display well in Adobe applications on both platforms, and for browsing on Macs. For Windows browsing, and therefore for web usage in Internet Explorer, as this is the most-used browser, TrueType will work better. If all browsers end up supporting "EOT light", that is the other format I would publish, in TrueType flavor. </p>
      <p>That should work for a few years, until increased screen resolution makes hinting a thing of the past.</p>
      <p>Is delta hinting of TrueType fonts really necessary? Proper alignment zones and stem widths produce pretty good results.</p>
    html_clean: |-
