    <p>Hi all,</p>
    <p>Web licensing issues aside, what do you think of this type review I wrote recently, and my typeset example?</p>
    <p>Blog post:<br>
    <a href="http://nicewebtype.com/notes/2009/07/09/nice-web-type-likes-museo-and-sans/" title="http://nicewebtype.com/notes/2009/07/09/nice-web-type-likes-museo-and-sans/">http://nicewebtype.com/notes/2009/07/09/nice-web-type-likes-museo-and-sans/</a></p>
    <p>Example:<br>
    <a href="http://nicewebtype.com/fonts/museo-and-sans/" title="http://nicewebtype.com/fonts/museo-and-sans/">http://nicewebtype.com/fonts/museo-and-sans/</a></p>
    <p>If you’re not sure where to start, consider (from the text in the example page itself) any of my opinions about the two faces and how to use them on the web. Do you agree? Do you disagree? Why? Also, please criticize the typesetting of the example itself.</p>
    <p>If we want web typography to be respected as a part of our art and craft, web typesetting deserves our fullest criticism – judging the work on aesthetic merits while accounting for available technologies.</p>
    <p>Tim</p>
