      <p><cite>What’s the best way to quickly (iteratively) check text rendering in a variety of situations?</cite></p>
      <p>Do the same thing you would do to test a typeface before using it in a book. Create a test file showing the typeface in use with a variety of since, line length, line spacing, tracking settings applied. You could do this quickly in Indesign by setting up a basic page with XX, YY, etc. for the numerical values and rapidly change them with the find/replace feature in indesign and applying it to selected text. Litmus looks like a convenient way to see the pages across browsers, but there are free alternatives out there.</p>
    html_clean: |-
