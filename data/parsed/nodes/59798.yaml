    html: |-
      <p>&gt;I am asking myself: will be all good text typefaces for web with TT outlines?</p>
      <p>As long as the resolution drought effects a sizable minority of users whose equipment is purchased by others, I think so. </p>
      <p>As for Museo, It looks like a nice typeface design, but as far as I can tell from the sparse specimen, it is lacking at least one fundamental piece of specification. Today's desktop OS' do not interpret TT's instruction set for horizontal or diagonal positioning of or weight adjusting to stems, so diagonals not required in trunk glyphs, e.g. 'M', are not good design options.</p>
      <p>Much of how one should look at designing such a face, i.e for all scalings/renderings, for all sizes, for all devices, perhaps all glyphs, and for right now, can only be imagined, and then decisions executed in the outline to the best of one's ability, knowing that the x and d dimensions are mostly out of your low resolution control.  Now go do it again? ;-)</p>
      <p>&gt;I need to learn to do TrueType hinting now before the market explodes.<br>
      Those were my exact same thoughts to myself, (in 1989). Is it time for HintCamp II yet?</p>
      <p>Cheers!</p>
