    <p>Hey, I'm new and was directed here by a user on Reddit after I posted <a class="freelinking external" href="http://www.reddit.com/r/typography/comments/h65nn/is_what_ive_written_about_typeface/" rel="nofollow">the same question there</a>; "The fiends at typophile.com would help you greatly on this", I hope he's right and will really appreciate any help. Here's the full submission copy &amp; pasted:</p>
    <p>Background info:</p>
    <p>I should first point out that this isn't any part of any essay - just an introduction to the development of my project. Grammatically it probably has plenty of errors; I'm not too worried about this, but feel free to go Grammar-Nazi on my ass if you wish.<br>
    It's probably worth mentioning that I'm in the UK, where patenting a typeface is different to the US. Also, College and Uni are different things - I'm not currently at a University standard of working.<br>
    Any help, corrections or opinions are greatly appreciated.<br>
    Sources:<br>
    - <a class="freelinking external" href="http://www.gillhams.com/articles/352.cfm" rel="nofollow">Info on UK typeface patenting</a><br>
    - <a class="freelinking external" href="http://books.youworkforthem.com/book/P0022/Dolly" rel="nofollow">Fayherbe / De Vringer's Dolly Catalogue</a><br>
    - General knowledge about piracy.</p>
    <p>Write-up:</p>
    <p>Typeface piracy is so common that it’s almost expected, and knock-off typefaces are very common amongst more popular fonts. To prevent knock-offs the designer has to legally copyright their typeface, and to do this they would have to patent and sell each character of the typeface separately; at about £60 per registration and a typeface usually having at the very least 26 characters, this could cost as much as £1,560 to copyright a typeface of only uppercase or lowercase characters – no punctuation or numbers included. When piracy is so common and easy to get away with anyway, spending this much to prevent knock-offs is quite likely not worth it.</p>
    <p>I think that trying to put a stop to piracy is a losing battle – not only in the design industry, but in the music, film, software and gaming industries too. In an attempt to lessen the effects of piracy in these industries companies usually try to punish those pirating but it usually has little to no impact on the pirates, and instead makes things difficult for honest customers – in turn potentially turning them to pirating too. This is done through things like increasing prices to make up for lost sales, putting anti-piracy ads which can’t be skipped before legal DVD’s, tethering content to an online account so that it can only be accessed as long as an internet connection is maintained, and many other tactics. I think that I can learn from the mistakes that I see in these actions in other industries; these are all attempts at discouraging piracy; I think that instead these industries have to adapt, and to encourage the more ethical option.</p>
    <p>The biggest problem and influence on piracy is that everything being stolen is easily copied, and therefore seems value-less. I guess a pretty obvious starting point would be to go back to physical work – which brings me back to the idea I had while looking at dolly’s catalogue by Fayherbe / De Vringer – giving the client what would effectively be a physical copy of the typeface as well as a digital copy (which would be sent via email and also come attached to the physical copy somehow). This way you’re rewarding honest customers and making the ethical option a lot more tempting. I’ll look into ways to give the client a physical copy of the typeface later, but I already have some basic ideas after looking at Fayherbe / De Vringer’s work.</p>
    <p>Again, thanks for any help!</p>
