      <p><cite>Fonts are not a consumer product but a business expense, and businesses are less inclined to cheat than teenagers seeking entertainment.</cite></p>
      <p>It's also important to note that many of the people using fonts are genuinely people who never have used them or would have purchased them. I used to know a guy whose three-story townhouse was wall-to-wall shelves of burned DVDs more movies, music, and games than he could experience in a lifetime. Like him, plenty of pirates are just geeks who hoard pirated content as a hobby. That has a real impact on the film, music, and game industries, because geeks who hoard content used to be their best customers. But geeks who download font giga-torrents just for the hell of it weren't buying fonts before, and they won't buy them in the future.</p>
