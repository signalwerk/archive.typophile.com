      <p><cite>the fact of piracy as a cost of doing business doesn’t mean that it isn’t a moral wrong</cite></p>
      <p>Right. Didn't mean to imply otherwise. </p>
      <p><cite>have been a condition of the digital font industry since it began, and a background against which it has managed to thrive.</cite></p>
      <p>Yes. "Thrive" being the key word. I've been hearing about the scourge of piracy since I entered the font industry nearly 20 years ago. Yet everyone in the font industry seems better off than they were then. There are more people making fonts, and more people making money off fonts. </p>
      <p>Is there any designer who'd prefer to work in the font industry of 1991 rather than 2011? Even if I made the 1991 version magically piracy-free? I doubt it. </p>
      <p>To go back to the OP, you're painting with an overly broad brush. If anything, the font industry has adapted better to the era of digital distribution than other industries. Perhaps a more interesting avenue of inquiry is why that has been true. Maybe other industries should be taking lessons from the font industry, rather than vice versa.</p>
      <p>I would also encourage you not to get mired in the law of font copyrights. Those laws vary widely among jurisdictions, and in the end don't have a huge bearing on how the font industry operates.</p>
