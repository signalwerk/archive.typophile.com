      <p>I agree with Matthew.<br>
      The scenario you have described doesn't correspond with the reality of being in the font industry, which is supported by people who pay to licence fonts as a matter of course. </p>
      <p>I don't think fonts can be meaningfully compared with other digital products such as music, film, etc.<br>
      Fonts are not a consumer product but a business expense, and businesses are less inclined to cheat than teenagers seeking entertainment.</p>
      <p>At any rate, the putative impediments of piracy, plagiarism, freeware and bundling have been a condition of the digital font industry since it began, and a background against which it has managed to thrive.</p>
