      <p>Matthew: <em>It's not especially productive to look at piracy as this absolute moral wrong to be eradicated. More accurately, piracy is a cost of doing business.</em></p>
      <p>While I agree that it isn't productive to view piracy as a moral wrong <em>to be eradicated</em> -- since such a view may result in devoting time and resources to attempting such eradication that will end up doing more damage to one’s livelihood than the piracy --, the fact of piracy as a cost of doing business doesn’t mean that it isn’t a moral wrong. The pragmatic if reluctant acceptance of a certain level of piracy shouldn’t be taken as endorsement. There is no case of ‘They didn't stop me, so it must be okay’.</p>
