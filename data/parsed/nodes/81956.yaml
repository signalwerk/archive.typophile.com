      <p><cite>The biggest problem and influence on piracy is that everything being stolen is easily copied, and therefore seems value-less</cite></p>
      <p>Fonts don't seem valueless to those who pay for them. </p>
      <p>It's not especially productive to look at piracy as this absolute moral wrong to be eradicated. More accurately, piracy is a cost of doing business. If you cast your eye around the font industry, you'll notice that just about everyone chooses to keep selling fonts despite the costs of piracy.</p>
      <p>Put it another way: if your thesis fails to explain observable reality, there's a flaw in your thesis.</p>
