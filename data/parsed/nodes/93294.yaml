    <p><a title="How to Use FF Chartwell" href="http://www.fontfont.com//how-to-use-ff-chartwell" rel="nofollow"></a></p><div class="imageWrap"><a title="How to Use FF Chartwell" href="http://www.fontfont.com//how-to-use-ff-chartwell" rel="nofollow"><img src="http://typophile.com/files/ffchartwell-color-7features_4980.png"></a></div><p></p>
    <p>Designed by <a title="Travis Kochel" href="http://www.fontfont.com/designers/travis-kochel" rel="nofollow">Travis Kochel</a>, <a title="FF Chartwell" href="http://www.fontfont.com/fonts/chartwell-lines/packages#46910" rel="nofollow">FF Chartwell</a> is a fantastic typeface for creating simple graphs. Driven by the frustration of creating graphs within design applications and inspired by typefaces such as <a title="FF Beowolf" href="http://www.fontfont.com/fonts/beowolf" rel="nofollow">FF Beowolf</a> and <a title="FF PicLig" href="http://www.fontfont.com/fonts/piclig" rel="nofollow">FF PicLig</a>, Travis saw an opportunity to take advantage of OpenType technology to simplify the process.</p>
    <p>FF Chartwell (<a title="FF Chartwell Pies" href="http://www.fontfont.com/fonts/chartwell-pies" rel="nofollow">Pies</a>, <a title="FF Chartwell Lines" href="http://www.fontfont.com/fonts/chartwell-lines" rel="nofollow">Lines</a>, <a title="FF Chartwell Bars" href="http://www.fontfont.com/fonts/chartwell-bars" rel="nofollow">Bars</a>) was originally released in 2011 under the <a title="TK Type" href="http://tktype.com/" rel="nofollow">TK Type foundry</a>. In 2012, it was added to the FontFont library with the addition of four new chart styles, the Polar Series as well as <a title="FF Chartwell Bars Vertical" href="http://www.fontfont.com/fonts/chartwell-bars-vertical" rel="nofollow">Bars Vertical</a>.</p>
    <p>The Polar Series (<a title="FF Chartwell Rose" href="http://www.fontfont.com/fonts/chartwell-rose" rel="nofollow">Rose</a>, <a title="FF Chartwell Rings" href="http://www.fontfont.com/fonts/chartwell-rings" rel="nofollow">Rings</a>, and <a title="FF Chartwell Radar" href="http://www.fontfont.com/fonts/chartwell-radar" rel="nofollow">Radar</a>) is a set of new designs, which take on the form of more experimental charts. In an effort to make the charts smarter and more dynamic, each design reacts not only to the data entered, but the number of values.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ff59_chartwellmetaserif_600_6560.png"></div><br>
    <em>FF Chartwell Radar with <a href="http://www.fontfont.com/fonts/meta-serif" rel="nofollow">FF Meta Serif</a></em><p></p>
    <p>Find out <a title="How to Use FF Chartwell" href="http://www.fontfont.com/how-to-use-ff-chartwell" rel="nofollow">how to use FF Chartwell</a> and download the <a title="FF Chartwell User Manual" href="http://www.fontfont.com/staticcontent/downloads/FF_Chartwell_User_Manual.pdf" rel="nofollow">User Manual</a>.</p>
