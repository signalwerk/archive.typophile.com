    html: "<p>Baskerville italic: Yes, it's quite nice, especially in the lc. But I think the distribution of swashiness in the UC is a bit hare-brained. <br> <br>Transitional (Neoclassical) versus Modern (Romantic): I much prefer the former; I would say the latter is too much of a good thing. And the duality you mention in the Neoclassical genre is an astute observation; it's something that I'm trying to resolve well in my revival, by balancing lachrymal and pointy terminals, soft and hard transitions, etc. <br> <br>hhp</p>"
