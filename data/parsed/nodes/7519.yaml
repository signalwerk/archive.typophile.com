  html: "<p>It seems Typophile threads have the attention span of Linotype slugs, so Dan's RdR thread has to be reincarnated yet again... <br> <br>From: <br><a href=\"http://www.typophile.com/forums/messages/30/51336.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/51336.html</a> <br> <br>Dan, in doing some research on Baskerville, I found an article by Bringhurst about Neoclassical types in an issue of Serif, and in it he's brought together many useful aspects of the RdR's development; for example he mentions the provenance of the various italics. If you'd like a copy (although some parts of <i>my</i> copy are actually hard to read) just give me your ground address. <br> <br>hhp</p>"
