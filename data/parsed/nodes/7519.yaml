    votes: null
    html: <p>The RdR marks the beginning of neoclassical type design. Although aspects of the style of the type belong to the baroque, the rationalist circumstances of its design make it part of the neoclassicist project. One could take the view that the work of the committee was neoclassicist, and Grandjean's interpretation of that work was more baroque.</p>
    html_clean: <p>The RdR marks the beginning of neoclassical type design. Although aspects of the style of the type belong to the baroque, the rationalist circumstances of its design make it part of the neoclassicist project. One could take the view that the work of the committee was neoclassicist, and Grandjean's interpretation of that work was more baroque.</p>
