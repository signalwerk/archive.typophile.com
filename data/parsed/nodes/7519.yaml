    html: <p>Hrant, I got your article in the mail today� that was super-fast. Thank you. Looking through the article, two things jumped out at me, which hadn't been at the fore of my thoughts in a while. <br> <br>The first is that Baskerville Italic is just beautiful. I mean fantastic, wow� I don't know how I could just forget things like that� <br> <br>The second was Bringhurst's idea about neoclassical type design, and its place as the "missing link" between Baroque type and Modern faces (which he calls Romantic). I was familiar with this from <i>Elements�</i> already, but I'm glad to have something that expresses his ideas deeper.  <br> <br>Part of what I find so interesting about these faces is that they seem to have a dillemma between the hand and the mind. They are conscious, thought out designs (so were older faces�), but it seems that 18th Century designers wanted you to KNOW that they were thinking about form, and that they weren't going to make forms just by using the easiest methods� i.e., the way that the humanists did when they cut forms that were inspired directly by handwriting styles. <br> <br>Of course, Didot and Bodoni take this even further, and create type that is more about style and interpretation more than anything esle. Their work is brilliant, but I can't identify with it personally. It feels so remote, cold, technical, or even mathematical. Even though it isn't. <br> <br>Ahh, back to RdR� I'm going to work on the the slanted roman first, curved v's and everything. I'll post something in the critique forum by the end of the year.</p>
