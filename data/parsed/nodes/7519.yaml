    date: null
    date_raw: null
    votes: null
    html: "<p>I think the identification of neoclassical type design as the stage between baroque and romantic is fairly obvious, both in terms of the chronology of Baskerville's work and its relationship to contemporary art, music, architecture, etc. It is precisely the ability to put type design in the broader cultural context that makes this art-historical terminology so much preferable than the specialised terminology of 'transitional' and 'modern', which are meaningless in any broader context. <br> <br>Robert's real piece of brilliance in this area is, I think, the identification of <i>rococo</i> type design: the final flourishing of baroque before the restraining order of the neoclassical. This has contributed to a new interest in the work of Rosart and Fleischmann, which is very welcome.</p>"
    html_clean: "<p>I think the identification of neoclassical type design as the stage between baroque and romantic is fairly obvious, both in terms of the chronology of Baskerville's work and its relationship to contemporary art, music, architecture, etc. It is precisely the ability to put type design in the broader cultural context that makes this art-historical terminology so much preferable than the specialised terminology of 'transitional' and 'modern', which are meaningless in any broader context. <br> <br>Robert's real piece of brilliance in this area is, I think, the identification of <i>rococo</i> type design: the final flourishing of baroque before the restraining order of the neoclassical. This has contributed to a new interest in the work of Rosart and Fleischmann, which is very welcome.</p>"
