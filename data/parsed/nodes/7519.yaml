    html: "<p>Hrant, I think I found another book for you to look at. This is a sweet little small edition, I think. It is called <i>Von der Romain du Roi zu den Schriften J.G. Justus Erich Walbaums: Eine Schriftstudie</i>, which means--\"from RdR to the typefaces of J.G. Justus Erich Walbaum; a study.\" It was written by Gustav Bohadti, and published by H. Berthold AG in Berlin and Stuttgart, 1957. <br> <br>It has a print of RdR paired with Granjean's true italic, from 1702. And then the same text is printed again with RdR and Alexandre's true italic, from 1712. <br> <br>Then come copies of specimen pages from Fournier, Didot, and Bodoni. Here's the cool part: it has one print comparing text set in RdR with Fournier, Didot, and Bodoni texts. <br> <br>And there is also a lot of text about Walbaum and H. Berthold AG, but that isn't as relevant to the forematter about RdR.</p>"
    html_clean: "<p>Hrant, I think I found another book for you to look at. This is a sweet little small edition, I think. It is called <i>Von der Romain du Roi zu den Schriften J.G. Justus Erich Walbaums: Eine Schriftstudie</i>, which means--\"from RdR to the typefaces of J.G. Justus Erich Walbaum; a study.\" It was written by Gustav Bohadti, and published by H. Berthold AG in Berlin and Stuttgart, 1957. <br> <br>It has a print of RdR paired with Granjean's true italic, from 1702. And then the same text is printed again with RdR and Alexandre's true italic, from 1712. <br> <br>Then come copies of specimen pages from Fournier, Didot, and Bodoni. Here's the cool part: it has one print comparing text set in RdR with Fournier, Didot, and Bodoni texts. <br> <br>And there is also a lot of text about Walbaum and H. Berthold AG, but that isn't as relevant to the forematter about RdR.</p>"
