      <p>Yeah, it looks like they changed the G, which was a sort of quirky letter that may have looked too much like a C in the original version, but I don't see it as an alternate in the font itself. Speaking of 'Original', that word on the package looks like our own Mark Simonson's <a class="freelinking external" href="http://new.myfonts.com/fonts/marksimonson/coquette/">"Coquette"</a>. </p>
      <p>- Mike Yanega</p>
