  html: |-
    <p>Hi guy's</p>
    <p>Just got this job for a close friend of mine starting up a coffee shop. he just wants a simple logo type identity nothing fancy, but it really is proving difficult to select an appropriate type face that sits well with all the letter forms for the company name chosen as its quite repetitive in terms of letters. the company name is ( COFFEE-CORNER ) chosen by him not me and yes ive tried to get him to change it buts thats what he wants, and yes you guessed it the shop is on the corner of the parade :)</p>
    <p>so as i mentioned above its repetitive in letter form with 2 c's, 2 o's, 3 e's, 2 f's, 2 r's which is making is a challenge to select a face that sits well with those characters as a name. geometric form is working ok but looks bland and its to over used.I  wouldn't mind exploring creative ligature use for the double ff or double e possibly?</p>
    <p>the business will do both coffee and food and the typeface will have to reflect that too.</p>
    <p>as its mates rates the budget is quite high for the font purchase ;)</p>
    <p>so type experts any suggestions to a solid typeface thats gonna brings this name to life?</p>
    <p>I look forward to your suggestions.</p>
