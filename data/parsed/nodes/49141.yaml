    <p></p><div class="imageWrap"><img src="http://typophile.com/files/THUMBNAIL_ADRIANE_LUX_BANNER_TYPOPHILE_6036.gif"></div><p></p>
    <p><a href="http://www.typefolio.com" rel="nofollow"><strong>Typefolio</strong></a> - a new brazilian type foundry - is proud to announce the release of <strong>Adriane Lux</strong>.<br>
    -<br>
    <a href="http://www.myfonts.com/fonts/typefolio/adriane-lux/" rel="nofollow"><strong>Adriane Lux</strong></a> is the decorative, "inline" or "openface" titling companion to Marconi Lima's acclaimed <strong><a href="http://www.myfonts.com/fonts/typefolio/adriane-text/" rel="nofollow">Adriane Text</a></strong>. This single weight offering is modeled after the Regular weight of the primary family.</p>
    <p>While <strong>Adriane Text</strong> is intended for thoroughly classical book design, <strong>Adriane Lux</strong> enters the fold as an equally traditional display face. Have it foil-stamped on your next faux-leather book cover design or embossed on your personal calling card for a touch of well-behaved, regal formalism.</p>
    <p>More about:<br>
    <a href="http://www.typefolio.com" rel="nofollow"><strong>Typefolio</strong></a></p>
    <p>Our Partners:<br>
    <a href="http://www.myfonts.com/foundry/typefolio/" rel="nofollow"><strong>MyFonts</strong></a><br>
    <a href="http://www.typetrust.com/designer/marconilima" rel="nofollow"><strong>TypeTrust</strong></a><br>
    <a href="http://www.veer.com/products/browse.aspx?vendor=CTT&amp;page=&amp;view=browse" rel="nofollow"><strong>Veer</strong></a></p>
