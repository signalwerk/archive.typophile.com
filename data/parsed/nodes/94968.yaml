    html: <p>Interesting. There was another famous example along similar lines (though nowhere near as extensive) back in 1968 when six well-known book designers were invited by Hammermill Paper Company to design Kafka’s <cite>The Trial</cite>. A comparison of the results was published as <cite>The Trial of Six Designers</cite>.</p>
