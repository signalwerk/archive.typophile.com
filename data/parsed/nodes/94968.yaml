    <blockquote><p><img src="http://www.graphicdesignand.com/images/uploads/content/page1-real-9-630-402.jpg"><br>
    an unusual typographic experiment designed to explore the relationship between graphic design, typography and the reading of a page. [it] collects the responses of 70 international graphic designers when posed with the same brief – to design and lay out the first page of Great Expectations by Charles Dickens, a text chosen in part because it directly references lettering as Pip searches for clues about his family from the letterforms inscribed on their tombstone. The brief encouraged the 70 contributors to explore, challenge or celebrate the conventions of book typography. Each layout is accompanied by a short rationale explaining the designer’s decision-making process.</p></blockquote>
    <p>For those unfamiliar with the text, here is a relevant passage:</p>
    <blockquote><p>As I never saw my father or my mother, and never saw any likeness of either of them (for their days were long before the days of photographs), my first fancies regarding what they were like, were unreasonably derived from their tombstones. The shape of the letters on my father's, gave me an odd idea that he was a square, stout, dark man, with curly black hair. From the character and turn of the inscription, "Also Georgiana Wife of the Above," I drew a childish conclusion that my mother was freckled and sickly. </p></blockquote>
    <p>Whoops… I forgot a link: <a href="http://www.graphicdesignand.com/outputs/bliss/page-1/" title="http://www.graphicdesignand.com/outputs/bliss/page-1/">http://www.graphicdesignand.com/outputs/bliss/page-1/</a></p>
