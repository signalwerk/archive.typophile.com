    html: |-
      <p>seems like an old post, but I'd like to point out some obvious problems.</p>
      <p>1. The line length is too long<br>
      2. If the bottom of the italic title for the 3 piece is lined up with the third line, why not the first two. I don't understand the significance of putting the titles one line below the numbers.<br>
      3. Depends on what sort of paper size you're printing on, the point size could be a bit smaller.</p>
      <p>I like the color and the font itself.</p>
