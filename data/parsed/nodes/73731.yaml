    html: |-
      <p>You can always dig deeper, and some typefaces have traits from more than one category. I honestly don’t use classification a lot, but the categories that make sense to me are:</p>
      <ul>
      <li>Serif</li>
      <ul>
      <li>Old style</li>
      <ul>
      <li>Venetian</li>
      <li>Aldine/Garalde</li>
      </ul>
      <li>Transitional</li>
      <li>Modern</li>
      </ul>
      <li>Sans serif</li>
      <ul>
      <li>Humanist</li>
      <li>Grotesque</li>
      <li>Geometric</li>
      </ul>
      <li>Slab serif</li>
      <ul>
      <li>Humanist</li>
      <li>Grotesque — <em>Hmm? Not sure if I’ve ever seen one.</em></li>
      <li>Geometric</li>
      </ul>
      <li>Other</li>
      <ul>
      <li>Scripts — <em>I have to dig deeper into this</em></li>
      <li>Blackletter — <em>I have to dig deeper into this as well</em></li>
      <li>++</li>
      </ul>
      </ul>
      <p>Monospaced fonts and pixel fonts are often grouped on the side but I happen to think that’s a bad idea. The usually fit into one of these categories.</p>
      <p>Apart from that, I also operate vaugely with, and might not fully grasp yet, terms like Egyptienne, Italienne, Scotch, Semi serif, Cursive (often connected to the roman, but still something completely different) and a few others I can’t think of at the moment. Edit: I can think of Fleischmann, but that’s only because I always think of it as so unique it doesn’t really fit in any other category (in my mind).</p>
