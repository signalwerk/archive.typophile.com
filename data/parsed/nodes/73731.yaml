      <p>That's the idea – classifications should be there to help the user, not please the art historian. That's why I'd like to get rid of the historic terms altogether.</p>
      <p>As for classifying scripts, that can be done according to the same or similar model: the (former) writing tool which determines the type of contrast and principle of form. Roughly that is broad nib/old style/humanist/chancery, pointed nib/modern/grotesque/roundhand, round nib/geometric/free</p>
