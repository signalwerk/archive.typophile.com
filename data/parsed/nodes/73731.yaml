  html: |-
    <p>I'm finding some slightly conflicting information regarding classifying type. After researching Vox's classification system, researching modern type (that added several new factors to typeface classification), I'm still not sure if there is a 100% correct way to classify typefaces.  I've seen the following categories in different resources (printed, not online resources):</p>
    <p>v1<br>
    - Old Style<br>
    - Italic<br>
    - Transitional<br>
    - Modern<br>
    - Egyptian/Slab Serif<br>
    - Sans Serif</p>
    <p>v2<br>
    - Archaic<br>
    - Old Style (aka Classical)<br>
    - Transitional<br>
    - Modern<br>
    - Sans Serif<br>
    - Slab Serif<br>
    - Graphic/Display</p>
    <p>Any of these correct categorizations in terms of historical as well as modern day context? Can anyone shed some more light on the situation?</p>
