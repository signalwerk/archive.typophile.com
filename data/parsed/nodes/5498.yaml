  html: |-
    <p>Hi guys, <br> <br>Sometimes when I'm designing I want to preview a font just to see if I like it. I have a lot of stuff offline, but don't want to go the whole time online to preview it. I also don't want to install it in FontAgent and remove it after 2 seconds when I see it's not the font I was looking for. <br>Before I used FontGander to preview my fonts and that worked perfect for me. But now that we are on OSX I can't seem to find a (preferably) freeware program that allows me to see a font before I install it. That's too much of a hassle and could mess up my allready installed fonts. <br> <br>Is there someone that knows a good program that meets my expectations? <br> <br>Thanks, <br></p>
    <div class="forum-topic-navigation clear-block"><a href="/node/5432" class="topic-previous" title="Go to previous forum topic">‹ Tattoo font...</a> <a href="/node/5486" class="topic-next" title="Go to next forum topic">&amp;#39;Whitney&amp;#39; by Hoefler &amp;amp; Frere-Jones ›</a></div>
