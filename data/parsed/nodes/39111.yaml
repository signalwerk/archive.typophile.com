    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 14.Nov.2007 2.15pm </div>
      <p><strong>The new Scanfont 5!</strong><br>
    <em>Make fonts from most anything.</em></p>
    <p><a href="http://www.fontlab.com/"></a></p><div class="imageWrap"><a href="http://www.fontlab.com/"><img src="/files/scanfont5news111407_5979.jpg"></a></div><p></p>
    <p>   ScanFont has long been the best tool for turning scans into fonts. Anything you could fit into a scanner you could quickly turn into a TrueType or Type 1 font. Now with the new version 5 you can do even more even easier and faster!</p>
    <p>ScanFont 5 Splash     This new version of ScanFont acts as a plugin for any of our font editors - TypeTool, Asiafont Studio, and FontLab Studio (and soon Fontographer, too). SF5 is optimized for scanning glyphs for autotracing into fonts, but it also gives you complete control over the scanning and autotrace process. You can adjust trace tolerance, curve fit and linearity to suit your subject, thus assuring the cleanest and most accurate scan possible so that the final font character requires little or no editing.<br>
         With its new, improved GUI, new filters, and new tools (like smart background removal)  ScanFont is perfect for making handwriting fonts, symbol fonts,  clipart fonts, signature fonts, or any other font from print or bitmap source material.</p>
    <p><strong>Your Price: US$99</strong><br>
    <strong>Upgrade Price: US$29.95</strong></p>
    <p>     For Windows users ScanFont is now unbundled from TypeTool. But we’re offering a special TypeTool 3 upgrade bundle if you want to upgrade both Typetool and ScanFont at one time.<br>
         Give your creativity a boost today! Just visit the fontlab.com website and download a demo version of Scanfont 5: <a href="http://www.fontlab.com/font-converter/scanfont/" title="www.fontlab.com/font-converter/scanfont/">www.fontlab.com/font-converter/scanfont/</a></p>
    <p>Sincerely,<br>
    Ted Harrison<br>
    Fontlab Ltd.</p>
