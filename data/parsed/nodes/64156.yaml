      <p>Hi Marius,<br>
      which logo?</p>
      <p>#1 is <a href="http://new.myfonts.com/fonts/urw/lucida-big-casual/">Lucida Big Casual</a> aka <a href="http://new.myfonts.com/fonts/apple/textile/">Textile</a>.</p>
      <p>#2 is a slanted <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/britannic_ot/">Britannic</a>.</p>
      <p>#3 looks a lot like <a href="http://new.myfonts.com/fonts/adobe/berling/alternate_cuts.html">Berling</a>, only the ‘K’ is off – maybe customized.</p>
      <p>F</p>
