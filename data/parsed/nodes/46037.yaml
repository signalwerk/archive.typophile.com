      <p>Szabolcs, </p>
      <p>The problem with the ogonek positioning in the Junicode font is that somebody thought they are centered, with of course isn't true. The top of the ogonek has been positioned at the geometric centre of the base glyph, but of course _optically_ the ogoneks are positioned in the left part of the letter, which looks absurd. And it's the optical impression that counts. </p>
      <p>It is quite easily fixed and does not require redrawing the U, and also solves the O problem (my changes are on the right):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Oogonek_Uogonek_4407.png"></div><p></p>
      <p>Now, the ogoneks are slightly to the right. One could also try attaching them really in the optical centre if one wants (i.e. just slightly more to the left than what I did, but definitely not as far to the left as in the original glyph which is shown in the middle):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Oogonek_Uogonek1_4958.png"></div><p></p>
      <p>But the most important thing is that you _cannot_ just stick a composite ogonek onto O or U or e or even a, for that matter. You need to redraw the junctions every time. </p>
      <p>Adam</p>
