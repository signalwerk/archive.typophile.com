      <p>IMO, the ogonek should harmonize with the other accents, so should compare to the acute accent in the same way that the circumflex does.</p>
      <p>If you are going to put a legged Uogonek in your typeface, you should make the standard U have a leg, as in Perpetua or Giovanni.</p>
