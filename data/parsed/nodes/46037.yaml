      <p>This is an old thread, but <a href="http://inamidst.com/stuff/archive/Junicode.pdf" rel="nofollow">a PDF on Junicode</a> has the following explanation:</p>
      <p><cite>Because Junicode has been designed for medievalists, some of the default<br>
      letter-shapes are wrong for modern languages: for example, eogonek<br>
      (ę) is correctly shaped for medieval Latin but looks poor in Polish.</cite></p>
      <p>I don't know if the shape in Junicode is indeed correct for the 'e caudata' of Latin palaeography, but at least that explains why the glyph doesn't work very well for the Polish 'e ogonek'.</p>
      <p>This is another example of superficially similar diacritics that are unified in Unicode having subtly different shapes in different traditions. The 'o with a hook' used in Old Norse again differs from a Polish-style ogonek, as explained in <a href="http://www.decodeunicode.org/u+01EB" rel="nofollow">http://www.decodeunicode.org/u+01EB</a>:</p>
      <p><cite>Unlike the Polish ogonek, which goes all the way down to the bottom line (like “p”), the Old Norse ogonek should not be drawn much lower than a cedilla.</cite></p>
