      <p>Marcin wrote: </p>
      <p>&gt; I am not sure if Native American and<br>
      &gt; Lithuanian uogonek describe the same sound.</p>
      <p>That doesn't matter. The German "w" <code>[v]</code> and the English "w" <code>[w]</code> don't describe the same sound. The German "z" <code>[t͡s]</code> and the English "z" <code>[z]</code> don't describe the same sound. The Spanish "r" <code>[r]</code> and the French "r" <code>[ʀ]</code> or <code>[ʁ]</code> don't describe the same sound. Damn, even within the same language one letter can describe different sounds ("u" in English words "luck", "put", "mule" and "fur" certainly describes different sounds each time). </p>
      <p>But this does not have any influence on the fact that those different sounds can be written using the same letters. </p>
      <p>Adam</p>
