      <p>A legged U is historically correct in some lettering styles but not in others. I think in principle, it would be possible to mix a round U and a legged Uogonek in one typeface, but this would need to be done carefully. Some readers may get confused as they might think that the alternate shape signifies some additional difference. Also, the legged U would need to be drawn properly, with appropriate weight distribution on the stems, and with a complete redrawing of the curve. I realize that your own sketch for Junicode is just a rough illustration of the concept, but at the same time it clearly demonstrates that this is not a quick-and-dirty job. This brings us to a final point: in many cases, it would be uneconomic to redraw the base letter so drastically for the sake of Uogonek. I fear that it would often be done incompetently, as diacritic extensions are often done by people other than the original designers. One for sure — I do not see the legged Uogonek to be the default approach to solve the problem. I think it can be considered a valid alternate approach for some, very specific, typeface classes. </p>
      <p>A.</p>
