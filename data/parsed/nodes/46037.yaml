      <p>Hello,</p>
      <p>Even though I like Junicode generally for quick tweakings, examples and fix-ups (I'm not involved in its developement or enhancement), ('cos it's a freely available nice humanist face--- though it has its flaws, like a ridiculously wide capital T) I see now that in this very case it was a poor choice insofar as in determining the initial assumptions.</p>
      <p>On a side-note, the Oogonek-examples you gave give the impression as if the ductus was starting at the bottom of the O and would advance _clockwise_, which is unusual for the latin script and is slightly disturbing to me.</p>
      <p>"But the most important thing is that you _cannot_ just stick a composite ogonek onto O or U or e or even a, for that matter. You need to redraw the junctions every time."</p>
      <p>_That_ was clear :-) This goes for most good diacritics, (I prefer different (mostly: different wide) circumflexes (circumflices ;-) ) on i (e.g. Turkish) and w (e.g. in Welsh language). It is however twice as true for attached diacritcs: ogoneks, cedillas and horns (in Thai).</p>
      <p>While looking at it, I'm mysself less and less convinced of a legged variant of U for attaching an ogonek, you did circumvened directly addressing the question regarding its viability by merely pointing out (completely right) that it was unnecessary.</p>
      <p>Bruzs's "centered" ogonek on E in the Lithuanian-govt.-sponsored font was insightful as an alternative, maybe less traditional, more avantegarde solution.</p>
      <p>Clearly, the sound value of a letter is completely unimportant for glyph design. The complementary distribution of oogonek and uogonek, however, were important for my above considerations, if both were to appear in the same language, my suggestion would have lost validity immediately.</p>
      <p>A last question to the explicitly Lithuanians here: do words start with uogonek? I have only met them at the end of words. Would capital Uogoneks appear e.g. in names (not necessarily personal), or capitalised due to the beginning of a sentence, or only in all-caps settings (e.g. if they only happen to appear in medial and final positions)?</p>
      <p>Szabolcs</p>
