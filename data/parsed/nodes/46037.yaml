      <p>The ę character is certainly the oldest among the letters with an "ogonek". E caudata was the only such glyph used in medieval Latin (interchangibly with æ for the same sound). </p>
      <p>Polish adopted the letter ę for the nasalized "e" sound, probably because it just "was there" and was not used for anything else. Then, Polish borrowed the ogonek shape to form the letter for the nasalized "o" sound, which became "ą". From Polish, the shape was borrowed by the Lithuanian, which in addition to ą and ę also have an i and a u with the ogonek (Lithuania was in union with Poland for several centuries; Poland was mostly the dominant part in that union). </p>
      <p>My guess is that the o with ogonek as used in Old Norse is an independent development. However, Decodeunicode's description of "the Polish ogonek, which goes all the way down to the bottom line (like “p”)" is not correct. Depending on the structure of the typeface, the ogonek can be quite large or small. The larger the intended size for a typeface, the smaller the diacritics (that is a general rule). In typefaces intended for small sizes, the ogonek needs to be quite large so it remains legible. In typefaces intended for display sizes, the ogonek and the other diacritcal marks are usually much less pronounced. </p>
      <p>There are some images on my<br>
      <a href="http://www.twardoch.com/download/polishhowto/ogonek.html" title="http://www.twardoch.com/download/polishhowto/ogonek.html">http://www.twardoch.com/download/polishhowto/ogonek.html</a><br>
      but I hope to update this page with lots of newer material in some near future. </p>
      <p>Cheers,<br>
      Adam</p>
