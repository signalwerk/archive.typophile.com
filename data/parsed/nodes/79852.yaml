    html: |-
      <p>This inline style is not hard to reproduce using Illustrator or Corel Draw. Spotting a condensed unicase gothic, you'd just have to set main color to transparent and add one to stroke. Then, vectorize text and remove all finial strokes to recreate this exact style ("gas-pipe").<br>
      You can also have a look to some tags at MyFonts: <a href="http://www.myfonts.com/search/tag%3AInline" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Inline</a>, <a href="http://www.myfonts.com/search/tag%3Alined" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lined</a>, <a href="http://www.myfonts.com/search/tag%3Aoutline/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Outline</a>, <a href="http://www.myfonts.com/search/inline+sans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Inline Sans</a>, <a href="http://www.myfonts.com/search/inline+gothic+unicase" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Inline Gothic Unicase</a>, <a href="http://www.myfonts.com/search/neon/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neon</a>, ...<br>
      Some suggestions: <a href="http://www.myfonts.com/fonts/reserves/enamel/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Enamel Inline</a> (not unicase), <a href="http://www.myfonts.com/fonts/typodermic/droid/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Droid</a> (free, unicase, not inline but easy to reproduce), <a href="http://www.behance.net/gallery/Metropolis-1920/3244285" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Metropolis</a>, <a href="http://www.myfonts.com/fonts/redrooster/los-alamos/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Los Alamos</a> (unicase, inline), <a href="http://www.myfonts.com/fonts/adobe/industria/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Industria Inline</a>, <a href="http://www.myfonts.com/fonts/llw-studio/market-street-neon/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Market Street Neon</a>, <a href="http://www.myfonts.com/fonts/canadatype/press-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Press Gothic Biform</a>, <a href="http://www.myfonts.com/fonts/canadatype/wagner-grotesk/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Wagner Grotesk</a>, <a href="http://www.myfonts.com/fonts/jnlevine/inline-lettering/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Inline Lettering</a>, <a href="http://www.dafont.com/ds-narrow.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">DS Narrow</a>, <a href="http://www.dafont.com/buenos-aires-nf.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Buenos Aires</a>, <a href="http://www.myfonts.com/fonts/fenotype/rock-it/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rock-It</a> (already roughened, just need to be "inlined"), <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_softsoul_ot_light/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FF Softsoul Light</a>, <a href="http://www.myfonts.com/fonts/canadatype/gala/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gala</a>, <a href="http://www.myfonts.com/fonts/redrooster/phoenix-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Phoenix</a>...</p>
