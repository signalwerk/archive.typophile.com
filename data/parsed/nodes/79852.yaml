    html: |-
      <p>This inline style is not hard to reproduce using Illustrator or Corel Draw. Spotting a condensed unicase gothic, you'd just have to set main color to transparent and add one to stroke. Then, vectorize text and remove all finial strokes to recreate this exact style ("gas-pipe").<br>
      You can also have a look to some tags at MyFonts: <a class="freelinking external" href="http://www.myfonts.com/search/tag%3AInline" rel="nofollow">Inline</a>, <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Alined" rel="nofollow">Lined</a>, <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Aoutline/" rel="nofollow">Outline</a>, <a class="freelinking external" href="http://www.myfonts.com/search/inline+sans/" rel="nofollow">Inline Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/search/inline+gothic+unicase" rel="nofollow">Inline Gothic Unicase</a>, <a class="freelinking external" href="http://www.myfonts.com/search/neon/" rel="nofollow">Neon</a>, ...<br>
      Some suggestions: <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/enamel/" rel="nofollow">Enamel Inline</a> (not unicase), <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/droid/" rel="nofollow">Droid</a> (free, unicase, not inline but easy to reproduce), <a class="freelinking external" href="http://www.behance.net/gallery/Metropolis-1920/3244285" rel="nofollow">Metropolis</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/los-alamos/" rel="nofollow">Los Alamos</a> (unicase, inline), <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/industria/" rel="nofollow">Industria Inline</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/llw-studio/market-street-neon/" rel="nofollow">Market Street Neon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/press-gothic/" rel="nofollow">Press Gothic Biform</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/wagner-grotesk/" rel="nofollow">Wagner Grotesk</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/inline-lettering/" rel="nofollow">Inline Lettering</a>, <a class="freelinking external" href="http://www.dafont.com/ds-narrow.font" rel="nofollow">DS Narrow</a>, <a class="freelinking external" href="http://www.dafont.com/buenos-aires-nf.font" rel="nofollow">Buenos Aires</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fenotype/rock-it/" rel="nofollow">Rock-It</a> (already roughened, just need to be "inlined"), <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_softsoul_ot_light/" rel="nofollow">FF Softsoul Light</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/gala/" rel="nofollow">Gala</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/phoenix-pro/" rel="nofollow">Phoenix</a>...</p>
