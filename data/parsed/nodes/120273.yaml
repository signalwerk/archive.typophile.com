      <p>Given the date of the original and the manufacturing process, the original was most likely a custom die-punch typeface (they actually look like the sort of letters you'd draw with an architect's lettering guide). Here are a few contemporary digital fonts that may help you replicate the look:</p>
      <p><a href="http://www.myfonts.com/fonts/jnlevine/slim-james/" title="http://www.myfonts.com/fonts/jnlevine/slim-james/">http://www.myfonts.com/fonts/jnlevine/slim-james/</a> [you'd have to artificially expand it]<br>
      <a href="http://www.myfonts.com/fonts/ef-typeshop/diamante/" title="http://www.myfonts.com/fonts/ef-typeshop/diamante/">http://www.myfonts.com/fonts/ef-typeshop/diamante/</a><br>
      <a href="http://www.myfonts.com/fonts/softmaker/diamante-serial/" title="http://www.myfonts.com/fonts/softmaker/diamante-serial/">http://www.myfonts.com/fonts/softmaker/diamante-serial/</a><br>
      <a href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/" title="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/">http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/</a><br>
      <a href="http://www.myfonts.com/fonts/fontbureau/fb-agency/" title="http://www.myfonts.com/fonts/fontbureau/fb-agency/">http://www.myfonts.com/fonts/fontbureau/fb-agency/</a><br>
      <a href="http://www.myfonts.com/fonts/processtype/stratum2/" title="http://www.myfonts.com/fonts/processtype/stratum2/">http://www.myfonts.com/fonts/processtype/stratum2/</a><br>
      <a href="http://www.myfonts.com/fonts/castletype/agency-gothic-ct/" title="http://www.myfonts.com/fonts/castletype/agency-gothic-ct/">http://www.myfonts.com/fonts/castletype/agency-gothic-ct/</a><br>
      <a href="http://www.myfonts.com/fonts/fort-foundry/industry-inc/" title="http://www.myfonts.com/fonts/fort-foundry/industry-inc/">http://www.myfonts.com/fonts/fort-foundry/industry-inc/</a><br>
      <a href="http://www.myfonts.com/fonts/fontfont/oxide-pro/" title="http://www.myfonts.com/fonts/fontfont/oxide-pro/">http://www.myfonts.com/fonts/fontfont/oxide-pro/</a></p>
      <p>And, of course, there is the old standby, Eurostile (condensed):<br>
      <a href="http://www.myfonts.com/fonts/adobe/eurostile/" title="http://www.myfonts.com/fonts/adobe/eurostile/">http://www.myfonts.com/fonts/adobe/eurostile/</a></p>
