      <div class="comment-spam-body"><p>Good suggestions Bob and Kevin.<br>
      Almost looks like license plate letters in a jurisdiction where the need to squeeze in more than a few letters allows this width. But the _Q_ is a disaster. Too close to _O_ -- ignore the comma, _O_ would look like _C_ with the gap closed.<br>
      BTW looking at _J_, _M_, and  _W_ leads me to believe that this is monospaced.<br>
      Don</p>
      </div>
