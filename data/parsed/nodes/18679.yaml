    html: |-
      <p>I purchased Designing Type at the Seattle event. Although I haven't been through the whole book yet, here's my take:</p>
      <p>The book is a mostly visual compendium of  the options  presented in the design of letterforms. Each page could potentially comprise a Typophile thread. For example, how would one design a 'Q'? The advantage here is that hours and hours of discussions are distilled into a single useful reference. I'm not aware of any other documentation, web or print, that is this focused on the shapes of letters. </p>
      <p>Many books on typography tend to cover too many topics and end up being fairly shallow. This book only makes historical references when it is necessary for classification purposes. This is a good thing. The book also avoids much technological discussion. The information would useful for someone cutting Monotype matrices or working in FontLab.</p>
      <p>Also, I think I had a taste of the Scarlet IPA out of Sii's pitcher. It was quite good. I owe him, or someone he was with, a pint.</p>
    html_clean: |-
