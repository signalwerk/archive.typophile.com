      Henry Art Gallery<br>
      15th Ave NE and NE 41st Street<br>
      University of Washington </p>
      <p>Typefaces are one of the graphic designer's most essential tools; they can determine the success or failure of visual communication. In her new book, Designing Type, Karen Cheng examines what makes a good typeface, describing in detail how to construct letters, numbers, and accents in serif and sans-serif systems. </p>
      <p>Cheng analyzes a wide range of classic and modern typefaces, including many from today's premier contemporary type foundries. In the rapidly broadening market for original and custom fonts, Designing Type is an excellent reference for experienced professionals and novice designers. </p>
      <p>Hosted by Peter Miller Books<br>
      Co-sponsored by the Simpson Center for the Humanities </p>
      <p>Cheers, Si</p>
