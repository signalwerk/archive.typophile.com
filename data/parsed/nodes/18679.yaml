    html: |-
      <p>Hello Sebilar,<br>
      There are very minor differencesbetween the German version and the English version. The largest difference is that the German version has a different type classification chapter, since their system goes by different terminology. Also, the German version uses Quadraat as the body text (rather than Univers) — and it is printed as a casebound book (hardback) with a different title.</p>
      <p>I think the "more than just translated" bit refers to Henning's self-appointed role as an editor, fact-checker and proofreader. Henning made many editorial suggestions throughout, especially in the section on accents/diacritics. He was particularly helpful (as a native speaker of German, and as an experienced type designer) with questions I had about the German eszett.</p>
      <p>Karen</p>
