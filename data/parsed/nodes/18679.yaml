      <p>&gt;Review?</p>
      <p>First off I had a pint of the Amber, it was okay, but had a bit of that fizzy homebrew aftertaste. Then when some others arrived we got a pitcher of the Scarlett IPA, described as an “experiment” by the barkeep it was actually pretty nice, had good color, and didn’t have the kick of some other IPA’s. It was pretty smooth. </p>
      <p>As for the talk, the auditorium was full, I’d guess about 180 people, with a number standing. Karen stood at the base of the stage and her style was pretty entertaining, a touch of self deprecating humor, and jokes which seemed to be a hit with the crowd. Using questions reproduced from four or five student evaluation forms, her short (no more than half an hour) talk was really an entry-level introduction to the appreciation and understanding of type – and was at the right level for the audience who seemed to be mostly students, ex students, friends and local celebrities (Kevin Larson &amp; John D. Berry being two I recognized). One question, “What’s the absolute best font in the world and what is the absolute worst font in the world”, was typical of the questions, and provided a way for Karen to show bad type used badly, and student work, and spreads from her book. There was plenty of time left for audience questions and these again were the typical, legibility type questions “why do you use sans fonts on signage” and standard fare “how do designers name their fonts” – again reinforcing this as not a specialist font crowd. Still a worthwhile event.</p>
