    html: |-
      <p>Hi Chris,</p>
      <p>Karen teaches the typography course at the University of Washington, and I heard about her and her book from one of her students, Microsoft's own Kevin Larson. When Kevin joined the Advanced Reading Technology group he decided to go do a type course so he could better understand what people like Mike and Geraldine were  talking about. I think this was also part of Kevin's secret plan to become an A-list superstar speaker at typography conferences.</p>
      <p>I met Karen for the first time on Sunday and got to briefly see the books (English and German) for the first time as well. It struck me as a very methodical, practical, hands-on manual describing the process of designing a western font. My initial reaction was also that it will be a bit controversial, with seasoned pro's exclaiming "you can't distil my fifty years of experience into a how-to guide!" But I think even non-beginers will get something out of it, for example the part on diacritics (some Twardochian principles seem to be in use).</p>
      <p>I don't think people will feel cheated out of their $20, and I'm going to order copies for my team. I think John Berry is writing a review so if people want to wait, they might want to check out his thoughts before ordering, but I say go for it!</p>
      <p>As for why she did the book? I'm sure all will be revealed at the talk, but I'll ask her and report back.  </p>
      <p>Si</p>
