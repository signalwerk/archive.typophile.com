    html: |-
      <p>Not a stupid question at all, I have only just figured out some of this stuff and it is not necessarily clear. I have found it helpful to map the classes in a separate document.</p>
      <p>Yes, you will want to rename the classes to match what you put in the features, so 'calt1:' and 'calt2:' would work. You will also need to ensure that the number of characters in one match the other. There are no doubt more complex approaches but hopefully this will work when you compile the features.</p>
      <p>I have found it very helpful to open a font that already has these features and see how the classes have been named and structured.</p>
