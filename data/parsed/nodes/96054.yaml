      <p>Having looked at a fairly complex font (<a href="http://openfontlibrary.org/en/font/eb-garamond" title="Click to visit an external URL." class="freelink freelink-external freelink-external">EB Garamond</a>) it looks like you only need to match the number of elements if you are doing a direct replace in the calt feature. If you are instead, for example, replacing everything in a specific class with a specified character then the classes only need contain the relevant characters being replaced.</p>
      <p><img src="/sites/default/files/old-images/calt1_6017.jpg"></p>
