    html: |-
      <p>You can use any name you want for classes. They are only for your convenience and won't be present in the generated font. </p>
      <p>When FontLab opens a font (.otf or .ttf), it decompiles the OT tables, and since there are no class names stored in the font, it gives them arbitrary names like calt1, calt2, etc. based on which features reference them.</p>
      <p>You don't have to do the same. There's nothing to stop you from using more descriptive names for classes, like "normalQ" and "fancyQ" or whatever, and it will make your feature code much easier to understand.</p>
