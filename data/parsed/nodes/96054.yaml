      <p>Having looked at a fairly complex font (<a class="freelinking external" href="http://openfontlibrary.org/en/font/eb-garamond" rel="nofollow">EB Garamond</a>) it looks like you only need to match the number of elements if you are doing a direct replace in the calt feature. If you are instead, for example, replacing everything in a specific class with a specified character then the classes only need contain the relevant characters being replaced.</p>
