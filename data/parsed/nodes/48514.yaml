    <a href="http://partners.adobe.com/public/developer/en/opentype/aglfn13.txt" title="http://partners.adobe.com/public/developer/en/opentype/aglfn13.txt" class="link-external">http://partners.adobe.com/public/developer/en/opentype/aglfn13.txt</a><br>
    <a href="http://www.adobe.com/devnet/opentype/archives/glyphlist.txt" title="http://www.adobe.com/devnet/opentype/archives/glyphlist.txt" class="link-external">http://www.adobe.com/devnet/opentype/archives/glyphlist.txt</a></p>
    <p>Which one is the right one to use? Google returns the 1st one when searching for "adobe glyph list", but that seems the oldest! The last one, which confusingly is in the "archives", has a 2007 copyright but has the same version number as the fist, but the contents differs! Could Adobe remove the obsolete ones to prevent further confusion? </p>
    <p>This really important for Romanian, because the U+016[23] are mapped to /[Tt]cedilla in the 1st list, but to /[Ttcommaaccent] in the other two. All TeX fonts pretty much use the first, while the Adobe fonts use and apps use the 2nd or 3rd. I'm inclined to email a bug report to the GUST foundry, which made most of the updated TeX fonts. But I need some authoritative source to back up my complaint.</p>
