      <p>Thank you both for the detailed replies. A couple more points will put this matter to rest:</p>
      <ol>
      <li>The following two (AGL 2.0) files are thankfully identical except for the copyright notice:<br>
      <a href="http://partners.adobe.com/public/developer/en/opentype/glyphlist.txt" title="http://partners.adobe.com/public/developer/en/opentype/glyphlist.txt">http://partners.adobe.com/public/developer/en/opentype/glyphlist.txt</a><br>
      <a href="http://www.adobe.com/devnet/opentype/archives/glyphlist.txt" title="http://www.adobe.com/devnet/opentype/archives/glyphlist.txt">http://www.adobe.com/devnet/opentype/archives/glyphlist.txt</a>
      </li>
      <li>The AGL 2.0 is a many-one mapping from names to code points, meaning that the same code point (sequence) can show up under multiple PostScript names. For instance U+0163 is mapped to both 'tcedilla' and 'tcommaaccent'. On the other hand, AGLFN 1.3 is a one-one mapping, but it's not exactly a subset of AGL 2.0 -- it differs in the mapping of three glyphs 'Omega', 'mu', and 'Delta'. There's a comment in AGLFN 1.3 that documents this change. I grokked this stuff with a little script I wrote. Here's some output:
      <p><code><br>
      $ ./groklist.py glyphlist.txt aglfn13.txt<br>
      Analysing glyphlist.txt:<br>
        Is the {(name, code)} relation right-unique? Yes. Is it left-unique? No.<br>
        Has non-unique names for 409 codes.<br>
      Analysing aglfn13.txt:<br>
        Is the {(name, code)} relation right-unique? Yes. Is it left-unique? Yes.<br>
      Is glyphlist.txt a subset of aglfn13.txt? No.<br>
        There are 3449 tuples in glyphlist.txt that are not in aglfn13.txt.<br>
      Is aglfn13.txt a subset of glyphlist.txt? No.<br>
        There are 3 tuples in aglfn13.txt that are not in glyphlist.txt.</code></p>
      <p>$ ./groklist.py -v glyphlist.txt | grep 0163<br>
          0163 -&gt; ['tcedilla', 'tcommaaccent']</p>
      <p>$ ./groklist.py -v glyphlist.txt aglfn13.txt | tail -4<br>
        There are 3 tuples in aglfn13.txt that are not in glyphlist.txt:<br>
        ('Omega', '03A9')<br>
        ('mu', '03BC')<br>
        ('Delta', '0394')<br>
      <br>
      If anybody is interested, I can upload it somewhere.
      </p></li>
      <li>The correspondence between Unicode code points and glyph shapes for Romanian has indeed been cleared up in 1999 when U+0218 -- U+210B range ([SsTt] with comma-below) was introduced in Unicode 3.0. That did not make the problem go away overnight though, but that's the topic of another thread.
      </li>
      </ol>
    html_clean: |-
