    html: |-
      <p>If you're *making fonts* you want the "Unicode and Glyph Names" document (<a href="http://www.adobe.com/devnet/opentype/archives/glyph.html" title="http://www.adobe.com/devnet/opentype/archives/glyph.html">http://www.adobe.com/devnet/opentype/archives/glyph.html</a>) plus the AGLFN.</p>
      <p>If you're a *consumer* of fonts (an application), you want to use the AGL.</p>
      <p>Either way, these docs are primarily about glyph names and Unicodes, rather than shapes.</p>
      <p>The question of what to name the glyphs at U+016[23] and what shapes to use is particularly tricky, because of the history there; essentially, there was a mistake in Unicode in describing the characters as having cedillas. Because of stability guarantees in Unicode, the solution was to add new characters that are described as having comma accents (U+021[AB]).</p>
      <p>The usage of these new codepoints by Windows and Mac OS has been pretty standardized for quite a few years now, so on those platforms the question of what to do with the old codepoints is of decreasing importance, mainly relating to old texts being imported or revised. I have no idea what the situation is with TeX and the various flavors of Unix, however.</p>
      <p>John Hudson, whose opinion most of us respect a great deal on font encoding and internationalization issues, has recently reverted to using the cedilla accent with U+016[23]: <a href="http://typophile.com/node/36473#comment-223302" title="http://typophile.com/node/36473#comment-223302">http://typophile.com/node/36473#comment-223302</a></p>
      <p>At Adobe, we're not likely to change existing fonts, but we recently discussed what to do with new fonts moving forwards. One option is to put in default glyphs for U+016[23] which have the cedilla shape, but use the locale ('locl') feature to change them to comma shapes. Or we could follow John and Microsoft's argument and not bother with 'locl' and just leave the glyphs as cedillas. All TBD at this time.</p>
      <p>Cheers,</p>
      <p>T</p>
