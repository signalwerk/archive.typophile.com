      <p>&gt; the Adobe fonts use and apps use the 2nd or 3rd</p>
      <p>Most recent Adobe fonts don't use AGLFN but a subset of it. If at all, please look at new Adobe fonts (Hypatia Sans Pro, Arno Pro) for reference, not at old fonts. </p>
      <p>I've been maintaining the STANDARD.NAM file which ships with FontLab Studio 5.0.4 much more actively than Adobe has been maintaining its AGL/AGLFN, so I actually recommend using FontLab's STANDARD.NAM as reference as it reflects best practices of the industry (including Adobe's). </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
