    html: |-
      <p>Well, this is the whole point. AGL maps all possible glyphnames that can be found in old and new fonts to Unicode codepoints, while AGLFN maps Unicode codepoint to preferred glyphnames (names that are not found in AGLFN should be formed using the algorithmic principles, i.e. using the uniXXXX or uXXXXX notation, or "_" for ligatures or "." for glyph alternates). </p>
      <p>However, in the most recent fonts Adobe made, they no longer use the "*commaaccent" and "afii*" glyphnames that are part of AGLFN. I have submitted a proposal to Adobe to revise the AGLFN so that it no longer lists "*commaaccent" and "afii*" names, which would be in sync with what Fontlab Ltd. is recommending. For those glyphs, you'd use the uniXXXX convention. </p>
      <p>Thanks for pointing out the inconsistancy between AGL and AGLFN regarding "Omega", "mu", and "Delta". I'd argue that the updated AGLFN codepoints for those glyphnames should also be updated in AGL. </p>
      <p>A.</p>
