    html: <p> I've been intending to post a comment here for some time, but haven't been able to devote the time to a full critique yet. I largely agree with what has been said so far. <br> <br>I can also add that you should look at the proportions, especially those of the upper case. The uc "A" and "V" seem a bit wide, and the "Z" seems a bit narrow, for example. <br> <br>I also agree that both the uc and lc "S/s" characters seem out of place with their present squarish forms. I'd like to see rounder forms to complement the "C/c", "G/g" "O/o" and "Q/q" designs. <br> <br>Also, I'm curious as to why the numeral figures seem so small -- the ascenders only reach the x-height, yet some of them have descenders that drop below the baseline. Are you planning multiple figure sets (such as lining cap-height figures, descending old-style figures, etc.)? <br> <br>I love the direction that the font is taking. I'm a fan of good slab-serifs, and I have a soft spot for geometrics as well. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>David </p>
    html_clean: <p> I've been intending to post a comment here for some time, but haven't been able to devote the time to a full critique yet. I largely agree with what has been said so far. <br> <br>I can also add that you should look at the proportions, especially those of the upper case. The uc "A" and "V" seem a bit wide, and the "Z" seems a bit narrow, for example. <br> <br>I also agree that both the uc and lc "S/s" characters seem out of place with their present squarish forms. I'd like to see rounder forms to complement the "C/c", "G/g" "O/o" and "Q/q" designs. <br> <br>Also, I'm curious as to why the numeral figures seem so small -- the ascenders only reach the x-height, yet some of them have descenders that drop below the baseline. Are you planning multiple figure sets (such as lining cap-height figures, descending old-style figures, etc.)? <br> <br>I love the direction that the font is taking. I'm a fan of good slab-serifs, and I have a soft spot for geometrics as well. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>David </p>
