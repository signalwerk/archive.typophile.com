    html: <p><img src="http://www.typophile.com/forums/messages/29/1596.gif" alt="slabtest5.gif"> <br><img src="http://www.typophile.com/forums/messages/29/1597.gif" alt="slabtest6.gif"> <br><img src="http://www.typophile.com/forums/messages/29/1598.gif" alt="slabtest7.gif"> <br> <br>Here are some fairly substantial changes, most notably in the lc, but in all of the characters, the serifs have been widened, the tops of the joining strokes lc b,d,h,m,n,c,r,p,g have been rounded, rather than going straight in a very geometrical way. I printed out some samples at small point sizes, 10, 12, and the differences between uc and lc didn't appear to be a problem. See sample in 12 pt. I was not familiar with FF Shefiff but did look at it, and yes, there was a simiilarity in style with h, m, and n letters. This was not intentional, but it is changed anyway. Jake's suggestion re lc x was implemented. I am still thinking about where this is going, in response to Max H's question. Modern wood? <br>Jordan</p>
