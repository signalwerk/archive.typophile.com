    html: "<p> Jordan- <br> <br>It looks good, but I have a few suggestions: <br> <br>The x in the lower case appears too dark - try eliminating half of the serif on the inner counter of the thicker stroke. <br> <br>The Z in the upper case could be bevelled at the corners. <br> <br>In a font like this, the tail of the Q can afford to be a bit more exhuberant. <br> <br>The figures irk me a bit. I understand that you're going for an old style look here, which is fine, but it can stand to better match the rest of the typeface. Strokes on the 1, 4 and 7 appear too dark. Plus, that aforementioned stroke on the 7 should come down as a descender. <br> <br>In my opinion, the punctuation seems too small for the rest of the letters. <br> <br>You've got a great start - I look forward to the end result! <br> <br>-Jake </p>"
    html_clean: "<p> Jordan- <br> <br>It looks good, but I have a few suggestions: <br> <br>The x in the lower case appears too dark - try eliminating half of the serif on the inner counter of the thicker stroke. <br> <br>The Z in the upper case could be bevelled at the corners. <br> <br>In a font like this, the tail of the Q can afford to be a bit more exhuberant. <br> <br>The figures irk me a bit. I understand that you're going for an old style look here, which is fine, but it can stand to better match the rest of the typeface. Strokes on the 1, 4 and 7 appear too dark. Plus, that aforementioned stroke on the 7 should come down as a descender. <br> <br>In my opinion, the punctuation seems too small for the rest of the letters. <br> <br>You've got a great start - I look forward to the end result! <br> <br>-Jake </p>"
