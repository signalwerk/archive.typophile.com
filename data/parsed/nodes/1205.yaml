  html: <p>Ok, I will just dive right in. I am new to this forum but will submit this to get some reaction and criticism, suggestion, etc. Whatever you think and wish to say, especially helpful things, will be helpful to me. The font is based loosely on wood type, but lots of slab serifs are similar in that respect. <br> <br><img src="http://www.typophile.com/forums/messages/29/1573.gif" alt="slabtest.gif"> <br> <br>larger letters to see more easily are these <br> <br><img src="http://www.typophile.com/forums/messages/29/1574.gif" alt="slabtest2.gif"> <br> <br>I very much appreciate feedback. Don't be afraid to be negative, within reason. <br> <br>Jordan Davies <br>jordy@together.net</p>
