    html: <p><img src="http://www.typophile.com/forums/messages/29/1627.gif" alt="slabtest8.gif"> <br> <br><img src="http://www.typophile.com/forums/messages/29/1628.gif" alt="slabtest9.gif"> <br> <br><img src="http://www.typophile.com/forums/messages/29/1629.gif" alt="slabtest0.gif"> <br> <br>Ok, after much work, little rest (just kidding) I have done some more work, most importantly bringing the uc into shape so that it conforms to the lc, rounded S, s, rounded top strokes to the P, R &amp; B, rounded C, c, G &amp; D, O, Q a narrower A &amp; V so that they are related to each other more correctly, plus other changes like a bit wider E &amp; F. While there is unquestionably more work to be done here, I did print it out at 7 over 9 and it looks ok. The differences in weight between the uc and lc in this size really don't seem to make a difference I can see that would be annoying. I suppose there is just enough here which is quirky to distinguish it from others of its kind, but ... <br>Jordan</p>
