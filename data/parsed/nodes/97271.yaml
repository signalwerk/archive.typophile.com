    <p>Hi guys,</p>
    <p>This is my first post, I'm a designer and for several years I am interested in typedesign, I'm not a typedesigner but I try.</p>
    <p>Größe is my first real project, and is a project that I'm working on for some years.<br>
    <strong>Größe</strong> <cite>(Grosse)</cite> in german  means "big-large". The design of the font is inspired by the northern european architecture, with its clean lines, modula, simple and squared.</p>
    <p><a href="http://www.indiegogo.com/grossefont?a=1622516" title="Link to Grosse" rel="nofollow"><img src="http://s3.amazonaws.com/ksr/assets/000/024/755/c63577b88d278f765d02987a7fac880a_large.jpg?1339414055" alt="Link to Grosse"></a></p>
    <p>Whene I started designing it I thought of something that could be used on posters and at wide boy, the geometric shapes and the solid structure makes it a very good choice to make posters.</p>
    <p>The goal is to to make it compatible with many languages ​​as possible, also cyrillic and if it's possibile chinese, the Chinese could be useful?</p>
    <p>Thank you all.<br>
    Critics are welcome!</p>
    <p><cite>If you want to help my project</cite><br>
    <a href="http://www.indiegogo.com/grossefont?a=1622516" title="http://www.indiegogo.com/grossefont?a=1622516">http://www.indiegogo.com/grossefont?a=1622516</a></p>
