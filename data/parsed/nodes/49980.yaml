      <p>ok guys i figured it out, James you were wright about the files that needed to be deleted.</p>
      <p>just in case someone else might have the same problem -&gt; i first removed fontlab 5, did a restart -&gt; open “run” (windows) type “regedit” click ok,  next go to  HK_CURRENT USER software, search for fontlab and delete the entire folder -&gt; did a restart again -&gt; fresh fontlab 5 install et voila...working</p>
      <p>thnx for all the help and tips</p>
      <p>cheeeers</p>
