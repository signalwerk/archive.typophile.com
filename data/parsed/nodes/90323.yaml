    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypeAmericana2_500pix_6520.jpg"></div><p></p>
    <p><strong>First, A full day of talking about American type history<strong></strong></strong></p>
    <p>Friday, May 4, 10am–5pm</p>
    <p>We‘ve invited noted historians and practitioners of American typography to share their research and personal experience—information you won't find assembled anywhere else. </p>
    <p>Paul Shaw | <em>Oswald Cooper: Attacked by an itch to work with type<em></em></em></p>
    <p>Dr. Cathleen Baker | <em>Roycrofters to Renaissance: The progression of Dard Hunter‘s letterforms from arts and crafts to classical<em></em></em></p>
    <p>Paul F. Gehl | <em>Ludlow‘s Mutt and Jeff: Douglas McMurtrie and R. Hunter Middleton<em></em></em></p>
    <p>Nancy Sharon Collins | <em>Engraving: The curiously shy stepchild in American type genealogy<em></em></em></p>
    <p>Thomas Phinney, Steve Matteson, and Richard Kegler | <em>A second life for vintage American typefaces<em></em></em></p>
    <p>Frank Brannon | <em>Print Your Own Language: The role of letterpress in Cherokee language revitalization<em></em></em></p>
    <p><strong>On the weekend, a choice of two workshops<strong></strong></strong></p>
    <p>Sumner Stone | <strong>1-day Workshop | <em>Rome in a Day: Designing Capital Letters<em><strong></strong></em></em></strong></p>
    <p>Saturday, May 5, 9am–4pm</p>
    <p>This workshop led by Sumner Stone combines history and the drawing and digitizing of an alphabet of sans serif roman capital letters based on examples from the second century BCE. Stone will show different approaches to designing letters that will reveal their underlying structures and how they relate to modern sans serif forms. </p>
    <p>Carl Montford | <strong>2-day Workshop | <em>Plants and Platen<em><strong></strong></em></em></strong></p>
    <p>Saturday and Sunday, May 5 &amp; 6, 9am–4pm</p>
    <p>Take home three treasures from this workshop. First, you‘ll have a floral wood engraving that you carved, based on 15th century herbal books. You‘ll also have a print of your illustration with its accompanying handset-type description, made on a vintage Reliance iron handpress. Finally, we‘ll give you an illustrated booklet about the restoration of the Reliance, showing how design ingenuity and a passion for making beautiful things created a gem of a refurbished press.</p>
    <p>More information and registration: <a href="http://typeamericana.svcseattle.com/" title="http://typeamericana.svcseattle.com/">http://typeamericana.svcseattle.com/</a></p>
    <p><em>Register for single or multiple events. Spaces are limited!<br>
    Discount for multiple registration. Student and AIGA discounts.<br>
    Discount on hotel reservations until April 12.<em></em></em></p>
