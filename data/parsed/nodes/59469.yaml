    html: |-
      <p>Hello fellow typophiles..<br>
      I have been a regular lurker on this site &amp; have always enjoyed the lively debate &amp; discussions; thanks for all the infos &amp; news...<br>
      With the release of the mentioned video; I thought this could be a good occassion to finally come out of the bushes &amp; present myself...<br>
      I hope you are enjoying the video &amp; song; must say a great thanks to my friend Mike Croft for coming up with the music; atleast it gave us a good laugh making it...<br>
      Your comments on the fonts are very true; I had a bit of a hard time getting hold of the right fonts for each style &amp; being on zero budget; I used alot of my own fonts designs... True that Hobo for the french was not ideal but I just could not get hold of a good version of the Metro font used in the original Tyopmania clip...<br>
      Feel free to give us some feedback &amp; critics!</p>
    html_clean: |-
