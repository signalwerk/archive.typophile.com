    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 6.Dec.2007 7.04am </div>
      <p>HOUSE INDUSTRIES GIFT CERTIFICATES AVAILABLE NOW</p>
    <p>Is there a special someone in your life who has everything? We know for a fact that they don’t have near enough House Industries gear, so let’s solve that problem right now! Some features of our new gift certificate system:</p>
    <p>-Includes a special die-cut personalized certificate mailed at no extra charge.</p>
    <p>-Gift certificate codes are delivered via email so they can be used immediately.</p>
    <p>-Gift certificate recipients can maintain a balance on the certificate and use it for multiple transactions.</p>
    <p>-There is even an option to send a personalized note via email directly to the recipient.</p>
    <p>Check them out here:</p>
    <p><a href="http://www.houseind.com/index.php?page=certificates" title="http://www.houseind.com/index.php?page=certificates">http://www.houseind.com/index.php?page=certificates</a></p>
    <p>__________________________________________________________</p>
    <p>HOLIDAY SPECIALS</p>
    <p><a href="http://www.houseind.com/index.php?page=specials" title="http://www.houseind.com/index.php?page=specials">http://www.houseind.com/index.php?page=specials</a></p>
    <p>Alexander Girard Alphabet Blocks: $75 (regular price $100)</p>
    <p>Girard Blocks with AIGA New Mexico Poster: $85 ($135 Value)</p>
    <p>House Industries Holiday Fonts: $80 (regular price $140)</p>
    <p>House Industries Merino Wool Trainer: $100 (regular price<br>
    $200)</p>
