      <p>My first thought, semantic though it is, was that you have made a square not a cube.<br>
      Having said that i do quite like what you have done.<br>
      To my eyes the c and u work best with the internal and external squares.<br>
      The b and e could probably benifit from a bit of tweaking.<br>
      Have you considered making the whole thing as a 3d object with the letter squares being a seperate cube - kind of like a typographers childs letterblock?</p>
      <p>Will</p>
