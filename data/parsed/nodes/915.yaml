  html: <p>Trying to learn the original typeface for this Brendel Informatik font called Isfahan (the font names on this CD are sometimes a pun on the original typefaces' names). <br> <br>As mentioned prior, there are 500 fonts on the CD and I've ID'd almost all of them as clones of still available commercial fonts and old time shareware fonts. I just identified another today, so I'm down to 6 fonts that I cannot place and kind of like. <br><img src="http://www.typophile.com/forums/messages/83/14124.gif" alt=""></p>
