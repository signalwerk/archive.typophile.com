  html: |-
    <p>I think I may not understand correctly how lookupflags and glyph types work, and was hoping someone might be able to clarify this for me.</p>
    <p>I have a piece of code like the following in a font:</p>
    <p><code>lookup A { </code></p>
    <p><code>&nbsp;&nbsp;lookupflag IgnoreMarks; </code></p>
    <p><code>&nbsp;&nbsp;sub @X' @Y by @Z; </code></p>
    <p><code>} A; </code></p>
    <p>In the glyph properties window in FLS5 I've assigned all of the combining diacritics to the 'marks' class and in my FLS5 preferences I've made sure that the 'generate GDEF table' option is set. I'd assumed that the above code would work effectively the same as the following pseudocode, but apparently not.</p>
    <p><code>lookup A { </code></p>
    <p><code>&nbsp;&nbsp;sub @X' @Y by @Z; </code><br>
    <code>&nbsp;&nbsp;sub @X' @CombiningDiacritics @Y by @Z; </code><br>
    <code>&nbsp;&nbsp;sub @X' @CombiningDiacritics @CombiningDiacritics @Y by @Z; </code><br>
    <code>&nbsp;&nbsp;&nbsp;&nbsp;. </code><br>
    <code>&nbsp;&nbsp;&nbsp;&nbsp;. </code><br>
    <code>&nbsp;&nbsp;&nbsp;&nbsp;. </code></p>
    <p><code>} A; </code></p>
    <p>As far as I can tell, the presence of <code> lookupflag IgnoreMarks </code> has no affect whatsoever on the behaviour of the font. What am I missing here?</p>
    <p>Thanks,</p>
    <p>André</p>
