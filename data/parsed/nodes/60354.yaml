  html: |-
    <p>We just released the new Krasny Mir font (formerly and briefly titled Red Star prior to release).  It's a strong titling font based on soviet-era Russian poster lettering with some neat features.  You can find it on our main site at <a href="http://www.fontcraft.com" rel="nofollow">the Scriptorium</a> or on our new lite site at <a href="http://www.typesmith.com" rel="nofollow">TypeSmight</a>.</p>
    <p>Both places offer samples and a free download of the working demo version.</p>
    <p>Dave<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/krasnymirmf_6459.jpg"></div><p></p>
