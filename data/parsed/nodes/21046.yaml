  html: |-
    <p>hello there. </p>
    <p>This is my first proper attempt at a text face, or at any typeface<br>
    at all, having only recently rekindled an interest in typography<br>
    after a degree in animation.</p>
    <p>This came from ideas that had been bubblin around in my head after looking at a lot of type, plus reading something on this site about Dwiggins M-Formula which then lead me to a type posted by Miguel Hernandez. I must state that i have not attempted to make my own version of Miguel's typeface and have not referred to it since undertaking my own designs, but it did interest me and have an influence. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/djangled_3896.png"></div><p></p>
    <p>As I said this is my first typeface so forgive me any glaringly obvious mistakes. I am trying to find my footing in type design rather than having a particular goal in mind which is why my approach is somewhat slapdash.</p>
    <p>Also I've no idea what to call it, so any suggestions would be appreciated.</p>
    <p>cheers, Graham.</p>
