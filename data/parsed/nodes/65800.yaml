    <p>To sum up my thoughts, and the concept and plan beyond: After one decade in design, I intend becoming / being a 'Design Nomad', for half a year. One month, one country, one agency/studio/bureau — For six months. From spring to fall 2010. Travel X Design. New places, new people, new projects. (I will tweet and write/post about my time 'out in the wild'. And eventually these texts may be published later on in a book.</p>
    <p>Design Nomad — 6 Months, 6 Countries, 6 Agencies/Studios/Bureaus</p>
