    <p>I’m an admirer of Vladimir Nabokov’s novels - everyone interested in good literature should read his books. Let me point you to the design project, by Chip Kidd, of Nabokov’s posthumous “The Original of Laura”:</p>
    <p><a href="http://www.pittsburghlive.com/x/pittsburghtrib/ae/books/s_656078.html" title="http://www.pittsburghlive.com/x/pittsburghtrib/ae/books/s_656078.html">http://www.pittsburghlive.com/x/pittsburghtrib/ae/books/s_656078.html</a></p>
    <p>“Instead of typed or handwritten pages, Vladimir Nabokov left behind 138 3-inch by 5-inch index cards that his son took painstaking measures to organize and arrange to create “The Original of Laura.” Each index card is replicated exactly, with words crossed out, underlined or erased, and Nabokov’s notations, and printed on stock that is similar to note cards.”</p>
    <p></p><div class="imageWrap"><img src="/files/card-a_3742.jpg"></div><p></p>
    <p>And another interesting Nabokov book cover treatment:</p>
    <p><a href="http://observatory.designobserver.com/entry.html?entry=11597" title="http://observatory.designobserver.com/entry.html?entry=11597">http://observatory.designobserver.com/entry.html?entry=11597</a></p>
