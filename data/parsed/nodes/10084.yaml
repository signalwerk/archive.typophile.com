    html: <p>Dear Koeiekat, <br> <br>We sincerely regret that we can't identify the typeface used for the "Shakira" logotype. Several of our voluntary, unpaid type identifiers have done some research, amongst them Cheshiredave who "went through a pretty good collection of the free fonts available around the Web and didn't find it." <br>We have come to the conclusion that the "Shakira" logotype probably is custom drawn. It is likely that no existing typeface, available commercially or as share- or freeware, has characters that match the corresponding characters in this logotype. <br>If in  the future this would appear to be incorrect and a existing typeface should be found that matches the "Shakira" logotype, you won't be entitled for a refund. <br> <br>I can assure you that we DO love children and would like to help you out, but unfortunately we can't in this specific case. Furthermore, I would like to stress that our friendly banter was solely aimed at the character(s) of the logotype, certainly not yours nor Shakira's. <br> <br>Last but not least, I would like to apologize for our misplaced jokes and sorry (lack of) sense of humour. I can guarantee you that in the future we will restrict ourselves to helping our fellow men, women AND children in an efficient and orderly fashion. <br> <br>Yours truly, <br> <br>Yves Peters</p>
