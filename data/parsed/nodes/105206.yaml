    <p>Hi, </p>
    <p>I'm just starting to research ideas for my dissertation that I'm due to start writing in September. The topic I had in mind was something along the lines of "how big an impact does design have on the success of a film?" At the moment I am thinking of covering interior areas title sequences, design of props used in films, and exterior stuff like posters and DVD artwork. </p>
    <p>The example I have in my head right now is Valhalla Rising - the DVD covers I have seen for it such as this one <a href="http://ecx.images-amazon.com/images/I/51sNZlNR8%2BL.jpg" title="http://ecx.images-amazon.com/images/I/51sNZlNR8%2BL.jpg">http://ecx.images-amazon.com/images/I/51sNZlNR8%2BL.jpg</a> portray it in a similar way to films like 300 (<a href="http://www.comingsoon.net/nextraimages/300dvd1.jpg" title="http://www.comingsoon.net/nextraimages/300dvd1.jpg">http://www.comingsoon.net/nextraimages/300dvd1.jpg</a>) - epic battle films, when in actual fact it is quite a beautiful film with no huge battles and a small cast. I would write about the decisions the designers would have had to make about whether to portray a film in an accurate manner or to portray it in a way that it will sell in shops. </p>
    <p>I also thought of how Tarkovsky wanted to transcend the science fiction genre with Solaris, but was unhappy with the final film. The recent criterion release of the film took this into consideration when designing the cover - the designer documents the process on his blog here <a href="http://samsmyth.blogspot.co.uk/2011/05/process-solaris.html" title="http://samsmyth.blogspot.co.uk/2011/05/process-solaris.html">http://samsmyth.blogspot.co.uk/2011/05/process-solaris.html</a></p>
    <p>Any suggestions or input would be valuable at this point, if anyone could point me in the direction of anything relating to this that would be great</p>
    <p>Thanks, </p>
    <p>Ed</p>
