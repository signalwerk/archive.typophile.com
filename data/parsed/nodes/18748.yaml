      <p>In Nick's crop of your sample, the <cite>a</cite> has a tail which is usually only evident in the light, book, regular weights but the <cite>s e g</cite> looks like it's from the bolder weights (the shorter descenders, angled terminals on <cite>s</cite> and <cite>e</cite>)*. That said, the digitalised AG has many inconsistencies throughout the weights and I have no idea if the digitalisation was true to metal. </p>
