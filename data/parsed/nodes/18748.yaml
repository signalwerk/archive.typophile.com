    html: |-
      <p>Well, interestingly enough I came across the answer to our inquiry here while doing some redaing during a lersiurely afternoon. I was looking back to some pages in "Paul Renner: The Art of Typography" by Christopher Blake, and came across some comments concening Tschicholds' reasoning for not setting Die Neue Typographie with Futura. Here is an excerpt:</p>
      <p>"Jan Tschichold's book, Die Neue Typographie, could have feasibly been set in Futura, which was already on the market when the book was in preperation. Even if the typeface had not been quite ready, Renner could have secured its use for the book; instead Tschichold has it set in a grotesk (AG?). There may have been an element of personality clash in this decision; yet, when asked in 1960 why he had not used Futura for the book, Tschichold replied that he never really deemed it suitable for setting texts."</p>
    html_clean: |-
