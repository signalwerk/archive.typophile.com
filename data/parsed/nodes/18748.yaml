    html: |-
      <p>As you can read in the thread Geoff quotes, there is and was no such thing as <em>the</em> Akzidenz Grotesk. And you certainly cannot (oldnick) compare a digital sample of AG Light with a printed one from the 20s. AG – and that's all I'll repeat from previous posts – has been through many iterations, from hot metal, where every size looked different, to photosetting, where one design had to fit all sizes, to digital where there is AG and AG Old Style.</p>
      <p>The sample is definitely set in AG Regular and Bold (Fett). The Super weight was introduced in the 60s only, designed by GG Lange. It never existed in hot metal.</p>
