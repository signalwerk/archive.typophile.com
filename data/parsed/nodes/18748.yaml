      <p>…but on page xxx (yes, that really is three x's… i.e., the Roman numeral for "30") of that same English translation, the Robin Kinross essay at the beginning of the book states:</p>
      <p>"The typeface used was an 'Akzidenz Grotesk': a 'jobbing sanserif,' designed anonymously, probably in the 1900s. For the reasons already outlines, he would have preferred this over any of the recently designed sanserifs, which (in the case of Futura) would hardly have been available for purchase at the time the book was being set…"</p>
      <p>"…But, for the purpose of characterizing Tschichold's preferences, 'Akzidenz Grotesk' in a light (as against medium or regular) weight is sufficient description."</p>
