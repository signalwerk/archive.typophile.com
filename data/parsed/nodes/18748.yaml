      <p>From the "Note on the book and its design" at the back of the English translation (UC Press, 1995): "Aurora Grotesk, shown in the Berthold Phototypes E1 catalog (1974), was identified as the typeface closest to that used in the original German edition." (It goes on to explain that this wasn't available digitally so others were chosen for the translation.)<br>
      The sample in this thread is from a publicity leaflet for the book, which is also reproduced in the introduction (p.xxi) of the translation.</p>
