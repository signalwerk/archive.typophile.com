    html: |-
      <p>1. As far as I know, there is no statistical survey.<br>
      I've done it on a few faces.<br>
      One reason is that when I did a lot of editorial design, I often increased the size of bold subheadings because I felt it looked too small next to the Regular. So that feature of my type design is based on my own taste as a typographer, which I've subsequently rationalized.</p>
      <p>I would say that apparent size is dependent on more than one indicator or cue:</p>
      <p>- Distance between extrema of letter outline<br>
      - Distance between optical centre of horizontal strokes<br>
      - Distance between extrema of negative counter</p>
      <p>The gestalt of height is a synthesis of these height assessments.</p>
      <p>2. Compare the density (overall tone) of the x-height zone with that of the median-to-cap zone. If the x-height is constant from Regular to Bold, then the density of the x-height zone will increase with font weight (in all but the didone genre), giving a relatively bottom-heavy appearance. Raising the x-height counteracts this. But raising the cap or ascender line as well would not.</p>
      <p>3. Because letters stand.</p>
