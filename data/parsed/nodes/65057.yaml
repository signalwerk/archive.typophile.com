      <p>I make the x ht the same for regular and bold of a text design. Overshoots could vary, but not x. If you feel the need to make a bold taller to look right with regular, there may be something else wrong, which could be as simple as you not looking at text, or as complex as the bold contrast is too low or the bold bodies too wide. Shifting the baseline is a size mastering technique that does not help companion faces stick together visually at a common size .</p>
