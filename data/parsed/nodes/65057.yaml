    html: |-
      <p>If you show pairs of glyphs out of context, the differences will be more apparent.</p>
      <p>The reason I think this is done only in the short part of the lowercase has to do with relative scale. When you make letters bolder, the small letters take on much more weight for their size compared to the caps. So the optical effect of adding weight (making the shapes look smaller) is more pronounced in the small letters. And letters like the "s", "e", and "a", which have a lot going on in them (three horizontal strokes each), are more compromised as you add weight. Increasing the x-height as the weight increases helps alleviate both of these problems.</p>
      <p>I've done this in several of my font families to a greater or lesser degree because of the reasons stated above. The thing that always worries me is the idea of someone creating a logo that uses two different weights side by side, where the difference in x-height would become apparent. Even so, I think it's the best way to handle a range of weights. I wouldn't mess with the cap height, ascenders or descenders because I don't think the effect would be as great as with the x-height.</p>
