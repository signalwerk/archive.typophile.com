    html: |-
      <p>I would say you can either adjust the x-height no matter how small the weight variance, or have a threshold below which you don't do an adjustment. I would generally go for the former.</p>
      <p>Yes, lighter weights do need taller x-heights.</p>
      <p>And yes, the intended size does matter. In the same way that round overshoots should be (relatively) smaller for larger point sizes, compensation for the x-height should be inversely proportional to intended size. By how much? I would say in proportion to the variance in round overshoot.</p>
      <p>FWIW in Ernestine, Nina implemented a change of 4 units (only at the x-height, and not at the baseline, which I wanted to also do) between each of the Light, Regular, Demi and Bold.</p>
      <p>hhp</p>
