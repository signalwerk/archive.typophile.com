      <p><em>But Nick, how does overshoot feature in that theory?</em></p>
      <p>It doesn't. I'm thinking primarily of side-heads in Bold, with Regular on the same line, or boldfacing in Regular text, to pick out the names of celebrities or companies. In these situations, the reader's expectation is that the letters stand on the baseline grid, not that they are hung on a harder-to-conceptualize optical centre of x-height, with a baseline that is stepped.</p>
