      <p>Well, I suspect the whole exercise of bumping up the x-height a bit doesn't have so much to do with making it look the same x-height as the regular. In my limited experience I found you just don't have much much room to maneuver in the between the x-height and base line--particularly on the double stories a, e, s, g--and pushing up the x-height a bit helps you to distort the shapes of the regular a bit less. </p>
      <p>Since we don't normally mix bold and regular side-by-side, I'm guessing that Slimbach preferred to keep the same vertical metrics on the ascender and cap height, so the white space between lines wouldn't be crowded.</p>
      <p>edit: Cross-posted with Mark. He has had the same experience, which makes me think this may be the story.</p>
