      <p>&gt;side by side</p>
      <p>I meant we normally don't have a bold and regular adjacent to one another in the same word, as in your examples above. They are separated by a word space. I think that is also the concern Mark mentioned, that in a logo the could well be adjacent, and hence your concerns would be relevant. However, in the case of a logo, things can be custom shifted or redrawn.  </p>
      <p>In the normal case, to do the comparison, you need to have eg a side head in bold, and the sentence continuing in regular. In the case of Adobe Garamond, the 'bold' relative to the regular is actually the semi-bold, so for a bold in the middle of the sentence that would be the comparison. </p>
      <p>I suspect that there you will find that baseline shifting of rounds may create more problems than it will solve. I haven't tried it, and it would be interesting to see--but in any case I think that's the more important comparison, not adjacent glyphs of different weights.</p>
