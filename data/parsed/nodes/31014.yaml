    html: <p>hi, thanks for your reply, and shame on me should it be so :) but i wonder if this really is perpetua? i’ve been comparing some of the features, and it seems that the “A” in my pic has a pointed apex &amp; is wider, whereas Perpetua’s is flat, the x-height seems to be different, “G” feels heavier in Perpetua &amp; less round, Perpetua’s “l” ascender terminal is less gradual, etc., etc.? z</p>
