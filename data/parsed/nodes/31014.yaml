    html: |-
      <p>It’s definitely a Gill face or the copy of one, but I can’t explain the differences from Perpetua. It has all the earmarks, such as the f and d. It’s also not Golden Cockerel. </p>
      <p>Where does this come from? Is it an engraving, or copy of an engraving? Could it be something somebody did following Gill, or an engraving that he himself did? </p>
      <p>This specimen seems like it has bits from different sources slapped together—the sans at the top left, the different typeface at the top right...</p>
