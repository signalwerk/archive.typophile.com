    html: <p>It's really amazing how you can look at something for so long and then someone points out an obvious flaw that's been there all along and you think "how could I have missed that?" Thanks again, Sim for the feedback - some of the items you pointed out really made me redo quite a few letters and I like it better. Would love any other comments big or small - very helpful. Here's the updated font.</p><div class="imageWrap"><img src="http://typophile.com/files/holt-specimen2_5309.jpg"></div><p></p>
