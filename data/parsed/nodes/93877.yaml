    html: <p>Some good thinks in this. At first glance I find the /f,t,y/ terminal too short. The spin of the /Ss/ is too squeeze in the middle, the horizontal of the /2,7/ is too thick and probably the stem of the /1,4/ too also too thick. the /m,n/ should be copy from the /h/ where the stem meet the curve. I prefer the shoulder of the /h/ compare to the the /m,n/. /bdgpq/ seems too wide compare to the /o,e,c/. Finally, compare the terminal of the /c,e/ it should be in the same way. Keep going.</p>
