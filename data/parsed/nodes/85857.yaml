      <p>Your question is a little open ended, but maybe this will help narrow your search a little. Identifont.com allows you to search typefaces by similarity (although it seems to not have Galapagos BKR in its database. However, you can also search by appearance. This can be helpful as well.</p>
      <p>I tried searching by appearance, and recieved <a class="freelinking external" href="http://www.identifont.com/list?17+id+5+8LK+2+4SU+2+67E+2+8O9+2+59+2+E14+2+5R2+2+8LP+3+4CJ+3+6MV+3+CAN+3+1EL+3+6TA+3+OUG+3+P1K+3+5E+3+XI+3+4FY+3+4FX+3+4FW+3+GS+4+NOF+4+2CZV+4+CI1+4+2V3+4+3FE+4+3FF+4+2W1+4+NGU+4+4RK+4" rel="nofollow">these results</a>.</p>
      <p>I also searched for a font in the same family (from the above search, called Timberlake), and recieved <a class="freelinking external" href="http://www.identifont.com/list?3+timberlake+0+E14+1+JEK+4+F3N+4+BLL+4+BJP+4+1WCU+5+6JS+5+MAS+5+NCO+5+G5J+5+LDB+5+EXG+5+HTI+5+F0N+5+F0O+5+BJT+5+AB9+5+9O7+5+9NV+5+7EB+5+7EC+5+F1Q+5+9KW+5+4XI+5+I4Q+5+KTV+5+KU7+5+BQX+5+5PK+5+E0Z+5" rel="nofollow">these results</a>.</p>
      <p>If any of these are closer, you can go back and plug them into "Fonts by Similarity.</p>
