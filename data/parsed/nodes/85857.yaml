    <p>Hi everyone. I have been searching and search for fonts like this and it's been pretty difficult. So, I come here for your expertise. I apologize in advance if I am not good at explaining/wording things.</p>
    <p>The best font I've found thus far is Galapagos BRK</p>
    <p><a href="http://www.allfreefonts.com/font-539-galapogos_brk.html" title="http://www.allfreefonts.com/font-539-galapogos_brk.html">http://www.allfreefonts.com/font-539-galapogos_brk.html</a></p>
    <p>More specifically, I am using the word "know" in all lowercase:</p>
    <p><a href="http://www.allfreefonts.com/custom-thumb.html?d=539&amp;fontfilename=galapog" title="http://www.allfreefonts.com/custom-thumb.html?d=539&amp;fontfilename=galapog">http://www.allfreefonts.com/custom-thumb.html?d=539&amp;fontfilename=galapog</a>...</p>
    <p>The features that appeal to me are:</p>
    <p>1. Sans-serif</p>
    <p>2. No flags on letters like "n" (or whatever that straight part extending on the top left of the letter is called)</p>
    <p>3. All letters follow the "n" form. So, the "w" is like a double upside down "n" and the bottom of the "k" is "n" as well. The "o" is basically 2 "n" against one another, although I am more lenient on the "o" not following suit perfectly (as long as it flows).</p>
    <p>4. This goes along with #2 but basically 99% of all fonts have the "k" and "w" as sharp. Instead of the "k" looking like an "h" they have 2 straight lines making them up. The "w" ends up looking like double "v" rather than a double "u" and it kills it.</p>
    <p>5. Something bold please. It'll be used for a logo</p>
    <p>6. If it were free for commercial use... that'd be great. If not, at least inexpensive to buy with a license that allows me to use the lettering for a logo.</p>
    <p>Any and all help would be greatly appreciated. Thanks!</p>
