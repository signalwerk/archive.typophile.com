    <p>For Immediate Release:<br>
    Buffalo, NY- January 5th, 2010</p>
    <p>P22 Type Foundry and the International House of Fonts ring in the New Year with P22 Nudgewink Pro- a new font designed by Robby Woodard for IHOF.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/NudgewinkPoster_4616.png"></div><p></p>
    <p>Nudgewink is a funky, all caps typeface with a humorous retro 1960s attitude and a very bouncy baseline in three weights- regular, light and bold. The lower case contains a second set of differently designed caps that can be used in combination with the upper case to achieve different effects. </p>
    <p>Pro OpenType features include discretionary ligatures, alternates and ornaments.</p>
    <p>With all the different options, a dynamic handcrafted effect can be achieved with just a little experimentation. So load it up, turn it on and go for it, Dude! Hip and groovy uses include signage, invitations and greeting card design. </p>
    <p>-------------------------------------------------<br>
    Introductory offer through January 31st<br>
    <a href="http://www.p22.com/ihof/nudgewink.html" title="http://www.p22.com/ihof/nudgewink.html">http://www.p22.com/ihof/nudgewink.html</a><br>
    -------------------------------------------------<br>
    View P22 Nudgewink Pro in action in our newsletter:<br>
    <a href="http://p22.com/newsletter/01_05_10.html" title="http://p22.com/newsletter/01_05_10.html">http://p22.com/newsletter/01_05_10.html</a><br>
    -------------------------------------------------<br>
    You can now follow P22 on Twitter.com: <a href="http://www.twitter.com/P22TypeFoundry" title="http://www.twitter.com/P22TypeFoundry">http://www.twitter.com/P22TypeFoundry</a><br>
    ------------------------------------------------<br>
    Become a fan of P22 on Facebook:<br>
    <a href="http://www.facebook.com/pages/P22-type-foundry/11128622951" title="http://www.facebook.com/pages/P22-type-foundry/11128622951">http://www.facebook.com/pages/P22-type-foundry/11128622951</a><br>
    ------------------------------------------------<br>
    Happy New Years!<br>
    P22 type foundry</p>
