      <p>David, 'unnecessary' as a web font format in browsers that support WOFF, as is perfectly obvious from both the general context of the discussion and the specific context of the parallel to SVG fonts.</p>
      <p>Rich, it's the W3C SVG working group that is considering making SVG fonts optional to support of that standard. It's a decision that reflects two realities: the lack of interest from IE and Mozilla in implementing SVG fonts -- IE's VML is similar, but similar doesn't count in standards compliance, which is the point of the Ars Technica comment --, and the standardisation of WOFF by the W3C. It's an acknowledgement that SVG fonts are unnecessary to a web fonts environment if there is a W3C web font standard that a) defines a better format (remembering that SVG fonts have no hinting) and b) has an explicit conformance specification that states that <em>all</em> web font formats other than WOFF are optional, which is the case.</p>
