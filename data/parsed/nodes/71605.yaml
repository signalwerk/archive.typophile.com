      <p>Sergey: <em>OpenType fonts are allowed when embedding bits are set to installable. </em></p>
      <p>And so the notion that <em>document</em> font embedding and web served typography are somehow the same thing is perpetuated. I wish you hadn’t done this. The practical implications are limited, since so few fonts have the document embedding bits set to installable, but it is a misleading confusion of categories. Worse, by arbitrarily limiting the support to fonts with the installable setting, you are equating web served fonts with locally installable fonts, which is exactly the opposite of the impression that the web font standard (WOFF) is designed to promote.</p>
