      <p>Si: <em>Re an alternative opt-in, if we thought for one nano-second that Apple, Mozilla, Opera and Google would have respected such a setting I would have pushed for it harder. If you can point me to any evidence to the contrary I’d love to see it.</em></p>
      <p>But those other browser makers are not respecting any fsType embedding bits with regard to web served fonts. As David points out, Microsoft is the only company that has produced an @font-face implementation that associates a document embedding bit with web served fonts. As you know, I'd prefer MS not to support any sushi in Internet Explorer, and I disagree with all the reasons put forward for doing so, and I think browser makers and font makers alike should tell WaSP where to stick their Acid 3 test, but if you're going to support some raw fonts while at the same time self-imposing a limit on your support related to embedding bits, why not define a bit that clearly means 'web serving for Internet Explorer allowed', rather than assuming that a font that is technically able to be installed from a document embedded status is also allowed to be served on the web?</p>
      <p>So now, people like Rich are going to change embedding bits to installable in order to make raw fonts work in IE, those raw fonts are going to end up in user caches, and, oh look, they're ‘installable’. Sure any number of licenses will be broken along the way, with the possibility of font makers pursuing legal action in response, but we have better things to do with our time and our limited resources. As I've said for a year now: there is no way to support raw fonts on the web that does not expose all existing desktop fonts to casual unlicensed installation and use on recipient's computers and to unlicensed use as web fonts through circumvention of embedding bits or other limitations within the TTF/OTF. <em>So just don't do it.</em></p>
