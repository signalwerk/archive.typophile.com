    html: "<p>The fact that all browsers are, to date, picking and choosing which of the non-standard web font formats to support is evidence enough that no browser maker thinks it necessary to suppport whatever format a web publisher happens to serve. You have it entirely backwards, David: web publishers serve the formats that the browsers support, and they target specific formats to specific browsers. If this were not the case, if things were as you say, then Google et al would be supporting EOT; it is after all still the most widely supported web font format in terms of installed browser base. But obviously the fact that people are serving dirty old EOTs in order to target IE6-8 means nothing to Chrome and Firefox and Safari. The browsers don't need to comply with what the public serve, the public needs to comply with what the browsers support. It is in the interests of both the browsers and the public to agree on a <em>standard,</em> so that moving forward the requirements become fewer rather than more numerous and the cross-browser behaviour more predictable.</p>"
