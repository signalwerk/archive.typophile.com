      <p><cite>I'm now wondering how long it will be before larger screens of that quality make it to market.</cite></p>
      <p>As I’ve noted before it will be sooner than anyone thinks. What else is left for display vendors to market? Size, contrast, color depth, and energy efficiency have all become mostly irrelevant relative to cost. And now that LCDs have been selling with long-life lamps for a few years vendors can’t just wait for people to upgrade dead hardware. Hi-resolution screens are coming. The downside is that for the next ten years web designers will have to target screens ranging from 72 to 300+ DPI. Have fun testing that!</p>
