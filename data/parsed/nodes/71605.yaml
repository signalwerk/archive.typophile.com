      <p>John please stop twisting my words. I said failing Acid 3 on this point was an indicator, not that Acid 3 is a standard. I also didn't say that Acid 3 compelled us. We were compelled by the same reasons as our competitors were, and we did so only after publically seeking community input.  </p>
      <p>Re an alternative opt-in, if we thought for one nano-second that Apple, Mozilla, Opera and Google would have respected such a setting I would have pushed for it harder. If you can point me to any evidence to the contrary I’d love to see it.</p>
      <p>Also we don't own the OpenType specification, just the trademark, we can't just make stuff up and stick it in. Other stakeholders (the people who produce apps that have to enforce them) have consistently voiced opposition to defining additional embedding bits.</p>
