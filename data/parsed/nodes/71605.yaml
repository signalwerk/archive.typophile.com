    html: |-
      <p><cite>&gt; So is font-size-adjust and a dozen of other properties, heretofore ignored exclusively be IE...</cite></p>
      <p>Who tells you they are ignored? And why exclusively by IE? AFAIK, font-size-adjust is only suppored by FireFox so far. Of course, we decide what to implement and in what order. But it does not mean we "ignore" them. In IE8 and even just 7 months ago in IE9, we ignored SVG, Canvas, ECMAScript 5, @font-face rules, WOFF, jscript performance, backgrounds and borders, you get the idea. Anyway, I guess you just missed the wink at the end of my reply.</p>
      <p><cite> &gt;Anyway, to prevent such scenario, I was assuming the following would work for both IE9 and IE6-8, too.<br>
      <code><br>
      &gt; @font-face {<br>
      &gt; font-family: tagesschrift;<br>
      &gt; src: url('http://paulirish.com/tagesschrift.eot');<br>
      &gt; src: local('☺'), url('http://paulirish.com/tagesschrift.eot'),url('http://paulirish.com/tagesschrift.ttf') format("truetype");<br>
      &gt; }<br>
      </code></cite></p>
      <p>Yes, minus the bug that Paul found. I guess syntax that will work with current IE9 and IE8 and Firefox will be to have three src declarations: </p>
      <p><code><br>
      @font-face {<br>
      font-family: tagesschrift;<br>
      src: local('☺'), ,url('http://paulirish.com/tagesschrift.ttf') format("truetype");<br>
      src: url('http://paulirish.com/tagesschrift.eot');<br>
      src: local('☺'), url('http://paulirish.com/tagesschrift.ttf') format("truetype");<br>
      }<br>
      </code></p>
