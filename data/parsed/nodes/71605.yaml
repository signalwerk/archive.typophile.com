      <p>At ATypI I raised the question regarding IE’s possible support for raw fonts, and the approach of using the installable embedding bit as an “opt-in” for web site designers using open source, freeware and custom fonts. Even though that concept hasn't been documented yet, I don’t see how it confuses things - Type Squirrel seems to get it. I don’t think anyone could claim ignorance in switching the bits in commercial fonts.  </p>
      <p>Although naturally type designers and foundries preference is that IE not support raw fonts at all, acting as a roadblock to raw font deployment, that wasn’t an option for the team. I mentioned Acid 3’s inclusion of raw font support in my talk, indicating non-support would be a standards “hole” competitors would exploit.</p>
      <p>Certainly ignoring document embedding bits completely would be easier for all concerned. Happy to field type designer and foundry feedback on this question, here or off-list.</p>
      <p>Seems as if the thread has taken a bit of a tangent. I for one would love to understand how web designers and users feel about the quality of the commercial fonts used in the demos, compared to the freeware alternatives. Do people consider the quality as something they’d be willing to pay for? Also feelings on DWrite vs other rendering environments.</p>
