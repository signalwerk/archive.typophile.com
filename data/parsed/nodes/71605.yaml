      <p><cite>That should describe the issue at hand.</cite></p>
      <p>There are three pages in your report on Connect. </p>
      <p>First page you mentioned on connect, with single line of text on it, is not downloading anything because this @font-face is not referenced in any element. This is what we fixed comparing to IE8. But if you change the page to reference this rule, you will see that fonts from both ‘src’ declarations are downloaded. We should ignore first one, but we do download it. This is simple bug, thanks for finding it. Overall effect is kind of merged list of fonts from all src declarations on the same rule, instead of using just last one.</p>
      <p>Second one, your blog page, only downloads single font from Google. This is what I see in network monitor and under debugger. Let me know if you see something different. Cool mouse effect on canvas, btw.</p>
      <p>I guess, main complaint of your bug is about spec compliance on page demoing Deutsch Gothic. Test page contains two fonts on the same ‘src’ list and IE downloads both even first one will sufficient to display the page. Although this may save bandwidth, I do not see this as violation of the spec. ‘Activate’ is not exact word, and it does not define moment when I should or should not start downloading the font, there is no way to prohibit speculative downloads. Said that, I agree that it may be possible to figure out better tuning for cases when we should start downloading particular font. This is not RTM yet, so there is time to work this out. </p>
      <p><cite>Font-stretch? Why would you do that?</cite></p>
      <p>Because it is in CSS3 Fonts spec ;).</p>
      <p><cite> IE9 really, really turns a corner. SVG, Canvas and a whole lot more. Congrats. You got your mojo workin', fella.</cite></p>
      <p>Thanks, Rich. It was great pleasure working on all this stuff, I’ll tell you. Even more exciting to seeing it out.</p>
      <p>Thanks,<br>
      Sergey</p>
