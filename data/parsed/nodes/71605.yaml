      <p>JH&gt;<em>You mean that if the Generator is processing a font that has an fsType bit set to something other than installable you are changing the bit?</em></p>
      <p>Related to this: IMHO, MSFT's enforcement of the bits will have exactly the opposite effect that I am assuming they think it will have. I just don't get their reasoning.<br>
      Because of the potential for causing either a "double download" or, if there is no EOT as a fallback, no font download at all, I've been asking myself the question: "Well, Rich, what would you advise webdevs to do?"<br>
      The prudent, rational thing is to change the bits to installable as a matter of best practice.<br>
      How can you ask someone who's trying to get fonts to work on their web page to add to their problems? Especially a problem that's difficult to identify?<br>
      If helping to enforce licenses is MSFT's goal, they will get exactly the opposite.<br>
      Just my expectation - that's all.</p>
