      <p>Rich: <em>Puckett's right, I'm wrong. I changed my mind yesterday when I saw Apple's new iPhone display. Stunning.</em></p>
      <p>James: <em>Size, contrast, color depth, and energy efficiency have all become mostly irrelevant relative to cost</em></p>
      <p>Making small high resolution screens for mobile devices is relatively easy and cost effective. But the larger a screen gets the greater the chance of a manufacturing error resulting in a dead pixel. Since such an error means that the whole screen needs to be junked, the attrition costs of manufacturing larger high resolution screens has been considered prohibitive.</p>
      <p>I saw my first 200ppi screen twelve years ago. For much of the intervening period I worked daily on first 133ppi and then 144ppi laptop screens. I've been waiting a long time for widespread adoption of higher resolution computer monitors, and it hasn't happened. Only when screen size came down did resolution start going up. But meanwhile, I've gone in the opposite direction: my desktop screen is only 96ppi, but is it huge (30") and I sit further back than I used to.</p>
      <p>Want high pixel density? Move your chair.</p>
