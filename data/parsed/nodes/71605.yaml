      <p>David, it's a simple enough and purely practical point: if a browser supports WOFF, there is no technical need for it to support any other delivery format for web served typography. The W3C sensibly recognised this when they made support for only one web font format necessary for standards conformance: you only need one to make it work. For backwards compatibility with existing browsers, web authors and web font services are going to need to continue to serve multiple formats targeting various browsers. <em>But the browser itself only needs to support one.</em> The browser doesn't gain anything by supporting more than one. Ergo, for any new browser that supports WOFF, any other format, whether it is SVG or naked TTF/OTF or EOT is <em>unnecessary.</em></p>
      <p>The differences between these formats are irrelevant to the question of whether any of them is necessary in a browser that already supports WOFF.</p>
