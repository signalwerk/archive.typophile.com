      <p>(There's lots of good questions and points on this thread. I chose to focus on the following for now.)</p>
      <p>Sprach Thomas Phinney:</p>
      <p><em>Embedding bits: You and Ethan may not care much, but I'm sure that many font vendors will view modifying embedding bits as a violation of their EULA.</em></p>
      <p>I can't speak for Ethan but I actually "care" a lot. Contrary to popular belief, I'm a stare decisis kind of guy and not naturally inclined to throw out a system that the industry has relied on for a number of years. Not without a good reason. Not without thinking things through.<br>
      But I think everybody on this thread realizes that the system as it stands isn't going to work on the web. Yet, in IE9, MSFT has decided to break with the pack, stick with the bits, and load only "raw" fonts set to installable embedding.</p>
      <p>A couple of points:</p>
      <p>Yesterday I found myself reading a short piece in the Harvard Journal of Law &amp; Public policy about the concept of "necessity" as a legitimate defense to all kinds of otherwise illegal activity. (The article was about "necessity" in regards to the seizure of private property for public purpose under Eminent Domain.)<br>
      The question it raised for me was: Under what circumstances might "necessity" be reasonably viewed as a valid rationale for infringement and/or the breaking of a EULA contract? Even in just a moral, if not strictly legal, sense?<br>
      IE9 puts web devs in a position where, if the embedding bits aren't a certain way, the font doesn't work interoperably across browsers. And it won't work in what will become the world's most popular browser: IE9. And, presumably, IE10, 11, and 12, too.<br>
      (Yeah, yeah, they can make a WOFF, an EOT, whatever. That's IF they know what their options are.)<br>
      At FontCONF in St. Paul last week, I led a session of about, I think, 40 or so designers. People who - even if they aren't web designers per se - are at least font minded or else they wouldn't have been at the conference. At one point I asked the entire group if they knew that there was such a thing as an embedding bit. Except for a small group of type designers and a few cogniscenti, all I got was a bunch of blank stares. Embedding bits? <em>They had no idea what I was talking about</em>.</p>
      <p> *Before the web, enforcement of the bits was built into software. Why <em>would</em> anybody know about it - the software took care of it. But on the web it's different, and we've moved to an honor system of sorts. Except that nobody understands there's even a system, let alone what "honorable" behavior is expected. This is the reality, folks. And in any rational strategy, it must be taken into account *</p>
      <p>Once having purchased a license, which may or may not be refundable, what should a web developer do to get that font to work interoperably? How many hours should they spend? How many EULAs should they try to decipher? Everybody's got families to feed and bosses to satisfy and there is very much a "necessity" involved in getting the font to work right and load as efficiently as possible.<br>
      If there were no legal considerations at all, changing the bits to installable for every font would be considered a best practice. Period. And since the average web customer will probably be unaware that there are special restrictions expected of them beyond the payment of the initial license fee and the download of the font file, what do you think they are going to do?<br>
      They are going to <em>serve their own self-interests</em>, their own <em>necessity</em> and change the bits.</p>
      <p>(I do think, however, that most web buyers will realize that redistribution is generally verbotten. But that's about it as far as prohibitions.)</p>
      <p>Why put web developers in a position where they have to choose like this? Why force a situation where many will unknowingly break the fine print in the contract?<br>
      What's the point of this? I'm missing it.</p>
