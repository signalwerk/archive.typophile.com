      <p>John H:</p>
      <p>I think I disagree with you, if I understand what you're arguing.</p>
      <p>Richard Fink is suggesting that web font processing tools should process existing fonts to change their fsType bits to "installable." You take that as evidence that using the absence of the "installable" setting to mean the fonts are not OK as raw-TTF web fonts is a bad idea, and a new embedding bit should have been invented instead.</p>
      <p>I have two problems with your line of argument.</p>
      <p>First, if a new embedding bit had been invented, don't you think that Richard would be saying web-font-processing tools should be setting that bit? How on earth would that help?</p>
      <p>Second, I don't see the use of the installable setting the same way you do. I see it as "if the bits are NOT set to installable, then we're not giong to process the font. if the bits ARE set to installable, then we'll process the font... but that doesn't trump the EULA."</p>
      <p>That's exactly the way I understand the existing uses of embedding bits advising apps on what to do with fonts for actual document embedding, as well. A font may be set to preview and print embedding, but that doesn't mean it's okay for that under all circumstances. There may be additional strictures, and you still need to read the EULA. Maybe it has commercial PDF restrictions, or it requires extra money if you use the PDF anywhere outside the organization that licensed  the font in the first place, or it only allows you to embed fonts in documents if they are never viewed on Thursdays.</p>
      <p>All that being said, I actually do agree that inventing a new bit would have been preferable to overloading the meaning of "installable" in this way (even though MS originally intended for these bits to apply to web fonts). I just don't think it's a huge deal, either.</p>
      <p>The stakeholders in the Open Font Format (OpenType) spec could still rally 'round and try to get some such change through. I think it would be a fine thing. We'd need to have a firm proposal: is the new bit a positive or negative one, do we need two bits just to get around the issue of existing fonts not having a setting, or do we rev the OS/2 table version?</p>
      <p>Cheers,</p>
      <p>T</p>
