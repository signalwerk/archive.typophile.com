    <p>Today, we release third platform preview of Internet Explorer 9.</p>
    <p>There is lots of great stuff there. One thing that may be really interesting for Typophile audience, is that it includes support for WOFF format! </p>
    <p>In addition, we implemented support for extra properties of @font-face rule: multiple fonts in src property, format() hint, font-weight, font-stretch, font-style and unicode-range.</p>
    <p>You can go to <a href="http://ie.microsoft.com/testdrive/" title="http://ie.microsoft.com/testdrive/">http://ie.microsoft.com/testdrive/</a> to install PBB3 and navigate through demos. Enjoy!</p>
    <p>Thanks,<br>
    Sergey</p>
