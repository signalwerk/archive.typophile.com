      <p><cite>What we really need is a robust mechanism for auto-selection of ppem-specific fonts relative to the varieties of ways in which CSS allows web authors to specify type size (including, now, the 4/3 point virtual pixel!). Yes?</cite></p>
      <p>No. That solution will only work for businesses with the money to pay for ppem-specific fonts and it would also require experienced screen type designers to create said fonts. As nice as it would be for all of us to spend a few weeks on an island learning to create these great screen fonts from masters like you and David, it’s not a realistic option. We would run into the same problem we have with TrueType hinting: the resources to deploy it widely will not exist before the technology is obsolete. </p>
      <p>Apple has already solved this problem: develop the best rasterizer possible without worrying about hinting or size-specific designs and get the engineers busy on better LCDs. What we really need is for Microsoft and PC hardware makers to get busy doing what they always do: admit that Apple was right and get to work on a knockoff.</p>
