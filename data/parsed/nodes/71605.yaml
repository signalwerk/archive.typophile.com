      <p>Si: <em>I mentioned Acid 3’s inclusion of raw font support in my talk, indicating non-support would be a standards “hole” competitors would exploit.</em></p>
      <p>Except Acid 3 is not a standard and was not created by a standards body. It was created by WaSP, which is an industry advocacy group, and represents a cherry-picked selection of features that best apply the pressure members of that group wish to apply (apparently successfully in the case of IE9's raw font support).</p>
      <p>I find little to disagree with in Eric Meyer's <a href="http://meyerweb.com/eric/thoughts/2008/03/27/acid-redux/" rel="nofollow">critique of Acid 3</a>.<br>
      ___</p>
      <p>Rich: <em>The prudent, rational thing is to change the bits to installable as a matter of best practice.<br>
      How can you ask someone who's trying to get fonts to work on their web page to add to their problems? Especially a problem that's difficult to identify?<br>
      If helping to enforce licenses is MSFT's goal, they will get exactly the opposite.</em></p>
      <p>And so it goes, Si.</p>
      <p>You could have defined a new fsType bit for raw font web serving permission, which would have precisely targeted the needs of open source, freeware and custom font makers and users, without confusing document embedding with web font serving. Remember, one of the principle reasons for developing a dedicated web font format is to draw a line between existing desktop fonts and web fonts. You could have done the same thing for raw font serving permissions, and avoided the implication that any existing font with an installable document embedding bit setting is licensed for web serving. If you feel Acid 3 compels you to support raw font linking in some way, you have rather more say in just what way than most other browser makers. You do, after all, own the OT font specification. :)</p>
