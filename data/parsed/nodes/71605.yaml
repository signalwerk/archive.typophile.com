      <p>David, re. font-size-adjust:</p>
      <p><em>To adjust the sizing of fallback fonts to the user's preference for text, as 1em, is what I understand it to do...</em></p>
      <p>Who do you mean by ‘user’ in this context? The web author or the reader?</p>
      <p>The CSS3 spec succinctly defines the role of font-size-adjust like this:</p>
      <p><a href="http://www.w3.org/TR/css3-fonts/#aspect-value" rel="nofollow">This property allows authors to specify an aspect value for an element that will effectively preserve the x-height of the first choice font, whether it is substituted or not.</a></p>
      <p>In any case, even if your understanding were correct, this would still be something that relates specifically to fallback font mechanisms, not to web served typography.<br>
      ___</p>
      <p><em>What, in this analogy does the horse, barn, barn door and field represent?</em></p>
      <p>horse = type on the web<br>
      barn = locally stored fonts (requiring fallback font mechanisms)<br>
      barn door = font.size.adjust<br>
      field = web served fonts (no fallback font mechanism required except where web served fonts not supported)<br>
      ___</p>
      <p><em>You can prove this?</em></p>
      <p>I thought you had. :)</p>
      <p>It follows logically that if the instruction set no longer does what it used to do, i.e. make size-specific outline adjustments relative to the grid, then such adjustments need to be made at the outline creation level, with size-specific fonts. Or, if you want a more precise analysis, with size-specific outline sets, which with present font format technology implies separate fonts. It is possible that the outline sets for different sizes could be incorporated in the same font, but there are drawbacks to this approach: a) outlines fit best to grid if the UPM varies to a multiple of the design grid for each size and b) it won't work for fonts with really big character sets, e.g. Chinese, because you'll hit the 64k glyph limit.<br>
      ___</p>
      <p><em>But being coupled to a specific set of h-ware, makes a big difference. And, decoupling x font scaling from y font scaling does the same thing as yo u say, but in an open hardware environment, it's... different, don't chya know?</em></p>
      <p>No argument from me there. Apple, Microsoft, Adobe, and anyone else using sub-pixel rendering/positioning and/or ignoring some or all of the instruction set are pushing optimisation of on screen type onto the outline. James was suggesting that Apple's rendering somehow solves the issue of readable text on screen. Leaving aside the fact that I think ClearType does a better job of maintaining stroke density consistency and, as you say, Apple has the advantage of (mostly) not operating in an open hardware environment (Safari on Windows is a wild rendering ride), I'd say, rather, that by providing the lowest common denominator of instruction support Apple defines how size-specific outline creation needs to be done to optimise a design for a given size across the majority of rendering environments. In other words, if all sub-pixel rendering worked like ClearType, we'd only need to optimise outlines horizontally relative to the grid, and could hint in the other direction. But Apple's rendering obliges us to optimise outlines in both directions.</p>
