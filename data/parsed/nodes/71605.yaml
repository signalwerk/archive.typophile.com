      <p>Tom, I think you've missed the train of my argument and have associated two distinct objections.</p>
      <p>My first objection is to any support of raw fonts in web served typography. I believe it is both undesirable and unnecessary, and that the arguments made in favour of it are weak in light of the vulnerabilities -- vis à vis existing desktop fonts and casual piracy -- that it inevitably introduces. What Rich suggests is simply evidence of the vulnerability and the quickness with which it will be exploited. That he would, as you point out, presumably make the same suggestion re. any new embedding bit is simply further evidence of the inherent vulnerability in all raw font linking.</p>
      <p>My second objection is that <em>if</em> Microsoft is going to implement support for raw font linking but with a self-imposed limitation, that limitation should not be based on associating an existing document embedding bit with web served typography. It perpetuates the confusion of document embedding and web font linking, introduced by EOT and now simply made more confusing by implying that web linkable = installable. </p>
      <p>The first objection overrides the second one: the best thing is simply not to offer any support for raw font linking. It isn't necessary, especially not in a browser that already supports a legacy EOT format and a soon-to-be-W3C-standard WOFF format.</p>
