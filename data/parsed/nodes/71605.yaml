      <p>David: <em>It better be still there, if the W3C's precious @ff is ever going to make a dent in the size of the web.</em></p>
      <p>As I understand it, the font-size-adjust property is designed to adjust relative sizing of fallback fonts so that they match the x-height of the missing specified font, i.e. it is a way of specifying the aspect ratio of the desired font in the CSS so that when that font is not available at least some information about it is available and can be used to calculate adjusted size of substitute fonts. Since one point of @font-face and web served fonts is to reduce the instances of specified fonts not being available, and hence reduce the instances of font fallback -- in an @font-face web, only browsers that don't support @font-face and the served web font format will need font fallback --, I don't see how font-size-adjust is critical to the success of @font-face. Indeed, I wonder if browser makers are looking at font-size-adjust as a fix for a problem that they expect to largely go away with @font-face web served typography, and hence something that they're not prioritising.</p>
      <p>Don't get me wrong: I think font-size-adjust is a clever idea and one that the web would have benefited from since CSS first came along. Now, though, it looks like a barn-door-closing mechanism, and the horse is running free in a totally different field.</p>
      <p>What we really need is a robust mechanism for auto-selection of ppem-specific fonts relative to the varieties of ways in which CSS allows web authors to specify type size (including, now, the 4/3 point virtual pixel!). Yes?</p>
