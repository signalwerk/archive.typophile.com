      <p>James, I'm not suggesting a mechanism for size-specific fonts is a sole solution for web typography: the majority of web typography will continue to rely on rasterisation of scaled outlines, with or without some amount of hinting. The problem that I seek to address is <em>optimised</em> readability on screen within the context of the variety of rasterisation models now in use and emerging. The dominant rasterisation models, using sub-pixel rendering, decouple outline scaling and size-specific device-dependent outline and spacing adjustments (hinting), either partially, completely or in non-linear fashion. This means that the <em>only</em> way to optimise type for screen is to produce size-specific designs. Let me say that again, in case anyone missed the key word: the <em>ONLY</em> way to optimise type for screen is to produce size-specific designs.</p>
      <p>Sub-pixel rasterisation and/or positioning, especially when combined with y-direction greyscale antialiasing, makes the majority of type <em>look</em> better on screen. But looking better is not the same as optimised for readability.</p>
      <p>You mention Apple's rendering, but miss the point that by decoupling font scaling from size-specific outline and spacing adjustment, Apple oblige designers seeking to optimise for screen readability to do so at the outline design level, because there isn't any longer any other level. Sure, type on screen under Apple's full-fuzz rendering looks a heck of a lot better than unhinted type used to look, but it can only be optimal at, at most, <em>one size</em>. The only way to increase the range of sizes at which type is optimised for readability is to provide individual fonts for those sizes. That is the only mechanism available by which the designer can control the outline-to-raster-grid relationships, maintain stroke density and affect spacing.</p>
      <p>Sure, a mechanism for auto-selection of ppem-specific fonts is something that presumes customers with money to spend on the development of such fonts, and isn't something that is going to replace rasterisation of scaled outlines. But such customers do exist, and it isn't intended to replace anything, only to make possible what is currently impossible: dynamic optimisation of type for reading on screen.</p>
