    html: |-
      <p>@paul irish</p>
      <p>I discussed this with Sylvain G and Ethan Dunham (not you too?) some months ago.</p>
      <p>In IE9, as long as tagesschrift.ttf has the embedding bits set to installable, my understanding is that IE9 won't and should not "double back" and grab the EOT.<br>
      That not what's happening here?</p>
      <p>@font-face {<br>
          font-family: tagesschrift;<br>
          src: url('http://paulirish.com/tagesschrift.eot');<br>
          src: local('☺'), url('http://paulirish.com/tagesschrift.ttf') format("truetype");<br>
      }</p>
      <p>Anyway, to prevent such scenario, I was assuming the following would work for both IE9 and IE6-8, too.<br>
      @font-face {<br>
          font-family: tagesschrift;<br>
          src: url('http://paulirish.com/tagesschrift.eot');<br>
          src: local('☺'), url('http://paulirish.com/tagesschrift.eot'),url('http://paulirish.com/tagesschrift.ttf') format("truetype");<br>
      }</p>
      <p>IE9 should pass by the first src descriptor and parse the second, stopping when it finds the first file it can use - the EOT.</p>
      <p>Haven't tested nothin' yet. But I saw this "uninstallable TTF causing double download" problem coming. IE9 can't know if the TTF is eligible until it downloads and inpects. Then - if you read the spec carefully - it's kind of/sort of OK for it to double back and take the eot in the first descriptor. (It's a little ambiguous but it can be interpreted to allow it. And Sylvain says it was drafted with this scenario in mind.)<br>
      Hence, the redundancy in the second version which should produce a single download in all versions of IE.<br>
      If not, something's buggy in Denmark. Redmond, too.</p>
      <p>rich</p>
