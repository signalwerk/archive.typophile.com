  - id: 417393
    user: 44873
    date: 2010-06-24T21:30:00
    date_raw: 24 Jun 2010 — 9:30pm
    votes: null
    html: |-
      <p>@sergey</p>
      <p><em>Although this may save bandwidth, I do not see this as violation of the spec. ‘Activate’ is not exact word, and it does not define moment when I should or should not start downloading the font, there is no way to prohibit speculative downloads.</em></p>
      <p>As far as "speculative" downloading of fonts versus "on demand" loading - by way of a solution, perhaps something that acts like the "defer" attribute of the script element would be helpful.<br>
      I see three situations:<br>
      1) Totally speculative - the font declared is immediately requested<br>
      2) Browser waits to determine if the font is actually used on the page and then requests.<br>
      3) Font is "lazy loaded" after the page is rendered - as some resources are so as to cache them or "defer" them. One example would be a font that's only used in a print stylesheet but has no bearing on screen display. Deferred loading would also be useful with italic and bold fonts that, when absent, are simulated by the browser and can thus be more subtly updated when the font arrives than can the "normal" text.</p>
      <p>None of this is being discussed in the Fonts WG, but there would be no violation of the spec that I can see, either. In fact, providing these options would enhance interop with Firefox, for one.<br>
      This might be worth running by the members of the WG.<br>
      Ease of implementation for such a thing? I'd be interested to hear.</p>
      <p>rich</p>
