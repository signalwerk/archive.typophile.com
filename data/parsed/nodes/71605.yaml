      <p>JH&gt;the best thing is simply not to offer any support for raw font linking. </p>
      <p>And here is where we basically disagree(d). Any new format is an inviting gateway to copyright and trademark violation, as you see, as opposed to a simple licensing issue that’s solved more “naturally”. Any new format makes the browsers, (which employ the end user's device(s) to make derivative software), into agents of violation. Any new format spawns conversion programs to that format, and these can do "whatever" to “whatever” as you see. And, a new format splintered the effort to get one good format.</p>
      <p>JC&gt; The first objection overrides the second one:</p>
      <p>Objections overruled. There is no OT format, it’s just a name used by MS and Adobe referring to an ISO spec. That spec. contains the ClearType that’s mangling readability, and does not provide to users the results of hinting ISO sought when they started OFF. WOFF can’t gather meta-data alone (if ever), and whatever surprises were to be in the “Private Data”, WOFF is not “the web standard”, so no one will make conversion software that retains it, would you? And the CSS type spec. is not well enough informed to meet the challenges of real typography on the web, anyway.</p>
      <p>I’d say this is actually better than watching baseball played with a butterfly and nets instead of a ball and gloves. It's just sad when young readers get in the way. </p>
      <p>Cheers!</p>
