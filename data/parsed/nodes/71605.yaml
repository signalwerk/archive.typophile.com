      <p>From the <a href="http://arstechnica.com/microsoft/news/2010/08/microsoft-releases-final-internet-explorer-9-platform-preview.ars" rel="nofollow">Ars Technica review</a> of the IE9 preview 4:</p>
      <p><em>The browser's standards conformance has been improved, too. It now earns a score of 95/100 in the Acid3 test. The five failing tests are all in areas of the SVG specification that are in transition; SVG fonts and SVG SMIL animation. The SVG working group is considering making SVG fonts optional, as WOFF fonts—which Internet Explorer 9 will support—appear to be the standard that has gained momentum. In a world with widespread WOFF support, SVG fonts are unnecessary. The Mozilla project is taking a similar stance.</em></p>
