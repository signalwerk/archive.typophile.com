    html: <p>There is no shortage of script fonts that can give you a similar look though. You could tweak <a href="http://www.myfonts.com/fonts/paratype/english-157-bt/english157-bt/testdrive.html?s=Cadillac&amp;p=72" target="_blank">English157</a>. Slant it a bit, cut off the loop on the C, reduce the ascenders. But I'm sure there are others too.</p>
