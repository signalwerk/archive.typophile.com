    html: <p>This is extremely unlikely to be based on a font. Automobile companies have lettering artists on staﬀ just to do stuﬀ like this (the most famous being Richard Isbell). They don’t just go out and buy a font when they design a logo for a $30,000 car. They want something special, something exclusive.  <br><br>That said, it is possible that a Cadillac fan somewhere has created a free font modeled on this logo. Possible, but not likely, since scripts like this are one of the most diﬃcult kind of fonts to do&nbsp;well.</p>
