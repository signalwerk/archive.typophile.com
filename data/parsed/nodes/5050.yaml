  html: "<p>Hey Folks, <br> <br>I'm trying to find the Cadillac script font (and am having very little luck).  Does anyone know the font name and/or where to obtain it... hopefully for free?  Here is an example of the font: <br> <br><a href=\"http://www.alghanim.com/Automotive/images/cadillac%20logo.jpg\" target=\"_blank\">http://www.alghanim.com/Automotive/images/cadillac%20logo.jpg</a> <br> <br>Thanks so much and have a beautiful day. <br> <br>Kevo</p>"
