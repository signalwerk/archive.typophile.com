    html: <p>Thanks.  I've examined both Brill and EBGaramond; neither one appears to have a KERN table.  Indeed, Brill appears to be exclusively an OpenType/PS (CFF) font, which means by definition it can't have one.  I assume they both define kerning via GPOS instead...</p>
