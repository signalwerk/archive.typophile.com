  html: |-
    <p>I'm trying to write a program which has to parse a TTF/OTF file's KERN table, search through the subtables until it finds a format 0 subtable, and extract the kerning pairs.</p>
    <p>It seems to work OK as long as the format 0 subtable is the first and only one (which seems to be the case for all the fonts I have).  However, I have doubts about the reliability of my logic to skip past multiple subtables of differing types.  I definitely need to test this functionality.</p>
    <p>Unfortunately, I don't seem to have any fonts which have multiple kerning subtables.  Does anyone know where I can find one?  Specifically, a TrueType (or OpenType/TT) font which contains multiple subtables in the KERN directory, (and preferably where the very first subtable is not format 0).</p>
