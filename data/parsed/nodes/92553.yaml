    html: |-
      <p>If this sample comes from a metal or hand-painted sign, it's possible that you aren't going to find a match with an extant typeface: you may only get bits and pieces to match.</p>
      <p>For example, the sharp vertices on the A and V aren't carried over to the N. Also, the rigid carryover of the E-H midline to the P is rather clumsy.</p>
