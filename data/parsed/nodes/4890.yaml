    html: <p>For historical fiction, why not a typeface that is itself an historical fiction? <br> <br>By that I mean one that is not a revival, but done in the style of a bygone era. <br> <br>And depending on how much anachronism there is in the story, that could effect the decision also. <br> <br>For instance, Storm's "Sebastian" is an anachronistic historical fiction -- a sans serif from the 18th century -- so would be suitable for stories involving modern gadgets "time-transported" into the past.</p>
