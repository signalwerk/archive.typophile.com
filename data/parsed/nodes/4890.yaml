    html: <p>Aku, <br>Are you asking which of the faces you already have to use or are you asking what is the best solution for the job at hand? If the latter then we need to know more about the storyline, place time, etc. (as Hrant mentioned above).  <br>In my opinion, the actual typeface used for the body text has less to do with conveying the intent of the subject matter than the display fonts selected and how the typography is designed on the page.  Those of us here on this list are far more likely to be sensitive to typographic nuances than the average mystery novel reader so you can choose a good neutral text face with good readability from your collection and focus your design abilities on the front matter, chapter dividers, and cover to convey the meaning of the content. <br> <br>ChrisL</p>
    html_clean: <p>Aku, <br>Are you asking which of the faces you already have to use or are you asking what is the best solution for the job at hand? If the latter then we need to know more about the storyline, place time, etc. (as Hrant mentioned above).  <br>In my opinion, the actual typeface used for the body text has less to do with conveying the intent of the subject matter than the display fonts selected and how the typography is designed on the page.  Those of us here on this list are far more likely to be sensitive to typographic nuances than the average mystery novel reader so you can choose a good neutral text face with good readability from your collection and focus your design abilities on the front matter, chapter dividers, and cover to convey the meaning of the content. <br> <br>ChrisL</p>
