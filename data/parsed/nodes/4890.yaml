    html: "<p>Well, maybe not \"know\" and \"best\" - at most \"think\" and \"good\".  :-) <br> <br>For a detective story I think any Garamond would look somewhat awkward (although few people would actually complain explicitly). What to use instead: could you give more details, like more info about the story, how long it is, etc.? <br> <br>Garamond is more appropriate to historical topics, but then you have to say what target age it's for - because below about 10 years of age children don't read very immersively, so something like ITC Garamond (shudder) would actually be good. <br> <br>The printer: more than imaging language, <i>resolution</i> is your biggest concern. From what James Montalbano has said, on a \"desktop\" you can only get a true idea of the final result by using a 2400 dpi laser (because the lower the resolution the more gain in the letterforms, throwing off the color and texture). If that can't happen, you might do some early testing of one key page directly on lino/velox, then work \"semi-blindly\" from there - pretty normal procedure anyway. <br> <br>hhp <br></p>"
    html_clean: "<p>Well, maybe not \"know\" and \"best\" - at most \"think\" and \"good\".  :-) <br> <br>For a detective story I think any Garamond would look somewhat awkward (although few people would actually complain explicitly). What to use instead: could you give more details, like more info about the story, how long it is, etc.? <br> <br>Garamond is more appropriate to historical topics, but then you have to say what target age it's for - because below about 10 years of age children don't read very immersively, so something like ITC Garamond (shudder) would actually be good. <br> <br>The printer: more than imaging language, <i>resolution</i> is your biggest concern. From what James Montalbano has said, on a \"desktop\" you can only get a true idea of the final result by using a 2400 dpi laser (because the lower the resolution the more gain in the letterforms, throwing off the color and texture). If that can't happen, you might do some early testing of one key page directly on lino/velox, then work \"semi-blindly\" from there - pretty normal procedure anyway. <br> <br>hhp <br></p>"
  - id: 35668
