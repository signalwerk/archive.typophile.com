    html: "<p>The detective story: Baskerville is certainly a great \"adult\" (no, not that kind :-) face for a short novel. Maybe a bit too \"rational\", but if it smells like a detective story then maybe just right. Which cut of Baskerville? That's where the usage experts are needed... <br> <br>The historical novel: Palatino might actually be very fitting, since its somewhat large x-height (compared to its more bookish sister, Aldus) might be just the thing for the transition from non- to immersive reading. The main problem with Palatino though is that it's too common. So maybe Trump or Kis would indeed be better overall, although you'd have to set them a bit big (like 12). <br> <br>&gt; Do boys and girls prefer the same fonts? <br> <br>There might actually be some empirical evidence about this, but: <br>- It will be hard to locate. <br>- It's unlikely to be very reliable. <br> <br>I wouldn't get that detailed in font choice \"context\" if I were you - it's quicksand. <br> <br>&gt; what you would choose for: .... <br> <br>Hey, I could waste <i>days</i> on that...  :-) <br> <br>hhp <br></p>"
