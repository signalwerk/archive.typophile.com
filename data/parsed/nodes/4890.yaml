  html: "<p>Does anyone know which Garamond would look best in the following books: 1) a detective story; 2) a historical fantasy novel for children. <br>I intend to use my Bitstream collection which has the Bitstream versions of Stempel Garamond, Garamond #3 and Sabon. <br> <br>I don't like very thin fonts such as digital Bembos. <br> <br>What kind of printer should I have in order to see the fonts exactly as they will look in the final result (=book)? I think the printer should be able to emulate Postscript or something. <br> <br>Or should I forget Garamonds and use something else, such as ITC New Baskerville or Minion which I also have? (Although Minion looks condensed, intended for narrow columns only and perhaps too modern). How about Trump Medieval (Kuenstler 480) or Bitstream Kis? Please help.</p>"
  html_clean: "<p>Does anyone know which Garamond would look best in the following books: 1) a detective story; 2) a historical fantasy novel for children. <br>I intend to use my Bitstream collection which has the Bitstream versions of Stempel Garamond, Garamond #3 and Sabon. <br> <br>I don't like very thin fonts such as digital Bembos. <br> <br>What kind of printer should I have in order to see the fonts exactly as they will look in the final result (=book)? I think the printer should be able to emulate Postscript or something. <br> <br>Or should I forget Garamonds and use something else, such as ITC New Baskerville or Minion which I also have? (Although Minion looks condensed, intended for narrow columns only and perhaps too modern). How about Trump Medieval (Kuenstler 480) or Bitstream Kis? Please help.</p>"
