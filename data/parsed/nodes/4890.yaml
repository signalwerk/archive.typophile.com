    html: '<p>The detective story is actually an old-fashioned soap opera set in current time, yes it has a killer but no detective. It is targeted for the middle-aged and elderly. It is not very long. In front of me I have an old UFO book "Sky people". It is set "in 12 on 13 point Intertype Baskerville". Looks very clear to my eye. Yes, no Garamond for the detective story - perhaps 11/14 point ITC New Baskerville would do the trick? <br> <br>I intend to use the faces I already have. However, if you experts come out with a clearly superior choice, I could reverse my decision. I am a spineless weakling! <br> <br>The historical novel is targeted for girls of 9-12 years. It is set in ancient Egypt of the pharaohs but with time travel. How about Zapf Calligraphic 801 (=Palatino) for this - it would be easy to read but would it be boring too? Do boys and girls prefer the same fonts? <br> <br>Just for curiosity - what you would choose for: <br>1) Farewell my lovely (by Raymond Chandler) <br>2) Pet sematary (by Stephen King) <br>3) Space Odyssey 2001 (by Arthur C. Clarke) <br>4) pocket size biography of a fashion designer <br> <br>Thanks! Aku</p>'
