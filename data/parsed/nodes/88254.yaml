      <p>If you are searching for people on the cutting edge of experimental or 'speculative type' design...</p>
      <p>I would include 'andrew byron' as just such a person.</p>
      <p>He certainly pushes the boundaries of type design and opens up our imagination to look at things in a different way.</p>
      <p>I like his stuff.</p>
      <p>Not very marketable, but some of his ideas would make for an interesting font.</p>
      <p>In fact, I think I've seen type designers mimicking some of his ideas and stuff recently.</p>
      <p><a href="http://www.designboom.com/weblog/cat/8/view/8293/experimental-type-by-andrew-byrom.html" title="http://www.designboom.com/weblog/cat/8/view/8293/experimental-type-by-andrew-byrom.html">http://www.designboom.com/weblog/cat/8/view/8293/experimental-type-by-an...</a></p>
      <p>And here is an interesting link to experimental type design, compiled by Luc Devroye.</p>
      <p><a href="http://luc.devroye.org/experimental.html" title="http://luc.devroye.org/experimental.html">http://luc.devroye.org/experimental.html</a></p>
      <p>And here are some really interesting images... ouch, that's got to hurt!</p>
