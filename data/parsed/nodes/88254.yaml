  html: |-
    <p>I would like to compile a list of living designers who<br>
    have exhibited high insight into "speculative" type design:<br>
    works that push the boundaries with no firm hope of success.<br>
    These don't have to be finished fonts, they just have to exhibit<br>
    unorthodox thought, hopefully causing others to expand their<br>
    design horizons. If you list anybody it would be nice to mention<br>
    specifically why.</p>
    <p>This list might include graphic designers who have not made type<br>
    themselves but have exhibited a strong appreciation for this "genre".</p>
    <p>I'll start off with the obvious: Neville Brody (Fuse).</p>
    <p>hhp</p>
