    date: 2009-12-09T08:32:00
    date_raw: 9.Dec.2009 8.32am
    votes: null
    html: "<p>Thanks, Michael. You're right, of course: to suggest that it was similar to Aldus was indeed a type error. However, Belwe isn't it either. Its T serifs angle inward and the upturn on the r is sharp, not curved (see the following image for comparison). Identifont's \"by similarity\" engine didn't suggest any good solutions, by the way. </p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/Belwe_Tr_5649.jpg\"></div><p></p>"
