  html: |-
    <p>Hi, I am working on a FMCG product range for a dairy company, and had initially chosen Museo Slab (500) as my supporting font family... Unfortunately I have to find another font, so after numerous hours of searching I have yet to fint one that suits the purpose. The product range is for a cream cheese product and so I initially wanted the serifs to be 'cream-like'. I currently have Vista Slab as a good nr.2 option, but I am not convinced.. Any help would be much appreciated! (attached sample of Vista Slab and Museo Slab)<br>
    Thanks heaps! ®</p>
