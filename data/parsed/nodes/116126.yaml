    date: 2014-04-28T12:27:00
    date_raw: 28 Apr 2014 — 12:27pm
    votes: null
    html: <p>That’s <a href="https://www.microsoft.com/typography/fonts/family.aspx?FID=372" rel="nofollow">Gabriola</a> by John Hudson (included in Microsoft Windows 7/8 and Office 2010). The typeface does not have an italic cut, so they apparently slanted the upright letters. I would strongly advise against that.</p>
    html_clean: <p>That’s <a href="https://www.microsoft.com/typography/fonts/family.aspx?FID=372" rel="nofollow" class="link-external">Gabriola</a> by John Hudson (included in Microsoft Windows 7/8 and Office 2010). The typeface does not have an italic cut, so they apparently slanted the upright letters. I would strongly advise against that.</p>
