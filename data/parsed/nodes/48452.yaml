      <p>I like the idea behind the company name and logo, but I have to say, its not something a regular joe would know.  To me, the name says either abacus or attica, neither of which has the connotation you desire.  But thats just my .02</p>
      <p>As for the logo, I dont mind the wordmark, but I am not understanding the reason for the swash.  SO many logos have the swash, that it isnt really adding anything to your concept,  and the gradient isnt helping.  I think losing the swash and focusing on your font is a better use of your energies.</p>
      <p>Perhaps lose the wedge between the “t”s and make it a ligature?  My eye goes straight to that.</p>
