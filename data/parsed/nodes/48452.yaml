    votes: null
    html: |-
      <p>Hey guys, thanks for the comments!</p>
      <p>As for the colour choice: I wanted something that was solid, looks good on both dark and light backgrounds and I wanted the C to stand out in a signaling colour. The choice of red is completely arbitrary, I have to admit :). It just didn’t *work* for me with green, yellow/orange or blue/purple. So there really is no motivation behind that choice :).</p>
      <p>The swash on the other hand actualy <em>is</em> motivated. Maybe it looks too much like a swash, but it is actually supposed to represent a tube -&gt; hearing canal. The spacing between the tube and the logo represents the atticus (it’s actually an empty space, an atticus—not so easy to represent ;-)).</p>
      <p>@tearsforsappho: I don’t think it is <em>that</em> important that a regular Joe knows what the name stands for. To us and to some other people it means something and to various others it just sounds great. We’re quite okay with that :).</p>
      <p>I adjusted the swash a bit so that it looks more like a tube now. Also changed the tt.</p>
      <p></p><div class="imageWrap"><img src="/files/atticus_logo_5302.png"></div><p></p>
      <p>Thanks for the comments so far!</p>
