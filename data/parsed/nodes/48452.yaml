      <p>I like the name quite a bit, there are plenty of companies whose name may not be understood by the average joe. </p>
      <p>And I like your new direction. The swash did not bother me as much as it did others, it made me think of the gentle curves of an ear (but I did only think of that after I knew what Atticus meant). </p>
      <p>Tintin81 is correct, there is too much going on. I prefer the simple circle without the outline. And in these latest designs I find the ovelapping “c” distracting, it’s sending the “tti” to the background. And like a puzzle I keep trying to figure out why. Also why the period at the end? Is it big circle = vinyl, little circle = CD? Is your name actually “Atticus.”?</p>
      <p>finally the purple just isn’t doing anything for me. Look at other logos either in your field or jus</p>
