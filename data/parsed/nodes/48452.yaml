      <p>So I started thinking again... Basically, an atticus is an empty space, so I wanted to create an empty space with the letter A. Since we are a media company that will be largely focusing on music media, I simply took the most common media forms we will be producing: cd’s and vinyl. And they are round discs. So I simply took a disc :). The extra border represents a vinyl groove, but I’m not too sure whether that works when I shrink it to a smaller size...</p>
