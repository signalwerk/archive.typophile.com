      <p>Hi Xavez,</p>
      <p>I would lose the gradient on the swash all together. It simply doesn’t look professional. It will also cause you trouble in the long-run since it’s very difficult to scale down gradients, especially at smaller sizes, e.g. on business cards.</p>
      <p>The color scheme you chose doesn’t look very appealing to me either. The brown is not a proper one. It looks kind of dirty to me. But don’t worry, changing the colors is very easy. You should always develop your logos in black and white and shades of grey, and then add color later!</p>
      <p>Hope this helps. Good luck with it...</p>
      <p><a class="freelinking-external" href="http://www.designbits.de">Webdesign Hamburg</a></p>
