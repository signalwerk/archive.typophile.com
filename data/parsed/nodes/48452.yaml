      <p>Much better already!</p>
      <p>In this version it kind of hurts my eyes that the foot of the “A” is not in line with the other letters. It looks like it’s going to jump up any moment, which I find quite disturbing. </p>
      <p>I really like the fonts you chose, however there’s quite a bit (maybe too much) going on in this picture. There’s the “A”, the “tt” ligature, and then the carved out “i”. If you pick one of those details and develop it further, rather than all 3 of them, the chances to end up with an outstanding logo are much higher in my opinion.</p>
      <p>Prove me wrong, if you like though! I’m really curious. </p>
      <p><a class="freelinking-external" href="http://www.designbits.de">Webdesign Hamburg</a></p>
