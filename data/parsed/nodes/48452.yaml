    <p>Hey guys. First of all: I’m new here, so please forgive me if I’m doing something horribly wrong somehow :).</p>
    <p>I made the following logo for a new company I’m founding with two friends of mine. We’ll be focusing on music and music marketing in specific, but expanding our activities to other domains is still possible...</p>
    <p></p><div class="imageWrap"><img src="/files/atticus_logo_3831.png"></div><p></p>
    <p>I didn’t want the link between the logo and what we represent to be too explicit. Maybe I should also mention that the “atticus” is a part of the inner-ear (also known as Epitympanum or Attic). The logo is composed out of 2 Pantone colours. I also have a draft of a monocolour version and a black background version, but I wanted to hear what you guys think first :). Thanks!</p>
