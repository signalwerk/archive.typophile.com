    html: |-
      <p>Hey</p>
      <p>Thanks for the comment. Apparently nobody seems to like the gradient. But the gradient is what makes the swash different from every other swash. If I make it flat, it degrades to a completely meaningless swash. But maybe that means my original idea was a bad idea to begin with :).</p>
      <p>As for the colours: I did develop the logo in black on white and white on black. I also developed a very bright and colourful google-like colourscheme, but that would simply cost too much to print in spot colours. Maybe I need to head a different direction on the colour scheme though.</p>
      <p>PS: I always look at tiny and very large versions of the logo as well when I’m designing it. There are no technical difficulties concerning the gradient (I printed it). It actually looks quite good on a business-card/back cover of a vinyl/cd when printed :) (15mm of height). You can check that out when you zoom out the page if you’re browsing in Firefox :).</p>
      <p>Maybe I need to go back to the sketchboard with this :p.</p>
