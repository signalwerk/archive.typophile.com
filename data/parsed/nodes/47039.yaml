    <p>The wood type aesthetic has had a big resurgence over the past decade or so, especially with the niche letterpress shops pumping out concert posters for design annuals and rediscovery of our classic shops like Hatch.</p>
    <p>Thinking about that, I realized that most examples of original wood type use that I’ve seen have been predominantly American based. Ryman posters, circus posters, ’wanted’ posters, auction bills, the western migration bills, etc.</p>
    <p>The only thing that comes to mind off hand might be some of the Bauhaus work later on.</p>
