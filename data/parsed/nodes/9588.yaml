    html: <p>Adam, <br> <br>Thanks a lot for an excellent description! <br> <br>Yeah, I was looking for the green "O" icon in Windows XP.  Besides from the "O", when you double-click on a font in Windows XP you get the built in font-viewer and on a test font I generated in TypeTool it says (TrueType) after the name of the font whether the extension is *.ttf or *.otf.  But when I do the same thing with a TrueType-based OpenType fonts, standard Windows XP fonts for example, it says (Opentype) and on the next line "OpenType Font, Digitally Signed, TryeType Outlines".  So these fonts have obviously been digitally signed, but does the designation TrueType get changed to OpenType in the process of signing a font? <br> <br>I would assume that signing a font won't affect compability?  So all the programs that support OpenType fonts on both Mac and PC will support and unsigned (OpenType) TTF font? <br> <br>I will keep Thawte in mind when I've created my masterpieces and are ready to sell them. <br> <br>Thanks again!</p>
    html_clean: <p>Adam, <br> <br>Thanks a lot for an excellent description! <br> <br>Yeah, I was looking for the green "O" icon in Windows XP.  Besides from the "O", when you double-click on a font in Windows XP you get the built in font-viewer and on a test font I generated in TypeTool it says (TrueType) after the name of the font whether the extension is *.ttf or *.otf.  But when I do the same thing with a TrueType-based OpenType fonts, standard Windows XP fonts for example, it says (Opentype) and on the next line "OpenType Font, Digitally Signed, TryeType Outlines".  So these fonts have obviously been digitally signed, but does the designation TrueType get changed to OpenType in the process of signing a font? <br> <br>I would assume that signing a font won't affect compability?  So all the programs that support OpenType fonts on both Mac and PC will support and unsigned (OpenType) TTF font? <br> <br>I will keep Thawte in mind when I've created my masterpieces and are ready to sell them. <br> <br>Thanks again!</p>
  - id: 61335
