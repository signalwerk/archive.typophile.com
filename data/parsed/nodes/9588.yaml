    html: <p>Lauri,  <br> <br>"I just realized I called Purys Papyrus. Sorry about that. " <br> <br>You probably mean neither Purys nor Papyrus but Pyrus. No need to be sorry. Pyrus ceased to exist five years ago. It has been inherited by the new company Fontlab Ltd.  <br> <br>If you're interested, the company history is <br><a href="http://www.fontlab.com/About-FontLab/About-FontLab/Company-Profile/" target="_blank">http://www.fontlab.com/About-FontLab/About-FontLab/Company-Profile/</a> <br> <br>The websites <a href="http://www.fontlab.com/" target="_blank">http://www.fontlab.com/</a> and <a href="http://www.pyrus.com/" target="_blank">http://www.pyrus.com/</a> point to the same content. The reason the domain pyrus.com still exists is because some people still associate Fontlab Ltd. products with this name.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
