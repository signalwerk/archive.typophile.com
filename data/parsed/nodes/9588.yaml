  html: <p>I've been drawing letters in Illustrator for a while and I'm ready to take the plunge and buy TypeTool 2 (I'd get Fontlab if I could afford it).  Anybody know where the cheapest place to get it?  Go straight to the source and buy it from Papurys?  I was also considering getting an old issue of Computer Arts that comes with the full version 1.3 and then update this for $39.95 instead of paying $99.  But it seems to be hassle, and maybe not worth it.  Any suggestions? <br> <br>Thanks! <br> <br>P.S. I'm out of school, but I'm not working yet.  So I don't qualify for a academic price either.</p>
