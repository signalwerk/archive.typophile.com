  - id: 61333
    user: 1133
    date: 2005-03-06T15:20:00
    date_raw: 6 Mar 2005 — 3:20pm
    votes: null
    html: "<p>Lauri,  <br> <br>The terms \"TrueType fonts\" and \"TrueType-based OpenType fonts\" can be used interchangably.  <br> <br>Each \"TrueType\" font generated by FontLab 4.6 or TypeTool 2 is automatically an OpenType TT fonts. This is why in our new series of applications, starting with TransType Pro, we'll be consistently using the terms:  <br>* \"OpenType PS\" for PostScript-based OT fonts (.otf) <br>* \"TrueType / OpenType TT\" for TrueType-based OT fonts (.ttf) <br> <br>In our existing applications, we're using the terms \"TrueType\" for \"TrueType / OpenType TT\" and \"OpenType\" or \"OpenType-CFF\" for \"OpenType PS\". Sorry for the confusion.  <br> <br>Microsoft Windows displays the green \"O\" icon for all fonts with the .otf extension and for those fonts with the .ttf extension that have a digital signature. So to have a green \"O\" icon in .ttf fonts generated by TypeTool 2 or FontLab 4.6, you need to digitally sign your font:  <br><a href=\"http://partners.adobe.com/public/developer/opentype/afdko/topic_digital_sig_guide.html\" target=\"_blank\">http://partners.adobe.com/public/developer/opentype/afdko/topic_digital_sig_guide.html</a> <br> <br>You can get a \"code signing\" / \"Authenticode\" digital signature from Verisign or Thawte (the latter is cheaper), but unfortunately, none of them is free.  <br> <br>Regards,  <br>Adam</p>"
    html_clean: "<p>Lauri,  <br> <br>The terms \"TrueType fonts\" and \"TrueType-based OpenType fonts\" can be used interchangably.  <br> <br>Each \"TrueType\" font generated by FontLab 4.6 or TypeTool 2 is automatically an OpenType TT fonts. This is why in our new series of applications, starting with TransType Pro, we'll be consistently using the terms:  <br>* \"OpenType PS\" for PostScript-based OT fonts (.otf) <br>* \"TrueType / OpenType TT\" for TrueType-based OT fonts (.ttf) <br> <br>In our existing applications, we're using the terms \"TrueType\" for \"TrueType / OpenType TT\" and \"OpenType\" or \"OpenType-CFF\" for \"OpenType PS\". Sorry for the confusion.  <br> <br>Microsoft Windows displays the green \"O\" icon for all fonts with the .otf extension and for those fonts with the .ttf extension that have a digital signature. So to have a green \"O\" icon in .ttf fonts generated by TypeTool 2 or FontLab 4.6, you need to digitally sign your font:  <br><a href=\"http://partners.adobe.com/public/developer/opentype/afdko/topic_digital_sig_guide.html\" target=\"_blank\" class=\"link-external\">http://partners.adobe.com/public/developer/opentype/afdko/topic_digital_sig_guide.html</a> <br> <br>You can get a \"code signing\" / \"Authenticode\" digital signature from Verisign or Thawte (the latter is cheaper), but unfortunately, none of them is free.  <br> <br>Regards,  <br>Adam</p>"
