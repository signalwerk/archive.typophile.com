    date: 2005-03-06T16:32:00
    date_raw: 6 Mar 2005 — 4:32pm
    votes: null
    html: <p>Yes, to all of the above. <br> <br>Specifically, I know of no applications (certainly none of ours) that use the presence or absence of a digital signature to determine whether to look for or use OpenType layout tables. They all just look for the tables themselves. <br> <br>I'll second Adam's comments that the dividing line between (Windows) TrueType and OpenType is exceedingly thin. If one wants to make the distinction, it's basically a question of whether it has advanced layout tables such as GSUB and/or GPOS. <br> <br>Regards, <br> <br>T</p>
