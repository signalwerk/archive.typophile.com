    <p>What are some of your favorite extended typefaces?</p>
    <p>I prefer Reservation Wide, by Silas Dilworth. Right now, it seems to be my go-to typeface for extended type. Idlewild by HFJ is another favorite. </p>
    <p>Obvious ones like Helvetica and Univers will probably dominate this list, but what are some of your favorite extended typefaces?</p>
