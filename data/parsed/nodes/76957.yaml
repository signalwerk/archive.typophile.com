    votes: null
    html: |-
      <p>1. Edit your old.fea file (leave only new kern feature):</p>
      <p># deleted<br>
      lookup kernHorizontalKerninglookup1 {<br>
        subtable;<br>
          @kc36_first_0 = [\a \uni1EB7 ];<br>
      # etc<br>
          @kc36_second_1 = [\b ];<br>
      # etc</p>
      <p>    pos @kc36_first_0 @kc36_second_1 -8; # -8 is new kern value<br>
      # etc, the rest of kern values</p>
      <p>  subtable;</p>
      <p>} kernHorizontalKerninglookup1;</p>
      <p>feature kern {</p>
      <p>  script DFLT;<br>
           language dflt ;<br>
            lookup kernHorizontalKerninglookup1;</p>
      <p>  # etc, the rest script/language registrations<br>
      } kern;</p>
      <p>2. Save edited file: new.fea<br>
      3. Delete kerning in FontInfo<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/12_5931.png"></div><br>
      4. File -&gt; Merge Feature Info -&gt; new.fea file<br>
      <div class="imageWrap"><img src="http://typophile.com/files/22_3419.png"></div><br>
         best<br>
         J<p></p>
