    html: <p>Export your kerning to an OpenType feature file. Load the font into Metrics Machine and then import the kerning from the feature file. Scale all of your kerning values to match the letter scaling, export that as a feature file, and then copy/paste it into an OpenType feature in Fontlab.</p>
