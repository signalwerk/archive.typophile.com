    <p>Dear all,</p>
    <p>I need your help. I have created a font, then later changed the Em (from 2500 to 1000). Changing the size of the glyphs was not a problem. I now need to update the kerning table (by classes) because the kerns are too big (of course). I have tried with fontforge but I cannot seem to be able to upload the kerning table (I have saved an FEA file from the GPOS menu in Fontinfo).</p>
    <p>I am not sure I am being very clear, so please feel free to ask any question!<br>
    Thanks in advance.</p>
