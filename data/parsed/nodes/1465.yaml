  html: <p>What do you consider to be the sexiest letter form or character? Next, what do you consider to be the sexiest part of the letter (for one form or characters in general)? Finally, what do you consider to be the sexiest type face? <br> <br> I'm a communication design student at Emily Carr in Vancouver and I'm polling this informartion for a project I'm doing on the sensuality and potential sexual connontations of type. Any replies will be greatly appreciated.  <br> <br>Thank you. <br> <br>` ) <br>( <br>` -=====-</p>
