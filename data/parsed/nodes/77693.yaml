      <p>Chris is right: it’s Gotham Light.</p>
      <p>Go <a class="freelinking external" href="http://www.typography.com/testDriver/index.php?productLineID=100008" rel="nofollow">here</a>, select Gotham Light and past this text “It’s not your dream phone” in the field. In brief, you have to use the correct apostrophe mark ’.</p>
      <p>What you see as a “serif of the Y” is actually a kind of an optical illusion caused by the A/C vents (?) of the building.</p>
