      <p>This has been discussed before in several threads. It's custom lettering by the artist, Michael Schwab. He's also designed a proprietary font based on the letters.</p>
      <p>As alternatives, you might like <a href="http://www.fontshop.com/search/?q=Eagle&amp;affid=99346" rel="nofollow">Eagle</a>, <a href="http://www.fontshop.com/fonts/downloads/fountain/mayo_pro/?affid=99346" rel="nofollow">Mayo</a>, and <a href="http://www.fontshop.com/fonts/downloads/mark_simonson_studio/mostra_nuova_family_ot/?affid=99346" rel="nofollow">Mostra</a>.</p>
