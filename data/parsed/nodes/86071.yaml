    html: |-
      <p>In what's visible of your code, you have</p>
      <p>sub @punct r.ss02 e' by r_e.begin;</p>
      <p>You need an additional apostrophe in the above if you want this to be a ligature replacement rule, i.e.</p>
      <p>sub @punct r.ss02' e' by r_e.begin;</p>
      <p>However, if you want this to occur at the beginning of all words, including those at the beginning of a line, you'll need something like the following:</p>
      <p>ignore sub @Letters r.ss01' e';<br>
      sub r.ss01' e' by r_e.begin;</p>
      <p>André</p>
