  html: |-
    <p>Is it possible to have a ligature as a 'begin' replacement in a stylistic set?</p>
    <p>The stylistic set replaces a standard 'r' with a cursive style. Most 'r's don't have a lead-in stroke, (see r_e lig in the middle) but I need a lead-in at the beginning of a word.</p>
    <p>The 'r' at the beginning in the example uses the code     sub @punct r.ss01' by r.begin;   but the r_e ligature on the right is the one I want to use. I thought the code     sub @punct r.ss01 e' by r_e.begin; would work , but it doesn't.</p>
    <p>I hope this is clear. Any ideas? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Rollergrab_4358.gif"></div><p></p>
