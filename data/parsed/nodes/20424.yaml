    <p>Does anyone know what font is used for the main title on the art of the Broadway musical Wicked? It was the same font that was used on the cover of the novel. I can't seem to find anything that's very close.</p>
    <p>Here's the musical poster:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wicked3_4575.jpg"></div><p></p>
    <p>Thanks for any help!</p>
    <p>Devin</p>
