    html: |-
      <p>"WICKED" looks custom, probably modified from a pre-existing font. It's just too messy; the serifs aren't consistent, odd widths, the letters don't lie straight on the baseline, and the C looks like a modified O.</p>
      <p>"A New Musical" and "The Untold Story of the Witches of Oz" is set in <a href="/wiki/squooshed" class="freelinking" rel="nofollow">squooshed</a> <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.106993.0.0&amp;attributes.sampleSize=74&amp;sampleText=A+NEW+MUSICAL&amp;sampleSize=32" rel="nofollow">Amigo</a> along with faux small caps.</p>
