  - id: 20327
    user: 2854
    date: 2004-01-08T19:08:00
    date_raw: 8 Jan 2004 — 7:08pm
    votes: null
    html: "<p>This was indeed mostly intended as an exercise: the only way to learn is to start doing. In fact I still have no idea if type design is my cup of tea, but so far I've had lots of fun working on Dacoden. Type is strangely addictive ;). <br> <br>Anyway, to make the glyphs fit together, I don't think in fact that many alternates would be required. I don't have any idea how to do OpenType glyph substitution yet though, but it would be interesting if I could make it all work without looking awkward. <br> <br>The Peace font is indeed very nice. However unlike in Peace, I wanted to stick to simple glyphs, so fitting every letter in the same enclosure like Wes Wilson has managed would be difficult (and I don't think I'm up to that sort of challenging design yet anyway).</p>"
