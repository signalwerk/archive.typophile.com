    html: <p>Frankly, this isn't my cup of tea. But I'm not here to gripe - I actually see promise in the fact that some glyph combinations are wonderful, the way they fit together. So I'd propose that you take this up a notch and create an OpenType font where alternative glyph shapes are selected depending on what they're next to - to me that's the only way to make such a design worthwhile (except as a learning exercise, perhaps). BTW, with the new FontLab adding OT wizardry isn't nearly as daunting as it sounds. <br> <br>hhp <br></p>
