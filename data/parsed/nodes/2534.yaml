  - id: 20324
    user: 2854
    date: 2004-01-08T18:03:00
    date_raw: 8 Jan 2004 — 6:03pm
    votes: null
    html: "<p>It's been a while, but I've worked on it some more (stupid exams taking up all my time :P): <br> <br><a href=\"http://acko.net/dump/dacoden.png\" target=\"_blank\">http://acko.net/dump/dacoden.png</a> <br> <br>As suggested, I opened up the counters. The font is still quite fat, but now it's much more readable. <br> <br>I originally started out with simple geometric shapes and fixed proportions for the letter designs, but after putting it together I started changing the shapes here and there. I've got a couple of nice lowercase letters sketched, but I don't think I could do a good full lowercase set to match this, so I'm going to keep it uppercase only (I set up proper multiple mappings so that you can type lowercase, even for accented letters). <br> <br>I added the thorn and eth and various simple symbols and replaced that crappy g by a better one. It doesn't fit the rest of the letters strictly, but I think it adds some flavor, like the lowercase 'g' often does in Latin typefaces. <br> <br>I decided to include the thorny sort-of-serifs on more letters to make it more consistent at the top. I got rid of the lowercase-ish 'i' because it looked really weird for accented i's. <br> <br>And finally, I came up with a proper name for this font: Dacoden. <br> <br>Again, any comments are much appreciated!</p>"
    html_clean: "<p>It's been a while, but I've worked on it some more (stupid exams taking up all my time :P): <br> <br><a href=\"http://acko.net/dump/dacoden.png\" target=\"_blank\">http://acko.net/dump/dacoden.png</a> <br> <br>As suggested, I opened up the counters. The font is still quite fat, but now it's much more readable. <br> <br>I originally started out with simple geometric shapes and fixed proportions for the letter designs, but after putting it together I started changing the shapes here and there. I've got a couple of nice lowercase letters sketched, but I don't think I could do a good full lowercase set to match this, so I'm going to keep it uppercase only (I set up proper multiple mappings so that you can type lowercase, even for accented letters). <br> <br>I added the thorn and eth and various simple symbols and replaced that crappy g by a better one. It doesn't fit the rest of the letters strictly, but I think it adds some flavor, like the lowercase 'g' often does in Latin typefaces. <br> <br>I decided to include the thorny sort-of-serifs on more letters to make it more consistent at the top. I got rid of the lowercase-ish 'i' because it looked really weird for accented i's. <br> <br>And finally, I came up with a proper name for this font: Dacoden. <br> <br>Again, any comments are much appreciated!</p>"
