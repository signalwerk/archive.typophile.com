  html: "<p>Yet another 'my first face' thread... I've been reading about type design here for a while now and wanted to try making my own simple face. <br> <br>I started out with a doodle of the A and really liked that shape, so I started making other letters based on that. <br> <br>I've only got uppercase done right now, but I wanted to get some feedback before I spend more time on this. <br> <br>The result is pretty okay in my own humble opinion, but of course it's no quality face. I haven't done any kerning pairs so the spacing is a bit off, and it still suffers from the 'circles appear smaller than rectangles' illusion. The letter I'm the least happy with is the 'G', which is just a mirrored 'E': I haven't found a good substitute though. <br> <br>All comments welcome... <br> <br><a href=\"http://www.acko.net/dump/extralard.png\" target=\"_blank\">http://www.acko.net/dump/extralard.png</a></p>"
