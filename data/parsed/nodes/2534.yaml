    date_raw: 8 Jan 2004 — 6:36pm
    votes: null
    html: <p>The way the glyphs fit together reminds me a bit of Wes Wilson's groovy <a href="http://www.veer.com/results.asp?Image=FBT0300041">Peace</a> family from Font Bureau. Although your characters are much less uniform in shape. And I agree with Hrant's suggestion regarding harnessing the power of OpenType's contextual glyph substitution to make the face intelligently flexible. This type of face could really take advantage of that technology.</p>
