      <p>James Crippen writes:</p>
      <p><cite> I’ve seen some fonts where only parts of Latin Extended A are supported, because the designer only cares about Czech and Polish but not Maltese or Romanian, for example. That’s kind of annoying, but it’s the designer’s decision in the end, I suppose. </cite></p>
      <p>I find this comment to be a bit peculiar. No font can realistically be expected to support <em> all </em> latin-based languages; each designer must therefore make decisions regarding which languages they will choose to support. What's odd about the above is that it suggests that those decisions should somehow revolve around the rather arbitrary grouping of languages into unicode blocks. Why is this more sensible than using geographical (e.g. Central European vs. Balkan/Mediterranean) or phylogenetic (e.g. Slavic vs. Romance/Semitic) criteria?</p>
      <p>I admit to being guilty of this view myself, insofar as I tend to add support for Esperanto just to fill out the Latin Extended A block despite the fact that this language ranks <em> very </em> low on my list of languages I'd want to support. On reflection, though, this really doesn't make much sense.</p>
      <p>André</p>
