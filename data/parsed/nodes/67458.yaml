      <p>There is this dance that starts with one partner and eventually everybody is dancing. I find I see a single glyph or two would add another language; having done that, I see just a few more would bring in yet another,... and so it goes--until it is time to do the caps, smallcaps, kerning exceptions.  I have several fonts with over 2000 glyphs.  Who was it that said something about "just 26 letters""?<br>
      At first, it is intriguing and you feel compelled to be fair to everybody in the World and get a good sense of fair play erasing the boundaries of nationalism. Then you get interupted by the sound of your head hitting the keyboard as you drift off to sleep in the midst of your Ajurbajany.</p>
