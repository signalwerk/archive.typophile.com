  html: <p>Is there an existing list of glyphs available somewhere, to see what glyphs are used in what languages? I would imagine it to be very helpful in designing fonts. I've found some advice in the web, but the information seems to be somewhat scattered to concerning only diacritics for example. If I'm creating a language support into a font, I'd like to know exactly what glyphs I need to design for that language. Some key issues to the design of the foreign characters would be a plus of course.</p>
