      <p>There is no such list. The people involved in the Unicode standards process do not even have such a list, because it’s not something that everyone knows. In fact, there’s not even an organized list of all the writing systems known, either.</p>
      <p>You can try <a href="http://www.decodeunicode.org/" rel="nofollow">Decode Unicode</a> as a place to start, and check the <a href="http://unicode.org/charts/" rel="nofollow">Unicode code charts</a> for additional information. Also see <a href="http://www.omniglot.com" rel="nofollow">Omniglot</a> for a guide to many – but by no means all&nbsp;–&nbsp;of the world’s known writing systems.</p>
