      <p>Since there are fonts which support Chinese, and fonts which support the entire Basic Multilingual Page of Unicode, the idea that a font - not every font, but a font specifically designed to have a broad range of support - might support "all" latin-based scripts does not, at first glance, seem impossible.</p>
      <p>But as we see in this thread, even that humble "all" requires research and is fuzzy around the edges. The African and Native American languages with such scripts are often quite obscure. And it's not impossible that new scripts of this type are still being developed.</p>
      <p>Latin-based transliteration schemes for Arabic and ancient Egyptian, for example, I suppose might also be noted. The American Library Association had a modified version of ASCII which included the combining diacritics required for printing library cards for books from just about anywhere - but that would be just a start compared to the goal here.</p>
