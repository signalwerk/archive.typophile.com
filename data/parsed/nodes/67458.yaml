    html: |-
      <p><cite>No font can realistically be expected to support all latin-based languages</cite></p>
      <p>Why not –?</p>
      <p>Of course, not every font can be expected to cover everything. So, the choice to make is really a severe issue. However, as Nick Shinn puts it, it is a matter of “sense of professional duty” to provide at least a set of *some* decent comprehensiveness. A set on which to decide is still left to every font provider, to be based on his own considerations.<br>
      Unfortunately neither UC ranges nor the so-called codepages give reliable reference to that decision, so it remains – up to you.</p>
