      <p><cite>Jongseong: This is very interesting. I guess this project is not online to visit?</cite></p>
      <p>I don't think anything available to the public came out of the project. Shame, really, because it would have been a nice resource had the project been continued.</p>
      <p><em>For example, you would find à and é in German but I tried to include only those characters that are "native" to that language.</em></p>
      <p>To be thorough, it would be useful to indicate which characters are marginal to a language. You would also find à and é in English, although they are not considered native letters. The same for å, š, and ž in Finnish, except that å does appear in the Finnish alphabet (which also includes a number of other letters not used for native Finnish words).</p>
      <p>It's really complicated when you go through all these details. This is why it is useful to group several languages together and define the character set that will be sufficient for each of those languages. Hence the Western European, Central European and Baltic, etc. With something like African languages which are numerous and poorly documented, this is really the only possible approach; rather than trying to find out which characters are needed for each of hundreds of languages used in West Africa, it is more efficient to draw up a list of characters needed for several major West African languages. This is because regional and cultural groupings of languages tend to share characteristic letters.</p>
      <p>The original poster talked about glyphs. Technically there is a difference between a glyph and a character, in that glyph refers to a particular shape of a character. The distinction is rather important because Unicode considers some similar characters used in different languages but with slightly different forms in each to be the same character. Depending on the language, uppercase Eng (Ŋ) will either resemble "N" with a hook or an enlarged "n" with a hook that may or may not descend, but in Unicode all these glyphs are variants of the same character. So really, you do need to know which languages you intend to support, because that may determine how you draw the glyphs.</p>
