      <p>There is a small inconsistency in Letter DB, FontConfig and Cheap Pro Fonts: Guarani uses both G and g with tilde, but in these sites just g with tilde is included. BTW, these two characters are unencoded.</p>
      <p>I plan to make public a large chart showing almost all Latin-based alphabets with the release of my <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">font</a>. By now, I have 300+ languages and transliteration schemas mapped. Unhappily, there are very few information about some native languages from South America and Central Africa.</p>
