      <p>I said that å occurs in the Finnish alphabet even though it isn't a native letter, specifically referring to the Finnish alphabet and not the Finnish language in general. Do you disagree with this? When you recite the alphabet in Finnish, don't you include the "ruotsalainen oo (Swedish o)" as a letter?</p>
      <p>The å is part of the Finnish alphabet, regardless of the fact that it is not used for any native Finnish words. So are letters like c, q, w, x, and z, which don't occur in native Finnish words either. Yes, the fact that Finland is a bilingual country probably has a lot to do with why the Finnish alphabet includes letters not really used in the language. But I stated nothing controversial.</p>
