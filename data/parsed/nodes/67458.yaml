    html: |-
      <p>Yes, that’s about it. Actually, most fonts out there only manage Basic Latin and Latin-1. It seems that people get bored after designing just about that many glyphs, and then they move on to some other font.</p>
      <p>Latin Extended A gets supported for fonts that say they can handle “Central European”, i.e. Polish, Czech, Hungarian, and a bunch of other European national languages. Anything beyond that is quite rare. I’ve seen some fonts where only <em>parts</em> of Latin Extended A are supported, because the designer only cares about Czech and Polish but not Maltese or Romanian, for example. That’s kind of annoying, but it’s the designer’s decision in the end, I suppose.</p>
      <p>The worst offenders are fonts where the designer has made a token attempt at adding things but doesn’t actually test them. An example is the Combining Diacritical Marks block, where sometimes a font includes most or all of the diacritics but the designer doesn’t bother to add composed glyphs or instead properly use the mark feature. Then it looks at first glance like the font could support many more characters in composition, but it actually doesn’t because the diacritics don’t work as God and the Unicode committee intended.</p>
      <p>Some fonts have a small subset of the Combining Diacritical Marks, only the ones used in Western European languages, and then they don’t work except for the precomposed characters in Latin-1 and Latin Extended A. This is generally because designers will use the CDM block as a sort of scrap space, storing the diacritics for use in designing the Latin-1 &amp; LEA characters, and never considering that the presence of things in the CDM block implies functionality beyond those two ranges of precomposed glyphs. This behaviour is extremely common: try adding an acute accent to a lowercase n in your favorite fonts some day.</p>
      <p>Anyway, I’m off on an irrelevant rant. But I do have an important point to make. IMNSHO if you’re going to add a character you should endeavour to support it fully, and not just have it in there as a useless stub. In the case of fonts, nothing is better than broken and misleading.</p>
