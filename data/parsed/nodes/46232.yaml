    <div class="info">Submitted by <a href="/web/20081015205839/http://www.typophile.com/user/827" title="View user profile.">Ale Paul</a> : 9.Jun.2008 7.23am </div>
      <p>Sudtipos is proud to announce the release of two new fonts</p>
    <p></p><div class="imageWrap"><img src="/web/20081015205839im_/http://www.typophile.com/files/primoxida_5795.jpg"></div><p></p>
    <p>////////////////////////////////////////////////////////////////</p>
    <p><strong><a href="https://web.archive.org/web/20081015205839/http://sudtipos.com/fonts/105">Primavera</a></strong> is a fresh and spirited take on casual handwriting. The usual playfulness and expertise of Angel Koziupa’s forms, along with the smooth, crisp outlines of Alejandro Paul, provide a humorous and lively typeface in two styles that fit perfectly on food packaging labels, greeting cards, journals or wherever a design needs to convey freshness, young spirit, and a cool spring breeze.</p>
    <p>////////////////////////////////////////////////////////////////</p>
