      <p>I like #2 the best. I like how the word bubble sits comfortably on the type more than the rounded #7.</p>
      <p>Although #8 solves the legibility issue of "we are" (although not that critical is it?), there's some things that bother me about it. For one, there's a weird tangent where the words "we are" is uncomfortably close the edge. Either have them aligned and more intentionally "in" the bubble or intentionally cropped. The tail of the "a" in "cfa" trailing off to the right on the outside of the bubble looks like a mistake to me. Should it have been cropped inside? I know this is still a work in progress, so sorry if it's nitpicky</p>
      <p>I know you're getting a lot of feedback. Just my 2 cents.</p>
      <p>Good luck! I know you'll be happy with whatever you end up with. Plenty of viable options there.</p>
