    html: |-
      <p>I'd say something like number one or number twelve, but I'm afraid I'd add to that that I think these are all a bit “weak”… even after some kind of development. It's just a few letters, I think I'd go for something more unique (that is, not using a typeface but creating the characters or some kind of lettering from scratch).</p>
      <p>However, I do see these options as “correct”, if I make myself clear. I mean, they do seem to match the description you made of what the company does, in some way. Marketing, copywriting, these are things that, to me, somehow call for something “texty” as a logo, as in just a plain typeface telling it as it is, so those two options I mentioned seem to work nicely (no letters touching, no symbols, just plain text, conservatively set as if typed). The name also helps. So if the company isn't heavily design-oriented but instead more about marketing, I could see why and how these kinds of options would be used.</p>
      <p>In number twelve you might consider tweaking “cfa”'s size, because since it's bolder it looks a tiny bit smaller, as it stands right now.</p>
