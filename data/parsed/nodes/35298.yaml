    votes: null
    html: |-
      <p>Those old small office copieers with the sliding top are fun. hang a bit of your original out the edge of the imaging bed and stop it at points as the top tracks across. You'll get fun stretchy copies that way</p>
      <p>You might even manage to get that stretchy effect on modern desktop scanners (though you'd have to supply motion in the original yourself), but you won't get the grittyness of a copier that way.</p>
    html_clean: |-
