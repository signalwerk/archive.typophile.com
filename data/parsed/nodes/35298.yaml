      <p>I hate to state the obvious: hand-letter it? Is that crazy?   ;)   Everything suggested so far is a mechanical technique to artificially "antique" some type. </p>
      <p>We're giving the hand-lettering workshop again this year at TypeCon and it looks to be very fun. Cut paper, ink, drawn, pen-written, calligraphic, brush-lettered and any other kind of handmade lettering. Experimental and low-tech. If you're coming to TypeCon, join us. Useful skills if the power goes out.  ;)</p>
