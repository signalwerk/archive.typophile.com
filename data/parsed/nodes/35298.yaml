    html: <p>Those <a href="http://www.mrretro.com/" rel="nofollow">Mister Retro</a> filters are pretty slick. I have the original 1st set and have used it a few times to customise t-shirts. The new pimped version of the software is even more slick. Seriously customizable and you really can tweak the living daylights out of it. Yes, I do think photocopies and steel wool are totally valid, but I also think these filters are just as valid.</p>
