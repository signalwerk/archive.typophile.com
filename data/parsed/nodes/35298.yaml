    <p>I always designed squeaky clean layouts, i want to try something different<br>
    something less digital, by using maybe traditional stuff. I tried markers and now playing with paint buckets.<br>
    Any of you know how to do some neat but dirty stuff to make a design look either washed out/streets hip and 'hand made'? Please share. Thank you!</p>
