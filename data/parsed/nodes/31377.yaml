    <p>Hi,</p>
    <p>I’ve been tasked with creating an identity for an IT company called Air Fire Telephone and Data. The provide various products such as Digital Telephone, Internet Access, Server Co-Location, Web Hosting, Data Backup, E-mail/Spam Control, Domains, and Network Consulting. Their clientele are business's who rely on the internet. They are not after the low end customers. They are after people who loss money when the internet is not working for them. The client wants to reinforce that they are the most relieable IT company. Any thoughts would be very helpful.</p>
    <p>Thanks</p><div class="imageWrap"><img src="http://typophile.com/files/air-fire-logos_5000.gif"></div><p></p>
