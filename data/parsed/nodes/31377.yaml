    html: |-
      <p>Maybe I'm wrong, but these seem like your first sketches.  I would expand your range of concepts.  Right now the bottom one says communications to me more than the others, but it's very clichéd.  The flame, while relating to the "fire" part of the name, doesn't really add anything new and memorable to stand as an identity.  The name is interesting and strong. It may not need an additional symbol, just a really strong and well-set logotype.</p>
      <p>Focus on what they want to be known for: the reliability of their technology.</p>
      <p>Finally, remove "INC." from the descriptor.  That's part of their legal business name, but doesn't need to be included in the logo.</p>
