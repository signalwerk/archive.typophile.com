    <p>For example, I put my first custom ligature at U+FB07, because the <a class="freelinking external link-external" href="http://www.unicode.org/charts/PDF/UFB00.pdf" rel="nofollow">unicode code charts</a> says Latin Ligatures start at U+FB00 with only 7 foreseen. Is that the way to do or am I just making to much fuss about this and should I just add some extra places at the end of the font for my own needs ?</p>
