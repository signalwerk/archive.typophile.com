  html: |-
    <p>I'm about to make a new font and I'm not sure which encoding to use.<br>
    I will have Latin characters + some custom ligatures + alternate versions + small capitals.</p>
    <p>Should I use ISO-8859-1 with additional characters or Unicode ?</p>
    <p>If using Unicode, all the codes seem to be dedicated to some usage. And i'm not sure where to place my custom characters. Are there some rules for that ?</p>
    <p>For example, I put my first custom ligature at U+FB07, because the <a class="freelinking external" href="http://www.unicode.org/charts/PDF/UFB00.pdf" rel="nofollow">unicode code charts</a> says Latin Ligatures start at U+FB00 with only 7 foreseen. Is that the way to do or am I just making to much fuss about this and should I just add some extra places at the end of the font for my own needs ?</p>
    <p>PS: I'm using FontForge.</p>
