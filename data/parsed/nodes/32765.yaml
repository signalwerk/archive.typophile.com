      <p>Absolutely, it needs some sort of directional indicator: not necessarily a full rose, but at least a "North" arrow would be useful.</p>
      <p>I'm sure detailing all the maps (assuming they are different) is beyond the time you can/need/want to spend, but some content there would be useful.</p>
      <p>Justifying the sidebars really would be awkward -- they're just too narrow.</p>
      <p>To be honest, unless you're setting guide books like telephone books (with flimsy paper, minimal graphics, and totally jejune text), you really need some warmth in your text face.  It's late (for me), but offhand, both ITC Tiepolo and Poppl-Laudatio spring to mind....</p>
