      <p>I'd lose the hyphenation -- you've got two consecutive ones in the verso main text that really don't make much sense, and things like "re-cent" are just jarring.  I like the marginalia, but the hyphens on the recto aren't very comfortable either.</p>
      <p>Your use of colour is very nice, but it does feel a little sterile -- you might want to think about using a sans with a touch more warmth and contrast to it.</p>
