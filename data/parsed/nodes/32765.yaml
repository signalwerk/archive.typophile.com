      <p>Thanks for the comments,</p>
      <p>Quincunx: Yeah, I remember reading about San Serriffe a few years back, as for the 'seriousness' I think I wanted to stick to that because the rest of the publication really diverges from the serious look. But I agree if this was all there was it could use more flair.</p>
      <p>Linda Cunningham: I think I chose Galaxie Polaris because it has a very 'open' feeling to it, I think it lends the page a nice balance. I did an initial version with an overt friendliness and warmth, but since the content verges from dreary to (perhaps) humourous I thought a touch of sterility would contrast with the content itself. If that makes any sense.</p>
      <p>jslabovitz: Yes, superfluous is a fitting word, I've been on the verge of taking it out for a while though, but you can never really convince yourself of some things till you hear it from someone else.</p>
