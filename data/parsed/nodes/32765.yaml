      <p>Agreement on the hyphenation.  The marginal texts' measures are just too short.</p>
      <p>There are a few too many horizontal rules.  I kind of like them at the foot of the marginalia, but then again I'm not sure they're necessary.  The rule at the end of the body text seems superfluous.</p>
      <p>This is a tiny thing, but I'd equalize the space before &amp; after the subheads' gray square bullet.  Or maybe even drop the bullet entirely and use an em space to separate the subhead from the text.</p>
      <p>--John</p>
