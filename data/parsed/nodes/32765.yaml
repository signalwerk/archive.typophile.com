    <p>I've attached a sample spread from my grad project (one part of it) it's a publication series that is composed of cultural ephemera from various 'island nations'. This particular aspect is a sort of 'hub' for the rest of the publication, it's a travel guide to these island nation / utopias. </p>
    <p>I've gotten it to a stage where I am fairly happy, just wanted to hear from fresh eyes. There are a few things I am unsure about; how do are the page numbers / running heads working? are they not anchored enough? Is the line length for the marginalia too short? General comments about how it feels / navigates would be appreciated as well.</p>
    <p>In case some more context is required; the finished book will be about 100 pages (50 islands for Volume 1) and the size is about half-letter (5.5 x 8.5). The typeface used is Galaxie Polaris by Chester &amp; Tracy Jenkins.</p>
    <p>Thanks.</p>
