  html: <p>Australian Designer Robert Bell and Cape Arcona have joined the rapidly expanding Union Fonts, distributing through their online store.  <br> <br>Robert Bell has previously releases fonts with Bitstream, myfonts.com, t26 and Garagefonts. His space age font ZEON comes in one weight and is the first of several planned releases with Union. <br> <br>Cape Arcona is an island owned by two millionaire type designers, they have released 14 fonts with Union. <br> <br>In addition to these new associates, exisiting Union designers Jorge Alderete and Ramiro Espinoza have added to the fonts they offer through Union with Jorge releasing Platillo Volador, a four weight text face with flying saucer dingbat reminiscent of Rian Hughes work, and Ramiro realeasing two new weights of his popular sans serif Lula. <br> <br>Union now offers over 100 fonts, just two months after launching. <br> <br><a href="http://www.unionfonts.com" target="_blank">http://www.unionfonts.com</a></p>
  html_clean: <p>Australian Designer Robert Bell and Cape Arcona have joined the rapidly expanding Union Fonts, distributing through their online store.  <br> <br>Robert Bell has previously releases fonts with Bitstream, myfonts.com, t26 and Garagefonts. His space age font ZEON comes in one weight and is the first of several planned releases with Union. <br> <br>Cape Arcona is an island owned by two millionaire type designers, they have released 14 fonts with Union. <br> <br>In addition to these new associates, exisiting Union designers Jorge Alderete and Ramiro Espinoza have added to the fonts they offer through Union with Jorge releasing Platillo Volador, a four weight text face with flying saucer dingbat reminiscent of Rian Hughes work, and Ramiro realeasing two new weights of his popular sans serif Lula. <br> <br>Union now offers over 100 fonts, just two months after launching. <br> <br><a href="http://www.unionfonts.com" target="_blank" class="link-external">http://www.unionfonts.com</a></p>
