    html: |-
      <p>Wikipedia notes the origin of the coporation's name as "is the Latin form of the German name Wachau. When Moravian settlers arrived in Bethabara, North Carolina in 1753, they gave this name to the land they acquired, because it resembled a valley along the Danube River called Die Wachau. The area formerly known as Wachovia now makes up most of Forsyth County and the largest city is now Winston-Salem." </p>
      <p>Seems like the logo is pretty literal. Wavy lines = water. Type = old 18 or 19 century engravers roman. Makes a plain old thud on the page or screen. Easily recognized &amp; processed, then just as easily forgotten, I think.</p>
