      <p>I’m not sure what the relavance of the bull shape as shadow is, but I like that part. I assume thats indicatig a balance between subtle and aggressive solutions. The very first thing that caught my eye, however,  was the lack of eyes on the dog. I just kept seeing it as a symbol of blindness. Maybe its supposed to be a silhouette but being outlined gives a different effect. The type placement in relation to the image seems a bit tricky, but probably not far off.</p>
      <p>Stephen Rapp</p>
