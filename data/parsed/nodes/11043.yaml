  html: <p>My intention was to create a type by first taking type and then manipulate it using light and shadow, which then deteriorated the letterform.  <br>This is my first typeface design. Please let me know what you think.  <br> <br> <img src="http://www.typophile.com/forums/messages/29/9100.jpg" alt="Remnant"></p>
