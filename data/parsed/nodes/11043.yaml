    html: <p>  <i>...if you just took an existing typeface and <br>applied filters to it, there may be legal issues</i> <br> <br>I have heard this sort of thing said before and <br>I am wondering if that is really true. In the US, <br>a type <i>design</i> cannot be copywritten. As I  <br>understand it, the name can be protected but  <br>not the design itself. <br> <br>Ethically, I am totally convinced it would be <br>wrong to directly copy someone else's work.  <br> <br>But what would the legal issues be? <br> <br>-smc</p>
