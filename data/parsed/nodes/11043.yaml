    html: <p>Hi, Beth. <br> <br><i>&gt;I actually think the Frothy typeface looks very similar to a <br>fellow student's design.</i> <br> <br>I didn't mean that your Remnant <i>looks</i> similar to Frothy. <br>I just put those links above just as "reminder". Taking an existing  <br>typeface and changing it, it's not as innovative as it may sound. <br> <br>Can I ask you a question? Why did you choose Stone Sans to <br>play with? It was the same typeface used in Frothy. <br> <br> <br><i>&gt;Both Frothy and Tetnus remind me a lot of Baskerville.</i> <br> <br>I don't wanna be picky, but how can a modern serif typeface <br>remind you of a nineties grunge one? ;-) <br> <br></p>
