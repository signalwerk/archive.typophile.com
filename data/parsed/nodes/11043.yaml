    html: <p>It looks like wrinkled tinfoil.  I'm not sure if the name "remnant" works, since the majority of the letter is still there.  It's definitely something that can be used as a display, but if you just took an existing typeface and applied filters to it, there may be legal issues.  It's a good start though.</p>
