    date_raw: 23 Apr 2003 — 12:19pm
    votes: null
    html: <p>Sorry I haven't gotten back to all of you sooner. I was just reminded by a friend of mine that I had some responses.  <br>I guess I need to explain my process a little more. To start with I took a typeface, made some alterations, crumpled the paper, took digital pictures of each individual letterform in 3 different light settings. Then I took these images and manipulated them in Streamline. The high contrast and conversion I applied helped erase my letterforms to my goal.  I hope this helps. Also, in response to Eduardo- I actually think the Frothy typeface looks very similar to a fellow student's design-Tetanus. I think it is also posted on here. Both Frothy and Tetnus remind me a lot of Baskerville.  <br>For legallity purposes, I'm not intending to sell this. Just for personal use and for my class project. Thank you!</p>
