  - id: 69809
    user: 1492
    date: 2003-04-23T20:49:00
    date_raw: 23 Apr 2003 — 8:49pm
    votes: null
    html: <p>Eduardo- I understand you were sharing with me what you thought was similar. I also understand that changing an existing typeface is not so good. What I wanted to do, was to work with it and to create a typeface that appeared unwanted, used, and all that remained was this new design. I didn't realize that I along with the Frothy designer had such a pull to Stone Sans. Just kind of odd I guess. I thought Tetnus looked a bit like Baskerville because I think that is one of the types she used to base her typeface on.  <br> <br>On another note, any suggestions on what to use this typeface on? I'm trying to brainstorm for my specimen posters......just looking for open feedback from everyone. I am hoping for a better idea than for a landfill flyer. Thanks!!!</p>
