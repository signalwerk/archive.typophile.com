  html: <p>Hello--I'm new to this forum. I've used FontMonger on a Mac off and on for years to make OSF versions of typefaces for book projects, and add ligatures, etc. Now I'm composing type for books that need more stuff, like macrons over Os, etc. . . and I'm sure FontMonger is going to stop working someday. What is the current program of choice for this kind of combining/editing job?Is TypeTools enough? I don't design new fonts--just mix &amp; match. I still use KernEdit to do my kerning on OS 9.2</p>
