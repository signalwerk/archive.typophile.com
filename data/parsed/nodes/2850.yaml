    html: <p>pfaedit is now known as <a class="freelinking external" href="http://fontforge.sf.net/" rel="nofollow">FontForge</a>. It is free, open source software that runs quite nicely on Mac OS X (10.3-ish and up) with X11, once you get used to its non-Mac-ness. It's updated and improved continuously, with full rebuilds on a nearly monthly basis.</p>
