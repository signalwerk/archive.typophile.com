    html: '<p>Practically, the only software for font editing on Mac that is constantly being developed, updated, supported etc. is FontLab (currently at version 4.6): <a href="http://www.fontlab.com" target="_blank">http://www.fontlab.com</a>  <br>Apart from the flagship application (FontLab), the company Fontlab Ltd. offers other tools for font-related work: ScanFont (a FontLab plugin for turning bitmaps into outline fonts), TransType (a font formats converter), BitFonter (a bitmap font editor), TypeTool (a lightweight version of FontLab), and others. Some of the applications are available for both Mac and Windows, while others are only available on one platform.  <br>Visit <a href="http://www.fontlab.com" target="_blank">http://www.fontlab.com</a> for more details.  <br>Regards,  <br>Adam</p>'
    html_clean: '<p>Practically, the only software for font editing on Mac that is constantly being developed, updated, supported etc. is FontLab (currently at version 4.6): <a href="http://www.fontlab.com" target="_blank" class="link-external">http://www.fontlab.com</a>  <br>Apart from the flagship application (FontLab), the company Fontlab Ltd. offers other tools for font-related work: ScanFont (a FontLab plugin for turning bitmaps into outline fonts), TransType (a font formats converter), BitFonter (a bitmap font editor), TypeTool (a lightweight version of FontLab), and others. Some of the applications are available for both Mac and Windows, while others are only available on one platform.  <br>Visit <a href="http://www.fontlab.com" target="_blank" class="link-external">http://www.fontlab.com</a> for more details.  <br>Regards,  <br>Adam</p>'
