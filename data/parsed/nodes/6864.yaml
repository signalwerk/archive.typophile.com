    html: <p>I like hummingbirds, and I like wood, but I don't see the connection. Do they already have a  <br>hummingbird in their logo that you are preserving? <br> <br>Also, you'll get alot more useful suggestions from the folks here if you tell a little about the company.  <br>For instance, does Woodnet serve wood suppliers or buyers? Raw materials like lumber or finished <br> woodworking pieces?  <br> <br>The dn ligature looks a little more like dh.  <br> <br>Not sure about the font. It doesn't feel very "woody" to me.</p>
