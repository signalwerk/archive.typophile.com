    html: "<p>Thanks for your input, Jon. The y has been the stumbling block on this project. None of us at the shop are happy with it either, so at least I'm glad to know we're not alone in our opinion. Back to the drawing board! <br> <br>The Critique area seems more specifically gears toward font creation, and so I wasn't sure where it would fit in there, but yes, I notice that region gets alot more attention.  <br> <br>The design has to fit between the pickups on a bass guitar. It's sort of an unusual location. This area is about 2 inches high and 5 inches wide. It's placed under the strings where the player's right hand plucks the strings.  <br> <br>Depending on where we put the inlay, there are limitations on size. A common place to put a decorative inlay is the 12th fret - it's the center of the string and marks the octave. It's a small space, typically only 5/8 x 2 inches on a guitar and 7/8 x 2-1/4 inches on a 4-string bass. You can't go to the edges, the designs look better with a buffer sround them. You have to consider where the string will fall once they're installed too.  <br> <br>If a name or other personalization would be too big to inlay, we  engrave mother of pearl scrimshaw style. That allows finer detail than you can do in a regular inlay.  <br> <br>The sharp points aren't a problem since after we saw the inlay, it's filed smooth. You can do some amazing things with tiny files. Here's a picture of Mike filing a Roman numeral I: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39558.jpg\" alt=\"Mike files\"> <br> <br>These are some of the Roman numeral inlays temporarily mounted before actually inlaying them in the fingerboard: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39559.jpg\" alt=\"golden mother of pearl r.n.\"> <br> <br>Little thin places are prone to cracking. Either in sawing, filing, handling or glue-in. This is an example of one that cracked on installation: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39560.jpg\" alt=\"cracker\"> <br> <br>Can't win 'em all.</p>"
