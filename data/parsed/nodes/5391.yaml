    html: <p>Agreed Jon, this is a cool thread. Love inlay work! <br>Jim, your advice about the AY is a great. <br> <br>Mica, in addition, consider ending the left leg of the A at the baseline. That will better frame the design between the swash leg of the K and the tail of the Y. Rotate the K 180 degrees as a starting place for your Y (this is what Jim is talking about giving the Y a more U shape).  <br> <br>Good luck! <br>Randy</p>
