  - id: 38837
    user: 2127
    date: 2004-07-19T12:17:00
    date_raw: 19.Jul.2004 12.17pm
    votes: null
    html: "<p>Hopefully you'll get to see the completed letters here: <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"cutkay\"> <br> <br>These are just arranged on an unfinished piece of ebony. I need to work out the final spacing still. <br> <br>Mike was the artist who cut the letters from the shell. He really liked cutting the upper left curl on the \"y\" best, but it took 3 attempts before he got a letter without a fracture. The first one broke at the upper right, the second had an unseen defect at the bottom of the bowl. The third came out great.  <br> <br>Sally, that space has been bugging me ever since I started this project. Any attempts I've made have made to fill that space made the overall look too \"frilly\" for both my taste and the customer's. We swung the vertical of the a out slightly towards the y and it did help some.  <br> <br>Hrant, the suggestion for a complimentary negative space is interesting. There already is a good sized space at the top of the \"Ka\", but it's not demanding enough attention to counter the open space on the \"ay\".  <br> <br>Even though the shell is already cut, I'm going to explore this a bit further (after TypeCon!) to see if I can get an even better solution before we actually sink the shell in the wood. I won't mind having an extra \"a\" around if I can fidn something better for this project. </p>"
    html_clean: "<p>Hopefully you'll get to see the completed letters here: <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"cutkay\"> <br> <br>These are just arranged on an unfinished piece of ebony. I need to work out the final spacing still. <br> <br>Mike was the artist who cut the letters from the shell. He really liked cutting the upper left curl on the \"y\" best, but it took 3 attempts before he got a letter without a fracture. The first one broke at the upper right, the second had an unseen defect at the bottom of the bowl. The third came out great.  <br> <br>Sally, that space has been bugging me ever since I started this project. Any attempts I've made have made to fill that space made the overall look too \"frilly\" for both my taste and the customer's. We swung the vertical of the a out slightly towards the y and it did help some.  <br> <br>Hrant, the suggestion for a complimentary negative space is interesting. There already is a good sized space at the top of the \"Ka\", but it's not demanding enough attention to counter the open space on the \"ay\".  <br> <br>Even though the shell is already cut, I'm going to explore this a bit further (after TypeCon!) to see if I can get an even better solution before we actually sink the shell in the wood. I won't mind having an extra \"a\" around if I can fidn something better for this project. </p>"
