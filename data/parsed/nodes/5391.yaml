    html: <p>Wow! Thanks for taking the time to photograph the work and sharing it here.  <br> <br>That's so much closer to sculpting type than a lot of modern typographers get. <br> <br>I see the break between the a and m. What do you do when that happens on installation? Do you take it out and cut a new one and re-install it? What about the glue? <br> <br>I don't know why more people aren't swarming around here...this definitely has chirographic heritage but the cutting of the inlays and the fact that you embed letters into insturments is just so...so...well COOL...I love this.</p>
