  html: "<p>Did you know that even guitar makers cared so much about letters? <br> <br>We're making a custom bass guitar with an inlay in mother of pearl between the pickups on black. The inlay is in remembrance of the customer's mother, Kay. At first this didn't seem to be a difficult task, we inlay names all the time.  <br> <br>But Kay is especially difficult.  <br> <br>Anything that looked \"pretty\" we encountered the descender of the y clashing with the K. Without any other contextual clues, many ideas looked like initials KAY.  <br> <br>Here is the original concept: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39456.jpg\" alt=\"kay1\"> <br>#1 <br>He generally liked it, but wanted the letters more on a baseline. So we proposed: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39457.jpg\" alt=\"kay2\"> <br>#2 <br>Didn't like the new y at all, but the rest he was satisfied with. So we tried a new one that he likes: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39458.jpg\" alt=\"kay3\"> <br>#3 <br>But now I need to make the final drawing for the inlay artist.  Before I plunk a few hours into the artwork, I'm looking for any suggestions. I'm especially bothered by the large difference in the negative spaces between the letters. It especially shows up in  a mock up with the materials: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39459.jpg\" alt=\"mockup\"> <br> <br>Many of the forms have to remain somewhat chunky to reduce the chance of snapping the shell while cutting with the saw. Ends can finish to a very sharp point, but a thin isthmus (like the bar on an A) is very fragile. </p>"
  html_clean: "<p>Did you know that even guitar makers cared so much about letters? <br> <br>We're making a custom bass guitar with an inlay in mother of pearl between the pickups on black. The inlay is in remembrance of the customer's mother, Kay. At first this didn't seem to be a difficult task, we inlay names all the time.  <br> <br>But Kay is especially difficult.  <br> <br>Anything that looked \"pretty\" we encountered the descender of the y clashing with the K. Without any other contextual clues, many ideas looked like initials KAY.  <br> <br>Here is the original concept: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39456.jpg\" alt=\"kay1\"> <br>#1 <br>He generally liked it, but wanted the letters more on a baseline. So we proposed: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39457.jpg\" alt=\"kay2\"> <br>#2 <br>Didn't like the new y at all, but the rest he was satisfied with. So we tried a new one that he likes: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39458.jpg\" alt=\"kay3\"> <br>#3 <br>But now I need to make the final drawing for the inlay artist.  Before I plunk a few hours into the artwork, I'm looking for any suggestions. I'm especially bothered by the large difference in the negative spaces between the letters. It especially shows up in  a mock up with the materials: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39459.jpg\" alt=\"mockup\"> <br> <br>Many of the forms have to remain somewhat chunky to reduce the chance of snapping the shell while cutting with the saw. Ends can finish to a very sharp point, but a thin isthmus (like the bar on an A) is very fragile. </p>"
