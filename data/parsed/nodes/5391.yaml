    date: 2004-06-30T11:21:00
    date_raw: 30.Jun.2004 11.21am
    votes: null
    html: "<p>Mica <br> <br>Your project is very appealing, both as a type project and an instrument. <br> <br>Have you tried: tilting the downstoke of the A just slightly off the vertical toward the Y and then swelling the downstroke of the Y to make more of a U shape. This would help to reduce the neg space between the two letters. I don't find the neg sapce between K and A to much. <br> <br>I am an amateur jazz cornet player, and I love working with wood, so I sort of fell into starting to build a steel string acoustic guitar. I don't know how to play the guitar, but I didn't see that as any reason not to make one. I will see if I can learn how to play basic rhythm once it's finished. <br> <br>My point: you might consider getting your hands on a small pantographic engraving machine. The manual models are now quite cheap, since the industry is switching to computer assisted models. <br> <br>The advantage to the pantograph is that you can work large to start. Your tight pencil drawing is photocopied into a good quality Strathmore 2-ply bristol, and you cut it out cleanly with a sharp X-Axto knife. You can save the negative area and this becomes the pattern fpr the sink that you will be cutting. Both parts are pasted to a thick matte board as separate pieces; positive and negative. <br> <br>These two are traced witha stylus on the panto as whatever reduction you require, and you cut about 1/64\" in depth into a good rigid material like aluminum plate or some workable metal. This is the working pattern. You make a working pattern for both the sink and the inlay material. If you use the same sized cutter for both patterns, they will be very accurate and precise. <br> <br>Once you have the two working patterns made, these fit onto the pantograph separately and you then make the sink in the guitar material, whether it's wood or phenolic or whatever. Next you angrave the inlay material using the same cutter and the fit is perfect. <br> <br>To make it stable and unmoving the inlay material is glued to heavy laminated chipboard with white glue and left to dry a few hours. Ths piece goes on the panto for cutting. <br>When you are finsished you can lift the inlay by soaking until it releases from the cardboard material. If you want a little loosensess to the fit of the sink and the inlay this can be done by tweaking the size of the stylus that you use when cutting the sink, and the hole will come out a few thou, more open to let the inlay pop in so that it is not so tight as to crack when you are apressing it in. <br> <br>I've tried this with some rigid plstic in place of the abalone that I intend to use, and it cuts ok but it could be a little less gummy for better results. Pearl or abalone should cut very cleanly. With this method you can have considerably finer lines (the cross stroke in the A in KAY). <br> <br>You will not lose the handmade feeling in you work by doing it this way, it will just give you work more refinement. <br> <br>If this is not too nutty for you, email me and I will give you some leads on what to look for and where. <br> <br>By the way; if you look up the ATypI 2004 on the web you will see a photospread that John Hudson did on my cutting of the keepsake for the Conf. This will give you some idea of the process if you are not familiar with it. <br> <br>I find it nice that so many of us do other things along with typography, and that makes this Forum so much more fun than simply talking shop. <br> <br>Jim Rimmer <br> <br></p>"
