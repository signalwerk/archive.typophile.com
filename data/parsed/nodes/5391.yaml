    html: "<p>Mica, this is a fascinating process. <br> <br>First, some Suggestions: You may find that increasing the size of the A and Y helps generally. The other thing that I see, is that the Y doesn't really 'match'. Perhaps reshaping the Y would help. I would be tempted to try recalling the shape of the leg of the K or the bulgy left side of the A and applying it on the left arm of the Y or its tail. I also think that the A if made larger would create a nice spade shaped negative space with the foot of the K. <br> <br>BTW: you'll find faster uptake if you need input about specifics if you post in Critique, but this shows process a lot so the cross-over is natural. <br> <br>Now some Questions, if you have the time: <br>Just how large is a design like this? Must it fit between/in a fret (no I don't know the proper way to refer to this...) and just how wide is that? Do you have difficulty if a name or word exceeds a certain size i.e. William - would that have to be reduced to Will? Could you do William small enough to fit within a fret? <br> <br>You mention that thin isthmus would present a problem, but sharp points are fine. Can you share the reason for this? <br> <br>I think the hand drawn curviness is neat, especially when I imagine it in the context of a curvy guitar. I like the hint of Rolling Stone. <br> <br>Jon</p>"
    html_clean: "<p>Mica, this is a fascinating process. <br> <br>First, some Suggestions: You may find that increasing the size of the A and Y helps generally. The other thing that I see, is that the Y doesn't really 'match'. Perhaps reshaping the Y would help. I would be tempted to try recalling the shape of the leg of the K or the bulgy left side of the A and applying it on the left arm of the Y or its tail. I also think that the A if made larger would create a nice spade shaped negative space with the foot of the K. <br> <br>BTW: you'll find faster uptake if you need input about specifics if you post in Critique, but this shows process a lot so the cross-over is natural. <br> <br>Now some Questions, if you have the time: <br>Just how large is a design like this? Must it fit between/in a fret (no I don't know the proper way to refer to this...) and just how wide is that? Do you have difficulty if a name or word exceeds a certain size i.e. William - would that have to be reduced to Will? Could you do William small enough to fit within a fret? <br> <br>You mention that thin isthmus would present a problem, but sharp points are fine. Can you share the reason for this? <br> <br>I think the hand drawn curviness is neat, especially when I imagine it in the context of a curvy guitar. I like the hint of Rolling Stone. <br> <br>Jon</p>"
  - id: 38823
