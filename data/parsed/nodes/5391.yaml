    html: "<p>Jim - not one of my immediate family members play guitar, and we've been making these for almost 35 years now. Heck, I'm no typographer, and I still play with letters <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> After playing piano for close to 20 years, I'm finally branching out to a bass guitar. Feel free to email any questions about building to me. <br> <br>And thank you for your suggestions. Your advice is appreciated. My dad will surely want to investigate the pantographic engraver more. I've tried to follow your advice, and I look forward to any other comments. While there is improvement, I'm sure I'm not quite finished:  <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39767.jpg\" alt=\"kay today\"> <br> <br>I really like the way Randy's suggestion for ending the A at the baseline ended up.  <br> <br>I'm trying hard to clean it up, but not lose the funky hand drawn aspect and the original character of my mom's letters.  <br> <br>Jon - when something breaks on install, we have to explain to the customer about the upcoming delay. In the case above, he decided it was so minor he wanted to keep it the way it was. That inlay is only about an inch across (and it's under the strings). Otherwise, it must be removed with a rotary cutter and a new inlay gets made. There can be casualties all along the way.  <br> <br>We almost always hand letter the designs. We might start with a font to get some general proportions, but since we're custom making everything, we figure even the lettering should be unique and reflect the individual we're making it for. <br> <br>The most common inlay is initials. This is KP in Elvish: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39768.jpg\" alt=\"KP\"> <br>The oval is a sterling silver wire and the letters are cut from mother of pearl.  <br> <br>And in this design, the customer's initials DE were incorporated with a bass clef: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/39769.jpg\" alt=\"DEdance\"> <br>He sent in a rough sketch of his idea, then we worked it to the final design. The oval is ebony with sterling silver wire. The bass clef is golden mother of pearl. The E and the stem of the D are  black Tahitian mother of pearl.  <br> <br>Just about everyone here is considered a designer. My mom, Susan, is the lead designer. On a given project, we toss around ideas until we figure who will be best suited to do the design, and to execute the inlay itself. I usually get type related projects since that's a special interest of mine.  <br> <br>We have been commissioned to exuecute other artist's designs, but we still need to adapt them to suit the medium. <br> <br>Thanks again for the questions and suggestions.</p>"
