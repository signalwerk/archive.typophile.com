    html: '<p>Hello Peter <br> <br>I love the concept that the same shape can create three letters through rotation, but i have to agree with Daniel that without the subtitle, CAN is difficult to be read. On the other hand i think CAN is positive (though i am not familiar with the common american language) because the verb "can" neans anything but impossibility. <br> <br>But as you said Peter you asked for the type...  <br>I think the best thing is -as you said- to be flexible with it, not just underneath or right, but also column underneath, depending on where and how big your logo is. <br> <br>Also aesthetically i would recommend to use a much bigger type in lc and extra light in the same row with CAN (maybe even in the same x-height) or a column underneath, so it will gently brake your constructivistic boldness. <br> <br>A last comment: if you can still touch the logo i think it would be intersting to put a small square or dot or anything upper and right of N so to help the legibility and also with a bright color there you could express energy and activity -like coming out of CAN. Hope that i helped. <br> <br>christos</p>'
