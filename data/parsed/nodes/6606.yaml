    html: "<p>Christos, thanks for the feedback.  one thing I like about the letterforms being simliar is that it hits home this idea of network, similar elements coming together to make something.  also makes for interesting humanoidal patters. <br> <br>the idea of pairing a light sans is a good one.  I am liking some of those executions.  stacking isn't working though.  maybe I am not doing it correctly. <br> <br>I am liking the frame idea though.  could make for a strong branding element if i left-align and use it like a wrapper of sorts. <br> <br>thoughts?  thanks for your help guys. <br> <br>sketches: <br><img src=\"http://www.typophile.com/forums/messages/29/48721.gif\" alt=\"\"> <br> <br>what i am liking: <br><img src=\"http://www.typophile.com/forums/messages/29/48722.gif\" alt=\"\"> <br> <br>and funky pattern effect: <br><img src=\"http://www.typophile.com/forums/messages/29/48723.gif\" alt=\"\"></p>"
