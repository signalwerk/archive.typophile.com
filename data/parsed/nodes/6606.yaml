  html: <p>OK.  Having some trouble with coming up with a lockup for this logo.  I think the 3rd one on the right works the best in both contexts, but I am not happy with stacking the type to the right. <br> <br>I like putting it underneath logotype, but then it gets lost on the 1st sketch, and on the 2nd sketch I am not sure what to have extend beyond the right of the logotype.   <br> <br>Probably what will work best is a combination of 1 and 3.  Stack the type on the right when small, position it all underneath when big. <br> <br>But I want see what you all have to say. <br> <br>CAN is a network of creative professionals engaged in multimedia politically-focussed projects.  A lot of their work will be for broadcast, some for print and web. <br> <br>Thanks for your help. <br> <br><img src="http://www.typophile.com/forums/messages/29/48608.gif" alt=""></p>
  html_clean: <p>OK.  Having some trouble with coming up with a lockup for this logo.  I think the 3rd one on the right works the best in both contexts, but I am not happy with stacking the type to the right. <br> <br>I like putting it underneath logotype, but then it gets lost on the 1st sketch, and on the 2nd sketch I am not sure what to have extend beyond the right of the logotype.   <br> <br>Probably what will work best is a combination of 1 and 3.  Stack the type on the right when small, position it all underneath when big. <br> <br>But I want see what you all have to say. <br> <br>CAN is a network of creative professionals engaged in multimedia politically-focussed projects.  A lot of their work will be for broadcast, some for print and web. <br> <br>Thanks for your help. <br> <br><img src="http://www.typophile.com/forums/messages/29/48608.gif" alt=""></p>
