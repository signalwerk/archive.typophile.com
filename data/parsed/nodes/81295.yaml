    html: |-
      <p>What I find annoying about Times New Roman is the lack of ligature.  And I find the kerning to be quite tight, and the serif's to be over dramatic.  Henceforth, that is the reason why I believe there has to be a better type then what modern culture has dubbed to be the <em>"best"</em>.  Now I realize that it is possible to adjust the kerning, but that doesn't solve the serif and ligature issue I have with it.</p>
      <p>Frankly, the question at hand isn't so much the overall format of the paper, but through revision of my own though, what is a suitable typeface for reading?  Any suggestions?</p>
