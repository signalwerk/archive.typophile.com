    <p>Fellow typophiles and writing enthusiasts,</p>
    <p>I came from my design class the other day with a question, one which lacks importance and urgency on all possible fronts:<br>
    "What is the perfect format for a university grade essay?"</p>
    <p>Now we all know that the content of an essay is the most important aspect of it, however, my professor hypothesized that the actual format (typeface, margins, kerning, ligatures, etc) has an unsung importance to the overall essay.</p>
    <p>Myself being a rookie in typography (in contrast the other members on this forum), I come to you with the simple question, what is the perfect essay format?</p>
    <p>Cheers!</p>
