    html: |-
      <p>I think TEA REVIVES YOU looks like <a href="http://new.myfonts.com/fonts/ephemera/toronto-gothic/" rel="nofollow">Toronto Gothic</a>, a revival by Andrew Leman of what he says was probably Condensed Titling Gothic No. 11. He rounded the corners just like your sample, and so I think this is the font used. I think the two shorter words were 'squooshed' graphically to fit better, but I think they are the same font.</p>
      <p>It's not clear to me that your second sample is the same font, but it is certainly a similar style. I found this one by searching with the terms 'woodtype sans-serif'.</p>
      <p>- Mike Yanega</p>
