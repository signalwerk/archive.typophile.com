    html: |-
      <p>Yes.</p>
      <p>But, grids themselves and how you use them are 2 different things, and both are important. I think most of the time the grid should be invisible to the viewer, but it can be used in a more dominant way to great effect too.</p>
      <p>In the 90's grid-based design had a bit of a falling out thanks to David Carson, and the hordes of imitators, but thankfully grids, simplicity and logic are, and have been, making a comeback.</p>
