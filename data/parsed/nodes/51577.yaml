    html: |-
      <p>I agree Miss Tiffany. But I don't think it is old school.<br>
      @ N-Jay-G: Have a look at this website: <a href="http://www.markboulton.co.uk/journal/comments/simple_steps_to_designing_grids/" title="http://www.markboulton.co.uk/journal/comments/simple_steps_to_designing_grids/">http://www.markboulton.co.uk/journal/comments/simple_steps_to_designing_...</a></p>
      <p>We all design for an audience. We should at least.<br>
      In normal circumstances you want to aid the reader in reading the text.<br>
      By giving this text (and other content) in small readible chuncks, you will help the reader.</p>
      <p>Using a grid does the same. A well designed grid will present the content in a pleasant way and also presents a structure, an order in that content. This troughout a complete book or magazine.</p>
      <p>But even when you are designing a flyer, your design could benefit from a well designed grid since a well designed grid is also a pleasant grid.</p>
      <p>It is up to you to design a grid which will be true for your design style.</p>
