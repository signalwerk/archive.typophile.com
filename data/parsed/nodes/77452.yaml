      <p><cite>if I would be allowed, to split a font into parts and create CSS classes as replacement for the layout features. </cite></p>
      <p>How many customers are there, that can split a modern webfont with OT features and preserve TrueType hinting, keep OT features and kerning working? 1 out of 50? And the other 49 will mess it up, ending up with bad looking or malfunctioning fonts and they or the viewers of their websites will blame the type foundry. So that's not a route the foundries will take.<br>
      If features such as small caps should work in a webfont, they should be already in the font as OT feature (wont work now) or be provided by the foundry as separate font (as FSI does it) or be generated on the fly by the vendor's system (as Typotheque's webfont service does it)<br>
      You purchase a license to use a font. Foundries don't sell toolbox of glyphs and codes so you can build whatever you want from it.<br>
      (Multiple Master was a step in that direction but the avarage user apparently didn't want that.)</p>
