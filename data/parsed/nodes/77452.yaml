    html: |-
      <p>Font Squirrel has a page where you can submit an OTF/TTF file and get back a webfont kit. I think it's based around Unix/Linux programs, so if you have a Linux box or an OS-X Mac, you can probably assemble your own toolchain.</p>
      <p>But Arno is right. A webfont is any font when it's used on the Web. As long as it looks good enough on the screen, no-one'll give you grief.</p>
      <p>There are dedicated web font formats around: EOT (Internet Explorer), WOFF (Firefox 3.6 and later), Cufon, sIFR, typefaceJS... *swirly eyes*</p>
