  html: <p>I have not been following this but myfonts.com has just recently come up with a program to create webfonts from any fonts a foundry chooses. Since I am a foundry I thought this is a great idea. I know I am out of the loop on this one but for one thing, what is involved in doing this yourself? What tools, software, other are involved? Was this a topic posted earlier? Sorry if this sounds a bit lame, but there it it.</p>
  html_clean: <p>I have not been following this but myfonts.com has just recently come up with a program to create webfonts from any fonts a foundry chooses. Since I am a foundry I thought this is a great idea. I know I am out of the loop on this one but for one thing, what is involved in doing this yourself? What tools, software, other are involved? Was this a topic posted earlier? Sorry if this sounds a bit lame, but there it it.</p>
