      <p>@ Karsten</p>
      <p>Georgia would be in the second place of my font stack. And with regard to backwards compatibility your argument is not valid, because in case of the layout features there is a solution (font splitting), while there is no solution in case of font embedding. OT layout rules are even not compatible to the actual browser generation. In other words: If I would use those CSS rules, my website would be compatible to the most used browsers in a few years without backwards compatibility. If I split the fonts, my website is compatible to the actual browser generation and in five years it will be backwards compatible. By the way you seem to forget, that web pages can be printed. And I have a few texts, that are intended to become printed. So I am not interested in fake small caps. And except from that I don’t want to use Charter, because it looks nicer, but because it is more legible than Georgia in my opinion. Charter Pro really looks excellent. I simply will ask Bitstream, if they allow the splitting. And if they don’t allow it, they simply don’t get my money. I assume, that the foundries, which sell web fonts via Myfonts, want money. The “I want, I want, I want” is not on my side only. I only want a reward for my money. The reward is, that I am allowed to invest my time and my energy in splitting the font by myself. I even don’t expect, that they do that for me. If they want to have just a restrictive EULAA. Bad luck, but not only for me.</p>
