      <p>Typekit (among others) - and by their own admission, really - delivers all the 'bad looking and malfunctioning fonts' you could possibly want now, today. So what?<br>
      You talk of "the foundries" as a monolithic entity. Has there been a grand merger I'm unaware of? Some foundries will do whatever they think a customer is willing to pay for.</p>
      <p><em>If features such as small caps should work in a webfont, they should 1) be already in the font as OT feature (wont work now) or 2) be provided by the foundry as separate font (as FSI does it) or 3) be generated on the fly by the vendor's system (as Typotheque's webfont service does it)</em></p>
      <p>Well, okay. All Arno is asking for is option number 2, so where's the disagreement?</p>
      <p><em>You purchase a license to use a font. Foundries don't sell toolbox of glyphs and codes so you can build whatever you want from it.</em><br>
      Some will.</p>
