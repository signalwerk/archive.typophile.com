  html: |-
    <p>To celebrate (even if belatedly) the ending of my PhD and obligatory military service, <a href="http://www.backpacker.gr" rel="nofollow">backpacker.gr</a> has undergone some major changes and additions:</p>
    <p>- changes and tweaking on the site's code,<br>
    - the addition of 4 especially selected and, at one case, exclusively released webfonts (created using Font Squirrel's <a href="http://www.fontsquirrel.com/fontface/generator" rel="nofollow">@font-face Generator</a>),<br>
    - the showcase of several old and new printed and interactive works, and<br>
    - the introduction of <a href="http://www.backpacker.gr/academic" rel="nofollow">backpacker.gr/academic</a>, including a concise presentation of my academic work from 2004 to 2010.</p>
    <p>I hope you enjoy the changes. Feel free to send me comments and remarks, and keep sending me great design using backpacker fonts (and from now on webfonts :-)</p>
