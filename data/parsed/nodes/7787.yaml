    html: "<p>This is very nice, and I'm rather disappointed that I haven't been able to crash it yet. Feels much more solid. The selection mode is very useful; I love being able to move whole curves around. Predictably enough, I enjoy being able to close a curve by double clicking. <br> <br>But enough sycophancy: what don't I like? The invisible global modes, of course. (The Apple Human Interface guidelines are very sound on <a href=\"http://developer.apple.com/documentation/MacOSX/Conceptual/AppleSWDesign/HIDesign/chapter_3_section_2.html#//apple_ref/doc/uid/TP30000353/TPXREF110\">this topic</a> IMO; and even vi tells you what mode you're in these days. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) Also the 'corner mode' is redundant; Ctrl-click in curve mode is wonderful and sufficient. Two global modes, together with a clear visual indication of which you're in (like a different mouse pointer) would be fine I think. <br> <br>Adding a knot to a curve behaves rather confusingly. You have to click near the curve, and the knot is then added at the exact point where you clicked, which usually causes the rest of the curve to change slightly. I think it would be better to add the knot as nearly as possible directly onto the existing curve instead. For curves that don't intersect themselves, it seems (experimentally) to be possible to add new knots in such a way that the existing curve doesn't perceptibly change. <br> <br>It would be nice to be able to use the arrow keys to fine-tune the placement of knots. <br> <br>Probably you've already thought of all these things. Just throwing them out as fuel or grist. <br> <br>PS. Hey, I'm a regular!</p>"
