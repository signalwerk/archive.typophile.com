    html: "<p><i>That would be very cool, and prompts me to re-ask: what would be involved in getting a version of this to work on Windows? Sorry if that is a terribly distasteful thought, I'm just wondering how difficult it would be.</i> <br> <br>Not distasteful at all. The answer is basically: 1000 lines of code. Ordinarily, I could toss that off in a weekend[*], but the fact is that I have never actually written a Win32 GUI app before, so I have to factor in the time it takes to learn the platform. <br> <br>So my current plan is to release the OSX version first, because it's easier (it shares roots with Linux), then tackle the Win32 port. I make no promises when it'll be done, but getting good feedback sure helps motivate me! <br> <br>*Ok, that's bragging a bit :<a href=\"http://i.cantcode.com\"></a>)</p>"
