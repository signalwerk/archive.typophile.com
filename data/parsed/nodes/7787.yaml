    html: <p>I've also been wondering about the discontinuities in the mapping from points to curves. For example, the following sequence of four curves appears as I move the selected point gradually leftwards. <br><img src="http://www.typophile.com/forums/messages/30/54224.gif" alt="1"><img src="http://www.typophile.com/forums/messages/30/54225.gif" alt="2"> <br><img src="http://www.typophile.com/forums/messages/30/54226.gif" alt="3"><img src="http://www.typophile.com/forums/messages/30/54227.gif" alt="4"> <br>I'm not sure whether this is a problem; or if it is, whether it has a reasonable solution. Would it be feasible and/or sensible to favour curves that don't intersect themselves?</p>
