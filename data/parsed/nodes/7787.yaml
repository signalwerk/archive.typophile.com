  html: <p>Hi typophiles! <br> <br>Largely motived by the excellent feedback I got on the <a href="http://www.typophile.com/forums/messages/30/53052.html?1100995864">previous thread</a> in which I posted the first "code escape" of the Cornu-based curve editor, I am now releasing a second version, as a <a href="http://casper.ghostscript.com/~raph/ppedit.tar.gz">source tarball</a> for Unix-like systems. <br> <br>I believe that the segfaults reported by Robin Houston are now fixed (the ones due to coincident points due to his patch, the other ones due to numerical instabilities when spirals are too close to perfect circles). <br> <br>But the main thing you'll notice are the usability improvements; just click on a curve to insert a knot, or press Ctrl-D to delete one. You can also select (and move) groups of points at once. Double-clicking a curve closes it, and Ctrl-click makes a corner point, so you don't have to do the click,Ctrl-T combo. <br> <br>As before, you need either Linux (or anu reasonable Unix) system or OSX with Fink set up for development. The main libraries are Gtk 1.2 and Libart-2. I will post a native OSX version soon as well. <br> <br>Feedback is always welcome. It's possible at this point that I <i>am</i> going to pursue making it into a real product and/or licensable technology, so don't be surprised if there's a period of quiet followed by some kind of announcement.</p>
  html_clean: <p>Hi typophiles! <br> <br>Largely motived by the excellent feedback I got on the <a href="http://www.typophile.com/forums/messages/30/53052.html?1100995864" class="link-lost">previous thread</a> in which I posted the first "code escape" of the Cornu-based curve editor, I am now releasing a second version, as a <a href="http://casper.ghostscript.com/~raph/ppedit.tar.gz" class="link-external">source tarball</a> for Unix-like systems. <br> <br>I believe that the segfaults reported by Robin Houston are now fixed (the ones due to coincident points due to his patch, the other ones due to numerical instabilities when spirals are too close to perfect circles). <br> <br>But the main thing you'll notice are the usability improvements; just click on a curve to insert a knot, or press Ctrl-D to delete one. You can also select (and move) groups of points at once. Double-clicking a curve closes it, and Ctrl-click makes a corner point, so you don't have to do the click,Ctrl-T combo. <br> <br>As before, you need either Linux (or anu reasonable Unix) system or OSX with Fink set up for development. The main libraries are Gtk 1.2 and Libart-2. I will post a native OSX version soon as well. <br> <br>Feedback is always welcome. It's possible at this point that I <i>am</i> going to pursue making it into a real product and/or licensable technology, so don't be surprised if there's a period of quiet followed by some kind of announcement.</p>
