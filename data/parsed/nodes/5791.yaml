  html: '<p>We are questioning our boss about the id of his 30 years old company. It�s a well known design/marketing company in Rio de Janeiro (Brazil), with big clients such as Coca-Cola, Wella, BankBoston... <br> <br>The question is: what do you think about this logo? Which profile do you think our company has looking at this logo. <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/41503.gif" alt="logo"> <br> <br> <br>the word DIA has 2 meanings in portuguese: the first is DAY (opposite of night) and the other is an abbreviation of Associated Designers. <br> <br>Suggestions would be very wellcome, as well as your oppinion about the present logo. <br> <br>If you want, have a look at our website <br><a href="http://www.diacm.com.br" target="_blank">www.diacm.com.br</a> <br> <br></p>'
