    html: |-
      <p>I think what Nick is referring to is that in scripts, especially from older samples from France and other European countries, the one was often given an exaggerated lead in stroke that could be confused as a seven. Beyond that I think it might have been picked up as a stylistic variant, but the connection between the 1 and 7 in these script forms is likely the main reason for that crossbar. </p>
      <p>This is also done with cap Z's, but I'm not exactly clear how that came about other than to add some visual weight and create less white space.</p>
    html_clean: |-
      <p>I think what Nick is referring to is that in scripts, especially from older samples from France and other European countries, the one was often given an exaggerated lead in stroke that could be confused as a seven. Beyond that I think it might have been picked up as a stylistic variant, but the connection between the 1 and 7 in these script forms is likely the main reason for that crossbar. </p>
