    <p>Why? </p>
    <p>Fonts with cross-bar sevens (aside from scripts)?</p>
    <p>I believe that it is common in the handwriting of people who've been educated in Europe but not so much in North America. </p>
    <p>I'm using it to add bulk to a tabular lining seven, but I don't recall seeing it in other fonts apart from scripts.</p>
