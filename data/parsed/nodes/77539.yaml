      <div class="comment-spam-body"><p>I am an American and I believe the reason why each number is the way it is because of the number of angles. When reasoning numbers visually to a young learner<br>
      -     0 has no sharp angles<br>
      -     1 has one upright angle<br>
      -     2 should have two angles. one back one forth<br>
      -     3 should have 3 angles back forth...back forth<br>
      -    4 is the one that actually should not be crossed with three angles inside the closed four and one at the crook<br>
      -     5 should be a S with a bottom up angle do distinguish between number and letter<br>
      -     6  is one square and an incomplete square by one side<br>
       -    7  is the most messed with in terms of its original logic it should have a mini crossed base and center with its usual top and slash side<br>
      -     8 two squares simple enough<br>
      -     9 looks more like a g than a flip side 6</p>
      <p>Just google the logic of numbers and go to images to find the true reasoning of numbers<br>
      <a href="http://www.dreamstime.com/stock-photos-origin-numbers-shape-image10670373" title="http://www.dreamstime.com/stock-photos-origin-numbers-shape-image10670373">http://www.dreamstime.com/stock-photos-origin-numbers-shape-image10670373</a></p>
      </div>
