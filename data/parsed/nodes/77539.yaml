    html: "<p>Lexophile: you cross the seven to avoid confusion with the 1 or 2 (depending on your script style either could end up confused, more the 1 in styles where the 1 looks like /\\ like in Spain, and 2 elsewhere) and the Z to avoid confusion with the 2.  I've always thought it a mathematicians tool more than anything ,where you need to know the difference in  handwriting between 2z 22 and 17 11 and 77 for example.</p>"
