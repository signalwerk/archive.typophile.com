  html: |-
    <p>To help revive the type sections of the Typophile Critique Forum (and as my first official moderator shin gig), I helped inaugurate »Critique Thursday« last week.</p>
    <p>Discussion about the idea for Critique Thursday can be found <a href="http://typophile.com/node/14608" rel="nofollow">here</a>, and the list of the featured fonts can be found <a href="http://typophile.com/node/14678" rel="nofollow">here</a>.</p>
    <p>This week, I'll shine the spotlight on just two fonts.</p>
    <p>The critiquing will take place right here on Typophile, from 1–3 pm Eastern Standard Time (that should be 10 am–12 noon in California, 19:00–21:00 in Central Europe, etc.) on Thursday, August 25.</p>
