  - id: 245482
    user: 17485
    date: 2007-12-09T18:52:00
    date_raw: 9 Dec 2007 — 6:52pm
    votes: null
    html: <p>Almost forgot i should probably explain the reasoning behind this design.  The basic concept goes like this, the term in rainbows is about how we all chase "rainbows" (i.e. our dreams, relationships, goals, etc.) but often times when we reach that "rainbow" we see that it is emptiness.  So i thought the best way to express this visually was to simply use the in that was already in the word rainbows and raise it above the rest of the word thus creating an empty space representing the emptiness of the rainbow. Naturally in needs to be the first read so i used the wavy lines on the rest of the word (which also resemble the curvature of a rainbow) to fade it back. Also the album feels very stripped down and light so visually the lines worked to bring about that feeling as well. However i haven't nailed down the typography very well and could use any advice you guys might have.</p>
