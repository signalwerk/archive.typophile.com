    html: <p>I recently discovered that H&amp;FJ (in its presentation of <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100003" rel="nofollow">Cyclone</a>) calls this "biform". It may just because I've been working on one of these for the past several years, but I think I prefer this term. While "unicase" implies a lack, the idea that you only get one case where other typefaces have two, "biform" emphasizes the choices made available.</p>
