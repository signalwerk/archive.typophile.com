    html: <p>I'm sorry i should have clarified. I'm designing a logo for radiohead's new album "In Rainbows". I have a concept that involves having the letters In raised above rainbows, and im experimenting with different fonts and cases, for the word rainbows, thus far lower case r and a are working quite well but i dont' want to use a lower case b because i want the word rainbows to be as contained within a rectangular shape as possible.  Here are a couple of loose sketches im working on right now.</p><div class="imageWrap"><img src="http://typophile.com/files/in_rainbows_sketches_3473.jpg"></div><p></p>
