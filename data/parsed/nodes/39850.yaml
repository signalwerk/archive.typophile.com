    html: |-
      <p><em>“While “unicase” implies a lack, the idea that you only get one case where other typefaces have two, “biform” emphasizes the choices made available...”</em></p>
      <p>It is quite possible to have a "unicase" font with two cases, i.e. big and small letters. This situation exists normally with letters such as c, s, x, and o, which have the same form in both cases.</p>
      <p>So really, "biform" is a bit of a misnomer, as each letter has only a single form!</p>
      <p>So I propose that this category of typeface, presently termed unicase, by renamed UNIFORM or MONOFORM.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Uni1_4917.jpg"></div><p></p>
      <p>Eunoia Unicase (above) is monoform, cased with different sizes--strokes widths optically adjusted and kerned between cases. Panoptica Script (below) is monoform, but rendered slightly differently between cases as stylistic alternatives.</p>
      <p>Uniform is probably better, as it implies that the form is unified between cases, whereas monoform suggests that there is only one  form, which could also describe a single case of titling capitals.</p>
    html_clean: |-
