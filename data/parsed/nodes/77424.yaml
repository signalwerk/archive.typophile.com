      <p>Thanks! </p>
      <p>The idea is to have a nice old fashioned feeling on top of the very modern structures that work well on screen. </p>
      <p>There is also this: </p>
      <p><a href="http://code.google.com/webfonts/family?family=Merriweather&amp;subset=latin" title="http://code.google.com/webfonts/family?family=Merriweather&amp;subset=latin">http://code.google.com/webfonts/family?family=Merriweather&amp;subset=latin</a></p>
      <p>I will be working on this design for the next 6 months+. Merriweather is a work in progress and will will be improved regularly. This means you can request improvements and even fund specific features if they are not already funded. </p>
      <p>For more information and to stay updated you may want to grab the Flickr stream </p>
