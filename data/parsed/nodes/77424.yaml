  - id: 466314
    user_id: 2942
    user_name: ebensorkin
    user_path: null
    user_image: /files/pictures/picture-2942.jpg
    date_raw: 29 May 2011 — 7:43pm
    date: 2011-05-29T19:43:00
    votes: null
    html: |-
      <p>People may expect some degree of re-flow until the design is really set. These fonts are betas. They will go alpha when it has all been tested together.</p>
      <p>I realize this is very very atypical and actually Thomas Phinney made some great points online about this essentially arguing that this method of releasing a font is intrinsically flawed. I basically agree with him now but that said - for now the course is set for this project. I will see it through. And if that means some re-flow occurs then that is the price of using a font that is meant for screens in a print project!</p>
      <p>There are now 4 weights available to use - but problems with IE mean that only two of them are absolutely reliable. I am almost thinking of using a new name for the extreme weights ( assuming Google would be OK with such a thing).</p>
