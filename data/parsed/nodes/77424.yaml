      <p>Richard - It means that you can't see the lightest (thin) and the heaviest (heavy/black) weights in IE because of a flaw in the way that IE interprets weight tags. I wish I knew if I was going to be able to adopt a work around. I am sure someone wants to pressure MS into doing the right thing and allowing fonts to have more than a binary set of possible weights in IE.</p>
      <p>RE: alpha beta - Oh! Sorry, I thought it was the other way around. I thought it was an alpha candidate when you thought it was 99.9 done. Thanks for the correction.</p>
      <p>Free or not free having things that are fairly broken floating around for nearly ever - ( people don't update their fonts like they do software ) is a bit like making space junk. You can do it now... but eventually you will wish you had not.</p>
