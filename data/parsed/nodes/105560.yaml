      <div class="comment-spam-body"><p>Designed Hans Möhring as Gabriele for Wöllmer Type Foundry in 1938 or 1947.  Here is a specimen from Weber, 1947, from Jaspert's _Type Encyclopedia_ [1970]:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Jaspert379Gabriele_4439.jpg"></div><br>
      The only digital version AFAIK is <a href="http://moorstation.org/typoasis/designers/steffmann/samples/g/gabrielle.htm" rel="nofollow">Gabrielle </a> -- note double l -- by  Dieter Steffmann.<br>
      The legitmacy of Steffmann's Gabrielle was discussed a couple of years ago: <a href="http://typophile.com/node/87124" title="http://typophile.com/node/87124">http://typophile.com/node/87124</a>. The consensus seems to have been that it is as "legitimate" as you're going to get.<br>
      Don<p></p>
