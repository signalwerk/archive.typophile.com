      <p>You're stuck with a not-so-great name, but you gotta work with what you have.</p>
      <p>"The ‘industrial’ feel that has been mentioned came about with the idea that this brand needs to ooze power, commitment and something that will be around forever."</p>
      <p>The 'industrial' feel has a bit of a 'have bob slap together a sign and we'll hang it in the window' feel. Meaning that it seems to be doing the opposite of what you want. If you want the wal-mart/k-mart vibe, the key is simplicity of decoration IMHO.</p>
