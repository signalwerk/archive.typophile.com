    <p>Hello everyone, I'm new to posting on this site, but would love some general feedback on this logo I have recently created. The logo is for a chain of porn/adult stores starting up here in Sydney. The brief was quite tricky, as it needed to steer away from your usual sleazy, in your face porn store identity. The feeling with this, is that is more of a superstore chain (KMart, Walmart, Bunnings Warehouse etc.) It needs to convey the feeling of a trust worthy, responsible, friendly and long lasting brand.</p>
