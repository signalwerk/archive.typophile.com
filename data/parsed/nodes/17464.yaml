      <p>I see this as more of a identity for a toolhire firm, the font and colours don't really give the qualities that you are looking for. Furthermore, I question that the qualities that you mention are really those that an audience will want from a porn shop.</p>
      <p>If you intend to stay with the design you have you should be aware that the shadow of the bar of the T in ADULT is going to be lost at small sizes and the lower right of the A has gone missing in the distortion. The shadows are also causing a problem because of the colours they represent as having two lightsources.</p>
      <p>Overall, I would suggest that you look for another approach, maybe consider that women visit porn shops as well, I would look for an elegant seriffed font and present it in a simple, uncomplicated manner.</p>
      <p>Tim</p>
