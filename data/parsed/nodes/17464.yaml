    html: "<p>Why does this logo have such a hard, industrial feel to it? I mean, I suppose \"hard\" is appropriate for porn, but this looks much more like branding for a large industrial machinery manufacturer than a \"trust worthy...friendly\" porn shop. The Walmart logo works because it suits the consumer's clouded idea of what they'll get there: simple, no-nonsense stuff with an upbeat (mind-numbing) atmosphere introduced by the goofy star. Same with KMart, espeically with their current design: clean, simple, even childlike. In either case, \"friendly\" is gushing in those logos, which is why they're so clunky and awkward,  somehow inspiring trust, or at least diminished suspicion. Your logo makes me feel like that schmaltzy, generic super-store thing is the concept, but the atmosphere you're attempting to invoke just isn't executed successfully.</p>"
    html_clean: "<p>Why does this logo have such a hard, industrial feel to it? I mean, I suppose \"hard\" is appropriate for porn, but this looks much more like branding for a large industrial machinery manufacturer than a \"trust worthy...friendly\" porn shop. The Walmart logo works because it suits the consumer's clouded idea of what they'll get there: simple, no-nonsense stuff with an upbeat (mind-numbing) atmosphere introduced by the goofy star. Same with KMart, espeically with their current design: clean, simple, even childlike. In either case, \"friendly\" is gushing in those logos, which is why they're so clunky and awkward,  somehow inspiring trust, or at least diminished suspicion. Your logo makes me feel like that schmaltzy, generic super-store thing is the concept, but the atmosphere you're attempting to invoke just isn't executed successfully.</p>"
