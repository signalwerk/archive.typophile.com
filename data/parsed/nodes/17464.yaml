      <p>Just a few responses to questions asked:</p>
      <p>Reason that I chose to oblique the first letter of each word was because it felt quite dull and lifeless without any kind of energy/movement. The brand has to breed a little bit of excitement/energy as is the way with the industry. The 'industrial' feel that has been mentioned came about with the idea that this brand needs to ooze power, commitment and something that will be around forever. As far as a 'retro' feel, I dont see this at all. The nature of the logo needs to be put in context before a judgement like that could be successfully made.</p>
      <p>But overall, thank you all for your comments/ideas.</p>
