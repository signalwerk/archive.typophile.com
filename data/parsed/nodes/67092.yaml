      <p>On more or less the same subject, is there an advantage to handling unicase kerning one or the other of these two ways?</p>
      <p>1. Simply expand uppercase classes to include lowercase instances; e.g., A' Aacute Acircumflex Adieresis Agrave Aring Atilde Abreve Aogonek (plus) a aacute acircumflex adieresis agrave aring atilde abreve aogonek.</p>
      <p>2. In the past, I have...<br>
      (a) exported uppercase only kerning, opened the .afm file and cut and pasted the kerning data into a simple text file;<br>
      (b) opened the text file in Excel, specifying "delimited" with "space" as the delimiter;<br>
      (c) made two copies of the kerning info;<br>
      (d) run a macro to change the second column of uppercase letters into lowercase letters in the first copy, then done the same for both columns in the second copy;<br>
      (e) pasted the altered info beneath the original, then saved the results as a .prn file;<br>
      (f) pasted the .prn info into the original .afm file; then, finally<br>
      (g) imported the metrics back into FontLab.</p>
