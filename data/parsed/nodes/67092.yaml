    html: |-
      <p>My practice depends on what my clients want. I always explain the PDF issue to them, and then they decide whether this is important to them.</p>
      <p><em>If not, how high is the percentage of PDFs created which fail to preserve the original character stream?</em></p>
      <p>As I understand it, it's any situation in which Acrobat is used to distil from a print stream, as opposed to an application using some kind of write-to-PDF function that makes use of PDF character string storage. ‘Printing to PDF’ sends only the glyph IDs for the embedded font(s) which then need to be mapped to glyph names in the font(s) in order for Acrobat to try to parse these and reconstruct the original text.</p>
