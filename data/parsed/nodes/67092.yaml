    <p>I have a unicase font that has a bunch of OpenType scripting (swsh, dlig, etc.).</p>
    <p>I have designed the letters in the A-Z slots, and had presumed that I would just put one-component copies of them into the a-z slots. </p>
    <p>Would it be a mistake to simply double-encode, say, the /A/ glyph with the Unicodes for /A/ and /a/ instead of making lowercase copies? That way I wouldn't have to work all the lowercase permutations into all the scripting, kerning classes, etc.</p>
