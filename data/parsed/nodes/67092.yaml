      <p><em>I was told this would be a bad thing, but I can't quite remember why. Something to do with glyph names remaining relevant when the font is used in some applications.</em></p>
      <p>The rationale against double-encoding seems to involve embedded fonts potentially losing their Unicode information, in which case the glyph names could be used for proper glyph-to-character translation ... there's a more extended discussion in the FontLab manual under "Advanced Naming and Encoding" (p145).</p>
      <p>Working with the copied glyphs isn't as big of an inconvenience if you're using classes for scripting as well as kerning (pretty much like Nick's suggestion #1 above), and using components for the copies. Rather than double-encoding the "A", make a named "a" glyph that's a component of "A" and create appropriate classes for every pair or series of similar glyphs. Then in your code, just refer to the classes.</p>
