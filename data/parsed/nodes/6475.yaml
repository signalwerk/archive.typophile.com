    html: <p>Yay, I'm glad you like them Tiffany <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I would love to put a page together to show but I haven't bought them yet...  <br> <br>Paul, I wasn't exactly sure what style of ornaments I was looking for... though I think I might have found something. (I liked the PsyOps ones too by the way.) I bought Fournier Ornaments last night, and even though I am satisfied with it, I still think I need another dingbat font. And lo and behold, I come across <a href="http://www.p22.com/products/victorian.html">P22's Victorian Ornaments</a>, which just might be what I need, and inexpensive too. Their <a href="http://www.p22.com/products/woodtypeset.html">Woodtype Extras </a>are pretty good too, and I'm not sure which would go with Wade better. What do you guys think? The Victorian Gothic that comes with it might prove handy as well. <br> <br>The only thing I was hoping for that neither seem to have is a lot of square tiles for making tiled backgrounds, a la <a href="http://dingbatcave.com/woodblocks1.shtml">Dingbatcave Woodblocks</a>. But I could probably just make a few simple tiles in Illustrator if I really needed some. <br> <br>I guess the only thing holding me back is that there seems to be, esp. if I get those P22 ornaments, a tension between the Victorian display and dingbat faces on the one hand, and the rationalist 18th century copy faces. <br> <br>PS - that link didn't give me any slab-serif inspiration Paul, but the lamp/sculpture piece was nice <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
