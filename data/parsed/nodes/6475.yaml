    html: <p>Whoa! How come I only came across a quarter of those? It is starting to sink in that there are tons of foundries that don't have their stuff on myfonts.com (not that that's the ONLY place I've been looking). That's a really great thread.  <br> <br>I'm beginning to like the Victorian vibe though, and the layering options on Wade is a big part of that. So I think I will go with that. I'm still going to look around for something better than Slanted Antique Roman -- it's about 90% what I'm looking for, but something is a little off, I don't know what. Though I'm a bit discouraged with font-hunting -- it seems like half of the gems are hidden away in independent foundries that I don't even know exist until someone brings them up here... <br> <br>If I can afford it I will probably get one of those slab-serifs on that thread, or Deadwood, for sidebars, etc., much how sans-serifs are often used.</p>
