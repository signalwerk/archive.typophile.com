  date_raw: 1 Sep 2004 — 7:59am
  votes: null
  html: "<p>I could really use a second opinion (myself being the first) on these faces I'm about to get for a zine I'm starting soon (see <a href=\"http://www.typophile.com/forums/messages/4100/42111.html?1093379073\">here</a>). I've spent untold hours over the past month tracking these down (I've probably seen three quarters of the myfonts catalog), but I'm still not 100% sure there isn't something closer to what I'm looking for out there. Some more experienced eyes would be very helpful at this point before I make a final decision. <br> <br>Specifically, I'm wondering three things: <br>1. Are there any faces that are similar to the two display faces? A more boisterous version of the egyptian perhaps?  <br>2. Do the two display faces together seem anachronistic? Ditto for the text and display together. I would use the roman display with the Walbaum roman and the italic display with Fournier italic, for the most part. <br>3. And can anyone recommend a ornament/dingbat font do go with this combination? My eyes glazed over after two hours in the Dingbatcave. I will probably get Fournier ornaments to go with Fournier, but it doesn't extensive enough. <br> <br>Display: <a href=\"http://www.myfonts.com/fonts/aboutype/wade-vernacular/\">Wade Vernacular</a> (Aboutype) &amp; <a href=\"http://www.myfonts.com/fonts/agfa/slanted-antique-roman/\">Slanted Antique Roman</a> (MT). <br> <br><img src=\"http://www.typophile.com/forums/messages/29/47985.png\" alt=\"wade\">  <br><img src=\"http://www.typophile.com/forums/messages/29/47986.png\" alt=\"wade2\"> <br><img src=\"http://www.typophile.com/forums/messages/29/47987.png\" alt=\"slanted\"> <br>  <br>Text: <a href=\"http://www.myfonts.com/fonts/linotype/fournier-mt/\">Fournier *italic*</a> (LT) &amp; <a href=\"http://www.myfonts.com/fonts/storm/walbaum-text/\">Walbaum Text roman</a> (Storm). <br> <br>Also thinking about using a Edward Gorey-esque script font, <a href=\"http://www.myfonts.com/fonts/scriptorium/queensland/\">Queensland</a>, in a limited way.</p>"
