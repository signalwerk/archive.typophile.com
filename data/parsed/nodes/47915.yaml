    html: |-
      <p>I’m pretty sure Adobe’s glyph complement PDFs are not locked to prevent copy/paste. You can go to the Adobe web store, find the specific family, and there’s a downloadable PDF right there.</p>
      <p>For example, <a href="http://store1.adobe.com/type/browser/pdfs/1737.pdf" title="http://store1.adobe.com/type/browser/pdfs/1737.pdf">http://store1.adobe.com/type/browser/pdfs/1737.pdf</a></p>
      <p>I’ve been working on rationalizing and extending Adobe’s various extended Latin character sets, and will be publishing some “final draft” specs later this month on my  blog, for review and comment.</p>
      <p>In Adobe’s nomenclature, a western font with “Pro” in the name does have a certain minimum language coverage. See: <a href="http://www.adobe.com/type/browser/info/charsets.html" title="http://www.adobe.com/type/browser/info/charsets.html">http://www.adobe.com/type/browser/info/charsets.html</a></p>
      <p>Cheers,</p>
      <p>T</p>
