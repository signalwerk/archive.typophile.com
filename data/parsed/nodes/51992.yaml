    votes: null
    html: |-
      <p>Hi bekir. Both faces look well crafted and well thought out. The typographic design is good too. The first one (do they have names yet?) is too closely spaced for text setting. The second one also requires some tracking out to make it more readable in a text setting. That is not to say you should increase all your side bearings. If you are using Fontlab you can create a simple internal tracking program using positioning commands which users can switch on and off as an OpenType feature.</p>
      <p>Both fonts have a basic challenge ahead if you intend to release them for retail sale. Lots and lots of competitors. The first one in particular, a lot of that sort of thing has been done over the past decade. The second face is quite similar to a number of existing types.</p>
      <p><em>In the second one, C looks too condensed.</em></p>
      <p>It is a bit on the narrow side as far as the width goes, but this anomaly is not extreme enuff to be of concern. The C is not terribly distracting and does not compromize the color. Making it wider will affect color more, so I recommend leaving it as it is.</p>
      <p><em>Am curious to see j, k, w, x, y, z in both.</em></p>
      <p>The choice of Geeking Latin text is one of the silliest things type designers &amp; typographers do. No offense to those who use it, but really, why use Latin text when it leaves out so many letters of the Latin alphabets we use, and gives no comprehensible clues about how your font performs with regard to linguistics?</p>
      <p>You're better off setting samples in languages currently in use such as English or Turkish. The traditional typo-cred inferred by retro Latin samples is one thing, and practical useful testing methods are something else.</p>
      <p>j a m e s</p>
