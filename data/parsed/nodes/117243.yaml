      <p>Clevercrows, could you give a little info on how and where this will be used? And is this on a flat or rounded surface?</p>
      <p>To my eyes, the lettering seems to be too much. You've got the fancy letters, the fill in the letters, the shadow which maybe has its own fill, and the varying of the shadow for the 3-dimensional look. To me, it just seems distracting. I would like to see this without the shadow at all. The fill of the letters looks nice (very equine) but it does give a light horizontal streak through the letters about mid-height. Is this intended? The horse's head seems like an after thought. It looks kind of bolted on rather than an integral part. But it might be okay, depending on the use. Those are my thoughts.</p>
