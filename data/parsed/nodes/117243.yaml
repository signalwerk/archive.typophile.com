      <p>Clevercrows, it sounds like you are on the right track. Stay with your ideas. I also like (what I think was) your original idea.</p>
      <p>Ask your customer in what format she needs the logo. For print, it might be two forms: a color graphic such as a PNG file at 300 dots per inch and a black and white graphic at 3oo dots per inch. Or it might be part of Corel or Microsoft Word template for writing letters. For internet use it might be a JPG file at a lesser dots per inch. Maybe Corel permits saving a file as, or exporting as, a graphic format.</p>
      <p>If you are looking for a free graphics program, I would recommend Paint.net. There is a learning curve, but it's do-able.<br>
      <a href="http://www.getpaint.net/" title="http://www.getpaint.net/">http://www.getpaint.net/</a></p>
