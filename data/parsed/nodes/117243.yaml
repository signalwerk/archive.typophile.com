    html: |-
      <p>&gt; The video suggested to never use any type of 3D text </p>
      <p>In general that's good advice. There are occasions when 3D makes sense, but since this is your first logo I'd keep it simple.</p>
      <p>&gt; or coloring</p>
      <p>This is an area that's changing. In the past most everything got printed at a print shop, so more colors meant more expense, and a color logo would look bad in a Xerox or fax. These days many companies do most of their promotional work over the web or in emails, where color is free, and most companies email instead of sending faxes. But Xeroxing might still a factor if your client prepares promotional materials that. </p>
      <p>You definitely want a good black-and-white version of the logo to use when needed, but if your client is using the web then color may not be as big an issue these days.</p>
