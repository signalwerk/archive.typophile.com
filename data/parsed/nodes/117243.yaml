      <p>Agree with J. Tillman's comments. We really need to know more about the company before we can judge the logo properly, but the 3D effect is distracting, especially since it makes the letters look liked they are wrapped around some invisible object. And the horse head symbol is too small. I would either make the head larger to be the dominant element, perhaps with the type below it, or else draw some lines so the type and symbol are all enclosed within a common shape (think of how the old MGM logo handled the lion head). </p>
      <p>But it's a start; keep working on it.</p>
