    html: |-
      <p>I've never been a fan of the "Word Art" function in MS Word and similar applications; the results invariably look like something one might have used for the title banner of a personal homepage 20 years ago when the internet was still young. In particular, when the results are pixely, hard to read, bent and distorted, it does more harm than good.</p>
      <p>The font and the horsehead illustration don't strike me as particularly good choices either. The font feels old-fashioned to me (I mistook it for Zapf Chancery at first sight), and it suffers from the horizontal compression. You wouldn't squash a photograph to half its width, would you? The same thing happens with letters. If you absolutely need it that narrow, use a narrow font. As for the horse, I'm getting a meek and hapless vibe from it. The cut also reminds me of a wall-mounted trophy a bit.</p>
      <p>Don't be disheartened, though; nobody gets it right in the first try. Keep working on it! I suggest trying out a slab serif, and maybe experimenting with a more symbolic graphic.</p>
