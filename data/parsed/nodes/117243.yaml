    html: |-
      <p>Thank you J. Tillman and JamesM for your response to my post and to the great advice!</p>
      <p>This is the very first logo I have ever tried to create. It sure is fun trying!</p>
      <p>This is a horse trail ride, riding lesson, and horse rescue barn (soon to be 501c3 non profit). This is where I go for unguided horseback riding. The girl that runs this rescue mentioned that they were looking for a new fresh logo, so I am just messing around to see if I can come up with anything. Like I said, I have no idea what I am doing.</p>
      <p>I used Corel WordPerfect's Textart (which uses a textbox) and this was my first try. After I saved it, I immediately went back to change the part I didn't care for at all, which is all of that gold shadow/fill, which is way too much! I wasn't too sure about the arch/bend to the lettering, but I wanted to first see what the result would be once I cleaned it up. </p>
      <p>Well, it turns out that once I open up the Textart textbox, it changes completely (the font, color, fill). The only thing that stays is the spelling of the two words. I have tried everything, but I cannot edit it at all! So I put it aside and gave the project some thought.</p>
      <p>First, I did a google image search to see what styles of horse/equine logos that exist. I noticed that the majority seem to be of some type of black and white outline of a horse head or an outline of a horse running. I wanted something a little different and unique. I noticed that in a lot of the logos I found, the name seems to get lost and does not stand out at first glance. I thought it makes more sense to have the name as the primary focus and have the image a secondary enhancement. Then I realized that the letter placement of the two words was going to be a bit of a challenge with my lack of experience (as far as selecting a font).</p>
      <p>A lot of fonts look nice until you put a "capital E" next to a "qu", then it suddenly looks strange. A lot of fonts have funky looking "q"s and capital "E"s, in my opinion. I personally love the font in the logo, just not all of the extra. You are right, way too much going on. If only I could edit it! There wasn't much choice as far as the color and pattern of the lettering, but I thought it was okay, and I think that the horse picture in a weird matches as far as the color scheme.</p>
      <p>THEN, I watched a couple of videos on general guidelines and advice on logos and types of fonts, etc....and realized that I had it all wrong! The video suggested to never use any type of 3D text or coloring, because you need to consider the different possibilities that people could do with it. If someone happened to print it, it could very likely print out all messed up and unreadable. Especially if they did not print it in color. It pointed out to always use a font type that is very readable and printable in black and white and in greyscale. Makes a lot of sense! I did it all completely opposite.</p>
      <p>I have a few other ideas, but for some reason I keep going back to my original first rough draft. I like it for some reason. I like it because to me it is not perfect by all means, but it stands out, is unique and original, and it is different than all of the other equine type of logos that I have seen. I know it is very homemade looking, but I kind of think its flaws are what gives it character.</p>
      <p>I know all that sounds pretty strange. I thought I would post it and get your opinions and go from there. At least I am having a fun trying. I am not the type of person that is creative at anything.</p>
      <p>Thanks again, I will keep on trying!</p>
