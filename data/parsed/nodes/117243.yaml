    html: <p>Hi. The cluttered lettering has an interesting texture that goes well with the horse head, and I can see why you like it - it has the crafty hands-on look of worked leather.  Legibility will become a problem in some situations - for example if it is printed really small on a  letterhead, or on a sign seen from the distance.  Make a black and white version without color and if textures create a messy washed-out effect erase some portions, for example the "edge" of the lettering" or else make some parts solid black.   Then colorize that in two or three colors to see how things look. Use layers to add background color or outline.  In any case the horse should be much larger compared to the lettering. If you can make the lettering on a semicircular line, the lower part of a circle, the horse can be at the center. Try that. If you put lettering and horse within an outline shape, say a semicircle, everything will look nice and compact. Good luck and have fun!</p>
