    <p>Hey all,</p>
    <p>can anybody say what font we see here?</p>
    <p>it’s the titling sequence of the movie "blow up" by michelangelo antonioni (1966).</p>
    <p>my first thought was helvetica compressed but it doesn’t really fit.</p>
    <p>any ideas?</p>
    <p>thanks in advance!</p>
