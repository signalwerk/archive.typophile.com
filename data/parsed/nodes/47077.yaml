      <p>I like the direction of Dave Curry a.k.a. vintagesingman. It has somehow contemporary looks of Olympic logos. Which may not be the best but it's still very good for organisations (probably non profit).</p>
      <p>Yes it's very clear that KC doesn't have any real life experience with logos. I'm always amazed how complicated people like this try to make their logos. We all live in a world surrounded by logos. We are annoyed by busy snail mail marketing spam in our mail boxes. They all reflect this kind of design. Any yet they still tend to overdo this.</p>
