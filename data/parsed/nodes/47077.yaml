    html: |-
      <p>Comic Sans...bad idea. I am pretty sure he was joking. God I hope so. ha. Anywho...yes you picked the right forum, this is a place filled with people that love to design especially when it has type in it :D</p>
      <p>So my suggestions to your logo. I actually think the symbol at the top (B) has some promise. I get it, it's a kid raising his hand and there's what looks like a desk or a japanese style character. Works ok enough. Develop that first. Keep the type simple. It is quite long like you said and if your goal is to have people come to your site, then write is as a ulr. "professionalenglishteachers.com" or "ProfessionalEnglishTeachers.com" Something along those lines. The that way you break your logo into 2 elements, a symbol and the type. it will make it much easier to deal with and less jumbled. </p>
      <p>The typeface you choose always depends on your audience. But pick one that you think makes sense right now (keeping it simple and easy to read) and try what I said above. Then come back here and post it. If you want a good logo...you're going to have to redesign and submit a lot to get some advice considering you're not a designer. and obvious...sorry. But it's not a big deal as long as you're willing to put in some time! You'll learn a lot, I promise :)</p>
      <p>Things to think about:</p>
      <p>Contrast. If all of the elements of your logo are the same size...it's boring. make one or the other much bigger or much darker.<br>
      Color. Design in black and white first. Think about color afterwards. You need a strong logo before you start playing with color. (but do keep possible color schemes in mind)</p>
      <p>Cheers</p>
