      <p>Hmm, I think out of all these...I like a2 best. The only reason being that it has depth. But I don't think I'm digging the silhouettes. It's not unique, I see those silhouettes all over stock photo sites. (Not saying that's where your designer got them, but just saying it's not one of a kind) Also, the silhouettes seem very unprofessional because of their body language, they are all hunched over, they look more like teenagers dressed in suits. I think (If you haven't already) suggest that your "designer" try some examples with your symbol. You had something there...I think it was just a little hard for you to execute into a logo.</p>
      <p>Also, the text used a4, in my opinion, doesn't work. Your text is so long and the condensed text is hard to read and especially will be when it's smaller.</p>
      <p>Anywho, I do think you are right about the complexity. They are too complex. I mean, my personal design preference is simplicity. You need something very simplistic that people can remember on its own. (That's what I was getting at with the problem of the silhouettes) I mean think about the famous logos...McDonalds...FedEx...Deutsche Bank. (The latter being the epitome of simplistic logo)</p>
      <p>courtney</p>
