      <p>You have two problems you need to work on.</p>
      <p>1. An icon. Come up with an icon that you like. PET or no PET, but for heavens sake, don't try to turn your text into an icon by melting that jumble together.</p>
      <p>2. You have a lot of text! My advice is to look at these two problems separate but figure a way to bring them together. Readability is very important, if you add the .com after teachers it may come off as teachers.com</p>
      <p>Paper and pencil is a great way to work things out.<br>
      Good luck.</p>
