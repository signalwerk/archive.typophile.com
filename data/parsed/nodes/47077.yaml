      <p>KC -</p>
      <p>Good for you for coming to a place to learn.  These forums have helped me a lot in my development in design skills.  I think I've come some way since my first post about a year and a half ago, but I have a long way to go.</p>
      <p>Having said that, I think that the advice has been given many times for you to scrap this design, sit down with a pencil and paper, and draw a logo.  I haven't seen you do that.  Instead, you have posted numerous iterations of the same design you first posted.</p>
      <p>I think it's safe to say that your concept is broken.  It consistently receives feedback that points out fatal flaws in both design and execution.  Unless you're willing to take the advice of people who have a lot more experience than you, then I can't see that you're engaging in this process in a way that could produce a good result.</p>
      <p>So here is, once again, a bit of advice that has gone a long way for me in my design development:</p>
      <p>Sit down with pencil and paper and draw some black and white logos.  Then come back and let us see what you've done.</p>
      <p>--<br>
      Nick Hladek</p>
