      <p>"Search youtube for logo design showcase or portfolio. Also go on logo websites or professional designers’ websites who specialize in logo work."</p>
      <p>j_polo9,<br>
      I have looked a so many logos. They are almost always simple. I look at them in Black and White and see this. Most are just text. I have looked at lots of Web 2.0 stuff since cslem1 mentioned it. I have made a few but they seem unsuitable on this thread. I think I should avoid color.</p>
      <p>I have not just 4 or 5 or 6 letters but more of a paragraph for a name, 30 letters. But as an internet brand, the name is what people need to remember and a name like ProET.com is for me not as easy to remember and is already owned. In English PEteachers means something other than English, ProET ET means the movie, PET means pet. Outside of creating a non related name for my product I have few options to make it short, relevant, and memorable.</p>
      <p>The use of P E T as a person in front of a podium I thought was clever. Not that "PET" has much value for me alone. The initials are secondary to mark but the use of the letters and their relevance to the name makes it for me an interesting, memorable and relevant mark. My last post of the negative space PET is less about the person and podium and more about drawing the reader(customers) in to discover what it is, and then remember it. I will never hire famous people to wear my mark and sell my product, it needs to draw the person in on it’s own. I know I will hire a designer to do the final work but I want to develop a few of my own ideas before I hand it all over. This project is not about me and a huge ego but it would be cool if I had a part in the creative process outside of money.</p>
