      <p>trying a bit too hard. You don't want to change the size of the font too much. Makes the reader work too hard, which also makes it that much harder to read. I don't think you need to emphasize English too much. Especially in the middle of a "sentence". It again makes the reader work too hard to read it, feels very unprofessional.</p>
      <p>Try seeing how you can fit together the words, make it one unit rather than just throwing it together.</p>
