      <p>Sorry to say, but it's quite obvious you don't have any design experience.</p>
      <p>These are all very busy, but I think there's some hope in the mark for logo 'B'. Right now because of the even stroke width and rounded ends, it looks almost Korean to me. I'd make it look more organic like real brush strokes. You can go with the blue and red for a colour version, but I'd lose the outlines (and especially the shadow) of 'C' and 'D'.</p>
      <p>I'd choose typefaces that contrast a bit more, maybe a rigid sans and a brush script, or else just use a single typeface. Look at how the letters connect in "English" - you'll have to modify the 'En', 'ng', and 'li' connections so they look natural.</p>
      <p>Pay attention to how the type and the mark work with each other. Right now, there's no alignment whatsoever.</p>
      <p>The "your way..." slogan doesn't really make sense to me.</p>
      <p> - Lex</p>
