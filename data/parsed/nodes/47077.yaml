      <p>I think either your F or G logo marks are a start. Try putting that mark centered over your #12 type treatment and see what it looks like. I think that would earn you a 2/10, granted there is still a long way to go.</p>
      <p>I would consider exploring a lot more ideas on your logo mark, your site is not easily referred to as PET, most users will probably pronounce the full name. Also why not pick a shorter domain name? Or at least a domain like ProET.com or something.</p>
      <p>Search youtube for logo design showcase or portfolio. Also go on logo websites or professional designers' websites who specialize in logo work.</p>
      <p>I really like:<br>
      Louise Fili: <a href="http://www.louisefili.com/logos/logos.html" title="http://www.louisefili.com/logos/logos.html">http://www.louisefili.com/logos/logos.html</a><br>
