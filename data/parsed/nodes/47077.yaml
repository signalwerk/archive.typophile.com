      <p>What I mean by trying to make the words fit together is: study the shapes of the letters, it's all about flow. I can't show you without just doing it, but just trying googling (images) "logos". The best way to learn is to look at the pro's and see what you can pick up from them (don't copy, obviously).</p>
      <p>Also, an important question- Is this logo only going on the web?? Because if so, also google (images) "Web 2.0 logos". I think you might get a lot of ideas from there. Of course you want to keep in mind professional, because going the web 2.0 way can be easy to make your logo look too cartoony.</p>
