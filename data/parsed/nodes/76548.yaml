    html: |-
      <p>I’ve set my account to Italy’s time zone, but still see 5.15am.</p>
      <p>Also, about comment timestamps, loosely related, it would be nice to have a simple way to refer to single comments on a thread <em>especially</em> if the timezone feature will work eventually* (what if I refer to the comment posted on 5.15am, but others see it with a different time?).</p>
      <p>* That is, if it will work in the way I think it should: giving each user a way to see threads timestamped according their timezone. Timestamping comments with the timezone of the poster would be crazy.</p>
