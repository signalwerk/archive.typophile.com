  html: <p>A small bug seems to exist in the 'timezone' feature of 'My Account'. Although I've set my account to British time, no comment anywhere shows the correct time for me. I'm writing this at 13:15 on Sunday 21 November but the timestamp shown here is 5.15am.</p>
