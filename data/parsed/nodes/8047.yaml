    html: <p>This is even more likely just by virtue of the fact that it's associated with an NFL team (Tampa Bay Buccaneers). All major professional North American leagues (NFL, MLB, NBA, NHL) are very heavily marketing oriented, and I think have systematically customized nearly everything that can be used as part of an 'identity system', except in the cases where the logos are older than digital already. <br> <br>If you want it, they want you to buy it from them.</p>
