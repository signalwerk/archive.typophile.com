  html: <p>Inspite of the fact that the e's and r's are essentially itentical to one another (usually a clue that it's a font), I don't think this is a font. Given the shapes of the other letters and the way they connect, this appears to be custom lettering (with some cut-'n'-paste help from a graphics program).</p>
