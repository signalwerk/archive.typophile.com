  html: |-
    <p>Hello Typophiles</p>
    <p>Attached is the results of the first serious attempt I've taken to design a font, I'm 20 and a student studying Graphic Design, previously I have only really edited existing faces, (please be gentle, this is my first time at the rodeo).</p>
    <p>I've tried to make it kooky and memorable, while still having a consistent approach. This is a headline display font, hence how little stroke variation there is, and I think it can only go as small as 24pt before it gets too weird.</p>
    <p>I was inspired by a pair of unique street signs in my home town of Wellington, but through further development I found myself looking at the type used in the Tintin magazines of my childhood. I can also definitively say Colophone's incredible Raisonne and Grilli Type's entire catalogue were guiding hands as to the boundaries between feature and distraction that I'm trying to balance.</p>
    <p>For some strange reason, I started with a bold weight. Will eventually move this down to Normal &amp; Light.</p>
    <p>Please let me know what you think, dying to hear.</p>
    <p>Seb</p>
