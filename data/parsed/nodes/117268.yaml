      <p>&gt; each artist doing a piece of art</p>
      <p>Do you know what type of artwork it'll be? Line drawings? Water colors? Oil paintings? Photographs? </p>
      <p>You'll want to pick a method that reproduces the art accurately, or at least inform the artists before they make the artwork about the printing method. Otherwise you'll get a lot of angry artists.</p>
