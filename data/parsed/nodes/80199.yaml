    <p>Hello guys!</p>
    <p>Good news!</p>
    <p>I have new Typography website - Check it out on: <a href="http://www.moshik.net" title="www.moshik.net">www.moshik.net</a></p>
    <p>On the website you can find my new Experimental Typography project - Playful Ampersand and many more Typography projects. Beside that you can download cool Typography wallpapers for your computer screen or for your iPad for now..<br>
    and of course you can order cool Typography posters and T-shirts :)</p>
    <p>Please feel free to leave a comment and share it with your friends.</p>
    <p>Cheers,</p>
    <p>Moshik Nadav</p>
    <p>Type &amp; Typography based designer</p>
