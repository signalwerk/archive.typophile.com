      <p>"Vintage" is not very specific as to how old the poster is. But the style of the poster suggests that the lettering is part of the artwork.<br>
      If you want a font that is close to the lettering I recommend  <a href="//www.myfonts.com/fonts/hvdfonts/pluto-sans/" rel="nofollow">Pluto Sans</a>. You will have to add the outlining effect.<br>
      Don</p>
