    <p>Hello, I found this vintage poster online, and I really like the font at the bottom of the poster. I tried a couple different methods to try and see if there was a font for it, but didn't find anything. I figured maybe someone has seen the font before or maybe something similar?</p>
    <p>The link to the actual poster is below. I am also attaching a rough tracing of the font as a jpeg in case that helps.</p>
    <p>Thanks in advance!</p>
    <p><a class="freelinking external" href="http://www.enjoyart.com/library/travel_tourism/japanvintagetravelposters/large/Japan.jpg" rel="nofollow">http://www.enjoyart.com/library/travel_tourism/japanvintagetravelposters/large/Japan.jpg</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FontTest-02_4026.jpg"></div><p></p>
