    <p>We burned our bras and the traditions of polite society in the 1960s.  Perhaps the post-Victorian, war-torn, Democracy-mongering notions of social form became outmoded, but, with the ruin of rules for civil engagement, how have three generations of Americans learned to get along.</p>
    <p>By looking at examples of communication tools for written correspondence we can perhaps get a glimpse at what we have learned about polite society and what we have lost.</p>
    <p>I will be presenting this engaging topic on Sunday, July 20 during the afternoon session of “Type in 20”.</p>
    <p>I will talk about the usefulness of the hand written note and about the outstanding successs rate for sending a real live letter through the mail to a new friend or potential client.  All attendees will walk away with instruction in and a copy of “How to Write a Personal Letter”.</p>
    <p><a href="https://web.archive.org/web/20080821163340/http://www.nancysharoncollinsstationer.com/" title="www.nancysharoncollinsstationer.com">www.nancysharoncollinsstationer.com</a></p>
    <p>“I have been engaged with the process of commercial engraving for the purpose of making social stationery since 1977. Since then I have watched the rich polish of polite society decline to a harsh commercial glare.”—Nancy Sharon Collins Artist’s Statement, “History in Small Places” solo exhibition of large format archival prints, 2008, Abingdon 12, New York City and TypeCon 2008, Buffalo, New York and Hill Memorial Library, Special Collections, Louisiana State University, Baton Rouge in the Spring.</p>
    <p></p><div class="imageWrap"><img src="/web/20080821163340im_/http://www.typophile.com/files/50-57_3867.jpg"></div><p></p>
