    html: <p>You are right about the getting a live letter opposed to an email or an im. I have not received a real letter since the one that Leah sent me for class. It was actually exciting to the mail box and have somebody taken time out of their day to write me. It makes you feel special and that someone cares alot. I feel like polite society has pretty much disappeared since the introduction to technology. I feel that actual physical interaction is not that important to people any more which is sad.</p>
