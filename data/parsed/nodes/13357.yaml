      <p>Well, any medium where focus is not always perfect ends up rounding  corners. I can't think of a way besides over-sharpening to counteract that. A lot of fonts, even original digital ones, have thorns (although usually very mild ones). Probably because human vision itself has imperfect focus.</p>
      <p>hhp</p>
