  html: |-
    <p>I'm trying to find the font Kodak uses for it's keykodes on film negative. You know, the little numbers and letters that run along regular 35mm film negatives. Unfortunately I haven't been able to google up a detailed picture, these one are the best I can find.<br>
    It doesn't have to be the exact font, any similar sans serif will do.</p>
    <p><a href="http://home.germany.net/101-81660/keycode.jpg" title="http://home.germany.net/101-81660/keycode.jpg">http://home.germany.net/101-81660/keycode.jpg</a></p>
    <p><a href="http://home.germany.net/101-81660/randnum.jpg" title="http://home.germany.net/101-81660/randnum.jpg">http://home.germany.net/101-81660/randnum.jpg</a></p>
