    html: <p>The price would depend on the complexity of your emboss. Call your local dependable printer for a quote. <br> <br>As far as the process goes, your film will be out put to film, if it is not direct to plate that is, in the appropriate color separations plus an additional separation for your emboss. If you are doing a two color job think of the emboss as a third plate, or color. <br> <br>Once this extra piece of film is output your printer will either make the emboss themselves or will send it to some magical place where they make such things.  <br> <br>Usually it is made of some sort of metal though I have seen some polymer ones. <br> <br>After you file is printed it will be pressed against this piece of metal and there you have an embossed piece. <br> <br>Multilevel embosses cost more. <br> <br>Get me out of this nut shell. <br> <br>-smc</p>
