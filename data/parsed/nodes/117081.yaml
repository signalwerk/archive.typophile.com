    <p>I am taking a poll among the cognoscenti here on the proper use of the term "justify" in typography.</p>
    <p>Has it become acceptable to use such terms as "justified left," or "left justified"? Does anyone else wince at this? </p>
    <p>I was taught many years ago that type can be set centered, justified, flush left or flush right. Those were the only choices. There was no such thing as "justified left" or "justified right." Sometimes we would add "rag right," or "ragged right" to the "flush" direction, or abbreviate "FL/RR," for example. Perhaps the "rag" language has dwindled. Specifying the rag was extra clarification. But in my mind, one should only use "justified" in one way, when both sides of a column are flush. Am I right?</p>
    <p>Maybe some younger members can tell us what schools are teaching these days. Do I just have to take a Xanax and accept these mixed terms, or am I justified (heheh) in my indignation on this matter?</p>
