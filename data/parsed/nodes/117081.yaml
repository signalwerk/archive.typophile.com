    html: "<p>There is one context in which I frequently come across terms such as ‘left justified’ or ‘right justified’: These appear as button labels in an obscure little lay-out software called—wait for it!—InDesign. ‘Left justify’, for instance, refers to a justified setting in which the last line is left-aligned (or right-aligned for ‘right justify’ or centred for ‘centre justify’). In other words: These terms do have a meaning, and a useful one to boot. All the more, I would try to avoid calling flush left, ragged right settings ‘left justified’ (or the other way around, ‘justified left’). InDesign, by the way, calls these settings ‘align left’ (and ‘align right’ and ‘align centre’). A setting in which even the last line is spaced out to full column width is called ‘full justify’.</p>"
    html_clean: "<p>There is one context in which I frequently come across terms such as ‘left justified’ or ‘right justified’: These appear as button labels in an obscure little lay-out software called—wait for it!—InDesign. ‘Left justify’, for instance, refers to a justified setting in which the last line is left-aligned (or right-aligned for ‘right justify’ or centred for ‘centre justify’). In other words: These terms do have a meaning, and a useful one to boot. All the more, I would try to avoid calling flush left, ragged right settings ‘left justified’ (or the other way around, ‘justified left’). InDesign, by the way, calls these settings ‘align left’ (and ‘align right’ and ‘align centre’). A setting in which even the last line is spaced out to full column width is called ‘full justify’.</p>"
