    html: |-
      <p>I have done it a lot, its ok. You can also place these symbols in a range of emty glyph cells so they will look better in adobes glyph palette.</p>
      <p>orn.001 emty<br>
      orn.002 sign1<br>
      orn.003 emty<br>
      orn.004 sign2</p>
      <p>An other thing could be to cut the signs.</p>
      <p>orn.001 sign1a<br>
      orn.002 sign1b<br>
      orn.003 sign2a<br>
      orn.004 sign2b</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
