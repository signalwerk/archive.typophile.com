    <div class="info">Submitted by <a href="/web/20080516072117/http://www.typophile.com/user/108" title="View user profile.">Miss Tiffany</a> : 25.Apr.2008 12.41pm </div>
      <p>Veronika Burian, partner at TypeTogether: “We are proud to announce that TypeTogether (<a href="https://web.archive.org/web/20080516072117/http://www.type-together.com/" title="www.type-together.com">www.type-together.com</a>) is opening its exhibition in Rosario, Argentina, on May 21st, 2008. The exhibition presents some of the best known typefaces that TypeTogether has released and a few font families that are still under development. It will also focus on the design process for text typefaces, from conception to reader. The exhibition features typefaces designed by: Veronika Burian, José Scaglione, Eduardo Berliner, Bart Blubaugh, David Brezina, Pilar Cano and Nicolien van der Keur. </p>
    <p></p><div class="imageWrap"><img src="/web/20080516072117im_/http://www.typophile.com/files/typetogether_3978.gif"></div><p></p>
    <p>For more information about other upcoming exhibits, lectures and workshops as well as access to a freely distributed licence for one of our fonts (Cora) is available in our April newsletter” (<a href="https://web.archive.org/web/20080516072117/http://www.type-together.com/mailing/2008-04.html" title="http://www.type-together.com/mailing/2008-04.html">http://www.type-together.com/mailing/2008-04.html</a>).</p>
