    <p>I am interested in doing a font audit at the small publishing company I work for, and am looking for tools. I’ve seen the Fontwise site, and tried their little standalone demo, but wasn’t overly impressed and am seeking other options. Is anyone aware of alternative network font audit tools? I could just write some scripts, but I bet there are good tools out there already. Please share your experiences and recommendations!</p>
    <p>Thanks.</p>
