    <p>I just wanted to let everyone know about the 3rd Annual <strong>Los Angeles Printers Fair</strong> which is coming up on Saturday <strong>October 1st</strong> 9am-5pm </p>
    <p>The Fair is located at <a href="/wiki/href%3D%22http%3A/%252Fmaps.google.com/maps%3Fq%3D315%2Bw%2BTorrance%2BBlvd%2C%2BCarson%2C%2BCA%2B90745%2526hl%3Den%2526sll%3D33.842126%2C-118.279961%2526sspn%3D0.016735%2C0.025985%2526vpsrc%3D0%2526gl%3Dus%2526t%3Dm%2526z%3D17%20" class="freelinking" rel="nofollow"> 315 Torrance Blvd, Carson, CA 90745</a> and admission is $5</p>
    <p>The fair supports the non-profit International Printing Museum and its educational mission and is suitable for all ages. Students, Educators, families, enthusiasts, collectors, typophiles, bibliophiles, graphic designers, artists and professionals will enjoy the varied demonstrations and array of vendors. Children are welcome but need to be accompanied by an adult at all times. Even if you’ve been to the Museum before, you’ll see new vendors and materials at the Fair.</p>
    <p><strong>ACTIVITIES RUNNING THROUGHOUT THE DAY INCLUDE:</strong><br>
    • Letterpress “Swap Meet:”<br>
    • General Gallery Tours<br>
    • “The 40’s Shop”<br>
    • Additional demonstrations include relief printmaking, silk-screening and papermaking.<br>
    • Purchase beautiful letterpress-printed pieces, artist books, gorgeous handmade and commercial paper/envelopes and more from one of our vendors.<br>
    • Screen-print a tee-shirt with the Night Shift crew for $15.<br>
    • Live Music</p>
    <p>We are also still looking for volunteers either Thursday/Friday to finish setting up or on Saturday to help with the fair itself.  If you are interested in volunteering or have additional questions feel free to contact me or the museum directly at fair [at] printmuseum [dot] com<br>
    (volunteering for as little as 2 hours will get you into the fair for free)</p>
    <p>Thanks a lot and I hope to see some of you there!</p>
    <p><a href="/wiki/www.printmuseum.org/fair" class="freelinking" rel="nofollow">www.printmuseum.org/fair</a><br>
    <a href="/wiki/www.printfair.org" class="freelinking" rel="nofollow">www.printfair.org</a><br>
    <a href="/wiki/https%3A/%252Fwww.facebook.com/event.php%3Feid%3D111445412233526%2526ref%3Dts" class="freelinking" rel="nofollow">https://www.facebook.com/event.php?eid=111445412233526&amp;ref=ts</a><br>
    <a href="/wiki/https%3A/%252Ftwitter.com/%2523%21/laprintersfair" class="freelinking" rel="nofollow">https://twitter.com/#!/laprintersfair</a></p>
    <p><img src="http://www.davidtucker.me/wp-content/uploads/2011/09/NS_Fair_Poster_R1.jpg"></p>
