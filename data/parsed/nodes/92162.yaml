  html: <p>I've known there's a couple of sites who can make sheets of dry transfer type from a layout you send to them, with the same quality as the old letraset sheets, plus they make it in the pantone color you choose. It's great for such a lot of things as making comps on the real paper/material you're going to use, texts directly applied on walls/panels, etc. The drawback is not only that it's not cheap, but moreover the large amount of time they need to prepare and deliver it to you. Does anyone know if there's any chance for a do-it-yourself? I suppose it must be some kind of photographic process, but i dunno if it's necessary any complex equipment one can't afford all by himself...</p>
