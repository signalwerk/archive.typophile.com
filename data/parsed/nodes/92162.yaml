    html: |-
      <p>3M used to manufacture  photosensitive do-it-yourself dry transfer sheets in black and white. You prepared a negative, exposed the sheet to UV light, then used a chemical solution to wash off the unexposed areas. Upside: instant dry-transfer lettering; downside: you had to buy a whole box and at least a quart (IIRC) of developed.</p>
      <p>Of course, this was Once Upon a Time…</p>
