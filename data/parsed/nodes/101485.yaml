    <p>Filed under Logos although this is UI/UX because the final output must visually represent an exact statement.</p>
    <p>We are working on a mobile app for Android.<br>
     The aim is to inspire the user to discover and express himself through a visual interesting and complex emotional statement.</p>
    <p>The user creates a badge saved as a jpeg that he can share to any network.</p>
    <p>Concerning the User Interface it all starts with choosing a Smiley to convey a basic emotion. </p>
    <p>The complexity of the emotional statement arises from following layers which are not part of this topic.</p>
    <p>I attach three different versions.</p>
    <p>Generally, by swiping the Smiley-parts at the sides of the screen the user is able to change the basic emotion as seen in version 1.</p>
    <p>But what we are actually concerned with is a quantification or refinement of the Smiley.<br>
    This is especially difficult because of integration of typography. Every Smiley is named different and each version of refinement is needing a visually pleasing and functioning positioning of either other Smiley name tags  (version 1) or adjectives (version 2) or visually represented quantification (version 3 through a circle scale).</p>
    <p>Version1:<br>
    To refine the mood means to alter the Smiley and its name tag itself.  The user is able to either weak (-) or boost (+) it. </p>
    <p>For the second and third version a quantification of the Smiley will be visually expressed apart from the Smiley.</p>
    <p>The second version tries to achieve this effect by adjectives and the third version by a percentage circle scale.</p>
    <p>All in all the interaction must be straight-forward to use and the shared jpeg easy to read. We "audience" that would read the shared jpeg understands the Smiley as chosen and quantified and therefore deeply personal.</p>
    <p>I attached gifs to convey interactivity.</p>
    <p>Which approach do you like more? </p>
    <p>Is anything concerning the position of typography or genereal design unpleasant?</p>
    <p>Feedback is very much appreciated, </p>
    <p>Many thanks</p>
