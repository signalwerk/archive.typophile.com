      <blockquote><p>I'm just too old for this nonsense. Too meaningless and over complicated - whatever it is! And your images don't match the text. That smirk is NOT 'highly pleased' by any interpretation. - Herb</p></blockquote>
      <p>The final product will be quite the opposite of non-sense. </p>
      <p>As I pointed out the Smiley and its modification through either 1) "visual differentiation", 2) "adjectives" or 3) "quantification by percentage" will only be the first part of a complex emotional statement.</p>
      <p>Our aim is that this statement will be meaningFull and built up by the user successively through adding other  parts to this statement to eventually share a unique badge stating his situative feeling. </p>
      <p>The interface and interactive design needs to be simple and straightforward but at the same time nudging the user to make a rich statement. I am fully aware of the risk of it getting over complicated. So I am asking you and your silent follower: How is it "over complicated"? How to avoid?</p>
      <p>Finally, I doubt that you're too old for this. You just don't (and are not able, yet) to see the full picture. Literally speaking. Upon release our app will not only inspire our users to express themselves richly. And share pieces of their life to engage with their social circles. But also will the users' input feed a heavy AI algorithm that eventually will be of unseen personal and shocking use to the app's user. Given how trivial it all starts ... with a Smiley.</p>
      <blockquote><p>Are you showing them actual size?</p></blockquote>
      <p>Well the size depends on the individual handset. This is based on 1280x720 which for example the Galaxy S III features.</p>
      <blockquote><p>I'd say #3 is most interesting from an interaction perspective if you got the smiley fully animated from 0 to 100% in 1% increments. The first two options I don't really care for, but then I'm probably not a part of your target audience either.</p></blockquote>
      <p>The idead to Fully animate the Smiley is interesting. Thanks. Why do you prefer the third over the other ones that's based on the target audience?</p>
