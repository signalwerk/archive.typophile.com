    html: |-
      <p>Hi smxsmxsmx, it's very hard for users of a forum to give feedback on such a narrow piece of interactive information. I can see what you're asking for feedback on but all you seem to be getting is dislike of the visual impact of the design.</p>
      <p>Be careful for asking advice in a graphic design-based forum on an interactive project, it can be like asking your sports mates if your photographic art is good (no disrespect to the brilliance of typographers). The detail needed to ascertain what it is your project/design is about to give critique outweighs the advantage for such a small snapshot of your project.</p>
      <p>Typically interactivity needs to be broken down to its fundamental function, disregarding aesthetic, so it's the function it's self that is analysed in a controlled way. With full colour graphics, composed into something that resembles an app, that's all we look at and the guys are right, it's not very appealing.</p>
      <p>A three selection input (#1) and a percentage-based input (#3) are two completely different things.<br>
      If you're prompting users to select how they feel in this section, depending on the importance of this stage in your design, to provide the user with pre-chosen selections would be very beneficial to move on to the next section. If you are wanting something more specific, and this part is the crux of your design (this is all it does) it has to be backed up by reporting &amp; analysing that can properly determine the importance between being 65% pleased and 75% pleased. There's no point if both 65% &amp; 75% pleased both fall into the 'very pleased' category and you write off any incremental differences.</p>
      <p>In the end, we don't have any idea what we're pleased about or why we'd be sharing it so we have no care to decide whether to push a button or pick a percentage. That's all your design is telling us.</p>
      <p>P.S. Why is the user choosing his satisfaction based on a graphic? This graphic should be chosen automatically once a set scores are entered as part of a survey e.g. Shipping = 5/5, Service = 2/5, product = 3/5 therefore a graphic is generated based on that response.<br>
      If this is just to post a smiley on my Facebook that looks more contempt than blazé, I don't see the point.</p>
