      <p>Stewf is right — Mousse has a g without the looped tail as well as the more open p (Glengary’s is more closed). Those had made me a little suspect, and now I know why. (I thought maybe the designer had customized it.)</p>
      <p>Also: I’d pay for an Alejandro Paul face over the competition any day of the week.</p>
