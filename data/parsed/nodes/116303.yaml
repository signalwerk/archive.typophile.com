      <p>'LES MALLES MOYNAT' has been reborn in December 2011 by LVMH group. It was a well-known high-end trunk (malle in french) manufacturer. A point to consider is almost all companies in the fashion industry business use bespoke typefaces and custom lettering (which sounds obvious).<br>
      So, you're right, that's neither Futura or Neutraface but this /S is definitely to close to Futura to be a coincidence (or a customization).</p>
      <p>A point for Neutraface, from '<a class="freelinking external" href="http://popularlogos.blogspot.fr/2011/12/le-dieu-du-luxe-ressuscite-une-marque.html" rel="nofollow">Popular Logos</a>' blog</p>
      <blockquote><p>After some search, type has been customized but still based on Neutraface.</p></blockquote>
      <p>Another point for Futura. Baseline of their main logo is set in Futura.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/moynat_5238.png"></div><p></p>
      <p>... But 'PARIS' baseline from their website logo looks like Neutraface No.2<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/logo-moynat_6707.jpg"></div><p></p>
      <p>Actually, that could easily be a mash-up of these 2 (or a customization of any of these 2):<br>
      - /L, /E, /O, /N and /T from Futura<br>
      - (alternate)/M and /A from Neutraface No.2</p>
      <p>Alternatives but all /S are off: <a class="freelinking external" href="http://www.myfonts.com/fonts/mtt/milano" rel="nofollow">Milano</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/m-b-creative/mb-noir" rel="nofollow">Noir</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/arquitecta" rel="nofollow">Arquitecta</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typedynamic/celias" rel="nofollow">Celias</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nootype/radikal" rel="nofollow">Radikal</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/alias/ano" rel="nofollow">Ano</a></p>
