    html: |-
      <p>I'm flattered Mike, but obviously this is Ryuk's fine detective work. BTW, what a great advert. The expressions of the owners, and what appears to be an hotel employee, are priceless. Photography would be so inferior. The crisp authority and stylish quality of _MOYNAT_ is complemented by the hand lettered informational text with the flavor of Futura.  No grunge, chicken tracks or kid's scrawl here!  Handlettering like this from the 1920s and 30s is a gold standard. I'm trying to decide what digital font would match the mix of clarity, subtle variation and friendly tone in the Moynat hand lettering.. Not an easy choice.<br>
      Don</p>
