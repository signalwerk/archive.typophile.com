    html: |-
      <p>I just checked the filmography of <a href="http://filmos.actricesdefrance.net/R/Catherine_Rouvel_ActFra.html" target="new" rel="nofollow">Catherine Rouvel</a> (well known French actress) and I couldn't find a movie that she appeared in with all the cast listed in your poster (not that the filmography is totally complete).</p>
      <p>She did star along with Daneille Darc in the famous 1970 film <em>Borsalino</em>, and the 1974 sequel <em>Borsalino and co</em>.</p>
      <p>My feeling is that the movie titles were constructed from actual neon signs, therefore not a font at all, but derived from actual neon tubing. </p>
      <p>Is the poster in color? Are they actually neon lights?<br>
      Lest not we forget that many typefaces were actually "inspired" by handpainted signs and letterforms, architecturally sculpted forms, and yes, bright lights and neon!</p>
      <p>Throughout the ages, type designers have inspired sign crafters and vice versa... mutual love for letterforms and invention.</p>
