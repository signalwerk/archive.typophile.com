      <p>The central 'Neon' isn't THE Neon (ITC) we usually see. I started hunting in the Photo-Lettering catalogs and found this one is called 'Stan Staneon'. The T and the A are both quite un-Neon-like.</p>
      <p>The other typeface looks more like some of the Paperclip styles, but I couldn't find an exact match.</p>
      <p>- Mike Yanega</p>
