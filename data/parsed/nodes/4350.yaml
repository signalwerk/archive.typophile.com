  - id: 32186
    user: 715
    date: 2004-07-15T08:55:00
    date_raw: 15 Jul 2004 — 8:55am
    votes: null
    html: <p>Aaron, <br> <br>I really like this. The only comments I have are pertaining to the character widths and heights of some. I thnk the "e" and "s" would benifit from some more negative spaces. they feel kinda squat because of the vanishing point effect. and Conversely I would close up a bit of space on all of the descenders and a couple other characters; g, n, k, m, p, q, w, and y. Because of the vanishing point some characters feel much wider and more open than others. The forms themselves are great though. I think that making the spaces a little more equal will only help to make it more usable. <br> <br>For a more traditional black/white type approach, check out CUBA at <a href="http://www.cubanica.com" target="_blank">www.cubanica.com</a> for a similiar TreeDee effect. although yours is peculiar because it has the rounded aspects that work best with the gradient. those will unfortunately be lost in b/w. <br> <br>Nice work. <br> <br>Christian</p>
    html_clean: <p>Aaron, <br> <br>I really like this. The only comments I have are pertaining to the character widths and heights of some. I thnk the "e" and "s" would benifit from some more negative spaces. they feel kinda squat because of the vanishing point effect. and Conversely I would close up a bit of space on all of the descenders and a couple other characters; g, n, k, m, p, q, w, and y. Because of the vanishing point some characters feel much wider and more open than others. The forms themselves are great though. I think that making the spaces a little more equal will only help to make it more usable. <br> <br>For a more traditional black/white type approach, check out CUBA at <a href="http://www.cubanica.com" target="_blank" class="link-external">www.cubanica.com</a> for a similiar TreeDee effect. although yours is peculiar because it has the rounded aspects that work best with the gradient. those will unfortunately be lost in b/w. <br> <br>Nice work. <br> <br>Christian</p>
