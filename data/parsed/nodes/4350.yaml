    html: <p>Aaron, that sure is cool. I love the e y and t. I'm with Paul on the q and v. On some letters the vertical  stems (or are they posts or columns in this case?) look too thick, like on the p, the q and the y. The shapes of s and z are really nice but maybe they can ascend higher in their imaginary cube (or is it qube?). <br> <br>Nice and original. <br> <br>Jon</p>
