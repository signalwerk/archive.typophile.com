    html: "<p>Neat. The only thing I see as a \"must fix\" is that a <b>v</b> shouldn't have a tail; it defeats the effort of distinguishing it from the <b>u</b>. Other comments: A traditional lowercase <b>q</b> might look better. It bothers me some that the <b>s</b> and <b>z</b> are \"flat.\" I would want to depart from the template a little to give the <b>j</b> a curve; I realize that means introducing a blue-to-red gradient.</p>"
