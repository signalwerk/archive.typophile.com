  - id: 32182
    user: 1011
    date: 2004-04-21T12:29:00
    date_raw: 21 Apr 2004 — 12:29pm
    votes: null
    html: <p>Aaron, nice to see you on Typophile. <br> <br>I think I mentioned the same thing that Paul stated above when you first showed me this face - I wondered how it would translate to a standard font format as well. Maybe it can't translate. Perhaps it's destined to be a cut and paste modular system for motion graphics or other such application. The flavor of this type of experimentation recalls some of the work that has been presented in Rick Valicenti's <a href="http://rickvalicenti.com/playground/">Playground</a> or in his faces like <a href="http://thirstype.com/playground_handsome.html">Handsome</a>.  <br>I really like the way that some characters feel vaguely Cyrillic. <br> <br>If this were to be developed as a standard font, you might be able to create different weights for each side of the three-d shapes (x-axis, y-axis, z-axis). That way you could customize the colour and shading of the text by overlaying and adjusting the various weights. <br> <br>Anyway, bring on the numerals. <br> <br>Oh, and an @ sign too.</p>
    html_clean: <p>Aaron, nice to see you on Typophile. <br> <br>I think I mentioned the same thing that Paul stated above when you first showed me this face - I wondered how it would translate to a standard font format as well. Maybe it can't translate. Perhaps it's destined to be a cut and paste modular system for motion graphics or other such application. The flavor of this type of experimentation recalls some of the work that has been presented in Rick Valicenti's <a href="http://rickvalicenti.com/playground/" class="link-external">Playground</a> or in his faces like <a href="http://thirstype.com/playground_handsome.html" class="link-external">Handsome</a>.  <br>I really like the way that some characters feel vaguely Cyrillic. <br> <br>If this were to be developed as a standard font, you might be able to create different weights for each side of the three-d shapes (x-axis, y-axis, z-axis). That way you could customize the colour and shading of the text by overlaying and adjusting the various weights. <br> <br>Anyway, bring on the numerals. <br> <br>Oh, and an @ sign too.</p>
