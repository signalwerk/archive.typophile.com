      <p>This is pre-Caslon—who starts in about 1725 IIRC—so to ID the type you'll need a real historian of type like James Mosley. You can reach him through the link at his blog: <a href="http://typefoundry.blogspot.com/" title="http://typefoundry.blogspot.com/">http://typefoundry.blogspot.com/</a>.</p>
      <p>But as far as allusive typography, Bruce Kennett did a book for the Folger Shakespeare Library's <em>Folio Mania!</em>, about Shakespeare's first folio. The first folio is early 1600s. He laid out the book in the two column style with italic &amp; swash caps at the top, like Shakespeare's actual First Filio. And he used my Williams Caslon Text, with my swash letters at the top. This was mixed with photos of pages from the First Folio, as well as portraits from the time, etc. I'm prejudiced, but I think it worked out really well. You can see some samples <a class="freelinking external" href="http://pinterest.com/pin/180284791303277762/" rel="nofollow">here</a> and <a class="freelinking external" href="http://pinterest.com/pin/180284791303320467/" rel="nofollow">here.</a></p>
      <p>I think it worked out partly because Caslon's point of departure were those types of the previous century, such as you probably have in your 1705 book.  </p>
      <p>The reprint of a 1652 book, <em>Theatrum Chemicum Britannicum</em>, also used my Williams Caslon Text, again throwing around the swash caps and mixing in the original illustrations. Somehow it works, as you can see <a class="freelinking external" href="http://pinterest.com/pin/180284791303398671/" rel="nofollow">here.</a> They used my font quite often at larger sizes than I intended, but it then looks like a result of old letter press ink spread.</p>
