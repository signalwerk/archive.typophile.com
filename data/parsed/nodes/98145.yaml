      <p><cite>And as for your point about not being English, Marini's site indicates that the fonts Fell bought were mostly Dutch, with some French italics in the larger sizes...</cite></p>
      <p>Even more than that. In Jaspert et al., <cite>Encyclopedia of type faces</cite>, you'll find in the notes to the Fell Roman "But some of these types, like the one shown here, are probably of French origin." That's the text-size "Fell Roman."</p>
      <p>Robert Granjon worked in Antwerp a while. And of course, though working in Neiderland, Kis was Hungarian &amp; probably familiar with the work of the Venetians. Those old punchcutters moved around.</p>
      <p>What's always a danger with one of these project is that the half-informed will charge you made a bad decision</p>
