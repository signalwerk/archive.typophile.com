    <p>I sorta kinda would like to identify the family used for</p>
    <p> The History and Present State of Virginia, in Four Parts.</p>
    <p>Not the 1940-whatever edition put out by UNC press, the 1705 edition, with this imprint</p>
    <p>London: Printed for R. Parker, at the Unicorn, under the Piazza's of the Royal-Exchange.</p>
    <p>Even though what I've got to look at are distorted photocopies, I freely admit that identifying old foundry fonts lies outside, nay, far outside my skill set. &amp; that at that time in England, the types could have come from anywhere. Well, they're not German. France, Italy, and Neiderland are still in the running. They are quite condensed for the time, and the varying slopes of the ascenders in the italic remind me of Jannons exuberance.</p>
    <p>Part of the point of identifying the font is to point out to the customer that no, we can't make it look like that edition, that the types used in England at that time weren't particularly "English," (correct me if I'm wrong), and if they want allusive typography, they might want to pick a different theme to allude to. </p>
    <p>Thanks for any help,</p>
