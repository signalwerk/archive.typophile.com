      <p>I don't have any ability to distinguish Dutch punchcutters of the seventeenth century, but if the client insists on the idea of digital type resembling the 1705 edition, then based on the title page images at <a class="freelinking external" href="http://docsouth.unc.edu/southlit/beverley/illustr.html" rel="nofollow">http://docsouth.unc.edu/southlit/beverley/illustr.html</a>, I'd guess the Fell Types (1680s-90s) might be a reasonable approximation. And as for your point about not being English, Marini's site indicates that the fonts Fell bought were mostly Dutch, with some French italics in the larger sizes: <a class="freelinking external" href="http://iginomarini.com/fell/the-revival-fonts/" rel="nofollow">http://iginomarini.com/fell/the-revival-fonts/</a></p>
      <p>I haven't tried working with them myself, so can't comment on how much reworking they might require.</p>
