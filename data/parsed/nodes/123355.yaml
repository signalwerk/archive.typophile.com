  html: |-
    <p>Trying to recreate this (or something similar) for a motion graphics assignment but all I have is <a href="/wiki/https%3A/%252Fyoss.org/wp-content/uploads/2015/01/Ad-C.jpg" class="freelinking" rel="nofollow">this fairly lo-fi JPEG</a>. </p>
    <p>What I'm looking for is that bold/semibold and italic serif font in white (for the honorees' names/"Save the date!"/etc.) Identifont and Whatthefont aren't really helping. </p>
    <p>Any guesses?</p>
    <p>PS - Not in a rush to find the "A Vision for the Future" font (although it's pretty snazzy) and I'm guessing the little sans serif font is Myriad or something similar. But bonus points to anyone who knows what they are!</p>
    <p>PPS - Just edited to change title from "sans serif" to "serif." It IS a serif font I'm looking for!</p>
    <p>PPPS - Found the font (it's <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/itc/tiepolo/" class="freelinking" rel="nofollow">Tiepolo</a>)! And the script font is <a class="freelinking external" href="http://www.dafont.com/hemmet.font" rel="nofollow">Hemmet</a>! Unfortunately I can't find the sans serif! More explanation in the comments.</p>
