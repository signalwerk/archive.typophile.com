      <p>So I did get a higher def version of the file, and I found that the font I was looking for <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/itc/tiepolo/" class="freelinking" rel="nofollow">ITC Tiepolo Bold Italic</a>. So there you go!</p>
      <p>Thanks also to Ryuk for finding that script font!</p>
      <p>Unfortunately, the font I assumed would be the easiest to find turned out to be the hardest. I knew it was a humanist sans serif, but unfortunately most of the usual suspects - Myriad Pro, Frutiger, Open Sans, Source Sans - lack that slab serif on the capital I's, and the ones I'm aware of that do - Tahoma, Verdana - just kinda...don't look right.</p>
      <p>Any help?</p>
