      <p>i see this thread has dropped off in the last week. however, i just discovered it, and find it an interesting topic.</p>
      <p>i build a lot of pixel fonts, so it can easily be said that my opinion in this matter is biased. however, i began building pixel fonts years ago due to my own design needs. this was back when atomic media was the only pixel font vendor, and style selection was thin. i had a need for stylistic type at small sizes for an online motorcycling magazine i was producing.</p>
      <p>my point is, as a designer, i cannot think of one situation where i might use these fonts as rendered. they look like eyelashes covered with too much mascara.</p>
      <p>sharptype is an impressive engineering feat. i can appreciate the direction the software is trying to take: clear screen display typography at small sizes.</p>
      <p>but, as it stands, i’d never use these fonts in a design i was going to show to an audience. i might use them for comping purposes, but what’s the point in doing that? spend $35 for subjectively superior type?</p>
      <p>think about it. how can a program replace human judment on a grid so small and sparse, every pixel placement and shade of gray will either make or break the design?</p>
      <p>it seems to me to be similar to software teams building a font blending program and proclaiming that designers only need two typefaces from now on: one sans, and one serif. just tell the program what blend balance you want between the two, and the font is generated on the fly!</p>
      <p>their product might be an outstanding achievement from an engineering perspective, but they completely minimize the value of type design.</p>
      <p>now, i’m not saying that all pixel font designs are created equal. nor, am i saying that i am an authority on pixel font design.</p>
      <p>but really, what is to be gained by trying to minimize the importance of pixel font usage or design? why endorse an automated solution for the creation of design assets (rendering a traditional font is really the recreation of it) when DESIGN is the point of it all?</p>
      <p>why would human designers value automation over human designs?</p>
      <p>is it cost savings? buy one $35 program instead of the average $100 the typical designer might spend on an entire pixel font library?</p>
      <p>is it for better font management due to fewer fonts to worry about?</p>
      <p>think about the incredible attention to detail that goes into every single font this software can render. all that wonderful artistry is lost when it is translated into pixel building blocks, each quite literally taking up 1/4 of each glyph’s height and doubling its stem widths.</p>
      <p>pixel fonts exist in their own right because at certain sizes, hinting fails, traditional fonts lose their character, and even their readability.</p>
      <p>in my opinion, it should be a welcome idea to designers that new rules are there to be explored for display typography, and as a result, new typographic styles to be established.</p>
      <p>why try to render traditional typography on screen at the smallest of sizes, when that typography was never designed for screen use, let alone small sizes?</p>
