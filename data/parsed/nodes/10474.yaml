    <p>From graphics.com  <br> <br>Win: Microworld Releases Sharptype Photoshop Plugin  <br> <br>Posted on Wednesday, April 13  <br> <br> <br>Microworld claims that its new plugin for the Windows version of Photoshop can create clearer type output at small point sizes.  <br> <br>There's no doubt that generating clear type output at small point sizes from any image editing application can be a challenge. Microworld has come up with a new approach in the form of a Photoshop plugin that it believes provides "ultra-clear" font output. It also adds a few extra touches, such as the ability to employ a user-defined font directory and provides a character map to ease font and symbol selection, with support for multiple languages.  <br> <br>Sharptype is available as shareware on the Microworld site, with registration costing $29.95. The unregistered version provides a limited range of font sizes.  <br> <br><a href="http://www.sharp-type.com" target="_blank">http://www.sharp-type.com</a>  <br> <br><img src="http://www.typophile.com/forums/messages/4101/70407.gif" alt=""></p>
