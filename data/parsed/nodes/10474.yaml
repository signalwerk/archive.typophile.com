      <p>Stephen, you’ve always been ambivalent about the Ultrafonts stuff - it’s strange to see you jump up and say something is “better”... Not to mention that you were probably looking at that on a Mac, where the flatter gamma would hide the crapfuzziness. It’s good to see a company like Sharptype trying to improve small font rendering*, and maybe it is indeed better than out-of-the-box Photoshop rendering (maybe) but it’s not remotely as good as what the human eye/hand can do. Gustavo did a good job demonstrating that; Mana-9 will do an even better job.  :-&gt;</p>
      <p>* Especially in the light of so many designers who ignore the problem. The other day I was complaining about the small text on a website of a typography PhD, and the reply was: we see nothing wrong with it. Yeah, the fuzzy stems and horrid spacing is just dandy I guess...</p>
      <p>The only thing that comes close to handmade grayscale fonts is the Longhorn Cleartype stuff; however, in Cleartype a character can have different renderings depending on where it falls on the subpixel grid - and this is because it maintains the classic unhealthy attachment to WYSIWYG.</p>
      <p>hhp</p>
