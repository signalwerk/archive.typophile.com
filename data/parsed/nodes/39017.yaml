    html: |-
      <p>Being that I’m pretty sure it’s supposed to say Kickapoo, what we’ve got here is either a calligrapher who didn’t realize what he/she was doing when he/she made that o to look like a d, or it was a metal sort out of sorts that nobody was typographically swift enough to catch (this is very small town, rural Wisconsin, 1925...easy enough to believe) or the person setting it did notice it and thought it must be a “fancy o” and used it for flavor. Either way, it all of sudden has some pretty funny mystery and/or lore attatched to it.</p>
      <p>Or, it really was the Kickapod Scout. And if that’s the case, I’m going to suggest they change the name of the paper to the Kickapod Crane. There are a few cranes around here.</p>
