      <p>I’ll second that.<br>
      B. Schnelle has compiled a <a href="http://www.beepworld.de/members66/vau-ef-be/schriftliste1.htm">great list of (metal) Blackletter faces</a>; at first glance I couldn’t spot anything close. Then, a lot of the faces lack images. For some of them, one could find samples via searching for their names in the <a href="http://www.global-type.org/Searching.743.0.html">Global Type database</a>.</p>
