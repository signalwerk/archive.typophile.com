      <p>- Not sure why the contact info is hidden below the drawing</p>
      <p>- Maybe try to knock out the background of the drawing so it is fully white</p>
      <p>- Shouldn't a resume, especially of someone fairly young, be limited to a page?  This is typically done to keep it limited to the most important elements.  My opinion is that you have a lot of extra info that you are asking me to mentally edit, which is a burden to the reader.</p>
      <p>- Unless it is for an illustration position, I am not sure the drawing is a good thing to include.</p>
      <p>- I wouldn't indent the text for each entry.  The bold headings are enough to separate the sections, or you could add a bit of vertical space.</p>
