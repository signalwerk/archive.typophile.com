    html: |-
      <p>I'm a tech writer and really don't deal with resumes or video game companies. But here is my opinion.</p>
      <p>Change the font to something more up-to-date, even if it's just Calibri. Helvetica is too old-school, for a hip video company.</p>
      <p>I would not out-dent the top level heading (Professional Development, Education, Computer Skills) as this does make me want to look to the left hand column to see if it goes with anything there. Just do a straight left alignment. </p>
      <p>Like Bendy, I can't tell the difference between Professional Experience and Professional Development. But I may be out of the loop on this. If you need to, just put a note under the words Professional Development to define it.</p>
      <p>The problem with the top of this resume is that nothing is lined up. The name Christine Hoang is just plopped in there. Nothing is lined up vertically with the top of Christine's head. Nothing is lined up horizontally with the right column. Nothing is lined up and this needs to be fixed.</p>
      <p>Note that underneath Christine's picture the three lines have a line spacing problem. And the two contact numbers really have no connection to the term "The Game Changer", which actually should be with Christine's name.</p>
      <p>Here's what I would do. Using only the first column, above Christine's picture, right aligned. Do not use all caps. Use the same font although maybe the first two lines are a little bit bigger:</p>
      <p>Christine Hoang<br>
      The Game Changer</p>
      <p>619.xxx-xxxx<br>
      name-at-gmail.com</p>
      <p>This makes Christine's name smaller, but will look nicer, in my opinion. Be sure to leave a little white space below the email address and on the left side (it's right aligned) to make it stand out. There may be other solutions, but that's mine. Keep the things that go together, together.</p>
      <p>Then move "Professional Experience to the top of the page and keep on trucking with the column straight left aligned.</p>
      <p>Other comments:</p>
      <p>Like Bendy, I noticed the present tense for the present jobs and past tense for past jobs. Is this standard in resumes? I don't know.</p>
      <p>"send invites to become new members" Do you want to say invites or invitations? </p>
      <p>"for recruiter send-out"  This sounds jargony to me. I would say "for recruiters to send out"</p>
      <p>"up-sold" This sounds jargony to me. I would say "Sold additional gaming accessories and offered suggestions to customers"</p>
      <p>"Promote events online" This needs some jargon: Facebook or blog or google ads. Put some tech specs in here.</p>
      <p>"and directly with a grassroots approach" Wow! sounds great, how about a few more words for details</p>
      <p>"Responsible for managing social media networks" Just go ahead and drop a few tech names here.</p>
      <p>"Photographed events" For?? Were they ever used anywhere?</p>
