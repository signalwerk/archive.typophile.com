      <p>I feel that the highly stylized photo is too much. Even for a video game company. There could be some benefit if they are looking to hire for her looks but other than that, it doesn't say enthusiastic individual. </p>
      <p>Then again, it does look like she helps with promotions where her looks can be quite valuable for all those lovely pimply gamers... ;)</p>
      <p>If there is time, I'd recommend jumping onto a few Forums of actual video games and see if you can get some feedback from the company themselves. The only one that I have experience with is League of Legends. The employee's are on the forums all the time, so give that a shot.<br>
      If you want to give a bit of character to this, maybe you can give her head and glasses some sort of cool treatment. Illustrate it in a fun manner or in a funky photo/filtered way. The entire body shot just isn't recommended in my opinion. But who knows? Maybe send it in, wait a few weeks, send in a little toned down one...?</p>
      <p>Other thoughts:</p>
      <p>Instead of blowing out her name, what about a statement? "I PLAY GAMES, TOO!" —Christine Hoang. Or adding her PSN XBOX Live name. Companies in the video game industry want to see players applying.</p>
