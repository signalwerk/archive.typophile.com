    html: |-
      <p>The issue for now 3d printing type is the wearing down. The materials for the more "affordable" 3d printers are not extremely strong,  and some print materials work horrible with inks. If you want a crisp print you won't be able to make a huge printing run, the edges will wear down pretty fast. Since most prints are made with an extremely rough material getting a crisp edge takes a lot of post-processing. Also, because of the rough print, making small type is quite impossible.</p>
      <p>I hope I have some time soon in which can experiment a bit more with it, since for now my tries have been mostly with checking out how to get the best finish for shapes. However, there are industrial printers out there that are able to print metal, now that will be something...</p>
