    html: |-
      <p>I have never tried lasercutting for metal, only high-pressure water cuts, which gave quite a nice finish. So far, for me at least, laser is more efficient (and cheaper) on softer materials such as acrylics or wood, with acrylics being the most efficient due to the problems with wood burning up on small lettering use.</p>
      <p>For letterpress type 3d-printing proves to be the easiest solution so far although it needs a lot of work finishing in sanding the edges.</p>
      <p>I believe most workspaces (at least the ones that I know of) use lasers for the softer materials, but still use water-cuts for metal. At least in the affordable range.</p>
