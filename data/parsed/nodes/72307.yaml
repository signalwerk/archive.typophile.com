    <p>Hi folks,</p>
    <p>I am going to Los Angeles, next August, for TypeCon 2010 Babel. I would like to share a room with another guy who will attend at this same convention, and wants to be hosted at Hyatt hotel (same venue of TypeCon).</p>
    <p>I will arrive at LA by August 17th and will depart August 23th, back to Brazil.</p>
    <p>If you want to share or know someone who wants, please, let me know. My email is <a href="mailto:ralexm@terra.com.br">ralexm@terra.com.br</a></p>
    <p>My MSN is <a href="mailto:kore.coeur@hotmail.com">kore.coeur@hotmail.com</a></p>
    <p>Kind regards,</p>
    <p>Ricardo Martins<br>
    Federal University of Parana<br>
    Curitiba - Parana - Brazil</p>
