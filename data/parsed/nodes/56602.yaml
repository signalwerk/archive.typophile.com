    html: |-
      <p>It's a (slightly bizarre) feature, not a bug.</p>
      <p>When you draw using the primitives tools (rectangle and oval), or using the paint brush, there is a "paint mode" that affects what happens when you draw. It doesn't affect the line and curve drawing tools, but it will affect the paths you have already created with them as soon as you use one of the "paint" tools (the rectangle, oval, or brush tools). Here is the paint mode selector on the paint toolbar:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/paintmode_4611.jpg"></div><p></p>
      <p>The modes, from left to right, are:</p>
      <p>Empty color<br>
      Auto color<br>
      Black color<br>
      White color</p>
      <p>These modes affect what happens when you create overlapping shapes with any of the "paint" tools. Unfortunately, they also affect any existing overlapping shapes that you have drawn with other tools as soon as you use one of the "paint" tools. </p>
      <p>To prevent this automatic merging from happening, be sure that the "Empty color" mode is selected. The behavior you're seeing is because one of the other three modes is selected.</p>
