    html: <p>Today's German lesson will teach all of you how to order your copies of Spatium quickly and easily� <br> <br><img src="http://www.typophile.com/forums/messages/30/47393.jpg" alt="spatium screen shot"> <br> <br>First, go to <a href="http://www.spatium-newsletter.de/index.php" target="_blank">http://www.spatium-newsletter.de/index.php</a> <br>and click the word "Bestellung" in the top nav menu. "Bestellung" means "order" <br> <br>The current magazine issue is called "Gruppe 11," which means "Group 11." Issue number 2, as well as two t-shirts are also available for purchase. These are really chic, especially the "girly" shirts.  <br> <br>If you just want a copy of the magazine, type a 1 under the "Anzahl" slot to the left of "Magazine Gruppe 11" (under the red "Bestellen"). "Anzahl" means "number," so don't type 2 unless you want two copies� <br> <br>Then type in your mailing address. "Stra�e/Nr:" means "Street and House Number." The Germans type things in that order (Geisbergstra�e 3), but you can ignore their silly conventions and type in you address the good old american way, as I've done here. "PLZ/Ort" means "Zip Code and Place." "Land" means "Country."  <br> <br>Clicking the "Artikel bestellen" button (which means "order item") will lead to some other magical page, I imagine� I've never ordered anything online from Spatium before, so I don't know what happens next, but it is probably self expanatory. If you get sad because this form is just too confusing, you can e-mail Peter directly by clicking on the "Kontakt"  (which means "contact") button in the upper right-hand corner of the screen.</p>
