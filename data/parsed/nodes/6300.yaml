    html: "<p>Well, I'd like people to actually buy the issue, so I won't put up a full PDF of it (at least not for a while), but the point of the essay is to explain what Latinization is and where it comes from (and how ancient it is), show exactly what can be good but what is usually bad about it, and conclude with a technical elaboration of how to \"channel\" it positively in making a multi-script typeface system. <br> <br>BTW, Dan, I don't know about \"star article\" - there's a lot of other great stuff in there. <br>Here's a dump from a PDF of the table of contents: <br>\" <br>3 Vorwort/Preface <br>5 Gruppe 11 � Typogra.e ist international <br>Group 11 � typography is international Peter Reichard <br>9 Typeface Noni Donald Beekman <br>10 Latinisierung: Vorbeugung und Heilung <br>Latinization: Prevention and Cure Hrant H. Papazian <br>21 Knorr Logotype Peter Reichard <br>22 Typeface Misou Dirk Uhlenbrock <br>23 Typeface Rickshaw Dirk Uhlenbrock <br>24 Der Ursprung der griechischen Buchstaben <br>Greek Letters Origin Panayiotis Haratzopoulos <br>29 Typeface Japanese Magma <br>30 Typeface Partisan East Boris Dworschack <br>31 Hebr�ische Typogra.e <br>Hebrew typography Oded Ezer <br>34 Arabische Typogra.e: <br>Zwischen der Vergangenheit und der Zukunft <br>Arabic Typography: <br>Between the past and the present. Tarek Atrissi <br>40 Peace Typography Ine Beerten <br>42 Moscow Streettypography Levasha <br>44 Typeface Manga Donald Beekman <br>45 Typeface Fragment Viagra.k <br>46 Typeface Kamchatka Matt Desmond <br>47 Typeface Dimitri Typonauten <br>48 Jewrejskaja Gazeta Peter Reichard <br>49 Ball of Fame David Borchers &amp; Till Hopstock <br>50 Typeface Orient Wolfgang Rudolf <br>51 Mo magazine Toko <br>52 Chinesische Schrift <br>Chinese Writing Tanja Huckenbeck <br>56 Shanghai Typo Impressions Tanja Huckenbeck <br>66 Shanghai Tanja Huckenbeck <br>68 Faux Fonts Peter Reichard <br>70 Paris Typo Impressions Peter Reichard <br>76 Literatur und Webressourcen <br>Litratur