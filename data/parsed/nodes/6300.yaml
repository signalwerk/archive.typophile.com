  html: <p>I just got a copy of the newest edition of <i>Spatium,</i> a German magazine on typography produced by the Typosition Studio in Offenbach. The star article in the issue is by Hrant, on the Latinization of Non-Latin scripts and typefaces <br> <br>Snipits about Spatium and Hrant's article have been heard on typophile before, but I think that it is now time for everyone to place their orders for the magazine, as it has finally arrived (it was presented publicly for the first time today, in Offenbach, of course). This issue, unlike the previous three, is printed in both German and English. <br> <br>Spatium Magazine <br><a href="http://www.spatium-newsletter.de/index.php" target="_blank">http://www.spatium-newsletter.de/index.php</a> <br> <br>Typosition <br><a href="http://www.typosition.de/" target="_blank">http://www.typosition.de/</a> <br> <br> <br>(There is also a tiny contribution on page 49 from TypeOff., the HfG Offenbach's Type Design Collective. <a href="http://www.typeoff.de" target="_blank">http://www.typeoff.de</a>)</p>
  html_clean: <p>I just got a copy of the newest edition of <i>Spatium,</i> a German magazine on typography produced by the Typosition Studio in Offenbach. The star article in the issue is by Hrant, on the Latinization of Non-Latin scripts and typefaces <br> <br>Snipits about Spatium and Hrant's article have been heard on typophile before, but I think that it is now time for everyone to place their orders for the magazine, as it has finally arrived (it was presented publicly for the first time today, in Offenbach, of course). This issue, unlike the previous three, is printed in both German and English. <br> <br>Spatium Magazine <br><a href="http://www.spatium-newsletter.de/index.php" target="_blank" class="link-external">http://www.spatium-newsletter.de/index.php</a> <br> <br>Typosition <br><a href="http://www.typosition.de/" target="_blank" class="link-external">http://www.typosition.de/</a> <br> <br> <br>(There is also a tiny contribution on page 49 from TypeOff., the HfG Offenbach's Type Design Collective. <a href="http://www.typeoff.de" target="_blank" class="link-external">http://www.typeoff.de</a>)</p>
