    html: |-
      <p>Here's another update. I will probably put the letters into FontLab next time and provide some short texts so you can judge the typeface better. Here are the changes:<br>
      • I raised the ascender of /f, changed the terminal and lowered the horizontal bar to interact better with /i.<br>
      • I changed the bowl and ear of /g and made the links a bit more robust. I also changed the composition a bit.<br>
      • I lowered the tittles of i/j.<br>
      • I made the /o a bit more square and changed the angle of the counter.<br>
      • I decreased the width of /r a bit and changed the terminal. I also increased the right side of the base.<br>
      • I changed the spine and curvature of /s and updated the s_t ligature.<br>
      • I made the crossbar of /t more straight and decreased the details.<br>
      • I changed the terminals in C/G and modified the whole shape.<br>
      • I decreased the width of E/F , made the top terminal more vertical and sharpened the top of the terminal a bit.</p>
      <p>I'm not yet satisfied with the ear of /g in particular. Next time I will give it another go.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aghari-Regular-v19_6106.jpg"></div><p></p>
