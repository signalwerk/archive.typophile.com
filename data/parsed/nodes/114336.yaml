      <p>The proportions seem a little off to me. I'd make e and r a little wider, and t a little narrower. The gaps in your display don't seem to follow a clear logic, which is not necessarily a bad thing, but be aware of it. Right now, to me it looks a little bit like you can't decide between stencil and non-stencil.</p>
