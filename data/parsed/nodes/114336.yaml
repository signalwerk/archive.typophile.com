    html: |-
      <p>I love the /v/!<br>
      For /O/o/, see how it would look with a smoother, rounder outside contour--get the weight distribution and character you want from messing with the inner contour. My hypothesis is that the eye has more patience for funkiness in the counter shape if the overall glyph is predictably circular.<br>
      The thick-thin-thick spine of /s/ is inelegant to my eye.<br>
      Shortness of that /f/ may be odd in words with other ascenders.<br>
      Ear of /g/ and spur of /G/ may be out of character.<br>
      Crossbar of /t/ looks a bit like a truck ran over it!<br>
      Top terminal of /C/G/ may be a little too limp.</p>
