    <p>Hello,</p>
    <p>I would like to present to you a typeface of mine. It's a somewhat organic serif typeface with subtle Middle-Eastern influences. There's definitely a lot of refining to do, but meanwhile I would like to gather your opinions and criticism.</p>
    <p>I also have some letters of a sans companion but I abandoned that for now because I first need to get the basic set of the serif right. I will also leave the display version until the regular version is done but I still wanted to show what I have.</p>
    <p>I'm aware of half the problems in this typeface but I'm curious about the problems I didn't see yet. This typeface is technically more advanced than what I've done before so it's particularly challenging to balance the weight and keep the design consistent, but I'm learning a lot from it. Let me know what you think.</p>
