    html: |-
      <p>@Frode: Thanks a lot! The lowercase /a was the starting point of the typeface and  the glyph I'm possibly most proud of, of any glyph I've drawn so far. I'm glad to see you guys see the potential.</p>
      <p>@Jasper: You don't need to remind me of the value of feedback. Particularly since I have no formal education in type design I appreciate feedback tremendously because you guys often spot "errors" I missed or lacked an awareness of the problem in question to fix or improve the characters. You can be as brutal in your criticism as you want as long as it's constructive.</p>
      <p>I agree with the proportional issues you mentioned. The /r is always a problematic letter for me, actually. I think the /r in combination with a lot of other letters create a gap between the two letters which is too wide. A contextual ligature would do well here but I always try to resolve the gap issue as much as possible without having to utilize OpenType features. I certainly went too far with compensating for the gap here.</p>
      <p>As for the display version, I wasn't trying to create a stencil letter and so it indeed lacks the consistency of a stencil. It's just that I thought this typeface works well in high contrast for display uses and I wanted a few characters to stand out a bit more. Perhaps it's indeed too much like a stencil, but I don't want to abandon the idea just yet. It's good to know I might have taken it too much towards a stencil design though.</p>
