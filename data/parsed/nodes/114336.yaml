    html: |-
      <p>Here's a new preview of Aghari. I have a few deadlines for other work so I don't have time for a lot updates, but here are some:<br>
      • I made the /r wider and slightly raised the shoulder.<br>
      • I made the /s wider and changed the proportions and top serif a bit.<br>
      • I slightly condensed /t and replaced /s and /t in the s_t ligature with updated characters.<br>
      • I made /e a bit wider and slightly changed the weight distribution.<br>
      • I changed the proportions of /f.<br>
      • I increased the ascenders a bit.<br>
      • I added /E and /F.<br>
      • I balanced out /z and /Z.<br>
      • I improved the bowl of /a.</p>
      <p>Any other criticism is very welcome. Also, does anyone have tips for the design of /o,/O and the bowl of /g? I want to bring some tension in the weight distribution to make the shapes look more dynamic, but it's hard to balance symmetrical outlines with diagonal counters. I should possibly have a closer look at Legato.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aghari-Regular-v18_4397.jpg"></div><p></p>
