  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/goingCrazy_3537.jpg"></div><br>
    I am developing a tech brand and one of the primary elements are these blocks (one not shown will be the logo), but I'm having a really hard time finding a typeface to compliment them. I explored many san sarifs and even threw Didot in just to see... to no avail. I am at a loss, frankly.<p></p>
    <p>I did make some headway by not using heavy weights. Throwing in a light Dicot (not sure where this came from... can't find info on origins). But I feel like the swell? fillet? (the round corners) aren't doing me any favors.</p>
  html_clean: |-
    <p></p><div class="imageWrap"><img src="/files/goingcrazy_3537.jpg"></div><br>
    I am developing a tech brand and one of the primary elements are these blocks (one not shown will be the logo), but I'm having a really hard time finding a typeface to compliment them. I explored many san sarifs and even threw Didot in just to see... to no avail. I am at a loss, frankly.<p></p>
    <p>I did make some headway by not using heavy weights. Throwing in a light Dicot (not sure where this came from... can't find info on origins). But I feel like the swell? fillet? (the round corners) aren't doing me any favors.</p>
