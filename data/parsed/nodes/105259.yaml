    html: |-
      <p>Hi Satori, thanks for the tips. I had tried a different Q earlier, but it had worse legibility. I'll play around with it to see if I can help it, but I do like the unorthodox shape. I'll rework the 4 and 9, and now that I'm really studying it after a few days, I think the midline of the 5 is too high as well.</p>
      <p>As far as lowercase is concerned, I was planning on repeating the capitals across the lowercase, perhaps as small caps. For some reason, I can't see attractive and wide lowercase forms, and the intent for the uppercase was mainly titling. I'll continue to evaluate and post updates here.</p>
      <p>Conrad</p>
