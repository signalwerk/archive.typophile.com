      <p>Quite pretty overall! The {g} strikes me as crooked, though. Maybe keep the descender more vertical at the beginning, and prune back the end a bit. The {s} and {2} are a bit flabby, maybe remove the plateau in the spines. The {S} doesn't have that problem, but the upper and lower bend are very different from each other — try giving it a more continuous curve. The {t} looks comically unbalanced to me. It'd keep its ascender and backward spur to a bare minimum, and give it a more grounded foot.</p>
      <p>Love the numbers and the {Q}!</p>
