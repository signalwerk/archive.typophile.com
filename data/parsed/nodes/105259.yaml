    html: <p>Instead of changing the Q, I would rather have a take on the J. When we tend to accept that I does not need to be widened to fit in an extended typeface, wy should J suffer from that? The horizontal stroke is already too much for a proper J. Maybe you could try to extend the J below the baseline with a curvature similar to the tail of the Q. As a consequence you might then also consider to give the diagonal strokes of K (down right only) and R. Which could be taken further of course. When this does not fit your original concept (too much curvature?) you might also consider to create two different designs :–)</p>
