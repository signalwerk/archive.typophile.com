    html: |-
      <p>I like it, generally! A few random observations:</p>
      <p>B suffers from the <a class="freelinking external" href="http://66.147.242.192/~operinan/2/2.3.2a/2.3.2.06.illusion.htm" rel="nofollow">"bone effect"</a> and needs to be optically compensated. Also the join of the two bowls appears too dark. (D could also use some similar correction, even if it's not as obvious there.)</p>
      <p>O needs more overhang.</p>
      <p>X looks slightly top-heavy.</p>
      <p>C has some strange curves going on, especially the top one. Also, it seems out of style with the easy geometricism of a lot of the other characters, and its terminals are different from G/S. (If that's intentional, what's the rationale?)</p>
      <p>S probably needs to be gone over curve-wise as well, doesn't feel entirely smooth and leans back slightly. </p>
      <p>Does I have a thicker stem than the other characters? If so, why?</p>
      <p>Why is the stem off-centre in the exclamation mark?</p>
    html_clean: |-
