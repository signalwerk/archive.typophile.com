      <p>UPM -- units per measure. So if your units in Illustrator happen to be points, use 2 * 1000 points. If they are in mm, use 2 meters (sounds a bit large); and if you are a stickler for inches, bring out the extra wide screen.</p>
      <p>I think the main point is, you should have a rectangle of twice the font em square in units that are convenient to recalculate to 1/1000ths, i.e., for any coordinates on your 2000 x 1263 square (in points, mm, or in fuzzwots -- okay I made that last one up), you shouldn't bother about fractions of your measurement unit.</p>
