    <p>instructions from fontlab </p>
    <p>in the paragraph below to import a font correctly from illustrator </p>
    <p>Still in Illustrator, select File &gt; New. Set the width of the document in<br>
    points to be the double of the UPM size of your font (e.g. 2000 pt for a 1000<br>
    UPM font). Set the height of the document to be the same as UPM size –<br>
    Descender (e.g. 1000 – (–263) = 1263 pt). Select Window &gt; Info, View &gt;</p>
    <p>------------------------------------------------------------------------------------<br>
    Typically TrueType fonts have UPM (Units Per eM – the size<br>
    of the grid on which all glyph coordinates are defined) equal to<br>
    2048. Type 1 fonts have UPM equal to 1000. </p>
    <p>------------------------------------------------------------------------------------<br>
    to clarify here is were im confused </p>
    <p>Set the width of the document in<br>
    points to be the double of the UPM size (mmm ok wot is the upm size is that double the size of the grid the font is made on)</p>
