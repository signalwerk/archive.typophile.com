      <p>UPM is generally a function of the desired end font format. As explained in your quote above: Postscript/CFF OTF = 1000 upm, TrueType TTF = 2048 upm.</p>
      <p>These values are not absolute requirements, but they are the general working standards. You'll need to set your Illustrator document accordingly, then scale your drawings to fit the way you want.</p>
      <p>Next time, draw in FontLab to begin with and save yourself the headache. Illustrator is not a type design tool.</p>
