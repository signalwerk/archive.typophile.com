    html: |-
      <p>The value 700 pts <em>as a physical measurement</em> is only valid in Illustrator, because there you have to work with physical measurements. In Fontlab, on the other hand, you can only interpret the value "700" in one way: 700 units of the 1000 (or 2048) em-square.</p>
      <p>When working in Illustrator, you don't have to worry about the <em>actual</em> size of the character you draw. You only have to pay attention to its size relative to the document size, which should have em-square like proportions.</p>
