      <p>@frode<br>
      <em>You’ll probably never again come across a typeface as well hinted as Georgia: Even with Windows’s latest rendering most of the fonts on Typekit doesn’t hold up, and if you happen to use older versions I’m not sure if there is anything readable left.</em></p>
      <p>By and large, I agree with you - to the extent that screen rendering is ahhh.. <em>fitful</em> and <em>uneven</em>, to say the least.<br>
      But: people are using them anyway and that's the lesson.<br>
      Many people just don't care, obviously. Or they are working on Macs and don't test on Windows. (Which is not to say I like Mac rendering - it will depend on the font but I mostly don't.) There's a lesson there, too.</p>
      <p>It's just a kneejerk reaction to the same old, same old. And if there's a few warts, so what? Or that seems to be the attitude, at least.</p>
      <p>INFG - It's Not F-cking Georgia.</p>
      <p>All of which doesn't solve plojel's problem. But I didn't realize at first that he was looking for a web font to replace Georgia.</p>
      <p>@plojel<br>
      I don't think you're going to find a Georgia knock-off with a web font license that you're going to find acceptable. It depends what your priorities are.</p>
      <p>rich</p>
