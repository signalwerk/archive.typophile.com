    html: |-
      <p>This topic has been covered before, many times, but the place to start is <cite>why</cite> many typographers use small caps for acronyms. The answer usually given -- and the one I would give -- is that full caps, like lining figures, call attention to themselves because of their physical size. When that attention is unwanted, they are awkward.</p>
      <p>But consider a book about FDR, where "FDR" is one of few acronyms or abbreviations in the entire text. Here, it would be odd to minimize the force of the name -- spelled out, Franklin Delano Roosevelt would have initial caps, &amp; so "stand out." In fact this happened in a book I designed, and I set FDR in full caps throughout.</p>
      <p>If the acronyms in the copy you are setting are an important part of the sentences -- rather than, say, just a passing reference, you may want to set them all full cap.</p>
      <p>However, should you decide on small caps, you can make them a bit bigger than comes form the foundry. InDesign at least, lets you search for character style as an option, so you could search &amp; replace (say) 10-point small caps with 10.5, or whatever size seems to give the bit more emphasis you feel needed.</p>
      <p>FWIW</p>
