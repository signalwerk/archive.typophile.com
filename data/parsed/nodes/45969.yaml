      <p>Don, When I look to see what stands out, I read. Moreover, I read at least a page, not a single phrase. So here is the test. Set two pages of type (a spread) that has the words "Fanklin Delano Roosevelt about 15 times. See if that doesn't catch you eye -- unless you're a Regan Republican.</p>
      <p>A curmudgeon I remain; from my perspective, one of the problems with some typographers is they look at a small sample of type, in a certain context, and draw a(n almost absolute) conclusion. They aren't alone; editors are apt to do the same, though often their conclusions vary from the typographer. And of course the same could be said of me. But I remain convinced that the best answer to many questions about how to handle a text element visually will vary depending on the text itself, along with considering the intended audience. That's why design is more than memorizing a set of rules.</p>
