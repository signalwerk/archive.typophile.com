      <p>I've hit this problem. IMO, it's usually a sign of badly-written text. I was working on a publication for a government, you seem to have be working on one for a multinational corporation.</p>
      <p>If you can't rewrite the text, you ideally want a typeface with a small cap whose height is in between the x-height and the full cap. This is because when you begin a sentence with an acronym (and it will happen sooner or later), the small cap will be clearly too small otherwise.</p>
      <p>I was using Jeremy Tankard's Bliss (has x-height small caps) when I hit this problem, and I sent him an email asking for a solution. He was good enough to telephone me, but couldn't really offer any suggestion other that rewriting the text. In the end, I scaled up a lighter weight of Bliss to get the in-between caps I was after. I thought it worked OK, but I'm not sure what Tankard's opinion was.</p>
