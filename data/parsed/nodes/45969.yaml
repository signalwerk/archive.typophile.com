    <p>I'm setting text featuring a lot of TLAs, and whilst I know that the perceived wisdom is to set the acronyms in small caps, in the fonts I'm using (FF Scala Pro and FF Scala Sans Pro), the small caps don't seem to work. SP and SSP don't have a "petite" cap option.</p>
    <p>Based on the sample below, what do people think - am I so used to seeing the full height caps for these acronyms that my eyes are lying to me, or am I missing a third way?</p>
    <p>Best,</p>
    <p>Keith</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/smallcaps_5091.jpg"></div><p></p>
