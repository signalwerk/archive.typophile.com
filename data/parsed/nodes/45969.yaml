      <p>I beg to differ, Charles. </p>
      <p>&gt; spelled out, Franklin Delano Roosevelt would have initial caps, &amp; so “stand out.” </p>
      <p>No it doesn't. If it was typed FRANKLIN DELANO ROOSEVELT, then it would stand out. When the caps are separated by lower case letters, then the effect of a blob of caps is eliminated.</p>
      <p>The effect is not nearly so nasty with smaller acronyms and initialisms. Most people don't small cap US, because it then seems to become the word us, and creating confusion to the reader is much worse than having bad color through full caps.</p>
      <p>(All that said, I find the small caps in the original posting to be too small. Is there a rule that a designer must design his small caps to the x-height? That is fine for ITC type faces, but when the x-height is small I would think a better design is to be slightly larger than the x-height.)</p>
