    <p>Blessings of the Masses</p>
    <p>Blessings of the State</p>
    <p>. . . . . . . .</p>
    <p>I return to these Hallowed Halls in search of true Typographic Expertise . . . </p>
    <p>. . . . . . . . .</p>
    <p>In the September issue of FRIEZE magazine ( contemporary art ) I noticed a striking typeface which seems to come in quite a few flavors . </p>
    <p>The cover of the magazine ( seen here - <a href="http://www.frieze.com/" title="http://www.frieze.com/">http://www.frieze.com/</a> ) seems to have an OUTLINED version of the typeface. The INTERIOR of the magazine uses a SERIF and SANS SERIF version of the same / or similar / typeface . </p>
    <p>I have faith in the Typophile community.<br>
    Please let me know where I might learn more about this typeface .</p>
    <p>PLEASE SEE THE ATTACHED IMAGE . . . .</p>
    <p>. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</p>
    <p>EVER RESPECTFUL . my thanks and praise in advance . peace be with you .</p>
    <p>Aerosyn-Lex Mestrovic //  Brooklyn  // Tokyo // <a href="http://www.nontype.com" title="www.nontype.com">www.nontype.com</a> // <a href="http://www.thekdu.com" title="www.thekdu.com">www.thekdu.com</a> //</p>
    <p>.</p>
    <p>.</p>
