    html: |-
      <p>It is hard for me to tell as a typeface without seeing text.  I wonder if you may need to revist the outlines when you start spacing. The lc "i" in particular is an often used letter. I wonder how it would feel in text? It may get lost both because of slope and size.<br>
      You also have to decide if you are going the route of brush lettering, with its more regular forms, or a more random handwriting look.  You seem to be somewhere between right now.</p>
      <p>ChrisL</p>
