    <p>Hi all<br>
    Have been working on this script for the past few weeks, so it's still very early days. Alot of the weights are still inconsistent and the descenders have not made up their minds yet...<br>
    Would really appreciate any comments or suggestions...<br>
    This is attempt 1.5 at designing type (the first was a very confused lowercase which never made it even close to font lab)</p>
    <p>Thanks in advance</p>
