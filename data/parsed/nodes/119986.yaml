      <p>The <a class="freelinking external" href="http://code.google.com/p/i3project/wiki/Fonts" rel="nofollow">i3project</a> has some interesting fonts.  The Trim font is a proportional font with enlarged punctuation for use in coding.</p>
      <p>It would be easy to take an open source proportional font like Adobe Source Pro and replace its punctuation with the larger punctuation from Adobe Source Pro Mono.  Some of the spacing of the punctuation might need to be shrunk, but I think this might produce a reasonable result.  Worth a try, anyway.</p>
