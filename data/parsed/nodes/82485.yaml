    date: 2011-05-31T09:21:00
    date_raw: 31 May 2011 — 9:21am
    votes: null
    html: |-
      <p>QuickMatch allows you to find similar fonts in your collection based on what is in the preview. So, you could enter whatever text you want, then use QuickMatch to find similar fonts based only on the glyphs used in your preview. </p>
      <p>Font Snapshots allow you to create a font preview using any text you want that can then be dragged off to the desktop as a PNG file.  This is great for creative people who need to share what a font looks like without actually sharing the font itself. For example, this could be helpful when choosing a new typeface for a client's projects, and needing to get that client's approval. Font Snapshots are also anti-aliased to a transparent background so they can be easily used in other applications, websites, etc.</p>
