      <p>Hi there,</p>
      <p>We pre-announced Universal Type Server 3 this week. Full information will be publicly available in the coming weeks about the wide variety of new features that will be available in version 3. </p>
      <p>Briefly, the Font Usage reporting features will allow you to track activations, deactivations, additions and removal of fonts in your collection. Font licensing enforcement features will allow you to enforce the font licensing restrictions, either by strictly prohibiting more than a certain number of users from accessing a font, or by merely notifying the administrator when the font goes out of compliance. </p>
      <p>We also built quite a few new creative tools such as QuickMatch, Font Snapshots and more into the Universal Type Client. </p>
      <p>More info coming soon. Thanks for your interest.</p>
      <p>Jim Kidwell<br>
      Extensis</p>
