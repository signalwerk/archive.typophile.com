    <p>Has anyone here seen a demonstration of this release of UTS? If so, do you see it as a significant move forward from UTS and UTS2? Despite the fast approaching release date there is very little information on the Extensis website.</p>
    <p>If Thomas Phinney sees this, would you be able to give your perspective on the new release? I am particularly interested in the font usage reporting and font license enforcement features.</p>
