    html: |-
      <p>I’d consider Adobe Caslon Pro a book face but also a workhorse, so the lacking Italic Small Caps is a bit unexpected even though you rarely need them in book work. More complex work could definitely use both Italic SC and Petite Caps.</p>
      <p>I had to fake some small caps (just a couple of words) in a recent project. I decide to scale down the italic capitals, added a thin stroke to the shapes to match the weight and also nudged them ever so slightly up from the baseline (the same distance as the added stroke). I also streched them by about 110% and added a bit of tracking.</p>
      <p>Which way to go depends how much the italics differ from the roman and on the size you are using.</p>
      <p>IMO, speaking as a graphic designer, if you have two sets of SC the smallest should be slightly taller than the x-height and the largest just below the capitals (useful in capital heavy languages like German, and for genetive case with names in all caps). That’s up to the type designer, anyways.</p>
