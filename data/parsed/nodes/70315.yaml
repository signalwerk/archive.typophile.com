      <p>I generally provide a set of small-cap-height lining figures in my OpenType fonts.<br>
      Sorry, no Nick's Caslon.</p>
      <p>IMHO it is the "best practice" to have oldstyle figures as the default for the Small Caps feature, and small-cap-height lining figures as the default for the All Small Caps (c2sc) feature.</p>
