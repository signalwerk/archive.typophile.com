      <p>Your question was also a big trouble to me.</p>
      <p>Proper small caps usage demand a set of small caps figures. Some recent fonts already have this (Greta Pro, Comenia Pro, etc.). Lining figures are almost unusable with small caps a-z and the old style ones seem odd, somewhat misaligned. Anyway, if you don't have small caps figures, the old style is preferable. </p>
      <p>Proper small caps also demand complete style/weight variation. I never understood these fonts with SC in regular styles and without SC in italics. This makes no sense.</p>
      <p>I think the ideal solution is to have SC a bit higher than x-height, including figures and punctuation, and petite caps set exactly at the x-height. Vesper Pro adopts this. So you can handle mixed acronyms (like PostgreSQL) and have numbers perfeclty fitting the small caps height.</p>
      <p>I manage mostly technical and legal texts with lots of acronyms and numbers. The sub optimal result I get with SC and oldstyle figures in almost all fonts was the main reason I decided to develop my own font.</p>
      <p>I'm not sure if there is an alternative to Caslon Pro with complete SC features. Maybe the beautyful Calluna.</p>
