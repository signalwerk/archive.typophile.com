    html: |-
      <p>Common practice is to use full caps for three capitals in a row or fewer, and small caps for four or more and A.M. and P.M. You can use small caps for educational degrees too, as long as you use periods.</p>
      <p>If you decide, just because you have so many of them, that your own style should put three-letter acronyms in small caps, that will probably fly, but not two letters or one. So no, not for X-rated.</p>
      <p>In my opinion, if you absolutely need to fake italic small caps, it's better to slant real small caps than to fake small caps with real italics.</p>
