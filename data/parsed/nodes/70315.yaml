      <p>Thanks for your interesting replies.<br>
      In the end I chickened out and ditched the old style figures completely - a decision made reluctantly but I couldn't quite bring myself to fake it on the italics and others potentially updating the file in years to come won't necessarily understand what's been done and where. I'll definitely look out for italic small caps in future, but this particular project was too far down the line for a change of typeface.<br>
      Out of interest, what's the distinction between small caps and petite caps (@freiberger)? @frode frank you also mentioned having two sets of small caps, what are they exactly?<br>
      Thanks!</p>
