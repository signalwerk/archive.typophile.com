    <p>Hello</p>
    <p>I'm getting in a bit of a muddle with my old style figures, and wonder if somebody can clear this up for me?</p>
    <p>I'm setting a long text in Caslon Pro, using the Opentype version with its Opentype old style figures throughout the text. I noticed that words and acronyms involving both numbers and letters looked very odd, so I decided that I probably should be using Opentype small caps for acronyms. Is that the typographically correct approach? If so...</p>
    <p>- What do I do with acronyms in italics (e.g. a magazine whose name is an acronym)? There are no italic small caps in the font that I can see, so do I just create an inconsistency, or should I fake it using Indesign's Small Caps (not the Opentype small caps)?<br>
    - Are there some clear rules on when and when not to use small caps, for example, I'm unsure about the X in X-rated?</p>
    <p>Or should I simply revert to non-old style numbers?</p>
    <p>Thanks very much<br>
    Michael</p>
