      <p>RE = “Reading Edge.” See also: <a href="http://blog.webtype.com/?p=29" title="http://blog.webtype.com/?p=29">http://blog.webtype.com/?p=29</a></p>
      <p>This was David Berlow’s pet initiative, to develop faces specifically for optimum screen readability at small text sizes&nbsp;— essentially more Georgia/Verdana-quality screen fonts for @font-face. It involved pretty much all FB staff hands on deck for a while to prepare for the Webtype launch last summer.</p>
