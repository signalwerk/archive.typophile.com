  html: |-
    <p>Hi All - I'm admittedly struggling with the task of pairing PTF's Seravek with a serif, for an identity that would ideally also carry over well to screen/web. </p>
    <p>The aim is to stay mostly neutral with the feel of it all — complementing the little bit of humanity that Seravek has. After quickly ruling out anything too old-style or didone (mistake?), and personally not wanting to explore slabs (possibly a mistake also?), I'm left wondering whether a transitional serif is most appropriate. There is something not working for me with the transitionals I have to test with (Plantin, Utopia, etc.), though I can't pinpoint what is feeling off. Of course while testing, when I pair the transitionals with something like Helvetica - something more neutral than Seravek - the transitionals work just fine. </p>
    <p> In the effort to not abandon Seravek, I know there must be serif faces I am unaware of or not remembering that will somehow work. Any advice and ideas are much appreciated. This is proving harder than expected!</p>
