      <p>Nick, thank you very much for suggesting Scotch Modern! I think that I would end up buying at least a couple of fonts, if only to complement my collection of beautiful typefaces.</p>
      <p>Maxim, I never intended to judge the quality of Walbaum, Cyrillic-typography-wise; this was merely a comment on its glyph coverage. Do you have any suggestions for a similarly extensive typeface with a more native feel?</p>
