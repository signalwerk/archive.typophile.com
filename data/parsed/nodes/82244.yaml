  html: <p>I was quite dismayed to discover that Storm Type's otherwise excellent <a href="http://www.stormtype.com/family-walbaum-2010-pro.html" rel="nofollow">Walbaum</a> lacks Cyrillic small caps (even though it has Latin small caps) — any suggestions for a good replacement?</p>
  html_clean: <p>I was quite dismayed to discover that Storm Type's otherwise excellent <a href="http://www.stormtype.com/family-walbaum-2010-pro.html" rel="nofollow" class="link-external">Walbaum</a> lacks Cyrillic small caps (even though it has Latin small caps) — any suggestions for a good replacement?</p>
