    html: |-
      <p><a href="http://new.myfonts.com/fonts/shinn/scotch-modern/micro/" rel="nofollow">Scotch Modern</a> is a didone, but other than that, not much like Storm's Walbaum, which seems more like an old-style face, with its low contrast, heaviness, and simple terminals.</p>
      <p>But the Scotch Modern does have a similar "historically authentic" quality to Storm's Walbaum, both being conceived as micro-detailed facsimiles of the letterpress impression (informed by press gain and other traces of the printing process), rather than as cleaned-up, reductive revivals.</p>
