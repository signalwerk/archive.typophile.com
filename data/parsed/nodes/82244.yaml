    html: |-
      <dl>
      <dt><em>What do you find most objectionable in Storm’s Walbaum Cyrillic, Maxim?</em></dt>
      <dd></dd>
      </dl>
      <dl>
      <dd>The construction of most Cyrillic glyphs, like д, ж, и, й, к, л, ч, э, and others is questionable, bordering on arbitrary. The letter widths. The treatment of some finer details. Shown below is <a href="http://paratype.com/pstore/fonts/Elizabeth.htm" rel="nofollow">Elizabeth</a>, for comparison. This is what I would use for reference (not for copying!) if I drew a Cyrillic version of Walbaum.</dd>
      </dl>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Elizabeth_l_4274.c.gif"></div><p></p>
      <dl>
      <dd>Of course, the wavy terminals in the ц and the щ, the claw-like bottoms of the з and the э, the dangling tongues in the є and the э may feel too fanciful for a body text typeface; they could be offered as stylistic alternates.</dd>
      </dl>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Wavy_Terminals_5316.gif"></div><p></p>
