      sub c.calt1 @letter2 @letter2 @letter2 c' by c.calt2;<br>
      sub c.calt2 @letter2 @letter2 @letter2 c' by c;<br>
      sub c @letter2 @letter2 @letter2 @letter2 c' by c.calt1;<br>
      sub c.calt1 @letter2 @letter2 @letter2 @letter2 c' by c.calt2;<br>
