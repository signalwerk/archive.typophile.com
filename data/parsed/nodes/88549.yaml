      <p>How should I change my OTF code to get the line “I need“ (image link <a href="http://clip2net.com/s/1qAvm" title="http://clip2net.com/s/1qAvm">http://clip2net.com/s/1qAvm</a>)?</p>
      <p>My code:</p>
      <p>@letter = [b c d e f g h i j k l m n o p q r s t u v w x y z space];<br>
      @letter1 = [a c d e f g h i j k l m n o p q r s t u v w x y z space];<br>
      @letter2 = [a b d e f g h i j k l m n o p q r s t u v w x y z space];</p>
      <p>feature calt {<br>
      lookup rotate {<br>
      sub a a' by a.calt1;<br>
      sub a.calt1 a' by a.calt2;<br>
      sub a.calt2 a' by a;<br>
      sub a @letter a' by a.calt1;<br>
      sub a.calt1 @letter a' by a.calt2;<br>
      sub a.calt2 @letter a' by a;<br>
      sub a @letter @letter a' by a.calt1;<br>
      sub a.calt1 @letter @letter a' by a.calt2;<br>
      sub a.calt2 @letter @letter a' by a;<br>
      sub a @letter @letter @letter a' by a.calt1;<br>
      sub a.calt1 @letter @letter @letter a' by a.calt2;<br>
      sub a.calt2 @letter @letter @letter a' by a;<br>
      sub a @letter @letter @letter @letter a' by a.calt1;<br>
      sub a.calt1 @letter @letter @letter @letter a' by a.calt2;<br>
      sub a.calt2 @letter @letter @letter @letter a' by a;<br>
      sub a @letter @letter @letter @letter @letter a' by a.calt1;<br>
      sub a.calt1 @letter @letter @letter @letter @letter a' by a.calt2;<br>
      sub a.calt2 @letter @letter @letter @letter @letter a' by a;<br>
      sub a @letter @letter @letter @letter @letter @letter a' by a.calt1;<br>
      sub a.calt1 @letter @letter @letter @letter @letter @letter a' by a.calt2;<br>
      sub a.calt2 @letter @letter @letter @letter @letter @letter a' by a;</p>
      <p>sub b b' by b.calt1;<br>
      sub b.calt1 b' by b.calt2;<br>
      sub b.calt2 b' by b;<br>
      sub b @letter1 b' by b.calt1;<br>
      sub b.calt1 @letter1 b' by b.calt2;<br>
      sub b.calt2 @letter1 b' by b;<br>
      sub b @letter1 @letter1 b' by b.calt1;<br>
      sub b.calt1 @letter1 @letter1 b' by b.calt2;<br>
      sub b.calt2 @letter1 @letter1 b' by b;<br>
      sub b @letter1 @letter1 @letter1 b' by b.calt1;<br>
      sub b.calt1 @letter1 @letter1 @letter1 b' by b.calt2;<br>
      sub b.calt2 @letter1 @letter1 @letter1 b' by b;<br>
      sub b @letter1 @letter1 @letter1 @letter1 b' by b.calt1;<br>
      sub b.calt1 @letter1 @letter1 @letter1 @letter1 b' by b.calt2;<br>
      sub b.calt2 @letter1 @letter1 @letter1 @letter1 b' by b;<br>
      sub b @letter1 @letter1 @letter1 @letter1 @letter1 b' by b.calt1;<br>
      sub b.calt1 @letter1 @letter1 @letter1 @letter1 @letter1 b' by b.calt2;<br>
      sub b.calt2 @letter1 @letter1 @letter1 @letter1 @letter1 b' by b;<br>
      sub b @letter1 @letter1 @letter1 @letter1 @letter1 @letter1 b' by b.calt1;<br>
      sub b.calt1 @letter1 @letter1 @letter1 @letter1 @letter1 @letter1 b' by b.calt2;<br>
      sub b.calt2 @letter1 @letter1 @letter1 @letter1 @letter1 @letter1 b' by b;</p>
      <p>sub c c' by c.calt1;<br>
      sub c.calt1 c' by c.calt2;<br>
      sub c.calt2 c' by c;<br>
      sub c @letter2 c' by c.calt1;<br>
      sub c.calt1 @letter2 c' by c.calt2;<br>
      sub c.calt2 @letter2 c' by c;<br>
