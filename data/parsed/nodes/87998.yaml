    votes: null
    html: |-
      <p>sorry mate - can't say i like a thing about the cover... the picture - it's cheesy but - if it's the only picture available/in budget it can work with some photoshop... throw some colour over the whole picture? and you MUST remove all the wiring from the bottom left corner...</p>
      <p>now to the typography - what's up with the 2 different Fs?</p>
      <p>the "broken" font seems something more suited to a rock band stencilling onto a flight case rather than a refined gentleman's jazz album. there too is no refinement in the colours of the cover or the size of the name... or the relationship between the typograpghy and the photo. </p>
      <p>the photo suggests this is a chance for you to get to know the artist up close and personal - i'd suggest handwritten typography throughout the booklet to suit.</p>
      <p>the title of the album just doesn't fit there. the text fouls his shoulder, and in a case of "less is more" there are several ideas going on in the title... i like the text behind the picture effect but it doesn't work here either - the mic stand is too thin and the H is simply cut in half. there's a mustard coloured slug and the text changes colour for no apparent reason. all this happening on a busy picture with lots of background detail.</p>
      <p>i'd also encourage you to check your dimensions - on my screen it doesn't look square.</p>
      <p>having seen his piano art covered cd - i reckon you are way off the mark with this one.</p>
      <p>keep working on it - keep simplifying it... someone flipping through cds in a store has only a second or two to read, recognise and make a decision to stop before flipping on to the next disc.</p>
