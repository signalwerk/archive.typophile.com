    html: |-
      <p>I have to agree with the others, I think you need to take a step back, look at the subject, the market for the genre, then start. It is easy to 'finish' a project by doing something that may suit ourselves, but at the end of the day this cd cover has a number of jobs, yours is at the bottom of the list. It has to represent, the artist, and how he perceives himself and the market perceives him, it has to immediately hit a wavelength with those who will buy into his music, it has to give some indication or feel for the content of the cd. </p>
      <p>The definition of an appropriate font(s) is only part of he design process, and I know this is what Andreas was try to say, think about it there is more that needs to be addressed here than the font.</p>
      <p>Postitive input, start with the image, this is a jazz musicians cd cover it should reek style and attitude - this is jazz, this is not Bing Crosby's xmas cd. Get a great image with some attitude and style, the client playing the piano at a gig with stage lighting would be a good start. Make sure you image has plenty of space around it, the current image is shoe horned into the frame, and too 'in your face'. get rid of the cheesy smile. Then you can have a look at the type. You have two lines of type, the artists name, and the name of the album. If the artist is well known and the pending release has been well covered in the media, you can focus on the name of the album. If he is not well known, you need to focus on his name. The most important line will be the display line, the font should be in tune with the music, the font you are using at the moment is too childlike, it would be ok if he was sitting at a playdoh piano. Make sure the secondary line of type is in tune with the first, whether is is stroke weight, same feel, they must be complimentary. In the case of type size is important, in the instance of a cd cover it must be big enough to be seen when it is on the shelf, but not so big that it makes the album look cheap. Remember design is a process, the first step thought, think, what would a jazz fan pick up, and second, what will make my client look and feel good.</p>
    html_clean: |-
