      <p>I think you misunderstood me. I’m talking about curve quality. Right now, the symbol and the type have nothing in common. I think this is the reason your black and white logo does not look “stunning”. If you want to create a logotype, you should not ignore the most crucial part of the design: its shape.</p>
      <p>What if you draw the symbol as if it belonged to the typeface? How would it look then? How thick would the lines be? Would there be straight edges? How would the corners look? How would the whitespace relate to the whitespace in the typeface? How big would it be?</p>
