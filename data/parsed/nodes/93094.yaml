    <p>This is a logo I designed for a local Christian Ministry that is just starting out. The name is "Quest Ministries." I was originally going to use a compass as the ministry will help guide the people through life. But I thought it was too busy so I settled for this - a less complicated design but still has the direction idea to it. The logo with the four colors plays into their branding. The different colors symbolize different themes in their business. However, I made it two colors because I thought the four might be a little busy.</p>
    <p>I feel like the logo is fairly solid right now but it doesn't have anything in it that really makes it stand out. Any ideas? Suggestions?</p>
