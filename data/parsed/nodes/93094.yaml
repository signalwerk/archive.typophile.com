    html: |-
      <p>When I first saw this image, knowing that it referred to a Christian ministry of some sort, my first reaction was that "Quest" in that typeface looked very corporate (there is a Quest commercial medical lab services company, and their logo is widespread.) Quest Diagnostics apparently wants its logo to look solid and precise and reliable. </p>
      <p>Second, I read your logo as a star. OK, star ... Christian ... Bethlehem. But a star should be represented monochrome, with a light color. The multicolor options all seemed wrong if I was reading the logo as a star. Then, I thought, it might represent a cross, which would be a little better, but not much, in more than one color. But the symmetrical Greek cross is a little problematic, bouncing visually between a star image and the usual Christian Roman cross with one long lower leg.</p>
      <p>These, as I said, were my first impressions.</p>
