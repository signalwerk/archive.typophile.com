      <p>I see you're trying to relate the type to the symbol via color and stroke, but overall I just don't think the logo is working.  To me the symbol looks very generic (like clip art) and needs to be more distinctive.  The condensed type just doesn't convey the emotions of a quest to me. It needs some flair or mystery or excitement. And I think it's best to avoid thin strokes in logos.</p>
      <p>Keep working on it. Have you tried any of the things that folks suggested? Frank's idea of incorporating the symbol into the type is an interesting thought. For example, what if the Q was round (like the shape of a compass) with the symbol inside it?</p>
