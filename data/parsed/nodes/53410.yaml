      <p>Also have a look at Effra from Dalton Maag:<br>
      <a href="http://www.fontshop.com/fonts/downloads/dalton_maag/effra_standard_ot/" title="http://www.fontshop.com/fonts/downloads/dalton_maag/effra_standard_ot/">http://www.fontshop.com/fonts/downloads/dalton_maag/effra_standard_ot/</a></p>
      <p>To me Effra seems to be the sleeper font Gotham alternatives. Its reminds of Maag’s work for Tote which was based on PL Bernhardt and perhaps a dash of Avenir.</p>
      <p>Mike Diaz</p>
