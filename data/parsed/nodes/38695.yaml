    html: |-
      <p>A node appearing yellow probably means that one or both of its BCPs is retracted and overlapping. Alt/Option-click to drag the BCP off the node.</p>
      <p>The “Correct Connections” command in the Contour menu should fix incorrect sharp connections and turn any erroneous x’es back to o’s.</p>
