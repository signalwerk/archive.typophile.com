      <p>I would recommend that you use the colored way of handling nodes. You can activate in the preferences: Glyph Window &gt; Appearence.</p>
      <p>Then it would look like this, and it is easier to see what kind of node you are dealing with and if you double-click on a sharp node that could be smooth, it will automatically “correct” this node.</p>
      <p>RED = sharp<br>
      PINK = Smooth</p>
      <p></p><div class="imageWrap"><img src="/files/colorednodes_4373.png"></div><p></p>
