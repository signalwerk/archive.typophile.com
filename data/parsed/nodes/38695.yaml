    html: <p>Double click changes a node from corner to smooth and visa-versa. There is a problem with FontLab changing connections represented as smooth to corners—with the x instead of the o—when you re-open a glyph window (I think), or copy and paste a glyph (definite). As I understand it, this actually doesn’t change anything with the font when you export it, as the different node types are indications for convenience of designers, and not part of the font’s code. Still is it annoying, and hopefully they will fix it.</p>
