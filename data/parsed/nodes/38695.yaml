    votes: null
    html: |-
      <p>The node stayed yellow because its other BCP is still retracted. Alt/Option-click the node again and drag its second BCP down to the left. (Occasionally, Alt-dragging moves the node instead, leaving the BCP in place, I’m not sure why.)</p>
      <p><em>I have some nodes which have no BCP or only one. Which ideally should have another one</em></p>
      <p>“Yellow” nodes with retracted BCPs may look like they have one or zero BCPs, but the BCPs are there, in plain view, covering the node. Just Alt-drag them off.</p>
      <p>Alt/Option-dragging also works on sharp and tangent nodes. Alt-drag from the node to pull out a BCP, or Alt-drag from a straight line-segment to create BCPs from both adjacent nodes (convert to curve).</p>
