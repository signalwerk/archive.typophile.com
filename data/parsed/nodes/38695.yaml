    <p>Hi all,</p>
    <p>I’m working on a font where the node connections show up as sharp in the node propersites window when I’m sure it should be smooth.<br>
    Are there any reasons why this could be happening?<br>
    Is there a way fixing the nodes propersites to the correct connection or is it a question of going through each glyph and changing it in the node propersites window.</p>
