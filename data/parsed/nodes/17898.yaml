    html: |-
      <p>It is probably a knowledge thing, or a speed thing. The reason we indent is to give the eye an indicator where the next paragraph starts when reading. The first paragraph doesn't need one because the change of type styles from the head or subhead to the text provides that clue.</p>
      <p>Newspapers do not do this because they are built in a rush, and it simpler to have just one style for all body copy, quickly applied, or more likely, a default. English teachers don't allow the unindented first line through the lack of knowledge reason ... and generally won't bend even when you show them the correct method in various textbooks.</p>
