      <p>I just reviewed what Walter Tracy did in his <a href="http://www.amazon.com/gp/product/1567922406/qid=1139883948/sr=2-1/ref=pd_bbs_b_2_1/103-0764369-2392622?s=books&amp;v=glance&amp;n=283155" target="new" rel="nofollow"><em>Letters of Credit</em></a>, US first edition, 1985 --</p>
      <p>His book is divided into two main sections, PART I and PART II.<br>
      <em>PARTs I &amp; II</em> are divided into key topics headed by regular sequential numbering and larger point size bold heads and a 1 pt. solid rule underneath (<strong>4. Legibility and readability</strong>).</p>
      <p>The first paragraph below the topic head is NOT indented, and subsequent paragraphs ARE indented (approx. 1 em+). </p>
      <p>BUT even under a main topic, if there is a sub-section or change in subject EVEN without a subhead, he does NOT indent but instead does a double line space. Wow... talk about style.</p>
    html_clean: |-
