      <p>Newspaperreporters were (are?) supposed to write in paragraphs in such a way that omitting/deleting some para's in the long copy wouldn't impair the meaning of the piece, so that the editor responsible for the make up could do that if spacerestrictions required it. Hence the uniform composition. (Talking about lead and photoset type of course).</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
