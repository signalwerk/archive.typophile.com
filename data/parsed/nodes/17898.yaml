    <p>Hi, </p>
    <p>I am getting started on a medium size document in InDesign CS2.<br>
    This is my first big job in formating a lengthy document and I wanted<br>
    to get everything right, as far as paragraph standards go.<br>
    Is there any rule to the way you set the first line left indentation or<br>
    anything else for that matter, which is a must to consider when doing<br>
    a reasonably a document like this? (28 pages including cover). </p>
    <p>I am really fussy when it comes to typography, but I find that I don't<br>
    know enough about paragraphs etc. Any help would be so greatly<br>
    appreciated also links to manuals etc would also be appreciated. </p>
    <p>Kind regards,<br>
    Josh</p>
