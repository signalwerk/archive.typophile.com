      <p>I second (or third) what's above - don't indent the first paragraph (or the first after a head) but do indent all subsequent paragraphs. Also, don't indent a paragraph following a line or section break even if there is no head.</p>
      <p>As to how much to indent, I think it depends on your line length. Sometimes a paragraph indent of 2 or 3 picas can look nice, but not on a short line width.</p>
