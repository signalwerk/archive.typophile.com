      <p>&gt; <em>Also, I got my chops busted once for doing what seems to be the general consensus here, as it’s ‘inconsistent’ — not that I agree with that.</em></p>
      <p>Here is where a little bit of knowledge is a bad thing, and the conflict between conventional essay writing/business communications style rules conflict with higher-end publishing techniques.</p>
      <p>You can't appreciate what you don't know, so many new editors or corporate communication "boses" constantly fall back on sytle rules that got them though college.</p>
      <p>Fine printing and quality typography is best appreciated by the best of publishers. </p>
      <p>I am now working on a 250+ page book with 100+ historic photos and have set up a page spread with left and right page grids mirroring each other. Photo captions all are placed at outer margins as annotated text. </p>
      <p>At first, the author liked it, but now, three chapters into the book he'd like to see all pages symmetrical, placed centered on the page with equal inner and outer margins... very vanilla! He's the writer AND publisher who is paying for the project. I'm putting together comparitive layout samples to convince him otherwise... we'll see what happens.</p>
