    html: <p>Beyond echoing the above comments on Bringhurst and Tracey, I would add that one of my bibles in this department must be a 1954 book by Geoffrey Dowding, reprinted 1966, entitled "Finer points in the spacing and arrangement of type". Apart from being one of the most beautifully printed English language volumes in my type-library, I think this book is worth its weight in gold. Another interesting volume is Ari Rafaeli's "Book typography" (British Library and Oak Knoll Press, 2005). There is also Derek Birdsall's "Notes on book design" which also has some very interesting things to say about grids.</p>
