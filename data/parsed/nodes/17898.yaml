    html: |-
      <p>Without referencing any source at this moment, typographers often depending on the project (novel, non-fiction, reference material, scientific journal, etc.) will establish there own "style guide".</p>
      <p>Personally, on extended text I start the first line of the very first paragraph of a chapter opening flush left, followed by indents for subsequent paragraphs.</p>
      <p>Here is where some typographers differ: Whenerver a new section starts within the chapter that uses a bold or large point size sub-head, I follow the same style and make the very first line flush left, followed by indents for subsequent paragraphs.</p>
      <p>I've noted others using only a flush left line for the opening paragraph and indents throughout even after sub-heads.</p>
      <p>The choice is yours. A good bet is to quickly pick up any quality printed books within your reach to see what others have done.</p>
