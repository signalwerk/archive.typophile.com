    html: <p>I remember it being in the afternoon listening to I believe BBC Radio 2.  <br> <br>I remember feelling a bit foreign.  <br> <br>I remember it being the second of two sad events. The first being coming back to Seattle NOT voting for george bush and seeing FOX and CNN show the country falling apart.  <br> <br>I remember emailing and calling my friend Mimi who lived near the trade center. She was in a cab and had a dentish appointment the bottom of one of the towers, but she was 15 minutes late... good ol' Mimi... we missed our flight to Berlin once since she was late but this one was much better.  <br> <br>I remember finding out a childhood hero Garnet 'Ace' Bailey a member of the 1972 Stanley Cup champs Boston Bruins died in the second plane to hit the towers. This is a photo from the 1972 Boston Record American I have.  <br><img src="http://www.typophile.com/forums/messages/30/15961.jpg" alt="acebailey"> <br> <br>I remember it as being the start of laying low Yankee boy when you're in Brixton.   <br> <br>I also remember it's the day Paul McCartney died. <br> <br>I also remember my girlfriend saying she remembers being in her flat near the MI6 building in London when the Real IRA shot a shoulder launched missel into the MI6 building from the car park outside her flat.. or at least that's were they found the anti-tank missel launcher.  <br><a href="http://news.bbc.co.uk/1/hi/uk/935058.stm" target="_blank">http://news.bbc.co.uk/1/hi/uk/935058.stm</a></p>
