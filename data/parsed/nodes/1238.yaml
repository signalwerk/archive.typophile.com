    html: "<p>In the immediate aftermath of the attacks, for a couple of weeks, I think there was an increase in kindness and concern for others that was pretty widespread in the USA. It's the natural first response to tragedy, to try to help, to try to support, and only later do people start thinking about blame and revenge. I remember Tom Milo at the ATypI conference in Copenhagen, relating the epic story of his roundabout journey from California back to Europe in the aftermath of the attack: he described the consideration shown to everyone stranded at the various airports, the volunteerism, and the lack of selfishness, and remarked that he'd felt privileged to have been there and witnessed it. This from someone else who was in Lebanon during the civil war, albeit as a UN intelligence officer rather than as a civilian with the front line in his living room. <br> <br>It was only as the dust settled, literally, and the people like Ashcroft and Rumsfeld began to exploit the situation that the ugly side came out.</p>"
