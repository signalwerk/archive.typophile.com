    html: "<p>It's depressing - and eye-opening - when one realizes that the $160,000,000,000 spent (so far) dropping cluster bombs, napalm, and depleted uranium on Iraqis could have been used to: <br> <br>1. Pay <i>all</i> the debt of Africa. <br>2. Feed all the starving children in the world. <br>3. Provide the educational needs of every child on the planet. <br> <br>9/11 could have persuaded those in power to do more good for the world. Instead, it showed us what power and opportunity (even in \"democratic\" countries) do to people. At least it was educational. <br> <br>Paul</p>"
