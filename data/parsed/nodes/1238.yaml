    html: <p>I'm so glad John and Hrant and Steve (and my partner as well) said what I've, as an American, been afraid to. One generally doesn't, not here, not in my semi-rural part of Pennsylvania. <br> <br>What I remember most about 9/11, is actually after 9/11. Americans became kinder, more patient and were jolted out of our standard-issue self-absorption. I had to travel shortly after the attacks and saw this attitude shift in full effect at the airports I passed through. Previously, few things seemed to bring out  the "me first," rude, cold, rushed, bad behavior like flying. But this time... strangers made eye contact, spoke to each other and were helpful. There was a warmth and solidarity generally missing in our society. <br> <br>I am sad to say it hasn't seemed to have lasted which makes this period all the more memorable.</p>
