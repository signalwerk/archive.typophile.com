    html: "<p>&gt; leadership in the poor countries needs to change <br> <br>No, the attitude of the people with power (ie Americans) has to change, because the US can change any regime it wants with a snap of the fingers - but of course only governments whose toppling is useful to Big Business suffer that fate. The US created Saddaam, but now that they need the borders of Iraq to serve as their self-validating terrorist threat (now that Afghanistan is no longer useful in that capacity) as well as a source of oil alternative to Saudi Arabia, they got rid of him (quite possibly by simply telling him it was time to go). There are so many realities you conveniently ignore, it's impossible to think you're doing anything but rehashing what you were fed as a child. <br> <br>And if Americans really wanted to, a fraction of the people who currently starve to death would suffer that fate. But they don't, because their system has taught them to care first and foremost about their selves. Your society is decrepit. A simple rummage through the trashcan of the average American establishes this instantly. <br> <br>With power comes responsability - this is the one thing that the US has to take to heart, otherwise it will continue to be the overgrown teenager with the biggest club. The entire foundation of your political thought is based on the contrivance that your government is sound. It is not. Your leaders are murderous thieves, and worst of all the population supports them - not because they're as bad, they don't realize what's going on - but because they've been brainwashed since birth to think the US is good overall. It is not. It has become the single greatest cause of misery to the greatest number of people on Earth. Why? To feed its own obese shell of a society. <br> <br>-- <br> <br>You're severely outnumbered here for one reason only: this is an international forum, with people who have not suffered your brainwashing. The saddest thing is that it will take decades and many more large-scale attacks on the US for you to finally snap out of it. You are being sent to slaughter to make rich people richer. <br> <br>hhp <br></p>"
