    html: "<p>Is it any wonder that countries are turning against America and Europe. <br>1. Yes, Bangladesh is subsidised and yes, the government has corruption problems, but at Cancun, while Koreans stab themselves to death, America and Europe are trying to destroy the alliance of G21. G21 are seeking to stop richer nations dumping their subsidised surplus goods on markets where local farmers cannot compete.  <br>The world's poorer countries lose a total of $24bn a year because of the subsidies paid to farmers by rich nations, according to new research by economists in Washington. <br>In addition to the $24bn lost by poor countries, a further $40bn in agricultural exports could be generated by developing countries if protectionist policies were abandoned by developed nations. <br>Current subsidies per cow: <br>EU: $803  <br>USA: $1,057  <br>JAPAN: $2,555 <br>2. International trade rules are agreed between countries at meetings of the World Trade Organisation (WTO). Every country that is a member of the WTO is entitled to be represented and is governed by international trade rules. The US has 250 permanent representatives at the WTO while Bangladesh has only one. Many countries cannot afford to have any representatives. <br>3. Iraq is not poverty-stricken, it has huge oil resources and a well educated population, if it is allowed to trade fairly it will lift itself out of poverty - the $75bn is more in the line of replacing infrastructure destroyed by warfare (much of that amount going to American corporations). <br>4. Depleted Uranium is used to increase the effectiveness of armour piercing weapons - artillery shells, aircraft ordinance, missiles.</p>"
