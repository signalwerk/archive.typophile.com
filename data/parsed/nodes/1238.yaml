    html: <p>Steve, because my wife has worked for many years on problems of poverty in less developed countries, I discuss them practically every night, and am very well aware of the challenge of helping these countries.  <br> <br>The view of my wife, who comes from one of these countries, is that the primary responsibility for the misery of these countries is the leadership in them, and that those in the West who think that the US or Europe controls everything are patronizing and wrong. The indulgence and support of rotten regimes by both America and Europe have, though, exaserbated the problems.  <br> <br>I am very distressed about our policies that hurt poor countries. And I am in despair that the left and the right are pretty clueless about what is actually going on.  <br> <br>For example, GW recently paid off rich American farmers with huge subsidies - against his supposed free market principles and in a craven attempt to buy votes in farm states.   <br> <br>This move will wreck the ability of legions of farmers in poor countries to earn a livelihood from farming, and drive them in desparation to the city slums - and incidentally many poor central americans across our borders. The only thing that can be said not to condemn this policy as distinctively devilish is that the agricultural policies of the European Union are even worse - More protectionist, more subsidies undercuting the ability of those in poor countries to making a living by competing fairly.  <br> <br>Since trade arguably has a much bigger impact than aid on the poor countries are you denouncing Tony Blair and Jacque Chirac and other European leaders for causing the starvation of millions? Or is your ire just reserved for GW?  <br> <br>European anti-americanism is a cheap substitute for real understanding and sound policy.  <br> <br>-Just blame the US and get indignant, when in fact the problems and the solutions are very complex, and involve the US and Europe and Japan changing their policies. And most of all the leadership in the poor countries needs to change or actually starting to care about their people. Whenever they do, the countries actually experience economic growth, and fewer people go hungry.  <br> <br>Are you denouncing those in poor countries who are actually most responsible for the plight of their people? Or only the US?  <br> <br>I see simplistic, conspiratorial thinking going on all the time. People scream about symbols while the substance of policy is neglected.  <br></p>
