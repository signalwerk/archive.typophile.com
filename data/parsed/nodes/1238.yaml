    votes: null
    html: <p>My son was less than half a mile away, near the Brooklyn Bridge, when the burning towers collapsed. In that moment he lost his youth, though he is still in his 20's. <br> <br>He followed a path like many of his computer-studies classmates of working in the dot-com boom, and then going to work for financial companies after the bust. Three of his graduating class were murdered in the 9-11 attack.  <br> <br>Art was used to express grief and anger. My son told me that a poster immediately appeared many places in lower Manhattan - where my son and daughter (she watched the collapse from her rooftop at a safe distance) live. <br> <br>It was never photographed or reported in the press, to my knowledge. It was a variation on the famous 'I want you' recuitment poster with 'Uncle Sam' pointing at the viewer. (I know it is based in turn on a British poster.) The variation was that instead of pointing at the viewer, Uncle Sam had an upturned middle finger, and the caption was 'We're coming to get you motherf***er.'  <br> <br>&gt;This good guys v bad guys stuff is ridiculous. <br> <br>I agree that being simplistic is a very serious problem in political thinking, especially about foreigners. But there are bad guys. The Taliban qualify. They deserved what they got.  <br> <br>America is often the good guy and sometimes the bad guy. It is complicated. But the knee-jerk anti-Americanism I read on these boards I think is seriously misguided, and the product of simplistic and dangerous 'black and white' thinking. It is a cheap way to feel superior, not a result of real understanding.   <br> <br>The main problem with it is not that America doesn't do stupid and bad things. It is that most governments in the world are so much worse that they can't even be mentioned in the same breath as far as badness. My wife has worked all over the world in a UN organization, and is of the very well informed opinion that the reason most of the poverty and misery in the world is due to bad governments, many of which have been just gangsters, mafias. The US government is not, and never has been this bad, and that is why it has peace and prosperity - uneven though these are - within its borders.  <br> <br>Right now the US is at its peak of power in the world. If the Taliban had the same power, you would know what bad is.  <br> <br>Also this stuff about the US being so narrow minded and intolerant is crap. I am in an inter-racial marriage, and know people here from all over the world, including many multi-national and multi-racial couples. And they vote with their feet to come here because it is so tolerant. Again, this is by comparison. There are plenty of American bigots. It is just that most other societies are much more intolerant than the US.  <br> <br>I don't particularly want to argue about all this on these boards. I want to learn about type from all of the wonderful typofiles here. But on this day, as the question was raised, I thought it might be appropriate to introduce a little balance and get people to think twice about their knee jerk anti-Americanism.   </p>
