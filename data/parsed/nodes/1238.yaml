    html: <p>I was listening to WNYC our classical non-profit station when it suddenly went off air, I turned on News 1 New York and saw the first tower was hit. Thats where WNYC's tranmitters were, as I was watching I saw the 2nd jet live go into the 2nd tower. It was desturbing enough I had to get out on my bike in Central Park. I was riding for about 1/2 hour when steams of people were walking across the park, I didn't associate it with the WTC, but what happened is the city shut itself down and since the trains weren't running they had to walk home. The by product of the tragedy is Mahanttan had been in a bad recession and was made worse. We are still in recession two years later. </p>
