    html: "<p>&gt; The scale of the New York attack was impressive for non-state sanctioned killing <br> <br>Especially when you consider how cheap it was to carry out (~$200,000). <br>The US has to spend millions of dollars to kill 3000 people, and billions to occupy the land they used to live on. <br> <br>&gt; people who were not there <br> <br>I was there. Not in Manhattan on that one day, but in Beirut for years. And I still agree with you! <br> <br>James's tragic recollections reminded me so much of home: the phosphor smell from the hi-tech Israeli bombs that hit my dad's laboratory/office, the smell of my dog's urine stain that I was trying to clean from one of our Persian carpets as one of my uncles suddenly showed up to tell me that his brother had been assassinated, the furious wail of a Druze mobile Katyousha battery using our building as cover to random-bomb the Phalangist Christian neighborhoods, the uneasy silence during my 2-4 AM shift guarding my high school with a Chinese imitation of a \"Klashin\", the symbolic but awesome shelling of a deserted Syrian outpost in the Bekaa Valley by the meter-wide cannons of the New Jersey warship five miles off the coast, and the hopeless but almost festive firing of anti-aircraft guns at it, with the vermillion flare rounds bouncing off the surface of the Mediterranean repeatedly, like some ethereal ballet - and so many other utterly unforgettable things. I think people with childhoods like that can be forgiven for being a little crazy. <br> <br>hhp <br></p>"
