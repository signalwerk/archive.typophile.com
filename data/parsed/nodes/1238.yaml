    html: "<p>People all over the world get killed in huge numbers with awful frequency. It is terrible and it is frightening and most of the time no one gives it much thought. The scale of the New York attack was impressive for non-state sanctioned killing, but there are people who spend every day for years living with terrorism and war in their towns and cities. So perhaps this is how we should remember '9/11': by calling to mind the people who have lived through so many atrocities that they don't keep track of the dates any more.</p>"
