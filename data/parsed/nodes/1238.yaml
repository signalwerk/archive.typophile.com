    html: '<p>The best way to commemorate this date would be to support a cause that can stop continuing senseless death.  <br> <br>Rather than concentrate on a single undoubtedly horrific, tragic act of violence, we could concentrate on the fact that the same number of children die every single day worldwide of starvation (according to the UN) as died in the twin towers. Just try and picture that in your head. <br> <br>This website recently put an interesting perspective on global poverty: <a href="http://www.globalrichlist.com/" target="_blank">http://www.globalrichlist.com/</a> <br> <br>Go do something positive to help today. I am going to try and do just that.</p>'
