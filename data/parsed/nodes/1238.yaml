    html: <p>Part of the problem, I think, is that Americans rely on American media for their news -- and American media rarely report the brutality the U.S. inflicts on other countries. Chile, Nicaragua, El Salvador... The School of the Americas (excuse me, I mean WHISC)... we recoil at the barbaric rule of other countries and the single-minded torture they carry out, but it's by no means metaphorical to say that the U.S. uses those same means to achieve their political ends. <br> <br>I feel sick every time I hear someone say about Sept. 11, "The world changed that day."  Many were killed, many still grieve, and many had a sense of safety ripped away, but the world did not change.  <br>  <br>By the way, I've listened to National Public Radio all day today and yesterday, and haven't heard one mention of Anna Lindh. That is sad.</p>
