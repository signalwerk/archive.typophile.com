      <p>This typeface takes a lot of ignoring what you know. The first time Paul showed it to me I had this knee-jerk reaction and asked him with the strokes were so out of balance. After playing with it for a while I've really come to enjoy it. It is quirky -- for my modern eyes -- but that was the spencerian style which we no longer have with us today.</p>
      <p>Paul, what exactly is giving you fits? </p>
      <p>I see what you are saying, Claes, but I think the irregularity was part of the style. They could twist and bend and flare the nib to do all kinds of crazy things.</p>
