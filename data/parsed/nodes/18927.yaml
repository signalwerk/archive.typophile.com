      <p>Ok,both my knees were jerking! Paul, seeing your new Zaner and Allyson--Congratulations!--I see in Zaner is possible to unbalance characters in a way that works in the overall look. I tend always to think 'text font' and think things should be balanced to a fare-thee-well, while keeping liveliness. But I see there is another way to go for this kind of font. I don't think you captured it yet here as well as in Zaner, and don't have a clue how to go about it, but good luck!</p>
