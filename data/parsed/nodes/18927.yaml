      <p>First, this is a definite improvement. Going through it in detail will be WORK. But generally speaking: I would look at how the x-height verticals balance with the ascenders, how the ascending loops balance with the straight strokes, and again the balance of eg the left and right side of the n. </p>
      <p>Two more general points. Scripts have their logic, and I know the copperplate style has its own pen logic. And then you will decide where you want to violate pen logic. Eg I think pen logic would make the right of the n at least as heavy as the left. I don't know enough about the history of scripts to be of any use, but studying the best of formal scripts, like Bickham and Snell Roundhand I'm sure will tell you a lot. </p>
      <p>Finally do you know 'Fonts and Logos' by Doyald Young? He is mind-blowingly good at getting even color in scripts and logos, and the book discusses a lot of this. This book taught me that it really pays off to be very fussy about this stuff, as it makes all the difference in the polish of your final result.</p>
    html_clean: |-
