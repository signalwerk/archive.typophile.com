  html: |-
    <p>Hi,</p>
    <p>I'd appreciate any comments on my display typeface design called Fillit.</p>
    <p>It's nothing fancy, new or groundbreaking –&nbsp;being very novice in type design I did it as an excercise for myself only. The design goal is to create display font for newspaper section headlines that has 1. slab serif general form 2. has plenty of pop = lot of ink per character 3. can form very tight headlines without letters touching each other. 4. to be used in &gt;72 pt</p>
    <p>There's a brief specimen attached. I haven't finished all the characters – trying to finish smaller set before doing too much work.</p>
    <p>Don't hesitate to be crude :)</p>
