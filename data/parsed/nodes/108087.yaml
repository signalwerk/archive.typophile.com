      <p>The copyright of a digital font usually denotes it's debut year in digital form (for a specific publisher).<br>
      If you go to this page:<br>
      <a href="http://www.myfonts.com/fonts/berthold/ag-old-face-bq/" title="http://www.myfonts.com/fonts/berthold/ag-old-face-bq/">http://www.myfonts.com/fonts/berthold/ag-old-face-bq/</a></p>
      <p>you can see this is a redraw of an older face:</p>
      <blockquote><p>In 1984 H. Berthold released this redraw of Akzidenz-Grotesk by Günter Gerhard Lange.<br>
      This design emphasizes the 19th Century hand-setting roots of the original Akzidenz-Grotesk.<br>
      Designers: Günter Gerhard Lange<br>
      Design date: 1984</p></blockquote>
