  html: |-
    <p>I am not an expert on font, but I love them, and I love to search for the right look.<br>
    I am a web designer and this time I found a font that I like, but it has not free license for using it on the web as Font Face.</p>
    <p>I think that it is a Knockout, here there is an example on how it looks the style that I am looking<br><a href="http://www.flickr.com/photos/littlemad/5078463972/">http://www.flickr.com/photos/littlemad/5078463972/</a></p>
    <p>and I would love to have an alternative similar of the font, with free license to use on the web. Anyone has an idea, what you suggest?</p>
    <p>I have to do some css animations, and I need that it is a font and not a graphic so I can convert it in SVG and be sure that looks good in every screen.</p>
    <p>Thx in advance for all your effort :)</p>
    <p>p.s. do not think even for a second over Impact, ehehhe :D</p>
