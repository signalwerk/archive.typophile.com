      <p>OK, I can't take it anymore, another fancy-schmancy new font manager that <em>doesn't</em> have auto-activation (at the very least for InDesign). Come. On. People. Is this seriously a non-issue for other Windows users? Does it not make anyone else nuts that all of the current font management tools do essentially the same thing <em>except</em> auto-activation?</p>
      <p>I can organize my fonts without a management tool, I can explore all of the glyphs in the InD palette, does anyone really print specimens? (proofs of a mock-up show you how the type holds up in action, not a specimen), and I can fairly easily activate any group of fonts simply by tossing them into the Windows fonts folder, but the one thing I can't do is have my fonts auto-activate when I open a project in InD.</p>
      <p>Don't get me wrong, I use and have used Suitcase 9 for a couple of years, and am quite happy with it, but I'm beginning to chew off my fingers waiting for an Extensis upgrade or Linotype to crank out their rumoured FX for Windows that will bring my sleeping fonts to life when I need them.</p>
