    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 26.Jul.2006 3.51pm </div>
      <p>We are pleased to announce the release of MainType 2.0 for Windows.</p>
    <p>MainType 2.0 is the most advanced and easiest to use font manager for<br>
    Windows. Not only because it has a very attractive user interface, but<br>
    mainly because it supports all font formats, is fully Unicode aware and<br>
    extremely fast.</p>
    <p>Download it here: <a href="http://www.high-logic.com/download.html" title="http://www.high-logic.com/download.html">http://www.high-logic.com/download.html</a></p>
    <p>Buy it for only $40 here: <a href="http://www.high-logic.com/register.html" title="http://www.high-logic.com/register.html">http://www.high-logic.com/register.html</a></p>
    <p>Check out some Screenshots here:<br>
    <a href="http://forum.high-logic.com/viewtopic.php?t=1494" title="http://forum.high-logic.com/viewtopic.php?t=1494">http://forum.high-logic.com/viewtopic.php?t=1494</a></p>
    <p>MainType 2.0 contains several new features and enhancements. The font export<br>
    feature, that is used to export font collections to the web, now includes<br>
    greater customization options. With this release, MainType reveals even more<br>
    important typographic data, like Unicode ranges, internal font tables, and<br>
    the number of kerning pairs. It also contains a new Browse Favorites feature<br>
    that makes it easier to browse through several font collections.</p>
    <p>Because this new version is free for all existing customers of MainType, we<br>
    encourage all users to download and install this new version over the<br>
    existing installation.</p>
    <p>Download it here: <a href="http://www.high-logic.com/download.html" title="http://www.high-logic.com/download.html">http://www.high-logic.com/download.html</a></p>
    <p>Buy it for only $40 here: <a href="http://www.high-logic.com/register.html" title="http://www.high-logic.com/register.html">http://www.high-logic.com/register.html</a></p>
    <p>Thanks,</p>
    <p>Erwin Denissen</p>
    <p>High-Logic Typography Software<br>
    <a href="http://www.high-logic.com/" title="http://www.high-logic.com/">http://www.high-logic.com/</a></p>
