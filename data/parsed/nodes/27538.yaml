    html: |-
      <p>I’ve never used Melior myself but they say it doesn’t work for long texts (like books) but looks great in short ones. X-height is kind of large, so good legibility of the letterforms, but requires more leading for body text. </p>
      <p>I think it has kind of a friendly, slightly old-fashioned feel to it, sort of like Souvenir or Cheltenham, but maybe that’s just me. It feels very 70s somehow. Somebody who was old enough to experience that decade will probably find it attractive and familiar.</p>
      <p>Melior is based on the “super-elipse” (a squared-off elipse) which was advocated by a Danish poet called <a href="http://en.wikipedia.org/wiki/Piet_Hein_%28Denmark%29">Piet Hein</a> who thought it was the most beautiful of all forms and spent a lot of time talking about it. He thought it should be used in everything from furniture to city planning. Maybe the designer took a clue from him?</p>
