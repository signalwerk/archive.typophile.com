      <p>I'm editing this thread - so it will fall out of order (grrrr) and make Tiffany's comment seem strange.</p>
      <p>A few EULA requests:</p>
      <p>1. Allow embedding.</p>
      <p>2. Allow transferring. If I have no use for a font after a job is done I'd be happy to turn the license over to the client along with the font.</p>
      <p>3. Allow the font to accompany the job to the printer without requiring the printer to purchase an additional license. </p>
      <p>4. Allow making a backup copy for archiving purposes. </p>
      <p>5. Make the license per user, not per machine.</p>
      <p>It is my belief (as stated in other threads) that absent any ability to effectively police users, overly restrictive and/or wordy EULAs encourage violation, or encourage designers not to buy fonts. I don't read most EULAs word for word, but I don't resell or give away fonts either. I just use them to get my work done. It ought to be that simple.</p>
