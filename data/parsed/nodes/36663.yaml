      <p>Fonts are a valuable asset in the toolbox of every designer and form an integral part of publishing, design and branding. It takes great design skill, experience and technical expertise to design and engineer a font which will perform across different environments. At Dalton Maag we carefully consider every curve, every serif; we consider the positioning of accents and superior numerals. But designing a font is an ongoing process; once a standard character set is published, we begin to plan expansion to other languages, or possibly more styles. We know the same is true for many of our colleagues in the font industry. This effort needs to be financed and protected to avoid unwitting or unscrupulous font piracy. It is why each commercial font has a legal contract, called an End User Licence Agreement (EULA), attached.</p>
