      <p>I would never even consider buying a font that requires the printer to also purchase said font. </p>
      <p>Allow embedding. At the very least allow non-editable PDF embedding, and if you aren’t going to allow web (Flash) embedding, make it easy for customers to purchase a license for web embedding without having to negotiate terms. This will be good for your business as SIFR catches on, and especially good when the W3C and Microsoft get web embedded fonts worked out and cross-browser web embedding is a reality.</p>
      <p>Allow alterations for internal use, provided that the font is not embedded.</p>
    html_clean: |-
