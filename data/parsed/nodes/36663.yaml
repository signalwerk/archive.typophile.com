      <p>I fully agree with you. My continuing education on the subject cements my belief that "the EULA" actually represents a spectrum of EULAs over time, and a rank of EULAs for the customer base at any given time. The overriding goal of course, being to provide with the software, an agreement that is understandable and workable for the legal user of any language. So, in order to do this, a bidirectional education, like this thread, or any one of the hundreds of conversations we have with clients, is part of that tool.</p>
      <p>Cheers!</p>
