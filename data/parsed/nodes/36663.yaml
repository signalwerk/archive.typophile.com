      <p>The legalese language EULAs are written is in fact one of my concerns. I don't understand half of it either.</p>
      <p>It is my aim to have the EULA worded as simply as possible. If we can't do that - because of the legality of it - we intend to have a translation set up. However, this, again, needs to be approved by a lawyer and could (probably) not be considered legally binding so as not to contradict the EULA in the first place.</p>
      <p>The process of buying a font is intrinsically linked with the EULA. It's always stumped me why font buying, particularly in the domain of multiuser licenses and corporate environements has to be such an aruous process. With the EULA we also aim to hopefully achieve very simple proceedures for multi users and all sorts of other things. We have written up a list of what we feel we need to cover. I am not going to publish this list here, though, since I do not want to prejudice your thoughts.</p>
      <p>Tiffany, did not Adobe recently update its EULAs? From what I understand they have now stopped allowing people making modifications to fonts. I will have to read through it, though.</p>
      <p>Bruno</p>
