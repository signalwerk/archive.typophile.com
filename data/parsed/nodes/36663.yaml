      <p>A few thoughts and pet peeves about EULAs:</p>
      <p>Restricting the number of backups is nutty, and benefits no one.</p>
      <p>I think allowing embedding is essential, and allowing modification is very nearly essential.</p>
      <p>I'm not as concerned with the language of the EULA, although plain language is always preferred. </p>
      <p>Chester's EULA is great, just great.</p>
      <p>Concerning Adobe's EULA, there's been much discussion around here about what sort of mods it allows, but Adobe's font FAQ is pretty clear (I quote from <a href="http://www.adobe.com/type/browser/legal/pdfs/FontFAQ.pdf" rel="nofollow">this pdf</a>, which I found on their site today, so I'd say it's current:</p>
      <p>"11. Can I customize a font using font manipulation software?<br>
      You are allowed to use font manipulation software to modify the font software to produce “derivatives” of fonts licensed from Adobe, as long as you use the derivatives in accordance with the same licensing terms that accompany the original fonts. For example, you can use Macromedia Fontographer or Pyrus FontLab to customize an Adobe Font for individual usage, but you are not permitted to distribute, sell, or give away, the derivative work, and the derivative work counts as one of the permitted number of uses."</p>
      <p>As I recall, Thomas Phinney says that the FAQ was written by the same team that wrote the EULA.</p>
