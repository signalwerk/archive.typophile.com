    html: "<p>@ John Nolan: We can’t recall neither at FontShop International in Berlin nor in San Francisco that we have turned down such a request like yours. We want to be asked for permission of modifications, mainly to respect our designers and to keep track of modified FontFont versions. Dependent on the character and purpose of the requested modification we decide individually whether we or the type designer or our font technicians do the modification or if we just allow the customer to do it. It’s also a support problem – we can only give technial support for fonts we have produced.</p>"
