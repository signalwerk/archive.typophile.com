      <p>I don't believe there is any actual requirement that a legal contract be in "legalese" so long as everything is absolutely clear. But lawyers and judges understand legalese and it probably makes them wary or uncomfortable when something is in plain [your language of choice]. That said, there is mumbo-jumbo legalese than only a lawyer can understand, and concise legalese that someone of average intelligence but lacking legal training can more or less figure out. It's the latter that would be preferred in an EULA.</p>
      <p>An EULA needs to take into account the reality of the publishing world, otherwise it will simply be ignored. These  days a font is fairly useless if it can't be embedded in a pdf, and of course one-time users such as a service bureau or printer should not be expected to have a licence for a font unless they are actually using it in-house for purposes other than simply outputting a client's file. And of course the holder of an EULA should have the right to sell or give away a font licence they have purchased, provide they don't keep a copy and the recipient agrees to abide by the EULA.</p>
