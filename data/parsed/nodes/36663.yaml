    html: |-
      <p>The modification part is certainly something that we have found a great interest for in the design community. I think the reality is that tools are available to do this work and that users have a desire to tweak a font to better fit their requirements.</p>
      <p>The problem is not the user who swaps numeral sets around in the font for their personal usage (the fonts never leaving his desktop) but where modifications are applied and the fonts become part of a grander print job, or even corporate project. At this point I would like to have control over what is being done.</p>
      <p>I am thinking that Dalton Maag will allow modifications in principle. However, we would like to be notified of such an intent and have first refusal to do the work. Where it is a simple job that is solely for the purpose of personal use, we probably would not want to be involved as we could not justify the cost of doing this. However, where the project is more of a commercial nature, where the fonts are being distributed afterwards we probably would want to do the work ourselves for the following reasons:</p>
      <p>- Quality control: As the copyright notice and parts of the font name may remain as per original, it is possible that we may be called to provide tech support for a product we have not created. By insisting of either doing the work in-house, or at least have a quality testing, we can help with support queries and ensure that the client receives a product that matches our standards.</p>
      <p>- Distribution control and license fees: as the modification will be a derivative product, the copyright remains with us and we're entitled to license fees. Being informed and having participated in the work will allow us to negotiate licensing and distribution. </p>
      <p>- Recommercialisation: some modifications, such as language extensions or typographic features may be of interest to us. We would potentially want to integrate these into our own library and recommercialise them.</p>
      <p>This is not to make the process more complicated but to ensure that everyone is compensated fairly and that the client receives the best possible quality.</p>
      <p>Bruno<br>
      Dalton Maag Ltd</p>
