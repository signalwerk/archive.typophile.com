      <p>I should have been more specific:</p>
      <p>I was not granted permission to modify the font _myself_.</p>
      <p>I did not pursue to its conclusion the option of having FontShop do the work, because I felt the cost would be too high, and the process too time consuming...I never got a real quote, but I vaguely remember getting the impression it would be about $25 per character. </p>
      <p>Further, I was asked which character slot I would like the f ligs placed in, in spite of the fact that I had stated that the modication I wanted to make was in order to have the ligs  available to InDesign. This indicated that the particular need I was hoping to address was not understood by the questioner, so I didn't have confidence that the work would be done correctly. I could have done it myself in 20 minutes, including adding new kerns. Life's too short.</p>
      <p>My initial request for permission was dated July 14, 2005.</p>
      <p>Here are some excepts from _some_ of the  emails I got from Danny Dawson in 2005:</p>
      <p>Aug. 5, 05:<br>
      "This all means that you are effectively prohibited from making the changes yourself. There may be situations I am not aware of where you would be granted permission to make the changes yourself, but those situations are not mentioned in the packet I was given."</p>
      <p>In August 9, 05 Danny said:<br>
      "I don't quite have answers for you yet, but I am still looking into (1) costs for the modifications you've inquired about and (2) further EULA language clarification. Unfortunately, international communication moves at its own pace, and this is further complicated by the legal complexities of the subject matter, so I do apologize that my responses aren't more prompt."</p>
      <p>Aug. 23, 05:<br>
      "As for clarifying our current EULA, I am *still* waiting for an enumerated list of things you are allowed to do on your own without paying FontShop for customizations. I'll let you know when I hear more."</p>
      <p>...the thread ends here, probably because I told Danny I was no longer interested. I also spoke to Danny on the phone about all this. I don't remember exactly when I told Danny "I give up."</p>
