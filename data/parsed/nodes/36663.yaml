      <p>Sii, our present EULA is based on Monotype's from about 6 years ago. As I said, it is hopelessly outdated. </p>
      <p>I must admit that Village's EULA is refreshingly simple, but I am not sure if it's maybe almost too simplistic and too open for interpretation. It very much depends on the good nature and trusing the users. I am considering it, however, as a template for our discussions here.</p>
      <p>Tiffany, I read through Adobe's EULA and found it hard work. There is so much about all the other software products in this EULA that as a user I would lose the will to live too quickly before reaching any font relevant part. What bits there are about fonts are in fact not too different from Village's. Interestingly enough, Adobe does make provisions for local legislature, such as Germany and Austria, regarding warranty and liability.</p>
