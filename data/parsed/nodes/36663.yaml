      <p>Our EULA* is written in English, and was approved by an attorney. His only addition to it was a "limit of liability" statement: "If, after we have worked to resolve any technical issues, you are still not satisfied with our product, we will be pleased to refund your money, which shall be the limit of our liability in this transaction."</p>
      <p>The EULA is as clear as day, and as binding as rope. As the majority of our sales are outside of North America, we feel it is very important that our EULA be comprehensible to those for whom English is a second, third, fourth, or twentieth language.</p>
      <p>Tiffany is an authority on, and collector of, EULAs, and her thoughts on this matter are always insightful.</p>
      <p>*The EULA was originally written for Thirstype circa 2001, and was later implemented for Village, and several of our member foundries. Of our 11 members, 7 of them use our plain English EULA: KLIM, Kontour, Lux Typographics, Schwartzco, Thirstype, Type Initiative, and Village. Other foundries have asked us if they may use our EULA as a template for their own, and the answer is always a resounding "yes!" Unlike other EULAs, ours is not protected by copyright.</p>
