  html: |-
    <p>Hello All, </p>
    <p>In my job, I have to deal with folks who have very little attention span. Often I have to write elevator-pitch summaries for which Narrow / Condensed fonts work much better than Regular version of fonts. Also, earlier I had been using Garamond or Cambria for printed-out presentations, but after reading articles about Baskerville font, I tried out Baskerville Old Face. While the switched to Baskerville Old Face hasn't noticeably improved any success rates, I have received more positive comments about the presentations. </p>
    <p>Are there any font recommendations that are simultaneously BOTH<br>
    (a) Narrow / Condensed<br>
    (b) based on Baskerville (Old Face)</p>
    <p>Freely available font recommendations will be much appreciated.</p>
    <p>Thanks,<br>
    Prad</p>
