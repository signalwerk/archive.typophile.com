      <p>My Playfair Display is Open Source (hence gratis) and based – amongst other things – on Baskerville.<br>
      <a href="http://www.google.com/fonts/specimen/Playfair+Display" title="http://www.google.com/fonts/specimen/Playfair+Display">http://www.google.com/fonts/specimen/Playfair+Display</a></p>
      <p>It is slightly condensed, and has an x-height much larger than the historical transitionals. As the name implies it is best used for headlines and titles.</p>
