      <p>Dunno, I for one see Baskerville's character as being strongly linked to its horizontal generosity. The good news is that I wouldn't call Baskerville an "Old Face", and hopefully you actually mean the latter and not the former.  :-)</p>
      <p>What about Kepler, or Octavian?<br>
      <a href="http://www.myfonts.com/fonts/adobe/kepler/scn/" title="http://www.myfonts.com/fonts/adobe/kepler/scn/">http://www.myfonts.com/fonts/adobe/kepler/scn/</a><br>
