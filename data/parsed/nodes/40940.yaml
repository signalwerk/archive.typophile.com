    <p>1. How can you define what is embellished type?</p>
    <p>2. At what point do people think that type becomes decorative?</p>
    <p>3. How do these issues change over time?</p>
    <p>4. Do trends have impact on the way its embellished?</p>
    <p>Thanks in advance<br>
    Joe Francis</p>
