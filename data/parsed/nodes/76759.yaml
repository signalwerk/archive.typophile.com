  html: |-
    <p>I'd like to announce a new AND VERY BETA feature on Typophile we're calling "marks."</p>
    <p>We've heard a lot of requests for this one. This new feature will allow you to mark content that you're interested in following in real-time. Think of it as a Typophile-specific bookmarking system. </p>
    <p>Typophile Marks are for signed-in users only. Once you're signed in, you'll see a few small changes to the Typophile UI. First, at the top-right of forum topics and blog posts, you'll see a little bookmark icon. Click the icon to mark that thread.</p>
    <p>Under "My account" you'll see a new item called "My marks" - This does exactly what you'd expect - It returns a list of the content that you've marked. You can also access it directly at <a href="http://typophile.com/mymarks" title="http://typophile.com/mymarks">http://typophile.com/mymarks</a>.</p>
    <p>To remove a mark, look for the "Reset my vote" link at the bottom of the topic's initial post. (Disregard any mention of "votes" you may come across - we're chasing them down and replacing them with "marks" but there are dozens of files to crawl through.)</p>
    <p>Again, this is very BETA but would love to get feedback on how it's helping you keep track of those threads that you're following but have not yet participated in.</p>
    <p>//jared</p>
