      <p>Awesome!</p>
      <p>A few quick thoughts / questions:</p>
      <ol>
      <li>I'm presuming the "My marks" list will show whenever there has been new activity on each thread, à la the Track page?</li>
      <li>Instead of having a "reset your vote" link or something similar, it would be more elegant if you could just click the icon again to un-mark it.</li>
      <li>I might personally use a different term than "marks" – something more like "watch" or "follow", maybe? "Marking" reminds me more of something static which is intended for future reference (i.e. bookmarks) – a slightly different concept from what you've described in your own words as something that you're "following" or "keeping track of".</li>
      <li>As with the Track page, this feature would be exponentially more awesome with its own RSS feed. Get me that and I'll be a happy camper! :)</li>
      </ol>
