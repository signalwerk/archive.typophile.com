      <p>David, you're right -- the text I linked to does not directly answer the original question! However, it does have a telling remark from Ed Benguiat:</p>
      <p>"The only place Avant Garde looks good is in the words Avant Garde. Everybody ruins it. They lean the letters the wrong way."</p>
      <p>I think that statement <em>does</em> partially answer the question, because it gives a clue as to what the wrong use is.</p>
