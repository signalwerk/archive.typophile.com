      <p>Also, I would say that if you are a truely good designer with a correct connexion between your eyes and your brain, you should be able to use these ligatures well enough without reading any "instructions".</p>
      <p>This being said, I noticed something wrong in the text you mentioned above:</p>
      <p>"Avant Garde -- the typeface -- was born as a logo for a new magazine of the same name in the mid-60s. Ralph Ginzburg collaborated with Herb Lubalin (pronounced "Loo-ba-lin") on four magazines, of which Avant Garde was their second"</p>
      <p>&gt; not true, Avant-Garde (1968-1971, so a little bit more end of sixties than mid-sixties) was the third of 3, coming after Eros (1962-1963) and Fact (1964-1967).</p>
      <p>And I am quite surprised to see this text being proposed as an answer to a question that is "how to correctly use Avant-Garde's ligatures", because in this essay the author very clearly explains that Avant-garde is ugly and too much linked with the sixties to be used today in another goal than nostalgia. At the end he actually proposes to use Franklin Gothic instead... Apart from the historical background which proves interesting when true, this text is, imho, a crappy one.</p>
      <p>dr</p>
