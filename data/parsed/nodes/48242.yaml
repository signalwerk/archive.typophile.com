      <p>Hey Brooklyn Rob,</p>
      <p>Let me make a few things clear: I, like anyone else on this forum, including you, am quite free to say what I want, and that's nice. I agree with you on the fact that I sometimes tend to use ways of saying stuff which might look rude, for I speak this way in my mothertongue (french) and I don't use smileys everywhere, but what can I do. I guess only extremely susceptible people take these comments out of any irony or with a sweet distance. I of course didn't mean to be disrespectful, but I guess I was making a little fun in order to state (seriously this time) that in my opinion, if you need a booklet in order to use correctly a typeface, then it's far much better not to use this typeface.</p>
      <p>Regarding this text, I knew it before, because I did a lot of research for my upcoming book, including research about Avant-Garde Gothic. I think this text is crappy, because it clearly tells people "don't use this font" (at least for modern, up to date design). And, again in my opinion, that's a shame, because this font is really beautiful when correctly used (I'm talking only about the capitals here). Ed Benguiat was, in my opinion, very stupid when he said that this typeface looked only nice in the Avant-Garde logo. Herb Lubalin made wonderful covers (including the beautiful example posted by Nick), he also sent a congratulations note to an agency in the seventies who made a real nice use of the ligatures in an Audi advertisement, and if you just look around a little right now, you'll see plenty of great works set in Avant-Garde and full of ligatures. I'm sorry if the use of "crappy" offended you enough to post a comment regarding my youth-speaking. </p>
      <p>Nuff said,<br>
      dr</p>
