    html: |-
      <p>Don't know this type and really doubt it could have been one, meaning as it. This looks like a custom job based on some machanical/squared condensed sans (some finials and angles cut and /A crossbar reworked).<br>
      Some fonts to base the customization on: <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/banque-gothique-rr/" rel="nofollow">Banque (not Bank) Gothic Extra Condensed Extra Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/diamante/" rel="nofollow">Diamante</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/octin-college/" rel="nofollow">Octin College</a><br>
      Alternative for the laziest: <a class="freelinking external" href="http://www.dafont.com/anitlles.font" rel="nofollow">Anitlles</a> (possibly an attempt to digitize a font based on the original main title)</p>
