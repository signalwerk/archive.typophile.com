    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a>/<a href="/wiki/Characters" class="freelinking" rel="nofollow">Characters</a> : Em Dash</strong></p>
    <p>A horizontal line character one <a href="/wiki/em" class="freelinking" rel="nofollow">em</a> in width. Commonly use to imply a break in thought, or missing content.</p>
    <p>Used to indicate a sudden break in thought, or to show an open range such as in numbers or dates. </p>
    <p><a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> : 2014<br>
    Windows US Keyboard : Alt 0151<br>
    Macintosh US Keyboard : Shift Option -</p>
