    html: <p>Herb's got it right-- group each tile with an invisible rectangle (no fill or stroke) that defines the "bounding box." To clearly see how it works, drag one of Illustrator's preset border brushes out onto the canvas and examine the pieces. The corner tiles should be perfectly square, the side tiles should have the same "em" height but can be a different width.</p>
