    html: <p>There really is very little like it. We might be of more help if you explain what you like about Freight Micro and why it won't work for you.</p>
    html_clean: <p>There really is very little like it. We might be of more help if you explain what you like about Freight Micro and why it won't work for you.</p>
  - id: 251935
    user: 108
    date: 2008-01-15T12:07:00
    date_raw: 15 Jan 2008 — 12:07pm
    votes: null
    html: <p>I'm wondering if you are attracted to it for some of the same reasons I am. I find the exaggerated qualities somewhat handsome and ugly at the same time. Kind of like enlarging something only meant to be viewed tiny only to find you like the details too. It really is original in so many ways, but you might also like <a href="http://www.fontshop.com/fonts/downloads/font_bureau/eldorado_micro/" rel="nofollow">Eldorado Micro</a> for similar reasons. It isn't as stylized, but it has some of the exaggeration due to be designed to be used at small sizes.</p>
    html_clean: <p>I'm wondering if you are attracted to it for some of the same reasons I am. I find the exaggerated qualities somewhat handsome and ugly at the same time. Kind of like enlarging something only meant to be viewed tiny only to find you like the details too. It really is original in so many ways, but you might also like <a href="http://www.fontshop.com/fonts/downloads/font_bureau/eldorado_micro/" rel="nofollow" class="link-external">Eldorado Micro</a> for similar reasons. It isn't as stylized, but it has some of the exaggeration due to be designed to be used at small sizes.</p>
