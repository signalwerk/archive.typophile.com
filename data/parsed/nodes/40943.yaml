    html: |-
      <p>It is a nice looking font that I could not find anything similar to it.  It has qualities that at first reminded me of kontrapunkt or cholla slab, but then the serifs added to its uniqueness in a very strange way.  I have found fonts similar to kontrapunkt and cholla slab, but not Freight Micro.  I would say that I liked the way that it was displayed as a logo <a href="http://www.kongregate.com/" rel="nofollow">here</a></p>
      <p>__________________________________________________<br>
      I know I am in my own little world, but its ok.  They know me here</p>
