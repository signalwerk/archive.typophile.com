    <p>Dear Typophiles, <br> <br>I am looking for some information regarding the Meta typeface family by Erik Spiekermann.  It is my understanding that the typeface was simply re-branded as Meta from it's original release as Meta+.  Could anyone inform me if there are any typographic differences between the 2 versions, that I should be aware of? <br> <br>Thanks for your time. <br> <br>What a great site. <br> <br>Thanks <br>Neil</p>
