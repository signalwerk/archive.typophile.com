    html: "<p>Hello there, <br>Yes it is true that the FF Meta + has been rereleased as  Meta. <br>The Meta + came in the following weights: <br>Bold Roman, Bold Italic, Bold Caps, Bold Caps Italic <br>Book Roman, Book Italic, Book Caps, Book Caps Italic <br>Black Roman, Black Italic <br>Medium Roman, Medium Italic, Medium Caps, Medium Caps Italic <br>Normal Roman, Normal Italic, Normal Caps, Normal Caps Italic <br> <br>The new Meta has lining figures and expert sets added to each weight. <br> <br>The metrics of the font have also been changed. <br>Upon request FontShop provides customers who need to match the Meta+ for older documents with the old data along with the new version of the fonts. (1-888 FF Fonts)</p>"
    html_clean: "<p>Hello there, <br>Yes it is true that the FF Meta + has been rereleased as  Meta. <br>The Meta + came in the following weights: <br>Bold Roman, Bold Italic, Bold Caps, Bold Caps Italic <br>Book Roman, Book Italic, Book Caps, Book Caps Italic <br>Black Roman, Black Italic <br>Medium Roman, Medium Italic, Medium Caps, Medium Caps Italic <br>Normal Roman, Normal Italic, Normal Caps, Normal Caps Italic <br> <br>The new Meta has lining figures and expert sets added to each weight. <br> <br>The metrics of the font have also been changed. <br>Upon request FontShop provides customers who need to match the Meta+ for older documents with the old data along with the new version of the fonts. (1-888 FF Fonts)</p>"
