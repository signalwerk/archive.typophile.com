    html: <p>Hi there, <br> <br>I think the difference is in the figures, in one release they are old style and in another there also titlely figures. Of course you know the story behind Meta? It started out life as a corporate font for Deutsche Post (German postal company) but half way through they pulled the plug on the project. Anyway, their loss; its a great font. <br> <br>Chris</p>
