    html: |-
      <div class="comment-spam-body"><p>Have not found an exact match yet but can give you some info about the style.<br>
      <a href="http://www.identifont.com/list?3+Dynamo%20Bold%20Condensed+0+5BF+1+9AO+2+EH0+2+40I+2+2081+2+5B2+2+6C2+2+7EL+3+N5G+3+N1F+3+4BH+4+7BM+4+2DOV+4+2DOU+4+DP6+4+DP4+4+KOM+4+4HK+4+MUK+4+MUJ+4+MUI+4+LKS+4+2Q1+4+BH+4+FVO+4+28Q+4+6BE+4+4XZ+5+6DL+5+7NI+5/" rel="nofollow">Dynamo Bold Condensed</a>, and similar fonts shown in the link have the same end of stoke wedge style.<br>
      Dynamo was designed by K. Sommer and released by Ludwig &amp; Mayer in 1930.<br>
      In your image the style is applied to a square sans.<br>
      It could easily be recreated.<br>
      However, there is still hope that someone will spot the font in the image.<br>
      Don</p>
      </div>
