    html: |-
      <p>I would imagine that the fukced-up production delay Jagger refers to is the <em>Satanic Majesties</em> lenticular image.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/220px-Rolling_Stones_-_Their_Satanic_Majesties_Request_-_1967_Decca_Album_cover_3997.jpg"></div><p></p>
      <p>Mick was no doubt familiar with the peel-off banana skin Warhol did for the Velvet’s ﬁrst album, and he seems to be asking for more of the same, no matter what!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/220px-Velvet_Underground_and_Nico_6739.jpg"></div><p></p>
      <p>At any rate, I bet he loved the zipper.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sticky-fingers1_5731.jpg"></div><p></p>
