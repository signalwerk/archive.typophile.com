  html: <p>A music-geek friend posted a link to <a class="freelinking external" href="http://also.kottke.org/misc/images/jagger-warhol.jpg" rel="nofollow">this 1969 letter</a> from Mick Jagger to Andy Warhol, with an unexpected Eurostile sighting.</p>
