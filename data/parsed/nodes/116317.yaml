    html: <p>Oldnick, that should work except for “œ æ ð ø þ”, because the regular expression to match <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#2.f.i" rel="nofollow">valid glyph names</a> (in AFDKO syntax) is <code>(\\?[A-z_][A-z0-9_.]*|\.notdef)</code>. Sorry for nitpicking.</p>
