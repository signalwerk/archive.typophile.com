      <p>Scarlett ,<br>
      I designed that cover and honestly I don't recall all the fonts used.<br>
      I'll give it a try:<br><em>Balthazar</em> is the logotype  and it is based on <strong>Akzident Grotesque bold extended</strong><br><em>Keith Mc Nelly</em> is <strong>AT Sackers</strong><br><em>Clarkson Potter</em> is <strong>FF Bodoni Chancery</strong><br><em>Cookbook</em> I think is <strong>Geometric Bold Condensed</strong> (not sure)<br><em>by</em> is definitely <strong>Bickham Script</strong><br>
      Some of the ornaments are <strong>Arabesque Ornaments</strong> (I think next to <em>Balthazar</em>) and next to <em>the</em> is <strong>FF Bodoni Ornaments</strong><br>
      The other ornaments are from the Dover book of Charles Derriey "Borders, Frames and Decorative Motifs from the 1862 Derriey Typographic Catalog".<br>
      Ciao</p>
      <p>Matteo Bologna</p>
