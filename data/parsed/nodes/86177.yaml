    html: |-
      <p>Very interesting.  In English, the comma usually (but not always) goes inside the quotation marks, <cite> Lady," </cite> not <cite> Lady", </cite> but there are exceptions, so it's probably necessary to kern both ways round.<br>
      I had no idea that those 'low-9' quotation marks went before the text. I'll have to remember that!<br>
      Maybe I'll just stick everything in classes and kern every eventuality just in case.</p>
