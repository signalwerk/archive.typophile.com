  html: |-
    <p>It is my pleasure to announce, my contribution to the ATypI conference in Reykjavík "Forgotten Kerning" is now online at <a href="http://diacritics.typo.cz" title="http://diacritics.typo.cz">http://diacritics.typo.cz</a>.</p>
    <p>You can access it via menu or directly at <a href="http://diacritics.typo.cz/index.php?id=85" title="http://diacritics.typo.cz/index.php?id=85">http://diacritics.typo.cz/index.php?id=85</a></p>
    <p>The text is based on my presentation in Reykjavík, Iceland, although I've slightly expanded it and modified some sections.</p>
    <p>As Diacritics Project is wiki-based, please feel free to edit or expand the information published on the website.</p>
    <p>The printed version of this text will be published in the next issue of TYPO Magazine #45 during October, please check <a href="http://www.typo.cz/en" title="http://www.typo.cz/en">http://www.typo.cz/en</a> for updates. Don't forget ATypI members are entitled to a discount on subscription (10% one-year, 15% two-years).</p>
    <p>All the best from Prague,</p>
    <p>Filip Blažek</p>
