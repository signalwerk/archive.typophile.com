  html: "<p>announced for a long time and finally available: the first fontomas years are going to be published on a cd-rom. the cd-rom includes every single font (over 75 typefaces for mac/pc) from the site <a href=\"http://www.fontomas.com\" target=\"_blank\">http://www.fontomas.com</a> and some previously unpublished alphabets. it is packaged with a full-colour booklet, button and sticker.  <br>the whole profit will be given to a children's project by the international humanitary organization worldvision/germany. <br> <br>the edition is limited to 1.000 copies, so you really have to hurry up to get your copy. the cd is in production and will be shipped in march 2005. it can now be pre-ordered at <a href=\"http://www.typetype.net\" target=\"_blank\">http://www.typetype.net</a>. <br> <br>the price is 40 EURO incl. shipping and it can be payed via paypal or directly by transferring the money to our bank account (please send a mail and i'll reply with the neccessary information). <br> <br>information and a font-overview will also be available next week at <a href=\"http://www.typetype.net\" target=\"_blank\">http://www.typetype.net</a> (previews are still available at <a href=\"http://www.fontomas.com\" target=\"_blank\">http://www.fontomas.com</a>).</p>"
