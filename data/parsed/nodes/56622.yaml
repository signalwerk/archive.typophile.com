    <p>I was looking at how arabic type designs have been using metrics today. I was wondering what you all think is best practice for various non latin designs. In my case I am most concerned with Arabic but I don't see what this thread has to be limited to that.</p>
    <p>One of the things I have seen ( my sample size is far too small for this to be representative of an industry approach) is that Arabic type that includes latin glyphs will use x and cap height values. But those that do not don't. Or more accurately they make the value for both cap &amp; x heights near the baseline. The idea I have about this is that rendering engines use x heights &amp; cap height to normalize the presentation of latin type for screen and in print and so maybe taking these values out of play by dropping them to -1 prevents undesired "normalization" of the Arabic shapes which vary in height quite a lot.</p>
    <p>Bonus points for talking about working outside the em square vs keeping all marks including diacritics within it.</p>
