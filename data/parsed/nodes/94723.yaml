  html: |-
    <p>I've been working on my first font; it tries to channel early woodblock display fonts, with a very low-fidelity, imprecise and analogue quality. There are no straight lines, and a plenty of intentional 'defects'. </p>
    <p>There's a couple of sharp corners that I still need to go over, but I'm wondering a lot about the broader direction that I want to move in.</p>
    <p>A short sample:  <a href="http://cl.ly/I5W0" title="http://cl.ly/I5W0">http://cl.ly/I5W0</a></p>
    <p>Full PDF sample: <a href="http://cl.ly/I5D3" title="http://cl.ly/I5D3">http://cl.ly/I5D3</a></p>
    <p>It's really designed for low quality newsprint (I made the first few letters for my school's newspaper) so I encourage you to print it out and look at it on the page if you have the time and patience.</p>
    <p>I haven't done anything more than side bearing-based spacing yet (the &amp; entering the P is a mistake, not a ligature.)</p>
