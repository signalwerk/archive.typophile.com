      <p>I'm no fan of Modernism, but I think ill-defined romanticism isn't much better. When you consider that a "clean" font will end up looking like your font once it goes through low-quality printing, "designed for low-quality printing" doesn't seem to make sense ("designed <em>to look like</em> low-quality printing" would be fine though). To me what you describe would be a font with deep traps and sharp thorns.</p>
      <p>hhp</p>
