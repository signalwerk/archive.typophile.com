      <p>The spacing is really a bit of an afterthought at this point; it's going to be redone entirely soon, looser than it is. I really want to get all of the letterforms right before I start dealing with spacing, so I don't end up having to redo it later.</p>
      <p>There's a crispness to printing these days that, on low quality newsprint, especially with bad color, makes most very large type (this was designed for a flag), especially many serifs, feel out of place, due to the precision in the printing not being reflected in the color and consistency of the newsprint. The intention is that the imprecision rejects modernist tendencies towards perfection, and instead embraces the faults of the medium.</p>
