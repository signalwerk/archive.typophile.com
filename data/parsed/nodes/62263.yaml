  html: |-
    <p>According to the newly published <a class="freelinking-external" href="http://www.apastyle.org/">sixth edition of APA publication manual</a> (p 73), people who participate in an experiment are no longer referred to solely as  participants. They can now referred to as participants <em>and</em> subjects. Originally, people were referred to as subjects, and at some point the term participant was adopted and the term subject was reserved for animals (I’m not a historian).</p>
    <p>It’s nice that we are “allowed” to use the term subjects again as it is consistent with the long standing acronym Ss.</p>
  html_clean: |-
    <p>According to the newly published <a class="freelinking-external link-external" href="http://www.apastyle.org/">sixth edition of APA publication manual</a> (p 73), people who participate in an experiment are no longer referred to solely as  participants. They can now referred to as participants <em>and</em> subjects. Originally, people were referred to as subjects, and at some point the term participant was adopted and the term subject was reserved for animals (I’m not a historian).</p>
    <p>It’s nice that we are “allowed” to use the term subjects again as it is consistent with the long standing acronym Ss.</p>
