      <p>It is entirely possible that the Unicode character name is wrong or misleading; you'd have to ask Mark Shoulson why that name was proposed. It doesn't really matter, I think, because although Unicode character names are immutable they're not functional. What matters is documentation that describes the use and purpose of a character.</p>
      <p>Remember that Unicode encodes what is on the page, not what it signifies, so things like vowel quantity and quality aren't really relevant. There are two dots that occur above vav: one above the letter and one to the left of the letter, and this distinction is systematically applied in at least some texts, and needs to be encodable on computers and displayable with appropriate fonts.</p>
      <p><em>The holam is one dot placed above and between two letters.</em></p>
      <p>Yet this is not the case in L, nor in typographic editions such as Professor Dotan's that follow the manuscript convention: the holam is placed above the left side of the letter, not between the letters, excepting when holam male (positioned centered above vav or a little to the right side), or when followed by an unvocalised aleph (shifted to right side of aleph), or, obviously, when on lamed where the ascender obliges the dot to be positioned between the letters.</p>
