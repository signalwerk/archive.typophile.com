  html: |-
    <p>Because most of my experience with <a href="/wiki/Hebrew" class="freelinking" rel="nofollow">Hebrew</a> is with the Biblical text and related religious content, I remain somewhat uncertain about what constitutes a recommended character set—in terms of Unicode codepoints—for modern Hebrew. Some things are obvious, of course: the cantillation accents and signs such as the nun hafuch that occur only in the Bible text are clearly not needed. But there are some characters, related to vocalised text, that seem to me to exist in a grey area, due to their use in religious publications such as prayer books and perhaps, I wonder, elsewhere in restricted modern use?</p>
    <p>A question for modern Hebrew readers and typographers: what characters would you expect to be included in a well made font for modern Hebrew, and which would you expect to be excluded?</p>
  html_clean: |-
    <p>Because most of my experience with <a href="/wiki/Hebrew" class="freelinking link-lost" rel="nofollow">Hebrew</a> is with the Biblical text and related religious content, I remain somewhat uncertain about what constitutes a recommended character set—in terms of Unicode codepoints—for modern Hebrew. Some things are obvious, of course: the cantillation accents and signs such as the nun hafuch that occur only in the Bible text are clearly not needed. But there are some characters, related to vocalised text, that seem to me to exist in a grey area, due to their use in religious publications such as prayer books and perhaps, I wonder, elsewhere in restricted modern use?</p>
    <p>A question for modern Hebrew readers and typographers: what characters would you expect to be included in a well made font for modern Hebrew, and which would you expect to be excluded?</p>
