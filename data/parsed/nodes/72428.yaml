      <p>As far as I know, modern Hebrew is based on "memory" and the reader recognizing the word and it's pronunciation without the help of the Nikud, and some of the vowels like Yod and Vav are silent or dropped in some cases (but those should be included in the alphabet). for the rest all the alphabet is the same, including the closing/end letters.</p>
      <p>The Nikud is not there cause it's a Biblical Hybrew, it's there to make sure people pronounce/sing it correctly, so it's there when really needed in some cases.</p>
      <p>also, there is a difference between classic alphabet and written/hand-written alphabet.. they look different.</p>
      <p>my 2 cents</p>
