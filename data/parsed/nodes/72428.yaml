      <p>HOLAM HASER FOR VAV (U+05BA) was added in Unicode 5.0, so not so new any more. This character enables an encoding and display distinction to be made between vav haluma (U+05D5 U+05BA) and holam male (U+05D5 U+05B9). For a full explanation and illustration, see page 16 of the <a href="http://www.sbl-site.org/Fonts/SBLHebrewUserManual1.5x.pdf" rel="nofollow">SBL Hebrew font manual</a> [PDF].</p>
      <p>When this mark was encoded, it was decided to treat the existing HOLAM (U+05B9) character as holam male on the basis that this is much more common than vav haluma. So the new character performs the same role for vav as the existing holam performs for all the letters other than vav. A bit confusing, but the best approach from a backwards compatibility perspective.</p>
