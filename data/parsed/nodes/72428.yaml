      <p>Rephael listed the Hebrew grammar glyphs used in Modern Hebrew.</p>
      <p>They are:</p>
      <p>kamatz katan<br>
      chataf kamatz katan<br>
      shva na<br>
      shva nach (yes this is different from a regular shva)<br>
      shva merachef<br>
      dagesh chazak<br>
      dagesh kal<br>
      cholam chaser<br>
      the "meteg" of the sof pasuk (usually looks like a meteg)<br>
      meteg<br>
      gaaya (usually looks like a meteg)<br>
      mileil (so in Koren this glyph might look like a meteg below the letter, but in Rinat it will an ole above the letter)<br>
      milra<br>
      the two diamonds of the sof pasuk (as opposed to a colon)<br>
      patach ganuv</p>
      <p>As I understand, there is no differences between Biblical Hebrew, post-Biblical Hebrew, such as Mishnaic Hebrew, and between Modern Hebrew.</p>
      <p>Hebrew Grammar is studied daily in Israel, and most Hebrew schools in the diaspora. Having a group of fonts supporting these glyphs will certainly be used regularly, and promote the increased knowledge of Hebrew Grammar.</p>
      <p>I agree with John Hudson that the teaching of the rules of Hebrew Grammar is outside the realm of Unicode. But the glyphs used to describe Hebrew Grammar are within the scope of Unicode, and should be implemented as soon as possible.</p>
