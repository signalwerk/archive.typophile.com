      <p>Meteg: Meteg is not part of the Modern Hebrew vocalization. We will not find it along with the other vowels in children's books, for example. However, we do find it in dictionaries. The only recent use of the meteg was in the book Hebrew in Jeans which was published  several years ago. But this book is about Hebrew slang and serves as a dictionary. Grammar books of Modern Hebrew use other marks instead of meteg. In terms of what is missing in Hebrew fonts, and what I'm using/doing regularly, are these marks:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/metegA_4026.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/NewM2_5044.png"></div><p></p>
      <p>Vav + Holam: Historically and technically we can blame the early printers for positioning  the Holam above the vav. In books where the subject matter is not Biblical we will not see the distinction of the positioning, and for the modern Hebrew speaker the pronunciation would be the same.  Moreover, "male" or "haser" refers to the presence or absence of the vav, and does not indicate anything about the pronunciation. For example the word     בוֹ and בֹ  are the same. </p>
      <p>Here are  samples from two different books:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/book2_6613.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/MBhebrew2_4066.jpg"></div><br>
       In sample 1 we can see this distinction. The subject matter is the Masorah notes, nikkud  etc. and the scholar wanted to make this distinction. In sample 2 we can't find this distinction, though the subject matter is Biblical Hebrew. But again, the speaker of the Modern Hebrew won't pronounce it differently.<br>
      There is nothing wrong with having this mark, or if you want to make this distinction. But in Modern Hebrew in books and publications that require nikkud (and has nothing to do with Biblical Hebrew,  Language &amp; grammar in BH) we won't find this distinction.<br>
      Moreover, in the MSS we will find the patach genuva to the right. But in modern Hebrew we don't follow that positioning (e.g. children's books, young-adults' books with nikkud etc). <p></p>
      <p>I don't know if we can compare between MSS and printed the Bible. The scribe, for example, added to the text hundreds of marks every day, and he was just a human being. So we might find some differences in the positioning even within the same page. In this regard L codex is not different from A codex. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Asamuel1-19b_5639.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Lcodex1_6583.png"></div><p></p>
      <p>Kamats katan: a siddur/  prayer book has a very specific audience which is based on specific tradition. The aim of the publisher when publishing a book for kids (with nikkud, modern Hebrew) is to reach as many kids as possible regardless of their tradition. But let's say that the editor wants to add a whole bunch of marks. The word צָהֳרַיִם  can be pronounced tsohorayim or tsahorayim. That said, o vs. a sound.  The same with the word מָחֳרָתַיִם — mohoratayim or mahoratayim. Again, kamats katan vs. kamats.<br>
      Should we add an extra page which will explain to the readers the differences?<br>
      When Dr. Shelomo Tal worked on the siddur Rinat Yisrael he introduced not just the kamats katan, but also marks to indicate milel and milra; he added commas and periods to help the readers when they are reading, and not to connect between words and creating new/wrong meaning to their prayers, new and clear divisions between paragraphs etc etc.  What is less known is  that he also published a book which could be regarded as 'behind the scenes' where he explained  his decisions plus told the history of the prayer books.<br>
      The publishers and editors (mostly here in the US)  are facing more acute problems with their siddurim (which Dr. Tal tried to solve back in the 1970s!).<br>
      Let's go back to the patach gnu'va to have something to think about... as we know the siddurim indicate it by positioning it to the right of the letter. For a person that goes to the synagogue pronounciation is very important. It is also important  to pronounce the name of God e.g. אֱלוֹהַּ<br>
      We could ask as many people as possible how to pronounce it; almost 80% of the time (and sometimes more) we will hear אֱלוֹהַה. That said, doubling the letter he! But this is not the way to pronounce it. We call it patach gnuva because the letter he (in our sample) "stole" the patach (from the alef).<br>
      We need to say אֱלוֹאַ/אֱלוֹאַה, to hear the sound "a" very clearly, and the letter he is silent! So the mark is there.  Why is there a  problem to say it correctly? :)</p>
    html_clean: |-
      <p>Meteg: Meteg is not part of the Modern Hebrew vocalization. We will not find it along with the other vowels in children's books, for example. However, we do find it in dictionaries. The only recent use of the meteg was in the book Hebrew in Jeans which was published  several years ago. But this book is about Hebrew slang and serves as a dictionary. Grammar books of Modern Hebrew use other marks instead of meteg. In terms of what is missing in Hebrew fonts, and what I'm using/doing regularly, are these marks:</p>
