      <p>John,</p>
      <p>If the Holam Haser for Vav is based on Biblical Hebrew/the Tiberian system then the name is wrong.<br>
       In the Tiberian, Biblical Hebrew they didn't  distinguish between Holam Male (1— Psalms 118,12) or Haser (2— Exodus 22,5)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/A-Holam_3735.png"></div><p></p>
      <p>The Tiberian vocalization system is known as a quality and not a quantity system. The main reason that the Tiberian vocalization gave us partial indication of relative vowel quantity is because the vowel quantity was not phonemic. The only indication of  vowel quantity was by adding the sheva mark  to the hatafim. That said, they were short. Vowel length in Tiberian Hebrew was based on the syllable structure!</p>
      <p>BTW, because the Tiberian system was  marking the qualitative distinctions between the vowels they didn't have any distinct graphic mark for the kamats katan!</p>
      <p>As we know, they could not change the text; they could not add letters e.g. matres lectionis. They just added the nikkud! </p>
      <p>Prof. Dotan, in one of his books that he published in 2005  stated very clearly that the vowel was pronounced the same whether there was a  matres lectionis or not.<br>
      Same view by  Prof. Blau that published his book in the 1970s. </p>
      <p>In the treatise Hidayat Al-Qari (the correct reading of the Torah) in the description of the vowels, it's said about the positioning of the Holam: The holam is one dot placed above and between two letters.</p>
      <p>The whole holam male, tsere male etc etc is a much  later innovation, but definitely not by the Tiberian.</p>
