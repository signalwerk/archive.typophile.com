      <p>It's interesting to me that the responses in this thread were more helpful because they were not based on the understanding I would have had of the initial question.</p>
      <p>What is the recommended character set for a font used with modern Hebrew? I would have thought the answer to that question could be obtained trivially: look at the character set of nearly any Hebrew font, since most fonts won't include the extra typographical refinements needed for Scriptural text.</p>
      <p>But the responses here dealt with the "ideal" character set instead of the "typical" one, thereby pointing out that vowel points are used with modern Hebrew texts for children's books and in the pronunciation keys of dictionaries.</p>
      <p>So far, the advice you're getting here seems to be that about the only things you can safely omit are cantillation marks - and the extra-wide versions of the letters used to allow vowel points to be applied to a "missing" letter while not putting that letter in the body of a Scriptural text! And some of the things you can't omit aren't even in Unicode yet.</p>
