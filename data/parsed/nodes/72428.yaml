      <p>David, I'm not sure about the correct terminology -- what does 'haser' mean exactly? -- but there is a distinction in holam position for vav haluma and holam male in editions of the masoretic text, which I presume reflects the manuscript tradition. See the Genesis 4:13 example I cite in the SBL Hebrew manual:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gen413_3738.png"></div><p></p>
      <p>I've checked this against Professor Dotan's edition of L, the BHK and BHS editions, and also the JPS Tanakh. I don't have a copy of the L facsimile, but presume that this distinction exists there also. [The JPS typesetting follows what I think of as a modern convention in which the holam sits much further to the left, between the letters rather than over the left side of the letter.]</p>
      <p>If I recall correctly, there are about 300 occurrences of vav haluma in the Bible text, which would use the U+05BA mark, as contrasted with some 25,000 instances of holam male, which would use the U+05B9 mark.</p>
      <p>What I'm wondering is whether U+05BA is something that should be included in fonts that support vocalised modern Hebrew. It seems to me a useful sort of thing to be able to distinguish two different pronunciations in terms of encoding and appearance, even if this character is not (yet) widely used.</p>
