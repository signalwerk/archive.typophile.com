      <p>Amharic is tricky; I've encountered a web site that notes that most Amharic fonts have been dumbed down to correspond with a drastic simplification of that script so that it can work with a typewriter.</p>
      <p>For Hebrew, though, I would have been inclined to simply point out Code Page 1255:</p>
      <p><a class="freelinking external" href="http://msdn.microsoft.com/en-us/goglobal/cc305148.aspx" rel="nofollow">http://msdn.microsoft.com/en-us/goglobal/cc305148.aspx</a></p>
      <p>as representing the character set that would actually be available to users of a Hebrew font unless they were using specialized software that accessed extra characters. (Of course, you wouldn't want to exclude anything available in Macintosh Hebrew - but I haven't found a reference for that.)</p>
      <p>Of course, one would still have to apply a knowledge of Hebrew to that chart, to realize that one would want, as glyphs, shin plus shin dot and shin plus sin dot, rather than trying to compose the characters - although vowel points, which <em>are</em> included on that code page, would normally be added by composing characters because of the number of possible combinations. (In Amharic, of course, distinctive glyphs are inescapable.)</p>
