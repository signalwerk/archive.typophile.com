      <p>if you want a set that is useful for siddurim (and by the way this is a HUGE market), then you need:</p>
      <li>kamatz katan</li>
      <li>chataf kamatz katan</li>
      <li>shva na</li>
      <li>shva nach (yes this is different from a regular shva)</li>
      <li>shva merachef</li>
      <li>dagesh chazak</li>
      <li>dagesh kal</li>
      <li>cholam chaser</li>
      <li>the "meteg" of the sof pasuk (usually looks like a meteg)</li>
      <li>meteg</li>
      <li>gaaya (usually looks like a meteg)</li>
      <li>mileil (so in Koren this glyph might look like a meteg below the letter, but in Rinat it will an ole above the letter)</li>
      <li>milra</li>
      <li>the two diamonds of the sof pasuk (as opposed to a colon)</li>
      <li>patach ganuv</li>
      <p>in general the mistakes in the taamey mikra (if I recall there are 3) need to be fixed. It seems that there was a misunderstanding that the taamim of the 21 books are different from then the "sifrey emet", ie Job, Proverbs and Psalms. I'm not really an expert in this area, but if necessary I can put you in contact with a number of people who can explain it, although there is an excellent book in Hebrew by Rabbi Broyer z"l called "Taamey Mikra".</p>
