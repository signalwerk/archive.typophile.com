      <p> For, <em>e.g.</em>, books, newspapers, <em>etc.</em>, letters Alef through Tav, punctuation marks Geresh &amp; Gershayim; possibly niqqud for some loan words.  Children’s books need niqqud and Shin &amp; Sin dots. Latin punctuation: commas, full-stops, <em>etc.</em> Not sure if there’s a standard for which set of quotation marks to use, though; I’ve seen both “high-high” and “low-high„—with the low quotes used as open quotes (on the right). Latin numerals.<br>
       Siddurim, <em>etc.</em>, need niqqud and punctuation marks Paseq &amp; Sof Pasuq (for embedded Biblical verses).  Some siddurim include cantillation for the Shema &amp; Shirat HaYam, but nothing complicated.<br>
       That what you had in mind?<br>
      —Joel</p>
