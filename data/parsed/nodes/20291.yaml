      <p>Looks good! Here are a couple of things I noticed:</p>
      <p>1. I'd try A but putting "cooks" in lower case and junior in caps (leave it as is). That way, you give some kind of "power" to the word junior (making the kids part more important and making them feel important - even if the show is aimed at the parents). Actually, its kind of the opposite of the cliché (junior in lowercase, bla bla bla), It could give something interesting.</p>
      <p>2. Less space between cooks and junior and less space in the black bubble, around the type.</p>
      <p>3. The little curvy thing on the bubble doesn't look "cartoonish" enough. Maybe you can simplify in by reducing the curve and getting rid of that pointy tip (slightly rounded tip could work)</p>
      <p>4. The colors work, but I think that the desired effect may be lost as you have an odd number of letters. I would try different tints of green without repeating the same swatch.</p>
      <p>5. Tighten up the kerning between "OR" in JUNIOR (and between "KS" in cooks if you leave it in caps)</p>
      <p>I like the fonts you chose for option A.</p>
      <p>Keep it up!</p>
