    <p>I've been working on this for not to long, and I'm wondering what you all think about it. Cooks Junior will be a new local PBS program with targeted at parents with recipes that parents can do with their kids, with connections to chemistry, math, ect. I've been thinking about the speach bubble motif, which granted, is extremely overused, but tried to make it cleaner but still playfull witht the colorblock for the "junior" text. I've so far chosen Gotham for "COOKS" and I'm not sure whether to use either Mrs Eaves or Base 9 for the "junior" text. Which set up do you prefer? also, any other type suggestions would be appreciated</p>
