    html: |-
      <p>I guess people wondered: why redraw it when it already existed digitally? Besides plagiarism, the problem with recreating so closely an existing font and releasing it freely is that it can devalue the original designer's work. Free fonts will always be distributed widely. The result: How many know about Creampuff? How many know about Eclat? Creampuff by a landslide. I don't blame Doyald Young for being miffed.</p>
      <p>It's probably best to contact the artist before you "correct" his work.</p>
