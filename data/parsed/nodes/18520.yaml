    html: |-
      <p>Just a few minor points...</p>
      <p>1. 1999: one lives and learns. Stephen, unless you completely bypassed the "youthful indiscretions" stage, lectures are perhaps just a tad hypocritical.</p>
      <p>2. At the time of Creampuff's making, I was not aware of Eclat being available in digital form: my reference material was a Letraset catalog that I had been holding onto for almost 30 years. No point piracy -- the font was completely redrawn.</p>
      <p>3. It would be one thing if I were selling Creampuff, and thus taking money out of Mr. Young's pocket, but this is not the case. And LONG experience has taught me that it is extremely doubtful that the existence of Creampuff has cost Mr. Young a single sale: free font addicts rarely, if ever, buy ANYTHING.</p>
      <p>4. Are you absolutely certain that Eclat is a completely original design, based on nothing that went before?</p>
