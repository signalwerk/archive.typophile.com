      <p>It's <a href="http://www.typophile.com/node/14581" rel="nofollow">Creampuff</a>, an old (1999) freeware font I did which was, in fact, <em>based</em> on<br>
      Doyald Young's <a href="http://www.identifont.com/show?2OZ" target="_blank" rel="nofollow">Eclat</a>. However, despite some assertions made in the above-referenced thread, the font was completely re-drawn, not pirated, and redesigned in some instances (compare the lowercase r in the two fonts, for instance).</p>
