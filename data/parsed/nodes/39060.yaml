      <p>In some typefaces, there is a problem of the narrow space in aogonek and uogonek between the curve that joins the stem and the ogonek. Take FF Meta as an example. In such cases, I would not be afraid of opening the space up from _both_ sides, i.e. modifying the curve of the letter in aogonek and uogonek as much as the curve of the ogonek itself. In other words, the shape of the original "a" does not always have to be identical to the shape of the "a" part in aogonek. </p>
      <p>Take a look at the attached picture (scroll right to see the wireframe outline comparison):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ogonekopen_3850.png"></div><p></p>
      <p>Note, I'm not saying that my quickly drawn ogonek shape is the best solution of FF Meta (though certainly better than what is included in FF Meta Pro). The main point I'm making is that I've moved the curve of the "a" part upwards. Think of it as creating an ink trap of some sort, just like you would in any other such situation. </p>
      <p>Also note that in some cases, you may choose to remodel the outer (right) part of the a-ogonek junction as I did, so it joins smoothly. Just popping on a composite ogonek wouldn't do it justice, really. </p>
      <p>Adam</p>
