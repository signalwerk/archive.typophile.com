      <p>Take a look at this</p>
      <p><a href="http://www.decodeunicode.org/u+012f" title="http://www.decodeunicode.org/u+012f">http://www.decodeunicode.org/u+012f</a></p>
      <p>THis version is right aligned</p>
      <p>There is also this<br>
      <a href="http://www.fileformat.info/info/unicode/char/012f/fontsupport.htm" title="http://www.fileformat.info/info/unicode/char/012f/fontsupport.htm">http://www.fileformat.info/info/unicode/char/012f/fontsupport.htm</a></p>
      <p>Many of these are right aligned including Cambria Myriad &amp; Consolas. Georgia is gently right aligned as is Gentium. Verdana seems left aligned. Palatino Courier New and Times seem centered. Some examples are hard to give an alignment to in some sense because the ogonek does not narrow. This doesn't seem right to me somehow but I am interested in opinion about that too. </p>
      <p>One area of difference too is if the ogonek is to the right on the serif or, if the design includes one - the serif.</p>
      <p>The diacritics project says <cite> Horizontally, the accent is never placed at the centre of the character (with the exception of į / Į and sometimes Ų, where this may occur) </cite> </p>
      <p>From: <a href="http://diacritics.typo.cz/index.php?id=20" title="http://diacritics.typo.cz/index.php?id=20">http://diacritics.typo.cz/index.php?id=20</a></p>
      <p>It seems to me that the trend is to set it to the right side either gently or more strongly. My guess is that that is what Adam suggested.</p>
      <p>But I am curious to see what folks here say too because there doesn't seem to be a clear cut answer.</p>
      <p>This is what mine looks like on a Monospace I am working on. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/iogonek_3641.jpg"></div><p></p>
