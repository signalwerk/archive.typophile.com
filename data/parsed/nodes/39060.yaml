      <p>BTW, regarding the width-to-height proportion of an ogonek, often the width-to-height proportion of average lowercase letters (e.g. e or a) is a good indication. In other words, you can draw a rectangle around you "a" (the bounding box), and then just scale it down to fit between the baseline and the descender, and align it optically to the right of the letter -- and you have a reasonable proportion for the ogonek. When the descenders are longer than usual, the ogoneks may be a bit shorter, especially in display faces. Also, in rather narrow typefaces, the ogonek may be a bit wider in proportion than the average letter (i.e. it can have the proportions of an "o" and not of an "a"). </p>
      <p>A.</p>
