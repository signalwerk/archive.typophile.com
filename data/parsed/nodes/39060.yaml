    html: |-
      <p>Jos, your ogonek are perfect, just fantastic. </p>
      <p>Pieter, I agree -- I personally prefer to give the ogonek less weight at the top, otherwise it looks clunky. I like your approach with the reduced weight but I think the entire set of ogoneks has a bit too much variation. I agree that it may need some variation due to the various attachment methods, but the variation should not be so noticeable. Aogonek, aogonek, eogonek are optimal. In Eogonek, Uogonek, uogonek, they are a bit too squeezed. I'd say that in Eogonek, the bottom end should not exceed the right edge of E but the top end can attach a bit to the left of the edge (a bit like in your iogonek). I'd also try to make the attachment in Uogonek a bit more like in eogonek. And then, uogonek is tricky but I'd say it will survive if the bottom end will exceed the boundary of the u a little bit, while it would not be so much squeezed. And then, I'd try to make the ogoneks in Iogonek and iogonek a bit more squeezed to get the curvature of the ones in aogonek/eogonek a bit more. Simply make the ogoneks in Iogonek and iogonek the same as you have them in Aogonek and you'll be fine. </p>
      <p>A.</p>
