      <p>Eben, </p>
      <p>I'm inconclusive about your two sets. I think the second set of ogoneks you posted does not really match the overall character of the typeface -- they are too narrow and too shallow. I liked the first set more but the ogoneks were too deeply curved, except the ones underneath the flat letters (iogonek, Iogonek). Use that structure for the remaining ones and you will be fine. In Uogonek, you could shift the ogonek a tad to the right so it merges with the letter really smoothly. In the first set, the attachment of ogonek into E was too thick but in Iogonek and iogonek it is fine. </p>
      <p>A.</p>
