      <p><cite>Well, maybe even all four with Jos’ example of a thinker more sturdy Ogoneck.</cite></p>
      <p>I was once told (can't regrettably remember by whom) that –unlike other accents or a cedilla– ogonek is an essential part of the glyph. It's not an accent on a glyph. It's another glyph.</p>
      <p><cite>Jos, your ogonek are perfect, just fantastic.</cite></p>
      <p>Thanks Adam, but 95% of the credits must be boomeranged back to you, because of the thorough guidelines for doing this :)</p>
      <p>@ Pieter: No rules as far as I know. Ogonek means little hook and we're both hooked :) I like the changes ... much more consistent. I would shift the ogonek a bit to the right on i I A E and a bit to left on U.</p>
