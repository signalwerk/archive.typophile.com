      <p>Some additional comment by me on Ebens first monospaced font (Eben Sorkin, 13.Nov.2007 9.24am) where he attached the ogonek to the end of the "serif".</p>
      <p>You (Adam) wrote: "I don’t think putting the ogonek at the very end of a serif works well. Serifs are not essential skeleton elements of the letter, so it’s logically inconsistent to attach something to them — and also, it does not work for me, optically. I do like Pieter’s solution." in reply.</p>
      <p>IMHO you are right in your basic observation ("serifs are not essential skeleton elements of the lett" [I usually put this that way: they are not meaning-bearing elements of the letter, which is a similar concept; though this can shift in time]). Therefore ogoneks also IMHO _generally_ would not go at the end of the serifs. However in some cases as in (a) generally sans-serif fonts (if present: e.g. on the capital I) and even more so in (b) sans-serif monowidth fonts they become something hybrid... more than just decoration, actually, they do become part of the letters. They get upgraded, they appear as strong as the letter itself, usually with the same stroke width as horizontals in the letters generally are, and they begin to bear a meaning (differentiation I from l, more prominently than they do in roman serif fonts e.g.).<br>
      A lot of people even write the capital I when standing alone WITH the "serifs" unlike any other "regular" serif which get lost in handwriting.</p>
      <p>Looking at Eben's later examples I figure that it is a sans-serif monowidth font with slight stroke weight alteration/dynamics and a double-storey a/g.</p>
      <p>In this special case I thought it did not look wrong at the right side, as (for me) an ogonek is an attached character written at the end of the writing process of the individual letter. Of course, nonwithstanding, in roman serif fonts the attachment point for the iogonek would be more or less centered, as the serifs in that style are superimposed decorational elements.</p>
    html_clean: |-
