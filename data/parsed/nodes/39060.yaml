      <p>Aszszelp, </p>
      <p>I like your idea. Slightly cutting off the edges of "A" and "E" looks convincing in this case, though on the other hand, the right leg of the "A" starts looking shorter so the top of the letter starts "tipping over" to the right a bit. It's usually a hard choice. I'd say, depending on the typeface, one may choose to make the ogoneks more or less integrated with the basic shape. If the letter has traces of calligraphy, then the ogoneks should be integrated with the base letter as naturally as possible, and the modification of the original base letters shape is possible and sometimes recommended. If the letter is extremely typographic or even mechanical (Clarendons, FF DIN etc.), then you can get away with an ogonek that obviously looks like it has been assembled together with the letter rather than growing out of it. </p>
      <p>A.</p>
