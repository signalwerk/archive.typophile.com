      <p>This isn't the document I was thinking of (I'll try to rummage it up at work Monday if you are still interest), but does show Adobe's thoughts on the matter:</p>
      <p><a href="http://www.adobe.com/devnet/opentype/archives/glyph.html" title="http://www.adobe.com/devnet/opentype/archives/glyph.html">http://www.adobe.com/devnet/opentype/archives/glyph.html</a></p>
      <p>Quoting  part:</p>
      <p>The glyph name is expressed as the prefix "uni" followed by two or more sequences of four hexadecimal digits. Each sequence of four digit hexadecimal digits indicates the Unicode scalar values of the standard Unicode characters, in order.</p>
      <p>For example, the character LATIN CAPITAL LETTER EZH WITH CIRCUMFLEX AND GRAVE, which is not in Unicode, should be named "uni01B703020300", since LATIN CAPITAL LETTER EZH is at U+01B7, COMBINING CIRCUMFLEX ACCENT is at U+0302, and COMBINING GRAVE ACCENT is at U+0300.</p>
      <p>A maximum of 7 name components is available with this format, due to glyph name length restrictions.</p>
