    <p>I've added the character Aogonekacute (along with other ogonek+acute vowels) to a font. I'm wondering about the proper way to name this character in the final font.</p>
    <p>Currently, I'm using A_uni0328_acutecomb, but was wondering if this is acceptable or if there are compelling reasons to instead use A_acutecomb_uni0328 (or, for that matter, uni004103280301 or uni004103010328).</p>
    <p>(The ccmp feature will build this character from any appropriate combination of A, Aacute, Aogonek and acutecomb/uni0328).</p>
    <p>Any advice would be appreciated,</p>
    <p>André</p>
