      <p><cite>was wondering if  . . . there are compelling reasons to instead use . . . uni004103280301 or uni004103010328).</cite></p>
      <p>Indeed there are. I forget the name of the document Adobe put out -- maybe someone can add that -- but if a character is *named* with the correct components as a Unicode number, it will be extracted from a PDF in proper Unicode. The program picks up on "uni", counts four digits for the first character, the next four for a second, and the next four for a third. I believe 12 digits (three characters) is all it will parse.</p>
      <p>I would use 0041 + 0328 + 0301, e.g., uni004103280301 as the name, which lists the bottom diacritical character first. But I believe it will parse with either diacritical given first.</p>
