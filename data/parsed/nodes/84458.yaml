    html: |-
      <p>The code which he offers isn't entirely implausible. It isn't a ligature rule, but I can envision a face in which a contextual alternates are used in such a way that it makes sense to place them in the 'dlig' feature (particularly if the alternate in question overlaps the preceding s in a way that suggests a ligature). Moreover, the code in the 'dlig' feature above wouldn't lead to the error which he's encountering. However, i_alt isn't a valid name -- you should use i.alt instead.</p>
      <p>I'd make sure that your glyphs are correctly named, that they are assigned unicode values correctly, and then let FontLab (assuming that's what you're using) to fill in the values in the 'Encodings and Unicode' pane automatically.</p>
      <p>The letters becoming white suggests you've got overlapping contours and/or problems with your path directions.</p>
      <p>André</p>
