    <p>Hi guys, probably this is a common mistake, but i don't know how can solve that.<br>
    I'm a student, I'm doing a font for my typography class, for now, I have only write ADHESION letters and there is only a ligature feature( It had to be a opentype font).<br>
    When I compile the script, it says me "[WARNING]  cmap{plat=3,script=1,lang=0}: empty encoding" that I really don't know what means.....</p>
    <p>But i can see my font without problem and every letter is ok, The preview works fine too.<br>
    then i add a ligature:<br>
    feature dlig {<br>
      sub s i' by i_alt;<br>
    } dlig;<br>
     and this works too.....<br>
    But i can't generate my font, i don't know why, i had to generate it in .otf(my professor want that) but i tried:<br>
    TTF/Unicode mode: and generate a blank preview of the font<br>
    TTF/Names mode: works, but i need an otf....</p>
    <p>OTF/Unicode mode: blank font<br>
    OTF/Names mode:generate a font with some errors in the graphics(some part of the letters became white in a casual way)</p>
    <p>Really i don't know what to do, some suggestions?</p>
