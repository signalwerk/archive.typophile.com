    <p>Hi all,</p>
    <p>Does anyone know any good quotes about designers?<br>
    Not about design or type design, which we had great posting about,<br>
    but ON or ABOUT designers...</p>
    <p>I found this one,</p>
    <p>"Good designers make trouble." -Tibor Kalman</p>
    <p>anyone?</p>
    <p>thanks,...</p>
