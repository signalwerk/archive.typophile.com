      <p>This designer is really not so much of a has-been, but more of a definitely won't-be.<br>
      When this designer opens her mouth, it seems that this is only to change whichever foot was previously in there.<br>
      This designer reminds me very much of a gyroscope - always spinning around at a frantic pace, but not really going anywhere.<br>
      This young lady has delusions of adequacy.<br>
      When he joined my agency, this designer was something of a granny; since then he has aged considerably.<br>
      This designer sets low personal standards and then consistently fails to achieve them.<br>
      This designer has the wisdom of youth, and the energy of old age.<br>
      This designer should go far - and the sooner he starts, the better.<br>
      Works well when under constant supervision and cornered like a rat in a trap.<br>
      This designer is depriving a village somewhere of an idiot.<br>
      Only occasionally wets himself under pressure. </p>
      <p>adapted from - <a href="http://www.snowman-jim.org/humor/GB-mil.html" title="http://www.snowman-jim.org/humor/GB-mil.html">http://www.snowman-jim.org/humor/GB-mil.html</a></p>
