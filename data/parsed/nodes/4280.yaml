    html: <p>I created a digital Pistilli Roman for Glamour magazine years ago (with the classic ampersand). I know of at least one other designer who has also created a digital version of the font (custom for a particular client). I've tried, years ago, to contact Pistilli but to no avail. I wonder if he is still alive.</p>
