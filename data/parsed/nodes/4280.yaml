  html: <p>Pistilli Roman was digitalised by Castcraft in their OPTI font range as OPTI Pirogi Roman which is now difficult to find. More recently, I have found a moderately good example of this font in the GST (GreenStreet) 500 Elegant Fonts range hiding under the name Galeere. It's not perfect and it doesn't have the alt flowery ampersand. Shame.</p>
