    html: <p>In 1969, Phil Martin (Alphabet Innovations) did a Pistilli Roman look-alike with tons of swash and alternate characters called Didoni. <a href="http://www.roostertypes.com/view_fullfont.asp?catalogid=3192&amp;issingle=yes" target="_blank">Didoni is available from Red Rooster</a>, but, unfortunately, when it was digitized, the extra characters (including the fancy ampersand) were left out.</p>
