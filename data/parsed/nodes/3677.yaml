  html: <p>My client says she got this font from a dry-rub (Letraset?) kit years ago. According to her the font name was Valhalla, but the only fonts I find with that name are scripts. Can anyone help? <br> <br><img src="http://www.typophile.com/forums/messages/83/28869.jpg" alt="NIFTY NOB"></p>
