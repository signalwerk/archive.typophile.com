    html: <p>That is the right name. It shows up in the Dover Solotype catalog (p. 83). The problem is that most of the type shown in the Solotype Catalog was not digital. It could be that it would be easier to re-create it using something that may approximate it, and modifying the O to look like this distinctive feature. Some of the fonts at <a href="http://members.aol.com/fontner/frontpage.html" target="_blank">Harold's Fonts</a> might get near this look, as he has picked up a lot of the so-called Retro typefaces. Denney One or Two, or Screwball might possibly work.</p>
