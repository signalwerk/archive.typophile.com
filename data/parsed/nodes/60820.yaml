      <p>I am afraid that spacing is language dependent. My "Lexique des règles typographiques en usage à l'imprimerie nationale" gives rules for spacing punctuation marks in French and those rules are automatically applied when I call <code>\usepackage[french]{babel}</code> in LaTeX.</p>
      <p>Michel</p>
