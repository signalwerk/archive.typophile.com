    html: '<p>See <a href="http://www.kltf.de/downloads/ATypI2007-CrossingBorders-kltf.pdf">this PDF</a>. A method for punctuation spacing is briefly sketched on page 33. In brief: Step one, space punctuation marks "normally"; step two, use a special lookup increase certain letter to punctuation mark spaces a bit. Also, another old <a href="http://kltf.de/downloads/SpacingIssues-kltf.pdf">PDF with historic examples</a>.</p>'
