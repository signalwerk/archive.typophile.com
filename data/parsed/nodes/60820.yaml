    html: |-
      <p>Well, as a user I prefer fonts that use consistent spacing for punctuation. If you have ever tried setting tables on a system without a decimal tab, you need to know that commas, parens, and periods (as decimal points) will all be a consistent width to help align things (along with lining figures with all nine digits the same width). I think that most of those fonts will have all the punctuation fitting to an en, em, or thin space width (the last being 1/6 em).</p>
      <p>But there will probably be tons of comments on the spacing of the en and em dashes, for instance. Personally, it would be ideal to me to have both dashes in two formats, one going tight to the side bearings (in books and journals you often need a 3 em dash, for instance). But for regular use, a small side bearing similar to the amount on letters would save having to kern out when a dash appears in text.</p>
      <p>In this age of alternate characters, we should be able to get both (in which case I would want the ones with side bearings as the default).</p>
