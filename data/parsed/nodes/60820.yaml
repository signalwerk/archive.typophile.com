    html: |-
      <p>Handling language specificity at the application level implies a default at the font level.</p>
      <p>The typical default is fine for most languages, but French is peculiar. Vive la différence!</p>
      <p>**</p>
      <p>It's important to understand editorial usage, especially for the ellipsis. I believe there are some Typophile threads on this, with solid advice from Charles Ellertson. </p>
      <p>As for dashes, some fonts give these wider sidebearings than others. </p>
      <p>Try to design the question mark with the "f" in mind.</p>
    html_clean: |-
