    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TheYanomamo_3467.png"></div><p></p>
    <p>On the wikipedia talk page, a user spelled the name of the Yanomamo people with an ogonek, yet the article is spelled with a combining cedilla. I could easily elect to use no diacritics and use the more common Yanomami spelling, but that would be fun at all!</p>
    <p>So... how is it spelled?</p>
    <p>Mike Diaz :-)</p>
