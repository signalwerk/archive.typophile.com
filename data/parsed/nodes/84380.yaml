    html: |-
      <p>Thanks.</p>
      <p>This involves a typeface design using the Buginese scripts, etc. (eg OT format in FL). The scenario goes something like the combined Latin and Buginese, as we know it on the application of Arabic + Latin. However, in the example of Buginese script that I ever created. This does not work properly if the Glyph Buginese placed in the specified range of Unicode.</p>
      <p>I still think that the range Unicode has been assigned to be used properly. But not sure if this can be programmed based on the specifications OT known today. For instance we create the behaviour in id script "bugi": </p>
      <ol><code>feature locl {<br>
      Language BUGI exclude_dflt;<br>
        sub @Latin_letter' by @Buginese;<br>
      } locl;<br>
      </code>
      </ol>
      <p>This tag is only a simulation, and I'm not yet sure if the tags can work properly for the language.</p>
      <p>And finally, the application of the face results on the keyboard. It's the reason I associate with the keyboard at the beginning of the question. As far as I know, driver Microsoft windows doesn't yet support for such as Buginese. In the driver we can find support for Thai, CJK, Vietnamese, etc., but the Buginese and Javanese, not yet (?).  </p>
      <p>Even the Microsoft Font Validator still does not recognize bit 96 of the UnicodeRange field, officially defined for the Buginese block range (U+1A00..U+1A1F), and reports an error if this bit is set.</p>
      <p>It really should not happen to the OS microsoft. But if the keyboard does not support. Is it still possible there is OT solution to this problem.</p>
      <p>Best regards</p>
