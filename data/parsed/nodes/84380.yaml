    <p>A question of discourse:<br>
    How do we utilize (the right way) in Fontlab for the Unicode codepage containing script languages ​​such as <a class="freelinking external" href="http://unicode.org/charts/PDF/UA980.pdf" rel="nofollow">Javanese</a>, <a class="freelinking external" href="http://unicode.org/charts/PDF/U1A00.pdf" rel="nofollow">Buginese</a>, <a class="freelinking external" href="http://unicode.org/charts/PDF/U1B00.pdf" rel="nofollow">Balinese</a> and <a class="freelinking external" href="http://unicode.org/charts/PDF/U1BC0.pdf" rel="nofollow">Batak</a>? </p>
    <p>Initially I thought this might be treated like Cyrillic or Arabic were performing with Latin. But I guess this would be difficult to access directly through the keyboard, given the existing lack of keyboard support. But this is only conjecture. I can not imagine how the final form.</p>
    <p>So far I use a <a class="freelinking external" href="http://www.dafont.com/ogiecappo-campotype.font" rel="nofollow">practical</a> way to put the glyphs of scripts in a Latin position that can be accessed directly via keyboard. Although helpful, but I know this is a mistake. The script should remain on the codepoint which has been commissioned by the unicode.</p>
    <p>Best regards</p>
