      <p>The correct solution for this problem would be creating a Keyboard Layout for the according script.<br>
      There already might be some prototypes or even standards already existing, so I’d just do a quick research online.</p>
      <p>Something that comes up for me (and generally a good resource on the topic:)<br>
      <a href="http://blogs.msdn.com/b/michkap/archive/2006/01/04/508678.aspx" rel="nofollow">Looking for a Balinese (or other language) keyboard?</a></p>
      <p>If you need to start from scratch, on Mac there’s an app called “<a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=ukelele" rel="nofollow">Ukelele</a>”, which can do everything you want.<br>
      On Windows, you would use <a href="http://msdn.microsoft.com/en-us/goglobal/bb964665.aspx" rel="nofollow">Microsoft Keyboard Layout Creator</a>.</p>
      <p>regards,<br>
      Frank</p>
