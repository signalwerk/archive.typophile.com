      <p>Not wanting to be rude, just asking: I am confused by the word ‘driver’ here: Isn’t a driver something to make the hardware work in the first place? (Like, a sound card driver, for instance). I believe a specific keyboard layout ranges some levels above the actual keyboard driver, as it has nothing to do with the specific hardware used. Right?<br>
