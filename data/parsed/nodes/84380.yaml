    html: <p>You will need custom keyboard drivers that will allow you to input the correct Unicode values. Note that since these languages may also require complex script shaping, being able to type them may not be sufficient, as the fonts will need OpenType or other layout tables and support from script shaping engines in the operating system or application.</p>
