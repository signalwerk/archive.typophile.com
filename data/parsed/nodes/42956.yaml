      <p><cite>«English is a a hybrid language formed from a Germanic base and with much French influence, starting in the 11th Century, thus causing the enormous difference between Middle English and Anglo-Saxon. If you are going to shout on a forum at least shout things that are true.»</cite></p>
      <p>But English is not a hybrid language, it is a purely Germanic language. It’s true that it’s been under extremely heavy Romance influence, but its base is still unequivocally Germanic—if anything, its <em>vocabulary</em> is hybrid.</p>
      <p>It’s also true that Romance languages have had some influence in the fact that certain sentence patterns and structures have fallen into disuse or at least become less common or more stilted than they once were (a good example is the reduced use of inversion in Modern English, a simplification that was no doubt partially spurred on by the relative lack of inversion in French); but that doesn’t make the English language itself any less Germanic in base.</p>
      <p>And really, in the entire period between Anglo-Saxon (I take it that by using this term, rather than ‘Old English’, you are referring to the earlier stages of the language?) and Middle English, Early French was hardly a major contributor in causing the rapid evolvement of the language. In the earlier parts of this interval, various Celtic languages and Latin were by far the largest influences, and in the later parts of it, Old Norse was—and of these, only Old Norse managed to really make any kind of lasting impression beyond the simple vocabulary level. It was only towards the very final stages of Old English, and especially in the early stages of Middle English, that French really began to be a heavy influence.</p>
      <p>But anyways—this is all neither really here nor there, nothing more than a derailment. Apologies if I came off like I was “shouting on a forum”, that wasn’t my intention. I just get all riled up when people create these ‘myth-busting’ articles and publish them for all the world to read, and then include such elemental errors. No hard feelings, I hope. :-)</p>
