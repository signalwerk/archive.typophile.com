    html: |-
      <p>That was great!</p>
      <p>But I bogged down in item four when you started discussing the letter "a" without quote marks, as I thought it was the indefinite article, rather than a noun. I often write about letters, and find that sometimes quote marks are necessary, sometimes not. </p>
      <p>Following the general principle "omit the mark if doing so doesn't disturb meaning", it would seem that it's better to discuss the letters of the alphabet without quotes; however, the fact that "a" may be mistaken for an indefinite article scotches that idea. Also, single letters may be mistaken for typos (i.e. the accidental addition of a space, or an "i" that has been inadvertently uncapitalized). So, although it might seem a bit pedantic, it's probably best to put quote marks around the letters of the alphabet when they're being used as names.</p>
