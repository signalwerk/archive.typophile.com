    html: <p>These are mostly correct, but I object to the elevation of "irregardless". Comparing it to "ain't" is nonsense. "Ain't" is practically as old as the English language; in strict usage it is a contraction of "am not". The illogically constructed "irregardless" is born of ignorance, and no more deserving of validation through repetition than "nukular" or "asterick".</p>
