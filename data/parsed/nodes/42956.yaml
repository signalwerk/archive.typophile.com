      <p><cite>«Gus, en- would be usually used if the word was taken via Norman-French (or later from French).»</cite></p>
      <p>Or from Greek (in which case it means ‘inside’, i.e., in a locative sense, rather than ‘into’ in an accusative sense).</p>
      <p>&nbsp;</p>
      <p><cite>«verbal prefixes with the meaning “not” can be (at least): in-, un-, a-, an-, non-, etc.»</cite></p>
      <p>And all but the last come from the exact same word, logically enough simply <em>n̥</em> (wonder how that will look in Georgia). <strong>Edit.</strong> Apparently none too good. That was supposed to be a syllabic n, an n with a ring under it.</p>
      <p>We should have just stuck with PIE while it was still a more or less homogeneous and manageable can of worms. Would have been much easier.</p>
