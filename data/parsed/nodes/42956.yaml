      <p>Um. It depends on the thought you're trying to express. If you're saying the same thing two different ways (e.g., to be poetic, to intensify the thought, or because you're misquoting the Cream song), then yes, it's a run-on sentence. But perhaps you mean that you're pleased to be feeling glad: "I am happy (that) I am glad." That's not a run-on sentence.</p>
