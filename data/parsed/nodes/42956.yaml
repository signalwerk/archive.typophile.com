      <p>Gus, en- would be usually used if the word was taken via Norman-French (or later from French). Not however, if it was taken directly from Latin via "scholarly" knowledge/introduction etc. Remember: in 1340 those who could write were 99.5% monks and would know (and use) latin all the time!</p>
      <p>Well, English had to endure a lot of "mixing"...<br>
      to sum up, verbal prefixes with the meaning "in" can be (at least): in-, en-<br>
      verbal prefixes with the meaning "not" can be (at least): in-, un-, a-, an-, non-, etc.</p>
