      <p><cite>«You shouldn’t end a sentence with a preposition. Wrong! You shouldn’t end a sentence with a preposition when the sentence would mean the same thing if you left off the preposition. That means “Where are you at?” is wrong because “Where are you?” means the same thing. But there are many sentences where the final preposition is part of a phrasal verb or is necessary to keep from making stuffy, stilted sentences: I’m going to throw up, let’s kiss and make up, and what are you waiting for are just a few examples. (See episode 69 for more details.)»</cite></p>
      <p>What the bloody hell?!? WRONG WRONG WRONG WRONG WRONG! [There’s a run-on sentence for ya!]</p>
      <p>I thought this guy was supposed to be <em>breaking</em> myths, not empowering and continuing them!</p>
      <p>The reason the myth that “ending a sentence in a preposition is bad” even exists is that purists in the 14th to 16th centuries all thought Latin was the greatest thing ever and French should be used as an ideal role model at all times; and in Romance languages, it <em>is</em> wrong to end a sentence in a preposition.</p>
      <p>But English is a Germanic language, and <em>there is never anything wrong with ending a sentence in a preposition in any Germanic language</em> (assuming it makes logical and grammatical sense to do so, of course), it’s a perfectly natural result of the rather complex patterns of word inversion that appear in all Germanic languages when fronting a sentential topic (some more complex than others, of course).</p>
      <p>And when it comes to ‘throw up’ and ‘make up’ … well, that just goes to show that the [excuse the harsh language] idiot who wrote this list doesn’t know a thing about language or grammar. ‘Up’ in these two phrasal verbs are <em>not</em> prepositions, they’re bloody adverbs! A preposition requires the possibility of adding an object, which neither of these two have. If an object is added, it’s the object of the verb, not the preposition (which is an adverb).</p>
      <p>&nbsp;</p>
      <p><cite>«Wrong. Arkansas’s is the only correct form for the possessive of Arkansas, as decreed by the Arkansas State Legislature (note that also it is against the law to mispronounce the name of the state whilst in Arkansas).»</cite></p>
      <p>But he was talking about Kansas, not Arkansas. ;-)</p>
      <p>(I have to admit, I don’t know if a similar situation exists for Kansas)</p>
      <p>Also, he completely neglects to mention here that where personal names taken from antiquity are concerned, there is in fact no choice: an apostrophe without an s is the only choice.</p>
      <p>&nbsp;</p>
      <p><cite>«I had an English teacher who used to go ballistic if anybody used the word “got”.<br>
      “BOY!” he would thunder, “Excise that word from your vocabulary!”<br>
      That’s why I tend to get (sorry) a bit sesquipedalian at times.»</cite></p>
      <p>Ugh, I hate people (teachers) who do that. <em>Get</em> is a good Ol’ Norse (that was a pun) word that’s been frequently used and has formed part of the basic core of English verbs and auxiliaries for at least seven or eight centuries. There is absolutely no reason to excise it.</p>
      <p>(And surely there is nothing wrong with sesquipedalianism, as long as it’s not outright hippopotomonstrosesquipedalianism)</p>
