      <p>"3. It’s incorrect to answer the question “How are you?” with the statement “I’m good.” Wrong! Am is a linking verb and linking verbs should be modified by adjectives such as good. Because well can also act as an adjective, it’s also fine to answer “I’m well,” but some grammarians believe “I’m well” should be used to talk about your health and not your general disposition. (See episode 51 for more details.)"</p>
      <p>Hm... isn't "to be" polysemic? Both a linking word (a _copula_), but also a regular verb?<br>
      While it's correct, that copulae bind adjectives to nouns, when it's used as a verb, it is modified with an adverb.</p>
      <p>Such, "I'm good" means "I am a good person", "I'm well" means "I'm feeling well".</p>
      <p>To answer the question "How are you?" with "I'm good" is either misunderstanding the question, or being the opposite of modest... :-)</p>
      <p>Well, that for the theory. In practice, a lot of people "say" I'm good. So from a descriptive point of view, it's correct. One ought not write it though. "You bloody don't write everything that leaves your dirty mouth". ;-)</p>
