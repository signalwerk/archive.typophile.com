      <p>"INFLAMMABLE" means that it can burn. The trick is that the in- in inflammable is not the same as in e.g. "inable".<br>
      Both are Latin verbal prefixes, but one relates to English "in-", the uther to English "un-".</p>
      <p>The one in "inable", "inadvertable" means (related to "un-") means "not": not able, not advertable, it's also the "ir-" in irrelevant (not relevant), but there the "n" turned into an "r" due to phonological processes in Latin.</p>
      <p>The one in "inflammable" (related to "in-") means the same as the preposition "in", it signifies direction, movement (in an abstract sense as well), or the following in time (metaphoric usage of "movement" used instead of space for "movement" in time). Here inflammable inflamm- (from inflammare) means to start burning (where the "start" semantic component comes from "in", the "burning" from flamm(are); flamm(are) is kin to "flame"), so inflammable means: it can start burning, it's burnable.</p>
      <p>Flammable is a neologism which is derived from the original inflammable (probably also through contamination with the English word "flame".<br>
      "inflame" (of which inflammable is derived with -able) is attested as of 1340. "flammalbe" is first attested 1813.</p>
