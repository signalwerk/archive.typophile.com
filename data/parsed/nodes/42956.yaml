      <p><cite>«Hm... isn’t “to be” polysemic? Both a linking word (a _copula_), but also a regular verb?<br>
      While it’s correct, that copulae bind adjectives to nouns, when it’s used as a verb, it is modified with an adverb.»</cite></p>
      <p>I can’t think of any (normal) instances where ‘to be’ is not a copula. A copula is not merely a verb that binds an adjective to a noun; rather, it’s any verb that connects the subject of a sentence with the subject complement. As such, it is a verb that connects to equal sentential units, and they must both be nominal (&nbsp;=&nbsp;either a noun, a nominal phrase, or an adjective). It cannot connect a nominal unit with a verbal or adverbial unit (using ‘adverbial’ in the non-systemic sense of ‘anything that’s neither nominal nor verbal’). The verb ‘to be’ is never modified; rather, is used as a ‘dummy placeholder’ in the required verbal position in the sentence when the subject itself is what’s being modified.</p>
      <p>Whether you say, “I am good” or “I am well”, ‘good’ and ‘well’ are both adjectives. ‘Good’ means what you say it means, dealing with inherent qualities (being a good person, &amp;c.), but it is also, albeit informally so, used as a subsitute for the adjective (not adverb!) ‘well’, which means ‘healthy, free of illness’. So, “I am good” can mean both things, depending on context.</p>
      <p>Consider that substituting a different adjective for ‘good/well’, but the sentence ceases to make sense if you substitute an adverb in their stead: “I am angry” works fine, but “I am angrily” does not. The only case where the latter might be said to work is if you take ‘to be’ in its meaning of ‘to exist’: “He exists angrily” would then imply the way in which he carries out his existence. It’s a bit far-fetched, but it’s the only way ‘to be’ can be used with an adverb that I can think of.</p>
