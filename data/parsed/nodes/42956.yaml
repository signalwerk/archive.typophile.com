      <p><cite>«He would have been better off just calling them particles, which is a better catch-all term for the preposition/adverb/etc that follows the root verb in a phrasal verb. (in English, at least)»</cite></p>
      <p>But that wouldn’t fit this particular context well, since dangling prepositions (or, if we’re including this airhead’s examples, dangling particles in general) is one of the cases where distinguishing between prepositions and adverbs actually becomes relevant, since it is possible—in most cases—to front prepositions, but never adverbs, in phrasal verb constructions.</p>
      <p>&nbsp;</p>
      <p><cite>«His reason: that “get” is an all-purpose word which lazy pupils will use when they can’t be bothered to think of anything more precise or interesting, and such bad habits will stunt the growth of their vocabulary, impoverishing their means of expression (and exam results). So:</cite></p>
      <p><em>I got up this morning: I arose<br>
      I got angry: I became angry<br>
      I’ve got to go: I must go<br>
      I get the point: I understand<br>
      ...and so on»</em></p>
      <p>I honestly cannot see why the existence of ‘get up’ should deny ‘arise’, or vice versa. This kind of teaching has always struck me as odd.</p>
      <p>Naturally, the students need to know that there are various different ways of expressing the same thing, and they need to realise that there are register differences between them. They should know that in a written work aspiring to be terse, epic, or poetic in character, writing, “I got out of bed this morning” is an inferior choice to, “I arose this morning”. But they should also know that in a colloquial, verbal setting, when chatting with your mates, the latter sentence would sound almost ridiculously formal, while the former would be neutral and expected.</p>
      <p>To say that only the higher-register forms should exist, and the lower-register forms should be expunged altogether is as much a crime against the language as the opposite would be. It’s linguistic snobbery, something that has plagued the history of the English language in particular (though many others have been nearly as affected by it) in the past demi-millennium.</p>
