      <p>yes the Vespa is more wabblely, small wheels and very bottom heavy.. motorcycles are more stable and easier to take curves and move. But in England you have to do a test with a 500cc manual if you want to ride a proper motorcycle. America they seem to let you ride if you take a class. But in England you have to take a class just to be allowed to ride a 125cc scooter or motorcycle and that is as high as you can go until you do your full test and written test. </p>
      <p>I'm going to rent a Multistrada 620 if I can and also test the Honda CBR 600RR or 600F. the Honda sounds nice but the Ducati is cooler and a good city bike. The Suzuki Gn125 that I'm renting is a piece of junk.. clutch is loose it needs a bit of choke to start up and then has a bit of trouble keeping an idle. The gears can be a bit clunky and it can't hit 50mph even though I have done 53mph on my Vespa and the Vespa sounds better than the Suzuki.</p>
