      <p>The best I can suggest is to start with <a class="freelinking external" href="http://new.myfonts.com/fonts/imageclub/serpentine-sans/" rel="nofollow">Serpentine Sans</a> and add the vertical terminals to the C and S.</p>
      <p>It seems that square stressed sans fonts are not common at all.</p>
      <p>- Mike Yanega</p>
