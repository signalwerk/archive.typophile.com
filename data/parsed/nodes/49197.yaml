  html: <p>FDK’s CompareFamily is blaming me for using underscores in glyphname extensions like in <code>zero.onum_pnum</code>. It interprets the glyphs as ligatures like a <code>f_l</code> glyph and it searches for the pnum glyph without any luck. Is it just FDK that is a little bit too sensitive here or does this affect decomposition behavior in Acrobat as well?</p>
  html_clean: <p>FDK’s CompareFamily is blaming me for using underscores in glyphname extensions like in <code>zero.onum_pnum</code>. It interprets the glyphs as ligatures like a <code>f_l</code> glyph and it searches for the pnum glyph without any luck. Is it just FDK that is a little bit too sensitive here or does this affect decomposition behavior in Acrobat as well?</p>
