    html: <p><code>zero.onum_pnum</code> is a fine name. Some CompareFamily tests may be too tailored to the glyph names we use at Adobe. Would be good to know exactly what's the message you're getting and which test is generating it, so that we can improve the algorithm to account for such glyph names. Thanks.</p>
