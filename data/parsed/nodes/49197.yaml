    html: |-
      <p>Thanks Miguel.</p>
      <p>The warning is in the <code>Single Face Test 26: Glyph name checks</code> part and says:</p>
      <p><code>Warning. Glyph name 'pnum' in ligature name 'zero.onum_pnum' is neither in the AGD, nor a 'uni' name, and can't be mapped to a Unicode value.</code></p>
      <p>The same message follows for all the other glyphs with the same kind of name extension. </p>
      <p>I'm running a rather verbose report with the following command:</p>
      <p><code>comparefamily -rm -rn -rp -hint -l ../log/compareFamily.log</code></p>
