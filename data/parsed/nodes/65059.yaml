  html: |-
    <p>I want to have a different version for a letter everytime you type the letter.<br>
    For example if you type a A and 30 letters later you type a A again then it should be the A.1 version.</p>
    <p>A——————A.1—————————A.2——-A.3——————A.4</p>
    <p>The code would be something like:</p>
    <p>sub A @all @all @all A’ by A.1;<br>
    sub A @all @all A’ by A.1;<br>
    sub A @all A’ by A.1;<br>
    sub A A’ by A.1;</p>
    <p>And that for every letter and alt version which makes the code really big.</p>
    <p>Is it possible to use a lookup for the @all part?<br>
    Like this:</p>
    <p>sub A’  A’ by A.1;</p>
    <p>Where the lookup is used for:</p>
    <p>@all;<br>
    @all @all;<br>
    @all @all @all;<br>
    @all @all @all @all;</p>
    <p>So the lookup can be easy re-used for the B and C etc. (and A.1 A.2 ...)</p>
    <p>Is there a more simple way to archive this?<br>
    I tried some things (with different code) but i moslty end up in:</p>
    <p>A/A.1/B.2/A.3/A.4/B.5</p>
    <p>where i want it to be:<br>
    A/A.1/B/A.2/A.3/B.1</p>
    <p>Also i can’t get the lookup from the opentype feature file specification to work:</p>
    <p><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.i" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.i">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.htm...</a></p>
    <p>I get the error:<br>
    aborting because of errors:<br>
    syntax error at “lookup”</p>
