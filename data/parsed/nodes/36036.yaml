  html: <p>The aims and scope of the <a href="http://www.bepress.com/ijdt/" rel="nofollow">International Journal of Digital Typography</a> are dedicated to the distribution of research results in the areas of electronic document design and presentation, with particular focus on the visual layout process and electronic representation of all sorts of data. The journal has a wide scope ranging from the many facets of methodological foundations to the details of technical issues and the aspects of industrial practice. The subjects of interest to IJDT will cover the full spectrum of methods for the entire life cycle of electronic and printed documents.</p>
  html_clean: <p>The aims and scope of the <a href="http://www.bepress.com/ijdt/" rel="nofollow" class="link-external">International Journal of Digital Typography</a> are dedicated to the distribution of research results in the areas of electronic document design and presentation, with particular focus on the visual layout process and electronic representation of all sorts of data. The journal has a wide scope ranging from the many facets of methodological foundations to the details of technical issues and the aspects of industrial practice. The subjects of interest to IJDT will cover the full spectrum of methods for the entire life cycle of electronic and printed documents.</p>
