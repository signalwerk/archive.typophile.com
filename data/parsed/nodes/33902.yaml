      <p>I think, too, its a very nice work.<br>
      It is not easy to do a character like this that does work also good in text.</p>
      <p>&gt; Maybe it is almost too historical/imitative to be used for regular jobs</p>
      <p>Yes, this is always the problem. Even if you have made something very nice, it maybe unusable for most part of the people in daily grafic live. And often – at least it’s may feeling about it – it’s also too sad to do so. Because the beautiful characters of the past maybe are not made for publicity or corporate purposes. Seems they are somehow misplaced there.</p>
      <p>bye<br>
      Stefan</p>
