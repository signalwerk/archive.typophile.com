    <p>Not a font by me, just one I stumbled across recently, from Lazydogs (Germany). So I hope this is the right category to post it in. (I tried posting this yesterday as a postscript to a fascinating Garamond-and-inkspread thread, but it's been dead too long and nobody goes there any more.)</p>
    <p>See it <a href="https://web.archive.org/web/20150123102702/http://www.lazydogs.de/fabiol" rel="nofollow">here</a> (+ PDF sample)</p>
    <p>As yet unmentioned on Typophile it seems. Not exactly a Garamond in the usual sense (if there is one) but I don’t think I have ever seen anything that captures the warm flow of original Renaissance letterpress pages quite like this. Just enough softness and irregularities (almost quirks when enlarged) to prevent any kind of dazzle or "lateral interference", and beautiful spacing for small sizes. Maybe it is almost too historical/imitative to be used for regular jobs, but it looks like an impressive piece of work. I would love to hear what the experts think about it.</p>
