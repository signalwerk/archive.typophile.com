      <p>Hey guys... all these comments are super encouraging!!<br>
      But just wanted to clarify the source of the piece. My name is Amritraj Gupta and i am an art director at TBWA (Dubai). I illustrated this piece last year as part one of three visuals for a recruitment company (Career Junction: part of Arab Media Group)  The piece was illustrated on the same pad of paper and the only photoshopped bit on the image is the header that says 'GROCERY LIST'</p>
      <p>Jacqueline.. i think Alison Carmichael's work is quite nice but unfortunately is not really the owner of the piece.</p>
      <p>This was a older post on my blog dating back to the time when the piece was made - <a href="http://www.artraj.com/blog/2008/04/">http://www.artraj.com/blog/2008/04/</a></p>
      <p>Thanks for all the comments guys. it was tons of fun to work on the project.</p>
      <p>-Raj<br><a href="http://www.artraj.com/blog">www.artraj.com/blog</a></p>
