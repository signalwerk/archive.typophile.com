    html: |-
      <p>What feast for the eyes...simply delectable...<br>
      I agree it was well thought out, carefully drawn and likely digitized, to overlay the tablet. I applaud the final product, however it arrived.</p>
      <p>The physical aptitude to draw well is so compelling, that I found ways to make ink washes on paper, which can be very unforgiving, behave in a true gestural style...on demand...<br>
      by completing several ink washes of the same subject, then using a collage technique to marry the best areas into one perfect (to me) ink drawing...like layers.</p>
