      <p>This is great. It takes the everyday, the hum drum, and the mindless and transforms it into an art form. I make lists everyday, to do lists, grocery lists, anything that is running through my head constantly until I get onto a piece of paper. The list above represents the trivial things we use and need in our daily lives that we might forget to appreciate. What would you do if you didn't have access to bread and milk, and toilet paper!?<br>
      Jess</p>
