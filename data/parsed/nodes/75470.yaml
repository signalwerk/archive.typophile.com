    html: |-
      <p>With regards the mark - "dp" is a very common two letter combination and a popular choice for creating a monogram. It is very hard to make something unique out of these two letters. For example, see <a href="http://www.helveticbrands.ch/blog/evolution_of_dache_logo" rel="nofollow">here</a>, which is just one person exploring various monogramming options. Another set of conceptes is <a href="http://www.flickr.com/groups/dataportability/pool" rel="nofollow">here</a>, and there are plenty more over at logopond and similar sites. </p>
      <p>In other words I would try and <em>not</em> do a monogram if it's at all an option.</p>
    html_clean: |-
