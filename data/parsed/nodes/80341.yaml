      Amiral (a dark stencil font. No lowercases)<br>
      <a href="http://www.editions205.fr/index.php?/projets/amiral/" title="http://www.editions205.fr/index.php?/projets/amiral/">http://www.editions205.fr/index.php?/projets/amiral/</a></p>
      <p>Colonel (3 series of capitals: cut, rounded and  sharp edges) and a complete font (lowercases and uppercases)<br>
      <a href="http://www.editions205.fr/index.php?/projets/colonel/" title="http://www.editions205.fr/index.php?/projets/colonel/">http://www.editions205.fr/index.php?/projets/colonel/</a></p>
