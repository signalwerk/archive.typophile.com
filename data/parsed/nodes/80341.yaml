    <p>Hello:</p>
    <p>This is the first time I have ever posted on this site. </p>
    <p>I am looking for a stencil font for a project and was wondering what your thoughts are on the best, the newest or most underused stencil face out there. I am leaving my options open for serif or sans.</p>
    <p>Any recommendations would be greatly appreciated.</p>
