      <p>I would recommend you use a less tonally similar (to the background) colour for the II. You could maybe put the date in the save the date banner. The choice of a serif for the BRAC Center… text seems strange I would look at the sans style with tighter leading, using half line spacing to keep the three elements (The BRAC Center… in Paris II, date and time, and ticket information) separate. btw, You need a space between •Reserved Tables. </p>
      <p>Tim</p>
