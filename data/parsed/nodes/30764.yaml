    html: <p>Quickly looking over this, I think the thing that bothers me most is that the date isn’t aligned on a grid with the text next to it (the text encapsulating the date, if you will). I think making the whole a bit more aligned could make it look more airy and clean. Give the shapes some air, and you will also lend it a bit more legibility.</p>
