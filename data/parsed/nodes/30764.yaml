    html: <p>I agree with Sebastiaan - give your letters some air to float in.  Also; the tower is lost in the background, and more letter space may help it.  Did you try playing with the opacity of the yellow text to let the tower shine through?  This may (?) give the effect of the letters being made of the moonlight … especially if you added a subtle yellow “spotlight graphic” (flashlight triangle) hitting the back of the text (from the moon).  Just a thought.</p>
