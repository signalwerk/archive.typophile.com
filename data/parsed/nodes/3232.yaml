  html: <p>So.  I got a new Power Book with Panther on it, and have been dealing with the throws of color managment recently. <br> <br>I just calibrated my monitor last night and what I have found is that though i would LOVE to use Adobe Photoshop 7's preferred RGB profile (sRGBIEC6 etc....) it seems to me that it is seriously oversaturated and too 'contrasty'.  When I output graphics for web work they look very dull.  When I open those same graphics in PS, they look great. <br> <br>I have been testing these outputs on a bunch of different monitors around the office and I have concluded that it makes more sense to not use Color Management (or use the Monitor RGB - Color LCD profile) and deal with the reality that most other monitors aren't going to display my graphics like PS would have me believe. <br> <br>I would really like to hear your thoughts on the matter.  What has worked for you?  What profiles do you use?  If any. <br> <br>Best, <br>Peter</p>
  html_clean: <p>So.  I got a new Power Book with Panther on it, and have been dealing with the throws of color managment recently. <br> <br>I just calibrated my monitor last night and what I have found is that though i would LOVE to use Adobe Photoshop 7's preferred RGB profile (sRGBIEC6 etc....) it seems to me that it is seriously oversaturated and too 'contrasty'.  When I output graphics for web work they look very dull.  When I open those same graphics in PS, they look great. <br> <br>I have been testing these outputs on a bunch of different monitors around the office and I have concluded that it makes more sense to not use Color Management (or use the Monitor RGB - Color LCD profile) and deal with the reality that most other monitors aren't going to display my graphics like PS would have me believe. <br> <br>I would really like to hear your thoughts on the matter.  What has worked for you?  What profiles do you use?  If any. <br> <br>Best, <br>Peter</p>
