    html: <p>If you have Adobe Photoshop, there is a little utility packed with it called Adobe Gamma. It has wizard and manual mode to callibrate your monitor and allows to manually set the levels of Red, Green and Blue. It has proven quite useful to me, while the Pantone Spider has given no acceptable result, as it does the callibration according to some imagined "standard", but I need to adjust the colors so that they'd look the same as they come out from my printer's offset press. Adobe Gamma does that pretty well.</p>
