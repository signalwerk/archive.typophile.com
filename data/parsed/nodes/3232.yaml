    html: "<p>Your post is ironic to me as I recetly slain the monitor calibration beast! <br> <br>About two weeks ago I was ready to throw my crappy new iMac out the window because among other things its LCD screen represented color so poorly I was WAY feeling buyers remorse. <br> <br>The problem was the only adjustments you can make are brightness and gamma. Which results in super saturated, high contrast colors over a really bright or dim white. <br> <br>I called Apple service which were no help, I searched through the Apple forums, Adobe forums, and found there were NO solutions to speak of. <br> <br>I finally just decided to Google it and about 6 pages in found a post in a threaded discussion about a monitor calibration application called SuperCal. <br> <br>It is AMAZING! I now have perfect calibration, perfect outputs, and across the board. Give it a try and let me know what you think, I'm honestly telling everybody about this app and am now going to keep the iMac. <br> <br>Check it out: <a href=\"http://www.versiontracker.com/dyn/moreinfo/macosx/12756\" target=\"_blank\">http://www.versiontracker.com/dyn/moreinfo/macosx/12756</a> <br> <br>Stuart :D</p>"
