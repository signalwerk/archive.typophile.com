  html: |-
    <p>Hey folks, I have been under the assumption that Design Observer was Proxima Nova Bold, Mark's wonderful Geo/humanist Sans. But after trying to roughly match it with the Myfonts tester, I realized that it is closer to Avenir (my new favorite) in every letter except the the "S" and the "R." Does anyone know what is being used?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DesObs_5842.gif"></div><p></p>
    <p>TiA,<br>
    Mike</p>
