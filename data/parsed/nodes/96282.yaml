    html: <p>Don't know (or think) if Nelio design has been based on an existing (or not) typeface. It reminds somehow <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/bickham-script-mm/" rel="nofollow">Bickham Script</a> and some of its alternates. There's also <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-champion-script-pro/" rel="nofollow">Champion Script</a>, mainly the lowercases, uppercases look too flourished.</p>
