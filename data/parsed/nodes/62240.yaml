      <p>The "TrueType not suitable for printing" idea is from pre-Opentype days, and was mostly a myth spread by printers who didn't want to support it. Generally it was because they were dealing in formats that lacked font embedding. The "problem" was that if a customer sent a document that specified a TT font of a commonly-used typeface, but didn't include the font, the printer would substitute the version from their own Type 1 font library, which could have slightly different metrics and make the flow come out differently.</p>
      <p>Nowadays you can send a PDF and it won't matter what you used in it.</p>
