    <p>Ok, I've tried searching the forums to this question. I'm sure it's here somewhere.</p>
    <p>But, I would like to know which is preferred for printing? I've had a few people tell me that true type fonts are not suitable for print design (though I'm not exactly sure why). I can't find a definitive source saying this is true. Which I am ok with b/c I use mainly Opentype PS. I have a few Opentype TT, though, and my question is are these suitable for printing? And if not could someone care to explain why?</p>
    <p>Thank you,</p>
    <p>Logan</p>
