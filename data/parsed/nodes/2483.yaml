    html: <p>I've recently entered the seller's game on eBay and have done some buying here and there. This is what I think I know about it.  <br> <br>Like chess there are a number of different game strategies for bidding on eBay. Beginning, middle, ending. <br> <br>A friend of mine has some kind of software that can be keyed for the end game. It will activate a bid within seconds of the auction ending. He doesn't even have to be there, the software does the bidding for him. A very high bid here will secure the item at only a little more than the previous bid. I think a lot of folks are using stuff like this. Only real safeguard against this is to place a middle to late bid for what the item is actually worth on the open market, lowest value will often do. You will rarely lose this way and will still get it cheaper. Just not as cheap as in your dreams. <br> <br>Sometimes you might have to bid early to detect if there is a reserve or bid early to middle to detect if the hidden high bid is beyond what you realistically want to pay, and you don't really want to spend an awful lot of time dealing with the particular auction. Or if you can't be there when the auction ends. Real problem with bidding earlier at a higher price is when some newbie runs the sucker up with idiotic repeated incremental bids to find out what the bottom is.  <br> <br>Items that sell for a consistent price can easily be won by simply bidding that price early on and then ignoring the rest of the auction. I've been buying camera accessories that way recently and still get new items at 60 to 75 percent of what I would have to pay for them at discount stores. <br> <br>When you see someone bidding against their own previous bid, you know they want it pretty bad, at any cost, and you could end up paying a lot by intervening with a bid. But sometimes this is just a ploy on the part of the bidder.</p>
