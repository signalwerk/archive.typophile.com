    html: "<p><i>Doesn't that in effect mean your maximum bid was too low?</i> <br> <br>If an auction has a time limit on it, like eBay, I don't see any point in a fixed budget: you'll lose almost every time. And if you put in a very high bid all the time, you'll usually end up paying too much all the time. So the trick is to make a series of incremental bids responsive to what other people are doing, not just make one bid and hope for the best. The frustration comes when your last bid is for $500 and someone comes along five seconds before the auction ends and gets the item for $500.50.</p>"
