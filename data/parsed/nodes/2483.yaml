    html: <p>"but this budget is certainly variable enough to take into account an extra 50 cents or whatever the incremental increase set by the seller is" <br> <br>John <br> <br>The incremental increase isn't set by the seller. eBay sets this, the seller has no control over it. <br> <br>By rummaging around in Google I've recently discover that the various sniper software (or whatever it is called) is seemingly ever in various states of revision as eBay is constantly changing its own software. Not to screw up these folks, eBay has no policy on that, but the various sniper software vendors are always complaining about having to issue new versions. Pity. Its not just the sniper-less buyers who don't like this kind of bidding, the sellers don't either. I suspect eBay really has no policy on it because they figure if folks are dumb enough to buy sniping software its just more activity for them. They make their money from percentages of sales and various listing fees that the seller has to pay for.</p>
