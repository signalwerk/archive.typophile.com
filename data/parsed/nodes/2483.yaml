    html: "<p>Lots of good advice in this thread, bj. A few suggestions from my experience on Ebay: <br> <br>- Do your homework. Do some research and compare prices, descriptions, and sellers. Like everything else in life, if it's too good to be true, it's probably not true. <br> <br>- If there's something you really want, avoid the automatic bidding and be present at closing time. <br> <br>- Make sure you read carefully all the fine print. Shipping costs, payment methods, etc. <br> <br>- Trust high sellers with positive ratings, it's on their interest to keep customers satisfied. Also, read the comments people post in the feedback section, they are a very good indication on what to expect. <br> <br>- Since you can always contact the seller privately, do not trust people not willing to provide enough info or the ones that don't show images of expensive items; if you were selling something valuable, you would provide as many pics as you could in order to entice customers, wouldn't you? <br> <br>- When confronted with multiple options, follow your instinct. <br> <br>It might sound as if I have encountered a lot of crooks on Ebay but that's not true. Most of my bad experiences (not that many) have been my fault for getting carried away or for not being careful enough. In all, I have gotten quite a few gems, like a very nice copy of the 1923 ATF specimen book. <br> <br>Good luck!</p>"
