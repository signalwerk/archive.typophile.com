    html: <p>But if your fixed budget for an item is $100, the nature of the eBay mechanism -- time limit and incremental increases -- makes it likely that you will see the item go to someone else for only a little more than that. A bidder coming in in the last few seconds knows there is very little chance of having to pay his maximum bid, so can gamble that the current maximum bid is not much more more than what is showing. It is necessary to tailor one's bidding strategy to the nature of the auction. At a live auction, when there is no time limit and I can see the other bidders, I have a totally different approach. <br> <br>Of course I have an actual budget in mind, which correlates to what I think the item is worth (when I've overpaid for an item, it is because I've overestimated its value), but this budget is certainly variable enough to take into account an extra 50 cents or whatever the incremental increase set by the seller is. I don't mind losing an item that goes well beyond what I am willing to pay, but it is frustrating to see items getting away for small change.</p>
