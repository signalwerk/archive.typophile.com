    html: <p>I've done quite a lot on EBay. I think over 100 purchases. <br> <br>The only time I've had serious problems were with incredibly cheap audio CD collections, which turned out to be pirated. That was a case where the folks were selling a whole ton of copies, not just one. <br> <br>The more money they stand to make (either from one sale or an identical batch), the more you should check the seller's credentials. You can tell how long they've been doing this, and their percentage of happy customers, by clicking on their ratings in the top right. <br> <br>In your case, the seller has been doing this a really long time, has thousands of satisfied customers, and a 480:1:1 ratio of positive feedback to neutrals and negatives. So they've got a great track record. No reason to not trust them, I'd say. <br> <br>T</p>
