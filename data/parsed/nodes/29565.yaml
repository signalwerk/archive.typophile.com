    html: |-
      <p>The side should form a 60º angle with the base.</p>
      <p>Suppose the length of an edge on such a pyramid is 2. Then each equilateral triangle has legth of side 2 and altitude sqrt(3). (Where sqrt is the square root.) If you were to slice the pyramid vertically along a plane containing the center and one edge, you would obtain a 2 by sqrt(3) by sqrt(3) isoceles triangle where the angle between the sides of length sqrt(3) is the angle you need. Applying the Law of Cosines to this triangle gives the angle as 60º.</p>
      <p>This angle will be the same regardless of the size you choose.</p>
      <p>This may be difficult to visualize but I'm not good enough in Illustrator to draw it out.</p>
      <p>So to ensure that it fits together properly with the sides joining to form an edge of the pyramid, you will need to cut each side at 30º (the two together will form the 60º whole).</p>
      <p>D Riley</p>
