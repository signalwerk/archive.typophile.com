      <p>Are you making a five-sided pyramid (with a square base) or a four-sided pyramid (triangular base)? I guess, since you mention 45º, that it is the former. The trouble you face is that compound angle cuts are required.<br>
      The formula you need is here<br><a href="http://www.woodcentral.com/bparticles/miter_formula.shtml">http://www.woodcentral.com/bparticles/miter_formula.shtml</a></p>
      <p>btw 45º is certainly not correct.</p>
      <p>Tim</p>
