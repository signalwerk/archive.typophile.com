    html: |-
      <p>Depending on how flexible you are, I would take a piece of wood about 12 inches long* and 3 inches wide and deep, make a mark 2.6 inches from one end on each face and using an accurate table saw with a mitre guide set at 30º from right angles to the saw blade and make four cuts, one on each plane, finally cut at right angles to the blade to remove the excess.<br>
      The efficacy of this is going to depend on the quality of the wood and saw (and your measurements [and my maths, so double check before you cut], in spite of your best efforts the saw might still remove the tip).<br>
      The chances of creating a pyramid of such a small size with wood 3/4 inch thick accurately are slim. Why are you making one? ceremonial burial of a scarab beetle?<br>
      Quick illustration of what I mean<br><img src="/sites/default/files/old-images/pyramid_6621.gif"></p>
      <p>Tim<br>
      * long enough to be able to hold it firmly against the guide and not remove any fingers.</p>
