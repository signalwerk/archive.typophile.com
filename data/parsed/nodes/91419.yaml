      <p>Luxury underwear? Why not just use Trajan? Kidding.</p>
      <p>I like the name, the use of "V" and the Vitruvian Man<br>
      idea. But the circle+square rendering seems to have<br>
      little bits that won't survive - to me you need something<br>
      simpler, and playing with negative shapes might click.</p>
      <p>FWIW your logotype reminds me of Athleta's:<br>
      <a href="http://brandsarchive.com/public/files/athleta/athleta.jpg" title="http://brandsarchive.com/public/files/athleta/athleta.jpg">http://brandsarchive.com/public/files/athleta/athleta.jpg</a><br>
      That might be a good thing though.</p>
      <p>BTW, I'm sure you'll get much better opinions<br>
      from actual graphic designers - I myself only<br>
      make typefaces.</p>
      <p>hhp</p>
