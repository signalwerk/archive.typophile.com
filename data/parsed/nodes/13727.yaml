    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : Central Saint Martins College of Art and Design</strong></p>
    <p>Part of the <a href="/wiki/University%20of%20the%20Arts%20London" class="freelinking" rel="nofollow">University of the Arts London</a> (until recently called the <a href="/wiki/London%20Institute" class="freelinking" rel="nofollow">London Institute</a>), together with <a href="/wiki/London%20College%20of%20Communication" class="freelinking" rel="nofollow">London College of Communication</a>, <a href="/wiki/Camberwell%20Collge%20of%20Arts" class="freelinking" rel="nofollow">Camberwell Collge of Arts</a>, <a href="/wiki/Chelsea%20College%20of%20Art%20and%20Design" class="freelinking" rel="nofollow">Chelsea College of Art and Design</a>, and the <a href="/wiki/London%20College%20of%20Fashion" class="freelinking" rel="nofollow">London College of Fashion</a>.</p>
    <p>Their website is: <a href="http://www.csm.arts.ac.uk/" rel="nofollow">http://www.csm.arts.ac.uk/</a></p>
