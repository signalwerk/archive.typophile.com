  html: |-
    <p>At the <a class="freelinking external" href="http://www.sonsbeek2008.nl/read/en/home" rel="nofollow">10th Sonsbeek International Sculpture Exhibition</a> (sonsbeek 2008: grandeur) <a class="freelinking external" href="http://www.sonsbeek2008.nl/read/en/exhibition/artists/tavares" rel="nofollow">Ana Maria Tavares</a> used Museo for her work "Five Secrets of the Waters (For Mnemosyne)". There are five stones in Sonsbeek, each at a junction of an underground stream. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/s1_3506.jpg"></div><p></p>
    <p>Museo is also used for a little booklet/folder.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/s2_5093.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/s3_4276.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/s4_3722.jpg"></div><p></p>
