    html: |-
      <p>AFAIK, if you identify one of the problem applications, you don't need to test in all of them. They are working the same way.</p>
      <p>It's my theory that the reason for the bug is a combination of a stupid assumption by the application, and the way Windows GDI works.</p>
      <p>The dumb assumption is that any font that isn't the bold style of another font has a weightclass of 400, and anything that is the bold style of another font has a weightclass of 700.</p>
      <p>So, you select a font. The app says, "okay, that's the base font 'Glurbish', so the weightclass is 400." Doing this WITHOUT checking the weightclass.</p>
      <p>The app then calls GDI for Glurbish with a weightclass of 400. GDI as always returns the closest match it can find. GDI will also automatically embolden fonts for you if you don't have a bold. So let's say there is no bold version of Glurbish, and there is only an ExtraLight (weightclass 200). The app asks for Glurbish-400, and GDI says, well, I could give them Glurbish-200, or I could do a faux bold and add 300 to that. Well, Glurbish-500 would be closer, so I'll do the faux bold on top of Glurbish-200. Or if you have a real style-linked bold, you get that instead.</p>
      <p>So that's why 250 is the exact lowest value that works safely in such an application.</p>
      <p>Some of the style-link combination stuff is *really* weird though, and I don't think I ever figured out all the reasons why it works the way it does.</p>
      <p>Regards,</p>
      <p>T</p>
