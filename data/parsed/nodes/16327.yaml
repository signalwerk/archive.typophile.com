    html: "<p>The workaround is to name the font whatever you damn well please, but change the weight fidure to something north of 400. I have done this in my font families, and they work fine. Font Validator sees that there is a disconnect between the name and the number, but this doesn't (seem to) cause any actual problems. The other great thing about manual tinkering with the weight figure: you can name fonts whatever you like, and OS X will list the fonts in the font menu in the numeric order. So, if you want to have \"emaciated\", \"skinny\", \"plump\", and \"bootylicious\", you could do that by numbering the fonts 500, 600, 700, and 800 respectively.</p>"
