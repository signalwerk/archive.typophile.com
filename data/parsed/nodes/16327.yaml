      <p>I remember Adam talking about it during a FontLab training session in New York. The problem is the naming and value number. I may be mistaken, but I think the idea was to not select the category extralight and to use Light instead (even if your stem widths really are xtralite). Also, include Xtralite in the name of the font. My memory of the screen weight doubling in Windows is the same as Mark's above.<br>
      It is pretty rare to see an xtralite weight used for small sizes so screen draw is less of an issue.  At text sizes, there just aren't enough pixels to display the font.</p>
      <p>ChrisL</p>
