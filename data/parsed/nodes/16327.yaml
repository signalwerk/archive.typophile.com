      <p>The minimum value is actually only 250. You can name the weights whatever you want. However, things get more complicated if you have a style-linked bold: there are certain weightclass combinations that are okay, and others that are not.</p>
      <p>The problem is on Windows only, and only with some apps (though "some" means "about half"). </p>
