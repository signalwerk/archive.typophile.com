      <p>There is some situation on Windows in which, if you use a value of 200 or lower, the screen image will be doubled up to make it thicker, as if the weight specified would be too thin to display otherwise. Needless to say, this would interfere with the designer's intent about how the font should look. The solution (i.e., hack, workaround) is to not use a value lower than 250.</p>
      <p>(Sorry for the lack of concrete information. There was a discussion about this either here or on the FontLab forum, but I can't seem to find it. This is all from memory.)</p>
