    <p>i was reading through the FontLab Studio 5 manual last night on naming and it points out that the weights "Thin," "Extralight," and "Ultralight" should be avoided. I thought there was some more infomation on this problem here on typophile, but i'm not finding it right off. Can anyone point me to some reading that explains the problems associated with these weights and how to work around this? The FLS5 manual suggests using the light designation for ultralight fonts, but the problem is i'm using light for the light fonts.<br>
    Another thing, when I do enter the weight as Extralight it automatically sets the weight value to 200. When i run check names i get a message that states "- Weight value is less than 250 which is not recommended". Is it actually the weight value that is the issue and not the name Extralight? If so, can i just cheat and set the weight value for the Extralight to 250 and be done with it? Any help is much appreciated, thnx for looking.</p>
  html_clean: |-
    <p>i was reading through the FontLab Studio 5 manual last night on naming and it points out that the weights "Thin," "Extralight," and "Ultralight" should be avoided. I thought there was some more infomation on this problem here on typophile, but i'm not finding it right off. Can anyone point me to some reading that explains the problems associated with these weights and how to work around this? The FLS5 manual suggests using the light designation for ultralight fonts, but the problem is i'm using light for the light fonts.<br>
    Another thing, when I do enter the weight as Extralight it automatically sets the weight value to 200. When i run check names i get a message that states "- Weight value is less than 250 which is not recommended". Is it actually the weight value that is the issue and not the name Extralight? If so, can i just cheat and set the weight value for the Extralight to 250 and be done with it? Any help is much appreciated, thnx for looking.</p>
