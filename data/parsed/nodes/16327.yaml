      <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_font_wt_win.html" title="http://partners.adobe.com/public/developer/opentype/afdko/topic_font_wt_win.html">http://partners.adobe.com/public/developer/opentype/afdko/topic_font_wt_...</a></p>
