      <p>Satya,<br>
      I know nothing about the devanagiri script so I won't be much help.</p>
      <p>I do notice the transitions in your curves have tension points and don't progress smoothly out of the straights.  Generally, the glyphs look too grid imposed.<br>
      You might try putting a copy of all the glyphs (as you have them now) on the mask layer and then releasing points in the glyph layer and adjusting them to smoother transitions. This is also good eye training.</p>
      <p>ChrisL</p>
