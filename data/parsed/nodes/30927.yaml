      <p>Satya:</p>
      <p>&gt; Am designing a display face for Hindi(devnagiri) Newspapers.<br>
      &gt; I know its a bit difficuilt to give feedback on a non-latin<br>
      &gt; typeface and most of you are not at all familier with devanagiri…</p>
      <p>It was reported in "Times of India" that "India has a third of world's illiterates".</p>
      <p>see <a href="https://web.archive.org/web/20150123094309/http://timesofindia.indiatimes.com/articleshow/916814.cms" title="http://timesofindia.indiatimes.com/articleshow/916814.cms">http://timesofindia.indiatimes.com/articleshow/916814.cms</a></p>
      <p>So it does not surprise that a third of the Indian population does not know how to spell the script name "Devanagari".</p>
      <p>- Some illiterates write "devnagiri".<br>
      - Other illiterates write "devanagiri".</p>
      <p>That's bizarre ("giri" denotes "mountain" in both Hindi and Sanskrit,<br>
      see also <a href="https://web.archive.org/web/20150123094309/http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="http://www.sanskritweb.net/itrans/itmanual2003.pdf">http://www.sanskritweb.net/itrans/itmanual2003.pdf</a>)</p>
      <p>Who wants to design letters of a script should at least know how to write the name of the script, shouldn't he?</p>
      <p>Satyam eva jayate.</p>
