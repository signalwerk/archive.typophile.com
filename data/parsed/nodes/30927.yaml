    html: |-
      <p>I concur against Uli.<br>
      I'd say (also not knowing Devanagiri) that in general you should keep shapes from getting too close to each other. I'm going to refer to characters by coordinates here, to make it easier. Fourth row third from the left would be (4,3).<br>
      The related little enclosed areas in (4,2), (4,3), and (8,1) will probably close up at smaller sizes. The two shapes in (1,2) will almost definitely merge; (7,2) might also. In some characters your top two strokes are probably too close for comfort; probably there should be a standard distance between the two that you can stick to most of the time. I'm looking at (1,1), (1,2), (1,5), (3,3), (7,4), and maybe (6,4) here. And also, I think that the two lines in (5,3) should either connect or stay a bit farther apart. If I'm wrong about any of this for some reason feel free to ignore the offending part. On a positive front, I think it looks very sturdy, and I like the rounded DIN-style corners a lot. Unfortunately, I'm not qualified to offer further praise.</p>
