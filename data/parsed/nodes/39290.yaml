    <p>A fixation is the time between <a href="/node/39289/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Saccade</a>s where the eye remains relatively motionless. It is during a fixation that the eye processes the information being viewed through either a word based or shape based (often referred to as <a href="/node/13763/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">bouma</a> on Typophile) recognition process or part based letter recognition&nbsp;process. </p>
    <p>This information is processed in the <a href="/node/39291/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Fovea</a> of the&nbsp;eye.</p>
