    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Fixation</strong></p>
    <p>A fixation is the time between <a href="/wiki/saccade" class="freelinking" rel="nofollow">saccade</a>s where the eye remains relatively motionless. It is during a fixation that the eye processes the information being viewed through either a word based or shape based (often referred to as <a href="/wiki/Bouma" class="freelinking" rel="nofollow">Bouma</a> on Typophile) recognition process or part based letter recognition process. </p>
    <p>This information is processed in the <a href="/wiki/fovea" class="freelinking" rel="nofollow">fovea</a> of the eye.</p>
