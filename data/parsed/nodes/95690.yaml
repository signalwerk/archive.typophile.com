    <p>I'm after a serif for body copy to run alongside stainless and dispatch.<br>
    It's for a print magazine for Patent Attorneys. It will be text heavy with mainly photographic head shots and illustration making up the pages.<br>
    I like both Farnham and Miller but am struggling to decide which is more suitable and will also have more longevity?<br>
    Thoughts?</p>
