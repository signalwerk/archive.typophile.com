    html: <p>The face is actually called Too Much from the Visual Graphics library. I have a couple of specimen books that contain showings at home, but not here at the office. I'll see if I can get a scan posted later today. By the way, <a href="http://www.imageclub.com/">Image Club</a> digitized three variations of Too Much in 1989, but they didn't make the cut when we migrated the library over as part of Adobe in 1994. If you can find an old Image Club LetterPress CD kicking around somewhere, you'll find it on that disc.</p>
