    <p>Hi,<br>
    I’m typesetting my first book, and after a month of looking through books, found one set in a typeface that looked fantastic, and it was id’d as Bookman in the id forum. I believe it is Bookman oldstyle. </p>
    <p>The book is a collecton of short horror stories, trade paperback. I’ve searched through suggestions for book fonts, but bookman old style is not on any of those list. Is there any drawbacks to using this font, or any reason it shouldn’t be used? I’ve only seen it used in the one book. I really seem to be attracted to thicker, chunkier fonts for long passages of text. Any other suggestions if this isnt a good one to use?</p>
    <p>I printed out a few pages, 10pt seemed too small and 11pt too big. 10.5 looked just right. Is it okay to use half sizes?</p>
    <p>Also, I’d like a typeface suggestion for the story title pages that would compliment well. Probably somewhat condensed as some of the titles are long. I was thinking Bodoni condensed, but seems I’m always using that. </p>
    <p>Thanks for any suggestions!</p>
