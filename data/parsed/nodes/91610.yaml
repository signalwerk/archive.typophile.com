  html: <p>Hello everybody! Im new here, nice to meet you. Im starting my own streetwear label called the "Ides of March". I created my own logo for it but think it may be a little bit lacking. My wife seems to think the logo is missing that "something" so I may be coming to a realization of changing the logo. However, everyone here seems very insightful and knows their design so I wanted to get you take on it. Please don't hold back, I can take it. Any advice or insight would be very much appreciated. Unfortunately my work's internet prevents me from uploading the image, you can check it out on <a href="http://www.BewareTheIdes.com" title="www.BewareTheIdes.com">www.BewareTheIdes.com</a>. It's the large "I" with a crown logo on the main page, you cant miss it lol. Thanks, I'll upload an image when I get home.</p>
  html_clean: <p>Hello everybody! Im new here, nice to meet you. Im starting my own streetwear label called the "Ides of March". I created my own logo for it but think it may be a little bit lacking. My wife seems to think the logo is missing that "something" so I may be coming to a realization of changing the logo. However, everyone here seems very insightful and knows their design so I wanted to get you take on it. Please don't hold back, I can take it. Any advice or insight would be very much appreciated. Unfortunately my work's internet prevents me from uploading the image, you can check it out on <a href="http://www.BewareTheIdes.com" title="www.BewareTheIdes.com" class="link-external">www.BewareTheIdes.com</a>. It's the large "I" with a crown logo on the main page, you cant miss it lol. Thanks, I'll upload an image when I get home.</p>
