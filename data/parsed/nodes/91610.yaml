    html: <p>Sami, I'm certainly not an expert on street art, graffiti, etc., but to me your logo lacks the energy and spontaneity needed to reflect that type of art. Your logo is very symmetrical, precise, etc. I'd suggest going back to the drawing board and try to create a logo that looks more like street art. The "ides" art on your Kickstarter page that has more of a grunge look is maybe a step in the right direction.</p>
