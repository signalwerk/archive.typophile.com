    html: |-
      <p>As long as you don't mind losing money with a less-than-ideal logo...  :-/<br>
      As the saying goes, you have to spend money to make money.</p>
      <p>Two other points:<br>
      1) Although there are talented graphic designers who frequent<br>
      Typophile, we're mostly focused on letterforms, and in your logo<br>
      there's only one, plus it's a simple one. So as things stand you<br>
      might not get very fruitful feedback.<br>
      2) Context is everything. You know what your product is about,<br>
      but for a third-party to help you he would need to know a lot more<br>
      about the nature of the clothing, the potential customers, etc.</p>
      <p>In any case, good luck.</p>
      <p>hhp</p>
