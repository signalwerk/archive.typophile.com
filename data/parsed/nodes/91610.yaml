    votes: null
    html: |-
      <p>Interesting that all I did was extend the lines of your crown to create tension and depth then tilted the crown for attitude. The crown has been done to death even I've used in reference to JMB, but somehow the paper hat / crown has more of an in-your-face street innocence and rebellion not to mention a youthful quality, all-be-it from by a by gone era. And even still a modern twist on the paper hat just might be long over due. And and, if you get the right model with the right attitude it would work.</p>
      <p>If you want the design - go for it! My compliments. Just keep that top left corner of the I peaking through, it balances with the tilt and is a nice detail to emphasize attitude.  </p>
      <p>The top left version would be awesome done in the nappy collegiate patch style.</p>
      <p>Good luck, glad to help.</p>
      <p>n.</p>
