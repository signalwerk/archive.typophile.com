    html: |-
      <p>Have you considered the case this is not an actual font?<br>
      It can be easily constructed using 2 different typefaces:</p>
      <p>(a) One for L &amp; E<br>
      (b) Another for O &amp; V (using letter D for the O)</p>
      <p>I say so, because if you remove the left part of each glyph,<br>
      you can read the remaining as L<strong>D</strong>VE with L,E having a different weight<br>
      and being a different font from D,V.</p>
      <p>Fivos</p>
