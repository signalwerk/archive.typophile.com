    <p>In musician Greyson Chance's music video you see him playing a piano covered with all kinds of words. Each word looks to be using different fonts.</p>
    <p>For the word LOVE, I would love (to pun intended) to know what kind of font is it?</p>
    <p>Here is the youtube video link &gt;&gt;&gt; <a class="freelinking external" href="http://www.youtube.com/watch?v=_AU1yyy_At4" rel="nofollow">http://www.youtube.com/watch?v=_AU1yyy_At4</a></p>
    <p>I attached a print screen of it to this post.</p>
    <p>Thanks in advance for your help.</p>
