    <p>Hi,</p>
    <p>I'm currently redesigning a magazine for a client who has a very low budget (almost non-existent). I'm at the stage of deciding which fonts to use for body copy. I don't think I'll get anywhere with free fonts, hence I chose Museo Sans for display and captioning. I'd like to look into alternatives for similar prices as the Exljbris 'free' fonts ($15-30 per weight).</p>
    <p>I like Calluna, but I'd prefer it if the magazine didn't end up looking like an Exljbris specimen.</p>
    <p>Has anyone ever worked with a good, usable, cheap serif font for body copy use in a long document like a magazine or book?</p>
    <p>Thanks</p>
    <p>Jono</p>
