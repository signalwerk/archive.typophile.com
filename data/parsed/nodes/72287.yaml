      <p>@ mrjono</p>
      <p><a href="http://new.myfonts.com/person/Dino_dos_Santos/" title="http://new.myfonts.com/person/Dino_dos_Santos/">http://new.myfonts.com/person/Dino_dos_Santos/</a></p>
      <p>But if you decide for a DSType font, I would ask here about the quality of the kerning. The quality of the kerning varies from font to font. In case of Capsa (which I like very much) it is good in my opinion, but Capsa is not a magazine font.</p>
      <p>I am amateur, but as far as I know, you are not allowed to transfer the fonts to the client. You can transfer the license (at least in Germany), after you have finished the work, but then you are not allowed to use the fonts anymore. As far as I know, it is common practice, that you include the costs or parts of the costs of your license into the bill. But then I would think about investing more money in a font, that you can use later in another project. And in this case I would not let the client pay the complete costs of your license, but maybe the half only. What I want to say is, that you are not allowed to work with fonts of the client. So it is primary you, who decides, if he is willing to invest in your license.</p>
