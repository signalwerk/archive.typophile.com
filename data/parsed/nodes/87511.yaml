  html: |-
    <p>I've made a custom logotype based off of H&amp;FJ's Archer. I tore off the ball serif, and made them all slab-ish, and brought down the cap-height. The result was a significant change to Archer's standard ffi ligature on the word "Office."</p>
    <p>Aside from critiques on the ligature, I'm happy to hear any other points of concern. Especially, I'm not in love with the "c."</p>
    <p>Thanks in advance!</p><div class="imageWrap"><img src="http://typophile.com/files/PO_4611.png"></div><p></p>
