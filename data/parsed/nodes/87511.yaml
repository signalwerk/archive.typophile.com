    html: |-
      <p>I definitely prefer the first variant where the first /f/ hangs closer to the second. The imbalance of the /c/ can be corrected in two ways: either shorten the upper serifed terminal (my recommendation) or lengthen the lower terminal. This with the purpose of <strong>optically</strong> aligning both ends vertically. Subsequently, you will be able to kern the /e/ a bit tighter.</p>
      <p>It is my impression that the pair /bo/ is kerned tighter than /od/.</p>
      <p>I'd separate the capital /P/ away from the /e/ one point or two.</p>
      <p>If the gap between /y/ and /O/ is supposed to represent a /space/, to my eyes it looks like kerning has been left out.</p>
      <p>I hope my comments help. Archer was a good desition! :-)</p>
