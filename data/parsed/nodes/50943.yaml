    html: |-
      <p>You need to go to File&gt;Font Info and make sure the family name is the same on both. Then you can File&gt;Generate Font as whatever format you require.<br>
      The Font Info box needs lots more details inputting too...the diamond icon is pretty useful to auto complete the options for you.</p>
