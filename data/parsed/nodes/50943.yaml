  html: |-
    <p>I have 2 weights that I have designed in FontLab - and I don’t know if it makes a difference, but they are two individual vfb files. How can I export these files to come up in Adobe Illustrator as “roman” and “oblique” in the character menu? Can someone point me in the right direction? Thanks.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/50786" class="topic-next" title="Go to next forum topic">Strange behaviour in MM-project ›</a></div>
