    html: <p>When it comes to reading and interpreting the nexus between Type and the always shifting visual culture of the moment - that is at it's core a cultural job. You will get no argument from me about a role for science there. Maybe some polling. Or focus groups. But hopefully not. Those things are not so much science so much as they are a tool for getting some spare CYA.</p>
