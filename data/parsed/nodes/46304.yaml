      <p>"This was about demonstrating that the perception of fonts impact the perception of content."<br>
      Okay... name me the variables of how fonts impact the perception of content Kevlar. </p>
      <p>You're seeing a demonstration that the use of bad selection and bad composition impacts the perception of content. The other comments that are made in the linked story, reinforce the bad turns/learns of this study. </p>
      <p>Proper scientific method in type design, <em>gives you selection</em>, it's 'our' job to understand (and design) all the details involved in a careful dance with perception of content, including some that the guys and gals in the Michigan Business School might overlook from simple, honest, ignorance, <strong>an excuse not available to professionals in the type business, <em>I'm afraid</em></strong>.</p>
      <p>The type design method for developing the study we're discussing would be:<br>
      1. Compare Arian to Arial at the same size from the same device on the same paper. Skip the expected 50-50 results and change something.<br>
      2. Compare Arial to Mistral. Okay, you've made your one mistake, Arial has an inbred familiarity and Mistral not so much and definitely not for the desired perception of simplicity required of instructions for cooking or Ikea.  If you make the mistake of not evening the x-heights, you are no longer testing perception of content. Period.<br>
      3. If you even out the x-heights, both fonts are legible, and you get correct results, (probably 70-30), and you learn</p>
      <p>Font selection impacts the perception of content, but if your composition has removed legibility. . . don't bother me with insisting on correctly testing perception of content.</p>
      <p>When one says something like this:<br>
      "The easiest to read is the Arial (font)," Song said.<br>
      ...think on that: based on two fonts, and 25 or so late-teenage reactions, sound like type science to you?<br>
      I said before they learned nothing, what I should have said is they learned how to get attention at the expense of type and science in one swell foop.</p>
      <p>Cheers!</p>
