      <p>Educate the people that use it for a living.  I am a graphic designer, and I will be the first to tell you that unless you have an honest interest in it, there isnt much obvious incentive to John Q Designer to learn.  Personally, I am interested, and I strive to learn as much as I can to be a better typographer and in turn a better designer.  Unfortunately, most designers coming out of school dont know the difference between Arial and Helvetica.  You have no idea how many people I have worked with in my relatively short career who dont have the slightest clue what everyday glossary terms mean, like "kern", "x-height" and "ligature".</p>
      <p>Last year, we had a (short-lived) designer who thought it was appropriate to use "Will &amp; Grace" for everything.  Go ahead, say he was an idiot, we all think so.  After he was let go, he got a job at MTV.</p>
