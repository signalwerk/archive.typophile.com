      <p>The methodological weakness of the Song &amp; Schwarz study is a weakness that is very common in the 'softer' sciences such as psychology and social science. It is that the theory they are testing is not well specified. And as a result it is not clear what lesson to take from the results. </p>
      <p>My old teacher Popper used to say that an experiment is only as good as the theory that it is testing. If the theory that is being tested is not clearly and precisely specified, then the chances are that you don't learn a lot from the result. </p>
      <p>The problem that typographers such as Nick Shinn and David Berlow are having here is that they know that there are so many more variables involved in readability than typeface. Since Song and Schwartz don't discuss these, it is not very clear what you can  conclude from the study. </p>
      <p>Also note that they asked about the readability of the typeface *after* they had done the reading and got answers on how difficult they expected the task specified would be. This is a problem. I know from doing simple surveys of satisfaction with courses I have taught that if a person likes the course, they are likely to be positive about everything, and if they are negative, negative about everything. The respondents can't necessarily separate out very well what they are responding to.</p>
      <p>Also note that people may perceive 'readability' of the simplest sans forms as being most readable, but that perception may be based on impression of individual letters or words, and may not necessarily reflect actually readability of extended text as far as ease, speed and comprehension. The subject guessing is about readability, not giving an objective result.</p>
      <p>So with these confounding factors, what they found is only this: post-hoc feelings about typefaces of these sizes, fonts and layout, and post-hoc feelings about ease of task described went together.   </p>
      <p>So is this a somewhat interesting confirmation that typography matters? Yes. Is it clear exactly what this study means? Not really. Not a great study, and not a dreadful one either. Just so-so.</p>
