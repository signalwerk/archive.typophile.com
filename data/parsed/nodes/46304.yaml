      <p>Bill, I'm not interested in talking about historical propaganda.<br>
      The point I'm making is that graphic design and typography are merely persuasive, there is no hidden coercive mechanism as Kevin seems to think.</p>
      <p>When I was designing book covers, I would present a succession of comps to my client, a creative director at a publishing company. She would look at them for a split second: "no, no, maybe, no, no, no, yes". And when she presented comps to her boss, the process would be the same. She was not in the target market, yet she knew instinctively, through experience, what would work and what wouldn't. The sought-after reaction from book buyers was not something as vague and visceral as "sympathy", but "this is the sort of book I'd like to read", and that was a very specific promise which had to be kept. What we discussed was stuff like "this book is a romantic whodunit set in a small town, does this design nail that genre?"<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Falls_4533.png"></div><br>
      This concerns the suggestive powers of typography, or how "the perception of fonts impacts the perception of content". But what kind of cognitive science can explain why one of these type treatments conveys the genre and the other doesn't? (The one on the left is indeed the romantic whodunit set in a small town, as published.) How about memory theory, in particular the exemplar model of categorization, which I came across in chapter five of <em>This is Your Brain on Music.</em> <p></p>
      <p>The text of the <em>The Falls</em> was set in Times, long a mainstay of trade paperbacks.</p>
