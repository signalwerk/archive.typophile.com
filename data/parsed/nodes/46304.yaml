      <p>Actually, DB's comment is pretty meaningless.</p>
      <p>The study was not trying to show that Arial was universally easier to read than (whichever script font). Just to study the effects of varying the ease of reading.</p>
      <p>It's utterly irrelevant to these studies if one could vary other controlled variables, to make the script faces harder to read than the Arial. The question is, were they correct in their claim that under these particular conditions, Arial was easier to read? Their study seemed to show that was true, as a preparatory point towards looking at the effects of this.</p>
      <p>Now, there are other points of these studies worth critiquing. Could all the effects of the study been the effects of a more ornate/fancy typeface rather than ease of reading per se? If their conclusions were correct, one could repeat the study by using *only* Arial, and creating the "harder to read" condition by setting Arial at 6 or 7 point.</p>
