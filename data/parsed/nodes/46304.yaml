      <p>Nick, Bill, you are not really disagreeing. I agree too with what Nick said "Readability studies only have validity within narrow bounds." It might be that broader finding could be made with enough highly specific research done. But we are no where near that point yet. One of the reasons broad theories in science are so celebrated is that they are rarely defendable. hey are very much the exception not the rule. So going on that I suspect that any research done will show over &amp; over that what's needed for best readability in a given situation is specific to that situation. Which of course flows neatly with the experience of type designers.</p>
