      <p>What clearly dissatisfies some of us is how incremental and simple the results of these tests can be. We know the result before it's revealed. But there also seem to be a number of tests with flawed questions at their root, such as "is my new font, designed specially for the blind, that I'm getting school credit for, more readable than an intricate, curlicued display font?" The result might have integrity (why yes, this simple font based on Comic Sans is more readable than that scratchy, ambiguous display font), but the test itself doesn't; it's a foregone conclusion, and the design of the test is manipulated to give the desired result. Those tests are specious because they aren't objective, <strong>and</strong> they ask irrelevant questions. </p>
      <p>However, Nick and David, while I know what you know, and we know it, and it apparently is going to take until 2168 to accumulate enough empiric data to confirm it scientifically, what Kevin has said holds true: if an experiment asks a very simple question, and I'm sure you'll agree it's difficult to design these tests, we can actually get meaningful results. But the meaning and the import of the results is likely to be much more satisfying and consequential to someone who doesn't design type all day. It doesn't make the test false, or the question wrong, or the whole thing a load of poppycock, if we find the result boring or predictable. </p>
      <p>Kevin is not disputing that it may be more interesting or revealing if we test other variables, like size and contrast and all the niceties that go into reading. But we're throwing the baby out with the bathwater if we dismiss every finding because it isn't sophisticated enough for us. Once a number of these results are assembled, a more nuanced and specific test can be designed that includes those parameters and takes into account the results already discovered. That's the scientific method. Reading is very complicated, and so many factors affect it, that of course it will take a long time for all those variables to be understood. Each one has to be isolated in a large testing situation and clear differences have to be demonstrated. Then there are the thousands of typefaces, the choice of which inevitably rubs people the wrong way. </p>
      <p>Kevin, I think what is dissatisfying, over and above the slow, rudimentary progress in this area, is that here on Typophile, where type designers hang out, we often hear of these tests and ask, "Why didn't they consult a typographer or type designer?" Whether the testing is flawed or fierce, We hear about it after the fact. We can actually effect more speedy, substantial progress in this area if we are included in the process of designing these studies, but apparently we're invisible.</p>
