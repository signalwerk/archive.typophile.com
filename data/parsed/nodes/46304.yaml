      <p>Does anybody actually *READ* these studies before criticizing them at great length based on bizarre snippets of media coverage? Have none of you been misquoted or had the media quote you oddly out of context?</p>
      <p>To repeat what I posted on the ATypI list, with a couple of minor edits for clarity:</p>
      <p>It turns out the actual studies (there were three related studies) are posted here:<br>
      <a href="http://sitemaker.umich.edu/norbert.schwarz/files/08_song___schwarz_effort_psychscie_in-press_30apr08.pdf" title="http://sitemaker.umich.edu/norbert.schwarz/files/08_song___schwarz_effort_psychscie_in-press_30apr08.pdf">http://sitemaker.umich.edu/norbert.schwarz/files/08_song___schwarz_effor...</a></p>
      <p>The first study compared just Arial and Brush Script, used in restaurant menus. The second and third compared Arial and Mistral, used in recipes. </p>
      <p>Yes, they found that Arial was more readable than Mistral or Brush Script, but the point was *not* to find the most readable font possible. They were trying to manipulate the readability as an independent variable, by using the font. That is, they needed a more readable font and a less readable font, in each study. The dependent variables were the conclusions people would draw about the content being changed by the ease of reading.</p>
      <p>So, unless you think Mistral and/or Brush Script are in fact more readable than Arial, folks should not have problems with this study based on their beliefs about the legibility of different typefaces.</p>
      <p>Having read the paper, I am reasonably convinced that they succeeded in measuring what they wanted to measure. The results of the first study would have been of dubious by itself, as one could argue that there were other plausible causes for the experimental outcome, which would be a result of the font but not based on simple difficulty of reading. But the second and third studies lead to a reasonably strong conclusion that their theory is correct.</p>
      <p>Cheers,</p>
      <p>T</p>
