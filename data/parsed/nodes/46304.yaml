    html: <p>Legibility problems are solved not by scientists, and certainly not by pseudo-scientists, but by a few genius type people who discover ways to put more words on less paper and still have most of us be able to read the stuff without noticing it. In the entire 20th century there were four or five such people, and that was enough. Who, now living, other than Berlow and Carter, has proven achievements in this field? And I'm sure Berlow would agree that Carter's grip on the mass vernacular is unrivalled. A font constructed by scientists for legibility would be one nobody would want to read. Legibility can't be separated from a panoply of factors of which style is not the least. To analyze this satisfactorily would cost a big chunk of the billion MS is investing in the Vista relaunching. Nobody's going to spend this because Carter and Berlow can be had for less.</p>
