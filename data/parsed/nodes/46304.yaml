      <p>Excellent, that’s another possible direction to extend these results. Thomas suggested comparing different sizes of Arial; or you could make two matching fonts that only differed in x-height. Either would be a way of looking at size differences without differences in type style. This extension does not make the original study mistaken or invalid in any way. If the extension provides a better interpretation of the results, people will adopt the better interpretation.</p>
