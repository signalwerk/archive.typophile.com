      <p>Bill [Berkson] -- <em>Also note that they asked about the readability of the typeface *after* they had done the reading and got answers on how difficult they expected the task specified would be. This is a problem. [...] So with these confounding factors, what they found is only this: post-hoc feelings about typefaces of these sizes, fonts and layout, and post-hoc feelings about ease of task described went together.</em></p>
      <p>In my reading, this was not a usual readability test (as is suggested by the unfortunate title). Rather, it aimed at demonstrating that human activities or judgement are influenced by minute aspects that are unrelated to the activity or subject-matter of the judgement and normally go unnoticed. In this case, demonstrate that choice of a typeface (which most of the time is something readers are not aware of) influences whether people consider a task described (recipe set in one or another typeface) as harder or easier to perform.<br>
      In this respect, what you consider confounding is the strength of the test: It does <em>not</em> make participants aware of the minute aspect. This is an essential part of the test. In my opinion, they should not have mentioned typefaces at all in their questions.<br>
      But it would have been more interesting with a more subtle choice of typefaces. Arial and Mistral are so obviously different that participants may have noticed what the test was "really" about even without being told ...</p>
