      <p>Thanks to Thomas for finding the actual study report. Unfortunately the popular press report missed the point of the study. Here is my summary:</p>
      <p>In their first study the participants read instructions about an exercise program. The instructions were either written in an easy to read font (Arial 12) or a difficult to read font (Brush 12). The participants who read the instructions in the easy to read font reported that the exercise program would take less time and they would be more likely to take part in the program than the participants who read the instructions in the difficult to read font.</p>
      <p>In their second study the participants read instructions about how to prepare a Japanese roll. The instructions were either written in an easy to read font (Arial 12) or a difficult to read font (Mistral 12). The participants who read the instructions in the easy to read font reported that the recipe would take less time to prepare and they would be more likely to try it than the participants who read the instructions in the difficult to read font.</p>
      <p><a href="http://sitemaker.umich.edu/norbert.schwarz/files/08_song___schwarz_effort_psychscie_in-press_30apr08.pdf" title="http://sitemaker.umich.edu/norbert.schwarz/files/08_song___schwarz_effort_psychscie_in-press_30apr08.pdf">http://sitemaker.umich.edu/norbert.schwarz/files/08_song___schwarz_effor...</a></p>
      <p>To me this is a perfectly reasonable demonstration that typeface selection is important. There isn’t anything to feel threatened by here.</p>
      <p>Cheers, Kevin</p>
