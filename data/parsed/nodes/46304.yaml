      <p>Nick, this is an astonishing collection, I had no idea these books were being designed, or even written. I looked up the 2003(?) 'Pieces of Intelligence' and discovered to my surprise that its Amazon sales rank is appx 550,000. For control, I looked up my own 1998 'Film Developing Cookbook' which is years out of date and which I happen to know is only selling the merest trickle of 25-50 copies per month: its rank is appx 80,000. And it has a very ugly cover. If I think about the ultimate meaning of graphic design and type design and legibility design, I cannot avoid the weakly Marxist mindset that we are all the servants of economic or political lords who use us to maintain or increase their power. We, the servants (ich bin ein Diener, to echo Kafka) are a jolly people who seldom squabble except in places like Typophile, which is effectively our pub. The problem with the well-intentioned (well-intentioned, that is, if you are in the business of selling type) Stop Stealing Sheep is that layout -- as I think Berlow has hinted here -- is always more important than type itself. You could, in the end, achieve almost anything (effect or affect) with Times and Helvetica if you had to. You wouldn't want to. But a good layout person could. I wonder if Lissitzky was a nice guy? Ginger's business card, by the way, was set in metal Spectrum and contains a witty, lewd drawing of a Ginger-denominated 'girl editor'. I wish I had it handy to scan. It's by far the most artful business card I have ever seen.</p>
      <p>Eben, how can CALT help immersive reading when it primarily seems to be used as a tool to justify poor reading ability in the US and UK at the very least? To what extent does the collapse of effective pedagogy represent the political will of these nations?</p>
