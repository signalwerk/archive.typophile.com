    html: |-
      <p>I have never been able to understand why some here see fit to criticize others for balking at House's forced bundling and/or pricing. What is worth the price to one may not be to another - regardless of the quality of the product. House fonts, too, are surely beyond the means of lots of even professionals.</p>
      <p>If someone does not specifically require specific House fonts, then why in the world would they <em>not</em> seek out similar, less expensive alternatives? It just seems so judgemental (even snobbish) to me.</p>
      <p>Jan, there was no logic at all in your question.</p>
      <p>George - First of all, your assumption that the House fonts are not original designs is false. As such, any alternatives would only be similar, not the same. Also, it rather discourages suggestions from us when we couldn't possibly have a clue as to what fonts you have on hand.</p>
      <p>So , with no thought as to what you <em>might</em> have available already, here are two suggestions:</p>
      <p>For House Holiday Gothic, see what you think of Larabie's <a href="http://www.myfonts.com/fonts/typodermic/mikadan/" target="_blank" rel="nofollow">Mikadan</a> - a combination of two typefaces from the early 1900's.</p>
      <p>For House Holiday Script, see the thin scripts in some of <a href="http://www.fontdiner.com/main.html" target="_blank" rel="nofollow">Stuart Sandler's</a> various inexpensive packages.</p>
      <p>I know of nothing quite like House Holiday Sans.</p>
    html_clean: |-
