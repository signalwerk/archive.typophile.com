      <p>Looks like good work. I actually think the s is fine; ordinarily one wouldn't want the center tangent to be fully horizontal but I think it works with this design. The e, however, is definitely awkward.</p>
      <p>X and x cross too low and appear top-heavy, especially in this high-crossbar face. They also seem a bit narrow.</p>
  - id: 290566
    user: 27145
    date: 2008-07-20T13:54:00
    date_raw: 20 Jul 2008 — 1:54pm
    votes: null
    html: |-
      <p>Hey, I'm back from holiday and ready to tackle some curves again.</p>
      <p>Thanks for all the feedback, some very useful points made which I have been working on to correct and smooth out...</p>
      <p>The main problem seemed to be in the curves of the e a and s so I have given these some attention to give them a body that better fits with my o shape.<br>
      I have also angled the center of the s which seems to work for me, but see what you think of the change.<br>
      The x shape has also been changed after picking up on the point cerulean made, and I feel it is much better related to the rest of the crossbar heights now.</p>
      <p>I have also made a couple of alternative versions of a g k which will help me when it comes to drawing italics in the future.</p>
      <p>Thank you all for your help, I shall be starting full-time work as of tomorrow so this will have to become a moonlit project from now on, so your advice has maybe saved me a few sleepless hours.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/web_trim_2_4941.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/web_trim_2_exams_5427.jpg"></div><p></p>
