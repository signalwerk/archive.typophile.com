    html: |-
      <p>Jordan,</p>
      <p>I have a few comments on this typeface; however, take these comment with a grain of salt. I am by no means a type-expert. Hopefully, more will come along.</p>
      <p>To start, everything seems a little tight to me. If the spacing/kerning could be loosened, I think this would be much easier on the eyes (especially look at your kerning between "de" "ef" and "no"). Next, the x-height of the alternate to your normal 'k' seems higher than of every other glyph in the lowercase. I think the 'C' looks kind of wide, and the 'K' feels awkward.</p>
      <p>Good luck on the font, and I hope I'm not being too picky.</p>
  - id: 290716
    user: 27145
