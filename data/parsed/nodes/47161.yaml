      <p>Thanks,</p>
      <p>I should have mentioned really that these are letters dragged from the design file so I haven't began on my spacing yet... but thanks for the attention to detail.</p>
      <p>Thanks for the comments, I had doubts about both the C and the K so I am glad someone mentioned them. I think that the leg of the K may begin too high up in relation to the uppercase crossbars so I shall have a look at both that and my C width.</p>
      <p>ps. Your pickyness is why we are here!</p>
  - id: 291769
    user: 27145
    date: 2008-07-26T18:03:00
    date_raw: 26 Jul 2008 — 6:03pm
    votes: null
    html: |-
      <p>After playing around with the C and K for a while, the rest of the upper case really started to look bad to me. The O and related shapes felt far too wide for the rest of the typeface and stuck out when I tried putting the uppercase into words and sentences.</p>
      <p>I hit the beziers once more to give the whole upper case more of the feel that the lower case has, one that is altogether less condensed and open. This turns out to have made my K fit in once more (although I have a retouched one in case it still looks too misshapen) and give upper case words a more solid feel.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/web_trim_3caps_5645.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/web_trim_3capsname_5129.jpg"></div><p></p>
      <p>I am also starting to think about expanding the weight of my letters into regular and bold (or perhaps down to a hairline??) but have yet to find any good resources for helping me do so... if anyone knows of any good sources I would love it if you could share them or direct me to a relevant discussion. Thanks.</p>
      <p>Thanks again guys,<br>
      Jordan</p>
