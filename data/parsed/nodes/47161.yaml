    date_raw: 7 Jul 2008 — 8:11pm
    votes: null
    html: '<p>First impressions: I love the capital R and the g is very interesting too. Other than that, this face has potential, but there are some forms that you might want to study further so you can spot the "awkwardness," especially for for the forms of a, e, and s. Also, as this comes in time and experience, but you need to focus on not measuring the width of the letters, but the optical spacing, especially the negative space. Also, make sure that every form has a similar DNA to each other. Keep it up, and good luck!</p>'
