      <p>"A BOLA", as almost all newpaper mastheads, is most popbably a custom job or, at least, an existing typeface customized. You could start with some extended egyptian like <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/giza/" rel="nofollow">Giza Five Seven</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/egyptian-slate/" rel="nofollow">Egyptian Slate</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/typodermic/" rel="nofollow">Typodermic</a>, mainly reworking /B and /O eyes.<br>
      Can be wrong for "O JOGO" but to me, it has been done all for scratch, all letters recreated with a circle. If you need something close, try <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/itc-avant-garde-gothic/" rel="nofollow">Avant-Garde Gothic</a></p>
