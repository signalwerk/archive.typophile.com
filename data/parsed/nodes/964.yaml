    html: "<p>&gt; (jfp) 1. I don't think its exact to make a top of number <br>of answers, because, sometimes, the answers need to be <br>multiple. I remember the post from Kent: 6 or 8 quiz in <br>same time to answer. I'm sure there is others <br> <br>Eduardo, you bumped yourself and myself back and <br>bumped up jfp, one of the \"others\". :P <br> <br>Actually, the times that we've done multiple <br>IDs, the underlying premise is that you reveal full <br>characters on lots of mid-range to easy IDs, <br>probing gaps in a person's cumulative knowledge. <br> <br>Tallying each of those IDs seems kinda illogical <br>and skewed. <br> <br>If I were to make a challenge to find 90 out of 100 <br>glyphs, does the winner get 90.... <br> <br>That said, I really don't like the leader boards for this <br>particular pursuit and if they went away, I wouldn't <br>cry about it. <br> <br>We're all here because we are fanatical about type <br>and/or obsessed with fontasizing (looking at type) <br>and we find this fun. That's good enough for me. <br>Without a level playing field <br>(like we could have at TypeCon), tallying this <br>takes away some of the fun for me. <br> <br>just some thoughts <br> <br>bj <br> <br> <br> <br></p>"
