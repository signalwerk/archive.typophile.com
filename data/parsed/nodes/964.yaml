    html: "<p><i>&gt;#54: ITC who?</i> <br>Berlin Sans was drawn by David Berlow after the original by Lucian Bernhard. It's published by Font Bureau, not ITC. <br> <br><i>&gt;#46: Frutiger?</i> <br>Romic was designed by Colin Brignall. <br> <br><i>&gt;#39: More Reginald &amp; Binney (or whoever their punchcutter was).</i> <br>It was Binny &amp; *Ronaldson*. And I'm pretty sure that Archibald Binny did the actual cutting. But that's for Pica Roman #1 (aka Oxford). Monticello, the original revival, is usually credited to Griffith or the Lino drawing office. <br> <br><i>&gt;#25: Agfa/Monotype who?</i> <br>Truesdell was drawn by Steve Matteson based on Goudy. <br> <br><i>&gt;#22: ITC who?</i> <br>Avant Garde was drawn by Tom Carnese. <br> <br><i>&gt;#21: Starling Burgess.</i> <br>;-) <br> <br>6. Indigo was created by Johann Str</p>"
    html_clean: "<p><i>&gt;#54: ITC who?</i> <br>Berlin Sans was drawn by David Berlow after the original by Lucian Bernhard. It's published by Font Bureau, not ITC. <br> <br><i>&gt;#46: Frutiger?</i> <br>Romic was designed by Colin Brignall. <br> <br><i>&gt;#39: More Reginald &amp; Binney (or whoever their punchcutter was).</i> <br>It was Binny &amp; *Ronaldson*. And I'm pretty sure that Archibald Binny did the actual cutting. But that's for Pica Roman #1 (aka Oxford). Monticello, the original revival, is usually credited to Griffith or the Lino drawing office. <br> <br><i>&gt;#25: Agfa/Monotype who?</i> <br>Truesdell was drawn by Steve Matteson based on Goudy. <br> <br><i>&gt;#22: ITC who?</i> <br>Avant Garde was drawn by Tom Carnese. <br> <br><i>&gt;#21: Starling Burgess.</i> <br>;-) <br> <br>6. Indigo was created by Johann Str</p>"
