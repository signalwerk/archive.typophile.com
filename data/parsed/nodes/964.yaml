    html: "<p>what about it.... <br> <br>the \"fun competition\" (for me) comes from trying to figure <br>it out first. I found it fun two turns ago to recognize <br>neuland right away, but to lose the ID because I couldn't <br>nail down which one. To see the email red dot as I was fussing  <br>with P22s typecaster, that was fun and yes, <br>a bit of a thrill. <br> <br>this fun competion exists whether someone tallies or <br>not, for me. <br> <br>i didn't say don't tally the winners, I said that <br> <br>a) jfp's suggestion was illogical (my opinion) <br>b) if there's no tally, I'm not going to cry about it <br>c) in my opinion, the tallying takes away the fun (for me) <br> <br>I'm speaking specifically about this Type ID pop quiz and <br>not the Type ID board, which is a different animal. But I don't make <br>the rules and if someone likes tallying these, fine, no worries. <br> <br>bj <br> <br>hrant, it seems as if your interest was renewed by the <br>leaderboard. So if that's the case, there's another <br>good reason to keep the tallies going: to keep the interest. <br> <br> <br> <br> <br></p>"
