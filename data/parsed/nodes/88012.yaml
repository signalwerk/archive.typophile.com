    html: <p>It <em>is</em> a super-complex question (as Hrant says) and it's wise to consider more than just percentages, or even that there are only two options. I wrote <a href="http://typographica.org/2008/on-typography/taking-your-fonts-to-market-foundry-reseller-or-go-solo/" rel="nofollow">this guide</a> 3 years ago and not much has changed except the landscape of major distributors (MyFonts is now owned by Monotype and Veer's dedication to fonts seems to be sinking) but the positives and negatives to the three routes are essentially the same.</p>
