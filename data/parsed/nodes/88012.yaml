    html: |-
      <p>&gt;Taking Your Fonts to Market: Foundry, Reseller, or Go Solo?</p>
      <p>That was a very good article on all the pros and cons. Thanks.</p>
      <p>Aside from what has already been mentioned, I would simply like to say that, if you just want to design type, and do not have enough time in the day to market your own stuff, just go with 3-4 of the big distributors. Done.</p>
      <p>A fair percentage would be 40%-50% split.</p>
      <p>Myfonts has the most traffic, and in my opinion will get you the most bang for your buck.</p>
      <p>That's the reason 'Monotype' bought Bitstream's font business recently. Smart move on their part.</p>
      <p>And if you are lucky, and in the first month your font(s) rise to the top of their popularity list, you could make some good money.</p>
      <p>Create a few promotional banners to further help promote your stuff. Couldn't hurt. The more exposure the better.</p>
      <p>And besides, if you get the time, down-the-road, nothing stopping you from creating your own web site and selling your fonts directly.</p>
      <p>Just do not sign any 'exclusivity' contract. Sell to anyone and everyone. You'll soon discovery what works for you and which distribution channels work best.</p>
      <p>Good luck!</p>
