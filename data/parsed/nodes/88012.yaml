    html: <p>When considering the distributers marketing fee as part of the take, you must remember that the more fonts the distributor is marketing, the shorter the amount of time you get for the marketing of yours. Basically, if they get a large percentage of your royalty in perpetuity and market your font for one month, is that really worth it?</p>
