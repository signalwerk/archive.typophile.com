  html: <p>What terms are usually found in a resale contract? What percentage of the sale price does the vendor usually retain? I'm interested in knowing both what is typical and what the type community feels is reasonable.</p>
  html_clean: <p>What terms are usually found in a resale contract? What percentage of the sale price does the vendor usually retain? I'm interested in knowing both what is typical and what the type community feels is reasonable.</p>
