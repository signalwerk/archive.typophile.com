      <p>It depends on a few things, not least how much the<br>
      font house spends on marketing, and how much<br>
      they help you finish the font files (e.g. hinting).</p>
      <p>I've seen it from a high of 90% (Emigre) to a low of 20%<br>
      (MyFonts up to 2003). I'd say the average might be around<br>
      75%. What's fair? That's a great, super-complex question.</p>
      <p>hhp</p>
