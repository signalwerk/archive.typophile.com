    html: "<p>1.  <br>A TrueType font is a font with an sfnt table format structure utilising quadratic B-spline curves for outlines.  <br>  <br>A PostScript font may have a variety of different formats (Type 1, Type 3, sfnt (see below), etc.); it is most easily distinguised from a TrueType font by its use of cubic Bezier curves for outlines.  <br>  <br>An OpenType font is a font with an sfnt table format structure utilising <i>either</i> quadratic B-spline ('TrueType flavour') or cubic Bezier ('PostScript flavour') curves for outlines. An OpenType font may also contain <i>optional</i> tables that enable sophisticated glyph substitution and positioning.  <br>  <br>All this information is readily available from Microsoft and Adobe's websites.  <br>  <br>...  <br>  <br>3.  <br>Yes, this is what makes it a monospaced font: <i>all</i> the glyphs have the same advanced width.</p>"
