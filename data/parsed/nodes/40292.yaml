      <p>IMO you will need a wide variety of H&amp;J-settings for the different parts of a magazine. In all instances even ‘colour’ is what you should aim for. An example: when doing an introductory paragraph in a larger typesize than the body, with also a different leading/typesize ratio, you should change the wordspace to even out the different linespace.</p>
      <p>It would be a major undertaking to explain this in every finesse (and it’s something I am going to do on a professional basis, soon), so I will leave it here &amp; suggest that you do a lot of experimenting (or hire an expert to do it for you).</p>
      <p>Cheers.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
