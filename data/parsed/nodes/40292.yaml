      <p>I agree with Ricardo. Moreover, why in the world would you ask type designers about setting type?</p>
      <p>Here are a few observations from a compositor, with the caveat that I have 20+ years setting type with TeX, but less than a year with ID CS2.</p>
      <p>Paragraph composer versus single-line composer: In general, if you take the time to get the min-ideal-max spaceband settings optimized for a particular typeface, particular size, and particular measure, it will set better type. If you do not, then the single-line composer will set better type. If you think about it, you will see why, but for what it is worth, I’ve tested this notion on a limited basis and found it correct so far.</p>
      <p>As to hyphenation and all the rest . . . All typesetting involves compromises. Making the best compromises depends on the particular standards of an audience. That audience is ideally the readers, but in practice is apt to be the editors and/or the designers. There are formal standards, too. AP style is different than “Chicago” style, and both different from MLA style. Legal style has variations too — the Harvard “Blue” being one style for legal works.</p>
      <p>If all this were cookbook, the people at Adobe are smart enough to have pre-programmed settings; if not just one, then “book” “magazine” “newspaper” etc. But setting type isn’t a cookbook problem, and they’re smart enough to recognize that, too.</p>
