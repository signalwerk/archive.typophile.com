      <p>I have a few more suggestions:<br>
      1) Use the paragraph composer. The paragraph composer should significantly reduce the number of lines that need manual adjustments to improve color. One reason some magazines don’t use it is because they are concerned about the effects of late-stage edits (the entire paragraph could reflow). However, it doesn’t affect more than 1 paragraph and the change is generally the best alternative.<br>
      2) Turn off the hyphenation zone (set it to zero) and experiment with real layouts with real text with different hyphenation-slider settings (like Thomas suggests).<br>
      3) For things like headlines or pull-quotes, you can turn off hyphenation and try using “Balance Ragged Lines” which does a first-pass at balancing the line lengths (it doesn’t do it grammatically, just mathematically).</p>
