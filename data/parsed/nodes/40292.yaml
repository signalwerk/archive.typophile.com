      <p>With a magazine, you have a great many constants to work with. I would use the paragraph composer and tweak the settings with your line length and type size combination. Adjust your hyphen limit and break options to handle most situations and make a stylesheet of that. After that make a style sheet based on it previous one which is a bit more lenient on hyphenation for problematic situations. The problems come with editing after layout. Reserve your single line work for just the final stage prior to printing.  After a couple of issues of tweaking your style sheets, you should be good to go for most situations.</p>
      <p>ChrisL</p>
