      <p>Here are my thoughts on a few things about InDesign text setting for a magazine.</p>
      <p>First, a lot depends on your typical line lengths and the typeface you’re using. Knowing that would help a fair bit. That being said....</p>
      <p>Second, IMO the paragraph composer will almost always give results that are as good as or better than the single-line composer - usually better. However, extra work in adjusting line breaks is the cost of this, as noted.</p>
      <p>Third, rather than trying to *control* the paragraph composer, you should be thinking about how to *influence* it. It’s much easier to stop it from doing something you don’t way than to make it do something you do want. In particular, careful and limited use of “no break” formatting is usually the best way to get it to keep stuff together or otherwise influence its line breaking decisions. In a pinch, switch the entire paragraph to the single line composer and manually tweak the line breaks.</p>
      <p>Fourth, if you’re using a well-made typeface, mostly use “metrics” kerning rather than “optical” kerning. BUT, the latter is still useful when mixing type sizes/styles or trying to correct for the omission of a specific kern pair in the text. Stick the cursor between the two letters and change the kerning to “optical” to just affect that combo.</p>
      <p>Finally, InDesign has that really handy slider (code name: Nigel) that lets you control the tradeoff between hyphenation and spacing. If you don’t like hyphenation, don’t turn it off! Instead, adjust the slider to the point where you are happy with that tradeoff. That allows InDesign to still hyphenate when the alternative is really bad. (My own opinion it that there’s nothing wrong with hyphenation, and I’d much rather have a few hyphens than lousy spacing, so I put the slider pretty far the other way. But I recognize that there are diverse opinions on this issue.)</p>
      <p>Hope those tips help.</p>
      <p>Cheers,</p>
      <p>T</p>
      <p>Thomas Phinney<br>
      Product Manager<br>
      Fonts &amp; Global Typography<br>
      Adobe Systems</p>
