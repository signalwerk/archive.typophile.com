      <p>Regarding the paragraph composer to single line composer, as far as I know you should always use the paragraph composer. The paragraph composer is a nifty technique in which InDesign “looks” not only at the line it is justifying but also at neighboring lines to try to calculate the best possible justification settings. Single line looks at each line separately, which means you’re more likely to get rivers and lakes in text.</p>
      <p>If you’re fully justifying lines, hyphenation tends to be a good idea, especially if the column width is small, so that InDesign has small enough units to work with to keep the spacing consistent. But since rag left keeps the word spaces the same, hyphenation is far less necessary.</p>
      <p>Caveat: I’m a student whose knowledge may be more academic than practical, though I think it’s valid.</p>
