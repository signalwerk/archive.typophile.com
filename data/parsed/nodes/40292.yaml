    <p>Kind Regards Fellow Typophiles .</p>
    <p><em>I come to you in search of some honest and informed help.</em></p>
    <p>I am currently at the helm of redesigning a major american magazine.<br>
    What I would like to ask for is some help with properly infusing good typographic principles throughout the text of the mag.</p>
    <p>I am working in InDesign CS3 and would like to ask if any of my fellow designers/typesetters  here might be able to share some wisdom and insight as to how I might tweak the default settings to get the best possible aesthetic and functionality out of flowed text ?</p>
    <p>I know this request may be a bit general / but I’ve just read through this great discussion here : <a href="http://www.typophile.com/node/16395" title="http://www.typophile.com/node/16395">http://www.typophile.com/node/16395</a> regarding justification and right ragged copy.</p>
    <p>Many great points are made in that discussion: For the design of this magazine I have incorporated both formats throughout. Obviously my concern is that the settings and details be set optimally so that I get the best readability out of the text.</p>
    <p>So - Should I be using the HYPHENATION feature when flowing copy ?<br>
             <em>I tend to turn it on - and change the settings to only allow it for larger letters /<br>
             I know that one needn’t use hyphenation on larger columns of text / but I’m typically<br>
             working in a 3 Column grid / on a normal Mag sized page / therefore it seems okay ?</em></p>
    <p>Should I be working with Adobe Paragraph Composer / as opposed to Single Line Composer ?<br>
     What kind of settings should I be using ?</p>
    <p>Here’s another great Thread I was reading in hopes of getting on the right track : <a href="http://www.adobeforums.com/webx/.3c0558fd" title="http://www.adobeforums.com/webx/.3c0558fd">http://www.adobeforums.com/webx/.3c0558fd</a></p>
    <p>PLEASE LEND ANY AND ALL ADVICE / It’d be much appreciated / and you’d be helping to steer a large publication in the right typographic direction! </p>
    <p>THANKS ALL .</p>
