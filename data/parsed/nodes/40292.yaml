      <p>Pardon my suspicion: Why would a major magazine want you to head up it’s redesign?</p>
      <p>I know books, not magazines, but the first things I think of with magazines are:</p>
      <p>1. All the advertisements have to get in.</p>
      <p>2. The pictures (images) are at least as important as the text.</p>
      <p>3. There will always be a lot of material that will bleed, and some material that won’t quite fit a grid. </p>
      <p>4. By in large, you need to fit is as much of the scheduled text as you can.</p>
      <p>etc.</p>
      <p>Much of this isn’t true for books; depends on the type of book.</p>
      <p>Now don’t you think the kinds of compromises you need to make in setting the text for the above are going to be quite different than for setting text in a book?</p>
      <p>I can’t stress enough that every decision in setting type is a compromise; that all the aesthetic rules of “good type” come with presuppositions about what you are doing.</p>
