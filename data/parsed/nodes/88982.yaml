      <p>Depending on the features of the layout program -- we use InDesign -- you can scale the small caps in a character style, and scale them non-proportionally. Now I'm sure the purists will howl, but as long as you don't go too far, it works. I've gone up to about 107% vertically and 104% (IIRC) horizontally in Minion, before the weight gets too great. </p>
      <p>The apparent weight is the biggest limiting factor, as the glyphs pick up weight as you scale them up. That and not going too far in one direction, so as to distort them too much. Finally, with InDesign, you lose kerning between a scaled glyph any other glyph not so scaled -- like the apostrophe, lower case s, etc. Kerning within the scaled glyphs is not affected.</p>
      <p>It is best to have two sets of "small caps" in the font. Lacking that, and lacking permission to modify the font by adding them, such scaling in the layout program is about all that's available. As usual, it is more work than modifying the font by adding to it, unless you only use the font occasionally. If you're using Adobe fonts, or another font with permission to modify, and you know your way around a font editing program, that's the best way.</p>
      <p>FWIW</p>
