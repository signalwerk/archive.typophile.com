      <p><em>Actium … supports a wonderful "Smart Capo" feature …</em></p>
      <p>It’s an interesting idea, but it should have been implemented as a Stylistic Set, which is discretionary, not Contextual Alternates, which is on by default in CS apps etc.</p>
      <p>Without any features applied, it causes strange things to happen, such as a mixture of lining and old style figures, e.g. at the Museum of Modern Art:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MoMA_5104.jpg"></div><p></p>
      <p>Rather than save time, I suspect Smart Capo would require extra vigilance in typography and proofreading.</p>
      <p>IMO, the default figure style should remain so if no features are applied by the typographer, and the Small Capitals feature (smcp) should always show the default figure style, with lining, small-cap-height figures belonging in the All Small Capitals feature (smcp + c2sc).</p>
