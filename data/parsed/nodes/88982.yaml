    html: |-
      <p>Thanks everyone for your comments and suggestions. </p>
      <p>@Charles: Ultimately I will probably be doing most of the layout with LaTeX or XeLaTeX which would, in principle, allows for quite a bit of programmatic flexibility, including the ability to fake caps by scaling.  However, I would rather use a font with two sets of caps designed in as you suggest.</p>
      <p>That being said, it raises an interesting question: Given a well proportioned x-height small-cap and full cap, how well would interpolating between these to produce a mid-cap work?  I would imagine that such an interpolation would be quite reasonable as it should preserve the weight of the characters much better than simply scaling in two directions could.  (I will have to explore with some of the fonts supplying both small and mid-caps to see how well the mid-caps represent such an interpolation.)</p>
      <p>@Nick: I was wondering how well the Smart Capo feature would work in practice: I agree that it might become a proof-reading nightmare.  As I plan to work in (Xe)LaTeX, I will probably do all the markup manually through semantic markup (acronyms etc.) so the automagic behaviour is not really needed (but I liked the idea).</p>
      <p>@Andreas: Andron might work nicely.  This is not something I need immediately though, so I can probably wait until Andron-Versalmediuskeln is released.</p>
      <p>@hrant: Not sure if Ernestine will work for me, but it looks very nice.</p>
      <p>Michael.</p>
