    <p>At first, the idea of using small-caps for acronyms etc. is very appealing, but typographic success depends on an appropriate font: if the small-caps have the same x-height, then plurals and mixed case forms look quite poor (OpenMP, DoE, GeV, PDEs) etc. leading some to abandon the approach altogether (see this thread about <a class="freelinking external" href="http://typophile.com/node/84025" rel="nofollow">typesetting units</a> for example.)</p>
    <p>What fonts provide suitable mid caps (quarter caps?) to support consistent and thorough use of small-caps for acronyms etc.?</p>
    <p>I know Actium, but at the time of writing, however, this is the <em>only</em> font with the <a class="freelinking external" href="http://new.myfonts.com/search/tag%3A%22mid+caps%22/fonts/" rel="nofollow">"mid caps" tag on MyFonts</a>.  Many other fonts are suitable: FF Atma provides both mid and quarter caps for example, and other fonts like Vesper Pro (as discussed in <a class="freelinking external" href="http://typophile.com/node/70315" rel="nofollow">this thread</a>) have larger SC with the x-height caps as petite caps. What other fonts provide this or similar features?  (If you know of too many alternatives to list, I am mostly interested in text-faces for extended scientific, so fonts that would work well with math fonts such as <a class="freelinking external" href="http://en.wikipedia.org/wiki/AMS_Euler" rel="nofollow">Zapf's AMS Euler</a> font would be appreciated.) I know of the following:</p>
    <ul>
    <li><a class="freelinking external" href="http://new.myfonts.com/fonts/typemafia/actium/" rel="nofollow">Actium</a>: Actium is <a class="freelinking external" href="http://typophile.com/node/75996" rel="nofollow">discussed in this thread</a> and supports a wonderful "Smart Capo" feature of contextual alternatives that automatically replaces acronyms etc. with appropriate midsize caps (try it out in the <a class="freelinking external" href="http://new.myfonts.com/fonts/typemafia/actium/" rel="nofollow">MyFonts sample</a> - though this fails to capitalize acronyms at the start of the sentence.  Probably just a sample limitation.)  Are there any other fonts with contextual alternatives?</li>
    <li><a href="/wiki/https%3A/%252Fwww.fontfont.com/fonts/atma-serif" class="freelinking" rel="nofollow">FF Atma Serif</a>: Provides mid caps and quarter caps.  (Not exactly sure if this is implemented as separate weights or with the OTF Petite-Caps feature.)</li>
    <li><a class="freelinking external" href="http://www.motaitalic.com/typefoundry/fonts/vesper/opentype-features/" rel="nofollow">Vesper Pro</a>: Provides larger SC and x-height petite caps.</li>
    </ul>
    <p>What other fonts would work well for a complete treatment of acronyms, units, etc. with small or mid caps?</p>
    <p>Michael.</p>
    <p>p.s. As I am new to this site, I did not yet start a wiki page to collect this list, but will if the thread manages to collect a good selection of fonts.  What would be the best index to include this under?  Perhaps a FAQ?</p>
