  html: |-
    <p>Hi all,</p>
    <p>I’m curious if my workflow/method for constructing accent italic characters is the correct method.</p>
    <p>I have the glyphs in there correct places and the use Glyphs &gt; Create Glyghs to create the accented glyphs, which will be a composite of the two seperate glyphs. This works fine but the accent is always far over on the left. I then go through all the accent glyphs and move the accents over to the right.</p>
    <p>Is there a way to create the accent glyphs so the accents will be placed in the correct position, or somewhere close.</p>
