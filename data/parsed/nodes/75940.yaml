    <p>Hey guys, so i tried WhatTheFont? but didn't quite work. i need to find out the name of the "NYC" letters in this picture. I think it's the new NYC.gov font, but couldn't find good resources. This picture is taken of a New York City cab. They recently changed the look of the cabs so i was interested to see which font it was. </p>
    <p>Thanks for your help!!!</p>
