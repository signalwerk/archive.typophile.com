    <p>Looking for a font on a t-shirt from a youtube video (<a href="https://www.youtube.com/watch?v=J7eSdXLmj9A" title="https://www.youtube.com/watch?v=J7eSdXLmj9A">https://www.youtube.com/watch?v=J7eSdXLmj9A</a>)<br>
    Most front-facing image:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Birthday Shirt_4210.png"></div><p></p>
    <p>I'm looking for this font for a friend, but I cannot find it anywhere, and I'm certainly a beginner when dealing with fonts. I've looked through all default fonts in LibreOffice Writer, and I've tried the standard automatic font detectors like whatfontis and What the Font, but none of the automated systems have produced anything useful. I'm sure it is a simple font, but I can't seem to find it anywhere. Another image: <a href="http://40.media.tumblr.com/b8c8e3bd4fa7e9f5c61ceec37fa5fc99/tumblr_mvjtsleYpt1qgrp5zo1_1280.jpg" title="http://40.media.tumblr.com/b8c8e3bd4fa7e9f5c61ceec37fa5fc99/tumblr_mvjtsleYpt1qgrp5zo1_1280.jpg">http://40.media.tumblr.com/b8c8e3bd4fa7e9f5c61ceec37fa5fc99/tumblr_mvjts...</a>. </p>
    <p>Here is the source video: <a href="http://youtu.be/J7eSdXLmj9A?t=1m58s" title="http://youtu.be/J7eSdXLmj9A?t=1m58s">http://youtu.be/J7eSdXLmj9A?t=1m58s</a><br>
    1:58 is the first time the shirt appears in the video, and appears throughout the video at different angles, starting at 2:15. Video owned by Red Letter Media.</p>
    <p>Any help is appreciated, and thank you for any suggestions.</p>
