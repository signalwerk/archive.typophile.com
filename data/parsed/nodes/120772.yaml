    html: <p><a class="freelinking external" href="http://www.dafont.com/freshman.font?fpp=100&amp;text=DICK+THE+BIRTHDAY+BOY" rel="nofollow">Freshman</a> could do the job. I like also <a class="freelinking external" href="http://www.myfonts.com/fonts/kyle-wayne-benson/national-champion" rel="nofollow">National Champion</a>, better designed but some earmarks of your sample are absent and it doesn't have this vintage/amateur (inconsistent x-width + absence of kerning/spacing). <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/player" rel="nofollow">Player</a> Bold (to get serifed /E crossbar) is another alternative but less convincing.</p>
