      <p>Using nanomanipulation to create logos dates back to 1990, when Eigler and Schweizer used a scanning tunneling microscope (STM) to etch the IBM logo onto a nickel substrate using just 35 atoms of Xenon. That and other images can be found at:</p>
      <p><a href="http://www.almaden.ibm.com/vis/stm/catalogue.html" title="http://www.almaden.ibm.com/vis/stm/catalogue.html">http://www.almaden.ibm.com/vis/stm/catalogue.html</a>.</p>
      <p>An Intel logo is at:<br>
      <a href="http://www.physics.purdue.edu/nanophys/stm.html" title="http://www.physics.purdue.edu/nanophys/stm.html">http://www.physics.purdue.edu/nanophys/stm.html</a></p>
      <p>Penn State’s logo:<br>
      <a href="http://www.science.psu.edu/alert/Weiss12-2005.htm" title="http://www.science.psu.edu/alert/Weiss12-2005.htm">http://www.science.psu.edu/alert/Weiss12-2005.htm</a></p>
      <p>Cornell:<br>
      <a href="http://www.lassp.cornell.edu/ardlouis/dissipative/QAtunneling.html" title="http://www.lassp.cornell.edu/ardlouis/dissipative/QAtunneling.html">http://www.lassp.cornell.edu/ardlouis/dissipative/QAtunneling.html</a></p>
      <p>Notre Dame:<br>
      <a href="http://www.rhk-tech.com/results/AFM-oxidation.php" title="http://www.rhk-tech.com/results/AFM-oxidation.php">http://www.rhk-tech.com/results/AFM-oxidation.php</a></p>
      <p>Ohio:<br>
      <a href="http://www.phy.ohiou.edu/~hla/movies.html" title="http://www.phy.ohiou.edu/~hla/movies.html">http://www.phy.ohiou.edu/~hla/movies.html</a></p>
      <p>National Institute of Standards (NIST):<br>
      <a href="http://www.nist.gov/public_affairs/releases/hiphopatoms.htm" title="http://www.nist.gov/public_affairs/releases/hiphopatoms.htm">http://www.nist.gov/public_affairs/releases/hiphopatoms.htm</a></p>
      <p>And for something completely different, a Bucky Badger made out of carbon nanotubes:<br>
      <a href="http://stm.pennnet.com/articles/stm_print_screen.cfm?ARTICLE_ID=256493" title="http://stm.pennnet.com/articles/stm_print_screen.cfm?ARTICLE_ID=256493">http://stm.pennnet.com/articles/stm_print_screen.cfm?ARTICLE_ID=256493</a></p>
