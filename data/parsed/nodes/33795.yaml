    <p>“UCLA professor Thomas G. Mason and chemistry graduate student Carlos J. Hernandez produced particles that are just microns wide and shaped like each letter of the alphabet. Graduate student James Wilking used “laser tweezers” to pick up the letters ’U, C, L, A’ and move them in order.”</p>
    <p>Be sure to click “Next” for the second image too.</p>
