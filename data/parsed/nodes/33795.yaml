      <p>If you scroll down to “Related stories” and click on “Nano alphabet soup gets cooking,” there’s a story with a little more detail, including this:</p>
      <p>“The letters could be manufactured to conform to a variety of typefaces, even something like the Times New Roman font favored by many newspapers.” </p>
      <p>Hard to tell if “even something...” means that they don’t like TNR, or that they think it would be a great achievement to duplicate it.</p>
