  html: |-
    <p><strong>I am designing invitations for a wedding, but cannot find any 6x6 inch sqaure envelopes. </strong>I’ve looked through every swatch book I can find. Is there a trick to finding square envelopes? I can find them online, but I want them to be the same paper as the invites. I am looking for a slight off-white smooth paper and am too scared to order cream envelopes off the internet - for fear they will be way off color wise. I also need a smaller envelope to match for the RSVP. I am leaving the dimensions up in the air, until I find some envelopes, but these can’t be sqaure.</p>
    <p>Any advice?</p>
