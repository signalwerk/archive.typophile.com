    <p>Hi,</p>
    <p>I'm currently working on building a website for a non-profit fashion organization's blog. Their primary audience is 90% 18-25, 70% female. I'm struggling with finding font options for them and was hoping for some help brainstorming, please.</p>
    <p>BTW: the name should be MODA (the all-caps are necessary, apparently).</p>
    <p>Thank you!</p>
