  html: <p>I recently was able to see Helvetica at an AIGA event here in Salt Lake City. In the film there is some footage of the manufacturing of messenger bags made from vinyl signs. I can't remember the brand attached to them. Does anyone know where I might find out who manufactures them? Thanks in advance.</p>
