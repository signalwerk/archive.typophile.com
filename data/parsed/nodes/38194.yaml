      <p>Simon:<br>
      The film was really nicely done, and entertaining to be sure. I thought there was a great amount of diversity among those who chose to speak about Helvetica. At the October 16th screening here in Toronto we were treated to a fresh-off-the-plane Stefan Sagmeister in the Q&amp;A. The DVD is supposed to have an extra 90 minutes of material or something, so you get the coupon clippers award (a great award to receive!) for not spending money on an overpriced ticket and getting a great doc.</p>
