      <p>&gt;What’s the general opinion of the piece from anyone who’s seen it? </p>
      <p>There are plenty of reviews on typophile and elsewhere. As for the DVD I'm looking forward to seeing how well it transfers to the small screen. Helvetica really only works as a display face at large sizes, so it will be interesting to see it on TV. A movie about Verdana, which was designed for the screen at small sizes, may work better on TV. ;-)</p>
      <p>Cheers, Si</p>
