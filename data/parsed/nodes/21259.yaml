    html: |-
      <p>Heh, real published stuff! I’ve been working for five years at a low budget design shop and I want to move on to bigger and better. It’ll mean a pay cut, likely, but I need a place with upward mobility. You could say I was as high up in my current company as was possible.</p>
      <p>While doing that, I’ve done freelance for novels, comics, games, etc.</p>
      <p>I’m thinking that my online portfolio will be very cleanly laid out so as to bring some order to the chaos that is “samples in a slew of categories.” My physical portfolio for interviewing for the next graphic design job will be, and rightly so, focused on design.</p>
      <p>I’m a stronger illustrator than designer. I’d say proper font useage is my weakest area. I’m constantly reading books on the subject and am eager to improve.</p>
