    <p>Previews of 3 new upcoming fonts have been added to the site. Some of them are still under development (eg. BP PhD Sans Regular and BP PhD Sans Bold), while others are in a final stage of retouching and fine-tuning (eg. BPscript and BPinktrap). I will strongly appreciate any kind of constructive comments.</p>
