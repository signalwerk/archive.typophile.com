      <p>Arno and Garamond Premier Pro are safe bets that you are likely not to feel sorry for choosing. Skolar feels too contemporary for me. Some more typefaces that support polytonic Greek (in order of my personal preference):</p>
      <p>– <a href="http://www.tiro.com/huronia/index.html" rel="nofollow">Huronia Pro</a> by Ross Mills (Tiro Typeworks; only the ‘Professional’ version, available directly from Tiro, features polytonic Greek)<br>
      – <a href="http://www.brill.com/about/brill-fonts" rel="nofollow">Brill</a> by John Hudson (make sure to read the EULA)<br>
      – <a href="http://www.fontshop.com/fonts/downloads/adobe/minion_pro_complete_pack/ot_ps?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=70&amp;sample_text=%E1%BC%90%CF%80%CE%B9%CF%87%CE%B5%CE%B9%CF%81%CE%AE%CE%BC%CE%B1%CF%84%CE%BF%CF%82&amp;ft=liga" rel="nofollow">Minion</a> by Robert Slimbach (Adobe; with optical sizes)<br>
      – <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?event=displayFontPackage&amp;code=1950" rel="nofollow">Adobe Text</a> by Robert Slimbach (Adobe)<br>
      – <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=gentium" rel="nofollow">Gentium Plus</a> by Victor Gaultney (SIL International)<br>
      – <a href="http://www.signographie.de/cms/front_content.php?idcat=35" rel="nofollow">Andron</a> by Andreas Stötzner (SIAS)<br>
      – <a href="http://www.type-together.com/Alverata" rel="nofollow">Alverata</a> by Gerard Unger (TypeTogether)</p>
      <p>You might also want to go through <a href="http://myfonts.us/td-hBEWAu" rel="nofollow">this list</a> at MyFonts to see if there is anything else that suits your needs. Typotheque has some interesting options.</p>
