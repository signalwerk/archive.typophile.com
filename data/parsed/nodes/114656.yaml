      <p>Johan,</p>
      <p>Arno looks like a strong candidate for your purpose. A more historically accurate typeface, with the same features (multiple sizes, greek) is Garamond Premier Pro. Also, you should consider Sabon (an evergreen, but no display size and the Greek available as a separate font). Or the more expensive Sabon Next - with a display cut but no Greek set. Finally, I would also consider HFJ Requiem - a superb Renaissance revival with optical sizes (but again no Greek set). Anyway, I don't know how / if these fonts work with XeTeX or LuaTeX. Hope this helps!</p>
