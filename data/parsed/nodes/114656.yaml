      <p>I'm thinking the preference for Arno Pro over Skolar is not aimed at making a "16th-century pastiche", but merely at making something not jarring to ordinary readers in the present time.  There are appropriate circumstances for using a typeface that is ostentatiously contemporary and daringly avant-garde, and there are other circumstances where using something to suit conservative reading tastes is preferable.</p>
      <p>However, having said that, Arno Pro <em>is</em> a Jenson revival, and Skolar, while clearly designed with post-2000 styling, is a readable face entirely suitable to general text use. So your point may be more valid than it at first appeared to me.</p>
      <p>Carefully reading the original post, it simply said "most probably in a renaissance style". But Arno Pro was acceptable despite being "edgy and modern".</p>
      <p>The project is to produce editions of texts from an early period, and so the dignity of a traditional face might seem fitting, just as a more contemporary face might be appropriate to a book with the latest developments in high technology as its topic. Yes, that is clichéd, and Times Roman (or, for that matter, Caledonia or Century Expanded... or Palatino) could serve in both contexts - at least it's to his credit he wishes to avoid that.</p>
      <p>If one <em>really</em> wanted to do a 16th-century pastiche, though, Arno Pro would not be suitable; one would need to go with Eusebius or Cloister Oldstyle or Poliphilus... even Bembo is too much of a just plain good text face to achieve a noticeable impression in that direction.</p>
      <p>The reason many posters here advise against simply setting everything in Times Roman is because they believe that the choice of typeface <em>matters</em>, that it says something about the text or about one's intent with regard to the medium in which the text is distributed. If that is legitimate, then it is reasonable to go a tiny step further, and say that different typefaces establish different moods, different feelings, different atmospheres - and so it isn't sufficient merely to choose any typeface that is recognized as reputable or showing good taste. Instead, typefaces have associations, and one chooses a typeface with the associations one wishes to have accompany one's subject matter and one's product.</p>
