    <p>There is a fairly wide range of neo-Latin literature from the sixteenth century onwards which today is only available in print in the form of POD facsimiles, often made from scans of questionable quality. In those cases where someone has taken the effort to typeset a (hopefully) proofread OCR text, the state of the typography is often disappointing (not seldom Times New Roman, without hyphenation and with very narrow margins). For a long time I have been contemplating preparing my own editions of a couple of texts that are of particular interest to me, and, even though this would be very much a labour of love, I hope that a carefully edited and typeset text will be of interest to others as well. To this end, I am prepared to invest in a high quality font that would serve me in this project, and also in general in the future: I'm very much an amateur when it comes to design and typesetting, and do not have a large font library at my disposal, if any.</p>
    <p>So, I am looking for a general purpose typeface, most probably in a renaissance style. Some features that are essential or that particularly appeal to me are:</p>
    <ul>
    <li>Carefully designed polytonic Greek: though I suppose this need could theoretically be solved with another, complementing font, I would greatly prefer to have it included.</li>
    <li>Small caps goes without saying, I suppose. In general, a wide range of OpenType features would be fun to play with, such as archaic ligatures for instance. (I also want old style numerals, but I suppose it would be difficult to find a font that fulfils all other criteria but not that one.)</li>
    <li>Optical sizes would be awesome (for footnotes especially, but for titles as well, of course).</li>
    <li>I am very much sympathetic to the sentiments expressed in <a class="freelinking external" href="http://typophile.com/node/51171" rel="nofollow">this thread</a> regarding the weight of body text. In other words, nothing too light, or too thin hairlines.</li>
    <li>As I am considering using XeTeX or LuaTeX, the font should work well with it.</li>
    </ul>
    <p>As you probably guess from the title, I'm strongly considering Arno Pro: elegant and unobtrusive, yet in my opinion edgy and modern in its character compared to, say, Bembo and Adobe Garamond, it fulfils most of my desires. There are a couple of small things that are less than ideal, however:</p>
    <ul>
    <li>I actively dislike those wide guillemets, and I see that <a class="freelinking external" href="http://typophile.com/node/74608" rel="nofollow">I am not alone</a>.</li>
    <li>Not sure about the Th ligature; I would prefer a non-connected variant as an alternative. A regular T+h will probably be too wide?</li>
    <li>Not a deal breaker, but I prefer the inverted breve variant of the Greek circumflex accent. If I have to choose between tilde variants, I prefer them more wavy. Unfortunately, Arno Pro has very straight, flat tilde-shaped Greek circumflexes.</li>
    </ul>
    <p>My question to you now is: are there any other, similar typefaces that come to mind, that you think I should consider? Spending hundred of dollars on a typeface is nothing I usually do, and I would hate regretting it later on, so I'm sure you understand my trepidation. Any advice is very welcome!</p>
