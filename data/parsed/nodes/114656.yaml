    html: |-
      <blockquote><p>The free fonts of the Greek Font Society are Greek-only. </p></blockquote>
      <p>Unless they've changed these in the past year, there is at least minimal Latin support in most GFS fonts. The problem is, since an italic is not a variant in Greek, few of the GFS fonts have both a roman and an italic counterpart. Some do, though.</p>
      <p>A second problem is that most GFS revivals of older fonts suffer from the same thin, spindly letterforms you find with most revivals generally, be they Latin or Greek.</p>
      <p>Edit: Also if a font license allows, making up the extra characters in 1FXX might be a bit time consuming, but all you really need, as far as new characters go, are a few accents and the YPOGEGRAMMENI -- not at all hard to do.</p>
