      <p>First I want to say that I like the idea of your project. Actually I am working on something very similar but for a different time period (19th century science fiction and fantasy). Proofreading OCR texts takes time but I think its worth doing it. </p>
      <p>As for the typeface: If you insist on using the same typeface for polytonic Greek then you are practically stuck with Adobe. Arno, Garamond Premier, Minion and Warnock. Frantisek Storm and Type Together have made some great Greek fonts but they do not support polytonic.</p>
      <p>Then there is Skolar as already mentioned. I have not used it, it looks great although not historically "correct" for your project.</p>
      <p>Here is a  <a class="freelinking external" href="http://www.polytoniko.org/fonts.php?newlang=en" rel="nofollow">list</a> of fonts that support polytonic Greek including some Greek foundries, maybe you can find something more here.</p>
