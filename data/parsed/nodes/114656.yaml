      <blockquote><p>For a long time I have been contemplating preparing my own editions of a couple of texts that are of particular interest to me, and, even though this would be very much a labour of love, I hope that a carefully edited and typeset text will be of interest to others as well.</p></blockquote>
      <p>I'll get to Arno. If you're going to this trouble, there are things that need considerations first.</p>
      <p>You haven't said whether print or digital editions. And if print, whether to be printed on a high-resolution offset press, or a laser printer. I'd include on-demand publishing as laser. (And for <cite>text</cite>, I know of no "satisfying" laser printing, including on-demand books. YMMV)</p>
      <p>OK, if this is for yourself, things get interesting. You can make a pdf version of the texts, optimized to be displayed on a particular devise, e.g., Kindle Fire (approximately a 7-inch diagonal, 22 x 36 pica screen), etc. To be optimal, an iPad would need a slightly different design, as would any of the phones. The good news is that for simple texts -- not many images -- it doesn't take long to reset the text in a slightly different format.</p>
      <p>If this is your model, make up some test documents and decide.</p>
      <p>As far as I'm concerned, the things that bother one about published fonts on digital devices will vary considerably, depending on how it will be displayed. Some of the new tablets approach 300 dpi resolution, and they'll only get better. The computer monitor, though, remains quite coarse.</p>
      <p>I haven't done any testing with Arno on a tablet, but would guess it will work OK. There really is a need to test, though.</p>
      <p>Print is different. When Arno first came out, I loved it, and designed several books using the font. These were printed 2,400 dpi using an offset press, on an uncoated sheet. That paper is typical for bookwork that has no art.</p>
      <p> I was very disappointed with the result -- though the "very" was in large part due to expectations. Other books by me and other designers confirmed it wasn't just my designs (type size, leading, margins, etc).</p>
      <p>In my opinion, the font as published is a bit too heavy when printed on uncoated papers, using current manufacturing technologies. You could make a slightly lighter version of the fonts, a fair amount of work -- the amount the weight needs to be dropped is not much, but there are a lot of characters. Easiest would be to convince Adobe of the problem, as they no doubt have Arno set up as a multiple master, and could make a "direct-to-plate with uncoated paper" weight pretty quickly. The trick would be to convince them this is a big enough market -- printed books -- to be worth the effort.</p>
      <p>Good luck with that -- most of Adobe's fonts seem designed for laser printing (normal wight) or a coated sheet offset (medium weight).</p>
      <p>If you really want to go to the effort of a private publication, you may have to start with custom fonts. Perhaps some here could comment on cheaper font editing software, hiring a professional to do an entire font family would be very expensive, and you don't need that level of expertise.</p>
      <p>BTW, we used Arno for an intermediate-level Greek textbook (not my design), and the author insisted on using the "inverted breve" rather than the "tilde" for the Greek circumflex. Took about an hour to change all the needed characters in roman, italic and bold, including the small cap variants...</p>
      <p>Etc.</p>
