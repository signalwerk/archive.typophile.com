      <p>Interesting project! To me Arno Pro sounds like a good option for the purpose (though I didn't buy it in the end). As for the guillemets: If you go for some TeX variant, you can easily swap them out by redefining those two glyphs (and, btw, how many guillemets are present in your 16th century prints?) – the same goes for combining marks like the circumflexes you mention.<br>
      You could also try a few alternatives and typeset a sample page in different text faces before really deciding in which font to invest.<br>
      (Most of which is a bit far off from your original question asking for alternatives, which others will be offering…)</p>
