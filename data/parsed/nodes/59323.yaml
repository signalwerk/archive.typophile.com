      <p>You will get little or nothing to put in your portfolio from an internship if you aren’t working with other designers who can help you produce good work. People who tell you that you’ll get stuff for your portfolio by working for them are just trying to get free work. It’s a scam, and you shouldn’t fall for it, and your professors should have warned you. You’ll be much better served doing grunt work for people who will teach you about the design industry. You will also be making connections that might get you jobs in the future—maybe an advanced internship next summer that focuses on design work and might lead to a job with the firm.</p>
      <p><cite>I have an interview tomorrow with the ad agency and I’m a little intimidated for that one.</cite></p>
      <p>Don’t be. Creative types know how stressful having one’s work judged can be so they’re generally very good to interview with.</p>
