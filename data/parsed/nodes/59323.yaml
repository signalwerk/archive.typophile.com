      <p>Depends a bit on what YOU are looking for later. In most cases, you're resumé be a bit better off by interning at the larger ad agency. </p>
      <p>At the ad agency, you are likely to learn important things such as production/prepress procedures that are often left out of design school curriculums. Not to mention the structure of an agency and how it functions. You might not come out of it with portfolio work, but most likely a year or two down the road, you won't even want to look at that work anyways.</p>
      <p>It also depends a bit on what you do at each, but more likely you will meet more people within the advertising industry. Whereas with the film company, you may meet people outside of the industry that can be just as good if not more valuable. Maybe potential clients…at an ad agency, it could turn into a full-time job.</p>
