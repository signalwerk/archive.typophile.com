      <p>&gt; It’s a scam, and you shouldn’t fall for it,</p>
      <p>If I can put forth a bit of information from the employer side (back when I wore those shoes): the scam is not all that one-sided. The benefits of low cost internship labor are quite low to a company, particularly if you plan to actual provide the intern with mentoring. Work done by the intern may often have to be redone, must always be monitored and checked closely to ensure it meets the standards of the company, and unpaid interns, in particular, are notorious no-shows when you really need an extra set of hands.</p>
      <p>In Canada unpaid internships are rare, so you wind up paying at least minimum wage here (nearly, and soon to be $10 an hour in Ontario). Most companies would prefer not to do them, but do as a service to the industry (to get young workers into the field). About the only real benefit of interns is that it gives you a chance to scope out potential hires with low risk. The really excellent intern is often offered a job, sometimes before the end of the internship.</p>
      <p>Semi related note: The college I work at has a co-op work experience for some of our technical students. In the middle of their four years of schooling, they spend two six month periods working in the oil refineries. They get full union rates, probably $25 to $30 an hour during that time. Not bad money for someone prior to graduating.</p>
