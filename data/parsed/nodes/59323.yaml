      <p>@James Puckett: +1</p>
      <p>It would be different if it were a choice between a smaller, high quality design agency and a large ad agency. As long as you are working with good designers, a smaller agency might give you the opportunity to dive right into some small creative projects, depending on how much you already know, where at a large agency, there’s a chance you would just be taking lunch orders and making clipping paths. But then again, if you are a quick learner and take some initiative to develop skills on your own, you’ll see there’s a lot you can pick up just by watching the right people. Don’t be afraid to speak up either. If you think you have a good idea for something, find a way to say it, even if you're not asked. Of course, use your judgment. These aren't rules, just things that have worked for me.</p>
