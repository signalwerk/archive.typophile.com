      <p>It really depends on the company.</p>
      <p>My concern with the small production firm is that since there isn't anyone there who knows graphic design, you also have no one to turn to, evaluate your work or catch your mistakes who has an eye for producing solid design and associated pre-press setup. So while you have total free reign to do the design work, you may not learn as much as you could elsewhere, or could learn by fire. </p>
      <p>On the other hand, as you say, doing grunt work at a large ad agency can be really draining and depending on how the firm works, you may not learn that much. However, what you will do is get experience on bigger, probably more well known projects and, if you can perform in high pressure situations, impress folk who could be potential employers in your future (near or distant). Furthermore, depending on the situation, you might also get more of a free hand and then get feedback from the higher ups, which could be very valuable. </p>
      <p>It also depends on the environment. If the folk are rather friendly and you feel more at home with them, you'll be happier than if you can learn, but are miserable or treated poorly every day. </p>
      <p>So really, it depends on how each feels and what you feel you will be able to get out of working at each place. Both have their advantages &amp; disadvantages and there may be unique elements to each that would make one better than the other — makes it rather hard to really provide a good recommendation! I'd say go through the interview, see how you feel, see how you connect with the folk and then decide. </p>
      <p>Of course, I haven't been out in the industry for too long and there are probably others who know more than I, but that's my take.</p>
