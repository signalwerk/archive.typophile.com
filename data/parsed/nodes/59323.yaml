      <p>I interned in the corporate communications department of a government agency as a graphic/web designer. I pretty much had free reign over what I designed (mostly internal communications) as my superiors were all corporate-types who couldn't tell a pixel from a peanut. Their sole concern was probably the size of logos. (That was a peek into understanding the #1 client concern I guess :p)</p>
      <p>It was fun and liberating at first, but after awhile I was really yearning for some solid critique from someone who knew their stuff.</p>
      <p>I think a rewarding internship experience depends largely on the culture of the company. Size might jump out like a big factor, but I don't think it is as important as it seems. The company's culture determines the kind of people who're attracted to work there - the people who'll be mentoring/challenging you as a designer, whether directly or indirectly.</p>
      <p>Check out Andy Chen's posts about interning at Pentagram.<br>
      <a href="http://www.andychendesign.com/blog/?p=530" title="http://www.andychendesign.com/blog/?p=530">http://www.andychendesign.com/blog/?p=530</a> (via Design Observer)</p>
