    <p>Hi. What do you think is better:</p>
    <p>- Being an intern for a small film production company that knows nothing about Graphic Design but allows you to actually design their print materials and websites that you can add to your portfolio<br>
    - Being an intern for an ad agency where you will probably not be doing any designing (maybe just grunt work) but may learn more about the industry</p>
    <p>I've already been accepted to intern for the small company and it is up to me to decide if I want to go ahead. I have an interview tomorrow with the ad agency and I'm a little intimidated for that one.</p>
