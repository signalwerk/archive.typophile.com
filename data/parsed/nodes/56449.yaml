      <p>It set the standard for all olympics that were to follow, but I personally think none of them can match it, and some were no more than poor rip-offs. Nowadays it's pretty normal to have consistant house styles for everything, but it was still quite new back then (no computers back then, hello typewriters ;-) ) and therefore it has had a lot of influence as well in the the field of corporate identity. Unfortunately they often took just took a few elements  Aicher used, slapped a grid over it and squeezed all the life and fun out of it.... :-(</p>
