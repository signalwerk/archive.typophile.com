    <p>Having recently read about German graphic designer otl aiche and in build up to the London 2012 games, I have decided to do a post about the different designs for olympic posters. This is in fact not a very original subject, but in my research I did find that there was lots of pictures and not THAT much actual critique from a design point of view. So thats what im gonna try to offer hopefully. Obviously there has been a massive amount of designs over the years, so what follows is my top 5 favourite poster designs. Hope you enjoy.</p>
    <p>1980 Moscow, USSR</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rus2_5702.jpg"></div><p></p>
    <p>This was a strange one for me, so I have decided to feature it as much over interest as design reasons. Moscow actually had the most featured events to any previous olympics the olympics with 203 in total. Also, the United States, followed by 60 further countries, boycotted in protest of the Soviet war with Afghanistan. In total there were over 250 types of posters with 18.75 million copies printed which is a massive amount. Unlike most olympics, there was actually not that much consistency throughout the different poster designs. Below are some examples of the different different posters and contrast in styles. As you can see, the illustration is very varied and whilst this makes for interesting viewing from our part, probably didnt make for building a consistent brand and identity for the Moscow Olympics across all media. Even the use of the logo/emblem is varied with some of the below skewing it directly out of shape - a big no no in any design theory, surely! Also, some of the artwork was thought to rip off that of the 1976 Olympics, with a redesign, which didnt change much, of the ever popular and influential pictograms of the 1976 Olympics (featured later in this post).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rus1_3540.jpg"></div><p></p>
    <p>So for the purpose of this blog I have decided to talk about the main design which I actually really like. It was designed by Wladimir Arsentjev and consists of a flame type shape stemming from the olympic rings with a red star at the top of some the crisp lines. It has a simple flat colour quality, with such strong flat colour and use of shape giving it a clean, and almost retro and modern feel at the same time. I also love the gold and red together. It is a combination I would not have automatically considered, but the red stands out perfectly. And of course, the was the symbolic colour of the soviet union, so it is approriate too.</p>
    <p>The poster also has a symetrical quality which reflects the olympic logo itself. I suppose this would be one of the challenges when working with a logo as well known as the olympic 5 rings. Where do you position it? This poster almost works solely around it which is definetely the right idea. In fact in terms of showing the rings in the best way, it could be considered one of the more effective poster designs.</p>
    <p>Montreal 1976, Canada<br>
    The Montreal Games were designed by the Graphics and Design Directorate, and featured 2 sets. The first concentrated on the flag, mascot and stadium, and the second on the sports themselves. The mascot consisted of a beaver called ‘Amik’ wearing a ribbon of COJO colours. The stadium poster involved geometric drawings overlaying flat coloured stripes.</p>
    <p>The second set of posters concentrated on the individual events and a photographic route was favoured with action based photography.</p>
    <p>I really like the beaver. Its such a simple form with basic geometric shapes. Its also undeniably kinda cute! And the three stripes down the middle really emphasise the shape and add a stroke of positivity and contrast to the hard black shape.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MON1_5519.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mont2_6219.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mont3_5226.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mont4_5452.jpg"></div><p></p>
    <p>I also love the logo. I suppose it is quite strange in a way as it is directly editing the classic olympic rings which is obviously contraversial. But the form is really elegant. George Huel was also keen on the minimal approach, ‘Munich used two symbols, I wanted to work with one symbol, clean and simple’. The three curves sprouting up are actually meant to represent three things, a podium, a running track and also an M for Montreal. The podium definetely stands out the most for me, and although it doesnt really resemble an M much in my opinion as this has 2 points and not 3, I still kinda see it. But like I say, its still much more about the basic form for me.</p>
    <p>1972 Munich, Germany<br>
    This is one of the most memorable and celebrated of designs from renound German graphic designer otl aiche. The idea and the brief in the Munich olympics, was to erase the memory of the last German held olympics in 1936, often dubbed the ‘nazi games’. So the thought was for the design to contain a colour sequence that had no resemblance to anything ‘agressive nationalism’. And indeed the posters did this, with colours almost illuminous and a cheerful feeling throughout. Missing is the hard black and red of the German National flag.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/munich_4504.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/munich2_3981.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/munich3_5432.jpg"></div><p></p>
    <p>Personally I love this design, it is classic and elegant, but even now has a contemporary feel to it as well. The imagery, following the pallette is knocked out to a few simple colours, and the brightness combined with the photographs have such energy to them. The different colours and the variations within the posters, also give it a national feel, almost symbolic of flags themselves.</p>
    <p>The logo itself is a kind of spiral symbol, again containing an optimism that is evident throughout. I also love the way they apply it, with beautifully crafted typography seperated with the thin lines. This cleaness and elegance in fact is evident throughout all the materials with a clean use of colour, simplicity and good typography. Essentially this clean approach is what everything comes down to for this set.</p>
    <p>And the designs too were influential, with a new set of pictograms that have been used in sport ever since and have also influenced public signs on a broarder field. There were literally hundreds of these, and the way they boil the detail down to the simplist form is to be admired. To differentiate each must have been an enormous challenge whilst still keeping it recognisable to the native disciplines. Easy to see in fact why this has since become such a design classic.</p>
    <p>Tokyo 1964, Japan<br>
    I have put this one in because of its lovely simple form and simplicity. This was designed by Prof. Cho Yong-je of Seoul National University in 1984 and it is probably the simplest of all designs, but also arguably the most noticable. Like some other posters it makes a big use of the olympic logo and leaves this unchanged. The whole poster seems to work round them, which is good designing right? It also has a real kind of japanese art quality, even though it is made using such simple text and shapes.</p>
    <p>The other posters in the set, use dramatically lit photography with a hard contrast between the dark and light colours. The  design on the original poster is carried through these posters too in the form of a bottom strip at the bottom. It maintains the boldness and simplicity that makes it so effective. All the posters were used using photoengraving, which highlighted the technology of the Japanese printig idustry and actually resulted in the whole project winning several awards including the prestigious Milan Design Award.</p>
    <p>1968 Mexico</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mex_5686.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mex3_4556.jpg"></div><br>
    Throughout my research, I found lots of criticism for olympic posters altogether but especially for this one. However, despite that and although I can understand claim of illegibility and head aches through the hypnotic patterns, I have to say I really like this. Again it has a contemporary feel to it. Looking at it, it is imediately impactful with stark uses of colour applied well to the complex forms of repeating lines. The concept as well though is fascinating with the black and white lines taking influence from the famous patterns created by the Huichole Indians, an indigenous ethnic group of western central Mexico. The poster itself was a joint creation from Pedro Ramirez Vazquez (an architect), Eduardo Terrazas (President of the Organizing Committee of the Games) and an American, Lance Wyman (who also originally designed the Mexico 86 logo).<p></p>
    <p>The logo itself links in with the olympic rings which looks pretty good. I suppose one criticism could be that it is not all that easy to see, but it is also almost central to the whole design and especially on the black and white ones, the colours help it stand out.</p>
    <p>The colours generally are quite bright and positive with some more sombre ones as well. The imagery is dealt with in a similar way to some of the other olympic posters, with simplified tonal colour uses. Overall it is simple and works pretty well.</p>
    <p>My favourite part though is definetely the logo. I love the circular ketter forms and the way it all feels linked.</p>
    <p>After thought.<br>
    So there we have it…thats some thoughts and facts around various olympic posters. Hope you enjoyed. To end this post, I would like to say a bit about the London 2012 design. There is no official poster yet, but we have all seen the logo. I remember reading an article about the logo and finding it really interesting. Much of the idea of placing different images inside of the forms and the flexibility of this is really interesting. I also like some of the angles they have. I just think that overall the design looks really like an intro to a kids show. I definetely dont like the choice of font for London. It also looks like its a lowercase l. Most odd. My design colleague pointed me toward the logo by Daniel Eatock the other day, which I thought was fantastic. The simplicity of the form is great and the idea is a really simple one, but one not really noticed before. Looking at all the poster designs over the years, the ones that stick out for me are the more simple approaches. It is just my opinion, but I think that because the process requires you to combine a new style with the olympic rings, it requires a simplistic approach. Sometimes design is as much about restraint as creativity. Anyway - hope you enjoyed the post. Would love to hear your comments.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lon_4247.jpg"></div><p></p>
