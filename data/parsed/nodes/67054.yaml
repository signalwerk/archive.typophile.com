    <p>Hello Typophiles! It's been a while since I lurked these corridors, but I have a slight query at work and would like to ask your opinions if I may.</p>
    <p>Been given a re-branding project at work, its nothing enormous, but it revolves around fashion and extreme sports. We are building a new website, product photography, the whole shebang.</p>
    <p>To cut the long story short, the owners want the brand to be different, but not too different. The brand 'Typeface' being a horrid font by the name of 'Aggie'. Anyway. It has to go.</p>
    <p>So I need rid of Aggie, and the replacement needs to resemble it in some fashion but drag it out of 2002. If that is at all possible.</p>
    <p>I found two potentials, one called Korataki, which serves nicely despite the terrible caps 'K' that resembles a decapitated stick man. Its an improvement at least.</p>
    <p>Then I found 'Sone' which is really fresh, plenty of weights, Could be used as body type also, but, alas, not the most imposing or effective when it comes to Logo type. </p>
    <p>Thing is, that remains to be seen as need to decide what to purchase, I don't want to flex company plastic at both only to find neither efficient or effective. </p>
    <p>I thought one of you might be able to pluck a solution out of obscurity, would love to know what you think.</p>
    <p>Thanks! Tom.</p>
