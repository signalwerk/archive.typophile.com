    html: |-
      <p>I'll just point to a few typefaces I have used, and can therefore recommend. I only consider OpenType fonts, for reasons other people have explained much better than I could; but I'd add that when it comes to non-Latin you'd be a fool to not use Unicode-encoded fonts. </p>
      <p>Adobe Minion Pro and Myriad Pro are as good in their Greeks as they are in their Latins; ditto Warnock Pro, for a different kind of documents. More interesting (and for an entirely different category of documents) Garamond Premiere Pro -- also, the only truly complete character set in the stable, with full polytonic and small caps.  </p>
      <p>Helvetica Linotype is a cut above its siblings, if you're looking in that direction.</p>
      <p>Victor Gaultney's Gentium supports polytonic Greek (and is free).</p>
      <p>There's also a small operation in Seattle with some very good -- albeit monotonic -- Greeks under its belt, but I haven't seen the fonts retail yet; my guess is they'll end up bundled with some piece of software or other.</p>
