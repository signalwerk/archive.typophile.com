      <p>Not finding anything particularly close to this proprietary typeface by Kevin Cantrell (called Circulo Gran, created as part of the branding for Hotel Círculo del Casino Gran Vía):<br><a href="http://kevincantrell.com/portfolio/circulo-del-casino/">http://kevincantrell.com/portfolio/circulo-del-casino/</a></p>
      <p>Chonburi has a similar vibe:<br><a href="https://fonts.google.com/specimen/Chonburi">https://fonts.google.com/specimen/Chonburi</a></p>
      <p>As does Mariposa Bold:<br><a href="https://www.myfonts.com/fonts/itc/mariposa/">https://www.myfonts.com/fonts/itc/mariposa/</a></p>
