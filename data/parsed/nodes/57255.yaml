      <p>Si,</p>
      <p>The book lists a "PakType Naskh Basic" font that is a mutilated but still recognizable illegal copy of the DecoType Naskh that we licensed to Microsoft.</p>
      <p>The original DecoType design, adopted by all major players (Microsoft, Apple, WinSoft) is literally on every computer in the Middle East.</p>
      <p>Therefore it is hard to miss for a specimen book that pretends to cover everything - unless the author is an incompetent charlatan who didn't even notice the uncanny similarity between PakType and DecoType :-)</p>
      <p>If you really consider diverting resources, please devote them to anti-piracy measures including action against those who (unknowingly?) legitimize it.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
