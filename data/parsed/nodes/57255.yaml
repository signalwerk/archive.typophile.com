      <p>Hi Omar,</p>
      <p>Consider this link:<br>
      <a href="http://www.zakariya.net/history/examples.html" title="http://www.zakariya.net/history/examples.html">http://www.zakariya.net/history/examples.html</a></p>
      <p>It is a general introduction to the Arabic styles.</p>
      <p>Below are two more links, one in Arabic and in English, that give background information and illustrations of the classic Arabic script styles by one of the contemporary masters: Mohamed Zakariya. They are a double critique of a book about Arabic typography that is so confused about the subject, that it prompted Zak to create a series of illustrations to clarify the matter. This review was published first in the Leiden academic journal Bibliographia Orientalis (BiOr) and later in the Lebanese computer magazine ACCE (Arabic Computing, Communications &amp; Electronics):</p>
      <p>In Arabic:<br>
      <a href="http://www.decotype.com/publications/2005-10-01_ACCE_HSAF-reviewAR/AlKumbyuutar_cover_story.pdf" title="www.decotype.com/publications/2005-10-01_ACCE_HSAF-reviewAR/AlKumbyuutar_cover_story.pdf">www.decotype.com/publications/2005-10-01_ACCE_HSAF-reviewAR/AlKumbyuutar...</a><br>
      In English:<br>
      <a href="http://www.decotype.com/publications/2006-05-01_ACCE_HSAF-reviewEN/2006_ACCE-HSAF-review.pdf" title="www.decotype.com/publications/2006-05-01_ACCE_HSAF-reviewEN/2006_ACCE-HSAF-review.pdf">www.decotype.com/publications/2006-05-01_ACCE_HSAF-reviewEN/2006_ACCE-HS...</a></p>
      <p>In order to use the illustrations contained in these PDF's you must ask Mohamed Zakariya's his permission (his website above has instructions how to contact him).</p>
      <p>But I am sure these images will help you to get the styles straight. </p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
