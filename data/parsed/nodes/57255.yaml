    date_raw: 18 May 2009 — 10:46am
    votes: null
    html: <p>Yes, I've read much of it. The font technical information is parroted from sources on Latin fonts, so doesn't contribute much to the making of Arabic fonts; not surprisingly, perhaps, because the author doesn't really understand the technology. There is a quite interesting historical overview, mostly showing attempts at Arabic typography originating in Europe and well-illustrated, but since these types had little or no impact in the Middle East they represent an eccentric history. As the review by Mohamed Zakariya and Tom Milo makes clear, the author is confused about the terminology of the traditional script styles, so the book is unreliable in that respect. Finally, the concluding overview of various foundries' Arabic typeface development, while providing useful illustrations -- including some of designs that are not available in current digital formats --, misrepresents some of these companies and their achievements.</p>
