    <p>So, after spending almost my entire evening, figuring out what was wrong with uploading my .pdf file on Typophile I finally decided to make a screen capture (i can’t believe how slow I can be sometimes…lol) so this is only 2 slighly different versions of the new design of my business cards…</p>
    <p>And here is my first post :<br>
    “Guys, you made my day (refering to the Kursivschrift discussion in the tatoo icon topic <a href="https://web.archive.org/web/20080829144131/http://typophile.com/node/27828" title="http://typophile.com/node/27828">http://typophile.com/node/27828</a>)!<br>
    I finally decided to purchase Kursivschrift from Linotype and I am very (very) happy about it.<br>
    Now, may I ask for your comments about this new business card of mine, I’m still hesitating between the different “versions”. It is going to be offset printed on transparent Cromatico™ paper.<br>
    Thanks in advance.<br>
    (I was also thinking to use Digital Kauno’s “@”)”</p>
    <p>PS : The other versions I wanted to show you at the begining were not very different from these 2, only “DESIGN CARE” and my eMail address were either white on one or 50% yellow on the other. Well, anyway, let me know what you think… Thanxxx</p>
