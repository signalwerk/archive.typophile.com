      <p>I think the word “duckling” is w´quite nice, although it might have been more compact. The size contrast between dr and duckling is too small. Te ornament is too clip art, is it adobe wood type? there’s a cafe here in oslo, right around the corner that has exactly the same ornament. I think the photograph, the “me”/”my website” and the ornament are competing, not complementing each other. kill some darlings, and reenliven them for a project where they are useful.</p>
      <p>good luck!:)</p>
      <p>alex</p>
