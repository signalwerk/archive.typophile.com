      <p>Hey thank you Alex for your comments.<br>
      About the logotype : well, it’s been my visual identity for 4 years now and I wasn’t really considering changing it right now (I need my new business cards for a convention next week...) but you’re absolutdely right about the ornament, it is based on an Adobe Wood Type one and I know that’s it’s not so classy nore original anymore but I’m still very fond of it (I can get very emtional ;-))... I was wondering more about the layout of the bCard rather than the logotype itself. I am going to post the other color versions in an hour or so. I like better the first version too and I’m just wondering about the arobase...<br>
      Anyway, other critics are welcome.</p>
      <p>PS : At the begining Dr Duckling was the name of a (successful) graphic project that I did (print, web, tees) about taking CARE of the environment (nature heath care...) and I just kept it when I started my freelance activity as it felt right to...</p>
