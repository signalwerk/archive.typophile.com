    <p>hello typeoholics.</p>
    <p>i'm designing my online portfolio in my domain "yaronimus.com".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rwetetet3_6730.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rwetetet_6411.jpg"></div><br>
    i named the site itself as "creation space A"<br>
    above is the sketch for the logotype, which containing the first letter of three languages - hebrew Aleph, arabic Aliph, and english A). this will appear at the site entrance page. (the fonts here are just for presentation).<p></p>
    <p>this site will be like the homebase of my virtual presence, containing displays of art and design, but also a good place for experimental and creative process publications, and links to my other online resources like flickr, facebook, mail, behance, etc etc.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rwetetet2_3962.jpg"></div><br>
    this is my logo at the moment (which will also appeare in the site).<p></p>
    <p>my site will show works by projects in a format which will be a mixture<br>
    of a blog and a magazine.</p>
    <p>i'm looking for a font good sans-serif font for headings, which is clean and legible in smaller sizes (like jpg buttons in a website), but also has some nuance (lyric) calligraphic qualities. in a way, this font needs to bridge between minimalism and my works which are often characterised by calligraphy or typography.</p>
    <p>the closest matches i found were italic/slanted solutions like linotype's optima nova (which is very expensive btw).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/heading font src_3739.jpg"></div><p></p>
