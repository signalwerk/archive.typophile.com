  html: |-
    <p>Hi all,</p>
    <p>I've been using Helvetica/Neue quite a bit for the last couple of years ago, and it has become one of my favorite fonts - a true classic, in my opinion. Recently, I decided that my resume needed some freshening up, so I thought about redesigning using Helvetica.</p>
    <p>But I'm having a difficult time getting over a feeling that's been growing on me for the last year or so - that Helvetica is overused. A pretty obvious observation, perhaps, but it never deterred me from using it until recently. CNN, Apple, BusinessWeek magazine, more recently BBC News - heck, even The Weather Channel - have all adopted it, and I feel like it's just too prevalent. I mean, it's always been very popular, but it's starting to annoy me a bit now.</p>
    <p>I'm not too sure where I'm headed with this - a complaint about the ubiquitous nature of Helvetica, counsel as to whether or not I should use it on a resume or potential replacements, or both - but I'd be interested in hearing your opinion. Thanks!</p>
