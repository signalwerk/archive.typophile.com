      <p>Courier.</p>
      <p><a href="http://en.wikipedia.org/wiki/Courier_%28typeface%29" title="http://en.wikipedia.org/wiki/Courier_%28typeface%29">http://en.wikipedia.org/wiki/Courier_%28typeface%29</a></p>
      <p>Then if asked explain the history of the use of Courier in the business documents. </p>
      <p>The fact that this is how most historical documents looked and how it relates to type written communication.</p>
      <p>Current fixed pitched fonts are taken from the typewriter ball or metal strike and not the printed output and often lighter than the intended output. </p>
      <p>Explain the various types of monospaced/fixed pitch fonts: Courier, Courier New, Letter Gothic, Prestige Elite are preferred by government and software engineers, they are the technological 'crystal goblet' of communication and shows you are not messing around. </p>
      <p>An over designed resumé is clearly trying to hide the facts. </p>
      <p>regards,</p>
      <p>vincent</p>
