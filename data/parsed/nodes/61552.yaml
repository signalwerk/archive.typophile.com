    html: <p>I'm convinced the spryness of the x and droopiness of the H and d are intentional, but as for the words proportions to each other, it seem much more attributed to the natural length of the words. So maybe it was intentional, in that the designer didn't fudge with the words too much— because restraint best illustrated the concept.</p>
