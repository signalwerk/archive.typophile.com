    html: |-
      <p>I found something quite interesting on wikipedia. It's about the pangram "The quick brown fox jumps over the lazy dog":</p>
      <p><cite>"In the Disney movie The Fox and the Hound, there is a scene near the end where the fox is running fast and jumps over the lying-down hound, creating an in-context, non-contrived instance of the phrase."</cite></p>
      <p>This tells me that typography was very important for the designers. And if you take a closer look at the title screen again there occurs one question: Isn't the quick brown fox jumping over the lazy dog in this scene?<br>
      <em></em></p>
      <p>Here is the link to the wikipedia-article: <a href="http://en.wikipedia.org/wiki/The_quick_brown_fox_jumps_over_the_lazy_dog" title="http://en.wikipedia.org/wiki/The_quick_brown_fox_jumps_over_the_lazy_dog">http://en.wikipedia.org/wiki/The_quick_brown_fox_jumps_over_the_lazy_dog</a></p>
