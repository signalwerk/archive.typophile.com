      <p>Thanks for the suggestions.<br>
      And I'm seeing some faces I haven't seen before.</p>
      <p>I've included an uppercase "H" that I customized quickly from Franklin Gothic Demi Condensed. Instead of being rounded ALL THE WAY AROUND like VAG or Gotham, it just has rounded corners. Has anyone seen something like this?</p>
      <p>Thanks again.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/H_6043.jpg"></div><p></p>
