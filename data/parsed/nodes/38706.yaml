  - id: 236859
    user: 11702
    date: 2007-11-01T12:22:00
    date_raw: 1 Nov 2007 — 12:22pm
    votes: null
    html: <p>The fantabulous <a href="http://www.joshuadarden.com/shop/omnes.php" rel="nofollow">Omnes</a>. You could also check out <a href="http://www.typography.net/type/corbel.htm" rel="nofollow">Corbel</a> (part of the new MS Office package) and <a href="http://www.terminaldesign.com/fonts/sets/?CID=6" rel="nofollow">Enclave</a>, which is a rounded slab serif. And this is getting further away from your request, but several of Sumner Stone's designs, <a href="http://www.stonetypefoundry.com/silicaoverview.html" rel="nofollow">Silica</a>, <a href="http://www.stonetypefoundry.com/magmaoverview.html" rel="nofollow">Magma</a>, and <a href="http://www.stonetypefoundry.com/stonehumanistsan.html" rel="nofollow">Stone Humanist Sans</a>, could fit the bill of being warm and bold but sophisticated.</p>
