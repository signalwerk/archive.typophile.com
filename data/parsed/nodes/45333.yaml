      <p>The lettering all appears custom (hand-drawn) to me. Notice the variations in letters that should be identical. I would not expect Louis Vuitton to be using fonts that were commercially available, if they used fonts at all (except for ad copy).</p>
      <p>- Mike Yanega</p>
