    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aviano-Sans-Poster-2_4914.png"></div><p></p>
    <p>Aviano Sans' 2009 update includes two new weights, Thin and Black. All weights include 42 new Art Deco inspired alternate characters and 40 unique ligatures.</p>
    <p>Previous customers can download the updated files for free using the MyFonts.com update mechanism, and upgrade packages that include the new weights are available. 25% off for a limited time.</p>
    <p><a href="http://new.myfonts.com/fonts/insigne/aviano-sans/" title="http://new.myfonts.com/fonts/insigne/aviano-sans/">http://new.myfonts.com/fonts/insigne/aviano-sans/</a></p>
