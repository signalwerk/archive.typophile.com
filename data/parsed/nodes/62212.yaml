    <p>Found on a bridge in Maine, built by the WPA as part of Roosevelt's 'New deal'.</p>
    <p>had a look around the web, but there doesn't seem to have been a 'standard' typeface</p>
    <p>this one is lovely, does anyone know its origins?</p>
    <p>all the best</p>
    <p>brett</p>
