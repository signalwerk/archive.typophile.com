    html: <p>It's a circus style that Intecsas sold under the name of Buffalo Bill (often available as freeware from the David Rakowski collection, before Intecsas marketed them). These fonts used to be sold by Precision Type, but they recently ceased selling fonts.  <br> <br>Adobe also sold it as <a href="http://www.myfonts.com/fonts/linotype/rosewood/" target="_blank">'Rosewood'</a>.  <br> <br>The Solotype Catalog (p.36) calls it 'Coffee Can Initials'. <br> <br>More than you ever wanted to know.</p>
