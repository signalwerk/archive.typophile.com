    html: <p>I'm REALLY not trying to be contentious Mike, but to my inexpert eye they <br>ARE all the same and all, <a href="http://www.myfonts.com/fonts/linotype/rosewood/regular/testdrive.html?s=EXTRAVGNZ&amp;p=72" target="_blank"> including Rosewood</a>, have the same basic <br>letterform differences. What am I missing ... ? <br> <br>To me, it looks like someone took a set of those spear point decorations <br>and plopped them onto a different font, with little concern for getting them <br>on straight, no adjustments for size with different letters and no curving in <br>the G or R. <br><br></p>
