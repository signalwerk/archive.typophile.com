    html: <p>Coffee Tin and Rosewood are slightly different from one another (see the 'R'), but both are more divergent from the posted sample than they are from each other. The patterning is basically the same, but the letterforms are almost <a href="http://www.myfonts.com/fonts/linotype/rosewood/regular/testdrive.html?s=EXTRAVAGANZA&amp;p=72">completely different</a>. <br> <br>So what is the sample? Looks to me like <a href="http://www.myfonts.com/fonts/urw/goudy-heavyface/heavyface-d/testdrive.html?s=EXTRAVAGANZA&amp;p=60">Goudy Heavyface</a>, squoooshed to about 65% and decorated to look like Rosewood/Coffee Tin. I think it's squooshed� Goudy Heavyface rather than Goudy Heavyface Condensed, because the spur at the lower right-hand corner of the 'G' is still prominent in the sample, but appears to be absent in both URW's and Bitstream's digital versions of the Condensed.</p>
