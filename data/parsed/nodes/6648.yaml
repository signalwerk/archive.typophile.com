    html: <p>Coffee Can Initials is by no means the same as your sample, <br>but is likely as close as you're going to get in a font. <br> <br>I thought I'd mention that <a href="http://www.moorstation.org/typoasis/designers/mueller/a_f.htm" target="_blank"> Rick Mueller</a>, like Rakowski, digitized <br>this typeface years ago and <a href="http://www.faces.co.uk/products/fonts/view.cfm?productsku=IN20117" target="_blank"> Buffalo Bill</a> may still be had via Faces.</p>
