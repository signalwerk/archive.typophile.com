    html: "<p>thanks for the comments... i guess i should have clarified what my objective was here... the shop opened up in the 30's and i am attempting to reference a visual language of that era relating to fishing. I have gone through tons of books and fishing magazines from the 30s and basically wanted to give this place a more modern feel, while referencing the past. This is where I am pulling for the type treatment: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/19181.jpg\" alt=\"\"> <br> <br> <br>This is the \"logo\" i have been working on which would be on one side of the business card, while the logo type and info would go on the other. Again, I am attempting to reference the \"golden days\" of fishing by using the line art illustrations of that era as well as colors used in packaging. <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/19182.jpg\" alt=\"\"> <br> <br> <br>Do you still think I should totally scrap everything and start over? My teacher actually really liked the direction it is headed in, but if the general consensus on here is that this is totally wrong, I have no problem trying something different. Any suggestions on how I should approach it differently?  Thanks a lot.</p>"
