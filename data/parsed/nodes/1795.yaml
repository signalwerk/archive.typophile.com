    html: <p>Dan I have to disagree, but only a bit. I think that the name works as it is, minus one 's'. It works as a cliche and is used that way as well. For example, "I fell for that face, hook, line and sinker." <br> <br>Jason, I think you need to distill this down even more. As it looks, you have vector art and raster art. What if, instead of using those three graphics as is, you redraw them yourself. Or, at least free them from those boxes. I'm sad you are working with the scroll work. That is one of the things that could authenticate it a bit more. And the scroll work could also wrangle it all into one shape instead of several floating shapes. (Maybe) <br> <br>Crazy thought. What if the scroll work were the "line" and these three objects were some how "on" the line".... It is morning, I'll use that as an excuse if I decide later that this was a bad idea.</p>
