    html: <p>I like it a lot more, and it has a New England feel to it, but I'm trying to envision this on a sign with the colors. <br> <br>Also, keep in mind that whatever you put a sign will probably also go on letterhead/business cards (color/B&amp;W), newspaper ads (B&amp;W--considering it's a store), possibly a yellow pages ad (B&amp;W), bags (color/B&amp;W), invoices (B&amp;W), billboards (?), packaging (?), and more. Unless you know for certain a logo will be for a specific use only, design for *all* the possibilities. You don't know what the client will do with it down the road. <br> <br>And the above logo use possibilities are why one generally **doesn't** charge a pittance for a logo design. Fifty dollars  (a figure I pulled out of my hat, but which is typical low-budget pricing) may seem like a lot of money to some people, but think of all the name/brand recognition the client will be getting from YOUR design as their logo is disseminated to the community. That recognition is worth money you should be getting a piece of. It's how you pay the bills and not have watered-down ketchup and crackers for dinner. <br> <br>Really like the name! <br> <br>Theresa</p>
