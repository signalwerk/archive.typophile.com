    html: <p>maybe Im being picky, but shouldnt it read. <br> <br>"Hook(comma)Line &amp; Sinker" <br> <br>They are three seperate objects, no? Unless you have some sort of hook-line. Going against what HD said, I don't think the use of a hook would be so bad. <br> <br>I think that there should definately be all three items, not just one. I do like the idea of a treble hook, as opposed to a single hook. Maybe a tear-drop sinker would work better than the double eyed sinker you have displayed here. <br>as far as the item you have in the middle of the picture above, well that looks like a life-float-tube-thingy (whatever those ar called). Make it look more like possible a bundle (and I mean more of a neat, round -- maybe even tied off on the right and left side like they used to do -- bundle)  <br> <br>With three abojects like this, you may experience a little visual instability, my suggestion around this is to reverse them out of boxes, similar to what you have here, but solid boxes. The boxes could be three different colors, that would work, but have the object reversed out (being white). <br> <br>The small caps I dont care too much for. The H,L,S glyphs look much to heavy. I might suggest a loosely -- but not too loose -- letterspaced all caps line. <br> <br>The ornaments on either side of your type, really don't do aything for me. It's too distracting. <br> <br>The type face itself is really not bad. I am not totally crazy about the ampersand though, but then again, that may just be personal opinion. <br> <br>Oh, and whats the deal with that middle arm on the E? It looks like it is about to reach out and molest that R. ;) <br> <br>Hope some of this was usefull. I have had a few drinks, sooo. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> <br>hildebrant.</p>
