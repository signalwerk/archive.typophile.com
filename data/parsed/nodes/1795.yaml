    html: <p>wow thanks a lot everyone for all the comments/critisism. I have taken a lot of things said into consideration and decided to give it one more round to see if this design will hold any water... the line art is still not quite right, I will redraw it if i decide to stay with this concept, and change the line so it does not look so much like a life preserver ( i had a bad feeling it was going to read this way and was hoping someone would call me on it). Anyway, when i knock out the illustrations in white and keep the colors dark, it looks fairly decent in black and white (the boxes become dark gray with knocked out white), so I dont think that this will end up being a problem.  <br> <br>Im still wondering about the type.. is it still too plain and boring? I used Poppl-Laudatio and modified it very slightly. I wasnt sure how far I should take the type.. any suggestions? <br> <br><img src="http://www.typophile.com/forums/messages/4100/19205.jpg" alt=""> <br> <br> <br>if the general consensus is that this route is dead and not worth working on, I will try to come up with something new tomorrow.  Thanks everyone.</p>
