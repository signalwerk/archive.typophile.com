    date: 2003-10-29T14:39:00
    date_raw: 29 Oct 2003 — 2:39pm
    votes: null
    html: <p>Jason - <br> <br>The pieces you have designed look great, but... <br> <br>Dan is correct about the issues of cost with your letterhead .  A printer would love to do such a job but in the "real" world it would cost a fortune to produce.  The envelope would also cause some printing issues and require a custom conversion - which again would be costly.  I'm not sure it would realistic to expect a small client pay for such luxuries, unless the "high-end" look was a desired result. <br> <br>I'm also assuming that in creating other pieces, like an invoice, the design would take into consideration photocopying or faxing - and still fit into your complete corporate identity. <br> <br>I don't buy into the the whole issue that a biz card MUST be 2 x 3.5.  Some of the most eye-catching and effective biz cards are unusual shapes and sizes.  Mine is almost square - and perhaps I do like to annoy some people with the unusual size/shape just a little bit.  These days a biz card seems to much more of  an introduction piece - and then the contact info is transferred to a PDA, a cell phone or a computer address book/data base.  Sticking to a standard size/format is just not the major concern it once was when designing a biz card. <br> <br>I've really enjoyed watching your progress on this project. <br> <br>- Jeff <br> <br>Jeff Fisher <br>Engineer of Creative Identity <br> <br>Jeff Fisher LogoMotives <br><a href="http://www.jfisherlogomotives.com" target="_blank">http://www.jfisherlogomotives.com</a></p>
