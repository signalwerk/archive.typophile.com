    html: <p>While I don't think that a computer is not a creative tool, I feel that your logo -- and btw, this isn't really a logo at all -- looks like a wedding card. It has nothing to do with what the shop actually does, but also isn't ideographic enouugh to be abstract. It's just fancy, trying to be artful but ending kitschy.  <br>Trash it and start anew. Think about an intelligent way of communcating the IDEA of fishing (please, no fishes or hooks or anything)... make it funny or serious or beautyful or ugly or whatever fits your need... but make it mean something.  <br> <br>This is just ... empty, soulless. Devoid of an idea. Sometimes what you do can even be ugly as hell, but at least it has a soul. This however is just visual FX, bells and whistles (and even at that, it's not much fun to look at), without a core, without a message, without a heart.  <br> <br>Shy away from a GRAPHICAL solution and find some communicational SOLUTION first. The rest will follow all by itself. </p>
