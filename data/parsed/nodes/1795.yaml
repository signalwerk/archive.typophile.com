    html: "<p>Hi Jason, <br> <br>I think this is stronger than where you were headed and looks like it's hitting your goal more squarely. <br> <br>Two Thoughts: <br>1. Not sure you need the distressed effect to make it look old. BTW it was nicely done! Keep that version (you might use it for print at somepoint). This should work in black and white too with no distressing. <br>2. Yours has it's own personality, but I'm a little torn that the shape is a modified Brunswick Billiards :-) There are so many to choose from! Keep it if you want, but here are some more ideas: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/19442.jpg\" alt=\"\"> <br> <br>Actual vintage angling logos: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/19443.gif\" alt=\"\"> <img src=\"http://www.typophile.com/forums/messages/4100/19444.gif\" alt=\"\"> <br> <br>The South Bend one looks dated in a bad way. Shakespeare is looking dated in a good way. Yours looks dated in a good way. To dig these up I searched for collectibles online. You might try _________ collectibles + Logo at google. I put in fishing collectibles + logo, but try hunting, try appliances, try cattle feed (i dunno :-). Or try your own shape. One that works with the long wording. <br> <br>Good Stuff! </p>"
