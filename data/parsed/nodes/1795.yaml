    html: <p>The blue border on the letterhead and other elements is a disaster waiting to happen. I've been in and around printing for almost 30 years and I can tell you the cutting machines will never give you the same width border on your collateral. Also if a printer took on the job they charge you 100% to 200% overs to make the design work. It would cost a fortune. Also I know that some people who have standard holders for business cards will toss out a card that doesn't fit there filing system. Another potential problem is if you have to photocopy, lets say an invoice if the background is too dark it will be a problem. There are asthetic design problems and then there are real physical and monitary design problems. Dan</p>
    html_clean: <p>The blue border on the letterhead and other elements is a disaster waiting to happen. I've been in and around printing for almost 30 years and I can tell you the cutting machines will never give you the same width border on your collateral. Also if a printer took on the job they charge you 100% to 200% overs to make the design work. It would cost a fortune. Also I know that some people who have standard holders for business cards will toss out a card that doesn't fit there filing system. Another potential problem is if you have to photocopy, lets say an invoice if the background is too dark it will be a problem. There are asthetic design problems and then there are real physical and monitary design problems. Dan</p>
