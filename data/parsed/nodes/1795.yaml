    html: <p>The fish on the old logo adds the...urp...flavor, so it works---kind of. Eliminating the fish reduces it to, as someone wrote, a wedding invitation feel, or a showcard feel (like in the silent movies), especially considering the ornaments you used. <br> <br>This might be one of those instances where you start from scratch. Keep in mind that fonts often have a "feel" to them--I think, at least. Can't think of any fishy fonts that aren't kitschy, so you might want to go with artwork and a neutral font, or at least a font that is brave enough to go with the artwork. I think you can find something that still evokes the feel of "old-fashioned" without being too formal. <br> <br>Plus, this was for an old catalog, not a fish shop sign. I think the two are entirely separate entities. What I would choose for one, I probably wouldn't choose for the other, unless a font was *just right* for both.</p>
