    html: <p>Thanks folks, I will start looking for someone with Fontographer or Scanfont etc., and hope that will do the trick. not easy when you are an economics professor, and all your friends' idea of fun is playing with MATHEMATICA. i don't think that prob (2) is key -- i never installed anything other than atm 4.1 (except a VERY old version of ATM from the days of win 95...) <br> <br>best, <br>j</p>
