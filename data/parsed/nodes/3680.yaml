    html: <p>There are two possibilities. <br> <br>1) It's the case that newer versions of Windows are getting ever stricter about fonts adhering to the appropriate fonts specs (whether it's Type 1, TrueType, or OpenType). The reason for it is stability/security concerns. <br> <br>As a result, some fonts that worked just fine before don't work correctly in XP. <br> <br>2) It is possible to "break" the built-in Type 1 support in Windows. Most commonly by installing a really old Windows 9x/ME version on Windows 2000/XP. Have you ever installed ATM 4.0 (not 4.1) on your XP machine? <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Mgr. <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
    html_clean: <p>There are two possibilities. <br> <br>1) It's the case that newer versions of Windows are getting ever stricter about fonts adhering to the appropriate fonts specs (whether it's Type 1, TrueType, or OpenType). The reason for it is stability/security concerns. <br> <br>As a result, some fonts that worked just fine before don't work correctly in XP. <br> <br>2) It is possible to "break" the built-in Type 1 support in Windows. Most commonly by installing a really old Windows 9x/ME version on Windows 2000/XP. Have you ever installed ATM 4.0 (not 4.1) on your XP machine? <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Mgr. <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
