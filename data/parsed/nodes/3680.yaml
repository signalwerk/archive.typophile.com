    html: <p>If you are saying that you installed a very old version of ATM on this XP computer, that is almost certainly your problem. We see this pretty often. <br> <br>Have you tried installing other Type 1 fonts? Do they install okay? <br> <br>If you are running ATM 4.1, you should upgrade to ATM 4.1.2 anyway. If you have broken Windows, this will also fix the problem. See my announcement and links on the Adobe User Forums "http://www.adobeforums.com/cgi-bin/webx?13@29.qevKcXFfbAV.0@.ef9db1e/35" <br> <br> <br> <br>Regards, <br> <br>T</p>
