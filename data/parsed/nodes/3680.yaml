  html: <p>HI, <br> <br>Apologies if this is a trivial matter, but it is giving me no end of headaches. I have Baskerville MT, bought many years ago. Worked beautifully with ATM on all computers, up to my latest addition -- an XP machine. I copy into the font folder, and it just refuses to use it "font invalid", etc. I am rather dismayed that I cannot use what I bought any more. Any ideas much appreciated!</p>
