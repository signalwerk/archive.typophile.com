  html: |-
    <p>First of all: Happy 2008! </p>
    <p>This year I would love to hear your critique and advise about the typeface to use for correspondence and legal papers. I’m a lawyer at a small firm (my own), and the last 2 years a passionate typophile.</p>
    <p>As for years, we’re using Times New Roman. No wonder I would like to change that soon.</p>
    <p>I truely like the look and feel of the H&amp;FJ fonts like Gotham and Mercury, but for long text it doesn’t seem right somehow.</p>
    <p>I love Scala too, but untill now I must admit that Minion Pro has the best look on print. And Minion is again well used and hardly exiting....</p>
    <p>Does any of you have good suggestions? Thanks!</p>
