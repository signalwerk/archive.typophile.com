    html: "<p>Having just done an extensive typeface classification project myself, here are a few I can think off from off the top of my head (don't have access to my notes at the moment): <br> <br><a href=\"http://www.identifont.com/show?1A0\">Abadi</a> <br><a href=\"http://www.identifont.com/show?60T\">Corporate S</a> <br><a href=\"http://www.identifont.com/show?38N\">Venus</a> <br> <br>Or <a href=\"http://houseind.com/house.php?kit=CHALET-FO&amp;sub=inuse\">Chalet</a> (the Paris 1960, London 1960 &amp; New York 1960 as well as their respective Comprime cuts) <br> <br>Or even <a href=\"http://www.fontfont.com/shop/view_packages_area.ep?id=657\">FF City Street Type</a> <br> <br>Then there is Macromedia's corporate face Vonnes, designed by FontBureau, but seemingly not available to the general public at this stage. <br> <br>Could you tell us some more about your project? It sounds interesting...</p>"
