    html: <p><b>What about you? Is it "just" a personal hobby or are you doing this for a greater good?</b> <br> <br>If the tool I'm developing turns out halfway decent and I can find a way of posting it without releasing the outlines, I will gladly share it. It's one of those projects, however, that tends to grow more complicated. Especially when I do silly things like ask a bunch of experts in typography to add to my list of fonts. ;) <br> <br><b>I will leave the genre classification to others (Grotesk/Grotesque, and such terms are too vague and often misused) ...</b> <br> <br>Mike, you are right. Even framing my question in this thread required me to expand on the labeling somewhat. Outside of venues such as this, the terms are relatively meaningless <br> <br>The value in type classifications became clearer to me when I studied more about the history of typography. Bill Moran of Blinc Publishing in St. Paul taught a class at the Minnesota Center for Book Arts that opened my eyes to the technological bases for many developments in typeface design. It was very helpful in understanding type design up until the digital age. Since we are still using those classic designs in digital form, the labels continue to be useful for me.  <br> <br>Also, Mike, I have looked at the Bowfin pages. I find his san serif guide baffling. The script guide, however, is more user-friendly and has saved me hours of time in identifying fonts. <br> <br>Thanks to all who suggested fonts! <br> <br>Kristin</p>
    html_clean: <p><b>What about you? Is it "just" a personal hobby or are you doing this for a greater good?</b> <br> <br>If the tool I'm developing turns out halfway decent and I can find a way of posting it without releasing the outlines, I will gladly share it. It's one of those projects, however, that tends to grow more complicated. Especially when I do silly things like ask a bunch of experts in typography to add to my list of fonts. ;) <br> <br><b>I will leave the genre classification to others (Grotesk/Grotesque, and such terms are too vague and often misused) ...</b> <br> <br>Mike, you are right. Even framing my question in this thread required me to expand on the labeling somewhat. Outside of venues such as this, the terms are relatively meaningless <br> <br>The value in type classifications became clearer to me when I studied more about the history of typography. Bill Moran of Blinc Publishing in St. Paul taught a class at the Minnesota Center for Book Arts that opened my eyes to the technological bases for many developments in typeface design. It was very helpful in understanding type design up until the digital age. Since we are still using those classic designs in digital form, the labels continue to be useful for me.  <br> <br>Also, Mike, I have looked at the Bowfin pages. I find his san serif guide baffling. The script guide, however, is more user-friendly and has saved me hours of time in identifying fonts. <br> <br>Thanks to all who suggested fonts! <br> <br>Kristin</p>
