    html: <p><b>Refusenik, your multiple suggestions are very helpful. I've become fascinated (again!) with font classification systems through this little project of mine. Are you planning on sharing your own research anywhere? I'd be interested in seeing what you've done.</b> <br> <br>Yes, it's an evil virus, isn't it? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I think Mike Yanega is absolutely correct to state that it is nigh on impossible to classify typefaces in an academically exhaustive way - there are just too many exceptions to every rule you could possibly come up with. <br> <br>However, I <b><u>do</u></b> think that type classification has a place in every designer's universe, especially if it is conducted in a pragmatic and non-dogmatic manner. It can be a great help in making educated judgements about a particular typeface's suitability for the requirements and context of a given job. <br> <br>My own research, therefore, was simply a way for me to see what is out there from foundry catalogues both online and offline and to find my favourites in each of the categories. Of course, the standard type classification systems are not very useful, so I had to devise my own system of classification by combining, modifying and extending what is out there. I'm happy with the results, but I have yet to devise a way to share my findings. Perhaps I'll get it together one day... <br> <br>What about you? Is it "just" a personal hobby or are you doing this for a greater good?</p>
