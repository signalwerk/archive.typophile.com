    html: <p>Kristin, <br> <br>Have you looked at my <a href="http://bowfinprintworks.com/SansIDPage.html" target="_blank">Sans Serif Font Identification Guide</a>? There are now over 750 families classified by letterform features of 7 key letters (a, e, g, G, M, R and y).  <br> <br>I will leave the genre classification to others (Grotesk/Grotesque, and such terms are too vague and often misused) and try to use a scheme that doesn't depend on such judgments. Look at how much difficulty experts in this group are having agreeing about which are which. In my opinion a classification scheme should be independent of such labeling attempts, because there are too many 'grey' areas in the digital era fonts.</p>
    html_clean: <p>Kristin, <br> <br>Have you looked at my <a href="http://bowfinprintworks.com/SansIDPage.html" target="_blank" class="link-external">Sans Serif Font Identification Guide</a>? There are now over 750 families classified by letterform features of 7 key letters (a, e, g, G, M, R and y).  <br> <br>I will leave the genre classification to others (Grotesk/Grotesque, and such terms are too vague and often misused) and try to use a scheme that doesn't depend on such judgments. Look at how much difficulty experts in this group are having agreeing about which are which. In my opinion a classification scheme should be independent of such labeling attempts, because there are too many 'grey' areas in the digital era fonts.</p>
