  html: "<p>I am working on a project that will assist in the identification of and differentiation between san serif grotesk and neo-grotesk fonts. The fonts I am currently working with are: <br> <br>AG Buch <br>AG Oldface <br>AG Schoolbook <br>BE Akzidenz Grotesk <br>Alternate Gothic <br>Arial <br>Bell Centennial <br>Bell Gothic <br>Franklin Gothic <br>Geneva <br>Gothic 13 <br>Helvetica <br>Helvetica Neue <br>Impact <br>Letter Gothic <br>News Gothic <br>Trade Gothic <br> <br>I am exluding san serif faces that are rounded, humanist or geometric. Given that, are there any faces that you think should be included in this list that I have missed? <br> <br>Thanks in advance! <br> <br>Kristin</p>"
  html_clean: "<p>I am working on a project that will assist in the identification of and differentiation between san serif grotesk and neo-grotesk fonts. The fonts I am currently working with are: <br> <br>AG Buch <br>AG Oldface <br>AG Schoolbook <br>BE Akzidenz Grotesk <br>Alternate Gothic <br>Arial <br>Bell Centennial <br>Bell Gothic <br>Franklin Gothic <br>Geneva <br>Gothic 13 <br>Helvetica <br>Helvetica Neue <br>Impact <br>Letter Gothic <br>News Gothic <br>Trade Gothic <br> <br>I am exluding san serif faces that are rounded, humanist or geometric. Given that, are there any faces that you think should be included in this list that I have missed? <br> <br>Thanks in advance! <br> <br>Kristin</p>"
