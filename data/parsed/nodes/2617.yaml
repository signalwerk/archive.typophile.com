    html: <p>&gt; <b>avenier</b> <br> <br>Avenir is really more of a geometric face in the vein of Futura, thus the name (which of course means "future" in French). <br> <br>Kristin, if you are including American Gothic faces such as the ones you mentioned by MF Benton, you could also look at <a href="http://www.identifont.com/show?3OO">Lightline Gothic</a> and <a href="http://www.identifont.com/show?HV">Clearface Gothic</a>. Personally, I like to think of American Gothic faces as a separate (sub-)category to the mainly European Realist Grotesks, not least because most of the American cuts have an old-style three-storey "g". ALso, FontBureau have recently released <a href="http://www.fontbureau.com/fonts/font_frames.tpl?fontname=BentonSans">Benton Sans</a>, a revival of this period. In fact, half the FB catalogue is derived from roughly this period, so you may have some luck there for some of the modern interpretations.</p>
