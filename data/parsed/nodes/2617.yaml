    html: <p>These are great suggestions! I've also decided to include Compacta and DIN.  <br> <br>Cheshire Dave, Aaux is a great suggestion and a font I hadn't seen. It looks like an elegant alternative. <br> <br>Tim, for some reason I had thought of Folio as a geometric face, but your post made me take another look. You're right -- it fits the bill. <br> <br>Stephen, I've been busy but hope to be back more. Univers. Well, du-uh, yeah! <br> <br>Refusenik, your multiple suggestions are very helpful. I've become fascinated (again!) with font classification systems through this little project of mine. Are you planning on sharing your own research anywhere? I'd be interested in seeing what you've done. <br> <br>Adriano, another du-uh post! MT Grotesque. And it's right here on my hard drive. Thanks! <br> <br> <br></p>
