    html: <p>FF Super Grotesk is  a lovely typeface, in fact it's one of my faves in its genre. <br> <br>That said (and as if to prove Mike Yanega's assertion that type classification is entirely in the eye of the beholder) Super Grotesk is essentially Futura (Super Grotesk A) with an alternate three-storey g (Super Grotesk B) and a full set of ligatures (Super Grotesk C), so for me  it's basically a geometric face with extra features, but without any obvious connection to classic Realist grotesques such as Akzidenz Grotesk.</p>
    html_clean: <p>FF Super Grotesk is  a lovely typeface, in fact it's one of my faves in its genre. <br> <br>That said (and as if to prove Mike Yanega's assertion that type classification is entirely in the eye of the beholder) Super Grotesk is essentially Futura (Super Grotesk A) with an alternate three-storey g (Super Grotesk B) and a full set of ligatures (Super Grotesk C), so for me  it's basically a geometric face with extra features, but without any obvious connection to classic Realist grotesques such as Akzidenz Grotesk.</p>
