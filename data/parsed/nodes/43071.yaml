    <p>While googling in search of info about Baskerville typeface I came across this page with lots of scans from John Baskerville books. I did a quick search in typophile and it seems that the link it hasn’t been posted before:</p>
    <p><a href="https://web.archive.org/web/20081011054255/http://www.riversevenpress.co.uk/bask.html" title="http://www.riversevenpress.co.uk/bask.html">http://www.riversevenpress.co.uk/bask.html</a></p>
    <p>By the way, this River Seven Press produces books “by using letterpress printing”... they also link <a href="https://web.archive.org/web/20081011054255/http://www.britishletterpress.co.uk/" title="http://www.britishletterpress.co.uk/">http://www.britishletterpress.co.uk/</a>.</p>
    <p>Regarding Neo-classical typefaces, I’d love to share some thoughts about Walbaum and Bulmer, two very nice fonts that doesn’t seem to get the attention they deserve.</p>
