      <p>Some of it <em>is</em> actually working as a grunge face. It's similar to some "vernacular" fonts that play up their own ignorance and lack of refinement. Fonts like <a href="http://www.fontsquirrel.com/fonts/Chinese-Rocks" rel="nofollow">Chinese Rocks</a> and <a href="http://hvdfonts.com/#20-HvD Poster" rel="nofollow">HVD Poster</a>, are based on rough, impromptu lettering. While Cosed is much more rigid and smooth, I would still put them in the same category.</p>
      <p>What I would suggest is to maybe make it a little <em>more</em> awkward. Keep _S_R_O_5_K_ etc. the way they are and try to capture that weirdness in some other characters.</p>
