      <p><em>Do you have any particular letter in mind that I could change?</em></p>
      <p>I was originally going to suggest you alter the _K_ so that the arm and leg met exactly at the stem, but then I thought that would make it really thin and maybe a bit <em>too</em> weird.</p>
      <p>You could make the horizontal lines in _E_ and _F_ the same length. And if you're not opposed to breaking your rules a little, you could make the leg and arm of _K_ slightly narrower at the ends to mimic the optical effect on the _R_</p>
      <p>That's all I can think of right now.</p>
