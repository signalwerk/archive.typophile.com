    <p>Good evening (at least for the ones living in the same Time gap as I do!)</p>
    <p>For an upcoming rugby tournament, I'd need to know which font is used in the logo of the german team TSV Rugby Handschuhsheim, nicknamed die Löwen (the Lions).<br>
    As usual, you'll find this logo attached to help you in helping me.</p>
    <p>Best regards,<br>
    12HAL9000</p>
