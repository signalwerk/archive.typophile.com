  html: |-
    <p>We now present our new typefamily FP Dancer! This typeface is avaiable in 4 weights, incl. italics:<br>
    Light, Book, Bold, Black. All with OSF (Old Style Figures) and TF-figures (Tabular Figures).<br>
    FP Dancer is a design, which try to combine a constructed face with a scriptface: A upright scriptface.<br>
    The goal was a typeface, that combine softness and friendliness with more strength. </p>
    <p><a href="http://www.fontpartners.com" title="http://www.fontpartners.com">http://www.fontpartners.com</a></p>
    <p>Price: 149 Euro/package. 50 Euro/weight.</p>
