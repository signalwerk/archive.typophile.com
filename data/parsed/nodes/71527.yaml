      <p>First, without knowing what your project involves, I think I might be inclined to agree with your client. Mustang has a lot of life to it, but it is not going to be very easy to read unless it is just a few large-type words.</p>
      <p>'Energetic, hand-drawn script style' candidates: ITC Arid, Ru'Ach, Banshee and Tiger Rag. These are all 90's era fonts found at MyFonts.</p>
      <p>- Mike Yanega</p>
