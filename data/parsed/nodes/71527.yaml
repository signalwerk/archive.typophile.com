    <p>My apologies for the zaney subject line, but now that I've got your attention...</p>
    <p>I'm working on a project that requires an energetic, hand drawn, script style typeface. I actually already found the perfect solution, it's called Mustang (see below). Unfortunately the client feels that it's "too hard to read". I'm going to try my best to persuade them otherwise, but will definitely need some alternates in my back pocket. </p>
    <p><a href="http://new.myfonts.com/fonts/robarnow/mustang/" title="http://new.myfonts.com/fonts/robarnow/mustang/">http://new.myfonts.com/fonts/robarnow/mustang/</a></p>
    <p>My search for something with similar qualities hasn't yielded anything good. Mostly what I'm finding are retro 50's era sign lettering (seems to be in vogue at the mo') or dodgy hand-writing fonts that lack the emotion, flare and spontaneity of the mighty Mustang.</p>
    <p>If anyone has any suggestions, please help a brother out...  it'd be much appreciated! </p>
    <p>p.s. I'd love to do custom lettering, but time &amp; budget is probably not going to allow for it this time around.</p>
