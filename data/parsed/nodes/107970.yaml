    votes: null
    html: |-
      <p>Thomas, I would love to read that article as well when it's out.</p>
      <p>I also agree the open ends have to be thicker generally, but which E looks better is contextual in my opinion. From a distance the left E looks better, and I suppose this is the best way to view the typeface. When I look up close though I see the left E features semi-transparent pixels to suggest a very slight slant whereas the right E features very sharp horizontal lines. I don't think this is an optical illusion which actually affects the shape of the letter though. I don't think it should be compensated for. Perhaps only if you're doing a really big geometric display letter.</p>
