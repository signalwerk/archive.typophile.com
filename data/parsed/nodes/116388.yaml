    html: <p>At first I thought this looked familiar - and I searched all over at likely sources - but then I concluded that fonts like Lilith, inline Einhorn and a Japanese font called Candy all contributed to this feeling. After seeing the extreme differences in the two s's (and lesser differences Johan mentions), I highly suspect this is (very nice) artwork.</p>
