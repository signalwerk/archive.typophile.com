    html: |-
      <p>True, but many lettering specimens have been the source of fonts. I know that Nick Curtis, for example, sometimes made fonts based on the limited set of letters found on a luggage label, or something like that. Also, this looks like the sort of thing that showcard lettering artists would make. Quite often they had a full alphabet to use as a reference. So perhaps it is still possible that someone fonted this one.<br>
      Don</p>
