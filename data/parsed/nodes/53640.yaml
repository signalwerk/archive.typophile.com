    <p>I just got this week's New York Times Magazine, and the cover caught my eye. I couldn't find an image of the cover online, but the front page of their web gallery of same name is very similar to the magazine cover, and can be seen here:</p>
    <p><a href="http://www.nytimes.com/packages/html/magazine/2009-inauguration-gallery/index.html" title="http://www.nytimes.com/packages/html/magazine/2009-inauguration-gallery/index.html">http://www.nytimes.com/packages/html/magazine/2009-inauguration-gallery/...</a></p>
    <p>I can't figure out the face. The G and R made me think it was a highly condensed Helvetica, but I mocked it up and it isn't quite right.</p>
