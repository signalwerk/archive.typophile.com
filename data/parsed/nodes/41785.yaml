      <p>Nick — yes, I take your point about the g and about unevenness in the extenders being no bad thing. The lower part of the g is so massive that it doesn't need to be extended downwards to the same extent as the p and q. The y could also be considered separately, as the diagonal makes evenness undesirable.</p>
      <p>I feel that I've learned a lot from this discussion. Thanks.</p>
