      <p>Eluard -- The long descenders in the poetry specimen you showed are not consistent. The "g" for instance is shorter than the "p".</p>
      <p>The problem for the type designer is that while it's possible to drop the vertical stem of "p" indefinitely, and still have a round bowl, once you lower the g beyond a certain point it begins to look condensed. Gill tackled this in Perpetua by adding the distance in the bridge of the "spectacles", avoiding condensing the "eyes" but nonetheless, as I said, the proportions still look odd to me.</p>
      <p>I'm afraid I can't agree that long descenders are graceful, which is surely the desired epithet for classic-style poetry setting, they look  disproportionate to me.</p>
      <p>I don't think long descenders are out of the question, but you can't just tack them on, it has to be part of an overall theme.  </p>
      <p>Oswald Coooper's "Packard" design comes to mind. The style of lettering he originally developed for the Packard ads in the early 'teens had well integrated long extenders. However, when the font was derived in 1915, they were reined it, for reasons of the standard line. You can see how Oz solved the issue of the g in his original lettering, by making it somewhat monocular. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/packard_5817.jpg"></div><p></p>
