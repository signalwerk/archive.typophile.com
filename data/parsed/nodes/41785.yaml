      <p>Thomas -- Here you go. I reconstructed an estimation of Art Line. I assumed that some of the same underlying considerations were in play regarding mixing sizes on a line. But it only worked if I allowed half-point increments.</p>
      <p>This is my best guess and may or may not be entirely correct.</p>
      <p>I didn't have the same range of samples to work with (I have a proof of several sizes of ATF Garamond l.c. alphabet). In an effort to make the chart roughly comparable to the Point Line diagram, I inserted "blanks" for samples I didn't have (and guesstimated their alignment). </p>
      <p>It was only when I went to resize this to match the Point Line post that I realized that the original diagram wasn't actually proportional -- that is, the 24-pt block is not twice as high as the 12-pt, and the 6-pt is more than half the height of the 12-pt, etc. So it's not the accurate comparison I'd hoped for. One would have to reconstruct the Point Line diagram from the numbers to see how the progressions really compare. (Which I'm not inclined to spend time doing ;-)</p>
      <p>-- K.</p>
