      <p>Apps like MS Word use the font's bounding box to determine default line spacing, but I wouldn't consider that a cause of short descenders, particularly.</p>
      <p>Digital revivals of typefaces that were originally designed on standard line tend to inherit those limitations. Revivals of older typefaces don't necessarily.</p>
      <p>Looking at the proportions of Adobe Garamond Pro, Garamond Premier Pro Regular and Garamond Premier Pro Display, I see that Rob's designs optimized for 11-12 point would slightly exceed the "standard line" and GPP Display's descenders would exceed the standard line depth by a good 40% or so.</p>
      <p>I guess typefaces like GPP would need to have been cut on "art line" instead. That was what they called it, right? Anybody have a handy chart for "art line" like the one Kent posted for "standard line"? I don't see any details on the "art line" in a quick perusal of "Letters of Credit."</p>
      <p>Cheers,</p>
      <p>T</p>
