      <p>Today, digitally unconstrained, even when designing an original old style face, I haven't made long descenders. Frankly, I find it difficult to make the "g" and "y" look comfortable when low slung. I look at Perpetua, in which those characters are, IMO, a bit too attenuated, and think, long descenders, why bother?</p>
      <p>Another question: why make all descenders the same depth? Some types have a "g" or "y" which is nowhere near as low as "p" or "q". Same thing with "f" -- it can be made quite a bit taller than "l", "k", etc.</p>
