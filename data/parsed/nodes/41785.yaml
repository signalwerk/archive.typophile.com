      <p><cite>Can you mention one of your books, maybe one where you used either Bembo or some Garamond, where you feel that the setting is particularly good</cite></p>
      <p>I can't think of a title offhand, but wife recently designed, &amp; her company set a book called <cite>An Introduction to Manuscript Studies</cite> that used my Bembo. The paper isn't ideal (wasn't her choice), but given the many plates it was a reasonable compromise. Anyway, it uses Bembo with a terminal "f."</p>
      <p>If I can remember, I'll try to post a sample showing the sidebearings when I go into work tomorrow.</p>
      <p>There are other uses for such a "f," BTW. What I usually do is shorten up the terminal and increase the right sidebearing, which is just what an "f" needs when followed by a vowel with an umlaut. If you finesse it just right, it will work with vowels that carry a grave accent -- except for an accented "i."</p>
      <p>Or you can go whole hog &amp; make up a number of "f's" -- one for a terminal, &amp; others for a following vowel carrying an umlaut, grave, etc. occur. I don't write code anywhere near as well as a lot of the people who post on the forums, &amp; that probably limits what I think of.</p>
      <p>My terminal "f's" are just that, and are switched only when white space follows, not a period or comma. I don't kern punctuation that tight. But if you do, you just write a class &amp; switch it for that. For the f-grave vowels, I tend to make extra ligatures, but someone clever could probably do it all with fewer glyphs.</p>
