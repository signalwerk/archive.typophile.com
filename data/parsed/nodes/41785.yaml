      <p><cite> &gt; Sabon looks, on the page, completely unlike AGPro — if both are deemed historically accurate then something has gone very wrong with our ideas of historical accuracy.</cite></p>
      <p>Eluard -- I don't believe that Sabon was intended to be "historically accurate." Tschichold likely had some goals of historical similitude, but I'm sure these were quite secondary to all the technological constraints of the brief.</p>
      <p>With regard to the vertical proportions of Sabon (vis-a-vis "original" Garamond), designs in the 20th century, whether for foundry metal or for machine composition, conformed to a few standardized alignments. This means that for any given point size, the baseline was set as a specified, standardized location on the body, effectively limiting the proportion of ascent and descent. The relative x-height was still discretionary, but the descender length was essentially fixed.</p>
      <p>Prior to the adoption of Standard Alignment, different fonts of the same size set on the same line were not guaranteed of having a common baseline.</p>
      <p>-- K.</p>
