      <p>Apart from its modified proportions, GPP isn't "historically accurate" because it's too slick. It doesn't parse the irregularities and bounce of letterpress printing. And it's got kerning.</p>
      <p>But it's not meant for recreating facsimiles of Renaissance documents, is it?</p>
      <p>Poliphilus was better able to mimic the documents from which it was derived than Bembo, but Bembo was created to improve upon mere similitude.</p>
      <p>The idea of "historical accuracy" as a feature or benefit of a typeface is just so much marketing BS, unless it isn't ashamed to be a little rough around the edges.</p>
      <p>Take your pick, do you want to listen to Beethoven on a fortepiano or a pianoforte?</p>
      <p>It has beeen possible for several years, with OpenType contextual alternates, to make fonts which duplicate the inconsistencies of old letterpress printing, but the thinking seems to be that people don't want that kind of Garamond, or that MvB Celestia Antiqua is best, a most obvious distress rather than something that just looks a bit off the pace.</p>
      <p>Funnily enough, as Goudy recounted concerning his creation of Garamont in 1919, many of the folk at Lanston Monotype didn't have much faith in his wonky interpretation, but it sold like hot cakes. It's still my favourite Garamond--in magazines from the 1920s.</p>
      <p>Ultimately, I don't believe historical accuracy is a meaningful concept, it's all interpretation. </p>
      <p>"The task of renovating or recreating a design from old impressions is the most difficult of all. The effect of impressing upon damp paper, of worn type, and of the spread of ink, have to be reckoned with; and great skill is needed if, while removing blurred outlines, the subtleties of the original engraving are not to be lost." --Stanley Morison, <em>A Tally of Type</em></p>
