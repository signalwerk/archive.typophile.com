      <p>Nick — one place where long descenders (and ascenders) look right is in the setting of poetry. In different threads here I posted two images taken from poetry books published in Italy in 1945–6, one fronm Einaudi and the other from Mondadori. They are strikingly elegant and show the art of setting poetry in a way that complements the text (using contextual alternatives for certain double letters that occur frequently in Italian, like rr and cc). The Einaudi used Linotype Estienne and the Mondadori used Monotype Pastonchi. Both are elegant fonts with longer than usual descenders.</p>
      <p>I can't think of too many poetry books that have been published in the digital age that look well-designed. Faber books are particularly unsuccessful, I think, but then I don't know that they were very good pre-digital. The best that I've seen have come from the U.S. (Hotel Lautréamont by John Ashbery is one of the best.)</p>
      <p>I think the problem of setting poetry well has been much exacerbated by the stumpy digital fonts that are designed with magazines in mind. There is room for alternatives in the market place.</p>
