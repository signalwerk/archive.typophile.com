      <p>Charles — these are fascinating comments and, like DanGayle, I feel I'm learning a lot. The idea of creating a special terminal f and making it contextual is a great idea, and would solve a lot of problems with digital setting. Can you mention one of your books, maybe one where you used either Bembo or some Garamond, where you feel that the setting is particularly good? I'd like to have a look.</p>
      <p>I also agree with you, here and elsewhere, about the short ascenders and descenders of GPPro. It was, in fact, this that made me make the comparison with PS Sabon. The subjective impression is of a heavy, stumpy font with not much elegance but a lot of readability — a serviceable font. It is being used quite a bit by Oxford University Press at the moment and it looks ok without looking "beautiful".</p>
      <p>I'll stick my neck out here: I think that much that has been said about whether a particular font is a historically accurate revival has to do with focussing on too few points of comparison e.g the axis and the characteristics of the serifs. But in the small face sizes used in books these are micro features of the letterform. The macro features of a letterform — the things which just jump out at you from the page — are the x-height, the relation of lowercase to the capitals, and the lengths of the ascenders and descenders, and these are allowed to vary **wildly** between the *historically accurate* revivals of Renaissance fonts. Sabon looks, on the page, completely unlike AGPro — if both are deemed historically accurate then something has gone very wrong with our ideas of historical accuracy.</p>
      <p>Thomas Phinney remarked on some thread (sorry, I've forgotten where that was now) that AGPro was the more historically accurate of the two Slimbach Garamond creations. Looking at a page set in both, I agree with him.</p>
      <p>best</p>
      <p>El.</p>
