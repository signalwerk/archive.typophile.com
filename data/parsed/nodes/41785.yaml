      <p>Once upon a time ... I hope I get this right ... Robert Slimbach went to the Plantin Moretus museum and took thousands of photos of the Garamond types (and I'd imagine other good stuff). He then went back and started work on what became Adobe Garamond. Still seen today as an excellent typeface for (from?) its time. Fast forward through until a couple years ago. Technology has advanced. His skills have increased ten-fold. He revisits his research and out pops Garamond Premier Pro. GPP is not a revival of Adobe Garamond. Garamond Premier Pro is what, I believe, Robert originally hoped to do with Adobe Garamond but for whatever reason is, instead, what we have today. Optical sizes for size appropriate usage.</p>
      <p>Sabon is a lovely face. But it leaves me cold. It is too crisp and cold. Especially compared to Adobe Garamond and, even more so, Garamond Premier Pro.</p>
