      <p>Nick --</p>
      <p>Yes, of course you're right. In foundry type, some designs came to be cast on what was called Art Line, which was a different standard alignment than Standard Line. But a standard nonetheless, and so it does fix the proportion allotted to the descenders. </p>
      <p>For Linotype machine casting, they got around it by requiring the long-descender versions to be cast upon a larger line (i.e., leading was mandatory in order to cast a line including these sorts). So, for instance, a 12-point design might be created on 12-pt alignment, but then the descenders would extend beyond the 12-point body. But rather than call these 13-point designs (which would have required a different alignment), they are 12-point fonts which must be cast on 13-point body. A little confusing, yes? Took Dwiggins a couple explanations from Griffith to get how to design for this.</p>
      <p>My point to Eluard was that various standards fixed descenders in certain ways and this may account for why ascender/descender proportions might have been <cite>"allowed to vary **wildly** between the *historically accurate* revivals of Renaissance fonts."</cite></p>
      <p>-- K.</p>
