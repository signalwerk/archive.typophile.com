      <p>Nick -- </p>
      <p>Here is the diagram I was thinking of. This is taken from <cite>Letters of Credit,</cite> p. 49, where Walter Tracy discusses the pros and cons of the standard. (And as you can see, he took it from a Stephenson &amp; Blake catalog.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PointLine_diagram_5388.gif"></div><p></p>
      <p>As you can see, the relative placement of the baseline was not a simple proportion. Another part of the concept of Standard Line (also called Point Line) was that, not only would different fonts of the same size base-align when set alongside one another, but different sizes could be aligned easily using leads of incremental points. </p>
      <p>D.B. Updike explains this in his discussion of Standard Line on p. 35 of <cite>Printing Types</cite>:</p>
      <p><cite>"The convenience of being able to align different sizes of type by the use of 1-point leads or their multiples is no doubt appreciated by the compositor; but to make this possible, types below 18-point are arranged, so far as 'line' is concerned, in but three groups: in the first are 5 and 6-point types; in the second, 7 to 10-point types; and in the third, 11 to 16-point."</cite></p>
      <p>Both Tracy and Updike bemoan the prevailing late-19th-century taste that established the set baseline so that descenders were given such short shrift. Updike again: </p>
      <p><cite>"Taking the second group for illustration, the 'descenders' of g, j, p, q, and y can be no longer in a 10-point than in a 7-point face; and as they are none too long in 7-point they become much too short in 10-point."</cite></p>
      <p>Later, into the 20th century, as tastes reverted back to longer descenders for book faces, various workarounds to the shortcomings of Standard Line were developed; but the standard remained a technical parameter that influenced the vertical proportions of type up to the photo era.</p>
      <p>-- Kent.</p>
