      <p>Eluard,</p>
      <p>No, not an expert set. With type 1 fonts, we used TeX running in a DOS box, and so were not limited by the Windows OS. I made up fonts having all appropriate glyphs in them -- in many ways, our Type 1 fonts looked like current OT fonts, except they were name based. We would write a different encoding vector when we needed other glyphs -- actually, you could, on the fly, make up temporary fonts &amp; have two or three fonts from my database font -- one having small caps, one having tabular old style figures, one having proportional oldstyle figures, etc.</p>
      <p>We even had something like OT features, but these were run using a program we called PreTeX on the TeX (ASCII) files. The program was font-specific (really, it had a place where you could plug in an extra set of routines for specific fonts), and so get roman to italic kerning, etc -- things we can't yet get with standard OpenType features. But the downside was that PreTeX put hard codes in the files, so when you had to make an XML file later, there was a lot to strip out. And (our) TeX's color management was a nightmare for anything but grayscale images. Finally, "our" implementation of TeX was the creation of my business partner, Larry Tseng, &amp; both he &amp; I are getting old. We needed to move to a system where he &amp; I weren't absolutely required, so OpenType and InDesign seemed to fit the bill.</p>
      <p>But there is nothing in these ideas that can't be implemented in OpenType, and much of it more easily.</p>
