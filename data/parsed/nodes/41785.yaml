    <p>I've just been setting some text in Garamond Premier and was struck by the fact that it looks *nothing* like Adobe Garamond — in fact it seems to have proportions on the page that are more like Sabon (viewed macroscopically, if you like).</p>
    <p>What do you guys think? Is this really a better Sabon?</p>
