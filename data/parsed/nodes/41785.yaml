      <p><cite>Tyfa*, Sabon, Scala Serif ... probably more ... all of these faces are overly sharp and better for advertising and magazines (when crisp can help with the shout) and letterpress (when they soften up a bit).</cite></p>
      <p>I <cite>think</cite> I know what you mean; I think of it more as "anemic" than "sharp," but probably the same root cause.</p>
      <p>Bit of a story. We have set the <cite>South Atlantic Quarterly</cite> since the early 1980s. It first went from Times Roman (unknown designer) to a redesign by Mary Mendell using Pilgrim. You could get Pilgrim from Linotype for the 202, &amp; I always felt it was Gill's best text font. Linotron 202 Pilgrim needed lots of kerning, but that's a different story. </p>
      <p>When we were ending our use of the 202 &amp; moving to PostScript fonts in the early 1990s, there was no PostScript Pilgrim. What to do? Mary redesigned the journal again using Scala, which kept much of the flavor of Pilgrim. This was before printers were accepting PDF files, and as we used TeX, they weren't about to get application files from us. We ran out the journal on repro paper &amp; pasted it up the old-fashioned way.</p>
      <p>Finally came PDF files &amp; direct-to-plate printing. All of a sudden, the type looked anemic. It also looked too sharp. I scanned in samples of the printed journal, both repro-negative-plate and direct-to-plate, and compared them side by side. It didn't take too much work to get back the look of the repro-negative-plate, which must have been what Martin Majoor was looking at anyway, since there was no direct to plate printing when he cut the type.</p>
      <p>So which is the "right" Scala? Maybe both; it is just a different look depending on different needs. It is impossible for a foundry to anticipate the uses their fonts will be given.</p>
    html_clean: |-
