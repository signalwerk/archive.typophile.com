      <p>As to the long descenders -- my belief is they've always been used for book work, even back in the linecaster days. Short descenders were for newspapers &amp; magazines. But there were always more linotype machines sold to newspapers, so the *standard* fonts were for those customers and had short descenders. Makes commercial sense.</p>
      <p>Kerning fixes are as much loosening as tightening. They include single to double quotes; kerning for superiors used in note calls, both with themselves and with the punctuation they most often follow (quotedblright, period, comma) and a few letters. I also don't happen to like much foundry kerning with spaces -- where an f+ space has a positive kern, but is a smaller value than the negative kern with space + quotedblleft, so the *sum* is that the quotes  beginning a world are closer to that "f" in the preceeding word than to the word where the quote begins. Stuff like that. Better to make a terminal "f"  &amp; write a contextual substitution than to kern it with a wordspace. Etc. etc.</p>
      <p>Also, single quote marks (raised &amp; turned commas) are often too tight from the foundry (for my eye), and are used for other purposes than signaling a quote or apostrophe (e.g., glottal stop, pharyngeal frictive, etc.). And period &amp; commas are used with number strings as well as sentences, &amp; on &amp; on.</p>
      <p>I've rarely claimed that foundry kerning is outright wrong; there are different points of view as to how things should look, even for bookwork -- and bookwork is a small, specialized market, I am told. Our books have a certain look, and that is part of what our customers pay for. I would note that our small shop -- six people -- has turned out more books that got in to the AAUP Book Show than any other shop, from 1991 to date. With that, I can conclude that whatever we're doing, it does no harm. </p>
      <p>BTW, we did a book a while back where I didn't do the work to the font &amp; the comp had to do a series of search &amp; replaces. It takes me about 25 hours to rework the roman &amp; italic. It took the comp 4 hours to do the series of S&amp;Rs. That means the seventh time we use a font family I've worked over ahead of time, we're money ahead. </p>
      <p>FWIW</p>
