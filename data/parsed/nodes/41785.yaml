      <p>I'm not really saying either -- though in some ways, comparing the two is like comparing Roger Federer with Rod Laver. Neither font is quite in that exalted class perhaps, but you get the idea.</p>
      <p>For me, Sabon was one of the few really good fonts available for the Linotron 202 to use for book-length text. It wasn't used so much with the earlier Linotype linecaster technology. To my eye, Janson was the "really good" linecaster font, but Janson with the 202 was quite poor. And for whatever reason, PostScript Sabon doesn't quite succeed.</p>
      <p>I haven't used Garamond Premier Pro yet. None of our customers has requested it, and I am not looking forward to fixing all the kerning needed for book work, so haven't specified it in one of my designs. I do wish it has a set of long descenders; the foundry font seems to have even shorter descenders than the older Adobe Garamond.</p>
