      <p>Yes, "historical accuracy" makes it seem as though you should able to linearly order the approximations to accuracy — and this is obviously completely wrong. </p>
      <p>But if one thinks of nearness along several parameters for the features that are to be approximated then you can speak about accuracy along the parameters that you deem most significant. There is nothing wrong with <em>that</em> idea, that I can see. But of course there is then room for endless disagreement as to whether the features deemed most significant really are the most significant, and you might say that such disagreement is subjective.</p>
