    html: |-
      <p>It's funny that you would tag this "afro", given that geometric type has a history going back to European modernism (Futura, Bayer Universal &amp;c.) and Art Deco, and that in type "afro" is traditionally connoted by Koch's Neuland, and associated with pre-European "ethnicity".</p>
      <p>However, this is in no way a criticism. Perhaps the most geo font of all time was for the Mexico Olympics, connoting Aztec culture (and contemporary Op art).</p>
      <p>If the afro beat is what inspired the font, go with it!</p>
