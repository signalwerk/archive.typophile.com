    <p>I'm looking for nice examples of composite characters (Æ/æ/Œ/œ/Ĳ/ĳ) within monospace typefaces; especially more heavily grid-based ones.</p>
    <p>Which typeface succeeds in putting two characters in the space of one, while maintaining the same look, feel, spacing &amp; darkness?</p>
