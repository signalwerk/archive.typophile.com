      <p>One solution I have found is to reduce the weight of the stroke in the composite characters, so visually it has the same darkness as 'normal' characters.</p>
      <p>This is <a href="http://www.caketype.com/type/capibara_mono/index.html" rel="nofollow">Capibara Mono</a> by Caketype</p>
