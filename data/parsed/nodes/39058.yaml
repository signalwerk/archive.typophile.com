    <p>King's Caslon is Dalton Maag's latest addition to its exclusive font library. It is based on the custom font we designed for the King's College London earlier this year. The main differences are that instead of a Semi-Bold we provide a Bold weight and we have added a few extra ligatures to the fonts. King's Caslon is available with Standard or Typo characterset. To see what it looks like, use TypoGFX for testing.</p>
    <p>To view the King's Caslon and test Typo GFX go to <a href="http://www.daltonmaag.com/typogfx/" title="http://www.daltonmaag.com/typogfx/">http://www.daltonmaag.com/typogfx/</a></p>
    <p>This release of TypoGFX is for public Beta testing. We would like to hear your comments and suggestions to make it an even better tool.</p>
    <p>Bruno Maag<br>
    Dalton Maag Ltd</p>
