      <p>Oh yeah, looking good, looking ’important’. For me it’s definitely number one, the other ones look blobby because they don’t have enough air through the devices and also the shapes, although meaningful, seem not to balance compositionally. Although I do like the stripes.</p>
      <p>I wonder though whether number one could go even simpler? The triangle of the bowl perhaps dominates too much (also makes t a bit top heavy) and takes away from the nice balance the leaves and the text have between light and dark. Perhaps it’s worth exploring just the leaves or the bowl or something. Loving the colours,  *makes mental note to use oranges and purples together in the future*<br>
      Again, though, looking good.</p>
