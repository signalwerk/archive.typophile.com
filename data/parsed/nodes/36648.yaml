    <p>Hi,<br>
    Starting a new thread with this to get rid of all the crap in the other one.</p>
    <p>here’s the description again:<br>
    MAQ is a company that is going to start giving out certificates for nurses and other people in the medical field. The certificate is for treatment/handling of prescription drugs, dosage and things like that for patients.</p>
    <p>yes yes, trying a more modern approach this time. A bowl, which references to the Bowl of Hygeia, used by other medicine organizations.</p>
    <p>Leafs witch symbolizes growth.</p>
    <p>The top one is the newest version.</p>
    <p>Feedback greatly appreciated.<br>
    peter</p>
