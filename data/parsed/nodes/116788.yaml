      <p>Another option is Bookmania Black Italic <a href="http://www.myfonts.com/fonts/marksimonson/bookmania/black-italic/glyphs.html" title="http://www.myfonts.com/fonts/marksimonson/bookmania/black-italic/glyphs.html">http://www.myfonts.com/fonts/marksimonson/bookmania/black-italic/glyphs....</a> which lacks the rounded "friendly" letters of your shirt or Cooper, but as you can see has a huge variety of swash letters.<br>
      Don</p>
