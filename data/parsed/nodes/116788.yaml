      <p>I suspect that these letters are from the predigital era.<br>
      As a substitute you might try Cooper Black Swash Italic, designed by Oswald Bruce Cooper. A digital version is available as Umbriago NF <a href="http://www.myfonts.com/fonts/nicksfonts/umbriago-nf/" title="http://www.myfonts.com/fonts/nicksfonts/umbriago-nf/">http://www.myfonts.com/fonts/nicksfonts/umbriago-nf/</a> You might need to compress it to fit the bottom line.<br>
      BTW there used to be a digital version of Cooper Black Swash Italic by Ian Lynam published by Wordshape at Myfonts, but it is no longer available there. You can get it at <a href="http://www.youworkforthem.com/font/T3177/cooper-black-swash-italic" title="http://www.youworkforthem.com/font/T3177/cooper-black-swash-italic">http://www.youworkforthem.com/font/T3177/cooper-black-swash-italic</a><br>
      Don</p>
