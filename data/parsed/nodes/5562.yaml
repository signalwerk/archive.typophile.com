    html: <p>I agree with Sally, the mark is difficult to read. I can maybe see the "l" and "e" without knowing the word.  However, I like the exploration you're doing with the type and think that you could be on to something.  Taking the idea of the word "pulse" could offer up some interesting solutions.  What about establishing a rhythm in the design that helps distinguish one letter from the next. You could play with varying baselines or the idea of alternating letters getting closer and further away.  I should also say that I like the way the "s" and "e" are connected in your 2nd example.  </p>
