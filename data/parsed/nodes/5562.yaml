    votes: null
    html: <p>The first logo is too cryptic, I agree with Sally, that it is very hard to read, especially for an untrained eye. The latest post is much more legible, but still takes a bit too much effort to read for the avarage person. Imagine this logo in use on say a delivery truck, driving at 40mph and people trying to read it in a busy street. Consider all uses from web, signage, catalogs, b/w, color reproduction, etc... and think about this from the userbility  <br>aspect of the design versus the creative/artistic aspect. <br>I did design for a similar type of client last year. Simplicity is  <br>sometimes the best approach. Like all work it is important to consider end user/consumer instead of just delivering something client/company likes. You are in the business of solving communication issues and not an artist. Consider how this company would grow with the identity you create. Test it <br>in black and white. small and large scale, blur it a bit to see how it would be recognized by someone with poor eyesight, dyslexia, etc...You can charge more money with this approach and make you business more profit, ands serve your client's needs better. <br>As for what you have done so far. It is very nice and artistic and I personally like it, even though that really doesn't matter.</p>
    html_clean: <p>The first logo is too cryptic, I agree with Sally, that it is very hard to read, especially for an untrained eye. The latest post is much more legible, but still takes a bit too much effort to read for the avarage person. Imagine this logo in use on say a delivery truck, driving at 40mph and people trying to read it in a busy street. Consider all uses from web, signage, catalogs, b/w, color reproduction, etc... and think about this from the userbility  <br>aspect of the design versus the creative/artistic aspect. <br>I did design for a similar type of client last year. Simplicity is  <br>sometimes the best approach. Like all work it is important to consider end user/consumer instead of just delivering something client/company likes. You are in the business of solving communication issues and not an artist. Consider how this company would grow with the identity you create. Test it <br>in black and white. small and large scale, blur it a bit to see how it would be recognized by someone with poor eyesight, dyslexia, etc...You can charge more money with this approach and make you business more profit, ands serve your client's needs better. <br>As for what you have done so far. It is very nice and artistic and I personally like it, even though that really doesn't matter.</p>
