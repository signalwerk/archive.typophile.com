    <p>I'm new to font design and have made a dingbats font with just a few characters for use in both the print and ebook versions of a book I'm preparing to publish. I have one particularly complex glyph that prints beautifully and displays perfectly in InDesign CS3, but looks terrible in MS Word (2004 for Mac), and kind of muddy in a high-quality PDF produced through InDesign.</p>
    <p>Since the glyph prints fine, I'm not worried about it for the print book, but I am concerned about how it will display in ebooks on various platforms. (I can't change the design of the glyph, since it relates to something in the story.)</p>
    <p>I've autohinted the font the glyph is in using an older version of FontForge [from 2009, since I couldn't figure out how to install it without the help of a (now dated) package].</p>
    <p>I don't know enough about font design to hint the glyph manually -- and I'm not sure if that would help, since the glyph displays perfectly in InDesign. The other glyphs in the font seem adequate to me in all contexts -- but they are much simpler in design.</p>
    <p>I'd welcome any suggestions as to how I can make sure this glyph preforms properly in ebooks!</p>
    <p>Here's a link to an image that will make it clear what I'm talking about:  </p>
    <p><a href="http://img35.imageshack.us/img35/7423/problemswithglyph.png" title="http://img35.imageshack.us/img35/7423/problemswithglyph.png">http://img35.imageshack.us/img35/7423/problemswithglyph.png</a></p>
    <p>Thanks for any help you can offer!</p>
