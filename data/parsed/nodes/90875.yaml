      <p>frode frank, the answer to your question, "Why is this not represented by an image?" may be -- Because I'm new to this? The image is used repeatedly as a small, decorative element, and I thought it might be simpler to include it within a font and embed it, rather than deal with different picture-formating requirements in different ebook formats. Since I was making a dingbats font, anyway, I decided to include it. I had no idea that the complexity of the image would be a problem.</p>
      <p>Theunis de Jong, the information that you gave is helpful and interesting. And, yes, the image does clear up beautifully if I zoom in on it in a PDF.</p>
      <p>Nick Shinn -- thanks, also, for your input.</p>
      <p>I gather from what you've all said that this image is just too complex to display well on screen as a glyph in most situations. It sounds like the best choice is to go back to presenting it as a raster image.</p>
      <p>I've also made a handwriting font for one of the characters (for presenting a few brief passages that are supposed to be written by hand). If I could figure out how to install the latest version of FontForge, would the autohinting in it be enough better than it was in the 2009 version to be worth the trouble? Or would there be no more than a small improvement, anyway?</p>
      <p>Thank you again for all the help!</p>
