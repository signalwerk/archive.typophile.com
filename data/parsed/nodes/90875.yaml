    html: |-
      <p>1. InDesign probably uses its own auto-hinting mechanism -- it comes with an "Adobe Cooltype" DLL.</p>
      <p>2. You can only use your custom font in epub viewers that support font embedding.</p>
      <p>3. Those devices that <em>do</em> support font embedding and custom fonts may use different hinting mechanisms, ranging from 'none at all' (if they mainly rely on their own built-in fonts being optimized for their own screen) to, uh, well probably nothing as advanced as the Adobe Cooltype you see in InDesign. In other words, YMMV.</p>
      <p>That said, I would say you are correct in your estimation it's just the on-screen hinting that muddles the glyphs. Can you see the quality varying if you zoom in and out in a PDF?</p>
      <p>(After looking at your sample image:)</p>
      <p>Ouch. Frode may be right as well.</p>
