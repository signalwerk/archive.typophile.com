      <p>The image file is no longer posted, so I can't comment on the OP's question directly. But Theunis wrote:</p>
      <p>&gt; 1. InDesign probably uses its own auto-hinting mechanism -- it comes with an "Adobe Cooltype" DLL.</p>
      <p>No, unless something has changed recently, InDesign does NOT use an auto-hinting mechanism. It uses the hints built into the font. However, CoolType is InDesign's own font rendering engine (among other things).</p>
