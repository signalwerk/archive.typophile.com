      <p>Hinting makes sense when there is a(n optical) system, like for example in the Latin alphabet where similar widths are supposed to look uniform and similar heights are supposed to align.</p>
      <p>Handwriting fonts can definitely benefit from hinting, but only in some situations. Sometimes drawing within the constraints makes more sense. Feel free to PM me if you need any help with your project!</p>
