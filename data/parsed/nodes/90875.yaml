    html: |-
      <p>That sounds like sound advice. However, the handwriting font is meant to be suggestive of the character's handwriting, but more legible than handwriting is likely to be. I think it is working well as a font, as far as that goes, and would allow for fluid resizing of text by the reader of an ebook. I realize that some older ebook reading devices will display their default font in place of the handwriting font—and for that reason, I have defined the handwriting font as an italic, as I presume that in those cases the default font will then display its italic style, which will then still be distinct from the surrounding text. I can live with that in exchange for the benefits of fluid resizing and a smaller file size overall.</p>
      <p>Regardless, your point is well taken, and I do appreciate your advice. I certainly think it would be the thing to do if the handwriting were meant to be an exact representation.</p>
      <p>Thank you for your help!</p>
