    <p>Hi everyone !</p>
    <p>I’ve found this grotesque in a dutch book from 1939</p>
    <p>Some letters have specific details : G, R, g, a<br>
    It’s a sans serif font with contrasted letters : p, n, q, u, a (but not lower case r)<br>
    Also, the egg shape of letter O, C, o, e, and the squarish part of letters j, t, a, f<br>
    It seems that the only letter that has a terminal going back inside the shape is the capital J</p>
    <p>a gothic from an american foundry or a british one ?</p>
    <p>any ideas ?<br>
    cheers !<br>
    H</p><div class="imageWrap"><img src="/files/scan_grotesque2_6182.jpg"></div><p></p>
