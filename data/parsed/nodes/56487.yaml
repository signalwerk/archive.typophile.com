      <p>Looks like you've already got the hang of it, Mike! I assume those are your creations?</p>
      <p>Insadong is a great place for art books in general and for books on Korean calligraphy in particular. I can't immediately think of other places for type-related books, but used book stores in general can be treasure troves for calligraphy-related books. I found a copy of a great calligraphy exhibition catalogue in a used book store near my previous home in Bongcheon-dong. I seem to recall there are lots of used book stores in the Cheonggyecheon area.</p>
      <p>Also, keep on eye out for typography- and calligraphy-related exhibitions in the galleries and museums around Seoul. It might be difficult to find information in English, so you might want to ask around with your Korean colleagues. There was an interesting exhibition of hangul tablets at the Seoul Arts Centre last year; I should upload photos from the show when I get the time.</p>
