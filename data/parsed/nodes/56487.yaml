      <p>Good luck in Korea! I am no longer based in Seoul, and I've left all my Korean typography-related books back there, so I'm afraid I can't be of much help. You should know that you won't find anything in English at the level of detail you are looking for, seeing that you are concerned about the positioning of subglyphs within glyphs. Even books and monographs in Korean will seldom go beyond the obvious stuff about optical correction, because for native readers of hangul, the sense of balance between the subglyphs is pretty much assumed to be ingrained and would be very hard to explain analytically.</p>
      <p>Nevertheless, if you happen to be interested in hangul type design, you can try drawing a few glyphs and I'll be happy to comment on them. I've never seen non-native readers of hangul make serious attempts in designing hangul, so I would be interested to see what you can produce.</p>
      <p>Meanwhile, here are some links that may be helpful for the pictures at least until you get your Korean up to speed. The first link in particular contains links to several essays about designing hangul typefaces, with pictures of corrections made along the way.</p>
      <p><a href="http://yoonfont.co.kr/yoonstory/yoonessay.asp" title="http://yoonfont.co.kr/yoonstory/yoonessay.asp">http://yoonfont.co.kr/yoonstory/yoonessay.asp</a><br>
      <a href="https://www.fontclub.co.kr/main.asp" title="https://www.fontclub.co.kr/main.asp">https://www.fontclub.co.kr/main.asp</a></p>
      <p>The <em>Geulkkol</em> 글꼴 annuals published by the Korea Font Development Center (한국글꼴개발원) are really helpful and contain some interesting studies as well as an overview of new hangul typeface designs published during the year. They should be available in the biggest book stores.</p>
      <p>As for the Helveticas of hangul, much of contemporary hangul type is heavily indebted to the designs of the late Choe Jeongho (최정호). His creations are Myeongjo (명조), Gothic (고딕), Sinmyeongjo (신명조), Hwangodik (환고딕), Graphic (그래픽), Gongjak (공작), Gungsuh (궁서), and Naru (나루). Of these, Myeongjo and Sinmyeongjo are the progenitors of virtually all the serif designs used for books today, and Gothic is the basis of the most widely used class of sans-serifs that I like to think of as hangul grotesques.</p>
      <p>Windows faces Batang (바탕) and Dotum (돋움) are based on Sinmyeongjo/Myeongjo and Gothic respectively, Gulim (굴림) is based on Naru, and Gungsuh also closely follows Choe's design.</p>
      <p>Links about Choe (in Korean):<br>
      <a href="http://www.sandoll.co.kr/SandollWeb/font/contents_read.asp?idx=494&amp;p=5&amp;parentidx=494&amp;page=1&amp;category=66" title="http://www.sandoll.co.kr/SandollWeb/font/contents_read.asp?idx=494&amp;p=5&amp;parentidx=494&amp;page=1&amp;category=66">http://www.sandoll.co.kr/SandollWeb/font/contents_read.asp?idx=494&amp;p=5&amp;p...</a><br>
      <a href="http://www.sandoll.co.kr/SandollWeb/font/contents_read.asp?idx=495&amp;parentidx=494&amp;page=2&amp;category=66" title="http://www.sandoll.co.kr/SandollWeb/font/contents_read.asp?idx=495&amp;parentidx=494&amp;page=2&amp;category=66">http://www.sandoll.co.kr/SandollWeb/font/contents_read.asp?idx=495&amp;paren...</a></p>
      <p>Malgun Gothic (맑은고딕), introduced with Windows Vista, is less indebted to Gothic; it is a pretty significant departure representing contemporary trends in hangul sans-serif design. If Choe's Gothic is Helvetica or Akzidenz Grotesque, then Malgun Gothic might be a Meta.</p>
      <p>As for what Jooha is saying, yes, what he says is pretty much spot on.</p>
