      <p>A couple of exhibitions in Seoul you might be interested in:</p>
      <p>There is an on-going show at the Seoul Arts Centre (<a href="http://www.sac.or.kr/" title="http://www.sac.or.kr/">http://www.sac.or.kr/</a>) called "Playing by Typography IV" featuring works by international artists such as Saul Bass and Neville Brody as well as local artist Shur Ki-Heun. The show continues until 28 April.</p>
      <p>Info: <a href="http://www.fontclub.co.kr/Magazine/MagazineView.asp?boardtype=27&amp;subtype=&amp;boardnum=5046" title="http://www.fontclub.co.kr/Magazine/MagazineView.asp?boardtype=27&amp;subtype=&amp;boardnum=5046">http://www.fontclub.co.kr/Magazine/MagazineView.asp?boardtype=27&amp;subtype...</a></p>
      <p>There's going to be a joint exhibition by the calligrapher Lee Sang-Hyun (<a href="http://www.simwha.kr/" title="http://www.simwha.kr/">http://www.simwha.kr/</a>) and the typographer Lee Ho of Sandoll Communications (<a href="http://www.sandoll.co.kr/IR/index.asp" title="http://www.sandoll.co.kr/IR/index.asp">http://www.sandoll.co.kr/IR/index.asp</a>) at the Agitpunkt Café (<a href="http://agitpunkt.com/" title="http://agitpunkt.com/">http://agitpunkt.com/</a>) in the Hongdae area, 11-24 April.</p>
      <p>Info: <a href="http://www.fontclub.co.kr/Magazine/MagazineView.asp?boardtype=27&amp;subtype=&amp;boardnum=5025" title="http://www.fontclub.co.kr/Magazine/MagazineView.asp?boardtype=27&amp;subtype=&amp;boardnum=5025">http://www.fontclub.co.kr/Magazine/MagazineView.asp?boardtype=27&amp;subtype...</a></p>
