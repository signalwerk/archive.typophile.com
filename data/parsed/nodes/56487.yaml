      <p>It's not that simple. I think it's best to illustrate with an example, with Nanum Myeongjo bold.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gi_4604.gif"></div><p></p>
      <p>At first glance, the ㄱ and ㅣ might appear to be simple copy and paste jobs, but a closer look reveals that the shapes and positions differ slightly according to what syllable finals they combine with. I don't think all of the ㄱs above are unique, but I count at least ten different variations.</p>
      <p>There are of course short-cuts, but it is not as straightforward as you might first imagine. A very simple modular set-up of the kind you are thinking will yield a typeface that looks uneven, unbalanced, and full of gaps, and simply will not cut it for body type (unless you are deliberately going for a typewriter look).</p>
      <p>It is generally agreed that at least hundreds of syllable elements are needed to design decent-looking hangul. According to the so-called Leeks Curve which correlates the number of syllable elements to the aesthetic level of the resulting hangul design, 300 elements are the absolute minimum, 900 elements are needed for basic book work, and 1858 elements will be enough for a near-perfect rendering of the 11,172 syllables used in modern Korean.</p>
      <p>A common approach is to design the most common glyphs, fine-tuning them individually, and then using those designs to extract the syllable elements needed to assemble the rest of the glyphs. I think in the case of Nanum Myeongjo and several others the most common hangul glyphs—typically the 2,350 syllables in the old encoding—are individually designed, and the rest of the 11,172 syllables used in modern Korean are provided as composites in the font files.</p>
      <p>Perhaps ironically, the simple modular approach would be best for display faces where the quirkiness introduced by the obvious modularity would be more likely to be tolerated than in body faces.</p>
