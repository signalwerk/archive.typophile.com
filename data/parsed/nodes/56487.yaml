      <p>I'm not sure why prices in particular would necessarily be in a Roman typeface, but yes, Korean typography often requires the Roman alphabet for a variety of reasons.</p>
      <p>Virtually all Korean fonts include letters of the Latin (Roman) alphabet. There are some designs where the Latin component is decent and harmonizes well with the hangul glyphs, but often the Latins are poorly designed. If one deems the available Latin component of a given Korean font to be unusable, it may be substituted with a Latin design that matches well with the hangul. Matching the colour, metrics, and the general feel is key. Because hangul and the Latin alphabet are structurally very different, you can't go much further than that.</p>
      <p>I am not aware of any hangul design which derives from a Latin design. It usually goes the other way, which explains why the Latins that come with Korean fonts are often unsuitable for Latin-heavy typography. In addition to the Latin being made subservient to the hangul, the designers don't have a good feel for what makes a successful Latin design.</p>
