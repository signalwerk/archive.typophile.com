      <p><cite> In addition to the Latin being made subservient to the hangul</cite></p>
      <p>Definitely not common in the font world.  I wonder why more Korean fonts aren't being made.  While the Korean unicode chart is rather scary looking, for body faces it's more than doable I'd think.  While you do have to draw a few more glyphs, most glyphs only need a certain number of forms and then they can be mixed and matched with references.  Display and caligraphic fonts couldn't do this though probably.</p>
      <p>Or am I over "simplifying" * it too much Jongseong?  For example, some consonants would need as many as 18 initial forms (horiz or vert or horiz-vert vowel, final consonant or no, single or doubled in first or second position, 3x2x3) and up to 9 final forms (horiz or vert or horiz-vert vowel, single or doubled in first or second position, 3x3).  Of course, many in modern hangul would not need anywhere near this many forms, for example, ㅁ only needs 6 initial forms, since it cannot be placed in a double consonant, and only 3 final forms.  </p>
      <p>Vowels need seven forms:<br>
      - isolate<br>
      - monophthong<br>
      - monophthong with final consonant<br>
      - notched (heaven) diphthong<br>
      - notched diphthong with final consonant<br>
      - horizontal-vertical (earth-man) diphthong<br>
      - horizontal-vertical diphthong with final consonant</p>
      <p>Once those are designed it's just a massive copy and paste job.</p>
      <p>For example using placeholders ㅇ, ㅡ, ㅣ, with ᄀ, you can have ᄀ 기 깅 끼 낑 그 긍 끄 끙 긔 긩 끠 끵 익 윽 읙.  But it's modular such that replacing ㅇ in 깅 with any other letter, the ᄀ and ㅣ maintain the same form: 깁깆긷긱깃김긴깅길 .</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
      <p>* this means the average Korean letter has many more "forms" than an Arabic letter, although it's essentially just different ways of squashing the letters in the block rather than a wholly different shape like in Arabic.</p>
