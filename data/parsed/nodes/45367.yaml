    <p>“Here,” says big multinational corporation’s rep, “take this jpg of our logo scanned off a business card and blow it up to the size of a watermelon.” </p>
    <p></p><div class="imageWrap"><img src="/web/20081013110123im_/http://www.typophile.com/files/Backup_of_bombarier_sawtooth_5092.jpg"></div><p></p>
    <p>OK... I know the font, I don’t have and I’m not going to get it. The company changes their logo the way some of us change our socks, and it’s the same crappy artwork every time. It’s just for a sponsor appreciation sign for a corporate golf tournament &amp; if they don’t care, neither do I.</p>
