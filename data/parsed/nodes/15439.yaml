    date: 2005-10-22T02:32:00
    date_raw: 22 Oct 2005 — 2:32am
    votes: null
    html: <p>I'm just starting selling some fonts (<a href="http://www.archivetype.com" title="www.archivetype.com">www.archivetype.com</a>) via Kagi. The set-up proces was  pretty easy. There's some techie stuff though, mainly some pieces of HTML code to insert into your site code, but it's not to complicated. Even a tech chalenged person like me managed to do it with help of their support team. It helps having a friend who knows some more of HTML though. Since I'm not a US citizen it was hard to obtain a merchant accout to work with one of the usual card processors and Kagi was ideal for me from this standpoint as well. So far so good. I'll be able to tell you more when things will start going.</p>
