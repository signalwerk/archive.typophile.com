    html: |-
      <p>10% or 12% is a steep cut. If you can implement your own cart and then choose a payment processor with a lower take (like PayPal or 2Checkout), you'll increase your profit and be better prepared to expand in the future.</p>
      <p>Downloadable software is considered a high risk product when it comes to fraud. The best thing to do is contact a potential processor and ask them what their procedure is for handling fraud and chargebacks...</p>
