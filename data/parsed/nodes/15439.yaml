    html: |-
      <p>Having looked into it a bit more- both Pay Pal &amp; Kagi have to agree to credit card company terms - which means charging you a fee for any returns &amp; allowing returns pretty much no matter what - especially if it is the first time. You can decide not to sell to that individual afterwards if you want - but thats about it as far as recourse. The companies are not happy to admit this to you - but when pressed the do eventaully admit it. So basically all risk as far as fraud is on *you* if you sell this way. I had a good talk with a Kagi person about it &amp; they do try to prevent it in various ways but really the risk remains with you the seller. So be preparred for that reality.</p>
      <p>Obviously if you have your own system &amp; deal directly with credit cards - or you *might* be able to do something differently. I am now set up with pay pal ( &amp; just did some business! yay! ) and I hope to be set up with Kagi soon too.</p>
      <p>One of these days I may even get on myFonts.com - who knows.</p>
