      <p>So far what I am seeing is 10% cut on your price - or so - it varies depnding on volume etc. The do offer direct download for no extra charge (sweet!) if you host your own files.  Or it's 2% more if they host the files for you. </p>
      <p>The main thing I want to understand is how fraud &amp; disputes are dealt with. I have a pal with an online store &amp; Chase wanted to hit him with charges ( multi thousands... ) for multiple failed fraud attempts on the credit card system. </p>
      <p>How do most foundrys deal with a dispute about a font? </p>
      <p>I'll post more as I learn more.</p>
