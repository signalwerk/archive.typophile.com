  - id: 101450
    user: 4266
    date: 2005-12-23T04:11:00
    date_raw: 23 Dec 2005 — 4:11am
    votes: null
    html: <p>we used to use kagi, absolutely no problems, easy to set up and they are prompt with payments. plus they dont charge any fee other than the ones from your sales. only problem is their shopping cart system, you cant do any kind of 'add to cart' button, when people want to buy your fonts they have to go to a screen with a list of all of your products which the buyer has to tick the ones they want. it can get confusing if you have a lot of stuff to sell and also looks a little bit amateur. we moved onto a shopping cart system using 2co and mal's e-commerce which is still not as flexible as it could be, but means we dont have to do any complex programming, just scripts and html code. its also a bit more expensive. dealing with credit cards directly yourself is also an expensive option and only worth pursuing if you intend selling fonts full time. so i would not reccommend that. however if you just have a few fonts then kagi is a good option.</p>
