    <p>I'm looking for the fonts that make up the Captain Morgans Black Spiced Label. Particularly the "Spiced Rum" - a cut of baskerville? And the blacklettering of "Black"<br>
    Identity of all fonts including the script writing would be gratefully received! </p>
    <p>Thank you.</p>
