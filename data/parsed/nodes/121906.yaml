      <p>Note that an ultrasound machine could use a custom OEM font which is not necessary available as a general purpose digital font. That said, you may like one of the following similar fonts:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Various%20%2F%20TipografiaRamis%20%28Commercial%29&amp;ffam=Fox%20Grotesque%20-%20Alt%20Black&amp;fid=f0c1787a254682249396fd45b555176d&amp;fsize=48&amp;text=DERFO%2019%2F06%2F2%2011%3A42%3A07&amp;wrap=2" rel="nofollow">Fox Grotesque (Alt Black)</a></strong> [TipografiaRamis, 2012]<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Various%20%2F%20Philatype%20%28Commercial%29&amp;ffam=Merge%20Pro%20-%20Bold&amp;fid=f2046ef44b09bb963ab97ebe1ede4b6e&amp;fsize=48&amp;text=DERFO%2019%2F06%2F2%2011%3A42%3A07&amp;wrap=2" rel="nofollow">Merge Pro (Bold)</a></strong> [Philatype, 2012]</p>
