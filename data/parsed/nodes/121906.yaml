    html: <p>Note that an ultrasound machine could use a custom OEM font which is not necessary available as a general purpose digital font. That said, you may like one of the following similar fonts:<br><strong><a href="http://Fox Grotesque (Alt Black)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Fox Grotesque (Alt Black)</a></strong> [TipografiaRamis, 2012]<br><strong><a href="http://Merge Pro (Bold)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Merge Pro (Bold)</a></strong> [Philatype, 2012]</p>
