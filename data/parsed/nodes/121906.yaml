    <p>I had a stillborn baby boy early this year, after moving house the scan pictures were severely damaged. I want to revive the images to the exact standard we received them for our memory book. I am having issues determining what fonts are used.</p>
    <p>I appreciate all help and assistance greatly. </p>
    <p>Unfortunately mine is pretty ineligible, which I am distraught about! I have included various images which aren't copyrighted which use the same font as displayed in mine as it's from the same ultrasound machine.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/FONT-1_6262.PNG"></div><p></p>
