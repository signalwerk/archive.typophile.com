    html: |-
      <p>I am sorry for your loss.</p>
      <p>The font looks a bit like Univers (the E particularly suggests that); I think I've seen something similar to this on certain computer screens in things on TV. However, I was looking for pictures of NASA Mission Control, and didn't see anything like that there, only much smaller printing.</p>
      <p>That the machine was from Toshiba, however, is <em>very</em> useful information; at least a web search might turn up more images of the same kind of print, even if the font has no name.</p>
