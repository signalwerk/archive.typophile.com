    html: <p>As Darrel mentions most people buy stamps to post something without considering the look of them.  <br> <br>I saw an interesting product in the post office for invitations, weddings etc where you added a picture of your own choosing to the stamp (unfortunately I didn't read the details of how/how much). And there was the series with stickers to create Mr Potato Head stamps.  <br> <br>Since speciality stamps are released as a group, are relatively short print run and rarely kept (except by collectors) you might have trouble persuading anyone to buy all the seasons at once, maybe you could produce a set of stamps, 1 for each price, for each season to be rolled out over a year </p>
