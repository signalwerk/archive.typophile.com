  html: <p>it's a RSA project im working on at the moment,the brief is aiming at design a set of stamps appeal to the younger group and im designing four stamps which stands for the spring,summer,autumn,winter. <br> <br> ive asked several ppl b4 about their visions of what the four seasons r like, but when i talked 2 my tutor today, he said i need to have the reason for doing the four seasons' stamps,like what kinds of stamps would make ppl want to buy in spring etc. <br> <br> so my question now is if there are four seasons' stamps, what images will make you wanna by them? <br> <br> im really struggled now,help help!!&gt;_&lt;</p>
