    html: "<p>here ive got the brief: <br> <br>brief: <br> <br>design a set of stamps that responds to the appeal for a more contemporary, forward-looking approach in stamp subject and design. The aim is to give the stamps an immediacy and relevence and that will attract a new and younger audience. The choice of subject is you wish to represent is open: it can be global or national, specific or general, it can have a purpose(e.g. awareness-raising) or make a current/topical events or interest(e.g. a celebration). The choice of subject is yours but the treatment and execution should demonstrate a fresh approach. <br> <br>market: <br>-a stamp is a receipt for a service and is available to anyone within the UK wish to use the postal service. <br> <br>-bear in mind the public look to the Royal Mail to mark in time significant occassions, events etc. <br> <br>-this service covers the globe and therefore the stamp is an ambassador for the UK when travelling to overseas destinations. <br> <br>-a new and younger generation of stamp collector</p>"
