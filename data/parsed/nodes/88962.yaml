      <p>Ah, glad the title was cleared up.</p>
      <p>Hmmm... I haven't been in this biz long enough to know if Emigré has been parsimonious with their licensing terms in the past - but unless I'm mistaken, this is the first "name" font maker that's shipping EOT and WOFF files for self-hosting, flat-out, no strings attached.<br>
      (There's the fontfonts thing but don't you have to host with Typekit or something for that... gotta go check.)</p>
      <p>I might just spend a few bucks and see the quality of what I get.</p>
      <p>Anybody know of anybody else licensing like this, except the vendors at Fontspring?</p>
