      <p>I think the headline was really remarking on the transition from <a href="http://imprint.printmag.com/design-thinking/the-future-of-web-fonts-is-sooner-than-it-used-to-be/" rel="nofollow">this</a>... </p>
      <p>"Listening to the Web Fonts panel discussion seemed like I could have been at a conference for musicians and composers in which a panel from Napster was telling us how exciting it was now that they could make all of our music available for free! Every time they said web fonts, I kept hearing “free font.""</p>
      <p>Jeff Keedy in August 2010 at TypeCon</p>
      <p>to <a href="http://www.emigre.com/WebFonts/Keedy" rel="nofollow">this</a>... </p>
      <p>"Keedy Web Fonts starting at $39" </p>
      <p>$39 seems steep for a "free font" ;-)</p>
      <p>Although he's just one of many designers represented by Emigre.</p>
