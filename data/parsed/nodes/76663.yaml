    html: |-
      <p>Simple kern tables? In Fontlab?</p>
      <p>I have never been able to make basic kern tables work for r-t-l fonts in any version of InDesign. The only way I was successful was with VOLT. (I suppose it can be done now with AFDKO, but I haven't done any OT work in a while.)</p>
      <p>You need more advanced GPOS tables than what Fontlab produces (but like I mentioned before I don't remember the details). The GPOS table used four values rather than a single kern value...</p>
