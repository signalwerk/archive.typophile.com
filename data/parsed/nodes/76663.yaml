    votes: null
    html: <p>r-t-l kerning is a little tricky. You can't just adjust the kern values like you would in l-t-r languages. You need to adjust both the position and kerning values (and  IIRC it does not really display correctly in VOLT). I don't remember the details and I don't have VOLT with me to check and remind myself how it was done.</p>
  - id: 441119
    user: 27488
    date: 2010-11-24T09:24:00
    date_raw: 24 Nov 2010 — 9:24am
    votes: null
    html: |-
      <p>Actually, it seems like an ID CS5 bug. It works perfect in CS4, CS3. ID gets it all wrong when it needs to display RTL kerned glyphs, while Illustrator does it just fine.</p>
      <p>A bug report is cooking. Thanks anyway.</p>
