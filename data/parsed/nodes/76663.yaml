    <p>I generated a font with just one kerning pair of -60.<br>
    The font appeears in InDesign CS5 ME with no kerning visible but the kern values in the menu appear in brackets (-60).</p>
    <p>Fontlab 5.04 build 2741</p>
    <p>In the prefernces, Generating Open Type... Kerning:<br>
    Expand class kerning while building [kern] table.</p>
    <p>InDesign CS5 ME</p>
