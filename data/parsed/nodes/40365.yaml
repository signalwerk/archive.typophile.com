    <p>I <a class="freelinking-external" href="http://www.typophile.com/node/36151">posted here</a> when my blog, <a class="freelinking-external" href="http://www.villatype.blogspot.com">http://www.villatype.blogspot.com</a> was just getting underway. It has since become a rich forum for discussing found type and lettering. I invite you to take a look through the posts and possibly become contributors (I am particularly looking for contributors outside of my place of residence, Toronto, to broaden the spectrum). </p>
    <p>Now that the holidays are coming to an end, I will be adding more and more content daily and working on some of the villatype projects.</p>
