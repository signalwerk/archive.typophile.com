      <p>OK, I have some stuff - but sorry, I’m in TO too. </p>
      <p>Here’s something you can (and should) hunt for in the mean time. In Union Station in the VIA arrivals corridors as you would be leaving the trains, there are hand panted signs, quite possibly dating from 1919, that say “To City” with lovely long arrows underneath. Should be got before they do too much damage with the renovations.</p>
      <p>-=®=-</p>
