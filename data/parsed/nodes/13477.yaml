    <p>If you’re around NYC during late July, take this in:</p>
    <p><a href="http://www.tdc.org/events/2005events/2005tdc51cooperunion.html"><strong>TDC51 and TDC2 2005 Exhibitions</strong></a></p>
    <p>Venue :<br>
    The Cooper Union<br>
    Arthur A. Houghton, Jr. Gallery<br>
    7 East 7th Street (at Third Avenue)<br>
    New York City </p>
    <p>Exhibition Dates and Times:<br>
    The exhibition will be on display from Friday 15 July through Thursday 28 July<br>
    The gallery will be open Monday–Friday 9–6pm<br>
    Closed Saturdays, Sundays and holidays.</p>
