      <p>Same basis, although not absolutely faithful to the original...</p>
      <p><a href="http://www.myfonts.com/fonts/nicksfonts/new-boston-wbw/medium/glyphs.html" title="http://www.myfonts.com/fonts/nicksfonts/new-boston-wbw/medium/glyphs.html">http://www.myfonts.com/fonts/nicksfonts/new-boston-wbw/medium/glyphs.html</a></p>
      <p>FYI, the style itself is Italian; Two-Line Great Primer is the particular body size of the sample shown. “Italian” as a style dates from the early nineteenth century, when foundries typically offered a limited range of styles, and is curiously distinguished by its horizontal stress, rather than the vertical stress found in a truly Italian type such as Bodoni.</p>
