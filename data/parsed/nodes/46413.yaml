  html: |-
    <p>Today I got this reaaalllllyyy crazy fun graphic design commish. The project is a complete graphic overhaul of a tropical supermarket. And this place is reaaallllyyy funky cool. </p>
    <p>The supermarket shelves are stocked with all the usual products you'd expect to see coming from the tropics with one very cool exception.</p>
    <p>Isles are stocked with flour, rice, bulk stuff like that. Then come isles of canned goods like vegetables, beans, etc.. And then the very next isles are stocked with, fake hair. Yep, hair! Black hair, brown hair, tan hair, red hair - long hair, short hair, curly hair, - all sorts of hair!!! And the next isles have all the products to groom and shape the hair! What a store!</p>
    <p>What type is associated with the tropics? </p>
    <p>Thx.</p>
