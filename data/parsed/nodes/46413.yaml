      <p>Alesasandro, hi there. I'll post some shots in a couple of days. The store front windows are plastered floor to ceiling with dozens and dozens of head shots. Fashion photos of which have all faded.</p>
      <p>Nick, thanks for the link. It gives me an idea of what's been used. </p>
      <p>James, I hung out there for the entire day. Everybody who came into the store was black and these Canadians preferred to speak in their language of origin, of which I had no idea what they were saying. Very cool stuff indeed.<br>
      I spent my time gawking at produce, looking at lables and soaking up colour palettes of earth tones with vibrant hues of green, yellow, orange, red, and blue ...and of course all that hair!!</p>
