  html: |-
    <p>‘Sendai’ is a new 6-weight typeface family, designed by British type designer Philip Kelly.<br>
    The typeface is comfortable in text usage with the slightly condensed shapes that help save space and also achieve punchy display headlines. The restrained serifs are a nod to the Latin styles of the past. The fonts are available exclusively from Philip Kelly Digital Design directly. The fonts are supplied in OpenType Postscript format which is Mac and Windows compatible. PDF Brochure available via: <a href="mailto:pkdigital@pkfont.co.uk">pkdigital@pkfont.co.uk</a></p>
