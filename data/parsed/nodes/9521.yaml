    html: <p>Some similarities to Cheltenham (the spur on the A, for example), but other details are off. <br> <br><a href="http://www.myfonts.com/fonts/bitstream/cheltenham/bold/testdrive.html?s=T+H+E+++U+N+A+P+P+R+O+A+C+H+A+B++L+E&amp;p=24" target="_blank">http://www.myfonts.com/fonts/bitstream/cheltenham/bold/testdrive.html?s=T+H+E+++U+N+A+P+P+R+O+A+C+H+A+B++L+E&amp;p=24</a> <br> <br>"Motor Cycles" may be a different font, or a display variant -- note the double serifs on the C, which aren't in the bolder "unapproachable" setting.</p>
