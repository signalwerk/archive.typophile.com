    html: <p>It does resemble Cheltenham, but as you noted there are some differences, such as the R, and the serifs are not quite right (but close). <br> <br>This sems like a good exercise for the McGrew book or the Encyclopaedia of Type Faces (Jaspert, et al). Was this ad in the US or UK? (Guessing the latter)</p>
