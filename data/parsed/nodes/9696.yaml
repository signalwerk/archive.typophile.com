    html: <p>The FontLab one is TransType (and TransType Pro, which can convert to/from Opentype). I used Crossfont for about 5 years in my workflow and it's good (and at $45 I can't see why anyone would think it was overpriced), although I've just changed over to TransType Pro (for the Opentype features). <br> <br>It's never a simple, foolproof matter whichever one you use. I still wouldn't let anything go to print without checking it on my Mac laptop (my main machine is a PC). You can get fonts not appearing because of cross-platform naming issues, glyphs substituted because of encoding problems, etc. etc. <br> <br>Robert</p>
