  html: <p>I would like to convert some Mac fonts I have to PC.   <br> <br>Two pieces of (PC) software I've found are Crossfont and Transtype, neither of which seem cheap for the simple task they perform.  <br> <br>Any experiences with this?  Any other suggestions for software?  Preferences? <br> <br>Thanks!</p>
