    html: <p>I am a student and this was the first attempt at a font.  The baseline shift on the L and J is intentional.  I think because the detail is not here that it does feel like it doesn't work. The consistency not being the same is also intentional.  I agree on your comment about the one looking off I will work on that.  I will also be posting larger views of the font so the detail can be seen and it may make more sense. <br> <br>thanks</p>
