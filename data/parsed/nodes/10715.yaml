    html: "<p>My general feeling about it is that it's too restrained. On the other hand, I don't know what effect a router has on wood, so I don't know how faithful a rendering this is. A few specific responses, though: <br> <br>1. The widths aren't quite consistent. The B, H, and X should be wider; the S should be narrower. <br> <br>2. It looks like the J and L baselines are lower than the rest. I wouldn't mind if the font overall had more wildness, but if you're going to keep going this direction, I think the baselines should pretty much line up. <br> <br>3. The 1 looks off compared to the rest of the numerals, plus I think it should be distinguished more from the I. <br> <br>4. I appreciate the variation in the punctuation, but again, that seems more indicative of a less-restrained font. I think you either need to make them more consistent both with each other and the rest of the font, or you need to let the other characters in the font have more individuality. <br> <br>5. If you plan on releasing this, you should start thinking about another name for it; House already has a font called <a href=\"http://houseind.com/house.php?kit=GENCOL-FO&amp;sub=view\">Treehouse</a>.</p>"
