      <p>I drew Rezident quite some time ago (more than 12 years in fact) for the design of an identity. Initially I only drew the boldest weight (Rezident Four) as this sufficed for the job. That weight has a much higher contrast and is the most “legible” in my opinion. It was also only this version that I submitted in 1999 to the Linotype 3rd International Type Design Contest where it won a silver award.</p>
      <p>When Linotype wanted to release the typeface in 2000 I decided to add a number of extra weights. Being a big fan of Zuzana Licko’s Senator I decided that the lightest weight should also have a very low contrast. In hindsight I regret this decision because I feel this cut makes too many compromises and tries to maintain features that only work well in a heavier weight.</p>
      <p>That being said, I think Nick’s suggestion comes pretty close. I would fix the thin part in the middle though, and apply the same solution to the R. See picture below...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rezidentone_4312.png"></div><p></p>
