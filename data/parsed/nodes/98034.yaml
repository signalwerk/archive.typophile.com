      <p>The arrangement I created, detailed in this thread about <a class="freelinking external" href="http://typophile.com/node/97784#comment-529418" rel="nofollow">Font Family Naming in FontLab</a> is organised according to the number field in FontLab, so that the weights/styles appear in the font menu with the lightest (Hairline) at the top and the heaviest (Black) at the bottom. The weights were given the following numbers in FontLab:</p>
      <p>Hairline (&amp; Oblique variant): 150<br>
      Thin (&amp; Oblique variant): 250<br>
      Light (&amp; Oblique variant): 350<br>
      Regular (&amp; Oblique variant): 400<br>
      Semibold (&amp; Oblique variant): 500<br>
      Bold (&amp; Oblique variant): 600<br>
      Black (&amp; Oblique variant): 700</p>
      <p>Whereas the others flow down the list with the normal version followed by the oblique variant, the Regular and Oblique combination are reversed as I did not name it "RegularOblique" but just "Oblique", which makes me think that this part of the naming conventions would be the second level of hierarchy for CS.</p>
