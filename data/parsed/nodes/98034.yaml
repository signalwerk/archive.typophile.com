    <p>I am getting results sorted by weight, so I will have:</p>
    <p>Light Extended<br>
    Light Normal<br>
    Light Condensed<br>
    Regular Extended<br>
    Regular Normal<br>
    Regular Condensed</p>
    <p>Some customers don't care for this and would prefer:</p>
    <p>Light Condensed<br>
    Light Extended<br>
    Light Normal</p>
    <p>Regular Extended<br>
    Regular Normal<br>
    Regular Condensed</p>
    <p>The HelveticaNeue OT Style names are prefixed with number. Is this what it takes for a 36 member family?</p>
