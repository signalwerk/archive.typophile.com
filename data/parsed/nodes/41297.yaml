    <p>Jos Buivenga was born in 1965. He lives in Arnhem (the Netherlands) and works as a type designer. His first love for typography started to take shape at the AKA (Academy of Arts Arnhem), where he studied from 1984 - 1988. In 2004 he founded <a class="freelinking external link-external" href="http://www.josbuivenga.demon.nl/" rel="nofollow">exljbris Font Foundry</a>.</p>
