    <p>Why must we be seeing more and more Arial in big-budget advertising and promotion? I see it more and more, and every time I do, a part of me dies. In some instances its small-time studios who don’t know better so I lay off a bit, but in many cases with big-budget studios like New Line Cinema doing this example of "Pride and Glory" I just don’t get why the desecration?</p>
