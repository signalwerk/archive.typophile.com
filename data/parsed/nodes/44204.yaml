      <p>James, it just suggests poor craftsmanship (IMHO). There is nothing especially elitist or pretentious about not liking Arial. Sure, there could be a good case for using it sometimes, but generally that reason is that it's a bundled typeface that starts with "A".  When I was a welder, I used to get a little snotting (in the nicest way of course) about other welders who couldn't weld a straight and even bead, or warped the piece they were working on. As a Screen printer I got a little snotty about sloppy registration, bad colour matches, improper squeegee pressure and so on. As a craftsman myself, I would rather be challenged to do a better job than be given a little slack for not trying very hard. </p>
      <p>-=®=-</p>
