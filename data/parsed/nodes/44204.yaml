      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TheStrand_3595.jpg"></div><p></p>
      <p>Someone once made a case that The Strand bookstore in NYC made a strong anti-design statement with Arial. In that case I was willing to be convinced. But not in this case.</p>
      <p>Arial is a like margarine. No self respecting chef cooks with it even though it's widely accepted everywhere else. Arial is not just an evolution of Helvetica the way Helvetica is an evolution of Akzidenz. Arial is a sloppy copy of Helvetica, a poor counterfeit that has fooled a generation of PC users.</p>
