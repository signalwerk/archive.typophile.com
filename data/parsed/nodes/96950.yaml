    <p>Hey, </p>
    <p>I'm working on a logo for a pop duo band - "Mary and Liv." I was planning on putting "Liv" in Shelby because I love the "L" of that typeface but not so much the "M." I'm not asking you to design this logo for me at all, just looking to see if anyone had a typeface recommendation. :)</p>
