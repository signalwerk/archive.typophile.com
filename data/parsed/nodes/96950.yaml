    html: <p>The “hipster traditional” logo style often uses these kind of scripts paired with square or narrow grotesques (Trade Gothic, Knockout etc) or wide slab serifs (Hellenic Wide) center-aligned. In any case, blending in should rarely be the goal when designing a logotype.</p>
