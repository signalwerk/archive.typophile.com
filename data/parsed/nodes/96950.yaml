  - id: 527686
    user: 200288
    date: 2012-10-24T18:25:00
    date_raw: 24 Oct 2012 — 6:25pm
    votes: null
    html: <p>Thanks for your suggestions Frank! I don't want them to blend, I'm just trying update their logo which is currently in Wisdom Script. I've seen it used well a lot but as a logo, it's slant makes it difficult to incorporate into different designs. That's why I wanted to use the Shelby font and find a slab serif that went with it well. I just wasn't finding anything that had a good "M." That's why I was looking for you guys' suggestions. I checked out the Hellenic Wide etc, those are cool but I think the band will want something still a little bit more cosmopolitan and girly. I really appreciate your suggestions though! I'm still on the hunt! :)</p>
