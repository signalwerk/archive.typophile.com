    html: |-
      <p>I used to use the <a href="http://www.chicagomanualofstyle.org/about.html" target="new" rel="nofollow">Chicago Manual of Style</a> for teaching about proper usage of footnote symbols, section/double section marks, daggers, double daggers, &amp;c.</p>
      <p>You might want to try finding one the your local library, as I had a much older version and don't know if they deleted all the good 'ol stuff (I doubt they did).</p>
