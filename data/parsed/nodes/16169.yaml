  html: |-
    <p>I'm looking for a good reference book on almost forgotten and/or no longer used symbols (ex: ¤, §, †, ‡, etc.)</p>
    <p>Not that I don't know anything about these, but I'm doing a bit of typographic education for non-typophile friends/collegues that want to know the origin and use of special symbols.</p>
    <p>Any suggestions ?</p>
