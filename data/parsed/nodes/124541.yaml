  html: |-
    <p>Hello everyone, I would like to bring to your attention an issue with which I'm up against because of my inexperience.<br>
    I have to create a logo in Glypha with the word "Tarbord". Now, I do not know how to treat the letters and whether kerning is something that is usually used in cases like this, or is believed to be something wrong because it goes to modify the original values created by the designer. Setting the optical kerning seems to me that the result is better than setting autokerning but I read that this procedure is not recommended and that it is preferable to set the kerning manually. I'm working with a text size of 100 points. What values do you think are the best to get a satisfactory result?<br>
    Thanks a lot.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Tarboard.jpg" width="1031" height="454" alt="">
