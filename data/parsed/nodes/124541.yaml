    html: |-
      <p>It sometimes helps to look at the word three letters at a time. So looking at TAR, doesn't the A look too far away from the R? And with the ORD, Doesn't the R look too far from the D?<br>
      Of course, with a logo you can alter the letter forms too. In this case particularly you could change the length of the serifs, which could alter the effects of proximity too.</p>
