    <p>Hello,</p>
    <p>Does anyone know what I have done wrong when the preview of the font doesnt show up in Word font menues?</p>
    <p>The name is there and everything works fine with the font, but in the font menu the name of the font is written with Arial (or something else).<br>
    It is an OpenType PS font that is generated exactly the same as other fonts that Do have previews. The origin has been a Postscript font that I no have convertet into OpenType PS-format.</p>
    <p>Thanks</p>
    <p>/ G</p>
