    html: |-
      <p>I really like all three of these. The first is clearly the best, and if you *must* abandon one of them, abandon the third -- it's the most traditional. I think you have some interesting fonts here that could work together well, with maybe #2 or #3 as body text and #1 or #2 as headline and subheadline text. </p>
      <p>The top of the lowercase s in the first version should be at an angle matching that of the other bowl-top characters e, o, c, etc. Fixing that will remove most of the jumpiness. </p>
      <p>I agree with DanGayle about the u. Bringing the left side of the bowl of the u and the y to end a bit higher will also improve jumpiness. </p>
      <p>I like the uppercase that you have in the sample. Keep going in that direction.  Preserve the angle from the lowercase.  You might add a second, narrow vertical stroke to the left-hand vertical strokes in each uppercase letter, as is often done in blackletter text.  If you do it subtly enough (make it as thin as the horizontals) it will blend in and look natural, and even out the color of the uppercase, without being intrusive. </p>
      <p>-matt</p>
