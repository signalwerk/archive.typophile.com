    <p>Hi guys,<br>
    I'm working on this face and font for my senior project. I am using Modern and Blackletter influences. I can't decide which to continue to develop.</p>
    <p>#1 is the original. It's really jumpy, and would only work as display.<br>
    #2 is not as jumpy, but looks simple and not detailed.<br>
    #3 looks more sophisticated to me, and is way more legible. </p>
    <p>What do you think? Which has the most promise?</p>
    <p>And also, if you think of any similar faces, please inform me. I don't want it to look too much like someone else's work.</p>
    <p>Thank you,<br>
    Terrance</p><div class="imageWrap"><img src="http://typophile.com/files/famished_5396.jpg"></div><p></p>
