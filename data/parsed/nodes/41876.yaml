    html: |-
      <p>I have added 2 new images, the untitled jpegs, which feature some changes we have discussed, including a new lowercase g, s, and z, optical adjustments, and the nearly finished uppercase.</p>
      <p>I was reading in Karen Cheng's Designing Type, that the uppercase stems should be heavier than the lowercase counterparts. I tried this in the current sample, but I think it is too thick, or I need to increase the stroke weight on the bowls. I'm not sure about the N or M. Traditional constructions didn't look quite right, so I kept the construction of the lowercase n and m.</p>
      <p>I am feeling more confident and comfortable in my direction now.</p>
      <p>What do you guys think?</p>
