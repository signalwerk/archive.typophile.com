      <p>I like the first and second ones. They seem more calligraphically informed. And, believe it or not, I think the first one is the better one. It seems more natural than the other two. The curved strokes give it a little humanity, I suppose. That's why I don't like the third as much. Too mechanical.</p>
      <p>Perhaps emphasizing the <a href="/wiki/rotunda" class="freelinking" rel="nofollow">rotunda</a> influence a little more will make the jumpiness work for you, instead of against you.</p>
      <p>Use the f, a, and d from #2 with the rest of #1 and I think you're on your way.</p>
      <p>Also, watch the weight of the first a and e compared to the second and third sets. The stroke is heavier, in a good way, in the first.</p>
