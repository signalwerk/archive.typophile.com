      <p>The k is perfect. And I like the smaller eye of the original e.</p>
      <p>The u seems a little wonky. It really makes things seem jumpy. I would make it more like the n, which is very nicely done, making the x-height more stable.</p>
      <p>I would also say that the v and x work fine. I don't know about the y and g, and I can't seem to see a z.</p>
      <p>Remember to think about the stroke. Everything should match up to what you can physically draw with a wide-nib pen if you want it more natural. That should help you troubleshoot problem areas.</p>
