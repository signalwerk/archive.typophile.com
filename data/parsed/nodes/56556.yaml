      <p>Type design and typography are different things. I'm a type designer, but I don't draw typefaces all day, there is too much other business to take care of (not to mention hanging out at Typophile).</p>
      <p>There's not much of a future in print typography, although on any given day it's always possible for anybody to find their niche anywhere. There's plenty of opportunity to be a typographer online, but the skill set is quite different than for print. If you want to make type look good in digital media, you need to be able to animate it in applications like Fireworks, Flash and After Effects. </p>
      <p>Consider the typography here--heads that use sIFR, Font Bureau's animated banner ad, and the coding of the text you're reading now. That's typography today.</p>
