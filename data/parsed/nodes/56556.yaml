      <p><strong>Definitely</strong> tracking this one. Great question. Here is my working operational definition of what I consider to be future typographers (sentence structure still needs a little work):</p>
      <p><em>"One who strives to set text to make it easier to read as supported by research in the domains of reading comprehension and cognitive psychology, as well as empirical data."</em></p>
      <p>Currently, doing this would categorize you as a "research scientist."</p>
      <p>If what you do is set text according to convention, I would define that as a "type setter."</p>
      <p>If, for the sake of argument, we accept this operational definition of typographer, then I see a future in: </p>
      <p>a) academia, conducting laboratory research funded by grant monies, or</p>
      <p>b) research and development for large corporations, or as a consultant. Your role will be to either conduct experiments designed to support or refute hypotheses, or prowl the databases and journals, keeping up to date, and finding relevant research to your context. You will then need to translate them into plain language so that your colleagues can understand and apply this knowledge. You will probably need good writing skills for this.</p>
      <p>Long/short, memorize typographic conventions and then learn scientific method, experimental design, psych 2000, stats and some basic writing.</p>
      <p>More to come…</p>
