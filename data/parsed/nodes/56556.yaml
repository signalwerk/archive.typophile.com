      <p>Well, it is still not a bad idea to inform oneself about good practices for book typography, whether or not you think books shall soon disappear. To be able to set a mass of text in a way that keeps a reader engaged for a spell: you learn that best from books. Try a novel that needs only a half dozen style sheets. Then try some poems from a writer who demands some patience from the typesetter/compositor. Eventually try something like that damned book I had to design that ended up with 70 style sheets despite my pleas to the editors to re-work the text.</p>
      <p>When I teach typography, no one in the class wishes to be a book designer, and I'm under no delusions that any shall end up as such. But I do tell them that if I can help them how to figure out how to design and then to set a line, a para, a page, a chapter, then they'll be better equipped to set that stunning one-word ad or billboard or web banner. But if they take type from an instructor who doesn't set them to work on long text, the billboard and ad work will not be so easily understood. That may be bullshit, I don't know.</p>
      <p>I call myself a "typographer." Yes, it may be obscure; that's fine. It means I try to figure out how type should look, and then work with others who will set it. I've been a "compositor" back when it was the accepted term for what I did with metal type; and a "typesetter"; and a "book designer." </p>
      <p>powers</p>
