      <p>While I mostly agree with Nick, I think he's being a bit grimm about the future of print typography. Books will not disappear, or at least not in the near future. Not untill there is an acceptable (digital) alternative for them. But it's obviously true that digital media play a very important -- and ever increasing -- role. </p>
      <p>But yes, typesetting (or better yet, designing) books is a job. But being a graphic designer who specializes in type sounds like a much better description. That's basically what I try to do.</p>
      <p>I design typefaces on the side, basically. I don't do that all day when I'm working on a typeface, but sometimes time does fly when you do. :)</p>
