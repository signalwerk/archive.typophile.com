      <p>My recent experience with the local book publishing industry was not good. I was a book designer (here in Oz), and book typesetting was the main part of my income, while the creative bits were more like icing on the cake. Nice to have, but cannot live on it.</p>
      <p>Some years ago, the main customers started sending the typesetting work elsewhere, for about one-tenth of the price, while still requesting the templates and the design work at reduced prices. So, the better the design and the templates were, the easier it was for the other people to finish the job and get paid for it. Still, numerous emails kept coming requesting clarification/instruction about styles, baseline grids use, headings spacing adjustments, etc.</p>
      <p>Teaching your competitors (without compensation) how to do your job is stupid. Thanks providence for type design.</p>
