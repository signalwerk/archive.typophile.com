      <p>Ah, books.</p>
      <p>As a typesetter -- those of us with airs like to call ourselves compositors -- I've thought about the future.</p>
      <p>No one knows what will happen of course, but here is my best guess. Even though more books are manufactured, and more people are reading books than 20 years ago, I think the nature of them has changed, particularly in the design &amp; manufacturing area.</p>
      <p>I'd offer this site as anecdotal (in both sense of the term) evidence. Type designers are trying to control more and more of the behavior of type, something that was traditionally left to the compositor. Often this is a good thing, occasionally not. Type has become a computer program, and as is generally true, all too often programmers are not all that well versed in the range of uses to that employ their programs. </p>
      <p>As to making a career of it:</p>
      <p>Composition prices have dropped, rather dramatically. In 1985, we charged about $8.50 a page for straight text, with endnotes but no footnotes. Of that, $2.25 was for keying and proofing, so without keyboarding &amp; proofing, the price would have been about $6.25. But the price per page today is about $4.75.</p>
      <p>Aside from composition, a typical design fee for the interior-only of a scholarly monograph in 1985 was about $350-$400. It is about twice that today. A jacket design has also gone from about $350 to about $750 to $800.</p>
      <p>The prices charged can range on upward in the New York publishing world. Less freedom there for a designer usually, and more time pressure on a compositor.</p>
      <p>* * *</p>
      <p>As I remember in 1985, a new Chrysler cost about $12,000, and I bought a house, 1,600 square feet, 3/4 acre lot, reasonable part of town, for $55,000. Yes Virginia, there is inflation.</p>
      <p>Machines have gotten tremendously faster of course. But all that means is today you use WYSIWYG; in the old days, we'd run things via batch processing, sometimes in background, sometimes while we ate &amp; slept.</p>
      <p>There is no photo chemestry or photographic paper, a significant expense. There are other differences, so<br>
      it is hard to compare costs &amp; prices from 1985 and 2009 directly. </p>
      <p>BTW, there is always composition from countries other than the States or Europe, putting pressure on prices.</p>
      <p>* * *</p>
      <p>My feeling is there is less time today for niceties, only some of which can be made up by software such as OpenType. The market that will pay rather well for such niceties is quite small, and tends towards books more in the fine print genre. Many of those are not set &amp; printed digitally, requiring an entirely different set of skills.</p>
      <p>So composition is being driven by price. On bad days, I've been known to mutter that scholarly publishing has become just another branch of ephemeral printing, and there is some truth to that.</p>
      <p>As to books and graphic design, leave that to the jacket. A book interior usually should not be an exercise in graphic design. I don't know if he said it in <cite>On Book Design</cite> but Rich Hendel has remarked more than once that the best interior designers come from compositors, especially those who read.</p>
      <p>You can always find a niche and make a living at it. You have to be very good to survive in that niche, but that is part of the fun of it. You also get to skip the modern equivalent of spending your life working with "New, "Improved, Whiter than White!"</p>
      <p>* * *</p>
      <p>There is an old joke: the best way to make a small fortune in publishing is to start with a large one. It wouldn't be funny if there wasn't more than a kernel of truth there.</p>
      <p>Good luck whichever way you go.</p>
