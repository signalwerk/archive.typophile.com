    <p>I’m a graphic design student who has in the last year and a half fallen in love with typography. I guess I never understood how much was really going on there before but I digress. I seem to be the only one at my school obsessed with type and trying to learn everything I can about it. My question is, what can I do with this as a career? I know somebody is going to say, “be a typographer” but what does that mean? Do you really draw typefaces all day?</p>
    <p>I’m very much interested in learning more about how one sets an entire book but is that a job? Or is it more along the lines of you’ll be a graphic designer who specializes in type so you’ll get more work doing book covers and whatnot? I know this is a sophomoric question but you guys seem to be a different species then most of the graphic designers I meet and I want to know what you do, thanks!</p>
