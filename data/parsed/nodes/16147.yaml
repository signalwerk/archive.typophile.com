      <p>Nick,<br>
      Thanks for taking a peek!</p>
      <p>I didn't want it to be like Futura. I was avoiding the geometric quality. I wanted a more humanist approach but not a revival or even an attempt at an inspiration from another face. I could add monocular alt a and g for those who might want it though. Mostly, I have always wanted a monoline sans that had a Roman feel and that is the impetus I had to begin the project. Futura is too Bau Haus to fit the bill.</p>
      <p>I thought about the cap "I" but when I tried it seriffed, it looked too foreign to the rest of the caps. The lc "L" has hooked exit stroke. Maybe a seriffed cap "I" would get confused with that as well?</p>
      <p>ChrisL</p>
