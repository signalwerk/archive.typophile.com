      <p>I'm still seeing "that was then" Futura in the caps -- the basic proportions, the varying letterwidths in particular. Details like the U kink and subtle off-perpendicular joints don't change that. </p>
      <p>The lower case is more "this is now" with semi-condensed, even-width forms.</p>
      <p>But really, those aren't "era" features, but basic proportions. Renner mixed classic caps with neo lower case, but synthesized them with a corresponding variance of letter-width, and a uniformity of curve shape.</p>
