      <p>This design is very attractive. I think you are on to something very nice with the caps. Really, everything looks good, but I think the direction you started with is very strong and should be honored. </p>
      <p>Lowercase is very nice, but consider matching the lc proportions more to the caps. They can be wider, looser, and still work in small sizes; in fact the additional air might improve readability. Please consider trying out some wider versions of abcdehkmnopqruyz. If this sounds inappropriate or uncomfortable, see Legacy Sans lowercase. I only suggest it to keep the majestic lapidary feel of the caps throughout. Right now, the lc looks like a different design than the caps. </p>
      <p>I think that your r is suffering from too much attention. I agree with Dan, it is too narrow. The issue of ambiguity will never go away completely, not in a clean, lapidary sans like this. See the r of Skia for an idea. It needs to have more width to be recognizable in text. if ri combos are bothersome, consider removing the spur from the i (and j). This convention from "info sans" designs seems foreign and mundane in such a stately design. i already has a dot keeping it unambiguous, and your l is differentiated, so maybe the ri combo problems are just a mirage. Try it with a simplified i and r. A ti ligature isn't a good enough reason to keep a feature that is interfering with basic combinations. </p>
      <p>I think your digital sign mock-up is a good illustration of the potential for this design. I want some of this for my house numbers! It's a very pleasing, open, architectural look and I think it is possible to carry that through into the lowercase. See Stellar, Legacy Sans, and Metro for some alternative approaches. Bo Berndal tried something similar with Naniara a while back; see if he solved any of the problems you are facing now. </p>
      <p>I like your U a lot too. It does seem a smidge pointy; maybe the lower right join could be brought up just a hair, making the angle less sharp. I would then try to soften the same feature of G. That area looks so square in the context of the rest of the caps. </p>
      <p>I think if you re-shape the f and j hooks to be more like arches, they will harmonize better. I know you've built a lot of ligatures already, but I find these 2 letters don't fit as well. j, f, r, and even t look a little like they are being starved. The caps and other lc are so graceful and open; keep this throughout. </p>
      <p>All my comments are intended to help you eliminate inappropriate or stiff features, because I think the caps are so beautiful and strong, it's a very worthwhile direction to follow. I think it's got great potential. Getting the lc might be difficult, but I know you are not looking for something easy, or else you would be playing Nintendo. I don't know if anyone has done a lapidary sans with such stately caps, and matched it well with lowercase. Be the first! </p>
      <p>Very exciting work! Please keep us posted.</p>
    html_clean: |-
