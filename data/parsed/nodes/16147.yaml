      <p>I am posting a GIF file comparing several light sans faces in caps and lc. "Now" and Futura are in black while the rest are grey. I am looking at not only proportions, but how geometric (or not) the faces are. I threw in Trajan as a comparison to classical and Dax as straight out contemporary sans.<br>
      Nick is right about the likeness of the curves holding Futura together. Futura's proportions are by far the most extreme--even more so than Trajan. I do feel that what makes the curves hold as family is their geometric nature though. Now that I look at the "M" I made for "Now", it does look a lot like the Futura "M" as noted by Nick.<br>
      "Now" does appear to be closer to classical Roman titles to me than Futura does though.  That is not by any means a fault in Futura. It is perfect the way that it is.  I am just noting the comparison as a non-qualitative observation.<br>
      At any rate, take a look and see what you all see in the comparison without my bias :-)</p>
      <p>ChrisL<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123031946im_/http://typophile.com/files/compare_Now.gif"></div><p></p>
