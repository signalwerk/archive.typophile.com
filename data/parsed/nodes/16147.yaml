    <p>"Now" is the "other" face I have been working on since Typecon (I alluded to it in my posting of "Align")<br>
    I started it with the capitals, trying to achieve classical Roman proportions in a light monoline sans serif. I then did the small caps since I like to use caps and small caps together in heads and subheads. The caps, with or without small caps, might be usable as inscriptions when used alone but my intention from the start was for the lower case to be a text face. The proportions of the lowercase follow Roman as well.<br>
    For Now, I have only done the Light weight.  The other weights will follow.<br>
    Below is a quicky GIF and I have also attached a PDF showing text sizes down to 6 point in several languages (English, German, French, Italian, Czech, and Polish.)<br>
    OTF features include ligs, small caps, oldstyle figures, and fractions built from the nom/denom.<br>
    The Now name and Time concept come out of the use of classical proportions in the context of present-day sans serif.</p>
    <p>Please let me know what you think.</p>
    <p>ChrisL<br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123031946im_/http://typophile.com/files/Now-sansoftime.gif"></div><p></p>
    <p>I have posted version Latvian text . See bottom PDF:</p>
