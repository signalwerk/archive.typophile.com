    html: |-
      <p>Chris,</p>
      <p>I think your new face is coming along very nicely. The overall look and spacing is looking good. The only suggestions I can think of making have to do with picky details.</p>
      <p>I would do the top of the f more like the top of the a. There is something unbalanced about it to my eye. The a doesn't have the problem.</p>
      <p>There are some other terminal strokes that have a similar problem, such as the tail of the y and l.</p>
      <p>The ends of the stroke on the s would look better to me if they were perpendicular to the angle of the stroke, rather than oblique to it. More like the top right of the S. (I would change the bottom of the S in the same way.)</p>
      <p>Overall, there are some inconsistencies in the stroke terminals--some are perpendicular to the stroke angle, some are oblique, some are perpendicular to the baseline. There's nothing wrong with having some variety, but it seems a bit arbitrary to me.</p>
      <p>I can see why you are putting that little bend in the i and j, but I think it will call unnecessary attention to itself at display sizes.</p>
      <p>The absence of the lefthand stroke on the f and t bugs me, but I if you feel it is important to the design, don't change it. Putting the strokes in would make it look more "normal" which may or may not be what you want.</p>
      <p>I think you ti ligature needs the i dot.</p>
      <p>The curves at the bottoms of the l and t need some work. I would try to make them flow more smoothly around the curve.</p>
      <p>All for now. More later if I think of anything else.</p>
