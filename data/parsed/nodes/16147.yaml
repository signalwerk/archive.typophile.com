      <p>Looks good. I'll post again if I think of any other ideas.</p>
      <p><em>I therefore had to redo all my ligs to match.</em></p>
      <p>A general tip: Don't rush to fill your character set. You can save time down the road by putting off the building of glyphs which have identical or similar character parts as late as possible. At first, you may think a certain form is perfect and ready to start building related glyphs, but later you may well have a better idea. If you have replicated the form over many glyphs, it means lots of extra work. It's always a judgement call. I am always tempted to jump ahead to see how things are going to pan out, so I can relate.</p>
