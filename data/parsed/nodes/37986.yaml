    <p>Thanks to Stephen Coles and the numerous requests from the international typophiles Fontshop.com has removed the redirect on their website to a deeper level of the site. So linking to the font won't bug the international users anymore. </p>
    <p>Great work, people, thanks. </p>
    <p>This is what Stewf wrote to <a href="http://www.typografie.info/typoforum/viewtopic.php?p=32551#32551" rel="nofollow">Ralf Hermann</a>:</p>
    <p><em>Ralf, I'm pleased to say we've integrated new FontShop redirection behavior. You can now visit FontShop.com without being redirected until you want to purchase. I hope you like the change.</em></p>
    <p><strong>Yes, we do!</strong></p>
