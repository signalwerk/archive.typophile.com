    votes: null
    html: |-
      <p><cite>It is something that my licensees occasionally ask for.</cite></p>
      <p>They are probably giving you boilerplate from contracts that they use for commissioned work, where indemnities are a common topic to be negotiated. Look up indemnification in the Graphic Artists Guild handbook for more information. </p>
      <p>Some businesses have insane indemnification boilerplate in any contract with creatives because it’s cheaper to do that than to keep getting advice from legal. This is the kind of thing you should have an attorney negotiate for you and buy insurance to cover—and obviously don’t indemnify anyone won’t pay more than the cost of insurance!. Sure your licensees are not likely to be sued, but if some copyright crank goes after the wrong client and you signed a broadly worded contract you could end up in an ugly spot.</p>
