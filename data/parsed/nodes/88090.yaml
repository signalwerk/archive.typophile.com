    html: |-
      <p>That doesn’t make sense. A EULA is there to define what rights are reserved by the foundry, and what rights you will get by purchasing a license. The purchaser of the license is only liable for the rights that are transferred to him by the EULA and for all other rights the foundry is liable.</p>
      <p>-Paul</p>
