  html: <p>Do any font licenses offer indemnity against costs incurred in the defense of a claim brought against the licensee by third parties alleging that licensee’s use of the font infringes intellectual property right or other rights?</p>
  html_clean: <p>Do any font licenses offer indemnity against costs incurred in the defense of a claim brought against the licensee by third parties alleging that licensee’s use of the font infringes intellectual property right or other rights?</p>
