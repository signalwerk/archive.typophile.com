      <p>B., thank you for your comments.<br>
      Traditional western musical notation is covered by the unicode “symbols” range from U+1D100 to U+1D1FF:<br>
      unicode.org/charts/PDF/U1D100.pdf</p>
      <p>At the beginning I considered of course using the standard and following the same process of the musical fonts I saw, which use components (noteheads + bars) to obtain the notes. The advantage of this method is *not* to consider the vertical position of the notes (which determines the pitch) in order to let the different musical softwares taking care of it. It is not considered as a technical limitation but as a feature of the encoding because it insures compatibility, since the elements encoded behave as characters (and not as glyphs...)</p>
      <p>But as in our case the need was to work on layout applications (such as InDesign), for internal use and quality publications, this way resulted very complicated and tedious: combine a series of 5-numbers unicodes to obtain the neumes (sometimes quite clumsy in the way the elements join to make what originally is a single sign), use a script to adjust the position of the note on the stave (that has to be drawn separately) and switch font to enter liquescences, rhythmical signs, pauses, keys and anything else...</p>
      <p>We tried instead to experiment a different system with the available font technology, opentype, to find an easy solution, practical and faster to type.  Gregoria includes all the possible combinations at every height (there are 13 heights): the lines of the stave are integrated in every glyphs and spaces.<br>
      All the glyphs and spaces are modular to insure a plain rhythm and a constant line length... instead of thousand of kerning pairs it uses alternates glyphs with different left side-bearings.</p>
      <p>How do you deal with the stave lines or vertical position in your font?</p>
      <p>Thanks,<br>
      Elena</p>
