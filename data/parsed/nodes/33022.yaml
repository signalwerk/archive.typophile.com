      <p>Elena,</p>
      <p>I am using ligatures to map the notes to the different height positions, much like your method. My height characters are different (0-9 covers the standard range, and other characters provide the higher and lower vertical positions), but the idea is the same. ’p’ is a punctum cuadratum, so ligatures 0p, 5p, Ap, etc. map to the punctum at different height values. ’P’ maps to a podatus, and usually uses two height values: 35P, etc. A ’P’ with only one height indicator only places the top of the podatus, which in my font is a little skinnier and a bit more curved underneath.</p>
      <p>Many of the other single height glyphs (oriscus, punctum inclinatum, virga, first symbol of the clivis, etc.) follow the same pattern as the punctum. The porrectus is implemented like the podatus.</p>
      <p>Then all of these can be connected using lines. The lines are specified using two height indicators like the podatus and porrectus, and I’m using kerning to adjust spacing. I was hoping to make the lines automatic using ’calt’s, but I’m pretty new at creating any sort of typefaces, so I’m just trying to get it usable first.</p>
      <p>Originally I was going to use non spacing characters for the staff, and have the neumes be composed of seperate glyphs on top. This would allow for different colored stave lines, but it seemed to be more of a hassle to consistently input glyphs. Besides, different colored stave lines is not really a high priority for me. Right now I just have a few stave line characters of multiple widths. I was originally going to make all the glyphs have consistent widths, but I’d prefer to keep the spacing more fluid if possible. To create consistent line lengths, I was considering using special line terminator glyphs that would be inserted at right-aligned tab marks and overlap with the glyphs before it. But I haven’t finished this much yet.</p>
      <p>But really I’m just doing this because, like John Hudson above, I just like singing and praying with Gregorian chant!</p>
      <p>-B. Matthew</p>
