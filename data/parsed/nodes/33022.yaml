      <p>Hi,<br>
      I’m really astonished to see that someone else is working on this topic. I just published an OpenType font for the neumatic notation, Gregoria, in collaboration with a french Abbey.<br>
      It doesn’t really work with MS Word because it extensively uses contextual alternates (and ligatures of course). I think it’s very difficult to make it work with Word because no standards have been defined for this notation. But as we were also concerned by a wider accessibility than InDesign users, the Abbey is working on a free software to distribute together with the font (Gregorio), which will provide an easier user interface; it’s almost finished.<br>
      Are you also interested to make it work on musical softwares like Finale?</p>
      <p>Ah, Gregoria has *zero* kerning pairs ;-)</p>
