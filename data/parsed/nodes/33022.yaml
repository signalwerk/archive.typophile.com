      <p>As a follow up, here’s what’s going on that was frustrating my kerning attempts. I’m using Windows Vista, MS Office 2007, and InDesign.</p>
      <p>The first problem seemed to be that fonts were getting cached by windows, so kerning changes weren’t showing up in the applications correctly. This thread was what alerted me to it:</p>
      <p><a href="http://www.typophile.com/node/15633" title="http://www.typophile.com/node/15633">http://www.typophile.com/node/15633</a></p>
      <p>I followed the advice to simply change the font name on significant builds, at least while I’m developing. If anybody else has better advice, I’d love to hear it. (BTW, I do have the new WPF font cache service in Vista disabled).</p>
      <p>Otherwise, it seems there was something that by reassigning the language/script settings did the trick (thanks for the tip Sergey). I don’t know if it was a fontforge mistake or my own, but kerning kind of works now (see below).</p>
      <p>I know I said that MS Word 2007 supports ’liga’, but I noticed an interesting thing happening. As I was fixing errors reported by MS Font Validator, the ’liga’s stopped working in Word 2007. It seems that if my font has a double quote glyph (0x22 I believe) the ’liga’s don’t work. If I remove that glyph from the font, the ’liga’s work. Surely there’s something going on underneath the hood (Word interpreting the font as a different script/lang maybe), surely I’m hacking things, but I still found it interesting. If anybody wants two hacked fonts, one that works with ’liga’s in Word 2007 the other not, I can try to reproduce the issue. I don’t know how any of this relates to earlier versions of Word.</p>
      <p>On the other hand, Word doesn’t seem to do the kerning correctly for ’liga’s. It seems to use the kerning information for the first character rather than for the ’liga’ glyph (using the unicode glyph itself works fine, but that kind of defeats the wole purpose of what I’m trying to do anyway). So after all that trying to simply fix kerning, it seems like MS Word support might be unreasonable anyway. I guess I should stop hacking and just make the font right anyway. :-P</p>
      <p>Thanks for all the help/advice. -B. Matthew</p>
