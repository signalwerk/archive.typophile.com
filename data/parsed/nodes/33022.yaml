    <p>I am in the midst of trying to put together my first “font” for notating a medieval style of musical notation called square note notation. My purpose is to be able to notate Gregorian Chant more accurately. The attached PDF gives an idea of how it looks. I am using FontForge.</p>
    <p>This musical notation uses a four line staff. In order to facilitate input of glyphs, I am creating hundreds of liga/ccmp features. The number characters specify the height of the note, and when followed by a note type specifier character, they combine to create the notes at different heights. So far all of this has been a proof of concept, and in InDesign it works pretty well.</p>
    <p>But I would like to make it usable in Microsoft Word. For the most part it works fine, but I can’t get the kerning to work correctly in Word. Specifically, the vertical lines connecting the notes require kerning to move subsequent notes back up to line up to the note (see the notes over “ta-lem” for a specific example. In Word, I just can’t get kerning to work, not by class, not manually. Yes, I’ve enabled kerning in Word itself, I’ve tried generating old style kerning tables, etc.</p>
    <p>My question is this: is this probably something wrong with my font, or does Word not kern by glyph but by character? I’ve tried inserting the unicode glyph characters in directly, and still no kerning, but I’m just wondering if I’m missing something about Microsoft’s kerning support...?</p>
    <p>Thanks for any advice you might have... -phatmatt</p>
