    html: <p>I’m glad to see people working on Gregorian notation fonts. This is something I toyed with a couple of years ago, but I never had time to pursue it. My idea was specifically linked to an input method I was spec’ing which would allow the user to ender a neume type (single punctum, clivis, podatus, etc.) and then use number or cursor keys  to assign the first note to a particular line of the staff. I never got further than making some notes though because of other projects that needed my attention. So I figure I’ll just sing the stuff and someone else can look after the typesetting :)</p>
