      <p>Elena, I might be just as surprised as you! I only knew of the Meinrad fonts (and another one from Germany...by the fellow who created the Night Office recebtly...can’t remember the name of it now). I was very happy to see your font, and I really like the shape of the glyphs.</p>
      <p>I was originally working on a software only project (in C#) that used a GUI to create the notation (I was a software engineer by training, not a typeface designer!). But I realized that a proprietary system to notate it was just not as flexible as utilizing DTP software already. I hadn’t gotten as far as Finale, though Finale integration would make it much more usable I imagine...</p>
      <p>I was hoping to keep Word compatibility enough to not require a seperate tool to notate it. But then again, I am not employing nearly as many neat ’calt’s as you: (e.g., to specify a connecting line requires two height indicators, the start and the end).</p>
      <p>How do your lines connect without any kerning? The puntums have to be pushed back to overlap a little bit, don’t they? Or, now that I am looking at the PDF spec sheet for your font, do you simply not overlap the line with the punctum? Except for the podatus, I don’t see another neume that has an interval of a fifth...</p>
      <p>Thanks for your message... It’s great to see your project. -B. Matthew</p>
