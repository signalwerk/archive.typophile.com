    <p>Friends, Romans, countrymen</p>
    <p>I’m working on a book/catalogue at the moment and plan on using tan or sand coloured stock. I usually avoid rich black for text at all costs because of registration issues but I want to avoid the washed out look of 100% keyline black on coloured stock.</p>
    <p>I am only using two inks throughout the book, black for text (and some low res images) and a pms metallic (silver) for illustrations. The illustrations in silver sit partially behind the text and I want to make sure that the black does not dissapear when overprinted.</p>
    <p>Any advice? I was thinking about using a pms black instead of process black. I have not used any metallic colours before, anything I should know?</p>
    <p>Thanks all</p>
