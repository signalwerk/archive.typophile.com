      <p>From the copyright info:<br>
      Sylfaen was designed for <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a> in 1998 by <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a> and <a href="/wiki/W%20Ross%20Mills" class="freelinking" rel="nofollow">W. Ross Mills</a> of <a href="/wiki/Tiro%20Typeworks" class="freelinking" rel="nofollow">Tiro Typeworks</a>, and <a href="/wiki/Geraldine%20Wade" class="freelinking" rel="nofollow">Geraldine Wade</a> of <a href="/wiki/Monotype%20Typography" class="freelinking" rel="nofollow">Monotype Typography</a>. Sylfaen is a Welsh word meaning "foundation"; an apt name since the font stemmed from research into the typographic requirements of many different scripts and languages.</p>
      <p>This version of Sylfaen supports the WGL4.0 character set, for Pan-European language coverage. In addition to <a href="/wiki/Latin" class="freelinking" rel="nofollow">Latin</a>, <a href="/wiki/Greek" class="freelinking" rel="nofollow">Greek</a> and <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> letterforms, the font contains the characters necessary for support of the <a href="/wiki/Armenian" class="freelinking" rel="nofollow">Armenian</a> and <a href="/wiki/Georgian" class="freelinking" rel="nofollow">Georgian</a> languages.</p>
    html_clean: |-
