  html: <p>I am trying for a week now to figure out a similar typeface to the one used in <a href="http://www.allianz.com/Az_Cnt/az/_any/cma/contents/604000/saObj_604130_allianz_blauaufweiss_teaser.gif" rel="nofollow"> Allianz </a> logotype. I know this one is most certainly cusom (judging by the overall look and by the connection to the symbol) but I was thinking there might be similar typefaces to it.</p>
