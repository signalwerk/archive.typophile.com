      <p>I actually quite like Cheng's book for what it covers. I think it is an excellent choice for one of several books a beginning type designer could own. The book is strongest at a micro level analysis of individual glyphs and their relationships.</p>
      <p>Significant omissions include the lack of italic coverage, and the fact that the Latin coverage is limited to western European (there’s an eszett and acute, but no ogonek or L-slash). I don't have a problem with stopping at Latin, but covering at least CE/Baltic/Turkish as part of that seems pretty standard these days.</p>
      <p>For western readers, the book is easy to find. Amazon has it in stock, I have seen it in local bookstores, etc. Sorry that getting it in Russia is so hard!</p>
    html_clean: |-
