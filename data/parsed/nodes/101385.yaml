      <p>Karen Chung's book is a very nice collection of comparisons, but honestly you can do the same thing if you have any font drawing software, like FontLab. Just open a bunch of typefaces you want to compare, and start copying and pasting them over one another. You can even do it in Illustrator, going to outlines. And to really study a question you have about how designers solve the design of E or e in different styles, you will want to do a lot more and different comparisons than Chung does. </p>
      <p>In response to Hrant, it would be great to have a newer 'book 1' on type design, including digital type issues, but meanwhile Tracy is it.</p>
