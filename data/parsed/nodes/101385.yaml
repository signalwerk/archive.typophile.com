      <p>I bought the Cheng book from Amazon Japan about a year ago.  It seems to be widely available.  I doubt a.jp would ship to Russia, but I'm sure some Chinese online retailers would be able to get it.</p>
      <p>Personally, I think it's a great book.  It's not simply comparisons, it contains a lot of brief but very useful notes about how letters are typically structured, character by character.  I imagine an experienced/professional designer would probably find most of its hints to be no-brainers, but for a beginner like me it's been invaluable.  </p>
      <p>Lots of people recommend Walter Tracy's book, but that one really does seem to be un-purchasable (unless you're willing to pay several hundred dollars to a rare books dealer).</p>
