    html: |-
      <p>Fonts and Logos by Doyald Young is great. It's a much more important book for type design than Karen Cheng's book, though I like hers as well. </p>
      <p>Young shows by masterful subtle variations how to combine visual interest, cohesion and evenness of color. I don't know Steven Moye's book. So for me Tracy is book 1. Books two and three for me, in no particular order, are Doyald Young's Fonts and Logos and Noordzij's The Stroke. And for getting into the software Learn Font Lab Fast by Leslie Cabarga. But really the thing to study most is classic typefaces and contemporary ones you admire of whatever styles you're interested in.</p>
