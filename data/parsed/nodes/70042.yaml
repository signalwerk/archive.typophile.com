  html: |-
    <p>I have a couple of scifi books from the 80's. Their titles are printed in this interesting font (and I think I've seen it somewhere else), but I can't identify it.</p>
    <p>In this font every character consists of only one twisted line, resembling neon signs.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/slkfontti_6461.png"></div><p></p>
    <p>Does anybody know it?</p>
