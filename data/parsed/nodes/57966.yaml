  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/force-poster-typophile_5588.png"></div><p></p>
    <p>Hello typophile friends,</p>
    <p>We just released <strong><a class="freelinking external" href="http://www.outrasfontes.com/force.htm" rel="nofollow">Force</a></strong>, a contemporary sans serif ultra-black family designed by Ricardo Esteves Gomes (that's me). </p>
    <p>There are 4 font styles: Force Regular, with an upright roman structure; Force Italic, with more cursive lowercase forms; Force Shadow, that can be used alone or as a second layer to Force Regular; and Force Dingbats, cointaining some pictograms. Each font file has some OpenType features: discretionary ligatures, fractions, subscript and superscript. The Force family is suitable for big-size high impact situations like posters, headlines, titles, magazines, packaging and many others you may creatively think of.</p>
    <p>Available at <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/outras/force/" rel="nofollow">MyFonts</a></strong>,: $29,90 per font &amp; 1 free font.</p>
    <p>I hope you like it.</p>
