    html: <p> Hi Brian, yes it sure is fun getting "hands on" manual work / off screen. Impressica was partially designed with old dry rub-off lettering. The SIFF poster features a poor bastard with the camera mounted into his head (who happens to be myself)  I did this job with Robin Bartholick a good friend and and excellent photographer. We shot 13 rolls of 4x5 and had the best shots drum scanned. Final piece was 23 x 32 inches as I recall. You can see more of Robins work at www.bartholick.com. <br>As far as maximum points, I believe it is around 2000 </p>
