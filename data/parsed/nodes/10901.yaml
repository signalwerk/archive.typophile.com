  html: |-
    <p>Impressica is a distressed face I did for the 25th annual Seattle International Film Festival poster. I think that most distressed computer generated faces lack detail when printed in large size so with Impressica I have an average of 130 elements in each letter. This however became problematic when importing and  generating postscript in Fontographer, as there is too many points, so it was left as eps files and I hand set it when I use it. There is 2-3 alternated for each letter.  <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="Impressica.jpg"></p>
