    html: <p> Hey Ole. I like this. I enjoy distressed faces where you can see that the designer had to work a bit  to arrive at a finished product. In other words, it takes a lot of work to make the font to be distressed and more work to pathfinder the interior of these suckers. Nice job. <br> <br>I'm curious if anyone's counted the maximum number of points or elements that Fontographer can comfortably handle without graying to eps.  <br> <br>Also, IN GENERAL, I think that distressed faces (not grunge, let's retire that font description) speak to a younger audience better than non-distressed, especially younger males. I have some anecdotal information about this, but I'd like to see if it holds true over a wider number. <br> <br> <br>Your background image, like in some of your other posts, is nifty. <br> <br>Of the 100 ways to make a distressed face, I like the sponge technique with white out or white paint and a rescan. Next time I do it this way, I'm going to try a Brillo pad, too. I was thinking that might yield some cool results. <br> <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">k <br> <br>bj </p>
    html_clean: <p> Hey Ole. I like this. I enjoy distressed faces where you can see that the designer had to work a bit  to arrive at a finished product. In other words, it takes a lot of work to make the font to be distressed and more work to pathfinder the interior of these suckers. Nice job. <br> <br>I'm curious if anyone's counted the maximum number of points or elements that Fontographer can comfortably handle without graying to eps.  <br> <br>Also, IN GENERAL, I think that distressed faces (not grunge, let's retire that font description) speak to a younger audience better than non-distressed, especially younger males. I have some anecdotal information about this, but I'd like to see if it holds true over a wider number. <br> <br> <br>Your background image, like in some of your other posts, is nifty. <br> <br>Of the 100 ways to make a distressed face, I like the sponge technique with white out or white paint and a rescan. Next time I do it this way, I'm going to try a Brillo pad, too. I was thinking that might yield some cool results. <br> <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">k <br> <br>bj </p>
