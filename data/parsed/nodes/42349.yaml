      <p>The <em>Glossary of Typesetting Terms</em> (University of Chicago Press, 1994) states:</p>
      <p><em><strong>Agate.</strong> [1] A type size of approximately 5 and 1/2 points, 14 lines to the inch. Now used most commonly as a unit of measurement in newspaper advertising. [2]</em> Agate line, <em>a unit of measurement equaling 1/14 of one <strong>column inch</strong>.</em></p>
      <p><em><strong>Column inch.</strong> A unit of measurement one column wide by one inch deep, used in ordering and pricing newspaper advertising space.</em></p>
