    <p>Morning all,</p>
    <p>First of all, the nomenclature used for design on newspaper is new to me, so please excuse me if I’m totally out to lunch here. </p>
    <p>We’re doing a two page ad that runs at the bottom of each page. Pretty simple, but the units given to us are a little perplexing, 40 agates high by 21 columns wide. Agate, at 5.5 pt each give me 220 pts high, but I’m at a loss as to what the “21 columns” implies.</p>
    <p>I stumbled onto something that indicated that 1 column was equal to 14 agate, and something else that implied that this is not set in stone.</p>
    <p>The rep at the paper seems MIA and we need to get this to them today and is further complicated by the fact that I am stepping in for another (now gone) designer who has created single page ads in the past, but the dimensions of those files don’t ad up either.</p>
    <p>Any insight?</p>
