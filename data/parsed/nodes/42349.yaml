      <p>The width seems to be 10 columns per page plus one added for the innermargins.</p>
      <p>Over here in the Netherlands columns have been standardized for years — 40 mm per, with a 2 mm substraction for required whitespace (substracted for the total). </p>
      <p>Don’t know about the US-situation ; )</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
