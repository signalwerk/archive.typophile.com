    html: |-
      <p>Newspapers are getting smaller. Narrower to be specific. A full page ad in New York Times used to be 13” x 21” now it is 11.5” x 21”.</p>
      <p>LA Times used to be 11.5” x 21.5” now it is 10.88” x 21.5”.</p>
      <p>Ink coverage has dropped also - LA Times is now 220 Dmax. I guess when you add all that up you save a bit of money.</p>
      <p>pbc</p>
