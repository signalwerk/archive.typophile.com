      <p>&gt; I stumbled onto something that indicated that 1 column was equal to 14 agate, and something else that implied that this is not set in stone.</p>
      <p>In the newspaper industry, it is. 1 column inch (not 1 column) = 14 agate lines (exactly ... forget the 5.5 point stuff).</p>
      <p>Another term you might run into is double truck, which is two full facing pages. Sort of what you have, but not the full height.</p>
      <p>Back in the days when newspapers were kings, many papers had a rule that your ad could not be more than one column wide per 10 agate lines of height. These days, they will sell pretty much whatever they can.</p>
