  html: <p>I work on Mac System since 1986. I used Illustrator since1988. I draw some typeface by hand (ink an pen). For those, who worked before electronic tools they know what I mean. <br> <br>I wish to transform those handmade typeface to an electronic one. <br> <br>Is somebody could help me to choose the right software? <br> <br>Thanks for your support.</p>
