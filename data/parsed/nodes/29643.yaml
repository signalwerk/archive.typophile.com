    <p>Fellow typophiles,</p>
    <p>Next tuesday (november 28th) I’ve got my admission interview at the Royal Academy of Arts in The Hague, The Netherlands. I think I’m going to be alright, but I haven’t got the slightest on what I can expect. I’ve got a good portfolio I think. I have lots of sketches in there, not just final products. I heard admission commitees like sketches. Apparently the creation process is more important than the final product, which I think is rubbish... but hey, if they want sketches, they’ll get them.</p>
    <p>But otherwise, I don’t know what will happen, and I’m quite nervous. I suppose most of you have attended some form of formal art education in the past, so I was wondering wether anyone of you had any suggestions or pointers?</p>
    <p>Kind regards,</p>
    <p>Wouter Spaak<br>
    Nijmegen, The Netherlands</p>
