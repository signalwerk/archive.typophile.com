    html: |-
      <p>I subscribe to the roller coaster method of portfolio presentation, which is a variant on the old fence post method.</p>
      <p>Create build up by having a clean and tidy case, start with one of your best pieces (the initial drop), and then spread the next best works equally throughout (the smaller hills and loops). Then end with a jerk - a piece to leave an impression with the reviewer. </p>
      <p>Good luck!</p>
