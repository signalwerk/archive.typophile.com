    html: |-
      <p>Get in contact with current students and ask them about the admissions department. Its a great way to find out what the people working there want to see (or not see!), for example, if they’re going to expect you to have some good figure drawings in the portfolio it’s best to know that ahead of time. </p>
      <p>Here in the states most schools want to see twelve to twenty pieces, and it’s usually a good idea for at least half of them to be at least 18”x24” in size. </p>
      <p>Lastly, don’t show anime/manga styled work unless it’s outstanding. Art school admissions departments throw away piles of anime/manga portfolios every day because they get so much of it, and art teachers don’t like teaching kids who believe that line art is the ultimate achievement of human civilization.</p>
