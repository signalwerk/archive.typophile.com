    html: <p>The top one looks like a pen script, similar to Agfa's <a href="http://www.fonts.com/findfonts/detail.asp?pid=203120" target="_blank">Lisbon</a> or <a href="http://www.fonts.com/findfonts/detail.asp?pid=206274" target="_blank"> Amanda</a>. <br> <br>I can see that neither of these is exactly the same, but if we don't come closer those may be substitutes.</p>
