    html: <p>Franko Luin's <a href="http://www.identifont.com/show?2P6" target="_blank">Ad Hoc</a> is alos fairly similar, as are some of the fonts Agfa has of Philip Bouwsma's like <a href="http://www.identifont.com/show?5JF" target="_blank">Trieste</a> and <a href="http://www.identifont.com/show?5EB" target="_blank">Corvallis Sans</a>. <br> <br>I'm afraid I'm running out of places to look. It may also be hand-lettered (not a font), as another possibility to consider.</p>
