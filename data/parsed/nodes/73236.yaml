    <p>I'm fascinated by the sheer power that is (apparently)available with FontLab.  However, the price is...daunting, shall we say, for someone who is interested in learning the craft as an avocation (I'm an engineer, and I see typography as an opportunity to apply math in a nearly-pure form).  Where and how might I obtain a used copy that I can purchase for a relatively modest price to try out (not interested in the demo version since I want to experience full functionality)?  Any suggestions?</p>
    <p>I've posted on eBay, with no results, by the way.  And I balk at downloading from any of the repositories like RapidShare: too high a probability of a virus/trojan, never mind that it's unethical/illegal.</p>
    <p>Thanks in advance.</p>
