      <p>Thanks to one and all for your comments.  The truth of the matter is, I don't know how I'll wind up using math and font design together!  I suspect a lot of it will be applications of analytic geometry, but that remains to be seen.</p>
      <p>@ berkson: I suspect strongly that you're on target.  That is, (let's say) analytic geometry will get the basic forms delineated, but there will likely be the aesthetic aspect of "that doesn't quite look right somehow" that will yield modifications.  So it'll be a blend (not sure what proportions) of math, engineering and art.  Sue me...:-)</p>
      <p>And all of that, sports fans, is why I'd like to see if I could find a discounted or older used version of FontLab to give it a whirl and check out some ill-formed, hazy theories.</p>
