    html: |-
      <p>&gt;&gt;an opportunity to apply math in a nearly-pure form<br>
      &gt; A benign ignorance, soon corrected by experience.</p>
      <p>William, maybe the original poster is thinking of a different way of applying maths than you are?</p>
      <p>Maths and fonts can have many relations:</p>
      <p>It can be <cite>prescriptive</cite> like in the constructions of the renaissance – this does not work, as we know, and I guess this is what you were thinking of. This is what mathematicians call a <cite>sufficient condition</cite> for what looks right.</p>
      <p>It can be used to describe a <cite>necessary condition</cite>, like in the <a class="freelinking external" href="http://remix-tools.com/" rel="nofollow">RMX Harmonizer</a>, and I personally belive this is relevant and useful.</p>
      <p>It can be used to <cite>process shapes</cite>, like the other RMX tools or MM or Superpolator do, and again, I think it does so successfully.</p>
      <p>Finally, maths can be used as a <cite>medium</cite> in which to describe or store shapes (i.e. Bézier curves), and since we are working on the computer, this kind of maths application is not only sensible but inevitable.</p>
