    html: |-
      <p>Andrew (1985), have you drawn type? </p>
      <p>Circles can't be circular to look circular, nor squares square, nor rounds the same dimensions as squares. Dividing in half vertically visually is not equal in measure, horizontals and vertical strokes that are equal in width don't look so, and on and on. And this is the simplest stuff. </p>
      <p>One of the most astonishing things to me I have learned in drawing type is that what we see is not what is on the page. Our brain's interpretation of data is a *huge* contributor to what we see, and that is not well understood yet.</p>
