    html: |-
      <p>@Nick Shinn:<br>
      <cite>For instance, you could buy the top 10 magazines in a certain category, in the three countries, and analyze what fonts and layouts are used.</cite></p>
      <p>Also, Google Books is a free resource - and it might well be useful to look at older books from different countries to get a feel for practice before homogenizing influences had a chance to change the typography of some countries. (Although, in other cases, the limitations of metal type or the economic dominance of some countries might have suppressed national styles for some time.)</p>
      <p>One example that comes to mind is that in Britain, it was normal practice to insert a space between a word and a colon which followed it.</p>
      <p>Also, I remember reading a claim that Italian, instead of hyphenating, uses superscript letters somehow, although I don't recall ever seeing this in an Italian text.</p>
