    <p>Hello typophiles,<br>
    I am currently involved in a project that is supposed to utilize the special characteristics of french, german and english (british) typographic design. It's not limited to certain typefaces but also grids and other elements indicating a nationality in design.<br>
    So i, currently being in research-mode, can't find all that much on certain direct markers that would identify a design as french or british.<br>
    There is quite much on german typography and considering that i am german i have a little knowledge regarding the german aspects.</p>
    <p>Practically im here to ask for your help on any books, authors or websites that could help me out.<br>
    Thanks in advance.</p>
