    html: <p>Read the typesetting section of The Chicago Manual of Style, for a start. Also, visit the countries and just look at books, signage, magazines, newspapers, and take lots of photos. Graphic design has a distinctly different feel in France, Germany, and England (and, of course, compared to America); you can then try to identify why it feels different.</p>
