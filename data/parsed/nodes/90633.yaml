      <p>Things get stored where you may not expect it in FontLab.</p>
      <p>Try this: Export the font features into a .fea file. Now open up the classes panel, and rest it -- you'll be getting rid of all classes BTW, not just kerning.</p>
      <p>Now, in a text editor,  open up the .fea file you wrote off, and you'll probably notice the classes are there, too. Delete whichever classes you don't want -- just the kerning classes, probably. You'll also have to delete the kern feature itself, not just the class definitions.</p>
      <p>Now, in the font, open up the OT menu. Reset the features (essentially clear all). Now use "open features" &amp; read in your (now edited) .fea file. Complile.</p>
      <p>I'll bet your unwanted kerns are gone. There are probably settings within FL that will let you do the same thing; I just always work with a text editor in outboarded files, so don't know how to set them.</p>
      <p>If this works, you have no kerning. You can add it in several ways -- By using the metrics windows &amp; then use the "generate kern" feature in the OT features, or by incorporating an external kern feature in the .fea file you wrote off, so it is imported along with everything else in the .fea file.</p>
      <p>Not sure want you're trying to accomplish, but that should get rid of all the extant kerning from when you first opened the font.</p>
