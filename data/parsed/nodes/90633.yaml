    <p>Hello my friends:</p>
    <p>I have a problem regarding my designed TTF and OTF fonts using FontLab software. When I design a font and delete all kerning and metrics classes in the fonts, I generate the final TTF and OTF files. After opening them again in the FontLab, I found that the same classes are still there and nothing has been deleted. I am not sure if the FontLab program that I have working properly but it repeats the same classes after my repeated tries of deleting them and generating new OTF and TTF files.</p>
    <p>What could I do to make these classes deleted permanently and not generated again in my generated TTF and OTF?</p>
    <p>I have attached the photos which describe my frustrated problem.<br>
