    html: <p>And if I'm not mistaken, the "Smooth Line Art" option is now on by default, in Adobe Reader and Acrobat 6, correct? <br> <br>A funny story, I have been working with acrobat for some time now, and after we got our upgrade to 6 in the mail I load it up, first thing I do is load a vector file, and viola, antialiasing. <br>So I turn to the chap across the way and exclaim "Thanks God, they have finally added antialiasing to vectors other than text in Acrobat", after which he says, "Um.. well, you could have just turned it on." Doh! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Hildebrant.</p>
