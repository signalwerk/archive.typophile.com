    html: <p>David, what version of Quark are you using? InDesign, displays at a medium quality and it looks bitmapped but if you select high quality you get to see how it will really print. I don't know if quark has that feature or not. My best guess, if you are working with 4.1, (the last version I will ever use) is it will print out fine. Did you know InDesign out puts to PDF directly and supports PDFX. Thomas Phinney, our Adobe expert please chime in. Dan</p>
