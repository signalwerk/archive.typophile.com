  html: <p>Hi, <br>Im hoping someone can help me. <br>I have an illustration i created in illustrator (black line on white background), and have imported to a quark document to place on an image. I have imported it as an eps. When i created a pdf, the illustration looks bitmapped slightly and is definatly not as smooth as the illustrator version. <br>Im assuming it will be fine when i print it out, will this be the case? <br>And if not, what is the best way to import a line drawing so in quark you can place it on any background? <br> <br>Thanks alot for your time, <br> <br>david.</p>
  html_clean: <p>Hi, <br>Im hoping someone can help me. <br>I have an illustration i created in illustrator (black line on white background), and have imported to a quark document to place on an image. I have imported it as an eps. When i created a pdf, the illustration looks bitmapped slightly and is definatly not as smooth as the illustrator version. <br>Im assuming it will be fine when i print it out, will this be the case? <br>And if not, what is the best way to import a line drawing so in quark you can place it on any background? <br> <br>Thanks alot for your time, <br> <br>david.</p>
