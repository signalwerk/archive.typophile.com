    <p>Hi all,<br>
    Does anybody already saw this display bug in FontLab ?<br>
    All the texts you can type in FontLab like values or sample text in metrics window or somewhere else are not displayed in latin characters but in a kind of hebrew or something like that. A bit annoying to be precise !<br>
    I already had this bug in iTunes, but this disapeared at the next update.<br>
    I tried to reinstall FontLab totally but without succes.<br>
    Thanks by advance for the help.</p>
