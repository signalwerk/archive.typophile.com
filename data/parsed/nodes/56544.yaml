      <p>hey Ashley,</p>
      <p>I like your approach!</p>
      <p>The two things that stick out to me on first glance are:</p>
      <p>*the circular letters - I wonder if the stroke keeps going too far on the inside, making a sort of double-walled letter<br>
      *the I, T, r, and e seem too geometric for the otherwise playful approach and execution.</p>
      <p>Oh, also in your real cookie dough, the baselines aren't straight, which I actually find somewhat charming. </p>
      <p>love to see where it goes!</p>
