    html: |-
      <p>The dough design looks delicious. OK. Sorry. I got carried away.</p>
      <p>I really like this concept. Here are my issues with the digital version:<br>
      (1) I can't decide if it says, "dough" or "hugh."<br>
      (2) Notice how in the dough version the baseline of the letters are curvy and organic? Well, you stripped all that out in the digital version, which makes it look decidedly less "doughy."<br>
      (3) Related to (2), some of the glyphs have lost playfulness with the straight baselines as well, particularly the 'd', the 'y' and the 'r'.</p>
      <p>All that said, however, good job with getting your creative inspiration!</p>
      <p>--<br>
      Nick Hladek</p>
