  html: |-
    <p>The deadline for submitting presentation proposals for ATypI 2014 was last Saturday, March 14. Like a few others, the deadline caught me by surprise. I'm informed by the secretariat that the deadline for submissions has been extended until Monday, March 24. </p>
    <p>For details on the types of sessions that are being planned, and the confence theme, see:<br>
    <a href="http://www.atypi.org/barcelona-2014" title="http://www.atypi.org/barcelona-2014">http://www.atypi.org/barcelona-2014</a></p>
