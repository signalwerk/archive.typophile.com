    <p>Hi,</p>
    <p>I'm looking for a Flemish Blackletter from the beginning of the 20st century (or older). I prefer one that hasn't been digitalised yet.<br>
    I allready tried a catalogue of Platin Moretus in Antwerp and found two typefaces, but these were allready made digital ('Cloister Black' and 'Wedding Text Std.')</p>
    <p>Can anyone help me? </p>
    <p>Thank you</p>
