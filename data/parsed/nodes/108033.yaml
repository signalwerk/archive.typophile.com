      <p>You might like Gothique Ornée, a Schwabacher-style blackletter from the Belgian typefoundry of Jules Didot, 1914. Walloon, not Flemish, but was there really a distinction in style?</p>
      <p>Cliquez ici pour le <a href="https://archive.org/details/spcimendescaract00johe" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Spécimen des caractères de la fonderie normale à Bruxelles, provenant de la fonderie de Jules Didot et de son père, Pierre Didot</a> (1914).</p>
      <p>I've actually been working on a digitization of this myself, mainly for an exercise of my own and not for any end goal. Almost complete set of decorative uppercase, missing some lower case examples but fairly easy to fill the gaps in the same style.</p>
