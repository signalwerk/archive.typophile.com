    <p>Lucian Bernhard (born in 1883, Stuttgart, Germany, died in 1972, New York, U.S.A.) was one of the pioneers of graphic design.  He designed faces like "Antiqua" and the "Bernhard" Family (Bernhard Modern, Bernhard fashion). He also helped found the first international design foundry, "Contempora".</p>
