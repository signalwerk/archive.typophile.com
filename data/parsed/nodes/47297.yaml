    html: <p>I'm not sure you've seen the "Masterpiece" "font" many times. It looks handwritten to me and not a font at all (note that all the 'e's are different). Maybe what you <em>have</em> seen is stuff in a similar style, such as <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=UMT0000181" rel="nofollow">Affair</a>, <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=UMT0000149" rel="nofollow">Ministry</a>, and <a href="http://www.myfonts.com/fonts/blambot/skin-deep-bb/?refby=typographica" rel="nofollow">Skin Deep</a>.</p>
