    <p>My girlfriend buys the magazine <a class="freelinking-external" href="https://web.archive.org/web/20080706172818/http://www.shoptilyoudrop.com.au/">’Shop till you drop’</a> and the other day i saw the cover for the current issue and thought ’hang on, that’s really nice type...’ Three of the types used i love but have no idea what they are, can someone help please?</p>
    <p>Here is the cover which has sample of all the types i’m after (click for larger image) <a href="https://web.archive.org/web/20080706172818/http://www.magshop.com.au/?id=150&amp;CID=10446" title="http://www.magshop.com.au/?id=150&amp;CID=10446">http://www.magshop.com.au/?id=150&amp;CID=10446</a></p>
    <p>The first is the script used to say ’till you drop’ on the logo.</p>
    <p>The second is a sans used for some body copy, headings, and product info.</p>
    <p>The third is a handwriting script used heaps in the mag.</p>
    <p>Any help would be really helpful.</p>
    <p>I can try to get scans if needed.</p>
    <p>cheers - sye :)</p>
