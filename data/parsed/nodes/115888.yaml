    <p>Hello folks,<br>
    I felt in love with "Antwerp" font made by Henrik Kubel for Playtype.<br>
    <a href="https://playtype.com/index.php?q=font/antwerp" title="https://playtype.com/index.php?q=font/antwerp">https://playtype.com/index.php?q=font/antwerp</a><br>
    But i'm really annoyed by its "J". (see jpg)<br>
    I asked Playtype if there was a mistake.<br>
    I got this quick answer :<br>
    "The Antwerp lowercase ‘j‘ was designed this way.<br>
    It is not a mistake, in fact it helps the direction of reading and matches the ‘i’ better.<br>
    There will be a future version of the Antwerp font(s) without this detail. </p>
    <p>I'd like to use that font for a book and find it more distracting then helping, as it is really unusual.</p>
    <p>My question here is : do you know other fonts with such 'J' ?<br>
    Or is it a sort of trick to add a 'j' that didn't exist in the 1500s ?<br>
    I have to admit that knowing that form exists somewhere else at some point could help me using it.<br>
    I think also that if a modified version is scheduled, i'm not the only one to find the 'j' awkward. ;-)</p>
    <p>Many thanks in advance for your comments.<br>
    Stef</p>
