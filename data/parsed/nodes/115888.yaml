    html: |-
      <p>That feature (probably inspired by a particular section of the book "Counterpunch" by Fred Smeijers) most certainly does not help reading. Letters don't need to sit, they don't need to "point" in the reading direction, and making the "j" more like the "i" is the opposite of what one should do.</p>
      <p>If they don't fix it soon, you should fix it –or get it fixed– yourself.</p>
      <p>As for others fonts with this feature, there are some rare historic designs that have it (although AFAIR more prominent in the capital "J") but usually much more subtle than this.</p>
      <p>hhp</p>
