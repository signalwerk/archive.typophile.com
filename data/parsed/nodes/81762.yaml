    <p>Hiya, so I'm pretty new to this forum (I just joined) but I've been a lurker here and there for the past few months or so...</p>
    <p>I'm a student whose working on a book about theater in San Francisco, and I've been struggling with getting my previous work for the topic, to read as "theater". I've decided to scrap nearly everything I've worked on up until this point, and I've decided to shoot for a vaudeville aesthetic because vaudeville always seems to capture that theatrical essence that resides in most people. Plus, "vaudeville conquered the West" as they say...</p>
    <p>So, I was wondering if you can point me into the right direction with regards to typefaces? Currently, I've been experimenting with Copperplater and a font called Vonfont, but I know there are loads more.</p>
    <p>Any help would be greatly appreciated :)</p>
    <p>Thanks in advance :)</p>
    <p>~C</p>
