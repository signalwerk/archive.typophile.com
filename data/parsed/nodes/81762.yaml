    html: <p>The question is, which Vaudeville aestetic? It's rather different in the late 19th century compared to the Jazz age! :) For the 19th-century stuff (which gels rather well with many people's idea of vaudeville today), <a class="freelinking external" href="http://www.letterheadfonts.com/" rel="nofollow">Letterhead Fonts</a> has a good range of display types, but perhaps <a class="freelinking external" href="http://www.trocadero.com/rogerbradbury/items/1041909/en1.html" rel="nofollow">this sort of thing</a> with  grotesque woodtype (or similar) would make an interesting alternative?</p>
