      <p><cite>I’m with Tim: if there’s no reason to use Quark, you’re better off using InD….</cite></p>
      <p>Fine if you want to limit yourself to only one design software, but a lot of companies (at least here in NY) still use and require knowledge of Quark. I think it’s well worth the effort to be fluent in both. Like Nick, I came from a Quark background, and I’m still more comfortable in Quark, got annoyed when I had to learn InD to keep up with the Joneses, and still get confused a bit when I jump from one to the other in the same day. But I’d limit my employement opportunities if I didn’t have good working knowledge of both programs.</p>
      <p>Outlining type is definitely something InD does better/more easily than Quark.</p>
