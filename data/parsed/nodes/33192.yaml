      <p>Actually that is not what I said or implied, when these threads occur I try not to make judgements on the quality of software, just to reply to the question since that <em>is</em> the question. I imagine the frustration of posters asking questions about a specific piece of software only to be told that they should be using something else, rather like asking for directions and being told, ‘Oh, I wouldn’t start from here’. FWIW I find the interface of Quark less cluttered than InDesign and that it is capable of producing fine work.</p>
      <p>Tim</p>
