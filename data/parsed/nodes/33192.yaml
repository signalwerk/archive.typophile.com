      <p>Avoid using those modification boxes for anything you don’t get a true outline, italic or bold. If you want outlined text, create it in Illustrator and import it, if you must, select the text and apply colour either from the colour dialogue box or the style drop down menu.</p>
      <p>Tim</p>
