    <p>Hey all,</p>
    <p>I recent have been learning Quark, and I have been having a few problems which seems so easy in Indesign.</p>
    <p>Such as:<br>
    - How do you change the outline of text?<br>
    - How can I turn Hyphenation on/off? Went into the H/J dialog box but can’t seem to turn it off or on. ITS JUST A SIMPLE TICK IN INDESIGN!<br>
    - And maybe I’m blind/dump but how do I get space between the top of the text-box and the text, in version 6.5?</p>
    <p>These things are so straight forward (at least for me) in Indesign, I can’t believe it’s not so in Quark. Very frustrating.</p>
    <p>Thanks for any help.</p>
