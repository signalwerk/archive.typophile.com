    html: |-
      <p>It’s not clear from your post if you need to be able to change the text once for all the InDesign various documents. If this is the case, in order to retain the styles set in InDesign, your best bet is explore the data merge capabilities of InDesign (search “data merge” in the Help).<br>
      If the text will not change... I didn’t understand your request! ;-)</p>
