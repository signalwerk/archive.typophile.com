    html: |-
      <p>In InDesign, go to Preferences &gt; Type &gt; Links, and select “Create Links When Placing Text and Spreadsheet Files.”</p>
      <p>After placing a text doc, it will appear in your Links palette, and will display the yellow “I’ve been modified” triangle when you make changes to the original text doc.</p>
      <p>The challenge comes when you update the link. Any changes you’ve made to the file in InD (such as applying styles) are wiped out, which would defeat your purpose. </p>
      <p>I’ve not tested this, but I believe the workaround would be to create and apply style sheets in your word processor, then modify those style sheet attributes in InD. (Assuming that you’ve set your text import preferences to bring along the word processor’s style sheets, of course.)</p>
