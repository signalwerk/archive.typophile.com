  html: <p>Is it possible to place a document containing text into multiple Indesign files and then style that text differently in each of the multiple indesign files? What I want to do is maintain a single text document for text that I use to proof all of my different fonts without having to change that fonts in used in the original every time I need to print a proof. And if this isn’t possible in Indesign, is there some other option?</p>
  html_clean: <p>Is it possible to place a document containing text into multiple Indesign files and then style that text differently in each of the multiple indesign files? What I want to do is maintain a single text document for text that I use to proof all of my different fonts without having to change that fonts in used in the original every time I need to print a proof. And if this isn’t possible in Indesign, is there some other option?</p>
