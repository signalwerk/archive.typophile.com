    <p>I've been working as a designer in Japan for the last 7 years, and picked up a handful of tricks and rules of thumb to keep me out of trouble when designing Japanese or Japanese/English print pieces and websites, <a href="http://www.aqworks.com/2004/10/15/japanese-typography-on-the-web-and-beyond-part-one/" rel="nofollow">some of which</a> <a href="http://www.aqworks.com/2004/10/27/japanese-typography-on-the-web-and-beyond-part-two/" rel="nofollow">I shared on my blog</a> a few years ago.</p>
    <p>Since then, I've had a few opportunities to design in other languages, and never ran into any major issues. Until recently when I hit a few copy-fitting bumps with German during a redesign project for a website that needs to support a dozen European languages.</p>
    <p>Is there any resource out there that has some basic basic practices for designing in various languages? If not, shall we start one in this thread?</p>
    <p>Here's my incomplete contribution to kick things off:</p>
    <p>(All relative adjustments are "_____ than same in English")</p>
    <p>Japanese:</p>
    <ul>
    <li>A little more leading to let heavy, mono-width/height Kanji breath.</li>
    <li>More reliance on decorative elements for list items (no caps in Ja.)</li>
    <li>Web-only: More reliance on graphic text (less system fonts to choose from)</li>
    <li>Web-only: WinXP will round down odd numbered font-sizes (e.g. 11px -&gt; 10px)</li>
    <li>Allow for more design time for tracking/kerning adjustments.</li>
    <li>For multi-lingual: labels/navigation/titles can be drastically longer/shorter than En. Get key copy early for testing.</li>
    </ul>
    <p>German (courtesy of <a href="http://www.informationarchitects.jp" rel="nofollow">Oliver R.</a>)</p>
    <ul>
    <li>Wider columns (to accommodate longer words)</li>
    <li>Slightly more leading (to accommodate more capitalized words)</li>
    <ul>
    </ul></ul>
