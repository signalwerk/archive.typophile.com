      <p>In Russian:</p>
      <p>«Guillemets» should be used for quotation marks, for a quote within a quote, it's customary to use „this format“ of the curly quote marks.</p>
      <p>Abbreviated names need a non-breaking space after the dot: A. P. Checkhov vs A.P.Checkhov.</p>
      <p>Abbreviations always terminate in a dot, so: tel.: (654)-55-4454 vs tel: (654)-55-4454</p>
      <p>En-dash isn't used,it is generally replaced with an em-dash.</p>
      <p>It is customary to move the single-letter conjunctions to the beginning of a new line rather then let them dangling at the end of the previous one.</p>
      <p>L e t t e r s p a c i n g used to be commonly employed in the same function as one would use italics. This practice seems to be finally dying out.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
