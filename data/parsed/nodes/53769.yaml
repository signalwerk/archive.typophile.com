      <p>In Spanish there's no real different concern.  Used to be you'd removed accents on the vowels when in all caps situations, but that's no longer the case.  I would only highly recommend that angle quotes are used instead of curly quotes, as they are prefered by the RAE.</p>
      <p>Also, that labels and such can be much shorter or longer is standard for any translation.  In general, the recommendations I've also seen and used is to assume and prepare for up to a 50% increase in length of text when going from any one language to another.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
