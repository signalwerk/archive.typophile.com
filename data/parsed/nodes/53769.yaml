      <p>Joe,</p>
      <p>Sorry, some of my points were worded vaguely enough to be misinterpreted into the worst possible practices. You may disagree with some of them anyway, but they are based on my experience designing and coding Japanese and Ja/En websites over several years, with periodic experimentation and research as browsers and techniques changed. </p>
      <p>I make mistakes sometimes, and I don't work for the W3C or an accessibility research group, so my advice may not be perfect, but on the whole it's worked well enough for my clients and their visitors. </p>
      <p>Getting down to specifics: </p>
      <p>* I've done tests several times over the last 4 years (including today) on different machines. I'll send you screenshots. Japanese characters set to 10px and 11px (or 1.0em and 1.1em within 62.5% body) are rendered identical in size in IE 6 and 7 (WinXP). </p>
      <p>* I spoke in pixels because they're easy to understand in the context of this conversation, but I set all my type in ems, and recommend everyone to do the same. </p>
      <p>* Re: pictures of text. Maybe "text" was the wrong word (I didn't mean body text), I don't recommend it for body copy of course, but I think image replacement of decently-sized static headlines is reasonable compromise between aesthetics and accessibility. Encoding won't help you when there are 2-3 decent Japanese system fonts to choose from on Mac and 2 assey ones on Windows and they're not the same fonts. </p>
      <p>I'm not expecting the next Bringhurst to come out of this thread, but without any great resource on this specific topic (that I know of), maybe we can gather enough practical techniques to rise above a "piecemeal list of greatest hits of typographic anecdotalism".</p>
