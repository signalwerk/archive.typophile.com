      <p><em>Verdana shows the wrong standard german close quotation mark „Hallo“, but you could use guillmets instead – »Hallo«.<br>
      In the version of Corbel (vista font) i know, the same problem occurs also.</em></p>
      <p>This is an interesting issue. Modern German punctuation uses what most of think of as the 'left quote' mark “ to close quotations, but the expectation of German typography is that this glyph curls or leans away from the text, as is the case in most serif faces and <em>some</em> sans serif faces. San serif faces that were designed specifically to work well on screen present a problem, though, because the easiest way to make the quote marks distinguishable at low resolution is to lean them in opposite directions (following a common written form, at least in Anglo-American usage). As you observe, this produces the 'wrong' form for the German closing quotes.</p>
