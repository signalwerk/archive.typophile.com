    <p>An interesting typographic chart on the front page of “The Arts” section in to-day’s NY Times (p. E1). In that chart “each word is scaled proportionally to the number of times it has been used in acceptance speeches at the last six Academy Award ceremonies.” The largest-size word is... “<strong>thank</strong>”. All words in the chart are set in Matthew Carter’s excellent <a href="http://www.nytimes.com/2003/10/21/business/media/21PAPE.html?ex=1141880400&amp;en=1d9e57039abe6674&amp;ei=5070">Times Cheltenham</a>. The chart was designed by <a href="http://www.13pt.com/projects/nytimes">Jonathan Corum</a> of The New York Times.</p>
