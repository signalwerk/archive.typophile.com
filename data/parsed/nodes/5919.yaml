    html: '<p>Formatt was offered by Identikal Fonts once upon a time (2002). It is referenced here about halfway down the page: <br> <br><a href="http://www.fontlover.com/archive/2002_02_01_fontscoop_archive.html" target="_blank">http://www.fontlover.com/archive/2002_02_01_fontscoop_archive.html</a> <br> <br>You might try to contact Identikal directly. I did not find it offered on the website though. <br> <br><a href="http://www.identikalshop.com/" target="_blank">http://www.identikalshop.com/</a> <br> <br>Good luck! <br> <br>-C</p>'
