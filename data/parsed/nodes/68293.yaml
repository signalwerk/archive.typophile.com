    <p>Hi all,</p>
    <p>I've been working on and off on this typeface for the last few months. While I did start creating one a few years ago, I'd consider this my first "real" attempt at a full font. While a lot of the details are more suited to display purposes, I'm also trying to make it work at smaller sizes (maybe a separate text version?). </p>
    <p>I haven't really shown it to many people yet and I'd like to know what you think and if it's worth continuing with. I'm mainly concerned about it looking too amateur-ish and wanted to know if there are any glaring beginner mistakes/things I've missed. </p>
    <p>I've drawn the upper and lowercase, some very basic punctuation but no numerals or diacritics yet as I first wanted some feedback on the letters/overall feel so far. I'm also figuring out Open Type along the way with some ligatures, stylistic alternates, possibly swash characters, but I'm only just beginning. </p>
    <p>This is the regular weight and I'd to make light &amp; bold weights and an italic at least to start with.  I've been working on the spacing for a while but it's still got a lot of fixing to do; there are some combinations I just can't seem to get right. There is no kerning or hinting yet (save for automatic hinting when generating).</p>
    <p>Thanks very much in advance! It's really appreciated.</p>
    <p>Claire</p>
    <p><img src="/sites/default/files/old-images/qualtagh_3673.jpg"></p>
