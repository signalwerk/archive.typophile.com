      <p>Hi Claire,</p>
      <p>First of all, don't be modest. Perhaps just a few percent of Typophile members are professional type designers, the rest of us are, just like you, enthousiasts. We all try our best and, as you said, hope to learn from each other. :-)</p>
      <p>As for your design, I like it very much. It feels almost constructivist yet with subtle details. Overall I think that those details might be better off when you add some contrast (thick and thin). I feel that /s/ and /S/ are too wide, as well as /a/, which looks wider as /d/. /t/ is a bit too narrow.</p>
      <p>I can understand you're having difficulties spacing; the extra lines before /e/ and after /d/ make it hard. But don't change them!</p>
      <p>Keep going!</p>
      <p>If you're interested, please critisize my own design @ <a href="http://typophile.com/node/68295">http://typophile.com/node/68295</a></p>
      <p>Jean Paul</p>
