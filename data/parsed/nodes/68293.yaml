      <p>Hi and thanks very much for your comments! </p>
      <p>I hadn't noticed the width of the upper and lowercase S but now that you mention it, it does stand out. I have progressively been adding some contrast (originally it had barely any) but I'm a little concerned the horizontal strokes on the top of the /a/, /g/ etc. might get too thin.. I'll play around with it though, well pointed out. </p>
      <p>I was unsure about those extra lines for a while, especially with the spacing difficulties, but without them it looks a little plain so I'm glad you recommend keeping them in!</p>
      <p>I had been following your earlier thread; I'll definitely have a look at the second part. </p>
      <p>Thanks again!</p>
