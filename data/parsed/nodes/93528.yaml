    <p>Hello everyone,</p>
    <p>I was just wondering : since xMix, xMax, yMin, and yMax in the 'glyf' table define a bounding box for glyphs, I was wondering for what size is this bounding box given ?</p>
    <p>Let's say, if a 2000*2000 bounding box is - for example - for a 100 pt "M", then I'd like to be able to get the bounding box for another size with a rule of three.</p>
    <p>Thanks in advance for your help and your time !</p>
    <p>Frederic</p>
