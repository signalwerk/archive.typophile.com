  html: |-
    <p>Hi there, </p>
    <p>I am a long-time viewer, first time poster on Typophile. </p>
    <p>To expand my interest of type I have decided to create a Letterform a day.</p>
    <p>Please critique ideas. These are a few starting points, tomorrow I intend to start, with, believe it or not...'A'!</p>
    <p>Every day I will update the , hopefully spanning across many typographic genres, in an aim to finally settle on a style I am pleased with, and develop a full series of letterforms (typeface) from that.</p>
    <p>I am interest in the Gestalt theory, and what we create in the blank space with our mind.</p>
    <p>I am interested on everyones view of typography and welcome comments each day.</p>
    <p>Thank You.</p>
    <p>B&amp;A.</p>
