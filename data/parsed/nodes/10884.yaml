    html: "<p> It looks to me that, once again, any similarities are simply a consequence of there being only so many ways to design a font based on a strict grid structure. It's easy to see the grid structure underlying both Feynman and Lust Pure, and it looks like they have both used an identical or very similar grid. That, of course, does not imply plagiarism any more than Avant Garde Gothic can be said to have copied Futura. The ground rules are the same, but the path to completion is different. <br> <br>Having said that, I should add that of the two samples, I prefer Feynman; although I do like the quirks of Lust Pure. I could easily see myself using either font. <br> <br>One suggestion for Feynman: I would shorten the height of the lc \"t\" by one stroke-thickness (or one grid block, if you prefer). It looks unnaturally tall, especially next to a full-height lc \"h\". <br> <br>You also might consider shortening the overhang of the lc \"r\" by the same amount. <br> <br>Nice work! <br> <br>David </p>"
