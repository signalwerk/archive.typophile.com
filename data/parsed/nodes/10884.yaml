    html: "<p> Of course, sorry... <br> <br>Concerning interpolation, what I did in the case of Patria was the following: <br>1. Drew and digitized a weight close to what I thought Regular *would* be. <br>2. Made the two extremes by modifying that weight (starting with an automatic FOG weight change but then making the Light's thins thicker and the Bold's thins thinner*, for starters). <br>3. Cleaned up the two extremes to make them look nice on their own. <br>4. Dumped the original Regular. <br>5. Made two intermediate weights (the exact \"location\" of which depended on many things). <br>6. In order to maximize continuity, I did *not* clean up the intermediate weights, instead going back and modifying the two extremes to get the intermediates that I wanted. <br> <br>* Although maybe I should have made the thicks thicker, considering the Bold might not be bold enough... I didn't leave myself enough room (maybe even on the light extreme), that's for sure. <br> <br>Example of #6: If I saw that the lc \"k\" in the interpolated Regular had an upper arm that was too thin, I'd look at the two extreme \"k\"s to see which one was causing the problem (sometimes it was both), and did the modification(s) there, and then regenerate a new Regular. <br> <br>So the eventual Regular was a little different (and ended up lighter) than my original design, but it wasn't really worse, and it was a \"clean\" interpolation. And I got a clean Demi with no extra work. <br> <br>hhp </p>"
