    html: <p>I took a little time to stydy the letterforms again and think I see something that could use a little improvement. I noticed the counters on the thicker weights seem to have too confined counters which offsets the visual balance in the letterforms.I believe this is one of the drawback from generating multiple weights with software solutions such as Fontographer. I think the best way to correct this is to actually redraw the thicker weights so the letters are actually a little wider. This is obviously very time consuming so I guess it depends on what level you wish to take this to. Alias's Gareth Hague and David James's Metsys is a good example of what I am talking about. I spent $180 on this 5 weight face, which is more than I am normally willing to spend on a non-text family, but I have used it on lots commercial work, and in my opinion it was worth it. I think it would be worth the extra effort if you want to sell this font commercially. <br> <br><img src="http://www.typophile.com/forums/messages/29/843.jpg" alt="metsys.jpg"></p>
