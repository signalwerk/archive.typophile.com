    html: <p> On the topic of remixing typefaces, De-construction, Revivals, etc. I think that it is nice to see old work reworked into something new. A good example would be the work of Swiss designer Cornel Windlin who created a rough typeface called FF Magda (fontshop/Lineto) which was the reworked into Magda Clean by Critzler. I believe it was later reworked into something else altogether. I would like to see more of this, as long as the original designers are getting the proper credit and fees. I would like to interest anyone in this type of collaboration with a couple of my own typefaces. (see Unicratica posting in SanSerif section) </p>
