    html: "<p>Joshua — <br><br>James Montalbano turned me on to <i>Trout and Salmon of North America</i> by Robert J. Behnke, designed by Charles Nix. Nix is a great book designer and this is a marvelous book. I don’t own it and I haven’t spent as much time as I’d like looking at it, but it’s on my list. <br><br>Percolator, out of Minneapolis, also does some nice book work. <i>A Degree of Mastery: A Journey through Book Arts Apprenticeship,</i> by Annie Tremmel Wilcox, is one of theirs that I enjoyed. <br><br>— Kent. <br></p>"
    html_clean: "<p>Joshua — <br><br>James Montalbano turned me on to <i>Trout and Salmon of North America</i> by Robert J. Behnke, designed by Charles Nix. Nix is a great book designer and this is a marvelous book. I don’t own it and I haven’t spent as much time as I’d like looking at it, but it’s on my list. <br><br>Percolator, out of Minneapolis, also does some nice book work. <i>A Degree of Mastery: A Journey through Book Arts Apprenticeship,</i> by Annie Tremmel Wilcox, is one of theirs that I enjoyed. <br><br>— Kent. <br></p>"
