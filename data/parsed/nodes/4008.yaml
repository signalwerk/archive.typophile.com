    html: '<p>Here’s a list of Dwiggins’ books (that he designed): <br><br><a href="http://www.lib.umd.edu/RARE/SpecialCollection/dwiggins/annotatedinventory/part3.html" target="_blank">http://www.lib.umd.edu/<span class="caps">RARE</span>/SpecialCollection/dwiggins/annotatedinventory/part3.html</a> <br><br>I was lucky enough to ﬁnd a copy of “The Shaving of Shagpat” in New Orleans. Check Alibris.com and the other out-of-print book sites. <br><br>Barry Moser’s <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0670887978/102-1729795-5384160?v=glance" target="_blank">Bible</a> is also very nice. <br><br>I also think Mr. Lew should have mentioned the <a href="http://www.kentlew.com/GardenBirds.html" target="_blank">book</a> he features on his website. I’d like to get my hands on a&nbsp;copy.</p>'
