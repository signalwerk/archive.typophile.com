  html: '<p>I recently went to the following a <span class="caps">AIGA</span>/Art Center lecture on book design: <br><br>Stories About Book Design.* <br><a href="http://www.aigalosangeles.org/events/archives/000479.php" target="_blank">http://www.aigalosangeles.org/events/archives/000479.php</a> <br><br><br>Anne Burdick <br>Simon Johnston <br>Tracey Shiﬀman <br><br><br>It was a great event. We saw some great work and heard some really inspiring stories. <br><br>So, I wanted to know what the typophile community thought were some of the best designed books out there. Not “design or typography books”, but books on other ﬁelds or subjects.  Also who do you think is doing good book design out there. <br><br><br><br>-j <br></p>'
  html_clean: '<p>I recently went to the following a <span class="caps">AIGA</span>/Art Center lecture on book design: <br><br>Stories About Book Design.* <br><a href="http://www.aigalosangeles.org/events/archives/000479.php" target="_blank" class="link-external">http://www.aigalosangeles.org/events/archives/000479.php</a> <br><br><br>Anne Burdick <br>Simon Johnston <br>Tracey Shiﬀman <br><br><br>It was a great event. We saw some great work and heard some really inspiring stories. <br><br>So, I wanted to know what the typophile community thought were some of the best designed books out there. Not “design or typography books”, but books on other ﬁelds or subjects.  Also who do you think is doing good book design out there. <br><br><br><br>-j <br></p>'
