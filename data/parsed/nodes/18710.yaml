      <p>It seems Stefan Ellmer’s <a href="https://www.behance.net/gallery/13585057/Typeface-Ur-1927" rel="nofollow">Ur 1927</a> comes quite close to what I’m looking for. Examining your example site, I find that the dotted ‘r’, which I thought I particularly liked, doesn’t work well with ‘y’ following it – it’s a rare combination in German, but frequent in English, and a ‘u’-based upsilon might look better.</p>
      <p>The Architype version I had seen already, but like with so many typefaces, it’s hard to find a good documentation of the actual glyph repertoire and OT features. (Font) designers tend to advertise their products with pretty examples <em>only</em>, forgetting about tech specs.</p>
