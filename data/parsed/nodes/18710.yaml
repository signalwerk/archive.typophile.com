      <p>Thanks Tiffany.<br>
      I never became eccessively affectionate with Futura, but I think the problem is that I have become accustomed to the typeface in its early digital formats. very limited, and based on a single point size, while I cherished a great number lead types which were still in use in the 1970s here in Italy.<br>
      For example, I think there is no comparision with the original Monotype lead version of Gill Sans in all its point sizes, and their digital version.</p>
      <p>If someone will make the effort to design a few good master sizes, and with the quality which seems to have the Neufville Digital ND version (I think Robert Trogman is right about the accuracy), we will probably have an adequate Futura for every page format with all the needed sizes.</p>
