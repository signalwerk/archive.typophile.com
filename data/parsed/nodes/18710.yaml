    date_raw: 22 Mar 2006 — 1:16am
    votes: null
    html: |-
      <p>Yes, Adobe's Futura surely isn't that good at all, for example if you set it without linespacing (as was called "Kompress" in the days of metal type over here in germany) ascenders and descenders will overlap. That surely woudln't have happened with metal type, so that's a technical fault to Adobe Futura, at least to my understanding.<br>
      On the best version, that's a bit down to personal taste i think, as the different digitizings have different approaches or emphasize different aspects and qualities of Futura:<br>
      The URW version seems to stress the somewhat elegant quality Futura has and appears pretty thin to me, whereas the Berthold BQ version seems much more stable and robust to me (and if you look at old prints of Futura, it surely had that quality as well and didn't come across as the super-elegant thing we're used to from cosmetics packagings and the like today!)<br>
      So my personal vote would be for the BQ-version if i had to buy it – the strange thing is Futura is one of the faces i love, admire and respect the most – but never use it! :-)</p>
      <p>p.s. besoides the best digizings issue, it's such a shame that the different optical sizes that were made for Futura metal didn't survive into the digital age…</p>
