    html: |-
      <p>Our web site designer is recommending Futura MdCn BT for a couple of uses, notably titles. I want to revise templates in our publications to match the web site, but our analysts' needs are rather different from our web site designers....</p>
      <p>Futura MdCn BT has about the ugliest micron char I've ever seen, and lacks all other Greek chars. The URW char set is much more complete. However, the <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/futura/t-medium-condensed/opentype-ps/261972/charmap.html?vid=261972&amp;cpselect=UNI8" rel="nofollow">Greek section</a> is inexplicably missing a only few chars (Omega, Delta and mu), which are naturally the ones we use in formulas the most frequently. The Greek version of the font has all those chars, but loses many mathematical operators. *sigh*</p>
      <p>EF's Md Condensed has the Greek chars we need, the mathematical operators, and comes in ital, so that looks like the winner for now. I wish we could have small caps, too, but sometimes we have to be practical!</p>
    html_clean: |-
