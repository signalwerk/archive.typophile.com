    <p>Greater Albion Typefounders has just released three faces on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/crewekerne/ " rel="nofollow"> Myfonts.com</a>.</p>
    <p>Crewekerne, Crewekerne Magna and Crewekerne Magister are three related typeface families which speak of the villages that are at the heart of English life. They are inspired by the arts and crafts movement of the early twentieth century. Three widths – condensed, regular and expanded and three weights – regular bold and heavy are offered. Crewekerne is especially good when combined with its two complimentary families and when used in poster and design work that needs a rustic hand crafted flair but still needs to be easily legible.</p>
    <p>Why not try them out for yourself on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/crewekerne/ " rel="nofollow"> Myfonts.com</a>. In the meantime, there are examples of the Crewekerne faces in use on our  <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
