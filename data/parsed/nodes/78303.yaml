      <p>Sorry, but it reads "aTSZEN" because the <em>c</em> is morphing into the <em>i</em> and the second <em>i</em> doesn't match the first. </p>
      <p>When I lose objectivity, I have to take an overnight break from the project. I also find it helpful to print it out at multiple sizes; it's truly amazing what paper and ink reveals.</p>
