    <p>Hey crew,<br>
    I'm designing a logo typeface for a contemporary culture magazine: Citizen Magazine.<br>
    It's a rough sketch but I've been slowly chopping away at it for a while and I just can't look at it anymore in a critical way.</p>
    <p>any feedback?</p>
    <p>thanks</p>
