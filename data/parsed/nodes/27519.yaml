    <p>So I’m doing a last minute small run of biz cards for Typecon as I’ve just registered a domain that will point to my new portfolio site: <a href="http://www.dsinelab.net/dave/index.html" title="http://www.dsinelab.net/dave/index.html">http://www.dsinelab.net/dave/index.html</a> (temp location) I’m trying to keep the site, resume and biz cards of the same family so they feel cohesive but I don’t know what to do about the card. Here is what I have so far...hopefully there’s still a few people who aren’t on their way to Boston.</p>
