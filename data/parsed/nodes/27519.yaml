  - id: 152320
    user: 8916
    date: 2006-08-08T13:12:00
    date_raw: 8.Aug.2006 1.12pm
    votes: null
    html: <p>Letterspace all your capital letters and numbers at the lower right. They are hard to read right now. If they are full caps (and you are in Illustrator) try setting tracking to 100 and work down from there. If they are small caps, start at 50 and work up. Also the type at the lower right is too big. If you are printing litho, you can go as small as 5 pt with that kind of slabby serif in all caps. 7 pt is probably more realistic. It will add some depth to the card.</p>
    html_clean: <p>Letterspace all your capital letters and numbers at the lower right. They are hard to read right now. If they are full caps (and you are in Illustrator) try setting tracking to 100 and work down from there. If they are small caps, start at 50 and work up. Also the type at the lower right is too big. If you are printing litho, you can go as small as 5 pt with that kind of slabby serif in all caps. 7 pt is probably more realistic. It will add some depth to the card.</p>
