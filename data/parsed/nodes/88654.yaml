      <p>I’m sorry – this information is a bit late, but these titles by the Catalan historian Albert Corbeto, two of which have just reached me, are worth looking for:</p>
      <p><em>Tipos de imprenta en España</em>. Valencia: Campgràfic, 2011.</p>
      <p><em>Daniel B. Updike, impresor e historiador de la tipografía.</em> Valencia: Campgràfic, 2011.</p>
      <p>The first is a general overview of type in Spain, which may be the first thing of its kind. Certainly the most comprehensive and carefully researched.</p>
      <p>The study of Updike deals with his fascination, which became almost an obsession, with Spanish books and culture generally, and it includes a translation of the chapters on Spanish types from <em>Printing Types</em>, with a long introduction and a commentary. Updike put together one of the best collections of early Spanish type specimens made by any private collector, and he went on adding to it after the first edition of his book was published. They are now among the Updike materials in the special collections of the Public Library at Providence, RI.</p>
      <p>If you want more detail, there is Albert Corbeto’s list of early Spanish type specimens:<br>
      <em>Especímenes tipográficos españoles: catalogación y estudio de las muestras de letras impresas hasta el año 1833.</em> Madrid: Calambur, 2010.</p>
      <p>A knowledge of Spanish will help, obviously. But there are plenty of images, many of them not published elsewhere. All recommended.</p>
