      <p><cite> &gt; If I could find a typeface produced exclusively in mid-17th Century Spain, that would be perfect</cite></p>
      <p>There really weren’t any type founders of significance in Spain before the mid 1700s. Most of what you’re seeing in your exemplars would have been imported from France or the Netherlands, as previously noted.</p>
      <p>If you’re intent on a truly Spanish type, by a Spanish punchcutter, following those Dutch models, then you might look at the work of contemporary Portuguese type designer <a href="http://www.felicianotypefoundry.com/" rel="nofollow">Mário Feliciano</a>. He has done historical revivals (not all of which have been released) based on the works of Spanish punchcutters Espinosa, Pradell, <a href="http://www.teff.nl/fonts/geronimo/index.html" rel="nofollow">Gil</a>, <a href="http://vllg.com/Feliciano/Merlo" rel="nofollow">Merlo</a>, and <a href="http://vllg.com/Feliciano/Rongel" rel="nofollow">Rongel</a>.</p>
      <p>But again, these punchcutters were all working a century later than your target.</p>
    html_clean: |-
