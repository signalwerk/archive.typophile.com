    <p>I'm looking to replicate a (fictional) book printed in mid-seventeenth century Spain, and can't seem to find any info on the typefaces used there during that period.</p>
    <p>Most examples I have found look similar to Caslon, but his types weren't produced until after 1722. Can anyone point me in the right direction?</p>
