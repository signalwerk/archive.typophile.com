      <p><a href="http://en.wikipedia.org/wiki/Antonio_V%C3%A1zquez_de_Espinosa" title="http://en.wikipedia.org/wiki/Antonio_V%C3%A1zquez_de_Espinosa" class="link-external">http://en.wikipedia.org/wiki/Antonio_V%C3%A1zquez_de_Espinosa</a></p>
      <p>You can argue things seven ways from Sunday. I like Espinosa Nova because after my inevitable kerning work &amp; a few other touches, I think the fonts both set and print well, esp. on an uncoated sheet. They may be a touch light with coated stock. (I haven't yet seen anything printed with Espinosa Nova on coated stock. One coming, from University of Texas press.)</p>
      <p>Whether or not this meets Duncan MacLeod's "immortal goal" is another matter.</p>
