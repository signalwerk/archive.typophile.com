      <p>Printing in Spain in the 16th, 17th, and even 18th centuries was largely influenced by the French &amp; the Low Countries. </p>
      <p>Religious printing in Spain was held in monopoly by Christophe Plantin (of Antwerp) and his heirs for centuries. The types of Plantin-Moretus — cut by the likes of Guyot, de Sanlecque, Granjon, and Le Bé — undoubtedly influenced other Spanish printers heavily.</p>
      <p>(cf.: <a href="http://www.fontbureau.com/blog/mike-parkers-story-type-8/" title="http://www.fontbureau.com/blog/mike-parkers-story-type-8/">http://www.fontbureau.com/blog/mike-parkers-story-type-8/</a>)</p>
      <p>Iñigo Jerez’s Quixote, mentioned by Ben above, although a stylized interpretation, is not far off the mark, I would think.</p>
      <p>If you’re looking for more information about the period, you should consult Updike’s <cite>Printing Types</cite>, Vol II., Ch. XVI “Spanish Types: 1500–1800”. Although Updike is not infallible, nor without his biases, his overview is valuable nonetheless.</p>
