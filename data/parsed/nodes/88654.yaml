      <p>Hi there, thanks a lot for your interest about our foundry…</p>
      <p>We think that the following font : "1584 Pragmàtica Lima" may be right :<br>
      It was inspired from the set of fontfaces used in Lima (Peru) by Antonio Ricardo to print in 1584 the first publication ever printed in Southern America : a four page leaflet in Spanish untitled "Pragmàtica sanciòn" with the information about the new Georgian calendar of 1582 who was not yet communicated to the colonies. We have used a copy from one of the genuine documents sent by a Spanish correspondent.<br>
