      <p>Close, but they're not quite "right." Just to clarify; I'm not necessarily looking for a completed font. I pretty much figured that I would need to make the font myself - I was just looking for some info on what typefaces were being used in that area at that time.</p>
      <p>Now that I'm looking at fonts, Garamond’s letterforms look pretty close, and they were produced at the right time. Were they being widely used in Spain c. 1650?</p>
      <p><img src="http://upload.wikimedia.org/wikipedia/en/6/64/Original-CG.gif" alt="Garamond Example Image"></p>
      <p>I basically just need a jumping-off point. The font will need to be pretty distressed, so I'll probably end up making my own version of whatever typeface it is.</p>
      <p>The reason I'm being a bit fussy is that the book in question won't have any identifying printer's marks and is located as to time and place by internal typographical evidence only, so it needs to be fairly accurate. If I could find a typeface produced exclusively in mid-17th Century Spain, that would be perfect, but I don't want to get my hopes up.</p>
      <p>Pretty much anything that will "pass" as period correct with the correct letterforms will do. I know I'm asking a pretty odd question, so thank you all for your patience. ;)</p>
