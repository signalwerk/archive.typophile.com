      <p>My thanks to each one of you for your thoughts and suggestions. They are all appreciated, but I would like to respond to a couple of folks individually:</p>
      <p>@Riccardo:<br>
      <em>As long as it’s not a hundred years late</em></p>
      <p>Ha, ha, you're right of course! :)<br>
      Gilles Le Corre's (GLC) fonts look great, perfect for all my oddball "period" printings. I myself have made a period correct 1770s American Colonial "Caslon Pamphleteer" font, so I can appreciate all of his hard work. I'll keep his fonts in mind for future projects.</p>
      <p>Regarding the Fell types; I had thought seriously about using them, but wasn't sure if they would have been used in Spain at that time, hence the posting here for clarification.</p>
      <p>@Kent:<br>
      Thank you so much for all the historical info - that's exactly what I was looking for. The recommendation for Updike’s <em>Printing Types</em> is especially welcome; I hadn't heard of that before. I'll be spending this weekend reading both volumes! His notation right at the beginning of Ch. XVI explains well why I was having trouble tracking down relevant information:</p>
      <blockquote><p>English authorities for the history of Spanish typography from 1500 to 1800 are few. There appears to be no readily accessible survey of Spanish printing for the sixteenth, seventeenth, and eighteenth centuries, even in Spanish... In English there is little in the way of a continuous narrative, though Mr. H. Thomas's paper on <code>The Output of Spanish Books in the Sixteenth Century</code> (Transactions of the Bibliographical Society, Sept., 1920) may be consulted with advantage for this period.</p></blockquote>
      <p>Your comment about there not being any type founders of significance in Spain before the mid 1700s was also summed up nicely by Updike:</p>
      <blockquote><p>For Spanish printing, the seventeenth century was a discouraging period. The types in use were chiefly roman; the first edition of <code>Don Quixote</code> being printed from uncouth, old style roman fonts.</p></blockquote>
      <p>That pretty much explains it. I also found this passage amusing:</p>
      <blockquote><p>Spanish books of this period are much like the wretched productions of the Italian press—with congested title-pages, composed in letters too large for the page, ill printed, and decorated (or at least supposed to be) with badly executed typographical ornaments. The type was generally a crude old style roman letter.</p></blockquote>
      <p>Ha! Perfect! That suits my lack of book design skills perfectly! Sloppy, badly executed productions are my specialty! ;)</p>
      <p>Thanks again for everything, folks. That gets me on the right path, indeed.</p>
