      <p>Three different ornamented styles from the early 19th century. Some foundries packaged different styled fancy letters and numbers in an alphabet fantastique. Off hand, I don't recall a digital font with any these particular numbers. Your source is perhaps based on 19th century clip art?<br>
      Don</p>
