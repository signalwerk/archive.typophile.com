      <p><em>More than a few academic publishers have a contract with NetLibrary, which requires a PDF with full font embedding.</em></p>
      <p>There needs to be a solution for this general problem, be it web or print. </p>
      <p>One solution is for publishers to commission custom typefaces for which they can purchase rights up-to-and-including perpetual exclusivity. There comes a point where licensing existing commercial fonts for either a large install base or electronic distribution becomes more expensive than commissioning a custom font family. If individual publishers cannot afford to commission their own typefaces, they can join with others to pool their resources (as the members of the SBL Font Foundation have done). Such a solution works particularly well for academic publishers, since they tend also to have specialised requirements that existing commercial fonts may not support.</p>
