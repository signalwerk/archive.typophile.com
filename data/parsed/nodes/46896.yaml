      <p><cite>James, I do like your idea, ...</cite></p>
      <p>I do too. For web work, that is. But there is a drawback -- a typographical (quality) one! People (not "us people", "them people") will perceive these fonts as <em>free</em> fonts. No matter how stringent the license is (i.e., in full caps, bold, red, "For Web only"), people will want to use the fonts in print <strong>because</strong> they can see them on the screen.<br>
      No matter how good the screen rendering of Verdana, Arial, Tahoma, and Times New Roman, I already have had a fair number of struggles with "them people" to try and convince them these are <em>screen</em> fonts, and we purchased CDs full of real, licensed fonts, just because they look better in print. It's not (purely) anti-Microsoft snobbery.</p>
      <p><cite>[..] web page designers don’t want new fonts, they want to use the fonts they’re currently using in print ..</cite></p>
      <p>.. so you'll bound to get a Fronklin Web family, a Footoora, a Jensoon, etc. After that, follow-ups will ask for <em>this</em> fonts to be used in print -- because those are the fonts the web-designers use ...</p>
      <p>Everything on the Web is free. Quality is expensive. And them people will pick the free stuff.</p>
      <p>(sigh.)</p>
