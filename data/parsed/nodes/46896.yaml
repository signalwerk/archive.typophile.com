      <p>It’s nonsensical to claim that IE has ≈75% market share, so Microsoft has to go along with this business if everyone else does.</p>
      <p>First, which version of IE? 7 is much better than 6, which is barely even a browser in any rational definition of the term.</p>
      <p>Who’s going to want to use Web fonts? A few Flash assholes, maybe, sure, but mostly standardistas of the Jason Santa Maria ilk. The only browsers they use are good ones; maybe they test certain layouts in IE7, but that will be it for pages that use Web fonts. Importantly, the readers of the sites that use Web fonts also will be using at least IE7, IE8, or, much more rationally, Firefox or Safari.</p>
