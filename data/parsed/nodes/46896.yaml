      <p>For anyone interested in finding out more about Robert Norton, John Berry's article is a starting point . . . . </p>
      <p><a href="http://www.creativepro.com/article/dot-font-the-mischievous-mind-behind-microsoft-s-truetype-fonts" title="http://www.creativepro.com/article/dot-font-the-mischievous-mind-behind-microsoft-s-truetype-fonts">http://www.creativepro.com/article/dot-font-the-mischievous-mind-behind-...</a></p>
      <p>The first paragraph reads,</p>
      <p>'For a few short years in the early 1990s, Robert Norton had a decisive influence on something the great majority of us use and take for granted: the typefaces that accompanied a whole slew of Microsoft software products, including Microsoft Windows and software available for the Mac. Norton was "the cornerstone of Microsoft's type group," as Nicolas Barker put it in his obituary in the "Independent." He was largely responsible for the selection and creation of typefaces for Windows and all other Microsoft software, including Word and Office.'</p>
      <p>Norton did a lot of big things. One of them was saving Monotype from disappearing; without him, one can now see, there would be no Monotype, no Agfa, no Linotype. And so much else. And yet could take time out to critique something as unimportant as my early work which, by the way, Joe Clarke 'disapproved' of.</p>
