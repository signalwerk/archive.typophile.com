      <p>Nick says, '... started thread ... trojan horse ... push agenda...'</p>
      <p>and he should know.</p>
      <p>As to his points:</p>
      <p>&gt;1. Typophiles idealize the less-than-perfect effect of old letterpress printing (i.e. the concept of a good type design as one that can take a lot of abuse)&lt;</p>
      <p>That isn't why we idealize letterpress printing. We idealize it because each size can be perfectly optimized, which on a parallel level is what David is talking about. One of these days, Nick, you'll read an old book, and you'll get it. </p>
      <p>&gt;2. Users can optimize screen type size to their liking—isn’t that the Big Idea?!&lt;</p>
      <p>No. The idea is that simple scaling -- size -- doesn't work -- for a hundred and one reasons. We've known this since the invention of the pantograph, but every now and then we need to be reminded. The problems are far worse than they were because of the limited resolution of smaller and smaller screen devices and the very slow progress to higher res (see below)</p>
      <p>&gt;3. Screens are getting finer all the time.&lt;</p>
      <p>Where? Eight years ago, in 2000, Dell offered an inexpensive, pathbreaking 1600x1200 display on a 15" laptop -- that's 133 dpi. Two years later, Dell offered 1920x1200 -- 150 dpi -- on a 15" machine. At present, Dell mainly offers 1920x1200 on a 17" model, so we're back to 133 dpi. </p>
      <p>In other words, it's been six years since, quite cheaply (BTO addition of $100-200), we could get 150 dpi, and now we're offered less, rather than more.</p>
      <p>Not to mention that it is _only_ this year that Apple finally offered a 133 dpi screen - - at last - - as a special BTO option on its 17" laptop.</p>
      <p>Not to mention that David (and others) had been using 120 dpi CRTs since back - - when? the late 80s? Basically 20 years ago? I know I had them in 1992. Sigmas? And 150 dpi was available by the mid-90s. </p>
      <p>So the sad truth is that in 20 years, we have not (except for some very high end equipment used in medical and other applications) been able to get much further than the 120 dpi we could achieve back then.</p>
      <p>This is not, Nick, a case of screens 'getting finer all the time.'</p>
      <p>I don't know why the progress is so slow, but it is.</p>
      <p>By the way, the 600 dpi LCD that Xerox touted quite some time ago was, it appeared on further inspection . . . a 150 dpi screen with subpixel anti-aliasing . . . . . . . </p>
      <p>Indeed the entire reason that subpixel anti-aliasing has had to be invented (I mean implemented) is that screen resolution has been essentially static for 20 years. Why this should be so, I don't know . . . . . probably mainly because most users don't care. Just like most users don't care about size-optimized type, whether it's in print or on screen. They can recognize that it is superior, but they're not going to make a compelling economic case for it.</p>
