      <p>&gt;Also, I said, “hopefully you saw MS’s Mr. Hill’s presentation of last year?” because it was about readable screen fonts being a technical problem with exclusively technical solutions, and not design problems with design solutions. Then you said: “all this discussion seems to be trying to come up with a very complicated technology solution for something that really isn’t a technology problem”, which made me laugh.&lt;</p>
      <p>I aver that the solution can only come about through the joint efforts of design and technique. (Who reads 'Computer Modern'?) And though my respect for Bill Hill could not be greater, I can't help remembering the kerfuffle that arose when he patented sub-pixel positioning for Microsoft only to discover that the fundamental technology had already been disclosed by Wozniak at Apple about two decades before. </p>
      <p>One could get the impression from many of Berlow's postings that he has some real communication problems. But go over to his blogs at rogerblack.com, and a careful examination will show that his mastery of every aspect of screen font rendering is unparalleled. As well, his ability to explain something, when you can finally get him to be serious, is exceptional. I learned a lot from spending a few minutes with these articles. </p>
      <p>I will be spending some more time over there, trying to understand fully what is going on, but as I understand it now, Berlow's solution for better screen fonts is narrowly graded, size-specific scalable types. Perhaps not surprisingly, this is analogous to what Sumner Stone has found to be the only real solution for fine printing: narrowly-graded, size-specific, scalable, types. Surprise, ta-da. Just what we (I mean some of us) always suspected -- those of us, that is, who _don't_ think it is easy to make size-specific outlines.</p>
      <p>It's a lot of work; it can't be done mechanically; it needs a vast understanding of the typographic language. After a comparatively short time floundering in type -- 15 years -- I can only identify three people who have, albeit overlappingly, an understanding of the joint technical and aesthetic problems we still need to solve: Carter, Stone, and Berlow. Apple, MS and the browser people can do what they want, and will, but without those three, preferably harnessed together, Apple, Microsoft and their collaborators, despite their justly lauded technical might, will never attain the goals they seek. </p>
      <p>Is it unfair to name names? Well, posers have to be put in their place every so often.</p>
