      <p>My first post was all I could come up with in two hours. I anticipated most of your criticisms and have taken the idea further on.</p>
      <p>How an FMF might be made viable:</p>
      <p>* make it a <strong>private</strong> wiki, <strong>for profit</strong><br>
      * professional type designers and font makers only, no amateurs please<br>
      * this is not a job for Joe Public. The general public will not be building fonts, nor will they be comenting on their creation.<br>
      * forget about the mess that is Wikipedia, the wiki thing only applies here in two parts: 1) user community and media interface (using wikimedia software) for getting the collaborative font design and building work done. 2) a "wiki-like" philosophy of open collaboration between professionals who all know precisely what they (we) are doing.<br>
      * would not be subject to the chaos caused by Wikipedia's policy of complete freedom of anyone to edit anything, or the problems inherent in getting anonymous contributors to write a general reference encyclopedia.<br>
      * needs seed funding from the big guns in the type business &amp; the design industry to get it going, but after that, users pay for font usage on the web on a subscription-based licensing model.<br>
      * contributors all get paid for their work, but the amount of work you contribute is on a volunteer basis. We, the guys and gals who make fonts commercially, contribute as much or as little time as each of us can spare.<br>
      * the fonts in the media foundation will not be free, nor will they be distributable. Only user agents (browsers) will be able to access the font data and media.<br>
      * stop thinking of it as freeware.</p>
      <p>Other points of contention:<br>
      * the advantage of FMF to Apple, Microsoft, Adobe et al, is that existing commercial, retail and proprietary font licensing models do not need to change at all.<br>
      * Apple is first to introduce a browser supporting @font-face, yet they remain opposed to licensing their fonts for web use. As Yves Peters once said, Choose a position and stick to it, guys. Introducing a supporting user agent is, in my view, a persuasive reason why Apple should stick to their guns with their font licensing, but give me some computers and cash to get FMF going.<br>
      * if Microsoft introduce a supporting version of Internet Explorer, they could back it up with similar resources.<br>
      * if W3C want to introduce the CSS @font-face rule they should help pay to set it up, or at least contribute staff and resources to help set it up and keep it going.</p>
      <p>I'm really trying to look forward with this. <strong>Design a way forward</strong> tackles the most solid object here: the font industry's existing font licensing models are inappropriate, outdated and outmoded. They don't have to change, but the people involved could contribute some time and skill to creating the alternative---a library of fonts that do what web designers and CSS need them to do.</p>
      <p>It's either that, or them peoples will be using them free fonties like there isn't no tomorrow.</p>
      <p>Now can I has a cookie?</p>
      <p>j a m e s</p>
