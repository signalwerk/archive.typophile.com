      <p>The 1995 Microsoft Font Pack was said by InfoWorld to have made more money than all font foundries from the beginning of time. Nearly everybody who bought Windows 95 seemed to have bought it, for $99. Why not make that the standard? No restrictive licenses, and it can be had on eBay 'buy it now' for a whole 49 cents. </p>
      <p>You can't even _find_ Corel Draw 5, with its 1000 top quality fonts in TT and PS on eBay, that's how valueless it is. Again, no restrictive licenses.</p>
      <p>Seriously, it is just BS to suppose that anyone will ever pay for web fonts, or even that they have any value. </p>
      <p>Print publishers are 99.5% delighted with the 99.5% low-quality fonts they use everyday. Their customers are not complaining. </p>
      <p>Micro-payments are never going to exist.</p>
      <p>This discussion can't be rationally held without letting go of the fact that, post-PostScript, nobody is _ever_ going to make huge money on fonts again. That is the meaning of the technology we have today.</p>
      <p>Add to that the overwhelming demographic fact that the few of us who still believe software should be paid for will be completely extinct in 50 years.</p>
