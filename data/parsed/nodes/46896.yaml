      <p>It does seem like there would be a mint to be made if you could charge micro payments like google does for rendering a site in the right font for it's users without exposing the the Intellectual property of the font to risk. Maybe sfir will get better and allow kerning and CALTs and so on... I am not sure but it looks to me like sfir is WAY to slow to render whole sites and that probably cannot be helped - ever. Probably the rendering does have to happen locally for it be a fast/tasty solution.</p>
      <p>With all this technical trouble, the wisdom of John's comments about commissioning new designs does carry lots of weight. </p>
      <p>The problem with that model is that it is geared to a narrow part of the font using market. A part of the market that is very organized and has specific ideas about what it wants. It's a formal market. I am not dismissing it, just characterizing it.</p>
      <p>A bigger ( by volume) part of the market would be served by a service of the kind I have outlines above. That is a more casual market.</p>
