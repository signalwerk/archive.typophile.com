      <p>Joe Clark writes, </p>
      <p>&gt;Berlow always acts like he knows more than us and we’re fools to think what we do. (Actually, that’s his nickname right there: David “Fools!” Berlow.)&lt;</p>
      <p>He doesn't know it, but he's echoing something one of the late great men of type, the much-loved Robert Norton (who among other things in a long, important life in type brought Matthew Carter to Microsoft if memory serves) wrote about David Berlow more than 15 years ago:</p>
      <p>"We first learned to love Berlow when he was at Bitstream, when we could rely on him for ironic comments on whatever show or seminar we happened to be at. It became harder to love him as his career progressed and Font Bureau was started and shouldered its way into what is known as the 'leading ledge' of font technology and it became clear that he was getting to know more than the rest of us. Perhaps the reason we are still delighted to eat with him is that he hasn't yet got round to rubbing our noses in it."</p>
      <p>Joe, nothing has changed. Berlow still knows more than the rest of us - - and he still doesn't rub our noses in it - - even when they're a bit snotty.</p>
      <p>Nick, reading your post, it seems your insight is that Cochin is more readable than Georgia. Am I misreading something?</p>
      <p>Gosh! At this rate, maybe someday someone somewhere will call me polite.</p>
      <p>Again, for those actually interested in learning something new . . . . <a href="http://www.rogerblack.com" title="www.rogerblack.com">www.rogerblack.com</a> has got some cool stuff.</p>
