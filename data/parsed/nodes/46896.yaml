      <p><em>it seems your insight is that Cochin is more readable than Georgia. Am I misreading something?</em></p>
      <p>I don't believe typefaces have inherent readability.<br>
      Nothing happens till a face is set in a particular layout and read by a particular person in a particular environment.<br>
      For this thread, following David's lead, I set Cochin small in TextEdit, compared it with Georgia, and rather liked the effect of its small x-height.<br>
      Perhaps it is like an amber ale, great in small amounts--but then, the Web is all about a tipple here, a tipple there.<br>
      Why drown in the same old fonts all the time?</p>
