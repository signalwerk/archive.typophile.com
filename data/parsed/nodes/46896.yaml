      <p>I'm going out on a limb here with a suggestion. Some people will think this idea laffable. Let them eat cake, or frosted fonts. It worked for Wikipedia founders Jimbo Wales and Larry Sanger, so...</p>
      <p>Here is what I think we should do: <strong>design a way forward</strong> by starting up a Font Media Foundation. F.M.F is to be an "open font media" bank, whose goals are as follows:<br>
      * assemble an open library of "open licensed" fonts designed specifically for web and new media use<br>
      * all FMF fonts to be <strong>new creations</strong> wiki-made by the world's leading font makers<br>
      * it works like the Wikimedia Foundation and the Wikimedia Commons---except this is a Font Commons, initially for comon fonts long out of copyright, but eventually more and better stuff<br>
      * font maker contributors start fonts and hopefully finish them. Contributors work on each other's fonts and hopefully finish them. It all takes place online in a wikimedia-powered environemnt. Eventually a big pile of great fonts get wiki-built.<br>
      * font maker contributors don't get paid money. You do as little or as much as your commercial schedule allows<br>
      * philanthropic contributors required to seed the project---Microsoft, Apple, Opera, Mozilla, W3C, Yahoo/Flickr, Google, AIGA, large design and ad agencies to provide seed funding and computers to host the font data<br>
      * webpage designers and publishers who use the service FMF provides to be encouraged to make cash donations to the foundation, especially those who make commercial use of fonts held in the library. That kind of voluntary ongoing funding worked for Wikipedia and the Wikimedia foundation, so it could work for us.<br>
      * if it's a success and the cash donations run into profit, I am more than happy to accept payment for my part in proceedings. In that case other contributing font makers and contributors should get paid too.</p>
      <p>I'm ruling out adding existing fonts from any existing foundry catalog, especially the well-known retail and popular ones, regardless of their EULA types and terms, as a way of avoiding confusion and legal hassles.</p>
      <p>A lot of people said Wikipedia would or could never work, but five years+ down the track it's the standard general reference on the web and still going strong. It's still something of a mess but the areas that really matter like science, history, the arts, politics and so on have been in great shape for several years already. I did my bit for typography at Wikipedia and now I would like to return to making fonts and getting a central wiki-authored font bank going as soon as humanly possible.</p>
      <p>If the graphic design and web design industries want to avoid the looming spectre of the great web fugly and want decent fonts available online 24/7 to use on webpages—you are going to have to help pay for it. Fonts don't grow out of the ground. If commercial font makers like myself, David, Nick and others represented here at Typophile want to avoid the next big piracy nightmare and contribute to the solution—this is the way to go. We are going to have to co-operate and wiki-author fonts together.</p>
      <p>I am willing come over there and help you guys set it up. It needs a charter and a steering comittee / board of directors. It needs a Tiffany too : ^ )</p>
      <p>All suggestions and criticism welcome.</p>
      <p>What else? I am very busy with my Harold Lohner conversation project right now but I will try find time to come back to this tomorrow.</p>
      <p>j a m e s</p>
