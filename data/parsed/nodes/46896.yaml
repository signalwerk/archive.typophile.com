      <p>"That isn’t why we idealize letterpress printing."</p>
      <p>True. But it is why much of the general market idealizes (or even idolizes) it. </p>
      <p>"No. The idea is that simple scaling — size — doesn’t work"</p>
      <p>Again, true for type designers, but probably just fine for most folks.</p>
      <p>"So the sad truth is that in 20 years, we have not...been able to get much further than the 120 dpi we could achieve back then."</p>
      <p>*Sigh*. That is true. Nearly everything in computing has improved at an exponential rate (storage sizes, memory sizes, processor speeds, printer quality, color depth, size) EXCEPT for display resolution. </p>
      <p>That said, we're on the cusp of perhaps a long-overdue bump. The iPhone is at 166ppi. The Sony reader is at 170ppi. Still a long ways to go, but finally picking up a bit of momentum. Also keep in mind that screen ppi and print dpi shouldn't be compared via a 1-1 correlation given that type on paper is typically limited to 1 color, while a screen can take advantage of the color spectrum (though that does then get us back to wanting better screen optimized type...)</p>
