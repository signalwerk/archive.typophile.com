      <p>James, I do like your idea, it mirrors some suggestions I threw out a while back (in response to this <a href="http://www.designwritingresearch.org/free_fonts.html" title="http://www.designwritingresearch.org/free_fonts.html">http://www.designwritingresearch.org/free_fonts.html</a>). My model required that type designers get paid, had an international focus, and required a NickNeg style charismatic front-man to hit up Google, et al for the cash. </p>
      <p>Why type designers need to be paid... In the historically accurate “300” movie King Gerry Leonidas asks various members of the volunteer Greek army what their professions are – “sculptor”, “baker”, “candlestick maker” come the replies. He turns to the Spartans and asks them what their profession is, with one voice “type designer”. There is a role for amateurs, beginners, students, foundry people, etc., in an effort like this, but if you’re building a library of quality typefaces for the world (not just the Web) you need the best of the best, and you need to pay them. I think we proved that to be the case with Verdana, and Georgia? Matthew and Tom are the Spartans of type design. Anyone disagree?</p>
      <p>However, biggest problem with the plan is that it will do little to address one of the fundamental problems with the web fonts scheme, in that web page designers don’t want new fonts, they want to use the fonts they’re currently using in print – Gotham, Meta Serif, and Franklin ITC.</p>
