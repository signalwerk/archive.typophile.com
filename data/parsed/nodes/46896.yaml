      <p>David you may be right but what about this: Regarding new graphics. Most web sites are re-designed every few years. That's how we went from a 800x600 web to a 1024x768 web. </p>
      <p>And since we are going to have a long tail it is likely that graphics/code for layout(css) will keep becoming more &amp; more flexible. This is already starting to happen a bit. Probably that will continue and greater flex will be built in via flash and css.</p>
      <p>And the MS &amp; Apple tech that lets you soon in to see something closer &amp; zoom out for context is starting to see more &amp; more play. That will have an impact too - although it's hard for me to say what it is. It will make rez specific designs harder to justify though. Sadly. I like the idea very much as I have said before.</p>
      <p>Also OLEDs have made a lot of advances. And their rez is pretty insanely high. And could go higher. Plus they take less energy to run but that is a side issue except in that they will be attractive for that reason.</p>
      <p>200ppi is what OLED makers are starting to shoot for &amp; apparently a lab somewhere has done a sample at 300ppi.</p>
      <p>So is the "rez fairy" = 80% of people with 200ppi+ in 10 years? If I am gonna say "I believe" then I need to know what I am supposedly believing in.</p>
      <p>And chip speeds including graphics engine chips do somehow keep getting better. </p>
      <p>None of this means that it will be other than a mess or even that it won't be even more of a mess than it is today.</p>
      <p>The people that have a real clue about this are keeping mum because it's their job to do so until it's time for a marketing blitz.</p>
      <p>But to sum up: What's the standard? Draw that line in the sand past which exists the rez fairy.</p>
