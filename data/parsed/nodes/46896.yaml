      <p>&gt;which then brings into play all of the variables one needs to watch out for</p>
      <p>It all depends on how much you care about those variables. Adobe did -- hence, in part, CoolType, an absolutely private screen rendering system now built into nearly all of its major apps. (i.e., figure out how to make ATM work on an app rather than a system basis, then figure out how to make it better than the versions you had to beg MS and Apple to include in their OS since customers never bought enough of it to make it worthwhile - - - and there's the rub. Customers never would pay for ATM and we wouldn't have it unless Adobe -- bless 'em! -- believed in it so much. Everyone who's building computer display systems (I mean that in the largest sense) knows what Adobe learnt: customers are really stingy. Sometimes you have to give away the best things if you care enough about the issues. And don't expect any thanks!)</p>
      <p>But the variables all boil down to one thing: having the right font at the right grid for your system running your app in your view. This seems to be what Berlow is addressing practically.</p>
