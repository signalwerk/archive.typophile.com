      <p>David, it appears that you started this thread as a trojan horse to push your screen rendering agenda.</p>
      <p>So what you're saying is that the "reality" of having more fonts available for web sites won't address the fundamental problem?</p>
      <p>I somewhat agree, and will sign your petition (if written in plain English), much good may it do. Good luck with the scratching, biting and suing.</p>
      <p>However, I suspect that the messy business of getting more fonts into play online, because we like them in print and big, irrespective of how well they render immersively on screen, would be a massive juicing of the typosphere and therefore a good situation for type business, whatever the legalities. </p>
      <p>Much as I respect the technologically-driven MS designs (especially Verdana/Georgia and ClearType), they are a dull diet and don't give typographers anywhere near enough variety to work with.</p>
      <p>I also wonder if too much importance isn't being given to the niceties of screen rendering, because:</p>
