      <p>&gt;So where does the money for all of the font optimizing come from?</p>
      <p>My conclusion is that it must now come from love. Font optimization reached its apotheosis in the pre-WW2 period because of the unique economics of the competition between Linotype and Monotype. It was the _only_ thing they could do to make viable competitive cases for themselves, and the payoffs were huge. Those conditions no longer exist.</p>
      <p>&gt;Not that we shouldn’t push for better on-screen rendering, but by the time something might come of that, if we’re lucky, improvements in hardware will make it somewhat moot.</p>
      <p>I'm not so sure about that. The best technology we have today can barely move around pixels at 133 dpi. Suppose we actually had 600 dpi screens tomorrow? The video hardware just isn't up to it, not to mention the rest of the hardware. It could be longer than one might think - - a couple of decades? - - for substantial improvements to be made and purveyed cheaply.</p>
      <p>We need solutions that recognize the hardware where it is. Dave Ericsson, whose DOS-based XyWrite, still in use, was and is legendary for speed, always tested the program exclusively on hardware several years out of date. Can you see Microsoft forcing its Office and Vista teams to use only five-year-old computers? If they did, we'd have much better software . . . . .</p>
