      <p>With regard to the interesting question of EULAs not allowing fonts to be embedded in pdfs. This requirement only came into force a few years ago. Most of the fonts that anyone would want to use were already available by then, without quite such restrictive licenses. So couldn't you simply use an older version of the font which, obviously, is not subject to these silly new requirements? Hmmm, maybe my old Font Folios and Monotype Libraries are worth more than I thought - - not to mention the entire Bitstream and lots of ITC library that used to come with old versions of CorelDraw, old copies of which anyone could buy for pennies. I started throwing away font CDs in 1994 - - it was a big moment way back then! - - now I wish I'd kept them. </p>
      <p>Speaking of font values, I just found an interview I did with Alex Kaczun in 1992 when I was using MCI Mail for email. He said, </p>
      <p>'The biggest ripoff is people copying fonts, and they don't think anything of it.  There won't be any money or incentive to make new fonts if this goes on.'</p>
      <p>and that was before internet-enabled email was current. </p>
      <p>Yes, we used to do it on floppies back then. URW made a huge fuss when they found out that Alex was using his Linotype-purchased Ikarus-M on his home Mac. How much was Ikarus-M back then? Five grand? Ten? Lino started counting up the hundreds of thousands they'd passed URW's way, and I don't remember how it all got resolved. URW was nearly finito by then, but fortunately there was still enough money in the kitty a few years later to get Albert-Jan Pool to refit the whole library. That is now a good and inexpensive library - - I wonder if it has pdf restrictions?</p>
