      <p>David, fonts in PDFs are a source of problem for more than web designers. I have recommended to publishers in the past that they not use certain foundries fonts, because the EULA either outright forbids it or says something like "contact the company for details on extra license needed" (al la Font Bureau). The one time I did this (not Font bureau), I was told that since that exposed the font to an extra 100,000 computers, I'd have to license it for those 100,000 computers. The price was astronomical. The font was not used for the book.</p>
      <p>More than a few academic publishers have a contract with NetLibrary, which requires a PDF with full font embedding.</p>
      <p>There needs to be a solution for this general problem, be it web or print. However, now that The Internet is such a large market, maybe a solution for that will be available for those of us who still only use type for print, too. Otherwise, we're going to have to drastically expand the calligrapher base.</p>
