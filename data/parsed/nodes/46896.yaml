    <p>This session description, was on the TypeCon web site.  I was kindly invited to join this panel, but alas, by the time last week's invite was offered, I was booked for Punkt weekend.</p>
    <p>"No one can argue that improvements around fonts for the web aren’t long overdue, but the current scheme has various drawbacks. The most serious problem being that only freeware fonts can be used, with the fonts web designers want to use [] completely off-limits, leading to fears that commercial fonts will be misused..."</p>
    <p>Hmmm.<br>
    "No one can argue that improvements around fonts for the web aren’t long overdue,"<br>
    Well some people have successfully argued against doing anything productive for near 1.5 decades, quite obviously, right?</p>
    <p>"...but the current scheme has various drawbacks."<br>
    There is one? I mean, there is a scheme and it is cross-platform, cross-browser and solitary?</p>
    <p>"The most serious problem being that only freeware fonts can be used..."<br>
    Is this true? Does font embedding prevent the use of non-freeware fonts? </p>
    <p>"... with the fonts web designers want to use are completely off-limits..."<br>
    Who knows what they want, or what their licenses allow, so, what da heck is "completely off-limits"?</p>
    <p>All comment types encouraged, (except for Varge, who needs to shut up forever;). </p>
    <p>Cheers!</p>
