      <p>Just some thoughts on James' wiki approach ... So basically you suggest that more free fonts available would cater the demand of potential webfont users.</p>
      <p>But you wouldn't need webfont-capable browsers for your idea. Make some high quality free fonts, then make a deal with operating system or browser makers to supply these fonts with their products.</p>
      <p>But after a while these fonts would become as overused as the currently available choices, and clients still can't use their corporate fonts on the web, etc.</p>
      <p>Plus, I'm not sure the collaborative approach would work with fonts as it does with Wikipedia. Many people know a bit of information and spare ten minutes or so to submit it to Wikipedia. But how many people out there are able to produce high-quality fonts? Can they spare the time to do so for free? If they were to develop fonts together with other people, could they agree on a common format, i.e. would professionals learn to use FontForge or open source enthusiasts shell out for FontLab licenses?</p>
      <p>Does democratic design work at all, especially in a field as type design, which requires so many aesthetic and stylistic decisions based on individual taste and reasoning, as well as highly-specialized knowledge?</p>
      <p>Jens</p>
