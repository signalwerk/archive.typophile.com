      <p>Mike,</p>
      <p>You're right, we should not have made the assumption that most people would know what it was and dive right in.</p>
      <p>In a nutshell, the Typowiki is an encyclopedia of typography for the Typophile community. Since it is a community-driven tool that can take shape in virtually infinite ways, it's a natural evolution of the forum in that we can now separate factual information from opinion and discourse.</p>
      <p>Best of all, the forums and wiki are fully integrated, so now we can all refer others users to other topical areas simply by wrapping the term in question in double brackets [ [ like this ] ]. Typophile will color the link green and precede the term with a small superscript "W."</p>
      <p>An entry does not have to exist to reference the wiki. If you want to create a reference to <a href="/wiki/Mike%20Yanega" class="freelinking" rel="nofollow">Mike Yanega</a> simply wrap it in double brackets, and let someone else create the entry. These entries are typically referred to as "stubs."  We're exploring ways to differentiate standard wiki entries from stubs.</p>
      <p>Personally I'm hoping that the wiki can become the go-to place for frequently asked questions that normally end up in the forums. Is there any reason why the wiki couldn't or shouldn't resolve questions like:</p>
      <p>1. Does anone know any fonts that look like <em>font x</em>?<br>
      2. What fonts go well with <em>font x</em>?<br>
      3. Can you guys recommend any good <a href="/wiki/quirky%20rodeo" class="freelinking" rel="nofollow">quirky rodeo</a> fonts?</p>
