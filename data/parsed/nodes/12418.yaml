      <p>I'm no wiki or typography expert, but as far as I know, anyone can edit any entry of a Wiki. The only requirement, I believe, is that what you enter is true, valid information. Opinions and discussions are what the the forum is for :)<br>
      The Typowiki has just started (less than two weeks ago) so there are many entries yet to be filled, and new ones to be created.</p>
      <p>For more information on Wikis, I suggest you visit the <a href="http://www.wikipedia.org/" target="_blank" rel="nofollow">Wikipedia</a>. It's a very large Wiki (maybe it's the original Wiki? I don't know) and their <a href="http://en.wikipedia.org/wiki/Help:Contents" rel="nofollow">help section</a> could probably help you a lot with understanding Wikis better.</p>
