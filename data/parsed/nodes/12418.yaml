      <p><a href="http://en.wikipedia.org/" rel="nofollow">Wikipedia</a> is far from being the original wiki. Wikis were originally designed to be tools for rough and ready collaboration among teams of programmers, and predate Wikipedia by a few years. However, Wikipedia is definitely the <em>best</em> public wiki out there, and anyone wanting to see how the Typophile wiki ought to work could learn a lot from Wikipedia, and not just about wikis.</p>
      <p>There are two key concept to wikis: anyone can enter information, and anyone can modify information after it's entered. Allowing both those things is a pretty radical idea on today's (rude, foul-mouthed, malicious, partisan) internet, and it's worked out surprisingly well in practice. Even the most contentious entries on Wikipedia eventually stabilize towards something approaching the truth, especially because everyone can see the modification history of the page, and Wikipedia has some moderation controls that the comparatively simple Typophile wiki hasn't implemented yet. Moderation is still the exception rather than the rule, though.</p>
      <p>One of the key benefits of wikis is how fast and dirty they are. I tend to really heavily crosslink the entries I write, assuming that some other day when I get bored I'll come back and fill in some of the cross-referenced articles if nobody's gotten around to it yet. The brilliant thing is that sometimes somebody has, as Dan Reynolds did with a bunch of German / blackletter entries I'd linked to in passing. The results are stronger than what either of us would have done working on our own, and they'll only get better over time as more people come in and add additional information, edit for structure, and correct the inevitable mistakes.</p>
      <p>So yeah, that's the idea: anybody who cares enough about an entry to write something is qualified to write it, because unless they're operating completely maliciously, they're not going to do damage to the wiki or Typophile; somebody else will come along eventually and fix stuff up if they notice it's wrong. If you want to add stuff, then do it! It's fun!</p>
