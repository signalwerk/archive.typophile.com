      <p>Keywords are tough. I occasionally work on keywords for the Linotype site. MyFonts is the most extensively keyworded type site that I'm aware of. Don't they have over 40,000 keywords?</p>
      <p>Keywords are only good if they are acurate, and if they are updated, I think. But a wiki is a great way to handle keywords. Then you get more than you would if it was just handled by a few moderators or editors.</p>
