    <p>Evidently this 'user-created encyclopedia'  is supposed to be a reference source for all of us, but when I click on any links from the Indices, I don't see articles. Instead I get a place to enter content. ( I was hoping to learn about one of the listed designers)</p>
    <p>Am I the only one who doesn't get what this Typowiki is about? Are only certain members allowed to use it?</p>
    <p>What qualifications do we need to write an article in one of these 'nodes'? What are 'nodes' anyway? </p>
    <p>I think the assumption that all of us who use Typophile will already know about this and how to use it is sure not valid in my case.</p>
    <p>Please provide more information about this prominent site feature, and how we can use it and participate, if that's what we are supposed to do.</p>
    <p>Thanks<br>
    - Mike Yanega</p>
