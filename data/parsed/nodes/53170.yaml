      <p>@William Berkson:<br>
      <cite>I think the stroke contrast on Adobe Caslon is too great to get the letter press Caslon reading comfort and aesthetic. Its proportions are also half way to Baskerville,</cite></p>
      <p>Ah, so when I looked at it and thought of Baskerville, I wasn't dreaming.</p>
      <p>I agree with you that it has gone too far - it's <em>recognizable</em> as a Caslon by looking at the letterforms, but it just barely qualifies. I think that it is a highly readable typeface, eminently suitable for body copy... and one that might contain 24% lead oxide, but which avoids the iron and the cobalt... but, yes, as far as being a "Caslon", I would agree that a reasonable response would be "why bother" - and use Times Roman, Caledonia or Century Expanded instead. Baskerville or Garamond would be a definite improvement if one was looking to make one's document more unique.</p>
      <p>If anything, though, it accords with my typographical tastes well enough that I've learned from it to "be careful what you wish for".</p>
      <p>I would not expect anyone in his right mind to set body copy in ITC Caslon 223, as one example. I think going a bit further in the direction of Adobe Caslon than Williams Caslon does is acceptable - but going as far as Adobe Caslon did... yes, I will acknowledge that even if it only gets noticed in the typographic community, there are limits to how much inauthenticity should be accepted.</p>
      <p>Of course, if they just hadn't put the name "Caslon" on it, the world would not be hurt by the availability of a nice readable Caslon-influenced typeface. But it probably would not have been noticed, and one can't blame businesses for being commercial.</p>
      <p>If hardcover fiction is being published in Adobe Caslon, then it has done some good.</p>
