      <p>I found this thread interesting as well.</p>
      <p>I remember seeing one book on typography illustrate that Caslon was still useful today by showing its use in closely spaced all-caps in posters for the Leonard J. Waxdeck bird-calling contest.</p>
      <p>I know some campuses use Caslon in some form as a typographical identity standard.</p>
      <p>What I saw of Caslon in some metal type specimen books looked horribly dated to me, and it seemed not to resemble older books set in Caslon, being an artificially light face. Also, what seemed to me the most widely available form of Caslon was Caslon 540, which has short, stubby descenders.</p>
      <p>Adobe Caslon may not be "distinctive", but when I took a look at it, it certainly did seem to be a real Caslon, and to avoid the pitfall of excessive stroke contrast that plagues other Caslons. And yet, I can also see how it could be mistaken for Baskerville (or some such thing) at a quick glance.</p>
