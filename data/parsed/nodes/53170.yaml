      <p>Well, looking back at this old thread I said "soon" about my revival of Caslon. It took another year and a half after my post, <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">but here it is.</a> </p>
      <p>Quadribloc, I think the stroke contrast on Adobe Caslon is too great to get the letter press Caslon reading comfort and aesthetic. Its proportions are also half way to Baskerville, and I personally like Caslon's original widths in his Roman, I think the rhythm it establishes is one of the original's best features. </p>
      <p>My detailed discussion of Adobe Caslon is in my essay <a class="freelinking external" href="http://ilovetypography.com/2010/11/02/reviving-caslon-part-2-readability-affability-authority/" rel="nofollow">Reviving Caslon on ilovetypography.com</a>.</p>
      <p>There are also several other recent revivals, I think partly in response to the feeling that Adobe Caslon is has its problems. </p>
      <p>I think Adobe Caslon works better in display, and I see it more often there. The Caslon in The New Yorker is not Adobe Caslon.</p>
      <p>My own optical sizes—"soon".</p>
