      <p>I haven't heard the expression before. I think it's just a joking variation on the old expression "the sun never sets on the British Empire." Old because it does set now!</p>
      <p>Interesting that "bearded" went for ATF Caslon 540, which is a beautiful display face. They used the original letter press, but I believe the digital version is quite good, though I haven't compared them. It is based on Caslon's larger sizes, which are quite different from the small ones. Carter's Big Caslon is also a beautiful interpretation of the very large sizes.</p>
