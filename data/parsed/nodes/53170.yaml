    <p>Hi, first post here, not sure if this is the right place to post this, and I must apologise for creating a rather selfish first post! I've been lurking and meaning to sign up for a long time now, so I'll try to start contributing what I can with the little knowledge I have now as a student.</p>
    <p>Anyway, apologies out of the way, I'm doing a dissertation which involves looking at a few typefaces from various angles, and part of it requires me to look at modern usage of these typefaces. And by modern I mean, like, in use in the last year at least.</p>
    <p>The only one I'm struggling with is Caslon, with it being so old and serif and all. But, being such a stalwart typeface, I would assume that it must be everywhere, and I just can't see it, and I'm hoping you guys will have a better knowledge of where it might be!</p>
    <p>The kind of things I'm looking for are brand identities, advertising, newspapers, magazines, books... well, anything really. I know Caslon doesn't lend itself so much to brand identity, but I am looking for semi-unusual uses, so if anyone knows of it being used in a logo or something like that it would be great! I haven't got my hopes up though, so it would be just as well if anyone knows of a publishing house that uses it regularly, which I imagine is more likely.</p>
    <p>Or, if nobody knows of any notable uses, then if anyone has any insight into why that is, then that would be useful too!</p>
    <p>Thanks</p>
  html_clean: |-
    <p>Hi, first post here, not sure if this is the right place to post this, and I must apologise for creating a rather selfish first post! I've been lurking and meaning to sign up for a long time now, so I'll try to start contributing what I can with the little knowledge I have now as a student.</p>
    <p>Anyway, apologies out of the way, I'm doing a dissertation which involves looking at a few typefaces from various angles, and part of it requires me to look at modern usage of these typefaces. And by modern I mean, like, in use in the last year at least.</p>
    <p>The only one I'm struggling with is Caslon, with it being so old and serif and all. But, being such a stalwart typeface, I would assume that it must be everywhere, and I just can't see it, and I'm hoping you guys will have a better knowledge of where it might be!</p>
    <p>The kind of things I'm looking for are brand identities, advertising, newspapers, magazines, books... well, anything really. I know Caslon doesn't lend itself so much to brand identity, but I am looking for semi-unusual uses, so if anyone knows of it being used in a logo or something like that it would be great! I haven't got my hopes up though, so it would be just as well if anyone knows of a publishing house that uses it regularly, which I imagine is more likely.</p>
    <p>Or, if nobody knows of any notable uses, then if anyone has any insight into why that is, then that would be useful too!</p>
    <p>Thanks</p>
