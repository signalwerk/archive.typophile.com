  html: |-
    <p>Zara Evens is a Senior Visual Designer at <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a>, a leading interface design and development company located in San Francisco. Zara works alongside multi-disciplinary teams to craft innovative user experiences for next-generation web and mobile initiatives. In addition, she has worked closely with clients such as <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> International, to create compelling marketing and design solutions.</p>
    <p>Prior to joining <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> in 2005, Zara received a Bachelors in Communication Design at <a href="/wiki/Emily%20Carr%20Institute%20of%20Design" class="freelinking" rel="nofollow">Emily Carr Institute of Design</a>, where she experienced multiple failed attempts at typeface design and made a not-so-memorable short film featuring sock puppets.</p>
    <p>Zara is perhaps best known in the type community for her involvements with <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>, where she has been an active administrator and pixel-pusher behind-the-scenes since 2004.</p>
