      <p></p><div class="imageWrap"><img src="http://typophile.com/files/alias_5627.png"></div><p></p>
      <p>It could be an issue with autohinting, but most "pro" typefaces I've used in Illustrator all exhibit the same wonky features when zoomed out; even Helvetica Neue looks like a jokey clown font at 33%. Setting it to crisp, however, makes it a lot more pleasant on the eyes.</p>
