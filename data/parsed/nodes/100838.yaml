    html: |-
      <p>I find Illustrator doesn't handle the hinting all too well, but even if text gets a little wonky when zoomed out, it should still print fine.</p>
      <p>In your character panel, if you open up the advanced settings, there's a drop down with some options to set the anti-aliasing methods. Setting things to "crisp" tends to emulate print output in my eyes, and usually corrects those odd counter issues when zoomed out.</p>
