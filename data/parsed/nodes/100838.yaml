    <p>Hi everybody</p>
    <p>this is my first spot and I am new to the forum. I am designing a typeface in Fontlab. I export the font and it looks great both in Fontlab and in Suitcase Fusion. But when I try and use it in Illustrator, when I zoom out the counters and bowls look weird, as if they are a bit offset upwards or downwards.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Zoom33_4892.png"></div><br>
    this image shows the screen in illustrator at 33% zoom. The top one is the written and the bottom one outlined.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Zoom100_4344.png"></div><br>
    this image shows the screen at 100%. Both look right.<p></p>
    <p>Can anyone help me on this?</p>
    <p>Thanks in advance!</p>
