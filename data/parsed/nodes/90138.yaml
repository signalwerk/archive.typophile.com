      <p>I saw Quirky Lab, I didn't see the mouse until I looked at the white on black version, and I didn't see the 4 until you mentioned it in your post.</p>
      <p>I guess my first suggestion would be to have a think about what your logo communicates to people, and if this is how you want to be seen. To me the logo comes across as being basic and simple, almost like a child's toy, which isn't necessarily a bad thing, if that's what you're going for.</p>
