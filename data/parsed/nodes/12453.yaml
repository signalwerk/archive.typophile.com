    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/FAQs" class="freelinking" rel="nofollow">FAQs</a> : What Type Design Software Should I Use?</strong></p>
    <p>When considering what <a href="/wiki/software" class="freelinking" rel="nofollow">software</a> to use in putting together digital <a href="/wiki/font" class="freelinking" rel="nofollow">fonts</a>, many considerations need to be taken into account. Some of these may include: what format of fonts you want to output and for what platform(s), what software you plan to do your drawings in, the importance of having a complex/simple interface, your personal work flow, which features of font production are most important to you, &amp;c. There seems to be a font editing application for just about every need. This article will attempt to help you determine which of these programs best suits your needs.</p>
    <p><em>to be continued...</em></p>
