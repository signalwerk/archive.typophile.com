    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12452" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FAQ</span>s</a>&nbsp;: What Type Design Software Should I&nbsp;Use?</strong></p>
    <p>When considering what <a href="/node/12015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">software</a> to use in putting together digital <a href="/node/13544" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fonts</a>, many considerations need to be taken into account. Some of these may include: what format of fonts you want to output and for what platform(s), what software you plan to do your drawings in, the importance of having a complex/simple interface, your personal work flow, which features of font production are most important to you, &amp;c. There seems to be a font editing application for just about every need. This article will attempt to help you determine which of these programs best suits your&nbsp;needs.</p>
    <p><em>to be&nbsp;continued…</em></p>
    <p>For a listing of font editing software, see <a href="/node/20717" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Editors</a>.</p>
