      <p><a href="http://www.shinntype.com/alphaville.html" rel="nofollow">Alphaville</a> is constrained to vertical, horizontal, and 37° strokes (and is named after a French film).<br>
      <a href="http://www.shinntype.com/panoptica.html" rel="nofollow">Panoptica</a>, which was designed for constraints-based verse by Christian Bök, is constrained to one case and monowidth (and is named after ideas in Foucault's <em>Discipline and Punish</em>).</p>
    html_clean: |-
