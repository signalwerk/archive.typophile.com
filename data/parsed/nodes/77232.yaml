    <p>Hi all,</p>
    <p>I'm looking for specific fonts that have parts missing, or are very reductionist in their structure. I want to use it for a set of covers for Georges Perec books. In his books the missing memory, a void, missing letters etc. play a very important part, and I would like to reflect this in the type. It still needs to be legible, but it's OK if it's a bit puzzling. I would prefer sans-serif or slightly flared typefaces, with possibly a certain "french connection". I like Futura Black but I don"t know if this is completely what I'm looking for. Any ideas?</p>
    <p>Thanks a lot!</p>
  html_clean: |-
