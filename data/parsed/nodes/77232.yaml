    html: |-
      <p>Thanks all for the suggestions! I think Avia is still the closest for now to what I'm looking for. </p>
      <p>Stop, Tralfamadore, and Morphica are a bit to techy for this. I've been considering Bifur as well, but I'm not sure yet if it's not too geometric. I like the idea of the multicolored parts, but would be better in a bit more 'postmodern' design.</p>
      <p>Auriol is a bit too oldfashioned, Art Nouveau for this. </p>
      <p>Just to give some more info on Perec; he lived from 1936 to 1982, was a member of Oulipo (Workshop for experimental literature) and one of the best postmodern authors. In his work he often uses constraints and mathematical structures. He was jewish (both of his parents died in WWII) and this had a significant implicit impact on his work. Missing elements (like a novel without the letter E) or storylines that revolve around a void, a loss of memory. </p>
      <p>I hope this helps give you some ideas?!</p>
