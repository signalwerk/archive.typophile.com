    <p>Hey there, just joined after following for a while.</p>
    <p>Would like to know your thoughts on a logo I'm working on.  The guy is a record producer, engineer and mixer, as well as being an arranger and composer.  He wants something sleek and modern, but nothing to heavily tied to usual musical stereotypes.</p>
    <p>I've come up with a concept that I like, but I've got it in 4 different incarnations / arrangements.  I'd like to know what you think.</p>
    <p>Take a look here at: <a class="freelinking external" href="http://twitpic.com/g1pg0" rel="nofollow">http://twitpic.com/g1pg0</a></p>
    <p>The other option is a logo based on the famous typographic logo from the client's biggest musical influence, Peter Gabriel's "So."  I figure that anybody who knows of the record would get a kick out of it and get a sense for Doug's style, and anyone who wouldn't would just think it looks nice.  I think it's an homage (I love Saville!) but I don't want people to think I'm ripping him off.</p>
    <p>Take a look at that here: <a class="freelinking external" href="http://twitpic.com/g1pj4" rel="nofollow">http://twitpic.com/g1pj4</a></p>
    <p>Anyways, would love to know your thoughts.</p>
