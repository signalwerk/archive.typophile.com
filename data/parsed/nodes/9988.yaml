    html: <p>Alec,  <br> <br>The reason I picked the Chalet family is that it's really ten fonts. If you look at the 1960 versions, you see the 'conventional' letters, 1970 and 1980 contain some alternate letterforms. Paris, London and New York are weights for each of the three 'years'. The Tokyo face is a lot like Bauhaus, and is the tenth font in the set.  <br> <br>If you mix the e, t and s from 1960 font, with the other letters from the 1970 font, you pretty much have what you were looking for, I think. <br> <br>(If you ask me, House's way of designating the fonts in the Chalet and Chalet Comprim� sets is confusing and anti-intuitive. Sure, you can figure it out, but it seems to turn our usual way of naming fonts backwards.)</p>
