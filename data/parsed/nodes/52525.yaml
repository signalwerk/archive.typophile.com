    html: |-
      <p>just to be clear...Emigre has not filed any font names as trademarks, though they* assert trademark rights. They could always send a nice C&amp;D letter, but cannot file a federal suit without having filed an actual trademark.</p>
      <p>also, <cite>dilution</cite> as a legal term involves famous marks and would have no basis here.</p>
      <p>finally, a reasonable person would ask: Is Maison going to create a <cite>likelihood of confusion</cite> among font buyers? (one element of trademark infringement).</p>
      <p>People might not know that <cite>maison</cite> is the French word for <cite>house</cite>. So yes, it might create confusion if people read it the same way they read Mason.</p>
      <p>Can two exact font names peacefully coexist? Yes. Farao is one an example.</p>
      <p>So maybe out of respect for Emigre and Barnbrook—and not necessarily for fear of legal reprisal—it might be wise to find another name?</p>
      <p>Or email Rudy or Zuzana and ask them. Again, out of respect and wanting to do right.</p>
      <p>communication never hurts. :)</p>
      <p>* they (technically, emigre = it)</p>
