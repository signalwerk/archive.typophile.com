      <p>we'll leave the first one alone because <cite>assemble a claim</cite> can mean anything. I took it to mean, get litigious with an actual legal filing, whereas you probably meant, send a letter.</p>
      <p>I know infringement can occur without a registered trademark, but was pointing out that Timo will not face a lawsuit until a mark is filed (and a mark can be expedited for a fee) :)</p>
      <p>the second one, it's probably semantics again.</p>
      <p><cite>dilution</cite> is a nebulous term that can mean whatever we want it to mean. </p>
      <p>legally:</p>
      <p><cite>The Federal Trademark Dilution Act of 1995 is a United States federal law which protects famous trademarks from uses that dilute their distinctiveness, even in the absence of any likelihood of confusion or competition. It went into effect on January 16, 1996. This act has been largely supplanted by the Trademark Dilution Revision Act of 2006 (TDRA), signed into law on October 6, 2006.</cite></p>
      <p>also:<br><a href="http://en.wikipedia.org/wiki/Trademark_dilution">http://en.wikipedia.org/wiki/Trademark_dilution</a></p>
      <p>but there are state statutes that don't require a mark to be famous to be diluted. But those state statutes are really not germane here, i don't think.</p>
      <p>Most IP attorneys in the United States—and this is where I'd be willing to bet!—associate the word <cite>dilution</cite> with famous marks.</p>
      <p>I didn't want timo to think he was in some kind of predicament... and I wanted to point him toward a possible solution. Which is why i posted.</p>
      <p>beyond that:</p>
      <p>I'm sure if we were both sitting in the same room having a chat, and not guessing at intent, we'd be on the same page. :D</p>
      <p>and looks like we both support the same conclusion.</p>
      <p>cheers</p>
