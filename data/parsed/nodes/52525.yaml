      <p>Hi Timo.</p>
      <p>Somehow, the lowercase a seems much too off. I think you should remove the overshoots for the tail of the lowercase a, and see if it gets better. Also, as the typeface gets bolder, the details become much more obscure (especially for the lowercase n). These bold types are usually set in large sizes, so detail is important, but it's up to you if you made it really that way.</p>
      <p>Good luck, and keep it up.</p>
      <p>Cheers,<br>
      Josef</p>
