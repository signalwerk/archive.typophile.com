    html: "<p>Dan, last September there was extensive discussion about this on the T-D list, with Yuri and Adam from FontLab commenting extensively. The short answer is no, other than methods such as those mentioned above. The FOG format is proprietary and Macromedia is apparently not willing to make it public. If you want to investigate further, here is the archive of the discussion in question: <br> <br><a href=\"http://type-design.p90.net/lists/archive.shtml?&amp;page=555\" target=\"_blank\">http://type-design.p90.net/lists/archive.shtml?&amp;page=555</a> <br> <br>The topic was \"designing versus technifying in FLAB\". It gets pretty pointless at times, but there's some interesting information in there, too.</p>"
