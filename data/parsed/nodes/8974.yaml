    html: <p>This is what I always do too. Generate both a pfb and an afm if you have any kerning (&amp; why wouldn't you?). I use the ADVANCED setting in generating fonts with Fontographer, because it lets one specify a custom encoding and &amp; also set the font type to "decorative". <br> <br>I've done this for several years -- I use Fontographer because it is what I know best, then run the font through FontLab to remove all the bugs Fontographer seems to periodically throw  in. Pretty soon now I'll have to abandon the training wheels &amp; use FontLab from the get-go. <br> <br>Charles</p>
