  html: <p><img src="http://www.typophile.com/forums/messages/83/32165.gif" alt="Uniquely Singapore"> <br> <br>It's likely to be handdrawn, but there's also a high chance that it is a freeware something, or even a commercial font, which I hope someone can point out. <br> <br>If it's handdrawn, I'm interested to know if there are any fonts out there which this could be based on. <br> <br>The sans that they have chosen is Shinn Medium. <br> <br>Any kind of pointers / comments would be appreciated. Thanks guys. <br> <br></p>
