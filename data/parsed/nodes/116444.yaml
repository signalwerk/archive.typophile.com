      <p>Can't identify it and really doubt it could be something else than a heavy (and amateurish) customization, or even a mash-up. Many details look weird: /R top left corner (serif removed?), /R leg (which looks to have been added to a a /P actually), weird /s and /r among the orthers...<br>
      Some alternatives but far from being even loosely similar: <a class="freelinking external" href="http://www.myfonts.com/fonts/letterbox/terital-united" rel="nofollow">Terital United</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/deftone-stylus" rel="nofollow">Deftone Stylus</a>, <a class="freelinking external" href="http://www.losttype.com/font/?name=wisdom_script" rel="nofollow">Wisdom Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/john-moore/duvall" rel="nofollow">Duvall</a></p>
