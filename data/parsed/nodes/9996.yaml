  html: "<p>Font Bureau, Inc. is proud to release Zingha, an original family from Xavier Dupré. <br> <br><a href=\"http://www.fontbureau.com/Zingha\" target=\"_blank\">http://www.fontbureau.com/Zingha</a> <br> <br>Zingha balances \"French rhythm and American style\" with pointed edges and slinking curves. Dupré drew the sharp and angular letterforms of Zingha to escape his days lettering \"sweet and creamy\" food packaging in Paris. Traditional roman capitals mix with a unique lowercase and entirely personal italic. <br> <br>Zingha is engineering behind fashion. Features which are artful in display turn functional in the repetition of text. The family's 14 styles include small caps, alternate swash capitals, as well as two inlined \"deco\" faces for the adventurous typographer. <br> <br>For more information or to request a press kit, <br>please email info@fontbureau.com or call <br>Harry Parker or Robb Ogle at 617 423 8770. <br> <br>Best Regards, <br> <br>Harry &amp; Robb <br>typesales@fontbureau.com <br>The Font Bureau, Inc. <br>50 Melcher St., Suite #2 <br>Boston, MA 02210 <br>617 423 8770 (voice) <br>617 423 8771 (fax) <br><a href=\"http://www.fontbureau.com\" target=\"_blank\">http://www.fontbureau.com</a> <br> <br>About Xavier Dupré: <br>Xavier Dupré was born in France in 1977. In 1995 he studied graphic design in Paris and received a GCE Applied Arts degree. Two years later he went to the Scriptorium de Toulouse to learn calligraphy and typography. In 1999 he began work at a packaging design agency in Paris. He collaborates with Ladislas Mandel, well-known for telephone directory types, and experiments with Renaissance letterforms. For 2001 to 2004 he lived in Cambodia, designing latin and khmer typefaces as he travelled through South-East Asia. Dupré was awarded consecutive Certificates of Typographic Excellence in 2004 and 2005 by New York’s Type Directors Club. <br> <br>About Font Bureau: <br>Font Bureau was founded in 1989 by noted publications designer and consultant Roger Black and type designer David Berlow to serve the emerging needs of microcomputer-based magazine and newspaper publishers seeking unique typographic identities. The New York Times, Newsweek and Smart were among the first clients to commission type designs. During the past 15 years, Font Bureau has designed over 1000 fonts for over 300 publications. A few of these designs remain the exclusive property of the publications but most have become part of Font Bureau's retail library. The company is based in Boston.</p>"
