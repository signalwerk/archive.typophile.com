ner and consultant Roger Black and type designer David Berlow to serve the emerging needs of microcomputer-based magazine and newspaper publishers seeking unique typographic identities. The New York Times, Newsweek and Smart were among the first clients to commission type designs. During the past 15 years, Font Bureau has designed over 1000 fonts for over 300 publications. A few of these designs remain the exclusive property of the publications but most have become part of Font Bureau's retail library. The company is based in Boston.</p>"
