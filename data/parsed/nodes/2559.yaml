  html: |-
    <p>I've been working on putting together the logo for a company called Momentum. I'd love to get your feedback on the finer points of the type. I'm wrestling with the ligature between the M and the E, it just doesn't quite feel right to me. Also, the O seems a little off. Any thoughts? <br> <br>The business will works with utility companies and other big industries. We want to create a solid presence, while also a sense of dynamism. <br> <br>I'd love to hear your ideas! <br> <br>-Josh <br> <br><img src="http://www.typophile.com/forums/messages/4100/23221.jpg" alt="The logo itself"> <br> <br></p>
