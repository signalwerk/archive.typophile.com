    html: <p>Hey everyone, <br> <br>Thanks for the feedback! I've worked on the O, trying to make it parallel the curve of the U more. This is what I came up with, a bit boxy, but coming along. Also included is a preview of the business card I'm working with. <br> <br>Regarding sketches and process- this is actually an old project which was just revitalized, I put together the rough over the summer. I should probably sit down and reconceptualize the piece, see where it leads me. <br> <br>Keep the good words coming! <br> <br>-Josh <br><img src="http://www.typophile.com/forums/messages/4100/23255.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/4100/23256.jpg" alt="business card"></p>
