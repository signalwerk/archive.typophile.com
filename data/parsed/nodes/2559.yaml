    html: "<p>Joshua: It's an okay start, but you really need to push it some. The ligatures work on a certain level, but I think it needs some more breathing space. The \"O\" looks like an egg that is about to be crushed. Also, your angles are all over the map and there is no consistency between the M's.  <br> <br>Perhaps you should give some more thought to how the symbol works with the type. Can you integrate the two somehow creating more of a wordmark? As it stands now, it doesn't seem like a very original solution. Something as simple as moving the lower shape forward would give it more visual interest. (abstracting it slightly) <br> <br>I would also suggest re-working ENERGY. I am not a big fan of artificially skewed and stretched type. The G makes me wince. <br> <br>Do you have other sketches or directions? It might be helpful to see how you arrived at this point.</p>"
    html_clean: "<p>Joshua: It's an okay start, but you really need to push it some. The ligatures work on a certain level, but I think it needs some more breathing space. The \"O\" looks like an egg that is about to be crushed. Also, your angles are all over the map and there is no consistency between the M's.  <br> <br>Perhaps you should give some more thought to how the symbol works with the type. Can you integrate the two somehow creating more of a wordmark? As it stands now, it doesn't seem like a very original solution. Something as simple as moving the lower shape forward would give it more visual interest. (abstracting it slightly) <br> <br>I would also suggest re-working ENERGY. I am not a big fan of artificially skewed and stretched type. The G makes me wince. <br> <br>Do you have other sketches or directions? It might be helpful to see how you arrived at this point.</p>"
