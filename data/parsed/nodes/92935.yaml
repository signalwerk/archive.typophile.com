    <p>I have a technical problem. I am working on Windows 7. I am designing a font in FontLab Studio 5.</p>
    <p>I have generated a font and installed the latest version of it (an *.otf file) into my Fonts folder. All good so far.</p>
    <p>The font is there and works in every package. Still all good.</p>
    <p>The only problem I have is that when I come to print to PDF a Word document (or PowerPoint presentation) with the font in it, the output shows a PREVIOUS version of the font, not the current version in the Fonts folder (even though the documents themselves show the correct fonts and also print correctly to hard printers).</p>
    <p>Corruptness somewhere...</p>
    <p>Is there such a thing as a Microsoft Office font cache and how do I clear it?</p>
    <p>Cheers,<br>
    Nick.</p>
