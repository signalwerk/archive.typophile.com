      <p>Nick - this is the first time that you mentioned that more than one font file is involved. A very common problem with a group of fonts in the same family is their names.  In Windows and Microsoft applications in particular, multiple font files with the same family name can be problematic. Such products can consistently recognize only four members of any given font family - regular, bold, italic, and bold-italic.  Other varieties, whether Heavy, Outline, or anything else, require separate font family names.  Otherwise, what you see and what gets used can vary, and can depend on which font is opened first.</p>
      <p>Adam Twardoch (in the fontlab forum) and Tom Phinney (I'm pretty sure) have posted specific font naming methods that ae said to allow different style names to be properly recognized. The one time I tried it I probably did something wrong.</p>
      <p> - Herb</p>
