    html: |-
      <p>No, neither Word nor Office has anything like a font cache.</p>
      <p>Now clutching at straws, but ...</p>
      <p> What Windows and Office do have, though, are font substitution tables.  These usually say to use font B if font A isn't available, which doesn't seem to be your case, but one never knows.  You've never said what the font name itself is. There is one hidden truetype font, Marlett, as well as over 150 hidden .fon (bitmap screen display) files in the windows folder. As unlikely as a name conflict would be, who knows!</p>
      <p>Run Start/Run/Regedit and look in<br>
      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts<br>
      and<br>
      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\FontSubstitutes</p>
      <p>to see if there's anything there that resembles your problem font or file name.</p>
      <p>If not, you could search (edit/find) for some recognizable portion of  your font name and/or its file name to see if it's already in there somewhere </p>
      <p>And, of course, DOUBLE-CHECK your font and file names - it's possible that somewhere along the line you've named the 'old' and 'new' versions slightly differently. Something almost invisible like two spaces instead of one, or a zero instead of an oh.</p>
      <p>As I said, clutching at straws! At some point someone (probably you) will find the problem and its solution and will be something extremely simple and obvious!</p>
