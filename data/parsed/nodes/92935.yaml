      <p>The font cache file  is located here: C:\Windows\System32\FNTCACHE.DAT<br>
      Delete the file and restart your system.<br>
      THEN delete the installed font.<br>
      For general testing purposes, you don't have to install the font in order to use it. Just open it (by double clicking). It will then be available to any application that you start AFTER opening the font.</p>
