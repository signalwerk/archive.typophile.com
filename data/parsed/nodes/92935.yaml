      <p>Kent, the pdf travels to other machines with the glitch file embedded in it. Thanks for the suggestion though.</p>
      <p>Herb, I have looked in the registry as you suggest and it turns out that every re-install of the font results in the font file having a new name...</p>
      <p>It does it on the basis of hexidecimal numbers (FontnamRegular.otf, FontnamRegular_1.otf, FontnamRegular_2.otf ... FontnamRegular_F.otf, FontnamRegular_10.otf... etc.) so I reckon when I got to FontnamRegular_F.otf is was fine but I think the minute I went for a sixteenth version install, it took the name above 16 characters (i.e. FontnamRegular_10.otf) and maybe 17 characters is just too many for it to manage?</p>
      <p>All my other names were shorter than Regular (Thin, Light, Medium, Bold, Heavy, Black) and so maybe the others were not affected.</p>
      <p>Anyway, somewhere in the registry must be a place where the computer knows it has had a font with the same name installed before and therefore makes a new name for it in the registry. The question is, where is this information stored? Must be a simple text file I would have thought.</p>
      <p>Intriguing. Any thoughts on where the computer stores the previous font names that have been installed in the past?</p>
      <p>I feel like I may be making some progress.</p>
      <p>Cheers,<br>
      Nick.</p>
