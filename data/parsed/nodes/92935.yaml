    html: |-
      <p>Turns out that the additional hexidecimal number that the system adds to the font name is only activated if you are replacing a font that is already installed. If you delete the old font first, the name remains unaffected. However, if you delete subsequent versions and install again, the system adds the hexidecimal number whatever happens. It cannot seem to cope with going back to the original name once a replacement version has been installed without deleting the previous version.</p>
      <p>New question then, where does the computer store the names of fonts that have been previous installed? It must store the names somewhere or how would it know to add '1' to the last name used in the registry.</p>
