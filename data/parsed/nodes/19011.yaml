      <p>Recent blog entry from Adobe's Tom Phinney...</p>
      <p><a href="http://blogs.adobe.com/typblography/2006/01/legal_protectio.html" title="http://blogs.adobe.com/typblography/2006/01/legal_protectio.html">http://blogs.adobe.com/typblography/2006/01/legal_protectio.html</a> </p>
      <p>...relates to your 2nd point as Adobe had some legal success against a company that opened up their font files, tweaked the outlines (in this case scaled them) and resaved the results. </p>
      <p>Cheers, Si</p>
