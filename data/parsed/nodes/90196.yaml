    <p>Can somebody identify this font (see attachment). It looks a bit like Century Ghotic, but it's not completely the same. Any ideas? Especially the round O and C are remarkable.</p>
    <p>The letters are a bit blurry, but that's because it's a scan of a printed document. I'm sure the font is sharp...</p>
    <p>The characteristics I see in thos font for are:<br>
    - Round O and C<br>
    - Diagonal ends of C<br>
    - Middle "bars" of E and F are shorter than the top "bar"<br>
    - Middle of M is on the baseline<br>
    - Shape of the R<br>
    - ...</p>
