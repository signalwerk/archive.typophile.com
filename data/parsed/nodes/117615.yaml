    <p>hey everyone,</p>
    <p>this board has been incredibly helpful to so many past requests, so I’m really looking forward to your replies!</p>
    <p>I’m currently working for a client and I am looking for a squarish typeface with rounded edges. So far I am rather pleased with typesupply's »Torque« <a href="http://vllg.com/typesupply/torque" title="http://vllg.com/typesupply/torque">http://vllg.com/typesupply/torque</a> –&nbsp;however it’s lacking a semibold between medium and bold – the bold face is a little to heavy for this design that we're aiming for.</p>
    <p>I’m having a hard time finding proper alternatives to torque, because it is very specific, so I was hoping maybe one of you folks knows a similar typeface?</p>
    <p>thank you in advance!</p>
