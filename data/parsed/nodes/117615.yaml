      <p>Thanks so much for your first replies! This is for a whole corporate design, so it has to work as a logo font as well as headlines. :)</p>
      <p>I like Brooklyn and Blender a lot, but both have sharp corners. My aim was to find that squared-sans feeling with rounded corners, similar to Torque.</p>
      <p>If you look closely, all those sharp little edges have been rounded off, which gives it a less aggressive feel.</p>
