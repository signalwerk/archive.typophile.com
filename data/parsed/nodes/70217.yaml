      <p>I started on my own. Made a huge amount of mistakes, and tried too much. But got around eventially.</p>
      <p>You should not start with sans to learn about basic spacing, and also you should not start with serif to learn about form. Do your own mistakes.</p>
      <p>First, do what you feel is what you want to make, and then start digging into type design conventions. There are plenty. You can go and see the Hague graduates brilliant typefaces. They all look like sisters and brothers. I personally like them, but it is hard to choose any single one to use.</p>
      <p>All advice above is relevant, and I especially like that Blondina; she has a good way of thinking. But the main thing is practice. It took me six years to get my first font published, and I'm still learning today.</p>
      <p>Good luck!</p>
