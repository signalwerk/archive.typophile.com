    <p>This summer I will have free time, and I'm very interested in starting myself in type design. I'm a graphic design student, and our typography teacher doesn't teach us to build type, just how to use it correctly.</p>
    <p>So I'm wondering which font style is the easiest to start. I thought a script (maybe brush) would be easier because it doesn't matter if its a bit "incorrect" or some curves are not very good.</p>
    <p>What do you guys recommend to me?</p>
