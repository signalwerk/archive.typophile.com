      <p>I think a lot of new designers make a mistake starting with a sans serif (geometric or otherwise). I think such styles are very demanding, and reveal inexperience more easily. I pretty much agree with John Hudson; particularly, I think new designers are better off "throwing out" their first design. Maybe one is fortunate and produces something really great, but it seems better to go in with low expectations with an eye toward trial-and-error. (I think a lot of new designers who release their "first" design are, in fact, dismissing one or more previous, bad, abandoned attempts -- but that's pure speculation on my part.)</p>
      <p>One very early experiment I did was an old metal script design by Zapf. It was very forgiving, because it was so irregular.</p>
