      <p>Interestingly, I've done what Mr. Gerrit recomends on that video once or twice and I can't help but agree with the concept of what he's saying, although at the time I didn't really think it through. I do remember the results were very interesting. I think that's another good idea for gotnov. In fact, any way of “writing” the characters instead of “drawing” them will help towards a fundamental understanding of typography (it sure has helped me). [Which doesn't/shouldn't take away anything from more geometrical/constructive(?) ways of designing characters, which are also interesting and helpful.]<br>
      To that effect, I'd also recommend <a class="freelinking external link-external" href="http://briem.net" rel="nofollow">Mr. Briem's</a> site.</p>
