    html: <p>I personally start with a Sans typeface (ITC Migration). It was my first typeface ever. However I worked as a graphic designer for more than 25 years before to start this adventure and I had a passion for typography. This was a good start. So,  I decide to choose a sans typeface simply because I loved those one. I didn't know where I went. But my choice was a good one for me. I learned a lots and I made many mistakes before I released it (4 years after). Some people told me it was not the easiest way to start, today I agree, since I release "Harfang”, my first serif one. I would say, as Chris wrote previously “Start with something that is you no matter how complex it may be.  If you love it, you will do it.”  Take your time, don't be too anxious. Ask for advice from other typeface designer, read some book on typeface subject, do calligraphy and keep your passion.</p>
