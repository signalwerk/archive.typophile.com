    html: <p>On a related note, there’s a great deal to be learned from just tracing classic designs for the sake of doing it. Buy Tshichold’s <em>Treasury of Alphabets and Letting</em> or some similar book, trace the alphabets, space them, kern them, and move on to the next one. This way you get to just focus on the tools without the distraction of being creative. To make it really useful buy the Font RMX tools from Tim Ahrens and use the harmonizer to balance the curves after you draw the letters so that you have a sort of digital tutor who can give you some instant feedback about how to make the outlines flow better. If I could start over I would do it this way instead of spending a lot of time stumbling through my own botched early fonts.</p>
