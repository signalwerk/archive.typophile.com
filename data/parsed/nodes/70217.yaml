    html: "<p>Start with a revival. Find some typeface in an old specimen book -- it doesn't matter if its already available in digital form, because this is just a learning exercise, not something you are going to release --, and make a version of it from scratch. Don't scan and trace the design: reproduce it from looking at it carefully, and making a minimum number of measurements. You can make adaptations and modifications to the design as you go, or try to be as faithful as possible if you prefer. You will learn a huge amount about letters and type from looking very closely at how something has been made, and this will do you more good than trying to invent something at this stage.</p>"
    html_clean: "<p>Start with a revival. Find some typeface in an old specimen book -- it doesn't matter if its already available in digital form, because this is just a learning exercise, not something you are going to release --, and make a version of it from scratch. Don't scan and trace the design: reproduce it from looking at it carefully, and making a minimum number of measurements. You can make adaptations and modifications to the design as you go, or try to be as faithful as possible if you prefer. You will learn a huge amount about letters and type from looking very closely at how something has been made, and this will do you more good than trying to invent something at this stage.</p>"
