    html: "<p>Why not try to solve a problem with your typeface? That’s how I approach most design projects anyhow. If I need something that will work for — say — headlines in a publication, I might start out with a basic idea of what I’m looking for (tone, construction, weight). Once I’ve got some letters I’ll try them on the page, in context, to see how well they preform. Along the way you’ll discover all sorts of issues that needs to be adressed:  ink spread, collisions, bad spacing, inconsistensies and so on.</p>"
