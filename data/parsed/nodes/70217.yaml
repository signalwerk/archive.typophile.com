      <p><em>...the most important thing is to have a sensibility to form...</em></p>
      <p>And that is why I recommend the geometric sans as being the doorway to the form of the digital font.<br>
      It reduces the notions of sidebearings, alignment zones, and stem widths to their most basic and most easily understandable and manageable forms. These modular distances are the fundaments of font construction, and will accommodate almost any genre of type.</p>
      <p>For instance, serifs complicate sidebearings by providing two inter-glyph distances: that between serifs and that between stems (not to mention between optical centres).</p>
