    html: |-
      <p>Actually (just answering James) I've had some experiences designing type and lettering (well, not professionally, but anyway) and I've more than once got the feedback that the version I had drawn by hand was much more interesting and pretty than the traced/vectorial one. And it did take me a while to really see the difference. I found out that when looking at the one done by hand I actually immediately “saw” the vectorial version of it; which is fine, but means I wasn't really paying much attention to what was actually there. I've also come to discover that I would design two quite different characters if given a shot at both media designing the same idea. I think you don't get much “time” to “think” while drawing by hand, which _may_ introduce “you” (a more complete “you”, one that takes into account the unconscious and subconscious “you”) into the equation more than if you just take it to the béziers. Anyway, both methods are fine, gotnov. Any method is fine.</p>
      <p>What I would suggest – if you would grant me the honour of asking me – would actually be that you don't stick too much to any one style. Play around with it. Start with sans lowercase and then add slab serifs, for instance. See what works and what doesn't. Or start with one typeface/character/glyph that you really like and roll with it. Or yes, do start at what you think would be more difficult, maybe a script, yes, maybe an italic, maybe a totally geometric typeface. Start with numbers. Take a very close look at all the typefaces that you think look great. Take a close look at the ones you believe to suck, too, of course. This is very important: search, look, see, watch. Try all methods available: drawing by hand, going straight to the béziers, using a brush, a potato stamp, whatever, just make sure you keep going back to all of them to really see the differences. Print examples, scan examples.<br>
      But the most important advice would be, I think: don't ask anyone anything! :P Relax, enjoy all styles, take it all in and “just do it” and keep doing it. Go on, do it. Do it. Go!</p>
      <p>But that's all only if you were to grant me the honour of asking me and really wanting to know my answer (if you were thus misguided that you'd actually listen to me).</p>
