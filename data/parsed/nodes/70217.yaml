    html: |-
      <p>Alternatively, try a monoline/skeleton/stroke/router* design, then you can use bezier curves freely but you don't have to worry about weight/stress. You can quickly see then where the glyphs become congested and what you would have to do to correct this for more legible results. You can draw an alphabet like this very quickly and it is very easy to iterate as you only make changes to the skeleton, rather than editing outlines. It will also highlight the necessity for differing thickness in verticals and horizontals, as Nick points out, but IMHO it's good to see it go wrong for yourself! Good luck, enjoy.</p>
      <p>* Attempt to make the terminology accessible.</p>
      <p>—</p>
      <p>@eliason</p>
      <p>Yeah I have heard likewise. I guess it is because all those serifs provide some distraction from the quality of outlines.</p>
