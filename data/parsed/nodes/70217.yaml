    html: <p>The way I learned to design type was by starting with calligraphy. I'm also a graphic design student and I'm now in my 4th and last year and I can tell you that it was extremely helpful. Frank Blokland taught us in our first year. I've got maybe 30 A2 sized bankpost sheets filled with calligraphy. It's a bit of a grind, but when I look back at it, it was really helpful in understanding the basic shapes of type. Frank Blokland was a student of Gerrit Noordzij who you may know. He wrote "The Stroke". I'd just buy that book and start writing with a broad tip pen yourself. I could start explaining what I have learned, but the book explains it a lot better then I can.</p>
