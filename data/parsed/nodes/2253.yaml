    html: <p>I believe you’re confusing the term “lining” with “tabular”, Kevin. <br><br>Heights <br><i>Lining</i> = Numerals are all the same height, lining with caps <br><i>Oldstyle</i> = Numerals are of various heights for better <br>ﬂow with mixed-case text <br><br>Widths <br><i>Tabular</i> = Numerals spaced with the same width for easy  <br>setting of columnar data on multiple lines <br><i>Proportional</i> = Numeral spacing of varying widths,  <br>in the same way as the letter glyphs. <br><br>A good text family should include at least 2 types of  <br>numerals, Oldstyle Proportional and Lining Tabular, but the  <br>really useful families include 4 variations, one font with  <br>each width and height combination. See <a href="http://houseind.com/house.php?kit=NEUTRAFACE-FO&amp;sub=features" target="_blank">Neutraface</a>.</p>
