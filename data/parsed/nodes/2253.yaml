    html: <p>Basically old-style numerals that have bodies notably larger than the lc x-height, to the point where they sometimes seem like lining numerals shifted up/down — sometimes they even look like they’re ﬂoating around a centerline. <br><br>Some people (like me) think that hybrid numerals are the optimal style for text work. <br><br>— <br><br><span class="caps">BTW</span>, I’m starting not to like the “Boston numerals” label…&nbsp;:-/  I did some reading, and it’s looking like Alexander Phemister might have been the designer/punchcutter at Phelps, Dalton <span class="amp">&amp;</span> Co. (<span class="caps">AKA</span> Dickinson Foundry) at that time, and apparently he was a very bright fellow, so… <br><br>Plus I still have a nagging feeling that Austin might deserve the credit after all. Dunno, yet. <br><br>hhp <br></p>
    html_clean: <p>Basically old-style numerals that have bodies notably larger than the lc x-height, to the point where they sometimes seem like lining numerals shifted up/down — sometimes they even look like they’re ﬂoating around a centerline. <br><br>Some people (like me) think that hybrid numerals are the optimal style for text work. <br><br>— <br><br><span class="caps">BTW</span>, I’m starting not to like the “Boston numerals” label…&nbsp;:-/  I did some reading, and it’s looking like Alexander Phemister might have been the designer/punchcutter at Phelps, Dalton <span class="amp">&amp;</span> Co. (<span class="caps">AKA</span> Dickinson Foundry) at that time, and apparently he was a very bright fellow, so… <br><br>Plus I still have a nagging feeling that Austin might deserve the credit after all. Dunno, yet. <br><br>hhp <br></p>
