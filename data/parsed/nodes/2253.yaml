    html: <p>They aren’t lining? If they aren’t lining, then why oh why must the huge gaping space around the numeral one be preserved? It’s what I most dislike about lining numerals in text, and everybody seems to have gotten used to it except me. If you saw a word such as, say, “ions” or “late” set like that, you’d immediately say “ﬁx that crapulous kerning, it practically looks like two words.” What I would like to see more of, on the ﬂip side of these sort-of-lining oldstyle numerals, are non-lining equal-height numerals, with visual kerning on par with&nbsp;letters.</p>
