    <p>In De Vinne's "The Practice of Typography: Plain Printing Types", there's a sample of a face that's intriguing for its use of what are often called <a href="/wiki/hybrid%20figures" class="freelinking" rel="nofollow">"hybrid" numerals</a>:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/21516_5414.gif"></div><p></p>
    <p>That's actually a collage from a more extensive setting. The font is the #19 of the Phelps, Dalton &amp; Co., and was probably made at the end of the 19th century. This makes it the earliest "true" hubrid numeral scheme I've encountered - in fact by far: the most recent ones I knew of previously were in Fenway (Carter) and some of de Groot's work. The Austin numerals (like the kind Carter has recreated in Miller) have some hybrid traits, but I find them too irregular (although in a nice way) to really qualify as a scheme.</p>
    <p>Anyway, this might be an opportunity to find a better name for "hybrid numerals", and I propose calling them "Boston numerals", not just because of this Phelps design, but also because Carter is in Boston. Luc[as] loses out though.  :-(</p>
    <p>What do you guys think?</p>
    <p>(I hope Rodolfo and Kent are listening...)</p>
    <p>hhp</p>
