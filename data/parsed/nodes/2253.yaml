    html: |-
      <p>Bodoni Antiqua (URW++) does have gently hybrid numerals.<br>
      BTW, do you know how closely it's based on Bodoni's work?<br>
      It would be cool if old Giambattista actually make hybrids.</p>
      <p>The digital version of Plantin seems to have full lining nums,<br>
      and I don't have any of my metal typeface specimen books<br>
      handy. Do you have a link/sample?</p>
      <p>Perpetua: The Italic does indeed have nice hybrids, but the<br>
      Roman's nums are actually <em>shorter</em> than the x-height! Which is<br>
      quite strange. In any case Gill was indeed a numeral innovator;<br>
      the tall "2" in Perpetua's Roman and Joanna is something we<br>
      should all be doing frankly. Although the French <em>were</em> ahead of<br>
      everybody in terms of OS nums (until they took a break from text<br>
      fonts for a while* and when they resumed they picked up some<br>
      nasty Anglo habits).</p>
      <p>* "Thanks" to Charles Peignot.</p>
      <p>Preface: those nums are barely a hair taller than the x-height.<br>
      I've seen that done before, but I've never understood it. Being<br>
      a typeface designer I would notice it and believe it's intentional,<br>
      but how could it appear as anything but a "mistake" to laymen?<br>
      Isn't it a sort of golden rule of visual design to either deviate<br>
      clearly or not at all? (Which is not to say that rules shouldn't<br>
      be broken - to me it does need to make sense though.)</p>
      <p>So, how long did it take you to find ~1.5 examples of<br>
      early hybrid numerals? :-)  BTW, the #19 of the Phelps,<br>
      Dalton &amp; Co. handily predates those.</p>
      <p>hhp</p>
