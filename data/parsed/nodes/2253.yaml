    html: <p>Rodolfo, most people call me 'John'. Some people call me 'Mr Hudson'. Those who wish to distinguish me from my brother call me 'Mr John Hudson'. Those who need to distinguish me from some other John Hudson might append '...Tom Hudson's son' or '...the type designer' or '...the Anglo-Canadian type designer'. I have a friend who has known me since we were thirteen, and she's the only person who calls me 'Johnny' with impunity. <br> <br>The terminology we use to refer to things is determined by our need of precision, which typically is determined by whom we are talking to (although in my case it is also influenced by a certain, ahem, 'retentiveness'). Sure, I know what you mean by the <i>nickname</i> 'Didone', but will a non-typographer?</p>
