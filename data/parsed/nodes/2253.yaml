    html: <p>Nantucket, clearly Nantucket. Heavily Inﬂuenced by Newfoundland Screech. <br><br>Yeah gotta love those ﬁgures but I am far from recommending them as a candidate to completely “purge oldstyle ﬁgures in text”.  <br><br><i>Cast brass early Boston hardware store ﬁgures</i> probably predate Hrant’s showings. Which is neither here nor there. John Downer would ﬁnd nothing unusual about that. <br><br>Don’t speak loudly or Mike Parker may show up. Boston hardware store ﬁgs are those which Starling Burgess based for one of his typefaces.  <br><br>Goudy had used these style ﬁgures in Forum Title. The ﬁgure 4 in Goudy’s give more probability for a balance setting. Notice dates in Hrant’s showing. <br><br><a href="http://www.lanstontype.com/ForumTitleRoman.html" target="_blank">http://www.lanstontype.com/ForumTitleRoman.html</a> <br><br>I see nothing, and I mean nothing, is sacred! <br><br>Now “oldie style ﬁgs”, has joined “upper case” as <i>mud ﬂat terra nova</i> for the “New Typographical Bourgeoisie.” <br><br><i>Not to be confused with Bourgeois, approximately 9 pt. midway between Long Primer and Brevier which most of them, probably were not aware</i>  <br><br>So I ask them what they think of the suggestion below? Pretty strange. I kind of like strange, that’s why I hang around here. <br><br><a href="http://www.lanstontype.com/Bodoni-Roman.html" target="_blank">http://www.lanstontype.com/Bodoni-Roman.html</a> <br><br></p>
