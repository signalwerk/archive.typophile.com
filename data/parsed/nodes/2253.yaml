    html: "<p>'Scotch figures' may be confusing to many people, since there is already a Scotch classification of type, many examples of which do <i>not</i> include this kind of figure. <br> <br>I think having what amount to nicknames for different figure styles is fine, but we should first have an accurate way to describe figures. The most important distinction to this discussion is that between lining and ranging figures. The term 'lining figures' is used so commonly for cap-height figures that we tend to forget that it is an abbreviation for 'cap-height lining figures', i.e. of figures that are a common height, aligned to the caps. It is perfectly possible to have lining figures that align to other heights, e.g. to smallcap height, even to x-height and, in the case of Bell's famous figures, 'three-quarter cap height lining figures' (commonly called simply 'three-quarter figures' -- again, an abbreviation). Just as the term 'lining' does not by itself imply anything about the height of the figures -- other than that it is common --, so the term 'ranging' doesn't necessarily imply oldstyle figures, i.e. figures that range above and below a median defined by the x-height. It is perfectly feasible to have ranging figures that range above and below a median defined by the smallcap height, or even the cap height, although the latter would look very odd. From this it should follow pretty obviously that what we're talking about in this thread, precisely, are <i>three-quarter cap-height ranging figures.</i> Anything else is simply a nickname (of which there might be many: Scotch, Phemister, Boston, etc.) or an abbreviation (three-quarter ranging figs). <br> <br> <br>NB: using 'lining' to mean fixed-width is simply <i>wrong</i>. Lining and ranging describe vertical characteristics of figures; proportional and tabular describe horizontal characteristics. The truth of this is obvious as soon as one sits down to design typefaces with multiple figure styles: cap-height lining proportional, cap-height lining tabular, x-height ranging (oldstyle) proportional, x-height ranging(oldstyle) tabular, smallcap-height lining proportional, smallcap-height lining tabular, etc.</p>"
