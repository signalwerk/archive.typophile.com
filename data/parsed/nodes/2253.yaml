      <p>These figures are conventionally old-style.<br>
      Sure, they have a large “zero-height”, but that doesn’t make them a lining-oldstyle hybrid.<br>
      Many “normal” oldstyle figures have zero-heights that are larger than x-height.<br>
      And many “normal” oldstyle figures have zero and one that are lining-style (rather than a one that looks like a small-cap “I” and a zero that is a monoline circle), but we don't call those hybrids, which IMO would be a more accurate use of the term.</p>
