    html: '<p><a href="http://www.lanstontype.com/Bodoni-Roman.html" target="_blank">http://www.lanstontype.com/Bodoni-Roman.html</a> <br>French Oldstyle Figures, indeed they are. <br><br><i>Notice dates in Hrant’s showing.</i> <br><br>I was just pointing out that Goudy used a slightly hanging “ﬁgure 4”. For those new to this thread, these are not French Oldstyle ﬁgures. See the very interesting top posting by Hrant. Below is Goudy’s version of alternate ﬁgures. These follow somewhat Hrant’s posting. These are not French Oldstyle Figures. <br><a href="http://www.lanstontype.com/ForumTitleRoman.html" target="_blank">http://www.lanstontype.com/ForumTitleRoman.html</a>  <br><br>I suggest Goudy’s addition may have been helpful to balance the 1848. See 1848 without such balance, illustrated by Hrant’s showing. <br><br>I am a little confused though. First, Hrant you say that your showing is the earliest you have found, but now indicate there were earlier experiments across the great pond. Are the earlier ones consistent with the #19 of the Phelps, Dalton <span class="amp">&amp;</span> Co? <br><br>That question aside, I am not sure what they should be named. They are not French Oldstyle, they are too lining to be oldstyle and too oldstyle to be lining. Perhaps <i>old lining ﬁgs</i> would do. Tempting as it may be, naming such things after either location, foundry or designer can be a misleading. <br><br>Unless one can clearly establish the source not only to be fact, but to be ﬁrst in&nbsp;fact.</p>'
    html_clean: '<p><a href="http://www.lanstontype.com/Bodoni-Roman.html" target="_blank" class="link-external">http://www.lanstontype.com/Bodoni-Roman.html</a> <br>French Oldstyle Figures, indeed they are. <br><br><i>Notice dates in Hrant’s showing.</i> <br><br>I was just pointing out that Goudy used a slightly hanging “ﬁgure 4”. For those new to this thread, these are not French Oldstyle ﬁgures. See the very interesting top posting by Hrant. Below is Goudy’s version of alternate ﬁgures. These follow somewhat Hrant’s posting. These are not French Oldstyle Figures. <br><a href="http://www.lanstontype.com/ForumTitleRoman.html" target="_blank" class="link-external">http://www.lanstontype.com/ForumTitleRoman.html</a>  <br><br>I suggest Goudy’s addition may have been helpful to balance the 1848. See 1848 without such balance, illustrated by Hrant’s showing. <br><br>I am a little confused though. First, Hrant you say that your showing is the earliest you have found, but now indicate there were earlier experiments across the great pond. Are the earlier ones consistent with the #19 of the Phelps, Dalton <span class="amp">&amp;</span> Co? <br><br>That question aside, I am not sure what they should be named. They are not French Oldstyle, they are too lining to be oldstyle and too oldstyle to be lining. Perhaps <i>old lining ﬁgs</i> would do. Tempting as it may be, naming such things after either location, foundry or designer can be a misleading. <br><br>Unless one can clearly establish the source not only to be fact, but to be ﬁrst in&nbsp;fact.</p>'
