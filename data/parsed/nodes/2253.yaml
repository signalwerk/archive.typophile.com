    html: "<p>Trying to find out who first designed this kind of figures sounds great. But, I don't see why this new terminology should necessarily be tied to its history. Let's see, who first designed lining figures? <br> <br>If these 'hybrid' figures need a new name, then it should be something related to its 'physical' aspect: <br> <br>&gt; Basically old-style numerals that have bodies  <br>&gt; notably larger than the lc x-height, to the  <br>&gt; point where they sometimes seem like lining  <br>&gt; numerals shifted up/down - sometimes they even  <br>&gt; look like they're floating around a centerline.  <br> <br>:-)</p>"
