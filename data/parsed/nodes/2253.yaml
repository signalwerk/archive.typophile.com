    date_raw: 2 Dec 2003 — 8:36am
    votes: null
    html: "<p>&gt; Call them Scotch figures once and for all <br> <br>I'm taking this pretty seriously now... <br> <br>&gt; Don't let this happen to you. <br> <br>You should see how I drive. <br> <br>BTW, there is also some evidence that the Ancient Egyptians (the ones before the ones we think we know* about - the ones that made the Sphinx, not the much later Pyramids) visited the \"New World\". <br> <br>* But: <a href=\"http://news.bbc.co.uk/2/hi/americas/3254852.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/americas/3254852.stm</a> <br> <br>Speaking of \"transitional\", last night I found myself revisiting a passage in Updike that Kent had once pointed out. In it (vII, p230-1) Updike says that one Hunter introduced lining figures in 1785, but then shows what he calls \"transitional\" figures that look like hybrids, except you can't be sure because there's no lc to compare to. The thing is, his \"transitional figures\" look very much like the Miller (Scotch) ones, except those weren't made before the Hunter innovation (as far as I can tell), so how can they \"transition\"? <br> <br>-- <br> <br>Kevin, actually some people use \"lining\" to mean fixed-width (probably because such figures do enable <i>vertical</i> alignment across subsequent lines). BTW, it is interesting that the numerals in that #19 seem to be fixed-width. I don't remember seeing that in [early] hybrids - it seems to be an influence of lining figures (although oldstyles are actually easier to make fixed-width). <br> <br>hhp <br></p>"
