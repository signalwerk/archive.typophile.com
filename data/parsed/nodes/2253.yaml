    html: '<p>‘Scotch ﬁgures’ may be confusing to many people, since there is already a Scotch classiﬁcation of type, many examples of which do <i>not</i> include this kind of ﬁgure. <br><br>I think having what amount to nicknames for diﬀerent ﬁgure styles is ﬁne, but we should ﬁrst have an accurate way to describe ﬁgures. The most important distinction to this discussion is that between lining and ranging ﬁgures. The term ‘lining ﬁgures’ is used so commonly for cap-height ﬁgures that we tend to forget that it is an abbreviation for ‘cap-height lining ﬁgures’, i.e. of ﬁgures that are a common height, aligned to the caps. It is perfectly possible to have lining ﬁgures that align to other heights, e.g. to smallcap height, even to x-height and, in the case of Bell’s famous ﬁgures, ‘three-quarter cap height lining ﬁgures’ (commonly called simply ‘three-quarter ﬁgures’ — again, an abbreviation). Just as the term ‘lining’ does not by itself imply anything about the height of the ﬁgures — other than that it is common —, so the term ‘ranging’ doesn’t necessarily imply oldstyle ﬁgures, i.e. ﬁgures that range above and below a median deﬁned by the x-height. It is perfectly feasible to have ranging ﬁgures that range above and below a median deﬁned by the smallcap height, or even the cap height, although the latter would look very odd. From this it should follow pretty obviously that what we’re talking about in this thread, precisely, are <i>three-quarter cap-height ranging ﬁgures.</i> Anything else is simply a nickname (of which there might be many: Scotch, Phemister, Boston, etc.) or an abbreviation (three-quarter ranging ﬁgs). <br><br><br><span class="caps">NB</span>: using ‘lining’ to mean ﬁxed-width is simply <i>wrong</i>. Lining and ranging describe vertical characteristics of ﬁgures; proportional and tabular describe horizontal characteristics. The truth of this is obvious as soon as one sits down to design typefaces with multiple ﬁgure styles: cap-height lining proportional, cap-height lining tabular, x-height ranging (oldstyle) proportional, x-height ranging(oldstyle) tabular, smallcap-height lining proportional, smallcap-height lining tabular,&nbsp;etc.</p>'
