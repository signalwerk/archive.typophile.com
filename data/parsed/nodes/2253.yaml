    html: '<p>&gt; New England ﬁgures. <br><br>That seems much better than “Boston”. <br>But I’m realizing that if there’s going to be any geographic reference, it really needs to be Scotland: both Austin and Phemister were Scottish (although the latter’s working life was in New England). The former certainly deserves credit for breaking from the oldstyle/lining polarity*, and the latter might have in fact been the ﬁrst to discipline the deviation into a clear new style (I might ﬁnd out when I check out a 1888 Dickinson specimen book at <span class="caps">UCLA</span>). Plus in this case I think it’s not right to favor Carter anyway, since it seems de Groot did it ﬁrst (among living designers). <br><br>* Back around 1800. In fact, he (or maybe Bell) also deserves credit for the 3/4 lining numerals, which I also like. There seems to have been a lot of numeral innovation in the Highlands, for some reason. <br><br>So what I’m leaning towards is calling them Phemister, since Scottish is too broad: I’d like to be able to refer to “Bell numerals” (3/4 lining) and “Austin numerals” as well (like in Miller). But that’s assuming Austin didn’t make the ﬁrst true hybrids as well! More research required… <br><br>— <br><br>&gt; Notice dates in Hrant’s showing. <br><br>You mean that they predate Goudy? <br>The absoute latest that font could be is 1902, but it’s probably 2-3 decades earler. <br><br>The Forum numerals are interesting, and seem very similar to the ones in <span class="caps">ATF</span> Garamond (which did however come a bit later), in that they’re a very extreme case of hybrids, almost lining. <span class="caps">BTW</span>, I seem to remember Kent pointing out a precedent to the <span class="caps">ATF</span> Garamond numerals from around 1900, but I’m not sure. <br><br>&gt; <a href="http://www.lanstontype.com/Bodoni-Roman.html" target="_blank">http://www.lanstontype.com/Bodoni-Roman.html</a> <br><br>Those I call “French old-style”, since they were pioneered by the Didots (thanks to Rodolfo for pointing that out, a while back now). And I actually think that vertical arrangement is better than our conventional one, which is too low on the body overall. <br><br>hhp <br></p>'
