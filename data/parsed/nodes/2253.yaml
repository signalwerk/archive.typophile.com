    html: <p>Is my face red. Thank you for setting me straight on the terminology, but you can see why I was confused; in most conversations “lining” would seem to be shorthand for lining tabular, and “oldstyle” would seem to be shorthand for oldstyle proportional. I was under the impression that no one had ever yet considered that lining and tabular could be separated, hence my pet peeve. My hand has been out of typography for a long time, and I’m mostly exposed to the “defaults” of the masses, in which lining tabular ﬁgures are often all you&nbsp;get.</p>
