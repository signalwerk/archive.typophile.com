      <p>* It might even be true that hybrid numerals<br>
      started spreading faster due to the numerous<br>
      Typophile discussions on the topic.</p>
      <p>As for the way the zero and one look, that's moot here: we're<br>
      talking about height, and the way a couple of numerals look<br>
      is not enough to label the whole set of them as a new idea.</p>
      <p>hhp</p>
