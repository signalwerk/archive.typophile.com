      <p>I must say that in all my dealing with LHF they've been terrific. Very helpful and supportive. </p>
      <p>Why don't you just write Chuck and ask him?</p>
      <p>As far as being controversial, I think most of the debate has been around their copy protection scheme. My view is that Chuck is just trying to protect his intellectual property. The DRM doesn't affect the functionality of the fonts at all. If DRM can keep artists producing, I'm all for it.</p>
      <p>Hope this helps.</p>
