    <p>OK, so I know these guys have been controversial, but they have great fonts and they appear to have come to a reasonable conclusion on the DRM thing.</p>
    <p>But they have this annoying habit of introducing some killer fonts, and then having them just disappear within a week or two, and they won't even discuss why or give you any possible way of getting ahold of the now non-existent font.</p>
    <p>One such typeface is the truly amazing 'United Cigar' font, which an awful lot of work went into and then &gt;pow&lt; it vanished from the site in a very short time. Like a big tease. I should have bought it when I had the chance, but LHF discontinued it pretty quickly -- I wonder why? It makes NO sense! Does anybody know where I can get a copy of this font? It must surely exist SOMEPLACE, right? I'd prefer to have bought it legitimately but LHF simply refuses to even discuss it at this point. The have wonderful fonts but they're a very weird company. If anybody knows Dave Parr or otherwise has an 'in' on how I can get ahold of this font, please let me know -- I'm not seeking a free ride here; I really need it, and I'll be happy to pay for it!<br>
    B</p>
    <p><a href="mailto:xwhys@yahoo.com">xwhys@yahoo.com</a></p>
