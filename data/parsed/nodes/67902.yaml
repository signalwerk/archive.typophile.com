      <p>Thanks for the great advice. No such luck, however. Chuck was gracious and did respond promptly and personally, with a note saying that sometimes they discontinue fonts due to low popularity or if he just decides they aren't up to par (and in those cases he usually will send the font for free to the requestor) -- BUT in this case, apparently they had some sort of licensing standoff with the font designer and so they gave up, and the font isn't available to them at all anymore. It was up there for sale for a short time (like a week), but now it's gone -- so I KNOW somebody out there has it. </p>
      <p>I don't suppose I could ask someone to pirate it though, even if it's not available for sale and so nobody's losing the money (all I would need would be the alphabet turned into outlines in Illustrator and I'd be fine with that -- is that technically pirating?). But anyway. If there IS some generous soul out there who managed to procure this particular font (again, 'United Cigar'), who might be willing to send me outlines so I can get this project done (OR if someone knows the font designer and can put me in touch with them, as Letterhead couldn't), I'd be eternally grateful.<br>
      B</p>
      <p><a href="mailto:xwhys@yahoo.com">xwhys@yahoo.com</a></p>
