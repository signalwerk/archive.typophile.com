    html: |-
      <p>"I get that they are addressing a class with the @LETTERS, but did they have to create this class through fontlab somehow,"</p>
      <p>Yes.<br>
      "as in a new set of glyphs?"</p>
      <p>New glyphs? Presumably not: the whole point was to reference all existing letter glyphs in the font.</p>
      <p>&gt; That is, is it or is it not being substantiated in the actual code itself? </p>
      <p>Yes, there needs to be code for it. There are no built-in classes in FontLab or OpenType.</p>
      <p>&gt;And why isn't Fina or Init being used here? </p>
      <p>That's a question for the person who wrote the code. If it were me, my most likely reason to avoid 'init' and 'fina' would be poor app support. Even InDesign, which does support these features, contradicts the OpenType spec by not having them on by default. I lobbied hard to get them supported, but couldn't get them on by default.  :(</p>
      <p>&gt; Is Lookup an actual built-in function, or "feature", or just what the author chose to name this function right here in this example?</p>
      <p>The concept of a lookup is fundamental to OpenType itself. The AFDKO feature language supports it directly for those cases where a lookup needs to be explicitly handled for some reason. Your feature code will otherwise create one lookup per OT feature where it is not explicit.</p>
