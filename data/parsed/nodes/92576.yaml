  html: |-
    <p>I want to work with spaces in my sub code, or rather the glyphs immediately adjacent to the space.  I wonder if there is any way I could use a wildcard and simple variables to make this code a lot shorter. I'm trying to have a special glyh substition for all glyphs at the end of words, and all glyphs at the begining of words.</p>
    <p>If not I could always generate a line of code for every glyph - space combination, and every space - glyph combination.</p>
