    html: |-
      <p>Ok, Im advancing myself a little farther down this rabbit hole:<br>
      Very hard to find actual examples of opentype code online.<br>
      Lots of sites describing its capabilities, and a few sites that list all its "features" aka methods,<br>
      but very little actual code examples.</p>
      <p>It seems like this is what I want, though I haven't been able to get it to work:</p>
      <p>@LETTERS = [ &lt; all letters in the font that could be part of a word&gt;];</p>
      <p>feature clig {<br>
      lookup BEGIN_WORD_LIGS {<br>
      ignore @LETTERS @LETTERS'; # will match any word glyph preceeded by another word glyph.<br>
      sub c t by c_t.begin; # you know that there is no word glyph before the 'ct' sequence.<br>
      };</p>
      <p>lookup END_WORD_LIGS {<br>
      ignore @LETTERS' @LETTERS; # will match any word glyph followed by another word glyph.<br>
      sub o f f by o_f_f.end; # you know that there is no word glyph after the 'off' sequence.<br>
      };<br>
      } clig; </p>
      <p>I get that they are addressing a class with the @LETTERS, but did they have to create this class through fontlab somehow, as in a new set of glyphs? That is, is it or is it not being substantiated in the actual code itself?  And why isn't Fina or Init being used here?  Is Lookup an actual built-in function, or "feature", or just what the author chose to name this function right here in this example?</p>
