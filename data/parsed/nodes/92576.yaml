      <p>Sounds like a job for <strong>init</strong> and<strong> fina</strong> features, but I have yet to use them, so I’m not much help. However, the same thing can be accomplished with the <strong>calt</strong> feature.</p>
      <p>As I understand it (which I may not, and amendment will surely follow), text strings within brackets are processed and/or recognized sequentially, so—instead of a line of code for every glyph—you could use code like this:<br>
      <code>sub [ a b c d e f etc .]' space by [ a.fina b.fina c.fina d.fina e.fina f.fina etc.fina ];</code></p>
