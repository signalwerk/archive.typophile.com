    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Luc(as) de Groot</strong></p>
    <p>Lucas de Groot  (b. 21 June 1963 in Noordwijkerhout, the Netherlands) is a well-known Dutch type designer, the head of the type foundry Fontfabrik (AKA <a href="/wiki/LucasFonts" class="freelinking" rel="nofollow">LucasFonts</a>). De Groot is mainly known for the large font family or system, <a href="/wiki/Thesis" class="freelinking" rel="nofollow">Thesis</a>, consisting of <a href="/wiki/TheSans" class="freelinking" rel="nofollow">TheSans</a>, <a href="/wiki/TheSerif" class="freelinking" rel="nofollow">TheSerif</a>, <a href="/wiki/TheMix" class="freelinking" rel="nofollow">TheMix</a>, <a href="/wiki/TheSansMono" class="freelinking" rel="nofollow">TheSansMono</a> and later <a href="/wiki/TheAntiqua" class="freelinking" rel="nofollow">TheAntiqua</a>. Also <a href="/wiki/Corpid" class="freelinking" rel="nofollow">Corpid</a> (previously AgroSans).</p>
    <p>Luc also designed custom fonts such as <a href="/wiki/Calibri" class="freelinking" rel="nofollow">Calibri</a> and <a href="/wiki/Consolas" class="freelinking" rel="nofollow">Consolas</a> for Microsoft Vista, for the newspapers like Der Spiegel with ‘SpiegelSans’, Die tageszeitung with ‘Taz’, Folha de S. Paulo with ‘FolhaSerif’, and Sun Microsystems corporation with ‘SunSans’.</p>
    <p>Lucas de Groot teaches at the Design faculty of the University of Applied Sciences at Potsdam, Germany.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/fonts/designer/lucas_de_groot/" rel="nofollow">Luc(as) de Groot</a> at FontShop</p>
