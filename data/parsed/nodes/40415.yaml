    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Luc(as) de&nbsp;Groot</strong></p>
    <p>Lucas de Groot  (b. 21 June 1963 in Noordwijkerhout, the Netherlands) is a well-known Dutch type designer, the head of the type foundry Fontfabrik (<span class="caps">AKA</span> <a href="/node/14103" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LucasFonts</a>). De Groot is mainly known for the large font family or system, <a href="/node/61031" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Thesis</a>, consisting of <a href="/node/add/wiki?edit%5Btitle%5D=TheSans" title="Create node &quot;TheSans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TheSans</a>, <a href="/node/add/wiki?edit%5Btitle%5D=TheSerif" title="Create node &quot;TheSerif&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TheSerif</a>, <a href="/node/add/wiki?edit%5Btitle%5D=TheMix" title="Create node &quot;TheMix&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TheMix</a>, <a href="/node/add/wiki?edit%5Btitle%5D=TheSansMono" title="Create node &quot;TheSansMono&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TheSansMono</a> and later <a href="/node/add/wiki?edit%5Btitle%5D=TheAntiqua" title="Create node &quot;TheAntiqua&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TheAntiqua</a>. Also <a href="/node/add/wiki?edit%5Btitle%5D=Corpid" title="Create node &quot;Corpid&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Corpid</a> (previously&nbsp;AgroSans).</p>
    <p>Luc also designed custom fonts such as <a href="/node/add/wiki?edit%5Btitle%5D=Calibri" title="Create node &quot;Calibri&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Calibri</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Consolas" title="Create node &quot;Consolas&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Consolas</a> for Microsoft Vista, for the newspapers like Der Spiegel with ‘SpiegelSans’, Die tageszeitung with ‘Taz’, Folha de S. Paulo with ‘FolhaSerif’, and Sun Microsystems corporation with&nbsp;‘SunSans’.</p>
    <p>Lucas de Groot teaches at the Design faculty of the University of Applied Sciences at Potsdam,&nbsp;Germany.</p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/fonts/designer/lucas_de_groot/">Luc(as) de Groot</a> at&nbsp;FontShop</p>
