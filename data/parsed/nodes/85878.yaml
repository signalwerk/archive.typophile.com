      <p>If by a substitute you mean a similar "old style" looking font, then Al Bayan could do though it has a rather poor set of ligatures.<br>
      But if, shameless, self-promotion is allowed I'd suggest you check my (freely available) <a class="freelinking external" href="http://www.amirifont.org" rel="nofollow">Amiri font</a> which have rather a very rich set of contextual forms and covers almost all Unicode 6.0 Arabic block.</p>
