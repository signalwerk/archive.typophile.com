      <p>This is just curiosity on my part; I see in <a href="http://partners.adobe.com/public/developer/opentype/index_tag2.html" rel="nofollow">Adobe's list of Language System Tags</a> DHV for Dhivehi whilst <a href="http://www.microsoft.com/typography/developers/OpenType/languagetags.aspx" rel="nofollow">Microsoft's list</a> has DIV for Divehi. On Wikipedia, the language is called <a href="http://en.wikipedia.org/wiki/Dhivehi" rel="nofollow">Dhivehi</a> (* or Divehi, or Mahi) and the tag is div. Which tag is correct?</p>
      <p>Michel</p>
    html_clean: |-
