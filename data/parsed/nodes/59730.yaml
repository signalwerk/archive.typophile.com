    <p>I am working on feature code and need the 3-letter designation for both Spanish and Portuguese. I have used ESP and POR and they work when tested in FontLab but since I am just guessing, I would like a more authoritative answer. I tried Google but get every other kind of code than the 3-letter cap used for locl feature. Anybody know the link or the answer"</p>
    <p>ChrisL</p>
