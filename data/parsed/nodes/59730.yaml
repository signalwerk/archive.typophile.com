      <p>That Adobe page is an outdated version (probably v1.4) of the OpenType spec. The DHV tag has been deprecated. In OpenType coding, the correct language tag for Dhivehi is DIV.</p>
      <p>The current version of the OT spec provides correspondence with the ISO 639 language IDs: <a href="http://www.microsoft.com/typography/otspec/languagetags.htm" title="http://www.microsoft.com/typography/otspec/languagetags.htm">http://www.microsoft.com/typography/otspec/languagetags.htm</a></p>
    html_clean: |-
      <p>That Adobe page is an outdated version (probably v1.4) of the OpenType spec. The DHV tag has been deprecated. In OpenType coding, the correct language tag for Dhivehi is DIV.</p>
