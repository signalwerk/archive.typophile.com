    date_raw: 14 Jul 2009 — 7:46pm
    votes: null
    html: <p>By the way, the OT language system tags are actually four characters long, not three. But almost all of them have only three letters and a padding space character, e.g. 'DIV&nbsp;'. Most tools allow you to use only the three letters and add the padding automatically. There are a couple of four-letter language system codes defined though, and probably more will be defined in future.</p>
