      <p>Oh, I'd love to get some more background knowledge about this type too!</p>
      <p>A snippet of context – Oporin (Latin: Oporinus; Oporini is the genitive) was one of the Basel printers, working out of a building that still stands incidentally. He was a student of Froben's, arguably the most important Basel printer of the early 16th century. </p>
      <p>I have a few more photos of the same book here, in case it helps (some closeups of both the Roman and Italic):<br>
      <a href="http://www.flickr.com/photos/ninastoessinger/sets/72157616517306105/" title="http://www.flickr.com/photos/ninastoessinger/sets/72157616517306105/">http://www.flickr.com/photos/ninastoessinger/sets/72157616517306105/</a></p>
      <p>The German Wikipedia has some info on Oporinus ( <a href="http://de.wikipedia.org/wiki/Johannes_Oporinus" title="http://de.wikipedia.org/wiki/Johannes_Oporinus">http://de.wikipedia.org/wiki/Johannes_Oporinus</a> ) and also links to some more photos of the Vesalius book here (but this is less focused on getting the type large): <a href="http://quod.lib.umich.edu/w/wantz/vesd1.htm" title="http://quod.lib.umich.edu/w/wantz/vesd1.htm">http://quod.lib.umich.edu/w/wantz/vesd1.htm</a></p>
