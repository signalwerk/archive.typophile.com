    <p>These are images from Andrea Vesalius' <em>De Humani Corporis Fabrica</em>, printed in 1543 in the workshop of Johannes Oporini.</p>
    <p>If anyone knows who cut the type and/or whether there's a good digital typeface based on it, that would be great! Otherwise, suggestions of the most similar typefaces you can think of are very welcome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dehumani1_5002.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/dehumani2_4631.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/dehumani3_4397.png"></div><p></p>
    <p>Thanks!</p>
