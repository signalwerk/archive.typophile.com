      <p>Thanks, Vladimir. The engineers I am working with got a kick out of the square wheels link.</p>
      <p>The supporting graphics all around this font will be round, round, round. I thought a square based font would contrast that. And I was hoping that the sharp edged base lines and cap and x heights might give a strong sense of horizontal motion. Or speed even.</p>
      <p>Instead of wheels, I was kind of basing the letter shapes on the tubing that bicycle frames are made from. Evenly weighted strokes with apparent geometric circular bends.</p>
      <p>"Apparent" being the key word. I know actual geometric circles coming off straight edges look abrupt and need to be adjusted optically. I had to do a LOT of that kind of adjusting with these shapes and I did it mostly by feel.</p>
      <p>I was wondering if there was any agreed upon formula for these kind of optical adjustments or does everybody just futz with things until they feel right?</p>
      <p>BTW, Vlad, I LOVE your magical pen stereoscopic drawings! Is there anywhere I might see more of them?</p>
