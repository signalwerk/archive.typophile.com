    <p>I was working on a logo for an electric bicycle company and after drawing the few glyphs needed for the logo, I thought it would be interesting to flesh out the whole font. I was thinking that making the tops and bottoms of the glyphs line up horizontally with no overshoots would give the thing a lot of forward momentum. And I am hoping it might work well as a web font (for not real  large copy blocks) since there will need to be very little hinting. I am liking it but it is still early in the design stage so it's a good time for a critique.</p>
