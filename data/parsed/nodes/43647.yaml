    votes: null
    html: |-
      <p>I think I understand what James is saying. Sometimes too much simplicity is not enough coverage. </p>
      <p>They have to keep their bottoms covered. We, the end user, cannot blame them for wanting that. EULAs like Village's are wonderful for us, but we can't count on that every time. That is why it is absolutely essential to not only read the EULA when you license a typeface. Don't be afraid to ask questions of the foundry. If the foundry doesn't care enough to answer you, or if they do and you don't like the answer, then don't license from them.</p>
    html_clean: |-
