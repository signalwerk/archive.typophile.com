    <p>Antecedent was developed over the past year for my MA degree at Surrey Institute of art and design. The family consists of two sets, one for the screen and one for the print. The idea was to tweak the design but maintain the characteristics of the design so both would be seen as one typeface. The most significant change would be the xHeight and tracking.</p>
    <p>I would greatly appreciate any feedback anyone has to give on the ideas I have set forth as well as the design itself. I am looking for feedback for my Critical Exposition class this term. I have set up a temporary site with the theory and background information for this design at <a href="http://www.e3type.com">http://www.e3type.com</a></p>
    <p>Thanks,<br>
    Jim</p>
