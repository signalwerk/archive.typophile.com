    <p>I remember a while back I asked you all what the "best" schools for type design were, and now, at the beginning of my senior in high school I've decided to study communication design. What I really want to do is design newspapers, magazines, books and other printed matter, so I asked you all this- What are the best schools to look at to study this sort of thing.</p>
    <p>I've read about several places so far, ideally I am looking for a place that would allow me to submit a largely digital portfolio, since my drawing skills are not incredibly great and most schools are looking for a very rounded artist-type. I have some sketches, mostly building designs and observational drawings from when I was going for architecture, but a large amount of digital work I have done for school things and "for pleasure."</p>
    <p>Ideas, thoughts, comments?</p>
