    html: <p>Endre, I'm doing the course you're talking about! I'm in 3rd year, Communication Design. Stephen Banham gave us weekly lectures on typography in 2nd year. There are also electives in typography and publication. The typography elective covers newspaper design, information design, etc. The publication elective involves creating a 64-page book and we get taught how to bind it ourselves.</p>
