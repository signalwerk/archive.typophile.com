      <p>I got a shockingly great education in "Multimedia Graphic Design" at Champlain College in Burlington, Vermont (which, BTW, is an amazing place to live.) Champlain is a small school that has grown A LOT in the last 10 years and has extraordinary facilities. </p>
      <p>One of my professors had taught at RISD for 17 years before moving up to VT, and another professor was the stuff of movies.  So talented, so involved, and so in love with design. Champlain gave me a lot more than I expected. </p>
      <p><a href="http://www.champlain.edu" title="http://www.champlain.edu">http://www.champlain.edu</a></p>
      <p>good luck!</p>
