      <p>You sure you don't want to try Australia;o)<br>
      I got an amazing insight into typography studying and later teaching alongside Stephen Banham whilst at RMIT (Royal Melbourne Institute of Technology) They also have a practical studio year (extra year) for exceptional students which was a great way of smoothing the transistion into the workforce.</p>
      <p>To see some of Stephen's work check out<br>
      <a href="http://www.letterbox.net.au/" title="http://www.letterbox.net.au/">http://www.letterbox.net.au/</a></p>
