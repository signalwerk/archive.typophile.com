      <p><cite>What I really want to do is design newspapers, magazines, books and other printed matter</cite></p>
      <p>You're looking at BA/BFA programmes at this stage, but you should keep in mind that the best programmes at postgraduate level in the field you are interested in are the <a class="freelinking external" href="http://www.reading.ac.uk/typography/home.html?courses/postgraduate/info_des.html" rel="nofollow">MA Information Design</a> and <a class="freelinking external" href="http://www.reading.ac.uk/typography/home.html?courses/postgraduate/pub_book.html" rel="nofollow"> MA Book Design</a> at the University of Reading. </p>
      <p>Some images of student work are <a class="freelinking external" href="http://www.flickr.com/photos/typographer/sets/72157600013174929/" rel="nofollow">here</a> and <a class="freelinking external" href="http://www.flickr.com/photos/typographer/sets/72157600013098601/" rel="nofollow">here</a> respectively.</p>
