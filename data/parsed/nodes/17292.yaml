      <p>He's on edition 2.5 or 3 now.</p>
      <p>I'm looking at a 1992 first edition and a 1999 revised second edition right now. The second edition is a hundred pages longer, so I'd say it's obvious there are significant differences (or at least additions) between those two.</p>
      <p>The revised second edition has about 40 pages that have corrections or additions compared to the regular second edition.</p>
      <p>I think that the current version is actually "edition 2.5" as of 2002 or so, and has moderate noticeable changes compared to the second edition, mostly in areas that have to do with things that have changed due to technical advances (e.g. OpenType). However, my most recent copy is at work, so I can't check easily.</p>
      <p>Regards,</p>
      <p>T</p>
