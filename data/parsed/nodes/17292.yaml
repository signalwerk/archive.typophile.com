      <p><em>The funny thing is that only a few days later, I saw a hardcover copy of the 3.0 edition in another store — very perplexing!</em></p>
      <p>Well, if it makes you feel any better, I just read through the first 65 pages of my v3.1 today. For the entire first chapter, only every other set of pages (one side of each piece of paper) is printed. Oddly enough, you'd expect the same near the end of the book, but it doesn't seem to be the case.</p>
      <p>Oh, the irony in having a defectively-printed version of a book about typography. I'm not returning it, either. :)</p>
      <p><em>Is this a new trend, and is it really necessary?</em></p>
      <p>Considering that Bringhurst cites Strunk and White as his inspiration for <em>ETS</em>, maybe he's just trying to keep up with S&amp;W's publishers. I've still got my old copy of the Elements of Style. I personally find the illustrated edition to be rather <em>un</em>necessary.</p>
  - id: 105307
    user: 7716
    date: 2006-01-22T01:25:00
    date_raw: 22 Jan 2006 — 1:25am
    votes: null
    html: |-
      <p><em>For the entire first chapter, only every other set of pages (one side of each piece of paper) is printed. Oddly enough, you’d expect the same near the end of the book, but it doesn’t seem to be the case.</em></p>
      <p>That's because the book is comprised of a series of 32-page <em>signatures</em>. Look at the top or bottom of the book, near the spine, and you will see the signatures and how they fold. Or, open up the book at pages 16-17 (or 48-49) and look at the spread's gutter: you will see the sewing that keeps those 32 pages together. (I have a copy of version 2.4 here, and it is made up of 11 signatures.)</p>
