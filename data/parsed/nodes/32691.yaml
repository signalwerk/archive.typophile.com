      <p>It’s great for generating palettes, and really useful for web colors, but the CMYK builds it generates bear no similarity to screen. They aren’t just a little off, they’re just plain wrong. </p>
      <p>Take a look at <a href="http://www.colorjack.com">Colorjack</a>; it’s been around a little longer and has a better interface.</p>
