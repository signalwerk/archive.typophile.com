    <p>Adobe’s color theme sharing application — anybody tried it? Is it really useful to professional graphics designers, or is it just another twee “Web 2.0” social thingy, given that it’s basically the Live Color functionality from Illustrator CS3?</p>
    <p><a href="http://kuler.adobe.com" title="http://kuler.adobe.com">http://kuler.adobe.com</a><br>
    <a href="http://labs.adobe.com/technologies/kuler/" title="http://labs.adobe.com/technologies/kuler/">http://labs.adobe.com/technologies/kuler/</a><br>
    <a href="http://www.adobe.com/go/kuler_discussion" title="http://www.adobe.com/go/kuler_discussion">http://www.adobe.com/go/kuler_discussion</a></p>
