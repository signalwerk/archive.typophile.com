    html: <p>The font has pretty strange font metrics. The descender line is at -3, the x-height is at -1, the ascender and the caps height are at 1000.  <br><br>I assume you’re using FontLab? Either unlock the Vertical Metrics layer and drag the ascender, descender, caps height and x-height lines to their appropriate positions, or go to File / Font Info / Metrics and Dimensions / Key dimensions, and enter the appropriate values here.  <br><br>Adam</p>
