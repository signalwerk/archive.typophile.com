    html: <p>Matt, Jim, et al <br>I opened your ﬁle to look. Just a note — as there is some overlapping of forms in a couple of the glyphs of the font, ﬁrst select all of the points in that particular glyph, then go to the Elements drop down menu, and then select “remove overlap.” This happens when the points actually are directly on top of each other, not when the forms overlap but the points of the forms of the glyph are in diﬀerent places. Anyway, have fun with this. Font creation is always an&nbsp;adventure.</p>
