    html: <p>Jim <br>Fontographer set a default value of 800 for ascent and 200 for descent, so obviously if your font goes beyond this default setting you have to do what Mark has shown you. If you did not comply with the default settings, then the program was a bit unforgiving, causing you to have to check the “automatically compute em square …” as Mark shows.  <br><br>By the way, I use Type Tool 2 and ﬁnd it excellent and you can upgrade if you like to FontLab as was pointed out. Further, there are a lot of things about Fontographer that are annoying, lousy manual, etc., but one of the most irritating is what is referred to as “grid spacing.” If you do not select all of the points and then select the “Align Points to Grid” command, you get points without integral numbers; in other words, instead of 120, 66 horizontal and vertical measurements, you will get fractional hundredths, like 120.223, 65.97 (from the manual) measurements. This might sound silly, but it can be problematic. Type Tool automatically does away with decimal percentages like this and eﬀectively snaps to a grid. Mind you, Fontographer was the choice of most for years, so I shouldn’t complain too loudly. And, just to add one more thing, “auto spacing,” and “auto kerning” were never a good idea because the results were always lousy. Not to say that I didn’t&nbsp;try.</p>
