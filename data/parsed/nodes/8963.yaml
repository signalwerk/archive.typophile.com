    html: <p><i>&gt;I changed the em square to 1500. Unfortunately, all this did was change the font size at diﬀerent sizes, </i> <br><br>Yes, it would have that eﬀect. The problem (or at least part of the problem) is that you are drawing the characters far outside the boundaries of your font. The ascent and descent lines are where the topmost and bottommost parts of your characters should normally stop. If you extend parts of characters beyond those limits, they will get clipped oﬀ when you use the font in most programs. <br><br>I would suggest spending some time with the Fontographer manual, go through the tutorials,&nbsp;etc.</p>
