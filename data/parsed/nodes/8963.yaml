    html: '<p>A couple of things:  <br><br>The em square should normally be the sum of the ascent and descent values. As it is, they add up to much more than 1000. It doesn’t have to be 1000. In the font you posted it would be 1125 + 375 = 1500. 1500 is not the typical ﬁgure, but it will work ﬁne. <br><br>To do this, just go to the Font Info window and check both “Retain path coordinates when changing em square” and “Automatically compute em square from ascent + descent”. Click <span class="caps">OK</span> and everything should work a lot&nbsp;better.</p>'
    html_clean: '<p>A couple of things:  <br><br>The em square should normally be the sum of the ascent and descent values. As it is, they add up to much more than 1000. It doesn’t have to be 1000. In the font you posted it would be 1125 + 375 = 1500. 1500 is not the typical ﬁgure, but it will work ﬁne. <br><br>To do this, just go to the Font Info window and check both “Retain path coordinates when changing em square” and “Automatically compute em square from ascent + descent”. Click <span class="caps">OK</span> and everything should work a lot&nbsp;better.</p>'
