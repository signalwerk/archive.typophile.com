    html: <p>Hmm. From what you say, it sounds like you’re running <span class="caps">OS</span> X. There are some issues that aﬀect font developers having to do with the system font cache in <span class="caps">OS</span> X. Try giving the font a diﬀerent font name when you generate the font. It could be that the system has cached a copy of the earlier version and is not showing the new one. <br><br>There is also a utility called Font Finagler which will clear out your font cache if you don’t want to change the name. Changing the name is easier, though, since clearing the font cache requires restarting or logging out and back in. <br><br>I don’t know for sure that this is what’s going on, but it seems&nbsp;likely.</p>
