    html: <p>Matt, is it possible for you to post the Fontographer font ﬁle here? (Not the generated TrueType of PostScript font) There seems to be something fundamentally wrong with the way you’ve set up the font. <br><br>Jim, FontLab uses a diﬀerent system for curve/line transition points which may make more sense to you. These points can be designated as smooth or not smooth. Smooth gives the same eﬀect as a tangent point in Fontographer when a line a curve meet. The control point of the curve is aligned to the angle of the incoming line keeping the transition between the curve and the line smooth. When the point is set to not smooth, the control point is unconstrained allowing the transition to form a sharp corner. The smooth/not smooth thing works with the transition between curves as well except that it keeps the control points on either side aligned, again creating a smooth transition. This is the same as a “curve point” in Fontographer. <br><br>I sure hope there are other people familiar with Fontographer to help answer some of these Fontographer questions. I switched to FontLab cold turkey over a year ago and would rather forget about Fontographer and all the stupid little tricks you have to learn to use it eﬀectively. FontLab is way better.  <br><br>And Matt, as it seems you are just starting to learn about making fonts, I would suggest using something like FontLab’s <a href="http://www.fontlab.com/Font-tools/TypeTool/">TypeTool</a>. It’s cheap and easier than FontLab, and you won’t be learning to use an obsolete and virtually unsupported program (Fontographer was last updated in <i>1996!</i>). Plus, you can upgrade to FontLab later if you decide you like this sort of thing. Just a friendly&nbsp;suggestion.</p>
