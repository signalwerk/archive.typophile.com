      <p>Thank you all for such a long debate.<br>
      Actually I didn't expected to get a reply after more than a year since posting.</p>
      <p>As I mentioned, I had to do a logo (in 2001) and wrote the name of that club.<br>
      I wasn't satisfied with it and did some adjustments to the letters.<br>
      Everything was fine and the logo was approved and maybe the year after, I thought it would be nice to have a font like that. </p>
      <p>I took Times, indeed, and modified the letters in CorelDraw and then exported them as a font. It's a font since then, but I never sold it, or offered it for free, so it's more like a set o letters in an image. Never used it again.</p>
      <p>As I did it long time ago, I forgot how things started and developed, but it's my mistake, I should have mentioned it was based on Times.</p>
