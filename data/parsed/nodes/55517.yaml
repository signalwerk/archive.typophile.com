    html: <p>If you want to modify a font...go for it! But...don't sell it a brand new font either. Sure, a lot of people try to recreate parts of fonts...and they end up EXACTLY like one they were modifying. It's annoying and stupid. You can start with a basic font, like Helvetica...or something similar to what you are going for. But, have a plan. The current font you have brought forth....is just a change to an existing font. It looks like you sat down and said "I want to change Times." Ok...well, you changed it! But, was there a purpose in changing it, or not? From what I'm seeing...there was no purpose to changing. That to me is the difference. Change with a purpose is cool because you can explain what you changed and why you changed it. Change for the sake of change...is just an experiment. Experiments aren't bad, but they should never be sold, or passed off as anything but a small change to an existing font.</p>
