    html: |-
      <p>Janek: <em>As sure as shit some of them are modified versions of Frutiger, nay?</em></p>
      <p>I very much doubt any of them were made by opening up the Frutiger fonts in a font editing application and modifying the BCP paths. Not only is that illegal, it is not something a professional type designer would want to get caught doing.</p>
      <p>David: <em>I've counted, and 96% of the serious type design I do begins with modifying an existing </em>[my]<em> font...</em></p>
      <p>I do that too, though not quite so much.</p>
      <p>What I mean is what I said; if you want to do some serious type design, don't start by transforming someone else's font files.<br>
      This is a pedagogic principle; it's like, do life drawing rather than tracing over photos.<br>
      The habits you start with form semantic grooves that inform your work, just as the school you go to and the companies you start working for color your subsequent career. </p>
      <p>I don't deny that there are skills to be acquired in cut-and-paste and morph and tweak &amp;c., but learning how to construct a font from scratch is the most solid foundation. It especially gives you a grasp of the underlying mechanics of a font: vertical metrics, stem widths, sidebearings, overshoot, &amp;c.</p>
