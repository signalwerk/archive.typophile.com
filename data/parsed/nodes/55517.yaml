    <p>Hello everybody,</p>
    <p>I had to create a logo for a local club called "Friends' Club" some time ago.<br>
    As I was playing around with the logotype I had a sort of new look for a type.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/friends1_5447.jpg"></div><p></p>
    <p>I have created the other letters and here they are.<br>
    I would like to know your opinion on it. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_4664.jpg"></div><p></p>
    <p>I would like to create the font and use it so before I go on I would like to know what you think.</p>
    <p>The logo is here: <a class="freelinking external" href="http://www.florin.reel.ro/folio/logos.html#friends" rel="nofollow">http://www.florin.reel.ro/folio/logos.html#friends</a></p>
    <p>Please comment/critique.</p>
    <p>Thank you.</p>
