      <p>InDesign secrets — I'll look into that.</p>
      <p>"This will paste the upside-down-box inline" Yes, this is what I usually do. Not fun, though, if it's a several-word phrase and reflowing breaks it. (Although, to be fair, I can't say this happens often at all, or even that this particular example has come up more than a couple times.)</p>
      <p>"Not sure if I'm understanding correctly..." Judging by your suggestion, I think you may not have, but probably I was unclear. It's typical in poetry anthologies to set poems flush left, but center the entire flush left block of text between the left and right margins. All the lines line up on the left edge, but where the left edge falls is dependent on how long the longest line is. Only the longest line will actually be "centered." So, it is the left indent (or a left tab) that would be needed, not a center tab. Doing this manually, by dragging a tab stop or increasing the indent in the tool bar thingy isn't a nuisance for one poem, but if you have a hundred pages of poems — wouldn't it be nice to be able to make it part of the style? This would necessitate, though, that you designate what to treat as one clump, which brings me to the idea I was proposing above.</p>
      <p>Thanks for your suggestions.</p>
      <p>Josh</p>
