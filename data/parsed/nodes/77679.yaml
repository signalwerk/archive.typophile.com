      <p>Josh, I think part of your demands could be addressed with features available in InDesign since version CS3. Here is one possible solution for centering poems or a-like texts.</p>
      <p><strong>Centered poems</strong></p>
      <p><em>(a)</em> cut the text and paste it in a blank area to create a new frame. Adjust its width to match the longest line. Cut the frame (not the text) and paste it into the original frame. Now you can center the paragraph where the frame was inserted and it will align accordingly.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/capture_01032011_030023_4230.gif"></div><br>
      .<p></p>
      <p><em>(b)</em> select the poem and convert it to an one-column table. Reduce table width to match the longest line. Format table lines and internal spaces to achieve the same format as a plain text (ideally, you must create table and cell styles to automate this). Center the outer paragraph (where the table was inserted). This procedure has an advantage over the first one as it allows text/table flow through column and page breaks.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/capture_01032011_030418_4638.gif"></div><br>
      .<p></p>
      <p><strong>Upside-down text</strong></p>
      <p>By now, there is no solution for this in InDesign. The method you did adopt is the best ID can achieve. But you can easily solve the problem creating an upside-down version of the font in use, what takes just minutes in FontLab.</p>
      <p>Open the font, select all glyphs and do a vertical flip. The glyphs with ascenders or descenders will be vertically misaligned, so you need to realign them. The best way to do this is to measure ascender and descender heights, select a group of glyphs (say, all lowercase with descenders) and do a shift (Transofrm panel) by this measure.</p>
      <p>Before export, rename the font to avoid conflict with the original one. The remaining aspects are the same: no need to edit spacing, kerning or OT features. Note you new crazy-like font permits normal text flow with kerning and even hyphenation.</p>
      <p>Of course, this need to be allowed by the EULA. </p>
      <p>To get mirror right-to-left text you must convert it to backwards text. There are a number of sites which do this using JavaScript, like <a class="freelinking external" href="http://www.java-scripts.net/javascripts/Backwards-Text-Converter.phtml" rel="nofollow">this</a>. If you need just backwards text, this is enough. If it also must be flipped, you can apply the upside-down font.</p>
      <p>Later I will try to add solutions for your other issues.</p>
