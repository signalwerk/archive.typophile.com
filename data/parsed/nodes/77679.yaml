      <p>The difference between option (a) and (b): with the table you can resize the frame or link it to another one and the table will flow. With a rigid frame inside other, there is no way to flow text.</p>
      <p>About horizontal brackets, I was thinking if it's not a viable idea to make this with underline plus special open and close glyphs. Let me try a better description: suppose you need to add a bracket below the word <strong>thing</strong>. With special glyphs, you insert the "open bracket", type the word, apply underline to it and insert the "close bracket". If properly designed, these open and close glyphs would glue to the underline and compose a bracket.</p>
      <p>To make a bracket above, you just need open and close glyphs at the top of leading and a baseline-shifted underline. To simulate parenthesis and braces, four more pair of open and close glyphs do the trick. It's not perfect, but may be useful.</p>
      <p><cite>More than once I've spent hours positioning breves and ictuses</cite></p>
      <p>I believe the easier way to do this is to add a small anchored frame and insert the diacritic there. As it's anchored, it will follow text flow. And if you define anchored frame preferences (position, relationship to the anchor, size) it will be automatically positioned at next insertions.</p>
    html_clean: |-
      <p>The difference between option (a) and (b): with the table you can resize the frame or link it to another one and the table will flow. With a rigid frame inside other, there is no way to flow text.</p>
      <p>About horizontal brackets, I was thinking if it's not a viable idea to make this with underline plus special open and close glyphs. Let me try a better description: suppose you need to add a bracket below the word <strong>thing</strong>. With special glyphs, you insert the "open bracket", type the word, apply underline to it and insert the "close bracket". If properly designed, these open and close glyphs would glue to the underline and compose a bracket.</p>
      <p>To make a bracket above, you just need open and close glyphs at the top of leading and a baseline-shifted underline. To simulate parenthesis and braces, four more pair of open and close glyphs do the trick. It's not perfect, but may be useful.</p>
