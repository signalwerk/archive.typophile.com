      <p>Unfortunately, I don't know any secret ways to do these things without "time-consuming manual adjusts" — so I guess what I really meant by "workarounds" was "various ways of accomplishing [whatever] in a time consuming and manual fashion." Such as manually positioning frames or placing frames into the text stream and kerning them over text or using anchored objects, etc.</p>
      <p>I too would like to see all of the things you've listed above. More than once I've spent hours positioning breves and ictuses (ictii?) to center them visually over the relevant syllable in metrically scanned poetry by converting them to outlines, aligning them to a horizontal guide above the line of text and adjusting the horizontal spacing manually. What this has in common with horizontal braces, inverted text, centering on longest lines, etc., is that it requires the same effect to be applied to each of the several characters (or lines) that have it applied with different results.</p>
      <p>The vertical bar feature, which I have also wanted, should, however, be simple enough to add as a paragraph option, as it would work similarly to the existing paragraph rule tools.</p>
      <p>Oh, and thank you for the single-cell table idea. I hadn't thought of that. Although I'm not sure I understand how this is different than pasting a text frame into a centered paragraph, as you describe in option (a) above.</p>
      <p>Josh</p>
      <p>(Edit: Ooh! How about a "bracket" tool that would place a bracket above, below, or vertically in the margin by a selected piece of text? It could have options including square bracket, parenthesis, brace, straight line, angle bracket, maybe others.)</p>
