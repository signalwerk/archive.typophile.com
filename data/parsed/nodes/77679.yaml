      <p>I guess I misunderstood your centering question. I'd probably just select the poem and apply a left indent until the longest line looked centered. It's not as slick as having an automated method, but it shouldn't take more than a few seconds. It would have the disadvantage, though, that any changes you made to the text later (font, point size, etc) might make it off-center.</p>
      <p>Incidentally, you probably know this already, but if you select some text and then click in the left indent box in the control panel, you can then use your keyboard's arrow keys to increase or decrease the value incrementally. Sometimes that's faster than entering a value, seeing the result, entering a new value, etc.</p>
