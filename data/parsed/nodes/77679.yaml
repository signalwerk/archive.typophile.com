      <p>Actually, ID has a sort of cluster approach with GREP styles and nested styles. So the problem is not to pick up some text fragment, but to apply <em>one</em> format to it. Although I'm not otimistic about Adobe to do that, I'd like very much to see this:</p>
      <p><strong>1</strong>. To add a diacritic for a syllabe.<br>
      <strong>2</strong>. To add a graphic mark (say, horizontal bracket) to a sequence of text.<br>
      <strong>3</strong>. To highlight text with a proper tool (no need to adulterate strikethrough and underline).<br>
      <strong>4</strong>. To add vertical bar at left or right of a text fragment.<br>
      <strong>5</strong>. To permit hanging text (today this is possible with anchored frames).<br>
      <strong>6</strong>. To have real conditional text (actual tool is very limited).</p>
      <p>So, to put it simple, I'm also interested in your idea to ID improvement.</p>
      <p><cite>I'm aware there are plenty of workarounds for these issues</cite></p>
      <p>Plenty? I'm unsure if there is even one way to achieve each of the results you described without doing time-consuming manual adjusts. The poem centered with table is easy, but I never saw this solution before –even in InDesign Secrets or other specialized sites.</p>
      <p>If you know other workarounds to automate these operations, it would well deserve an article in ID Secrets. Many ID users could benefit from it.</p>
