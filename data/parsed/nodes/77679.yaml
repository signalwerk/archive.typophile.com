      <p>My guess is that those features aren't requested very often, but you might try posting your question at the site "InDesign Secrets" (indesignsecrets.com) where they are good at coming up at InDesign workarounds.</p>
      <p>For flipping an individual word upside down that still flows with the text, you could create a separate small text box containing just that word, rotate the box 180 degrees, copy that box (not the word but the entire box) to the clipboard, place your cursor where you want it to go, and then paste. This will paste the upside-down-box inline on that line of text, and it will reflow with that text if the line reflows.</p>
      <p>&gt; centering the longest line, then selecting the rest of<br>
      &gt;  the lines and indenting them to match</p>
      <p>Not sure if I'm understanding correctly, but I'd do it by putting a tab at the beginning of each line of the poem, then select the entire poem and give that whole block just one tab -- a "center" tab -- and adjust that "center" tab until the entire centered poem has it's longest line just touching the left margin.</p>
