    html: <p>While some newer apps use DirectWrite in Windows 7, wouldn't older apps using GDI font objects render text just the same as XP? As far as XP's various font settings, ClearType can be disabled in Win7 using the ClearType tuner, and antialiasing as well with <a href="http://www.davidjnice.com/articles/windows7_disableClearType.html" rel="nofollow">a registry edit</a>.</p>
