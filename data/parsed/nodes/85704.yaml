    <p>I'm a mac user but I have boot camp set up on my mac and I'm about to buy a copy of Windows on ebay, so that I can test my first font on it.</p>
    <p>I was wondering if any of you guys think it's necessary to test on both versions of the latest Windows systems. Half the people out there use 7, and half are using XP. Is there a difference in how they handle fonts, or what? I'm thinking about buying both and testing on both if I have to, but only if necessary.</p>
    <p>Thanks in advance to anyone who knows.</p>
