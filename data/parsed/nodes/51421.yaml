    html: <p>Matt, this is called "optical correction" and all professionally designed typefaces incorporate these elements into the letterforms. It has to do with positive/negative space, and making the letterforms appear balanced when in fact there are these small details that are measurably different. For a quick example, draw a square and a circle the same height and width. The circle will appear smaller even though it is the same height. This is why letters like O and Q, etc. have "overshoot" and actually extend past the height of the other letters.</p>
    html_clean: <p>Matt, this is called "optical correction" and all professionally designed typefaces incorporate these elements into the letterforms. It has to do with positive/negative space, and making the letterforms appear balanced when in fact there are these small details that are measurably different. For a quick example, draw a square and a circle the same height and width. The circle will appear smaller even though it is the same height. This is why letters like O and Q, etc. have "overshoot" and actually extend past the height of the other letters.</p>
