    html: |-
      <p>The way x's are usually constructed in typefaces has to do with a well-known optical illusion. Here is a simple example: Using only your eyes--no cheating with a straight edge or tilting your screen at a more advantageous angle--which of the two diagonal line segments on the right looks most like it is a continuation of the diagonal line segment on the left?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/illusion_4925.gif"></div><p></p>
      <p>After you have decided, check your answer with a straight edge.</p>
