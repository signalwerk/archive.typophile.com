    html: "<p>One other thing: The amount to which this is done depends on how thick the strokes are. On a bolder typeface, the amount of compensation is greater; on a very thin typeface, maybe none at all. The amount also relates to how far from perpendicular the two main strokes are in relation to each other. The amount will be most extreme in a very bold condensed typeface.</p>"
