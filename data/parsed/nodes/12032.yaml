    <p><a href="http://www.macrhino.com/" target="new" title="Go to the website" rel="nofollow" class="link-external">MRF (MAC Rhino Fonts)</a> was established in 2003, but founder <a href="/wiki/Stefan%20Hattenbach" class="freelinking link-lost" rel="nofollow">Stefan Hattenbach</a> has been producing fonts since 1997. The <a href="/wiki/foundry" class="freelinking link-lost" rel="nofollow">foundry</a> operates as an independent studio, collaborating with its partners in various disciplines whenever necessary.</p>
    <p>MRF has accelerated its type design efforts since 2004. This will continue, along with advertising and graphic design work. In most cases, their typefaces are available from a variety of quality vendors: <a href="/wiki/Fountain%20Type%20Foundry" class="freelinking link-lost" rel="nofollow">Fountain Type Foundry</a>, <a href="/wiki/PsyOps%20Type%20Foundry" class="freelinking link-lost" rel="nofollow">PsyOps Type Foundry</a>, and <a href="/wiki/Veer" class="freelinking link-lost" rel="nofollow">Veer</a>. In the future, a unique collection of typefaces will be available exclusively through MRF.</p>
    <p>MRF also specializes in custom type design. They can customize existing designs or create original typefaces for a variety of uses, such as corporate branding.</p>
