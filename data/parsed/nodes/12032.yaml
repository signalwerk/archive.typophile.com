  html: |-
    <p><a href="http://www.macrhino.com/" target="new" title="Go to the website"><span class="caps">MRF</span> (<span class="caps">MAC</span> Rhino Fonts)</a> was established in 2003, but founder <a href="/node/12300" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stefan Hattenbach</a> has been producing fonts since 1997. The <a href="/node/12033" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundry</a> operates as an independent studio, collaborating with its partners in various disciplines whenever&nbsp;necessary.</p>
    <p><span class="caps">MRF</span> has accelerated its type design efforts since 2004. This will continue, along with advertising and graphic design work. In most cases, their typefaces are available from a variety of quality vendors: <a href="/node/add/wiki?edit%5Btitle%5D=Fountain%20Type%20Foundry" title="Create node &quot;Fountain Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fountain Type Foundry</a>, <a href="/node/add/wiki?edit%5Btitle%5D=PsyOps%20Type%20Foundry" title="Create node &quot;PsyOps Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">PsyOps Type Foundry</a>, and <a href="/node/12009" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veer</a>. In the future, a unique collection of typefaces will be available exclusively through <span class="caps">MRF</span>.</p>
    <p><span class="caps">MRF</span> also specializes in custom type design. They can customize existing designs or create original typefaces for a variety of uses, such as corporate&nbsp;branding.</p>
