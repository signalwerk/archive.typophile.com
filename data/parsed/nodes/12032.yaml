    <p><span class="caps">MRF</span> has accelerated its type design efforts since 2004. This will continue, along with advertising and graphic design work. In most cases, their typefaces are available from a variety of quality vendors: <a href="/node/add/wiki?edit%5Btitle%5D=Fountain%20Type%20Foundry" title="Create node &quot;Fountain Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Fountain Type Foundry</a>, <a href="/node/add/wiki?edit%5Btitle%5D=PsyOps%20Type%20Foundry" title="Create node &quot;PsyOps Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">PsyOps Type Foundry</a>, and <a href="/node/12009/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Veer</a>. In the future, a unique collection of typefaces will be available exclusively through <span class="caps">MRF</span>.</p>
