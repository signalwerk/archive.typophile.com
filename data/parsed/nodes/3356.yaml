    <p>Here is a sketch of a typeface that I'm developing based on aspects of a trainyard. <br> <br>stencil <br>graffiti <br>metal parts <br> <br>Any comments would be greatly appreciated. I'm trying to stray away from a "techno" style font, but it kind of looks like one. This is my first font, so I'm learning the process.</p>
