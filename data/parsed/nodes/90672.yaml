    html: <p>I am using Adobe Garamond Pro. I am using it for experimental / learning purposes only and not for commercial purposes. Hopefully this is OK. I am using Fontlab True type to create the Bengali glyphs and added them to the Adobe Garamond Pro font so I can have a multilingual font. I am testing them using the MS Volt Proofing tool. Everything seems to work in the proofing tool but does not work when I generate and install the font file for applications such as MS Word or Adove InDesign.</p>
