    <p>I have been developing fonts for the past one year so I am relatively new to font development.</p>
    <p>Does any one know how to add the KERN feature for punctuation marks using MS volt? I am trying to alter the punctuation positions for the Garamond font using the KERN feature, but it doesn't work. I have opened the Garamond font in MS VOLT and allowed volt to overwrite the OT features. I have then developed my own OT features. KERN feature works for other letters of the English alphabet and for Bengali language alphabets. But even for the Bengali language alphabets, the KERN feature does not work if I include the punctuation marks such as semicolons, hyphens, emdash, endash, leftparen, rightparen, leftquote, rightquote etc.</p>
    <p>Please help.</p>
