      <p>Okay, this should be fine according to Adobe's standard font license, so long as you do not distribute the modified font in any way.</p>
      <p>I've done some work with kerning between Devanagari and punctuation, but I cannot recall the details of how and where it works or does not work. If I can find some extra time, I'll look into this. I recall that in MS apps this depends on the version of Windows.</p>
