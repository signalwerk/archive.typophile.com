    <p>I'm looking for critiques on the mark and type, it's for an investment management company which uses complex algorithms to place statistically favorable trades for clients. The client asked for a simple mark and strong, clean type.</p>
    <p>The mark represents "sine waves" in the shape of an abstract "M."</p>
    <p>Also, how is the kerning?</p><div class="imageWrap"><img src="http://typophile.com/files/msp-typophile_4194.jpg"></div><p></p>
