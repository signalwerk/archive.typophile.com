    html: <p>The letterspacing (which is not kerning) could use some massaging. Look at the pairs of letters the repel each other the most, like the N-A-L, R-T-N and the R-S combinations. The white space created by those letters stand out among the tighter fitting letters. I would spread it out overall until the white spaces echo the current widest gaps.</p>
