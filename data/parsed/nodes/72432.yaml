  html: |-
    <p>This is a promo typeface containing glyphs from 11 graduation projects of Type&amp;Typography(A type design CPD programme in Moscow, Russia).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/amperisk-poster.jpg"></div><p></p>
    <p>If you type in a name of a project you get a font logo.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/amperisk-liga.gif"></div><p></p>
    <p>Feel free to <a class="freelinking external" href="http://typoholic.ru/Type&amp;Typography/2009-10/amperisk/Type&amp;Typography.html" rel="nofollow">download</a> this font and poster.</p>
    <p>Released under SIL Open Font License (OFL)</p>
