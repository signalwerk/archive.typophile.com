    html: |-
      <p>Go for the URW cut.<br>
      Not only is it cheaper, but it has an extensive number of fractions. Half Thirds Quarters Fifths Sixths and Eighths and nut fractions for Half and Quarters. You don't see that in many fonts and certainly not in the Scangraphic or the EF versions of this typeface.<br>
      URW has superscript and subscript figures which the other two versions lack. However it would've been great if it had superscript s t h e m etc.<br>
      The URW version also has nicer Math symbols they are hairlines which is pretty interesting I just wish it had alternate thin parentheses but the parentheses are pretty much the same in all three fonts.<br>
      EF seems to be missing multiply sign and you definitely don't want to use the lowercase x instead.<br>
      URW @ is by far the nicest. However I liked the asterisk in Scangraphic.<br>
      URW and Scangraphic seem to have the same set width whereas EF seems to be wider which is not a good thing in my opinion (not the letterforms but just how wide a line of text is). I think a 10pt URW is slightly smaller than a 10pt Scangraphic but this should not affect your decision at all.<br>
      URW has the most glyphs but Scangraphic has the big advantage of including titling Umlauts and a titling Å. EF is out of the equation for this one.</p>
