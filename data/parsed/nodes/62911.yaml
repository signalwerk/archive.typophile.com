    <p>My birthday is tomorrow and I finally wanted to treat myself to a font, and I've recently been really in love with these fat serif typefaces like ITC Serif Gothic, Grouch (wish I could buy that, but alas), et cetera.</p>
    <p>I wanted to get Caslon Graphique, but I'm having a bit of trouble finding any difference between all the offerings/cuts on MyFonts that may make me want to spend more than URW's asking price of $19.95.</p>
    <p>The three versions:</p>
    <p>URW's Caslon Graphique D for $19.95: <a href="http://new.myfonts.com/fonts/urw/caslon-graphique/" title="http://new.myfonts.com/fonts/urw/caslon-graphique/">http://new.myfonts.com/fonts/urw/caslon-graphique/</a></p>
    <p>Scangraphic's Caslon Graphique SH for $26: <a href="http://new.myfonts.com/fonts/efscangraphic/caslon-graphique-sh/" title="http://new.myfonts.com/fonts/efscangraphic/caslon-graphique-sh/">http://new.myfonts.com/fonts/efscangraphic/caslon-graphique-sh/</a></p>
    <p>Elsner+Flake's Caslon Graphique EF for $35: <a href="http://new.myfonts.com/fonts/ef/caslon-graphique/" title="http://new.myfonts.com/fonts/ef/caslon-graphique/">http://new.myfonts.com/fonts/ef/caslon-graphique/</a></p>
    <p>Forgive me if the answer to my query has an obvious answer. I haven't bought a whole lot of fonts, just some essentials.</p>
