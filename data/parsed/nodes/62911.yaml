      <p>David - as these are all digitizations of a pre-digital typeface, there will be very slight variations in lettershape, kerning, and character set. It would be handy if I could tell you that one foundry's versions are always the best. Unfortunately, the methods and policies of each of these foundries changed over the years, and some are better than others depending on the era and the typeface.</p>
      <p>Also keep in mind that more glyphs does not necessarily equal better font. Many of these foundries use automated techniques to fill out the extras in the glyph set and that can sometimes lead to less-than-ideal results.</p>
      <p>All that said, I love Caslon Graphique and I think you'll be fine with the URW version for the reasons Johnny mentions. But you might also want to have a look at these other <a href="http://www.fontshop.com/fontlist/genres/extra_bold_high_contrast_serifs/" rel="nofollow">high contrast headline serifs</a> and <a href="http://www.fontshop.com/fontlist/staff_picks/swash_ampersands/" rel="nofollow">swashy ampersands</a> for more modern fonts that were made from scratch for the digital world.</p>
      <p>Happy birthday!</p>
