    html: "<p>One issue to bear in mind here is that of emphasis: if your construction seems that it isn't really working it may be because neither word is allowed to dominate. They are competing against each other. Try reducing the the size of the word \"blogger\"  —&nbsp; that should allow the word \"upstart\" to breathe a bit more. They may work better together if one word is the main focus and the other is in a supporting role.</p>"
