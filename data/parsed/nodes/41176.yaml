  html: |-
    <p>I'm redesigning upstartblogger.com and trying to put a simple header logo together using some contrasting fonts.  I've settled on Gotham Ultra for the second word but can't decide on a handwriting font for the first.  Hopefully you can see what I'm trying to achieve in the attached image.</p>
    <p>Any ideas?  I thought that Dali looked ok but a few hours later I'm not so sure.</p>
