    date_raw: 29 Sep 2010 — 2:59am
    votes: null
    html: |-
      <p>Monopolized? There are schools all over the place adding type-design education. They're usually only a course within other programs, but it's enough to give a head start. True, it's too bad that there aren't more opportunities available, but I think the challenge is that the opportunities are spread a little too far and wide rather than being monopolized.</p>
      <p>James, it's a real shame your class was cancelled. Does SVA do much to promote individual courses like yours, or do they leave that up to you?</p>
