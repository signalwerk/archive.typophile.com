  html: "<p><a href=\"wiki/Typographer.org\" class=\"wiki\">Typographer.org</a> produced a keepsake booklet for <a href=\"http://www.typecon.com/\" target=\"new\">TypeCon2005</a>, featuring exclusive pre-release reviews of 11 typefaces. Each of those are designed with the actual typefaces, so you see the fonts in use as you read the reviews. The signed and numbered collector’s items — produced in a limited edition of 200 copies, with a cover designed and silk-screened by hand by David — were distributed at the conference.</p>

    <p><em><strong>Update</strong> All the remaining copies have found a new home. Thank you all for your support.</em></p>

    <p>We’ve got good news for anyone who couldn’t attend TypeCon2005 but still wants one of those booklets. Contact me through <a href=\"http://typophile.com/user/110\" target=\"new\">my profile</a> to grab one of the few remaining copies.</p>

    <p>The typefaces reviewed are:<br>

    <strong>Classico</strong> | Stefan Hattenbach<br>

    <a href=\"http://www.macrhino.com\" target=\"new\">Mac Rhino</a><br>

    <strong>Parisine Office</strong>\b | Jean François Porchez [Typographer.org exclusive]<br>

    <a href=\"http://www.typofonderie.com\" target=\"new\">Porchez Typofonderie</a><br>

    <strong>Dederon\b</strong> | Tomas Brousil<br>

    <a href=\"http://www.suitcasetype.com\" target=\"new\">Suitcase Type Foundry</a><br>

    <strong>Nicholas</strong> | Nick Shinn<br>

    <a href=\"http://www.shinntype.com\" target=\"new\">ShinnType</a><br>

    <strong>CA Blitzkrieg Pop</strong> | {ths}<br>

    <a href=\"http://www.cape-arcona.com\" target=\"new\">Cape-Arcona Type Foundry</a><br>

    <strong>Ministry Standard\b</strong> | Rian Hughes<br>

    <a href=\"http://www.veer.com/products/vendor.aspx?vendor=DET\" target=\"new\">Device</a><br>

    <strong>Eason\b</strong> | Randy Jones<br>

    <a href=\"http://www.fountain.nu\" target=\"new\">Fountain</a><br>

    <strong>Proxima Nova</strong> | Mark Simonson<br>

    <a href=\"http://ms-studio.com\" target=\"new\">Mark Simonson Studio</a><br>

    <strong>Fedra Display 2\b</strong> | Peter Bil’ak<br>

    <a href=\"http://www.typotheque.com\" target=\"new\">Typotheque</a><br>

    <strong>Relato\b</strong> | Eduardo Manso<br>

    <a href=\"http://www.emtype.net\" target=\"new\">Emtype Foundry</a><br>

    <strong>Vonness\b</strong> | David Berlow<br>

    <a href=\"http://www.fontbureau.com\" target=\"new\">The Font Bureau, Inc.</a></p>

