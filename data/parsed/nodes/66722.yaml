    html: <p>Most magazines, especially weeklies, are built from templates that are all gathered together to make the final issue. So it’s quite easy for them to have different baseline grid settings for different page templates. Of course, because the layouts are mostly predetermined, there’s a good change they’re not using baseline grids at all.</p>
