    html: |-
      <p><cite>Oh? I stand corrected, then.</cite></p>
      <p>Not completely! </p>
      <p>Yes, Command + B is a cute little bugger in InDesign; great when you need to break the column structure. But I don't recommend TOO many baseline shifts in a single spread. It is useful when you're adding different kinds of text that aren't appropriate for the body baseline; a caption may require a different baseline than the content of an article. (You may be able to do this in Paragraph Style as well.) </p>
      <p>All in all, visual consistency is key. If you have too many differing baselines, it will look as though there are none and you may as well just individually adjust the leading of each text frame to your liking.</p>
