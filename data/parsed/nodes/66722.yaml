    html: |-
      <p><cite>"having multiple baseline grids"</cite></p>
      <p>Even if that did work (which I don't think it does) I'm not sure you'd want that.<br>
      I mean the idea of a baseline grid is to provide visual consistency for a layout, and you're not really going to achieve that by superimposing 3 different arbitrary grids. :-&gt;<br>
      One very useful concept to work with is the idea of common denominators. For example, if you set up a baseline grid with 3pt increments, you can have larger text with a 15pt leading &amp; smaller text with 12, for example for a text with a smaller sidebar. Both these leadings fit the grid, and once every 4/5 lines the baselines will match up again; that way you do get variability – but still grid-based variability that won't look as arbitrary.</p>
      <p>And if you *do* want more free-form design just don't use any baseline grids! :-)</p>
