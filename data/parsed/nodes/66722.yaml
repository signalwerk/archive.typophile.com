    html: <p>Use a three (or two) point baseline grid as someone mentioned above. That's what I almost always do for my grids, and make sure my leading regardless of type size is set to some multiple of the base. So for example, that gives you 12 pt lead for paragraphs, 9 pt for sidebar/callouts, 21 pt for headlines, etc...</p>
