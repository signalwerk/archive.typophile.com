      <p>For the 'core' versions, I prefer Interstate, but for the full name ones, I prefer Meta.</p>
      <p>Have you considered making the disc off-center to the right, to imply flight/motion? Perhaps on the horizontal versions, the disc could sit where a superscript would for the word 'core', to show some flight and motion? The layouts feel a bit too static for the subject. The disc shows spin, but not as much flight.</p>
