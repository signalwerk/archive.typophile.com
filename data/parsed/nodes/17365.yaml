    <p>I may have posted the original logo on here awhile ago, but sticking with the new I won't rehash that.</p>
    <p>This is for my friends non-profit disc golf organization. The org puts on tournaments, sponsors events and produceds a small amount of wearable gear for the disc golf market.</p>
    <p>The target market stretches from 16 to 50(tenatively), so it's not so slanted toward one end of the consumeristic spectrum or the other. I will write more blah, blah, blah if I don't stop now.</p>
    <p>Let the judges critique.</p>
