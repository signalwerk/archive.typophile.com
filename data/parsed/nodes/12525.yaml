    <p>hello</p>
    <p>the situation:<br>
    friends of mine gotta do a “faked ad” for a condom producer in school. they asked me for some creative and technical help, so here i am to help them.</p>
    <p>their approach is that most condom brands dont really have a brand strategy, a good remembered name, most people cant say you more than one or two brands.</p>
    <p>they want to brand their producer with “Condoms are cool, its fun to use them”.</p>
    <p>fonts to use:<br>
    what fonts would you suggest for the text? i thought of:</p>
    <p>a.) something very light weighted, a bit sophisticated (for the normal user..) like Gill Sans in a light weight.<br>
    or<br>
    b.) something like VAG Rounded, more weight on the fun-part.</p>
    <p>any other ideas?<br>
    THANKS alot.</p>
