    <p></p><div class="imageWrap"><img src="http://typophile.com/files/4479506188_c08b64644b_6627.jpg"></div><p></p>
    <p>Darren with <a href="http://www.typedna.com/" rel="nofollow">TypeDNA</a> sent this to me to share with all of you. This is a screen grab of what they are working on right now. A glyph palette! This will be part of the <a href="http://www.typedna.com/adobe_cs_font_plugins/" rel="nofollow">TypeDNA plugins for Adobe's Creative Suite</a>. So, until Adobe gives us an integrated glyph palette, perhaps this will do the trick!</p>
    <p>See a <a href="http://farm3.static.flickr.com/2687/4479506188_f7078e30a5_o.png" rel="nofollow">larger image</a> here.</p>
    <p>I'm not sure how many questions Darren will answer at present, but if we can keep the questions here I'll let him know about this thread.</p>
