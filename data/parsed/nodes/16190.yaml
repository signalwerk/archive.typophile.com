    date_raw: 8 Mar 2006 — 4:28am
    votes: null
    html: <p>I agree about the graffiti comment-- it makes me think of 1970's New York subway cars more than new speed-metal bands. That said, I wonder if actually reducing the vertical curvature would help stabilize it a bit; right now, it dances so much that it starts to look a bit chaotic. And notice the lower-case i and l -- I'd think either they need the same angle if you want a more traditional, stable face; otherwise, you'd want to exaggerate the difference there and in a lot of other places.</p>
