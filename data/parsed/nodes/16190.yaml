    html: |-
      <p>I like the slant of the strokes, but the consistent width of the strokes makes it feel like it was drawn with a marker and pushes it more towards being a graffiti style than blackletter. I'd play with varying the stroke widths a little bit and see what you get. The real artistry of the 20th century blackletters was in how many curves they were able to cram into each glyph.</p>
      <p>The other direction to go would be to explore ideas like American Text or Gothic Gothic and straighten things out and see if you can get some interesting effects from straight lines and harder angles.</p>
      <p>It's interesting! Keep working with it!</p>
