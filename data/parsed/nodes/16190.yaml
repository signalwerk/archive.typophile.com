    <p>Hey everyone, this is in no way any sort of final design. It is rather a little project I have been fooling around with during my down time at work. I've always had a fascination with blackletter type and have started an attempt at modernizing the style a bit, maybe along the lines of Fette Fraktur but closer to classic style in some ways. Just curious what thoughts you might have so far on the 15 or so glyphs I have attempted. Thanks.</p>
    <p>-Dave</p>
