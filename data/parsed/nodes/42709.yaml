      <p>Before I came to Reading and was in Linotype's markteing department, I looked into German design patents and US copyright and trademark registration a little bit. </p>
      <p>For new typeface releases, including designs that come from out-of-house (i.e., from external designers whom we licensed from), we would often register for German Design Patents, when possible. In cases where the designs were licensed to us, I belive that it would also have been possible for the designers to register for these patents themselves, although I doubt that any wanted to assume this burden when we gladly did the work for them. I'm sure that other European foundries do similarly as well.</p>
      <p>In my opinion, when a company licenses a typeface from its designer, it has a duty to protect it in any way that it can. One of the benefits of licensing through a foundry is that many foundries do actively protect their typefaces, and make sure that unlicensed copies are removed from websites, etc. Sure, any independent designer can do this on his own as well, but it takes a lot of time and effort.</p>
