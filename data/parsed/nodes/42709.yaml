      <p>I replied to John H's comment as follows:</p>
      <p>John Hudson wrote:</p>
      <p>&gt; Yes, there is design patent<br>
      &gt; protection, but since no case involving design patent<br>
      &gt; protection for typeface design has<br>
      &gt; ever come to trial there is no test of the solidity of the<br>
      &gt; protection. Design patent<br>
      &gt; protection would presumably have figured in the Adobe vs SSi<br>
      &gt; case if it had gone to trial,</p>
      <p>It got far enough in the trial that Judge Whyte's summary judgment included this point:</p>
      <p>"Based upon the reasoning of Tayama, type fonts are patentable subject matter and the program which creates the type fonts is the article of manufacture. Accordingly, the court finds that the typeface designs are statutory subject matter entitled to patent protection."</p>
      <p>I think that's pretty useful information.</p>
      <p>What was not resolved in this case were SSi's claims that the *particular* Adobe typeface design patents in question were invalid for a variety of reasons. I agree that seeing the results of the full set of patent issues would have been very interesting, most especially the claim that the patented designs were insufficiently novel and non-obvious.</p>
      <p>Regards,</p>
      <p>T</p>
      <p>(Of course, all the discussion in this message is in regard to US law. Things may be substantially different in other jurisdictions.)</p>
