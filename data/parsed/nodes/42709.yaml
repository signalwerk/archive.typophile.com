      <p>Florian asked about the moral aspect of type reclamation...for me, that's easier to answer than the legal aspect. If a big company issues a prewar type family without extra weights, and botches the digital conversion later so that you really have a crappy product not in any way matching the design potential and beauty of the fonts...that to me is a surrender of the company's duty to the public so egregious that smarter type designers should be free to wade in and correct everything, so the public can at last use this typeface fully. We had a thread the other day about one such family, so I don't need to mention examples. And there are plenty of them.</p>
