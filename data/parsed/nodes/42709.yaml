      <p>First, I must apologise for the initial post as it contains incorrect information: I confused the EU's automatic design right as a UK one, and said it was 5 years when it is actually 3. I should have waited to fact check everything and link it up before posting, thanks Uli for bringing this forward :-) My apologies.</p>
      <p>USA: "<a href="http://www.uspto.gov/web/offices/pac/design/index.html">Patents for designs shall be granted for the term of 14 years from the date of grant.</a>" and <a href="http://patft.uspto.gov/netacgi/nph-Parser?patentnumber=D1">the first ever design patent</a> was for a typeface. I've not yet found out how much it costs. </p>
      <p>EU: <a href="http://oami.europa.eu/en/design/faq/faq01.htm#600">"Community Designs"</a> are either unregistered, which means automatic (like copyright) and those last 3 years (although they only started on 12th December 2001) or they are registered (like patents) which "confers on the design great certainty should infringement occur" and last 5 years from the filing date but can be renewed in blocks of five years up to a maximum of 25 years. The cost is variable because registrations can be done in batches but a single design for immediate publication appears to cost €350 - <a href="http://oami.europa.eu/en/design/fees.htm">there is a cost calculator webpage</a> to play with.</p>
      <p>UK: <a href="http://www.opsi.gov.uk/acts/acts1988/ukpga_19880048_en_3#pt1-ch3-pb7">the copyright law has a section specifically for typefaces that gives them a 25 year copyright term</a>, and that is the <a href="http://www.opsi.gov.uk/acts/acts1988/ukpga_19880048_en_2#pt1-ch1-pb4-l1g15">same length as for "typographical arrangements"</a> (book/magazine/etc layouts). And this is the same length of the maximum term for UK <a href="http://www.businesslink.gov.uk/bdotg/action/detail?type=RESOURCES&amp;itemId=1073791345&amp;r.l1=1073858796&amp;r.l3=1073940183&amp;r.t=RESOURCES&amp;r.i=1073791344&amp;r.l2=1073859014&amp;r.s=e">"registered designs"</a> which, like EU RCD, last 5 years and can be renewed 5 times - though it seems redundant. <a href="http://www.ipo.gov.uk/design/d-applying/d-costtime.htm">Registrations cost £60 but may be done in batches where the rest cost £40.</a> You can reduce this to £40/£20 if you wait a year between registering the design and publishing it. </p>
      <p>@Dan: If these laws are protections or restrictions is matter of perspective, and we consider each other's terms to be biased against our own views. I welcome you suggestions for neutral terms :-)</p>
      <p>The reason the lettershapes are restricted differently to the words we write are because they are fundementally different things. The terms of copyright vary according to different kinds of things, and many things are not subject to copyright because they are functional; letter shapes are functional - we use them to read. Art, like a painting or a text, isn't used to do something. </p>
      <p>And yes, this is talking about purely shapes, which may be expressed in ink brushed on to paper, engraved in metal, shaped in potato, as dots of ink lazered on to paper. All of those expressions are considered as the type design directly. However, when a program describes the shapes, that program is copyright, like any other program. That we create our PostScript programs with GUIs for our convenience, may fool us into thinking that they are not programs, but they are programs whic  output dots of ink on paper or dots of light on screens.</p>
