      <p>Btw, John Hudson wrote on the OpenType list, reposted here with permission:</p>
      <p>I'm very familiar with the legal status of type design as intellectual property in US patent and copyright law. Yes, there is design patent protection, but since no case involving design patent protection for typeface design has ever come to trial there is no test of the solidity of the protection. Design patent protection would presumably have figured in the Adobe vs SSi case if it had gone to trial, but SSi settled following the summary judgement on the *computer program copyright* issue. This is an example of the phenomemon to which I referred: software copyright protection has become the first line of defence, even though the primary value of the font -- what people are interesting in copying -- is the distinctive design, the content of the font.</p>
      <p>The only font developers I know who file for design patent protection for typefaces are large corporations like Adobe (regularly) and Microsoft (occasionally), i.e. people with internal legal departments or external lawyers to do the filing for them. I don't know any small foundries who pursue this protection, and no individual type designers. It is expensive and it is a hassle. One of the arguments in favour of copyright protection vs patent protection is that the former is better suited to protecting the work of an individual creator, including protecting him or her against corporate predation. </p>
      <p>It is possible to register typefaces in Canada as industrial designs for a limited period (I can't remember how long off hand, possibly 15 years). This is similar to the US design patent protection. I'm not sure, however, whether Canadian law specifically excludes typeface designs from copyright protection, as US law does. As far as I know, it has never been argued in court, so remains an open question (and likely one that no one is in any hurry to put to the test, especially after the outcome of Eltra vs Ringer).</p>
      <p>My basic point was that protection of the font as software is effectively seen as the first line of defence of the content of the font, the design. Hence concerns about protection of the design play a role in determining the attitude of font developers to modification licenses.</p>
