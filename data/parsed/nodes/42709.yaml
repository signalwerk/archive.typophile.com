      <p>Dave, that "permission" probably didn't extend to rewriting it as modern verse! </p>
      <p>***</p>
      <p>The duration of copyright protection is a major issue.<br>
      Originally copyright, a concept applied to literary works, was perpetual.<br>
      12, 25, 40 years were all terms that were legal at one point or another.</p>
      <p>The idea is to find a compromise which protects the intellectual property of the creator, and their ability to profit from it*, but doesn't stifle culture (and the economy) by restricting the dissemination of innovation. </p>
      <p>*Article 26.2 of the UN Declaration of Human Rights:<br>
      "Everyone has the right to the protection of the moral and material interests resulting from any scientific, literary or artistic production of which he is the author."<br>
      -Doesn't mention design, though!</p>
