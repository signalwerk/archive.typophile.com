      <p>Actually, this thread should be titled "Legal Protections for Type Designs."</p>
      <p>The problem with Design Patents is that (except perhaps in the UK) one must apply for them, and this may take considerable time and funding. Also (and my understanding here is limited), I do not think that US Design Patents—as opposed to the European ones—are regularly issued for typefaces.</p>
      <p>If I write a book, or even an essay on typeface design, this content is protected automatically. As the author, the work is my own, and protected by copyright, at least for a certain amount of time. If someone else reads my book or essay, and then republishes it without my consent, this is a violation of my copyright and I can try to collect damages.</p>
      <p>But if I draw letterforms (except, perhaps in the UK, where you state that there may be an automatic protection) these are not automatically protected. If someone else (outside of the UK) sees them and then redraws them closely himself, this is not seen as a violation of my creation, and I may not collect damages.</p>
      <p>If I register my shapes with relevant offices, then I may be able to protect my work more effectively. But I do not appreciate that my letters are protectable to a lesser degree than the words I write. Especially because I hope that I can create type much better than I can write about it.</p>
      <p>Note that we are just talking about shapes here, right? This could apply to letters written with a brush or pen on paper. Fortunately for typeface designers, their letters most often enter the world in fonts. Since fonts are seen in certain jurisdictions as literary works (long story), they are protected by copyright. If someone edits my font without my permission, that is a copyright violation, and I could go about it the same as I could were someone to repurpose my book or essay.</p>
