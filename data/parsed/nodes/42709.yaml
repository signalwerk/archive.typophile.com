      <p>@Dan and Nick: Sure, done :-)</p>
      <p>@Nick: Do you have a source for the idea that "Originally copyright ... was perpetual"? </p>
      <p>That's not my understanding at all, which is that it originated in Italy in the late 1400s and ran for less than a decade, but varied from book to book, and was not about printers' or authors' profits at all, but about incentivising printers to print classic books so the public benefited. </p>
      <p>Okay, since I spouted off before doing any checking to begin this thread ;) I had a look at Wikipedia, and <a href="http://en.wikipedia.org/wiki/History_of_copyright_law#Movable_type">http://en.wikipedia.org/wiki/History_of_copyright_law#Movable_type</a> says in Italy at that time copyright was no longer than 14 years, and the first English copyright term was 2 years. Two! lol</p>
      <p>I'm also in disagreement with your proposed purpose of copyright, because it merges innovation with authorship. Copyright is about authorship, not innovation - that is what patents are for. Copyright is not an "attempt to strike a balance" either - <a href="http://www.gnu.org/philosophy/misinterpreting-copyright.html">a common misconception.</a></p>
      <p>I hope you'll consider not using the term "intellectual property" because it invites confusion like this, because it implies that copyright, trademark and patent laws and others have something meaningful in common. All they have in common is that they are government-granted monopolies, but everything else about them differs - their origins, purposes, terms... every detail! :-) Additionally it carries the assumption that these things are akin to physical property, which invites nonsensical thinking like that they can be "stolen." </p>
      <p>Regarding the UN Declaration of Human Rights quote, I understand the "protection of the moral and material interests" to concern accurate attribution. Plagiarism is often conflated with copyright infringement since both are colloquially called "copying" :-)</p>
