      <p>@Dan: There are two kinds of monopolies, "pure monopoly" where there is only a single provider of a product or service, and a "market monopoly" where there is a highly dominant agent in a market but who does not have a "pure monopoly," just they are the proverbial "800 pound gorilla." For example, Microsoft has enjoyed a "market monopoly" on PC operating systems and officeware. </p>
      <p>You are totally correct that there are no market monopolies in the type design scene, and I am referring to the other kind of monopoly; when I say that copyrights, patents and trademarks are government-granted monopolies, I mean they are "pure monopoly" on certain tiny aspects of the economy. In the UK, you have a 25 year monopoly on your type designs, because they are subject to a 25 year copyright term. </p>
      <p>FWIW, AIUI, this phrase "government-granted monopoly" originates from Elizabethan England, as I recall, where the royalty gave out monopolies to companies that did them political favors. </p>
      <p>@Guifa: Perfect, thanks! :-)</p>
      <p>--<br>
      Regards,<br>
      Dave</p>
