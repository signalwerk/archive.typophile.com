    html: <p>&gt;At the inflection point (t=0), it closely fits a basic cubic polynomial  <br> <br>I get it. Bezier curves are easier to work with than quadratic splines because, being based on cubic equations they can do the 's' shape, which would take two quadratic splines, and hence more 'knots' to move around. And you're saying the Cornu spiral can do this and a lot more.  <br> <br>I guess the question is whether you can put the equation in some kind of parametric form with 'knots' and 'handles' as Bezier did. Bezier has the two end points and the two handle points that define the curve, which you can move and see how the computer redraws the cubic curve.  <br> <br>It sounds like the Cornu spiral is more complex than a cubic equation. Will you need a fifth point, a third 'handle', to adjust other features of the 's'? So then your work would look something like a Bezier and a quadratic spline together - an off-curve point, and the two tangent handles? Or will you need a fourth handle as well? There is the danger that it will be too complicated to work with.  <br> <br>Sounds like a great idea - best of luck with it!</p>
