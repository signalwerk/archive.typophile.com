    html: <p>I too am intrigued by the effect that the underlying curve primitive has on font design. I think that designing on the screen, as opposed to making drawings and then basing the digital outlines based on those, makes a significant difference as well. <br> <br>Indeed, I feel so strongly about this that it now seems likely that I'm going to do a PhD on the very topic. I believe a better curve primitive is the Cornu spiral. I've just built a prototype curve editor using the primitive (see <a href="http://casper.ghostscript.com/~raph/ppedit.png">screenshot</a>) and so far am very encouraged that the resulting curves are smoother and more natural than those designed interactively with Beziers. <br> <br>No doubt you're going to hear a lot more on this from me, but  I wanted to post a quick note now because it seemed on-topic.</p>
