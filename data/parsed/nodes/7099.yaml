    html: <p>By bezier-y, I mean that you can just "see" the bezier curves inside the letters' strokes (how they were bent around, where the nodes probably were, the handles, their angle, etc.) <br> <br>I know that all typefaces are drawn with Bezier curves (except that whole TT spline thing), but normally, when I look at a face (say, Sabon NEXT for example), I just see forms and curves� I might think� oh, I could draw that curve! (be it with a pencil, a pen, digitally, whatever) But with the thin weights of the Auto Italics, I look at the curves, and just think� hmmm, they've had fun making those bezier curves.</p>
