    html: <p><i>And with slope continuity (with adjacent segments) at those endpoints?</i> <br> <br>Right. Enforcing the tangent continuity across a knot point eats up one degree of freedom. The best representation, then, for a manually drawn Cornu spline is a "spinner" for the tangent angle at each knot point. Using an off-curve point instead of the tangent angle has the drawback of not handling "S" curves well; the two tangents could well be parallel to each other, so they would never intersect. <br> <br>The curve editor I'm working on assigns the tangent angles automatically, as well, so all the user needs to put in are the on-curve points. I'm going to make the tangent spinner optional at each knot; it seems to me especially useful at corner joins and joins with straight line segments. <br> <br>At knots where the tangent is chosen automatically, there is curvature continuity as well as tangent continuity. My sense is that when typophiles talk about the "bezier-y" feel of an outline, it corresponds fairly closely to the mathematical concept of disconuities (or wide variations) in curvature. Cornu splines are extremely good with respect to that criterion. Perhaps even optimum; it's a question I want to study. <br> <br><i>Maybe the Cornu spiral will seem so natural that one will get a good result with only the one point in addition to the end points, but I wonder.</i> <br> <br>That is more or less my claim. Since the concepts of "seeming natural" and "good result" are so subjective, I intend to test that claim by putting the curve editor into people's hands. <br> <br><i>Can you elaborate how you can transform spiral segments? Do you use 3D perspective transformations, for example?</i> <br> <br>No, it's simpler than that. I just cut a piece of the original spiral (the two degrees of freedom mentioned above correspond exactly to the points along the original curve where I cut), then scale, rotate and translate so that the endpoints of the spiral section coincide with the desired endpoints.</p>
