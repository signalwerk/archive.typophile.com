    html: <p><i>It sounds like the Cornu spiral is more complex than a cubic equation.</i> <br> <br>It depends on what you mean by "complex". Beziers can be computed using only high school algebra, while the mathematical basis of the Cornu spiral is the Fresnel integral, a "special function" that requires a bit more mathematical skill to work with. <br> <br>But if you're talking about complexity from the user's point of view, Cornu splines win hands down. Once you nail down the endpoints, a Cornu spiral segment has only two degrees of freedom, the same as a quadratic Bezier (and two less than a cubic). In short, it's as simple to use as a quadratic, but every bit as powerful as a cubic. <br> <br>Of course, the real test is how natural it all feels in the context of an interactive editor. I've built one (for Linux only, so far), and so far am <i>very</i> encouraged. I'm eager to get it in the hands of typophiles (as opposed to math nerds) so I can get good feedback from the real world. <br> <br>Thanks again for the encouragement! I have a meeting with my advisor tomorrow, so all this feels like a wind at my back.</p>
