    html: "<p>hrant: that's a complex question. The short answer is that you can go from Cornu spiral to quadratic or cubic Bezier with insignificant loss, as long as you have enough precision in the coordinates [in fact, my interactive editor converts to Beziers before rendering to the screen]. So there's no problem outputting PostScript code that has high-precision float coordinates followed by \"curveto\" operators, but an unsophisticated transform to TrueType or Type1 can introduce significant errors. <br> <br>So, in order for this stuff to be useful for type, the output module has to be smart enough to avoid those errors (briefly, very short arcs are the enemy). Of course, the exact same thing is true of stroke offset algorithms (the constant-distance offset curve from a quad bezier is a complex fifth-order polynomial that can get quite numerically snarly where the offset radius gets close to the curvature of the Bezier).</p>"
    html_clean: "<p>hrant: that's a complex question. The short answer is that you can go from Cornu spiral to quadratic or cubic Bezier with insignificant loss, as long as you have enough precision in the coordinates [in fact, my interactive editor converts to Beziers before rendering to the screen]. So there's no problem outputting PostScript code that has high-precision float coordinates followed by \"curveto\" operators, but an unsophisticated transform to TrueType or Type1 can introduce significant errors. <br> <br>So, in order for this stuff to be useful for type, the output module has to be smart enough to avoid those errors (briefly, very short arcs are the enemy). Of course, the exact same thing is true of stroke offset algorithms (the constant-distance offset curve from a quad bezier is a complex fifth-order polynomial that can get quite numerically snarly where the offset radius gets close to the curvature of the Bezier).</p>"
