  html: <p>Let's talk about Underware's forward-thinking new type family Auto. <br> <br>I think that they idea of bundling three separate italic families together is a great one, and (all in all) I think that Auto is a good face. <br> <br>But, the way that the italics have bee drawn hits a nerve in the back of my head� they look so "bezier-y"� its almost as if I can see the bezier curves underlying the forms, which I find distracting (although your average reader probably wouldn't). <br> <br>Type design isn't about the tools used (at least, that doesn't seem to have been the goal for this face). Does anyone else see what I'm talking about? <br> <br><a href="http://www.underware.nl/site2/index.php3" target="_blank">http://www.underware.nl/site2/index.php3</a></p>
