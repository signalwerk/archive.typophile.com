    html: <p><i>Why the Cornu spiral as opposed to other spirals? Good luck with the dissertation!</i> <br> <br>Thanks! That's a good question. I'll try a brief answer. <br> <br>1. It's one of the few spirals that has an inflection point in it, or in other words contains an "S" curve. Most other spirals only wind one way. <br> <br>2. In fact, it's got a number of useful shapes hiding in there. At the inflection point (t=0), it closely fits a basic cubic polynomial (essentially the same curve you get when trying to make an "S" in a cubic Bezier). At roughly t=0.6, it closely fits a parabola, which is the geometric primitive of a quadratic Bezier (TrueType). And as t increases, it closely fits a circle. <br> <br>3. It's the smoothest way to interpolate between curvatures. In fact, designers of roller coasters and highway on/off ramps use the curve to smooth out the lateral g-forces. If you were to ride a motorcycle along, say, the 's' from Auto Italic 3, you'd be in for some rather violent shifts of g-force. <br> <br>4. It has deeply beautiful mathematical qualities. The more I study the curve, the stronger my intuitive feeling of rightness. For the details, you'll have to wait for my thesis (how's <i>that</i> for a cliffhanger?). <br> <br>I should have linked a <a href="http://casper.ghostscript.com/~raph/cornu.pdf">PDF</a> of the Cornu spiral, so that you can see the curve I'm talking about. <br> <br>Type design does expose materials and methods. To me, cubic Beziers are like carving letterforms into rough pine wood with knots (pun intended, of course), while Cornu spirals are like carving into pear wood. If you're going for an effect, the former makes sense, but given the choice, most of the time a seasoned craftsman will go for the latter.</p>
