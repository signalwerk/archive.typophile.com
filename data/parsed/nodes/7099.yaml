    html: <p>The auto typeface approaches the third italic as a cursive, and to my knowledge it's the first that attempts to buid that into a family. I think we might also be able to charictarize  Auto 3 as an upright cursive italic. The stems are verticle, but curves are cursive, and the overall effect is italic.  <br> <br>I think that this innovative and bold design reflects our culture's irreverant attitude, sure, but the fact that we're put off by the strange look of some really different letter forms tells me that they are pushing things, at the very least, our buttons.  <br> <br>Aaron</p>
