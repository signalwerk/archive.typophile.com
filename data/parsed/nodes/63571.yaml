      <p>Love the second set. I think the left one reads better as initials, since the letters are upright, but the right hand one makes sense tilted in a heart shape. I think it is OK that the initials are more subtle when tilted to make a normal heart shape.</p>
      <p>I can totally see this repeated as a faint pattern in the wedding stationery, napkins, etc. </p>
      <p>Very appropriate that it makes a heart, and the letters are intertwined / woven together. Great concept.</p>
