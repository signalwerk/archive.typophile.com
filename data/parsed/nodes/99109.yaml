    <div class="imageWrap"><img src="http://typophile.com/files/ga6_4843.png"></div><p></p>
    <p>For more information or to get your free download, please visit <a class="freelinking external" href="http://www.alterlittera.com/al_htm/oldtype/gutenberg_a.htm" rel="nofollow">alterlittera.com</a>.</p>
    <p>Thanks in advance for your interest. And Merry Christmas to you all.</p>
