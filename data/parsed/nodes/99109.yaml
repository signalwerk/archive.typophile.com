    html: |-
      <p>Thank you for this beautiful holiday surprise!</p>
      <p>I'd like to make a small suggestion - the files (specimen and opentype/character pdf's)  that are uniquely associated with a font file should be uniquely named. For example, in this case, ALOTGutenbergASpec.pdf and ALOTGutenbergAchar.pdf. In that way, people who choose to keep multiple fonts and related files in a folder will not have name conflicts, and would be able to see at a glance what the asociated files refer to.</p>
      <p>Thank you again.</p>
      <p> - Herb</p>
