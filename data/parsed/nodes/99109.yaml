    <p>A big thank you to everyone (especially to every typophile) who helped me out to get this typographical adventure up and still running. Here you are a small free gift in return. I hope you like it.</p>
    <p><img src="/sites/default/files/old-images/ga1_5024.png"><br><img src="/sites/default/files/old-images/ga2_5558.png"><br><img src="/sites/default/files/old-images/ga3_6730.png"><br><img src="/sites/default/files/old-images/ga4_5607.png"><br><img src="/sites/default/files/old-images/ga5_6699.png"><br><img src="/sites/default/files/old-images/ga6_4843.png"></p>
    <p>For more information or to get your free download, please visit <a href="http://www.alterlittera.com/al_htm/oldtype/gutenberg_a.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">alterlittera.com</a>.</p>
    <p>Thanks in advance for your interest. And Merry Christmas to you all.</p>
    <p><img src="/sites/default/files/old-images/al_logo_4440.png"></p>
