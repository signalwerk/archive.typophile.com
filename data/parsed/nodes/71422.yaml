    html: |-
      <p>I'm with you on 'k', but with 'u' and 'r' I think it works. I'm now thinking of more oblique rather than italic style, that's why 'a'. That 'k' was something of a tryout…</p>
      <p>The reason to study this kind of design was that I've never liked any of them; most of them have been over-designed, with weird 'y's and'k's, or rounded corners to hide the flaws and such. </p>
      <p>So I try to make a working one. Let's see how it goes.</p>
