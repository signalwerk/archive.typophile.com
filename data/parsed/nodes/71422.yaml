    html: <p>I tried a similar experiment last year and found that the abrupt spurless stroke intersections clash with the humane qualities that are needed to liven up the design. I’m seeing the same thing here; there’s some dissonance being created by letters like <em>u</em> and <em>r</em> and the italic <em>k</em>.</p>
