  html: |-
    <p>Im doing a motion graphics piece with type cycling behind some old Kung-Fu movie footage and I really want to be able to type in some Chinese characters in Illustrator or After Effects without having to enable a foreign language on Windows.  Yes, PC's suck, whatever.  Does anyone know of a (free) symbol font I could use?  It doesn't really matter if it looks cheesy, within reason of course.</p>
    <p>Thanks!</p>
