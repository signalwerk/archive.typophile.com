    <p>Hi guys!</p>
    <p>I have to do a redesign of Tschichold The new typography as a school assignment but im fresh out of ideas! The new cover should have an “edge” (meaning that it should be based on a really clever idea) but still illustrate the content of the book.  </p>
    <p>I’m thinking about doing something that doesn’t apply to Tchicholds teaching at all but still illustrates it well... but I’m not sure if thats the right way to go. Do you guys have any suggestions (go wild!)? </p>
    <p>Thanks!</p>
