    html: <p>IMHO Irony in design is a delicate thing to pull-off. You could try looking at some of his earlier (pre-new typography) work. But even then I wonder how appropriate that would be. If it weren’t a book of theory on typography you could do this more readily, however the fact that it specifically discusses what he thinks are ideals to be used in typography you might have to bite the bullet.</p>
