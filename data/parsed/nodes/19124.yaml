    <p>Take a look at Dan's announcement for his soon-to-be-released face "Mountain" at:</p>
    <p><a href="http://www.typeoff.de/?p=44" title="http://www.typeoff.de/?p=44">http://www.typeoff.de/?p=44</a></p>
    <p>I just looked at Mountain.  Mountain has a constructivist base with a blackletter flavor--which does not surprise me considering Dan's affinity for blackletter:-)  I quite like the cap D in particular.  I think Mountain's italic is quite successful and may find its way into some metal band logos.</p>
    <p>Excellent work Dan!  </p>
    <p>ChrisL</p>
