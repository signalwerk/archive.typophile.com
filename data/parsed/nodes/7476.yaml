    html: <p>So, just so I understand, why are Israelis and Palestinians still* blowing each other up? <br> <br>Is it because they're still blowing each other up? <br> <br>I have yet to hear, see, or read an argument that varies from this basic point, when addressing why this conflict still rages. This conflict is too old, complex, and religious for either side to be 'right' or 'wrong'. I'm not trying to be glib, either. I just don't see any depth beyond this point that doesn't quickly degenerate into atrocity laundry lists and personal attacks. <br> <br>Hrant, this is one of those times that I agree with you about a monarchy. Someone needs to decaffinate that situation, regardless of the will of their people. <br> <br>*Not 'why did they start', but 'why are they still'.</p>
