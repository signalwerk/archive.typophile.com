    html: "<p><i>Article 4B of the Law of Return states \"For the purposes of this Law, 'Jew' means a person who was born of a Jewish mother or has become converted to Judaism and who is not a member of another religion.\" </i> <br> <br>Yes, apostasy is apparently considered to nullify one's Jewish identity. Well, apostasy is always a sticky question. As Hrant notes, the Qur'an says that 'People of the Book' (i.e. Jews and Christians) should be treated with respect, which historically has meant that Jewish and Christian minorities accepting Moslem rule have not been violently persecuted and have been allowed to practice their religions (although Jews and Christians were required at various times and places in history to live in ghettos, not to mix freely with the Moslem population, submit to restrictions against marrying Moslems, pay special taxes, etc.) But apostasy in Islamic states is another matter entirely: for a Moslem to become a Christian is a capital offence in Iran, punishable by hanging. I suspect the punishment in Saudi is probably pretty extreme also. In today's Arabic states, Christians are treated best in the secular regimes with diverse ethnic and religious populations, e.g. Lebanon, Syria and, until recently, Iraq.</p>"
