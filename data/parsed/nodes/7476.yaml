    html: <p>&gt;be treated with respect <br> <br>I think 'respect' is too strong an English word for the practices in traditional Islamic societies - 'more or less tolerated' would be more accurate. Both Christians and Jews were under the status of 'dhimmi', which is a distinctly second class citizen - similar the Jews in Europe until the emancipation, I believe. How harsh this subjugation was varied, as you say, from era to era and place to place.  <br> <br>By the way Hrant, yes Moorish Spain was a period of flowering. Islamic culture was then the most advanced in the West -before it ossified. But the other place that Jews thrived best was probably Babylonia until the Muslim conquest (around 700 I think). But most of all the USA for the past 350 years. 'God Bless the USA' as the country song says...  <br> <br>&gt;Jews are not anymore victims, they should stop this song.  <br> <br>The Jews are right now not victims and they are not saying so, but as John said the very long history of persecution is relevant to the legitimacy of the founding of Israel. It is why the UN was willing to establish a tiny state for refuge of those of Jewish ancestry and religion.  <br> <br>Today Israel is only saying that it is under attack from terrorists, but isn't that just a fact? Of course Israel is undertaking military actions also. There is a war going on. That is why peace and territorial settlement is urgently needed. <br> <br>The idea that Israel is always whining is just not true. Why don't you quote this whining from Israeli sources - its just not there. I never heard Rabin say 'be nice to us because of the Holocaust'. He said rather that if the Palestinians try to kill us we will crush their bones. This doesn't sound like whining to me. Too agressive and brutal maybe, but whining no. And then he was willing to make peace, even with Arafat.</p>
