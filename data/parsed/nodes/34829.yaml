    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Vladimir Yefimov</strong></p>
    <p>Vladimir Yefimov is a <a href="/wiki/Russia" class="freelinking" rel="nofollow">Russian</a> typeface designer who is the art director and co-founder of the Russian type foundry <a href="/wiki/ParaType" class="freelinking" rel="nofollow">ParaType</a>. Vladimir has also lectured on type design and has written several articles on the peculiarities of <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> letterforms.</p>
    <p><strong>Additional Articles:</strong><br>
