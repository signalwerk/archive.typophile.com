    <p>Vladimir Yefimov is a <a href="/node/29424" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Russian</a> typeface designer who is the art director and co-founder of the Russian type foundry <a href="/node/29423" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ParaType</a>. Vladimir has also lectured on type design and has written several articles on the peculiarities of <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a> letterforms.</p>
