    <p>I'm currently leading a redesign of the Glasgow Guardian. We're a student paper with a low budget and 100% run by volunteers. </p>
    <p>Two competent amateurs + Adobe CS4 + the next two months = a newspaper.</p>
    <p>Naturally, we want it to look awesome. I'm a photographer that's only just learning the first things about typography, but man, guys, that Caslon italic ampersand! The Doves Bible! Typography is clearly amazing.</p>
    <p>Anyway: so far I'm thinking of using solely the "Utopia" typeface family, as it has a high x-height and nice "caption" weights that would make readable 10pt body text. It also has a good few display weights, including a Black Headline weight that could work well for... well, headlines.</p>
    <p><img src="http://photos.moniker42.com/photos/i-HLMLWD7/0/M/i-HLMLWD7-M.png"></p>
    <p>Thoughts? Would be very much up for something more daring.</p>
