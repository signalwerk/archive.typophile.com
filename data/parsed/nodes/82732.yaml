      <p>Hi! We're also a student newspaper, completed a redesign from broadsheet to Berliner last summer. </p>
      <p>The fonts we settled on were Farnham Text <a href="http://new.myfonts.com/fonts/fontbureau/farnham/" title="http://new.myfonts.com/fonts/fontbureau/farnham/">http://new.myfonts.com/fonts/fontbureau/farnham/</a>, Benton Sans <a href="http://www.fontbureau.com/fonts/BentonSans/" title="http://www.fontbureau.com/fonts/BentonSans/">http://www.fontbureau.com/fonts/BentonSans/</a> and a smattering of Titling Gothic <a href="http://www.fontbureau.com/fonts/TitlingGothicFB/" title="http://www.fontbureau.com/fonts/TitlingGothicFB/">http://www.fontbureau.com/fonts/TitlingGothicFB/</a> for the teasers and the culture supplement. </p>
      <p>You can see our redesign on our Issuu account, might be good for a few ideas! <a href="http://issuu.com/trinitynews" title="http://issuu.com/trinitynews">http://issuu.com/trinitynews</a> </p>
      <p>Good luck with yours.</p>
