      <p>What about Kepler? It's not as common as Utopia, but has great readability and the right look &amp; feel. The only problem is the smallish x-height requires larger point sizes and will use more paper - but for a student newspaper that might not be a huge deal.</p>
      <p>Of the headline fonts above: NewJune and Reina are way too mannered; Moderno is too conservative; I like Vitesse, because it says both "youthful" and "trustworthy" to me, and it's a good match for Utopia (assuming you stay with that); the unicase feature in Hermes could be nice, since students like to have [more] fun!</p>
      <p>hhp</p>
