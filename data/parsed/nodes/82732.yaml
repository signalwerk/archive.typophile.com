      <p>Thanks all for taking the time to reply; putting typophiles right up there with open source software enthusiasts in my list of online cool crowds.</p>
      <p>UK newspapers tend to be either "tabloids" that print gossip and sleaze (use of heavy Arial weights and often a not-very-seriffy serif bodytext) or "quality" newspapers (more fancy Serifs, often Times, not just in bodytext but also in headlines).</p>
      <p>One exception is the London "Guardian": the UK's (arguably) highest quality newspaper. They commissioned their own typeface a few years ago to go along with a redesign. <a href="http://www.christianschwartz.com/guardian.shtml" title="http://www.christianschwartz.com/guardian.shtml">http://www.christianschwartz.com/guardian.shtml</a></p>
      <p><img src="http://farm1.static.flickr.com/24/42450922_1844ebd575.jpg"></p>
      <p>We want a break from the past of our publication, which seems to have just used various weights of Times in the past: a "quality newspaper" imitation. However, we're not wanting to go down the crass Arial route. Utopia is an obvious solution to this, but I fear it would just look like us trying to emulate the London "Guardian".</p>
      <p>We're a student publication that wants to be at the cutting edge, but we also want our content to be taken seriously. In a roundabout way, using standard newspaper fonts makes us look like imitators playing a game reserved for pros. Times New Roman looks as if we're just hoping for a job in the real world, so maybe something new could really set us apart...</p>
      <p>To be more interesting, headlines could perhaps be:</p>
      <p>* Something thick with a hand-cut look like HermesFB Black. <a href="http://www.fontbureau.com/fonts/sans/HermesFB/" title="http://www.fontbureau.com/fonts/sans/HermesFB/">http://www.fontbureau.com/fonts/sans/HermesFB/</a></p>
      <p>* Thin and modern (but a long way away from straight and clinical like Gill Sans) like NewJune <a href="http://www.hubertjocham.de/item.php/type/sans/NewJune/" title="http://www.hubertjocham.de/item.php/type/sans/NewJune/">http://www.hubertjocham.de/item.php/type/sans/NewJune/</a></p>
      <p>* A thick italic display font, like ModernoFB Condensed Bold Italic. <a href="http://www.fontbureau.com/fonts/serif/ModernoFB/" title="http://www.fontbureau.com/fonts/serif/ModernoFB/">http://www.fontbureau.com/fonts/serif/ModernoFB/</a></p>
      <p>* A really modern typewriteresque trendy magazine-type font like Vitesse Bold. <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100036" title="http://www.typography.com/fonts/font_styles.php?productLineID=100036">http://www.typography.com/fonts/font_styles.php?productLineID=100036</a></p>
      <p>* Even something really out there and fancy like Reina? <a href="http://new.myfonts.com/fonts/argentina-lian-types/reina/" title="http://new.myfonts.com/fonts/argentina-lian-types/reina/">http://new.myfonts.com/fonts/argentina-lian-types/reina/</a></p>
      <p>So I guess I have two naive questions: </p>
      <p>1) do these seem like fairly legitimate options for newspapers headlines? and </p>
      <p>2) am I correct to be resigned to using something fairly standard (i.e. boring) and well-tested like Utopia for body text?</p>
