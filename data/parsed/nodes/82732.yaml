    html: |-
      <p>Hmm..Vitesse is an interesting choice for headlines, but I don't think it works for body copy the way you think it does.</p>
      <p>It's really hard to offer specific suggestions — you have a certain feel that you're going for, but ultimately that will be conveyed more by how you use the typefaces than the typefaces themselves. What you're really looking for is a workhorse typeface that can be used in all sorts of contexts.</p>
      <p>I like Hrant's suggestion of Kepler, especially because of the absurd number of weights it comes in.</p>
      <p>I'll also put forth that the newspaper for which I was design director in college used Meta and Meta Serif, which was pretty great because they're not commonly used as newspaper typefaces, but the large x-height means that they reduce really well. The Headline weights of Meta, in particular, were useful. Now the New York Times is going to be using Meta and Meta Serif on their website, apparently, so I guess that it would bring kind of a "webby" feel to the paper, which I'm not sure is beneficial.</p>
      <p>We (well, I wasn't part of the redesign team — it was the year before I rejoined the staff) also considered Chronicle and Whitney, which would have looked entirely different but would still have been a great choice.</p>
      <p>I guess none of this is really that helpful; there are many, many good choices out there, and the bad ones are easy enough to avoid. Good luck!</p>
