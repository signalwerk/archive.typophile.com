      <p>&gt; Were any changes made to rectify the spacing problems that Hrant has mentioned?</p>
      <p>No. A good reason for that would be that customers would have hated the resultant reflow of any old documents. A bad reason would be hubris.</p>
      <p>Grant, TUG's Baskerville will be: freely available; freely modifiable (with some provisions concerning "officialness"); and a mix of convention in the Roman and innovation (blasphemy?) in the Italic (but don't fear, it's not a slanted-roman or anything).</p>
      <p>Thomas, last year I left the top of my convertible (the one I had before this one - remind me to tell you the story of how the previous one died) open day-and-night (no garage) for 13 weeks straight. And when you turn on the heater, isn't the feeling of hot air rising and dissipating from your feet to your (cold) head just surreal?</p>
      <p>&gt; is there a good way to set Mrs. Eaves?</p>
      <p>About 18 point, one line at a time, spaced manually.</p>
      <p>&gt; I would have thought the best companion for Mrs Eaves would be Mr Eaves?</p>
      <p>You mean Richard? The bastard jumped ship.<br>
      But Mr Richard would still be a great name for a font.</p>
      <p>Tiff, Sarah was still married when she started living with JB.<br>
      But probably because divorce law in the UK back then was nasty.<br>
      On the other hand, I'm all for discouraging divorce to some<br>
      extent: it makes marriage more serious. Anyway, as you were.</p>
      <p>hhp</p>
