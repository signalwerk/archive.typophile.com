    html: <p>It seems most if not all the Emigre fonts are very loosely spaced. I don't have a problem with that at relatively small text sizes. I site Visa and Tarzana as examples. If I need to use them at larger text sizes its really not a problem in either Illustrator or InDesign to use the option/left arrow key combination to tighten up the spacing.</p>
