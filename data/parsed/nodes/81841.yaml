  html: <p>I am looking for a display type for an organization with its roots in mid-16th century Spain. They are using <a href="/wiki/Algerian" class="freelinking" rel="nofollow">Algerian</a> now, and I am fine with something decorative, but I wanted something a bit more mature.</p>
