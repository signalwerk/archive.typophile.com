    html: |-
      <p>Of the options presented so far, I think 2a is the strongest candidate. Making the banner white allows it to rise to the foreground. The yellow shield then sets nicely into the background, giving the parts of the complex logo some hierarchy.</p>
      <p>Another reason to vote for 2a is that it has fewer contours. I prefer that simplicity, and it will also be better if the client ever needs cut vinyl for banners or vehicle decals.</p>
      <p>Mostly, I like shield logos, but the one problem with placing the company's name in the banner is that it is relatively small and difficult to read. It's a challenging problem to solve. I understand from your original post that you didn't have complete freedom. It's probably too late to make any big changes, but here's a link to a shield logo that avoids the type size problem. (The UPS shield is a good example too.)</p>
      <ul>
      <li><a href="http://www.cricketzone.com/upload/logo/australia.jpg" rel="nofollow">Cricket Australia Logo</a></li>
      </ul>
