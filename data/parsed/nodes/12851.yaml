    <p>I am working with a client that sells cleaning franchises, has cleaning services and sells products related to the same field.</p>
    <p>I know some will be automatic no's, but the client came back requesting the stroke on the banner/nameplate. So i worked up some variations</p>
    <p>Does the stroke inside the nameplate work?<br>
    Does the other variation? Other tips?</p>
    <p>I personally think the marks with the gold fill in the middle are much better. (2a, 3a and 3b would be the direction i would choose) Any opinions elsewise?</p>
    <p>Don't mind any variations in craft, they aren't final. Anything else?</p>
