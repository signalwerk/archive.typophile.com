    html: |-
      <p>I prefer the rightmost one in the first row. The white background makes the whole logo look much "cleaner" than a gold one does. The gold stroke looks good on both the shield and the banner. The logo on the whole is approaching excessive business (although it isn't there yet), so I would avoid adding any more elements or embelleshments.</p>
      <p>The <em>TC</em> does look a little forlorn. It could be enlarged a bit, and maybe even redesigned. For example, putting the letters on the same baseline might allow you to enlarge them both while avoiding having to crowd the margins <em>too</em> much.</p>
      <p>Or you could redraw the <em>T</em> and <em>C</em> glyphs so that they fit the form of the shield somewhat. I'm thinking something vaguely reminiscent of the Superman logo (but not obviously so).</p>
      <p>Just a couple of ideas to explore.</p>
