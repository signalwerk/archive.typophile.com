    votes: null
    html: <p>To make it easy on yourself, throw a symbol into the string you use for replacement. Something like "=mblogo=" (The lookups use character names, so that would be "equal m b l o g o equal") will protect you from unforeseen surprises if you ever have to write about something like "tourismblogoftheday.com".</p>
