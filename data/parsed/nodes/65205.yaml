    <p>Hi to everyone,<br>
    I'm new in this forum but I found many useful informations on Typographic world on it.</p>
    <p>I wrote because I have a problem...<br>
    I'm modifing an existing font and I have to insert some new glyphs that I should recall by a key combination (like "mblogo"), is it possible? How can I do that?</p>
    <p>I use FontLab Studio 5.</p>
    <p>Thanks a lot!<br>
    Sorry for my english!</p>
    <p>Stefano</p>
