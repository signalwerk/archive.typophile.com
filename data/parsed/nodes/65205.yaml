    html: |-
      <p>Piece of cake.<br>
      You <em>do</em> need to add some OpenType magic to the font, though.</p>
      <p>Using 'liga' code for ligatures:</p>
      <p><code>feature liga {<br>
       # Latin<br>
         sub T e s t by T_e_s_t;<br>
      } liga;</code></p>
      <p>If the program you are using supports ligatures, typing "Test" will automatically be changed to my quick-and-dirty "Test" glyph:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ligatures_4216.PNG"></div><br>
      (Left is Ligatures Off, right is On.)<p></p>
      <p>Of course, you are free to use any of the other OTF features, if you don't want to mess with 'standard' ligatures (e.g., put them in a stylistic set or in 'calt' -- contextual ligatures). Use the Opentype feature preview in FontLab to check if it works.</p>
      <p>I don't think the sequence "mblogo" could pop up in the middle of a regular English word. However, if you need to use a phrase that <em>can</em>, either don't use ligatures (as these are usually 'on' for all text), or check the OTF Feature File description on how to limit it to a single word. (Sorry -- can't recall, altho' I used to be able to recite it from memory.)</p>
      <p>It is considered 'proper usage' if your new glyph name is composed of the singular characters that make it up, separated by underscores. I think this is best seen in PDFs; selecting and copying the "Test" glyph yields the <em>plain text</em> "Test" again. You can also search a PDF for 'test', and it'll find both variants.</p>
