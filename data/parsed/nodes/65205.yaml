      <p>Chapter 11 of the FontLab manual covers OpenType. The section on substitution lookups starts at p864 in the Mac PDF manual, p854 for Windows.</p>
      <p>The League of Movable Type also has <a href="http://blog.theleagueofmoveabletype.com/post/238296379/how-to-add-opentype-alternates-in-fontlab" rel="nofollow">a nice tutorial</a>.</p>
