    html: |-
      <p>Hey, Christopher.</p>
      <p>1. Click on the entry's title.</p>
      <p>2. Just beneath the entry's title, in the black bar, click on "Edit".</p>
      <p>3. At the bottom of your entry, you will now see three buttons: the one on the far right is "Delete".</p>
      <p>4. Once you hit the "Delete" button, that should be it, but I've never used this feature before. :-)</p>
