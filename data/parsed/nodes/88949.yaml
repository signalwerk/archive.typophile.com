      <p>This is a cool idea!  However, I'm not completely sure I understand how it works.  I compiled the code, and ran termk, but I don't quite understand how the spacing is adjusted.  Does this work as a combination of kerning and ligatures?  For ligatures (assuming ligatures are only made up of 2 characters), how do you decide whether to combine on the left or the right side of a character?</p>
      <p>Somewhere you mention that the calculation of spacing is done using dynamic programming and runs in O(n) time.  Could you explain it more explicitly?</p>
      <p>One thing that I noticed using termk on the command line and in editors is that changing one character can have an effect very far away---for instance, when typing "hhhhhhhhhhhhhhhhhhhi", when the 'i' is typed, all of the 'h's shift right one pixel.  For editors, it might be worth considering how to force changes to be local to minimize visual disturbance. I presume this is why many WYSIWYG editors use ragged right, instead of full justification.  ;)</p>
      <p>Best wishes, Stephen</p>
