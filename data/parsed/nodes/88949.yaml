      <p>ec429:  Thanks for the explanation!  I think I understand now.</p>
      <p>I wonder if a similar effect can be achieved by using (lots of) ligatures (or contextual substitutions) in a monospaced font.  Then it could be used by standard terminals and editors.  The downside of this approach is that it doesn't have the global optimization that you currently are doing with deviation kerning.</p>
      <p><cite>(Playing NetHack with it, on the other hand... now /that's/ impossible)</cite></p>
      <p>:-)</p>
