    html: |-
      <p>sgh: My guess is, without the global optimisation you'd really struggle to get anything good, because most of what you want to do is narrowing: most monospace fonts are designed around the em, with anything narrower being stretched (hence the huge serifs on i and l).  Consequently, if you can't stretch other spaces out, you're going to be unable to have a decent kerning of things like i, l, f; they'll simply end up with too much space around them.</p>
      <p>As for use in standard terminals and editors, the current method could be implemented in existing font rendering engines (by people who understand how those engines work), though anything that only re-renders part of the line when things change will encounter problems.<br>
      If you wanted monokerning in a GUI text editor, you'd probably have to modify the editor to render whole lines at once, in which case you may as well just make it use monokern directly like termk does.</p>
      <p>Anyway, if you know how to code, I suggest you try experimenting with ways to force locality and see whether it works; personally, I don't think locality matters that much, since when I'm editing text (or code) I have a lot of regressive eye movement anyway (because I'm constantly re-evaluating what I'm typing).</p>
      <p>I suppose it might help if there were some way to smoothly move or fade the text to the new position when it moves, but that would be rather CPU-intensive (and might cause problems with small fonts which would just blur into a grey mush).</p>
