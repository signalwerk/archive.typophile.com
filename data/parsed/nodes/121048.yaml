    html: |-
      <p>It's  there, you have to go to page 28 (and the following pages) of the PDF, to Founders Grotesk TEXT.</p>
      <p>I didn't dig too far into the code of the Academy of American Poets page, so perhaps they used the non-text version of Founders on that one character to get the less ornate |r| seen in the sample. Or maybe they had Klim customize the web font for them to align with their logo design.</p>
      <p>Founders Grotesk Text is also where you will see the more open |c| that's visible in the sample.</p>
      <p>And I just noticed that the sample has an |i| with a round tittle. That I can’t find anywhere in the character set. Also custom?</p>
