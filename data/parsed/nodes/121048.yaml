      <p>Riccardo, I use a Firefox plugin called Type Sample to identify CSS-styled type on websites.</p>
      <p>And cpkc, you are quite welcome. Thanks for the mystery to solve. There are enough differences between the text and standard versions of Founders Grotesk to see why you were skeptical, and the logo itself mixes and matches fonts within the family (the |r|, for example; plus, it uses a custom dot over the |i|).</p>
