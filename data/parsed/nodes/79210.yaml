    html: |-
      <p>The glyph cell labels in the FontLab Studio printout are rendered using a font, but the glyphs are rendered as outlines. It's quite possible that the outline drawing procedure is somewhat buggy. </p>
      <p>We plan to improve this in the next release. </p>
      <p>Adam Twardoch<br>
      Fontlab Ltd.</p>
