    html: <p>Yeah, you can't expect the 1st 2 or 3 ideas to be the best. Sometimes they are but it's good to keep trying things until you have hashed out your ideas well. I am wondering what you want a client to think Sevex is. That isn't clear to me yet. How do you want people to feel/think when they see your mark. I am a big fan of intentional design. So far I would assume your design is for a hair salon or a night club - or maybe some kind of sports food. It doesn't make me think illustrator too much yet.</p>
