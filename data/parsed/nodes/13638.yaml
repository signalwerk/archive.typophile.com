    html: |-
      <p>I agree with Eben - allthough you go through great lengths refining the design, which has it merits, the communicative value of the logo isn't up to par. </p>
      <p>The icon tells me something about complexity and simplicity. This is good - making the complicated simple is a designer's core business. The friendly colours work as well; they warm up the hard lines.</p>
      <p>The name and the type are something else, though. It might be my cultural background, but Sevex has a very harsh ring to me. It sounds latin to me, a word I would associate with a roman warrior or a very synthetic compound. The type doesn't soften this harshness - although it is somewhat rounded, the letters are too skinny to make this felt.</p>
      <p>So if this were a choir, the different singers are very much out of tune. </p>
      <p>In what you write I feel you are very attached to the name - for it's history as a nickname. But an Internetnick is very, very different from a graphic design business. I might sound a bit blunt, but I think a different name might make this a good logo in stead of a passable one.</p>
      <p>----------------------------------------------------<br>
      My work is a game. A very serious game [M.C. Escher]</p>
