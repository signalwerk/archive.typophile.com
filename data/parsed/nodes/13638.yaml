    date: 2005-07-27T03:18:00
    votes: null
    html: |-
      <p>I think if you are going to reference 4 colour process in your logo you should include black as something more than a stroke. The stroke on D and E is weak compared to the type. C resembles a propeller to me rather than ink drops, maybe a highlight would make them seem more droplike.<br>
      The stroke weight of your logotype is inconsistent, the centre bar of the S in particular is not working and the whole is a bit narrow, the X is too wide especially compared to the S, on the first E the final stroke could be extended to close up the space with the V and both Es seem to be lighter on the left.<br>
      As a final point the print and production is going to be expensive and the registration is going to be critical.<br>
      Tim</p>
