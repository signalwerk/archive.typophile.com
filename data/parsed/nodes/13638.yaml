      <p>Maybe it's just my interest in typography but it seems like a single part logo ( just the name) would be cooler where letter design was the thing that carried the day rather than this two part model. I did make a stab at working with your elements just to see what would happen. Here it is if you want to check it out.  <a href="http://www.eyebytes.com/sevex.jpg" title="http://www.eyebytes.com/sevex.jpg">http://www.eyebytes.com/sevex.jpg</a> </p>
      <p>I think the top of the v &amp; x enternd too far &amp; the e looks like an egg. It isn't working for me.</p>
      <p>Right now neither the name or the mark are cool enough on their own. But they are not cooler together either - there is no synergy here in my opinion.</p>
      <p>Also I still don't get what sevex means - this is going to sound harsh even though I mean it  with all sympathy -  I think that this identity isn't going to be great until you start letting go of the work you have done &amp; ask yourself what your goals are &amp; what might meet those goals better than what you have so far. This could mean tossing out the mark &amp; even the name if need be. </p>
      <p>What kind of illustration &amp; graphic design do you do?</p>
