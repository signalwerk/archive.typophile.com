    html: |-
      <p>The non-rounded letters shouldn't exactly align with the rounded characters, reduce their height slightly, otherwise they burst out of the top (and bottom) of the logo. The top half of the E could be improved by increasing it, it looks as if it is leaning back, this will also address the kerning at EV. The V is definitely a problem since a potential viewer would not have any reference and would conclude it is a U I think you will have to abandon your skeleton and work with a more conventional form. Overall the construction has problems with an uneven colour especially dark at the centre of the X and Es and while EVEX are all monoline the S is light at the centre. The symbol is working best for me as per the left hand column.<br>
      Tim</p>
