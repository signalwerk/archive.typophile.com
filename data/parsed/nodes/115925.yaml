      <p>It seems very similar (not identical) to MADType's <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> which has alternates for each letter and can be set to automatically alternate between letterforms.</p>
      <p>I suspect Walmart could have had a custom font made for this, because it would be very cheap and give them something only they had.</p>
      <p>- Mike Yanega</p>
