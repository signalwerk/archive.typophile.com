  html: |-
    <p>Hi</p>
    <p>Any suggestions of what serif to pair Meta with?</p>
    <p>I'm setting meta as body and boxouts also straps and captions, however I want to use a serif for headers and pullquotes - for that emotional, traditional and authoritative connection.</p>
    <p>The job is a high end tourist brochure.</p>
    <p>I'm using Minion Pro at the moment and fairly happy with the results - just wondered if anyone had any other suggestions??</p>
    <p>Thanks</p>
