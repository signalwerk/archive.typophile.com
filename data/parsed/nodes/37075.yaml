    <p>This is a design I've been working on for the last two weeks. I think it's my third more serious attempt at designing a typeface. It's still in the early stages. I have drawn first versions of the lowercase characters. There is no kerning yet, I kerned some pairs a bit by hand when I set the specimen.</p>
    <p>I would like to have some crits at this point. The 's', 'v', 'w', 'y' and 'z' are the characters that trouble me the most, I have difficulties with getting those to fit well with the style of the design. But all tips are welcome. :)</p>
