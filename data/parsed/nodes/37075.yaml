      <p>Okay, when you've developed it enough you'll have a better impression of its potential.</p>
      <p><em>Purely stylistic. I just liked the look of it basically</em></p>
      <p>Cool :^)  Curls are very trendy at the moment as a stylistic device, but there is a practical side to putting them on 'a d i l u' in a sans serif. They function as semi-serifs, helping to make up for the absence of serifs, making sans serif fonts more readable.</p>
      <p><em>The battle for the ’s’ continues. Although making it less ’italic-looking’ might already improve it drastically.</em></p>
      <p>Same thing. The italic look will go away when you've mastered the s structure.</p>
      <p>One way of determining where to place the join on k is to try integrating it with x. Overlay x on top of k and adjust k until they match, or as close as is practical to make them.</p>
      <p>To make the lighter weight: run a bold filter with negative parameters on a and e. You'll need to experiment with different values until it looks like the weight you want. Test render those letters at large and small sizes to make sure of the weight. Then run the whole font thru the bold filter with the negative params established by testing a and e. Finally, restore the stressing and lost detail. It means adjusting all the characters, but this method is still quicker than building the whole thing again from scratch.</p>
      <p>j a m e s</p>
