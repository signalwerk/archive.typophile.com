      <p>If its main use will be a display type the inside kinks in the counters will be distracting, drawing attention to themselves; in that case I would make them smoother.</p>
      <p>If its main use will be for text the inside kinks won't stand out so much and it may be possible to retain them much as they are now.</p>
      <p>One way to find out is to build a thinner weight suitable for text setting, complete the rest of the capitals, then make a PDF with sustained text setting---around 300 words at 10 - 12 points size. Read it. Don't look at the character design(s). Read it at the speed you normally would read. It reads okay? Then the kinks aren't a problem, they can stay. It doesn't read smoothly? It may be those kinks holding back the flow of readability.</p>
      <p>* tighten up the branching points, where strokes branch from stems make them thinner.</p>
      <p>* r needs more weight at end of stroke.</p>
      <p>* curl on lower leg of k is too much, rein him back in, make it more subtle.</p>
      <p>* consider replacing the diagonal roman style w with a cursive structure---two u's joined together. IMHO roman style w's stand out in every font they are a part of, compromising integration of forms. Only a suggestion. If you really like w as is by all means keep it.</p>
      <p>* keep up the battle for the s. Keep working on it. Walk away from it and work on something else for a while, then come back to the s and try again. Keep at it, work on that little mother and it will eventually submit to your will.</p>
      <p>Otherwise it's excellent.</p>
      <p>j a m e s</p>
