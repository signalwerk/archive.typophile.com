      <p>Jelmar,<br>
      Regarding italics. You might start out by slanting your upright regular and test the slant angle. Some people like different degrees and it can vary with the nature of the family. My current preference for a sans is 11 degrees but that is NOT a rule.<br>
      After you make your slant, copy the whole font to the mask layer and use it only as a reference. Then, draw your italics as they should look in the glyph layer. I personally find drawing italics to be much more work than I expected so don't become frustrated if it takes a while. Italics are a different world and need care and feeding :-) Spacing them is another adventure.</p>
      <p>ChrisL</p>
