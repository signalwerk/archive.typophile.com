    html: |-
      <p>Making an italic. First off, to save yourself extra work later, perfect the regular upright font. Make sure the side bearings and any kerning are well-sorted---test it thoroughly to be certain.</p>
      <p>Then use the upright font as the basis for the italic. Apply a slant filter with a value between 5 and 10 degrees. Experiment with different slant angles until it looks right to you. Post the results and get feedback.</p>
      <p>Once the ideal slant angle is established, start converting key characters to their cursive forms. How far your go with this depends on the final look you're aiming for. Typically:</p>
      <p>First narrow every glyph by about 15 to 25 %. Slanted uprights that haven't been narrowed just don't look right (like an italic font) unless the upright originals were condensed forms to begin with.</p>
      <p>a &gt; monocular a<br>
      b &gt; curl ascender tip backwards slightly, remove baseline spur and smooth bottom left corner, like b in Minion italic<br>
      d &gt; curl ascender tip backwards slightly, point baseline curl upwards<br>
      e &gt; make it cursive, eg: Minion italic<br>
      f &gt; drop stem below baseline and add back-facing curl<br>
      g &gt; already done<br>
      h &gt; curl ascender tip backwards slightly, add curl to right stroke, pointing upwards<br>
      i &gt; add curl to bottom of stem, pointing upwards<br>
      k &gt; curl ascender tip backwards slightly, make straight upper arm curved, or alternatively convert to a loop k<br>
      l &gt; curl ascender tip backwards slightly, point baseline curl upwards<br>
      m, n &gt; add curl to right stroke, pointing upwards<br>
      p &gt; curl descender tip backwards slightly<br>
      q &gt; replace with italic b rotated 180 degrees, curl descender tip forwards slightly<br>
      r &gt; curl baseline stem tip backwards slightly<br>
      s &gt; adjust curves and stressing for cursive flow; alternatively convert to cursive handwriting structure (see Bickham script and French script for example)<br>
      t &gt; point baseline curl upwards<br>
      u &gt; point baseline curl upwards<br>
      v, w &gt; convert to cursive forms, study several good italic fonts, either seriffed or sans, for examples<br>
      x &gt; study Minion italic x, convert, convert!<br>
      y &gt; match to italic v form<br>
      z &gt; study italic z in Minion and Charter for 'standard' italic form; alternatively give it a cursive descender tail---see French script)</p>
      <p>c and o you may want to adjust the curves and stressing for a flowing cursive look. Severity of this depends how much angle you use. The gentler the angle, the less need to adjust. Same applies to curved parts of h, n, m, u, and the bowl letter pairs b-q, p-d.</p>
      <p>Capitals: caps with curved elements will need adjusting too, but otherwise most italic fonts make do with the same capital structures as their matching uprights. If you want to add a bit of flair to the caps; replace E with a curved structure (examples: Liberty script, Phyllis italic, Piranesi  italic); give V W X and Z the same treatment as their lowercase italic forms.</p>
      <p>j a m e s</p>
