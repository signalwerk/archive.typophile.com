    html: |-
      <p>Here is a (hopefully) helpful hint about the g: </p>
      <p>You can (and should) cheat the bowl at the baseline a little higher. Instead of making it overshoot as far as the rest of the round glyphs, have the bowl just touch the baseline, or even a little above. It makes the letter balance better between the bowl counter and the space between the tail. Especially when you have short decenders. Right now it's a little top heavy.</p>
      <p>You'd think moving it up would make it stand out, but it's the opposite.</p>
      <p>R</p>
