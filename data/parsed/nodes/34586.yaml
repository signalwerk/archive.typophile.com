  html: |-
    <p>I am working with dynamic text in Flash, and I cannot size one text character differently than others of the same text string. There is literally no realistic workaround to reduce the size of the trademarks(TM), So...</p>
    <p>I want to crack open the font (Meta Normal), resize the "TM" glyph, and seal it back up to use.</p>
    <p>Assuming I have the tools with which to do this, would it violate the license?</p>
    <p>I would be using this font within an ad agency to create Flash banners for a client.</p>
