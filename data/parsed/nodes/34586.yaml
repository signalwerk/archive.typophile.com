      <p>This kind of EULA should get a public flogging.<br>
      FLOG, FLOG, FLOG.</p>
      <p>Here's an idea, if you really want to respect the EULA: do a convert-to-oulines on the TM in illustrator and put the result in a new dummy font with just that glyph in it, enlarged. If they say a convert-to-outlines is illegal, then you know to really ignore them.</p>
      <p>hhp</p>
