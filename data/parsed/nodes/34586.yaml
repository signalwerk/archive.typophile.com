    html: |-
      <p>Thanks for all your responses.  I'm not the one who bought the font, so I don't have a copy of EULA.</p>
      <p>With dynamic text fields in Flash, you can only specify one font and one size per text string.  That's why those workarounds you mentioned won't work.</p>
      <p>I can't believe it violates the license to embed the font into Flash...?  That's crazy, for what are we supposed to use these fonts?  And to convert it to outlines violates it as well..?  It sounds like they make everything against the rules to cover themselves.</p>
