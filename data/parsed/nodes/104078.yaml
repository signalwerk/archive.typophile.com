  html: <p>I am looking for a thin slab serif that has a bit of a contemporary or "tech" like feel without being cheesy. I have looked at <a class="freelinking external" href="http://vllg.com/Constellation/Apex_Serif#panel=usage-poster" rel="nofollow">Apex Serif</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mellediete/gingar/" rel="nofollow">Gingar</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/soho/" rel="nofollow">Soho</a>, and <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100036" rel="nofollow">Vitesse.</a> These are all pretty close to what I want, but I am wondering what else is out there. Any ideas of other fonts in a similar vein?</p>
  html_clean: <p>I am looking for a thin slab serif that has a bit of a contemporary or "tech" like feel without being cheesy. I have looked at <a class="freelinking external link-external" href="http://vllg.com/Constellation/Apex_Serif#panel=usage-poster" rel="nofollow">Apex Serif</a>, <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/mellediete/gingar/" rel="nofollow">Gingar</a>, <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/mti/soho/" rel="nofollow">Soho</a>, and <a class="freelinking external link-external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100036" rel="nofollow">Vitesse.</a> These are all pretty close to what I want, but I am wondering what else is out there. Any ideas of other fonts in a similar vein?</p>
