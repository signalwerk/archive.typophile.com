    <p>—<br>
    For Immediate Release<br>
    Monday, July 18, 2005</p>
    <p>Contact: Ted Harrison<br>
    Fontlab Ltd.<br>
    136 E 8th St., Port Angeles WA 98362, USA<br>
    Tel: +1 (509) 272-3260<br>
    contact[at]fontlab[dot]com</p>
    <p>Port Angeles, WA, USA – July 18, 2005. To celebrate the opening of the “Type Week” in New York, Fontlab Ltd. announced today the release of FogLamp, a new conversion utility for Fontographer users.</p>
    <p>FogLamp converts Fontographer font source files (.fog databases) into FontLab-compatible .vfb files. The easy drag-and-drop batch conversion process retains all relevant elements of the .fog file including outlines, template/mask, bitmaps, hints, font naming and other font header information.</p>
    <p>“FogLamp is our first new product that utilizes the Fontographer technology. We are releasing this product merely two months after licensing Fontographer from Macromedia, which confirms our commitment to developing the Fontographer product line,” said Ted Harrison, president of Fontlab Ltd. “With FogLamp, former Fontographer users can salvage their old project files. Current users of Fontographer can design type in their familiar environment while using technologically more up-to-date products such as TypeTool, FontLab (Studio), TransType or AsiaFont Studio for final font production. In short, FogLamp sheds some light onto the opaque Fontographer file format,” said Harrison.</p>
    <p>FogLamp retails at US $79 and is available in attractively-priced bundles such as the Fontographer “Power Pack”, which is a new integrated OpenType font making solution, encompassing Fontographer, FogLamp and TransType Pro. All products from Fontlab Ltd. carry a 60-day satisfaction guarantee.</p>
    <p>Visit the FogLamp page at <a href="http://www.fontlab.com/Font-tools/FogLamp/">http://www.fontlab.com/Font-tools/FogLamp/</a></p>
    <p>—<br>
    <em><strong>About Fontlab Ltd.</strong><br>
    Fontlab Ltd. has stayed at the forefront of digital font management by remaining devoted to developing font editors and typography products. Their full line of products is dedicated to solving the most complex typography issues. These products include: AsiaFont Studio™, BitFonter™, FogLamp™, FontLab™, Fontographer™, ScanFont™, TypeTool™, TransType™, FontFlasher™, FONmaker™, SigMaker™ and CompoCompiler™. More information on all Fontlab products can be seen at</em> <a href="http://www.fontlab.com/">www.fontlab.com</a>.<br>
    —</p>
