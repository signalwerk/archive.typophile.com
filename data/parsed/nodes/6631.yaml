    html: "<p>I love the fast service cafeteria logo they are currently using. Do they specialize in pizza? <br> <br>Of the posted designs, I also prefer #2. <br> <br>Have you explored any concepts with the winged P starting the word P+remier? I think having one \"fast\" read, rather than two (icon + title) might work well here. It might also allow for a streak, or flowing line, or some other graphic element to keep the P from looking like a stand alone \"super P\"�You would just have to be careful to maintain a sense of unity between the P and whatever other element you used. <br> <br>You've made a good start. <br> <br>Aloha! <br>Scott</p>"
    html_clean: "<p>I love the fast service cafeteria logo they are currently using. Do they specialize in pizza? <br> <br>Of the posted designs, I also prefer #2. <br> <br>Have you explored any concepts with the winged P starting the word P+remier? I think having one \"fast\" read, rather than two (icon + title) might work well here. It might also allow for a streak, or flowing line, or some other graphic element to keep the P from looking like a stand alone \"super P\"�You would just have to be careful to maintain a sense of unity between the P and whatever other element you used. <br> <br>You've made a good start. <br> <br>Aloha! <br>Scott</p>"
