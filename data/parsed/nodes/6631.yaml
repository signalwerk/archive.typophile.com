    html: <p>Oops! It looks like you posted while I was typing. <br> <br>I think  you've taken the right direction. The thing that seems to be missing in all of these is a sense of being "Premier". Your "P" indicates fast movement, or transport, but there needs to be some element in their identity/brand that indicates that this is a premier company. Maybe it will come in the application treatments (metallic inks, elegant sophistication in type treatments, etc.). For starters, IMO, I don't think the green is contributing to this.</p>
