    html: <p>I really like the swashy illustration of a truck logo. At first glance you'd think it's cliche, but I honestly can't think of any trucking logos I've seen on the highway go with that type of style. <br> <br>I do like your last wordmark. I can see that working quite nicely. I don't think the 'P' by itself really works, though.</p>
