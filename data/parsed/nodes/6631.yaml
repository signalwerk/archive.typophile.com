    votes: null
    html: <p>I think you're getting somewhere. This successfully captures the essense of what you seem to be going for. Darrel is right about the "P". It's off balance�heavy on the right (weight + motion). I think the "P" that you had before, with the tail on the last feather extending past the P-stem was more balanced. Also, the dot over the "i" is a little flat. It probably needs either less of an arc on the round/right side, or it just needs to be taller. <br> <br>Overall, I really like it. <br> <br>Aloha! <br>Scott</p>
