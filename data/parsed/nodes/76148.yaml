    html: <p>Yes, it's a member of the News Gothic family.  It's an old metal type font called News Gothic Condensed, Regular and Bold.</p>
    html_clean: <p>Yes, it's a member of the News Gothic family.  It's an old metal type font called News Gothic Condensed, Regular and Bold.</p>
