    <p>Um … I really like Minion Pro. I think it’s, like, the best font ever created. I think I got it with my InDesign CS2.</p>
    <p>But I had a question … </p>
    <p>How condensed is “Minion Pro Condensed” compared to just plain “Minion Pro.” (give me a percentage) I see “Minion Pro Condensed” a lot and I think it’s awesome. Plain Minion Pro is even more awesome.</p>
