      <p>These particular forms are often referred to as Granjon ornaments or Granjon fleurons, I believe.</p>
      <p>You'll find some digital versions in this collection:</p>
      <p><a href="http://www.myfonts.com/fonts/agfa/arabesque-ornaments-two-mt/" title="http://www.myfonts.com/fonts/agfa/arabesque-ornaments-two-mt/">http://www.myfonts.com/fonts/agfa/arabesque-ornaments-two-mt/</a></p>
      <p>The early 20th-century designer &amp; typographer Bruce Rogers was fond of using them to great effect. </p>
      <p>If you search on some of those terms, you may find some info.</p>
      <p>-- K.</p>
