    html: |-
      <p>Actually, the answer isn't quite right. Multiple adjectives before a noun are hyphenated:</p>
      <p><cite>This is my long-range rifle.</cite></p>
      <p>If they are put after the noun, no hyphen:</p>
      <p><cite>This is the rifle I shoot at long range.</cite></p>
      <p>BTW, everyone is detail oriented. What's important is what details they are interested in. Only a certified compulsive is interested in all of them. Most companies don't hire *certified* compulsives.</p>
