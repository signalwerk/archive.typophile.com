    <p>PricewaterhouseCoopers' bouncy type is no more. New identity system by Wolff Olins. What is the typeface they are using?</p>
    <p>Identity details can be here, including collateral with the same italic typeface:<br>
    <a href="http://www.underconsideration.com/brandnew/archives/pwc.php" title="http://www.underconsideration.com/brandnew/archives/pwc.php">http://www.underconsideration.com/brandnew/archives/pwc.php</a></p>
    <p>Here's the new website, and, no, I'm not talking about the Georgia:<br>
    <a href="http://www.pwc.com" title="http://www.pwc.com">http://www.pwc.com</a></p>
    <p>Thanks,<br>
    Eric</p>
