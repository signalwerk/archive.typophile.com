    html: <p>Have you tried running the font through the <a href="http://www.microsoft.com/typography/FontValidator.mspx">Font Validator</a> tool? From the kind of error message you are getting, I suspect the problem is not something like names or export options but problems with glyph outlines or hints affecting rasterisation.</p>
