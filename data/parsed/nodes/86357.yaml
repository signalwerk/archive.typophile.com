    <p>Hello,</p>
    <p>I am trying to identify the typeface used on the Smashing Magazine twitter feed.</p>
    <p>I thought it might be Pluto but Pluto doesn't have an italic version and there are other obvious differences.</p>
    <p>I really love the style and am curious if anyone has an idea. Any help is greatly appreciated! Thanks!</p>
    <p><a href="https://twitter.com/#!/smashingmag" rel="nofollow">SM's twitter feed</a></p>
