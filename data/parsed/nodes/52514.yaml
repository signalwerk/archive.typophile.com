    html: |-
      <p>Tristis, are you looking for a font with all the circles, or one that looks like the main skeleton.</p>
      <p>incidentally, re: digital type ... this is from a Paul Shaw / AIGA piece:</p>
      <p><strong>1968 (first digital typeface)</strong><br>
      Digi-Grotesk S Despite its derivative appearance—it looks like a condensed knock-off of Neuzeit Book from Stempel—Digi-Grotesk S is significant because it was the first digital typeface. It was created by the staff of Dr. Ing. Rudolf Hell, the company that pioneered cathode ray phototypesetters.</p>
      <p><strong>1975 (first original ikarus face)</strong><br>
      Marconi Designed by Hermann Zapf for Hell, Marconi was the first original typeface to be produced with the Ikarus computer-aided design and digitization system. Ikarus, developed in 1973 by Peter Karow of URW (Unternehmensberatung Rubow Weber), was the dominant type design and production tool well into the 1990s.</p>
