      <p>It’s not technically a font, it’s from a book called “Letters and Lettering” written in 1902... about 80 years before fonts were invented.</p>
      <p>There might be a font that’s similar in style, but it won’t be an exact match. These characters are pretty unique looking. Perhaps someone knows a face that could be close.</p>
      <p>Initially I thought of Benguiat. <a href="http://www.myfonts.com/fonts/itc/benguiat/familytree.html" title="http://www.myfonts.com/fonts/itc/benguiat/familytree.html">http://www.myfonts.com/fonts/itc/benguiat/familytree.html</a></p>
