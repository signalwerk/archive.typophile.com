      <p>Yes, stylistic sets are one of the more opaque features available: you can’t figure them out even if you know the terminology.<br>
      Even though, there could be some problem with a purely visual interface:</p>
      <blockquote class="twitter-tweet" lang="en" xml:lang="en"><p>Perhaps we shouldn't be so quick to encourage accessible OpenType features. <a href="http://twitter.com/hashtag/AdobeTypeUI?src=hash">#AdobeTypeUI</a> <a href="http://t.co/M9iUmtviXO"></a>— Kat Ran Press (@KatRanPress) <a href="http://twitter.com/KatRanPress/status/526763218929467392">27 Ottobre 2014</a></p></blockquote>
      <p>;-)<br>
      Surely bad taste will not be stopped by a better user interface, but some OpenType features aren’t just visual, they also carry semantic meanings, which should be addressed.</p>
