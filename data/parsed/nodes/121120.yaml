    <p>Former Typophile moderator Zara Vasquez-Evens has written an interesting article on Medium (<a href="https://medium.com/@CommandZed/thoughts-on-an-improved-opentype-ui-c6748f2eef3a" title="https://medium.com/@CommandZed/thoughts-on-an-improved-opentype-ui-c6748f2eef3a">https://medium.com/@CommandZed/thoughts-on-an-improved-opentype-ui-c6748...</a>), prompted by the recent petition for a better user interface for accessing OpenType features in design software (<a href="http://ilovetypography.com/2014/10/22/better-ui-for-better-typography-adobe-petition/" title="http://ilovetypography.com/2014/10/22/better-ui-for-better-typography-adobe-petition/">http://ilovetypography.com/2014/10/22/better-ui-for-better-typography-ad...</a>).</p>
    <p>A few selected quotes:</p>
    <blockquote><p>What the sh*t is a Stylistic Set? Most of the discussions and UI mock-ups floating around of proposed UI solutions that I have seen, seem to be created by type designers, for expert users, i.e., people who know a thing or two about font technology. While every idea is valuable, there is a fundamental UI component that seems to be overlooked and that is nomenclature. There are differences in the language that type designers speak and the language that the broader design community speaks.</p></blockquote>
    <blockquote><p>How are we planning to educate people on the complexities of font technologies and the features available to them? How can type designers and advocates for great typography better inform the general population on how to take advantage of a font’s potential?</p></blockquote>
    <blockquote><p>We need tools that are dynamic, context-sensitive, and smart.</p></blockquote>
    <p>I, for one, would welcome a completely visual solution.</p>
