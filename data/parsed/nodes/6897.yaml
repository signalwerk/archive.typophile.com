    html: <p>Gerald's work inspires me. As I've said before, I'm not a typographer by any means; but when I grow up I want to be able to create work a whisper as good as Gerald's.  <br> <br>What about being inspired by the past to create work that explores the future? When I see (to my eye anyway) beautifully set text (old or otherwise), set with care and consideration, its not only a joy to read but also to look at. And it makes me want to learn as much as I can about it so that maybe, one day, I could set some text that would make someone else note that it was something special and a pleasure.  <br> <br>As little as it may acutally be used or required, my eye still doesn't go "What the?" whenever it encounters an ampersand. <br> <br>My eye did object to liver-shaped coffee tables, however. And flares...</p>
