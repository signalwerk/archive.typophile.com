  html: "<p>Hello everyone, <br> <br>I thought I'd give myself a good grounding the classics, so I'm reading up on Tschichold's work and Geoffrey Dowding's \"Finer Points\".  I was wondering: does anyone here use the ampersand in body text to improve spacing and lines, and if so, when, where and why? <br> <br>Many thanks!</p>"
