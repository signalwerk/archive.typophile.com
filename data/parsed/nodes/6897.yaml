    html: <p>It is considered improper grammar (if that matters to you) to use the ampersand in text.  Somehow this character has, at least in publishing circles, been relegated to things such as logos or, in the rare case that one does see an ampersand in text, things like "B&amp;B", where "B and B" just doesn't look right (of course, respectable editors and English professors will argue that you shouldn't be writing "B&amp;B" in the first place--it ought to be "bed and breakfast".)</p>
