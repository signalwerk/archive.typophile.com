    date_raw: 7 Oct 2004 — 9:18am
    votes: null
    html: <p>I think ... erm ... let's not forget that the ampersand was originally the "et" ligature and was used all of the time even before "type" came to be. I'm not sure I agree with the use of the phrase grammatically correct. Perhaps typographically correct would be better, but even then ... Well, the ampersand as we know it today comes in all beautiful varieties and not only in the curvy and curly variety. Perhaps more type designers, now that opentype gives us gazillion character options, should give us an "et" that is a little more transparent so we can use it once again in long settings of text.</p>
