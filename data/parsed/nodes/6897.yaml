    date: 2008-06-09T13:42:00
    date_raw: 9 Jun 2008 — 1:42pm
    votes: null
    html: "<p>I feel these rules were set in place for a reason, if not then why are they their. I live in smallish city where labor work is king, and I see so many grammatical errors in advertising and basic written communications - its like I am living in a city of preschoolers. I think this is due in part the importance education played within the lives of these people and also in part to the lack of focus people like designers and writers place on the end results of not educating people etc... The syntax for ampersand may not be as important as some grammar rules, but if we as designers do not know or follow the rules and demonstrate or educate those who are unaware, we will only perpetuate the dumb asses who somehow think they're being creative by spelling words the way they want or breaking grammar rules.. if this keeps up where will the simple rules go that define the English language? At some point my job as a graphic designer - communicating messages will become even more difficult in having to deal with the dumb-arse's who insists on his/her dumb-arse English skills. Damn it now I'm angry for no reason! Designers and writers are in a position to educate the dumb-arses and I try to do my best here... hopefully you do too! : ) peace</p>"
