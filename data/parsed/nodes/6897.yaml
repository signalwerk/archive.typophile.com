    html: <p>I'm sure Gerald will correct me if I'm wrong, but aren't the 2 ampersands in his wine glass there for spacing reasons? I.e., to make the lines fall in a fairly smooth contour while having reasonably even spacing among the words? Seems to me like that's something more than mere wanking. <br> <br>And this is perhaps a nit-picky and non-productive comment, but I wouldn't say that an ampersand is poor <i>grammar</i> so much as poor <i>usage</i>. Or at least non-standard usage. It's not the use of the word "and" that's in question in any of these instances -- it's how you write it.</p>
