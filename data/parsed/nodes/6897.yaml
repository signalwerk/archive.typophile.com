    html: "<p>I think this used to be acceptable practice a long time ago. The most recent example I know of (there must be more though) is Eric Gill's heavy use of the ampersand in his wonderful \"Essay on Typography\" - although I don't know if it was for spacing, color, or what. <br> <br>I myself use the ampersand, but very rarely in formal text, basically for things like \"cut &amp; paste\", or sometimes to group things in a complex sentence, like this: \"... for which Perrin drew, and had engraved &amp; cast his Augustaux capitals.\" <br> <br>hhp</p>"
