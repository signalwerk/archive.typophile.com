    html: <p>I think that the ampersand's use makes more sense in romance languages that still use the latin "et" for the word and. In English, "and" is spelled "a-n-d", not "e-t". <br> <br>For better and for worse, modern typesetting has changed many rules than were in play before the second world war, and the use of the ampersand is no longer common, normal, or "appropriate" for use in normal, boring body text. <br> <br>I think that Gerald's use of it is completely appropriate. A colophon, or even an entire fine-printed book, is neither normal, nor body text.</p>
