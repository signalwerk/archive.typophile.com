  - id: 48100
    user: 2172
    date: 2004-10-12T07:20:00
    date_raw: 12 Oct 2004 — 7:20am
    votes: null
    html: "<p>I wouldn't have guessed that the ampersand had common use in running English typeset text. I use the ampersand for anything I want to join into a unit, a sort of verbal/visual ligature between words. It also makes more compact headlines, making for a quicker 'hit'. Also, this technique has, in my opinion, been co-opted by companies and commerce. <br> <br>Thus, I would write: <br>\"Bed &amp; Breakfast\" <br>\"Bartles &amp; James\" <br>\"Barnes &amp; Noble\" <br>\"it's raining cats and dogs\" <br>\"I use both ampersands and words\" <br> <br>I think David Foster Wallace actually uses ampersands in some sentences to specifically imbue something with a sponsored, branded feel. <br> <br>From a practical perspective, I would never be able to convince a typical client that an ampersand is acceptable, and I don't think I could provide a convincing argument to reverse their opinion. It may not affect the texture of the page, but an unexplained ampersand in modern text will most likely jar the reader. My concerns with the ampersand are less typographic and more editorial/reader oriented.</p>"
    html_clean: "<p>I wouldn't have guessed that the ampersand had common use in running English typeset text. I use the ampersand for anything I want to join into a unit, a sort of verbal/visual ligature between words. It also makes more compact headlines, making for a quicker 'hit'. Also, this technique has, in my opinion, been co-opted by companies and commerce. <br> <br>Thus, I would write: <br>\"Bed &amp; Breakfast\" <br>\"Bartles &amp; James\" <br>\"Barnes &amp; Noble\" <br>\"it's raining cats and dogs\" <br>\"I use both ampersands and words\" <br> <br>I think David Foster Wallace actually uses ampersands in some sentences to specifically imbue something with a sponsored, branded feel. <br> <br>From a practical perspective, I would never be able to convince a typical client that an ampersand is acceptable, and I don't think I could provide a convincing argument to reverse their opinion. It may not affect the texture of the page, but an unexplained ampersand in modern text will most likely jar the reader. My concerns with the ampersand are less typographic and more editorial/reader oriented.</p>"
