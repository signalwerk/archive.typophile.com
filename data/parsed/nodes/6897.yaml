    html: <p>Fine book work my arse. Book are meant to be read. Splitting 'Five' and 'hundred copies' like this is just a barrier to understanding, and neither of the two uses of an ampersand in this dog's breakfast can be justified grammatically. Does anyone really still believe that typographic masturbation like this is fit work for a grown man? <br> <br>Back in the real world, those of us for whom legibility and ease of use is of rather more concern know that ampersands should never be used as a substitute for 'and' in the run of text (or, for that matter, headlines), except where they form part of an organisation's name (ie Marks &amp; Spencer, P&amp;O) or an accepted abbreviation (like 'b&amp;b').  <br> <br>What may have been acceptable common practice in Eric Gill's day (putting full points between initials, using 'tho' for 'though', overenthusiastic dog-worrying) isn't any more.  <br> <br>And, at the risk of offending Hrant too, I think that rewriting a sentence to make it comprehensible is always better than inserting ampersands.</p>
    html_clean: <p>Fine book work my arse. Book are meant to be read. Splitting 'Five' and 'hundred copies' like this is just a barrier to understanding, and neither of the two uses of an ampersand in this dog's breakfast can be justified grammatically. Does anyone really still believe that typographic masturbation like this is fit work for a grown man? <br> <br>Back in the real world, those of us for whom legibility and ease of use is of rather more concern know that ampersands should never be used as a substitute for 'and' in the run of text (or, for that matter, headlines), except where they form part of an organisation's name (ie Marks &amp; Spencer, P&amp;O) or an accepted abbreviation (like 'b&amp;b').  <br> <br>What may have been acceptable common practice in Eric Gill's day (putting full points between initials, using 'tho' for 'though', overenthusiastic dog-worrying) isn't any more.  <br> <br>And, at the risk of offending Hrant too, I think that rewriting a sentence to make it comprehensible is always better than inserting ampersands.</p>
