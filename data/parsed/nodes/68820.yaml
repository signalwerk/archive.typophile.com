    html: |-
      <p>Wow, what happened to my Umlaut! Hehe, anyway…</p>
      <p>Esteban,<br>
      I think the pc-de font is way too individuated (don’t know if this is the right word) to be paired with your ambigram, it distracts from your initials and the other way round. The eye is struggling and it takes way too long to get what is actually written there.</p>
      <p>I’d rather look for a font more suitable for text since otherwise you’d have to bring in a third typeface for letters etc. Did you think about a font for letters?</p>
      <p>I’m struggling with the ‘s’ in your ambigram. I still keep reading it as ’ee’, with one ’e’ flipped over. Maybe it’ll work if you smoothen the broken forms? Right now, they look wrong in the ‘s’.<br>
      That said, the flipped e sits too high (optically), I’d move it down a bit to get a more balanced look.<br>
      You could also try to open the counters by cutting the diagonals BEFORE they hit the curve instead of lengthening them, I think the ‘s’ and the whole mark would benefit from that.</p>
      <p>And I don’t think that ‘framing’ your ambigram with your name is a good idea (unless you make it an ambigram, too, but I guess this would be sth of a reach). Did you try to put your name beneath it? Or next to it? Single-line? Two-line? Try every composition you can think of and boot out what doesn’t work. It’s the only way to find out.</p>
      <p>Cheers,</p>
      <p>Jörg</p>
