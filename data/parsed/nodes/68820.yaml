      <p>Thanks for the input Jörg, I agree that framing the mark was negative for the readability. I liked that it looked like one big square, one visual unit, but I wouldn't even bother to read my own name, I just knew it was there.</p>
      <p>In terms of modifying the mark, I've made some quick unrefined changes that I would like you to look at. I agree to an extent about the "s" sitting too high optically. I think I will be able to lower it and have the 2 forms staggered a little bit. I don't think I like the idea of ending the bowl diagonal before the curve, I think that for the "s" it is crucial to have that bit extend in order to imply a cursive letterform. Anyways take a look and let me know what you think, I am doing some type studies for the rest of my name. For letters I use Helvetica condensed a lot, i use it on my letterhead and stationary, I like it because of the endless options. However, I don't think I will use it for my logo, it seems to plain for me, tooo neutral.</p>
      <p>Esteban</p>
      <p><img src="/sites/default/files/old-images/ES_MODIFIED_6380.png"></p>
