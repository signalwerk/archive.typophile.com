  html: "<p>Hi Everyone, I've been trying to match my logo with a font for a while now, figured I'd ask here for suggestions seeing as there are so many pro's. I have a simple blackletter ambigram logo, picture a Lucida Blackletter connected to itself flipped, kinda like this: eǝ, to make the initials es with a cursive s. My problem is pairing this symbol with a good font for my name and other info on my business card and potentially my resume. Until now I've been using Helvetica 67 condensed medium, which is just to bland for me to keep using. Can anyone give me some pointers or suggestions on pairing fonts with blackletters?</p>"
