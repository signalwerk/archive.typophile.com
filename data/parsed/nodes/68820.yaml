    html: |-
      <p>Hi,</p>
      <p>generally speaking, I think there are these 2 ways to go:</p>
      <p>1: you try to find something very close to your logo type/lettering</p>
      <p>or</p>
      <p>2: you make sure the two typefaces are easily distinguished from each other so<br>
      a) the mix won’t be mistaken as unintentional and<br>
      b) you don’t risk to go too busy with your logo.</p>
      <p>In your case only no. 2 makes sense I guess, so I would go for something clean and straightforward. I once used FF DIN with a bold blackletter and it turned out to match quite well.<br>
      Meta can also look good with blackletter, although I’d rather go for FF DIN since it has almost no (visible) contrast (which I think works better with a vertically stressed blackletter)</p>
      <p>That said, an ambigram consisting of two letters (if i got you right) is much more forgiving in terms of pairing than longer blackletter text.</p>
      <p>Cheers,</p>
      <p>Jörg</p>
