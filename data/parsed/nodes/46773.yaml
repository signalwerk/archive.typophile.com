    html: |-
      <p>It's funny, the lowercase r immediately stood out for me, too, but I wasn't going to mention it until I saw the above comment! I agree, it does look overly heavy.</p>
      <p>I really dig the serifs along the baseline. They look like little cartoony feet on which the letters walk. Very cool.</p>
      <p>The lowercase c looks too symmetric to me. I feel it could benefit if the bottom part didn't flare upwards so much. I don't think the top part should be any heavier. Sorry, I'm not sure of the correct terms for these part of the c, but I hope that makes sense.</p>
      <p>The little serif on the top of the lowercase g is barely hanging on! The rest of the letter is beautiful though.</p>
      <p>My favorite letters in this face (in no particular order) are g m x, and h</p>
      <p>Looking great. Keep it up!</p>
