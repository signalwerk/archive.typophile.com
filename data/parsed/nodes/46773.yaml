    <p>Trying to make a quirky text face with the curves of Fontin and Feijoa, a bit of the structure of Warnock and the proportions of...well, I came up with those mostly on my own. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sequoia_4015.png"></div><p></p>
    <p>I've attached a pdf for anyone who wants a closer look.</p>
    <p>(newb) Now I just need to get it into some font software. Is it even possible to copy and paste to fontographer from illustrator cs? (/newb)</p>
    <p>Ben Townsend Hamm</p>
