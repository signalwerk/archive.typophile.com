      <p>not sure about fontographer, but you can import eps files into fontlab.</p>
      <p>this is looking really good!<br>
      the only comment i have so far is to try dropping the dots of 'i' ang 'j' slightly lower.<br>
      at the moment it looks like they're alligned to the ascenders.<br>
      also the r looks slightly heavy, however that might just be the screen (i haven't printed a proof yet). Also not too sure about that tail on the 'x'.</p>
      <p>great job for the 1st type though, mine is still in the process of incubation.<br>
      and good on you for trying to do a text face, it's a challenging task.</p>
      <p>Victor</p>
