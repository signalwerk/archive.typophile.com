      <p>Thanks for taking a look, Victor. You're definitely right about the i,and the j. I'm self-taught in regards to type design, I think I picked up aligning the dots to the ascenders from looking at types with much taller x-heights. </p>
      <p>That r does look thick, but I'm not sure if the stem is too thick, or if that join needs to be toyed with. I'll see if I can't figure out something for that x.</p>
      <p>Ben</p>
