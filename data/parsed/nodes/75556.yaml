      <p>Looking good! Though I think the /a/ still looks a bit geometric and wide. Your arched letters /n/m/h/u/ might need to be changed to look more similar to your rounded ones. There is  a hard edge on the right of some of them as well.</p>
      <p>Your curly brace should be monoline. The numerals also have a very different art deco feel from the rest of the font, and are too geometric.</p>
