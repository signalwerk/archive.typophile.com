      <p>Ok, I know this has been a stupidly long time coming but I've only just had chance to work on this again due to A-Level and University preparations at school.</p>
      <p>No idea if you guys can remember this thread but I've reworked all the curves to fit my non-geometric characters.</p>
      <p>I think I'm verging on completion of this, just wanted to know if there's any glaring errors I haven't picked up on.</p>
      <p>Elliott</p>
