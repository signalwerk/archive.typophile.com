    <p>I have absolutely no prior knowledge of typography or type-design, but recently decided to design a typeface of my own. </p>
    <p>I know it's not exactly the most complex of designs but I like to think it's relatively original.</p>
    <p>I'm not looking for comments on spacing as this hasn't left illustrator yet, just wondered what the type gurus out there thought.</p>
    <p>Any name suggestions would also be cool aswell,</p>
    <p>Cheers, Elliott</p>
