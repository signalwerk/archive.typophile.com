      <p>@Dunwich - thanks, I actually started this design with a regular/bold wieght but then decided to convert it to paths after the completion of the lower case characters as I felt it improved work flow and the overall look of the font. I also had trouble with the intersects as I felt they were to heavy on most of the characters</p><div class="imageWrap"><img src="http://typophile.com/files/next_5651.jpg"></div><p></p>
      <p>@typeterror - I can't honestly say why I didn't carry them through, most probably because I rushed the uppercase slightly this morning (lowercase was my focus). I think I shall rectify this later as it would look better with consistent bowls</p>
      <p>@nick - it definately sits better, I just had a dying need to try and keep the descender of the f to a minimum; amateur i guess</p>
      <p>Elliott</p>
