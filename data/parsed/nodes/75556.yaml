    html: <p>Nick is right, this is a great first font. But there’s a lot going in the design that only works because the strokes are so light—which I’m sure is intentional. I think you will learn a lot by designing regular and black weights just to see what has to change to make the design adapt to proportions of 1:7 and 1:3. Then make then all work together. And if you still want to keep designing type at that point, you’re perfect for the job.</p>
