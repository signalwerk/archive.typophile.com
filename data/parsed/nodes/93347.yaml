    html: |-
      <p>New master. When setting it up, tell InDesign to base it on your original master, and then delete the header and make any other changes you wish to it. That way any style changes you make to your original master (adjusting the margin, moving the page numbers, or whatever) will automatically be reflected in the master used for the chapter titles.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/master_5485.jpg"></div><p></p>
