      <p>Create a book file with the individual chapters as separate files.</p>
      <p><a href="http://help.adobe.com/en_US/indesign/cs/using/WSa285fff53dea4f8617383751001ea8cb3f-6ccaa.html#WSa285fff53dea4f8617383751001ea8cb3f-6cbda" title="http://help.adobe.com/en_US/indesign/cs/using/WSa285fff53dea4f8617383751001ea8cb3f-6ccaa.html#WSa285fff53dea4f8617383751001ea8cb3f-6cbda">http://help.adobe.com/en_US/indesign/cs/using/WSa285fff53dea4f8617383751...</a></p>
      <p>Set up each file with a master page with a text variable running head set to the chapter title style sheet (or to the document name if you prefer) and a master page without a running head for the first page.</p>
      <p>When it synchronises it will keep the same master for the first page and default to the other for the remainder of the chapter.</p>
