      <blockquote><p>you can just delete the text frame on the page where you want to add an image</p></blockquote>
      <p>Or, even simpler, put the image frame on top of the text frame (with appropriate Text Wrap settings).<br>
      Doing this would keep the text reflowing without the need to recreate the text frame in case you need to move the image to a different page.</p>
