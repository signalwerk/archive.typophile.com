      <p>Thanks for your comments - I will take them all into consideration. I am preparing to set a new section (I imagine some time later today) and will experiment with the Masters-approach.</p>
      <p>I will try to explain better the point I raised in my previous post.</p>
      <p>Imagine I have a master spread of two pages. The master text boxes within these masters are set to allow for a greater inside margin than outside margin to allow for the curve of the page when the book is read. I then set the text. After the text is set, I find I need to place a new page (for instance, of photos or diagrams) half way through the document. I insert the page, and find that all of the text frames <em>after</em> this point are reversed in their layout, in that they have a greater outside margin than inside margin. InDesign correctly applies the master (I can see that the margins are still set up correctly), but for some reason the text boxes have delinked from the master and now need to be manually repositioned.</p>
      <p>Does this have a simple workaround? Again, this is due to my inexperience with InDesign, so I suspect the answer is simple!</p>
