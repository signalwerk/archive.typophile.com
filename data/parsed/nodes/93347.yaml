    <p>Hello all,</p>
    <p>I'm trying to figure out how to manage this in InDesign (CS4).</p>
    <p>I am currently setting a book. I want the book to have a running heading of the current chapter name. However, I do not want a heading to appear when the Chapter Name style is the first occurrence on the page.</p>
    <p>For example, you can see this screenshot:<br>
    <a href="http://typophile.com/files/Screen%20Shot%202012-05-25%20at%205.21.54%20PM.png" title="http://typophile.com/files/Screen%20Shot%202012-05-25%20at%205.21.54%20PM.png">http://typophile.com/files/Screen%20Shot%202012-05-25%20at%205.21.54%20P...</a> (no idea how to make the img tag work)</p>
    <p>The heading looks cramped when the Chapter Name style appears at the top of the page.</p>
    <p>Does anyone have any advice on how I can achieve this?</p>
    <p>Thanks.</p>
