      <p>There's a simple solution. You can't just add one page, because any odd number of pages added or deleted will make this happen.</p>
      <p>But you can just delete the text frame on the page where you want to add an image — and then the text will just start reflowing from the page after that, and not change the layout.</p>
    html_clean: |-
