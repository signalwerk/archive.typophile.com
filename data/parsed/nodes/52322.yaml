    <p></p><div class="imageWrap"><img src="http://typophile.com/files/geogrotesque_press_4136.jpg"></div><p></p>
    <p>Emtype foundry is proud to announce a new font family, Geogrotesque is a semi modular with a subtle rounded finish type face. All the characters are based in the same formal principle with its corresponding optical adjustments in order to adapt the system to an alphabet for texts.<br>
    Although the type family has a geometric or "technological" construction, the rounded finish provides it a warm appearance, making the typefaces nicer and nearby. Geogrotesque has been conceived to be used as a display typeface in publications or intermediate length texts, most of all the Thin and Ultralight weights which were meant to be used in big sizes.<br>
    The type family consists of 7 weights: Thin, Ultralight, Light, Regular, Medium, Semibold and Bold and it’s available in Open Type format.</p>
    <p>More info at <a href="http://www.emtype.net/geogrotesque_01.php" title="http://www.emtype.net/geogrotesque_01.php">http://www.emtype.net/geogrotesque_01.php</a></p>
    <p>Available online at <a class="freelinking external" href="http://www.emtype.net" rel="nofollow">Emtype Foundry</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/emtype/" rel="nofollow">Myfonts</a> and <a class="freelinking external" href="http://www.fontshop.com/fonts/foundry/emtype/" rel="nofollow">FontShop</a></p>
