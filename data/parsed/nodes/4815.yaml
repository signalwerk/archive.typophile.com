  html: <p>Hello all, this is my first post here. I stumbled upon this site today and I was quite impressed. I havent had a chance to totaly look at everything yet but It was really interesting to the progression of some of the identities.  <br> <br>Anyways I am a high school student, my name is Tom and I am from Toronto, Canada. I am looking forward to my experience here :D <br> <br>A few friends of my parents who run small business and have a tight budget have given me the opportunity to do some small design jobs for them. <br> <br>I just got one to design a logo for a company that sells a variety of different UPS units to deliver uninterupted power protection incase the power goes out. they are called "UPS For Less" <br> <br>Here are my first few ideas, I am having a bit of trouble finding a type face to suit this and I am still working on the icon, which is a sheild combined with a power symbol. Any help would be much appretiated. <br> <br><img src="http://www.typophile.com/forums/messages/29/36129.jpg" alt="Samples"> <br> <br>Thanks!</p>
  html_clean: <p>Hello all, this is my first post here. I stumbled upon this site today and I was quite impressed. I havent had a chance to totaly look at everything yet but It was really interesting to the progression of some of the identities.  <br> <br>Anyways I am a high school student, my name is Tom and I am from Toronto, Canada. I am looking forward to my experience here :D <br> <br>A few friends of my parents who run small business and have a tight budget have given me the opportunity to do some small design jobs for them. <br> <br>I just got one to design a logo for a company that sells a variety of different UPS units to deliver uninterupted power protection incase the power goes out. they are called "UPS For Less" <br> <br>Here are my first few ideas, I am having a bit of trouble finding a type face to suit this and I am still working on the icon, which is a sheild combined with a power symbol. Any help would be much appretiated. <br> <br><img src="http://www.typophile.com/forums/messages/29/36129.jpg" alt="Samples"> <br> <br>Thanks!</p>
