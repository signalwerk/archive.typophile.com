      <p>George, 1200 *is* actually pretty good. In fact if you go too high you risk being unrealistic in terms of what font users/readers will end up seeing.</p>
      <p>&gt; If you can do 2400 then do it both directions.</p>
      <p>Well, one is the direction of the physical travel mechanism, the other is the electrostatic resolution of a single imaged line. So if a manufacturer gets a sufficiently better deal on acquiring one of the two technologies versus the other, asymmetrical resolution is a way to help the price point of the product while appearing to give higher resolution. Scanners have this issue too (and then some).</p>
      <p>hhp</p>
