    <p>This has been discussed ad infinitum before though not recently:<br>
    Any recommendations for a laser printer that outputs 2400 dpi, has Adobe PS and costs under $1K? Xante has stopped making the 4G, and I couldn't have afforded it new anyway. I have located a used 3G, but I would rather  get something new or newer that I can afford. I just retired from teaching and have to count my pennies now. Or is a used 3G a good choice?</p>
    <p>George<br>
    I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
