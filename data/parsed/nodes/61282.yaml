      <p>An aging Xante might not be a great idea. Xante parts can be quite pricey. </p>
      <p>Ricoh printers are a good option when the cost of the printer is a factor. I have not used Ricoh’s 2400 DPI models, but the 1200 DPI PS3 Ricoh printers are just as good as Xerox printers for less money. The downside is that Ricoh printers use better toner (it’s much darker and applies are more even tone) than most other printers, but that means that the cartridges cost more and from what I’ve heard off-brand toners do not work.</p>
