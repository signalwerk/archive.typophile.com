    html: <p>"Barry Lyndon" could be based in a typeface, with a swash variant and perhaps lowercase. <br>Here is a sample from the Soundtrack CD (bad printed and small reproduction of a the LP record I guess). I see the long "R" in BARRY a little bit different than the swash one in the credits, that could be a modified, and the same with the "A", or an alternate for this one. <br>It also looks it could have lowercase from the same family, the last sample are details from a 1976 not really well printed french version of the poster I have, it seems it could be the same lowercase typeface than the american ("a" "d")... Or maybe they just mixed lower and upper... <br> <br>I haven't found it obviously, this could be a typeface, an old one, or maybe the whole thing was just done for the movie, like in the opening credits. <br>I don't know Roger, hope it helps, I am intrigued too. <br> <br>Could not be more agree with Mark's opinion about the movie and how to see it, the light is special. <br> <br><img src="http://www.typophile.com/forums/messages/83/32781.gif" alt="Barry"> <br> <br>** BTW an interesting writing about Kubrick <a href="http://www.typophile.com/forums/messages/30/32151.html?1080685006" target="_top">Typophile</a>.</p>
