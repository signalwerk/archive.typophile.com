    html: <p><a href="http://www.myfonts.com/fonts/bitstream/itc-souvenir/light/testdrive.html?s=BARRY%a0LYNDON&amp;p=48" target="_blank">Souvenir</a> is also similar, especially the B. The style is a kind of blending of Souvenir, Bookman (with swashes!), and Desdemona. I’m not sure why Kubrick chose it for a movie set in the 18th century. It evokes the 1970s more than anything else. <br><br>(In spite of the strange choice for the titles, this is still one of my favorite ﬁlms. It’s absolutely beautiful, but you need to watch it on a big screen—and not on a&nbsp;tv.)</p>
