    html: <p>Since the movie was done in 1975, I checked the Solotype Catalog and scanned some photo-type books, and I’d say the letterforms were inspired by some Victorian/Art Nouveau-era lettering (even though I think that’s not the era portrayed in the ﬁlm), but didn’t see anything that made me even want to check it more closely for a match. I think it’s very likely that it is custom lettering&nbsp;too.</p>
