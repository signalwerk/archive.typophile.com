  - id: 30702
    user: 1043
    date: 2004-04-06T08:13:00
    date_raw: 6.Apr.2004 8.13am
    votes: null
    html: <p>I took a look at the opening credits in Barry Lyndon (as a Kubrick fan I have the DVD, of course) and they appear to have been done by hand. The letter shapes are consistent overall, but vary in their details and proportions. They are also better drawn than the movie poster version (as shown in Roger's scan above). The same style is used for the intertitles (titles between sections), but the end credits are done in Cheltenham Oldstyle.</p>
    html_clean: <p>I took a look at the opening credits in Barry Lyndon (as a Kubrick fan I have the DVD, of course) and they appear to have been done by hand. The letter shapes are consistent overall, but vary in their details and proportions. They are also better drawn than the movie poster version (as shown in Roger's scan above). The same style is used for the intertitles (titles between sections), but the end credits are done in Cheltenham Oldstyle.</p>
