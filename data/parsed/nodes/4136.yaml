    html: <p>I took a look at the opening credits in Barry Lyndon (as a Kubrick fan I have the <span class="caps">DVD</span>, of course) and they appear to have been done by hand. The letter shapes are consistent overall, but vary in their details and proportions. They are also better drawn than the movie poster version (as shown in Roger’s scan above). The same style is used for the intertitles (titles between sections), but the end credits are done in Cheltenham&nbsp;Oldstyle.</p>
