    html: <p>I think the GW for the sports logo was a deliberate separation from the Universty. The GW will appear on uniforms and hopefully on TV, so It has to be simple visible. I’m not in love with the capital dome in the background but I understand what they were trying to achieve. Just think about it, how closely do you want a sports team to be associated with the learning center. Pick up the paper almost any day and you will scandles involving sports.</p>
