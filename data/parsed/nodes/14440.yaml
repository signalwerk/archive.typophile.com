      <p>Here I go picking up a very old thread, but it would be interesting to hear more opinions on this. I have looked at a whole lot of fonts. It seems that there are three different approaches here, well actually more, but if we divide them in three approaches, they could look like this:</p>
      <p>1. Underline = underscore = same positions and width in the whole family. Light, bold, regular – they have the same underscore/line value. </p>
      <p>2. Underline = underscore = same positions and width, but they both change together, depending on weight. Is it light, bold or regular; then the underscore and underline also shows it. It "follows" the other characters, so to speak.</p>
      <p>3. All the others: These ones don’t really follow any logic. Underline have one position and one weight and is placed below the underscore – or in the middle of underscore – or alignes on the top of the unnderscore. The underscore could change in weight, but not the underline – it always stays the same.</p>
      <p>What could be the ultimate solution to this? I think I prefer alternative two, but maybe there is some crucial information about this today?</p>
