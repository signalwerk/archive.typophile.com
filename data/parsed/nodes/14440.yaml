    html: |-
      <p>Here's my approach: The underscore glyph is designed to work when it replaces a space in word_strings_like_this. The underscore's thickness can matches the horizonal stroke in glyphs like "f" and "t". (You want it to look good, so don't match a really fat font with a really fat underscore if it's goofy.)<br>
      The underline should similarly work and look good. I make all underline settings in a font family the same, quite thin (30 units), and position them approximately in the middle of the descender depth. Since underline is either off or on, you want to make sure it looks good running through a word like "jugpoppy" with its many flavours of descenders.<br>
      Mes deux sous.</p>
    html_clean: |-
