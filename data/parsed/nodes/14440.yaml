    html: "<p>An underscore is a distinct character with special meanings in various scripting/programming/markup languages, not the least of which is HTML (principally in frame and window targeting, in that instance). In those situations (i.e.: writing code), at least, it would be prudent to have an underscore character that can be easily recognized as such even when underlined, and not be mistaken for an underlined space.</p>"
