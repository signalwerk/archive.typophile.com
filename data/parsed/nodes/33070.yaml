    <p>Over the last little while I've been developing a new knid of brush that has some very groovy dynamic qualities...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/h_x06_6175.jpg"></div><p></p>
    <p>...only problem is that I have yet to gain command of my new discovery, lol! </p>
    <p>The brush has the ability to lay down a 3d-ish stroke that has some pretty amazing tonal and textural qualities. I barely have any idea on how much ink to load for a constant stroke. As you can see I have a long way to go, yeah.</p>
    <p>Hope you don't mind me posting this most crude prototype. I'll post my developements as I get a grip of this thing.</p>
    <p>__________<br>
    Hiro</p>
