    html: <p>Is it <a class="freelinking-external" href="http://new.myfonts.com/fonts/fontmesa/lonestar/">Lonestar</a> or <a class="freelinking-external" href="http://new.myfonts.com/fonts/baselinefonts/58-rodeo/">58 Rodeo</a>?</p>
