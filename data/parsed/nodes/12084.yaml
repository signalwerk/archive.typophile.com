    html: |-
      <p>I’m glad you touch that subject. It crossed my mind while I was implementing the Greek.<br>
      Actually it would be very interesting and challenging to add a right-to-left script to <a href="wiki/adhesiontext" class="wiki">adhesiontext</a>.</p>
      <p>I believe that the way <a href="wiki/adhesiontext" class="wiki">adhesiontext</a> is setup allows me to add any Latin language, like German or Italian for example (and maybe even a central-European, like Czech), within a couple of hours.<br>
      A non-Latin LTR script would need a bit more time, but surely not more than a day’s work.<br>
      A RTL script is a bit more tricky, but still doable. I can’t predict how long that would take.</p>
      <p>Nevertheless, if you can provide me two Arabic word-lists (one in Unicode and the other in Arabic-Windows-1256) and a string of the characters (in Unicode) to be included in the “Insert characters” palette, I can try to prepare an Arabic version of <a href="wiki/adhesiontext" class="wiki">adhesiontext</a> for you to test.</p>
      <p>As for the Fontlab window, I think that Brook was trying to do something like that with Python.</p>
