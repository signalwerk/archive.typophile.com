esign original,� says Lukas Schneider. The design of a single font requires an immense amount of work. �It can take years just to develop a good, complete character set,� explains Schneider. <br> <br><a href="http://www.typeoff.de" target="_blank" class="link-external">http://www.typeoff.de</a></p>'
