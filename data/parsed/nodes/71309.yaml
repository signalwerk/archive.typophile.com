    html: |-
      <p>Nancy — Call in advance to make an appointment. Hours are currently limited. </p>
      <p>I’m sure you can get access to the Mergenthaler drawings for research, but they are not on display or generally available to the public. </p>
      <p>There are literally tens of thousands of drawings, and searching all of them for female employees will be tedious and time-consuming, if that becomes your goal. (Some of the signatures are not so easy to decipher, nor to tell gender.)</p>
      <p>But here, for example, you can see that Dorothy Arbogast did the drawing for the 12-pt Caledonia italic p on July 22, 1937. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cale-p-ital_wkgdrwg_4233.jpg"></div><p></p>
