  html: <p>Does anyone know of any women type designers prior to Bertha Goudy 1869-1935 or Elizabeth Friedlander 1903-1984 or can you point me to a source? If you don't know specific names do you have any literature that mentions women designing type? (I know they were compositors and sometimes printers and type finishers, I am looking for the earliest woman who designed type). Thanks.</p>
  html_clean: <p>Does anyone know of any women type designers prior to Bertha Goudy 1869-1935 or Elizabeth Friedlander 1903-1984 or can you point me to a source? If you don't know specific names do you have any literature that mentions women designing type? (I know they were compositors and sometimes printers and type finishers, I am looking for the earliest woman who designed type). Thanks.</p>
