      <p><a class="freelinking external" href="http://www.archive.org/stream/womeninprintingt00macduoft#page/n5/mode/2up" rel="nofollow">Women in the printing trades, a sociological study</a></p>
      <p>I don't know that this book includes anything on design specifically, but it does have a section about <a class="freelinking external" href="http://www.archive.org/stream/womeninprintingt00macduoft#page/14/mode/2up" rel="nofollow">girls working in typefoundries</a> (and I do mean <em>girls</em> here), and there are various charts describing early census records of males and females employed in such fields as "type cutting and founding," which might include designing. It also provides a nice perspective on gender politics in the industry around the turn of the century.</p>
