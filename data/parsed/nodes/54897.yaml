    <p><a href="http://s118.photobucket.com/albums/o96/desAyn/?action=view&amp;current=ABgDCC.jpg" target="_blank" rel="nofollow"><img src="http://i118.photobucket.com/albums/o96/desAyn/ABgDCC.jpg" border="0" alt="Photobucket"></a></p>
    <p>Word mark, I am designing to reflect my own identity. </p>
    <p>Word ABgD (pronounced Abjad) literally means letters A B G and D representing the original order of Phoenician alphabets. The closest example today can be seen in Greek (Alpha, Beta, Gama, Delta). Abjad is a type of writing system in which each symbol stands for a consonant; the reader must supply the appropriate vowel. This is the very philosophy that I practice under brand name ABgD - I provide consonants and the client provides the vowel. The contribution of client is important as it gives meaning to my work. </p>
    <p>All known abjads belong to the Semitic family of scripts. These scripts are thought to derive from the Proto-Sinaitic alphabet (dated to about 1500 BC) which is thought to derive from Egyptian hieroglyphs. The abjad was significantly simpler than the earlier hieroglyphs. The number of distinct glyphs was reduced tremendously, at the cost of increased ambiguity.</p>
    <p>The first abjad to gain widespread usage was the Phoenician abjad. Unlike other contemporary scripts, such as Cuneiform and Egyptian hieroglyphs, the Phoenician script consisted of only about two dozen symbols. This made the script easy to learn, and Phoenician seafaring merchants took the script wherever they went. Phoenician gave way to a number of new writing systems, including the Greek alphabet, the first "true" alphabet, and Aramaic, a widely used abjad. Greek evolved into the modern western alphabets, such as Latin and Cyrillic, while Aramaic became the ancestor of many modern abjads and abugidas of Asia.</p>
    <p>Aramaic spread across Asia, reaching as far as India and becoming Brahmi, the ancestral abugida to most modern Indian and Southeast Asian scripts. In the Middle East, Aramaic gave rise to the Hebrew and Nabataean abjads, which retained many of the Aramaic letter forms. The Syriac script was a cursive variation of Aramaic. It is unclear whether the Arabic abjad was derived from Nabatean or Syriac.</p>
    <p>I hope you like the concept and design. I am open to ctritique - to learn and to proceed.</p>
