    <p>What should you do about these things:</p>
    <p>1) Is it legal and within my rights to send fonts to the printer when the job goes to press?<br>
    2) If a client sends you fonts on a disk for a job that a previous studio created is it legal to use the fonts?<br>
    3a) If a designer buys a font to use for a particular client does that client have the right to use the font?<br>
    3B) If a designer buys a font to use for a particular client does the designer have the right to use the font for a different client?<br>
    4) How do most design studios manage their font licenses?</p>
