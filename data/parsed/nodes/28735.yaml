      <p>Hi. Ms. Wardle here. Mr. Village has answered as I would have done had I seen this thread earlier.</p>
      <p>The first line of action is, as Village has stated, to read the EULA for the foundry. You might think it dampens your creativity, but it saves you headaches -- should you choose to be above board -- in the end.</p>
      <p>Very few EULAs disallow turning the type to outlines. At least those which I've read and am familiar with. </p>
      <p><em>1) Is it legal and within my rights to send fonts to the printer when the job goes to press?</em></p>
      <p>Very few foundries allow for this. Check the EULA for all foundries.</p>
      <p><em>2) If a client sends you fonts on a disk for a job that a previous studio created is it legal to use the fonts?</em></p>
      <p>I'd be willing to bet that 9.9 out of 10 times the company has not licensed the fonts to allow for distribution to other daughter companies. You need to check with the client. If they stare back at you with glazed over eyes proceed to the phone and call the foundries necessary and properly license the fonts to protect yourself. Foundries are watching who uses their fonts.</p>
      <p><em>3a) If a designer buys a font to use for a particular client does that client have the right to use the font?</em></p>
      <p>Short answer, no. Long answer, if you licensed a font to use on a client's project the best thing you could do is have the client also license the font so they can use it if need be. There are some foundries which have EULAs that allow for transferring of the license. (Transferring means you would have to give the clients the font, alert the foundry to the new address and user, and remove it from your computer. But you might know that.)</p>
      <p><em>3B) If a designer buys a font to use for a particular client does the designer have the right to use the font for a different client?</em></p>
      <p>Yes. The license is in the designer's name with the designer's location and can be used until you are sick of the font. </p>
      <p><em>4) How do most design studios manage their font licenses?</em></p>
      <p>I manage mine with patience and a huge paper trail. If you really want to make sure you are kosher on all counts you could call the foundries from who you have fonts and double-check to make sure you are legal. If not I'm sure they'd be more than happy to work that out with you over the phone.</p>
