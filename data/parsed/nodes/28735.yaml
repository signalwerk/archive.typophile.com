      <p>1) I can't imagine a graphic designer anywhere would abide by a license that would not allow outlining fonts as vector art when the work product is sent to the printer. </p>
      <p>4) That has been my experience as well. Most design firms have no idea where their fonts came from. </p>
      <p>So, does anyone out there work for a design firm that ethically, legally manages their fonts? I'd sure like to hear about how they went about it. They must have had to do a review of what they had and make some kind of new policy. I have fonts that were purchased, sent to me by clients, etc. Most are not on an original disk and therefore do not have the original license. Some do, some don't have the license in the same folder as the font. What do you do about that? Burn it to the ground and start over? Re-buy them all? What do you do about fonts that were purchased from long defunct retailers like Eyewire if you can't find the license you must have received when you made the purchase?</p>
