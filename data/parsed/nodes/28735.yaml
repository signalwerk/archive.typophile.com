    html: |-
      <p>Goldarn EULAs! </p>
      <p>Even if you do call the foundry, you have to know when, and from whom, you made the purchase...different sources offer different terms, and the terms of some EULAs have been altered over the years. Which version was in force when you made your purchase? Did the agreement you made allow for after the fact changes to the agreement?</p>
      <p>A weird example:<br>
      If you buy FB Californian from Font Bureau, you have to pay extra to make a PDF with it, but if you picked up the "Greetings 2000" CD (Microsoft, with a "Hallmark connections" label) a few years ago for 20 or 30 bucks, you own a TT version of FB Californian that has its font embedding settings set to "editable embedding"!  FB presumably knew what it was doing when it set those bits. What _are_ you allowed to do with this version? </p>
      <p>So the moral is, I guess, try to keep track of these things as you acquire fonts.</p>
