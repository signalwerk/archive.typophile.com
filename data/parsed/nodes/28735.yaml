      <p>Doubtless Ms Wardle will be along shortly to address this series of questions; she is expert in this matter.</p>
      <p>The answer to all questions is: check the EULA for the typeface(s) in question. Foundries' EULAs are a very mixed bag, and each foundry dis/allows different things.</p>
      <p>To answer each question a little bit less globally...</p>
      <p>1) Check the EULA. Some foundries allow this. Some do not. Some will allow outlining of fonts to vector art, some will not. Some will allow embedding in PDF artwork, some will not...</p>
      <p>2) Check with the client and/or the foundry. The client may have arranged a license which allows them to sub-license the fonts to their vendors for specific uses or projects. (These sub-licenses are rarely made clear to the vendors.)</p>
      <p>3a) Check the EULA. Most licensing arrangements will be "site-specific" or "company-specific". Most foundries will ask either that the client licenses the typeface(s) separately, or if the designer wishes to send the typeface(s) to her client, that the designer has licensed the fonts in such a way that all end users are covered.</p>
      <p>3B) Check the EULA. However, it is pretty safe to say that if a designer licenses a retail typeface, the use of that typeface is not restricted to specific clients of projects, and is will not expire. If the typeface is a custom or bespoke creation, there will almost certainly be stipulations about use.</p>
      <p>4) This is a question for the ages, which has vexed man since the time of the Roman Empire. In my personal experience, (most) studios, regardless of size or budget, buy the smallest possible licensing for a typeface, and never think about it again. They proceed to include it in artwork releases to service bureaux, and will send it away to clients without a second thought. Most designers ignore EULAs, even though they have agreed to them in the course of a license purchase.</p>
