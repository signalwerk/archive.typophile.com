      <p>&gt;Perhaps Simon does</p>
      <p>No, but I'd start with Monotype UK - they've worked on font auditing solutions for many years.</p>
      <p>IP management solutions in general are in the dark ages - I have numerous licensed photos but I have no idea what the industry standard software for managing digital images is - where licensing terms are even more complex than fonts. </p>
      <p>I recall Laurence Penney talking about the problem with respect to map makers who have to use all kinds of IP in the maps they produce. He went to a conference on the subject and posted the parallels to the font world.</p>
