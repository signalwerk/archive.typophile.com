    <p>I'd like to announce the release of Urge Text, a modern serif with a contemporary twist. Available now, with a special offer on families throughout October from <a class="freelinking external" href="http://www.myfonts.com/fonts/schizotype/urge-text/" rel="nofollow">MyFonts</a>, <a class="freelinking external" href="http://www.fontspring.com/fonts/schizotype/urge-text" rel="nofollow">Fontspring</a> and <a class="freelinking external" href="http://www.fontbros.com/families/urge-text" rel="nofollow">FontBros</a>.<br>
