  html: |-
    <p>I'm putting together an OpenType font with a lot of glyphs. Extended Latin, Small Caps, OS and Proportional Figures. I have the class kerning worked out to my satisfaction and my VFB file has 1,061 pairs. </p>
    <p>After I generate the OTF and open that back up in FL, the kerning pairs have ballooned to 22,445. And I see that several of my kerning classes have disappeared.</p>
    <p>Is this typical? I don't see anywhere in the options where I asked FL to expand or flatten the kerning.</p>
    <p>What is happening to my carefully organized classes?</p>
