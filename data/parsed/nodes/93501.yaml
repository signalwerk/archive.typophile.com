    html: |-
      <p>FontLab Studio 5.1 up to 5.1.2 build 4447 has a bug: it expands class kerning when opening an OpenType font. This problem has been fixed in build 4549:<br>
      <a href="http://forum.fontlab.com/fontlab-studio/fontlab-studio-5-1-2-pre-release-build-4549-for-mac-os-x/" title="http://forum.fontlab.com/fontlab-studio/fontlab-studio-5-1-2-pre-release-build-4549-for-mac-os-x/">http://forum.fontlab.com/fontlab-studio/fontlab-studio-5-1-2-pre-release...</a></p>
      <p>However, build 4549 has other problems of its own, so I'd recommend KEEPING your current FontLab Studio version installed (as described in step 2 of the installation instructions in the article linked above). Then, install build 4549, run it, open the OTF, save as VFB, and then continue working in your previously installed build.</p>
