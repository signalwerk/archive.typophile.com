  html: |-
    <p>I'm looking for some nice font suggestions for a book that has avant-garde texts ranging from poetry and  parts of philosophical novels to unclassifiable combinations of text and pictures. The book will also have pages showing pictures from Kurt Schwitters collages and actual pictures of his books (poems).</p>
    <p>Not sure if i should use a serif font or not...all suggestions more than welcome</p>
