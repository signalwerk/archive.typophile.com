    html: |-
      <p>What Riccardo said.<br>
      The pictures will have much old type, so create a typespec which is diametrically opposed. As the subject matter is apparently from the early 20th century, then something new and recent would work well.<br>
      <a href="http://www.fontshop.com/search/?q=sanuk&amp;x=0&amp;y=0" rel="nofollow">Sanuk</a>, for instance, which I ﬁrst came across, in use, by Marian Bantjes, for the ID she created for TypeCon in Seattle.</p>
      <p><a href="http://pinterest.com/pin/49539664621259608/" rel="nofollow">Paul Rand</a> might have used Univers Bold.</p>
