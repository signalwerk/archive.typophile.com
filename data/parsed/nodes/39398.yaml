    <p>Canada seems to have a disproportionately large number of interesting people and projects connected with typography.  </p>
    <p>This seems to be reflected in Typophile memberships too. When you read an interesting post and want to know the author's profile, something like 3 out of 5 times, it's somebody in Canada! </p>
    <p>Is there a background to this? Does Canada indeed have a particularly strong typographic tradition? If yes, how did it come about? </p>
    <p>While one reads so much about typography and the Netherlands, I really haven't seen much about Canada. Would love to know more.</p>
    <p>If this ground has been covered already in an earlier thread, I'd be grateful if anybody can point me to it.</p>
