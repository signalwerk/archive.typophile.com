    html: |-
      <p>Canada has a tradition in the graphic arts, especially in Montreal and Toronto, back into the 19th century.<br>
      But no type design until 1967 (Cartier, by Carl Dair.)</p>
      <p>"...had MacDonald chosen to turn his talents to typography he might have made a name for himself in Canada comparable to that of Frederick W. Goudy or T.M. Cleland in the United States" -- art critic William Colgate, 1940.</p>
      <p>He's referring to graphic designer J.E.H. MacDonald, better known as a painter and founder of the Group of Seven. MacDonald's iconic landscapes now sell in the multi-millions, but in the days before the Canada Council supported artists, in a small country like Canada, the Group of Seven worked as graphic designers, at studio Grip Ltd. Among his many talents, MacDonald was an accomplished lettering artist, and had there been any type foundries in Canada in the early 20th century, no doubt he would have designed some typefaces that would be well-known today. </p>
      <p>So it wasn't so much that he didn't chose typography, but type design wasn't really an option available to him.</p>
    html_clean: |-
