    <p>I am employed at an advertising agency and we are auditing our font library to ensure that we are legal with licensing, etc.</p>
    <p>Part of this initiative involves creating some kind of font usage licensing agreement and/or indemnification form to release with the final digital files that we send to the client and/or commercial printers, etc. We are looking for something that protects our company from liability for external usage of the fonts that we release.</p>
    <p>Can anyone here provide any recommendations for what approach to take with this? Looking for standard legal documentation to customize for our company for this purpose. I see the standard EULA's for each type foundry and am still researching other options.</p>
    <p>Any assistance with this would be greatly appreciated. I'm not sure yet if having our lawyer create this kind of documentation is needed or not.</p>
    <p>Thanks.</p>
    <p>Josh</p>
