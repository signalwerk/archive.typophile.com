    html: |-
      <p>Typically, EULAs don't allow you to give copies of the font to the client. You could transfer the license to them, but then your agency would give up said license in the transaction. </p>
      <p>As oldnick says, this is an issue between your company and the type foundry and the EULA agreed to at the time of purchase.</p>
