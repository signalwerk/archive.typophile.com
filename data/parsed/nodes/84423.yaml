    html: "<p>If you adhere to the conditions set forth in each foundry's EULA, you won't need to be indemnified: it's as simple as that. Beyond that, separating EULAs into those which allow modification for internal usage (which is to say, not for resale as a font) and those which do not is as far as you probably need to winnow.</p>"
