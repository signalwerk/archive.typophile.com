    <p>I think I'm a nerd, the internet is great, but I love my apps even more. No games here, but apps that help me stay productive and get the job done.  I am interested in hearing from other dorks.  I dabble with sound, film, design and productivity apps and these are a few that I can't live without. How about you?  </p>
    <p>Ableton Live<br>
    Adobe CS5<br>
    Final Cut<br>
    Lightroom<br>
    Logic Audio<br>
    Mindjet Mind Manager<br>
    Max/MSP<br>
    Pure Data<br>
    Suitcase Fusion 2</p>
