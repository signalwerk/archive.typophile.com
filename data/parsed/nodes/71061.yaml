      <p>Illustrator<br>
      InDesign</p>
      <p>...</p>
      <p>I think I <em>could</em> live without Photoshop, but I wouldn't be happy.</p>
      <p>Also, I guess if I really think about it, I could live with either only Illustrator or only InDesign, since I <em>can</em> do vector graphics in InDesign, and I <em>can</em> do layout in Illustrator. I think I'd prefer to live with only Illustrator. But again, I wouldn't be happy.</p>
      <p>Actually, a piece of software that makes a huge difference in my productivity is Leopard, because of searchable menus. My workstation at my university newspaper was still running Tiger when I graduated (a month ago), and I always kept my laptop open next to it just so I wouldn't get lost in Creative Suite's sea of menu items.</p>
