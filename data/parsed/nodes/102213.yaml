    html: |-
      <p>In the world I live in -- book composition -- you sometimes see "force justify" as a specification, usually applied to the type on a title page, and meaning it should look like the type James used in his logo example. </p>
      <p>I've also seen it applied to certain kinds of paragraphs -- perhaps an epigraph or dedication, very occasionally an image caption. In these cases, the width is sometimes not specified, but left to the compositor to make the best compromises.</p>
      <p>I've never seen it specified for a text paragraph, though in odd ways, it can come up. I've set a couple books where each chapter was a single paragraph. Too long for TeX's paragraph optimization routine, or InDesign's, either. What you do is essentially set several "paragraphs," and all but the last one is "force justified."</p>
    html_clean: |-
