    html: |-
      <p>Chris, "force justified" means forcing both left and right margins to align even when the result may look unacceptable. </p>
      <p>Normally it's used in reference to the last line of a paragraph, which might consist of only a word or two, and a short last line would normally be left alone.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/example2_4720.png"></div><p></p>
      <p>In the logo example, I guess you could call it force justified, although obviously it was a deliberate design choice rather than an unexpected results of paragraph settings.</p>
