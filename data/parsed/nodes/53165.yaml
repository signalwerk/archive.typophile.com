    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hannah_frontpage_5898.jpg"></div><p></p>
    <p>Just released Hannah this week. It is a hand drawn font comprised of three versions that work together as one, producing not variation and contrast between weights but between widths. The ability to mix and match along with some contextual alternates in OpenType allows for many interesting combinations for display.<br>
    Hannah is available <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0235" rel="nofollow">here.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/T0235_01_4452.jpg"></div><p></p>
