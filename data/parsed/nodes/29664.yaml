    <p>Hello dear typophiles,<br>
    I'm working on a font that has 731 glyphs, 1275 "real" kerning pairs, all are class-based, (which, once expanded, generate some 27510 pairs).<br>
    When generating/updating kern feature, FL adds a subtable after the 1258th pair, which is kinda close to the end of the kern listing.<br>
    Considering the following:<br>
    1 I think I do not have *that* much kerns in comparison to other fonts<br>
    2 There's a discussion going on about FL possibly adding unnecessary subtables<br>
    3 removing this sole subtable does not prevent font from compiling and working once installed</p>
    <p>I'd like your opinion about this. Could it be something wrong with my kerns or do I worry too much or is it perfectly normal and I should leave it?</p>
    <p>All input appreciated :)</p>
    <p>FLSM5.0.2 OSX.4.8 on PPCG5</p>
