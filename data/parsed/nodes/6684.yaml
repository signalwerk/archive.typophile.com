  html: <p>I'm building a product showcase with Flash that is translated into multiple languages. The translations are handled with Text files. e.g., we send the files to Poland, and all the dealer needs to do is open up a text file, translate the text and voila, they have a Polish version of the showcase. Easy-peasy. <br> <br>The problem we're running into is that the showcase uses our corporate font (Frutiger). We embed the font's outlines in the Flash file, but when someone needs language-specific characters, some of the content comes up missing. If we switch the font to Verdana (or any basic system font), most everything seems to show up (from the small amount of testing we've done). <br> <br>Now my question, is it possible to embed an OpenType version of Frutiger and expect it work in multiple languages? Is there a better way to support multiple languages?</p>
  html_clean: <p>I'm building a product showcase with Flash that is translated into multiple languages. The translations are handled with Text files. e.g., we send the files to Poland, and all the dealer needs to do is open up a text file, translate the text and voila, they have a Polish version of the showcase. Easy-peasy. <br> <br>The problem we're running into is that the showcase uses our corporate font (Frutiger). We embed the font's outlines in the Flash file, but when someone needs language-specific characters, some of the content comes up missing. If we switch the font to Verdana (or any basic system font), most everything seems to show up (from the small amount of testing we've done). <br> <br>Now my question, is it possible to embed an OpenType version of Frutiger and expect it work in multiple languages? Is there a better way to support multiple languages?</p>
