    <p>Looking for info on how the sans serif came about in Germany.  Everything up to and including Akzidenz.  Yes I know technically the first sans' sprung up in the British Isles, but really it was in Germany where the idea started to take root.  All I've been able to find out is that somehow it morphed out of the black-letter/fraktur model.</p>
    <p>The mid to late 1800's was an incredibly fertile time for typeface development.  It's a shame there is not more widely available info about it out there.</p>
    <p>And what's with that term 'jobbing font,' anyway?  Does the word 'job' have a different meaning in Germany?  If a sign painter made an advertising sign in slab serif or 'brush script,' would he still not be completing a 'job' for someone?</p>
