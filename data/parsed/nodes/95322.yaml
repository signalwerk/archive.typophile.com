      <p>From the <a href="http://www.oed.com/" rel="nofollow">OED</a> (online) Jobbing (adj)</p>
      <blockquote><p>
      <strong>1.</strong> That does odd jobs; employed by the job; employed in odd or occasional pieces of work. Freq. (esp. in later use) <em>depreciatively</em> implying reduced quality and a lack of commitment.
      </p></blockquote>
