    <p>We are working on a project here at our firm and have been setting the body copy for this annual report in Underware’s Dolly. Love the font it has been working out great, but as far as I can see it does not have any tabular numerals. We are very late in the game here with this project and the client has just asked for the some of the numerals to be “bigger” but they really mean that they want them to be tabular. It is looking like we will need to swap out some of the numerals for a different font (not ideal believe me) and I was wondering if anyone had some suggestions of a font that we could use its numerals and they would not stand out TOO much. Any help is much appreciated. </p>
    <p>Thanks</p>
