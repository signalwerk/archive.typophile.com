      <p>I think you are talking about lining numerals, not tabular.</p>
      <p>Contact Underware directly! I seem to remember that they have designed some. Other options: 1: Gingko is so similar one of our fellow Typophiles called it a rip-off, and it has the numerals you are after. 2: Have me draw some! 3: Explain to your client old style figures are designed to work in text setting, and lining figures only really belong with capitals.</p>
