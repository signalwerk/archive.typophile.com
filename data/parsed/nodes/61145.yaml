    html: |-
      <p>Yes, it is possible but will take some effort.</p>
      <p>Here is a quick rework showing the 'white' areas as 100% Magenta. Doing this will give you the ability  to output CMYK separations from Quark. (The M plate will produce the 'white' and the K plate will handle 'black')<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LRRP-Sample_5805.gif"></div><p></p>
      <p>It would be ideal if you could lay down the white base and overprint the entire logo on top, without any trapping.</p>
      <p>If trapping is required in all of those areas you have the potential for a real nightmare because Quark can't trap an imported EPS or Photoshop generated bitmap.</p>
      <p>Handling the trap in the EPS with Illustrator is pretty straightforward but working with that bitmap in Photoshop to get the trap right would be involved. You would also need to work in CMYK with two layers. Bottom layer 100% Magenta and the top layer 100% Black with the layer set to 'Multiple'. Always best to check your channels when doing something like this. (Hint: The Y and C channels should stay solid black if you did it right)</p>
      <p>I can give you more details on the process if you can tell me how this will be printed... (eg. White + Black on a T-Shirt??)</p>
