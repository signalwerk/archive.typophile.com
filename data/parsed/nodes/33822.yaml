    <p>Hey Guys-</p>
    <p>Wondering if anybody can lean me in the direction of any existing typefaces similar to these? I've added a few examples, obviously different but I really like the style, especially the solid serif one. They are some custom work by the fantastic crew at Non-Format. I'm wanting to find some abstract solid typefaces similar to do some experimenting for a poster design. Full credit to Non-Format love there work!!</p>
    <p>Thanks for any help in advance!</p>
    <p>Cheers</p>
