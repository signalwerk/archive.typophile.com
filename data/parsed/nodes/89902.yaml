      <p>I do thank you for your contribution regarding the myths about Opentype Fonts. The same problem is also encountered with Truetype fonts when using Adobe Photoshop. It is not a problem of the font type.</p>
      <p>I have found through reading in the Internet some facts about opentype fonts. I have read that "Opentype should be far better at handling fonts that contain variant glyphs of the same characters, particularly Hindu fonts where individual letters often combine into complex ligatures. Various high-end features in these fonts currently only work in high-end desktop publishing software."</p>
      <p>You can find more about the benefits of Opentype/CFF over Truetype:<br>
