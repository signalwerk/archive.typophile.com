      <p><cite>The most important question, why do I have troubles when I use my fonts with Adobe Photoshop and other related software?</cite></p>
      <p>This was my answer:<br>
      <cite>… and just opening a TTF and directly generating a (CFF-flavoured) OTF from that is not really a proper conversion. I would expect a lot of problems with such a font.</cite></p>
      <p>From what I read, you just open a TrueType-based font and directly generate a PostScript-based OTF font from that. Those are different formats and you need to take care of converting TT to PS outlines, correct path directions, convert the hinting and so on. And as we have said before: there is not even a reason to do all this.</p>
  - id: 496032
    user_id: 83217
    user_name: Té Rowan
    user_path: null
    user_image: /files/pictures/picture-83217.jpg
    date_raw: 22 Feb 2012 — 5:17am
    date: 2012-02-22T05:17:00
    votes: null
    html: |-
      <p>Windows XP will only accept a TT-flavoured OpenType font as OpenType if it has a digital signature (DSIG).</p>
      <p>If these Adobe products won't accept TrueType or TT-flavoured OpenType fonts, they are FUBAR. Period.</p>
      <p>In short, do not convert between TT and CFF unless you must. There are just too many pits, traps and grues in the way.</p>
