    html: <p>Do the errors still appear in Photoshop CS and CS2 after uninstalling your converted fonts? If not, that would suggest an issue with the fonts which would be difficult (and in this case rather pointless) to diagnose. If the errors do persist, you can try clearing the font caches by searching your system for “adobefnt*.lst” and deleting those files.</p>
