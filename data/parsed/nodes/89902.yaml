      <p>@ashosaki – Truetype is already a subset of OpenType, namely TT-flavoured OpenType. The other subset is PS-flavoured or CFF-flavoured OpenType.</p>
      <p>Just slap on the OT features you want plus a dummy DSIG (Digital SIGnature) for the WinXP users, and you're sitting on the top of the world.</p>
