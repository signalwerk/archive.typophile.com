    html: |-
      <p>Why do you want to convert TTF to OTF in the first place? If you don’t add OpenType features, there is no reason to convert to an OpenType format. And even if you add OpenType features, there is no need to switch from TrueType outlines to PostScript outlines. (Which is suggested by using the .otf suffix). </p>
      <p>See also: <a href="http://opentype.info/blog/2010/07/31/opentype-myths-explained/" title="http://opentype.info/blog/2010/07/31/opentype-myths-explained/">http://opentype.info/blog/2010/07/31/opentype-myths-explained/</a></p>
