      <p>No, it's the OP who understood just about every important detail the wrong way around.</p>
      <p>It's not the font format <em>per se</em> that makes these special options available, what counts is which features are defined in the font to begin with.</p>
      <p>(But leaving his mistaken expectations for what they are: the one thing that's missing from this discussion so far is an explanation for why his attempt to simply convert from one type to another failed.<br>
      It might be as simple as that he left the original fonts installed as well -- invalidating all font caches etc.)</p>
