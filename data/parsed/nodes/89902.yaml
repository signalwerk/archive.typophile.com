    <p>Hello all dear and great typographers.</p>
    <p>I have designed some new Latin typefaces and converted them into OTF format using FontLab and installed them in the \Windows\Fonts folder as usual. I am using a Windows XP SP3 and Adobe Photoshop CS and CS2 products. When I tried to use and select my fonts to be used with Photoshop CS/CS2, I had many error messages informing me that there are errors in the program, the RAM is not enough, the text engine cannot be initialized, and other weird messages. (I will attach some photos of the Photoshop messages).</p>
    <p>I noticed also that the icon located beside me new OTF fonts in the list of fonts shown by Photoshop CS2 is for TTF fonts not for OTF fonts that I have designed and copied to the Fonts folder.</p>
    <p>The original designed typefaces are in TTF and I used the FontLab to convert them into OTF format. I do not have this problem at all when I copy the original TTF fonts to the Fonts folder. Also, When I use Photoshop CS4, I also do not have this problem at all.</p>
    <p>What could be the possible reasons for such errors in Photoshop CS and CS2? How could I convert my TTF to OTF using FontLab software without having such errors in the Photoshop CS and CS2?</p>
    <p>I hope that you can tell me more about the solutions for these painful problems.</p>
    <p>Thank you for your time.</p>
    <p>Ash O.<br>
    Osaka ..</p>
