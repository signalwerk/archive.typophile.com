    <p>I have 6 fonts that I have designed. One of the fonts is almost completely developed in FontLab. The others are part developed in Illustrator. </p>
    <p>I am looking to develop a famous foundry by producing the highest quality fonts. I want to partner with a developer that holds high standards for themselves and their work and has the highest attention to detail.</p>
    <p>I own and run a design company and do not have enough time to design and develop the fonts. I have found the development of fonts a steep learning curve and can appreciate the skill needed to develop fonts. I have good experience in business and marketing and have high ambitions for the foundry I want to build. </p>
    <p>I look forward to any serious inquiries, comments or advice.</p>
    <p>James</p>
    <p><a href="http://www.jamestrump.com" title="www.jamestrump.com">www.jamestrump.com</a></p>
