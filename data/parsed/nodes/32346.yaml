    html: |-
      <p>Are you willing to pay somebody up-front to “manufacture” the fonts for you? If not, this is only likely to work out if the fonts are exceptional (tough call) and you settle on some profit-sharing scheme. There are too many fonts out there, at low prices, for it to be otherwise.</p>
      <p>&gt; I intend to create a new font simular to Peignot but elegant throughout.</p>
      <p>There are possibly legal, and certainly ethical, complications when doing something like this. Excoffon, a contemporary of Cassandre once did the same sort of thing to Peignot early on (by some accounts even before Peignot was officially released) and the uproar was a trigger for the creation of ATypI.</p>
      <p>Furthermore, concerning Peignot in particular, it’s important to note that it was much more than just another font - in essence it was actually an attempt to reform the Latin script. As a result, any “taming” of it (presuming that’s what you’ve done - maybe not) involves complications beyond merely the formal.</p>
      <p>Not trying to be confrontational, just trying to help.</p>
      <p>hhp</p>
