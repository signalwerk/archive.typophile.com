      <p>I rather liked the magic markers idea.</p>
      <p>How on earth can you defend the idea that proportionally spaced numerals are detrimental in this context? Oldstyle numerals are probably more legible than lining, and are most likely proportional. You can increase the overall tracking if they're too tight. Your grandmother will not, most likely, be playing a video game on her calendar.</p>
      <p>Lowercase letters are irrelevant? If you want her to read the calendar, you'll presumably want to use lowercase.</p>
      <p>Leading has nothing to do with what font you choose. By which I mean, you can use whatever leading you like. Not sure what this has to do with choosing a font.</p>
      <p>I think a face with a large x-height and not too much contrast, like perhaps Georgia, could work well, but you probably don't want a serifed face at all, due to this not being an art project.</p>
