      <p>Google "large print calendars" and you'll find calendars designed for the vision-impaired. They are often less than $10.</p>
      <p>If you'd prefer to make it yourself, size is probably the most important factor. Make it 11 x 17 rather than 8.5 x 11 (if your printer can't go that large, output it at a place like Office Max where they have commercial-quality xerox machines that can output 11 x 17.)  Regarding fonts, it would be pretty simple to do a test. Set a sentence if several different fonts and ask your grandmother which is the most readable.</p>
      <p>Her ophthalmologist may be able to direct you to other useful resources. A elderly friend of mine was nearly blind from macular degeneration and her doctor had recommendations for special magnifying stands and other products that made it possible for her to still read.</p>
