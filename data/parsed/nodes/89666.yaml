      <p>A key to good typography is white space. Allow enough and text is easier to read. </p>
      <p>For old eyes, lighting and colour contrast are important for legibility. </p>
      <p>If you can't take the above axioms into consideration and come up with a legible calender using almost any font you already have, then I think you should just phone her up every day and tell her the date.</p>
      <p>:o)</p>
