    html: |-
      <p>dupling, I find your comments rather amusing. You seem to be misinterpreting some type design principles which probably makes you want the wrong type of font for your project.<br>
      &gt; Lowercase letters are irrelevant. This is, after all, not an art project.<br>
      Absolutely ludicrous. What do lowercase letters have to do with an art project specifically?</p>
      <p>&gt; Leading is a colossal waste of space.<br>
      That's bordering on the psychotic. You know what though, let's reject white space entirely and cramp as much information as we can in as little space as possible.</p>
      <p>&gt; I do not want descenders in my calendar. As I said, my grandmother has very poor vision.<br>
      Might be a good idea to DO use oldstyle numerals then.</p>
      <p>&gt; Descenders gobble up space. Also, leading gobbles up space.<br>
      &gt; How large do I need to make my calendar pages?<br>
      Depending on the length of descenders they barely gobble up any space. Besides, for an optimal reading experience it's recommended to be quite generous with the leading.</p>
      <p>&gt; The number 11 has two digits; do not try to cram it into one digit's worth of space.<br>
      Who does that? You can use a unicase font to give each digit equal space, but I have to be honest I've never seen two digits crammed into the space of one.</p>
      <p>&gt; The numeral 6 should not look like an "8"-wannabe. Sorry, Helvetica.<br>
      How does the 6 resemble an 8, even in Helvetica? I think only in digital clock fonts the numerals use many of the same strokes/shapes but even then the 6 does not like an 8.</p>
      <p>&gt; I will not pay more than a few dollars (say, $10) for this font<br>
      That's nothing. There are plenty of free fonts which are good, but you seem to be wanting something so awfully specific that I think you probably need to spend $20 per font. If you want a bit of typographical variety in your calendar I suppose a budget of $60 could work. If that's too much, search for a freeware option or buy a calendar instead.</p>
      <p>&gt; Why is it OK to make old people with bad eyes look at ugly type.<br>
      Very good point. Why do you worry so much your grandmother won't be able to read your type when you can just select a beautiful font and use a larger point size. Depending on the size of your calendar there should be more than enough room for all information.</p>
