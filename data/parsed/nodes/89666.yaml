      <p>Robert, I see your point. Thin font, spaced tightly, with no commas to separate thousands. Not the most readable way to present a score.</p>
      <p>But your calendar will just contain short numbers (1-31). And  you can put as much space between the digits as you wish.</p>
      <p>Try this simple test --  set a few words and numbers using several different fonts &amp; weights (in a very large size), and then ask your grandmother which is easiest for her to read. You may find that a font you already own will work fine when in a large-enough size.</p>
