      <p>I seriously wonder why proportionally spaced numerals even exist. Like I said, "11" is a two-digit number, and should take up two digits' worth of space. I can only see very uncommon exceptions to this: for instance, on a feet-and-inches tape measure, in which 10 and 11 are of course "honorary digits".</p>
      <p>I assume that by "oldstyle" numerals you mean those with the general appearance of lowercase text. I do not want descenders in my calendar. As I said, my grandmother has very poor vision. Descenders gobble up space. Also, leading gobbles up space. How large do I need to make my calendar pages?</p>
      <p>If one page is something like:</p>
      <p>2012 2<br>
      06 MO<br>
      07 TU<br>
      08 WE<br>
      09 TH<br>
      10 FR<br>
      11 SA<br>
      12 SU</p>
      <p>why would I want to do anything fancy?</p>
      <p>Edit: I just saw how the above sample calendar page looked. See why I want nothing to do with proportional-width figures here?</p>
