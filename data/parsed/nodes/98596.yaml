  html: |-
    <p>Does anybody know which font was used as the main logo on all Alitalia planes from about 1958 to 1969? The closest match I found so far (without inner stripes, of course) is Diamanti Diagonal EF Heavy.</p>
    <p>Any help would be greatly appreciated!</p>
