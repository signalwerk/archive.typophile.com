    html: <p>Part of the mentioned inner stripes, it looks very generic to me. You could do the same using <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" rel="nofollow">Avant-Garde Gothic Bold Oblique</a> (I like the lower crossbar /A), <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/futura/" rel="nofollow">Futura Bold Oblique</a>, even <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/" rel="nofollow">Helvetica Black Oblique</a> (created in 1957) could work.</p>
    html_clean: <p>Part of the mentioned inner stripes, it looks very generic to me. You could do the same using <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" rel="nofollow">Avant-Garde Gothic Bold Oblique</a> (I like the lower crossbar /A), <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/urw/futura/" rel="nofollow">Futura Bold Oblique</a>, even <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/linotype/helvetica/" rel="nofollow">Helvetica Black Oblique</a> (created in 1957) could work.</p>
