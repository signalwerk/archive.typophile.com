      <p>1 - Email me and we'll chat!<br>
      2 - The only treatment that is close to me is your letterhead design. Even then, it's all caps and all letterspaced. I think you need a typographic solution that condenses it into separate lines (the * represents your logo):</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Creative Arts<br>
      Education Foundation</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*<br>
      &nbsp;&nbsp;&nbsp;&nbsp;CREATIVE<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;A&nbsp;&nbsp;R&nbsp;&nbsp;T&nbsp;&nbsp;S<br>
      &nbsp;&nbsp;&nbsp;&nbsp;Education<br>
      &nbsp;&nbsp;&nbsp;Foundation</p>
      <p>Having the mark split your title doesn't flow as well:</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Creative Arts<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*<br>
