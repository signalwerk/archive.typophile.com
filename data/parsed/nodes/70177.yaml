      <p>The current branding says 90s all the way.</p>
      <p>The Greek style type and the colour palette are dated. </p>
      <p>The icon itself has potential if paired with a typeface that is less decorative. When using colour, I'd try to choose something fun like an orange or lime green OR something primary like Red or Blue.</p>
