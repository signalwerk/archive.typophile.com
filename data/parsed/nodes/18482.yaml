    <p>I am looking for a typeface that looks like its from those travel postcards like as in “Hello from California”... and the Type usually has picstures in the letters.  The typeface doesnt have to pics in it.. but just the basic shape of those letters..(so I can put my own pictures in it).</p>
    <p>I tried to find a pic online in the last hour and cant come up with a sample image (I apologize).  But if it helps... The type usually is usually blocked (maybe even slight perspective on it) and curved on the bottom.</p>
    <p>Thanks in advance.</p>
    <p>edit.. I found one!</p>
