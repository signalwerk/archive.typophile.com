    html: '<p><a href="http://bowfinprintworks.com/Script09Pg1.html" target="_blank">Part 9 of the Script Font ID Guide</a> has some vertical monoline (mostly) handwriting scripts that may be similar enough: <br> <br>Notec (Linotype) p.1 <br>Garrido (Unifonts) p.1 <br>Emmascript MVB (Adobe) p.1 <br>Lanier (E-phemera) p.5 <br>Sincerely (Canada Type) p.7 (same as Elegance  p.1, but more easily found) <br> <br>You can probably test drive all but Unifonts  Garrido at MyFonts.com</p>'
