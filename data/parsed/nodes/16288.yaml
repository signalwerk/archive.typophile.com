    votes: 0
    html: |-
      <p>1. The VOLT Arabic Typesetting font includes some 'calt' contextual lookups for alternating 'tooth' length, a traditional disambiguation technique. You would need to compare these with the behaviour in the shipping version of Arabic Typesetting in order to determine whether they are correctly implemented in the VOLT source. Adobe Arabic does not have this feature.</p>
      <p>2. The VOLT Arabic Typesetting font includes glyph support for Qur'anic characters such as the ayah (verse) division sign; however, not all of these characters have layout behaviour defined. The Qur'anic combining marks do, but there are no lookups for numerals within the ayah sign; the latter is implemented in the shipping version. Adobe Arabic does not support any uniquely Qur'anic characters, since it was intended for modern texts.</p>
      <p>3. Adobe Arabic supports extended Arabic character coverage up to Unicode 5.0, so includes some characters that were not defined when the VOLT Arabic Typesetting font was made.</p>
      <p>4. Adobe Arabic supports numeral positioning for enclosing signs (year sign, footnote sign, etc., not including the Qur'anic ayah sign), which is not implemented in the VOLT Arabic Typesetting, but is supported in the shipping version.</p>
      <p>Those seem to be the main differences. The VOLT Arabic Typesetting is even more basic, relative to the shipping version, than I remember it.</p>
