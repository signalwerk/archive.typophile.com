      <p>Adam: <em>The OpenType Layout source code for the Microsoft Arabic Typesetting font is included in the Microsoft VOLT Supplementary Files</em></p>
      <p>It should be noted that this is actually the source for the initial version of Arabic Typesetting, which is considerably different from the release version as revised by Mamoun Sakkal. Not only is the design different, but so are some aspects of the layout intelligence. That said, the source available in the VOLT Supplementary Files is a good guide to producing a moderately complex Arabic font, and certainly provides the information one will need to produce basic Arabic shaping with the init, medi, fina, rlig and liga features, as well as mark and mkmk positioning features. The release version of the font also implements the curs feature, but this is, alas, still not supported in InDesign ME, limiting the useability of Arabic Typesetting to Office under Windows.</p>
      <p>I have some good ideas for Arabic type designs, but I won't make any of them for OpenType until the curs feature is more widely supported, since the designs will rely on this.</p>
