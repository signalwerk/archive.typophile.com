      <p>Saleem, it would be helpful if you only posted your questions in one place. I have already responded to your question about InDesign breaking shaping where you posted it in this thread: <a href="http://typophile.com/node/15794">http://typophile.com/node/15794</a></p>
      <p>As I wrote there, I've not seen anything like this with other fonts in InDesign ME, so I presume there is a problem with the font.</p>
      <p>Re. the numbers in aya marks: have you looked at how this is handled in the MS Arabic Typesetting font? The VOLT source for an early version of that font is included in the <a href="http://www.microsoft.com/typography/VOLT%20Release%20Notes/samples.mspx">VOLT supplemental files</a></p>
      <p>The numbers are positioned in the aya mark using contextual lookups in the kern feature.</p>
