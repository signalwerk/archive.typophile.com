      <p>&gt; Would this be wrong to do?</p>
      <p>If the font is your own personal project and you don't plan to share it with anyone else you're free to do whatever you like in the privacy of your own home. The Canadian font police won't break down your door and haul you away for making a hack-encoded font.</p>
      <p>However if you want to use initial, medial and final forms for the letters (as well as the isolated forms) and have the font work properly right-to-left and have the dots placed correctly and include a nice matched Latin design, and be able to use the font to display Unicode encoded documents and Web pages you need to follow the conventions of existing Unicode OpenType Arabic fonts and not invent your own system.</p>
      <p>Cheers, Si</p>
