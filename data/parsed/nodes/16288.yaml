      <p>Is your ligature designed so that the bottom part of the bari yeh sits on the baseline? This is what it looks like in your image. Why not just make the glyph lower, so that the top part automatically aligns with the preceded letters. Bari yeh is normally a descending form, isn't it?</p>
      <p>If you do want the bari yeh to sit on the baseline, and to have the preceding letter raised, then you need to use a Cursive Attachment GPOS lookup, but that's a lot more work that wouldn't normally be necessary for a flat design like this.</p>
