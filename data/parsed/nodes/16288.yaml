    html: <p>Saleem, Adobe applications use their own shaping engines, not system engines, and this is mainly so that Adobe can provide cross-platform compatibility within their applications. So what you appear to be looking at -- if I am interpreting your pictures correctly -- is not a Windows/Mac incompatibility, but a Windows/Adobe incompatibility. As I said, I have not seen this issue in InDesign ME with any of the Arabic OT fonts I have, so I presume there is something wrong with your font. I can't say more without examining the font.</p>
