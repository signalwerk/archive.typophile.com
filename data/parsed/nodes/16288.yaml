      <p>Regarding VOLT: you will need to use VOLT if you want to enable mark positioning in your font so, for instance, if you think it might be used to set vocalised text then you will need VOLT. Even if the only mark that will occur is shadda, you probably still want to use VOLT for dynamic mark positioning, rather than filling your font with glyphs for every conceivable combination of shadda with a base letter or ligature.</p>
      <p>If you don't intend to support mark positioning, then it is possible to make a basic Arabic font using only FontLab.</p>
      <p>I use VOLT for all my Arabic projects.</p>
