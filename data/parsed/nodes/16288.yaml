    html: <p>Going from zero to making a full feature Arabic font is going to be hard. I'd be inclined to start by reading as much as you can on OpenType and then start making some small test fonts, Latin based, in FontLab and in VOLT so you can get the hang of how OpenType works, testing the results in InDesign. Only after you're comfortable with OT from a Latin perspective would I suggest moving on to Arabic. Currently making an Arabic OT font requires using VOLT, but there are a number of Arabic fonts containing VOLT "sources" that will help you get started.</p>
