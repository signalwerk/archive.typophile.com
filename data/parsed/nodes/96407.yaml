    <p>Had a hard drive crash on my sign making PC and am not sure what font this is, but I spent almost a year of using this font making these signs, so now it is kinda branded and I need to know what it is...</p>
    <p>I'm thinking it is one of the "Balloon" fonts but have been through a few and although I have found one that is very close - Balloon X-bold-Regular - it is not EXACT...</p>
    <p>Appreciate any help in identifying this font...</p>
