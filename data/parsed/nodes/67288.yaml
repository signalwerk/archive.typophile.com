      <p>the short answer is, "ornm" is one of the OpenType layout features not directly supported by InDesign CS4 and earlier. You'd have to use the glyph panel.</p>
      <p>See <a href="http://www.adobe.com/type/browser/pdfs/OTGuide.pdf" title="http://www.adobe.com/type/browser/pdfs/OTGuide.pdf">http://www.adobe.com/type/browser/pdfs/OTGuide.pdf</a></p>
      <p>There's a table at the back that shows which apps support which features.</p>
      <p>Cheers,</p>
      <p>T</p>
