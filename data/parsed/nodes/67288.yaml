      <p>When doing some tests earlier last year I checked the content of <em>FeatureParams</em> with AFDKO's spot. But OTMaster is more convenient: Choose <em>'GSUB' table &gt; 'GSUB' feature list</em> (left side), then navigate to an 'ssXX' feature (right side) and click on the plus sign in the <em>FeatureParams</em> column <a href="http://www.kltf.de/stuff/OTM2_GSUB_ssXX_FeatureParams.gif" target="_blank" rel="nofollow">to see its content</a>. If there is a minus rather than a plus sign in this column, no <em>FeatureParams</em> has been defined. </p>
      <p>This is really off-topic now.</p>
