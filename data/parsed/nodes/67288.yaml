      <p>@ Thomas</p>
      <p>feature ornm {<br>
        sub [r s t] by [rose sunflower tulip];<br>
      } ornm;</p>
      <p><cite>Well,behind the scenes... inserting stuff via the Glyph Panel can in fact activate OpenType features which there is no UI for otherwise.</cite></p>
      <p>When you pick up the character rose from the glyph panel and type s or t then, s and t will not be replaced by the characters sunflower and tulip. Doesn’t that mean, that the feature is not activated? I have recognized, that features are activated sometimes, when I pick up a glyph from the panel. Sometimes I first have to delete the glyph, that I had picked up from the panel, before the feature is permanently activated. I did not find real rules behind the behavior of Indesign with regard to that.</p>
      <p>And I have recognized a bug:</p>
      <p>feature ss01 {#Stylistic Set 1<br>
      	ignore sub a' @allExceptSpace;<br>
      	sub a' by a.fina;<br>
      } ss01;</p>
      <p>In the moment, in which you add the ignore statement, the stylistic feature is not listed in the drop down list of the glyph panel anymore.</p>
      <p>Except from that it would be very cool, if you could add a real name to those features. Example:</p>
      <p>feature ss01 [title="latn dflt: Carl, DEU: Paul, TRK: Peter"] {#Stylistic Set 1<br>
      	ignore sub a' @allExceptSpace;<br>
      	sub a' by a.fina;<br>
      } ss01;</p>
