      <p>Feature names are not supported in any application yet. They are a pretty recent addition to the specification.</p>
      <p>I have reported the quote typo quite a while ago. :)</p>
      <p>FeatureParams points to a "name" table record. Obviously, TTX recognizes it but cannot interpret its content.</p>
