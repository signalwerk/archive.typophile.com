    html: |-
      <p>@ Karsten</p>
      <p>  &lt;name&gt;<br>
             &lt;namerecord nameID="256" platformID="1" platEncID="0" langID="0x0"&gt;<br>
            Hallo Welt<br>
          &lt;/namerecord&gt;<br>
           &lt;namerecord nameID="256" platformID="3" platEncID="1" langID="0x409"&gt;<br>
            Hallo Welt<br>
          &lt;/namerecord&gt;<br>
        &lt;/name&gt;</p>
      <p>Part of the name table of a font, that I just had generated with makeotf belonging to AFDKO 2.5. Decompiled with TTX. And unfortunately that does not seem to be yet supported by Indesign CS3 and QuarkXPress 8. But the output indicates, that I did not make a mistake, doesn’t it?</p>
      <p>By the way, there is a slight bug in <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#8.c" rel="nofollow">syntax description</a>: Either ' or ".</p>
      <p>Edited:</p>
      <p>A comparison between the GSUB tables of the font genarated without the name tag has shown, that the only difference are a few empty featureParams-tags:</p>
      <p>WITHOUT THE NAME TAG<br>
            &lt;FeatureRecord index="59"&gt;<br>
              &lt;FeatureTag value="ss01"/&gt;<br>
              &lt;Feature&gt;<br>
                &lt;!-- LookupCount=1 --&gt;<br>
                &lt;LookupListIndex index="0" value="16"/&gt;<br>
              &lt;/Feature&gt;<br>
            &lt;/FeatureRecord&gt;</p>
      <p>WITH THE NAME TAG<br>
            &lt;FeatureRecord index="59"&gt;<br>
              &lt;FeatureTag value="ss01"/&gt;<br>
              &lt;Feature&gt;<br>
                &lt;FeatureParams&gt;<br>
                &lt;/FeatureParams&gt;<br>
                &lt;!-- LookupCount=1 --&gt;<br>
                &lt;LookupListIndex index="0" value="16"/&gt;<br>
              &lt;/Feature&gt;<br>
            &lt;/FeatureRecord&gt;</p>
      <p>From the Adobe OT feature file spec:<br>
      “The implementation will store the name strings in the name table, and will create a feature parameter data block which references them.”</p>
      <p>So the feature parameter block was created, but shouldn’t there be anything stored, that links to the name table, to the nameID 256?</p>
      <p>At least I think, that my test has shown, that it is relatively easy to add those names with the help of TTX.</p>
      <p>--------------</p>
      <p>Now I will check, if your tip with the lookup helps.</p>
      <p>Result:<br>
      1. The lookup does not help.<br>
      2. It is not the ignore-statement, that makes the feature name missing in the drop down list of the glyph panel, but the pure presence of “'” in “a'”. And even if I trash the ignore statement and simply write “sub a' b by b”, the name is missing on the panel. Sorry, that I partly miss the correct terms.</p>
      <p>I think, it is more a bug than a feature. At least I get no idea, why it could be intended.</p>
