      <p>Get the latest <a href="http://www.adobe.com/devnet/opentype/afdko/" target="_blank" rel="nofollow">AFDKO</a> and you can <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#8.c" target="_blank" rel="nofollow">assign names</a> to Stylistic Set features.</p>
      <p>I didn't try to reproduce the effect which you mention (which InDesign version?), but you could include both commands in an explicit lookup to see if this helps:</p>
      <p>feature ss01 {<br>
      lookup ss01_1 {<br>
      ignore sub a' @allExceptSpace;<br>
      sub a' by a.fina;<br>
      } ss01_1;<br>
      } ss01;</p>
    html_clean: |-
