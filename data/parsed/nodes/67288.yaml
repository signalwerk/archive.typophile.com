    html: |-
      <p>Karsten: <em>Get the latest AFDKO and you can assign names to Stylistic Set features.</em></p>
      <p>Or as a somewhat more expensive but probably more convenient option, you could use DTL OTMaster, which supports the latest AFDKO 2.5. version. You could generate for instance an OpenType font with FLS, export the features file in OTM, subsequently do some syntax editing to support the latest AFDKO and use the new features file to generate new GSUB (and/or GPOS features). The same features file can be used then for compiling GSUB tables for other OT fonts (which use the same character naming convention, of course).</p>
