    html: |-
      <p>Well,behind the scenes... inserting stuff via the Glyph Panel can in fact activate OpenType features which there is no UI for otherwise. If there's more than one way to get to the glyphs by base character + features, InDesign uses its own order of preference to decide which feature(s) to activate to get to the glyphs.</p>
      <p>Cheers,</p>
      <p>T</p>
    html_clean: |-
