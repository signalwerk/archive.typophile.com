    <p>I have a question with regards to the OpenType ornaments feature (ornm):</p>
    <p>How can I activate the feature in Indesign? In case of Adobe Caslon qwwwwe should be replaced by a border. I mean, I know, how to access the characters with the glyph pallet, but can I access them in the same way as the ligatures by activating the feature? </p>
    <p>I only found the explanation in the OpenType specs, but it is no help:<br>
    <a href="http://www.microsoft.com/typography/otspec/features_ko.htm#ornm" title="http://www.microsoft.com/typography/otspec/features_ko.htm#ornm">http://www.microsoft.com/typography/otspec/features_ko.htm#ornm</a></p>
    <p>Any help much appreciated.</p>
  html_clean: |-
