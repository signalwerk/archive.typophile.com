    html: <p>In your screenshot, it looks like the 'x' in the Font window is grey rather than black, which suggests it's showing either the mask or bitmap layer, and the actual outline layer is either empty or has open paths. As for the spacing sliders, they only appear in Metrics Mode, not Text Mode.</p>
