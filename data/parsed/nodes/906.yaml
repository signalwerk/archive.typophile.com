  html: <p>For the cases where you have light and dark extremes on a weight axis, how do you guys decide where to "place" the eventual weights of the font? I'm wondering not just about the -somewhat subjective, or at least vague- issue of what's a good "Regular" weight, but also what relationships the different weights in a family should have, especially when there are more than two weights released. <br> <br>This question isn't new in my mind, but it was rekindled by looking at Terminal Design's Giacomo* - so I very much hope James will participate. <br> <br>* <a href="http://www.terminaldesign.com/index_giacomo.php" target="_blank">http://www.terminaldesign.com/index_giacomo.php</a> <br> <br>hhp <br></p>
