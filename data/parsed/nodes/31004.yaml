  html: |-
    <p>I am working on an identity for a seasoning salt shop. The idea is that people can come and mix their seasonings to suit their tastes (at the seasoning bar). It is important to stress the SALT part of the identity. I've come up with a lot of directions, but can't seem to symbolize salt without being extremely literal. How do I make seasoning look appetizing? I have an earth tone palette, but that is all I have going for me. I've ventured into the direcetion of meat (that changes with each use) + seasoning specks on it, but it might be too literal. Any help would be much appreciated.</p>
    <p>Thanks<br>
    Victoria</p>
  html_clean: |-
