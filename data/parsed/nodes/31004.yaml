      <p><em>where does one draw the line?</em></p>
      <p>Chris, there are several arguments for using contemporary typefaces for contemporary work, rather than old types.</p>
      <p>One would be to preserve the integrity of historical allusion, which is the frame of reference which you mention.<br>
      Another would be to differentiate the product/service, so that it doesn't look like part of other corporations that use the same classic face.</p>
      <p>The best argument for old faces is their "neutrality".</p>
      <p>However, transcending reasons related to the job in question is a general professional consideration, which is that it's important for creatives to express their own time and place, and support their peers, such as photographers, illustrators, and type designers. (Self-interest declared, although I have yet to publish an old-school geometric sans.)</p>
    html_clean: |-
