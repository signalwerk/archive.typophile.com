      <p>Nick,</p>
      <p>ideally yes. It's admirable to try and please all the people all of the time, but is it necessary in this case to look for another typeface that does everything that Futura is doing in the logo currently, solely to avoid a small number of people raising an eyebrow over the date of the type? </p>
      <p>For a moment let's assume we want to do just that. The shop is contemporary, the product is not, so what timescale is appropriate? </p>
      <p>We can't pigeonhole salt in a particular time period so we're out of luck there. </p>
      <p>The shop however is new so do we say contemporary typeaces only? Confine ourselves to this decade? Should we choose a Futura-like geometric sans released as close as possible to the opening date of the new shop in order to be as chronologically synchronised as possible? </p>
      <p>I'm not for a moment saying that designers should indulge in glaring typographic howlers, but should Futura be reserved solely for works on 1920s functionalism? An extreme example I know, but where does one draw the line?</p>
