      <p>I think the proportions of the "f" in flavorit should match those of the f-dots symbol.<br>
      That's why I liked Futura, because the crossbar is low. You could tinker with the Futura "f", just for the wordmark--extend the crossbar to the left, and curl the top over a bit. Avoid anything resembling a ligature. The tag line would be good in Futura too, to stick with the modernist uniformity -- because your logo is a conceptual metaphor and hence modernist. The logo is also geometric modernist: the f-dots are perfect circles. Therefore grot types and those with square i-dots don't match. The principle here is to get everything to harmonize and reduce compexity at the same time. That all stems from the logo.</p>
