      <p>This looks really good</p>
      <p>The use of Futura is very sympathetic to the mark, especially if you visually match up the thickness of the shaker's outline with the stroke weight of the type. Your mark is clean, simple and clever which is complemented by Futura's monoline appearance. </p>
      <p>This treatment won't look 'too 1920s' to the vast majority of viewers. Your tutor's viewpoint and that of other design-centric observers on type is coloured by their own expertise and shouldn't be taken as gospel. </p>
      <p>Nitpicking:</p>
      <p>– The type needs to be slightly bigger in relation to the mark, so it's slightly narrower than the width of the mark itself. If the lower line could be 'Customised seasoning blends' it could be set to match the width of 'flavorit' and by not explicitly mentioning salt you avoid the potential health stigma already noted.</p>
      <p>– The three dots that make up the top curve of the 'f' might look better if the lower two are  aligned. The one that makes the very end of the curve looks like it has popped out of line whereas the other dots are very regularly placed.</p>
      <p>– Slightly open up the kerning betwwen 'f' and 'l' to balance the word up</p>
      <p>Good luck</p>
