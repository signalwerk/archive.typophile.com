    html: |-
      <p>I'm chiming in late on this, so to go back a few posts, I love the salt shaker idea, and like the hand pinching salt next best. My immediate reaction to the subsequent 9 schemes is that the "f-ness" of the letter is best preserved in 1, even if it is less bold. I think it carries the concept best if you can immediately read the letter. My reaction to the sketches with bolder or fewer dots is that they don't work as well. Also, 2 and 5 have a heavy border: to my eye that steals thunder from the f. The ones with holes in outline don't seem graphically strong enough. It's an interesting direction to take with the crescent-shaped shadows in the last two, but I like the flat scheme best, as it reminds me of a large shaker with a handle whose top is flatter and not domed. What if the disc acquired some light tone? or what if the gray tone were actually a photograph of the wonderful off-white texture of the salt? Reall, though, it seems best to keep it very simple and clean, allowing it to appear in small ads in the local paper, etc.</p>
      <p>Finally, as you refine this, might you consider shifting the axis of the vertical stroke just wee bit to the left? I know it is geometrically centered on the disc now, but since most of the "action" and dynamism in the glyph is happening on the right, it doesn't feel <em>quite</em> centered. I'm talking a very subtle move here, mind you. </p>
      <p>What an inspired idea!</p>
      <p>Will you have any influence on the interior design of the shop? I once attended a brown-bag lunch at the Alliance Française and the speaker that day was an (American) architect who had lived for a time near Guérande in France where all the sea salt production takes place. Her friend owned an airplane so she went up with him many times and photographed the big evaporation areas from above -- it was like seeing the most amazing and beautiful abstract paintings! I'm sure such images are available through stock agencies and they could make a wonderful impression in the shop.</p>
