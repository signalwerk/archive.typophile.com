      <p>FWIW I think you have found the closest match. Gotham and Govan have rather similar letterforms, but are not as close as Granby (and too new to be used for the movie, which was made in 1978). Granby Medium has more open counters and the R leg farther from the stem, but other proportions and letters like the J and C seem less like the Extra Bold. It's probable that photolettering was used at that time, and tweaking widths might have been relatively easy, but the wide variety of Sans faces available to them may have included this exact typeface, but I was unable to locate the match in my Photolettering catalogs in a cursory scan. Perhaps more detailed hunt would locate it, but my point is that you have probably found the closest digital font match.</p>
      <p>- Mike Yanega</p>
