      <p>Thanks for your responses, guys.</p>
      <p>Chris: It's not a screen grab of a DVD played onscreen; it's a frame grab from the DVD MPEG2 video stream itself, which I have then manually cropped and stretched to the proper aspect ratio. (The DVD is encoded in anamorphic widescreen, so it is easy to figure out precisely how much to crop and stretch, by using simple arithmetic.) The resulting frame has an aspect ratio of 2.32:1, which is only around 1% off the original theatrical aspect ratio of 2.35:1. The tiny discrepancy can be accounted for by small roundoff errors introduced by encoding into the relatively low-resolution DVD frame. Whatever distortion is present should be visually negligible -- certainly not enough to account for the large differences seen in Granby EF Extra Bold. I suspect that the internal inconsistencies you've pointed out in <cite>C</cite> et al. were already present in the original film.</p>
      <p>Mike: Thanks for taking the time to go through your catalogs. It's good to hear confirmation that I have likely already found the closest digital equivalent. I do have to admit that I'm curious about this Bryant Open family that you've managed to find. If it's not too much to ask, would it be possible for you to upload some scans if you have the time? I'm idly considering a personal project to render my own version of the <cite>Superman Returns</cite> main title sequence in a more faithful <cite>Superman: The Movie</cite> style. Access to clean facsimiles of the original letterforms would be a big time saver.</p>
