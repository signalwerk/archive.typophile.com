      <p>That's my understanding -- at least within the US.</p>
      <p>However, legality aside, is it <em>right</em>? I don't know. My feeling is that this is a gray area. It seems that as long as a type design is sufficiently old (e.g., Garamond), no one has a problem with it being digitized and sold for profit by a multitude of independent outfits. When a design is relatively new (e.g., Palatino), redigitizations are heavily looked down upon -- even if they share no curves or points, and have a completely different name.</p>
      <p>Where exactly does one draw the line? I don't know.</p>
