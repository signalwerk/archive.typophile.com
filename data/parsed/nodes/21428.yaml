      <p>Since Bryant Open was in the Photo-Lettering collection, which is now owned by House Industries, I think you might have to let that one go, but then Bryant Open was only <em>similar</em> to the lettering in those movie credits. If you digitized something that was as close to the credits as possible, it would probably be your own digitization. If I understand our copyright laws in the US, only the names are copyrightable anyway, which seems dumb. I think this is the reason so many re-named versions of things are allowed to exist, but I may be wrong about that.</p>
      <p>- Mike Yanega</p>
