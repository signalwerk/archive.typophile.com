      <p>I've done some more looking in the Photo-Lettering catalogs and found an outline typeface family called Bryant Open that has the same G, M and R shapes, and a very close S in one of the more compressed versions. The samples do not show the J, which would be the other clincher.</p>
      <p>Since Photo-Lettering wasn't the only one making film types, this may not mean much in terms of my basic point -- that you have probably found the best available digital equivalent.</p>
      <p> - Mike Yanega</p>
