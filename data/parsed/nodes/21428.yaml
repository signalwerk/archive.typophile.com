      <p>If what you want is already available in digital form, it is easier and cheaper to buy it. But, if what you want does not exist then it seems designing it is fair game.  The trouble comes if it is a derivative work of something out there.  Where this line falls would best be answered by Mr. Martinez, THE lawyer for type design issues (he recently spoke at TypeCon--photo by Eben Sorkin).</p>
