    <p>All the talk about <cite>Superman</cite> titles in the <a href="/node/21019/" rel="nofollow" class="link-kept"><cite>Typography in New Superman Movie</cite> thread</a> has got my curiosity piqued: What <em>was</em> the typeface used for the titles in the original <cite>Superman: The Movie</cite>?</p>
    <p>Here's a representative frame I grabbed from my DVD:</p>
    <p></p><div class="imageWrap"><img src="/files/superman_titles_original_3617.jpg"></div><p></p>
    <p>As Bobby Henderson has said in the other thread, it looks a little like Gill Sans.</p>
    <p>The closest overall match I've been able to find is <a href="http://www.myfonts.com/fonts/ef/granby/" rel="nofollow" class="link-external">Granby</a> (which according to <a href="http://cg.scs.carleton.ca/~luc/stephensonblake.txt" rel="nofollow" class="link-external">this article</a> was based in part on Gill Sans). But it's still significantly different from the original.</p>
    <p>Here's a quick-and-dirty rendition I've thrown together using <a href="http://www.myfonts.com/fonts/ef/granby/ef-extra-bold/" rel="nofollow" class="link-external">Granby EF Extra Bold</a>:</p>
    <p></p><div class="imageWrap"><img src="/files/superman_titles_granby_5558.jpg"></div><p></p>
    <p>If it looks a little odd, it's because I've fudged the spacing to match that of the original -- which doesn't really work, since the widths of many of the individual characters don't match. I've avoided the temptation to stretch or squoosh anything to make the spacing look better.</p>
    <p>As you can see, some of the characters, such as <cite>P</cite> and <cite>R</cite>, are way off.</p>
    <p>Can anyone find a closer match?</p>
