    html: |-
      <p>I'm assuming that you're not talking about the new @font-face command, since that's not supported but by like 2 browsers. That being the case, you're probably using something like <a class="freelinking external" href="http://jquery.thewikies.com/sifr/" rel="nofollow"></a>sIFR? (My link goes to jQuery sIFR, much better than the original...) If that's the case, then you are technically embedding the typeface into the flash file. Many licenses allow for that, but not all.</p>
      <p>If, however, you are using something like <a class="freelinking external" href="http://facelift.mawhorter.net/" rel="nofollow">Facelift</a>, then the rules are different. You are not embedding or distributing a typeface, so you can use almost any font you want. (That being said, make sure the permissions on the font folder are correct to prevent unauthorized access) What this does is use PHP to dynamically replace your text with a PNG image, not any different at all from using any font on your computer in Photoshop, a practice that is universally accepted.</p>
      <p>That's my two bits at least.</p>
