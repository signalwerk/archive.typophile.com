    html: <p>In my experience most EULAs are silent on server based rendering, and others restrict it (in your option b each Web site member would be counted as a "user"). I don’t recall any commercial font EULAs that specifically say it’s okay. Having said that server generated bitmapped text is as old as the (graphical) Web so the standard advice “ask the vendor” holds true, at least they’ll have been asked this question before.</p>
