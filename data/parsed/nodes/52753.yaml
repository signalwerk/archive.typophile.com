    <p>Hello :)  I'm a bit new to the web development world, but I had two questions regarding Web Fonts that I ask with the desire to follow the rules...in general, if I want to use a unique font on my website, does your average font license allow me to install it on my web server if:</p>
    <p>a) I'm the only one that is making dynamic design changes (like I'm adding new forum topics and I want those forum names to be displayed in the special font for my site visitors), or</p>
    <p>b) Users can make their own personal pages on my site, and the names of their usernames are displayed in the special font (so in this case another person is playing a role in the customization of my website but they can't choose the font, only the text itself of their username).</p>
    <p>Please share your wisdom...thanks so much!!! PS -- I realize that certain fonts have different licenses, just trying to understand in general...thanks!</p>
