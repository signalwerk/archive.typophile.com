      <p>OK that's definitely helpful, because I know this project will be built in PHP.</p>
      <p>So what your saying is that my developers install the font on our web server, make sure the permissions on our web server's font folder are restricted, and then use something like Facelift or its PHP equivalent to dynamically create PNG files.  This way, the font manifestation is just embedded as an image within my site, which is in essence a static publishing of an image and the font is not being distributed or available for use by the average web user as an actual stand alone font, which is generally accepted.</p>
      <p>If we apply a gradient layer to the text in the original Photoshop design, I wonder if the same PHP process can programatically apply this gradient as well to the final PNG file of the resultant image....</p>
      <p>Thanks again so much!</p>
