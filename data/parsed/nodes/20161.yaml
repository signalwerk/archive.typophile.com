      <p>William,</p>
      <p>I think Fedra Serif is a suitable environment for the variations that you mention, considering the other gaps, stub terminals, angles, and general eclecticism there. The b fits, in other words. In the sans, I do not think it fits.</p>
      <p>Kris may have more to say about this, since we only exchanged quips, but the reason he cited ("I like it like that") sounds to me like he is attached to those gaps for no functional reason, and has not tried eliminating them yet. It might be that adding more gaps would somehow make these 2 fit. They could be all over: 4 6 8 9 0 A B D H K P Q R U a d e g k p, and that would change the design a lot. but given the way the design is working now (and it is working beautifully) they don't fit; they are the lone elements that interrupt the flow of reading in such an otherwise subtle and pleasing typeface; the soft bracketing, rich color, fluid curves, excellent spacing, and the other bowls which resolve differently all work on such a different, more subliminal level, that by contrast these 2 gaps look affected and showy. I invite Kris to try:</p>
      <p>Put more unjoined bowls in the design throughout (though leave i-ligatures off while testing),</p>
      <p>or</p>
      <p>close these 2, and examine dispassionately whether anything of value is lost, or if something else happens. Is it really important they be there; do they contribute anything? </p>
      <p>or</p>
      <p>Turn the unjoined strokes in more, to match the flow of the strokes in the bowls of d and p.</p>
      <p>Kris' design has so many strengths, and one way for typefaces to be resolved fully is for the designer to try many things, letting go of favorite elements, and as someone else put it here recently, let it become itself. Because of the many unnecessary (confusing? gratuitous?) i-ligatures, and because of Kris' stated reason for keeping these cuts, I had to at least suggest he try losing them.</p>
    html_clean: |-
