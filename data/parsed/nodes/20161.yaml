    html: |-
      <p>Kris, </p>
      <p>I love this, and I eagerly anticipate its release. For that matter I'm dying for Salamanca, and  Zinc looks worth focusing on as well. I know it's a juggle. </p>
      <p>Please consider making all these ligatures available only on a discretionary basis. Some of them seem frankly gratuitous, and they would very much hinder extended reading. Especially in languages where lots of accents are present, they could really distract.</p>
      <p>In that context, I do not think the unjoined b or q will be strong enough. Is there a reason not to join them, considering all the other shapes? They jar me. The serif version of Salamanca (it is coming, yes?...) might be the place for such experiments. Otherwise this has such nice color and a comfortable feel for reading. Don't stop!</p>
    html_clean: |-
