      <p>"Kris may have more to say about this, since we only exchanged quips, but the reason he cited (“I like it like that”) sounds to me like he is attached to those gaps for no functional reason, and has not tried eliminating them yet."</p>
      <p>Of course I haven't tried eliminating them, I see absolutely no problem with them. I read text set in type that has similar forms without trouble, I read text set in Feijoa without trouble! If they upset you then that is a shame. At this stage I am not going to change it. If there is overwhelming feedback that supports your concern, then I will consider changing the forms. </p>
      <p>"The designer has to try many things, letting go of favourite elements." </p>
      <p>I have tried many things, I have let go of favourite elements. But erasing every little quirk or detail I like that may not be deemed purely functional will render the typeface dull &amp; overworked. I have already spent far too long on this already. I cannot help that I want parts of me in there, parts that I like, for designing type gives me great pleasure. I cannot work dispassionately, that would kill the buzz, especially when it is an uncommissioned typeface. </p>
      <p>I suppose the function in these forms is to give me pleasure. </p>
      <p>"Who would say that pleasure is not useful?"<br>
      —Charles Eames.</p>
