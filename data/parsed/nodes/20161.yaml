      <p>Not to bump or anything, but it really is going to be released soon! We are just working on the OT implementation &amp; cross-platform compatibility. This is a screenshot from the FontExplorer Glyph palette. </p>
      <p>I think it covers the following languages: Afrikaans, Albanian, Arumanian, Asturian, Azerbaijani, Basque, romanised Belarusian, Bislama, Breton, Bosnian, romanised Bulgarian, romanised Burmese, Catalan, Chamorro, Chichewa, Cornish, Croatian, Czech, Danish, Dutch, English, Old English, Middle English, Esperanto, Estonian, Faroese, Finnish, French, Frisian, Friulian, Galician, German, traditional German, transliterated Greek, Greenlandic, Guarani, Hawai'ian, Hungarian, Ibo, Icelandic, Indonesian, Irish Gaelic, Italian, romanised Japanese, Kashubian, romanised Kazakh, romanised Korean, Kurdish, romanised Kyrgyz, romanised Laotian, Latin, Latvian, Lithuanian, Livonian, romanised Macedonian, Malagasy, Maltese, Maori, Marshallese, Moldavian, romanised Mongolian, Norwegian, Occitan, Polish, Portuguese, Romanian, Romansch, romanised Russian, Inari Saami, North Saami, Lule Saami, Skolt Saami, South Saami, Samoan, Scots, Scottish Gaelic, Slovak, Slovenian, Lower Sorbian, Upper Sorbian, Spanish, Traditional Spanish, Swahili, Swedish, Tagalog, romanised Tajik, romanised Tatar, Tswana, Tongan, Turkish, romanised Turkmen, romanised Ukrainian, Ulithian, Uzbek, Walloon, Welsh, Wolof, Yapese, and many transliterated South Asian languages.</p>
      <p>Chur!</p>
      <p>—K</p>
