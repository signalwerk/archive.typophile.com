      <p>Oooh! Zing!  ; )</p>
      <p>But Oliver, that's not the only design of mine, nor is it mine originally. I get credit for it, and for Adobe's woodtype 3 package, because I finished them, not because I originated them. Be careful going down that path, Oliver. On typophile, where people might seem anonymous, it's a minefield. For instance, which are your typefaces?.....  </p>
      <p>Chris, and Kris: Hrant is catching something I think you both missed: I'm not in any way critiquing the style of Feijoa. This design, along with Kris' other designs, absolutely sing with style, inventiveness and freshness. Honestly? Kris is one of my favorite new typeface designers. But here, where Kris has stated an intention to design a text face, style is of secondary importance: ALL my comments refer to the function, the performance of it in running text. The style of Feijoa would not be harmed by my suggestions. I'm making these comments, not out of cowering fear of breaking convention, but to ensure that the style of it is not marred by a flaw in structure. </p>
      <p>Despite all this, It sounds like nobody else is having this issue, so maybe it will not be a problem after all. I also realize it was earlier this year, on a different thread, when Kris solicited free commentary, that I should have pointed this out. Apologies, Kris, for throwing a wrench in at the last minute. Carry on, and I will welcome Feijoa along with multitudes of others, I am sure. As I've said, this design has some qualities that are very rare and very desireable. Rich color, deep warmth, and sprightly proportions. Good luck when you get to the Village!</p>
