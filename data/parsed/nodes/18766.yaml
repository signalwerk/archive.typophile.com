      <p>After successfully launching Portfolio, we decided to create a simplified version.<br>
    <a href="http://mail1.icpbounce.com/icp/relay.php?r=1013299288&amp;msgid=2263287&amp;act=YK5P&amp;c=27410&amp;admin=0&amp;destination=http%3A%2F%2Fwww.fontselect.com%2FMerchant2%2Fmerchant.mvc%3FScreen%3DCTGY%26Category_Code%3Ddiplomat">Diplomat</a> is pretty simple but the swooping ascenders and descenders creates the illusion of a more complex script.<br>
    Diplomat is useful when clear communication is essential<br>
    Diplomat, in combination with its elegant lowercase, creates a very elegant presentation<br>
    useful for Invitations, Corporate Identities, Brochures, and Headlines.<br>
    Wed like to remind you that if you buy ANY of our fonts<br>
    you will get the next one at 50% off - AND there is NO limit to how many you may buy.<br>
    We still offer secure, direct, online payments using all major credit cards.<br>
    Your font download instructions will automatically and immediately be emailed to you.</p>
