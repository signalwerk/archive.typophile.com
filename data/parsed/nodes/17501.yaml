      anybody - but now that it’s with us, milk it baby!  :-/</p>
      <p>The question that remains for you to answer, William:<br>
      Why do people persist in thinking blackletter is Nazi, so<br>
      many years on, and after the fact that they disowned it!</p>
      <p><strong><cite>And what are you, as a typophile, and a believer<br>
      in fairness I presume, prepared to do to correct that?</cite></strong></p>
      <p>&gt; Neo Nazis and white supremacists do.</p>
      <p>And only because that’s the general (if implicit and<br>
      silent) feeling among most everybody. Certainly not<br>
      because they’re exceptionally insightful!  :-/ They’re<br>
      the only people who use it “positively”, but much more<br>
      frequent is its “negative” use. Remember the billboard<br>
      in West LA with side-by-side portraits of Stalin, Hitler<br>
      and Saddaam, with a swastika strategically emblazoned.</p>
      <p>And just like the swastika, blackletter is used to mark<br>
      non-Nazi and even non-German things that are anti-Jewish.<br>
      Crazy? Check out the cover of this novel...</p>
      <p></p><div class="imageWrap"><img src="/files/lipstickjihad.jpg"></div><p></p>
      <p>Nevermind that the Nazis thought as little of Arabs as they did<br>
      of Jews! :-/  There just weren’t many Arabs (certainly not rich<br>
      or powerful ones) in Nazi territory.</p>
      <p>Don’t get me wrong, I think it works. If the Turks had a logo<br>
      or a typestyle that was associated with them in the general<br>
      consciousness, we’d leverage it too! The problem is when power<br>
      is abused, and when admissions are lacking. That’s what gets<br>
      so much of the world pissed. But that really is getting off-topic.</p>
      <p>&gt; it is a case of not ‘either-or’ but ‘both-and’</p>
      <p>More -typical- binarism. Is there nothing between full equality<br>
      and full hierarchy? I contend that <cite>everything</cite> is in between.</p>
      <p>Maybe the Nazis wouldn’t have gone ahead with the disowning of blackletter if they hadn’t managed to concoct such a crazy excuse; but the important thing is the intent, and in this case the intent was to facilitate imperialism; something many people <cite>today</cite> can justly be accused of. And it’s not like crazy excuses have<br>
      gone out of fashion either...</p>
      <p>&gt; ...or Kaas from Village ...</p>
      <p>Now Kaas, that’s something we need to be paying attention to.<br>
      It’s politico-cultural relevance and fearlessness is a wonder to behold.</p>
      <p>hhp</p>
