      <p>&gt; type design is more like archicture than it is like graphic design</p>
      <p>The architecture analogy is common, and does sort of work,<br>
      but a much better one I think is that of... shoemaking!<br>
      Especially when you include text fonts, not just display.</p>
      <p>But one thing about type design that’s quite hard to find<br>
      a parallel for is that we make tools, not end-results.<br>
      This combined with the expressive potential (not highly<br>
      present in the making of a screwdriver for example)<br>
      makes it really quite unique I think.</p>
      <p>hhp</p>
