      <p>Yep. I wanted to include this view too but decided to restrict my account to the basic events. It’s the paradox of that whole episode during World War II—-by banning blackletters the Nazis sought to dissociate themselves and their twisted ideology—-not so much from the blackletter tradition and what it really represented—-but from the Jews, as a way of maligning them further. Yet somehow that dissociation has been reversed into an association, identifying blackletters with Nazism.</p>
      <p>Its a terrible misfortune for blackletters, and a tragic disservice to the German people of the present. In western eyes blackletters = Nazism = Germans.</p>
