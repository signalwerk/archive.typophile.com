    <p>A reporter emailed me this morning asking why type designers and typographers are so passionate about our craft. She believes, perhaps rightly so, that we are even more passionate about letterforms and their use than many generalist graphic designers are about their particular industry.</p>
    <p>Is this true? Why? I promise not to steal your pithy quotes and use them as my own; I’m asking because aside from the usually-repeated trope (that so much visual communication is bad, that our tools are misused so regularly, that so many ’professionals’ are unfamiliar with their correct use that we MUST vigilantly proselytize / educate not just professionals but all makers and consumers of communication as well), well, I just can’t say it any more succinctly than that.</p>
    <p>But that’s just my own lack of articulation and imagination. Aside from the inherent beauty of good type and good typesetting, what am I missing?</p>
    <p>The reporter’s email address indicates that she is at the Columbia School of Journalism - not sure if this is a CJR project or another endeavor entirely.</p>
    <p>I will simply steer her toward this thread if it generates useful dialogue.</p>
    <p>Yours</p>
    <p>Joshua</p>
