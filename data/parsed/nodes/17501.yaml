      <p><em>Carpentry, hammers and nails are only components in architecture and cannot be considered architectural design.</em></p>
      <p>Sorry, that’s a harsh interpretation. To be more precise: carpentry <em>can be</em> an element in architecture, but is more typically a component or sub-building block. Architecture is made up of elements: wall, roof, door, widow, column, frame, post, lintel, pediment, architrave, plinth, stylobate, frieze, etc. When these elements are made of wood, carpentry is a method of fabrication. Nails are materials, and hammers are sub-tools that never become components in finished architecture—-unless the builder is a surrealist (an appealing idea, imagine a hammer permanently fixed in a wall as part of the architecture :^).</p>
      <p>Several people have compared fonts to tools. Vis-à-vis designers use fonts as tools and a form of visual plumbing that “powers” communication arts. But fonts are more than tools or plumbing—-fonts consist of detailed ready-made artwork that designers use as both tools and major elements in graphic design. That makes fonts analogous to <strong>machines</strong>. Like cars for example: cars are tools of transport, and also elements of lifestyle, industrially-designed sculpture prized for their aesthetic as well as their practical value (as tools). Fonts fulfill a similar role in communication design—-aesthetic machines.</p>
      <p><em>...my own lack of articulation and imagination.</em></p>
      <p>Josh, you founded Tyopgraphica. That’s inspired and imaginative :^) Articulation is sometimes expressed as love and commitment for a thing, for you, typography.</p>
      <p>j a m e s</p>
