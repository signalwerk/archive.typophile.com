      <p><em>I think the consensus is that was a “bonus”. :-/ The real<br>
      reason was that the more their empire expanded the less<br>
      their subjects could read their commands.</em></p>
      <p>Ah-ha, thanks for bumping my memory. I know I’ve read that somewhere. The ’they pinned it on the Jews’ theory fits the standard view of Nazism a bit too perfectly.</p>
      <p><em>conveniently ignored</em></p>
      <p>History is a pile of debris.</p>
      <p>“History is an Angel being blown backwards into the future. And the angel want to go back and fix things—-to repair the things that have benn broken—but there’s a strom blowing in from paradise. And the storm keeps blowing the angel backwards—-into the future.”</p>
      <p>That’s Laurie Anderson’s retelling of Walter Benjamin’s Theses on the Philosophy of History.</p>
      <p>The storm = progress. Paradise = idealized historical vision.</p>
      <p><em>And there are certain people who actually benefit from<br>
      maintaining this, as well as having a typestyle one can<br>
      hold up as a symbol of the enemy (since typestyles can’t<br>
      fight back). In perspective, a very minor crime, but in<br>
      our context one we should reveal and reverse.</em></p>
      <p>Sad. Very sad. I’m as eager to reverse it as you.</p>
      <p>Could this be made the topic of a presentation for Typecon one year? To make the initiative pay off it would need press coverage. Better yet, put the presentation on the road; tour it across the states and put up a supporting website. Deluge the news media with press releases for each venue to ensure continuous coverage.</p>
      <p>If we really want to fix this problem it isn’t enuff for us to talk about it, and lament, in this obscure environment.</p>
      <p>Another idea springs to mind: quite a few typophile regulars are very keen on blackletters. The weekly type battle comp is fun, but can we channel that level of enthusiasm into a billboard campane? The lecture tour would make good grass roots work but probably preach mainly to people already interested in communication arts.</p>
      <p>To reach the guy/gal in the street, billboards can’t be beat.</p>
      <p>best regards,<br>
      j a m e s</p>
