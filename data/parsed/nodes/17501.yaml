      <p>Funny, I was wondering about this (sort of out-loud)<br>
      to my class last Thursday, cautioning them that they<br>
      might find themselves falling into an obsessive chasm!  :-)</p>
      <p>I think type designers are passionate -to the point of mania sometimes- because they make self-contained little things with no direct meddling from the outside - it’s a one-man thing almost all the time. They work forever on these viral little machines, and understandably become a little bit full of themselves and overly attentive to the smallest details.</p>
      <p>&gt; 1. When is typography political?</p>
      <p>Type design can be political quite easily in the non-Latin realm. For example my Nour&amp;Patria system (good news from CR on that soon) is largely an extension of the desire to combat what’s called the White Genocide of Armenians: cultural assimilation in foreign lands, which is a huge deal for us when you consider that most Armenians live outside Armenia (thanks to the Turks).</p>
      <p>&gt; 2. Why do so many typographers have manifestos?</p>
      <p>Type design being a financially precarious<br>
      occupation, you almost have to be an idealist.</p>
      <p>&gt; 3. If typography is so important, how come some many people ignore it?</p>
      <p>Important compared to what? Frankly it’s not that important<br>
      in the global scheme of things, except when it tries to help<br>
      the vulnerable (which is extremely rare).</p>
      <p>But a big reason it’s ignored is that it’s partly subvisible.</p>
      <p>hhp</p>
