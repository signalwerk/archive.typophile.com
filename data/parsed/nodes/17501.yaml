      <p>“2. Why do so many typographers have manifestos?”<br>
      They don’t excercise enough, so they grow extra ones. I have seven on each foot.</p>
      <p>“3. If typography is so important, how come some many people ignore it?”<br>
      Ignore what? Who? I don’t understand the question.</p>
