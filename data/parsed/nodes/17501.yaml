      <p>As both a graphic designer and a type designer, I think the difference is that type can be a system unto itself—not necessarily a closed system but one with boundaries (albeit fuzzy). In the Platonic sense of “Seeing Forms”, we may see ourselves as privileged to “knowing” the forms of letters in their absolute sense. We might even design a typeface that pushes at the boundaries but we know well enough what the essence of those forms are so that they are not lost in the abyss beyond the boundary. Type design is both taxing and exhilarating (the moments of exhilaration are few and brief though). Passion is part of the long struggle to achieve those brief moments.  Seeing our labors minimized by being stolen or badly used can make me cry out, “NO!, that is not why I poured my life into that musical score of letterforms!”</p>
      <p>ChrisL</p>
