      <p>I second the comment that type draws the obsessive-compulsives among us.</p>
      <p>Creating a system of glyphs requires an unparalleled amount of work before any tangible results are possible. Leaving aside the work of tweaking beziers, defining kerning tables, interpolating new weights, or creating ligatures and alternates for entire typefaces are all extremely tedious. Naturally those who put themselves through such tasks either enjoy minutia way too much (and therefore cue in to it in their daily lives) or just love the results way too much (and therefore are necessarily obsessed about them).</p>
