      <p>&gt;“graphic designers are obsessive, but type designers are even more obsessive…</p>
      <p>This isn’t necessarily personality, but the demands of the craft. Type is small, but every letter is multiplied thousands of times,so the slightest blunder is amplified by multiplication and looks bad.  Of course you need the personality to meet those demands. But being insane is not a *requirement* :)   </p>
      <p>There are analogies in other crafts. In cabinet making, if you join two pieces of wood, you have a certain tolerance—you can go plus or minus a certain distance from your mark (1/16”?), and it won’t matter. If you are machining two pieces of metal to fit together, the tolerance is less. Is joining metal more ’obsessive’? I would say just that the demands of the crafts are different. </p>
      <p>Graphic design—which chooses and lays out type, among other things—is on a bigger scale than type design, so the tolerances are a little greater, like wood vs metal.</p>
