      <p>Nice Post William.</p>
      <p>&gt; “1. When is typography political?</p>
      <p>I am guessing she means ’political’ as in on typophile or within the larger body of type makers. As in Internal politics. As in Why do typo-nuts disagree with such intensity? As in ’After all it’s only type...’ That kind of thing. </p>
      <p>Or was she thinking about historical political use ( like when Communist china created simplified characters &amp; Taiwan kept their older more complicated characters) or current geopoltics. Each of these would be a valid angle to persue.  But I wonder what SHE means.</p>
      <p>&gt; 2. Why do so many typographers have manifestos?</p>
      <p>Controversy is a long free advertisement - and we don’t have big ad budgets. It worked for  artists &amp; art movements - so why not us?</p>
      <p>&gt; 3. If typography is so important, how come some many people ignore it?</p>
      <p>Hrant’s answer is excellent. I can only add that many many really important things work without our realizing they are there or that they are working. electricity, radio, sewers, the internet &amp; the list goes on. And most people further have no idea how they work. That doesn’t stop them for taking full advantage though. Or wailing when they go away. I for one *adore* indoor plumbing. Can you imagine being denied the use of writing? </p>
      <p>But Type isn’t just writing. Type works two ways: It communicates what is being said but then it goes further &amp; communicates how it’s being said. The initial instance is assumed &amp; is a baseline. Types do it with different degrees of success in different media, environments, cultures &amp; individials. Type design is &amp; should be influenced by this purpose. The second instance is more subtle &amp; more culturally bound. People read type style (and facility with the use of type) like they do fashion - they take it too mean something without noticing that they are making a judgement. Is that important? Only to the degree that you want or need to communicate really effectively. For you or me it may be of marginal importance. In contrast for Advertisers and Media companies it means a very great deal.</p>
