      <p>But really, probably even more effective than conference presentations<br>
      would be the actual making and release of good, contemporary blackletter<br>
      fonts, so that sympathetic graphic designers can use them on the ground,<br>
      thus getting people at large to really think about it. It would be critical<br>
      though that the fonts look of this age - and that’s certainly a tricky one.</p>
