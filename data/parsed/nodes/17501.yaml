      <p>Guys, thanks for taking this up. </p>
      <p><em>Ah-hem… this is actually something I’m working on. Unfortunately, I can’t go into tremendous detail here on a public forum, but please stay tuned. Professionally and privately, I’ve got a few plans that will come out later this year.</em></p>
      <p>Cool. I’ll wait patiently. This is a good sign.</p>
      <p><em>...although these later are display fonts, and not real blackletters, per se</em></p>
      <p><a href="http://www.myfonts.com/fonts/sentinel/rhodaelian/" terget="_new">Rhodaelian</a> is a display font too, and a step in the right direction, I think, towards bringing blackletter closer to roman forms. When I started designing it its spec was to be a classy Compacta challenger with millenial smarts influenced by the current sculpted, chiselled style of automotive body design. When it was finished I realized the sharp corners combined with Rhodealian’s rigourous modularity to make it a contemporary blackletter (with lower contrast than traditional blackletters). Not what I set out to do, but I love the result. “Happy accident”? No, more like bending and pushing within an established discipline resulting in expansion of that discipline.</p>
      <p>Shuould I post a Rhodie sample on this thread? </p>
      <p>I’m certain I could make a text-friendly version.</p>
      <p><em>To think that it is not in a vendor’s best interest to support blackletter is silly.</em></p>
      <p>I didn’t assume that is the case, if that’s what you mean. Whatever, I was looking for ways to make a blackletter renaissance viable; it needs commercial support.</p>
      <p><em>Some vendors are sitting a top large piles of blackletters fonts that no one buys or uses.</em></p>
      <p>Yeah, its such a stupid waste.</p>
      <p>j a m e s</p>
