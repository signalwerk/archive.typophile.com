      <p><cite>Why are we so passionate?</cite></p>
      <p>It’s the inevitable response to having one’s craft ignored, misunderstood, and under-rewarded (I’m thinking of the amount of expertise and time vs. recognition and monetary compensation). Those who aren’t passionate probably wouldn’t bother. Though, on the flip side, would it really be so great without so many passionate people involved?</p>
      <p>Also, once you’re awakened to the finer points of type and typography, you see it <em>everywhere</em> because many cultures plaster type all over everything (ususally ads). So imagine if you were exposed to your pet peeves over and over all day long. I’ve had friends who are not designers or typographers become aware of things like typefaces and kerning (letterspacing), and now they can’t stop noticing it. It really is like a sickness, but a wonderful one.</p>
      <p>The pervasive nature of type and typography also means that awareness and mastery of it is directly tied to one’s ability to effectively communicate (and persuade) others. It can feel very empowering to know that simply how you <em>organize and characterize</em> your words can make them more powerful/effective. It’s subtle, but that’s part of its power: flying below people’s radar, straight to their minds.</p>
      <p>Plus, it’s got creative, aesthetic, and expressive components, which are inherently emotional and therefore passionate.</p>
      <p><cite>1. When is typography political?</cite></p>
      <p>See <a href="http://en.wikipedia.org/wiki/Jan_Tschichold">Jan Tschichold</a>, or the more concise <a href="http://www.typophile.com/wiki/Jan%20Tschichold">Typophile wiki</a>.</p>
      <p><cite>2. Why do so many typographers have manifestos?</cite></p>
      <p>Few people listen to discussions of typography unless you shout and over-simplify. Just like politics. Also, it’s a bunch of passionate people who spend long periods alone fidgeting with minutae. That can make one...very emphatic.</p>
      <p><cite>3. If typography is so important, how come some many people ignore it?</cite></p>
      <p>The typewriter and the computer. The typewriter made ’typesetting’ accessible to the general masses while simultaneously obliterating it. Then, the computer eventually brought back all of the controls and visuals to people who had typewriter-based knowledge, making sophisticated typography appear ’easy’ and ’automated’. Now, everyone’s mother believes they can typeset simply by spilling copy into a word processor. Technically they’re correct, but that’s akin to saying “I’m a pressman” because you own and maintain a laser printer.</p>
      <p>And what Hrant said.</p>
