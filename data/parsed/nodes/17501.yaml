      <p>Reading over the comments here I would summarize:</p>
      <p>1. A large part of the reaction of surprise or amusement that type designers are passionate about their work often comes from the fact that the questioner doesn’t find type interesting.</p>
      <p>2. Because of market conditions if you are not passionate about type design you don’t do it. </p>
      <p>3. Type design has a lot that is delightful for those who do it, as well as having some tedium. For the delights see above. </p>
      <p>On politics, I do think that type design is reactive to great political and social movements, and not an influence for social change. (Printing itself, the internet etc are influences.) Design, including type design is sometimes a tool of propaganda for various movements. </p>
      <p>Finally, a taboo question: Is the pleasure of handling those sexy curves why most type designers are men?</p>
