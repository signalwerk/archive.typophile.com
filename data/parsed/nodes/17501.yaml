      <p>There are many styles of writing and lettering that have become extinct. I don’t think that we have an obligation to try and revive any of them. Type lives in context, and although type can almost always adapt to new contexts, the world does always go on, in both good ways and bad.</p>
      <p>Nevertheless, my little corner of the world has seen some of the most creative blackletters developed right inside of it (I’m not talking about Germany itself, rather just the Main-Rhine region around Frankfurt etc.). I’d hate to see that disappear permanently. I think that designers have a responsibility to preserve the visual culture around them, but it other designers don’t do this, I can’t force them. For instance if central Indiana has a great historical design scene that up and dies, I’m not about to be the one to step in and save it. Everyone has their own borders.</p>
