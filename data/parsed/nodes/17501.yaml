      <p>I recently received a copy of <em>American Type Play</em> by Stephen Heller and Gail Anderson. In the introduction, Heller surveys the history of typographic development, by itself and in relation to society at large, to the present day (OK, 1998, but same thing), and he concludes that, because of their evocative power, typefaces have become <strong>objects of desire</strong>, which made perfect sense, since the whole business of advertising is directed toward creating in us needs we never knew we had, and typography and advertising go hand in hand.</p>
      <p>So, typ<strong>ographer</strong>; porn<strong>ographer</strong>. Mere coincidence? I think not...</p>
