      <p>I think that because the barrier to being a graphic designer -or being seen as one- is relatively low and because the barrier to being a type designer -or being seen as one- is comparitively high you have there is a natural distilation of passion, madness or whatever characteristic you prefer. </p>
      <p>Also, if graphic designers are any good they looking for specific results from their work which means watching things crash &amp; burn or succeed. All that crashing means that passion is tempered with a certain pragmatism after a while. Which makes their craft a bit less hypothetical than ours is. I can’t say that we are immune from that, but of neccessity, a bit more removed from end results and our passion isn’t checked as regularly as a result.</p>
