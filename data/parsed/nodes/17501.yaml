      <p>There was an interesting comment by Jean François Porchez, saying that type design is more like archicture than it is like graphic design, and that he is passionate about type design, but not about graphic design. </p>
      <p>One of the features of type that resembles architecture is that it consists of enduring objects, and is generally speaking less ephemeral than much of graphic design, which goes for advertising and business uses that are normally quickly forgotten. Another feature is that because it you have a finite bunch of designs that have to work with one another, it inspires an effort at perfection, or at any rate at a level of polish and finish that you would find in other design of lasting objects: archicture, industrial design, fabric design.</p>
      <p>Another thing is that it is a great art, as well as a craft. The Chinese know this as they rate calligraphy even higher than painting, I believe. Of course type design is not calligraphy, as the challenges are quite different. But they share the fascination of abstract symbols which mean nothing in themselves that come together to express every nuance of thought and color of passion of humanity. When these some together with an artistic beauty, as well as serviceable craft, the result is quite wonderful. </p>
      <p>The fact that type design is much less appreciated than architecture is, I think, just a matter of general ignorance. To me type design is a great art that is both invisible to the public, and moves them for much of their day—a wierd and fascinating combination.  </p>
      <p>At TypeCon I observed that type design is one of the not so many things that people want to do for its own sake, like music and poetry. It is just so enjoyable and satisfying that they do it first, and and then try to figure out a way to make a living out of it second.</p>
