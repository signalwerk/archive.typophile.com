      <p>The two things that I’ve recognized that make type design important to me are:</p>
      <p>1) We’re not working the machine, we’re working in the guts of the machine. It is more like plumbing in that we’re working a level deeper than graphic design. We’re making the tools graphic designers use. The only reason the tools work is because people are passionate about them, even in the face of disinterest. A home owner may appreciate good carpentry and even know who the carpenter was, and a carpenter may appreciate a well designed hammer, but neither of them ask who designed the hammer. And they’d be even less interested in who designed the nail the hammer was used on.</p>
      <p>2) We really have no idea what we’re doing. Just how do little marks on a page transmit thought? Makes no sense really. We have a pretty good idea what happens up to the back of the eyeball, and we know what parts of the brain translate the information, but how on earth can you read a line of Shakespeare and understand what went through the mind of a man who died a few hundred years before you existed? And yet we know how to make those little marks have meaning in relation to this process and what we do in designing typefaces really matters in the reading process. Something has to be built into the human brain that makes it possible for people to design type by intuitition. I think it’s the most exciting thing I do except for playing with the grandchildren.</p>
      <p>George</p>
      <p> I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
