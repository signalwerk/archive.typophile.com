      <p>Why are type designers passionate about their craft? Even more than typographers, it is very hard to make a decent living at typography. This has two results. First, most people who aren’t passionate about type design are weeded out automatically, because with inadequate pay there’s little other reason to do it. Second, people who continue to design type without making much money may then assume they must be passionate about it, thanks to the principle of <a href="http://en.wikipedia.org/wiki/Cognitive_dissonance">cognitive dissonance</a>. Or maybe not.  :)</p>
      <p>Cheers,</p>
