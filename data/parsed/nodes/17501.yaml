    html: <p>For me it’s that I think a lot of graphic design is separated from its content, which I think can often lead to stylish but interchangeable design. On the other hand, I think type designers and typographers — because we care about the right typeface(s) for a particular application — are generally more deeply invested in meaningful connections between design and content, and so I think that approach leads to a more holistic — and passionate — design experience.</p>
