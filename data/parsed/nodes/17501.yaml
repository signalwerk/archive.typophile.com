      <p>I have seen Fraktoer on your site, but otherwise I don’t know anything about it. I presume that Hans Heitmann is still alive, so getting in touch with a foundry (or other channel) about distribution is a ball that is in his court (or yours) at the moment.</p>
      <p>However, that isn’t necessarily the direction that I would personally go in in terms of a blackletter face to work in <strong>text</strong> sizes. Personally, I think that it is too stylized to be very efficient.</p>
      <p>Before the 20th Century, it wasn’t a problem for punchcutters to cut six-point blackletters that were fully legible. I think that those older forms are more legible than Fraktoer’s. </p>
      <p>The mistakes that brought about our present situation were foundry decisions during the late-20th century: since the photo-typesetting era, no one has seriously released or promoted a blackletter whose weight was optimized for text. Most of today’s popular blackletter fonts are just digitations of the <strong>display</strong> sizes of centuries-old designs…</p>
