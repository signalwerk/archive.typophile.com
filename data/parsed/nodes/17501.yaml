      <p>Like practically all other arts, <em>passion is a requirement</em> for success at type design. It isn’t much different in that sense from music, dance, drama, writing, painting, drawing, filmmaking and other visual arts. Every musician I know personally is very passionate about what they do. Their passion is fundamental to their human condition—-their musical human condition. It’s vital and necessary to their art and the crafting of their music. Their craft produces their art. The same applies to every writer and actor I know personally. Likewise the task of designing fine typefaces demands attention to small details.</p>
      <p>The obsessive-compulsive syndrome applies to some type designers but not others. We don’t all function that way. I know at least two other type designers who fit the obsessive-compulsive shoe. One would never admit it, while the other knowingly declares himself so.</p>
      <p>One man’s pleasure is another man’s pain<br>
      One takes a picture he will never see again</p>
      <p>Me: The O-C syndrome does not fit my personality or behavioral inclinations so I reject it. Grappling with repeated minutia is the part of font-making I enjoy the least. Designing the principal character set in minute detail is fun and rewarding; constructing all the extra parts that make up a full font is an arduous and depressing chore I force myself to do (altho fitting all those pieces together can be fun). The desire to complete each font provides some of the motivation I need to overcome the challenge of repetition. The remaining impetus comes from an innate <em>passion</em> for what I’m doing. This passion is an intuitive and natural emotional response to the art. Passion is a large part of every artist’s <em>inner life</em>, and becomes a significant part of our real lives. Artists are as artists do. </p>
      <p>In short, it’s an abiding interest.</p>
      <p>Non-artist friends say I am “obsessed” with art &amp; design. What crap. They simply don’t understand what they’re talking about. They have a much lower tolerance than I do for dealing with repetitive detail—-and I thought my pains for infinite repetition were low(!) I don’t share the enthusiasm my friend has for classic sports cars, but it would never occur to me to label him “obsessed”; they’re just his passion, and only one part of a balanced domestic life. “Obsessed” implies complete absorption by a single activity. The same passion-not-obsession applies to the themes I pursue in the fonts I make. Those who think I am obsessed with futurism and linear design fail to comprehend that those are just the themes that interest me—-the material I have the most enthusiasm for. Why does it have to be “obsession”?</p>
      <p>Because people say it is.</p>
      <p>Not for me, thanks.</p>
      <p><em>Of course you need the personality to meet those demands.</em><br>
      Practitioners don’t necessarily “need” that kind of personality, but it certainly helps. You need it to produce fonts full-time for a living.</p>
      <p>One thing that concerns me is the loose wielding of the term “obsessive-compulsive” by graphic designers, type designers, laypeople, journalists—-by just about everybody in relation to type and graphic designers. Apparently there are two kinds of <a href="http://en.wikipedia.org/wiki/Obsessive_compulsive" target="_new">obsessive-compulsive</a> syndrome. 1)&nbsp;Obsessive-compulsive disorder; 2)&nbsp;Obsessive-compulsive personality disorder. I call it a “syndrome” because I believe “disorder” is a misguided and unfair label, and a misapprehension of the phenomenon. Only since the invention of analytical psychiatry in the 20th century has this kind behavioral tendency (or personality trait, take your pick) been called a disorder. In all pre-20th century recorded history the “O-C-afflicted” were called, simply, artists, artisans, craftsmen and technicians. Calling their behaviour a disorder implies some kind of malfunction, or that the person is somehow defective—-a potentially fatuous insult to those who happen to fit the syndrome.</p>
      <p><em>The fact that type design is much less appreciated than architecture is, I think, just a matter of general ignorance.</em> </p>
      <p>True. But how did this state of affairs come to be?</p>
      <p>Type is a passive experience; architecture is an interactive one. Type is a reflexive shaper of human condition; architecture is the practical cradle of everyday living (the human condition). </p>
      <p>Type and lettering are as visible as architecture, but people are not forced to deal with lettering consciously or mechanically. We read text, absorb the message and emotional resonance suggested by the type style—-and we’re done. The experience takes place largely inside our minds. Type is everywhere, and subliminal, existing as embedded virtualities†, but we don’t live inside fonts or interact with them the way we dwell in and outside buildings, and interact with architecture. To read the title on a book cover and sense the emotional impulse of the typography I don’t have to interact with it physically, or manipulate it mechanically in any way, or be conscious of typography’s hidden mechanisms. Pretending to be a lay person for a moment: To enter my house I have to open and close the front gate, and the front door (architecture is practical). To get to the kitchen or the bathroom I have to negotiate the hallway. The house is an object of architectural design I interact with on a personal wavelength, forming a close familiarity over many years. </p>
      <p>The non-typographer/non-designer rarely has anything to do with typographic design, whereas a large percentage of lay people acquire at least a passing familiarity with architecture by building or renovating houses, and from living in them. For non-typographers, type is not necessarily a personal experience, but more frequently a mass experience. Fonts are served up to the public by designers in automatic fashion. Lay persons do not acquire or seek particular fonts on the products they buy‡; they are not given a choice (in commercial artwork). Whereas specific architecture is chosen and sought out by lay people and designers alike, and it’s a manual, individual, personal affair. Can I choose the font used for the titles of a movie I want to watch? Nope. Its design is a form of mass-produced industrial art—-take it or leave it, whole. If I watch the movie I’m forced to take it. But if I don’t like the architectural details of the house I’m buying I can force the architect to change those details instead of choosing another house.</p>
      <p>Architecture is customizable—-typography is consumed unaltered.</p>
      <p>The buildings we work in determine our human condition too. When an artfully-designed office building from an earlier century is demolished and replaced with a sterile, soulless, featureless lump clad in mirror glass outside and stainless steel inside, the change exerts an impact on the people forced to work in the replacement building with its dubious architectural value*. It changes their view of architecture, cultivating awareness and cognition of architectural design.</p>
      <p>† If I remember correctly, <em>embedded virtuality</em> is a term coined by Xerox PARC and MIT media lab researchers to describe software running on personal computers (desktop, palmtop &amp; wearables), as a replacement term for the cyberdelic meta-twaddle “virtual reality”, which does not exist as such, ie: “virtual reality” is a fanciful term because it isn’t realistic yet.</p>
      <p>‡ Then again, the products consumers choose to buy are partly determined by packaging and advertising typography, allowing them to choose fonts in a sense.</p>
      <p>* What choice are we given? Accept working in the stainless steel casket or find a job in another building with spirit. Some workers report feeling dehumanized or culturally impoverished by bland modern and post-modern architecture.</p>
      <p><em>So, typographer; pornographer. Mere coincidence? I think not…</em></p>
      <p>If you’re joking, fine :^)  If not, the connection is superficial and purely philological. What about photographer, biographer, cartographer, oceanographer? The only thing these terms have in common is the suffix “ograph” meaning “of a graphic or visual nature”. No meaningful coincidence, just philological verismilitude.</p>
      <p><em>When is typography political?</em></p>
      <p>When the German Kaiser Maximilian I commissioned Fraktur (a blackletter) for use as a standard font thruout Germany to displace the antiqua style of the Italian area typographers. Antiqua had rapidly displaced blackletter thruout Europe as the standard font for printing with moveable type soon after the center of printing shifted from Mainz to Venice. Fraktur was Maximilian’s way of reasserting Germanic national identity. The plan failed because he did not follow it thru; during his lifetime the Fraktur face was only used to print books for the Kaiser’s personal library.</p>
      <p>Typography was political again in Germany during the reign of the National Socialists. Once again the schizm was between blackletter and roman type styles. The Nazis outlawed the use of all Blackletters, spuriously declaring them an invention of the Jews. Blackletters had been in continuous use and development from the Gothic medieval period until the 1930’s. The Nazi vilification of Blackletters stigmatized them as “impure” and “non-Aryan”, an unwanted aberration in their classical Teutonic scheme. That stigmatization has had a lasting negative effect on Blackletters right up to the present. Presently blackletters remain far more common in Germany than other countries, but nowhere near as popular as they were pre-Nazi. They continue to suffer an association with Nazism similar to the Swastika—-an ancient, innocent symbol before the Nazis borrowed and used it so prominently. </p>
      <p><em>A home owner may appreciate good carpentry and even know who the carpenter was, and a carpenter may appreciate a well designed hammer, but neither of them ask who designed the hammer. And they’d be even less interested in who designed the nail the hammer was used on.</em></p>
      <p>Carpentry, hammers and nails are only components in architecture and cannot be considered architectural design.</p>
      <p>How about the architecture of a home? Some home owners at least, take an interest the in the architectural style and detail of the dwelling they live in, choosing one style of architecture over another. And what about people who add extensions to their homes? Some decision about appropriate architecture has to be made to avoid reducing the value of the home by adding an extension in a conflicting style.</p>
      <p><em>We really have no idea what we’re doing.</em></p>
      <p>Really? (We?) Okay...as a writer and a designer of advertising, and a type designer, I know precisely what I’m doing and exactly how I do it.</p>
      <p><em>Just how do little marks on a page transmit thought?</em></p>
      <p>By way of language. Written language and the semantic meaning of words. Words and combinations of words embody emotions, ideas, thoughts, and human experience, codified in language and literary conventions we learn by studying and agreeing on their meaning. It’s called philology, writing and literature. No mystery.</p>
      <p>The “little marks on a page” don’t transmit thought; language and writing codifiy thought, and typography verbalizes it in visual form. We decode the visual form by reading the text and rationalizing its content.</p>
      <p><em>We have a pretty good idea what happens up to the back of the eyeball, and we know what parts of the brain translate the information, but how on earth can you read a line of Shakespeare and understand what went through the mind of a man who died a few hundred years before you existed?</em></p>
      <p>By cognition and ratiocination of what he wrote, and comparison with our own life experience. You read the text, perceive the narrative, then rationalize its meaning by deduction, comparing the bard’s thoughts with your personal memories. Everyone knows what a poobah (king) is, not to mention jealousy, love, hatred and rivalry—-all common themes in Shakespeare and other literature.</p>
      <p>The style of a roman text font used to print a literary work has little bearing on how printed words and their meaning are perceived. Text fonts are primarily functional machines. Set it in Caslon, Bembo, Clarendon, or something else close to the antiqua model...the “voice” of a text font at text point sizes doesn’t make much difference to meaning, as long as it’s readable. The inflection and voice of a specific type style only comes into its own in display typography.</p>
      <p>In a broad sense, Shakespeare’s mind is understood through the semantic content of his writing. To grasp the full import requires specific knowledge of the historical figures, periods and politics he wrote about. The bard’s work is densely layered in the extreme. People without that historical knowledge who say they understand Shakespeare are kidding themselves to varying degrees. Only readers equipped with the background knowledge can understand his work with accuracy and completeness.</p>
      <p>Okay Shakespeare lovers—-kick my arse.</p>
      <p>j a m e s</p>
