      <p>Why not go in a slightly different direction if you want contemporary? <a href="http://www.typotheque.com/fedra_serif_a_bold/">Fedra bold</a> by Typotheque is about as contemporary as you can get.</p>
      <p>I’m just not sure that slabs based on the Clarendon model feel particularly contemporary, though that would also depend on the usage.</p>
      <p>Of course, if you want to get crazy with a slab, try Storm’s <a href="http://www.stormtype.com/typefaces-fonts-shop/typefaces-199-farao-black">Farao</a>.</p>
