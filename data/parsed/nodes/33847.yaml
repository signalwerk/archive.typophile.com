    <p>hi all,</p>
    <p>I’m hoping you can give me some suggestions. I’m looking for a font with the general weight and structure of Clarendon Bold or ITC Bookman Bold, but with a much fresher, more contemporary feel. </p>
    <p>Realize that’s fairly subjective and apologize in advance for the ambiguity and lack of proper terminology.</p>
    <p>thanks,<br>
    jarrod</p>
