    html: |-
      <p>I think there's a bit too much going on there. I like the idea of overlaying the phrases, but I'm not so sure it works in implementation. It's a clever idea but is getting in the way of clearly communicating. </p>
      <p>I'd suggest keeping the two typefaces, but actually split the phrases (so that 'we are' is in a sans face, but not mashed into the 'welcome' phrase)</p>
      <p>EDIT: ah, you are wanting to web-safe faces. As such, I'd definitely suggest not mixing the faces in the same phrase, as you will have little control over x-height given the variety of flavors the faces you choose may come in.</p>
      <p>Also, there's no reason you can't also spec Helvetica and then let Arial be the fall-back. I'd suggest letting Georgia be a fall back for Century as well.</p>
      <p>Alternatively, maybe use this as an excuse to play with @font-face.</p>
