      <p>I think double phrase idea is A-Ok, it is trivial to recognize both parts. I agree with aluminum in that there is too much going on, but I think there's an alternative to what he is suggesting. Differentiating parts using both color <em>and</em> type is what is excessive. I would stick with the color difference and keep the type the same. It should work just fine that way.</p>
      <p>Also, as a side note - I <em>really</em> do not like this new trend of highlighting parts of the content by using different background color. Your version is probably one of the better ones, done with taste and restraint, but this still has too much of <a href="http://en.wikipedia.org/wiki/Neuro-linguistic_programming" rel="nofollow">NLP</a> context to it. Like 25th frame kind of thing. I am left with an impression that you are trying to hard to <em>force</em> me to notice things. If you want to highlight, do it conventionally, through italics or text color variation. Just my 2c, feel free to ignore.</p>
    html_clean: |-
