      <p>Two thoughts that might not help at all:</p>
      <p>1) When was the last time you used the ’Tools’ pull-down menu? There are some maintenance tools that could help. (Read the instructions first.)</p>
      <p>2) When was the last time you deleted the font cache off of your machine? I recommend <a href="http://www.versiontracker.com/dyn/moreinfo/macosx/22795">Font Finagler</a>.</p>
      <p>Maintaining the font collection is really important. You’d be surprised how easily it can become full of gunk.</p>
