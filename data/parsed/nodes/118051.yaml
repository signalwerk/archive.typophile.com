    html: |-
      <p>Yes, they certainly did hide it.<br>
      I also found lots of other useful ACTIONS in there as well, like EFFECTS &gt; PARALLEL.<br>
      Which lets you thin out or widen on one, or both axis.<br>
      You can also do multiple actions at once.<br>
      So you can make your font bold on both axis (parallel), reduce size (scale), then shift it to it's position.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Screen shot 2014-07-19 at 11_3628.56.11.png"></div><p></p>
      <p>Although I've still got to work out how to increase the spacing all at once,<br>
      may be another member has a better suggestion?</p>
