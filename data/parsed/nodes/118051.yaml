  html: |-
    <p>I need to move all glyphs 8 points to the right for improved spacing.<br>
    Is there any easy way of doing this across the whole font at once, without having to move each one individually?</p>
comments:
  - id: 583256
    user_id: 45717
    user_name: djnippa
    user_path: null
    date_raw: 17 Jul 2014 — 1:51pm
    date: 2014-07-17T13:51:00
    votes: null
    html: |-
      <p>Sorted it.<br>
      It was in TOOLS &gt; ACTION SET &gt; All glyphs in Font (drop menu) &gt; Available Actions &gt; Contours &gt; Shift &gt; Click the -&gt; arrow to add to the right side menu &gt; Horizontal Shift - Type 8 &gt; Vertical Shift -Type 0.</p>
      <p>Then RUN</p>
      <p>:)</p>
