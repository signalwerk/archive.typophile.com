    html: |-
      <p><a href="http://www.myfonts.com/fonts/linotype/berling/">Berling</a> is also close but not exact, especially the lower serifs on L and E, there is the strong possibility that the signage is based on a “font” that is specific to the medium, I assume there are limits to which metal can be created in three-dimensions and that a letterform would be designed to cope with the material and production. However, I’ve been wrong in the past.<br>
      Tim</p>
