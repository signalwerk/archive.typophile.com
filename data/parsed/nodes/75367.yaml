      <p>The touching lowercase are fine, but I think they should be more distant (even if touching) if you add a version for smaller sizes.<br>
      Personally I would not use this version under size 12 (I have looked at your PDF, I am not judging it printed, but it’s an overall feeling: forms benefit from being larger and spacing bigger if the text-intensive application is to be favored).<br>
      I like it. I think it would work very well in a lighter weight.</p>
