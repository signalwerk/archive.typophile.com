  - id: 438081
    user: 4763
    date: 2010-11-05T16:40:00
    date_raw: 5 Nov 2010 — 4:40pm
    votes: null
    html: |-
      <p>Herb originally had all weights from light to bold. I realised that it looks okay if the letters properly touch or not at all. If some combinations touch, others don't, some just a tiny bit, some just not, as it was the case, it looks odd. I decided to go for the properly touching option, which is the natural choice for the bolder weights, and make sure all combinations touch, not too little, not too much, or not at all. There are actually tons of kerning pairs because of this but one shouldn't brag with that. Also, I had to introduce a few contextual alternates to implement my either-or touching strategy.</p>
      <p>At some point, I might indeed work on further weights that do not touch at all but this would probably work only in the light weights, not in between.</p>
