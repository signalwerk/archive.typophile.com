    <div class="info">Submitted by <a href="/user/1160" title="View user profile.">Joe Pemberton</a> : 28.May.2003 11.38am </div>
      <p><b>Linotype Announces <br>International Type Design Contest 2003</b> <br> <br><a href="http://www.linotype.com/contest" target="_blank">www.linotype.com/contest</a> <br> <br>From March 2003 Linotype has the pleasure to invite type <br>artists around the world to participate in their fourth Type Design Contest. <br>This contest is eagerly awaited by type designers around the world, <br>as the past three belong to most successful in the world of type. <br>The contest?s goals and orientation have been accepted by the <br>international community of type designers. <br> <br>The deadline is the 31st December 2003. <br> <br>Besides encouraging and promoting new artists the contest's goals are <br>to detect and publish new and original trends in type design and <br>to support their development. Further the type design contest offers <br>the winners attractive prizes as well as the chance to gain <br>worldwide popularity through Linotype Library?s marketing. <br>Clear and fair license agreements are the basis for this relationship. <br>The contests international recognition offers type designers an <br>excellent opportunity to attract attention to their work. <br> <br>Designers, placing their fonts in the Linotype Library have something <br>in common with some of the most famous, i. e. Neville Brody, Matthew Carter, <br>Adrian Frutiger, Karlgeorg Hoefer, Hans Eduard Meier, Max Miedinger, <br>Peter Matthias Noordzij, Gottfried Pott and as far as Professor Hermann Zapf <br>and their typefaces Arcadia(TM), Industria(TM), Bell Centennial(TM), <br>Bell Gothic(TM), Shelley(TM), Frutiger(TM), Univers(TM), Sho(TM), <br>Omnia(TM), Syntax(TM), Helvetica(TM), PMN Caecilia(TM), Carolina(TM), Arioso, <br>Palatino(TM), Optima(TM), the latest release of Optima nova(TM) and Zapfino(TM). <br> <br>Further Linotype Library is a legitimate successor of traditional type foundries <br>and producers, such as Deberny &amp; Peignot, Haas sche Schriftgie</p>
