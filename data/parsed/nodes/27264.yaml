  html: "<p>As part of our ongoing initiative to create meaningful tools for the type community, we're pleased to announce a new feature at Typophile! <br> <br>Typophile Books : Peer Recommendations and Reviews <br><a href=\"http://www.typophile.com/books/\" target=\"_blank\">http://www.typophile.com/books/</a> <br> <br>What typography books would you recommend? What are your most cherished items in your collection? Do you have a top ten? It seems these questions come up all too frequently. Typophile Books is a resource to share and discuss your favorite books from the world of type, broken down into convenient categories. You'll also find links to live auctions of specimen books, rare books and the occasional announcement. <br> <br>Please stop by and share a few reviews of the books on your shelf. <br> <br>Regards, <br>Jared</p>"
