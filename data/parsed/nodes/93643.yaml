    <p>Hello All - </p>
    <p>Thanks in advance for your advice! I am working on a business card for a massage therapist friend of mine. She is an older lady, and wants to incorporate the idea of homeopathic healing into her card. She's studying ancient chinese fortune-telling called BaZi, and her tagline is "bodywork for the soul." So let's get new-agey. :) She also wants to incorporate a dove.</p>
    <p>For some reason, I am stumped on type. All of the samples I've seen of massage therapist cards have terrible type (and design). I'm considering something like Uralita, Amulet, or even Cassandre. But those might be too...celtic. Any suggestions?</p>
    <p>ALSO: We are in Dallas. So while some people are open-minded, many are conservative. Though she has a clear vision here, I don't want her card to limit her clientele if I can help it.</p>
