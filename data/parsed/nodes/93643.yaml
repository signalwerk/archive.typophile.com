      <p>Since I lived in Dallas for forty-five years, I feel reasonably qualified to say you can ignore the conservative types, because they aren’t going to give a hoot nor a holler for any New-Age Chinese mumbo-jumbo anyway. Your client’s likely customers will either be ignorant or sophisticated: aim your design at the latter group—which means elegant and understated.</p>
      <p>Or—if you must tip to your hat to a Texas frame of mind—go whole-hog medicine show and do a faux snake oil advertisement in woodtype...</p>
