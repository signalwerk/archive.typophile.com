      <p>To tell you a little secret, I too have trouble with FontLab. How I work is to write my features, then "save" them from the OT panel.</p>
      <p><em>(Edit: actually, to be truthful, I don't even "write" the features in Fontlab, but with a text editor that allows a column mode. But the easiest way, the first time, is to write them in FontLab.)</em></p>
      <p>I then open up that file with a text editor -- I use VEDIT, but EditPad Pro is likely a better, more modern choice. At the head of the features file, I write my classes, such as:</p>
      <p>@_exclam=[exclam   bracketright c d e g i j k l p r s t v w x y question quoteright quotedblright uni02BE uni02BF];<br>
      @_zerosuperior=[zerosuperior   onesuperior twosuperior threesuperior foursuperior fivesuperior sixsuperior sevensuperior eightsuperior ninesuperior];</p>
      <p>then, make a kern feature, e.g.,</p>
      <p>feature kern {</p>
      <p>and add the positioning commands, e.g.</p>
      <p>   pos @_exclam @_zerosuperior 50;<br>
         pos @_comma @_zerosuperior -50;</p>
      <p>etc.</p>
      <p>Some creativity with this technique is possible; you can do you kerning as pairs in FontLab, build a kern featrure in FontLab, export it, then (as above) define your classes in the feature file (NOT the classes file, that should have nothing in it with my technique), change your existing entries in the kern feature in accordance with the classes you write, and re-import the modified (new) features file.</p>
      <p>i.e. in the file, you change</p>
      <p>   pos A C -36; </p>
      <p>to</p>
      <p>   pos @_A2 @_C1 -36;</p>
      <p>and since you have now written classes for @_A2 and @_C1, it should compile just fine.</p>
      <p>Just remember that when FontLab alerts you that the kerning values are different from the kern values in the features, and asks if it should rebuild the kern feature, you say NO. Not only NO but HELL NO.</p>
      <p>This is a tough way to go, but I've found it bullet proof when, as always happens, I have to go back into the font and change/add kerning. I save the .VFB, and try to never work from the .OTF. In point of fact, I keep the separate (importable) features file current as well.</p>
      <p>Just remember that the kerning in the compiled feature file is what is used when you generate a font.</p>
      <p>Good luck</p>
