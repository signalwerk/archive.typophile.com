    <p>Im working in Fontlab 5 and as a test setup a simple Kerning Class</p>
    <p>_G: G' g</p>
    <p>In the Metrics Window with Kerning Mode on I have three of the same words</p>
    <p>ANALOG<br>
    Analog<br>
    analog</p>
    <p>In the first all caps ANALOG above I kern the 'G' at -10 and expect to see the lower case 'g's below move in accordance and nothing happens.</p>
    <p>Why isnt this class working and affecting the lowercase g as it should?</p>
    <p>Thanks</p>
    <p>Mike</p>
