    html: <p>Yes, you can combine them. The FontLab metrics window gives you the options of (flat) pairs kerning, class kerning, and class kerning with exceptions. You probably don't have one of the "class" options selected. There is a PDF manual that comes with the program. Read the kerning section.</p>
