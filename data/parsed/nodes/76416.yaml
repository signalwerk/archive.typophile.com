    <p>Hi Guys/Girls,</p>
    <p>Can you help with this: I want to create a document describing all the characters in a font (Cyrillic, Latin): A so-called full character set (ABCDE, abcde ...etc. In InDesign, I can select character by character, but it takes a very long time (the current font is more than 800 characters). Is there any software, script or similar that does this work? Thanks in advance for prompt assistance ;-)</p>
