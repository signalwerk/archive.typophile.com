      <p>I saw the movie in IMAX 3-D on opening weekend and didn't notice the pixelation Bobby did, and that was on a 6-story-tall screen. Also, reading the backstory title card didn't seem overly laborious on such a giant screen, but I do remember thinking they should have split the text onto two cards rather than one.</p>
      <p>I do remember reading (in Entertainment Weekly, I believe) that the director intended the titles to be a homage to Superman I and II's swooshing blue outline type.</p>
      <p>(btw, the 3-D part amounted to only 20 minutes or so, mostly action sequences. Very cool for most of the scenes, but I forgot to take off my glasses after one scene.)</p>
      <p>--m</p>
