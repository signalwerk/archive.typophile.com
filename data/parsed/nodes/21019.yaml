      <p>I was in Colorado Springs over this past weekend. So I took the opportunity to watch "Superman Returns" in IMAX at the Cinemark theater there (to see if there would be any visual improvement over what I saw in 35mm).</p>
      <p>The pixelation in the opening titles was even more obvious than in 35mm. I even saw vertical dark lines separating the light pixel lines on those opening title letters. The fast foward acid trip pacing of those titles made it difficult to "read" objects like planets as they sped across the huge screen.</p>
      <p>The generally blurry nature of image detail in this movie seems to work as a good case study that movies shot in HDTV videotape format do not work well blown up to IMAX sized screens. Many objects on various sets in this movie that would normally be well in focus if shot in IMAX or just 35mm were a blur with "digital."</p>
      <p>There's a lot of digital-based tools which have greatly improved filmmaking and many other creative endeavors. But shooting major feature films on video is proving to be, at least for now, a big step backward in terms of quality. It takes more than 2000 columns of pixels to be competitive with 35mm film.</p>
