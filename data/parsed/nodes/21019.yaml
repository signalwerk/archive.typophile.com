      <p>I finally got around to checking out the new Superman Returns movie.</p>
      <p>I was a little put off by the handling of the opening titles, as well as the rest of what I thought was a highly derivative movie. I'll leave the rest of the actual movie review stuff for more movie review oriented people. Let's just talk about the type.</p>
      <p>I've never been able to pin down exactly what typeface was used in the glorious opening titles of the 1978 edition of "Superman: The Movie." It looks a bit like Gill Sans, but then has a bit of Frutiger in it...in the end, I don't know. It was still really great. I was only 11 years old when watching the Christopher Reeve version of "Superman" for the first time and I was just blown away by it -right from the opening title sequence. There is a joke in Hollywood: "the fancier the movie titles, the more terrible the movie." Not sure if that's true, especially when many of the posters are just set lockstep in Trajan. But "Superman: The Movie" is a guilty pleasure of mine. I watch it on DVD and think about riding my bike over bike ramps and crap like that.</p>
      <p>The then fledgling R/Greenberg and Associates put together one of the greatest movie title sequences of the 2nd half of the 20th century. I watch it on DVD and still get exhilarated by it. It's just cool.</p>
      <p>Fast forward to 2006.</p>
      <p>First, they don't match the correct font even though they're trying to make this movie into a legitimate sequel to the 1978 and 1981 versions. Gotham is a very good typeface. But it is still not the correct font. Superman lives in "Metropolis." Batman lives in "Gotham City." Why didn't "Batman Begins" use Gotham for its type? I digress.</p>
      <p>Then we have to factor in the EXTREMELY irritating move of the effects house or whoever rendered this title sequence in doing it at too LOW a level of resolution. Did anyone else see all the pixellation all over those outlined titles, or was it just me? Not everything "digital" equals perfect. R/Greenberg and Associates did their opening title sequence BETTER and more SMOOTHLY waaaay back in 1978. Yet today, here in 2006, we are way smack in the land of pixellated alias-land. Really horrible. Flicker those pixels!</p>
      <p>On top of that, the whole opening title sequence had a pace to it more frantic and fast-forward sped-up than most rap gangsta wannabe music videos MTV even bothers to play anymore. Everything was firing by so fast I thought I was looking at miniature planets or some kid's marbles in a microscope. It was embarrasing. Have any of these guys ever thought about a term called "pacing" or ever concentrating on a shot for more than 6 frames of celluloid? Gigantic objects, such as a planet, have to move by the camera sloooooly. If it shoots by in only 5 frames it has the scale of a soccer ball. Arrgh!</p>
      <p>I see this kind of dreck happening and it makes me feel like all the "DIGITAL" tools we have at our use these days have made a lot of people retardedly lazy. They don't follow any of the rules those who had to live under the limits of the analog realm had to follow. Just throw anything at it and caboose it with that "digital" word. Blah!</p>
      <p>Digital, analog, I'd just like for these movie people to start doing their jobs right again!</p>
