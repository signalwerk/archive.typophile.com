      <p>Kyle Cooper's <a href="http://www.prologuefilms.com/" rel="nofollow">Prologue Films</a> produced the new opening titles. As a tribute to one of the greatest opening titles in the last forty years, I thought they did a swell job.</p>
      <p>I wasn't thrilled about the large block of prologue text that opens the movie, but it was short and non-intrusive. The most annoying part was seeing DC Comics' atrocious new logo before it -- Milton Glaser, we miss you!</p>
      <p>As far as typography in the rest of the film, did anyone else notice that The Daily Planet's signage and globe were set in Broadway (or some similar Art Deco typeface)? Nice attention to detail, I thought -- it resembles the banner type on the original issues of <em>Action Comics</em>.</p>
      <p>I can't wait to see the movie again in IMAX.</p>
