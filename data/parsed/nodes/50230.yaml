    <p>Hey guys,</p>
    <p>sorry if this has been asked in the past, but i wasn’t really sure what to look for.</p>
    <p>In an attempt to clean up my font library, i have come across a problem i have never been able to figure out. I have a handful of fonts that are all displayed as different typefaces, when they could all potentially be under the same list. </p>
    <p>As an example...</p>
    <p>My Akzidenz-Grotesk shows up in FontBook and my apps in a big list of separate typefaces. So it shows up as Akzidenz-Grotesk, Akzidenz-Grotesk Extra, Akzidenz-Grotesk Light, etc....</p>
    <p>Is there any way to combine these together so they just show up as a single Akzidenz-Grotesk, and then in the menu next to it i can pick bold, light, medium, or whatever. Here is a screen shot if that is confusing...</p>
    <p>Thanks a bunch!</p>
    <p>Josh</p>
