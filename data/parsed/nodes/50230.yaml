      <p>I’ve had a complaint like this before and have written to the foundry and they’ve fixed the naming for me which in turn fixed the problem. (Or that is how I understood it.)</p>
      <p>Either way, I wouldn’t recommend doing it yourself. Least/Most of all because Berthold’s EULA doesn’t allow for modifications.</p>
