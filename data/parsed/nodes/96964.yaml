    <p>Hi there, </p>
    <p>I have some TTF fonts from an old CD-ROM that I'd still like to use on my Mac.<br>
    But those fonts seem to have some non-ASCII chars stored in their PS Names and TTF Names tables as I see them in fontforge, which are shown garbled in other apps' font menus. They also don't have proper style names which I'd like to set in order.</p>
    <p>Thus I'd like to modify those metadata without changing anything else in those fonts.<br>
    Is there any tool suited for such purpose?<br>
    (The tool can be a command line tool or one that works on Windows, although my final goal is to use the fonts on my Mac.)</p>
    <p>I've tried to do that with fontforge, but the generated TTFs somehow seems to lack something (maybe vertical metrics info?) that they look messed up when I try to typeset them vertically (which is not the case with original fonts). It's a crucial problem since those are Japanese fonts and should allow vertical typesetting.<br>
    I'm not really familiar with fontforge nor with font data structure, so I must be missing something, but since I only need to fix the font names, I thought that a fully equipped app like fontforge is too much and there should be some simpler solution.</p>
    <p>I'd appreciate if you could give me any suggestion.<br>
    Thanks.</p>
