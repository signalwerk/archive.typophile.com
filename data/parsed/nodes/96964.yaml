      <p>It worked!<br>
      TTX will be my favorite tool. Thank you again, Karl.</p>
      <p>A note for Mac users with systems version 10.6 (Snow Leopard) or higher:<br>
      The latest release version of TTX (fonttools 2.3) turns out to be incompatible with those systems.<br>
      It seems you have to use this branch instead:<br>
      <code><br>
      svn co https://fonttools.svn.sourceforge.net/svnroot/fonttools/branches/delft-sprint-2012 fonttools<br>
      </code></p>
