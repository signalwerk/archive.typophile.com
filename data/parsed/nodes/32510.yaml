    html: |-
      <p>In some ways your design is more whimsical than the Bauhaus stuff more like the Dutch. But in any event I suppose what I wanted to say was that when you are working in an area with alot of historical work that already exists it's a good idea to make clear for yourself &amp; others what your intent is. Is it a revival or a reinterpretation or an original work - or something else. This might sound fussy but I think that when you are working in an area as heavily explored as this, it is worthwhile to check out all the presedents as well as you can and to make clear what your intent is in relationship to the work that is already done. One advantage of doing this is that the quality of your work is likely to benefit, and your sales will be better too as the work is better and you can better position your product - people like to buy fonts presented in a clear context.</p>
      <p>You migt want to read this essay too:</p>
      <p><a href="http://www.emigre.com/Editorial.php?sect=2" title="http://www.emigre.com/Editorial.php?sect=2">http://www.emigre.com/Editorial.php?sect=2</a></p>
      <p>While you might not wholy agree with it I think it does a good job of making clear distinctions between things that seem to be the same at first glance.</p>
      <p>Let me know if this makes sense or if you dissaree &amp; if so why. </p>
      <p>Cheers!</p>
