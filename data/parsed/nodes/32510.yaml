    html: |-
      <p>I agree with you, I shouldn't have post my design in such a lazy way. Let me put it this way. It is my first time I've post a design here and I think I learned a lot for the next time. </p>
      <p>About the design:<br>
      Because I'm new to typedesign, I wanted to do a stencil typeface with simple forms. In the meantime I practice calligraphy. The design is not based on any typeface, and that's the first mistake I made. Once it is done it's hard to push it further. I see, it's important to work carefuly and keep a direction (style, use, size, target etc.) in mind. </p>
      <p>My final decision:<br>
      I won't continue with this typeface (for now), but I will continue to design type the proper way! I'll let you know when I post a new typeface and I guess there would be more details about the work.</p>
      <p>Cheers!</p>
