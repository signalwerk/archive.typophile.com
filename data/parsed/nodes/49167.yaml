    <p>We've extended the sale on our new "Across the Univers" shirt <a href="http://typographyshop.com/univers_w_t-shirt.html" title="http://typographyshop.com/univers_w_t-shirt.html">http://typographyshop.com/univers_w_t-shirt.html</a> through September 14th. We got our first mailing out to our buyers a bit late and wanted to give them more time.</p>
    <p>Nearly 40% of the buyers of this shirt also bought our first, "Helvetica Neue Descending a t-shirt." Talk about customer loyalty.</p>
    <p>As several of them came from here, I want to thank this vibrant community for being so supportive of this new venture.</p><div class="imageWrap"><img src="http://typophile.com/files/univwhtank_5502.jpg"></div><p></p>
