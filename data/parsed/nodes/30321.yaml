  html: |-
    <p>Hello fellow typophiles,</p>
    <p>I've been working on this for a little while, and thought I would post it for some feedback.</p>
    <p>It's called 'Router,' and it's based on a sign that I saw in the subway which was carved out of plastic with a rotating engraver.</p>
    <p>I used that source as inspiration to create this monoweight font that has some quirky characters in unexpected places.</p>
    <p>I am also developing an italic, and will probably do a light version as well as a bold.</p>
    <p>I think it will work well at a display level, and also for text (that's my hope).</p>
    <p>Feedback is welcome and appreciated.</p>
    <p>Bon appetit!</p>
    <p>Jeremy</p>
