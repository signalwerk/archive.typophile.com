      <p>Well done, Jeremy. There is a big market for this stuff. </p>
      <p>- Watch for heavy spots where curves meet stems, such as in the 'r' and cleavage of the 'B', unless you want to make that part of the font's character.</p>
      <p>- The top of the 'S' curve needs a little help.</p>
      <p>- The 'R' will need an alternate without the little foot, as the rest of the caps are so unadorned.</p>
      <p>- Consider an alt single-story 'a'.</p>
      <p>- Great '8'. Did you get lucky with the source, or was that your idea?</p>
