      <p>You mean that GIF? Too low res.</p>
      <p>The caps: reduce the weight.</p>
      <p>Spacing: a good first start is the scheme in Walter Tracy's "Letters of Credit". As for the tightness issue I mentioned, I meant that I think you should keep it slightly tight overall (partly because the color is darkish).</p>
      <p>Mainstream versus idiosyncratic color: at any given time in type design history, most designers will have a preference for lighter or darker fonts. In the Middle Ages people liked dark fonts, while in the 70s they liked very light fonts. That's been moving more towards dark lately, but some people (like Fred Smeijers) still prefer a color that's darker than most other designers agree is good. I like darkish fonts too. A designer can justify a preference for something outside the mainstream either by simply saying that's the way he likes it (not too hot), or by believing that users benefit (very good).</p>
      <p>hhp</p>
