    html: |-
      <p>It's working now.</p>
      <p>I would agree with Hrant's comments about the weight of the caps, spacing, the h and m, and so on.</p>
      <p>I think the revised version shows a lot of improvement over the earlier one. One thing that stuck out to my eye was that there was not enough space on the left side of the lowercase a. It looks fine now.</p>
      <p>Some things I'm seeing in the new version: </p>
      <p>Certain characters--the A, a, G, s, V, 4, for example--look slightly bolder than the rest. It's not just these characters, but those are the ones that stand out to me. </p>
      <p>The X appears to lean to the left, and there is too much space on its right side (or the left side of the Y). </p>
      <p>The curve on the bowl of the R is too thin.</p>
      <p>I liked your previous non-connecting fi and fl ligatures better. It's traditional, but I don't think it necessarily makes sense to connect the characters in a sans serif. You're really just trying to correct the problem of the f colliding with other characters. Connecting the characters is not the only way to do this.</p>
      <p>I think you need to spend more time with the ampersand. I can't tell for sure from your sample, but I would guess that you have drawn it with the counters as separate paths. During development, you don't have to draw your characters this way. You can make one continuous path with overlapping elements. That way, you get a nice flow to the strokes. You can remove the overlaps anytime before you generate the fonts. I do it as one of the last steps.</p>
