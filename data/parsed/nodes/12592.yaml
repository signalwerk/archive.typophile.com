      <p>Actually, the term "necklace" was used regularly by Arnold Bank, my calligraphy teacher from the early 60s.  I don't think he invented it though. It was probably a long-standing calligraphy thing.<br>
      Arnold had us do many n and o necklaces as practice for calligraphy. It was more about developing consistency in writing than measuring side-bearings. It seemed like a good term and it stuck with me low these many years.</p>
