      <p>The "g" for one needs a lot of work all of a sudden - although in the context of some of things you seem to have done, it probably won't work to simply go back to one of your previous forms... Instead, I would: put less weight in the head, as well as the join between the head and lower bowl; and put more weight into the left side of the lower bowl. The UC "S": bad curves throughout. The florin: should slant. The Brit Pound: smaller head. Quotes: too much stroke contrast.</p>
      <p>The cap height: I think it's too close to the ascender height.<br>
      I would either make them the same, or more clearly different.</p>
      <p>The traps: I think they're cool, but inconsistent. Have you<br>
      seen this? <a href="https://web.archive.org/web/20150124044408/http://www.themicrofoundry.com/ss_trapping1.html" title="http://www.themicrofoundry.com/ss_trapping1.html" class="link-external">http://www.themicrofoundry.com/ss_trapping1.html</a><br>
      It helps you quickly put consistent trapping in a font.</p>
      <p>hhp</p>
