      You asked me about text to test your typeface in. I thought I would post an answer here. You might consider longer sections of text in different languages to see the different letter combinations that come up and may need attention. In case you are not already aware of it, a good site to find multilingual text is the United Nations Human Rights Charter which has the text set in many languages.  Here is the link if you don't know it :<br>
      <a href="https://web.archive.org/web/20150124044408/http://www.unhchr.ch/udhr/index.htm" title="http://www.unhchr.ch/udhr/index.htm">http://www.unhchr.ch/udhr/index.htm</a></p>
      <p>ChrisL</p>
