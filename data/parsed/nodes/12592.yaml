      <p>This has more character than one might expect, considering how overcrowded this genre is. The "a" is quite charming, and the "g" is encouraging. Plus I like the fact that it's a bit narrow.</p>
      <p>One thing I don't get though is the right legs of "h" and "m": is that on purpose? If so, the intention (adding character?) might be good, but it's hard to see this feature working out well in the end.</p>
      <p>The caps are a bit too dark.</p>
      <p>The spacing needs a lot of work! :-/ But overall it has a nice tightness - I'd keep that.</p>
      <p>And some macro stuff: the color is a bit darkish (which I actually like), but if you're shooting for mainstream usage, it implies optimal setting at smaller sizes. If that's what you're shooting for, I would: loosen the spacing; and pull in the descenders a bit. Otherwise I would: lighten the color; and lengthen the ascenders a bit.</p>
      <p>BTW, it would be nice to see a character set too.</p>
      <p>And one more thing: good luck!</p>
      <p>hhp</p>
