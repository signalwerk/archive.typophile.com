    html: |-
      <p>What I was trying to say is that if you decide that some part of a glyph should look aligned to something, the degree of optical compensation you need to make it <cite>appear</cite> aligned (as opposed to being aligned Cartesially) varies depending on the size the font is used at.</p>
      <p>&gt; Is the reader could be bother with an apparent alignment?</p>
      <p>Generally he's "bothered" by close-but-not-exact [apparent] alignment. But only during deliberative "reading". During immersive reading I feel <cite>misalignement</cite> can actually be used to good effect - because information comes from contrast, and the subconscious doesn't care about things lining up (at least not in terms of the mechanics of reading, if not a type design's "subliminal" effects).</p>
      <p>hhp</p>
