    html: |-
      <p>André,</p>
      <p>Mostly, the color is not uniform enough yet. The a, e, and g are dark spots.  You may have to decrease the horizontals in those glyphs and open the counters a bit (Look hard at the upper bowl of the g.).  I think your horizontal strokes overall need to be optically adjusted thinner.  Remember, you are trying to give the appearance of monoline, you are not actually making it measured as monoline. This shows up most as the size gets smaller.  If you intend this to be a text face, it is more of an issue. You may also consider putting some traps in to make it optically balanced in weight. In some cases, I can't tell if it is a metrics problem that contributes to unevenness but I think it is as well. I would decrease the sidebearings on curved sides of glyphs like b, d, p, q.  At this stage, I would not set samples justified, stick with ragged right for the moment.  It is too hard to separate out what spacing issues are due to your justification algorithm and which are inherent to your metrics.<br>
      Set an "nu" necklace (nuanubnucnudnuenuf...) and then an "o" necklace (oaobocodoeofogohoio...) to test your sidebearings. Leave kerning off. Print strings of these at text sizes and make adjustments to sidebearings until the color is even. If you cannot get even color with this setting, it indicates that some of the glyphs need adjustment. Those will stick out like the g does now. This is a difficult stage.  For me, the first drawing of the glyphs is quick.  The longer time is spent going back and forth with spacing and glyph adjustments to turn a set of glyphs into a harmonious family.<br>
      I think you have to be sure you are consistent in spacing as well.  Look at page 2 column 2 at the word "playwright" and then at the word "works" on the next line. Look at the "ri" and then the "rk" The r seems farther from the i than it does to the k.<br>
      Mostly, just keep at it.  You will get a good result for your efforts. I think it is coming along well. You just need to push through the hard part.  You will see. I am confident you will end up with a good typeface for your efforts.</p>
      <p>ChrisL</p>
