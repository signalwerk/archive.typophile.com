      <p>I actually meant optical alignment... except I didn't<br>
      actually look to see which was better that way though.  :-/</p>
      <p>One thing about anything optical however: it depends on scale; you can't know the amount of optical compensation needed by just looking at magnified glyphs out of context. Most notably, this applies to basic things like the round overshoot of the "o" (as explained by Harry Carter in his translation of Fournier). What size is this design meant for? The larger the size, the less optical compensation you need, and there's a threshold above which it's worth just snapping to the exact alignement.</p>
