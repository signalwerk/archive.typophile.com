    <p>Does anyone here know what MASCDACS stands for?</p>
    <p>I happen to be putting together a piece on Vince Sardi, who passed away last month. (You Manhattanites and tourists to Manhattan surely have heard of Sardi’s?)</p>
    <p>I keep coming across that he was very supportive of this group. I think they have something to do with car racing - but I also know that he was very much involved in the world of theater?</p>
    <p>I was hoping there was a typographer around who has that piece of trivia and would share... hey, I’d do the same... it was amazing how much info one could pick up at a type shop. (Trying to bring it back to topic :-)</p>
    <p>Thanking you in advance for your help.</p>
    <p>and of course, RIP Vince...</p>
