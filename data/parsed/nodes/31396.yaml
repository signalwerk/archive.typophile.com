      <p>Nevermind — I should have known...</p>
      <p>A club near and dear to my heart - and I’ve never seen it as an acronym before...</p>
      <p>Madison Avenue Sports Car Driving and Chowder Society</p>
      <p>known as the Chowder Club and still to this day meets at — yep, you guessed it — Sardi’s.</p>
