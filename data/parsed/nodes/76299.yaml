    <p>Hello people,</p>
    <p>Does anyone know what's the type used at this Visual Identity?</p>
    <p>The text "COMO SE FOSSE A PRIMEIRA VEZ"</p>
    <p><a href="http://c0573862.cdn.cloudfiles.rackspacecloud.com/1/1/61138/729269/idcard_TOUCH_905_640.jpg">http://c0573862.cdn.cloudfiles.rackspacecloud.com/1/1/61138/729269/idcar...</a></p>
    <p>More examples of the typeface here</p>
    <p><a href="http://www.beeldmotion.com/#729269/Telecine-Rebrand">http://www.beeldmotion.com/#729269/Telecine-Rebrand</a> </p>
    <p>If you dont know the exact name of the font, but know some font that looks like it, please, drop us a post :)</p>
    <p>Thank you very much.<img src="/sites/default/files/old-images/idcard_TOUCH_905_640_3830.jpg"></p>
