    <p>This is a personal project, and one that I am using as a submission for University as a research project.<br>
    I fully intend however to make this a real thing, or product as some might call it.</p>
    <p>I'm not a coder, programmer or app dev. If you know someone who might be able to help in this respect, show them my video [below] and see what they think about putting a pennyworth in. I'm going to take this to Kickstarter eventually.</p>
    <p>I wish to tap into your collective knowledge and find the best information out there on type that is designed to be any of the following:</p>
    <p>&gt; Read quickly<br>
    &gt; Be easy to read (*not the same as read quickly*)<br>
    &gt; Is designed to work on/optimized for computer displays<br>
    &gt; Is designed to work on/optimized for Smartphone/Mobile/Smaller displays<br>
    &gt; Closed Caption typefaces- what are they and how were they developed?<br>
    &gt; Colour and text, and how this relates to reading speed and ledgibilty<br>
    &gt; Type in motion</p>
    <p>I'm thinking of a new project and need to start addressing these key points.<br>
    To explain my concept, I've (a while ago) put a video together that hopefully outlines what I want to create.<br>
    That video is here: <a href="http://youtu.be/KuskQGKcaAs?hd=1" title="http://youtu.be/KuskQGKcaAs?hd=1">http://youtu.be/KuskQGKcaAs?hd=1</a><br>
    [it's the first section really, the second is more of a "why this is needed"]</p>
    <p>If anyone is interested in creating this with me (online/digi-communication) then PM me or reply below.</p>
    <p>MrGraphics</p>
