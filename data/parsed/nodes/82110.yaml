      <p>Queneau: my new Dell has a six-core processor running at 3 gHz, 6 gB of memory, a 1 gB HD video card, 1 tB disk drive, a 16X DVD burner and a THX audio card, all of which cost me less than a grand. Does Apple offer ANYTHING comparable at that price?</p>
      <p>Migration from my old computer was a snap--literally. I copied a small program onto a USB stick, snapped it into my old computer, and all of my critical files were transferred seamlessly to my new computer. Plus, with Virtualization, I can run almost ANY program I purchased in the last sixteen years on my new machine at SMOKIN' speeds. Plus, Windows still supports PostScript Type 1 fonts. Can Mac users say this about any Classic OS programs they purchased or, with Snow Leopard, PS fonts?</p>
      <p>Windows isn't perfect, but it's far more capable than you give it credit for. Plus, I second Hrant's objection: pretty design doesn't make up for a fascist, condescending business philosophy...</p>
