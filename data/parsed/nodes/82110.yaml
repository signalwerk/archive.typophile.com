    html: "<p>Thanks Mark, for putting us back on thread. Just for the record: I did not at first buy an apple because of the 'propaganda' (all the mac vs. pc stuff had not landed back then), the simple reason was: I worked as a desktop publisher for a year and worked on a mac there. It was one of the oldstyle macs, just as gray on drab as any computer of the day. Then I started studying graphic design, and because I leart everything concerning design on a mac until that point, I bought one of the first iMacs. I then over time transferred to MacMini to (now 6 yr old) iBook. Considering it's age it still works quite well. I've looked at other platforms now, mainly because they are cheaper, but the thought of switching to windows just keeps me from it. I may be biased, but I would have to change my workflow so drastically, that, and my bad experience with windows (95, 2000, Vista)and the fact that macs have been quite reliable for me, just makes me sticking with them. I could not be bothered with a the marketing jadajada surrounding apple (if you knew me personally, you would understand) but it just works for me. that's all. sorry if that got on yr nerves...</p>"
