      <p>Well, whatever font-format is best... I have fonts in all of them, and it's good to know they can all be used with good faith (on principle of course, depending on the quality of the font itself, but that's a different matter. </p>
      <p>I still have many postscript fonts and they work fine for me, it's just a bit more work. It seems that with the opentype format fonts come with a lot more bells and whistles, which can be understood in a competitive market. But this is not a guarantee for quality. It is certainly easier to implement a lot of these features, but i've seen many commercial OT fonts that have poorly designed weights, bad diacritics, poor spacing and kerning.</p>
      <p>So better font formats don't neccesarily produce better fonts, IMHO.</p>
