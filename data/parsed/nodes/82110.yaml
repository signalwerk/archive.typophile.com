      <p>JanekZ -- <cite>[font source cubic Beziers]</cite></p>
      <p>As you indicate, what you say goes by the premise that quadratic beziers were derived by converting cubic beziers, which does not say anything about formats as such. Working with quadratic beziers right away you can get away with just as few points.</p>
      <p>Queneau -- <cite>ITC Mendoza</cite></p>
      <p>Issues are font-specific, not format-specific. (Referring to a very old version: As to outlines, some extra points are caused by conversion from IK to bezier curves. As to hinting, a few letters seem to have oddly placed hints. Both shouldn't matter in print, though.) Still one of my favorite typefaces.</p>
