      <p><cite>What relevent differences are there, both in print as on screen?</cite></p>
      <p>For printing it doesn't matter. On screen TrueType/OpenType TT might offer better hinting, but only if the font is equipped with it. It also depends heavily on the render methods. Which OS? Which kind of subpixel rendering? Typophile.com has countless of threads on these subjects.</p>
