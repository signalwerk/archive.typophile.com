    html: <p>If your final output is outlines, then there is no more distinction, they both will be postscript outlines but the outlines may differ in point placement and number.  It is far easier to draw in postscript type 1 outline format than it is for truetype so there is no need for thinking about truetype unless hinting is the main concern.  When you convert to outlines, all hinting is lost.</p>
