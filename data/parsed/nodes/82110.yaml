      <p>Interesting. The last time I saw a TrueType font stall a RIP was in the mid-1990s, however the experience was bad enough to prejudice me against the format for some time. The job crashed the RIP so badly, we lost hours of valuable production time, and it reinforced the (then-widespread) company policy to specify PostScript Type 1 fonts only in client-supplied work, whether they were application files, postscript or .pdf files. In my subsequent teaching practice I would recommend PostScript Type 1 as a more reliable font format overall, until as late as 2004 (I even had a classroom diagram like Janek's). </p>
      <p>With the arrival of better RIP technologies, .pdf workflows in pre-press and OpenType (both varieties) this distinction for print purposes has become irrelevant, although I think most font developers now prefer the hinting offered by the TrueType flavour of OpenType for onscreen display. Certainly this is what I understand from reading the literature of companies like Dalton Maag.</p>
