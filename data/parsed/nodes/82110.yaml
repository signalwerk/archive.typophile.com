    <p>Hello,</p>
    <p>I have been wondering about the following: It used to be recommended to use Postscript T1 for print production (rather than truetype, I guess?). Would you use TT for print production, and if not, why? </p>
    <p>With the dawn of opentype I don't know if this is still valid. There still is postscript (PST1) and truetype (TT) but now there is Open Type TTF and OTF as well. Opentype, as I understand it, is basically an enhanced truetype format, with either postscript or truetype outlines. </p>
    <p>But does that mean that OTF (postscript outlines) is still better suited for print production than TTF (truetype outlines)? What relevent differences are there, both in print as on screen?</p>
    <p>THX Jeffrey</p>
