    <p>It's used in the international credits of the animated series "Detective Conan".</p>
    <p>It looks very familiar... way too familiar. At first I thought that it was Arial Narrow, but the "a", the "y", the "t" and the "g" to give some examples, are completely different.</p>
    <p>Anyone knows? Thank you ^^</p>
