    <p>Hi,<br>
    I've been reading this forum for a while now but never written anything.<br>
    Now i need your help though.</p>
    <p>I need to find type specimens, and preferably a lot of them.</p>
    <p>Do you know any nice type specimen websites?</p>
    <p>So far i've only found some websites with really old specimens. I need to find some more recent ones. Like from the 60s to now.</p>
    <p>Thanks.</p>
