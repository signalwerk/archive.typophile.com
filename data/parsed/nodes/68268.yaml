    <p>Hello,<br>
    <a href="http://vimeo.com/9684639">Distance</a> was created by students in <a href="http://tannerwoodford.com/syllabus/2010s">Advanced Media</a>, a course in the <a href="http://design.asu.edu/sdi/">School of Design Innovation</a> at <a href="http://www.asu.edu">Arizona State University</a>. For more context on this work-in-progress, <a href="http://typophile.com/node/68269">see other videos from this class</a> or <a href="http://tannerwoodford.com/syllabus/2010s/1.html">read the official project description on the course syllabus</a>. The video was produced by Amy Ashurst, Zachary Colman, Deny Diaz, Gloria Grant, Shelby Sandler, Matt Schafer and Paula Vasquez.</p>
    <p><a href="http://vimeo.com/9684639">http://vimeo.com/9684639</a></p>
    <object width="601" height="398"><param name="allowfullscreen" value="true"><param name="allowscriptaccess" value="always"><param name="movie" value="http://vimeo.com/moogaloop.swf?clip_id=9684639&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1"><embed src="http://vimeo.com/moogaloop.swf?clip_id=9684639&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1" type="application/x-shockwave-flash" allowfullscreen="true" allowscriptaccess="always" width="601" height="398"></object><p><a href="http://vimeo.com/9684639">Distance</a> from <a href="http://vimeo.com/user2426485">amy ashurst</a> on <a href="http://vimeo.com">Vimeo</a>.</p>
    <p>We look forward your feedback.<br>
    Thank you.</p>
