    <p>I'm currently designing a website for a local butchers, the guy can't remember the font type on his shops signage and the company that made it are no longer in business.</p>
    <p>My design skills are not up to scratch with typography suffering the most :/</p>
    <p>I'm looking for an exact or very close match to this as he claims it to be essentially his branding.</p>
    <p>This guy has three shop fronts like this and it is only fitting i reference it on his new website..</p>
    <p>Any help is appreciated.</p>
    <p>Thanks in advance,<br>
    Karl<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Shop-front-signage_3557.jpg"></div><p></p>
