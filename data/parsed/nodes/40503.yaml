    html: <p>Again, it's probably not a font. The <a href="http://www.flickr.com/photos/tags/lowwaistedletters/" rel="nofollow">low waisted</a> 'R' is unique. You can get close with <a href="/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a>, <a href="http://www.fontshop.com/fonts/singles/process/klavika_bold_ot/?sample_text=ANAR&amp;sample_size=74&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Klavika</a> or <a href="http://www.fontshop.com/fonts/singles/mark_simonson/proxima_nova_bold_ot/?sample_text=ANAR&amp;sample_size=96&amp;acs_ss=-1&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Proxima Nova</a>.</p>
