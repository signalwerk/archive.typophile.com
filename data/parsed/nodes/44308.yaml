    html: |-
      <p>This is the best I can do with the concept as originally presented in the limited time I have available for these things. The smaller type size has two effects; 1) adds dynamism and visual stimulation, 2) creates a sense of refinement and tasteful design.</p>
      <p></p><div class="imageWrap"><img src="/files/marosi_outcome_3745.gif"></div><p></p>
      <p>“Output” is a bit obscure as to its implied meaning. Some potential customers will look at that word and wonder what’s meant by it, causing a sense of doubt in their minds.</p>
      <p>For a business logo it’s important to be positive, leaving no room for doubt or indecision. Be optimistic and offer potential clients something they can relate to. The first question a business owner has on their mind when dealing with a design firm is, “What are you going to do for me? How will your design services improve my business and make me more money?”</p>
      <p>So it helps to offer a benefit. The only suitable alternative word I came up with is “Outcome”. In other words, there’s something in it for the customer. An outcome. Some people may find that word inuendo-loaded tho, suggestive of sexual activity. It’s nice and compact as words go, but I recommend finding a better alternative word beginning with ’O’.</p>
      <p>Replacement fonts used are Futura regular and some other sans with a double story a. Like it matters. Anything will do as long it’s a reasonable match.</p>
      <p>Marosi, I recommend you take the objections people are making here to your use of glow and three dimensional effects with a grain of salt. They’re being needlessly conservative and nitpicky for no good reason other than their personal prejudice against anything outside of dead flat graphic design. I mean really, guys. It’s a matter of highbrow taste and the traditional hard-on most graphic designers seem to have for flat color treatments. It makes me laugh because that attitude is so snooty and elitist, and out of touch with reality. I wave my private parts in their general direction. </p>
      <p>I think your circular graphic element looks okay and you should go with what makes sense to you. It isn’t “bad”, nor is there anything inherently “wrong” with it. It is in fact quite creative, and progressive.</p>
      <p>Bye.</p>
      <p>j a m e s</p>
