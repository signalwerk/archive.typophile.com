      <p>“Biology lab” and “organic” are not compatible terms in my mind.  </p>
      <p>A lab can mean sterile, static, clean, harsh, controlled; even in a biology lab the natural things studied are placed in beakers, dishes and containers.  Organic means life, nature, leafy, messy, hairy, spiky - yet subtly and sublimely ordered.  There are modern ways of capturing the essence of both concepts, but I don’t think you’ve successfully struck on either in this design.</p>
      <p>I’ll speak for myself as to the design’s “cheapness”: the use of the glow and glass effects is very Web 2.0, and the font choice is dull and not at all exciting.</p>
      <p>Overall, if you’re going to exploit a lab concept, then you need to communicate the sense of awe and discovery that entails scientific research, not the necessity of sleeping on a cot in the lab because you need to monitor your experiment at 3:30am.  Your design is communicating more of the latter at this point.  Actually, it’s communicating that your experiment has failed and the last three years of research is out the window and you will never get your PhD.</p>
      <p>That is, of course, if you’re really going for lab, and not organic after all...</p>
      <p>—-<br>
      Nick Hladek</p>
