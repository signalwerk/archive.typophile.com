      <p>My initial thoughts are “we do it as we want not as you want” is the wrong approach ... or at least incorrect wording. So depending on how you’re approaching it, a rethink might be in order. I believe “Output” might even miss the mark you’re trying to convey ... to me it says “we output stuff, we’re your monkeys” ... a repetitive/mechanical task, nothing about free thought or inspiring ideas.</p>
      <p>The logo seems pretty generic in my opinion, and doesn’t really express “output”. I also tend to agree that the shiny look should be a treatment rather than the actual mark - i.e, any logo can have a web2.0 look applied ... but that’s your decision.</p>
      <p>—————<br>
      <strong>Paul Ducco</strong><br>
      <a href="http://www.solid-creative.com/design.htm">Graphic Design</a></p>
