    <p>Hi all, </p>
    <p>I am currently working on a college project, where I have been asked to create a poster based on a typeface. The typeface I have been given is Egyptian Extended, and I'm sort of struggling with finding any good info on it. I've looked in both " From Gutenberg to Opentype" and "Type &amp; Typography", but I'm still sort of confused. As far as I can see, the typeface was designed by Robert Thorne, or rather, he started cutting it right before his death in 1820. The name has parallels with ancient Egyptian architecture, because of the square black serifs, and there was a lot of interest in Egypt at that time, since Napoleons fleet just got defeated in the Battle of the Nile in 1798, the Rosetta Stone, and all that jazz. Now, am I completely lost here, or am I on to something? It seems like there's a fair amount of information on the characteristics of the typeface, but not on the actual history. I tried a quick Google-search, but that only resulted in God-knows how many pages on "Walk Like An Egyptian" Extended Version by The Bangles. All valuable information will be appreciated!</p>
    <p>Anders</p>
