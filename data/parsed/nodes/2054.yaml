  html: <p>So this is the logotype for my soon to come personal page The idea behind it is, to go with the name, one line, continuous, no stroke variation. I'm not happy at all with the "e", any criticisms will be most welcome! <br><img src="http://www.typophile.com/forums/messages/29/2036.gif" alt="monolinea"></p>
