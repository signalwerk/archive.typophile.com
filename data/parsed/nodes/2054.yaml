    html: "<p>reminds me too of the Bjork font.  <br>I think you could push it further, like the old plessy logo, it looks like a typeface at present. <br>here's a logo (rejected) that i did for an airline fulfillment company. i still like it, particularly the way the bouma aids legibility. <br><!---Attachment: symphony.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">symphony.swf<br><a href=\"http://www.typophile.com/forums/messages/29/symphony.swf\"><b>symphony.swf</b></a> (2 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
