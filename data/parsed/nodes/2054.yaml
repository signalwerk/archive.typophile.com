    html: <p> the bjork font has definitely been an inspiration, hope i haven't taken "too much" inspiration. Hoped to make it less of a typeface by using different ways of linking letters (o-n/o-l, for example) but i'm thinking of developing it into a complementing typeface later on... if i'm up to the challenge. <br> <br>thanks for the suggestions, looking better <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
