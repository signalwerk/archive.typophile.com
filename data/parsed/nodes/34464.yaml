      <p>I'm not sure if you're asking what I'm thinking. The logical-not at the end of an incomplete URL can indicate that it should be ignored and the rest of the URL from the following line should be appended. Sort of like a special hyphen for URLs. The reason this can work is that the hyphen is allowed in URLs but the logical-not... is not! :-)  On the other hand, some people will tend to get confused. Natural selection, baby.  ;-)</p>
