      <p>Well part of being a designer is that you are also frequently dealing with people who have a little bit of knowledge about type and/or design, and want to make sure you know that. It is a power game - if they're the client they want to make sure they're getting what they pay for (and that you know you work for them). If they're the client's representative or liaison then they want to prove their importance to the client - make sure the clients believes they are instrumental to the design process. </p>
      <p>I've had all sorts of design rules spouted at me and most of the time, unless it's something I have a serious objection to, I roll with it. Being a difficult designer isn't gonna help you in the long run.</p>
