    html: <p>I avoid hyphens in ragged text but there are occasions when it's essential to prevent a really weird shape in your rag. I'd say do your best not to use them (turn hyphenation off, as suggested) and then manually introduce them only if necessary. And then take it case by case with the boss. Odds are she won't even notice the odd hyphen. It is neither an unusual nor an unreasonable request but I tend to resist that sort of rigid attitude too in favor of a little more flexibility.</p>
