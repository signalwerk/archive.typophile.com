      <p>With apologies, I thought the comment—nay, essay— wasn't sufficiently typographic in nature. And what it lacked in concision it made up for with wildly inflated rhetoric. In lieu of a poorly rewritten version, the gist was, in short, that the client's rigid No Hyphen mandate is largely a declaration of status meant to shape the relationship. To absolutely assert an arbitrary rule concerning something so trifling is a sort of preemptive scolding, a very slight symbolic degredation of your social rank: "Don't forget that there are limits to your ownership here. You will respect me and do as I say."</p>
      <p>If you are not working inside an organization with a formalized system of rank, these sort of superior/subordinate negotiations go on all the time. The point of contention is always, necessarily, trivial.  How adroitly you handle the process  — the degree to which you push back, comply, or renegotiate — obviously has less to do with design strategy and more to do with a sensitivity to political pressure. But I would suggest that there are a number of creative solutions that will allow one to produce work of the highest quality and also let your client know that she is valued, heard and respected. And I think achieving those two things together is the real goal.</p>
    html_clean: |-
