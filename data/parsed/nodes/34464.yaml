      <p>The problem is that removing hyphenation will generally make reading easier -- except that every so often it will create an oddity of adjacent line-lengths which draws attention to itself, looking like a word has been left out. So highlight those instances in fluourescent marker, and ask her if you can re-write the copy to get a smoother rag. And I say this only partially in jest. :-)/:-(</p>
      <p>(There is also a problem in rag copy where by chance several adjacent lines come out to the full measure, looking like some justification got mixed in by mistake. Another cause for intervention with the dreaded soft return.)</p>
