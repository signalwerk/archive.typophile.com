    <p>Hi All -- </p>
    <p>The project is an 8-page corporate editorial-style newsletter. 8.5 x 11" page, three-column grid, serif typeface (9.5 point Sabon on 13 points leading), ragged-right alignment. </p>
    <p>The client has got some bug up her @$5 that "hyphens are bad in all circumstances" and has directed that no words shall ever be hyphenated. Ever. </p>
    <p>Now, I understand that it's bad form to allow hyphens in headlines. Subheads. Deckheads. Maybe even pull quotes. But... eliminate all hyphens from the body copy? This is going to make for a rather awkward rag (at the best) or a lot of time spent walking the lines trying to fix the rag. </p>
    <p>Anyone ever had this request? I'm sure there's gotta be some readability study out there that I can point to that proves hyphens -- when used sparingly in body copy -- actually help readability. </p>
    <p>Thoughts?</p>
