      <p>Hmmm...  I did several projects with a client that said, "Our headline face is Torino." </p>
      <p>To me, it sounds like much the same thing. I don't happen to have many relationships with clients that I would describe as adversarial, although I admit -- they do sometimes exist.</p>
      <p>In the end, I think (and this is my personal take) that both designer <em> and </em> client have a stake of ownership (for want of a better term) of a project, but perhaps the greater stake must belong to the client; it's to they that designers hope to give a voice, and it's also they who will either be served or not with the design. </p>
      <p>If you work at an office where the boss says, "No bolo ties," I think it's a losing position to declare that bolos, are, in fact, the accessory that asserts your freedom of expression. The boss has an overall image they are hoping to project, and if that one look doesn't fit into the definition, as they see it, them so be it.</p>
      <p>Anyway, I'm rambling.</p>
      <p>Any designer can work without hyphens, if they need to.</p>
