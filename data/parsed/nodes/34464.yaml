    html: |-
      <p>We get all sorts of requests regarding hyphenation -- usually from editors, sometimes from designers. With ragged setting, I've seen "no hyphens," "no more than two hyphens in a row" (a usual hyphen block in justified copy is more than three), "don't hyphenate after two only letters," and on &amp; on. On the other hand, some specify "tight ragg." A few want lines to have a pattern of "long, short, long, short." Those are the only ones I tell to find another typesetter.</p>
      <p>People have all sorts of theories on what is easier to read. I use to have them, too. But I can read a book &amp; enjoy it &amp; forget my profession. So on a number of occasions, after finishing a book, I went back to look at the hyphenation that had been used. Most of them broke all sorts of my pet rules, &amp; I finally had to admit most of these rules are a matter of what people (including me) used to feel more professional; they had nothing to do with <cite>reading.</cite></p>
      <p>One thing people often seem to forget is that all composition is compromise. Hyphenation aids even spacing -- between words in justified copy, at line ends in ragged copy. Unless you write &amp; rewrite the copy to fit the space, limiting one increased the amount of the other.</p>
      <p>One of my favorite PE's was "PE, loose line; PE, hyphenated word." Both PE's referring to the same line. The hyphenated word was a long one, and all agreed it wasn't going to come up. So to banish the hyphen, the line perforce had to get even looser. Where do they think loose space space comes from?</p>
      <p>There is also a fun situation with 18th century composition. Apparently, some felt the reader might get lost if a word hyphenated overleaf. So, if that happened, they would set the complete word on the line below that last line; the reader would then have the whole word. Next, someone got the idea that even if the word wasn't hyphenated, the reader might get lost, so they set the next word (that occurred overleaf) on the line below. Apparently someone finally figured out that the logical end to that was to set the whole rest of the chapter on the line(s) below, which wasn't going to work, so they stopped this nonsense. Today, with people reading while listening to music &amp; maybe watching television simultaneously, this argument ("the reader will get confused") has little merit.</p>
    html_clean: |-
