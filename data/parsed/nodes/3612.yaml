    html: <p>Lower Design a bit trendy looking. Before proceeeding- The questions to ask would be where they are at but where they want to be in 5 years, 10 years, etc..., the branding they do now should be "current" looking in 5 years+. Who is buying they equipment 30 year olds, gamers, execs, what is price point? <br>Assuming it ie all somewhere in the middle I would say the  <br>top type properly be best in say 5 years as well as cool enough for the current young audience.. The bottom is nice but that trend is on it's way out in my opinion. Less legible. <br>U, N and M's look nice. I works. The E needs work. L too.</p>
