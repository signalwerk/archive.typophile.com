  html: <p>feels good to be back again. hi there :-) <br>I just finished a logotype that, oddly enough, was immediately accepted by the client. due to the tight turnaround time (1 week only prior to the lunch of a new computer shop), it wasn't until now that I could take a step back and ask for some help as far as the result is concerned. I guess the work could well take in a great deal of finetuning, but I was mainly interested in the overall personality of the logotype. <br> <br>thanks a lot. <br>george // cellsius <br> <br><img src="http://www.typophile.com/forums/messages/29/28632.gif" alt="\img {mill02.gif">}</p>
