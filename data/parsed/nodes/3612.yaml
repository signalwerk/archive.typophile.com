    html: <p>thanks, Hrant. I feel I should provide further details since there are no more takers around ... <br>MILENIUM is a computer brand going national and they want a fresh ID system based on a logotype bold enough to be cast into plastic for computer panel usage. Besides this, I was free to come up with whatever I felt fit, within such a short period of time. My personal chioce went towards an "indesit" uppercase - lowercase lettering, modern and relevant. instead of taking the obvious way (E, L uppercased and the rest lowercase) <br><img src="http://www.typophile.com/forums/messages/29/28658.gif" alt="\img {mill01.gif"> <br>they chose to go with this unusual lowercase "i". <br>I fear it might lack that good obviousness that turns an obscure detail into a clever idea. <br> <br>george</p>
    html_clean: <p>thanks, Hrant. I feel I should provide further details since there are no more takers around ... <br>MILENIUM is a computer brand going national and they want a fresh ID system based on a logotype bold enough to be cast into plastic for computer panel usage. Besides this, I was free to come up with whatever I felt fit, within such a short period of time. My personal chioce went towards an "indesit" uppercase - lowercase lettering, modern and relevant. instead of taking the obvious way (E, L uppercased and the rest lowercase) <br><img src="http://www.typophile.com/forums/messages/29/28658.gif" alt="\img {mill01.gif"> <br>they chose to go with this unusual lowercase "i". <br>I fear it might lack that good obviousness that turns an obscure detail into a clever idea. <br> <br>george</p>
