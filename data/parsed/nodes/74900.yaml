      <p>Sophie:</p>
      <p>Typophile is the wrong place for such requests. Most people here (including me) strongly believe that fonts don’t grow in trees and therefore the type designer deserves to be paid for his/her job, just as anybody else. </p>
      <p>&gt; Any Suggestions???</p>
      <p>In the case of the font you are looking for, my suggestion is to get a license from <a class="freelinking external" href="http://www.emigre.com/fontpage.php?PBloUn.html" rel="nofollow">here</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/emigre/blockhead/" rel="nofollow">here</a>, or <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/emigre/blockhead_alphabet_unplugged/" rel="nofollow">here</a>.</p>
