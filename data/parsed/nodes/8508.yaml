  html: "<p>Hi (sorry for my english, it's not good) <br> <br>This is a logo that I designed for the company I work for (the firts one). <br>The name is Infivia, a weird name, but that's it. In french, you have the words in it : Infinite and via (for the way, the road, a path). Anyway. I'm really confuse because it's been 3 days that a realize that my boss choose a logo that I sell myself to them, but now I really think that it's not good, but they like it. I'm trying a lot of ways, but it's very hard to make the logo for your company, when your boss don't know what they want. And I just want to make a good design.  <br> <br>I want to know if it's readable. If it's ok or if it's really bad. Or if you have ideas. Is the serif ok? The spaces are not good yet. <br> <br>We are a graphic design company in Montreal, we do documentaries posters, corpo things but funny things too. <br>This is our website if you want to understand the company. <br><a href=\"http://www.infivia.com\" target=\"_blank\">www.infivia.com</a> <br>Thanks a lot , I really need help. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/57321.gif\" alt=\"\"></p>"
