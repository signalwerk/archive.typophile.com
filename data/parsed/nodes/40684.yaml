    html: |-
      <p>Thanks, everyone!</p>
      <p>I perfectly see what everyone means about the kerning and weights...<br>
      What makes this hard is that I’m using upper and lowercase forms together, which makes it difficult to kern and to make the weights match. We all know that kerning uppercase letters is quite different from kerning lowercase and there’s always some kind of adjustment to make to the weights when mixing small caps with lowercase... so I think that’s where most of this trouble comes from. So, with that in mind, does anyone else still have anything to say about those two problems? This really was hard for me (lots of tweaking was involved, I’m a bit of a perfectionist, and an inexperienced one, too), so more input will be appreciated. :)</p>
      <p>Meanwhile, regarding the dot on the lc I... I don’t think I can drop it. It really is what makes the lc I form most recognizable, and this is a tough word for some portuguese people to read; I don’t think I’ll make it even harder on them. But I’ll try it again later, thank you for the tip. :)<br>
      Now about the height of the dot... actually, it comes from the mark. If you look closely, you’ll see that everything is aligned: the bottom of the last horizontal line on the mark is aligned with the baseline of the lettering; the bottom of the second horizontal line is in line with the x-height; and the dot on the I is perfectly in line with the first horizontal line. That was how I got to the size of the mark and how it related to the lettering. I’m still looking at the mark for some improvement, but I thought the left side (those oblique ends Bert mentioned) gave it some charm and made it a bit more dynamic. Adding obliques on the right side instead (I did try it, before) made it too busy, because it clashed much more with the large oblique line... but even so, Bert, do you think the mark should be bigger or smaller? I didn’t understand what you meant.</p>
      <p>Thanks!<br>
      ruD</p>
