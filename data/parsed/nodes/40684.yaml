      <p>I think that there might be a difference in weight between the characters? Or so it seems, optically. ’U’ and ’N’ are quite heavy, then comes ’t’, which seems a little lighter, and then ’i’ and ’e’, which are even more light to my eyes. I don’t know if this is what you wanted. If not, a little tweaking here and there wouldn’t hurt. :)<br>
      I think it makes it a bit restless, so to speak, and a little more uniformity might make the whole mark more harmonious.</p>
