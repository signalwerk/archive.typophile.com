    <p>Hey everybody. :)</p>
    <p>A friend asked me to design a logo for his about-to-open firm. They’re not in a rush, they have no money to spend and I’m a lazy unemployed unexperienced college graduate, so that was a match made in heaven if there ever was one (that’s an exaggeration, I’m just madly trying to practice my english).<br>
    Since I’m a typophile, my primary focus was, of course, the type. So what I’m looking for, here, is mostly any advice/tip/suggestion you nice folks might have to share regarding the type I designed for their logo and the kerning.</p>
    <p>If you’re curious as to what they do, that’s a tough one... basicly, they are five people with different backgrounds (three engineers, one industrial designer and one marketeer) who plan to develop projects in different areas together and then get them to whoever might be interested in using them. (It’s tough enough to explain even in portuguese, let alone in another language...)</p>
    <p>They know it’s quite a risky adventure, but they seem to be OK with that; so much so that they risk it more by using an english name (which, when read in portuguese, sounds something like a meaningless “oontee”). So much so that they don’t even mind asking ME to do their identity!</p>
    <p>About the kerning: I kerned it a bit on the loose side to improve legibility and also because kerning these forms (which I’m really pleased with, I must say) tightly is kind of difficult.</p>
    <p>About the symbol: basicly it’s a mix of the inequation symbol (two of them, actually) – which represents the fact that they’re not equal to anything else – and that little drawing we make when couting votes, for example (you know, “||||” with a diagonal line over it, representing five votes – look at the symbol at a 90º angle and you’ll see what I’m talking about).</p>
    <p>Without further ado (but with a bit of fear)...</p>
    <p></p><div class="imageWrap"><img src="/files/newScreenshot_27_4912.jpg"></div><p></p>
    <p>Any comments regarding the widths of the letters and the strokes are also welcome.</p>
    <p>ruD</p>
