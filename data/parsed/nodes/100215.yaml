    <p>I'm curious what typeface BlackBerry was using in their recent launch event. I've attached a picture and am linking to several more.</p>
    <p>I tried to google it, but it didn't really help, since most of the results deal with the logotype. I also came across a brand identity guideline pdf, but it was from 2007 and apparently they have changed the typeface they are using since then.</p>
    <p>Any help would be greatly appreciated! Thanks!</p>
