    <p>So as a graphic artist, I know nothing about web design. I know A LITTLE (from what things like myspace teach you with adding templates, etc), but that’s about it. I’m trying to use WHAT I KNOW artistically to create my ideal website in illustrator, then saving for web and then linking them all somehow. I’m still working on that. Once I’ve got it figured out, I’m going to buy a domain and booyah! I will finally have an online website. Go me. Any help or critique would be appreciated. Thanks!</p>
