      <p>“from what things like myspace teach you “</p>
      <p>Eww. That is perhaps the worst place to learn good web design. ;o)</p>
      <p>The best advice I can give you is to remember that web design is more about suggestion than dictating. The best you can do is suggest a design, and the end-user may decide to over-ride your preferences. As such, work with the medium...don’t fight it. ;0)</p>
      <p>As for your GIF...that is what they call a ’splash page’ and what most folks would call pointless and annoying. There’s no reason for it. Just take me directly to your home page.</p>
