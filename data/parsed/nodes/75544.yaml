    <p>Hey, </p>
    <p>I'm in the middle of a town branding project for the city of Elk Horn in Iowa.  The city has the largest percentage population of Danish residents in America. It also boasts the only Danish windmill to ever leave Denmark.  </p>
    <p>Our group has only just started the ideation and conceptualizing a series of symbols and color schemes to represent the town.</p>
    <p>We are searching for possible typeface solutions to use throughout the signage for the town. </p>
    <p>In our research we came up with these two typefaces being used as signage in Europe. I think the team overall appreciates the large x-height and overall verticality.</p>
    <p>If anyone can identify these typefaces or point me in the direction of any alternatives that would be great.</p>
