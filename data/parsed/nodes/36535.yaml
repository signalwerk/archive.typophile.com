      <p>The ideia behind the script in “my” was a simbolization of a personal touch in the design, as every person has its own calligraphy. In fact, I drew those two letters according to my own calligraphy.</p>
      <p>I also thought about an italic here, but this is not a possible solution for this logo (for several reasons, one being that the logo would have similarities to another existing logo).</p>
      <p>You’re right about the kerning of the small letters, I hadn’t even thought about it yet.</p>
      <p>I’m still trying to get something different with the ’my’, but there are no solutions I really like until now.</p>
