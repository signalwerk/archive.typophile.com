      <p>The overlapping idea is quite good. Keep trying though.</p>
      <p>Avoiding dark grey has two reasons: First, it looks “dirty” and therefore unpleasant; second, dark grey is often hard to process — for instance, it tends to blur or get messy when down-sampled. Instead of symbolizing a “grey” corporation, I’d suggest an “empty” one instead — by using outline letters (white body with black outline).</p>
      <p>In any case, there’s no reason why the “corporate design agency” line should be grey as well — especially considering its small size and reduced readability.</p>
    html_clean: |-
