    <p>Dear typophiles,<br>
    I'm looking for an ID on the grotesk typeface in the following two pictures. It is used by Fogal, a Swiss stockings company, for their packaging. I doubt that they'd have a custom typeface, but maybe that's the solution.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fogal_caresse_5726.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fogal_madison_6142.jpg"></div><p></p>
    <p>Thanks for your help!</p>
