      <p>John, it's always interesting reading your pieces, and this one is intriguing as well, althought, paradoxically, on my screen it doesn't look good at all - in The Magazine site I see very long lines of text and no margins!</p>
      <p>That said, about the specific issue of your article, the few reading experiences I had with e-books (even those made by corporate publishers) were disappointing. I wonder if there isn't a way to transfer (translate?) a book design layout made with, say, Indesign, to a tablet or an e-reader device, for example using the pdf format which still seems to be the best for rendering books layout (by the way, didn't Amazon introduce a sort of "as printed" e-books format?)</p>
