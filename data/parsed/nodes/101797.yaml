    html: <p>Nicola – You can certainly do that, but then what you get is a <em>static</em> layout, which only works if you're viewing it on an appropriately sized and oriented screen. What I’m talking about is <em>flexible</em>, adaptive layout. And having the tools to design that well.</p>
