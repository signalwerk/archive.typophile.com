    <p>Some on this list might be interested in the article I just wrote for <em>The Magazine</em> about the typography of ebooks and design for the screen – or rather, for a plethora of screens:</p>
    <p><a href="http://the-magazine.org/13/unbound-pages" title="http://the-magazine.org/13/unbound-pages">http://the-magazine.org/13/unbound-pages</a></p>
    <p>Although <em>The Magazine</em> is subscription based, non-subscribers can read the full text of one article a month. </p>
    <p>John</p>
