    html: |-
      <p>Very clearly written and expressed, without being condescending - nicely done. I certainly agree that it's high time reading software took layout seriously. BTW, I like the "return-from-footnote" links!</p>
      <p>One thing I'd love to see properly implemented is multiple columns. The main question there is: how do you reconcile that with vertical scrolling? Here's an idea: don't. Scroll <em>horizontally</em> instead! :-)  In fact the human existence -including our reading "hardware", from the acuity of the retina to the structure of the neck- is much stronger in the horizontal dimension. The ancient scroll was right on.</p>
      <p>hhp</p>
