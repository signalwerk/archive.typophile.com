      <p>Hrant – Pagination based on the actual screen you’re reading on would eliminate the need for “scrolling” as we use it now. Instead, you’d page down (or over) from one multi-column page (if that’s appropriate to the screen size &amp; shape) to the next. </p>
      <p>But you’re quite right that multiple columns on a “page” larger than the screen makes no sense whatsoever. </p>
      <p>John</p>
