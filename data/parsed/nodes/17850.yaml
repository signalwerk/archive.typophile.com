    <p>This a very basic question and I'm almost embarassed to ask, but anyway...<br>
    It's easy to define the stress (angle) of round shapes such as o, p, b, etc, but how about in other shapes?<br>
    For example, in the sample below the only stress I can easily find are in the letters o, d, and the bowl of the P. Even for the n (which should be an easy one, shouldn't it?) I can't really figure it out. I feel I am still <em>looking</em> but not yet <em>seeing</em>. Heeelp!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/fournier_detalhes.png"></div><p></p>
