      <p>Thank for your answers. I agree with both of you. Maybe I'm "looking too hard"?<br>
      And by the way, if anyone cares, those characters are from a (reproduction of) Fournier page. My difficulty was that I wanted to indicate the stress angle over the characters to show it; but while Renaissance characters were no problem, I got kind of stuck here.</p>
      <p>I suppose it's because since earlier typeforms are more calligraphic, the stress is more apparent and consistant trough various characters. As typeforms turn less "written" and more "sculpted" those rules don't apply as much.</p>
