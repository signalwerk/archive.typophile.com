      <p>Stress angle is, IMHO, mostly a "theoretical construction" used to illustrate how letters in a typeface are related to each other. </p>
      <p>Bodonis have vertical stress, and yet their "M"s have the same weight distribution of your sample.</p>
      <p>-- <a href="http://www.omine.net/" rel="nofollow">omine.net</a></p>
