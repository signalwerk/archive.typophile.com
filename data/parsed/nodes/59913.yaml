    html: |-
      <p>Hi Stephen,</p>
      <p>Thanks for the link, WPA Gothic is quite similar, and could possibly do the job well. It definitely nails it on the capital Y.</p>
      <p>After further examination, it's the capital M in 'New Deal' that really does it for me. I've done some more research and found a number of fonts that fit the bill to a certain extent, but none of them are able to quite capture the modern industrial feel just right:</p>
      <p><a href="http://www.fontshop.com/fonts/singles/2rebels/gagarin_anna/" rel="nofollow">Gagarin Anna</a><br>
      <a href="http://www.letterbox.net.au/store/order_fonts_berber.php" rel="nofollow">Berber</a><br>
      <a href="http://www.chank.com/font_detail.php?sku=5123" rel="nofollow">Liquorstore</a></p>
      <p>Perhaps I'm best off modifying one of these appropriately? I've thought about contacting Chank to create a more appropriate capital M.</p>
