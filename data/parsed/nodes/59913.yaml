    <p>Hi folks,</p>
    <p>I'm looking for a typeface similar to Neville Brody's 'New Deal' which he created for the film <em>Public Enemies</em>. However, to my knowledge it was commissioned for the film and isn't available for sale and use elsewhere. It does however, have many characteristics that I'm in love with and it is a perfect fit for a project I have in the works. Any advice on a similar typeface would be much appreciated.</p>
    <p>More details on the 'New Deal' typeface: <a href="http://www.aisleone.net/2009/typography/new-deal-typeface-by-neville-brody/" title="http://www.aisleone.net/2009/typography/new-deal-typeface-by-neville-brody/">http://www.aisleone.net/2009/typography/new-deal-typeface-by-neville-brody/</a></p>
    <p>Cheers in advance.</p>
