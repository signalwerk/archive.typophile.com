      <p>I have received some clarification about the bitmap font with regards HVFULLSC.  Wynard Marais says:</p>
      <p>"&gt; <a href="https://web.archive.org/web/20140818212807/http://www.softpedia.com/get/Tweak/Video-Tweak/HVFULLSC-Full-Screen-Video-Card-and-CPI-Fonts.shtml" title="http://www.softpedia.com/get/Tweak/Video-Tweak/HVFULLSC-Full-Screen-Video-Card-and-CPI-Fonts.shtml">http://www.softpedia.com/get/Tweak/Video-Tweak/HVFULLSC-Full-Screen-Vide...</a></p>
      <p>I don't think my stuff would be the same at all. The fonts use internally by the vga adapter will likely only be a bit mask with no anti-aliasing etc. (I would expect anyway, since the orgins date back to when "PCs" in a sense were first conceived. ) I'm however completely out of depth commenting on how it would work. I've never worked with anything like that, the bitmap fonts I generate are itended to be used as textures in graphics APIs like OpenGL and DirectX which are abstractions above the hardware level. The application in the link I suspect would replace some binary font set programmed into a flash/eeprom on the video card somewhere..."</p>
      <p>Thus if there are some techies on this forum that want to test the bitmap font for video cards to see if it happens / in a quality way, that would be interesting.</p>
      <p>Also I have amended my original posting including topic subject line as result of this latest information.</p>
