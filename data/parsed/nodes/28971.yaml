      <p>For a facsimile see sheet no 2 in:<br>
      Dreyfus, John (ed.), Type specimen facsimiles. Reproduction of fifteen type specimen sheets. Bowes &amp; Bowes: London 1963</p>
      <p>The original specimen is in the Haeberlin / Mori collection of the Stadt- und Universitätsbibliothek, Frankfurt am Main. It was thought to be destroyed in the Second World War, but in fact it was only mislaid.<br>
      See also James Mosley's introduction on page [19] in<br>
      Harry Carter: A view of early typography, reprinted edition, Hyphen Press, London 2002</p>
