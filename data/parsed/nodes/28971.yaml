    <p>I am looking into th origins of Stempel garamond and from what I understand it was adapted in 1924 from a specimen sheet by Egenolff-Berner from 1592 (Frankfurt). The garamond's type used to make this specimen sheet where aquired by Jacques Sabon from the Plantin print shop in Antwerp. I am wondering where this sheet is being kept and if there is a way to get a digital copy of it. All I could find online was this crappy gif.<br>
    thanks</p>
    <p>Seb</p>
