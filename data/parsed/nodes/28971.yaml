      <p>1925<br>
      "Als Hausschnitt entsteht unter der Leitung von Dr. Rudolf Wolf (1895-1942) die Garamond-Schriftenfamilie der D.Stempel AG. Als Studienunterlagen sind die schönsten Pariser Drucke aus Garamonds reifster Zeit herangezogen worden, desgleichen die Klassiker des Andreas Wechel, der seit etwa 1575 in Frankfurt Schriftbestände aus dem Nachlaß Garamonds benutzt hat."</p>
      <p>"Stempel-Garamond was designed 1925 by Dr. Rudolf Wolf (1895-1942). Based on documents of the most beautiful parisienne prints from Garamonds highest developped time. Although were used the classics of Andreas Wechel, who since 1575 used fonts from Garamond in Frankfurt."</p>
      <p>Source:<br>
      <a href="http://www.schriftenservice-d-stempel.de/ChronikStempel.pdf" title="http://www.schriftenservice-d-stempel.de/ChronikStempel.pdf">http://www.schriftenservice-d-stempel.de/ChronikStempel.pdf</a></p>
      <p><a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a></p>
