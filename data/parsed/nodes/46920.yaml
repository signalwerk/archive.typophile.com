    html: <p>This is most likely <a href="/wiki/lettering" class="freelinking" rel="nofollow">lettering</a>, not typography. It is sign painting by hand and not based on any single typeface. That said, <a href="http://www.fontshop.com/fonts/downloads/house_industries/neutraface_no_2_collection/" rel="nofollow">Neutraface</a>, which is quite similar as you observed, does indeed have this sort of G. See the <a href="http://www.fontshop.com/fonts/singles/house_industries/neutra_2_display_titling/?sample_text=See%20alternates%20below.&amp;sample_size=24&amp;acs_ss=2" rel="nofollow">alternates</a>.</p>
