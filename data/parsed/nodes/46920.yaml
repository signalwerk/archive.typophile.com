  html: |-
    <p>Hello everyone,</p>
    <p>I came across this photo took in Paris during the occupation, in 1943. I am very interested in the banners, and I am wondering if anyone has some insights about the types used there, especially the "organisation" on the right... I just can't put a name on this one, I actually don't even know if this is a typeface. Looks a bit like Eagle or Neutra, but some stuff won't fit (like the G)... any help?</p>
    <p>dr</p>
