      <p><cite> &gt; but I thought this was still influenced by a typeface.</cite></p>
      <p>It is entirely likely that, on the contrary, there were typefaces from the period influenced by the popular sign-painter styles. I believe that is the more common directionality for influence before the latter quarter of the 20th century.</p>
