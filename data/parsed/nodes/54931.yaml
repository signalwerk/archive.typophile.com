    html: |-
      <p>I thought I'd bump up this thread and show the evolution of the logo. Here is the original in its spruced up form:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shot_1284189046_6524.png"></div><p></p>
      <p>and the same in application on the website:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bvckup-1_4731.png"></div><p></p>
      <p>and on the blog:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bvckup-2_3667.png"></div><p></p>
      <p>Then, I had it reworked for the second version.</p>
      <p>Kept the "inverted A / delta / shield" symbol, but switching from the uppercase Gotham to the lowercase Alright Sans &lt;- my new absolute favorite sans (Thanks, Jackson!). The original logo was a bit too grand and pompous for what the software was/is and it needed to be simpler.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bvckup-3_4960.png"></div><p></p>
      <p>Incidentally, the logo landed itself naturally to a quirky holiday greeting card (for the mailing list subscribers), and this is what I wanted to share in the first place: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bvckup-4_6402.jpg"></div><p></p>
      <p>Hope you, guys, like it. And in any case - </p>
      <p>¡sɐɯʇsıɹɥɔ ʎɹɹǝɯ</p>
      <p>:)</p>
