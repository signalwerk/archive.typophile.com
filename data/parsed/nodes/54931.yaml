    <p>I'm playing with some branding ideas for a software product and there's one quirky idea that I'd really love to get a feedback for. </p>
    <p>The image is linked below, but let me first just give a quick summary of a product. </p>
    <p>It is a form of a backup software, which basically makes copies of specified files so to protect against the data loss due to the hardware failures and assist with the disaster recovery.</p>
    <p>If you are going to look, remember your first, 3 second impressions and let me know what they are. Just instant associations and whether it's memorable and easy to recall if needed. I'm really curious how it looks to other people :-)</p>
    <p>The image is <a class="freelinking external" href="http://swapped.cc/stuff/tmp/bvckup.png" rel="nofollow">__here__</a>.</p>
    <p>Thanks</p>
