  html: |-
    <p>We just released the second in our series "The Ten Commandments of George Lois." The quotation reads  <a class="freelinking external" href="http://typographyshop.com/george_lois_creative_act_mens_t-shirt.html" rel="nofollow">The creative act, the defeat of habit by originality, overcomes everything.</a> When I first approached George about collaborating, this was his immediate suggestion and remains one of his more celebrated statements.</p>
    <p>My favorite quote of his, "<a class="freelinking external" href="http://typographyshop.com/george_lois_great_ideas_mens_t-shirt.html" rel="nofollow">Great ideas can't be tested. Only mediocre ideas can be tested</a>" was the first release in the series. </p>
    <p>A portion of the proceeds from sales of this shirt will benefit the Herschel Levit scholarship fund at Pratt Institute, Mr. Lois' alma mater.</p>
