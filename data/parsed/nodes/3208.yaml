  html: <p>The H.P. Lovecraft Historical Society (NPLHS) are constructing a "complete 17th-century version of the fabled <a href="http://www.cthulhulives.org/necronomicontest/contest.html"><i>Necronomicon</i></a>! Using a comprehensive set of custom-designed vintage fonts, artwork and text." <br> <br>While the contest is related to writing passages, it'd be interesting to see (from a typographer's standpoint) whether their version would stand up to the rigorous scrutiny of the Typophiles. <br> <br>Their goal is to make it a downloadable PDF that could be printed and bound (so I guess it'll be only so realistic). But they have some example <a href="http://www.cthulhulives.org/necronomicontest/woodcuts.html">woodcuts</a>, <a href="http://www.cthulhulives.org/necronomicontest/deccaps.html">decorative intitial caps</a>, <a href="http://www.cthulhulives.org/necronomicontest/pagedecs.html">page decorations</a> and some example <a href="http://www.cthulhulives.org/necronomicontest/NconSamples.pdf">PDF pages</a>. They seem to be mining the real thing for their facsimile, but I'm sure they're slipping up a few times. The PDF is a good way to scrutinize. <br> <br>If you're not familiar, here's some <a href="http://www.geocities.com/SoHo/9879/nechist.htm">info on <i>The Necronomicon</i></a> from the man himself, H.P. </p>
  html_clean: <p>The H.P. Lovecraft Historical Society (NPLHS) are constructing a "complete 17th-century version of the fabled <a href="http://www.cthulhulives.org/necronomicontest/contest.html" class="link-external"><i>Necronomicon</i></a>! Using a comprehensive set of custom-designed vintage fonts, artwork and text." <br> <br>While the contest is related to writing passages, it'd be interesting to see (from a typographer's standpoint) whether their version would stand up to the rigorous scrutiny of the Typophiles. <br> <br>Their goal is to make it a downloadable PDF that could be printed and bound (so I guess it'll be only so realistic). But they have some example <a href="http://www.cthulhulives.org/necronomicontest/woodcuts.html" class="link-external">woodcuts</a>, <a href="http://www.cthulhulives.org/necronomicontest/deccaps.html" class="link-external">decorative intitial caps</a>, <a href="http://www.cthulhulives.org/necronomicontest/pagedecs.html" class="link-external">page decorations</a> and some example <a href="http://www.cthulhulives.org/necronomicontest/NconSamples.pdf" class="link-external">PDF pages</a>. They seem to be mining the real thing for their facsimile, but I'm sure they're slipping up a few times. The PDF is a good way to scrutinize. <br> <br>If you're not familiar, here's some <a href="http://www.geocities.com/SoHo/9879/nechist.htm" class="link-external">info on <i>The Necronomicon</i></a> from the man himself, H.P. </p>
