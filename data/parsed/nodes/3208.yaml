    html: <p>One of the people involved with this (possibly the only one) is the talented prop maker <a href="http://www.ahleman.com/" target="_blank">Andrew Leman</a>. He's really into this stuff, so I would think it would at least <i>appear</i> to be authentic, even if it's completely concocted. <br> <br>I heard from him after writing my article about the use of type in movies (<a href="http://www.ms-studio.com/typecasting.html" target="_blank">here</a>). He seems to be one of the few people working in Hollywood who cares about type. He recently started selling some of <a href="http://www.myfonts.com/foundry/ephemera/" target="_blank">his fonts</a> on MyFonts, too.</p>
