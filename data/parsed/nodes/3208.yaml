    html: <p>You only go crazy if you *understand* it. Luckily for me, I don't read Latin at all. <br> <br>As for the HPLHS and fonts, I've evaluated some of their freeware stuff, and it was pretty abysmal. Bad enough that I decided not to give them feedback because I didn't know where to start. They needed basic ideas like sidebearings sorted out. You can see this in the sample above. Compare the b-long-s pair with the "is" or "os" pairs. <br> <br>That aside, these folks are great, and some of their other stuff is truly wonderful. I have bought quite a few copies of the "Shoggoth on the Roof" CD (though beware of imperfect reproductions). They also have tons of cool resources for live-action Call of Cthulhu role-playing. <br> <br>Cheers, <br> <br>T</p>
