    <p>I don't know know whether this is really a question, or a statement, or whatever, but has anyone else looked at the fonts that are used on episodes of LOST?</p>
    <p>The countdown timer inside the hatch is using Arial [except for the digit 1, which is in Helvetica], however most everything in the hatch looks like it's from the 70s. So Arial wouldn't have been around yet.</p>
    <p>And then there's that Apple II computer. Of course the computer display was done in post, but... why Palatino? Why there?</p>
    <p>For some reason, those details bugged me so much I was looking at them frame-by-frame on the TiVo. Anyone care to add anyting to my ramble this morning? :)</p>
    <p>mike</p>
