      <p>for a while i stayed fascinated by the show like a sore tooth. i knew it was painfully bad, but i kept checking it out. replete with mixed up pseudo-spiritual iconography, ridiculous plot twists, atrocious acting, and inconsistent character portraits. for a while these questions really bugged me: why didn't the korean characters mention that the dharma logo / taoist trigrams appear on the korean flag ? why doesn't anyone mention that the ultimate number 108 is quasi-magical in some hindu traditions ? why doesn't anyone notice that the infamous doomed numbers 4 8 15 16 23 42 are all streets in new york where A train exits are ?  </p>
      <p>then i heard one of the creators interviewed on steven colbert and i got my answer: they were winging it ! making it up as they went along...  lame-o.  it seems the design problems are just part of the same process. "ok, that'll do for now".</p>
      <p>but i'm grateful, as that helped me lose interest.</p>
