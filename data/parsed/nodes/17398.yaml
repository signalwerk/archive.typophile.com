      <p>I asked this because I will be doing some features on type used for television series (<a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=BT.107404.0.0" rel="nofollow">Bank Gothic</a> for <a href="http://www.fox.com/24/" rel="nofollow">24</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FB.6602.0.0" rel="nofollow">Clicker</a> for <a href="http://www.cbs.com/primetime/csi/" rel="nofollow">CSI</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=FF.2961.1.6" rel="nofollow">FF Confidential</a> for <a href="http://abc.go.com/primetime/alias/" rel="nofollow">Alias</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=C.420.0.3" rel="nofollow">Trajan</a> for <a href="http://www.hbo.com/sixfeetunder/" rel="nofollow">Six Feet Under</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=E.6913.0.0" rel="nofollow">Democratica</a> for <a href="http://www.hbo.com/carnivale/" rel="nofollow">Carnivale</a> and so on...), and the articles certainly would benefit from some illustrations.</p>
      <p>Anybody has some more suggestions on interesting use of type in television series?</p>
