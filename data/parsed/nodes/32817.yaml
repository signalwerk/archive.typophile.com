    <p>greetings everybody, i stumbled on this site while searching for a solution to my mess..and you are kind of my last hope, as my dead line is in about 5-6 hours...</p>
    <p>the situation:<br>
    i have .doc files, with <a href="/wiki/cyrillic" class="freelinking" rel="nofollow">cyrillic</a> text (macedonian if it matters), the font used for displaying is MAC C TIMES...the problem is that i desperately need it preferrebly in myriad pro light condensed cyr (i guess this exists) or some other condensed font<br>
    (i'm on windows xp, indesign cs2)</p>
    <p>whenever i select the text and choose another cyr font (minion pro cyr for instance), it converts the cyr characters to latin with some errors...</p>
    <p>so, what could i possibly try so that i can select the text, choose a variant of myriad pro cyr...and the letters stay cyrillic?<br>
    or is there any other way to get things done? find/replace maybe?</p>
    <p>i have used fontlab for some basic stuff..so if you have a suggestion, please consider writing at least a small hint on where the settings/options are where i'd have to be careful..</p>
    <p>please if you're reading this and have the slightest clue...consider sharing it, i really need this one badly..</p>
    <p>thanks in advance...</p>
