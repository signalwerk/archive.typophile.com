    html: |-
      <p>Microsoft Word for Windows has a nice built-in conversion routine labeled "Fix Broken Text". It deals with formatted text, RTF etc. as well as with plain text. </p>
      <p>For Mac OS, there is the excellent <a href="http://www.alanwood.net/unicode/utilities_fonts_macosx.html#cyclone">Cyclone</a>. </p>
      <p>For Windows, I often use <a href="http://www.unipad.org/">SC UniPad</a> for this kind of work. </p>
      <p>Also, <a href="http://www.alanwood.net/unicode/">Alan Wood’s Unicode resource page</a> in general is worth recommending as a source of such information. </p>
      <p>Adam</p>
