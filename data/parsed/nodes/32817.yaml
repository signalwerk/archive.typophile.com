      <p>So, your problem is that your original font and text are likely MacCyrillic. Meanwhile InDesign (both platforms), Windows, Myriad Pro, and newer Mac OSes are all using Unicode.</p>
      <p>So, go to that "Universal Cyrillic Decoder" and tell it the source text is "maccyrillic" and you want it as Unicode.</p>
      <p>Cheers,</p>
      <p>T</p>
