      <p>"So I don't want any change in the current behaviors if I grab the sidebearing and move it: it moves, end of story."</p>
      <p>Oh. Like every other advance I've proposed, from reusing pre digitized parts for congruent forms, to epar, i was going to drive to your office in a big ugly tank, point a 14 foot pistol at your screen and force you to use my sbs.</p>
      <p>For the others to consider...</p>
      <p>What can happen when you stop mousing around on everything can depend on the hierarchy you link to the glyph. One point(s) is always the parent, and the other(s) is the child. So, if you're adjusting the sb in a grade-oriented hierarchy or a hierarchy for linear rendering, then sb points are the parents, while if you're adjusting the sb in a weight-oriented hierarchy or for non-liner rendering it's the glyphs' relevant x min and max that are the parents.</p>
      <p>"..implementing control over relationships of shapes in relationships that recognise that outlines and spacing on a UPM grid are directly analogous to outlines and spacing on a device grid."</p>
      <p>Yep. Except it's not really "analogous" because they are the same thing unless you get bogged down in non-integer units per em, sub-pixel positioning, a type1-centic mindset, or impure TT interpreters. A grid's a grid, and as such it has rhythm. Fonts, the point size spectrum, frames of film and a few other things also have rhythm. Everything's fine until one wants to combine these rhythms in hostile development environments.</p>
