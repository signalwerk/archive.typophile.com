      <p>"Changes to the metrics of a key glyph are not automatically applied to the class members,"</p>
      <p>This is exactly why I don't bother using metrics classes in FontLab. Current implementation seems completely half-baked.</p>
      <p>Now, if it *did* work the other way, it would be fab.</p>
      <p>Similarly, with the sidebearing idea that I originally started this discussion with, I don't need any fancy "tie rod." Indeed, I neither need nor want this to be linked to some specific point on the outline—that would be a negative in my book, not to mention more work for the programmer. FontLab already always knows what the sidebearing is. I just want it to move it around to keep it constant. Give me a UI toggle to do so and I'm happy.</p>
      <p>Now, I recognize that other folks may have some more elaborate preference for how it would work. I'm just sayin' that what I want is not actually complicated to implement, and that a more elaborate implementation would actually be less functional to me.</p>
      <p>T</p>
