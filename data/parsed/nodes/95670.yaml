      <p>I stand somewhere between Thomas's overly-mechanical recommendation and Frank's overly-defeatist caveat... There's certainly an advantage to what Thomas has in mind, but it does need to account for internal whitespace. So what about this: the designer defines a ratio (which depending on the design and what the designer believes could be 1:1, or 4:3 or maybe even something more complex) and the shift in the black causes a different shift in the sidebearing depending on the ratio.</p>
      <p>Remember that type design is always eyeball-iterative; it's not like any algorithm can obviate that, but good algorithms can certainly save time.</p>
      <p>As for what to link it to: isn't that what FontLab's red horizontal line is for?</p>
