      <p>I'd like to link glyph sets to dynamically have the same width (or match side bearings), based on a master of my choice, so any change I make to the parent automatically propagates to the children. Or even use classes as references as they contain sets I use constantly. </p>
      <p>This way, for example, as I modify the shape or sidebearings of an A all of its diacritic children will always match, and I don't have to hand-update all of them. Upper, lower, or small cap x 5+ permutations adds up quickly every time I nudge a point. </p>
      <p>Mcs</p>
