    date_raw: 28 Aug 2012 — 11:02pm
    votes: null
    html: "<p>Frank, going back to your and my 19 August posts, 'criticism' was the wrong word. After reading the discussion which followed again, I think it boils down to this: As long as we deal with dumb outline description and editing tools, Thomas suggestion (meant as an option) is fine, keeping it simple. We will likely do some manual fine-tuning anyway. Once we get parametric shape description and editing tools, however, a more intelligent approach to sidebearings makes sense. What struck me as odd, in retrospect, was the idea to combine too-intelligent sidebearings with non-intelligent outline description.</p>"
