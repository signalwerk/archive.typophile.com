      <p>"...a sidebearing link in the TT hinting interface: it is in fact the same thing..."</p>
      <p>Excellent! </p>
      <p>Start by adding the side bearing points to the format and display as if they were part of the glyph.<br>
      Then subtract the point indices from the equation, they are not important, but can screw things up.<br>
      Then, turn your otherwise dumb lump of points into a smart lump, not just the sb/extrema smarts, but all of it.<br>
      Then, wrangle up a ui where all the dimensions are present, in traditional drafting locations, off the glyph except diagonals,<br>
      Then, we can either change the contour or the dimensions and good things happen, besides it being instructed.</p>
      <p>Another, less long-term fun-house route is class-basing side bearings, and locking them.</p>
