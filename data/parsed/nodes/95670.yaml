      <p>Thomas: <em>Maybe you and I have different ideas of what we would like to happen? For me, even if "sidebearings linked to extrema" is on, I'm assuming that's a one-way link and if I deliberately move the sidebearing, that's because I want to change it. So I don't want any change in the current behaviors if I grab the sidebearing and move it: it moves, end of story.</em></p>
      <p>I think there is a distinction to be made between improved UI behaviours for implementing pre-digital type paradigms in digital fonts -- a little less busyness, but still business as usual -- and implementing control over relationships of shapes in relationships that recognise that outlines and spacing on a UPM grid are directly analogous to outlines and spacing on a device grid. In the latter view, there are kinds of adjustments to spacing in which one would very much like the outlines to intelligently follow changes to width. Or, put it another way, if you can do it in hinting -- or if you used to be able to do it in hinting -- why not do it on the UPM grid?</p>
