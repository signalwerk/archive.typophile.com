      <p>Here's a more complex but, I think, more useful application of Tom's idea: allow explicit linking of sidebearing distance to a specific node on the outline, rather than as a constant relative to the left and right extremes. This would enable one to easily control the distance relative to, e.g. vertical stems instead of serif tips. I considered trying this relative to the FL measuring line, but that needs to be moveable, so it makes more sense to apply the distances explicitly as links between nodes and sidebearings, as illustrated by the green dotted lines in this illustration:<br>
