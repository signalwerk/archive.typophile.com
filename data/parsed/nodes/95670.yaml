      <p>Thomas' request makes sense. I don't understand the criticism of it. This is a request for a very simple mechanism that links left/right sidebearing to whatever the glyph's left/right extremum is, and makes sure that the sidebearing value remains the same as outlines get adjusted. Put differently, do not consider sidebearings as implicit in advance width and outline data, instead consider sidebearings as independent of outline data. Such a simple mechanism does not need to care for internal whitespace or any rationes. Plus it is suggested to be optional, so nothing is taken away from you.<br>
      (Fond of the idea because I saw a need for it myself when writing the <a href="http://kltf.de/kltf_otproduction.htm#transformer" target="_blank" rel="nofollow">Transformer</a>.)</p>
