      <p>"The other way, though, one moves the right side bearing, and what one would like to happen is complicated."</p>
      <p>Maybe you and I have different ideas of what we would like to happen? For me, even if "sidebearings linked to extrema" is on, I'm assuming that's a one-way link and if I deliberately move the sidebearing, that's because I want to change it. So I don't want any change in the current behaviors if I grab the sidebearing and move it: it moves, end of story.</p>
      <p>Now, the interactions with class-based sidebearings are interesting, admittedly. Probably if it's the base glyph for the class, the change affects all class members. If it's not the base glyph in the class, then the current glyph becomes an exception in the class?</p>
      <p>Cheers,</p>
      <p>T</p>
