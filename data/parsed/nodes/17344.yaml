    <p>A <a href="/node/12055" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ligature</a> combining a <a href="/node/19033" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">long s</a> and a short s. Once common in English, the eszett, or sharp s, is now only used in German&nbsp;typesetting.</p>
    <p>Unicode: <a href="http://www.fileformat.info/info/unicode/char/00df/index.htm">U+<span class="caps">00DF</span></a></p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/6178">long s + s vs. long s + z</a><br><a href="http://typophile.com/node/17343">Script Eszett</a><br><a href="http://typophile.com/node/33647">Uppercase germandbls is Coming to&nbsp;Unicode</a></p>
    <p><strong>Additional&nbsp;Articles:</strong></p>
    <p>From the ligature to a letter: <span class="caps">SIGNA</span> 9 - The Uppercase Eszett<br>
    A special issue about the history of the eszett in German only.<br><a href="http://www.signographie.de/cms/signa_9.htm">http://www.signographie.de/cms/signa_9.htm</a></p>
