      <p>Weak indeed. The reverse slant of the script is an identifiable part of the Holiday Inn brand. Without that it loses its equity.</p>
      <p>Even as a small child I recall becoming distressed at radical changes in brand identity. Even though the name was spelled the same and I could read, too great a change in type or color could make the thing unrecognizable.</p>
