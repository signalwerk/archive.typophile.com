      <p>I read this interview with <a href="http://www.byrnerobotics.com/" rel="nofollow">John Byrne</a>, the legendary comic book artist, where he admitted that as a beginning artist he drew the <a href="http://www.impawards.com/2006/superman_returns.html" rel="nofollow">logo on Superman's chest</a> like two little fish-like shapes -- until he realised it actually was a red 'S' on a yellow shield.</p>
      <p>And this very morning my daughter discovered that the <a href="http://www.hypercarrefour.be/" rel="nofollow">logo</a> on her cereal box is a 'c' reversed out of a diamond shape. :^)</p>
