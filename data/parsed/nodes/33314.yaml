    html: <p>BTW <a href="http://www.fontshop.com/search/?q=egizio&amp;x=0&amp;y=0&amp;sample_text=LIFE&amp;sample_size=96" rel="nofollow">Egizio</a> is the only slab that has the rounded inside corners where the stems join the arms. In the <a href="/wiki/David%20Berlow%27s" class="freelinking" rel="nofollow">David Berlow's</a> <a href="http://www.fontshop.com/search/?q=belizio&amp;x=0&amp;y=0&amp;sample_text=LIFE&amp;sample_size=96" rel="nofollow">version</a> the corners are less rounded.</p>
