    html: <p>Is there no efficient way of avoiding the different scaling glyphs as they -big and small- tend to occupy all of the space available in each glyph cell? That used to be a drag with Fontographer. I generate the font directly from Corel normally and then open the font in the font editor, but perhaps there's been an improvement with Fontlab. Or hasn't it?</p>
