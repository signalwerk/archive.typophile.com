  - id: 8865
    user: 1215
    date: 2003-09-04T05:04:00
    date_raw: 4 Sep 2003 — 5:04am
    votes: null
    html: <p>In a design like this, using non-integer points will definitely cause a headache. As pointed out, when a Postscript Type 1 font is generated from this data, all those coordinates will be rounded. The PS T1 spec requires coordinates as integers.  <br> <br>This will inevitably lead to grief as, for instance, your top horizontal will become narrower and your bottom will become wider. <br> <br>BTW, at high-resolution 2540 dpi output, your type would have to be set at 57 pt or larger before the rasterizer could actually render the difference of 0.5 em unit. Lower-resolution output would need to be even larger. <br> <br>Do as James says and use the Points &gt; Align to Points feature. I also recommend setting File &gt; Preferences &gt; Editing Behavior so that Grid spacing = 1 em unit (I think that might be the default, but check). Then turn on View &gt; Snap to Grid. This will keep your point placement on the whole numbers. <br> <br>Or use FontLab. <br> <br>-- Kent. <br></p>
    html_clean: <p>In a design like this, using non-integer points will definitely cause a headache. As pointed out, when a Postscript Type 1 font is generated from this data, all those coordinates will be rounded. The PS T1 spec requires coordinates as integers.  <br> <br>This will inevitably lead to grief as, for instance, your top horizontal will become narrower and your bottom will become wider. <br> <br>BTW, at high-resolution 2540 dpi output, your type would have to be set at 57 pt or larger before the rasterizer could actually render the difference of 0.5 em unit. Lower-resolution output would need to be even larger. <br> <br>Do as James says and use the Points &gt; Align to Points feature. I also recommend setting File &gt; Preferences &gt; Editing Behavior so that Grid spacing = 1 em unit (I think that might be the default, but check). Then turn on View &gt; Snap to Grid. This will keep your point placement on the whole numbers. <br> <br>Or use FontLab. <br> <br>-- Kent. <br></p>
