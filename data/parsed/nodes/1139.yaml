  html: <p>Hi guys, <br> <br>For research I opened Tarzana (Suzanna Licko) en Meta (Erik Spiekerman) to see how they finished up there typefaces. <br>I saw that they put all the glyph-points on whole coordinates. Is this usual if you want to make a 'good' type? <br>My points are now ad random in place. I will correct this if it makes the font better. Any thoughts on this subject? <br> <br>I saw on a laserwriter print I made that some characters look thicker. Can it be this has to do with the gridfitting? <br> <br>Thanks, <br>Ren</p>
