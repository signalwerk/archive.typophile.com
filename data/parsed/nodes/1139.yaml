    html: <p>Postscript typefaces only work with rounded numbers for coordinates, <br>so any PS T1 font will have "whole" coordinates. <br>But, personally, I think you really should avoid working with non-rounded <br>numbers. You get more focused on what you're doing. IMHO.</p>
