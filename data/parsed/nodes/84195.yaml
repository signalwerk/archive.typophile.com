    html: <p>I've checked the catalogues of Blambot, Comicraft, and the comic fonts from Canada Type, as well as the Apostrophic Labs and VTC free comic fonts, but it turns out that while I don't see an exact match in the style of the type, but that could just be because some features are lost in reduction, the distinctive characteristics of the R, the W, the E, and the Q are matched in <a class="freelinking external" href="http://www.studiodae.com/whizfont.html" rel="nofollow">WhizBang</a>, which I had encountered before, so that could be it.</p>
