      <p>Actually, looking at the provided specimen of WhizBang, they don't match in one very obvious respect: it would at least have to be letterspaced to match the word balloon examples shown.</p>
      <p>Also, there is a subtle difference in the letter forms: the letter D in WhizBang does not have an overhang on the top (the letter P does), unlike the target face.</p>
