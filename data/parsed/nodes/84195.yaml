    <p>I've been going through a lot of webcomics, trying to identify the typefaces which they use for their lettering.</p>
    <p>One webcomic seems to have a particularly nice typeface for lettering:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lana_sam2_6630.jpg"></div><p></p>
    <p>Except that the exclamation mark is not slanted, this reminds me of the lettering of DC letterer Mitt Snappin, although there is also some resemblance to that of Marvel's Artie Simek. (The typeface, though, is definitely not Comicraft's Chatterbox, which closely resembles Artie Simek's lettering.)</p>
    <p>Occasionally, I've noticed some imperfections in kerning:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lana_sam1_6177.jpg"></div><p></p>
    <p>and</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lana_sam3_6662.jpg"></div><p></p>
    <p>To make things as easy as possible, here's a complete alphabet:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lanaalph8_4682.jpg"></div><p></p>
    <p>The comic itself, "Spying With Lana", would have to be categorized as NSFW, incidentally.</p>
