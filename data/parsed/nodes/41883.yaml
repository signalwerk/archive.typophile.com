    <p>I'm making this font on my photo editing software (the GIMP, to be exact). I've used the same oval-shaped brush at 45 degrees on everything but the cross on the A, which I've noticed many fonts make thin. I studied the history of each letter before deciding on the design, primarily using wikipedia, to make sure I put the curves in the places they should be from a historical standpoint.<br>
    I may make this in to a serif font, and I may relegate a few to italics, depending on how the full set looks.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/font sample one_4590.jpg"></div><p></p>
    <p>Oh yeah, I left the guidelines in so you could see what I'm doing on each letter.</p>
    <p>I'm not sure what else should go in this post, as I'm new, so advice on board etiquette would also be appreciated.</p>
