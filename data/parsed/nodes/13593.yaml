    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Norbert Florendo</strong></p>
    <p>Norbert Florendo (b. 19--) is a <a href="/wiki/Graphic%20Designer" class="freelinking" rel="nofollow">graphic designer</a> and <a href="/wiki/Typographer" class="freelinking" rel="nofollow">typographer</a>.</p>
    <p>He served as Art Director, Ad Manager, Creative Director, Manager of Multimedia at Compugraphic and <a href="/wiki/Agfa" class="freelinking" rel="nofollow">Agfa</a>, and <a href="/wiki/Typographer%20in%20Residence" class="freelinking" rel="nofollow">Typographer in Residence</a> during the years between <a href="/wiki/Allan%20Haley" class="freelinking" rel="nofollow">Allan Haley</a> and <a href="/wiki/Cynthia%20Hollandsworth" class="freelinking" rel="nofollow">Cynthia Hollandsworth</a>.</p>
    <p>Contributed to the addition of over 400 new and licensed typefaces to the <a href="/wiki/Agfa-Compugraphic" class="freelinking" rel="nofollow">Agfa-Compugraphic</a> library. Principally involved with the acquisition and marketing of <a href="/wiki/Otl%20Aicher" class="freelinking" rel="nofollow">Otl Aicher's</a> <a href="/wiki/Rotis" class="freelinking" rel="nofollow">Rotis</a> Typeface System for Agfa.</p>
    <p>Past Director-At-Large, <a href="/wiki/Type%20Directors%20Club" class="freelinking" rel="nofollow">Type Directors Club</a><br>
    Past TDC Traveling Exhibit Chairperson<br>
    Former member of <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a></p>
    <p>Graduate of <a href="/wiki/Cooper%20Union" class="freelinking" rel="nofollow">The Cooper Union</a> and a calligraphy student of <a href="/wiki/Paul%20Standard" class="freelinking" rel="nofollow">Paul Standard</a>.</p>
