  html: |-
    <p>Hello!</p>
    <p>I'm pleased to invite you to the international online contest «DESIGN FROM BEST 2012» held by Russian «Design-For-Business.ru» design and branding web-portal.</p>
    <p>Participation in the contest is absolutely free. Only logotypes, trademarks and branding (identity) works are accepted for consideration. Number works is not limited.</p>
    <p>Deadline – 2012.07.17 </p>
    <p>English<br>
    <a href="http://design-for-business.ru/competition#en" title="http://design-for-business.ru/competition#en">http://design-for-business.ru/competition#en</a></p>
    <p>Francais<br>
    <a href="http://design-for-business.ru/competition#fr" title="http://design-for-business.ru/competition#fr">http://design-for-business.ru/competition#fr</a></p>
    <p>Deutsch<br>
    <a href="http://design-for-business.ru/competition#de" title="http://design-for-business.ru/competition#de">http://design-for-business.ru/competition#de</a></p>
    <p>Jury:<br>
    Bill Gardner (United States)<br>
    Tony Spaeth (United States)<br>
    Andreas Karl (Austria)<br>
    Jason Little (Australia)<br>
    Pim Nap (Netherlands)<br>
    Vladimir Mijatovic (Serbia)<br>
    Maxim Liviu (Romania)<br>
    Kuba Enzo Rutkowski (Poland)</p>
    <p>Best regards,<br>
    Alexander</p>
