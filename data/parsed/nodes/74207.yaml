      <p><cite>Does this mean that with stylistic alternates the program you use chooses a random glyph from the glyphs you created?</cite></p>
      <p>Yes, it's precisely for that -- leave it to the user to pick any single character. (Ed. Well, the software doesn't choose, it selects the default glyph; but it allows the <em>user</em> to replace it with any other one.)</p>
      <p>Stylistic sets can be created to automatically select one consistent glyph design for a number of alternate characters. For example, if you have a few different paragraph (pilcrow) designs, and different section signs to match the style of each pilcrow, you can create a stylistic set for each combination, so the user doesn't have to pick-and-match combinations by himself.</p>
