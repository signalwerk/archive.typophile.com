    <p>My question is about the difference between stylistic alternates en stylistic sets. What is the difference exactly??<br>
    The manual says this about stylistic alternates... or contextual alternates</p>
    <p><em>Alternate Substitution<br>
    Alternate substitution replaces a glyph with one of the glyphs in a predefined<br>
    list of alternatives. The application that uses the font is expected to<br>
    decide which glyph to choose. A good example of this lookup is to provide<br>
    several versions of some glyph, like the ampersand. Another application is<br>
    the selection of several different forms of ornaments.</em></p>
    <p>Does this mean that with stylistic alternates the program you use chooses a random glyph from the glyphs you created? </p>
    <p>I want the user to be able to choose an alternate glyph...</p>
