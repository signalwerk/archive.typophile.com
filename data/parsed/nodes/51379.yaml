    html: |-
      <p>Well, Christopher, I think each one here is more focused on certain aspects, or periods.<br>
      Personally, I'd be a disaster in identifying non-digital type, especially designs which have not been international or which are not part of my heritage (i.e. Italian types).<br>
      But as long as it cames to the worldwide "post-modern" wave in digital design (the one which preceeded the new generation of younger, more conscious and learned type designers), I was fixed on those Latin letters transmutations almost continuously up to, more or less, seven years ago.<br>
      But although I can tell the names of even the most obscure faces from CalArts students, or used by David Carson, I'd have serious problems in identifying many faces of the more recent years…</p>
      <p>Jeremiah? At least allow me some Isaiah… :=)</p>
