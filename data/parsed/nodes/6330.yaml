    html: <p>... We held an international competition, and we received hundreds of suggestions, along with hundreds of pleas from our dealers not to change. After reviewing all the suggestions, we decided not to make any changes.... <br> <br>I remember participating in that contest. Mind you, those were the pre-Mac times and getting to the stage of comps that were good enough to send to Tokyo, involved a lot of hard work with rotring pens, compasses, repro camera's, colorproofs, etcetera. <br>Image the consternation Sony caused among the participants when they decided to retain the old logo. I have never done a contest ever since...</p>
