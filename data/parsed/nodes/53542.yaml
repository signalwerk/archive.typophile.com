    html: |-
      <p>The new icon is much better, mostly because the colors in the old one are very dull. But tweak that green to have a more intense feeling that works better with the colors of the new MyFonts. </p>
      <p>More importantly, you MUST do a new specimen, because this one is terrible. What you’re showing is a period-inspired design that fits in contemporary settings, but the specimen does not get that across at all. This specimen feels like it took about five minutes, zero thought, and in no way complements all the work you put into the typeface. Include an essay about your inspiration and working process to help people understand what’s going on. You’ve got a versatile face, so use it! Show Galette on a cover, as headlines and as copy in magazines, on packaging and in logos! If you don’t have the time hire a handful of cool young designers from Coroflot and get them do some good stuff. But don’t expect people to grasp the depth of your work from three pages of black-and-white text dumped unceremoniously onto the page.</p>
