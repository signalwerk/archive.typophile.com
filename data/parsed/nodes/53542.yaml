    html: <p>Honestly I would have to see it on MyFonts to see how an intense color looks best. It seems like a cooler color will probably pop best against the red/orange hues that dominate the myFonts icons, but then again a yellowish green could do well, too. Try loading a screenshot of MyFonts into Photoshop and doing ten different versions each in a few different positions to see what works well consistently.</p>
