    html: |-
      <div class="comment-spam-body"><p>I concur in your find.<br>
      So, how legitimate is WSI's Comix Regular?<br>
      I flipped though the Comicraft and Blambot collections but did not spot a match. But perhaps on closer examination? Another comic book/strip font publisher?<br>
      Here is internal font info:<br>
      -----------------------------------------<br>
      Font Name : Comix Regular<br>
      Font ID : 1865<br>
      Family Name : Comix<br>
      Sub Family Name: Regular<br>
      Version : Publisher's Paradise -- Media Graphics International Inc.<br>
      PostScript Name : ComixRegular<br>
      Font Type : True Type<br>
      Copyright : From the WSI-Font Collection. Copyright (c)1993 W.S.I. All Rights Reserved.<br>
      -----------------------------------------</p>
      <p>As for "School Spirit" it's the overused Comic Sans, which is installed as a core font on Microsoft windows.</p>
      <p>By the way if you want an alternative to Comic Sans, you might try Comicraft's <a href="http://www.myfonts.com/fonts/comicraft/soliloquous/" rel="nofollow">Soliloquous</a> and <a href="http://www.myfonts.com/fonts/comicraft/comicrazy/" rel="nofollow">Comicrazy</a>, Ron P. Dunant's <a href="http://www.myfonts.com/fonts/quietdesigns/architect-small-block/" rel="nofollow">Architect Small Block</a>, or Robbie de Villiers' <a href="http://www.myfonts.com/fonts/wilton/saycheez/" rel="nofollow">Saycheez</a>.<br>
      Don</p>
      </div>
