    html: |-
      <p>"SHOP..." looks like <strong>Comix Regular</strong> from WSI-Font Collection (1993).<br>
      Note thought, that WSI is a well known font forgery corporation that was shut down and the font above is probably published without authorization of the original font designer. You can find more info on the subject here:<br>
      <a href="http://www.sanskritweb.net/forgers/wsi.pdf" title="http://www.sanskritweb.net/forgers/wsi.pdf">http://www.sanskritweb.net/forgers/wsi.pdf</a></p>
