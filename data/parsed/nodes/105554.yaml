      <div class="comment-spam-body"><p>I would prefer not to link to a font which is a possible copyright violation -- WSI has a very bad track record. However, they apparently did a few originals and this indeed may be one of them.<br>
      I leave it up to you whether you Google "fonts comix regular wsi" for information.<br>
      Don</p>
      </div>
