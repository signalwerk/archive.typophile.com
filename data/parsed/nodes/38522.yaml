    <h2><a href="/node/38610" title="TypeCon2008 Buffalo Town Hall Meeting, Tues., Nov. 6">TypeCon2008 Buffalo Town Hall Meeting, Tues., Nov. 6</a></h2> 
        <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 30.Oct.2007 7.55am </div>
      <p>SOTA’s going back to Buffalo next week to meet with local crew and others interested in helping to develop the TypeCon2008 program and extracurricular activities.</p>
    <p>Tuesday, November 6, 2007<br>
    6:30pm - 9:00pm<br>
    Old Editions Book Shop &amp; Cafe<br>
    74 East Huron Street<br>
    Buffalo, NY</p>
    <p><a href="http://maps.google.com/maps?f=q&amp;hl=en&amp;q=74+East+Huron+Street%2C+Buffalo%2C+NY">Directions to TypeCon2008 Planning Meeting</a></p>
    <p>All type lovers are encouraged to join us for this fun and informative brainstorming meeting. Coffee and dessert will be served to help fuel your creative juices.</p>
    <p>Anyone interested is welcome to attend, but please RSVP so we know how much caffeine and sugar to have on hand.<br>
    Email: richard at p22.com and info at typesociety.org</p>
