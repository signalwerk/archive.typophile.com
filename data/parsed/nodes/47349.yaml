      <p>Congrats, Toby!  I followed Enzo's development closely on Typophile (then known as <a href="http://typophile.com/node/32881" rel="nofollow">Zai</a>) and I'm pleased to see it released as a FontFont. We'll be sending the newsletter announcing the release in a few weeks. </p>
      <p>We're still fixing some snags in the Advanced Character Set viewer which will reveal all your lovely ligatures and such on each font page. It will be up and running soon. </p>
