      <p>&gt; Ha! That church by the train station, is the one I got baptised in!</p>
      <p>Wow! :-)<br>
      Do you remember what it's called?</p>
      <p>Gus, that's actually an extremely interesting question. Although the structure of the triskelion/eternity* can be considered "intuitive" enough to ascribe any similarity to coincidence (or a shared primordial "culture"), there are in fact some very strong visual similarities between the two cultures** that actually go well beyond that one symbol. This, in spite of the large geographic divide. Recently I heard an explanation of why that's the case, but I don't remember what it was, and I have a feeling it was apocryphal anyway.</p>
      <p>* BTW, just like the Nazis "repurposed" the swastika, the apartheid organization of Terreblanche in South Africa uses a triskelion!</p>
      <p>** Another culture that looks Armenian (or vice versa) is the Basque, along with its environs. I was in Banaguás once (a hamlet near Jaca, in Aragon) and the local church looked faintly but clearly Armenian to me. Actually the Basque <em>language</em> and from what I understand even the genotype seem related to us!</p>
      <p>There's this one khatchkar in a very impressive (if run-down) church complex in the town of Talin (close to the Turkish border) that I saw this summer, with all the Celtic knot-work and everything! I'll try to find my photo of it (actually Nina was there too, and she takes better pictures). Pretty amazing.</p>
      <p>hhp</p>
