      <p>It hardly matters in which UC block a character ends up. An overall well-sorted standard, that horse … </p>
      <p>What hits *me* much more is the design issue. We have seen several new monetary signs born during the last few years. Most recent: Indian Rupee, Armenian Dram. </p>
      <p>For me as a font designer the challenge is:<br>
      a) to make the glyph harmonizing with the writing system it is related to;<br>
      b) to make the glyph suitable to the ﬁgures it will get used with;<br>
      c) to make the glyph fitting to the existing set of international currency signs it will be competing with;<br>
      d) to equally manage a) to c).</p>
      <p>That is quite a task, isn’t it?</p>
