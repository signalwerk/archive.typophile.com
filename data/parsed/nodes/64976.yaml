      <p>Dear John,<br>
      I highly appreciate your business as it benefits to communication through letters and characters :)<br>
      Your (or anybody's else)idea about inclusion of monetary symbols within alphabetic block seems to be really helpful for the font designers. However, there are some considerations, which I'd like to present here.</p>
      <p>First, the monetary symbols belong to the block of simbols performing one-and-the-same function; otherwise anybody looking for the set of those symbols has to search through the whole Unicode and the alphabetic blocks of the world nations, which doesn't make sense. For instance, I could miss Afhgani and Khmer monetary symbols if not hitting upon them at this forum.</p>
      <p>On the other hand, the number of font designers are limited, and for their good it is better to contact the countries' institutions/developers to which they'd like to benefit to. Finally, there are state institutions, who are ISO members and make their official votes at Unicode.</p>
      <p>Best regards,</p>
