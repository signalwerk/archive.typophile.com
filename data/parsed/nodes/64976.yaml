      <p>From: <a href="http://en.wikipedia.org/wiki/Saint_John%27s_Arms" title="http://en.wikipedia.org/wiki/Saint_John%27s_Arms">http://en.wikipedia.org/wiki/Saint_John%27s_Arms</a><br>
      &gt; Unicode standards documents such as U2300 (Miscellaneous<br>
      &gt; Technical, Range 2300–23FF) call it the "Place of Interest sign".</p>
      <p>What do you guys think, would it be smarter to just use this for the Armenian eternity symbol, or to lobby the Consortium to give it its own code point? The main Armenian block does still have 10 empty slots, plus the symbol above might not be a good match neither in expected look nor assumed function*. I just never like the idea of submitting proposals to large organizations, pleading for attention, and then waiting for who knows how long. On the other hand, if there's a Unicode proposal in the works for the Dram maybe this can piggy-back?</p>
      <p>* In fact I can't tell if it's really supposed to be U+2300, or U+2318.</p>
      <p>hhp</p>
