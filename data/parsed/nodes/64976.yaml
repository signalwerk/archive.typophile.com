      <p>In ISO/IEC JTC1/SC2 N4156, SARM, the Armenian National Institute of Standards made in its comments a request for the encoding of the Armenian Eternity Sign.</p>
      <p>Armenia is not a P-Member of the Subcommittee responsible for the Universal Character Set, and their comments did not include the Proposal Summary Form and so unless a proper proposal is made then the only thing that the committee will do is say "Noted".</p>
      <p>I am putting together a proposal. There is VERY LITTLE TIME.</p>
      <p>Please, please, please. Do <em>any</em> of you have examples of this symbol used <strong>in text</strong>? It is no good to say that it is used to organize paragraphs. That is just a rumour without some sort of evidence.</p>
      <p>Also it appears from the SARM comment that two will be needed, right-facing and left-facing. They did explain a particular usage scenario: "Right and left rotations have accordingly active and passive meanings, as in case of Swastika, and are used in order to accentuate these meanings. For example, a cradle for а boy is decorated with the right whirling eternity sign and a cradle for а girl with the left whirling eternity sign."</p>
      <p>We do have RIGHT-FACING SVASTI SIGN and LEFT-FACING SVASTI SIGN so I would see little problem in having RIGHT-FACING ARMENIAN ETERNITY SIGN and LEFT-FACING ARMENIAN ETERNITY SIGN.</p>
      <p>Every few years I see people complaining that this isn't in Unicode. Every few years I make a plea like this. Evidence, folks, please?</p>
    html_clean: |-
