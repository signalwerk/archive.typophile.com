      <p>I had to make that -for the first time- for my Granshan* submission in 2008. It's a pretty easy and obvious structure. I don't know if that's good or bad actually, since I would relish the opportunity to have/make something idiosyncratically Armenian! On the other hand, currency is not something I like to glorify...</p>
      <p>* BTW, they also required a glyph for the Armenian "eternity" symbol, concerning which there is a gentle, hidden debate as to how many arms it should have...</p>
      <p>Any clues when/whether Unicode will include it?</p>
      <p>hhp</p>
