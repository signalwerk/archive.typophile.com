      <p>I was there about 36 hours* but it was very memorable nonetheless. A real city. Gray, no tourists, and half its population looks really good in tight jeans. And I remember the tea service in Hotel Sibir - wow. The opera is that large domed building, right? There was a lot of scaffolding around it (September, 2004). The Saturday we toured all the banks in the city. There was this one with a huge purple cat on it - later we realized it was a minx. The Sunday morning I figured we should hit the church; not the small ceremonial one on the main street, but the populist one a bit away from the center, next to a train station in a gully of sorts. It was quite immersive, and we drew some visual inspiration from the decorations inside. And then we had to get on our respective flights back home. I did spend just under 24 hours in Moscow though. I'd been there before (for a couple of days, four years prior), and I do adore its raciness, but it's really just another big European city - not Russian enough.</p>
      <p>* I did some "crack consulting" with/for Miles Newlyn on a bank identity redesign proposal.</p>
      <p>hhp</p>
