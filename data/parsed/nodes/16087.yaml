      <p>“Ηφιλοθεοσ”</p>
      <p>As I hazily recall from my long-ago youth (when I still went to a Greek Orthodox church), this was “Those in fellowship with God” in our church, it was the brotherhood of what might be called “elders” in the church. Basically, it was the church committee who did the fundraising and paid the bills (including building the church edifice).</p>
      <p>ChrisL</p>
