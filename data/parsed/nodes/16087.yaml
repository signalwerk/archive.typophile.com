    html: |-
      <p>There is another piece in the <a href="http://telegraph.co.uk/news/main.jhtml?xml=/news/2005/11/07/wchur07.xml&amp;sSheet=/news/2005/11/07/ixworld.html">Telegraph</a>, with a different photograph of the inscription that is easier to read. I’ve tried to transcribe, but I don’t recognise most of the words and some may be abbreviated. The first letter of the fifth line is confusing. I’m guessing it is sigma, simply because I can’t imagine what else it would be (san = as), but everywhere else the lunate form has been used. It is difficult to be sure whether the first word in the second line ends with a double tau or a really wide pi. I’m guessing the latter, because double tau seems unlikely at the end of a word. </p>
      <p>ΠΡΟΣΗΝΙΚΕΝ<br>
      ΑΚΕΠ ΤΟΥΣ<br>
      ΗΦΙΛΟΘΕΟΣ<br>
      ΤΗΝ ΤΡΑΠΕ<br>
      ΣΑΝ ΘΩ ΙΥΧΩ<br>
      ΜΝΗΜΟΣΥΝΟΝ</p>
      <p>I believe ’ΤΟΥΣ ΗΦΙΛΟΘΕΟΣ’ refers to ’their love of God’, unless Ηφιλοθεοσ it is a proper noun, e.g. the name of a deceased person. The last word is ’memorial’.</p>
    html_clean: |-
