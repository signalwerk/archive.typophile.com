      <p>Tiffany, The fact that the mosaic identifies the gift as a “table” rather than an “altar” may be a significant clue to the dating of the site.</p>
      <p>I’ve been checking around to see what my colleagues make of the verb, and so far as I’ve been able to tell the consensus is that it must be an odd form of προσφέρω. <a href="http://www.novumtestamentum.com/2005/11/mosaic-inscription_09.php">Brandon Mason</a> conjectures that the mosaic was broken and misrepaired; he also calls attention to the ΗΝ ligature in the first line.</p>
      <p><a href="http://www.philipharland.com/Blog/2005/11/updates-regarding-christian-mosaic.html">Phil Harland</a> provides wonderful amplification on the matter of <em>nomina sacra</em> in the penultimate line.</p>
      <p>And <cite>National Geographic</cite> provides <a href="http://news.nationalgeographic.com/news/2005/11/photogalleries/oldest_church/photo2.html">a photo of the mosaic</a> <em>in situ</em>.</p>
      <p>(By the way, I find it incongruous that the bb software compels me to use the tag for “emphasis” when I want to use  true <em>italics</em> for a foreign language.)</p>
    html_clean: |-
