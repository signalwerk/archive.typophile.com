    html: |-
      <p>The fifth letter of the third line must be a zeta — the accusative form ΤΡΑΠΕΖΑΝ wrapped around the lines.</p>
      <p>I think ΑΚΕΠΤΟΥΣ must be a single word/name, the subject of the sentence, who is the (feminine) φιλοθεος in question. I can’t explain why the <cite>NYT</cite> gives a plural subject, since the nominative nouns (assuming ΑΚΕΠΤΟΥΣ is a name)  and the verb (which I can’t make out, but is evidently a 3rd person singular form) are both singular. The verb looks like a relative of προσφέρω, in this context ”to make an offering.”</p>
      <p>Contra the Telegraph, the mosaic reads (unusually!) “[to] God Jesus Christ,” with the words abbreviated as nomina sacra.</p>
    html_clean: |-
