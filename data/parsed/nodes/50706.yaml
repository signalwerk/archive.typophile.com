      <p>That’s a very old pram company from Guiseley, Yorkshire. It was owned by the family of my old school English teacher Mr Wilson.</p>
      <p>The logo was like that when I was at school over 30 years ago, and probably a lot longer before that.</p>
      <p>Nick Cooke</p>
