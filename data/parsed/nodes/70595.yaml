    <p>Hi all,</p>
    <p>As I analyise type more and more I am continually finding myself liking </p>
    <p>certain ways specific characters are written/formed/used.</p>
    <p>For example</p>
    <p>T could be represented by turning "L" 180degees to form a half T you could call it, or a H and remvoing one of its side walls and depending on the next letter for that side wall to form the letter.</p>
    <p>These sort of combinations, possibilities, just wondering if someone out has a chart showing such possibilities for each character etc</p>
    <p>Be interested to learn about such combinations as I explore finding my own.</p>
    <p>Any help would be great</p>
