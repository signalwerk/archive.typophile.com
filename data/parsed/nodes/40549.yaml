      <p>I'm not quite sure what you mean by "similar to Frutiger" because Interstate and FF Dax could be considered very different in style. So I'll assume your requirements are loose and point you to some underused contemporary sans serifs.</p>
      <p>I know you've been through FontFont's library, but you might have missed some less common designs:<br>
