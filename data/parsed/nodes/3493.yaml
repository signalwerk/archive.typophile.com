    html: <p>To me the tail of the a in <a href="http://fontbureau.com/fonts/font_frames.tpl?cart=10787719274112082&amp;fontname=Amplitude" target="_blank">Amplitude</a> is different, and the trap in the r is more pronounced. I know from past ID's the inside does use Amplitude, but I suspect this is different. </p>
    html_clean: <p>To me the tail of the a in <a href="http://fontbureau.com/fonts/font_frames.tpl?cart=10787719274112082&amp;fontname=Amplitude" target="_blank" class="link-external">Amplitude</a> is different, and the trap in the r is more pronounced. I know from past ID's the inside does use Amplitude, but I suspect this is different. </p>
  - id: 26988
