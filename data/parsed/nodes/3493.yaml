    date_raw: null
    votes: null
    html: <p>Ok, Yves, don't listen to me, but I think you were smart, smart,smart - not stoopid, stoopid, stoopid in your first comments. <a href="http://www.myfonts.com/fonts/fontfont/ff-meta/bold-roman/testdrive.html?s=Wallpaper&amp;p=72" target="_blank">Meta</a> has shapes that are so close to this, that your idea of a re-worked Meta is probably a very good bet. As I said, it isn't Amplitude - look also at the tops of the stems, which are different. </p>
