      <p>I dont think the outline on “bee” is necessary. Also is “two” in a different font? If so why? Maybe you could use the bold version of Avenier (I think that is the font used for “bee”) or use the same font for both “two” and “bee” and just make the “two” a bold/heavy/black version.</p>
      <p>Just my opinion, though, the illustration was very nice.</p>
