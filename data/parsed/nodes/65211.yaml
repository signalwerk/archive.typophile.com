    html: |-
      <p>Thanks for the comments.  My friend is working on incorporating another bee into the logo.  We went with the outline on the “bee” because the plain yellow didn’t show up that well when printed on white media.  Can you suggest another way to do the “bee” without the outline so that it will show up?</p>
      <p>I really like Avenier.  I also like to mix and match fonts some.  What would your recommend to go with?</p>
      <p>Thanks again.  Since this is a small side project with a very small budget, all your opinions help so much.</p>
