    html: |-
      <p>Like Nick I sketch ideas on paper with a gel pen or similar writing instrument, but they're only ideas, not plans for typefaces. Producing a font is a construction process; I draw each glyph in detail in Fontlab with its excellent drawing tools and sometimes with a tablet for spontenaity. For most fonts I don't do any sketching on paper. I visualize what I am going to draw in my mind.</p>
      <p>Unless you are making a script or handwriting font, scanning drawings on paper---no matter how neat you manage to make the drawings---is a cumbersome and unneccessary way to transfer material from paper to Fontlab. Scanning a sketch then cleaning up the bitmap and importing it into Fontlab, then drawing over the top of the bitmap used as a mask, and perfecting the vector drawing---all that is a time-consuming hassle. I find it easier to tape the sketch to the shadow mask of the monitor and simply reproduce digitally what I see in the glyph window, drawing it by eye. That method has improved my bezier drawing skills lots.</p>
      <p>j a m e s</p>
