      <p><cite>I was referring to constructing letters from a series of similar parts and then making adjustments to the individual letters.</cite></p>
      <p>But you would use this technique regardless of the tools used. That is what type design is. No?</p>
      <p>I remember doing some work with Ed Benguiat years ago. We were developing a corporate font for a cosmetics company. Ed did the drawings and I did all the digitizing. Ed had such a dismissive attitude towards the computer tools. He said he felt he could do a better job drawing by hand and try as I did, I could not get him to try working with bezier tools. I had to laugh, since the way Ed had worked for years was the analog equivalent of the same technique. Ed would draw basic shapes and have them shot onto film. He would then cut the film up and strip the elements together. Have another film shot and retouch the results. This shooting of film positives and film negatives went on until he was happy with the results.</p>
      <p>Same technique, different tools.</p>
