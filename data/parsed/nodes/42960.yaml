      <p>As another aspiring type designer, I can say for certain one thing I've figured out: there's no magic formula to creating a great typeface, and everyone has their own method. Of course, the one I use, and which I think is quite typical, is to draw out the UC and lc of "hamburgefonstiv" (there are lots of similar words, like "handgloves"), to define all the basic rules of the typeface. I scan these in, trace them in FontLab, and then work entirely digitally from there. Translating the essence of your sketch to bezier curves is probably the hardest thing to do as a type designer, at least in my opinion.</p>
      <p>If I could be a fly on the wall and copy Jonathon Hoefler's or Matthew Carter's working process, I'm not sure it would improve my type design skills at all. Unfortunately, the only way to design an amazing typeface is to design a bunch of crappy ones and figure out what doesn't work. I have been happy with the concepts of all my typefaces, but I don't think I've made one yet that succeeds aesthetically -- each new one does get better, though.</p>
