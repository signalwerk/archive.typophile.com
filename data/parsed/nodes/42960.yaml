    html: |-
      <p>"I’ve sometimes wondered if it might make more sense to work with the unruly characters"</p>
      <p>I have done that but not with the same set of "unrulies" as you mention. I think you first have to figure out what your intention is for the typeface. If it is a text face, the lowercase will probably dominate your decisions. You also have to work out the text density and efficiency ratio desired so you can determine x-height to cap height ratio. Testing problem children like double-bowl g and a with o and n to figure out weight can be enlightening learning experience. I am not saying this is a suggested way to approach a design, I am just saying I have started several typefaces in different ways and learned different things each time. My reasoning is not to find the most efficient way straight off but to learn as much as I can about the design process by doing lots of "what if" scenarios. My warning would read something like: "Stunt performed by self-trained type designer. Don't try this at home, unless you are more interested in learning than finishing quickly"</p>
      <p>ChrisL</p>
