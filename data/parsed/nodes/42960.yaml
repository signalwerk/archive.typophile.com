      <p>I think of it as "sculpting" letters, because you add a little, take away a little--as I guess you do with clay--until you like the look. </p>
      <p>Somewhere on another thread like this David Berlow said something like: whatever you do before hand, it doesn't start to count until it's on the computer screen. That's because Bezier curves tends to push you in certain directions, which are yours to use or contradict. Bezier curves are the medium you're working in. I can understand that in a script face, the hand *written* original might be much more important.</p>
