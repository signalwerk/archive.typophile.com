      <p><cite>I’m interested in what order more experienced type designers go about designing their letters. Do you start with h? o? Capital R? Maybe a more unusual character?</cite></p>
      <p>If you really think about it, the answer should present itself to you. Typeface design is system design. What are the most useful elements in the system? The repetitive ones that influence the majority of shapes. One would hope that you would make a decision regarding those shapes before you got to far along.</p>
