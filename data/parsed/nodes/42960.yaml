    html: |-
      <p><cite>If you really think about it, the answer should present itself to you. Typeface design is system design. What are the most useful elements in the system? The repetitive ones that influence the majority of shapes. One would hope that you would make a decision regarding those shapes before you got to far along.</cite></p>
      <p>I usually start with h, then a-m-b-u-r-g-e-f-o-n-s-t-i-v in sequential order, followed by the caps version of that. I've sometimes wondered if it might make more sense to work with the unruly characters -- s, uppercase N, x, for example -- and then build the rest of the letters around those. Letters like these are difficult to fit into rule systems, and look overworked and massaged when they are, so maybe it makes more sense to let these letters set the rules.</p>
