    votes: null
    html: |-
      <p>&gt;I’ve had some similar thoughts recently</p>
      <p>James P., James M. is very experienced, and in my much more limited experience I think he has his priorities right. I would not let the cap M change the whole font. If you've got a good design idea, and OoHn right in accord with the idea, and interactively adjust those with aeg, and all is still good, then you've basically got a good font design. The diagonal letters are challenging, but they've been solved a lot of ways in the past, and its just up to you to make them work, given the rest of the font.</p>
      <p>I'm not saying that you shouldn't interactively massage everything as you go on, but as far as setting the look of the font the 'control letters' are generally the approach of experienced designers. For example, Erik Spiekermann basically drew only these for Meta Serif, and then asked Christian Schwartz to do the rest. Schwartz and Kris Sowersby did the rest, but just those few letters (which admittedly he took years to figure out, and finally only in discussion with Schwartz) are still maybe 50% of the new design ideas, though a small fraction of the many, many hours of work.</p>
