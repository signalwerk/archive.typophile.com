    votes: null
    html: |-
      <p>To answer the original question: "It Depends"...If I am doing something very much based on handwriting or rough calligraphy, there will be lots more time drawing, or even writing, and much less time fiddling onscreen. There might be a big scanning/autotrace session in there too. For other more modular or mechanical designs there might be very little drawing and considerably more cutting and pasting. Many designs can't really be resolved without extensive proofing, now best done in the digitized state. So drawings might just be sketches that get digitized immediately.  </p>
      <p>Key characters do help you get the "DNA" as Matthew Carter has said in the Helvetica film. HOnh to start with for contrast and other basic things like bowl shape, serif length, x-height to cap ratio, etc. Then the letters that combine those: Db. Get the spacing of all these right and you're on your way. Add other letters that give more character and style info like ABEGRSabegv. Many of us have rushed to finish the whole alphabets, then the figures, then the italic, then then then, only to look at the original efforts months later and realize it was all garbage and has to be re-done from scratch. This is "measure twice, cut once", applied to type design. </p>
      <p>James, I'm not sure how much it will help you to know the answer to this; everyone works a different way, and it's really the results that matter. There are terrible designs with hundreds of hours of fussy handcrafting, and wonderful designs that are almost just autotraced sketches. Each designer might use a dozen different techniques. If your technique shows, or you aren't in control of the tools, that will weaken the design. This is why some people stick to certain methods. But as you can see, there is a huge range of strategies, from telling someone else what you want, all the way to carefully hand-drawing every character at 500 point and specifying digitization points. Some people don't even do digital outline work themselves; they draw and have others digitize. Again, it's the results that matter. </p>
      <p>Caveat: I think a weak and flawed strategy is taking someone else's finished outlines and trying to modify them enough to call it original. Very few designers are capable of this; too often the telltale essential structure remains. For that matter, how many skilled designers would take this route, knowing the limited benefit it will bring? I don't necessarily make the same decisions about point placement or anything else that another designer would, so I find this a useless method.  It's somewhere between "homage" and "knockoff".</p>
