      <p><cite>Letters like these are difficult to fit into rule systems, and look overworked and massaged when they are, so maybe it makes more sense to let these letters set the rules.</cite></p>
      <p>I’ve had some similar thoughts recently, mostly because I’ve been learning what a PITA it is to draw a good sans W.The cap N is another nasty one—I just redrew most of the majuscules in my thesis font because the widths I had been working with produced a hideous M. It’s funny how one can trap out a bunch of too-narrow letters and somehow make them work, but once the N comes up all the crap falls apart and it’s time to start over.</p>
  - id: 265324
