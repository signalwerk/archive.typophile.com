    html: |-
      <p>Right. Besides what Nick points out, we all know that certain shapes are just more fun to work on than others. They give character. It's hard to do the dry stuff first, and in certain cases it really is filler, or mechanical finish work. In some designs, the letter shapes don't need a lot of anguished finessing, it's spacing, or the joining scheme, or the terminal shapes that take all your time. </p>
      <p>I ought to have said this in parallel with my other comments: Every typeface is different. Combine that with the different methods and backgrounds of type designers and you have potentially unlimited new challenges, no matter how much experience you have. Every design I work on has something new to show me. And if I'm extending the character set of another designer's work, my decisions are influenced by that. So many variables!</p>
