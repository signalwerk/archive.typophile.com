      <p><em>—is that a rhetorical question?</em></p>
      <p>Not really, I don't think there's a simple answer.<br>
      I've been in the position I described, and had the good fortune to be able to call the result my own face, rather than that of the person who commissioned it and gave it direction and personality, by the power of speech alone. But the face was not an adaptation, so I had more claim on authorship.<br>
      I would be interested in your opinion.</p>
      <p>Carl, well put, I'm with you most of the way on that.</p>
      <p>One thing I do note is that design themes in different typefaces may be best represented (or thorniest) in different groups of characters, so those are the characters you want to refine the theme on first. So for one face, much might depend on the way <em>r</em> and <em>a</em> fit together, whereas for another with interesting curves, it wouldn't be a good idea to leave binocular <em>g</em> till the end. This follows on from Carl's observation of how some letters tell you more about spacing, others about style, with some faces being predicated more on style, others more on spacing.</p>
