    votes: null
    html: |-
      <p>The few typedesigns I have done up till now, all started on paper. Drawing the characters -- usually the whole alphabet, or most of it -- works much faster for me. I can quickly sketch out ideas, and then draw a more tidy version of it to scan and trace. I guess I could start directly with vectors, but it doesn't really work for me, because I can draw curves more naturally by hand. </p>
      <p>So for me drawing it first is faster, more spontaneous, but I also just <em>like</em> drawing type! :)</p>
