    html: |-
      <p>I wish I knew what the original question aims at.<br>
      If you have some experience in designing typefaces -- you know how letterforms are 'constructed', know about different types of contrast, etc -- then you may need only few or no written or drawn sketches and derive the rest digitally. (Mind that answers in this direction came from experienced type designers!)<br>
      If you are still new to type design, then you better take <em>a lot of</em> time, sit down at your desk with pens and pencils, and write and draw so you get a feeling for letterforms. And then scan, trace, and refine the outlines. You will notice that switching the medium in this process will raise questions you would not have encountered otherwise. (Things like: Corners seem to be rounded after scanning the drawings -- do I keep them rounded, or do I transform them into corners? I need to make a decision. This is very different from doing corners right from the start and never thinking about an alternative.) This is a slow process and may seem odd, but may help to not repeat existing typefaces which almost naturally happens if digital type is inspired by other digital type.</p>
      <p>And please ... even though we ship typefaces as fonts, we are <em>type</em> designers, not <em>font</em> designers. (Trying hard to imagine you 'designing' a font directly in TTX.)</p>
