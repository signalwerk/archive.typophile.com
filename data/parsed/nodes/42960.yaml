      <p>"I’ve been learning what a PITA it is to draw a good sans W"</p>
      <p>Drawing a sans may sound easier than a serif face but I don't believe it. Both have their challenges and, to me, are equally difficult.  With a serif face, the contrast difference gives you some wiggle room and the serifs fill in the holes for you. With a more monoline sans, the weight can clog up really quickly with a double-bowled "g" or a "w". To make a sans look simple and clean is far from simple.</p>
      <p> ChrisL</p>
