  html: |-
    <p>Classifciation of Arabic script styles is not quite consistent. In my latest blog article on <a class="freelinking external" href="http://arabictype.wordpress.com" rel="nofollow">arabictype.wordpress.com</a> I try to discuss a new approach to Arabic script style classification.</p>
    <p>Based on the six script style elements suggested in an earlier article, I suggest a method to quantify the visual aspects of the style. These elements could be then processed in a number of ways. When cobined with XML coding, it might be possible to classify Arabic script. The suggested classification and quantification could find use in applications such as font substitution in portable documents, e.g. HTML, PDF, etc.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/yaqoutsmall_6544.jpg"></div><p></p>
    <p>The article also shows how to programmatically control Adobe Illustrator through a downloadable example that relates to the article. The article contnains posters of traditional script sample for download.</p>
