      <p>Oh yes, I think I might have recently seen it in some IN book [too].<br>
      Paul, let me know if you’d like me to track it down.</p>
      <p>BTW, I’m curious: What’s wrong with three vowels (visually)? Also, the “OE” there is linked due to grammatical rules - it’s like a distinct letter, so it’s not like it’s an option (although Baskerville for one has set them -or actually an “AE”- as two characters, just using tighter spacing to “link” them).</p>
      <p>hhp</p>
