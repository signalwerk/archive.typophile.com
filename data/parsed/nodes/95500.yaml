      <p>I'll cut right to the chase: exactly who will go out of his way to use this design? Formally it's a nice balance between grot and humanist sans styles (two highly ubiquitous genres) but even that's not exactly rare these days. So making this could be a great learning experience -and maybe that was your plan- but how much further could it really go?</p>
      <p>It might be telling that you've been Abbink's student - I'm seeing the sort of genericity that Kievit exhibits. I for one admire a good deal of Abbink's work (not least NBC Universal) but even somebody who admires Kievit has to realize it came out over a decade ago (and in fact was started almost two decades ago).</p>
      <p><a href="http://typophile.com/node/95280#comment-518303" title="http://typophile.com/node/95280#comment-518303">http://typophile.com/node/95280#comment-518303</a></p>
      <p>I'm not sure what to recommend - certainly slapping on a gimmick to differentiate it is a bad idea. I would suggest thinking deeply about how to make this more you. Formal education is a two-edged sword, and the better your teacher the harder it is to make your own mark... Good luck!</p>
      <p>hhp</p>
