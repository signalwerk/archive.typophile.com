    <p>I was meaning to post this in late May / early June, but it's been a crazy summer. I graduated from the University of the Arts in May, and since then I've adjusted to my first full-time design job while taking some time to enjoy the little things in life. </p>
    <p>Anyhow, I was fortunate enough to take Font Design Lab under the brilliant Mike Abbink last semester. I developed a Humanist sans serif titled Agio, and I'd be interested in any feedback or criticism that you wise Typophiles are able to impart. I'm not sure where to go from here...keep tweaking? Develop a bold weight? Discover the maddening thrill of kerning tables? I'd like to start on a new weight, but I'm sure there's room for improvement before I go ahead.</p>
    <p>Attached is what I presented at my final critique. If anyone needs to see more to make a fair judgment, let me know!</p>
