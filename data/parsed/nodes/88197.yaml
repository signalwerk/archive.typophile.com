      <p>...and in PS another quick down and dirty tip is to simply create a brush of the type (or whatever). Click brush where ever and move brush to where ever and before clicking the brush again hold down the Shift key (don't forget to set the brush spacing down as low as possible)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/brushtip_shiftclick_6383.jpg"></div><p></p>
