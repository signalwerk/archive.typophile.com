      <p>I think Photoshop behaves correctly. Feature 'calt' is intended for CONTEXTUAL substitutions. You don't specify the context, therefore the substitutions are applied immediately. The alternative forms of capital letters should be placed in different feature, probably 'titl'. Special ligatures in 'liga' or 'dlig' depending on your preferences.</p>
      <p>Btw. you use VERY nonstandard glyph names. You should definitely use the dot convention specified here <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a>. Instead of <strong>capalt</strong> you should rather use <strong>t.calt</strong>, resp. <strong>t.titl</strong>.</p>
