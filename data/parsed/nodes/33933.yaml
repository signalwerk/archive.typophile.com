    <p>Hi there!!</p>
    <p>I'd like some help on an opentype error that a customer found in my fonts After.</p>
    <p>The fonts have special ligatures and alternate caps. The problem is happening in the CALT (Capital Alternatives) feature, only in Photoshop CS2 for Mac.</p>
    <p>The standard version of the characters can't be accessed. By default, the feature is turned ON, and is gray shaded (disabled for access/change).</p>
    <p>When testing this on Photoshop CS2 in PC, a nasty surprise: the fonts don't even appear. They became invisible. The fonts that don't have OT substitution features (Text version) of my family appear normally. So it could be something OT related.</p>
    <p>The sintax of this feature is this:</p>
    <p>feature calt { #Alternate Caps<br>
      sub A by capaalt;<br>
      sub Agrave by capaaltgrave;<br>
      sub Aacute by capaaltacute;<br>
      sub Acircumflex by capaaltcircumflex;<br>
      sub Atilde by capaalttilde;<br>
      sub Adieresis by capaaltdieresis;<br>
      sub Aring by capaaltring;<br>
      sub R by capralt;<br>
      sub T by captalt;<br>
    } calt;</p>
    <p>I simply have no idea of why is it happening. Is this a Photoshop issue that I can't resolve? Or is there a way to fix it?</p>
