      <p>Fabio,</p>
      <p>1. The feature 'calt' does NOT stand for "Capital Alternatives", it stands for "Contextual Alternates".</p>
      <p>2. I believe 'titl' (Titling) is the feature you're looking for.</p>
      <p>3. The glyph names of your alternates are quite odd; you should use 'A.capalt' instead of 'capaalt', 'Agrave.capalt' instead of 'capaaltgrave', and so on.</p>
      <p>4. There are known issues regarding the 'calt' feature and Photoshop CS2, but I never heard of fonts not showing up because of that. Your use of the 'calt' feature is definitely incorrect*, and that might be the reason why Photoshop doesn't recognize your fonts.</p>
      <p>I gather your fonts will start working as expected as soon as you make the changes suggested above.</p>
      <p>* The substitutions have no context, like <code>sub A' V by A.capalt;</code></p>
      <p>(Filip, sorry for the overlap; your post wasn't there when I started writing.)</p>
