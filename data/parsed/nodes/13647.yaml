  html: |-
    <p>Putting together a personal portfolio site and although I’m not “in business for myself” I’m considering using something of a pseudo-logo to go with the “theme” of my website. </p>
    <p>The website itself has a “1920s telegram” feel with some modern elements to it, and this logo evolved based on a Western Union logo of the same era with some changes.  This isn’t really going to be a real “brand” though—not in the sense of the way real companies use logos.  Oh, and one more thing, the actual “tagline” here is somewhat “for position only”.  I want some obligatory cliche-type text/slogan found in 20s signage to go here but I don’t know that the text I actually placed here will stay.</p>
    <p>Anyway, looking for any general opinions though on the typefaces, kerning, design, etc., to see if any glaring problems jump out at anyone.  Thanks!</p>
