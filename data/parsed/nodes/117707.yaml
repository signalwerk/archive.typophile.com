      <p>IL SORRISO is a shortened version of the famous "wanted poster" font French Clarendon, created by William H. Page in 1865.</p><div class="imageWrap"><img src="http://typophile.com/files/FrenceClarendonWilliamPage1865sm_4539.jpg"></div> An authentic digital version by Wooden Type Fonts as Clarendon Heavy <a href="http://www.myfonts.com/fonts/woodentypefonts/clarendon/" title="http://www.myfonts.com/fonts/woodentypefonts/clarendon/">http://www.myfonts.com/fonts/woodentypefonts/clarendon/</a><br>
      IL SORRISO would seem to be a photolettering era version that has not been digitized. Clarendon Heavy  can be modified to look almost identical<div class="imageWrap"><img src="http://typophile.com/files/ClarendonHeavyModified_4912.jpg"></div>Don<p></p>
