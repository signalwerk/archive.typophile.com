      <p>IL SORRISO is a shortened version of the famous "wanted poster" font French Clarendon, created by William H. Page in 1865.<img src="/sites/default/files/old-images/FrenceClarendonWilliamPage1865sm_4539.jpg"> An authentic digital version by Wooden Type Fonts as Clarendon Heavy <a href="http://www.myfonts.com/fonts/woodentypefonts/clarendon/">http://www.myfonts.com/fonts/woodentypefonts/clarendon/</a><br>
      IL SORRISO would seem to be a photolettering era version that has not been digitized. Clarendon Heavy  can be modified to look almost identical<img src="/sites/default/files/old-images/ClarendonHeavyModified_4912.jpg">Don</p>
