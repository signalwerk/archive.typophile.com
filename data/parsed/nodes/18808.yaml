    html: <p>OK, I had a browse around ebay for second hand printers. Some of the prices were good. Eventually I found a huge discount on a Samsung ML-2550 - which is 1200dpi x1200dpi, and packs an emulated version of Postcript 3. This was probably the best I could find (after a days extensive research) in my price range £150/$220. I’ll let you know how it goes!</p>
