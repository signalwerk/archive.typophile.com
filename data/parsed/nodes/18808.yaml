    <p>I’m looking to buy a 1200dpi laser printer to use primarily for developing type designs. I’ve been searching around for the cheapest printer available which has true Adobe® PostScript® 3™, as opposed to an emulated version of Postscript 3. I’m just looking for some general advice from any of you out there who may have gone through a similar quest. Any reviews and/or recommendations would be greatly appreciated.</p>
    <p>Furthermore, opinions on the relative qualities of true postcript machines vs. emulated versions would be also useful. Is there any difference, and if so, how great/marginal is the difference?</p>
    <p>Thanks in advance for your contribtuions.</p>
    <p>Mike Ives</p>
