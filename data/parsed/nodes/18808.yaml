      <p>i just bought an HP laserjet 1320 and i think it’s working out OK. granted, i’m just getting started myself, but it seems like the 1320 is a good deal in the less than $500 category, when i was looking, it seemed like the only true Postscript printers run at least $1000 and well over,  which was out of my price range.</p>
      <p>i guess there are some even cheaper HP laserjets, but i was told that the 1320 is the best for the price you pay…</p>
