  html: |-
    <p>We would like to introduce our 2011 Report for iPad.<br>
    You can see all the work that was done by DSType Foundry in the past year, along with a few new typefaces to be released this year.</p>
    <p>The ibook is free and can be downloaded here:<br>
    <a href="http://itunes.apple.com/pt/book/dstype-report-2011/id501058398?mt=11" title="http://itunes.apple.com/pt/book/dstype-report-2011/id501058398?mt=11">http://itunes.apple.com/pt/book/dstype-report-2011/id501058398?mt=11</a></p>
    <p>You can also go to our author page and download all the free specimens:<br>
    <a href="http://itunes.apple.com/pt/artist/dstype-foundry/id501058401?mt=11" title="http://itunes.apple.com/pt/artist/dstype-foundry/id501058401?mt=11">http://itunes.apple.com/pt/artist/dstype-foundry/id501058401?mt=11</a></p>
    <p>Best,<br>
    Dino dos Santos<br>
    DSType Foundry</p>
