      <p>Thanks Thomas!</p>
      <p>As mentioned the poster is landscape now and the worse for it. The foldy brochure can bleed though so it is looking better (for a double-fold 8.5x11 brochure). I’ve switched to Whitman for the Serif and it seems to be playing nice but the SC OSF is not functioning with CS3 or the 10.4 OS or something.</p>
      <p>Anyway, my thought of the SC tracking was that it is for aged eyes and typing URLs that are strung together can be a challenge. I’ve tracked it like the other SC, but I’ll have another look.</p>
      <p>Good luck with the Ital!</p>
