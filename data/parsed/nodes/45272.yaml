    html: |-
      <p>It is improved.</p>
      <p>- The top line has x-amount of space in between the letters. It appears that the line-spacing to the next line below is at least half-that. I would make it equal to or a bit more. As it is you are crowding the title.<br>
      - I don't understand the point of the line "Chamber Music" space space space "Chamber Opera" -- Shouldn't there be an ampersand or something?<br>
      - You've justified every other line differently. I'd choose centering or left-justification.<br>
      - The diamond bullets seem random. You could add more line-spacing and simply remove those.</p>
