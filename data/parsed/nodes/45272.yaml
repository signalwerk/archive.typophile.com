      <p>That addresses one of my primary concerns—that I’ve fallen for the ST ligature when I should track out the true caps to match the small caps.</p>
      <p>I’ve waffled on making the chamber music/chamber opera text part of a mask for the painting. I’ll bring that up and away from the painting. I’d like that whole statement to recede a bit more but a second lighter color gets too busy.</p>
      <p>This is 11x17 finished size for reference.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TBPSTR4_4959.jpg"></div><p></p>
