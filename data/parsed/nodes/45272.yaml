      <p>Thanks. All the caps are tracked at the same amount, but the small caps are probably designed with greater spacing. I’m using an En space between the chamber music/opera statement. I check and see if I can add an ampersand.</p>
      <p>The small text at the bottom and the chamber music/opera statement are centered. Everything else is flush left. I'll look at the bullets. They are characters in Warnock, but I'm not wed to them.</p>
      <p>Looks like we are going to a landscape format.</p>
