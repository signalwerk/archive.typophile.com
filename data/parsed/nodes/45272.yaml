    <p>If this PDF turns out huge or creates a problem my apologies. I hope it will work as a link.</p>
    <p>This is fairly self-explanatory. The client provided me with the scan of the image and copy. The printing specs are unknown so I’m giving a generous margin all around. I’m happy to find a chance to use Hypatia, but with so many characters I suspect there are probably a few things to be improved. I’ve given a minimum adjustment to the kerning, and would love any direction in this regard as well as any general crit.</p>
    <p><a href="http://www.hatleyeditorialanddesign.com/poster.pdf" title="http://www.hatleyeditorialanddesign.com/poster.pdf">http://www.hatleyeditorialanddesign.com/poster.pdf</a></p>
    <p>So the PDF link is not working so a jpeg.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TBPSTR3_6318.jpg"></div><p></p>
