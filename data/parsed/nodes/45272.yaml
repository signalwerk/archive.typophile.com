    html: |-
      <p>I do. And thanks. One unfortunate detail is that I've been informed this is being printed at Kinkos so I'm leaving a .5" border as a safe zone for insane printing and trimming that will be out of my control. I would love to bleed the image though.</p>
      <p>Hypatia is such a sea of characters. In the title I added quite a bit of space between the I and B. That's the only kerning I really pushed and it didn't get flagged so that gives me some confidence.</p>
      <p>I also really feel like "Tiburon Music Festival" should work as one shape. And, I did pick up the alternate J in June that doesn't descend. The En dash is rather long, so it is interesting to see the hyphen between the dates. </p>
      <p>The landscape version is rather dismal by comparison, but this whole project is really defined by the image. The client gave me a suggested 1.5 hours to knock it out. Also there is a mailer with longer text to accompany—that's why the Warnock. I'll post up again if it gets more interesting, otherwise it is a fun exercise in pondering a new face.</p>
