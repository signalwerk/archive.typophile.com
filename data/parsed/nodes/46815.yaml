    date_raw: 30 Jun 2008 — 7:00pm
    votes: null
    html: <p>Yes James, it looks to be the last Type Camp on Galiano ever, and for several reasons. The primary one is that the location where I have it on the island has raised their rates so drastically this year that I'm hoping just to break even and it will be close! In addition, it takes a lot of planning and effort (Marian and Ross and I were utterly exhausted after last year!) and I have to keep the prices low so that all kinds of people can attend. It's been a labour of love and as much as I'd like to see it fly, I don't know that I can anymore. I still think it is a deal at the price - all your locally sourced food, housing in swish cabins, afternoon hangouts at the beaches, and of course your days filled with high-level typetalk not found in many other places in the world. It's good stuff and last year's lot certainly loved it. So yes, that's it for Galiano. I had to cancel Info Design this year from a surprising lack of interest but I do hope to run India next year in December 2009.</p>
