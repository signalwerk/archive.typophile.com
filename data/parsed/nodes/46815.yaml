    <p>I finally have something really great to share in my blog here on Typophile! This year I've been invited to participate as an instructor at <a href="http://www.typecamp.org/" rel="nofollow">Type Camp</a>. This opportunity is a return to something I Iove, teaching, and I get to do it with 2 people whom I greatly admire, <a href="/wiki/Dr.%20Shelley%20Gruendler" class="freelinking" rel="nofollow">Dr. Shelley Gruendler</a> and <a href="/wiki/Dyana%20Weissman" class="freelinking" rel="nofollow">Dyana Weissman</a>.</p>
    <p>Type Camp is summer camp for type and typography enthusiasts. Talk about getting your cake and eating it too! I'm thinking of it as an intimate group of people who share a common passion. An opportunity for symbiotic discussion, learning, sharing, exploring, and experimentation. There is no set curriculum from year to year, but if you want to see what they did last year check out the <a href="http://www.flickr.com/groups/typecamp/pool/" rel="nofollow">Type Camp Flickr Pool</a>. You can see from all of these photos that the experience goes far beyond just talking about serifs or collecting shells on the beach.</p>
    <p>Type Camp takes place in one of the most beautiful places on earth, Galiano Island, BC, just off of the coast from Vancouver. </p>
    <p>Read Shelley's wonderful summation <a href="http://findarticles.com/p/articles/mi_qa5326/is_200805/ai_n25499989" rel="nofollow">Type Camp: REACTION &amp; CATALYST</a> to understand why Type Camp was created. </p>
    <p>Dyana is just as excited to particpate as I am. Read her thoughts on the Font Bureau blog, <a href="http://type101.fontbureau.com/archives/84" rel="nofollow">Type 101</a>.</p>
