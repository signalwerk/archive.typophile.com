    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WFS-Logo (2)_3934.JPG"></div><p></p>
    <p>&nbsp;<br>
    <strong>Monotype Imaging Debuts New Program that Gives Design Agencies Free Access to Fonts.com Web Fonts</strong></p>
    <p><strong>Design Agencies Can Now Use Monotype Imaging's Complete Web Font Collection at No Cost for Building Comps</strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has introduced an exclusive program for design agencies that provides free access to Monotype Imaging's entire collection of Web fonts when designing comp sites for clients. The Fonts.com Web Fonts agency program, the first of its kind, helps agencies avoid the risk of investing in fonts before a client accepts the proposed designs. </p>
    <p>The new agency program is free for up to 25,000 page views per 30 days — the same terms as Fonts.com Web Fonts' free subscription plan, which covers use of more than 3,000 fonts. However, the agency program offers additional benefits, including access to the complete library of fonts, which now exceeds 12,000. Unlike the no-fee, standard subscription plan, participants in the agency program are not required to host the Fonts.com Web Fonts advertising badge on sites that use the service. </p>
    <p>"Over the years, we've built close relationships with design agencies that have used our renowned collection of typefaces. Not only are agencies among our best customers but they also help to establish and ensure the long-term use of our typefaces in a wide range of work, from client identities to corporate campaigns," said Chris Roberts, vice president of marketing at Monotype Imaging. "We're simply making it very easy for agencies to try our thousands of typefaces on the Web and our Web font service, risk-free." </p>
    <p>"The Fonts.com Web Fonts agency program helped us to release our first website using Web fonts," said Samuel Latchman, head of production at Ogilvy One, Paris. "The service was a breeze to use when selecting and using the proper assets. Both the designer and the developer were enthusiastic, as everything about the platform makes it easier for production to move forward, from the large choice of fonts to the simple code implementation." </p>
    <p>When program participants are ready to take a site to final production, two options are available. First, the agency can upgrade to a paid subscription plan that provides the requisite page views to support the site's traffic — a suitable option when the agency plans to arrange for the hosting of the site on behalf of the client. The agency can then use the paid subscription to provide comps for clients, as unlimited domains can be used on a single Fonts.com Web Fonts account. Second, if the client plans to arrange for hosting, the agency can use the Fonts.com Web Fonts export feature to pass the project onto the client. The client can then subscribe to the service and easily import the project without having to rebuild it. </p>
    <p>Interested design agencies can request admission into the Fonts.com Web Fonts agency program by visiting <a href="http://www.webfonts.fonts.com" title="www.webfonts.fonts.com">www.webfonts.fonts.com</a>. The agency will need to subscribe to the free plan and then apply for admission into the program by completing a short submission form, accessible from the "agency program" link in the footer of <a href="http://www.webfonts.fonts.com" title="www.webfonts.fonts.com">www.webfonts.fonts.com</a>. Upon reviewing the applicant's candidacy, the applicant's free subscription will be upgraded to the agency program. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Inc. All rights reserved.</p>
