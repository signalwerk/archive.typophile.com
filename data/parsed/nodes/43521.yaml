      <p>I once heard, at a design conference, that one of the easiest ways to impart elegance is to track out leading and word spacing. You want to feel as if the type has room to breath, to tight and it looks uptight.</p>
      <p>I also agree with Tiffany and Nuno, the balance is off (not to mention your logo isn't centered) and simplify your font choices.</p>
