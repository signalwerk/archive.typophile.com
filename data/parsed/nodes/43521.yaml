    html: |-
      <p>Overall I like it, quite elegant.</p>
      <p>Just 4 things to say, in my opinion, the "money can't buy happiness" is too tight and unbalanced despite I understand that you want it to come out.</p>
      <p>Second thing is... why are you using 3 typefaces? I would use only 2, ther's no need to have 2 typefaces that are too close or haven't got enough diferences.</p>
      <p>Third, on the text below, i see that you have a tight letter space but a normal word space... try to balance those 2 values or else you'll get some odd holes on the text block. Usually i use oh the justification these levels: 85-100-125 for word spacing and -5-0-5 for letter spacing, and then teak as necessary.</p>
      <p>Last one... isn't the logo too big?</p>
      <p>Good work :) </p>
      <p>Edit: Tiffany posted first :D</p>
      <p>-</p>
      <p><a href="http://www.nunocoelho.com" title="www.nunocoelho.com">www.nunocoelho.com</a></p>
