      <p>Thank you as always for your valued commentary, I've adjusted the piece for some wording considerations (At rather than In Ruby's being one of them), and reduced the amount of typefaces to simply Gotham and Didot. </p>
      <p>I'm also liking the idea of NOT including photography, and letting evocative text do the image conception for me. Anyway, I dont think a picture of a burger will ever do the typographical genius of these two typefaces justice :)</p>
