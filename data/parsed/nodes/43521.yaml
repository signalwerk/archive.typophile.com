    <p>Hello Typophiles,</p>
    <p>I've recently been commissioned to design a rich and exotic poster promoting the addition of a 'burger bar' to a trendy lounge in my hometown. I'm concentrating on typography and copy considering not much can be said about the humble burger through imagery. </p>
    <p>As such I'd like your expert opinion on my kerning, letting and overall choice of Didot, Gotham and Archer as my inventory for the piece.</p>
    <p>Any comments would be most valuably received,</p>
    <p>Regards,</p>
    <p>Paul</p>
