      <p>I'd use would first suggest choosing between Archer and Didot.<br>
      I'd also not full-justify the bottom paragraph as it is throwing the balance off because of the spacing.<br>
      The balance at the top seems off too. The lightness of the Gotham isn't working with the heavy (because of the tightness) line of the Didot.<br>
      Don't we say "at Ruby's" and not "in Ruby's"?</p>
