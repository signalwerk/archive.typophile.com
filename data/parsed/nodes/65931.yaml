      <p>Check out your local big box book store and/or craft store and ask for the ’Dover books’ section where you’ll find all sorts of books full of scanable clip art based on old engravings like this. </p>
      <p>Online, you can check out the Briar Press’s archive:</p>
      <p><a href="http://www.briarpress.org/cuts" title="http://www.briarpress.org/cuts">http://www.briarpress.org/cuts</a></p>
