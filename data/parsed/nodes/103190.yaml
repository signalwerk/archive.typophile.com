      <p>I'd be inclined to suspect a problem in the auto-conversion of PS to TT outlines.  </p>
      <p>You might want to try explicitly convert the outlines to TT yourself within the program (without generating the font) and then double-check the glyphs.  (I'm not familiar with Fontographer, but I assume it has a way for you to do that, as FL does.)</p>
