    <p>Hello everyone.  I'm having problems generating a TTF file with Fontographer 5.2 (win8).  The system's file preview shows the gliphs distorted and the uploaded font to dafont.com seems deformed. This doesn't happen when I generate a OTF. You can see what I mean in the next images.</p>
    <p>Does anyone know whats going on?</p>
    <p>Thanks in advance!</p>
