      <p><img src="/sites/default/files/old-images/Gridfit_2_4944.gif"><br>
      I had a brief look at the .ttf font using OTM and IMHO what you see is normal rounding. Using our own auto-hinter and TTFA did basically not lead to much better results, so I don’t think Fontographer is to blame.  If you want to prevent the distortion at smaller point sizes, this requires some manual hinting, I reckon.<br>
      &nbsp;<br><img src="/sites/default/files/old-images/Gridfit_1_4063.gif"><br>
      I could be wrong, though…<br>
      &nbsp;</p>
