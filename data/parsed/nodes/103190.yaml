    date: 2013-05-21T10:45:00
    date_raw: 21 May 2013 - 10:45am
    votes: 0
    html: <p>Maybe your OTF Postscript font contains points with non integer coordinates (a perfect hexagon would have some vertices with irrational coordinates). Coordinates in truetype must be integers and the difference may simply be due to rounding.</p>
    html_clean: <p>Maybe your OTF Postscript font contains points with non integer coordinates (a perfect hexagon would have some vertices with irrational coordinates). Coordinates in truetype must be integers and the difference may simply be due to rounding.</p>
