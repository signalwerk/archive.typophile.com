      <blockquote><p>
      If thats's the problem, the TTF will never look as good as the OTF?
      </p></blockquote>
      <p>I just downloaded Beetype-Filled.otf from your site and looked with ttx and that's not the problem. On the other hand, postscript fonts allow cubic bezier curves and truetype only quadratic. Since all your "curves" are straight lines, i.e. of degree 1, I don't see how the problem could come from there either.</p>
