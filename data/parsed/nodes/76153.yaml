  html: |-
    <p>Hey,</p>
    <p>I was just curious to find out what you guys thought of my latest website design.</p>
    <p>It's essentially a charity organisation that seeks new families for foster children.</p>
    <p>I didn't design the logo myself. It was provided by the client.</p>
    <p>Blue and yellow are the corporate colours. They also asked me to use black and white photos exclusively, in accordance with their corporate ID.</p>
    <p>As for the fonts, I will probably have to stick to Georgia since this is the only serif font that looks good across browsers.</p>
    <p>Thanks a lot for any feedback!</p>
