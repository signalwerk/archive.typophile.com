      <p>I like the simplicity of this (and the little head illustration in the logo!). Three quick thoughts:</p>
      <p>(1) The donation button is a little too far down the page for a charity, IMO.<br>
      (2) I'm a little confused about the function of the vertical menu. How is it different than the function of the main horizontal menu? Or is it related to the image to the left?<br>
      (3) I feel like there's too much grey on the page (so not enough color).</p>
