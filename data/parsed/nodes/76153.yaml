      <p>Hello Dan,</p>
      <p>Thanks for your feedback.</p>
      <p>(1) OK, you are probably right. I adjusted it a little.<br>
      (2) The vertical menu is meant to act as a secondary navigation in this case. It may contain zero to ten or so navigation points.<br>
      (3) I totally agree. The grey didn't feel right. I replaced it with blue now. How do you like it? </p>
