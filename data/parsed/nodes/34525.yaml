    <p>Anyone know of a font that is reminiscent of the font used for the Get Smart titles? I don't need an exact match, just the same feeling.</p>
    <p>You can see some examples here:<br>
    <a href="http://www.wouldyoubelieve.com/doors.html" title="http://www.wouldyoubelieve.com/doors.html">http://www.wouldyoubelieve.com/doors.html</a></p>
    <p>(Scroll down a bit; I'm looking for the sort of Latin with the bouncy baseline.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/getsmart_6222.gif"></div><p></p>
