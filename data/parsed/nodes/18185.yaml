    <p>February 22, 2006. Boston.<br>
    Font Bureau, Inc. is proud to release Escrow,<br>
    a new display family by Cyrus Highsmith:</p>
    <p>ESCROW<br>
    When color appeared on the front page of The Wall Street Journal<br>
    in 2002, it was also newly dressed in Escrow. Highsmith's scotch<br>
    roman was heralded as the "spectacular singular element that<br>
    holds the whole [redesign] together" by Design Director Joe Dizney.<br>
    Available in five weights and three widths, with accompanying<br>
    text styles. 44 styles total.</p>
    <p><a href="http://www.fontbureau.com/escrow" title="http://www.fontbureau.com/escrow">http://www.fontbureau.com/escrow</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/escrow.gif"></div><p></p>
    <p>================ 1000+ FONTS! ======================</p>
    <p>There are now more than 1000 styles available for download<br>
    at <a href="http://www.fontbureau.com" title="http://www.fontbureau.com">http://www.fontbureau.com</a>. This is a momentous occasion and<br>
    we thank all of our talented designers for adding to our Retail<br>
    library over the last 17 years. Recent heavy-hitters like the<br>
    following catapulted us into four digits.</p>
    <p>Escrow (44 styles) by Cyrus Highsmith, as seen in The Wall Street Journal<br>
    <a href="http://www.fontbureau.com/escrow" title="http://www.fontbureau.com/escrow">http://www.fontbureau.com/escrow</a></p>
    <p>FB Titling Gothic (49 styles) by David Berlow, as seen in GQ.<br>
    <a href="http://www.fontbureau.com/fonts/titlinggothicfb" title="http://www.fontbureau.com/fonts/titlinggothicfb">http://www.fontbureau.com/fonts/titlinggothicfb</a></p>
    <p>-and-</p>
    <p>Clicker (45 styles) by Greg Thompson, as seen in CSI.<br>
    <a href="http://www.fontbureau.com/fonts/clicker" title="http://www.fontbureau.com/fonts/clicker">http://www.fontbureau.com/fonts/clicker</a></p>
    <p>=====================================================</p>
    <p>ABOUT FONT BUREAU, Inc.<br>
    Font Bureau was founded in 1989 by noted publications<br>
    designer and consultant Roger Black and type designer<br>
    David Berlow to serve the emerging needs of microcomputer-based<br>
    magazine and newspaper publishers seeking unique typographic<br>
    identities. The New York Times, Newsweek and Smart were among<br>
    the first clients to commission type designs. During the past<br>
    16 years, Font Bureau has designed over 1000 fonts for over<br>
    300 publications. A few of these designs remain the exclusive<br>
    property of the publications but most have become part of<br>
    Font Bureau's retail library. The company is based in Boston.</p>
