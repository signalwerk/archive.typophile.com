    <p>Inspired by the Jack Daniel’s Black Label Whiskey logo from 1866, the Black No.7 has over 400 glyphs including ligatures, alternates and special characters.<br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/typocalypse/black-no-7" rel="nofollow">Download</a> the font for the price of a bottle Tennessee Whiskey.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blackno7-01_5445.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blackno-555_5772.jpg"></div><p></p>
    <p>The Black No.7 has not been approved as official artwork by the company. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blackno7-02_5943.jpg"></div><p></p>
