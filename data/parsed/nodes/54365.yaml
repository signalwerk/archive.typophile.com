    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 3.Feb.2009 1.43pm </div>
      <p>(Yorklyn, Del.) February 3, 2009 –– House Industries, a font design and illustration studio, has released a new collection of typography and objects inspired by the work of mid-century designer Alexander Girard.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PRESS_4403.girard_3Dtype_script.jpg"></div><p></p>
    <p>As a textile designer for Herman Miller from 1952 to 1973, Alexander Girard collaborated with Charles and Ray Eames and George Nelson to form what is widely known as the Camelot of design. In the mid-century era of Modernist sterility, Girard's folk art sensibilities softened the hard edges of the prevailing style. His love for typography and use of illustrative lettering was evident in his personal work as well as high-profile pieces such as the renowned International Love Heart.</p>
    <p>In creating its own interpretation of the Girard aesthetic, House Industries undertook an extensive research project, exploring four decades of the designer's work archived at Vitra in Germany and Herman Miller in Zeeland, Michigan. A pilgrimage to New Mexico unearthed more reference materials, including Girard's famous Unitarian Church mural in Albuquerque, his collections at the Folk Art Museum in Santa Fe, and more treasures at the home of the Girard family.</p>
    <p>For the Alexander Girard fonts, House Industries designers took inspiration from a variety of source materials.</p>
    <p>Girard Script was loosely based on Girard's signature as it was always printed on the selvedge of fabrics he designed, as well as an assortment of obscure personal illustrations.</p>
    <p>Girard Slab is a practical slab-serif family of four weights and three widths, inspired by the cover of Herman Miller's 1972 fabric designs catalog and the Girard Miller logo. A special features allows the user to toggle the letter connections on and off.</p>
    <p>Girard Sky was based on alphabets drawn by John Neuhart and Karl Tani for Girard's famous rebranding of the Braniff International airline in the 1960s.</p>
    <p>Girard Sansusie combines a folksy flair with a lettering style evident throughout the Girard oeuvre, most notably on his 1955 Herman Miller fabric catalog.</p>
    <p>In the spirit of the Herman Miller Textile and Objects store that served as a showplace for Girard's thoughtfully-curated fabric designs, toys and folk art in the 1960s, the House Industries' Alexander Girard Collection features its own set of Girard-inspired objects. Each of these objects tells its own story while gracefully taking its place in any contemporary living space.</p>
    <p>Sunny faces beam from a set of children's alphabet blocks, originally designed for the San Francisco MoMA show in 2006.<br>
    Hand-made dolls, designed exclusively for House Industries by Marilyn Neuhart, are made from Mexican cotton with the same loving care as the originals she sewed for the opening of the T&amp;O store in 1961.<br>
    A nativity set of 11 solid maple pieces is based on an original Girard illustration that hangs in his son's house.<br>
    Snakes, rabbits, fish and foxes form a menagerie of mystery in a childrens’ puzzle based on a Girard carpet design.<br>
    Girard’s folk sensibilities abound in the cornucopia of illustrative delights found in a 72-piece wood memory game.<br>
    To purchase House Industries' Alexander Girard fonts and objects, visit the House Industries website at <a href="http://www.houseind.com/">www.houseind.com</a>.</p>
    <p><a href="http://girard.houseind.com/">Click Here</a> to view the House Industries Alexander Girard Microsite.</p>
