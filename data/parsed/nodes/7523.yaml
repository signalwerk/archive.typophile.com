    html: <p>Udaya, I'm afraid Rotis can be considered neither modern nor elegant. You might want to look at Seria (Sans), Fresco (sans), Eureka (sans). And yes, they all happen to be Dutch designs, but that's sheer coincidence. Hopefully this will get you further in your quest...</p>
