    votes: null
    html: "<p>I think Rotis (but not the \"full\" Sans) might actually be a good choice here because: its narrowness will help with the long name; and I think it does look elegant and contemporary (I'm not sure what \"modern\" really means here). On the other hand, it's been overused, and it will probably need some tweaking to look just right. So I think you might keep looking - and hopefully get some more help here. <br> <br>hhp</p>"
