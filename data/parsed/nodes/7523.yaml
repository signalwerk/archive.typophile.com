    html: <p>Whatever your final choice I would urge you to convince your client to invest in someone with skill to manually readjust the letterforms of the final setting so that the logo becomes a logo. The double t in Better will need some work as most likely ther ri and rs combinations in Interiors. It need not cost a fortune, but it should be looked at.</p>
