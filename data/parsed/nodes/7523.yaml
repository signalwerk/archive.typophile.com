  html: <p>hi people, <br> <br>i am desinging a masthead for a new interior design magazine. it is supposed to be a high lifestyle and sophisticated kind of magazine. the client wants me to design it with typo only. could anyone suggest me a font which would go with the culture and concept of the magazine (elegant and very modern). i was thinking of rotis(semisans or sans) by otl aicher.  <br>please guide me. thanks in advance. <br> <br>it is titled as "better interiors"</p>
