  html: |-
    <p>After another long night, I think we've got the load averages on the server back to normal.</p>
    <p>Some squashed bugs:</p>
    <ul>
    <li>Repaired Edit links at the bottom of posts.</li>
    <li>Fixed posting bug that prevented new forum threads and Typowiki articles.</li>
    <li>Some serious MySQL tuning: MySQL was eating all of the processor and memory resources on the server. The memory was full, causing swap file paging, disk IO limits, cpu burn, and a flaming server death spiral. We are still working on a server upgrade, but in the mean time, the site is at least working as well as it was before.</li>
    <li>Enabled much more aggressive caching: Users that aren't logged in won't always get the freshest view (within a few minutes), but the site is faster for everyone.</li>
    <li>Forum statistics are now correct.</li>
    <li>Fixed insert image bug (the images are no longer trying to post to my laptop).</li>
    </ul>
    <p>Some new features:</p>
    <p>This update was more of a platform update than a features update. Even so, there are a bunch of subtle tweaks that are going to make Typophile even more time consuming.</p>
    <ul>
    <li><a href="/projects" rel="nofollow">Projects</a> and <a href="/resources" rel="nofollow">Resources</a> pages aren't greyed out!</li>
    <li><a href="/typowiki" rel="nofollow">Typowiki</a> pages now display a revision history. Anonymous users can view the revisions, and logged in users can revert the revisions.</li>
    <li>Typowiki revisions have a new field to add a comment explaining why they are making an edit. Now edit wars will be transparent to end users. (Not that we have that problem).</li>
    <li>New tagging system for Typowiki pages. (More to come around that in the future).</li>
    <li>Everyone has blogs. Blogging is more fun in a community. If you are interested in posting on a type blog, but don't want to build an audience by posting every single day, why not collaborate? Readers can see the whole mix of Typophile blogs at <a href="http://typophile.com/blog" rel="nofollow">typophile.com/blog</a> or they can read/subscribe to just your posts.</li>
    <li>The CSS is just better. For example, the News page is actually decipherable now.</li>
    <li>The code base is more standards compliant. Flash page titles display as h2 tags when flash isn't installed, or when search bots are looking at them.</li>
    <li>Home page modules move out of the way so you can read the last 10 comments. Key left or right to flip through them.</li>
    <li>New system for featuring sponsored fonts. Right now the site is featuring the <a href="/wiki/Beorcana" class="wiki" rel="nofollow">Beorcana</a> family by <a href="/wiki/Carl%20Crossgrove" class="wiki" rel="nofollow">Carl Crossgrove</a>.</li>
    <li>No lame fake IM. If you want to contact someone, you can still use the contact form.</li>
    </ul>
