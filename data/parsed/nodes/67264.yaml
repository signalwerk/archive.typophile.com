    html: |-
      <p>Did you ever see a difference?</p>
      <p>Truetype fonts got a bad rep because of loads of cheapskate 'free' fonts, which looked bad on screen and worse in print. (And I wonder: could this be because the first widely available 'font design' tools were TTF, or Windows based?)<br>
      Technically, however, they are equivalent to Postscript fonts. There is even an ongoing debate about that -- the mathematical curves (splines) in TT fonts are different from PS Bezier curves, and some maintain one produces "nicer" curves than the other. I wouldn't know.</p>
      <p>TTs <em>may</em> look better on screen, because its format has extensive support for screen optimization built in, especially in smaller sizes. But it's a lot of work for the designer to program all that data; and the auto-hinting of screen drawing programs gets better by the year, and screen rez gets higher and higher every year. Besides, it really doesn't matter for printing.</p>
      <p>There is another sort of self-imposed limitation in PS-flavoured fonts: the Design Grid is by default 1000 x 1000 integer units, while for TT-flavoured fonts it's 2048 x 2048. That means that (again, by default!) you can have twice as small elements in TT fonts as in PS. However, I believe there is no longer a real technical reason for this -- I'm sure the Font Creators here can fill in the details.</p>
