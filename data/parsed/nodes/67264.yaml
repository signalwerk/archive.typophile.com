    date_raw: 10 Feb 2010 — 9:57am
    votes: null
    html: <p>OpenType is an extension of TrueType. One of the ways it was extended was to allow PostScript outlines instead of TrueType outlines. So, OpenType-TT contains TrueType outline data, and OpenType-PS contains PostScript outline data. Either "flavor" will work well for print. TrueType outline-based fonts tend to be better for on-screen applications on Windows. They work equally well on Macs. OpenType-TT fonts don't work at all on pre-OS X Macs.</p>
