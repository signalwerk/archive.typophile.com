    html: |-
      <p>&gt; could this be because the first widely available 'font design' tools were TTF, or Windows based?</p>
      <p>Way back in the early 1990s when the first cheap "1.000 fonts" CDs came up, the copyright line usually said "Converted by Alltype". In fact, what damaged the reputation of the TT font format was a flood of bad quality automatically converted PS (Type 1) fonts, done with tools like Alltype or Fontmonger. The font creation programs then were Fontographer and Type Designer, both working internally with Type-1 curves. Very few people really made fonts with gimmicks like "Softy".</p>
      <p>Andreas</p>
