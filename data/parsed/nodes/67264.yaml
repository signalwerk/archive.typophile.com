    <p>Hi,</p>
    <p>After doing mostly web work for a few years, I've recently started doing more print work. I'm trying to get a better understanding of typefaces and their formats. I use Suitcase Fusion to manage my fonts and I'm a bit perplexed by the Type (font format) column.</p>
    <p>For example, when I load Gotham, the Type column says: OpenType-PS</p>
    <p>There is also Gotham Thin categorized as OpenType-TT. </p>
    <p>I thought that type could be either Open Type, True Type, or Post Script, but the above indicates that the font is both OpenType and True Type. Could someone give me some tips on how to read these formats and how to decide which one to use?</p>
    <p>Thanks!</p>
