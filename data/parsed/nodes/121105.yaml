  html: |-
    <p>Genplan Pro is finally released! This my debut on MyFonts.</p>
    <p>Genplan Pro is a display family of five typographic layers with a retro feeling. They could be stacked upon each other or could be used separately. Genplan Pro is based on the lettering in the title of the general plan of Moscow of 1935. It supports all European languages including Greek, and many Cyrillic languages including the Asian ones. It has uppercase and small-caps letters.</p>
    <p>It also includes currency signs for Russian Rouble, Ukrainan Hryvnia and Kazakh Tenge. It has many alternate glyphs, Ukrainian regular ligatures, discretionary ligatures, language based alternates for Polish (the kreska), Albanian (the shape of J) and Bulgarian (triangular Д and Л).</p>
    <p>As a typeface designed for display purposes, it’s great for use in logos and headlines</p>
    <p><a href="http://www.myfonts.com/fonts/thundertype/genplan-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Get it here</a></p>
