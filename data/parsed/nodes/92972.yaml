      <p>Here's  Millenium's page on using TrueType fonts:</p>
      <p><a href="http://www.embroidery-machine-software.com/lettering_true_type.html" title="http://www.embroidery-machine-software.com/lettering_true_type.html">http://www.embroidery-machine-software.com/lettering_true_type.html</a></p>
      <p>As I read it, the program (or at least Millenium III) can use truetype fonts. It creates its own internal format and saves it for future use.  It can use any font that's available on the host system.  If you want your service provider to use fonts that they don't have installed, you would only have to provide him with the fonts, paying due attention to the licensing rights and probably purchasing the font(s) for them. For many reasons, they may be averse to installing anything beyond what they already have.</p>
      <p> - Herb</p>
