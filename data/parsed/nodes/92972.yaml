      <p>The following comments refer to what's commonly referred to has home embroidery software, as opposed to commercial software. The line between them isn't clear. I've heard of Millenium professional software, but am not familiar with  Millenium  sewing/embroidery machine.</p>
      <p>Actually, there are  at least five different ways to embroider text.</p>
      <p>1)  Some embroidery software programs, such as Brothers PE Design and Bernina's Artista can create text directly using installed Truetype fonts (Note that ONLY Truetype fonts can be used; such programs effectively do their own rendering and can only process truetype fonts).</p>
      <p>2) Some embroidery programs include a number of built-in typstyles.</p>
      <p>3) Some embroider programs use stand-alone (usually overpriced) proprietary fonts. These include Embird and Viking/Pfaff software.</p>
      <p>4) You can always use pre-built designs; these are designs in the shapes of letters or words.</p>
      <p>5) Just about all embroidery sewing machines themselves have a number of built-in typefaces</p>
      <p>In addition, there is software available, such as the Husqvarna Viking suite, that can convert PC Truetype fonts to a set of separate designs (item 4 above) or to its own proprietary format (item 3 above)  </p>
      <p>My own terminology choice in embroidery is to use </p>
      <p>"embroidery alphabet" for a set of letter-shaped designs,<br>
      "embroidery font" for a proprietary font usable with specific embroidery software</p>
      <p>However, this is far from the norm; just as graphical alphabets, such as those found on scrapbooking sites, are often referred to as "fonts".</p>
      <p>  - Herb</p>
