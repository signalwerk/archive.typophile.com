    <p>The guy who runs embroidery always complains he has to draw out all the letters except when I use when of maybe five fonts, like Arial, Lubalin, and a couple others.  It would be great if I could make some fonts for the machine.  I've looked around on the web and there seems to be very little information on this.  Moreover, I gather there are 2 types of embroidery fonts, one, called a keyboard font which works they way one would expect fonts to work, and another which I don't understand at all but seems to not be usable to type out text with ( I know, that's not a really a font then is it? Maybe it's like individual monograms?)</p>
    <p>Could anybody shed some light?  Is there by any chance a way to make embroidery fonts with Fontlab?</p>
