    html: <p> I like any of the ones with the name inside the speech balloon. I am concerned, though, about what might happen to readability if this were printed much smaller or sloppier, as usually happens in a phone book or newspaper ad; or if it's embroidered on a t-shirt or ball cap, as marketing people love to do.  The e in both Avant Garde and Horatio could easily close up. I looked at some possible substitutes � Agenda, Avenir, Cronos, Eagle, Futura, and Myriad �  but only Eagle and Futura have the simpler one-story a, which works well in your design. Hmmm... guess it all depends on how it will be used. </p>
