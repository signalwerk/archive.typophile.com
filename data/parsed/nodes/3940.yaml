    html: <p> Thanks for the feedback guys. <br>The client has gone for the safe choice and picked Avante Garde. They also went for the logo within the large word bubble. <br> <br>Unfortunately they weren't big fans of the color scheme, so I have to do some exploring in that direction. The l/c "s" in Avante Garde is still really bothering me so I think I will play with it a little. Does anyone else agree that the "s" looks a little on the thin side? <br> <br>I don't think the logo will be reproduced at exceedingly small sizes so I'm not too worried about the "e" closing up, but thats a great point Christopher. </p>
