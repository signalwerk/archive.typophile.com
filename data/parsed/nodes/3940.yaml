  html: <p>Hi All, <br> <br>I'm developing a logo for a Marketing Community website called marketshare. The logo will be mainly for website use, but may appear on the back of textbooks. Type is set in Horatio EF, ITC Avante Garde Gothic and the exclamation point is set in Albers-ArchiType. <br> <br>I'm worried that the Avante Garde (logos on the left &amp; bottom) is a little too business and not enough fun. I also find the "s" to be a little condenced compared to the rest of the letters. <br> <br>I like the logos using Horatio (logos on the right) but I'm wondering if they look a little too mid 70's retro. <br> <br>Any comments would be appreciated. <br> <br>Thanks! <br><img src="http://www.typophile.com/forums/messages/29/3153.gif" alt="marketshare logos"></p>
  html_clean: <p>Hi All, <br> <br>I'm developing a logo for a Marketing Community website called marketshare. The logo will be mainly for website use, but may appear on the back of textbooks. Type is set in Horatio EF, ITC Avante Garde Gothic and the exclamation point is set in Albers-ArchiType. <br> <br>I'm worried that the Avante Garde (logos on the left &amp; bottom) is a little too business and not enough fun. I also find the "s" to be a little condenced compared to the rest of the letters. <br> <br>I like the logos using Horatio (logos on the right) but I'm wondering if they look a little too mid 70's retro. <br> <br>Any comments would be appreciated. <br> <br>Thanks! <br><img src="http://www.typophile.com/forums/messages/29/3153.gif" alt="marketshare logos"></p>
