  html: <p>Hi all, first time here. Very impress with all the critiques here. You guys provided great constructive criticisms. It prompted me to post a current project that I'm in a bit of a stand still. I'm currently updating a company logo, the old one seem very out dated. The company provides medical &amp; dental insurance so we can't really go wild on this one. It needs to be a bit conservative. Anyway, here are the various logos I came up with, I would be very appreciated if I can get any feedback to further improve the logo. Thanks in advance!</p><div class="imageWrap"><img src="http://typophile.com/files/logos_4134.gif"></div><p></p>
