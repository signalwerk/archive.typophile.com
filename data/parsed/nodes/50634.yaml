      <p>SOme things are worth keeping like the star and probably also orange colour because it goes well with the feeling of the word best. Maybe a 0,20,100,0 (CMYK) would be even more "golden"... Otherwise they are becoming too complicated in comparison to the original one.</p>
      <p>First step I'd do is I'd try to find a sans serif font to replace in the original logo that would go best with the star in hexagon.<br>
