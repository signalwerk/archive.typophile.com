    html: |-
      <p>#1 definitely has less clutter. Tag looks somehow horizontally distorted - stretched. Maybe the logo would look better if you used larger type for your mandatory tag line. I's still consult the client whether it's possible to change it to Life and Health Insurance, because logo already reads "Best life" and company really is one thing too many.</p>
      <p>Anyway. I'd try larger tag type that will probably span more than 1 line. I think your logo will look much better this way and you will also eliminate small size problems.</p>
      <p>Since logos should normally evolve I'd suggest you stay with #1 and refine it.</p>
      <p>You'll also have to do something about the star cut because you created a very thin line that may look as an error and it will probably create more bad than good.</p>
      <p>Carry on.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
