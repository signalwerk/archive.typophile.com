      <p>Good Monday everyone! appreciate all the great feedback.</p>
      <p>Look like everyone agreed it's way too busy, I will work on simplifying it.</p>
      <p>Penn, I agreed with you on "BEST" doesn't need to be in all caps, but unfortunately that is how it's being use in all the collateral. Maybe I should try putting "Life" in all caps also...just like the old logo to balance it out a bit.</p>
      <p>Chazglen, funny you mention putting the word "BEST" inside the hexagon cause that is how the original BEST life logo was created in the 70s. I did tried to update that also.</p>
