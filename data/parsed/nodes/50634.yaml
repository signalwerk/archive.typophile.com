      <p>I don't know...  the elongated hexagon IS distinctive...  I do agree with the "too many elements" comments. The tagline as is is SOOO unnecessary...  reminds me of 'best little whorehouse in Texas.'  Comparisons are odious.</p>
      <p>I'm thinking I'd like to see a nice typographic treatment of the word 'Best' inside the the hexagon (the one you've done for 'BL' is quite handsome) and then finish off with 'Life' in grey outside the hexagon (either to the right or below).</p>
      <p>The tagline SHOULD say something...  other than what you've already said:</p>
      <p>'BEST life and health insurance for the 21st century'</p>
      <p>(not sure it needs 'life and health')</p>
