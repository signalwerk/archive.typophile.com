      <p>The newer sketches are adding too much to it. I don't get why the star or initials has to be in a hexagon. I don't like that "Best" is in all caps. simplify your shapes and colors. Work in black and white first, then move on to color. Nothing here is working for me yet.</p>
      <p>penn</p>
