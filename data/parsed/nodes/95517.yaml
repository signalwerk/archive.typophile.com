      <p>Hi Pablo,<br>
      Thanks for the compliments. I know Yciar's work. In fact I have a facsimile of his book. But his work clearly follows the principles of Humanistic chancery and belong to the Renaissance. There are no traces of *pointed pen* in these pages but broad nib. What I said is Morante popularized Cresci's pointed pen style, a departure from the traditional chancery. I focused on Spanish Baroque calligraphy only.</p>
