    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dulcinea-name_3546.png"></div><p></p>
    <p>Dulcinea is the title of Ramiro Espinoza’s in-depth look at Spanish Baroque calligraphy’s most extreme tendencies, and especially at some of those produced by the writing masters Pedro Díaz Morante and Juan Claudio Aznar de Polanco. These 17th and 18th centuries alphabets with their plentiful calligraphic flourishes represented a marked break with the harmonic and angular Renaissance Cancellaresca style.<br>
    It was Morante who first introduced and popularized the use of the pointed quill in Spain, and although his famous text entitled <em>“Arte Nueva de escribir”</em> – first volume published in 1616 – contains alphabets that have much in common with traditional broad nib Cancellaresca calligraphy, most of the examples therein are outgrowths of the new models put forward by the Italian master Gianfrancesco Cresci.<br>
    The writing’s swashes are complex and intricate, but at the same time they feature a profusion of defects. Many of them sometimes come close to ugliness. However, these pages contain an artistic essence that bears a relationship to the ironic and sometimes somber character of Spanish Baroque.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/morante_4712.png"></div><div class="imageWrap"><img src="http://typophile.com/files/credits-morante_6068.gif"></div><p></p>
    <p>That’s why the name of the font pays homage to <em>“Dulcinea del Toboso”</em>, the fictional beauty from Miguel de Cervantes’s Don Quixote, a work that reveals many of the period’s conflicts, such as the contrast between utopian ideals and reality, uncertainty and madness.<br>
    But Dulcinea is far from being just a revival. Its forms are not careful tracings of the outlines of Morante and Polanco’s letters, nor are they attempts to reproduce them digitally. In fact, the author of the letters says that had the font been created that way it would have been too archaic to serve as acceptable contemporary typography. However, he believes that there are myriad interesting details that can be rescued and preserved, along with the playful spirit of the original.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/polanco_4739.vs.dulcinea.png"></div><div class="imageWrap"><img src="http://typophile.com/files/caption-polanco_6190.gif"></div><p></p>
    <p>The work of designing Dulcinea consisted of combining original historical elements with the creativity and calligraphy of the font’s author in order to produce a modern typography that isn’t based on the same traditional sources as many recently created scripts fonts.<br>
    Dulcinea offers attractive options for the setting of texts and headlines: abundant ligatures and swashes along with intricate alternate characters. It sophisticated forms make it an ideal option for women’s magazines, recipe books, lingerie products or perfume packaging.</p>
    <p>Dulcinea can be purchased at <a href="http://www.re-type.com" title="www.re-type.com">www.re-type.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dulcinea-newsletter-news_5482.png"></div><p></p>
