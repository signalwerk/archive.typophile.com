      <p>Hi Ramiro, Awesome font! Great work as usual.</p>
      <p>Just a little historic observation. When you say:<br>
      "It was Morante who first introduced and popularized the use of the pointed quill in Spain, and although his famous text entitled “Arte Nueva de escribir” – first volume published in 1616 – "</p>
      <p>You may be overlooking the awesome work of Juan de Yciar (aka Joanes de Iciar), from Saragoza. He published "Arte Subtilissima por la cual se enseña a escribir perfectamente" in 1548 (8 editions from 1548 to 1566). It's a writing manual, similar to those of Arrighi, Tagliente and Palatino (In fact, Juan de Yciar analyze in depth all those three masters, quoting similarities and differences within each method, and stating his own preferences).</p>
      <p>A limited edition (200 copies) facsimile of the 1550 edition was produced, reprinted from the original books in possession of Philip Hofer and Stanley Morrison. (I own one, and there are still a few available on Amazon). I also believe that JvK have studied this book, as I see some traits of Juan de Yciar "Letra Antigua spesVnica" and "Alphabetvm Latinorvm" in the first unrevised Lutetia (like the full-square proportions of the /E /F /L, the high crossbar of the /G, the high and to-the-right dot on the /i, the wide /o and narrow /n, maybe the structure of the /g). But of course, this can be just my erroneous impression, or simply a coincidence.. don't take my word very seriously.</p>
      <p>If you read Spanish, you will also enjoy reading Castellano Antiguo.</p>
