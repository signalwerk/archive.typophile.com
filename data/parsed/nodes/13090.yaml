      <p>I think the use of monospace fonts is largely historical, dating back to punched cards and line printers. There is some historical precedent for use of proportional fonts for programs, and there's nothing inherent about programming that requires a monospace font.</p>
      <p>Research papers and academic books in the 1970's, e.g. from the likes of Dijkstra and Wirth, would typeset programs with keywords in boldface and such. This was all academic stuff, though, and I don't think anybody had any systems that actually allowed one to edit and execute programs written this way; it was all book stuff.</p>
      <p>An early use of proportional fonts for actual programming was the SmallTalk system at Xerox PARC starting in the late 1970s. The SmallTalk system featured a graphical programming environment with an integrated editor. I don't know what font was used, but it was a proportional sans-serif face. This (supposedly) resulted in some howlers. In one case there was a button labeled "DoIt" (to tell to computer to perform some action) but a user misread it as "dolt" and became offended.</p>
      <p>Personally, I prefer editing programs in monospace, and everybody in my shop uses monospace. (We use C, C++, Java, and various scripting languages such as sh and perl.) As I said above, I believe this is mostly historical. For most things I suspect a proportional font -- one in which problem characters are distinct -- would work just fine.</p>
      <p>There are a handful of cases, however, where it really is necessary to have things line up properly. It's not just boxes around comments; sometimes horizontal alignment conveys important information about the program. For example, a table containing string and numeric constants should have its columns lined up. Or, mathematical expressions spanning several lines could have various terms lined up in order to make the structure of the expression more clear. It's probably possible to do this in a proportional font with the right tab settings in place, but in a monospace font it's much easier just to insert the right number of spaces.</p>
      <p>s'marks</p>
