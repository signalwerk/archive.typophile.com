      <p>I agree with bergamot's comment about monospace fonts making it easier to line up elements vertically. This can help to convey important semantics about the program, much as indentation helps to convey lexical nesting level.</p>
      <p>However, I wonder which way the causes and effects run.</p>
      <p>Is it: (a) "Lining things up is a requirement, therefore it's necessary to write programs in a monospace font" ?</p>
      <p>Or is it (b) "If one is programming in a monospace font, it's easy to line things up, so this technique is often used to help convey information about the program" ?</p>
      <p>My leaning is toward (b). The reason is that there are several examples of programming environments that use proportional fonts, including Python, SmallTalk and AppleScript. People seem to have a lot of success with these languages/environments, despite -- or because of -- their use of proportional fonts. It might be that the loss of the ability to line things up easily is offset by other advantages offered by using a proportional font. I don't have any personal experience using these systems, though.</p>
      <p>Above, johnbutler mentioned that he "eventually came to understand" about using a proportional font for Python. John, I'd be interested in more details about what you mean by this.</p>
      <p>s'marks</p>
