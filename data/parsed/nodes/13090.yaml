    <p>I know that the topic of appropriate fonts for code has come up quite a few times on Typophile. I spend a good portion of my time in code of one kind or another, and find myself using mono width fonts very infrequently. To many programmers, it's a heresy, but I can't really see any good reasons to use mono-width, except when the output depends on uniform character widths for formatting like in the shell. </p>
    <p>Are there any other variable width programmers out there? What types do you use? I usually use Verdana, because it's pretty unambiguous on the screen (particularly the braces/brackets/parens).</p>
