      <p>As a programmer, the primary reason to use monospace fonts is because they make it easier to line up elements vertically.</p>
      <p>[example omitted, since SmartyPants insists on removing whitespace even in code blocks]</p>
      <p>While it <em>might</em> be possible to define a system where an 'i' was one fixed unit long, an 'o' was two units, an "m" was three, etc., it would be a hassle with no real benefit. Also, it would cause all existing code to not line up properly.</p>
      <p>Code isn't read like a novel; it has unique legibility requirements. It is <em>vital</em>, for instance, that the reader can accurately identify each character individually, and tell similarly-shaped symbols apart. At the same time, it is far less important to be able to recognize words as whole shapes.</p>
