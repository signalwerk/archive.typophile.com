    html: <p>The sample shows an early version of what became, slightly cleaned-up, Monotype Old Style. Monotype Old Style was recut by Monotype in 1901 from a Stephenson Blake &amp; Company version, which is likely the version sampled here. The design originated at the Miller and Richard foundry in 1860. To achieve the effect shown, you need to open up the letter-spacing for Old Style more, probably, than the client might want, but try it and see!</p>
