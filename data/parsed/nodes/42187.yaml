      <p>In my opinion there are closer matches. There is soon to be a release of the typeface "Ronaldson" by Canada Type (advance copy of the font courtesy of Patrick Griffin). This will be at MyFonts soon. I also think that a number of the Caslons that are available would be better matches than Excelsior. The Caslons, being based on the work of an English designer are probably the closer matches, but I was familiar with Ronaldson as a new Serif Guide addition, and thought it worth showing.</p>
