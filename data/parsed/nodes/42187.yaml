      <p><em>Hmm. That cap L smacks of Tiffany. Not so sure.</em></p>
      <p>There's a good reason for that -- Tiffany was based partially on Ronaldson, which was a very widely imitated typeface. Ronaldson goes back to 1884, and Monotype had it as their 16th metal typeface. Remember, I'm not saying it is Ronaldson, only that I thought it seemed closer than Excelsior, which I still think is true.</p>
      <p>- Mike Yanega</p>
