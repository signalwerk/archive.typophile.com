    <p>Meet the informal cousin of the popular FF Mister K family:<br>
    <strong><a href="https://www.fontfont.com/fonts/mister-k-informal/regular" rel="nofollow">FF Mister K Informal</a></strong></p>
    <p><a href="https://www.fontfont.com/fonts/mister-k-informal/regular" rel="nofollow"></a></p><div class="imageWrap"><a href="https://www.fontfont.com/fonts/mister-k-informal/regular" rel="nofollow"><img src="http://typophile.com/files/FF_Mister_K_Informal_and_FF_Mister_K_Typophile_590_4339.png"></a></div><p></p>
    <p>This new design by <a href="https://www.fontfont.com/designers/julia-sysmäläinen" rel="nofollow">Julia Sysmäläinen</a> is the latest offspring of the <a href="https://www.fontfont.com/fonts/mister-k-informal/regular" rel="nofollow">FF Mister K</a> font family. It began in one of Kafka’s Quart Notebooks with handwritten texts that look astonishingly clear. The letter forms are carefully placed line after line but still reveal the author’s characteristic writing style. There is a simple explanation: These are final, rewritten texts. The first version — loaded with heavy editing and correction marks — can be found elsewhere in Kafka’s literary remains. The strong personality of FF Mister K is often appreciated, but some designers find it too unpredictable for down-to-earth target groups. So enriching the K Family with a clear, friendly looking member derived from Kafka’s stylistic repertoire seemed predestined by the users’ needs.</p>
    <p><a href="https://www.fontfont.com/fonts/mister-k-informal/regular" rel="nofollow"></a></p><div class="imageWrap"><a href="https://www.fontfont.com/fonts/mister-k-informal/regular" rel="nofollow"><img src="http://typophile.com/files/FF_Mister_K_Informal-Showing_Typophile_590_4756.png"></a></div><p></p>
