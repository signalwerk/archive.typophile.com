    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Adelle_Cyr_preview2_4035.gif"></div><p></p>
    <p>Due to popular demand and our continuous effort to broaden language support, we have been working on a Cyrillic extension for our award-winning typeface <a class="freelinking external" href="http://www.type-together.com/Adelle" rel="nofollow">Adelle</a>. As its Latin sister, Adelle Cyrillic is intended for multi-purpose editorial use, providing robustness and personality. To guarantee consistency throughout the two scripts they also share proportions, colour and general features without stepping beyond typographic acceptance. Alexandra Korolkova was a great help in finding the right tone and fine-tune subtleties of shapes. All 14 styles will be available later in the summer.</p>
    <p>Contact us for more information: <a class="freelinking external" href="http://www.type-together.com/info" rel="nofollow">http://www.type-together.com/info</a></p>
