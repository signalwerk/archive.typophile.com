    html: |-
      <p>Thanks George for the insight.<br>
      These numbers combine an "over rounded" geometric letter style -- somewhat similar to Helvetica -- with an open top 4; characteristics that are found in some 19th century fonts, but very rarely in modern digital fonts.<br>
      The closest I found were the numbers in a font designed by Steffen Sauerteig as a machine readable font using 1990s technology: <a href="http://www.myfonts.com/fonts/fontfont/ff-typestar/" rel="nofollow">Typestar</a>.<br>
      Don</p>
