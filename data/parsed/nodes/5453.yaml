  html: <p><img src="http://www.typophile.com/forums/messages/83/39765.jpg" alt="Flava Sample"> <br> <br>Hi there, <br> <br>I found this font some months ago and want to use in a client job. Unfortunatly I can't remember where I found it / downloaded it from to check licensing restrictions etc. <br> <br>I was wondering if it looked familiar to anyone or if you knew where it came from / who made it etc. <br> <br>(The font file is called ' flava '  and the download file was named ' Macintosh TrueType.sit ' if that helps at all!?) <br> <br>Thanks for your help! <br>Cheers,</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/83/39765.jpg" alt="Flava Sample"> <br> <br>Hi there, <br> <br>I found this font some months ago and want to use in a client job. Unfortunatly I can't remember where I found it / downloaded it from to check licensing restrictions etc. <br> <br>I was wondering if it looked familiar to anyone or if you knew where it came from / who made it etc. <br> <br>(The font file is called ' flava '  and the download file was named ' Macintosh TrueType.sit ' if that helps at all!?) <br> <br>Thanks for your help! <br>Cheers,</p>
