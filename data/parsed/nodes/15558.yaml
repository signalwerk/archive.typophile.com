    html: <p>The <em>Moonraker</em> bit is clearly inspired by early <a href="/wiki/Emigre" class="wiki">Emigre</a> typography, while <em>Apartments</em> is set in <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.107984.0.1&amp;attributes.sampleSize=48&amp;sampleText=A+P+A+R+T+M+E+N+T+S&amp;sampleSize=24" target="new">Frutiger</a>.</p>
    html_clean: <p>The <em>Moonraker</em> bit is clearly inspired by early <a href="/wiki/Emigre" class="wiki link-lost">Emigre</a> typography, while <em>Apartments</em> is set in <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.107984.0.1&amp;attributes.sampleSize=48&amp;sampleText=A+P+A+R+T+M+E+N+T+S&amp;sampleSize=24" target="new" class="link-external">Frutiger</a>.</p>
  - id: 89959
    user: 2088
    date: 2005-10-11T08:49:00
