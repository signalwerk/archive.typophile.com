    votes: null
    html: |-
      <p>I think Moonraker is <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=3&amp;displayfontid=E.78.0.0&amp;fontRendererText=WOOVRAKER" target="new">Emigré Modula Sans</a>, with the W and V inverted to become the M and N, and a tweak to the stem of the R. (An old font called Institution had the same R as Moonraker, but would also have had to invert the W &amp; V).</p>
      <p> - Mike Yanega</p>
    html_clean: |-
