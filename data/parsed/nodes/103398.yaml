      <p>This lettering was used on the first edition published by F. Warne &amp; Co. in 1902.  Enhanced excerpt of the lettering on the cover, taken from my files:<br><img src="/sites/default/files/old-images/CoverLetteringExcerptedAndEnhanced_3674.jpg"><br>
      Excerpt of the lettering on the cover of a later edition:<br><img src="/sites/default/files/old-images/CoverLetteringExcerpted_6313.jpg"><br>
      Note that it looks similar but is more crudely executed.<br>
      The practice in the trade was to attempt to keep the tone consistent for a series -- which would explain the distinctive titling for your Beatrix Potter books.<br>
      In later years fonts were chosen that approximated the original lettering.<br>
      Here is a 1999 edition with a font that is a pretty good match to the original lettering:<br><img src="/sites/default/files/old-images/CoverTitlingExcerpted_5399.jpg"><br>
      I suspect that it is a private font produced for F. Warne &amp; Co.<br>
      Anyway, its not in my folder with tilde shaped bar fonts.<br>
      Don</p>
