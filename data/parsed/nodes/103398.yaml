      <p>Other restrictions would depend on various national laws.<br>
      Certainly Warne would take action if such a font was used to promote Beatrix Potter stories, which can be freely distributed because they are in the public domain with long expired copyright, but are still cash cows for Warne because of the "look and feel" of the Warne product. Echos of Disney &amp; The Mouse that extended intellectual property rights for generations after the creators have ceased to exist. IP is going to be a big issue in the upcoming decades. Plenty of employment for lawyers. Plenty of money for mega companies, not much for the actual creators.<br>
      BTW AFAIK the lettering was not done by Potter. At least it's not mentioned in books about her that I have checked.<br>
      Don</p>
