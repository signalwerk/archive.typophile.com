      <p>I confirmed that F. Warne is in fact currently using the font. See <a href="http://www.peterrabbit.com/">http://www.peterrabbit.com/</a> where it appears in an interative book, perhaps as a Flash font excerpt.<br>
      Penguin bought F. Warne in the 1980s and spend money on reviving the business. I suspect this included development of the new font. It might have been in-house or by contract. Some contracts, such as the well known one by the Economist magazine for Officina display, have an exclusive use period followed by return of rights to the designer for sale as the designer wants. In this case it seems Penguin/Warne have retained the rights and it will not be available for sale to the public any time soon.<br>
      However, there is no copyright restriction on using the original lettering of 1902 to create an original font, without using any of the digital data owned by Penguin/Warne. See sample:<br><img src="/sites/default/files/old-images/EandF_FromOriginalLettering_4521.jpg"><br>
      The question is whether anyone would pay for it. If there is no market, it's not worth doing.<br>
      Don</p>
