      <p>EF is NOT from an existing font. NOTHING was taken from the Warne web page!<br>
      It is an original creation made from scratch in Fontlab.<br>
      It is based on the original book covers lettering from 1902 to 1910.  There are almost two dozen, each with a variation of the same lettering style.<br><img src="/sites/default/files/old-images/_SquirrelNutkin1903_5760.jpg"><br><img src="/sites/default/files/old-images/_JeremyFisher1906_3565.jpg"><br><img src="/sites/default/files/old-images/_TomKitten1908_4829.jpg"><br>
      You may check some at Archive.org. Search for Beatrix Potter.<br>
      Lettering artists of the era tended to copy one another so this is not a particularly original design.<br>
      The tilde shaped bar seems to have been first used by Thayler.<br>
      The T with raised spikes is a very common 19th century style.  See for example the digital revival from Canada Type. <a href="//www.myfonts.com/fonts/canadatype/ronaldson/">Ronaldson</a> designed vy  Alexander Kay, Rebecca Alaccari and Patrick Griffin. Recommended for purchase.<br>
      The R, which varies from cover to cover, is a common style for lettering in the era.<br>
      Don</p>
