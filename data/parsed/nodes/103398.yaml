      <p>In 1902 Book Covers were an art form using hand lettering and illustration. Note the E's. No two are alike.<br>
      The lettering for this cover is representative of the fashion of the day. Note the tilde shaped bar on the E and F.  A few fonts, not all digitized, with this effect: Titania, Pretorian, Gazebo, Oriente (Oliver), Harlech, Grange, Olympian.<br>
      Don</p>
