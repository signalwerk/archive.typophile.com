      <p>As mentioned in previous posts the private font produced for F. Warne &amp; Co. will probably not be made available. But there ARE  some fonts with similar features in the "transitional" category -- i.e. Baskerville etc. This Warne variation might be described as being in an English vernacular style. Note its low contrast and large rounded serifs dished at the midpoint.<br>
      I recommend <a href="http://www.myfonts.com/fonts/tiro/plantagenet/">Plantagenet</a> by  Ross Mills of Trio Typeworks. Some letter forms are quite different, but the flavor is the same.<br>
      Don</p>
