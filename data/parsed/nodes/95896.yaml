    html: |-
      <p>Only to start the discussion as I wasn't able to find any similar, even loosely.<br>
      I like <a class="freelinking external" href="http://www.myfonts.com/fonts/fountain/nordic-narrow-pro/" rel="nofollow">Nordic Narrow</a> for the first one and <a class="freelinking external" href="http://www.ffonts.net/Romeo-Giulietta.font" rel="nofollow">Romeo Giulietta</a> for the second one (even if outlines would need to be cleaned up).<br>
      For the second one, there'd probably a way by considering it as a mix of fonts. Even if it sounds odd, I would probably start with <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/bauhaus/" rel="nofollow">Bauhaus</a> (mainly because of the /S), redrawing almost everything starting from this base. I like also <a class="freelinking external" href="http://www.myfonts.com/foundry/TipografiaRamis/" rel="nofollow">Tipografia Ramis</a> fonts (mixing them).</p>
