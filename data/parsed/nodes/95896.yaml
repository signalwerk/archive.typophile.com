    <p>Hello,</p>
    <p>I am trying to reproduce two old logos from the Alaska Airlines. I am looking for the two fonts used in the two attached logos.</p>
    <p>I haven't found anything suiting on my font library yet. If you know a font which comes pretty close or is the exafct one let me know.</p>
    <p>Thanks in advance!</p>
    <p>kind regards,<br>
    Christian</p>
