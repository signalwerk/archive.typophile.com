      <p>Only to start the discussion as I wasn't able to find any similar, even loosely.<br>
      I like <a href="http://www.myfonts.com/fonts/fountain/nordic-narrow-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nordic Narrow</a> for the first one and <a href="http://www.ffonts.net/Romeo-Giulietta.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Romeo Giulietta</a> for the second one (even if outlines would need to be cleaned up).<br>
      For the second one, there'd probably a way by considering it as a mix of fonts. Even if it sounds odd, I would probably start with <a href="http://www.myfonts.com/fonts/itc/bauhaus/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bauhaus</a> (mainly because of the /S), redrawing almost everything starting from this base. I like also <a href="http://www.myfonts.com/foundry/TipografiaRamis/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tipografia Ramis</a> fonts (mixing them).</p>
