    html: |-
      <p>In the 60s, there were white clay letters very similar to those.  They were often used in low budget film for titles.  The clay letters were arranged on a black background and shot as film.  Later, the title footage was burned into the live action scene for titles.  I used the clay letters myself in film school many years ago.</p>
      <p> ChrisL</p>
