      <p>"Six years later in 1973, under similar material and time constraints, Alvarez would produce El Tigre in immediate response to the American-backed coup in Chile. The resulting film was Alvarez's most purely mournful, and one of his most devastating. Yet that film is virtually unknown while Hasta… remains one of Alvarez's most familiar works. "<br>
