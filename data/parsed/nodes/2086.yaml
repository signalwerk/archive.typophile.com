    html: <p>The transparency is the best idea yet. Got me thinking of overprinting <span class="caps">SLAVES</span> (condensed sans) in red, the full width of the bottom, ultra tight spacing bleeding oﬀ the page in 3 directions. 21st Century mixed case and small, ﬂush to the top-left of <span class="caps">SLAVES</span> (or possibly over the top left of it) in white or grey. <br><br>To do the overprint you may need to lighten the image (only behind the letters) since it is dark. Or, create two identical layers of red type in photoshop, one set to 50% opacity, the other to 100% multiply. <br><br>Don’t put anything on the tags or do any photoshop ﬁlter trickery, <span class="caps">IMHO</span>. <br><br>Randy</p>
