    html: <p>There is also a <span class="caps">UV</span> coat … can’t remember (this early Monday morning) which protects (better?) from ﬁnger prints. I’m pretty sure it is <span class="caps">UV</span>. In which case you could do a ﬂood <span class="caps">UV</span> (it is an art book, right?) and a spot high gloss varnish.  <br><br>One book I have in mind, and the reason I suggest “hiding” the type, is Herb Ritt’s <i>Africa</i> .. incredibly elegant, understated, reﬁned. The meat of the type is on the spine. Where the type really belongs anyway. Well, in my opinion anyway. If it is a high-impact photo, such as the one you have here, the type will  not be necessarily the thing that draws them in. It is the story which the photo is telling. Personally, I think that if the book is lucky enough to be face forward (or up) in the history or art section, or new books piles) you won’t need the type. And, when the book is relegated to the shelf, spine out, that is when the type needs to do its job. If you can, I wouldn’t make the type near so big, or ﬁnd a way to make it invade less of the image. And that is why I suggested varnishing.  <br><br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
