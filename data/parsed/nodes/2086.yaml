    html: <p>Miu, you need some dynamics, try this make the photo a negative image, or posterize it. The Image is dull and tell nothing of the story. If you have access to more photos I’d make a montage, the operative word of the title is Slaves. I’d also not justify the authors’ name and credit. By not justifying it could create some more tension visually. You might also play with making the title of the book the focal point and make the weak photo small. If you can play with 21st Century Slaves as it reads faster and is more dynamic. Just some thoughts,&nbsp;Dan</p>
