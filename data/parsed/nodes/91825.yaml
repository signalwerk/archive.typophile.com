  html: |-
    <p><a class="freelinking external" href="http://scriptsource.org" rel="nofollow">ScriptSource</a> is a dynamic, collaborative reference to the writing systems of the world, with detailed information on scripts, characters, languages - and the remaining needs for supporting them in the computing realm. The first release was in June 2011, but we've added many significant improvements since then. Here are some of the most recent enhancements:</p>
    <p><em>Topics</em> - You can now add information to ScriptSource that is not associated with a particular script, character or language - but rather with a topic related to computing and writing systems, such as keyboarding or font development.</p>
    <p><em>Comments &amp; Conversations</em> - You can now comment on any entry, source or need, and in real-time! This allows for ongoing conversations in response to a particular topic or contribution.</p>
    <p><em>Discussions</em> - Questions are now welcome! You can start a discussion on any script, character, language or topic, and others can provide answers through the new comment and conversation features.</p>
    <p><em>More Scripts</em> - We're up to 237 scripts now, and have reorganized our list of scripts to make browsing easier. The 131 scripts known to be in current use are at the top of the page. We've also increased our links with the important Script Encoding Initiative.</p>
    <p><em>Enhanced Data</em> - This includes CLDR version 2.0, IPA and Phonetic Symbol Guide information, and updated versions of other resources.</p>
    <p><em>New Home Page</em> - It's even easier to find interesting and useful information on ScriptSource, and add your own contributions. You can also see stats of what ScriptSource contains, and a list of the most recent contributions. The Featured entries will be changing each week, so check back often to explore new scripts and topics.</p>
    <p><em>Cleaner Code</em> - Finally, our HTML and CSS are significantly improved and should be even more robust on a variety of devices.</p>
    <p>In the next few weeks we also plan to add:</p>
    <p><em>Blogs</em> - ScriptSource will be hosting a few blogs related to the site and complex script computing, so we now support a more blog-style presentation of entries on a topic. These will begin to appear soon, so stay tuned.</p>
    <p><em>Feeds</em> - You'll be able to subscribe to RSS feeds based upon your particular interests.</p>
    <p>We're clearly excited about these new features, so we hope you'll <a class="freelinking external" href="http://scriptsource.org" rel="nofollow">try them out</a>. If you haven't been to the site for a while, please take a look at what we've done and give us feedback on how we can make the site work even better.</p>
    <p>Thanks to all of you who have helped us refine and improve ScriptSource in recent months, and to all who have spread the word about the site at various conferences and through blogs and forum posts. We appreciate your partnership and participation!</p>
    <p>Regards,</p>
    <p>Victor, for the ScriptSource Team</p>
