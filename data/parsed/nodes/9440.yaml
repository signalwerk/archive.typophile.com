    html: <p>the software you're using has to implement these features. so far, only Adobe CS products (and InDesign 2.0) support automatic substitution of OT features. <br> <br>If you're hoping to see automatic ligature substitution in Microsoft apps or in Quark, you'll have to wait until they release software that supports these things.</p>
