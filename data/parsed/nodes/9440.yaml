    html: <p>On Windows the Uniscribe component (usp10.dll) handles the application of OpenType features - traditionally it's only been used for the so-called complex script languages. Automatic features for are supported by the latest version of Uniscribe, supplied with XP SP2, so in notepad and elsewhere fonts like Zapfino and Bickham Script have their default OTL features applied. <br> <br>Office uses its own version of Uniscribe, and also bypasses Uniscribe for all but complex script languages due to the performance issues.  <br> <br>Not sure about the Mac but I think there's a similar situation there too.</p>
