  html: '<p>Hi all, <br> <br>I am creating a font with fontlab 4.6 that uses non-standard (custom) ligatures. <br> <br>Everything seems ok when compiling the font and testinf it in the preview pane. <br> <br>nb: I entered the ligatures by first drawing the glyphs and assigning names to them, then, I entered a feature liga { sub b a by ba; } liga. <br> <br>where "ba" is a custom caracter. <br> <br>The thing is, although it compiles and is working perfectly in the preview pane, the ttf or otf fontlab generates from it seems unaware of the ligatures... <br> <br>Is there anything I could do about it (I think there is... but what is it?)? <br> <br>thanks in advance!</p>'
  html_clean: '<p>Hi all, <br> <br>I am creating a font with fontlab 4.6 that uses non-standard (custom) ligatures. <br> <br>Everything seems ok when compiling the font and testinf it in the preview pane. <br> <br>nb: I entered the ligatures by first drawing the glyphs and assigning names to them, then, I entered a feature liga { sub b a by ba; } liga. <br> <br>where "ba" is a custom caracter. <br> <br>The thing is, although it compiles and is working perfectly in the preview pane, the ttf or otf fontlab generates from it seems unaware of the ligatures... <br> <br>Is there anything I could do about it (I think there is... but what is it?)? <br> <br>thanks in advance!</p>'
