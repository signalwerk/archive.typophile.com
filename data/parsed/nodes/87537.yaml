      <p><cite>Mandatory public education: it is a fact that when it was<br>
      first proposed as law (in England... no surprise) the main<br>
      argument was that it would help the economy. And really,<br>
      it makes a lot of sense.</cite></p>
      <p>Of course! And what is wrong with that. YOU say it like it was a bad thing. The economy isn't the property of capitalists. The "economy" is what we are all a part of regardless of our isms. Being less ignorant makes up more valuable to our selves, our families and the rest of society. </p>
      <p><cite>Revolution is easier in Egypt for<br>
      example not because there is more injustice there, but because<br>
      people there are more aware that they are peons. In the West<br>
      people think they're respected - a convenient illusion.</cite></p>
      <p>Revolutions seldom have good outcomes - Why would any rational person in the West seriously contemplate one. Evolutions are better. </p>
      <p>Revolution in Egypt was not easier than in the 'West", as the cost in human lives will attest, except that tin-pot dictatorships are not sustainable any more. Sooner or later, they will all fall. In a place where you can be thrown in prison, held indefinitely and tortured or killed for saying the wrong thing in public. I'd think it would not be difficult to get behind the idea of risking everything for change, on the off chance things will improve. </p>
      <p>... I don't know, but I think if I were an Egyptian, a Syrian or a Libyan right now I'd find the comparison of the occupy movement (which I support) to what has been going on in those countries less than an obvious one.</p>
      <p>now, Where's the type, man? :o)</p>
