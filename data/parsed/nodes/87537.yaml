      <p>There are many things wrong with forcing everybody to go to school<br>
      from age 5 to 18 simply for the sake of the economy. Don't pretend<br>
      you can't think of any of them.</p>
      <p>&gt; Why would any rational person in the West seriously contemplate one.</p>
      <p>To liberate their children from the covert enslavement.</p>
      <p>&gt; tin-pot dictatorships are not sustainable any more</p>
      <p>Indeed, the only thing that works now is letting people:<br>
      - Vote for one of two nearly-identical "choices".<br>
      - Complain so much that their desire for action subsides.<br>
      You tell them what to believe from childhood, gorge them with food,<br>
      music and video, and they will die not knowing what really happened.</p>
      <p>But politics is subject to fashion just like anything else, and<br>
      eventually the 90% who can't think for themselves will find some<br>
      other system cooler than Democracy. And the rich will again find<br>
      a way to work with that and stay on top, just like they've done<br>
      since the dawn of time.</p>
      <p>hhp</p>
