      <p>I don't know whether to write off good old-fashioned passive text just yet.<br>
      Some of you may recall the CD-ROM craze that occurred 20 years ago when computers started incorporating CD drives.<br>
      This led to the production of interactive "books" made with Macromedia Director.<br>
      But it never caught on.<br>
      Well, the Newton didn't, either (except with Grant Hutchinson), but was resurrected as the iPad.</p>
      <p>As an alternative to "interactive books", digital culture has developed gaming, which has very little running text.</p>
      <p>**</p>
      <p>I don't think text will become obsolete, until a better way than "writing" is found to excogitate, encode and communicate complex ideas. However, as a form of entertainment, gaming seems to surpassed books, radio, TV and movies.</p>
