    <p>I'm designing my first typeface, a contemporary serif family with four weights. I'd like to use massive contextual alternates (as in Kinescope or Vesper), but I have doubts about the limits to use this feature.</p>
    <p>I plan to adopt contextual alternates through stylistic sets for these situations:</p>
    <p>1. beginnings and endings;<br>
    2. glyphs collisions and undesired optical effects;<br>
    3. typesetting special symbols as arrows and flourishes;<br>
    4. Roman numerals;<br>
    5. chess notation with figurines (unsure about this one);<br>
    6. mathematical symbols and expressions.</p>
    <p>Besides this, there would also be optional variations in some glyphs (typically, Q, R, f, a) which could also be set with stylistic sets.</p>
    <p>So, is there any problem to set dozens or even hundreds of contextual alternates in OT tables? This may cause poor performance?</p>
    <p>I understand some of the situations I listed could be addressed with GREP styles in InDesign (as Roman numerals and chess notation), but it would be nice if the font had all these features.</p>
