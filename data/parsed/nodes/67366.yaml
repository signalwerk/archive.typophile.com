      <p><strong>Automatic Roman numerals from Arabic ones</strong></p>
      <p>I created a code to apply automatic substitution to any number from 1 to 9999. With just 37 substitutions, the code seems to be fair. But as I'm a novice, it may be improved by more experienced designers.</p>
      <p>To proceed all substitutions, the font needs 30 additional glyphs. And the principle behind all these substitution could be used in other similar procedures.</p>
      <p>Firstly, you need a class which brings together all numeric figures in the font:</p>
      <p><code>@NUMBERS=[@ONE @TWO @THREE @FOUR @FIVE @SIX @SEVEN @EIGHT @NINE @ZERO];</code></p>
      <p>Then, you create a Stylistic Set with four lookups of substitutions, ordened this way: thousands, hundreds, sets fo ten and units:</p>
      <p><code>feature ss09 {<br>
      lookup <strong>THOUSANDS</strong> {<br>
      	sub one' @NUMBERS @NUMBERS @NUMBERS by M.sc;<br>
        	sub two' @NUMBERS @NUMBERS @NUMBERS by twothousand.rm;<br>
        	sub three' @NUMBERS @NUMBERS @NUMBERS by threethousand.rm;<br>
        	sub four' @NUMBERS @NUMBERS @NUMBERS by fourthousand.rm;<br>
        	sub five' @NUMBERS @NUMBERS @NUMBERS by fivethousand.rm;<br>
        	sub six' @NUMBERS @NUMBERS @NUMBERS by sixthousand.rm;<br>
        	sub seven' @NUMBERS @NUMBERS @NUMBERS by seventhousand.rm;<br>
        	sub eight' @NUMBERS @NUMBERS @NUMBERS by eightthousand.rm;<br>
        	sub nine' @NUMBERS @NUMBERS @NUMBERS by ninethousand.rm;<br>
        } THOUSANDS;<br>
      	lookup <strong>HUNDREDS</strong> {<br>
         	ignore substitute @NUMBERS' @NUMBERS @NUMBERS @NUMBERS;<br>
        	sub one' @NUMBERS @NUMBERS by C.sc;<br>
        	sub two' @NUMBERS @NUMBERS by twohundred.rm;<br>
        	sub three' @NUMBERS @NUMBERS by threehundred.rm;<br>
        	sub four' @NUMBERS @NUMBERS by fourhundred.rm;<br>
        	sub five' @NUMBERS @NUMBERS by D.sc;<br>
        	sub six' @NUMBERS @NUMBERS by sixhundred.rm;<br>
        	sub seven' @NUMBERS @NUMBERS by sevenhundred.rm;<br>
        	sub eight' @NUMBERS @NUMBERS by eighthundred.rm;<br>
        	sub nine' @NUMBERS @NUMBERS by ninehundred.rm;<br>
        } HUNDREDS;<br>
        	lookup <strong>TENS</strong> {<br>
        	ignore substitute @NUMBERS' @NUMBERS @NUMBERS;<br>
        	sub one' @NUMBERS by X.sc;<br>
        	sub two' @NUMBERS by twoten.rm;<br>
        	sub three' @NUMBERS by threeten.rm;<br>
        	sub four' @NUMBERS by fourten.rm;<br>
        	sub five' @NUMBERS by L.sc;<br>
        	sub six' @NUMBERS by sixten.rm;<br>
        	sub seven' @NUMBERS by seventen.rm;<br>
        	sub eight' @NUMBERS by eightten.rm;<br>
        	sub nine' @NUMBERS by nineten.rm;<br>
        } TENS;<br>
      	lookup <strong>UNITS</strong> {<br>
      	ignore substitute @NUMBERS' @NUMBERS;<br>
        	sub one' by I.sc;<br>
        	sub two' by two.rm;<br>
        	sub three' by three.rm;<br>
        	sub four' by four.rm;<br>
        	sub five' by V.sc;<br>
        	sub six' by six.rm;<br>
        	sub seven' by seven.rm;<br>
        	sub eight' by eight.rm;<br>
        	sub nine' by nine.rm;<br>
        } UNITS;<br>
      	lookup <strong>ZEROS</strong> {<br>
      	  sub zero' by zero.rm;<br>
      	} ZEROS;<br>
      } ss09;</code></p>
      <p>Note the last lookup is a trick: to remove the zeros I applied a general substitution to a glyph zamed zero.rm. This glyph is empty and has zero width. So, all the zeros are hidden.</p>
      <p>It's running OK in the tests I made.</p>
