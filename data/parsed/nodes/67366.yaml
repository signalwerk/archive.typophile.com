      <p>Actually converting a date like 2012 to a roman numerals as you are trying to do is difficult and will need further input.<br>
      I have settled for a compromise and am limiting use to automatically change two numbers to small roman numerals for folios, with an option to change the result to Large Roman Numerals.</p>
      <p>I was considering a database or a modular approach but neither seemed workable.<br>
      If your usage was for current dates you could create glyphs for the next 10 years perhaps?</p>
      <p>For me the limit is that OpenType allows for a string in, like f_f_l but can only out put a single glyph and not a composite of 2 or more glyphs (to my knowledge).<br>
      There might be a solution if you were able to set up conditions like "IF there are 4 numbers together treat the first one like this and the second like this... ex-cetera" but this is way beyond me.</p>
      <p>Good luck.</p>
