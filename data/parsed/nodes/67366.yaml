      <p>====</p>
      <p>feature ss05 {</p>
      <p>   # Romansmall<br>
       # Ligatures<br>
       # The order is important<br>
      		sub one' zero' zero' zero' by onethousandroman;<br>
      		sub one' zero' zero' by onehundredroman;<br>
      		sub five' zero' zero' by fivehundredroman;<br>
      		sub one' zero' by tenroman;<br>
      		sub one' one' by elevenroman;<br>
      		sub one' two' by twelveroman;<br>
      		sub one' three' by thirteenroman;<br>
      		sub one' four' by fourteenroman;<br>
      		sub one' five' by fifteenroman;<br>
      		sub five' zero' by fiftyroman;<br>
              sub one by oneroman;<br>
        	sub two by tworoman;<br>
        	sub three by threeroman;<br>
        	sub four by fourroman;<br>
        	sub five by fiveroman;<br>
      		sub six by sixroman;<br>
      		sub seven by sevenroman;<br>
      		sub eight by eightroman;<br>
      		sub nine by nineroman;</p>
      <p>  #testing if ligatures work in SS</p>
      <p>} ss05;</p>
      <p>============</p>
      <p>here is my swap from lowercase to uppercase Roman numerals:<br>
      @roman1 being lowercase<br>
      @roman2 being the Caps version</p>
      <p>============</p>
      <p>feature ss03 {<br>
      # Stylist Set: Roman Large</p>
      <p>  sub @roman1 by @roman2;</p>
      <p>} ss03;</p>
      <p>===========</p>
