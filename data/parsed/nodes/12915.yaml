    html: |-
      <p>I don’t think you will find a complete compendium of available typefaces, and sadly, the old type catalogs from type houses and foundries have gone the way of the doing manual character counts for text fitting.</p>
      <p>It simply isn’t practical and incredibly expensive and time consuming to produce one, even in PDF without actually printing one.</p>
      <p>You can still get a hard copy of:<br>
      “The Type Specimen Book: 544 Different Typefaces With over 3000 Sizes Shown in Complete Alphabets”<br>
      by &amp; M Typographical Inc.<br>
      This only shows 544 styles, a drop in the bucket to what’s available.</p>
      <p>Berthold has great downloadable PDF versions of their type library, very well done, but again, not even close to what you want.<br>
      <a href="http://www.bertholdtypes.com/home.html" title="http://www.bertholdtypes.com/home.html">http://www.bertholdtypes.com/home.html</a></p>
      <p>If you are interested in old type specimen books, you can go to the Univerity of Delaware Library site and view samples and descriptions:<br>
      <a href="http://www.lib.udel.edu/ud/spec/guides/bookarts.htm" title="http://www.lib.udel.edu/ud/spec/guides/bookarts.htm">http://www.lib.udel.edu/ud/spec/guides/bookarts.htm</a><br>
      That way you can know what titles to search for on EBay or Google.</p>
      <p>I have a modest size collection of type specimen books going back to the early 1900’s and they are great for reference but not relevant to fonts being sold today. Remember, most hot metal and phototype fonts were retooled for digital fonts and many have lost their design subtleties.</p>
      <p>Yes, I’m old, but I’m back in style!</p>
