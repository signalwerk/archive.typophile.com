    html: <p>Well... you could order catalogs from a bunch of foundries you like... but those aren’t going to have everything. I picked up a few older type books at a used book sale a while back, they weren’t free but they were worth the $3. <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1856694062/qid=1118108739/sr=1-2/ref=sr_1_2/104-2474722-6202353?v=glance&amp;s=books">Rookledge’s International TypeFinder</a> was one of them, I have the 1983 edition. Worth a look on eBay, maybe?</p>
