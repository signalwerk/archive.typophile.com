    <p>Does ANYONE know where I could find a **FREE** downloadable type/font reference document. Way back in 1996 when I started designing, the design firm had a 500 page reference book with fonts. </p>
    <p>I have YET to find one of these free. I know about the Adobe Type Library Reference book version 2, but that doesn’t have everything. </p>
    <p>Any help with this would be greatly appreciated. </p>
    <p>I just don’t find looking at gif images of samples very efficient...</p>
    <p>Thanks!<br>
    -cardo</p>
