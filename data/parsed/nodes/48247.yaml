    <p>I want to use ITC Highlander bold italic in a certain design. The Linotype site offers two versions called:</p>
    <ul>
    <li><a href="http://www.linotype.com/13723/itchighlanderbolditalic-font.html">ITC Highlander® Bold Italic</a></li>
    <li><a href="http://www.linotype.com/187757/itchighlanderbyitcbolditalic-font.html">ITC Highlander® by ITC Bold Italic</a></li>
    </ul>
    <p>I’ve been trying to understand the difference. I can’t see any by just looking at the Linotype web site (PDF samples, create samples). But in the Linotype FontExplorer application, the fonts look distinct, as shown below.</p>
    <p>Any ideas what’s going on?</p>
    <p></p><div class="imageWrap"><img src="/files/highlander_vs_highlander_5633.png"></div><p></p>
