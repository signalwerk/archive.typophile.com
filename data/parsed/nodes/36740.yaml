      <p>For some reason MT call it Bernard Bold Condensed. It's like a sanitised version of a Bernhard font, but yes Arjen, you're right.</p>
      <p>I first became aware of Lucian Bernhard at an exhibition of 'Deutsche Plakate 1888-1933' called 'Kunst Kommerz Visionen' at the Deutsches Historiches Museum in Berlin in 1992 where LB featured quite prominently. There were a number of contemporaries of LB who all worked in a similar graphic style; Julius Gipkens, Louis Oppenheim, and Julius Klinger, but Bernhard stood out for me.</p>
      <p>There was some fantastic stuff there. I wonder if that exhibition ever travelled?</p>
      <p>Take it away Arjen.</p>
      <p>Nick Cooke</p>
