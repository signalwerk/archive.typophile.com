      <p>Thanks Quincunx.</p>
      <p>Ok Bernhard Bold Condensed.<br>
      It wasn't so hard to find on <a class="freelinking external" href="http://www.myfonts.com/browse/person/bernhard/lucian/" rel="nofollow">My Fonts</a>. Someone allready suggested it was ß.</p>
      <p>And I found some info &amp; a poster he designed <a class="freelinking external" href="http://www.spartacus.schoolnet.co.uk/ARTbernhard.htm" rel="nofollow">here</a>.<br>
      <cite><br>
      Lucian Bernhard was born in Stuttgart, Germany in 1860. Mainly a self-taught artist, in 1905 Bernhard won a competition sponsored for the Berlin Chamber of Commerce. He began producing posters and quickly established himself as one of the most important people working in this field in Germany.<br>
      Bernhard was employed by the German government during the First World War to produce propaganda posters. After the war he became Professor of Poster Design at the Berlin Royal Academy.<br>
      In 1923 Bernhard moved to the United States where he joined with Rockwell Kent to establish the New York design company, Contempora. Over the next few years he was involved in several projects including the design of 36 different typefaces. Lucian Bernhard died in 1972.</cite><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ARTbernhard_6234.jpg"></div><p></p>
