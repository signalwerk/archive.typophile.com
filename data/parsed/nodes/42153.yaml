    <p>Hi. I’m designing a poetry book. Some of the poems contain multiple qoutes. When I’m hanging curly qoutes the margins seems very messy. How should I go about this?</p>
    <p>Typical norwegian usage is «arrow qoutes», but the auther provided me with “curly qoutes”.  Should I still hang the qoutes if we change them? And how about paranteses?</p>
    <p>Advice would be apreciated.</p>
    <p>f</p>
