    html: <p>When setting poetry, I usually hang quotes. Double ones as well, but less far out than single quotes. If you want to change it (e.g. to arrow quotes), make sure to check that with the writer of the poem, because from experience I know poets often consider everything in their poems very carefully. But that is obvious.</p>
