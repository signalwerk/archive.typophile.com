      <p>I have seen poetry books set with hanging double quotes — hanging fully into the margin — and I didn’t think it worked. The eye was continually drawn to them. </p>
      <p>Better to go with single quotes I think — which is, after all, the British standard. Then kern them into the margin slightly.</p>
