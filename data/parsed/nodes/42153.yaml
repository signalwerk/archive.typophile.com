      <p>I think it depends on circumstances, one of which is the typeface.<br>
      Some fonts have honking big quotemarks, others are more discreet.</p>
      <p>Another thing to bear in mind is that poetry is often re-read—not later, but in the initial reading session—so I wonder if this business of hanging quotes is more or less of an issue in a re-read?</p>
