    html: |-
      <p>As long as we’re giving personal points of view . . .</p>
      <p>When setting poetry, I usually do not hang quotes. It would depend on a number of factors. Since we only work for publishers, the publisher’s editor usually has a strong preference. Lacking that, if for some reason I really want to hang the quotes, I would try to get up with the poet (assuming the publisher doesn’t mind, i.e., we’d go through the publisher).</p>
      <p>Before even thinking of hanging the quotes though, I’d look at the poetry. Since hanging punctuation is not much used in the States in bookwork, hanging quotes tends to look like jacket blurbs &amp; other advertising. Maybe it’s different in Europe &amp; other parts of the world. </p>
      <p>An advertising look is usually not what you want in poetry. But poetry sometimes has multiple levels of indented lines, and sometimes there is a pattern to these indents. It use to be that the poet prepared the MS on a typewriter, i.e., always monospaced. Translating that feel into typeset copy can be challenging, and it was the comp’s job to do that.</p>
      <p>One of the hardest jobs I worked on had long selections from A.R. Ammons. A copy of the tape had been cut apart &amp; pasted up on 8.5x11 sheets &amp; then photocopied, so it was now pages rather than the roll as split by Ammons. When you went from one sheet to the next, it was devilishly hard to tell you where you were in the indent structure.</p>
      <p>* * *</p>
      <p>I have yet to find anything that overrides Ward’s *Crystal Goblet* dictum for design &amp; composition, but also find very few designers (or design teachers) who don’t abandon it to strut their stuff &amp; tart things up.</p>
      <p>FWIW</p>
