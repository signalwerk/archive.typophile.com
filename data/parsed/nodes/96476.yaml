  html: |-
    <p>In professional uppercase-only fonts like Trajan, lowercase character slots are filled with their uppercase counterpart. That is, typing in lowercase in Trajan still produces uppercase type.</p>
    <p>Having completed an uppercase font in Robofont, is there a quick  way to copy the glyphs, their spacing, and their kerning pairs to the lowercase characters?</p>
    <p>I really have no skill in Python, which is why I'm coming to Typophile for help instead of the Robofont forums, which only provide answers way over my head.</p>
