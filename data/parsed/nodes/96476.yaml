      <p>Robofont is an exotic tool? I find it much more user friendly than Fontlab, but maybe that's me. </p>
      <p>In any case, if you want the "lower case" glyphs to be composites of the Upper case, you can just click the "A", hold shift, click the "Z", to select all caps, then  choose Edit&gt;copy as components. Then use the shift method to select all the lower case glyphs and then paste. </p>
      <p>Jason C</p>
