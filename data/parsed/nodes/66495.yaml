    html: |-
      <p><cite>something expressed in the long sides' length and the base.</cite></p>
      <p><code>I am only a moderate mathemathician, but I'll give it a try in the coffee breaks.</code></p>
      <p><code>There are 2 special cases to verify the formula.</code></p>
      <p><code>The first is when the long sides of the triangle are 0.5/sin 22.5 = 130.6563% bigger than the base, then the roof will be flat, the cutting angle for the base is 90 degrees (you cut of everything so a 2-dimentsional roof remains), and the cutting angle for the long sides of the triangle is zero degrees (a vertical cut with no depth :-).</code></p>
      <p><code>The 2nd special case is when the long lengths of the triangle are infinite, the cutting angle for the base will be zero degrees (a vertical cut with the depth of the material thickness) and the cutting angle for the long sides is 90-(180-45)/2 = 22.5 degrees. (alternatively calculated with: 90 - arc cos(0.5/(0.5/sin22.5)))</code></p>
      <p><code>So, the cutting angle for the long sides of the triangle must be between zero degrees for a flat roof, and 22.5 degrees for an extremely high roof. Coffee brake over</code></p>
