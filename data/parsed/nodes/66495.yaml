      <p><code>Bah, no curves in the roof. I don't like straight lines. Anyway, with a bit of pythagoras you can calculate that the cut at the base of the triangle should be 61.85 degrees, the triangle leans at an angle of 28.15 degrees, and the cuts at the sides of the triangle should be 10.40 degrees.<br>
