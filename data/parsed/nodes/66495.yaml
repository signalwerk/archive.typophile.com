      <p>dberlow's calculation is almost correct. Given the height 100mm, diameter 370mm, run 185mm:</p>
      <p>185 divided by 100 = 1.85 then &gt;&gt;&gt; hit the Inverse Tan button = 61.60698058 degrees. </p>
      <p>Good luck cutting that on your table saw. And good luck with the apex! I suggest buying a piece of acrylic, scoring the triangle sections and heat bending the score lines. Or, perhaps less elegant / natural, add a king post and hip rafters as designed in most any ol' set of gazebo architectural drawings. Or, since no real loads will be on this thing, just use hip rafters and sheath the roof roof.</p>
