  html: <p>There are only 3 days left to polish that tee and get it in! <br> <br>Yes, you know who you are -- all 3,700 of you that have  <br>the kit on your desktop, collecting dust. You've proven  <br>that designers are procrastinators. Well, time's up! <br> <br>We're excited to see what gems squeak in under the  <br>deadline Friday night to challenge the current favorites  <br>among the 300 entries so far. <br> <br> <br>Joe <br>Jared</p>
