      <p>Endre,</p>
      <p>As William said, Briem's site is a superb resource.</p>
      <p>As you're searching for information other than the technical, I found David Earl's interviews in <a href="http://www.amazon.co.uk/Designing-Typefaces-David-Earls/dp/2940361592/ref=sr_1_2/026-6122446-7746807?ie=UTF8&amp;s=books&amp;qid=1189327073&amp;sr=8-2" rel="nofollow"> Designing Typefaces</a> interesting for gaining an insight into the philosophies of various type designers, including Barnbrook, Hoefler, Porchez and Carter.</p>
      <p>Also, there's <a href="http://typophile.com/node/18744?" rel="nofollow">Karen Cheng's</a>, 'Designing Type'. There's been much debate about the usefulness of this book. I for one found it useful.</p>
      <p>Typophile itself is a priceless reference for gleaning pearls of wisdom if you dig around.</p>
