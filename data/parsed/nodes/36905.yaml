      <p>I’m just starting to read Karen Cheng’s Designing Type. At first blush I was really very impressed with it. It looks wonderful. And, then, to be fair, I must admit that I realized that part of its impressiveness is because it's printed on heavy paper: it is literally a weighty tome. Flipping through it and seeing all the examples of letterforms only reinforces my sense that it will be aterrific reference.</p>
      <p>That said, it does follow a now customary, but annoying habit: a seemingly very good book on design that is itself a bad example of design: tiny, light-faced sans serif main body type.</p>
      <p>Can someone please fill me in on the "much debate about the usefulness of this book"?</p>
      <p>Stephen Tiano<br>
      Book Designer, Page Compositor &amp; Layout Artist</p>
