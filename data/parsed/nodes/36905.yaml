      <p>Hi Endre. Tiffany and Eben are maintaining a <a href="http://typophile.com/books" rel="nofollow">list of books about typography and type design</a>. You’ll find stuff both on type design history and practice depending on what you’re looking for. To get started in type design all-around, there is what some people call “<a href="http://www.typophile.com/node/13490" rel="nofollow">the triumvirate</a>”, which includes:</p>
      <ul>
      <li><cite>Letters of Credit</cite> by Walter Tracy</li>
      <li><cite>Anatomy of a Typeface</cite> by Alexander Lawson</li>
      <li><cite>Counterpunch</cite> by Fred Smeijers</li>
      </ul>
      <p>Good luck!</p>
