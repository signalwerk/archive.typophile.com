      <p>See <a class="freelinking external" href="http://www.typotheque.com/articles/designing_type_/" rel="nofollow">this review</a> by Peter Biľak, who is a superb type designer. </p>
      <p>Essentially his complaint is that the title is misleading, as Cheng doesn't approach type design as a type designer would. The best examples of the latter are "Letters of Credit" by Walter Tracy and the <a class="freelinking external" href="http://briem.ismennt.is/" rel="nofollow">Briem web site</a>. </p>
      <p>Still, the comparisons are done well and well displayed, so it is a pleasure to read, and helpful. The bottom line is that the book is valuable, and does  something that you won't find elsewhere. I find the comparison of proportions of the caps, particularly nice. So it is a useful book, though more limited than you might expect from its title.</p>
      <p>Oh, and I agree with you about the light weight of Univers for the text, on shiny paper; that kind of thing doesn't inspire confidence. </p>
      <p>If you are designing type you will no doubt to much more of she has done by opening different fonts in a Font creation program, and pasting the outlines one over the other for comparison.</p>
