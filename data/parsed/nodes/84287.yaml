      <p>Rikke, your eng is ok, j leg is the usual way to build this glyph.</p>
      <p>You may try <a class="freelinking external" href="http://www.fontlab.com/font-editor/typetool/" rel="nofollow">TypeTool</a> to include new glyphs to your fonts, but first verify if their EULA allow you do this. There is also the free FontForge (follow the link given above by Janek) and the more complete and expensive FontLab Studio.</p>
      <p>You can also consider a font update as Syntax has a standard, limited character set and the problem you face now would appear other times in the future.</p>
