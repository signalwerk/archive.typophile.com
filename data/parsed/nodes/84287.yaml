    <p>Hi,</p>
    <p>I am having a bit of trouble with a character that came up while working with a magazine. There is this essay about northern Norway and a name came up, Børsskog. The only problem is that the <em>ø</em> character has acute character <em>´</em> on top of it.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/oaccent_4339.png"></div><br>
    We’re using Syntax family for body text throughout the magazine.<p></p>
    <p>How would you suggest I go around this oddity of a character? By kerning the characters on top of each other? Or should I create a new character with some font software? And if so, is there a “correct” position for the acute accent?</p>
    <p>A lot of questions, I know. Sorry, and thanks in advance.</p>
