    html: <p>If it's of any help, the font they're using here (taken from comedycentral.com) is Font Bureau's Garage Gothic, with the counters filled in. <br> <br><img src="http://www.typophile.com/forums/messages/83/37039.gif" alt="nocounters.gif"> <br> <br>For short batches of text, it would be pretty simple to set the type in Illustrator/Corel/Quark/InDesign, convert it to outlines, and start deleting bezier points. <br> <br></p>
