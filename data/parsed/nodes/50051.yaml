    html: |-
      <p>I think this looks like it could be done as a composite of <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/horatio/">Horatio Light</a> and/or a font called <a class="freelinking-external" href="http://www.bowfinprintworks.com/BauhausFaces6B.html">Harry/Hammer</a> (samples from Bauhaus-style Font ID Guide). The only missing letter is the W, which could be made with two V’s from either of these fonts.</p>
      <p>- Mike Yanega</p>
