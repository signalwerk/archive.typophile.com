    html: |-
      <p>I remember that in an earlier discussion of overused typefaces, such as Papyrus and Comic Sans, there was some controversy over whether it was fair to include Hobo on the list of faces to avoid.</p>
      <p>I was looking through an old Letraset catalog, and noticed two display faces whose names I had not previously known.</p>
      <p>One, I thought, was a good candidate for the list - as a face that could easily be considered overused with only a little use. At the moment, though, it isn't often seen, which has saved it from that. I thought it was mostly associated with games like Dungeons and Dragons, but then I remembered its use as the original face for the logo of Creative Computing magazine: <a class="freelinking external" href="http://new.myfonts.com/fonts/dtptypes/pretorian-dt/" rel="nofollow">Pretorian</a>. Originally a Letraset face, it has been revived.</p>
      <p>Another Letraset face, Transmission, was used when <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/countdown-lt/" rel="nofollow">Countdown</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/letraset/data-seventy/" rel="nofollow">Data '70</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/tilde/amelia/" rel="nofollow">Amelia</a> just wouldn't do for a modern, futuristic look for a computer product. I recall it, I think, from a line of inexpensive floppy disks. It does not seem to be currently available. (There is a plain sans-serif font called "Transmission", but it is unrelated.)</p>
