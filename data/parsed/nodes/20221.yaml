  html: |-
    <p>I'm designing some logo options for a company involved in the plumbing industry. I have vague memories of seeing a font that looked like the letters were created using pipe fittings but I can't remember much else. Anyone have any thoughts on possible fonts that fit this description? If all else fails, I'll probably go to the hardware store, create the letters I need from actual pipe fittings, take a photo, and manipulate the photos to suit my needs. But I suspect a ready-made font would make my life a heckuva lot easier! Thanks in advance for anyone that can help!<br>
    Anne</p>
