      <p>I agree, formlos, and I usually do try to educate the client, but there are quite a few unique circumstances in this particular instance. However, there are very clever, creative ways of encouraging a client to avoid the cheesy design that they initially wanted and instead pick a classier, better designed option (for example, "oh, gee, there are just no fonts that include lowercase letters you wanted...here's a version with pipe fittings in uppercase, but look at this other design over here - it includes the lowercase you wanted, blah, blah, blah").</p>
      <p>Thanks for all the help, everyone! You've given me a lot of really good ideas.</p>
