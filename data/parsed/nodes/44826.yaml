    <p>I need people’s vote on this. </p>
    <p>I have this logo that I have used for many years now (since 97) shown here with the words spelt out “Atomic Attack”. I have designed a new logo which is more organic and represents two entities that combine together (me + wife) that form an “A”.</p>
    <p>Should I keep the existing logo, or pick something new. If you see my Avatar, it’s a snippet of collage/ graphics that will be on one side of my business card. The logo and into text will be on the other side.</p>
    <p>I am attached to the existing logo and hesitant of the new one... I am getting sleepless nights over this.</p>
    <p>Which one do you prefer and why?.</p>
    <p>Thanks!!</p>
