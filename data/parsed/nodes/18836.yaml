    <p>Hi everyone,</p>
    <p>Since a few days the dutch telecom-company KPN has a new visual identity, designed by Studio Dumbar.</p>
    <p>The typefaces used in this image are partly clear to me.<br>
    the word k p n is written in the typeface Proxyon from the dtl.</p>
    <p>My question is about the rest of the text: ‘sluit je aan’.</p>
    <p>Im lokking for this typeface. Is this custom made?... loosely based on a exsiting model, or just bought?...</p>
    <p>anyone a idea?... thanks!</p>
    <p>;-)  Matthijs</p><div class="imageWrap"><img src="https://web.archive.org/web/20141112115335im_/http://typophile.com/files/kpn_logo.jpg"></div><p></p>
