    html: '<p>Just thought of another great source for student projects. I was reminded of it because you will be looking for backround imagery. Check out The Library of Congress website American Memories section. Amazing wildly high res (up to 10mb) scans of all kinds of things Americana: Historic Panoramas of any city in America, scans of presidential correspondence, scan of broadsheets and old advertising. Go under collection finder and loose yourself for a day or ten. <br> <br><a href="http://memory.loc.gov/" target="_blank">http://memory.loc.gov/</a> <br> <br>There goes my presidential handwriting font collection, also scheduled for release in 2010. Oh well, enjoy! <br> <br>Randy</p>'
