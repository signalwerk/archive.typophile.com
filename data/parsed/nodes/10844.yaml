    html: <p><i>I also wouldnt be surprised if there were a few websites offering galleries, or perhaps hi-res scans of some of these designs... does anyone know of anything in this vein? </i> <br> <br>Here is a gem of a site (actually better to use their  java application) that has wildly high resolution old world maps and geography releted items all the way back to 1500's. I've literally wasted days drooling over the type on these maps. For your purposes, there are old train schedules from the 1800 - 1900's that have just that <i>Peoria, Texas, and Washington </i> type you're looking for. Use these letters to draw your own. There isn't really another way to do this well. Stretching and pulling letters using envelopes in photoshop, illustrator, or kpt will not get it done. You will spend more time looking for fonts and manipulating them, than you would drawing and learning. Plus there's nothing more fun than drawing woodtype. (ok, I'm a type nerd) <br> <br><a href="http://www.davidrumsey.com" target="_blank">http://www.davidrumsey.com</a> <br> <br>Man, I can't believe I just posted that beauty. It's got all the fonts I'm planning to digitize for release in 2010 :-) Enjoy. <br> <br>Randy</p>
