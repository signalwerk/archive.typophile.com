    html: "<p>Mark van Bronkhurst's Mildew is available through FontHaus.com: <a href=\"http://www.fonthaus.com/products/fonts/view.cfm?CFID=129982&amp;CFTOKEN=&amp;SKU=MB10129\" target=\"_blank\"> http://www.fonthaus.com/products/fonts/view.cfm?CFID=129982&amp;CFTOKEN=&amp;SKU=MB10129</a>. But I don't think it will help you with what you're after. <br> <br>The word \"Denton\" in your third example is set in Balloon. The script above it and the script in the first example may be set from type. But the rest is probably all hand-lettering. <br> <br>If this is a learning project, then you might just consider turning off the computer and trying your hand at drawing letters like these. You'll learn a lot that way. Try a library or used book store for some old books on hand-lettering -- sign-painting or advertising. <br> <br>-- Kent. <br> <br></p>"
