    html: <p>No sheckles required. Just call me Benedict. <br> <br>It's a bummer that there isn't more sharing of these kinds of hi-res resouces. It seems like people want to hang on to their secrets gems rather than get the word out. I've often dreamed of a destination for designers that had links to all kinds of incredible resources like those. Not just a fat list, but well done and organized by keywords etc. Does it exist already? <br> <br>So, I wasted another 1/2 day looking a WPA Posters scanned at 28Megs over at American Memories. Only the government could "afford" that kind of bandwith. Amazing. <br> <br>Glad it was useful. <br>Randy</p>
