    html: <p>Kent- <br> <br>Thanks for your note! I was actually considering a career in signwriting... here in Australia you can actually get a degree in it, and it takes awhile, and you have to apprentice and everything. The market is a bit flooded though, and the biggest problem is really my handwriting. I just cant draw a straight line!  <br> <br>Either way, could you possible reccommend a decent book to check out? I have some old speedball manuals, but i didnt find them clear. <br> <br>As for font ID's, my current infatuation is with <a href="http://www.vintagelabels.org" target="_blank">www.vintagelabels.org</a>. Can anyone ID the main sans-serif that they use on their page. Im particularly interested in the faces used on the oceanliner pages. The geometric sans' towards the back are particularly appealing. They remind me a little of the new hoefler faces, but as a student now, its out of the financial picture. Any other suggestions? Thanks in advance. <br> <br></p>
