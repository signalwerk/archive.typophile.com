  html: <p>Greetings everyone... <br> <br>I hope this is the right forum to be posting this on. I dont have a particular font that needs identification, but thought I would pick some of your brains to lead me down the right patch.  <br> <br>If this is in the wrong forum, I apologise, and will repost to the appropriate forum. <br> <br>I am doing research for a (student) project where I would like to riff off some old postcard design. I have attached a few examples of what I feel to be the typographic direction I would like to go in. <br> <br>I am aware that the main typefaces used here were most likely hand drawn or photo-type, but was wondering if anyone could reccommend any fonts with similar proportions or forms. <br> <br>I also wouldnt be surprised if there were a few websites offering galleries, or perhaps hi-res scans of some of these designs... does anyone know of anything in this vein? <br> <br>In terms of acheiving the dimension of the text. I was wondering if any of you had suggestions or a particular method that you use. I have been using  KPT Vector tools in Illustrator to achieve the dimension, and then using Pshop to get the curvature, but have not been very pleased with the results. <br> <br>My final question which is more type id related, is also  in relation to the postcards. In attempting to recreate this style, i am seeking some distressed typefaces that still maintain some semblance of typographic dignity... any foundries come to mind? Distressed i mean in the terms of looking like the ink has bled, or just general wear. Has a distressed version of Futura or similar fonts used during that era been released?   <br> <br>Perhaps some of you could share information on technique?  I think it might have been here, there was a thread that linked to a silkscreen site that contained graphics to lay over text in illustrator to acheive this effect. Are there any other places on the net to find these types of graphics?  <br> <br>Thank you in advance for anyone who takes the time to read and respond to my post.  <br> <br>Best, <br>Handsome Dan <br> <br><img src="http://www.typophile.com/forums/messages/83/8081.jpg" alt="postcard one..."> <br><img src="http://www.typophile.com/forums/messages/83/8082.jpg" alt="postcard two"> <br><img src="http://www.typophile.com/forums/messages/83/8083.jpg" alt="postcard three"> <br><img src="http://www.typophile.com/forums/messages/83/8084.gif" alt="...cant forget this one..."></p>
