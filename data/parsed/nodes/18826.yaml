      <p>&gt;I’m looking for books, links or anything else about the relationship between font and the technology used to design type</p>
      <p>Every serious book or website that deals with type design can’t help but talk about the relationship between type design and the technology used in both the design of the type and the rendering of the text set in it. So your question is very open-ended and therefore difficult (or easy) to answer. Posting it 4 times won’t help :-(</p>
      <p>Cheers, Si</p>
