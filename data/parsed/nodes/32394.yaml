      <p>There was also a version made by NovelFonts, called ‘Greenwood’. My notes have it as equivalent to ‘Grecian Bold’ in the Solotype Catalog. Therefore I’d guess the Solotype font Rob picked would be virtually the same, which is good to know, because the NovelFonts are not to be found any more. (Sold as the Expresiv Ornate Font collection in the mid-1990’s.)</p>
      <p>- Mike Yanega</p>
