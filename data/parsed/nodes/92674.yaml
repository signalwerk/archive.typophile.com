    html: |-
      <p>Crossfont handles archived or binhexed fonts containing the resource fork. More explanation here: <a href="http://www.asy.com/helpcf.htm#copymac" title="http://www.asy.com/helpcf.htm#copymac">http://www.asy.com/helpcf.htm#copymac</a></p>
      <p>There's also FontXChange for Mac, which is an Intel app so should run on Lion: <a href="http://www.fontgear.net/fontxchange.html" title="http://www.fontgear.net/fontxchange.html">http://www.fontgear.net/fontxchange.html</a></p>
      <p>FontForge is certainly capable, though perhaps a bit less straightforward— you'll probably want to consult Google:<br>
      <a href="http://www.google.com/search?q=fontforge+convert+mac+pc" title="http://www.google.com/search?q=fontforge+convert+mac+pc">http://www.google.com/search?q=fontforge+convert+mac+pc</a></p>
  - id: 508530
    user_id: 11578
    user_name: HVB
    user_path: null
    date_raw: 3 May 2012 — 5:11pm
    date: 2012-05-03T17:11:00
    votes: null
    html: <p>For any cross-environment migration or conversion, font-related or otherwise, I've always recommended doing the conversion on the TARGET system, if possible. The big advantage is that you can immediately test the result.</p>
