    votes: null
    html: <p>I think FontForge can do it <em>and</em> pour you a cuppa.</p>
  - id: 508435
    user_id: 2438
    user_name: gargoyle
    user_path: null
    date_raw: 2 May 2012 — 7:30pm
    date: 2012-05-02T19:30:00
