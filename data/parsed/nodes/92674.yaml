    date: 2012-05-02T09:33:00
    date_raw: 2 May 2012 — 9:33am
    votes: null
    html: |-
      <p>If the font EULA permits it, I would recommend TransType<br>
      <a href="http://www.fontlab.com/font-converter/transtype/" title="http://www.fontlab.com/font-converter/transtype/">http://www.fontlab.com/font-converter/transtype/</a></p>
      <p>You could also try Crossfont:<br>
      <a href="http://www.asy.com/scrcf.htm" title="http://www.asy.com/scrcf.htm">http://www.asy.com/scrcf.htm</a><br>
      (Be aware that you cannot simply copy a Mac OS Classic font to Windows. The resource fork will get lost.)</p>
