    html: "<p>Not to sidetrack the discussion of Thai typefaces, but this is roughly the direction I think I am going with this book as a design project. Although the sample I showed was Garamond or something like it, there are also examples of early English printing that are in the general spirit we want to evoke, and I am tending more in that direction. This is black and white but the actual page will use color: the word SIAM maybe in a burgundy red and the fleurons in a very faint blue perhaps ... or possibly the whole thing will continue to evolve. (\"SIAM\" is a little faint here because it was in color.) I've never used fleurons like this before, and they're a bit in your face; my plan is to tint them back to where they're barely visible. Not sure the best treatment for the rules. I haven't fine-tuned the spacing of the type yet. <br>The page size is 8.75 in. x 12 in. The large outside margin might be used for sideheads. <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/33382.jpg\" alt=\"KoS preliminary half title\"></p>"
