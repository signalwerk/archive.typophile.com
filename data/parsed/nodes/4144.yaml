    html: <p>There is a lot of good information here, and I haven't had time to properly consider it yet because of the press of deadlines. But I am once again amazed at what a rich resource typophile is. Could this exchange have occurred pre-internet? Thanks to all of you. <br> <br>Nathan, your samples are very interesting indeed. What is the title and what are the publication details of the book they are taken from? Do you actually have the book? <br> <br></p>
  - id: 30770
    user_id: 3378
    user_name: chanop
    user_path: null
    date_raw: 7 Apr 2004 — 10:26pm
    date: 2004-04-07T22:26:00
    votes: null
    html: <p>&gt; Would you hazard a guess as to why? <br> <br>Towards a modern look, or a contrasty look, perhaps. <br> <br>&gt; I don't understand. ... <br> <br>"Too big on the body" I don't quite understand the term, but I think it is. Let's say we have a typical Latin face at 1000 emsq design size (Type 1); Caps hight is ~700, x-height ~450, and the length from the highest point to the lowest point (ascender-descender) is within 1000. To match this face with Thai alphabet that has a regular height between Caps and x height, let's assume it to be 550-600. That is fine until we look at some characters like <i>sara o, sara i, sara u, tonal marks,</i> and etc. When we combine the total design size from the top to the bottom, it goes well beyond 1000, quite ofen 1300-1500. <br> <br>Is there any real specification for this issue? Thomas? I have looked into Adobe Type 1 spec book, but found no concrete answer. <br> <br>TrueType Font distributed with Microsoft OS tend to reduce the size of Latin alphabet; the exception probably is Tahoma which is designed for screen reading. Designer of Tahoma squished the upper/lower vowels, tonal marks a little. So everything would fit in the point size. <br> <br>What I meant about Nosari is that, since the minuscule was scaled down less than the caps, so it looks too big. Besides, the stroke weight of Thai alphabets does not quite match the weight of   the Latin ones, especially the bold weight. <br> <br>Let's see how I can post the image.... (still reinstalling panther, just got my pbook back from a service).</p>
  - id: 30771
    user_id: 1250
