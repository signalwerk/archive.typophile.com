    html: <p>One thing to note about the Thai numerals is that their considerable variance in widths makes them unsuitable for tabular settings. <br> <br>When designing a biscript font for Thai and Latin (using an existing Latin design but scaled and weight adjusted to harmonise with the Thai), I redrew the European figures* so that they were bo-height and blend better in Thai text. <br> <br> <br>* I don't like the term 'Arabic figures' because what this really refers to is the Arabic counting system adopted by the Europeans, not the eveolved forms of the European numerals, which are very different from their Arabic counterparts. The Arabs, meanwhile, call their numerals 'Indic figures', acknowledging the origin of their counting system, even though the Arab numerals bear little resemblance to any of the many forms of Indic numerals.</p>
    html_clean: <p>One thing to note about the Thai numerals is that their considerable variance in widths makes them unsuitable for tabular settings. <br> <br>When designing a biscript font for Thai and Latin (using an existing Latin design but scaled and weight adjusted to harmonise with the Thai), I redrew the European figures* so that they were bo-height and blend better in Thai text. <br> <br> <br>* I don't like the term 'Arabic figures' because what this really refers to is the Arabic counting system adopted by the Europeans, not the eveolved forms of the European numerals, which are very different from their Arabic counterparts. The Arabs, meanwhile, call their numerals 'Indic figures', acknowledging the origin of their counting system, even though the Arab numerals bear little resemblance to any of the many forms of Indic numerals.</p>
