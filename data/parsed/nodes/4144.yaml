    html: "<p>&gt; What about Nom script? <br> <br>Yeah, Nom is not Roman, it's Chinese-based. And I guess it's possible there's been a Romanization scheme for it, although Lepsius* came much later than the adoption of Romanized Vietnamese. <br> <br>* BTW, the copies from Lepsius's book that I've made don't cover Thai. But here's the reference in case anybody wants to look it up: \"Standard alphabet for reducing unwritten languages and foreign graphic systems to a uniform orthography in European letters\", C R Lepsius, 1863. <br> <br>&gt; you might look up ... <br> <br>OK, cool. <br> <br>-- <br> <br>John: <br>1) So do you have any letter-frequency data for Thai? <br>2) Check out Nathan's Daasang on ultrafonts.com. (And while you're at it, since I remember you having an ultra-hi-res display, please let me know if you think Mana-16 is usable for extended reading.) <br> <br>hhp <br></p>"
