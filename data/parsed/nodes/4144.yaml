    date_raw: 9 Apr 2004 — 11:37am
    date: 2004-04-09T11:37:00
    votes: null
    html: <p>&gt; Is it offensive to move the second (higher) mark to the left of the first one? <br>&gt; Would it be offensive to shorten the base character when an accent (or two) is added? <br>&gt; So how offensive would it be to simply align the tone marks to the left whenever a (floating) vowel mark is already deployed? <br> <br>Yes, those would probably be a totally new way of writing Thai script ;-) I think it's orinigal, but Thai people probably have some problems reading it. One may think that it is a creative ads. <br> <br>0xDC in iso8859-11 is 0x200B <i>zero width space</i> in the unicode chart; therefore it is not there in Thai specific one. The souce for the corpus came from html, so I guess those page were not using it at all or use a tag <i>wbr</i> instead. I could imagine some white noise in the data set as well.</p>
  - id: 30793
    user_id: 3089
    user_name: xensen
    user_path: null
    date_raw: 9 Apr 2004 — 12:14pm
    date: 2004-04-09T12:14:00
    votes: null
    html: "<p>Hrant, I see better now what you are getting at. I'll see what I can find out (if anything).  <br> <br>Just as a conjecture: could cultural restrictions against inappropriate touching, which can sometimes be rather elaborate, influence the perception of type? <br> <br>Along these lines, it might be interesting to see if there is elsewhere any correspondence between cultural attitudes to personal space and attitudes to spacing of type. <br> <br>My guess is that any such analysis would be difficult or impossible because of the number of factors that come into play, and I can't say that any obvious correlation in Western type jumps out at me. <br> <br>For example, on average northern Europeans might demonstrate a greater ideal personal space than southern Europeans, but economic demands might nonetheless mandate tighter spacing. <br> <br>Still, you would expect ideas about space to affect many kinds of cultural expression (architecture, for example) and consequently to affect typography as well. Somehow I am having trouble seeing this very clearly, however. <br> <br>I suppose analphabetic languages would have a different set of rules. <br> <br></p>"
  - id: 30794
    user_id: 1250
