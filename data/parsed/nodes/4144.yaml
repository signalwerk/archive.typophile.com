    html: <p>&gt;be more OK in a bitmap font  <br> <br>I've been toying around with the vowels &amp; diacritics in the bitmap font I'mn working on now, and my Thai readers say they prefer the standard placement and standard height. <br> <br>Though it seems that mild vertical compression is far preferrable to horizontal shifting. <br> <br>Though this a font meant for text. I'm sure with display work the constraints are totally different.</p>
