    html: "<p>Wow, this is great! Thank you. And looking at the raw data, the corpus looks to be plenty huge. <br> <br>A couple of questions: <br>1) What's that complex character at DC? <br>2) For the floating accents (like in the range D4-DA and elsewhere), how does one predict how much above/below the main letter they will end up being placed? What base letters do they add on to? And can they double/triple up? What I'm trying to figure out is how much height/depth they can add to the vertical span of a Thai line (both typically and in extreme cases). <br> <br>Again: thank you! <br> <br>hhp <br></p>"
