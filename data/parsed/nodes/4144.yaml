    html: <p>&gt;how much they would mind a modified scheme <br> <br>Well, they minded quite a bit reading the sample I gave them with vowels &amp; such shifted about. So much so that I can't see any use for it in text settings. Not the particular approach I used, anyhow. <br> <br>&gt;if clearly shown the advantages of economy  <br> <br>But I think that you can only economize so much. E.g., we could modify Latin letters quite a bit (even more than we have) to make them more 'efficient', but I can't see people going for it. I don't see it being a worthwhile trade-off with legibility/readability. And I don't think that the average reader cares about economy nearly as much as the average typographer/type-designer. <br> <br>&gt;accented caps are shorter <br> <br>Yeah, but typically those characters are infrequent (obviously barring all caps settings). In my experience, accented characters in Thai are much more prevalent, and I can't see that being an acceptable solution (to native readers encountering long amounts of copy). <br> <br>The caveat, however, is that all of what's going on during reading is unconscious, I'm sure. All I have are conversations with Thai readers to form my opinions. I don't have any real (empirical) data to back any of this up. That comes in a few years hopefully.</p>
    html_clean: <p>&gt;how much they would mind a modified scheme <br> <br>Well, they minded quite a bit reading the sample I gave them with vowels &amp; such shifted about. So much so that I can't see any use for it in text settings. Not the particular approach I used, anyhow. <br> <br>&gt;if clearly shown the advantages of economy  <br> <br>But I think that you can only economize so much. E.g., we could modify Latin letters quite a bit (even more than we have) to make them more 'efficient', but I can't see people going for it. I don't see it being a worthwhile trade-off with legibility/readability. And I don't think that the average reader cares about economy nearly as much as the average typographer/type-designer. <br> <br>&gt;accented caps are shorter <br> <br>Yeah, but typically those characters are infrequent (obviously barring all caps settings). In my experience, accented characters in Thai are much more prevalent, and I can't see that being an acceptable solution (to native readers encountering long amounts of copy). <br> <br>The caveat, however, is that all of what's going on during reading is unconscious, I'm sure. All I have are conversations with Thai readers to form my opinions. I don't have any real (empirical) data to back any of this up. That comes in a few years hopefully.</p>
