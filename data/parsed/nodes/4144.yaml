    html: "<p>&gt; the Petrine Civil Type was specifically designed to harmonise Cyrillic <br>&gt; and Latin in this way: i.e. to make the same use of Cartesian space. <br> <br>Even if I agree with your benchmark for \"cognation\"*, there's a problem with this particular statement: when I say \"usage of the Cartesian space\", I mean to include not just the shape and extend of structural elements, but also the frequency of usage of the different sections of the space. This is important because the visual information conveyed by text (and expected by the reader) is totally dependent on how often ascenders and descenders pop up for example - and of course Latin and Cyrillic are very different in this respect**. This is in fact why the problem with a congruent x-height comes up: because Cyrillic uses the ascender and descender space far less, it ends up having a smaller apparent size (same as in Thai, like Chanop pointed out). And in the case of a book in both languages for example, this will cause the Russian setting to look \"less important\" - which is clearly more of a problem than lack of geometric congruence at the mico level (something only designers notice anyway). <br> <br>* Although even in the formal realm (not to mention the practical, \"user\" realm) it does seem problematic. For example, what script pair besides Latin/Cyrillic has cognates?! <br> <br>** Heck, even Latinate languages -like English and Polish- are very different in this respect! <br> <br>-- <br> <br>Chanop, thanks so much for the translation! I'll be looking at it closely tomorrow. <br> <br>The book: If anybody can find a brick-and-mortar source for it, I could try asking my brother to buy a copy or two. <br> <br>hhp <br></p>"
