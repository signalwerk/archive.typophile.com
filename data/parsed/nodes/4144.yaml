    html: |-
      <p>Hrant &amp; John, <br> <br>My friend told me that the data were collected from Thai web pages, mostly news, from a few years back. <br> <br>&gt;1) What's that complex character at DC? <br> <br>That's the work-break (zero-space) character written in Thai, sorry. It's quite important, at least for the moment, in technical implementation for line breaking and justification. Because a sentence in Thai is written without any space, therefore to break a like at an appropriate place, without breaking a word, is difficult -- it still is an active research area. A few people/programs are using external helper who knows about thati words, to insert the word break with H&amp;J engine so that Roman H&amp;J engine can be used straight forwardly. <br> <br>Only tone marks can double up, sometimes we have multiple slots for the same glyph (think Type 1), in order to accomodate the typograpical need i.e. top vowels have two variants: a normal position and a left-shifted position for letters like BB, BD, and BF; tonal marks have four variants, a normal position for combining with the top vowels , a lower position when combined with the normal consonants, and two left-shifted position. </p>
