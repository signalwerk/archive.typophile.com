    html: "<p>Hrant, <br> <br>Here is the short translation <br> <br><i>P.44</i> <br><b>From table of letter relationship to ambiguous pair theory</b> <br> <br>The table of letter relationship use a simple crossword like rule: two adjacent <br>letters (top-bottom-right-left) must have similar shape. <br> <br>Two benefits: <br>1 designing letters in group <br>2 magnifying some ambiguous pairs <br> <br><b>Table of ambiguous pairs</b> <br> <br><i>ambigous pair |  suggestion | note</i> <br> <br>1st row | the dip must be clearly seen | * and * are not amniguous because their heads are at different size <br> <br>2nd row | make the tail intrude into the letter | when *, *, mixed with sara i, the tail might touch sara i; therefore making it difficult to notice the tail. <br> <br>(<i>mai hun-agad</i>) (<i>mai tho</i>) | <i>mai tho'</i>s head must show the diffrence to that of <i>mai h <br>un-agad</i> | At small point, this pair could be ambiguous especially in some unfamiliar specialised words <br> <br>P. 45 <br><b>Table of letter relationship</b> <br> <br>Fiona <i>would you know where I might purchase the book from?</i> <br> <br>I have no idea; I asked my sisters to find some info for me sometime ago, but she could not find a place to by this book. In the front matter, it says that 1 600 copies were printed.</p>"
