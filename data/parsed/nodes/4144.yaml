    html: <p>BTW, since most fonts include a free-standing macron, all you might have to do for that accent is add some big fat negative kerning pairs to the font (once you find the right font :-). And you could just create a free-standing horn and do the same for that - that way you'll only take up one extra encoding slot, or even use unicode (which must have a horn somewhere). <br> <br>hhp <br></p>
