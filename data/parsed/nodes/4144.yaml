    user_path: null
    date_raw: 8 Apr 2004 — 7:13am
    date: 2004-04-08T07:13:00
    votes: null
    html: "<p>OK, so Thai has a \"problem\" with its distribution of vertical information: most of the letters are bo-height, so you have to make that big enough, but many of the letters use up much more vertical space. Sort of like accents in Latin caps (which are normally made to go beyondthe EM bounds), but I guess the super-tall letters in Thai are pretty common? <br> <br>A request: could you possibly find me some linguistic data about Thai? Specifically, I'd love to have a chart showing the relative frequency of each letter in Thai. If you could, that would be very nice! <br> <br>hhp <br></p>"
