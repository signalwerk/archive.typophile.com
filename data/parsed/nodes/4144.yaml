    html: "<p>[More on Cyrillic, I'm afraid, that should be part of another, more general thread on type design across multiple scripts. I'd really like to get back to Thai before Chanop and the others lose interest in this thread: it's not like we get to talk about Thai type design very often.] <br> <br><i>BTW, how do you decide what two scripts are cognates or not?</i> <br> <br>One looks at how they have developed. In the case of Cyrillic and Latin, these are have developed side-by-side since the 18th Century: this is the post-Petrine norm. There is a Latin letter a and a Cyrillic letter a: and in the post=Petrine styles they are the same form, weight and size. The fact is that, for better or for worse, the Petrine Civil Type was specifically designed to harmonise Cyrillic and Latin in this way: i.e. to make the same use of Cartesian space. This is the point at which I enter Cyrillic type design, with 250 years of dominance of this particular style, and with customers who want to pay me to develop useable, readable typefaces that conform to accepted norms for the script. Within this framework, I will make recommendations against prevailing norms <i>if</i> they are demonstrably contrary to the authentic development of the script within that culture. Quite apart from the longevity of the post-Petrine style, though, one has to see that 18th Century innovation in the context of a changing but still specifically Russian culture and its involvement with a larger European culture.</p>"
