  - id: 30805
    user: 1262
    date: 2004-04-09T21:35:00
    date_raw: 9 Apr 2004 — 9:35pm
    votes: null
    html: "<p>Hrant, just to clarify: when I talk about Thai type I am expressing things that I have learned and ideas that I have developed in the process of working on Thai type design with experienced colleagues. I don't claim any great expertise in Thai, but my thoughts are grounded in the practical experience of making a typeface that has been described as 'extremely readable' by a fluent reader and expert in the Thai script. I mention this because, in your enthusiasm, you sometimes seems to assume that other people are beginning from the same level of ignorance or knowledge as you, and proceeding on the same theoretical and imaginatice basis. I think this can be a problem in our discussions, because I'm almost always commenting only from direct experience. <br> <br>Also, your comments regarding the different sensibilities of natives versus learners are not at all in line with my experience in working with a number of scripts. Very often, I find I am much more concerned about the cultural authenticity of a design than native readers are, many of whom have grown up in a period of debasement of their national typography due to technical limitations, influence of outside fashions, or cultural uncertainty, and who may accept as normal things that are actually alien to or at best uncharacteristic of the longer traditions of their script. Unless they are themselves type designers, and working outside of contemporary fashions in graphic design, native readers are unlikely to do much research into such traditions, and so remain ignorant of what might be termed deep authenticity. I am not speaking here specifically about Thai; indeed, apart from some deplorable, latinising fashions in display type, Thai typography is in relatively good shape. But your generalisation regarding learners being unable to discern cultural authenticity does not seem to me to hold true. Cultural authenticity is something that can be apprehended from knowledge of a writing system and its development; natives and learners alike need to learn this, and can. This is not to deny that there are very insensitive non-native type designers making a hash of various scripts (there are also native designers doing the same thing), but they're just not doing a good job; they are, in fact, neither natives nor learners: they are not bothering to learn.</p>"
