    user_name: chanop
    user_path: null
    date_raw: 7 Apr 2004 — 7:27pm
    date: 2004-04-07T19:27:00
    votes: null
    html: "<p>Hrant, <br> <br>It's harder to read in a long text because of familiarity, perhaps. Most texts that I have grown up used a typical Thai face with the circular head. However, there is no problem reading unconventional face on a poster. <br> <br>&gt; Would you say that an unconventional font that's not Latinized is less difficult to read (for a Thai who reads the Latin scipt)? <br> <br>No, perhaps. <br> <br>&gt;\"Home Depot\" still looks too big. The balance seems to be more delicate than just \"between x and cap\" <br> <br>Agree, totally. <br> <br>&gt; Slant/Italics: Why would you say Thai typographers avoid simple mechanical slanting?  <br> <br>I don't think they avoid mechanical slanting; slant fonts are being used everywhere, however, I think bold are often used more frequenly. <br> <br>Norasi came from an Omega-serif project -- a free face that looks like Times Roman. The aim of the project is to support typesetting in many scripts e.g. latin, greek, hindi, hebrew, and etc. <br> <br>Interestingly, Norasi used a scaled down Latin for   its latin counterpart so that the whole font looks more in harmony. Nevertheless, the scaled down caps is ~71% while whe scaled down minuscule is ~77%. To my eyes, minuscule is still too big and too dark.</p>"
  - id: 30768
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 7 Apr 2004 — 7:41pm
    date: 2004-04-07T19:41:00
    votes: null
    html: <p>&gt; bold are often used more frequenly.  <br> <br>Would you hazard a guess as to why? <br> <br>&gt; Norasi used a scaled down Latin for its latin counterpart <br>&gt; so that the whole font looks more in harmony. <br> <br>I don't understand. Do you prehaps mean that the Thai font would look funny (too big on the body, I presume*) if it were made to match an existing Latin font outright? This would be an interesting paralles to my ArmenoLatin type system (Nour&amp;Patria), where I discovered that the Armenian needed to be set about 10% larger to maintain apparent size (IF that's something you want in a given layout). Unfortunately, this makes some people (mostly die-hard Modernists) very uncomfortable - and many of them seem to have a mental block towards understanding why this <i>has</i> to be so. What's even harder is to explain to people why matching apparent size should not be a goal unto itself. <br> <br>* But relative to what? I guess the bulk of existing Thai fonts? <br> <br>hhp <br></p>
