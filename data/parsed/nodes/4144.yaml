    html: "<p>Thom: I thought for a second that the romanization scheme for Thai might be similar to Vietnamese - and that you could use a Vietnamese font for this. But looking through my files, it doesn't appear to be. I'm sure you've already looked into this though.  <br> <br>&gt;But what about their \"distance\" from what people expect to read?  <br> <br>I've got two handpainted signs from a friend's birthday party that I'll have to post scans of Hrant. They're in Thai - you'd love 'em. I can't make any sense of them whatsoever, but apparently Thai readers have no trouble at all. I imagine it's their version of Bickham Script or something. <br> <br>&gt;And a follow-up question: what do you think of the darker weight for emphasis in the body text? I mean instead of italics.  <br> <br>'Italics' only appeared in Thai printing in 1925. That's what the only source I've ever found says anyway. <br> <br>OK, off to hockey finally.</p>"
  - id: 30762
    user: 1250
    date: 2004-04-07T17:57:00
    date_raw: 7 Apr 2004 — 5:57pm
    votes: null
    html: "<p>Wow, the lc \"g\" on that antique map is like a Patpong exotic dancer. <br> <br>Vietnamese: it's not Romanized - that's the away it is!  :-/ <br>The Carmen Miranda of writing systems. <br> <br>Nathan, I'd love to see those scans! But pre-emptively: there's a difference between taking many seconds to read a strange display face versus reading a book. <br> <br>&gt; 'Italics' only appeared in Thai printing in 1925. <br> <br>That's good info. As a separate style, or subordinate to the \"Roman\"? And I wonder why a newspaper that would not mind that hyper-Latinized font <i>would</i> mind using italics. <br> <br>hhp <br></p>"
  - id: 30763
    user: 3378
    date: 2004-04-07T18:00:00
    date_raw: 7 Apr 2004 — 6:00pm
    votes: null
    html: "<p>Hrant, <br> <br>For the font in line 2: <br>I have no problem reading it at all as it is on a head line. A quick glance, from my perpective, reveals that it definitely is Thai. I probably have some problem reading it in a long body text though as I feel that it is harder to read compare with the line 1. <br> <br>For the body text, a number of thai font designers seem to settle down that <i>bo-height</i> (<i>bo</i> is the 10th character on the bottom line) should be somewhere between x-height and caps-height. In many fonts, the harmony between Latin alphabets and Thai alphabets are not there; quite often, latin counterpart has a thicker stroke; sometimes a different design. <br> <br>The bold emphasis is a normal practice, I think. Usually there is no real italic (cursive) in same family but a slant form. To my knowledge, slant/italic shape in Thai came from a western influence. <br> <br>Personally, I like Thai face with the loop. It is easier to read. If you have not seen this, the following two links are a publication that the goverment published a while ago about Thai fonts. They are in Thai though. The interesting bits for you guys probably are those specimen at the end of the book and the free thai font \"Norasi\" which is Yannis Haralambous's design. The files are big (13.5Mb) and the difference between the two is Type 1 and TrueType font. <br> <br><a href=\"http://www.swpark.or.th/upload/download/ThaiNationalFont_PC.zip\" target=\"_blank\">http://www.swpark.or.th/upload/download/ThaiNationalFont_PC.zip</a> <br><a href=\"http://www.swpark.or.th/upload/download/ThaiNationalFont_LINUX.zip\" target=\"_blank\">http://www.swpark.or.th/upload/download/ThaiNationalFont_LINUX.zip</a></p>"
  - id: 30764
    user: 1250
    date: 2004-04-07T18:28:00
    date_raw: 7 Apr 2004 — 6:28pm
    votes: null
    html: "<p>&gt; it is harder to read compare with the line 1.  <br> <br>Why? <br>Is it totally because the structures are unconventional, or partly because your mind is gravitating towards the Latin \"cognates\"? Would you say that an unconventional font that's <i>not</i> Latinized is less difficult to read (for a Thai who reads the Latin scipt)? <br> <br>&gt; bo-height (bo is the 10th character on the bottom line) should <br>&gt; be somewhere between x-height and caps-height. <br> <br>Makes perfect sense. This should apply to Cyrillic for example too, although I've found great resistance to the idea among designers of Cyrillic - which is particularly strange among their subset who also design Hebrew fonts, but for that script they <i>do</i> break the congruence! <br> <br>In my sample however this doesn't seem to be enough: \"Home Depot\" still looks too big. The balance seems to be more delicate than just \"between x and cap\". <br> <br>Slant/Italics: Why would you say Thai typographers avoid simple mechanical slanting? <br> <br>Thanks for the links - I will definitely check them out! <br> <br>hhp <br></p>"
