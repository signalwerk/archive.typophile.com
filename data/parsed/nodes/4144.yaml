    html: "<p><i>For example, I think this is why you advocate breaking the Latin x-height bounds for Hebrew (which has varied conventions in that respect), but not for Cyrillic (because virtually no other type designers do it).</i> <br> <br>You are mischaracterising my reasons for harmonising features of the Cyrillic and Latin scripts. I have explained, at length, that within the specific sub-genres of post-Petrine text types in which I have worked to date, the Latin and Cyrillic scripts are historical and natural cognates. You can reject that style if you want, but the harmonisation with Latin is a feature of that style and has been for 250 years. If I were designing Cyrillic type in a different style, e.g. one of the Old Church Slavonic styles, I would not feel any need to harmonise x-height or any other feature to Latin, even if the font were to contain both scripts. Similarly, I can imagine new Cyrillic styles that would not naturally harmonise with Latin, but I'd rather leave these developments to the Slavs: I am in every sense a 'learner', and don't think it is my position to teach <i>except</i> when my work uncovers authentic but neglected traditions that contemporary practitioners are ignorant of. One might put it this way: you seemingly never met a writing system that you didn't think you couldn't improve; I never met a writing system that I didn't think could improve me. <br> <br>By the way, when designing Hebrew type my choice about whether to align the head to the Latin x-height depends on the intended use of the font. I do prefer to make the Hebrew taller, and am happy that this convention is most common in Biblical scholarship, but when designing bi-scriptal fonts for modern office use in Israel I will align the heights, because this has become the prevailing convention in that setting. <br> <br>Regarding Greek, I think you should ask non-Greek type designers who work with Greek what they think of the current state of Greek type design. I think you will find that most of them are very much aware of the issue of authenticity, and tend to be much more concerned about it than the average Greek graphic designer or typographer, who are the people responsible for the use of inauthentic, latinised types. I recall that your visit to the conference was fleeting, and that you missed much of the most interesting stuff. Were you there for the raucous open forum at the end, when Jean-Fran</p>"
