  - id: 30755
    user: 3378
    date: 2004-04-07T01:24:00
    date_raw: 7 Apr 2004 — 1:24am
    votes: null
    html: "<p>Hrant, <br> <br>I have been peeking around typophile for a long while, basically since I started having an interest in typography (was it typography?) when I was looking/learing how to make my thesis, report, and slide presentation look more interesting. I got bored with Knuth's Computer modern, Times with MathTimes, and Lucida with LucidaNewMaths on a standard TeX system. There are not many choices there for mathematical oriented typography: Adobe just ditched a mac support for FrameMaker; hopefully, InDesign will have a built-in functionality to typeset mathematics and long documents to the level of previous FrameMaker. <br> <br>For the font -- I don't have any training in type design at all -- the first line looks nice; it probably is a bold/black weight of a text face. <br>The eyes of &amp;#3648;, &amp;#3604;, look optically imbalance, not sure why though. <br> <br>In the second line, I have seen this type of   typeface used often in a magazine. Some letters are quite far from the way we write though: &amp;#3619; that looks like s; and &amp;#3600; that looks like &amp;#3592; with a horn. <br> <br>The main text looks pretty normal to me. IIRC, it looks similar to one that Microsoft includes in their OS. <br> <br>I notice some spacing problems here -- un-even spacing; I don't know how to solve it from the font perspective without hacking into the algorithm of the text setting software though. <br> <br>Regards, <br>Chanop</p>"
