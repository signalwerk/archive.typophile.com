    html: "<p>&gt; The placement of both is determined relative to the right-side vertical of the letter. <br> <br>Is it offensive to move the second (higher) mark to the left of the first one, to save vertical space? \"Native\" answers preferred.  :-) Non-natives can certainly have a lot of knowledge about a script (like John clearly does), but it's much harder for them to have an implicit, \"foundational\" sensitivity. So Chanop, if you can answer this question (as well as my previous #4) that would be great. (Anybody else can answer too, of course!) <br> <br>UltraEdit: I actually have it installed, but didn't realize it can do all that! <br> <br>-- <br> <br>Chanop, about the DC character: why is it missing from the Unicode Thai encoding? And why is its count so low in the stats? <br> <br>&gt; a normal position and a left-shifted position <br> <br>So how offensive would it be to simply align the tone marks to the left whenever a (floating) vowel mark is already deployed? <br> <br>-- <br> <br>&gt; since when is it \"traditional\" for letters to actually crash <br>&gt; it is arrogant to apply Western traditions to non-Western languages. <br> <br>But then what about that second line?! I agree with your stance, and that's exactly why I'm confused that a person wouldn't mind hyper-latinized letterforms but would mind hypothetically latinized spacing... <br> <br>Please ask this of Ms Chirapravati if you can. <br> <br>hhp <br></p>"
