    html: "<p>Chanop, yet more requests, if you have the time and inclination: <br>1) I went through that entire 400-page (and enviable!) document on Thai type design, and I was wondering: could you please do a quick translation of pages 44-45 (with the table and the grid)? <br>2) What are the chances that the people who compiled that frequency data can run through the raw data again and find this: the frequency of \"second-level\" usage. I would presume there's a fixed set of pairs of characters (for example D4,E8) which would indicate usage of the \"maximum height\". <br> <br>No pressure though, OK? <br> <br>hhp <br></p>"
