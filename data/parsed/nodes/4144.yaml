    html: "<p>Hrant, <br> <br>Here is the short translation <br> <br><i>P.44</i> <br><b>From table of letter relationship to ambiguous pair theory</b> <br> <br>The table of letter relationship use a simple crossword like rule: two adjacent <br>letters (top-bottom-right-left) must have similar shape. <br> <br>Two benefits: <br>1 designing letters in group <br>2 magnifying some ambiguous pairs <br> <br><b>Table of ambiguous pairs</b> <br> <br><i>ambigous pair |  suggestion | note</i> <br> <br>1st row | the dip must be clearly seen | * and * are not amniguous because their heads are at different size <br> <br>2nd row | make the tail intrude into the letter | when *, *, mixed with sara i, the tail might touch sara i; therefore making it difficult to notice the tail. <br> <br>(<i>mai hun-agad</i>) (<i>mai tho</i>) | <i>mai tho'</i>s head must show the diffrence to that of <i>mai h <br>un-agad</i> | At small point, this pair could be ambiguous especially in some unfamiliar specialised words <br> <br>P. 45 <br><b>Table of letter relationship</b> <br> <br>Fiona <i>would you know where I might purchase the book from?</i> <br> <br>I have no idea; I asked my sisters to find some info for me sometime ago, but she could not find a place to by this book. In the front matter, it says that 1 600 copies were printed.</p>"
  - id: 30816
    user: 1250
    date: 2004-04-10T21:55:00
    date_raw: 10 Apr 2004 — 9:55pm
    votes: null
    html: "<p>&gt; the Petrine Civil Type was specifically designed to harmonise Cyrillic <br>&gt; and Latin in this way: i.e. to make the same use of Cartesian space. <br> <br>Even if I agree with your benchmark for \"cognation\"*, there's a problem with this particular statement: when I say \"usage of the Cartesian space\", I mean to include not just the shape and extend of structural elements, but also the frequency of usage of the different sections of the space. This is important because the visual information conveyed by text (and expected by the reader) is totally dependent on how often ascenders and descenders pop up for example - and of course Latin and Cyrillic are very different in this respect**. This is in fact why the problem with a congruent x-height comes up: because Cyrillic uses the ascender and descender space far less, it ends up having a smaller apparent size (same as in Thai, like Chanop pointed out). And in the case of a book in both languages for example, this will cause the Russian setting to look \"less important\" - which is clearly more of a problem than lack of geometric congruence at the mico level (something only designers notice anyway). <br> <br>* Although even in the formal realm (not to mention the practical, \"user\" realm) it does seem problematic. For example, what script pair besides Latin/Cyrillic has cognates?! <br> <br>** Heck, even Latinate languages -like English and Polish- are very different in this respect! <br> <br>-- <br> <br>Chanop, thanks so much for the translation! I'll be looking at it closely tomorrow. <br> <br>The book: If anybody can find a brick-and-mortar source for it, I could try asking my brother to buy a copy or two. <br> <br>hhp <br></p>"
  - id: 30817
    user: 1262
    date: 2004-04-11T16:11:00
    date_raw: 11 Apr 2004 — 4:11pm
    votes: null
    html: <p><i>For example, what script pair besides Latin/Cyrillic has cognates?!</i> <br> <br>Latin, Greek and Cyrillic uppercase; again, in specific styles. I think it is a mistake to speak of scripts, per se, having cognates (in the sense of glyph cognates); rather, one should recognise that for historic and cultural reasons specific styles of writing and type have such cognates.</p>
