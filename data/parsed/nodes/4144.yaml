    html: "<p>&gt; I don't have any training in type design at all <br> <br>Like anything else, that can be both good and bad. Since there are many more designers than users on Typophile, and since the main point of typography is to accomodate the user, in this case I think that's definitely good!  :-) <br> <br>&gt; In the second line, I have seen this type of typeface used often in a magazine. <br> <br>What's interesting -and maybe shocking- in this case is that this was taken from a daily newspaper. <br> <br>&gt; Some letters are quite far from the way we write <br> <br>But what about their \"distance\" from what people expect to <i>read</i>? <br>1) Are any of the letters highly difficult to decipher? <br>2) Upon a quick initial glance, is there a problem seeing that line as Thai and not English (Latin)? <br> <br>And a follow-up question: what do you think of the darker weight for emphasis in the body text? I mean instead of italics. <br> <br>&gt;  I will see if I can get some feedback <br> <br>Cool. <br> <br>hhp <br></p>"
  - id: 30758
    user_id: 1026
    user_name: matteson
    user_path: null
    date_raw: 7 Apr 2004 — 4:17pm
    date: 2004-04-07T16:17:00
    votes: null
    html: "<p>Oi vey. I was just on my way out to catch the first NHL play-off match. And here I am instead.  <br> <br>AFAIK, the Thai romanization scheme is used extensively in foreign language instruction and the like - but not used at all 'in country'. By Thai that is.  <br> <br>&gt;What do you think about the fonts in this sample?  <br> <br>[disclaimer: these comments are distilled through my Thai friends. I only wish they were wholly mine.] <br> <br>Line 1: standard newspaper headline that wants the reader to think it's more important than it is. Because of both the weight off the letters and the heads (loops). I.e. it's 'classical' Thai. Much like I make fun of faces like Trajan, my Thai friends make fun of things like this. <br> <br>Line 2: standard advertising, preferable to some readers than Line 2. Too romanized (e.g., 5th consonant, <i>ro rua</i>, is too much like an 's'.). A lot of Thai I know think the heads make reading harder and prefer faces as in Line 2. Even for running copy at small sizes. <br> <br>Lines 3-4: The Latin is too heavy. Arabic numerals are too heavy and too tall. I wouldn't be surpised if that was Browallia (an MS font as Chanop says). I'm no expert, but I think that the left sidebearing on <i>sara e</i> is too tight (7th 'base' glyph in the first word on the second line; 4th glyph in the last word). While it might look like the left bearings on <i>sara o</i> and <i>sar ai</i> are too big, that's what I usually see. And what usually seems to be accepted. <br> <br>Although, as I mentioned, all the head (loops) that make a face 'look Thai', they seem to hinder efficient reading. It's something I'm stuggling with as I'm working now. To be headed or not be headed.  <br> <br>Sorry for the bad pun.</p>"
