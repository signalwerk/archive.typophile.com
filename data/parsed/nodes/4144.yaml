  - id: 30832
    user: 3221
    date: 2004-04-14T11:08:00
    date_raw: 14 Apr 2004 — 11:08am
    votes: null
    html: "<p><i> <br>Hrant: <br>I've only carefully perused two Thai documents, but one of them (the type design manual thing) uses the native numerals more than the Arabic.</i> <br> <br>But not for page numbers or for listing point sizes <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><i>The other (the newspaper), seems to avoid them completely.</i>   <br> <br>Yes, the fonts I was working on were primarily for newspapers and their sister publications, hence the almost total preference for Arabic numerals. However, we always designed and included Thai numerals for each font and weight. <br>(I understand that the numerals are akin to those used in the Cambodian script.)  <br>I wonder if anyone has information about the reason for the alternative versions of the numeral 9.  <br> <br>Fiona</p>"
  - id: 30833
    user: 1262
    date: 2004-04-14T17:56:00
    date_raw: 14 Apr 2004 — 5:56pm
    votes: null
    html: <p>One thing to note about the Thai numerals is that their considerable variance in widths makes them unsuitable for tabular settings. <br> <br>When designing a biscript font for Thai and Latin (using an existing Latin design but scaled and weight adjusted to harmonise with the Thai), I redrew the European figures* so that they were bo-height and blend better in Thai text. <br> <br> <br>* I don't like the term 'Arabic figures' because what this really refers to is the Arabic counting system adopted by the Europeans, not the eveolved forms of the European numerals, which are very different from their Arabic counterparts. The Arabs, meanwhile, call their numerals 'Indic figures', acknowledging the origin of their counting system, even though the Arab numerals bear little resemblance to any of the many forms of Indic numerals.</p>
  - id: 30834
    user: 1026
    date: 2004-04-14T18:07:00
    date_raw: 14 Apr 2004 — 6:07pm
    votes: null
    html: <p>&gt;unsuitable for tabular settings. <br> <br>John, you might be interested in page 14 of the PDF Chanop posted. I'm not saying the numerals on theat page are the most beautiful - but I don't think tabular European figures are generally the prettiest either. <br> <br>&gt;don't like the term 'Arabic figures'  <br> <br>Point taken.</p>
  - id: 30835
    user: 1262
    date: 2004-04-14T18:12:00
    date_raw: 14 Apr 2004 — 6:12pm
    votes: null
    html: "<p><i>(I understand that the numerals are akin to those used in the Cambodian script.)</i> <br> <br>This is also my understanding. David Smyth writes, in <i>Thai: an essential grammar,</i> 'Thai script numerals are identical to those found in the Cambodian script, while the Lao script employs some but not all of the same number symbols.' <br> <br>The Cambodian numerals were apparently adopted 'as is' from the Khmer (Cambodian) script. What I find interesting is that the Khmer numerals 7 and 8 are clearly the basis for the Thai tone mark <i>mai tri</i> and the vowel <i>mai taikhu</i>. I'd be interested to know why these forms were chosen for these marks.</p>"
  - id: 30836
    user: 1262
