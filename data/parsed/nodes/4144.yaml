thin the context of type design (like making the Cyrillic \"x-height\" bigger than the Latin). <br> <br>Regarding Greek: yes, you have a point. But overall it's pretty obvious that non-natives generally care less than natives. This is common sense. <br> <br>Thomas, you probably weren't asking me, but: I find that the Paratype Cyrillics are the same as most any other Cyrillics: way too harmonized on the superficial level, but as a result discordant on the true functional level - the bane of Modernism in fact. Anybody with an understanding of the difference between display and text type (as well as an ability to be objective) can see this clearly. <br> <br>hhp <br></p>"
