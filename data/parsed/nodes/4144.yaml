  - id: 30747
    user: 1250
    date: 2004-04-06T10:18:00
    date_raw: 6 Apr 2004 — 10:18am
    votes: null
    html: "<p>I've never encountered a romanization scheme for Thai (although it makes sense there is one). Do you have a link to it? <br> <br>The sample setting you show is actually more Garamond than RdR, so if you want to match that, something as mundane as an Adobe font might do the trick for you. I would however recommend going the RdR route, if only to give the project a nice archaic look. <br> <br>What are some digital RdR-style fonts? <br>If you don't find a good one, can the project afford a commission for such a design? <br> <br>The diacritics: well, the reverse-cedilla thing could be approximated with an ogonek (the Polish mark), which is available in many fonts (although with greatly varying quality), especially these days. As for the \"horn\" (which reminds me nicely of the Thai ngao), maybe take the visually comparable mark from Vietnamese? This will be harder to find, especially in an appropriate font, so you might have to graft one on yourself. <br> <br>hhp <br></p>"
  - id: 30748
    user: 909
    date: 2004-04-06T10:28:00
    date_raw: 6 Apr 2004 — 10:28am
    votes: null
    html: <p>Thai has its own script (closely related to Lao &amp; Burmese), which is not written with Latin characters. Modern Thai fonts are quite unrelated to this accented Latin stuff. <br> <br>The "backwards cedilla" is an ogonek, byt the way. The little thing sprouting off the u is a horn. Offhand, I don't know of any typefaces that would include these sorts of characters with the macrons as well, as precomposed characters. <br> <br>I could get into the technical stuff in more depth, but the short version is that if you want to use a font in more places than Word 2003 for Windows, you'll probably need specially encoded fonts (non-Unicode). I don't know that such fonts with the characters you want already exist, but I can't swear that they don't, either. <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
  - id: 30749
    user: 3089
    date: 2004-04-06T11:08:00
    date_raw: 6 Apr 2004 — 11:08am
    votes: null
    html: "<p>Thanks for teaching me the word <i>ogonek.</i> I will be sure to use it soon! <br> <br>Of course Thai has its own script but it also has a romanization system, which uses the special marks I described among others. We mainly need these to render titles in the bibliography, where I guess they are critical. We are using the system approved by the Library of Congress and the American Library Association and published in a document imaginatively titled ALA-LC Romanization Tables. Following up on Hrant's suggestion I looked on-line for this and found it here: <a href=\"http://lcweb.loc.gov/catdir/cpso/romanization/thai.pdf\" target=\"_blank\">http://lcweb.loc.gov/catdir/cpso/romanization/thai.pdf</a>. <br> <br>I agree about the sample. I considered Adobe Garamond and may still go with it, since we already own that font, but was afraid it wouldn't read as having the archaic quality that is being looked for. Also, this is only one of several model texts, and others are more RdR or Dutch in flavor than this one is. <br> <br>Wouldn't it be wonderful if we could afford to commission a special face! I doubt that would be within our budget, however (not having any real idea what it would cost). <br> <br>Thanks for your help.</p>"
  - id: 30750
    user: 1250
    date: 2004-04-06T11:38:00
    date_raw: 6 Apr 2004 — 11:38am
    votes: null
    html: <p>Commissioning a whole new face (even one based on a metal source) is indeed expensive - at the very least $2000 (for one weight). So try to find an existing digital face that has the right flavor, and just commission somebody to add the Thai stuff - or do that yourself! <br> <br>BTW, it would be interesting to compare the LoC romanization to that of Lepsius (a scholar who once devised an entire <i>standardized system</i> of romanization usable for any script). <br> <br>hhp <br></p>
  - id: 30751
