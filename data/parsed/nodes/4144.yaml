    html: <p>&gt;be more OK in a bitmap font  <br> <br>I've been toying around with the vowels &amp; diacritics in the bitmap font I'mn working on now, and my Thai readers say they prefer the standard placement and standard height. <br> <br>Though it seems that mild vertical compression is far preferrable to horizontal shifting. <br> <br>Though this a font meant for text. I'm sure with display work the constraints are totally different.</p>
  - id: 30797
    user: 1250
    date: 2004-04-09T13:59:00
    date_raw: 9 Apr 2004 — 1:59pm
    votes: null
    html: "<p>I'm sure they <i>prefer</i> the conventional scheme, the question is how much they would mind a modified scheme. Would they mind it enough to not use your font? And I think they would mind it less if clearly shown the advantages of economy (via lesser leading). <br> <br>&gt; mild vertical compression is far preferrable to horizontal shifting. <br> <br>I agree. Ideally I'd like to do both though.  :-) <br> <br>BTW, making the base characters shorter when accented actually has a precedent in Latin: in some fonts accented caps are shorter. It's not common, but I think actual users mind it a lot less than other designers! Especially in a script such as Thai where the alignment zones aren't so strict, I think a laymen would have to have the discrepancy pointed out to him to notice it, and even then the typical response would be: \"Huh.\" <br> <br>Chanop, what do you think? <br> <br>hhp <br></p>"
  - id: 30798
    user: 1026
    date: 2004-04-09T14:20:00
    date_raw: 9 Apr 2004 — 2:20pm
    votes: null
    html: <p>&gt;how much they would mind a modified scheme <br> <br>Well, they minded quite a bit reading the sample I gave them with vowels &amp; such shifted about. So much so that I can't see any use for it in text settings. Not the particular approach I used, anyhow. <br> <br>&gt;if clearly shown the advantages of economy  <br> <br>But I think that you can only economize so much. E.g., we could modify Latin letters quite a bit (even more than we have) to make them more 'efficient', but I can't see people going for it. I don't see it being a worthwhile trade-off with legibility/readability. And I don't think that the average reader cares about economy nearly as much as the average typographer/type-designer. <br> <br>&gt;accented caps are shorter <br> <br>Yeah, but typically those characters are infrequent (obviously barring all caps settings). In my experience, accented characters in Thai are much more prevalent, and I can't see that being an acceptable solution (to native readers encountering long amounts of copy). <br> <br>The caveat, however, is that all of what's going on during reading is unconscious, I'm sure. All I have are conversations with Thai readers to form my opinions. I don't have any real (empirical) data to back any of this up. That comes in a few years hopefully.</p>
