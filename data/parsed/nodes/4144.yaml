    date: 2004-04-06T11:38:00
    votes: null
    html: <p>Commissioning a whole new face (even one based on a metal source) is indeed expensive - at the very least $2000 (for one weight). So try to find an existing digital face that has the right flavor, and just commission somebody to add the Thai stuff - or do that yourself! <br> <br>BTW, it would be interesting to compare the LoC romanization to that of Lepsius (a scholar who once devised an entire <i>standardized system</i> of romanization usable for any script). <br> <br>hhp <br></p>
