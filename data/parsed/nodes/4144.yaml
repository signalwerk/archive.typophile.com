    date_raw: 8 Apr 2004 — 11:16am
    votes: null
    html: "<p>&gt;Wow, the lc \"g\" on that antique map is like a Patpong exotic dancer.  <br> <br>I thought you might dig that 'g' ;-) <br> <br>&gt;Vietnamese: it's not Romanized - that's the away it is! :-/  <br> <br>What about Nom script? I've been under the impression that Vietnamese had it's own ideographic writing system up until colonization and, consequently, romanization. <br> <br>&gt;Nathan, I'd love to see those scans! But pre-emptively: there's a difference between taking many seconds to read a strange display face versus reading a book.  <br> <br>True enough. I'm still amazed at how divergent the letterforms can be.  <br> <br>&gt;could you possibly find me some linguistic data about Thai? <br> <br>Hrant, you might look up Doug Cooper at CRCL in Thailand. Also, the University of Wiscosin at Madison has a pretty good Southeast Asian studies department. I don't know anyone there, but they might be helpful. <br> <br>&gt;[italics] As a separate style, or subordinate to the \"Roman\"?  <br> <br>Off the top off my head, I'd say a separate style. I.e., not subordinated to 'roman' in running copy.  <br> <br>&gt;What is the title and what are the publication details of the book they are taken from? Do you actually have the book?  <br> <br>Unfortunately, I just have the one leaf. I've been half-heartedly trying to find some details about it, but so far without success. If I run into anything, I'll definitely let you know. <br> <br>It might be interesting to you that the first book printed with the Thai script was in 1828. About 60 years after the end of the Ayutthaya period. Before that every book used the romanization scheme you've got. Although these days when Thai is transliterated, it typically doesn't use the macrons, horns, and such. That said, I think it'd be pretty hard to do 'period-correct' typography without building a new face with the requisite accented characters.  <br> <br>&gt;TrueType Font distributed with Microsoft OS  <br> <br>You know, the Thai fonts distributed with Windows have actually gone through one huge change. Originally, Angsana (Times New Roman) was Angsana UPC. These fonts were made by Unity Progress, a Thai company, and I believe optimized for Thai - at 14 points the Latin was way to small. So now Angsana is Angsana New. As are all the Thai fonts in the OS. Although, perhaps the UPC versions are still used in Thailand.</p>"
  - id: 30773
    user: 1262
    date: 2004-04-08T11:33:00
    date_raw: 8 Apr 2004 — 11:33am
    votes: null
    html: "<p>Great thread. Sorry I found it so late. Chanop asked: <br> <br><i>Is trere any other Thai romanisation standard around?</i> <br> <br>There is also an ISO standard for Thai romanisation, ISO/FDIS 11940, but I have not examined it because ISO want me to pay 79 Swiss francs for the privilege. <br> <br>Regarding combining Latin and Thai in a single font, it is necessary to reduce the size of the Latin considerably if you want to balance it to the Thai and still allow adequate vertical space for the latter in the body height. Quite apart from the tall Thai glyphs, including three frequently occuring tall vowels, there are vowel and tone mark stacks to be accounted for, although the taller of these can reasonably extend beyond the body height. When working on a new Thai design, Fiona Ross, Tim Holloway and I examined a number of bilingual publications to get a sense of the conventional relative height and weight proportions of Latin and Thai when used together, and to see what works best. Sorry I can't show the result yet; suffice to say that I can confirm Chanop's observation that 'bo-height ... should be somewhere between x-height and caps-height'. <br> <br>I had no idea Nathan was into Thai type. Cool.</p>"
  - id: 30774
