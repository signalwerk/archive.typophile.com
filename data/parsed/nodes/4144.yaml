you will find that most of them are very much aware of the issue of authenticity, and tend to be much more concerned about it than the average Greek graphic designer or typographer, who are the people responsible for the use of inauthentic, latinised types. I recall that your visit to the conference was fleeting, and that you missed much of the most interesting stuff. Were you there for the raucous open forum at the end, when Jean-Fran</p>"
