    date: 2004-04-09T08:40:00
    votes: null
    html: <p>&gt;So loose spacing is a cultural convention but traditional letter structures is not? <br> <br>I am an advocate of tight letterspacing (for but most typefaces, as long as the word space is also tight,) but since when is it "traditional" for letters to actually crash, as some of the characters in these samples seem to do? <br> <br>Moreover, as far as "tradition" goes, it is arrogant to apply Western traditions to non-Western languages. Traditionally, East Asian characters, for example, have very well defined spaces, far greater than in Western traditions. (Of course I realize there are "grass" styles that are roughly the equivalent of cursive scripts in Western writing.) <br> <br>I am not expert on Thai language or culture, and so I must defer to those who are.</p>
