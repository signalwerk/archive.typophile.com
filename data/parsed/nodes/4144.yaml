    date: 2004-04-09T01:59:00
    votes: null
    html: <p>1. In Thai, letter can have a combination of a vowel mark and a tone mark. <br>2. Not for Thai, but I'm not sure if there might also be other, minority languages that use the script, and which might have different orthographic norms. <br>3. The placement of both is determined relative to the right-side vertical of the letter. However, in practical terms e.g. in OpenType GPOS positioning, the upper mark in a stack is positioned relative to the lower mark (&lt;mkmk&gt; feature), which in turn is positioned relative to the letter (&lt;mark&gt; feature). <br>4. Yes.</p>
