    html: "<p>&gt; I've yet to find an appropriately large and varied corpus <br> <br>In terms of word frequency a large corpus is important, but in terms of letter frequency a surprisingly small corpus will generally be very accurate. BTW, what do you use for \"processing\" the textual data? <br> <br>Mana-16: I wonder if your gamma is unusually high. Anyway, Mana-13 will be coming out any day now, and it's more \"conservative\" (mostly because the stems are 1-pixel). As for ClearType, if you like it, then just wait for <i>handmade</i> ClearType fonts!  :-) <br> <br>hhp <br></p>"
