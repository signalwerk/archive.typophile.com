  html: <p>The Asian Art Museum in San Francisco is publishing a major catalogue of classic Thai art from the former kingdom of Ayutthaya, to be called The Kingdom of Siam. The desire is for the catalogue to reflect the style of earlier Western writings from around 1700 (in other words, around the time of the Romain du roi and early Franco-Dutch typography). A sample page of one of the models is provided. <br> <br>The typeface must also accommodate Thai diacritics, which have a couple of peculiarities, notably a backwards cedilla that has to combine with a macron, and a breve-like finishing stroke to some of the glyphs, which also must combine with a macron. I will upload funky approximations of these from a poor-quality source. <br> <br>I'm prepared to create the special characters if I have to, but I would prefer to find an existing typeface that meets the project needs. To further complicate things, all of my work is postscript but some people need to work with the diacritics on non-postscript Windows machines. Maybe open type is a way around this? <br> <br>Any suggestions much appreciated.</p>
