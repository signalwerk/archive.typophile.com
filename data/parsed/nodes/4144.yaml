    date: 2004-04-09T12:29:00
    votes: null
    html: <p>&gt; could cultural restrictions against inappropriate touching, which can <br>&gt; sometimes be rather elaborate, influence the perception of type? <br> <br>I think so, yes. <br>On the other hand, Arabic is the language of Islam!  :-) <br> <br>I think a greater cultural factor in touching or not is a culture's tendencies towards control, or Modernism. Westerners for example tend to like compartmentalized things which are easier to analyse, so they invented Greek writing with no ligatures. <br> <br>hhp <br></p>
