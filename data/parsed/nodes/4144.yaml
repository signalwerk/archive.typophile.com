    html: <p>Regarding Thai numerals, Fiona reports that in many years of developing Thai fonts, including trips to Thailand, she hardly ever saw the Thai numerals being used.</p>
  - id: 30828
    user: 1250
    date: 2004-04-14T09:54:00
    date_raw: 14 Apr 2004 — 9:54am
    votes: null
    html: "<p>Another Thai transcription scheme, at the top of: <br><a href=\"http://ourworld.compuserve.com/homepages/profirst/h.htm#top\" target=\"_blank\">http://ourworld.compuserve.com/homepages/profirst/h.htm#top</a> <br> <br>John, I've only carefully perused two Thai documents, but one of them (the type design manual thing) uses the native numerals more than the Arabic. The other (the newspaper), seems to avoid them completely. BTW, one great thing about the native numerals is that they don't lunge out at you like the Arabics (totally ruining the texture), but they still stand out a bit, aiding reading: even to a non-reader like me, their gentle perturbance of the texture is noticeable. <br> <br>hhp <br></p>"
