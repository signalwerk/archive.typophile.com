    html: "<p>&gt; the Latin and Cyrillic scripts are historical and natural cognates. <br> <br>I still don't get: <br>1) Why structural cognates can't simply be of different sizes. <br>2) How you can believe that a <i>user</i> benefits from such formalisms, which certainly comes at the expense of <i>true</i> visual harmony: mere geometric congruence between two scripts typically leads to discord in fact. This is obvious when you consider that different scripts use the Cartesian space differently. <br> <br>BTW, how do you decide what two scripts are cognates or not? <br> <br>&gt; when designing bi-scriptal fonts for modern office use in Israel I will align the <br>&gt; heights, because this has become the prevailing convention in that setting. <br> <br>But you will be reducing de facto functionality by doing so. <br>This is what I mean when I say conventions shouldn't be given too much weight. <br> <br>&gt; I am in every sense a 'learner', and don't think it is my position to teach <br> <br>Besides the exception you note, I can think of two ways where you should try to be a teacher: <br>1) By having the privilege of seeing writing systems <i>as a whole</i> perform in their own ways, you can gain insight into how each can individually be improved. <br>2) Don't underestimate the advantages of being an \"outsider\". Natives have some (probably most) of the advantage, but non-native can indeed be of benefit in providing a external, more objective view. When you're too close to something, you can't see it very clearly. <br> <br>&gt; you seemingly never met a writing system that you didn't think you couldn't <br>&gt; improve; I never met a writing system that I didn't think could improve me.  <br> <br>You have also described me with your second sentence - certainly the two are not exclusive. Furthermore there are two aspects to what I'm saying, and you shouldn't bundle them: one is indeed script reform (like moving Thai accents around), while the other is clearly within the context of type design (like making the Cyrillic \"x-height\" bigger than the Latin). <br> <br>Regarding Greek: yes, you have a point. But overall it's pretty obvious that non-natives generally care less than natives. This is common sense. <br> <br>Thomas, you probably weren't asking me, but: I find that the Paratype Cyrillics are the same as most any other Cyrillics: way too harmonized on the superficial level, but as a result discordant on the true functional level - the bane of Modernism in fact. Anybody with an understanding of the difference between display and text type (as well as an ability to be objective) can see this clearly. <br> <br>hhp <br></p>"
