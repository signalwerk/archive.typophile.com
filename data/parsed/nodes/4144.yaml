    html: "<p>OK, looking a little bit closer, I can see that accents can double-up. Questions: <br>1) Which accents can double-up? <br>2) Can they <i>triple</i> up? <br>3) When accents double-up, are there rules of relative placement? <br>4) Would it be offensive to shorten the base character when an accent (or two) is added? <br> <br>hhp <br></p>"
