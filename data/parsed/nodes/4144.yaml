    date_raw: 14 Apr 2004 — 6:17pm
    votes: null
    html: <p><i>John, you might be interested in page 14 of the PDF Chanop posted. I'm not saying the numerals on theat page are the most beautiful...</i> <br> <br>They're actually very impressive. Having had a heck of a time making nice proportional Thai numerals, I have a lot of respect for the person who made these tabular forms.</p>
  - id: 30837
    user: 1250
    date: 2004-04-14T19:12:00
    date_raw: 14 Apr 2004 — 7:12pm
    votes: null
    html: "<p>&gt; unsuitable for tabular settings. <br> <br>Really? Yes, they seem to require some gentle distortion to make fixed-width, but on the flip side there's no member that's totally hopeless: think of the Arabic* one. The worst of the Thai numerals (in terms of making fixed-width) seem to be on the order of the Arabic \"4\" and \"7\". <br> <br>* I'd have to think about the issue of there being enough of a problem with \"Arabic\" to justify a break with convention. BTW, the European Arabic numerals look different than the contemporary Arab numerals because the Arabs stopped using the ones they passed along to Europe in favor of a set from India. <br> <br>hhp <br></p>"
  - id: 30838
    user: 1250
    date: 2004-04-14T20:08:00
    date_raw: 14 Apr 2004 — 8:08pm
    votes: null
    html: "<p>BTW, there doesn't seem to be a lot of handy info about the numeral \"evolution\", but I have found this: \"The History of Numerals\" by Henri Friedlaender, in Herbert Spencer's \"Typographica\" magazine, New Series, issue #1, June of 1960. It includes some very interesting samples of incunabula numerals. <br> <br>hhp <br></p>"
