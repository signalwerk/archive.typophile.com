    date: 2004-04-10T10:08:00
    date_raw: 10 Apr 2004 — 10:08am
    votes: null
    html: <p>John, of course I don't assume everybody knows as little as I do about Thai! But I do believe that different approaches and requirements allow for different types of "solutions". You generally make highly-usable fonts that "distill" conventional ideas into a highly polished -and not unoriginal- whole. That's very useful, no doubt about it. But then there's a parallel need to always doubt existing practice, to revert to the true nature of functionality and try to rebuild/redirect a script. Of course tradition is part of that functionality, but the lines you cross will depend very much on your <i>intentions</i>. For example, I think this is why you advocate breaking the Latin x-height bounds for Hebrew (which has varied conventions in that respect), but not for Cyrillic (because virtually no other type designers do it). Following the expectations of other type designers (and really not much anybody else, as far as I'm concerned) helps ensure greater adoption of your designs. If you made a Cyrillic font with an "x-height" greater than the one in the/a corresponding Latin font (clearly a much better solution for the Cyrillic <i>user</i>), the General would not be pleased, and the Bee would give you no honey!  :-) But I do hope that soon will find yourself in a position to innovate more. Admittedly (assuming one has the patience) first establishing a reputation for solid conventional design might help more people eventually accept one's innovations, but many designers do seem to get stuck in a rut, never leaving the comfy (and materially more rewarding) practice of simply giving people what they're used to. I really really wish Slimbach for example would start leveraging his commanding position to <i>push</i> at least just a little bit, already. <br> <br>As for your point about the types of sensibilities of different groups, I think you have to note how exceptional you are! Certainly, proportionally more non-native than native type designers have insufficient respect for a given script. I remember asking a few attendees of the Greek conference in 2002 what they thought of the current state of Greek type, and virtually all them disliked it as being inauthentic. Also, when you say that the average layman doesn't do any "research", you're right, but he doesn't need to! The point is that his sensibilities are built implicitly over time; he doesn't need to know <i>why</i> that second line in my sample is problematic to simply <i>feel</i> that it is. This is the difference between pleasing other designers versus the -more important- users. <br> <br>hhp <br></p>
