    html: "<p>Chanop: <i>Only tone marks can double up, sometimes we have multiple slots for the same glyph (think Type 1), in order to accomodate the typograpical need i.e. top vowels have two variants: a normal position and a left-shifted position for letters like BB, BD, and BF; tonal marks have four variants, a normal position for combining with the top vowels , a lower position when combined with the normal consonants, and two left-shifted position.</i> <br> <br>Tone marks used in stacks are traditionally made slightly smaller than those used directly above a letter. This both saves vertical space and ensures that the whole combination does not become top heavy. <br><img src=\"http://www.typophile.com/forums/messages/4100/33069.gif\" alt=\"Sukothai stacking tone marks\"> <br>Even when using something like the OpenType GPOS &lt;mkmk&gt; feature to build stacks, rather than having multiple non-spacing characters at different heights, a well made font will include these small tone mark variants that will be contextually substituted when preceded by a vowel mark. <br> <br> <br>Hrant: <i>Is it offensive to move the second (higher) mark to the left of the first one, to save vertical space?</i> <br> <br>Questioning whether such a thing is offensive only addresses its acceptability to native readers, whose acceptance or rejection <i>may</i> be conventional. More interesting is to ask whether such an innovation is actually useful, and whether it makes sense within the structure of the writing system. <br> <br>The answer to the question 'Is it actually useful?' has to be no. Apart from a small number of what may be termed double-width letters, e.g. <i>tho phuthao</i> and <i>no nen</i>, the Thai letters are not wide enough for diagonal left+down shifting of a stacked tone mark to reduce the total height: there simply isn't enough space in which to lower the mark. If you look at the first two pairs of letters in the example above, which are typical of the majority of Thai letters, it is clear that the vowel mark occupies most of the width of the letter. Even if one were to shift and lower the stacked tone mark on the wider letters, the total height required for stacked marks is necessarily determined by the narrowest base letter. <br> <br>I also think your suggestion does not make sense within the organisational structure of the Thai writing system. If you look through the Font Book PDF that Chanop provided, you'll see that a lot of consideration is given to correct horizontal alignment of marks to letters (see pages 61-79). There is very clearly a correct way to position marks, which is relative to the right-side vertical stroke of the base letter. <br> <br>The most common element in Thai text is a vertically organised grapheme consisting of a letter, a letter + vowel, a letter + tone, or letter + vowel + tone (some letters may also take modifier subscript marks). Because the 'sub-atomic' elements of the grapheme are arranged vertically, the verticality of the grapheme becomes an important structural concern. The verticality of the grapheme is established by the right-side vertical stroke of the letters, which is a feature common to all Thai letters: there are some letters that have no left-side vertical, e.g. <i>ngo ngu</i> and <i>wo waen</i>, but there are no letters that do not have a definite vertical stroke on the right side, even if some of these strokes do not ascend to the 'bo-height', e.g. <i>ro rua</i>, and in some letters elements, such as loops or flourishes, may extend horizontally beyond the right-side vertical, e.g. the loop in <i>no nen</i> in some styles and the tail of the ring in <i>so rusi.</i> <br> <br>In order to maintain the verticality of the grapheme, marks above and below the base letter are aligned relative to the right-side vertical stroke. The only time they are shifted to the left is for the tall letters, e.g. <i>fo fa</i>, in which the right-side vertical itself rises above the bo-height. It is worth noting that when a tall vowel such as <i>sara o</i> follows a letter with a mark or mark stack above, it is the tall vowel that is letter-spaced (positive kerned) to avoid a collision with the mark(s): the marks are not shifted to the left to avoid the collision, because this would disrupt the verticality of the grapheme. <br> <br>One might ask, why is the verticality of graphemes important? Why is it a strictly maintained aspect of the Thai script? I suspect it is a response to the Thai orthography and, in particular, to the length of visually unbroken strings of words making up phrases. Apart from light kerning to reduce white space caused by some combinations of letters, e.g. <i>no nen</i> followed by &lt;/i&gt;cho chan&lt;/i&gt; in styles where the lower right loop on the first letter extends beyond the right-side vertical, well-typeset Thai text consists of discreet, vertically arranged graphemic units that do not interact horizontally with their neighbours. This makes a lot of sense in terms of clarity when one looks at the long strings of such graphemes between phrase breaks. The verticality of the graphemes is an aid to breaking these long phrases into words, by preventing horizontal interaction across what may be word boundaries. <br> <br><i>...about the DC character: why is it missing from the Unicode Thai encoding?</i> <br> <br>The zero-width space is not specific to Thai, so Unicode encodes only one, U+200B, which is used by various scripts and mapped to the appropriate decimal codepoint in 8-bit codepages.</p>"
