    html: "<p>I'm sure they <i>prefer</i> the conventional scheme, the question is how much they would mind a modified scheme. Would they mind it enough to not use your font? And I think they would mind it less if clearly shown the advantages of economy (via lesser leading). <br> <br>&gt; mild vertical compression is far preferrable to horizontal shifting. <br> <br>I agree. Ideally I'd like to do both though.  :-) <br> <br>BTW, making the base characters shorter when accented actually has a precedent in Latin: in some fonts accented caps are shorter. It's not common, but I think actual users mind it a lot less than other designers! Especially in a script such as Thai where the alignment zones aren't so strict, I think a laymen would have to have the discrepancy pointed out to him to notice it, and even then the typical response would be: \"Huh.\" <br> <br>Chanop, what do you think? <br> <br>hhp <br></p>"
    html_clean: "<p>I'm sure they <i>prefer</i> the conventional scheme, the question is how much they would mind a modified scheme. Would they mind it enough to not use your font? And I think they would mind it less if clearly shown the advantages of economy (via lesser leading). <br> <br>&gt; mild vertical compression is far preferrable to horizontal shifting. <br> <br>I agree. Ideally I'd like to do both though.  :-) <br> <br>BTW, making the base characters shorter when accented actually has a precedent in Latin: in some fonts accented caps are shorter. It's not common, but I think actual users mind it a lot less than other designers! Especially in a script such as Thai where the alignment zones aren't so strict, I think a laymen would have to have the discrepancy pointed out to him to notice it, and even then the typical response would be: \"Huh.\" <br> <br>Chanop, what do you think? <br> <br>hhp <br></p>"
