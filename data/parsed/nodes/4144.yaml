    user_name: John Hudson
    user_path: null
    date_raw: 8 Apr 2004 — 11:55am
    date: 2004-04-08T11:55:00
    votes: null
    html: "<p>Sorry, Hrant I don't have letter-frequency data for Thai. I've yet to find an appropriately large and varied corpus of Unicode encoded Thai text, although the <a href=\"http://www.bbc.co.uk/thai/index.shtml\">BBC</a> archive would probably be a good start. <br> <br> <br>[Re. Mana-16, I find the variable contrast disturbing: the r is very dark compared to many of the letters with curves, such as g; the left side of the h is darker than the right side. I think I'll stick with my ClearType thanks <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> ]</p>"
