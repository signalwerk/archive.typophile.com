  html: <p><a href="http://www.t26.com/fonts" rel="nofollow">T-26</a> is sort of a hybrid of a digital type foundry and font distributor started by <a href="/wiki/Carlos%20Segura" class="freelinking" rel="nofollow">Carlos Segura</a> in 1994. T-26 publishes its own exclusives designs, but they also distribute fonts from many well know independent type foundries.</p>
