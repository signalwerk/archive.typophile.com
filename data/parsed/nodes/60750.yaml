    <p>Does anyone know for sure what it is? I have to re-create a logo and my only hint as to the typeface used is that it's the same as good morning america all caps, bold... I already went through the questions/ checklist on <a href="http://www.identifont.com/identify.html" title="http://www.identifont.com/identify.html">http://www.identifont.com/identify.html</a> "identifont" and the conclusion was that the font was "arial". The font I'm looking for is identical in every way that I can see EXCEPT an arial "R" has a curve to it where as the one I need (by today) does not, just a diagonal line. Any Educated guesses or other resources I should turn to?</p>
    <p>Thanks in advance!</p>
