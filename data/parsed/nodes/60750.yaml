    date: 2009-08-07T13:59:00
    date_raw: 7 Aug 2009 — 1:59pm
    votes: null
    html: <p>The Bitstream version has the classic Avant Garde "R". The Linotype/Adobe version was apparently derived from the Multiple Master version that was created in the '90s. The "R" was redesigned so that it could blend between different weights. Not sure why one would retain that design if it's not Multiple Master. The original Linotype/Adobe version followed the classic design. <a href="http://www.fonts.com/FindFonts/Detail.htm?pid=425892&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=32242&amp;query=AVANT%20GARDE&amp;SCOPE=Fonts" rel="nofollow">The "Pro" version on Fonts.com</a> shows the original "R" plus you get all the ligatures.</p>
