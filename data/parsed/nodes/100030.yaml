    html: |-
      <blockquote><p>I’d start with Bodoni and explore the whole didone category.</p></blockquote>
      <p>I think starting with Bodoni is fine. I would not finish with Bodoni, though. Using a didone face in order to achieve that <em>air de Paris</em> ambiance feels a bit too obvious. What about trying one of those rarely-used Frutiger serif designs?</p>
      <p><img src="http://ic.pics.livejournal.com/m_zhukov/967599/38558/38558_600.gif"></p>
