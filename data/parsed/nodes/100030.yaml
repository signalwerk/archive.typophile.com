    html: |-
      <p>Bodoni is Italian; it would be a bad choice for Paris.<br>
      In addition both Bodoni and Didot are neolassical fonts used all over Europe starting from the end of 17th Century.</p>
      <p>You'll maybe find some nice inspirations in this video<br>
      <a href="http://vimeo.com/channels/nicetype/18886355" title="http://vimeo.com/channels/nicetype/18886355">http://vimeo.com/channels/nicetype/18886355</a></p>
