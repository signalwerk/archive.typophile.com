      <p>The Process Type Foundry offers this - just as you describe where if you want to later upgrade to a pack or family that contains the single we'll take off the original purchase price. You can also upgrade from packs to families ... there are lots of options.</p>
      <p>Find more information about it in our help section; once there look for 'Upgrade program':</p>
      <p><a href="http://www.processtypefoundry.com/help/" title="http://www.processtypefoundry.com/help/">http://www.processtypefoundry.com/help/</a></p>
