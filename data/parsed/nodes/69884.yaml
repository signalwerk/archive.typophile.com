    <p>Hi,</p>
    <p>I remember reading about a foundry that allows customers who buy a single weight, then later want the whole font family will receive a discount to the sum of the original purchase. </p>
    <p>Does anyone know the foundry of which I speak?</p>
    <p>Thanks in advance.</p>
    <p>Harley</p>
