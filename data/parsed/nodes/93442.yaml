      <p>This doesn't really answer your question, but ... it might interest you to know that it's also the font that Durand/Salabert/Eschig use for their scores these days too. (In case you want to avoid looking too much like anything else.)</p>
      <p>I think it's a rather lovely font as well and have used it in scores before (my job insofar as I have one is typesetting music - mostly for specific publishers who already have their own house style and therefore I just use the fonts I'm told to use, but for my own pieces or for things I've done 'privately' of course I get to choose what I like, usually) but ultimately I decided it was a bit too light for my preferences. Partly this will also depend on the music font/symbol library you are using, which then also depends on what software you're using as well.</p>
      <p>I haven't exactly established my own publishing house (would be very fancy to call it that) but I have over a long time worked out for myself a detailed house style that I now use for all the projects I do for myself, including of course my own music. The hardest bit was finding the perfect text font to use; I could tell you what I decided on in the end, but then I'd have to kill you, obviously.</p>
      <p>Nice in any case to see a kindred spirit here!</p>
