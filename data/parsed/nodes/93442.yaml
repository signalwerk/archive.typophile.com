    <p>Hi!</p>
    <p>I'd like to ask for some advice. I'm a musician studying Composition. I love design and typography, but I ultimately abandoned it to focus on music.<br>
    I've been using Minion Pro as the text font for my self-edited scores and drafts. I find it gorgeous: the regular is clean and great looking, the bold has presence, and I'm particularly enamored with its italic. However, I'm not sure where I got it. I don't know whether it came with my Mac or if it came with an Adobe product, since it was developed by Adobe. I'm guessing the latter.</p>
    <p>I'm in the process of founding a music publishing house. I would be in charge of handling directly with the music, and responsible of establishing a "house style", a consistent design to use across all of our published scores.<br>
    Taking that into consideration, what would I need to be use the font professionally? Is there any licensing I need to take care of? Are there similar fonts you would recommend?</p>
    <p>Thank you in advance for your replies!</p>
