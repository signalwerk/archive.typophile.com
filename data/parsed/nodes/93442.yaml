    html: <p>If Minion came with some Adobe software that you bought, I don't think you do need to buy a separate license. I should think as long as you can identify where you got it from, and that it was bundled with something from Adobe, that's enough. If it came free, though, it probably doesn't have all the weights anyway, which you may want to buy.</p>
