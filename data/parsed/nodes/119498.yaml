  - id: 588192
    user: 175823
    date: 2014-09-13T08:34:00
    date_raw: 13 Sep 2014 — 8:34am
    votes: null
    html: |-
      <p>Actually, Trend Sans One (type) paired with Trend Sans Two (shadow) should do the trick (just change the color of the shadow type):<br>
      <a href="http://www.myfonts.com/fonts/latinotype/trend/" title="http://www.myfonts.com/fonts/latinotype/trend/">http://www.myfonts.com/fonts/latinotype/trend/</a></p>
      <p>I believe you achieve the effect by typesetting two identical type blocks, one in each font, and aligning them one on top of the other.</p>
