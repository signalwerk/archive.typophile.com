      <p>Hrant: <em>No meals (although coffee, muffins and stuff are de rigueur).</em></p>
      <p>That's not quite accurate. Unless things are significantly different from previous years, the various evening receptions will involve at least nibbles, and the Saturday night party is catered (usually with massive amounts of food). Lunches are not provided, and most evenings you'll want a meal in addition to whatever nibbles are provided at events.</p>
