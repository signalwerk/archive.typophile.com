      <p>Hi Rob. I hope your first TypeCon will be an enjoyable one. </p>
      <p>This year will be slightly different from past years as our location is much more convenient to food options as we are right on Bourbon Street. There will still be coffee and pastries and such at breaks and other nibbles at different events, but the real food is out there in wild. Overall, it will be a much better culinary experience.</p>
      <p>There will also be a printed restaurant guide at registration provided by the local committee. These locations will be posted on TypeCon.com soon as well.</p>
      <p>See you all soon!</p>
