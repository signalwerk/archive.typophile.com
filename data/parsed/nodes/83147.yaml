    <p>I will be attending TypeCon2011 next month in New Orleans. This will be the first time I've attended the conference and I'm curious how many here will also be attending. If anyone has some interesting bits of info, I'd appreciate them.</p>
    <p>The web site for TypeCon is not really clear. For example. I have attended the International Calligraphy Conferences in the past, and the cost of the conference, while much higher than TypeCon, includes housing and meals. </p>
    <p>SInce I had to register with the Hotel separately from the conference, I assume meals are not included in the event either. I'm not planning to attend any classes (which have extra fees), so I wonder what my fee IS covering. Please understand, I'm not complaining, just curious as to what to expect.</p>
    <p>Rob</p>
