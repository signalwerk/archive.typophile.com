      <p>No meals (although coffee, muffins and stuff are de rigueur). There are simply too many awesome choices in N'awlins. :-)  So the fee is "only" covering admission to great content. And the opportunity to mingle with people who are both knowledgeable and nice. I guess some conferences include the hotel so you don't stay anywhere else (since that makes the hotel charge the organization less for using the conference rooms). I'm all for immersion* but it's not for everybody - and most towns have enough to see that some people will drift in and out, making a vacation out if it.</p>
      <p>* The first TypeCon comes to mind. Once in a lifetime.</p>
      <p>I'll be there. Along with anybody with cojones:<br>
      <a href="http://www.typecon.com/archives/400" title="http://www.typecon.com/archives/400">http://www.typecon.com/archives/400</a></p>
      <p>hhp</p>
