      <p>I suppose the difference between the International Calligraphy and Lettering Arts Conference and TypeCon may be that the ICLAC is usually held at a college campus and the accommodations are less frills. Classes (workshops) are held in actual classrooms and meals are provided in the campus cafeterias.</p>
      <p>As I said, since I've never been to a TypeCon, I am wondering what to expect. And I'm really looking forward to it. </p>
      <p>Perhaps I will see you there, hrant....</p>
      <p>Anyone else going?</p>
