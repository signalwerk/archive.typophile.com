    <p>Hello All,</p>
    <p>I'm trying to find a typeface to use on a website for a tour company based out of Petra, Jordan, but who receive a majority of their clients from Canada and the US.</p>
    <p>Thought I would call on the type crowd to see what they might suggest.</p>
    <p>I appreciate any insight and thank-you in advance.</p>
    <p>O</p>
