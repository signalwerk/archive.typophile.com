  - id: 53988
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I think it looks like <a href="http://www.myfonts.com/fonts/letraset/compacta/compacta/testdrive.html?s=SECRET+AGENT&amp;p=48" target="_blank">Compacta</a> with a modified S, G and probably the N. One reason I picked it, is that the C has the same longer lower 'chin', rather than being symmetrical. I know the poster for the thread James mentioned said it was NOT Compacta, but I think that was based on the mismatch of the modified letters. <br> <br>Sure there may be a newer font out there, but other than House Gothic 23, I can't think of anything this close. <br> <br>My vote is customized Compacta.</p>
    html_clean: <p>I think it looks like <a href="http://www.myfonts.com/fonts/letraset/compacta/compacta/testdrive.html?s=SECRET+AGENT&amp;p=48" target="_blank" class="link-external">Compacta</a> with a modified S, G and probably the N. One reason I picked it, is that the C has the same longer lower 'chin', rather than being symmetrical. I know the poster for the thread James mentioned said it was NOT Compacta, but I think that was based on the mismatch of the modified letters. <br> <br>Sure there may be a newer font out there, but other than House Gothic 23, I can't think of anything this close. <br> <br>My vote is customized Compacta.</p>
