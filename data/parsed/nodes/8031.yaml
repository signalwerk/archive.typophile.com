    votes: null
    html: <p>My vote goes to Binderstile Bold, which seems to be a perfect match down to the ink traps. The only digital version I'm aware of (I have it) is Brendel Informatik's <a href="http://www.qbf.de/dceng.htm" target="_blank"> Report Bold</a>, but my link yields only a crappy image of it I'm afraid. Perhaps someone with a better catalog representation of Bindertile Bold than the Solotype Catalog offers can confirm (or reject) the ID. <br> <br></p>
