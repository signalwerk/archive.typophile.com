  html: |-
    <p>Typophile is looking for an intern to start immediately.</p>
    <p><strong>You</strong><br>
    + Love typography and are in school to receive a BFA or equivalent in design</p>
    <p>+ Can communicate well in written English</p>
    <p>+ Have a solid grasp of Creative Suite 2 or 3 (Illustrator, Photoshop and InDesign. Flash is a plus.)</p>
    <p>+ Want real-world experience in a multi-disciplinary design studio </p>
    <p>+ Can handle an X-acto without losing blood</p>
    <p><strong>Typophile</strong><br>
    + Is an international collaborative community of designers, typographers and type enthusiasts</p>
    <p>+ Is operated by Punchcut the San Francisco based user interface design firm</p>
    <p><strong>The internship will require</strong><br>
    + Designing, writing about, shipping and fixing Typophile stuff</p>
    <p>+ Preparing Jared Benson's hair and wardrobe for tour dates and appearances</p>
    <p>+ Preparing for Typophile events</p>
    <p>+ Working 2 days or 20 hours a week on-site at Punchcut world headquarters in San Francisco's lovely Union Square</p>
    <p><strong>Interested candidates</strong> should send a cover letter, resume and URL to your work samples to pemberton [at sign] punchcut [dot] com.</p>
    <p>TYPOPHILE<br>
    170 Maiden Lane, 3rd Floor<br>
    San Francisco, CA 94108</p>
    <p>Typophile is a <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> brand.</p>
