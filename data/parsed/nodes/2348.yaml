    date: null
    date_raw: null
    votes: null
    html: "<p>&gt;What is a typical event like? What is the typical attendee demographic? <br> <br>Generally, less formal or less \"industry\" oriented than AtypI. Definilty not a replacement for AtypI, but a good way to have a weekend of total type-geek immersion (I mean that in a good way). I have been trying to recall Peter Bain's exact phrasing when describing the various type conferences and organizations, but it was something to the effect of \"TypeCon is where the type hits the street\". There are at least as many type \"aficionados\"  as type designers at these events. Without sounding too much like a sales pitch:  if you love typography, you must go. <br> <br>I leave you with some <a href=\"http://p22.com/photoalbum/typecon/typecon2003pics/index.html\" target=\"_blank\">pics from last year</a> <br></p>"
    html_clean: "<p>&gt;What is a typical event like? What is the typical attendee demographic? <br> <br>Generally, less formal or less \"industry\" oriented than AtypI. Definilty not a replacement for AtypI, but a good way to have a weekend of total type-geek immersion (I mean that in a good way). I have been trying to recall Peter Bain's exact phrasing when describing the various type conferences and organizations, but it was something to the effect of \"TypeCon is where the type hits the street\". There are at least as many type \"aficionados\"  as type designers at these events. Without sounding too much like a sales pitch:  if you love typography, you must go. <br> <br>I leave you with some <a href=\"http://p22.com/photoalbum/typecon/typecon2003pics/index.html\" target=\"_blank\" class=\"link-external\">pics from last year</a> <br></p>"
