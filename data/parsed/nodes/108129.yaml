    <p>Hi !</p>
    <p>I need suggestions for a swiss looking, geometric, sans-serif typeface:</p>
    <p>-Not TOO friendly like Brandon grotesque,<br>
    -More modern looking than Futura,<br>
    -The lowercase "a" has to be like the "a" from Futura,<br>
    -Preferably "o"s like perfect circles.</p>
    <p>I really like "GT Walsheim" but I don't like the shape of the G and I want something just a little bit stronger.<br>
    <a href="http://www.grillitype.com/typefaces/walsheim" title="http://www.grillitype.com/typefaces/walsheim">http://www.grillitype.com/typefaces/walsheim</a></p>
    <p>Thank you!!</p>
