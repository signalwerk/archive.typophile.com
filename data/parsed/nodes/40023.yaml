    <p>Hello everybody. It's been a while since I've written something in here, but I need some help, and where else coud I get it?<br>
    I have the déjà vu sensation of the face, but I don´t know how to identify it. Tried Identiyfont, underware, ourtype, dtl. I just know it has a dutch genesis.<br>
    Can anyone help?<br>
    Thanx ;)</p><div class="imageWrap"><img src="http://typophile.com/files/dutch_type_4234.gif"></div><p></p>
    <p>It reminds me of "vista", and the "g" looks like a Gerard Unger's one.<br>
    It's a beautifull face, but I'd like to know who drew it.</p>
