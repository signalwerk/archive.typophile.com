    html: "<p> Synapse 1.0 : a brief description <br> <br>The origins of creating type has traditionally been predicated by a reader engaging type as a static experience. With the relatively new accessibility of interactive media, I believe it is time for both typographer and reader to re-examine how type is created and engaged. Typography can no longer be viewed as a static event, bound by the pages of a book. Each letterform now has the potential to be an event within itself. A universe of activity could reside in the single letter \"a\". <br> <br>Synapse 1.0 is an experiment in time-based typography. It is a hybrid of the biological and the technological - an organism of undulating modules. Shapes rhythmically coalesce into familiar and abstracted letterforms. Beyond a statistical improbability, a reader will never experience the same letter \"a\" twice. <br> <br>Synapse 1.0 is an entirely original design inspired by various sources including Herbert Bayer's type designs, bitmap typography, and the destination signage on San Francisco's public transportation trains. I hope this typeface inspires conversation and debate. All comments are welcomed. <br> <br>The entire set for Synapse 1.0 is nearly complete. Uppercase, lowercase and numbering are ready for critique. These will be posted in the near future. Finally, I would like to thank Joe Pemberton for his assistance in posting this file.  <br> <br>Cheers, <br>-RM </p>"
    html_clean: "<p> Synapse 1.0 : a brief description <br> <br>The origins of creating type has traditionally been predicated by a reader engaging type as a static experience. With the relatively new accessibility of interactive media, I believe it is time for both typographer and reader to re-examine how type is created and engaged. Typography can no longer be viewed as a static event, bound by the pages of a book. Each letterform now has the potential to be an event within itself. A universe of activity could reside in the single letter \"a\". <br> <br>Synapse 1.0 is an experiment in time-based typography. It is a hybrid of the biological and the technological - an organism of undulating modules. Shapes rhythmically coalesce into familiar and abstracted letterforms. Beyond a statistical improbability, a reader will never experience the same letter \"a\" twice. <br> <br>Synapse 1.0 is an entirely original design inspired by various sources including Herbert Bayer's type designs, bitmap typography, and the destination signage on San Francisco's public transportation trains. I hope this typeface inspires conversation and debate. All comments are welcomed. <br> <br>The entire set for Synapse 1.0 is nearly complete. Uppercase, lowercase and numbering are ready for critique. These will be posted in the near future. Finally, I would like to thank Joe Pemberton for his assistance in posting this file.  <br> <br>Cheers, <br>-RM </p>"
