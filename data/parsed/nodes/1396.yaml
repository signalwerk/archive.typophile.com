    html: <p>You sure do like hyping yourself up. <br> <br>I'd be interested in seeing the ActionScript behind this animation. Are you simply triggering movie clips randomly to flash the segments of the fonts, or is there method behind the sequencing? <br> <br>Being as it is called synaptic, I'd like to see a variant where the fluctuations are nerve-like responses to stimuli. <br> <br>Another avenue of exploration would be to really change the structure of the letters. Instead of just alpha-ing out segments of your letterform, what about designing a series of letterforms and utilising alternative segments to construct letters which are truly original each time. Even going so far as to breakdown each letter into a series of components - ascenders, descenders etc -and then construct each letter from random selections of each required component (This WOULD get messy, but hey, you wanted abstract). <br>Even calling upon the powers of Flashes drawing API to draw completely original shapes for each component every time - randomised within constraints. <br> <br>I'm just not sure at the moment that your really breaking new ground here yet. For 'time-based typography' we could just as easily read 'animated logo'.</p>
