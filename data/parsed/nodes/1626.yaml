  html: "<p>I was just rummaging around the script faces on my computer, and found this: <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"1,scriptc\"> <br> <br>I kind of like it... I like the squareish loopy bits on the capitals, and the chunky bowls on the lowercase letters, and the triangular ends of the c and k. <br> <br>Can anyone tell me if whoever did this did it on purpose, or if it's just an old font back from when you couldn't do so much with them? <br> <br>It's just called ScriptC on my computer, and there's not much interesting information if I open it up in my Fonts control panel. <br> <br>Thanks, <br> <br>Brian</p>"
