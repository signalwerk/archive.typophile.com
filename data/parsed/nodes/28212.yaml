    html: |-
      <p>Tiffany, in some ways that’s not all bad. The hugely flamboyant initials can really be overkill, and it also takes restraint not to get carried away with all the optional beginnings, endings and other flares that are part of that set.</p>
      <p>One reason for the limited use we see is that I think a lot of people don’t really know how to use all the OpenType character sets. Some OpenType fonts and applications are more user friendly than others. I don’t know how many times I’ve answered questions about ’how do I get the Bickham Swash font’?</p>
      <p>- Mike Yanega</p>
