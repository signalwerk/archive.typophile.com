    <p>Hi everyone, </p>
    <p>I have a queery, i am using Fontographer to design a small set of 7 character typefaces. In the typfaces I am using ’alt a’ (the apple sign). I have applied the letter to this character. Now, when it comes to generating the font, all is well and 6 of the letters work perfect. The seventh however, the ’alt a’, does not seem to generate as a character. In inDesign, it shows the infamous outlined rectangle for a missing charater. </p>
    <p>I am very new to Fontographer so am totally stuck on this problem. Can anyone tell me why this character in particular is not generating. It is very important that it is this ’alt a’ key.</p>
    <p>Thanks in advance</p>
    <p>Matt</p>
