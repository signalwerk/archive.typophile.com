  html: |-
    <p>Okay, so i was going through witdrawls, so i got this little number to a point where it's suitable to be looked at (i hope)! I started working on this before i was up to my eyeballs in Goudy faces. I still like it tho... <br>This is not one of Goudy's finer types, but i found it charming and may be useful for display purposes, even though this is the "text" version. <br>I want to try my hand at two more versions: a cleaned up, sharp "display" version and then using the clean version and tweaking it a bit to see if one could actually make a working text font based on this design. any tips? shout em out! thnx for looking... <br> <br><img src="http://www.typophile.com/forums/messages/29/67150.gif" alt="teaser"> <br></p>
