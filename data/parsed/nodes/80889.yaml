      <p>It sounds simplistic (and it is, but not terminally so) but Belgium is between France and the Netherlands (two typographic powerhouses) and culture travels geographically (at least until very recently) so something that blends those big traditions might click. So:</p>
      <p><a href="http://www.flickr.com/photos/petervanlancker/5241230677" title="http://www.flickr.com/photos/petervanlancker/5241230677">http://www.flickr.com/photos/petervanlancker/5241230677</a><br>
      Make sure to read the comments!</p>
      <p>Another angle is to take the French style and make the x-height much bigger.</p>
      <p>hhp</p>
