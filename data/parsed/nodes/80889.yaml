    <p>Dear everyone!</p>
    <p>For a project I am looking for Belgian fonts to use. They could be old or new, serif or sans serif, it doesn't matter. As long as they are digitally available, preferably no display typeface (but rather for text setting) and online somewhere so I can make a tryout.<br>
    I've found some Belgian type designers, but I would like to get your advice on fonts in particular!</p>
    <p>Thanks a lot in advance.</p>
    <p>All the best!</p>
