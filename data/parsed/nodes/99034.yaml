    <p>I am happy to announce that Typomapp web application is back with new enhanced features. Our ambition is to create an open, ever evolving book to share our knowledge and creations.</p>
    <p>We've carefully researched and selected points of interest from both past and current times. But you are all invited to add your own. They could be your own work, or someone's you admire.</p>
    <p>We are international, and contributions in any language are more than welcome.</p>
    <p>The web app is free to use. You can find it here: <a href="http://www.typomapp.com/webapp" rel="nofollow">typomapp.com/webapp</a></p>
    <p>– Leo Dumea, Typomapp</p>
    <p><a href="http://www.typomapp.com" rel="nofollow">typomapp.com</a><br>
    <a href="https://twitter.com/typomapp" rel="nofollow">@typomapp</a><br>
    <a href="https://www.facebook.com/pages/Typomapp/100114340072778facebook" rel="nofollow">Facebook</a></p>
