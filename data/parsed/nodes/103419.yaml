    html: |-
      <p>I don't feel there is anything illegal about reading sidebearing values out of a font. It's not that different than gathering individual character widths (a prerequisite for formatting text) or kerning values. Think, for example, of an automatic Optical Margin Alignment feature.</p>
      <p>That said: Jasper, are you working with InDesign? It's possible to write a script that converts type to outlines (*) and does these measurements; no need to delve into the actual font file.</p>
      <p>(*) And yes, I am aware that 'converting to outlines' is forbidden by some EULAs as well.</p>
