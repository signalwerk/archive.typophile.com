  html: |-
    <p>Hey folks,</p>
    <p>If you'd want to make any sort of educational material about type design, are you allowed to use a font (with a license) in it, and show values from the font, such as the spacing and kerning values? For example, you could set a word, draw lines to show the sidebearings, and write the spacing values from within the font underneath it, to show the distance from the glyph to its sidebearing. Might be a silly question, but I'm considering making a poster, so it seems wise to be sure :)</p>
    <p>Cheers,<br>
    Jasper de Waard</p>
