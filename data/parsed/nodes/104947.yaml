      <p>The lines may be a bit blurrier than they used to be, but I think we can still draw distinctions. My comments on Typophile aren't archived by a major university library, included in that library's online catalog, listed on <a class="freelinking external" href="http://books.google.com/books/about/Normative_Authority_and_the_Foundations.html?id=BdLz3kkD8uwC" rel="nofollow">Google Books</a>, available for sale as print-on-demand volumes at <a class="freelinking external" href="http://www.abebooks.com/servlet/SearchResults?an=silverstein&amp;sts=t&amp;tn=normative+authority" rel="nofollow">various bookstores</a>, and so forth.</p>
      <p>As I put it above, it's no longer the case that one's dissertation committee is the only real audience for one's dissertation. They are the primary audience, of course, but there are additional reasons to want one's thesis to look as good as possible, typographically speaking. It's going to be "out there" in a way that dissertations generally weren't twenty years ago.</p>
