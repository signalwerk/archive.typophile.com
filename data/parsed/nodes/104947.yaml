      <p>You really write for the people who grade it in the first place. Therefore Times would be the go to face. However a subtle an unnoticeable (to the eyes of the usual academic) deviation from Times is Georgia, which is easier to read. I would suggest use Georgia one point step less than the recommended Times size. There is even a blog entry of a guy who received on average higher grades with Georgia compared to Times ;)</p>
