      <blockquote><p>FF Meta Serif is an excellent typeface, by the way. Newzald is lovely. Skolar is also a quite pleasant and fresh. Or how about FF Spinoza?</p></blockquote>
      <p>I'm sorry, this is silly. I don't know about you, but when I'm paid to design a book, I read some of it. Always the introduction or introductory chapter. The conclusion if there is one. The rest if there is time.</p>
      <p>I imagine the category meta-metaphysics is wide open these days, even by the once-narrow standards of British/American philosophy. (Which I actually have sympathy for.)</p>
      <p>Just by the way, all the fonts you mention have "a fresh new look." That may not be appropriate, or the author may not desire it. Either would stop their use.</p>
      <p>Further:</p>
      <p>Now maybe I'm a bit too rebellious, but there were things I would have liked to put in my dissertation that would have caused trouble. Not directly, because the way the politics of these things work is if the person you're working under says it's ready, it would be a slap in his face for his colleges to turn it (you) down. But a grudging pass is less help. Unless you've already got several articles published, and your reputation is so established it stands on it's own regardless a certain coolness by the others on your committee -- you can reasonably expect your director to stand behind you -- you will fall afoul of academic politics.</p>
      <p>But once that two-year-old  dissertation is accepted for publication, you can incorporate "further research." That lets you say things you might have found prudent to leave out of the original work.</p>
      <p>As far as typeface goes, I'll stick with the notion that if I were to design it, I would first have to read at least some of it. Part of being professional.</p>
