    html: <p>Why would form be irrelevant in a dissertation? I think it isn’t. And it seems inconsistent to me to consider yourself passionate about typography on the one hand and to pass up the one-time chance of showing that typography can make a difference on the other. If there’s anything that deserves to be given a form that is pleasing to the eye, it is good content. And if your content is good, it’s likely to be consulted frequently, so you might want to give “the whole an attractive appearance without imposing too much self-will”, as <a href="http://typophile.com/node/105086" rel="nofollow">Mardersteig</a> said. There’s nothing fishy about things looking nice. Typical dissertation guidelines—if they exist and happen to have been updated after the invention of the personal computer—seem to be more concerned with avoiding people turning in theses using 18pt Comic Sans Italic than with striving for an optimal reading experience. If you have the time to strive for this, I would. You can’t be passionate about fashion either and show up at your dissertation defense in a shell suit (although it’s all about the content).</p>
