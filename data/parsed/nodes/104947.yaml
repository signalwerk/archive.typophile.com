      <p>Despite my passion for typography, and given my experience in academia, in all honesty, the typographic design of a dissertation, or any paper for that matter, is the absolute <em>last</em> thing I would invest any amount of time and energy into. And I’ve been single-mindedly passionate about type — to an almost diagnosable level — for over 20 years.</p>
      <p>I would simply find the appropriate guidelines, no matter how fugly we may consider them to be as typographers, no matter how much “better” we know than the lay-person or academic, and do as they say. It really doesn’t matter if you find Times New Roman to be common or boring.</p>
      <p>In everything I have ever written, given more time, I would revisit the content <em>long</em> before thinking about fonts. Any potential reviewer worth their salt is far more concerned with good research then they are “good” typography. In fact, many would probably be put off by something that strays too far from the norm.</p>
      <p>Thinking about fonts instead of content is putting the cart before the horse. This is most certainly a context where content trumps form.</p>
