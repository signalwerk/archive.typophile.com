    html: "<p>It’s obviously behind content on the to-do list, I agree. But science (or more generally: content production) is not agriculture (and not fashion either). You are not producing food and even if you were, you would still have to draw an entirely subjective line at where to stop putting time in the actual content. Is an eight-hour day enough or does it have to be ten, twelve, sixteen hours per day that you work on your dissertation? Everyone has to decide for him- or herself. But if you do have some leisure time to spend, why not spend it on typographically refining your thesis? I can well imagine this not being met with applause from faculty, but that should be your least concern. I don’t applaud everything they do in their spare time either. You could, for instance, try to come up with a layout that is based on your department’s guidelines, but takes them to a new level of typographic sophistication. If it is subtle enough, nobody will notice; they will just subconsciously find it a pleasant read. Or try to be flashy if you can stand the comments you might get for that. But to repeat myself: If you believe that typography—i.e. arranging type in a way that ensures optimal content delivery—is important (even if it’s not the main thing), you should let it come to its own whenever you can. Aesthetically I think the world doesn’t get any better from typophiles grudgingly handing in double-spaced TNR theses.</p>"
