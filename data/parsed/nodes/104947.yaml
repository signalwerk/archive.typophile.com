    html: <p>Eliason - "meta" and "metaphysics" are two different things - both in language, in reality,  in philosophy and surprisingly in typography! Even if the association with one another would be the same. I would set a  	philosophic thesis, say, about "commodification" ("Commodification of Human Nature" - What a title!) in the typeface Meta. But "metaphysics" as a theme, even as a philosophic branch, is nothing new. In fact it is even boring! So, I would suggest a typeface in the direction of Baskerville - don't know exactly why, I just feel Baskerville would be right. I am too lazy now to refresh my basic knowledge in both philosophy and typography, but Baskerville-Transition Era-1800s-French Revolution, Industrialization, Diderot-Balzac-Realism, Goodbye-to-Metaphysics - that seems a right picture! So, a Baskerville-revival or something similar. Like <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/baskerville-original-pro" rel="nofollow">Baskerville Ten</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/antique-ancienne" rel="nofollow">Antique</a> from Storm Type Foundry.</p>
