      <blockquote><p>The target audience will be mainly university professors, but in theory anyone. It will be both printed and viewed in PDF format. I'm looking for something like the above two fonts but perhaps a bit edgier or modern.</p></blockquote>
      <p>Nonsense. Unless philosophy PhD's have changed since the 1970s, the audience is your dissertation committee. If you work at getting your dissertation published by a university press, whoever picks it up will have their own designer(s) select the typeface. It is also usually best to wait a year to try &amp; get it published, so that the work is the "core" of your dissertation, with further thought. It will still be out in time to count for tenure.</p>
      <p>If you self-publish, ... well, not advised unless you take the information to be more important than your career.</p>
      <p>(We had a saying about prelims [preliminary exams] too. This is in the States, but I assume it's the same everywhere. To whit: "Prelims are a puberty rite...")</p>
      <p>Good luck with it.</p>
