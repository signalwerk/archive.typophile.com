    html: <p>The one instance where I chose to ignore the rules was c 1995 in a psychology course. I was instructed to printed single sided, as per the department guidelines. I insisted on printing double sided under the threat of an F, but was shortly followed by the support of the rest of my classmates who chose to follow me and accept the same fate. They changed the university guidelines before the end of the semester. And as of two years ago, all dissertations are electronic submission only.</p>
