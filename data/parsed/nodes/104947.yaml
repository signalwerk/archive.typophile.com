      <p>I agree, it would have been nice to read a couple of pages before making typeface suggestions, but I think there’s nothing to be read so far. That’s why I suggested four typefaces that indeed have what I would call a fresh new look and that I would not find inappropriate for a philosophy thesis. It’s up to the writer to decide if he thinks that their tone fits the topic and the tone of his writing.</p>
      <p>Also, I don’t think that a nicely designed thesis—as opposed to a double-spaced TNR manuscript—is going to stand in the way of anyone’s academic career. You have to stick to the rules, but if there are no explicit rules and you don’t break the unwritten ones by using a blackletter or a script typeface, no one will even consciously notice the typeface that you used. But you, as the author, will and that counts, too.</p>
