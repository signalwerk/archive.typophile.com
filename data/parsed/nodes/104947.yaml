      <p>My claim is that Georgia is <em>relatively</em> easier to read. Times (New Roman) in its version shipped with MS Office, Windows, and Mac is actually a sub-headline cut for point size 14 to 16 with a strong contrast and a condensed shaped. Georgia while it is optimised for screen is however as well optimised for body text. And it is readily available. And I bet it is to most university professors indiscernible from Times, as it shares similar traits. </p>
