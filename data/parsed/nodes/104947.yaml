      <p>All the people telling you that you should just stick with Times New Roman are right. But unless there are explicit rules banning fancier typefaces, go ahead and use a fancier typeface. Of course, your thesis is not a book ready for press, but a manuscript for review. On the other hand, it’s the last chapter of your studies and something you might want to give your nan a copy of, so why not make it look nice? You could prepare a boring TNR version for your supervisor and a fancy one to give away, but why bother making two versions if there are no regulations keeping you from designing your thesis the way you like? As long as you make sure that it is easy to read and has wide enough margins for comments (if your supervisor happens to be of the old-fashioned kind who work with pen and paper), you should be fine. I have always seen this as a legal way of getting higher grades. Good design makes a text look more trustworthy and authoritative, even if it is just a term paper. As a supervisor, I would prefer to get the fancy version although I am not sure if I would remain uninfluenced by the nice design—but who is ever fully objective anyway?</p>
      <p>FF Meta Serif is an excellent typeface, by the way. Newzald is lovely. Skolar is also a quite pleasant and fresh. Or how about FF Spinoza?</p>
