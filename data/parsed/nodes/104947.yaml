      <p>Many universities now publish their graduate students' dissertations through their libraries. So, it may not be only his committee that is reading Mikey's dissertation. (My philosophy dissertation, completed at the University of Michigan, can be found <a class="freelinking external" href="http://www.google.com/url?sa=t&amp;rct=j&amp;q=&amp;esrc=s&amp;source=web&amp;cd=1&amp;cad=rja&amp;ved=0CC0QFjAA&amp;url=http%3A%2F%2Fdeepblue.lib.umich.edu%2Fbitstream%2Fhandle%2F2027.42%2F58480%2Fmsilverz_1.pdf%3Fsequence%3D1&amp;ei=ArfyUcGKNMaJ7AaHq4CoAw&amp;usg=" rel="nofollow">here</a>.) Almost all of the formatting was prescribed by the university. The typeface was pretty much the only thing that was left up to me -- that and how to format the footnotes.</p>
