      <p>Couldn't agree more. Times from Linotype (PostScript) is a better rendering than Times New Roman (PostScript) from Monotype. </p>
      <p>There is a hint of that here, under the subheading "Variants"</p>
      <p><a href="http://en.wikipedia.org/wiki/Times_New_Roman" title="http://en.wikipedia.org/wiki/Times_New_Roman" class="link-external">http://en.wikipedia.org/wiki/Times_New_Roman</a></p>
      <p>Or if you really want to cross 'em up, try Equity.</p>
      <p><a href="http://www.fastcodesign.com/1665426/simple-genius-lawyers-typeface-makes-legalese-easy-to-read" title="http://www.fastcodesign.com/1665426/simple-genius-lawyers-typeface-makes-legalese-easy-to-read" class="link-external">http://www.fastcodesign.com/1665426/simple-genius-lawyers-typeface-makes...</a></p>
      <p>As a note, the biggest complaint people seem to have against Times is that ...  it is used so much. Of course! You can't be one of the in crowd unless you know the special handshakes, right?</p>
