      <p>I don’t believe it to be <em>entirely</em> irrelevant, but I do think it’s the last thing on the to-get-it-done list. Which is usually a pretty big part of finally finishing a dissertation. I haven’t met a single student or faculty member in nearly a decade of academia who was even mildly concerned with typography. When approaching faculty with such concerns, they were almost offended and looked down upon me for even considering taking time away from my research to spend on type. And that’s saying something, because I’m really passionate about it, can make a <em>very</em> strong case for it’s importance, and make almost anyone feel it too.</p>
      <p>At the end of the day, I think it comes down to how best you can spend your time in order to ensure the greatest return on investment. And when you’re being funded by public monies, I think it best to solve the problem, and move on to the next one. To use another agriculture metaphor, it doesn’t matter what colour your farm clothes are. What’s important is how much food you can provide for your community.</p>
