    html: |-
      <p>Never heard of the expression “bound in boards”?</p>
      <p>Books were actually bound in wood plank, for a much much longer time than they have been bound in composite paper board. </p>
      <p>UCLA has a fairly comprehensive collection of the Aldine output. Unless it was rebound in the mid to late 19th century or later, those covers are wood covered with leather.</p>
      <p>Gerald</p>
