    <div class="info">Submitted by <a href="/user/48199" title="View user profile.">Optimo</a> : 29.Sep.2009 4.03am </div>
      <p>Theinhardt Optimo is a classic Grotesk typeface designed by François Rappo. It is named after Ferdinand Theinhardt, a punchcutter and type designer (Halle 1820–Berlin 1909), whose radical design approach led to the contemporary modern sans-serifs.</p>
    <p>François Rappo developped the Theinhardt family after researching the DNA of Grotesks from the early 20th century to design an optically optimized contemporary font family organized in a wide range of weights.</p>
    <p>Released in OpenType format only, it features extended latin character set, tabular and proportional figures, contextual and stylistic alternates, case-sensitive forms and arrows.</p>
    <p><a href="http://www.optimo.ch/~opt_stock/Optimo_Theinhardt_Specimen.zip">Download the Theinhardt Specimen pdf</a></p>
    <p><a href="http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=22">Optimo</a></p>
    <p></p><div class="imageWrap"><img src="/files/Theinhardt_3583.gif"></div><p></p>
