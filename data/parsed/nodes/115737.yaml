    <p></p><div class="imageWrap"><img src="http://typophile.com/files/trace 2_3599.jpg"></div><p></p>
    <p>This logo has obviously been altered, but I'm wondering if anyone knows of the typeface this was based on? Something with a circle inside the capital "P"...the lowercase "e"might have been rotated. The original logo was designed in 1989 if that helps.</p>
    <p>Thanks!</p>
