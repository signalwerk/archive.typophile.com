    html: |-
      <p>Karma: You brought up a very interesting topic. Not only do handstyles (tags) have regional differences, but also internationally. The same goes for throw-ups (bubbly constructed letters) and Style writin (wildstyle). </p>
      <p>For years, Europe had a totally different aesthetic to their hands. As an American, it seemed like Europeans have more asymmetrical compositions. In America, the beginners are usually the ones experimenting with asymmetrical forms, then eventually find a consistancy in their tag. Early on, I felt as if the ideas on balance and composition that Americans preserved were lost in translation when it spread to Europe. I'm not tryin to downplay the whole continent, actually I feel that the experimentation done in Europe brought forth loads of techniques which spread worldwide, and I've always been inspired by their color schemes. </p>
      <p>Although a majority of European signature forms are not very accepted by American graff writers, I personally like to see the work being done there. The one writer in particular that I enjoy seeing is "Bean."</p>
      <p>Maybe your boredom is driven by the lack of knowledge with American hands? Where I'm from, there is a greater attention to the execution. We hold our markers consistently so that the letters are even and fit within the style family. We pay close attention to the amount of negative spacing within each individual letter. People here are very specific with tight letterspacing, creating a darker "color" of the total composition... drawing the eye towards the signature. American graffiti styles have been refined for decades, and are continuing to pull from outside sources. For example, in LA, writers are integrating Blackletter and existing shapes into a hybrid style. Every city has a different aesthetic, and with each new king comes new trends in forms.</p>
      <p>I’ve always wondered why there is a big difference between the tastes of graff writers in different countries. Maybe its driven by language and pronunciation of words? We should start a new thread to discuss this. Soon we might even get Brazilian writers in here saying the same for their styles.</p>
      <p>...Getting back on topic. if you want REAL graffiti lettering, find a real writer who’s been out there for a few years. Having a "field tested" style will assure your authenticity in the culture you are designing for. (sorry for the babble)</p>
