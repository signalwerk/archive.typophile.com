      <p>SF:<br>
      "Its like anything else, different regions have there own style. just like speech accents."</p>
      <p> Yes I understand this, but I'd like to search for the deeper reason. For example, San Francisco has a tradition of bus hopper style. Forms flow consistently and utilize curves for speed. Elements like hills posed interesting time constraints with the possibility of sloppy execution. Each letter is connected at the cap versus the baseline because you are usually writing on windows, above seated passengers. </p>
      <p>"Like colors, euro style are have more colors, They have had more color paint options. And another huge issue is your physical surroundings." </p>
      <p>I cut out my comment regarding this earlier cause it was becoming an essay. I think a strange factor is the existence of paint made specifically for the aerosol artist. I'm not sure exactly when these hit Europe, but these brands have been very popular here lately. With various tips (spray nozzles) and air pressures at your disposal, a wide range of line weights, fades, narrowing effects and even chisel-esque styles could be achieved. There must have been writers giving input when it came to developing these tools, which benefited specific styles.</p>
      <p>Karma:<br>
      "they get so repetitive and obsessive over it that it looses all it’s fun,"</p>
      <p>I definitely understand where you are coming from, yet I think in this case the joy level of marking surfaces depends on the person. People fall into their comfort zones, being able to create similar forms of (wild)style to get recognition. Out here, some people love the quantity just as much as we love the quality.</p>
