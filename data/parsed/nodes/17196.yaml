      <p>Old fart writer here. </p>
      <p>Thanks Wes for the tip off. <a href="http://www.handselecta.com" rel="nofollow">HANDSELECTA</a> is rumoured to be live. SFaustina creates beautiful work—all dirty and nasty, like climbing onto filthy dumpsters over bums to get to the perfect rooftop. SF, I love <a href="http://www.bloodwarsmagazine.com/" rel="nofollow">Bloodwars</a>. I've got all your brushes and free fonts. Please don't stop. </p>
      <p>SF, congratulations on the Computer Arts article. I look fwd to reading it. I haven't picked up the publication in years but your article is the perfect reason to pick it up again. BTW, did you tell the readers that they should rack all their supplies, spend years on the streets getting in and out of trouble, do their homework like KRS, and then sit back to digest it all before trying to create graffiti-inspired fonts?</p>
      <p>OK, I'll say it... just for the hate of it. Euro handstyles are wack. Phet was cool, Shoe as well. Mode2 cleared the house with scripts and the human form (heck... letters as well). Earl's scripts are nice, very American. O'clock managed to rock a few trains in NYC that ran, well, at least I saw them...</p>
      <p>OK, now that I've got your attention, let me clarify. </p>
      <p>I'm from DC. The styles there are not superlative as well. The writers I worked with worked very hard on developing a distinctive style. That took time. Did we succeed? I dunno. There are still some records of our attempts. The rest are buffed, dissed, lost or in some other state... at best the records are kept and the original inspiration is passed on for new kids to explore.</p>
      <p>Historically and globally, the creatives that stand out have one of the three elements: good mentorship, hard research, or serious drive. You can't get better without any of them and it's best if you have a combo of two, or all three. Usually, one precipitates the others and draws the remaining elements towards itself.</p>
      <p>So what...</p>
      <p>Well, getting back to throwing rocks accross the pond. Boy George above is spot on. It's not that beneficial to hate on Europe or the States. The working conditions are completely different, the histories are different. It doesn't stop there. The audiences are different with different responses (there used to be less tension in europe towards graff). The modes of graff are different as well. Most kids who write in the States aren't slapping up stickers as their main mode of getting up. The streets are too key'd up for that. Americans on a whole are more angry–so I'll make a leap and say that there's more aggressive bombing here in the States. </p>
      <p>Europe, much like DC and other cities (SF included) didn't have the history, communal knowledge and mentorship like Philly and NYC so we were left behind during the first decade of graffiti. It took a lot of dedicated writers both overseas and in the 2nd and 3rd wave cities (in the USA) to understand the foundations of graffiti: letterforms, quick footing, big mouths and technique.</p>
      <p>So what? Why all the talk on Typophile?</p>
      <p>Graffiti inspired fonts are an experiment. They are a hope and vision that has yet to be fully achieved. I believe that <a href="http://www.handselecta.com" rel="nofollow">HANDSELECTA</a> is doing a very good job persuing that hope. Check it out. It may help the dialogue.</p>
      <p>BTW, this is not shameless self promotion. <a href="http://www.adnauseum.net" rel="nofollow">Christian Acker</a> is the heavy hitter behind HS. I'm just the cheerleader and co-founder emmeritus.</p>
      <p>And Wes, when is the magazine coming out?</p>
    html_clean: |-
