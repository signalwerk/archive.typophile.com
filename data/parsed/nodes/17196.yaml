      <p>yes, unfortunately there are no real authentic graff fonts online. In the near future, a foundry called HandSelecta will be releasing some standardized legitimate fonts created by well established practitioners. the current sites and free fonts out there are not very authentic. Most take too many different elements form too many differnt regional styles and mix them into one disfunctional alphabet. </p>
      <p>I hear Stephen Coles knows a graff writer that creates authentic graff logos if the job is legit and is not trying to exploit or downplay the artform.</p>
