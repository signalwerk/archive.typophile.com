      <p>Regarding Bushop Style: I recently learned in an interview with a writer from Seattle who spent some time in SF (and haven't yet confirmed from native SF writers) that The BUSHOP style was originated by Latin-American writers who by practice would ride bicycles around SF. One guy would jump out into traffic stopping a bus while several would tag the exterrior of the bus in a quick and dramatic attack, utilizing a very fast and fluid one liner style of script, then escape on their bikes. Confirmation or disputing stories would be appreciated.</p>
      <p><a href="http://www.handselecta.com/" title="http://www.handselecta.com/">http://www.handselecta.com/</a> is now officially live (but beta) and will be providing fonts for retail sale based upon the handstyles of graffiti writing collaborators. For those who know the names we're dropping... Our first stable of fonts are by JOKER, MENE, MESH, MESK, and SABE, and we are in the process of working on future fonts with CEASR, CLARK, ESPO, FREEDOM, GIANT, RUST, STAB, SPARK, SP ONE, and TEST.</p>
      <p>We are dedicating ourselves to learning about the geographic developments of style, specifically tagging, not yet pieces or throwups as tagging relates more closely to calligraphy and hence to type design (I know this is debatable amongst some of you typophiles). </p>
      <p>We are a NYC based opeartion and while we are mostly working with American artists at the moment, we are certainly aware of the developments in this artform happening on the international scene and if there is an indigenous style to the graffiti from where you are from please let us know. We are doing our best to write each chapter of the story representing all indigenous styles and developments as it has never been done before.</p>
