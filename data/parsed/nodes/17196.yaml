      <p><cite>"For years, Europe had a totally different aesthetic to their hands. As an American, it seemed like Europeans have more asymmetrical compositions."</cite></p>
      <p>This is true 100%.</p>
      <p><cite>"Where I’m from, there is a greater attention to the execution."</cite></p>
      <p>This is also correct, but what I consider execution is the can control and both line and filling techniques, and on the other hand you have the styles that are soooo different (USA vs. EUROPE). The reason I said I find USA styles boring is because writers tend to "find the golden combination" and make as if it is written in stone, they get so repeatative and obsessive over it that it looses all it's fun, and that is where I think it gets it's rivalry moment. In europe we don't have rivalry and "biting hate", just because I think european writers leave a lot to experiment and viewers interpretation. Then again, everything came from USA and there is no disputing that.</p>
      <p>One has to have respect for the originators of the game, and has to study the original styles in order to bring something fresh to the table. It's the same as anywhere else. <strong>Know your roots, know why you are doing it, give respect and get it back.</strong></p>
