      <p>Thanks Wes for the tip off. <a href="http://www.handselecta.com" rel="nofollow" class="link-external">HANDSELECTA</a> is rumoured to be live. SFaustina creates beautiful work—all dirty and nasty, like climbing onto filthy dumpsters over bums to get to the perfect rooftop. SF, I love <a href="http://www.bloodwarsmagazine.com/" rel="nofollow" class="link-external">Bloodwars</a>. I've got all your brushes and free fonts. Please don't stop. </p>
