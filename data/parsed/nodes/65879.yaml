      <p>Non-font/offtopic: This is the second time (after the recent FontBureau thing IIRC) that I’ve seen «espérer» in such a comp. Isn’t «espérer» a verb while most others (certainly «speranza» &amp; «Hoffnung») are clearly nouns? Hello English-speakers, other languages have separate words for <em>to</em> hope, and <em>the</em> hope. Ah, language.<br>
      Sorry, carry on.</p>
