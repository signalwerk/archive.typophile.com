    html: |-
      <p>‘doufat’ is Futura.<br>
      ‘надежда’ is somewhere between Verdana and Myriad.<br>
      ‘надявам се’ is probably Helvetica (not Neue).<br>
      ‘希望’ look like Hiragino Kaku Gothic to me.<br>
      ‘ελπίδα’ seems to be a hodge-podge of different typefaces, or a font without proper support for Greek.<br>
      ‘희망’ is Batang.<br>
      F</p>
