      <p>Chris, if you're producing digital artwork for a tatoo artist to copy, the most flexible way of doing it is to convert some type into outlines in Photoshop or Illustrator, then modify the vector forms until the whole thing looks right.</p>
      <p>Getting the size right is important, yes, and a little more space. To be certain the tattooist is up to the job I would ask to see samples of their lettering work and get premission to take photos so you can look over them in your own time and space. Drawing type forms properly is a detail job, and from what has been said about tattoos some things need to be compensated for or require special attention to make the tattoo viable long term.</p>
      <p>Go one step at a time with this one.</p>
      <p>j a m e s</p>
