    <p>I would like advise on a type face for a tattoo. </p>
    <p>It is going to be of the word 'brother'. I don't have a preference of upper or lower case, san/serif. </p>
    <p>These are the characteristics of the type face followed by the characteristics of my brother:</p>
    <p>It should be very strong - he is a Royal Marine Commando and has always been very strong mentally and physically.</p>
    <p>It shouldn't have any unnecessary flair - he never shows off.</p>
    <p>It should be unique never the less and show a bit of something that you wouldn't expect to be there - he has characteristics that are unseen to many as he does not show them off; they only come out when necessary.</p>
