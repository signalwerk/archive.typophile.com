      <p>Aachen looks great for this. Just please make sure you get it large enough, space it a bit looser, and most importantly, go to a tattooist who knows what he's doing*. </p>
      <p>The details, like the size of the serifs, will not be quite trivial to get right, and especially so in smaller sizes. Also, remember that tattoos tend to bleed a little over time (not as in blood, but as in ink spread), so those tiny spaces would likely fill up soon &amp; get mushy.</p>
      <p>* The <a href="http://411.bmezine.com/" rel="nofollow">shop directory at BME</a> may be a good place to start looking if you don't have one yet. Also, while I haven't checked back there in a couple years or so, the folks on <a href="http://groups.google.com/group/rec.arts.bodyart/topics" rel="nofollow">rec.arts.bodyart</a> should be highly knowledgeable (though not always most peaceful).</p>
    html_clean: |-
