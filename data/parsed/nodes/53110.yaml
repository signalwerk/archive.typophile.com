      <p>Christopher—a more refined alternative to Aviano Sans bold is Engraver's Gothic, made by numerous font making outfits. The radiused corners is a good idea too, and it can be applied to any font you like, such as Aviano sans or Engraver's Gothic.</p>
      <p>I think ILC is suggesting radiused corners because that's a massive trend in type design at the moment.</p>
      <p>I recommend you go with something much more butch with a bit of contrast and discrete slab serifs, like Aachen bold (actually it's black but they call it bold). If Aachen isn't your cup of tea you could look at some of the slab serifs recommended on the "If Johnny Cash were a font" thread.</p>
      <p>Why a slab serif? These sansies are okay but none of them have got any balls, not manly enuff for a royal marine commando, and they're rather dull. Surely your brother is more interesting than a plain old sans serif.</p>
      <p>sans serif = prissy pants<br>
      slab serif = man's font</p>
      <p>j a m e s</p>
