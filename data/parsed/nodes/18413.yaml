    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/30028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Technical Info</a>&nbsp;: Digital&nbsp;Signature</strong></p>
    <p>A digital signature is a way to authenticate the authorship of a file. Only <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> and <a href="/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> fonts are capable of being signed with a digital signature as the signature is stored in an <a href="/node/79620" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType Table</a> named <a href="http://www.microsoft.com/typography/otspec/dsig.htm"><span class="caps">DSIG</span></a>. In the case of TrueType <a href="/node/12946" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">flavored</a> <span class="caps">OT</span> fonts, the digital signature is the singular key which determines whether or not the font is marked as an OpenType font with the <em>O</em> icon. This means that <span class="caps">TT</span> flavored <span class="caps">OT</span> fonts that are not signed will not display the <em>O</em> icon and <span class="caps">TT</span> fonts that are signed but have no other <span class="caps">OT</span> features will display the <em>O</em> icon.</p>
    <p><strong>Additional Articles</strong><br><a href="http://www.microsoft.com/typography/developers/dsig/"><em>Digital Signatures for Font Files</em></a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/29770">How to get an OpenType icon on a OpenType <span class="caps">TTF</span> Flavored font&nbsp;file?</a></p>
