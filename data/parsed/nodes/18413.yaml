    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Technical%20Info" class="freelinking" rel="nofollow">Technical Info</a> : Digital Signature</strong></p>
    <p>A digital signature is a way to authenticate the authorship of a file. Only <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> and <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> fonts are capable of being signed with a digital signature as the signature is stored in an <a href="/wiki/OpenType%20Table" class="freelinking" rel="nofollow">OpenType Table</a> named <a href="http://www.microsoft.com/typography/otspec/dsig.htm" rel="nofollow">DSIG</a>. In the case of TrueType <a href="/wiki/flavor" class="freelinking" rel="nofollow">flavored</a> OT fonts, the digital signature is the singular key which determines whether or not the font is marked as an OpenType font with the <em>O</em> icon. This means that TT flavored OT fonts that are not signed will not display the <em>O</em> icon and TT fonts that are signed but have no other OT features will display the <em>O</em> icon.</p>
    <p><strong>Additional Articles</strong><br>
    <a href="http://www.microsoft.com/typography/developers/dsig/" rel="nofollow"><em>Digital Signatures for Font Files</em></a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/29770" rel="nofollow">How to get an OpenType icon on a OpenType TTF Flavored font file?</a></p>
