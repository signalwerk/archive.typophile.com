  html: <p>What do you all think of this face being used as the font for a type heavy, tire ad campaign that's trying to sell to women? I'm recommending that the client use a more grotesk or geometric sans with a serif if they want an secondary typeface. Any comments on this Caramella font?</p><div class="imageWrap"><img src="http://typophile.com/files/caramella_4755.jpg"></div><p></p>
