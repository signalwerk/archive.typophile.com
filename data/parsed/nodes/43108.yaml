  html: |-
    <p>This may not be possible, but are there any modern (or old-but-still-usable) fonts that mimic the look and feel of early computers? I am especially looking for something that is similar (in style at least) to <a class="freelinking external" href="http://memory-alpha.org/en/wiki/Image:TranswarpComputerDisplay.jpg" rel="nofollow">this computer display</a>. Now, that is quite obviously a pixel-y raster font. <a class="freelinking external" href="http://memory-alpha.org/en/wiki/Image:Kobayashi_Maru_data.jpg" rel="nofollow">This example</a> seems to be more of a vector-y type.</p>
    <p>Again, I am not necessarily looking for these exact shapes, but rather some fonts that evoke the idea of 1980s computer interfaces in a similar fashion.</p>
    <p>Any tips or comments would be appreciated.</p>
