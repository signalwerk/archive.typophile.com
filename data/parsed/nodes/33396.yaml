  html: |-
    <p>I was pondering the influence of contemporary faces on the perceptions of “proper” letter forms. Specifically, the trend to include “some serifs” to distinguish things like the l, 1, I and i in sans faces. Nick mentions the trend <a href="https://web.archive.org/web/20080906232326/http://typophile.com/node/33301">in this other thread</a>. Another example might be the little right angle hook on some Js.</p>
    <p>Are there serifed faces that have begun to draw from this trend? Examples, thoughts?</p>
