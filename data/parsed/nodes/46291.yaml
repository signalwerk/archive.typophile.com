    html: |-
      <p>VERSION ONE: </p>
      <p>'brick and masonry' does not curve enough with circle above. Too much red. I would (for now at least) work in black and white. I think the beige shadow in LAWRENCEVILLE is distracting. 'Supply' should not be oblique. Lines connecting 'SUPPLY' also do not match the seal outline.</p>
      <p>VERSION TWO:</p>
      <p>'LAURENCEVILLE' needs to be lower to give equal space on top and bottom.</p>
      <p>My preference right now is version two but mainly due to the more balanced color pallete.</p>
