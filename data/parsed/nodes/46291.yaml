    html: |-
      <p>Make it work in one color first. Also balance the weights of the strokes in relation to each other and the type weight.</p>
      <p>Watch out with beige and white together--they tend to blend together.</p>
      <p>I would also work on other versions with a seal with whatever icon you decide and keep the business name in straight text next to the seal. It will read better, because right now you are trying to squeeze a hell of a lot of text into the seal.</p>
      <p>David</p>
