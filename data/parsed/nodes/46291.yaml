    html: |-
      <p>These look really striking. My initial criticism is towards the illustration of the brick and trowel. I think it's a little too soft, and almost reminds me of a icon instead of an illustration.</p>
      <p>Plsu, I agree with Robert... that text needs some breathing room. It's slammed into a space that's a little too tight. And I don't like how the Brick &amp; Masonry sit so close to supply. Even bricks have a bed of mortar to keep thing spaced. Don't use an italics font along a curve either, it's a bad design choice.</p>
      <p>I do like the color palette, you have a solid foundation to build from with these first designs. It just needs some technical tweaking.</p>
