    <p>Hello,</p>
    <p>I am working on a logo for a brick and masonry supplier and was looking for some feedback.</p>
    <p>The logo had to be in a round "seal" format to pay homage to the parent companies logo.</p>
    <p>It has to convey tradition and history while having a modern touch to look to the future.</p>
    <p>Thank you for taking time to look/comment.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LB_3532.jpg"></div><p></p>
