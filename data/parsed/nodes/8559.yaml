    html: "<p> I have been exposed... <br> <br>The lc \"g\" is my favorite Latin character, maybe *because* it's also the most challenging (in its optimal -bicameral- form). In terms of trickiness, it's a distant first place - no other character comes remotely close (the classical, splayed UC \"M\" is pretty tough too, but much of it is more technical than aesthetic). If you look carefully, you'll see that an alarming proportion of fonts which are just fine otherwise... happen to have a weak \"g\"! In some [rare] cases you can see that the designer realized he was out of his league, and took an existing \"g\" from a master designer and modified it. <br> <br>Other reasons I focus on the [bicameral] \"g\": <br>1. It's a model of how best to promote readability in a font (or more accurately, an alphabet). <br>2. I happen to think its true potential is still largely obscured, in two ways: the stroke weight distribution of its lower stroke is typically very unnatural in most fonts (we're [superficially] used to the awkwardness, but that doesn't make it OK for the reader); closing the lower bowl is detrimental (it makes the structure too different than the rest of the alphabet), but very few designs enjoy an open-bottom form. <br> <br>BTW, you guys are lucky: Armenian has about a dozen characters of the trickiness-level of the \"g\"... <br> <br>hhp </p>"
    html_clean: "<p> I have been exposed... <br> <br>The lc \"g\" is my favorite Latin character, maybe *because* it's also the most challenging (in its optimal -bicameral- form). In terms of trickiness, it's a distant first place - no other character comes remotely close (the classical, splayed UC \"M\" is pretty tough too, but much of it is more technical than aesthetic). If you look carefully, you'll see that an alarming proportion of fonts which are just fine otherwise... happen to have a weak \"g\"! In some [rare] cases you can see that the designer realized he was out of his league, and took an existing \"g\" from a master designer and modified it. <br> <br>Other reasons I focus on the [bicameral] \"g\": <br>1. It's a model of how best to promote readability in a font (or more accurately, an alphabet). <br>2. I happen to think its true potential is still largely obscured, in two ways: the stroke weight distribution of its lower stroke is typically very unnatural in most fonts (we're [superficially] used to the awkwardness, but that doesn't make it OK for the reader); closing the lower bowl is detrimental (it makes the structure too different than the rest of the alphabet), but very few designs enjoy an open-bottom form. <br> <br>BTW, you guys are lucky: Armenian has about a dozen characters of the trickiness-level of the \"g\"... <br> <br>hhp </p>"
