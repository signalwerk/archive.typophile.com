  html: "<p>hello and good typography year ( 2002 ) to all. This is the other part of project, the width Condensed of my RS Van. This apresentation show the differents weights for different kinds of soluction in the same family. The x-eight is extra tall and the stress of letters are vertical. I  corrected the lc/g which is better for small sizes. I had been finnished the <br>expessures for use as a display font but I must correct tham for print to the future. Any comments? Thank's for the last advices ( Van Expanded ) which give other perception for continue my work. Regards to all. / Ricardo Santos <br> <br>GIF / JPG: <br><img src=\"http://www.typophile.com/forums/messages/29/615.jpg\" alt=\"Text Description\"></p>"
