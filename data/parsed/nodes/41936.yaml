      <p>Come on, we all are just old geezers, with our habits set in stone — people who mind their spelling, are polite (stand up for elderly citizens and cripples), stop for a red light; in other words the generation that’s on its way out.</p>
      <p>Barbarians at the gate — nothing new here.</p>
      <p>(Where is that irony mark on my keyboard…?)</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
