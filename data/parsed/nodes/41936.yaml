      <p>Okay, some thoughts:<br>
      There are fonts/weights that say ‘heavy’ more explicitly; look for ‘ultra bold’, ‘heavy’, ‘black’, ‘super’ weights<br>
      Do you really need several instances of the word? Does it help to communicate the idea of ‘heavy’?<br>
      The layering and the varying sizes/colours imply a three-dimensional space. Does this help?<br>
      Does the overall image say ‘heavy’, or rather ‘messy’, ‘crashing’, ‘falling’?</p>
