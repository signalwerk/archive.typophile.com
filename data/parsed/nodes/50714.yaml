      <p>A ballpark would START at around AU$2000 - that doesn’t take into account relative factors for legitimate NFPs or NGOs.</p>
      <p>And continuing about relativity... - i.e, how much value is placed on the project, it’s an image and identity - a face - for the organisation.<br>
      Then you need to factor in things like; research (there always should be if the project is of any value to the business - the designer needs to get up to speed with the company, service/s, structure, audience &amp; visual language, and competition etc. to understand it.) then ... project timing; specific requirements; approval processes; project management etc.</p>
      <p>You’re paying for the creative’s/designer’s time as a creative/visual thinker and designer - if you think that time is worth $100 you’ll get a $100 result - because you will get A result. No doubt about it. Having said that, if you value a designers time at $100 ... you won’t have any choice but to be happy with whatever the results are. Clipart with a font might work ... who knows.</p>
      <p>I’ll refer you to the triangle ... you can have any two sides included in your project. Which two are most important to you?<br>
      </p><div class="imageWrap"><img src="/files/fast-good-cheap_5922.gif"></div><p></p>
      <p>You’re paying for the creative’s/designer’s TIME of finding an effective and appropriate solution to your requirements and their EXPERIENCE in finding that effective and appropriate solution.</p>
      <p>It’d be great if it were a fixed price industry ... but it’s not. There are too many variables involved.</p>
      <p>At the end of the day, one thing never changes. You get what you pay for.</p>
      <p>—————<br>
      <strong>Paul Ducco</strong><br>
      <a href="http://www.solid-creative.com/identity.htm">Logo Design Melbourne</a></p>
