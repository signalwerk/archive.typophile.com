    <p>I am designing a logo for my friends at the Health Blogs Observatory.<br>
    This is a non profit organization with the main goal to publish a web portal which would gather health/medical bloggers from all over the world and do some research.</p>
    <p>I tried a lot of things and then I settle for three things.</p>
    <p>1. Health - cross<br>
    2. observatory - binoculars<br>
    3. web portal - computer, arcade type font</p>
    <p>Is this worth anything? Does anything show potential?<br>
    I am not a professional designer, so I would really appreciate your advice.</p>
    <p></p><div class="imageWrap"><img src="/files/logo_3559.png"></div><p></p>
