      <p>I understand your thinking behind this. There are two problems for me. Firstly I think the red and white and the cross symbol represent first aid rather than a wide range of medicine and health. Also the “computer, arcade type font” is from a much earlier age of computers than blogging, and its fuzzy edges don’t help. Look for something bolder, clearer and more up-to-date.<br>
      I would get rid of the cross but keep the binocular form. Try a warm, vibrant green or orange rather than red to look healthy and lively, and make it smaller if you are going to keep it to the side of the lettering.</p>
