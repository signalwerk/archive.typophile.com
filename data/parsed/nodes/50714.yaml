      <p>In my opinion, you’re approaching this design way too literally. The concept for the blog isn’t visually congruent and to try and create a visual image to go along with the blog is honestly, out of your skill range. Not to offend.</p>
      <p>I think you’d have better luck creating a clean logotype and matching it with health related images (stock photography perhaps) in the banner of the site.</p>
      <p>Also, to reiterate what Jay said earlier, avoid the “computer/arcade” type. It’s a poor concept to assume that if you’re creating a logotype for a website it has to look “techy or futuristic”. Personally, I’d use a friendly slab serif typeface like Soho, Archer, Zine Serif or Officina Serif. Any of these fonts would bring a confident look without seeming too cold or tiresome.</p>
