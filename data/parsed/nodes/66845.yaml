    <p>Ah, the science of selecting a public face. So, why did you choose your avatar (or opt not to)?</p>
    <p>Please tell me to mind my own business if you like but I'm genuinely interested in how your mind works... </p>
    <p>Mine's fairly self-explanatory (incuding the lacklustre typography!) but some aren't. For example, why are some smaller than the suggested size?</p>
    <p>I'm really intrigued by some avatars...</p>
