      <p>Penumbra Sans Std | Bold by Lance Hidy</p>
      <p>My web-avatar mark is bold in form to stand apart, while using an<br>
      open-ended colour system, which borrows existing forum colors to blend in. (i.e. 'twitter-blue', 'typophile-red'...) A crop from my logotype, this secondary mark is intentionally unclear and seems to reference ‘ro ren’ — a curious, abstract alliteration mnemonic.</p>
      <p>I like the idea of a fragments not telling the whole story...</p>
      <p>or</p>
      <p>My ego is too big to fit my entire name in that little square...</p>
