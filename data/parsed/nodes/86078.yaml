      <p>The top "pill" doesn't read as a pill. I would suggest never running lines directly through letters. Also, I would try to freehand the script rather than using a script font (or at least use a font with different "d"s).</p>
      <p>The second one's a better start, but I'm not a fan of the monogram. It's too busy. In my opinion, if you eliminate the monogram and leave just the full name you'd have a pretty good basis for a logo.</p>
      <p>Another alternative: Have you considered <a class="freelinking external" href="http://drugs.medsort.com/Drugs/Images/PillAtlas/C1040035wtmk.jpg" rel="nofollow">that pills have acronyms/IDs printed in a simple font like this</a>? That kind of style, a horizontal pill with just "DAS" might be convincing, with an optional wordmark underneath. That gives you a versatile logo, a simple one (the pill) for branding and then a full version when appropriate. That's a good system for a long name.</p>
