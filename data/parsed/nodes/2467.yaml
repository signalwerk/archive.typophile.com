    html: "<p>Nathan,  <br> <br>as the name says, the Priavte Use Area is for private use. So there is no, and should be no \"generally accepted convention\". I strongly advise agains using uniXXXX for PUA.  <br> <br><a href=\"http://partners.adobe.com/asn/tech/type/unicodegn.jsp#4\" target=\"_blank\">http://partners.adobe.com/asn/tech/type/unicodegn.jsp#4</a> says  <br> <br>\"This specification supports the mapping of glyph names to strings that contain private use area scalar values. For example, the names \"Ogoneksmall\" and \"uniF6FB\" both map to the string U+F6FB. <br> <br>This specification does not include, imply nor assume any particular usage of the PUA; it merely permits to name glyphs such that the restored character strings include PUA code points. It is up to the producers and consumers of glyph names to establish an agreement on the PUA usage. <br> <br>Font designers should note that establishing this agreement with users of general purpose fonts can be difficult. It is likely that not all tools manipulating character strings built from glyph names will correctly implement the PUA usage, and this can lead to incorrect functionality. It is therefore recommended, for general purpose fonts, that all glyph names convert to strings that do not contain PUA characters.\" <br> <br>However, <a href=\"http://partners.adobe.com/asn/tech/type/unicodegn.jsp#6\" target=\"_blank\">http://partners.adobe.com/asn/tech/type/unicodegn.jsp#6</a> says: \"For glyphs which do not correspond to any character in the Unicode standard, the name will not have any technical usefulness.\"  <br> <br>The idea behind the uniXXXX convention is, among others, that people who use the font can consult the Unicode Standard to find out what the particular character \"means\". For example, uni0105 can be deciphered as \"LATIN SMALL LETTER A WITH OGONEK\".  <br> <br>Since the Private Use Area mappings do not correspond to characters that are permanently encoded in Unicode, it doesn't make sense to call them uniXXXX, since the Unicode standard does not contain any \"resolution\" on what XXXX means in this case. So it's better to use a meaningful, human-readable name such as \"arrowup\" or \"smallbird\".  <br> <br>Adam</p>"
    html_clean: "<p>Nathan,  <br> <br>as the name says, the Priavte Use Area is for private use. So there is no, and should be no \"generally accepted convention\". I strongly advise agains using uniXXXX for PUA.  <br> <br><a href=\"http://partners.adobe.com/asn/tech/type/unicodegn.jsp#4\" target=\"_blank\" class=\"link-external\">http://partners.adobe.com/asn/tech/type/unicodegn.jsp#4</a> says  <br> <br>\"This specification supports the mapping of glyph names to strings that contain private use area scalar values. For example, the names \"Ogoneksmall\" and \"uniF6FB\" both map to the string U+F6FB. <br> <br>This specification does not include, imply nor assume any particular usage of the PUA; it merely permits to name glyphs such that the restored character strings include PUA code points. It is up to the producers and consumers of glyph names to establish an agreement on the PUA usage. <br> <br>Font designers should note that establishing this agreement with users of general purpose fonts can be difficult. It is likely that not all tools manipulating character strings built from glyph names will correctly implement the PUA usage, and this can lead to incorrect functionality. It is therefore recommended, for general purpose fonts, that all glyph names convert to strings that do not contain PUA characters.\" <br> <br>However, <a href=\"http://partners.adobe.com/asn/tech/type/unicodegn.jsp#6\" target=\"_blank\" class=\"link-external\">http://partners.adobe.com/asn/tech/type/unicodegn.jsp#6</a> says: \"For glyphs which do not correspond to any character in the Unicode standard, the name will not have any technical usefulness.\"  <br> <br>The idea behind the uniXXXX convention is, among others, that people who use the font can consult the Unicode Standard to find out what the particular character \"means\". For example, uni0105 can be deciphered as \"LATIN SMALL LETTER A WITH OGONEK\".  <br> <br>Since the Private Use Area mappings do not correspond to characters that are permanently encoded in Unicode, it doesn't make sense to call them uniXXXX, since the Unicode standard does not contain any \"resolution\" on what XXXX means in this case. So it's better to use a meaningful, human-readable name such as \"arrowup\" or \"smallbird\".  <br> <br>Adam</p>"
