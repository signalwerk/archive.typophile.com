  html: <p>Is there a generally accepted convention for naming glyphs relegated to the Unicode Personal Use Area? I.e., when I automatically generate names in FL, I get stuff like '_14' as opposed to 'uniF701'. Is that OK, or should they be in the form 'uniXXX'?</p>
  html_clean: <p>Is there a generally accepted convention for naming glyphs relegated to the Unicode Personal Use Area? I.e., when I automatically generate names in FL, I get stuff like '_14' as opposed to 'uniF701'. Is that OK, or should they be in the form 'uniXXX'?</p>
