      <p>The current version of TLF does not support Contextual Alternates.</p>
      <p>The OpenType functionality currently supported can be leveraged using the classes in the <a class="freelinking external" href="http://livedocs.adobe.com/flex/3/langref/flash/text/engine/package-detail.html" rel="nofollow">flash.text.engine</a> package.</p>
      <p>If you haven't done so yet, try the <a class="freelinking external" href="http://labs.adobe.com/technologies/textlayout/demos/" rel="nofollow">Text Layout Demo App</a>. The TLF team has recently made available its <a class="freelinking external" href="http://blogs.adobe.com/tlf/2009/12/new-and-updated-tlf-samples.html" rel="nofollow">source code on their blog</a>.</p>
      <p>The <a class="freelinking external" href="http://forums.adobe.com/community/opensource/tlf" rel="nofollow">Text Layout Framework</a> forum is available for specific questions.</p>
