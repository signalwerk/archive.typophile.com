    <p>Hi there,</p>
    <p>has anybody got an idea how I can embed a font with OpenType Contextual Alternates in flash? Is there a possibility to implement OpenType in Flash or do I have to do it with Actionscript? And can I somehow use these Contextual Alternates in Flash?<br>
    I am trying to do something like this in flash:</p>
    <p><a href="http://www.underware.nl/site2/index.php?id1=liza&amp;id2=test" title="http://www.underware.nl/site2/index.php?id1=liza&amp;id2=test">http://www.underware.nl/site2/index.php?id1=liza&amp;id2=test</a></p>
    <p>Thanks a lot!</p>
