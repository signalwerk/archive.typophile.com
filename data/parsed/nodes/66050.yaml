      <p>&gt; <em>Is it working on cs3?</em></p>
      <p>Flash CS3? No, but Contextual Alternates are available in InDesign, Illustrator and Photoshop CS3.</p>
      <p>&gt; <em>And does anybody know a tutorial or something to get started?</em></p>
      <p>There's an <a class="freelinking external" href="http://www.adobe.com/devnet/flex/articles/text_layout_framework.html" rel="nofollow">introduction to TLF in Flex at the Adobe Developer Connection site</a> and the <a class="freelinking external" href="http://blog.flexexamples.com/" rel="nofollow">Flex Examples site</a> has a ton of code snippets. Hope this helps.</p>
