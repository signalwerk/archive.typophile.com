      <p>By going against the flow I put myself in contempt of the majority. I apologize for that. This thread shouldn't be about me. The best strategy for dealing with it is to, 1) Turn the other cheek, let my comments stand and continue with discussion of the real topic, 2) Those who want to criticize me should start another thread RfC: is Arbo forthright?</p>
