    date_raw: 17 Jun 2008 — 1:06pm
    date: 2008-06-17T13:06:00
    votes: null
    html: |-
      <p>Ruben, viva!</p>
      <p>I got to know this forms mainly in old portuguese books I found, but they come from inscriptions on portuguese monuments of "estilo manuelino". Their are very beautiful actually, and i think that the baroque way that these calligraphic forms, tending to the uncial capitals, are composed together (and not as page capital) is very portuguese. We can find this forms carved in some monuments but I would like know more, maybe on "Forais" we can see good examples as well.</p>
