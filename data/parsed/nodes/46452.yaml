      <p>@Rui: That'll go nicely with Orbe! Although this one sort of feels french, to me. Or maybe english… nah, probably french. It's too “pretty” to be english. :P<br>
      @James: That's too much, really… I really appreciate (and desperately need) compliments, but that's just too much! :P BTW, are you sure you really want a job? I know I don't. I'd much rather ride my bycicle, design type and play the guitar every day just for the fun of it. And as long as I can, that's exactly what I'll do. :P</p>
      <p>I think my favourite so far is Orbe. There's something familiar about familiarity… :P I think it's striking, all quirky and flourished and yet still quite homogenous. AND it makes me feel comfortable. :P Seriously, I really like it.</p>
