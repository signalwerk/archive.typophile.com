    html: |-
      <p>I’m a bit slacking off with my typefaces at the moment, but this is some of the more promising (to me) stuff I’ve been working on – there’s more, but you wouldn’t want want to see it. </p>
      <p>Clara, a slightly rounded sans:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/clara_6735.png"></div><p></p>
      <p>Berto (working name, it will be probably changed), an extra-light/extra-bold/big x-height sans:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/berto_5629.png"></div><p></p>
      <p>Some numbers in the modern/pointed-nib pen style with extreme contrast (hairlines are 1em unit wide) and influences from all over the place, from Figgins (Elephant, Falstaff) to Didot, Bodoni etc. I’ve been drawing these in the past few days, as an exercise (8 is not done yet):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/modern-numbers_5707.png"></div><p></p>
    html_clean: |-
