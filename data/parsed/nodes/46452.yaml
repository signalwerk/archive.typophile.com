      <p>Since I had gotten in a tizzy about the US Post Office building lettering, I set straight to work on creating it as a font. I matched the cap forms exactly although some need some tweaks. Once I had gotten most of the caps done I decided to see just for kicks if I could make a style appropriate lowercase and was pleased with my result . . . It has lots of problems right now but I hope to get it in good order soon!</p>
