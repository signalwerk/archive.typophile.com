    html: <p>I don't mean to rain on the grafik parade, but to me it is like the other "trendy" fashion/design mags like IdN and such. Baseline is excellent, it is an absolutely beautiful piece of work, a thing of beauty. You could also try Emigre if you like American pro-active design/type theory and critique.  <br> <br>kris.</p>
