    <p>This logo was designed for us by an advertising agency designer who has since left the agency. The CD has no record of the work, and I have had no luck trying to identify the font. One special feature of the font is the letter "k". Does anyone know the name of this font?</p><div class="imageWrap"><img src="http://typophile.com/files/MM_logo_5030.jpg"></div><p></p>
    <p>Thanks,</p>
    <p>Tom Kerr</p>
