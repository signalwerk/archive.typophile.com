      <p>WingDings was definitely designed by Holmes &amp; Bigelow way before Win3.1 it was finished when Microsoft and IBM were testing font technologies for 'Presentation Manager' back about 1989-90 because we had to test hint them in Intellifont for Apple!  </p>
      <p><a href="http://www.wired.com/techbiz/media/news/2001/09/47042?currentPage=1" title="http://www.wired.com/techbiz/media/news/2001/09/47042?currentPage=1">http://www.wired.com/techbiz/media/news/2001/09/47042?currentPage=1</a></p>
      <p>and I can tell you for sure the glyph order was always the same up until the final Release Candidate of Windows 3.1. We printed out the Ikarus outlines and had them in a book for the production process. When Windows 3.1 shipped we found that Microsoft added the Windows logo to the final glyph position and this was probably why other glyphs were moved. I later found out (when we were doing Webdings) that the legal department 'hit the roof' when they found out the Windows logo was added. They told me DEFINITELY NO you can not put the Internet Explorer logo into Webdings.</p>
