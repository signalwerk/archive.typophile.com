    <p>First of all, if this is in the wrong forum let me know or move it accordingly.  Secondly, I'm sorry if this is a weird question to ask, but I am wondering what is said about the wingdings series from IBM platforms ca. Windows 3.1 - But in thinking about issues of design construction and use of negative space in lettering, how do the dingbat symbols composing the wingdings series stack up?  </p>
    <p>Are these symbols chosen based on popularity, familiarity, etc.  What are the reasons for iconographic preference given to certain symbols over others, and how were they finally decided upon as "canonical" wingdings?  How often are you using symbols from the original Wingdings lineup?  </p>
    <p>What are these symbols, who was involved in the designing, and how did it all come about?</p>
