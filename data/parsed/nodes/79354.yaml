      <p>The original plan for Windows 3.1 was to ship a large set of the Lucida® fonts from Bigelow &amp; Holmes. But alas, those were the days of 5-1/4" floppies and we ran out of space for those fonts on the Windows disks. Three of the fonts from the Lucida collection were Lucida Arrows, Lucida Icons, and Lucida Stars. We decided to take some of the glyphs from each of these fonts and combine them into one font, Wingdings.</p>
      <p>The rest of the Lucida fonts shipped in parallel to Windows 3.1 in the Microsoft TrueType Font Pack for Windows.</p>
