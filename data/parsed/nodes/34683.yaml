      <p>Question marks, or question marks in boxes? In what software? On what operating system?</p>
      <p>The most likely explanation is that you have managed to generate a font with an unrecognised encoding. Probably you have not assigned correct Unicode values to the Greek glyphs and/or the 8-bit charset is not recognised by the software you are using.</p>
