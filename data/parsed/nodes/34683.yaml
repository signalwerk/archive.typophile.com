    date: 2007-06-24T23:00:00
    date_raw: 24 Jun 2007 — 11:00pm
    votes: null
    html: <p>You need to ensure that your Grek characters have the correct Unicode encoding. Is your font for polytonic, or only for monotonic? As a start, set FontLab's Font Window to Codepage mode, and select the Windows 1253 Greek codepage. This will give you a template for correctly encoding monotonic Greek.</p>
