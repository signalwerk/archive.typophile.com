  html: |-
    <p>Since this morning the new font <strong>Symbojet</strong> is <a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/symbojet/" rel="nofollow">alive at MyFonts</a>. (Sorry for the delay, it was just a MF pipeline issue.)<br>
    .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Sym_banner_1_5303.jpg"></div><br>
    .<br>
    <strong>Symbojet</strong> is the first font product offering letters and symbols alike on the very same high level of design and based on <strong>standard encoding</strong>.<br>
    .<br>
    <div class="imageWrap"><img src="http://typophile.com/files/zumBaeren_4693.jpg"></div><br>
    .<br>
    Composing like that can now be done out of one single font. The combination of text with signage was never as easy and elegant.<br>
    Both fonts <cite>Symbojet Regular</cite> and <cite>Symbojet Bold</cite> contain an equal number of alphabetic and pictographic glyphs. Most of the symbols are based on the new Unicode-6.0 codepoints and are identical in both fonts.<br>
    Each font contains about 340 letters (Latin for all European languages, Greek), 124 alphanumeric characters (circled and squared A–Z and 1–10), 400 symbol glyphs (340 of it having UC/ISO codepoints) and 12 ornaments.<br>
    Altogether there are more than 1000 glyphs in either font.<br>
    Here is a selection of the pictographic repertoire:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/themat_bsp_6206.jpg"></div><br>
    (Please go to the MyFonts site for English samples.)<br>
    .<br>
    Nearly all pictographic glyphs are related to an underlying circle-square-scheme. So they can get combined with circle or square shield glyphs:<br>
    .<br>
    <div class="imageWrap"><img src="http://typophile.com/files/geschildete_fbg_3774.jpg"></div><br>
    You’ll ﬁnd those combining glyphs in both fonts, at the bottom of listing in glyph palette windows.<p></p>
    <p>Last but not least, you can do not only serious wayfinding and public signage work with Symbojet. Use it for eye-catchig restaurant menus, beach banners, private mailings and funny birthday cards as well.<br>
    .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Symbo_banner_ship_5845.png"></div><br>
    .<br>
    Read more about Unicode 6.0 additions <a class="freelinking external" href="http://typophile.com/node/75120" rel="nofollow">in this thread</a>.<br>
    Über Unicode 6.0 und Symbojet: <a class="freelinking external" href="http://www.myfonts.de/2010/10/unicode-6-0/" rel="nofollow">auf Deutsch bei MyFonts.de</a><br>
    Mehr <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idcat=137" rel="nofollow">Hintergrundinformation</a> bei Signographie.de<p></p>
