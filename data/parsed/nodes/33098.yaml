      <p>&gt; maximebuechi</p>
      <p>I think it's an Americanism for 'Nice', 'Cool', 'Sweet' etc.. although it's been lost in translation, there's certainly an irony which has been found.</p>
      <p>My only problem is the illegibility of the address beneath 'Rick Shaw Stop' due to the stroke on the gothic type combined with the small .pt size.</p>
      <p>Other than that its certainly going to draw attention.. I just hope it's long enough for people to decipher what it actually says.</p>
