    html: <p>Word does not support Latin script ligatures because it does not call the function in the Uniscribe shaping engine that implements the OT ligature features.</p>
    html_clean: <p>Word does not support Latin script ligatures because it does not call the function in the Uniscribe shaping engine that implements the OT ligature features.</p>
