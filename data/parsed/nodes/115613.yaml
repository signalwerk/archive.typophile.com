    html: |-
      <p>You're not getting good advice here, I suggest you ask somewhere else. I tested two ways of doing what you wanted, checking the results in both OpenOffice and InDesign. I neither own nor use MS Word. </p>
      <p>Both techniques worked to a degree -- addressed and solved the particular problem you mentioned --  and took less than a half an hour. The half hour includes limited testing. Both had compromises. One way, you loose all OpenType functionality with numbers (arbitrary fractions, true-cut superiors, any number style other than default, etc.). The scaling functions with numbers that MS Word uses should still work -- they did in InDesign. And why wouldn't they?</p>
      <p> The other way you retain these as OT features, (except for oldstyle proportional), at the expense of having the wrong kerning with the *default* numbers. The result is not perfect, but then neither are tabular lining numbers.</p>
      <p>To do the job properly is, as has been said, a lot of work. Basically, portions of the features code has to be rewritten. That would include some work with the classes used in writing features.</p>
      <p>As far as who controls the license, I imagine Brill commissioned the fonts from John, so Brill controls any and all license matters. I would ask them. You don't want to be in violation of either US or European law, right?</p>
      <p>I imagine these two techniques are obvious, but in any case, I personally am not going to list them unless Brill, &amp; as a courtesy (not legal requirement) John, both say it's OK.</p>
      <p>Edit:</p>
      <p>BTW, I'm amazed that Word won't let you associate another font with note calls. That by itself would solve the problem you mentioned.</p>
