      <p>My question is, Is it possible..? Not, is it legal? (Which is not to say that I don't care about the law.) The tweek is to overcome a limitation of Microsoft Word, namely that Open Type number styles cannot be applied to the footnote number reference. Whatever the default number style of the font is, that style will be used in Word for the footnote references. I would prefer to use tabular lining, but to do this, I have to make tabular lining the default number style in the font.</p>
      <p>None of this is for commercial use (it is for papers in college), and it would not, in my humble opinion, add functionality to the font. It changes a default "setting." It does not give the font more functionality.</p>
