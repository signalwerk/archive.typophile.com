    html: |-
      <p>1. Yes, Brill own these fonts, they invested a lot of money in them, they're making them freely available for non-commercial use, and yes, they have the right to determine the license permissions under which that happens. That said, I believe the no-modifications clause exists mainly to prevent unauthorised messing with the design, and contra Hrant's comments about 'if you want them to keep an eye on you', I would suggest contacting Brill and explaining what you want and why. They are among the most reasonable and accommodating people I have ever dealt with.</p>
      <p>2. Technically, I'd say that the easiest way to get to where you want from where you're starting is to edit the cmap table. You could use TTX, which is free, to dump the cmap table to XML, edit it in a text editor to re-map the appropriate Unicode values to the tabular lining numerals, and then use TTX again to merge the edited cmap table back into the font. You will lose some functionality in OpenType Layout if you do this, because the GSUB lookups for numeral style presume that the default style is oldstyle proportional (which Brill wanted because that is the most common usage in their publications), so changing to other styles and arbitrary fraction support will break. However, it seems to me that for your purposes you could simple edit the font name table too (also using TTX), and simply make a separate font for use in Word footnote style.</p>
