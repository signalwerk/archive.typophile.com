      <p>For me a good* typographer is one who leverages the true power of typefaces, and this can only be done by first appreciating this power, as opposed to pretending that what's on hand is fine. Many people don't realize they're not good* because they're blind to this power. Of course compromise (including on cost) is always necessary, but pretending one is not compromising is not.</p>
      <p>* Maybe I should say "great", because "good" can imply passable; the sort of person that merely makes the wheels keep moving. Just like most type designers, mind you.</p>
      <p>Most of all, a typographer can't really help his users if he has little respect for the field of type design; it's another form of blindness. Vignelli for example is a horrible typographer for this reason.</p>
      <p>hhp</p>
