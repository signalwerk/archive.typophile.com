    html: |-
      <blockquote><p>
      Thank you, for the pleistoscenic view.
      </p></blockquote>
      <p>Using the ttx file as a text file instead of a structured xml file reminds indeed of another era. In this case though, all that is required is swapping strings representing glyph names;  where those names appear in the structure tree is irrelevant; treating them as text thus seems appropriate; for instance the GPOS table (or its "dump" if you will), whatever its complexity, remains correct after the swaps, without any effort. </p>
      <p>Concerning Charles' remark that there is no onum feature, there is a substitution table for "lnum" that takes text figures and replaces them by lining figures. Since the glyph names have been swapped, the effect of the table is to do just the opposite, and the feature needs to be renamed "onum" (this is in the case Proportional Lining is chosen as default).</p>
