    <p>I came across a strange thought of kerning in real life. I was thinking where else can we find kerning beside type? And saw we use kerning eveywhere. It's just called differently. One name for it in real life would be "double measure" when you apply different principals/acting/behaviour/etc. with different ethnicity/gender/etc.</p>
    <p>Can you come up with kerning in other areas of life? Mechanics perhaps? Other professions?</p>
    <p>Seeing that kerning exists eveywhere made me think why the **** did <cite>they</cite> name it "kerning" in type design?</p>
