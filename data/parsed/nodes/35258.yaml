      <p>littera: <cite>why the **** did they name it “kerning” in type design?</cite></p>
      <p>Well, the question is really why do <em>we</em> call it "kerning." <em>They</em> had something slightly different in mind when the term was coined.</p>
      <p>"Kerning" is one of those terms that has been leveraged from one technology to the next, to the point where it's evolved quite a bit from its origins, not unlike "leading."</p>
      <p>Here's a relevant excerpt from Harry Carter's translation of <cite>Manuel Typographique,</cite> the 18th-century manual on typefounding by Fournier le Jeune.</p>
      <p>"Another essential operation performed with the same knife is <em>kerning.</em> This is a matter of hollowing out beneath the little projecting strokes which overlap the shanks upon which the letters are cast. In the roman alphabet this occurs in the case of f, [long-s], ff, [double-long-s]. These characters have isolated beaks which are only supported by being joined on by the face to the rest of the letter. Kerning consists in hollowing out the under-sides of these beaks so that they may overhang the letter which adjoins them. When these little beaks are kerned, the edge of the knife is passed up and down the shank on the kerned side."<br>
      [from <cite>Fournier on Typefounding</cite> (1764), Harry Carter, trans., 1930]</p>
      <p>The term in Fournier's original is <em>crénerie (n.)/créner (v.)</em>, from which, I believe, the English "kern" is derived. Moxon is earlier than Fournier. He would have gotten his information probably via the French, possibly the Dutch. I wonder if he coined the English term. I'm not sure why the dictionaries cite <em>carne</em> as the French source. I'd be curious to see what they use to support this derivation.</p>
      <p>Because of the tremendous work involved and the fragility of the results, few characters were designed to have kerns (i.e. overhanging parts) in metal. </p>
      <p>It is only when you come to the photo and digital ages, with virtual sidebearings, that you begin to encounter the kind of widespread contextual repositioning that we think of as kerning today.</p>
      <p>-- K.</p>
