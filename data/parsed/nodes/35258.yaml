      <p>An interesting bit related to the definitions already posted above...</p>
      <p>The <a href="http://www.amazon.com/Glossary-Typesetting-Chicago-Writing-Publishing/dp/0226183718/ref=sr_1_1/105-4304836-8465243?ie=UTF8&amp;s=books&amp;qid=1184896845&amp;sr=1-1" rel="nofollow"><em><strong>Glossary of Typesetting Terms</strong></em></a>, after its definition of <strong>kern</strong>, refers the reader to the term </p>
      <p><strong>Mortise</strong>: (1) In <strong>handset type</strong>, to "pull" letters closer together by cutting away metal. The term has been to some extent carried over into computer composition, in which <strong>kern</strong> is sometimes applied to either adding or reducing space between character pairs; mortise always means reducing space. (2) When <strong>repro</strong> paper is mounted on boards, to cut a hole in the repro paper so that another piece of repro paper with a correction fits snugly into it. It is wise to mortise corrections in repro paper when they are quite small (a letter, a word, etc.) so that they will stay in place. Also called <em>cutting in</em>.</p>
    html_clean: |-
