      <p>OED</p>
      <p>Verb<br>
      trans. To furnish (a type) with a kern; to make a kern on. Hence {sm}kerner, a workman who makes or adjusts kerned type.<br>
      1683 MOXON Mech. Exerc., Printing xix. {page}5 Amongst the Italick-Letters many are to be Kern'd, some only on one side, and some both sides. The Kern'd-Letters are such as have part of their Face hanging over one side or both sides of their Shanck. Ibid. xiii. {page}4 They..left the Letter-Kerner, after the Letter was Cast, to Kern away the Sholdering. 1824 J. JOHNSON Typogr. II. 23 Some founders have been more liberal than others in kerning letters. 1865 Standard, Police News (May) [A witness described himself as a kerner in Messrs..'s letter foundry].</p>
      <p>Noun<br>
      [For *carn, a. F. carne ‘projecting angle, nib of a quill pen’, a northern form (for *charne):{em}L. cardinem hinge.] </p>
      <p>A part of a metal type projecting beyond the body or shank, as the curled head of f and tail of j, as formerly made, and parts of some italic letters. (Cf. KERNED ppl. a.2)<br>
      1683 MOXON Mech. Exerc., Printing xix. {page} 7 Every next Letter is turned with its Nick downwards, that the Kern of each Letter may lie over the Beard of its next. 1824 J. JOHNSON Typogr. II. 655 Kern of a Letter, that part which hangs over the body or shank.</p>
      <p>These are the meanings that apply to printing. Mechanics shim.</p>
      <p>Tim</p>
      <p>{edit to put this post after Eric’s}</p>
