      <p>Have you looked at Nick Curtis's fonts? -- he seems to specialize in the Deco era. See <a class="freelinking external" href="http://www.moorstation.org/typoasis/designers/curtis/pages/q_r.htm" rel="nofollow">Rialto</a>, which has serifs, and <a class="freelinking external" href="http://www.moorstation.org/typoasis/designers/curtis/pages/p.htm" rel="nofollow">Park Lane</a>, which doesn't. The collection at TypOasis are his early free fonts.</p>
      <p>- Mike Yanega</p>
