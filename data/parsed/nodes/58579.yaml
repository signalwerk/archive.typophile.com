    <p>I can't seem to find a good match for these deco fonts. In the "NORD EXPRES" graphic there are two separate typefaces (probably originally customized) and in the "DREMIE" graphic, that typeface is actually "Dremie" from Flat-It Foundry but I need a very similar one, and not Angie Black Open (too flare-serif). Of course, everyone's help is much appreciated :)</p>
