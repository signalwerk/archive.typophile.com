    html: |-
      <p>That NORD EXPRES lettering looks hand-drawn (the E's in EXPRES don't even match).In NORD, the O is the smallest letter, and the N has an odd mix of flat and pointed vertices, and the R and D look as if they have been squashed. I can't think of any font with such features, but maybe someone else can.</p>
      <p>- Mike Yanega</p>
