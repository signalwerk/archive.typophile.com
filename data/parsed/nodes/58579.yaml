    html: <p>Thanks for the Nick Curtis and TypOasis leads - very nice. I'm really curious about the "Nord Expres" fonts though - that big R is distinctive as well as the flat top/sharp bottom "N". And the last S in "Expres" is special too. I suppose I could customize Futura for the "Expres" type, but I'd really like to find the perfect typeface matching "Nord". Vonnes Black Extended is similar, but not enough. And WhatTheFont online NEVER finds matches! Any help appreciated.</p>
