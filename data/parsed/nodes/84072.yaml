    <p>The hole in this b’logue and my truancy from TypeCon since 2009 has clearly left me with some ’splaining to do. I went back to school; this after years of considering myself done with it. There to welcome me back to the design program we had begun together was the graduating class of seniors. With a flush schedule and an abbreviated program I finished up a year behind them. Friends pictured below interspersed: <a href="http://www.reganfredjohnson.com/" rel="nofollow">Regan Johnson</a>, <a href="http://www.joeylasko.com" rel="nofollow">Joey Lasko</a>, <a href="http://www.facebook.com/people/Miriam-Altamira/100000217034089" rel="nofollow">Miriam Altamira</a>, <a href="http://colinpinegar.com/" rel="nofollow">Colin Pinegar</a>, &amp; <a href="http://r-emerson.blogspot.com/" rel="nofollow">Rory Bruggeman</a>.<br>
    <a href="http://www.fontshop.com/education" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontshop.com/education" rel="nofollow"><img src="http://typophile.com/files/Class_photo_5240.jpg"></a></div><br>
    <a class="freelinking external" href="http://www.fontshop.com/education" rel="nofollow">Above: page out of <em>Meet Your Type,</em> a very well-put-together resource for the young discoverer of typography.</a><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Morgan-1_4296.jpg"></div><br>
    <a href="http://typophile.com/node/70978" rel="nofollow"><div class="imageWrap"><img src="http://typophile.com/files/morgan-2_6061.jpg"></div></a><p></p>
    <p>Going away to school again I took the opportunity to change my life around some. I had had it with doing good work. Great work was the stuff I now hoped to busy myself with and getting to it came with a sense of urgency. I pursued the hard stuff; stuff I found particularly challenging, like writing well about art &amp; the humanities, making sophisticated use of color, designing in themes or material with which I had no experience. With individual projects I stuck to the rules:</p>
    <blockquote><p>Let it be something you haven't tried before<br>
    about which you care<br>
    &amp; let it be fun
    </p></blockquote>
    <p>The highest highlight was making lots of new friends and reconnecting with plenty old ones. It was great to see <a href="http://jedart.blogspot.com" rel="nofollow">Jed Henry</a> again. He's now moved on from animation and become a children's author &amp; illustrator. Designer <a href="http://www.designbymann.com/" rel="nofollow">Chris Mann</a> is consistently good. In his work each piece takes full ownership of the elements from whence it is made. Additionally, it was my pleasure to study letterpress printing and typography under fine printer &amp; private publisher <a href="http://trystpress.com" rel="nofollow">Rob Buchert</a>. Rob asks his students to keep a photographic journal of surprise letterforms they encounter.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Letter_6148.jpg"></div><br>
    <a class="freelinking external" href="http://en.wikipedia.org/wiki/F" rel="nofollow">Above: F.</a><p></p>
    <p>A particularly fun project required showing up to class with a pair of scissors; We were not told why. The student was to take one large press-sheet per letter in his name, and go to — cutting out the letters. ‘Don’t draw on it, just cut.’<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/David-name-drop-000_4723.jpg"></div><br>
    This served as a base exercise for the text face I'm presently working on during my short apprenticeship with Mark van Bronkhorst. <a href="http://www.flickr.com/photos/nondescriptes/5980508155/" rel="nofollow">More on this soon</a>.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/David-name-drop-001_5325.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/card-back_4561.jpg"></div><br>
    And if you can, why not print a card in seven spot inks?<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/card-front_4856.jpg"></div><br>
    Above: Four-bar correspondence cards. The seventh spot ink, rubber-base black, turned out to be a bad idea; That's why you don't see it here.<p></p>
    <blockquote><p>No matter how good the school is, his education is in his own hands. All education must be self-education. Let him realize the truth of this, and no school will be a danger to him. &nbsp;<a href="http://books.google.com/books?id=o_9IRsRNiPcC&amp;q=%22All+education+must+be+self-education%22#v=snippet&amp;q=%22All%20education%20must%20be%20self-education%22&amp;f=false" rel="nofollow">Robert Henri</a>.</p></blockquote>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/diploma_3542.jpg"></div><p></p>
    <p>I'm now working a short apprenticeship in type design &amp; production with <a href="http://www.mvbfonts.com/browse/sans" rel="nofollow">Mark van Bronkhorst</a>, to whom I respect no small lot, and upon whom I dryly put the title ‘master,’ for effect.</p>
