    <p>Hi,</p>
    <p>Please help me identify the font at the RCA logo on the picture - the one in the circle with a lightning bolt. It's an old font from a tube box, probably there's not a present-time correspondence.</p>
    <p>Are there any current similar fonts I could use in a logo design?</p>
    <p>Thank you for your help.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/6ar5rca2k.jpg" width="800" height="531" alt="">
