      <dl>
      <dd><em><br>
      Forgive me my ignorance, but on MyFonts.com each font has supported languages specified. Since I've never submitted to MyFonts yet, I'd like to know is it done automatically, or each author describes language support manually?<br>
      </em></dd>
      </dl>
      <p>Maybe they use an internal tool or rely on information sent by the designer. But note that MyFonts does not identify all languages supported by a given font. The advanced search just offers 13 group of languages, most based on scripts. In the technical info they list common character sets, again related to a handful of languages.</p>
      <dl>
      <dd><em><br>
      I want to fill an almost empty niche of supporting minor languages, at least of ethnic minorities, particularly those in Russia.<br>
      </em></dd>
      </dl>
      <p>Begin here: <a class="freelinking external" href="http://en.wikipedia.org/wiki/Category:Languages_of_Russia" rel="nofollow">Wikipedia: Languages of Russia</a></p>
      <p>I am doing exactly this with my font projects, besides supporting Cyrillic variations to Bulgarian and Serbian. AFAIK, there are just four or five typefaces with this kind of support, and none of them is really goood.</p>
      <p>Unhappily, when I begun to do this, I do not registered my findings in an organised way –just made a large table with needed glyphs and some notes, but didn't listed glyphs by language.</p>
      <p>Some less known minority languages are poorly documented and it is really difficult to find data about the proper way to design their glyphs. But as a native Russian, you are entitled to find much more than I did.</p>
      <p>This would give an idea (sorry for the large image):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2014-01-23_10-06-27b_4115.png"></div><p></p>
      <p>I know, quite a strange goal to a Brazilian, but I am addict to Cyrillic. If you want further contact, can reach me at contato ( ) if . pro . br.</p>
