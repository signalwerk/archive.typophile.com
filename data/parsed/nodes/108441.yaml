    html: <p>I don't know of any automatic way to do it. Your face supplies the glyphs for scripts (Latin, Cyrillic, etc), of which various subsets are used to write various languages. It would be nice to know that language Foo uses all of SomeBlock except Bar, with the addition of Baz and Qux from AnotherBlock. That would make it easy to say, "My font provides full support for language Foo", which it going to be more relevant to most people than saying, "My font provides full support for the Latin script". This information may be partially compiled somewhere (e.g. "Latin alphabets" on the English Wikipedia), but it's a manual verification process.</p>
    html_clean: <p>I don't know of any automatic way to do it. Your face supplies the glyphs for scripts (Latin, Cyrillic, etc), of which various subsets are used to write various languages. It would be nice to know that language Foo uses all of SomeBlock except Bar, with the addition of Baz and Qux from AnotherBlock. That would make it easy to say, "My font provides full support for language Foo", which it going to be more relevant to most people than saying, "My font provides full support for the Latin script". This information may be partially compiled somewhere (e.g. "Latin alphabets" on the English Wikipedia), but it's a manual verification process.</p>
