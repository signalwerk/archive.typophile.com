      <p>Thank you Chris for your advices and Igor for such wonderful resources, they will help me a lot, definitely!</p>
      <p>I want to fill an almost empty niche of supporting minor languages, at least of ethnic minorities, particularly those in Russia.</p>
      <p>Forgive me my ignorance, but on MyFonts.com each font has supported languages specified. Since I've never submitted to MyFonts yet, I'd like to know is it done automatically, or each author describes language support manually?</p>
