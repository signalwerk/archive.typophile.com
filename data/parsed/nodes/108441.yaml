      <p>Thomas</p>
      <p>I had a look at your xml file. Nice initiative! The number of languages you cover is impressive.</p>
      <p>However your code for French (my mother tongue) does not appear to match what I read on your blog. If the characters listed in <code>subsetting-codepoints</code> are considered as accessory, then you have put there characters that are so frequently used in French that they are on the French azerty keyboard as well as the Canadian French keyboard, namely çèàùé (for the others you need to use a dead key); they are certainly not accessory.</p>
      <p>The French alphabet is very clearly listed on the German Wiki <a href="http://de.wikipedia.org/wiki/Französisches_Alphabet">Französisches Alphabet</a> as well as the French Wiki <a href="http://fr.wikipedia.org/wiki/Alphabet_français">Alphabet français</a>, where characters specific to French (to be added to what you call "English") are listed separately.</p>
      <p>So, the small characters needed to be in the font to contain the French alphabet (and my understanding is that they should appear in <code>scanning-codepoints</code> similarly to what was done for Portuguese) are (using intervals)</p>
      <p>0x00E0,0x00E2,0x00E6-0x00EB,0x00EE,0x00EF,<br>
      0x00F4,0x00F9,0x00FB,0x00FC,0x00FF,0x0153</p>
      <p>The corresponding capitals are</p>
      <p>0x00C0,0x00C2,0x00C6-0x00CB,0x00CE,0x00CF,<br>
      0x00D4,0x00D9,0x00DB,0x00DC,0x0178,0x0152</p>
      <p>That list assumes, of course, that if <code>parent</code> is <code>English</code> then the scanning code points of English are inherited.</p>
      <p>Michel</p>
