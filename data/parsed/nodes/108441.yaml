      <p>Some less known minority languages are poorly documented and it is really difficult to find data about the proper way to design their glyphs. But as a native Russian, you are entitled to find much more than I did.</p>
      <p>This would give an idea (sorry for the large image):</p>
      <p><img src="/sites/default/files/old-images/2014-01-23_10-06-27b_4115.png"></p>
      <p>I know, quite a strange goal to a Brazilian, but I am addict to Cyrillic. If you want further contact, can reach me at contato ( ) if . pro . br.</p>
