    html: |-
      <p>There is no such tool. I did a wide research about languages and alphabets between 2010 and 2013 for my own font project. Unhappily, no source is complete. If you have interest, here are some good information and sources:</p>
      <p>The Wikipedia article about <a href="http://en.wikipedia.org/wiki/Latin-derived_alphabet" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Latin-derived alphabets</a> is the nearest single source I know. For deeper information, you can take a look on <a href="http://en.wikipedia.org/wiki/A" title="Click to visit an external URL." class="freelink freelink-external freelink-external">each letter</a> and language article published in Wikipedia. Each letter article brings a table with diacritical combinations.</p>
      <p>A good place regarding Latin script is <a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this post</a> from Adobe's Typblography. You may also find useful <a href="http://diacritics.typo.cz/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this site about diacritics</a>.</p>
      <p>Regarding transliterations, there is an <a href="http://transliteration.eki.ee/index.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">excellent archive</a> made by Thomas Pedersen. It's almost hidden in the Estonian Language Institute site.</p>
      <p>You can also consider to do the contrary: define which languages you want to support and then include the proper characters. Unicode blocks are heterogeneous and the Latin ones brings together glyphs needed to less common European languages besides Asian languages, Medieval characters and even Roman signs.</p>
      <p>For example: Latin Extended Additional includes 1E9E, the German uppercase double S. It seems ok to include that. In the same block you find the Vietnamese accented and double-accented vowels. Of course, you would ignore them if Vietnamese support is out of your target. This Unicode block also adds several precomposed combinations to support Indic, Hebrew and Cyrillic transliterations. Again, you must choose if transliterations would be supported.</p>
      <p>A similar definition must be made about Phonetic alphabets, currency and letterlike symbols. This will take some research, but you will not include unnecessary glyphs.</p>
      <p>Some additional data about Unicode blocks:</p>
      <ol><li>
      Latin B has mostly glyphs to African languages, but also mix rarely used European glyphs and Pinyin transliteration.
      </li>
      <li>
      Latin C brings glyphs to Cyrillic transliterations and old African orthographies. 2C6D and 2C70 are needed to complete African support, the remaining probably are out of your scope.
      </li>
      <li>
      Latin D has many Medieval additions and support for old orthographies. Probably the whole block is unnecessary to you.
      </li>
      <li>
      Latin Additional is a mess. Define the languages and look in detail this block.
      </li>
      <li>
      IPA and Phonetic block. Just needed to phonetic support.
      </li>
      <li>
      Super and subscripts. Add the whole block if you want to keep up to date with contemporary type trend.
      </li>
      <li>
      Currencies. The very basic set is: dollar, cent, pound, yen, currency (generic) and euro. An improved set also includes thai, cólon, naira, won, new sheqel, kruvinia (hryvnia), tenge, new rupee (20B9) and tugrik. Most of others are historical.
      </li>
      <li>
      Letterlike. nº, liter, estimated, TM, and Ohm are basic. Others may be included or not according to your scope, but are not essential.
      </li>
      <li>
      Punctuation. Basic: 2002, 2003, 2013, 2014, 2018 to 2022, 2026, 2027, 2032, 2033, 2039, 203A, and 2044.
      </li>
      </ol><p>Here in Typophile you will find a number of quite informative threads. Some:<br><a href="http://typophile.com/node/67458" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://typophile.com/node/67458</a><br><a href="http://typophile.com/node/84563" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://typophile.com/node/84563</a><br><a href="http://typophile.com/node/77983" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://typophile.com/node/77983</a></p>
      <p>The thread where I presented <a href="http://typophile.com/node/67787#comment-402703" title="Click to visit an external URL." class="freelink freelink-external freelink-external">my own font project</a> has some good information about this, kindly gave by fellow typophilers. The link above points to where this discussion begun.</p>
      <p>Other threads I also begun may be useful:<br><a href="http://typophile.com/node/74164" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Unicode and diacritics</a><br><a href="http://typophile.com/node/78082" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eng and hooked N</a><br><a href="http://typophile.com/node/73886" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Currencies and others</a><br><a href="http://typophile.com/node/71504" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Greek and Cyrillic</a><br><a href="http://typophile.com/node/78088" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Slashed letters</a></p>
    html_clean: |-
