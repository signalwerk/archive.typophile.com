    html: |-
      <p>There is no such tool, and such a tool would never be complete.</p>
      <p>In addition to the links posted by Igor Freiberger:</p>
      <p>- the eki-letter database (oldish, but still good): <a class="freelinking external" href="http://www.eki.ee/letter/" rel="nofollow">http://www.eki.ee/letter/</a></p>
      <p>- unicode cldr has a list of exemplar characters per language (base, extended, punctuation etc). You can read it from the database or browse:</p>
      <p><a class="freelinking external" href="http://cldr.unicode.org/cldr-features" rel="nofollow">http://cldr.unicode.org/cldr-features</a><br>
      <a class="freelinking external" href="http://cldr.unicode.org/index/charts" rel="nofollow">http://cldr.unicode.org/index/charts</a><br>
      <a class="freelinking external" href="http://www.unicode.org/cldr/charts/dev/by_type/index.html" rel="nofollow">http://www.unicode.org/cldr/charts/dev/by_type/index.html</a><br>
      <a class="freelinking external" href="http://www.unicode.org/cldr/charts/dev/by_type/core_data.alphabetic_information.html" rel="nofollow">http://www.unicode.org/cldr/charts/dev/by_type/core_data.alphabetic_information.html</a></p>
      <p>Unicode cldr only contains information about the most used languages, and their "official" characters in current orthography or typography. E.g. there is no information about more exotic languages like Yiddish. Old orthography like long-s (most European languages in 18th century) or LETTER U WITH SMALL E ABOVE (used in German instead Umlaut U+DIARESIS) is not supported.</p>
