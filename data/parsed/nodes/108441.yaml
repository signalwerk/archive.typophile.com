      <p>Thomas,</p>
      <p>I noticed a few other things</p>
      <p>In Cyrillic you list 108 characters including 65 from Russian.<br>
      Why not just list the 43 new characters that are added to Russian since Russian is parent?</p>
      <p>For Ukrainian, you use Cyrillic as parent; 8 of the 9 characters you list in the scanning-codepoints for Ukrainian are already in Cyrillic. Why not choose Russian as parent for Ukrainian?</p>
      <p>In the languages Tajik, TalyshCyrillic, TurkmenCyrillic, Tuvan, Udmurt you have Cyrillic as parent-name; the attribute "parent-name" is used nowhere else. Was that intended? Maybe parent should have been Russian (or Cyrillic)?</p>
      <p>The scanning codepoints you list for Urdu are those I see in the file src/orthographies/Urdu.h of the fontaine sources. However the fontaine file fontface.cpp contains the code</p>
      <p>   // Arabic:<br>
         //<br>
         if(_checkOrthography(Arabic::pData)){<br>
                 _checkOrthography(Farsi::pData);<br>
                 _checkOrthography(Urdu::pData);<br>
                 _checkOrthography(Kazakh::pData);<br>
                 _checkOrthography(Pashto::pData);<br>
                 _checkOrthography(Sindhi::pData);<br>
                 _checkOrthography(Uighur::pData);<br>
         }</p>
      <p>I would personally have put Arabic as parent for each of those languages before checking any further.</p>
      <p>Michel</p>
