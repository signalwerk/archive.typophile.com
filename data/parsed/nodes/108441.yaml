    <p>Hello everybody, I have a question and I can't find an answer in the internet.</p>
    <p>I'm in a process of designing a typeface - <a href="http://dribbble.com/goloub/projects/177343-TT-Nord ">TT Nord</a>. It's not the final design by that link. Anyway, what bothers me is that I've drawn many glyphs, including Cyrillic extended and Latin extended a and b and others. Is there any way to know what languages does my font support? Maybe a script or some kind of a web service? </p>
    <p>Thanks in advance?</p>
  html_clean: |-
    <p>Hello everybody, I have a question and I can't find an answer in the internet.</p>
    <p>I'm in a process of designing a typeface - <a href="http://dribbble.com/goloub/projects/177343-TT-Nord " class="link-external">TT Nord</a>. It's not the final design by that link. Anyway, what bothers me is that I've drawn many glyphs, including Cyrillic extended and Latin extended a and b and others. Is there any way to know what languages does my font support? Maybe a script or some kind of a web service? </p>
    <p>Thanks in advance?</p>
