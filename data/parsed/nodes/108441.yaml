      <p>“There is no such tool.” There are actually several such tools!</p>
      <p>Fontaine was first released in March 2009. <a href="http://fontaine.sourceforge.net/">http://fontaine.sourceforge.net/</a></p>
      <p>Speakeasy in October 2010. <a href="https://github.com/typekit/speakeasy">https://github.com/typekit/speakeasy</a></p>
      <p>Neither had all that impressive a data collection, so I drew on both those sources and added a LOT more data at Extensis. We released that data in April of last year, download it here:<br><a href="http://blog.webink.com/custom-font-subsetting-for-faster-websites/">http://blog.webink.com/custom-font-subsetting-for-faster-websites/</a></p>
      <p>It is not perfect, but it covers over 150 languages and character sets. We use the data internally with a proprietary scanning tool.</p>
      <p>I do agree with Igor that “no source is complete,” and neither is my data. But it is considerably better than nothing. Most type designers just want to figure out either what characters to add to cover a given language, or what languages are supported by a given character set, and have a one-stop answer to the question. For the languages covered by this data—and there are a lot of them—it should be reasonably solid. Where I am suspicious of the data source or have not done sufficient cross-checks, that is noted in the file.</p>
