    html: |-
      <p>Typophile is amazing. Some ingredients in its success:</p>
      <p>1. There are lots of folks, but not too many for a community: hundreds who look at it regularly, daily.</p>
      <p>2. You have to love type with a passion to want to frequent it. Even people who disagree about everything else know they are among the rare birds who share their love of type. Which engenders a certain, um, pure goodness. </p>
      <p>3. People who work on type and with type are in front of computers all day--and sometimes night--quite a few don't have colleagues around to talk with about their work.</p>
      <p>4. The most experienced and knowledgeable people in the field and novices--and everyone in between--post regularly. The mix keeps things fresh, lively and informative. </p>
      <p>5. And thanks to Joe, Jared, Christian, the moderators, who made it and keep it functional.</p>
