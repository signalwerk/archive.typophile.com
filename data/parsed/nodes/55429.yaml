      <p><cite>I’m wondering: is Twitter something one can use (and benefit from) casually, or does it require dedicated attention?</cite></p>
      <p>That entirely depends on how one uses it. For some people it’s a casual screwball chatroom. For others—particularly writers with thousands or tens-of-thousands of followers—it’s turning into an incredible new search tool. I think that Twitter will be like Friendster and MySpace—interesting, but a little too raw, and waiting to be replaced by the next generation of tech.</p>
