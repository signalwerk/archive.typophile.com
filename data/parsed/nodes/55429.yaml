    html: |-
      <p>"What is it about those sites that is so conducive to a community feeling"</p>
      <p>A community.</p>
      <p>EVERYONE wants to build a community web site. But only those that establish a community from the get-go get anywhere. As such it's a bit of a catch-22 and often, more than anything, a bit of luck.</p>
      <p>Facebook took off because it was developed in an incubator of a defined and attentive audience...Harvard students. </p>
      <p>Twitter took off because it's a service, not necessarily a content repository. It's the service that is successful moreso than any of the content. </p>
      <p>I'd hazard a guess that Typophile, like many narrow-topic discussion boards, was successful due to having a topic of interest that wasn't being addressed in any other forum or web site.</p>
