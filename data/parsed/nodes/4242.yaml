    html: "<p>Wow, nice! Yeah, that's definitely the RdR. I'm not really a revivalist, but when an entire category of type design is so neglected, there's certainly good reason to at least make one digital instance. Like in Thom's Thai project it would be perfect. But I wouldn't revive the RdR itself, it was still only a formative effort (look how conventional the italics are for example) - I would revive the later, higher form, done by Tuleu (at Deberny) - a design as obscure as it is phenomenal. <br> <br>Arnhem: You're not saying it's an RdR, are you? <br> <br>hhp <br></p>"
    html_clean: "<p>Wow, nice! Yeah, that's definitely the RdR. I'm not really a revivalist, but when an entire category of type design is so neglected, there's certainly good reason to at least make one digital instance. Like in Thom's Thai project it would be perfect. But I wouldn't revive the RdR itself, it was still only a formative effort (look how conventional the italics are for example) - I would revive the later, higher form, done by Tuleu (at Deberny) - a design as obscure as it is phenomenal. <br> <br>Arnhem: You're not saying it's an RdR, are you? <br> <br>hhp <br></p>"
