    votes: null
    html: "<p>Although Fournier is known to have been inspired by the RdR in making his own fonts, his stuff was much more conventional in nature. The RdR style is very distinctive: it is a \"constructed\" letter, with vertical stress, high contrast, a smallish x-height, and most notably double serifs on the ascenders. It also exhibits a short line on the lc \"el\" (which apparently Grandjean introduced because the constructivism was leading to confusable forms), but to me that's not critical to its nature. <br> <br>Here's a metal RdR-style font, the \"Types de Charles X\" of the Imprimerie Nationale: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33237.gif\" alt=\"Charles\"> <br> <br>But it doesn't have the double serifs on the ascenders. <br> <br>hhp <br></p>"
    html_clean: "<p>Although Fournier is known to have been inspired by the RdR in making his own fonts, his stuff was much more conventional in nature. The RdR style is very distinctive: it is a \"constructed\" letter, with vertical stress, high contrast, a smallish x-height, and most notably double serifs on the ascenders. It also exhibits a short line on the lc \"el\" (which apparently Grandjean introduced because the constructivism was leading to confusable forms), but to me that's not critical to its nature. <br> <br>Here's a metal RdR-style font, the \"Types de Charles X\" of the Imprimerie Nationale: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33237.gif\" alt=\"Charles\"> <br> <br>But it doesn't have the double serifs on the ascenders. <br> <br>hhp <br></p>"
