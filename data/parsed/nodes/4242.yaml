    html: "<p>Hrant, <br> <br>The following are samples of the \"Ordonnance du Roy\" from Northwest Louisiana's library: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33247.jpg\" alt=\"type sample 1\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33248.jpg\" alt=\"type sample 2\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33249.jpg\" alt=\"type sample 3\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33250.jpg\" alt=\"type sample 4\"> <br> <br>The document is dated as 1731. This sample looked more like Fournier to me, but the one you're showing looks almost like Didot. The short line on the \"el\" is present in both samples. <br> <br>Are you considering a revival?</p>"
    html_clean: "<p>Hrant, <br> <br>The following are samples of the \"Ordonnance du Roy\" from Northwest Louisiana's library: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33247.jpg\" alt=\"type sample 1\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33248.jpg\" alt=\"type sample 2\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33249.jpg\" alt=\"type sample 3\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/33250.jpg\" alt=\"type sample 4\"> <br> <br>The document is dated as 1731. This sample looked more like Fournier to me, but the one you're showing looks almost like Didot. The short line on the \"el\" is present in both samples. <br> <br>Are you considering a revival?</p>"
