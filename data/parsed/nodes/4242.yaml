    html: "<p>Addison, you're right - I was just wondering if you saw something in Arnhem that alluded to the RdR somehow - not because I'd get on your case :-) but because your eyes are different and you might see things I don't. <br> <br>Tuleu was the bastard son of Deberny, and he ran the foundry in the last quarter of the 19th century. He took the RdR style to its pinnacle*, only to be undercut by a double whammy: the Arts &amp; Crafts revival of Morris; and Gustave Peignot's obsession with display typography: the Deberny and Peignot houses merged in 1923, and Gustave's charisma and business sense caused all of the wonderful old Deberny text faces to get tossed out. <br> <br>* The italic is staggering in its purity. <br> <br>&gt; part of the climate Arnhems roots were reacting to <br> <br>Without re-reading that New-Series piece, I guess what you're saying then is that Arnhem is an Elzevir. Interestingly, the best Elzevirs were also made in the second half of the 19th century! <br><a href=\"http://www.typophile.com/forums/messages/30/20897.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/20897.html</a> <br> <br>hhp <br></p>"
    html_clean: "<p>Addison, you're right - I was just wondering if you saw something in Arnhem that alluded to the RdR somehow - not because I'd get on your case :-) but because your eyes are different and you might see things I don't. <br> <br>Tuleu was the bastard son of Deberny, and he ran the foundry in the last quarter of the 19th century. He took the RdR style to its pinnacle*, only to be undercut by a double whammy: the Arts &amp; Crafts revival of Morris; and Gustave Peignot's obsession with display typography: the Deberny and Peignot houses merged in 1923, and Gustave's charisma and business sense caused all of the wonderful old Deberny text faces to get tossed out. <br> <br>* The italic is staggering in its purity. <br> <br>&gt; part of the climate Arnhems roots were reacting to <br> <br>Without re-reading that New-Series piece, I guess what you're saying then is that Arnhem is an Elzevir. Interestingly, the best Elzevirs were also made in the second half of the 19th century! <br><a href=\"http://www.typophile.com/forums/messages/30/20897.html\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/30/20897.html</a> <br> <br>hhp <br></p>"
