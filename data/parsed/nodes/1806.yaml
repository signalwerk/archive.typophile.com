    html: <p>[start with] -  two major schools - about the Swiss design philosophy - one in Basel, the other in Zurich. Armin Hofmann typifies the former's approach, Josef Muller-Brockmann the latter's.  and of course - Wolfgang Weingart (Basel) !!!</p>
