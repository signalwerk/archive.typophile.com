  html: <p>Hi im a graphic design student. i have always been impressed with Swiss typopgraphy, does anyone know any resources or books that actually teach you how to get such good compositions and typographic layouts? i really want to learn, as I always strive for elegance in design, and i never really know where things "go" as such. </p>
