    html: |-
      <p>Hello Rajeshksethi,</p>
      <p>If you are still struggling with this problem, you should take a look at the following blog</p>
      <p><a href="http://typophile.com/node/49832" rel="nofollow">http://typophile.com/node/49832</a></p>
      <p>I have been using IndicPlus to help me out with Indic Scripts in InDesign. If you are using CS2 or CS3 version of InDesign then this is your only option. If you are using CS4 then there are some other plugins as well and you could also use Java Scripts. To me, IndicPlus seems to be the best as it is fast and easy to use and also supports Numbering Styles in all Indian Languages. Above all the company developing this is Indian, so they understand and respond very well to my questions.</p>
      <p>Link to IndicPlus<br>
      <a href="http://metadesignsolutions.com/IndicPlus.html" rel="nofollow">http://metadesignsolutions.com/IndicPlus.html</a></p>
      <p>Hope this Helps<br>
      Michael</p>
