    <p>Hi everyone! </p>
    <p>I need to choose the Colour for my latest logo. The logo is of a Renewable Energy Company called "Natural Power" and it needs to communicate profesionality and eco-friendliness. </p>
    <p>For this purpose we already established the form of it, a simple text with a leaf recall on the word "Natural".Also, the word power is in bold to emphatize it's meaning.</p>
    <p>We are now arrived at the colouring stage.</p>
    <p>You can find two pictures with 3 concepts each. Wich one do you think will be more effective, taking in consideration that it will be printed on cardboard with a little emboss going down? Wich one does it seem to fit better to the eco friendly image of the company in yours opinion? Thanks for taking the time</p><div class="imageWrap"><img src="http://typophile.com/files/DUE_3844.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/DUE_3844.jpg"></div><p></p>
