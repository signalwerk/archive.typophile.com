    date: 2011-01-14T14:53:00
    date_raw: 14 Jan 2011 — 2:53pm
    votes: null
    html: <p>Would be good to know what that competitor's logo looks like. Happy accident perhaps as this is a nice idea but WAY too subtle in present execution to read. Agree looks like printing error (the stem looks like a printing hickey) and subliminally just pick up 'a's don't match which is worrying. Leaf 'a' just looks weak and increase of negative space through adaption unbalances word. Adjusting letterspacing between 'r' and 'a' may help but may have knock on effect as you are playing with 'colour' of face. Need MUCH more contrast between 'a's to work. Very hard to get them to contrast and balance convincingly. Could repeat leaf as bowl of 'a' for both occurrences. Still tough to pull off (perhaps why you have been so tentative?) but nice idea to explore. I would definitely work on keeping outer shape of 'a' intact and just changing inner, thus leave integrity of letter shape alone. This would help make an inner leaf shape clearer and much more obvious what it is. Whole letter would be emphasised but not distorted (this is hard to explain in just words!). I would keep question of typeface and leaf shape open to discover what worked. Is this leaf idea what your competitor has already done in some way though? In which case don't go there.</p>
