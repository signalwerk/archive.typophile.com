    <p>Hello everyone – I'm looking for a cut of monotype modern that has a high contrast stroke thickness, for magazine titling. Any suggestions?</p>
    <p>I have been looking at interview magazine as a ref BUT I think this is a bespoke cut for interview?</p>
    <p>Any help would be appreciated. Thanks.</p>
