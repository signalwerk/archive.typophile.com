      <p>Fabien Baron ditched my Scotch after a couple of issues.<br>
      It was perhaps too idiosyncratic in its detailing for him, compared to the typical "clean" finish of display moderns, of which there are many, e.g. Montalbano's "Yo" family.<br>
      <a href="http://www.terminaldesign.com" title="http://www.terminaldesign.com">http://www.terminaldesign.com</a></p>
