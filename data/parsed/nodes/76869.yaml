    html: |-
      <p>I like the sub. It's cute, in a good way. The irony really comes through! </p>
      <p>None of them feel like you "nailed" it, but I think it's only minor tweaks that will make the difference. </p>
      <p>The space between the 'u' and the 'r' — especially in the top options — feels too wide, and the 'o' and the 'u' feel too close relative to the other kerning. The 'i' feels like it's floating alone... </p>
      <p>I can definitely say I prefer the centered "creative studio" rather than the almost-right-aligned version. </p>
      <p>The relationship between the size of the text and the sub feels a little awkward in all versions.</p>
      <p>If you draw imaginary guides at the tip of the nose and the tip of the tail and align the text with those, how does that look? Maybe slightly closer kerning overall to give a "fatter" look to the text? I think the bolder text is more in-line with the character of the logo, but something about it doesn't "sit" right, know what I mean?</p>
      <p>Just suggestions and thoughts, I think the sub has tonnes of charm, and it's a great symbol. Please share your counter-thoughts!</p>
