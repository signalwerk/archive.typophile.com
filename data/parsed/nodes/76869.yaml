      <p>I feel like the line weight of the bubbles on the right is inconsistent with the rest.  I would also explore some other compositions.  The name and field gives you a lot of room for a more unexpected composition.  One to try: Scale down the mark about 30%, facing right at a slightly more upward angle, and place it just above and to the left of the <em>c</em> in <em>curiouser</em> - as if it is starting to swim over the word.  </p>
      <p>Kerning: the <em>se</em> is too tight.  <em>ri</em> is problematic.  <em>io</em> too loose.</p>
      <p>I like your icon but it is overpowering things now because of the scale relationships.</p>
