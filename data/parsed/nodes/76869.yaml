      <p>Thanks for responding, Joma. I'm glad you like the mark itself - although I'm not exactly sure what you mean by 'irony' - but thanks! I worked with the kerning a bit, check out the attached version, I think the minor kerning tweaks are nice. I also nudged it over a little bit - what do you think?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/curiouserlogo_rev_6070.jpg"></div><p></p>
      <p>I agree with the centered 'creative studio', although I was hoping to balance out the mark - but I don't think it was working anyway. You're also right about the space between the mark and the text being awkward - but I too am not sure how to resolve it. When I make the text align with the tip and the tail of the mark, it looks like they start to compete with each other. Look for yourself below.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/curiouserlogo_toowide_5380.jpg"></div><p></p>
      <p>You mentioned you would want the text to seem fatter - do you think you would like to see a heavier weight of the font itself - 900 instead of 700?</p>
      <p>Thanks again for your help!</p>
