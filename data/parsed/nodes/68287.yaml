    <p>I am currently doing a logo for Italian restaurant, pizzeria and spaghetteria. Name for restaurant is Bruschetta, located in Zadar, Croatia.</p>
    <p>Client even before brief wanted Kunstler script to use as main typography but I think it is not so appropriate for an Italian restaurant.<br>
    I need alternative for script if client doesn't want to use serifed typeface.</p>
    <p>So I am looking for a script that has organic feel, that has connection with food, vegetables, ingredients. And also convey italian and mediterranean feel.     </p>
    <p>Thought of pairing Bodoni and Bodoni script but I am not sure for now.</p>
    <p>And maybe something like this.</p>
    <p>Thanks everyone.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo_Dine_Italia_2009_4044.jpg"></div><p></p>
