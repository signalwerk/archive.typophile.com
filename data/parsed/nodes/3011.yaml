  html: <p><img src="http://www.typophile.com/forums/messages/29/25796.gif" alt="logo"> <br> <br>This is a logo for a clothing company targeting African American males in thier mid 20s to mid 30s. The concept behind it deals with how society views African American males two different ways (a criminal or a professional) yet it is still the same person. <br> <br>The style is supposed to be a business casual &amp; more sophisticated look - moving away from the street styles of Phat Farm, Sean John &amp; Rocawear. <br> <br>Please give me feedback on the legibility &amp; aesthetics of the logo. Thanks <br> <br>MTStanford</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/29/25796.gif" alt="logo"> <br> <br>This is a logo for a clothing company targeting African American males in thier mid 20s to mid 30s. The concept behind it deals with how society views African American males two different ways (a criminal or a professional) yet it is still the same person. <br> <br>The style is supposed to be a business casual &amp; more sophisticated look - moving away from the street styles of Phat Farm, Sean John &amp; Rocawear. <br> <br>Please give me feedback on the legibility &amp; aesthetics of the logo. Thanks <br> <br>MTStanford</p>
