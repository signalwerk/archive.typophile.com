    html: <p>I will concur with Hrant and Mitchell regarding the joining of the "G"s (and I don't mean "G" in the street slang sense). Right now it looks divided, which kind of contributes to your statement, but I think the joining of the "G"s is a stronger statement in relation to your "still the same person", as Mitchell identified. Also, I wonder what small cap "E"s would look like (about 70% of the vertical height of the "G"s). It might create a nice implied frame for the word, not to mention an interestingly strong shape. <br> <br>Aloha, or shall I say "shaka" in this critique</p>
