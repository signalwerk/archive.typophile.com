      <p>I generally dig the redesign - especially the top third of the paper or so with all the white space &amp; fun-to-digest teasers.</p>
      <p>However, as a former editor &amp; designer for my college paper, I recommend that you always design with your paper's actual content in mind. Also, think about the practical capabilities of the production staff on a nightly basis. Sure, your redesign looks great - but will the staff be capable of putting it together night in and night out? </p>
      <p>It's much easier for amateur editors &amp; paginators to just throw together stacked-up modules (like in the current design). That's basically what happened with our paper, and the head editors were still there till 2 am every night.</p>
      <p>Just something to think about!</p>
