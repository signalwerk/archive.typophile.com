      <p>I really like the new masthead, but find the single word "Echo" too small on the page.<br>
      Imagine this in a newsbox, or a rack in a store.</p>
      <p>The pictures need captions--that's where people's eyes go.</p>
      <p>The left hand column was better in the original, because each item was titled similarly. I have no idea what kind of link the text in those pretty boxes the guy is looking at are supposed to be doing. By making their colours the same as his photo, you imply that he is in some way associated with all three.</p>
      <p>For a meaningful comparison, your redesign should have exactly the same content as the old one, unless there really are plans for editorial change. Are you working closely enough with the editor?</p>
      <p>You're bunching:<br>
      Try to mix sans and serif more.<br>
      Try to spread colour across the page more.<br>
      e.g., Sans dropcaps in colour.</p>
      <p>What will you do when your headline doesn't have eight words all four letters long? Send it back for re-write?<br>
      The picture cropping is arbitrary, constrained by the layout. Why did you chop off the top and bottom of the woman's head? Why the dead space of the man's chest and above his head? Your layout should accomodate pleasingly cropped photos.</p>
      <p>Sorry to be so harsh, the new design has tasty type styling and white space, and the skyboxes are nicely done, but the old one is more functional and the layout a better template (easier to follow) to accommodate the variability of stories, despite its cramped spacing.</p>
