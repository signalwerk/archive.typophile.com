      <p>Luke,</p>
      <p>Since your 8-pager is really a supplement/magazine I think you are pretty close to a solution. I do think there is too much white space at the top on you're latest mock-up. </p>
      <p>The serif headline fonts seems too light for some of the uses. NEW APARTMENTS ANNOUNCED could be in a slightly bolder and wider design. Balanced Budget and J-TERM would benefit from a a bolder more condensed look. The all caps settings in Opinion and World are a bit too large (you've had to hyphenate Christianity, not a great sign if you can't fit a single word in the column)) and while stylish, the all caps compressed setting in these sections as well as the eyebrows might be a bit hard to read. Mixed case perhaps?</p>
      <p>I know this is only a mock-up, but you should pay better attention to the line breaks in the decks. No reason to hyphenate Sundance or Swallow, and the Tuition Dollars deck could be re-broken for a more appealing rag.</p>
      <p>I would also change the drop cap style in the boxed feature to give the page a bit more texture. Maybe a sans serif.</p>
      <p>James Montalbano</p>
