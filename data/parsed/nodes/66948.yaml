    html: |-
      <p>My university's paper did a redesign my sophomore year (I wasn't part of the staff then; now I'm design director), and we were fortunate enough to have money in our budget to license Meta and Meta Serif. I've been told that Chronicle and Whitney were also considered, and the person who spearheaded the redesign says he kind of wishes he had gone with the H&amp;FJ typefaces, but ultimately Meta was cheaper, so that's what they went with. It's worked out rather well for us.</p>
      <p>Your redesign looks great. I'm assuming you're a broadsheet and not a tabloid, or else devoting that much space to the nameplate would be excessive. Centered headlines and drop caps are both interesting choices. I'm not sure I would carry those to the inside of the paper, but they look good on the front page. You also might want to consider something other than New Century Schoolbook, but I understand that you have limited choices.</p>
      <p>Make sure you write a really good design manual. The guys who did the redesign a few years ago didn't write one, so now I'm stuck trying to pull one together before I graduate, and I wasn't even part of the redesign. Don't rush it through. Make sure you think of everything that could need an icon. Also come up with some infographic design standards. Obviously there's going to be some flexibility, but what typefaces should they use (Univers and Bodoni, probably) and what your primary colors are should be well-defined.</p>
      <p>Have you tried doing a parallel layout with each issue? You need to make sure that your redesign is flexible.</p>
      <p>I don't mean to sound condescending; it's just that since you've only been working on it for a few weeks I wanted to make sure you're covering all of the bases. Advice from one newspaper designer to another.</p>
