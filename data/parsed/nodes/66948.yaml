      <p>Ah, memories...</p>
      <p>Back when I was on our college paper we had to set our masthead in 100% cyan as that was the only color the printer could get consistent. ;o)</p>
      <p>As for your redesign, it feels VERY solid and a definite improvement. You have a lot more messaging 'above the fold' but it doesn't feel crowded at all. Nice balance.</p>
      <p>As for the masthead, I like it. If I had to nitpick, I'd maybe suggest playing with the 'the' a bit so it's not as dominate as the 'Echo'. I do like the one-line horizontal lock-up, though, so that might be a challenge to keep it both horizontal, but downplay the 'the' some (perhaps under/over score it?).</p>
      <p>As for the body copy, it looks good. Hard to fully judge at this size, but the article with body copy spanning columns (lower right) feels rather tight with its leading. Perhaps there's a secondary leading setting for those wider copy blocks.</p>
      <p>The only thing that I don't like about it all is the ornate border around the softball article. It feels out of place and extraneous. </p>
      <p>Love the colors, BTW. And nice use of white space.</p>
