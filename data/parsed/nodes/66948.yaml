    <p>Professional typographers and designers,</p>
    <p>I've been redesigning our school newspaper for weeks/months when I can fit it in between my schoolwork.<br>
    I'm throwing it up for critique here.<br>
    I'll also post what I started with.<br>
    Please let me know your honest opinions.<br>
    Is the new design more succesful? If so, why?<br>
    Is the nameplate too edgy?<br>
    I'm eager to hear anything you can offer me.</p>
    <p>Many thanks,</p>
    <p>Luke</p>
