      <p>The design is very good. And it seems viable to a weekly 8-page newspaper, especially if you work with styles for characters, paragraphs, objects and tables.</p>
      <p>As the new project makes good use of white space, you must consider managing a little problem this sample shows. You have two B&amp;W pictures within a small distance. Both are dark and over the main one you did add a graph where dark colours are also predominant. In this case, there is very much darkness in this region.</p>
      <p>You have some options to reduce this darkness. As the header picture is small, it would be better to work on the main one. You may turn it lighter and edit the black background on the right to get a photo in lavish grey. Even a duotone effect is suitable.</p>
      <p>(Of course, this is not an error, I'm pointing just a possible improvement to keep layout cleaner.)</p>
