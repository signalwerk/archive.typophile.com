      <p>The new design is a giant upgrade. I liked it very much.</p>
      <p>Points to improve:</p>
      <p><strong>1</strong>. Sidebar at left must have a greater leading in headlines.</p>
      <p><strong>2</strong>. "World" headline must use the same style adopted in the others (with Univers).</p>
      <p><strong>3</strong>. "In Brief" column could have more white space between the notes.</p>
      <p><strong>4</strong>. Headline in box "Girl from..." breaks the global style, is harder to read and less attractive due to the hyphens. Consider that headline in just one column are hardly good.</p>
      <p><strong>5</strong>. The contour of box "Girl from..." conflicts with the line marking the left sidebar. Try using a light gray background to this box, with no stroke. And then let the sidebar "In Brief" without background.</p>
      <p><strong>6</strong>. The combination Bodoni italic/Univers condensed works very well. So well I would try to repeat the schema within the news area applying all caps Univers in some element there (adding a section name or even just converting author's name to all caps).</p>
