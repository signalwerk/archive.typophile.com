    <p>I have this recurring problem with setting text with InDesign.<br>
    It has to do with my use of soft and hard returns and then needing to change the leading.<br>
    It seems sometimes I can manually do it and then sometimes nothing happens.<br>
    Sorry if this vague but your opinions are needed.<br>
    I also promise to use better tabs in the future.</p>
