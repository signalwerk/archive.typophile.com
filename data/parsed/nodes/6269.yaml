    html: "<p>Okay Hrant, here you go, but since I like an awful lot of type, and its extremely difficult to pick ten out of all of those, mine are the top five or six an old printer dude might have picked up in lot and then never minded dumping into the can: <br> <br>Souvenir, neat word huh? <br> <br>Cooper Black (best selling face of its time period), looks good in pastels. <br> <br>Helvetica, especially on the T-shirt (in Garamond). <br> <br>Wedding Text/Old English (out of respect). <br> <br>Cheltenham (looks good in metal at about 120pt, nice chunk of lead). <br> <br>Century Schoolbook, Jesus. <br> <br> <br>It has been a long day... <br> <br></p>"
