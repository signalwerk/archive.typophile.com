      <p>Frank, Seb - Thanks for your comments. Yes, I can't disagree - there is a disconnect between the 'wide V' of the mark and the 'narrow V' of the font. I guess I'm trying to force a connection here as I like the form of the mark and I like the style of Mekanik.</p>
      <p>As I was drawing the mark I was getting a sense of deja vu - but I couldn't quite place it. As it happens a Star Trek vibe would probably fit OK with a few of my clients - so I can live with that :) It is a simple mark - but I'm wanting something that will work down to favicon size.</p>
      <p>Anyone else?</p>
