      <p>To come back on this...</p>
      <p>Riccard - thanks for your comment. That was something that I'd thought of but not tried until now.</p>
      <p>Given the comments, I reviewed the font choice as well as my thoughts on the mark. I looked again at my shortlist, but came back to using a condensed face - Mekanik or a modified Univers Condensed 49.</p>
      <p>So, before I go any further, apologies to Mr. Frutiger. I'm working way beyond my level of typographic competence here.</p>
      <p>Here's my latest work in progress:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VantageGraphics_v2_4902.jpg"></div><p></p>
      <p><em><br>
      Modifications are a redrawing of the capital V, changes to the ascender/descender length and some change to the height of the body of the lowercase g.</em></p>
      <p>I've also re-drafted the mark to match the design of the initial capital V.</p>
      <p>Your thoughts?</p>
