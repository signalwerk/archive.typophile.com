    <p></p><div class="imageWrap"><img src="http://typophile.com/files/VantageType_5348.jpg"></div><p></p>
    <p>Hi all,<br>
    First post here - although I've enjoyed much advice and entertainment from this site before today.</p>
    <p>I'd appreciate your thoughts on a type choice  and some simple indentity work. I'm re-branding a little business of mine - and as expected, being to close to the subject means it's difficult to be objective. The business is a small studio specialising in 3D computer generated imagery, and photographic based illustration for advertising and marketing use. Most clients are either corporate marking departments, or ad agencies, but I'm looking to add some editorial work to the mix. Typical current work is in a realistic or technical style, but i am looking to broaden this, so the branding needs to work for a wider market. I also do some photoshop and other training under this brand.</p>
    <p>The two options shown are: top; my initial choice of Dalton Maags 'Co. Headline'. For me, the big issue here is width. Vantage Graphics is a fairly long name, which I'm reluctant to change, and I think it works best set as one line.</p>
    <p>A second look made me consider a very different alternative of 'Mekanik'. I like this for it's industrial conotations - which sits well with most of my current clients, and it solves the width issue.</p>
    <p>I realise these are two very diffierent solutions. Mekanik works better IMHO given the name, but is it too industrial, mecanical and masculine?</p>
    <p>Your thoughts and critique on this - and the 'V in circle' logo - would be welcomed.</p>
    <p>Many thanks,</p>
    <p>Mike A.</p>
    <p>PS: should have said the above images are not final - letterspacing needs fixing etc.</p>
