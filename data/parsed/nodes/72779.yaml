      <p>If I were to do this, I think I would’ve drawn something that echoed the shapes in the mark somehow. As of now they’re completely unrelated. If you think of the mark as just another glyph in your font you’d expect the shapes to bare mark of the same tools/construction as the type, wouldn’t you? </p>
      <p>That said, your mark might be a bit too generic.</p>
      <p>Drawing the glyphs yourself also let you give it the “feel” you’re looking for while keeping it narrow, and — the most important part – it’ll be unique!</p>
