    html: |-
      <p>I found this post when looking for a way to detect whether a browser is using antialiasing. And for that I found a really nice solution I thought I'd share.</p>
      <p>There is a Javascript (see <a href="http://www.useragentman.com/blog/2009/11/29/how-to-detect-font-smoothing-using-javascript/">http://www.useragentman.com/blog/2009/11/29/how-to-detect-font-smoothing...</a>) that does exactly that. It's really easy to use:</p>
      <p>1. Include the script.<br>
      2. Call the TypeHelpers.hasSmoothing() function (preferably on page load).<br>
      3. Add a class to the html or body element.</p>
      <p>Using jQuery step 3 is easily done with:<br><code><br>
      $(document).ready(function() {<br>
      &nbsp;&nbsp;if (!TypeHelpers.hasSmoothing())<br>
      &nbsp;&nbsp;&nbsp;&nbsp;$('body').addClass('font-antialiasing-disabled');<br>
      &nbsp;&nbsp;else<br>
      &nbsp;&nbsp;&nbsp;&nbsp;$('body').addClass('font-antialiasing-enabled');<br>
      });<br></code></p>
      <p>Pages can then be styled with respect to this setting.</p>
      <p>For example, on my site I use a custom font that is rather illegible without anti-aliasing, so in my CSS I have:</p>
      <p><code><br>
      body.font-antialiasing-disabled {<br>
      &nbsp;&nbsp;font-family: Georgia, serif;<br>
      }<br></code></p>
      <p>To see it in action I use it live on my site <a href="http://lumens.se" title="Lumens Bröllopsfotografi - Bröllopsfotograf i Göteborg">Lumens</a>.<br>
      Hope this is helpful for someone.</p>
      <p>Cheers!</p>
