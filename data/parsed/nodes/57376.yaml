    html: |-
      <p>&gt;web developers cannot change this setting which I agree is how it should be<br>
      Should the developer of a single web site be able to control the appearance of all sites on a user's machine regardless of the user's settings, or just  the appearance of their site?</p>
      <p>I agree, that this situation is nearly hopeless for design, and readability, because the reality is the user doesn't really control much of anything, OS don't control nearly enough of what they claim to control, and browsers, which should have their own rendering (and perhaps fonts), independent of the OS, (except Vista Safari, e.g), don't. </p>
      <p>On your site:<br>
      "So essentially you can think of an 800×600 monitor resolution as 2400×600."<br>
      Essentially, however if you think this way, either you lose you color specification, e.g. black type is not, the user rotates the screen, or worse. You have 600 X 600 of 'a' color. You also have 600 X 600 for the location of the spacing units, unless you want the image of a glyph to vary from one location on the screen to another, ala Quartz. </p>
      <p>"... an unprecedented innovation in font display technology that dramatically improves font display resolution and marks a genuine breakthrough in screen readability."<br>
      We all wish this had been true of ClearType, but as, and after, the uber-hype died out, we were more clearly informed that ClearType is just another way of making preview fonts for print, in consideration the low resolution range most users are afflicted with in their displays. </p>
      <p>Cheers!</p>
