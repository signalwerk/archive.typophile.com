    <p>Does anyone know of an article or source of information about what determines if a browser will provide anti-aliasing on type on the web? Is it at the browser level or OS level? I run WinXP and Firefox does not provide any smoothing but IE7 does. I find that my co-workers' machines (on WinXP) will sometimes provide anti-alising, but others' do not. </p>
    <p>Thanks!</p>
