    html: |-
      <p>All of those components *can* affect how type is rendered, but only one rendering engine and one anti-aliasing setting will be in play at a time for a given browser.</p>
      <p>Or to put it another way....</p>
      <p>There's a rendering engine, and anti-aliasing settings (some of which may be user-controlled) on top of that.</p>
      <p>I am of the impression that the only browser with a font rendering engine of its own is Safari for Windows. If you're using Safari on Windows, I would expect the system level settings are irrelevant.</p>
      <p>Aside from Safari-Win, even when it's possible for a browser to adjust anti-aliasing settings, most just inherit the system-level settings.</p>
      <p>The hinting in the font interacts with the rendering engine and anti-aliasing settings, wherever they may be at the moment.</p>
      <p>Regards,</p>
      <p>T</p>
