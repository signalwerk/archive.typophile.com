      <p>I am so happy this question was asked, and that lots of folks are chiming in.</p>
      <p>From what I gather in the discussion thus far, type on websites is antialiased depending on these factors:</p>
      <p>* The visitor's OS antialiasing settings<br>
      * The visitor's OS's rendering engine (and any related settings, if different than general OS antialiasing settings)<br>
      * The visitor's browser antialiasing settings<br>
      * The visitor's browser's rendering engine (and any related settings, if different than general browser antialiasing settings)</p>
      <p>To these layers of "interpretation" of a typeface, should we add the following:</p>
      <p>* Hinting instructions provided by the suggested typeface?<br>
          - if so, at what level are these hinting instructions applied? OS? Browser?</p>
