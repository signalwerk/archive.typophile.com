    html: |-
      <p>"Does anyone know of an article or source of information about what determines if a browser will provide anti-aliasing on type on the web?</p>
      <p>A good article? "Display Type &amp; the Raster Wars", e.g not... </p>
      <p>All browsers, x-ept Safari on Vista, which brings it's own, use the native OS rendering which goes by two choices; the choice of the user on the Mac is of a size below which AA will not be used, or on windows whether to use standard or CT, or none for AA. In addition, each font can say at what size AA should start going up the resolution spectrum. I don't know what listens to the latter. </p>
      <p>"Is it at the browser level or OS level?<br>
      Yes, and more as I said. </p>
      <p>"as do latest versions of Microsoft’s ClearType, starting with Vista I think."</p>
      <p>As Miha points out, there could be privatized versions of CT from now on. As MS people explained to me, and I was gracious enough to suggest at a critical juncture in our standards discussions, that MS explain it to everyone present...Tom you was there:</p>
      <p>MS 'invented' an additional set of arguments for Instruction Control, a once obscure TT instruction, that's been brought to off-center stage by the resulting use. </p>
      <p>Once any AA is in the OS it seems, y hints work about the same everywhere. X hints are treated with a variety of ignorance. </p>
      <p>One option for CT's Instruction Control is 'compatible', which makes fonts rendered on integer metrics in the past, do so on the same (x) metrics when rendered in CT. Since the fonts previously rendered on whole pixels, this mode does too.  This is obviously important to protect the installed base of docs. I learned later that this mode reputedly sends the data to a PS rasterizer to get the integer metrics exactly right. The bodies and shapes are still rendered aliased, after some not particularly unintelligent... averaging (intelligent for imaging, but sadly not for type). The quality of results wholly depend on the user's resolution, and the (x) luck of the outline. This is an option of limited use to anyone other than MS.</p>
      <p>The other option, called 'natural' forget about. MS wanted it part of the ISO standard as it is now, but they did not, and do not, want to document it. This option uses whatever image it gets, repeatedly, unlike Apple and Adobe AA. </p>
      <p><img src="/sites/default/files/old-images/ClearTypePixels2_5143.jpg"><br>
      The image above, (now replaced on wikipedia by mea culpas to low resolution users from folks no longer employed by the companies they were representing when they were quoted), shows that repetition (top), as well as the saccadic pitfalls it introduces. </p>
      <p>After permission and size, I'll get back to this issue(s) :)</p>
      <p>Cheers!</p>
