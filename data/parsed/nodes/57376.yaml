      <p>Logically:</p>
      <p>The browser may use (a) the system wide OS setting, or (b) an internal setting. FireFox has a "gfx.use_text_smoothing_setting" variable.</p>
      <p>Additionally, it may use (1) the OS engine, for example ClearType on Windows, or (2) a built-in drawing engine -- Safari on Windows springs to mind, as this has been heavily commented on (primarily by Windows users, I probably should add). <a href="http://www.w3.org/Amaya" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Amaya</a> also has an internal drawing engine (FreeType 2.0).</p>
      <p>I don't think web developers can change the setting; even if they could, why would they change the user's preference?</p>
      <p>[Edit] Amaya is an interesting beastie. It found errors in these very pages:</p>
      <p>*** Errors/warnings in <a href="http://www.typophile.com/files/css/b438f6988ad15b3140aeba330d39ef16.css">http://www.typophile.com/files/css/b438f6988ad15b3140aeba330d39ef16.css</a><br>
        line 1: CSS property ignored: "text-weight:bold"<br>
        line 1: Invalid width value "210"</p>
      <p>*** Errors/warnings in <a href="http://www.typophile.com/forum">http://www.typophile.com/forum</a><br>
        line 56, char 546: mismatched tag</p>
      <p>-- but I'm not too wild about their rendering:<br><img src="/sites/default/files/old-images/amaya_4094.PNG"></p>
