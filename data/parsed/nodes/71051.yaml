    date: 2010-06-04T16:09:00
    date_raw: 4.Jun.2010 4.09pm
    votes: null
    html: |-
      <p>Some sans typefaces have a large "beak" on the one. e.g. Helvetica.<br>
      Others have a baseline crossbar on the one, e.g Franklin Gothic.</p>
      <p>Nowadays, many typefaces have alternate designs for proportional and tabular "one"s.<br>
      I usually put a baseline crossbar on my tab "one"s.</p>
      <p>You need to use an OpenType layout palette to access the alternate.</p>
