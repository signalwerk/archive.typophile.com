    html: <p>Thanks for the link. Was easier with it using Chengyin Liu's <a class="freelinking external" href="http://chengyinliu.com/whatfont.html" rel="nofollow">Whatfont Google Chrome extension</a> as it's embedded as WebFont. That's <a class="freelinking external" href="http://www.batfoundry.com/catalogue_9_wigrum_.html" rel="nofollow">Wigrum</a> by Bureau des Affaires Typographiques (BAT). It looks like to mix influences from Futura, aforementioned Aperçu and <a class="freelinking external" href="http://www.houseind.com/fonts/neutraface2" rel="nofollow">Neutraface 2 HI</a>. First time seeing it in action. Thanks!</p>
