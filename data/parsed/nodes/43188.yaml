    html: |-
      <p>It's not too hard to accomplish using InDesign Tagged Text.</p>
      <p>You just have to know the number of glyphs in your font, and then write an InDesign Tagged Text header to a text file, followed by a tag for each glyph ID.</p>
      <p>Somthing along these lines in python:</p>
      <p><code>import sys<br>
      print 'your tagged text header goes here'<br>
      for gid in range(425):<br>
      &nbsp;&nbsp;sys.stdout.write('&lt;cSpecialGlyph:'+gid+'&gt;&lt;0xFFFD&gt;&lt;cSpecialGlyph:&gt;')</code></p>
      <p>Insert some unencoded glyphs in InD via the glyph palette, export to tagged text and look at it in a text editor to figure out how it's done exactly.</p>
      <p>Hm, come to think of it I should have made a program out of it and charged for it ;) Oh well, just send me your fonts that you proof with this script :)</p>
      <p>Cheers,<br>
      Jens</p>
