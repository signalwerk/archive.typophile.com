    date: 2008-03-28T01:04:00
    date_raw: 28 Mar 2008 — 1:04am
    votes: null
    html: |-
      <p><code><br>
          app.findGlyphPreferences = NothingEnum.nothing;<br>
          app.changeGlyphPreferences = NothingEnum.nothing;<br>
          app.findGlyphPreferences.appliedFont = app.fonts.item("Garamond Premier Pro   Italic");<br>
          app.changeGlyphPreferences.appliedFont = app.fonts.item("Garamond Premier Pro   Italic");</code></p>
      <p>    var t = app.activeDocument.textFrames.add({geometricBounds:[0,0,210, 148] });<br>
          var glyphenzahl = 2555;<br>
          var s = t.parentStory;<br>
          var c = fillStory( s, glyphenzahl );<br>
          var startGlyphID = 1;<br>
          app.findGlyphPreferences.glyphID = startGlyphID;</p>
      <p>    for ( i = 1; i &lt;= glyphenzahl; i++ )<br>
          {<br>
             app.changeGlyphPreferences.glyphID = i;<br>
             c[i].changeGlyph();<br>
          }</p>
      <p>    function fillStory( aStory, aCounter )<br>
          {<br>
             aStory.contents = '';<br>
             for ( i = 0; i &lt; aCounter; i++ )<br>
                aStory.insertionPoints[-1].contents = ' ';<br>
             return aStory.characters;<br>
          }<br>
      </p>
      <p>So this is a "beta"-version of the script, created with the kind help of <a href="http://www.hilfdirselbst.ch" title="www.hilfdirselbst.ch">www.hilfdirselbst.ch</a> (swiss user-to-user support site). It inserts all glyphs of a Font to a new text frame in Indesign CS3. The glyphs do not need to be encoded with a unicode point.</p>
      <p>What the script does: create a text frame with as much " " inserted as the font has glyphs as "search dummies". Start a search and replace script, searching for " " and replacing it with i+1 glyph number each time it finds one.<br>
      It is done per "search and replace" as it does not seem to be possible to directly access Glyphs per GID to insert them into a textframe, but it works per glyph search to replace them.</p>
      <p>One have to adjust:<br>
      - 2 times Font-Family name und weight (separated per Tabulator: "Times New Roman[TAB]Regular")<br>
      - choose the same font as default setting in your Indesign document to be sure it works. I think as it is not specified in the script, this is necessary.<br>
      - insert the glyph count of the font in the line "var glyphenzahl = 1234;"<br>
      - "var startGlyphID=1": the GID of the "space" glyph of your font. Any other unicoded(!) glyph can be used as well, but be sure to read the next line if you do this!<br>
      - in the line "aStory.insertionPoints[-1].contents = ' '" the same glyph has to be inserted as specified in "startGlyphID" (i.E. if you have inserted the GID of the space character above, you have to enter a space here. These have to correspond, otherwise it won't work.)</p>
      <p>This can be optimised for sure, but it works quite well for Adobes Garamond Premier Pro and for some of my fonts I was building it for.</p>
      <p>I hope this is useful to some of you. Don't hesitate to improve it... I am a scripting noob, so there for sure is space for optimization.</p>
