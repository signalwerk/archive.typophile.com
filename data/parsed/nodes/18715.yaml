      <p>I think ampersands are a bit similar to those distructive fonts that everyone creates at college, tear up some paper, scan it in, take it into fontographer and bingo, a typeface. </p>
      <p>I find it annoying when I see these fonts for sale, these are the fonts that one should create themselves. </p>
      <p>I think that an ampersand could be created similar to this, they can be taken out of a font and used on their own along with other faces. THis way you can create your own ampersand the way you want it without the worry of it fitting in.</p>
      <p>Also it becomes a lot more personal which chould reflect the wedding theme a whole lot better.</p>
