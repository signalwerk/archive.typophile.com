      <p>Thanks for the suggestions, sorry if I missed the previous threads on this. I'm in a pre-pre-sketching phase of this. </p>
      <p>Matt, I think calling a whole piece of punctuation "college trite", to paraphrase, is a bit broad. I likely will be creating new type for this project, but I have to start somewhere. Whether or not I even use an ampersand is TBD, but interlocking letters that spell "and" in French is symbolic, even if it does tend to be more of a 'surface' concept than complex.</p>
