    html: '<p>Ampersands have their place--even in formal usage--so your personal preferences regarding this particular character should remain <em>your personal preferences</em>, and not a universal rule (take the iPods out of your ears and get a grip, people). The basic structure of the ampersand is supposed to reflect the Latin word <em>et</em> -- and -- not unlike the Latin term <em>per se</em> (Vince: <strong>not</strong> "per <strong>say</strong>") is understood as "in and of itself."</p>'
    html_clean: '<p>Ampersands have their place--even in formal usage--so your personal preferences regarding this particular character should remain <em>your personal preferences</em>, and not a universal rule (take the iPods out of your ears and get a grip, people). The basic structure of the ampersand is supposed to reflect the Latin word <em>et</em> -- and -- not unlike the Latin term <em>per se</em> (Vince: <strong>not</strong> "per <strong>say</strong>") is understood as "in and of itself."</p>'
