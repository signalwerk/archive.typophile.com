  html: |-
    <p>Is there some proper way in OpenType to differentiate the apostrophe from the right single quote? In ASCII there is an straight apostrophe (U+0027), but the U+2019 RIGHT SINGLE QUOTATION MARK is the typographically correct version of both characters. I ask with a case in mind in a typeface where the default quotes are mirrored from their usual look, but when one is using the right single quote as an apostrophe is not likely to be used that way.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/apostrofo_condorito_3772.png"></div><p></p>
    <p>(lettering from a Chilean comic magazine).</p>
    <p>I think that <a href="http://www.tipografia-montevideo.info/entevistas/archivo/e_heilborn.html" rel="nofollow">in cases one want to have a different look for it due to being used as a letter</a> the U+02BC MODIFIER LETTER APOSTROPHE. is appropiate, yet <a href="http://www.languagegeek.com/typography/apostrophes.html" rel="nofollow">some people is against the usage of those characters</a>. The usage of the Saltillo letters (U+A78B, U+A78C) as an straight apostrophe is safe, thought.</p>
