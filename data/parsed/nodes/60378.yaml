      <p><em>Is there some proper way in OpenType...</em></p>
      <p>Put it in the "calt" feature, so that the "one o'clock" alternate glyph appears between two letters, but the "eleven o'clock" is default, when followed by a space or other punctuation. Shades of SmartyPants!</p>
