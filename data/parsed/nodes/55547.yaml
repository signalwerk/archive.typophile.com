      <p>&gt; <em>does it make sense to have margins for poetry set up so the outer margin is, as is usual, the largest?</em></p>
      <p>I design and typeset alot of poetry books. And to that question I would have to say no; I usually make the pages the same. I.e. left page largest margin on the outside, right page largest margin on the inside. I do this because poems only have a straight left edge. Personally I think it looks best this way.  </p>
      <p>In your example, I don't really like the fact that the poem is centered. I would probably make the left margin something like 30 to 35 mm. I just think it sits on the page more naturally that way.</p>
      <p>Also, about the right page text block, is the book going to contain both text blocks like that <em>and</em> poetry?</p>
