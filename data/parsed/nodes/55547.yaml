    <p>Hello, I'd be very pleased to know your oppinions on this sample. It's an example for a book of poetry and also my fist try at it. I've filled in the recto page with some placeholder text just to get a feel for the actual text-block, since the poems themselves are centered. I wouldn't choose Perpetua for prose, but I think it really does let poetry breathe.</p>
    <p>Please, do tell me what you all think.</p>
    <p>Regards,</p>
    <p>Andrej</p>
