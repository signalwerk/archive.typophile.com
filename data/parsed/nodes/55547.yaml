    html: |-
      <p>No, only poetry; I included the recto just to get a feel for the textblock. As for the centering, I've always been a fan of that. What I dislike the most are pages that are empty in a bad way -- like a single line of text in the upper left corner that just doesn't make any sense. There is, in my oppinion, a difference between emptiness and breathing space. I was trying to achieve a balance between the two. </p>
      <p>Thank you for your input!</p>
