    html: "<p>Also, there is another question implied: does it make sense to have margins for poetry set up so the outer margin is, as is usual, the largest? I'm aware of an example mentioned by Bringhurst where this is not the case, but there's unsifficient information regarding the actual way the poetry was set there. For if I set it centered as in my example above, the margins are in fact only imaginary (unless the lines were so long they would actually touch them on both sides). I was wondering whether larger outer margins were thus in fact causing a slight visual distraction, since they force the centered content to be visibly off-center with regards to the page as a whole.</p>"
