  html: "<p>Hello everyone, <br> <br>I've been reading here for some time now and finally decided to register and participate. So I'm posting something to be criticized, as a start. <br>Explanation: sulPET is the annual meeting of all PET - Programa Especial de Treinamento, \"special training program\" from universities in southern Brazil. PET is kind of a study/research group made up by really good students (you need high grades to get into a PET) and professors. There are PETs about all areas of study - Architecure, Engineering, Literature, Biology...  <br>So this is the 8th sulPET, and the three small sentences on the right are this year's subject: (from top to bottom) Sharing Knowledge, Science and Society, Constructing Paths. <br>We've tried to stay away from \"pictorial\" logo because the budget is very low and we don't feel it makes much sense to create a logo that will be lost as soon as the meeting is over. <br>This year's meeting focuses on the relationship between PETs and society in general, in opposition to other years which were generally about inside-PET discussions. We tried to convey that by putting the subject lines as outgoing lines that start from the word PET. That's the main idea we think should be passed to the participants: that this year is about an outgoing thought, not restrictive on the PET.  <br>Oh, the font is Helvetica, in it's Bold and Black variations. We tried to keep it straightforward and simple so we tried with different sans-serif fonts, but Helvetica has such a nice balance we decided for it. A classic's a classic, eh? <br> <br>Anyway... we're open to all king of suggestions, concepts, typographic details, etc etc. Thank you all <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br><img src=\"http://www.typophile.com/forums/messages/29/52539.png\" alt=\"here's the image\"></p>"
