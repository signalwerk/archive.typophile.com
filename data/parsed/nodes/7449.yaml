    html: "<p>Normally, I don't think continuity is a bad thing either. However, according to the people who are organizing this event, this one is a turning point in terms of content - it's a new direction. So they don't want it to look like it's a sequel of last year. Also, there was no previous continuity, every year it's hosted by a different university and a whole different groups works on it.  <br> <br>Steve: that's an interesting idea, maybe it would have problems when reduced, but I'll try it anyway. Thanks <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br>(I should be posting something here, but there hasn't been much improvement...)</p>"
