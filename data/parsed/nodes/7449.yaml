    html: <p>Here's the new, updated version! We're trying to reinforce the "getting out" idea, and thought that to communicate it we had to show that things were getting out FROM somewhere. The great thing about this is that it's still a two-color job, but feels like there's more.  <br> <br><img src="http://www.typophile.com/forums/messages/29/53359.jpg" alt="new logo"> <br>(the orange doesn't look so nice in RGB...) <br> <br>Any suggestions, critique, ideas, anyone? Thanks in advance <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
