      <p>Then there's the "myopic old guy" movement.<br>
      William Morris was in his sixties when he went into typography.<br>
      Theodore De Vinne was in his sixties when he worked with Linn Boyd Benton, then in his fifties, on Century.<br>
      Those people were very influential in beefing up type designs in the early 20th century -- perhaps because their eyesight wasn't quite as good as it used to be?</p>
