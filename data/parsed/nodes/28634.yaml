      <p><em>Similarly, people eventually got fed up with the ornate, busy designs of Victorian England, and this ushered in the clean all-sans look of modernists in the early 20th century</em></p>
      <p>That's a myth. People got fed up with the messy typography of new media in the 1890s, and this ushered in the era of Historicism, with correct use of historical allusion. The clean all-sans look was only ever a high-end, minority phenomenon until the 1960s.</p>
      <p>There is a similar movement now, if you compare the new media of the 1890s with DTP in the 1990s; after the crazy boom comes sober conservatism. Except in Newfoundland, of course.</p>
