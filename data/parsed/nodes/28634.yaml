    html: |-
      <p>&gt;much more to do with technical changes than any art and architecture movements</p>
      <p>I agree rather with Bringhurst that general movements in art and architecture are indeed very important. The general rule across all design fashions, whether furniture or clothes or houses or type, is that each movement is a reaction to the last. There is usually more than one reaction, but this principle enables you to understand a lot. For example, there are swings back and forth for more and less ornament, as people get fed up with too busy designs, and then get tired of too plain ones. </p>
      <p>There was a different feel to blackletter and roman style type. The spread of roman over black letter, as documented by Harry Carter, was not due to any technical considerations, but religious battles and aesthetic tastes. </p>
      <p>Baskerville, if I remember correctly, developed his new inks that would print more cleanly in order to achieve the refined neo-classical feeling that he was aiming for--with its more circular, broad arches compared to Caslon. The aesthetic drove the technical here. And Baskerville's taste was very much of a piece with his times and with what was going on in architecture. </p>
      <p>Similarly, people eventually got fed up with the ornate, busy designs of Victorian England, and this ushered in the clean all-sans look of modernists in the early 20th century. Political factors were also important in the Germanic championing of sans faces. </p>
      <p>Of course technology is a very important factor, but the history of type design I don't think can be written properly without a large reference to general cultural trends, especially in the visual arts.</p>
