      <p><cite>I’ve always felt that changes in font style have much more to do with technical changes than any art and architecture movements - it always seemed a bit silly to try to shoe-horn fonts into these movements.</cite></p>
      <p>I think that it's a bit of both. The arts &amp; crafts and art nouveau periods, have obvious connections to much of the type of those eras. But in a roundabout way Bauhaus typography also grew out of those movements without being directly related to them, but it wasn't using new technology, either. Renaissance type and art were deeply influenced by interests in science and the humanities, but the art and type were not necessarily influenced by each other. So there are a lot of different kinds of connections between movements in art and type, and a lot of subtle considerations have to be accounted for to make sense of it all.</p>
