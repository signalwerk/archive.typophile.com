      <p><em>Type has its own visual logic,</em></p>
      <p>Exactly. We don't have to borrow isms from art or technology to explain the sweep of its history.</p>
      <p>Here's another: In the early 19th century in the UK and France, a typographic movement began which:<br>
      1. Got rid of the long s<br>
      2. Got rid of c_t and s_t ligatures<br>
      3. Changed from "transitional" to Modern serifed typefaces<br>
      4. Invented many new genres, including the sans serif</p>
      <p>This was a widespread, drastic movement which should, by rights, be named modernism.<br>
      Not a good fit with Romanticism or Neoclassicism, the major cultural movements of the time (or at least, as they have subsequently been termed), although Robert Bringhurst took a good shot at it. Much closer to modern poetry and Wordsworth, with his introduction of simple, vernacular language. It must have been quite a bracing experience to read <a href="http://etc.dal.ca/cgi-bin/cgiwrap/etc/lballads/img_display.pl?http://etc.dal.ca/lballads/images/London98/98_i.JPG" rel="nofollow">Lyrical Ballads</a> in 1798, set in a modern type, with no long s's (although the ct is still used).</p>
