      <p>Type design is part of some wider movements, such as art nouveau, but that was only minor in the type world. It also has its own movements.</p>
      <p>For instance, in the early 20th century, say from 1900 to 1930, Historicism was huge.<br>
      By that is meant reviving centuries old typefaces, and creating page layouts and ads in comparable styles. While this started out as part of the arts and crafts movement, as did modernism, it went in the other direction. </p>
      <p>Some (eg Robin Kinross in Modern Typography) have called this "New Traditionalism", but that doesn't seem right, as it was actually a break with tradition, which had been evolutionary, not jumping all over the place.</p>
      <p>In the design and typography histories that take their cue from art history, Historicism is generally downplayed, because there is no counterpart. But that's the difference between mass media culture, which is what type is part of, and elite art gallery culture.</p>
