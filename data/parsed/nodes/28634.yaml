      <p>That's what I like about type, it sits in the middle of technology, literature, and art (with a little bit of physiology and linguistics thrown in for good measure), connecting with them all.</p>
      <p>So on the physiology side of things, there was also a Legibility movement: in the early 20th century Morris Benton produced Clearface and Century Schoolbook; Cheltenham was also a "legibility" face, in the sense that its very short descenders and tall ascenders were Goodhue's interpretation of the knowledge that the upper parts of letters are more significant in reading. Then starting in 1926, Chauncey Griffiths did the Legibility Series of newspaper faces at Linotype. </p>
      <p>It could also be argued that legibility is an aspect of functionalism, which would relate those serifed designs just mentioned to the development of the 20th century sans serif at the same time. But is it a requirement of the types in a movement that they have a similar stylistic look? And do the participants in a movement have to be aware that they're in one (and issuing manifestoes), or is it OK to just designate it as such from a later point in history?</p>
