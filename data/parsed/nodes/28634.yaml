    html: |-
      <p>&gt;you’re more likely to think of a technology</p>
      <p>When I was talking with Larry Oppenberg at the Museum of Printing, he pointed out that actually the typefaces have out-lived the technology. Gardner LePoer there explained that the technology has been changing rapidly and continually from 1850, when engines were put on presses; it's actually not only a thing of the past thirty years. </p>
      <p>Oppenberg mentioned that Merg. Linotype had been focused on selling machines, and the typefaces were just a means. But in fact the thing that has outlasted the machines and the technology is the typefaces. </p>
      <p>Good design has a power to last and is a force in itself. Even with screen fonts, it seems to me it is a matter of designers seeing how best to adapt what they'd prefer to a limited technology--the low resolution screen. And when the screens change, new designs, influenced by the classics, will be done again. </p>
      <p>Yes, the technology is  extremely important. But the message I got from Larry is that in fact those concerned primarily with the technology have in the past underestimated the power of good visual design itself.  </p>
      <p>Type has its own visual logic, which dictates what makes beautiful words and works best for reading. And solving this logic well in a typeface is I suspect in the long run more important than either changes in publishing technology (screen or paper) or tastes in art.</p>
