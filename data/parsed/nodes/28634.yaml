    html: |-
      <p>There was a movement, beginning in the early 1960s, and lasting for twenty years, when the trend was to set type tighter and tighter, both the space between letters, and leading. As Si suggests, this had much to do with the technology -- phototypositor, Letraset, and photosetting -- that made it possible. At the same time, type designers created faces with small x-heights, from Antique Olive thru a slew of ITC faces. I associate the tightness and the big x-height as a very coherent technical-aesthetic movement, but I don't believe it is widely identified as such, or has ever been given a name.</p>
      <p>I remember when it ended, in the mid 80s, when UK art directors started producing copy-heavy ads with text that was small and hugely tracked out.</p>
