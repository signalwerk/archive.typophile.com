  html: '<p><img src="http://www.typophile.com/forums/messages/29/51974.gif" alt="Mexican logo"> <br> <br>Hi Typophile folks, i recently discovered this very cool site, its been very helpful and ejoyable... Im a mexican designer and <br>this logo is for a personal project: informative web site about this town in mexico famous becasue nature sports and rich ethnic heritage, also i plan to sell tourist packages. This is my first effort for smething beautyful, natural and cultural... what do yu think?? can give some feedback?? (i feel a little unconfident since its a personal stuff)</p>'
