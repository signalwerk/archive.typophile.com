    html: '<p>Hi Daniel,  <br>well the type is Myriad tilt skewed and distroted in photoshop, i was trying to do something "dirty but nice" as some nature sports...  <br>the tag line says "adventure paradise" and the graphic is a kind of semi-abstract draw for a prehispanic jar fragment (discovered while digging the land to build a camp) or can be also a drum (drums are played in many events during camp activities) or can also decorated rock... the wave can represent the river... in fact i want to create a multi-meaning simbol that catches the spirit: "natural, cultural and etnhic beautiful"  <br>Thanx a lot.</p>'
