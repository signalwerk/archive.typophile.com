  html: |-
    <p>Recently, after learning of the roots of italic, I have been paying more attention to them and how it seems that majiscules in Italic sets never really seem to fit. The more I look at them, the uppercase is basically just angled. I realize they have been redrawn for the set, but does anyone else sense that disconnect between the upper and lowercase in Italic sets ?</p>
