    html: "<p>In general I think the curves are disagreeing with the straight lines here. It's especially evident in o, g, and f. For example, with the o, you have a standard sort of curve on the outside and the inside has the only corners. Both curves, inside and out, should have a <cite>blend</cite> (where appropriate) of curvy and linear. The m has really achieved this well. The one side of the line harmonizes really well with the other side. It also looks like you've taken a bit too modular an approach, using the same template for similar letters. I think this design just screams for a bit of variety. Go ahead: make the inside of the o and the dot of the i a little asymmetrical! put one more corner on one bowl of the s than on the other! (These are just suggestions. You can do whatever things you feel like.) Use your imagination to jazz it up a bit. Oh, and when you do that work on the g, make sure you get rid of that awful ear. I'm thinking Electra.</p>"
