      <p>Whatever you call them, if they catch your (or the reviewer's) eye, they don't work, get rid of them. </p>
      <p>There is a trend now to add sharp cuts in counters, and it came from somewhere, and there was a reason for it, but I don't think the reason generally exists now, and the reasoning isn't being observed anyway, so I'm not a big fan of the sharp cuts unless they actually do something ( = have a functional purpose). Why are they there? "I just like them" is not the correct answer.  ; )</p>
      <p>To discover more about what would be useful about sharp cuts, try making a typeface out of nothing but straight lines. That would push you to discover methods to make straight lines look like curves, and where to put the corners that would be less visually disruptive, which is more useful to know than "I could break some curves". </p>
      <p>A hint about how easy this challenge could be: Blackletter.</p>
