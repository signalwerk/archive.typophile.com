    html: "<p>Also, I think I should mention that perfect circles are to be eschewed in \"serious\" (i.e. text) typography, because they inherently lack a quality I call chirality, which is a reflection of the way an actual hand draws a letter. It's more than a diagonal distribution of slope like on your o--you can't get it by simply rotating the counter, but rather you have to make the slope shallower on the NW and SE parts of the o, and more square on the NE and SW. For an example--and forgive me if this makes me look arrogant, but I can't think right now of another font that illustrates it so clearly--look at my <a href=\"http://typophile.com/salamander\" rel=\"nofollow\">Newt</a> (That's what I've decided to call it now). Carry that from your o to other letters too: g, the pbdq quartet, c, e, and most of everything else. Shaping of the round is one of the most important things that defines the character of a font. A text face without it looks like it has backslant, and it also has zero character to it. (This is one reason Times looks so bland.) You obviously don't have to do it to the extreme that I did in Newt. That's just an illustration of what chirality is. I also want to stress that you shouldn't in your fracturing of the curves create little globs of stress, like in your o and f: there should only be the standard text face amount of thicks and thins, and your o for example has two extra vestigial thicks at the bottom and top. A fractured curve will obviously always result in a deviation of stress from the normal, but make it flow. Your m and n have that going to them: starting at the stem, the stroke gradually gets wider, for the most part not shrinking back to any thinner widths, crescendoing until it gets to maximum at the next vertical, and then it holds steady. On the glob-plagued letters, you're using chords that are perpendicular to the radius of your curves. Sloping it would help reduce the globs. Fracturing the curve more times would also help on some letters. Enclosed are some illustrative figures I made with MS Paint to help decipher my esoteric advice.</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/allpurposetemp_4097.PNG\"></div><p></p>"
    html_clean: "<p>Also, I think I should mention that perfect circles are to be eschewed in \"serious\" (i.e. text) typography, because they inherently lack a quality I call chirality, which is a reflection of the way an actual hand draws a letter. It's more than a diagonal distribution of slope like on your o--you can't get it by simply rotating the counter, but rather you have to make the slope shallower on the NW and SE parts of the o, and more square on the NE and SW. For an example--and forgive me if this makes me look arrogant, but I can't think right now of another font that illustrates it so clearly--look at my <a href=\"http://typophile.com/salamander\" rel=\"nofollow\">Newt</a> (That's what I've decided to call it now). Carry that from your o to other letters too: g, the pbdq quartet, c, e, and most of everything else. Shaping of the round is one of the most important things that defines the character of a font. A text face without it looks like it has backslant, and it also has zero character to it. (This is one reason Times looks so bland.) You obviously don't have to do it to the extreme that I did in Newt. That's just an illustration of what chirality is. I also want to stress that you shouldn't in your fracturing of the curves create little globs of stress, like in your o and f: there should only be the standard text face amount of thicks and thins, and your o for example has two extra vestigial thicks at the bottom and top. A fractured curve will obviously always result in a deviation of stress from the normal, but make it flow. Your m and n have that going to them: starting at the stem, the stroke gradually gets wider, for the most part not shrinking back to any thinner widths, crescendoing until it gets to maximum at the next vertical, and then it holds steady. On the glob-plagued letters, you're using chords that are perpendicular to the radius of your curves. Sloping it would help reduce the globs. Fracturing the curve more times would also help on some letters. Enclosed are some illustrative figures I made with MS Paint to help decipher my esoteric advice.</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/allpurposetemp_4097.PNG\"></div><p></p>"
