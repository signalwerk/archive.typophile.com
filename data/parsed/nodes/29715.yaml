      <p>Hrant made Patria, which is why I used it in my comment responding to him. He also created the word "bouma", so it's not in Dictionary.com. It just means "word shape". He uses it to say that letter shapes ought to strengthen the shapes of the words they're used in, rather than just look good on their own. He also uses the (real) word "parafoveal", because he's done some research on how we read--you can read about it on his site. Foveal is the stuff you're focusing on, and parafoveal is the stuff on the outside of that--the stuff you're seeing, but kind of fuzzily. (It's an adjective, by the way, but I used it like a noun.) Crossgrove has a good idea. </p>
      <p>(Jason, is that avatar a picture of you or of Bane from <cite>The Matrix</cite>?)</p>
