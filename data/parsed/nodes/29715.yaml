      <p>Oh, no, Newt isn't a school project--I'm not even in college yet. I made it in what spare time I could find, mostly over the summer when I had all the time I wanted (well, most of the time I wanted). Thank you for the accolades; I'm much obliged.</p>
      <p>Hrant-<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/allpurposetemp_4374.PNG"></div><br>
      A quick screenshot of the o from Patria reveals that your natural human tendencies have gotten the better of your rationalistic approaches, and given the letter a <cite>little</cite>--not much, but a <cite>little</cite>--chirality, combined with squaring of the round. But that's beside the point. My point is that very many successful fonts tend to have it, and, since of course correlation isn't causation, that I think this font could use it too. Some fonts (<a href="http://image.linotype.com/samples/hirespdf/12775.pdf" rel="nofollow">Caledonia</a>, for instance) don't have it. These fonts generally use squaring of the round instead, which (I'm getting back on the topic of helping Moiz here) is where you make all four corners more toward the square, not only NE and SW. You can find a balance between chirality and squaring, using them both in conjunction. Personally, I think this font would do well with a little of both. Squaring is another essential design idea to know--not required for every font, any more than serifs are--but still essential to know and probably to be proficient with. Hrant is well-read, and will now tear into my comment using words such as "parafoveal" and "bouma", but I base my learnings off of what I see in established designs and what I instinctively think looks better, so that's my angle.<br>
      P.S. I started writing this before Hrant responded to my other comment, which is why I don't refer to his.<p></p>
