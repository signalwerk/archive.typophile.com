      <p>Patric, please take my comments in good humour. I'm in a good mood, but I'm of British descent and the traditonal penchant for satire and sarcasm is in my blood. Don't take it personally.</p>
      <p>* For the extent of design and degree of visual stimulation on offer, the typeface design itself is not good value for money at $35.00 per weight.<br>
      Also try: funding an elephant with a serious cocaine habit.</p>
      <p>* The market for this type of thing is small and its potential range of uses limited. To get sales it desperately needs to be much better value for money.</p>
      <p>* $15 per weight, with matching italic in each package, would be a "good" price to sell it at and an appealing way to market it. Compare with my <a href="http://www.myfonts.com/fonts/sentinel/primex/" rel="nofollow">Primex face</a>---at $15 for the regular plus oblique Primex is a tepid albeit steady seller. Much simpler in design than Commodity, Primex has an effective marketing concept behind it, complete with persuasive font flag and shafty blurb. Also try: luring vigins into an enourmous wicker basket and torching it.</p>
      <p>* Incomplete Western 1252 character sets send buyer interest straight off a vertical cliff face.</p>
      <p>* Family lacks a regular weight, jumping from light to medium.</p>
      <p>* Interpolation of the bold and extra-bold weights, featuring some letters with clogged counters, is the kind of product the roach-baited font-buying public avoids. Not worthy of pretend consideration. The moment they see it Myfonts customers will quickly move on to discounted real fonts.</p>
      <p>* The font flag doesn't help. </p>
      <p>j a m e s</p>
