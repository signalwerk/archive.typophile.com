      <p>By the way, I actually don't think the typeface is that bad, either. As previously stated, I am not a fan of this category of typeface, but yours certainly has some appealing and unique characteristics. Although the lower-case "g" to me reminds me of the symbol for masculinity. I think. Is the cross under a circle representative of male or female? I always thought the circle with the arrow represented female but I wouldn't bet on it.</p>
