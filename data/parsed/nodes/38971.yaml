      <p>Patric: Whether you agree with what's been posted or not, you are receiving some extremely valuable feedback here.</p>
      <p>I can't really say I find Commodity appealing, but then again I don't find any fonts in this classification/genre appealing so I do not count. I can see how those who appreciate this kind of type would find it attractive so I don't believe you created the e-coli of the typography world. However, after reading your posts carefully I was able to pick up on a few things which I'll run past you now and let you determine what they are worth. And these things have nothing to do with the actual font itself.</p>
      <p>1.) Stripped to its core, selling is all about convincing. However, the bottom line is I'd neither seen nor even heard of "Commodity" until now. That said, I really couldn't be convinced to buy it then now could I? It's your job to both alert me of the font's existence AND convince me to buy it somehow. (By 'me' I mean ordinary people in general). I'd previously heard of "House of Pretty," a name I actually like very much. It's just not a name I've heard on a routine basis, if more than once or twice in my life. PROMOTE!</p>
      <p>2.) All of your flags on myfonts.com are left-hook red (view: <a href="http://www.myfonts.com/foundry/pretty/" title="http://www.myfonts.com/foundry/pretty/">http://www.myfonts.com/foundry/pretty/</a>). Not only is red a color you want to avoid when attempting to win people over, in one's initial, 1.3-second glance it makes all your fonts look exactly the same. Which then means a person's immediate (and perhaps subconscious) impression is you lack a capacity or desire to be flexible. So not only has red turned "me" off, you better hope I liked something about whatever font I did look at first because I'm almost immediately going to assign my initial impression to the remaining four I did not peruse. Sadly, that also goes for if I didn't like the first one I saw. In this case, three of the five require more than just a casual glance to realize they're not identical. Obviously this is not the be-all and end-all of your stated problem, but I can't imagine it being an advantage.</p>
      <p>On the other hand, if you mix up the view of the flags a bit, use some blues and transparencies and treat it as though you are using your font to promote something other than your font, you will win more of those critical initial moments of impression than you'll lose. And I thought Mike Diaz's suggestions, specifically his second one, were outstanding.</p>
      <p>3.) What struck me most in your posts was something with which I also have extreme difficulty; that being, just because you "love" your font doesn't mean everyone will, or should. To me it sounds as though you designed at least this font - if not more - solely for what YOU find appealing. When it comes to living life, it's the only way to go. Making money, on the other hand, is quite different.</p>
      <p>Is this approach a crime? Of course not. However, when you unload on someone providing an honest opinion on  your work, your interest in pleasing yourself rather than making money resounds like a cannon. Design of all kinds, regardless of the arena, is a see-saw struggle between remaining 100 percent true to your own appreciations and principles and receiving a consistent stream of financial reward.</p>
      <p>While I admire and appreciate self-confidence and self-assurance, I find self-awareness to be a far more valuable trait. </p>
      <p>For whatever this was worth ...</p>
