    html: |-
      <p>i think Commodity is a simple font, too simple to justify the price, mostly compared to other fonts in the same site.</p>
      <p>for the untrained eye, it might look similar to some of these fonts<br>
      <a href="http://www.dafont.com/theme.php?cat=301" title="http://www.dafont.com/theme.php?cat=301">http://www.dafont.com/theme.php?cat=301</a></p>
      <p>for the trained eye, it is rather simple, and at prices that compete with, for example:<br>
      <a href="http://www.emigre.com/EF.php?fid=84" title="http://www.emigre.com/EF.php?fid=84">http://www.emigre.com/EF.php?fid=84</a> or<br>
      <a href="http://www.emigre.com/EF.php?fid=107" title="http://www.emigre.com/EF.php?fid=107">http://www.emigre.com/EF.php?fid=107</a></p>
      <p>i obviously will buy Cholla or Modula. after all, they're Emigre fonts, and you can see the sweat in each of their so many details. it just makes me happy by merely looking at them.</p>
      <p>it seems to me (i repeat that: it "seems" to me) that half a day and FontCreator will allow me to reproduce it. seems like a series of boxes with a median line, some slants and a differently-looking quirky k (personally i find the k disturbing as it does not keep any proportion). Commodity does not surprise me, does not excite me. and by its selling history, it might not be exciting others as well.</p>
      <p>Revenant has personality, reminds me of Eurostile, but rather bolder, more streamlined, you can almost see a defined aggressive character in it. Fast Girls has it with its slashed computer-savvy roundness (a rounded sister to that old Chicago font for the first macs, which was a lovely mistake of a font), Smile has it with its geometrically-disturbed guts brings memories of Buro Destruct typeness. Commodity lacks that character your other fonts have.</p>
      <p>this is not a harsh critic, it is an opinion. you have very good intense fonts. kudos and keep it going.</p>
      <p>--<br>
      argonaut | sans faux pas</p>
