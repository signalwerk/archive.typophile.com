      <p>okay. first off, i owe clauses an apology. "Aesthetically I don’t think that it’s sophisticated enough to warrant a price tag" is a <em>really</em> hard thing to see as the first comment on a design that i know is sound. it offended me because i wouldn't have said something like that to anyone unless i <em>really</em> disliked them.</p>
      <p>the face is actually using the forms common to freeware releases and combining those with handwritten italic forms <em>on purpose.</em> the face was designed in 2001-2002, when geometric forms weren't as out of fashion as they are now, and i'm aware that the visual vocabulary is straight out of trash typography. during that period i used forms from youth culture vernaculars because i liked giving them a full range of expression through a full character set.</p>
      <p>that said, the character map <em>is</em> actually complete. myfonts support told me their OTF rasterizer sometimes didn't work, but i should probably regenerate the files myself. these were generated at thirstype for the initial release. the person who made the files was having trouble with them at the time.</p>
      <p>this was designed as an overhaul to <a href="http://www.myfonts.com/fonts/pretty/revenant/" rel="nofollow">revenant,</a> which still sells like hotcakes almost twelve years after its release, and which i can't stand. it was designed in 24 hours and looks it, yet sells like <em>crazy.</em> i thought commodity would be a great answer to it since it expands a great deal on the vocabulary and makes it more usable—but nyet. that's why i'm confused about its lack of sales. it seems like it would, since it expands upon the forms so much.</p>
