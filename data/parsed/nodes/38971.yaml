      <p>I certainly agree ... to a point. This photo was taken from the fontfont.com website, promoting one of its typefaces. View here: <a href="http://www.fontshop.com/features/fontmag/003/003_ff/" title="http://www.fontshop.com/features/fontmag/003/003_ff/">http://www.fontshop.com/features/fontmag/003/003_ff/</a></p>
      <p>Given this is a visual industry, any potential client should be provided a wide variety of visions depicting how attractive a typeface can be should they be considering this kind of advertising/promotion. It kind of traces back to the old chicken and egg debate, really. </p>
      <p>In order for a potential client to know what kind of image would be projected of their business by using your typeface (generally speaking, not necessarily Commodity), presenting images such as the one above is the most effective way of doing so. Otherwise you're talking about a lot of people spending lots of money to use a typeface without having any idea of what it might look like on a billboard. Well, if I've never had one of my typefaces on a billboard, that client almost would be forced to rely on God's good humor because he or she certainly wouldn't have had any form of visual representation on which to rely . . . other than some spec sheets perhaps. And if they make specific inquiries about the billboard itself, then by all means a designer could and likely must explain it was just a visual example of the font's possibilities.</p>
      <p>Keep in mind this is merely one of literally thousands of promotional techniques, and isn't something a designer should rely on exclusively - or even very often. I was just providing an example of various angles and approaches you could take to framing and presenting your work a bit differently.</p>
