      <p>"Commodity may be existing in between sweet spots of utility. The one being Display &amp; the other text."<br>
      Really? Commodity may also be existing between spots of utility and not. The regular has collection points in the intersections until it becomes "too black for counters". The italic cannot be used with the regular because it's too bold. There are several illegible characters. There is a l.c. width issue as weight increases that make the lowercase wider and darker than the caps. The spacing is just wrong. The text description of the face is deconstructive to a buyers trust, e.g. it is not "purely geometric", and there is no visible relationship between the face and most anything your average Joe would think of as "handwritten". If I were trying to sell this face I would make these and other changes and do so with a clarity of purpose and the joyful knowledge (since it has not sold), that I'm not going to be upsetting anyone. </p>
      <p>I hope Commodity Take Two, or Commodity Mark II or Commodity Priceless happens, because nothing of this scope should be abandoned. I'm sorry if this is tactical tips, "what I would do..." but I'm not much good to you otherwise. </p>
      <p>Cheers!</p>
