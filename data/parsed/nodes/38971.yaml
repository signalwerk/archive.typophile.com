      <p>Time out. Patrick are you serious?<br>
      You asked for an opinion, Clauses gave you an honest one- a well thought out opinion free of sarcasm.</p>
      <p>My opinion is just as well thought out, but much more to the point:<br>
      The fonts you've designed are ugly and expensive for what they are. Tho, the metrics look far better than a 'free font'.</p>
      <p>I find it telling that even less successful or novice designers come to typophile asking "give me your toughest" or "let me have it" whereas polite but direct criticism sets you off. Your being so quick to be offended is counterproductive to your growth as a type designer. I think you know what good design is. The Pentagram website is certainly very good. I also had a gander at the PDF of the House of Pretty portfolio- very well done. Interestingly, I did not see any of your fonts in use there. And why is that Patrick?... </p>
      <p>I know you are not asking for a specific course of action but I'm gonna give it to you anyway:</p>
      <p>-drop the price of all your fonts to 9.99 or less</p>
      <p>-make a pdf showing the repertoire and usage examples (like house industries does with their fonts in their print catalogs). Use colorful and playful graphics so we can see the potential.</p>
      <p>- change the icon/preview on myfonts site to reflect that- it will spark more interest</p>
      <p>- put the fonts on sale too and you <em>will</em> get customers fast</p>
      <p>Before you let <em>me</em> have it,  I understand your work is personal to you and should be but, use our honesty to your advantage. Sour grapes is not you.</p>
      <p>I really do wish you the best. :-)</p>
      <p>Mike Diaz</p>
      <p>PS... Emphasize Gia and Fast Girls as these are your most attractive designs.</p>
