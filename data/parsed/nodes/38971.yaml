      <p>I think this is where some of the other posts come in; you mentioned you didn't expect "everyone to like it. just someone."</p>
      <p>I feel certain more than a few someones have liked and even wanted your typeface . . . just not for $35, unfortunately. I have zero guess of the ACTUAL reason this font has yet to be purchased; in fact no one ever will know for certain. However, there seem to be all kinds of little things you could do to improve the chances of it being sold at this price, and in this same version.</p>
      <p>For example, I mentioned those blinding red flags displaying your fonts on the myfonts.com site, which you used for Commodity as well.</p>
      <p>I must say I have looked far and wide and still have not encountered a single rule or law preventing you from taking a digital camera out to the more trendy, populated spots where you live and taking a picture of the biggest billboard you can find. After which you could - via Photoshop - erase the entire contents of the billboard and come up with your own fictional company . . . which just so happens to use your typeface as the center of its image. Once finished you then could size, display and/or distribute the finished product in the manner you find most appropriate or effective.</p>
      <p>While such a thing probably wouldn't be striking being displayed in the size of a myfonts.com flag, I think you  get the idea I'm trying to get across here. Perhaps you could use an especially striking store window, or whatever . . . anything that would not cross infringement lines. For that matter you could find an empty billboard or window of a failed business somewhere and use those. </p>
      <p>Obviously this would require some functional knowledge of Photoshop or other similar program, but not an obscene amount. What I think this does is places your typeface in a more recognizable, impressive light because, for all intents and purposes, "Commodity" - to many people - actually would be a typeface businesses use on billboards, etc. . . .  which to them automatically makes it great. There are tons of people out there who don't buy things because they don't trust their own assessment abilities or even their own taste; confirmation for them could come easy just by seeing someone really important likes your font too.</p>
      <p>The truth is there aren't an overflow of people who would go check out whether or not your pseudo-business existed, especially if it's a billboard in Europe or the front of some insanely expensive technology store, etc. And even if someone did cry foul, you simply explain that you display these images to give potential clients the best view possible of how your typeface would look in situations that client may one day face. I just don't believe it would be fair to consider such a tactic unethical under any circumstances barring any potential copyright violations; it's actually done all the time with proposals for corporate stationery and so forth . . . you'd just be doing it in a little different way.</p>
      <p>Besides, it wouldn't surprise me in the least to learn that some of the industry's larger and more ff-famous vendors are similarly creative in various ways. But this is just one of countless little tweaks that you could consider not just for this font, but anything really. I know at least in my case, had your font been presented in a way similar to that described above, my initial interest in it would have been much greater.</p>
