      <p>Ricardo Cordoba wrote: "It’s a lie. Under most circumstances, it’s considered unethical to lie."</p>
      <p>There is absolutely nothing untrue about such a thing; it isn't like you're saying you HAVE done the typography for the law firm "Dewey, Cheatham and Howe," or even that it exists. All you'd be doing is giving potential clients and buyers a view of how their particular project might look on a billboard, in a brochure, whatever. Anything a potential client or buyer might assume on his or her own is his or her own problem. And like I said, if one were to inquire about something, what you've created solely was to provide visual possibilities. There's simply no need to say all of your visual samples are of fictional businesses or places unless someone asks. In the meantime, those who only need that extra little push into buying something and don't care about anything but how the typeface will work for them have in whatever strange way had their tastes confirmed. Again, this is speaking in nothing but general terms.</p>
      <p>As for having an agenda . . . do I really? Wow, I better get started on that agenda right away. Now if you could only tell me what that agenda is (since you seem to know), I'll certainly give it my very best effort.</p>
      <p>Patric earlier asked about the color red. In most design settings, the color red is a dominant, aggressive color and usually only works well when you use is to magnify the color itself and not anything it might be enhancing, be it words or anything else for that matter. In fact, when I first looked at your groups of flags on myfonts.com, I didn't even see the fonts for what they were, I just saw a boatload of red ... the color itself had consumed my initial attention and made the fonts secondary. Red - especially such a vibrant shade of it - is a dangerous color for design.</p>
      <p>And in human terms, colors like blue, grey, and even most greens, when worn or used in homes, etc., are considered far more friendly and inviting than is red. Rarely will you ever see anyone employing lots of dominant reds on much of anything because almost immediately just the sight of it will take away much wanted attention from everything around it - whether it be clothes on your body or curtains in your home. This all goes back to what reactive human eye interprets first and how much attention the mind gives it. It's pretty much a universal mantra ... you know, kind of like "painting the town red." You never hear of anyone painting the town blue or some dark eggshell tone.</p>
