    <p>On the current topic of handling of fonts on the Web (via “@font-face” or .eot files), I have made a blog post and launched two related surveys (one of Web designers, one of font vendors).</p>
    <p>The survey for font vendors is here:<br>
    <a href="http://www.surveymonkey.com/s.aspx?sm=I9LYBFmggGJ8SCTU0u3CtQ_3d_3d" title="http://www.surveymonkey.com/s.aspx?sm=I9LYBFmggGJ8SCTU0u3CtQ_3d_3d">http://www.surveymonkey.com/s.aspx?sm=I9LYBFmggGJ8SCTU0u3CtQ_3d_3d</a></p>
    <p>The survey for Web designers/producers is here:<br>
    <a href="http://www.surveymonkey.com/s.aspx?sm=wyFVRRqnxAmTypkzThJOkA_3d_3d" title="http://www.surveymonkey.com/s.aspx?sm=wyFVRRqnxAmTypkzThJOkA_3d_3d">http://www.surveymonkey.com/s.aspx?sm=wyFVRRqnxAmTypkzThJOkA_3d_3d</a></p>
    <p>My blog post is here:<br>
    <a href="http://blogs.adobe.com/typblography/2007/11/web_fonts_1.html" title="http://blogs.adobe.com/typblography/2007/11/web_fonts_1.html">http://blogs.adobe.com/typblography/2007/11/web_fonts_1.html</a></p>
    <p>Comments welcome, and I hope all the font licensors represented here take the survey, as well as the Web designers.</p>
    <p>Cheers,</p>
    <p>T</p>
