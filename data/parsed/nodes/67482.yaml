    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 16.Feb.2010 3.47pm </div>
      <p>Ypsilon Éditeur announces the launch of the Bibliothèque typographique,<br>
    a new collection dedicated to type designers. Their first title, to be published in French and English, is <em>José Mendoza y Almeida</em> written by Martin Majoor &amp; Sébastien Morlighem, introduction by Jan Middendorp.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/86_6250.jpg"></div><p></p>
    <p>French–English edition<br>
    Translated from the English by Étienne Dobenesque and from the French by Jan Middendorp<br>
    176 pages, 8 color pages • 170 x 245 mm • 978-2-35654-008-9<br>
    <a href="http://ypsilonediteur.com/fiche.php?id=86" title="http://ypsilonediteur.com/fiche.php?id=86">http://ypsilonediteur.com/fiche.php?id=86</a></p>
    <p><strong>30 € instead of 34 € until March the 5th of 2010 !</strong></p>
    <p>Born in Sèvres (France) in 1926, still active today, José Mendoza y Almeida is the ‘godfather’ of French type design. He gained international recognition from the most famous typefoundries who published his best known typefaces. During his long career, which has also involved graphic design and calligraphy jobs for publishing and advertising, he collaborated with important figures such as Maximilien Vox and Roger Excoffon. He also taught type design within the Imprimerie nationale, at its Atelier national de création typographique.</p>
    <p>This book, the first ever dedicated to his work, features an introduction by Jan Middendorp and several essays on Pascal, Photina, ITC Mendoza Roman and other less-known typefaces, written by Martin Majoor and Sébastien Morlighem. Many unpublished documents are reproduced in the book for the first time.</p>
    <p>This book will be shipped at the end of the advance order offer on the 5th of March 2010. You can order your copy now on our website: http://ypsilonediteur.com]</p>
