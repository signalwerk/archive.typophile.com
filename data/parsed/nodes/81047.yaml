    html: <p>I've never seen Wilke used in a book. It would certainly require some care to serve the purpose—generous leading for sure. I have been tempted in the past to use it simply for its uppercase Q (roman and italic). However, if I recall correctly it does not have small caps or old style figures, and thus was a non-starter for book typesetting.</p>
