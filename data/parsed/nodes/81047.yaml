  html: |-
    <p>Does anyone know of Wilke being used as a book font or had any experience with it? I printed out a page and I love the way it looks, but not sure about the readability factor. Any help or alternate suggestions is appreciated. The book is full length fiction, hardboiled crime/horror. I'm not pressed for space so I can be generous with size and leading (yay!)</p>
    <p><a href="http://new.myfonts.com/fonts/adobe/wilke/" title="http://new.myfonts.com/fonts/adobe/wilke/">http://new.myfonts.com/fonts/adobe/wilke/</a></p>
    <p>Thanks!!</p>
