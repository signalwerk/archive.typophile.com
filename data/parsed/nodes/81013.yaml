    html: |-
      <p>Thanks to all who have replied. Let me add a little more information about what I <em>think</em> I’m looking for.</p>
      <p>My goal is to create some kind of tool which will make navigating my font collection easier, in terms of locating the kind of font one is looking for, and being more user-friendly than a simple PDF catalog. However, I don’t have any preconceived notions as to what such a tool might look like. Thus, part of the project <em>could</em> include asking students to devise a classification system which is meaningful to them as potential font users/buyers. If they could come up with a widget or an interface to make navigation easier, so much the better, but it’s not a required element.</p>
      <p>So, the font navigation database is what I would like as a minimum: any suggestions to expand the scope of the project—specimen sheet design, perhaps?—would be eagerly entertained, as would be options for offering students incentives/rewards for work beyond the main scope of the project.</p>
      <p>I am not under any formal time constraints or deadlines: I still have some fine-tuning to do myself. But, obviously, the sooner the project gets done, the sooner it can be an important value-added component to the font collection as a stand-alone  retail package. I hope this info makes things a little clearer…</p>
