    <p>I am currently—and rather slowly—in the process of updating the entire Nick’s Fonts library of fonts in anticipation of packaging them in thematic collections and one whole-shebang package. The entire collection represents twelve years of work, with 530+ font families and over 600 fonts. In order to make the packages more navigable for end users, I would very much like to produce accompanying documents classifying the fonts according to style, weight, historical period, attitude and the like. Unfortunately, the exigencies of production (as it were) leave me with little time (or energy) to do the necessary heavy lifting.</p>
    <p>So…it occurred to me that there might be, somewhere in Typophile land, an instructor of typography at the collegiate level who might be able to assist me in this endeavor. This is what I propose:</p>
    <ul>
    <li> I will provide you and your students with my entire collection of fonts, fully licensed for use in the classroom.</li>
    <li>I will donate to your program type specimen books from my collection, to include the ATF 1923 book, the 1934 ATF book, Barnhart Brothers &amp; Spindler’s Catalog #25, and a number of vintage lettering chapbooks.</li>
    </ul>
    <p>What I would like in return, at a minimum, would be spreadsheets covering the classification I outlined, plus any other classifications which we mutually agree might be relevant. And I am certainly willing to consider other options which might allow your students to flex their creative muscles in ways that would also add value to my retail packages.</p>
    <p>If you are such an instructor and interested, please drop me a line a himself [at] nicksfonts [dot] com, and we can talk turkey…or grease…</p>
