    html: |-
      <p>I'm afraid you were misled by the W.<br>
      No, Kabel has slanted line ends throughout. We  need something to fit the R and the S and that leads us to Futura. The W is made of two Vs. Medium or semibold weight to get a pointed V.<br>
      Maybe the R was altered a little. This is a logo after all and not just a paper headline. </p>
      <p>PS: the figures are Copperplate Gothic</p>
