  html: "<p>I'm working on a side project to stencil my own business cards. I discovered that conventional stencils would be a huge drag to cut out at the point size I'm thinking about (&lt;24pt) so I set out to streamline or simplify a font to make it easier on me. <br> <br>This is what I came up with: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/28952.jpg\" alt=\"placid1\"> <br> <br>For cards looking something like this (except a more interesting background) <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/28953.jpg\" alt=\"placid2\"> <br> <br>Any suggestions? Know any similar typefaces that might inspire me? <br> <br>Thanks.</p>"
  html_clean: "<p>I'm working on a side project to stencil my own business cards. I discovered that conventional stencils would be a huge drag to cut out at the point size I'm thinking about (&lt;24pt) so I set out to streamline or simplify a font to make it easier on me. <br> <br>This is what I came up with: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/28952.jpg\" alt=\"placid1\"> <br> <br>For cards looking something like this (except a more interesting background) <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/28953.jpg\" alt=\"placid2\"> <br> <br>Any suggestions? Know any similar typefaces that might inspire me? <br> <br>Thanks.</p>"
