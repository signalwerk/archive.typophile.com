    html: <p>Surprisingly, I like the style. <br> <br>On the actual card though some of the letterform ambiguity is translating into actual probable confusion, due to letter sequences people <i>expect</i>. The two big problems I see are both in your last name (and they're supporting each other), which is tempting to read "BRIGHTAL" or at best "BRICHTAL". Just making the tops of the "A" round would probably make it snap into place. <br> <br>Also, I would put a dot (vertically centered) before the "ORG" - for one thing some people would think "Oregon"... and maybe as a result think you live in town where everybody is always very hungry.  :-) <br> <br>hhp <br></p>
    html_clean: <p>Surprisingly, I like the style. <br> <br>On the actual card though some of the letterform ambiguity is translating into actual probable confusion, due to letter sequences people <i>expect</i>. The two big problems I see are both in your last name (and they're supporting each other), which is tempting to read "BRIGHTAL" or at best "BRICHTAL". Just making the tops of the "A" round would probably make it snap into place. <br> <br>Also, I would put a dot (vertically centered) before the "ORG" - for one thing some people would think "Oregon"... and maybe as a result think you live in town where everybody is always very hungry.  :-) <br> <br>hhp <br></p>
