      <p>Misprinted Type is quite simular to Fontplayers suggestion, with some quite cool type specimen pages for each font. <a href="http://www.misprintedtype.com" title="http://www.misprintedtype.com">http://www.misprintedtype.com</a></p>
      <p>Four Minutes to Midnight (2356) has some great magazine spreads using different fonts and layouts to communicate the context of dialog printed. Not sure if thats the kind of treatment your after however. <a href="http://lokidesign.net/2356/" title="http://lokidesign.net/2356/">http://lokidesign.net/2356/</a></p>
      <p>For more magazine spreads I dont think you can go past Peter Maybury, He has some beautiful typographic spreads, particularly his work on Code magazine is most impressive. <a href="http://www.softsleeper.com" title="http://www.softsleeper.com">http://www.softsleeper.com</a></p>
