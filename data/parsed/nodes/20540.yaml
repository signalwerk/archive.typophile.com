    <p>Hey i'm just looking for a list of interesting type treatments. anything from logos/posters/print work/etc. </p>
    <p>I really like Si Scott:  <a href="http://www.siscott.co.uk/" title="http://www.siscott.co.uk/">http://www.siscott.co.uk/</a><br>
    and Hydro 74: <a href="http://www.hydro74.com/" title="http://www.hydro74.com/">http://www.hydro74.com/</a></p>
    <p>Those are probably the two best examples that I have. I am looking mainly for ideas for type treatments for a shirt I am making for the team that I coach. Any websites/images/books that have similar inspiration would be great. Thanks!<br>
    -Jesse</p>
