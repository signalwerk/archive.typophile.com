  html: <p>This type design is was designed for a company that pressure washes large commercial trucks and industrial  <br>sites. Icon still in works.  <br>One challenge was to make this match former logo.  <br>I did former logo a year ago when company was called Pressure Washers. Name was changed as company got a lot of requests from people wanting to buy pressure washing equipment, so old identity/business has remained but now sells equipment. text for collateral and promotional materials will be set in Henrik Kubel's Klampenborg. The type face I designed for this project is based on Klampenborg. <br>  <br><img src="http://www.typophile.com/forums/messages/29/51736.jpg" alt="F.I.S. Logotype"></p>
