    html: <p>Interesting face <br> <br>The slanted stroke endings make me a little uneasy. Maybe they could work better if they integrated more with adjacent letters. Ole, it is hard to say. The "I" for example has 3 dimensional quality and a flat quality at the same time.???? I guess as always my instict would be to simplify the typeface more. The R doesn't need so many angles in it's terminal. Or maybe it does. Some variations would be nice to see. Still a very fresh looking face. Reminds me of a Din AG combo.</p>
