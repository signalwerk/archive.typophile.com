  html: <p>Whoops, <a href="http://www.typophile.com/cgibin/show.pl?30/49074" target="_blank"> this thread</a> slipped by so fast I didn't see it, and  <br>now I noticed nobody mentioned my favourite unicase  <br>designs. <a href="http://www.psyops.com/html/spec_eideticneo.html" target="_blank"> Eidetic Neo</a>, in itself a beautiful and very forward- <br>thinking serif face, has a great unicase weight <a href="http://www.emigre.com/dp/getfontpage.php?PEidOm.html" target="_blank"> Omni</a>.  <br> <br>Also, both Emigre's <a href="http://www.emigre.com/dp/getfontpage.php?PPlaR.html" target="_blank"> Platelet</a> and <a href="http://www.emigre.com/dp/getfontpage.php?PDemR.html" target="_blank"> Democratica</a> have capitals  <br>that are x-height sized, so they lend themselves perfectly to  <br>unicase setting. <br> <br>And I know this is probably stretching it a bit thin, but  <br>combining <a href="http://www.emigre.com/dp/getfontpage.php?PMrsR.html" target="_blank"> Mrs. Eaves</a> lowercase with the <a href="http://www.emigre.com/dp/getfontpage.php?PMrsP.html" target="_blank"> Petite Capitals</a> <br>- smaller than the Small Caps and also x-height sized -  <br>allows one to set unicase as well.</p>
