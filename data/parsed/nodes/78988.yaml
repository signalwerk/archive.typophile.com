      <p>So, I guess no one knows?</p>
      <p>It's a great opportunity to recreate. I have a friend that recreated A-Z in vector format (based on all the Bboy crew images we could pull together). I was hoping to see what other punctuation marks and such existed alongside the letters and numbers.</p>
      <p>I've found similar "Old English" fonts but none of them are exact (see attached).</p>
      <p>I know it was an Iron-on letter but it must or originated somewhere. I just need to find the random rare font book it was pulled from or printer (late 70's china town, NYC).</p>
