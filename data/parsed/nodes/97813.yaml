      <p>Ofﬁcina Display, of course.<br>
      The Bold weights are not light, but the close spacing is deft and precise—a light touch, as it were.</p>
      <p>My <a href="http://www.myfonts.com/fonts/shinn/sense/" rel="nofollow">Sense</a> has similar proportions to Ofﬁcina Sans, and like Ofﬁcina Display is tightly ﬁtted and kerned for heads and decks.</p>
      <p>For the masthead, I would suggest trying many widely different options and see what they look like in situ, and trust your own taste to be slightly (but not too much) ahead of the readership, in choosing two or three options to present to a focus group.</p>
