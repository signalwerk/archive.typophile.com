    <p>Hello all,</p>
    <p>This is the first time I post to the forum, so any advice you have to offer would be greatly appreciated.</p>
    <p>I am redesigning a science and technology magazine that uses Officina Sans for the body text. Right now the masthead is Serpentine, pagination is Eurostyle, the deck and some headlines are Avenir and some heads are Trade Gothic (as are the dropcaps). </p>
    <p>Needless to say, the result is very heavy and chaotic. I am looking to streamline the number of fonts and create a lighter,  more contemporary look. Any suggestions for fonts that would pair well with Officina Sans for Headlines, pagination, and masthead? </p>
    <p>Thanks in advance for your time.</p>
