      <p>This is impossible to measure. I would say that the odds of our readers "getting" exactly our reason for a typeface choice is not very high unless the target audience  is the design/typography crowd. That does not mean our loves' labours are lost, it just means audiences can't verbalize intangible effects.</p>
      <p>ChrisL</p>
