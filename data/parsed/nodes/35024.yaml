      <p>&gt; <em>Does anybody here know if the Opentype fonts Adobe is shipping with CS3 (Creative Suite 3) are updated/altered versions of their fonts?</em></p>
      <p>As far as I know, the fonts are the same version as the ones that shipped with CS2 (e.g. AGaramondPro-Regular.otf is version 1.007 in both CS2 and CS3).</p>
      <p>&gt; <em>(though I’ll leave the PostScript version on my system just in case)</em></p>
      <p>Keep in mind that the (PostScript) Type 1 versions of some fonts are NOT necessarily <strong>fully compatible</strong> with their corresponding OpenType (CFF) versions.</p>
