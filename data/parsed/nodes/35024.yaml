    <p>May not be the right forum, but...</p>
    <p>Does anybody here know if the Opentype fonts Adobe is shipping with CS3 (Creative Suite 3) are updated/altered versions of their fonts? The files’ modification dates show March 2007, where my older Adobe files show 2003. I don’t want to replace my existing files, but at the same time, don’t want to have issues with older fonts.</p>
    <p>I notice that some faces are “new” additions, while some have been dropped; Adobe Garamond Pro, for example, is included on the disk, but only in four weights (regular/italic/bold/bolditalic), while their earlier release (which I think came with CS2) includes the semibold/semibolditalic weights. Nueva Std, on the other hand, includes four new weights: boldcondensed, boldcondensedoblique, condensed, and condensedoblique. And they’ve thrown in venerable fonts like Prestige Elite — I’m hoping the metrics haven’t gone all wonky and will screw up older docs (though I’ll leave the PostScript version on my system just in case).</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/35132" class="topic-previous" title="Go to previous forum topic">‹ Where to post kerning bugs in Adobe fonts?</a> <a href="/node/35164" class="topic-next" title="Go to next forum topic">Fontlab and Python versions ›</a></div>
