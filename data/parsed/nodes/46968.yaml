      <p>i’m checking online like abebooks.<br>
      My father has taken a calligraphy course for a secretary job but the problem is that he lost his books... Books were in bad shape.<br>
      I’m not much interested on artsy/craftsy as you said cause 99% of them are bad books. I don’t think that beautiful type. Of course, there are exceptions and thats why i’m asking around here.<br>
      If you know any of those exceptions and so... see what i mean?</p>
