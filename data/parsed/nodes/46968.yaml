    html: '<p>Not a how-to, but a great collection of examples of italic script manuals from the 1500s: Kathyrn Atkins’s <a href="https://web.archive.org/web/20080906194306/http://www.amazon.com/Masters-Italic-Letter-Twenty-Two-Exemplars/dp/0879235942/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1214960832&amp;sr=8-1"><em>Masters of the Italic Letter</em></a>.</p>'
