    html: <p>Check your local book stores. Calligraphy is always in style with some artsy/craftsy demographic or other, so you can usually find used books cheap. Or just check new book stores and art supply stores—even the in-print books don’t cost much new.</p>
    html_clean: <p>Check your local book stores. Calligraphy is always in style with some artsy/craftsy demographic or other, so you can usually find used books cheap. Or just check new book stores and art supply stores—even the in-print books don’t cost much new.</p>
