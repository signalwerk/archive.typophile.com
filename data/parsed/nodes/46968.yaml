    html: <p>If you want to get that deep into italics, have a look at renaissance lettering specimens. I’ve posted a facsimile of <a href="https://web.archive.org/web/20080906194306/http://www.jpad.biz/pdfs/tas.pdf"><em>Theatrum Artis Scribeni</em></a> on my web site.</p>
