    <p>Hi there!<br>
    Here i am again, after publishing my stencil font and my mono-spaced i’m thinking now on finishing my “Clarendon” and start a script and a italic font. The problem is like on everything: knowledge.<br>
    I’m searching for books easy to get and/or cheap so i can get some notions and learn how is a good letter on script and on italic.</p>
    <p>Can anyone help me on this subject?</p>
