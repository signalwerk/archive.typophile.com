      <p>Please give reasons. I've been using Suitcase for years. I did stray when Adobe had ATM - which was great. But they never updated it for System 10.</p>
      <p>Today I tried FontExplorer - and I am so sad I did. I've lost several hours of work, while it had a font conflict between a job I did a month ago in Quark 7.02 and ITC Kabel and the system font Chicago. It took many, many hours -- starting, restarting, killing preferences, removing XTensions - till I could figure out the problem.</p>
      <p>And that I have not had before with Suitcase. But what ever the damage was -- Suitcase also felt the pain....</p>
