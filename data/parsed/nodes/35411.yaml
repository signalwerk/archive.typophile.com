      <p>Please Help.</p>
      <p>I have the older Microsoft Office on my G5 and it use to work fine...</p>
      <p>I tried the Font Explorer (because of this thread) and several programs went nutsy on me. I finally have Suitcase back in play, but when I go to Microsoft Word - it quits out in seconds. The error report says Error Signature</p>
      <p>I have uninstalled - used "Remove Office" -- removed everything possible - and reinstalled. Powerpoint is fine. But not Word - and well, I hate to sound like a crybaby -- but I have a need for Word (right now) -- I'm about to edit the articles that have arrived for our Oct/Sep issue of the magazine...</p>
      <p>Does anyone have any idea what I can do to get Word to work again? </p>
      <p>And I am writing it here - because it was fine till I installed and try to use Font Explorer....</p>
