    <p>hello<br>
    We need to make several books with handwriting text. This is textbook book for teaching childs in first class how to write.<br>
    We have one font for this purpose (look in attachment) but problem is that we need to choose "link glyph" (underline glyphs in attached picture) between every two glyphs and manually adjust kerning. This is looser work. We use indesign cs4 or cs6.</p>
    <p>What solution I have to can easy type text without manual kerning work? How to rebuild this font and use indesign tools for easy job?</p>
    <p>thanks</p>
