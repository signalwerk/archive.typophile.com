    html: |-
      <p>This is one of the reasons why ligatures and OpenType features exist. If your font has "link glyphs," as you imply, chances are it already has this support and all you need to do is enable them in InDesign. If said font lacks the features logic, it's a pain but not that hard to write a basic features file to enable them.</p>
      <p>Ideally, your font should automagically insert predesigned ligatures for many sequences of letters, using the link glyphs only as needed for exceptional cases.</p>
      <p>It might be easier to choose a different font that has these capabilities -- doing it by hand can give great results (and you'll need to tweak it manually anyway) but it's a major pain, more trouble than it's worth.</p>
