    <p>Hi everyone!</p>
    <p>I'm looking for a, good ;-), web article about the construction of an italic.<br>
    Small history about cursive fonts...<br>
    Advantages/disavantages of cursive vs. slanted (oblique)...<br>
    Why some fonts have lots of cursive characters...and others dont<br>
    Diferences in italic from Sans and Serif...<br>
    What can we consider a good italic, etc...<br>
    I want to learn more about it.<br>
    Can be one article or lots of them. I try to google it but no luck and I'm sure that the typophile comunity has so much input about this...</p>
    <p>Thanks in advance<br>
    António</p>
