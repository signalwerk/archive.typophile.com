    <p>Hi,</p>
    <p>I would like to do a handwriting signature for a DVD cover (TIFF 300 dpi).</p>
    <p>My cover is in Photoshop. Black background. I used the “sharp” setting for my fonts (mainly Eurostile)</p>
    <p>I need to do the handwriting in white on black.</p>
    <p>I had some info in this thread: <a href="https://web.archive.org/web/20080821154230/http://www.typophile.com/node/20954" title="http://www.typophile.com/node/20954">http://www.typophile.com/node/20954</a>, about Illustrator, Live trace, Photoshop etc.</p>
    <p>But I‘m still confused...</p>
    <p>What will be the best way to do this? Can I do it by hand straight into photoshop or Illustrator? Hand tracing, scan / Livetrace, Pen tool?</p>
    <p>I never used illustrator before but I can try. I use Photoshop usually.</p>
    <p>Many thanks.</p>
