    html: |-
      <p>Dario,</p>
      <p>I have an update, a colleague of mine was having this same problem and found that it was a permissions problem. Check the directory that it's trying to install the robofab.pth file to and see if your user has permissions to write there:</p>
      <p><code>/System/Library/Frameworks/Python.framework/Versions/2.3/lib/python2.3/site-packages</code></p>
      <p>Locate that folder and Get Info on it and in the details at the bottom of the Info window, if it says that you only have read access, click the lock icon and give your user Read &amp; Write access.</p>
      <p>That'll at least get the robofab.pth file installed, but you may still need to copy it into the site-packages folder for an older installation of Python.</p>
      <p>Andy</p>
