      <p>Check and see where RoboFab's "robofab.pth" file was installed, it may have been installed in the Universal install of Python in HardDrive/Library/Frameworks/ but since FontLab isn't a Universal Binary it is going to be using the older install of Python in HardDrive/Library/Python/</p>
      <p>Go ahead and copy the robofab.pth file to a location that looks more like this one:<br>
      HardDrive/Library/Python/2.3/site-packages/robofab.pth</p>
      <p>Andy</p>
