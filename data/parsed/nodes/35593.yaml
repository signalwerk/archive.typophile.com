    <p>hi everybody</p>
    <p>I need some help and i hope someone can help me.</p>
    <p>i have a new imac intel and i am trying to install robofab but for some some reason i can not make python work. I probably did a mess:<br>
    first I installed python 2.5.1. Then I realized that robofab needs the python 2.3.3, I installed it but it didn´t work. So then I trashed everything and then re-installed python 2.3.3 but during the installation I got an error message about preferences that I should delete first in order to use robofab, but I can't find this preference archive.<br>
    Is there any way of going back to the beginning?</p>
    <p>hope someone has any idea about it. thanks!</p>
