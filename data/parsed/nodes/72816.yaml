    <p>This may be a custom design. I tried searching for matches and found a post from someone who said they were working on it, but couldn't find any details.</p>
    <p>Here's the post: <a href="http://woods.jezburrows.com/post/662872748/excited-to-to-be-working-on-the-identity-and" title="http://woods.jezburrows.com/post/662872748/excited-to-to-be-working-on-the-identity-and">http://woods.jezburrows.com/post/662872748/excited-to-to-be-working-on-t...</a> </p>
    <p>and the website:<br>
    <a href="http://buildconf.com/" title="http://buildconf.com/">http://buildconf.com/</a></p>
    <p>I am interested in fonts similar to this if they exist. It's a great identity. I like the "machine" look it has but is still personable with all the curves.</p>
    <p>Does anyone know of some fonts similar to this? Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/build_5346.png"></div><p></p>
