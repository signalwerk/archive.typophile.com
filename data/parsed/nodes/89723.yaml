    <p>Hi there,</p>
    <p>I am having problems trying to decompile a TTF font with the mac version of TTX (2.0b1)</p>
    <p>Traceback (most recent call last):<br>
      File "Titaantje:Users:just:code:fonttools:Tools:ttx", line 11, in ?<br>
      File "Titaantje:Users:just:code:fonttools:Lib:fontTools:ttx.py", line 250, in main<br>
      File "Titaantje:Users:just:code:fonttools:Lib:fontTools:ttx.py", line 235, in process<br>
      File "Titaantje:Users:just:code:fonttools:Lib:fontTools:ttx.py", line 154, in ttDump<br>
      File "Titaantje:Users:just:code:fonttools:Lib:fontTools:ttLib:__init__.py", line 220, in saveXML<br>
      File "Titaantje:Users:just:code:fonttools:Lib:fontTools:ttLib:__init__.py", line 235, in _tableToXML<br>
      File "Titaantje:Users:just:code:fonttools:Lib:fontTools:ttLib:__init__.py", line 322, in __getitem__<br>
      File "Titaantje:Users:just:code:fonttools:Lib:fontTools:ttLib:tables:O_S_2f_2.py", line 106, in decompile<br>
    fontTools.ttLib.TTLibError: unknown format for OS/2 table: version 3</p>
    <p>Any idea? Is it maybe because my TTX version is outdated?</p>
    <p>I downloaded the latest version (2.3) at:<br>
    <a href="http://sourceforge.net/projects/fonttools/files/" title="http://sourceforge.net/projects/fonttools/files/">http://sourceforge.net/projects/fonttools/files/</a></p>
    <p>Then I read the install.txt inside folder 'documentation'. There it says:</p>
    <p>Installation<br>
    For Windows and MacOS there are easy-to-use TTX installers. The rest if this<br>
    document is meant for people who want to use TTX/FontTools from the source.</p>
    <p>Problem is, I can't find the mac installer in any of the folders.</p>
    <p>Can anyone give me a hint?</p>
    <p>Thanks in advance.</p>
