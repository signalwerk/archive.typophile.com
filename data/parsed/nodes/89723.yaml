  - id: 493925
    user: 31798
    date: 2012-02-05T07:37:00
    date_raw: 5 Feb 2012 — 7:37am
    votes: null
    html: |-
      <p>It needs to be invoked from the command-line.</p>
      <p>In the terminal, type</p>
      <p><code>/Developer/FDK/Tools/osx/ttx</code></p>
      <p>and you should get a brief description of the options available from the command line. Your simplest way of using it is to follow the above with the path to a file (either an .otf, .ttf, or .ttx file).</p>
      <p>(n.b. the above path is what is present on my system -- depending on how you installed FDK and the version, yours might be different, but look for a folder called Tools in your installation. You can simplify the above by including the fdk tools in your PATH variable).</p>
      <p>André</p>
