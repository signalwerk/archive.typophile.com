    <p>Hi all, </p>
    <p>I am considering purchasing <a class="freelinking external" href="http://www.joshuadarden.com/shop/freightsans.php" rel="nofollow">Freight Sans</a> however I would like to know exactly how editable the typeface is. More specifically, I require the ability to outline the type in order to send it to print. Is this an option when I purchase? (TrueType, OpenType etc.) Or is it up to the foundry to enable/disable this option. </p>
    <p>Basically I want to use this typeface at a number of printers, so I would like to use the outline method to embed it into the document, unless you guys know of a better way?</p>
    <p>Hope you guys can fill me in...</p>
    <p>Cheers,<br>
    Ben</p>
