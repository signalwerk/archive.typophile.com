    html: |-
      <p>This is an interesting question. It would seem to me that outlining the fonts would slow the file down. Why not just embed them?</p>
      <p>Item f in their EULA seems to allow for this. </p>
      <p>"f. Licensee may embed the fonts in electronic documents provided to Licensee's authorized service bureaus or printers, provided that Licensee ensures that said service bureaus or printers agree to delete or return the electronic documents at the conclusion of rendering services to Licensee."</p>
      <p>[Removed this sentence because it was stupid.]</p>
