      <p>&gt; More convenient.</p>
      <p>Really? It might weigh less, but you need a device to read it on, which has to be charged and have batteries, or be plugged in; you need suitable lighting conditions to see the (backlit) screen; your device is much more likely to be stolen, or to crash, or otherwise suddenly stop working; you need an internet connection or some similar method of getting books …</p>
      <p>Digital media are not archival quality. A printed text can survive without its binding, but a digital text cannot survive without a device on which to store it. Even the entirety of the internet is not simply "out there" but stored on servers around the world. The internet is only as good as the machines that hold it. If the power to the servers is cut, there goes your webpage.</p>
      <p>Of course the internet, for all intents and purposes, is stable and not going anywhere. But the point is that anything digital is dependent on a device — other than the human eye — that can decode it. What does an e-book look like when you're not reading it? For that matter, what does it look like on a different device?</p>
      <p>From the perspective of a book designer, e-books are terrible! And this is not coming, by the way, from someone who's been in the industry for decades and can't stand change — this is coming from a college student who is really just starting out and frightened by the speed with which designers and publishers are going digital. To look at this purely from a design/typography perspective, it is nearly impossible to make an attractive, effectively designed e-book. And even if you can, it will look completely different on one reader than on another.</p>
      <p>Does no one miss the freedom to choose a paper, a font, a size, margins, leading, colors — in other words, to design? Try to make a foldout for an e-book. Try to make an e-book with a deckle edge. [This is what I was referring to above, and these are indeed things that I will be attempting in the coming months.] Hyperlinks are nice, but are they nice enough to warrant abandoning decent typography?</p>
      <p>I'll stop ranting for a second, because I do want to hear some other opinions. So, anyone who does prefer e-books, I would be very interested in hearing more about why.</p>
      <p>Also — thank you, Bradley, for starting this thread. This is a topic that's been on my mind and it's great to see other people's responses as well.</p>
