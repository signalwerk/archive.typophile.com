      <p>&gt; the e-book is so much cheaper to distribute</p>
      <p>A little cheaper, but I believe the cost of printing and bulk shipping averages less than 15% of a book's retail cost.</p>
      <p>&gt; And I weep when I think of all the knowledge that is likely to be needlessly lost</p>
      <p>Changing technology is certainly a concern, but on the other hand most printed books are eventually discarded, especially ones by authors who aren't famous (which is the vast majority of books).  </p>
      <p>I used to work at a public library and we regularly discarded books that were worn out, moldy, contained outdated info, or just not in demand anymore. Libraries generally do this quietly because folks in the community react negatively if they see books in a library dumpster.</p>
