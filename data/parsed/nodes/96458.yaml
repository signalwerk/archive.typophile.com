      <blockquote><p>Do you prefer reading a printed book or a digital book? Why?</p></blockquote>
      <p>I prefer digital books in e-Ink* as long as the content doesn't depend on being large or colorful - which however does tend to exclude most of the books I would personally want to read.</p>
      <p>* I don't believe emissive screens are good for getting truly comfortable.</p>
      <p>Why digital: because it's elegant on a number of levels. There are many ways in which physical books are quite clunky.</p>
      <blockquote><p>How has the process of reading been transformed by technology?</p></blockquote>
      <p>In terms of the mechanics of reading, not much at all (sadly).</p>
      <p>In terms of the psychology of reading, it's been adversely affected by the ease of accessing audio and video material instead.</p>
      <blockquote><p>How much of an influence can the medium of presentation (ie. book, magazine, ipad, laptop, web browser) have on the interpretation of the content?</p></blockquote>
      <p>It has a very big influence, especially when it's a novelty.</p>
      <blockquote><p>How important do you consider tactility to us as participants in a publication?</p></blockquote>
      <p>Not very. Once you get immersed in a text you forget what your hands are doing.</p>
      <p>Also, a book is an idea - it doesn't have to exist physically to make its mark.</p>
      <blockquote><p>As publishing becomes more internet-based, how can we ensure the longevity of our information?</p></blockquote>
      <p>The Internet promotes longevity; but it doesn't promote focus.</p>
      <blockquote><p>Do ebooks provide the same kind of snapshot of history that an encyclopaedia would, or is history "edited out" as the ebook is updated?</p></blockquote>
      <p>History gets edited in any medium; and any "snapshot" is misleading.</p>
      <blockquote><p>Do you see an issue with the requirement of an electronic device and internet connection to access ebooks?</p></blockquote>
      <p>A live Internet connection should not be required to read a book.</p>
      <p>But I'm not sure I understand all of your question.</p>
      <blockquote><p>How heavily do we rely on secondary technologies to access stored information?</p></blockquote>
      <p>I don't think I understand the question.</p>
      <blockquote><p>the physical destruction of e-readers by means of the same techniques that makes printed books beautiful.</p></blockquote>
      <p>Huh?</p>
      <p>BTW printed books are only beautiful because we've been told they're beautiful. What's really beautiful is the idea and action of communicating.</p>
      <p>hhp</p>
