      <p>I have an e-reader (iPad). I keep it charged. I have an internet connection. I take reasonable precautions to keep it from being stolen. (And printed books can get stolen too; it's happened to me.) If the iPad breaks I'll get it fixed or buy a new one.  </p>
      <p>I'm not saying that e-readers are better in every respect than printed books, especially for books that contain special features like fold-outs, etc. I'm just saying that for me, reading books is convenient on it. Your mileage may vary.</p>
