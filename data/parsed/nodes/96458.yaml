      <p>1. Printed book. The only exception is enormous works of reference that should be searchable. Printed books are easy to use, don't crash, don't run out of battery; you can write in them, hand them down, discover them in used-book shops; the design possibilities of print are limitless — dozens of colors, different types of paper, no size restrictions, die cuts, embossing, binding methods … It took printed books 500 years to evolve to the point they're at now. Maybe in another five hundred years digital books will work as well as print.<br>
      4. Very important. It grounds the book in the world. It makes it last. It clarifies what it means to own a book. I don't consider digital books to be "published" in the same way printed books are.<br>
      5. Keep printing.<br>
      6. Very interesting point — very Orwell. Yes, I suppose, the intangibility of electronic data is inherently opposed to archiving.</p>
      <p>In case my stance on e-books isn't clear just yet, I'm embarking on a project called Perks of Print (<a href="http://www.perksofprint.com" title="www.perksofprint.com">www.perksofprint.com</a>), which I will write up here when I have something to show for it, which involves the physical destruction of e-readers by means of the same techniques that makes printed books beautiful.</p>
