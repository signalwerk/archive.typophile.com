    <p>To introduce myself briefly, I am a 22 year old Masters of Computer Graphic Design candidate in Whanganui, New Zealand.  I am looking to start bit of a dialogue here: digital publication compared to print publication, with respect to the retention, enjoyment and legibility of the information we publish. I have included some questions to begin the discussion below. I would greatly appreciate your participation in this discussion, and hopefully it is something that we can all grow and learn from.</p>
    <p>Do you prefer reading a printed book or a digital book? Why?<br>
    How has the process of reading been transformed by technology?<br>
    How much of an influence can the medium of presentation (ie. book, magazine, ipad, laptop, web browser) have on the interpretation of the content?<br>
    How important do you consider tactility to us as participants in a publication?<br>
    As publishing becomes more internet-based, how can we ensure the longevity of our information?<br>
    Do ebooks provide the same kind of snapshot of history that an encyclopaedia would, or is history "edited out" as the ebook is updated?<br>
    Do you see an issue with the requirement of an electronic device and internet connection to access ebooks?<br>
    How heavily do we rely on secondary technologies to access stored information?</p>
