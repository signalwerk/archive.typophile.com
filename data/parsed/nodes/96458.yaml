      <p>&gt; Do you prefer reading a printed book or a digital book? </p>
      <p>I love printed books, but if the book is primarily text I prefer an ebook simply because it is much more convenient.</p>
      <p>&gt; As publishing becomes more internet-based, how can we<br>
      &gt; ensure the longevity of our information?</p>
      <p>Well most printed books don't last forever either. The vast majority of printed books are not best-sellers and are soon forgotten and difficult to find. Even books that are carefully saved can wear out eventually. I used to work at a public library and we regularly discarded books from damage due to water, mold, insects, or accident, or they just wore out. Digital storage actually makes it easier to keep copies of large numbers of books. A big challenge though is when books are kept electronically on media such as CDs, etc as technology changes quickly and storage methods that were popular in the past become obsolete.</p>
