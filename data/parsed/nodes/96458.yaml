      <p>I'd like to chime in because, unlike most people, I <em>generally</em> prefer reading on an electronic device.</p>
      <p>When I was growing up, the beauty of Internet access was mostly that I suddenly had access to a great deal of specialized information that I would never be able to find at the library. I would stay up long into the night reading 9pt, pre-ClearType text on a blurry CRT. The technological state of electronic reading today closely resembles a what I dreamed of back then.</p>
      <p>Everyone says they prefer the physical artifact of a real book, and I usually remind them that that's what we used to say about CDs, although books at their best are more charming than CDs. Still, I find the typical book annoying. For all we talk about well-composed pages and the feel of the paper and that lovely smell, most books offer the distractions of thoughtless layouts, bad gluing, cheap paper, and covers coming slowly unlaminated at the edges.</p>
      <p>When comparing the same content in print and on my tablet, I often marvel at how much crisper images can be on the IPS screen than in four-color offset.</p>
      <p>The biggest problem with the new flesh is content distribution. I still take some offense at being asked to pay the same amount for an e-book as for the real thing when the e-book is so much cheaper to distribute, probably even more carelessly laid out, and encumbered by some DRM that is likely to cause unforeseen difficulties accessing it at some point in the future. If e-books were half the price, I would likely buy three times as many. And I weep when I think of all the knowledge that is likely to be needlessly lost as orphaned works.</p>
      <p>Still, the future looks bright. At some point, we'll start focusing on the possibilities offered by beautiful electronic book designs in open, interoperable formats. I hope.</p>
