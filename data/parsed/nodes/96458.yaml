      <blockquote><p>Do you prefer reading a printed book or a digital book? Why?</p></blockquote>
      <p>It depends on the content and the context. Generally, for larger technical books as a matter of convenience, tagging/bookmarking and ease of transport I would prefer digital. For highly visual content, something like, <a class="freelinking external" href="http://www.taschen.com/pages/en/catalogue/photography/all/05744/facts.frederic_chaubin_cosmic_communist_constructions_photographed.htm" rel="nofollow"><em>Cosmic Communist Constructions Photographed</em> by Frédéric Chaubin</a>, while I am open to the possibility, I do not see how a digital device could (currently) do justice to the content. That said, personally I also enjoy the weight of a book like that, not in terms of the perceived or actual value of the object, rather it is nice to be seated at a desk or in a good armchair and have the absolute presence of the object, preferably with a glass of French Malbec.</p>
      <blockquote><p>How has the process of reading been transformed by technology?</p></blockquote>
      <p>Depends on content, context, device and environment. The question is not specific enough either, which technology and in what context? The <a class="freelinking external" href="http://www.mentalfloss.com/blogs/archives/63138" rel="nofollow">Penguincubator</a> was/is technology but I assume that is not what you mean...?</p>
      <blockquote><p>How much of an influence can the medium of presentation (ie. book, magazine, ipad, laptop, web browser) have on the interpretation of the content?</p></blockquote>
      <p>This depends on the bias of the content creators, distributors and readers.</p>
      <blockquote><p>Do you see an issue with the requirement of an electronic device and internet connection to access ebooks?</p></blockquote>
      <p>No more or less than I view the requirement of a television, computer or other display interface to view visual content as an issue. They are a means to an end and if I am not interested in the end result then I will not bother with the means to get there.</p>
      <blockquote><p>How heavily do we rely on secondary technologies to access stored information?</p></blockquote>
      <p>What is a primary technology?</p>
