      <p>The 1980s was a period of transition in the design-typography business. At the beginning of the decade, phototypesetting was supplanting hot and cold metal composition; and, by the end of the decade, desktop publishing was on its way to making dedicated typesetting equipment and its operators quaint curios of the past.</p>
      <p>As I remember it, the ITC effect—classic typefaces re-imagined with larger x-heights—was a strong current, as was a lot of homogenized design occasioned by the limited range of typefaces available on Macs.</p>
