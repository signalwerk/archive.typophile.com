      <blockquote><p>the serif structure of ITC Cheltenham</p></blockquote>
      <p>I call those Doric* serifs, which I used -even more literally- on Maral, my first decent outline font (although it was a revival, a concept I wasn't even aware of back then :-). Although I was a decade later, I've always adored Cheltenham, and some people say they can still see it in my work (like in Patria's caps).</p>
