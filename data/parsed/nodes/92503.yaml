    <p>Hey Typophiles</p>
    <p>I sure hope someone out there can help me.<br>
    Currently i am in the middle of writing an essay about the style in the 80s, including everything from fashion to magazine design.<br>
    I am having a bit of trouble though finding any info on what types of fonts where used back in the 80s, for magazines, ads and the likes.</p>
    <p>If someone could direct me towards some sites with info, or perhaps share some examples on fonts and how they where used, that would be fantastic.</p>
    <p>Thanks in advance :)</p>
