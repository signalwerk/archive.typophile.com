    html: <p>Ah, yes, the tight settings. That influenced me so much that it still seems normal, and any unkerned space just seems glaringly vast to me. I hadn't thought about it before, but I suppose that the trend was commanded by the fresh novelty of phototypesetting's ability to overlap type to that degree.</p>
