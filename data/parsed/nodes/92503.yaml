      <p><a href="http://www.shinntype.com/Writing/Industri.pdf" rel="nofollow">Industria</a>, developed for <em>The Face</em>.</p>
      <p>However, Industria was not available as a font until 1989, IIRC.</p>
      <p>Among the earliest digital foundries were Adobe, Emigre, FontFont and Font Bureau.</p>
      <p>Laserwriter bundled fonts, 1985:<br>
      Helvetica<br>
      Times<br>
      Courier<br>
      Symbol<br>
      Bookman<br>
      Avant garde Gothic<br>
      Zapf Chancery</p>
  - id: 507235
