    date: 2012-04-26T15:01:00
    date_raw: 26 Apr 2012 — 3:01pm
    votes: null
    html: |-
      <p>Helvetica as body copy. Avant Garde Bold for display. ITC Garamond. Souvenir. Friz Quadrata. Eras. Bookman with swashes. No end of "futuristic" and "computery" display lettering constructed with a compass and straight-edge. The chrome effect, first by airbrush and then with the infancy of 3D graphics.</p>
      <p>I assume public libraries still have periodical archives. Go to one and pick out a bunch of magazines from the '80s to see for yourself what they looked like.</p>
  - id: 507265
    user: 2021
    date: 2012-04-26T18:07:00
    date_raw: 26 Apr 2012 — 6:07pm
    votes: null
    html: |-
      <p>I always thought that the American agency with the most stylish typography in the 1980s was Fallon McElliggott Rice, Nancy Rice being the art director.</p>
      <p>Every year back then, Communication Arts advertising awards annual was ﬁlled with their print ads (it was a swan song era for type-house-set print advertising) with massive, tightly set headlines like the ones shown here: <a href="http://www.adcglobal.org/archive/hof/2006/?id=301" title="http://www.adcglobal.org/archive/hof/2006/?id=301">http://www.adcglobal.org/archive/hof/2006/?id=301</a></p>
      <p>You see, it wasn't just about the fonts, but about the way they were set, by people who spent all day just nuancing headline settings.</p>
