    html: |-
      <p>You could make it a contextual ligature. Have a class consisting of all the glyphs in the font, and have it appear when nothing in the class proceeds the two glyphs in question.</p>
      <p>Note that this could then get triggered by anything else that breaks the context, such as a change of font. Even a change within the same family (bold or italic, for instance) would do it....</p>
      <p>T</p>
