    <p>Hi,<br>
    I want to create a ligature which only appears after a space (replacing the characters AND the space) so it's not contextual and easy to make.<br>
    But I also want it to appear at the beginning of the line or after a Tab (no space). How do I go about this?<br>
    Thanks</p>
