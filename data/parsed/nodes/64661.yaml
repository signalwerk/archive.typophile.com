      <p>The early 20th century brought a flurry of "isms" and "ists' to being. It was a time when mechanization, electricity, automation, and motor vehicles changed life dramatically. There never was a period where there was so drastic a change so quickly come about.  The arts replied with various attempts at trying to either follow or lead the transformation of an agrarian society that had done everything by hand to the world of mass production, consumerism, and much more leisure time.<br>
      It was an exciting time and a confusing time. People interpreted it in various ways, one being Futurism. The concepts of time and motion were rethought and given some attempt at form. Remember that this time period also gave birth to the Theory of Relativity, Quantum theory, two world wars with the Great Depression sandwiched between and ultimately, nuclear weapons.</p>
      <p>ChrisL</p>
