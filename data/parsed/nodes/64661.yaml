      <p>"Start with Benito Mussolini’s Wikipedia entry."</p>
      <p>"i know they were all fascists"</p>
      <p>Painting every futurist as Mussolini's servant is too simplicistic; Italy's cultural history is much more complex. For example, one of the most famous futurist book, a "latta" by F T Marinetti published in the 30's, was designed by Bruno Munari, one of the greatest XX century designer, a man whose democratic feelings can't be denied by anyone. The same can be said of many of the greatest designers belonging of the "futurist" era - the 20's and 30's decades - like Bertieri, Frassinelli, Mardersteig, Butti, Tallone, whose work cannot be related, in any way, to a totalitarian attitude. (As a sidenote, I guess that Futurism was much more an aesthetic than a political movement, but this is another matter; not that they hadn't political issues, anyway).</p>
      <p>Regarding futurist typography, in a sense, Marinetti's aim was to create a visual complement to the "new century" milieu - something that could express the dizzy flush of trains, cities, machines, metal, industry, and so on. Most of all, it was a reaction against the old world of late XIX century bourgeoisie. Graphically, it was an experimental (and perhapes necessary) approach which, after the first enthusiastic times, soon lead to a more clean and traditional typography, towards the end of the '30's. I'm no expert in the matter, but it's difficult to find "typographic principles" in futurism, in a traditional sense; it was much more a matter of "us against them". Somehow, their approach (not different from other early century avant garde movements) resembles what happened in graphic design in the 80's with people like Neville Brody, David Carson, Rudy VanderLans.</p>
      <p>It was also a great time for typefaces - besides more traditional stuff, in 1930 Italian typography spawned its response to Futura, Nebiolo's foundry "Semplicita":</p>
      <p><a href="http://www.flickr.com/photos/fountaineer/278176955/in/set-72157594342848887/" title="http://www.flickr.com/photos/fountaineer/278176955/in/set-72157594342848887/">http://www.flickr.com/photos/fountaineer/278176955/in/set-72157594342848...</a></p>
    html_clean: |-
