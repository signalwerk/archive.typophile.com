      <p>"Although in the early years of Italian Fascism, modern art was tolerated and even embraced, towards the end of the 1930s, right-wing Fascists introduced the concept of "degenerate art" from Germany to Italy and condemned Futurism. In 1938, hearing that Adolf Hitler wanted to include Futurism in a traveling exhibition of “degenerate art”, Marinetti persuaded Mussolini to refuse to let it enter Italy. In the same year he protested publicly against anti-Semitism, which was being copied from Germany by the Italian Fascists."</p>
