      <p>Futurism and Dada, may have in common the debt to messy magazine advertisments, but we musn't forget that although not all italian futurists were fascists, the sympathies of many lay with them, this does not invalidate the quality of the work and although Dada an Futurism shared certain aesthetics Dada was often absolutely critical and Futurism (at least in being instrumental to the creation of a fascist aesthetic modern an traditional at the same time was in that sense totally different). Let us not forget Russian Futurism, little did Mayakovsky, Malevich, Goncharova or El Lissitsky to name just a few to do with Marinetti, or Balla who allthough they shared with the Russians a love of modernity, machinery an dynamism weren't a bunch of italian neo-pagan counts who loved dressing sharp, driving fast Bugattis, betaing up anarchists and communists, instead considering themselves revolutionaries interested in world revolution and an international revolutionary art (a term open to interpretation in those days here are two points from the futurist manifesto which may make you look deeper into your "interest for futurism" which seems merely aesthetic. Heres a few pearls from their manifesto:</p>
      <p>9. We want to glorify war — the only cure for the world — militarism, patriotism, the destructive gesture of the anarchists, the beautiful ideas which kill, and contempt for woman.<br>
      !0. We want to demolish museums and libraries, fight morality, feminism and all opportunist and utilitarian cowardice.</p>
      <p>Here you can read more.. <a href="http://vserver1.cscs.lsa.umich.edu/~crshalizi/T4PM/futurist-manifesto.html" title="http://vserver1.cscs.lsa.umich.edu/~crshalizi/T4PM/futurist-manifesto.html">http://vserver1.cscs.lsa.umich.edu/~crshalizi/T4PM/futurist-manifesto.html</a></p>
      <p>Fregio Mecano is a great typography, I have not seen it used in fascist propaganda some is incredibly avant garde even by todays (poor standards) miles away from the "ancienne regime" style of other totalitarianisms including Stalin, miles ahead, and there's the sublime Bruno Munari...  as in Spain where I'm writing from in the thirties the graphic arts were instrumental to political communication and many designers and typographers took sides. If you are still interested in Futurism there is a great book in Italian "L'arte de la Publicittà Il manifesto italiano e la avaguardie 1920-1940"....</p>
