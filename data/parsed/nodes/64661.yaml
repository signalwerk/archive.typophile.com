      <p>Joe,<br>
      There were no Futurist typefaces that I know of. Most of the movements of the time did not generate an actual typeface. Making typefaces in those years involved time, money, technical knowledge and therefore a connection to an established foundry. Young avante garde arty folks rarely could put that combination together then.  Even the Constructivists did mostly hand lettering or linocuts. Bayer's work waited years before someone else made type of it.  Renner spent years at it and required working with a foundry to finish the real work. The Futurists never made the cut though.</p>
      <p>ChrisL</p>
    html_clean: |-
