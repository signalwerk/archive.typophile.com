    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MONOGRAM_DIE_6458.PLATE_sm.gif"></div><p></p>
    <p>Posted earlier this week, a new monogram story <a href="http://www.feltandwire.com/2011/01/25/monograms-a-la-modern/" title="http://www.feltandwire.com/2011/01/25/monograms-a-la-modern/">http://www.feltandwire.com/2011/01/25/monograms-a-la-modern/</a> including our copper photo-engraved plates, hand cut, 1/2" steel dies and sets of engraved monogram notes.</p>
    <p><a href="http://feltandwireshop.com/products/engraved-monogrammed-notes" title="http://feltandwireshop.com/products/engraved-monogrammed-notes">http://feltandwireshop.com/products/engraved-monogrammed-notes</a></p>
    <p>Our copper-engraved monograms are created in Illustrator based on a rudimentary gridded template that had been converted by an engraver from the original pantograph Masterplate system that goes back to the 1930s.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Monograms_masterplate_templates_3828.gif"></div><p></p>
    <p>Notice that some of the monogram styles pictured in the (fuzzy—sorry, hand held iPhone) photo above are the very styles in the letterpress types at the beginning of the article.</p>
    <p>At the beginning of the 20th century, ATF aggressively marketed engraved lettering styles to a new and potentially lucrative market: social stationery, which they had never marketed to before. So many of the social type styles we see today were originally engraved.</p>
