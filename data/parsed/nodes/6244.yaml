    html: "<p>Speaking of books and fires: there <i>was</i> a fire in our office building last year. It was a small fire, limited to one office, three floors below us, and thankfully it didn't set of the sprinklers on our floor. It did set off the sprinkers on some floors, though, and while the fire itself destroyed very little, the sprinkers caused a huge amount of damage. Now I'm really paranoid, and my bookcases are covered in giant, heavy-duty plastic drop sheets. It looks really weird, like our office is part of a Christo wrapping project, but I sleep easier.</p>"
