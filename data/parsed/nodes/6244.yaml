    html: "<p>Hard question. Five is definitely too few. I'd  <br>try to keep my copy of Spencer's <i>Pioneers</i>, if only  <br>because it's printed letterpress, as it should be;  <br>Aicher's <i>typographie</i>, because it's big and crisply  <br>white (no one is looking, so I'll try to sneak Karl  <br>Gerstner's thin <i>kalte Kunst?</i> and Eugen Gomringer's  <br>thin <i>max bill</i> under Aicher's dust jacket (as they  <br>relate only indirectly to typography, that's not too  <br>much cheating); Schmid's brave <i>Typography Today</i>, <br>for its Japanese-Swiss concision; Wim Crouwel's <br><i>Mode en Module</i>, not least because he's signed it; <br>Robin Kinross's <i>Modern Typography</i>, for it seems <br>that the new edition will be long in coming. (But <br>the opposite question would be interesting too: <br>what books one would gladly leave behind... ;)</p>"
