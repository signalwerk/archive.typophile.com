    html: <p>I'd probably be burned to death standing in front of the bookcase trying to make up my mind. Here are five likely contenters. The first is not specifically a 'type book', but they are all among the most difficult to replace, and hence treasured, items in the Tiro library. None of these are on Amazon, Tiffany, but you could try a title search on <a href="http://www.abe.com/">ABE</a>. <br> <br>Wilkins, Charles. <i>A grammar of the Sanskrita language.</i> London, Printed for the author by W. Bulmer and Co. 1808. <br> <br>Enschede, Charles (with additions by Harry Carter). <i>Typefoundries in the Netherlands, from the 15th to the 19th century.</i> Haarlem. Stichting Museum Enschede. 1978. <br> <br>Tetterode non-Latin catalogue. (I don't have it with me at the moment, so I'm not sure of the exact title or date. Early 20th century.) <br> <br>H. Berthold AG. <i>Schriftgiessereien und Messinglinien-Fabriken Aktien- <br>Gesellschaft.</i> Berlin, 1924. (The types shown in this important Hebrew specimen are all available in other texts, and in digital format, but so few copies of this book seem to have survived, I'd feel obliged to try to rescue it.) <br> <br>Scholderer, Victor. <i>Greek Printing Types 1465-1927.</i> London. Trustees of the British Museum. 1927. (One of 650 copies of the original edition, with collotype facsimiles that put all modern printing technologies to shame.)</p>
