    date: 2003-01-26T20:18:00
    date_raw: 26 Jan 2003 — 8:18pm
    votes: null
    html: "<p>I would add two items: <br> <br>TypeWise -- by Kit Hinrichs. Was published around 1992, no longer in print, but it's got great examples of his design projects for Pentagram. His style is so clean and functional without looking too much like Swiss Modernism. His work is pretty identifiable but never seems to get dated... unlike a lot of stuff from just a few years ago. <br> <br>And just for fun: <br>Bushisms --  Volumes One and Two. Quotes from W. -- no one could make this stuff up. Did you know that American newspapers regularly \"clean up\" his quotes for publication so they're understandable? And in the process make him look less like a boob? Kind of an interesting ethical issue, disorting news items for the sake of readability. <br>Anyway, these books have the unedited gibberish that are a hoot.</p>"
