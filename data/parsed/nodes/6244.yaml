    html: <p>hi Hrant, <br> <br>Letters is a wonderful book, it consists of several (rather practical) articles (mostly in Dutch, some in English) on type, typedesign &amp; typography. Not all articles are new, some already appeared in other books or magazines. <br>Writers include Robin Kinross (an interview with Gerrit Noordzij), Jan Middendorp, Gerard Unger, Harry Sierman, Martin Majoor, Lucas De Groot, Fred Smeijers... It is published by <a href="http://www.zooproducties.nl/prod21.html">[Z]oo/Vd</a>, is set in TEFF Renard, and is part of a series on graphic design. It can be bought online at <a href="http://www.nijhoflee.nl/design/typography/">Nijhof and Lee</a> I suppose (more shopping info also on the <a href="http://www.zooproducties.nl">zoo site</a>)... Nijhof and Lee also have an english description of the book. <br> <br>lettertiep</p>
