    html: "<p>Along with the many of the usuals above I'd add: <br><a href=\"http://www.amazon.com/exec/obidos/ASIN/392725889X/qid%3D1029091122/sr%3D1-13/ref%3Dsr%5F1%5F13/103-5952024-5234223\">20th Century Type Remix</a> by Lewis Blackwell. A <br>great breakdown of more recent history (well, <br>20th century). <br> <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0811823083/qid=1043185231/br=1-15/ref=br_lf_b_15//103-5952024-5234223?v=glance&amp;s=books&amp;n=1875\">Typology: Type Design from the Victorian Era</a>  <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0811823083/qid=1043185231/br=1-15/ref=br_lf_b_15//103-5952024-5234223?v=glance&amp;s=books&amp;n=1875\">to the Digital Age</a> by Steven Heller and Louise <br>Fili is also good, but the dense format is crammed  <br>nd therefore is less useful. <br> <br>Can't forget <a href=\"http://www.fontshop.com/virtual/index.cfm?area=SF_products&amp;subarea=SF_products_fontbook\">The FontBook</a> from FontShop. <br></p>"
