      <p><cite>&gt; Note: it also has the error 407 and 907</cite></p>
      <p>Here is a long list of error codes from Sprint users: <a href="http://www.sprintusers.com/forum/showthread.php?t=51042" title="http://www.sprintusers.com/forum/showthread.php?t=51042">http://www.sprintusers.com/forum/showthread.php?t=51042</a></p>
      <p>They write: &nbsp;&nbsp;<cite>407 HTTP error 407: The request from your browser cannot be satisfied by the server. HTTP Error 407. Indicates that the client must first authenticate itself with the proxy to complete the process. </cite>&nbsp;&nbsp; As for 907, it would follow from a bunch of previous errors.</p>
