    html: "<p>Right, I'll try to put an end once and for all on this matter.  <br> <br>No, you may be sure I am not trying to turn it into a personal matter. I just misinterpreted you.  <br> <br>You say you don't beleive me when I said that I didn't know it was illegal. I won't say I am offended because you doubt my word, because you don't know me. But believe me: when I say something it is in earnest.  <br> <br>Why 'potentially stirring' then? Because in my original post I asked for what I thought was a discontinued font (which I thought was legal and was shown otherwise) but I said that the objective was to MODIFY that font for private use. That was the stirring bit, because when I asked how to link a discontinued font family many people said it was probably illegal to do so. So *that* was the stirring bit.  <br> <br>Finally. The law must be followed so that society does not collapse; but who makes the laws? Mostly people who are in power, lobbies and so forth. So there is every probability that some laws are not fair. When such a thing happens I reserve my right not to follow that law if in doing so I contribute to something worthy. Am I right? I believe so; am I acting outside the law? Yes; if I am caught in the act I will accept punishment. That is the only way it works: even if one does not agree with the law and feel contrived to act against it, one must be ready to suffer the consequences, because the law, even if unfair, is the only way to keep a society going.  <br> <br>This is, I think, very clear. <br> <br>Mr Reynolds et al.: Too absurd to comment, sorry. <br> <br>My interest in typography is strictly a hobby. I work for no one but the State.  <br> <br>I don't quite remember who said that I bumped the thread in order to cause a fight. But whoever said that was wrong. I just felt insulted by the concerted barrage of silence on what seemed to be an interesting topic before. So I responded calling your game. That is all. *I* have no hidden agendas.  <br> <br>&gt;We're grown-ups here. Why must we act like politicians?&lt; <br> <br>Indeed. Why is everybody so offensive and distrustful? <br> <br>As I said before, I won't mention the original question again: I mean, I wont doubt your word that it is illegal to ask for a discontinued fount. I won't reveal any of my sources.  <br> <br>And, from now on, I will ignore any insulting post. If you want a fight, you make it.  <br> <br>Rodrigo de S</p>"
