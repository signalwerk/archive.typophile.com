    html: "<p>Rodrigo,  <br> <br>I didn't feel hurt by any of your remarks. Please don't try to imply that there is something personal in my reaction -- there isn't. It doesn't matter that I ever worked for Linotype, or whatever. I never worked for Berthold or Monotype or Font Bureau or Hoefler etc., but I still wouldn't watch happily if someone calls for making illegal copies of their fonts, even those that are retired or renamed now.  <br> <br>I still cannot understand how making illegal copies of existing fonts coincides with ethics. Your own subject line was \"Potentially stirring post: Akzidenz Grotesk\". I cannot buy your story that you \"didn't know it was illegal\" -- if you really never knew, what was \"potentially stirring\" about your post?  <br> <br>Out-of-print books don't automatically become public domain. If outdated software isn't anymore on sale (e.g. Windows 98 or Photoshop 5 or QuarkXpress 4), it doesn't mean that you can copy it for free, does it? I don't understand why it should be different with fonts.  <br> <br>If you think pirating QuarkXPress 4.1 \"for a just cause\" is OK because the software isn't being sold anymore, I'd really like to hear about the foundations of this understanding of ethics that you have.  <br> <br>Regards, <br>Adam</p>"
