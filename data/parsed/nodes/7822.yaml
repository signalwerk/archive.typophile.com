    html: "<p>Rodrigo, <br> <br>you write: \"Since Mr. Adam Twardoch and Mr. Dan Reynolds are working for Linotype and since Mr. Thomas Phinney is employed by Adobe, it is understandable, that they do not want that fonts of these companies are examined by criminal courts. \" <br> <br>I have never read anything more absurd. I think you have twisted what I and other have written beyond any tolerance.  <br> <br>I don't really care whether some fonts are investigated by some lawyers. However, I find it scandalous that a private person posts requests for illegal copies of a computer font, and explains that he doesn't care for law, and all this, as he claims, to help in some LEGAL CASE.  <br> <br>If any state authority of any country needs to obtain archival copyrighted data, that authority should make a proper official contact with the companies involved. The prosecutors should contact both Berthold Types Limited and Linotype Library, requesting for an archival copy of the files in question, rather than asking a friend who would ask a friend who would ask some people on Typophile for a pirated copy.  <br> <br>You can follow whatever you want, but I hope at least the prosecutors you mention will follow the law. Or at least the common sense.  <br> <br>I wish these prosecutors had better advisors when it comes to fonts. Otherwise, who knows what will come out of these \"examinations\".  <br> <br>Regards,  <br>Adam Twardoch <br>  not speaking on behalf  <br>  of anybody except himself</p>"
