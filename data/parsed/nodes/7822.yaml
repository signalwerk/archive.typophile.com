    html: "<p>Adam: <br> <br>As I said, I won't take this matter up again. But even if I understand that you may feel hurt by my answer (which was not my intention) please do not distort what I said.  <br> <br>I never tried to illegally get Akzidenz-Grotesk in order to help in a legal case. I tried to get what I though was a discontinued and therefore legally possible to give, or lown, fount.  <br> <br>I took very long to answer *after* I knew what was at stake. I finally decided to reply because very offending intentions were attributed to me, and I can't allow that.  <br> <br>And yes, I will follow my conscience and not the law if law does not coincide with ethics. <br> <br>If you want to discuss ethics, I will reply.   <br> <br>Regards, <br> <br>Rodrigo de S</p>"
