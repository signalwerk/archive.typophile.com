    <p>My deck is about to split and I've decided I'm going to be painting my replacement. I've been playing around with some ideas for the last half hour. I think I'm going to go with a tribute to one of my favorite albums - Iggy Pop's "Raw Power". </p>
    <p>I was wondering if I could get some feedback / suggestions for a typeface for the words "raw power".</p>
    <p>It's funny how you can think something looks great, make some revisions, look at what you started with, think it looks like crap. I did this tonight starting with Bauhaus.</p>
