    html: |-
      <p>Stephen,</p>
      <p>Thanks for your input.</p>
      <p>The font is intended mainly for use in headlines and on posters. I agree that the F looks too stiff right now. I may keep the I perfectly straight though, as the straight vertical lines provide an unwavering, authoritative quality to the design (I am inspired by fonts like Impact and Neutraface).</p>
      <p>I am thinking that perhaps I should ditch the perfectly straight horizontal upper-arms on the E,F,T, and Z and replace them with something a bit more lively and maybe include the perfectly straight versions as alternate characters.</p>
      <p>Another concern of mine is that the L,O and T lack the thick/thin contrast that is so prominent in the Q,A,G,Y etc.</p>
      <p>In regard to how wild I would like to go:</p>
      <p>Ideally all of the letters will be no wilder than the Y or G and no tamer than the H</p>
