  html: |-
    <p>Hi,</p>
    <p>I am creating this face with the goal of combining gestural graffiti-curves with no-nonsense geometric forms, effortless readablity at large sizes, and in-your-face poster thickness.</p>
    <p>I am working on a lightweight version of the face to contrast with this fat weight, but it is in a very rough stage as of yet.</p>
    <p>Criticism will be greatly appreciated!</p>
    <p>Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/buster1_6453.gif"></div><p></p>
