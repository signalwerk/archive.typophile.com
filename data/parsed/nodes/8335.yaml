  html: |-
    <p>I'm looking for a list of fonts (mainly from 60's to the 70's) created by VGC (<a href="/wiki/Visual%20Graphics%20Corporation" class="freelinking" rel="nofollow">Visual Graphics Corporation</a>, makers of the Typositor)</p>
    <p>Include only fonts created by VGC. DO NOT include those marketed by VGC, but originated by other foundries (such as ITC or ATF). (Unless, it is a special version--such as shaded--peculiar to VGC.)</p>
    <p>(VGC's most famous font, I'd say, has to be the original 1965 version of Friz Quadrata.)</p>
    <p>If possible, I'd also like to know the designer and/or year of release.</p>
  html_clean: |-
