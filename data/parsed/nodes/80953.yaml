    html: |-
      <p><em>… it is a modular unicase typeface … </em></p>
      <p>Modular and unicase are the wrong words.<br>
      Linotype faces were modular, for instance, but not monowidth/monospace/tabular, which would be more correct.<br>
      And some glyphs (t and i) aren't in fact monowidth.<br>
      Nor is a typeface with both upper and lower case a unicase.</p>
      <p>The inventor of the monowidth + unicase system of type design named it the "panoptic alphabet", after its first demonstration in the Panoptica typeface. So you could say that upper and lower case may be combined for a panoptic effect.</p>
      <p>Is this an OpenType feature in your typeface?</p>
      <p>***</p>
      <p>BTW, I'm getting a kind of 1995 rave flashback, as well as the Porsche thang :-)</p>
