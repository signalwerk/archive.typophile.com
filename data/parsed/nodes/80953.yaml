  html: |-
    <p>When merely "extended" just would not do, here is Paragraph Stretch™: a super extended or elongated geometric display typeface. It is a modular unicase typeface: the capitals and lower case fit the same height and width, so they are interchangeable: fancy a round "W" in all caps? Use the lower case. Want a straight "x" in lower case? Use the cap. And so on. Designed for use at larger sizes for logotypes, short titles or headings. It supports Western plus Nordic, Eastern European and Turkish languages.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/parastretch-release_6464.png"></div><p></p>
    <p>Available from <a href="http://new.myfonts.com/fonts/paragraph/stretch/" rel="nofollow">MyFonts</a>.</p>
