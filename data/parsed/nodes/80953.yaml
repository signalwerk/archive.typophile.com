    votes: null
    html: |-
      <p>You could, if you qualified it like that.<br>
      But Jan said, "It is a modular unicase typeface: the capitals and lower case fit the same height and width."<br>
      I criticized that for being incorrect.<br>
      To repeat: that is what we typographers call monowidth, monospace or tabular, not modular.<br>
      Also, several characters in the lower case are not monowidth.</p>
      <p>Although James Mosley refers to "modular" units of sub-character width, the generally-used term appears to be "unitized":<br>
      <a href="http://www.typophile.com/node/37601" title="http://www.typophile.com/node/37601">http://www.typophile.com/node/37601</a></p>
      <p><a href="http://www.devicefonts.co.uk/cgi-bin/device3.cgi?action=fonts&amp;section=family&amp;font=Automoto%20Pro&amp;custom=0&amp;text=&amp;currency=1&amp;vatinc=No%20VAT" rel="nofollow">This</a> is a pointedly modular face, so I don't think that something like Paragraph Stretch, which has basically a simple geometric structure, really qualifies as being particular modular, because then you might just as well say that all geometric faces are modular, which is redundant.</p>
