    votes: null
    html: |-
      <p>Jan, "modular" does not mean monowidth/monospace/tabular. The old Linotype system had a width module of which all character widths were a multiple. Some digital fonts are constructed similarly, to improve hinting. Pixel fonts are also modular, though rarely monowidth.</p>
      <p>I would say that this typeface accommodates a "unicase effect", because there is no unicase font and it is not a unicase typeface, but the effect is genuine.</p>
      <p>Monowidth is another issue, because the "t" and "i" at least are not monowidth.</p>
      <p>I think you should cut to the chase and make the "unicase effect" and "monowidth effect" OpenType features, so that users can dial them up with either a Stylistic Set, or perhaps in the Titling feature (more easily accessible). Or you could do it as a separate font, perhaps a free incentive.</p>
      <p>AFAIK, no layout apps support the "unic" feature, but I have dutifully include it in several fonts, in anticipation.</p>
