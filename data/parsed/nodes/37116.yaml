    <p>Hello everyone,</p>
    <p>I searched through the Typophile and found the “Luxury” font collection by OrangeItalic. I think they are pretty close to what I’m looking for. What other fonts do you think exemplify “luxe.” </p>
    <p>(And by “luxe,” I refer to middle-aged/golfer/CEO-with-a-private-jet kind of luxe. Like Trump but with more class.)</p>
    <p>Any suggestions are truly appreciated!</p>
