      <p>Your “eff up” doesn’t make sense.<br>
      If you feel that ALEGRE is too dense in comparison to PORTO, perhaps take the serif off “G” and shorten its right stem a bit? You might also try moving the leg of “R” (or the whole right side) a little to the right, if the tight counter is an issue.</p>
