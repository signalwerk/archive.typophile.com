    <p>I'm about to buy the Plume Advertising font from Dalton Maag for a project. It is just a slab serif as voluptuous and playful as I need, but I'm with a little doubt. </p>
    <p>Considering the specific composition of words below, what do you people think is the best version of "R"? The upper version is the original one, and below is the one I effed up with.</p>
    <p>I just can't come to a conclusion on which version better balances the quirky details and the color (disconsidering the shitty kerning used here). Isn't "ALEGRE" looking to much excentric in comparison to "PORTO" in my version?</p>
    <p>Hope you can help me! :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ecb2f65de761c71aee101238bd7070b_6234.jpg"></div><p></p>
