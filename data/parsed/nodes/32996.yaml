      <p><a href="http://www.myfonts.com/fonts/galapagos/beatnik/" rel="nofollow">Beatnik</a>, if you added the swirls, would be close because of the bouncy baseline, but I think it's closer to <a href="http://www.myfonts.com/fonts/redrooster/bodoni-rr-campanile/" rel="nofollow">Bodoni Poster</a>. I linked to the Red Rooster version, but there's one from pretty much any foundry that has done a Bodoni.</p>
      <p>I'm sure a revival of this style is coming very soon, and then you will be drowning in alternatives.</p>
      <p>Sean Glenn<br>
      Art Director<br>
      <a href="http://www.superunicorn.com" title="www.superunicorn.com">www.superunicorn.com</a></p>
