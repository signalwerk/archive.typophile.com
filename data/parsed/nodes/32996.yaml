    <p>Hi everyone. </p>
    <p>I'm trying to find the typeface used in this* great old gum wrapper for a friend.<br>
    My guess is that I won't find the specific type, with it's quirky spirals, but if you can point me toward the root font of this face I'd appreciate it. </p>
    <p>* <a href="http://www.victoryseeds.com/candystore/images/adams/blackjack_70s.JPG" title="http://www.victoryseeds.com/candystore/images/adams/blackjack_70s.JPG">http://www.victoryseeds.com/candystore/images/adams/blackjack_70s.JPG</a></p>
    <p>I'm looking for the main "Black Jack" face, not the sans serif, though that is a really nice one too.</p>
    <p>Thanks in advance for any help.</p>
    <p>-JB</p>
