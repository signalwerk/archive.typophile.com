    html: <p>Paul, what differences do you see that make you think it isn’t Gotham? Try the test driver at <a href="http://www.typography.com/catalog/gotham/testdriver/gotham_bold.html">H&amp;FJ</a>. (If it’s the apostrophe, well, designers have been known to substitute punctuation from other fonts. I’ve used apostrophes from Helvetica and Akzidenz Grotesk for that very purpose when the sans I was using had sterile, wedge-shaped quotes.)</p>
