    html: <p>I would handle the character to glyph name conversion with a simple macro, then replace spaces with tabs and paste the data into a spreadsheet, and convert the kerning values column with a multiplication function. Then paste the results back to the text editor and into an AFM file. <br> <br>In FontLab, it should be possible to use a Python script to batch generate AFM files for all fonts.</p>
