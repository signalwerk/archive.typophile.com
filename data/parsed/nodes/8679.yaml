    html: "<p>&gt; In FontLab, it should be possible to use  <br>&gt; a Python script to batch generate AFM  <br>&gt; files for all fonts. <br> <br>That's even easier. Tools / Transform Range; Transformation Range: Fonts in the Fonts List; ... / Destination format: Type 1 (PFB); + / (Add the fonts); Choose directory / (Select output folder).  <br> <br>You will get a bunch of PC Type 1 fonts that all include AFM files.  <br> <br>Regards,  <br>Adam</p>"
