  html: |-
    <p>Computer fonts have one glyph per symbol. This is too static for organic/informal type faces. In some situations, repeating symbols in an organic font should not look exactly the same but slightly different. Are there type faces with multiple glyphs per symbol? Or with generative means to vary glyphs? What is the technical name for such type faces? Can you name examples?</p>
    <p>Thanks so much! --Tom</p>
  html_clean: |-
