    html: |-
      <p>BTW, one thing to consider is that -if it's true that "detailed<br>
      shape memory" doesn't survive across fixations- since we can<br>
      only see ~4 glyphs perfectly clearly at a time, we only need<br>
      around 4 different fixed instances of a character and laymen<br>
      won't notice. And that's what Kosmik does BTW.</p>
      <p>hhp</p>
