      <p>FF Kosmik (Flipper) — Random Font is the term devised by creators Van Blokland and Van Rossum for a font with multiple instances for each glyph.</p>
      <p>Example: <a href="http://www.letterror.com/foundry/kosmik/index.html" title="http://www.letterror.com/foundry/kosmik/index.html">http://www.letterror.com/foundry/kosmik/index.html</a></p>
      <p>Info: <a href="http://www.letterror.com/foundry/kosmik/technote.html" title="http://www.letterror.com/foundry/kosmik/technote.html">http://www.letterror.com/foundry/kosmik/technote.html</a></p>
