    html: <p>Hand drawn, possibly by Hans Tisdall. Michael Harvey's <a class="freelinking external" href="http://new.myfonts.com/fonts/finefonts/tisdall-script/" rel="nofollow">Tisdall Script</a> is based on his book-jacket lettering from this era. Also, Harvey's <a class="freelinking external" href="http://new.myfonts.com/fonts/finefonts/aesop/" rel="nofollow">Aesop</a> has a similar feel.</p>
