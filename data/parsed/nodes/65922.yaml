  html: |-
    <p>I was in love with this "flower-countered" display font as a kid, never saw it anywhere else than <a href="http://www.flickr.com/photos/ninastoessinger/4093664660/" rel="nofollow">these pouches</a>, and kinda never expected this to exist as a [digital] font.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/sachet_6401.jpg"></div><br>
    Now I've spotted something that looks like it's at least trying to do a similar thing, in <a href="http://www.youtube.com/watch?v=ezyRovNSaHs" rel="nofollow">this Youtube video</a>. It's not quite the same (and not as nice I think – it loses some of the Clockwork-Orange-meets-Flower-Power charme of the above) but I'm still curious. (I wish I could read what it says in the font menu there.)<br>
    <div class="imageWrap"><img src="http://typophile.com/files/sachet2_6131.jpg"></div><br>
    So, can anyone name either of these, and/or point me towards fonts that match this overall concept?<p></p>
