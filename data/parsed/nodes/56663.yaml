    date_raw: 6 Apr 2009 — 9:27am
    votes: null
    html: <p>Well to my experience, optical kerning works wonderfully with Adobe 'originals' (e.g. Arno Pro, Chaparral, Adobe Garamond Premier, etc.). With other typefaces it depends. Sometimes you get satisfactory results, while with some others you'll have the kerning going absolutely bananas. I have to confess that I mostly use metrics kerning, and trust the type designer's judgement more than the application's algorithms.</p>
