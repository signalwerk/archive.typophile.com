    html: |-
      <p><cite>so Optical is how the font looks like without any feature in fontlab</cite><br>
      No, optical kerning is kerned how the optical kerning algorithm thinks it should be kerned. But it doesn’t kern well enough to not require manual intervention, which sort of negates the point of using it. And it can be a disaster at text sizes.</p>
