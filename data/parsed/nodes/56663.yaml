      <p>this is my opinion only:</p>
      <p>Metric: if you respect the typeface designers ability to get it right which mostly I do when I get a typeface from a respectable foundry... if however it is some what of a 'type designer in training' then a bit of manual kerning is required especially on headlines.</p>
      <p>Optical: for numeral (numbers) as on some typefaces seem to be a little out... Trade Gothic is a classic for the numerals being a little whack in my opinion.</p>
