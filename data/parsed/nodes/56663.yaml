    <p>Guys, this is a very quick question I have (I'm a total noob as you will see) What is the corresponding meaning of Optical and Metrics that appear in apps like Illustrator or InDesign equivalent of FontLab? My problem is cos my font have manual kerning and when testing at any of this Adobe apps I see that when I set my font as Metric is looks good (kerned) but when I set it to Optical, some ghlyps overlap each other... :(</p>
    <p>Thanks for the help!!!</p>
  html_clean: |-
