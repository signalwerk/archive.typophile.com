    date_raw: 7 Apr 2009 — 9:08am
    votes: null
    html: <p>I don't think Optical spacing will produce overlaps by itself, if anything, it wants to make sure letters never touch at all (like serifs between r and w), even where this would in some cases be desirable for better spacing.</p>
