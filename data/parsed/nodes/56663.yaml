    html: |-
      <p>In general, i prefer optical (= Indesigns interpretation) to metrics, if the font I use is badly spaced/kerned. With "good" fonts, I usually trust the type designer (metrics setting).</p>
      <p>And I like the optical setting for adjusting numbers of font that have only tabular figures. Optical always looks better then than metrics if used in text environment instead of tables.</p>
      <p>mikej: to turn off kerning completely (neither indesigs interpretation nor font designers kerning) you have to enter a 0 (zero) to the field. Then you get plain metrics without kerning.</p>
    html_clean: |-
