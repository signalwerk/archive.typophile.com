    html: |-
      <p>Correcting the alignment issues you're seeing does not require<br>
      extensive superhinting of individual glyphs; as was mentioned<br>
      it's a much simpler issue with vertical zones.</p>
      <p>BTW for older (read: Win-XP) systems in b&amp;w you could use<br>
      the GASP table to make all sizes render anti-aliased, resulting in<br>
      blurry but passable rendering (essentially equivalent to OSX).<br>
      However some of your thin parts might need to be thickened.</p>
      <p>hhp</p>
