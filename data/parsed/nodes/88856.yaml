    <p>I made a Times New Roman clone. It's derived from FreeSerif and Liberation Serif and I used Fontlab Studio 5 to produce it, but I'm not a typographer by training (we don't have the funds to hire one at the moment).</p>
    <p>The font looks fine in print, and it's ok on screen when the font size or screen magnification is sufficient, but if I choose a small font size or change the magnification in Word 2010 to make it look small on screen, then the letters appear uneven.</p>
    <p>I attached several PNG screenshots from Word to illustrate the problem. The first is with 100% magnification, the second with 150% magnification. If you look closely at the 12 pt sample in the first pic, you'll notice how certain letters of My Serif (temp name) appear shorter than others, for example, u i r w x ... The pics also include the same text in Times New Roman for comparison of how My Serif should look.</p>
    <p>At 24 pt size or at 150% magnification the characters appear level though, and their outlines are even in height in FontLab Studio, so is there something I could do to fix this appearance issue?</p>
    <p>Thanks in advance.</p>
