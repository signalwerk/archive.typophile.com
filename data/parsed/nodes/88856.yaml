    html: <p>Unfortunately this is on Windows and the sources look fine (so not an inheritance issue). I take it I need to hint each character, which is something I'll be learning as I do it. Is there a quick way to do it, or is this something that has to be done one character at a time? fwiw, I applied FontLab's Autohinting (F7) to the whole font, but it didn't fix the problem.</p>
