    html: |-
      <p>Manual TrueType hinting is done one character at a time. Note that there’s a difference between TrueType hinting and Postscript Hinting. Fontlab’s PS autohinting isn’t half bad, the other one have a tendency to bloat the file size without much better rendering results.</p>
      <p>Truetype hinting gets more complicated the older the systems you want to support are, and for text sizes Truetype is still unfortunately the only format that “works” on screen in Windows.</p>
