    <p>I recently read the article on ILT.com  about conceptual type(<a href="http://ilovetypography.com/2012/09/25/beauty-and-ugliness-in-type-font-design/" title="http://ilovetypography.com/2012/09/25/beauty-and-ugliness-in-type-font-design/">http://ilovetypography.com/2012/09/25/beauty-and-ugliness-in-type-font-d...</a>) and in that article, the author talks about books written by Bodoni and others. Since these books have been written some centuries ago, it is safe to assume that they are out of copyright. I was wondering if i can access these books anywhere online. Not only books by Bodoni but by other typographers also. Can any one point me to these books.<br>
    Thanks<br>
    Typogruffer</p>
