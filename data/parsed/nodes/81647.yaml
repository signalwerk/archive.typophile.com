    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tdc_fb_5042.logos_sm.jpg"></div><p></p>
    <p>The Type Directors Club <a href="http://tdc.org/" title="http://tdc.org/">http://tdc.org/</a> is proud to announce, from June 6th to June 10th, the Type Masters Week in New York City. By celebrating 65 years of typographic excellence, the Type Directors Club will be offering the unique opportunity for you to participate in one day workshops with the Masters; Erik Spiekermann, Cyrus Highsmith, Ale Paul, and Luc(as) de Groot.</p>
    <p>Four One Day Workshops, 8:30am – 4:00pm<br>
    The following workshops will take place at Type Directors Club, 347 West 36th Street, Suite 603, New York, NY 10018.</p>
    <p>What makes a good typeface?<br>
    Erik Spiekermann, Tues. June 7<br>
    <a href="http://tdc.org/tdc/archives/3492" title="http://tdc.org/tdc/archives/3492">http://tdc.org/tdc/archives/3492</a></p>
    <p>Thinking in Contours<br>
    Cyrus Highsmith, Wed. June 8<br>
    <a href="http://tdc.org/tdc/archives/3487" title="http://tdc.org/tdc/archives/3487">http://tdc.org/tdc/archives/3487</a></p>
    <p>Lettering for the masses<br>
    Ale Paul, Thurs. June 9<br>
    <a href="http://tdc.org/tdc/archives/3480" title="http://tdc.org/tdc/archives/3480">http://tdc.org/tdc/archives/3480</a></p>
    <p>Perceiving type — optical mathematics<br>
    Luc(as) de Groot, Fri. June 10<br>
    <a href="http://tdc.org/tdc/archives/3474" title="http://tdc.org/tdc/archives/3474">http://tdc.org/tdc/archives/3474</a></p>
    <p>IMPORTANT: Early Bird Registration Friday May 13th.</p>
    <p>Three Evening Lectures, 6:00pm - 7:30pm<br>
    The evening preceding each workshop the presenter will give a lecture at Cooper Union. Rose Auditorium, 41 Cooper Square, New York, NY 10003.</p>
    <p>One TDC Medal presentation. Monday evening June 6th Erik Spiekermann will be presented with only the 25th TDC Medal at Cooper Union. Rose Auditorium, 41 Cooper Square, New York, NY 10003.</p>
