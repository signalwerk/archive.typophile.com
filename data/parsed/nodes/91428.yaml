    <p>Hi. Does anyone know what sans the Whitney is using these days? It's not H&amp;FJ Whitney.</p>
    <p><a class="freelinking external" href="http://twitpic.com/91a2mu" rel="nofollow">http://twitpic.com/91a2mu</a></p>
    <p>Looks similar to Calibre, but the "a" is wrong.</p>
    <p>The restaurant uses Univers for its logo and menu, and the Biennial uses Bell Gothic for its labels, etc. (Not that that helps.)</p>
