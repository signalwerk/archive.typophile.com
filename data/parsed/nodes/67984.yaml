      <p>Thanks for your prompt replies. I did check it against Futura by Neufville Digital. Apparently they completely digitized the typeface from the original sources of the Bauersche Giesserei, now held by FT Bauer in Barcelona. I had my suspicions that it was Futura but it is slightly wider than the condensed version but not as wide as the regular. Is there an inbetween version?</p>
      <p>Thanks Again.</p>
      <p>Clint</p>
