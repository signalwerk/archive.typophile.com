    html: |-
      <p>I discovered the inspiration for this piece of lettering years ago in one of those "old engraving" swipe books:</p>
      <p><a href="http://www.marksimonson.com/menu-cut.gif">http://www.marksimonson.com/menu-cut.gif</a></p>
      <p>It's a standard cut (sort of like clip art) produced by the MacKellar, Smiths &amp; Jordan Foundry of Philadelphia in the 1800s.</p>
      <p>I've also got a copy of the original Harvest LP. The designer is listed (Tom Wilkes) but no specific credit for the lettering. Could be the designer did it. It's skillfully done, whoever did it. It's very faithful to the design of the MacKellar cut.</p>
    html_clean: |-
