    html: <p>The "Harvest" lettering has a similar mistake (or maybe it's intentional) with the thin vertical stroke on the "H". The original "Menu" cut, on the other hand, follows the rules for letter construction. I definitely think "Sheepdogs" would look better with proper stroke weights on the "S". 'Course, that probably means losing the dots in the middle (which could be why it was done wrong on the "Harvest" lettering).</p>
