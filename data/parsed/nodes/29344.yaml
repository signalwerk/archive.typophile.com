  html: |-
    <p>"if i'd get a penny everytime i search on myfonts…"</p>
    <p>i just discovered that there's a <a href="http://mycroft.mozdev.org/download.html?name=www.myfonts.com&amp;sherlock=yes&amp;opensearch=&amp;submitform=Search" target="_blank" rel="nofollow">plugin for firefox</a> that adds myfonts.com to the search-bar (upper right corner). </p>
    <p>with ctrl+k, you can access the search-bar, with ctrl+arrow up/down you can chose the one you want. use the plugin "search engine ordering" to be able to change the order of the site-searches and delete the ones you dont want (right-click on an entry, "delete")</p>
