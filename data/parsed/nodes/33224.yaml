      <p>Crossgrove, thanks for the very detailed comments.  You’ve noticed a couple of the things I had thought about and was wondering if others had noted....for instance, the wideness of the n, m, u, and h (which are also a bit more narrow, somewhat like the qpdb change I made).  The S I've completely redone. </p>
      <p>Unfortunately, back in my old design class days, I avoided the on-paper sketches, so I'm not accustomed at all to sketching by hand first; I'm a freak who has most of the time gotten away with sketching digitally, and it has definitely become a crutch.  </p>
      <p>I have access to Baskerville and Times, the latter of which I've been using for some of the changes (I noticed, for instance, that I had the stem of the r started in my original a lot higher than most fonts, and that the c and e are generally weighted on the bottom).  Lately now for each one I've been keeping a window open with each letter presented in all the serif fonts that I've got on my machine.  </p>
      <p>I'm about to go on a trip (God help me, Auburn to Orlando —&nbsp;9 hours — chaperoning a bus full of 13-, 14-, and 15-year-olds) and will probably work on it some, but won't be able to post anything until then. </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
