      <p>Wow, I realized I haven't posted an update in a while.  I've reworked quite a few letters, and set far better default spacing.  While I'm working on IPA and the other latin set, I decided to take a break to attempt the Cyrillic.  While I *think* it seems to flow well, it does seem to be a bit closely set, especially in light of the Latin.   Does it feel too close?  And do any of the stylistic choices just feel absolutely wrong?  The Latin version is admitingly simply an amalgam of the particular forms I prefer and made to go well together, but I just don't have the experience to say for sure with the Cyrillic.  Any comments/help/suggestion is greatly appreciated.</p>
