    html: <p>You've got a few mistaken characters. Most noticeably, you have a myagkij znak (ь) in place of the ve (в). The i kratkoe's (й) breve is too fine to be visible from a normal zoom. The capital El (Л) should have a thin left leg, like the lowercase el does. The tail on the sha and shcha (ш and щ) is an outmoded form and looks very out of place in such a modern design. The er (р) shouldn't look like a Greek rho (ρ--note, no stem), but like a regular p. My suggestion is to study a variety of contemporary Cyrillic alphabets and then come back with a fresh eye.</p>
