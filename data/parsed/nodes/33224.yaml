      <p>Total oversight on the в (started it and forgot to finish it), for the й I accidentally left the stroke direction in the opposite direction which renders lighter for some reason.</p>
      <p>My primary concern was with the щ and ц and .  I went with the older form to try to give a little bit more descending feel, but since it's out of place, at least the other form is a lot easier to do :)</p>
      <p>For some reason I had it in my head that the р rounded...I think it got stuck in my head from the thread discussing the ruble's design a while back and one or two people mentioned it being a more traditional form.</p>
