    html: |-
      <p>Don't be in a rush to move on to kerning and other scripts. There is more to do before you reach that stage. </p>
      <p>"get rid of some of the, as hrant put it, calligraphic feel to make it more sutible for body text."</p>
      <p>This isn't a useful way to conceptualize suitability for body text. They aren't opposites. There are other larger issues with your design which are more important than "calligraphic feel". One is contrast. The thins are very thin. That alone makes it unsuitable for body text.</p>
      <p>(You use "thin" and "wide" as though they were opposites. Because there are so many concepts and terms in type design, it's good to keep them clear. Narrow / wide, thin / thick, tight / loose.) </p>
      <p>Your serifs are already small. I don't think it adds anything to make the serifs sharp-tipped in addition to bracketed, especially if you intend this to be used small. </p>
      <p>More about stroke contrast: A specific ratio like 2 to 9 can be a starting point, but like almost any "rule" in type design, it will fall apart spectacularly and often. The main stems will probably all be around the same weight, and the rounds will all be something thicker, but you'll find KMNVWYXZ will look strange and heavy if the stems are exactly the same weight. The thin stems will range from very thin where the h arch joins the stem to moderately thick at the bottom of the left leg of A. </p>
      <p>There's something very mechanical about these letters. Did you draw them on paper first? I very strongly recommend you try a couple other techniques for digitizing them. These techniques will show you how different a shape or letter looks when you're trying to construct it in PostScript. Reducing and enlarging things also makes them look very different. Draw the letters you want with pencil, get them as clean and final as possible, then A: autotrace them, and also B: hand-digitize the shapes with the scanned drawing in the background. Compare the resulting shapes, in black-and-white, side-by-side. One other factor in the results will be how faithful you are to your drawing and how much you simplify or rationalize it. Type looks like it's made of ruler-straight bars and segments of circles, but even in the case of Futura that's an illusion. I should point out: Berling is one of the most mechanical and lifeless typefaces out there. Its proportions and spacing are fine, but Berling looks to me like a machine designed it. It works better at small sizes, ironically.</p>
      <p>I can see that you recycled the main cap stem. Recycling is smart. For some letters, though, there is an unfortunate artifact where the former serif joins the bowl, arm or other stem. The cups on the ends of the original stem abruptly switch to perfect straight lines of the adjoining part. It may seem calligraphic to some, but this is an area that looks better at any size when it's smoothed out somehow. Those little jags, kinks and spurs are more detrimental to reading flow than you might think. See BDEFLPR. For examples of how these joints can be addressed, see Adobe Garamond, Goudy Oldstyle, Georgia, or Times (all different, but all resolved). </p>
      <p>When you set some text with default spacing (and you should not be thinking about kerning at all at this point), you may notice f colliding with other ascending letters. LC j will collide with all descenders. They stick out really far, and while by themselves it isn't a problem, typefaces are essentially modular systems, and every combination has to work automatically. Kerning is only to fix real problems that remain after spacing is carefully adjusted. There can be a real benefit to working on outlines and spacing simultaneously, but unless you have gotten control of those and resolved the basic spacing, kerning will only make you sad. Re: spacing: f needs to move right; more room on the left and the whole top part overhanging it's right sidebearing, like you did with j. bdpq are all tight on the straight side, loose on the bowl.</p>
      <p>To me, both cap and lc S look completely foreign to the rest of the alphabets. They are jaunty, angled, informal, angular, sinuous. Everything else is mechanical, vertical, precise, machined, formal, serious. I do not presume to push you in either direction, just know that there is a large variance in the character (ha ha!) of the various letters. It seems to be a trend to make S and s with softer teminals now, but among the others here it looks wrong. </p>
      <p>LC m is typically not made from n + n-arch. This gives a very wide-looking m; usually the stems of m are closer than those of n and h. For that matter, h, n, u already look wide to me. Similarly, W doesn't usually look right when it's made of 2 V's overlapped. Again with the illusions..... </p>
      <p>I suggest you look very closely at some other typefaces in a similar vein: Caslon, Baskerville, Times Roman, Bembo, Galliard, Minion. Those aren't all in the same category, but I think Berling has very little nuance to offer you. If you could get digital access to other typefaces, open them in your font editor and examine how they are constructed; where the points are, where curves start, how curves join straights, measure the thins wherever they appear. For examples of thins, see Galliard's AEHKMNU. </p>
      <p>One other suggestion in general: Draw everything on paper first. Draw it at 2 or 3 sizes, make clean, tight drawings, and don't be distracted or lured by the seeming economy and precision of digital outlines. Outline formats tend to lull people into relying on the format for consistency and precision. Often the result is dead-looking, mechanical shapes. PostScript is very very robust and flexible and will give you any shapes you want, including very organic, messy, or rough ones. Let it be a tool and not an influence on the design.</p>
