    <p>Note: Corunna -&gt; Coruña</p>
    <p>After editing around with Berling to get the feel for font making, I went ahead and started making my own font from scratch.  Couple of things I did was start off with a lower x-height and larger descenders since I plan on taking it multiscript.  Hrant may or may not notice that the serifs are a little stronger on the right side, so when the left serif is removed down the road for Armenian, it should flow nicer.  I just have lowercase now, but I think I'm off to a good start ... but comments are of course greatly appreciated (I've not begun kerning adjustments yet at all).  So far the comments from my friends have been they really like the g, j, and y, but they don't like the t ... I'm figuring for it just make the filled section a little smaller (not as tall and not protruding as much to the left?)</p>
    <p>File name note: coruna5 is the <em>italic</em>one.  All the others are newer versions by increasing number.</p>
