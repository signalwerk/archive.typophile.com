      <p>"Does anybody knows why fontlab crashes unexpectedly?"</p>
      <p>You can't run it for too long, run long with several other applications running, with a large glyph repertoire refreshing, or edit a high resolution font at large magnification, without crashes likely to occur. Any time FL fails to immediately respond to edits, it is coming soon so I save and restart. And any time it does edits different from mine, it's also time to restart. Once or twice a year it gets me bad by not saving work anywhere, the latest version simply vanishing to font heaven when you quite FL. </p>
      <p>It beats little pieces of metal trapped your teeth, but you have to be careful at all times to observe its behavior and react accordingly a the right time. I've found it to be truly unique in this versus all the other post-1999 Mac apps I've used.</p>
      <p>ChrisL! There is a whole forum set up for your kind of whining at the FL site where it can now be less obviously ignored.</p>
      <p>Cheers!</p>
    html_clean: |-
