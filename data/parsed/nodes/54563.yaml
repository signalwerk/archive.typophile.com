      <p><strong>James:</strong> <em>I get those weird shapes all the time, but undo usually fixes things.</em><br>
      This probably has to do with the way FL manages undo (it is: one thread by glyph, so as, after some glyph jumps, one increases geometrically undo memory usage) through multiple dynamic pointers; eventually, it may occur that, when you try to go back i.e. by typing a fast keystroke, you “catch” FL —which is modestly slow due to its complexity— performing another background task; that's why you can fix it —actually, not exactly a bug, but an undesired undoable behavior— by repeating the command: after recovering its “conscious”, FL finishes all pending tasks and brings you where you wanted to.</p>
      <p><strong>MarS</strong></p>
    html_clean: |-
