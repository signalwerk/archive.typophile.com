      <p>As soon as a path starts behaving oddly, I do this: First, if necessary, undo to the point where the outline looks okay. Then select the entire path, cut and then paste. This seems to always clear up erratic path behavior for me.</p>
      <p>I also have a habit of saving frequently. I don't trust auto-save because it may save the font in an undesirable condition, like right after I've done something I shouldn't have to the font. I also use the option to save .bak files, so I can always roll back one version. Failing that, TimeMachine on OS X is my fallback (and it has saved me at least once).</p>
