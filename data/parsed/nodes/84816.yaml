      <p>Thanks, good pointers there! Working on those now.</p>
      <p>Still tempted to work on lowercase letters as well. As Dave suggested a long time ago I might opt for lowercase variants of these uppercase letters, same height as the uppercase letters possibly. That would give a user some alternatives when writing without me having to sacrifice the display property of the typeface.</p>
      <p>Any pointers on kerning by the way? I read up on class kerning - are there new features for this in Fontlab these days, or does one still need to write the classes manually? (not sure if that is how you are supposed to do it but that's how I did it the last time)</p>
