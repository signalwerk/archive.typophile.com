  html: |-
    <p>I'm working on my second typeface, working title is "Abraham" for now. This will be a real big, bold and solid one, intended for display purposes.</p>
    <p>I've been drawing these for a while in cards and posters and bookcovers for example. Here are some examples of previous use (these are all handdrawn but I'd like to make this into an actual typeface)</p>
    <p><img src="http://farm5.static.flickr.com/4149/5198195522_5c266b3037.jpg"><br>
    <img src="http://farm5.static.flickr.com/4109/5077379505_9c4aea013b.jpg"><br>
    <img src="http://farm3.static.flickr.com/2280/2266820815_71d565bb96.jpg"></p>
    <p>Here is a first preview of the basic characters:<br>
    <img src="http://farm7.static.flickr.com/6197/6048988783_1deb70fdcc_z.jpg"></p>
    <p>Is this worth pursuing? I'm considering leaving this all caps and offering 2 or 3 alternatives per letterform (more?), so that users can set text that has a real handmade / random feel. Is there some kind of way to get open-type software to cycle through these alternates? The "Populaire" typeface lists that as a feature, although I'm not sure how the designer created this... <a class="freelinking external" href="http://new.myfonts.com/fonts/pintassilgo/populaire/" rel="nofollow">http://new.myfonts.com/fonts/pintassilgo/populaire/</a></p>
    <p>Suggestions welcome!</p>
