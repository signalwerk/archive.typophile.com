      <p>Lovely!</p>
      <p>There's an article about contextual alternates by Nick Shinn on I Love Typography, which you may find useful, and loads of entries on Typophile which will help you out with the coding.</p>
      <p>I think you're right to stick to all caps, but if you do decide to add lowercase, I'd keep the x-height BIG, verging on unicase territory.</p>
