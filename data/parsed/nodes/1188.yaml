  html: <p>ditto to Grants comment. userbility goes down. <br>As far as uniqueness is concerned. Well new "s" is ceratinly interesting but in my opinion not complete. the center slant on the "s" is thicker than the slant the "e", "g"  and "a". I am not sure if it is intentional or not but it looks too thick especially in the bold weight. I am also noticing the top counter in the lc "g" is sitting kind of low and not centered. This I suspect may be intentional.  <br>I tell you Joseph, I am a sucker for unusual forms but these days  <br>I find myself regretting certain recent purchases (Sophia from Fontsmith as well as Friendly from Die-Gestalten) because of userbility issues. <br>I guess Stephan might be right in some ways.  <br>A designer/agency may purchase the new version but will it be used a lot-I am guessing properly not. If one of your goals is exposure of Pill in award winning design the i would suggest going back to basics.  <br> <br><img src="http://www.typophile.com/forums/messages/29/29014.jpg" alt="pill"></p>
