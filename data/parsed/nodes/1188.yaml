    html: <p>&gt; <i>Grant, you must figure out a way to show small caps on</i> <br>&gt; <i>the website. You can't rely on people to read for that info.</i> <br> <br>Very true. Our bottleneck right now is the time it takes to properly create custom, family-specific displays for all of the new (and existing) fonts. Our goal over the next dozen weeks or so is to replace our generic 'Divergently' displays within the Umbrella collection with showings that are unique to each face.  <br> <br>Eventually, these improvements would continue through the most popular typefaces from the other foundries as well. Right now, we are really limited by our internal creative resources. We are definitely concerned with displaying the typefaces in the most appropriate and complimentary manner as possible. <br> <br>Frankly, the better it looks, the more you sell. <br> <br>&gt; <i>Also, will Veer be adding PDF specimines any time soon?</i> <br> <br>Yes, and hopefully soon. This is not something that we can easily accommodate with the product database solution we are currently tied to. However, we are in the process of finishing up a brand-spanking new system that will allow us to add external data types (like custom PDF specimens and links to designers website, for instance) to individual product pages. <br> <br>Not yet, but soon. <br> <br>Another thing we are going to address is the ability to view complete dynamically-generated character set, a la MyFonts. Oh, and a preference that maintains a consistent, user-defined text string for all of your Flont samples is also going to be available shortly.</p>
    html_clean: <p>&gt; <i>Grant, you must figure out a way to show small caps on</i> <br>&gt; <i>the website. You can't rely on people to read for that info.</i> <br> <br>Very true. Our bottleneck right now is the time it takes to properly create custom, family-specific displays for all of the new (and existing) fonts. Our goal over the next dozen weeks or so is to replace our generic 'Divergently' displays within the Umbrella collection with showings that are unique to each face.  <br> <br>Eventually, these improvements would continue through the most popular typefaces from the other foundries as well. Right now, we are really limited by our internal creative resources. We are definitely concerned with displaying the typefaces in the most appropriate and complimentary manner as possible. <br> <br>Frankly, the better it looks, the more you sell. <br> <br>&gt; <i>Also, will Veer be adding PDF specimines any time soon?</i> <br> <br>Yes, and hopefully soon. This is not something that we can easily accommodate with the product database solution we are currently tied to. However, we are in the process of finishing up a brand-spanking new system that will allow us to add external data types (like custom PDF specimens and links to designers website, for instance) to individual product pages. <br> <br>Not yet, but soon. <br> <br>Another thing we are going to address is the ability to view complete dynamically-generated character set, a la MyFonts. Oh, and a preference that maintains a consistent, user-defined text string for all of your Flont samples is also going to be available shortly.</p>
