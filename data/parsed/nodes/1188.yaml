    html: <p>I think we're really just talking about stylistic preferences now. Some like the new s, some don't. I personally dislike it (rather strongly in fact). The reason is the techno reference Stephen mentions above. I think this S treatment pushes the whole face too far in that direction both in display and in text. I don't know what else to say. It's actully makes is less buyable for me. <br> <br>But the fact that some do like it suggests to me that you should include one or the other as an alternate. Obviously, I would choose the old S for the main set, but you might highlight the Alternate S in promotional materials. <br> <br>Just make a call and go with it <br>Keep smiling, your almost done. <br> <br>Randy</p>
