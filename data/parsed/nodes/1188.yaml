    html: "<p>Ok, I just printed and I still feel the same about the new 'Ss'. The <br>whole design is more congruous now. <br> <br>Some other things I noticed: <br> <br>- Some of your numerals seem a little long - the '7' especially, as <br>it descends below the other descenders. <br> <br>- Your small caps are the perfect height. Nice. <br> <br>- Is the kerning done? The apos-s pair is a little tight. <br> <br>- The difference between the comma/apos/quote form and the <br>square period is just fine until a semicolon appears. Maybe the <br>period can get a tad smaller? Closer to stem width. DIN's, in <br>particular, is much lighter.</p>"
