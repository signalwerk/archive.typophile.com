    html: <p>I personally feel that this new S should be included as an alternate. I am not fond of it in a body application, but I would certainly use it in headlines. I think it is very unique. <br> <br>Ole and Grant have the same readability issues that I have. I purchased Fedra a few months ago, and as much as I love using the font at small sizes, anything above 12 point starts to be problematic. The "uniqueness" of certain letters becomes a distraction. I would hate to see that happen with this font. (I noticed recently that Peter Bilak is offering an alternate version of Fedra that removes some "features" of the old font.) <br></p>
