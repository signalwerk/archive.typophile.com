    html: '<p>Pill Gothic Review: Christian, this is a killer font! I am glad to see that all of the alternates made it into the final mix. I was also surprised to see an alternate "a" and "e". The spacing is nice and even throughout. I am setting some text at 8 point and the color is very consistent. The ligatures work perfectly and I like the addition of the "Th" lig. The "fl" seems a little awkward though. There are a few overlap problems that I noticed: the cedilla, o slash and ae. <br> <br>Bravo, Christian. This easily makes it into my current top ten!</p>'
