    html: "<p> <br> <br> I agree that there is something not quite right with the s's, though I think I'm on the right track. It's true that the font behaves completely differently with the funky S's. It supports my theory that the character of a font can be changed drastically with a smattering of alternates (see Uncial New in the Critique:Blackletter/Uncial category). I really wish OpenType software (i.e. InDesign) would let type designers name their own features, which would then come up under the font menu. Why have a \"Titling Alternates\" check box when the font really needs a \"Funky S\" feature? I can understand why standard naming conventions would be desirable for standard features (smcp), but why won't the software recognize non-standard features? The question seems so obvious to me that it makes me angry. <br> <br>The cross-bar on the new s' are too wide. Good call. As for Hrant's last comment: too terse : ) For now, however, I think that the funky s will have to live in an OpenType category like titling alternates, or something like that. <br> <br> </p>"
