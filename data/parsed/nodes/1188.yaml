      <p>A small update:<br>
      The other day I got a promotional mailer for the Luxor casino in Las Vegas, and it uses Pill Gothic for the cover, and some of the inside text. Besides enjoying the pleasure of seeing it in action out of the blue, I thought it looked great, and it's interesting to wonder if they chose it because setting "Vegas" in Pill Gothic results in something quite nice, mixing that rigidity with that trio of strong, and unexpected, diagonals.</p>
      <p>hhp</p>
