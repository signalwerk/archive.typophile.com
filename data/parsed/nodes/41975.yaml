    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CPD-Chomel-DEMO_6217.jpg"></div><p></p>
    <p>hi all,</p>
    <p>here is CPD Chomel, a fun display face mainly intended to be used large as headings or short copy.</p>
    <p>so far there are no caps and only limited symbols.</p>
    <p>i look forward to hearing your thoughts.</p>
    <p>cheers </p>
    <p>- simon :)</p>
