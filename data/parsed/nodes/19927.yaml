      <p>I think Paul is right about the ascenders. Tiffany is quite right, too, but a little more unevenness would make it more lively. Hrant is right about the numerals as well: their style is a counterpoint to most of the letters' one.</p>
      <p>My idea: heighten the ascenders a little, differentiate a bit some forms to get rid of an excessive homogeneous quality. Don't know how to do it without loosing the general feeling, anyway.</p>
