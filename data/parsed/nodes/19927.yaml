    <p>Good evening!</p>
    <p>This font is based from memory off of a poster that my grandparents in West Virginia have; I haven't actually seen the poster for a few years because each time I'm there I forget to look at it. It's some interesting geometric art, including the text </p>
    <p>yoshiko<br>
    mcgaw editions</p>
    <p>in this lettering. (It also has an alternate, much thinner c and s that I will make soon.) I discovered that "McGaw Editions" is a company that makes posters, but when I emailed them to ask if they could tell me about that particular one, they couldn't find it in their database. (I assume it's just old, and predates their digital age.) I think it was probably hand-drawn because (1) it's old and (2) I haven't been able to find anything similar, except for one that was similar but not it (I can't find it again or remember its name). Anyways, tell me what you think.</p>
