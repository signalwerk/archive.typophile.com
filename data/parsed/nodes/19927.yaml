    html: |-
      <p>Frankly I'm not sure why, but I think this has potential.<br>
      Something about the... terminals maybe, is making it special.</p>
      <p>f: no good.<br>
      i/j: make dots round? In any case, align tops of dots with ascenders.<br>
      r: beak needs help.<br>
      s: some people will tell you to make the stroke weight distribution conventional; I suggest you smile and ignore them. But do make the bottom-right curve smoother.<br>
      p/q: it might actually make sense to make their descenders shorter than the others. Maybe the "j"'s too (although maybe not as short).<br>
      t: weak.<br>
      v: good idea, but a bit too full.</p>
      <p>A: a bit TOO wide.<br>
      I: consider serifs.<br>
      J: flatten terminal shear.<br>
      L/T: too narrow.<br>
      Q: come on, live a little!  :-)<br>
      S/V: same as in lc.<br>
      Y: unsure; maybe try using your "v" structure.</p>
      <p>numerals: rationalist. niiice. The "one" is bril.</p>
      <p>Pilcrow: dump the little bar in the middle of the stems. And you need more heft, somewhere - that's how a pilcrow works.<br>
      %: the bar is cool, but flatten it.<br>
      &amp;: thmooooz.<br>
      #: I can dig it.<br>
      [/]: longer bars, probably.<br>
      (/): wishful thinking - too much like square brackets.<br>
      guillemets: make more angular.<br>
      cedilla: out of character.<br>
      accents: the ring is bril, the diaeresis is OK, the rest are out of character.<br>
      $: nice.<br>
      Yen: I'd use one bar; if not, lower them.<br>
      BP: not working. Try a smaller top.<br>
      eszet: squashed head. Let it be what it needs to be.</p>
      <p>Spacing: too tight; the stem-stems are bunching.</p>
      <p>hhp</p>
