    html: |-
      <p>I could hardly believe that the Indy pref for optical size works only with old MMs and not with (as John points out) the ill-denominated 'opticals' (which always sounds to me like a nominally health-giving breakfast dish composed of stale rusk, eggy stuff, and brewer's yeast, preferably served on a recycled floptical). But he is completely correct that the feature has no effect on the 'opticals'. You must wonder what Adobe's point in publishing the fonts is, if no software, not even their own, supports the hapless fonts. </p>
      <p>For the record, Microsoft was the first software publisher to support correct optical size automatically. There was a Windows-only version of MSW in the mid-1990s that automatically selected the right optical instance of an MM font that contained an optical instance. </p>
      <p>So it is great that MS software will be supporting the sizes. Since Sitka is the best thing to happen to type since Sumner Stone's Cycles family, I believe, thanks to MS support, that it will eventually be compulsory for other software publishers to support the font family fully, whether they like it or not. It is so heartening to see a font project like this - - for once, everything has been done right. It is just extraordinary to think that there will in future years be a lot of really good typesetting being produced automatically by people who don't know and don't care that they are doing it. That's the way to do it!</p>
