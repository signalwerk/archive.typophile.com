      <p>Ideally, the foundry would set the default values for optical size ranges, but the layout application would have a slider so that typographers could adjust the ranges*. The foundry would certainly consider target device or demographics in deciding where to put the boundaries.</p>
      <p>Typographer manual over-ride is necessary because size (degree of arc) is not the only thing that effects readability, because apart from device and demographics, there are also color (of text/background) and brightness of the document design to be considered.</p>
      <p>In some cases, the adjustment may be better as grading/weight change, rather than size-specific.</p>
      <p>*Quark has something like that for editing tracking tables.</p>
