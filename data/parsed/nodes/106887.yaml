      <p>InDesign's preference for Optical Sizes is, I believe, a legacy Multiple Master function, i.e. it doesn't work with OpenType. Adobe is one of the few font foundries that actually include GPOS {size} feature data in their OT 'Optical' fonts -- terrible term, by the way --, but have not implemented support for it in any apps, to my knowledge.</p>
      <p><em>Is changing the optical size an application operation? Can you manually override to another size? And if so, does the text need recomposing?</em></p>
      <p>Good questions all. I'm not sure anyone has fully worked out how this should work at the level of interaction between automated selection and user discretion. Given Microsoft's tendency to specify data formats but not implementation, I expect it will be up to the wider type and design community to think about this and determine what we'd expect from different kinds of applications (as was the case with, e.g. determining whether Stylistic Set features should be treated as additive or exclusive).</p>
