    html: |-
      <p>In looking at the Old Style samples in the "Encyclopaedia of Type Faces" by Jaspert, et al. I do not see a good match for the 'f' in either the Monotype or Linotype versions that are shown. The 'r' looks most like the Monotype version, and in looking at the full page sample, I found a Roman 'g', and it looks more like the Monotype Old Style 'g'.</p>
      <p>The italic 'f' still seems to be a problem, for none of the samples, including an old Linotype catalog from the '30's shows anything quite like it. BTW, Old Style No.7 in the Linotype catalog had a rather narrow 'f', but not this narrow, and the Roman 'g' was not so close, and the italic 'r' was not as much like a 'v'. The narrowness of the italic f in your sample is not quite like any samples I could find.</p>
      <p>- Mike Yanega</p>
