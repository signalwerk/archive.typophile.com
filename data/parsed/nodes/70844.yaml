      <p><em>Is our current notion of smallcaps an invention of the digital age?</em></p>
      <p>Not at all, this convention has been around a long time for book printing. SC letters were often a part of the serif text families, and the letters were specifically designed for that size, not just re-scaled.</p>
      <p>- Mike Yanega</p>
