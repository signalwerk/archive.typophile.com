      <p>Raph,</p>
      <p>That looks like a match indeed. Even the fi ligature looks the same, with the lower part cut. I presume the digitization was made from a larger size, which would partly explain why it seems thinner. I also presume the smallcaps were taken from a smaller size. Is our current notion of smallcaps an invention of the digital age?</p>
      <p>Michel</p>
