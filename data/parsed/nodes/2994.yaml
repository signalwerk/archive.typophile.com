    html: <p>David Lemon told me at the type conference in Thessaloniki in June 2002 that Adobe were moving away from the PUA encoding, and his colleague Eric Muller was quite vociferous about the problems of PUA in text around the same time. Brioso may have PUA codepoints because it has been in development for some time, or because Adobe had not changed their production standards to remove PUA completely. It is notable that although Brioso has PUA mappings in the cmap table, the glyphs are named as variants of the standard character, e.g. /A.sc/ not /Asmall/, which means name parsers will map these characters back to the standard codepoints for the character, not the PUA codepoints of the variants.</p>
