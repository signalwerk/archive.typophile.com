    html: "<p>No, Unicode does not (generally) encode glyph variants. Only default -- or what Yannis Haralambous calls 'privileged glyphs' -- are directly mapped to characters. So an OpenType font will contain one encoded &lt;a &gt; character, and possibly a multitude of unencoded variants: /A.sc/ /A.swash/ /A.alt/ /A.titling/ etc. The glyph variants are mapped indirectly to the character via OpenType Layout features. <br> <br>OpenType Layout allows the user to control the <i>display</i> of text while maintaining the semantically meaningful backing store of character codepoints.</p>"
