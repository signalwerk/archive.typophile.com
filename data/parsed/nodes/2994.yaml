    html: <p>Adam has it pretty much all correct. But I will note that the presence of the CMAP without a GSUB table doesn't really help in some cases, such as with alternates and ligatures that don't have standard slots in Unicode. Take for example small caps. So there are some of the same situations listed for OpenType PS fonts that also apply to OpenType TrueType fonts. <br> <br>Cheers, <br> <br>T</p>
