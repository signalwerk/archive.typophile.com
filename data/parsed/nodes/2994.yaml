    html: "<p>I agree with Adam that it is wise to systematically name glyphs according to OTL feature. However, in the case of numeral variants it is important to identify two pieces of information about the glyph: its style and its spacing, which are controlled by two different layout features. For numerals I use the following extensions (although one style is obviously the default form and the extension can be omitted): <br> <br>.LT = lining tabular &lt;lnum&gt;&lt;tnum&gt; <br>.LP = lining proportional &lt;lnum&gt;&lt;pnum&gt; <br>.OT = oldstyle tabular &lt;onum&gt;tnum&gt; <br>.OP = oldstyle proportional &lt;onum&gt;&lt;pnum&gt; <br> <br>Recently, I've started adding smallcap lining figures, but only turn these on with the caps-to-smallcaps feature: <br> <br>.ST = smallcap tabular &lt;c2sc&gt;&lt;tnum&gt; <br>.SP = smallcap proportional &lt;c2sc&gt;&lt;pnum&gt;</p>"
