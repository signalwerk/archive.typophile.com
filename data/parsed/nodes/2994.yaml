  html: <p>Why in some Adobe fonts are the small caps named A.sc, B.sc ... a.sc, b.sc, and others are listed as Asmall, Bsmall?  <br> <br>Which one is correct or what is the difference?  <br> <br>Thanks.  <br> <br>Nigel</p>
  html_clean: <p>Why in some Adobe fonts are the small caps named A.sc, B.sc ... a.sc, b.sc, and others are listed as Asmall, Bsmall?  <br> <br>Which one is correct or what is the difference?  <br> <br>Thanks.  <br> <br>Nigel</p>
