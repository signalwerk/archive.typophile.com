    html: "<p>Ah, now James introduces an interesting point. To which base character do you want your glyph variants to be back-mapped? In the actual OT features, of course, you can map both the upper and lowercase letters to smallcaps, but parsing glyph names back to characters is a one-to-one option. Yes, I think it is better to map smallcaps back to uppercase letters, because the most semantically meaningful use of smallcaps is in acronyms and abbreviations, which should be mapped back to all-caps; most other uses of smallcaps, e.g. running heads, chapter entries, etc., are merely stylistic and it doesn't really matter whether they are mapped back to uppercase or lowercase. <br> <br>Adobe got their knickers in a twist about this question, and have started including duplicate sets of smallcaps in their fonts: one (X.sc) for use with the &lt;c2sc&gt; feature and one(x.sc) for use with the &lt;smcp&gt; feature. I don't think this is worthwhile, Microsoft thinks it is silly, and Adobe are not actively recommending that anyone else follow suit. The important thing to remember is that parsing glyph names to reconstruct character strings is something that is only necessary in a minority of cases with one application (Acrobat). Most of the time, when PDFs are exported from applications, the original character string is stored in the PDF, so there is no need for Acrobat to parse the glyph names. Glyph name parsing is only necessary when you have a PDF distilled from something like a Word print stream, in which there is no storage of the original character codes. Of course, the whole mechanism fails spectacularly as soon as you start dealing with complex scripts in which glyph order does not correspond to character order. Also, some TrueType fonts ship with format 3 post tables, which do not include glyph names, and Acrobat will not be able to reconstruct character strings for text set in such fonts.</p>"
    html_clean: "<p>Ah, now James introduces an interesting point. To which base character do you want your glyph variants to be back-mapped? In the actual OT features, of course, you can map both the upper and lowercase letters to smallcaps, but parsing glyph names back to characters is a one-to-one option. Yes, I think it is better to map smallcaps back to uppercase letters, because the most semantically meaningful use of smallcaps is in acronyms and abbreviations, which should be mapped back to all-caps; most other uses of smallcaps, e.g. running heads, chapter entries, etc., are merely stylistic and it doesn't really matter whether they are mapped back to uppercase or lowercase. <br> <br>Adobe got their knickers in a twist about this question, and have started including duplicate sets of smallcaps in their fonts: one (X.sc) for use with the &lt;c2sc&gt; feature and one(x.sc) for use with the &lt;smcp&gt; feature. I don't think this is worthwhile, Microsoft thinks it is silly, and Adobe are not actively recommending that anyone else follow suit. The important thing to remember is that parsing glyph names to reconstruct character strings is something that is only necessary in a minority of cases with one application (Acrobat). Most of the time, when PDFs are exported from applications, the original character string is stored in the PDF, so there is no need for Acrobat to parse the glyph names. Glyph name parsing is only necessary when you have a PDF distilled from something like a Word print stream, in which there is no storage of the original character codes. Of course, the whole mechanism fails spectacularly as soon as you start dealing with complex scripts in which glyph order does not correspond to character order. Also, some TrueType fonts ship with format 3 post tables, which do not include glyph names, and Acrobat will not be able to reconstruct character strings for text set in such fonts.</p>"
  - id: 23796
