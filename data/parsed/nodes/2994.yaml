    html: "<p>Hi, <br>Adam alerted me to this highly interesting thread, and asked me to provide some more details about Unicode information in PDF which I'm happy to do. <br>Here we go: most modern PDF Producers (not only Distiller) indeed add a special data structure to the actual font data in the PDF which is used to add Unicode semantics for any font. This is not always required; in many cases Unicode mappings can and will be derived from the /Encoding entry in the PDF (which is separate from any encoding information in the font) or by mapping well-known glyph names. However, especially with subsetting or non-AGL glyph names this may not work. Even advanced techniques which interpret parts of the font's data may not work (for example, with TT subsetting it's legal to strip the post table). The additional data structure is called the ToUnicode CMap. It borrows the syntax from using CMaps with CID fonts, but in this case the CMap is used to map the font's code points to Unicode values. More precisely, it can be used to map a sequence of one or more Unicode values to each addressable glyph in the font. This makes it possible to correctly map ligatures (but complex scripts which require glyph reordering cannot be mapped this way). It's important to note that the text will not be stored twice in the font; instead, the font will have the ToUnicode CMap attached to it. <br>With a ToUnicode CMap reliable text extraction for PDF is possible even if the glyph names are completey screwed up (private names or wrong use of standard names). However (and I guess it's not necessary in this forum to emphasize this point) it is highly recommended to use good glyph names wherever possible. For example, how could the PDF producer create a proper ToUnicode CMap without enough information in the font (of course this point is moot for modern Unicode-based font formats, in particular OpenType)? <br> <br>Finally, it's worth mentioning that there are other means in PDF to attach Unicode information to text. In particular, Tagged PDF offers various means which can be used to mapped arbitrary sequences of text to a Unicode-conforming equivalent, similar to ALT tags in HTML. However, this is completely beyond the font designer's control, but is completely managed by the application producing the PDF. <br> <br>Thomas <br></p>"
