    html: <p>I'll just add that, by pure matters of convention, I recommed that whenever a glyph is used in an OpenType Layout feature, you use the OpenType Layout feature tag names as glyph name suffix. For example, the variant of the digit "five" that is used in the old-style figures feature (abbreviated "onum"), should be named "five.onum". For small caps variant of "A", I personally recommend using "A.smcp". I guess in that very case, "A.sc" is also acceptable.  <br> <br>Such a systematic approach can help a lot when developing OpenType fonts. If one glyph is used in more than one feature, I'd recommend using the "primary" feature tag as suffix (e.g. if the small caps variant of "A" is used in the smcp and the c2sc feature, I'd still call it "A.smcp").  <br> <br>As mentioned above, this is simply a convention.  <br> <br>Regards,  <br>Adam Twardoch <br></p>
