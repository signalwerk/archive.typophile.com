    html: "<p>John,  <br> <br>as far as I know, the necessity to parse glyph names back to characters only occurs in even more specific situations.  <br> <br>First, it only becomes necessary when the font is embedded in the PDF document as Type 1. Since neither PostScript nor PDF have native support for OpenType PS (.otf) fonts, both Type 1 fonts and OpenType PS fonts are sent as Type 1 (or bare-bones CFF, but it's a negligible detail). OpenType TT/TrueType (.ttf) fonts usually are sent as so-called Type 42 fonts, which are a sort of \"binhexed native TrueType\" fonts.  <br> <br>What this practically means is that when TrueType fonts are embedded in PDF files, all the tables including the cmap table are embedded. So it the vast majority of cases, for TrueType fonts, Acrobat can access the embedded cmap table and does not need to parse glyph names. Also, when Distiller creates the PDF that uses embedded TrueType fonts, it encodes additional information in the PDF that contains the Unicode version of the text used (which usually makes the PDF larger but more accessible).  <br> <br>As you probably know, in most cases, PDF files are built by first creating a PostScript file, and then converting it into PDF. As I mentioned before, PostScript has no knowledge of OpenType PS, so the .otf fonts are embedded in the PostScript \"print stream\" (i.e. the data gets sent to the printer or is used to build the PDF) as Type 1. This means, obviously, that there is no cmap table that walks along the file.  <br> <br>However, when a PDF is produced using the Adobe Acrobat package, Acrobat Distiller has an option to use original fonts rather than the ones embedded in the PostScript stream. With this option activated (by default), Distiller looks for the OpenType PS font on the user's hard disk. If found, Distiller parses the cmap table and adds Unicode text information to all text objects in the created PDF file (just like with OpenType TT/TrueType fonts).  <br> <br>So in all the cases above, the PDF is created with Unicode information already embedded, and Acrobat has no need to parse glyph names.  <br> <br>The few situations when Acrobat needs to access glyph names of the font are when:  <br>1. The PostScript file was built on one computer, and the PDF file is \"distilled\" on another computer that does not have the OpenType PS font installed.  <br>2. The \"use original fonts\" option in Acrobat Distiller was disabled.  <br>3. When the TrueType/OpenType TT font was embedded as Type 1 font rather than Type 42 (e.g. when PostScript Level 1 was used or the file was created in Corel DRAW).  <br>4. The PDF was created using some non-Adobe software. There are numerous packages for PDF creation on the market, and *some* of them are much less sophisticated than Distiller.  <br> <br>The information above is my understanding of what I have learned from some Adobe engineers. I hope it is accurate, but I may have mixed something up.  <br> <br>So, all in all, it *is* useful to use meaningful glyph names, but it's not the end of the world if you don't.  <br> <br>Regards,  <br>Adam Twardoch <br></p>"
