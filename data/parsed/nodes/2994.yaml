    html: "<p>Those are not <i>standard</i> Unicode values: they are Private Use Area codes, which means that the same codes can be used by another person for completely different characters. This leads to all sorts of problems with font switching and document exchange, as well as producing documents that cannot be searched or spellchecked. I avoid PUA codepoints like the plague. Adobe originally were recommending using PUA codepoints for glyph variants for precisely the purpose you suggest, but they have since reversed that position -- having seen what a mess PUA codepoints make of documents -- and are now advocating against PUA use.</p>"
