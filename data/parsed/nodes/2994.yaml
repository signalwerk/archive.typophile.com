    html: <p>The /X.sc/ naming convention is more recent and a better choice for new font development. Some glyph name parsers such as the old ATM and at least some versions of Acrobat, would map /Xsmall/ to a Private Use Area codepoint, i.e. to a non-standard character code. /X.sc/ is interpreted as an unencoded glyph variant of /X/, so is more reliable for capturing standard, interchangeable text from print streams and other circumstances in which the original character codes are lost and only the glyph names remain.</p>
