    html: '<p>Thomas,  <br> <br>indeed, I forgot to mention that aspect. Obviously, for unencoded glyphs such as alternates and small caps, the glyph naming still is very helpful -- at least the "basic" character, and therefore its Unicode can be recovered. The same applies to ligatures: when the ligature glyph is named "f_f_k", Acrobat will be able to extract the text "ffk". If the ligature glyph were named "ffk" or "ffklig" or something similar, Acrobat will fail to recover the text and will map that glyph into a non-defined character.  <br> <br>Therefore, it really does make sense to follow the recommendations given in the "Assigning glyph names in new fonts" section of the document listed at:  <br><a href="http://partners.adobe.com/asn/tech/type/unicodegn.jsp" target="_blank">http://partners.adobe.com/asn/tech/type/unicodegn.jsp</a> <br> <br>Regards,  <br>Adam <br></p>'
