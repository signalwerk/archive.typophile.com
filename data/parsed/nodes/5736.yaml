  html: "<p>I have a problem.. I have done a font for a company and it doesn't work in InDesign..  <br>Here's what he's saying:  <br> <br>\"The font problems seem mostly to be occurring when printing from  <br>Adobe InDesign. They are post script errors which cause the documents  <br>not to print at all from our rip. To get a printable result we are  <br>forced to create a pdf from the document and then print from that. We  <br>suspect that there may be loose ends and/or open paths in some of the  <br>characters\" <br> <br>So now I wonder what shall I do to make it work? <br>I have made the font in Default Encoding (and also tried Adobe Encoding), Kerning &amp; Metrics. TTF <br></p>"
