    <p>Hi all,</p>
    <p>I’m looking for sans serif faces that have a “curled foot” (for lack of a more precise description) on the right leg. Examples include Priori and Tarzana Wide from Emigre.</p>
    <p></p><div class="imageWrap"><img src="/files/r_6457.jpg"></div><p></p>
    <p>Not interested in legs that have an convex, or outward curve, like many other sans (e.g., Myriad) and slabs.</p>
    <p>Thanks in advance for your suggestions!</p>
