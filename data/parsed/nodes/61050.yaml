    html: |-
      <p>choose an open face (a and e with big counters, "mouth" wide open) from the Venetian, Garaldes or Humanist, not too light, not too much stroke contrast, maybe something slab or sturdy like Sauna will look more informal, also round, simplified forms (curved crossbar of e, one storey a etc) like in Speak (good idea) or Bree are possible, but rather not geometric.<br>
      <a href="http://www.fontshop.com/fontlist/genres/soft_rounded_sans/" title="http://www.fontshop.com/fontlist/genres/soft_rounded_sans/">http://www.fontshop.com/fontlist/genres/soft_rounded_sans/</a><br>
      (scroll down)</p>
      <p>I would not go for something too soft like Cocoon or hand-made, since that possibly will look worn-out too soon.</p>
