      <p>wow! thanx for the response guys, totally appreciate it!</p>
      <p>ive actually come across a really good typeface: ITC Serif Gothic BT , which seems to work really well. i love the serifs and the overall rounded form and feel like it has a nice arabic flavor which is exactly what im looking for, in addition to being friendly of course!</p>
      <p>however im not too sure about using vag rounded as body text at 10pt with 12 pt leading anymore. since the newsletter is  going to be distributed as a pdf i just dont think that font is legible. what do u all say? i might have a go at some of the typefaces everyone suggested in here. i need to find a suitable headline typeface and body text.</p>
