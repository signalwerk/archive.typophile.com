  html: |-
    <p>hi there,</p>
    <p>i am looking for a display face to be used for the nameplate of a newsletter. i want something that is friendly, approachable and young ( not too young tho!)</p>
    <p>i am redesigning a corporate newsletter and my instructions were to make it less corporate. the target audience are the employees of an oil company who's logo revolves around circles and paths. so i would like a typeface that reflects that in the title.<br>
    i am currently going to VAG ROUNDED for body text and headlines.</p>
    <p>any suggestions would be much appreciated.</p>
    <p>thanx in advance!</p>
