      <p>Nick,<br>
      I am afraid I am knowledgeable enough to speak for the general public in Romania (let me correct that: the tiny minority who actually care) as to how the comma should look. But I gladly share what I do know and prefer. </p>
      <p>I recently found a document published by the Romanian Academy, The Institute of Linguistics, that is relevant to your question. It was written in 2003. I will translate a small section here:</p>
      <p><cite>The letters ş, Ş, ţ, Ţ must me be both written with the diacritical mark positioned underneath, specifically a mark resembling a comma (situated at a small distance under the corresponding letters s, S, t, T), and not with a cedilla.</cite></p>
      <p>[Excuse the overly literal translation.]</p>
      <p>As you can see the document says resembling a comma, but does not give further guidelines. My personal preference is for the mark to closely follow the design of the comma (in the context of the font). I should say that in certain typefaces, they are exaggeratedly large (see example above, Adobe Jenson). The heart of the issue is to have it free-standing, as you mention. </p>
      <p>I will try to do some further research either later today or in the next couple of days. Maybe I can find additional specs.</p>
    html_clean: |-
