      <p>Dan, thanks for starting the thread!</p>
      <p>I can understand why you would object to two forms of the same accent, and that is avoided in the new Latin Extended OpenType fonts I've been making for a couple of years now, and which a lot of other foundries (not just the big computer/software corporations) are also doing. FontLab can take some of the credit for making this possible.</p>
      <p>But moving on, can I get you to commit to stating your preference for the shape of the commaaccent?--and explaining why?<br>
      I mean, how much like a comma should it look, and how much like an acute accent? Does this vary with different type genres?<br>
      What are the preferred forms amongst the Romanian typographic cognoscenti? (Is there anything hip and indigenous, like the quirky Oldřich Menhart Czech accents?)</p>
      <p>I realize there may not be simple answers. After all, there are variant forms of the cedille used in French, some connected to the main letter with a small "tick", and others free-standing.</p>
