      <p>An S with cedilla is needed for the Turkish language. S and T with comma accent have now their own unicode codepoints:</p>
      <p>Ș U+0218<br>
      ș U+0219<br>
      Ț U+021A<br>
      ț U+021B</p>
      <p>If you use these codes, the diacritics should be always correct for Romanian. Or do you see those glyphs designed incorrectly in any fonts?</p>
