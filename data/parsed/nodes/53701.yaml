      <p>"Maybe things will be better in the (not so distant) future."<br>
      The past indeed was a big part of the problem. For a long time NATO compliance drove character set decisions and Romania was not part of NATO. Later, neither a comma, or any other standard character shape worked in most fonts without using compositing technology dangerously, or adding a whole new set of S contours to add the drawn baby comma accent to. At some point in time, the 256 glyph per font problem made the cedilla look delicious, and I think that's what forced the issue for some, but I'm not sayin' who.</p>
      <p>"I did write the Romanian Institute for Linguistics, so by next year we might get an answer"<br>
      (Even though it's all okay), now don't push on them, just say "Unless we hear otherwise from your esteemed institute, we assume it should be a cedilla." ;)</p>
      <p>Cheers!</p>
