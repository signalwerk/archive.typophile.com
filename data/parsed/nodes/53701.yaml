    <p>I'm starting this thread at the suggestion of Nick Shinn, whose participation in the discussion I anticipate. I made the comment <a href="http://typophile.com/node/53637" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> that many typefaces don't support the <a href="/node/add/wiki?edit%5Btitle%5D=Romanian" title="Create node &quot;Romanian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Romanian</a> language entirely (or rather correctly), by using improper diacritic marks for characters such as ş (and ă and ţ).</p>
    <p>The most common mistake in found in ş. It uses a cedilla instead of a "coma" underneath it (just like a ţ). </p>
    <p><a href="http://kitblog.com/2008/10/romanian_diacritic_marks.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Here</a> is an excellent discussion on the topic, WITH EXAMPLES.</p>
    <p>Since many of the people that participate in these forums are type designers, I just want to signal this problem. Maybe things will be better in the (not so distant) future. </p>
    <p>I'm no expert on the subject. Just an occasionally frustrated user.</p>
