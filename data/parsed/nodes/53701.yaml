      <p>Sorry to keep putting you on the spot, Dan.</p>
      <p>**</p>
      <p>I think a lot of the problem is with applications, not fonts.<br>
      As far as the design of the commaaccent character goes, let me ask you about the typeface on the right.<br>
      It's a neo-garalde with a short descender (Pratt).</p>
      <p><img src="/sites/default/files/old-images/commaaccent_3793.jpg"><br>
      I  deliberately made the commaacent resemble and harmonize with the acute accent, and NOT look like the comma in this face, because,</p>
      <ol><li>It is an accent, whereas the comma is punctuation</li>
      <li>There wasn't enough space to fit in a comma</li>
      <li>It clearly disambiguates from the cedilla</li>
      </ol><p>So, to me it is logical typographic design, but is it orthographically correct that the "commaaccent" doesn't look like the comma?</p>
