      <p>@Nick Shinn, </p>
      <p>You ask why this is an issue. When learning to write, they teach you that ş and ţ are based on the s and the t, but with a comma (the same mark for both). It becomes aesthetically displeasing to look at a s with a cedilla and a t with a comma, when you know they're supposed to be the same (it's my native language, so I admit I'm more sensitive to this than you). Furthermore, in some typefaces, the sizes (and thickness) of the cedilla and the comma differ, accentuating the difference visually. This becomes obvious in words that contain both characters. Here's an example*:</p>
      <p><img src="/sites/default/files/old-images/diacritics_6060.jpg"></p>
      <p>* I have to point out the Adobe Jenson has the s with a comma. I just used it to illustrate my point.</p>
