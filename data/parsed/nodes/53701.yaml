      <p><em>  ... a little too big but it can be scalled about 80%. It will look like the font on the left in your sample.</em></p>
      <p>No, it would have to be scaled down to at least 50%, and made heavier.<br>
      And then, the bold font would be even more difficult.<br>
      In a typeface with short descenders, there is not enough space for a proper comma-shaped accent.<br>
      Here's what it looks like at 50%:<br><img src="/sites/default/files/old-images/commaaccents_5697.jpg"><br>
      This small comma accent is much weaker than the other accents, and is so small that in text sizes it doesn't look like anything in particular, just a smudge.<br>
      But perhaps that's OK. Perhaps it's the price to pay in a short-descender typeface?</p>
