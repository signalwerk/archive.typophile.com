      <p>The 21st century solution I've seen this far is to use the 'locl' feature in  OpenType fonts, using the language tag for Romanian to automatically switch s-cedilla to s-comma.</p>
      <p>A drawback is that your typesetting software must support OpenType <em>and</em> must be language-aware. So support should come from both sides -- font creators as well as software writers.</p>
