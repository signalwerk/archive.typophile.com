    <p>Greater Albion Typefounders have just put a fresh preview of our next release on our <a class="freelinking external" href="http://gatf.wordpress.com" rel="nofollow">blog</a>.  We're still hunting for a name-if you leave a suggestion and an e-mail address in a comment on the blog, we'll forward you a discount voucher code when it's released on MyFonts.Com.</p>
    <p>Have a look and see what you think!</p>
