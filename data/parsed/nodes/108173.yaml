    html: |-
      <div class="comment-spam-body"><p>Hi Hrant.  The purpose of the site is to promote the use of Bitcoin and serve as a one-stop hub for people interested in the Bitcoin currency.  Currently, it is centered around a simple widget that provides real-time price quotes, which is what most people are interested in anyway.  Over time, other widgets and information will be added, but the idea is to keep the design simple.  </p>
      <p>Most visitors are tech savvy and prefer minimalism over fancy design, but I still want to make the site look tasteful--something that has attention to detail but doesn't get in the users' way.  The idea for the "plain" look is probably inspired by reddit (which is where a lot of visitors come from) and, to a lesser extent, craigslist.</p>
      </div>
