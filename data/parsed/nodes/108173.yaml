    <p>Hi all,</p>
    <p>I'm working on this minimalist <a class="freelinking external" href="http://bitco.in" rel="nofollow">bitcoin</a> site and would like some font recommendations.  I think I am happy with Oxygen Mono, which is a Google web font and is used in the tagline under the logo, the first header, the news headlines, and the copyright line.</p>
    <p>But everything else probably needs to be changed, especially the logo font and the "Why bitcoin" paragraph in the middle of the page.  I'm also considering a different font inside the quotes widget itself.</p>
    <p>Any recommendations would be appreciated!</p>
