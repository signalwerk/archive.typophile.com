      <p>Wow, this is interesting. Didn’t mean to start a foveal-fest. Interesting.</p>
      <p>I did mispeak in saying something like Gestalts are themselves atomistic; they form out of elements. Rudolf Arnheim 101. I get that.</p>
      <p>Nevertheless, I think what it comes down to is what, if any, self-consciously scientific explanation of the neuroanatomy of visual perception one happens to buy into, whether because one is just muddling along and saying “Hmm, X makes more sense to me that Y explanation,” or because one is a neuroanatomist or cognitive pscyhologist or whatever and has a career staked on the establishment of one “view” (boo!) or another.</p>
      <p>The thing I object to is this idea that somehow when people read— even when they read quickly— they somehow, it seems that some of you are saying, don’t really “see” individual letters!  I still think, and maybe am a fool to, that Jay, Joy, and Jap, are three different things, and I doubt except when very fatigued or when MISTYPING (which is a whole other barrel of monkey), that I would ever sort of “blur” them perceptuo-cognitively. And they appear different because I am processing the individual parts ALONG WITH the whole, perhaps. </p>
      <p>Nevertheless, there’s no end of intriguing questions at this intersection of skew, bouma, and fovea.</p>
      <p>And this is really interesting:</p>
      <p><em>On the other hand, with OpenType, and with some sophisticated<br>
      linguistic analysis, a font could very well ramp up readability<br>
      by intelligently varying glyphs depending on context.</em></p>
      <p>Now THAT would be cool indeed.</p>
