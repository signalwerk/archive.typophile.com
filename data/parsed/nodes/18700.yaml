    html: <p>CLARIFICATION! I don’t mean to suggest that all roman fonts are strictly “vertical” in terms of their strokes, bowls, etc. I mean in terms of the overall perpendicularity to the baseline. Variations of thick-thin along a diagonal axis is, of course, a property of plenty of otherwise vertical, roman typefaces. I’m referring to those that are slightly off that perpendicular, without looking italic or wackily slanted. I suppose I need an example of what the hell I’m jibbering about.</p>
