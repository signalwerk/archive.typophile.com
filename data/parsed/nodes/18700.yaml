      <p><em>This makes visual wordform resolution a special case of direct pattern recognition</em></p>
      <p>Bah! Humbug! Ok, ok. Yes, I see the perceptual point. But sooner or later it just becomes a matter of semantics— are you seeing a “chicken” or “undifferentiated chicken parts”? If my eyeballs are taking in not a silhouette or outline  but the entire pattern of whatever atomistic elements make up units of vision, and my brain is sorting those into a “word pattern,” then I just don’t see how this is different in any substantive way from saying that the eyeballs are taking in a collection of “letter patterns,” each letter of which is built from the same elemental units, and then my brain is processing these in parallel.</p>
      <p>Obviously, I don’t think it’s completely either/or. But I just cannot buy this idea that we see words as NOTHING BUT unitary Gestalts not composed of smaller components. “Shapes” exist in perceptual hierarchies— they may be constituted of smaller component shapes, and they exist in fields of shapes within which they find themselves, via our perceptions, becoming components of larger shapes.</p>
      <p>I mean, if “the bouma” is so “real,” why both designing type-faces? why not “word fonts”? The closest we get are ligatures and logos. </p>
      <p>- Jay</p>
