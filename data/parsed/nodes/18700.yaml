    html: |-
      <p>I will check out the TYPO stuff, hrant. My initial response, though I know I need to investigate further: </p>
      <p>“serifs”— yes, they make each letter different from every other in more ways than the same letter in a sans-serif font. I.e., more transformations from letter to letter, even among similarly-shaped letters. But why can’t this be explained equally well by parallel-processing of individual letters vs. a bouma model?</p>
      <p>and as for “good letterspacing,” well, I just don’t see how this does any more than distinguish one unprocessed clump of stuff from another. It actually has nothing to do with the shape of each word, but just the division space between. </p>
      <p>and, bouma-tastically:</p>
      <p>how do you process</p>
      <p>   hrant</p>
      <p>different from</p>
      <p>   lmemk</p>
      <p>yes— there are indeed word outline differences, but arent the real KEY differences in h vs. l, r vs m, a vs. e, n vs. m, and t vs. k?</p>
      <p>Anyway, just playing with ideas here. I love this stuff. And I usually find that pushing the devil’s advocate is one way to learn. I was a philosophy major— hard for me to make ANY general claims about ANYTHING. Just meaningless neutrons in the void.</p>
