      <p>After spending a long time reading an italic font, I find that roman always looks like it’s slanting backwards.</p>
      <p>For a typeface, a slant should be decisive, not slight, otherwise it looks like a mistake. However, some individual characters may have “vertical” parts that deviate from true, for overall optical balance.</p>
