    html: <p>THanks for the examples, hrant. Isn’t the very idea of the “bouma” debatable, though? My sense is that the debates is that either (a) we recognize word-outline shapes at first pass, then further refine cognitively, or that (b) we parallel-process individual letters in groups at first pass, then further refine cognitively. I guess the result is kind of the same, and might even perhaps be hypotheses that predict much the same reading behaviors, but strictly-speaking they are different cognitive-perceptual animals, right? Frankly, I don’t believe much in boumas; I prefer (b). But that’s just me.</p>
