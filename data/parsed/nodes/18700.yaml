      <p><em>the judicious use of weight.</em></p>
      <p>Yes, that would be “emphasis”, but I don’t think that emphasis is what is generally meant by switching to italic for a few words. Emphasis is metaphorically a change in volume (more ink, more decibels), whereas italic indicates a change in tonality — another voice, or a different category of name. For instance, “in a study published last year in the journal <em>Antiquity,</em> Hunt, Lipo and Britton Shepardson of the University of Hawaii concluded…” Here, italicization disambiguates, or at the very least eases the traffic jam of a string of proper names. </p>
      <p>Conventions become established because they work. An example is celebrity boldface — blatantly judicious(!) and therefore entirely appropriate for the “coding” it signifies.</p>
