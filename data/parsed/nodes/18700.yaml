      <p>Jay, you said having a few words of ROMAN in <em>italic</em> text weirded you out — which is why I suggested further <em>slanting</em> as a solution to YOUR PROBLEM, rather than toggling back to roman, and stuck with the idea that italicization as a form of emphasis is <em>most noticeably</em> about <em>SKEW.</em></p>
      <p>For the kind of setting where an all-italics sidebar produces a few words of emphasis in roman, that’s usually at the behest of by-the-book editors following style guides. I guess it boils down to who has the final cut, the editor or the typographer. If it’s the editor, they will likely go with “arbitrary” convention. However, typographers are free to come up with new forms of emphasis: one that’s gained status seems to be switching from serif to sans for URLs and code.</p>
