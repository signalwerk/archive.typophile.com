  html: "<p>I know “readiblity” is a very common topic, but I was wondering about this specific issue: is ANY “slant” going to hurt readability in blocks of body text? Roman always seems based on a strict vertical orientation, with a strict horizontal, perpendicular base. I’m not talking about “italics” so much as subtler variations between roman and ital. Any thoughts?</p>"
