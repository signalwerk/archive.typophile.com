      <p>&gt; Why should breaking the whole up be the norm</p>
      <p>Because the results are qualitatively more reliable. Why do you think we never regress back to text that’s been directly foveated? Since the information is there all crisply, and the brain is powerful enough, there’s no reason to rely on the fuzzier (more error-prone) lower frequencies, because no speed is gained. One great thing about this is that it fully assimilates Larson’s model - gobbles it up.</p>
      <p>A good test of this though would be to see if we miss typos that are foveated.<br>
      And if we do, can that not instead be attributed to <cite>letterwise legibility</cite> issues.</p>
      <p>hhp</p>
