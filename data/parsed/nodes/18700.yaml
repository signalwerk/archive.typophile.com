      <p>I thought that Fairfield, with its caption and italic styles, might solve the problem, but it really needs a different angle as a extra differentiator between the two “italic” styles. So I put together this demonstration: the normal Worldwide Italic has about a 10 degree angle, whereas Albany Italic is 20 degrees, and has large “pot-hook” serifs. I inserted Times Italic “i” in to the Worldwide Italic — the horizontal intro serif further serves to differentiate the two italic styles. So far as I know, there are no typefaces that utilize this concept.<br>
      </p><div class="imageWrap"><img src="files/HyperI.png"></div><p></p>
