    html: |-
      <p>From the title of this thread I thought this was about<br>
      Chinese, and I’d started working up a reply in my head!  :-)</p>
      <p>There are two reasons to think that slant harms readability:<br>
      1) People aren’t used to it (in long stretches).<br>
      2) It distorts the boumas readers expect, for example by confusingly offsetting the ascenders and descenders in bouma silhouettes. Our Peter E might be able to throw one of his image-processing algorithms at this and come up with interesting insights (although he’s actually not a silhouette fan for one thing).</p>
      <p>Fonts with less slant presumably suffer less, although they can have another problem: especially at small sizes and/or bad output conditions, the difference between Roman and Italic can fade. BTW, this is why the so-called “upright Italic” style can’t work as an Italic (which is why I prefer calling it “cursive Roman”).</p>
      <p>Some notable slightly-slanted Romans:<br>
      Syntax (1/2 degree)<br>
      Rialto (1 degree)<br>
      Seria (variable, ~1 degree)<br>
      Flora (~2 degrees?)</p>
      <p>In Nour&amp;Patria, the slant (in Nour’s Armenian and subordinate Latin, and its Latin italic) is 1/16*, which is about 3.6 degrees. This seems to be the least slant one can safely have (in a text face). I think it’s safe enough that Nour’s subordinate Latin (codenamed Harrier)** can be used for setting a (short) book.</p>
      <p>* In digital fonts I think it makes more sense to use integer slopes<br>
      instead of degrees. The latter is a pretty arbitrary measure, while<br>
      the former allows easy control over slope segments.</p>
      <p>** <a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a></p>
      <p>—</p>
      <p>&gt; If anyone knows Kevin will.</p>
      <p>Assuming his empirical methods (or to be fair, anybody’s) are good enough.<br>
      They don’t seem to be (although still, “he’s our only hope”).</p>
      <p>BTW, I think Randy is working quite seriously on semi-serifs too.<br>
      They rule.</p>
      <p>hhp</p>
