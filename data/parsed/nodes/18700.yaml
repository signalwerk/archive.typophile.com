      <p>“Meaning”… those sound like example of arbitrary typographic conventions. Italics does, though, convey something like “emphasis” (at least in an impressionistic sense), if you have any <em>idea</em> what the <em>hell</em> I’m trying to say. :-)</p>
      <p>Then again, those are arbitrary conventions, too. Except that the forward “thrust” at least mimics the forward thrust of breath when we HEM-phasize our words.</p>
      <p>Also, just to run with this a bit: titles of books, in traditional, Western (American?) texts like books are <em>often</em> but not <em> always</em> italicized. In newspapers, magazines, etc., you see single or double quotes around those exact same kinds of titles.</p>
      <p>And there’s a historical dimension, too— note all the wacky uses of italics and caps in early American (i.e., British colonial) writing that persisted up through the early 20th c.</p>
      <p>Nick Shinn, a <em>Typophile</em> and master of many Trades, may <em>disagree</em>, but that is the Beauty of <em>Discussion</em> and <em>Debate</em>.</p>
