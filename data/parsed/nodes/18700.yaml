      <p>“I just don’t see how this is different in any substantive way…”</p>
      <p>The different schemes predict different processing routines at the neuroanatomical and visual cortex level, and because of that make different predictions about what’s important at the level of type design and typography, and why. For instance, Kevin Larson predicts wider interletter spacing is better; I predict a rhythmic spacing which frustrates letter recognition is better; I am unclear where Hrant stands: tighter than rhythmic?</p>
      <p>If you want to push beyond intuitive and ad hoc judgements about readability and verticality, no matter how craft-based your intuitions might be, you’re going to have to go there. Most type-involved people are sufficiently confident about their intuitions and the craft knowledge of the ages to not want to or need to. Going there is like entering a labyrinth.</p>
      <p>I happen to be interested in all this because I want to see if craft knowledge has a robust ‘perceptual processing in reading’ foundation or if it’s foundation is cultural historical precedence or personal aesthetic preference.</p><div class="imageWrap"><img src="files/"></div><p></p>
