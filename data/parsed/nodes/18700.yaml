      <p>The question(z) I have for the Bouma Maker Masters are: if you demote the “letter-by-letter” and “words-by-words” approach to “nyet” how come you can not compress this text by 50% and still “have a good time”, much less improve speed with shorter boumi to zippo thruo?, How do Germans “Do It”?, How do our new words come easy? (both the new ones we Learn, and the new 1s we Make)? and what is a child in this theory, and when does it become Boumawara?</p>
