      <p>Jay, try to think of bouma shape in whole-word pattern terms, not in envelope-structure or silhoutte terms. In other words, try to think of the whole word as a pattern of whites (counters, inter-letter spaces) and blacks (stems, bowls, diagonals) whose visual integrity as a unit is more overpowering than the identity of the component parts.</p>
      <p>This makes visual wordform resolution a special case of direct pattern recognition (perceptual, white + black based), not a case of letter-recognition mediated word-identity computation. (In the later scenario the letter recognition part is perceptual, and black-specific, the computation part post-perceptual. This route is less direct.)</p><div class="imageWrap"><img src="files/"></div><div class="imageWrap"><img src="files/"></div><div class="imageWrap"><img src="files/"></div><p></p>
