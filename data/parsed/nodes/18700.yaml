      matter of your impressively early epiphany:</p>
      <p>&gt; why both designing type-faces? why not “word fonts”?</p>
      <p>Bingo.</p>
      <p>But there are two good reasons to make individual letters:<br>
      1) It’s easier, both in terms of manpower and technology.<br>
      2) You always still need the individual letters.</p>
      <p>On the other hand, with OpenType, and with some sophisticated<br>
      linguistic analysis, a font could very well ramp up readability<br>
      by intelligently varying glyphs depending on context.</p>
