      <p>&gt; Isn’t the very idea of the “bouma” debatable, though?</p>
      <p>Of course.</p>
      <p>One thing though: boumas aren’t necessarily whole words. Essentially they’re letter clusters, deciphered as wholes thanks to frequency, distinctiveness, the experience of the reader, the semantic context of the text, the clarity with which it’s seen (how close to the fixation point*) and yes, word boundaries as well.</p>
      <p>* In fact the decipherment of single letters -which is indeed the norm in the fovea- can be seen as a special case of bouma decipherment. But the more experienced the reader (to me the prime target of improving readability, because the rest is mostly just legibility, a different -and simpler, if only pragmatically- problem) the more important the -blurry- parafovea is.</p>
      <p>&gt; I don’t believe much in boumas</p>
      <p>Well then you owe yourself another explanation as to why<br>
      serifs and good letterspacing (just to name 2 things) matter.</p>
      <p>BTW, if you haven’t already, you might get<br>
      yourself a copy of issue #13 of TYPO magazine,<br>
      where three rival viewpoints are presented.</p>
      <p>hhp</p>
