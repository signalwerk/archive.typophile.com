      <p>Hrant, you said earlier “the decipherment of single letters—which is indeed the norm in the fovea—can be seen as a special case of bouma decipherment.”</p>
      <p>The Dutch have a word for what happens in the fovea: ‘scherpstelling’, literally ‘sharp-rendering’. In the immersive reading of the experienced motivated reader, what is ‘sharp-rendered’ in foveation? Just the fixated letter or the parafoveally pre-indexed whole now filling the attentional window? Why should breaking the whole up be the norm in the fovea when breaking it up is inhibited by cross-letter binding in tight spacing? Breaking it up—the decipherment of single letters—only happens in reading aquisition and ‘adaptive learning’ (the adaption to unfamiliar words). Or do you mean to say that foveation is only important in reading acquisition and adaptive learning?</p><div class="imageWrap"><img src="files/"></div><div class="imageWrap"><img src="files/"></div><div class="imageWrap"><img src="files/"></div><p></p>
