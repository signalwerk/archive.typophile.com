      <p>And in the realm of writing in universities— MLA, APA, Chicago, etc., etc.— they all change every couple years, and that wreaks havoc on our efforts to teach students about documentation styles, from the freshman to the grad students who are trying to learn what they need to know to be editors (not defending editors— it’s all just part of the system!). </p>
      <p>Much easier in the old days, from the writer’s perspective anyway: type it up on the ol’ typewriter, double-space it, underline stuff you want in itals. Then, I guess the typesetters and editors hash it out from there…</p>
      <p>And then there’s LaTex. It really “wows” at first, and it does help people get their equations formatted for small journal presses and the like. And Knuth certainly is a major genius. But it renders the whole art of typography kind of void of meaning, unless you’re an uber-geek who can tame it to do what you really want.</p>
      <p>I sympathize, even if I’m propped in an ivory tower (well, around here, it’s more like a crumbling concrete tower…). I’m an artist by nature (and by a very small amount of training). I friggin’ love this stuff, as I’ve said, because it makes my brain cells boogie in all kinds of interesting directions. Thanks again for the suggestions above.</p>
