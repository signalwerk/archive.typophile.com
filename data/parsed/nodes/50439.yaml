    <p>I saw this interesting new hybrid-esque face in use on the doors at a Dunkin' Donuts in Rhode Island. I didn't see it anywhere else in the store and haven't seen it since. I'm presuming it's a proprietary Dunkin' Donuts face, but was curious if anyone else knows any more details about it (who designed it, when, etc):</p>
