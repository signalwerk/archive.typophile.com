  - id: 494102
    user: 1262
    date: 2012-02-06T14:59:00
    date_raw: 6 Feb 2012 — 2:59pm
    votes: null
    html: <p>My apologies for the delayed follow-up on this question. I saw Fiona in the UK recently, and she gave me specimens of two closely related Linotype nastaliq designs, Sheeraz and Qalmi, both designed by Tim Holloway. Having compared these specimens to the image you posted, I am able to determine that the type on the back cover of your book is Linotype Sheeraz. Linotype Qalmi, which was released a few years later, was created in response to feedback on Sheeraz provided by Urdu newspaper publishers. Qalmi has a slightly less steep lettergroup angle, and stronger hairlines with less overall stroke contrast.</p>
