    html: <p>Yes, these are definitely by Tim Holloway, working closely with Fiona Ross, then at Linotype-Paul in the UK. Sheeraz was published in 1987 and Qalmi in 1994. I also have a copy of the patent documentation for Linotype's nastaliq layout mechanism, the originals of which are now in the non-Latin archive at the University of Reading, along with Tim's original drawings.</p>
