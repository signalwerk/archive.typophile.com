    <p>Hello Typophiles,</p>
    <p>I am a frequent reader of the Typophile forums, but this is my first post.</p>
    <p>I have an Urdu book, the back cover of which has some lines of text set in a peculiar nastaleeq font (see the image below). I remember when I was a kid (early 90's), I used to read a children's magazine that also utilized this font for typesetting its stories. Reading around the Web (and the Typophile forums), I have come to believe that this font may be Linotype Qalmi, the font designed by Tim Holloway.</p>
    <p>Can any of you confirm if my guess is correct? If not, can anyone identify which font this really is?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/awaz-e-dost-back-cover_6624.jpg"></div><p></p>
