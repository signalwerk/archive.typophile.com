      <p>Thanks again, John. I had completely ignored Sheeraz while taking my guess.</p>
      <p>By the way, if it's not too much trouble, could you post the specimens that Fiona Ross gave you? After years of seeing Noori Nastaleeq virtually everywhere (at least here in Pakistan), I find Tim Holloway's designs very refreshing. (Even the book that sports Sheeraz on its back cover is otherwise set in Noori.) For me personally, it would be very interesting to compare Noori with Qalmi and Sheeraz, and learn about the intricacies of overall nastaliq type design.</p>
