    html: <p>I agree about the 4 &amp; 7 - they have a nice flow. What about letting the charcaters come out of the implied box you have them in. The W is wider than the L - but what about height? Most of the letters are constrained in that way. The 8 needs some room i think. The B too. What if you built the letters from something physical as part of the exercise - like black tape? I think the M would come out differently if you did that. That G needs fixing!</p>
