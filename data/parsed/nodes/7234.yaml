    html: <p>Gee, I hope someday that I can tell that an idea is not worth bothering with just five letters in. It'll save <br>me so much time. <br> <br>In the meantime, I'd suggest that you try to do at least a few more letters, and see what happens  <br>when you combine the in different orders. I'd say that right now, the idea might be a bit rough, but I  <br>don't think that's a reason to scrap it and begin from scratch. See what you can do with it first. <br> <br>But do be prepared to scrap any or all of these in the name of going where your font ideas take you.  <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
