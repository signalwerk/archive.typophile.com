    html: <p>I would see if you have 2 oe 3 or 6 additional ideas about how to do each character &amp; see if even better stuff emerges. I would look for crazier &amp; also more conventional shapes - both. Right now I don't get as clear a direction from it as I would like - the feeling of being totally wack &amp; out there - which would be cooler or a bit more usable which might also be cooler. <br> <br>The Wackest letters to me are the X &amp; the R. They don't appologize at all. I like that.</p>
