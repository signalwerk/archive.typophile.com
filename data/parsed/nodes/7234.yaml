    <p>Hello <br> <br>This is my first post, however I have been visiting these forums for a while. I will just start by saying I am a third year graphic design student who enjoys typography despite a lack of proper training. <br> <br>Below I have posted a typeface I have spent some time on. It started as a rough sketch for a logotype (not the one shown in the book) and I decided to make  a set of uppercase charactes for it. The theme was futuristic, and the inspiration was the digital face you find on LED clocks. I wanted a fairly bold forcefull look to it also. <br> <br>The book shown is one I made for a years worth of graffiti by local artist Sytak hence the name Sytak'03. <br> <br>I would appreciate your unvetted criticism. <br> <br>Cheers Jimmy C <br> <br> <br> <br></p>
