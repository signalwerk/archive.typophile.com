    <p>A friend asked me if I knew where to find ITC Grouch, but I found out that that font is not available for lisencing due to some dispute, between Bitstream and Monotype, I believe. But after some months that Herb Lubalin design just creeped back into my head, so I had to do my take on it.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/grumpy_5078.png"></div><br>
    What do you think? It's heavier than Grouch, and proportions differ as well from the original. But I'm pretty happy with the counter forms.<p></p>
