    html: |-
      <p>I do think there's demand for this type of font.<br>
      Letters that are working especially well to my eye include /S/A/q/e/v/<br>
      I'd consider raising /G/'s crossbar, or dropping/enlarging the top serif, to close the aperture.<br>
      Lower counter of /a/ looks small and kind of sad.<br>
      /x/ and /z/ are too wide.<br>
      /g/ is narrow and light (not an easy puzzle to solve at this weight, of course). I'm not usually a fan of that "Tomi g" but it fits the style perfectly in this case, if you can get the weight and width to work.<br>
      That big slant of the head serifs, when it appears at the midline, makes letters like /u/m/p/r/ look kind of stepped-on. Perhaps it's just a matter of raising those stems further into the overshoot zone.<br>
      Did you try putting the bilateral serif on the first stem of /m/ instead of the middle one? The one-way serifs on /h/ and /n/ work well.<br>
      /s/ may be light.<br>
      Should /R/'s leg be a little thicker?<br>
      Should the crossbars of /f/ and /t/ be thickened a bit?<br>
      Maybe add some weight to the serif of the middle arm of /E/ and /F/.<br>
      /U/ looks narrow. /Y/ looks a bit high-waisted. /N/'s diagonal needs more weight.<br>
      I'm not sold on the /Q/'s tail.<br>
      I wonder if at some point you'd want to chamfer those acute angles.<br>
      Keep up the good work!</p>
