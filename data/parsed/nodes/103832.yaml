    <p>Hello all</p>
    <p>Slightly odd question; I'm going in cold to a client briefing for a redesign of their annual research publication. Currently they use a combination of Umbra for headers, Swift for body and Verlag for anything else.</p>
    <p>My understanding is they want a major overhaul but I don't know where they want to go typographically - so I'm fishing a little.</p>
    <p>Can anyone make some alternate suggestions, pairing options or suggest contemporary 'versions's or fonts inspired by the above? I'm anticipating they may want to keep one or more to maintain branding - so if they retain Umbra (which is a big statement font) can you recommend options to pair with it?</p>
    <p>Any thoughts gratefully received!</p>
    <p>thanks</p>
