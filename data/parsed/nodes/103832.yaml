    html: |-
      <p>yep taken onboard. Thinking here is really if they say we want to keep one of the set, my question is why change any of the others? The design is very much based on the use of the shadow of umbra (i.e. the sheared serif of swift) and the graphic elements are all based on that - so I wanted to have a convincing argument to make wholesale changes.</p>
      <p>My thoughts at the moment is that given the art deco feel of the current set we move them on to the next decade of style fonts. I was thinking maybe an inline font like (H&amp;F's) landmark might be one way forward.<br>
      Thoughts?</p>
