    <p>Hi<br>
    I’ve been using fontographer for a decade now, been through classic, waiting for osx, finally osx version by FL, but what now. Should I keep waiting for FL to upgrade Fontographer or is it time to switch to FontLab? I know it’s a question of taste and use, but is there hope for a Fontographer update (OT and bug fixes).</p>
    <p>The reason, more people are asking for my fonts in OT format. Converting is an option, but creating is out with only 256 char. set in Fontographer.</p>
    <p>Or is this just oldskool hanging on to Fontographer?</p>
    <p>Thoughts anyone?</p>
    <p>Hans<br>
    __________________________________<br>
    It’s not where you go, it’s what you bring back…</p>
    <p><a href="http://www.fontourist.com" title="http://www.fontourist.com">http://www.fontourist.com</a></p>
