    html: <p>FontLab has been the king of font production for some time now. How long exactly? Four years? Five years? Maybe a lot longer than that? If I were you, I would switch. Upgrading won’t make you a better designer by any means, but it will allow you to get your fonts out onto today’s market much quicker.</p>
