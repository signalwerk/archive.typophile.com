      <p>Hello everyone,</p>
      <p>Seems to be the right time and location to announce this: I am currently halfway through the layout of an upcoming book about Roger Excoffon. The book will focus on Excoffon's life and achievements, and will also contain memories, recollections and essays from his friends and admirers, such as Peter Knapp, Jose Mendoza y Almeida, Hrant Papazian, Jean-Francois Porchez, Massin, Yves Perrousseaux, Francois Richaudeau, et al. It will be filled with high quality illustrations, rare documents and photographs, and the text will be in french and english.</p>
      <p>The book, "Roger Excoffon, gentleman &amp; typographe", is due to be released around spring 2011 at Atelier Perrousseaux (<a href="http://www.perrousseaux.com" title="www.perrousseaux.com">www.perrousseaux.com</a>).</p>
