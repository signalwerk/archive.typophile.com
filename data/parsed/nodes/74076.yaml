      <p>Anyone in London on 26 October within reach of the St Bride Library might find it worthwhile to attend the following event at 7 pm:</p>
      <p>This year marks the centenary of the birth of Roger Excoffon, arguably the most famous and innovative French type designer of the 20th century. For the 2010 Beatrice Warde Memorial Lecture, Sébastien Morlighem will share his research on Excoffon from the past three years, as an introduction to the forthcoming book <em>Roger Excoffon et la Fonderie Olive </em>(Bibliothèque typographique). The lecture will be an opportunity to unveil many previously unknown documents and to discuss several aspects of his work for the Fonderie Olive.</p>
