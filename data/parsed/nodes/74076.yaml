      <p>I had no idea Mistral was so widespread in France!</p>
      <p>I must admit (with some guilt) that I tended to dislike most of Excoffon's typefaces until I saw <a class="freelinking external" href="http://channel.walkerart.org/play/process-type-foundry-minneapolis/" rel="nofollow">this lecture</a> given by Process Type Foundry, where Eric Olson talks (near the 23 minute mark) about the beginnings of Excoffon's Antique Olive. Becoming aware of how well Excoffon's typefaces had been used in the past made me appreciate them. I still cringe when I see mercilessly distorted Antique Olive and Banco though.</p>
