  html: |-
    <p>A friend, who is by no means a typophile, brought to my attention this article from the culture blog of The Economist. It's about the centenary of the birth of <a href="/wiki/Roger%20Excoffon" class="freelinking" rel="nofollow">Roger Excoffon</a>, the great designer of the types Mistral, Banco, and Antique Olive, among others, and the man who gave Air France its trademark look in its heyday. To my French colleagues who were, apparently, oblivious to the event, I say "honte à toi! Honte inexpiable!"</p>
    <p><a href="http://www.economist.com/blogs/prospero/2010/09/mistral_font" title="http://www.economist.com/blogs/prospero/2010/09/mistral_font">http://www.economist.com/blogs/prospero/2010/09/mistral_font</a></p>
    <p>Scott-Martin Kosofsky</p>
