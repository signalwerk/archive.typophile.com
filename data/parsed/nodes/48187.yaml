      <p>After a good night of sleep and some further thought, I have to say I find your argument to be about 30 years too late . . .</p>
      <p>Case in point, you're suggesting the equivalent of farmers no longer using modern farming equipment and rather going back to the horse and plow so they can be TRUE farmers . . . It's ridiculous . . .</p>
      <p>I must admit, I do have a Filmotype machine and could certainly sit down and set myself a masterful headline that I'm sure I'd have to clean up, wax, and stat to get it perfectly but why? It's old technology, it had a real purpose many many years ago but the effort to reproduce headlines in that manner is obsolete as of 1984.</p>
      <p>I make the point that whether you like progress personally or not, the tools to set type have move forward as demand has come to meet them and now folks who have little background in lettering or calligraphy can be as masterful as Herr Zapf just by sitting down to craft a letter in Word using the Zaphino font . . .</p>
      <p>Further, take a look at the latest release from House Industries, Ken Barber's masterful Studio Lettering types which could potentially have the tagline, no human required. . . That is to say, the fonts have been so mastered in OT at such a macro and micro level that they 'set themselves' requiring almost no input from the person setting the type other than the typing of the words . . .</p>
      <p>This clearly refutes your point. . .</p>
      <p>The creators of these fonts and products want to make BETTER products, nay the BEST products they can . . . Products in which the end result can be controlled as masterfully by the developer as they allow the audience of these products to create with . . .</p>
      <p>You must understand, I never sat down and said to myself, let's think of a new plug-in idea to make a buck with . . . I said, How is this look possible? What makes it look like that? How could it be done? And what about that small gap of ink between the center and the outline? What is that?</p>
      <p>My seeds of inspiration were focused on re-creating the aesthetic to solve MY needs and it seemed to make sense to bring it to a larger likeminded audience . . . Several comments posted above are proof of this . . .</p>
      <p>In fact, had you actually READ the announcement at the very top, you'll see clearly my rational for the product . . . We have become masters at printing . . . No longer are we limited by shoddy equipment, crappy ink, fiberous paper, and bad pressmen . . . Printing has so far surpassed so many of these problems that it has become sterile, lifeless . . .</p>
      <p>The only way to re-create these effects is to buy and old press on eBay strip up some plates, over/under ink them and misalign the plates . . . For all designers, this scenario is almost never likely to happen again which is why I created the plug-in . . .</p>
      <p>And stand corrected mate, I don't know a line of C++ and in fact did rather poorly in Math in school, it was developed in Russia by a very talented programmer and we collaborated on the effects . . .</p>
      <p>If you wish to espouse the virtues of being the luddite you wish all graphic designers to be, you should have handwritten your grievance and postal mailed it to the Punchcut gang to scan and post . . .</p>
      <p>Your commentary is wasted on this thread, write a book or go away . . .</p>
      <p>Regards,<br>
      Stuart</p>
