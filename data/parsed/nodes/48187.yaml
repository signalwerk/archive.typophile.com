      <p>its fine, you take from it what you will thats your prerogative as the person who i now realise I am commenting on.</p>
      <p>I am simply commenting on the pure accessibility of this product and how one can become a 'designer' just by applying an ill considered/ tick box like process of applying a texture or patina to any given work an 'effect', simply thinking that is what people expect,.. people dont know what they want thats what graphic designers do they FIND OUT or at least try.</p>
      <p>Theyre not suppose to pick from a drop down box with with limited choices, when i say limited i dont care if you made ten billion templates, this is NOT what is needed by anyone...only by that of selfish business and solely monetary inspired projects.</p>
      <p>as i said above I am aware you have spent a long time on this and you obviously ARE aware of how design is applied/ how it works within certain processes hense the scale of detailing AND research you and who ever has put into this, its amazing really.</p>
      <p> What I do not get is WHY you have applied your knowledge and know-how to such a self demising product, you are damaging the role a designer plays and its importance AND reputation....</p>
      <p>Exactly what i am saying is, surely the role of a designer is not become part of the consumer black hole of poorly perceived perspectives and materialism...</p>
      <p> WE are the start of the chain, now when WE dont put the time effort into our work this is when communication/knowledge/education and basic understandings warp, deteriorate  AND this gets perpetuated through human weakness for conveniences and comforting products/services and eventually becomes the downfall of us all...</p>
      <p> Now real graphic designers will not opt for this product and wont do for the reasons i shall list below, but like i said before this now makes it accessible to cheat and skip research and the effective process to fully design the communicative devises we all deserve to experience. Which are the key traits of business, and big business at that.</p>
      <p>Essentially you are shooting us ALL in the feet, the hands, and our heads.</p>
      <p>This perpetuates dishonesty, trust AND integrity, which as graphic designers/ visual communicators we should be shining bastions of. As we are apparently the educated and sponge like creatures who do whats best in terms of presenting and informing the status quo.</p>
      <p>Communication is something that should be experimented with but you should consider the implications before going forth with and not for ones selfish reasons only. Graphic design is not for the selfish, it affects EVERYONE. ITS IMPORTANT Bottom line, it promotes laziness and distances the designers mind from what is QUITE A REAL WORLD and its REAL responsibilities that should be realised within this industry. </p>
      <p>Im just fed up with people using parodic and pastiche like methods to achieve ANY form of communication its stale and nonsensical in the context of graphic design/ visual communication  in 2008</p>
      <p>Computers are amazing tools, but you are bastardizing the true meaning of what it is to be be a visual communicator / designer and you are helping others jump on the band wagon that has been created by scholars, professors, philosophers and doctors that have dedicated their whole life's to writing books and teaching us to communicate.</p>
      <p>I would apply what I have just said to:</p>
      <p>educators<br>
      journalists<br>
      politicians<br>
      designers</p>
      <p>My comments regardless of the graphic connotations arnt meant to be offensive, it just helps me at least assert my disgust.</p>
      <p>as for having apparent status and bodies of work, you sir are appearing quite ignorant.  This IS the internet and you seemed to have lost your self in remembering one can play under any guise or pseudonym they wish. And one is no greater than the other in this industry, when industry set their own benchmarks these are non-comparable to those benchmarks that are by the human race and what is actually needed.</p>
      <p> You are a cliche of a human being, and should not be allowed to practice within the pellucid hemisphere that is visual communication.  </p>
      <p>oh and fair play on steven heller ,.. but david carson...?</p>
      <p> that sums it  up for me both in taste and understanding...</p>
      <p>I didnt realise this place was an arse-licking arena, for cretinous introverts. ,....</p>
