      <p>im talking about the scientific experiment to find out what this thing we call black matter is.</p>
      <p>anyway, over 1000 scientists and contributors from every part of the scientific community came together to try and achieve something bigger and better than our ancestors did. </p>
      <p>Just because their goal is clearer and more black and white, it doesn't mean within this industry things cannot achieve the same level of understanding and progress, and even the wanting for progress.</p>
