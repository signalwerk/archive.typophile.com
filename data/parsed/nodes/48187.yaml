      <p>Respectfully Anthony, I'm not sure what you're commenting on . . .</p>
      <p>If you want to stand on a soapbox and piss all over a new product because you don't care for it, fine . . .</p>
      <p>As the guy who co-created it, I personally feel as I do with the line of Machine Wash filters that this product does serve a unique purpose in the world and those who don't wish to use it certainly can try to employ their own techniques to recreate these effects.</p>
      <p>With anything, tools are tools be it fonts, plug-ins, you name it, and designers are free to choose the appropriate tool for the job.</p>
      <p>This is a tool I created . . . What have you created Anthony other than an opinion to share? We spent over 2 and a half years developing this product, you spent all of 3 minutes forming an opinion to share . . . Don't assume any part of this effort was dashed off to make a quick buck . . .</p>
      <p>If you want to shame the state of design, head to Speak Up and engage in high design talk but don't insult the product or the audience without some idea what you're talking about . . .</p>
      <p>I may be offended if you were somebody respected in the design community such as Steven Heller or David Carson or even the head of your local AIGA chapter, but you have no status or body of work to defend your comments on and I can only assume your offhanded remark is uneducated and misinformed as best since the design community doesn't report to you . . .</p>
      <p>Regards,<br>
      Stuart</p>
