      <p>I'm usually quite a snob about design and type. Hrm. Scratch that I'm always a snob about design and type. But, that said I think that Stuart has created another creative tool—correctly defined—which designers can use. </p>
      <p>I think the problem starts when people generalize about the plethora of plug-ins available today. There is a ill-deserved knee-jerk reaction when someone finds out you've used a filter. If budget allows then by all means it is more fun to go the DIY route. But what is wrong with using a tool judiciously?</p>
