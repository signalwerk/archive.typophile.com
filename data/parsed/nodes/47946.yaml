      <p>I think the bottom left is an S? Or a seashell? No idea what the top left is.</p>
      <p>I certainly don’t understand how the creativity/composition concept is visually represented.</p>
      <p>I’ve done so many jobs for this type of client - its so much more difficult than you initially think. You need to do some competitor analysis - look at what others are doing in this sector. I suspect you’ll find Its dull variations of sameness. That could be a basis for communicating creativity - stand out. Is there likely to be a marketing budget/strategy? </p>
      <p>Also - ’Creativity’ is not a comfortable word for the software services industry, they find it messy - You need to be looking at ’innovation’ (but it MUST have tangible results).</p>
