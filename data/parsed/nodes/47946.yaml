    html: |-
      <p>Only the bottom right design connotes programming but it’s almost the first solution comes to someone’s mind so I’m sure there are many similar out there. Why not just write “Scribendum.com”? No need for two lines. Better to write “Scribendum” on its own.</p>
      <p>Beware of so called “competitor exploration”. Many books and people recommend it for inspiration which leads to look-alike solutions everywhere. Try to do this in reversed order. Explore your  subject well, write down some concepts and then explore competitors. Throw away the concepts already realized and focus on the rest. Programming is a relatively new profession and I’m sure you can find unique ideas.</p>
    html_clean: |-
