      <p>You're missing a lot of the basics.</p>
      <p>I'm not sure this is the right place to get them, but first of all, have you made an OpenType font, or a PostScript Type 1 font?</p>
      <p>For ligatures to work in OpenType, you have to write a "feature" program, as John was describing, then any application that supports OpenType will support the basic features, like automatic ligatures. For Type 1 fonts, some applications programs  can be instructed to switch the fi and fl ligatures on, other can't. For programs that don't have a ligaturing switch (Photoshop is probably one) you have to call them directly by a keyboard command. </p>
      <p>I haven't tried it but I'd imagine FontLab's *preview* won't generate the fi and fl ligatures automatically with a Type 1 font. With an OpenType font, yes, if you've written &amp; complied the appropriate feature.</p>
      <p>Another way of making this point is that fonts are now software, and that "software" extends beyond just drawing the characters. I think it very wise of you to begin to get a handle on fonts, but it involves more than graphic design.</p>
