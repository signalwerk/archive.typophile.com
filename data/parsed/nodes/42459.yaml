    <p>I'm currently a student majoring in graphic design--more particularly 3D visualization/animation--but type is an integral part of my daily routine. I decided to involve myself more with the process of creating typefaces to better understand their purpose.</p>
    <p>Right now, I'm currently doing my first design off of my handwriting. I figured it'd be an easy exercise as opposed to redeveloping Univers or something. I have all the letters, numbers, symbols, etc., placed and kerned properly so they are writing. The problem I'm having is getting ligatures to work.</p>
    <p>To make clear, I understand the purpose of ligatures and the vast amount of them there can be. Most of the discussions I searched for here on the forum seem to involve those notions in one way or another. My trouble is that when I have f_l in Fontlab, when I go to type out fl the ligature does not appear. </p>
    <p>This is most likely due to my own naivety with the program as a novice and was thus wondering if I could get some basic help.</p>
    <p>Here is a panagram of what I have, it is fairly close to my handwriting, but I'm interested in adding more 'connective' ligatures like th, letters I commonly hook together.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hand_6008.jpg"></div><p></p>
    <p>Any help is very appreciated.</p>
