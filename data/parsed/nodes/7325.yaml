    html: <p>As for Flash detection, yes, you should always detect for it.  <br>However, I'd argue that the need is becoming less and less (for  <br>mainstream audiences) to build both Flash and non-Flash  <br>versions. <br> <br>I agree that Flash is still largely used incorrectly - which doesn't  <br>make the use of Flash right or wrong. It just means you should <br>use it for what it does best. <br> <br>Regarding screen readers and PDAs. This has opened up so  <br>vastly in the last 2 versions of Flash (roughly 2 years) that Jakob  <br>Nielsen, Flash's one-time nemesis, now fully endorses Flash,  <br>provided it's built within standard usability guidelines. The list of <br>improvements include standard interface elements (widgets) that <br>behave like browser widgets - drop down menus, pull-downs,  <br>tab-enabled forms, selectable text (which means machine  <br>readable text), etc, etc. <br> <br>When we recently redesigned the fStop home page, we left out  <br>the Flash gimmicks and built in some smart tools that allow the  <br>fStop admin people to quickly update the content without the  <br>need to either know Flash or use a content-management system  <br>(CMS). ( <a href="http://www.fstopimages.com/" target="_blank">http://www.fstopimages.com/</a> ) <br> <br>When we designed our own site, we deliberately blurred the lines  <br>between Flash content and HTML content so that users cannot  <br>immediately tell what is Flash and what is not. This required  <br>using a system font (Arial) for all body text in and out of Flash,  <br>but it's a good compromise that provides a seamless look.</p>
    html_clean: <p>As for Flash detection, yes, you should always detect for it.  <br>However, I'd argue that the need is becoming less and less (for  <br>mainstream audiences) to build both Flash and non-Flash  <br>versions. <br> <br>I agree that Flash is still largely used incorrectly - which doesn't  <br>make the use of Flash right or wrong. It just means you should <br>use it for what it does best. <br> <br>Regarding screen readers and PDAs. This has opened up so  <br>vastly in the last 2 versions of Flash (roughly 2 years) that Jakob  <br>Nielsen, Flash's one-time nemesis, now fully endorses Flash,  <br>provided it's built within standard usability guidelines. The list of <br>improvements include standard interface elements (widgets) that <br>behave like browser widgets - drop down menus, pull-downs,  <br>tab-enabled forms, selectable text (which means machine  <br>readable text), etc, etc. <br> <br>When we recently redesigned the fStop home page, we left out  <br>the Flash gimmicks and built in some smart tools that allow the  <br>fStop admin people to quickly update the content without the  <br>need to either know Flash or use a content-management system  <br>(CMS). ( <a href="http://www.fstopimages.com/" target="_blank" class="link-external">http://www.fstopimages.com/</a> ) <br> <br>When we designed our own site, we deliberately blurred the lines  <br>between Flash content and HTML content so that users cannot  <br>immediately tell what is Flash and what is not. This required  <br>using a system font (Arial) for all body text in and out of Flash,  <br>but it's a good compromise that provides a seamless look.</p>
