    html: <p>If you're target audience is graphic design geeks like us, then Flashturbate all you want.  <br> <br>Otherwise, you need to put it all in the context of your usergroup. Flash is rarely an improvement to the overall end-user experience when we're talking your average online consumer, or news site, etc. It can enhance the experience of certain types of sites...teen marketing, movie promos, etc. <br> <br>If you ask yourself the basic question 'WHY is a person coming to this site?' it usually answers the Flash question. If that doesn't, then look at the accessibility issues (for those with screen readers, PDAs, corporate networks that block flash, older browsers, and folks that just hate flash). Is the benefit of the flash outweigh the percentage of lost audiene? <br> <br>Like Helvetica, Flash is best when used in moderation, IMHO.</p>
