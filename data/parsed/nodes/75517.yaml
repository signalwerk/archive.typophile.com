      <p>Can I inquire as to *why* you want that style? Departing from "normal" letterforms for the body text of a novel will be jarring to the reader.</p>
      <p>Moreover, those letter forms as alternates in serif typefaces were not adopted for reading purposes, but for teaching young children to *write*. All the available evidence is that they are in fact less legible. Plenty of publishers and designers are confused about this, but that doesn't make them right.</p>
      <p>Cheers,</p>
      <p>T</p>
