    votes: null
    html: |-
      <p><em>“Reading research is not a good basis for typographic design decisions.”</em></p>
      <p>There we disagree. Now, aesthetics are hard to measure, so there are plenty of distinctions that are not easily made in research that still really do matter to art (or even craft). But anything that reading research tells us <strong>does</strong> matter, we should probably be paying close attention to.</p>
      <p>Ligatures is an interesting example. Today, people using professional typesetting tools have to go out of their way to turn ligatures off. Yet this is commonly (though not universally) done in children's books. It would be very interesting to see some research on whether children find ligatures confusing, and at what ages or stages of learning to read. As far as I know there has been no research on the subject. I mentioned this briefly in my talk at TypeCon.</p>
      <p>Cheers,</p>
      <p>T</p>
