    html: |-
      <p>“…<em>but generalizing to situations where the variables are otherwise is shooting in the dark</em>.”</p>
      <p>You are speaking of the pros and cons of experimental designs that have either <a href="http://en.wikipedia.org/wiki/Internal_validity" rel="nofollow">internal validity</a> or <a href="http://en.wikipedia.org/wiki/External_validity" rel="nofollow">external validity</a>. While highly controlled laboratory environments may not be an accurate representation of real-world situations, it is only through highly controlled conditions that one can determine what variable is influencing what measure with any confidence. The cumulation of several studies with a high degree of internal validity slowly allows us to draw broader generalizations to the real world. With sound reasoning and reproducible results we can solve problems with greater efficiency ensuring clients a secure return on investment.</p>
      <p>Who’s taste at who’s discretion?</p>
