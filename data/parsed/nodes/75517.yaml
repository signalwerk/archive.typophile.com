    <p>I'm brand new here and something of an ingenue at this whole typography game, but it's something I'm interested in and looking to learn about. To that end, I'd like some help from you.</p>
    <p>I need to get my hands on a nice serif – a fairly traditional one preferably – with 'reading' a's and g's. This is intended for body text in a novel-style text, so shouldn't really be so markedly different in any other way from what you might normally find. A lot of nice serif fonts have suitable italics, but the Roman or book styles have the arc overhead (although I don't know what that's called).</p>
    <p>Thanks for your time.</p>
