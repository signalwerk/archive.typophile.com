      <p><em>...let's use ligatures as an example...</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fis_4767.png"></div><p></p>
      <p>Which particular font did you have in mind?<br>
      Serif or sans?<br>
      What size?<br>
      What weight?<br>
      What page layout?<br>
      Pixel or print?<br>
      What stock/screen resolution?<br>
      What demographic of readers?<br>
      What reading environment? (RSVP in a lab?)<br>
      What text?<br>
      What publication?<br>
      What intended reading outcome?<br>
      What language?<br>
      And finally, who is the typographer?</p>
      <p>Reading research is able to draw conclusions from a specific experiment in which the above variables are fixed, but generalizing to situations where the variables are otherwise is shooting in the dark.</p>
      <p>Typography is a discipline of infinite variety, to be practised with taste and discretion, not reduced to a set of idiot rules.</p>
