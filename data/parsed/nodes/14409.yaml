  html: |-
    <p>—<br>
    We’re pleased to announce the arrival of our latest typeface Maple.<br>
    A distinct departure from our recent releases, Maple is a warm grotesque<br>
    with modern sensibilities and historical influences from the 19th and<br>
    early 20th centuries. Suited for both text and display settings, the<br>
    complete family contains four weights, companion italics, rugged charm<br>
    and ostentatious flair.</p>
    <p>Maple is available for license as a complete family, in packages<br>
    containing two weights each, or as single weights. Both Mac and Windows<br>
    purchasers will receive two formats: OpenType (which includes extended<br>
    language support) and traditional PostScript Type 1.</p>
    <p>—<br>
    See more of Maple:<br>
    <a href="http://www.processtypefoundry.com/typefaces/maple/">http://www.processtypefoundry.com/typefaces/maple/</a></p>
