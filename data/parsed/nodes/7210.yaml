    html: <p>Whoa, Nick Jenson� <br>unfortunately, none of his punches have survived, to my knowledge. I think that the oldest known punches are Garamond's, in the Plantin-Moretus Mueseum in Holland. <br> <br>New England (and New York) are awash in old Jenson books, if you look in the right libraries. Both Brown and Harvard have them, for instance� others must, too. Many of the libraries may have "official photographs" on record as well, which might be reproducable when the books are not. But librarians can be very protective. Have good answers ready.</p>
