    votes: null
    html: <p>Fortunately, I don't need punches, just images of his prints. <br> <br>Before I actually design anything, I want to go through the motions in FontLab with a variant of an existing typeface. I saw an enlargement of some Roman type by Jenson in 'The Elements of Typographic Style,' by Robert Bringhurst, and realized it would be a lot of fun to make an "antique" variant of it, complete with alternates. A good starter project. I might even degrade the quality further and make an "ancient" style face. Much as I adore Caslon Antique, I think it misses some of the flavor I see in this Jenson sample. <br> <br>Thanks for all the suggestions! Octavo.com already has me drooling...</p>
