    html: "<p>Well, nobody's gonna loan you their Eusebius to slap on a scanner!  :-) It's not highly difficult to get to handle some of those old gems (try a good university), but getting permission to squish them down or expose them to strong light is another matter. Maybe if you had a really good macro photography setup that could work in low light, you might get somebody somewhere to OK it. The big-name \"revivalists\" often have important friends, or they might work directly from the punches or matrices. <br> <br>But Octavo is indeed one good way to get at that type of stuff. Good facsimiles are another, but they do have to be good enough. You might also find enlargements of snippets of text here and there, like in that Gaskell article: \"Photographic Enlargements of Type Forms\" in the Journal of the Printing Historical Society, #7, 1971, pp 51-53. <br> <br>hhp</p>"
