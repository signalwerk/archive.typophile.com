      <p>Typography is what it is.  You may choose to define it as simply any use of type and let the qualitative aspect of how well it was done determine for your own set of values if it is "Good Enough" to be called art.  You may also, if you wish, change that name to "typesetting" and elevate "typography" to a particular set of the category "typesetting" that some people deem as so noteworthy in use and design as to elevate it to an art form.  Typically,this sort of thing is determined differently depending on point of view.  A Job-shop typesetter from the 1950s who makes a living setting type may choose to call himself a craftsman.  A distinguished University professor of design or typography may elevate the term to something higher.  A typical reader may not care a hoot about the distinction and just read the words. People anoint saints for their own reasons.  The people who may have been given that distinction at some point after their death, have just done whatever they seemed fit to do without posing the question at all.</p>
      <p>I must admit that I do not see Warde's Crystal Goblet analogy as either correct or at best incomplete.  I am in the middle of writing something on this so I will present that viewpoint later when finished.</p>
