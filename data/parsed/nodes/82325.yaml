      <p><em>"Design" does imply creating a template from which many instances are produced, as you say.</em></p>
      <p>That's only one implication.<br>
      Industrial design for mass production is certainly design, but so is an architect designing the plan (template) for a one-off building.</p>
      <p>Surely the implication of design is that one creates an interim plan or template for a product that someone else may finish.<br>
      Or oneself, if one likes to plant and care for one's own garden.</p>
      <p>So designing a typeface, one designs and crafts glyphs that will combine nicely with each other, when the font is put to use to create typography. That's what I like best about type design, that the design and the craft (and the art) are so fundamentally entangled. Art used to be like that.</p>
      <p>Similarly, a graphic designer creates artwork (a file) that may be output by someone else, even if there will be only one instance—a large sign or banner, for instance, or a presentation book.</p>
      <p>Art directors and artists may also work like this.<br>
      Rodin, for instance, would make a small maquette, and his foundry (love that word) would scale it up and mass produce it.<br>
      Many artists today are not makers. Jeff Koons posed for and art directed his porno series, but he didn't shoot it. Similarly, in a recent exhibit curated as "the artist as celebrity", it was interesting to see a collection of ads featuring Andy Warhol; the concept and art direction (design) of which was created by George Lois—an art director who was something of a celebrity, but not enough to warrant mention by the curator.</p>
      <p>A musical score is also design, by another name.</p>
      <p>Storyboards, as used in motion pictures and advertisements, are also design.<br>
      Filming and editing are more art and craft, when one or more shots are shot and cut (dissolved, etc.) together in such a way as to combine nicely according to the plan. Somewhat like typography interpreting a layout design.</p>
