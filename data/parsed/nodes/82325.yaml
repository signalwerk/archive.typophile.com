    html: |-
      <p><cite>I read a quote (and it's a commonly held belief) that typography is best when it functions without being noticed</cite></p>
      <p>Disagree. Of course typography is supposed to be noticed. But in a manner similar to a movie set: it's not the focus of the scene, but it enhances what's happening in the foreground. And if it's poorly made or inapt, you'll definitely notice. </p>
      <p>The idea that "printing should be invisible" is most directly traceable to Beatrice Warde's "Crystal Goblet" essay from 1955. While the essay has a few good points to make, its core premise — that "invisibility" is the defining virtue of typography — is flat wrong. (Wrong on metaphorical grounds too: go to a decent wine bar and you'll see crystal goblets of different shapes being used for different kinds of wine.) It's long past time for typographers, and typographic educators especially, to pour concrete into Warde's "Goblet" and toss it overboard.</p>
      <p>Some defend Warde by saying that her thesis was not so extreme — that she only meant that typography should be suited to the text. A fine idea, but what part of Warde's essay supports this interpretation? If anything, she goes out of her way to reinforce the "invisibility" theme:</p>
      <p><cite>But a good speaking voice is one which is inaudible as a voice. It is the transparent goblet again! I need not warn you that if you begin listening to the inflections and speaking rhythms of a voice from a platform, you are falling asleep.</cite></p>
      <p>Does this statement make any sense at all?</p>
      <p>Warde's essay mostly illustrates the perils of latching onto an appealing but inapt metaphor: everything you deduce from that metaphor will also be wrong.</p>
    html_clean: |-
