      <p>To take it back to the OP's question —&nbsp;"is typography art?" The question is flawed because it presents a false dilemma: either typography is art, or it's "merely functional."</p>
      <p>Typography is a medium with expressive capacity. Any medium with expressive capacity also has the capacity for art. Many expressive media started in functional roles. As the medium branches into more purely expressive uses, it doesn't necessarily leave the functional role behind. </p>
      <p>For instance, photography. If I said to you "is photography art?", you'd probably say "which photograph are you talking about?" A product photo in an Ikea catalog? You'd probably say no, it's not art. A Cindy Sherman self-portrait? You'd probably say yes. A Richard Avedon fashion photo? Hm, could go either way.</p>
      <p>But whether one thinks Ikea vs. Cindy Sherman vs. Richard Avedon deserve to be rated differently is not the point. The point is only that there's nothing preventing typography from being an art medium.</p>
      <p>So why don't we see more art typography? It's mostly a practical issue: typography is usually in service of a text, which takes center stage, so the expressive possibilities of the typography are always taking a back seat. Out in the real world, most typography is filling a functional role, not an artistic role. But if you look at the work of Jenny Holzer, Marian Bantjes, Erik &amp; Just, Rudy &amp; Zuzana (&amp; many others) I think you'll find plenty of material that qualifies as both typography and art.</p>
