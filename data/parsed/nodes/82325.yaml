      <p>Matthew, Nick, you're right, of course, that design can involve a one-off thing, a building. Krenov was relating to furniture production, where there are many copies involved, and it is impossible to have the intimate relation to organic materials that he had with creating his furniture. </p>
      <p>I think that one of the things which normally characterizes design is that the plan is more clearly separated from the execution than in an individual work of art. Of course one of the features of design, probably the defining one, is goals other than aesthetic ones. </p>
      <p>In this sense I'm not sure whether "design" fits writing a song or symphony. There the performance is separated from the score, but the goal is often more purely aesthetic. In movies you have "sound design" which is suiting the sound and I believe music to the visuals in a movie. In sound design, the sound and music are clearly subordinate to the goal of telling the story with emotional impact. In a song or symphony there is not usually such subordination. </p>
      <p>In the case of type design, the type face is only fully realized later in the work of those who use it in print or on screen. And I agree with you Nick that one of the delights of type design is its mixture of design, art and craft.</p>
