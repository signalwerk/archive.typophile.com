      <p>John, I think I was misunderstanding the current usage of "artisan", which is indeed as you say, emphasizing manual labor. Creating type faces is undoubtedly design, as Chris says, and as common usage has it—"type designer." So the question of how much type design is art is a question of how much design is art. </p>
      <p>"Design" does imply creating a template from which many instances are produced, as you say. This is as contrasted with a one-off, unique product. <a class="freelinking external" href="http://jameskrenov.com/furniture.htm" rel="nofollow">James Krenoff</a>, a furniture maker I greatly admire, emphasized this difference. He kept huge slabs of wood in his shop, planed them, and examined the grain until he was inspired to make a particular piece bringing out and taking advantage of the beauty of that particular piece of wood. He wanted the piece to show that it was from a particular tree, and from a particular hand. He called himself an artisan, and consciously tried to provide his customers with a piece of furniture that would not be experienced as designed and manufactured, but as one-off and personal. Many, me included, would say his pieces are also works of art.    </p>
      <p>I just consulted one of my favorite reference books as a writer, <a class="freelinking external" href="http://www.amazon.com/Merriam-Webster-Dictionary-Synonyms/dp/0877793417" rel="nofollow">The Merriam Webster Dictionary of Synonyms.</a> As the on-line reviews say, this an astonishingly good book, too little known. </p>
      <p>I think it clarifies, by going into the history of the usage of the word "art," why the discussions of this are so endless and futile. The word has different, overlapping meanings, which can even be at odds with one another. And this confuses those who try to pin it down to one meaning. </p>
      <p>Here is a bit from the article on "artist" and its synonyms, including "artisan":</p>
      <p>"The earliest and the abiding implication of *artist* is skill or proficiency (see "artist" under EXPERT); it was in Shakespeare's time, and later, applied to anyone who made or did things requiring learning and skill; thus a teacher, a philosopher, a physician, a scientist, a chemist, or a craftsman was then called an "artist". ...Gradually, however, the word became associated with those whose aim is to produce something which gives pleasure, first with musicians, dancers, actors, and the like, and later with poets, painters, and sculptors. The two ideas of skill and the aim to give pleasure were combined, so that since the early nineteenth century, "artist," (when it does not mean specifically a painter) is usually applied to a gifted person who works in the fine arts, and especially one who reveals his skill, taste, and power to create beautiful things."</p>
      <p>I think this clarifies the usage of "art" in relation to type design. When a design is particularly skilled, beautiful, or moving, such as the works of Garamond or Bodoni, we tend to call it a work of art. How to define or explain the aesthetic dimension is a thorny psychological and philosophical issue, but at least this clarifies the usage: When a type face is particularly beautiful or moving, it can appropriately be called a work of art by those who love type.</p>
    html_clean: |-
