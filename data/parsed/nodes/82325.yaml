    <p>Hi guys, </p>
    <p>I couldn't find a thread for this, although I am quite happy to be re-directed and shouted at if this has already been discussed. I was wondering what people's views are on the idea of typography as an art form. I read a quote (and it's a commonly held belief) that typography is best when it functions without being noticed. If this is the case, is Typography art? Or is it merely functional? I look forward to a debate/being shown where to go to debate this issue.</p>
    <p>Thanks</p>
