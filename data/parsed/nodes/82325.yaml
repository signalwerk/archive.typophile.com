      <p>Here we go again. I won't retread every path I’ve taken in previous discussions, but I will make a couple of points in brief:</p>
      <p>For a very long time, the words art and craft -- or their equivalent in other languages -- were used interchangeably or, rhetorically, to reinforce: ‘in my craft or sullen art’, as Dylan Thomas had it. The word art ultimately implies skilled making, the root of artifice and artefact. Personally, I’m pretty content with this ancient usage, and don’t feel the need to entangle myself in aesthetic theories of expression and response that have to do more with the psychology of the artist and the viewer than with the made thing. The made thing has always seemed more important to me than the thought and emotion that resulted in it or the thought and emotion that is brought to it.</p>
      <p><em>If,</em> on the other hand, one desperately wants to make a distinction between craft and art, then I think the objective ground to do so is in terms of art as an extra-utile quality of the made thing, i.e. that which makes it not merely functional. From this, as I’ve expounded before, flows the observation that almost every human-made thing displays some quality of art, some aspect that a) is other than it might have been (i.e. form not determined strictly by function), and b) is consciously formed to aesthetic purpose (accident or randomness can produce things that are beautiful, moving, inspiring, etc. but it isn’t art any more than a rock pleasingly shaped by the tides is art). All other grounds of distinction seem to end up in judicial debates that seem to me less about what is and isn’t art and more about what is good and bad art.</p>
      <p>But most of the time, I’m content to think of type design as my craft or sullen art.</p>
