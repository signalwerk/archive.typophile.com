    html: <p>I dunno, I still find the "Crystal Goblet" essay (actually from 1932) brilliant, and pretty useful. Yes, "go to a decent wine bar and you'll see crystal goblets of different shapes being used for different kinds of wine," but you won't find intricately decorated gold chalices, which was the alternative to crystal with which she opened the essay. I would only say that perhaps using "transparent" in place of "invisible" might have made her case more compelling. Transparent is, after all, what a crystal goblet is—so my criticism would be that her conclusions were poorly worded, but her metaphor actually spot-on.</p>
