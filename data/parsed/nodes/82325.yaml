    html: |-
      <p>I don't think the art/not art question is particularly relevant to typography.</p>
      <p>Type design is more like Critical Design (as described by Rick Poynor), certainly in the respect that a lot of retail fonts are created not according to a client's design brief, but address issues which the designer finds significant.</p>
      <p>Typefaces operate on many levels.<br>
      The three main ones:<br>
      - as tools for typographer, graphic designers and art directors to make documents with<br>
      - providing the visual substance for readers of such documents<br>
      - as cultural subject matter</p>
      <p>This last aspect: it's possible to consider typefaces independently of either using them to create a document, or reading them as part of a document. Several of the typefaces "acquired" by MoMA are like that. Beowolf, for instance, is almost never seen in commercial work and very few typographers have actually worked with it, yet it is quite significant in the sphere of type and design culture.</p>
      <p>All of us here are acquainted with faces which we have not used and have not seen used commercially, only in showings provided by foundries and distributors, and perhaps discussed in trade media and online blogs and forums.</p>
      <p>I often kid myself that my real work concerns not fonts, but type specimens, for these are its core substance, where the full scope of typefaces is displayed, and where their deep meaning resides. My library of specimens is a great collection, encompassing vast realms of history and technology, and many of the specimens are exquisite objects, some of which are literature in that special concrete poetry sub-genre. </p>
      <p>When I create a specimen for my type designs, I work to perfect the specimen by perfecting the fonts (or is it vice versa?)—that's as far as I can go. Then it's up to those who license the fonts to add another layer of meaning, and surprise me by revealing qualities in them, and uses, which I would never have expected.</p>
