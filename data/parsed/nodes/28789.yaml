      <p>For the small amount of time it takes to make a drop-cap style sheet, his "saves time" reasoning is really lame.  Whenever someone says "always" do this or "never" do that (in design circumstances at least) be very leary.  There is no simple little checklist to great typography.  It is work. Drop caps or any other device can both be used well and poorly. It is like golf. After you select the club to use, you still have to make the shot.  Selecting items from menues and pallettes in InD is a snap, making the page look good and function well both takes work.</p>
      <p>ChrisL</p>
