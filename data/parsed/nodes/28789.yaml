    <p><cite>"You never go to heaven with an elegant drop cap."</cite></p>
    <p>This is a comment that my teacher just made today. His basic premise was that it never pays to waste any time on drop caps. They are good for giving your eye an entrance into a block of text, but not really that important in the grand scale of things.</p>
    <p>I happen to like an elegant looking drop cap. It lends a sense of class to whatever you are working on.</p>
    <p>Do you think he is correct? Or is he off the mark?</p>
