    html: |-
      <p>Drop caps are especially useful in places like magazines, where easy navigation is crucial. Readers depend on visual clues to see where articles begin and end, since they're usually scanning fast in different directions. Now, I'm not trying to say drop caps are essential, but if they fit the style of the layout and are tastefully implemented, they can enhance things. They are a bit like the little bullets or icons that end an article. (Is there a name for those things?) They give the reader a little cue that says "I am starting an article" or "I just finished an article" -- and the little bit of extra satisfaction that comes with it.</p>
      <p>Does that sound nuts?</p>
    html_clean: |-
