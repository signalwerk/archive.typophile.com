      <p>To be fair, the examples I've provided are in book design. All of them from the fine press mind you. </p>
      <p>It can be argued that a drop cap, or any initial capping style is excessive in a purely functional and informational context, and that it has no place in say a magazine, newspaper, or website. I was also indoctrinated not to use it by my instructors when I was in college. </p>
      <p>Maybe the disdain began with Modernist sensibilities. Herbert Bayer and many other typographers during this period sought to eliminate capital letters altogether. If that is the case, the initial cap would have been the first to be decapitated.</p>
