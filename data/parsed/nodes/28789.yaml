      <p>Days of yore... a space was left in a printed book along with a very small indication for the actual letter for the owner to draw in their initial caps. Here's an example from a page by the printer Alexandro de Paganini 1527. Someone started to draw a P. The rest of the book is untouched. Alexandro de Paganini admired Manutius/Griffo's italics and developed his own designs.</p>
