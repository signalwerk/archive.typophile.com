  html: |-
    <p>Just drew some letters. Maybe this will grow into my first attempt at a Latin typeface, who knows.</p>
    <p>"munchilo" was the nicest sounding pangram (of those letters I've already drawn) I could come up with. Googling it yields some 1,000 hits, mostly German related. Anyone has any idea what it could mean?</p>
    <p>I'm not sure I'm happy with the c, by the way.</p>
    <p>Please feel free to share your thoughts!</p>
