    html: "<p>The technique is wonderful, but I was struck by how incredibly banal almost all the images were: the sort of thing one would ignore completely in another medium. Often, in the early stages of each, there would be a moment when the abstract arrangement was quite powerful and interesting, but then he would turn it into a rather sickly figurative image. Pity.</p>"
