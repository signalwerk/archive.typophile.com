  html: |-
    <p>Hi everyone,</p>
    <p>I'm a second-year graphic design student that loves and appreciates Typography and it's history, as well as its future!</p>
    <p>I'm required to research 3 sans-serif classifications / one typeface for each classification. (ie: transitional sans, geometric sans, and humanist sans)</p>
    <p>I've chosen:<br>
    -Futura<br>
    -Gill Sans<br>
    -Helvetica</p>
    <p>*I know that some of these classifications can be argued, but the main reason I'm posting here is to find a site/source (aside from Wikipedia) to use for my project.</p>
    <p>Any recommendations?</p>
