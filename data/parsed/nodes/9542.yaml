    html: "<p>Here's what has helped me: <br> <br>1) Before kerning, make sure your glyph widths are right. <br> <br>2) Read this: <a href=\"http://members.xoom.virgilio.it/dtp/papers/type_by_design/chapter3.pdf\" target=\"_blank\">http://members.xoom.virgilio.it/dtp/papers/type_by_design/chapter3.pdf</a> <br> <br>3) Go here: <a href=\"http://typophile.com/downloads/\" target=\"_blank\">http://typophile.com/downloads/</a> and use the relevant resources. <br> <br>I hope that helps.  <br> <br>Let it be known, however, that my fonts are pretty wacky. I could take my own advice!</p>"
