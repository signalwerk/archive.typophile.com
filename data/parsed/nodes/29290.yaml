      <p>I'm not going to continue wasting time arguing trolls in this thread, so this is my last post on this topic. That said, you wrote:</p>
      <p><cite>The Australian FontShop ... is even presently offering Paxim and Parlament for sale</cite></p>
      <p>I just checked, and the Australian site doesn't offer the fonts you mention for sale. In fact, none of the iterations of FontShop worldwide offer Paxim or Parlament. The .JPG links you provided could be forgeries themselves for all I know (or care). But, unless you provide a working link to an active FontShop page somewhere in the world offering the fonts you mention for sale, there's no basis to your argument. If FontShop offered it for sale in 2004, why post about it now? What can anybody at Typophile do about it?</p>
      <p><cite>For Mr. Ahrens and for the other Typophile members it seems to be entirely legal for forgers to snatch the fonts made by others and to rename them and sell them as their own fonts.</cite></p>
      <p>Typophile members don't make the law. Indeed, many are quite upset at current U.S. copyright law which, in fact, doesn't protect typeface designs themselves, only the source code of the computer files. </p>
      <p>But, if you are arguing the morality of copying and reselling fonts under different names, you'd do much better to avoid <em>ad hominem</em> attacks on members of the Typophile community and the purchasers of the fonts they create. Likewise, if you want to be taken seriously as an impartial "documenter" rather than a biased "prosecutor" with an axe to grind, I'd take a page from journalists' book and avoid using loaded words like "font <em>forgers</em>" and "<em>criminal</em> research."</p>
      <p>As of yet, I have not seen in this thread nor in others you have started any willingness to ascribe to these simple rules of polite discourse. As such, many on these boards spend their time and energy attempting to defend our community against your malicious, defamatory and, quite possibly, libelous vitriol. </p>
      <p>I, for one, am done and won't participate in this fruitless exchange any longer. I would recommend that by brothers and sisters here do likewise and avoid furthering this pointless debate with you.</p>
