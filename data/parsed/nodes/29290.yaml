      <p>Hi Adam, Karsten and Uli,</p>
      <p>what do you mean by "copyrightable"? Do you mean "schutzfaehig"?</p>
      <p>I just browsed my law books and found that some common assumptions about  intellectual property legislation are not applicable in Germany:</p>
      <p>- The notion of "who owns the copyright" does not seem to be common, at least I have not found anything like that in the texts. You could, of course, ask the question "Who could claim protection for his work in case of an argument, and on which legal basis?"<br>
      - Obviously, the creator (Urheber) could do so but no action is necessary to protect you intellectual property on the basis of the UrhG.<br>
      - A company cannot be a creator (Urheber). (§7 UrhG)<br>
      - Copyright can not be transferred between living persons (§29,2 UrhG).<br>
      - However, the creator can transfer rights of use (Nutzungsrechte). I guess this is the legal basis on which intellectual property is "sold".</p>
