    <p><strong>The Hertin File - One Year After</strong></p>
    <p>A new version of the German "Hertin File" ("Hertin-Akte") is available since February 2008 at my website for legal authorities. It should be emphasized that the "Hertin File", which also documents the lawsuit "Hertin vs. Stiehl" (29 C 495/07), is available for legal authorities only.</p>
    <p>The "cease-and-desist" Hertin Anwaltssozietät in Berlin (Paul Wolfgang Hertin, Christlieb Klages, Urs Verweyen et al.) did not succeed to prevent the "Hertin File" which is downloadable for legal authorities at</p>
    <p><a href="http://www.sanskritweb.net/forgers/hertin.htm">http://www.sanskritweb.net/forgers/hertin.htm</a></p>
    <p>and also downloadable at</p>
    <p><a href="http://cg.scs.carleton.ca/~luc/hertin/hertin.htm">http://cg.scs.carleton.ca/~luc/hertin/hertin.htm</a></p>
