      <p>Two striking things in the Hertin letter:</p>
      <p>(1) To my regret, the letter itself does not make the distinction between protecting type design vs protecting font software explicit.</p>
      <p>(2) The Hertin letter (to support its claim that their client sells digitized typefaces that are public domain now and not protected by copyright) sweepingly states that for the protection of typefaces there is the Geschmacksmustergesetz/Schriftzeichengesetz -- <cite>and no protection beyond that</cite>.* It goes so far to claim that typefaces are not copyrightable.** This contradicts what was published elsewhere, that typefaces are protected if they show "artistic added value" -- unlikely maybe, but, well ... So, I regret that their argument is rather extrabold.<br>
      (At the same time, referring to the link Adam posted, I have the sad impression that the court took the easy route: because fonts deserve protection as <cite>font software</cite>, they did not even attempt to answer the question whether the <cite>typefaces</cite> are actually works of art and thus copyrighted in Germany. Since font formats come and go, protection of typefaces as font software is only a substitute for real protection of the pieces of art/design which typefaces are or can be. It is as if a 300-dpi scan of a drawing were copyrighted but the original drawing were not. It is plain absurd. But another story.)</p>
      <p>*&nbsp;&nbsp;"Darueber hinaus ist ein rechtlicher Schutz von Schriftzeichen vom Gesetzgeber nicht vorgesehen." (p.2)<br>
      **&nbsp;&nbsp;"Bei einem Schrifttyp handelt es sich jedoch eben <cite>gerade nicht</cite> um ein urheberrechtlich geschuetztes Werk iSd § 1,2 UrhG." (p.3)</p>
      <p>As to the Chevalier outlines, it is amusing that obviously Softmaker sells a cleaned up version while Linotype's shows Ikarus-conversion-artefacts in the left serif.&nbsp;&nbsp;:)<br>
      It might be a funny project for future students of type history to create a genealogy of font outlines.</p>
