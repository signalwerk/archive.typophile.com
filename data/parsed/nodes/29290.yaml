      <p>Keep in mind that copyright protection does not take the date of publication into account, but the date of creation. Therefore, it is of no significance that Softmaker released their font in 2002 (or earlier) while Linotype did so only in 2006. What is important to discover is who and when did the digitization of Chevalier, i.e. turned the Haas/Stempel/Linotype original design into software code. </p>
      <p>I cannot agree with your conclusion that Linotype's statements "Digitized by Linotype", "Linotype Original", "Copyright by Linotype" are "blunt lies" ("plumpe Lügen"). Given the fact that Chevalier was produced and marketed by companies that were acquired by Linotype, Linotype is entitled to call the typeface a "Linotype Original". Provided that the font software for Chevalier was indeed prepared by Linotype (Linotype-Hell AG, Linotype Library GmbH, Linotype GmbH or a service partner working for any of these), I have no reason to see why Linotype should not claim copyright on the digital software code, and credit itself on the digitization. </p>
      <p>Unfortunately, Ulrich -- as usual -- you are jumping to conclusions without properly analyzing the materials. I agree with you that the matter should be clarified by the legal authorities, and therefore am grateful for your work on documenting these issues. However, I don't think that you're doing yourself or anyone else much service by accompanying your documentation with loud claims such as "blunt lies", which, in my eye, you have not sufficiently backed up with evidence. </p>
      <p>Regards,<br>
      Adam</p>
