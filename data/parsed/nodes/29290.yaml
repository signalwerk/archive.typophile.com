      <p>Uli, </p>
      <p>while I'm not in any way part of the dispute, I would like to make some comments on your findings and claims. </p>
      <p>As you point out in <a href="http://www.sanskritweb.net/forgers/escoria.pdf">http://www.sanskritweb.net/forgers/escoria.pdf</a>, the original type design Chevalier was designed by Emil A. Neukomm in 1946 at Haas, and was distributed in Germany by D. Stempel AG from the 1950s on. As you probably, know, both Haas and Stempel assets have been acquired by Linotype-Hell around 1985-89. Linotype-Hell was acquired by Heidelberg and its font division was separated into Linotype Library GmbH in 1997. In 2006-07, the company changed the name to Linotype GmbH and was sold to Monotype Imaging. </p>
      <p>There has been a continuous legal ownership of matrices, design originals (drawings), designer credits and (in many cases) trademarks by Linotype GmbH from its predecessors. </p>
      <p>While Hertin Anwaltssozietät asserts there is no copyright protection for type designs in Germany and typeface designs can be only protected as design patents (Geschmacksmuster), this does not automatically imply that this is the case worldwide. For example in Poland, courts have decided that typeface designs are protected under copyright law (rather than the patent law, which only offers paid and more time-limited protection). </p>
      <p>On <a href="http://www.sanskritweb.net/forgers/chevalier.htm">http://www.sanskritweb.net/forgers/chevalier.htm</a>, you interpret the "June 2006" release of Chevalier by Linotype so that before June 2006, Chevalier was not available at Linotype. Your interpretation is wrong. As you have documented yourself, Haas published Chevalier as metal type in 1946 and D. Stempel AG distributed the metal type from the 1950s on. The typeface was available for sale by these companies. Haas' type assets and D. Stempel AG were purchased by Linotype-Hell in the 1980s, and their assets have gone into Linotype GmbH. Linotype GmbH is the legal successor of D. Stempel AG and at least of the type assets of Haas (I don't know the exact details of the transactions). </p>
      <p>You make the point that Softmaker sold the digital font "Maurice" as early as 2002 (or perhaps earlier), and that it was a "forgery" of the Chevalier design. You conclude that Linotype's digital font "Chevalier" is a copy of "Maurice", therefore not an original. But as Linotype is a legal successor of the type assets of Haas and Stempel, wouldn't you agree that it has the right to claim to be the originator of the Chevalier design, dating back to 1946? </p>
      <p>Further, you completely ignore the distinction between typeface design and the digital font form. The Adobe vs. SSi ruling in the U.S. has affirmed that digital fonts are treated as software programs and are copyrightable under U.S. law. Since U.S. and Germany are part of the WIPO and of the Berne convention, it can be asserted that while typeface designs may not be copyrightable in Germany (but only enjoy patent protection), the software programs, and therefore the digital fonts, are copyrightable. I believe there are some German court rulings that see it the same way. </p>
      <p>Your analysis of Linotype's Chevalier and Softmaker's Maurice digital data is interesting. Indeed, it suggests that both fonts share the same digital software code. While Linotype release the font only in 2006, there is no reason to assume that it was not "digitized by Linotype" earlier. Many fonts exist in raw digital formats for years and only get published much later. </p>
      <p>Keep in mind that copyright protection does not take the date of publication into account, but the date of creation. Therefore, it is of no significance that Softmaker released their font in 2002 (or earlier) while Linotype did so only in 2006. What is important to discover is who and when did the digitization of Chevalier, i.e. turned the Haas/Stempel/Linotype original design into software code. </p>
      <p>I cannot agree with your conclusion that Linotype's statements "Digitized by Linotype", "Linotype Original", "Copyright by Linotype" are "blunt lies" ("plumpe Lügen"). Given the fact that Chevalier was produced and marketed by companies that were acquired by Linotype, Linotype is entitled to call the typeface a "Linotype Original". Provided that the font software for Chevalier was indeed prepared by Linotype (Linotype-Hell AG, Linotype Library GmbH, Linotype GmbH or a service partner working for any of these), I have no reason to see why Linotype should not claim copyright on the digital software code, and credit itself on the digitization. </p>
      <p>Unfortunately, Ulrich -- as usual -- you are jumping to conclusions without properly analyzing the materials. I agree with you that the matter should be clarified by the legal authorities, and therefore am grateful for your work on documenting these issues. However, I don't think that you're doing yourself or anyone else much service by accompanying your documentation with loud claims such as "blunt lies", which, in my eye, you have not sufficiently backed up with evidence. </p>
      <p>Regards,<br>
      Adam</p>
