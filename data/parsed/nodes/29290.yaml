      <p>Uli, </p>
      <p>regarding the correspondence from Elsner+Flake's attorneys Anwaltsozietät Hertin, I believe you have not understood what they wrote. They say that the typeface *design* "Chavalier" has become public domain, and that Elsner+Flake digitized it, expanded the character set and implemented the typeface in contemporary font formats. While typeface designs may not be copyrightable in Germany, digital fonts are considered copyrightable software. In your reply to Hertin, you cite Hertin's book in that he describes that forging public domain works such as Shakespeare's is illegal. </p>
      <p>But your analogy is flawed. The works of Shakespeare are public domain but if one produces a software program that displays and presents Shakespeare's works on modern computers in an innovative way, and extends the works by comments or some other additions, the result of this work *is* copyrightable even though the underlying work is public domain. </p>
      <p>This is why Hertin writes: "In case of the typeface 'Escorial', our client [Elsner+Flake] digitized an existing metal type of letterforms, added special characters such as €, @ and others that have meanwhile become customary, and implemented the result in contemporary font formats. Our client offers this service as licenses for the relevant fonts." </p>
      <p>Quite clearly, Hertin's point is that while Chevalier is a public domain design, Elsner+Flake's version ("Escorial") is not copyright-free because Elsner+Flake digitized the typeface and implemented the design in digital font formats (which are considered software) and performed some work that added intellectual property (such as creating the custom characters). </p>
      <p>In your reply to Hertin, you mix up typeface designs and digital fonts and ignore the rest of the distinctions I have explained above. This indicates that you don't understand what Hertin wrote to you. </p>
      <p>Regards,<br>
      Adam</p>
