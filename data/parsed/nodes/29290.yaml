      <p>The ruling to which Adam's link refers clearly states that fonts -- regarded as font software (= computer programs) -- <cite>are</cite> copyrightable.<br>
      And typeface designs <cite>may</cite> be copyrightable as works of art, also indicated in the ruling.</p>
      <p>Personal note, to extend what I already said in my previous post:<br>
      What <cite>really</cite> bothers me is the somewhat flawed argument to which the ruling subscribed. It goes like this:<br>
      To make software, you need to have computer knowledge and training as typographer or typesetter (the ability to space letters is explicitly mentioned). It does not even matter whether the type designer actually programs the font software, or uses applications which generate the font software. The ruling emphasizes that, to make font software, one needs "creative programming skills/efforts" which justify copyright protection. (One could back this by the assumption that e.g. a PostScript font in fact is a program which <cite>can</cite> be programmed. But there is no word of this in the said ruling.) In short:<br>
      On the one hand, protecting font software -- i.e. the technical implementation of typeface design -- is easy. The ruling emphasizes what at best can be characterized as mere technical skills.<br>
      On the other hand, the barrier for typeface design -- as a work of art -- to be regarded as copyrightable is set so high that it is rather unlikely that a good text face would ever enjoy this kind of protection.<br>
      Absurd.</p>
