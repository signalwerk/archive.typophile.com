    <p>The December edition of the Metal Type newsletter is now out. Click this link to take a look at the video: <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>I have started a new "Forum Weekly Digest" email. If you are a member of the forum you should have received the first couple of editions. If you would like to get a weekly summary of what's been hapenning on the forum, you can subscribe here: <a href="http://j.mp/nhN5ih" title="http://j.mp/nhN5ih">http://j.mp/nhN5ih</a></p>
    <p>I have added Miehle Vertical and Heidelberg T-shirts, mugs, etc. to the Zazzle Metal Type store: <a href="http://j.mp/Hd5MoT" title="http://j.mp/Hd5MoT">http://j.mp/Hd5MoT</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
