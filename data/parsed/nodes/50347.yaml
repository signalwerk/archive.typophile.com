    html: |-
      <p>"Font weight definitions seem to be quite subjective and there’s all sorts of ambiguity..."<br>
      I think weight names are only valuable relative to the family a style is in, as are the OS/2 values Nick refers to. The actual weights, expressed in units/units per em could be used across families to some extent, but in general, with selection for use being accomplished visually by humans, the only ones left in the dark are the computers.</p>
      <p>Cheers!</p>
