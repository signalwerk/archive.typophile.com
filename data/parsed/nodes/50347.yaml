  html: |-
    <p>Okay, I get the difference between a Bold face and an Extra Bold, but where exactly does a "Black" fit into the grand scheme of a font?  Every time I think I have sussed out what the definable difference might be I run into a font that breaks "the rule."</p>
    <p>Apologies to all who'll say that I should just choose what works/looks best. But, I'm the picky type who likes to understand the small stuff.</p>
