    html: '<p>Georgia is a good alternative. I add some: Garamond (should comes free as PC system font too), some Caslon (free with MAC OS), Hoefler Text (<a class="freelinking external" href="http://typophile.com/node/98471#comment-532114" rel="nofollow">free with MAC OS X</a>, thanks Jan!), Cambria (PC), <a class="freelinking external" href="http://www.google.com/webfonts" rel="nofollow">Google Web Fonts directory</a> (use "serif" as filter: <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Lusitana" rel="nofollow">Lusitana</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Radley" rel="nofollow">Radley</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Ovo" rel="nofollow">Ovo</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Average" rel="nofollow">Average</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Unna" rel="nofollow">Unna</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Merriweather" rel="nofollow">Merriweather</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Lustria" rel="nofollow">Lustria</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Neuton" rel="nofollow">Neuton</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Droid+Serif" rel="nofollow">Droid Serif</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Vollkorn" rel="nofollow">Volkorn</a>...), <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/list/style/Serif" rel="nofollow">Serif category at Fontsquirrel</a></p>'
