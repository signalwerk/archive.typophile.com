      <p>I like my mobile phone, and I have to admit I am a bit of a geek with it. To be honest, if I could buy exactly the same phone with the speaker and microphone removed, and purely use it for text messages, email, browsing, shoot-from-the-hip photography, lightweight PDA type stuff and the odd game, then I’d be an awful lot happier. I think its time for mobile phones to move to the next step - dumping voice calls altogether!</p>
      <p>Stephen Fry illustrated the problem with (all) telephones perfectly. He said they’re impossibly rude, simply sitting there screaming “SPEAK TO ME, SPEAK TO ME, SPEAK TO ME” like a demanding child.</p>
      <p>Before someone suggests turning off my ringer, or diverting to voicemail - Hrant is right, that just makes people irrationally angry.</p>
