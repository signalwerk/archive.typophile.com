      <p>Yes I use a mobile phone for:<br>
      Text messages,<br>
      Photo’s at 2mp<br>
      Calls<br>
      Alarm clock<br>
      Timer for food.<br>
      Emergency contact ie.. ICE In Case of Emergency number on your person<br>
      Emergency news photos and video.<br>
      Documentation of something that you want to show someone with the camera, always on you.<br>
      and a radio.</p>
