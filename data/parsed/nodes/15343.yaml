      <p>That first “no” is me.<br>
      You see, it’s a prestige thing: if <strong>I</strong> need <strong>you</strong>, then <strong>I’ll</strong> call you.  ;-)</p>
      <p>In all honesty though, the occasional inconvenience of needing a phone on the road is handily offset by the incomparable feeling of being above it all and out of reach. I’ve realized that to me, it’s not about saving the few bucks, it’s about staying myself in this world, staying independent, handling my own emergencies “manually”. And I’m certainly not one to shun communication; it just seems to me that any communication done by telephone (mobile or landline, actually) can almost never be really relevant - and I hate wasting time.</p>
      <p>If I ever get a mobile phone, it’ll be to observe the lowly but proud<br>
      footsoldier that is the bitmap font in action, in the trenches.</p>
      <p>hhp</p>
