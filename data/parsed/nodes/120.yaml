    html: "<p><i>A funny thing about ethics derived from religions is that are appeals to moral authorities--gods--which their very existence is questionable. Myths aren't very strong foundations.</i> <br> <br>I can't speak for other religions, but as a Catholic I don't appeal to a moral authority for ethics. The orthodox Catholic teaching has always been that ethics derive from natural law, which is the objective character of created reality knowable by the human intellect. This objective reality is the creation of God, but direct appeal to God as moral authority is not necessary to know what is right or wrong: morality is built into the universe and into our own nature.</p>"
