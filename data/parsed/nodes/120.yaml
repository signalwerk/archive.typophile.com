    html: <p><i>That's what I thought. But if you're not a Catholic or a devout Catholic or a Christian, what then? What do you call a war that is judged to be evil, good, just, immoral, liberating, mercenary etc depending on whatever country or culture or church the spectator happens to be in?</i> <br> <br>The just war tradition happens to be have been developed within the context of Catholic ethics, beginning with St Augustine, but I think a case could be made by agnostics, people of other faiths, and even atheists that the tradition stands outside that context. Succinctly, one could say that the just war tradition is necessary for Christians, but Christianity is not necessary to the just war tradition. The idea of a just war, the <i>ad bello</i> conditions for such a war and the <i>in bello</i> conduct during such a war, can be defined independently of specifically Catholic or Christian ethics (although orthodox Christians would point out that this is because natural law is part of a divinely created order). The idea that a defensive war is just while an aggresive war is not does not require a belief in a deity, a saviour, the resurrection, the real presence of the eucharist, or any other Catholic doctrine. On the other hand, I do believe that ethics divorced from religion have a tendency to become very shaky and may slip into the kind of relativism you describe.</p>
