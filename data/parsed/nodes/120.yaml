    html: <p><i>The peace signs are a political statement, yes. But as such they are pretty neutral.</i> <br> <br>I sure as heck hope they're not neutral. Peace isn't a likely outcome of wishful thinking. <br> <br>I'm opposed to the war for specific moral reasons that I suspect differ from those of a lot of other contributors to this thread. For me, whether the Iraqi people are better or worse off after the war than before is not sufficient reason to either support or oppose the war. Likewise, the justifications put forward by Bush and Blair are largely beside the point. Similarly, Jacques Chirac may be rightly concerned about US hegemony in the Middle East, but that wouldn't in itself be grounds to oppose the war. Quite simply, this war completely fails to conform to the criteria for a <i>just war</i> that have been laid down, debated and asserted for some 1,600 years, and which I believe provide the only sound moral guidance to the questions of when a war is just and how a just war should be fought. It is on these grounds that the Pope has spoken out against the war, and I believe his reasoning, and that of his theologians, is sound. I've read the lectures and essays by some US Catholics who attempt to jerry-rig just war philosophy to fit the circumstances, but I am unconvinced by their contortions. Ironically, as a fellow Catholic, John Butler may have a better appreciation of my opposition to the war than some people 'on my side'.</p>
