    html: <p><i>...this war completely fails to conform to the criteria for a just war that have been laid down, debated and asserted for some 1,600 years, and which I believe provide the only sound moral guidance to the questions of when a war is just and how a just war should be fought</i>  <br>  <br>But I think the debate is over now, John. The illusion that a state can be run morally and that there is any such thing as international law has been knocked on the head. The US government is in such a powerful position that it can do what it wants.   <br>  <br>Despite the moral register used by Whitehouse spokesmen, the US government has chosen an amoral path. Its actions are based on ethical decisions about the pros and cons of whatever it happens to be doing at the time. Opposing the invasion and occupation of Iraq (this isn't a war) with moral arguments is a waste of energy.  <br>  <br>And I think the Vatican is fully aware of this.   <br>  <br>Matha</p>
