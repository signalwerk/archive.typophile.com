    html: "<p><i>Opposing the invasion and occupation of Iraq (this isn't a war) with moral arguments is a waste of energy.</i> <br> <br>I disagree, because I see the moral argument as the only sound one. The fact is, from purely political arguments I could go either way on the Iraq war: hypocrisy and uncertainty of motive and evidence exist on both sides. To try to maintain a consistent position on purely political grounds is futile, because there is the <i>possibility</i> that the other side is more correct or less incorrect. The just war tradition provides an ethical framework for looking at any conflict from a non-political perspective, which is its enduring strength. Even if it were now discovered that Saddam Hussein was hiding a nuclear weapons program in the desert and proof positive was found of his intention to sell or give weapons of mass destruction to terrorist organisations, the US invasion of Iraq still failed to meet the criteria of a just war (<i>ad bello</i> at least; I'm not sure that we have enough information to judge US conduct <i>in bello</i>). The fact that no such evidence is forthcoming is certainly convenient for those opposed to the war. but the moral argument stands whether such evidence is found or not, because such evidence was not in US possession when they launched the war. <br> <br>The US has not chosen an 'amoral path': the just war tradition and Catholic morality do not provide for amorality. Shooting without being able to clearly see what the target is is not amoral, it is immoral. Exercising our ability to say that it is immoral, and to explain why it is immoral, is never a waste of energy.</p>"
    html_clean: "<p><i>Opposing the invasion and occupation of Iraq (this isn't a war) with moral arguments is a waste of energy.</i> <br> <br>I disagree, because I see the moral argument as the only sound one. The fact is, from purely political arguments I could go either way on the Iraq war: hypocrisy and uncertainty of motive and evidence exist on both sides. To try to maintain a consistent position on purely political grounds is futile, because there is the <i>possibility</i> that the other side is more correct or less incorrect. The just war tradition provides an ethical framework for looking at any conflict from a non-political perspective, which is its enduring strength. Even if it were now discovered that Saddam Hussein was hiding a nuclear weapons program in the desert and proof positive was found of his intention to sell or give weapons of mass destruction to terrorist organisations, the US invasion of Iraq still failed to meet the criteria of a just war (<i>ad bello</i> at least; I'm not sure that we have enough information to judge US conduct <i>in bello</i>). The fact that no such evidence is forthcoming is certainly convenient for those opposed to the war. but the moral argument stands whether such evidence is found or not, because such evidence was not in US possession when they launched the war. <br> <br>The US has not chosen an 'amoral path': the just war tradition and Catholic morality do not provide for amorality. Shooting without being able to clearly see what the target is is not amoral, it is immoral. Exercising our ability to say that it is immoral, and to explain why it is immoral, is never a waste of energy.</p>"
