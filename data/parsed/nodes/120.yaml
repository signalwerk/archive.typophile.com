    html: <p><i>The just war tradition is only necessary for christians who are trying to worm out of following the teachings of Christ.</i> <br> <br>Absolute, radical pacifism has always been an extreme minority position within Christianity, typified by, for example, the Quakers. I don't see any hypocrisy in asserting that those who seek and make peace are blessed while at the same time acknowledging that it is just to defend oneself or one's neighbour against violent aggression. <br> <br>It is possible, of course, to point to all sorts of abuses of the just war tradition, i.e. to attempts to justify aggressive wars undertaken for self-serving motives, but this does not undermine the legitimacy of the tradition.</p>
