    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Optima&nbsp;nova</strong></p>
    <p>A complete redrawing, revision, and extension of <a href="/node/15685" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optima</a>, one of <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>’s most successful typefaces, released by <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> in 2002. Designed by Hermann Zapf and <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a>.</p>
    <p>The Linotype website has complete overviews of the <a href="http://www.linotype.com/1305/optima-family.html">original Optima type family</a>, as well as the <a href="http://www.linotype.com/54142/optimanova-family.html">Optima nova fonts</a>.</p>
