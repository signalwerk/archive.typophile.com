    <p><strong> <a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Optima nova</strong></p>
    <p>A complete redrawing, revision, and extension of <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>, one of <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>'s most successful typefaces, released by <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> in 2002. Designed by Hermann Zapf and <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a>.</p>
    <p>The Linotype website has complete overviews of the <a href="http://www.linotype.com/1305/optima-family.html" rel="nofollow">original Optima type family</a>, as well as the <a href="http://www.linotype.com/54142/optimanova-family.html" rel="nofollow">Optima nova fonts</a>.</p>
