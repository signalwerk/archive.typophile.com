      <p>FWIW. The significations of those descriptors may overlap a great deal. But if we look for what sets them apart, here are some of their distinctive meanings:</p>
      <dl>
      <dd>обычный ≈ usual<br>
      обыкновенный ≈ plain<br>
      прямой ≈ upright<br>
      нормальный ≈ normal<br>
      регулярный ≈ orderly<br>
      простой ≈ simple</dd>
      </dl>
