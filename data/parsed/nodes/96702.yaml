      <blockquote><p><em>Why then are you recommending the masculine form as being preferred these days?</em></p></blockquote>
      <p>Because the gender agreement between the adjective determinans (the style) and the noun determinatum (<em>shrift</em>, the name of the typeface)—often assumed—makes sense.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Assortiment_Shriftov_3676.gif"></div><br>
      The examples of such usage are many, e.g., <em><a href="http://www31.ru/book/font/248-serija-latinskogo-shrifta.html" rel="nofollow">Латинский светлый</a></em>, <em><a href="http://www31.ru/book/font/249-serija-akademicheskogo-shrifta.html" rel="nofollow">Академический полужирный узкий</a></em>, <em><a href="http://www31.ru/book/font/250-elizavetinskijj-shrift.html" rel="nofollow">Елизаветинский курсив</a></em>, <em><a href="http://www31.ru/book/font/247-standartnye-shrifty-dlja-ruchnogo-nabora.html" rel="nofollow">Альдине полужирный курсив</a></em>, <em><a href="http://www31.ru/book/font/" rel="nofollow">Коринна светлый и полужирный</a></em>, <em><a href="http://www.paratype.ru/pstore/fonts/Reforma-Grotesk.htm" rel="nofollow">Узкий Тонкий Гротеск</a></em>, etc. Designations like <em>Латинский</em> 〈<em>m</em>〉 <em>жирное</em> 〈<em>n</em>〉, or <em>Академический</em> 〈<em>m</em>〉 <em>полужирное узкое</em> 〈<em>n</em>〉 look, and are, really odd. <p></p>
      <blockquote><p><em>ParaType and Lebedev are, AFAIK, the most prominent Russian online font stores.</em></p></blockquote>
      <p>Cannot tell for Lebedev, but ParaType is indeed very prominent.</p>
