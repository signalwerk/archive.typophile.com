      <p>The Gill example may be confusing, because in digital fonts the typeface that was often labelled in specimens as 'Gill Ultra' is packaged as 'Gill Sans Ultra Bold'. I was looking for an example of a typeface whose actual name includes an adjective. Fette Fraktur might be a better example.</p>
      <p>The alternative would be to make all parts of the <em>font</em> name masculine, regardless of whether they are part of the <em>typeface</em> name or merely weight/style descriptors. That would be fine, I suppose, in that it would result in naming as ambiguous as in English. :)</p>
