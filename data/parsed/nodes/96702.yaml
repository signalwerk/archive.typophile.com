      <blockquote><p>
      I guess it’s like the situation with Regular/Normal/Book in English.
      </p></blockquote>
      <p>In fact, all 42 occurrences of  Обычный I found in <code>/library/fonts</code> as well as the 14 occurrences in <code>/library/fonts/microsoft</code> have "Regular" as the corresponding English (US) SubFamily name; as for AlBayan (an Arabic font) said to be "Прямой" , in is "Plain" in English (US), "Standard" in German, "Normaal" in Dutch, "Simple" in French and Spanish etc.</p>
