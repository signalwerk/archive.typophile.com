      <p>Nick, I <cite>am</cite> sure.</p>
      <p>Russian/Soviet typographic nomenclature was a calque from German. So the next weight up from the Regular was always <em>poluzhirnyi</em> (<em>halbfett</em>), not <em>zhirnyi</em> (<em>fett</em>). The <em>zhirnyi</em> was kept for what the English-speaking typographers would call ‘extrabold’. To add to the confusion, the Regular weight was called <em>svetlyi</em>, ‘light’. </p>
      <p>Take a look at the official description of <a href="http://base.gostedu.ru/424/42409/3.gif" rel="nofollow">Severnaya</a> typeface, dated 1971. It was available in three versions: <em>С1: Прямое нормальное светлое</em> (‘Upright Regular Light’), <em>С/1: Курсивное нормальное светлое</em> (‘Italic Regular light’), and <em>С3: Прямое нормальное полужирное</em> (‘Upright Regular Demibold’); the latter was, in fact, the Bold.</p>
      <p>Now compare it with a relatively recent announcement of a new digital typeface, <a href="http://paratype.ru/cinfo/news.asp?NewsID=76" rel="nofollow">Susan</a>, by Manvel Shmavonian (ParaType, 2007). It is offered in 4 versions: <em>Нормальное</em>, <em>Наклонное</em>, <em>Жирное</em>, and <em>Жирное наклонное</em> (Regular, Oblique, Bold, and Bold Oblique).</p>
      <p>I remember the German and the Hungarian compositors who worked for my company confused by the typographic mark-up done by our copy-preparers who always called Monotype Series 334 <em>Таймс полужирный</em> (Times Demi-bold), and the typesetters thought they wanted Series 421 (Times Semi-bold) which was not, and is still not, available in Cyrillic…</p>
      <p>To answer your last question. Lebedev uses the old Soviet weight designations, slightly updated (the Regular is no longer called <em>svetloye</em> but <em>normalnoye</em>). Both he and <a href="http://paratype.ru/cinfo/news.asp?NewsID=76" rel="nofollow">ParaType</a> use the neuter, not masculine, form.</p>
      <p>As to the traditional German weight nomenclature, I vaguely remember that in one of the older threads Erik Spiekermann provided very enlightening comments on all those confusing designations, like <em>dreiviertelfett</em>, <em>kräftig</em>, <em>schwer</em>, and the like.</p>
