    html: |-
      <p>@Nick Shinn:</p>
      <p>Given Maxim's initial explanation,</p>
      <p><cite>These days the masculine, not the neuter, form is preferred: полужирный, жирный—referring to шрифт 〈m〉 (‘type’), not to начертание 〈n〉 (‘style’, or ‘face’).</cite></p>
      <p>which makes a lot of sense to me, there is no contradiction between the masculine form being generally preferred nowadays and some foundries using the neuter form.</p>
      <p>If you use the masculine form, you're saying that it is the "shrift" that is bold or italic - here's a bold Arial, there's an italic Arial. If you use the neuter form, you're saying that it's the weight of the typeface to which the attribute applies: here's Arial in a bold weight, here's Arial in an italic weight.</p>
      <p>So, even if masculine is more popular in this age of Microsoft Word, the neuter may be more typographically correct - which would explain ParaType et al bucking the trend.</p>
      <p>So now you can make an intelligent choice of which gender to use, based on what you want to say.</p>
