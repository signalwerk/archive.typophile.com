      <p>Dear Nick,</p>
      <p>In current Russian weight nomenclature <em><a href="http://paratype.ru/help/term/terms.asp?code=304" rel="nofollow">полужирное</a></em> corresponds to ‘semibold’ or to ‘demibold’. The Russian for ‘bold’ is <a href="http://paratype.ru/help/term/terms.asp?code=43" rel="nofollow"><em>жирное</em></a>. These days the masculine, not the neuter, form is preferred: <em>полужирный</em>, <em>жирный</em>—referring to <em>шрифт</em> 〈<em>m</em>〉 (‘type’), not to <em>начертание</em> 〈<em>n</em>〉 (‘style’, or ‘face’).</p>
