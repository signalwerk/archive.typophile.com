      <blockquote><p>there is no contradiction between the masculine form being generally preferred nowadays and some foundries using the neuter form.</p></blockquote>
      <p>One more confusing, gender-related, terminological aspect. In the Soviet times all text typeface names were femalized, e.g., from <em>Латинскій</em> (Berthold, 1901) to <em>Латинская</em> (later to <em><a href="http://standartgost.ru/%D0%93%D0%9E%D0%A1%D0%A2%203489.33-72" rel="nofollow">Литературная</a></em>), from <em>Академическій</em> (Berthold, 1910) to <em><a href="http://standartgost.ru/%D0%93%D0%9E%D0%A1%D0%A2%203489.26-71" rel="nofollow">Академическая</a></em>, from <em>Елизаветинскій</em> (Lehmann, 1907) to <em><a href="http://standartgost.ru/%D0%93%D0%9E%D0%A1%D0%A2%203489.12-71" rel="nofollow">Елизаветинская</a></em>, etc. That happened as a result of a governmental effort to regulate and standardise the ragtag, motley collection of fonts coming from various, formerly private, foundries (most of those fonts and matrices were simply destroyed). All text typefaces obtained a rank of a <em>гарнитура</em>—from German [<em><a href="http://de.bab.la/woerterbuch/deutsch-russisch/schriftgarnitur" rel="nofollow">Schrift</a></em>]<em><a href="http://de.bab.la/woerterbuch/deutsch-russisch/garnitur" rel="nofollow">garnitur</a></em>—that is, type family. <em>Гарнитура</em> and <em>Garnitur</em> are both feminine…</p>
    html_clean: |-
