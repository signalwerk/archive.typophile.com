    html: |-
      <blockquote><p>I was looking for an example of a typeface whose actual name includes an adjective. Fette Fraktur might be a better example.</p></blockquote>
      <p>I am not sure… Unlike style descriptors, the typeface names normally do not get translated into other languages: they get <em>transliterated</em>. ‘Fette Fraktur’ would be one of the few exceptions: <em>Жирная</em> 〈<em>f</em>〉 <em>фрактура</em> 〈<em>f</em>〉, not <em>Фетте фрактур</em>… Note the concord of <em>жирная</em> (determinans) with <em>фрактура</em> (determinatum). Some foundries offer Fette Fraktur in a number of styles (not weights), so, in line with the pattern you are proposing above, the listing of fonts developed by <a href="http://www.myfonts.com/fonts/urw/fette-fraktur/" rel="nofollow">URW++</a> could probably look something like that:<br>
      </p><dl>
      <dt><em>Жирная фрактура D</em> 〈<em>f</em>〉 <em>нормальное</em> 〈<em>n</em>〉;<br>
      <em>Жирная фрактура D</em> 〈<em>f</em>〉 <em>нормальное инициальное</em> 〈<em>n</em>〉 ; and<br>
      <em>Жирная фрактура D</em> 〈<em>f</em>〉 <em>оттененное</em> 〈<em>n</em>〉 .</dt>
      <dd></dd>
      </dl>
      <p></p><p>(I am not sure of the latter, though.)</p>
      <blockquote><p>The alternative would be to make all parts of the font name masculine, regardless of whether they are part of the typeface name or merely weight/style descriptors. That would be fine, I suppose, in that it would result in naming as ambiguous as in English. </p></blockquote>
      <p>Makes more sense to me… It’s just that the ambiguity of the English font naming is not gender-related.</p>
