    <p>I've been using FontExplorer for a good while. By far it has been my favorite management software to use, though the better part of its' usage has been on Mac. </p>
    <p>Until recently I purchased the software to use it in my Windows environment and has been wonderful, until now. I have a family of fonts that I wish to use but when I resume to activate them I have this message: You are trying to activate a font which has the same criteria as a font that is already activated....</p>
    <p>I'm at a lost because I'm pretty sure the fonts are named differently, even don't look the same in preview. Has anyone else ran into this problem or have a solution? This has become a real pain to deal with not being able to use the type. I would greatly appreciate any solutions.</p>
