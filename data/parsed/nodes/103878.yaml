    html: |-
      <p>Whether fonts looks the same is irrelevant to the font activation mechanism of Windows. If the full font name is equal, the fonts are considered identical and Windows won't let you install both at the same time. Of course it can be done manually (add both to the font related part of Windows Registry and reboot will do the trick), but that is not recommended. Actually our font manager will classify it as an error that should be fixed.</p>
      <p>On the other hand font selection usually doesn't care about the full font name, but that's another story.</p>
      <p>The solution is to uninstall the font(s) that have the same full font name. You can do this with any decent font manager. Of course you can also go to Windows fonts folder, and delete the font(s).</p>
      <p>Another less common solution is to rename the font names (not the file names), if the license permits it.</p>
