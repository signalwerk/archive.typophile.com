  html: <p>I've had DIN 16 in my stockpile of typefaces, and in my efforts to be legit, I am trying to find a place to buy it.  <br> <br>It was created by The Font Company which I can't find, and the only site that mentions it is <a href="http://www.atomictype.co.uk" target="_blank">www.atomictype.co.uk</a>, but that site hasn't been touched in years. <br> <br>DIN 16 looks like a rounded FF DIN.</p>
