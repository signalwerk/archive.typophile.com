      <p><em>I would suspect so on the old Adobe ones.</em></p>
      <p>I expected so as well, but it turns out different programs handle things differently. if you put a ‘hlig’ feature in your font, InDesign will apply this when you activate discretionary ligatures, Photoshop won’t. Same story with the ‘cswh’ feature and applying swash. Another thing, InDesign will link alternate glyphs to the reference glyph in the glyph palette without an ‘aalt’ feature, Illustrator won’t. It’s these types of things that i hope are cleared up in the near future.</p>
