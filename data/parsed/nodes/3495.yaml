    html: "<p>Hit the wrong button I guess. Edited: <br> <br>Hispania, which appears in the Solotype Catalog by that name, has <br>been digitized by others. At least two more versions exist, both of which <br>predate Scriptorium's Esperanza. <br> <br>There was David Rakowski's Dobkin Script. Found <a href=\"http://www.erik.co.uk/font/script.html\" target=\"_blank\"> here for Mac</a> <br>(the original) and <a href=\"http://www.dafont.com/en/search.php?q=dobkin&amp;nb_ppp_old=10&amp;page=1&amp;texte=Starved%20Rock%20Lodge&amp;nb_ppp=10&amp;Envoyer=%A0OK%A0\" target=\"_blank\"> here for PC</a> (an old conversion by someone other <br>than Mr. Rakowski). <br> <br>Ted Keener also digitized the typeface as Hispania KGD back in 1995. <br>Unfortunately, Mr. Keener's website disappeared a couple of years ago, <br>along with any online references that aren't ancient. Here's a screenshot:</p>"
    html_clean: "<p>Hit the wrong button I guess. Edited: <br> <br>Hispania, which appears in the Solotype Catalog by that name, has <br>been digitized by others. At least two more versions exist, both of which <br>predate Scriptorium's Esperanza. <br> <br>There was David Rakowski's Dobkin Script. Found <a href=\"http://www.erik.co.uk/font/script.html\" target=\"_blank\"> here for Mac</a> <br>(the original) and <a href=\"http://www.dafont.com/en/search.php?q=dobkin&amp;nb_ppp_old=10&amp;page=1&amp;texte=Starved%20Rock%20Lodge&amp;nb_ppp=10&amp;Envoyer=%A0OK%A0\" target=\"_blank\"> here for PC</a> (an old conversion by someone other <br>than Mr. Rakowski). <br> <br>Ted Keener also digitized the typeface as Hispania KGD back in 1995. <br>Unfortunately, Mr. Keener's website disappeared a couple of years ago, <br>along with any online references that aren't ancient. Here's a screenshot:</p>"
