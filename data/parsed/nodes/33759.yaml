    <p>FOR IMMEDIATE RELEASE<br>
    Monday, May 14, 2007</p>
    <p>================================<br>
    NEW LATINOTYPE FONT RELEASE<br>
    ================================<br>
    MOTE, a black-a-licious type.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Latinotype_Mote_4126.gif"></div><p></p>
    <p>Mote is the first typeface from Latinotype, a small new foundry based on latinamerican culture &amp; local vernacular lettering.</p>
    <p>Mote, a black-a-licious type is a modern interpretation of latinamerican lettering founded in Santiago de Chile "Mote" drink store.<br>
    The "Mote with Huesillos" is a traditional Chilean drink of sugary teaish water with a dried peach and bulgar wheat. We take this drink as a lovely chilean icon to represent our "Muy Delicious" lettering tradition in yummy tasty letters.</p>
    <p>- A unique &amp; friendly black typeface<br>
    - Up to 300 yummy glyph caps!<br>
    - Opentype / Western European ready<br>
    - Postcript flavoured curves</p>
    <p>More information:<br>
    <a href="http://www.latinotype.com" title="http://www.latinotype.com">http://www.latinotype.com</a></p>
