    <p>Hi,</p>
    <p>I recently posted a problem regarding an Opentype font (dearJoe 4) which seemed to be problematic when used in Word. Since then a couple of new problems have arised which are of a different nature and so my previous post’s title doesn’t quite fit the problem anymore. Since the previous post only got one reply I thought it might be a good idea to post this again, with a title that suits the problem better.</p>
    <p>So here’s the problems:</p>
    <p>“In Word:<br>
    The font is listed (in it’s style). When I select the font, the resulting type in the font window and the document says dear Joe 4, but looks like a standard font. It appears that it is not reading the font file, but is automatically substituting another font.</p>
    <p>In Photoshop:<br>
    The font name does not even appear in the list.</p>
    <p>In Corel Draw:<br>
    The font name appears in the list and the font works fine.”</p>
    <p>And also:</p>
    <p>“Testing the TrueType format of the DearJoe Four font in my Win2000 system using Publisher2000 and get an error message saying the font is not available on my system, however, when I selected ’use it anyway’ I was able to continue and use the font without fault.</p>
    <p>Using the font in a variety of alternate applications I found the font to function as expected, without fault.</p>
    <p>~however~</p>
    <p>Testing the font in a WinXP system in Publisher2003 I’m experiencing similar ’not available’ errors, however, I’m not getting the proper font when selecting ’use it anyway’”</p>
    <p>So obviously there’s something wrong with the font...<br>
    I have generated the font the same way as I always do and this problem has never occured. I just can’t figure out where the problem is. Maybe it’s got something to do with the fact that the font has A LOT of kerning pairs, but please, if someone would be so kind to check this font I’d be happy to send the file to them.</p>
    <p>Thanks in advance and best regards,</p>
