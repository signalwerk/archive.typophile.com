    html: |-
      <p>Better! You might want to do separate versions for positive and negative space that optically look the same, that's how the big agencies do it.</p>
      <p>Still unsure about the arrow stem, it's the sharp edges (as opposed to the soft ones elsewhere) that bother my eyes a bit too, and it's still narrower than the aperture of the G and S. Not sure anything sensible can be done about that, except possibly move the crossbar down (ie. left) a bit and widening the gap even more. Or removing the gap altogether, it can still be an arrow I guess. Not convinced either will work. :)</p>
