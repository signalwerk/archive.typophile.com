    <p>hi,</p>
    <p>I was hoping to get some feedback on this logo for a web based legal services provider. </p>
    <p>Specifically - whether the rotated A breaks the wordmark too much, and any thoughts regarding the spacing, negative arrow. Or anything else that comes to mind for that matter. </p>
    <p>Thanks in advance. </p><div class="imageWrap"><img src="http://typophile.com/files/il001_5409.jpg"></div><p></p>
