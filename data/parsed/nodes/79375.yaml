    html: <p>Thanks for the feedback so far. The round typeface is a stated preference of the client, who wants something vaguely informal/relaxed/web2.0-ish. This is the colour palette I'm leaning towards (pretty obvious, but green for instant - something more serious for legal). Cheers. </p><div class="imageWrap"><img src="http://typophile.com/files/il002_4563.jpg"></div><p></p>
