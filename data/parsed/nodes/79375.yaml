      <p>Purely aesthetically, the tiny stem of the arrow in the A bothers me - it's very thin compared to the rest of the counter space. Have you considered removing the crossbar entirely, for an even more web-2.0-ey play button effect?</p>
      <p>Also, does the "LTD" have to be there?</p>
