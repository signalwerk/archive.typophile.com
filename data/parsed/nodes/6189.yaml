    html: <p><i>My friend from Germany has told me of a great German book on typesetting and layout. But I do not read German.</i> <br> <br>If your friend is talking about <i>Der Typographische Raster/The Typographic Grid</i> by Hans Rudolph Bosshard, the text is in both German and English. I do not have this one yet, but it's on my list. It's available from <a href="http://nijhoflee.nl">Nijhof &amp; Lee.</a></p>
