  - id: 43492
    user: 1250
    date: 2003-01-13T14:07:00
    date_raw: 13 Jan 2003 — 2:07pm
    votes: null
    html: <p>Century Book Condensed's darkish color and generous x-height make it good for small text, but its narrowness doesn't... I think it's better for titling, where horizontal savings matter a lot. So consider something wider (unless you happen to have narrow columns). <br> <br>On the other hand, narrowness (which implies tallness) does convey a certain aura of class, which is probably good for your annual report. <br> <br>So assuming you don't have too much text to put in there, maybe try a lighter weight of Century Condensed, at a somewhat large size. <br> <br>hhp <br></p>
    html_clean: <p>Century Book Condensed's darkish color and generous x-height make it good for small text, but its narrowness doesn't... I think it's better for titling, where horizontal savings matter a lot. So consider something wider (unless you happen to have narrow columns). <br> <br>On the other hand, narrowness (which implies tallness) does convey a certain aura of class, which is probably good for your annual report. <br> <br>So assuming you don't have too much text to put in there, maybe try a lighter weight of Century Condensed, at a somewhat large size. <br> <br>hhp <br></p>
