    html: <p>Because of the crispness of this face, perhaps it would be less appropriate (readable) at small sizes. But, for an annual report... one must pause. :-} Maybe you could use century book for the text at 11 or 12 pt. (too big???) and lead in paragraphs bigger in the book condensed. Only suggestions. I do like this face. </p>
