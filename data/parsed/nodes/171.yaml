    html: <p>We used underlines in a brochure for a play at Schauspielhaus Bochum last year, as the text piece was a mock-up 70s style student/university- style. Bad Letter Gothic, Bad Letterspacing, too much text, awful image inserts and of course the inevitable underlining of whatever text the author deems important. Funny as hell, I still wonder who got the gag at all :-)... but other than that and apart from other cool visual ideas to be done with it,  underlining should be taboo in regular typesetting... </p>
