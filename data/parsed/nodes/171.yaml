    date: 2003-05-22T21:57:00
    date_raw: 22 May 2003 — 9:57pm
    votes: null
    html: "<p>Some brief, but recent, historical context: underlines came  <br>about because typewriters didn't have italics or bold for  <br>emphasis.  <br> <br>Now that we have italics and bold readily available,  <br>underlines just remain a leftover convention; an  <br>unnecessary homage to a time without an alternative. <br> <br>And it kills me that the web relies so heavily on these.  <br>Down with underlines! <br> <br>(I'm sure someone can point out a good use for them, <br>but at the moment I can't think of one.)</p>"
