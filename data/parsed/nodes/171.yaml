    html: <p>I'm pretty sure it ain't possible. <br> <br>You can, of course, draw one yourself, but it won't flow. I tried pasting one in and kerning back over it, but that wasn't happening either. <br> <br>One solution would be to not underline the offending descenders, as in this <u>exam</u>p<u>le</u>. <br> <br>Of course, I'll add that probably the reason you can't adjust underline preferences in InDesign (they're stuck at one-half point as well) is that underlines just aren't that pretty. I'll just assume that somebody is putting a gun to your head and insisting you use them. It has happened to me.</p>
