    <p>FONTWORKS NEWSLETTER // FEBRUARY 2006</p>
    <p>This month's newsletter is a Rian Hughes special celebrating the 10th birthday of Device Fonts and the release of the stunning new "Ten Year Itch" reference book to celebrate this landmark, available from Fontworks.</p>
    <p>Featured below:<br>
    - New Device Fonts Releases: check out the fonts which comprise Rian's "Zephyrmen" Collection 8<br>
    - "Ten Year Itch": details on this brand new 160 page must-have type reference book<br>
    - Special Offer: spend 99 GBP or more on Device Fonts at type.co.uk and receive the book absolutely free<br>
    - Competition: win a signed and numbered limited edition hardback version of Ten Year Itch<br>
    - Archive Device PDFs and interview with Rian Hughes on type.co.uk</p>
    <p>================================</p>
    <p>- NEW DEVICE FONTS COLLECTION 8: "ZEPHYRMEN"<br>
    Hot on the heels of Collection 7 ("Pagodaland") comes another 15 Device families released under the code name "Zephyrmen". As we've come to expect from Rian it's an extremely varied and versatile collection of type, ranging from distressed (Roadkill, Zond Diktat) to playful (Catseye, Custard), historical (Mulgrave is based on cast-iron Victorian street signs) to futuristic (Gentry, Gridlocker). The 7 weight "Ministry" typeface is a notable revival, created after viewing the Ministry of Transport signage designs in the National Archives in Kew. All new releases are magnificently detailed in the new Device book "Ten Year Itch" (see below). </p>
    <p>View and buy the Device 8 Collection:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/device8" title="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/device8">http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/device8</a></p>
    <p>- TEN YEAR ITCH: The definitive Device Fonts resource<br>
    Workaholic type designer and illustrator supreme, Rian Hughes celebrates ten years of font releases the only way he knows how, by sweating blood on a mammoth 160 page type specimen documenting the entire Device collection. Stuffed to the brim with samples, text settings, background info on each font and with a foreword by Erik Spiekermann this book is a visual feast for type fans. If you've admired Rian's work over the years the book will be indispensable. The softback version has fold out flaps featuring a cross section of logos designed for various clients and if you're really quick you may be able to purchase the extremely limited edition (only 150 exist) hardback volume with full colour dustjacket and a lime green embossed hard cover, signed and numbered by Rian. The book is officially unveiled in March but Fontworks have advance copies available to purchase now; e-mail <a href="mailto:sales@type.co.uk">sales@type.co.uk</a> to place your order.</p>
    <p>View books &amp; sample spreads in our Device Display Case:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/device10" title="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/device10">http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/device10</a><br>
    Read the Press Release with additional images:<br>
    <a href="http://www.fontworks4.type.co.uk:8081/pdfs/TYI_FW_PR.pdf" title="http://www.fontworks4.type.co.uk:8081/pdfs/TYI_FW_PR.pdf">http://www.fontworks4.type.co.uk:8081/pdfs/TYI_FW_PR.pdf</a></p>
    <p>- SPECIAL OFFER: buy Device Fonts and receive a free copy of the book<br>
    For a limited period and while stocks last we will be offering a complimentary softback version of "Ten Year Itch" (retail price 9.99 GBP) to customers spending 99 GBP or more on Device Fonts at type.co.uk or placing orders by phone or e-mail. Simply browse the Device Library online, place your order and the book will be despatched free of charge within 28 days. Please note that free delivery only applies to the UK.</p>
    <p>View and buy Device Fonts online:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/shop/catalog?q=byCatSubCat&amp;qa=font,Device" title="http://www.fontworks2.type.co.uk/fw/shop/catalog?q=byCatSubCat&amp;qa=font,Device">http://www.fontworks2.type.co.uk/fw/shop/catalog?q=byCatSubCat&amp;qa=font,D...</a></p>
    <p>- DEVICE COMPETITION: win a signed copy of "Ten Year Itch"<br>
    The hardback volume (retail price 19.99 GBP) is destined to become a true collectors item. We have 2 copies to give away and here's how you can win one of the individually numbered and signed books absolutely gratis: simply e-mail <a href="mailto:joe@type.co.uk" title="mailto:joe@type.co.uk">mailto:joe@type.co.uk</a> with "Device Competition" as your subject and name the Device typeface that has featured extensively in both Loaded and Heat magazines. Entries to be received by March 10th 2006 and the first 2 drawn out of the hat get the book. Please note that you must have a UK postal address to participate; please include this on your entry. Best of luck!</p>
    <p>- ARCHIVE DEVICE INFO ONLINE<br>
    Explore archive Rian Hughes and Device info on type.co.uk in our Display Case and PDF download areas.<br>
    View and download a Device PDF flyer:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/doc?d=public/download_pdf/download_pdf" title="http://www.fontworks2.type.co.uk/fw/doc?d=public/download_pdf/download_pdf">http://www.fontworks2.type.co.uk/fw/doc?d=public/download_pdf/download_pdf</a><br>
    View Device PDF spread from MacFormat magazine:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/macformat" title="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/macformat">http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/macformat</a><br>
    Read an interview with Rian conducted by publishers of "Device: Art, Commercial", Die Gestalten:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/doc?r=public/interviews&amp;d=rian_hughes" title="http://www.fontworks2.type.co.uk/fw/doc?r=public/interviews&amp;d=rian_hughes">http://www.fontworks2.type.co.uk/fw/doc?r=public/interviews&amp;d=rian_hughes</a></p>
    <p>To order Device fonts or speak to us about other type libraries, exclusive collections, custom font design, corporate and foreign language solutions please e-mail <a href="mailto:sales@type.co.uk">sales@type.co.uk</a> or call +44 (0)20 7226 4411.</p>
    <p>ENDS</p>
