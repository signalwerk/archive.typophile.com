    html: |-
      <p>I found Psalter Text digitally. See it on the 4th line down on <a href="http://www.romana-hamburg.de/fraktur5.htm" target="_blank" rel="nofollow">this page</a> of Gerhard Helzel's extensive collection of Fraktur fonts.</p>
      <p>He seems to be saying there that Mediaeval Gotisch by Flinsch and Psalter Gotisch by Krebs were the same typeface. Does that sound right, David?</p>
      <p>I communicated with Herr Helzel not long ago (about the otherwise undigitized <a href="http://www.romana-hamburg.de/antiqua.htm" target="_blank" rel="nofollow">Derby</a>). He prefers that the indicated amount in Euros be mailed to him, after which he will e-mail the font(s).</p>
