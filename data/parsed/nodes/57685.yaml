    <p>Hello, I'm trying to figure out what is and where I could find Twilight Zone tittle font or something really close.<br>
    I found TwyliteZone and it's not quite right: <a href="http://www.abstractfonts.com/font/2346" title="http://www.abstractfonts.com/font/2346">http://www.abstractfonts.com/font/2346</a><br>
    So any suggestions? It might be custom made back in the days, but next best thing would be that what is the closest to tittle font.<br>
    So maby it can be tweaked a little to make that horrific feeling to it.<br>
    Tanks a lot.</p>
    <p>-ABCDEFG<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TZ_3990.jpg"></div><p></p>
