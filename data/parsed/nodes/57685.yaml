      <p>Is your image from the TV show or some printed material? The TV show lettering would probably have been hand-drawn, considering the time period, but if it's from something later it could be a font. </p>
      <p>My thought would be to play around with <a href="http://new.myfonts.com/search/Albertus/fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Albertus</a> and distort the letters, particularly the serifs, until they are close enough.</p>
      <p>- Mike Yanega</p>
