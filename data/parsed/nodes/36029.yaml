    html: |-
      <p>I usually start with an ’a’ or an ’n’. The ’a’ has round and straight shapes, and a terminal (two even), which I find usefull for determining the general feel of the face. The ’n’ I use for the style of shoulder and connection to the stem(s).<br>
      But sometimes when I’m doodling without any real purpose I might be drawing a different character, and if it’s something worthwile, I will go from that.</p>
