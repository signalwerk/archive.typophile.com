    <p>I would like to know which glyph you start with when embarking on a new design. Do you always start with the same one? Why? Also, does one glyph set the tone for the rest of a face for you and why?</p>
    <p>I am finally taking a stab at my first face after years of wanting to, but would benefit from learning how you tackle a project and some of the rationale behind your approach. I think once I get rolling it will come easier, but I am not sure where to start.</p>
    <p>Thanks!</p>
    <p>Mike</p>
