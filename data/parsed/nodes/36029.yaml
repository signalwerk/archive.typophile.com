    html: |-
      <p>It depends on how I am feeling but for the ’sense’ of the design when I am sketching I will often go with a lower case a. Just for flavor. And then I go with o, then n. Then g. Not always. Sometimes a different glyph is what inspired me so I will push from there.</p>
      <p>When I digitize I go with o.</p>
