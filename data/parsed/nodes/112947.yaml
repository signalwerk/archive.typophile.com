    date: 2014-01-31T16:02:00
    date_raw: 31 Jan 2014 — 4:02pm
    votes: null
    html: |-
      <p>Definitely not a font. Simon Walker's lettering. Looks like stiff old Times Roman poured into a vortex to end up as a charming toilet paper lettering. To duplicate it, apply the buttery vertical strokes found in fonts like FF Tartine  Script <a href="http://www.myfonts.com/fonts/fontfont/tartine-script/" title="http://www.myfonts.com/fonts/fontfont/tartine-script/">http://www.myfonts.com/fonts/fontfont/tartine-script/</a> or Aspic <a href="http://www.myfonts.com/fonts/alias/aspic/" title="http://www.myfonts.com/fonts/alias/aspic/">http://www.myfonts.com/fonts/alias/aspic/</a> to the letters of your choice add ball terminals, do swooshing and you are there.<br>
      Don</p>
    html_clean: |-
      <p>Definitely not a font. Simon Walker's lettering. Looks like stiff old Times Roman poured into a vortex to end up as a charming toilet paper lettering. To duplicate it, apply the buttery vertical strokes found in fonts like FF Tartine  Script <a href="http://www.myfonts.com/fonts/fontfont/tartine-script/" title="http://www.myfonts.com/fonts/fontfont/tartine-script/" class="link-external">http://www.myfonts.com/fonts/fontfont/tartine-script/</a> or Aspic <a href="http://www.myfonts.com/fonts/alias/aspic/" title="http://www.myfonts.com/fonts/alias/aspic/" class="link-external">http://www.myfonts.com/fonts/alias/aspic/</a> to the letters of your choice add ball terminals, do swooshing and you are there.<br>
