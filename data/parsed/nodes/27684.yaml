    <p>+++</p>
    <p>Each year, The Special Collections &amp; Rare Books Department at Simon Fraser<br>
    University (SFU) convenes a special book-related event. This year we are pleased to celebrate our good friend and one of Canada’s living national treasures, the printer, typographer and publisher, Jim Rimmer. </p>
    <p>Jim’s career stretches back over fifty years and he has made many friends along the way, both at home and abroad: printers, type designers, publishers, students, teachers, design firms, binders, type founders, librarians, book collectors. . . Since many of these people are printers, we are inviting their participation in this public event by producing a broadside celebrating . . . Jim. The broadside may be any size and could include an anecdote or tribute, for example, and should include a signed colophon. We would like to have three copies of each broadside: two will be given to Jim; the third will reside in SFU’s Special Collections Department, which holds Rimmer’s archives. We will need all broadsides in hand by October 31, 2006.</p>
    <p>You may also send personal greetings and best wishes by email, card, fax -- any form you choose. In which case, please send three copies by October 31, 2006.</p>
    <p>The broadsides and greetings will be gathered then presented to Jim during the evening of the Rimmerfest, which will take place on 25 November at Simon Fraser University, 515 West Hastings St., Vancouver at 7:30 p.m. Robert Bringhurst, among others, will speak at this celebratory event. All are welcome.</p>
    <p>The broadsides and the greetings should be sent to</p>
    <p>Eric L. Swanick, Special Collections Department<br>
    Simon Fraser University<br>
    8888 University Drive<br>
    Burnaby, BC V5A 1S6<br>
    Canada<br>
    email: <a href="mailto:eswanick@sfu.ca">eswanick@sfu.ca</a><br>
    tel: 604 291 4626<br>
    fax: 604 291 3023</p>
    <p>I look forward to receiving these special items and seeing you on 25 November. By the way, Typophiles should check out the Rimmer Type Foundry at <a href="http://www.p22.com/rtf/index.html" title="http://www.p22.com/rtf/index.html">http://www.p22.com/rtf/index.html</a>.</p>
    <p>Thank you, </p>
    <p>Eric Swanick</p>
