    <p>I know that there are tons of 40s-50s style stuff available on-line from CSA, but I'm looking for more late 60s to early 70s stuff. Searching on eBay for "clip art books" is a waste of time, but I'm sure if I knew the titles of some of the more commonly available books of print shop clip, I could start with a more focused search. <br> <br>Anyone have some suggestions? Thanks.</p>
