    date: 2005-01-24T09:00:00
    date_raw: 24.Jan.2005 9.00am
    votes: null
    html: <p>I had forgotten about the Dynamic Graphics stuff. They did the "Clipper" series of stuff right? I suppose I always associated their stuff with the 80s, since we had stacks of their catalogs at the print shop I worked at in the early 90s, and they were filled with Nagel rip off illos for nail salons and "half off designer fashions" ads, along with checkerboard patterns, paint splats, and other assorted 80s-ness. <br> <br>Isn't the Letraset stuff mostly patterns and what not? I have thier 1994 catalog, and it's still stuffed with transfer type and Pantone paper. Ah, the olden days. <br> <br>The House stuff is great, but I'm looking more for the whole ironic type of illustration. Good because it's bad. <br> <br>Thanks for the suggestions!</p>
