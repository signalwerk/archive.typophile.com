    <p><strong><a href="http://www.fontbureau.com/fonts/Bullen/" rel="nofollow">Bullen</a></strong><br>
    Intrigued by a certain freewheeling eclecticism found in ATF faces from the turn of the 20th century, <a href="http://www.fontbureau.com/people/JulietShen/" rel="nofollow">Juliet Shen</a> constructed her own unabashedly quirky homage. Vivid character lends distinction, creating a notably clear text performance, even at small sizes. Named for Henry Lewis Bullen, influential printer &amp; ATF librarian, talented visionary &amp; erstwhile rogue, the typeface <a href="http://www.fontbureau.com/fonts/Bullen/" rel="nofollow">Bullen</a> is likewise both serious and offbeat; FB 2011</p>
    <p>4 Styles: Regular, Italic, Bold, and Bold Italic </p>
    <p>Bullen is available as OpenType fonts with tabular figures, arbitrary fractions, and extended language support.</p>
