  html: <p>I've been looking for a while now for the sans serif font made by William Caslon IV, considered the first sans serif font.  <br>I would have thought someone would have re-issued it by now. <br>All I could find was <a href="http://www.orangeitalic.com/fonts/caslon.shtml">this,</a> though. <br>Any ideas or people wanting to take on the challenge?</p>
