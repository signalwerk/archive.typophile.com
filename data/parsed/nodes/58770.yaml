    html: |-
      <p>Start by making similar characters consistent (not identical, just consistent). Look at the counters (negative spaces): <strong>G</strong> has a much wider counter than <strong>C</strong>, and <strong>B</strong> has much wider counters than <strong>D</strong>. The counters in <strong>Y</strong>, <strong>A</strong>, <strong>U</strong>, and <strong>V</strong> are all different widths. The bottom counters on <strong>K</strong>, <strong>R</strong>, and <strong>X</strong> all have rounded tops, but the bottom counter on <strong>A</strong> is flat on top. <strong>H</strong> looks like it's from a different alphabet because the vertical strokes are so thin and the counters are so wide.<br>
      Lowercase <strong>m</strong> and <strong>n</strong> are rounded, but lowercase <strong>h</strong> isn't. The descender on <strong>g</strong> is completely different from that on <strong>y</strong>.<br>
      Assemble these characters into some words and phrases. If you make the word <strong>CHOOSE</strong>, you'll see the problem with <strong>H</strong> right away, and when you compare <strong>C</strong> and <strong>O</strong>, you'll get a start on making your stroke weights consistent.</p>
