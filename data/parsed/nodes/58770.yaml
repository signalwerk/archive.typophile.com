    <p>The attached draft is based on a 1957 poster for "Invasion of the Saucer Men."  Please check it out and give me your feedback!  This is the first vintage remake (and full typeface for that matter) that I've undertaken and I know it could use some tweeking, but would love feedback at this early stage, both overall and also any specifics.  </p>
    <p>Here's a link to the original poster: <a href="http://www.idave.com/INVASIONSAUCER.jpg" title="http://www.idave.com/INVASIONSAUCER.jpg">http://www.idave.com/INVASIONSAUCER.jpg</a></p>
    <p>Thanks for your comments!</p>
