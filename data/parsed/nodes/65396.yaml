    <p>Hemingway designed by Alessandro Segalini was inspired by the prize winning novel <em>The Old Man and the Sea</em> by Ernest Miller Hemingway.</p>
    <p>Segalini designed his typeface to carry the meaning of sharpness and harshness, and at the same time to show a stiff and a soft quality – the same qualities in which the nature of the sea is revealed in Hemingway’s novel, a book that indeed speaks about the fairness of nature.</p>
