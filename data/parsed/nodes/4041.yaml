  html: <p>Hello Typophiles, <br> <br><a href="http://www.xtati.com/haus6/">Haus Nummer 6 Affair</a> is a gig I started in hope to decorate the dull walls of the house I live in - am actually renting a corner there, with a lamp and a sink. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I would be very glad to be able to hang the works of the real typophiles on the walls of the stair-way. I am even eager to give a typeface for this. <br> <br>You are all heartily welcome.</p>
