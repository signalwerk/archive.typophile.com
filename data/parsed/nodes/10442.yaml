  html: "<p>I'm currently (purely as a hobby project) developing a font which takes much of its inspiration from the carolingean minuscule. There it seems that an alternative variant of the letter r often is used after rounded characters - mostly o, but perhaps also after b and p? <br> <br>But how does it look, really? First I drew a glyph based on my initial impression of the nature of this variant: like the right part of a capital R. But after some further inspection of the few authentic instances that I was able to find on the 'net, I noticed that it instead looked more like a 2, and made a new glyph in that direction: <br> <br><a href=\"http://home.student.uu.se/jowi4905/mix/oror.png\"> Two variants of the alternative r.</a> <br> <br>Am I right in my first guess, that the alternative shape of r has developed as I described (from the right hand part of a regular R)? And does the first one of my two glyphs occur in medieaeval manuscript, and if so, how common is it compared to the \"2\" variant? That is, how unauthentic would it be, if I used the first variant (seeing that it probably is slightly more legible for modern readers than the second one)? <br> <br>Also, what is it called (if anything special)? (I tried searching for information on this, but I found it difficult to find much, since I didn't know what to call it.)</p>"
  html_clean: "<p>I'm currently (purely as a hobby project) developing a font which takes much of its inspiration from the carolingean minuscule. There it seems that an alternative variant of the letter r often is used after rounded characters - mostly o, but perhaps also after b and p? <br> <br>But how does it look, really? First I drew a glyph based on my initial impression of the nature of this variant: like the right part of a capital R. But after some further inspection of the few authentic instances that I was able to find on the 'net, I noticed that it instead looked more like a 2, and made a new glyph in that direction: <br> <br><a href=\"http://home.student.uu.se/jowi4905/mix/oror.png\" class=\"link-external\"> Two variants of the alternative r.</a> <br> <br>Am I right in my first guess, that the alternative shape of r has developed as I described (from the right hand part of a regular R)? And does the first one of my two glyphs occur in medieaeval manuscript, and if so, how common is it compared to the \"2\" variant? That is, how unauthentic would it be, if I used the first variant (seeing that it probably is slightly more legible for modern readers than the second one)? <br> <br>Also, what is it called (if anything special)? (I tried searching for information on this, but I found it difficult to find much, since I didn't know what to call it.)</p>"
