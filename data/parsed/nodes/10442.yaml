    html: |-
      <p>This form of 'r' was in common use in Irish manuscripts until the 17th century and it was also used in early Irish typefaces - the Queen Elizabeth typeface of the 16th century and the Rome and Louvain typefaces of the 17th century. I am sending a scan of a page from the first book ever printed in Irish (1571) as a new thread (it seems it isn't possible to do so in a reply). The scan shows the alternate 'r' highlighted in red. The contexts are as follows: 1. 'mór', 2. 'shaot(h)air', 3. 'ort', 4. 'uair.</p>
      <p>The character doesn't seem to have been included in any of the 18th century typefaces. My impression is that its use in manuscripts also declined during the 18th century and had probably ceased by the 19th century (except in cases where the scribe was trying to make a facsimile of an older manuscript). </p>
      <p>More recently, I have included the character in my 'Seanchló na Nod' and 'Bunchló na Nod' fonts - fonts that were created for those who wish to transcribe manuscripts. The alternative 'r' from 'Bunchló na Nod' can be seen in the table of common manuscript characters on the following page at the University College Cork website:</p>
      <p><a href="http://www.ucc.ie/faculties/celtic/lss/lit.jpg" title="http://www.ucc.ie/faculties/celtic/lss/lit.jpg">http://www.ucc.ie/faculties/celtic/lss/lit.jpg</a></p>
      <p>In this font, I followed the common scribal practice of having the bowl of the 'r' the same height as a 'c' and turning the leg of the 'r' into a descender. </p>
      <p>With respect to usage, the tendency in Ireland (both in manuscript and print) was to use the alternative 'r' in final positions at the end of words. Its use in medial positions was less common, and I have never seen it used in an initial position. I haven't noticed that there was a greater tendency to use it with round characters, but '-or' is a common ending in both Latin and Irish so this combination is especially common (however '-ir' is also a common ending in Irish and the alternative 'r' often occurs in this combination.</p>
      <p>Vincent Morley</p>
