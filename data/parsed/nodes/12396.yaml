      <p>Good work.</p>
      <p>I think that the top of the a extends a bit too far to the left. The letter looks like it might kip over in that direction.</p>
      <p>The f seems to fall toward the right more than the h does.</p>
      <p>The j doesn't seem right. I'm having troubles with both the top's in-stroke, and the tail on the bottom. The top in-stroke doesn't seem to be in harmony with the rest of the letters, and the tail could probably be a bit more interesting.</p>
