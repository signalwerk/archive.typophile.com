    <p>dear typophiles, </p>
    <p>i know this is very, very raw, but nevertheless is hope you have some advice on the general direction of these forms.<br>
    i am presenting it in this early stage because next week i'll take part in a workshop with jeremy tankard with the topic of "how to genereate a bold and italic from a regular". i'd like to work with my own stuff, therefore i decided to design a few letters as a basis - my aim will be to develop these sketches into a serious and usable font family ... someday.</p>
