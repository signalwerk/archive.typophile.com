      <p>&gt; it has occurred to me that the point is based on the inch</p>
      <p>Not really. It is now, at 72 points to the inch, but 20 years ago it was 72.27 (approximately) points per inch. Computer programmers didn't like the wild value, and rounded it down.</p>
