  - id: 26598
    user: 1250
    date: 2004-03-04T22:16:00
    date_raw: 4 Mar 2004 — 10:16pm
    votes: null
    html: "<p>The preeminent \"snap-on\" font is Matthew Carter's custom design for the Walker Art Center: <br> <br><a href=\"http://www.themicrofoundry.com/other/walker.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/walker.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/walker2.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/walker2.gif</a> <br> <br>In that case the snap-ons are indeed serifs, but they don't have to be. Basically you could make any sort of add-ons (with shapes assigned to keystrokes), and as long as you maintain the advance-widths of the base glyphs you can overlay them nicely. <br> <br>hhp <br></p>"
    html_clean: "<p>The preeminent \"snap-on\" font is Matthew Carter's custom design for the Walker Art Center: <br> <br><a href=\"http://www.themicrofoundry.com/other/walker.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/walker.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/walker2.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/walker2.gif</a> <br> <br>In that case the snap-ons are indeed serifs, but they don't have to be. Basically you could make any sort of add-ons (with shapes assigned to keystrokes), and as long as you maintain the advance-widths of the base glyphs you can overlay them nicely. <br> <br>hhp <br></p>"
