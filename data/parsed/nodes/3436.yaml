    html: <p>this typeface will also have a series of "snap-on serifs" that will show changes in American women's history.  the base font (women) stays the same, while as history (the snap on serifs) continue to add more and more facets to women.<img src="http://www.typophile.com/forums/messages/29/27830.jpg" alt="woman"></p>
