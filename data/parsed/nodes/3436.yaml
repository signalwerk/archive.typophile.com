    html: <p>this typeface is based on female proportions... all of the characters are narrow at the top and wider at the bottom to emulate the fact that women have narrower shoulders and wider hips than men <br>I wanted to eliminate descenders to keep the forms bulbous.</p>
    html_clean: <p>this typeface is based on female proportions... all of the characters are narrow at the top and wider at the bottom to emulate the fact that women have narrower shoulders and wider hips than men <br>I wanted to eliminate descenders to keep the forms bulbous.</p>
