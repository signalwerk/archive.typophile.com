      <p>Okay, I had a quick look at my specimens and this thing is a little more mysterious than it seemed at first glance. It will take a little more research, which I don't have time for right now. </p>
      <p>Here's what I've encountered so far. Artcraft is shown in both my BB&amp;S specimen (c. 1925) and my 1923 ATF catalog. I can't remember if BB&amp;S had joined ATF by 1923, but it would seem so; and yet there's the independent catalog, which I tentatively dated based on some Cooper Black evidence. No matter.</p>
      <p>The BB&amp;S samples do have mixed 'g's in the 10 point size. But there is no alternate 'g' shown among the displayed auxiliary forms. The Bold has one in the 8 pt showing. Not all sizes show examples of a 'g'.</p>
      <p>Offhand, right now I'm guessing that one of the 'g's is <em>wrong font,</em> and probably comes from the related Pencraft series.</p>
      <p>The ATF samples also show a wrong 'g' in the 18 pt size (and no alternate in the character set). The Bold also has a wrong 'g' in the 8 pt. *But* the thing is: ATF doesn't have Pencraft listed among their offerings. So where do the <em>wrong font</em> 'g's come from?</p>
      <p>I'll need to spend a little more time sleuthing when I get a chance. And I'll get some scans up.</p>
      <p>But don't hold your breath.</p>
      <p>-- K.</p>
