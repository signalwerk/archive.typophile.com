    html: <p>Perception is a big motivator in my opinion. <br> <br>I wonder what marketing studies have been done on the modern typography market - if any at all? Is there a study on why people buy type, what value they want ...etc.? <br> <br>It would be interesting reading. Most companies selling a product focus on the features and benifits of their product - it is cheap, easy to use and so on. But, often times a focus on the product or service misses the mark. Consumers buy for their own reasons. <br> <br>Some of this may seem obvious, but many companies have been surprised when an audit is conducted and they learn that their customers have been loyal for reasons never imagined by the company. <br> <br>BTW, I am refering to companies in general and not type foundries. <br> <br>Anyone have marketing data or reports they can share?</p>
