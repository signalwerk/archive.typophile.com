    html: <p>That's some great "field experience". <br> <br>I actually think 17 out of 700 isn't bad - that's about the typical telemarketing hit rate. Out of the hundreds of people who dowloaded it, how many made money from its usage? Let's be very generous and say 10%. So about 1 out of 4 people using the font to make money* paid for it. Maybe it's sad, but that's not bad at all! <br> <br>* This is a central distinction because otherwise it's mostly just a curiosity, and very few people would pay money for it - they'd just go get another "cool" font that's free. <br> <br>BTW, do you have a way of telling apart the all-caps and the full commercial version? <br> <br>hhp <br></p>
