    html: <p>-?/lN?u have a way of telling apart the all-caps and the full commercial version?  <br> <br>Yes, when we released Duchamp, we modified it slightly and improved upon the spacing. <br> <br>The funny thing was when Duchamp was available commercially from August 1994-November of 1995 about 4000 copies were sold vs. the 700+ downloaded and 17 paid for.  <br> <br>I think the fact it was available as a commercial product in a commercial venue, it was taken more seriously and purchased instead of traded. This is also before our product was available for download and only available as hard copy. <br> <br>Which brings up the question, While downloading makes things easier, does it promote piracy? </p>
