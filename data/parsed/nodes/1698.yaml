    html: <p>Reading this thread has been quite interesting. <br> <br> I would like to offer up an experiment conducted in 1994 (on Honesty and try before you play - or maybe it should be called pay) as part of Richard Kegler's thesis project. A font, "Duchamp", was created to be used within the main context of his Master's thesis, <a href="http://www.p22.com/projects/duchamp.html" target="_blank">http://www.p22.com/projects/duchamp.html</a> this font was only a single minor component of this installation.  This font was uploaded to AOL in December of 1993 as a shareware font - caps only, and if you used it in a commercial project or would like the lower case - $10 was charged. (Keep in mind this was the beginning of the internet as we now know it and traffic is not what it is today.) 700+ copies were downloaded by April 1994 and to date 17 "legal" copies have been purchased, from the original downloads, before it was pulled. The all caps version is seen even today on commercial products, in advertisements and in print. <br> <br>I am all for trusting your customer, and I continue to feel all intentions are good, but sometimes follow through falls a bit short in the end. <br> <br>We offer the type caster on our site for all those "try it before buying", printable and scaleable, it reduces the "I might buy it, if I could work with it first". <br> <br>Type designers are not like the record industry, large corporations with their fingers in the pockets of many, many artists in their stables to be able to finance the protection of their intellectual property. Type designers are independents and need to be able to create an awareness of how valuable a font can be, weither it be an identity or a campaign, they need to support each other and work together to promote a unified front - such as the record companies have done with the movie and publishing industries.  <br> <br>But on the other hand, unless an educated consumer (and we have to do the educating) licenses the fonts on their computer, and stops perpetuating the myth - "if it is on the internet it must be free", fonts will not have value in the eyes of people who write laws and handle intellectual property enforcement. <br> <br>Sorry, for the ramble. Just my two cents worth. and for the record. I have not downloaded a single MP3 or for that matter software I have not bought then and there.</p>
