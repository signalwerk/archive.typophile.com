    <p>Hi! I’ve been viewing these forums for some time, but I have yet to post. Maybe now that I’ve got my first one out of the way, I’ll see if I can help out instead of just asking questions.</p>
    <p>I’m pursuing a redesign of my school’s paper. I just took a look through the archives, and I found that our nameplate once was written in this great blackletter (later on we switched to what appears to be Monotype Engravers Old English, then to Times (ugh!)). I did a search on Identifont and What the Font, as well as searching through some blackletters online, but I couldn’t find anything that especially resembled it, especially the great uc letters. Using my Bringhurst, I think that it’s a fraktur or Schwabacher, but I’m not positive. I realize that this could be a typeface that hasn’t been made digitally (or a custom job), but I was wondering if anyone had any ideas about its identity.</p>
    <p>A little bit of further info: we used it originally from some time between 1932 and 1940. We then reinstated it from approximately ’91-’96. The latter fact lends a bit of hope to the fact that it might be digital, since we might have gone to Quark by that time. Thanks a ton.</p>
