    html: <p>Thanks for the input Mark. Seems to be a bit of a stumper as no one else has piped in.  <br> <br>I'm actually looking for fonts used in 19th century childrens' books, primarily for display copy in a current book of short stories. The stories are rather unsettling and very clearly for adults but are about some rather messed up pre-teens, so I want to play off the uptight Victorian aesthetic of those old, didactic children's books. Beatrix Potter was just a place to begin. <br> <br>Let me know if anyone has any leads or ideas I might pursue...</p>
