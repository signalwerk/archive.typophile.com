    html: <p>I've been working on Apple systems for the past ten years, or so. And don't get me wrong, I really, really like Apple as a brand — well, mostly, Apple as a hardware manufacturer and Mac as an operating system and the whole design aspect of all of these. But, as I noted, this is the first really nicely designed PC 'thing' I've seen/noticed, yet. (And it could run some Linux as well, doesn't have to be Windows, I guess.)</p>
