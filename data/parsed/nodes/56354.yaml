    <p><a href="http://adamobydell.com" target="_blank" rel="nofollow">adamobydell.com</a></p>
    <p>I think I fell in love with a notebook, and — it's not a Mac. This would probably be the very, very first PC I would choose over a Mac. It almost seems like someone left the Apple Design Team to work on the Adamo design. ;) Niiice.</p>
    <p>So, If anyone at Dell reads this — Come on, sponsor me with one of those, you know you want it. ;)</p>
    <p><em>(* I am not getting paid for this. Of course I am not. Actually, I wish I would. Even better yet, I would accept an Adamo as payment. ;) So consider this, Dell.)</em></p>
