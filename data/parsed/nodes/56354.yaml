      <p>At the risk of this turning into the old(/current) Mac/PC debate cliché, I respectfully would like to point out that you've been influenced by a nice ad campaign. A nice-looking machine running Windows is still running Windows. Sure, Apple hardware is attractive, too, but for most Mac users it's the experience on the whole, not just a pretty computer.</p>
      <p>And before this turns into the inevitable computer war that always ensues, please consider keeping it relevant to the original post (see above).</p>
