    html: <p>Well I blew them up so you could see them a little better.  It is optimized for 20pt. That is the smallest text on the page, which is the optimal size.  Any other bluriness could just be exporting it to jpeg.   <br> <br>it works the best at 100% at 20, 40, 60pt etc, though its not meant to be seen at those sizes.</p>
