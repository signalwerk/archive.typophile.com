  html: <p>Since nobody even seems to look at the Bitmap forum anymore I decided to post my face here too. <br> <br>Its hypothetical intention is to determine the truth or false nature of spoken word through vocal recognition software. It will be used as an option of captioning on a television and other digital applications, mainly cell phones. <br> <br>The alternate face is used to show vocal pattern inconsistencies during display. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/33835.jpg" alt=""> <br> <br>Yes, the X's in the regular cases are horrible. Any suggestions?</p>
