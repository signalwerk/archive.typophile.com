    <p>This font has been making the rounds lately on magazine covers and unfotunately all I can find on the web is a very small preview. Not much to work with, I know.</p>
    <p><a href="http://a1112.g.akamai.net/7/1112/492/20040528/www.wired.com/wired/covers/cover13_06.jpg" title="http://a1112.g.akamai.net/7/1112/492/20040528/www.wired.com/wired/covers/cover13_06.jpg">http://a1112.g.akamai.net/7/1112/492/20040528/www.wired.com/wired/covers...</a></p>
    <p>It’s a black condensed helvetica with very slight rounded corners.</p>
    <p>Any idea what it is?</p>
