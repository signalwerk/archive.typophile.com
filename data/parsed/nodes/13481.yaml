      <p>If you want a beautiful black condensed grotesque with rounded corners, why don’t you check <a href="/wiki/Peter%252BBruhn" class="wiki">Peter Bruhn</a>’s delicious <a href="http://www.fountain.nu/catalogue/ketchupa.asp" target="new">Ketchupa</a>, also available bundled with <a href="http://www.fountain.nu/catalogue/mustardo.asp" target="new">Mustardo</a> and <a href="http://www.fountain.nu/catalogue/mayo.asp" target="new">Mayo</a> in the Imbiss <a href="http://www.fountain.nu/catalogue/imbisspackage.asp" target="new">Package</a>.</p>
      <p><em> BTW These fonts are also available through your local FontShop.</em></p>
