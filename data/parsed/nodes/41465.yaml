  html: |-
    <p>I'm working on a project to give a facelift to an existing Java application. I am not a programmer and am dependant on a software designer I'm working with for info on what can and can not be done graphically. I presumed I would have at least as much flexibility designing for Java as I would for say, designing for the web with HTML and CSS, but I'm not so sure.</p>
    <p>The Java guy has been indicating that he doesn't think he can do this, or do that when I've been presenting comps so I'm starting to get worried. Does anyone have any experience or advice conering Java applications? Specifically...</p>
    <p>- Is the text anti-aliasing really as bad as I have been shown?<br>
    - Can more than one typeface family be accessed from within a single app?<br>
    - Can anyone refer me to any nicely designed Java apps so I can get a sense of what IS possible.</p>
    <p>I've been looking for info on the web, but I can very little current information about Java that concerns graphic design. It all seems to be about coding or at the best, UI design at the wireframe level.</p>
    <p>Thanks</p>
