      <p><a href="http://www.wefeelfine.org/" title="http://www.wefeelfine.org/">http://www.wefeelfine.org/</a></p>
      <p>It was built with Processing, which is a small framework for Java, although not really recommended for conventional applications. The type is a bit blurry at small sizes, but it's still probably the best looking Java applet I've seen.</p>
      <p>But I do believe that some things can be very hard to build with Java. That's why many developers prefer to build the application UI with Adobe's framework called Flex.</p>
      <p>-- <a href="http://www.omine.net/" rel="nofollow">omine.net</a></p>
