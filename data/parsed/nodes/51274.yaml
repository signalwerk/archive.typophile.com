      <p>So Jeremiah, do you like movies with gladiators? Do you like to shake things up in your life every now and then and eat pancakes for dinner? Any opinions on the unspoken, underlying paternal theme existing in the complex Batman-Robin relationship?</p>
      <p>Oh, wait a minute ... ah, I get it now. Silly me - all you wanted was for people to provide you with names of their favorite type foundries because you’ve got a developing interest in typography! I wonder what made me think you were looking for a intrusive psychological profile?</p>
      <p>Alright, so then just the foundries: Mr. Shinn up there already has provided a great start. I would especially recommend checking out “Brown” and “Worldwide,” my personal favorites there.</p>
      <p>Some others to see, with special emphasis placed size, quality and most of all, diversity:</p>
      <p><a href="http://www.textaxis.com" title="www.textaxis.com">www.textaxis.com</a><br>
      <a href="http://www.gestalten.com" title="www.gestalten.com">www.gestalten.com</a><br>
      <a href="http://andreubalius.com" title="http://andreubalius.com">http://andreubalius.com</a><br>
      <a href="http://fontsmith.co.uk" title="http://fontsmith.co.uk">http://fontsmith.co.uk</a><br>
      <a href="http://www.daltonmaag.com" title="www.daltonmaag.com">www.daltonmaag.com</a><br>
      <a href="http://blambot.com" title="http://blambot.com">http://blambot.com</a><br>
      <a href="http://www.felicianotypefoundry.com" title="http://www.felicianotypefoundry.com">http://www.felicianotypefoundry.com</a></p>
      <p>These will get you started; if you’ve seen ’em, raise the flag and I’ll toss out some more. Disclaimer: These are not my “favorites” nor do they represent what I consider the “best” ones; however they are all very good and not what I’d call particularly mainstream like, for example, “fonts.com.” Let me know what you find.</p>
