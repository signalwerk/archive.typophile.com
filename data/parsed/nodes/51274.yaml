      <p><strong>[…] what you guys think are some of the best foundries.</strong></p>
      <p>Maybe it’s more useful to start by looking which “foundry” is offering the best conceived digital typefaces. If you are looking fos strictly typographical styles, I would start by looking at which types you like more, and then see which renditions and stylizations are among the best available as digital type.<br>
      For example, with Garamond types, or Jenson and Caslon, you may have a lot to evaluate, and then see what works best as a digital version, which is more carefully rendered, which is more solid, or more complete in terms of glyph coverage, etc.</p>
