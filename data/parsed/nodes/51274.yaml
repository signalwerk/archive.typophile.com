      <p>My comment about Alias was because I see a lot of David James &amp; Gareth Hague’s intutions (but others as well) in letterforms picked up by the designer(s?) of Textaxis.<br>
      For example, the typeface Borneo has a lot of forms influenced by Alias’ MetSys (which, in turn, was based on James’ lettering for the early 1990s album covers of Steve Hillage’s band System 7).<br>
      Inercia and Suite owe a lot to FF Dax (1995-1997) and the previous Barmeno (1983) by Hans Reichel;<br>
      Oneline is heavily influenced by Alias’ Progress (2002);<br>
      Latina Italic owes an lot (in terms of stylization) to John Downer’s Triplex (1985), and so on…</p>
