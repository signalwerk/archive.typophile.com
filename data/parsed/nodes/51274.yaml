      <p>Well, with that term I tried to compensate my lack of immediate expression in English language…<br>
      I used it to describe the state of typography (simply seen as the mechanization of the process of setting lettering, not as “fine typography” as commonly used) as it was hit by the tornado of the so-called “digital revolution”. Many designers (mostly graphic designers) generated a true “avant-garde” movement on international scale, as type design stopped to be “a brave and arcane business” in the hands of a few, a notion expressed by Matthew Carter in an interview around 1993.</p>
      <p>Hmm… Try to locate the article “The Digital Wave” by Robin Kinross, from an old issue of Eye Magazine, to look at Rick Poynor’s articles in the first issues of the same, and at his book “Typography Now” (issue 1). Locate some Cranbrook or CalArts catalogue, the narratives behind the works of Jon Barnbrook, Miles Newlyn, Jeffery Keedy, Frank Heine, Sue LaPorte, P. Scott Makela, Barry Deck and others in earlier issues of Emigre, and then you may have an idea of all the earthquake these caused in my mind of self-taught designer in process… :=)</p>
