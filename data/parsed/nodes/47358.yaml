      <p>I think the idea is appealing, so I hope I can explain without graphics:</p>
      <p>The central element has a large centre with letters on both sides (stems). Except for the yod on the right, you have to guess them all. Without knowing which letters you mean, I read (RTL): ain, yod, mem sofit, mem sofit.</p>
      <p>Then, simha is not happy at all with the het and heh looking the same.</p>
      <p>By the way, you should discount my modern bias.</p>
