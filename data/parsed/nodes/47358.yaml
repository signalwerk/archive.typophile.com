    <p> I'm getting married soon, and I've been playing with this concept for a monogram on our wedding invitations. (Actually, I proposed with this design!) My initials in Hebrew are ייש, my fiancée's are הה, and my last name is spelled with a ש.<br>
     The basic idea was one of these two designs:</p><div class="imageWrap"><img src="http://typophile.com/files/monogram concept_5764.jpg"></div>I preferred the first, and the drafts below reflect that, but some folks have suggested the second version.<br>
     Trouble I'm having is with the middle head of the large ש. I've tried for something abstract, but I'm worried that it still looks like something "belongs" there. I avoided the usual shape for the middle head for exactly that reason: it looked like the letter ז or ו was intended.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/monogram draft ii_6540.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/monogram draft_4667.JPG"></div><br>
     Any hints?<br>
    —Joel (יואל יחזקאל שרגא שאלאמון)<p></p>
