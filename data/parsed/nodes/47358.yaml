      <p>David: I see where the <em>ḥet</em> (ח) &amp; <em>heh</em> (ה) might be confused (sorry simḥa!), but that's a bug in the Hebrew alphabet. If I were turning the surrounding text into a font I might try to differentiate them more, but in this context, with its well-known quote¹, I figured I could prefer ‘pretty’ over ‘more readable’.<br>
       That the <em>ḥet</em> (ח) looks somewhat like the <em>mem</em> (מ) from some fonts is harder for me to see; it certainly doesn't look like the <em>mem</em> I'm using! Similarly with the <em>shin</em> (ש) and the Rashi script <em>bet</em> (ב): there's some similarity, but no real possibility of confusion.<br>
       The <em>vav</em> (ו)/<em>yod</em> (י) confusion is less excusable, so a bit of background: The style of the surrounding text came from an experiment I'd done in how wide I could extend Hebrew letters and have them recognizable. To distinguish the <em>vav</em> (ו) from the <em>yod</em> (י) from the <em>resh</em> (ר) I chose to make the <em>yod</em> as short as I could while keeping the basic shape and making the <em>vav</em> the narrow exception to the extended style. The `bump' on the <em>shin</em> (ש) and the awkwardness of the <em>ayin</em> (ע) are both also results of this original design. I liked the <em>alef</em> (א) I'd done, but it's only here in the tiny text.</p>
      <p>Eran/Simḥa: I vaguely see an <em>ayin</em> (ע) in the right stem—where I’d intended <em>yod yod shin</em> (ייש), but I cannot see how the <em>heh heh</em> (הה) on the left looks like a <em>mem mem</em> (םם) to you. I guess I should take it in account anyhow.<br>
       … But: Once you know what letters they're supposed to be, do you see them, or still what you saw first? It doesn't need to be obvious <em>a priori</em>; if it works <em>a posteriori</em> it's good too.<br>
       (Modern bias?)</p>
      <p>—Joel</p>
      <p>1. Jeremiah 33:10–11: “Yet again there shall be heard … in the cities of Judah, and in the streets of Jerusalem, … (11) the voice of joy and the voice of gladness, the voice of the bridegroom and the voice of the bride”.</p>
