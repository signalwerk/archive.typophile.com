    <p>Hi there Typophiles.</p>
    <p>So, here's the situation: I'm putting together an invitation for a Real estate Company for prospective sellers offering a free market appraisal or house valuation. The company in question is very well established (over 200 years) and a bit posh.</p>
    <p>I'm looking for a nice script font which is traditional and a bit posh without being old-fashioned or screaming wedding (Edwardian Script, Balmoral). Legibility is very important and I would prefer if the caps wernt too fancy.</p>
    <p>Any suggestions much appreciated</p>
