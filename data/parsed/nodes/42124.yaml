    html: |-
      <p>I just released a python rounded corner script for FontLab yesterday at <a class="freelinking external" href="http://betatype.com" rel="nofollow">http://betatype.com</a>. It's very nuts and bolts, but it allows a user to select the points he/she wants rounded, configure x and y radius, as well as the length of the bezier handles, influencing the steepness of the curve. </p>
      <p>It definitely isn't designed to be automatic where you can point it at a whole font and expect some magic new design to come out of it. That never works anyway. You really need to pick the corners that need to be rounded, and by how much.</p>
    html_clean: |-
