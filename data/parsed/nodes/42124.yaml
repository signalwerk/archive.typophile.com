      <p>I wrote a rounded corners Python script for my <a class="freelinking external" href="http://justanotherfoundry.com/Masnine" rel="nofollow">Mashine Rounded</a> but that only accepts straight polygons as an input so it probably wouldn't help you much.</p>
      <p><a class="freelinking external" href="http://www.typophile.com/user/8183" rel="nofollow">Georg Seifert</a> showed me a rounded corners script he has written for FontLab. It is really sophisticated: it gives obtuse angles a greater curve radius in order to make it visually consistent!</p>
      <p>Maybe you can convince him to share it, it is probably better than anything else out there.</p>
