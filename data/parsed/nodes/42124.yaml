      <p>When looking through Hrant's proposal for an ink trap formula, <a class="freelinking external" href="http://www.themicrofoundry.com/ss_trapping1.html" rel="nofollow">The Trapping Flower</a>, I too realized It could also be adapted to rounding corners as well (and further that the "flower" need not necessarily be circular). Of course, not being a programmer, I have no idea as to how to automate this method.</p>
      <p>I'm curious as to how you did it, Frederik, and if your app could be adapted to run with FontForge, either as a Python script internally or as a post-process on .sfd files.</p>
