    html: |-
      <p>Hi</p>
      <p>Erik asked me a while ago for some scripts to "turn" corners into round ones.<br>
      I wrote a stand alone app to convert UFO's to rounded UFO's see ( <a href="http://www.typemytype.com/scripting/roundingufo/" title="http://www.typemytype.com/scripting/roundingufo/">http://www.typemytype.com/scripting/roundingufo/</a> )<br>
      and next to that i wrote also a FL script that does the same thing because its the same code :). It can add rounding to the whole font or just to one point in a  glyph (short movie: <a href="http://www.vimeo.com/704368" title="http://www.vimeo.com/704368">http://www.vimeo.com/704368</a> ) </p>
      <p>the input can be a corner with straight lines aswell as a combination with curves or just only curves. </p>
      <p>The parameters are the radius of the rounding and where you want rounding: in the black or white corners</p>
      <p>Erik used the standalone UFOrounding app for the round corners and superpolator for the interpolations :)<br>
      For the standalone app i also added inktraps because its basically the same thing: adding rounding or inktraps :)</p>
      <p>gr<br>
      Frederik</p>
