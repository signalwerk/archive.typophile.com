    <p>I’ve been trying to import eps files output from potrace and/or ghostscript into Fontlab with no success. Can anyone think of an automated way (as in accessible via script) to make this work without having to write a an eps interpreter or worse, a script for Illustrator?</p>
    <p>Just in case any Postscript hackers are reading this, I’m attaching the output from potrace. If there is a simple thing in the output that is offending Fontlab, I wouldn’t mind parsing the eps to strip it out.</p>
