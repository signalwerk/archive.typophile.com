      <p>Never mind the font, it would help if the logo designer knew what a rugby ball looked like, or could be bothered to render it with a more complex curve than an arc of circle. This looks like the more pointed American football, surely a <em>faux pas</em>.<br><img src="/sites/default/files/old-images/rwc_4444.jpg"><br><img src="/sites/default/files/old-images/ball2_4650.jpg"><br>
      But perhaps I am being too harsh and it is also supposed to represent a planetary highlight.</p>
