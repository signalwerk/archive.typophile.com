      <p>Never mind the font, it would help if the logo designer knew what a rugby ball looked like, or could be bothered to render it with a more complex curve than an arc of circle. This looks like the more pointed American football, surely a <em>faux pas</em>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/rwc_4444.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/ball2_4650.jpg"></div><br>
      But perhaps I am being too harsh and it is also supposed to represent a planetary highlight.<p></p>
