    html: <p>Does anyone else find it odd that so much discussion of the campaign logos and fonts is popping up in the mainstream media, but not much discussion of how much campaign design stinks overall?</p>
    html_clean: <p>Does anyone else find it odd that so much discussion of the campaign logos and fonts is popping up in the mainstream media, but not much discussion of how much campaign design stinks overall?</p>
  - id: 261261
    user: 103
    date: 2008-02-24T18:43:00
    date_raw: 24 Feb 2008 — 6:43pm
    votes: null
    html: <p>My guess is that the mainstream media feels it's not interesting enough to the general public. 5 minutes is about the limit of the non-designer's attention span for design and it's much easier to do a 5 minute piece on the logos than try to cover the general concept of each campaign in detail.</p>
