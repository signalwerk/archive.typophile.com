    <p><a href="http://www.onthemedia.org/episodes/2008/02/22/segments/94075" rel="nofollow">NPR's On The Media: Character Matters</a></p>
    <p><a href="/wiki/Sam%20Berlow" class="freelinking" rel="nofollow">Sam Berlow</a> was on one of my favorite radio shows this week parsing type for the layman in an entertaining fashion. See also his and <a href="/wiki/Cyrus%20Highsmith" class="freelinking" rel="nofollow">Cyrus Highsmith</a>'s <a href="http://www.boston.com/bostonglobe/ideas/gallery/012708_change/" rel="nofollow">article in <em>The Globe</em>)</a> which was <a href="http://www.typophile.com/node/41391" rel="nofollow">mentioned earlier</a>. He even alluded to Typophile in the interview, saying that there would be plenty of discussion about his claim that Hillary's campaign logo is set in Baskerville. Who will be the first to chime in?</p>
