      <p>Stéphane, Thank you for your comment.<br>
      Yes, I too noticed this. In the inscription there are a few “suspicious” items. It may be distorted during the printing (silkscreen?) and subsequent photography. In general, it looks too “neat”. For Sandberg, in particular.</p>
