    <p>Willem Sandberg liked to use stencil fonts. Usually they were “handmade”. But on one poster, I found a font that is very similar to typesetting. I'd like to know his name and origin. Thank you</p>
    <p>Note.<br>
    This piece of poster in 1973, from the book “Sandberg, vormgever van het Stedelijk”, p. 172 (010 Publishers)</p>
