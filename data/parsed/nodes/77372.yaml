    html: |-
      <p>I reactive this old post because I'm designing a typeface based on this Sandberg "Bodoni Stencil" lettering.<br>
      I found a complete lower case set in this book: <a class="freelinking external" href="http://www.modernism101.com/spencer_new_alphabets.php" rel="nofollow">http://www.modernism101.com/spencer_new_alphabets.php</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sandberg_bodonistencil_4747.png"></div><br>
      I ever used my font for this project:<a class="freelinking external" href="http://www.pavillonblanc-colomiers.fr/page/restitution-2012-2013" rel="nofollow">http://www.pavillonblanc-colomiers.fr/page/restitution-2012-2013</a><br>
      Evgeny'spost gave me some help for the numbers.<br>
      And now, I'm working on the upper case.<br>
      Perhaps somebodies found other Sandberg creations with this kind of handmade bodoni stencil in number or upper case ?<br>
      Thanks.<p></p>
