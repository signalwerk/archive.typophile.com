  html: <p>Does anyone have any links or recommendations on indepth analysis of the fonts of Neville Brody? There is alot out there about his use of type but I am looking for analysis of his type designs (the inspirations, methods of production, indepth look at particular letterforms, etc). I have his two monographs and have trawled the font bureau websites already...</p>
