      <p>"Is Industria also informed by constructivism?...</p>
      <p>Having been at a couple of his presentations and talked to him afterwards, it seemed that Nevile Brody rather overtly identified with the political zeitgeist of the 70s and 80s. I'd be surprised if constructivism weren't an influence for Industria as well as some of his other faces. For a designer of his profile, it is surprising that there aren't that many good studies online. </p>
      <p>"Gorbachev, perestroika..."<br>
      I'm not so aware of the particular influences of these on graphic design. Nick, I'd be grateful for any elaboration.</p>
