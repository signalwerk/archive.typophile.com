    html: |-
      <p>Insignia and Industria were done before FB got involved, but FF Blur, FF Typeface 6 and 7, FF World, FF Gothic, FF Tokyo, FF Typeface 4, and FF Pop were all developed with inspiration from logos and simple display faces made for NB's clients.  Methods of production were standard for this kind of work, with Brody providing T. Frere-Jones and myself with the existing work, we grew the glyph set to standard, separated various ideas engulfed in the designs into styles and weights that others could use, and bounced  particular letterforms across the sea. What started as 4-5 styles, ended with 10-12. Later, when all the main tasks were done, TFJ and I went to Berlin, finalized most of the details with NB and then the works were manufactured at FF and released. Blur was slightly different, with TFJ working on that with NB solo, mostly to establish some spacing that worked. </p>
      <p>I have not seen the monographs, what do they say?</p>
      <p>Cheers!</p>
