    html: <p>The book <a href="http://www.hyphenpress.co.uk/books/978-0-907259-17-6" rel="nofollow"><em>Unjustified texts</em></a> has an essay on Neville Brody which you might find interesting. Kinross also critiques Brody's early faces in <a href="http://www.hyphenpress.co.uk/books/978-0-907259-18-3" rel="nofollow"><em>Modern typography</em></a> (2nd edition). You should also check out a book called <a href="http://www.chroniclebooks.com/site/catalog/index.php?main_page=pubs_product_book_info&amp;products_id=3407&amp;store=books" rel="nofollow"><em>ABZ</em></a> (currently out of print) for constructivist faces that may have been an inspiration for Industria.</p>
