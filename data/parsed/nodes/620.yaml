  date_raw: 14 Jul 2003 — 1:10pm
  votes: null
  html: "<p>Several individuals and companies who want to help promote this year's ATypI conference have requested that we make web graphics available, so that these can be downloaded and used on websites as links to the conference site. These are now available and can be downloaded, with link code, from  <br> <br><a href=\"http://www.atypi.org/40_conferences/28_Vancouver/48_promotion\" target=\"_blank\">http://www.atypi.org/40_conferences/28_Vancouver/48_promotion</a> <br> <br>There are four graphics: a banner ad, and three narrower ads of different sizes. If you want to help promote the conference in this way, please download the image or images that you want to use and serve them from your own web account, rather than linking directly to the images on the ATypI server. <br> <br>If you would like to help promote the conference in other ways and are able to offer print media space or distribution, please contact Cynthia at the ATypI secretariat &lt;<a href=\"mailto:secretariat@atypi.org\">secretariat@atypi.org</a>&gt;. <br> <br>Many thanks to everyone who helps to make this conference a great success. <br> <br>John Hudson <br>ATypI 2003 programme planning committee <br><a href=\"http://www.atypi.org\" target=\"_blank\">www.atypi.org</a></p>"
