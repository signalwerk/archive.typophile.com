    <p>hi type nerds,</p>
    <p>i’m searching for books set in bembo (for part of a student type class poster). any book will do, since i intend to scan pages; the text can be old, new, interesting, boring, whatever. trouble is, i don’t know of that many. it looks like this is the place to ask. if you know of one. anybody able to help out?  ill credit you on my type poster.  maybe send you a handwritten thank you. the way it’s headed, this poster gon’ be solid gold.</p>
    <p>thank you mucho.</p>
