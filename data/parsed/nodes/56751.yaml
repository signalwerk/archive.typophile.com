    <p>Playing with logo ideas for a company that focuses on producing intuitive and visually polished software. In other words, it's about starting with a detailed design of the user experience and then dealing with technical details that support it. This may sound as an obvious approach, but very few products are actually developed this way.</p>
    <p>Thoughts ? Overall impression, etc..</p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ytsd-logo-1_6695.png"></div><p></p>
