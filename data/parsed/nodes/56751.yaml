      <p>@bobbybobo - I hear you on skipping over stuff that's hard to digest. It's a good point regarding the "we are not like others" message, which is incidentally true and I should've mentioned that at the beginning. It is also an excellent point that it says "we are difficult", I haven't considered this angle. Thanks for that. Any thoughts on how to alleviate this impression ? I realize your version does that, but somewhat at the expense of the "different" part.</p>
      <p>All in all, just to explain a situation a bit more. It is a small company, and the main focus is on the branding of the product rather than the company itself. The product is positioned as "unique, not like others" and (you are going to like this) "simple". So in a sense the company logo is secondary, and it just needs to be bold, unique and not to compete or contradict the product branding.</p>
      <p>@jakes - my take is that in the context of the <em>logo</em> design the readability should of course be considered, but it's just one of many factors. Some of these do not apply in other cases (e.g. a book design), and the readability floats to the top.</p>
