      <p>Well .. yeah .. I know that at the first glance it reads "..towns of tware..". But the idea here is that it's not that hard to figure out what it <em>should</em> read like. And once you do figure it out, the quirkiness of the initial impression makes the logo that much more memorable. I'm pretty sure the next time you see it, you will realize you saw it before.</p>
      <p>Just try to view it not as a text, but rather as a wordmark. Obviously if a novel were set in such a peculiar way, it would've been a disaster :-)</p>
      <p>BTW as some of you may remember we had <a class="freelinking external" href="http://typophile.com/node/52195" rel="nofollow">similar discussion before</a> in the context of the "precisionetworking" logo. And this logo is basically an evolution of the core idea behind that one.</p>
