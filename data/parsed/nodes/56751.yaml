      <p>Haha .. that's some quality feedback, guys and gals. Subjective and opinionated, the best kind. Thanks a bunch.</p>
      <p>@bendy - well, have you managed to "decipher" it on your own ? It could've not been THAT hard :)</p>
      <p>@sharon - it typically depends on the logo. There's plenty of logos that are effectively puzzles, especially those that make a heavy use of a neg space. They look nice at the first glance, but you can see something's off and there's something else going on. So you stare at them and then there's that AHA moment after which you remember the logo for a long time. So, yeah, they don't <em>need</em> to be puzzles, but they certainly <em>can</em> be.</p>
      <p>@joe324, @bobbybobo - these are certainly the options, but this effectively kills the core idea of my version - the quirkiness. The "software" is cut up in a strange way on purpose. If it's just "soft-ware" or "software", then the logo is just a collection of three words. They can be made look nice, but that's secondary. </p>
      <p>@litera - that's pretty much the exact effect I was going for. May be a bit milder and more accepting, but conceptually that's it :-) You will remember this logo now, right ?<br>
      Also, regarding what it should be saying - if you step back and consider basic color clues, it should be obvious how the words are split. Additionally, the logo will almost always be used in the context that would suggest it's a computer-related business, so that would give yet another parsing clue.</p>
      <p>@ratbaggy - simple and great idea, thanks. I will use it.</p>
    html_clean: |-
