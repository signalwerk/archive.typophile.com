      <p>@epsilicon: I feel you need an accesible design which says 'unique'. </p>
      <p>You say it needs to portrait 'simple'. Not to be negative, just hounest: your latest version says quit the opposite. It is hard to read. It is unique in a way. Which is most important?</p>
      <p>You have choosen a certain font and used certain colours.<br>
      Perhaps the answer lies in a different font and colours.</p>
