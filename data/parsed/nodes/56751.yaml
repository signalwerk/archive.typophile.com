  - id: 341594
    user: 24403
    date: 2009-04-14T10:21:00
    date_raw: 14 Apr 2009 — 10:21am
    votes: null
    html: |-
      <p>I get it better now.<br>
      But people are easy and lazy. When they don't get it, they don't like it and move on. You can't leave people in the middle. You can loose clients (or your client will) over this and they will not come back. Not easily at least.</p>
      <p>I do have to add that the target audience is important.<br>
      But generaly, this would be the case.</p>
      <p>You are trying to create an effect like an upside down ad in a newspaper or magazine.<br>
      I don't turn the magazine or paper upside down to read. I don't even sigh or shake my head. I just move on. Don't pay attention.</p>
      <p>But I am sure there is a middle ground. </p>
      <p>In my opinion a logo/brand/identity must give away a few things of the company.<br>
      I find it important that you will have a general clue about what kind of business it is.<br>
      Beside that a few core values will help.</p>
      <p>I don't see a software company immediately. But it could be.<br>
      However, you have shown a core value: we are not like others. But, is that true?<br>
      The other value you show: we are difficult. Are they?</p>
      <p>At the end of this all:<br>
      After a while every logo will find its way (not saying it is not important) and has its own reason to exist. But that is not how I do things.<br>
      There are tons of logo's out there that are common ground but could be a bit better.<br>
      You have to get this logo out quit a lot for people to understand.<br>
      You have to communicate it over and over.</p>
      <p>Then it could work, I think.<br>
      Especially on displaying certain values.</p>
