  - id: 371089
    user: 1262
    date: 2009-10-04T13:04:00
    date_raw: 4 Oct 2009 — 1:04pm
    votes: null
    html: |-
      <p>InDesign's auto leading is entirely independent of font metrics. It is a percentage of point size (default 120%), which can be edited in InDesign preferences (I usually set mine to 125% as I set a lot of 12/15 text). So changing font vertical metrics will not affect InDesign at all.</p>
      <p>Font metrics will affect a lot of other applications though, such as word processors, browsers etc.</p>
      <p>Your settings look okay to me.</p>
