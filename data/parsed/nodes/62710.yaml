  html: |-
    <p>I don't know if this is a Additional Vertical metrics matters or some other factor I haven't considered.</p>
    <p>I've been extending one of my fonts and adding glyphs with double storey accents like Latin Capital O with circumflex and tilde.</p>
    <p>When testing the font in InDesign with auto leading I've noticed that some accents collide</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/1_4162.jpg"></div><p></p>
    <p>Is it normal to have accent touching like this?</p>
    <p>Should I adjust the Additional vertical Metrics, or something else to stop this happening?</p>
    <p>Is it acceptable to have this occur with double storey accents?</p>
    <p>=======================================================</p>
    <p>I have set the Additional Vertical metrics like this:</p>
    <p>1. WinAscent value is the height of the highest point in the font, so this height will cover all the double storey accent.<br>
    2. WinDescent is the level that will include all the accents below.<br>
    3. Ascender = WinAscent and Descender = WinDeccent<br>
    4. TypoLineGap = WinAscent + WinDescent - UPM (1000)<br>
    5. Line Gap = 0</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2_5265.jpg"></div><p></p>
