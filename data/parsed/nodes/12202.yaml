    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Vojtěch Preissig</strong></p>
    <p>Czech type design and illustrator. Born in Bílina in 1873. Lived in the United States during World War I. Died in the Nazi concentration camp at Dachau in 1944.</p>
    <p>Digitizations of Preissig type designs:</p>
    <p>PREISSIG ANTIKVA<br>
    P22 Preissig Roman - <a href="/wiki/P22%20type%20foundry" class="freelinking" rel="nofollow">P22 type foundry</a><br>
    Preissig Antikva - <a href="/wiki/Franti%C5%A1ek%20%C5%A0torm" class="freelinking" rel="nofollow">František Štorm</a><br>
    Ruzena Antikva -<a href="/wiki/Psy-Ops" class="freelinking" rel="nofollow">Psy-Ops</a><br>
    Preissig - <a href="/wiki/Alex%20White" class="freelinking" rel="nofollow">Alex White</a></p>
    <p>OTHERS<br>
    Czeska - <a href="/wiki/Typerware" class="freelinking" rel="nofollow">Typerware</a><br>
    P22 Preissig Extras - <a href="/wiki/P22%20type%20foundry" class="freelinking" rel="nofollow">P22 type foundry</a><br>
    P22 Preissig Lino - <a href="/wiki/P22%20type%20foundry" class="freelinking" rel="nofollow">P22 type foundry</a><br>
    P22 Preissig Scrape - <a href="/wiki/P22%20type%20foundry" class="freelinking" rel="nofollow">P22 type foundry</a><br>
    Preissig 1918 - <a href="/wiki/Franti%C5%A1ek%20%C5%A0torm" class="freelinking" rel="nofollow">František Štorm</a><br>
    Preissig Ozdoby - <a href="/wiki/Franti%C5%A1ek%20%C5%A0torm" class="freelinking" rel="nofollow">František Štorm</a></p>
    <p>Recommended reading:<br>
    <strong>Vojtěch Preissig, Czech Typographer?</strong> by Iva Knobloch, <a href="/wiki/Typo%20Magazine" class="freelinking" rel="nofollow">Typo Magazine</a> issue 14, March 2005, <a href="http://www.magtypo.cz" title="http://www.magtypo.cz">http://www.magtypo.cz</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo-cover-14_4886.jpg"></div><p></p>
