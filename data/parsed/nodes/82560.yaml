  html: |-
    <p>In my current font project (a cursive conscript*), I have added the OpenType features [aalt], [init], [medi], [fina] and [liga] (along with the usual [kern]). These features compile without any errors and appear to work properly in the OpenType Features tab of the Preview panel (they don't preview properly on the Preview tab, but I've read on the FontLab forums that [init], [medi] and [fina] don't preview at all in FontLab Studio, but still work in applications), but when I generate the font (as a .ttf), none of them work in the applications I use this font in (Photoshop and Word '07-'10). It's as if they're not there. However, they appear in the relevant tabs when I open the .ttf in Studio, exactly as they are in my project file.</p>
    <p>I read in another topic at FontLab that Studio 5.0.4 doesn't work on 64-bit Windows Vista (which I use), but I want to be sure I haven't done something wrong in writing the features before I ask about replacing Studio 5.0.4 with v5.0.2.</p>
    <p>A few notes on the font itself, as well as the features as I've written them: I've put the contextual forms of each character in the Plane 1 PUA while using the basic Latin/ASCII codepoints for the nominal forms to make entering text easier. The features are in the reverse order from what is recommended for Arabic fonts (i.e. [init] is first instead of [fina]), and there is no [isol] feature.</p>
    <p>I should mention that I'm a font creation newbie, not a professional. There's plenty I don't know about making fonts, especially ones with OpenType features. There's a pretty good chance my feature definitions contain an error that slipped past FontLab Studio, especially since VOLT can't compile these features (the error message it gives me is very vague - "Compilation failed"). Your help will be much appreciated.</p>
    <p>*I.e. a constructed writing system, if you aren't familiar with the term</p>
