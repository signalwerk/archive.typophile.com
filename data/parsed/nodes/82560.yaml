      <p>Time to dust this thread off...</p>
      <p>I just received InDesign CS5.5 and can now test my font's OT features properly. Here's what I found:</p>
      <p>InDesign knows that my features exist, and it substitutes the contextual forms in most of the appropriate situations (after selecting Automatic Forms via the Character panel). However, it tries to apply init, medi and fina to every character it recognizes as a letter instead of using the classes I specified in the features. In other words, it tries to apply e.g. init and medi to non-joining characters (which lack initial and medial forms, so it defaults to the isolated form). It also doesn't seem to be applying isol at all, so glyphs following a non-joining character are replaced with medial and final forms instead of initial and isolated forms. These problems lead me to believe that InDesign is ignoring my OT classes, possibly even the entire feature set.</p>
      <p>It's worth mentioning that I added an aalt feature and have isol ordered before fina/medi/init, so it's possible that InDesign is either overriding the results of isol (which shouldn't happen, based on how I wrote isol) or ignoring isol entirely.</p>
