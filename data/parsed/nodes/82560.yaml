    html: |-
      <p>For init, medi, fina, and isol, it is up to the application to determine which of these features is to be applied based on its own algorithm for determining whether a character is in initial, medial, or final position. This isn't likely to work for a constructed script since the application will have no knowledge of how that script works and or even of which characters in your script are alphabetic characters (assuming you are using a PUA encoding).</p>
      <p>You'll probably want to rewrite your code using the calt feature.</p>
      <p>André</p>
