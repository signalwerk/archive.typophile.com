    html: <p>Peter, Volvo Sans and Volvo Serif are nothing more than renamed versions of the original Adobe volume of <a href="https://web.archive.org/web/20141112232433/http://www.bertholdtypes.com/bq_library/AkzidenzGrotesk.html" target="_blank"> Berthold Akzidenz Grotesk</a> (sans the delightful Light Osf nor the italics) and <a href="https://web.archive.org/web/20141112232433/http://www.adobe.com/store/search/adobe_store_search.jhtml?mss=simple&amp;pg=q&amp;what=web&amp;fmt=.&amp;where=www_type_main&amp;superq=berling&amp;index=AdobeComType&amp;selectName=main.html&amp;selectName=main.html&amp;selectName=main.html&amp;q=berling&amp;x=29&amp;y=5&amp;classifications=main.html" target="_blank"> Berling</a> (a Swedish typeface by Karl-Erik Forsberg) respectively. I thought they looked awfully familiar when I first received them to make one of their in-house mags. A quick check confirmed my suspicions. <br> <br>I hate this 9-hour handicap in these "who can identify this font first" races for living in Belgium. <img src="https://web.archive.org/web/20141112232433im_/http://www.typophile.com/forums/clipart/sad.gif" alt=":(">  Anyways, Scoles is simply too tough to beat, and Hrant is no wuss neither  ;)</p>
