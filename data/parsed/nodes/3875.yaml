    html: "<p>Scoles, as I said before, you're simply too tough to beat... the Red Rooster face is an almost perfect match. It's not as condensed, and the \"Q\", \"&amp;\" and \"9\" are dead give-aways, though, despite what Usherwood, Jackaman and co. might say. Is this a \"chicken or egg\" situation? Does anyone know when Volvo Broad was designed? Elston was digitized in 1993, but I don't know what year Usherwood's original dates from. <br> <br>I know OF Jan Middendorp: I barely know him, as he kinda replaced me after I left in the mid-nineties. I read the stuff he writes for \"Druk\", the <a href=\"https://web.archive.org/web/20141112232433/http://www.fontshop.be/\" target=\"_blank\"> FontShop</a> mag (section \"Boeken en magazines\" &gt; \"Magazines\"). I can deduce from his writings that he must be interesting and funny, indeed.</p>"
