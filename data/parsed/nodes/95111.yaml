  html: |-
    <p><em>Preamble: Charis is a free font from SIL and legally based on Charter. More info: <a class="freelinking external" href="http://scripts.sil.org/CharisSILfont" rel="nofollow">http://scripts.sil.org/CharisSILfont</a></em></p>
    <p>I've been using Charis for some time now and every once a while I adjust it some more to my liking. I know that some you did your own modifications (e.g. Charles Ellertson, Richard Fink), are you willing to share your version of the font?</p>
    <p>To set a good example, <a class="freelinking external" href="http://sunedonath.de/misc/Charta.zip" rel="nofollow">here is my version</a> – unoriginally renamed to “Charta” (German for “charter”) since modified versions must be renamed according to the SIL license.</p>
    <p>What I changed (as far as I remember):<br>
    - Added kerning<br>
    - Respaced the italics (Charis' italics are too tight, in my opinion)<br>
    - Slightly emboldened the superscript numbers<br>
    - (Charta includes only a subset of Charis' characters)</p>
