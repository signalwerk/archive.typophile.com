    <p>Now the process is that my lawyer, specialist in intelectual property, and me are creating the apellation text to try change the judgement (other judge).</p>
    <p>The judgement says that I am the author and Renault have stolen my type but,the judge continued saying there is no any personality of me in my design, so I'm not be able to defend my creation because is not original. My typeface is inspired by tracks of a car game (ex. Scalextric or Superslot) but simplifying some of the details of those track modules. Is the first inspired with those tracks in Spain anb was published like that.</p>
