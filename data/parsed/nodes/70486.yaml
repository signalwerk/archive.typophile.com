      <p>Luis,</p>
      <p>I work directly with judges in Brazilian Judiciary. Unhappily, judges have a permanent difficult to understand these less usual issues. And IP questions are not usual.</p>
      <p>This also applies to some lawyers. Even IP specialists tend to write in a very 'legal' way and this does not helps the judge to understand an issue outside his usual world. If you can, do a final verification in your lawyer appeal before he submits it to the second trial. Maybe you can help to achieve a more comprehensive text.</p>
      <p>In many times the case got a deeper analysis in second trial and the misundertood decision from first trial is reverted. Key to this is to make them understand what is a font design and why a font is protected even considering the basic character shapes are known for centuries.</p>
      <p>Another place to search is WIPO/OMPI site. They provide lots of materials about IP and most of their orientations apply primarly to Europe.</p>
      <p>Good luck.</p>
