      <p>As the judgement is writed:<br>
      "how I can try to defend my creativity if its inspired from the racetrack pieces?"<br>
      I tried to answer to this question before to be writed in that judgement, with an example, the warhol painting of the cambells soup.</p>
      <p>He said something like in that masterpiece you can see many personal examples of Warhol paintings (and it is true). Now I will need to try to get more and better examples of designs or creations where it's clear that the inspiration was other design thing or made them by other creator. Do you have better examples?</p>
      <p>I will not reply to the stealing technics about breaking a PDF password, it's true that the font is not embeded and the example caracters are not the same. It's clear they did´t get the paths from this example. I think they got them from a beta file that I sent to the display printers of the exibition. But in that case, in the typefile has the text telling that the type was copyrighted with an email address. It's clear someone distributed it without permission. Doesn´t matter. The guilty is Renault (and its ad agency, but that don´t interest me much, the final name was Renault and it's responsible of the trouble).</p>
