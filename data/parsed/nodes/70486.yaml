    <p>Hello to everyone, i'm a graphic spanish designer. </p>
    <p>Recently I knew the judgement of my personal trial with Renault, a famous french car brand, who did an spanish and south-american advertising campaign with some caracters with a typeface that it was entirely developed by me.</p>
    <p>Now the process is that my lawyer, specialist in intelectual property, and me are creating the apellation text to try change the judgement (other judge).</p>
    <p>The judgement says that I am the author and Renault have stolen my type but,the judge continued saying there is no any personality of me in my design, so I'm not be able to defend my creation because is not original. My typeface is inspired by tracks of a car game (ex. Scalextric or Superslot) but simplifying some of the details of those track modules. Is the first inspired with those tracks in Spain anb was published like that.</p>
    <p>The judge had two writings from the most important association of designers in spain where they give the whitnes about my work, as well as the director of the exhibition.</p>
    <p>That typeface was designed and developed for an urban design contest in Barcelona, I won the first typeface prize and there it was an exhibition where my typeface was one of the things shown. In the displays said perfectly that I was the designer and developer of that alphabet/typography, so with this example would be enough to consider that I have some rights with it. I wonder how Renault (and its advertising agency) accesed directly to my own type file, because the shown in the ad campaign had the same details, tracking and kerning.</p>
    <p>Now we would need to receive some tricky reasons to defend it in front of this giant firm. I do not how to proceed, I would need some help an especialist, specially if you know similar issues where the judge finally gave the veredict to the designer part.</p>
    <p>Thank you so much!</p>
    <p>Luis Llabres (4L)</p>
