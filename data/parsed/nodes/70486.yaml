    <p>That typeface was designed and developed for an urban design contest in Barcelona, I won the first typeface prize and there it was an exhibition where my typeface was one of the things shown. In the displays said perfectly that I was the designer and developer of that alphabet/typography, so with this example would be enough to consider that I have some rights with it. I wonder how Renault (and its advertising agency) accesed directly to my own type file, because the shown in the ad campaign had the same details, tracking and kerning.</p>
