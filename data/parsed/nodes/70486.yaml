    html: <p>I'm not a lawyer, but my understanding is that in the successful lawsuit of Adobe vs SSI, the court here in the US accepted that taking the numbers from a font file—the specification of the nodes and handles—and simply doing an arithmetical transformation is a violation of copyright of the software. This doesn't look at the design at all, but approaches it as a matter of violation of software copyright. I thought that European law was stronger, but obviously you are having problems with enforcing it.</p>
