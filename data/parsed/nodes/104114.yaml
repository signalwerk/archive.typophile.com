    html: |-
      <p>Before posting the suggestion of Avant Garde Gothic Bold I ran the letters &amp; numbers through Identifont, which suggested only Fakt. I checked the same link you posted and rejected Fakt mainly on the width issue, as its widest version was even narrower than Avant Garde Gothic Bold. I found nothing else that matched, even on some sites such as Hoefler &amp; Frere Jones that don't show up at MyFonts.<br>
      Since this was a sign for an artistic event, I went with the possibility of Avant Garde Gothic Bold expanded by the sign designer.<br>
      So I wonder what else is out there. A "free" font? An in-house font by the museum? Something by a German foundry that I missed?<br>
      The image posted by July has excellent detail but is hard to read without a kink in the neck. Here it is, rotated  90 degrees, and rearranged so it's easier to check letters. Ignore the jagged letter edges that appear in parts of the image. They are artefacts from a quick &amp; dirty geometric distortion correction.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FotoB_6166.JPG"></div><br>
      Perhaps this will prompt some other suggestions.<br>
      Don<p></p>
