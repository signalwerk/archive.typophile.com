    html: <p>Thought also to Avant-Garde but I don't think that's it. Too many details look off to me (digits, /e...) and the Bold weight is far not enough bold. I thought also to <a class="freelinking external" href="http://commercialtype.com/typefaces/graphik" rel="nofollow">Graphik</a> and <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/ourtype/fakt_complete_pro" rel="nofollow">Fakt</a> but even after playing with alternates, that's not it either. Still searching.</p>
