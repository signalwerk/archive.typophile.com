      <p>&gt; <em>Can i just replace an Helvetica Neue Postcript for and Helvetica Neue with OTF without having any noticeable change in the design?</em></p>
      <p>Yes.</p>
      <p>&gt; <em>I just would not like my 60 pages design to move text frames when changing fonts.</em></p>
      <p>You should be able to switch from the Type 1 version of the fonts to the OpenType version with very little or no reflow at all. If some glyph metrics were changed during the conversion to OpenType, it was because the metrics in the Type 1 were considered a bug.</p>
      <p>&gt; <em>Adobe Garamond Pro (or Garamond 3 LT Std or Garamond Premier Pro)</em></p>
      <p>The only thing guaranteed these three families have in common is the name "Garamond". They are different families and are NOT interchangeable. They share the stylistic design and that's about it. They have many differences in terms of design, metrics, weights, styles, character coverage, OpenType features, etc.</p>
      <p>"Adobe Garamond Pro" is the OpenType counterpart of Type 1 "Adobe Garamond".<br>
      "Garamond 3 LT Std" is the OpenType equivalent of Type 1 "Garamond Three" (a.k.a. "Garamond 3")<br>
      "Garamond Premier Pro" only ever existed in OpenType format.</p>
      <p>&gt; <em>not just plain Garamond</em></p>
      <p>There are many <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a> "cuts". If "Garamond" is the only name that appears on the application's fonts menu, perhaps you're using the <a class="freelinking external" href="http://www.microsoft.com/typography/fonts/family.aspx?FID=28" rel="nofollow">Monotype version</a>.</p>
      <p>&gt; <em>I cannot find Zap Dingbats in Font Folio 11, but ITC Zapf Dingbats Std. Is the same?</em></p>
      <p>The Type 1 version was named "ITC Zapf Dingbats". "Zapf Dingbats" is probably the TrueType version that comes installed on Windows(?). There's no guarantee that the TrueType version be equivalent to the Type 1 or OpenType versions, but they should be similar for the most part.</p>
