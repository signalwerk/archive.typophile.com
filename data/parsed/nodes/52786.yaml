    <p>Hi guys,</p>
    <p>I am working on InDesign CS3, Mac version. My client sent me the files with Postscript 1 fonts for Mac. Since more people will be working with similar files PC workers included i persuade my client that will all user Open Type Fonts to avoid Cross Platform issues.</p>
    <p>My questions is:</p>
    <p>1 - The fonts for this design are very common: Helvetica Neue, Adobe Garamond, Zap Dingbats (for bullets). Can i just replace an Helvetica Neue Postcript for and Helvetica Neue with OTF without having any noticeable change in the design? I don´t know maybe older Postscript Helveticas Neue to the more modern OTF version has some difference somewhere i cannot appreciate, letter X height or else. I just would not like my 60 pages design to move text frames when changing fonts.</p>
    <p>2 - I am checking Font Folio 11 (OTF) and there is Adobe Garamond Pro (or Garamond 3 LT Std or Garamond Premier Pro), not just plain Garamond. Is there any difference at all with its Postscript 1 version for Mac? </p>
    <p>3 - I cannot find Zap Dingbats in Font Folio 11, but ITC Zapf Dingbats Std. Is the same? </p>
    <p>Sorry for the long text. Thanks for any info!</p>
    <p>Cheers,<br>
    Sebastian</p>
