      <p>BTW, the PC Type 1 fonts (<code>.pfb</code> and <code>.pfm</code> files) can be used in Adobe applications running both on Mac OS X and Windows. </p>
      <p>On Mac OS X, the system won't let you install PC Type 1 fonts. </p>
      <p>However, if you put the <code>.pfb</code> and <code>.pfm</code> files into one of the following folders: <code>/Library/Application Support/Adobe/Fonts/</code> or <code>~/Library/Application Support/Adobe/Fonts/</code> (where ~ is your user folder) then the fonts will be visible in all Adobe Creative Suite applications (but they will not work in non-Adobe applications such as TextEdit, Apple Keynote or Microsoft Word). </p>
      <p>On Windows, you can install the fonts on your system as you normally would. Alternatively, you can put them into the <code>C:\Program Files\Common Files\Adobe\Fonts</code> folder. This way, they will be only available in Adobe applications but not the other Windows applications. </p>
      <p>By putting these fonts into the folder <code>/Applications/Adobe InDesign CS3/Fonts/</code> on Mac or <code>C:\Program Files\Adobe\InDesign CS3\Fonts</code> (or appropriate, depending on your InDesign version), you will make the fonts available only within InDesign but not other applications. </p>
      <p>The Adobe-specific font folders on both Mac and Windows accept OpenType and TrueType fonts (<code>.otf</code> or <code>.ttf</code>) and PC Type 1 fonts (<code>.pfb</code> and <code>.pfm</code>), On Mac, they also accept Mac Type 1 font suitcases. </p>
      <p>Also note that rather than copying files into those locations, you can put shortcuts/aliases that point to font files or even entire folder trees. The last possibility is particularly attractive. </p>
      <p>For example, I often keep copies of the fonts that I used in a certain project in a specialized folder for that project, along with the actual project documents and assets. To open the project, I quickly drag the shortcut/alias for the project fonts folder into the Adobe-specific font folder, and the fonts are instantly installed within InDesign, Illustrator and Photoshop. I can quickly drag the folder shortcut/alias for an entire folder tree that holds several hundred fonts into the Adobe-specific folder, and I don't have to bother activating all those fonts in my font management app. This is very quick and does not clutter the font menu in the other applications. </p>
      <p>Sometimes it helps me to get a somewhat "dodgy" font to work. Even if it does not work in the system, it may work just in InDesign, where I often need it. </p>
      <p>So: the Adobe-specific font folders are a useful alternative to system font installation, allow use of folder shortcuts pointing to entire folder trees, and allow using PC Type 1 fonts on Mac OS X. </p>
      <p>A.</p>
