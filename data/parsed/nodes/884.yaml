  html: <p>Hi, <br> <br>Yes folks, yet another one infected by the typo-bug. I'm a newbie typophile who may need some help and feedback. I started experimenting with bitmap fonts couple of months ago. I thought bitmap fonts are simple to create, so it may be a good starting point. I have worked on several bitmap projects until the sobering discovery that some else had quite the same ideas at pixel pushing. It is excrutiatingly difficult to come up with a new typeface of different look especially at very small sizes. Pixel Lattice is one of my favourits. Although the original idea to place the letters on a pixel grid is not mine, I think I succeded to add some new twists to take it to the next level. (To those who may object the use of swastica for the glyph "X" and the asterisk, I can tell beforehand that this is not identical to the Nazi symbol, which turns the other way around.)  <br> <br>Any comment? <img src="http://www.typophile.com/forums/messages/29/14014.gif" alt="Pixel Lattice character set"><img src="http://www.typophile.com/forums/messages/29/14015.gif" alt="Pixel Lattice without the pixel grid background"></p>
