    html: <p>On the other hand, perhaps this is just the sort of thing to slowly filter the use in a new context? I didn't notice it until I read your email, Ren. I was looking at the alphabet as a whole, first and each character second. And for how often a cap X would appear. Well, just thoughts.  <br> <br>Although, I realize, the safest option in order to separate this from the baggage that comes with the swastika, is to alter your cap X.</p>
