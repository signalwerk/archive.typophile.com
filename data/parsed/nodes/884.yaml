    html: <p>So, are Hindus and other people who bumped into the gridiform cross before Mr. Hitler required to forget all about it? <br> <br>Balls. <br> <br>Keep it Tibor, Moholy would have. Just make SURE you include a linked etymology in all descriptions. It is possible to take words, characters and forms back from offensive usage, especially those that are simple and naturally inspired. <br> <br>the Void is hungry and wants its twisty grid cross back.</p>
