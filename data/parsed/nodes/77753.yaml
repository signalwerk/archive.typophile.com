    <p>Grumpy is an extreme headline font with six optical weights. Black 24 is loosely based on ITC Grouch by Tom Carnase. It is slightly heavier than Grouch, and many glyphs differ notably from it. Grumpy has very tight tracking, and more than 2000 kerning pairs for overall even colour (if that is possible with this design).<br>
    Letterspacing method is TNT (that is Tight, Not Touching); a very popular type treatment in the seventies and eighties.<br><img src="/sites/default/files/old-images/Grumpy_poster_5251.png"><br>
    Grumpy is now available from YouWorkForThem:<br><a href="http://www.youworkforthem.com/product.php?sku=T1308">http://www.youworkforthem.com/product.php?sku=T1308</a><br>
    and MyFonts:<br><a href="http://new.myfonts.com/fonts/suomi/grumpy/">http://new.myfonts.com/fonts/suomi/grumpy/</a></p>
