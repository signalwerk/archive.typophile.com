  html: |-
    <p>Grumpy is an extreme headline font with six optical weights. Black 24 is loosely based on ITC Grouch by Tom Carnase. It is slightly heavier than Grouch, and many glyphs differ notably from it. Grumpy has very tight tracking, and more than 2000 kerning pairs for overall even colour (if that is possible with this design).<br>
    Letterspacing method is TNT (that is Tight, Not Touching); a very popular type treatment in the seventies and eighties.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Grumpy_poster_5251.png"></div><br>
    Grumpy is now available from YouWorkForThem:<br>
    <a href="http://www.youworkforthem.com/product.php?sku=T1308" title="http://www.youworkforthem.com/product.php?sku=T1308">http://www.youworkforthem.com/product.php?sku=T1308</a><br>
    and MyFonts:<br>
    <a href="http://new.myfonts.com/fonts/suomi/grumpy/" title="http://new.myfonts.com/fonts/suomi/grumpy/">http://new.myfonts.com/fonts/suomi/grumpy/</a><p></p>
