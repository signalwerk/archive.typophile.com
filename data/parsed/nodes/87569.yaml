  - id: 484589
    user: 82305
    date: 2011-11-19T16:58:00
    date_raw: 19 Nov 2011 — 4:58pm
    votes: null
    html: <p>You can deactivate half the fonts, and see if the crashing stops, then deactivate the other half. When you know which half causes it (assuming there's not a ton of corrupt fonts), do the same with half of that half, and so on, till you narrow down the culprits.</p>
