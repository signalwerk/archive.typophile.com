  html: <p>My MacPro has been acting crashy, in the midst of a very busy spell of work, of course. Several trips with my 50 lb computer to the Apple Genius bar and a very clever tech guy have led to the conclusion that corrupt fonts have been the source of my crashes. I use FontExplorer 1.2.3. I have too many fonts, natch. Any great ideas as to how I can identify which fonts are corrupt? Should I upgrade to FontExplorer Pro? Any ideas as to how I can preserve my useful, used fonts so I can keep working, and isolate the remainder to be added gradually? Thanks in advance, and Happy Thanksgiving to all.</p>
  html_clean: <p>My MacPro has been acting crashy, in the midst of a very busy spell of work, of course. Several trips with my 50 lb computer to the Apple Genius bar and a very clever tech guy have led to the conclusion that corrupt fonts have been the source of my crashes. I use FontExplorer 1.2.3. I have too many fonts, natch. Any great ideas as to how I can identify which fonts are corrupt? Should I upgrade to FontExplorer Pro? Any ideas as to how I can preserve my useful, used fonts so I can keep working, and isolate the remainder to be added gradually? Thanks in advance, and Happy Thanksgiving to all.</p>
