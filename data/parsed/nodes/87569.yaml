    votes: null
    html: |-
      <p>Apple’s Fontbook application can examine fonts for corruption. Unfortunately it’s buggy, poorly-documented, and often flags valid fonts as having problems. But it’s a start. Sort good from bad family by family, and back them up so that you have clean copies if this happens again.</p>
      <p>Upgrading to a new version of Font Explorer does sound like a good idea.</p>
