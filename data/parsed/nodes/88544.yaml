  html: |-
    <p>Glyph naming convention for base letter+diacritic is well known: uni+[base code]+[diacritic code]. But how to name letters when the combined diacritic has no codepoint?</p>
    <p>This issue arises regarding L with double slash and Lambda with bar, both used in native North American languages. The slanted bar may be considered the 0337, but I'm not sure if this is correct. And the double Polish bar has no Unicode at all.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/namesunknown_4205.png"></div><p></p>
  html_clean: |-
