      <p>You should probably put it into the private use unicode section and work the substitution into the OpenType code for stylistic alternates or stylistic sets for language substitution. Or is there a code for languages? LANG? I don't remember now. I even go so far as to create unicodes for the elements of diacritics such as the macron over the "i" (macron.salt). I hate overhanging macrons. Even if you write the code for the substitution, you must have a unicode because some software doesn't see the character if it doesn't have a unicode. Also, the naming conventions should be something similar to lambda.salt or L.salt because some software and postscript printers won't recognise names outside that convention. Or, so I've read. That should give a starting point for further research until someone far more knowledgable than I (which wouldn't be hard) posts a better solution.</p>
      <p>JLS</p>
