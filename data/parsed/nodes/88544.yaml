      <p>James and John, thank you very much.</p>
      <p>About PUA codepoints, I'm following technical recomendations I received here in Typophile and thus I'm avoiding them by now. OT substitution would be an option if these characters were actual variations of others. But I do not know if the double slashed L is just a language variation from the single slashed version.</p>
      <p>Uppercase barred lambda is included in <a class="freelinking external" href="http://www.tiro.com/huronia/Huronia_Beta_16_OL.pdf" rel="nofollow">Huronia Pro</a>, as well as the L with double slash. A non-barred version of Lambda is available in <a class="freelinking external" href="http://www.linguistsoftware.com/lsal.htm" rel="nofollow">LaserSalish fonts</a>. Unhappily, I cannot find further information about them (maybe I should ask Ross Mills about it).</p>
      <p>Curiously, the lowercase Latin labda with slanted bar is used in Wikipedia as an icon to native North American languages. It seems to be a typical letter for some of these tongues.</p>
