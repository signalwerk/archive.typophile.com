      <p>Igor, might the L/l with double slash be treated as glyph variants of U+2C60/U+2C61?</p>
      <p>If not, then they should be proposed for encoding, because Unicode's preference now is to encode characters in which combining bars or slashes intersect with the base form, realising that the techniques for dynamic mark positioning that work so well for floating marks are problematic in this cases, and hence these text elements will tend to be displayed with precomposed glyphs.</p>
      <p>Yes, the single combining slash is U+0337.</p>
      <p>The lowercase Latin lambda with bar is encoded as U+019B, but it currently has no uppercase form encoded (it originated in Americanist phonetic notation, which uses only lowercase). If this uppercase form is in use, then it definitely needs to be documented and proposed for encoding.</p>
