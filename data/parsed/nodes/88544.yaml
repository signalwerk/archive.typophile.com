    html: |-
      <p>The double-barred 'l', or double slash 'l' are used in Ktunaxa (Kootenay) orthographies as a voiceless l. You could see the barred l (ł) used (eg. in Boas), the double-slashed l or the double-barred l. Given the last is encoded, the double-slashed l could be mapped as a variant of either ł or ⱡ, in lieu of it having a separate encoding. It could also be mapped via [ccmp]. I would tend to say you're more likely to see the double-bar form.</p>
      <p>The uppercase barred lambda is included for the sake of complete typographic case options for the orthographies which use the barred lambda. It is a logical inclusion (at least from a typographic standpoint), and I try to at least give users the options of having uppercase, lowercase and smallcaps for most everything. People typesetting eg. Nuuchahnulth have said they would like an uppercase option (and by extension a smallcap option). If any precedent is set for such use, then it of course should get encoded as the uppercase form of ƛ—as it stands, access mapping via OT lookups could probably be done in a couple of ways; none particularly elegant that spring to mind. </p>
      <p>Incidentally, unless you are relying solely on mark positioning, there should probably be a precomposed version of the glottal-barred-lambda as well which needs fairly careful positioning of the glottal mark. The lambda and barred lambda* are used in Salish languages as voiced and voiceless lateral affricatives (both can take a glottal). Traditionally there has been no uppercase version because, well, no one bothered to make them.</p>
      <p>*The subject of 'latinate' Greek for the purpose of phonetics has been covered elsewhere.</p>
