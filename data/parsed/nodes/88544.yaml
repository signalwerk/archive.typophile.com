    html: <p>The general rule is that glyph name should reflect the character(s) used as input to get this glyph, as the point of standardised glyph naming is to allow recovering the original input from an array of glyphs (e.g. in PDF files where the input text in not usually preserved but only the resulting glyphs).</p>
