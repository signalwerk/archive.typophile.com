    html: |-
      <p>Depending on the font, I make up all the currency symbols, a numbersign, and the arithmetic operators. Size &amp; position to fit comfortably with all the old-style numbers -- a bit of compromising is involved. Switched with the numbers in the lnum and onum features.</p>
      <p>Also a colon, so, for example, 12:24 spaces better than the with the text colon. I include i, v, and x in the conditional set to include front matter roman numerals.  </p>
      <p>Again depending on the font, I may make up a tabular comma and period as well.</p>
