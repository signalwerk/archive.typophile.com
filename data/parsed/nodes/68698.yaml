  html: <p>It's something I've never thought much about but I've seen it in a few fonts of late. Some fonts with oldstyle figures include currency symbols at or near the smallcap/OSF height. It seems like a good idea if you're going to have oldstyle numbers, but how frequently is this done? And which symbols should correspond to which of the varying number heights?</p>
