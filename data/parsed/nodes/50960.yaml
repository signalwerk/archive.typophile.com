      <p>Very interesting discussion. Just some random thoughts:</p>
      <p>. Designing a harmonious Arabic and Latin is an exercise which does *not* necessarily mean that the Arabic is subservient to Latin, or that it looses any of its qualities</p>
      <p>. The Matchmaking project is actually 5 different approaches to this problem, and should not be bundled in one lump</p>
      <p>. There are many different ways to look at this exercise and many different ways to solve the problem. For example, compare my typefaces: Koufiya with Frutiger Arabic and Palatino Arabic</p>
      <p>Koufiya: Both Latin and Arabic were designed at the same time; both were treated in a way that they work together but they do not sacrifice their integrity. The Arabic relates to Early Kufi.</p>
      <p>Frutiger Arabic: the Arabic was designed to work as a signage font that can sit on the same signage system as the Latin. As it is meant to be seen in large sizes, the drawing treatment is similar to the Latin, and the style is a mix of Kufi and Ruqaa.</p>
      <p>Palatino Arabic: the Arabic was designed to function as a bookface and is Naskh in style. The actual drawing style does not follow the Latin, but the optical size and weight are a match. This approach is on a more ideological level.</p>
      <p>. As we stand today, we have a tradition of complexity in our manuscripts as well as a much simplified version in our traditional typefaces. The simplification was a result of technological limitations that barely exist today. However, the legacy of this simplified style exists, so do we keep it on even though the reasons for it have disappeared? Is there any typographic value in Simplified Naskh?</p>
      <p>If you're interested in these questions, please wait till I finish my PhD in legibility studies! I'm testing the effect of complexity on the legibility of Arabic and I'm hoping to get some answers... I'm sorry I can't give more details or participate more often here as I really need to study!!</p>
    html_clean: |-
