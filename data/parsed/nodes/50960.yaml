      <p><em> Didn’t Arabic evolve from the Kufi script that was originally somewhat flat, rigid and rather “Latinesque?” (fixed/blocky)</em><br>
      You make a good point. Square kufic is also alive and well today and many fonts owe their design principles to it. On the other hand Latin is not always necessarily blocky and rigid- what about the fantastical swashbuckling quill-pen calligraphy of yore with spirals and curves sweeping all over the page?  My objection is that the Matchmakers started out from the very start to create an Arabic font subservient to a given Latin. Why not the other way round?  Perhaps it is a sort of 'political' objection after all. Arabs should have a bit more confidence, pride and respect - call it a love - for their traditions and make an effort to find their own style in this amazing multinational world of ours.</p>
