      <p><cite>I'm testing the effect of complexity on the legibility of Arabic and I'm hoping to get some answers ...</cite></p>
      <p>This sounds really interesting!<br>
      Maybe the test could take into account earlier discussions about what is actually measured, what results are supposed to tell, and thus how such tests be set up. (Esp. Peter Enneson's comments <a href="http://www.typophile.com/node/50834" target="_blank" rel="nofollow">here</a>. Is it enough to measure speed?)<br>
      The crucial question is, what will the test prove? For example, whatever will turn out to be more legible by whatever definition (to be defined) and under whatever test set-up (to be documented) -- will the result indicate that this or that kind of design is more legible per se? Or does it acknowledge that readers (participants) are used to, and thus trained in, reading it, and read it more "fluently"?</p>
      <p>Two aspects: Make sure participants are not just students but cover all ages and type. And ask if and what they usually read -- after the test. So, have academic vs non-academic, young vs old people, which at the same time may help bring together people who read books, or newspapers, or online (TV captions?), or not at all. (Maybe even ask what kind of books and which newspaper(s), where possible check in which typeface these are set.) That way, one would not get some "abstract" information about typeface's legibility but can put them into context, and find out if -- or not -- test results and reading habits correlate.<br>
      Maybe it would be interesting to perform the same test in different countries?</p>
      <p>My wishlist applies to Latin-script reading tests too ...</p>
      <p>Best wishes, Karsten</p>
