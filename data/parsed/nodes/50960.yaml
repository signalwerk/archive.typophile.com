      <p><em> If the reason for typefaces to be kept “simple” is restrictions of the technology, then something went terribly wrong. Technology should be gentle and allow for whatever may make sense. And whether designers prefer simplified or complex designs should be entirely driven by their design visions, not by technology or by their ability or inability to master it. With OpenType, I fear that often it is indeed the latter than determines design.</em></p>
      <p>Karsten - This is very important. As an example, one reason I simplified AlQuds is to abridge the number of metal type shapes needed for Arabic. With computers this does not matter any more. However, perhaps due to the influence of Latin Sans-Serifs, simple Arabic is in fashion again, and it has an important place in education, for example to help wipe out the shameful illiteracy in many parts of the Arab world and beyond. I say 'again' because square Kufi is such a simplification, centuries old! Can you please explain the difference between ACE and Tasmeem in a bit of detail?</p>
      <p>Benham can you please provide a sample image of the Latin and Arabic you referred to in your interesting discussion on vertical spacing?</p>
