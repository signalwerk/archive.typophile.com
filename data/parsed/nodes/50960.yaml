      <p>It is true that there are new trends emerging in Arabic type design and though they might fall along the lines you describe, there are other ways to look at this. </p>
      <p>Some designers are more interested in the resulting visual aesthetic (for example, an Arabic companion to a famous Latin typeface) and there are those who are interested in investigating the complex structural aspects of the script (and that's where Tasmeem sits). In the first camp, the end result is a product intended for a specific use (a text face, a signage face etc...) while the second camp is an approach to design rather than a product in itself. </p>
      <p>This is why I would argue against a split between what you describe as 2 trends. It would be quite feasible to design an Arabic version of a Latin typeface using Tasmeem technology. It is true that in designing an Arabic counterpart to an existing Latin there are a lot of considerations that need to be taken, but it does not necessarily mean that the basic characteristics of the script are being sacrificed. </p>
      <p>There's been a lot of publicity regarding the Typographic Matchmaking project and as one of the designers, I can easily say that it's been taken a bit out of context. As far as I know, none of the designers looked at their designs as the "one solution" to the question of Arabic type design. The process of working alongside more experienced type designers and learning from them was the whole point of the exercise, at least for me. It was a great experience and we all benefited. </p>
      <p>The Typographic Matchmaking project was not the first, and is not the last, to approach the concept of an Arabic match to existing Latin. It is a legitimate question, not because Arabic needs to follow a Latin, but because of the demands of the market place. This demand exists and the perils of graphic designers taking things into their own hands can be seen in the streets of Dubai where cut-and-paste Latin characters masquerade as Arabic.</p>
      <p>In any case, I think we should rejoice in the fact that so many people are interested in exploring new ideas. It's a very exciting period to live in.</p>
