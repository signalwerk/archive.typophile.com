      <p>Forgive an ignorant student of Arabic and Calligraphy to ask some questions...I know I'm going to say some ignorant things here, and you guys are going to set me in my place. Good. I'm truly asking in order to understand.</p>
      <p>Didn't Arabic evolve from the Kufi script that was originally somewhat flat, rigid and rather "Latinesque?" (fixed/blocky) I know Kufi has many styles, but before Islam the Arabic script was very basic, yes? Eventually master calligraphers redefined the original Arabic into incredible art forms, but couldn't it be said that they did this because they were playing with the language and redefining it?</p>
      <p>I mean, were the avant garde calligraphers not true to the original Kufi script when they made Nasque, Thuluth or Diwani? They were expanding on the past to meet current trends or regional artistic styles (surely influenced by their own cultural heritage).</p>
      <p>This just seems to be the natural course of civilization. What if 1000 years down the road we're trying to cram Latin characters into the next big thing? </p>
      <p>Is everybody uptight because we feel like the Arabic script will be lost if we force it into the Latin mold? I think MUCH worse things have happened, such as Saad's lamenting "كليب". Perhaps people are unnecessarily lumping Matchmaking into the same pot? </p>
      <p>How is the Matchmaking project any different than what happened in the past? They're meeting a need. Is Tasmeem a sweet idea? Of course. I have the basic Tasmeem myself.</p>
      <p>As a designer, I want it all! Not necessarily on the same page, but I still want it all. (But I reserve the right to change my mind.)</p>
