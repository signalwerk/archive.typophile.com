      <p>@Saad, you made it perfectly clear to me now. Thank you.</p>
      <p>However, I must say that we are in uncharted times...globalization is causing us to think in new ways as to the balance between cultural identity and interconnectivity. A thousand years ago, did we need to "shoehorn" one script into another? Again, because of the times, I think it's inevitable.</p>
      <p>For that reason, I think this Matchmaking trend COULD go the other way too! Why not "shoehorn" Latin into Arabic. That would be sweet. :) </p>
      <p>I think the main fear is that "Americanization" (I'm from the US, by the way) is robbing the world of it's distinct people groups and cultures. Fair enough. I agree wholeheartedly. Yemen is special because it's so un-American (for the time being). But if it wasn't America, it would be somebody else. The fact is, we're all being squished together and we need ways to be interconnected. There is going to be some trade-off on all sides. </p>
      <p>Looking at it another way, could we say the same thing about interracial marriages? (Boy, this is a dangerous opener!) Do we lament the fact that a dark-skinned and light-skinned couple has a baby that's brown? I'm not even saying it's wrong to dislike that. I like living in Yemen, where the distinctive features of the people immediately set me apart visually. Are we all going to be brown in 1000 years? I don't think so, because there will always be people who prefer their own race. (Like we will always have true Nasque fonts) And that makes me happy too. I know I'm not comparing apples to apples, but in an odd way I see a connection.</p>
      <p>And forgive me for making the connection if I'm in error, but on your Arabetics site (<a href="http://www.arabetics.com" title="www.arabetics.com">www.arabetics.com</a>), several of your fonts appear to be using Basic Arabic. Isn't that worse than Matchmaking? To disconnect individual letters in Arabic just doesn't make sense to me and is the epitome of "sucking up." (I don't mean this disrespectfully.)</p>
      <p>My account says finedesign, but I included my true name in the registration form. By default, Drupal displays the username, not the actual name. But I thought Typophile folks changed this to show the actual name. Anyway, thanks for figuring out my real name.</p>
      <p>@Vladimir<br>
      I knew I was going to be sorry for saying Latin was "fixed/blocky" since we all know there is a cursive script. But thank you for your feedback as well. I think I also responded to your comment in the above statements.</p>
      <p>I really like this forum topic, though. I think the central question remains, "Just because I CAN do something, doesn't mean I SHOULD do it." That's why we're designers. We're hired to be discretionary.</p>
      <p>with zahoor (you guys crack me up)</p>
