      <p><em>"How do I post images inline if I can’t use html?"<br>
      </em><br>
      Here's one work around that I've found for "inline" images:</p>
      <p>When you add an image (using the "Insert Image" button), by default the image is placed at the end of your post. However, if you click on the "Preview comment" button, and then scroll down to the editable text window, you can cut the link to the image and then paste it (again in the editable text window) where ever you wish it to appear in your comment.</p>
      <p>It's a bit of a nuisance to have to do this, but it's better than nothing.<br>
      &nbsp;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;~~~~~~~~~~~~~~~~~<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>When going from </em>A to Z,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>I often end up </em>At Oz.</p>
    html_clean: |-
