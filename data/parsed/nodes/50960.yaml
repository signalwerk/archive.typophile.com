      <p><em>Sadly, I agree with your cartoon!</em><br>
      Hrant, it was supposed to make us laugh! Even at ourselves, as well as to think about Arabic typography. </p>
      <p><em>These are all fascinating aspects of world civilization, of which the Arabs are part and parcel</em><br>
      Exactly, Tom. We are living in an incredible period of history where the fruits of science and technology are available to one and all. Let us not forget the  invention of algebra and the adoption of the zero, which are at the heart of computer languages 0000100110.  Moslems and Arabs have nothing to be ashamed of in this age that started with Western technical dominance.</p>
      <p><em>Matchmaking is OK as long as it is not presented as the way Arabic typography “should” be</em><br>
      Well, Saad, the khtt website presents it as a turning Point in Arab Typography. Matchmaking is a sound idea only insofar as that two languages on the same page should not appear to compete for attention without reason. Since the mid-sixties the Arab press is favoring the use of Latinized Arab numerals 012345 (rather than the Indic numerals). The  fonts often used for the numerals is awfully mismatched and jumps out of the line in a disturbing way.  The glory of Arabic script is the compact and curvatious lines and highly developed sense of the individuality of each letter-shape. It is written in a totally different spirit than Latin with its blocks of same-height letters and repeated forms. </p>
      <p><em>It is true that there are new trends emerging in Arabic type design and though they might fall along the lines you describe, there are other ways to look at this.</em><br>
      Indeed, Nadine. You are specially welcome here as it is good to hear the views of someone in a position to know much more about what is going on in the market and design community than any one of us as individuals.  The cartoon did not depict the many other significant developments going on in Arabic font design, only to deal with the topical subject of the panel discussion that took place last week in Amsterdam. I hope to learn more about what occurred there.<br>
      I should explain a bit more about why I find the Matchmaking vs. Tasmeem so necessary to discuss critically. It has now become technically possible to present scripts of any imaginable complexity by programming the software under the hood. That is what Tom and his Tasmeem team have done so brilliantly for Arabic, and designers and font developers should explore its possibilities not only for calligraphic styles such as Naskh. More about that later.<br>
       In contrast my impression is that  Huda’s Matchmaking effort holds Latin as the ideal to which Arabic should aspire. This is indeed sad. Doubtless Latin type has had centuries of a head start over Arabic (or Japanese or Telugu) but each script has an essential design philosophy that should be respected even as the shapes adapt to modern techniques and prevailing design fashions. The khtt group has succeeded nicely to encourage young people to take an interest in Arabic typography, and Tasmeem is making headway among printing and publishing professionals. It is high time the two teams in Holland cooperate in some ways to further promote the field as a whole. Arabic typography and font design can only benefit. </p>
      <p><em>The question is why nobody thought of matching Roman script to Arabic?!</em><br>
      Behnam, I have recently designed a Latin font to match in style, stem width and line endings the Arabic of my forthcoming AlQuds font. I am now newly aware how difficult it is to design a really good Latin font!</p>
      <p><em>It would be quite feasible to design an Arabic version of a Latin typeface using Tasmeem technology</em><br>
      Karsten, not only of Latin, insofar as I understand its workings, Tasmeem is an intelligent-font technology that can be adapted to any script. </p>
      <p>As Aziz would say, with tulips.</p>
