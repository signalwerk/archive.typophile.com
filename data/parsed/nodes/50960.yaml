      <p>Finedesign (Paul) wrote:</p>
      <p>&gt;&gt;I know I’m going to say some ignorant things here, and you guys are going to set me in my place.</p>
      <p>Permit me to call you Paul! What you said is quite eloquent and more mature than I have ever heard from most members of our Arabic Typography community.</p>
      <p>&gt;&gt;Didn’t Arabic evolve from the Kufi script that was originally somewhat flat, rigid and rather “Latinesque?” (fixed/blocky) I know Kufi has many styles, but before Islam the Arabic script was very basic, yes? Eventually master calligraphers redefined the original Arabic into incredible art forms, but couldn’t it be said that they did this because they were playing with the language and redefining it?</p>
      <p>Precisely.  I think the earlier move to cursive forms and subsequently to the elaborate calligraphic forms was necessitated by many legitimate factors. In these old golden times, the main rule that was in effect was “open mindedness”; there were no “script rules”.  In our typographic age, with many other factors playing, (typographic, political, religious, economic  ... etc), we need to move on and stay away for any fixed design notion. I am actually finishing up new fonts for Jazm, the earliest Arabic script which is directly related to early Kufi, just to illustrate this point.</p>
      <p>&gt;&gt; How is the Matchmaking project any different than what happened in the past?</p>
      <p>I think the main problem of Matchmaking concept is that it “sucks up” (unnecessarily) to Latin! To start, I would re-iterate Vladimir and Behnam points, harmonizing two scripts is two way process.  We do need to incorporate good typographic design concepts and ideas used in Latin (or other scripts) as good design concepts not as Latin design concepts; just as driving a car today in not “Westernization” or studying “Al-Jabr” (Algebra) is not “Arabization”. Typography is an independent field, re-using design concepts used for Latin, does not owe a “penny” to Latin, but to Typography. What bothers me the most about the Matchmaking is that young designers are sitting down to design Arabic fonts in general (not to fulfill a specific harmonizing project need) but having harmonizing with Latin as the main goal and drive.  People around the world do not drive cars to match western civilization look, do they?</p>
      <p>Secondly, despite the fact that anyone of us can learn from colleagues around the world, one must be careful not to give the impression that a well known Latin type designer can have any significant input for Arabic type design without being *significantly and sufficiently involved* in the field. Otherwise this would become just a “photo opportunity” to look good.</p>
      <p>-Saad</p>
