      <p>Hello Paul,</p>
      <p>Nice to chat with someone living in the heartland of Arabia!</p>
      <p>&gt;&gt;A thousand years ago, did we need to “shoehorn” one script into another? Again, because of the times, I think it’s inevitable.</p>
      <p>Actually Arabic Jazm was a clear adaptation of Musnad (the old Arabic script) to Aramaic and Hebraic scripts of the North. Script will forever interact due to real factors on the ground. But for interaction to be healthy and productive for all, it has to be interaction and melting and replacement.</p>
      <p>&gt;&gt;To disconnect individual letters in Arabic just doesn’t make sense to me and is the epitome of “sucking up.” (I don’t mean this disrespectfully.)</p>
      <p>Arabic Musnad (all over you in Yaman) had both isolated forms and cursive forms for centuries, and was bi-directional. Arabic Jazm, its derivative, started with mixed forms and ended very cursive for good reasons. Today, Latin has both too, it did not always.  I am not sure why despite all facts, one must insist or even hint that Latin owns a monopoly or patent on the proccess of simplification, adaption and diversification? Why would designing isolated (or as I call them virtually connected) *fully Arabic* letter forms would be "sucking up" to Latin or any other script?  If you can prove that Latin owns the right to isolated forms, I would be glad to give Latin the credit.</p>
      <p>-Saad</p>
