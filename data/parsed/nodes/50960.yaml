      <p>@Saad<br>
      	Sorry, I meant to reply sooner regarding your post. I was waiting on a response from someone regarding this forum. They never replied, so I’m just moving forward.</p>
      <p>	See, I told you I would be put in my place. I am truly asking these questions as a learner. I looked up the two typefaces (if we can call them that?) and in a cursory search only found info on <a href="http://en.wikipedia.org/wiki/South_Arabian_alphabet" rel="nofollow"> Musnad </a> which I do indeed recognize. It’s written on the old Marib Dam from the Sabaen days. They also used it in Ethiopia, since Saba extended there too. The other example, Jazm I couldn’t find.</p>
      <p>	Maybe I shouldn’t have said all disconnected letters = Latin. I guess I just didn’t understand the reason the characters in your fonts were disconnected, and it reminded me of Basic Arabic, which seems to be along the same lines as Matchmaking, only with less integrity. So I assumed it was a bow to Latin or western perspective. But thank you for correcting me.</p>
      <p>	However, your argument leads me to support Matchmaking even more. Arabic is even more flexible than I imagined!</p>
      <p>	I also appreciate your online friendliness, Saad. It is refreshing.</p>
      <p>	@behnam<br>
      	To answer your question as to “What’s the point?” Because it’s so drop–dead gorgeous to see the two together! It’s gestalt at it’s best. That’s an opinion from a jaded, western mindset, yes. But I think it’s progressive and very functional.</p>
      <p>	<strong>I have a suggestion for everybody…</strong><br>
      	All this talk can be a waste of time if we don’t use visual examples and discuss it on a case–by–case basis. I don’t think anyone, Huda herself, is trying to say Matchmaking is the cure–all. But in some settings, I think it works best. But perhaps you will convince me otherwise.</p>
      <p>	Behnam mentions he developed an Arabic font. Several others here I’m sure have too. Why don’t we put several cases side–by–side? I took an example of one of the Matchmaking typefaces (Nadine’s Frutiger Arabic), and put it next to a couple “correct” (I assume?) typefaces. This is only a starting point, and I am not suggesting my alternates are improvements. But I have included the source files for the below so that you can modify the logo according to your preference (using your own fonts) so that it conforms to your ideas of correctness. I would like to see them all side–by–side.</p>
