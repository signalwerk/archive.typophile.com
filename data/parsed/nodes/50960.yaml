      <p>&gt;&gt;Benham can you please provide a sample image of the Latin and Arabic you referred to in your interesting discussion on vertical spacing?</p>
      <p>Sorry Vladimir. I just discovered this thread had a second page!<br>
      You can go to <a href="http://wiki.irmug.org/index.php/X_Series_2" title="http://wiki.irmug.org/index.php/X_Series_2">http://wiki.irmug.org/index.php/X_Series_2</a> and pick any font. They all follow the same concept of magnification between Arabic and Roman. Some with more success than the others, in terms of visual harmony.<br>
      As you know, I'm not a designer and visual harmony is something I'm improving over time. But the visual magnification of all of them follows the same concept I described.<br>
      The font I was referring to in my discussion is XB Zar which to me it has the best 'standard look' for a Persian text. (the site above has XB Zar as default font) But it was one of my first fonts and the harmony is not as good as some others. But the picture below is of my latest font, XB Kayhan. As I said I'm not a designer. My main concern about these fonts is compatibility with Mac platform and language coverage. For Mac platform, I have to add AAT. I also add characters to support languages of Iran and neighbouring. I thought Afghani people will be too busy for a while to have time to make fonts for themselves. So I cover quite a few languages.<br>
      In the picture of Kayhan (with its different faces) I mixed a news from BBC in Persian and English. I think that should give you an idea.</p><div class="imageWrap"><img src="http://typophile.com/files/Kayhan_3622.png"></div><p></p>
