      <p>Behnam wrote:</p>
      <p>&gt;&gt;The question is why nobody thought of matching Roman script to Arabic?!</p>
      <p>Look around there are tons of those. In Latin users have so many choices, Arabic users should too. The way to do it is to *believe* in users (not to speak on their behalf) and keep options *wide* open.  This openness was the reason behind the golden days for Arabic, but we should not keep rehearsing past successes only but also make new advances and learn past lessons. Making fixed design rules or allowing only limited fixed flavors, would eventually destroy the Arabic script. </p>
      <p>While I do not think we should forbid matchmaking or even criticize it, I personally do not think matchmaking would be the ideal or significant way to advance Arabic typography. I do not see value for Arabic in fixed x-heights, for example. I believe designers should look to the rich history of Arabic shapes for innovation, and understand the rich lessons of typography as a field, Latin, or else, to apply in Arabic.  Arabic type designers' heroes need not be necessarily those of Latin typography, but those of Arabic typography and calligraphy.</p>
      <p>I see Tom Milo's work as a significant breakthrough. Over the years, his dedication had made him "shaykh al-Musammimeen". Still, I had never seen the value of his work as being the right or the wrong typography.  I see it as a great Arabic typography work. He is therefore a real Arabic typography hero. </p>
      <p>Matchmaking is OK as long as it is not presented as the way Arabic typography "should" be. It is ok as long as it is not turned into a vehicle to exercise censorship and  disrespect to others, or to use as a way to promote personal resumes by coupling up with shiny Latin Typography names! What was disturbing in that project was not the project itself, but the fact it was coupled with comments to "redicule" great Arbabic typography works like that of Decotype.</p>
      <p>-Saad</p>
