      <p>BTW, Vladimir: Tasmeem is a new trend in font technology - and an old one at the same time, because the underlying ACE engine has been around for quite a while and was Microsoft's proof-of-concept for was later to become Open Type.</p>
      <p>Tasmeem is totally transparent regarding Arabic typography, so one cannot seriously raise a debate about Tasmeem relative to "matchmaking". Tasmeem can handle such typography just as well as any other approach to Arabic script.</p>
      <p>The real trends are Design vs. Modelling of Arabic script. Modeling was the original business of all typographers, design is by now a no longer new secondary approach to Arabic typography. Computer Modelling however is technically speaking new, it attempts to document, analyse and synthesize classic styles and typfaces and make them available as Arabic typography.</p>
      <p>ACE is very suitable for Computer Modelling, whereas OpenType is less useful for this approach. Yet is has been attempted at least once, as can be seen in the MS Arabic typesetting font. I believe Diwan's Mushafi font is also an OpenType computer model. On the other hand there s nothing in matchmaking to date that ACE couldn't handle. In fact, our new template approach to Tasmeem Font Design will make life of matchmakers, too, a lot easier. After all, the graphic template is supported by an invisible logic and unicode template. Your own Al Quds Tasmeemi - a good example of matchmaking - displays the famous Afghani Rahman Baba poem perfectly - in Pashto.</p>
      <p>Summarizing: Tasmeem and Matchmaking ar not playing in the same league, a comparison is a non-starter. They are not at odds with each other. Nor are Design vs Modelling. They exist side by side.</p>
      <p>Regards,</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
