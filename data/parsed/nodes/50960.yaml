      <p>What's the point of matchmaking anyway? If it's about making Arabic script look like Roman, I have a far better idea. Adopting Roman script altogether (which I was a supporter in my youth and still have nothing against it). This way at least you take advantage of superior functionality.<br>
      But if it's about making them look good side by side, then make them look good side by side! Looking good doesn't mean looking identical. It means looking harmonious, each script remaining true to its nature. This is what makes them looking good. Be flamboyant, minimalist, modern, whatever you want to be in design options, but put your art to each script for what they are. Two fundamentally different scripts.<br>
      Let's face it. This is a non issue for Roman users. They don't have to put an Arabic email address, an Arabic URL, and Arabic brand name or an Arabic technical term, two three five times in each paragraph. This is an Arabic issue. And it can only be resolved in an Arabic font.<br>
      And this IS the starting point. A font that wants to create harmony between these two scripts is an ARABIC font. The issue has nothing to do with the x height.<br>
      Design Arabic and Roman characters the way you want, minding visual harmony in thickness and magnification of both scripts, adjusting the line spacing for the Arabic part (and that's the key) and you are done... in any design option.</p>
