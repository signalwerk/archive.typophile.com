      <p>Tom, I am now discovering various aspects of Tasmeem. With its use, one is given various options for adjusting word spacing, dot and vowel positioning, and choosing variant shapes for a word, for example a regular beh or an elongated one. Its very nice. While Tasmeem also has a 'mind of its own' after all it is an intelligent-font technology, it allows the user to interact with it to produce the desired effect. OT type is a 'take-it-or-leave-it' matter- the inputted text is exactly as the designer has made it, no more and no less.</p>
      <p>Paul, your suggestion and example of posting graphic samples of what we are talking about is spot on. To post an image online use the 'Insert Image' link. I am not sure what inline means! Keep up your interesting and perceptive feedback. Of the three examples you gave for بركه للصلب Nadine's Frutiger works best because it matches the logo and the Latin in style. It is well designed and belongs to the same genre of Arabic 'sans-serif' styles that now has many examples, including my forthcoming AlQuds font, also with  round dots.</p>
      <p>In the image below, I will try to illustrate some responses related to the wonderful discussions above. In the early 1960's I read Eric Gill's book on typography and designed my AlQuds lettering to make an Arabic font along the same lines as his Gill sans-serif. Matchmaking! Yes I must admit it could be described as such. More than that Gill himself lived and worked in Jerusalem, so I missed meeting him only by a couple of decades and may well have consulted him had I done so! But the way I went about it was to keep Gill's designs in the back of my mind while I researched early Koranic Arabic calligraphy, newspaper fonts, the handwriting of children, modern calligraphy  and many other influences to arrive at what I felt was the simple generic shape of Arabic letters. The modern embodiment of AlQuds is monoline, while Gill's glyphs have the typical Roman variation of thickness. </p>
      <p>Saad, I recently designed a full Latin to match AlQuds's style and its six weights, so that would be an example of matchmaking in the other 'unsucking' direction to use your terminologhy :) having the Latin match the Arabic. In the image it is easily seen that Gill's is the superior font, but my AlQuds Latin makes up for its shortcomings by matching the Arabic in overall height, thickness and the orthogonal line endings. I also designed the Indic and Arabic numerals to match the corresponding languages in my font.</p>
      <p>In the colored text I illustrate the point that first made me react against Huda's Matchmaking project. In the images khtt published, Latin text's x-height had horizontal guidelines within which the Arabic letters were fitted.  Arabic has a potential in-built superiority over Latin in that visually each Arabic word is different from the other in its word-form. Latin is boxed-in within basically rectangular boxes that look much alike. The colored outlines show how the top part and bottom parts of the Arabic have a jagged outline indicating some hints of which letters are there, while the Latin outlines are just a uniform un-individualized pattern except in a few instances. I wrote about this word-shape aspect in 1974 in this article  <a href="http://www.khtt.net/article-2603-en.html" title="http://www.khtt.net/article-2603-en.html">http://www.khtt.net/article-2603-en.html</a> .</p>
      <p>In the Arabic matched to Frutiger almost each letter tries to fit within a horizontal line even lower than the Latin x-height; for example the dal is smaller than usual and the initial tooth of the seen reaches upwards to the same height. Let us not throw away the inherent legibility advantage of connected Arabic words in the name of modernization, Westernization and globalization. </p>
      <p>Nadine I hope you will not take my views amiss; and I really look forward to seeing the results of your Arabic legibility research. Good luck.</p>
      <p>Lastly I must admit that my cartoon reflects the envy of an old man who had to proofread text in downtown Beirut amid the smoke and smell of molten lead cast by Linotype machines, and who had to use Rotring pens and white ink on paper to painstakingly draw his letters and correct them, and to wait months to wait for an answer to a renown Japanese font designer on how the challenges of modern printing were met there.  An envy of Huda's generation with access to Fontlab, Illustrator and allied font-making software that makes the creation of a 'new' font and its publication and sale a matter of a few mouse-clicks! This is wonderful and opens up a world of possibilities, but I sincerely feel that we must be the more critical and discriminating in designing, judging and using Arabic fonts.</p>
      <p>Benham, I appreciate your perceptive comments on Arabic-related fonts, but must you even <em>mention</em> the Turkish disaster that overtook the Arabic script there?! :)</p>
      <p>Aziz, with flowers<br>
      _________________<br>
      Vladimir Tamari<br>
      Homepage: <a href="http://www.ne.jp/asahi/tamari/vladimir/" title="www.ne.jp/asahi/tamari/vladimir/">www.ne.jp/asahi/tamari/vladimir/</a><br>
      Arabic lettering: www.khtt.net/person-2306-en.htmlari/vladimir</p><div class="imageWrap"><img src="http://typophile.com/files/alqudslatingill_5476.jpg"></div><p></p>
