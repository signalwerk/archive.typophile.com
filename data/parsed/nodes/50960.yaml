      <p>The visibility of Arabic script is a matter of vertical space. The line spacing in the font.<br>
      Beside the obvious physical law, that anything in smaller size is less visible than in larger size, there is absolutely no visibility problem with Arabic script... unless it is viewed through the Roman eyes.<br>
      But looking at it through the Roman eyes is completely unnecessary. Because Roman fonts do not need Arabic.<br>
      If there is a special project which requires materials in Arabic and Roman, tastefully selecting an Arabic font on one hand, and choosing a Roman font on the other, can do the job eloquently.<br>
      But Roman in Arabic fonts is needed for everyday use and for such font, Roman characters have ample room to position themselves properly beside Arabic characters.</p>
      <p>There is a couple of exceptions however, that Roman fonts do need to contain Arabic. Fonts that provide some technical support to a device for its functionality, or technical support for functionality of communication between devices. Fixed width fonts and OS system fonts are of that nature and reasonably they should be considered as Roman fonts containing Arabic.<br>
      The issue of visibility only arise in such context. Meaning when Arabic script is deployed in a font fundamentally Roman.<br>
      For fixed width fonts, there is practically no expectation for aesthetics and Courier New for example, is quite successful to provide an Arabic support for what it intends to do. There is no typographic expectation.<br>
      For system fonts, the situation is complicated. They need to include Arabic for technical support but they can't provide the typographic needs of the script. Yet their presence is highly noticeable.<br>
      The abomination of Microsoft's Tahoma for Arabic script (which has now apparently become a school of thought!) was actually a creative approach to address the visibility issue of Arabic script within a Roman system font. For Arabic script in a Roman font, the choice is between shrinking the characters to fit the Roman line space (therefore visibility problem), or chopping off the script and maintaining the same magnification as the Roman characters. Tahoma chose the second and successfully so, for what it intended to do. But what it intended to do, by no means was to create an Arabic font.<br>
      Apple in Mac OS 10 initially had the same approach as Tahoma, with its system font Lucida Grande. But after the first or second update, this approach was abandoned to address the problem of noticeable presence of system font in Arabic rendering.<br>
      The system font of Mac OS 10 now allocate Arabic rendering to a specifically designed Arabic font called Geeza Pro. This is a very well rounded simplified Naskh font and although it hasn't resolved yet the spacing and somewhat the magnification issue, but it does address the noticeability issue and the Arabic rendering at system level on a Mac is quite good.<br>
      I think this is the approach that should be considered when for technical reasons a fundamentally Roman font needs to provide Arabic support too.</p>
      <p>So the issue is not visibility. It's the space. Zapfino is not less visible than Times. It only needs more space. And this is *not* a deficiency. For the same magnification, Arabic script needs more space. This also is not a 'deficiency' to be 'fixed'. The difference is that for Roman script Zapfino is a design choice. For Arabic it is inherent to the script.</p>
      <p>When the space is inherent to the script, designer can only play within and around that space. And why should you do it otherwise if you are designing an Arabic font? Of-course the creativity can go anywhere it wants. It can increase or decrease the vertical space of the characters. But it is very important to emphasize that this creativity should be through Arabic eyes, not Roman.<br>
      I'm drafting this text with an Arabic font that I made with this concept. It provides perfectly balanced visibility and magnification for both Arabic and Roman. This balance is necessary for Arabic use in which Roman is vastly present. And although this Arabic font is not intended for Roman only text, the text I'm drafting right now is quite acceptable for non professional use. This Arabic font does not cut off head and legs of Roman characters. All it does is that it puts a little more line spacing that is a tad excessive for Roman only use.<br>
      Unless there is a technical purpose, Roman font makers need not include Arabic to their fonts.</p>
    html_clean: |-
      <p>The visibility of Arabic script is a matter of vertical space. The line spacing in the font.<br>
      Beside the obvious physical law, that anything in smaller size is less visible than in larger size, there is absolutely no visibility problem with Arabic script... unless it is viewed through the Roman eyes.<br>
      But looking at it through the Roman eyes is completely unnecessary. Because Roman fonts do not need Arabic.<br>
      If there is a special project which requires materials in Arabic and Roman, tastefully selecting an Arabic font on one hand, and choosing a Roman font on the other, can do the job eloquently.<br>
      But Roman in Arabic fonts is needed for everyday use and for such font, Roman characters have ample room to position themselves properly beside Arabic characters.</p>
