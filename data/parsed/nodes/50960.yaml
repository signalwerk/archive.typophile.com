      <p>I agree with your conclusions. The most important sentence is this:</p>
      <p><cite>It would be quite feasible to design an Arabic version of a Latin typeface using Tasmeem technology.</cite></p>
      <p>Put differently, TMM could as well have used ACE technology* instead of OT technology. OT layout tables are mere technology, ACE is mere technology, and both can be used for whatever kind of design.<br>
      The difference is their architecture and how suited each is for the task at hand (laying out Arabic script). This affects not only elegance of the respective approach but also reduction of complexity -- how easy is it for designers to create fonts of various degrees of complexity. The last aspect is not unimportant. If the reason for typefaces to be kept "simple" is restrictions of the technology, then something went terribly wrong. Technology should be gentle and allow for whatever may make sense. And whether designers prefer simplified or complex designs should be entirely driven by their design visions, not by technology or by their ability or inability to master it. With OpenType, I fear that often it is indeed the latter than determines design.</p>
      <p>One tiny correction. In the opposition which you sketch there is a misconception which is also at the heart of the (to me) silly ACE vs TMM debate:</p>
      <p><cite>Some designers are more interested in the resulting visual aesthetic (for example, an Arabic companion to a famous Latin typeface) and there are those who are interested in investigating the complex structural aspects of the script (and that's where Tasmeem sits).</cite></p>
      <p>This neglects an important point: Analysing the structure of a script (in this case Arabic) is <em>necessary condition</em> for developing technology which in turn serves as vehicle for actual fonts which incorporate this or that design. In so far, Thomas did the ground work on which results others can base their (design) work.<br>
      (In this respect, of course not only ACE but also the architecture of OT layout tables is based on analysis of one or more scripts. Which again raises the single relevant question -- which analysis and thus technology is more appropriate?)</p>
      <p>Reading Vladimir's original post again, I find that this is in the first place about different approaches to design. The one visible in TMM typefaces and DecoType's which is more traditional. The mentioning of Tasmeem or ACE in this context is a bit misleading because it mixes different levels. Or does the question "How will the software work with newer more geometrical styles of Arabic?" indicate that the design level is independent of the technology level?</p>
      <p>* Not "Tasmeem technology". ACE is the technology, Tasmeem makes use of it. Just like OT is the technology of which InDesign makes use. As an analogy, you would not say that Linotype offers "InDesign fonts", I assume.&nbsp;&nbsp;:)</p>
      <p>[Says someone who is ignorant of Arabic but highly interested in technology as <em>Bedingung für die Möglichkeit von</em> design.]</p>
