      <p>Vladimir</p>
      <p>&gt;&gt;Since the mid-sixties the Arab press is favoring the use of Latinized Arab numerals 012345 (rather than the Indic numerals). The fonts often used for the numerals is awfully mismatched and jumps out of the line in a disturbing way.</p>
      <p>This was actually a good phenomenon that went wrong because of laziness or perhaps due to that Matchmaking mentality. In all my fonts, I take time to redesign these numbers to match the Arabic text, in a clear bias decision. </p>
      <p>&gt;&gt;The glory of Arabic script is the compact and curvatious lines and highly developed sense of the individuality of each letter-shape. It is written in a totally different spirit than Latin with its blocks of same-height letters and repeated forms.</p>
      <p>This is true to some extent, but should not be taken to an extreme. We need to address, additionally, typography, without requiring blindly rules of calligraphy and handwritting.  As Latin typography succeeded to do to some extend, Arabic typography should rid itself from that “anal typography” element within!</p>
      <p>&gt;&gt;You are specially welcome here as it is good to hear the views of someone in a position to know much more about what is going on in the market and design community than any one of us as individuals.</p>
      <p>The Arabetic font market needs wide options.  Designers need to design, present, and let users decide. A market share of 1% for a font is as legitimate and important as 30%! No one should be in a position to deprive Arabic from this natural basic right.</p>
      <p>&gt;&gt;It has now become technically possible to present scripts of any imaginable complexity by programming the software under the hood.</p>
      <p>This is great news indeed, but it should not be used as call to “keep” intact complex scribing and calligraphy rules as rules of typography. As I wrote in one of my articles a “technology friendly font is a font independent of technology”. Technology changes and there is no final solution here. Arabic fonts should not be obstacle to technology, but an easy and light companion of it.</p>
      <p>&gt;&gt;I am now newly aware how difficult it is to design a really good Latin font!</p>
      <p>Actually I think designing good Arabic fonts is much easier than designing Latin fonts, even lousy Latin fonts.</p>
