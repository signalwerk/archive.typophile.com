    votes: null
    html: |-
      <p>Pretty hard to innovate if you can’t have a relationship with the printer, look at samples, etc…</p>
      <p>You will be lucky to just get good color reproduction if this is how your workflow progresses - I would attempt to talk to the wineries and explain that for the best outcome you need to have a relationship with the printer.</p>
      <p>Maybe you could find a great printer for labels and try to steer the wineries there.</p>
      <p>Best of Luck!</p>
      <p>pbc</p>
