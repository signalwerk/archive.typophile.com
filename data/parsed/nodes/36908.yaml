    html: <p>I never know who is printing it overseas in advance. Each winery has different vendors and they decide when they get the order which to use. They don’t get the order until we get the order and we don’t get the order until our customer has sampled the juice and approved the label design.</p>
    html_clean: <p>I never know who is printing it overseas in advance. Each winery has different vendors and they decide when they get the order which to use. They don’t get the order until we get the order and we don’t get the order until our customer has sampled the juice and approved the label design.</p>
