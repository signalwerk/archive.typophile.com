      <p>Regarding this font, I agree with Frank here. You really need to make it look less written and more drawn. Strictly copied calligraphic letters tent to not be subtle enough to work as printed letters.</p>
      <p>&gt; On a side note: Is Bloemsma the new fad?</p>
      <p>I wonder about that. I very much was liking Bloesma, thinking his typefaces were underused. And then it seems everyone else must have felt the same way, because, as you say, he seems to be the new fad.</p>
