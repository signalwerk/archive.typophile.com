      <p>Jules, this is very interesting. Needless to say, you now have to vectorize these shapes disregarding most of the artifacts of the brush. Keep those that add value, kill those that doesn’t. (Some of those I would explore are the cuts in V/W/A and similar shapes — why not also in M and N?, also top left R/D/P.) Look to Ourtype’s Meran and H&amp;FJ’s Whitney for reference. Another face that evokes a similar feeling is Antique Olive, and obviously Bloemsma’s own Balance.</p>
      <p>Your signature letters, a/g/e, all needs more work. The latter is perhaps not so bad — maybe it just needs even more exaggeration — but the two former are too unbalanced and too clunky. S/s spine would usually need more weight, but in this case: who knows. I think that one is also a matter of not doing the wrong thing clearly enough. (Think of it like actor’s lines and movements on a stage!). G-chin. I’ve seen it done in an old antique grotesque. I personally don’t think it works here. h/m looks narrow to me, at least compared to u. Where did all the crazyness go in x/y/z? H narrow. P bowl, maybe bigger? K/k: puh-lease! And the list goes on, but I’d address those first.</p>
