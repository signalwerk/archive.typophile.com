    <p>Hello,<br>
    Long time lurker but this is my first post.</p>
    <p>I'm working on my first typeface and think am reaching a point at which feedback could be extremely useful!</p>
    <p>My starting point for drawing this alphabet was to draw each character twice with a flat brush: once at a 0° angle to get the horizontal stress I wanted to go for and define the inner shapes of the letters, the second time at a 45° angle to stress the outer shapes of the letters.<br>
    Needless to say this is quite Bloemsma-inspired :)</p>
    <p><img src="http://img641.imageshack.us/img641/1136/53336116.jpg"></p>
    <p>Here is how it looks like as of today:</p>
    <p><img src="http://img137.imageshack.us/img137/766/poster2l.jpg"></p>
    <p>Thank you in advance for any critiques!</p>
