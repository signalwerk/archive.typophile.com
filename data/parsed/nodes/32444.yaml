    <p>So, client went withthe  Eight Shape, so I took the crap out of the middle and went with two leaves on the side. Created a two colour version, that can obviously work in just black as well.<br>
    Im really stuck on the placement of a typographic mark with the loogo mark. They need to exist together but I cant seem to nail it down. Would love some ideas from the well informed. </p>
    <p>Edited Version. . . </p>
    <p>Changed to Centennial. .. . still iff'ed out about the placement.</p>
