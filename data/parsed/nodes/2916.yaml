    html: <p>Another one I suggest to people who want the baseball style swashes is <a href="http://www.letterheadfonts.com/contributors/tomkennedy/pilsner.shtml" target="_blank">Letterhead Fonts "Pilsner"</a>, which comes with a whole font set of swash shapes you can add to the names. (Looks like Casey might have some too. That was a new one for me Mark.) <br> <br>Letterhead also has one called <a href="http://www.letterheadfonts.com/contributors/tomkennedy/ephemera.shtml" target="_blank">Ephemera</a>, with swashes, but the letter style is much older and fancier-looking.</p>
