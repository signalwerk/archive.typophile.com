  html: <p>I don't think it's a font, but there are some fonts like this. Kestrel would be similar, but I don't think it's available in digital format. You might also try Leslie Cabarga's <a href="http://www.flashfonts.com/flashsite/fontspage.htm">Casey</a>.</p>
