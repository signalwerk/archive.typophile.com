  html: |-
    <p>We are looking for a project, Univers and Futura in Greek.<br>
    We found several solutions, but will need:</p>
    <p>Futura Std Book<br>
    Futura Std Light<br>
    Futura Std Light Condensed<br>
    Univers LT Std 47 Light Condensed<br>
    Univers LT Std 47 Light Condensed Oblique<br>
    Univers LT Std 47 Bold Condensed<br>
    Univers LT Std 47 Bold Condensed Oblique</p>
    <p>Let us know websites where you can buy or where to download.<br>
    Thanks for your cooperation.</p>
