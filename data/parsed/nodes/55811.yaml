  html: |-
    <p>it was just one week ago that i made my first post here.</p>
    <p>yeah, it seems like much longer than that to me too...<br>
    i guess, like they say, time flies when you're having fun.</p>
    <p>anyway, i'd like to thank all the people here who have<br>
    welcomed me, and made me feel at home.  sincerely...</p>
    <p>anyway, now that we have exchanged our pleasantries,<br>
    it's time to get to work...</p>
    <p>i've programmed an app that takes the text of a book<br>
    as its input, and outputs a .pdf version and .html files.</p>
    <p>one .html version includes the whole book in one file.</p>
    <p>another .html version splits the book up into chapters,<br>
    creates a web-page for each chapter, and links them...</p>
    <p>the third .html version splits the book up into _pages_,<br>
    and creates a web-page for each _page_ of the book...<br>
    this version puts an image of the page next to its text.<br>
    (it was originally developed to proof o.c.r. output.)</p>
    <p>this granularity-level allows people to make comments<br>
    about specific aspects of the book, so each of the pages<br>
    has a form to collect the comments, and error-reports.<br>
    (that form is extremely primitive at this point; so be it.)</p>
    <p>the main idea of this page-by-page web-site version<br>
    is that authors should corral and focus their readers,<br>
    in order to establish a community around their work,<br>
    cumulating small gifts from fans to make their living.</p>
    <p>in this vein, the .pdf version has a link, on every page,<br>
    that takes the reader to the web-page for that page...<br>
    thus the .pdf and web-version are tightly interleaved.</p>
    <p>now, the web-version has lousy typography, of course,<br>
    because it lives in the browser.  not much hope there...</p>
    <p>but the .pdf version?  well, there's some hope there.<br>
    and that's good, since the .pdf version will be what'll<br>
    be used when fans take the print-on-demand route,<br>
    via lulu.com, createspace, or a slew of future options.</p>
    <p>but my main goal is to make the .pdf readable as is,<br>
    as an e-book, on-screen, and for that reason, i am<br>
    eager to apply the lessons learned by typographers<br>
    -- or, more aptly, _book_designers_  -- in the past.</p>
    <p>at the same time, i must live within the limits that<br>
    are imposed by relatively scarce resources on the<br>
    hand-held machines -- the iphone, kindle, etc. --<br>
    that currently make up the e-book infrastructure...</p>
    <p>in the large realm, the one thing that challenges<br>
    resources to their breaking point is hyphenation,<br>
    especially since it must be real-time, on-the-fly.</p>
    <p>we don't have enough firepower to do hyphenation,<br>
    not correctly anyway, and doing it badly is no option.</p>
    <p>but if we can't do hyphenation, the next question is<br>
    whether we can expect to do justice to justification.<br>
    loose lines are bad in print; they're awful on-screen.</p>
    <p>it would be very sad to give up on justification though,<br>
    because -- perhaps more than any other variable --<br>
    justification is what makes a book "look like a book"...</p>
    <p>and to the extent that e-books can "look like a book",<br>
    we will ease their introduction to the public at large...<br>
    (it is for this reason that the kindle currently justifies,<br>
    even though the white-space rivers look like _crap_.)</p>
    <p>so i'm doing experiments on how to keep justification<br>
    -- even after we've kicked hyphenation to the curb --<br>
    and i would like feedback from book-designers here.</p>
    <p>if my experiments fail, i want you to say that, loudly...<br>
    i don't have anything invested in any of these tactics,<br>
    i'm simply trying to find out if any of them will _work_.</p>
    <p>if they don't work, you won't hurt my feelings to say it.</p>
    <p>(and even if it _would_ "hurt my feelings", you should<br>
    say it anyway, because truth compels you to be honest.)</p>
    <p>in order not to bias my experiment, i used actual text<br>
    from an actual book (one recently released by o'reilly).</p>
    <p>to avoid copyright concerns, however, i scrambled<br>
    the text.  i randomly replaced every lowercase vowel<br>
    with a different lowercase vowel, with the effect that<br>
    the general tenor of the words and lines was retained.<br>
    (although it probably raised havoc with the kerning.)</p>
    <p>i then used my tool to create .pdf and .html versions.</p>
    <p>the text was unhyphenated, but i did justification on it.</p>
    <p>so, the first question i have for you is a simple one:</p>
    <p>&gt;   "of the 144 pages within this .pdf, how many have<br>
    &gt;   an unacceptably high number of too-loose lines".</p>
    <p>ok, maybe that question isn't _quite_ so simple, with<br>
    all of its inherent vagueness -- what constitutes a<br>
    "too-loose" line?, and what's a "high" number of 'em?,<br>
    let alone an "unacceptably" high number?, and what<br>
    about the pages that don't have any justified lines? --<br>
    but you get the general idea of what i'm asking here...</p>
    <p>in general, did the tactics that i used make it work?</p>
    <p>so, there are two ways you can look at the pages...</p>
    <p>you can just download the .pdf:<br>
    &gt;   <a href="http://z-m-l.com/go/bomoc/bomoc.pdf" title="http://z-m-l.com/go/bomoc/bomoc.pdf">http://z-m-l.com/go/bomoc/bomoc.pdf</a></p>
    <p>or you can use the online page-by-page version:<br>
    &gt;   <a href="http://z-m-l.com/go/bomoc/bomocp001.html" title="http://z-m-l.com/go/bomoc/bomocp001.html">http://z-m-l.com/go/bomoc/bomocp001.html</a></p>
    <p>in the web-version, clicking each page takes you to<br>
    the next page.  or you can jump to a specific page<br>
    by changing the zero-padded number in the u.r.l.</p>
    <p>for instance, here's the u.r.l. for page 123:<br>
    &gt;   <a href="http://z-m-l.com/go/bomoc/bomocp123.html" title="http://z-m-l.com/go/bomoc/bomocp123.html">http://z-m-l.com/go/bomoc/bomocp123.html</a></p>
    <p>if you want to talk about a specific page, tell us the<br>
    page-number, so we can look at that page online...</p>
    <p>there are lots of things that are downright _ugly_<br>
    in that .pdf.  it's just the starting point from which<br>
    i will be demonstrating several improved iterations.</p>
    <p>so there is no need to belabor all the bad aspects...<br>
    (especially the bottom-balancing should be ignored.)</p>
    <p>right now, i'm looking for feedback on loose lines.</p>
    <p>oh yeah, what i did is i used a multi-line approach.<br>
    not the sophisticated ones used by tex or indesign<br>
    -- again, limited resources, and all in real-time --<br>
    just a pretty simple one.  nothing novel about that...</p>
    <p>i did, however, throw in a couple of other little tricks.</p>
    <p>i believe they should be pretty obvious to you experts,<br>
    but i'll let you tell me what they are, and not vice versa.</p>
    <p>and then, of course, i am curious if you think that they<br>
    are tricks that are "legit" or not, and why you think that.</p>
    <p>-bowerbird</p>
