      <p>don said:<br>
      &gt;   Have you looked into Donald Knuth’s<br>
      &gt;   algorithm for TeX hyphenation.</p>
      <p>yes.  </p>
      <p>&gt;   It is published in Computers and Typesetting, Volume A</p>
      <p>it's pretty hairy, isn't it?          :+)</p>
      <p>&gt;   and provides pretty good hyphenation that<br>
      &gt;   worked on machines 20 years ago, when<br>
      &gt;   resources were much more limited than they are today.</p>
      <p>when i speak of "limited resources", i mean in devices like<br>
      the iphone, the kindle, and sony reader, not the desktop...</p>
      <p>in addition, moreover, with such machines there's a need<br>
      to execute the routine on-the-fly, in real-time, and to be<br>
      impervious to those situations which "cannot" be resolved.</p>
      <p>tex, in contrast, is a batch program, so you're judging it<br>
      in a different context that really has little relevance here.<br>
      even if it's typically fast, there are some occasions where<br>
      it can take a while.  and sometimes it will just give up and<br>
      say "this paragraph just _won't_ work as is, so rewrite it."<br>
      we simply don't have that luxury in a handheld situation.</p>
      <p>now, it _is_ possible to have the routine do just one page,<br>
      or a few, a tactic used by some apps...  (ok, one, stanza.)</p>
      <p>but there are two problems with this approach.  the first<br>
      is that the routine interrupts the reader's attentional flow<br>
      when there's a delay, however short, every page or three.</p>
      <p>the second is that it makes the pagination indeterminate.<br>
      so, to jump to the middle of a book -- e.g., page 123 --<br>
      you need to run the routine on the first 122 pages first;<br>
      otherwise, you don't know what text falls on page 123...</p>
      <p>the only way to avoid this is to "guess" where page 123 is.</p>
      <p>while some viewer-programs do operate in this manner<br>
      -- such as mobipocket, and thus probably the kindle --<br>
      it's quite unsatisfactory, and leads to some weird shit...<br>
      for example, in mobipocket, paging forward to page 123<br>
      will sometimes give you _different_text_ on that "page"<br>
      than you'll get when you page _backward_ to page 123.<br>
      (and not just on page 123, but _all_ intervening pages.)</p>
      <p>obviously, that _breaks_ our notion of what a "page" is,<br>
      in a fairly significant -- and wholly impractical -- way.</p>
      <p>some day we will all be carrying around machinery that<br>
      would qualify as a "supercomputer" today.  but not today.<br>
      (but the iphone is a "supercomputer" from 40 years ago.)</p>
      <p>&gt;   Without hyphenation you are going to have<br>
      &gt;   a lot of trouble getting good readability.</p>
      <p>well, that's actually the point in question here, right now.</p>
      <p>specifically, we know that we can't do hyphenation right.</p>
      <p>so the question is, "must we abandon justification too?"</p>
      <p>i'd like to save justification -- as an option, at least --<br>
      so i'm doing some experimentation to find out if we can<br>
      use means other than hyphenation to avoid loose lines...</p>
      <p>i made a .pdf -- with actual text from an actual book --<br>
      that uses justification without hyphenation, as one test...</p>
      <p>so i'm looking for feedback from you experts here as to<br>
      whether you think that it looks "good enough" or not...</p>
      <p>i'm also going to compute the increase in word-space,<br>
      because i think hard numbers are useful in addition to<br>
      the subjective "looks good to me" or "looks bad to me",<br>
      but, as with much typography, the ocular test is best...</p>
      <p>***</p>
      <p>aluminum said;<br>
      &gt;   Are you NOT asking about the web site you are building?</p>
      <p>i am _not_ asking about the website.  emphatically not...</p>
      <p>right now, i'm asking if the justified lines in the .pdf show<br>
      sufficient tightness, or if there is an excess of loose ones.</p>
      <p>i merely put up the website so that people who only want<br>
      to view the occasional-page-being-referenced can do so<br>
      -- like say i talked about page 123, you could just view:<br>
      &gt;   <a href="http://z-m-l.com/go/bomoc/bomocp123.html" title="http://z-m-l.com/go/bomoc/bomocp123.html">http://z-m-l.com/go/bomoc/bomocp123.html</a><br>
      -- without having to download the whole .pdf.  (but the .pdf<br>
      is only 2.6 megs, so it's not like it's _that_ big of a burden.)</p>
      <p>but the text on the website, and its underlying .html,<br>
      means next to nothing to me at this point in time, no.<br>
      i could just as easily have eliminated it entirely.</p>
      <p>that having been said, though, i will eventually be _quite_<br>
      interested in using the best c.s.s. that experts can write<br>
      for the sites produced by my tool, so if you would like to<br>
      _produce_ that c.s.s., do please let me know, and i will<br>
      be quite happy to tell you what i have in mind, and then<br>
      let you go to work doing what you think should be done<br>
      -- after all, you're the expert! -- and when you're done,<br>
      i will be quite happy to evaluate it for use with my tools,<br>
      and will give full and proper credit for your contribution.</p>
      <p>_that_ would be "constructive"...</p>
      <p>***</p>
      <p>one more thing...</p>
      <p>i have regenerated the .pdf without the bottom-balancing,<br>
      because the carding caused too much variation in the color,<br>
      making it difficult to gauge the looseness of justified lines...</p>
      <p>the new .pdf is now available at the old location:<br>
      &gt;   <a href="http://z-m-l.com/go/bomoc/bomoc.pdf" title="http://z-m-l.com/go/bomoc/bomoc.pdf">http://z-m-l.com/go/bomoc/bomoc.pdf</a></p>
      <p>the old .pdf is renamed, if you want to look at it:<br>
      &gt;   <a href="http://z-m-l.com/go/bomoc/bomoc-1.pdf" title="http://z-m-l.com/go/bomoc/bomoc-1.pdf">http://z-m-l.com/go/bomoc/bomoc-1.pdf</a></p>
      <p>i'll replace the page-scan images in the website as well,<br>
      since they are simply screenshots lifted out of the .pdf...</p>
      <p>in the process, i might update the .html, for mr. clark...<br>
      (but no promises, joe.)</p>
      <p>-bowerbird</p>
