      <p>when you find "whatever", let people know.  that's what i'll be doing...</p>
      <p>&gt;   Are you targeting currently existing hardware,<br>
      &gt;   or aiming for the future? </p>
      <p>both.  the future _is_ now.</p>
      <p>-bowerbird</p>
