    html: |-
      <p>theunis said:<br>
      &gt;   is the reason I’m suggesting inserting hyphens into the data files.</p>
      <p>but, once again i say, that's not where the time-bottleneck is.</p>
      <p>when you know exactly what word needs to be hyphenated,<br>
      it's not time-consuming to find the word in a look-up table.</p>
      <p>(preinsertion might not save _any_ time, whole-picture-wise,<br>
      because you will need to delete all the unnecessary hyphens.)</p>
      <p>the time-bottleneck comes from paginating the entire book...</p>
      <p>note that your inexperience here is starting to test my patience;<br>
      you need working code if you want to make a convincing point.</p>
      <p>&gt;   There is no reason at all the reader device should be able<br>
      &gt;   to hyphenate — it should display text.</p>
      <p>again, if you want preformatting, then it gets even more hairy,<br>
      because you then need additional buy-in for the preformatting.</p>
      <p>so, in addition to working code, you need charisma as well...</p>
      <p>&gt;   And yes, I admit, it means data files should be prepared</p>
      <p>right.  and that has ramifications that go beyond working code.<br>
      but for now, it would be good enough to deliver working code...</p>
      <p>&gt;   It means that you cannot download any Project Gutenberg text<br>
      &gt;   and automatically expect the best possible reading experience<br>
      &gt;   — but I doubt people are realistically expecting this right now.</p>
      <p>that happens to be the exact goal i had when i started this work.</p>
      <p>and i was expecting that preformatting would be a requirement.<br>
      (and -- since i was willing to do that preformatting by myself --<br>
      i had the necessary buy-in.)</p>
      <p>and i found that the job _can_ be done without preformatting.</p>
      <p>not with project gutenberg e-texts per se, because they have<br>
      tons of inconsistencies.  but if they had been properly prepared<br>
      -- by which i mean they had merely followed their own rules --<br>
      i would indeed be able to download them and run them _as_is_.</p>
      <p>so now, instead of "preformatting" them, i'm merely making them<br>
      _consistent_, which is a much smaller burden, largely automatic...</p>
      <p>&gt;   Or, for that matter, that it’s even possible using fully automatic<br>
      &gt;   software; an example that springs to mind is automated translation<br>
      &gt;   of straight to curly quotes. See the mishaps of SmartyPants<br>
      &gt;   (’cause ’no we can’t’).</p>
      <p>smartypants isn't quite as smart as it could be.</p>
      <p>but that's all beside the point, because even with preformatting,<br>
      you can't get the performance you need if you do hyphenation...</p>
      <p>or maybe _you_ can, but you'll need to show me the working code.</p>
      <p>-bowerbird</p>
