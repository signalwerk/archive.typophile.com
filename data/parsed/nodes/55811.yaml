      <p><cite>ok. prove it by making a hyphenation routine work on your phone fast enough to process an entire book in real-time on-the-fly...</cite></p>
      <p>My proposal was actually to do that beforehand. There is no reason to dismiss this idea whatsoever. That's what I meant with 'tagging' and 'preformatting' -- the more work is done in the file that goes <em>into</em> your hypothetical reader, the lesser it has to do on its own.</p>
      <p><cite>when you find “whatever”, let people know. that’s what i’ll be doing...</cite></p>
      <p>Yep -- the points I mentioned earlier. Live hyphenation, for example, requires all texts tagged with the correct language. It's no different than tagging text to be italic, or bold, or as quotes. Surely you don't expect your (hypothetical?) program to handle that without supervision? So, take as much of the burden of "live" formatting <em>away</em> from your reading device and move it into the data file. As per your example, if page numbers need to be known in advance (if your document contains references to absolute pages, e.g., a table of contents, an index, or internal references), you have no choice but to "fix" page boundaries. If you don't you will <em>have to</em> devise a way to <em>generate</em> the page references when needed. It's really one or the other.</p>
      <p>You'll have to define your reading target, though, as formatting of a novel is quite different than that of, say, a programmer's guide to Perl (to name a random scientific text).</p>
      <p><cite>you and i have no beef. do you get that? you’re arguing with _reality_. and, in my experience, that’s a waste of time, since reality always wins. and if you _insist_ on arguing, she will slap you in the face big-time...</cite></p>
      <p>I'm merely trying to fathom what you are hoping to accomplish. No arguing involved.</p>
      <p><cite>the future _is_ now</cite></p>
      <p>Apparently it is not, since by that argument you shouldn't have any problems with futuristic specs. If your target is <em>current</em> software and hardware, you have no other choice than to opt for text only. No justification, no hyphenation. And do all pocket readers even support italic text?</p>
