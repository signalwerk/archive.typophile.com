      <p>soft hyphens _still_ don't work with all browsers.</p>
      <p>and the big reason for that is the browser-programmers _know_<br>
      hyphenation is a time-sink that will make users unhappy waiters.</p>
      <p>&gt;   No hyphenation means you cannot really expect good looking<br>
      &gt;   justified text — as has been remarked upon before. Case closed.</p>
