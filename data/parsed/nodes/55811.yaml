      fast enough to process an entire book in real-time on-the-fly...</p>
      <p>the world will thank you.  well, ok, _typographers_ will thank you.<br>
      (everyone else will yawn and turn back to "dancing with celebrities".)</p>
      <p>you and i have no beef.  do you get that?  you're arguing with _reality_.<br>
      and, in my experience, that's a waste of time, since reality always wins.<br>
      and if you _insist_ on arguing, she will slap you in the face big-time...</p>
      <p>&gt;   I must repeat, there is no way (barring futuristic AI applied<br>
      &gt;   to typesetting) any random document can be typeset (oh alright,<br>
