      <p>On the TeX hyphenation jabs:</p>
      <p>The routine was developed in the early '80s. At that time, TeX ruled because no desktop machines were fast enough to run it at real time; only through batch processing could TeX deliver its pages.</p>
      <p>Fast forward to now.</p>
      <p><cite> &gt; It is published in Computers and Typesetting, Volume A</cite></p>
      <p>it’s pretty hairy, isn’t it? :+)</p>
      <p>Not if you're a half decent programmer. (grin)<br>
      For laffs, I just finished programming a Windows text viewer, incorporating proper justification (up to semi-pixel precision) <em>and</em> Liang hyphenation thrown in. Now I'm contemplating Knuth/Plass paragraph breaking, because it seems worth a try to check if text <em>really</em> breaks 'nicer'.</p>
      <p><cite>sometimes it will just give up and say “this paragraph just _won’t_ work as is, so rewrite it.” we simply don’t have that luxury in a handheld situation</cite></p>
      <p>Granted -- but even desktop giant InDesign, with its advanced hyphenation (better'n Liang's! more hyphens, distinction between preferred breaking positions and less preferred ones) and not-quite-TeX-like line breaking [*], will not <em>always</em> produce high quality typesetting. If you only have one go, you'll have to anticipate every possible problem, such as words in other languages, mathematical formulas popping up inside running text, and the occasional this-would-look-better-if-broken-otherwise.</p>
      <p>[*] They <em>do</em> use a derivation of the algorithm, but where TeX can leisurely fill up the entire RAM of a computer, contemplating a very long paragraph, ID stops evaluating a paragraph after so-many lines, breaks those into the best lines, then continues with the rest. So, while it is possible there are better line breaks possible, the routine produces a "best with limited time &amp; memory". I presume next versions will get better, with more memory and faster CPUs.</p>
