      <p>&gt; the one thing that challenges<br>
      resources to their breaking point is hyphenation,<br>
      especially since it must be real-time, on-the-fly.</p>
      <p>Have you looked into Donald Knuth's algorithm for TeX hyphenation. It is published in Computers and Typesetting, Volume A, and provides pretty good hyphenation that worked on machines 20 years ago, when resources were much more limited than they are today.</p>
      <p>Without hyphenation you are going to have a lot of trouble getting good readability.</p>
