      <p><cite>but as long as you’re talking about _indesign_,<br>
      you’re not talking about _handheld_ machines.</cite></p>
      <p>Correct. InDesign is an interactive DTP application, where handheld machines are barely interactive -- Page Forward, Page Back. Maybe Search as well.</p>
      <p>I'm guessing you want hardware specs to be as low as possible, so the prudent thing is to 'prepare' text for handhelds by <em>pre-hyphenating</em> text. That can be done using any old system, running a hyphenator as slow as you want. But that's already been suggested, and</p>
      <p><cite>let me know when 60% of the population surfs with<br>
      a browser that supports this thing, and i’ll be happy.</cite></p>
      <p>... as a matter of fact, my first complete Knuth/Liang hyphenation program exactly <em>did</em> that in 2004. It did exactly what the Google.code hyphenator does: insert all possible hyphens in a HTML file. I proposed it to the firm I was working for at the mo', to be used in a HTML reference guide they were working on. It was turned down because it apparently did not "work with ALL browsers", which was kind of a bummer.</p>
      <p>So. No hyphenation means you cannot really expect good looking justified text -- as has been remarked upon before. Case closed.</p>
      <p><cite>it will be a very long time before they match the resources of a desktop computer today, let alone grow to something with “more memory and faster cpus”.</cite></p>
      <p>Sitting here with a g*d*mn <em>phone</em> surpassing memory and CPU caps of my first computer by a factor I'm to weary to calculate, I tend to disagree.</p>
      <p><cite>the entire workflow of one-time-layout [...] will morph to each individual specifying her own preferences for a pod-book, with layout proceeding from her personal choices.</cite></p>
      <p>Absolutely agree on that. But I must repeat, there is no way (barring futuristic AI applied to typesetting) any random document can be typeset (oh alright, "formatted") in just about any pleasing way the customer wants. There must be some form of pre-formatting, or tagging, or whatever. Adding hyphens to the mix is not difficult.</p>
      <p>Are you targeting currently existing hardware, or aiming for the future? If the former, you have no choice but to opt for the most common divider -- "it displays text", and that's all.</p>
