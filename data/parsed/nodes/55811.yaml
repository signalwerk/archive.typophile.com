    html: |-
      <p>Your HTML semantics are extremely poor; <code>BR P</code> is not how we mark up a paragraph, even in HTML 4.</p>
      <p>It’s good your PDF has bookmarks, but any claimed use of a PDF for E-books requires tagged PDF, and you have to use semantics there that are even better than HTML’s.</p>
      <p>You haven’t actually even declared a human language in either case.</p>
      <p>Your approach is OK for an early beta, but a great deal more finesse is required, and I’m not just talking about fonts.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
