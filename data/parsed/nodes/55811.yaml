      <p>(While I'm pondering your other points:)</p>
      <p><cite>only a couple iphone apps offer any hyphenation,<br>
      and you wouldn’t be all that impressed with their performance.</cite></p>
      <p>... is the reason I'm suggesting inserting hyphens into the data files. There is no reason at all the reader device should be <strong>able</strong> to hyphenate -- it should display text. Performance can be as low as economically possible.</p>
      <p>And yes, I admit, it means data files should be prepared before reading. It means that you cannot download any Project Gutenberg text and automatically expect the best possible reading experience -- but I doubt people are realistically expecting this right now.</p>
      <p>Or, for that matter, that it's even <em>possible</em> using fully automatic software; an example that springs to mind is automated translation of straight to curly quotes. See the mishaps of SmartyPants ('cause 'no we can't').</p>
