      <p>Well, I'm working on it :-)</p>
      <p>Nick:<br>
      <cite>...some kind of grammatical+dictionary intelligence to determine the difference between a single left quote and an apostrophe...</cite></p>
      <p>Sure. I tried to come up with a sentence containing both <em>'cause</em> and <em>cause</em> to illustrate that. (No luck, on such a short run -- sorry, I'm not a native. Couldn't find a good use for <em>'twixt</em> either.)</p>
      <p>As for bowerbird (apologies for changing the order around), returning to hyphenation code just this once more:</p>
      <p><cite>..you need working code if you want to make a convincing point...</cite></p>
      <p>preceded by</p>
      <p><cite>.. preinsertion might not save _any_ time, whole-picture-wise, because you will need to delete all the unnecessary hyphens.</cite></p>
      <p>My code--existing on my hard disk and all--<em>does</em> finds breaking points. A test routine actually inserts them--so I can verify if they're correct. <em>However:</em> inserting them physically into the text, checking lengths, then removing extraneous ones before blitting to screen, is totally redundant. The breaking code returns breaking points, offset from the start of the word. The pragraph breaking routine expects lengths and widths of words and/or fragments; not the actual <em>words</em>. Only when drawn to the screen, the characters are called up from memory. This separates 'formatting' (= line breaking) nicely from 'drawing'.</p>
      <p>The good news is I'm taking the same approach as you are on the un-/badly formatted Gutenberg texts: preprocessing them makes it all a bit tidier.<br>
      But it seems our targets diverge from there. Oh well.</p>
      <p>If you're interested in 'the very best line breaking' for any width, you should (indeed, perhaps you already have) take a look at Knuth/Plass line breaking. A good introduction for me was <a class="freelinking external" href="http://defoe.sourceforge.net/folio/knuth-plass.html" rel="nofollow">this primer text</a>. The example shown uses hyphenation, but the general algorithm works just as well without, which is a pretty important point for you. You can't get any better than that.</p>
