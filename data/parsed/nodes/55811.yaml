    html: |-
      <p>joe said:<br>
      &gt;   Your HTML semantics are extremely poor; </p>
      <p>i agree.  wholeheartedly.  my focus was on the .pdf.</p>
      <p>my .html converter wasn't prepared for many of the features<br>
      in this book, like numbered lists and outdented paragraphs.</p>
      <p>(neither of them shows up much in the public-domain fiction<br>
      that constituted the bulk of the project gutenberg e-texts that<br>
      served as the starter-corpus for this project, believe it or not.)</p>
      <p>&gt;   BR P is not how we mark up a paragraph, even in HTML 4.</p>
      <p>there's a toggle in my tool that lets users retain the linebreaks<br>
      when they create the .pdf, or do the typical wrap-to-viewport.</p>
      <p>how do you suggest that i retain linebreaks, if not with "br"?</p>
      <p>&gt;   It’s good your PDF has bookmarks, but any claimed<br>
      &gt;   use of a PDF for E-books requires tagged PDF, and you<br>
      &gt;   have to use semantics there that are even better than HTML’s.</p>
      <p>there's a very deep discussion that we could have on this matter.</p>
      <p>but for now, let me just skip over that with a quick "you're right,<br>
      and i would've loved to make this a tagged .pdf, but the package<br>
      that i'm using -- pdflib lite, v5 -- is old, and doesn't support it."</p>
      <p>it also limits me to the 14 embedded fonts, hence the helvetica...<br>
      and finally, i can't web-optimize the .pdf, which i'd like to do too.</p>
      <p>if my eventual users wanna chip in for the new commercial version<br>
      of the pdflib package, or another package, i'll be happy to have it...<br>
      in the meantime, i content myself with what i can use at no charge.<br>
      (and i thank the pdflib people for their generosity in offering that.)</p>
      <p>&gt;   You haven’t actually even declared a human language in either case.</p>
      <p>as you certainly know, joe, i'm just using a template for the .html.</p>
      <p>and i'll be the first person to tell you that i don't know much about<br>
      .html, and don't care to learn any more than i absolutely have to,<br>
      so improvements on that template will have to be made by others...</p>
      <p>so if you'd like to create the kind of template you think i should use,<br>
      joe, i will be quite happy to take it and use it and give you full credit.</p>
      <p>if not, i'll wait for one of my eventual users to volunteer for that job.</p>
      <p>&gt;   Your approach is OK for an early beta, but a great deal<br>
      &gt;   more finesse is required, and I’m not just talking about fonts.</p>
      <p>i wasn't really showing my "finesse" yet, to the extent that i have any.</p>
      <p>i'm just seeing if i can get sufficiently tight lines without hyphenation.</p>
      <p>do you have any feedback for me on that?            :+)</p>
      <p>-bowerbird</p>
