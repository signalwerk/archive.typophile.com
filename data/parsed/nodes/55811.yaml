      <p>here's one that i seem to have forgotten to post.</p>
      <p>and since it's _relevant_ to the actual _topic_ here...</p>
      <p>it's a reply to the comment from theunis where he<br>
      gave sample output from his hyphenation routine,<br>
      the comment dated 14 march, timestamp 5:57pm.<br>
      it's the comment that contains the little screenshot.</p>
      <p>***</p>
      <p>oh-oh.  better watch out.           :+)</p>
      <p>if you think i can talk a lot at a _general_ level,<br>
      don't get me started with _specific_ examples...</p>
      <p>below are 6 different takes, using _your_ text...</p>
      <p>no hyphenation, just different breaks of the lines.<br>
      and, for a few, some extremely slight re-writes...</p>
      <p>you might consider rewrites to be "unfair".  if so,<br>
      then your point boils down to the statement that,<br>
      for any piece of text, wrapping it to various widths<br>
      might lead to loose lines for some of those widths.</p>
      <p>but nobody is arguing that statement.  _nobody._<br>
      least of all _me_.  but really, nobody in the world.<br>
      because it's bloody obvious.  all you have to do is<br>
      imagine constructions consisting of numerious<br>
      consecutive multi-syllabic sequential monstrosities<br>
      masquerading as meaningful meanderings, without<br>
      introducing many shorter words therein so as to give<br>
      the break routines some flexibility with which to work.<br>
      heck, most of the time, three (and sometimes just two)<br>
      long words in a row is enough to cause you problems.<br>
      (or even one word, if it's _ubersetzenseehafenstadt_.)</p>
      <p>so if one loose line on a page, or even two or three,<br>
      is enough to upset your frail sensibilities, then yes,<br>
      you will undoubtedly have to resort to hyphenation,<br>
      if you want justification, or use ragged-right instead.</p>
      <p>but the people who _want_ justification will generally<br>
      be willing to put up with _some_ loose lines to get it,<br>
      if that's what it takes.  and they'll likely prefer _that_<br>
      over the other option -- long waits for hyphenation...</p>
      <p>in addition, if you also give them a convenient toggle<br>
      for the justification, thereby allowing a quick and easy<br>
      switch-over to ragged-right when the loose lines on<br>
      a specific page get to be too much for them to handle,<br>
      with a quick-and-easy switch-back on the next page,<br>
      i think you've got the solution they will come to prefer.<br>
      (even if it was not "optimal" in some theoretical sense.)</p>
      <p>it's a balancing act...</p>
      <p>***</p>
      <p>also, getting back to your example, under my rules,<br>
      there's only _one_ set of breaks that _must_ be tight<br>
      -- the author's linebreaks on the "canonical" version.</p>
      <p>in other words, in my workflow, the _author_ does the<br>
      line-breaks, so thus is right there to rewrite if needed.</p>
      <p>(the publisher has been disintermediated, thank god.)</p>
      <p>so if the linebreaks on the "canonical" version are tight,<br>
      that's all readers expect.  they know full well that if they<br>
      rewrap to some other width, there might be loose lines.<br>
      that's life.</p>
      <p>-bowerbird</p>
