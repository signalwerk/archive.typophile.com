      <p>theunis said:<br>
      &gt;   My proposal was actually to do that beforehand.<br>
      &gt;   There is no reason to dismiss this idea whatsoever. </p>
      <p>hey, look, i love the person who does what everyone else<br>
      says cannot be done.  which is why i never say that myself.</p>
      <p>if you can do it, great!  do it.  lead the way.  clear the path.</p>
      <p>all i'm saying is that no one has done it up to this point...</p>
      <p>i don't think it's because they're all deaf, dumb, and blind.<br>
      i think it's because resources on handhelds are insufficient.</p>
      <p>presently, there are three handheld platforms of substance:<br>
      the kindle, sony reader, and iphone.  and only the iphone is<br>
      open for programmers.  if you want to consider the g1 too,<br>
      or the blackberry, or palm's new operating system, go ahead.</p>
      <p>there will also be a flock of e-ink hardware "coming soon",<br>
      plus some (like the iliad) which have already been around,<br>
      though they haven't established much of a foothold as yet.</p>
      <p>so there'll be lots of platforms "soon", albeit not right now.</p>
      <p>but most will be resource-challenged, when compared to<br>
      the desktop, so an ability to accomplish your objectives on<br>
      the desktop won't necessary equate to handheld success...</p>
      <p>but still, better to start _somewhere_ as soon as possible.</p>
      <p>&gt;   That’s what I meant with ’tagging’ and ’preformatting’ —<br>
      &gt;   the more work is done in the file that goes _into_ your<br>
      &gt;   hypothetical reader, the lesser it has to do on its own.</p>
      <p>you don't do yourself favors with the term "hypothetical".<br>
      e-book apps are real, right now, and used out in the wild...</p>
      <p>as for preformatting, again, if you can make it work, do it.</p>
      <p>my sense is that it won't help you that much, but perhaps<br>
      you can invent the preformatting that _will_ give a boost.<br>
      again, i won't ever tell you it can't be done.</p>
      <p>but you will have to _do_it_, not just say it could be done.</p>
      <p>another thing about "preformatting" is that you will have to<br>
      get buy-in agreement from the-world-at-large to do that task.<br>
      so it complicates things.  still, you can worry about that later.</p>
      <p>&gt;   Live hyphenation, for example, requires all texts<br>
      &gt;   tagged with the correct language. It’s no different than<br>
      &gt;   tagging text to be italic, or bold, or as quotes. </p>
      <p>that's part of the "buy-in" that you'll have to get from creators.</p>
      <p>you can _assume_ that they'll be willing to do it, but if they<br>
      balk, then your scheme won't succeed, even if it does "work".</p>
      <p>welcome to the world of e-book application programming...</p>
      <p>&gt;   Surely you don’t expect your (hypothetical?) program to<br>
      &gt;   handle that without supervision? </p>
      <p>but i'm not the one with a hyphenation program.  _you_ are!</p>
      <p>and you're free to define the terms of how your program works,<br>
      and what it can and cannot handle, with or without supervision.</p>
      <p>but if you require jobs of them, people might dismiss your system.</p>
      <p>&gt;   So, take as much of the burden of “live” formatting _away_<br>
      &gt;   from your reading device and move it into the data file. </p>
      <p>if you can make it work, fine, make it work.</p>
      <p>&gt;   As per your example, if page numbers need to be known in<br>
      &gt;   advance (if your document contains references to absolute<br>
      &gt;   pages, e.g., a table of contents, an index, or internal references),<br>
      &gt;   you have no choice but to “fix” page boundaries. </p>
      <p>well, just to be clear, that example didn't actually require that<br>
      "page numbers need to be known in advance".  that is, when i<br>
      used "page 123", what i meant was "somewhere in the middle".<br>
      could have been "where chapter 6 starts", or "where this quote<br>
      is located", or "where this footnote was referenced" or whatever.</p>
      <p>some e-book programs try to "finesse" the reality that they can't<br>
      attach a "page number" to a specific bit of text, so instead they<br>
      report that you are "62% of the way through the book", or some<br>
      such nonsense, or even just give the user some vague scroll-bar.</p>
      <p>myself, i like my programs to be a lot more specific than that...<br>
      i like to say "you're on page 123 of 292 pages".  bam!  exactly!</p>
      <p>but also note that -- when the person bumps up the fontsize,<br>
      or switches from landscape to portrait, or changes fonts --<br>
      then those 292 pages might morph into 336 pages, and then<br>
      the person would instead be "on page 135 out of 336 pages"...<br>
      you must repaginate the whole book.  in real-time.  on the fly.</p>
      <p>&gt;   If you don’t you will _have_to_ devise a way to _generate_<br>
      &gt;  the page references when needed. It’s really one or the other.</p>
      <p>right.  exactly.  you have to _generate_ and _update_ all of the<br>
      page references.  and you have to do it on-the-fly, in real-time...</p>
      <p>&gt;   You’ll have to define your reading target, though,<br>
      &gt;   as formatting of a novel is quite different than that of, say,<br>
      &gt;   a programmer’s guide to Perl (to name a random scientific text).</p>
      <p>welcome to the world of e-book application programming.</p>
      <p>nobody said it was going to be easy.</p>
      <p>&gt;   I’m merely trying to fathom what you are hoping to accomplish.</p>
      <p>i'm seeking feedback on my tests of some strategies to eliminate<br>
      loose lines obtained during justification _without_ hyphenation.</p>
      <p>some people -- like you -- want to keep dragging hyphenation in...</p>
      <p>&gt;   If your target is _current_ software and hardware,<br>
      &gt;   you have no other choice than to opt for text only.<br>
      &gt;   No justification, no hyphenation.<br>
      &gt;   And do all pocket readers even support italic text?</p>
      <p>i wish i would have realized from the very beginning that you<br>
      have absolutely no experience with what you're talking about.</p>
      <p>the kindle and the sony reader and _many_ iphone apps offer<br>
      justification.  only a couple iphone apps offer any hyphenation,<br>
      and you wouldn't be all that impressed with their performance.</p>
      <p>if you want to read more on these issues, take a look here:<br>
      &gt;   <a href="http://www.futureofthebook.org/blog/archives/2009/02/why_is_text_on_screens_so_ugly.html" title="http://www.futureofthebook.org/blog/archives/2009/02/why_is_text_on_screens_so_ugly.html">http://www.futureofthebook.org/blog/archives/2009/02/why_is_text_on_scre...</a></p>
      <p>i'm not sure i've ever seen any e-book program that did _not_<br>
      offer styled text.  even if there was one, readers wouldn't use it.</p>
      <p>-bowerbird</p>
