    html: |-
      <p><em>...the mishaps of SmartyPants (’cause ’no we can’t’).</em></p>
      <p>SmartyPants is configured at Typophile to work with North American quote marks/apostrophes, not the UK system:<br>
      ('cause "no we can't"). </p>
      <p>Straight-to-curly quote software that worked with the UK system would require some kind of grammatical+dictionary intelligence to determine the difference between a single left quote and an apostrophe.</p>
