      <p>as i said, it's simply a matter of rewriting the template,<br>
      and when my users do that task, i'll happily update it...</p>
      <p>because if i don't have any users who _want_ this done,<br>
      or any users at all, there's no need for me to do it myself.</p>
      <p>i suspect, however, that when you say i "have to" do this,<br>
      what you're really saying is that if i want my output to be<br>
      accessible, that's what i'd "have to" do.</p>
      <p>my answer is that i _do_ want my output to be accessible,<br>
      but that accessibility will be a product of my z.m.l. format<br>
      with its viewer-program, _not_ the .html or .pdf formats...</p>
      <p>as far as i'm concerned, .html and .pdf are legacy formats;<br>
      they'll be replaced by some light-markup format like mine.<br>
      but this, of course, is another conversation for another day.</p>
      <p>&gt;   I do too much volunteer work as it is.</p>
      <p>thanks for your feedback...</p>
