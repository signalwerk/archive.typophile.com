      <p>theunis said:<br>
      &gt;   Well, I’m working on it :-)</p>
      <p>and, as i said from the outset, i look forward to seeing it.       :+)</p>
      <p>***</p>
      <p>&gt;   I tried to come up with a sentence containing<br>
      &gt;   both _’cause_ and _cause_ to illustrate that.</p>
      <p>the occasional exception won't really invalidate results that<br>
      are completely correct in the vast majority of cases, though.</p>
      <p>if you want to discuss curly-quote conversion, start a thread,<br>
      and i'll be happy to share the results of my experimentation.</p>
      <p>***</p>
      <p>&gt;   My code—existing on my hard disk and all— _does_<br>
      &gt;   finds breaking points. A test routine actually inserts them<br>
      &gt;   — so I can verify if they’re correct. </p>
      <p>just a quick note here to say that i don't need to _see_ your code.<br>
      in fact, if it's novel at all, i would suggest you keep it under wraps.</p>
      <p>i just need to see it in action.  compile a program that i can run.<br>
      i'm on mac, but i'll find a windows box if that's all you can make.</p>
      <p>&gt;   _However:_ inserting them physically into the text,<br>
      &gt;   checking lengths, then removing extraneous ones<br>
      &gt;   before blitting to screen, is totally redundant.</p>
      <p>well, i would've sworn you mentioned preinsertion up above.<br>
      but if you now contend "preformatting" involves something<br>
      different than that, i will accept that.  you can set whatever<br>
      conditions you want.  whether people _buy_ them or not is a<br>
      different story, but for our purposes here, whatever you say.</p>
      <p>&gt;   The breaking code returns breaking points, offset from<br>
      &gt;   the start of the word. The pragraph breaking routine<br>
      &gt;   expects lengths and widths of words and/or fragments;<br>
      &gt;   not the actual _words._</p>
      <p>ok, that's another way that people have attacked this issue, yes.</p>
      <p>the problem with that, as you might or might not know, is that<br>
      in order to know "the lengths and widths" of those fragments,<br>
      you need their font and fontsize.  but one important aspect of<br>
      electronic-books is that the end-user sets the font and the size.<br>
      the user also sets the size of the viewport, another consideration.<br>
      in the more sophisticated programs, the user might also control<br>
      other aspects that affect layout, such as the position and size of<br>
      pictures and other graphic elements (e.g., space around callouts).</p>
      <p>some e-book programs try to "finesse" this problem by giving<br>
      the user a small number of font-sizes -- the kindle gives you 4,<br>
      or maybe it's 6, if memory serves correctly, and they only offer<br>
      1 or 2 fonts -- so they can compute the widths for all the sizes.</p>
      <p>but that kind of constraint will _not_ be tenable in the long run.<br>
      e-book end-users _expect_ that they can use any font they want,<br>
      and they _expect_ that they can make that font any size they like.</p>
      <p>(and yeah, you can scale the numbers, but then you've moved to<br>
      double-math instead of integer-math, and that means it's slower.)</p>
      <p>&gt;   If you’re interested in ’the very best line breaking’ for any width</p>
      <p>um, no, that's the very thing we've been discussing all along...</p>
      <p>the situation has scarce resources and a real-time requirement,<br>
      so i'm looking for the best _possible_ line-break routines that<br>
      _meet_ those requirements.  it's all about living with constraints.</p>
      <p>&gt;   If you’re interested in ’the very best line breaking’ for any width,<br>
      &gt;   you should (indeed, perhaps you already have) take a look at<br>
      &gt;   Knuth/Plass line breaking. </p>
      <p>i've looked at it.  i've studied it.  it cannot meet the requirements,<br>
      as far as i can see...  so i use simpler routines that give me breaks<br>
      that are _almost_ as good, in _most_ situations_, and i move on...</p>
      <p>&gt;   The example shown uses hyphenation, but the general algorithm<br>
      &gt;   works just as well without, which is a pretty important point for you.<br>
      &gt;   You can’t get any better than that.</p>
      <p>no, but you can get _almost_ as good, and do the job a _lot_ faster,<br>
      which happens to be the superior solution in this particular situation.</p>
      <p>for instance, was there anything wrong with the breaks i gave above,<br>
      on your actual text?  the rag looked pretty good, at least to my eyes.</p>
      <p>-bowerbird</p>
