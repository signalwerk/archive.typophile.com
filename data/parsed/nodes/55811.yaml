      <p><cite> &gt; so i’m looking for feedback from you experts here as to<br>
      whether you think that it looks “good enough” or not...</cite></p>
      <p>No.</p>
      <p><cite> &gt; right now, i’m asking if the justified lines in the .pdf show<br>
      sufficient tightness, or if there is an excess of loose ones.</cite></p>
      <p>Excess of loose ones.</p>
      <p><cite> &gt; so the question is, “must we abandon justification too?”</cite></p>
      <p>Yes, probably. Since hyphenation seems to have been ruled out.</p>
      <p>It seems to me that within the constraints outlined, you will have to choose between the short-term: lure folks to the e-book by making it seem more familiar -- i.e., justification -- at the risk of making it untenable for long-haul reading; and the long-term: eschew superficial familiarity in hopes of demonstrating that an e-book can be just as comfortable to read -- which in this case would seem to require FL/RR setting, so as not to cause such disruptive word spacing.</p>
      <p>That's my professional opinion.</p>
      <p>-- K.</p>
