    html: <p>Dear Eduardo, the reason I asked this question, was just to know. Starting a new font by modifying a different one isnt bad. When one should do this, he or she must be very aware of all the influences this might have on the final design. <br> <br>You have several characteristics in your typeface, like the lc 'a' or 'f', which are very tipical. I just was curious. <br> <br>Please keep up the good work! <br> <br>--Jacques</p>
