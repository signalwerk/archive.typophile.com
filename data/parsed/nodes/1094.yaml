And it's too tight at the feet. <br>- I like your Dollar, but maybe make the bars thinner. <br>- The numerals are great. <br>- Give the curly braces more character. <br>- I'm not sure about that Ampersand. <br>- I'd give the At Sign a monocular \"a\". <br>- I like your f-ligs. <br> <br>Keep it up! <br> <br>hhp <br></p>"
