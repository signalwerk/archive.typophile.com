    html: '<p>Great work. <br> <br>Some quick comments: <br>-"X" is slightly wide; <br>-"Y" looks unbalanced. The right arm is kinda "shy"; <br>-"T" looks narrow; <br>-IMHO, the descenders on "jy" looks strange; <br>-the figures "3456789" could be slightly heavier.; <br>-try making the bowls in "69" bigger; <br>-"3" looks strange to me; <br>-the round part of the pilcrow could be bigger, wider. <br> <br>Overall, very nice. <br>I like the asymmetric serifs.</p>'
