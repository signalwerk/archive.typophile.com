  - id: 8476
    user: 1250
    date: 2003-08-30T21:35:00
    date_raw: 30 Aug 2003 — 9:35pm
    votes: null
    html: "<p>I like it! It combines some classic elements (most of which I like), but is still a bit funky. I'm tempted to say that the serifs (well, some of them, like at the feet) are indeed too big compared to the stroke weights, but maybe that's what gives this design its vitality. As long as there's no serious detriment to readability, it's worth it. <br> <br>Considering that the x-height is slightly large for a \"formal\" book face, I'd say the optimal size to use this at is maybe 11 point. However, this means: <br>1) The color is a bit light. <br>2) The spacing is a bit loose. <br> <br>Some other general stuff: <br>- The cap size is very nice. <br>- I'd make the descenders a bit shorter. Or the ascenders a bit longer, and: shoot for like 12 point setting as optimal - this would mean the color is closer to optimal as it is - but the spacing would have to be even tighter. <br>- The trapping seems to be of a good strength - but it does need to be applied everywhere. On the other hand, don't bother with that until you've finished everything else. <br> <br>Some specific stuff: <br>- I like the \"a\". A nice bit of de Groot in there. <br>- The beak of \"f\" could be stronger. <br>- The ear of the \"g\" could be stronger. <br>- The feet of the \"h\", \"m\" and \"n\" are too tight. <br>- I like the \"j\" and \"k\". <br>- Great \"q\". <br>- The beak of \"r\" should be much stronger. <br>- Make the \"s\" wider, in keeping with the overall character of the design (like in the \"a\"). <br>- The \"x\" bothered me at first but now I love it. <br>- I like the \"y\". <br>- The tilde needs more tapering at its ends. <br>- Bring in the bottom curve of the \"C\". <br>- Lower the bar of the \"F\". <br>- The \"J\" is superb. <br>- The \"M\" is great. <br>- The \"P\" needs a bigger head. <br>- The \"Q\" needs help. <br>- The Pilcrow is great. <br>- The AE: I'd unify the bar, and make the \"E\" a bit stronger. <br>- I don't think that top-left corner on the eszet will work. And it's too tight at the feet. <br>- I like your Dollar, but maybe make the bars thinner. <br>- The numerals are great. <br>- Give the curly braces more character. <br>- I'm not sure about that Ampersand. <br>- I'd give the At Sign a monocular \"a\". <br>- I like your f-ligs. <br> <br>Keep it up! <br> <br>hhp <br></p>"
