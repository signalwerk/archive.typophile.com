    html: "<p>Cool. <br> <br>Some more ideas: <br>- I think you can raise the ascender of the \"f\" a little higher than the other ascenders, since it comes to a point. <br>- The tail of the \"j\" is too thin at its thinnest spot. And you might lower the descender more like for the \"f\" above. <br>- Maybe you should try making the tail serif of the \"q\" like the foot serif of the \"d\"? <br>- I think the beak of the \"r\" can get even stronger. <br>- The \"s\" is very nice. <br>- The \"z\" is looking too wide. <br>- Unifying the bar in the \"AE\" has made the bar of the \"A\" too high... Not sure what the best tweak would be. <br>- I think the Euro's bars could be thinner too. <br>- The \"4\" is looking wide. <br> <br>Assuming you've now arrived at your desired vertical proportions (which I find very nice for book work now), you can start nailing down the color and overall spacing. I think the former is a hair too light, and the latter is clearly too loose. As a guide, I would point to the \"pos\" in \"posici</p>"
