    <p>Hi Everyone,</p>
    <p>I’ve recently been asked by the local student arm of the Green party to make them a poster. Although it’s too late to make any changes for the actual event (already gone to print), I’m interested to get some feedback because it was something of a new adventure into an almost Constructivist style.</p>
    <p>I would love some criticism.</p>
    <p>Thanks!</p>
    <p>-Rafe</p>
