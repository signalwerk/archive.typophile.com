      <p>Thanks Alaskan and Ryan, that's really helpful! I knew my letterspacing was off - thanks for detailing that. And Ryan, your impressions of the logos are excellent. I definitely feel like I have direction for improvement.</p>
      <p>I was pondering last night, I think my word choice of "logos" may have been misleading. As I mentioned, I work for an educational publishing company, so these logos are product logos, more than corporate identities (which doesn't negate any of what was said, but I think might be helpful in honing further input).  Go <a href="http://www.lampstandpress.com/egypt/index.htm" rel="nofollow">here</a> and <a href="http://www.tapestryofgrace.com/tog_fast/index.htm" rel="nofollow">here</a> to see some of them in context.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/LogoSheet_5704.gif"></div><br>
      Here are all five on one sheet, with brief(ish) explanations. Is that helpful?<p></p>
      <p>Also, regarding the input on the sterile sans serif, our corporate font identity consists of Minion Pro and Univers (hence those specific choices for Writing Aids). How important is it to use the text font in the title, would you say? That is, given that the product is set in Minion Pro and Univers (or, for some web products, Arial), is it appropriate to put the title in another text sans serif, or would that dilute the visual consistency?</p>
      <p>And how much wood would a woodchuck chuck if he had a land clearing permit and a backhoe?</p>
