      <p>Take everything I say as my personal opinion, and as how I would approach these logos. As with everything, a little bit of Morton's iodized would go well with my words.</p>
      <p>1. Tapestry of Grace - The letters could do with more letterspacing. Using small caps just breaks down the quick readability and a little more letterspacing could help. If you need the overlap of R over A see if there is a swash character available and stretch the outline. The "of," because it is the most different in forn, is upstaging the rest of the type. If you are going to change size make sure you change it enough to make it look like a choice and not a mistake. It just ends up clashing here.</p>
      <p>2. Map Aids - What is the intent of the logo, because the wordmark of map is communicating "messy" and for aids is "sterile." Try a more humanist sans for aids, and maybe remove the extra strokes around the a and p of map, The geometry is making me feel as if no one really wants to help me and I'll get a computer-packaged answer.</p>
      <p>3.Writing aids - Match the x-heights on writing and aids, otherwise it communicates a comparative preference of writing over the aids and the idea is to make the difference in height large enough to not look like a mistake and instead be a conscious choice.</p>
      <p>4. POP Quiz - Nice idea. Kerning on the Q and U is off. The tie acts as an arrow and leads my eye away from the logo. I never see the word Quiz. Have you experimented with other placements for it? Also, look for the swash alternate on the Q, and see if you like that better.</p>
      <p>5. Egypt - The idea is a little on the nose. Egypt in torn papyrus looking text... a little on the forgettable side. Again open up the letterspacing. It's okay to do it, I won't tell, and will help legibility at smaller sizes.</p>
      <p>Overall, nice explorations, but I feel you can push further. Be more experimental and make things more memorable. Make sure you pay attention to what the logo is communicating, your message needs to be tighter.</p>
