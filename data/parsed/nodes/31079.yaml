      <p>You're requesting nitpicky?  Are you insane?  I've been thinking of changing my official job title to Graphic Nitpicker. :)  </p>
      <p>Overall, I really admire the work you've done; it's not easy to make five logos work together.  Can we see them all on one page?</p>
      <p>First off, Pop Quiz is my favorite. Very clever and whimsical - well executed. Nice.</p>
      <p>Tapestry needs kerning - especially between the T and A ... and the "STR".  Also, if you're going to vary the size of the text, then perhaps the word "of" could be smaller?  Right now it looks too close (in size) to the rest of the font. </p>
      <p>I like where you're going with "Writing Aids," but I don't understand how changing fonts adds anything. Did you try it with one font?</p>
      <p>Map Aids has potential - but I wanna take my dustbuster to it. Perhaps fewer swirls, carefully placed with thicker lines, would have more impact?</p>
      <p>Egypt works well at small scale - but viewed at full size the words "go" and "to" run together.</p>
      <p>Feeling nitpicked yet?<br>
      Alaskan</p>
