    <p>Well, hi! My name is David, and I've been watching in stunned silence for quite some time now as you type masters gambol among ligatures and kerning. I'm deeply impressed by the breadth and depth of knowledge represented here, and would now like to get a piece of the action!</p>
    <p>I'm attaching a bit of logo design I made for our small in-house educational materials publishing company. I not only welcome critiques on these, I ask for them in imploring tones. I might stoop to begging, although hopefully it won't come to that.</p>
    <p>Please be as theoretical or as nitpicky as the mood suits!</p>
