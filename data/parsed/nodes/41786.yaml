    votes: null
    html: <p>I like the way it's turned, but it needs a subtle humanistic touch to make it less stark, and more curves should merge rather than collide.</p>
  - id: 257243
    user: 5264
    date: 2008-02-08T06:01:00
    date_raw: 8 Feb 2008 — 6:01am
    votes: null
    html: <p>To my point of view, I find this encouraging, I like the lower case, the rounded version is nice, however I agree with you, the g has to be reworked. I think the join between the two bowls is not well done and the lower bowl should be bigger than the one on the top.   Also, I think there could be a problem if you use on all caps the the oblique line, particularly in the capital letter B H E F and also in the lc f. May be keep it only in the A. This characteristics can make the reading difficult.</p>
  - id: 257374
    user: 896
    date: 2008-02-08T11:57:00
    date_raw: 8 Feb 2008 — 11:57am
    votes: null
    html: |-
      <p>I've embedded the thin and bold test sketches below, to save clicking through.</p>
      <p>I considered dropping the angled crossbar on the lowercase 't' and 'f' as I thought it would cause problems. I'm reluctant to lose the angled crossbars on the uppercase though, as it's one of the main features carried through from Magnitude, but I can understand why it might become a problem and I might need to rethink these too. Maybe I can keep them for an alternate display version or something.</p>
      <p>I'll try to get a vector sample uploaded asap to get some other suggestions. The sketches look a bit harsh, full of errors and inconsistencies.</p>
      <p>Thanks for the feedback so far!</p>
