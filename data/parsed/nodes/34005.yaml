    date: 2007-05-24T09:03:00
    date_raw: 24.May.2007 9.03am
    votes: null
    html: |-
      <p>I think it has more to do with the file, but most likely the embedded font. It almost looks like if the sidebearings and spaces have disappeared or something.<br>
      I don’t think it’s the printer itself, if the tracking of the printhead was off, the horizontal lines would not print either? Also the glyphs seem to be printed non-distorted, just overlapped. The fact that it only happens with inkjets, probably has something to do with postscript.</p>
      <p>Have you already tried converting the font to outlines, and print again? I know it is not a solution, but it will let you know if the error is in the font.</p>
