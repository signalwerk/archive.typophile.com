    <p>I have a weird problem with a PDF.</p>
    <p>I made a specimen with InDesign featuring a typeface I made. When I print the PDF from Acrobat all the letters are overlapped on top of each other. </p>
    <p>Scanned page:<br>
    <a href="http://www.re-type.com/notaweblog/images/print-caca.jpg" title="http://www.re-type.com/notaweblog/images/print-caca.jpg">http://www.re-type.com/notaweblog/images/print-caca.jpg</a></p>
    <p>The PDF look perfect on screen and if I print from InDesign there is no problem. The embedding permits of the fonts are set to ’everything is allowed’.</p>
    <p>Apparently the problem is with inkjet printers (only with this font). Laser  printers seem to print the specimen with no problem.</p>
    <p>Thanks for any feedback.</p>
