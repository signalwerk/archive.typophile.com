      <p>Expressa works if the poster actually post-dates 1974 (when E&amp;F designed the typeface; not sure I trust the copyright). Otherwise, woodstock is more likely ITC Bauhaus Heavy, with some customization:<br>
      <a href="http://www.myfonts.com/fonts/adobe/itc-bauhaus/" title="http://www.myfonts.com/fonts/adobe/itc-bauhaus/">http://www.myfonts.com/fonts/adobe/itc-bauhaus/</a></p>
