      <p>Thanks for the history lesson, Stephen. </p>
      <p>If I had been paying attention, I'd have noticed that ITC Bauhaus didn't come on the scene until 1975. Its precursor—Herbert Bayer's Universal—had been around since the 1920s, though.</p>
      <p>Burko looks good for both weights.</p>
