    date_raw: 28 Aug 2008 — 2:40am
    votes: null
    html: <p>There are a couple of recent Font Font efforts in this area, I forget the names now, but I looked at them some last year. One was very high contrast and I felt was a candidate for display work, but in the end I went back to the Bertholds. The negative there though, besides the general Berthold vibe, is that you get the old 8-bit character set, no modern glyph goodies. Which of course, sucks.</p>
