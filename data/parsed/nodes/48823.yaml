      <p>For pull quotes I'd use Big Caslon. The roman is available from several sources (if you have a Mac it came with the system). Big Caslon Italic is harder to come by: contact Carter &amp; Cone for that: <a href="https://web.archive.org/web/20150123173029/http://www.carterandcone.com/" title="http://www.carterandcone.com">http://www.carterandcone.com</a></p>
      <p>Another possibilities are Caslon 540 and <a href="https://web.archive.org/web/20150123173029/http://www.daltonmaag.com/browse/fonts/dama/kingscaslon/typo" rel="nofollow">King's Caslon.</a></p>
      <p>Someday the long awaited William's Caslon, from our very own William Berkson, will be available. (Nudge, nudge William.)</p>
