      <p>For pull quotes I'd use Big Caslon. The roman is available from several sources (if you have a Mac it came with the system). Big Caslon Italic is harder to come by: contact Carter &amp; Cone for that: <a href="http://www.carterandcone.com">http://www.carterandcone.com</a></p>
      <p>Another possibilities are Caslon 540 and <a href="http://www.daltonmaag.com/browse/fonts/dama/kingscaslon/typo">King's Caslon.</a></p>
      <p>Someday the long awaited William's Caslon, from our very own William Berkson, will be available. (Nudge, nudge William.)</p>
