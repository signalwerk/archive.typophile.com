    date_raw: 27 Aug 2008 — 4:07pm
    votes: null
    html: <p>I think Lange's versions of many of the classic typefaces like Caslon are very nice in extended text settings at sizes around 10 and 11 pt. I prefer Caslon Book to Adobe Caslon, and Baskerville Book to Storm or ITC's versions. I also think the Berthold Bodonis are quite nice.</p>
