    html: |-
      <p>Berthold text fonts are typically optimized for 9 pt rather than everyone else's 12 pt. Adobe Caslon is designed for 8-14 and is best at 10-12. I think it's my favourite of all the Adobe text faces, a great triumph for Twombly and of course the art director for the Originals in those days, Sumner Stone. I love Berthold fonts as a rule, but I remember being disappointed by the Caslon. The comments here make me want to have a new look -- it's been years. But just look at how well Adobe Caslon works in the New Yorker. Perfectly credible, graceful, transparent. Happy, even. Very few fonts give me that feeling, other than Sumner Stone's Cycles family. </p>
      <p>As Ryan says, the Berthold Bodonis are very much worth looking for. One's basically for display, very high contrast, and another - - I forget the name - - Antiqua? Classic? something? - - is absolutely sensational in text - - setting even more fluently than Sumner Stone's ITC Bodoni 12. But I hate the g - - and for that reason would always use ITC Bodoni, which has the additional advantage of small text and display sizes. But if the g doesn't bother you . . . .</p>
    html_clean: |-
