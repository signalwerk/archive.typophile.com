    html: <p>CaslonBooKBE is a Berthold font:Caslon Book. It's quite different from the Adobe cut. The Berthold face is a bit darker and has shorter descenders. I like the Adobe cut better, but if I was setting small type, say 8 point, I might use the BE font.</p>
