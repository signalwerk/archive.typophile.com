    html: <p>Fontographer has many nice features (I have found the Kerning Assistance feature to be very useful and easy to use) and it has a simplicity and straightforwardness that FontLab just has never had. The downside of that is that there are so many things you can't do with Fontographer. The main thing is that it is quickly becoming obsolete. The program has not been updated since 1996. It does not run well or at all in any Mac or PC operating system that was released in the last few years. The bugs will probably never be fixed. <br> <br>As far as Fontographer's pen tool goes, it's very similar to the one in Freehand (or at least in early versions of Freehand). The two programs were originally written by the same programmers, hence the similarity.  <br> <br>FontLab's pen tool is even more different from Illustrator's than the one in Fontographer. I don't know of any graphics program that does it the same way. <br> <br>Font Studio, the sadly long-gone font tool that Letraset marketed in the early nineties, had a pen tool that worked exactly like Illustrator's. <br> <br>In either FOG or FL, you always have the option of working in Illustrator and importing the glyphs, so, if you don't like the native pen tool, you don't have to use it. (Opinions differ on whether this is a sensible way to work, though.)</p>
