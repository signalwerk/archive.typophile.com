  html: "<p>From what I've read, I can tell that the majority of you favor FontLab, but I still have to ask: <br> <br>What is the difference between FontLab and TypeTool? <br>What is the difference between FontLab and Fontographer? <br>What is the difference between TypeTool and Fontographer?</p>"
  html_clean: "<p>From what I've read, I can tell that the majority of you favor FontLab, but I still have to ask: <br> <br>What is the difference between FontLab and TypeTool? <br>What is the difference between FontLab and Fontographer? <br>What is the difference between TypeTool and Fontographer?</p>"
