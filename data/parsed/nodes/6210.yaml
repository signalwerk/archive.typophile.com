    html: "<p>It seems that there isn't any other good Type Creation Tool than FontLab. I'd tryed the Beta of FontMaster (formaly know as Ikarus) but the workflow isent really good. Most needed tools are in different moduls. So You have to change from IK Tool to the Bezier Tool and change to a Module for convert your Font into TTF or Type1. For Kerning there is a Module and so on. The Interface is not very usefull. Im so sad that such a good Foundrie DTL make a not very usefull tool like this. <br> <br>But what about Tools like VTT? Does anyone use it? I tryed, but hinting is such a complicated work... <br> <br>Greetings Jens <br>PS: Does I need to say anythink about these shareware tools like Font Creator and Softy? Mmmh... NO!</p>"
