    html: <p>I've used both TypeTool and FontLab - I started with the former and now I use the latter.  <br> <br>TypeTool does not export typefaces in the <i>other</i> platform's format (ie, Mac version doesn't deal with the Windows version). Neither does it deal with OpenType fonts or Multiple Master fonts. It doesn't have the new drawing tools of FontLab, and neither does it handle unicode, or have a customisable user interface, or have font auditing technology or a scripting language. It doesn't have paint tools or Bezier controls or support for right-to-left fonts such as Hebrew. It also doesn't work natively in MacOS X, but at least it will run acceptably fast under Classic (unlike FOG, from what I've read recently). <br> <br>There is so much in FontLab that isn't in TypeTool infact, that it can be daunting to use FontLab, especially given the myriad of buttons and palletes. <br> <br>And thats just for starters. Like so much of software choices, it comes down to what you want to use it for. Personally, I thought TypeTool was ideal for little fun projects (remember fun?) and editing the occassional glyph, but if you want to progress and produce more serious work, then the latter is worth the investment. <br> <br>Fontographer? Pah, I'll leave that to the others <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
