      <p>Congratulations Michel on finding this unique blackletter. I guess it takes the mathematics people to bring legibility to blackletter. Some awkward features, but they could easily be adjusted.<br>
      Note that the letters and numbers are not in the standard locations for a Windows font . For regular use it would best to rename them to the standard locations and regenerate the font.<br>
      Don</p>
