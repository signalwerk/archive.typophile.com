    html: |-
      <p>If that font is to be used as the mathematical bold fraktur font (unicode range 1D56C-1D59F), then it does not meet my requirements; that range is not meant for text, it is meant to give individually recognizable mathematical symbols. For me the symmetric group on n elements, and the alternating group on n elements are represented by<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/groupe_4669.png"></div><br>
      in the standard and bold math frak fonts, and making the S and the A looking closer to those in regular alphabets is pointless.<p></p>
    html_clean: |-
