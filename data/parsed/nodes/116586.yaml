  - id: 578491
    user: 205259
    date: 2014-05-16T17:25:00
    date_raw: 16 May 2014 — 5:25pm
    votes: null
    html: |-
      <p>As far as I can see the ID request is in the context of running text.  My comments were directed towards that use. Bearing in mind that most persons are not be able to match the unique shapes of the fraktur uppercase with the letters of the Latin alphabet.<br>
      But I take your point on the unsuitability of this font for use as the mathematical bold fraktur font. Anyone using the fraktur symbols in a mathematical context would not appreciate their transformation into Latinesque forms, which would introduce ambiguity as to meaning.<br>
      Don</p>
