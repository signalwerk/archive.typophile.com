    html: <p>As an evil businessman I would like to add that the market will sort it all out. It would be quite difficult to sustain yourself giving away work that took untold hours of your time to develop when you need to be feeding, clothing and sheltering your person. <br> <br>So, it would stand to reason that in *most* cases, when a font is developed and given away it is because it was not as time consuming and potentially not as valuable as say a Majoor from FF. <br> <br>That is why people are willing to pay $500 for a limited family of fonts from FF and the like. We know that we are getting a value and it is not just that the face took longer to develop </p>
