  html: <p>Hello all you amazing type designers. I've recently tried my hand at developing a face of my own (you can find it in the serif section of the critique board) and am wondering what to do with it. I've considered releasing it under a creative commons <a href="http://creativecommons.org/licenses/by-nc-sa/2.0/">Attribution-NonCommercial-ShareAlike 2.0</a> license. I've seen some really incredible free fonts (<a href="http://apostrophiclab.pedroreina.net/">apostrophic lab fonts, for example</a>) made available for personal use, faces that are far more complete and attractive than my own experiment. My question is, basically, is this a good idea? Does making fonts available for free, no matter the quality, effect those who make their living creating and selling fonts? Does the availability of free fonts reduce the perceived value of commercial ones, or can free and commercial fonts co-exist?</p>
  html_clean: <p>Hello all you amazing type designers. I've recently tried my hand at developing a face of my own (you can find it in the serif section of the critique board) and am wondering what to do with it. I've considered releasing it under a creative commons <a href="http://creativecommons.org/licenses/by-nc-sa/2.0/" class="link-external">Attribution-NonCommercial-ShareAlike 2.0</a> license. I've seen some really incredible free fonts (<a href="http://apostrophiclab.pedroreina.net/" class="link-external">apostrophic lab fonts, for example</a>) made available for personal use, faces that are far more complete and attractive than my own experiment. My question is, basically, is this a good idea? Does making fonts available for free, no matter the quality, effect those who make their living creating and selling fonts? Does the availability of free fonts reduce the perceived value of commercial ones, or can free and commercial fonts co-exist?</p>
