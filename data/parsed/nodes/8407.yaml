    html: <p>Mike, <br> <br>I can understand that you were hamming it up a bit for comic effect, but I think the reason that you got a response was that the idea that money = motivation hits a raw nerve with people who are motivated by non-material rewards. <br> <br>You also threw in the idea that socialism removes motivation, while capitalism promotes motivation. This is really a tired old argument which has been discredited on many lavels by a whole range of people, and a large variety of arguments. <br>For example, it has been pointed out that under capitalism, those who work hardest (think of factory workers, nurses, miners, carers etc) are generally very poorly rewarded, while those who are very highly rewarded (owners of factories, mines etc), often do very little work at all. <br>In this light we might ask about the motivational strengths of capitalism. <br>You also state that 'Most humans are motivated on some level by a basic self-interest'. Well, on some level, yes, but why do so many people become nurses etc. The qualification is tough, the hours are long, the pay is poor - the self-interest is in the non-monetary rewards of the vocation. For most people involved in creative work, the non-monetary rewards provide the motivation.</p>
