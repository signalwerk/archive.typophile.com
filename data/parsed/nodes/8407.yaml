    html: "<p>Andrea wrote: <i>Once again, education is key (and I fail to see how that can be even remotely corporatist).</i> <br> <br>And Sergej wrote: <i>Corporatism is, in fact, smart business, and I'd say you are a corporatist since you work for a corporation (if I'm not mistaken) and are proud if it.</i> <br> <br>I think there is some confusion about the use of the term corporatism, not only in this thread but in most contemporary discussion where the term arises. This is because we live in a world with lots of corporations but very little corporatism, so most people look at the word and think it has something to do with corporations as they exist in modern business. Corporation are essentially a mechanism by which the owners of capital limit their personal liability for the decisions they make by making the corporation itself a legal person. Corporatism, arguably and ironically, has more in common with unionism than with corporate capitalism, but at the same time it is neither socialist nor capitalist. <br> <br>Corporatism is an application of Catholic social teaching, derived from the Papal encyclicals <i>Rerum novarum</i> (1891) and <i>Quadragesimo anno</i> (1931), which attempted to circumvent the conflict of capital and labour by promoting class collaboration based on the dignity of work and collective organisation in part based on the model of the Mediaeval guilds. Under a corporatist system, professional organisations become the primary political organ in a society. In this context, it is easy to see how education can be corporatist, along the lines of apprenticeship and professional accreditation. Most professional associations -- e.g. the Society of Graphic Designers of Canada -- are, in fact, corporatist bodies, but operating within a non-coporatist system, e.g. capitalism. I think that many professional associations would be more effective if they understood and adopted an explicit, underpinning corporatist philosophy. <br> <br>Corporatism fell out of favour after WWII because the Italian Fascists had implemented a form of it through their 'guild' system. It is worth noting though that the economic historian Amintore Fanfani, later Prime Minister of Italy, had already rejected false corporatism of the fascists in the 1930s. By contrast to fascist dictatorship, corporatism has also appealed to anarcho-syndicalists as a model of collaborative, non-authoritarian organisation and decision making. <br> <br>Corporatism remains a kind of ideal of Catholic social and political organisaion.</p>"
