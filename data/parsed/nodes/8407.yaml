    html: <p>John, thank you for such a well thought out response, you've helped me clarify my own thinking.  The availability of professional quality fonts for free is rare, most lack a full character set, range of weights, or other options that a professional would desire. For personal use this isn't as important. People who make their livings working with fonts buy fonts, Joe six pack does not. That there are a few fonts of extreme quality available to Joe for naught is great, as everyone should experience the joy of typography. <br> <br>I agree with your points regarding the re-distribution of bundled fonts, education is necessary (but I personally feel that most license are too restrictive. While I respect and generally adhere to a products license, my personal opinion is that if a product is for a professional market than the use of that product by individuals who would have no professional interest in it is not going to hurt anyone's bottom line. But whatever). Releasing one's own creations into the public domain should not hurt the perceived value of commercial work. I was not aware of Fred Nader's reputation, having stumbled across his site via Luc Devroye's link pages, regardless, some of the fonts he or his friends created are quite good, as are many of the fonts released by <a href="http://moorstation.org/typoasis/designers/steffmann/index.htm">Dieter Steffmann</a> (whom I assume has a better reputation?). <br> <br>You wrote <b>and if that includes giving away free fonts, the kind of inevitable devaluation due to stupidity or willfulness is something I need to find constructive ways to counter, through education.</b> While I agree that the public at large is poorly informed when it comes to intellectual property and its value or lack there of as well as to the ethical considerations involved in infringement, I'm not certain that is the issue I meant to address. I was thinking more of how, in the graphic design community, for example, things like competitive bidding, logo and other design contests, etc. have tended to reduce the value -- in terms of what a professional is willing to pay -- of these services. My concern is that, given the difficulty of tracking the use of a font once it is released into the wild, it could easily be used (intentionally or through carelessness) in a commercial application without the designer ever becoming aware of it. Those who should, by the very nature of the application they intend for the font, be providing remuneration, are the focus of my question.</p>
