    html: "<p>This is a question I have thought about a lot, in part because most of the typefaces I develop are either freely available for non-commercial use (e.g. the Society of Biblical Literature fonts) or are bundled with other software (e.g. fonts I've made for Microsoft) which, however incorrectly, does give many users the impression that the fonts are somehow free. My take on this kind of thing is that <i>I'm not going to work for free,</i> but this is a different matter from fonts themselves being free. As long as someone pays for the development at an appropriate rate, I have no objection to the fonts themselves being free. <br> <br>I don't think it is avoidable that 'the availability of free fonts reduces the perceived value of commercial ones' <i>for some users.</i> This is true whether the free fonts are on a freeware download site or show up on the user's computer with some software. The idea that because one thing is free that everything in the same broad class should be free is simply illogic. Some of this impact can be countered with education. I think companies that bundle fonts with software, as one instance, could do more to educate users about where the fonts come from and their value -- and things are improving a bit in this regard -- but there will always be some people who <i>prefer</i> to think of fonts as valueless and free for the taking because it makes them feel less guilty about stealing them. <br> <br>Your precise question -- 'Does making fonts available for free, no matter the quality, effect those who make their living creating and selling fonts?' -- deserves a precise answer: the impact of free fonts matters most <i>when they look like commercial fonts.</i> If someone wants to make original designs available as free fonts, who am I to say he shouldn't? If that person wants to public'ly argue that all fonts should be free, I'll have words to say on the subject, but what he does with his own work is his business -- this, to me, is the central tenet of respect for intellectual property --, and if that includes giving away free fonts, the kind of inevitable devaluation due to stupidity or willfulness is something I need to find constructive ways to counter, through education. <br> <br> <br>[By the way, Fred Nader of Apostrophic Labs is not well liked by many professional type designers. His activities in the area of free font distribution are not limited to his own fonts or those of his willing collaborators. A few years ago he was sued by a number of commercial foundries for posting their fonts to a Usenet binaries group. So you might want to pick some other example of free font philanthropy.]</p>"
