    html: "<p>Generally, this is true. The advent of digital technologies has upset old relationships, though. The ease of copying, the fidelity of copies, the speed of exchange: these are all contributing to a devaluation of original creations. When type consisted of trays of metal, there was little doubt to its value as a manufactured item. Type that exists only in the ethereal matter of software is already of diminished perceived value, because it can be copied, multiplied and exchanged so easily. So the impact of free font distribution on the perception of value must be reckoned in addition to an overall reduction in real value (manufacturing costs, wholesale and retail pricing, increased competition, etc.).</p>"
