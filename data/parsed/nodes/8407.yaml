    html: "<p>- <br> <br>Steve, <br> <br>Thank you for your insight. I was not surprised by the response - I kinda assumed my post would raise a hackle or two, but I did not mean to irritate anyone. <br> <br>To address a couple of your comments: <br> <br>You said, \"You also threw in the idea that socialism removes motivation, while capitalism promotes motivation. This is really a tired old argument which has been discredited on many lavels by a whole range of people, and a large variety of arguments.\" <br> <br>Tired old argument? Discredited? I would say that you are making too general a statement (something I am guilty of in my first post!) <br> <br>If you had stated that experts the world over do not agree on which system best motivates, I would take no exception. But to claim that my stance has been discredited is a stretch. <br> <br>Also, you are confusing self-interest with selfishness or self-centeredness. I would argue that your nurse IS doing what he does out of self-interest. He may have some need to help others - it makes him feel better about himself and the world he lives in. So, he becomes a nurse and thus addresses his own interests while at the same time on the surface addresses the needs of those around him. <br> <br>Don't forget, too, that not everyone has the mind to become an attorney or PhD. these people end up having fewer options in life (or at least perceived options) and some become your factory workers and miners. Please do not turn my comments around and think that I am saying every laborer is simple minded. <br> <br>Your comment about the higher-level people in a capitalistic society is flawed, too. Owners of businesses work very hard - harder and longer and with much more at stake than the workers that populate their payroll. To think otherwise is simplistic and parochial. <br> <br>OK - now that I have cornered myself, have barred my teeth and am hissing, please do not take my comments personally or as an attack. You are welcome to think whatever you want about economics, politics and the psychology of man - it is all too complex for anyone to claim full understanding. <br> <br>Regards, <br> <br>Mike <br> <br>*</p>"
