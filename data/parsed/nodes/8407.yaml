    html: <p>The advent of talking moviews forcasted the end of there being any perceived value in live theater. <br> <br>The advent of the VCR forcasted the end of there being perceived value in going to the movie theater. <br> <br>The advent of the desktop publisher forcasted the end of there being any perceived value in graphic designers. <br> <br>The advent of the stock photo industry forcasted the end of there being any percevied value in custom photography. <br> <br>Etc. <br> <br>In the end, it doesn't always destroy an industry to give something away for much less than before. Usually, things can coexist...the exception being when there's a monopoly power that's the one doing the dumping of product for pennies.  <br> <br>Personally, I think I could find personal satisfaction in selling my font commercially or giving it away free under the creative commons license. They're just different types of satisfaction.</p>
