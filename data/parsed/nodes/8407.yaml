    html: <p>I think that Mike has a point when he says that the market will take care of itself. Back in the late nineties I started a free font website, and that led to me setting up a commercial operation. I think that most good free font developers have done the same thing, and it actually feeds the type industry with new designers who became enthused about type following good reaction to free fonts they produced. <br> <br>On the other side of the fence, I think that font users may start off with free fonts and then as they leave university or grow as designers, they develop their love of type and license legal fonts. <br> <br>I personally would prefer people to use free fonts rather then distribute pirated fonts, as I feel that any designer worth their salt can tell the difference between a free font and meta (for example), whilst if they have a pirated version of meta, would they bother to license it... <br> <br>Just my two cents! <br> <br>Jim</p>
