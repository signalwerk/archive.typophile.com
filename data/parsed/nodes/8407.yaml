    html: <p>I don't think free fonts are a bad thing. It's a digital distribution/commerce era we're entering, so, like music, I think the models of distribution and promotion will have to incorporate new and different methods/ideas. And, really, samples won't change the minds of those who will and won't buy. <br> <br>For me, the real question comes from the distribution of large font collections as add-ons to other products (usually design apps). In this case, the 'market' won't punish them for this behavior. It will, in fact, most likely reward them. What bothers me is that most non-designers I speak with don't perceive fonts as hard or time-consuming, or as important at all. The fonts aren't so much 'free', as much as they're just... there. <br> <br>Now, I am as thrilled as the next person by Adobe's font offering with InDesign CS, but it removes the <i>choice</i>, and I think the act of having to choose one's fonts adds perceived value. It forces one to focus on what they want <i>and</i> need. I think this is more key than the presence or absence of money. Imagine if someone chose only novelty fonts with their purchase of MS Office. I think they'd learn the value of the 'boring' standbys pretty quickly (I hope). It might even force them to consider the differences, which previously seemed non-existent.</p>
