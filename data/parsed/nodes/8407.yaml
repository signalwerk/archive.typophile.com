    html: <p>42nd ... <br> <br>I did not say the *money* is the prime motivator. I said a better life, health etc ... that includes having money, but is not limited to money. Everyone knows that money does not equal joy. <br> <br>Also, my argument is not that people will make great type only for money - but more to my point is that it will be much easier for people to make great type when it brings them more than just a personal feeling of satisfaction. <br> <br>We are creatures of needs and wants. Unless you can address the simple needs you can't move onto addressing the more complex wants common to our race. So, many people work to just meet their needs - hence people that remove trash and work in meat packing plants. But, there are people - like you and I - that try to address our needs by getting paid to do something that addresses a desire for fulfillment. We work in the creative field (or in business) and it pays the bills nicely and makes us feel good about life on most days because we get to deal on levels that the meat packer does not. <br> <br>Also, I was trying to make a point, but was a being a bit over the top for giggles, so please do not get too wound up on my vain imaginations. <br> <br>Mike <br></p>
