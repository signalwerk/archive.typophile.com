    html: |-
      <blockquote><hr size="0"><!---quote-!--><b>quote:</b>
      <p>But, if there is no need for a return on investment, then what would be the motivation to create great type? Yes, there will be some who want to do it for the sheer pleasure, but I would wager that you would see a fraction of the quality faces that are available now under a free system. Most humans are motivated on some level by a basic self-interest and making money, living a better life, having better health and more options seems to be a good motivator for most.<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p> <br> <br>People create best when they create not for monetary gain, but for personal pleasure. An attitude of "I won't work unless you pay me" frequently ends up in slipshod results and a "well, you got what you paid for" mentality, not creations with an attention to detail and a feeling of personal pride. <br> <br>Payment isn't incompatible with quality work, but one does not imply the other. I've known many extremely-well-paid professional programmers who were unbelievably bad at what they did; I've known at least as many programmers who have consistently done excellent work and have never been paid for it. The best programmers work not because of the money, but in spite of it. <br> <br>But best in this context has many different meanings. Convincing a programmer who works for free to work on the project you want done can be difficult, especially when the project is otherwise mundane and boring. Sometimes a project can be solved quickly but in an ugly fashion, or cleanly but slowly; many people who work for free would be unwilling to do the former. In these cases someone who worked for pay would be "best". <br> <br>It would be far better for professional designers to focus on their strengths, rather than trying to tell others not to do work without pay because it means less money for the pros. The former provides positive reasons as to why people should pay them for their services, but the latter comes across as mercenary and a bit pathetic, as if they can only justify their existence by discrediting others. <br> <br>The answer to your question, "Why would someone create <i>great</i> type?" is simple: because that someone feels a great need to create great type. The motivation may be a desire for monetary gain.  Most likely it is from an internal drive to do the very best job they can. <br> <br>I can say from my own experience that the work I'm doing now (after retiring four years ago) is at least as good as when I was being paid. I do it because I enjoy it, and because I take a "I will do the very best I can" attitude to everything I do. But I've never done any work because someone was willing to pay me, but because I enjoyed what I did. That's been a hard line to follow; occasionally it's meant being broke and a little hungry for a while. In the final analysis I think it was worth it. <br> <br>I realize that some participants here won't be able to understand what I'm saying, and these attitudes may seem completely foreign, perhaps even unworthy to others. Just be aware that not everyone shares the "money and safety is everything" approach to work and life, and that some of the best work done in the world was done by people who had no desire to ever earn a dime from it.</p>
