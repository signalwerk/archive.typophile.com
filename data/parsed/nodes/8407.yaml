    html: "<p><i>'Does making fonts available for free, no matter the quality, effect those who make their living creating and selling fonts?' </i> <br> <br>Interestingly enough, this same question can be put to a number of diverse services offered throughout the design community. In effect, we have to ask ourselves if doing work for free is harmful to the design profession (and the consumer)? Overall, I would say \"yes, it is\". <br> <br>In some rare cases, I think it is useful to offer free fonts (free design) for promotion or where a guarantee can be made that future projects and payment will follow. However, I think that for the most part, <i>free equals cheap</i> and most consumers who are downloading free fonts (or getting free design) don't have the same respect for the work as they would if they had to pay for it. I know that I don't. I am always suspicious of \"free\". <br> <br>As a member of the Society of Graphic Designers of Canada, I truly believe that designers (of any kind) have a professional duty to educate people and promote the respect of design everywhere. (This might sound elitist, but someone has to take the lead on this). If you are at all curious about the Code of Ethics, you can find it herer: <a href=\"http://www.gdc.net/for_business/ethics.php?id=1&amp;press=1&amp;draw_column=3:1:2\" target=\"_blank\">http://www.gdc.net/for_business/ethics.php?id=1&amp;press=1&amp;draw_column=3:1:2</a> and download it.  <br> <br>Sure, I know that I cannot stop Joe down the block from creating free logos, or worse, selling them for $99 a pop. And if designers want to continue in that vein, as John writes, who am I to stop them? However, I cannot help but feel that giving away or undervaluing design undercuts our professionalism and devalues all our work and when I try to justify charging as much as I do, I have to ensure that the consumer/client understands that \"you get what you pay for\". <br> <br>I also have an issue with the \"no matter the quality\" bit.</p>"
