  html: |-
    <p>I recently got a program called ObjectDock for my PC, which is basically a port of the icon dock on the Mac, that can magnify your icons when you move over them and all that. But the Fontlab icon on PC is only 48 by 48 pixels or something like that, so it looks horrible when you move over it and it's magnified.. I've searched every resource I know of for a high quality version of it without any luck. Does anyone with Fontlab 5 on a Mac feel like helping out (if it's not too hard to do)? I'm looking for the icon in 128 by 128 pixel size or larger, in either .ico or transparent .png format.</p>
    <p>Thank you.</p>
  html_clean: |-
