      <p>For more recent applications (SigMaker 3, BitFonter 3, ScanFont 5, the upcoming Photofont WebReady), we actually do have our icons in the size of 1024x1024 pixels, so I think some future releases will include the new 512x512 icon size. The FontLab Studio 5 icon only exists in 128x128 but we already have a 1024x1024 icon for the next version of FontLab Studio (not that we're going to release one shortly -- that's still a while ahead). </p>
      <p>Best,<br>
      Adam</p>
