    html: |-
      <p>Great precedent thread(s).</p>
      <p>One thing I would posit here is that -since fonts are typically used hierarchically- it is the Regular that largely dictates vertical space usage/efficiency. Ergo: making a subordinate weight's descenders shorter gains you nothing (and in fact weakens boumas).</p>
      <p>hhp</p>
