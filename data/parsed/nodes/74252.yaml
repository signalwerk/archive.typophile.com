    html: |-
      <p>The measurement from the top to the bottom of the characters in a font is the "point size". There is no simple term in English for the space from ascender or cap height, whichever is greater, to the descender depth, which would exclude possible small amounts of white space in the font in order to permit alignment of the baseline.</p>
      <p>If you mean a horizontal distance equivalent to the vertical point size, that is called an "em". In fact, instead of measuring the width of a column of type in picas, the same unit of horizontal distance is called a "pica em" to make it clear that a horizontal distance is discussed.</p>
    html_clean: |-
      <p>The measurement from the top to the bottom of the characters in a font is the "point size". There is no simple term in English for the space from ascender or cap height, whichever is greater, to the descender depth, which would exclude possible small amounts of white space in the font in order to permit alignment of the baseline.</p>
      <p>If you mean a horizontal distance equivalent to the vertical point size, that is called an "em". In fact, instead of measuring the width of a column of type in picas, the same unit of horizontal distance is called a "pica em" to make it clear that a horizontal distance is discussed.</p>
