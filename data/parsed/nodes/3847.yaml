    html: <p> It is the original version of House Gothic, the weights used are Light Four and Bold Four. House Industries recently updated the package to House Gothic 23, tweaked the design and reshuﬄed the weights, so I’m not entirely sure if you still have all the alternate characters (e.g. the lower case “y”). I’ve got a license, so let me have a look at it and I’ll get back to&nbsp;ya. </p>
