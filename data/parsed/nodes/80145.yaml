    html: <p>You can't protect your fonts from that happening. All you can do is wait for it to happen and then send a notice to the site hosting the font and hope that they take it down. If you're lucky the font will be posted to a site whose administrator will take the font down, or whose hosting company will yank the entire site. But if it's a pirate site in Vladivostok there's just nothing you can do about it. In some countries you can formally copyright the font to weight the legal morass in your favor; talk to a local lawyer to find out how it works in your country.</p>
