      <p>I have the impression that type people are a fairly hip crowd, all things considered, so it always surprises me to see type people twisting their brains around about these sorts of IP issues, as if completely oblivious to the lessons that have been made apparent by related struggles in pretty much every other creative industry since the Internet started shaking things up.</p>
      <p>It's also worth remembering that strict IP provisions, as they exist in our society, are often not very helpful to creators. History is full of casualties like Johannes Gutenberg, Max Miedinger, and poor, poor TLC, whose work made much more money for other people than for themselves.</p>
