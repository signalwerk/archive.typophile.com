      <p><em>Why is a 200 year interval more acceptable than 2 years? </em></p>
      <p>1. Digital recontextualizations of metal types necessarily involve a lot of interpretation, given the disparity of the media.<br>
      2. The idea of copyright protection for a fixed period of time relating to the holder's life is a long established principle, since the 18th century (displacing perpetual copyright). </p>
      <p><em>…it always surprises me to see type people twisting their brains around about these sorts of IP issues, as if completely oblivious to the lessons that have been made apparent by related struggles in pretty much every other creative industry since the Internet started shaking things up.</em></p>
      <p>The type person in question is a neophyte who would no doubt ask the same questions if he were venturing into ecommerce in music, photography, literature, whatever. </p>
      <p>The issues are different in different industries, and the font business is unique and continually evolving—hence the brain twisting. Other creative industries could perhaps learn some lessons from the font business. We've been doing digital for a while, since fonts on floppies, long before the Internet.</p>
