      <p>You can register a design patent for a typeface design in the USA, through the US Patent Office. This costs money (I don't know how much), and is for a period of 15 years only, but it is the only legal means to protect the <em>design</em> in the USA.</p>
      <p>A patent filing requires a disclosure of prior work, i.e. other designs that you might have referred to for inspiration; such disclosure doesn't prejudice the application, i.e. a design can still be patented even if it is based in part on prior art; failure to disclose prior art may cause problems later though, if you ever need to defend the patent in court. You should also keep the design private before it is patented, showing it only to other people under NDA. If someone does steal your design and you take them to court, their lawyers will almost certainly try to challenge your patent, so you really want to make the application as solid as possible.</p>
      <p>I strongly recommend discussing this with a <strong>lawyer</strong>.</p>
