      <p>First of all, thanks guys for your responses.</p>
      <p>Dunwhich - Nice fonts! I'm in the U.S. - a bad place to be if you design fonts. Other countries allow you to copyright fonts.</p>
      <p>Frank - I really love your font Rupture. Why do you not sell it? It's very original and I think it would make you money. So could your other fonts in my opinion. Of course I'm new to the font creation business.</p>
      <p>BlueStreak - That's interesting. The first thing I said aloud when reading this was that there's no way I would buy a font from them if I have to deal with those restrictions. I agree with you. I have heard a few times before that you shouldn't do anything to the actual font file to make it inaccessible to anyone - even if it helps to protect it. I wasn't going to try anything like that. </p>
      <p>I wanted to rephrase my question/s I posted earlier.</p>
      <p>What I am wondering is if I can find an affordable way to prove it's my design if I have to? For example, I may print it and mail it to myself, in case I needed to prove it in court, but I can't afford to take anyone to court, so… I'm trying to find something like this that would totally prove unequivocally forever that I was the one who originally created the font.</p>
      <p>I want to protect my fonts from being renamed and stolen from me. I'm in the U.S. - a bad place to be if you design fonts. Other countries allow you to copyright fonts. I have read an article saying that it is not possible to copyright a typeface through the U.S. Copyright Office, even if I wanted to pay for it. The article goes on to say that Adobe and Emigre have sued and won against a company that copied their fonts. "…you cannot copyright the design of the font, but you CAN copyright the PostScript program or TrueType data that draws it … So you can make your own fonts that look the same as another font without infringing copyright, but you can't copy another program or dataset that draws the font…" I guess that means in that America that it's totally legal to copy another font designer's design and there isn't anything they can do about it. How could this be?</p>
      <p>I hope that I can go through a good foundry to sell my fonts for me and also protect my fonts.</p>
      <p>I heard that companies like MyFonts can tell when a font designer has copied another font's data or point data or whatever, but how do you prove that you were the one who created this data in the first place? The font stealer could claim that you are the one who stole it from them, right? </p>
      <p>Thanks in advance</p>
      <p>Tags: font, fonts, design, protection, steal</p>
