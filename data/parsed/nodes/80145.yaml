      <p>What I'm trying to do is build enough evidence that the font is mine to have it removed from these sites that post it up without my permission. Obviously I can't afford to sue anyone in court. My feeling is that along with a decent press release (and a print ad if affordable) this could work in conjunction with other things to build a case that it's yours. Often a case is not built solely upon one type of proof, but several, and the more types you have, the more solid it looks.</p>
      <p>BTW - everyone - if there is one thing in the world that I am sure of, it is that it's impossible to copyright a typeface design in the U.S. So I don't know why anyone in this forum thinks that that is somehow possible.</p>
