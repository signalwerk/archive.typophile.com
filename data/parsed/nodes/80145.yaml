      <p>You're relatively new here Ryan and I'm not sure if you've seen the LetterHead Fonts cautionary tale discussion that's been playing out here for a long time:</p>
      <p><a class="freelinking external" href="http://typophile.com/node/30452" rel="nofollow">http://typophile.com/node/30452</a></p>
      <p>I bought a LHF a long time ago, but am now leery about them as a source. I'm sure that's an overwhelming sentiment based on the many comments of others. Their product is great, but they've focused so much on thwarting piracy that they have in fact thwarted their paying customers to a greater degree. The net sum seems to be an overall loss even though LHF seems to dispute that.</p>
      <p>How much effort and expense do you want to invest in preventing piracy versus investing that expense and effort into font design? I wouldn't advocate what Frank Adebiaye suggest above to just give them away, but I do think it's best to focus more on generating sales to paying customers rather than putting your efforts into preventing freeloaders from grabbing a pirated font. From what I've read it seems that preventing font piracy is like shoveling sand, a lot of effort with little gain.</p>
