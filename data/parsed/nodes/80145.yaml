      <p>I think I'm finally starting to find solutions to my dilemma.</p>
      <p>Here are some things that I've decided that font/typeface designers should probably do to have proof that they were the original creator, based on what I've been hearing from you other font designers:</p>
      <p>First off, I wanted to say that filing a design patent would help, but I believe the cost of this would be a lot. I'm seeing figures of $200 - $1100 (on some websites I've seen when you add in all the fees), maybe $2,000, and that's if you file it yourself and don't also pay an attorney, so I think that's unrealistic for me. And it also takes about a year.</p>
      <p>1. Trademark the name of the typeface (protects it's name anyway and isn't expensive)</p>
      <p>2. Before introducing the font to the world, prepare and launch the best press release possible. If an article about it can appear somewhere, it solidifies and documents the fact that you created the font, and the date that you introduced it to the world. Maybe even create and place an ad about the font somewhere in print.</p>
      <p>3. Upload your design to <a href="http://myows.com/" title="http://myows.com/">http://myows.com/</a>. This looks like a pretty good free solution to me right now. I could explain what it is, but I recommend to any graphic designer or type designer or photographer to check this out. I don't know much about it yet, and I haven't started using it yet, and it may be too good to be true. I'm looking for opinions about it.</p>
      <p>There may be something else too that I've forgotten suddenly, but here's three I have found so far.</p>
