      <p>&gt;&gt;&gt;But how do you really feel about Gotham, Mark? :-)</p>
      <p>There's a huge difference between (a) opening up a font, calling it something else, at selling it unchanged (or tweaked in a very minor way) and (b) designing a font that is similar in genre/letterform (with or without the significant influence of another font that it eventually evokes). When does it become stealing? Scenario (a) is stealing (in my head anyway). Scenario (b) is much less clear-cut.</p>
      <p>You may want to strike me down for this but is there such a massive difference between reviving a font and designing a font that is similar to another recently released font? What timescale is acceptable? Why is a 200 year interval more acceptable than 2 years? Why shouldn't Carol have a slice of the pie that Adrian eating (I almost called it Adrian's pie but I'm not sure it is)?</p>
      <p>Yes, it's bad luck that G is similar to P but is it any more <a>sinister</a> than that? Or has G just made a better fist of it than P (and its designer was quite entitled to have a crack at doing so)? Or are you saying that because Coca-Cola makes nice fizzy pop, Pepsi isn't allowed to try and do the same?</p>
