      <p><cite>putting your work up on Myows really does help you protect it by creating evidence and helping you chase up and deal with infringements. Like most evidence it's not indisputable - in fact, in this case, it's what we in the legal world call 'Prima Facie' evidence (meaning as claimed or 'on the face of it') - but it really does count.</cite></p>
      <p>In the US, that's just not true. US copyright law (specifically, 17 USC § 410(c)) gives special weight to registration certificates <strong>from the US Copyright Office</strong>. It doesn't give any special weight to Myows "registrations."</p>
      <p><cite>It is the digital equivalent of posting the work to yourself in a sealed envelope - old school style.</cite></p>
      <p>In the US, sending a work to yourself has no validity as a "poor man's copyright." That's an urban legend. </p>
      <p><a href="http://www.snopes.com/legal/postmark.asp" title="http://www.snopes.com/legal/postmark.asp">http://www.snopes.com/legal/postmark.asp</a></p>
      <p><cite> A lot of this I addressed a while back in a blog article on that topic: <a href="http://myows.com/blog/using-myows-in-the-united-states/" title="http://myows.com/blog/using-myows-in-the-united-states/">http://myows.com/blog/using-myows-in-the-united-states/</a>. </cite></p>
      <p>I can see numerous misstatements in this posting. For instance, that not registering through the US Copyright Office is only relevant in litigation. Not true. Or that registering multiple blog entries or photos with the US Copyright Office will cost "serious time and money." Not true.</p>
      <p>People in the US who want full protection for their copyrights need to go through the US Copyright Office.</p>
