    html: "<p>At the risk of turning this into a debate, I'd like to end with this and then bow out of this discussion. First up 3rd party non-repudiation tools such as Myows have led to successful takedowns (Myows included). They are also great tools for people who cannot afford to register every single work (some photographers for instance may need to register 160 works at the end of one day). The first of my statements cited above was that your Myows registration still counts as evidence. This is true. My statement was not that this evidence is as compelling as registration with USCO. For more on this visit USCO's FAQ page: <a href=\"http://www.copyright.gov/help/faq/faq-general.html#mywork\" title=\"http://www.copyright.gov/help/faq/faq-general.html#mywork\">http://www.copyright.gov/help/faq/faq-general.html#mywork</a> . Here you'll find this statement amongst others... Q. When is my work protected? A. Your work is under copyright protection the moment it is created and fixed in a tangible form that it is perceptible either directly or with the aid of a machine or device.  You'll also find: Q. Do I have to register with your office to be protected? A. No. In general, registration is voluntary. Copyright exists from the moment the work is created. You will have to register, however, if you wish to bring a lawsuit for infringement of a U.S. work. Bear in mind also that most infringement happens online and outside the US too and USCO has ne relevance in other Berne Convention countries. As per the blog article i cited originally - if you want to sue for damages, you'll need USCO registration, but you don't need this to have infringing work removed. Re the statement on poor man's copyrights. I did in my original posting follow this up immediately with the sentence: \"Unlike posting the stuff to yourself though - there have been a number of successful takedowns\" - this alludes to the fact that the old school 'poor man's copyright' was not effective so you're agreeing with me there. On the final point, if there are any points which you would like to discuss further, please contact me directly and we will happily address these - it is not in our interests to have incorrect information on our site and while we always consult with US or international lawyers and copyright expert, we are happy to admit to and correct any genuine faults in our information.</p>"
