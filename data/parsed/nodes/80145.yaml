      <p>Hey Fontdesigner2 (and everybody else),</p>
      <p>There's a lot of mis-information floating around about Myows and its applicability to US users. A lot of this I addressed a while back in a blog article on that topic: <a href="http://myows.com/blog/using-myows-in-the-united-states/" title="http://myows.com/blog/using-myows-in-the-united-states/">http://myows.com/blog/using-myows-in-the-united-states/</a>. To put your mind at rest though Fontdesigner 2, putting your work up on Myows really does help you protect it by creating evidence and helping you chase up and deal with infringements. Like most evidence it's not indisputable  - in fact, in this case, it's what we in the legal world call 'Prima Facie' evidence (meaning as claimed or 'on the face of it') - but it really does count. It is the digital equivalent of posting the work to yourself in a sealed envelope - old school style. Unlike posting the stuff to yourself though - there have been a number of successful takedowns using Myows' process and a decent proportion of these have been in the good old U S of A too. We started Myows precisely because of the kinds of concerns you raised above and we've seen it really make a difference to Freelancers and creative guys on the street who can't afford a full time lawyer. Also, while most of Myows' services are free for the community, paid up members on Myows also get really reasonable assistance in registering their copyrights formally with USCO. Just some thoughts, I really hope these help. There are other services out there such as Numly and Safecreative which are also worth looking at but services like these really do provide a decent first line of defence and are worth using as they are free and have a proven track record of success. By way of disclosure, I'm one of the guys that started Myows. I'd love to tell you that I'm here to self-promote but Myows is really more of a movement than a business (I'm not quitting my day job just yet).</p>
