      <p><cite>if there is one thing in the world that I am sure of, it is that it's impossible to copyright a typeface design in the U.S. So I don't know why anyone in this forum thinks that that is somehow possible.</cite></p>
      <p>Nobody is arguing that point. In the US, the design of a font is not copyrightable. (A font design can be patented, but that seldom happens.) </p>
      <p>But the instantiation of the font design as a digital file, including the placement of the points, and hinting, is copyrightable software. Therefore, copyright law and copyright registration are relevant to font designers.</p>
