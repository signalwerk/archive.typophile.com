      <p><cite>Upload your design to <a href="http://myows.com/" title="http://myows.com/">http://myows.com/</a>. This looks like a pretty good free solution to me right now.</cite></p>
      <p>Under US law, Myows is a misguided idea.</p>
      <p>First, they imply that anything you can upload is protectable by copyright. Not true at all. Not every original work (or every part of every original work) is copyrightable. And if it's not, uploading it to Myows won't make it copyrightable.</p>
      <p>Second, while you don't need to register your work to get copyright protection, there are certain extra benefits under copyright law for people who do register their works. But you have to register with the only place that matters —&nbsp;the US Copyright Office (<a href="http://www.copyright.gov" title="www.copyright.gov">www.copyright.gov</a>). Registering with Myows won't trigger those benefits.</p>
      <p>Third, Myows doesn't point out that not every unauthorized use of a copyrighted work is necessarily infringing. If someone is making "fair use" of your work under copyright law, it's legal, and sending them a threatening letter is silly.</p>
      <p>"But using Myows can't hurt, so what's the problem?" The headline of the Myows site says "Protect your copyrights, online and for free." Myows creates a fear that without their service, your copyrights are somehow at risk. But if people see Myows as an alternative to the US Copyright Office, that's a detriment.</p>
