      <p>I second the idea of a humanist sans, eg Shinntype's <a href="http://new.myfonts.com/fonts/shinn/sensibility/" rel="nofollow">Sensibility</a></p>
      <p>I would recommend searching "humanist sans" at Fontshop.com, which tends to offer classy suggestions with its "handpicked" keyword lists, and the foundry-defined MyFonts, where you will get more serendipity amongst many faces that aren't humanist at all.</p>
