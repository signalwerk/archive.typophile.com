    <p>Hi all</p>
    <p>I'm using Fresco sans and serif as body copy for an upmarket fashion/travel/food magazine and want an interesting display type to use for headlines (Fresco not quite hitting the mark for me). Can anyone suggest anything that would make a good pairing?</p>
    <p>Thanks!</p>
