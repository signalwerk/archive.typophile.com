    html: |-
      <p>I don’t think a classical lead typeface (Garamond, Bembo …) suits best for engraving. It should be a typeface which has something engraving-like in the very nature of its style.<br>
      Of the well-known this could be something like Didot or a classical script face. If you’re looking for something more fancy, look at<br>
      <a href="http://typophile.com/node/58746" title="http://typophile.com/node/58746">http://typophile.com/node/58746</a><br>
      – its perfect for engraving (and all your other wedding stationary).</p>
      <p>Ah, above all: * B E S T _ W I S H E S *</p>
