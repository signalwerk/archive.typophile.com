    date: 2008-02-13T11:49:00
    date_raw: 13 Feb 2008 — 11:49am
    votes: null
    html: <p>Before picking a face, I'd find a few brands you like, and get your client's feedback on those; also, I'd work them to draw out rough sketches.   I find that if I fall in love with a typeface too early in the process, I become less focused on my client's needs.  Good luck!</p>
