  html: <p>Doing a new identity for a gourmet food company. I'm probably going to go w/ a Michael Schwab look/feel. Small caps, letterpaced. I'm testing fonts like Georgia, Hoefler Text, and Clarendon Light. Any other suggestions?</p>
