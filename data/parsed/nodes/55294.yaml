    <p>In this week, I bought the two DVDs "Bleisatzschriften" (= "Foundry Types"), which contain innumerable old foundry type catalogs and several old typeface books, and also catalogs of hot-metal machine composition typefaces, all of them scanned and converted to PDF files.</p>
    <p>For typeface historians, these two DVDs are a must.<br>
    Here are some random samples drawn from both DVDs: </p>
    <p>- <a href="http://www.sanskritweb.net/temporary/Sample1.jpg" title="http://www.sanskritweb.net/temporary/Sample1.jpg">http://www.sanskritweb.net/temporary/Sample1.jpg</a><br>
