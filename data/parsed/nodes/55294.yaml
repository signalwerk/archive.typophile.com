    html: |-
      <p>You know the way that digital paper works?<br>
      Well, what if the pixels were at the end of tiny pistons--so that a scan could record the depth of impression of metal type, and that could be displayed in the reading device?<br>
      Other dimensional 3D technologies yet to represent letterpress--lenticular, holographic, &amp;c.</p>
      <p>The original documents are priceless, because every copy is ultimately poor.<br>
      Remember microfiche.</p>
      <p>Something about the scent of old books too, and their fragility in one's hands.</p>
