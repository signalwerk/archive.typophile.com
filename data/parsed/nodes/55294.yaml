    html: <p>Nick, you and Nancy are right about the original books. But finding specimen books is becoming increasingly hard as they’ve become quite popular with book collectors. Prices for anything but the basic ATF/Linotype/Bauer books are shooting up, and they sell quickly, making them hard to find at all. Scans are a great place to start. They can also be a nice resource for finding out what was on the pages that were cut out for comping!</p>
