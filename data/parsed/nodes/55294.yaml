    html: |-
      <p>This is all lovely but having grown up with foundry type, then watched it go away, I can't help but wonder after the lost sensation of holding the type specimen books, turning the pages, and experiencing light reflecting off of paper and ink.</p>
      <p>Allow me to encourage everyone to scour tag and estate sales for old books.  Keep them, look at them.  Maybe even read them (I assume typophiles do this but you never know.)</p>
      <p>Last week I had the great good fortune to chat with the director of library and archival studies at LSU.  Digitizing is super important but we need to remind everyone to also keep the books.  (Ah, the books.)</p>
      <p>Read:</p>
      <p><a href="http://www.scribd.com/doc/3562724/Hamlets-Blackberry-Why-Paper-Is-Eternal" title="http://www.scribd.com/doc/3562724/Hamlets-Blackberry-Why-Paper-Is-Eternal">http://www.scribd.com/doc/3562724/Hamlets-Blackberry-Why-Paper-Is-Eternal</a></p>
      <p>and thank you for the post.</p>
    html_clean: |-
