      <p>Here's a logo I designed in 1977.<br>
      <a href="http://www.oktransportation.com" title="http://www.oktransportation.com">http://www.oktransportation.com</a></p>
      <p>The idea, which is a mainstay of the "compressed" ligature, is that where there is a repeated vertical stem, one is removed in a kind of "negative kerning" exercise, and the remaining stem does double duty. In a logo, this provides a point of visual interest.</p>
      <p>There is a similar idea in the "fi" ligature, where the ball of the f serves as the dot on the "i", but the purpose is different: it could be considered as the removal of visual stutter.</p>
      <p>Another category of compressions: as in the Avant Garde ligatures, where the purpose is to enable justification of tight-set headlines.</p>
