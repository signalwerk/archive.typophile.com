  html: |-
    <p>(No, not ligatures for FF Meta...)</p>
    <p>One of my fascinations in the field of "visible language" are shapes<br>
    that stand for more than one letter. It's interesting to consider how<br>
    they combine, what parts are "important", and how the recognition of<br>
    the components is weighted (intentionally or not), when alone or even<br>
    more interestingly in the contexts of words. I can't stop thinking of<br>
    this topic, even in banal places like Dairy Queen, where I daydream<br>
    weather a logo that's a "D" with a tail would work (or maybe it would<br>
    drive their loyal customer base back to the mountains.)</p>
    <p>Below is something I did when working on Trajic notRoman, years ago.<br>
    But more than show what I've done (not much anyway, really) I'd like<br>
    to collect and compile examples you guys might have seen. Please let<br>
    me know of any metaligatures that you think are worth thinking about!</p>
    <p>(Oh, and as always I'm open to terminological<br>
    suggestions as to what to call these things.)</p>
    <p>hhp</p>
