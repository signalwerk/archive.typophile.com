  html: '<p>The Process Type Foundry announces the release <br>of Klavika, a family of sans serifs for editorial and <br>identity design. Features like small caps, true italics,  <br>extended language support and multiple numeral  <br>styles make Klavika an ideal workhorse typeface.  <br> <br>See Klavika: <br><a href="http://www.processtypefoundry.com" target="_blank">http://www.processtypefoundry.com</a></p>'
