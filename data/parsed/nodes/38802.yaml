    <p>Arabic font for Holy Quran<br>
    A high quality OpenType Font for Holy Quran</p>
    <p>October 23, 2007: Pakistan Data Management Services is pleased to announce the release of an OpenType Font for writing Holy Quran text based on Unicode standard. The font features high quality glyphs and has support for all aeraabs/mark placements at proper places. All waqfs (special symbols) used for identifying different pauses in reading are also provided. ‘PDMS Saleem Quran Font’ provides advanced Arabic typography - close to calligraphy while retaining the beauty and legibility of Quran Majeed Arabic text.</p>
    <p>This font enables desktop and internet publishing of Holy Quran using existing software supporting OTF specifications, e.g. Microsoft Word, Microsoft Publisher, Internet Explorer, etc. ‘PDMS Saleem Quran Font’ is available for free download from <a href="http://www.pakdata.com/products/arabicfont" title="www.pakdata.com/products/arabicfont">www.pakdata.com/products/arabicfont</a>.</p>
    <p>We are confident that ‘PDMS Saleem Quran Font’ will appeal to all Arabic users, especially designers and publishers who will no longer be bound by the technological limitations of old Quran printing methods.</p>
    <p>About PDMS: Based in Karachi, Pakistan, PDMS is developing Urdu Software products since 1986. The nationally acclaimed ‘Nastaleeq Nizami’ – Urdu Desktop Publishing software has boosted tremendously the use of computers in Pakistan by making them write beautifully in Nastaleeq script of Urdu language. Other products include Urdu Computer Nizam, Ruqqa-UrduEmail, Urdu 98, Urdu Mahir, PDMS Jauhar, Quran Majeed CD. PDMS has also developed fonts for the regional languages like Sindhi and Pushto besides designing a number of Nastaleeq and Naskh fonts. PDMS is also constantly engaged in developing Internet website and portals and has designed a number of Urdu portals including UrduSeek.com, UrduNews.net, CityIslam.com. The area in which PDMS has technical expertise makes it a unique venture in Pakistan.</p>
    <p>Pakistan Data Management Services<br>
    207 Fortune Center 45A Block 6 PECHS, Main Shahrah-e-Faisal, Karachi<br>
