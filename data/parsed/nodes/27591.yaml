      <p>I didn’t think any coins used type, either — I figured the lettering was always designed by the sculptor who designed the coin. But you’re right! They used both Univers and Arial. What a disgrace. The Arial doesn’t even curve evenly: the type is too big for the arc it’s sitting on. Shame! They spent about $2 Canadian to design the coin.<br>
      I bet Robt. Bringhurst won’t even carry those coins in his pocket.<br>
      As for the US dollar coin, since it’s a reissue of a design from the 1920’s [assuming I am thinking of the same coin you are] the letters are hand-drawn. Those were the good old days: in 1907, Teddy Roosevelt chose Augustus Saint-Gaudens, a famous American sculptor, to design some coins for the US Mint, as part of a comprehensive redesign of the coultry’s coinage.<br>
      According to Wikipedia, the dollar coin was designed by medalist Anthony de Francisci, a naturalized immigrant from Italy.<br>
      Font Bureau’s Grand Central has some of the flavor of public lettering of the early 20th century…</p>
