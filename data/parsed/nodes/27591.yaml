    <p>Hi Everyone.</p>
    <p>My name is Jesse and I currently work as a CNC Operator in an engraving shop.  I have a font dilemma, I am currently working a project for a customer and need to find out what font is used for the 2006 Liberty Silver Dollar.  I have searched high and low and am not able to find it.  Is this a special font used by the Tresury Dept?  I would appreciate any help.</p>
    <p>Thank you for your time and assistance.</p>
    <p>Jesse</p>
