    html: |-
      <p>The sample of 'Fenway' I see in "The Art of Matthew Carter" doesn't have a full serif on the leg of the 'k'. The font was designed for <em>Sports Illustrated</em> magazine, a TIME-Warner publication, which <em>Newsweek</em> is not. However, Mark, I think you got Matthew Carter right -- because he designed 'Vincent Text' for <em>Newsweek</em>, and I think that's what this is.</p>
      <p> - Mike Yanega</p>
