      <p>So, the main differences between ’kern’ table (old fashioned) kerning and GPOS kern feature kerning are:</p>
      <p>1) the latter supports class-based kerning and the former does not<br>
      2) the OpenType spec says that OpenType CFF fonts only use the latter</p>
      <p>FontLab will generate either or both types of kerning, for OpenType fonts with either TT or CFF outlines. The mysteries of when it generates which are determined by preference settings in FontLab. In FontLab Studio 5, it’s under Tools &gt; Options &gt; Generating OpenType &amp; TrueType &gt; Kerning. They refer to the kern table (the old stuff) and the kern feature (the new stuff).</p>
      <p>I hope that helps!</p>
      <p>Regards,</p>
      <p>T</p>
