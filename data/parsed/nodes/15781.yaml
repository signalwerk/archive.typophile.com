    <p>I have the cleartype fonts that will be available in Windows Vista, thta is, Calibri, Constantia, Corbel, etc.</p>
    <p>They are freely available as OpenType fonts based on Truetype outlines.</p>
    <p>They have no kerning, in thay they are listed in Typograf as having no kerning, and trying to kern them in MS Word 2003 has no effect.</p>
    <p>Some characters look kerned, some don’t, or is there some kind of auto-kerning inherent in Cleartype technoogy (that is, the fonts are already kerned)? Several versions I have of them have no kerning. Weird.</p>
