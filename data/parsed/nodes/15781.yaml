      <p>I missed this thread when it started, so will just add a few belated notes on the kerning in the ClearType collection because it was sort of interesting. As Si and Mike note, the fonts all contain OpenType Layout GPOS kern feature kerning, rather than a ’kern’ table. At one stage, we considered including both, the latter with a subset of kern pairs for the benefit of applications that don’t handle GPOS kerning, but Luc de Groot reported various bugs he’d found in software encountering fonts with both the GPOS and old kern table kerning, so we have not pursued this option.</p>
      <p>The OTL tables for all fonts were written using VOLT, not FontLab, for a couple of reasons. Firstly, all the fonts contain lookup types not supported by the FDK/FontLab code. Secondly, Microsoft wanted VOLT files for source management.</p>
      <p>When we began the project, I had already made some fonts using VOLT, and was concerned that it is far from an ideal tool for developing kerning data. There is no way to preview strings of more than two glyphs in the pair adjustment GPOS user interface. So Paul Linnerud from the Advanced Reading Technologies team and I designed a process to convert kern pair data from an AFM file into VOLT lookup syntax. This would enable the designers to do their kerning in FontLab (or FontStudio in Luc’s case), and then convert to VOLT source data. At the same time as Paul and I were working on this, I mentioned to Sergey Malkin at MS Typography that we were looking for a kerning converter. To my surprise and joy, Sergey very quickly delivered a small tool, kern2volt, which was much simpler than the complex syntax conversion I was working on with Paul and produced a smaller, more effiecient lookup. The kern2volt tool examines a kern table and produces an efficient GPOS lookup with classes based on shared values. In the end, we used this tool for all the ClearType fonts. It is now available for download from the VOLT user community on MSN.</p>
      <p>During this process, Luc and his associates in Berlin were busy working on their own kerning conversion method, which took a third approach involving writing VOLT glyph groups to match FontLab kern classes and then writing corresponding kern lookups. We used Luc’s VOLT kern sources made in this way for the early test versions of his Calibri fonts, but discovered a bug in the TT rasteriser in the earlier versions of InDesign that caused the font not to render correctly. This was already fixed in the more recent versions of InDesign, but we decided to convert Luc’s kerning data using the same kern2volt procedure as we had the other fonts in the collection.</p>
