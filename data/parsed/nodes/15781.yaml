      <p>I guess anyone who wants to make kerning pairs for ClearType Fonts, (assuming that ClearType is in fact for the screen as I used to be sure of), the kerns should be “grouped” in value, (the same way stems, heights, counters and all the other features of well bred screen fonts are, lacking in minute details so that nothing leaves the rounding rails ;)), Then when the kern pairs are rounded out of your control, kerning will not “fall apart” in the process and diminish the spacing quality further. This, e.g. would mean that if you have To=-28, Ta=-32, Tw=-36 and Tı=-14, Tu=-18 and Tw=-20, the first three’d be better at -32, and the last three’d be better at -16, CLEAR!?)</p>
      <p>AND HEY! Don’t you dare forget the “rT” kerning pairs out there. :)</p>
