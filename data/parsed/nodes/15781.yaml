    html: |-
      <p>I think we do get value from Kerning onscreen when we use ClearType, particularly when we render with sub-pixel positioning. Actually this was the original design intent for the ClearType fonts. I have some experience in this, as we included some device kerning in Palatino Linotype for onscreen black and white rendering. In the monochrome world the value of Kerning onscreen for normal text sizes was less obvious. You might get away with a To kern for instance, but lowercase kern pairs were problematic, as you have to move 1 whole pixel to kern the letter pair, which is often way too much. In ClearType we have greater accuracy when placing the glyphs onscreen, and so the adjustment of the Kern value, is less than a pixel, which although not optimal still adds value in my opinion. Have a look at the enclosed screen shot, the font is Constantia, designed by John Hudson, at 10, 12, 14 point. We can of course debate the details, and some will say yes but it’s not perfect, on the other hand I see more value having the kerning working, than not.</p>
      <p>The current plan with regard to the CT fonts is to ship with OpenType Kerning tables only</p>
      <p>mike</p>
      <p></p><div class="imageWrap"><img src="/files/CTKern.gif"></div><p></p>
