      <p>In both OT PS (.otf) and OT TT (.ttf) there can be two kinds of kerning: OpenType “kern feature” kerning (which may employ classes or and/or plain pairs) and old-style “kern table” kerning (which only uses plain pairs). However, the relation between the types of kerning differs between the PS/TT flavors.</p>
      <p>Principally, new-style OpenType Layout-aware applications (Adobe CS, Windows Vista WPF, Mellel etc.) use the OpenType “kern feature” kerning only in both flavors. If a font is an OT TT font and the old-style “kern table” is present, then old-style OpenType Layout-non-aware applications (Word, Quark, Flash etc.) will show the kerning specified in the table but if the old-style “kern table” is not present in the font, there will be no kerning. If a font is OT PS and the old-style “kern table” is present, old-style applications will show the kerning in the table, but — and here is the difference — if the old-style “kern table” is not present, the Adobe font driver (ATM, Windows 2000/XP built-in, Mac OS X built-in) will automatically convert the Western subset of the OpenType kerning into old-style kerning on the fly, so you will always get kerning for Western characters.</p>
      <p>In FontLab Studio 5, you can explicitly decide (in Options / Generating OpenType &amp; TrueType / Kerning) whether the font (either OT PS or OT TT) should or should not contain the OpenType “kern feature” and/or the old-style “kern table”. In FontLab 4.6, OT PS fonts will never contain the “kern table” while OT TT fonts will always contain it. </p>
      <p>Adam</p>
