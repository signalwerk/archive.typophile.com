      <p>Without knowing the age of the sign (which I suspect is hand painted, not typeset), I can only give you similar digital typefaces.</p>
      <p>For "ELITE," try Argus:<br><a href="https://www.myfonts.com/fonts/redrooster/argus-rr/">https://www.myfonts.com/fonts/redrooster/argus-rr/</a></p>
      <p>For "Confectioners" and "6," try Beaufort or Classic Roman:<br><a href="https://www.myfonts.com/search/Beaufort%20Extended/fonts/">https://www.myfonts.com/search/Beaufort%20Extended/fonts/</a><br><a href="https://www.letterheadfonts.com/fonts/classicroman2">https://www.letterheadfonts.com/fonts/classicroman2</a></p>
      <p>"The" looks maddeningly familiar, but so far no luck matching....</p>
