      <p>One could indeed put the hinter into the rasterizer. I suspect there are two reasons that wasn't done long ago:</p>
      <p>1) Performance. Even back in the early 90s, let alone the mid-80s, autohinting every font would have had a noticeable impact on output speed.</p>
      <p>2) Until the last few years, Adobe considered the quality of its autohinter a proprietary advantage over other type foundries. This attitude has shifted as we have come to the realization that it is more valuable Adobe as a company to help others make better fonts so that our applications work better.</p>
      <p>Actually, it's a particularly fun aspect to working in the Adobe type group in recent years: we can legitimately say that altruism towards other type foundries is good business, too.  :)</p>
      <p>Cheers,</p>
      <p>T</p>
