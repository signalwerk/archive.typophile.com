      <p>A combination of manual and auto hinting seems to do the trick for me on T1 fonts.<br>
      In FL go, Prefs &gt; Type 1 &gt; Type 1 Auothinting Options.<br>
      Adjusting these numbers based on the stem widths of your design can have a drastic<br>
      impact on the quality of the autohints you end up with. Really thin and really bold designs<br>
      usually need the most adjustment.</p>
