      <p>I think I've heard that the FreeType rasterizer on Unix may do auto-hinting. But other than that, I've not heard of a rasterizer doing autohinting.</p>
      <p>Hinting has some relevance to 600 dpi, but not a ton at normal text sizes. Very small type at 600 dpi benefits quite a bit from good hinting (think 5-8 pt). At 300 dpi hinting matters a lot. At imagesetter resolutions, it matters very little.</p>
      <p>&gt;&gt; autohinting every font would have had a noticeable impact on output speed.</p>
      <p>&gt; Even if you consider that it only has to be done once per character? Just like you cache a rasterization of a glyph at a given size for better performance.</p>
      <p>Even so. I don't think most people realize how slow RIPs were back when. I remember waiting up to an hour for a single page of text for me newsletter to output....</p>
      <p>&gt; Also: When it comes to really small PPEMs (like onscreen) no T1 autohinter can match TTs manual hints. It’s like Mark said about “true” intelligence.</p>
      <p>This is only sort of true. I agree that manual hinting can always be better than auto-hinting. I am dubious about whether manual hinting is always or even usually worthwhile. Manual hinting of TrueType is a particularly troublesome cost/benefit equation because hinting of TT always assumes some particular rendering system: one does it differently for ClearType than without, for example.</p>
      <p>I think it will be very interesting for people to do in-depth comparisons of ClearType on OpenType CFF versus TrueType outlines. It will be especially fun with cases where we have essentially the same typeface design fully realized in multiple formats.</p>
      <p>Cheers,</p>
      <p>T</p>
