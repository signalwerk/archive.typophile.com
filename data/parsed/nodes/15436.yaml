    html: "<p>My recommendations are: hint t1 manually, put in (manually) some standard stems and zones, convert t1 hints to tt (automatically, but adjust conversion rules according to font design), apply delta-hinting to stems and zones (first - auto to stems, then adjust as needed). For most designs it will do 80% of the work.</p>"
