      <p><em>If manual hinting is as easy as you say in FontLab, It makes me wonder why auto hinting seems to fail at it so often.</em></p>
      <p>The difference is that <strong>you</strong> know what the font is supposed to look like, FontLab doesn't. It's easy for you as a designer to look at a glyph and say, "This is an important part of this glyph; this isn't." There is a certain amount of judgement that no algorithm can completely replace. </p>
      <p>If the hinting process was so easy to automate, there would be no need for hints; it could be built into the rasterizer.</p>
