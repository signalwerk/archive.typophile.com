      <p>The way I think about Type 1 hinting is this:</p>
      <p>Any important horizontal stroke (like the crossbar of a T) gets a hint. When you do this, you are defining a horizontal stem. Any important vertical stroke (like the middle of the T) gets a hint. This is called a vertical stem. Some things, like the top of an A and the bottom of a V, also get a sort of one-sided-horizontal-stem hint, even though there's not a horizontal stroke. Forget about diagonal strokes (including italics). They have to fend for themselves. Don't worry too much about serifs.</p>
      <p>Alignment zones are like horizontal ruts. The edges of horizontal stems that fall into them will magically line up with each other at lower resolutions. You normally put alignment zones at the baseline, cap height, x-height, and so on. You make them thick enough to catch any edges that are nearby (including the tops and bottoms of rounded glyphs). This is what keeps things lined up horizontally at low resolutions.</p>
      <p>Standard stems are a bit like alignment zones, but define recurring dimensions in the font, such as thin strokes and thick strokes. The rasterizer decides how many pixels each of these standard stems should be at a given resolution. Then, when it encounters one of your stem hints, it picks the closest match from the standard stems and uses that to decide how many pixels wide it should be.</p>
      <p>Adding hints also imposes some symmetry to the shapes in the glyphs. For instance, a round bullet with no hinting will not necessarily come out symmetrical when it's rasterized. By adding a horizontal and a vertical hint, the rasterizer will magically make it symmetrical in both directions at low resolutions.</p>
      <p>There's obviously more to it than this, but it should be enough to get you started.</p>
      <p>I found David Lemon's introduction helpful when I started doing my own hinting:</p>
      <p><a href="http://www.pyrus.com/downloads/hinting.pdf" title="www.pyrus.com/downloads/hinting.pdf">www.pyrus.com/downloads/hinting.pdf</a></p>
      <p>Between that and the Hinting chapter in the FontLab manual, it's not too difficult to figure out the important stuff.</p>
      <p>Another thing that helps is to turn on the Type 1 Hinting Preview in FontLab. This allows you to see interactively how hinting works. (Note: If you're on a Mac, this won't work in OS X or Classic running under OS X. You have to run FontLab in OS 9 with ATM for it to work. Reportedly, this will be fixed in FontLab Studio 5.)</p>
    html_clean: |-
