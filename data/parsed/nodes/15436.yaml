    html: <p>Type 1 hinting is not that hard and you usually get better results than with autohinting. TrueType hinting is much more complex, and therefore more difficult to do. I also think that autohinting TrueType fonts does not work as well as autohinting Type 1 fonts. You can get the best results manually hinting TrueType fonts, but it's a lot of work.</p>
