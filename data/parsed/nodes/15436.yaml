  html: |-
    <p>What are the benefits of hinting a font if you're not going to do it manually?  I have found that even my more rigid, geometric typefaces end up rendering clunky or wobbly when autohinting comes into play.  Decorative and detailed fonts... fugetaboudit!</p>
    <p>I am of the opinion that an unhinted font generally looks better than an autohinted font on screen, leaving antialiasing to a quality engine (ie: Adobe or MacOS... especially Photoshop with the selection of antialiasing styles).</p>
    <p>How do you all approach this conundrum?  Does it bother you?  What do you prefer... autohinting or no hints at all?</p>
    <p>(PC/Windows centric opinions are most appreciated here.)</p>
