      <p>William, T1 autohinting will typically add more hints than you really need, and some of these can conflict and result in messy rendering. Hint replacement can sometimes deal with these, but if you were hinting manually you probably wouldn't put so many hints in. Also note that FontLab's auto hint replacement function works most of the time, but we found some problems with it when working on a project for Adobe last year. FontLab was reporting correct hint replacement (green dot) but Adobe's test tools were finding faults where one hint sits directly on top of another hint. I went in to the manual hinting window and confirmed that the hints were overlapping, and had to manually create separate hint groups. I have not had an opportunity to test this with FL5.</p>
      <p>Unless I am making a quick-and-dirty test font during development, I manually hint. It doesn't take long, and I like knowing what is going on in every glyph.</p>
