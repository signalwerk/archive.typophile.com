      <p>One tip: if you experiment with hinting in FontLab/FontLab Studio, try the following:<br>
      1. In Font Info / Hinting Settings, do "Auto zones".<br>
      2. Autohint your font.<br>
      3. In Font Info / Hinting Settings / Standard Stems, do "Auto stems".<br>
      4. Remove the hinting. </p>
      <p>The bottom line is that sometimes, having an OpenType PS font without hinting is OK if you have defined standard stems and alignment zones. </p>
      <p>Alignment zones are most important. Standard stems are the second-most important. Individual glyph hints follow in priority. </p>
      <p>A.</p>
