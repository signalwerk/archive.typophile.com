  html: |-
    <p>I'm designing a display face in Fontlab, and I'm only creating uppercase letters. I planned on finishing the uppercase letters (metric and kerning included) and then just copy them to the lowercase letter spots so the same A shows up whether you type a or A.</p>
    <p>However, it doesn't seem like metric and kerning data gets included when I copy and paste letters. I don't know much about Fontlab, but I would've thought I could somehow copy this data. Any ideas?</p>
