    date_raw: 12 Aug 2012 — 12:45pm
    votes: null
    html: <p>For all-caps fonts, I find double-encoding the glyphs to be more convenient during development, even if I end up expanding them at the end. Since the "lowercase" is literally the same as the uppercase, it doesn't matter which one you edit/kern/etc., and there's no need to worry about case when navigating or typing out test strings. Then if I'm feeling especially standards-compliant, before generating I can run a macro that creates properly-encoded lowercase copies and adds them to appropriate kerning classes.</p>
