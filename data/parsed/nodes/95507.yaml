    date_raw: 9 Apr 2015 — 2:19am
    votes: null
    html: |-
      <p>1) Ensure all lowercase letters are deleted<br>
      2) Select uppercase A<br>
      3) In the Glyph Properties panel change the Unicode value "0041" into "0041 0061" and press the Apply button<br>
      4) Repeat step 2 and 3 for the other uppercase letters (0042 -&gt; 0042 0062, etc)</p>
