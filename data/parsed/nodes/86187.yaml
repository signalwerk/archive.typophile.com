    <p><a href="http://kck.st/qpG9iO" rel="nofollow"><img src="http://www.davidtucker.me/wp-content/uploads/2011/10/TheLudlowProject_DavidTucker.jpg"></a></p>
    <p>We at the International Printing Museum seek to rescue a collection of approximately 100 full fonts of antique Ludlow Typecasting matrices, catalog &amp; organize the fonts into our working collection &amp; digitize Ludlow Type Specimen books with notes on available fonts for letterpress projects. Along with the Museum's other metal, wood type fonts, these matrices will be available for casting type to be used by museum patrons, graphic designers &amp; letterpress printers nationally for all kinds of projects including letterpress poster and business card printing, invitation and greeting card printing projects and creative jewelry making and art projects. We will also develop and offer training and classes on Ludlow operation and maintenance to ensure Ludlow's legacy. The success of the project would make this the largest active collection of hot metal type in the world available to the public. That's where we need you!</p>
    <p>Swing on over to the kickstarter to view our video, read up some more on ludlow type casting and donate if you can.  If you are unable to donate but would still like to support the cause please help us out by posting about the kickstarter on twitter facebook linkedin g+ or whereever you would like.</p>
    <p>On behalf of the <a href="/wiki/www.printmuseum.org%20" class="freelinking" rel="nofollow"> International Printing Museum</a>, thank you very much!</p>
    <p><a class="freelinking external" href="http://kck.st/qpG9iO" rel="nofollow">http://kck.st/qpG9iO</a></p>
