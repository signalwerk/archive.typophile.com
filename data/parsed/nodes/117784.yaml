    <p>Hello,</p>
    <p>We are developing a website for a company that uses Parka as its primary font: <a href="http://www.fontbureau.com/fonts/parka/">http://www.fontbureau.com/fonts/parka/</a></p>
    <p>Since it is not offered as a webfont yet we are searching for an alternative that would be suited for web use. Currently I've found a range of FontFonts that share a similar character:</p>
    <p><a href="http://www.myfonts.com/fonts/fontfont/ff-meta/">http://www.myfonts.com/fonts/fontfont/ff-meta/</a><br><a href="http://www.myfonts.com/fonts/fontfont/kievit/">http://www.myfonts.com/fonts/fontfont/kievit/</a><br><a href="http://www.myfonts.com/fonts/fontfont/ff-fago/">http://www.myfonts.com/fonts/fontfont/ff-fago/</a><br><a href="http://www.myfonts.com/fonts/fontfont/sero-pro/">http://www.myfonts.com/fonts/fontfont/sero-pro/</a><br><a href="http://www.myfonts.com/fonts/fontfont/ff-transit/">http://www.myfonts.com/fonts/fontfont/ff-transit/</a> </p>
    <p>does anyone have any other alternatives he/she can recommend?</p>
    <p>Thanks in advance,<br>
    Jürgen</p>
