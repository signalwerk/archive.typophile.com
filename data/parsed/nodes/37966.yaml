  html: |-
    <p>I’m trying to assemble some sort of an identity for my freelance graphics/web job. This is one bunch of prototypes (all the same main idea), utilising my initals (ÓSÓ). I like the fact that it’s also an ambigram, but generally I don’t think they really work. Any ideas? Or should I just pursue another direction altogether?</p>
    <p>Oh yeah, you can just ignore the text in the lower right corner - I was just playing around drawing some letterforms on a grid. I might try and take that somewhere though, if this ambigram logo refuses to work.</p>
    <p></p><div class="imageWrap"><img src="/web/20080705145119im_/http://www.typophile.com/files/osologo_5769.jpg"></div><p></p>
