    html: |-
      <p>Given the size of the type, it's unlikely a full alphabet would have been shown in a specimen book, or in a single document such as a poster.<br>
      However, if someone were to attempt a revival, it would be possible from even these few letters, combined with a general knowledge of early sans letter forms.<br>
      The shapes are extremely gnarly, however, which is a bit offputting; one would have to make a lot of "warts and all?" judgement calls. The ultra-tight fit is quite interesting, though, and the funny torque of the "N"s.</p>
