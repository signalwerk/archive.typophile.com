    html: <p>How big is a "line" in a speciment book, i.e 2-line grotesque, 7-line grotesque?</p>
    html_clean: <p>How big is a "line" in a speciment book, i.e 2-line grotesque, 7-line grotesque?</p>
  - id: 413528
    user: 1215
    date: 2010-05-30T06:18:00
    date_raw: 30 May 2010 - 6:18am
    votes: 0
    html: |-
      <p>“#-line” designations started out with a reference to exactly what size was being multiplied — e.g., Four Lines English, Two Lines Great Primer, etc.</p>
      <p>Later, I believe that conventions converged on Pica as the foremost basic measure; and 2-line, 7-line, etc., thus refer to multiples of Pica.</p>
    html_clean: |-
