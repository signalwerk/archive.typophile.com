    <p>This is something for our German, and more specifically handwriting specialists –&nbsp;I'm looking at you, Florian. ;^)</p>
    <p>This script is found on the <a href="http://www.impawards.com/2009/white_ribbon.html">original movie poster</a> for Michael Haneke's movie <a href="http://dasweisseband.x-verleih.de/">Das Weisse Band</a> (The White Ribbon). Can somebody tell me more about this type of handwriting, and is there anything even remotely similar available as a digital font?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/The_white_ribbon_script_5480.jpg"></div><p></p>
    <p>I mean, it does look pretty awesome, innit?</p>
