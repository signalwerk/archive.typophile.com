    html: |-
      <p>It's called Kurrentschrift or Deutsche Schrift, in English I've seen it called German Blackletter Script too. Do not call this Sütterlin. Many people do, but strictly speaking, Sütterlin is but one variant of this type of script, basically a less-elegant, monoline upright version that was used in schoolbooks (see <a href="http://en.wikipedia.org/wiki/S%C3%BCtterlin">here</a>).</p>
      <p>We've had a bunch of Kurrent stuff recently (which is a good thing – I'm always surprised that it is so little known internationally). There was this wonderful <a href="http://typophile.com/node/65337">handwritten cookbook</a> that Hanno posted to Typophile; my Flickr page has <a href="http://www.flickr.com/photos/ninastoessinger/sets/72157622929372055/">a few spreads from an old Swiss schoolbook featuring both Fraktur &amp; Kurrentschrift</a> (not Sütterlin), and <a href="http://www.flickr.com/photos/ninastoessinger/4184236243/">a sign painter's version of the Kurrent alphabet</a> from a 1930s lettering manual. Some additional discussion and links in those Flickr threads.</p>
    html_clean: |-
