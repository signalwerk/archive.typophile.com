      <p>IMHO House Industries are on the right track. They exclude certain commerical uses from their regular licence:</p>
      <p><cite>A special license is required to use the House Font Software in logo design, with or in electronic books or games, goods for sale, retail packaging, signage or alphabet products such as scrapbook products or software, adhesive or rub on lettering, game playing or gaming devices irrespective of whether the Font Software itself is embedded into the device or if it is merely the designs of the Fonts embodied in the Font Software that are displayed. The terms of this Agreement are contractual in nature and not mere recitations.</cite></p>
      <p>I feel that designers should benefit from commercial exploitation of their designs. Eg a commercial: agency, crew, networks, clients — all of these make plenty money and the guy who made the font used in the lettering gets less than 30 bucks? Not fair.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
