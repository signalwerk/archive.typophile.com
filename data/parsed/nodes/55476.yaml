      <p>There are instances of enterprise licenses for exclusive use of certain fonts, based on the size of a company based on employees or income or another metric. Some may include allowing external use by contractors for package design or advertising. This may be more along the lines of your inquiry. </p>
      <p>I think the ancient logic behind the disallowance for copyright of fonts in the United States is based on a speculated scenario you describe. Font foundries would be able to claim royalties on each letter used by a typesetter, which would lead to suppression of the free press. It's an awkward argument, I admit.</p>
