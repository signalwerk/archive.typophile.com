      <p><cite>James, what is the point of a EULA if a foundry is unwilling to enforce its terms?</cite></p>
      <p>Unwilling and unable are different things. Plenty of foundries would be willing if they had the deep pockets.</p>
      <p><cite>It would have no meaning…</cite></p>
      <p>EULAs have no meaning for many users. Probably even for most users. I have seen reports of font piracy rates by designers being as high as 50% in the USA, and 99% Eastern Europe and Asia—those people sure as hell aren’t worried about EULAs. And there is little reason to assume a EULA has much meaning in large design firms or in-house design departments whose purchases are handled by some non-designer for the sake of accounting practices. Given how many endless EULAs people click through without thinking these days—some Blu-Ray movies now have more than ten pages worth of EULA to access special features—I’m pretty sure that aside from knowing that they usually can’t use any font with non-Flash web embedding, most designers don’t have a clue what’s in font EULAs, nor do they care.</p>
