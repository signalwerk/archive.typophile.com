    <p>As I'm in the early days of learning and creating fonts I'd love some enlightenment on this area of font usage.</p>
    <p>I have seen recently some Major Toy Brands that have released their seasonal Style Guides.<br>
    For those that don't know what a Style Guide is, it is normally a book with all the Character poses, Brand Logos, Colours and Legal details and Fonts to use. It's like a bible for a Brand, do's and don'ts and all the necessary artwork and direction for an individual Supplier or Graphic Designer to apply to a product. Brands sell products. If you have a plain watch and are up against my Branded watch instore, guess which walks out the store first!</p>
    <p>A lot of these Style Guides tell you to use, say Font X, and purchase it at MyFonts.<br>
    So the supplier who for instance, has a contract to use the character or brand goes off individually and buys the font as a single purchaser from MyFonts.</p>
    <p>But then the supplier releases his box toy to his designated market, with the font used on the box or toy. If the supplier to store, sells 10,000 or 20,000 units of the toy, what is the best Licensing Agreement word usage to cover oneself and let the Font Designer get a piece of the action of his or hers now mass produced and distributed font in usage?</p>
    <p>And now seeing the other side of Font Usage. I believe so many Font Designers may be ripped off by Brands having Fonts in their Style Guides that eventually point the Supplier to buy. The Brand Company knows there will be mass usage of the fonts they nominate for usage, but is the poor old Font Designer aware?</p>
    <p>And what wording in a Licensing Agreement is the best to catch this?</p>
    <p>Cheers guys,<br>
    Drj</p>
