    html: |-
      <p>Thank you very much for the insights.</p>
      <p>And sorry about the limited sample; I seem to have some problems uploading attachemts…</p>
      <p>In fact I have a logic (of sorts) to the "broken" strokes: they are on the upper left, and lower right, to follow the nib of a pen. th lc u, n etc. are cut before the intake.</p>
      <p>On the second thing you are right; I haven't incerased the x-height. I should do that to compensate the mass of the glyphs. Thanks.</p>
