      <p>Nice work.<br>
      Two pence from me though:</p>
      <p>In my opinion (and going by what i can make out of the image supplied), for the sake of consistency, it would be worth a try to have that calligraphic, "broken" stroke also on lc u, n, m, etc, in the same vein as it is featured in s and o.</p>
      <p>the second thing is that your weights appear smaller with increasing weight (which is a known phenomenon), for my liking you should increase your x-height a bit with each weight compared to the respective lighter one, to compensate for that effect (I assume that all your weights share an identical x-height?).</p>
