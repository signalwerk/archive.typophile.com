    <p>This is one of four fonts/families I'm currently working on. There are Suomi Script, Serif and Slab Serif.<br>
    This one is a fairly narrow font with a hint of calligraphic forms attached for a bit of character. I have finished the Roman and Italics ranges, and currently working with the Small Caps, OSF, and some OT features…</p>
    <p>What do you think?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SuomiSans.png"></div><p></p>
