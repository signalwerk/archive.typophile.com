    html: |-
      <p>Cloud computing is not a financial model, merely a means of distribution.</p>
      <p>For comparison, consider "@fontface": this is a cloudish means of software access, but may be licensed in varying ways — as a one-time payment or rental.</p>
      <p>The subscription model is a bit of a stretch if it doesn't include periodical updates, making it suitable for companies like Adobe, which has established the practice of frequently updated (albeit bloated) products, for which customers have become accustomed to paying regular upgrade fees.</p>
      <p>It's slightly different with fonts, as versioning does not sit so comfortably. A foundry would have to be extremely well managed in order to offer a subscription service that provided customers with its version of the latest font styles, annually. But I can imagine that in future as a viable business model.</p>
