    html: |-
      <p><em>I think the subscription model is mainly for people who can't get the upgrade discount, or who just need an app for a short period of time.</em></p>
      <p>Nah...it's just a concession to the way we have come to expect things to work.  The current trend in merchandising is for the merchant constantly to have his hand in your pocket. SUPER DEAL! Get a smartphone for only $49.00, which is super only until you realize that you have to commit to spending around $1,500 on service to get the deal, or pay a hefty $325 termination fee if you back out early.</p>
      <p>On a more positive note, the subscription model means that your software is always up-to-the-minute: bug fixes, enhancements and upgrades are part of the deal. Of course, there is a downside: if the later version replaces a feature you REALLY liked in a previous version with one you don't like, you're kinda stuck with "progress"...</p>
    html_clean: |-
