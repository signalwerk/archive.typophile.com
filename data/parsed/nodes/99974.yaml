      <p>There are at least 2 fonts in your sample.</p>
      <p>"ILUSTRADO DE ALAGOAS" looks close to <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/erasmus-rr/" rel="nofollow">Erasmus Light</a></strong> (or Medium) by Pat Hickson (Red Rooster, 1993).<br>
      MyFonts.com notes about this font:</p>
      <blockquote><p>Based on the Sjoerd Hendrik de Roos design, Amsterdam Foundry circa 1923.</p></blockquote>
      <p>The rest of text looks close to <strong><a class="freelinking external" href="http://www.fonts.com/font/monotype-imaging/claire-news/light" rel="nofollow">Claire News Light</a></strong><br>
      The Monotype site says "Design foundry Unknown" but in other sites I see this font as:<br>
      "Claire News CG Light" - Copyright (c) Miles Inc.,1992<br>
      The "Claire News" is also close to Clarendon (it actually looks like a "primitive" Clarendon).</p>
      <p>Your text looks as a pre-digital era sample, so if you can reveal more details about it (like publisher, year, etc) I'm sure there are people in here with much more knowledge than me to point you to the right direction.</p>
