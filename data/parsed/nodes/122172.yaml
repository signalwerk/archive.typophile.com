    votes: null
    html: |-
      <div class="comment-spam-body"><p>Meaning doesn't seem relevant to me in this case, however I do like the notion of using full words as a way to project an identity onto the designs. Like, you could entitle these "god", "sex" etc. rather than using arbitrary titles.</p>
      <p>The series would probably get meaning by doing it over and over again, and the series wouldn't be particularly interesting until it's a big collection. If I were to do that, than certainly it seems a smart idea to use words rather than arbitrary letters.</p>
      <blockquote><p>Veer published some lovely typographic “screensavers” 15 years ago.</p></blockquote>
      <p>That's interesting, because I made a consideration of whether I should continue this series considering that technically these designs are not impressive at all right now. They would have been far more impressive 15 years ago. But as I said, this series could become interesting with quantity.</p>
      </div>
