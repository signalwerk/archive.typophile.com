    <div class="node-spam-content"><p>I don't want to make a habit out of posting random designs, but I figured some of you may take take some enjoyment in seeing this. I took several letters from my typeface Baran and made these abstract illustrations. They're like type implosions.</p>
    <p>Typenova I features /a and /e.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Typenova I small_6346.jpg"></div><p></p>
    <p>Typenova II features /g, /s and /x.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Typenova II small_4068.jpg"></div><p></p>
    <p>Typenova III features /y, /d and /i.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Typenova III small_5253.jpg"></div><p></p>
    </div>
