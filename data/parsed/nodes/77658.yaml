    html: |-
      <p>Neat work. Here are my observations:</p>
      <p>Agree about tail of Q; also ear of g and flag of 1 could be stronger.<br>
      Waist of B needs thinning.<br>
      Bowl of R looks big.<br>
      Lowercase a and e may be a bit wide (compared to b, d and o for example).<br>
      Crossbars on f and t will reduce readability; but perhaps this is more designed as a display face?<br>
      Tail of g seems stringy.<br>
      Lowercase h may be a fraction wide.<br>
      Middle of 3 looks a bit long.<br>
      Multiply should have terminals cut perpendicular to strokes. It's also a little dark.<br>
      Hood of sterling could be rounded more like the S; it's a bit pointy.<br>
      Beaks (?) of curly brackets could be stronger and have larger counters on the inside.<br>
      Those +−×÷=&lt;&gt; also seem to be of different weights.</p>
