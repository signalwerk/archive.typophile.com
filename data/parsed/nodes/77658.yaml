    <p>Hello!</p>
    <p>I have been working on this typeface for quite a while now and would love to hear your opinions and constructive criticism.</p>
    <p>Currently Manila Sans has two weights regular &amp; black. I'm planing to interpolate two more weights between these two when I'm satisfied with all the letterforms.</p>
