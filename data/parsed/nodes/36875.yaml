    html: |-
      <p><em>Yeah, why is Typophile’s Smarty Pants smart enough “to get double quotes right,” but can’t ’manage single quotes’?</em></p>
      <p>The assumption is that typographers will understand that Smarty Pants' solution to a technically intractable problem requires user cooperation, and not use single quote marks for first-order quotations.</p>
      <p>Second-order or nested quotes-within-quotes are an occurence much rarer than apostrophes at the start of words/numbers, so this is now the sacrificial lamb.</p>
      <p>If we users were really smart, we would use some combination of guillemet-style quote marks to deal with second-level quotes -- as is the situation in several languages.</p>
    html_clean: |-
