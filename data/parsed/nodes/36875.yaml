    html: <p>Sad thing is, a lot of teachers say they don't care about perfect punctuation in design briefs, etc. This thread (and that great website, thanks, Haley!) are proof that as designers we do have to be cognizant of spells, punctuation, etc. Of course, I guess I'm preaching to the choir, but still ... I can't tell you how much I cringe when I hear a teacher say, "do your best, but it's not like we're English majors ..." Errg. We're setting type! Geez. If anything, students should be required to take a special class just for writing for design. Fortunately, I have a teacher in my department pushing for that. We'll see ...</p>
