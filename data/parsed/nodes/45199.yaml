    html: <p>Nice tip Paul. Fortunately I've only had one minor blunder so far, I misspelled 'National' in the title of an announcement. The evil thing was seen only for a short while before being yanked and corrected long before going to press. I didn't know there were two 'a's in national - but I do now!</p>
