  html: |-
    <p>With spring comes - garage sales! Today I scored a huge stack of art and architectural mags:)! Amongst the stack are some groovtastic Computer Arts Project mags, one of which is CA's 100th birthday issue. The issue celebrates iconic pieces of graphic design. And there it was - an unwittingly cold cruel typo...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/milton_gi_aser_5809.png"></div><p></p>
    <p>...and in Milton's own stencil font too :( </p>
    <p>Either that, or there really is an iconic graphic designer named MILTON GI ASER.</p>
