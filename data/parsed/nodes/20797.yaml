      <p>Lintype's old stand-alone CD application <a href="/wiki/FontExplorer" class="freelinking" rel="nofollow">FontExplorer</a> (<strong>NOT</strong> to be confused with the new—and free—font manager FontExplorer X) can sort Linotype fonts by subjective criteria, including some emotions. </p>
      <p>Please contact me offline (over my profile) if I can help any more with this.</p>
      <p>There may be some other tools available as well. I think that FontShop San Francisco might have something online that can do this, but I'm not so familiar with their offerings.</p>
