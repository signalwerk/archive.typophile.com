    <p>Hi, long time since I've been here</p>
    <p>Here's the problem, recently my partner had to leave to continue her studies in another country, so I've decided it has come the time to refresh the identity and change the name.</p>
    <p>The name I've decided to use on last was undu, the reasoning behind it might sound silly but it is a reminder on what not to do, in spanish (im from Mexico) to undo hears exactly the same as undu, and also when I started to draft over other names this one is the one that I think I would like to develop the most. </p>
    <p>I understand this are simple letterforms, I want it to turn into a mark by itself and later attach a surname for the divisions which are starting to arise. (TV, print, web). However I've got 2 questions. </p>
    <p>First: Which of the 3 would you choose, I know 2 is to trendy but i added it for comparison purposses.<br>
    Second: If you like 1 or 2 what font would you suggest to go with it, I was thinking along the lines of mic32 by t26 or Tarzana by emigre. But im not completely sure those font choices go on the spot. </p>
    <p>Sorry for english if any critical mistakes are made during this brief writing. </p>
    <p>Thanx in advance.</p>
