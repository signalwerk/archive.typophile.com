      <p>I think #1 is your best option right now. The recognition of the actual name is most effective here, while #3 may be mistaken for just an abstrasct symbol.</p>
      <p>I think simple almost always works, so I wouldn't change #1 much. Perhaps try a typeface with rounded terminals? But I think the face you choce is the best choice for the space.</p>
      <p>The frame of the logo seems a little tight...I would enlarge it by about an 1/8" of an inch. It seems tight in the upper left corner, especially because this is one of two places where the square terminal of the letterform approaches the rounded cornder of the frame. Visually, the breathing room around the perimeter on the left doesn't seem balanced to the right.</p>
      <p>Hey, do me a favor...I could use some critique on my logo too - it's in the forum.</p>
