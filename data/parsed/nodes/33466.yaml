      <p>I like both the name and logos 1 and 3 (you're right; 2 is not quite right). I really like how both are quite abstract but not difficult to decipher. Nice work! If I had to decide, I'd go with 3; it's a really cool mark, aside from having letters within it.</p>
      <p>To go along with it, some suggestions are <a href="http://processtypefoundry.com/typefaces/bryant2/index.html" rel="nofollow">Bryant 2</a>, which echoes the simplified letterforms in your logos (although you may or may not like the rounded ends).</p>
