    html: <p><a href="http://www.myfonts.com/fonts/agfa/times-new-roman/" rel="nofollow">Times New Roman PS MT</a> is Monotype's version of TNR... The other one isn't -- <em>i.e.</em>, it's from another manufacturer. I agree with Russell that you should just install both versions of the font on each of your PCs.</p>
