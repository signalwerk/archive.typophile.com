  html: <p>Working with ID CS3.0.1 -- job made up on one computer, move to another for final touches and printing -(both PC's...) the Times Roman font is not found, first computer a year or so older, font file looks identical... Older computer Has Times roman PS MT, newer just Times Roman. Havn't noticed another font doing anything like this. Can I ever get them to agree on Times Roman? And how&gt;..?  Million Thanks...</p>
