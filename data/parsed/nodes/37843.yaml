      <p>I'd like to add to the suggestion made. Yes, put the other Times Roman on the other computer - but the addition is please remove the Times Roman that is residing there. You don't need any conflicts within the Times Roman family.</p>
      <p>P.S. I'm on a MAC - and I have to live with a .Times Roman dfont in my system. I always kept my "families" of fonts in one suitcase, but thank's the the new system, can't do that. I must now how individual suitcases, and remove the conflicts. And FYI - there have been tons of conflicts with the Times New Roman!</p>
