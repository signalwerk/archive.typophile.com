      <p>The term "experimental" seems to be a post facto pigeon hole description imposed by critics/historians/academics who don't have a more fitting slot to typecast the object in. If you are writing an academic paper, you need to qualify your research in a more specific manner. You may use your example above and focus on legibility issues. There is a huge dataset published on that alone. If you are doing something more arty and less rigorous, you might look at types beginning to break the mould of the status quo at the time. Herbert Bayer's Univversal or Van Doesburg's work might be an area that is fruitful from the early modernist period.--The unicase attempts of Bradbury Thompson and others as well. Even the 1980s ITC excess of x-height period is a more specific instance. There is always the overexamined Grunge period and the Carsonogenic excesses that followed him.</p>
      <p>ChrisL</p>
