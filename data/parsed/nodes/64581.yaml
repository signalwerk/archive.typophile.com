      <p>Certainly the term "experimental" is one of the most abused in the field of type. But Miniscule is a great choice, because it shows that something that seems too experimental can actually work great. And I think this is because it originates from the mind not of a posturing artist, but an old-school scientist, the great Emile Javal.</p>
