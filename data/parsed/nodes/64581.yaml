    html: <p>Experimental doesn't necessarily refer to the aesthetic properties of it. It could be in reference to people doing new things with OpenType programming; it could be projects like what Letterror has done messing with font format technology; it could be free fonts that the priesthood of us designers look down on, where every letter is a pot leaf or a cat. You can interpret the notion of "experimental" a number of ways, but I would definitely agree with James P. -- keep away from the Keedy Sans interpretation of what "experimental" means.</p>
