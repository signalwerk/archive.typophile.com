      <p>All typefaces, except the most unimaginative rip-offs and revivals, are experimental, because the type design process is one of "let's see if this glyph shape works with the other ones". So the designer experiments with applying variations of thematic qualities  like stress, contrast, weight, spacing, serifs, and curve shapes to individual glyphs, and seeing how they look--first in the metrics window, then in sample documents in various media. Next step is to go back and refine things to work better en masse. It's the feedback loop that's a part of so much creative production.</p>
      <p>But I think what is loosely meant by experimental design is that which is unusual enough to draw attention to itself, rather than being part of a seamless whole where only the message is apparent, not the means by which it is delivered.</p>
      <p>Recently "experimental" has been updated (rebranded? obselesced?) in the concept of Critical Design, so perhaps you could approach your topic by looking to see how a typeface could be an example of critical design, which carries more intellectual clout.</p>
