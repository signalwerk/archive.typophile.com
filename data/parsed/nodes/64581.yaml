    <p>--  For school I have to write abit about experimental fonts.. but this is a harder subject than for instance monospace, slab serif and old style.</p>
    <p>This is what I got..and well it tends to be too general.. ---</p>
    <p>The alphabet is by its very nature dependent on and defined by conventions. Type design that is not bound by convention is like a private language: both lack the ability to communicate. Yet it is precisely the constraints of the alphabet which inspire many designers.</p>
    <p>-- But I do like this typeface that I found to illustrate it --</p>
    <p>An experimental typeface:<br>
    Miniscule by Thomas Huot-Marchand, a French postgraduate student of type-design who investigates the limits of legibility while physically reducing the basic forms of the alphabet. Minuscule is his project of size-specific typography.<br>
    Minuscule characteristics are large x-height, robust slab serifs, vertical stress, open structure, big counters, low contrast..</p>
    <p>-- Maybe you know something else to say? --</p>
    <p>xo</p>
