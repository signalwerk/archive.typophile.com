      <p><cite>But I think what is loosely meant by experimental design is that which is unusual enough to draw attention to itself…</cite></p>
      <p>I think it’s also become a term with pedantic connotations. I see the same ideas rehashed over and over and labeled experimental. They’re usually images from workshops or school projects. Sculptural letters, found letters, Sagmeisteresque letters made of string, counterless letters, modular letters, and code-generated letters are all commonly labeled experimental. But there’s a great deal of sameness to them; most of the variety comes from the raw materials or camera angles. It seems to me that experimental is often used in the same sense as school science lab experiments: the outcomes are predetermined and the purpose is hands-on education rather than innovation.</p>
