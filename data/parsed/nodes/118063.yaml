      <p>For a first-time effort, in an ambitious genre, that looks surprisingly good! You do have experience of bezier curve drawing from before, obviously. It's not the most innovative thing but it's a good start – I think you need to consider the personality of the typeface more, what direction you're taking it, because especially with the black it seems to hover between some chunky, fun characters and some that are more straight-laced.</p>
      <p>If possible, could you upload a PDF specimen? With the inherent limitations of pixelled bitmaps it's hard to tell whether something is, say, a major spacing issue/a black blob of a stem width, or just a result of the bitmap itself. Not to mention curve wobbliness, hard to tell at this magnification level.</p>
      <p>/u/ is, at least, too wide. The black /t/ looks somewhat too heavy compare to the other characters, and it's a pity (though perhaps unavoidable) that the /y/ loses its connection to the /j/.</p>
    html_clean: |-
