    <p>This is my first post, so: Hello! I'm not a type designer by trade, but I've been interested in typography for 25 years. A few months ago, I finally bought Glyphs and started noodling around. I had no goal, and wasn't looking at any references, but what came out was this friendly blend of Avenir and Akzidenz, with capitals that are more upright and American. Somehow, the more I tried to remove my own hand, the more of a self portrait it became. Has anyone experienced that?</p>
    <p>Anyway, it has already been a fascinating process, but at this point, I'd love some feedback. I'm open to any type of comment or critique. I have 3 masters so far.</p>
