      <p>It's looking solid. But maybe too solid... What I mean is, unless you intend this simply as an exercise in learning how to make a polished typeface, it seems to need <em>something</em> to stand out for its potential users, to be worth buying, or even just selecting. Which is hard to do without gimmickry. But don't fret about your work turning out as somewhat of a self-portrait; you're a person, making something. Just make sure the <em>objective</em> isn't self-expression, because that becomes mere art; you want to make something useful to others.</p>
      <p>BTW, I like the mirrored AKA "rationalist" (as opposed to 66/99) quotes.</p>
      <p>hhp</p>
