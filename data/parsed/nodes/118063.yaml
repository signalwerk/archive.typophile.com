    html: |-
      <p>@eliason: Good catch! I made it taller for contrast with the /I/, but neglected to propagate that change to the other ascenders. Thank you.</p>
      <p>@Birdseeding: Thank you so much for your feedback. I'll upload a PDF this weekend. It's interesting that you mention the /u/. I think it's the same width as the /n/—is that typical?</p>
      <p>I agree about the black /t/ and /y/ vs /j/. The /t/ can be saved, but in the black weight, the /y/ is a challenge. Maybe I can thin out the curve of the /j/ a bit to match.</p>
      <p>@hrant: That's interesting—I'm definitely hesitant to make the face more idiosyncratic simply to make it stand out, but I see your point. I suppose that's the challenge of this style: to tread the line between "understated" and "boring."</p>
      <p>I'm still torn about the quotes. Sometimes they feel too cartoony, but I like that they're clear. As opposed to, e.g., Univers, where the contrast between open and close quotes can be lost at small sizes.</p>
      <p>@George: The overshoot is perhaps too subtle. I admit it's hard for me to notice it on the samples I posted. It's an overshoot of ±10 units with an x-height of 500, which is about the same as similar faces (I just measured two at ±12). However, it's consistent from the hairline to black—should it overshoot more in the black weight?</p>
      <p>I haven't even begun spacing or kerning yet. I'm dreading it!</p>
      <p>Thank you so much, everyone—I truly appreciate your input.</p>
