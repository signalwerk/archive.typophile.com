    html: |-
      <p>Hi Noisak,</p>
      <p>Schoiffer Sans is in fact inspired by a old serif typeface known as Enschedé English-bodied N°6 (see image)</p>
      <p>I tried to keep the particular structure of the original 'g', 'e' for instance while modernizing the whole and making it a sans-serif (the 's' is more open and 'humanistic' than the original). The 'n' and 'h' 'are more conventional because it is not a display typeface but intended to set text.</p>
      <p>The rounded borders are all made optically, I wanted that the face looks hand-cratfed and that the reader feels the 'ink' as much as possible. That's also why it is slightly flared as well.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/paper-1-300_3906.png"></div><p></p>
