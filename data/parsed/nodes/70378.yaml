    <p>Hello. </p>
    <p>Three university courses will be united under the title 'B u c k s A d s c h o o l' and I've been commissioned to design the logo. </p>
    <p>The client has asked for:<br>
    - a word marque<br>
    - that Bucks be incorporated (lowercase in Flux).</p>
    <p>They like this one, but an informal internal review has resulted in mixed feedback. I won't mention what the comments  yet – would like your input first. Since the review, I've been told I don't need to stick to Bucks in lowercase Flux and they'd like to see a 'normal' version (so no creative twist). If you need me to highlight the 'creative twist', let me know.</p>
    <p>Many, many thanks!</p>
    <p>Irene</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bucks_typophilefeedback_5152.gif"></div><p></p>
