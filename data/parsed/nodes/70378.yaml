    html: |-
      <p>The slant of the "bucks" butting up against the word detracts from the encircled "H." If we're going to read this fluidly, we shouldn't have two visual inconsistencies to decipher all on the same line. You've employed one "trick" with the "CH" and that should be enough. I'd consider finding a less playful, more harmonious way to treat "bucks" in this example, perhaps something more normative than you've been trying. You might also consider experimenting with making the typeface and case for both words match.</p>
      <p>Overall, I want this to read quickly and instantly but something about how you've put the "C" and "H" together stops my eyes dead in the middle and my brain tries for too long to decode its meaning -- it isn't flowing quite yet. Perhaps the H can poke a little out of its nestled cave in the "C"?</p>
      <p>Refer to the logo for "Fast Company." They use inscribed letters as well but it's done in a way that flows effortlessly. It might inspire you.</p>
      <p>BTW...Alaskan may sound harsh but he/she's got a point: always be prepared to kill your baby. Personally, I like the play on words you're attempting, but it's gotta sing to be effective. And in my opinion, school CAN be cool. :D</p>
      <p>P.S. <cite>...the original instruction to keep it lowercase</cite><br>
      I suggest fighting that instruction. Show your client examples of it in uppercase just to see their reaction. You can always state that you're just experimenting with all possibilities. And...you could always mix the cases. If the letters were all the same x-height, ThIS mIGht LOOk moRE InTeresTiNG.</p>
