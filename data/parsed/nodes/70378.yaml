      <p>So, keep looking at other universities. I didn't give you those links just so you could try and prove your work is more "creative." There is a huge gap between "creativity" and "gimmicky" and what you have here is VERY gimmicky. Honestly? I didn't even see the word "COOL" until long after I posted my first comment in this thread. The H inside the C is so puzzling and awkward, I couldn't figure out why it was there. </p>
      <p>Q: What does the word "COOL" have to do with classes?<br>
      A: Nothing.<br>
      Q: What does tiny slanted letters add to the logo?<br>
      A: Nothing.</p>
      <p>But, it seems you're not interested in starting fresh. The hysterical fact that you have the stones to call RISD "bland and lacking creativity" indicates to me you're not looking for a professional solution, you're just looking to be right about your design. I know from experience how counterproductive it can be to get so attached to an idea that you can't do anything but try to force it to work...and then defend it. When this has happened to me, the only thing that eventually produced a successful result was the ability to completely scrap the sketches and start fresh.</p>
