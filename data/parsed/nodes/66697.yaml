      <p>It will be very nice, when it will be done!<br>
      The Greeks are not the only characters that will need some OpenType features : the two fonts that I showed previously contain various latin characters, like swashes, small caps for the St. Augustin, some fleurons, and a lot of abbreviations (quam, quod, qui, qua, pre, per/par, pro, etc.). The two fonts have more than 640 characters, including 350 greeks. I just included the Western Europe characters for the latin.</p>
      <p>And of course I can show you a example of my Civilités: here's a specimen with all the Granjon's (I didn't do one with Danfrie's at the moment).<br>
      <a class="freelinking external" href="http://www.fichier-pdf.fr/2011/12/28/epreuve-civilites/epreuve-civilites.pdf" rel="nofollow">Civilités</a></p>
      <p>With :</p>
      <ol>
      <li>Granjon's <em>Bastarde</em> (Great Primer);</li>
      <li>Granjon's <em>Courante</em> (Great Primer) in French and Dutch variants;</li>
      <li>Granjon's <em>Saint-Augustin</em> (English) in the French (used by various french printers like Jean de Tournes) and Dutch (used by Willem Silvius). You can note that the De Tournes' one is very similar to the Plantin's one, that was adapted by Hoefler &amp; Frere-Jones, but there are actually a few differences (a, g, r, v, y, long final e, final t, final y, initial m, n and v) and there are some extra ligatures too (like "in", "ni", short final "nt", "ho", final "in"), there are a few extra abbreviations too;</li>
      <li>Granjon's <em>Cicero</em> (Pica), adapted from the "Facecies, &amp; Motz Subtilz", with a few differences from the original "Dialogue de la Vie &amp; de la Mort" version (thinner f and long s).</li>
      </ol>
      <p>I included some initials for the 3 sizes (Great Primer, English and Pica).</p>
