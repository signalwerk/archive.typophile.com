      <p>I would definitely be interested, and I think many others would be, too.</p>
      <p>What software do you use? I've found Fontforge to be more than enough for professional type design, and it's free software. It allows you to do all the crazy OTF stuff, too.</p>
      <p>What set of characters do the fonts currently support?</p>
      <p>I completely understand your concerns -- I am not sure if there's a big market for this kind of historic type at all. Yet selling a typeface means getting the details right, all of them, and I know how much pain and pressure that can be (even though my fonts are free, so in my case I owe it only to myself).</p>
      <p>You've done some amazing work though, and it'd be a great shame if it just ended up collecting virtual dust on your hard drive. I suggest you contact the Greek Font Society. And maybe Google, if you're so inclined. (Not trying to pressure you into open-sourcing anything, just in case you're considering it.)</p>
      <p>Of course, if you change your mind and go with commercial publication, this is the right place to ask for advice too.</p>
