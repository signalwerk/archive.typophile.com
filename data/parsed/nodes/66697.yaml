    html: |-
      <p>I use High-Logic FontCreator that a friend "gave" me -- maybe the advanced typography (and others) are available on it, but I'm not very professionnal. I use scans of characters that I adjust manually on softwares like Photoshop or Gimp, no vectorization or other technic stuffs! H-LFC got Unicode, so here I used the "Greek and Coptic" and "Advanced Greek"; greek ligatures, archaic latin ligatures, latin abbreviations (like "pro", "quam", "que"...) are in the Private Area. To insert them, I use the "Insert special characters" menu in word, for example. It's not very practical, but I'm happy with, so life goes on. :)<br>
      The most important thing for me is the result when printed.</p>
      <p>I made a lot of amateur revival fonts, especially french ones of the middle-16th century (romans, italics, blackletters, greeks). Nicolas Jenson was born at 30 miles from me. I just made this for love, I think.</p>
      <p>Thanks for the suggestions, I may will try to contact the GFS -- I saw their website last year, it was very nice.</p>
