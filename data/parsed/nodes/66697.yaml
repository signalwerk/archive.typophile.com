    html: |-
      <p>Thanks for your sample setting of the Civilité. Very nice!</p>
      <p>As for coding eventual OpenType features for automatic substitution of single glyph sequences into ligatures, breviatures and contractions, either for Greek, or for Latin (such as the examples you give), thorough research is desirable, with regards to implicit composition rules that might have been observed — if any at all.</p>
      <p>The case of the <a href="http://www.decodeunicode.org/de/u+017f" rel="nofollow">long s</a> &lt;ſ&gt; (U+017F) shows alone that this is no sinecure, as one can conclude from these elaborate discussions by Andrew West: <a href="http://babelstone.blogspot.com/2006/06/rules-for-long-s.html" rel="nofollow">here</a>, <a href="http://babelstone.blogspot.com/2006/07/long-and-short-of-letter-s.html" rel="nofollow">here</a>, and — less relevant for this case, but with some interesting remarks on the <a href="http://en.wikipedia.org/wiki/R_rotunda" rel="nofollow">round r</a> &lt;ꝛ&gt; (U+A75A and U+A75B) — <a href="http://babelstone.blogspot.com/search/label/Orthography" rel="nofollow">here</a>.</p>
      <p>Oftentimes, randomness seems to have been obvious, and, very likely, rules might have been different from office to office, even more so between different periods in time. One would thus have to decide which composition style or “grammar” exactly one would choose to imitate through an OT implementation — there is but one <code>hist</code> and one <code>hlig</code> registered feature in the OT specs, notwithstanding that history is broad and diverse… To make things worse, or at least more complex, composition rules appear evidently to involve semantics too, a level to which OpenType alas has no means or access .</p>
