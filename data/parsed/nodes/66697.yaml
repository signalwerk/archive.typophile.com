      <p>Some news : I worked on some beautiful material last week, and finished a pack with 5 fonts :<br>
      - <em>Gros Canon</em> (romans &amp; greek caps) in 35 pts<br>
      - <em>Petit Parangon</em> (romans, italics, greeks) in 18 pts<br>
