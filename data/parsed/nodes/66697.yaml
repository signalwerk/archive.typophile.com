      <p>The Greek script is — like any other current script — indeed very spaghetti-like. This has nothing to do with the letters themselves — after all, the Latin alphabet shares most of its (originating, capital) letters with the Greek. It is the way they are written, though, with the running hand, that turn letters into spaghetti. Unfortunately Greek printed type kept the cheirographic clutter, connecting and upstrokes, precisely due to (amongst others, like Aldus) Garamond’s Grecs du Roi. You cannot change that, unless you would romanise the Greek and ask for a lot of trouble with typophiles here. (<a href="http://www.typophile.com/node/29711" rel="nofollow">See here.</a>) But the colour you do can change and adjust to go with that of the Roman better (like the italics), and without altering the skeletal shapes of the letters. If you would prefer so, and thus going astray from your historical example.</p>
      <p>If one talks about OpenType, people usually refer to the features, and to the fact that an OpenType font is 16bit Unicode and thus can hold all the characters you want. They do not refer to the underlying béziers, which may be either in PostScript, or in TrueType. It doesn’t matter if you did your fonts in TrueType outlines. Anyhow, with FontLab you can generate your fonts either way.</p>
      <p>As for the OpenType features, you may want to read this gentle introduction, which will very likely clear some things:</p>
      <p><a href="http://ilovetypography.com/OpenType/opentype-features.html" title="http://ilovetypography.com/OpenType/opentype-features.html">http://ilovetypography.com/OpenType/opentype-features.html</a></p>
      <p>If you would like to outfit your Grecs with OpenType substitutions for ligatures, historical alternates, contextual alternates, breviatures, &amp;c., we might do some work together, share composition rules and code. The big thing is that we — or any one that would like to share OpenType feature code — would have to agree on a standardised naming convention for the glyphs; the glyphs one needs are alas not in Adobe’s de facto standard “Glyph List” (<a href="http://en.wikipedia.org/wiki/Adobe_Glyph_List" rel="nofollow">AGL</a>). </p>
      <p>Can you perhaps show your work on the Civilité; maybe share a link?</p>
