      <p>I updated the topic's name to be more in live with my things.</p>
      <p>As I pause in my greek works, I decided to scan the 1583 Granjon's cyrillics in Gros Texte/Great Primer (that I added to the Garamont's Romans and Granjon's italics of the same size); with that granulous, ancient aspect. Here is a scan from the Vervliet's <em>Palaeotypography of the French Renaissance</em> (vol.2):</p>
      <p><img src="http://img4.hostingpics.net/pics/845043Cyrill1a.jpg"></p>
      <p>These cyrillic types are very close to the greek uncial. For example, the И and the Н (I and N) are respectively identical to the greek H and N (pronouced /i/ and /n/). The evolution is :</p>
      <ul>
      <li>H → И</li>
      <li>N → H</li>
      </ul>
      <p>It also seems that the izhitsa (ѵ) had only a y form, like in the Uk digraph (ѹ). The izhitsa with kendema (ѷ) appears as a y with a double grave accent (as you can see at the end of the main text 3d line), as an equivalent of the greek οϋ. The accentuation seems to be more hazardous than in greek, with psilis and varias in the middle of some words.</p>
