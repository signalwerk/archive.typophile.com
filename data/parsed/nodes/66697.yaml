      <p>Here are some news. I found some very interesting pictures lately, and was able to create some nice amateur fonts in two optical sizes: Parangon and St-Augustin. I decided to add the Granjon's Greeks, that are more typographic, less calligraphic and more in a 1560/70's aesthetic - as I think.</p>
      <p>Parangon : romans by Claude Garamont (with all the ligatures, abbreviations, swashes and others). Italics by Robert Granjon (ligatures, abbreviations, swashes). Greeks by Robert Granjon. No small caps. I think these are the same characters that on the Egenolff-Berner specimen.</p>
      <p>St-Augustin : romans by Claude Garamont (ligatures, abbreviations, small caps, swashes, various symbols). Italics by Robert Granjon (ligatures, abbreviations, a few swashes). Greeks by Robert Granjon.</p>
      <p>I add two pictures, if some of you want to take a look!</p>
      <p><a class="freelinking external" href="http://img15.hostingpics.net/pics/274121Parangon.jpg" rel="nofollow">Parangon</a><br>
      <a class="freelinking external" href="http://img15.hostingpics.net/pics/575282StAugustin.jpg" rel="nofollow">St-Augustin</a></p>
