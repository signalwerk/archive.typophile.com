      <p>Thanks for all. If you want to see a better file of those 2 fonts, I made a couple of pdf with the beginning of the <em>Ioh. Bernarti ad P. Stati Papini Thebaidos</em> (Lyon, Pierre Rigaud, 1624). As soon as I find how to insert pdf files, I'll show you.<br>
      On this, the fonts are at their original size. The fleurons were made by Granjon too, I made a small font with them; the only thing that I didn't digitized on the files are the great initials at the beginning.</p>
      <p>I have digitized other characters too : a Gros Canon/Two-line Double Pica (roman) by Garamont, with greek caps; a Gros Texte/Great Primer with Garamont romans and italics by Granjon or Haultin, and Petit Romain/Garamond/Long Primer italics "Valentine" by Granjon.</p>
      <p>Unfortunatly, I didn't find a good file with some roman Long Primer by Garamont. Granjon made greeks in Long Primer, but they are too wide on the line, so I forgot this idea.</p>
