    <p>Hello!</p>
    <p>I found one or two months ago some scans of a book called <em>Alphabetum Græcum</em> (Robert (III ?) Estienne, Paris, 1580). The pdf file of these scans is available free on the Desguine Library website. On this, there is the famous characters 'Grecs du Roi' from Claude Garamont, in the three optical sizes: Gros Parangon (titles and others), Gros Romain (text) and Cicero (footnotes). There is a complete set of all the characters with a full bunch of ligatures and abbreviations, and so I tried to do some fonts with all these characters.</p>
    <p>This is my first 'serious' font, so I'm not very sure of the result; that's why I show an extract here to get your comments.</p>
    <p>I hope that you will help me :)</p>
    <p>Here is a small example of the font (I took sample text from the Sergei Egorov's <em>Bucentoro Greek</em> topic)</p>
    <p>Edit : I finished the Cicero too. Here two samples of text of the two optical sizes. Reviews are welcome :)</p>
