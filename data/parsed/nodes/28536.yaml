      <p>&gt;except that readability is a pseudo-scientific construct</p>
      <p>No, at least one aspect of readability has been well tested scientifically. James Montalbano's Clearview was tested in actual conditions of reading from a fast moving auto, and was shown to be readable 2 seconds earlier than the current Federal Highway face (basis for Interstate) at 60 miles an hour, if I remember rightly. Also I believe that they showed that medium weights with more open counters read more quickly than heavier weights and more closed counters, eg Helvetica Bold. </p>
      <p>And their font has been sold on the basis of readability to the federal government and adopted by a number of US states. </p>
      <p>I agree that both art and function are important. But your claim that it is not an issue except for "theorists and post facto rationalizations" doesn't hold up. Montalbano is a very practical guy, and he and Meeker have succeeded with it as the prime selling point.</p>
      <p>Also Microsoft has made a huge investment in increasing readability on the screen, and commissioned faces for their Clear Type system. Whether it is an improvement has been debated here, but what can't be debated is that they put money into readability. </p>
      <p>Call it design.</p>
