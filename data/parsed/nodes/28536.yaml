      <p><em>functionality comes first</em></p>
      <p>And you should be able to sit on a chair, but that is a pretty basic requirement.<br>
      Alphabetic functionality may be the primary purpose, but in type that cannot happen without the artistic or cultural dimension <em>at the same time.</em></p>
      <p>In fact, the basic functionality of type design is so damn obvious, rather like comfort in a pair of shoes (to use the hhp analogy), that it is really not an issue for competent practitioners, only for theorists and post-facto rationalizations. The question is, what kind of bullshit should we use to hype our goods?</p>
      <p>We should emphasize the artistry, functionality is understood.</p>
      <p>In fact, this is what Jeremy Tankard does in his specimen for Wayfarer. The formal requirements of adapting a Granby kind of face to signage are dealt with perfunctorily (adjust x-height and horizontal scaling), and he then goes on to discuss the merits of the original, less standardized details of the early 20th century English grotesques, versus the slicker neo-grotesques of the Swiss school.</p>
      <p>At one time, the Helvetic grotesque was considered more "functional", but JT opts for "an informal rhtythm and vitality, which help create interesting word patterns." Note that he talks about interesting word patterns, not "more readability". But aren't they the same thing? -- except that readability is a pseudo-scientific construct, as if you could measure the hummability of a tune.</p>
      <p>Call it art.</p>
