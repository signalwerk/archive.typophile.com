      <p>Definitely much harder, with a revival, retro-inspired, rip off, homage, pastiche, or what ever you want to call it; you know that the previously treaded ground is firm and clear. There's a market acceptance before you even start.</p>
      <p>I think that the layperson's too-common perception of type as a functional object demands a constant refinement of the "utility fonts" which means that a constant portion of work goes into redoing the same thing over and over in the industry, as they update to new technology. This is where type is a mere tool, not an artistic media. It seems hardly worth contemplation, and is what sells big is not an indicator of the future or the present, unless you are speculating on a foundry's stocks.</p>
      <p>In the music industry, vinyl was "upgraded" to tape, then CD, then to portable media files. This has caused the re-releasing of MANY albums, sometimes remastered, repackaged, expanded, or altered slightly. This has happened more at certain times, obviously, but was never an indicator of the direction of or trends in popular music. Even inside the trade, most people usually don't know or care about the details of the remastering or the people who did it.</p>
      <p>So, when looking at the future of type, why do even the people who don't have an interest in retro's and revivals pay such close attention? That's history, not the here and now.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
