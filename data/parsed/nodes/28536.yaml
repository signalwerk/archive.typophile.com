      <p>Hi Rob</p>
      <p>The convention in fine art and illustration is that when you do a piece in a known style you sign it in such a way as to acknowledge the original source i.e. Peter Saville <em>after</em> Fortunato Depero, Paula Scher <em>after</em> Herbert Matter, Franz Ferdinand <em> after</em> Alexandr Rodchenko.</p>
      <p>For reasons that are not too clear, this has never been rigourously applied to the 'plastic arts' and entire reputations have been built on careful appropriation. I guess the critical thing is whether or not the new piece slavishly copies the existing style or merely references it.</p>
      <p>Two (old) articles about this come directly to mind; 'The Age of Plunder' by Jon Savage in The Face No.33 January 1983. and 'A Dearth of Typography' by Malcolm Garrett in an early Baseline magazine (the Bodoni issue I think). Historical pastiche and parody would be other aspects of contemporary design (and advertising) practice worth looking at here.</p>
      <p>How does your instructor define 'the retro design movement'?</p>
