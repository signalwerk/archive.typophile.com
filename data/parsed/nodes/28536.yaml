      <p><em>...where do you draw the line.</em></p>
      <p>I draw the line by drawing the line. </p>
      <p>In the past I've traced over older types, as the basis of new designs, but I've moved on. I don't think tracing is necessarily plagiarism or theft, but there's only so much copying an artist or designer can do before losing their voice, and if you want to be unique, you work from scratch. That applies to individuals and eras; a certain amount of retro is cool, but it's unfortunate that the most popular typeface of the 2000s dates from the 1950s.</p>
