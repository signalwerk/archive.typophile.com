      <p>Chris, Terry, of course I am aware that the question of what is best for reading is a complex matter, and different designs are likely to be superior in one situation and inferior in another--size, distance from the words, etc. It is also not that well understood, in my view. </p>
      <p>I have argued on other threads that the distinction between <a href="/wiki/legibility" class="freelinking" rel="nofollow">legibility</a> (ease of distinguishing one letter from another) and <a href="/wiki/readability" class="freelinking" rel="nofollow">readability</a> is valid. And the Clearview tests were basically for legibility of a few words. But legibility is indeed one dimension of readability. </p>
      <p>Nick, you concede that that scientific tests were revealing in this one case. But to dismiss as irrelevant what they might do in the future--and you can't know--seems to me misguided. The fact that they haven't got that far yet is no reason to dismiss them--or issues of readability--as simply irrelevant considerations. Also I think that a certain basic level of readability is easy to achieve, but superb, easy, inviting readability is to me a big challenge, and many type designs don't achieve it.   </p>
      <p>I agree that art is a big part of design, but my point is that it is only one half the story. Design is *not* simply art, but rather art in service of a practical end. I admire art, and if you want do it, that's great. Paint a painting,make a sculpture, and I'll come and marvel at it. </p>
      <p>But I love design. A beautiful *and* beautifully functional tea pot is just wonderful to look at AND to use. And so is a typeface that makes beautiful and extremely readable words. It enhances the experience of reading and the writer's message. A key part of an excellent design is its excellent suitability to its purpose. Design is not art or craft alone but rather both art and craft done well, together.  </p>
      <p>I think to say either 'type design is art' or 'type design is craft' misses the most important point: to be superb design it has to be both.</p>
