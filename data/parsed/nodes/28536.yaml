      <p>I think you are slightly confusing the idea of "retro" with "homage".  Lots of things are retro, simply by using stylistic cues from previous art movements.  The best retro stuff is actually very contemporary and would never have been produced back in the day.</p>
      <p>The dispute here is between homage and theft.  The Paula Scher case has long caused much debate as it definitely straddles the line.  Homage (and parody) usually depend on the audience getting the reference (or joke).  One could argue that Scher's true audience was Swatch, and not their customers, and they probably understood what she was doing.  She has even said that she had permission from Matter's widow to use the original artwork. This makes this a non-issue, in my opinion.  Once she had permission from the originator (or his estate), then there's no theft.</p>
      <p>I'm not sure if they still run this, but Print Magazine has run some columns from the encyclopaedic Steven Heller chronicling instances of curiously similar designs - very often magazine and book covers.</p>
