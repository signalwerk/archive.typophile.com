      <p>There was a time when designs from older times and older technologies  needed to be redone in current technology to be usable. This is fine, valuable, and admirable. Most of this has been done by now but there are probably a few more out there that should be redrawn for digital use and skilled typographic design historians to do it. Type design that is to represent our current time is something else. There is no need to redraw what has been done for that purpose. We do not need to model our work after previous times to make it valid.  We just need to sit in-front of our tools of choice (be them paper or digital) and design what comes out of our heads instead of what already came out of our ancestors heads. We make marks and then make judgments about them again and again until we are either satisfied with the result or spent from the effort.  Doing something reflecting what already exists gives us a sense of familiarity and a known set of rules to make our judgments easier to approve of. Remember that the people we admire from the past we admire for their innovation, not their duplication skills. Taking a stare at a blank screen or piece of paper may seem off-putting at first but the challenge is a reward in itself.  That is not to say that whatever we do will be looked upon by future generations as something to emulate.  We just need to do our own designs today for their own sake and let the generations to come think what they will of it--just as we did those who came before us.<br>
      So as Nick said, "draw the line" your own line.</p>
      <p>ChrisL</p>
