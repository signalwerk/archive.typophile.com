      <p>The exact same poster made in the eighties would be a very different statement than the if it was made in the twenties, since the context has changed so much. In the twenties it was hyper-modern, even futuristic, while in the eighties it was retro-ironic. If it had been made in the same era, it would have been a ripoff, I mean, they're practically identical.</p>
      <p>It's like that short story by Borges ("Pierre Menard, author of the Quixote") where somebody writes an exact copy of Don Quixote, word by word, but Borges argues that it's a much better book than the original since it was written in an era where writing a book like that meant something more profound.</p>
      <p>I would call this type of thing a "pastiche" or a "homage", and it's not like it's anything new. I mean, the idea of posing models just like God and Adam  in the ceiling of the Sistine Chapel, shooting a model in a Mona Lisa pose or depicting somebody like the Uncle Sam on the "I want you" poster has been done to death. It's not like they're ripping Michelangelo or Leonardo off, just using their work as a part of a statement. Context changes the message just like medium does.</p>
      <p>And anyway, I've always found Scott Adams's statement that originality often starts out as nothing more than plagiarism coupled with a lack of the necessary skills to make an exact copy. In other words, people set out to be the new Michelangelo (or Zapf or Frutiger or whoever), and end up doing something much more valuable and original than that.</p>
