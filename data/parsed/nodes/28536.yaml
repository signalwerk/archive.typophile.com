      <p>Sure, you can isolate one variable, and measure it in a controlled environment with a carefully chosen subject group. But there are quite simply too many variables involved to EVER make reading anything but the softest of sciences. And of course, the target is always moving, as tastes change and designers create new work that modifies convention.</p>
      <p>Scientists like to think they can come up with meaningful stuff on reading, because it appears deceptively quantifiable -- after all the alphabet is a relatively tidy system and eye movements can be scanned. But it's nowhere near that simple. </p>
      <p><em>I think to say either ‘type design is art’ or ‘type design is craft’ misses the most important point: to be superb design it has to be both</em></p>
      <p>So you've changed your mind about "functionality comes first"?</p>
