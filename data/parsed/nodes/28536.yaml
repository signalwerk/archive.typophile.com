      <p><em>No, at least one aspect of readability has been well tested scientifically.</em></p>
      <p>OK, there is a special case. But most reading is not a couple of words at 60 mph. It's bad science to extrapolate principles that work in that particular situation across the board. That's what is so bogus. </p>
      <p>(A world where all street signage has the same bare bones functionality is a boring world of non-places. It would be better to slow down and appreciate the individual personality of differently conceived typographic spaces.)</p>
