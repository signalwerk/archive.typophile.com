      <p><em>The revival of Caslon in 1844—the first revival—was of the actual types,</em></p>
      <p>My understanding is that the Caslons had kept the old matrices (not the type) for sentimental reasons, and recast fresh type. Either way, it's not the kind of revival you're talking about, where a change in technology requires reinterpretation and redesign. In fact, Miller &amp; Richards' Old Style of 1844 (Phemister's "Franklin Old Style") -- sort of Caslon modernized, cleaned up with vertical stress --prompted by the Caslon recasting, may be considered such, motivated by the perceived shortcomings, ie roughness, of the Caslon types to Victorian eyes.</p>
      <p>This was not the first revival, as blackletter had been oft revived over the years, particularly finding use in newspaper mastheads since the 1712 English newspaper tax.</p>
      <p><em>Because admiration for the original design inspires the revivals, my argument not circular. </em></p>
      <p>A designer admiring something old doesn't make it a classic. You would have us believe that anything which is revived or kept alive is a de facto classic. Monticello, for instance, is old, and has long been available from Linotype, but is more curiosity than classic. Then there are quite a few instances of genuine classics for which nobody has decided new technological reinterpretatons were needed. Where is the digital Elzevir (French Old Style, that is, which was an early 19th century French face revived in the 1880s, and popular in the US from then until the 1930s, not the DTL version), for instance, or the digital Franklin Old Style? </p>
      <p><em>you seemed to hold that good old types are never to be preferred to good new modern types.</em></p>
      <p>There's always room for a good new Caslon :-)</p>
