      <p>1. I think the line between old and new is rather broad and fuzzy in type design, particularly the design of text types. Erik Spiekermann said that a text face can only vary about 5% from the past and still work well as a text face. I don't know where he got that number, but I think the basic point is valid. This means that almost all new types to a greater or lesser extent draw on the past. </p>
      <p>2. I do believe in the validity of "Classics" in type design and in every other field I can think of. That is, there are some things of great excellence from the past that are worth preserving and using in the present. But in the case of type, you can't do the equivalent of putting a copy of Shakespeare on your shelf, or a great 18th century table on your living room floor. Loss of old materials and changes in technology mean that the Classic type design has to be interpreted. And this means even a deliberate revival has many decisions about what to preserve and what to change.  And generally the older the type the more decisions that need to be made. Thus in interpreting the designer is creating something to some extent new and with the eye and hand of that designer in it. </p>
      <p>Also there is an extent to which most would not want to revive in old type, such as the splotchy inks and uneven height to paper of early printing. And there are issues of spacing. So the reviver is faced with what to keep and what to change. When the design is closer to a particular original it is a 'revival'. When it is farther it is not. But where to draw the line is not easy to say. Is Electra a revival? No. Is Caledonia? Well, not so easy to say. </p>
      <p>I think new text face designs are just great, but I believe there is also a legitimate place for classics, and hence revivals that are deliberately reminiscent of the originals.  </p>
      <p>We need new plays, but every generation also benefits from revivals of Shakespeare--presented live, today.</p>
