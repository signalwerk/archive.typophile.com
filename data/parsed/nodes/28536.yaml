    html: <p>William, speaking of drugs and social factors, consider the psychiatric experiments with LSD in the 1950s. Researchers in western Canada had some success treating alcoholics by giving them a large dose, one time. However, the results were not duplicated in Toronto's Addiction Research Centre. The difference was that in Alberta the drug was administered in a cosy living room environment with supportive presence of the psychiatrist, whereas in Toronto they tried to isolate the effect of the drug by blindfolding and restraining the subject. The doses were 10 to 100 times a typical street hit of today. Yikes.</p>
