      <p>&gt;But there are quite simply too many variables involved to EVER make reading anything but the softest of sciences.</p>
      <p>Nick, everything seems impossibly complicated until it is understood by science. Then what was bewildering falls into place. For example the growth of a human from a single cell seems much too complex ever to be understood. Then came DNA. Or to take a much earlier example the wandering paths of the planets seemed incomprehensible until Copernicus, Kepler and Galilo came along. </p>
      <p>&gt;So you’ve changed your mind about “functionality comes first”?</p>
      <p>Well, I would modify what I said to this extent. Sometimes art is more important and sometimes functionality. But the ideal is to hit both strongly and successfully. For display type, art can be a stronger factor, more important than readability, whereas in text faces--and I mean for extended text at small sizes--functionality has to come first.</p>
