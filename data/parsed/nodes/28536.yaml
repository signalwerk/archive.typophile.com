      <p>&gt;layperson’s too-common perception of type as a functional object</p>
      <p>&gt;This is where type is a mere tool, not an artistic media.</p>
      <p>Type *is* a functional object. Its function is to convey in writing the words that the writer wants to convey to the reader. That this functionality comes first I have repeatedly read and heard is the view of many top professional type designers. </p>
      <p>Artistry is a dimension of type design, but should always--well almost always--meet the test of functioning well in its primary purpose: to be read.</p>
