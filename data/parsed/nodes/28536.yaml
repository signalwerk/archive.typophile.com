    html: <p>According to Scher, the Swatch poster was a parody of the Matter poster, not a rip-off. The story about the poster and the "controversy" that followed it (only after it started appearing in design annuals) is chronicled in Scher's book, "Make It Bigger." The title of her book apparently comes from something the Swatch marketing director said to her when she was working on the poster.</p>
