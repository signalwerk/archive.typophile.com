      <p>&gt;1. That’s a circular argument, Bill. It only remains classic by being reinterpreted.</p>
      <p>No, it's not circular. The revival of Caslon in 1844--the first revival--was of the actual types, though admittedly with better inks. It was then *recognized* as a classic. And people actually look at the old types as printed, and that inspires them--something like reading the original play and giving a new performance. The point is, they could have just done a new typeface,but they chose to revive one they felt was classic, using the new technology--pantographic punch cutting, linotype, monotype, photo, digital. </p>
      <p>Because admiration for the original design inspires the revivals, my argument not circular. The revivals do help to keep memory of the original alive, but they don't define the classic status. For example, people have been dissatisfied with early digital revivals for example of Baskerville and Electra, because they admired the letter press versions. It is the admiration of the originals as classics that makes people revive them. </p>
      <p>Furthermore, you seem to be conceding that 'classic' is a valid category, whereas before--at least as I have read you--you seemed to hold that good old types are never to be preferred to good new modern types. The analogy in plays would be to say that we should only perform modern plays and never perform Shakespeare. To perform Shakespeare would always be a 'cop out' and an inferior product. But there have been in fact great revivals--both in plays and types.</p>
