      <p><em>Clearview was tested in actual conditions of reading from a fast moving auto, and was shown to be readable 2 seconds earlier than the current Federal Highway face (basis for Interstate) at 60 miles an hour</em></p>
      <p><em>(If I could find a hard copy of my thesis, I’d cite some of them, as that’s part of what I did my Masters on.)</em></p>
      <p>I did do my thesis on this subject too, as a matter of fact. :) The term "readabilty," does not apply here. Viewing signage is a completely different situation and environment than say reading a book. Reading as an activity usually occurs in a controlled environment. In fact, people don't actually "read" signs, they "scan" signs. This is a question of "recognition" not interpretation. Reading involves absorbing information, and often does not involve quick reaction time. How often have you seen a descriptive paragraph on signage—ain't gonna happen.</p>
      <p>People absorb signage in bits of information. This is why concepts like "word shape" are so important. "apple" looks different than "APPLE". This is why mixed case works works better than all-caps in signage.</p>
      <p>The study you speak of was not about "readabilty," but "legibility." There's a reason high contrast serif faces aren't used for signage, and why bold sans serif faces are not used for body copy.</p>
