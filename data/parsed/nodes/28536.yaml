    <p>Hey Everybody</p>
    <p>I'm doing a school project on the retro design movement and since it's based on getting<br>
    ideas from past styles and artwork, I've come across a little question of my own.<br>
    Where do you draw the line when it comes to calling something "retro" and then blatenly stealing<br>
    an idea from a past piece of work. Most notably would be the Paula Scher "swatch" ad in the 80's replicating a work done in the<br>
    20's. Also and most recently the Franz Ferdinand cd cover taking the same image from the "Swatch" ad recently mentioned. </p>
    <p>What is Retro and where do you draw the line.<br>
    also if you can point me to any good reference material regarding<br>
    this issue, that would be sweet too!</p>
    <p>Cheers,<br>
    Rob</p>
