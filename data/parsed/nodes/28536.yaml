      <p>In the Scher/Matter case, Paula was using a very well known Swiss poster design to try to make Swatch associate with it and become well known as Swiss as well.  It was paying homage.  She knew that at least everyone in the design community would know the original and know she was spoofing it. The difference was intent. She did not intend to pass off Matter's work as her own and even paid his family to use it.<br>
      Retro is going back to an old style that we may now think of as quaint or charming and trying to follow that style. I think retro may fail when it is all about the style and the quaintness and not about the current communication issue facing the designer and client.  The reference to that specific bygone era must help valiate the current communication objective to make sense. Making an ad for some hi tech product in art deco style would not help the communication, even if it were aesthetically pleasing.</p>
      <p>ChrisL</p>
