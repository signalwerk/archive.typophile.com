    html: '<p>One thing to consider about "retro": Most of what is called "retro" would not be mistaken for an authentic period design. There is almost always some modern sensibility to it that becomes more apparent with time. Looking back at "retro" designs from the seventies, when they were doing what they thought was Art Deco, to our modern eyes it usually looks more "seventies" than anything else.</p>'
