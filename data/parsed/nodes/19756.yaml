      <p>From what I recall (strictly from memory... somewhere, sometime I’ll find my old notes if I didn’t trash them), between 1982—1986 Compugraphic launched a major push to improve its digital library to support the high-end MCS Digital Imagesetters. This included significant cleanup of the older “CG-lookalike” faces in favor of licensing from originating foundries, release of exclusive designs like Shannon, Garth Graphic, Pasquale and a whole series of revivals which included Goudy Sans, Albertus, Hadriano, Schneidler (these previous four families were release between 1982-83) and more.</p>
      <p>In 1982 we also launched an aggressive ad campaign and produced a special series of 11 x 17 “Type Release” posters for what we felt were high-profile families, in fact, twenty in all. I remember when doing the Goudy Sans poster (the backs had full character specimen samples) that I was amazed by all the cap swash alternates. The family was comprised of six faces — Light, Light Italic, Medium, Medium Italic, Bold and Extrabold.<br>
      </p><div class="imageWrap"><img src="/files/gs-postr3_6122.png"></div><br>
      All I can find so far is a smaller repro of only the front of the original Goudy Sans poster (shown above). On the back of the original poster there was full specimen showings of all available characters, though there may have been sample showings in a mid-eighties CG big type book.<p></p>
      <p>During the mid-to-late eighties, I got the word to “retire” the CG version of Goudy Sans, to be replaced by ITC Goudy Sans. This version had no alternates, and from what is written in the huge 1994 <em>Agfa Type Reference Book for PostScript Users</em> is “Designed by Fredric [Frederic] Goudy in 1929 and released by Elsener [Elsner] and Flake in 1986.” Though on the <a href="https://ssl.kundenserver.de/www.elsner-flake-shop.com/sess/utn;jsessionid=15445d738e4c121/shopdata/product_search.shopscript?query=goudy%20sans&amp;search_logical=and&amp;content=suche&amp;page=1&amp;Filename=gsbk____.ttf&amp;Code=EF1621-1&amp;Family=Goudy%20Sans&amp;Weight=Book&amp;Layout=Text%20West&amp;Designer=ITC%20Design%20Staff/Frederic%20W.%20Goudy&amp;DesignYear=19,861,929&amp;Trademark=International%20Typeface%20Corporation&amp;content_kopf=fontvorschau&amp;pattern=&amp;startitem=0" target="new">Elsner+Flake</a> site, they attribute it to the ITC Design Staff. The ITC version had four weights with corresponding italics — Book &amp; Italics, Medium &amp; Italics, Bold &amp; Italics, and Black &amp; Italics.</p>
      <p>By the late eighties, CG and Monotype had established a relationship, and many more CG faces were “retired” and replaced by licensed versions directly from Monotype. You can see from the specimens shown below (from 1990 <em>Agfa Type Book</em>) that Goudy Sans retained a few alternates. (Thick book hard to flatten on scanner.)<br>
      </p><div class="imageWrap"><img src="/files/gs-MT3_5633.png"></div><p></p>
    html_clean: |-
      <p>From what I recall (strictly from memory... somewhere, sometime I’ll find my old notes if I didn’t trash them), between 1982—1986 Compugraphic launched a major push to improve its digital library to support the high-end MCS Digital Imagesetters. This included significant cleanup of the older “CG-lookalike” faces in favor of licensing from originating foundries, release of exclusive designs like Shannon, Garth Graphic, Pasquale and a whole series of revivals which included Goudy Sans, Albertus, Hadriano, Schneidler (these previous four families were release between 1982-83) and more.</p>
      <p>In 1982 we also launched an aggressive ad campaign and produced a special series of 11 x 17 “Type Release” posters for what we felt were high-profile families, in fact, twenty in all. I remember when doing the Goudy Sans poster (the backs had full character specimen samples) that I was amazed by all the cap swash alternates. The family was comprised of six faces — Light, Light Italic, Medium, Medium Italic, Bold and Extrabold.<br>
      </p><div class="imageWrap"><img src="/files/gs-postr3_6122.png"></div><br>
      All I can find so far is a smaller repro of only the front of the original Goudy Sans poster (shown above). On the back of the original poster there was full specimen showings of all available characters, though there may have been sample showings in a mid-eighties CG big type book.<p></p>
      <p>During the mid-to-late eighties, I got the word to “retire” the CG version of Goudy Sans, to be replaced by ITC Goudy Sans. This version had no alternates, and from what is written in the huge 1994 <em>Agfa Type Reference Book for PostScript Users</em> is “Designed by Fredric [Frederic] Goudy in 1929 and released by Elsener [Elsner] and Flake in 1986.” Though on the <a href="https://ssl.kundenserver.de/www.elsner-flake-shop.com/sess/utn;jsessionid=15445d738e4c121/shopdata/product_search.shopscript?query=goudy%20sans&amp;search_logical=and&amp;content=suche&amp;page=1&amp;Filename=gsbk____.ttf&amp;Code=EF1621-1&amp;Family=Goudy%20Sans&amp;Weight=Book&amp;Layout=Text%20West&amp;Designer=ITC%20Design%20Staff/Frederic%20W.%20Goudy&amp;DesignYear=19,861,929&amp;Trademark=International%20Typeface%20Corporation&amp;content_kopf=fontvorschau&amp;pattern=&amp;startitem=0" target="new">Elsner+Flake</a> site, they attribute it to the ITC Design Staff. The ITC version had four weights with corresponding italics — Book &amp; Italics, Medium &amp; Italics, Bold &amp; Italics, and Black &amp; Italics.</p>
      <p>By the late eighties, CG and Monotype had established a relationship, and many more CG faces were “retired” and replaced by licensed versions directly from Monotype. You can see from the specimens shown below (from 1990 <em>Agfa Type Book</em>) that Goudy Sans retained a few alternates. (Thick book hard to flatten on scanner.)<br>
      </p><div class="imageWrap"><img src="/files/gs-mt3_5633.png"></div><p></p>
