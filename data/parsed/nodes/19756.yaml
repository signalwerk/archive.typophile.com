      <p>Yup... all identified.</p>
      <p>1) Matthew Carter’s ITC Galliard<br>
      2) <a href="http://www.myfonts.com/fonts/agfa/shannon/" target="new">Shannon</a>, a CG exclusive by Kris Holmes and Janice Prescott Fishman. The initial forms were based on the <a href="http://www.bookofkells.com/book.html" target="new"><em>Book of Kells</em></a> and expanded in several weights using IKARUS (now from <a href="http://www.myfonts.com/Article892.html" target="new">URW++</a>) interpolations.<br>
      3) Goudy<br>
      4) <a href="http://www.myfonts.com/fonts/bitstream/itc-grizzly/" target="new">ITC Grizzly</a> (I told you it was a bear) by Tom Carnase and Ronne Bonder.<br>
      5) <a href="http://www.myfonts.com/fonts/bitstream/itc-toms-roman/" target="new">Tom’s Roman</a> also by Tom Carnase and Ronne Bonder.<br>
      6) <a href="http://www.myfonts.com/fonts/urw/artcraft/" target="new">Artcraft</a>... yes, it helps to be “old” to remember this one.</p>
      <p>One of my personal favorite type families (because of its eccentric qualities) is Goudy Sans, which at one point had more swash and alternate characters than ITC Avant Garde Gothic. Somewhere in my dusty vault I have specimens, but these characters were “axed” long ago when CG first licensed Goudy Sans to ITC, then subsequently Monotype took claim of licensing. Not sure if the lost alternates will ever be released again :-(</p>
