    <p>I was just leafing through some of my old pre-Postscript specimen books and got nostalgic about some of the swash and alternate characters that got dropped during the initial conversions to Postscript.</p>
    <p>With OpenType advanced features, many typefaces are becoming available with for use with alternates. Just thought I’d show you a few of the alternates that have been stash in the vaults... maybe they will make their way back.</p>
    <p>All of these faces are currently available in digital format in one form or another. Please excuse some slight distortions as they were scanned from thickly bound books.</p>
    <p>Thought some of you might have some fun just trying to identify their parent typefaces. (Samples added below)</p>
