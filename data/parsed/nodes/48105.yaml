      <p>I think D15 looks like a Caslon Oldstyle or especially Linotype's Caslon Old Face, which has a very similar swash N (however, now that I look at it the italic K is not the same as your sample -- your sample's K is quite odd looking, with a very low join for the upper arm and stem. The l.c. italic k is also odd). In Mac McGrew's book of American Metal Typefaces this seemed about the closest I found, but the more letters I look at, the more doubt I have that I am seeing anything that matches enough of the letters.</p>
      <p>The problem with Caslons is that they were probably one of the most common typefaces, and every foundry had multiple versions. There are no marks that help identify the foundry?</p>
      <p>- Mike Yanega</p>
