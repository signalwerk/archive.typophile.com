      <p>Thanks Thomas &amp; Koppa,</p>
      <p>B6 &amp; C12 are definitely <a href="http://www.myfonts.com/fonts/bitstream/news-gothic/condensed/" target="_blank" rel="nofollow">News Gothic Condensed</a>; the lowercase "g" is the confirming glyph.</p>
      <p>B5: After doing some digging I've come up with a variety of versions of this type in digitized forms, all under the name of Jensen/Jenson Old Style:<br>
      One design by <a href="http://www.myfonts.com/fonts/woodentypefonts/jensen-old-style/" target="_blank" rel="nofollow">Jordan Davies</a> for Wooden Type Fonts;<br>
      and another by <a href="http://www.myfonts.com/fonts/linotype/jenson-old-style/" target="_blank" rel="nofollow">Freda Sack</a> for Linotype, but a third provided the best info:</p>
      <p><a href="http://www.myfonts.com/fonts/hihretrofonts/phinney-jenson/" target="_blank" rel="nofollow">Phinney Jenson</a>, released digitally by HiH Retrofonts, seems to most clearly provide details on the provinance of this type in metal:</p>
      <p><em>In 1890 a leader of the Arts &amp; Crafts movement in England named William Morris founded Kelmscott Press. He was an admirer of Jenson’s Roman and drew his own somewhat darker version called “Golden”, which he used for the hand-printing of limited editions on homemade paper, initiating the revival of fine printing in England.</em></p>
      <p><em>Morris' efforts came to the attention of Joseph Warren Phinney, manager of the Dickinson Type Foundry of Boston. Phinney requested permission to issue a commercial version, but Morris was philosophically opposed and flatly refused. So Phinney designed a commercial variation of Golden type and released it in 1893 as Jenson Oldstyle. Phinney Jenson is our version of Phinney’s version of Morris' version of Nicolas Jenson’s Roman.</em></p>
      <p>It's a clunky / quaint attempt at Jenson, but an interesting curiosity to have in the drawer.</p>
      <p>*</p>
      <p>Still very curious about those smaller fonts (D1, 2, 3, 7, 8, 15; B2 &amp; 9).</p>
      <p>Koppa, I do know of Theo &amp; Dale Guild and have fallen hard for their Cloister Light Face; unfortunately I can't afford Theo's minimum order at the moment, but I'm attempting to find a few others to band together to place an order. It's the most beautiful version of the Jenson type that I've ever seen.</p>
