      <p>Rarely do I attempt this, but I'm a foundry type guy myself so I'll give it my best shot without referencing anything...</p>
      <p>B1 is definitely Onyx.<br>
      B5 looks like it might be Benton's Cloister (I think it was called Cloister anyway...it was his magnum opus if I recall correctly)...lucky you!<br>
      C12 (and B6) looks like Extra Condensed News Gothic.<br>
      And the other one in B6 is Kaufman Script.</p>
      <p>Is the top one a Garamond Italic?</p>
      <p>The rest I'll leave up to the pros around here!</p>
      <p>And if you're interested in ATF type, you have to be interested in <a class="freelinking external" href="http://www.daleguild.com/" rel="nofollow">Theo Rehak</a>. The Dale Guild site might be of some help.</p>
