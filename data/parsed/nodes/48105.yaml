      <p>OK, I think I have them all identified EXCEPT D15, so if anyone can lend some help on this one I'd be very grateful. (And thanks for the assistance thus far.)</p>
      <p>Koppa, I'll likely pester you down the road about that Cloister; the Light Face isn't shown on the Dale Guild website, but it's extremely handsome in print. I have someone New York state who is also wanting some, but he and I want different sizes (I'm after the 14 &amp; 16pt, and he's after 18); the type is quite small on the body, so 16 seems ideal to me for poetry (which is primarily what I print).</p>
      <p>Anyway, back to this thread's topic. Here is the list of final IDs, and a close up of D15 for further study:</p>
      <p>B1: 72pt <a href="http://www.myfonts.com/fonts/bitstream/onyx/" target="_blank" rel="nofollow">Onyx</a> &amp; 12pt <a href="http://www.myfonts.com/fonts/ephemera/shipley/" target="_blank" rel="nofollow">Shipley/Kennerley</a><br>
      B2: 12pt <a href="http://www.myfonts.com/fonts/bitstream/century-expanded/italic/" target="_blank" rel="nofollow">Century Expanded Italic</a><br>
      B5: 24pt <a href="http://www.myfonts.com/fonts/hihretrofonts/phinney-jenson/" target="_blank" rel="nofollow">Phinney Jenson</a><br>
      B6: 18pt <a href="http://www.myfonts.com/fonts/bitstream/news-gothic/condensed/" target="_blank" rel="nofollow">News Gothic Condensed</a> &amp; 14pt <a href="http://www.myfonts.com/fonts/bitstream/kaufmann/" target="_blank" rel="nofollow">Kaufmann Script</a><br>
      B8: 36pt <a href="http://www.myfonts.com/fonts/itc/founders-caslon/fcaslon-thirty-italic/" target="_blank" rel="nofollow">Founders Caslon 30 Italic</a><br>
      B9: 12pt <a href="http://www.myfonts.com/fonts/berthold/kennerley-bq/italic/" target="_blank" rel="nofollow">Kennerley OSBQ Italic</a><br>
      C12: 36pt News Gothic Condensed<br>
      D1: 8pt <a href="http://www.myfonts.com/fonts/efscangraphic/cheltenham-old-style-sb/rom/" target="_blank" rel="nofollow">Cheltenham Old Style</a><br>
      D2: 8pt Cheltenham Old Style Bold<br>
      D3: 12pt Cheltenham Old Style (lc)<br>
      DVII: 12pt Cheltenham Old Style (caps)<br>
      D8: 10pt Cheltenham Old Style</p>
      <p>D15: ????</p>
