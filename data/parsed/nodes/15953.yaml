      <p>This equipment is worth consideration. Not recommended for commercial printing but certainly for fine book production. It would require space. Knowledge how to use the equipment would take time. There are still people around that could consult by e-mail or telephone. Jim Rimmer or myself would probalby be helpful.</p>
      <p>I am not as "Kelly Friendly" as Jim but the sheet size is respectable. Bigger would be better. "Bigger" means more iron.</p>
      <p>Gerald Giampa</p>
