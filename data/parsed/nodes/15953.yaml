      <p>The Keely B can be a great thing for a designer to have, particulary if one wishes to tinker around with wood and other display type.</p>
      <p>Quite a bit more cumbersome and much heavier than a Vandercook, but the Kelly can be used a little like one. I had mine for more than 20 years and sometimes used it to pull proofs of large lino cuts. The large 17x22 size is really nice. </p>
      <p>At one time I had condsidered removing the  feeder at the back of the press to make stream hand-feeding easier. </p>
      <p>Also the 10x15 C&amp;P is a nice gift.</p>
      <p>And the man offers free loading. what more could a person ask?</p>
      <p>Jim</p>
