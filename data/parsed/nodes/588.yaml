    html: <p>Sean, the updated version is much improved. I would very slightly shorted the foot of the <i>el</i> and make the interior space just a little bit wider. You can still make the left left a bit more diagonal if you want. <br> <br>Regarding the spacing, can you provide some more context so we know how tightly spaced your Latin text is going to be?</p>
