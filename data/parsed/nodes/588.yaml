    html: <p>John's the expert on the forms, but I'd point out that the spacing needs work too. <br> <br>Plus if you're willing to break from the Modernist doctrine of bland uniformity, you might make the "a" different than the original Latin one, perhaps by giving it more rigidity, like a straight middle join. That would be classy. <br> <br>hhp <br></p>
