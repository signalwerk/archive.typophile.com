    html: "<p>This is totally tangential, but it hit me hard enough that I'd like to share it: <br> <br>If Cyrillic is effectively  more \"uppercase\" than Latin, maybe Cassandre wanted to reform Latin to regain its majuscule majesty (via Peignot) in large part because he was originally Russian? <br> <br>hhp <br></p>"
