  html: <p>I need to add a single cyrillic word into a manuscript I'm working on, but alas, the typeface I'm using (ITC Quay Sans Book) has no cyrillic version. So, I'm forced to cludge. Can someone looks this over and let me know if I've bolloxed it up? <br> <br><img src="http://www.typophile.com/forums/messages/4100/12813.jpg" alt="Cyrillic"></p>
