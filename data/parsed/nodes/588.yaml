    html: <p>For a kludge, this isn't too bad. You have not made the <i>el</i> too rectangular, which is the usual beginner mistake. You could make the left, curved stem even more diagonal if you wanted to. To balance with the <i>a</i> this form needs to be a little bit wider. <br> <br>The width of the capital <i>Pe</i> should be slightly narrower than the Latin <i>H</i>. <br> <br>The <i>ya</i> is the trickiest letter you need to deal with. The head must be larger, try to balance it optically with the counter of the <i>a</i>. Of course, this means that the whole letter needs to wider, and the leg shorter.</p>
    html_clean: <p>For a kludge, this isn't too bad. You have not made the <i>el</i> too rectangular, which is the usual beginner mistake. You could make the left, curved stem even more diagonal if you wanted to. To balance with the <i>a</i> this form needs to be a little bit wider. <br> <br>The width of the capital <i>Pe</i> should be slightly narrower than the Latin <i>H</i>. <br> <br>The <i>ya</i> is the trickiest letter you need to deal with. The head must be larger, try to balance it optically with the counter of the <i>a</i>. Of course, this means that the whole letter needs to wider, and the leg shorter.</p>
