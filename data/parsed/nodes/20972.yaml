    html: |-
      <p>Grunged fonts very rarely look good at large sizes where the limits of the original drawings are too visible, better to take a clean base font and apply your own texture, or there is software called something to do with washing (help?) that will apply texture to type, at least repeating characters won't look the same.</p>
      <p>Are grunged fonts not reaching the end of their fashionability?<br>
      Tim</p>
