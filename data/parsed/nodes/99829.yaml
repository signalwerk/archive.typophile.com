    html: |-
      <p>Currently, ISO/IEC 14496-22:2009 (the OFF standard within the MPEG standard) makes no implementation recommendations for Indic script layout. The Microsoft Indic font specifications are not part of the ISO standard; indeed, the OFF/OTF specifications notoriously are <em>not</em> OTL implementation specifications, but only font format specifications.</p>
      <p>The Microsoft Indic font specifications, which do specify layout behaviour for the scripts, probably do need to be changed to explicitly account for cross-cluster lookup interaction. My reading of the current specifications is that they don't explicitly prohibit it, and implementors have simply presumed that because the cluster is the basic unit of script shaping anything beyond the cluster can be ignored, whereas, I am arguing, this is clearly not the case after basic shaping has been done. Yesterday, I spent some time testing a new build of the open source Harfbuzz layout engine, and am pleased to report that it does not impose this limitation. So I think a change to the Indic specs would involve adding some specific wording regarding this behaviour, rather than changing existing wording.</p>
      <p>Changing existing layout engines is a tougher nut to crack, especially if the makers are concerned about the affect on existing fonts and documents. I suppose we could do the classic sfnt data compatibility manoeuvre and define an OS/2 bit as a flag for new fonts and engines meaning 'Allow cross-cluster lookup interaction in Indic script layout'.</p>
