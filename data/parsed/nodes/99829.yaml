    html: |-
      <p>Update:</p>
      <p>I've been testing a new build of the Harfbuzz layout engine, which works perfectly with cross-cluster lookup interaction. Harfbuzz is not as widely deployed as the MS and Adobe layout engines, and not as critical for my clients, but it is a good demonstration that what I am asking for is possible and, so far as I can tell, not difficult to implement.</p>
      <p>Adobe have test fonts, and are looking at this issue.</p>
