    html: |-
      <p>Hrant: <em>does Adobe's autohinter work with Latin fonts only/better?</em></p>
      <p>It's script agnostic: it identifies stems based on outline architecture, and doesn't involve any knowledge of what the glyphs are. This fits with Adobe's long term hinting and rasterising philosophy: PS stem hints, alignment Blue zones and Blue Scale values, and standard stem values provides hints to the rasteriser about the architecture of the glyph. So it makes more sense to ask whether the rasteriser works better with some scripts than others, rather than asking whether the hinting tool does.</p>
