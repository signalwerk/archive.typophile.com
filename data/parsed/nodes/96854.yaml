    votes: null
    html: <p>I used to do manual PS hinting because I found situations in which I preferred the results I could achieve that way to what either the FontLab or Adobe autohinter were doing. But I gave up after Adobe took fonts I had made for them in this way and ran them through their autohinter. Now I used the FDK autohinter to generate stem hints. Note that you need to set up standard stem hint values first, and can affect the outcome of alignment zone hinting by adjusting the Blue Scale value.</p>
