  html: |-
    <p>What would be the best hinting method right now in terms of speed vs quality? I'm making a PostScript OTF. Manual TT hinting is too much for me right now I'm afraid.</p>
    <p>- Adobe FDK's autohinter? Any settings or preparations I should be aware of before running the script?<br>
    - Adam Twardoch's PS autohinting tutorial?<br>
    - Maybe turn the font into TT OTF and use Ttfautohinter? What would be the process in converting to TT OTF? Will it increase the number of points on outline and thus amount to the filesize?<br>
    - Any other good methods to consider?</p>
