    <p>Hello,</p>
    <p>I am trying to identify the following font.<br>
    Currently I got hired as a designer for a company as their old designer is fired, during the process of switching over I asked him what fonts he used and all I got was: "You can find them online, just download the free ones". As you can see not very helpful.</p>
    <p>It is in regards to this product:<br>
    <a href="http://s18.postimg.org/y98i26g1h/MPC_LOGO.jpg" title="http://s18.postimg.org/y98i26g1h/MPC_LOGO.jpg">http://s18.postimg.org/y98i26g1h/MPC_LOGO.jpg</a></p>
    <p>Doing some searches online I first thought it was Nedian-Medium, but the "E" is really throwing me off here, also this one isn't free which the old designer seemed to hint too.</p>
    <p>Anybody any tips?</p>
    <p>Thank you,<br>
    Ben</p>
    <p>Btw, I does not have to be a free font. I just assumed he downloaded a free one, considering his helpful comments.</p>
