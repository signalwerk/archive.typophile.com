    <p>I've already spent three days with this design. I try to have a sedated version of Caslon, but not with a Dutch or French dryness. I also make this font with a tall x-height for newspaper use, where Caslon is seldom used.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cardinale2_4578.png"></div><p></p>
