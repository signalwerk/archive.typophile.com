    html: |-
      <p>Seven… soap… who's your client, David Fincher? :-)</p>
      <p>I like the colors, they seem fittingly soapy. I agree with the others though that the "handmade" quality isn't really represented.<br>
      It might be interesting to consider what the soap itself looks like. For example, I had some handmade soap recently that's deliberately cut non-orthogonally and has extra ingredients that are kinda chunky and sticking out here and there, so that seemed/felt really handcrafted. If your soap looks like that too –not perfectly "smooth"– that should possibly reflect in the packaging/logo as well. </p>
      <p>The difficult part in this case would be to find a look that communicates "handcrafted", with all the irregularities that entails – but make the irregularities feel like a sign of quality, not amateurism.</p>
      <p>So I'd try some handlettered ideas. Carefully crafted faux type could really rock.</p>
