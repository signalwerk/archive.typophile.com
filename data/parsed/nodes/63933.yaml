    <div class="info">Submitted by <a href="/user/49865" title="View user profile.">emquad</a> : 5.Nov.2009 2.41pm </div>
      <p>Oak Knoll has published William E. Loy’s Nineteenth-century American Designers &amp; Engravers of Type. With biographies of 30 engravers and illustrations of over 800 typefaces it’s a must for anyone remotely interested in type. Also an ideal Xmas gift for your acquaintances who don’t “get” type since no one can resist the wild flourishing Tuscans or even the absurd texts used to display the faces. More info at <a href="http://www.oakknoll.com/Loy" title="http://www.oakknoll.com/Loy">http://www.oakknoll.com/Loy</a><br>
    </p><div class="imageWrap"><img src="/files/loyCover_4912.jpg"></div><br>
    That cover photo of Gustav Schroeder cutting punches at his home in Mill Valley, California is the oldest known photo of a punch-cutter.<p></p>
