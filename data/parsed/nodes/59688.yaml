      <p>I had to deactivate the font SimSun in the folder /Library/Fonts/Microsoft; it was causing a name clash with Songti. Now I have that Word embeds all four Songti SC fonts, all three Kaiti SC fonts, using their English names, as well as STSong, STKaiti and STFangsong, but I had to use the Chinese name to get them. On the left is the name chosen in the fonts menu, on the right the Chinese (PRC) fullname written in that font, and the translation when the English name was giving problem</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ChineseFonts20130710_4526.png"></div><p></p>
      <p>That is a grab of the pdf produced by Word 2011 for Macintosh. Here are the last three names for those that may need them for a copy-paste.</p>
      <p>&nbsp;&nbsp; 华文宋体&nbsp;&nbsp;  (STSong)<br>
      &nbsp;&nbsp; 华文仿宋&nbsp;&nbsp;  (STFangsong)<br>
      &nbsp;&nbsp; 华文楷体&nbsp;&nbsp;  (STKaiti)</p>
