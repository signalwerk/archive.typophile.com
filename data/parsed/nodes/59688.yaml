    html: |-
      <p>And, given the Opentype <a href="http://www.microsoft.com/typography/OTSpec/os2.htm#fst" rel="nofollow"><strong>fsType</strong></a> spec, the value<br>
      <code><br>
          &lt;fsType value="00000000 00000010"/&gt;<br>
      </code><br>
      returned by <code>ttx -t 'OS/2'</code> on STHeiti says indeed unequivocally (since the only bit to be 1 is bit one)</p>
      <dl>
      <dt>bit 1 (mask 0x0002)</dt>
      <dd>
      Restricted License embedding:<br>
      Fonts that have <strong>only</strong> this bit set <strong>must not be modified, embedded or exchanged in any manner</strong> without first obtaining permission of the legal owner.<br>
      <em>Caution</em>: For Restricted License embedding to take effect, it must be the only level of embedding selected.<br>
      </dd>
      </dl>
      <p>Thanks,</p>
      <p>Michel</p>
