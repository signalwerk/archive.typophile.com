      <p>Thank you both for taking time to respond. </p>
      <p>I work on a Macintosh, and so does the designer who has the font issue. I don't know if she's running Tiger or Leopard, we're a few hundred miles apart, and I don't generally do house calls.</p>
      <p>That might work Michel. I opened AdobeHeitiStd-Regular.otf  and Apple's STHeiti.ttf in FontLab, and although I see Adobe's version has a somewhat smaller glyph count, it has "Editing of the document allowed" which should allow it to be saved into the PDF. Bravo.</p>
      <p>One would think that Weng. The font software is licensed to Apple and supplied with the System install disk,  I can open it in FontLab and see that it's from Changzhou SinoType Technology Co., Ltd. and that "Embedding of this font is not allowed." That is where our problem resides. I think substituting AdobeHeitiStd might resolve the issue, IF all the glyphs used are present. If memory serves, when we were using MacOS 9, there was also a "simplified" version of the supplied Chinese font that had a reduced glyph set.</p>
      <p>Makes design more complicated when you're not fluent in the language.</p>
      <p>Thanks again, I'm going to try a font substitution and see if the line endings change.</p>
      <p>Bill Lomax</p>
