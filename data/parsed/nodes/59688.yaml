      <p>As the person at Adobe who built AdobeHeitiStd-Regular.otf, I can tell you with much confidence that its design is the same as STHeiti.ttf. Substituting the fonts as you did was the right solution. The OS/2.type value of STHeiti.ttf is set to 2, which explicitly denies embedding. The value in AdobeHeitiStd-Regular.otf is set to 8, which allows embedding.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
