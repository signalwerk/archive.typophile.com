      <p>All that being said about the possible reasons InDesign does not embed the fonts, Microsofts' own Word 2011 embeds them all without problem (except that I had to enter 华文仿宋 to select STFangsong).</p>
      <p>Correction: I see that I have to enter 华文楷体 to get the Chinese characters in ST Kaiti. Putting the English name to select the font does not give access to the Chinese characters in Word; the other fonts fail the same way; I have not checked if selecting something other than the English name solves the problem for those other fonts.</p>
