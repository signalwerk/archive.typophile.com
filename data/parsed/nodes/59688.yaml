      <p>Even if  FontBook says Kaiti is embeddable, the font file itself contains  <a href="http://www.microsoft.com/typography/otspec/os2.htm#fst" rel="nofollow">fsType equal to <code>0x0002</code></a> which means, according to the specification on the Microsoft site</p>
      <blockquote><p>
      Restricted License embedding:<br>
      Fonts that have <strong>only</strong> this bit set <strong>must not be modified, embedded or exchanged in any manner</strong> without first obtaining permission of the legal owner.
      </p></blockquote>
      <p>The hex value <code>0002</code> means exactly that bit 1 and only bit 1 is set. InDesign complies with what is written (without asking if you got permission).</p>
      <p>Added: To answer completely your question, I should have added that the fsType of ST Heiti is not the same as that of ST Kaiti.</p>
