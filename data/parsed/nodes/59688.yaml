      <p>The problem you mention sounds strange to me. I never have any problem with embedding any chinese font into PDF from any of the Adobe software. </p>
      <p>Is your designer friend using Mac or PC? Is she using the original Adobe software? If you are using any Mac machine with original Adobe softwares you shouldn't have such problem, because logically speaking, any system font came along with Mac OS would be covered by the licensing.</p>
      <p>A lot of designers in developing countries (including those in mine) like to install Mac OS in PC and use pirated softwares. Once you do that, you would have a lot of problems.</p>
      <p>weng</p>
