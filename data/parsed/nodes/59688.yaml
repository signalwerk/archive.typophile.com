    <p>Hello Type Folk,</p>
    <p>I know someone here has a succinct answer to this question. Please lend your expertise.</p>
    <p>A designer I work with has a project that is set in multiple languages. She's using InDesign on a Macintosh, and has set all of the Chinese in the System font STHeiti. It's license does not permit the font being embedded into a PDF, which is how the job will go to press. She made some inquires, but did not make much headway in finding a substitute that could be embedded.</p>
    <p>To publish the document as a PDF requires turning the font to outline, which if you only had to do it once would be no big deal, but it hampers sending files out to the end client and translators for corrections. And it jumps the file size.</p>
    <p>Does anyone know of a similar font that can be purchased in the US, preferably over the Internet at an English language website? Or is this a fact-of-life with double-bit Chinese fonts that we're just going to have to live with?</p>
    <p>Bill Lomax</p>
