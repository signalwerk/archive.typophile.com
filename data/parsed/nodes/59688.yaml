    html: |-
      <p>Michel asked: <cite>If Acrobat Professional or Acrobat Reader use AdobeHeitiStd-Regular to display pdf files for which STHeiti has not been embedded (that’s what I deduce from the fact that Adobe Reader installed that font in its Contents/MacOS/Resource/CIDFont resource folder when I tried to view the pdf file for which STHeiti had not been embedded), why would InDesign not propose users that same substitution when exporting? Why are the resources available to Acrobat not available to InDesign? That would have saved time to Bill since he eventually did exactly that substitution. Of course, I would never propose that InDesign do a substitution without asking the user.</cite></p>
      <p>I think you're making a few tacit assumptions, and missing some information.</p>
      <p>If Acrobat/Reader needs a Japanese or Chinese font for substitution, and you don't have the East Asian language support for Reader installed, it will offer to download it. Acrobat/Reader uses Adobe Heiti to substitute for just about *any* Chinese font not embedded in the PDF. The fact that in your case it *happened* to be another version of Heiti was just a happy coincidence.</p>
      <p>Not knowing that it's a similar font, there's no particular reason that InDesign would choose to substitute it on export. And for that matter, why embed the generic substitution font, when anybody viewing that document will get that font anyway? It would be like embedding Adobe Sans in a PDF.</p>
      <p>Regards,</p>
      <p>T</p>
