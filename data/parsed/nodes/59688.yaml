      <p><cite>The OS/2.type value of STHeiti.ttf is set to 2, which explicitly denies embedding.</cite></p>
      <p>Ken</p>
      <p>If I run the Mac Fonttools command <code>ftxdumperfuser -A d -t 'OS/2'</code> on STHeiti, I get in the resulting <code>&lt;filename&gt;.OS_2.xml</code> the following<br>
      <code><br>
      &lt;!--&nbsp;Microsoft&nbsp;version&nbsp;1&nbsp;'OS/2'&nbsp;data&nbsp;--&gt;<br>
      &lt;OS_2Table&nbsp;version="1"&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;xAvgCharWidth&nbsp;value="481"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;usWeightClass&nbsp;value="Normal"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;usWidthClass&nbsp;value="Medium"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;fsType&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;bit0_Reserved&nbsp;value="FALSE"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;bit1_RestrictedLicense&nbsp;value="TRUE"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;bit2_PreviewAndPrint&nbsp;value="FALSE"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;bit3_Editable&nbsp;value="FALSE"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;bit8_NoSubsetting&nbsp;value="FALSE"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;bit9_BitmapEmbedOnly&nbsp;value="FALSE"&nbsp;/&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;/fsType&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;subscript&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;ySubscriptXSize&nbsp;value="100"&nbsp;/&gt;<br>
      ...<br>
      </code></p>
      <p>I am curious; what does NoSubsetting value="FALSE" mean?</p>
      <p>Michel</p>
