    html: "<p>I used to think I had to get the software to automate vertical alignment for me in any circumstance, but in my experience of producing traditional books the effort hasn't been worth it. When first using ID I wrestled with baseline grids and I would get caught out by unexpected effects, often to a frustrating degree; it seemed, to me at least, more trouble than it was worth, or perhaps I was missing something fundamental. Anyway life was too short: Now I simply decide carefully on a body text line pitch, and ensure that any other settings, whether display, quotes, tables, pictures, captions, whatever, always use a multiple of that pitch in their overall height (not their line pitch necessarily), which is not hard to achieve using a combination of type size, leading, space above/below, baseline shift. It's fairly easy to make the body text pick up where it left off, and so align in spreads and back up properly, without making everything else look as if you just hit the return key between lines. For traditional books this is easy enough to set up and adhere to. And when the content is finalised I will often just 'nudge' the text into alignment if I have to, eg under a rogue graphic, where this does not visibly alter the overall consistency of the vertical spacing. When it's printed, who cares how it was achieved? My objective is a printed book, not mastery of the technology if that proves distracting.</p>"
