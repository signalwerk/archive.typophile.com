    votes: null
    html: "<p>It's more or less the same stubby character as Ed Gothic. I should stress that the quotation mark will be a standalone graphic. The actual quotation text will be set in a web font, likely Georgia. The quotation mark should really just look like what an average user would expect it to look like: a big ball with a curl coming out of it, tapering to a point ... and then a twin next to it.</p>"
