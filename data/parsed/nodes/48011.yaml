    <p>I'm looking for a quotation mark that works as a display-size graphic and pairs well with Ed Roman and Ed Gothic:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/getimage[1]_5888.php_id=830"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/getimage[1]_3518.php_id=829"></div><p></p>
    <p>I've made Ed Roman warmer and heavier with an outline stroke (not shown). And don't worry about the quotation marks being "fun," I can just shift one glyph higher than the other to make it fit in.</p>
    <p>Unfortunately, the quotes on these fonts don't quite work for me, nor does anything I currently have installed. The best I could come up with, oddly, was Stencil, the "it came with the computer" font. Here's Ed Gothic, Ed Roman and Stencil:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/quotes_4351.png"></div><p></p>
    <p>Gothic's to stubby, Roman's too wiry, and Stencil has about the right proportion, but the tail (finial? hangy-down? hangy-up?) should probably come to a point, or near-point. Here they are, more "fun":</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/funquotes_5194.png"></div><p></p>
    <p>Any suggestions?</p>
