    <p>Hi everyone!</p>
    <p>I'm currently working on some type design for a flag for my thesis show. Both the sans and serif are bespoke. The high contrast serif was very loosely based on Times New Roman and infused with the Didone theme. While comments on any of the characters would be greatly appreciated, I am struggling with the numeral nine. Can it deviate from the vertical axis, reflecting Times? Or, should it conform to the vertical axis? (Both nines are preliminary as well as the metrics.)</p>
    <p>Thanks so much!<br>
    Will</p>
