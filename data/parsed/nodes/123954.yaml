      <p>Thanks synaes,</p>
      <p>I was initially attracted to the nine on the diagonal axis and was trying to make it work, but you're right, the vertical nine is most suitable. I tweaked its overall form, focusing on the right stem and the bottom curve and bulb. I also thickened the join in the center (I'm not sure if this works).</p>
