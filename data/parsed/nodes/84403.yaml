  html: |-
    <p>As <a class="freelinking external" href="http://www.radimpesko.com/fonts/mitim" rel="nofollow">Mitim</a> is unavailable commercially, I’m looking for suggestions of similar typefaces.</p>
    <p>I’ve been looking at the angular serifs of <a class="freelinking external" href="http://new.myfonts.com/fonts/paratype/etienne" rel="nofollow">Etienne</a> by Tagir Safayev, but it’s the  pointed tail of the uppercase ‘R’, and some other glyphs, in Mitim that has me sold on something closer to Peško’s typeface.</p>
    <p>Some suggestions would be greatly appreciated!</p>
    <p>C</p>
