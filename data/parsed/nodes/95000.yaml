    <p>ISIA Urbino Type Design Week 2012 is approaching. With Erik van Blokland, Jonathan Pierini and Albert Pinggera as visiting lecturer. Opening on Sunday July 29 to August 3. There are still same places availabe and we are looking foward to welcome you in the beautiful Urbino, in Italy. Have a look at the official web page and get in touch!</p>
