    <p>Here is a PDF of a design I have made.  <br>My objective is to complete a full set of motions  <br>from design to submission and hopefully distribution  <br>in the pursuit of gaining experience in doing so -  <br>dealing with foundrys, prepping the file etc.  <br> <br>I am hoping to be fully prepared when I am <br>finished with more serious designs. I want to <br>have this experience under my belt when the <br>time has come. <br> <br>If no one likes it, I'll sell it on Myfonts.com.  <br>Yet another experience to be learned. <br> <br>I am not as interested in a critique of the  <br>design so much as what I should or should  <br>not be doing in my presentation. ( I think  <br>someday I will regret having designed this.)  <br>But some comments are welcome if you really  <br>think it should be said. <br> <br>In my email, to the place that I will be  <br>submitting it to, I will include my inspiration for  <br>the design, through contact info and... <br> <br>what else? What should I leave out? <br> <br>WHERE SHOULD I SEND IT? <br> <br>-smc <br> <br></p>
