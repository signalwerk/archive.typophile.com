    html: <p>Stephen, <br> <br>It is called Mofle. It means Muffler in Spanish. <br>Thus, Mofle Loose, Mofle Expanded,  <br>Mofle Dropped. <br> <br>It is inspired by the hand painted lettering on  <br>the Muffler and Hub shops in the Barrios  <br>around town. There are lots of low-riders  <br>around. I drive a 66' Chevel myself. <br> <br>And yes, The difference between regular and  <br>expanded is spacing. I should get rid of  <br>regular maybe. The letters need space being  <br>all caps any way. My thinking was the wide  <br>family would make it  more marketable. That,  <br>along with the shadow and extended  <br>character set such as fractions I  <br>am hoping will make it more appealing  <br>compared to similar designs. <br> <br>The text by the way is a complete joke. <br>Typeheads will know that right? <br> <br>-smc  <br></p>
