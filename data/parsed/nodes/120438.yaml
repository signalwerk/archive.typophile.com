    html: '<p>Hand-drawn to me definitely as the /S are completely different some kind of naive prehistoric version of Futura. Ready-to-go alternative: <a class="freelinking external" href="http://www.myfonts.com/fonts/nonpareille/battling" rel="nofollow">Battling</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/diamonds" rel="nofollow">Diamonds</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/m-b-creative/mb-vinatage" rel="nofollow">Vinatage</a></p>'
