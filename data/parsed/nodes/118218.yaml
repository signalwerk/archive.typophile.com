      <p>Thanks Martin,<br>
      As ever, typefaces seem to bring out some quite strong opinions (which is a good thing). They are very emotional creations after all. This is a matter of opinion of course, but I personally like to believe that a typeface that was designed in the 1920's can still be thought of being modern in it's personality.<br>
      Futura to me will always look modern and a bit confrontational. It is quite brutal as the author says!<br>
      Some book cover designs are still seen as modern and contemporary even though they were designed many years ago. I guess this is the same for most things really.<br>
      I am of course interested in what you believe is a suitable typeface for a book on a book about meditation?<br>
      If you look on amazon you will see designers in the past have pretty much chosen every type of typeface out there. I do want to keep it sans-serif (though maybe a slab serif could work) as I think this suits the vector illustrations that are going to be used on the cover. I just dropped Meta onto the cover and this font to me just has too much character. I need something fairly plain (less difference in stroke widths) etc as boring as that possibly sounds.<br>
      Fonts that could maybe work to my mind are: Gotham, GilanGothic, or Myriad. Also just tried Kievit and that looks pretty good in fact.</p>
