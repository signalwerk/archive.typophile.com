      <p>I wouldn't call it "ugly." But it's a highly stylized conceptual face, so like all styles, it will come in and out of fashion. Personally, the proportions are distracting to my eye. You can start with the "geometric" /OCDGQ/, which all feel uncomfortably wide. Why are /EFLPST/ so narrow and /AN/ so wide?</p>
      <p>Just what on Earth is going on with just-barely-broken /K/? The pointy vertices on /AMNVWX/ stick out in more ways than one. And the /S/ commits multiple offenses in my book.</p>
      <p>Without seeing your design, it's hard to recommend anything. Avenir was designed as a riff and "improvement" on Futura, but it has exploded in popularity in the past two years thanks to Apple, so it may be temporarily played out. Maybe give LL Circular a try?</p>
