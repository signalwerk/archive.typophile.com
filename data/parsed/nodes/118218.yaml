    <p>I have been designing a book jacket for a book on Meditation. So I opted for what I thought would be a clean crisp san-serif font with good legibility. We weren't looking for anything that would be too unique/new so I opted for one of my favorite classic typefaces.<br>
    That being Futura (bold set in lowercase).</p>
    <p>The author came back with the following description:<br>
    The font is brutal and rather ugly.</p>
    <p>If there is one description of a font which didn't seem to tally with my own personnel opinion it this is it.<br>
    He wants something crisp and modern but softer!<br>
    It remains to be seen if what he means is something like Vag rounded.....</p>
    <p>Anyway so let's have it. Who out there can't stand Futura either?<br>
    And what is a much better sans serif.</p>
    <p>Love to hear peoples views....</p>
