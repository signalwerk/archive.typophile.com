      <p><cite>I hope I didn't provoke into a very long answer (suspect so).</cite><br>
      No, I just tend to get carried away when I'm passionate about something. I do it even when I'm not actually talking to anyone.</p>
      <p><cite>Well at least I think the font used is a variant of Avant Garde.</cite><br>
      Okay, those books look quite attractive. I guess I will have to elaborate on my opinion of ITC Avant Garde. I absolutely hate capital ligatures. I consider this to be the devil:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/42189_4391.big_.png"></div><p></p>
      <p>Just like Futura, ITC Avant Garde has some odd proportions, which lend itself well for display use such as on the Penguin Modern Classics. I think it works for a book series because it's general branding, rather than branding of a specific book. For branding a specific book the typeface you use should be a lot more telling about the content of the book. I have to say though that I still feel ITC Avant Garde is used in a bad way for the Penguin book series. The spacing is very tight but I can see the appeal here, but some characters are kerned way too tightly. Kerning Tr and Te this tightly is not something typographers tend to do nowadays. It's very obtrusive to me. The kerning in "Ayn [Rand]" is absolutely horrendous. I also feel the /t is so condensed it almost disappears. The /s is also very condensed (as is Futura's /s) but it still has some presence. Also have a look at the Jean-Paul Sartre cover and notice how "Jean-Paul" is not optically aligned due to the gap on the left side of J. Usually you don't get that issue when the spacing is looser because you compensate for big gaps in between letters such as A, J, L, V, W and Y. With very tight spacing you get all kinds of problems. The capital letter ligatures have been added to compensate for some of those spacing problems.</p>
