      <p><cite>This is a matter of opinion of course, but I personally like to believe that a typeface that was designed in the 1920's can still be thought of being modern in it's personality.</cite></p>
      <p>Yes, they still have their place, but don't confuse modernism with contemporary faces. Examples of typefaces I would truly consider modern in the contemporary sense are Beau Sans, Beleza, Exo 2.0, Hackman, Klaus FY, Proxima Nova, Riccia, Telcel, Zarina Sans etc.; not dusty old typefaces like Erbar, Futura, Kabel, or the newer but god-awful Avant Garde.</p>
      <p>What we consider to be modern is minimalism and spaciousness. As such, Futura is often seen as modern as it's clearly minimal. I think the mistake people make here is that there is a great distinction between a clean, neutral typeface and what was considered modern in the early 20th century, which were constructed typefaces rather than designed typefaces. Typefaces in the Bauhaus style are not considered to be modern because construction is regarded higher than optical design while contemporary modernism is all about clarity. Many of these early geometric typefaces have more to do with construction than design. I don't consider it a good practice to equate Futura with contemporary modernism.</p>
      <p><cite>So I opted for what I thought would be a clean crisp san-serif font with good legibility.</cite></p>
      <p>I would consider Futura to be minimal; clean and crisp a bit less so. Whether Futura has good legibility I do question though. Also, the dimensions of Futura are just not modern to me in the contemporary sense. The x-height is too low, the ascenders too tall, the bowls of P/R too high and small, many of the capitals are too condensed, there are too many abrupt horizontal/vertical cuts in the terminals, the /t has no terminal (which looks very Bauhaus to me), the capital /J has a descender and M/N are reminiscent of glyphic Roman lettering.</p>
      <p><cite>Some book cover designs are still seen as modern and contemporary even though they were designed many years ago.</cite></p>
      <p>You're absolutely right, but I would be careful with what typefaces you select for the job anyway. Thinking Futura is modern may lead to problems. It's true that by using Futura in a modern way, people get the impression it's true modernism but I think you confuse the whole style that way. For example, ITC Avant Garde has been considered a modern typeface up to 2000 or so, but I cringe every time I see it as it takes me back to the 90's. The very tight spacing is also an example of this outdated sense of modernism. While Futura still works, I don't think ITC Avant Garde should ever be used again.</p>
      <p><cite>I am of course interested in what you believe is a suitable typeface for a book on a book about meditation?</cite></p>
      <p>I'm pretty good at offering criticism but I must admit I'm not a great typographer. I'm not even sure which style would fit a book about meditation exactly. Perhaps something very clean would work but it depends on many things. What aspect of meditation is talked about, is it a scientific interpretation of meditation and its effect on human psychology or is it a guidebook or speculative new-age stuff? What kind of art or design are you using and what colors? What's the layout like and which typefaces are you using in combination?</p>
      <p>You don't have to answer these questions to me because as I said I'm not a great typographer so I probably wouldn't make a great choice. However, I can offer you the names of typefaces from specific styles. If you're still looking for something clean and crisp, I might consider Benton Sans, Libertad, Museo Sans, Proxima Nova, Samo Sans or Variable. If you want something modern (yet arguably less crisp) you might consider Adelle Sans, Centro Sans, Geometrica, Scala Sans or Urban Grotesk. If you want something more vivid you might try Andulka Sans, Auto, Foco Corp, Gentona, Gloriola, Karmina Sans, Oksana Sans, Oksana Text, Quire Sans, Sensato or Sentosa. I personally think you may find something suitable in the last bunch I named. Search for modern humanist typefaces. I think you might need a typeface that is clean and modern yet vivid and friendly. But again, I don't know what exactly you want to convey with the design of the book, so you might need something else entirely. I can imagine certain serif typefaces working well for this job as well.</p>
      <p>Gotham is probably a better choice than Futura when it comes to its design, but it's probably too prolific. I always try to find alternatives to typefaces which are overused when it comes to commercial projects. I do use Gotham for school presentations at times because it's very clear, but I'm more hesitant about using it when it comes to branding or book design.</p>
