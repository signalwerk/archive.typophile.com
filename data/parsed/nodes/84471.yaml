  html: |-
    <p>After releasing <a href="https://www.fontfont.com/fonts/zwo" rel="nofollow">FF Zwo</a> in 2002, Hamburg-based designer <a href="https://www.fontfont.com/designers/jörg-hemker" rel="nofollow">Jörg Hemker</a> now released his second FontFont: <a href="https://www.fontfont.com/fonts/sero" rel="nofollow">FF Sero</a>.</p>
    <p><a href="https://www.fontfont.com/fonts/sero" rel="nofollow"></a></p><div class="imageWrap"><a href="https://www.fontfont.com/fonts/sero" rel="nofollow"><img src="http://typophile.com/files/ff_Sero_1_590_5545.png"></a></div><p></p>
    <p>The versatile typeface combines the striking forms of an American grotesque with the legibility of a humanist sans serif typeface. It has open contours, a distinct x-height and a homogeneous grayscale value. During seven years of development the classic letter forms have matured into a balanced, sovereign typeface. Eight harmonized weights and an extensive character set allow for a flexible and versatile typography. Cyrillic and Greek characters provide an extended language support. According to Typographica’s <a href="https://twitter.com/#!/typographica/status/93802466306564096" rel="nofollow">Stephen Coles</a>, ‘FF Sero is a workhorse gothic like Trade or News Gothic with Germanic sensibility’. </p>
    <p>For a limited time, <a href="https://www.fontfont.com/free" rel="nofollow">FF Sero Medium is available for free download in OpenType, Office and Web formats</a>.</p>
