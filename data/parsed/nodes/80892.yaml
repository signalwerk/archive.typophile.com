    html: <p>I always tell people that the difference between good typography and good fonts is the difference between work that looks professional and work that looks like someone's secretary threw it together in MS Word. One reason Apple's stores looks so good is the careful and consistent application of Myriad. But Kmart's careless mashup of Helvetica, Gill, News Gothic, and Gotham looks like, well, Kmart.</p>
