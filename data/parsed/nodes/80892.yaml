    html: |-
      <p>I'm in my early days of freelance working and I always rely on a strong and solid typographic basis for my works, this is why most of the time they are rejected by clients who prefer something fancy and colourful. And my clients are instutions, e.g. Italian Minister for Equal Opportunities, A.C.I. (Azione Cattolica Italiana, a catholic-related organisation).<br>
      There's a general urge for something that shouts the communication as louder as possible, confusing accessibility and clarity with mere visual pollution.<br>
      And I'm also noticing this is deeply related with the client's culture and cultural target.<br>
      I think a fine client will give me the time to explain why a solid typography is important. And he will eventually understand it (or he'd maybe understand me without explaining it all).</p>
