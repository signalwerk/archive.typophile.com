      <p>I can offer a story that might be colorful enough to possibly be worth including in your article - it involves a client waffling on the purchase of fonts. It was 1992 and I was among a rare breed of designer who had been successfully producing non-Latin fonts for the only low-cost video titling platform back then, the Amiga computer. One of my almost-clients was the main Iranian television channel in Los Angeles; they had been negotiating with me for my set of Arabic/Farsi video fonts for months. In November of that year I decided to move to Barcelona, so I called up Bahram and said "You might want to buy the fonts now, since I don't know if/when I'm coming back..." (which was actually true). In two days he came up with the $2000 cash; this was after all before the Internet age. In fact along with some other clients in the same position, he helped finance my 6-month stay in Spain! But then I ended up back in LA, to see my work on TV at any time of day* but also to realize that it was becoming more difficult to sell *quality* to clients, since many more people -some of them living in countries which much lower costs of living- were starting to make fonts...</p>
      <p>* <a href="http://themicrofoundry.com/s_multimedia.html" title="http://themicrofoundry.com/s_multimedia.html">http://themicrofoundry.com/s_multimedia.html</a></p>
      <p>hhp</p>
