    <p>I am working on an article about how to explain to clients why fonts and typography matter.</p>
    <p>I have amassed a good array of facts, arguments and analogies over the years (though I always welcome more). What I’m really looking for are some good anecdotes about clients questioning the value of typography and fonts, and the dialogue you had with them. Is this a frequent or perennial problem for you?</p>
    <p>To be quoted in the article it would be helpful for me to have your real name, and where you are based.</p>
    <p>Regards,</p>
    <p>T</p>
