    html: <p>With graphic design clients, good explanations are obviously a plus, but as a practical matter I think it's more a factor of 1) picking the right clients (companies with reasonable budgets and who realize the importance of good design), and 2) developing a good professional relationship with them so they trust your recommendations.</p>
