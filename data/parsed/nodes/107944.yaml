    html: |-
      <p>Knowing Qantas, this is likely to be a custom font. It is a very close match for <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/alternate-gothic-lt/" rel="nofollow">Alternate Gothic No. 3</a> in terms of character shapes, widths etc. — though Alternate Gothic is quite heavy and doesn't have the straight tail on the /Q/.</p>
      <p>Qantas have rebranded recently. You may be interested in seeing their current corporate style book, <a class="freelinking external" href="http://www.qantas.com.au/guidelines/resources/Qantas_Masterbrand_Guidelines_June_2013.pdf" rel="nofollow">available here</a>.</p>
