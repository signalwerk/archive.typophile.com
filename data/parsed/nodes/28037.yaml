      <p>The Zapf film that Hallmark made in the 1960s is still property of Hallmark. They hold the copyright to it, and handle its distribution, since it is their property. Linotype has a license to bundle the film on the Zapfino Extra CD. So, if you license Zapfino Extra, and order it via CD instead on download, you get this great film. But Linotype cannot distribute the film through other means; neither can anyone else that I know of, except Hallmark.</p>
