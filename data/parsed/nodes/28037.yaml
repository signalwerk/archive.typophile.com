    <p>I have some typophile-oriented wonders I would like to share.<br>
    So I wonder why:</p>
    <p>- Some fine books are out of print for so many years (e.g. “The form of the book” by Tschichold).</p>
    <p>- Some limited editions books have no ’cheaper version’, so that a non-millionaire could still buy them (e.g. “Pen and Graver” by Zapf). Should we start scanning? I was happy to find the scanned version of Zapf’s Manuale Typographicum at <a href="https://web.archive.org/web/20080513122707/http://www.typogabor.com/manuale-hermann-zapf/index.html" title="http://www.typogabor.com/manuale-hermann-zapf/index.html">http://www.typogabor.com/manuale-hermann-zapf/index.html</a> </p>
    <p>- Some nice videos (like Zapf’s tutorial on Calligraphy for Hallmark Cards) are so hard to find. I think videos by great type designers would be really helpful although type design is not so momentary to be captured on film. TypeCulture has a nice sample of such movies at <a href="https://web.archive.org/web/20080513122707/http://www.typeculture.com/academic_resource/movies/" title="http://www.typeculture.com/academic_resource/movies/">http://www.typeculture.com/academic_resource/movies/</a></p>
    <p>- Most great books by Verlag Hermann Schmidt Mainz are not translated in English. Of course the german market is big but from what I can tell those books would be a great addition to non German speakers.</p>
