      <p>Hi Nikita. For a classy elegant layout, keep it simple. I mean really simple, and clean. Reduce the number of elements (pics, blocks of text etc) to as few as the content will allow, and banish of all traces of clutter. Use "classy" or classical type, or if the client must have serifless things go for a sans with classical underpinnings. Keep the stylings classical. That means horizontal lines and an emphasis on horizontal division of space. Type on its side, perpendicular to the horizontal axis, will not get you or your client upstairs at the Savoy. Chuck Groth is right about the postage stamps. Get rid of them. Also use color in a restrained manner. A tiny dab, in only a few isolated places, is all you need. Make the monochrome images monochrome with just a hint of warmth rather than the overt red colorization. Dotted lines are a passé, a woeful leftover from the early 2000's.</p>
      <p>If you want classy and elegant, be classical. One of the simplest ways of doing that is to resist the temptation to mix italics in with roman. Make it all one or the other. Be a purist.</p>
      <p>j a m e s</p>
