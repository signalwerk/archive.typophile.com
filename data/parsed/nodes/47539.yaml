      <p>they might also be looking for a layout with a more clear focus, and fewer 'postage stamps.'<br>
      the spreads above are pretty boxy, with no 'come hither' quality... you might try pulling one iconic image, playing it a lot larger, and letting the smaller images reinforce and augment.<br>
      i would also suggest a clear headline or tag to draw the reader in... that's how i often read "elegant" from a client.</p>
