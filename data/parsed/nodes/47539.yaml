    <p>I am working on a project for a non-profit music organization. It's a brochure/calendar of their events for the 2008/2009 season. The last version of this project (which I also designed) was very clean, simple, structured, etc. (4panel, french fold, 11x17in.)<br>
    See example below.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cgsbrochure_3946.JPG"></div><p></p>
    <p>After my recent meeting w/ the client, he mentioned they'd like a different aesthetic this year. Something more sophisticated, classy &amp; elegant. Now, that's not typically my 'design style', but it's something that's lacking in my portfolio. Most of my work is very bold and in a way, heavy. Nothing elegant about it! :P </p>
    <p>My client asked me to forward him some electronic examples of elegant/sophisticated/classy layout &amp; typography. I've done my research and have look at TDC, SPD, and some other type books and real-life examples. What I was wondering if you guys have any good online galleries &amp; other links that you could post. I'm not asking you do my research for me, as I am conducting research on my own already. I just need something online that I can send to my client.</p>
    <p>Thanks Typophiles!</p>
