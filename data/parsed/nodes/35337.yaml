    html: |-
      <p>Tim: I see exactly what you mean... I noticed something with those characters, thanks for pinpointing what it was.</p>
      <p>Sebastian: all of your first glance comments are correct; I think I just took too little time in reforming some of the letters. I slashed the zero because I always do that in my handwriting, this will probably be more for personal use: it's just my learning experience. Same with the hy ligature, the characters didn't fit together so I just lazily made one that ran together, which allowed me a chance to try to code some ligatures (tricky, but I'm figuring it out, I think). I do not plan, as I start laying out my first real font, to use any ligatures other than those normally used, fi, ff, ffl, etc.</p>
      <p>microspective: the capital O is an issue, not only in this font, but in my actual handwriting. They've always lacked character. Hopefully, this is something I can work on before coming back to this font later.</p>
      <p>Thanks for your comments, guys, I'll be checking the thread for any further comments so if anyone else has input, please do share!</p>
