      <p>This looks quite well to me already.</p>
      <p>Some things I see at first glance:<br>
      "3" ist a bit strange, "k" in the same way. They need corners. See the "w" (which needs more weight)<br>
      "5" too (it's hanging to the left too much)<br>
      "t" should look upwards, Tim is right<br>
      "p" needs some more energy<br>
      "d" is very narrow (compare to "a", but don't imitate it)<br>
      punctuation seems to be too small, give it the appropriate size.<br>
      "slashed 0": make it an option via opentype</p>
      <p>If everything is more mature and balanced (this will take you a while, don't be too hasty), you will need ligatures and maybe alternate versions of the letters for word beginnings and endings. This will give the font even more life. Don't start with this too early, the basic character set has to be almost perfect before you start, or you will generate a lot of unnecessary additional work.</p>
