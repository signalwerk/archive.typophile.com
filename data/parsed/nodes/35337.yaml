    html: |-
      <p>I just saw your "hy"-ligature:</p>
      <p>If creating them, always consider whether this would be a possible natural form when handwriting. I can't think of a common writhing method that creates something like this "hy".</p>
      <p>See this picture:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/liga_5585.gif"></div><p></p>
      <p>left you can see the stroke numbers how "h" and "y" are usually written.<br>
      There is no possibility how (4) could be written as extension of (2), it would not be natural (even if it looks good) as the direction of the strokes are the opposite direction and they are not drawn in order.<br>
      Drawing it like on the right side (red), this would mean to start the "y" from the wrong side. This does not feel natural at all.</p>
      <p>"Real" ligatures would for example be:<br>
      ff, tt  --&gt;  common bar<br>
      er, em, en  --&gt;  the ending of the "e" easily connects to the beginning of r, m or n, it's a natural movement. Don't smoothly connect "es", even if it just seems to be perfect: "s" is not written from bottom to top, but if connecting the "s" with the bottom of the "e", the natural movement would suggest this direction.<br>
      ti --&gt; the crossbar of the t leads to the beginning of the next letter</p>
      <p>There are many opportunities for ligatures in script fonts, just look what happens when you write these combinations quickly and follow that hint. Don't invent "new" ones.</p>
