      <p>I find that your capital O is a little D-like. I read "Oedipal" as "Dedipal" until I zoomed in considerably. However, your handwriting is your handwriting (Gertrude Stein, anyone?), and I respect that if that's how you make your O. Just consider that (hopefully) others will be using this font, so uninterrupted readability is paramount.</p>
      <p>Congratulations! Having made a couple of my own, including my own handwriting, I know how time-consuming this is. Nice work!</p>
      <p>Good luck,<br>
      Ray</p>
