  html: |-
    <p>what tools do you use to test typefaces, combinations, and colours on the web.</p>
    <p>for example, there's the typecast tool <a href="http://typecast.com/" title="http://typecast.com/">http://typecast.com/</a>. which i don't like because it only shows the name of the typeface when doing selections. i find it hard to make judgements with only small samples.</p>
    <p>so what i currently use is Adobe Edge Animate <a href="http://html.adobe.com/edge/animate/" title="http://html.adobe.com/edge/animate/">http://html.adobe.com/edge/animate/</a>. it's meant for html/css animation, but it allows for the quick use of web fonts and their preview.</p>
