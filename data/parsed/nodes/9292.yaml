    date_raw: 15 Feb 2003 — 3:18am
    votes: null
    html: <p>Recently Jonathan Barnbrook designed the cover of the last David Bowie Album, Heaten, using two custom typefaces of his own creation. One of them, Priori, is to be released soon by Emigre. <br>The use of photography is fantastic, also, and everything is so beautifully tied with the album themes. <br> <br>Anyway, the biggest examples are Vaughan Oliver and V23 as mentioned (see examples in Typography Now also, and don't forget The Pixies' covers), Neville Brody (for Cabaret Voltaire and many others; samples on the Graphic Language of Neville Brody book by Jon Wozencroft), Gareth Hague and David James (even the Alias typeface Metsys is loosely based on the System 7 band logo), Me Company and the Designers Republic (fantastic covers for The Orb, and above all The Shamen; Matt Perkins even did a typographical remix of The Shamen's original logo, in the form of  a mind-numbing typeface which you can download at the Typography in Decay webpage). <br>I'm sure I forgot a lot of others.</p>
    html_clean: <p>Recently Jonathan Barnbrook designed the cover of the last David Bowie Album, Heaten, using two custom typefaces of his own creation. One of them, Priori, is to be released soon by Emigre. <br>The use of photography is fantastic, also, and everything is so beautifully tied with the album themes. <br> <br>Anyway, the biggest examples are Vaughan Oliver and V23 as mentioned (see examples in Typography Now also, and don't forget The Pixies' covers), Neville Brody (for Cabaret Voltaire and many others; samples on the Graphic Language of Neville Brody book by Jon Wozencroft), Gareth Hague and David James (even the Alias typeface Metsys is loosely based on the System 7 band logo), Me Company and the Designers Republic (fantastic covers for The Orb, and above all The Shamen; Matt Perkins even did a typographical remix of The Shamen's original logo, in the form of  a mind-numbing typeface which you can download at the Typography in Decay webpage). <br>I'm sure I forgot a lot of others.</p>
