    html: "<p>Hi Ramiro, <br> <br>If you have the resources and opportunity, definitely check out the Koninklijke Academie van Beeldende Kunstern (Royal Academy of Visual[or Fine?] Arts) in the Hague, the Netherlands. The URL is  <br> <br><a href=\"http://www.kabk.nl/\" target=\"_top\">http://www.kabk.nl/</a> <br> <br>This is the #1 place I wish I had the time, resources and qualifications to study at. Reading and Leipzig are tied for second, though if I found a place in Austria or Switzerland, they might take over second. <br> <br>Otherwise, I don't think there are any accredited full-time type design programs inside the U.S., but I would be truly delighted to be proven wrong.</p>"
