  html: |-
    <p>Sorry for the last minute posting! It turns out I will be in in town (SF) to go to a combination Calligraphy, Library &amp; Aniquarian Book Fair this Sat. The dealers atending look pretty stupendous. Typophile luminary Carl Crossgrove will be there at these events too. How about you?</p>
    <p>This is the info for the event/s:</p>
    <p>http://www.sfbookfair.com/<br>
    <a href="http://sfbay.craigslist.org/eve/268371078.html">http://sfbay.craigslist.org/eve/268371078.html</a></p>
    <p>Some times that might be relevant are: </p>
    <p>[ 1pm-2pm ] A program dscussing Calligraphy with Georgiana Greenwood, Thomas Ingmire, and Arne Wolf titled: ‘State of the Art, State of the Craft’.</p>
    <p>[ 2:30-3:30 ] There is a reception for the Library’s display called Calligraphy in the world of books. I am not sure what conditions ( if any ) there on on going to this. You might call 415.626.7500 to ask.</p>
    <p>After these I will be gong to the bookfair itself to see what I can see. </p>
    <p> If anybody has aniquarian book advice ( or manuscipt advice ) for me lay it on me quick!</p>
