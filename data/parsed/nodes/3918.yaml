    html: <p>Save Internet Radio! <br> <br><a href="http://www.saveinternetradio.org/" target="_top"> http://www.saveinternetradio.org/</a> <br> <br></p><blockquote><hr size="0"><!---Quote-!--><b>Quote:</b><p>America's fledgling Internet radio industry could be effectively killed on May 21st if the Librarian of Congress (1) accepts the recommendations of its recent Copyright Arbitration Royalty Panel ("CARP") concerning Internet radio royalty rates and (2) sets impossibly-complex recordkeeping requirements. <br> <br>Congress passed a law in October, 1998, called the Digital Millenium Copyright Act (DMCA) which established that webcasters must royalties to record labels for the music they play. However, the CARP's recommended royalty rates are currently more than 200% of most Webcasters' gross revenues!  <br> <br>If Copyright Office accepts the CARP's recommendation, most observers believe that the decision will effectively kill Internet radio, as the retroactively-owed fees would bankrupt all but the very largest Internet-only webcasters (and would probably trigger the shutdown of most broadcast stations' Web simulcasts, including almost all the educational and community stations ). <br> <br>Read more background here or in an editorial from the San Jose Mercury News.<!---/Quote-!--></p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote> <br> <br>From what I can gather this is regarding US legislation only, however non-US listeners to US stations will certainly be affected.<p></p>
    html_clean: <p>Save Internet Radio! <br> <br><a href="http://www.saveinternetradio.org/" target="_top"> http://www.saveinternetradio.org/</a> <br> <br></p><blockquote><hr size="0"><!---Quote-!--><b>Quote:</b><p>America's fledgling Internet radio industry could be effectively killed on May 21st if the Librarian of Congress (1) accepts the recommendations of its recent Copyright Arbitration Royalty Panel ("CARP") concerning Internet radio royalty rates and (2) sets impossibly-complex recordkeeping requirements. <br> <br>Congress passed a law in October, 1998, called the Digital Millenium Copyright Act (DMCA) which established that webcasters must royalties to record labels for the music they play. However, the CARP's recommended royalty rates are currently more than 200% of most Webcasters' gross revenues!  <br> <br>If Copyright Office accepts the CARP's recommendation, most observers believe that the decision will effectively kill Internet radio, as the retroactively-owed fees would bankrupt all but the very largest Internet-only webcasters (and would probably trigger the shutdown of most broadcast stations' Web simulcasts, including almost all the educational and community stations ). <br> <br>Read more background here or in an editorial from the San Jose Mercury News.<!---/Quote-!--></p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote> <br> <br>From what I can gather this is regarding US legislation only, however non-US listeners to US stations will certainly be affected.<p></p>
