    html: <p> personally, I stay clear of streaming audio since I tend to use all available resources on my workstations. I stick to my trusty portable Sony. <br> <br>as for inspirational sounds, there are a lot in my collection that get me going, but a couple are regulars. someone already mentioned the indespensible Velvet Underground -- check out the boxed set, what a collection! but the most necessary and inspiring library for me is Cabaret Voltaire. pick any of the albums from 74 straight through to the early eighties for some wonderful noise to submerge you in your creative juices! </p>
