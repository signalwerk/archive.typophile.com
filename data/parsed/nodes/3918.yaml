    html: "<p>As well as SomaFM I listen via iTunes to FlareSound: <br><a href=\"http://www.flaresound.com/\" target=\"_top\">http://www.flaresound.com/</a> <br> <br>Here in Los Angeles we have the excellent KCRW, my favorite show on which is Metropolis, weekday evenings: <br><a href=\"http://www.kcrw.org/cgi-bin/db/kcrw.pl?show_code=mt&amp;tmplt_type=program\" target=\"_top\">http://www.kcrw.org/cgi-bin/db/kcrw.pl?show_code=mt&amp;tmplt_type=program</a> <br>but my radio reception is awful for some reason (I'm in Hollywood). Unfortunately KCRW only stream on the net using RealPlayer which is by far the worst of all the players. It invariably freezes my system within ten minutes of the start of a stream.  <br> <br>I'd listen to more classical if there were any decent net stations out there, but I haven't found anything yet that I like anough to regularly return to. BBC Radio 3 is very good, but isn't always playing music - plus it, too, only streams RealPlayer.</p>"
