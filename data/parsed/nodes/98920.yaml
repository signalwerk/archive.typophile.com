      <p>Joshua Langman: "I think even for letterpressed cards, 300 gsm is plenty thick, unless you're punching the type really hard on both sides. But thicker could work. You might even print on binder's board if you want something really thick."</p>
      <p>Hi Joshua</p>
      <p>I agree some brands of 300/350g card are very nice - and I'm personally not a big fan of the excessive impression style.</p>
      <p>But if it's only 'standard' thickness and light impression why go to the extra trouble and expense of sourcing letterpress cards? - most people wouldn't notice the difference from the cheap digital/litho cards from Vistaprint etc.</p>
      <p>We find nearly all of our letterpress enquiries are for extra thick card - and they usually settle for 540g - at this weight even without heavy impression it's pretty obvious they aren't cheap/ordinary business cards. We find that people who are proud of their profession/business want to have a card that sets them apart from the competition.</p>
      <p>Kind regards - David</p>
      <p><a href="http://www.deeplyimpressed.co.uk/" title="http://www.deeplyimpressed.co.uk/">http://www.deeplyimpressed.co.uk/</a></p>
