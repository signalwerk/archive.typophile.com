    <p>Hi everybody</p>
    <p>Just wondered what you guys think about business card thickness for LETTERPRESS / FOIL cards.</p>
    <p>Would you prefer extra thick cards, for instance Colorplan 540/700gsm - or do you think the ‘standard’ thickness of 300-400gsm as commonly supplied by all the online digital and litho printers (Vistaprint etc) is thick enough and that the “letterpress effect” (debossing/impression) is sufficient to make your card stand out from the crowd?</p>
    <p>I’d be very interested to hear your thoughts on this :)</p>
    <p>- David</p>
