      <p>A 700 gsm card isn't even a card; it's a business brick.</p>
      <p>I think even for letterpressed cards, 300 gsm is plenty thick, unless you're punching the type really hard on both sides. But thicker could work. You might even print on binder's board if you want something really thick.</p>
