      <p>I'm afraid we Americans are a bit thick when it comes to the metric system. Standard US business cards are 110# to 130# cover stock (equivalent to 300-350 gsm). For normal letterpress printing this should be sufficient. For foil stamping I might prefer the 540-700 gsm (in the US, a 200#-250# cover, or duplex) stock.</p>
      <p>Of course, a 540-700 gsm stock will stand out from the crowd just by virtue of its heft, even if it's printed digitally or offset.</p>
