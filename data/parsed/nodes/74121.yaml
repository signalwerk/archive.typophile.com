    html: |-
      <p>That Cursive is brilliant! Following the tradition from the Renaissance on, I would like to see the Caps more upright in the Cursive.</p>
      <p>Cursive:<br>
      /vw ce/ could be slanted a bit more.<br>
      /s/ is top heavy, which is not necesarily bad, but it could also be a bit more slanted. (Note, slanted doesn't mean 'more like the italic'.)<br>
      /o/ seems to be upright, because of the white space inside. I had the same problem with my own italics. It just needs to be slanted further, focusing on the whitespace.<br>
      /zero lining/ has same problem as /o/.<br>
      /one lining/ the two strokes are disconnected by the swashy ink trap.<br>
      /z/ is a bit too computarized and not enough calligraphic. Look at the italic /z/ in garamond and jenson and such.</p>
      <p>Italic: Looks silly next to that wonderful cursive. No specific issues, just a lack of cursiveness. I don't like that /x/ but that might be just me.</p>
      <p>Cheers! jasper</p>
