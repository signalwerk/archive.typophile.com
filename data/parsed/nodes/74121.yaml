    html: <p>That cursive is nice. I think it could benefit from looser spacing though. In 2, 4 and 7, I would try to get some curviness into the horizontals. Look to your z for guidance. I agree with jasper re o and s. y and g are nice and quirky. I'd make the exclamation mark curve away from the sentence rather than into it - i.e. Unslant it, reflect it and reslant it.</p>
