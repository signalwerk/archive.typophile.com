    html: <p> The smallest font in terms of cartesian resolution is 3x3 units. It [partly] uses luminance values (shades of gray) to convey shape. Look at the outline font AlienGray3 for an idea of what I'm talking about (but it's not an easy font to find). <br> <br>hhp </p>
