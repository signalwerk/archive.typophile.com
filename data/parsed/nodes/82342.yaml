  html: |-
    <p>Can anyone help me out with the font used by Bruichladdich across all their branding and POS? I'm pretty sure most of the text on here is DIN, but the word Bruichladdich seems a little more extended, and also the uppercase C is incorrect. Is this just a customisation of DIN or is it a different font? Any ideas greatly appreciated. </p>
    <p>More here... <a href="http://www.bruichladdich.com" title="http://www.bruichladdich.com">http://www.bruichladdich.com</a></p>
    <p>By the way, the whisky is jolly good, too.</p>
