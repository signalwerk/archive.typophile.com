    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Self Hosting Web Fonts Graphic_3820.JPG"></div><p></p>
    <p>&nbsp;<br>
    <strong>New Feature Provides Customer Control over Web Font Deployment</strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has added a self-hosting feature to its <a class="freelinking external" href="http://webfonts.fonts.com/" rel="nofollow">Fonts.com Web Fonts</a>solution, enabling enterprises to host Web fonts using their existing servers or content delivery network. </p>
    <p>"We've spoken to a number of companies who prefer the ability to control and deploy Web fonts themselves, just as they do with other Web assets," said Chris Roberts, vice president of marketing at Monotype Imaging. "We listened, and today our professional-tier subscribers have the flexibility to work with fonts either in a self-hosted environment or through our existing hosted service. We're firmly committed to providing the world's most comprehensive, convenient and easy-to-use Web font solution." </p>
    <p>Monotype Imaging's self-hosting feature is available for Fonts.com Web Fonts subscribers at the professional level. Customers download a kit that steps them through the hosting process. Customers select the fonts they need, and CSS (Cascading Style Sheets) code is provided for rendering in all major browsers. In the future, as browser companies release new browsers or enhanced versions, customers will be able to download updated CSS code to ensure compatibility. Any enhancements that Monotype Imaging applies to its fonts, such as optimizing a font to improve legibility, will also be available. "We've made it easy for self-hosting customers to use our service with full confidence, knowing they'll always have access to the most up-to-date font data, and knowing they'll always comply with the latest browsers. These are the same benefits that our hosted solution provides," said Roberts. </p>
    <p>While the self-hosting option gives enterprises control over deployment, Monotype Imaging's hosted approach serves fonts from the company's worldwide content delivery network, deploying fonts quickly to the user's screen, anywhere in the world. Monotype Imaging continually updates its Web font service to address changes in browsers or Web font specifications, which are automatically applied as subscribers use the service. "Our hosted solution provides a powerful way for most customers to take advantage of Web fonts," said Roberts. "By adding a self-hosting option, we're simply strengthening the breadth and flexibility of our service — while also making professional-tier customers who've requested this feature very happy." </p>
    <p><strong>About Fonts.com Web Fonts</strong><br>
    Monotype Imaging's Fonts.com Web Fonts solution enables thousands of high-quality fonts to be used in Web page design. Typefaces include some of the world's most renowned designs used in branding and advertising, such as the Helvetica®, Frutiger® and Univers® faces, available as Web fonts exclusively from Fonts.com Web Fonts. Typefaces are added on an ongoing basis from the company's Monotype®, Linotype® and ITC® font collections, in addition to fonts from contributing type foundries and independent designers. </p>
    <p>Three subscription plans are available: free, standard and professional. The no-fee plan includes more than 3,000 fonts that can be used on an unlimited number of websites for up to 25,000 page views per month. Both the standard and professional plans provide access to more than 10,000 fonts and feature several flexible page view allowance options, starting at $10 and $100 per month, respectively. In addition to the new self-hosing option, professional-tier subscribers may also receive up to 50 "desktop downloads" each month — fonts that can be used for the creation of Web page mockups in applications such as Adobe® Photoshop® and Illustrator® software. Complete details and pricing are available at <a class="freelinking external" href="http://webfonts.fonts.com/" rel="nofollow">Fonts.com Web Fonts</a>. </p>
    <p>Monotype Imaging's Web font service complies with W3C (World Wide Web Consortium) specifications for deploying server-based fonts and supports all major browsers, including Microsoft® Internet Explorer®, Mozilla® Firefox®, Apple® Safari®, Google Chrome™ and Opera® platforms. Mobile Safari is supported for the iPad®, iPhone® and iPod® mobile digital devices. Fonts are downloaded dynamically to browsers from a global network of servers. Monotype Imaging's new self-hosting option allows professional-tier subscribers to host fonts using their own servers or content delivery network. Fonts are published to websites using a self-host method for self-hosting customers, who can also use JavaScript™ or non-JavaScript methods, both of which are offered through the company's hosted solution. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype, Linotype and ITC typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a class="freelinking external" href="http://www.monotypeimaging.com" rel="nofollow">http://www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U. S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica, Frutiger and Univers are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Adobe, Photoshop and Illustrator are trademarks or registered trademarks of Adobe Systems Inc. in the U.S. and/or other countries. Microsoft and Internet Explorer are either registered trademarks or trademarks of Microsoft Corp. in the U.S. and/or other countries. Mozilla and Firefox are registered trademarks of the Mozilla Foundation. Apple, Safari, iPad, iPhone and iPod are trademarks of Apple Inc. registered in the U.S. and other countries. Google Chrome is a trademark of Google Inc. Opera is a registered trademark of Opera Software ASA. JavaScript is a trademark of Oracle and/or its affiliates. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
