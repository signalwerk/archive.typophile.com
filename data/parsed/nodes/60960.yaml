    <p>Creating a logo for my future portfolio. Got inspired by roman inscriptions across my town(Zadar, Croatia) and  here is the result.</p>
    <p>BVTIGA or butiga is a word of italian origin and it can be translated to shop, manufacture...</p>
    <p>What do you think? Any technical, optical problems?</p>
    <p>Thanks</p>
