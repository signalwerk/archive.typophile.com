      <p>It's funny to see how the change of name gets rid of Bvlgari reference. And yes, start with BV does make this reference stronger. I don't think that lowercase is answer, especially as I want caps and this extended style of typeface.</p>
      <p>Rethinking is probably the answer. This is exactly design of typeface that I wanted, and also the name Butiga that I like so much.</p>
