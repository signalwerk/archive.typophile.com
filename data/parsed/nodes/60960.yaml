    html: <p>Very clean and great looking, but it <em>is</em> for a straight-on Bvlgari reference. Both start with BV, both have GA and about the size number of letters, very similar in the use of the typeface and black/white palette (which is a minor issue obviously). I don't think changing BV to BU will suffice, the type needs to be changed to something completely different to break Bvlgari association. Perhaps also consider switching to the lowercase ?</p>
