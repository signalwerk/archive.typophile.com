  html: |-
    <p>Hello everyone,</p>
    <p>I’m a new typophile member (2 minutes and 24 seconds according to my account info,) student of graphic design, and discoverer of a previously unknown love... typography. I’ve spent the past week trying to find a good internet resource for typography, more specifically for a list or library of typefaces and their designers.  My aim is to become familiar with the classics, and then the designers of my favorite typefaces.  Any post with a link, a book suggestion, or a typographer that you know and a listing of fonts they created would be great!</p>
    <p>Thanks in advance for your help.</p>
    <p>Newly discovered typophile,<br>
    Michael</p>
