      <p>Welcome Michael.</p>
      <p>Well, first off I’d like to recommend Typophile’s very own, ever expanding Typowiki as a resource: <a href="https://web.archive.org/web/20080704191857/http://typophile.com/typowiki" title="http://typophile.com/typowiki">http://typophile.com/typowiki</a> It’s chocked full of useful information on everything type related and maintained by the very blood that fuels this forum, our avid Typhophiles.</p>
      <p>James comes off a bit gruff, but he’s right. If you have access to a library (hard to imagine, but possible) take advantage of it. There are many a resources on type there. Also consult your local book emporiums. There are many books on the history of typography, including font selections from the past up to the most contemporary.</p>
