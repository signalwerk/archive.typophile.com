    html: <p> Wha!? The 'r' exemplifies what is best about this <br>design - ultrasimplicity while retaining meaning. <br>The 'a' is the best glyph, tho. I wonder if its <br>shape could be better implemented throughout <br>the alphabet. <br> <br>I like the idea on the 'w' and 'm' but the extra <br>space between the curved and straight lines <br>distracts me. <br> <br>Nice work, Tiffany! <br> <br>Stephen </p>
