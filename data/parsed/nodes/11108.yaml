  html: <p>The inspiration behind this one is the Volkswagen Radio station. Strictly done as an exercise for myself. They had the word radio created and I went from there. I like the idea of a single stroke typeface that only changes in weight. The problem with this, of course, is that by the time I created my ultra-mega fat (not shown) the counters were gone. <br> <br><img src="http://www.typophile.com/forums/messages/29/986.gif" alt="volks.gif"> <br><img src="http://www.typophile.com/forums/messages/29/987.gif" alt="volksfig.gif"></p>
