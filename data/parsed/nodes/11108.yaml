    html: <p> Bauhaus meets Trance - very nice. <br>That "e" is indeed amazing, not least because I think it actually works! The "k" is also cool. Some other forms need work (like the leftward-leaning "z", the simply-too-strange "r", the too-narrow "x"), but I'd love to see some lines in this thing. Extra-large, on white bread, please! <br> <br>BTW, I prefer the second "f". <br> <br>hhp </p>
