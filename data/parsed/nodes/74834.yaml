    <p>I am looking for bodies of work by artists who specialize in typography, whether it's hand drawn or otherwise. I have these couple so far.</p>
    <p>Nate Williams - <a href="http://www.n8w.com/gallery/color/l/" title="http://www.n8w.com/gallery/color/l/">http://www.n8w.com/gallery/color/l/</a><br>
    Marian Bantjes - <a href="http://www.bantjes.com/" title="http://www.bantjes.com/">http://www.bantjes.com/</a><br>
    Seb Lester - <a href="http://www.seblester.co.uk/type_lettering.php" title="http://www.seblester.co.uk/type_lettering.php">http://www.seblester.co.uk/type_lettering.php</a><br>
    SHCH Graphics Group - <a href="http://www.sgr.kiev.ua" title="http://www.sgr.kiev.ua">http://www.sgr.kiev.ua</a><br>
    Jessica Hische - <a href="http://jessicahische.com" title="http://jessicahische.com">http://jessicahische.com</a><br>
    Can anyone recommend any other artists/designers who do work similar to the above?</p>
