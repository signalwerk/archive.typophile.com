    html: <p>So the precentage in Acrobat Reader (or any other pdf viewer) aren't true? 100% isn't 100% in terms of pixels.</p>
    html_clean: <p>So the precentage in Acrobat Reader (or any other pdf viewer) aren't true? 100% isn't 100% in terms of pixels.</p>
  - id: 352427
    user: 16911
    date: 2009-06-18T03:34:00
    date_raw: 18 Jun 2009 — 3:34am
    votes: null
    html: |-
      <p>No, 100% at Acrobat’s (8, Mac) default ‘system resolution’ of 93 pixel per inch won’t look the same as 100% at a customized resolution of 72ppi. You might assume that most people (on a Mac, using this very piece of software, that is) haven’t changed the default and thus specify an initial zoom factor of ~77,419% in your document – but that neither looks good nor will solve your problem.<br>
      Better include links to online images.<br>
      F</p>
    html_clean: |-
      <p>No, 100% at Acrobat’s (8, Mac) default ‘system resolution’ of 93 pixel per inch won’t look the same as 100% at a customized resolution of 72ppi. You might assume that most people (on a Mac, using this very piece of software, that is) haven’t changed the default and thus specify an initial zoom factor of ~77,419% in your document – but that neither looks good nor will solve your problem.<br>
