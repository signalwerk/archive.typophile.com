  - id: 352530
    user: 3972
    date: 2009-06-18T13:42:00
    date_raw: 18 Jun 2009 — 1:42pm
    votes: null
    html: |-
      <p>In other words: your monitor at around 73% displays the pdf at the full 100%.</p>
      <p>An idea: upsample your screenshots in PhotoShop to 4 times 73% using the bilinear setting and place these in your layout with a 25% reduction. Don’t use downsampling when PDF-ing.<br>
      Could be the way to go…</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
