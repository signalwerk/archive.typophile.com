    <p>OK, I’ve read with attention some Mac vs. PC posts here.<br>
    Dont want to add any other discution about it.<br>
    My question is:<br>
    Want to buy a PC laptop for graphic design/type design/multimedia development.<br>
    So I use photoshop/freehand (perhaps upgrad to illustrator...)/flash/premiere/dreamweaver.<br>
    What do “Typophile” pros use?<br>
    Brand and model...Pros and againt<br>
    Thanks in advance</p>
    <p>Thanks<br>
    António</p>
