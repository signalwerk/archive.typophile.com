    html: |-
      <p>Over the years, I’ve used Sony laptops (definitely <em>not</em> recommended), Toshiba laptops (pretty good, but I had repetetive trouble with hard drives), and a Panasonic ’Toughbook’ (a nice lightweight travel machine, but a bit slow). But by far the best computers I have bought have been from Dell. I have one large Dell Inspiron 9100 laptop that I’ve used as my main machine for the past three and a half years, and recently bought the small Dell XPS 1330 to use as a travel machine. I particularly like the customisability of Dell computers: I maximised the RAM and got the fastest CPU option for the XPS 1330, and it is blisteringly fast compared to my older Dell.</p>
      <p>Thomas, as I understand it, 32-bit Windows only provides applications with a 3GB flat virtual address space, but kernel components will address a separate gigabyte. So 4GB is the actual limit (which is what I got in my XPS, and I hope I didn’t waste money on an unused gigabyte of RAM!). But in order to provide access to the full 3GB, either the computer manufacturer or administrator needs to set the /3GB flag in the boot.ini (in pre-Vista versions of Windows)</p>
      <p><a href="https://web.archive.org/web/20080709012403/http://msdn2.microsoft.com/en-us/library/ms791558.aspx" title="http://msdn2.microsoft.com/en-us/library/ms791558.aspx">http://msdn2.microsoft.com/en-us/library/ms791558.aspx</a></p>
      <p>or the IncreaseUserVA in BCDEdit (Windows Vista)</p>
      <p><a href="https://web.archive.org/web/20080709012403/http://msdn2.microsoft.com/en-us/library/aa906211.aspx" title="http://msdn2.microsoft.com/en-us/library/aa906211.aspx">http://msdn2.microsoft.com/en-us/library/aa906211.aspx</a></p>
      <p>If you are buying a computer with more than 3GB of RAM, you may reasonably expect the manufacturer to set this, but you can ask them to confirm this.</p>
