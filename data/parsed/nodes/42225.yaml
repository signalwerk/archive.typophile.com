      <p>With any laptop, my experience is it that the extended warranty is a good investment. Dell has been good for me, but I heard they moved tech support to India, and my friend says sometimes they are hard to understand. Fortunately at my company, if your Dell laptop acts up, our contract is set so someone will come fix it in a day. </p>
