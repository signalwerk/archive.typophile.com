      <p>I find that the build quality of lesser known, and cheaper, brands is only so-so. People are still lugging around their old Powerbooks because they are built more tank-like, so I suggest that in addition to the specs, you also look for decent build quality.</p>
      <p>Compared to other graphics applications, font production is fairly low in resource consumption. But Thomas’ recommendations above still apply if you value your time and your sanity :)</p>
      <p>Also, Freehand is dead.</p>
