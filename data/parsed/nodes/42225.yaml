      <p>Second, a general comment: brand and model are interesting, but key specs are at least as important. For example, I have a Lenovo (“IBM”) ThinkPad T61P. But how I got that configured (screen size/resolution, memory, hard drive size) is a lot more relevant.</p>
      <p>Generally, I recommend that you get 2 GB of RAM. Regular 32-bit Windows can’t address more than 3 GB, and any less than 2 GB is a false economy for performance. If your budget is tight, you’re better off getting a slower processor but still getting 2 GB of RAM. For whatever model you pick, you probably want the biggest hard drive you can reasonably afford before the prices start escalating crazily.</p>
      <p>Related to screen size, a host of related questions: Will you be using an external monitor for most of your serious work, or will you be relying on the built-in LCD screen of the laptop most of the time? Do you have good eyesight and a high tolerance for small stuff on screen? How much What format of outlines are you likely to mainly be working on? (Which is implicitly looking for “what em square size are you likely to be working with in your type design work?”)</p>
      <p>Cheers,</p>
      <p>T</p>
