      <p><cite>Evidently, it is very difficult to make a fully functional and reliable font generation</cite><br>
      That is nonsense. The Adobe OpenType FDK is out there for everyone to use, or to implement in software. All the major font editors have this FDK built-in to generate OpenType font files. And I cannot remember that Adobe put out a similar kind of FDK for PostScript Type 1 fonts some 25 years ago. Because that was a time when the real “font wars” were happening – between PostScript and TrueType – and not now.</p>
      <p>There is only one reason why font designers/developers have to work with tools that are less than ideal sometimes: because they are a small audience. Therefore development of font editors/tools is done by small companies – usually only one programmer – that cannot invest vast resources to make every user happy. That is how the font industry works. Deal with it.</p>
