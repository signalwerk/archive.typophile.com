    <p>Hey there! I'm thinking about making my own font editing program for the PC. I'd like to know how hard it is? I mean what programming language is required to learn and to what level to design a simple font editor (is it C++?)?<br>
    Like if I started learning today, could I have a finished product within 6-12 months? Anyone here have a clue?<br>
    Thanks :)</p>
