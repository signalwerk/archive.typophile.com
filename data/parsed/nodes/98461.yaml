      <p>Paul--</p>
      <p>I presume that English is not your first language, which may explain your reading comprehension problems. The subject of this thread is Font Editing software; hence, that was the subject I was discussing, so my comments about the AFDKO stand, and your comments remain nonsense.</p>
      <p>As I understand it, Apple and Microsoft worked jointly on the Truetype format to overcome some of the limitations of Apple's original implementation of PS1 fonts, especially the annoying problems of separate screen and printer fonts. Also, in my experience, Fontographer 3.x did a quite credible job of generating TTF fonts: many of my initial, humble freeware efforts from fifteen years ago are still being used by cheapskates; in fact, I was somewhat surprised to find several of them preinstalled on the HP computer I bought about six years ago.</p>
      <p>No, FOG 3x wasn't a perfect design and production tool, but font life was a little simpler then. Sometimes, less <em>is</em> more...</p>
