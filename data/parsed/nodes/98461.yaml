      <p>It's like any other programming job. I don't know anything about finances, so I cannot write a book-keeping program. I <em>do</em> know a lot about the internals of font files, so it only took me about 6 months to go from idea to a fully working program, to convert existing curves into one of the common font file formats.</p>
      <p>The hard part is not actually your currently  (possibly non-)existing programming experience. You are talking about a lot of different things here:<br>
      1. "font <em>editing</em>": this requires you to learn how to read a font file format (and there are dozens, and at least two file formats are more or less mandatory for any "editor"). You should not only be be able to <em>read</em> the file format but <em>write</em> it as well, which are two different things. If you read a file and write it back without changing anything, optimally "nothing" should be different -- a tall order in itself.<br>
      2. "editor" implies a graphical interface. If you never wrote one before, don't start with a font editor ... Font editing is something special among graphic (vector) image software, it has a couple of demands of its own.<br>
      3. "Is it C++?" What "is"? The language you need? The language commonly used for font editors? On what platform? For Mac OSX, it's (probably!) Objective-C. Cross-platform solutions can use Java. Using a scripting language, you can leverage the functionality of existing software to include font editing; I used Javascript to add it to Adobe InDesign.</p>
      <p>So, your question only raises more questions, and only you can answer them for yourself.</p>
