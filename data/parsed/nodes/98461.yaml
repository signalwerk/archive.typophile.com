      <p>First of all, what's your programming experience/knowledge level like?  </p>
      <p>Second, what kind of fonts are you looking at editing?  A bitmap font drawing tool probably isn't too hard in a technical sense for a relatively inexperienced programmer, at least given a high-level language like Java (or a good RAD environment), but you'll still need to know basic programming techniques.  If you want to actually save and load font files (even bitmap), managing the file layout would add a whole other dimension.  Doable in 6-12 months?  Certainly, as long as you're either familiar with programming or a <em>very</em> diligent learner (and don't need much of a social life).  A 'finished' product?  There's no such thing, in my experience.  Speaking as a programmer myself, 'good enough for another release' is about as much as you can hope for...</p>
      <p>For an outline font editor (including TrueType, PostScript, OpenType, etc.) you would need an entire other set of skills like vector drawing techniques.  Knowledge of reasonably-advanced (at least Bachelor's level) mathematics would be useful, although you might possibly get away with less if you can find a very good spline-handling library.  I won't even try to put a time estimate on that.  I suspect even George Williams would be well challenged, starting 100% from scratch, to produce something decently usable within a year.</p>
