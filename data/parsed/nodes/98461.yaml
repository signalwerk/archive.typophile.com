      <p>A great way learn programming is to have a practical and complex project to work on. Start off small and then add to it bit by bit, so that you have something that is useful and working very early on. Look at what is already out there (so you know what not to do).</p>
      <p>It is possible to have a usable (and salable) product within 6-12 months (I know this to be true from personal experience). But it won't be finished in even 6 to 12 years!</p>
      <p>Resources: "Fonts &amp; Encodings" Published by O'Reilly.<br>
      Also the font file specs on the Adobe, Microsoft and Apple websites.</p>
