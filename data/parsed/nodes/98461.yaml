      <p>Evidently, it is very difficult to make a fully functional and reliable font generation: FontLab has been struggling to get its latest release out, abd continues to have problems playing nice with OS X. Additionally, DTL seems to be having problems putting together a WYSIWYG version of their Kernmaster software: the promised 2012 version has yet to materialize.</p>
      <p>Once upon a time, Fontographer 3.x did yeomanlike work in a simpler world; unfortunately, since Ye Olden Tymes, "improvements" in font technology appear to have presented challenges which are not easily overcome, it seems. So, the type standards war runs parallel to the browser standards war: everyone has their own indea of what OUGHT to work, and font creators and font users have to deal with the messy results of "competition in ther marketplace." Puh-leeze...</p>
