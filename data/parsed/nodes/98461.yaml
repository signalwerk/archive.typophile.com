      <p>Evidently, it is very difficult to make a fully functional and reliable font generation</p>
      <p><em>That is nonsense. The Adobe OpenType FDK is out there for everyone to use...</em></p>
      <p>No: that is nonsense. The AOFDK is an afterburner, not a complete font design environment. IMHO, none of the font creation packages currently available have sensible drawing tools, nor are they complete. Fontographer still suffers from Macromedia's inane decision to include fractional em sizes, and FontLab's generated TrueType fonts often fail in one or more areas when run through MS Font Validator. Plus, it appears that FontLab consistently has problems porting to Mac OS X.</p>
      <p>So, if you can build a better mousetrap, please do...ASAP.</p>
