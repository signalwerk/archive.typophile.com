      <p>I think Theunis and Alex (altsan) have put your question in the right track, regarding technical &amp; GUI complexity. My opinion is that even for an experienced programmer, 1 man-year is not enough to produce a decently usable vector font editor.</p>
      <p>More than this, if you want to elevate this editor to an actual product to sell, your most optimistic estimate must  be in the 3+ man-years range, taking into account features as read/write of all-font-formats (OTF/TTF/Type-1) support, Advanced vector editing GUI/techniques, Font (auto)Hinting, (auto) Kerning, Import/Export to common formats, Help &amp; Documentation, Extensive Testing &amp; Bug Fixing in all platforms, A web site to promote sell your product, A decent DRM system, etc.</p>
      <p>My thoughts, -given you possible inexperience in programming- are:</p>
      <p>=&gt; I don't think iOS is an appropriate environment for a full vector-font editor. iPhone is too small and even iPad would present a user with a difficult interface, too far from the easiness &amp; precision a PC/Mac can offer.</p>
      <p>=&gt; Learning/mastering a new language as Objective C or C++ at the same time you are working in a complex project like a Vector-Font-Editor is a guaranty of both frustration (why this crashes/not working?) and a bad final product quality. Start with a much simpler project, like e.g. a simple vector editor to read/write/edit an EPS (Encapsulated Postscript) file, and gradually add Guidelines, Grid, Snap Tools, etc. until you feel confident to handle more complex file formats and data structures.</p>
      <p>=&gt; Objective C  is an interesting, powerful language but it works only on Mac OS/iOS environments. If you decided to go the route of learning a new language I propose a <strong><a class="freelinking external" href="https://web.archive.org/web/20130823202543/http://www.developer.nokia.com/Develop/Qt/" rel="nofollow">C++/Nokia Qt</a>*</strong> combination which is actually a multi-platform solution: You write the Application once and (with one or two twinks) it compiles/runs under Windows/Mac/Linux, but be aware that Qt Creator GUI editor is not as good as MS-Visual Studio (for Windows) or X-Code (for Mac OS).<br>
      (*) Nokia Qt is an Open Source product delivered with an LGPL license, which practically means you can even use it on a commercial application without buying it, as long as you include Qt in DLLs format. </p>
      <p>=&gt; This is a useful/fast/free/open-source/high quality library to read &amp; render most formats of vector &amp; bitmap fonts files: <strong><a class="freelinking external" href="https://web.archive.org/web/20130823202543/http://www.freetype.org/freetype2/index.html" rel="nofollow">Freetype2</a></strong><br>
      You can read/render and I think you also have access to font's vector data, but it does not support editing or creating/saving a new font file. </p>
      <p>Good luck with your project ;)</p>
