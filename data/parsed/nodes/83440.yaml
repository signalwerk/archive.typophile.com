      <p>No luck at Veer or Identifont, which is hard to use for scripts. Velvet Script (Typadelic) and Eye Catching (BV Fonts) were the most similar.</p>
      <p>You might need to consider that this might be hand-drawn or a custom font. With no repeated letters there is no way to prove it's a font.</p>
      <p>- Mike Yanega</p>
