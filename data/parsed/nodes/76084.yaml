      <p><em>...the fact that I have availed myself to modern technology does not mean I am "faking it" any more than any other production method ...</em></p>
      <p>I wasn't suggesting you were. I've argued above that with each generation of new technology, much of the fresh output mimics the effects of previous technology, and is in that sense fakery, adopting the appearance of something that it is not.</p>
      <p>When people use a script font that is strongly informed by hand lettering skills, they want some of that cachet without paying for a custom job, and quicker and more immediately flexible. At the same time, script fonts have their own dialog with type and type history. It is a horse of a slightly different color, because the typographer can experiment with the setting typographically.</p>
