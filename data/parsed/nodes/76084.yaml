      <p>Not only handwriting of course, but also hand lettering.<br>
      Haven't you made a few of those yourself?</p>
      <p>The process is commoditization, as the skilled products of one generation of technology users (e.g. scribes with pens) are automated and turned into a commodity (type) which imitates what went before. It's one of McLuhan's Laws.</p>
      <p>In early Photoshop, it was possible to mimic "airbrush" effects, but difficult, as layers and dedicated filters did not exist. Then the effect was commoditized in pre-set filters.</p>
      <p>But not everyone is beholden to using others' tools to make their thing, some make their own tools.</p>
      <p>**</p>
      <p>In typesetting, tasks which were done manually -- justification and kerning -- have now been automated.<br>
      Contentiously, InDesign's "Optical" kerning fakes the "Metrics" kerning in digital fonts, which in turn fakes the manual on-demand, instance-by-instance kerning of foundry type composing.</p>
      <p><em>Nick, you seem to know a lot about the subject? </em></p>
      <p>I wrote a series of magazine articles 2000-2005, some of which address the role of technological change in type and design culture, which IMO is the Big Question. They're at shinntype.com, under "Writing".</p>
