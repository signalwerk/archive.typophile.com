      <p><cite>"I am looking at how Fakery is a screen, sort of like a mask. You are not showing the real 'you' if you hide behind a mask."</cite></p>
      <p>Reminds me of something Nick touches on above: Script typefaces that pretend to be somebody's handwriting (warm, soft, personal, handmade, and all the blah that comes with that), but in fact are fonts that anyone can buy; they only pretend to be the designer's* unique, personal expression.<br>
      Things that make it obvious that what we're looking at is really a font –like repeating, identical glyphs, or connection errors– can be as jarring as realizing that this person who's been beaming a smile at you has in fact, not only fake teeth, but a rather fake face altogether. So much for masks…<br>
      (* I mean the designer using the font in this case, not the type designer.)</p>
