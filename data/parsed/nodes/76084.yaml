      <p>Fakery? Gutenberg and Schoeffer set the tone with their simulacrum of the quilled page.</p>
      <p>Poliphilus was a great fake, a 20th century Linotype face able to create a facsimile Incunabula page.<br>
      My Scotch Modern attempts the same thing, for digital+offset to mimic mid 19th century typography (see present issue of <em>Eye</em> magazine.)</p>
      <p>Chalet was launched with a fake provenance.</p>
      <p>Oneleigh is an historical fiction, designed in the style of 1920s historicism, seventy years later.</p>
      <p>Script fonts fake handwriting.<br>
      Duffy Script fakes the random irregularity of a hand-drawn script with programmed multiple contextual alternates.</p>
      <p>But I don't think these kinds of fakery are what you had in mind, your topic seems to be more about protecting consumers from piracy and plagiarism.</p>
