      <p><cite>But 'fake' websites like 1001fonts etc.. Do people realise these fonts are fake?</cite></p>
      <p>Alas, I think they don't. Joe Public 'needs' a font, types its name into Google and finds it on one of these sites. The sites don't carry a warning or something. Joe Public thinks "hey this font stuff must be free 'cause my computer comes with a bunch of stuff installed", downloads, and goes to sleep, safe in the knowledge that if it's on the 'web, it Must Be Free.</p>
      <p>Search this forum for posts "requesting" (actually, often more like <em>demanding</em>) a font so-and-so; read the hurt comments of the people that make fonts for a living, and followed by incredulous replies of the original posters. "Wot, that font's <em>not</em> free!? You bunch of rip-offs!"</p>
