      <p>Thank you for your replies.</p>
      <p>And I'd love to find out about that other font, too.<br>
      It's an interesting font, with lots of detail and quite a few peculiarities (my scan is bad, the print looks very nice).</p>
      <p>I must say, I do like it and I think as a font for an Indonesian Cookbook it's a perfect fit! Plus it goes well with the Veljovic body text.</p>
      <p>I've uploaded another scan. Ideas?</p>
      <p>PS. Is it not possible to upload images in new comments?</p>
