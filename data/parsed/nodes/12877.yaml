    <p>Hello there, this is my first post.</p>
    <p>My scan is from a German Cookbook (Die Küche Indonesiens).<br>
    It's set in two characteristic fonts (two, I believe) that play together very well (and with the theme "Indonesia", also) and look simply gorgeous.<br>
    Can you help me?</p>
    <p>By the way, I am one of the "lurkers" Hrant has addressed recently.<br>
    It's not that I feel I was lurking around the Typophile boards, it's more like I'm interested in typography, not professionally though, and the best place to learn something is where the "professionals" discuss, ie here. An amateur like me isn't exactly capable of establishing a well-founded point in your highly sophisticated discussions, that's why I'm not participating.<br>
    But I do enjoy reading them very much. Thanks.</p>
