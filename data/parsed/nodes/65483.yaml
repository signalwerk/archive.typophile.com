  html: |-
    <p>I've been trying to ID this font for the last few days. What The Font can't ID it, Identifont wasn't much help, and I can't trace the original designer or get a text version to extract the font. A design group said this font was supposed to be 'Garow' but they didn't have a copy of that font. I've searched all the normal foundries and found no reference to the Garow typeface, even after trying numerous spelling variations. </p>
    <p>A fellow designer recommended Perpetua as a close match, which it is, but it's not identical.</p>
    <p>I'd like to find the exact match. Any help?</p>
    <p>Cheers,</p>
    <p>KK</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/prem-logo_3779.jpg"></div><p></p>
