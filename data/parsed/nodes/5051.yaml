    <p>Hey, <br> <br>I was also curious if anyone knew the names of the two fonts that are used on the West Coast Choppers iron cross logo.  I believe that the one used for 'Choppers' is a variation of IRONWORK, but I'm not for certain.  Here's a link to the logo: <br> <br><a href="http://www.marzdistribution.com/images/WCC_LOGO.jpg" target="_blank">http://www.marzdistribution.com/images/WCC_LOGO.jpg</a> <br> <br>If you happen to know the names &amp;/or where I can obtain the fonts, I'd be very happy.  Thanks &amp; have a beautiful day. <br> <br>Kevo</p>
