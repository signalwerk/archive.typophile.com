    html: <p>My Changeling won't match this exactly. I made the A and M wider and used a lower crossbar on the R. (I consider these improvements :-) I changed quite a few other things in it, such as adding a ton of alternate characters and new weights and styles.  <br> <br>I don't know of any available digital versions of the original under its real name (i.e., China) but there are some out there with other names such as <a href="http://www.castcraft-software.com/cgi-bin/castcraft/dc2.02?135%2C256" target="_blank">Camp Caps</a> if you need to match it exactly.</p>
