    <p>Hi there:</p>
    <p><a href="http://www.wallpaper.com" title="www.wallpaper.com">www.wallpaper.com</a></p>
    <p>The recent redesigned issues of Wallpaper have just about removed all vesitages of Matthew Carter's Big Caslon (italic swash, sparingly- bold and bold italic); and Charter. I even think they used Alisal too. Amplitude is also gone. </p>
    <p>For text there is a very literary face by Enschede (Trinite or Lexicon???). The workhorse sans, a warmer Univers-like-grot is elegantly neutral. There is also a new titling face in the vein of Profile.</p>
    <p>While the new look is certainly fresh it doesn't not come off with same perfect glove and hand combination of types as the previous editions of the magazine. I particularly do not enjoy seeing the Enschede type there- seems out of place to me- looks better in a books if you ask me. Perhaps the new look is a soft beauty as oppose to harsh one- something I'm not quite used to yet in bleeding edge fashion and design.</p>
    <p>Does anyone have the scoop on the new fonts and who led the redesign?</p>
    <p>Thanks,</p>
    <p>Mike Diaz :-)</p>
