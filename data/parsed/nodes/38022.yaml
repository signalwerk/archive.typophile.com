      <p>Hi Mike,</p>
      <p>Thanks for your compliments on the sans. It's called Plakat (at least for now), and was first seen in <cite>Condé Nast Portfolio</cite>, a business magazine that launched earlier this year. I had originally intended just to use it for my own corporate identity, but it seemed to be the right fit for these two magazines when they were looking for warm but relatively character-less sans serifs. <cite>Wallpaper*</cite> uses a custom Narrow width, which allows them to pack more copy in without taking any space away from the photography.</p>
      <p>The new text face is indeed Lexicon, which I think plays well with Plakat - they're polar opposites. It definitely sets a different mood from Charter, but I like its quieter tone of voice.</p>
      <p>The redesign was done in-house by Meirion Pritchard, who took over as art director when his boss, Tony Chambers, became editor-in-chief. Paul Barnes consulted on the typography and drew the fantastic shaded Antique that mainly shows up in the front section.</p>
    html_clean: |-
