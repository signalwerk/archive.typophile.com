      <p>Stephen,</p>
      <p>You could say that Plakat is a revival, but it's not entirely based on one specific face. I wrote this bit for Wallpaper* when they were about to launch, but they didn't end up using it (because really, who wants to talk about type when there's beautiful photography of glamorous interiors and furniture to look at?):</p>
      <p>"Plakat is based in part on Paul Renner's Plak, a relatively obscure display typeface cut only in large sizes of woodtype, that is related to the boldest weights of his Futura but has rounder, friendlier, fatter proportions. For the lighter weights, I was also influenced by the 'me too' sans serifs that many, often smaller European foundries released to compete with the juggernauts that were Futura, Helvetica and Univers, such as Neuzeit Grotesk, Folio, Recta, and Maxima. None of these families were groundbreaking, exactly, but they certainly have their charms. In the narrower styles, I was influenced by mid-20th century Swiss poster typography. In fact, the name 'Plakat' is German for 'poster'."</p>
      <p>Edit: I should mention that Big Caslon is still around and used for most headlines, but with much less emphasis on the swashes and ligatures in the italic.</p>
    html_clean: |-
