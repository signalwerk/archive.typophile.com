    <p>Hi all,</p>
    <p>I'm about to design a Hebrew on-screen typeface, which later on gonna be hinted.<br>
    lately I've been researching the technical parts, and think i quite got it well, </p>
    <p>but my main questions are design perspective:<br>
    1. Before designing the typeface, are there any limits I need to take in account? (White spaces? open glyphs?)<br>
    2. What's the difference between the process of designing a typeface for print and for screen?<br>
    3. how free-form can the glyph be? or should it be very mathematical?</p>
    <p>Thanks,<br>
    Yennok.</p>
