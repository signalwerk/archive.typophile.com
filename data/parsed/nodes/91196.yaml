    html: <p>When designing for screen, it helps a lot if you have a target pixel-per-em (ppem) size or range of sizes in mind. This is especially true today, given the prevalence of asymmetric rendering, i.e. systems such as ClearType that apply different different grid resolutions in the x and y directions. If you can target a particular ppem size, you can design your glyphs so that their proportions naturally give the kind of onscreen shapes that you want at that size (generally providing positive results for adjacent sizes too). You will inevitably face the frustration of asymmetric rendering as the same outlines look less good as you move away from that target size before looking good again as they approach the next 'magic' size at which the proportions just work. [The only way to avoid this is to produce more than one design, targeting different ppem size ranges.]</p>
