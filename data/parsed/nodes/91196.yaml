    html: "<p>Much depends on what you mean by 'superhint'. If you mean something like heavily delta'd instructions controlling precisely the pixel appearance of the type at individual sizes, then I think it is obvious that the diversity of rendering methods now in play make this technically impossible, especially since some of these rendering methods ignore some or all of the hint instruction set most of the time. Beat Stamm has suggested what I think is a different kind of superhinting: programming in the TT instruction language that allows for dependent hints targeting different environments. Even in that case, though, I think the reality is that design for screen has to begin at the outline level, and isn't something that can be applied post-facto in hinting as was the case for binary bitmap display. The days when Times New Roman could be turned into a credible screen reading font with hinting are long gone. The push to enhance individual typeface fidelity via antialiasing, to represent text type on screen recognisable as individual type designs rather than as highly readable but generic brick patterns, necessarily implies that the qualities that make for good screen readability must reside in the design. That was the genius of Verdana and Georgia and why they continue to work so well across so many different rendering technologies, and why that approach disitinguishes the best work being done in UI and webfont design.</p>"
