    html: |-
      <p>Space the H, space the O. Make sure they look perfect, spend as long as it takes. Copy the H sidebearings to flat sides BDEFIKL etc and the O sidebearings to the round sides CDG. Fine tune the spacing but don't change H or O. I usually call those sides "solid" and I sometimes make notes so I don't mess with them. I use those letters to space the rest. For example, to space an S, use HSHOSOBSBCSCDSD etc. or make up words with those combos. After you're all done, you can fine tune everything and work on kerning.</p>
      <p>It took me years to figure that one out.</p>
      <p>Another tip: always select all/copy every few minutes when writing a post on Typophile. One wrong keystroke and it's gone.</p>
