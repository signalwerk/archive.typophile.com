    html: |-
      <p>@Phinney - I remember reading you said that a long time ago. It's very true. The hard part is getting good enough at metrics that you can get them right before you kern. I still have to go back and forth and it takes me forever.</p>
      <p>@Typodermic. That's great advice. I kind of figured that out on my own from opening up Helvetica or whatever font is similar to mine and looking at the sidebearings and using it as a rough guide. Then I made small adjustments until it fit my font, but that all makes sense. I'm gonna use this as a guide on my next font. And that select all copy thing is good advice too. Jeez I was angered by that! I had written this really great thing and I lost it all and I was so tired.</p>
      <p>@oldnick. That's exactly what I did with this first font of mine. I would spell out words and tweak the letters until I liked the way it looked. Then I would make new words and make further changes. Do you ever find that you have to make compromises, where, in one word, something will make THAT word look better, but you find that you can't go that far with it? There were many times where I felt like I designed a letter to be halfway going in one direction, and halfway in another. I had to find a median, where it was safe, and consistent with the look and feel of all the other letters, but you can't JUST do that either. You have to form words and concentrate and making those words look as exquisite as possible. It's like walking a tight rope. It's hard to explain but I think you know what I mean. In the situation that you describe, it sounds like with a lot of hard work, you could could have fixed everything to work together. But the question is, is it worth it? </p>
      <p>Thanks everyone</p>
