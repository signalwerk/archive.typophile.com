      <p>In another thread, someone suggested designing words, rather than simply letters. I can attest to the wisdom of this approach.</p>
      <p>In one of the many lettering chapbooks from the 1900s through 1950s in my collection, I found a charming little alphabet with spritely upturned serifs, which I provisionally dubbed Twinkletoes. I constructed all of the characters necessary for a complete font, then exported them to Fontographer. It was only when I got to the kerning stage that I realized that virtually the only way the letters fit together without extensive kerning was the way I found them originally: that is, in strict alphabetical order. Bummer.</p>
