      <p>Ya forgot the nudge-nudge-wink-wink.</p>
      <p>I'm yet to actually design a font (it's still just pencil drafts in a grid-ruled notebook lying somewhere about), but the idea came from reading about FE licence plate faces.</p>
      <p>FE faces have the main design constraint that it must be difficult to modify letters to look like other letters in the face. (The Baader-Meinhof group used this tactic a lot.) I got thinking: Can this be done for US-style licence plates? Can it look good, too? And, can it be made such that a part can identify the whole?</p>
      <p>Of speculations like that can a new font rise.</p>
