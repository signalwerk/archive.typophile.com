      <p>I think he lost his first draft of the posting.</p>
      <p>One of the worst mistakes neophyte type designers make is to invest a lot of energy in kerning before they have really gotten the spacing quite right. The correct thing to do then is usually to throw away the kerning, which makes people very sad.</p>
      <p>Cheers,</p>
      <p>T</p>
