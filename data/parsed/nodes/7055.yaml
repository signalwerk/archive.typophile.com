  html: "<p>After several requests for English content on Hebrew type I have received, I'm releasing two English articles on my Hebrew website. Hopefully, this will raise more interest among type enthusiasts and will encourage more discussion and awareness to Hebrew/Semitic typography. <br> <br>The URL for English content is: <br><a href=\"http://www.oketz.com/english\" target=\"_blank\">http://www.oketz.com/english</a> <br> <br>Currently, there are two articles available, one is an overall introduction to the merits of Hebrew type: <br><a href=\"http://www.oketz.com/introduction\" target=\"_blank\">http://www.oketz.com/introduction</a> <br> <br>The other article is an interview I did with Hebrew type designer Yanek Iontef last year: <br><a href=\"http://www.oketz.com/iontef\" target=\"_blank\">http://www.oketz.com/iontef</a> <br> <br>Enjoy.</p>"
