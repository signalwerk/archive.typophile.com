    date: 2004-07-15T01:15:00
    date_raw: 15.Jul.2004 1.15am
    votes: null
    html: "<p>Tricky: <a href=\"http://www.myfonts.com/fonts/bitstream/gothic-821/\" target=\"_blank\"> Gothic 821</a> is in fact Bitstream's version of Berthold's  <br><a href=\"http://www.philsfonts.com/detail.html?sku=BQ90004005P1\" target=\"_blank\"> Block Extra Condensed</a> (I hope I don't get sued for revealing  <br>this <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) which was originally designed by H. Hoffmann  <br>somewhere between 1908 and 1927. So I guess \"Bitstream  <br>design department\" might do if you want to avoid litigation. <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"></p>"
    html_clean: "<p>Tricky: <a href=\"http://www.myfonts.com/fonts/bitstream/gothic-821/\" target=\"_blank\" class=\"link-external\"> Gothic 821</a> is in fact Bitstream's version of Berthold's  <br><a href=\"http://www.philsfonts.com/detail.html?sku=BQ90004005P1\" target=\"_blank\" class=\"link-external\"> Block Extra Condensed</a> (I hope I don't get sued for revealing  <br>this <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) which was originally designed by H. Hoffmann  <br>somewhere between 1908 and 1927. So I guess \"Bitstream  <br>design department\" might do if you want to avoid litigation. <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"></p>"
