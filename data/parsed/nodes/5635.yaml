  html: |-
    <p>For the end credits of my new movie, I need to know who the designer of ITC Franklin Gothic Extra Condensed is. MyFonts names Morris Fuller Benton first but also credits David Berlow and Victor Caruso. Was either of the latter individually responsible for the EC font, or was that part of the original Benton design?</p>
