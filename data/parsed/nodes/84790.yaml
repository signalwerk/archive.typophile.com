      <p>I think it is Literaturnaya. </p>
      <p>From Wikipedia: “Designed at Poligraphmashat the end of the 1930s by Anatolii Shchukin the font was based on Hermann Berthold's Latinskaya (St. Petersburg, 1901), a version of Lateinisch for Russia, also developed at the Berthold foundry (Berlin, 1899).”</p>
      <p>See this post: <a href="http://typophile.com/node/4572" title="http://typophile.com/node/4572">http://typophile.com/node/4572</a></p>
