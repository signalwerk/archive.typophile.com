      <p>Can't find a match for the first one but having a look to any font "bauhaus related" would be good. Could also be a freebie. As it's very geometric, you could also consider to redraw it using only a circle (q is o with a descender, u is o's half down part with 2 ascenders, i is a bar, r is o's top left quarter with a descender, k is a 2 back to back half o with an ascender and y is u with a half o as loop...).<br>
      - <a href="http://bowfinprintworks.com/BauhausFaces1.html" title="http://bowfinprintworks.com/BauhausFaces1.html">http://bowfinprintworks.com/BauhausFaces1.html</a><br>
      - <a href="http://new.myfonts.com/search/bauhaus/fonts/" title="http://new.myfonts.com/search/bauhaus/fonts/">http://new.myfonts.com/search/bauhaus/fonts/</a><br>
      - <a href="http://www.houseind.com/fonts/chalet" title="http://www.houseind.com/fonts/chalet">http://www.houseind.com/fonts/chalet</a><br>
      - <a href="http://new.myfonts.com/fonts/victory/bayer-sans/" title="http://new.myfonts.com/fonts/victory/bayer-sans/">http://new.myfonts.com/fonts/victory/bayer-sans/</a><br>
      - <a href="http://new.myfonts.com/fonts/k-type/circa/" title="http://new.myfonts.com/fonts/k-type/circa/">http://new.myfonts.com/fonts/k-type/circa/</a><br>
