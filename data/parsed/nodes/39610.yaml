    html: "<p>Asheville is a magical enclave, Chase! Do what Si and Kent recommend: come to TypeCon next summer, preferably with a group of local type and design geeks, and let’s have a discussion about the possibilities. Consider yourself invited to volunteer at the conference if you want to find out what it’s all about from the inside out. Contact me offline to discuss: tamye (at) typesociety.org.</p>"
