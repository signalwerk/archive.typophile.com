      <p>SoTA relies heavily on a local team to partner with the board of directors in hosting TypeCon each year. So that is one important factor in the decisions about locale. </p>
      <p>If you can round up enough seriously interested, committed, and reliable folks, let us know. We’d be happy to hear about ideas for future TypeCon cities. </p>
      <p>— K.</p>
