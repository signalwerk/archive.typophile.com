      <p>I think the reason Papyrus is used so much these days is that it is a font that says "non-Western" but which doesn't seem to invoke any bad ethnic stereotypes.</p>
      <p>So it's heavily used because it is an obvious choice that fills a real pressing need in today's world.</p>
      <p>And, thus, of course it's used for purposes that have nothing to do with Ancient Egypt, but instead, say, India or the Far East - one place I see it every day is in advertisements for "Trade Winds for Success", a local program of pre-apprenticeship training offered to persons of Native American descent.</p>
    html_clean: |-
      <p>I think the reason Papyrus is used so much these days is that it is a font that says "non-Western" but which doesn't seem to invoke any bad ethnic stereotypes.</p>
      <p>So it's heavily used because it is an obvious choice that fills a real pressing need in today's world.</p>
      <p>And, thus, of course it's used for purposes that have nothing to do with Ancient Egypt, but instead, say, India or the Far East - one place I see it every day is in advertisements for "Trade Winds for Success", a local program of pre-apprenticeship training offered to persons of Native American descent.</p>
