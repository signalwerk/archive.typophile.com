    html: |-
      <p>I think this would only be a big challenge if you do a lot of work for spas and Thai restaurants (Papyrus), an elementary school (Comic Sans), and for Hobo... I guess maybe Korean nail salons in strip malls? I don't know if Hobo is really overly used anymore, although I guess it was 10, 20 years ago. But I don't think I've ever been forced into using those typefaces, and I would imagine a good portion of designers have never used them either. Just because they're visible in the American (and probably global) landscape doesn't mean graphic designers are to blame -- I think it's usually churn and burn signmakers who are so cheap they only have the fonts pre-installed on Windows at their disposal.</p>
      <p>That said, this pledge can't hurt anything. Although maybe a more interesting challenge (possibly a Typophile challenge?) would be to use these three typefaces in an appealing way.</p>
