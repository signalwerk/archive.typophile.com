    html: <p>Mircea,  <br> <br>Is the language Romanian?  You said the oldest sample you saw was from the 1950's. What was the most recent use of it you have seen? <br> <br>The typeface (I wont say font, because to most of us that means a digital typeface) has some interesting features, and particularly the 'g' (which again looks a lot like Hollandse Medieval). Either you have two different fonts here, or the heavier weight uses a different 'g', and now with the lower case we can see that it uses a Venetian, or Old Style 'e' , and has an 'i' with an unusual dot. I notice some inconsistencies with your first sample and some of these new ones (look at the E), which makes me think we may have several fonts here. It's things like this that make me wish I had old catalogs from other European foundries, instead of mostly American, German and English typefaces. Yves, how's your print resources &amp; references?</p>
