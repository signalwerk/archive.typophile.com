    html: <p>I must disagree with William’s post about this typeface being Meidoorn.  This scan of the font from the Jaspert ‘Encyclopaedia of Type Faces’  shows some clear diﬀerences, especially in the R. This request was posted on the comp.fonts newsgroup a couple of days ago, and I replied with the suggestion of <a href="http://www.philsfonts.com/detail.html?sku=RR00005001P2" target="_blank">Erasmus</a> and <a href="http://www.fonts.com/findfonts/detail.asp?pid=203122" target="_blank">Hollandse Medieval</a>, as similar typefaces that I knew were available in digital form.  It seems clear that if that Mircea’s sample is not by DeRoos, then it was inspired by his work.<img src="http://www.typophile.com/forums/messages/83/19610.gif" alt="MeidoornSample"></p>
