      <p>Hollandse Medieval is available as a single-font display from Monotype (Red Rooster's Erasmus is very similar), but for text, the closest to what you want is Dutch Medieval, a four-font text family from Canada Type Fonts available at MyFonts in OpenType (with oldstyle figures and keystroke-linked fonts) for a good price. A well-kept secret, ness pah?</p>
