    html: <p>Thank you all for your suggestions.  <br>Until now, the closest one is Meidoorn, which I looked over on the net to find samples but no succes. Thankfully to Mike Yanega post, now I saw it. <br> <br>I also have some bold samples of the mistery font, which I will scan and post middle of next week. <br> <br>Info about de Roos fonts can be found at <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/RoosDe/SdeRoos.pdf" target="_blank">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/RoosDe/SdeRoos.pdf</a>. <br> <br>Proceeding by elimination, there are not much fonts left to try... if it's a de Roos font.</p>
