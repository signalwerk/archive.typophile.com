    html: <p>Yes, the language is Romanian. <br><br>The oldest book in which this typeface appears is from 1950, a math book from which I extracted the last three samples. From these you can see that the bold face is used together with the regular. The inconsistencies are important, but some features like the shape of the dot on i are also consistent. Considering that the bold is very heavy, almost black, and not all features can be keeped at this weight, it is possible to be in the same family with the regular. <br><br>The most recent book which uses this face is from 1991, but it is clear that is printed with the old&nbsp;technology.</p>
