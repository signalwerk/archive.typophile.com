      <p>John, that's a good font to know about. Canada Type keeps adding nice revivals of old typefaces, and they've broadened the range of the family to be a more complete rendition of the original design, which also had italics and condensed weights.</p>
      <p>However, this is still not the same as the posted sample, remember, so this mystery has not been solved.</p>
      <p>- Mike Yanega</p>
