      <p>I would say it’s a way to stress the picket fence effect of this type of writing. It’s a purely visual change, not an orthographical one. The writer does the same thing with the r.<br>
      You have a regular r at the end of words, but a narrow so-called “round r” within words.<br>
      The a exception is explainable through the preceding letter. The e doesn’t end with a stroke on the right side and even creates a gap there. So the writer fills in this space with the regular a this time, whereas in all other cases he can continue the picket fence look of the preceding letters with the unusual a shape or he can even connect the letters as in the d+a case.</p>
