      <p>That’s funny. Those C’s were killing me too. Unfortunately I wasn’t involved with the first part of the project, so I couldn’t control what went out the door. I agree with not sending out the junk.</p>
      <p>I’ve been able to make minor improvements to the spacing issues as well as decreasing the nasty horizontal scaling. The client never noticed the changes, so I feel a little better about that.</p>
      <p>Unfortunately we’re stuck with Rotis though. I was trying to sell Triplex for a few rounds, but that was for nothing.</p>
      <p>Thanks guys.</p>
