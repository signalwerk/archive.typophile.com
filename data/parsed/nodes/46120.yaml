    html: <p>It’s not too late to save this. You can achieve the same feel (looseness, lightness) without using Rotis (yuck) and without compromising your spacing. Tell the client they’ve selected the direction and that you need one more pass to clean it up. Then swap out Rotis for just about anything that is equally light. (Rotis is dreadful, esp. Those Cs.) Then fix your line spacing and your word spacing. Bam client I’d happy and your integrity intact.</p>
