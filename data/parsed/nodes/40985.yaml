    html: <p>Chiaroscuro properly refers to the innovation in painting whereby forms were represented as being primarily defined by light. Historically, artistically and aesthetically the term is inextricably wed to the Italian Renaissance. I would think that your serif font selection would be an opportunity to make that connection.</p>
