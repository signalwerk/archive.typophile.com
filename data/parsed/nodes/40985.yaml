      <p>I don’t think it is really Italian Renaissance. Early painters who experimented with chiaroscuro were mostly Mannerists and Caravaggio — who has widely considered as the one who mastered chiaroscuro into perfection — was an early Baroque painter. </p>
      <p>While historically not quite perfect, the second logo (Bodoni and Nobel) in my opinion is a great example of how I would understand chiaroscuro in typographic terms — better than the first, because of the interesting two-way contrast: the weight increases while stroke modulation and design complexity decreases. That is more sophisticated that the first approach which really just says “little” vs “much” of everything. </p>
      <p>A.</p>
