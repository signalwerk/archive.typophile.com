      <p>Though it’s not exactly a Master’s degree in art history, Wikipedia does have a thorough and accurate entry on the word:<br>
      <a href="http://en.wikipedia.org/wiki/Chiaroscuro" title="http://en.wikipedia.org/wiki/Chiaroscuro">http://en.wikipedia.org/wiki/Chiaroscuro</a><br>
      To elaborate on my point, since the word itself actually has a technical and historical specificity to it—the Italian Renaissance—it seems that a font that more closely shares the same stylistic heritage as the word may be a better selection than a Bodoni. Just a suggestion. Personally I love that sort of thematic integration.<br>
      Also, there is a danger with having too great of a contrast in weight here in that it begins to look like two separate words.</p>
