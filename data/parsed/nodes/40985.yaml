    <p>I am working on a mixed-type logotype and I was hoping for some feedback.</p>
    <p>The first version is comprised of Helvetica Light and Clarendon, while the second, of Bodoni and Nobel Bold (I tried Futura as a more usual pair of Bodoni but the un-stemmed u didn’t work for me).</p>
    <p>The logo is about a photographert and it means “light dark” (or “light shade” as I was told). The photogrpher wants to create a mixture of elegance and contemporary look at the same time, and this is one of my first ideas (even though the selected typefaces are not that contemporary - I am still working on it).</p>
    <p>So, I was hoping for some comments on the spacing and the typefaces combinations (and perhaps other, more contemporary suggestions)? Which of the two versions would you go for?</p>
    <p>Thanks in advanced<br>
    </p><div class="imageWrap"><img src="/files/chiaroscuro_3784.png"></div><p></p>
