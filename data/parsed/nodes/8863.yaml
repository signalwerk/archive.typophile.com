    html: <p>The evenness of stroke weight in sans letterpress printing depends greatly on the printing. At one extreme, you have the blobbified Univers linked above (are we <i>sure</i> that isn't flexo, incidentally?). At the other, you have the near-perfection of the 1912 ATF specimen book (to which this <a href="http://levien.com/type/atf_1912/p0668_sm.jpg">200 dpi scan</a> does not do justice). Even so, the latter is not <i>quite</i> as homogenous and colorless as we're used to in offset printing today. <br> <br>I haven't seen explicit pincushion-shaped cups(*) and thorns in any of the metal type I've seen, but these features were quite common in the (bad) early days of phototypesetting, largely to compensate for fuzzy focus in the photographic reproduction process. <br> <br>* Here I'm talking about inner corners joining at 90 degrees or so. For inner corners of significantly smaller angle, trapping is common and has been since the early days. Hrant will probably have something to add about this.</p>
