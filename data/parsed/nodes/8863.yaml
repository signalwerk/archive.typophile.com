    html: <p>&gt;not even consistent <br> <br>It is consistently applied, in the sense that where there is an opportunity to exaggerate the acuteness of a joint (to "dig it deeper"), it is taken, although the manner in which this is done it is not identical in each instance, as the ticks and nicks of phototype are. <br> <br>The joints at the top of the 'M' are between straight stems whereas the joints in the 'b' are between a curved bowl and a straight stem, which is truncated at the bottom, necessitating a different arrangement than at the upper part of the join.</p>
