    html: <p>Timo <br> <br>I haven't looked at any scientific studies on the dynamics of pressure flow but the cups and flared stems you are seeing could easily be accounted for by the amount of ink lay, roller pressure, roller direction... I doubt these features would have been incorporated in metal typefaces for technical purposes, and if they were, it would have been for aesthetic reasons. <br> <br>I would imagine that Univers was cut with a matrix cutting pantograph (which first appeared in the late nineteenth century and fell into general use in the early twentieth). Wood type was cut from pantograph enlargements very early in the century, almost from the get go. <br> <br>I scanned the piece (note this doesn't reveal the optical nuance of the relief impression which will often visually compensate for ink gain by adding dimension). This measures about 1-1/2 by 2-1/2 inches. So the type would be the equivalent of 14- or 15-pt. It is enlarged here which doesn't really reveal the intent. This was printed from a copper photoengraving without dampening the paper. Note the border rule was supplied to act as an ink support. The top A differs from the A in the second line because of its isolation, it takes the roller pressure hit all by its lonesome (and looks heavier as a result) whereas the second A has its neighbors to help it along. This problem can often be adjusted during presswork through careful makeready which may or may not have been done in this case. Basically the idea is to get the stuff to look a little better to compensate for expected anomolies, not to change the look of the face. <br> <br><img src="http://www.typophile.com/forums/messages/30/64782.jpg" alt="Crystal Titling"></p>
