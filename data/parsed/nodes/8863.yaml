    html: <p>&gt;Concern about ink trapping was not articulated in print until the late 1920s or 1930s <br> <br>However, it has always been recognized by those who design type, and reflected in the basic letterforms themselves, not as a discernable added-on compensation such as the ticks and nicks of phototype. <br>Especially, trapping became a substantial feature of the major text style throughout the 19th Century, the "Modern". <br> <br>Here, in CG Modern 20 (a fairly close approximation of the metal modern) you can see the way that the acutely angled insides of joints have been exaggerated in depth to form one of the distinguishing themes of the design. <br> <br><img src="http://www.typophile.com/forums/messages/30/64805.jpg" alt="Mb"> <br>The trapping function is integrated into the overall design, disguised, if you will.</p>
