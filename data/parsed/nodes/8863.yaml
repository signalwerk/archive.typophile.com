    html: "<p>Ralph <br> <br>re: \"trapping is common and has been since the early days.\" <br> <br>Actually trapping is quite uncommon in metal type. And the \"early days\" starts around mid fifteenth century. I had some metal Pascal that ending up in Hrant's hands and he was able to find evidence of traps but this was a European foundry face produced about mid-century (1960 I believe, which is quite late in metal production). Concern about ink trapping was not articulated in print until the late 1920s or 1930s (I can't handily find the reference). Any evidence to it prior to this time would likely be an inarticulated innate part of the punchcutting process. [Where is Giampa the Great when one actually needs him?]</p>"
