    html: "<p>Gerald <br> <br>Yes, the other Univers k has grown bigger, but both of them are flared. Also the legs of the k's are wedge shaped. I think this kind of optical correction is common in digital type too. Both r's are also flaring more right than left. Notice how the i dots grow upwards... <br> <br>I am not saying all these things have to be in the metal itself, but if not, there has to be a logical reason in the process, because it's obviously not just random bubbling. My guess is that it has more to do with paper than ink... <br> <br>I notice the two crystal A's have quite different impressions. It would be interesting to see those together in big size, like the source and the ideal A's above. <br> <br>Raph <br> <br>&gt; are we sure that isn't flexo, incidentally? <br>I don't know, what makes you think so? <br> <br>That ATF specimen looks very clean, but it would be interesting to see some of the smallest sizes enlarged. <br> <br> <br>Nick <br> <br>Were the flared stems of Brown Gothic inspired by letterpress sans like in FF Legato? <br> <br>--- <br> <br>Here are some samples of AG in text and display sizes: <br><img src=\"http://www.typophile.com/forums/messages/30/64878.gif\" alt=\"\"> <br>The text size shows heavy flaring, round endings with no cupping. The display size has distinct cups on tops and bottoms, and slight flaring. Notice how the crossbar of t seems pincushioned. Neither of the prints have a tangible relief.</p>"
