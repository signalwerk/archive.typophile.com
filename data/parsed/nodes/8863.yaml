    html: "<p>Thanks Gerald, <br> <br>I meant the first post by Evert, starting 'A straight line is a dead line'... Yes, the thread is really winding. <br> <br>Evert talks about how the tangible relief of letterpress printing gives the type more \"tension\", and if I understood it correctly, causes printed outlines to curve, and that he tried to emulate this effect in FF Legato by drawing curved outlines. <br> <br>I think stems curved this way could be called flared? <br> <br>When I said punchcutters, I meant the makers of metal types in general, sorry about the confusion. <br> <br>My more accurate question would be: What causes the flaring seen in this Univers sample? <br><a href=\"http://www.typophile.com/forums/messages/30/54736.gif\" target=\"_blank\">http://www.typophile.com/forums/messages/30/54736.gif</a> <br> <br>I guess it's the uneven pressure on paper that causes ink to spread more around large unprinted areas, than in the densely printed mid-line areas? <br> <br>I also assume that rectangles in metal type were generally made more pincushion shaped, having cups and thorns, than what has been the norm in digital type...</p>"
