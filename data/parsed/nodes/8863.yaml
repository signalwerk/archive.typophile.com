    html: <p>Timo <br> <br>The effect that you term cupping and flaring is normally just considered swelling. The ink has traveled beyond the letterform and the dynamics of that flow in combination with the pecularities of the letterform, isolated stems, curves, angles, forms these oddities. In your latest example, look at the fill in the bottom angles of the lowercase w. There is surface flow contributed by the angled strokes whereas in the lowercase k there is less incidence simply because of the further flow down the stem. Another example is the narrow curve of the lowercase f compared to the wider curve of the lowercase r. With inappropriate presswork the shapes of the letterforms themselves contribute to the problem. If the roller direction was reversed or printed from the side the patterns would change. At the microcosmic level here, the flaring/cupping is the result of minute isolation. Note how the lower truncation of the lowercase e does not seem to suffer because of the proximity of the top curve/crossbar junction. <br> <br>Letterpress is a real pain in the •••.</p>
