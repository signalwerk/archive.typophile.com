    html: <p>Timo <br> <br>I found it very hard to follow that thread, and I'm an old letterpress dude, but Evert did steal my phototype is the dark ages of typography. Naughty boy. No problem though, I've changed my mind about that anyway. <br> <br>I could not find the concave/cupped stems reference but letterpress is a physical sculptural relief, the concave or cupped stems would be part of the surface of the type as the relief shoulder is a subsurface ink drain and would "generally" maintain an outwardly growing angle for that purpose. Letterpress ink is quite viscous and has an attraction characteristic, so it is quite problematic as it will cling to the outer surface of the letterform if the presswork is not "careful." But to answer your question, this would not be part of the "pressing" (impression). <br> <br>Problems can occur with press roller direction in regard to ink transfer (pushing of ink across the surface of the letterform). It is quite possible that a cognizant letterform design (concave/cupped) stems, would in some situations, provide a solution. But this would not have been something that would have concerned a punchcutter. Rollers were first used in 1812 and punchcutting had been going on for near four centuries prior to that.</p>
