    html: <p>Timo <br> <br>Back to your example, notice the difference in the  lowercase "k" (the one on the end is splayed as the result of taking more of a hit). The exaggeration of the letterform here is the result of a roller/ink problem. Though it could very well be a worn character or one that is standing a bit high (improperly planed or something under the type). <br> <br>Very nice lowercase "r" by the way, that widened gap between the stem and curve is quite necessary in letterpress. Someone on the PPLetterpress list was asking about a relatively new digital sans that would work well with the photopolymer process and in checking through possible faces that was the first thing I looked for.</p>
