    html: <p>Timo <br> <br>The "effect" is caused by impression and ink gain. Both are variable. Too much of either and you get this blobby mess.  <br> <br>I think though that a distinction should be made between punchcutters and those who later used the pantograph. There would be a natural compensation on the part of the punchcutter, though as Fournier is credited as saying, "It is not right to blame the letter for the fault of the ink." In other words, it is the printer's fault. <br> <br>It would not be uneven pressure as caused by impression but more an unequal lay or charge of the ink on various parts of the form. Smaller letters would get more ink than larger letters, etc. Or the reverse, larger letters might be starved when smaller letters are printing well. <br> <br>From what I can tell, very little in the way of ink trapping and letterform shaping was intentially done in type design specifically for letterpress (though it can well benefit from such concerns). There would have been an organic approach to punchcutting that might have naturally compensated but it is not until a good third of the way into the century that some thought was given to "designing" for the technical process itself. I think this comes more into play with photofilm, which presented unique problems, where optical compensation, thorns, ink traps, etc., were necessary to prevent letterform distortion during the photo process. <br> <br>I suspect some curature would provide a form of legibility at small sizes, probably why Optima performed so well in its various mechanical configurations, Linotype, foundry...  <br> <br>I have rebuilt some faces specifically for letterpress. I worked on Crystal a while back. Quite a job as this particular face has optical wizardry builit into it (particularly in the way the inline curves capture the ink, and compensate with ink gain). This was taken from foundry printed specimens and these compared to the actual metal type face at 24-pt and then adjusted further to compensate for the pecularities of letterpress printing at a smaller size. I recently received the printed piece and was relieved to see it had performed quite well. An image of the before and after follows <br> <br>Gerald Lange <br> <br><img src="http://www.typophile.com/forums/messages/30/64761.jpg" alt="Crystal reconfigured"></p>
