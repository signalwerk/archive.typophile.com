    html: <p>Timo <br> <br>Yes, paper could have a lot to do with it. Generally the best impression/inking is going to come from careful work with a dampened handmade sheet. But in most cases that is not what you are going to find. Commercial grade papers with external sizing will resist absorption of the ink, with the complication that progressively ink will remain on the form, and accompanying ink gain. <br> <br>The titling I furnished was printed dry (I assume) on Inveresk Somerset (not a paper I am all that familiar with). The printer was Sebastian Carter at Rampant Lions Press (UK). But the intention was to have the type remain open at the smaller sizes, and Sebastian did a remarkable job of holding that. It really does not provide much useful information to blow up smaller letterpress type to examine the distortions of presswork. Essentially we would be back to our specimen (which was sort of the point). The idea is to minimize distortion so that to the viewing eye the types look crisp and clean at the size intended.  <br> <br>Raph's ATF specimen would likely have been printed by some very seasoned printers on a large cylinder press with a very smooth stock paper, which would greatly have diminished the kind of problems facing contemporary fine letterpress printers who are not so well equipped. You won't really see much of this kind of quality in commercial letterpress printing in the post-Depression years. <br> <br>That little halo of lighted color that you see ringing the samples you have provided is carrier separation. The roller pressure is a bit high for the stock, and the ink is a tad too loose. This can usually be prevented by using a higher viscosity ink which will resist this tendency. Easier to say by looking at the sample though rather than having to deal with the actual configuration of the job.</p>
