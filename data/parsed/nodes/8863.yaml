    html: <p>Timo <br> <br>There is a small photo essay in Richard-Gabriel Rummond's _Printing on the Iron Handpress_ in the chapter on inking. This reveals many of the common problems associated with type and presswork. It does not get into it at the much deeper level that you are concerned with but it could help you with some of the rudimentary principles of the why. This book is still in print and likely in the collections of most University libraries.</p>
