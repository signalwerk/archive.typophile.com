      <p>DIMENSION AND TYPOGRAPHY:<br>
    A SURVEY OF LETTERFORMS IN SPACE AND TIME<br>
    ISpace Gallery, Chicago, Illinois, January 2009<br>
    <a href="http://dimensionandtype.com" title="http://dimensionandtype.com">http://dimensionandtype.com</a></p>
    <p>Digital technology has given designers greater freedom to experiment with and explore the spatial and temporal qualities of typographic form. More than a decade has passed since Abbott Miller first outlined the broad strokes of how letterforms might operate in space and time in the pamphlet Dimensional Typography. The question today is, how much further have designers pushed the boundaries of dimensional typography since Miller’s initial survey? Does dimensional typography have any implications further than simply being a formal variation on traditional typographic form, and does current work hint at what these implications might be?</p>
    <p>CALL FOR ENTRIES<br>
    The Chicago ISpace Gallery invites submissions of current experimental, unfinished, unpublished or applied work within the sphere of dimensional typography. Artists and designers are encouraged to submit works which explore type and typography in spatial or temporal form in any medium. Unpublished and experimental work is strongly encouraged. Entries must have been created within past five years.</p>
    <p>For further information or questions, email <a href="mailto:hello@dimensionandtype.com">hello@dimensionandtype.com</a> or for entry details, visit <a href="http://dimensionandtype.com" title="http://dimensionandtype.com">http://dimensionandtype.com</a>.</p>
    <p>ABOUT ISPACE GALLERY<br>
    The ISpace Gallery is located in the heart of Chicago’s River North Gallery district, an area composed of art galleries, architectural offices, furniture and other high end design retail outlets. The proximity to the Museum of Contemporary Art, Arts Club of Chicago and other cultural organizations make this area a highly regarded destination for residents of Chicago and visitors to the city alike. Ispace provides a Chicago-based gallery and a public forum for the visual, performing and design arts. Its mission is to encourage the exploration, experimentation and understanding of the arts as a vibrant expression of human experience and intellectual discourse through exhibitions, performances, classes, and lecture-demonstrations.</p>
    <p>Curated by Jimmy Luu + Ryan Molloy</p>
