      <p>I have my own Gill Sans pet-peeve that I felt I must share.</p>
      <p>When I first bought my Type 1 - directly from Monotype (back in the days when they were the only manufacturer who held the legal rights) I paid over $900 for the family. They promised me that they would never sell the family to Adobe for mass distribution.</p>
      <p>Several years later, not only did Adobe have the rights from them to produce it for all -- but they even packaged it with their Illustrator 5.5 as a bonus!</p>
      <p>I don't think I've ever forgave Monotype. </p>
      <p>But then again, so many of the original typesetting equipment manufacturers felt the "come around, go around" -- </p>
      <p>Thank you.</p>
