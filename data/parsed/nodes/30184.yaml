  html: <p>I'm curious to know what versions of Gill Sans are available. (I don't mean all the wacky variations.) I'm curious because Gill Sans is such a ubiquitous face - are all the Gill Sans I'm seeing the same as available from Monotype, Linotype, Adobe, etc? Or do Gills Sans fonts vary from foundry to foundry?</p>
