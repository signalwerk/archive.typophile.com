      <p>Patrick, when you say <em>all the Gill Sans I’m seeing...</em> which ones are you looking at?</p>
      <p>Simon's right about the creation of various one-offs, but this is not done just for technological reasons. There may be as many versions of Gill Sans as there are large-scale corporate customers who use it as a house face. For instance, Saab's corporate ID specifies Gill Sans just as the BBC does, but I'd be surprised if the agencies servicing those accounts haven't customised the fonts specifically, so there will be variations. It's not uncommon to open up a font folder in a commercial studio and see 'agency cuts' of very well-known fonts like this. Sometimes they include logos and marks specific to the client brands.</p>
      <p>In addition to this, Monotype themselves used to make a (Postscript Type 3) version of GS that had an alternate numeral 1 that could be recognised apart from the uppercase I and the lowercase l. Back in the days of metal typesetting this version had a 'f' in front of the series number. I think this convention disappeared when the font got issued as a Postscript Type 1 from the Adobe/Linotype libraries, but you'd have to check with the foundries themselves about this.</p>
