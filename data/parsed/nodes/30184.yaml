      <p>Franz – another Berliner once sent me this following image as an example of Gill Sans; it may be the Berthold 'cut' you are referring to.</p>
      <p><img src="/sites/default/files/old-images/notgillsans_6190.jpg"></p>
      <p>So, to answer the original question, yes, here is a case of Gill Sans produced by a different foundry and appearing quite radically different as a result.</p>
      <p>Tim's right to point out the difference of width in the Bitstream version of Gill Sans – but then there are major differences between Bitstream's interpretation of say, Futura, and everyone elses' versions of the 'same' Futura.</p>
      <p>Tim – I thought that alternate one version had disappeared completely! So Monotype still have it eh? But not Adobe/Linotype? Thanks for the links.</p>
      <p>Jackie – it's fair to say that the entire industry was in a state of flux back then – and not everyone honoured their promises about 'who would distribute what'. I worked for one of Monotype's resellers in the early 90s and there were a great many anguished phone calls...<br>
      (BTW, my avatar image is a handprint made by my daughter when she was aged about seven, the B is hand-drawn; I've never seen the Berkley Crime Books logo you refer to elsewhere.)</p>
