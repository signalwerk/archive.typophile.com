  html: |-
    <p>Some older texts print at the bottom right of a page the word that starts the next page. I am looking at a reproduction of a page from George Herbert's volume of poetry The Temple (the 1633 edition). At the bottom right corner of page 30 is the word "Then," sitting all by itself, and at the top of the next page is the line "Then let each houre."</p>
    <p>Two questions:</p>
    <p>1. Is there a technical name for this word at the bottom right corner?<br>
    2. Is this ever used in contemporary book design?</p>
