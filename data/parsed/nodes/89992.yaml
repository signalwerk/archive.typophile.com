    html: |-
      <p>The ever-helpful Online Etymology Dictionary traces "catch phrase" back to a political meaning of "catchword":</p>
      <p><a href="http://www.etymonline.com/index.php?term=catchphrase&amp;allowed_in_frame=0" title="http://www.etymonline.com/index.php?term=catchphrase&amp;allowed_in_frame=0">http://www.etymonline.com/index.php?term=catchphrase&amp;allowed_in_frame=0</a></p>
      <p>The interesting thing about catchwords is that they would often match the font and size of the word on the next page, within reason. So even at the bottom of a page of roman text, the catchword could be set in a large blackletter (perhaps even a second ink color) if it's the first word of a large blackletter heading on the next page. So the word actually matched very closely to how it appeared on the next page.</p>
    html_clean: |-
