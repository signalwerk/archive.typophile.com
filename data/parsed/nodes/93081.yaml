      <p>@hrant who said:<br>
      &gt;it's not so totally uncontrollable</p>
      <p>@frodefrank who said:<br>
      &gt;I’m not here to argue with you, Richard. I understand very well the nature of the web.</p>
      <p>I don't know if there's anything to argue.  There's no right or wrong here.<br>
      It's more of a perceptual thing. Understanding and accepting are two different things.</p>
      <p>The way I see it, until the rise of small screens on smart phones and tablets, web design wasn't regarded as all that different from print design. It was print design that accomodated a few different paper sizes and made some allowances for low res.<br>
      Today, there are way too many canvas sizes for that thinking to continue.</p>
      <p>This is interesting:<br>
      <em>For example, if you want a certain piece of text to end up very large, make it a large number of steps away from the smallest that has to be read: in the process of making the critical text large enough the user can't avoiding making the biggest size very large.</em></p>
      <p>I don't think anyone's yet done decent research on size ranges. What the limits are. How big should text within an h1 tag be in relation to the text in the p tag, that kind of thing. And if the user goes large on the body text, will the h1 text become useless because you are only seeing a fragment of it?<br>
      That kind of thing.  </p>
      <p>Later.....</p>
