      <p>Although things are certainly malleable, it's not so totally uncontrollable; just because some people (although not Frode) are control freaks doesn't mean anybody should strive to be a berserker hippie. For example, if you want a certain piece of text to end up very large, make it a large number of steps away from the smallest that has to be read: in the process of making the critical text large enough the user can't avoiding making the biggest size very large.</p>
