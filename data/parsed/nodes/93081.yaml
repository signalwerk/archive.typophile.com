    html: |-
      <p>I don't think what you're trying to do is a good idea. (Or even necessary. So the font looks scratchy in some environments, so what?)<br>
      In web design, everything is relative to the viewport of the device. There is no such thing as a "headline sized font". </p>
      <p>But, since you're trying to do it:<br>
      If you are sure Chrome is NOT rendering the WOFF, have you figured out which font file Chrome IS rendering?<br>
      According the spec, Chrome should be rendering the first format it finds that it supports - in this case WOFF. But you say it isn't doing that so I'm intrigued.<br>
      First, how do you know for sure that it's skipping the WOFF? And what's the test environment or environments?  (Diagnosing stuff like this isn't simple.) Chrome version what, running on what?<br>
      And if Chrome is not rendering the WOFF, is it rendering the TTF or is it rendering the SVG?</p>
      <p>I am assuming you think it's the TTF, because the SVG would render the font similarly to the OTF, I would imagine. (I stopped bothering with SVG fonts a long time ago so I haven't seen any to compare lately.)</p>
      <p>If you're stumped, I'll test the files independently for you. Let me know.</p>
      <p>Rich</p>
