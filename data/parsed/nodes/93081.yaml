    <p>I’m preparing some fonts for web use, and I wonder if anyone can shed some light on the current browser support for Postscript based WOFF files, and how one should ideally set up the CSS.</p>
    <p>I have until now done the following:</p>
    <p><code>@font-face {<br>
        font-family: 'MyWebfont';<br>
        src: url('webfont.eot');<br>
        src: url('webfont.eot?#iefix') format('embedded-opentype'),<br>
             url('webfont.woff') format('woff'),<br>
             url('webfont.ttf') format('truetype'),<br>
             url('webfont.svg#MyWebFont') format('svg');<br>
        font-weight: normal;<br>
        font-style: normal;</code></p>
    <p>}</p>
    <p>The WOFF is the only Postscript based font in the stack. Unfortunately this doesn’t seem to work in Chrome on Windows. </p>
    <p>Am I doing something wrong?</p>
