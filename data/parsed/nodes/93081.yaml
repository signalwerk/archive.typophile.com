      The details of how the browsers should process the declaration can be found here: <a href="http://www.w3.org/TR/css3-fonts/#font-face-rule" title="http://www.w3.org/TR/css3-fonts/#font-face-rule">http://www.w3.org/TR/css3-fonts/#font-face-rule</a></p>
      <p>The syntax should also be fine for delivering the WOFF font as PostScript-flavoured.</p>
