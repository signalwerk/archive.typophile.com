    html: |-
      <p>&gt;There is such a thing as a "headline sized font". It’s fracking BIG.</p>
      <p>In web design, you don't get to decide what's fracking BIG. The bigness and smallness of type is not under your control.  This is difficult to accept, I understand.</p>
      <p>You can fight against this lack of control using elaborate server-side user agent "sniffing" if that is available to you.<br>
      For example, if you detect that the user agent is Safari running on an iPad, you will know the physical size of the viewport and you can "feed" a set of default sizes accordingly.<br>
      But those settings are only a starting point. Your "design" is a recommendation that may have very, very limited influence.</p>
      <p>In web design, you've got a lot of partners. The user is one of them. And the user can effortlessly enlarge or reduce your carefully chosen "sizes" to suit their tastes. </p>
      <p>Using CSS and HTML alone, the idea of being able to specify big type or small type has become so vague and unpredictable if not totally meaningless, it's counterproductive.<br>
      If you can't predict (or detect) the size of the viewport, you can't control the size of the type. And even if you do predict (or detect) the size of the viewport, your decision is easily overriden.</p>
      <p>So, good luck with setting the "size" of your web fonts. </p>
      <p>BTW - I don't understand what you mean by "going blind over hacks".</p>
