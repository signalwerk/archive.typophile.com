      <p>Hmm. I think it was in fact a cache issue, and nothing else. I've tested it since, and it works fine.</p>
      <p><em>I don't think what you're trying to do is a good idea. (Or even necessary. So the font looks scratchy in some environments, so what?) In web design, everything is relative to the viewport of the device. There is no such thing as a "headline sized font". </em><br>
      I don't agree with that. Don't go blind over hacks! Postscript has to be the future if you want a detail rich, Opentype savvy web. Truetype is too bloated in file size for large character sets and organic lettershapes. And off course it matters if the font looks scratchy! If you don't think so, you're surely come to the wrong corner of the web. And btw: There is such a thing as a "headline sized font". It’s fracking BIG.</p>
      <p>But, to pull us back on topic (sort of), I'm still looking for answers to my two other questions:<br>
      How does the downloading of font files work in web browser -- do they pull all or only one file? And how should one ideally set up the CSS for Postscript-based webfonts?</p>
