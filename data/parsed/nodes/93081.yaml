      <p>Because, as far as I know, the only up-to-date browser that does not support WOFF is Internet Explorer, and it needs EOT files. TTF is fallback for older browsers (Fontsquirrel provides a layer of security with its Web-only setting, and I don’t know any similar solution for OTF files), and SVG is for older mobile browsers. </p>
      <p>How would you set it up?</p>
