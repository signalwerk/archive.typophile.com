      <p>I think it would be a bad thing if InDesign started to do font fallback. Font fallback is highly desirable in environments where the content (i.e. the data/information) is more important than its form (i.e. the design/typography). So I'd argue that, being InDesign a professional typesetting tool, it's very important to get typographic fidelity and therefore having things like font fallback and faux styles is undesirable*.</p>
      <p>* (Even the faux small caps that InDesign already allows is sort of an heresy for Type geeks)</p>
    html_clean: |-
