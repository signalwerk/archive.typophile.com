  html: |-
    <p>A colleague of mine faces a problem with importing vietnamese text into InDesign: a couple of characters fail to get displayed correctly. A quick test of applying different Pro-fonts on the text reveals that with each of them a different selection and number (!) of ch.s submarine.<br>
    On the other hand, the same text performes perfectly well in e.g. Apples MAIL or TEXTEDIT.<br>
    See this view of Indesign (top) and Textedit (bottom), text file and font *are the same*:</p>
    <p>– Has anyone a clue?</p>
    <p><img src="/sites/default/files/old-images/vietn_4853.jpg"></p>
