    html: |-
      <p>Make it a hidden option, activated by a password which you receive together with your Graphic Designer certificate.</p>
      <p>I still think it'd be useful. Altering existing fonts is an option, but</p>
      <p>- it takes a lot of time and effort<br>
      - you might break existing structures in the font, such as kerning and opentype features<br>
      - you end up with a unique font you cannot legally distribute -- thus, you can't send any of the original files you used it in to someone else.</p>
      <p>How does the virtual font system I imagine compare to that?</p>
      <p>- For any character not in font <em>f</em>, you should be able to specify an alternate glyph <em>g</em> from another font. Somewhere in the InDesign Glyph panel -- browse &amp; click.<br>
      - The program (InDesign, preferable) handles the replacement of glyphs; the fonts themselves are not touched.<br>
      - It's just a data table somewhere in the document; yes, anyone else using your original documents should have the same fonts, but this is already a (reasonable) requirement.</p>
