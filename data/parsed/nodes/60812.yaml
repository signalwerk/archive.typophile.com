      <p>If I save the html source of this thread, remove with vim what is above and under the text pasted above and run a script that outputs the unicode characters, I get that the Vietnamese extract contains characters in the range 0020-007A, the character 2013 (EN DASH) and the following characters<br><code><br>
      00E0;à;LATIN SMALL LETTER A WITH GRAVE<br>
      00E1;á;LATIN SMALL LETTER A WITH ACUTE<br>
      00F2;ò;LATIN SMALL LETTER O WITH GRAVE<br>
      00F3;ó;LATIN SMALL LETTER O WITH ACUTE<br>
      0103;ă;LATIN SMALL LETTER A WITH BREVE<br>
      01B0;ư;LATIN SMALL LETTER U WITH HORN<br>
      1EA9;ẩ;LATIN SMALL LETTER A WITH CIRCUMFLEX AND HOOK ABOVE<br>
      1EAD;ậ;LATIN SMALL LETTER A WITH CIRCUMFLEX AND DOT BELOW<br>
      1EAF;ắ;LATIN SMALL LETTER A WITH BREVE AND ACUTE<br>
      1EC3;ể;LATIN SMALL LETTER E WITH CIRCUMFLEX AND HOOK ABOVE<br>
      1EC5;ễ;LATIN SMALL LETTER E WITH CIRCUMFLEX AND TILDE<br>
      1EC7;ệ;LATIN SMALL LETTER E WITH CIRCUMFLEX AND DOT BELOW<br></code><br>
      and nothing else.</p>
      <p>One thing that is quite mysterious is that in line four of the first grab,<br><img src="/sites/default/files/old-images/linefour_5890.jpg"><br>
      the letter</p>
      <p><code>&nbsp;&nbsp;1EC7;ệ;LATIN SMALL LETTER E WITH CIRCUMFLEX AND DOT BELOW</code></p>
      <p>comes out correctly in the word Thiệp but not in the word Truyện.</p>
      <p>Michel</p>
