    html: |-
      <p>The support for mark-to-base (to position a single accent character to its base letter) and mark-to-mark (to position multiple accents relative to eachother) differs from one application to another. Pre-CS4, InDesign did not support it (at all, or correctly); CS4 should finally support it in full. That's from hearsay, by the way.</p>
      <p>It's also possible Textedit doesn't <em>need</em> the Opentype definitions and can simulate the compositions just by having the right glyphs in the font.</p>
