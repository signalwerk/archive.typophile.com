  html: |-
    <p>Hi,</p>
    <p>Is there any harm in allowing glyphs to overlap. If, for example, I prefer the way 'Qg' looks when they overlap, can I just leave them unkerned, or will this cause a white spot where they overlap in some applications?</p>
    <p>Thnks. jasper</p>
