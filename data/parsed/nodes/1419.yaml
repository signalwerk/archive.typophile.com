    html: "<p>If your replacing lining tabular figures with proportional Oldstyle figures how bad can the lost kerning be? Except for a few figure to period/comma kernpairs I doubt your in for much work. Adobe fonts are spaced rather well, and most Adobe fonts contain less than 300 pairs, so..... what's the problem. <br> <br>Actually the best advice I can give you is:  <br>Hire a Professional! <br> <br>Then you can do what you do best, and they can do what they do best, <br> <br>And everybody makes a few bucks and has some spare time to enjoy themselves.</p>"
