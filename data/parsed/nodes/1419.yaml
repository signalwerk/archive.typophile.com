  html: <p>I work for a small magazine and I am using Adobe Minion as a text font. My problem is that the Minion Regular style uses lining figures instead of text figures (oldstyle figures) which I feel is more appropriate for running text.  <br> <br>Now, I could just go through all 80 pages of each issue and manually change every instance of the lining figures of Minion Regular to the text figures of Minion Expert, but that seems a little inefficient.  <br> <br>So, I thought I</p>
