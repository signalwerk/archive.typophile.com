      <p>It seems to be an obvious 'clone' of Antique Olive, perhaps a slight weight modification, or maybe nothing more than a renaming of another weight. The <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/antique-olive/" rel="nofollow">URW version of Antique Olive</a> has quite a few weights, including a Light. </p>
      <p>- Mike Yanega</p>
