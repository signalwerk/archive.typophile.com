    html: <p>Yes. you would lose the ‘fl’ ligature if you generally switch off ligatures. But since CS4, InDesign lets you define <a href="http://typophile.com/node/68486" rel="nofollow">GREP styles</a>. Create such a style with ‘fi’ as a search pattern, and ‘ligatures off’ as style attribute. Hope this helps. More about the power of GREP styles over at <a href="http://indesignsecrets.com/5-cool-things-you-can-do-with-grep-styles.php" rel="nofollow">indesignsecrets.com</a>.</p>
