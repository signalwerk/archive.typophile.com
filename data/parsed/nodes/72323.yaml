    <p>Okay, apologies in advance if I missed an earlier thread in my searches, but this has been driving me crazy and I need to move on with my life:</p>
    <p>In 2005/2006 <em>Print</em> redesigned to start using a cut of what is now called Gotham Rounded for the masthead, and Lexicon for the body text. But it looks to me now that Lexicon only appears in Print as an occasional display face--in fact, maybe it's not even Lexicon any longer?</p>
    <p>No love from Identifont, after numerous attempts using different character sets and approaches, so here we are: Can anyone ID from these samples the body text face, the display text faces ('Vol. 27, No. 4', 'BACK ISSUE'), and tell me if the text 'Editor emeritus Martin Fox ...' is actually set in Lexicon, as it appears to be?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/print_sample1_6116.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/print_sample2_4144.jpg"></div><p></p>
