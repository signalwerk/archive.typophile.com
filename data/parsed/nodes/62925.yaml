    <p>:)</p>
    <p>Would you even have folios?</p>
    <p>Well, I would like them not for ordering but to hold it together. For example Page 1/3, Page 2/3, Page 3/3. It just makes me feel safer because an incomplete copy is clearly marked as incomplete.</p>
    <p>The audience are recruiters who rush through resumes are an alarming pace. From what I can gather, their eyes track the page top-left to bottom-right and if they get distracted or did not see what they are looking for, its in the bin.</p>
    <p>However, with such a short collection of pages, some folio positions just do not work. For example, if you bleed the right hand edge then Page 3/3 causes them to look for Page 4/3 and they get confused (witnessed it first hand). While that is not an immediate problem for most jobs, its clearly flawed and may reflect badly if applying for design-related jobs - so its in the bin.</p>
    <p>So where should they go? :)</p>
