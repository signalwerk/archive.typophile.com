    <p>I created a CFF flavored OTF font with TTX, and it works <em>perfectly</em> in InDesign CS4 -- when placed into ID's own private Fonts folder, that is.</p>
    <p>But although OS X (Lion) gives me the option to "Open in FontBook" on the file, it just won't appear in there ... Manually copied it into ~/Library/Fonts and it still doesn't appear in the active font list.</p>
    <p>Could it be some arcane bits settings in the various tables that makes FontBook distrust it <em>so</em> much it doesn't even pop up the helpful "errors in font" dialog? Or is it perhaps as simple as the fact that this font only contains 9 lowercase characters ...? I.e., would adding 'A-Z' and 'a-z' but setting all references to them to <code>.notdef</code> solve it? (If so, what else characters are "required" cuz that won't make it an ANSI compatible font either.)</p>
