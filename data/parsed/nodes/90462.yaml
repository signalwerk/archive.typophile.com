      <p>At least those cumbersome little tables seem to have "correct" values, now on to find what's wrong with the ones unmentioned: GSUB, and the CFF itself. I'm going to try to ditch the GSUB and see if that helps.</p>
      <p>(Hey, I <em>can</em> upload an image using FireFox!)</p>
