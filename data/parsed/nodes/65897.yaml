    <p>I don’t need Lucky Luke, just the credits. These brush capitals are very similar to the <a href="http://www.impawards.com/2005/sin_city_ver9.html">Sin City</a> logo, originally designed by Frank Miller’s brother. This could be a fan font, but I hope it’s a quality design. </p>
