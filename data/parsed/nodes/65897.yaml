      <p>Certainly agree with you there, Yves, and my Dad had a bunch of those in French as well. He lived in France for a few years before I was born and built up quite a collection of Asterix comics. Tintin too. And yes, I can’t believe how well they were translated into English. The names – Getafix, Unhygenix, Fulliautomatix, Vitalstatistix, etc, etc – are particularly memorable.</p>
      <p>Riccardo, so they have. The TV show was shown here in Australia many years ago (I remember the theme: Bang, bang a Luke-y Luke!), but I’ve never heard of any of the films.</p>
