  html: |-
    <p>The website <a href="http://www.26plus-zeichen.de" rel="nofollow">www.26plus-zeichen.de</a> offers students the posibility to examine, test, comment and present their fonts. Most of the fonts are for free. There are display fonts as well as fonts for text. Everybody who is interested in type design is invited to join the website.<br>
    The idea to the website begun at the German Fh Würzburg-Schweinfurt. Development by Jakob Runge, Max Kostopoulos and <a href="http://www.fishnation.org" rel="nofollow">Georg Fischer</a> [programming].</p><div class="imageWrap"><img src="http://typophile.com/files/26plus-zeichen_teaser_1_3471.jpg"></div><p></p>
