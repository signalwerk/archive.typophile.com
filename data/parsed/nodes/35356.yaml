      <p><cite>U+02BC […] appropriate for elisions.</cite></p>
      <p>No, according to <a href="http://www.alvestrand.no/pipermail/ietf-languages/2006-June/004742.html" rel="nofollow">Karl Ove Hufthammer</a> it isn’t.</p>
      <p><cite>Letter Apostrophe.<br>
      U+02BC MODIFIER LETTER APOSTROPHE is preferred where the apostrophe is to represent a modifier letter (for example, in transliterations to indicate a glottal stop). In the latter case, it is also referred to as a letter apostrophe.</cite></p>
      <p><cite>Punctuation Apostrophe.<br>
      U+2019 RIGHT SINGLE QUOTATION MARK is preferred where the character is to represent a punctuation mark, as for contractions: “We’ve been here before.” In this latter case, U+2019 is also referred to as a punctuation apostrophe.</cite></p>
      <p>For those who want to dig even deeper: <a href="http://www.unicode.org/versions/Unicode4.0.0/ch06.pdf" rel="nofollow">The Unicode Consortium on Writing Systems and Punctuation</a> [pdf]</p>
