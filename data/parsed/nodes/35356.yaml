    <p>Hi,</p>
    <p>I am really unsure about what symbols to use for apostrophes and quotation marks. Look at:</p>
    <p>‘This is a quote.’ and Don’t.</p>
    <p>However it soon becomes confusing:</p>
    <p>‘She said “Don’t use the same marks for quotation and elisions!” three times.’</p>
    <p>This can be solved by using the Unicode specified apostrophe mark ('). However I read on every webpage on the subject that it looks really unprofessional to use don't instead of don’t. I have been suggested to use bold quotation marks. But I mean that looks goofy.</p>
    <p>What symbols to use?</p>
