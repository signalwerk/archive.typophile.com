      <p>&gt; Canadian always uses double</p>
      <p>Not really. University of Toronto Press, at least, has long used the single quote first. The reason is it provides better typographic colour to the page. A lot of double quote marks look like some insect has crapped all over the page. The single marks are less obtrusive, and make the reading flow easier to process.</p>
