      <p><cite>So, what’s the right placement for glyph 6 and 7?</cite><br>
      It’s a unit, so: after a number. :-)</p>
      <p><cite>what’s the difference in using single quotes instead of double quotes?</cite><br>
      Sometimes you have a text with nested quotes (a quote within a quote, see Aleksandersen’s original post). Then you may want to use both to make it clear. Which one where? That’s language (and region) specific, as others pointed out before.</p>
      <p><em>Detailtypografie</em> (see above) says that this is how Italians do it:<br>
      <strong>« citazione » / «‹ citazione › annidata in citazione »</strong> (with some extra whitespace, French style)<br>
      or alternatively<br>
      <strong>“ citazione „ / “‘ citazione , annidata in citazione „</strong><br>
      Especially the latter rings hollow … Maybe <em>you</em> can confirm/disprove?</p>
