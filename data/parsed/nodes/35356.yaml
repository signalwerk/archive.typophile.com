      <p>To Florian: thanks so much (I used the glyph on the right side just to keep in mind the right proportion with the other glyphs). The tirdh glyph is not a comma but the single right quotation mark (i used FF Absara TF Bold SC by Xavier Dupré). So, what's the right placement for glyph 6 and 7? And, above all, what's the difference in using single quotes instead of double quotes? For me, single quoting get the text an ancient effect. Am I wrong?<br>
