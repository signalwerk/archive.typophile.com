      <dl>
      <dt>There are two alternatives to nesting quotes, both of which omit them.
      <p>The first is to set the quoted matter in its own paragraph, slightly smaller.<br>
      The second is to just leave out the quote marks, if that doesn't complicate the meaning of the text.</p>
      <p>De Vinne (Correct Composition, 1901) quotes the Bible, without quote marks:</p></dt>
      <dd>And he came unto his father, and said, My father : and he said, Here am I ; who art thou, my son ?<br>
      And Jacob said unto his father, I am Esau thy firstborn...</dd>
      </dl>
      <p>(I would have made that quoted text smaller, but I couldn't get the "small" tag to work.)</p>
