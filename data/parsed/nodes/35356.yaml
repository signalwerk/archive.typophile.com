      <p>These forums have a script that automatically corrects these marks, so nobody will be able to tell quite what you've tried to show us.</p>
      <p>The apostrophe is generally the the same as a closing single quotation mark. I hope what ‘she’ said is not what someone actually has been telling you.</p>
      <p>The key on your keyboard contains the so-called ‘straight quotes’, inherited from typewriters, that we use informally in computer communications; these should not be used in print except as inch and foot marks.</p>
      <p>UK usage prefers single quotes, and then double quotes for quotations nested within them.</p>
      <p>USA usage prefers double quotes, and then single quotes for quotations nested within them. It has also become popular to use single quotes for isolated terms of one or two words, e.g. above.</p>
