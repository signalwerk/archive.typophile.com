      <p>@SharQ<br>
      All the glyphs in your example are on the right side of a word, and they’re followed by white-space.<br>
      Therefore:
      </p><ol>
      <li>single right quotation mark (German style—single ones normally for nested quotations, see #4)</li>
      <li>single right quotation mark (English style)</li>
      <li>Comma (You know <em>that</em>, don’t you? Or: Can be used in Italian and Albanian* as single right quotation mark—I question that)</li>
      <li>double right quotation mark (German style—double is standard)</li>
      <li>double left quotation mark (German style—wrong placement! Or: Can be used in Italian and Albanian* as double right quotation mark.)</li>
      <li>single prime (<a href="http://www.decodeunicode.org/u+2032" rel="nofollow">U+2032</a> or <a href="http://www.decodeunicode.org/u+0027" rel="nofollow">U+0027</a> (to denote minutes, foot etc.—wrong placement!)</li>
      <li>double prime (to denote seconds, inch etc.—wrong placement!)</li>
      </ol>
      <p></p><p>Of course, there are a lot of other interpretations and possible combinations, depending on the context. Correct me if there’s sth. wrong.</p>
      <p>*) According to Forssman/de Jong: Detailtypografie. Verlag Hermann Schmidt Mainz, 2002. S.92: Fremdsprachen – Akzente und Anführungszeichen</p>
