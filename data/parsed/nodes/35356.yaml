      <p>I’m not sure why there’s any confusion about this, or why this is a Typophile thread.</p>
      <p>British usage is not “the opposite of USA usage.” Setting aside for a moment the fact that there is more than one usage in the U.K. (e.g., <cite>Monocle</cite> uses British English but double quotation marks at first instance), the differences are wider than that. British orthography places periods and commas inside quotation marks only for direct utterances and outside in other cases. U.S. (also Canadian) usage puts them inside quotation marks always.</p>
      <p>There is no distinction in Unicode between an apostrophe and a closing single quotation mark. This is a serious defect, but it will never change. There is also no way to distinguish the usages of neutral opening quote, neutral closing quote, and neutral apostrophe; they’re all one character.</p>
      <p>The example in your fifth paragraph isn’t realistic, because the whole sentence would probably not be quoted.</p>
      <p>In any event, it is invariant that you alternate double-single or single-double when nesting quotes. The only variable is which one you start off with. British tends to use single; U.S. and Canadian always uses double.</p>
      <p>All this is easily Googled or, better, looked up in Fowler’s or Strunk and White or any English-usage book.</p>
      <p>--<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
