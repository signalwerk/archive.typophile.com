      <p><cite>There is no distinction in Unicode between an apostrophe and a closing single quotation mark</cite></p>
      <p><cite>The apostrophe is generally the same as a closing single quotation mark. I hope what ‘she’ said is not what someone actually has been telling you.</cite></p>
      <p>Talking about Unicode, there are quite a few codepoints whose ‘phenotypes’ can look identical. The one bearing the name APOSTROPHE (<a href="http://www.decodeunicode.org/u+0027" rel="nofollow">U+0027</a>) isn’t one of those. And it isn’t a real apostrophe either.</p>
      <p>We got the RIGHT SINGLE QUOTATION MARK (<a href="http://www.decodeunicode.org/u+2019" rel="nofollow">U+2019</a>), which is commonly used for
      </p><ul>
      <li>guess what—a right single quotation mark in some languages, English among them</li>
      <li>an elision like don<strong>’</strong>t or <strong>’</strong>07</li>
      </ul>
      <p></p><p>On <a href="http://www.decodeunicode.org/u+02BC" rel="nofollow">U+02BC</a> we have the MODIFIER LETTER APOSTROPHE. I wonder if that would be the one Joe is missing—and the one that would be appropriate for elisions. Even if it was, the keyboard accessibility of U+02BC doesn’t go well with the frequency of the apostrophe in English language.</p>
      <p>Furthermore, there is the COMBINING COMMA ABOVE (<a href="http://www.decodeunicode.org/de/u+0313" rel="nofollow">U+0313</a>) and the COMBINING GREEK KORONIS (<a href="http://www.decodeunicode.org/de/u+0343" rel="nofollow">U+0343</a>), both for combining diacritical marks. They aren’t used in English, however they (can) look like the others and shouldn’t be confused.</p>
