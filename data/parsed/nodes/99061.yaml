      <p>I've been looking for a similar alternative for a long time. Recently I stumbled across <a href="http://www.typotheque.com/fonts/greta_text">Greta Text</a> by Typotheque. It has that boldness of Tiempos and for the most part it looks like a great solution, although I've yet to try it myself.</p>
