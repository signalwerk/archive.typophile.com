      <p>Ah, thanks, I’ll delete my Twitter reply, there’s a bit more space here.</p>
      <p>I’d like to not overplay the “newspaper” side of things – I need this to feel classy. Tiempos can ride that line, I think, but e.g. LMJ is potentially a bit too harsh/sharp/newspapery. Freight might work, it’s a bit too decorative perhaps with all these balls (I generally like it lots though). Meta Serif is a bit too German (and too ubiquitous), I think. Elmhurst is lovely but only recommended for very large sizes. Hmm. Interesting impulses, though.</p>
