      <p>Hi Nina, </p>
      <p>I've been looking for a similar alternative for a long time. Recently I stumbled across <a href="http://www.typotheque.com/fonts/greta_text" rel="nofollow">Greta Text</a> by Typotheque. It has that boldness of Tiempos and for the most part it looks like a great solution, although I've yet to try it myself.</p>
      <p>It seems really flexible with the available <a href="http://www.typotheque.com/fonts/greta_sans" rel="nofollow">sans</a> and the beautifully dangerous <a href="http://www.typotheque.com/fonts/greta_grande" rel="nofollow">headlines</a> too.</p>
