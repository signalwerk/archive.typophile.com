      <p>Hey Nina,<br>
      I answered you on twitter, but we might as well keep the discussion going here. As Tiempos has roots as a newspaper typeface, it seems fitting to keep in the tradition. Webtype has <a class="freelinking external" href="http://www.webtype.com/font/elmhurst-family/" rel="nofollow">Elmhurst</a>, Typekit has, at this point ubiquitous, <a href="/wiki/https%3A/%252Ftypekit.com/fonts/ff-meta-serif-web-pro" class="freelinking" rel="nofollow">Meta Serif</a>,<a href="/wiki/https%3A/%252Ftypekit.com/fonts/le-monde-journal-std" class="freelinking" rel="nofollow">Le Monde Journal</a>, &amp; my personal favorite <a href="/wiki/https%3A/%252Ftypekit.com/fonts/freight-text-pro" class="freelinking" rel="nofollow">Freight Text</a>.</p>
