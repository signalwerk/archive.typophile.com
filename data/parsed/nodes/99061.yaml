      <p>Hey Nina,<br>
      I answered you on twitter, but we might as well keep the discussion going here. As Tiempos has roots as a newspaper typeface, it seems fitting to keep in the tradition. Webtype has <a href="http://www.webtype.com/font/elmhurst-family/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Elmhurst</a>, Typekit has, at this point ubiquitous, <a href="https://typekit.com/fonts/ff-meta-serif-web-pro" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Meta Serif</a>,<a href="https://typekit.com/fonts/le-monde-journal-std" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Le Monde Journal</a>, &amp; my personal favorite <a href="https://typekit.com/fonts/freight-text-pro" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Freight Text</a>.</p>
