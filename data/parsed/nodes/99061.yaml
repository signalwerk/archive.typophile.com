    <p>Hi all,<br>
    I’m thinking about using Tiempos (Text) for an identity I’m working on. The wordmark is set in Brandon Grotesque, and the two look quite good together to my eye. </p>
    <p>Sadly, Tiempos is not (yet) available for web use. Can anyone recommend something similar that comes with a webfont license, and is well enough designed and produced that it can be used at (possibly slightly larger) text sizes on the web? My alternative right now is Benton Modern RE, but its flavor is not quite what I want here. </p>
    <p>What I like about Tiempos is that it feels  high-class, generous, and classy without being boring or generic… or too cute. I see a bit of Plantin in it, which is very welcome. I like the width and large x-height, and a super bonus is the “M” with the slanted stems at similar angles to Brandon. Also the fact that it has a Headline companion would be great for this project.<br>
    The application is clothing/fashion related, but more classy/conservative than extravagant.</p>
    <p>I’d love to find something that’s similar enough to Tiempos to just be substituted on the web; but suggestions for other picks that could cover both web and print are welcome too.</p>
    <p>Thanks,<br>
    Nina</p>
