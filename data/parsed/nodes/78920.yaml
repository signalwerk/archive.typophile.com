      <p>Every year, in Europe, there is a famous televised competition in which each country is represented by a performer singing a song. There is a strict rule that these songs must be original - and thus they must be songs not heard before.</p>
      <p>That rule was made somewhat less strict when a song was disqualified because it's composer was overheard whistling it in a cafeteria before the competition date.</p>
      <p>Despite the name of the competition, in addition to European countries, Israel is represented in the contest.</p>
      <p>Two well-known songs that were the winner of the Eurovision Song Contest were "Waterloo" by ABBA and "Puppet on a String" (Un Tout Petit Pantin) performed by France Gall; in that year's contest, another notable entry was "Love is Blue" (L'Amour Est Bleu) the entry for Luxembourg. Other notable winners include "Tom Pilibi", "Poupée de Cire, Poupée de Son" and "Non ho l'Età".</p>
      <p>Israel's first entry in the competition was made in 1973; the participants are the member countries of the European Broadcasting Union. Israel was the winner in 1978 and 1979.</p>
