    <p>Hello,</p>
    <p>For my assignment for Typography we need to create a large document about a certain foreign type, a famous typedesigner or the typographical fact about a certain period in the history of man. And I would like to create a book for type specialists, about the Hebrew type. Because I'm simply fascinated by it's wonderful forms. </p>
    <p>First one little problem, I cannot read it, so that's a big minus. Second, the area of Hebrew type is too big. So I have te narrow my research area a bit. Do you have any tips or any categories in wich I can narrow it down? </p>
    <p>And if yes, where is the best place I can start looking? Mayb there are some awesome links out there. </p>
    <p>Thanks in advance,<br>
    A ductch typophile.</p>
