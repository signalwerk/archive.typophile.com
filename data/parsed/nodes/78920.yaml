      <p>David,</p>
      <p>Ismar David, German/Israeli/American (1910 - 1996)</p>
      <p>Ismar David, considered one of the few graphic designers, illustrators, and calligraphers of international reputation, was a<br>
      German-born graphic artist who practiced the first third of his<br>
      professional career in Jerusalem and the remainder in New<br>
      York City. </p>
      <p>Ismar David was born in Breslau, Germany (now Wroclaw,<br>
      Poland) on August 27, 1910. At the age of fourteen, he left<br>
      school to apprentice as a house painter and varnisher. After<br>
      receiving his journeyman papers, however, he returned to<br>
      study decorative painting at the Arts &amp; Crafts School of Berlin-<br>
      Charlottenberg, where many of the finest book craftsmen of<br>
      the first part of the century taught and studied.Hans Orlowski<br>
      and Johannes Boeland were among his teachers.</p>
      <p>In 1932, at the age of twenty-one, Ismar David entered and won<br>
      an international competition sponsored by the Jewish National<br>
      Fund for the design of its honorary Golden Book. He traveled<br>
      to Jerusalem to supervise the execution of the project, and he<br>
      settled there for the next twenty years and established a studio<br>
      for interior and graphic design. </p>
      <p>Before moving permanently to the United States, Ismar David<br>
      made several visits to New York City.His first trip, in 1939, was<br>
      to work on the Palestine Pavilion at the New York World’s Fair.<br>
      In 1947, he traveled to New York to study printing methods.<br>
      With the help of Dr. Robert Leslie, he returned in 1951 to make<br>
      arrangements with the Intertype Corporation for the casting of<br>
      David Hebrew. And finally in 1952, David visited New York to<br>
      design and install an industrial exhibition for Bonds for Israel.<br>
      Ismar David emigrated to the United States in 1953, and on<br>
      June 3rd of that year, married Hortense Mendel. Ismar had met<br>
      Hortense, an associate of Robert Leslie at the Composing<br>
      Room, during his 1951 trip to New York to show Intertype hisHebrew alphabets. The two spent six years together before<br>
      Hortense died on October 9, 1960.</p>
      <p>Upon his arrival in New York City in 1953, Ismar David established<br>
      a design studio and began teaching Latin calligraphy at<br>
      Cooper Union and Pratt Institute. </p>
      <p>In the early 1990s, Ismar David continued to take on select<br>
      commissions for graphic design; however, he also expressed his<br>
      personal interest in three-dimensional form with the creation<br>
      of such objects as a folding baby cradle and a paper Elijah’s cup<br>
      and folding seder plate. Before he died on February 26, 1996, in<br>
      New York City, Ismar David produced his 1996 greeting card—<br>
      the last in a forty-odd-year series that traces the evolution of<br>
      his lettering and illustration styles, and the constant influence<br>
      of biblical themes.</p>
      <p>---</p>
      <p>Germany - Israel - USA</p>
