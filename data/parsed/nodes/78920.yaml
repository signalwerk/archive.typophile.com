      <p>The reason I mentioned the Eurovision Song Contest in passing was simply to give a reason why people could refer to Israel as part of Europe - after all, although on the continent of Asia, it is in close proximity to Europe, and is a Western industrialized nation.</p>
      <p>Outside of Europe, the ESC may not be well-known. I first heard of it because Paul Mauriat's recording of "Puppet on a String" was used as the theme music to a locally-produced TV show here in Edmonton, Alberta - so I had purchased a copy of the LP, which noted that it was a European Song Contest winner under its listing on the record label.</p>
      <p>Of course, due to language barriers, and the unpredictability of public taste, many ESC entrants, or even ESC winners, did not go on to become major international hits, even if many of them were popular in their home countries. Thus, "Tipi-Tii", Finland's 1962 ESC entry, sung by Marion Rung, was also recorded in a Swedish-language version. Finland's debut entry in that competition, from 1961, was <a class="freelinking external" href="http://www.youtube.com/watch?v=K0qrZXmpj1g" rel="nofollow">Valoa Ikkunassa</a> (Ett Ljus i ett Fönster), sung by Laila Kinnunen. Both it, and she, are fondly remembered in Finland, but outside Finland and its neighboring Scandinavian countries (Laila Kinnunen, who performed contemporary popular songs on Finnish television for many years, sang many of them in their original English; also, as she was evacuated to Sweden as an infant due to the Second World War, she had to learn Finnish as she was beginning her singing career - so she also recorded some songs in Swedish, in which she was therefore fluent) both are doubtless quite obscure.</p>
