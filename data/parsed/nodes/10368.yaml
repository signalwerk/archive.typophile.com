    html: <p>Gil <br> <br>I doubt if you will find "a rule" in regard to hanging punctuation prior to the digital era. It was more often used as an optical adjustment and not often applied consistently, in either manuscript work or in the work of the early printers. <br> <br>And, unfortunately, even though page-layout programs like InDesign provide for it, it really does need to be adjusted per differing punctuation instance and on a per face basis, which they do not provide for. You can obviously adjust it manually, but we live in a world of "button pushing," and manual adjustments, bit of an absurdity, huh?</p>
