    html: "<p>let me add: visually correct outdenting hyphen marks. <br>And: the way too much outdenting of mdashes is really a problem with InDesigns hanging punctuation feature. You always have to adjust manually. <br> <br>A good hanging punctuation feature (as Venturas) should help getting visually more even or straight columns/edges of justified text. <br> <br>This is done by taking into account the bigger whitespace around small signs of punctuation (that produces white gaps in the edge without hanging punctuation), but also its form (as with the mdash-problem: calculating only whitespace leads to way too much outdenting, so here you have to compromise). <br>In the end visually you should not notice in- or outdenting but an even gray edge without white gaps or black bulges. <br> <br>For example with the german double quote </p>"
