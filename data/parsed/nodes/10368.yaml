    html: "<p>back to the topic \"rule\": <br> <br>I found \"hanging punctuation\" in the following books: <br>James Felici, The complete Manual of Typography, 2003, p. 191 (paragraph about \"Hanging Characters\") <br> <br>\"Hanging punctuation is ... used ... to give the right-hand edge of the text block a smoother appearance. Because punctuation characters ... are graphically weak, lines that end with them appear to be slightly indented ... By letting such characters hang out somewhat past the nominal margin of the column (... the edge of the text frame), the margin looks straighter, as the characters that precede the punctuation come closer to setting flush right. <b>The idea is to find a happy medium in which the margin looks smoother but without the appearance of having whiskers, with all those hyphens hanging in space.</b>\" (bold setting by me, ms) <br> <br>A \"happy medium\" is a very fine term for what has to be achieved by the feature \"hanging punctuation\". <br> <br>I remember to have read more times about that, but at the moment can't find. I think it was in german books too and have to translate. <br> <br>One with a detailed dicussion of benefits and the too-much of outdenting is: <br> <br>Friedrich Forssman / Ralf de Jong, Detailtypografie, Mainz 2002 (but there is an improved 2nd print), p. 116-119 <br>Under the term \"Randausgleich\" (they mean more balanced justification) they discuss hanging punctuation or better well balanced justification in normal text size and display sizes.  <br> <br>Balanced justification also has to take account f j J in some fonts when they have wide horizontal strokes. (Forssman/de Jonge discuss that as well). <br> <br>(In Ventura you could even do this, just insert \"J\" in the list for hanging punctuation and specify the amount of outdenting). <br> <br>The different approach between InDesign and Ventura may result from different kind of work: <br>Ventura has been used for setting large amounts of text and books, where a sophisticated hanging-punctuation-feature is essential if you want to achieve a justification/column of high quality (or the \"invisible job\"). <br>InDesigns first jobs weren't books, and for display setting the results of its feature maybe appropriate (as I sometimes like the \"visible\" manner of its feature for emphasizing citations in quotes). <br> <br>But as InDesign (for me) is the very best application regarding typography - see it's far better justification, using open type features and so on, it would be great if its feature \"Optischer Randausgleich\" (the german name of the \"hanging punctuation\"-feature in InDesign - I don't know the english term) could get the functionality of Venturas hanging-punctuation/characters-tables.</p>"
