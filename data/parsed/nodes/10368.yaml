    html: <p>This is a great summary which shows what Ventura could do if it had OT support. But you know, even without OT support, I think I might start using it? The only real advantage I can see in InDesign is multi-line justification, and since I am never going to set anything without spending a few moments to examine each line individually anyway, it really isn't a big deal for me. <br> <br>One thing I think worth pointing out is that it is a little presumptuous to speak of 'rules' for hanging punctuation when there aren't any, and there has been so very little experience with it. When James Felici writes, using that terribly impressive passive voice, hanging punct IS, etc. he gives a very false impression. Hanging punct IS nothing at all. Hanging punct MAY BE or MIGHT BE or COULD BE. <br> <br>In other words, we have to treat hanging punct as what it really is, something quite new in typography, with which nobody has much experience, and to which we must apply a lot of common sense. Adobe has not done this, and has configured it in a manner which is not just unhelpful, but actually  harmful. If people once get the idea that there is something 'right' or 'correct' about the way InDesign does hanging punctuation, we are in real trouble. Fortunately, nobody really does seem to have that idea. What InDesign is doing with hanging punct actually does look wrong to people, hence this thread. I am very grateful to Michael for bringing Ventura back into the picture. I am just amazed that the Ventura team thought this feature through so carefully. Why aren't Quark and Adobe doing the same?</p>
