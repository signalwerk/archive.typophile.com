    html: "<p>The OpenType specification includes layout features for optical margins, which allow one to specify beginning and end of line alignment for any glyph in a font: a GPOS adjustment of left or right sidebearing. The attractiveness of this model is, of course, that hanging puctuation -- and other refinements of optical margins such as compensations for letters like A T V W -- can be dealt with in a design-specific way. The only downside is that it cannot be size-specific* for scaled type (although, obviously, could be for specific size masters). <br> <br>At present, this OTL feature is not supported in any apps, but would be a welcome addition. I suspect support is most like to appear from Microsoft's side. <br> <br>You can add support for this feature to fonts using VOLT, but the UI isn't really conducive to it because there is no way to view vertical relationship in the GPOS window or in the proofing tool. I've discussed this with MS, but I'm guessing that a dedicated little margin alignment applet capable of generating a VOLT lookup file might be the simplest short-term approach. <br> <br> <br>*Device-dependent adjustments are available for low resolutions, so there is some size-dependent support. This would be desirable for controlling the amount of hang on screen, where rounding errors may result in more or less hang than one might want at specific sizes.</p>"
