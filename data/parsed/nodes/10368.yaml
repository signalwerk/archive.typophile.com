    html: "<p>1. The only known rule for how to use hanging punctuation is good taste. <br> <br>2. My personal rule is, if you can notice it, you've gone too far. That rules out the default settings for InDesign, which push emdashes so far out into the margin that they look a piece of hair you accidentally shed onto your old-fashioned mechanical. Right gives me the creeps! <br> <br>It's easy to see why Adobe did this: if you can't see it, you don't know you have a feature, and if you don't have a feature, why would you buy the program to start with? So it's way overdone. The feature needs to be rethought. In the meantime, the only way to get good results is still by careful attention to each line of text - for those with the time to do a job right. If you don't have the time to do this, you shouldn't be worrying about hanging punctuation. It can't be done well automatically, at least not with the software we presently have available.</p>"
