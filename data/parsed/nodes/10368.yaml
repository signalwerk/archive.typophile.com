    html: <p>William <br> <br>I think Bill has given pretty much the same response as I would have. Mechanical-based global adjustments won't get you to where you want to be. It's based on the eye (and, as Bill points out, typographic good taste). The goal is to find settings that are visually correct. Invariably each glyph that is to be hung is going to require a specific adjustment. And then are adjustments for optical illusion. This is not something that can be spelled out but it can certainly be learned. <br> <br>But as Bill also pointed out, and as my old instructor used to admonish, "if you don't have the time to do it correctly, when will you?"</p>
