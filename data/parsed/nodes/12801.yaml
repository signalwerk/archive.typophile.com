    html: |-
      <p>The Euro symbol is an abomination which shouldn't be used "as is" in text setting -- actually in <em>any</em> setting. Use the euro symbol provided with the typeface you are using.</p>
      <p>The dreadful official Euro symbol can be found in <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>'s Euro Sans Regular which you can <a href="http://store.adobe.com/support/downloads/product.jsp?product=48&amp;platform=Macintosh" target="new" rel="nofollow">download for free</a>.</p>
