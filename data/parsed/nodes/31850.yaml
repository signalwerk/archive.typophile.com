    html: |-
      <p>I think a bolded <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=3&amp;displayfontid=LH.457.0.0&amp;fontRendererText=Kiehl%27s" rel="nofollow">Shelley Script</a> would be pretty close, if you used two of them to get the right mix of ascenders. Notice the non-looping 'h' ascender in Andante,  and looping 'l' in Volante, and similar K in Andante.</p>
      <p>The mismatched ascenders were the hardest feature to find.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
      <p>I think a bolded <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=3&amp;displayfontid=LH.457.0.0&amp;fontRendererText=Kiehl%27s" rel="nofollow" class="link-external">Shelley Script</a> would be pretty close, if you used two of them to get the right mix of ascenders. Notice the non-looping 'h' ascender in Andante,  and looping 'l' in Volante, and similar K in Andante.</p>
