  html: |-
    <p>Hi, </p>
    <p>I'm working on a logo for an accounting firm that I'm using the font ANNONCE  <a href="http://www.myfonts.com/fonts/canadatype/annonce/">http://www.myfonts.com/fonts/canadatype/annonce/</a> for the logotype part of it. I'd like to use a script for a monogram as a symbol to accompany it. Does anyone have any suggestions? Canada Type, the maker of Annonce, has some decent scripts to use with it, but I haven't seen anything I love yet. The letters in the monogram are H and G if that's helpful. Thanks!</p>
