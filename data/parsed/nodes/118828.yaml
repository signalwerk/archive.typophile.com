    date: 2014-09-01T16:17:00
    date_raw: 1 Sep 2014 — 4:17pm
    votes: null
    html: <p>If you're talking about a preppy monogram, just google around. Some of the circle monogram fonts even have greek support (for sororities). There's a lot of modern geometric monogram fonts, for the traditional kind try Monogram KK or Vine Monogram. There's also my own design <a class="freelinking external" href="http://www.dafont.com/free-monogram.font" rel="nofollow">Free Monogram</a> which is GPL.</p>
