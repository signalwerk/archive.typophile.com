    html: <p>As Riccardo points out most Monograms are hand done - art not a font. That said, you can use glyphs from several fonts (combine) to produce an interesting and original monogram.</p>
    html_clean: <p>As Riccardo points out most Monograms are hand done - art not a font. That said, you can use glyphs from several fonts (combine) to produce an interesting and original monogram.</p>
