    html: <p>If you're talking about a preppy monogram, just google around. Some of the circle monogram fonts even have greek support (for sororities). There's a lot of modern geometric monogram fonts, for the traditional kind try Monogram KK or Vine Monogram. There's also my own design <a href="http://www.dafont.com/free-monogram.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Free Monogram</a> which is GPL.</p>
