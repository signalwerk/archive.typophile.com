    date: 2002-06-16T16:08:00
    votes: null
    html: <p> Hi Colin, <br> <br>I like your Ebin font but you came here for critique so I've got some for ya! <br> <br>I can see how you built part of the font based on duplicating the stems to make all the ascenders but I feel it is the wrong direction to take this face. <br> <br>This type design has a quirky inconsistancy to it that should be enhanced, not normalized or homogenized. I would say put all the letters you've got on one print out and you'll see very easily which ones could use some tweaking to be more expressive and playful. <br> <br>Of the glyphs I would say there are a few that could use a redo g, k, s, and v. Also the x could use a little more weight on one end. <br> <br>Once the base font is mastered, go nuts with the other versions of the font. <br> <br>Also, even if it is free, take the time to develop the uppercase, numbers and some symbols for this font. You'll kick yourself later for not learning more from this experiment. <br> <br>Can't wait to see the results! <br> <br>Stuart :D </p>
