    html: <p> thanks for the feedback Stuart, i think you're right about taking it another step to make it more unique. And David, i'm impressed, you picked out the Ren and Stimpy influence with ease. Before i began my education as a graphic designer i was obsessed with animation and of course Spumco's stuff. When i started designing this font it kind  naturally took that direction and i went with it (note the ren like g). <br> <br>thanks again, CK </p>
