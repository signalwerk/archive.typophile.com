    <p>I'm setting up a personal blog of a friend, and helping her with the basic layout and design. Now I'm looking for a webfont – ideally available through one of the free webfont services until size dictates otherwise, the free versions Fonts.com, Typekit or Google Webfonts – that suits her style and personality.</p>
    <p>She's queer, out, proud and quite apart from traditional notions of femininity, yet with a strong spiritual side (think fire-and-brimstone inspirational preacher, but not necessarily christian), which will be the focus of the blog. (A preliminary title includes the concept of lay preacher confession.) So what I've been trying to find is a good style that manages to be both forceful and passionately warm, something that's humanist to an extent but veers away from softness, tradition and scriptiness. We looked through some libraries and she sort of liked old-fashioned American headline gothics, but I think something a bit more understated and more contemporary might be better. An angular serif, Swift-style, perhaps? Or something bridging humanist type and forceful headline sanses?</p>
    <p>Suggestions?</p>
