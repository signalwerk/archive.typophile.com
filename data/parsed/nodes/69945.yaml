  html: |-
    <p>I was at the Montreal exhibit of Louis C. Tiffany this past weekend, and noticed a very interesting (hand lettered) 'R' glyph on one of his sketches. The pencil lettering that he used to label the sketch had a great deco feel, and for the most part was beautifully precise- but one 'R' was rushed. Unfortunately, no picture were allowed, so I'll have to show what I noticed with my own quick reproduction:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TIffanyR_3716.jpg"></div><p></p>
    <p>The first 'R' to show what most of the font was like, then a version of the rushed 'R'.<br>
    Suddenly, it looks like the cursive 'r'!</p>
