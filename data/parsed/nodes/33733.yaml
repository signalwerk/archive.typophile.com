    html: |-
      <p>Most font managers are capable of collecting fonts any way you want, but unless it either refers to an included database or embedded information in the fonts themselves, you will have to make these categorizations manually, to your own specifications. This, depending on the number of fonts in your library, can be very labor intensive, but in the end more useful to you than any factory-supplied organization system.</p>
      <p>Still it would be handy to have a guide to go by. The Typowiki might be a good place to start looking for one.</p>
