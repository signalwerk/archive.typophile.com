    html: |-
      <p>Thanks for the suggestions everyone.</p>
      <p>I agree that categories are somewhat arbitrary, but I'm cool with that...50 arbitrary categories are much easier to deal with than 6000 individual fonts :)</p>
      <p>I tried fontorg and while it is a cool little app, it doesn't do anything more than what I can do with FontDoctor, which I already have.  If you don't have font doctor though, I recommend it.</p>
      <p>I tried the typowiki last night before I posted, hoping that someone had already asked this question and found a solution...but alas, nothing.</p>
      <p>I don't look forward to the hours and hours it is going to take me to sort all my fonts.</p>
      <p>Even the ability to preview fonts in Explorer would be welcome, because i could bin them that way...the unfortunate thing about suitcase is that once the fonts are sorted into groups within that program, the list of fonts within each group cannot then be exported.  If they could be, i could just write a little perl script to do the sorting into folders thing for me.</p>
      <p>My search continues.  Any Mac or Windows suggestions are welcome, as i have and use both.</p>
      <p>...Mike</p>
