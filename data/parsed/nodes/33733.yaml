    <p>Hi there</p>
    <p>I'm new here, but I have had a long love affair with my font collection.  But it does give me grief when I try to find *just* the right font for a given application.</p>
    <p>So I got Suitcase for Windows.  The thing is, I have a lot of fonts and I was hoping that the manager would be able to sort files by category...but it can't.</p>
    <p>Does anyone know of a way to either sort the files on the disk into categories, or know of a manager that can do this?</p>
    <p>...Mike</p>
