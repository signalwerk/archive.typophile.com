      <p>&gt; In any case, footnotes are for children. Grown ups use end notes. :)</p>
      <p>Yes, but wouldn't it be nice if there were both? I get annoyed with scholarly works, where 90% of the notes are reference information, while the other 10% provide additional background information that I find useful. Wouldn't it be great if the background information could be done with footnotes at the base of the page, easily accessible, and the reference information placed in endnotes where the scholars who need it could access it there.</p>
      <p>I have seen this system used once (I can't remember where) and think it would be a great addition to scholarly style.</p>
