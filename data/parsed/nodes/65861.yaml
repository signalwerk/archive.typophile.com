      <p>Numbers, among other benefits, come with built-in ordering, unlike other systems of symbols, which require establishment not only of shapes but also of conventional ordering. Sorry, Hrant, but I disagree that numbers are ‘easily confusable when they’re small’: if they're easily confuseable, then they're poorly designed, and the same could be true of virtually any small, superscript sign.</p>
      <p>In any case, footnotes are for children. Grown ups use end notes. :)</p>
