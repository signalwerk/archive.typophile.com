      <p>Great point Don! Need to keep this in mind.</p>
      <p>Kent, so I take it this sequence isn't very much in use (and hence generally known) in the US now? FWIW, it is in any case culturally/regionally specific. For German, Forssmann / de Jong's "Detailtypografie" (which is a bit of a typesetting "bible") refers to a slightly different "traditional sequence" – asterisk; 2 asterisks*; dagger; double dagger; section sign; pilcrow; parallels – but adds this is only one possibility. For up to 3 notes they simply recommend asterisks.<br>
      * Only used if more than 6 symbols total needed.</p>
      <p>I'm not sure such fading conventions should have to be reasons to stop wondering about new/better characters. Like you say, this style of annotation isn't very popular nowadays (I wonder why?), maybe new symbols could be a cool way to breathe fresh life into the idea.</p>
