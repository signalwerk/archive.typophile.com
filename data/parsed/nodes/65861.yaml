      <p>By far the most common way to cite things in academic works now is in the text, with reference to a bibliography. So you get a reference like: (Freud 1900a, p. 56), and in the bibliography you have the details on the book referred to by Freud 1900a. That's assuming you have more than one publication by Freud that year which you want to refer to. </p>
      <p>This is so much cleaner than past methods that I don't think they can compete. </p>
      <p>Explanatory notes are a different matter, and where to put these depends on the book or article as to what is best.</p>
      <p>And yes, side notes can be charming, and are under-used in books. Pull quotes and side bars are common in magazines.</p>
