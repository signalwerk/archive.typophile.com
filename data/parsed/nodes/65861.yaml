      <p>&gt;Is interrupting my paragraph with parenthetical citations really “cleaner”? </p>
      <p>Yes, here's why. Citations this way are clearly citations, and being in parentheses can be skipped by the eye. When you have everything in foot or end notes, you don't know whether they are explanatory or simply citations, so you annoyingly have to go hunting to see whether it's something significant to your interests. </p>
      <p>Where explanatory notes go should depend on the work, and the author's notion of their function, which he or she should be clear about. Then it may make sense to have them as end notes, side notes, or footnotes. </p>
      <p>I think the separation of citations and explanatory notes has been a real advance in layout of scholarly works.</p>
      <p>You could also do citations as numbered end notes, and explanations as side or foot notes. The most important thing I think is the separation of the two, whatever device you use.</p>
