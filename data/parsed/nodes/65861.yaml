      <p>Nina, as far as visual aesthetics, I think the only thing that is really problematic are foot notes. You can also mess up side notes visually, but if carefully done in an appropriate layout they can work.</p>
      <p>The issue of in-line citations VS end notes with superior figures in the text VS end notes with no superior figures to me is mainly an issue of comfort and ease of use for the reader.  </p>
      <p>On the question of comfort and ease of use in the system with no superior figures, my experience is not the same as yours. I find it obvious when a quotation or factual claim calls for a citation, and if I want it, I'll go look at the end of a book.  I'm grateful that there's nothing distracting me from the text and pushing me to look it up. As to explanatory notes, I'll just look at all the end notes before or after I read the text, and see if there is anything I find interesting. </p>
      <p>My impression is that the cleanest method is becoming more and more popular, though it is more work in producing the book. </p>
      <p>By the way, with electronic texts, you have a lot more options because of the possibility of hypertext links. That's an advantage of electronic texts, along with search-ability.</p>
