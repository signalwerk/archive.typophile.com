      <p>&gt;Not really all that easy to skip’em though.</p>
      <p>Yes it is, compared to having to go hunting at the back of the book to see whether or not you want to read the note. </p>
      <p>Ideally, you keep the form of the citation short, so you do see the opening and closing parens and the number, clearly signaling a citation. I agree that it can help to use small caps too. Practically every scholarly journal I have seen for the past 40 years uses this format for citations, and most books. What can you suggest that's better?</p>
      <p>The book I am finishing writing is littered with references to Bible and Talmud, and I'm doing all citations in small cap abbreviations, followed by chapter and verse, or Talmudic page. So these are in parens, the span of seven or eight characters. And there are no foot notes, end notes or side notes, though there are introductory notes and appendices. </p>
      <p>So I'm not stuck on the reference-in-parens style, but I am totally convinced that if you have a lot of citations, they shouldn't be mixed with explanatory notes. </p>
      <p>I think this is a matter of trying to make it easy and efficient for the reader to navigate, and both author and designer should be thinking about how to do that.</p>
