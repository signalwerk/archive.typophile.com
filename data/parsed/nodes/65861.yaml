    <p>Inspired by a cool new character invented by Nina*, I've started thinking: maybe we can design/use symbols beyond the asterisk and dagger(s) to annotate text? Sure people use numbers, but that's pretty boring isn't it? Plus numbers are easily confusable when they're small. And having two floating digits is ugly (and the reason people use a dagger instead of two asterisks). So the Challenge is to make new symbols that:<br>
    - Clearly convey that they're for annotation.<br>
    - Look good small and floating.<br>
    - Are not confusable with other annotation symbols.</p>
    <p>*<br>
    <a href="http://www.flickr.com/photos/ninastoessinger/4238222291/" title="http://www.flickr.com/photos/ninastoessinger/4238222291/">http://www.flickr.com/photos/ninastoessinger/4238222291/</a><br>
    <a href="http://typophile.com/node/65762" title="http://typophile.com/node/65762">http://typophile.com/node/65762</a></p>
    <p>I actually use custom little floating reference thingies* when I handwrite an article for splicing in additional text, but had never thought of putting things like that into fonts.</p>
    <p>* BTW, is "annotations" a good name for these?</p>
    <p>hhp</p>
