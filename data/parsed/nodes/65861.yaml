      <p><cite>"The cleanest method is where everything is in end notes with no superscript characters in the text. In this method, you have a running head above the end notes indicating which pages the notes relate to. Then before the note itself you have the page number and the phrase which has the associated citation or commentary."</cite></p>
      <p>Super clean yes; but while you're reading the text, you have to guess which section might have a note in the back! Or are you supposed to first read the text, then read all the notes, and then find and re-read the sections of the text that have notes?<br>
      I've seen/read such systems a few times, and hated it every time. To me that's a pretty good example of prettiness/«clean-ness» that comes at the expense of usability. I think this can only work (if at all; I've personally never seen it work) in a very narrow range of text genres; for example in scientific texts it might actually be problematic editorially, because in the case of citations/sources, it doesn't make it immediately clear that a given section comes from a different source. That little «alarm bell» isn't just noise; it can also help mark things that aren't to be misread as self-contained truths. Kinda like that asterisk on shop signs that say «50% OFF ON EVERYTHING*».</p>
