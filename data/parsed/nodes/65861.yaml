    html: <p>Aesthetically, I don't really like the inline citations, especially not when there are a lot of them on the page. Functionally, though, I do think they are the best approach, not least because they make it immediately apparent to the reader where a particular idea is coming from. In books with citations in footnotes or endnotes, I only occasionally bothered to look up citations; I am aware, with the inline citations, of a greater contextuality to my reading. That seems to me a functional editorial benefit, even if typographically I don't like the look of it much.</p>
