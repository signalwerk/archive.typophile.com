      <p><em>Sidenotes are less disruptive than endnotes?!</em></p>
      <p>I would think so. Consider: our vision is aligned to horizontal movement, so glancing out to the margin and back in to the text on a horizontal plane, or close to a horizontal plane, is a faster process than looking down to the bottom of the page and back up again. Good marginal notes align to the text to which they refer, and hence can often be implemented without any inline indicators. So they may be both less disruptive to reading and less disruptive to the appearance of the text.</p>
