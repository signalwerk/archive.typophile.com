      <p>For those who are not aware, there used to be a widely accepted convention for annotation symbols prescribed by <em>Chicago Manual of Style</em> (when there are few notes, or in addition to numerical note references). </p>
      <p>The generally accepted sequence (in U.S. publishing, anyway) was/is:<br>
      *&nbsp;(asterisk), †&nbsp;(dagger), ‡&nbsp;(double dagger), §&nbsp;(section mark), ∥&nbsp;(parallels), #&nbsp;(number sign). When more symbols are required, the suggestion was to use doubles (e.g. ** †† ‡‡ etc.). These were often superscripted.</p>
      <p>[Interestingly, the latest edition drops the mention of parallels and number sign -- presumably because the parallels are not commonly available in digital fonts and because this sort of annotation has fallen out of favor.)</p>
      <p>IMO, if you need more than five symbols, then really you should be using numbers. But hey, knock yourselves out.</p>
