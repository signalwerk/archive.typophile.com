      <p>Don: <em>Yes, but wouldn’t it be nice if there were both? I get annoyed with scholarly works, where 90% of the notes are reference information, while the other 10% provide additional background information that I find useful. Wouldn’t it be great if the background information could be done with footnotes at the base of the page, easily accessible, and the reference information placed in endnotes where the scholars who need it could access it there.</em></p>
      <p>When I've seen the notes split between footnotes and endnotes, it is typically the other way round. Citations tend not to take up too much space, so can be put at the bottom of the page; whereas informational notes tend to be longer (sometimes a taking up several pages in their own right). The editorial and design decision needs to be made based on the content and size of the notes.</p>
      <p>A lot of books my clients deal with have at least three kinds of annotation to deal with: critical apparatus, citations and commentary.</p>
