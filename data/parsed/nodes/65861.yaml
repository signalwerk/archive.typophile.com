      <p>Cool thread.</p>
      <p><cite>"I actually use custom little floating reference thingies* when I handwrite an article for splicing in additional text"</cite><br>
      Me too.</p>
      <p>One interesting feature of these symbols vis-à-vis numbers or alphabetics is obviously that they're not inherently sequential. So while numbers seem more practical in situations where you have lots of annotations/footnotes/etc., I would imagine that in more literary texts, and/or ones that use fewer notes (and no endnotes that are all lumped together!), a more graphical solution would certainly be a very nice option. </p>
      <p>One question is if a bit of intuitively «readable» «sequentialness» would still be desirable for annotation symbols, for example by means of repeating elements that could increase in number (lines, points…), or elements that get larger etc. But the fewer annotations you need (and the more easily the bits they refer to can be found), the less that's important.</p>
      <p>So, do we make this into a Type Battle of sorts? :)</p>
