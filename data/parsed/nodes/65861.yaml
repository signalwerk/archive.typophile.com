      <p>John, I agree with you that inline citations are a problem aesthetically. But to me superscript numbers or symbols are also even more distracting and disruptive. Because of their position to me they are like little alarm bells that tell you that you need to stop and look something up. </p>
      <p>The cleanest method is where everything is in end notes with no superscript characters in the text. In this method, you have a running head above the end notes indicating which pages the notes relate to. Then before the note itself you have the page number and the phrase which has the associated citation or commentary.</p>
      <p>Which approach is best I think depends on the nature of the text. For example, if you have a scholarly history that discusses various other historian's views, then in line citations I think would be appropriate. If you have a narrative history that goes for aesthetically pleasing story telling, then shoving all citations to the end, and keeping the text completely clean would be best.   </p>
      <p>Footnotes are the worst, because yes, Hrant, it is very disruptive on page after page to look down the page, and then have to go back and hunt down where you were in the text. And I don't think my aesthetic objection is a matter of 'modernism'; I'm not a modernist. It's just ugly.</p>
