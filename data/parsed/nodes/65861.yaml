      <p>Actually, I was thinking along similar lines, prompted by the same thread.<br>
      But I was too lazy and too slow a typer to start a new thread (and also not sure of the possible interest, but on this I was mistaken, it seems :-).<br>
      Anyway, some random thoughts:<br>
      * Typesetting text, I often need some sort of reference symbol which is distinct from the figures used for endnotes/footnotes.<br>
      * Usually I use the asterisk, which is fine for one, not so good for two (**), simply unacceptable for three ("What's that, a censored swearword?").<br>
      * The dagger, especially in sans serif typefaces, could be (conf)used to indicate a cross, meaning the (date of) death of a person (making especially unsuitable its use in conjunction with proper names).<br>
      * I often end up using (oh, the horror!) the readily available degree sign (°).<br>
      * If designers would want to insert these newly devised glyphs in their fonts, which codepoints should they use?</p>
      <p>That said, I think the sketch I made in the other thread has potential.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dagger_5860.png"></div><p></p>
      <p>I'm just not sure if I will call it Daggerism (loaning from asterism) or Daggerisk, following Altaira's suggestion ;-)</p>
