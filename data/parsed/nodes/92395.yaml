    <p>Hi,<br>
    I need to create an English/Russian publication for a company using Trade Gothic font family as their corporate typeface. I've found equivalents for the Regular, Regular Italic and Bold styles on ParaType website (namely <a class="freelinking external" href="http://www.paratype.com/pstore/default.asp?fcode=PT_NGT&amp;letter=N" rel="nofollow">News Gothic</a>) but am having difficulties finding replacements for the Extended and Bold Extended styles. Do you know any other Cyrillic typeface that could be used as a replacement to Trade Gothic, with regular <em>and</em> extended widths? Many thanks.</p>
  html_clean: |-
    <p>Hi,<br>
    I need to create an English/Russian publication for a company using Trade Gothic font family as their corporate typeface. I've found equivalents for the Regular, Regular Italic and Bold styles on ParaType website (namely <a class="freelinking external link-external" href="http://www.paratype.com/pstore/default.asp?fcode=PT_NGT&amp;letter=N" rel="nofollow">News Gothic</a>) but am having difficulties finding replacements for the Extended and Bold Extended styles. Do you know any other Cyrillic typeface that could be used as a replacement to Trade Gothic, with regular <em>and</em> extended widths? Many thanks.</p>
