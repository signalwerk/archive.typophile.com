      <p>If you are interested in Mexican food &amp; fiestas, the other thing to keep in mind for the ATypI Mexico City trip will be the 3-week molé festival in San Pedro Atocpan, in the very southern reaches of Mexico City. Last year's was 4-26 October; I can't find dates for the 2009 event yet.</p>
      <p>This site is in Spanish (I've not found a lot of info about this festival in English):</p>
      <p><a href="http://www.feriadelmole.com/index.htm" title="http://www.feriadelmole.com/index.htm">http://www.feriadelmole.com/index.htm</a></p>
      <p>Nor have I attended this. But I have tasted molés from this area, and they have been excellent. </p>
      <p>I guess I better plan on a month in Mexico City: molé festival, ATypI, then day of the Dead.</p>
      <p>Hasta luego.</p>
      <p>powers</p>
