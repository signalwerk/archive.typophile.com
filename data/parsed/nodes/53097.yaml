    <p>For those who, like me, prefer a tangible ink-on-paper calendar to the virtual/digital thing, and therefore go through the annual ritual of transferring important dates into the new year right about now, I thought it might be useful to accumulate some of the important typo-event dates worth saving for this year.</p>
    <p>I'll start with <strong>TypeCon2009: 14–19 July, 2009,</strong> in Atlanta this year. <em><br>
    (Those dates include the Tue &amp; Wed pre-conference workshops, in addition to the conference proper -- Thursday through Sunday.)</em></p>
    <p>There's another thread started already about <strong>TypoBerlin: 21–23 May, 2009.</strong></p>
    <p>Does anyone know when ATypI Mexico City is going to be? Couldn't find any information on the ATypI website.</p>
