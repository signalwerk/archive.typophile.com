      <p>Another thought, more serious this time:</p>
      <p>Organizers of events may want to think about advance polling of people to see how many think they may be able to attend. As budgets shrink, fewer folks may be able to travel. </p>
      <p>Organizers of a conference I attend every year have called it off entirely because so few university press production and design staff members have sufficient loot in their budgets to attend this year. Anticipated low attendance meant not enough money coming in as fees; the organizing press felt it was impossible to stage the conference. University presses are cutting back on travel budgets these days. I do not expect that our annual general meeting will be cancelled, but I expect attendance will be down.</p>
      <p>Institutional, corporate, and individual travel budgets are among the first to feel the knife when money is tight. I hope to go to Mexico City; ten months out I am not at all sure I'll be able to afford it. I hope enough others feel differently, and I hope the organizers can put on a vibrant event.</p>
      <p>powers</p>
