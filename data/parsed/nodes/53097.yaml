      <p>Will -- I don't know about "polling," but an anticipated drop in attendance is certainly something that the SoTA board has discussed regarding TypeCon. I don't think we would ever consider canceling TypeCon, since it remains the primary <em>raison d'être</em> for SoTA. But we've already decided not to raise our fees at all, keeping them the same as last year, in a small effort to keep the gathering as affordable as we can. Of course, travel and accommodations are always the big-ticket items.</p>
      <p>Sorry to hear that the AAUP Production meeting was cancelled.</p>
      <p>-- K.</p>
