      <p>One additional note, the typography conferences help in far-flung exotic locations seem to attract a good number of locals, as well as the usual suspects (more often than not the speakers). If the goal of the organizers is typographic education/evangelism then they don't need all of us to attend - but it does make for more fun and better parties.  </p>
