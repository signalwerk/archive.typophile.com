      <p>Such a poll would not be that hard to do, at the start. It would, I admit, be far from definitive. E-mail address lists exist for organization members and for people who have attended conferences in the past. Sending out an e-mail to the list, asking a few questions about attendance would be done easily. Toting up replies and making sense of them will be more work, though. On top of the already tough task of setting up a conference.</p>
      <p>The group I referred to that cancelled its meeting is a fairly tight-knit group of around a hundred folks, I'd guess. So that's easier. It took one e-mail from the organizer, a batch of responses, and in a couple of weeks the decision was made.</p>
      <p>Best of luck for TypeCon, TypoBerlin, and ATypI. Best of luck for everything in 2009. We need it.</p>
      <p>powers</p>
