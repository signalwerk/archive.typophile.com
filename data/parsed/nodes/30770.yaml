  html: <p>I need to analyse a series of printed adverts of the same product or company from the past to the present. I was wondering what adverts have made you stop and look. What adverts did it for you. Which ones do you think are the best and why? I have to choose just one product or company and analyse the past ads to the present and ho wthey worked in those days and have they kept up their style or status of the product and if so why? Was it a celebrity they used in those days due to the fact that he/she was famous  but could not be used today because they are ether not around or famous anymore etc. I have to analyse the style, the layouts, the message, the images etc and what they are trying to put across etc. In brief everything. Any suggestions on where to start? Benneton ads are good to analyse but anyone got any other ideas? Thanks.</p>
