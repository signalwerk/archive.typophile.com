    html: |-
      <p>Hi MissG</p>
      <p>This sounds very similar to a project called 'Zeitgeist' that appears in the History Culture Context programm in year two of the degree I teach on; students are required to analyse pictorial advertising for the same product from three different decades of the twentieth century.</p>
      <p>In that advertising practice mirrors wider cultural concerns, my advice would be to pick something that has either always been quite consistent in it's presentation (i.e. products like life insurance or holiday packages) or shows a changing public perception over time (i.e. products like condoms or cigarettes). Generally the differences in the ads, and therefore the analysis you can wring out of them, are more pronounced between the very old and the very new, so you need to choose an advertising category, product or service that's been around for quite a while.</p>
      <p>I personally think Benetton ads said everything about the advertiser and nothing about the product; at the height of Toscani's 'reign of infamy' my heavily pregnant co-worker (expecting for the first time, a pair of twins – which she was understandably apprehensive about) had to daily endure the very messy and unsettling visuals of the 'new born baby' poster and press campaign. I remember thinking how unfair that was.</p>
