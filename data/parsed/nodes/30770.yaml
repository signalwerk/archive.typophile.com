      <p>Actually the last time I stopped to talk with a year 2 student specifically about this they ended up very much more confused than they were before I offered my tuppence worth! Research like this raises all manner of questions that necessarily don't always get answered within the project scope or timeframe.</p>
      <p>I seem to remember there is a handy essay on this kind of thing in <a href="http://www.amazon.com/Design-Writing-Research-Ellen-Lupton/dp/0714838519/sr=1-1/qid=1169434747/ref=pd_bbs_sr_1/104-6251580-6773560?ie=UTF8&amp;s=books" rel="nofollow"> Design Writing Research</a> by Ellen Lupton and J Abbot Miller. The essay deals with images of race in 1960s American advertising.</p>
      <p>If you're wanting to do a gender-specific focus or look at the impact that 60s/70s feminism had on advertising I think you could profitably do a formal brainstorming session on this to see what you <em>really</em> want to look at... and it strikes me that it would be better not to try contrasting product A against product B. Good luck.</p>
