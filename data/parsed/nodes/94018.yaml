  html: |-
    <p>Hi<br>
    Can you please help me here?<br>
    How can I to write this script in volt:</p>
    <p>In fontlab is<br>
    feature ss14 { # Stylistic Set 14<br>
    script hebr; # Hebrew<br>
    lookup ss1426 {<br>
    lookupflag RightToLeft;<br>
        sub @ccmp2 qamats' @ss149 maqaf by qamats_qatan;</p>
    <p>I tried this in volt but it's not working<br>
     qamats'  maqaf -&gt; qamats_qatan </p>
    <p>Thank you in advance,<br>
    Eli Zohar</p>
