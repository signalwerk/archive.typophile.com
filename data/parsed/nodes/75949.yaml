    <p>I've been asked to do some work for a small company, and they don't have a clue what font was used to make their logo </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/whatfont_3574.jpg"></div><p></p>
    <p>It's a long shot, but does anyone recognise the font? They're unfortunately not open to a redesign, so I need to find the font sharpish.</p>
    <p>You can see it at <a href="http://www.millgate.co.uk" title="www.millgate.co.uk">www.millgate.co.uk</a> (just the font that is used as their logo)</p>
    <p>Hope someone can help!</p>
