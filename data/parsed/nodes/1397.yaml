    html: <p>The slab serif looks indeed like a lighter version  <br>of Dalton Maag's <a href="http://www.daltonmaag.com/fonts/exclusives/lexia.html" target="_blank"> Lexia</a>, and the modern face is  <br>a display version of <a href="http://www.myfonts.com/fonts/linotype/itc-fenice/ultra/testdrive.html?s=icon%20adam%20faith&amp;p=48" target="_blank"> ITC Fenice Ultra</a> by Aldo  <br>Novarese (well spotted Paul!). <br> <br>GQ Magazine being one of the big ones, it is not  <br>unthinkable that they use customized versions of  <br>these typefaces.</p>
