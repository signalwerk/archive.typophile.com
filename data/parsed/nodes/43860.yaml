    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HIERO-WEB_5151.jpg"></div><p></p>
    <p>I found this great quirky type sample called Egyptian Spur Modern in a sign etching book from around 1922 by Al Imelli called "The Book of Alphabets and Layouts." I'm planning on using this face as a starting point for a logo I'm working on. Now, I've modified existing type and created a number of hand drawn logos, but have never really attempted to vectorize a type sample from the ground up. Any advice for a type designer ignoramus? Besides the obvious, how would you even categorize this face? Any typefaces you can think of that are even close I could use for reference? If it would help, I'd be more than happy to scan all the letters. Disregard any kerning or tracking issues for now...still the scans from the book.</p>
    <p>Thanks!</p>
