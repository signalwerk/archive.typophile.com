      <p><a href="http://www.shinntype.com/beaufort.html" rel="nofollow">Beaufort</a> has some similarities.<br>
      Flange, Albertus, Alexon, Arrow, Symbol (Novarese's), etc.</p>
      <p>I'd say the trick is to manage the "pointedness" of the serifs in different kinds of terminals, so that it's never too fine or too blunt.</p>
