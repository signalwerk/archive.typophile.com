    html: |-
      <p><em>...never too fine or too blunt.</em></p>
      <p>To clarify, as I didn't express that accurately enough: what I meant was that the angle of the serif tips should be fairly consistent, not that the tip should be chopped off--although that may be a solution in some places. If the tips of the serifs are chopped off, no matter how small the cut, it becomes an issue for scaling. Novarese's Symbol, for instance, dating from the phototype era, has a serif treatment that looks sharp in text, but gets clunkier the bigger it is used.</p>
