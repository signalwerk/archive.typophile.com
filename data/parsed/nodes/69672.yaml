  html: |-
    <p>I'm pleased to announced <a href="http://kernest.com" rel="nofollow">Kernest</a>'s underlying web font serving engine - dubbed <a href="http://fontue.com" rel="nofollow">Fontue</a> - has been released under the MIT License. </p>
    <p><a href="http://fontue.com" rel="nofollow">Fontue</a> is designed to be the lightest, fastest way to serve web fonts to @font-face supporting browsers while saving bandwidth and keeping CSS clean and readable. </p>
    <p>More information at <a href="http://fontue.com" rel="nofollow">Fontue.com</a> or <a href="http://github.com/garrickvanburen/fontue" rel="nofollow">download the latest version from Github</a>.</p>
