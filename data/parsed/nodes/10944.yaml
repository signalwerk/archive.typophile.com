    html: <p>Anonymous <br> <br>Despite Stephen's admonition, I think this is an interesting exchange about something not often discussed here.  <br> <br>It's not just that design is a business, which it most definitely is, and a very competitive one. "Cost" is not specific to our culture but has been around ever since the idea of the "marketplace" and the beginning of "culture." <br> <br>But, let's say Sean liked the Goudy Thirty alt Z and used it in his client's piece. Yeah, he gets the money. But more importantly, he gets the credit for the design. And based on this, he may even pull in other work, undeservedly, in this regard. I doubt he'd actually feel good about that. <br> <br>There isn't anything new under the sun, and yes, ideas and inspiration generally come from our exposure to the work of our peers. But there is a bit of a difference in how this is working here. Its one thing to show a piece and humbly ask for a critique, its another to ask others to contribute to your work and then take credit for it. I'm sure Sean understands this based on his recent post.  <br> <br>I certainly am inspired by the work of others and will drawn upon what I find useful, but quite frankly, I would never ask someone for design advice as I don't know how I could then say the piece was my own work (for better or worse). And this has got nothing to do with money.</p>
    html_clean: <p>Anonymous <br> <br>Despite Stephen's admonition, I think this is an interesting exchange about something not often discussed here.  <br> <br>It's not just that design is a business, which it most definitely is, and a very competitive one. "Cost" is not specific to our culture but has been around ever since the idea of the "marketplace" and the beginning of "culture." <br> <br>But, let's say Sean liked the Goudy Thirty alt Z and used it in his client's piece. Yeah, he gets the money. But more importantly, he gets the credit for the design. And based on this, he may even pull in other work, undeservedly, in this regard. I doubt he'd actually feel good about that. <br> <br>There isn't anything new under the sun, and yes, ideas and inspiration generally come from our exposure to the work of our peers. But there is a bit of a difference in how this is working here. Its one thing to show a piece and humbly ask for a critique, its another to ask others to contribute to your work and then take credit for it. I'm sure Sean understands this based on his recent post.  <br> <br>I certainly am inspired by the work of others and will drawn upon what I find useful, but quite frankly, I would never ask someone for design advice as I don't know how I could then say the piece was my own work (for better or worse). And this has got nothing to do with money.</p>
