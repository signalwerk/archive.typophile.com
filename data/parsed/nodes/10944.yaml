    html: <p>Gerald, <br> <br>I agree with you on your choice of Z. It certainly would be interesting on <i>certain</i> wine labels. In France, though, people would automatically assume it was German/Alsacien wine. In the US, this is probably not the case. <br> <br>And Sean (Sean Michael?), <br> <br>I had approximately the same reaction to your first post as Gerald. This year, though, I'm giving people the benefit of the doubt and in your case it's paid off. <br> <br>Unfortunately, you gave the impression that you hadn't done any research yourself and wanted other people to do your work for you. Even worse, perhaps, you also gave the impression that you don't know much about what you are doing.   <br> <br>I think, your second post cleared most of this up. That said, I think you have a point about the amount of people looking for free advice in here. <br> <br>Good luck in your project and don't forget to let us know when you've come up with something. <br> <br>Matha. <br> <br> <br> </p>
