    html: "<p>&gt; I like how rectangular courier's lower-case z is.  <br> <br>Anonymous, are we talking about Courier, the typewriter-like font that is included as a default face on pretty much every computer ever made? The \"z\" you posted isn't a glyph in that Courier, as far as I can find. <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/courier/courier/mac-t1/24623/character/007A/CP4/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/courier/courier/mac-t1/24623/character/007A/CP4/</a> <br> <br>The \"z\" you posted looks closer to Hellenic Wide. Courier's \"z\" is much squarer. <br> <br>Many of the \"z\"s in The Hoefler Type Foundry's Proteus Project fonts are quite beautiful, especially the italics. <br> <br>Check out HTF Ziggurat Black Italic: <br> <br><a href=\"http://www.typography.com/catalog/proteus/testdriver/ziggblackital.html\" target=\"_blank\">http://www.typography.com/catalog/proteus/testdriver/ziggblackital.html</a> <br> <br>HTF Leviathan Black Italic: <br> <br><a href=\"http://www.typography.com/catalog/proteus/testdriver/leviblackital.html\" target=\"_blank\">http://www.typography.com/catalog/proteus/testdriver/leviblackital.html</a> <br> <br>And HTF Acropolis Black Italic: <br> <br><a href=\"http://www.typography.com/catalog/proteus/testdriver/acroblackital.html\" target=\"_blank\">http://www.typography.com/catalog/proteus/testdriver/acroblackital.html</a> <br> <br>HTF Hoefler Text Italic also has a lovely \"z\": <br> <br><a href=\"http://www.typography.com/catalog/hoeflertext/testdriver/italic.html\" target=\"_blank\">http://www.typography.com/catalog/hoeflertext/testdriver/italic.html</a> <br> <br>David <br></p>"
