    html: <p>&gt; he gets the credit for the design <br> <br>Not necessarily. Although it's not reasonable to give public/explicit/formal credit for every bit of inspiration a designer unavoidably gets, ethically it's expected of anybody who benefits beyond a certain threshold to state his debt, and there's no reason to assume Sean wouldn't do the right thing. To me asking isn't so bad - but pretending you didn't ask is indeed a big problem. <br> <br>And if somebody wants to actually share any resultant "wealth" that would be even more commendable. Maybe a small donation to Typophile? For example, my own membership payment here has little to do with getting yet another cool t-shirt. <br> <br>It's really all a matter of reasonable behavior, not satisfying every person and every Law out there. <br> <br>hhp <br></p>
