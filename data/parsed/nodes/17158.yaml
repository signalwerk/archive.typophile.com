      <p>/ / / / / / / / / / / / / / / / / / / / / / /</p>
    <p>Happy new year to everyone. We wish you happiness and success in 2006.</p>
    <p>As 2005 drew to a close, the good folks at Typographica released their “Favorite Fonts of 2005 - Part 1”, with 5 Village exclusives on the list. They are:<br>
    / Arrival by Keith Chi-hang Tam from Type Initiative<br>
    / Crank 8 by Greg Lindy &amp; Henk Elenga from Lux Typographics<br>
    / Flama by Mario Feliciano from Feliciano Type Foundry<br>
    / Garda by Mario Feliciano from Feliciano Type Foundry<br>
    / Litteratra by Karsten Luecke from KLTF</p>
    <p>The designers have gotten together and put together a special deal for this package of five notable type families. You can purchase the set for US$575.00, a savings of one-third off the combined price of US$865.00. (That’s a savings of US$190.00.)</p>
    <p><a href="http://vllg.com/offers.php" title="http://vllg.com/offers.php">http://vllg.com/offers.php</a></p>
    <p>This offer will be available through March 31, 2006.</p>
    <p>With best regards from the Village people.</p>
    <p>Village<br>
    168 Second Avenue #253<br>
    New York NY 10003<br>
    USA</p>
