    votes: null
    html: |-
      <p>When the University of Oregon rebranded more than a decade ago, Melior and Akzidenz Grotesk were the two official university typefaces (the O mark is custom).</p>
      <p><a href="http://des.uoregon.edu/getting-uo-fonts-1" title="http://des.uoregon.edu/getting-uo-fonts-1">http://des.uoregon.edu/getting-uo-fonts-1</a></p>
      <p>I was also able to get my hands on the U of O Athletics Style Guide, and they actually distribute the wordmarks that match this type as vector files. The font is is not commercially available.<br>
      <a href="http://uomarketing.com/pdf/Athletics_Grahpics_Guide.pdf" title="http://uomarketing.com/pdf/Athletics_Grahpics_Guide.pdf">http://uomarketing.com/pdf/Athletics_Grahpics_Guide.pdf</a></p>
      <p>According to one of the databases I ran the sample through, the typeface is an 88% match to Akzidenz Grotesk, so I suspect the folks at Nike—who designed the font, whose official name is OregonUniversity (no space)—may have used one of the official university typefaces as their starting point.</p>
      <p>To recreate the look, Ryuk's suggestions above are a good starting point. You could also mix and match Akzidenz Grotesk with the N and parts of the E from House Industries Girard Sky Upright:<br>
      <a href="http://www.houseind.com/fonts/girardfonts" title="http://www.houseind.com/fonts/girardfonts">http://www.houseind.com/fonts/girardfonts</a></p>
