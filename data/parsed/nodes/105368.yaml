    html: <p>Bellotti Bold is one font, but this one is another. The Bellotti Bold is ONLY used on the numbers within the current football jerseys. The University of Oregon should had named this modified Handel Gothic-like wordmark font something else before the Bellotti Bold had existed.</p>
