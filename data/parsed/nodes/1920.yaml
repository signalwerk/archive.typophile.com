    html: <p><i>I don't think Sabon Next is a better choice than AGaramond. It's very contrasty and hard on the eyes. The Display version is just a bit too light at 11 point, but the Regular is way too dark.</i> <br> <br>Well, you shouldn't be using the display version at 11pt anyway, but if the regular seems too dark this may simply be the way your printer handles it. In print, i.e. offset printed at 2400 or 3600 dpi, the regular is not too dark at all; in fact it can be a little light. I still think it is the best Garamond revival. Of course, I have a soft spot for <a href="http://www.myfonts.com/fonts/tiro/1530-garamond/">1530 Garamond</a>, but it is probably too authentic for daily use.</p>
