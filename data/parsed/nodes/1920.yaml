    user_image: /files/pictures/picture-1262.gif
    date_raw: 2 Nov 2003 — 7:12pm
    date: 2003-11-02T19:12:00
    votes: null
    html: <p>a. Sabon Next. <br>b. Sabon Next. <br>c. Sabon Next. <br> <br>An alternate choice for the display size would be 1530 Garamond, but it isn't for sale at the moment. <br> <br>Apparently Adobe may yet release Robert Slimbach's magnum opus Garamond revival, which has been in the works for more than ten years. <br> <br>For me, one of the principal criterion in selecting a Garamond would be the italic. I'd want an italic based on Garamond's not Granjon's. That said, I'm currently reading a book set in Linotype Granjon, and rather like it.</p>
  - id: 15229
    user_id: 909
    user_name: Thomas Phinney
    user_path: null
    user_image: /files/pictures/picture-909.png
    date_raw: 2 Nov 2003 — 7:34pm
    date: 2003-11-02T19:34:00
    votes: null
    html: <p>I was surprised that nobody had mentioned Sabon, Monotype Garamond or Berthold Garamond. <br> <br>I'm not surprised that Stempel Garamond rated highly, but I have to say that I'm not overly fond of it. I think it is just too "chiseled" for my taste as to what I want as a book face. There are even more chiseled looking faces that I like plenty, but not for book text. <br> <br>I would also note that as a typeface design, Adobe Garamond Pro (OpenType) is essentially the same design as Adobe Garamond. <br> <br>Normally I can't comment on unannounced projects, but Rob's Garamond revival is one that we have actually previewed in public. I will say that it is his top priority major project. I can't comment on a timeline, but it's getting plenty of attention and I don't expect it to end up on the back burner again. <br> <br>a) Since I always have all Adobe typefaces, the one I'd go out and buy would be Sabon Next. <br> <br>b &amp; c)  Can't answer at this time. Would have to do a more careful evaluation of Sabon Next, and will soon be competing with our new project. <br> <br>Cheers, <br> <br>T</p>
  - id: 15230
    user_id: 2551
    user_name: abarwick
    user_path: null
