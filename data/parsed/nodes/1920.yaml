    date_raw: 2 Nov 2003 — 7:37pm
    date: 2003-11-02T19:37:00
    votes: null
    html: <p>I don't think Sabon Next is a better choice than AGaramond. It's very contrasty and hard on the eyes. The Display version is just a bit too light at 11 point, but the Regular is way too dark.  AGaramond seems just right, at least on my particular laser printer, but you have to use it at one-half point larger size to match Sabon Next.</p>
