    html: "<p>And finally I got around to the tally. <br> <br>Adding up the conversation after the initial report the results are thus: <br> <br>Stempel Garamond -  4 endorsements  <br>Adobe Gramond - 3 endorsements, 1 mention  <br>Garamond - 2  <br>Garamond Pro OTF - 1 <br> <br>and additionally: <br> <br>Sabon Next - 2 endorsements (one specifically for text, display and addition to personal library) <br>Berthold Garamond - 1 endorsement <br> <br>So the standings remain pretty much the same but the really great thing is the mention of many others that we may consider in selecting a Garamond: <br> <br>1530 (Tiro Typeworks) <br>ATF Garamond (metal) <br>Augerneau <br>Founders Garamond <br>Jannon Text Moderne (Storm)  <br>Monotype Garamond <br>Sabon <br>Valdonega Jannon (Not for sale) <br>Valdonega Garamond  (Not for sale) <br> <br>Thanks everybody!</p>"
