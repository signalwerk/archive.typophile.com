  date_raw: 2 Nov 2003 — 6:51pm
  date: 2003-11-02T18:51:00
  votes: null
  html: "<p>Well, they don't really. The mention of Garamond is frequent (to put it mildly) but there isn't a lot of actual endorsement. <br> <br>Three threads contained actual endorsements of particular Garamonds: <br><a href=\"http://www.typophile.com/forums/messages/30/11541.html\">20 Typefaces to start a designer's career</a> <br><a href=\"http://www.typophile.com/forums/messages/30/6318.html\">If you could only use 5 typefaces</a> <br>and the even more stringent <br><a href=\"http://\">Only One Typeface</a> <br> <br>The results: <br> <br>Stempel Garamond - 3 endorsements <br>Adobe Gramond - 3 endorsements, 1 mention <br>Garamond - 2 <br>Garamond Pro OTF - 1 <br> <br>And that includes a single person endorsing both Adobe and Stempel. <br> <br>Now this is an afternoon of combing threads (about 20 or so out of 148 of them), so it looks like I'm at the point of diminishing return. <br> <br>I'd like to ask some specific questions and see if we can't get a better measure. <br> <br>Which Garamond <br>a. Would you buy for your own type library? <br>b. Would you set a book or long text in? <br>c. Would you set at display size? <br> <br>Be specific. Let 'er rip. I'll tally the results in a few days. <br> <br>Jon</p>"
comments:
  - id: 15228
    user_id: 1262
    user_name: John Hudson
