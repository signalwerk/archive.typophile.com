    html: "<p>I found strange to decide that a particularly weight of a particularly typeface is too light or too dark after tests on a particular laser printer. <br> <br>For example: to my experience, Apple laser printers give very bold type when HP laser printer give the reverse. <br> <br>And, specially, when the final output is offset litho, on a particular paper, what you've got on a laser printer is irrelevant at all. <br> <br>If I comeback to Garamond question, I can say that Adobe Garamond was my prefered Garamond until I discovered that the general effect is too wide and too Italian compared to original French Garamonds (from the various original books I had in hands from Estienne and others at the Imprimerie Nationale). Then, Stempel one, despite its angular shapes and Berthold Garamond despite not very available today as before, seems booth better. <br> <br>(don't miss Augereau designed couple of years ago, another good one -- but a bit decorative on some forms). <br> <br>I can't comment on Sabon Next for obvious reasons.</p>"
