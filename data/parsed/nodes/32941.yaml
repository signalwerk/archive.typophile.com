    <p>In a thread today I wanted to refer to John Downer's ideas about revivals etc which are available here:</p>
    <p><a href="http://www.emigre.com/Editorial.php?sect=2" title="http://www.emigre.com/Editorial.php?sect=2">http://www.emigre.com/Editorial.php?sect=2</a></p>
    <p>But before I found them there I went looking in the wiki for some shorter possibly more general treatement of the ideas ( many of which were in use before his article) in some form there. I could not find anything at all. Which seems really silly. I started to think about working on it myself but then I realized I aught to chat with the many &amp; sundry about it before I tried. </p>
    <p>So here is my proposal : It seems like some set of categories ( heavily indebted I suspect to John Downer) would be reall useful to have in the wiki. I am not keen on using his categories 'as is' in part because that seems like stealing, but also because that would be lazy. We aught to come to a consensus of our own. This does not preculude using his work as a point to jump off from. To that end here is his list: </p>
    <p>Revivals/Recuttings/Reclamations<br>
    Anthologies/Surveys/Remixes<br>
    Knockoffs/Clones/Counterfeits<br>
    Reconsiderations/Reevaluations/Reinterpretations<br>
    Homages/Tributes/Paeans<br>
    Encores/Sequels/Reprises<br>
    Extensions/Spinoffs/Variations<br>
    Caricatures/Parodies/Burlesques</p>
    <p>What do you think?</p>
