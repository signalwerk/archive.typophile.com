    html: <p>Personally, the only 'revival' categories I find enlightening are 'reproductions' vs every other kind of adaptation of an old design. Reproductions are an attempt to faithfully revive a typeface in a different medium. With every other kind of interpretation or adaptation, I find it most useful to understand what was the purpose of the designer was. That goes beyond categories, and gets to the individual typeface design.</p>
