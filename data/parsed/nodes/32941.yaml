      <p>eben, i think this is a noble undertaking, but it reminds me of <a href="http://typophile.com/node/30080" rel="nofollow">my own experience</a> with trying to come to terms with classifications. that is not to say that we shouldn't try to classify things and that multiple systems can't coexist. i think <a href="/wiki/typeface%20classification%20schemes" class="freelinking" rel="nofollow">classification systems</a> are useful, but at some point they all break down. but not trying to derail your topic, i think that many of Downer's terms are generic enough to use without getting into trouble. My own preferences would probably be:<br>
      revivals<br>
      anthologies<br>
      clones<br>
      reinterpretations<br>
      homages<br>
      ???<br>
      extensions (variations seems to me to belong more with reinterpretations)<br>
      parodies</p>
      <p>this may still be too many, for example, aren't parodies simply exaggerated reinterpretations, for example would Farnham be a reinterp or a caricature of Fleischman?</p>
