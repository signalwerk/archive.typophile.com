      <p>i think "interpretive" is a very valid category, but i don't think revivals or clones are meant to be interprative in most cases whereas reinterps, homages, anthologies and variations intend to depart from their source.</p>
      <p>so i might do it thusly:</p>
      <p>I. Naive/Non-historical<br>
      II. Intentional/Historically Grounded<br>
        A. Novel/New Design<br>
        B. Literal<br>
           i. Revivals<br>
           ii. Clones<br>
        C. Interperative<br>
           i. Anthologies<br>
           ii. Homages<br>
           iii. Variations<br>
           iv. Reinterps</p>
      <p>although, i might collapse Anthologies/Homages and Variations/Reinterps to 2 categories.</p>
