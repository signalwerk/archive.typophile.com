      <p>I guess what I was getting at here ( or trying to ) is that typeface design exists outside of John's categories too. One area outside of John categories is novel design. Admttedly there isn't much of it &amp; some might argue that even a novel design is only just so novel if it can be read... but I think it's a valid construct for the purposes of discussion. I also think that an area unexplored by John's categories is with the how aware the designer is of type already and specifically with the form they are working in. For example Template Gothic was basically a new design but the designer was ( I supect) grounded in some type history. But if you have for instance a student &amp; they start making type out of squares &amp; half circles they may or may not be aware of the hitorical prescedents - and assuming they are not; they may make what is essentially a naive design which looks derivative but is non-historical in conception. As I say these are rare instances for the most part but it we are building a hierarchy of categories maybe these aspects should have a place in it. Maybe not. </p>
      <p><cite> might move revivals up one level </cite></p>
      <p>Maybe so. I was imbivalent about creating a category with subcats. Maybe the Super catgory 'Interpretive' isn't helpful.</p>
