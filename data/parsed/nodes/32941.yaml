    html: |-
      <p>Eben --</p>
      <p>Re: Anthologies -- I believe what John had in mind are designs like Matthew Carter's Galliard, which MC has stated was not an attempt to recreate any one specific Granjon typeface, but an amalgam or distillation of various Granjon characteristics based on long and careful study. </p>
      <p>The same could be said, to a certain extent, of Robert Slimbach's Adobe Garamond, which again was not an attempt to recreate a specific font of Garamond's, but a distillation of various Garamond sizes and characteristics. (This is the case with Carol Twombly's Adobe Caslon also.) In contrast, the later Garamond Premier is Slimbach's return to the same source material with the intention of a much more faithful revival of specific sizes of Garamond's fonts. </p>
      <p>-- K.</p>
