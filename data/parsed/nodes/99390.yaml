      <p>Not hinting at all.  It has to do with the metric data, and ascenders and descenders. I'm guessing that you've only tested it with Adobe products. I see that the Win Descent entry is zero. Fixing that (or letting FontLab set the metrics automatically) solved that problem here.</p>
      <p>This site has an excellent article (in pdf form) about setting metrics:<br>
         <a href="http://kltf.de/kltf_otproduction.shtml" title="http://kltf.de/kltf_otproduction.shtml">http://kltf.de/kltf_otproduction.shtml</a></p>
      <p>Again, blogs are rarely used here (look at the posting dates) and don't show up easily in Typophile's pages - most people go straight to the Forums.  If you move (or copy) this topic to the Critique forum, you'll get much more and better responses. I just happened to find your original post because I was aimlessly browsing; and found your response only because it showed up under "My posts" because I had posted to this topic.</p>
      <p> - Herb</p>
