    <p>I have finished the basic design of Shket and I'm looking for testers and critique. I'm specially interested in checking glyphs and diacritics for not so common (for me at least) languages as Swedish, Norwegian and so on. The font currently has 406 glyphs including cyrillic alphabet.</p>
