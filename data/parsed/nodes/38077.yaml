    <p>I’m working on a Logo for marketing services company: Energy Communicates. Mostly to devise and establish annual event, and sponsorship plans, as well as public relations and conference organisers. Most of their clients are corporate sector.</p>
    <p>The client wanted a logo with cingularesque look, like abstract views of a meeting or people communicating. They also wanted an appealing and charismatic shape.</p>
    <p>The logo: The clients wanted a personality / human feel, not just another marketing firm or a brand management not as they exist on data sheets but in peoples minds. The two shapes an ascending joined piece, meeting or people communicating...facing each other on positive right direction, only to show ascension, growth, positivity, forward etc. </p>
    <p>I’d appreciate suggestions on how can I tighten it up the logo so it holds together as a unified form? I feel something is missing or how can I infuse it with a bit more energy?</p>
