      <p>The YouTube of fonts? To heck with that! I wanna be the Axl Rose of fonts. But that doesn't mean that it is going to happen :(</p>
      <p>There are so many "solutions" to the problems of font embedding on the web. But none of them solve the actual problem. Fonts in webpages is an IP issue, not a tech one. Designers—and the people who pay designers, as well as the people who manage and distribute their work—have to want a specific solution(s) to work. Then we can play ball.</p>
