    html: |-
      <p>Screen fonts are the red-headed stepchild of the font industry. Still.<br>
      You cannot even view an accurate sample of so-called "screen fonts" online even though Internet Explorer for many years has had the capacity via EOT and @font-face to do so without, at the same time, also handing over the entire font file in the process. (Bitmaps are horribly inaccurate for determining how a browser will actually render a font at different sizes.)<br>
      I'll be interested when Ascender/Microsoft, Adobe, and Monotype sign on to provide fonts for this.<br>
      Until then, it's smoke. And IMHO - they'll fail big time. They'll find out it's not just about obtaining license agreements and transplanting fonts designed (whether consciously or not) with print in mind and slapping them up onscreen.</p>
