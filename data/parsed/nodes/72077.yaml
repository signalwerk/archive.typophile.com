    html: |-
      <p>Instead of Adobe Caslon you could use as well Williams Caslon, which is a very well done reinterpretation of Caslon. It is also the Featured Face right now. <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/characters/" rel="nofollow">Williams Caslon</a>. For headers you could use <a class="freelinking external" href="http://www.fontbureau.com/fonts/BigCaslon/" rel="nofollow">Big Caslon</a> then or Sumner Stone <a class="freelinking external" href="http://www.stonetypefoundry.com/arepooverview.html" rel="nofollow">Arepo</a>. </p>
      <p>Anyhow depends on how far the medievalness of your book is, have a look at Andron font, which is a fantastic font for everything where you need historical characters/signs/glyphs. <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=69&amp;changelang=2" rel="nofollow">Andron</a>. Or the free font focused on medieval, but it only has a roman face, no italics, no bold: <a class="freelinking external" href="http://scholarsfonts.net/cardofnt.html" rel="nofollow">Cardo</a>.</p>
