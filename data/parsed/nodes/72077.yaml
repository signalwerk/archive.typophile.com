  html: |-
    <p>I'm currently slated to tackle my first book design and am looking for recommendations for interior typefaces. It is a fiction novel focused on teenagers playing baseball that has a strong medieval undertone. </p>
    <p>I've got a couple in mind and pulled others from internet searches but was curious what insights the Typophile community might have. For chapter headers I'm looking towards something with a nice set of alternate glyphs -- Adobe Caslon Pro being a good starting point -- so something that might complement that type of character set well.</p>
    <p>What do you guys think?</p>
  html_clean: |-
