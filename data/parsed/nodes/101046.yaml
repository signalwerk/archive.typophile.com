      <p>You should not have any problem if you just follow the pattern of any standard Hebrew font and put your glyphs in the Unicode range 0590-05FF.   </p>
      <p>I can't understand what you are referring to by upper/lower case.  </p>
      <p>Some info on how Unicode does special Yiddish things is at</p>
      <p><a href="http://world.std.com/~yv/uyip/combinations.html" title="http://world.std.com/~yv/uyip/combinations.html">http://world.std.com/~yv/uyip/combinations.html</a></p>
