    html: |-
      <p><em>I would prefer to go with a san serif font.</em></p>
      <p>They are literate teens, not pre-schoolers.<br>
      Don't you think that a serifed type would be more appropriate for print (I presume) articles of this length?<br>
      If you're worried about it not looking young or trendy enough, it's not really the job of the text type to convey that quality -- although the way it's set does have some bearing on the matter.</p>
