    <p>I've read many of your insightful takes on this subject-- so I apologize for the overlap with some other threads!</p>
    <p>I am not a type expert, but I need a good readable body copy font for 400-800 word articles written for and by teens. I would prefer to go with a san serif font.</p>
    <p>Right now, i am debating between Gotham, News Gothic and Calibri. What do you guys think would read and look the best for a teenage demographic? </p>
    <p>Any other suggestions?</p>
    <p>Thanks so much!</p>
    <p>First-time poster</p>
