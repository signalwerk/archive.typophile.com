  html: |-
    <p>Hi. I'm looking to see if anyone can help me ID the font used here:</p>
    <p><a href="http://www.semanticarecords.com/" title="http://www.semanticarecords.com/">http://www.semanticarecords.com/</a></p>
    <p>It doesn't look like a default web font due to its modular composition, and the fact that the page source code's only CSS class with font settings are like so:</p>
    <p>.Estilo5 {font-size: 10px}</p>
    <p>..which is not a web font. Seems to be part of a custom font markup tool. I've also looked all over the web for a typeface with any variation of "estilo5", and nothing comes close to looking like it.</p>
    <p>Any pointers would be greatly appreciated!</p>
