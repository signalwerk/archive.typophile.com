      <p>Just curious what the planned application will be? I don't imagine this being a very useful/easy to read text copy. Are you creating a logo with it? If so, I'd recommend going the extra step and reproducing it by hand with real ink and brushes.</p>
      <p>I did a basic brush script search at myfonts and came across some designs that are similar:</p>
      <p><a href="http://www.myfonts.com/browse/foundry/andinistas/" title="http://www.myfonts.com/browse/foundry/andinistas/">http://www.myfonts.com/browse/foundry/andinistas/</a><br>
      <a href="http://www.myfonts.com/browse/foundry/misprinted/" title="http://www.myfonts.com/browse/foundry/misprinted/">http://www.myfonts.com/browse/foundry/misprinted/</a><br>
      <a href="http://www.myfonts.com/fonts/p22/vincent/" title="http://www.myfonts.com/fonts/p22/vincent/">http://www.myfonts.com/fonts/p22/vincent/</a></p>
      <p>Most of these seem like grunge/brush scripts.</p>
