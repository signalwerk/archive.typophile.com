    html: |-
      <p>I certainly agree with you that the titles were made from an existing font and were not bespoke.</p>
      <p>There is a plethora of Arts &amp; Crafts style fonts such as this one. It seems a new one pops up every couple of days! I have an extensive accumulation of them, but without a match to this.  Nick Curtis has produced quite a few, as have others. I just happened upon a new one today (Elega by Neal Fletcher). Some, like your sample, have high crossbars, some low, some mixed, some double. Some have curved stems, some have crossbars that cross the stem. There's a continuum of varieties that approach the Plaza and Andes typeface families, and may be described as anything from Art Nouveau to Art Deco and more.<br>
      For some examples, google images for "Arts and Crafts" fonts (WITH the quotes)</p>
      <p>I'll keep looking, and hope that others do to.</p>
      <p> - Herb</p>
