    html: |-
      <p>Gotham is super-legible small, and it is pretty new and useful.<br>
      Metron (another transit typeface) is another highly legible one.</p>
      <p>Between the two, I would say Metron can go the smallest: it has good ink traps, a pretty large x-height, and the counters are ovoid, so it is also a better space saver than Gotham. The problem, however, is that it is nowhere to be found on the Storm Type site, except in the 'best-sellers' list, whereupon clicking the link brings you to a mostly blank page with no information. I got mine with the Storm Open Library CD. Anyone know where to find it?</p>
