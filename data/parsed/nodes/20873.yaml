    <p>Hi,</p>
    <p>I need to find a sans-serif font that can be read well at a small size.... any suggestions would be greatly appreciated (to be used on a smallish card holding alot of info)</p>
    <p>- any tips on pt size vs leading would also be very helpful</p>
    <p>Thanks in advance!</p>
    <p>Isaac</p>
