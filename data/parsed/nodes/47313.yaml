      <p>Although I could read each example of the Cherokee Syllabary easily, I kind of liked the Agamemnon type a little bit better because of its unique designs of some of the symbols.</p>
      <p>In the early ninties, I worked with a man who developed a font for use by the Mac and, as I mentioned in an earlier post, it was very easy to use. One could type in the sounds and it would come up in the syllabary. It was easy to use and quick but it kept some folks from learning to read and write it. It was too easy to use. A person didn't really need to know how to write in Cherokee to type it up on the computer.</p>
