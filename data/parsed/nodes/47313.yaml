    html: |-
      <p><cite>I’m confused. In your first pararaph you say that fonts aren’t the problem, but it seems to me that in your fourth paragraph you are saying the opposite.</cite></p>
      <p>Sorry, I wasn't clear. Or precise . . . or both.</p>
      <p>When I said "I don't think we need new fonts," I should have said I don't think we need new typefaces. I don't think there is anything wrong with setting Native American languages in Arno, or Quadraat, or any good font for the text. You shouldn't pick a font to try and make the text "look Native American" -- certainly not at the expense of that text. (I once worked with a designer who didn't want to use a "European looking" font for Lakota, so she picked Goudy Sans. Far as I'm concerned, that doesn't look good for anything.)</p>
      <p>While the typefaces may be OK, the fonts aren't. If you don't use OpenType, you have to used hacked fonts. And even if you do use OpenType, you have to make up either characters or features; probably both. As it happens, I spent the afternoon working on Arno, so as to use it for a text with Nahuatl.</p>
      <p>But typesetting isn't the only or most important issue. Unless there are text editors that allow the needed characters to be typed relatively easily and to appear close to correct, no one who writes will use them. I know one author who uses an ancient WordPerfect system because his manuscripts look better that way. Never mind that converting these files for typesetting is an hair-pulling, expensive chore.</p>
      <p>And while Omniglot &amp; Wikipedia &amp; etc. don't get the details of Native American languages quite right, this just points up the problem. Nasalized vowels in Kiowa really shouldn't be underlined, they should have macrons below. The glottal stop in Apache is an apostrophe, but it is a "typographer" apostrophe (U+2019), not a ASCII apostrophe. Etc.</p>
      <p>I'll allow that's a semi-elitist viewpoint. At some level, if people use underlines and ASCII apostrophes because they are there and relatively easy to use, maybe that will become the preferred orthography.  </p>
      <p>My guess is something like this is what's happening with Cherokee. The Cherokee Museum already owns, and will continue to use MS Word on a PC. For them, the cost of just one copy of InDesign would mean not doing something else, and I would guess they feel the time needed to learn InDesign would probably be better spent on something else as well. They have already bought Linguist Software Cherokee (hacked Type 1 font), and have learned to use it. Why change? Upgrades cost money. Most material isn't "typeset" anyway. (I'll not comment on the Official Cherokee font, though if you look at <cite>Signs of Cherokee Culture: Sequoyah's Syllabary in Eastern Cherokee Life</cite> you will notice that the Cherokee not supplied as art was set in a different typeface.)</p>
      <p>So, there is this tension between those of us who care for the aesthetic presentation and those who are trying to increase the use -- hence ease of use -- of these languages.</p>
