      <p>Joseph, is it possible for you to post a link to the 'very thin font' that you have made, or at least to a PDF of it, so that this can serve as a guide to type designers thinking about new styles? One of the things that is frequently a problem for designers encountering a new script is discerning which features are essential to the identity of a sign and which are particular to individual styles.</p>
      <p>With regard to feedback from the community, I think my own approach -- if I ever find time to work on my ideas for a Cherokee type -- would be to make a set of representative glyphs covering, say, ten syllables, demonstrating the principal characteristics of the style, then seek feedback on these. I presume you would be able to facilitate this sort of review by members of the community (elders, of course, but also those who are most likely to use the new styles of type).</p>
