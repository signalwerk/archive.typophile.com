      <p>Jason:<br>
      &gt;<em>It would be nice to see it in a longer text as opposed to this letter-by-letter display.</em></p>
      <p>I was revisiting this thread and noticed I had overlooked this wish, realizing I could oblige.</p>
      <p>Below is a snippit of text which shows the cursive version of the syllabary underneath the same text in "regular" syllabics (the upper being Huronia).</p>
      <p><img src="/sites/default/files/old-images/huronia_cursive_3611.png"></p>
      <p>This is pretty rough, and is just the first step in my analysis of the cursive form for adoption as either an "italic" or perhaps an italic stylistic variant which I am considering working into Huronia. In any case, what is shown is unrefined and quite close to Sequoyah's original, although I've adjusted the nominal baseline a little as well as inter-character fit (neither to any large extent). Needless to say, a typographic interpretation would smooth things out, but this gives a rough idea as to how hand-written manuscript might look using these forms of the syllables.</p>
