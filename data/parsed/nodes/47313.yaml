      <p>Thomas</p>
      <p>I don't think it is so much a matter of fonts, but a matter of software -- either in the font or in the applications programs. All my experience comes from typesetting books with some of these languages, primarily Apache, Kiowa, Lakota, Navajo, and just a little with Nahuatl, Maya, Tzotzil, Tzeltal, Tojolabal, Tabasco Chontal, Purepecha, Sierra Zapoteco, Isthmus Zapoteco, Mazateco, Ñahñu, Totonaco, and Huichol.</p>
      <p>As far as I know, none of these languages had a written form other than using the Latin alphabet. The problem is the various orthographies, some dating back to people working long before laptop computers (e.g., Ella Deloria &amp; Lakota), who would use marks easy to make with a pencil (dots at various places, for example; hard to typeset). Later, the problem was to adapt to the typewriter &amp; to some extent print, so other marks were used -- sometimes needing a touch-up with a pen if you were limited to the typewriter.</p>
      <p>Even here, there was no standardization across languages -- even ones with common roots, like Navajo, Apache, Kiowa, etc. (Athabaskan roots) so a nasalized vowel in one might be signaled by an ogonek, but with a macron below or underline in another. Long vowels can be denoted by doubling, or by a macron. Etc.</p>
      <p>All these can be made up for any font, and it is much easier now with OpenType. The problem is that the Unicode Consortium will not encode new characters which contain only additional diacritics already encoded, but most fonts do not have the needed routines in any ccmp or mark feature so the characters can be easily accessed.</p>
      <p>As to Cherokee, it is a bit political. The (at least Eastern) Cherokee have an official font; that it looks like a 1890s newspaper headline font doesn't bother them. There is some interest in making a font out of Sequoia's hand-written version of the syllabary, and it would make a nice script. Not too many Cherokees read or write Cherokee, so there is some movement to make it easier to learn by simplifying the syllabary -- by removing about half of it. The Cherokee are split on that one. Moreover, the few people at the Cherokee Museum who write Cherokee use the Linguist Software system predating Unicode, back when there were both PC and Mac formats (they use PC).</p>
      <p>These are transitional times; we are moving from what could be easily rendered on a typewriter, or the old 126-character fonts, to what can be rendered with the  possibilities with Unicode &amp; applications programs that support it.</p>
      <p>FWIW</p>
