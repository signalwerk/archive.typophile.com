      <p>I wish I could remember the site where I got these; they're from some website relating to the Cherokee language. It feels important to share them here. They're going to be too wide for the column here, but the individual letters are rather small.</p>
      <p>The first is a sample of the Cherokee syllabary, showing the handwritten forms followed by an early draft of the more familiar typeset forms. They are written in pairs, divided by a vertical zigzag bar.<br><img src="/sites/default/files/old-images/Syllabary_6023.JPG"></p>
      <p>It is quite sad that the handwritten script is largely unknown today. It is quite beautiful. It would be nice to see it in a longer text as opposed to this letter-by-letter display.</p>
      <p>I also came across this scan of a Cherokee number system.<br><img src="/sites/default/files/old-images/Numbers_5227.JPG"></p>
