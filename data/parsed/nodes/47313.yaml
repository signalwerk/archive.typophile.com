      <p>Paul is right. For some reason, O,o w/ ogoneks are found in Latin Extended B, and few fonts seems to include characters from this. I'm not sure whether or not the acute w/ ogonek are in Latin Extended additional, but few fonts have these, either.</p>
      <p>If you are making fonts, it is valuable to think in terms of what languages your fonts can cover. Just a few extra glyphs get you Yoruba, transliterated Arabic, transliterated Devanagari &amp; Tamil, and of course, some of the Native American written forms. You need not fill out all of Latin B &amp; Extended additional to pick up the glyphs needed of a number of languages.</p>
      <p>For OpenType application, using ccmp is one way to provide for Latin characters with diacriticals not precomposed in Unicode.</p>
      <p>But until there is general support for these languages in both ordinary text editors &amp; web fonts, the Native American languages will remain a problem.</p>
      <p>My $0.02</p>
