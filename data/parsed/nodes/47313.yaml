      <p>Greetings, all: This is Barbara Williams, spouse of Charles E, who's allowing me a brief post under his log-in. We worked last year with the Museum of the Cherokee Indian on their publication of the first Cherokee translation of contemporary fiction: "Removal: A novel" by Charles Frazier.</p>
