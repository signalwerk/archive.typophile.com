      <p>It really is a shame that there are so few fonts for these languages. I am including support for Diné Bizaad (Navajo) in my typeface I am currently working on, and it is next to impossible to find any Diné text online. Of course some of this is due to the fact that it is such a little-spoken language. But I'm afraid that the lack of fonts compounds the problem of the language not being used more in print.</p>
