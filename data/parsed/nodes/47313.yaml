      <p>The script shown in the pic is what Sequoyah came up with but was changed, as I mentioned, to accommodate creating typesets for a printing press. I, for one, have noticed trouble from modern students in learning the syllabary the way it is now. It takes extra effort for them to disregard their mind set in seeing some of the symbols as letters of the alphabet. They see D as 'dee' instead of 'aw' and so on. I've always felt it would have been easier to learn the original than what was developed for the press.</p>
      <p>Also, the numbers system wasn't adopted by the Cherokee Nation. They felt the roman numbers were good enough. Again, I wish we would use the numbering system.</p>
      <p>The current writing system has been used over the years. I'm often asked to translate letters and note books written in the syllabary. Mostly it was used to write down arcane medicine used by our medicine people. But, of course, we have the New Testament and some of the Old written in the syllabary. Hymns are written down too. So the writing system is used to this day.</p>
      <p>One last thing for now.</p>
      <p>What Sequoyah came up with still isn't the original writing system. There was a priest clan that was killed off that had a writing system. We have an old legend that mentions we had a writing system thousands of years ago.</p>
