      <p><cite>It's fine for the party who's licensed the font to commission someone else to make the modifications. That person should have a legitimate copy of the font as well.</cite> (Why? it is expertise that's being solicited, not a license.) <cite>And that's the situation Hrant was in. But those modifications should be restricted to the original licensee, not distributed to others.</cite></p>
      <p><cite>Is that a bit clearer?</cite></p>
      <p>Not really. Let's take a situation that is very, very close to factual. There are about 100 AAUP presses. I'd guess that at least 50 of them use InDesign, and have more or less stayed current with the various releases. Therefore, in spite of the human tendency to improve the facts, I can be pretty certain all those presses have at least one licensed copy of Minion. Moreover, many of them know we've "modified" Minion's character complement over the years, in order to set to set transliterated Arabic, Indic Scripts, Navaho, Lakota, etc.</p>
      <p>They have licenses, we have a license. In response to requests for our fonts, I've always said, "I'm sorry, the Adobe license prohibits it."</p>
      <p>This on the basis of anther part of the FAQ:</p>
      <p><cite>A consultant may solicit their services to companies who have legitimately licensed copies of Adobe font software. The work product of the consultant must remain with the company. The consultant cannot (i) take or keep a copy of the company’s original, localized, or customized version of the font software, or (ii) distribute any original, localized or customized versions of the font software.</cite></p>
      <p>It gets down to what "distribute" means. I could furnish the those 50 AAUP presses with the modified Minion if I physically go to their place of business, take nothing with me (strip searched at the door? MRI to make sure I hadn't swallowed a flash drive?), do the work, then take nothing with me as I leave (more searches &amp; radiation from another MRI?) But to send them a copy as an email attachment is prohibited.</p>
