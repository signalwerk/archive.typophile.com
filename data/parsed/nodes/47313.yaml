    html: <p>Navajo requires ogoneks with acute marks, including O/o with ogonek, which are found rarely in <em>any</em> fonts. These characters could be composed if combining accents are supplied in the font (also found in few fonts), but using these would require sophisticated software, unless the typeface includes OpenType programming to do this for the user automatically (which is supported by few applications). Even the Wikipedia page you linked to has the problem of using the dotted iogonek together with the acute mark, unacceptable typography in my book. Native peoples deserve good type options as well.</p>
