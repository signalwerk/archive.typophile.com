      <p>If you look more closely at the Navajo wikipedia page, you will see that it uses a mixture of 0027 and 02BC.  The latter is what is used in the English Wikipedia page on the Navajo Language.  I'm not sure that the Navajo Nation has ever decided what is correct, but I think in any case you would want to avoid any "punctuation" mark to represent an actual character, and 02BC seems reasonable to me.  </p>
      <p>Navajo's requirement for ogoneks makes it no more disadvantaged with respect to fonts than Polish and Lithuanian.  How great is that?</p>
