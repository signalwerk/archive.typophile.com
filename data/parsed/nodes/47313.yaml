      <p>Hi Thomas -- I'd say yes, and no. To take a somewhat longer view, I think we an assume Unicode will be around for a while. Longer than OpenType, and certainly longer than InDesign. Those of us with thining, graying hair remember the rush to archive jobs in Quark -- this after the rush to archive jobs in "Compugraphic." Etc.</p>
      <p>Now, making up the characters is usually trivial. Most are a Latin character plus one or more combining diacriticals. (Of course, it would help if Adobe &amp; other font publishers would include the Unicode combining diacriticals in their font, but as the barman in <cite>Irma La Duce</cite> said, "That's another story.") </p>
      <p>The problem is how perfectly correct Unicode can occur in a manuscript. A character can be formed in any number of ways. We have a few manuscripts come in where even "aacute" is formed (typed) by the string "a" plus the "acute combining" diacritical. We get around such issues by having a "manuscript cleanup stage," and our rule is that all constructions that have a Unicode number assigned are converted to that, and all that don't are broken down into their components. We don't allow, for example, eacute with a macron below, we ensure the string is e, plus macron below, plus acute. (&amp; remember that while the ordering of accents within a plane is specified by Unicode, the order of the planes is not. Yet one more issue). For such with no single Unicode point, I make them up &amp; write (usually, add to) a ccmp feature.</p>
      <p>Now think of the problem a font publisher faces. They usually feel they can't make such assumptions, and have to support any of the several ways such characters can occur. Anybody unconvinced take a look at SIL's ccmp &amp; mark/mkmk features for a font like Charis. It is no wonder that this kind of support is lacking.</p>
      <p>It is part of a larger issue, font publishers don't view book publishers as a significant market, so they don't address the workflows book publishers need. Take a look, for example, at Biblovault or codeMantra. People who archive books, and make other products from the "print" book file, for the original publisher. Even a site license for fonts -- expensive -- makes the use of such companies technically illegal. Best I can tell, you can't get a site license that covers multiple businesses. Not from Adobe, anyway.</p>
      <p>So we're left with "don't ask, don't tell," except there is no way to make the products without telling. I guess it is "don't ask," and since we have to tell, don't even look.</p>
