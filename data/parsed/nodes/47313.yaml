      <p>Further South, but still native Americans Tzeltal and Tzotzil Mayan languages use Latin based systems as there was no actual written form until mid 20 century.</p>
      <p>A long time ago while helping with a educational project in the mountains of southern Mexico I did this as an experiment, maybe the interesting thing is the idea use of a modified ' to indicate inspired vocals very common in Tzeltal, and the use of a K instead of a Q which is not used in Tzeltal but usually appear in texts.</p>
      <p>The dingbats are based in children drawings. It was very usual to have soldiers, helicopters and bombs drawn at art class.</p>
      <p>The font was called Tzeltal Kop or True Word</p>
