      <p>&gt; It takes extra effort for them to disregard their mind set<br>
      &gt; in seeing some of the symbols as letters of the alphabet.</p>
      <p>This is exactly the problem even in major scripts like Cyrillic.<br>
      Cyrillic for example was <em>formally</em> Latinized three centuries<br>
      ago by Peter the Great; now, especially if a Cyrillic snippet is<br>
      interjected in English text (or vice versa), the reader will get<br>
      thrown off. The attenuating factor there is that the Russians<br>
      are not an endagered culture, so it's not a huge deal.</p>
      <p>hhp</p>
