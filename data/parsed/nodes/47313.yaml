      <p>re: American Indian / Native American language fonts</p>
      <p>I have a couple of pan-American typefaces in production at the moment which aim to support all North American (along with most European) languages: Huronia and Plantagenet Novus. I can not say when either will be publicly released, as development on these is slower then I should like, as they have no specific financial backing. A basic beta specimen for Huronia can be found by following the beta link on tiro.com/fonts. In developing these, I am also working on a character/glyph set specification which will be released in some form at the same time as the font(s).</p>
      <p>As far as the Cherokee script is concerned, it is a bit too complicated to jam into a single post all the issues, but it is an interesting typographic challenge. There are many presumptions from within and without regarding reader's expectations. The 'original' cursive form would be interesting to approach as a design issue, but before engaging in that experiment I am unconvinced that it would work as a fully functional script. Not only are there probable issues in how it would work technically, there is also the issue of how easy it would be to learn. These perceived problems are no doubt behind the development of the second model, which more closely resembles European typefaces and the further development by Worcester for it’s adaptation to metal type. There were obviously various technical and cultural motivations that existed in the mid-19th century which determined how Sequoyah's writing system developed and mutated and for the most part the design decisions were fairly sound at the time.</p>
      <p>Present-day expectations and presumptions about what is, or is not authentic is quite another matter and has given rise to some odd results. My own preliminary attempts at designing Cherokee fonts has been informed by the original (metal) typefaces, and to some extent the earlier cursive model. I don't pretend that the first version (as comes with OSX) is exactly as I would like it, and I continue to develop it and other Cherokee fonts—however what I, as a type designer see as a rational process and result may not always meet the expectations of the users of the language, as other interpretations that proliferate weren't produced using the same rationale. I am writing an article on this, but like so many things it is not complete yet so I don't want to post a link here yet. If anyone is interested, they can contact me directly: ross {at} tiro {dot} com</p>
    html_clean: |-
