    <p>Through the search, I've found one very useful discussion on this topic,<br>
    which is now 3 years old.   <a href="http://typophile.com/node/16467">http://typophile.com/node/16467</a></p>
    <p>It seems that the task was started, but when I search for these fonts (for purchase/for use) I am having trouble locating them.<br>
    I am also very interested in designing a few different fonts for these languages, beginning specifically with Ojibwe.</p>
    <p>I am culling my research to hopefully write a grant to begin work on this. I appreciate all help the typophiles can provide!<br>
    cardinal</p>
