      <p>Thank you for the education.</p>
      <p>&gt; We don’t use the word preserve when we refer to our<br>
      &gt; customs and traditions. We rather use perpetuate.</p>
      <p>Nice.</p>
      <p>&gt; we are very aware of losing our identity</p>
      <p>It's the same with us Armenians (even though your genocide was even worse than ours) since more than 60% of our population lives outside Armenia. It's a struggle ingrained.</p>
      <p>--</p>
      <p>As I've stated in lectures and articles, a script can either serve to perpetuate a culture or it can serve to assimilate it, the latter if it slowly becomes transformed* to resemble the dominant mainstream culture. This has been happening to many alphabets (not least Armenian for one) and I call it Latinization. And just like perpetuating spoken language we need to worry about perpetuating written language.</p>
      <p>* Or sometimes if it's created to be like that; see Vietnamese, the Carmen Miranda of writing systems.</p>
      <p>It seems to me that there's a case to be made for breaking with the Zapf-style Latinized Cherokee, and either reverting to the original form you mention (which I would be very interested to see, especially in a side-by-side comparison with the current form) or making something from scratch, or something in between.</p>
      <p>hhp</p>
