      <p>Let me just say this. There are three Bands of the Cherokee people. (there is not a sequoyah tribe nor was he ever a chief) There is the United Keetoowah Band of Cherokees In Oklahoma (of which I am a full blood member) - The Eastern Band of Cherokees (in North Carolina) - and The Cherokee Nation (in Oklahoma). Although there are three bands (three separate nations or governments) we are all the same people of the same blood. Of the three, the Keetoowahs are the more traditional band. More of our people speak, read and write our language. In fact, I'm a teacher of our language among other things. The Eastern Band, those around Cherokee, NC, speak a little differently than those who live in the west but we can still understand one another. In all three Bands, we have instituted programs and cultural camps to teach our youth the traditions, culture and language. We don't use the word preserve when we refer to our customs and traditions. We rather use perpetuate. In the shadow of main stream society, we are fighting hard to keep our traditions in tact and ongoing. Unfortunately, we are very aware of losing our identity which is why we incorporated these programs and other courses of action to teach the youth the various facets of our ways of life.</p>
      <p>As I mentioned: I'm a teacher of our language but I am also a member of the Seven Clans of the Fire Camp Committee and a founding member of the Turtle Island Liars Club. As a teacher, I hold classes in the community on speaking, reading and writing our language (using the current version of the syllabary). Other teachers have classes in the public school system while others hold classes at some of the universities in Northeastern Oklahoma. Seven Clans of the Fire holds three camps a year to teach the crafts, traditions and customs of our people to the youth and anyone else who wants to learn the real culture of the Cherokee people. The Turtle Island Liars Club in a loose association of traditional storytellers of the Keetoowah and Cherokee people. We hold storytelling nights every few months to pass on the stories of our people.</p>
      <p>So... all in all, we are very active in passing our culture down to our children and grandchildren.</p>
