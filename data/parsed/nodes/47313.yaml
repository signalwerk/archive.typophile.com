      <p>Charles, I think you're looking at it the wrong way. Think of it this way:</p>
      <p>Adobe allows one to modify their Adobe-licensed font, but not distribute it. The modified font is for private use. Adobe, however, recognizes that this private use is often what we call "internal business use." Furthermore, any individual person or business might need to hire an expert to do these modifications, but that is work for hire.</p>
      <p>The problem with the scenario you describe above is that you essentially have the font and are distributing it. Place A needs the font, so you go give it to them; Place B needs the font, so you go give it to them. Places A and B might have their own licenses, but the modified font needs to originate and stay with a single person or business. It can't originate with you and then be distributed to multiple people or businesses.</p>
      <p>Here's the bottom line. Most foundries do not allow font modifications, but Adobe has tried to distinguish itself by allowing it, <em>with restrictions.</em> We don't want modified fonts to be distributed or become new "products" so we've chosen to draw the line here.</p>
      <p>(Disclaimers: I Am Not A Lawyer. Your own font EULA is the sole determinant of what is and isn't allowed.)</p>
