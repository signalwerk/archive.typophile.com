      <p>We considered using Plantagenet, but in the end chose Laser Cherokee, in part due to some variant forms in Plantagenet that traditionalists were not comfortable with. Feel free to write to me directly about this: As I understand matters, the glyphs in the "official" syllabary are under some review right now, in part due to discovery of some documents dating from the time of Sequoia. I'm not an expert, but could refer you to some folks who are. barbara[at]bwabooks[dot]com.</p>
