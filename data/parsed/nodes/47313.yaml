      <p>Hmmm, it seems there are several Cherokee fonts available, all with pretty generic names like "Cherokee" making them hard to tell apart,</p>
      <p>My scathing words above apply to the 1993 Cherokee font by Joseph LoCicero IV.</p>
      <p>The 2005 official font by the Cherokee Nation and Tonia Williams, which I had looked at long ago, is not *as* bad, but still pretty awful. It can't decide whether it's monoline or if it's high-contrast Didone. No overshoots for the rounds. Inconsistent stroke weights. Inconsistent stress. Spacing needs to be thrown out and redone, because it's useless. But at least there are points at extrema.</p>
      <p>If they're going to go to the trouble of providing keyboard drivers and such, you'd think they would/could use the proper encoding.</p>
      <p>Cheers,</p>
      <p>T</p>
