      <p>It's all relative, but neither combining combining diacritics nor o-ogoneks seem terribly rare to me.  My OS X comes with about a dozen fonts that contain the latter.  I wonder what the comparable figure is for Vista? </p>
      <p>Since the characters with ogonek plus acute are never going to be in Unicode in precomposed form,  the quality of their display will inevitably depend on the smarts of the local software.  As pointed out, having both a dot and an acute on an i is not at all good.  A work-around for this with some fonts may be to encode the character as i-acute plus combining ogonek rather than vice-versa.</p>
      <p>But no doubt a font designed specifically to display these things perfectly is the best solution. I'd welcome a chance to test Paul's font with my Navajo keyboard layouts when it is available.</p>
