      <p>Thanks everyone! this is fantastic! Will be in touch soon.</p>
      <p>Right now I am interning (in exhibitions, as a graphic designer) at the National Museum of the American Indian in NY and am shocked that even in our library, we have so few examples of Native written languages. Most translations are phonetic anglicizations, which are helpful for me to pronounce (but not really!), but are absolutely ugly when compared to the Native syllabary.</p>
      <p>ps. I think the Cherokee font is one of the most developed, but the applications I've seen of it (probably not Zapf's!) are obv. roman character driven and therefore, leave something to be desired.</p>
