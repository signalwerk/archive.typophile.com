      <p>Charles,</p>
      <p>I'm confused. In your first pararaph you say that fonts aren't the problem, but it seems to me that in your fourth paragraph you are saying the opposite.</p>
      <p>These days, InDesign and the Windows version of MS Office support OpenType mark attachment and 'ccmp', so I don't see app support as being a major barrier (though support in Mac Office would be nice - it isn't there yet, is it?).</p>
      <p>BTW, I've looked at the free (and official?) Cherokee font that's available. It's utter junk in both design and execution. Bizarrely irregular stroke weights, sidebearings chosen by rolling dice, extrema often ignored in point placement, non-Euclidean geometry of curves (oops, read too much H.P. Lovecraft!).... yes, I exaggerate, but only a little.</p>
      <p>Cheers,</p>
      <p>T</p>
