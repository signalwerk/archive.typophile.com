      <p>Navajo requires vowels with ogoneks. You might be amazed at how many fonts lack these -- Also, in the Wikipedia page you reference, the <a href="/node/55315" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">glottal stop</a> is signaled by an ASCII apostrophe. Far be it from to tell Navajo's they are wrong, but the usual orthography for Navajo &amp; most other Native American languages is the "typographer's" apostrophe, AKA raised comma (U+2019).</p>
      <p>Note that Omniglot gets it wrong, too:</p>
      <p><a href="http://www.omniglot.com/writing/apache.htm">http://www.omniglot.com/writing/apache.htm</a></p>
      <p>At first glance on the Omniglot site, one might think that U+0027 is correct; then you notice that Omniglot uses 0027 for an apostrophe everywhere.</p>
      <p>Does it matter? Well, probably. In Polynesian, the glottal stop is signaled by U+2018. I've also seen proposals that the apostrophe not be used for a glottal stop, since it is confusing -- and of course, in every case, that's where 0027 is used for the apostrophe.</p>
      <p>FWIW</p>
