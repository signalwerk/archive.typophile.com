      <p>It seems to me that there is a real difference between</p>
      <p>a) modifying an Adobe font and advertising the fact that you have done so and offering to make the modified font available -- whether for free or for a price -- to other licensees of the original Adobe font;</p>
      <p>and</p>
      <p>b) modifying an Adobe font for your own purposes or the purposes of a client and also providing that font to other clients who seek the same modifications.</p>
      <p>That is, there seems to be a difference between being in the business of distributing modified fonts and being in the business of providing modified fonts to people who commission them. One way in which I always seek to conform with Adobe's license terms in this respect is to personalise the modified fonts for the individual client, even if the same set of modifications to character set, etc. apply (although, off hand, I'm having trouble thinking of a situation in which more than one client wanted exactly the same set of modifications).</p>
