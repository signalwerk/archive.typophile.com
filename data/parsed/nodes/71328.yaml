      <p>A good place to start font-matching is by considering era, genre and designer.<br>
      Franklin Gothic dates from 100 years ago, and was designed by Morris Benton as his update of the 19th century grotesque genre.<br>
      So his Century Schoolbook, and Century Expanded, would be good companions, as they were his updates of the 19th century Modern style of serifed text face.<br>
      All through the 20th century, Franklin Gothic was paired with such faces in newspapers and magazines.<br>
      Other vintage faces that have a track record of performing well with FG: Clearface (also by Benton) and Times Roman, of course.</p>
