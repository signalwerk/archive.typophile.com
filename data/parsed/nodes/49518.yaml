    <p>Hi There</p>
    <p>I'm working on a redesign for a small local Dutch newspaper with a printrun of around 25.000 copies. Here some digital sketches.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/regiokrant_5234.jpg"></div><p></p>
    <p>This local newspaper attends an area where there is little to none interest from the mayor newspapers being spread around here.<br>
    The area this newspaper services is close to and within a city (Groningen) where there are quit a few newspapers. However, all of these are focussing on the city itself.</p>
    <p>The "Regiokrant" connects a few villages around Groningen with a few districts of Groningen City. All – geographically – are neighbours. This paper brings them closer together. </p>
    <p>Beside this it brings quality. Readers tell them that unlike those other papers, this one they like to read because of the stories. With them the glass is half-full instead of half-empty. This positive approach is appreciated.</p>
    <p>I have tried to reflect this in the logo.<br>
    People interact with people.<br>
    In the balloons (the outer shape of the 'O') you find two men. Not in number 3.</p>
    <p>By the way: Don't mind the colorscheme. I'm still working on that.</p>
    <p>I'm thinking of giving them an emotion, but am still pondering which emotion would be best. (Happy, curious, interested ...).<br>
    But I want to do this with as little elements as possible. </p>
    <p>Oke. Here my question: Does image number 1 read as "regiokrant"?</p>
    <p>And second: any other comments?</p>
