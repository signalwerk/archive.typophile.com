    <p>First time poster/font creator here.</p>
    <p>I have designed a simple handwriting typeface for a project, it's not much but it's a key element of a brand I'm creating.  I used Fontlab Studio and generated a Truetype font which works perfectly on my Mac and has been tested on a PC too, no problems.</p>
    <p>Unfortunately I've encountered a label printer who is using an antique PC running Windows 98 which is telling her that there's a problem with it, but is of course being vague about the nature of the problem.</p>
    <p>I don't have a PC so can't run any diagnostics on the font to see what might be causing this incompatibility.  If anyone out there can have a quick look at the font file here <a class="freelinking external" href="http://www.mediafire.com/file/r2ozdj2mgdx/G&amp;S Script 02.ttf">http://www.mediafire.com/file/r2ozdj2mgdx/G&amp;S Script 02.ttf</a> and tell me what's wrong I'll be eternally greatful.</p>
    <p>I know the font doesn't look like much on its own, but it's an integral part of a brand I'm creating for a new client.</p>
    <p>Thanks<br>
    T</p>
