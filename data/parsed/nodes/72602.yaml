      <p>Hey Julie,</p>
      <p>Actually I did such a typeface in the fall of 2009. It's a monoline family which was used for a pitch of a Biënnial. The project never got finished, so the fonts are ready (basic character set) and waiting to be used.</p>
      <p>My original idea was to have a monoline which I then could give different strokes in Illustrator. These fonts are TTF's including A-Z, a-z, 0-9 and punctuation.</p>
      <p>Groeten,<br>
