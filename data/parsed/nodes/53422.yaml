    <p>Mark Simonson posted this on his site back in September. I missed it until I now when I saw a link by Michael Bierut on Design Observer...</p>
    <p><a class="freelinking external" href="http://www.marksimonson.com/article/232/the-lost-art-of-type-specing" rel="nofollow">The Lost Art of Type Spec'ing</a></p>
    <p>Since I couldn't comment on Mr. Simonson's website, I thought I'd do it here. No words can thank Steve Jobs and Apple enough for emancipating us. Having to run through that protocol to get type set for something as simple as a business card, and then hoping it turns out right, is up there with sticking a hot, rusty fork in my eye. And that was only twenty something years ago! What a pain in the arse graphic design had to be. And then there was photo editing which could only be done with airbrush, or sending out for hundreds of dollars an hour. </p>
    <p>Thanks for the historical reflection Mr. Simonson.</p>
