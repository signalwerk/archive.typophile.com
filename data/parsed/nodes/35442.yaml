    <p>Hi everyone,</p>
    <p>I've been asked to design a set of logo's for a local school's departments. I was wondering what fonts i can use for the type? it's not commercial and i'm not charging for the work, does this affect anything? the font "tw cent" goes really well with the design i have so far but i don't want to use it if the school become liable for any legal discressions!<br>
    also, while i'm asking questions, are there any good websites explaining the rules on typeface use and permissions?<br>
    any tips or points in the right direction are greatly appreciated.</p>
    <p>Thanks!</p>
