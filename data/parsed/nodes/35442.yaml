    html: |-
      <p>You're free to use any font you want (such as Twentieth Century) in your design and distribute that design in a logo, book, etc. It doesn't matter whether it's commercial or not. The main caveat is that some foundries restrict the ability to embed fonts (such as in PDFs) (and some are picky about using it on the web), but that only applies to those situations. I am pretty sure that Twentieth Century will not have that restriciton, but if you want to be sure, you can search for the foundry and check out their <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a>. Again, this is only if you need to create PDFs, Flash, etc.; normal logos (JPEG, GIF, outlined type in EPS, etc.) should be fine. </p>
      <p>The main point of license agreements is to state on how many computers you can have the font and to prohibit copying, pirating, modifying, and the like. There are numerous permutations, but you're completely in the clear for what you're doing.</p>
