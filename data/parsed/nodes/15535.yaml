    html: |-
      <p>The most common abbreviation (and seen still a good bit here in Spain) is the DE ligature.  It's very simple to make, you just take the midddle bar of the E and stick it off onto the D:</p>
      <p><img src="/sites/default/files/old-images/de_lig_example_6593.png"></p>
      <p>That's pretty much the only ligature you see in Spanish other than the ampersand as "et" used to be used instead of Modern Spanish "y" for "and".  I've read in several places that there used to be a ligature for LL or ll, but in my research I've yet to find a single document that actually used such a ligature, although there are some interesting posibilities.  The "ch" is occasionally kerned closer but seeing them ligatured is not common practice.  </p>
      <p>A good font for Spanish needs a,o,e,z,d,n,r,s,c,ñ in superscript off the top of my head (see <a href="http://typophile.com/node/42577" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this thread</a> on ordinal numbers which you may or may not want their combinations ligatured.  Best bet for them is do several bar/underline characters that can underline one, two, three, four of them at a time.  Likewise,the tilde was not just reserved for the ñ, but could be used over any vowel as well where it meant "this letter plus an m or n" (eg, cõtar = contar, ãpliaciõ = ampliación).  It could be used over multiple letters to signify that several letters (usually vowels) had been omitted.</p>
      <p>Of course, it wouldn't hurt to have some nice capital Qs designed for the words Que and Qué, which do appear quite frequently.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
