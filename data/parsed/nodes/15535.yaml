      <p>just a short update: I am finalizing Tierra Nueva 4 weights (regular, bold, italic and script) right now. it's almost done (and i really mean almost done, it's only bug-checking and finding some not-so-beautiful overlaps in the script to do yet) and i hope to release it within first quarter 2010.</p>
      <p>A new pdf presentation will be online soon, likely this winter holidays.</p>
      <p>Thanks for your interest for such a long time. This was the first font i started, me and the font have come a long way since then, and it's time to get it out. :)</p>
