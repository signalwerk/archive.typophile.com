      <p>There is a new version up at<br>
      <a href="http://www.consolution.at/terranova_v44.pdf" title="http://www.consolution.at/terranova_v44.pdf">http://www.consolution.at/terranova_v44.pdf</a></p>
      <p>Many changes (black is new, red is last shown version):<br>
      - redone lowercase (unified serifs, up- and downstrokes, rounds, new k, new g<br>
      - new numerals (upper- and lowercase)<br>
      - some Details in Uppercase<br>
      - new dieresis, grave, acute, tilde, cedille</p>
      <p>On page 2, there is a very early version of an italic. It's just a redraw of the original, without any changes yet, and there are even some letters missing. So it's just to have a look at it, but not to do a lot of critique at the moment.</p>
      <p>Questions:</p>
      <p>- What do you think of the new h? I'm not sure about that form at all<br>
      - Upstroke of d, k und l are not connected to the stem in the original font, but they are in b and h. Should it be unified?</p>
      <p>known bugs:<br>
      - Y is completely twisted...<br>
      - no updates on ligatures and combined numerals (fractions etc.) unless the main glyphs are quite fixed<br>
      - &amp; turns too much to the left</p>
      <p>Thanks for your comments<br>
      Sebilar</p>
