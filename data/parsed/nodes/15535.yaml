    <p>Dear forum-Members,</p>
    <p><strong>------------------- edit July 2010 ------------------</strong></p>
    <p>Dear members of this forum – Tierra Nueva is finally out, released in July 2010. You can find <a href="http://fonts.info/info/en_tierra-nueva.htm" rel="nofollow">more information here</a>, and the <a href="http://www.fonts.info/dlcounter/DrWeb_DownloadZaehler.php?d=10" rel="nofollow">final specimen here</a>.</p>
    <p>Purchase is available via <a href="http://www.fonts.info" title="www.fonts.info">www.fonts.info</a> and myfonts.com.</p>
    <p>As this project was started here on typophile.com, I will leave the text below, from 2005 till now in a as-is state for documentation.</p>
    <p><strong>--------------------------------------------------------</strong></p>
    <p>in my leisure-time I am working on a font inspired by an spanish map of america made in the year 1561. The Map has hundreds of letters and a lot of illustration (sea-monsters, native americans, etc.) on it, I think it's made by copperplace engraving (or at least by another form of engraving).</p>
    <p>There is enough material to make a roman, italic and capital display font with a lot of ligatures, flourishes etc. of it. At the moment, i am experimenting on the roman and have started selecting glyphs for the italic version.</p>
    <p>I guess i have worked too long without feedback (as you can see, i have created many ligatures and diacritics already), so it's over time already to show it somebody...</p>
    <p>My method is to select some glyphs from the map (they vary, there is no "typical A"), do a 1:1-redraw, adjust and modify it trying to keep the original impression (with some exceptions). I also added some of the letters that are not availiable on the map, as it is in spanish and latin (missing U, missing Z,z, etc.). The original figures are all lowercase, the uppercase ones are derived from them.</p>
    <p>There are certainly some problems with some glyphs at the moment (for example C, S, Z, K, W k, s, w, 2, 8, too wide f-ligatures and/or too narrow longs-ligatures, i am sure you'll find more of them). </p>
    <p>I would be thankful if you could take a look at it, comparing it with the original letters, and telling me what you would do different, I just need some feedback before I can go further with it...</p>
    <p>Last thing: I am planning to call it "Terra Nova". Objection? Suggestions?</p>
    <p>Thanks a lot for your help<br>
    sebilar</p>
    <p>ps.: if I am already posting: are there any guides, tutorials, FAQs, frequently made errors, etc. how to start working on a font concerning the technical matters (opentype, ligatures, encoding, etc.)? I am trying to lern a lot about it at the moment, but it's just collecting and combining pieces of information and do trial and error...</p>
