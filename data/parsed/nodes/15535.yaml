      <p>Nick Shinn:</p>
      <p>Thanks for the reveal of this Fontlab-behavior, I already was wondering about Adobe-programmer's super-high IQ so that they can remember classes by numbers :)</p>
      <p>Capital double s is quite a controversial thing: german double s is a ligature of longs and s (other say longs and z... another topic), and it's a letter by its own today, used when the s is spoken sharply, but the vocal in front of it is long, not shortened (otherwise, ss is used).<br>
      When writing in capital letters (for titling or advertising, etc.), the problem was that there is no equivalent for ß in capitals. This leads to typographical uglyness like "MAßNAHME". Correctly, ß is replaced by SS in capitals, so it becomes "MASSNAHME".<br>
      But there are cases where this leads to misunderstanding. In lowercase writing, the words "Maße" (measures) and "Masse" (mass) can be indentified as two different things, but in uppercase, both become "MASSE".<br>
      There are examples of a uppercase equivalent of ß, like in inscriptions of family names on tombstones, and there were also tries in DDR (eastern germany) to create a uppercase ß, but until now this was not successful. There is no place for it in unicase, and it is not used in dictionaries either. So there is no big hope that it will ever be "standard".</p>
      <p>There is no doubt that I will try to do a lot of opentype-Scripting with Terra Nova, as this is also a project to learn new things. But I know already that it will be difficult :)<br>
      I think the problem with Wortfugen can't be solved until Opentype supports dictionaries. Until now I haven't found fonts that have solved this problem (not even linotype, that have done things like Zapfino...). It's the same problem as scripting the usage of s/longs: too many (or no) rules, too many exceptions.</p>
