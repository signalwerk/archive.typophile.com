      <p>Regarding Wortfugen: I suspect that getting it correct is up to the application (e.g., InDesign) just as hyphenation is. I don't think there would be a way to implement this kind of context-sensitive functionality in OpenType anyway since it depends on something analogous to a hyphenation dictionary.</p>
      <p>Incidentally, what do you do in the case of a font like Bembo, where the top of the f hangs over and would collide with the l if the ligature is not used? There are also some sans serif typefaces in which the fi and fl ligatures actually pull back the top of the f rather than make a connection. My understanding has always been that such ligatures exist to solve spacing problems and do not have any sort of semantic function, so I was a little alarmed when you described how things are done in Germany.</p>
      <p>(Nice looking font, by the way.)</p>
