    html: |-
      <p>Thanks for all the flowers :)</p>
      <p>As things are a bit asynchronous (myfonts, etc.), i wanted to wait to announce it here ...<br>
      Anyway, to make it short: it has been quite a journey, but now it's out – I'm proud, I hope I have delivered high quality work, and I am very thankful for your support from 2005 till now, as I have learned a lot from this community. I'm also full of motivation and working on the next project(s) to follow :)</p>
      <p>You may be especially interested in the 46 pages font specimen, which is the best overview about the whole family with all its features:<br>
      <a href="http://www.fonts.info/dlcounter/DrWeb_DownloadZaehler.php?d=10" rel="nofollow">english</a><br>
      <a href="http://www.fonts.info/dlcounter/DrWeb_DownloadZaehler.php?d=9" rel="nofollow">german</a></p>
      <p>Purchase is for now possible via <a href="http://www.fonts.info" rel="nofollow">fonts.info</a>, and soon it will be available on myfonts.com too.</p>
      <p>Sebastian</p>
