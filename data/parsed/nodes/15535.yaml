      <p>Periods have this slice because the original has them too in the copperplate engraving. I guess this is the only easy way to create a "dot" with the tools available for this technique (doing a "twist" with a beginning and an ending – creating the slice in between). I think at the moment it's too much detail that can't be seen in reading-textsizes. I will try to make it more visible, or, if this does not work, eliminate the slices completely.</p>
      <p>I think telling what you see is very important, whether you are 16 or 96. It's just that more people means more thoughts, and thoughts are good :)<br>
      Of course, as the designer of this font, i have to keep the decicion which ideas and thoughts i translate into the design, and which i do not, because otherwise it's just implementing *all* the ideas, and in the end the type turns out to be a freak ;-)</p>
