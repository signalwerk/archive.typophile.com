      <p>&gt;I’ve tried to look at Adobes Garamond Pro</p>
      <p>One difficulty is that, when FontLab opens an OT font, it gives the glyph classes numerical names.</p>
      <p>So, whereas the original code might have been</p>
      <p>feature numr { # Numerators<br>
       # Latin<br>
          sub @Figures by @Numerators;<br>
      } numr;</p>
      <p>-- which is fairly easy to understand,</p>
      <p>you get</p>
      <p>feature numr { # Numerators<br>
       # Latin<br>
          sub @class1401 by @class1402;<br>
      } numr;</p>
      <p>***</p>
      <p>Thank-you for the explanation of Wortfugen, which is news to me. (Although I had come across the capital "double S" before in a Typophile thread (can someone point that out?), where that phenomenon can occur.</p>
      <p>It is possible to include alternate sets of rules within an OpenType feature, distinguished by a "language tag". You can see this at work in the "locl" feature of A Garamond Pro.</p>
      <p>I wonder if any foundries, such as Linotype, have implemented language-specific OT ligature substitutions?</p>
      <p>Here I am, sounding like an authority on OpenType (and I have even given a workshop on contextual alternates), however, I have only been making OT fonts for a year, and there are huge gaps in my knowledge, as I have only "mastered" some capabilities of some features. What's more, there are new capabilities to be invented/designed all the time, such as dealing with Wortfugen. </p>
      <p>So don't be discouraged, make this an OpenType font from the outset.<br>
      I expect that quite soon, as OpenType becomes the norm (no longer "terra nova"), typographers will have zero tolerance for fiddling around with glyph substitutions and font changes, but will expect to handle things like compound fractions and complex ligatures by going straight to the OT palette. You might think "I can retrofit this font with OT later", but if you're anything like me, you will have new fish to fry by then, and it won't get done. </p>
      <p>I'm not saying OT features are a necessity of every font, but I do believe that it is more important to make special ligatures accessible by OT, rather than to just make them.</p>
