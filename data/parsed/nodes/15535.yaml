      <p>I love this face.<br>
      Doing it as a "flipper font" would be cool.<br>
      That would use the OpenType contextual alternates feature to vary alternate glyphs for the same character, so it doesn't appear identical every time.<br>
      OpenType would also help manage all your figures, fractions and ligatures -- in fact the ligatures could be made from contextual alternates. I think you would have a lot of fun with that.</p>
