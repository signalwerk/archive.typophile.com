      <p>Looking very nice.  One thing on your numbers and some other glyphs: check the outline direction.  Some of them are going backwards which causes some interesting white-outline artifacts on Mac OS X.   I would probably given the style of the font use a · under your ª and º (including in the combination Nº) instead of nothing/underline.  I think it fits the font style a little better, and is certainly well represented in Spanish typography/calligraphy.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
