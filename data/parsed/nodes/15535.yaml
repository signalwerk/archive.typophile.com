      <p>Hi. Going on v. 0.44 --</p>
      <p>I generally don't like this sort of face -- too angular, sharp, and compressed for my very subjective tastes -- but you've done quite a good job with this. It has style and a certain charm. The g's are too wide, the a could use a bit more flair, and I feel that v/x/x are too staid. I particularly like your combining f's; they are clear and stylish, and work very well with their partners. Oh, and I like the italic a lot; it's not exactly legible, but its form makes up for any lack of function.</p>
