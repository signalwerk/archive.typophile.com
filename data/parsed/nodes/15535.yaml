    html: |-
      <p>A few things I see--</p>
      <p>8 needs more stroke contrast.<br>
      I liked the old a d u better.<br>
      g still seems odd to me. I'd say give the head more stress contrast and squash it a little top-to-bottom; then bring the bottom finial underneath the handle.<br>
      s: change the serifs?<br>
      Zero needs more stroke contrast.<br>
      7 too wide.<br>
      Why do the periods and such have a slice taken out of them?<br>
      ? needs more thick.<br>
      What distinction will there be between diereses and double-acutes?<br>
      G's top serif should be more like C's.</p>
      <p>Italics (even though it's a rough sketch, I'll start critiquing):<br>
      Terrific motion. Make sure that as you go, you give each character a definite thick and definite thin area. Like, the z is all thin, no thick. (This applies to some of the Roman characters too.)<br>
      X, x don't seem like they should have serifs.<br>
      o and s don't fit.<br>
      c needs an upper finial.<br>
      g too wide.</p>
      <p>I like this a lot. Very well done. </p>
      <p>Now, keep in mind, I'm still only 16 and this is my... fourth? post on the site. But what I just mentioned is what I see.</p>
