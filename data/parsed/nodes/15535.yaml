      <p>So after more than two months, I am happy to present a major update.<br>
      <strong>Please consider this as a completely new version</strong>, there are too many small and bigger chances to compare it to older versions.</p>
      <p><a href="http://www.consolution.at/terranova_v83_iv9.pdf" rel="nofollow">glpyh list</a><br>
      <a href="http://www.consolution.at/terranova_praesentation.pdf" rel="nofollow">quick and dirty presentation</a></p>
      <p>- a lot of finetuning based on largescale printouts<br>
      - new e and g<br>
      - new diacritic and extended latin characters<br>
      - revised and many new ligatures<br>
      - new (and partially experimental, unfinshed) punctuation<br>
      - roman numerals<br>
      - completely revised spacing (this now is "numeric spacing" in indesign, completely based on the font, no indesign optical features used)<br>
      - no kerning yet<br>
      - currently working on some opentype-features (revised numeral-features, capital spacing, case-sensitive positioning, etc.)</p>
