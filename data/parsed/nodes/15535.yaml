      <p>This is pretty cool (and I don't generally like this kind of thing).</p>
      <p>"a": The top needs a lot more character.</p>
      <p>"g": Too cartoony. Make the ear more irregular, and offet the ends of the bottom bowl so they don't look like they're supposed to be connecting.</p>
      <p>"k": Arms no good - try staggering them - and maybe some more flair.</p>
      <p>"v"/"w"/"x": Too wide.</p>
      <p>"y": That huge leftmost serif is going to give you grief.</p>
      <p>"G": Looks dorky with such a prominent top.</p>
      <p>"M": Too strange.</p>
      <p>"Q": Right on!</p>
      <p>"W": Too much.</p>
      <p>Cedilla marks: lousy.</p>
      <p>O-Slash: the slash could have more zing.</p>
      <p>i-dieresis: wassup with the high diacritic?</p>
      <p>oe: tilt the bar.</p>
      <p>The ligs are cool. For the "fb"/"ffb" though I might leave the bar unconnected to the stem of the "b".</p>
      <p>Numerals: I guess you've based them on the original? I would avoid them - make your own.</p>
      <p>I think this has good potential - keep it up!</p>
      <p>hhp</p>
