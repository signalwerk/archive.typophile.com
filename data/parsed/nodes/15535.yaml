    html: <p>Thanks Florian for the link to the marvelous map. One could zoom in and inspect the various portions of the map.  The lettering on the map seems more tight and regular than Sebastian's interpretation- I could see how hard it was to create a font that encompassed both this regularity and the many idiosyncratic elements that give it its special flavor.  I compared the new version of the font with a copy of the pdf I saved last week. I was sorry to see the small g lose its "cartoony" shape as Hrant has remarked with some justification. Sebastian, how about using the g found on the map in the word "Magallanes" just to the left of the Southern tip of S. America? It has dignity and a nice flourish to it. Also the new version of the font seems a bit too staid, perhaps because the text sample lacked the exciting ch and ft and other ligatures that added so much to the character of the font.</p>
