      <p>Hello Nick Shinn,</p>
      <p>I am working on some opentype-features, but as I have found out, this is more complicated than assumed :)</p>
      <p>This is my first font that is that far that I can think about opentype-coding, so everything I do is experimenting how it could work.<br>
      Ligatures are no problem, figures are (at the moment), as there are more then just two types on them, but there are uppercase, lowercase, table, superior, inferior, etc., and I haven't found out yet how to exchange from every figure-class to any other without problems.<br>
      I've tried to look at Adobes Garamond Pro for that, but it's too complicated for me at the moment... Learning by doing will be the key I guess.</p>
      <p>On ligatures, there is another little problem: I am German-speaking, and we have a very "nice" ruleset for ligatures: they are only allowed, when they do not spread across so-called "Wortfugen". A "Wortfuge" would for example be here:  Mouse|trap. So, let's say if we have the word "Schilfinsel" (Schilf|insel), we are not allews to use a ligature, as it could disturb the legability of this word combined of two seperate words. This is because german language consists of a large amount of these combination of words, and they would not be recognisable anymore as parts of the whole new word if they were connected by ligatures.<br>
      Of course, this is a problem for german language only. The only question is: is it useful to full-feature the font with ligature-replacements even of exotic combinations, and annoying german typographers, or should it be reduced, and the additional ligs can be accessed by the glyph-table? Or even do two versions of it :)</p>
      <p>Doing contextual alternates is an option, but i first have to re-work them, as they are far less-developed at the moment than the rest of the glyphs.</p>
      <p>Thanks for your Feedback<br>
      Sebilar</p>
