      <p>DWV</p>
      <p>For a Spanish font of that era, you really need to consider including several glyphs which were much used in that era.  There were ligatured-character and other glyphs for de, del, and several other common "glue words".  Unfortunately, there are no ISO designations for these characters yet.  The closest one for "de" is Ð (an old Norse glyph; in most typefaces the horizontal also extends leftward from the vertical, which wasn't the case for the Spanish ligature).  There isn't anything even close for the other combo characters commonly used by the Spanish back then.</p>
      <p>Cheers, Warren</p>
    html_clean: |-
      <p>DWV</p>
      <p>For a Spanish font of that era, you really need to consider including several glyphs which were much used in that era.  There were ligatured-character and other glyphs for de, del, and several other common "glue words".  Unfortunately, there are no ISO designations for these characters yet.  The closest one for "de" is Ð (an old Norse glyph; in most typefaces the horizontal also extends leftward from the vertical, which wasn't the case for the Spanish ligature).  There isn't anything even close for the other combo characters commonly used by the Spanish back then.</p>
      <p>Cheers, Warren</p>
