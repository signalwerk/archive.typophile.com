    html: "<p>that's a lot of fun. <br> <br>have you seen peter cho's  <br>type me, type me not  ? <br> <br><a href=\"http://acg.media.mit.edu/people/pcho/portfolio/typemenot.html\" target=\"_top\">http://acg.media.mit.edu/people/pcho/portfolio/typemenot.html</a> <br> <br>It makes me wonder what animation between letterforms would look like.... <br> <br>small points: <br>Seemed a little slow on my mac.  Is there something that can be done to speed it up/make the file size smaller?  If the animation is tweened, try adding a blank 1 sec audio sample set to stream.  It'll force the movie to keep up with the audio and drop frames... <br>Also, I'm not sure how I feel about the small interior circles... <br> <br>-zach</p>"
