    html: <p> Biologically speaking the cells which make up the basic building <br>blocks of the human body are structurally the same. Yet, in the face <br>of this, we still develop into recognizable individuals. How it this <br>so? Because each individual has a distinct DNA code which differs <br>from all others. The result of all this blending of individualism is a <br>active structure called society. <br> <br>Nomad is an interactive typeface based on this socio-biological <br>diagram of human society, where basically each character <br>(biological entity) consists of independent cells each with their <br>own given code. Once typed, these codes work together to form the <br>Nomad characters. As these characters grow into words, sentences <br>and eventually paragraphs they in turn from lager reactive structures <br>each with their own unique identities. <br> <br>Unlike other typefaces in its similarity to biological creatures, <br>Nomad relies on its complex structure and its ability to react to <br>touch to create a more fluid relationship between the user and itself. <br>Based on the aforementioned principles, I have designed two prototype <br>versions of the Nomad typeface. One, which manifests its independent <br>of external stimuli through motion, and the second which has an <br>interactive component that reacts to external stimulus, thus allowing <br>it to recognize the presence of the user. <br> <br>Handwriting allows one to establish the existence of its creator as it <br>differs from person to person. Nomad act like handwriting in a network <br>situation expressing the existence of the other user through the state of <br>its interactivity or motion. As a result of this type of mediation we can <br>begin to be felt across the network. <br>(originally Nomad was developed for touch screen) <br> <br>Thanks for the advice. It encourage me to do another project. </p>
