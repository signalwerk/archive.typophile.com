    html: <p> Hah. Good points. I should say that I haven't  <br>bought RVL's argument outright. But I do think it's  <br>useful as a way to put legibility in context. <br> <br>You can see how, in the case of Nomad (and even in  <br>the some of the old Ray Gun stuff) how the seeming  <br>abandonment of legibility is just another design  <br>'element' or 'treatment' (for lack of a better  <br>word). That diminished legibility requires readers  <br>to participate more closely or more actively. When  <br>this is used properly it can be powerful or  <br>delightful or engaging. Used improperly you could  <br>lose your audience and fail to communicate your  <br>message. <br> <br>In essence I agree with you Hrant. It takes a good  <br>understanding of the rules of legibility and  <br>readability (and the distinctions of the two) in  <br>order to intentionally break them and achieve a  <br>desired result. <br> <br>//joe </p>
