    html: <p> Whow, that's one of the most interesting graphical type experiments I've seen in a long time. But I wouldn't use the word legibility anywhere near it. It's art based on letters, but would fail as a means of passing on information. And it just kept me from work for a surprisingly long time :-) </p>
