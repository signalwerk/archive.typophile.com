    html: "<p>I think it's certainly legible (one is able to <br>distinguish one letter from another) with some <br>effort. In fact there's a great surprise in <br>discovering that they are indeed letters. I think  <br>that's what makes this experiment so interesting,  <br>it engages the viewer/user in ways other faces  <br>cannot. <br> <br>Rudy Vanderlans had this to say about legibility: <br> <br>In regards to legibility, the Dutch designer Peter  <br>Mertens once said it best: \"Typefaces are legible.  <br>If some things are not legible, then they are not  <br>letters. Illegible letters do not exist.  <br>Illegibility does not exist.\" That, as far as I'm  <br>concerned, pretty much answers the question  <br>regarding illegibility. <br> <br>The full text of the interview is at <br><a href=\"http://www.emigre.com/VanderLans.html\" target=\"_top\">http://www.emigre.com/VanderLans.html</a>. <br> <br>It's worth noting that this has nothing to do with  <br>readability...  <br> <br>//joe</p>"
