    html: <p> Help! I think my childhood Spirograph set is posessed! <br> <br>I am really impressed by the interaction of the various cells, and the surprising gestalt legibilty. This really would be an interesting face for movie or web page titles. And it's fun to poke at the interactive characters and see how they react. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>My only major design concern is that the "D" and the "O" are a bit too similar, making them hard to distinguish. Have you tried making an "O" out of three overlapping concentric cells, rather than overlapping portions of the cells, as in the "D"? <br> <br>Congratulations on a truly interesting experiment. <br> <br>David Thometz </p>
    html_clean: <p> Help! I think my childhood Spirograph set is posessed! <br> <br>I am really impressed by the interaction of the various cells, and the surprising gestalt legibilty. This really would be an interesting face for movie or web page titles. And it's fun to poke at the interactive characters and see how they react. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>My only major design concern is that the "D" and the "O" are a bit too similar, making them hard to distinguish. Have you tried making an "O" out of three overlapping concentric cells, rather than overlapping portions of the cells, as in the "D"? <br> <br>Congratulations on a truly interesting experiment. <br> <br>David Thometz </p>
  - id: 143412
