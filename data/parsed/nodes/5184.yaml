    html: "<p> Gerhard: <br> <br>I agree, this isn't a typeface that anyone should use to set a text block. That's why I was careful to use the word \"gestalt\" when describing its legibility. (Is \"readability\" perhaps the preferred term here? All of my dictionaries give almost identical definitions for the two words, i.e., \"capable of being read.\") <br> <br>In any event, it is fascinating how the cells' overlapping shapes coalesce into recognizable glyphs that can and do, in fact, succeed in communicating information. Not large amounts of information, mind you, but with proper attention paid to spacing, setting and context, this typeface certainly lends itself to display/head information. <br> <br>David Thometz </p>"
    html_clean: "<p> Gerhard: <br> <br>I agree, this isn't a typeface that anyone should use to set a text block. That's why I was careful to use the word \"gestalt\" when describing its legibility. (Is \"readability\" perhaps the preferred term here? All of my dictionaries give almost identical definitions for the two words, i.e., \"capable of being read.\") <br> <br>In any event, it is fascinating how the cells' overlapping shapes coalesce into recognizable glyphs that can and do, in fact, succeed in communicating information. Not large amounts of information, mind you, but with proper attention paid to spacing, setting and context, this typeface certainly lends itself to display/head information. <br> <br>David Thometz </p>"
