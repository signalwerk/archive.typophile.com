    html: <p> Thanks for making the distinction between legibility and readability. But by doing so you have effectively validated the relevance of both! The RvL quote is really too simple-minded. Saying "legibility does not exist" is like saying "communism does not exist". No concept can exist in its pure state, sure. But even though the Soviet Union was not -and could not have been- a "pure" communist state, it was certainly more communist than the USA. In the same way, Quadraat is more legible (and certainly more readable) than FF Extra. Pretending otherwise is often an escape from having to take the non-artistic issues in typography/type_design seriously, and this leads to inferior communication. <br> <br>Note that intentionally downplaying legibility is something else. It's OK, as long as you have good reason to do it. But legibility *does* exist, and how! <br> <br>hhp </p>
    html_clean: <p> Thanks for making the distinction between legibility and readability. But by doing so you have effectively validated the relevance of both! The RvL quote is really too simple-minded. Saying "legibility does not exist" is like saying "communism does not exist". No concept can exist in its pure state, sure. But even though the Soviet Union was not -and could not have been- a "pure" communist state, it was certainly more communist than the USA. In the same way, Quadraat is more legible (and certainly more readable) than FF Extra. Pretending otherwise is often an escape from having to take the non-artistic issues in typography/type_design seriously, and this leads to inferior communication. <br> <br>Note that intentionally downplaying legibility is something else. It's OK, as long as you have good reason to do it. But legibility *does* exist, and how! <br> <br>hhp </p>
