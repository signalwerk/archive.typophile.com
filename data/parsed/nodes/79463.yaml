    html: |-
      <p>Mike, have you ever visited myfonts.com ? You can use their search box to search fonts by descriptive keywords ("strong" or "construction" or whatever), and when viewing a font you can use the "sample text" box to see how a word or phrase looks in that font. And if you find something you like you can buy and download it there. You might find it useful.</p>
      <p>&gt; I am somwhat against using a symbol at all </p>
      <p>Mike, speaking as a designer myself, you're way too early in the project to draw that conclusion. You need to go through the design process of gathering info on the client, analyzing their marketing goals,  researching what similar companies (especially the competition) use for logos, and coming up with a whole bunch of creative concepts, both for symbol logos and also for type logos. Then narrow it down to a few concepts you like best, fine-tune them, and show them to your client for his feedback.</p>
      <p>Maybe the final solution will be all type. Maybe it won't. You're not going to know until later in the process after you've seriously explored a wide range of ideas.</p>
      <p>Come up with some concepts and post them here for feedback. They don't need to be perfect drawings; just good enough to communicate your ideas.</p>
