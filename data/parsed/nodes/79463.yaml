      <p>thanks for the input.</p>
      <p>one of the things i have to learn is to put any preconceived notions about how it should be aside. I have a habit of thinking of a logo idea first and then trying to fit it in but resizing, adjusting, changing color. I think its good advice to start with a blank sheet of paper and a pencil and just brainstorm, writing or sketching anything at all that comes to mind. Then narrowing it down from there. </p>
