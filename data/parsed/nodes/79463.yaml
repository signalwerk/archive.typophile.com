    html: |-
      <p>Thank you!</p>
      <p>I thought that some custom drawn would be best. My drawing style is probably the furthest thing from clean and precise though. I suppose I could start with graph paper, a ruler, circle templates and some french curves. Then scan my drawing and convert the letters to vector shapes.</p>
      <p>I am somwhat against using a symbol at all although my friend (client) seems to think it is important. I'm going to be including "construction" or "home improvment" in the logo so an outline of a roof, or a hammer or saw blade is not necessary imo. I told him that clever logos &amp; graphics are cool if they work but you dont want people remembering "that cool logo with the circular saw blade for the "O", you want them remembering the name of your company. </p>
      <p>I've got a few vector drawings of symbols i might use but I feel like im forcing them into the design. I was hoping that the right font would either be sufficient or suggest the proper companion graphic. </p>
      <p>I really like that Gotham-Bold. In most fonts i tried, I had problems with the G which it the first letter of his name "Gannon" so I wanted it to be strong. Most of them were too "narrow and curvy" (pardon my lack of correct terminology, im working on it)<br>
      Thanks<br>
      mike</p>
