    html: |-
      <p>"I'd suggest Gotham bold"</p>
      <p>I say, figure out the symbol first (stylistically they need to relate). And think about something the type should communicate other than meaningless market phrases (except for durability and precision).</p>
      <p>Logos that rely on letterforms alone are usually modified or custom drawn letters: for uniqueness, better handling of white space, collisions ... the list goes on. Just picking a font is rarely enough to create something "durable" and "unique".</p>
