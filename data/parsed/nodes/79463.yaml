    <p>First off, let me introduce myself since this is my first post.<br>
    My name is Mike, I am a graphic design student. I am from the new england area and enjoy playing the banjo, long walks on the beach and murde...i mean, scrabble. :)</p>
    <p>I've always been more creatively inclined but after a misguided youth I found myself at 30 years old going back to school to begin to acquire some skills needed to enter the graphic design/advertising business.</p>
    <p>Anyway... </p>
    <p>I'm trying to help a friend out and make him a logo for his construction company.<br>
    I've decided (along with his input) that the best option would be to forgo using clipart tools to make letters form his name ;) and stick with just his name with maybe a small graphic.</p>
    <p>Im having trouble finding a perfect typeface. I'm looking for something strong and clean. Something to suggest durability and precision. Something bold and unique. I thought that using something other than the stock fonts on my computer I would look into maybe licensing something or at least getting something that isnt as common as some of the more popular options.</p>
    <p>Hoping for suggestions...</p>
    <p>Thanks in advance,<br>
    Mike</p>
