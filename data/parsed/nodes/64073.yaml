  html: |-
    <p>i am currently fiddling around with some <strong>Open Type Features</strong> and for some reason cannot make the following script get to work after compiling: </p>
    <p>feature solr { #Solarsys planets<br>
      sub s u n by a;<br>
      sub m e r c u r y by b;<br>
      sub v e n u s by c;<br>
      sub e a r t h by d;<br>
      sub m a r s by e;<br>
      sub j u p i t e r by f;<br>
      sub s a t u r n by g;<br>
      sub u r a n u s by h;<br>
      sub n e p t u n e by i;<br>
      # luminary<br>
      sub p l u t o by j;<br>
      sub m o o n by l;<br>
      sub c o m e t by m;<br>
      sub c e r e s by o;<br>
    } solr;</p>
    <p>When typing the letters in <em>FontLab</em> everything works fine, when typing the exported font in for instance <em>Indesign</em>, the substituted signs won’t show up.<br>
    <a href="http://tinyurl.com/ylxvpkz" title="http://tinyurl.com/ylxvpkz">http://tinyurl.com/ylxvpkz</a><br>
    Any ideas what could have gone wrong? Thank you and sorry if this subject has already been discussed before.</p>
