      <p>So the resolution is about 111 dpi. Indeed that’s not high enough to make “dumb” anti-aliasing crisp enough, especially when you factor in the small screen size, which will encourage closer viewing distances than a computer monitor. Something like Myriad counts as “dumb” when it comes to anti-aliasing at text sizes*. On the other hand, 27pt <em>should</em> be large enough... unless you’re super-picky like me. :-)</p>
      <p>* Actually Apple had a special version of it made for<br>
      the iPod (or something) to make it come out crisper.</p>
      <p>Coming around to b&amp;w rendering, the thing is that if the Freetype engine can’t handle superhinting, you can’t really take advantage of the MS Core Fonts. If so, how easy would it be for you to license an engine that can?</p>
      <p>But now I’m wondering: why did you give up on grayscaling? Only because the results you’ve been getting are poor? Because it doesn’t have to be so:<br>
      <a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a><br>
      And you don’t need any special TT engine.</p>
      <p>Now, if you’re totally set on b&amp;w, but your TT engine doesn’t handle superhinting (and you want to avoid changing engines*) then you could use what’s called a pixelfont: a blocky outline font specially designed to render out crisp bitmaps at a single point size. In fact Mana is a pixelfont, but grayscale.</p>
      <p>* Insert Formula-1 joke here.  :-)</p>
      <p>hhp</p>
