    <p>Hello,</p>
    <p>I’m new to this forum. I hope I’m posting in the correct category for this question.</p>
    <p>I’m designing a user interface for a touch screen application. The screens are in 2 colors (black and white) only. Because of this, I’m looking into using bitmap fonts, as vector fonts are not rendering well. My questions are:</p>
    <p>1. Where can I find good quality bitmap fonts? </p>
    <p>2. Does anyone know of any vector fonts that would render well on 2 color screens?</p>
    <p>Thanks in advance for any information.</p>
    <p>Lucie</p>
