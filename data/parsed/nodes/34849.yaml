      <p>OK, we’re narrowing this down nicely.  :-)</p>
      <p>The MS “core fonts” were never intended to be used without superhinting enabled, so you will see quite a bit of clumping of pixels and missing pixels, especially at smaller sizes. They do have “regular” hinting which helps, and I assume your engine is handling those - otherwise the results would probably be way unacceptable. But even without superhinting available it’s not surprising they render better than Myriad for you, since a coarse grid is implicit in their design.</p>
      <p>Basically if you’re talking about an outline font that’s designed to render very well without [super]hinting (which it can only do at one size) you’re talking about a pixelfont. Typically pixelfonts are blocky*, “literally” mapping outlines to pixels. If you scale them to a size other than the intended one** you get tons of blur; the interesting thing in your case is that it’s in b&amp;w, so you don’t get blur, but you will get very jumpy color and some distorted letterforms. As for seeing what the “actual size” of a bitmap font is: the bad news is that there’s no way to be sure without being told what it is; but the good news is that it’s usually 8 (a pseudo-standard in the pixelfont world), and if it’s not you can figure it out by either trying some numbers, or looking at it in a font editor.</p>
      <p>* Although they don’t have to be.</p>
      <p>** Unless you scale them to even multiples, like x2, in which case you basically get bitmap fonts with multi-pixel blocks.</p>
      <p>Font formats/extensions: TTF fonts are outline fonts, which is what pixelfonts are; FON fonts are “traditional” bitmap fonts, where the pixel patterns are stored as data (as opposed to being rendered by -sort of in spite of- a TT rendering engine). FON seems more intuitive, but its not well-supported. Because TT engines are very uniform, portable and robust, pixelfonts end up being a much better vehicle for rendering bitmap fonts.</p>
      <p>There’s a twist though: TT fonts can actually house embedded true bitmaps. These are rendered instead of the outlines when the right size is chosen. This is what I did for Arasan some years ago*. The advantage is that you have the scalable outlines in there, but you get “perfect” rendering at a given size (in fact multiple sizes, which you can’t do with a single pixelfont) without the headache of superhinting. The disadvanatge is that some TT engines (like the one in OSX) will ignore the embedded bitmaps.</p>
      <p>* <a href="http://www.themicrofoundry.com/f_arasan.html" title="http://www.themicrofoundry.com/f_arasan.html">http://www.themicrofoundry.com/f_arasan.html</a></p>
      <p>So it seems to me that, if you’re not going to enable superhinting, you need to go with either a set of TT pixelfonts that cover the sizes you need, or go with a single TT font with embedded bitmaps. This latter you’d have to test to see if it works. I can send you Arasan to test if you like; even though you probably can’t read Armenian :-) you’ll see if the bitmaps are clean or not, or you could email me a screen grab and I’ll tell you.</p>
      <p>hhp</p>
