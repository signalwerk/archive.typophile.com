      <p>Yes, the resolution would be more helpful, but the pixel size does help - like now we know it’s sort of small, which means the optimal point size (better: ppem) is smaller than otherwise, to fit more text. If you could tell us the physical size of the screen that would complete the picture so to speak.</p>
      <p>But a bigger issue is that you’re running a custom GUI, which means your font rendering software could be... what, Freetype? It sounds like you can actually use outline fonts, so you’re not limited to “true” bitmap fonts (like in a BDF or FON format).</p>
      <p>On the other hand, you say you’re using an XP machine and standard software to “create the graphics” - does that mean you’re just making canned graphics which are copied to the touch-screen device, and the device doesn’t really [need to] know what a font even is? If so, then all you need to do is use one of the MS “core fonts”, like Verdana* and Georgia, but when you render them in Photoshop turn off anti-aliasing. These fonts are “superhinted”: althought they’re outline fonts which can render out in grayscale, they contain special instructions to make them render out very nicely in 1-bit.</p>
      <p>* Which sets very wide however.</p>
      <p>Sorry if this seems more confusing than helpful - we’ll figure it out eventually don’t worry!  :-)</p>
      <p>hhp</p>
