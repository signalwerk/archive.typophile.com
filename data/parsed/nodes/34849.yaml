      <p>Lucie, </p>
      <p>The terminology is: .fon are bitmap fonts, .ttf with “blocky” appearance are pixelfonts. And then, you have other types of outline (.ttf) fonts that I would call “screen-tuned”, which lend themselves towards screen display. They may do so by using different techniques, but the most typical one is to adapt the outline shape so that the final pixel patterns are best. </p>
      <p>The adapted outline shape can be inherent to the design to produce reasonably good results across many sizes (as in case of the Microsoft ClearType collection fonts), or they may be tweaked so that one particular size appears particularly well. In addition, they may employ delta hinting (native TrueType hinting) to adapt/distort the outline even further, depending on the size, to cover a broader range of sizes. </p>
      <p>If you are worried about compiling FreeType with native TrueType hinting enabled, you should be worried twice as much about the prospect of including unlicensed fonts in the device. From what you’ve been writing, I think you expect to get the font “for free”, i.e. that it could be bundled with the display device free of charge. </p>
      <p>I don’t think you’ll have much luck with it. Just like your work costs money, the development of screen fonts also does. Pretty much all of the fonts that were mentioned here, made by Microsoft, Adobe, Apple or ParaType, come with licensing agreements that don’t allow their free distribution across other devices. You (or the device vendor, actually) would need to purchase a license to cover the bundling on the device. </p>
      <p>An aliternative might be to commission a design of a new font that would suit your needs, and obtain all rights to it. </p>
      <p>But none of these will come for free, I believe. Especially if you want high quality. </p>
      <p>Regards,<br>
      Adam</p>
