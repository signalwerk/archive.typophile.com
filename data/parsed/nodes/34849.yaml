      <p>Luciel, </p>
      <p>Linotype XSF, Monotype ESQ, Adobe WebType and ParaType superhinted fonts are all optimized with the native TrueType hinting in mind. If you don’t use the native TrueType hinting but use the FreeType autohinter, you may get reasonable results when using a font that has been optimized for ClearType display, such as Calibri or Corbel from the Microsoft ClearType collection (<a href="http://www.ascendercorp.com/ctfonts.html" title="http://www.ascendercorp.com/ctfonts.html">http://www.ascendercorp.com/ctfonts.html</a> ) or Ascender Mayberry (<a href="http://www.myfonts.com/fonts/ascender/mayberry/" title="http://www.myfonts.com/fonts/ascender/mayberry/">http://www.myfonts.com/fonts/ascender/mayberry/</a> ). The Segoe UI font, which is the default UI font on Windows Vista, might also work well. </p>
      <p>However, I very much doubt that you’ll be able to achieve really good results when using purely black-and-white display with the native TrueType hinting OFF. FreeType autohinting really works well only with antialiasing — for aliased type, you pretty much need native hinting. </p>
      <p>Well, actually, there is probably a way that would allow you to produce very good results under the circumstances you describe, but it would involve custom font development and some trickery. You may contact me offlist if you’re interested at adam at twardoch dot com. </p>
      <p>Best,<br>
      A.</p>
