      <p>Hi Lucie,<br>
      you can find out whether a TT font has embedded bitmaps by checking for existence of ’EBLC’ table. One can dump font tables using TtfDump from <a href="http://www.microsoft.com/typography/tools/tools.aspx" title="http://www.microsoft.com/typography/tools/tools.aspx">http://www.microsoft.com/typography/tools/tools.aspx</a></p>
      <p>But I think a more interesting question is whether a font has embedded bitmaps for the particular glyph/size combinations you care about. To do that, you can inspect the ’EBLC’ table contents using the documentation from <a href="http://www.microsoft.com/typography/otspec/eblc.htm" title="http://www.microsoft.com/typography/otspec/eblc.htm">http://www.microsoft.com/typography/otspec/eblc.htm</a></p>
      <p>Hope this helps, and best regards,<br>
      Mikhail Leonov<br>
      Windows Text team<br>
      Microsoft</p>
    html_clean: |-
      <p>Hi Lucie,<br>
      you can find out whether a TT font has embedded bitmaps by checking for existence of ’EBLC’ table. One can dump font tables using TtfDump from <a href="http://www.microsoft.com/typography/tools/tools.aspx" title="http://www.microsoft.com/typography/tools/tools.aspx" class="link-external">http://www.microsoft.com/typography/tools/tools.aspx</a></p>
      <p>But I think a more interesting question is whether a font has embedded bitmaps for the particular glyph/size combinations you care about. To do that, you can inspect the ’EBLC’ table contents using the documentation from <a href="http://www.microsoft.com/typography/otspec/eblc.htm" title="http://www.microsoft.com/typography/otspec/eblc.htm" class="link-external">http://www.microsoft.com/typography/otspec/eblc.htm</a></p>
      <p>Hope this helps, and best regards,<br>
      Mikhail Leonov<br>
      Windows Text team<br>
      Microsoft</p>
