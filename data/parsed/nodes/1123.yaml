    html: <p>I love where you've gone with this already. You have done an excellent job humanizing the logo, which makes it very personal. There are definitely some spacial and weight issues with the lettering, but I'm so attached to the living, breathing human nature of it that I'm inclined to ignore any specific comments for change. <br> <br>In order to avoid a complete copout, I guess I wouldn't mind seeing some of the shapes from the dog illustration introduced in the lettering (i.e. rounded white shapes from eyes, nose and ear being mirrored in the "R's", "B" and/or "A" counters). Also, there is a weight relationship between the dogs head and body and the legs and tail. It appears that you may have already tried to incorporate some similar weight relationship between the Perro and Urbano words, but I think this can be pursued a little more. Maybe even between the weight within each letter. <br> <br>Good luck! Again, I like where this is going. <br> <br>Aloha! <br>Scott</p>
    html_clean: <p>I love where you've gone with this already. You have done an excellent job humanizing the logo, which makes it very personal. There are definitely some spacial and weight issues with the lettering, but I'm so attached to the living, breathing human nature of it that I'm inclined to ignore any specific comments for change. <br> <br>In order to avoid a complete copout, I guess I wouldn't mind seeing some of the shapes from the dog illustration introduced in the lettering (i.e. rounded white shapes from eyes, nose and ear being mirrored in the "R's", "B" and/or "A" counters). Also, there is a weight relationship between the dogs head and body and the legs and tail. It appears that you may have already tried to incorporate some similar weight relationship between the Perro and Urbano words, but I think this can be pursued a little more. Maybe even between the weight within each letter. <br> <br>Good luck! Again, I like where this is going. <br> <br>Aloha! <br>Scott</p>
