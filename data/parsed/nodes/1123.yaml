    html: "<p>Maria, this has a nice Art Chantry feel and seems <br>appropriate for its intended use. <br> <br>I still think it could be improved some. <br> <br>a couple of suggestions/opinions/things to look at: <br> <br>^  take a look at the balance, left to right, top to bottom. <br>Seems a bit unbalanced. <br> <br>^  the P connecting to the U. Would it work <br>better if the letters didn't connect? Michael <br>Harvey, for one, frowns on the designer connecting <br>ascenders and descenders and stems in stacked designs. <br>But it works nice in \"Catch Me\" titles... <br> <br>^ the two Rs in Perro could be mistaken for Ps. <br> <br>^ the unfilled eye looks odd. <br> <br>good luck. Dog puns edited out. <br> <br> <br>bj</p>"
