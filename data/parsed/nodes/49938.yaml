    html: |-
      <p>Flash probably could do what I want, but a lot of this would be simpler if I used a custom font.</p>
      <p>I simple terms I'm looking to have a font with characters that are twenty two normal characters wide, that all superimpose on each other, i.e. after a newline, all the characters display themselves from an origin that is the left edge of the text area with no "advance character width" before printing the next character.</p>
      <p>I'd only need twenty two characters to cover the letters a steno machine can produce, which leaves lots of characters available for special effects, e.g. overlays that hint at the fingering needed.</p>
      <p>I'm also thinking of using a half slivered mirror to superimpose this on the keyboard, so I could have a duplicate, but mirroring version. </p>
      <p>Tom FEtherston</p>
