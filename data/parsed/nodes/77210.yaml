    html: |-
      <p>@ Joerg: I just added some weight to the z and comma, so it's good to hear my eyes told the truth. I based in somewhat on Garamond to speeden up the design process. It's not meant as a sans-serif companion for Garamond. On of the many changes I've made so far is decreasing the length of the ascenders, which I couldn't/shouldn't have done if it was a companion for Garamond. The tittles are Garamond's size and I like them too. I find the c too wide in many typefaces. I guess I didn't make mine too compressed then. =D</p>
      <p>@ Frode: The k in Relato sans has a much wider gap. The gap in Sensa (I've decided to name it Sensa now) disappears at text sizes. I have made changes to every glyph shown above, many of them increasing/decreasing weight, so I hope what you say about the y is fixed now.</p>
      <p>Thanks for your comments guys. I'll upload an update in a few days.</p>
