    <p>Hello Everybody,</p>
    <p>As Expletus Sans is coming to completion, I started working on some new ideas. After I had drawn the a I just had to complete the lowercase. It's still in a very early stage of the design process, so no proper spacing/kerning except the kerning already in Adobe Garamond. It's not exactly based on Garamonds proportions, but I did use it as a reference, so for now the name Garamond Sans will do. Before you comment any serious critique I would like to know if you know of any similar fonts. Hope you like it!</p>
    <p>Cheers,<br>
    Jasper de Waard</p>
    <p><img src="/sites/default/files/old-images/garamond-sans_6355.jpg"></p>
