    html: |-
      <blockquote><p>what is meant by "the complete font is not embedded"?</p></blockquote>
      <p>Exactly what it says. The two most common options when embedding fonts in a PDF are:</p>
      <p>1) to embed the complete font, which would mean all of the characters/glyphs, regardless of whether or not they have been used to generate the content.</p>
      <p>2) to subset the font, which will only include the characters/glyphs required to display the content. This would appear to comply with their requirements.</p>
      <blockquote><p>Is it possible to "hack" and extract a font from a normaly exported static pdf?</p></blockquote>
      <p>Yes, if you have used one of the embedding methods mentioned above. However, not all of the font data is retained and you are usually left without metrics data such as the kerning. If by "static" you mean that the text has been transformed to outlines or rasterised prior to being exported, then no font data, other than the design, will be retained in the PDF.</p>
