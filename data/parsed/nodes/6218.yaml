    html: <p> High five. <br> <br>I like the more recent version. I'm not sure that a type-face is the right way to express whatever needs to be expressed, but the second version, with the tattered characters, is definitely more expressive. I would tear it apart a lot more. the shapes of the trade towers columns are compelling, but the shapes of the letters are so clean and nice, it doesn't work. It feels wrong. If I were to use this face it would be silk-screened, or rubber stamped then torn to peices. The ultra-clean, CNN looking gradient doesn't help much either. <br> <br>There is nothing wrong with a morbid subject-- but say something about it. Being cute or clever won't cut it here. </p>
