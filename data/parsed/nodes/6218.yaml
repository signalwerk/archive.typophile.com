    html: <p> first offf i don't think this is a morbid font at all. it is something the whole world has experienced. i myself contributed to the Sept. 11 fontaid 2 font. (UC "S"). from the time i woke up in my home in California to watch the second plane hit the tower,till right know, i have felt that making the glyph's for font aid was something (as a type designer) i could do for my country. and for the others glyph's in font aid, it was how the world of type designers delt with there feelings. i also submitted an "H" the looked like the WTC.(the only released the ? font) <br>and as for "INFAMY" i think it is GREAT, this is oviously how you are dealing with this world tragdey. i like the idea of having a version with the ground and without. and someone posted eariler that the lc looks more "controled" than the UC. don't get discourged cause a few people don't understand the drive behind the font. <br>keep it up and i'll be looking for it this month!( on Sunday) <br>deadbeat </p>
