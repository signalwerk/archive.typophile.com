    html: <p> ﬁrst oﬀf i don’t think this is a morbid font at all. it is something the whole world has experienced. i myself contributed to the Sept. 11 fontaid 2 font. (<span class="caps">UC</span> “S”). from the time i woke up in my home in California to watch the second plane hit the tower,till right know, i have felt that making the glyph’s for font aid was something (as a type designer) i could do for my country. and for the others glyph’s in font aid, it was how the world of type designers delt with there feelings. i also submitted an “H” the looked like the <span class="caps">WTC</span>.(the only released the&nbsp;? font) <br>and as for “<span class="caps">INFAMY</span>” i think it is <span class="caps">GREAT</span>, this is oviously how you are dealing with this world tragdey. i like the idea of having a version with the ground and without. and someone posted eariler that the lc looks more “controled” than the <span class="caps">UC</span>. don’t get discourged cause a few people don’t understand the drive behind the font. <br>keep it up and i’ll be looking for it this month!( on Sunday) <br>deadbeat </p>
