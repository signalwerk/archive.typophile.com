    html: <p> Hello Jared! <br> <br>Me too I am as dubious as you are. I don't know why your opinion and your comments "wake the Devil in me"! <br>Since the first time I saw the rubble at Ground Zero I got the idea to make a type with these tortured structures. A few days later, it was announced that a part of the structures will be preserved to make a memorial at WTC site. This is what decided me to start working on this design. Life isn't a garden of roses and artists (which I think I am not!) have to react their way to catastrophes or tragic events or to beautiful and nobles actions as well. "Infamy" is my way to react. I am not as famous and as smart as Picasso (I suppose you know that!!!) but remember Guernica. Do you think this masterpiece is somewhat "morbid"? I don't think it is. It is a angry shout against horror and human cruelty. <br>I decided to make a typeface (which is conceived to be a long lasting object) because of the iconic nature of the rubble. And also because I am not convinced your fellow citizens really want to sooth their wounds when I watch 24/7 CNN Breaking News or when I listen to interviews of ordinary people or politicians (of both sides) or when I read Time magazine or The New York Times or the Enquirer (sic!). I am not convinced too when I heard about the WTC Memorial which will integrate wreckage of the Twin Towers (with a "cross" made from the structure!!!, just enough to start a religious war!!!).  <br> <br>I am sure that people will use this font in the future for titles which need to refer to a symbol of human cruelty. And if they won't, it will be too bad for me. <br> <br>Anyway, thank you for revealing your position in such a polite way. And I can say that I completely share your opinion about the September 11 font. I already knew this font and you know what? I found it much more morbid than mine and particularly the sample you posted! Just because it shows the action instead of showing the horrible result. Some design my peers made show a complete lack of decency. <br> <br>Warmest regards </p>
