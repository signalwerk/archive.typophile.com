    html: "<p>Hello to all my friends on this forum. <br>I've been out for a while because my priority was to refine the design of the faces in order to release good products. <br> <br>I have stuctured those designs into a family which generic name is \"Infamy\". The family offers three different typefaces: \"Ground Zero\", \"Towers\" and \"Infamy\" (this last one still in development).  <br> <br>You can see in the pictures how different they are and what their structures have in common. <br> <br>Your valuable comments are strongly welcomed and some of the guys who made suggestions will recognized that I've used some of their remarks in my final work. <br> <br>For the time being, my main problem is how to publicize this family. My web site isn't enough and I don't have the money to pay for a top appearance in the results of the search engines. More, I do not have any net of connections able to efficiently inform the good persons in the good places about these faces (TV Producers, Papers and Magazines Editors, etc). If anybody has an idea about how to achieve this goal, feel free to contact me ASAP. Many thanks and my deepest grateful thoughts in advance for your help! <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"FMLY.gif\"><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"GZ.gif\"><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"TWRS.gif\"></p>"
