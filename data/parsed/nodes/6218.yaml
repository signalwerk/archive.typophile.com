    html: <p> Wow… What an interesting thread this is shaping up to be. <br><br>I completely agree with what has been said about both the September 11 font and this one. They are evocative of very unsettling reactions. <br><br>Perhaps where we diﬀer is that I see this uncomfortable reaction as an eminently good thing; indeed, I believe that reaction to be exactly the point of both of these fonts. <br><br>The events of September 11 were, without question, some of the most abhorrent, tragic, morbid and heart-rending events I have witnessed in my lifetime. In fact, the day could easily be argued to have been the most signiﬁcant world event in my lifetime. <br><br>As such, while it is certainly necessary to heal from the pain the events inﬂicted, it is also necessary to recognize the signiﬁcance of the scars they have left behind. <br><br>Like the Nazi Holocaust, Jonestown, and countless other tragedies, little service is paid to their memories by ﬁnding only comfortable ways to remember them. Indeed, no service is done to their memory by allowing ourselves to forget or gloss over the pain they have caused. Of course there is a ﬁne line between morbidity and boldly/proudly displaying the scars of our experience; but I do not think that eﬀorts such as these two designs even approach such a line, and I hold that opinion completely apart from the fact that proceeds from the sale of the fonts will be donated to charities dealing with the disaster. It should be remembered that if it hadn’t been for the horriﬁc images seen on the broadcast and print news, those of us who weren’t there to experience it ﬁrsthand really wouldn’t have had the same sense of the depth and scope of what really happened. <br><br>Is it uncomfortable to be reminded of the images of the occupied planes slicing into inhabited buildings, or the images of terriﬁed people jumping hopelessly from windows a hundred ﬂoors oﬀ the ground, or the images of those still-occupied buildings crumpling into twisted, grinding, smouldering piles of debris? <br><br>It is excruciating. And it should be. <br><br>Art, including in this sense typographic design, should be provocative (or evocative) when it wishes to be, and I believe that both of these fonts have achieved that goal, among others, in their own ways; “Infamy,” as an evocative functional display font, and “September 11,” as (at least) an evocative exercise in typographic expression. <br><br>Responses are welcomed and encouraged, as always. <br><br>David </p>
