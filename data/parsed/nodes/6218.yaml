  html: <p>I am a Type Designer based in Canada. I am just ﬁnished with the design of  <br>“<span class="caps">INFAMY</span>” which is inspired by the rubble at <span class="caps">WTC</span> site. Here is a sample of  <br>the typeface. I don’t know how  <br>American people will judge the design which is a protest (as well as the  <br>font name) against the horror, the terror and the human cruelty. Typeface will be on sale on November 11th at my Website  <br>(<a href="http://www.germaris.com" target="_top">http://www.germaris.com</a>)-with a 25% donation to the <span class="caps">UFA</span> Widows and  <br>Children’s Fund.<img src="http://www.typophile.com/forums/messages/29/447.gif" alt="full_infamy_mail.gif"></p>
