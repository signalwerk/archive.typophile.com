      <p>PRESENT and BY appear to be some form of Bank Gothic (though very hard to tell given the tiny size of the sample; when scanning, focus only on the type you need identified and scan as large as possible):<br>
      <a href="http://www.myfonts.com/fonts/bitstream/bank-gothic/" title="http://www.myfonts.com/fonts/bitstream/bank-gothic/">http://www.myfonts.com/fonts/bitstream/bank-gothic/</a></p>
      <p>My best guess for AUDRA and LANIE is Trade Gothic Condensed:<br>
      <a href="http://www.myfonts.com/fonts/linotype/trade-gothic/" title="http://www.myfonts.com/fonts/linotype/trade-gothic/">http://www.myfonts.com/fonts/linotype/trade-gothic/</a></p>
      <p>The text time is garden variety Times (without a larger size sample, hard to determine whether it's Times, Times New Roman, etc.):<br>
      <a href="http://www.myfonts.com/fonts/apple/times/" title="http://www.myfonts.com/fonts/apple/times/">http://www.myfonts.com/fonts/apple/times/</a></p>
