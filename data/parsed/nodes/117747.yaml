    <p>Hi, </p>
    <p>I’m trying to figure out what some typefaces are related to two different images from the inside of Playbills: </p>
    <p>In the first attachment, I’d like to know what typefaces are used for “PRESENT” and “AUDRA MCDONALD” or “BY” and “LANIE ROBERTSON.” “PRESENT” and “BY” look a a little like Sweet Sans, but don’t think that’s it. I don’t know what’s used for “AUDRA MCDONALD” or “LANIE ROBERTSON.” </p>
    <p>In the second attachment, it would be great to know what typeface is used for “ACT II,” as well as the info below it related to the the Scenes, Scene Names, Characters, etc. They all look to be the same typeface (bold and roman being the only difference) and I think are standard across most Playbills but don’t know what they are. </p>
    <p>Any assistance would be greatly appreciated.</p>
