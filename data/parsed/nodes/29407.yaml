      <p>Whose idea was it to set all student newspapers originally in Helvetica/Times? When I redesigned my school's paper, that's exactly what it was. Ditto for just about every school redesign I've heard of. </p>
      <p>I used Myriad for things like photo credits and cutlines because it is very useable at small type sizes because of its open counters and the large x-height. I also decided to use Garamond Pro for the body copy and for certain headlines since I wanted our paper to feel classy. For the masthead and other various headlines I went a little crazy and chose Old Claude, a cool distressed Garamond. That really sent my design into the direction of early broadsides.</p>
      <p>Caslon is very readable. And very, very boring. Caslon, Helvetica, and Times have the market cornered on what my roomate calls "that just looks like a regular font to me" category. Regular=Boring.</p>
      <p>I'm undecided about Chapparal, but I believe that Bringhurst said he likes it. (That goes along with Sii's comment. I say go for the Vancouver connection.)</p>
