      <p>I'm partial to Chaparral, too (as I am to any good slab-serif, especially less geometric ones). Of the three text fonts you seem to have, Minion, Garamond, and Caslon, I'd try each of them out (preferably on your printing press, or at least at actual size) to see which one is the most legible and matches the "feeling" you want to convey. I don't know, but Chaparral could be an interesting change of pace as your body text typeface. My point with buying a typeface or two of your own is that it's not guaranteed that any of these typefaces will match the spirit of the paper quite well enough. But one or two very well could.</p>
      <p>For headlines, I'd either go with the same typeface you chose for body text or use a very different one. My point is, don't use something like Minion for body text and then Garamond for headlines, as they're too different to work but not dissimilar enough to harmoniously contrast. Again, just try out different combinations until you find one that works for you.</p>
      <p>If you have any other questions about redesigning/high school newspaper issues, feel free to contact me privately by clicking on my name and choosing "Contact."</p>
