  html: <p>I'm designing a high school newspaper. Right now we're using Helvetica oblique for headlines and Times for text. Most of the other fonts we have now aren't usable for either one. (We do have Minion, and that's about it.) I'm looking for headline and text fonts that are free or cheap for educational use and would be suitable for a newspaper.</p>
