      <p>If you have Minion, that likely means that you have a number of other Adobe Pro fonts installed. You might have Adobe Caslon Pro, Adobe Jenson Pro, Adobe Garamond Pro (or Garamond Premier Pro), Warnock Pro, Utopia Pro, or Kepler Pro - all of these can work as body text, with Utopia being the most commonly used. For headlines, you could use one of these, or consider Myriad Pro/Myriad Pro Condensed or Chaparral Pro - both are really great (I'm especially fond of Chaparral).</p>
      <p>I just redesigned <em> my </em> high school's newspaper over the summer. I looked at typefaces for a very long time, and ultimately, I decided that buying them was worth the cost in adding typographical interest and in creating a brand identity. I went with Farnham from Font Bureau (by Christian Schwartz) for headlines and Mercury Text from Hoefler and Frere-Jones for body text. Since that cost about $1200 (U.S.) for licensing 7 computers, we went with Myriad Pro for captions and sidebars and Chaparral Pro for everything else - both of which we already had installed. The response has been extremely warm from our readers. So, I'd really recommend that you take a look around this forum, take a look on MyFonts and some smaller foundries and see what's out there. One special typeface just might be worth the price.</p>
