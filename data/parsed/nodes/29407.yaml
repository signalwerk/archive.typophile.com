      <p>Dan, that is odd about the Helvetica/Times/school newspaper connection. Conspiracy, anyone? Actually, my paper originally bucked the trend and was set in Goudy Old Style, then entirely in Helvetica, then in Times and Helvetica. Now we're using Farnham and Mercury, with splashes of Myriad and Chaparral. Much tastier.</p>
      <p>I'm not sure if I'd agree about Caslon being <em>that</em> boring. In my opinion, just about all the typefaces we've been bandying about are heinously overused. I don't think that makes any of them bad or inherently uninteresting. As a high school student, Times and Helvetica bore me the most out of them because every essay is set in Times and much of the web seems to be in Arial. Minion, Garamond, and Caslon are each used enough that I'm not sure if one of them has a natural advantage over the other. Traditionally, Caslon has been the most common, but I actually see Minion much more often than Caslon in print nowadays. And to be frank, as much as I love, <em>love</em> typography, I'm not sure if many readers will notice a large difference in design between the three; they largely didn't when we switched earlier this year. What I think should decide between them is how legible they are on the page. What my readers <em>did</em> notice was the larger x-height of Mercury compared to Times, and that was something they liked.</p>
      <p>Bringhurst does mention Chaparral in his list of types. And since he mentions so relatively few types, that means he gave it his seal of approval. So maybe it would be a good thing to see if it works as body text. I'm intrigued thinking about it.</p>
