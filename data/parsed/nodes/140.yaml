    html: "<p>When I grew up in Hong Kong they first taught us 'printing' (or 'block letters'), then all of a sudden they said we had to learn 'cursive', which was really copperplate. It wasn't the Palmer Method (as they were taught in North America), but a pure copperplate script. I was 8 or 9 at that time, and absolutely hated it. I thought it was really ugly. So I decided to go back to the block letters. My English teacher obviously didn't like that and said I had to write in cursive. After I went to study in England, I taught myself Italic hand (Fairbank's method, more or less) because I thought I had to improve my handwriting which, up to that point, was just a disjointed copperplate. I knew that's what they used to teach in England. The way they do it now is probably more like the Sassoon Method. Again, they first teach 'printing', then teach them how to join the letters. Sasson Primary, the type face designed by Rosemary Sasson, is still the de facto font to use in primary schools in England. <br> <br>Copperplate, when done well by a skilled calligrapher with a broad-nib pen could be extremely beautiful. But as an everyday script for handwriting, it is not very practical nor legible. Fairbank's italic hand is the best, in my opinion: clean, legible and beautiful. Still a very good modern hand. I think it's a shame we don't handwrite a lot of things now. We're losing the human side of written communication. I still enjoy handwriting a lot. Typography should not be the be all, end all of visible language.</p>"
