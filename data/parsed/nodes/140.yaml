    html: <p>I read recently that college entrance exams (SATs?) in the US will by 2005 include a mandatory 20-minute essay as a significant portion of the mark. Markers will have only 5 minutes to decipher and grade the essay. <br> <br>As a result, schools that wish to produce college-eligible graduates are scrambling to re-introduce cursive and make students' handwriting legible. Supposedly, anyway. <br> <br>On a different note, cursive arose naturally out of the need for Europe's literate (mostly nobles and members of the clergy) to write quickly and legibly. I'm sure that literate and educated Americans will always be able to write cursive; the question is, how much of the population will be literate and educated in 10/50 years? (some would argue the majority of graduates these days  are neither.) <br> <br>Paul</p>
