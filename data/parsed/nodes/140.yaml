    html: "<p><i>Can someone post images or links to some  <br>of the other styles that have been mentioned?  <br>When I hear Copperplate, I think of the  <br>typeface...and I've never heard of italic ductus.</i> <br> <br>Copperplate is one of the terms applied to the very rounded writing style (roundhand is another name) developed in the 18th century to be written with split steel nibs. It is called copperplate because the same style of lettering was used in engraving. The best known exemplar of the style (actually a collection of styles) is George Bickham's <i>Universal Penman</i>; there is also an excellent section on <i>l'ecriture</i> in Diderot's encyclopedia. The style relies heavily on the characteristics of the writing instrument for which it was developed: the flexible steel nib that applies more or less ink depending how hard the writer presses. The 'cursive' lettering shown above by Kyle is derived directly from these 18th century styles, and is properly called a roundhand for obvious reasons. As John Butler points out, writing this style with a pencil or ballpoint is silly because neither tool can give you the variance of what Cresci called 'the swelling line' that gives the style its beauty. <br> <br>Ductus refers to the effect of the combination of nib thickness and writing angle. An italic ductus implies a broad nib pen (as opposed to the pointed, split nib used for copperplate/roundhand) usually held at an angle around 40 degrees off the horizontal. This gives a pattern of thick and thin strokes that we are familiar with from the italic types of the renaissance; by contrast, the romantic italic types of Bodoni and Didot are based on the swelling line of the split nib. </p>"
