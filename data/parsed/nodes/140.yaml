  html: <p>I've recently heard that schools are no longer including  <br>cursive as part of their curiculum. <br> <br>I'm in the midwestern United States, but I think this may  <br>be a nationwide trend. <br> <br>Will kids have to rely on their parents to teach them how <br>to read &amp; write with cursive? Will it die out? <br> <br>Discuss.</p>
