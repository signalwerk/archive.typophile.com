    html: <p>The impression I get from some of the comments on this thread, particularly Tim Drabant's regarding uppercase letters, is that 'cursive' in the context of American education means a <i>particular</i> kind of 'connecting, slanted, script'. I'm wondering if this is the same as the copperplate-derived script I referred to earlier, which Canadian kids were learning in the late 1970s? <br> <br>The italic hand I learned in Wales was also cursive -- connecting, slanted -- but was a very different thing to the copperplate style. In Britain there was a huge reaction against the copperplate style in the early 20th century, expressed in a renaissance of the italic hand promoted by Alfred Fairbanks, and copperplate had completely vanished by the time I was born. It was strange to come to North America and find kids writing an 18th century split steel nib script with ballpoint pens.</p>
