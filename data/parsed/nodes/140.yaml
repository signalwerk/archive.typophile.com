    html: <p>D'Nealian and similar scripts (my Mom calls it "Catholic School Handwriting," though I'm sure there's nothing Catholic about it) are a plague and must be destroyed. The capital forms are not good for pencils or ballpoints. The design retrofits modern instruments like ballpoints and pencils to a ductus that only looks good with a split-nib. This weekend I am learning to write copperplate the correct way with the correct tools. (Finally!) <br> <br>An italic ductus is a much better basis for both connected and unconnected handwriting. I recommend <a href="http://www.bfhhandwriting.com/">the Barchowsky approach</a> for young people and either Barchowsky or Fred Eager for adults. <a href="http://briem.ismennt.is/4/4.1.1a/4.1.1.1.quick.htm">Briem's site</a> has some useful info including a complete English translation of Arrighi's <a href="http://briem.ismennt.is/4/4.4/index.htm">Operina</a>. If you're going to learn italic, you might as well start at the source.</p>
