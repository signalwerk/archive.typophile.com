    html: <p>What kind of cursive? <br> <br>When I came to Canada as a schoolboy I was surprised to discover -- and knew enough about calligraphy from my mother to be think it weird -- that kids were being taught to write copperplate style with ballpoint pens. I'd come from a school in Wales where ballpoint pens were forbidden, and where a neat Fairbanks italic running hand was taught. In Canada, it seemed incredibly perverse that kids were learning a style of writing developed specifically for a split-nibbed pen. Thankfully, my teacher was content to let me continue using my messy fountain pens and running hand, although it never improved very much and I gradually dropped most of the connecting strokes and became a type designer.</p>
