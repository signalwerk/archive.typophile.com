    html: <p>"Cursive" means a connecting, slanted, script. You can generally write complete words without picking up your pen (except to cross t's and dot i's). I think the idea is (was) that you can write faster that way. <br> <br>I was taught some form of cursive in grade school back in the sixties. I was never very good at it and switched to unconnected "printing" by high school (forever preserved in a certain font of mine). I do tend to connect certain runs of letters when I'm in a hurry. My handwriting is generally more forward slanting now than when I did the font over ten years ago. <br> <br>My mother was taught the Palmer Method and has beautiful handwriting. I have her old Palmer instruction books. It looks very rigorous to learn. <br> <br>My daughter (9) is learning "Denealian" handwriting which is a kind of unconnected sloping style with some cursive-like forms. Much closer to calligraphy than cursive.</p>
