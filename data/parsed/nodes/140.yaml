    html: "<p>I was required to learn to write something that resembled what people are calling cursive in England in the 1970s. I seem to remember having to copy letters out in something called \"Vere Foster's Copy Book\". It was, as it happens, a Catholic school. I was bad at it, and I hated it, and I thought (and still think) that the resulting writing is pretty ugly (f, s, z especially, and the fussy capitals) ... but not as ugly as the dreadful \"bubble writing\" most people now produce. <br> <br>On the other hand, I do think that most writing now is pretty undistinguished; it often seems childish. <br> <br>I agree that the ballpoint pen is to blame for much ugly writing: it offers no resistance to the page, no distinction between thick and thin (which even a pencil will often give) and it encourages writing with no real rhythm. Whereas a fountain pen gives writing an axis, ballpoint pens encourage endless looping. And no (or little) pride, because whereas one can sometimes look at a page written with a fountain pen and think \"that looks beautiful\", one can never look at a page of ballpoint and think anything better than \"that looks tidy\".</p>"
