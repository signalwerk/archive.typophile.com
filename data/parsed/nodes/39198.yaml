    <p>Hi all.</p>
    <p>I’m making a vector logotype for my self. Please take a look.</p>
    <p><a href="http://img3.freeimagehosting.net/uploads/b23d9de286.jpg" title="http://img3.freeimagehosting.net/uploads/b23d9de286.jpg">http://img3.freeimagehosting.net/uploads/b23d9de286.jpg</a></p>
    <p>I’m inspired by “moroccan mosaic green”, the roman laurel wreath and the arab union flag. I used live trace on a photoshop image, so it’s really ugly when zooming in. And I’m not good at all using the pen in illustrator. </p>
    <p>Is it possible that you could help me with the vector graphic? I will send you the .AI and a symbolic sum of money if you decide to help me.</p>
    <p>What do you think about the font and the tracking/kerning?</p>
    <p>Thanks in advance for any help.</p>
