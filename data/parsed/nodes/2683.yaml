    html: <p>In the development of ClearviewHwy our research showed that fonts for Negative Contrast applications (Black letters on Light backgrounds) had to be slightly heavier and a bit more tightly spaced than the those for Positive Contrast applications (White letters on Dark backgrounds) to appear the same. One of the problems with current regulatory signs in the US is that they use a set of fonts designed for Positive Contrast, in Negative Contrast applications, resulting in the type looking too light. <br> <br>I showed an example of this in my presentation at TypeCon. <br> <br>I'll find the graphic and post it later.</p>
    html_clean: <p>In the development of ClearviewHwy our research showed that fonts for Negative Contrast applications (Black letters on Light backgrounds) had to be slightly heavier and a bit more tightly spaced than the those for Positive Contrast applications (White letters on Dark backgrounds) to appear the same. One of the problems with current regulatory signs in the US is that they use a set of fonts designed for Positive Contrast, in Negative Contrast applications, resulting in the type looking too light. <br> <br>I showed an example of this in my presentation at TypeCon. <br> <br>I'll find the graphic and post it later.</p>
