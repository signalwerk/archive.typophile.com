    html: <p><i>&gt;Then I'd see the proofing by masters like Dwiggins and I felt conflicted.</i> <br> <br>You knew, of course, that reference to Dwiggins would pique my attention. Stephen, what do you mean by "conflicted"? <br> <br><i>&gt;If pro's like Dwiggins and Briem do it, . . .</i> <br> <br>Ironically, it was just the opposite for WAD -- he drew large, but always proofed small. He would send off the drawings and wait a couple weeks for proofs of the actual type to come back so that he could finally judge his work at the size for which is was actually intended. As a shortcut, he would sometimes use a reducing glass (opposite of a magnifying glass) to try to get some impression of how the letters he was drawing would look in their final size.  <br> <br>But that was a different time and a different technology. The size that any given typeface gets used is no longer fixed. <br> <br>-- K. <br></p>
