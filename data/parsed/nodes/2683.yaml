    html: <p>I'm not sure what the 'in reverse' test would tell you about a design intended for typical black on white use, other than that it probably isn't optimal for white on black. Luc(as) de Groot and Erik Spiekermann have both developed fonts that are specifically intended for white on black or backlit signage, and these designs are optimised for this purpose. In particular, if you have two signs side-by-side, one black on white and one white on black (or similar high contrast colours), you need to make the letters in the white on black slightly heavier and sturdier in order for them to <i>look</i> the same weight as the black on white.</p>
    html_clean: <p>I'm not sure what the 'in reverse' test would tell you about a design intended for typical black on white use, other than that it probably isn't optimal for white on black. Luc(as) de Groot and Erik Spiekermann have both developed fonts that are specifically intended for white on black or backlit signage, and these designs are optimised for this purpose. In particular, if you have two signs side-by-side, one black on white and one white on black (or similar high contrast colours), you need to make the letters in the white on black slightly heavier and sturdier in order for them to <i>look</i> the same weight as the black on white.</p>
