    html: <p>You can do that easily in your font editor software. Just cut (ctrl+x) the outer contour of your glyph and use the preview mode. The countershape will be filled in black. Make any necessary adjustments and paste the other contour back. <br> <br>But I think you should also take a look at other fonts. Look at their curves, the BCPs... see what works and what doesn't.</p>
