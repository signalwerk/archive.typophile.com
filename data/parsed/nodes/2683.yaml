    html: "<p>&gt;I'm not sure what the 'in reverse' test would tell you <br> <br>It's not about the functionality of the font, but about the functionality of the design process. <br> <br>Designers get so close to their work, they lose perspective, seeing it negative is a strategy for getting a little jolt of objectivity. <br> <br>Two related techniques I use: <br> <br>Rotate the character 90 degrees (useful for examining relative contrast of vertical/horizontal stems and the curves between them) <br> <br>Look at a print-out in a mirror, or held up to the light from the verso of the printout. <br> <br>Do the same, upside down. (The paper that is, no need to stand on your head.) <br> <br> <br></p>"
    html_clean: "<p>&gt;I'm not sure what the 'in reverse' test would tell you <br> <br>It's not about the functionality of the font, but about the functionality of the design process. <br> <br>Designers get so close to their work, they lose perspective, seeing it negative is a strategy for getting a little jolt of objectivity. <br> <br>Two related techniques I use: <br> <br>Rotate the character 90 degrees (useful for examining relative contrast of vertical/horizontal stems and the curves between them) <br> <br>Look at a print-out in a mirror, or held up to the light from the verso of the printout. <br> <br>Do the same, upside down. (The paper that is, no need to stand on your head.) <br> <br> <br></p>"
