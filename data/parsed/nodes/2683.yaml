    html: <p>How you look at something and what you expect to see are all problems and experiences that make up the design process. My paraphrasing Duke here was in response to the original thrust of the thread that reversing your glyph would some how show you the countershape in a more critical environment. Personally I dont think any one enviroment is better than the other to evaluate a glyph shape, except for the environment that the type is designed to function in. <br> <br>I think a common mistake is evaluating a glyph at some monsterous size when the type face is suppose to function at 10-48 point. After drawing, proof at the size range of intended use. And then, if it looks good, it is good.</p>
