    html: <p>James, I personally don't think that's completely true. A lot depends upon HOW you look at it and what you EXPECT to see. If you see it upsidedown (think about a brochure laying on a table), you'll be surprised about how it will look then. Then it might not 'look good' anymore. Invert a character and you'll have the same effect. A lot of mistakes you will not see in small sizes. But use it big and you can be shocked. <br> <br>You expect to see a perfect font, so automatically I think the brain 'corrects' the mistakes. It's the same with grammar mistakes. Some you don't see because your brain correctes them, but they are there.  <br> <br>It's in the nature of fonts that there are a lot of ways on how to apply them. If a font contains some very small curve-mistakes that would mean that you limit the user in their creative application of it, because they could not use it bigger. That a font might have been optimized for small sizes does not mean that you can't use it big, or inverted, or vertical, or only the counterpunches, etc. I for myself do that very often in my work.  <br> <br>So for specific applications I agree with Dukes statement, but it seem to me to be only half of the truth. In this statement I miss the 'but...'. ;-) <br> <br>Ren�</p>
