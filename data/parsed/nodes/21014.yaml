    html: |-
      <p>Agreed. I personally dont like to show anything digital if it isnt a digital work. Take pictures of the book from interesting angles which shows another layer of composition. The portfolio is just a preview (think movie trailer) that grabs attention. If they wanna see the actual book, they’ll have to interview you.</p>
      <p>Don’t know if you are working on a personal identity but that will make you stand out and shows you know how to market yourself.</p>
