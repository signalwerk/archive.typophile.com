    <p>I’m revamping/recharging my portfolio website with a new design and a lot of new work/scrapping old work. The question now comes to mind, how do I showcase a 38 page (20 spreads) design? Do I just show key pages from within the book? Should I provide a low res PDF of the entire book on my site or just leave that till actual portfolio reviews? (in person that is)</p>
    <p>Thanks.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081120083239/http://www.typophile.com/node/20698" class="topic-previous" title="Go to previous forum topic">‹ Bah Arial :\</a> <a href="/web/20081120083239/http://www.typophile.com/node/21000" class="topic-next" title="Go to next forum topic">Can you ever pair two sans serifs? ›</a></div>
