      <p>Pretty much just looking for a place to send people when they ask if I have a website. I know face-to-face interviews is where I’ll get a job, but a website doesn’t hurt as a preview. I don’t have access to the book as it’s being photographed entered into a competition. I’ll just go for the spreads idea.</p>
