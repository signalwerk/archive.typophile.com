    html: |-
      <p>Israel, US copyright law does not give students carte blanche to use any copyrighted work in entirety. Fair-use applies to academic work, but only for works used in part, and I don’t think that the software copyrights that apply to font protection in the USA operate in the same legal area. Anyway, the student “exemption” from following copyright law in academic work is related to copyright holders not wanting to bother suing broke college students for work that has little or no commercial relevance anyway. </p>
      <p>In other words, Adobe would go bankrupt suing all the college kids pirating Adobe products without ever collecting a dime.</p>
      <p><cite>My guess is that type designers are not invited.</cite></p>
      <p>Not all schools have nearby type designers to come in and lecture.</p>
