  html: |-
    <p>I am a third year design student, and can’t afford to purchase most fonts. My school has a very limited supply. What kind of trouble am I asking for if I use fonts that were downloaded via torrents, news groups, file-sharing networks, etc.? What would happen if someone found out? I don’t want to cross that line, but I might have to for some projects.</p>
    <p>Thank you.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/48440" class="topic-previous" title="Go to previous forum topic">‹ Bernhard Gothic SG + Indesign CS2 = Weird "e"</a> <a href="/node/48048" class="topic-next" title="Go to next forum topic">Deseret alphabet ›</a></div>
