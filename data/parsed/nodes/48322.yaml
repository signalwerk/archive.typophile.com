      <p>As to getting into trouble. I’d recommend a bit of household burglary, fencing the goods to pay for fonts. Chances are even if you get caught you’ll be let off with probation. This way no type designers are deprived of income. In all likelihood your neighbors have insurance to cover the items you take.</p>
      <p>A related thread - <a href="http://typophile.com/node/47079" title="http://typophile.com/node/47079">http://typophile.com/node/47079</a> </p>
      <p>With respect to that thread I’m interested in what the teachers that encourage piracy say when type designers visit to guest lecture. My guess is that type designers are not invited. That in my opinion is the real crime.</p>
