      <p>I am still very unsure where the line is drawn. I know that the bottom line is to use a font for a school or freelance project, I have to pay for it. But what if I use a school computer to work on a pro-bono project or a contest? Do the same rules still apply? </p>
      <p>Thank you.</p>
