    html: |-
      <p>Is it morally wrong?<br>
      ====================</p>
      <p>Unless you have permission from the copyright owner (as most fonts are only licensed for specific use, and actual ownership is not transfered), it is definitely wrong.</p>
      <p>What could be done?<br>
      ===================</p>
      <p>Not much. The fonts will not be used for commercial purposes. You are a student, and the fonts are to be used in some projects.</p>
      <p>Educational Use<br>
      ===============</p>
      <p>US Copyright law makes a clarification about educational use. I am no lawyer, but this seems to a loophole for you. However, some copyright owners make a notice limiting the use of the fonts, and not permitting the fonts to be used freely for educational purposes.</p>
      <p>For example, I never saw this disclaimer or legal limitation on any Adobe font package.</p>
      <p>Thomas, what’s Adobe’s position on educational use?</p>
