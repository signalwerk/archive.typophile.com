    html: |-
      <p>Hi James,</p>
      <p>Thanks for these thoughts. . . . When you say it would be good to advise DTL directly about the problems I see with their web site, pricing, and decisions on formats that might be keeping me and other potential customers from buying more of their fonts, is that the straight skinny, or sarcastic? Honestly unsure, though leaning toward the latter.</p>
      <p>Anyway, I wouldn't blame the rise of digital media for making me demanding. I would just blame me!</p>
      <p>Even when I am in better humor than when writing the above, I am confident that any foundry that doesn't move to fully OpenType now, is going to fervently wish it had within two or three years. It just makes too much sense. Not fully supporting OpenType will become the way not owning a mobile phone has gotten to be. At first reasonable people could opt out, but because of network effects at a certain point it became indispensable, and there was a sudden, unstoppable rise in adoption.</p>
      <p>I know the thing with Storm's John Baskerville's is that it is supposed to be extremely authentic, but to my eye it doesn't look noticeably more like Baskerville's original types—you can view plenty of them yourself, without going to abandoned castle libraries, at Gale Group's Eighteenth Century Collections Online (ECCO)—than Linotype Baskerville. Type set by John Baskerville looks beautiful to my eye, and Storm's doesn't. (E.g., type the word "The," with a capital T, in italics in Storm's John Baskerville.) So I may stick by my opinion that its appearance is more bug than feature, albeit without asking you to share it. Aesthetic judgments are hard to dispute about.</p>
      <p>And yes, from the user's point of view—by the way, since I think fonts are self-evidently made and sold for users to buy (at least by developers who want to support themselves with what they do), I am not sure I share your implicit opinion that the user's point of view is just one of two, equally important ones, along with that of developers (who, yes, have to expend extra effort to offer new features—in what area of human activity is that not true?)—from the user's point of view, it *is* disappointing to pay for and download a font, and then to find that it doesn't work the way you thought it would when you bought it.</p>
      <p>Anyway, I'll be happy to contact Linotype directly, but I don't know who to write or who would listen to me there. If you do, that would be fantastic.</p>
