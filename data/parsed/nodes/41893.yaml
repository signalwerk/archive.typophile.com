      <p><em>...My deep love of OpenType (and especially OpenType Pro!) is, indeed, based on the raw pleasure of gaining easy access to small capitals...</em></p>
      <p>Certainly. From a type user's perspective, built-in smallcaps are a boon. But for type developers built-in smallcaps create a requirement for a complete second set of kerning values, as smallcap forms fit together rather differently to the way lower case forms fit together. It can be done but it's a pain in the rear end. It's a lot simpler and easier to make a separate smallcaps font.</p>
      <p>If you're really sure of what DTL are doing wrong, put that into an email and send it to them. They'll just love being told by a disgruntled would-be customer how they should run their business.</p>
      <p><em>I have had Storm’s John Baskerville for several years, and I am probably in a tiny, tasteless minority, but I actually find it awkward and almost inexpertly drawn, with noticeably strange spacing. The individual letter forms are appealingly swooshy and free, but the overall effect of a page set in John Baskerville is, for me, almost shudder-inducing. I am thinking of getting his Baskerville Ten in the hope it will be much better, though it probably won’t (dating as it does to the same early year of his career).</em></p>
      <p>I think Storm's John Baskerville is meant to be that way. The faults you refer to are features, not bugs. Storm did his research on that one. It's authentic.</p>
      <p>One of the bugbears I have with the so-called "digital media revolution" is the way it breeds uncompromising demand in users. If a digital product (software of one kind or another, whether it be a font or a proggie) does not perform exactly as the user imagines it should, and if it does not do everything perfectly and solve all former problems, and make toast and coffee for them as well --- oh dear no! That's just not on, is it? How terrible. How disappointing. What a letdown, to buy a software product only to find it doesn't work the way you imagined it ought to.</p>
      <p><em>Anyway, hopefully in time some of the people involved will pick up distant rumbles from the venting of frustration in venues like this one, and some fine day we’ll all inhabit a Shining World of OpenType!</em></p>
      <p>You wish. Don't dream it. Take it to the man (or woman) directly. They can't read your mind, and in the unlikely event they do pick up distant rumblings, they probably don't care. Not about one person's gripings. They've got much, much more pressing things to occupy them. You'd need a tidal wave of negative opinion regarding their font products to occur to get any action.</p>
      <p>j a m e s</p>
