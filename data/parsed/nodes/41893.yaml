    <p>And hey there, Mark von Bronkhorst: What’s up with not making <a class="freelinking external link-external" href="http://www.mvbfonts.com/html/fonts/verdigris/pk_verdigris.htm" rel="nofollow">Verdigris</a> available in OpenType?</p>
    <p>Finally, hello there, Mac OS X Leopard font people responsible for <a class="freelinking external link-kept" href="/node/37122/" rel="nofollow">fouling up the Typography panel</a> in Pages and other applications that use Core Text—how could you in good conscience release a supposedly finished product that generally fails to work at all, and breaks behavior from the previous OS release, with no detectible gain to the user? Then leave it on sale for months without an update? Do you really use Leopard yourselves?</p>
    <p>This concludeth my rant. Thanks for letting me get that off my chest!</p>
