      <p><cite>Even when I am in better humor than when writing the above, I am confident that any foundry that doesn’t move to fully OpenType now, is going to fervently wish it had within two or three years. It just makes too much sense.</cite></p>
      <p>Not a valid argument, I think. Note that a lot of the early OT-re-releases didn’t incorporate extra features, just the original character set with an Expert set thrown in.<br>
      Developing a fully featured OT means adding a lot of extra glyphs and doing some serious programming. That takes time, costs money and thus has to be economically feasible.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
