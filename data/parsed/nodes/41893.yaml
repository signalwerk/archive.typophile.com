    <p>The following are some of the banes of my existence.</p>
    <p>Why isn’t <a class="freelinking external" href="http://www.dutchtypelibrary.nl/Elevir_rdrct.html" rel="nofollow">DTL Elzevir</a>, or <a class="freelinking external" href="http://www.dutchtypelibrary.nl/Fleischmann_rdrct.html" rel="nofollow">Fleischmann,</a> available in OpenType? (Or at a feasible dollar price?) And why isn’t the Font Bureau’s <a class="freelinking external" href="http://www.fontbureau.com/fonts/Miller/charset" rel="nofollow">Miller</a> available in OpenType? Didn’t most foundries get their big sellers into OpenType several years ago?</p>
    <p>And Linotype: Why is your <a class="freelinking external" href="http://www.linotype.com/43290/baskervilleregular-font.html" rel="nofollow">Baskerville</a> only available in your own unimpressive “Com” version of OpenType, which lacks all typographical features? Why is your <a class="freelinking external" href="http://www.linotype.com/56016/monticelloroman-font.html" rel="nofollow">Monticello</a> not available in OpenType at all (and why is there no OpenType Pro version of your <a class="freelinking external" href="http://www.linotype.com/13450/timesroman-font.html" rel="nofollow">Times</a> and <a class="freelinking external" href="http://www.linotype.com/12767/timestenroman-font.html" rel="nofollow">Times Ten</a>)?</p>
    <p>Why can’t you reissue the essential-but-tragically-spindly <a class="freelinking external" href="http://www.linotype.com/12775/newcaledoniaroman-font.html" rel="nofollow">New Caledonia</a>, or even <a class="freelinking external" href="http://www.linotype.com/13277/granjonroman-font.html" rel="nofollow">Granjon</a>, in proper new digitizations, as Monotype did with Bembo (<a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?pid=420694&amp;grab_id=0&amp;page_id=30123&amp;query=bembo%20book&amp;SCOPE=Fonts" rel="nofollow">Bembo Book</a>)?</p>
    <p>When will <a class="freelinking external" href="http://www.typophile.com/node/20893" rel="nofollow">Williams Caslon</a> be released?</p>
    <p>And hey there, Mark von Bronkhorst: What’s up with not making <a class="freelinking external" href="http://www.mvbfonts.com/html/fonts/verdigris/pk_verdigris.htm" rel="nofollow">Verdigris</a> available in OpenType?</p>
    <p>Finally, hello there, Mac OS X Leopard font people responsible for <a class="freelinking external" href="http://www.typophile.com/node/37122" rel="nofollow">fouling up the Typography panel</a> in Pages and other applications that use Core Text—how could you in good conscience release a supposedly finished product that generally fails to work at all, and breaks behavior from the previous OS release, with no detectible gain to the user? Then leave it on sale for months without an update? Do you really use Leopard yourselves?</p>
    <p>This concludeth my rant. Thanks for letting me get that off my chest!</p>
