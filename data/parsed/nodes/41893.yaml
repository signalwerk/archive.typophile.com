      <p>Hi Peter,<br>
      apologies for the long delay getting back to this thread. I've been ill for the past week.</p>
      <p><em>When you say it would be good to advise DTL directly about the problems I see with their web site, pricing, and decisions on formats that might be keeping me and other potential customers from buying more of their fonts, is that the straight skinny, or sarcastic? Honestly unsure, though leaning toward the latter.</em></p>
      <p>That was the straight skinny, but I worded it sarcastically. If you have serious suggestions for them it wouldn't be unreasonable to send them your thoughts as long as you're very nice about it. Be very polite and explain first that it's nothing more than honest feedback, and with all respect for their ideas and existing vendor model and so on.</p>
      <p><em>Even when I am in better humor than when writing the above, I am confident that any foundry that doesn’t move to fully OpenType now, is going to fervently wish it had within two or three years. It just makes too much sense. Not fully supporting OpenType will become the way not owning a mobile phone has gotten to be. At first reasonable people could opt out, but because of network effects at a certain point it became indispensable, and there was a sudden, unstoppable rise in adoption.</em></p>
      <p>You're talking about "competitive advantage" regarding OpenType. Yes sir. It's safe to say the majority of type developers have already gone down the OpenType road, and it's hard to see how those remaining on the TrueType route can go on competing in the commercial sense. TrueType is already looking like a dirt track, unpaved and rutted, laden with pot holes and increasingly tiresome to travel for users and developers both.</p>
      <p>Monsoon. More soon...</p>
      <p>j a m e s</p>
