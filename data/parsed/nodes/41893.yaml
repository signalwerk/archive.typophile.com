      <p>Hi Florian,</p>
      <p>This was a product of late-night frustration! Thanks for listening.</p>
      <p>With Miller and OpenType, you're right that I was generalizing from the other font resellers' pages: on their own site, there OpenType is as an option, at checkout. But since Font Bureau charges the same price for their OpenType version as for their TrueType and PostScript versions of Miller, and still segregate out special small caps and old-style figures fonts from the other packages, just as in PostScript, I am guessing that in this case 'OpenType' offers no more features than the TrueType version that is resold on, e.g., FontShop.</p>
      <p>My deep love of OpenType (and especially OpenType Pro!) is, indeed, based on the raw pleasure of gaining easy access to small capitals, to both kinds of figures, and (if needed) to triple ligatures, with the easy ability to change between families altogether while retaining those settings. I wish Miller would join this revolution, since I adore the typeface.</p>
      <p>If DTL hired a new web designer--their site at present seems to me an unnecessarily confusing and even ugly experience--and thought a little about the joys of selling lots of copies of its fonts at slightly lower prices, instead of selling a very few copies at higher ones, it would be a different world for them and for all the rest of us. Or if they would even let resellers offer their fonts for sale (or so much as reproduce images of them!) DTL seems sort of mixed up about the point of offering fonts for sale, which might be more to get people to use and benefit from them than to disappoint eager would-be purchasers.</p>
      <p>Apropos of Linotype Baskerville: I know that language support is a major feature, it's just that I find it maddening and inexplicable that the best major-foundry Baskerville is still in such a limited format (even compared to most other offerings from Linotype).</p>
      <p>I have had Storm's John Baskerville for several years, and I am probably in a tiny, tasteless minority, but I actually find it awkward and almost inexpertly drawn, with noticeably strange spacing. The individual letter forms are appealingly swooshy and free, but the overall effect of a page set in John Baskerville is, for me, almost shudder-inducing. I am thinking of getting his Baskerville Ten in the hope it will be much better, though it probably won't (dating as it does to the same early year of his career).</p>
      <p>ITC New Baskerville is fine. I just wish it were less sparkly and 'digital' looking.</p>
      <p>Anyway, hopefully in time some of the people involved will pick up distant rumbles from the venting of frustration in venues like this one, and  some fine day we'll all inhabit a Shining World of OpenType!</p>
      <p>Thanks again for listening.</p>
