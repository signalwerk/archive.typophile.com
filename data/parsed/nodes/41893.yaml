      <p><cite>I am confident that any foundry that doesn’t move to fully OpenType now, is going to fervently wish it had within two or three years</cite><br>
      That argument doesn't always fly with every foundry. You used the Font Bureau's Miller as an example, but at least THAT company will still be providing non-ot fonts for a long time.</p>
      <p>Their clientèle is made up in large part of major newspapers around the world using non-opentype savvy applications, and those behemoth programs won't be going away any time soon because they are $$$$. Miller just so happens to be a well-used newspaper font that fits exactly into that category.</p>
