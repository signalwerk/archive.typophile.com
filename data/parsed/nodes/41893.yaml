      <p>Hi James et al.</p>
      <p>Thanks for the interesting comments! I hadn't really thought about newspapers, and their legacy applications, at all—I wonder what proportion of the business of the average foundry (if there is such a thing) comes from which categories of users? Knowing that might explain a lot.</p>
      <p>Apparently MVB is in fact working on an OpenType Verdigris, which is great to know. And if anyone knows who to nag at Linotype about their Baskerville, please share!</p>
      <p>I don't completely get why the continuing existence of a market for the divvied-up TrueType versions of Miller would inhibit the Font Bureau from simply combining some of them into a nice OpenType version that includes small caps, but I guess success leads to a lessened sense of urgency, and it must be a fantastic seller for them still.</p>
      <p>Finally, I'm sort of hoping someone else will bite on my comments about Storm's John Baskerville! I was so disappointed when I started using it, and wondered whether I was alone in this. But it is just a matter of opinion, like all such things, I know. And in some respects (especially certain italic capital letters) he is certainly very faithful to the ‘original.’ It's just that the overall effect strikes me as off.</p>
      <p>It amazes me that 10.5.2 (released in the days since the original rant) apparently did nothing to fix the Typography palette in Mac OS X. Anyway, I am about to be freed from Leopard—I've been using an Apple Store loaner with Leopard installed on it while my PowerBook was repaired, but my PowerBook is all fixed and ready to pick up again. There's no way I am ‘upgrading’ that puppy from 10.4.11, after two nightmarish weeks on 10.5. I've never badmouthed any Apple computer or OS version before—at least not in the past decade (and I never owned an Apple III)—but there's a first time for everything. With Leopard it feels as if Apple has had some sort of collective corporate stroke, and lost both its taste and its quality control department simultaneously.</p>
