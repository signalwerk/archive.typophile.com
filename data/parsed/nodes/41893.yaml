      <p><cite> Checking over at the Linotype site yesterday and Baskerville is in Open Type.</cite></p>
      <p>Unfortunately, it's only in Linotype's idiosyncratic OpenType “Com" version (which is “optimised for international communication and for use with Office applications”). It lacks small caps, old-style figures, extra ligatures, and other typographic features commonly associated with OpenType, except for a scattering of characters that allow for support of Breton, Turkish, and the like (listed here: <a href="http://www.linotype.com/1697-21122/opentypecharactersetsopentypecom.html" title="http://www.linotype.com/1697-21122/opentypecharactersetsopentypecom.html">http://www.linotype.com/1697-21122/opentypecharactersetsopentypecom.html</a>).</p>
      <p><cite>wow. TT and OT are two different roads, hu?</cite></p>
      <p>I might not have put it quite so forcefully myself! Though from an end user's point of view, sometimes it might feel a tiny bit that way. But I'm so delighted to know that Font Bureau can make more standard-issue OpenType versions of things like Miller, and overall just flabbergasted and delighted to hear from someone whose designs I admire so much. Could I be the first to request an amalgamated, "OpenType Std" version of <a class="freelinking external" href="http://www.fontbureau.com/fonts/Miller" rel="nofollow">Miller</a>? (Closely followed by <a class="freelinking external" href="http://www.fontbureau.com/fonts/Eldorado" rel="nofollow">Eldorado</a>, which I adore as well!)</p>
      <p>By the way, while you're on the line, if you still are, what proportions of Font Bureau's business would you say comes from individuals, companies, special commissions by publications, and the like? If that's trade-secretish sort of information, don't bother answering.</p>
      <p>Thanks for noticing the bicycle--I have been trying to think of a more individuated avatar!</p>
      <p>—Ladro di Biciclette</p>
