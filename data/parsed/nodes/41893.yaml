      <p>Hi Peter,</p>
      <p>welcome to typophile.</p>
      <p><cite>And why isn’t the Font Bureau’s Miller available in OpenType? Didn’t most foundries get their big sellers into OpenType several years ago?</cite></p>
      <p>Who claims Miller isn’t available in OT? MyFonts? At least you can specify OT at <a href="http://www.fontbureau.com/fonts/Miller" rel="nofollow">Font Bureau’s website</a>.</p>
      <p>And for DTL: Yeah, that’s a pity. Then again, DTL isn’t a big foundry, so there are likely no big sellers.<br>
      Demand determines supply. There’s no conspiracy going on.</p>
      <p><cite>And Linotype: Why is your Baskerville only available in your own unimpressive “Com” version of OpenType, which lacks all typographical features?</cite></p>
      <p>Unimpressive to you, American sucker for ligatures and easy fractions! ;°) Language support is a major typographical feature, too!</p>
      <p>What do you think of <a href="http://www.linotype.com/749/itcnewbaskerville-family.html" rel="nofollow">New Baskerville</a>? Or Storm’s <a href="http://www.stormtype.com/typefaces-fonts-shop/families-22-baskerville-original" rel="nofollow">Baskerville Original</a>? They offer small caps and stuff.</p>
      <p><cite>as Monotype did with Bembo Book</cite><br>
      Yeah, but also available only since less than 3 years. Going Open Type is not just pressing some conversion button, is it?</p>
      <p>That said, I understand your huff. The lack of standards is confusing and time consuming. But one has to bear in mind that fonts don’t fall from the sky; they still have to be made by people – with limited time, and a certain focus.</p>
