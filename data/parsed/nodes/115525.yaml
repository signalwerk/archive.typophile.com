    html: |-
      <p>From the Blah-blah-blah...(Wikipedia)</p>
      <blockquote><p>The iota subscript is today considered an obligatory feature in the spelling of Ancient Greek, but its usage is subject to some variation. In some modern editions of classical texts, the historical spelling with a restored full-size adscript 〈ι〉 is preferred. The same is generally true for works dealing with epigraphy, paleography or other philological contexts where adherence to original historical spellings is considered important.</p></blockquote>
      <p>Probably why Adobe includes both styles when they include polytonic Greek --Arno, Minion, Garamond Premier, etc.</p>
      <p>Another thing I've run into is authors who insist the Greek circumflex be a tilde, others who insist on the inverted breve. Fonts have been disqualified from consideration because of this.</p>
      <p>In the end, it's probably a matter of how large an audience you want to sell to.</p>
      <p>Easiest to just skip the academicians &amp; classical Greek. Academicians are notorious for insisting what they want is the only correct, proper way...</p>
