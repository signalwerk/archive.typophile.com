    html: |-
      <p>There are no subscripts in modern Greek, so it only makes sense to include them together with polytonic Greek (which is a good idea to include in a typeface with Greek if it is intended for books).<br>
      In Classical Greek the default is to use the subscript where it should be used (only few cases of αι, ωι, etc. require subscript, most don't). Using adscript instead of subscript is not correct grammatically, it is a hack to overcome the absence of subscripts in a typeface. Conclusion: if you are going to go polytonic include subscript together with all other possible combinations of diacritics.</p>
