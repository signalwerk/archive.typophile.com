  html: |-
    <p>Our NC controller that we rescued in 1978 has this sculpted plate on the front:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/superiorelectric_3484.jpg"></div><br>
    We've modified the machine extensively, but we still use this controller's "brain" to machine the brass parts on our guitars. <p></p>
    <p>We also have a three spindle printed circuit board drill made by Excellon. Here's the plate on the spindle head:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/excellon1_4751.jpg"></div><br>
    And the base has their name carved in gabbro granite across the front. It looks really cool:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/excellon2_5602.jpg"></div><br>
    This table is so large we had to have the building built around it.<p></p>
