  html: |-
    <p>I'm looking for suggestions for a typeface that has classic styling and detail but has a sense it has been reduced to its simplest form. Much like Brancusi had done with his sculpture series "Bird in Space"… reducing and abstracting an idea to its simplest form.</p>
    <p>Two fonts that come to mind are Optima or Trajan Pro.<br>
    I know there must be many other great fonts available that I'm not aware of that would echo "Bird in Space". Any suggestions are welcome.</p>
    <p>Thank you,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/constantin-brancusi-bird-in-space_6352.jpg"></div><p></p>
