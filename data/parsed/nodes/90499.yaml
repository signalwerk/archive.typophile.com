      <p>Thank you to all,</p>
      <p>WOW! this is more than I ever imagined. The ideas and discussion has ignited an explosion of alternate ideas that had never occurred to me.</p>
      <p>These are all great suggestions... Duffy Script, Frutiger, Stop, Futura, Condor, Aviano, Quadraat, Fedra and Bembo, SangBleu BP Sans, Excoffon, Typonine Stencil Pro, Dala Floda, Noir.</p>
      <p>I will have to start working with them and see where it leads me.</p>
      <p>Side notes:</p>
      <p>To Frode Frank, I'm redesigning a logo that has a bad stylization of a bird and has Helvetica Bold for the company name. The concept of a bird is the only part of the logo that has a connection to the mission of the company. I plan to redesign the bird and match that to a appropriate font. I am so grateful for the font suggestions.</p>
      <p>I appreciated the link from Riccardo to the comment by William Berkson about Frutiger. I've always liked Frutiger and obviously Brancusi's sculptures. It is interesting to know the link between the two.</p>
      <p>Also, Thank you to Riccardo for making me aware of Noir. The font is too geometric for what I'm working on now, but I was impressed with details of the font and the font defiantly has echos of Brancusi's sculptures. I'm not clear if Noir is complete but when it is complete I want to purchase it.</p>
      <p>Thank you again.</p>
      <p>Warmly,</p>
      <p>Bill</p>
