      <p>You are thinking about the R leg i Trajan, right? There are plenty of faces with such details. Quadraat, Fedra and Bembo off the top of my mind. </p>
      <p>With such a slender shape I would also look at thin stressed sans serifs like SangBleu BP Sans.</p>
      <p>There’s something about that terminal that cuts off the curve that you might find echoed in other faces. What are you going to use it for?</p>
