    html: |-
      <p>I thought I'd seen it before. Yes! The Add Small Capitals feature only appears in the Element&gt;Style submenu in the Font window (where you see all the letters in the font in little boxes), not in the Glyph window (where you edit outlines) where I'd been looking for it.</p>
      <p>You may still have to tweak the generated glyphs since these automated processes are rarely perfect, but it should be much less trouble than what you were doing before.</p>
    html_clean: |-
