    html: |-
      <p>Are you going to have more than one weight for this typeface anyway, say a regular and a bold?</p>
      <p>If so, generally, the "best" way to do this sort of thing is to start by designing your typeface with a weight axis. From there you can generate things like small caps, correct the weight automatically, and have it be pretty nearly perfect right off. You can do the small caps in the bold master by extrapolation.</p>
