  html: |-
    <p>Hello,</p>
    <p>I'd like to be able to look through all serif or all sans serif in my font management software. Is there a way to separate my fonts into these two categories other than manually separating several thousand fonts into two sets?</p>
    <p>Ideally, id like to be able to do this with Font Explorer X pro 3.</p>
    <p>Any input is much appreciated.</p>
    <p>-nick</p>
