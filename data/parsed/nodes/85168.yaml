    html: |-
      <p>I separated 1700 fonts just the other day by hand in that same program. Took me maybe 30 minutes. I just went to Classify Fonts&gt;Categories&gt;made custom categories and started clicking away. It shouldn't take THAT long. When that was all done I created Smart Sets in the left sidebar and it added everything to them. Worked wonders.</p>
      <p>Though, if there is a faster way I'd love to know as well.</p>
