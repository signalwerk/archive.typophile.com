    <p>In the past weeks young German type designer <a href="http://www.fontshop.com/fonts/designer/yanone/" rel="nofollow">Yanone</a> captured his latest type system FF Amman in an audiovisual document. He produced a <a href="http://amman-the-ffilm.com" rel="nofollow">documentary film</a> in the Jordan capital with all the people involved in the type project.</p>
    <p><a href="http://amman-the-ffilm.com/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://amman-the-ffilm.com/" rel="nofollow"><img src="http://typophile.com/files/amman_the_film_500_4225.jpg"></a></div><p></p>
    <p>In late 2008 <a href="http://www.fontshop.com/fonts/designer/yanone/" rel="nofollow">Yanone</a> set out to Amman to design a bilingual Arabic/Latin typeface for the city on occasion of its centennial celebrations. It was to become the second Arabic type family in the famed type foundry’s catalogue, after Lebanese type designer Pascal Zoghbi’s Arabic extension of <a href="http://www.fontshop.com/fonts/designer/martin_majoor/" rel="nofollow">Martin Majoor</a>’s sans/serif type system <a href="http://www.fontshop.com/fontlist/super_families/ff_seria/" rel="nofollow">FF Seria</a> which was released in 2009. </p>
    <p><strong>‘<a href="http://amman-the-ffilm.com" rel="nofollow">New (type) face for Amman (Amman – The FFilm)</a>’</strong> is Yanone’s brand new documentation about the making of the FF Amman typeface super family. It comes in a diptychon of two films: The first and main part (21 min) and the 1 minute high-speed pursuit ‘Part II’. Watch out the the bonus material e. g. the full and very interesting interview with Ahmad Humeid, CEO of the responsible branding agency SYNTAX.</p>
    <p><em>Links</em></p>
    <ul>
    <li><a href="http://amman-the-ffilm.com/" rel="nofollow">Dedicated website for the film</a> (+bonus material!)</li>
    <li><a href="http://fontfeed.com/archives/fontcast-17-amman-the-city-the-typeface-the-film/" rel="nofollow">FontFeed — Amman: The City, The Typeface, The Film</a> (Jürgen Siebert on the project).</li>
    <li><a href="http://issuu.com/fontfont/docs/yanone_on_ff_amman" rel="nofollow">Documentation (PDF) — Yanone on FF Amman</a> (The best document on the typeface, the city, and its design is a wonderful 58 page brochure, compiled and designed by Yanone himself)</li>
    <li><a href="http://www.fontshop.com/fontlist/families/ff_amman/" rel="nofollow">Buy FF Amman on FontShop.com</a></li>
    </ul>
