  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/15_c_6535.png"></div><p></p>
    <p>Milica is a display font, inspired on action movies, urban military and martial arts culture, designed with straight verticals but slanted horizontals with no curves at all (sharped hard strokes only)<br>
    5 sizes<br>
    - ExtraLight + Italic<br>
    - Light + Italic<br>
    - Regular + Italic<br>
    - Bold + Italic<br>
    - ExtraBlack + Italic</p>
    <p>Recommended use: Poster, Movies, video games, TV, Animation, letterhead, magazines titles, POP &amp; Graphic culture, young stuff, hip-hop topics, urban, big sizes prints, Volumetric 3D shapes, labels, etc.</p>
