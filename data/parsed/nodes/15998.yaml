      <p>I'm not sure how comfortable you are with Python, but have you had a look at using RoboFab's interpolation with FontLab? <a href="http://www.letterror.com/code/robofab/howto/interpolate.html" title="http://www.letterror.com/code/robofab/howto/interpolate.html">http://www.letterror.com/code/robofab/howto/interpolate.html</a></p>
      <p>RoboFab won't do any interpolation if the source glyphs aren't strictly compatible in the way you describe what compatible should be, and its method <code>isCompatible()</code> is able to report back to you what the incompatibilities between glyphs are (if any) before interpolating. I think RoboFab's introduction script for Interpolation would do exactly what you're looking for without any editing other than maybe changing the interpolation factor.</p>
