      <p>True, shmrue. A vertex has two BCPs (one incoming and another outgoing) each one being an X-Y pair defining a vector; each X or Y can be anything from minus-whatever to zero to plus-whatever; and you just interpolate them. A so-called "line" is just a curve between two vertices that "abut" zero-X&amp;Y BCPs; I can't think of a reason to treat it any differently than a curve (especially since FontLab actually provides EXTRApolation too).</p>
