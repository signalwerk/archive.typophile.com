      <p>Paul,</p>
      <p>If you ever used interpolation or blending in FOG, you would have seen very different behavior and different options. I used the interpolate and MM options in FOG to great effect; they have saved me a ton of work. </p>
      <p>I've asked Ted and Yuri about the strangely-worded option "Do not interpolate compatible outlines", because not only does it do something different than it implies, it's the opposite of what I want: I <em>want</em> to interpolate the compatible outlines (which FOG does), and those that aren't compatible, shouldn't interpolate (which also works in FOG). </p>
      <p>Basically there are a lot of bugs in the way FL handles this and I'm hoping they get them cleared up. Meanwhile if you really need reliable interpolation, go back to FOG.....</p>
