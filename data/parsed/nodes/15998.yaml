    html: |-
      <p>"But what means “compatible”?"</p>
      <p>YIKES!!!!!!</p>
      <p>"In any case, I will always recommend to build MM font using Blend feature - in this case you will minimize chances for rounding errors."</p>
      <p>I'm not experiencing "rounding errors". FL is adding and deleting unnecessary points when blending two COMPLETELY COMPATIBLE outlines. See definition below.</p>
      <p>"But what should do the algorithm with two ‘O’ glyphs made from 8 curves with incorrect placement of startpoints or incorrect ordering of contours? Formally these two ‘O’ are compatible - they have same type of points in the same order, but in reality they are not. Algorithm that we use tries to detect such situations and fix them."</p>
      <p>A-HA!</p>
      <p>I use the term compatible to mean that situations such as you describe here are already corrected by the designer. In other words, the designer has spent a lot of time to make sure that the two fonts being blended have outlines that: </p>
      <p>Have matching path order<br>
      Have correct path directions<br>
      *Have corresponding (matching) start points, in correct matching locations*</p>
      <p>so compatible means there isn't anything left for the software to do but mathematically average the data between the two masters. No added points, no "corrections", no detecting and fixing. I think of interpolation as a very simple operation. FL seems to be making it more complicated than it needs to be. </p>
      <p>Font Chameleon was the tool to use when blending two completely unrelated sets of outlines (like Garamond and Futura). But we are designing various weights like Light and Bold from the ground up to be compatible. Sometimes we make one master from the outlines of another master, ensuring compatibility from the beginning. I want FL to correctly blend compatible outlines (per definition above), OR, give a message that the two outlines are not compatible and refuse to blend. Nothing in between helps me, because it requires manual cleanup to correct the bad resulting shapes.</p>
