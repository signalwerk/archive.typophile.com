    <p>TypeTogether is happy to release this gorgeous font family, designed by Pilar Cano. It is a gentle typeface, humanistic in concept yet with a contemporary feel, where softness and fluidity play a very important role. Originally intended for art, design and architecture books, Edita can graciously work alongside photographs and images alike, producing an amazing synergy. Furthermore, Edita is a legibility workhorse, whether it is used in a few paragraphs or in a 600-page novel.</p>
    <p>Available exclusively in our online store More info <a class="freelinking external" href="http://www.type-together.com/Edita" rel="nofollow">here</a>.</p><div class="imageWrap"><img src="http://typophile.com/files/edita_4596.gif"></div><p></p>
