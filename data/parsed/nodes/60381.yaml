    html: |-
      <p>Dear forum of experts on typography.<br>
      I find this design very intriguing. It seems to me like a fresh typeface with a slight “soft roughness” to it, but subtle enough for it not to stand out too much in longer text, but to present a body copy in an modestly elegant way. (No, I try not to promote it, I try just to describe my associations.)<br>
      BUT: I am by no means an expert, rather I merely appreciate good design. So I can’t really estimate how others would perceive it, an anonymous ‘uninformed recipient’. I would like to make us of this font in a bit more conservative environment than the indicated “ art, design and architecture” field. Although definitely not as conservative as legal or banking. My concern is, would this face “stand out” too much by itself as a “too different than normal” typeface and therefore distract the reader? Would it appear as unexpected? </p>
      <p>I hope somebody can give me some estimation. Thank you very much.</p>
