    html: |-
      <p>&gt; Wave, swirl?</p>
      <p>I'd call it a wave or swoosh. Elements like that can create a feeling of movement, grace, fluidity, etc.</p>
      <p>&gt; Does anyone have any lists...</p>
      <p>If you Google for "design trends" or "logo trends" or similar phrases you might find some useful articles, although they'd be skewed towards trendy elements rather than classic design principles.</p>
      <p>Most designers build a collection of clip files for reference and inspiration, although obviously you don't want to simply swipe some other designer's ideas but rather use them to help stimulate your own thinking.</p>
