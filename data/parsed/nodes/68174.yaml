    html: |-
      <p>No, I just looked at that piece and saw what the designer had done.<br>
      I generally show clients several options and see which they like best, and never discuss technique.<br>
      I think the most you can do with the graphic part of a design is to discuss its tone, because that is something that clients have a very intuitive feel for. If they like it, they like it, if they don't it may seem to them to be too old-fashioned, too dull, or not upscale enough, &amp;c. &amp;c., or they may just not like it and not know why, but mention that they like the Papyrus font.</p>
