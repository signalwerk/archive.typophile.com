    html: |-
      <p>I call that the Ribbon Device, as does a major soft drink company, I believe.</p>
      <p>TF22Raptor, you need to practice a bit more at critically assessing a piece of design and what it achieves. Once you're good at that you can focus on the desired outcomes with your clients rather than the technical and material methods of achieving those outcomes. </p>
      <p>You don't have to have a name for everything you do, but you will need a good reason justifying it to the client and a clear explanation of how it helps them achieve their stated goals.</p>
