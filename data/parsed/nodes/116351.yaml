    date_raw: 10 May 2014 — 2:15am
    votes: null
    html: <p>Note that the idea generally is not primarily to equalize the linear distance (how close the rightmost bit of one letter is to the left side of the next) but rather the <em>area</em> between the letters... As the T already has a lot of “air”&nbsp;under its uh, roof, it needs less distance to the letters around it than, say, an H would. That’s why the TH was in fact too loose in the beginning even though the linear distance between these letters was not much. Hope this makes sense.</p>
    html_clean: <p>Note that the idea generally is not primarily to equalize the linear distance (how close the rightmost bit of one letter is to the left side of the next) but rather the <em>area</em> between the letters... As the T already has a lot of “air”&nbsp;under its uh, roof, it needs less distance to the letters around it than, say, an H would. That’s why the TH was in fact too loose in the beginning even though the linear distance between these letters was not much. Hope this makes sense.</p>
