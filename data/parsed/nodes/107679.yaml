    <p>Hi!  I'm trying to figure out what font may have been used on the Harlem Nights shirts in this picture.  I apologize for the low res sample, it's the highest one I can find.</p>
    <p>I'm betting it's been modified some but if I could find a starting point it would be wonderful.  Thank you!</p>
