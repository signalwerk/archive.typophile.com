    <p>I'm working on an academic document with lots of footnotes and endnotes. The body copy is set in Minion Pro and the headings are set in Gotham. Should endnote references on headings or any text within a document that is not the same typeface as the body copy, inherit the type styles of the word they are applied to?</p>
    <p>I cannot find a good rule for this...</p>
