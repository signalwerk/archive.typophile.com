  html: |-
    <p>Vintage metal oil cans are much better than today's plastic oil cans like many other old things! It is more powerful, more impressive, more iconic. These days, the relatively few metal oil cans that survived that familiar pattern have become collectibles. These cans not only served as containers, they also gave oil companies one more opportunity to advertise their brand name and logo. These vintage cans are also really good source for reflecting power of  <a href="http://www.antreposhop.com/product/public-gothic-font-family" target="_blank" rel="nofollow">"Public Gothic Family"</a>, Antrepo's condensed, vintage and industrial font family.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/public01_6189.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/public02_5257.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/public03_4959.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/public04_6314.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/public05_4480.jpg"></div><p></p>
