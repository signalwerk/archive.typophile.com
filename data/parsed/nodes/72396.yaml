    <p>Hi all.<br>
    Before I get too deep into this design, I want to run this past everyone to see if it resembles any existing typeface. I'd hate to put in a ton of effort to hear someone say "you know that looks like a knock-off of XXX Roman" etc. I like where it's going, but you know, I want to make sure.</p>
    <p>And if you have any initial comments, have at it. But keep in mind I haven't yet touched the spacing/kerning.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fetique1_3734.png"></div><p></p>
    <p>Thanks.</p>
