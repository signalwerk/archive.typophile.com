      <p>You might try RMX Scaler, a part of the RMX 1.6 set?  </p>
      <p>Generally, scaling down brings rounding errors and point bloat comes from expand path.  There is always cleanup but "Optimize" then RMX Harmonizer give you a good start.</p>
