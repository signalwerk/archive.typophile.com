    <p>Hi! I am trying to scale down my font to 80% and then use action &gt;Effect&gt;Parallel to<br>
    create horizontal and vertical stem variation. but I get a lot of nodes and it loses its<br>
    shape too. Does anyone tell me how to to this in better way &amp;close to my original shape ?<br>
    is their Python script available for this?<br>
    Thank you .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Nodes_3991.png"></div><p></p>
