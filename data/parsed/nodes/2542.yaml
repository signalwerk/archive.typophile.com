    date: 2003-12-31T17:33:00
    date_raw: 31.Dec.2003 5.33pm
    votes: null
    html: <p>Once, while travelling, I chanced upon a jewelry artist who was designing what seemed to be innocuous silver bands, but inside were complete alphabets and/or phrases. I've always been intrigued ever since, and would love to find if anyone's doing it. The typical "engraved" option doesn't appeal, mostly due to lack of choice in style and size. The rings I saw, the cap-height of the letters took up the entire width of the ring. <br> <br>and no, this is not a lord of the rings thing. Yes, I saw the movie. No, I'm not a huge Tolkien fan. Typophile, yes. guilty as charged. <br></p>
