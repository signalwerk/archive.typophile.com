    html: |-
      <p>Univers CE fonts are available in PostScript Type 1 or TrueType formats, and they have the "Central European" character set.<br>
      <a href="http://www.linotype.com/137563/universcentraleuropean55roman-font.html" title="http://www.linotype.com/137563/universcentraleuropean55roman-font.html">http://www.linotype.com/137563/universcentraleuropean55roman-font.html</a><br>
      <a href="http://www.linotype.com/137566/universcentraleuropean55roman-charactermap.html" title="http://www.linotype.com/137566/universcentraleuropean55roman-charactermap.html">http://www.linotype.com/137566/universcentraleuropean55roman-characterma...</a></p>
      <p>Univers LT is the Western European character set (with a Euro symbol). If you license the OpenType Com fonts (see <a href="http://www.linotype.com/12641/univers55roman-font.html#format" title="http://www.linotype.com/12641/univers55roman-font.html#format">http://www.linotype.com/12641/univers55roman-font.html#format</a>), or the Pro fonts, you get both the Central European and the Western European glyph coverage! But if you need a non-OpenType font, you have to pick one or the other :(</p>
      <p>My guess is that most people use OpenType now anyway. But I could be wrong!</p>
