      <p>I've been thinking about this sort of thing for quite a while. </p>
      <p>In essence, the static closed grotesque forms of Helvetica are perfectly suited for headlines. They fill the surface, grabbing attention, forming an almost solid unit (the word). It is tightly spaced, has a huge x-height, tiny descenders and ascenders: perfect for stacking.</p>
      <p>Lucida Grande on the other hand: a humanist, dynamic shapes, loosely spaced, open forms (and although not that dramatically different in vertical proportions -- let's for a moment think about the very concept humanist) is obviously rooted in the tradition of text type. </p>
      <p>The two skeletons are from completely different spheres, and thus this pairing is against all <a class="freelinking external" href="http://typophile.com/node/21000" rel="nofollow">rules</a>. However, I think something like this is most sensible ... in theory. In practice, you need some echo of the first in the second. Preferably you'd also want a clear distinction between the two, not something so close it just looks like an error.</p>
      <p>Spinning off to fantasty land: What would a sans serif family with both stylistic and optical text (open, loose, distinct word images) and display (closed, tight, filling the page) sizes look like?</p>
