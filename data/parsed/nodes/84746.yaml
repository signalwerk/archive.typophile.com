      <p>I wouldn't pair those two myself (for the reasons Frode mentioned already), but as you write that you <em>have</em> to use Helvetica somewhere, I’d say it certainly is a better choice for headlines than for text sizes. </p>
      <p>If you can use a different typefaces altogether, I would go for <a href="http://www.webtype.com/store/search/?q=benton+sans" rel="nofollow">Benton Sans</a> for heads and <a href="http://www.webtype.com/font/bentonsansre-family/" rel="nofollow">Benton Sans RE</a> for reading sizes.</p>
