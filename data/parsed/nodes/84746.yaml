  html: |-
    <p>Guys, </p>
    <p>What do you think of pairing Helvetica (for titles) with Lucida Grande (for body copy)? My client thinks that at least we need to use Helvetica somewhere, since the logo is on Helvetica too. In the first iteration I used Museo Sans for the titles, which seemed a nice pairing with Lucida Grande to me, but it wasn't approved. </p>
    <p>I'm not sure of using Helvetica for the main body copy font; I found it just too much uninteresting, used everywhere, and lacks the humanist touch I want to achieve with this design (rounded corders, subtle shadows, etc.). Besides, Lucida Grande works amazingly well in 15px and 13px (and yet even in 11px!). It's very versatile.</p>
    <p>I'm attaching a screenshot of this possible pairing. On left, the initial iteration, and on right, the one with Helvetica. I think it *could* work, but I'd love to hear your thoughts. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/type_4838.png"></div><p></p>
    <p>Best, </p>
    <p>Rod</p>
