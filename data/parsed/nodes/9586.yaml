    <p>Hi Folks! <br> <br>I am just getting into the nitty-gritty of making pixel fonts and am finding the transfer from Adobe Illustrator to FontLab 4.5 is bringing up some questions for me. I would love to hear your thoughts. <br> <br>First, It seems elementary, but I don't know how a pixel font is made to appear correctly at the size it was designed for. <br> <br>I opened Underware's Unibody8 Italic in FontLab to have a look. There are 8 pixels to the ascender, 7 pixels to the cap height, and 1 to the descender. <br> <br><i>When you choose to use a font at 8pt, is that size then made the distance from baseline to ascender?</i> <br> <br>(I can't believe this is the first time I have thought about this!) <br> <br>Second, it seems that the UPM measurement (no matter what it is) is equivalent to 571.4302px in Illustrator. Anybody else observe this? <br> <br>This is a little awkward for calculating how to scale the glyphs when they come from Illustrator. The difference in size needs to be dealt with at some point and I am trying to find the best way.  <br> <br><i>What is your favorite method for scaling pixel fonts for FontLab, and at which point do you do it?</i> <br> <br>I don't have the luxury of ScanFont just yet, but I will eventually. Is this a smooth process in ScanFont with pixel fonts? <br> <br>Also, I realize this process is probably rendered obsolete by BitFonter, but it's not worth the money to make a couple pixel fonts. <br> <br>Thanks for your help! <br> <br>-Amy</p>
