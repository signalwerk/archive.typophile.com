    html: <p>hi sergio <br> <br>i think N is the only character that has bad legibility, i like the stencil type you are using, and i am wondering why you didn't use it on the G, stencil types have a big adventure spirit. <br> <br>although i like the flourish kind of thing on your N and G, i think that you should stay with the stencil, cause flourish type+stencil+thecircle is too much.  <br> <br>i think that the letters in the circle you should increase them at small sizes for better lecture, and maybe you can give less contrast between the the circle and the black to read NATURAL HIGH better. <br> <br>well done <br> <br>CG</p>
