    html: |-
      <p>Interesting thread. I can't tell the difference between the old Electra and Parkinson's version, but as alternative approach you could try to look for an historical link. For example: since the first documented, Modern appearance of Tarot seems to have been in  mid-15th century Europe, namely Northern Italy and France, an old-style ("Venetian") typeface would be appropriate. Think of Jenson or - why not - Arno. Sabon and Adobe Garamond would also work efficiently, though their original models came a bit later.</p>
      <p>Another historical moment related to Tarot history is 18th century France, with the Tarot de Marseille. In this case, the digital Monotype Fournier - or its contemporary rendition, Corundum - could be a working font. I have used Fournier for a record cover related to Tarot, with good results I think.</p>
      <p>The hand written logo is handsome, by the way.</p>
