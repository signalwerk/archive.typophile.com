    <p>Greetings typophiles! </p>
    <p>I am an infrequent lurker coming out of the woodwork for the admittedly self-serving purpose of asking for advice :)</p>
    <p>I am not a designer. I'm an artist (mostly photography) &amp; Tarot reader. I used to do letterpress artists books in the mid90s &amp; so acquired just enough typographical knowledge to be dangerous. </p>
    <p>Long story short, I have been lusting after Electra for a long time &amp; now have the funds to indulge such a purchase. But lo &amp; behold, when I went searching for it, up popped Parkinson Electra too! I know what Electra looks like in the wild—that's why I want it. But I'm not aware of having seen Parkinson Electra in action, &amp; I don't have the typographic eye to tell from samples if I will like it better, the same, or worse.</p>
    <p>I want to use it in print collateral &amp; on my website for my Tarot &amp; dreamwork microbusiness. It will be paired with my handwritten pen &amp; ink logo (see attached; I did it as an attachment because "insert image" kept giving me an error).</p>
    <p>So, the questions:</p>
    <p>1. If you have used/seen Parkinson Electra, how does it compare to Electra?</p>
    <p>2. If you could only buy one, which would you pick, &amp; why?</p>
    <p>3. The extra credit question: Is there a strong argument for my *not* using either of them for this purpose? (Other contenders: Adobe Garamond, Sabon, Scala, Minion, all of which I already have. Old style figures a must.)</p>
    <p>Thanks in advance for all advice, opinions, discussion...</p>
