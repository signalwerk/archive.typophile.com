      <p>Yes, “anemic” would be one word to describe all the older digital versions of Electra, which all seem to have been made forgetting about the ink spread, which today is much less than it was back when Electra was originally designed. I love Electra, but Parkinson Electra is the only digital version I know of that would be usable for print as a text face. On the web I would use Electra cautiously only for large display type.</p>
      <p>David</p>
