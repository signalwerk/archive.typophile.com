      <p>Cool. I can just see it now: "you have Gill Sans crossing Bembo, with Bodoni in the past &amp; Archer in the future..."</p>
      <p>But what does it mean?!!</p>
      <p>Oh, the mysteries!</p>
      <p>Anyway: the sample paragraphs on fonts.com are very instructive. I can see how the Parkinson addresses problems that folks have pointed out about the earlier digital Electra (I believe "anemic" has been a popular description) &amp; if I were setting a book I might prefer it. For my purposes the spaciousness &amp; lightness of Electra seem more appropriate.</p>
      <p>In print, anyway. I'm not crazy about either one as a web font.</p>
