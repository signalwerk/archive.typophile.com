      <p>David: so you would give up the signature f of Electra for the overall improvements of Parkinson Electra? I can't help feeling like that f got the short end of the stick, so to speak. See, this is why it's good I'm here, to listen to professionals who can see the forest while I'm stuck on the trees :)</p>
      <p>Also thanks for confirming my feeling about the web usage of these.</p>
      <p>btw, I notice (&amp; appreciate) your curly quotes—even in a forum post! Now that is Hard. Core. </p>
      <p>ncaleffi: Thank you! I really appreciate the Tarot-informed ideas. Will go have a look at all the faces you mentioned. </p>
      <p>I have been looking at a lot of Art Nouveau design while thinking about this, because the deck I use (the ever-popular Rider-Waite-Smith deck) is just over 100 years old &amp; has strong Nouveau influences. At the same time I want an overall contemporary flavor—hence no Mucha lettering; I think a lot of my collleagues get very stuck on "ancient wisdom" &amp; so forth, so their branding looks like it belongs at the Renaissance Faire. Not a bad thing in &amp; of itself, but it's just not me, &amp; it's not my clients either. </p>
      <p>&amp; I'm glad you like the logo!</p>
