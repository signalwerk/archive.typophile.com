      <p>I was assistant art director at a magazine in the early Eighties where Century Oldstyle was one of our main typefaces, along with Franklin Gothic (not ITC). The choice of COS was influenced by Robert Priest's redesign of Esquire magazine, in which he used it almost exclusively (not to mention brilliantly). I think its popularity in the Eighties was in large part due to Esquire. It was also popular in advertising.</p>
      <p>One thing that's missing today is the display cut, which was considerably more refined than the text cut that all the digital versions are based upon.</p>
      <p>I don't have anything to back it up at hand, but my impression is that COS was a modern update to the "antique" style from the nineteenth century, which evolved (or devolved, depending on your point of view) from Caslon.</p>
