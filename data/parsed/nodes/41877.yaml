      <p>There's a magnificent page of 24pt Old Style No. 7, set solid, in the 1923 Linotype manual, which dwarfs all the other typefaces shown at the same size. The x-height is so large, and the fit so tight, it forms an impenetrably dense tangle of text that would have had old Bill Morris nodding his head. It's that density which suits faces like Century Oldstyle to the classic Pentagram layouts with their close-cropped images tightly hugged by wrap-around ragged text. The density of the text blocks emphasizes their silhouette shape as a contrast element to the image, both shapes sitting on the plane of the page--rather than the usual effect of type as parallel lines separated by leading. Mind you, Century Expanded worked just as well, having pretty similar proportions.</p>
      <p>At least, that's the way I remember it.</p>
      <p>Solid setting has become something of a novelty now, whereas it was once the norm.<br>
      The reason is that solid was the default for metal (for reasons of efficiency), but +20% is the default for word processing programs and "auto leading" in Quark and InDesign (for reasons of "readability").</p>
      <p>All those big x-height faces of the 1970s were COS wannabes.</p>
