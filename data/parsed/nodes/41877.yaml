      <p>The the 19th to early twentieth century types named 'old style' are regularized Caslons, with shorter ascenders and descenders, and somewhat more vertical stress. The good thing about them is that they are very readable. The bad thing about them is that short ascenders, as Tracy notes, tend to make a typeface dull. And you see that reflected in the comments here, which I have to agree with. There is a fashion now again for short ascenders, but they tend to be compensated for in other ways to give liveliness. </p>
      <p>The "Caslons" of the early 20th century had longer ascenders, similar to the original, though they generally chopped the descenders.  </p>
      <p>Hopefully, you'll very soon have a modern version with the merits of the original, but more suitable for modern printing :)</p>
