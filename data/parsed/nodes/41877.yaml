    <p>I've been enjoying my copy of <cite>The Pentagram Papers</cite> designed by Kit Hinrichs, in which he uses some of his old standards -- BT Century Oldstyle along with BT Franklin Gothic and BT News Gothic (the man likes Bitstream). I'd like to hear some opinions on Century Oldstyle as a text font, and I suppose display as well. Just curious, really.</p>
    <p>I'm also curious about Red Rooster's Century New Style as a possible better revival, and Mark Simonson's Kandal as a more modern alternative.</p>
    <p>I realize this is random, but I've read all I can get my hands on about Century Oldstyle (including some info on Miller and Richard) and I want more...</p>
    <p>Thanks.</p>
