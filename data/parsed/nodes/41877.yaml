      <p>Yes! I remember looking through the older Communication Arts ad annuals and being smitten by the huge headlines that dominated most of the layouts -- I loved them. I still love that effect now, but I can never pull it off. It seems like some current magazines (including Esquire) now incorporate negative leading on display type, so much so that the ascenders and descenders run together. Will we look back in twenty years and call it novelty?</p>
      <p>I have the 1923 ATF book -- I need to get my hands on that Linotype book.</p>
