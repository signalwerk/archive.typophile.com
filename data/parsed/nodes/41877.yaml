      <p><em>80s or 90s</em><br>
      Dude, newspapers and schoolbooks have been using Century for, well, a century.</p>
      <p>Here's a recent discussion about the line between <a class="freelinking external" href="http://www.typophile.com/node/41488" rel="nofollow">Modern and Scotch</a> where Nick discusses Century.</p>
      <p>One thing that I would say about the Century types as body text is that they match well with some of the finer display types, like Didot. The strict vertical stress matches up nicely.</p>
      <p>The designer who succeeded me at my school's newspaper set his new design with all Bodoni headlines and Caslon as body. Didn't jive too well, and I told him. He quoted the oftern said but often wrong "When in doubt, use Caslon." It told him he was still wrong.</p>
      <p>Then, about 5 issues into his new design, I was reading the paper, and thought, "Something's different..." Sure enough, Caslon had been ditched for Century Expanded, and the type had become more transparent in his design.</p>
