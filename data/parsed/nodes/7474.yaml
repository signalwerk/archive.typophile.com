  html: <p>November 1st sees the launch of Kenn Munk's latest dingbat system 'Psychophante'. <br>Psychophante is a follow-up dingbat to Wappenbee from 2003, with which you could build bitmapped crests. Psychophante stays within the bitmapped construction kit context, but this time it's about making medals. Like the medal for a well-groomed afro, the medal for excellent file back-up or the nice-drive-through-the-woods medal. <br> <br>Psychophante is available for Mac and PC through Kenn Munk's website <a href="http://www.kennmunk.com" target="_blank">http://www.kennmunk.com</a> or <a href="http://www.myfonts.com" target="_blank">www.myfonts.com</a> at the price of 15$.</p>
