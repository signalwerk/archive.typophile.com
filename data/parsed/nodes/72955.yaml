      <p>Ionics/Clarendons and Scotches are fine companions. The earliest examples of both arose around the same time and region. </p>
      <p>Using a Clarendon as a bold companion for a Scotch in running text can have overtones of period typography. As in this example of Belizio (a Clarendon) with Miller Text (a Scotch):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Belizio-MillerText_3714.png"></div><p></p>
      <p>&nbsp;<br>
      I agree with Reed: keep the contrast in weight or size sufficient to differentiate their use.</p>
