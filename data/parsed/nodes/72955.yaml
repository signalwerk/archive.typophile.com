    html: |-
      <p>I think Miller is a fine choice: They both have similar skeletons, and even the italics have a lot in common. The lighter weights of Sentinel, though, may look a bit close to Miller if you're pairing them at the same size. I'd recommend using a nice different in weight or size to properly differentiate them.</p>
      <p>As more evidence, H&amp;FJ's own recommendations are always effective, and <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100034" rel="nofollow">for Sentinel</a> they suggest pairing it with Chronicle, a Scotch like Miller.</p>
    html_clean: |-
