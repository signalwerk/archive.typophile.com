      <p>Kent, your example is anachronistic -- Miller is too transitional (especially the italic "v") to be paired with a Clarendon and evoke an historic moment in time. The Scotch Modern is the "correct" historical partner for Clarendons.</p>
      <p>This image was originally posted at Typophile by James Mosely:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Clarendon_5599.png"></div><p></p>
      <p>However, because its slabs are not bracketed, Sentinel does evoke the earliest slab serif types, just as Miller evokes an early Scotch Roman, so the two go together historically.</p>
