      <p>A natural companion for a Clarendon (such as Sentinel) would be a realist sans (Helvetica). But I don't think it's a crime to use it with Miller. See how they work together.</p>
      <p>Where do you intend to use Sentinel: in text or for titles? You could use Trade Gothic Bold for titles. Or one of H&amp;FJ's sans.</p>
