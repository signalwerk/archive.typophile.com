  html: |-
    <p>Hello .. I'm doing a music related collateral piece and was looking over what would go with Sentinel. I know the rule with pairing is to not have the fonts too closely related .. Sentinel is a slab and miller a somewhat Scotch serif. Hoefler Frere Jones is the foundry.</p>
    <p>I'm not sure if they're too close and have enough contrast. I could go radically different font for pairing with Sentinel as well .. or if I've made a good choice ... if anyone has any ideas.<br>
    Thanks in advance.</p>
