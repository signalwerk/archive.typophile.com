      <p><em>Mac shot themselves in the foot when they changed chips. No one has written software for the new chips. Sales in the advertising/graphic design market should drop like a stone.</em></p>
      <p>What are you talking about? Most of Apple’s software (including Final Cut Studio) is already native, Adobe and Microsoft have committed to supporting it, lot’s of other developers have already shipped native apps, Quark 7 (in beta - out soon) is already native, etc. Most PowerPC apps will run fine on it, albeit not as fast as native. </p>
      <p>The situation is very similar to when Apple moved from 68xxx chips to PowerPC in the mid-nineties. The only problem is that Apple did it more quickly than anyone expected. Developers only learned about it when Apple made the announcement last summer. At that time, they said the new hardware would be shipping within a year. They beat that by six months. It would be nice if Adobe hadn’t decided to wait until the next major version of CS to go native, but I doubt that will be a deal-breaker since Apple’s high-end desktops still run on the G5 and will probably be the last to make the transition to Intel.</p>
