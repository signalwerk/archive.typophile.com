      <p>You’ve all missed the great irony… Apple’s machines are now the fastest Windows boxes shipping. Benchmarks show Windows XP run faster on Apple hardware than they do on traditional PC makers’ boxes. So much for the “platform wars”. The winner is either Apple with Windows or Apple with OS X… take your pick.</p>
      <p>Can’t wait for Adobe to ship InDesign for Mac-Intel… just pick up the Windows version and run it on your Mac. What a concept.</p>
      <p>For trivial kicks, Apple also recently announced a move to Samsung chips for iPods. (Go ahead and google “Newton 2” or iPhone, I dare you). Suddenly the idea of Intel chips would mean an easier port to something akin to Windows Pocket PC, where desktop apps are that much more portable.</p>
