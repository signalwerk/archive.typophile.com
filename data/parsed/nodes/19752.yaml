      <p>About the chips&gt; </p>
      <p>Admittedly, I wish Apple would have stayed on the PowerPC platform. However IBM nor Motorola were ratcheting up the clock speed fast enough for Apple to compete with the Intel world. I thought when the Cell came out us mac users were gonna get that, but shortly afterwards Apple announced their split from their chip makers. Heck I even wished for the Power 4 to be used in some super duper graphics station but that rumor never came to fruition. And as far as the whole “Apple did it because of the laptops”- I just don’t believe that completely.<br>
      Motorola had just come out with the MPC8641D it was cool, supported PCI Express and Rapid IO. But the problem was not features- those chips maxed at 1.8 Ghz and it was still a G4 (which is not necessarily<br>
       bad because G4’s have a slight advantage in the Altivec department). Not good enough for todays marketing ‘standards’. So my opinion is that Apple did it because they have easy access to refreshed chips. Not IBM’s once a year miniscule moves.</p>
      <p>PowerPC was special but you know what… its just a chip. Intel is moving very quickly and is Apple and developers. However I will upgrade long after Adobe has converted its product line to Intel.</p>
      <p>As far as the hardware and the OS&gt; </p>
      <p>The hardware is very expensive… attractive but expensive. So how I rationalize the price is the OS. Windows XP is a joke. Its stable and smooth until you get it connected to a network. Viruses and spyware galore and mystery slowdowns. ActiveX should die!!! My brother bought a Dell at the same time I got my G5… I have never called tech-support, he calls them all the time. My mac has caused me to restart only once since I’ve had it… I was toying with modem settings while I was dialing and the kernel panicked- big deal and that was over a year ago. Sorry, I’d pay double for a computer that does not put me through hassles and incompatibilities. I respect Windows users for the hardware price thing… I have Windows boxes too but the OS is another story. I have personally lost money with windows!</p>
      <p>From a typophiles perspective&gt; Mac OS X has the best fonts (that you will actually use) included in any OS ever!!! We have Hoefler Text, Neue Helvetica, Cochin, Apple Chancery (which happens to be amazing), Zapfino, Optima, Didot, Bodoni, Palatino, Big Caslon, and American Typewriter to name just a few of the coolest. And what does windows have (cough)… Franklin Gothic Medium. </p>
      <p>Mikey</p>
