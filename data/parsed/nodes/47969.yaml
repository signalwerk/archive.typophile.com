    html: |-
      <p>First of all, Opti made no original fonts. All were clones of others. The name Giant came from the original Filmotype typeface of that name. Filmotype had a whole slew of these Gothics with names that started with 'G' - from the thinnest, most condensed Galaxy Gothic to the heaviest, widest Goddess Gothic.</p>
      <p>Since getting any Opti font these days can be tricky, I'll mention that the old <a href="http://www.qbf.de/dceng.htm" target="_blank" rel="nofollow">Brendel</a> equivalent, <a href="http://www.qbf.de/cart/cart.exe?gif=dc.gif/Sdc02638.gif" target="_blank" rel="nofollow">Undertaker</a>, is available.</p>
      <p>To my eye, though, what was used is one size down the ladder at Garfield Gothic. This is available digitally today from URW as Bee 3. The <a href="http://www.myfonts.com/fonts/urw/bee/" target="_blank" rel="nofollow">Bee fonts</a> take their names from the VGC equivalents of the Filmotype faces. VGC creatively named those B-1, B-2, etc. The only problem with the URW fonts is that they don't include any of the alternates, like that straight-legged 'R' that were available in the Filmotype originals.</p>
    html_clean: |-
      <p>First of all, Opti made no original fonts. All were clones of others. The name Giant came from the original Filmotype typeface of that name. Filmotype had a whole slew of these Gothics with names that started with 'G' - from the thinnest, most condensed Galaxy Gothic to the heaviest, widest Goddess Gothic.</p>
      <p>Since getting any Opti font these days can be tricky, I'll mention that the old <a href="http://www.qbf.de/dceng.htm" target="_blank" rel="nofollow" class="link-external">Brendel</a> equivalent, <a href="http://www.qbf.de/cart/cart.exe?gif=dc.gif/Sdc02638.gif" target="_blank" rel="nofollow" class="link-external">Undertaker</a>, is available.</p>
      <p>To my eye, though, what was used is one size down the ladder at Garfield Gothic. This is available digitally today from URW as Bee 3. The <a href="http://www.myfonts.com/fonts/urw/bee/" target="_blank" rel="nofollow" class="link-external">Bee fonts</a> take their names from the VGC equivalents of the Filmotype faces. VGC creatively named those B-1, B-2, etc. The only problem with the URW fonts is that they don't include any of the alternates, like that straight-legged 'R' that were available in the Filmotype originals.</p>
