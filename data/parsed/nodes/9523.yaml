    html: "<p>Ah, here's what the problem is:  ImageMagick (an open-source program) doesn't support GIF89 compression due to <a href=\"http://burnallgifs.org/\">patent licensing issues</a>.  Free software and GIFs don't mix.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br>   <br>(Oh, and before someone goes and shouts \"buy some real graphics software\", I have Corel PhotoPaint 10 on this system, and could've used that, but ImageMagick is more convenient for batch conversions, especially when your screen shot tool saves to a non-GIF format by default.  Ah well.  I'll remember this next time!)</p>"
    html_clean: "<p>Ah, here's what the problem is:  ImageMagick (an open-source program) doesn't support GIF89 compression due to <a href=\"http://burnallgifs.org/\" class=\"link-external\">patent licensing issues</a>.  Free software and GIFs don't mix.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br>   <br>(Oh, and before someone goes and shouts \"buy some real graphics software\", I have Corel PhotoPaint 10 on this system, and could've used that, but ImageMagick is more convenient for batch conversions, especially when your screen shot tool saves to a non-GIF format by default.  Ah well.  I'll remember this next time!)</p>"
