  html: '<p>Heh. I was just browsing the link that Paul Davidson posted in <a href="http://www.typophile.com/forums/messages/30/4376.html?1042589178">this post</a> several weeks back, and noticed something really strange:  some of the links were illegible at my default font size. <br> <br><img src="http://www.typophile.com/forums/messages/30/6644.gif" alt="mania? pashino? draigon?"> <br> <br>Why?  It seems the designers of the site in question decided that the navigation bar should be set in the Windows bitmap font known as "Small Fonts".  There was no "Small Fonts" bitmap at my default font size, so Windows simply took the smallest size and scaled it appropriately! <br> <br>Interestingly enough, the problem was fixed by</p>'
