    html: |-
      <p>AFAIK, fonts were not produced during the era of heroic communism (too bourgeois).<br>
      In the famous Constructivist posters, book covers and magazines, they used exisiting fonts for small scale typography, and lettered the larger stuff themselves — as was common practice elsewhere during the teens, 20s and 30s. Remember, that photolettering (typositor) had not been introduced even in the West then, and the best “pre-made” type for headlines was wood, and a bit rough anyway. So if you wanted nice big lettering, you made original artwork, and that was true whether you were working in the capitalist West and wanted some neo-Renaissance thang, or were a Soviet radical.</p>
    html_clean: |-
