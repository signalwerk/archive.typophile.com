      <p>I once noticed some variations in the lettering (and I do believe it is lettering, not type) produced by <a href="/wiki/Alexander%252BRodchenko" class="wiki-create">Alexander Rodchenko</a> and was surprised to notice how much variation was there. In the same line of text the width of a given character varied by as much as 20 percent (based on my non-scientific assessment).</p>
      <p>My own conclusion: type was a rich part of the posters, but a secondary detail, kind of like movie stars’ teeth in the 1970s. =)</p>
      <p>I’ve since thought that making a Rodchenko font that is true to his hand would be tough to pull off. How do you, with today’s reproduction fidelity, stay true to his variation and warmth of his lettering. I think it would look too mechanical or canned.</p>
