    html: "<p>Hello kumbuniko <br> <br>you are right to be curious about this. <br>I don't know how it works generaly but i will try to describe how it works with me: <br> <br>Being a professional -meaning that you make a living out of your work- makes you trying to sell your work. On this process a basic tool is to give a client the bigest variety of options you can. Of course this doesn't mean to show something you dislike only to have something more. But even if you have 2 things you like you can't like them equal.  <br> <br>There is a point when you stop creating and act as a viewer even in your own piece, and then you are as subjective are the rest viewers. There were times that i didn't like works of mine that have been chosen, but after an explanation of those who chose them i started liking them.  <br> <br>The thing is that even the creator sometimes cannot comprehence completely his work and a \"stranger\" can see more. So i believe is better to show also the work you \"don't believe\" so much, keeping always of course you quality line on a decent level. <br> <br>Hope i was understood (i am not so fluent in english as you can see). <br> <br>Have a nice day, christos</p>"
