  html: <p>Hello fellows,  <br> <br>there is another theater (opera actually) poster i am working on. It is the opera "Lucia di Lammermoor" by Gaetano Donizetti. <br> <br>The story (in a very shoet brief) is about the forbidden love (what else?) between two young aristocrates Edgardo and Lucia. Their families are deadly enemies, so Lucia's brother Enrico and leader of the family tricks Lucia into believing Edgardo unfaithful. Enrico insists Lucia to marry Lord Arturo Bucklaw. Edgardo disrupts the wedding and curses Lucia. After a lot of tragic events Lucia starts getting mad and she is "abadoning" herself in a way. Her personality is DECONSTRUCTED day by day. At the climax of this proceedure she kills Arturo on their wedning night. This deconstruction of herself leads her to death as the paranoia and her sorrow destroyed her will for life. <br> <br>So, that's the story and below are the proposals. I am looking forward for comments. <br> <br>Have a nice day, christos. <br> <br><img src="http://www.typophile.com/forums/messages/29/37008.gif" alt="a"> <br><img src="http://www.typophile.com/forums/messages/29/37009.gif" alt="b"> <br><img src="http://www.typophile.com/forums/messages/29/37010.gif" alt="c"> <br><img src="http://www.typophile.com/forums/messages/29/37011.gif" alt="d"></p>
