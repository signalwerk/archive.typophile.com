    <p>Hello all I am currently a high school student, graduating this year, and I am trying to make up my mind what I am going to do new year. <br> <br>My first choice was the Ontario College of Art and Design - Bachelor of Design program. I didnt get accepted there because my fine art work was not strong enough because I know their program enforces a very strong background in Fine Art, especially after they ditched their foundation art year. My high school art programs didnt teach me to paint or draw so I had to teach myself. <br> <br>So what I planned to do was go to George Brown in Toronto for art fundamentals and improve my work and re apply to OCAD the next year. <br> <br>However today I found out I was accepted into the York University and Sheridan College joint program for their Bachelor of Design program. I don't know as much about York/Sheridan as I do about OCAD, and I know they have had some pretty good press about their program but I am concerned about their academic vs practical teaching in that school. <br> <br>Can anyone offer me any advice on my decision or know about the two programs? They both offer the same degree so I am guessing there may be an oportunity to transfer from York if I didnt like it.</p>
