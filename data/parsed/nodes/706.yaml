  html: <p>Hi, <br>I would like to know how to make a bitmap font for 8pt. exactly, using Fontographer.  <br>I used to make fonts with Photoshop, Illustrator and Fontographer, but as silly as it may sound, bitmaps fonts confuse me. They always appear antialiased. <br>And what about the bitmap codes? Which should I use? <br>I will appreciate any help. <br>Thanks, <br>Marcelo</p>
