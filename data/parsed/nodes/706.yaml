    html: "<p>Hi Mark, <br>Thanks a lot for your help. <br>Sometimes, obvious things are not so obvious. <br>Allow me a couple of questions: <br>1)By \"offset the outlines a bit so there are no doubled-up corner points (otherwise, the counters will fill in).\" you mean that I should draw the squares separately, barely touching each other, as in a checkerboard? <br>2)In general, should I always use an em of 1000? (I understand that, speaking about bitmaps, this is not important, as long as I divide it by 8), but I always see that figure. Is it an standard, or there is another reason. <br>3)I've read that interview, but clicking in the tutorials links to AtomicMedia, I find no tutorial in that page. Where is it?. The interview is interesting, anyway. <br>Thanks again, <br>Regards, <br>Marcelo</p>"
