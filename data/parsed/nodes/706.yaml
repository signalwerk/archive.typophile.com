    html: "<p>The offset can be done various ways. The technique I've used is more or less what was described in Matthew's missing (or perhaps removed) tutorial: After you have finished the font, and it looks just the way you want, select all the characters. Do \"correct path direction\", \"remove overlap\", and \"clean up paths\". To do the offset, do \"change weight\" using a value of a few em units. Three usually is enough. Do \"correct path direction\" again for good measure.  <br> <br>Some other tips: Generate the bitmaps before doing the offset. Save your original unaltered version in case you decide later to make design changes. <br> <br>As for the em size: 1000 is the normal amount for PostScript fonts and 2048 is normal for TrueType. Other values can be used. Ideally, you want a value that your target point size will divide evenly into. For example: If you want to do a 12 point pixel font, 1000 won't work since 1000/12 is not a whole number. In this case, you could change it to 1008, or 1200, or whatever, as long a 12 divides into it evenly. Once you have decided on an em size, set your grid spacing to the amount you get when you divide the em size by the target point size (e.g., 1008/12=84 for the grid spacing). It's probably a good idea to work this all out before you begin the font. <br> <br>The thing about all this is there is more than one way to go about it. The major pixel font developers each seem to have their own particular tricks and methods. I began to experiment with these techniques after reading Matthew's tutorial. He seems to have removed it, and I never thought to download or printing, so I'm going by memory. But I know the techniques described here work. Good luck.</p>"
    html_clean: "<p>The offset can be done various ways. The technique I've used is more or less what was described in Matthew's missing (or perhaps removed) tutorial: After you have finished the font, and it looks just the way you want, select all the characters. Do \"correct path direction\", \"remove overlap\", and \"clean up paths\". To do the offset, do \"change weight\" using a value of a few em units. Three usually is enough. Do \"correct path direction\" again for good measure.  <br> <br>Some other tips: Generate the bitmaps before doing the offset. Save your original unaltered version in case you decide later to make design changes. <br> <br>As for the em size: 1000 is the normal amount for PostScript fonts and 2048 is normal for TrueType. Other values can be used. Ideally, you want a value that your target point size will divide evenly into. For example: If you want to do a 12 point pixel font, 1000 won't work since 1000/12 is not a whole number. In this case, you could change it to 1008, or 1200, or whatever, as long a 12 divides into it evenly. Once you have decided on an em size, set your grid spacing to the amount you get when you divide the em size by the target point size (e.g., 1008/12=84 for the grid spacing). It's probably a good idea to work this all out before you begin the font. <br> <br>The thing about all this is there is more than one way to go about it. The major pixel font developers each seem to have their own particular tricks and methods. I began to experiment with these techniques after reading Matthew's tutorial. He seems to have removed it, and I never thought to download or printing, so I'm going by memory. But I know the techniques described here work. Good luck.</p>"
