    html: <p>You can do it all in Fontographer. For 8pt., if your em is 1000 units tall, set your grid to 125 units and start drawing "pixels", i.e., squares. If you want to make sure the font works in Flash, offset the outlines a bit so there are no doubled-up corner points (otherwise, the counters will fill in). You also need to use the font at exactly 8pt., or a multiple of 8pt. (16pt., 24pt., 32pt., etc.). Obviously, there is more to it than that, but that's the basic idea, and should be enough to get you started. See <a href="http://typophile.com/articles/bardram/index.html" target="_blank">http://typophile.com/articles/bardram/index.html</a> elsewhere on this site for more info.</p>
