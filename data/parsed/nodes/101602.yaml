      <p>Believe: <a class="freelinking external" href="http://www.losttype.com/font/?name=wisdom%20script" rel="nofollow">Wisdom Script</a><br>
      BECAUSE THAT'S/HARRY MAIN: <a class="freelinking external" href="http://www.losttype.com/font/?name=deming" rel="nofollow">Deming</a><br>
      GO OUT THERE: possibly <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">Gotham Bold</a><br>
      &amp;: <a class="freelinking external" href="http://blogs.walkerart.org/design/2007/12/26/pistilli-roman/" rel="nofollow">Pistilli</a>'s ampersand, could be found through <a class="freelinking external" href="http://www.dafont.com/pistilli-roman.font" rel="nofollow">Pistilli Roman</a> by Claude Pelletier, <a class="freelinking external" href="http://marketplace.veer.com/type/JBT0000118" rel="nofollow">Eloquent</a> by Jason Walcott and <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/sahara-bodoni" rel="nofollow">Sahara Bodoni</a> by Bob Alonso<br>
      DO IT: may be <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/Bebas" rel="nofollow">Bebas</a> or <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/bebas-neue" rel="nofollow">Bebas Neue</a><br>
      The/Way: <a class="freelinking external" href="http://www.dafont.com/brannboll.font" rel="nofollow">Brannboll</a><br>
      ONLY: Helvetica Bold or Arial Bold could do the job<br>
      YOU'RE GONNA: <a class="freelinking external" href="http://www.losttype.com/font/?name=arvil" rel="nofollow">Arvil</a><br>
      GET IT!: <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/ChunkFive" rel="nofollow">ChunkFive</a></p>
