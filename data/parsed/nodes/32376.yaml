    html: |-
      <p>To change the Chlorine "a" you could redraw the "serif" to angle it away from the letter or turn it at a right angle, making it more prominent. I would use more leading than you have and for the longest truth turn over "what" so "what kind" is on one line and centre on the height of the lozenge, and draw up an apostrophe.</p>
      <p>From a technical point of view you should create a lefthand and righthand version of the advertisement, currently your layout would almost work for a recto (righthand page) but if used as a verso the dares, logo and pictures would be partially obscured by the binding, (I say almost because most magazines will specify a safe type area which will be approximately 20mm less than the printed dimensions to take into account of trimming). </p>
      <p>The various elements are somewhat disconnected, I would be tempted to move the headline and arrow element up and make the body copy more prominent and larger and to the same measure as the headline and turn over the lines to represent the meaning better.</p>
      <p>As for mixing up typefaces there are no rules, essentially you can easily use two or three typefaces in this instance, for example, a display face for the headings, a text face for the body copy and another for the dares – I wouldn’t mix similar typefaces, say, a pair of humanist sans or a pair of venetian serifs (although it can be done), it really is down to looking at combinations and making your own judgement. In this case however I think you are better off using one and making that work well.</p>
      <p>Tim</p>
