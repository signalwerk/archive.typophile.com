    html: |-
      <p>Chlorine works on a level (because it has no uppercase, extended body copy will not be the best but in this limited situation it should be fine) it is a mixture of fun and techno and fits my appreciation of the demographic and your triangle.</p>
      <p>Leading is crucial in all situations, the default 20% of Quark and, I believe, InDesign is sufficient for many typefaces in most text settings but when working with a free font and all that brings with it in terms of kerning and spacing, you should apply your own leading and kerning because at the moment the leading is way too tight, I cannot see the kerning clearly enough to comment. As for the turn overs in the body copy I would make the last three sentences of your body single lines (or paragraphs) and break the first sentence to suit the line length you create. btw I think you are missing an "are" in the second last sentence.</p>
      <p>Tim</p>
