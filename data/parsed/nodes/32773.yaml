    date_raw: 3.Apr.2007 9.28am
    votes: null
    html: <p>If Europeans want better prices, they need to stop buying stuff at higher prices. The reason Europe, Australia, and Japan pay so much more for stuff than Americans is because you guys grumble a lot, and maybe send the European Commission out to do a little legal harassment, but in the end you still buy the software. When companies try jacking up prices in the US we just buy elsewhere. Don’t complain about price discrimination if you’re eventually just going to buy the software regardless.</p>
