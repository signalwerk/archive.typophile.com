    <p>For years Adobe has been ripping of European customers with higher pricing. You can read more about it from here:<br>
    <a href="https://web.archive.org/web/20080821135031/http://www.amanwithapencil.com/adobe.html" title="http://www.amanwithapencil.com/adobe.html">http://www.amanwithapencil.com/adobe.html</a></p>
