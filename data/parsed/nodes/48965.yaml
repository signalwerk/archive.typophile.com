      <p>I agree Nick and didn't intend to downplay the role of appropriate and well-crafted typography. Many old style Roman types have origins that go back that far. Then there are antique versions of these that mimic early printing methods. I just thought since 15c would encompass a large chunk of time both typographicly and calligraphicly  there would be a lot of room for interpretaion. Perhaps the surrounding architecture might help play a role in choosing a more specific type. Not being versed in type history like many folks here I would hesitate to offer a specific font, but would reccommend using something thats not cliche.</p>
