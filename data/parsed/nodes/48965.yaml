      <p>Caxton Script (<a href="http://www.myfonts.com/fonts/suomi/caxton/script/charmap.html?vid=333950&amp;cpselect=CP5" title="http://www.myfonts.com/fonts/suomi/caxton/script/charmap.html?vid=333950&amp;cpselect=CP5">http://www.myfonts.com/fonts/suomi/caxton/script/charmap.html?vid=333950...</a>) will give you a good impression of 15th century english printing types. You may agree that this type is not so useful, as it is no very legible. </p>
      <p>Have a look at Willam Morris' Troy and Golden Type. Those are not true 15th centure types but - in my opinion - very good reconstructions. You may like the P22 Morris cd (<a href="http://www.myfonts.com/products/p22/william-morris-cd/" title="http://www.myfonts.com/products/p22/william-morris-cd/">http://www.myfonts.com/products/p22/william-morris-cd/</a>), but there are a lot more  Morris adaptions - try a search on Morris at myfonts.com.</p>
      <p>wolfgang</p>
