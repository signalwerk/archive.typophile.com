    html: |-
      <p>It depends on the face and the layout software you have. If you get a standard-issue regular-set PostScript face, it will only contain one type of figure style, and will not contain small caps. These character sets usually contain only tabular lining figures, meaning all of the number have the same space around them and are all about cap-height. The numbers 1 and 0 usually look awful in this setting. The problem is that in this older format (and TrueType shares this difficulty) is that there are only 215 slots for various characters (glyphs) - not nearly enough for good typographic design. So the PostScript-format faces got around this by having supplementary set - 'expert' sets - that would contain small caps or text figures - anything that was lacking in the regular set. </p>
      <p>There's a newer format called OpenType where all of these characters (or glyphs) are in one typeface. This format I think can handle 12,000 characters, so there's more than enough room. Not all faces use all of the possible features, so you need to examine the manufacturer's description carefully. Generally if it's called 'OpenType Pro' you'll get complete typographic support. Contact the seller directly, if in doubt.</p>
      <p>BUT to access these characters you need a layout program that can us the font properly. InDesign can, and I think that Illustrator CS2 or later can as well. I'm unclear about Quark as the last time I checked they were still accessing only the first 256 characters of an OpenType font. Doubtless this has changed, but you'll need to have an up-to-date version. While MS Word can read and use OpenType fonts it cannot (it seems) access any special features, such as small caps. It can use any multi-lingual features (such as Greek or Arabic characters in the typeface), but then that's not what you need here.</p>
      <p>I hope this helps.</p>
