      <p>Many thanks for you responses. </p>
      <p>I do think that it is worthwhile to get a font as close to the Fifteenth Century as I can. Close is the operable word, in that it does not have to be an exact font from the period, but it should compliment the building </p>
      <p>I am getting closer now, even if it is just knowing what I do not want.</p>
      <p>I know that I do not want the flowery (is it Bastarda?) type fonts.</p>
      <p>Also, as I intend to use it for Letterheads, Business Cards, Gift Vouchers, Posters/leaflets in the shop, and Shop Signage, I know it needs to be scalable, down to Business Card size.</p>
      <p>There does appear to be one other common problem. Postcodes look decidedly odd in such fonts, as numbers are the same size as Lowercase letters. Is it possible to just increase the font size for them to be a similar size to Uppercase letters?</p>
      <p>Morris Golden matched all my requirements, I think, except it failed the postcode test. </p>
      <p>Any more ideas/contributions are gratefully received.</p>
      <p>(Edits added below)</p>
      <p>I have just found this one, which seems to tick my boxes. But does it tick yours as a decent imitation of a Fifteenth Century font?<br>
      <a href="http://www.myfonts.com/fonts/grouptype/caslon-antique/" title="http://www.myfonts.com/fonts/grouptype/caslon-antique/">http://www.myfonts.com/fonts/grouptype/caslon-antique/</a> (non-italic verson).</p>
      <p>There is a claim here to that period.<br>
      <a href="http://www.aapainfo.org/atf/BBS.pdf" title="http://www.aapainfo.org/atf/BBS.pdf">http://www.aapainfo.org/atf/BBS.pdf</a></p>
