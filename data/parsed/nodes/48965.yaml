      <p>As far as composing emails with the 15th century font.  Your recipients will not be able to view the message in the font unless they already have the font installed on their systems. (Unlikely)</p>
      <p>One way to get around this is to save the text as an image, but you'll only want to do this for short blocks of text.</p>
