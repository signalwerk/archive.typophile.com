      <p>Those three are present-day versions of Renaissance Italian-style writing, Gordon.<br>
      The Roman style of writing and type didn't arrive in England until the 16th century.</p>
      <p>In 15th century England, the local style was "Bastarda".<br>
      This was also the style of the first English typeface by Caxton.</p>
      <p>For instance, below from the early 15th century, and below that from the second half of the century:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Chaucer_Hoccleve_5298.gif"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/05000802_3969.jpg"></div><p></p>
      <p>Here are some modern <a href="http://www.myfonts.com/search?search%5Btext%5D=bastarda/" rel="nofollow">Bastardas</a>.</p>
      <p>I'd say pick the one that suits your line of business best.</p>
