      <p>Here is a helper <a class="freelinking external" href="http://www.agdproject.com/timeline2.htm" rel="nofollow">Here is a helper</a> on the styles of the 16th century (and further). You can then go to <a class="freelinking external" href="http://www.myfonts.com/" rel="nofollow">Myfonts</a> and search for those styles.</p>
      <p>As you can see, there are a number of styles to choose from. You should probably narrow down the region/country of origin of the typeface to something that fits. Another consideration is that the styles in the timeline are all text faces from book printing applications. Popular signage/lettering from the era you'll have to Google for. Thirdly there are the many styles of handwriting from that period, that all carry special connotations. They divide into geographical areas, periods, fashions, occasions, and some are used specifically by some governments/regencies.</p>
