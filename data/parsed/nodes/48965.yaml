    <p>I originally posted this in the General Discussion Forum, but I think this may be the correct forum.</p>
    <p>If this is in the wrong Forum, please let me know and I will repost in the right Forum.</p>
    <p>I am opening a shop in the UK very soon and I am looking for Letterhead etc.</p>
    <p>The shop was built in the 15th Century, so I thought that a font which matched the building would be a good idea to reinforce the character etc.</p>
    <p>The problem is that I am totally ignorant of 15th Century fonts. Are they available etc?</p>
    <p>Also if I buy a font, I assume that I load the software and set it as me default font etc.However, will people be able to read emails written in the font etc?</p>
    <p>I do apologise for the naivety of my questions, but any help would be gratefully received.</p>
    <p>Many thanks in advance.</p>
    <p>The font would be used on signage, hand painted and suitable large. It would also be used for Word documents, emails and newspaper adverts etc.</p>
