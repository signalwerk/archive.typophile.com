      <p>It is a bit late now to respond, but I couldn't resist having a look in here because I love the title of this thread.<br>
      Of course letters are a metaphors of the very thing they try to communicate i.e. the a communicating a-ness.<br>
      But then when we know its an 'a', then what kind of 'a' is it?<br>
      Is it a kind a or an aggressive a, what did it have for breakfast?<br>
      It becomes very Type CSI.<br>
      Interesting.</p>
      <p>_________________________________<br>
      Michael Hernan</p>
