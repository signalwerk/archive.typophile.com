  html: |-
    <p>I am interested in purchasing this display face, GF Script No 5. The foundry is listed as Gigofonts in Slovenia. Their website address goes nowhere, and a Google search (cursory, I admit) is a dead end as well. I wanted to contact them about options for an expanded license/EULA that would allow use to use the typeface in an e-book (i.e. without converting to outlines). When a foundry dies, what happens to the EULA?</p>
    <p><a href="http://new.myfonts.com/fonts/gigofonts/gf-script-no-5/" title="http://new.myfonts.com/fonts/gigofonts/gf-script-no-5/">http://new.myfonts.com/fonts/gigofonts/gf-script-no-5/</a></p>
