  html: <p>I am redesigning the identity for Microtek. They are a company that specializes in scanners, but also are involved in other digital imaging including digital cameras, monitors, and projectors etc. I have narrowed down to 2 different directions and am having an extremely hard time chosing one.  <br> <br>��� <br> <br>The top logo incorporates the pixels that are the core root of these products, an "M" with the line up of pixels, and also hinting at some sort of cable connector used to hook these products up. <br> <br>The second also deals with pixels, in (an attempt at) a more modern way. The pixels still form an "M" but are now rounded, and thrown into a perspective to hint at the idea of scaning.  <br> <br>My dilemma here is first off that I like them both, and am having a hard time stepping back from them. I like the idea of the 1st a bit more, but like the asthetics of the second. Any opinions on which direction to go would be GREATLY appreciated! Thanks everyone. <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/52387.gif" alt=""></p>
  html_clean: <p>I am redesigning the identity for Microtek. They are a company that specializes in scanners, but also are involved in other digital imaging including digital cameras, monitors, and projectors etc. I have narrowed down to 2 different directions and am having an extremely hard time chosing one.  <br> <br>��� <br> <br>The top logo incorporates the pixels that are the core root of these products, an "M" with the line up of pixels, and also hinting at some sort of cable connector used to hook these products up. <br> <br>The second also deals with pixels, in (an attempt at) a more modern way. The pixels still form an "M" but are now rounded, and thrown into a perspective to hint at the idea of scaning.  <br> <br>My dilemma here is first off that I like them both, and am having a hard time stepping back from them. I like the idea of the 1st a bit more, but like the asthetics of the second. Any opinions on which direction to go would be GREATLY appreciated! Thanks everyone. <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/52387.gif" alt=""></p>
