    <p>Hello all!</p>
    <p>I'm wondering if anyone could help me.<br>
    I'm doing a logo project and need a sans serif.</p>
    <p>I'm thinking something geometric like Avenir and Futura, and something classic like helvetica and Akzidenz-Grotesk.<br>
    But still it needs a twist of personality to it.</p>
    <p>Prefferably I would like a quite newly released font (not that wildly used), but I'm open for everything old and new.</p>
    <p>Anyone who have any good suggestions.<br>
    It would be appreciated!</p>
    <p>SiriSiri</p>
