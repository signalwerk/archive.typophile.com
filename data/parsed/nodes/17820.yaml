    <p>Does anyone know a nice sans serif to go with Geometric slabserif 712?<br>
    I'm using Geometric for the bodytext of my book and I want my headers to be sans serif.<br>
    Preferably a font thats also great for bodytext so I can switch. I was using Akzidenz but I dont like the way that font looks as body text at all. I like DIN but its soooo overused! Any suggestions? Thanks!</p>
