      <p>I know it's your choice, but please, please, please don't use MS Arial Unicode for Korean if you have any consideration at all for respectful typography.</p>
      <p>The Korean portion of MS Arial Unicode is downright distracting in its ugliness and complete disregard of the Korean feel for letterform proportions. It looks so amazingly amateurish even to Koreans untrained in typography. I sincerely wish it didn't exist at all.</p>
      <p>That was my whole point. Yes, there are fonts that provide glyphs for all those different writing systems, but they won't all be usable. Please don't sacrifice typographic sensitivity for the apparent simplicity of using a single font. You will regret it if you actually want people to read all the different scripts you set in that font.</p>
