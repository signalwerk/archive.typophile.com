      <p>You talk about embedding a font in your appli(cation) - so do you plan on redistributing the universal font with your Mac based application? The cost of licensing one of the existing fonts or a custom font for redistribution would be expensive, and you're probabyl better off writing code that uses a preferred system font for each language. </p>
      <p>Some platforms have that built in - for example WPF has the concept of a composite font, an XML file that points to different fonts for each Unicode range and language ID.</p>
