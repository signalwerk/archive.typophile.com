    <p>Hello everybody !!!!</p>
    <p>I'm looking for a font that can handles every type of characters, from the latin alphabet till the cyrillic alphabet via the asiatic alphabets (japanese, chinese, ..). I though that Lucida Grande would do it, but apparently not (when I embed this font on my appli, it doens't display correctly the characters..). With a japanese character I though that I would have manage to find it, but unfortunately the russian is craply displayed (with a huge letter-spacing)<br>
    So do you know if this magic font exist or how to find it ?</p>
    <p>In other case, do you know how to find the character palette on the mac that would list me all the font available on my mac and which alphabet these fonts handle ?</p>
    <p>Or maybe a website with fonts and their cover ?</p>
    <p>Thanks a lot for any help !!!</p>
