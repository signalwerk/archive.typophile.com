      <p>Depends on what you need, but the short answer is no. There is no such magic font. I've yet to come across a font with a broad coverage of different writing systems that does each of them justice. MS Arial Unicode is atrocious in this respect.</p>
      <p>Use the mix and match approach. Choose a good multi-script font that supports a good portion of the writing systems you need as its core design. Supplement the writing systems that are missing with fonts that cover them as their core designs. If you need a font for Chinese ideographs, use a font designed specifically for Chinese or Japanese, not something like MS Arial Unicode. Ditto for Thai, Georgian, Greek, etc.</p>
      <p>If you specify which scripts you need, then it will be easier to suggest which fonts you might use. I don't know if you'll need the Korean alphabet, but if you do, you could do worse than use Malgun Gothic, the font shipped with Windows Vista for Korean. It has comparably decent Cyrillic design (although I would like to hear from native Cyrillic readers; ditto for its Greek and Japanese components). It only supports the Russian letters, though. And it lacks Chinese characters entirely--you would have to choose a comparable sans serif font with Chinese character support.</p>
