      <p>The following thread went on a lengthy tangent regarding the difference between the Chinese, Korean, and Japanese letterforms for the same characters:</p>
      <p><a href="http://typophile.com/node/42433" title="http://typophile.com/node/42433">http://typophile.com/node/42433</a></p>
      <p>As I wished in that thread, it would be great to see a font that handles the country-specific variations of Chinese characters with the 'locl' feature. The thing is that such a font would require the coordination of an international team of experts from the different countries that use Chinese characters in addition to the ridiculous amount of man-hours needed to design the tens of thousands of glyphs. Thomas can confirm this, but I think Adobe has developed Japanese fonts that utilize OpenType features for Chinese characters, so Adobe would be a good candidate to coordinate such an effort.</p>
