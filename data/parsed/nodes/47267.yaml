      <p>These days, there are a fair number of typefaces that have decent Latin, Greek and Cyrillic in a single font.</p>
      <p>The problem is getting East Asian support in the same font. The particularly thorny problem is dealing with the Han unification characters. Basically, for certain East Asian characters, There are quite different designs for (1) Chinese versus Japanese and (2) simplified Chinese versus traditional Chinese. Currently, the only functional way to distinguish them is to build an OpenType font with the 'locl' (locale) feature, and use apps/OSes that process that feature correctly for those languages.</p>
      <p>I'm not sure how widespread such app/OS support is for the 'locl' feature with those languages, but I know that such fonts are pretty much non-existent in the wild. AFAIK, thus far such fonts have only been built by mad scientists in labs (pace Dr Lunde &amp; Mr Meyer).</p>
      <p>Because of the potential for great efficiency (space savings), I imagine we will see such fonts in the wild in the future.</p>
      <p>Cheers,</p>
      <p>T</p>
