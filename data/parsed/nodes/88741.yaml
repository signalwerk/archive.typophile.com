      <p>More recently – Comic Sans.</p>
      <p>The following references may help:</p>
      <p>Walker, S. &amp; Reynolds, L. (2002/2003). ‘Serifs, sans serifs and infant characters in	children’s reading books’ Information Design Journal, 33(2/3) pp. 106-122.</p>
      <p>Walker, S. (2005). ‘The books that nobody sees: typography in children’s reading books’	Baseline, No. 48, pp. 25-32.</p>
      <p>Walker, S. (n.d.) Testing typography in primary schools [online]. Available at:<br>
      <a href="http://www.kidstype.org" title="www.kidstype.org">www.kidstype.org</a></p>
      <p>Coghill, V. (1980). ‘Can children read familiar words set in unfamiliar type?’ Information Design Journal.	1(4), pp. 254-260.</p>
