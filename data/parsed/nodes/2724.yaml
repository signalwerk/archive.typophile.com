  html: <p>So, I just got font agent and I am very happy with it. <br> <br>cept, it has shown me some problems with my fonts.  What does it mean if I am missing screen fonts or postscript fonts for a given style? <br> <br>can I still use this face? <br> <br>what should I do? <br> <br>thanks!</p>
