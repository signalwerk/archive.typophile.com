    <p>Hi, I was wondering if anyone could tell me the name of the font (or a similar one) used for the logo on the front of the box for the movie "Amelie".</p>
    <p>Here's a link:</p>
    <p><a href="http://images-eu.amazon.com/images/P/B000069JDB.02.LZZZZZZZ.jpg">http://images-eu.amazon.com/images/P/B000069JDB.02.LZZZZZZZ.jpg</a></p>
    <p>If anyone could help, I'd really really appreciate it.</p>
    <p>Dave.</p>
    <p>PS-If you haven't already seen it, you should definately check out this movie!</p>
