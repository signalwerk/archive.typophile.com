    html: "<p><i>Isn't this contradictive? Or do you mean that the spacing is   <br>tight,and therefore they look too wide?</i>  <br>  <br>Yes, that's precisely what I meant.  <br>  <br><i>[o] It's not based on a super elipse, rather a *slightly* modified   <br>true circle...</i>  <br>  <br>Well, OK, but it still looks a bit egg-shaped to me, especially  <br>at north and south.  <br>  <br><i>That's a my problem, how \"quirky\" should it be? I mean, there's   <br>million of uses for a \"bland\" sans serif... but there are also millions   <br>of bland sans serifs.</i>  <br>  <br>But my point in mentioning Documenta Sans is that it doesn't need  <br>to be quirky at all to have personality and make an effect. The  <br>only quirky detail in Documenta Sans is exactly the only thing that  <br>bothers me in the face: the very narrow disconnection of the  <br>P's bowl, which is truly irrelevant.</p>"
