    html: "<p>Hi. <br> <br>Seeing these few characters... <br>I'm not sure whether n,m,u,h are too wide or they <br>just appear like that because they're tight. <br>r is definitely wide. <br>o seems a bit pointy, as if you needed to pull the <br>BCPs a little farther from the nodes. The same <br>goes for the bottom bowl of the g which is BTW <br>too dark.  <br>i's dot should be higher. <br>s needs a lot of work. <br> <br><i>Is it worth continuing?</i> <br> <br>Even though there are similar faces, if you manage <br>to instill some character and personality, why not? <br>For example: see the use Irma Boon has made of <br>Frank Blokland's Documenta Sans - a face similar to  <br>this and not overused - in her Treumann book. The <br>fact that it's not Gill Sans or the other staples gives  <br>it a special freshness. God's in the details.</p>"
