    <p>Hi Typophiles -</p>
    <p>Looking to identify the font used in Old Heinz Tin label - the OX TAIL SOUP typeface - I've looked at Copperplate, Penumbra, Miehle, Symbol, can't quite get it right...<br>
    Any suggestions from the sleuths would be much appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bbdffbdd_5586..jpeg"></div><p></p>
