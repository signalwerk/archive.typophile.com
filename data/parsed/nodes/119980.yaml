      <p>Discussed here a few years ago, albeit about more current packaging:<br>
      <a href="http://www.typophile.com/node/93388" title="http://www.typophile.com/node/93388">http://www.typophile.com/node/93388</a></p>
      <p>Consensus seems to be that a proprietary face called TK Super Duper-BG2 is used, which was based on historical precedents like your label sample.</p>
      <p>Your sample is pretty small, but even when I sought out bigger samples from the same era, I didn't get any exact digital matches. </p>
      <p>In addition to LHF Hensler, mentioned in the post above, here are a few others that might work (and, yes, I've included some Copperplates):<br>
      <a href="http://www.myfonts.com/fonts/storm/ideal-gothic/" title="http://www.myfonts.com/fonts/storm/ideal-gothic/">http://www.myfonts.com/fonts/storm/ideal-gothic/</a><br>
      <a href="http://www.myfonts.com/fonts/parkinson/modesto/" title="http://www.myfonts.com/fonts/parkinson/modesto/">http://www.myfonts.com/fonts/parkinson/modesto/</a><br>
      <a href="http://www.linotype.com/44502/CopperplateGothic30BC-product.html" title="http://www.linotype.com/44502/CopperplateGothic30BC-product.html">http://www.linotype.com/44502/CopperplateGothic30BC-product.html</a><br>
      <a href="http://www.linotype.com/44498/copperplategothic30ab-font.html" title="http://www.linotype.com/44498/copperplategothic30ab-font.html">http://www.linotype.com/44498/copperplategothic30ab-font.html</a><br>
      <a href="http://www.myfonts.com/fonts/mti/memo/" title="http://www.myfonts.com/fonts/mti/memo/">http://www.myfonts.com/fonts/mti/memo/</a><br>
      <a href="http://www.myfonts.com/fonts/urw/american-gothic/" title="http://www.myfonts.com/fonts/urw/american-gothic/">http://www.myfonts.com/fonts/urw/american-gothic/</a><br>
