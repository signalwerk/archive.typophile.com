    <p>I'm a senior at Vassar College writing my thesis on Mexican Typography during, roughly, the first 100 years of Mexico's nationhood.</p>
    <p>I was wondering if anyone could point me to some studies (I have already read Fernandez Ledesma's work on the 19th century) or archives of graphic design during the Porfiriato (~1880s to 1910) and Revolution of 1910. I do speak/read spanish, so that is not a problem.</p>
    <p>who's excited for the first ATypI conference in Latin America?!</p>
