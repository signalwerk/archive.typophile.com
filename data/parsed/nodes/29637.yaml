    html: <p>Although names is what last after a person or a city dies, you should know that the invention of the typophile scroll bar is as old as the papyrus roll ; this because to form the long strip that a scroll required, a number of such sheets of papyrus were united, placed so that all the horizontal fibres parallel with the roll's length were on one side only. So, for your interest, one modern book you can flip the pages is "The Nymph and the Grot" by James Mosley (1999).</p>
