      <p>Jenson and Griffo based their types on existing letter forms from scribes. However, they figured out how to give the letters and words more even color than hand-written letters, and so made type more readable than hand writing. This sculpting of letters for even color was a huge advance--which we still arguably haven't improved upon significantly. Also each scribe to some extent would have their own hand--and type designer his own style.</p>
