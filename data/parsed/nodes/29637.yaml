      <p>David Bolten of <a herf="http://www.alembicpress.co.uk/" target="new" rel="nofollow">Alembic Press</a> presents wonderfully in depth references to type job cases:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/california_typecase_6492.jpg"></div><br>
      <strong>Case (Typecase)</strong><br>
      a wooden drawer partitioned into many small boxes, used to store the separate type characters. The cases are held in a frame or rack, often with a bracket on the top to allow two cases (eg an <strong>upper</strong> and <strong>lower</strong>) to be held open one above the other, and in front of which the compositor stands whilst setting the job. Some cases have no internal partitions, and are used to store wood letter (or blocks, dingbats, etc.). Over 200 different styles of case are shown here, but there are many others. <p></p>
      <p><strong><a href="http://members.aol.com/alembicprs/uppcase.htm" target="new" rel="nofollow">English Upper Case</a></strong></p>
