    html: |-
      <p>What??? Times New Roman was designed by Monotype in ca. 1930 for the Times of London. Times Roman is the Linotype version of this same face. Therefore, Times Roman cannot be the first serif typeface!</p>
      <p>The first typeface with serifs on it would have been cut in Italy sometime after 1460. Remember, before Gutenberg invented printing in the west in ca. 1450, there were no typefaces or fonts in Europe! (In China and Korea, movable metal type seems to have been invented earlier; Gutenberg probably had no knowledge of these things, though).</p>
      <p>Lettering and calligraphy predate typefaces by about several thousand years. But lettering or calligraphic styles are just that; they are styles, not typefaces.</p>
      <p>So, now that we've got that straight, the first serif typefaces may have been cut by Conrad Sweynheim and Arnold Pannartz, two German printers who left Mainz for Italy, openning the first printing press there. But it is debatable whether their typefaces are really serifed. Nicholas Jenson's typefaces (ca. 1470 in Venice) are often considered the world's first serif types.</p>
      <p>But these typefaces didn't really have names. Names became attached to typefaces later, when typefounders began marketing their fonts to other printers.</p>
      <p>The first letters with serifs on them were probably carved into stone by the Romans. Again, these letters don't really have names either. There are sometimes refered to now as Capitalis Monumentalis, or just monumental Roman lettering. The stone-carved letters on the Trajan Column in Rome are probably the most famous examples of these.</p>
      <p>But I have no idea what you are really asking!</p>
