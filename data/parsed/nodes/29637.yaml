      <p>Though many historians attribute the development of serifs to the ancient Romans, it was in fact of Egyptian origin, particularly "slabs".</p>
      <p>The association of the term "feet" as being synomonous with the typographic term "serif" was due to the fact that these terminals were originally depicted in hieroglyph (see below):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Hieroglyph2_5694.jpg"></div><p></p>
      <p>Frequently these "feet" were situated on a rendered baseline (especially on bird feet):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hieroglyph_birdfeet_5494.jpg"></div><p></p>
      <p>The illustration below shows the direct correlation between bird feet and serifs used for the lowercase "i" --<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/turkey_diag_4257.jpg"></div><p></p>
      <p>In addition to the development of formalized serifs, early hieroglyphs of birds suggest that the Egyptians invented the flared terminal and semi-sans as clearly shown below:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/turkey_sans_6337.jpg"></div><p></p>
      <p>Which is a long about way of wishing you all a Happy Thanksgiving!</p>
