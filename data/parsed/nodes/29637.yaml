    html: |-
      <p>&gt;but i’m still confused over lowercase serif fonts.<br>
      &gt;were they invented during the Capitalis Monumentalis?</p>
      <p>You still do not seem to understand! Before Gutenberg (or whoever else might have been first, perhaps someone in China or Korea) cast his first fonts, there weren't any typefaces and there weren't any fonts. Their were many different ways to write or carve the alphabet, but none of these were types or fonts. Fonts are means of mechanically reproducing a specific design over and over again.</p>
      <p>Lowercase letters were codified centuries after the Romans settled on the forms of what we now call uppercase letters. An argument could be made that lowercase letters first appeared before 300 AD, but a good simple answer is that they didn't arise until the early middle ages.</p>
      <p>&gt;i mean, was it only uppercase during that time? </p>
      <p>Yep. Well, only sort of. You see, since there was no "lower"case, there could not be any "upper"case, now could there? There was only one case. It looked a lot like what we call uppercase today. But even when the first "lowercase" letters were written, they weren't quite seen as an addition to uppercase letters, but rather as a totally separate style, entity, or evolution. Some scribe wrote all in "uppercase", some all in "lowercase"—but they saw the two as different independent styles. The mixing of upper and lowercase letters together would only came later, probably in the high middle ages.</p>
      <p>&gt;what about small caps? </p>
      <p>Small Caps are really a typographic invention in my opinion. That is, they weren't invented until "typography" was already around, that is, after the invention of typefaces in 1450 and thereafter. If I recall correctly, Aldus Manutius (Venice, ca. 1500) made use of small caps in his books. But I can't verify that, nor do I know if other printers before him used them or not. So, no exact date here from me!</p>
      <p>&gt;whst is curvise and semi cursive lettering? please explain.<br>
      &gt;Thanks for your time, very highly appreciated :)</p>
      <p>This is a bit too many questions ;-)<br>
      Perhaps someone else will step in and answer this one for. But if I were you (and I was in your situation once, not all that many years ago…) I would go to your University library and read some old books about the development of the alphabet, of writing, and of printing. Then you'll know the answers to these questions inside and out.</p>
