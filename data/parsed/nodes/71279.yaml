    html: |-
      <p>In the first of your fixed ones, the R has fallen below the baseline, and the curve is still off, it doesn't make any sense. The second is better, but to my eye the R looks like a P that's about to topple over towards the O, with a tail hanging on it in a rather unconnected way. I would curve the tail up a bit towards the Z as Riccardo suggests, and maybe make it connect to the bowl of the R slightly further to the right. I've made a very crude example of what I mean in Paint, I've tried to make the curve of the R be concentric with the O, look like it continues to the Z (I didn't succeed with that one very well), but also made it cross the baseline more or less at the furthest point of the bowl of the R (blue lines), where it would naturally stop if the R was just a letter with no continuing curve.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/inga_6168_6111.jpg"></div><p></p>
      <p>Just a suggestion from a non-designer who likes to look at things.</p>
