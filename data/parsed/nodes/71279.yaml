    <p>Hi hello,</p>
    <p>My friend asked me to make an online portfolio for her. She's an architecture graduate. So far, I haven't encountered that many individual architecture portfolios online, so I decided to seek for some feedback and some info on it here.</p>
    <p>What I'm working on at the moment is the type for her full name. I need something that would look good both in print and screen.</p>
    <p>The aspects I doubt about are the width of the type and the unusual "R" I've used (if the curve looks good or I don't need it at all?). I haven't dealt with the kerning on the bolder versions yet tho. </p>
    <p>As you can see, it doesn't really resemble architecture itself. Is it a mistake?</p>
    <p>You can consider me as an amateur in this field of typography, so maybe I'm over thinking this whole thing and should stick with something clear/simple?</p>
    <p>Looking forward to your opinions.</p>
