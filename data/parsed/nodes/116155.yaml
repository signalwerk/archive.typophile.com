    <p>I've been enjoying the re-run of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ripping_Yarns" rel="nofollow">Ripping Yarns</a> on BBC TV, and assumed that the title font was URWArtGothic. But what's puzzling me is that the show was made in 1970s, and URW <a class="freelinking external" href="http://www.urwpp.de/cgi-bin1/dalcgi/source/schnellsuche_e.htd?searchchar=artgothic" rel="nofollow">say</a> that ArtGothic was designed in 1995. </p>
    <p>So I'm wondering if this is really another font, or if ArtGothic was based on an older font. It looks quite old in style...</p>
