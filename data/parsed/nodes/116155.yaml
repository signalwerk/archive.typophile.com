    html: |-
      <p>Your impression of old in style is correct. Art Gothic seems to have been originally produced by the Central Type Foundry of St. Louis, Missouri, in the 19th century. As is noted in the info provided with a digital version made by HiH <a href="http://www.myfonts.com/fonts/hihretrofonts/art-gothic-hih/" title="http://www.myfonts.com/fonts/hihretrofonts/art-gothic-hih/">http://www.myfonts.com/fonts/hihretrofonts/art-gothic-hih/</a> The reference to 1995 for the URW version refers to when it was digitized for URW.<br>
      Don</p>
