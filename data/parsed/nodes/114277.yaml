  - id: 571951
    user: 17347
    date: 2014-02-21T06:39:00
    date_raw: 21 Feb 2014 — 6:39am
    votes: null
    html: |-
      <p>Fernando,<br>
      I see the point, of course. And I honestly wish you success with this typeface and others to come. But the problem with such huge discounts is, you somewhat give an impression that you’re not entirely confident in your product’s value for money. There has been much debate about this trend: 60% off, 80%off, 90% off … and then? Then we have distroyed our market and made type being held for crap.<br>
      Instead of a panic-discounting you could consider to generally price your packages a bit lower, or to bundle special value packages. Make an introductory discount of 20% or 30% and then keep the normal modest rates, so you will be noted as a serious type supplier – this will help you to establish a fruitful customer relations and generate reasonable revenue over a long time.<br>
       I use this marketing instrument myself, from time to time. If I recall correctly, I did not go beyond 25% so far. Everything else I would feel just bad about, and it actually won’t raise the sales.</p>
      <p>Don’t worry, Rufina is a very handsome typeface, it will find its way and reward you.</p>
      <p>– Greetings from Leipzig.</p>
