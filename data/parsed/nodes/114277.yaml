      <p>Reading the license, I find:</p>
      <blockquote><p>Modifying Font Outline<br>
      The purchaser <strong>is not</strong> allowed to modify or alter the font software without permission. However, under no circumstances may the resulting work be for resale or further distribution.</p></blockquote>
      <p>(emphasis added). But just a little further down</p>
      <blockquote><p>7. Modifying font outlines <strong>is</strong> allowed. (modifying outlines, new signs, alter spacing, change format, etc) only for its own personal or professional use. The purchaser is responsible for securing this data and making sure that unlicensed copies do not leave his/her possession.</p></blockquote>
      <p>I'm confused (easily done).</p>
      <p>Secondly, as I read your font embedding policy, it's OK to embed fonts in a PDF if the font is obfuscated -- just like Adobe &amp; FontFont's policy; unlike the Monotype conglomeration policy. That right?</p>
