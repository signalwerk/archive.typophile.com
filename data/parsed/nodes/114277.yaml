    votes: null
    html: |-
      <p>Martin:<br>
      Thanks, I will tell the type designer about it so he can adjust kerning better.</p>
      <p>Andreas:<br>
      Yes, I know what you mean. But it's just a marketing strategy, this year we decided to live only from type design, so as a new commercial type foundry we have to adapt to the market and what our target is willing to pay. We all know that prices in type design are dropping, but that does not mean that the type designer is winning less money, I think that's the other way around. Now people from more corners of the world are able to buy fonts, due to the lower prices. </p>
      <p>Anyway, I guess that when you have a long and outstanding career in type design and are well established, like: Hoefler &amp; Frere-Jones, Peter Bil'ak, Luc(as) de Groot, etc... you are able to sell your fonts at a higher price and people will buy it happily because they appreciate the difference. But I guess we (Tipotype) are far from it right now. I hope someday we can have the proper economic stability to have the right time to create excellent quality typography. </p>
      <p>Kind regards from Montevideo, Uruguay.</p>
