  html: |-
    <p>This headline and display font seemed pretty easy for me: First I thought it was a Frutiger, but the 'a' does not fit. Then I thought it was Calibri, but Calibri is rounder. Whatthefont did not help either. It seems so obvious and well known and still I have no clue what it is.</p>
