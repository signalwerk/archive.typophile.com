    <p>So not too long ago (past few weeks) I answered yet another font/typeface query from a friend.  He said he wanted something that will do justice to his brand in one letter or less.  I made a rough monochromatic rendering of the glyph by hand, on a 20x30 canvas, using spraypaint and stenciling, took it to their studio, and it was enough to convince them.  Score!</p>
    <p>Can you name the typeface I suggested to them?  It's at the bottom of the page, far left. <a href="http://www.whoisntjohngalt.com" title="http://www.whoisntjohngalt.com">http://www.whoisntjohngalt.com</a></p>
