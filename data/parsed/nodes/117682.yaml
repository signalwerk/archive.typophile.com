    html: |-
      <p>Are you using a commercial printer to print and bind this book? If so, it's a good idea to ask them for a recommendation. They will have experience with what runs well on their press and makes your color images look good.<br>
      In seeking your printer's advice, try to balance opacity with bulk. You want paper that's thick enough to prevent your color images from showing through to the backing page, but thin enough that your 600-page book isn't a cinder block.<br>
      Also ask about the suitability of the stock for the binding process. Some heavily coated papers don't lend themselves to perfect binding, because the adhesive sticks to the coating and not the fibers underneath, making the book prone to crack at the spine.<br>
      Sabine Lenz at <a class="freelinking external" href="http://www.paperspecs.com" rel="nofollow"> PaperSpecs.com</a> may be able to offer additional advice.</p>
