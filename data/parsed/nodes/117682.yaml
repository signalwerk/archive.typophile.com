  html: <p>I'm designing a 600-pg book which will have some color photo galleries but is primarily text. It will be printed on an Indigo. Any suggestions for a good text paper?</p>
  html_clean: <p>I'm designing a 600-pg book which will have some color photo galleries but is primarily text. It will be printed on an Indigo. Any suggestions for a good text paper?</p>
