    html: |-
      <div class="comment-spam-body"><p>The best paper for the Indigo is chemically treated, so that the inks sticks to it better. Ask your printer samples of what "HP Certified Substrates" they have in house. Any certified paper will be great for print, so it will be up to your subjective opinion of what you like - gloss coated, uncoated, matte, synthetic, recycled, etc. Non certified offset printing paper can be used and can be less expensive, but I'd stay away. It is well worth it to avoid the offset paper dust and ink powder.</p>
      </div>
