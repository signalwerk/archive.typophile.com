    html: <p>I don't do much print work anymore (mostly for the web these days), but one suggestion is to talk to your printer. Most printers have house stocks that they can offer good prices on since they buy in bulk, plus they are very familiar with its characteristics. And a good printer should also be able to recommend some higher-end stocks if that's what you're looking for. Obviously photos will look best when printed on coated stock.</p>
