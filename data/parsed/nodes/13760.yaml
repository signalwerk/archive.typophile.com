    <p>I'm looking for a typeface similar to <a href="http://www.houseind.com/include/getimage.php?id=965" rel="nofollow">Corrosion</a> by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>, included in the <a href="http://www.houseind.com/index.php?page=showfont&amp;id=13&amp;subpage=viewfonts" rel="nofollow">Flyer Fonts</a> collection.  I would definately consider purchasing this font if you didn't have to buy the entire collection for $125.  The other fonts are pretty rad as well, but I don't have any use for them at the moment.  This is for a personal project (website) and $125 is over my budget.</p>
    <p>So pretty much I'm looking for an outlined face that is irregular and maybe even rough... scratchy or carved looking, but not too scribbly or childish looking.  Maybe something you might see at Urban Outfitters, but without fake perspective/3-d effect.  Commercial or freeware are both fine.</p>
    <p>Thanks!</p>
