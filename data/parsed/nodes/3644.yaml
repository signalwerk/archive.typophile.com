  html: <p>My first *proper* sans-serif. I have been labouring through the night, driven by a surge of adrenalin brought about by a university acceptance. So here it is... Dent ... at least most of teh characters. s,u,v,w,x,y,z are still to be done in lc. no uc have yet been done. Am I doing everything wrong here? It is basically a fusion of gill, verdana and others. <br> <br><img src="http://www.typophile.com/forums/messages/29/2877.gif" alt="dent"> <br> <br>Matthew</p>
