    html: <p> Very nice start. Reminds me a lot of Bernhardt (Agfa) or Bernhard (Font Company). I think overall your spacing is a little tight. (Although you probably aren't addressing spacing just yet.)  I agree with the remarks made by Jens overall. It looks as if you are designing a monolinear design, but I think the main vertical strokes on all the characters (which have them) would benefit from a little modulation. I'm interested to see your version of UC for this style of face. Post soon? </p>
