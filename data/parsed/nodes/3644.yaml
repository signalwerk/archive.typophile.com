    html: "<p>Hoppla angle yes you are right! Im sorry! I form germany... <br> <br>lets go on: :-) <br>'m' and 's' you saw by yourself... but look where the bowl meet the stem and compare/make it similar to the 'n' (the same to the 'r'). The 's' seems to be mirrored. You can do this I guess but I would try to do something like this: <br>(simulation) <br><img src=\"http://www.typophile.com/forums/messages/29/2884.gif\" alt=\"2xs.gif\"> <br> <br>The width of 'v', 'x' and 'z' is to big, inverse the 'w' is to small. <br>Flavor: the middle stroke of the w maybe have to go up to the x-height <br> <br>The horizontal line of the 'e' need improvement. Also the 'down'bowl as not smooth <br> <br>BTW: Please dont care about the typography name I make, maybe they are wrong.. <br> <br>Greetings Jens <br>BTW: wich university is it where you will go? And wich 'course'?</p>"
