    html: "<p> Hi matthew <br> <br>a good start i would say... <br>Look at the 'c', the width of the bowl is bigger than the bowl of the 'd'. Is it the same stem-width as the. <br> <br>The horizontal stem of the 'f' and 't' is to short in my opinion. BTW: the angel of the 't' down-stroke and the 'f' up-stroke looks very different to the others round shapes. (dont need to be the same... maybe it is only my own flavor) <br> <br>The 'n' needed a little improvement at the left stem. <br> <br>'d' where the bowl go in to the stem looks round at the punch but linear a the outside (hope you understand what i mean) <br> <br>The 'm' is to small <br> <br>okay hope this helps a little <br> <br>Greetings Jens </p>"
