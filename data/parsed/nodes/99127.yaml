    html: <p>LOL, but some letters look really nice, and besides this it would be the same if it was the other way around (i.e. drawing a Latin for an Armenian-only typeface). Unless you have enough cultural preparation and sensibility, you can easily end up doing a superficial work.</p>
  - id: 537481
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 11 Jan 2013 — 11:35am
    date: 2013-01-11T11:35:00
    votes: null
    html: |-
      <blockquote><p>drawing a Latin for an Armenian-only typeface</p></blockquote>
      <p>Which however virtually never happens.</p>
      <p>To me the ideal solution is multi-lateral:<br>
      <a href="http://themicrofoundry.com/ss_rome2.html" title="http://themicrofoundry.com/ss_rome2.html">http://themicrofoundry.com/ss_rome2.html</a><br>
      Complicated? Yes! Life is complicated.</p>
      <blockquote><p>Unless you have enough cultural preparation and sensibility</p></blockquote>
      <p>The sad irony is that most such Latinized abominations are carried out not by jingoistic westerner, but by Armenians!</p>
      <p>Related: <a href="http://armenotype.com/2012/04/archipelago/" title="http://armenotype.com/2012/04/archipelago/">http://armenotype.com/2012/04/archipelago/</a></p>
      <p>And it doesn't help that the computer's copy-paste capability is well-suited to the very Armenian trait of saving effort... :-/  For example in that example the «ն» is a flipped «մ» - nevermind that the ascender ends up pointing the wrong way!  :-(</p>
      <p>hhp</p>
