      <p>Hold on.</p>
      <p>Whether or not AFMs themselves are copyrightable/copyright (I have no idea) will not answer the question, because AFMs are not usually supplied "alone", but as part of a font including other files, notably outlines, which certainly ARE.</p>
      <p>When you "buy" a font, what you actually do is make a contract: you AGREE to do and not to do certain things, and your compliance with that AGREEMENT is a condition of being allowed to use the font. Whether or not the AFM is copyright, if you AGREE not to modify it, then you are contractually obliged not to do so. And if you break that agreement, consequences will follow, including potentially the loss of the licence for those parts of the font that are copyright.</p>
      <p>Suppose, for instance, that the licence said "You agree not to pick your nose. If you do pick your nose your licence to use our outlines terminates." The font-supplier has not inherent right to prevent you picking your nose: hell, it's your nose not his, and normally you are allowed to pick your nose as you please. But if you AGREE not to, and AGREE that if you do your licence to use some outlines will terminate, then if you pick your nose you will no longer be entitled to use the font, and if you do you will be in breach of copyright.</p>
      <p>So you can't answer the question by asking "are AFMs copyright". You have to ask, instead, "Have I agreed in my EULA not to modify AFMs". That will vary from EULA to EULA, but I'd *guess* the answer is often, Yes.</p>
