      <p>AFM files are not copyrightable by the "Copyright Law of the United States".</p>
      <p>In § 101 "Definitions" of the "Copyright Law of the United States" it is defined:</p>
      <p>"Literary works" are works ... expressed in words, numbers, or other verbal or numerical symbols ..."</p>
      <p>AFM files are series of words ("space, exclam, quotedbl...") and series of numbers ("32, 33, 34...").</p>
      <p>Example:</p>
      <p>C 32 ; WX 250 ; N space ; B 0 0 0 0 ;<br>
      C 33 ; WX 333 ; N exclam ; B 93 -12 239 696 ;<br>
      C 34 ; WX 333 ; N quotedbl ; B 40 380 293 696 ;<br>
      C 35 ; WX 500 ; N numbersign ; B 10 0 488 680 ;<br>
      C 36 ; WX 500 ; N dollar ; B 36 -102 464 736 ;<br>
      C 37 ; WX 833 ; N percent ; B 53 -12 779 696 ;<br>
      C 38 ; WX 833 ; N ampersand ; B 36 -16 788 696 ;<br>
      C 39 ; WX 278 ; N quoteright ; B 59 406 219 696 ;<br>
      C 40 ; WX 333 ; N parenleft ; B 22 -194 312 696 ;</p>
      <p>At first glance, AFM files consisting of series of words and numbers seem to be "literary works". But series of words and numbers are not copyrightable and therefore AFM files are not copyrightable literary works.</p>
      <p>Argumentum e contrario (Proof by the opposite)</p>
      <p>1) If the series of words "space, exclam, quotedbl, numbersign..." as contained in the first AFM file published in the 1980s were copyrighted, then any of the thousands of AFM files published in later years would constitute a copyright infringement of the first AFM file published in the 1980s.</p>
      <p>2) If the series of numbers "32, 33, 34, 35..." as contained in the first AFM file published in the 1980s were copyrighted, then any of the thousands of AFM files published in later years would constitute a copyright infringement of the first AFM file published in the 1980s.</p>
      <p>Quod erat demonstrandum</p>
