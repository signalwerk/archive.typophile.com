    <p>Are AFM files protected by EULAs? Are they copyrighted?<br>
    I think I remember people saying they're fair game for<br>
    modification, but...</p>
    <p>Specifically I'm wondering if there's grounds for legal action if<br>
    a contractor provides a client with a "replacement" AFM file for<br>
    a font for which the client has a license. The new AFM file would<br>
    basically be the original one with kerning pairs added (and maybe<br>
    some bounding boxes tweaked), and the client would sub it in.</p>
    <p>hhp</p>
