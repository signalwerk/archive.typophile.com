      <p>I can't speak for anyone else, but the <strong>intent</strong> of the no-mod clause in my EULA is to prevent people from making minor modifications to my fonts (like, just changing the name and the copyright information) and re-selling them; or, in other words, the intent is to prevent theft. However, I have no problem with anyone making modifications for personal use, especially when the modification corrects a situation that I had not anticipated. For example...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/davinci.gif"></div><p></p>
      <p>When I kern my fonts, I look at ALL combinations of uppercase+uppercase, uppercase+lowercase and lowercase+lowercase letters (a total of over 5,400 combinations), but I do <strong>not</strong> look at combinations such as the one depicted above. If a company called daVinci wanted to purchase one of my fonts, is it reasonable for me (or any other foundry, for that matter) to demand that, in absolute deference to a no-mod agreement, the end user should be forced to manually kern every instance of their company name? Wouldn't it be more reasonable for them to make a simple addition to the .afm file (KPX a V -50)? I would certainly suffer no harm, and the end user's life would be a lot easier.</p>
