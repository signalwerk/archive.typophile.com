      <p>Whoa, Paul...you've been spending too much time around barristers and solicitors. There is a big difference between the spirit and the letter of the law. I believe that foundries include no-modification clauses to prevent their work from being pirated, but we are not dealing with piracy here.</p>
      <p>Hrant said nothing about modifying the font: he had issues with spacing and a lack of kerning pairs. Specific, non-destructive improvements for a single user does not, IMHO, constitute a violation of the spirit of a licensing agreement.</p>
