    <p>"Font rights are an issue. (I believe all fonts are born with certain inalienable rights: life, ligatures, and the pursuit of happiness. But I digress.)..."</p>
    <p>-Mike Rankin on "InDesignSecrets.com"<br>
    <a href="http://indesignsecrets.com/tools-of-change-notes-xml-in-practice.php" title="http://indesignsecrets.com/tools-of-change-notes-xml-in-practice.php">http://indesignsecrets.com/tools-of-change-notes-xml-in-practice.php</a></p>
