    html: <p>I had the pleasure of working with Mike Rankin back in the 90s. His unique sense of humor was apparent even then. I still have a cartoon he drew of Yoda working in Quark and declaiming, "Kerning, hah! Tracking, hah! A Jedi craves not these things.!"</p>
