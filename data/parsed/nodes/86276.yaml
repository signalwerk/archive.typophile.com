      <p>You can find the same or almost the same design on the following fonts:</p>
      <p>Lucian BQ - (c) H. BERTHOLD AG 1992<br>
      Luciano - ©1995-2001 Arts &amp; Letters Corporation<br>
      Lucian BT Roman - (c) 1990-1993 Bitstream Inc<br>
      QuartierDemiBold - (c) 1994 Brendel Informatik GmbH<br>
      Belucian DemiBold - (c) 1988 - 1993 The Font Bureau, Inc.</p>
      <p>Based on the horizontal bar of 't' and the shape of upper part of lowers,<br>
      Lucian BQ seems to be the best match for your logo.</p>
