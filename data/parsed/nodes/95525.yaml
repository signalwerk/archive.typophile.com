      <p>Paul:<br>
      "I've recently added the exact behavior..."<br>
      Post on your blog inspired me to explore ccmp and mark/mkmk. Especially ccmp is modestly documented.<br>
      "However, I compiled my fonts using the AFDKO."<br>
      FontForge uses AFDKO syntax, so your fea file was merged without any problems and modifications. Probably every AFDKO feature is supported by FF.<br>
      "(there seems to be a bug in this regard in the default composer)"<br>
      What a pity! There are fonts (yours and Brill by John/Tiro at the very least) and InD does not fully support them.<br>
      Thank you both for your prompt replies.<br>
      regards</p>
