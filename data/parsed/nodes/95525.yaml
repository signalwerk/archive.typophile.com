    html: |-
      <p>Janek,<br>
      I've recently added the exact behavior you're describing to a font family on which I have been working. However, I compiled my fonts using the AFDKO. The resulting fonts have the correct behavior in MS Word (I tested version 10 on XP) and in InDesign CS6 with the World Ready composer applied (there seems to be a bug in this regard in the default composer). Those were the only instances that I tested. I've sent the font off to someone who does Jarai typography in XeLaTeX, I'll post back with his results, if interested.</p>
      <p>Here's my decomposition code in FDK syntax. Note the lookup titled DECOMPOSITION is outside of any feature block and before the  feature. Also beware of the wrapping commented line below:</p>
      <p><code>lookup DECOMPOSITION {<br>
      		sub Ecircumflex by E circumflexcmb;<br>
      		sub ecircumflex by e circumflexcmb;<br>
      		sub Ocircumflex by O circumflexcmb;<br>
      		sub ocircumflex by o circumflexcmb;<br>
      } DECOMPOSITION;</code></p>
      <p><code>feature ccmp { # Glyph Composition / Decomposition</code></p>
      <p><code>	lookup GLYPH_DECOMPOSITION_CONTEXTUAL_2 {<br>
      		#decomposes ecircumflex and ocircumflex forms when followed by combining breve: Jarai language support<br>
      		sub Ecircumflex' lookup DECOMPOSITION brevecmb;<br>
      		sub ecircumflex' lookup DECOMPOSITION brevecmb;<br>
      		sub Ocircumflex' lookup DECOMPOSITION brevecmb;<br>
      		sub ocircumflex' lookup DECOMPOSITION brevecmb;<br>
      	} GLYPH_DECOMPOSITION_CONTEXTUAL_2;</code></p>
      <p><code>} ccmp;<br>
      </code></p>
