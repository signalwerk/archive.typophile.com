  html: |-
    <p>I want to make to operate stacking diacritics, for example ocircumflex with breve above. First way to type it is: ocircumflex + breve, the second: o + circumflex + breve. I made it that way:<br>
    1. ocircumflex is decomposed to o + circumflex<br>
    2. o and circumflex are positioned via mark<br>
    3. circumflex and breve are positioned via mkmk<br>
    So whatever combination you type (o ̂ ̆) or (ô ̆) you get proper stacked letter. It works beautifully in FontForge but to my astonishment only in FF. What is going on? Please help with this enigma.</p>
