    <p>Today I visited a cemetery near me mostly just so I could look at the type that was used on the various gravestones. It was amazing.</p>
    <p>The full collection of pics is over <a class="freelinking external" href="http://www.flickr.com/photos/armorath/sets/72157625322505394/" rel="nofollow">on my Flickr</a> but here are soem samples I thought were especially interesting. </p>
    <p>I noticed a trend for this type of lettering/type that I could not identify, and I think it's quite striking, does anyone know if it has a name?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gravestone_sample_6672.jpg"></div><p></p>
    <p>There was also this one used from 1912 until 1970 on this gravestone - yet the style is quite consistent.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gravestone_sample_2_3637.jpg"></div><p></p>
    <p>And finally, does anyone know what this monogram/symbol means? I saw it quite a lot.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gravestone_sample_3_6309.jpg"></div><p></p>
    <p>There are plenty of more samples and other types of lettering over at the flikr page, so if you're interested, go take a look.</p>
    <p>Cheers!</p>
