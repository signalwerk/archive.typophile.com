  html: <p>From the New York Post <br> <br>Topeka, Kan, is looking for a new slogan. But judging by some of the suggestions that have poured in, officials might want to scrap the idea. <br>Those unlikely to win approval include "City of Morons", "Topeka, you won't get a lot of unwanted relatives visiting you", and "Topeka � not as bad as you think". <br>"(Having) no slogan is better than (having) a bad one". said Stephanie Wallingford of the city's Convention and Visitors Bureau. "Maybe we don't use one".</p>
  html_clean: <p>From the New York Post <br> <br>Topeka, Kan, is looking for a new slogan. But judging by some of the suggestions that have poured in, officials might want to scrap the idea. <br>Those unlikely to win approval include "City of Morons", "Topeka, you won't get a lot of unwanted relatives visiting you", and "Topeka � not as bad as you think". <br>"(Having) no slogan is better than (having) a bad one". said Stephanie Wallingford of the city's Convention and Visitors Bureau. "Maybe we don't use one".</p>
