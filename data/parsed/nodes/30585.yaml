    <p>All cliches aside, im designing an identity and webpage for a company by the name of<br>
    "Focused Web". A quick background. . . A small Web Design and SEO/SEM marketing company based out of Truckee CA. </p>
    <p>Their site is old and they have never worked on their identity or website. They are pushing the company towards a new Active Content web page management system, following similiar parrallels to various forms of web 2.0 user contributed content. </p>
    <p>They want to look like one of the new cliche web 2.0 companies. Whilst I will also come up with a more unique solution. . . I have the following question. . . </p>
    <p>Is there any serifed, slab, or script that might work in conjunction with Vag Rounded, or the new Gotham Rounded. </p>
    <p>Other points. . . they want to incorporate their initials as either a mark, or typographic mark. Ill post a few roughs shortly if anyone cares to take a look.</p>
    <p>Cheers</p>
    <p>(you can see their existing identity and site at <a href="http://www.focusedweb.com" title="http://www.focusedweb.com">http://www.focusedweb.com</a></p>
    <p>~James</p>
