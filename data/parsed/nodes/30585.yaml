      <p>I'm not sure about the 'f' behind the globe - it makes me think of some sort of TV news station from the 1970s. I don't think the typeface choice (of the 'f') fits with the Web 2.0 look.</p>
      <p>However, the globe is a nice update from their old Web 1.0 logo.</p>
      <p>Remember, for Web 2.0:<br>
      -Everything made from candy (well done in your first two logos)<br>
      -No capital letters (to promote "friendliness")<br>
      -Rounded terminals (you're close on this one)<br>
      -Bright fruit-like colours (again, your blue is nice - maybe throw in some orange or lime or grape)</p>
      <p>So while your logos have that Web 2.0 look, I think you could take it even further :)</p>
      <p> - Lex</p>
