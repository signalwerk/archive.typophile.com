    html: <p> Q problem - perhaps the spike darts out from the center and not on the side. i.e. instead of it being a crazy serif its actually involved in the letterform. <br> <br>with the roundy knobs version replace spike for roundy knob facing up. <br> <br>Grundgy Q is just fine - you've utilized the corner shape consistently such as G, S R, 5 and 6. but I think you forgot to break off the stroke on the R...the rest do. <br> <br>X - umm, perhaps use up the full grid there and make the 2 splits along the same lines as your O - you'll get a nice mini x in the middle eh? </p>
