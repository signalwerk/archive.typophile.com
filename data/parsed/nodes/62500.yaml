    <p>Okay, so I recently received an email from someone who found a font for sale on a website that is not identical to, but clearly based off of, my freeware font clementine sketch.</p>
    <p>Here is my font:<br>
    <a href="https://web.archive.org/web/20150123131951/http://www.dafont.com/Clementine-Sketch.font" title="http://www.dafont.com/Clementine-Sketch.font">http://www.dafont.com/Clementine-Sketch.font</a></p>
    <p>And here's the knock-off:<br>
    <a href="https://web.archive.org/web/20150123131951/http://www.scrapnfonts.com/searchdetail.php?psku=12384" title="http://www.scrapnfonts.com/searchdetail.php?psku=12384">http://www.scrapnfonts.com/searchdetail.php?psku=12384</a></p>
    <p>I've contacted the people in charge of the website, but of course they are insisting that the two fonts just happen to be similar -- and since the font IS redrawn and not identical to mine, they're just taking advantage of the loophole in the copyright laws governing fonts. So I'm not sure if there's anything I can do.. It just pisses me off that someone is profiting off of an ugly version of a font that I'm offering as freeware. (And then refusing to even admit that it's a knock off.) </p>
    <p>Is there anything that I can do in this situation?<br>
    Thanks for any help.</p>
    <p>-Teagan White<br>
    <a href="https://web.archive.org/web/20150123131951/http://www.teaganwhite.com/" title="www.teaganwhite.com">www.teaganwhite.com</a></p>
