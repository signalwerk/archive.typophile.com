      <p>I find it particularly awesome that the original is free-of-charge and the knock-off is not. I'd totally help you tell everyone that that site is lame for charging for a knock-off of your free font, and it would probably make yours more popular. Twitter may work.</p>
      <p>That said, I think theirs has many differences from yours. While most of these seem like horrible butchering in order to claim it's different, I'd want more proof that it's indeed a rip-off before spreading the information and in order to convince others.</p>
