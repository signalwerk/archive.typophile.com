      <p>In terms of more proof -- Can't give you anything concrete, since the website owners are trying to deny that it's a knock-off. But, here's what they say about getting the font to work correctly:</p>
      <p>"To get just the right effect with this font, start each word with a capital letter (it will be a lowercase letter with the left side of the outline capped off) and end each word with the right bracket, ]. Try it! It's an Awesome] Font]!"</p>
      <p>...Pretty sure I invented that, except mine uses the ^ symbol instead of a bracket.</p>
