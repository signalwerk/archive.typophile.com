  html: |-
    <p>Hello All,</p>
    <p>I have a project designing instruction sheets for a mid-sized company. They exist in the PC world and are not interested in purchasing any fonts. As a matter of fact, the company Logotype is set in Univers 67 which causes them some problems because they do not have the font. So using the Univers family is out. When I asked what do they have, so I can know my choices, they told me they mostly use Arial. My question is what are the typical fonts pre-installed on PCs? and of those which would you recommend? The instruction sheets have a fair amount of running text and there is a hierarchy of heads and subheads.</p>
    <p>I welcome any and all input.</p>
    <p>Kirsten</p>
