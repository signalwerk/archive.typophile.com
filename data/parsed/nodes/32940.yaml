    html: <p>Thank you both for responding. As I was looking at the list, I also thought Franklin Gothic could be a good choice. However do you think it is suitable for paragraphs of text? I'm also concerned that there is only one weight available (plus an ital). Should I look for a serif and use Franklin Gothic for heads?</p>
