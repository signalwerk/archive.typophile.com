      <p>From the point of view of someone who works for a publisher: I think it highly unlikely that they are going to set it directly in Word. But publishers do need to do a lot of batting manuscripts about internally for various production processes before they get given to the typesetters to import into whatever system they're using. And it's at these early stages that they need submitted files to be in Word, so that <em>everybody</em> involved can open them up and do whatever they need to (be it editing or simply extracting information for their production workflow databases), and they don't want to have to be able to deal with loads of different file types from authors of different backgrounds, interests and levels of technical/typographical competence. </p>
      <p>If you got the "suggestion that they would indeed just use that to send to a printer", then probably either (a) the person you told you that didn't know the internal processes very well, or (b) they simplified what they told you because they're more used to dealing with dippy authors than savvy ones.<br>
      ______________________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
