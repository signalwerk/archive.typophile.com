    html: <p>I think it is at least possible that you and the publisher are misunderstanding each other. My publisher did all the editing in Word (I used Pages, but made sure to export to Word every time I sent them a new iteration). Then they set the layout in regular page-layout software. I would get to final text, then see what the page layouts they run by you are actually like. You could also ask that they use a certain designer (subject to their approving of the design), and if that designer is one of your friends, you would naturally have a lot of input. The friend could even act as nothing more than a front for you, and your design ideas! Anyway, don't panic yet.</p>
