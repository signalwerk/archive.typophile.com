      <p>Thought 1. What does your contract say? If you can insert something into the paper work along the lines of getting approval of final output you could be onto a winner - keep rejecting their PDFs until they meet your standards - eventually they'll either meet your standard or they'll cave and let you design it. </p>
      <p>Thought 2. “Yesterday I sent one particular publisher’s editor.” Well, editors like to be able to, er edit. Word is a pretty good tool for editing – PDF, InDesign, XPress not so much.</p>
