    html: |-
      <p>Hi Nick,</p>
      <p>Ok, I see your point…</p>
      <p>Layout would vary but mostly A5/Octavo or smaller. </p>
      <p>Dictionaries are always printed on relatively thin, moderately absorbent papers, so the typeface would need to account for some ink squash, maybe with built in ink traps, and pared counter and apertures. </p>
      <p>I love the "Extroversion" of Whitney by H&amp;FJ, meaning headwords would be cohesive in a tightly packed environment. </p>
      <p>Beyond this, there are all the usual requirements for a small font size and its condensed nature: enlarging the x-height to retain clarity and legibility, and at the same time, ascenders and descenders need to be kept relatively short to facilitate the tight leading required. </p>
      <p>Thanks</p>
