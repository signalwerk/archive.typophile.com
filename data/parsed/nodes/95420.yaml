      <div class="comment-spam-body"><blockquote><p>Nonetheless, it does seem a bit vague when asking for typeface recommendations, to merely mention a genre of content, without reference to layout or medium.</p></blockquote>
      <p>It would be if you need a typeface for a specific project. As an open question I feel all the information was implied. If it didn't concern print I'm sure it would have been mentioned. Other than that, I don't think there are wildly different standards when it comes to dictionaries, are there? I think it's implied that you would need a pretty sturdy serif typeface with a relatively large x-height and unlike newspaper typefaces it shouldn't be too condensed or have a high contrast. If I were to ask for good newspaper typefaces, would you also need to know specifics or would you start naming newspaper typefaces you now will work well? Newspaper typefaces in general seem very typical.</p>
      <blockquote><p>Basically, you’re conﬁning yourself to cliché, and thinking inside a very small box.</p></blockquote>
      <p>Doesn't that describe a dictionary though? I'm all for innovation, but a dictionary doesn't seem to be the kind of medium where you can go wild. Perhaps I'm being narrow-minded, but can anyone give examples where something truly different has been done in a respectable dictionary?</p>
      <p>I would just like to name two typefaces I know were specifically designed with use for dictionaries in mind. Lexicon was designed to be used in the Dutch Van Dale dictionaries and Skolar is a sturdy typeface made for academic publications and dictionaries. Both typefaces have been designed to work well at small sizes.</p>
      </div>
