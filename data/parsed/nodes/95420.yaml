    <p>Hi,</p>
    <p>I've been doing some research into what's best out there at the moment and thought I'd open it up to discussion<br>
    Ideally, the typefaces would be complimenting serif and sans serif in a large variety of weights, including condensed for the sans. They would have international character sets and perhaps phonetic characters. </p>
    <p>My current favorite are (together) Mercury and Whitney by Hoefler and Frere-Jones… simply wonderful. </p>
    <p>Any suggestions/comments??</p>
