      <p>Catich is indeed the author you want on this.</p>
      <p>Daniel, if you make a Trajan, consider:<br>
      1) Having a "V" in place of the "U" (or if that's too much for you, do give the "U" the two full stems).<br>
      2) Putting that little triangle thing in the blank space.<br>
      3) Not including severely out-of-character characters, like the "@". This would make the font less versatile, but that's the point: it would also make it hold its character better over time/usage. The fact that Adobe Trajan is too versatile causes it to be used by the likes of ISUZU, ruining its focus for everybody else.<br>
      4) Calling it Imperium. Or IMPERIVM.  :-)</p>
      <p>We have enough transvestite Trajans - give us something useful in its difference/authenticity.</p>
      <p>hhp</p>
