      <p>Clint, that stance is even more ideological than mine! And this really has nothing to do with any pedantic historical accuracy (I certainly can't be accused of that! :-) it has to do with perception, and its judicious leveraging.</p>
      <p>Adults help children do the right thing (because of their experience and knowledge), and everybody is childlike in some contexts. Users need our help (because of our experience and knowledge) whether they realize/admit it or not. This is why Adobe InDesign does not allow fake bold for example.</p>
      <p>On top of that, there's actually self-interest involved too. Just because you can sell more copies of a font for the first year because it's more "versatile" doesn't make it smart to sacrifice its long-term viability, which can only come from its <em>focus</em>. Why do you think Trajan has become a parody of itself, and most intelligent graphic designers avoid it?</p>
      <p>Chris: we are all responsible for the <em>results</em>.</p>
      <p>hhp</p>
