      <p>Then there's the C and G... But I actually wouldn't link those decisions too strongly, because there are a number of factors at play, and historical authenticity isn't everything (even assuming it can be adequately defined here). One factor is that of chronology, and exactly when the U, J and G were introduced, and by whom; another is that of potential ambiguities in actual names and words, and where you want to draw the line; a third is what people <cite>think</cite> is authentically Roman (and this is where I think the V/U stands out much more than the other two pairs). You can make the decision to limit the versatility of a font (not out of hooliganism, but out of a hope of helping it maintain its focus) but you can still worry about how it might be used (which is still the point of a font, in the end). For example, BVLGARI works, but IVICY wouldn't.  :-)</p>
      <p>hhp</p>
