      <p><em>&lt;note&gt;</em>Because I intend to use some irony in this posting, and contributors to this forum (including myself) sometimes have difficulty in distinguishing between ironic and serious comments, I’ve labeled the various sections to identify my intentions.<em>&lt;/note&gt;</em></p>
      <p><em>&lt;irony&gt;</em>Since font users can’t be trusted to use historically-based fonts appropriately, more needs to be done than just to eliminate historically-inaccurate glyphs (such as U, J, and @). Clearly, users should not be allowed to use historically-based fonts for anachronistic text. For example, when using Imperivm (or similar Trajan based fonts) copy such as TRIVMPHAL ARCH should be allowed, but the open-type font software should screen for and block text such as IVICY FRVIT GVM.<em>&lt;/irony&gt;</em></p>
      <p><em>&lt;deeper irony&gt;</em>On second thought, for true historical accuracy, the Imperivm font should only allow text in Latin. Any other language would clearly be anachronistic.<em>&lt;/deeper irony&gt;</em></p>
      <p><em>&lt;serious comment&gt;</em>The advocates of historically-accurate font use, need to keep in mind that the users of Imperivm (and similar fonts) are NOT in ancient Rome craving the glyphs in stone -- they are using them on paper and electronic devices worldwide in the 21st century, so there is already a built-in anachronism in the use of these fonts. Users should be permitted to use the fonts however they please (whether we like the results or not). All fonts ought to be available with the widest possible set of glyphs (including the dreaded @).<em>&lt;/serious comment&gt;</em></p>
      <p><em>&lt;postscript&gt;</em>Dan, what’s the status of Imperivm? Any samples you could post? <em>&lt;/postscript&gt;</em><br>
      &nbsp;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;~~~~~~~~~~~~~~~~~<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>When going from </em>A to Z,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>I often end up </em>At Oz.</p>
