      <p>&gt; all you have to do is type them that way.</p>
      <p>Of course there's a truth in that, but there's also a danger, the one that I mentioned: the more you facilitate some people's use of the font in a way contrary to its "ideal" character*, the more they'll ruin it for everybody, because the font's associations become diluted in the public eye. On the other hand, having neither a "U", "J" nor a "C" could be said to be too puritanical, too limiting. So maybe a good compromise would be to default in the "archaic spelling" using OT and allow the user to revert to the "Modern" characters, but only proactively.</p>
      <p>* I know this seems like a fascist attitude, and I'm all for being nicely surprised by unexpected usage, but I think this really is essentially a matter of long-term functionality. The key thing to me is that we already have highly (too?) versatile Trajan-style fonts, and Dan would be contributing more by being different.</p>
      <p>&gt; But still, no @ sign.</p>
      <p>Whew.</p>
