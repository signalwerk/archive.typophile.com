      <p>Dan, if you don't have a copy of Edward Johnston's 'Writing, Lettering and Illuminating' you should have.</p>
      <p>Otherwise try hunting through the libraries (you can get 'em back on time, honest) and secondhand bookshops near you. Almost all of the lettering books for commercial artists and signwriters from the first half of the 20thC contained at least one version of the authors' take on the Trajan lettering. My own favourite would be p.29 of 'The Art of Lettering' by Geoffrey Mott, but this material is very commonplace and for less than $20, cheap.</p>
