      <p><em>Anything else?</em></p>
      <p>It wd be gd to compile a std set of abbrev.s for Engl and code it in.<br>
      In Tim's sample, it lks like whenev. they forgot a letr they just went bk and put a line next door II where it shd have been.</p>
      <p>We use Mr, etc. in the same way that IMP was used (Imperator) in Marc's example, but we don't put a "macron" over them. </p>
      <p>But seriously...Roman inscriptions had lots of abbreviations, because Trajanus hisselfus had a heck of a title, for one reason, and it helped justification, for another. And made for less work for the carver (paid by the word?). If the same principle were applied and fontized, a model would perhaps be 18th or 19th century correspondence, where writers used a kind of shorthand to speed up writing -- or when the end of a line is getting near and it doesn't look like all your words will fit. Another model would be texting today, but perhaps too anachronistic for a Trajan?</p>
