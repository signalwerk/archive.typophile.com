      <p>There have been occasions when it was not convenient to find a hammer and I have hammered a tack with a pair of pliers. Their have been cases where I had a pair of scissors handy but preferred to tare the paper by hand. Type is a tool to be used. It can be used badly or quite well, we do not or even should not exclude misuse by those who purchased the tool. Type is not a dangerous weapon like explosives which needs strict regulation. Cast your bread upon the waters but know some of it will sink to the bottom.</p>
