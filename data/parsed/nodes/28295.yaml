      <p><cite> Users should be permitted to use the fonts however they please (whether we like the results or not). </cite><br>
      If you allow me, that's my own decision as a designer. If I produce a work, I decide how it functions, and I reflect upon its use with my own choices as a designer and "page planner" in mind.<br>
      Whether people will use it according to the functions of its "organism", it depends on how I (as its designer) decide to sell or make it available. It's clear that freedom is largely perceived in an absolute value, but we do not live on an absolute plane, since we have to deal with the sensibility of our fellow men.<br>
      So, you will agree that I may propose an intended usage out of assumed expectations, even if this exludes an "@" sign, if this is my cultural intention.</p>
