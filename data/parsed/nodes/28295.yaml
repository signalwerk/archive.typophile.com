    <p>I've decided that as part of my typophilic education I need to make my own version of the Roman letters on Trajan's column. </p>
    <p>Only one problem.</p>
    <p>Anyone have a copy of them? I've been hunting all over for a good photograph or rubbing or book specimen or anything. No luck. I bet I could find something, maybe, at the Library, but they don't like me because I keep books for too long ;(</p>
    <p>Does anyone know of a good book with specimens to look for? Or does anyone have available a high res image or images?</p>
    <p>I appreciate it advance by the way. Anything you can do will help.</p>
