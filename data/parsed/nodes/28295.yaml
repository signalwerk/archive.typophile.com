      <p>Look at them ligs! How cool would it be to have a Roman font with extensive ligatures? As in, more ligatures than you could shake a stick at? </p>
      <p>So here's the checklist for IMPERIVM, the Ultimate Roman:<br>
      1) Having a “V” in place of the “U”.<br>
      2) Putting that little triangle thing in the blank space.<br>
      3) Not including severely out-of-character characters, like the “@”.<br>
      4) OpenType coding that converts numbers into roman numerals.<br>
      5) Lots of options so repeat characters are rarer.<br>
      6) Ligatures, and keep them coming.<br>
      7) Possibly different weights representing various states of erosion from freshly brushed, to finely chiseled, to well-worn, to acid-rain.</p>
      <p>Anything else?</p>
