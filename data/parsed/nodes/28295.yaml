    html: |-
      <p>There would be two "distress" aspects to doing a font based on lapidary inscriptions.<br>
      First would be the original uneven execution of the letter carvings -- they were painted on by brush first, with that process producing irregularity in form, as did the subsequent carving, which was interpretive (even if it was done by the same artist -- which we will never know).<br>
      Secondly, the effect of centuries of weather (on outdoor inscriptions).</p>
    html_clean: |-
