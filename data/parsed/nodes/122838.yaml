  html: |-
    <p>Hi<br>
    I adjusted the mark positioning lookup for my Arabic opentype font in VOLT. The shipped font works correctly in most applications in Mac, PC and ioS8 . However I discovered a case where problems occur:  When exporting from Word 2013 to PDF the  vertical mark positions are not adjusted at all, and they stay in their default positions. This does not occur in a font like Arial, as seen to the bottom of the illustration.<br>
    Any suggestions to solve this welcome<br>
    vladimir</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/image_241.jpg" width="1888" height="1177" alt="">
