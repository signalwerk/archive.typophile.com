  html: |-
    <p>Hello!</p>
    <p>I have long lists in the format of</p>
    <p><strong>[word] [normal space] [more words]</strong></p>
    <p>Now it would be great if I could format it automatically into:</p>
    <p><strong>[word in bold] [n-space] [more words]</strong></p>
    <p>I can get the nested style sheet to change the first word to bold, but how can I change the normal space to a ’n-space’?</p>
    <p>I could of course do a normal find&amp;replace but then there are so many normal spaces that don’t need to be changed, that it does not make much sense. Can nested style sheets solve this problem?</p>
    <p>Thanks for your help!</p>
