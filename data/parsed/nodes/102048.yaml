    <p><strong>The Look of Sound: Marketing, products and technology in the American record industry, 1888-1967<br>
    By Nick Shinn<strong></strong></strong></p>
    <p>TYPO San Francisco 2013, April 11</p>
    <p>An investigation into how new media creates voids that take shape as they suck up content, and how—against the grain of technological determinism—marketing and design inﬂuence the cultural formats that emerge. Three innovations are examined: the 78 rpm disc in 1898, the LP in 1948, and stereo in 1958.</p>
    <p>This talk will be accompanied by illustrations of records and record players, branding, advertising, collateral and packaging (album covers), with contemporary sound clips.</p>
    <p><em>A couple of “slides” to whet your appetite:</em><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/BGinHiFi_4367.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ColorTV_5994.png"></div><p></p>
