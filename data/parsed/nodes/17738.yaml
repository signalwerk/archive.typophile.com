      <p><em>The Lino-Lions - Hudson &amp; Zapf</em><br>
      ...<br>
      <em>Twardoch &amp; Zapf, surely.</em></p>
      <p>Si was probably thinking of the Apple AAT version of Zapfino, which Ross and I produced. Adam was responsible for the OT version with its clever pseudo-random stuff. Of course, no mention of either current version of Zapfino should exclude Akira Kobayashi, who worked on the design revision with Hermann.</p>
      <p>If I were to form an OT team for Si’s list, I think it would have to be the Hebrew Hounds with Ralph Hancock, or maybe the Torah Tigers. All this fancy Latin display typography is a nice light pre-season workout, but I really don’t think you’ve broken a sweat if the game doesn’t require additions to Unicode, changes to the way VOLT works, changes to the way Uniscribe works, and six months in the locker room listening to people shout about why Phoenician is or is not the same thing as Hebrew.<br>
      _</p>
      <p>Anyway, kudos indeed to Tal, and congratulations to whoever won that silly game with all the padding. I leave you with <a href="http://gvod.blogspot.com/2006/02/rugby-tackles-ouch.html">a real sport</a>. Oh my goodness, they’re not wearing helmets! Somebody stop them before someone gets hurt!</p>
