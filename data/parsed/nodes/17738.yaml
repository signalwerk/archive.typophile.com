      <p><cite>Why are there so many composite glyphs in Ed Interloc? Wouldn’t it have been more logical to have separate sets of “left” and “right” glyph components,  and construct the “ligatures” from these on the fly?</cite></p>
      <p>Not really. That would be the logical approach if all the letterforms had uniform widths, but that’s not the case. For example, the <strong>I</strong> doesn’t occupy the same width as the <strong>O</strong>. So the <strong>M</strong> in a <strong>MI</strong> ligature must be different from the <strong>M</strong> in a <strong>MO</strong> ligature. As Ken worked through the task of drawing all 1,400 ligatures, he would adjust forms as needed to make each individual ligature look perfect. Automatically assembled ligatures would not have had that same attention to detail and the organic qualities of the face would have been lost. In cases like this, automation always yields to aesthetics.</p>
      <p>Because the decision was made to hand build all the ligatures, we never really looked into assembling them on the fly. I have some ideas about how that could be done with a combination of contextual lookups, kerning and <em>lots</em> of alternate glyphs, but it would be a big can of worms.</p>
    html_clean: |-
