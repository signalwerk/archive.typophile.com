    <p>Elk Grove Village, IL -- July 13, 2010 -- Ascender Corporation is pleased to announce that the Canada Type font design studio has come to a font distribution agreement with Ascender.</p>
    <p>Rebecca Alaccari and Patrick Griffin founded the Toronto-based Canada Type back in early 2004. Since its establishment, Canada Type has created a variety of high-quality typefaces popular with design professionals and creative enthusiasts. The Canada Type fonts have appeared on everything from large corporate projects to small personal design work.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CanadaType-PR-01_6718.jpg"></div><p></p>
    <p>“We don’t believe people should have to choose between quality and creativity when choosing a font,” said Griffin, co-founder of Canada Type. “We feel Ascender shares this belief. It is reflected in their passion for creating and licensing high quality, innovative typefaces. We look forward to seeing where Ascender can take our font collection.”</p>
    <p>The Canada Type font collection will add a number of enhanced versions of historical typefaces and expertly-designed original fonts to Ascender’s diverse collection of fonts. This includes an impressive lineup of popular script fonts and a variety of exclusive psychedelic fonts from the ‘60s and ‘70s. The Canada Type fonts are available in both TrueType and OpenType formats and can be found on the Ascender Fonts website. For more information or to view the fonts visit: <a href="http://www.ascenderfonts.com/foundry/canada-type/" title="http://www.ascenderfonts.com/foundry/canada-type/">http://www.ascenderfonts.com/foundry/canada-type/</a></p>
    <p>Ascender is also proud to offer the Canada Type fonts to its broad range of OEM/ISV customers including video game and Blu-ray publishers, software developers, web server application developers, and hardware manufacturers.</p>
    <p>About Ascender<br>
    Ascender Corporation is a leading provider of advanced font products. Ascender’s founders are font industry experts and have been involved in developing many of the most important and influential fonts used in computers, mobile devices, consumer electronics and software products. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises, software developers and hardware manufacturers. Ascender also provides an extensive collection of TrueType &amp; OpenType fonts for download to graphic designers and consumers through its font websites, including <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a></p>
    <p>Contact: Bill Davis, Vice President<br>
