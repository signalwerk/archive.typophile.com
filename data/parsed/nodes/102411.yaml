    <p>Hello guys, could you please help me identify these two sans fonts? First in "MARKET" and then in "Pila Lidecko".</p>
    <p>These are parts of a logotype for a local groceries in Southern Moravia for which an unknown designer used these two fonts to easily define their basic CID elements.</p>
    <p>I am supposed to work with it further but am unable to define these fonts using both my knowledge and known online sources (what-the-font etc.).</p>
    <p>Thank you very much for you time and effort. Greatly appreciated in advance :-)</p>
