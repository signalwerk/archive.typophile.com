    <p></p><div class="imageWrap"><img src="/files/pentapus_draft1_5370.jpg"></div><p></p>
    <p>I am attempting to rework the personal identity I started when I made this site <a href="http://www.pentapus.net" title="http://www.pentapus.net">http://www.pentapus.net</a></p>
    <p>The site itself needs to be redone completely after 3 years but I want to start with a solid type based logo. I looked at several heavy display faces*. I am hoping for a modern take on a blackletter/gothic/serif face**.</p>
    <p>Any help would be great especially nit picking</p>
    <p>*the godfather logo<br>
    ** S’s  are hard</p>
