    html: <p>I'm not sure anybody wants to hear about my process, because I haven't actually released anything yet, but here goes. <br> <br>Almost all of my fonts in the <a href="http://levien.com/type/myfonts/">pipeline</a> are digitizations of existing faces, primarily from the ATF catalog. <br> <br>The first step in the process is to make extremely  high quality scans. I'm fortunate to have an Epson 4870 for other work. I usually scan at 2400 dpi and save as JPEG with quality 90. The resulting files are around 40M per page, and are thus a bit cumbersome to work with, but I figure I'm not losing much. <br> <br>Next I decide which font size is going to be considered the "master". All these fonts are optically scaled, so there is a very significant difference between a 12pt text showing and the same font in display at 48pt. Often, I'm able to make an educated guess as to which size was the original master; for example, for Century Catalogue and Bodoni Book, I'm pretty sure it's 18pt. <br> <br>I then take a careful series of measurements, largely to understand the inner logic of the optical scaling. If I do this right, then I get a set of scaling parameters I can use to make the images of any size line up with the master. Of course, enlarging small sizes won't have the same quality as working from larger masters, and the corners in particular can get pretty beaten up, but I think it works. The Century Catalog is drawn from originals ranging all the way from 12pt to 36pt, and I feel like I've mostly evened out the inconsistencies. <br> <br>To start work on an individual glyph, I start by choosing one or more exemplars. This is actually one of the toughest parts, as the printing quality can vary widely between the different samples of the same font, especially if there are differences in paper. <br> <br>There's a new trick I usually use these days, which is to carefully align multiple scans of the same letter, then average them together. Currently, I do this by hand in the Gimp, but I expect I will write a tool to automate this for me. It's labor intensive, but the results can be striking. <br> <br>When I finally get an image, I start tracing. Most of the fonts are done in FontForge, but I've just now started using my prototype Cornu spline based curve editor. However, that tool is lacking much functionality, so I'll probably be stuck moving the outlines into FontForge for a while to make them into a real font. <br> <br>I spend a lot of time nudging the outlines until I get the curvature to look just right. I usually make test prints, both at the size of the original so I can compare them, and at around 200pt so I can audit for problems. I have become somewhat fanatical about matching the original. For example, I invite anyone with a 1929 Centaur specimen booklet to compare the 72pt printed metal with <a href="http://casper.ghostscript.com/~raph/centaur-test.pdf">my draft</a>. I'm inclined to soften the points on the 'a', and make the stroke on the 'e' heavier, but both of these quirks can be found in the original. <br> <br>I do not tend to cut and paste a lot. Most of the fonts I'm tracing have enough individual variation that copying doesn't really save time. <br> <br>The last step is the spacing. Most of the fonts in my pipeline need a lot more work on this. I have been doing it pretty much by seat-of-the-pants, but I expect to be following the procedure outlined in Chapter 10 of Tracy's "Letters of Credit". <br> <br>Now maybe one of the great designers can weigh in. Heck, I'll settle for a good one :<a href="http://rotten.com/"></a>)</p>
