    votes: null
    html: "<p>Unless I'm digitizing an existing face, I start with lots of sketches and doodles. Nothing very finished-looking usually, and I often use lined paper (legal pads) or graph paper. At some point, I have a solid idea in my head what the font looks like (or ideally looks like) from doing the doodles and sketches.  <br> <br>Then I start working directly in FontLab, sometimes putting scans of the sketches in the background as a reference. I generally don't literally trace the scans, but they are a big help in getting proportions correct. Plus it helps psychologically not to have to start from a blank screen and to have some concrete idea what I'm shooting for. I am capable of doing very tight drawings--my early lettering work was all ink on board--but I find it much more efficient and flexible to do the tight stuff on the computer screen. The sketches are really more like visual notes than artwork. <br> <br>I worked in Fontographer for years using Illustrator for drawing, and then copying and pasting between them. This was mainly because I disliked Fontographer's drawing environment. I'll second Eric's advice to draw directly in the font program. Since I started doing it, I can't believe how much more efficient it is. (And thanks to Eric and some others for encouraging me to give it a try. I used to be so hung up on the difficulties of moving art from Illustrator to FontLab, it kept me from dumping Fontographer for years.) <br> <br>Oh, and for the record, I was born in 1955 and started using a computer to design type in 1985 (Fontographer 1.0!) after trying to do it on paper since the mid-seventies. (Although I did <a href=\"http://www.marksimonson.com/article/43/my-first-computer-font\" target=\"_blank\">dabble a bit</a> in screen font design before 1985.) <br> <br>BTW, Raph: I like your taste in the fonts you chose to revive.</p>"
