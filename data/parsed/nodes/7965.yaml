    html: <p>As pointed out above, we all tend to go about this in different ways. <br> <br>I draw exclusively in FontLab with a Wacom tablet. I say exclusively <br>because it's important to avoid the Illustrator/Freehand route. I know, <br>I know. Some of you will have a beef with this, but it's a terrible habit <br>that only leads to sloppy outlines and even worse interpolations. <br> <br>When I'm stuck, I use any number of broad nibbed pens that I keep <br>around to work out the logic of forms. Most often the italics. Any  <br>sketching I do is usually very rough and I can't remember ever using <br>a scanner to start an outline. <br> <br>As for the age connection, I was born in 1974 and had my first <br>Mac around '84. I think my elementary school had computers by <br>around 1980 or so?</p>
