    html: <p>Fontographer is not capable of producing what is today an "ideal end result." FontLab on the other hand probably doesn't produce results with "a minimum of fuss," either. DTL FontMaster is rather expensive, placing it beyond the reach of most hobbiests and folks just getting started. <br> <br>Overall, I'd suggest getting FontLab, or getting TypeTool if you can't afford FontLab. <br> <br>Beyond that, what John said. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Particularly about the design process. <br> <br>For myself, I fundamentally design in my head. I may make some sketches and such to clarify my ideas, but I don't actually bother scanning these in. Like John I tend to then sit down and work directly on the computer. <br> <br>I have noticed that *on average* the question of how one approaches design is a function of age and background. Type designers who were born before 1960 and/or have significant calligraphy or hand-lettering background almost all tend to draw things out pretty carefully first and digitize later (perhaps much later). Of type designers born in 1970 or later, without any hand-lettering background, many work directly on the computer without starting a design in analog form. <br> <br>Cheers, <br> <br>T</p>
