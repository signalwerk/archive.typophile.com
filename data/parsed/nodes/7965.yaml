    votes: null
    html: <p>Mine is a somewhat confused process... <br> <br>I was born in '75 but studied architectural drafting fairly extensively; There's no way I could ever draw an entire typeface on paper (I wish I could though), instead I've found myself using a technique where I'll draw (on paper) two or three or four "key" glyphs, scan them, put them as a background in FontLab, and simply manual trace from there.  At that point (and after some polishing of the shape in FontLab) I can interpolate the shapes I want in the other characters from the shapes I drew and scanned. <br> <br>This works for me, and I find it very relaxing and meditative (nothing beats seeing those smooth-as-silk vectors take their place over that rough bitmap ghost). <br> <br>I've been doing something kinda wacky lately, too.  I'll photocopy-magnify my handwritten (ballpoint and broadnib pens) glyphs, polish them up with a black marker and a whiteout pen, scan them, and do the routine that I laid out above. <br> <br>Again, it works for me, but we're all different.</p>
