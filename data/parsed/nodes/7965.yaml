    html: "<p>Noah, I strongly recommend that you forget about Fontographer. It simply is not worth learning this I suggest that you either start with TypeTool (the cheaper, stripped down version of FontLab) or go direct to FontLab. (You could also download the demo of DTL FontMaster, in case this appeals to you more.) I recommend getting a copy of Leslie Cabarga's <i><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0965762858\">Learn FontLab Fast</a>,</i> which will make learning to use FontLab much easier. <br> <br>You'll find that different type designers have different approaches to the design process, and also that processes might vary depending on the typeface itself. For instance, I do almost all my work directly in FontLab, with very little drawing on paper, while some other designers always do quite detailed drawings. If I do drawings on paper, they tend to be quite rough, and are just to help me get possible shapes clear in my head.* <br> <br>If you are going to start your design on paper, which is a good idea when you are beginning, do not feel that you need to produce high quality, 'finished' artwork. It is nice to look at lovely outline or inked drawings by great draughtsmen like Hermann Zapf, but these need to be understood as artifacts of industrial manufacturing processes. My recommendation for digital font development is to follow the older practice from the days of the manual punchcutter: make only rough drawings, and allow the refinement to come out in the outlines you make on the computer. <br> <br> <br>* If I'm designing for a script I have not worked with before (I do a lot of multilingual type design), I tend to spend time writing it with appropriate instruments, in order to understand the development of the script relative to the tools with which it has been written.</p>"
