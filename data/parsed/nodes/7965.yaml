    html: <p>Aaron, mechanically you seem to be on the right track (although honestly that's not very hard), but ideologically, or perhaps even spiritually in a way, to me the key to "real" type design is grasping the part-versus-whole nature of the way in which individual signs come together to create "visible language", the way in which the balancing of positive and negative (notan) leverages human cognition to full effect. Don't ask me to elaborate any more, because I'm still in the forest myself. But at least I know I'm lost. :-) <br> <br>Without this sort of meta-understanding you can still make type that many people will love and even purchase, but it will be a shadow, or better a silhouette, of what type really is. <br> <br>-- <br> <br>BTW, there have been some Typophile threads in the past with great mechanical insight - hopefully one of our archive hounds will bring those up. I tend to have lousy luck with the archives here. <br> <br>hhp</p>
