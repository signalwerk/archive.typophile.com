  html: "<p>I am a young designer that is looking to get into type design. <br>But the problem is I have no idea were to begin.  <br> <br>This is what my current knowledge on the subject is: <br> <br>- draw your desired typeface on paper first  <br>- then some how scan it into the computer  <br>- then use a program like robofog, fontographer OR fontlab  <br>- to make the type face a digital font... <br> <br>Is this right ? and what would you people recommend as a program to use ? <br> <br>I understand form reading your posts that there is collectively alot of great designers here. Could you please help me out a little.</p>"
