    html: "<p>Question: Fontographer is old and hasn't been updated in ages. For this reason it is probably easier to learn than Fontlab, which I've had a chance to mess around with and found very confusing. But by the same token, is FontLab the de facto standard with capabilities not present in FOG, like Open Type support? Which program, once learned, makes for the best tool in terms of an ideal end result with a minimum of fuss?</p>"
