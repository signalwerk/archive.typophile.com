    html: <p>&gt;*on average* . . . how one approaches design is a function of age and background. Type designers who were born before 1960 and/or have significant calligraphy or hand-lettering background almost all tend to draw things out pretty carefully first and digitize later&lt; <br>Just to show you that the average Thomas speaks of isn't an absolute, I was born in early 1944 and have a caligraphy/handlettering background.  I rarely draw letter-forms on paper at all anymore.  I either start straight in FontLab or Illustrator with a blank screen and just  draw. Some of us geezers just mess up the rules :-) <br>The point is, it does not matter a hoot how anyone else works, do what ever works for you.  Try several ways.  However you start, you will learn from it.  You can change your work process later.  I did, I used to work with just 2 brushes and black and white paint.  The important thing is to learn to "see".  Work, then look, then fix, then look, then tinker.  You will learn the infinitesimal amount of possibilities that exist in a few points of space. <br> <br>ChrisL</p>
