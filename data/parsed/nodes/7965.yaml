    html: <p>Wow. I was thinking about asking a very similar question. Yeah, there are some very respected type designers on this board and I, too, would love to know what your thought process and workflow looks like. <br> <br>For example, do you start with a sketch or go straight to the vectors? Do you create individual glyphs in a program external to fontlab et al. (Illustrator, Freehand) then import the eps into fontlab? Do you start with any specific glyph? Do you cut and paste components of one glyph into another or draw each separately (serifs, stems, ascenders, things that in some faces, anyway, are modular)? Come on, spill it!</p>
