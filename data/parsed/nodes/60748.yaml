    <p>I'd recently heard about the 'IQ font' used in the identity of a new car for Toyota. What I didn't know is that the font was actually drawn with the car itself. Check out the video of how it was made. Pretty interesting.</p>
    <p><a href="http://drawn.ca/2009/07/27/designing-a-font…-with-a-car/" rel="nofollow">Video » Designing A Font With A Car</a></p>
    <p>Download the font here, free. <a href="http://www.iqfont.com/IQFONT.zip" rel="nofollow">IQ Font</a></p>
