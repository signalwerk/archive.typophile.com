      <p>OK, this is my first contribution to "critique", and I'm feeling self-consious ... mostly because this font is so much better than anything I've done.  But I want to contribute, because I'm hoping to use this forum one day.</p>
      <p>First off, I really like the face, and think it's very successful. My only comment is that I did a stutter-step when I read "sunshine" because of the similarity of the "h" and the "n".  No idea what the solution is, because of the no-ascenders-no-descenders (semi-unicase?) design.</p>
      <p>The only other thing that drew my eye is the dot on the "i". It stands out a bit; can it be reduced a little, or rounded off a hair?</p>
      <p>OK, I've made my comments, and I am ashamed: I feel like such an ogre, blasting someone's hard work. </p>
      <p>Jay</p>
