    <p>Greetings, all. Thought I'd post some samples of the display face I am currently working on to get some feedback. At this point I have the basic letterforms with various possible alternates, figures and basic punctuation. There is also only basic spacing and no kerning.</p>
    <p>Thanks in advance for taking a look and letting me know what you think.</p>
