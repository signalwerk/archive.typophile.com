    html: |-
      <p>However, once you understand how the "Bold" and other transformations work, it is possible to design your face with these in mind, to make "bolding" easier.</p>
      <p>Certain kinds of typeface are more amenable to "push button" bolding, for instance light, monoline faces.</p>
