  html: |-
    <p>Hi,</p>
    <p>I have created a font in Fontlab. I went to use the inbuilt function to make it bold and the characters have become distorted, additional points have been added and the height in some characters has decresed - do you know what is causing this and is there a way to create a bold version of the type face without these errors occuring?</p>
    <p>Thanks.</p>
