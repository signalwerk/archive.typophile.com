  html: <p> How do other people encide their fonts? <br> <br>For Mac fonts I have the encoding as Macintosh (Element &gt; Font Info), and for PC I leave it as Macintosh. (I use a Mac to generate all the fonts) <br> <br>Does this cause any problems or issues? How do you test your fonts over different platforms? (I may look at Virtual PC) </p>
