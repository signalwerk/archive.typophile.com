      <p>For the record, the pronunciations of the six Western font families introduced by Microsoft in the ClearType font collection, as their designers pronounce them:</p>
      <p>Calibri – kah-LEE-bree<br>
      Corbel – kor-BELL<br>
      Candara – kan-DAH-rah<br>
      Cambria – KAM-bree-ah<br>
      Constantia – kon-STAN-tsee-ah*<br>
      Consolas – KON-soh-lahs</p>
      <p>* Even within Microsoft, there are variant pronunciations. Although the designer, John Hudson, pronounces Constantia with a "ts" sound for the second <strong>t</strong>, I've mostly heard it as kon-STAN-tee-ah, with a simple "t" sound, and that's how I read it myself. (Perhaps this is just a residue of my having learned classical Latin pronunciation.)</p>
      <p>In a similar vein, the font name Segoe is usually pronounced sih-GOH within Microsoft, although the designer, Tom Rickner, named it after a street in Madison, Wisconsin, where it's pronounce SEE-goh. (The street was named after a city planner of that name.) But I've even heard people ask whether it should be pronounced SEG-way – which I suppose is a logical extrapolation from the musical term "segue." That's the trouble with only <em>reading</em> a word, and not hearing it spoken.</p>
    html_clean: |-
