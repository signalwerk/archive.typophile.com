    <p>There's been a recent discussion at my school on how to pronounce this font. Did a Google search and a bunch of different opinions came up. There seem to be three possibilities:</p>
    <p>ka-LEE-bree</p>
    <p>KAL-ih-bree</p>
    <p>ka-LIHB-ree </p>
    <p>Now, I personally say "KAL-ih-bree" but am wondering if it is actually "ka-LEE-bree". Does anyone know the OFFICIAL pronunciation?</p>
