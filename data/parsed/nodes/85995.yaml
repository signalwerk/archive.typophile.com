      <p>John B: <em>Although the designer, John Hudson, pronounces Constantia with a "ts" sound for the second t, I've mostly heard it as kon-STAN-tee-ah, with a simple "t" sound, and that's how I read it myself. (Perhaps this is just a residue of my having learned classical Latin pronunciation.)</em></p>
      <p>I think either is fine. I pronounce it with the 'ts' sound because around the time when I was looking for a name for the typeface -- which had to begin with C, to fit with the other CT fonts -- I was singing some Gregorian chant and this word leaped off the page at me. So I pronounce it according to the liturgical Latin convention.</p>
