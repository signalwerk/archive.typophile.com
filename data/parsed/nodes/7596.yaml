    html: "<p>About the numerals again: <br>If you look back to Perrin's original drawings <br>(316Kb) <a href=\"http://www.themicrofoundry.com/other/Elzevir/Elz_Perr2.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Elzevir/Elz_Perr2.gif</a> <br>you'll notice some differences from what was actually made in metal, including a much better \"8\". Maybe he changed his mind, or maybe his punchcutter* had his own ideas (not unusual), but if you're concerned about historical fidelity in terms of changing the \"8\" the precedent is actually there. <br> <br>* Francisque Rey. <br> <br>BTW, I've moved those most-recent three images to the \"Elzevir\" subfolder, so they're now: <br>(488Kb) <a href=\"http://www.themicrofoundry.com/other/Elzevir/Perrin_11Marquet.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Elzevir/Perrin_11Marquet.gif</a> <br>(567Kb) <a href=\"http://www.themicrofoundry.com/other/Elzevir/Perrin_14Marquet.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Elzevir/Perrin_14Marquet.gif</a> <br>(87Kb) <a href=\"http://www.themicrofoundry.com/other/Elzevir/Perrin_florR.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Elzevir/Perrin_florR.gif</a> <br> <br>hhp</p>"
