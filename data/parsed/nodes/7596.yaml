    html: <p>The nice final version is now <a href="http://www.eventide.ca/typography/marquet-specimen.pdf" target="_blank">done</a>, but the specimen sheet is still pretty plain. I made the titling numbers based closely on the nice Perrin numerals from one of Hrant's scans. <br> <br>Since there has been very little comment on the design itself, I sould welcome it. Especially for some of the finer technical details you might notice. <br> <br>Hrant, I remember that you suggested to `firm-up' the very bottom outside left of the lc `a', but I do not know what you mean. I did change it a bit, so maybe you can take a <a href="http://www.eventide.ca/typography/oeuvresdedes/a-comp.gif" target="_blank">look</a> at it and tell me if it still needs to be changed. Also, I did try reducing the word spacing  bit and I do think that it looks nicer this way. Do you think that it is too close now, or just right?</p>
