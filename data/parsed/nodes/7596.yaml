    html: <p><a href="http://www.eventide.ca/typography" target="_blank">Access to Scans</a> <br> <br>Hrant and Jean, thanks so much for the input! I have put together a page of scans as well as a link to the PDF that is a bit updated (I noticed a few details that needed to be changed). It is interesting that you describe these kinds of fonts as being a bit wunky, which is what initially inspired me to make them. I like escpecially the narrow top on the e and c, as well as the backward slope of the b, the lovely g, etc. But especially I love the Capital R. <br> <br>The first time I saw the titling font was on the cover of <i>Pensees Diverses sur la Comete.</i> I noticed the spine while browsing through the philosophy books at school. I just absolutely loved these letters, especially the capital R. The cover of this book is what first got me interested in typography last winter! <br> <br>In the same section I found the series on Descartes, which is quite an important resource for Descartes scholars. The editions definitely look like they were produced photographically to me and contains many different fonts. One of the problems in identifying the fonts is that there are so many different ones used in the series.  <br> <br>I chose to work from Tome Six, since this is the cleanest copy we have. I based the font off the largest of the type, which is about 14pt. The original's italic has a noticeably lower x-height than the regular; I kept it lower but not as much as in the original.  <br> <br>The font in the introduction and in the footnotes is different than the main body text, but I did not reference this in the design (in fact the small fonts seem to resemble very much JFP's <i>Bertrand</i>). Also, the small caps do not seem to be based on the capitals, but are possibly from another typeface. I decided to retain their flavour anyway. The original numerals are very ugly, and I tried to make them prettier (this is where I made the most change). <br> <br>Interestingly, the italics used at different sizes all seem to be the same design, but drawn slightly differently. For example, the smaller ones are curvier, while the stems on the full size are straighter. <br> <br>I hope that we can achieve a correct identification so that it can be named properly and I can learn more of the history of the designs. I would like to look at those books that you recommended, Hrant, but they are typography books are not available here in Winnipeg. Hopefully I will be able to buy some books at some point, but they are generally prohibitively expensive (I am a philosophy student). If you can post any scans from your books I would really appreciate it!</p>
