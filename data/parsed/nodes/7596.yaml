    html: <p>I did some comparisons, and it seems your text face is close to Baudoire's stuff*, although not exactly. The thing is, I could swear I've seen that characteristic narrow-top "e" somewhere before, and for some reason it makes me think of ATF. Dunno. <br> <br>* Which Audin notes was actually a copy of the Augustaux in the UC but not the lc. So if the titling and body face in that book were part of the same font, the likelihood that it is a Baudoire (but how did they print it in the 1970s - was it a facsimile of a much older work?) I would say increases. <br> <br>hhp</p>
