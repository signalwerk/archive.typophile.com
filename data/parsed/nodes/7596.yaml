e). <br> <br>Interestingly, the italics used at different sizes all seem to be the same design, but drawn slightly differently. For example, the smaller ones are curvier, while the stems on the full size are straighter. <br> <br>I hope that we can achieve a correct identification so that it can be named properly and I can learn more of the history of the designs. I would like to look at those books that you recommended, Hrant, but they are typography books are not available here in Winnipeg. Hopefully I will be able to buy some books at some point, but they are generally prohibitively expensive (I am a philosophy student). If you can post any scans from your books I would really appreciate it!</p>
