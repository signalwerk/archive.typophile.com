      <p>Noah: I actually did an OCR of the seminal 1967 Ross edition of the Meditations (English). I did not do the original latin or french editions though, because these books from school do not open up all the way to fit in the scanner. Currently the PDF of the meditations is not online, but I can make available when I get back. I find it really useful to have this in PDF so that if I want to write a critique of Descartes description of God as infinite, I can just do a search of it for `infinite', `infinity', etc. <br> <br>If anyone wants to see the latest online version of the font in action you will have to read my last paper on Hume. (Any philosophers here will have to take it easy on me because I am only in second year at university!) <br> <br></p>
