    date: 2004-12-22T13:15:00
    date_raw: 22 Dec 2004 — 1:15pm
    votes: null
    html: "<p>Thanks for the critiques. Right now I am on a holiday and so I cannot work on the design. But I will definitely make a list of the suggestions and try their implementation when I get home. <br> <br>Foremost will be the spacing and kerning of the characters. I have been meaning to redo this entirely, since I figured how to achieve better spacing with less kerning while making the italic; but this will be a big task for the number of glyphs in the roman (regular, sc, titling, accents...). I didn't notice before how wide the spacing on the `t' is, so any more comments about spacing woulr be great. It is hard to tell what is off after I have become so used to the spacing. <br> <br>Looking at the `Q', I can see what you mean about the tail being too frail. Sometimes I was unsure about whether to follow the perrin, beaudoire or version from Les Oevres de Descartes most closely. But I from now on I will try to just balance out the family over all. <br> <br>Jon: The lc `s', c e and a are based on the ones in Oevres de Descartes, which are somewhat different than all the others. I think that they look much better anyway, especially the s which matches more nicely to the uc `S.' But having ball terminals does match better with the italic; which do you think looks better in the roman?  <br> <br>Re: the asterisk, I wish that I could take credit for this, but it is exactly the one in Oevres de Descartes. It is one of my favorite glyphs from there since it is different from most. But thanks about the dagger and the BP glyph. Those are ones I actually did make. <br> <br>My descenders on <i>p</i> and <i>q</i> from the italic are actually a bit shorter than from the orinigal ones. I know that they do not blend perfectly with the roman for this reason, but in the original the two were never set on the same line. When I did make them shorter, I felt that a lost of their distinct character was lost. When I get back I will try making it with shorter descenders on those glyphs and you guys can tell me what you think. <br> <br>Hrant: I do not know exactly what you mean about the top of the t being out of character. Can you elaborate? Do you mean that the sloped part should be more curvy than it is now?</p>"
