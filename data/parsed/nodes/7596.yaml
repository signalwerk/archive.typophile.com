    html: <p>You're amazing! I don't know how you can know so much about type. Your scan of <i>The Beaudoire from Ovink</i> is exactly the same one in the book, numerals and all. In my book there are the same 11pt and the same 14pt. The only differences are that in the Descartes books the lc <b>a</b>, <b>c</b> and <b>s</b> in the 14pt size are different. I guess Floch (who printed the book) made his own? <br> <br>Googling `ovink beaudoire' turns up nothing useful. Can you suggest to me where I can get access to this book? Is it purchase-able? I am so happy, because I have been wanting to know the story of these designs since I first saw this book.</p>
