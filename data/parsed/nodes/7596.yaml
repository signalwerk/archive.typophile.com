    html: "<p>I don't get why nobody is reacting. <br>Did I come down too heavy before and scare people? <br>Come on, guys. <br> <br>-- <br> <br>The \"a\": looking at it again, I think it's just fine. I was being too Modernist before. <br> <br>The new \"8\"s are great. <br> <br>Roman: <br>- The tail of the \"Q\" is frail. <br>- The head of the \"t\" is out of character. <br> <br>Italics: <br>- The descenders of \"p\" and \"q\" are too long. <br> <br>That BP sign is very nice, and that Asterisk in the Expert set surprising (quite possibly in a good way). <br> <br>Spacing: it needs work (like look at the right side of the \"t\") but the overall tightness and the size of the blank space seem good. <br> <br>hhp</p>"
    html_clean: "<p>I don't get why nobody is reacting. <br>Did I come down too heavy before and scare people? <br>Come on, guys. <br> <br>-- <br> <br>The \"a\": looking at it again, I think it's just fine. I was being too Modernist before. <br> <br>The new \"8\"s are great. <br> <br>Roman: <br>- The tail of the \"Q\" is frail. <br>- The head of the \"t\" is out of character. <br> <br>Italics: <br>- The descenders of \"p\" and \"q\" are too long. <br> <br>That BP sign is very nice, and that Asterisk in the Expert set surprising (quite possibly in a good way). <br> <br>Spacing: it needs work (like look at the right side of the \"t\") but the overall tightness and the size of the blank space seem good. <br> <br>hhp</p>"
