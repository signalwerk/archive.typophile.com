    html: <p>I think it's just harder to comment on a revival. For example, I think the italics do have a nice structure; they're not 'calligraphic', but on the other hand I think it looks odd (especially when compared to the roman). Maybe because of the weight distribution. <br> <br>The figures look very quirky to me, and they're also set too tight (look for '1993' or '1980' in your last sample, for example). <br> <br>My point is, these are characteristics that you're bringing from the original typeface, so you'll eventually have to choose between being faithful to the original and adapting it even though it may require you to remove some of its quirks.</p>
