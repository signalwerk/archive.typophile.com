    html: "<p>I used to live off of Inter-Library Loans!  :-) Then I sort of ran out of things to request. Well, not really, stuff still pops up once in a while. <br> <br>It suddenly hit me that I have a copy of Ovink's obituary (he was da man), which contains a comprehensive bibliography of his writings*. So the Elzevir stuff is in Volume 1, #4, pp 282-301 (1971). <br> <br>* And actually looking through Part 3 of the series I now see a reference to part two with a full citation. <br> <br>The numerals: <br>I don't know if it's better to go with the Perrin style or the Beaudoire/Marquet style. Or maybe something else entirely, even your own design. But even if (or maybe <i>especially</i> if) you go with the Perrin style, don't be too shy about fixing things. When I look at what you had in your most-recent iteration, it strikes me that the proportional divergences are quaint and probably in character, but the \"8\" simply is too ugly because of its huge top. <br> <br>BTW, I got some more goodies for you: <br>While I was looking for something else I ran into the single most important publication about Perrin that I know of: Audin's book on the 1923 Perrin exhibition in Lyon. It's quite rare - it seems only 61 copies were printed. There's a very extensive text (120 pages), a complete catalog of works, and some great facsimiles (as well as actual prints -like pressmarks- from Perrin's own engravings). The paper is very yellowed though. There are two things in there that will probably interesting you most: <br> <br>1) A facsimile of Perrin's famous specimen sheet, showing two sizes that are basically Marquet's designs: the 11 and the second 14. Here are scans: <br>(488Kb) <a href=\"http://www.themicrofoundry.com/other/Perrin_11Marquet.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Perrin_11Marquet.gif</a> <br>(567Kb) <a href=\"http://www.themicrofoundry.com/other/Perrin_14Marquet.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Perrin_14Marquet.gif</a> <br>The second scan is a collage from two sections of the sheet. <br>If you want more details about the specimen let me know. <br> <br>2) This is cool. A character set of floriated caps, from \"A\" to \"V\". Here's the \"R\": <br>(87Kb) <a href=\"http://www.themicrofoundry.com/other/Perrin_florR.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Perrin_florR.gif</a> <br>BTW, that's a RIP-killer right there... <br> <br>Concerning the Marquet fonts, I guess it's safe to conclude that Perrin spliced in his own caps and numerals - although I can't be 100% sure. And Beaudoire seems to have partly parroted this mix-and-match deal for some reason. <br> <br>hhp</p>"
    html_clean: "<p>I used to live off of Inter-Library Loans!  :-) Then I sort of ran out of things to request. Well, not really, stuff still pops up once in a while. <br> <br>It suddenly hit me that I have a copy of Ovink's obituary (he was da man), which contains a comprehensive bibliography of his writings*. So the Elzevir stuff is in Volume 1, #4, pp 282-301 (1971). <br> <br>* And actually looking through Part 3 of the series I now see a reference to part two with a full citation. <br> <br>The numerals: <br>I don't know if it's better to go with the Perrin style or the Beaudoire/Marquet style. Or maybe something else entirely, even your own design. But even if (or maybe <i>especially</i> if) you go with the Perrin style, don't be too shy about fixing things. When I look at what you had in your most-recent iteration, it strikes me that the proportional divergences are quaint and probably in character, but the \"8\" simply is too ugly because of its huge top. <br> <br>BTW, I got some more goodies for you: <br>While I was looking for something else I ran into the single most important publication about Perrin that I know of: Audin's book on the 1923 Perrin exhibition in Lyon. It's quite rare - it seems only 61 copies were printed. There's a very extensive text (120 pages), a complete catalog of works, and some great facsimiles (as well as actual prints -like pressmarks- from Perrin's own engravings). The paper is very yellowed though. There are two things in there that will probably interesting you most: <br> <br>1) A facsimile of Perrin's famous specimen sheet, showing two sizes that are basically Marquet's designs: the 11 and the second 14. Here are scans: <br>(488Kb) <a href=\"http://www.themicrofoundry.com/other/Perrin_11Marquet.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/Perrin_11Marquet.gif</a> <br>(567Kb) <a href=\"http://www.themicrofoundry.com/other/Perrin_14Marquet.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/Perrin_14Marquet.gif</a> <br>The second scan is a collage from two sections of the sheet. <br>If you want more details about the specimen let me know. <br> <br>2) This is cool. A character set of floriated caps, from \"A\" to \"V\". Here's the \"R\": <br>(87Kb) <a href=\"http://www.themicrofoundry.com/other/Perrin_florR.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/Perrin_florR.gif</a> <br>BTW, that's a RIP-killer right there... <br> <br>Concerning the Marquet fonts, I guess it's safe to conclude that Perrin spliced in his own caps and numerals - although I can't be 100% sure. And Beaudoire seems to have partly parroted this mix-and-match deal for some reason. <br> <br>hhp</p>"
