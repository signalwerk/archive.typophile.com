    html: "<p>Good scans. <br> <br>That \"a\" is really shockingly contemporary, and I guess you did a great job with it after all. The only thing I'd change would be to firm up the very outside-bottom-left. <br> <br>&gt;  I love the Capital R. <br> <br>It's a charming sort of structure - many people like it, including Roger Black from what I've noted. <br> <br>&gt; The cover of this book is what first got <br>&gt; me interested in typography last winter! <br> <br>Life is strange! <br> <br>&gt; [numerals are] where I made the most change <br> <br>I can't see what the original numerals look like (the only ones I see, on the \"original cover\", seem fine, and similar to your new ones actually!) but one thing I would suggest is to make them \"classic French\" style, not conventional, since this is after all a historical font - so the \"3\" and \"5\" ascending rather than descending. Look at the old Didot stuff - quite nice: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53219.gif\" alt=\"DidotNums\"> <br>I would have bowed the diagonal of the \"4\" though... and I <i>will</i>, heh heh...  :-&gt; <br> <br>As for scans, I will gladly post them - just know that they're from photocopies of reproductions of who knows what! I'll have to do it tomorrow though. <br> <br>hhp</p>"
