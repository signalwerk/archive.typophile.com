    html: |-
      <p>I don't know that much - collecting stuff simply helps one appear smart.<br>
      <cite>Audin</cite> was the one who <cite>knew</cite> stuff.  But I'm glad I could help.</p>
      <p>The Ovink thing is a 3-part article titled "Nineteenth-century reactions against the didone type model", published in the Dutch journal Quærendo - a really useful series. The Beaudoire bit is in part 2. I don't seem to have kept an exact reference for that, but fishing through some old emails I can see that part <cite>three</cite> is in V2 #2 (1972). If you have trouble finding it, try to find an index to Quærendo (I know they published indeces, plus it might be online), or look through the complete Ovink bibliography in Quaerendo Volume 14 #1 (1984), pp 8-17. If you <cite>still</cite> can't find it, let me know.</p>
      <p>So are you trying to find a good name for the font? It's tricky, because Beaudoire's work* was apparently derivative to some extent. But I wouldn't call it Perrin [any more]. The only thing I can think of is "Théophile". Or maybe something related to mid/late-19th century France.</p>
      <p>* At least that design; there's actually a font in Audin '28 by Beaudoire that's a quite charming upright cursive - even though Audin himself calls it "bien laide" (quite ugly).</p>
      <p>BTW, check <cite>this</cite> out:<br>
      <a href="http://www.myfonts.com/fonts/bitstream/romana/familytree.html" target="_blank" rel="nofollow">http://www.myfonts.com/fonts/bitstream/romana/familytree.html</a><br>
      But looking through my stuff, that "g" -and the lc in general- makes it look closer to the "Old Style" of Miller &amp; Richard of Edinburgh (an "Anglo" take on the Elzevir) than the French stuff. And tellingly, the same guy who made Romana made ATF De Vinne!</p>
      <p>hhp</p>
