    date_raw: 28 Jan 2005 — 9:03am
    votes: null
    html: <p>Forrest <br> <br>I'm glad about your comments about the Q and R being so hot <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> The R from this design was what got me interested in typography. I have spent countless hours on the titling caps trying to achieve maximum hotness and I really don't think that I can change any of them for the better at this point without disrupting the orignal character.  But I can see that the part you mention declines more swiftly than its P counterpart. I will revisit this letter as I continue to work the display set. I am more sure now that I will want keep these as a separate font altogether rather than put them in the main font as a Titling alternate. <br> <br>I am also continually bothered by the italic even after having fixed the k, descenders, etc. That is primarily why I haven't posted any more updates. Lately I have been working on rewriting the opentype code to make it more elegant and to allow for more comprehensive kerning classes on the roman. Once it is figured out how to do this properly, I will apply the same methods to the Italic. And if anybody can tell me how to fix the ugly w, please let me know! <br> <br>BTW, Thomas, if you read this, thanks again for posting those OpenType feature files on the Adobe site. I am just in awe of how perfect and sophisticated your fonts are!</p>
    html_clean: <p>Forrest <br> <br>I'm glad about your comments about the Q and R being so hot <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> The R from this design was what got me interested in typography. I have spent countless hours on the titling caps trying to achieve maximum hotness and I really don't think that I can change any of them for the better at this point without disrupting the orignal character.  But I can see that the part you mention declines more swiftly than its P counterpart. I will revisit this letter as I continue to work the display set. I am more sure now that I will want keep these as a separate font altogether rather than put them in the main font as a Titling alternate. <br> <br>I am also continually bothered by the italic even after having fixed the k, descenders, etc. That is primarily why I haven't posted any more updates. Lately I have been working on rewriting the opentype code to make it more elegant and to allow for more comprehensive kerning classes on the roman. Once it is figured out how to do this properly, I will apply the same methods to the Italic. And if anybody can tell me how to fix the ugly w, please let me know! <br> <br>BTW, Thomas, if you read this, thanks again for posting those OpenType feature files on the Adobe site. I am just in awe of how perfect and sophisticated your fonts are!</p>
  - id: 51607
    user: 5605
    date: 2005-01-28T14:25:00
    date_raw: 28 Jan 2005 — 2:25pm
    votes: null
    html: <p>I think the w and the v are both fine. I had to search through your Hume paper (what did your professor think of the over-the-top typography, by the way?) to find the italic w in a setting, but there it made perfect sense. I think in general this face could stand to be letterspaced a little more loosely, and if so, you could widen the italics a little and lower the contrast. I think my objections to the y would diminish with a little outward curvature in the descender coupled with a thicker stroke. <br> <br>I think the italics would be easier to space if the overall letter spacing were looser, too. One of the things I've been learning lately is that we (contemporary users and designers of type) like to bunch our letters up much more tightly than in the past; if this is a revival typeface (which it still kind of is), maybe you should try revival spacing as well.</p>
