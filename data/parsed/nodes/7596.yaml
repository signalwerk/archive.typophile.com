    votes: null
    html: <p>I think it's because we may have been rendered speechless. I have never seen a G with such an articulated spur. I am fascinated. The ? 3 5 9 are gorgeous and I like the dagger. <br> <br>Comparing the scans from Hrant and notice that the lc s is different. The scans show an almost ball terminal and you are going down a serif path. This is intentional? <br> <br>The asterisk in the expert set make me grin. I felt a ping. <br> <br>I agree with Hrant that the Q's tail is too frail. It definitely needs a little more thickness for its length. But then it would be too frail if it was shorter (DON'T make it shorter) so some more weight would most likely help. Add it at the extrema of the curve. <br> <br>The tails on p and q look good in the alphabet presentation, but are too long when you look at them in lines of text. <br> <br>I think this looks great. <br> <br>Jon</p>
