    html: <p>Forrest,  <br> <br>Thanks very much for the insights. I actually kind of like the steep angle on the r, but I will take a look at it and try to improve it. The square brackets are indeed too thin. I have not edited them in a long time and since I made them the rest of the font has become darker and more consistent. So I did revise these to still be thin, but now more in proportion to the rest.  <br> <br>Also, good points about the italic. I've been hating the lc k for some time now, but wasn't sure what to do with it. I recently came across a book that was set in Fournier, and seeing how similar it is Marquet in many ways, I decided to adopt a similar style. There was no lc k in the original, so finding this was helpful. I also modified the uc K to be more similar to the R and Q as well. Regarding the y, you are quite right. I would say that overall the spacing on the italic is not very good because I just haven't had the time to do enough work on it. I find that the cursive was easier to draw but more difficult to space! <br> <br>After much thought, I also decided to revise the ascenders and descenders to be a bit more conservative. I am still a bit uncomfortable with the ascenders of the longs glyphs, so I will change them to be shaped more like the r. <br> <br>I'm also working on expanding the titling set to include a lc that is sort of a blend of the Beaudoire lc and one by Perrin that matches his Titling figures more closely. I will post that in the Display section when more is done. It looks very French!</p>
    html_clean: <p>Forrest,  <br> <br>Thanks very much for the insights. I actually kind of like the steep angle on the r, but I will take a look at it and try to improve it. The square brackets are indeed too thin. I have not edited them in a long time and since I made them the rest of the font has become darker and more consistent. So I did revise these to still be thin, but now more in proportion to the rest.  <br> <br>Also, good points about the italic. I've been hating the lc k for some time now, but wasn't sure what to do with it. I recently came across a book that was set in Fournier, and seeing how similar it is Marquet in many ways, I decided to adopt a similar style. There was no lc k in the original, so finding this was helpful. I also modified the uc K to be more similar to the R and Q as well. Regarding the y, you are quite right. I would say that overall the spacing on the italic is not very good because I just haven't had the time to do enough work on it. I find that the cursive was easier to draw but more difficult to space! <br> <br>After much thought, I also decided to revise the ascenders and descenders to be a bit more conservative. I am still a bit uncomfortable with the ascenders of the longs glyphs, so I will change them to be shaped more like the r. <br> <br>I'm also working on expanding the titling set to include a lc that is sort of a blend of the Beaudoire lc and one by Perrin that matches his Titling figures more closely. I will post that in the Display section when more is done. It looks very French!</p>
