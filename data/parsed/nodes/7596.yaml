    <p>Hello. This is my first stab at font building. It is not an original design, but my attempt at recreating the fonts found in the <i>Oeuvres de Descartes</i> series published by J. Vrin in the 1970s. It was pointed out to me by someone named Claude on a fonts newsgroup that the Titling capitals were derived from the work of Louis Perrin (The Lyons Capitals). If any one has any additional information on these fonts or any critique of how to improve the design, I would really appreciate it! Some of the glyphs (like the italic `k') I could not find in the book, and I am not quite sure how to make it fit with the other letters. Also, I know that the Italic caps are butt ugly, because I haven't been much interested in improving them (they rarely come up in use for me). But I'd still appreciate suggestions on them. You people seem to know a lot about good typography! <br> <br></p>
