  html: "<p>hi, <br>thrugh my search for info on lucas de groot's fonts i run across some terms that i am not familiar with, like: <br>expert glyphs <br>hanging monospaced/proportional figure <br>lining monospaced/proportional figure <br>fraction figure <br>f-ligatture <br>i guess that some of those terms are really basics, and might be that it is just the difference between designing in hebrew or latin typeface. so if anybody have an idea about where i can find this info, i'll be thaxfull! <br>roy <br> <br></p>"
