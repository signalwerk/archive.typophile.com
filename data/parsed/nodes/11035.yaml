    html: <p><b>glyph:</b> A character's form or shape in a font.  <br><b>expert glyphs:</b> This may not be correct usage. The usual term would be expert characters. It means characters intended for use in more refined typesetting, such as small caps and ligatures (see below).  <br><b>hanging figures:</b> Number characters which sometimes hang below the baseline. Also called old style, ranging, or lowercase figures.  <br><b>lining figures:</b> number characters which are all the same height  <br><b>monospaced:</b> All the same width (as on a typewriter). Monospaced figures are designed to line up neatly in tables or colums of figures.   <br><b>proportional:</b> Varying widths. Proportional figures are designed to look better in headlines and text.   <br>(Usually, figures are monospaced, whether hanging or not. de Groot is saying he also provides proportional sets of both styles.)  <br><b>fraction figures:</b> A set of small number characters, both superior and inferior, for creating arbitrary fractions (e.g. 13/457). A special fraction bar character is used with these. An example of something which would be part of an expert character set.  <br><b>f-ligature:</b> A ligature is a pair of characters combined into one character, usually to solve awkward spacing problems, but sometimes decorative. An f-ligature would combine f with some other character (fi, fl, ff, ffi, ffl, are typical). f-ligatures are the most common kind of ligatures. The top of the f in many typefaces extends far enough to the right that it can cause problems when setting next to certain other characters (mainly i and l). Ligatures are designed to solve this type of problem.</p>
