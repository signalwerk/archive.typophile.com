    html: "<p>Regarding glyphs and characters: <br> <br>A character is an encoded semantic entity, e.g. 'Latin uppercase A' encoded in Unicode as U+0041. <br> <br>A glyph is a particular representation of a character, multiple characters (ligature), or even part of a character. A font is a collection of glyphs, some or all of which may be directly mapped to characters. It is possible for a font to include 'unencoded glyphs', <i>i.e.</i> glyphs that are not directly mapped to characters, but only indirectly mapped via glyph lookups. So, for example, a regular uppercase A, a smallcap A, and a swash A are all glyph representations of the character 'Latin uppercase A', but only one of them will be directly mapped to the character codepoint U+0041. The others may be called 'expert glyphs', but the more usual term is 'variant glyphs'.</p>"
