      <p>So the modern signs use Transit, and the picture shows an older one in Cst Berlin West?</p>
      <p>At least Dan is correct with FF Cst Berlin West -- check out the rounded lc. 'b' and the wonderful eszet (and tz!) ligatures. It has a marvellous 'period' feel, although I'm not 100% sure <em>which</em> period :-)</p>
