      <p>Actually, this is not a classic, because this looks like one of the new signs.</p>
      <p>The original Berlin street signs were painstakingly digitized by type archaeologist <a href="/wiki/Verena%20Gerlach" class="freelinking" rel="nofollow">Verena Gerlach</a> and <a href="/wiki/Ole%20Sch%C3%A4fer" class="freelinking" rel="nofollow">Ole Schäfer</a> for <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> as <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_city_street_type/" rel="nofollow">FF City Street Type</a> in bothe East and West Berlin variants, before they started changing these wonderful signs into the somewhat less wonderful signs they have now.</p>
      <p>I think the modern signs might use FF Transit, the typeface <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> and MetaDesign specified for the Berlin subway system. Is is available in three versions, the first one being <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_transit_print_ot/" rel="nofollow">FF Transit Print</a> for use in print. The two other versions are intended for wayfinding -- <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_transit_front_ot/" rel="nofollow">FF Transit Front</a> for front lit signs, and <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_transit_back_ot/" rel="nofollow">FF Transit Back</a> which compensates the weight change of the characters in backlit signs so the weights of both front lit type and back lit type appear identical.</p>
