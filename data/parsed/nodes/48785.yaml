    html: |-
      <p>It is a custom design based on Erbar.</p>
      <p>Erbar was a face from Bauer by Jakob Erbar in the 1920s. Only a few display weights of that have been digitized and made commercially available, sadly.</p>
      <p>But if you want to match the Berlin city street signs, you are in luck!</p>
      <p>Verena Gerlach and Ole Schäfer digitized this (and the East Berlin street signs) for the <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_city_street_type/" rel="nofollow">FF City Street Type family</a>. To get this style, you should use FF Cst Berlin West Regular or Medium, I guess.</p>
