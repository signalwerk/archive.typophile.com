      <p>Thanks for the kind words, everyone!</p>
      <p>Paulo, it took several days (not all at the same time), but:</p>
      <p>- I have used a lot of similar material in previous PDFs, so it is something of a cumulative, aggregate work.<br>
      - It is very useful as a quality-check of the fonts.</p>
      <p>This was originally a newspaper face, and I can also see it being used in corporate or marketing work, but not so much for books and journals that use small caps, on account of the large x-height and short descenders. The caps are quite small already. So the extra work I put into it before general release was devoted to adding the Black weight, and extending language coverage. The only substantial OpenType feature is alternate figures, and a few extra pre-composed fractions.</p>
