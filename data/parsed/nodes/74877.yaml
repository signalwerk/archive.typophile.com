      <p>Well, except for the missed opportunity to be remembered for the next hundred years as the designer of Globe New Roman, I'd say you're doing well. Actually, since the Globe and Mail's new look is using faces designed by you, even if not ones specifically designed for the Globe and Mail, perhaps it is still possible...</p>
      <p>After visiting your web site, I noted with a shock that you had custom fonts there named Globe and Mail News, Globe and Mail Sans, and Globe and Mail Text. And so I thought I was mistaken, although I was sure I saw in the thread the face of yours they were now using specifically named - and it wasn't one of those. However, looking a bit harder cleared up the mystery - those three faces were commissioned for its previous redesign, which was also your doing.</p>
      <p>Worldwide is, of course, just a tad too condensed <em>in order</em> to provide something different in its overall appearance from other faces that are easily available (i.e. Century Expanded, Times Roman). And then there's Williams Caslon Text by another designer here. And there's the Starlng revival.</p>
      <p>Who will design the new typeface that will dethrone Times Roman, becoming the ubiquitous text typeface for the 21st Century? (Could Georgia be a candidate for this honor?)</p>
      <p>Of course, maybe that honor isn't up for grabs - or we'd already be drowning in Palatino.</p>
