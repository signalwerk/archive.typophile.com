      <p>Hello Nick,</p>
      <p>I licensed Sensibility. But I was first drawn in by Sense. But when I came to compare the two, there were some characters in Sense that I did not like so much, such as the spurless lowercase 'b', the lowercase 't' and 'u', and the uppercase Q, which in the black wheights becomes a little too fat, imho. These characters, plus the fact that I really liked the Sensibility italic, made me go for Sensibility. </p>
      <p>I had one question considering the spacing: I think it sets very tight, so tight I might even consider spacing it out for longer texts. This is of course very economical, which is useful for a news face, but I wondered if it isn't more suitable for display than for text.</p>
