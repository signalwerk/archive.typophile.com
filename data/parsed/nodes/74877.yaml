      <p>Of course, a "strictly commercial logic" is a definition which has a large range of interpretations, but I meant a typeface designed with the commercial aspect as its priority, and all the others subsided to it.<br>
      Since it‘s commissioned by a publisher, it seems to me it may have suffered from a bigger pressure in terms of development time, and some constraints dictated by its intended usage. Mostly, I was thinking about your developed general criticism towards standardization, which these typefaces seem to escape.<br>
      My thoughts, mostly, nothing so rationalized.</p>
      <p>I think the main reason for which Sense is staying behind is that you have mixed its influences (the forms "skeletons") without a 100% of success in their integration. More or less like different traditions and cultures in the United States in the last 100+ years… :-)</p>
      <p>Said this, I have been happy to use Duffy Script and Goodchild, which I managed to have licensed by my "boss", and I think Goodchild should be remastered with small capitals and a good basic Opentype functionality. Duffy is a little messy in Opentype terms, but it’s one of your best faces with Oneleigh, Richler and Panoptica (the serif version). I would really love to have Richler on sale, but I understand it is exclusively licensed…</p>
