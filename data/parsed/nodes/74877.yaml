    html: |-
      <p>In my own mind, at least :-)</p>
      <p><em>Nick, would you have designed them, if not for the commission?</em></p>
      <p>No. The plain-and-fancy-sans concept was David Pratt's (who comissioned the types), which he saw in Ricardo Santos' Lisboa, and I developed to the specific needs of the Globe's redesign format. I had explored the super-family idea previously, in Eunoia and Panoptica, but in a quite different way. </p>
      <p>I don't know about "strictly commercial logic": so far in a month of release at MyFonts, Sensibility is doing quite well, but no one has licensed Sense! I would never have anticipated that, and would have expected Sense to be the more "commercial" face. That's only one month at one distributor, but it goes to show.</p>
