      <p><em>...there were some characters in Sense that I did not like so much, such as the spurless lowercase 'b', the lowercase 't' and 'u'...</em></p>
      <p>Those minimal forms are taken from Futura.<br>
      I chickened out on the dead straight "J"s, though!</p>
      <p><em>...it sets very tight, so tight I might even consider spacing it out for longer texts. This is of course very economical, which is useful for a news face, but I wondered if it isn't more suitable for display than for text.</em></p>
      <p>Yes, Sense and Sensibility are semi-condensed (like Myriad) and tightly fitted (like Helvetica), and the Regular is on the heavy side (like Gill). So they're quite the opposite of Verdana. But that's their personality. I would certainly consider experimenting with how you set them in text, or whatever genre. Despite their density, they seemed to work quite well for text in the Globe, where they also picked up a fair amount of press gain. Not for huge tracts of text, more for captions, decks and sidebars -- but I don't believe that suitability for extended immersive reading is the be-all and end-all criteria for text setting, certainly not for a sans serif.</p>
      <p>Sensibility does have some openness introduced by the tails on a, d, l and u.</p>
      <p><em> ...it may have suffered from a bigger pressure in terms of development time, and some constraints dictated by its intended usage. </em></p>
      <p>There was plenty of development time, fortunately. And constraints are useful in helping define functionality and usefulness. Erik Spiekermann takes this position too, IIRC. However, I wouldn't like to work with constraints all the time, and I'm fortunate to be able to do both commissioned work, and "unconstrained" retail projects -- self-publishing, which would be termed Vanity Press if I were an author.</p>
