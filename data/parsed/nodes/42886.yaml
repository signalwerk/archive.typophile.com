  html: |-
    <p>Hello,</p>
    <p>I'm a graphic designer and I'm trying to create a font where, while writing, each character will be randomly substituted by some other versions of the same character. So that for the "a" I'll have 3 different "a", for the "b" I'll have 3 different "b" and so on.</p>
    <p>I found some scripts in Typophile where it seems this would work (<a href="http://typophile.com/node/19625" title="http://typophile.com/node/19625">http://typophile.com/node/19625</a>), but i actually don't know how to make it work in Fontlab... :/</p>
    <p>I supose I have to create one class per character (in the "collection/classes" panel) where I put all the glyphs I want to use for the substitution and then (in the "opentype" panel) assign the script to each class. Is that it?</p>
    <p>Based on another .otf font, I tried to roughly repeat the proceadure just to see if anything happens (just tried to assign some script to the first class I created - please see image attached), but when I try to generate the opentype font it gives me an error "ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors".<br>
    I've checked, but apart from the UPM number, that I think has to be 1000, I have no clue of what I should be aware of...</p>
    <p>Could you please give me some hints on how to make it work?<br>
    I would really apreciate some help since I'm complete "new" on Fontlab and font design as well.</p>
    <p>Thank you so much in advance!</p>
    <p>Andreia</p>
