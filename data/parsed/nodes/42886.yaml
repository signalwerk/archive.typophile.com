      <p>Karsten, There is no escape except for monowidth fonts :-)</p>
      <p>I am finding that glyph drawing is the easiest and quickest part of type design. I have torn apart metrics and redone kerning a thousand times. With each redo, I learn something new and start again! The increments of change keep getting smaller as my vision gets more acute and my critical judgement becomes more unyielding--I feel I am getting closer to the carrot on the string but it is still not quite in my grasp :-/</p>
      <p>ChrisL</p>
