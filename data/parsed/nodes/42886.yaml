    html: |-
      <p>Hi,<br>
      A very simple way to make alternates visible is to put a lookup with something like this into the liga feature:</p>
      <p>sub [a c m s] a' by a.alt1;<br>
      sub [e i o t] a' by a.alt2;</p>
      <p>(means: after a c m s  glyph a is substituted by glyph a.alt1<br>
              after e i o t  glyph a is substituted by glyph a.alt2 )</p>
      <p>js</p>
