    <p>hallo, first post here !</p>
    <p>now, I know nothing about typography, so forgive me if I say/ask something stupid ... anyway, here is my question.</p>
    <p>Suppose I need to display single digit numbers for a very short time (&lt;1 s) on a good quality digital screen ( say, like an ipad screen ); sizes are fixed ( or slowly varying wrt other motions ) but the digits could be subject to geometrical continuously varying transformations while displayed ( like rotations, stretchings, ... ). What is the best font to maximize the ability of the viewer of recognizing the number ?</p>
