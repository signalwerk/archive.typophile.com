      <p>"this is something I may decide later"</p>
      <p>The problem is that there are legible typefaces in many different styles (or at least serif and sans). Finding an easily legible font is not the problem. You need to decide what feel you want first in order to narrow down the selection.</p>
      <p>Your approach, with all due respect, is a bit like painting a room and going to the paint store and asking which paints are the most durable (or whatever) before you've chosen a color. You want to be asking "which <em>orange</em> paint is the most durable" … or whatever. Make sense?</p>
