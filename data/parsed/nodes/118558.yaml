      <blockquote><p>Your approach, with all due respect, is a bit like[...]Make sense?</p></blockquote>
      <p>I understand your point and I would agree with you in most cases, but IMHO this is a different story. The problem is not legibility in a general sense, it's the specific requirement of designing digits to be recognizable ( not comfortably readable and/or estethically pleasing ) while moving/rotating.</p>
      <p>Imagine a NASA engineer asking you to design digits for zero-gravity labels ( say, in the international space station ) optimized to allow astronauts to "grasp" numbers even if upside down, or while rotating in mid air... would you really ask him first the "feel" of the typeface ?</p>
      <p>following your example, if the painting durability were my primary requirement then its color would be an irrilevant decision. Just to give you a concrete example, do you know those paintings used to protect the hull of boats from marine vegetation ? ideally, one would like to match the color to the main hull color, but sometimes this is not possible because some active ingredients in the painting already act as a pigment ... so, asking "which orange paint is the most durable" would just make them laugh at you in this case :)</p>
      <blockquote><p>I would think that any font that is very legible should work, but you really need to run tests.</p></blockquote>
      <p>yes, I'll do; probably, I will end up designing them from the ground up; after all, it should be just 10 isolated symbols in 2-3 different sizes ( eventually, I'll come back here if I have problems ) ... just hoped someone already did it for me :), thanks</p>
