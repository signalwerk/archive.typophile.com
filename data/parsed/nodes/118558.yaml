      <p>firstly, thank you for the answer :)</p>
      <blockquote><p>What style face are you looking for? What's the feel you're going for?</p></blockquote>
      <p>this is something I may decide later; the readability issue is my primary concern now in the sense that any non-readable solution would be unacceptable.</p>
      <p>Yes, they are isolated 0-9 digits; just to give you something to picture in your mind, consider a single digit "flying" around on an empty screen like if it were thrown on screen from a randomish angle from the outside, following a physical ( hence possibly rotating, 3d ) motion.</p>
      <p>Now, the problem is that ambiguous digits like 6 vs 9 ( so some kind of visual aid is needed, like an "underscore" fixing the orientation ( sorry, I don't know the technical term :) ) ), those resembing each other like 1 and 7, or those resembing each other when "spinning" like 0 and 8, 3 and 5 etc ... can make digit recognition hard. Is there some "general purpose" typographic trickery to minimize these sort of effects ?</p>
