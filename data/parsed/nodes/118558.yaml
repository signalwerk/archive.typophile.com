      <blockquote><p>If people have trouble reading it, adjust the timing to slow it down.</p></blockquote>
      <p>I've already done that and the result is acceptable, but still unoptimal; essentially, the timing and the "trouble" in recognizing numbers are part of the game mechanics, and the problem is exactly to trick the player without annoying him too much ( and confusing 6/9, or 1/7 happens to be annoying ) while preserving a "sophisticated" graphical touch. It's a perfectionism thing ...</p>
      <blockquote><p>Pick a legible font that fits the style of the game.</p></blockquote>
      <p>sure, but the converse may work too, ie fit the game style to the type face instead, as long as it's worth it, of course.</p>
      <blockquote><p>Therefore, it is necessary to place an underline beneath all figures, or use a device which treats top and bottom of glyphs differently, such as “top-heavy” or color.</p></blockquote>
      <p>I've already experimented with the "top-heavy" idea but I always ends up with either an inelegant "fat effect" or a pompous feel ( like a perspective deformation of some heavy-tall-column ) or some other "exaggerated" effect.</p>
      <p>the underscore is easy ( and it's my current solution, by the way ) but it gives an "engineer"-like feeling. This is not bad per se, indeed I can always give to the overall style a more "technical" touch instead.</p>
      <p>as already said, I need some more experimentation ... thank you everybody !</p>
