      <p>&gt; Imagine a NASA engineer asking you to<br>
      &gt; design digits for zero-gravity labels </p>
      <p>Astronauts don't read numbers upside down.  They are either seated or standing in a predetermined orientation.</p>
      <p>You're making this problem harder than it really is. Any legible font should work well as long as you use underscores (or some other method). </p>
      <p>Pick a legible font that fits the style of the game. If people have trouble reading it, adjust the timing to slow it down.</p>
