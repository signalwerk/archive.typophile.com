      <blockquote><p>Well, most of is illustrations are just clip-art, so I figured this wasn't his own font.</p></blockquote>
      <p>Don't yell it too loudly, some could be shocked ;) Kidding :) But you may be right. Thing is you posted this one twice and nobody identified it. Even Fivos' fantastic software '<a class="freelinking external" href="http://www.findmyfont.com" rel="nofollow">Find my Font</a>' was defeated.</p>
      <blockquote><p>Isn't Quaint made by James Lewis, by the way? Or am I missing something?</p></blockquote>
      <p>Jørgen Grotdal and James Lewis are both credited on this font (check 'owners', top of the <a class="freelinking external" href="http://www.behance.net/gallery/Quaint/15535095" rel="nofollow">page</a>). Both work for 'The Ligature Collective'.</p>
