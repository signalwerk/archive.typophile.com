      <p>I believe you can count with the fact that in the western hemisphere everyone (i.e.99.99%+) of the users who own a computer and have internet access (so that they can buy your fonts online/download them) will have software that works fine with OT, so no need for 256-character fonts there.</p>
      <p>On the other hand, for those users that live in the other part of the world and where probably still most, but by no means that high percentage has OT-aware swoftware, you Latin-1 encoded 8-bit font won't provide the necessary characters. Basically then you'd have to start building fonts for every arcane 8-bit encoding. No?</p>
      <p>Just philosophing.</p>
