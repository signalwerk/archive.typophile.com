      <p>I had the exact same concerns when deciding what to do for my site. But I have the luxury of not having any "baggage" in that I started fresh without any previously made fonts...</p>
      <p>As my speciality is multilingual fonts I needed Unicode support, so Postscript was out of the question. Yay!</p>
      <p>At first I though about only offering OpenType PS (the "professional" format of choice ;), but soon decided that this would leave out too many customers - you need TrueTypes for "Office" users (especially Powerpoint is finicky with fonts ;)</p>
      <p>Finally I decided to sell the the two formats separately - to prevent customers from installing both formats on the same computer and ending up with conflicts.</p>
      <p>An added bonus is that both formats can be used on both Mac &amp; Windows...</p>
      <p>So far it has worked out fine.<br>
      :)</p>
      <p>Roger</p>
