      <p>My present plan for future releases is to offer a basic .ttf font (with Latin Extended encoding) at low cost, and a full-featured .otf at higher price.</p>
      <p>It's a way of tagging different product versions without giving them different names</p>
      <p>The .ttf fonts aren't strictly speaking OpenType, but the difference is moot, as many .otf fonts don't have OpenType features!</p>
      <p>(When OS X was introduced, with functionality for Windows TrueType fonts, the benefit of OpenType in providing cross-platform compatability was considerably lessened; subsequently, the benefit of OpenType has come to be more associated with substitution features.)</p>
