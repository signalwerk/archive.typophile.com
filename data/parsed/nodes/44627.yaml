    <p>We're at a point as foundries that sell fonts primarily where it's reasonable to only offer OpenType PS fonts for download to customers but there are some that say we must also include TrueType as well since so many older apps don't support loading OT fonts so, faced with the prospect of updating my entire library in OT, do I cover all bases and include OpenType PS, Mac/Win PS, and Mac/Win TT for the respective buyers? Do I only over OpenType PS? Do I offer OpenType PS AND Mac/Win TT?</p>
    <p>The problem is, if I only offer OpenType PS, I'm likely to get e-mails from customers who can't use this format BUT if I offer all three I'm likely to get the same amount of folks who think nothing of dragging and dropping a single folder with all three font formats into Suitcase and none of 'em working so I'm trying to mitigate the difference.</p>
    <p>I'd like as many different perspectives on this as the group can muster so please share this thread around because I don't feel I'm the first foundry to have this concern.</p>
    <p>Thanks,<br>
    Stuart :D</p>
