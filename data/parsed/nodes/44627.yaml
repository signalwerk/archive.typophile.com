      <p>I'm just wondering about the same at the moment.</p>
      <p>Another point to consider: if you are selling opentype fonts: do you use encoded or unencoded "special" glyphs (like Smallcaps, alternate figures, ligatures, etc.)?<br>
      For really opentype-savvy applications, no encoding may be better (no chaos with manually inserted characters and changing fonts), but for everything else, which may support unicode, but almost no typographic features, it would be better to encode this characters to make them available at all...</p>
      <p>Do you just decide which may be better for most of the customers?<br>
      Or do you provide two different versions?</p>
