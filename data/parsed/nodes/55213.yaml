  html: |-
    <p>You go pimp the font albr55x.ttf with FontCreator 5.6 demo version to add a mapping to .null and add a nonmarkingreturn glyph.</p>
    <p>You will also add these glyphs here.</p>
    <p>U+EC11 if{1}<br>
    U+EC21 then{1}<br>
    U+EC31 elsif{1}<br>
    U+EC41 else{1}<br>
    U+EC51 endif{1};<br>
    U+EC12 if{2}<br>
    U+EC22 then{2}<br>
    U+EC32 elsif{2}<br>
    U+EC42 else{2}<br>
    U+EC52 endif{2};<br>
    U+EC70 start;<br>
    U+EC7E halt;<br>
    U+EC7F finish;<br>
    U+ECA1 while{1}<br>
    U+ECB1 do(1}<br>
    U+ECC1 endwhile{1};<br>
    U+ECA2 while{2}<br>
    U+ECB2 do{2}<br>
    U+ECC2 endwhile{2};<br>
    U+ED10 ai:=0;<br>
    U+ED11 ai:=ai+hi;<br>
    U+ED12 ai:=ai-hi;<br>
    U+ED13 ai:=ai*hi;<br>
    U+ED14 ai:=ai/hi;<br>
    U+ED1A hi:=0;<br>
    U+ED1B hi:=10*hi+p;<br>
    U+ED1C j:=hi;<br>
    U+ED1E mi[j]:=ai;<br>
    U+ED1F hi:=mi[j];<br>
    U+ED31 q:=ai&gt;0;<br>
    U+ED35 q:=ai&lt;0;<br>
    U+ED3F q:=not q;<br>
    U+ED80 p:=0;<br>
    U+ED81 p:=1;<br>
    U+ED82 p:=2;<br>
    U+ED83 p:=3;<br>
    U+ED84 p:=4;<br>
    U+ED85 p:=5;<br>
    U+ED86 p:=6;<br>
    U+ED87 p:=7;<br>
    U+ED88 p:=8;<br>
    U+ED89 p:=9;<br>
    U+EF71 x:=ai;<br>
    U+EF72 y:=ai;<br>
    U+EF73 r:=ai;<br>
    U+EF74 g:=ai;<br>
    U+EF75 b:=ai;<br>
    U+EF77 putpixel(x,y,r,g,b);<br>
    U+EC.. is for control structures of the program.<br>
    U+ED.. is for operations upon data.<br>
    U+EE.. is for events.<br>
    U+EF.. is for functions and graphics.</p>
    <p>You go to have Auto Naming named the font as Alberga instead of Albertus Medium and the font changed to Alberga.</p>
