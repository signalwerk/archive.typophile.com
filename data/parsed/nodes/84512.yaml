  html: |-
    <p>dear friends typophiles,<br>
    I am glad to present my new release.<br>
    Oksana Text Narrow is Oksana Text, narrower by 25%. Cyrillic and Latin, with real italics and swashed initials in six weights, is always slender.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/narrow_00_typophile_5466.png"></div><p></p>
    <p>please look at project page@behance:<br>
    <a href="http://www.behance.net/andrij/frame/1943273" title="http://www.behance.net/andrij/frame/1943273">http://www.behance.net/andrij/frame/1943273</a><br>
    and at the typefamily on myFonts ('Hot New Font' for now):<br>
    <a href="http://new.myfonts.com/fonts/andrijtype/oksana-text-narrow/" title="http://new.myfonts.com/fonts/andrijtype/oksana-text-narrow/">http://new.myfonts.com/fonts/andrijtype/oksana-text-narrow/</a></p>
    <p>thanks!</p>
