    html: <p>The bird prints wandering around the owlery were a nice touch, but my favourite gag was the half-dozen footprints quickly fleeing the stink bomb store room. <br> <br>I'm sure there are many jokes hidden in the writing on the walls[1]. I know that if I had to write hundreds of lines of unreadable latin, I'd include the names of friends and family, subliminal messages, the ending to the seventh book, etc. <br> <br>[1] In another scene, one of the doorframes is covered in runes. One rune that stood out was the <a href="http://www.deadkennedys.com/">Dead Kennedys</a>' logo.</p>
