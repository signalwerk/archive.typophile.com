    html: <p>If you can abide it, stick around after the movie; the credits are a 10-minute walk <br> through the "school grounds" trailing fading footsteps along a close-up of the map,  <br>past the hundreds of people involved in the production. I didn't have the stamina  <br>to seek out the amazing calligrapher who made the hand-lettered map,  <br>or who made the rustic font used for the titles, but I imagine there is a neat easter egg  <br>when the footsteps arrive there. The footsteps sometimes take on unique characteristics so watch closely....  <br> I found this one of the best parts (characters) in the movie. </p>
