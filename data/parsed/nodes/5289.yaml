  html: <p>Has anyone here seen <i>Harry Potter and the Prisoner of Azkaban</i>? There's a magical map in the film (and book) called the Marauder's Map. The film version is very cool. The whole map is, if I remember correctly, a calligraphic or typographic construction (it's meant to appear hand-rendered, but uses a lot of type forms). The map shows the grounds of the school, and the locations of everyone inside, but instead of line drawings of structures, the walls and rooms are made of words. <br> <br>You can see a few abbreviated versions on <a href="http://www.azkaban.com">the movie site</a>, but they pale in comparison to the one in the film (which is much more detailed). Has anyone else noticed this great prop? Any thoughts? Any other images?</p>
