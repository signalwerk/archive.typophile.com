  html: |-
    <p>I'm hoping I've posted this in the right section. (If not please move my topic! I would greatly appreciate!) I was talking a designer and that has never used the feature to lock the paragraph(in InDesign) to the baseline grid. I got to thinking because looking at the baseline grid right after you click the lock feature it ruins the leading set up. I know that you need to change the baseline grid first to adjust to the leading of the body copy text, but then I had this project where I made so many lines for the baseline grid in order to accommodate the text to fit the layout and not have the leading have wide gaps which would have given a lot of space between each line. I started to think is it really necessary to align text boxes to the baseline grid for page layout or is just modifying the leading and text size actually enough? Is there information about the why the baseline grid would be necessary or why we should lock the text boxes to it or why we shouldn't?</p>
    <p> What are your thoughts on this?</p>
