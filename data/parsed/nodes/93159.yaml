    html: <p>Other than defining a vertical rhythm, aligning to the baseline grid is especially useful in multi-column layouts.</p>
  - id: 510221
    user: 2021
    date: 2012-05-18T07:20:00
    date_raw: 18 May 2012 — 7:20am
    votes: null
    html: <p>If you have extra paragraph leading, or block quotes with less leading than the main body text, a baseline grid can create problems. Some facility with arithmetic is a job requirement for typographers :-)</p>
  - id: 510234
    user: 1461
    date: 2012-05-18T08:57:00
    date_raw: 18 May 2012 — 8:57am
    votes: null
    html: |-
      <p>The primary purpose of the grid is to make sure parallel columns' type lines up ala a newspaper or magazine article. </p>
      <p>Beyond that, it can be useful, but you also need to trust your aesthetic judgement.</p>
  - id: 510237
    user: 1215
    date: 2012-05-18T09:29:00
    date_raw: 18 May 2012 — 9:29am
    votes: null
    html: |-
      <p>I find a carefully considered baseline grid very useful for making aesthetic decisions and for assisting in precise work. But it is a guideline only, not a Procrustean bed; <em>locking</em> to baseline grid is too tyrannical for my purposes, and I usually recommend against it to designers I’ve trained.</p>
      <p>We’ve discussed this topic before (probably multiple times), so I won’t repeat myself. You can Google site:typophile for “baseline grid” and probably come up with several.</p>
      <p>Here’s one previous discussion that evolves into quite a discussion about baseline grids between Jan Schmoeger (paragraph), Charles Ellertson, and myself about various strategies we use (mostly for book design, in the case of Charles and me, anyway):</p>
      <p><a href="http://typophile.com/node/55212" title="http://typophile.com/node/55212">http://typophile.com/node/55212</a></p>
  - id: 510332
    user: 49049
    date: 2012-05-19T06:29:00
    date_raw: 19 May 2012 — 6:29am
    votes: null
    html: <p>Snapping to the baseline grid is just another tool in the toolbox. A big, heavy tool. And, sometimes, that's exactly what's called for.</p>
