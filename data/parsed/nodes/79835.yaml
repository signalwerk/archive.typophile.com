    <p>Hi this is my first post</p>
    <p>Im a visual Communication Student based in Dublin, Ireland. Currently working on an album for an Irish band SACCADE. Having trouble trying to convince the band to use my choice of type for the front cover (Trade Gothic|Baskerville). I love the arrangement and contrast of the two fonts and I see so much potential for the two typefaces when it comes to composition and layout of the booklet(lyics/thanks yous/personnel).</p>
    <p>Can anyone give me an honest opinion on what they prefer and why between these different arrangements, I wanna use the bands name in Trade Gothic/ &amp; album title in italicised Garamond. The band want to use a straightforward Trade Gothic|Trade Gothic. I think it looks bland and dead and im sorry I gave this choice at all.</p>
    <p>They have their hearts set on the purely Trade Gothic 'logotype' and i really do not wanna use it. </p>
    <p>Please give honest opinions what you think, its good/bad or complete rubbish! Anything will be of help.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/3_3804.jpg"></div><p></p>
