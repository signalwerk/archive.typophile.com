      <p>I thought this may have the look of a freebie techno design, in the popular Bauhaus-ish genre. I set the word ’Inventec’ as the sample text and scanned through the Techno&gt;Sci-Fi and &gt;Various categories at Dafont and came up with a similar font called <a class="freelinking-external" href="http://www.dafont.com/rezland.font?nb_ppp=50&amp;text=Inventec">Rezland</a> by Fraser Davidson.</p>
      <p>It’s not exact, but maybe some tweaking can get you close enough.</p>
      <p>- Mike Yanega</p>
