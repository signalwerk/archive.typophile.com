    <p>Hi all</p>
    <p>I'm a newbie so I hope this doesn't seem impolite for a first post. I am trying to recreate the John Craven's Newsround logo from the 1970s era and I'm struggling with the typeface used. </p>
    <p>Please see the attachment. I know that the words "John Craven's" are pretty much a version of Flash Bold but I am really foxed by the large rounded sans serif used for the main font: "NEWSROUND". </p>
    <p>The closest I can match it to is Houschka Rounded Extra Bold (very similar W and O glyphs) but the R and the D don't match. Also, this font wasn't created until the 1990s so it can't have been used in the 1970s. Have I stumbled across something that was likely hand-drawn? It seems unlikely, as the backdrop for each episode of Newsround had the days of the week recreated in the same font (and/or font outline). </p>
    <p>Any ideas/pointers would be gratefully received. </p>
    <p>Cheerio</p>
    <p>Steve</p>
