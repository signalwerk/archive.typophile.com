      <p>Hi</p>
      <p>Thanks, Nick! In the end I used a messed-around-with version of Houschka combined with elements of Frankfurter Inline. I spotted that the daily backdrops were the latter: </p>
      <p> <a href="http://sophieduffy.files.wordpress.com/2011/12/newsround.jpeg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Wednesday (note the standard Frankfurter Inline glyph for "W")</a></p>
      <p>I expect that the logo, being animated in a pre-computer era, was designed for a single on-screen purpose rather than to be easily reproduced elsewhere. </p>
      <p>Cheerio</p>
      <p>Steve</p>
