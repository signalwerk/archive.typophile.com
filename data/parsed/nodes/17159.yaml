  - id: 493503
    user: 52182
    date: 2012-02-01T18:05:00
    date_raw: 1 Feb 2012 — 6:05pm
    votes: null
    html: |-
      <p>&gt; This gives me an idea: maybe font weights should<br>
      be priced according to their distance from Regular?</p>
      <p>The first second or so after I read this I thought it was rather absurd, but there is some logic in there. I just wonder why Black or Thin should cost more than Regular. I think maybe the 3 master weights should be the same price and the further you get away from those, the lower the price gets.</p>
      <p>For example:<br>
      Thin — $25 (master weight)<br>
      Extra Light — $22<br>
      Light — $20<br>
      Regular — $25 (master weight)<br>
      Medium — $22<br>
      Semibold — $20<br>
      Bold — $22<br>
      Black — $25 (master weight)<br>
      Ultra Black — $22</p>
      <p>I don't know if it's normal to consider 'Black' the master weight when there is another weight thicker than that but that's besides the point. It only kind of works in very large font families though. I actually think if there will be variation in the price for fonts within a font family then they should be priced according to demand, shouldn't they?</p>
      <p>For example:<br>
      Thin — $20<br>
      Extra Light — $15<br>
      Light — $20<br>
      Regular — $25<br>
      Medium — $20<br>
      Semibold — $20<br>
      Bold — $25<br>
      Black — $20<br>
      Ultra Black — $15</p>
      <p>It actually kind of follows the system I just explained but it takes Regular and Bold as the primary and most essential weights and pretty much the further you go away from those master weights the lower the price because people just don't use them often; the exception would be 'Thin' because it's useful for display purposes. What do you think?</p>
