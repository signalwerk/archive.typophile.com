      <p>Thank you very much James for your comments and useful tips!</p>
      <p>I think using varying stroke width would do the job. Perhaps ink blobs would be to stretch it too far; I like the 'blown out' or 'eroded' look but I don't want it to look like it was actually hand drawn and scanned (perhaps this is not what you meant).</p>
      <p>The way I'll try to do it -- technically -- is to actually draw two strokes next to each other where I want i thicker line. These two lines may also differ slightly in angle.</p>
      <p>Just for reference I'm posting two ISO examples:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Nestler-ISO-stencil.png"></div><br>
      The first example is (obviously) hand drawn with a stencil, deliberately clumsy.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Autodesk-ISO-CP.png"></div><br>
      The second example is made in a CAD application in three different weigths, corresponding to the Miso weights.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Parasta ennen.png"></div><br>
      I'm also posting an example of some 'stamped on' numbers that I like.<p></p>
      <p>I'll do some more work on Miso...</p>
      <p>Thanks again! /Mårten</p>
