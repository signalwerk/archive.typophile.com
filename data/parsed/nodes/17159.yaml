    html: |-
      <p><em>I’m not convinced though about the idea of creating irregularities — do you think I would still be able to keep the geometric look?</em></p>
      <p>Definitely. It shouldn't be a problem as long as you keep the letter structures as they are. The finish (surface detail) can be modulated without flipping the design as a whole out of its basic genre. It will still be geometric as long as you keep the surface detail subtle.</p>
      <p><em>Something I would like to do is adding more colour to the characters without joints or corners e.g. ‘O’ and ‘S’ as they now all look too skinny. Any suggestions on how?</em></p>
      <p>Vary the stroke width on those letters a bit. You could make the variations abstract, or shape the strokes to look like natural variations in line thickness you'd get from a technical pen. Also try adding blobs: "O" can take a blob inline that would look like an accumulation of ink at the point where the pen started tracing, or where the pen stopped; the blob could be elongated (long). For "S", maybe thicken up the stroke in one part, along the diagonal spine or in one of the curves; or put a blob at either end of the stroke, one smaller than the other; or a combination of thickened stroke and blob(s).</p>
      <p><em>Do the weights work? Regular has the thickness approximately 1/10 of the Cap height = 60 units. Light=36 and Bold=96.</em></p>
      <p>The weights are good because they're different enough to make a clear difference in use. In a text setting the reader's eye would see a positive difference in weight.</p>
      <p><strong>Atom</strong> is much more "jarred", stylized and individual, but the stylization is a bit too forced or superficial for my taste. How much you jarr a font depends on how specialized you want it to be, and limits its uses. Your Miso is fairly normal (standard forms), and you might want to think about stylizing it more to make it stand out and give it its own unique appeal. But that will take time and experiment. One quick mod is to make some of the bowls on p, q, g different sizes; pull one or two of them up from the baseline; bowl letters don't have align exactly with the baseline and x-line; make the size variation small and people don't notice, but it helps make the font interesting. Also consider adding curls to some letters, like l, i, k, h, m, n, u. </p>
      <p>All the best with this face Mårten </p>
      <p>j a m e s</p>
