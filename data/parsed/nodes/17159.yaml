      <p>Prexactly, Miss Tiff. The other good thing about the grunginess is the impression of realism. Clean strokes aren't what you'd get from a real technical pen tracing a stencil. The blurry outlines are not true to ink &amp; pen effects, but they suggest those artefacts.</p>
      <p>The work required to make a clean version would be equivalent to rebuilding the font from scratch, producing a font that already has many rivals.</p>
      <p>One option you could try is reworking the irregularities to differentiate them. That will give you a more convincing pen-drawn look and increase the font's appeal and marketability.</p>
      <p>j a m e s</p>
