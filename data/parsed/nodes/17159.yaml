    html: |-
      <p>The light weight looks like the regular run thru a bold filter with negative paramaters, eg: vertical -20, horizontal -20, or similar. I like the regular and bold because they're true to the stroke you get from an ISO stencil traced with a technical pen. That's just my personal preference; they're more satisfying to my mind than the light. </p>
      <p>Miss Tiffany is right tho---the light weight is the most interesting, more visually stimulating and intriguing because the structures are alluded to with the loose-fitting "blown-out" finish, my term for that is usually "eroded".</p>
      <p>For the light weight I recommend reducing the goop in the crevices and nooks of the diagonals, and the <strong>t</strong> and <strong>f</strong> junctions. Make it just a bit cleaner without losing the eroded charm. It looks too much like the product of a bold filter in reverse; rework it to make it look like the work of human hands.</p>
      <p>The top bar of the Euro is longer in keeping with the defacto structure of Euro symbols. Extend it forward a bit more to exaggerate and make that structure clearer.</p>
      <p>One question to consider if this is going to be a commercial release: Are there many other ISO-style fonts around? I only had enuff time to find one --- <a href="http://www.myfonts.com/fonts/urw/isonorm/" title="http://www.myfonts.com/fonts/urw/isonorm/">http://www.myfonts.com/fonts/urw/isonorm/</a></p>
      <p>j a m e s</p>
