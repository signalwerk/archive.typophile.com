    html: |-
      <p>&gt; One does this normally with the x-height, rather than with the baseline</p>
      <p>Yes, because:<br>
      1) The baseline is more of a fixed thing in typography,<br>
      both visually and in terms of "protocol" so to speak.<br>
      2) There are more serifs (horizontal elements) on the baseline.</p>
      <p>BTW, when it <cite>is</cite> done at the x-line: it's to compensate for the optical illusion of darker forms looking shorter, not to somehow center things; and doing so causes the darker parts to be higher by a lot less than what centering would do (so most of the shift is towards the inside of the x-height).</p>
      <p>Here's a somewhat related discussion:<br>
      <a href="http://typophile.com/node/15204" title="http://typophile.com/node/15204">http://typophile.com/node/15204</a></p>
      <p>I think Mårten's idea could work -in fact well- if the font as<br>
      a whole is <cite>centered</cite> on a line, let's say at half the x-height.</p>
      <p>hhp</p>
