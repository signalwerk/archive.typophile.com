    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Miso.png"></div><p></p>
    <p>Dear Forum.<br>
    "Miso" is a lettering font intended for architects drawings. It is inspired by the standardized typeface "ISO", but with a blurred and yet geometric look. All three weights are derived from the same strokes - only line thickness vary.<br>
    I would very much appreciate comments on the glyph designs. (Haven't worked on spacing yet.)</p>
    <p>Thanks!</p>
