    html: |-
      <p>&gt;Where can I find them on line?</p>
      <p>They are available for purchase for both Windows and Mac on line at the the founderies--Fontbureau, etc.--and omnibus sites fontshop.com, myfonts.com, veer.com, fonts.com.</p>
      <p>Though there are various claims out there, there are no scientific tests that I know of for legibility of small type. You just have to look and judge for yourself. Or talk to the knowledgeable folks at the founderies. Some of the sites have PDFs that you can print out at size. But be aware that laser printers in general are not as sharp and clear as offset.</p>
