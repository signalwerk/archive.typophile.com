      <p>This thread interests me, because I am interested in fonts suitable for statistical work.  However, I don't recall seing any of the mentioned fonts being in my Windows equiped computer.  Where can I find them on line?</p>
      <p>I am bugged by the 6, 8 and 9 of the font used by my bank (Chase) which have round tops, round bottoms and something across the middle.<br>
      Arial, e.g., suffers from this too.   I need a font for digits whose ascenders and desenders are not bent over -- even slightly.</p>
      <p>It helps if recommendtations are accompanied by reasons. I see few above.  Just liking something isn't as good as liking because...</p>
      <p>Where can I find the resuls of font legibility comparisons?  Who does it?</p>
      <p>===gm===</p>
  - id: 163608
