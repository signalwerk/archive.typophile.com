    <p>Hi,</p>
    <p>I am looking for recommendations for a typeface to be used for a price list. The size will have to be very small (about 6pt or less).</p>
    <p>I am looking for a clean, modern, even slightly futuristic look for this pricelist.</p>
    <p>Any recommendations? Readability is important...</p>
    <p>Cheers<br>
    Hug</p>
