    date: 2007-07-11T22:25:00
    date_raw: 11 Jul 2007 — 10:25pm
    votes: null
    html: <p>Probably, they are big H&amp;FJ fans. Alternatively, there's <a href="http://www.fontshop.com/fonts/downloads/red_rooster/block_gothic_extra_condensed/&amp;sample_text=DEATHS%20INTERPOL%20MACHINE&amp;sample_size=60" rel="nofollow">Block Gothic</a> which is only slightly more square.</p>
