    <p>Hello!</p>
    <p>I really love the shapes of the serif fonts like - Fortesque, Lancet Wounded by Sang Mun, Feasby Semibold by Raf Rennie or Permeke Semi Bold by Josse Pyl. I'm looking for some similar fonts with this specific type of style, which are available for purchase.</p>
    <p>Anyone has some good tips? </p>
    <p>Thank you</p>
