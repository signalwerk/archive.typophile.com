      <p>Two possible factors:<br>
      – It's a knee-jerk reaction against our glossy, polished daily lives.<br>
      – Making fonts is hipper than ever, but making a whole one from scratch is hard as always. So you take an existing font, "customize" it with some slipshod artsy modifications, and try to get famous.</p>
      <p>hhp</p>
