      <p>I don't think that I would call it art because there are usability factors involved, I prefer the term design. I don't feel as though I am "expressing myself" as much as taking a crack at solving age-old problems in my own way. Like both Mark and Nick, I like the open ended struggle with form without client. Some day perhaps my children may profit from it but quick big bucks don't come from early ventures into retail fonts. Mark and Nick have both been at it much longer than I so they are seeing light while I am just seeing tunnel :-)<br>
      I spent 45 years working directly with clients so I am now enjoying toil in their absence.</p>
      <p>ChrisL</p>
