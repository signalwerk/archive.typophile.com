      <p>What he's saying about retail fonts as "no way to make a living" is probably true for a lot of type designers, but not all of them (and I wonder if it's still true for him since he wrote that).</p>
      <p>I do have the impression that many, if not most, full-time type designers get their bread and butter from commissions, with income from retail fonts being supplemental. It's the other way around for me, and I feel lucky for that, because I do prefer working on my own ideas without the constrains of a commission. Not to say commissions are necessarily bad. Deadlines and briefs have a way of providing clarity and purpose to a project. And you definitely get paid sooner.</p>
