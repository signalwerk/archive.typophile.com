    <p>Are retail fonts a form of consumerism or a way for designers to work free from the constraints of a commission?</p>
    <p>Here's what Nick Shinn wrote in Issue 6 of the Graphic Design Journal published by the Society of Graphic Designer of Canada in 2006:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/P1130815_6591.JPG"></div><p></p>
    <p>I mean look at <a class="freelinking external" href="http://www.flickr.com/photos/wasianed/2475328845/in/set-72157602459000103/" rel="nofollow">this</a>. These industrial revolution era fonts were designed by foundries which by then were independent of printers and publishers and used in the most commercial ways. They are more interesting to us today than the commissioned Times New Roman.</p>
    <p>What do you think of retail fonts?</p>
