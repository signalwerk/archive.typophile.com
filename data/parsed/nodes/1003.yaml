    html: "<p>Hey Lars: I would tell you my workflow secret...but then I'd have to kill you. <img src=\"http://www.typophile.com/forums/messages/4101/14569.gif\" alt=\"\"> <br> <br>Actually, it's no big secret at all. At least not for me. Everyone has a different approach to designing fonts and there is no ONE WAY of doing things. My personal preference is to start on paper. I usually don't sketch out the entire library. I normally just do 10-12 key characters. After scanning the sketches, I use them as a template in Illustrator where I do a bulk of my drawing. (I posted my Illustrator files earlier in this forum). <br> <br>I normally try to finalize my drawings here before importing into FontLab. I don't like to jump back and forth. Just recently, I have been using ScanFont to copy the glyphs from my Illustrator file to FontLab. This seems to work very well as it sizes each glyph properly then places them in their corresponding FL cells.  <br> <br>Once in FontLab, it's usually just a matter of adjusting the metrics, kerning, and some of the outlines. I made this sound easy but for me, it's really the most painful part of the process. <br> <br>This is just one method for designing a font. It may not be the \"proper\" way, but it works fine for me. I am always learning new methods and techniques...mostly from the intelligent folks here at Typophile!! <br> </p>"
