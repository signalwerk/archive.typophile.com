  html: "<p>hi. i hope this is no best kept secret: <br>i was wondering about your workflow. like how to do start when designing a new digital font. draw it by hand, which sizes, which pens, digitize it or build it from scratch in illustrator, fontlab, fontographer, how you test the single letters for use in words and so on ... i just started my first sketches on my first font i like to digitize and i still have no a idea what would be an productive workflow for doing so. everyone gotta learn but i dont wanna go through all possible bugs, gaps and errors everyone else has gone trough before. if this is a well kept secret i'll fully understand it and would take some book sugestions instead <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> thanks in advance, lars</p>"
