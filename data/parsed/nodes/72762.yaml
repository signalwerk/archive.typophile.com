    html: |-
      <p>Oldnick is right, the sign similar to a qz contraction is a <strong>que</strong> ligature used at the end of the words in late Latin (mostly Medieval). You may find que and qua in the middle of words, where the ligature is not used.</p>
      <p>You may do a Google search about any of these words using [ue] at the end –like atq[ue]. The [ue] is a graphical standard to this ligature.</p>
      <p>The other is a <strong>ij</strong> ligature. Accord to the age of document or inscription, you may find it as ii or ij. This is because J does not exist in early Latin, it was added much later. So there are IUS and JUS in different Latin inscriptions.</p>
    html_clean: |-
