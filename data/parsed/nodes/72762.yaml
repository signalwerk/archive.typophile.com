      <p>Very interesting, Nick. This ff. is a Latin abbrevation to something like "in the next pages folows".</p>
      <p>It makes sense with the text before, "in cap. 5." (or "in C. 5.", as in the JanekZ image). So the text is actually copying parts of old Justinianus Codex and point that in its capt. 5 follows the text "D: caus. poss. ..." (De causa possessione).</p>
