      <p><cite>And you can assert this because...</cite></p>
      <p>...in a code of Laws wrote in Latin they simply did not use procedures like improvised marks. This kind of book was intended as a reference for elite readers. Its nature was outside the range of publication were typographers from 17th Century use to adapt another type to a new function.</p>
      <p>Do not understand me wrongly. I'm not saying that section mark –or ANY mark– was not subject to improvisation or experiments. But for this kind of text, this was not usual.</p>
      <p>This <em>may</em> be a section mark, the context where it was applied suggest this. But it does not seem to be a rotated x with two dots. Instead, it seems to be a cut made for this purpose and thus would be found in other texts.</p>
