      <p><strong>JanekZ</strong>: a possible test to see if this is a sign to replace ff. is to verify if there are any "normal" ff. in the text. As there are many ss in Latin, printed with long s, the ff. sigla may cause confusion with ss. Thus it would originated this <em>x</em>.</p>
      <p><strong>Strass</strong>: Q is followed by u in all cases also in Portuguese. See you: I made a reference about Quiroga and its ligatures in the first version of this message... and then released you're the Quiroga designer!</p>
      <p>This is a fascinating investigation. An useful article about Latin abbreviations is available in <a class="freelinking external" href="http://en.wikipedia.org/wiki/Scribal_abbreviation" rel="nofollow">Wikipedia</a>.</p>
