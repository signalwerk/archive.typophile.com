    <p>So I've been trying to solve this problem for awhile now. I've searched through various forms, and everyone has the same few tips to offer, and of course none of them work.</p>
    <p>Does anyone here have that problem? When outputing .pdf files black appears as a grey. It's driving me crazy. No matter how I adjust appearance of black settings or my rich black portions It still screws me every time. My recent hack has been to simply set all my blacks to "registration" but obviously that's not the right solution.</p>
    <p>Am I missing something obvious? From what i've found from others, this is a big problem. I hope cs3 will fix this.</p>
