    votes: null
    html: |-
      <p>Colourmanaged output will vary according to the outputprofile. Eg in newsprint dot gain (the amount that inkt will spread when printed on that specific substrate) can be up to 20% or more. That means that the original values of tints etcetera will have to be corrected to account for this. Outputting with a newsprint profile could lead to a full black being output as an 80% blacktint.</p>
      <p>The same principle applies to other substrates and press techniques.</p>
      <p>Re printing standards: In Europe offsetprinting has been standardized according to an ISO-norm, set by the European Color Initiative. More info here:<br>
      <a href="http://www.eci.org/eci/en/041_offset.php" title="http://www.eci.org/eci/en/041_offset.php">http://www.eci.org/eci/en/041_offset.php</a><br>
      Put simply: working with ISO-certified printers and the standard profiles from ECI guarantees satisfying results, irrespective of press profiles and such (those are used in house by the printers).</p>
      <p>I don’t know what the situation in the US is nowadays, but a couple of years ago standardisation was strictly something done by the major printing companies (and publishers that use different printers).</p>
      <p>___<br>
      Bert Vanderveen BNO</p>
