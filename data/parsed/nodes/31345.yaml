      <p>Well, you see, basically the problem is the following: Your pdf is perfecly good for offset separations but it still prints as approx. 80% gray on a laser. </p>
      <p>The solution is extremely simple if you have Pitstop in Acrobat (you have a default action "Convert Color to Gray and keep Black text" :) additional steps and gray color profile <a href="http://www.penpro.rs/" title="http://www.penpro.rs/">http://www.penpro.rs/</a> [google translate to english, it's currently available only on serbian :)])</p>
      <p>If you don't have Pitstop, there is an other solution: From Indesign (any version) print to .ps file with separations enabled, turn off CMY plates, leave just the black channel. Destill the ps file and voila... you are good to go, the pdf now prints 100% black.</p>
      <p>One more solution: Open pdf in Acrobat, select file&gt;save as&gt;postscript(*.ps), click settings to the right, under Output-&gt;Color:separations, ink manager: turn off CMY, leave just Black on. Click OK, Save. Distill the file, and once more you are good to go.</p>
      <p>Explanation: From the aspect of laser printers, there is a great difference between CMYK and gray colors. C0M0Y0K100 isn't black (its stupid, but thats the way it is), only Gray 100% prints as 100% black (RGB translates depending on printer color profiles etc. its not convenient color mode for solving this problem). Turning on separation when printing, automatically creates grayscale mode PDF, so it solves the problem above :))<br>
      One more thing, with the Touchup object tool select the text line, right click and select properties, if under the color tab the Color Space is Gray or DeviceGray it will print correctly. Just to don't waste more paper than you must :)</p>
