    html: <p>When you have a value of 0,0,0,100% (C,M,Y,K) as your black, it won't show up as the deepest black in print (though it's not bad).  Acrobat reveals this fact, as it tends to be a print previewer of sorts (don't quote me on that, but I do use the program to double-check if I missed a black value here and there).  The printers I deal with usually would add 65% to the cyan values to make it deeper (when printing full color).  If you want the deepest of the deep, just set all CMYK values to 100%, it's just much more difficult to register, especially say, if you have type set in 6pt, light, in white, on top, of that.</p>
    html_clean: <p>When you have a value of 0,0,0,100% (C,M,Y,K) as your black, it won't show up as the deepest black in print (though it's not bad).  Acrobat reveals this fact, as it tends to be a print previewer of sorts (don't quote me on that, but I do use the program to double-check if I missed a black value here and there).  The printers I deal with usually would add 65% to the cyan values to make it deeper (when printing full color).  If you want the deepest of the deep, just set all CMYK values to 100%, it's just much more difficult to register, especially say, if you have type set in 6pt, light, in white, on top, of that.</p>
