      <p>&gt; <em>Just 100%K is going to print 80%k.</em></p>
      <p>No, it will not. 100K will obviously print as 100K. However, optically it doesn't look pitch black, because offset inks <em>aren't completely opaque</em>, making the printing surface shine through a little.</p>
      <p>In full color jobs you can indeed make the black more pitch black by using what has already been mentioned as 'rich black', which is a blend of all four colors (e.g. 30/40/40/100 or similar). This will make the ink-coverage nearly opaque, resulting in a dark black. Obviously you <em>shouldn't do this</em> when you are working on something that will be printed in black and white (i.e. one color, K only), because rich black will produce four printing plates instead of one. It's usually best if you only apply rich black to larger surfaces, because very fine details could in some cases cause registration problems.</p>
      <p>As has been said before in this thread, if you use 100K, the PDF will show that as a very dark grey. This is not a bug, but intended behavior for prepress purposes, so please stop calling it a 'problem', because it isn't. If you want really dark blacks in your PDF's for <em>screen purposes only</em>, export it as RGB or temporarily make the black a rich black.</p>
      <p>The blend you use for rich black determines what 'shade' of black you will get. I.e. more magenta and yellow will result in a warm black, while more cyan will make a cool black.</p>
