      <p>@kurt:</p>
      <p>Looking at colour values in the RGB PDF is a distraction - you're specifying your colours in CMYK and printing them in CMYK (or just K).</p>
      <p>CMYK and RGB colours aren't just different numerical ways of specifying a colour - c0 m0 y0 k100 does not equal r0 g0 b0, and you can't just convert to and from RGB and CMYK.</p>
      <p>As Quincunx says, separations make it clearer what your end result is going to be, because they show what ink is actually going to get laid down.</p>
      <p>So I always send a composite CMYK PDF to the printers, and if there's anything other than CMYK in the art, PDF separations as well.</p>
