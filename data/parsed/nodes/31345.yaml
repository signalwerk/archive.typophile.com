      <p>Just a couple of notes:</p>
      <p>Setting black elements to "registration" will print as a 400% rich black (full CMYK) on color PostScript devices. As this is well over the total ink limit, it's will look like crud (even on toner-based devices such as PS color laser printers).</p>
      <p>I agree with the posters who are saying that the Acrobat PDF display is "not a bug." Have you ever studied color management at all? For pre-press purposes, the whole point is typically to maintain visual distinctions and map the entire gamut of one device to another. If Acrobat displays a 0C-0M-0Y-100K black as the darkest possible black, what it is it supposed to do with a 100-100-100-100 black? (Okay, maybe it's a 30-30-30-100 black, same idea - it needs to be darker than that previous black.) If you make the PDF in RGB, with the right settings, presumably you can get a 0-0-0 RGB black, and that's the darkest black, period. It will display great on screen. It will print on color devices as a maximum rich black, though, which may or may not be desirable.</p>
      <p>You could also try in Acrobat going to Preferences &gt; Color Management &gt; Conversion Options turning off "Use black point compensation, and see what effect that has.</p>
      <p>Note also: If you are having a problem with your black looking grey *in print*, in many workflows the best solution when making documents in InDesign is to go to Edit &gt; Color Settings and under "Color Management Policies" set CMYK to "Preserve Numbers (Ignore Linked Profiles)". This essentially turns off color management for CMYK elements in the document, such as text.</p>
      <p>With that configuration you can still place RGB photos and have them properly color managed (set RGB to "Preserve Embedded Profiles"), and Bob's yer uncle. Leastways, this has always worked well for me in InDesign.</p>
      <p>Regards,</p>
      <p>T</p>
