    html: |-
      <p>To save a PDF with Rich Text from InDesign go - Export/Save/Output -</p>
      <p>Then Select:<br>
      Adobe PDF Preset: "[Smallest File Size]"<br>
      Destination: "Working RGB - Apple RGB"</p>
      <p>Note this is NOT for printing rather for sending PDFs to clients for approval.</p>
