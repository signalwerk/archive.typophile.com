      <p>Jeronimo - these mixtures you site are simply what different color profiles convert pure black from RGB into. They are not "recommended" at all. Do the math - c75 y68 m67 k90 simply adds up to 300% total ink, which is the ink limit if you are using SWOP  V2 (the most popular magazine color space). It's been the same in PS for a long time and still is - do the math on your other mixture - c88 m79 y65 k93 = 325 total ink. You have changed your color profile, that is all.</p>
      <p>Rich black is typically K=100 with undercoating, that is because ink is slightly transparent. If you want to know what "temperature" your undercoating is - look to the left of the color sliders in Photoshop and you can see it. If you want your undercoating completely neutral - make sure that CMY are equal. I have never seen a valid reason for anything more than 240% - that doesn't mean a reason doesn't exist.</p>
      <p>pbc</p>
