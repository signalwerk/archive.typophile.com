      <p>I create a lot of documents that are used in both print and web.  I create in AI CC CMYK.  If I'm sending an item for print, I'll create the PDF and send it as an attachment.</p>
      <p>But for web or email use, I use EXPORT (under file) on the existing AI CMYK document and then select JPEG (or whatever image type you want for web use) and set is RGB and maximum quality.  When I send these to my clients, I always let them know one is for web (for embedding in emails, etc) and one is for print (pdf) and not to mix them up in those uses.</p>
      <p>I have to say, most of the comments on this thread are awfully snarky.  Those of you who know what you're doing could dial the arrogance down a tad and see if you can simply answer the effing question.</p>
      <p>--m</p>
