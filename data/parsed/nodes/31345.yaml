    html: |-
      <p>Printing problem in Indesing CS4:<br>
      My black text turns out grey (dotted)</p>
      <p>I read a lot about 'turn off' color management.<br>
      In this forum Thomas Phinney came up with:<br>
      "Note also: If you are having a problem with your black looking grey *in print*, in many workflows the best solution when making documents in InDesign is to go to Edit &gt; Color Settings and under "Color Management Policies" set CMYK to "Preserve Numbers (Ignore Linked Profiles)". This essentially turns off color management for CMYK elements in the document, such as text."</p>
      <p>But can't find the solution in my CS4 version of Indesign.</p>
