      <p>As a previous poster mentioned, DON'T set your blacks to be 100c100m100y100k. Most printers have maximum density (dmax) value -- the sum of all the percentages of the 4 process colors -- somewhere in the low 300s.</p>
      <p>"Rich" black recipes vary by printer -- be sure to ask yours. Our magazine printers prefer a 40c20m20y100k blend.</p>
