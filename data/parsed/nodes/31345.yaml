      <p>Why is everyone calling it a 'problem'? :)</p>
      <p>It is not a problem; it is just the way CMYK or K black looks on screen.</p>
      <p>If you chose black (K), it will print as black. If you don't trust it will, check color separations in Acrobat (or photoshop). If your PDF is for screen only, you could make the black RGB.</p>
      <p>And if you want a true, rich black in print; add some color to K, e.g. 0C 60M 30Y 100K (I think this will also look more black on screen. And is obviously only suitable for full color print jobs).</p>
