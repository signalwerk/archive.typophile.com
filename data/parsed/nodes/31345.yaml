      <p>I have this same problem. PDFs created from InDesign print on a Laser Printer with a half-tone screen (though dark… somewhere on the order of 95% screen) even though the CMYK value is 0,0,0,100. When I print to the same printer directly from InDesign file, it’s solid. They also display as a dark grey as well in PDF, but like the poster above, I don’t really care how it looks on screen.</p>
      <p>I know what it’s trying to do… it’s trying to emulate the way black by itself looks like when it is printed on an offset press—not so black. To do that on a digital laser printer, it screens the black ever so slightly so it looks grey.</p>
      <p>I’ve done a lot of trouble-shooting with this too to make sure that the error is in InDesign. I’ve got PitStop and can select the shape in Acrobat that is printing as a screened half-tone to view its values and its values are 0,0,0,100 but it still prints as a screen. I’ve created a shape in Acrobat and gave it the same fill values of 0,0,0,100 and it prints solid. So, one created in Acrobat doesn’t simulate offset black-only black. So, something in the PDF made from InDesign tells it to simulate offset cmyk black only printing. Thanks Adobe!</p>
      <p>In InDesign, I do have the preference "Appearance of Black" for both the “Screen” and “Printing / Exporting” set to Rich Black, but changing it to any combination doesn’t seem to effect the problem I am having. For some reason, when I export to a PDF, it seems to ignore that setting.</p>
      <p>There are work-arounds that let me do what I need, but I’d like to learn why it’s doing what it is doing and how to tell it not to do that.</p>
      <p>Thanks</p>
