      <p>In InDesign go to Preferences &gt; Appearance of Black. The thing you find is some options: On Screen, Printing / Exporting and Overprinting of Black.<br>
      From the menu you can choose two options each time: "Display All Blacks as Rich Black or Display All Blacks Accurately" If you work with the first option, the 100% black is presented by InDesign as "Rich Black" (that is a mix of CMYK colors, presented for the eye as black, so not 100%K). When you choose the second option (accurately) you notice that the 100% black is actually darkgrey for the eye.<br>
      This has nothing to do with exporting with PDF/x standards or none. If exporting in RGB the pdf just fakes the 100% black to rich black on the screen. So exporting with PDF/x standard in CMYK is accurate. When printed it is still darkgrey, and when imported again in Photoshop or InDesign you can see the black is still +/- 80%K instead of 100%K.</p>
      <p>Here are some different settings for rich black:<br>
      63C, 52M, 51Y, 100K<br>
      30C, 20M, 20Y, 100K<br>
      60C, 40M, 40Y, 100K</p>
      <p>This solved my problems.<br>
      If you want 100% K black to print on top of the CMYK colors uncheck "Overprint [Black] Swatch at 100%". Or else it will become transparant.</p>
      <p>This website was helpful to me, check it out: <a href="http://www.graphic-design-employment.com/over-printing.html" title="http://www.graphic-design-employment.com/over-printing.html">http://www.graphic-design-employment.com/over-printing.html</a></p>
