    html: |-
      <blockquote><p>Is SchoolText a freely-available font?</p></blockquote>
      <p>Unlikely. It's apparently been bundled with other products such as ClarisWorks and (as such fonts often do) has made its way into the archives of some mass font repositories. I don't know of any legitimate source to download it, but it <em>is</em> part of the School Font Collection CD (<a class="freelinking external" href="http://www.halfhollowhills.k12.ny.us/uploaded/PDFs/Technology/sf.pdf" rel="nofollow">PDF link</a>) which is available from several online vendors. <a href="http://goo.gl/zrghu" title="http://goo.gl/zrghu">http://goo.gl/zrghu</a></p>
