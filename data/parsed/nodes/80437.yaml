    <p>Hi,</p>
    <p>I have a problem with the /ff/ ligature in a particular typeface. when /ff/ is automatically replaced with a ligature in InDesign, there appears a gap to the next letter, except for those combinations for which other ligatures exist, like ffi and ffl. I contacted the designer over this and he said I should just turn of ligatures for this combination. </p>
    <p>I tried to do the following: I turned of ligatures, and instead inserted them manually through search/replace. This is a bit of a hassle but works. But I would prefer using ligatures as a default, and only to turn it of for the combination /ff/, but not for /ffi/ and /ffl/. Is there some way to change the one without changing the other? Perhaps some kind of either/or code? I work in CS2, so no GREP styles available yet...</p>
    <p>Thanks a lot!</p>
    <p>Jeffrey</p>
    <p>PS I don't want to discredit the designer for this, which is why I don't mention the name of the font here.</p>
