    html: |-
      <p><cite>I could ask if I'm allowed to edit it, but I'm afraid I might break more than I would fix . . .</cite></p>
      <p>You could add a series of ff and single character kerns to the kern feature ahead of the class kerning. That way they are exceptions, and won't break anything. I can't imagine that kerning would generally be a part of the "no modification" clause, else InDesign's optical kerning (and any plug-in), and Quark's kerning routine would break the EULA. The only "no kerning changes" EULA I've ever seen was in one of Porchez's font licenses.</p>
