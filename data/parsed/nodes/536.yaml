  html: "<p>FOR IMMEDIATE RELEASE <br> <br> <br>Adobe Converts Entire Type Library Into OpenType <br> <br> <br>First of Three Sets Released; InDesign Users to Benefit from Rich <br>Typographic Capabilities <br> <br>SAN JOSE, Calif. - April 29, 2002 (NASDAQ: ADBE) - Adobe Systems <br>Incorporated, the leader in network publishing, today announced that more <br>than 650 converted Adobe® Type Library (ATL) fonts are now available in <br>OpenType® format. The converted fonts will provide users with improved <br>cross-platform document portability, simpler font management, and enhanced <br>glyph coverage. Today</p>"
