    html: "<p>&gt; natural kerning ligature <br> <br>It's certainly a good idea to make your \"f\" &amp; \"i\"/\"l\" glyphs in such a way that they join together nicely without anybody doing anything special, but of course because of possible tracking/justification adjustments you can't count on that entirely. <br> <br>BTW, when I was designing Patria I came to the realization that too often the \"fi\" and especially the \"fl\" are forced to join up unnaturally, when sometimes they shouldn't. Although I'm actually ambivalent about the current state of Patria's \"fi\", I'm happy with my unorthodox solution with the \"fl\", and I feel that the conventional approach (like you have up there) can ruin the texture of a setting. Consider ligatures with modified individual letterforms but no joining. <br> <br>Another serious issue with ligatures is that tracking can ruin things* - just look at Gulliver's \"fi\"/\"fl\" in USA Today. <br> <br>* Although I think OpenType allows the choice of ligature substitution based on tracking? <br> <br>&gt; hideously overdone <br> <br>Yes! And this is exactly why a good -I mean a really good- text face must look ugly in large sizes... strange but true. You simply cannot have both. <br> <br>&gt; anal linebreaking <br> <br>We compared dumbness on Typographica, now let's compare anality here... Question: Do you re-write [parts of] your posts to get a nice right rag? <br> <br>hhp <br></p>"
