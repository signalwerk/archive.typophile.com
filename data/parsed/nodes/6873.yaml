    html: "<p>&gt; Hrant, with all his blah-blah-blah .... <br> <br>Very funny...  :-) <br> <br>If you compare my text on Typo-L for example versus here, you'll see that in the former I craft my paragraph-boumas :-) very meticulously, but in the latter I let the chips fall where they may (except to prevent orphans, usually). There's a very good reason for this: on Typophile you type in a monospaced font, but the viewing is done in a proportional one! This means that any attempt at getting a nice right rag would require an exhaustive iteration of correction/previewing. And sorry, I already spend enough time around here! <br> <br>Question: do you think it's better if I just chopped the lines up (while I'm typing) at a certain limit? Ths would result in nice short lines, but a (usually) horrid right rag. <br> <br>hhp <br></p>"
