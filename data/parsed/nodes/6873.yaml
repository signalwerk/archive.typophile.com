    html: <p>Miguel -- <br> <br>A promising start. Very nice letters. The abrupt curves are reminiscent of the explorations of W.A. Dwiggins with his Experimental No. 233 and his theory of the M-formula. Tiffany may chime in with more on this. <br> <br>I think this kind of treatment can be effective at very small sizes and at display sizes, but there's a middle range of text sizes where it can be tricky. You may find when your letters go from being outlines to being actual text that you need to move the corner further around the curve to prevent the x-height line from being spotty. <br> <br>I think the arch of your 'f' may be difficult to fit. I also think the top of the arch should be thinned a little. And I feel that the top of your 't' should be a little more pronounced. <br> <br>-- K. <br> <br> <br> <br></p>
    html_clean: <p>Miguel -- <br> <br>A promising start. Very nice letters. The abrupt curves are reminiscent of the explorations of W.A. Dwiggins with his Experimental No. 233 and his theory of the M-formula. Tiffany may chime in with more on this. <br> <br>I think this kind of treatment can be effective at very small sizes and at display sizes, but there's a middle range of text sizes where it can be tricky. You may find when your letters go from being outlines to being actual text that you need to move the corner further around the curve to prevent the x-height line from being spotty. <br> <br>I think the arch of your 'f' may be difficult to fit. I also think the top of the arch should be thinned a little. And I feel that the top of your 't' should be a little more pronounced. <br> <br>-- K. <br> <br> <br> <br></p>
