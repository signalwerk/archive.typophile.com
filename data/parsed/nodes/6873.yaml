    html: <p>I'm curious about why you changed the direction of the <br>slant on the baseline serifs. Slanting the serifs backwards <br>like this feels uncomfortable to me. Rather than saying <br>"onward! onward!" like I believe a good text face should, <br>it seems to suggest that I slow down. <br> <br>I agree with Claudio that the bezier samples (fl &amp; fi) lose <br>the charm of the sketches. The corner on the underside <br>of the f has disappeared and the alert angular right side <br>of the arm now has a droopy curve on the underside <br>instead. <br> <br>Your sketches are beautiful and deserve care in digitization.</p>
