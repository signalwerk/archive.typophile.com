    html: "<p>Well. I'm surprise my ears didn't burn right off of my head. <br> <br>This is really a good start fun a super chunky (read: texture, not boring) typeface. I hope you are planning <br>to do a display and text size (at least). So many faces  <br>today are so round and smooth and soft and boring! <br>Maybe that is why I am drawn to the work of Dwiggins, <br>because his faces were all irregular (to a point). <br> <br>Here's the biblio info for Gerard Unger's article: <br> <br>Unger, Gerard, ‘Experimental No. 223,’ <br>Quaerendo Volume XI, Number 4,  <br>Autumn Edition (1981) pp. 302-24. <br> <br>You might also take a look at Mr. Unger's work, he has interpreted the m-formula (in his own way) into his designs. <a href=\"http://gerardunger.com/\" target=\"_blank\">http://gerardunger.com/</a> <br> <br>Kent, you can do the talking. Miguel, Kent is the man. He can explain much better than can I. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Miguel, email me, I think I might have something of interest for you.</p>"
