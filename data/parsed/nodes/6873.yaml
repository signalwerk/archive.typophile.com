    html: <p>The modulation treatment is great, Miguel. <br>It embraces both calligraphic and geometric approaches, which is a thing many people have done, but you've managed to keep  it very distinct and original. <br>I don't know if the fi fl examples are your first attempt in drawing text type in bezier, but to preserve the strenght o your original drawings I would suggest to create loose grid background (I mean even single circles or segments where it's appropriate) as a basis to draw the letters. <br>Many letters have an excellent and unique treatment. The g shines, the Q is great, and the s is very distinct, too. <br>At this point (after the pencil detailed "sketches" I would not look too much at existing faces for their form. You may look at them for points and handles positioning/relationship, anyway. <br> <br>I say all this because the fi fl samples seem to lack the strenght of the pencil version. <br> <br>I also share Ricardo Santo's observations on the width of the m, and I would give a more distinct feeling to the tail of the y. Don't ask me how. <br> <br>Your alphabet is very promising and could turn out in something extremely beautiful and functional at the same time. Congratulations!</p>
