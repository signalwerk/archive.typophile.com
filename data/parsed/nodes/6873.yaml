    html: <p>Miguel, I don't have the time to present a complete summary of Dwiggins's theory. If Tiffany doesn't jump in at some point, after I meet my current deadlines, perhaps I can provide more information.  <br> <br>Just briefly, the 'M' in M formula stands for Marionette. While carving marionettes, Dwiggins discovered that exaggerating smooth, rounded surfaces into sharp, angled planes allowed the figures to more powerfully communicate their character all the way to the back row. He theorized that the same kind of exaggeration and sharp modeling could be made to work in text types to give them additional "action" and "vitality." <br> <br>This kind of exaggeration is well known in theater and underlies the practices of stage makeup. If you've ever seen a stage actor in full makeup up close, you'll realize that it is always hideously overdone, but looks completely natural on stage under the lights. <br> <br>-- Kent. <br> <br></p>
    html_clean: <p>Miguel, I don't have the time to present a complete summary of Dwiggins's theory. If Tiffany doesn't jump in at some point, after I meet my current deadlines, perhaps I can provide more information.  <br> <br>Just briefly, the 'M' in M formula stands for Marionette. While carving marionettes, Dwiggins discovered that exaggerating smooth, rounded surfaces into sharp, angled planes allowed the figures to more powerfully communicate their character all the way to the back row. He theorized that the same kind of exaggeration and sharp modeling could be made to work in text types to give them additional "action" and "vitality." <br> <br>This kind of exaggeration is well known in theater and underlies the practices of stage makeup. If you've ever seen a stage actor in full makeup up close, you'll realize that it is always hideously overdone, but looks completely natural on stage under the lights. <br> <br>-- Kent. <br> <br></p>
