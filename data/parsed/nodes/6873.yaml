    html: "<p>I really like it. I have only minor quibbles with it at this point, because it would help me more to see it set in text. But here are a couple of my comments: <br> <br>1. Though I appreciate the uniqueness of the lc x, the top-left and bottom-right ends aren't really picked up anywhere else in the set. I think making those two ends look like the ends of the z would make an elegant solution. <br> <br>2. Something about the lc p seems off to me. If you were to use the same approach to the bowl that the lc q uses, but keep the tail serif as it is now, they would be complementary but not mirrors. <br> <br>Those are really minor comments, though. The more I look at it, the more I like it. It makes me wish I were European, just so I'd have a reason to use the euro mark. <br> <br>I can't wait to see more!</p>"
