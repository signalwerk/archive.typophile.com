  html: <p>&gt;Hello Typophile members and curious people, <br> <br>This is my first attempt on a serious Serif Typeface for print and i decided to design the complete characters on paper scketches first. Drawing by hand let me redesing any detail with more natural control, and i supose that is the better way of begin any font. <br> <br>The idea is to break the monotony of the curves with a straight internal edges, all trying to keep an organic feeling of many structure constants of the Azteca &amp; Maya geomerical art forms. <br> <br>Btw i want to publish the entire process since this firt sketch, so i need your suggestions on the estetic feeling that i want to keep, and the tecnical legibility changes that i have to add with your comments. <br> <br>Many of the characters are under construction so i will apreciate a lot if you can help me to decide why some characters works better on tecnical and estetic ways. <br> <br>Feel free to add any suggestion, critique or comment, <br> <br>Thanks. <br> <br>&gt;MH <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/6758.jpg" alt=""></p>
