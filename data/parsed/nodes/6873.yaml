    html: <p>Thanks for all your comments, specially to Tiffany Wardle and Kent Lew for your time explaining the M formula. <br> <br>Is very interesting to know that this is a great chance to contribute, in some way; the behaviour of this kind of ideas on a font for text reading on little sizes..is a big challenge to make one simple and functional font for newpaper readers. <br> <br>Now i ve got a more clear idea about the font, with the Upper cases almost solved, as you can see in this another pencil sketch. <br> <br>BTW, Quetzal is a beautiful name and bird, i think i will keep the name on this font :^) <br> <br>Feel free to add any suggestion, critique or comment,  <br>  <br>&gt;MH  <br> <br><img src="http://www.typophile.com/forums/messages/29/14700.gif" alt="Quetzal Uppercases"></p>
