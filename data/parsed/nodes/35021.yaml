      <p>El tilde no me parece nada mal en cuanto a su tamaño y/o altura. SI me parece que está muy a la izquierda, no tengas miedo de que se prolongue por fuera de la letra a la derecha (un poco claro.</p>
      <p>En cuanto a la "rr"... me parece que se genera un sigo bastante llamativo, lo que no es bueno en tipos para texto... no la veo bien. Ojo, ya en elemental o en otros casos que la tienen así, no es un problema tuyo, solo que creo que no soluciona nada y complica bastante.</p>
      <p>Tienes un problema general con la sobredimensión de la línea de base (se llama así a la compensación que se les da a las redondas y triangulares: sobredimensión y puede ser de línea de base, de mayúsculas, etc) Tus redondas "c" "e" "o" "s" bajan demasiado.<br>
      Por ejemplo cuando tenés una palabra como "principal" los serifs inferiores de "rin" te marcan una línea muy fuerte que evidencia aun más esta baja en la "c" en este caso.</p>
      <p>Abrazos tipográficos y la seguimos</p>
