    html: "<p>You're right; it's much better. Most of my criticisms have been resolved (the \"g\" is now <em>much</em> better). My last suggestions (if you're not sick of me): the connection between the curve and the horizontal on the bottom of the b and the top of the p and q is still awkward. The top of the \"s\" should be a bit longer and over to the right, as should the \"S.\" The \"S\" might also be a tad light. The \"y\" is a bit dark where the two strokes meet; maybe try angling the inner outlines so that the strokes narrow toward the bottom. The \"R\" and \"K\" still seem imbalanced, and the serifs on the \"Z\" should be more prominent. The \"O\" and \"U\" don't appear to overshoot the baseline enough; they float slightly. I like your numbers better, although the 6 and 9 are still too open, and the hyphen needs something to balance the right side. Looking at your f ligatures, you may want to make the stroke that connects the \"f\" to the \"i,\" and \"f\" perfectly straight, not tapered; don't be afraid to change the letterforms to make them work in the ligatures.</p>"
