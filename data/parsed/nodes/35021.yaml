      <p>Primero, me encanta que incluyes una <em>ch</em>.  Debe ser más tipos con ella, facilita mucho el leer en español.  Quizás puedes probarla con la curvainferior de la <em>c</em> aún más inferior: en una línea de texto, parece que no toca la línea base.  Pero creo que una <em>ll</em> también será bien incluida, aunque desafortunadamente no hay una forma estándar de ella.  </p>
      <p>La tilde me parece al revés, horizontalmente.  Has dicho es para una competencia latinoamericana (¿latino o sólo hispano?) y por eso creo que será buena idea seguir la tradición española de crearla.  Normalmente, la tilde parece más pequeña y estrechada por la izquierda, y más grande y ampliada por la derecha; a veces también todo el tilde parecerá que levanta tras la vergulilla. Véase algunos facsimiles en la biblioteca virtual de Cervantes de libros como don Quijote u otros.  Igual con las otras tildes (graves y acutas) que me parecen más orientales que occidentales.  Los europeos centrales y los griegos las prefieren casi vertical como tienes tú, pero los francofonos, lusofonos, e hispanohablantes prefieren más horizontal.  También es cuestión de gusto, pero lo menciono por la competencia y la tradición en la lengua castellana.</p>
      <p>Y de mi gusto personal, me gustará ver la <em>w</em> mayúscula un poco más estrecha.  Parece ahora que sólo consta de dos <em>v</em>es mayúsculas con los remates medios juntados. Fíjate que es mucha más amplia que la <em>m</em> mayúscula, las cuales normalmente son de anchuras parecidas.</p>
      <p>Y de la ortografía... en tu muestra, en la oración para las tildes, tienes «Que sea la última vez, nada más servió huír del cadáver», pero <em>huir</em> no lleva tilde :)</p>
      <p>Buen trabajo.  Me gusta mucho.  Y en cuanto a la competencia, como aludí antes, ¿está abierta sólo a ciudadanos de países hispanohablantes en Latinoamérica?, o ¿se permiten entradas de Brasil, España, y Portugal también?  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
