    html: <p>First impression - it seems to work reasonably well with the regular face in small doses, and maybe that's all you need. On individual glyphs the 'o' seems a bit too slanted, and the 'Q' is a nice try at a distinctive form, but somehow seems a bit sloppy - perhaps closing the gap would help? However, when viewing the alphabet on its own, there seems to be something missing that I can't quite put my finger on; the best I can come up with is that it seems a bit timid, as if you have slanted the regular, thinned it down a bit, changed a few letter forms, but haven't really created an italic in its own right. I don't mean to say it's bad - only that it could be better.</p>
    html_clean: <p>First impression - it seems to work reasonably well with the regular face in small doses, and maybe that's all you need. On individual glyphs the 'o' seems a bit too slanted, and the 'Q' is a nice try at a distinctive form, but somehow seems a bit sloppy - perhaps closing the gap would help? However, when viewing the alphabet on its own, there seems to be something missing that I can't quite put my finger on; the best I can come up with is that it seems a bit timid, as if you have slanted the regular, thinned it down a bit, changed a few letter forms, but haven't really created an italic in its own right. I don't mean to say it's bad - only that it could be better.</p>
