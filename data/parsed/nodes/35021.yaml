      <p>Since your English is obviously very good, I'll do my second suggestions in that (saves me time, too).</p>
      <p>Capital letters: The "R" still seems awkward; maybe moving the leg to the right and reducing its angle will help. The "K" is likewise a bit strange, although I'm not sure how to improve it -- there's something about the height of the point of where the legs intersect the stem and the weight of the top leg that strikes me as weird. The "U," unlike the "O" and "Q," doesn't seem to overshoot the baseline, so it seems to be floating off it.</p>
      <p>Lowercase: I still don't like the flat bottom on the "b." If you're committed to keeping it, you need to make the transition from horizontal line to curve at the bottom right of the bowl smoother. The top right of the bowl of the "p" also suffers from the same ugly transition. I'd prefer, as I said before, if the top of the "t" were perfectly vertical instead of being angled slightly to the right. The "s" still exhibits a bump in the center, which should really be flattened out. And the "g" is better, but the bottom bowl's curves need to be revised -- it's lumpy. Also, it still feels off, and I think that more contrast is needed -- take a look at some "g"s in other fonts to see where the thins and thicks should go.</p>
      <p>Other characters: The "6" and "9" are too open; try closing the aperture some more. The top of the "5" should maybe be extended a bit more to balance it out. The hyphen is interesting, but I'd suggest adding something on the right end to even it out; maybe add an upward or downward serif. And you might try making the right-facing serif on the upside-down exclamation point into a left-facing one.</p>
      <p>I think it's looking good, with some details like the "x" and the angled corners of the inside of the bowls making it interesting. I wouldn't mind, however, if it had a bit more personality, as long as it doesn't hurt its readability. Maybe just something that will liven the letterforms slightly more, although I'm not sure what that might be.</p>
      <p>¡Muy buen trabajo! ¡Tengo 18 años, y espero que cuando cumplo 19 como ti tendré un tipo original también!</p>
