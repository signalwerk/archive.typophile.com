      <p>Auricfuzz, esas ligaduras vienen del idioma, antes (20 años o algo así calculo) para nosotros la "ch" la "ll" y la "rr" eran consideradas letras en sí mismas... es decir al aprender el alfabeto pronunciábamos "a, be, ce, che, de.... ele, elle... ere, erre... zeta". </p>
      <p>La "ch" además de una cuestión de idioma castellano tiene una gran defensa en algunas regiones por la utilización de ese sonido por algunas culturas de Argentina y México (nombro solo estos dos países pues desconozco el resto, pero creo que los incas también lo usan bastante)... es casi tan defendida por nosotros como la "ñ", y es por ello que encontraremos mas "ch" que "rr" o "ll"... una cuestión de resistencia digamos.</p>
      <p>En cuanto a los tildes de strass... ya te lo había dicho!!</p>
      <p>En cuanto a Letras Latinas (que cambiará de nombre para su edición 2008)... México también es Latinoamérica querido Strass</p>
