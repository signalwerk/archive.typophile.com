      <p>Ya mencionado pero sin énfasis, un buen recurso de investigación por internet en la redacción e impresión de la lengua castellana es la biblioteca virtual de Cervantes, ubicado a <a href="http://www.cervantesvirtual.com" title="http://www.cervantesvirtual.com">http://www.cervantesvirtual.com</a> .  Algunos textos tiene ediciones facsimiles, que incluso el uso casi totalmente olvidado de la ß en español (debes ir a textos antes de los 1800s para verla, después de esa época, no había uso común de la ese doble por las reformas lingüísticas).  También tiene libros y publicaciones en catalán, galego, y portugués tanto otros idiomas.</p>
      <p>Aunque es más recurso para literarios como yo, creo que os funcionará bien para investigaciones de la tipografía latina (es decir, idiomas romances).  </p>
      <p>A la vez, será bien interesange estas otras ligaduras de nt, nd, etcétera, del guaraní.  ng es bastante obvia, usando la letra por el sonido en el API.<br>
      <em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
