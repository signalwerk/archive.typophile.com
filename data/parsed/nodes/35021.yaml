      <p>Guifa, muy interesantes y acertadops tus comentarios. No conocía ese ductus para la "ll".</p>
      <p>Con respecto a las letras dígrafas "ch", "ll" y "rr" es verdad que todavía la RAE las mantiene, pero están en retroceso -lamentablemente- incluso ya se puede ver la siguiente aclaración en el diccionario de la RAE:</p>
      <p>-inicio de la cita-<br>
      3.1. Orden alfabético</p>
      <p>            Las entradas están dispuestas de acuerdo con el orden latino internacional. Por acuerdo del X Congreso de la Asociación de Academias de la Lengua Española (Madrid, 1994), las voces que contienen las combinaciones ch y ll se sitúan en sus lugares correspondientes dentro de c y l respectivamente, con un encabezamiento (CH, LL) que recuerda su condición convencional de letras del alfabeto español.<br>
      -fin de la cita-</p>
      <p>Entonces, en rigor, siguen siendo letras como bien dice guifa... todavía.</p>
      <p>Lo de la "rr" no lo encontré por ningún lado y solo tengo como prueba de ello mi memoria al cursar la escuela en México. Tal vez sea cosa solo de los mexicanos, pero en realidad lo dudo...</p>
      <p>auricfuzz: no conozco ductus diferenciados para esas letras, más que lo s generados por el recurso de escritura manual, pero eso son ligaduras simplemente.</p>
      <p>Strass: gracias por dejarnos usar tu sitio para estas "curiosidades".</p>
      <p>Creo que una forma de defensa del idioma es la inclusión de signos específicos para estos sonidos.</p>
      <p><a href="http://www.tipografa.blogspot.com" title="www.tipografa.blogspot.com">www.tipografa.blogspot.com</a></p>
