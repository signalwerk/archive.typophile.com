      <p>I'm pasting my critique below that I put on Ferch's blog before I saw this post.</p>
      <p>Porque quiero más práctica (no es mi lengua nativa), te ofrece algunas sugerencias en español. Primero, sugiero que pongas el PDF en el forum que se llama “Critique – Serif,” porque es el mejor lugar para recibir críticas de su trabajo.</p>
      <p>Primero, dices que Quadratta es “una mezcla de romana de transición con egipcia” – creo que ya hay un término para el grupo en que cabe Quadratta: “wedge serif,” en lo cual el serif es ancho como en un “slab” pero sigue de la letra en un ángulo (vaya a <a href="http://typophile.com/node/34386" title="http://typophile.com/node/34386">http://typophile.com/node/34386</a> para algunos ejemplos). Aún si es, no hay muchos en esta categoría.</p>
      <p>Parece muy bueno; sólo hay unos problemas posibles que veo. En la “B,” el “bowl” superior (el parte que encapsula el espacio blanco) parece un poco tan pequeño y entonces la letra no tiene balanza ideal. Con la “E”, el brazo superior debe de ser menos largo (pero no mucho) que el inferior para crear la balanza. La “K,” la “T”, y la “R” tienen el mismo problema de ser un poco irregular. El “S” es la única letra mayor que tiene problemas serios: no me gusta que la línea asciende en el medio (parece un “bump” extraño). Además, la “S” “cae” a la izquierda un poquito.</p>
      <p>La “b” es tan plano al fondo; debe de ser más como el “d.” No me encanta de la “g”; la “oreja” crea un lugar demasiado negro a la derecha, y el “bowl” inferior no cabe con el resto de las letras: debe de tener o más contraste o algo para remover el sentido de ser demasiado construido. La curva en la parte de la “t” sobre el “crossbar” es tan extrema, y preferiría si la parte fuera vertical. La “s” tiene las mismas problemas que la “S.”Es una decisión válida, pero no me gusta el punto en el cero. Finalmente, me encanta de su ligadura de “ch”, sus “tittles” (los puntos sobre la “i” y la “j”), y su “$.” Creo que va a ser un tipo bueno cuando terminas.</p>
      <p>Algo más: Ya hay un tipo que se llama “Quadraat” y uno que se llama “Friz Quadrata.” Aunque los nombres no son exactamente el tuyo, sugiero que cambies el título para evitar problemas.</p>
      <p>Usa la función “Contact” en mi “profile” si no entiendes algo que escribí.</p>
