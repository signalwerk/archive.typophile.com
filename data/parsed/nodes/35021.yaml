    html: |-
      <p>The ogoneks are a bit light at the bottom. tcaron, dcaron and lcaron badly need reworking. The apostrophic caron should have the shape of an almost-upright acute or something between an upright acute and a single quote, and it should be positioned very close to the letter so that there is no visible word gap between one of those letters and a following letter, but also, so that there are not spacing problems when dcaron, lcaron or tcaron is followed by a b, a k or an l. Not an easy task to solve, but the most recent Adobe faces such as Arno Pro address it well. </p>
      <p>A.</p>
    html_clean: |-
