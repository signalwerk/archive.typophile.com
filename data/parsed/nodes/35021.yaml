      <p>Tipografía desde Montevideo</p>
      <p>Querido strass, va muy bien la letra. Noto tres "cositas". Y una cosa.</p>
      <p>cositas:</p>
      <p>1. En el "5" tenés unas redondeces que no aparecen en ningún otro signo, salvo en los puntos o comas, pero no en letras ni números.</p>
      <p>2. En el "3" en su parte central veo un nodo que supongo pusiste para restar peso, pero... ¿no quedaría mejor modificar la curva globalmente para no caer en ese accidente?</p>
      <p>3. Fijate el ajuste óptico de las "Xx" en cuanto al cruzamiento...</p>
      <p>COSA:</p>
      <p>1. Las "Ss" todavía no están. Acordate de la diagonalidad del trazo central en ambas.</p>
