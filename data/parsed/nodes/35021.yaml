      <p>En el pasado, la elle tenía apariencia diferente.  Si lo recuerdo correctamente, parecía como yo ahora escribo mi 4 (línea vertical desde arriba al medio, línea horizontal como guión, línea vertical desde arriba como así:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ejemplo_ligadura_ll_5718.png"></div><p></p>
      <p>La erre nunca ha tenido representación propia (al menos en español), porque nunca se ha considerado como letra propia (fíjaos que según la RAE, la <em>ch</em> y <em>ll</em> son todavía letras en el abecedario, sólo es que no se utiliza en ordenar palabras alfabéticamente.  Aunque muchos dicen «erre» por <em>rr</em> y «ere» por <em>r</em>, oficialmente la <em>r</em> es «erre» —al menos que quieras enfatizar la cualidad vibrante simple, cuando se puede usar «ere»— y la erre es «erre erre» o «erre doble».)  Pero como este tipo aquí es parte de un concurso de letras latinas (o para cualquier tipo destinado al uso en Latinoamérica), y en idiomas como guaraní sí es letra propia, se puede incluir una forma propia.  Pero en este caso, tened cuidado de que esas lenguas también tiene otras digrafas, <em>mb</em>, <em>nd</em>, <em>ng</em>, <em>nt</em>, <em>tz</em>, etcétera.</p>
      <p>La che tampoco tiene forma escrita especial, pero ya dicho, tiene más apoyo que las otras letras propias al castellano para una forma específica.<br>
      <em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
