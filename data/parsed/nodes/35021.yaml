      <p>Ferch,</p>
      <p>Re my last comment on the kerning of "Te" and "Pa" - this looks much better now: "Pa" could perhaps stand tightening a hair further, but "Te" looks good.</p>
      <p>I'm ashamed to admit it, but until now my comments have been based on examining the PDF onscreen. However, I printed pages from 7.5 out, and the thing that struck me immediately is that the lower case "r" is in serious need of treatment. It somehow appears bolder than every other lower case letter, so it really messes up the texture of the page. This is more noticeable in 12 pt. Perhaps the program you are using to create the PDF is introducing an error with this letter? Also, the kerning of this letter looks a bit off in a number of combinations - maybe the side-bearings need attention?</p>
      <p>Other comments: kerning of the apostrophe could be improved, as in "world's"; the "ll" ligature does not look v. good at the bottom - each of the serifs are bigger than for the single "l", so the two joined together produces an untidy dark blob; and in the "ti" ligature, the "i" strangely appears bolder than when it is a single letter.</p>
      <p>Sorry if these comments seem rather negative - all in all I think it's a very promising font, and if you fix these points (please at least consider fixing the "r"), it should do very well.</p>
      <p>Regards,</p>
      <p>domdib</p>
