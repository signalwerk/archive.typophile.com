    <p>Hello all, I am new to these forums, so please pardon me if I placed this in the wrong section. </p>
    <p>I am looking for advice for a font for a prayer book I am compiling, preferably for free if I do not yet have it (I am a poor college student). Here is what I am looking for:</p>
    <p>a serif font<br>
    formal<br>
    beautiful, but not overbearingly so.<br>
    Has the versicle and response (looks like a V with a line through its right leg and an R with a line through its right leg, respectively)<br>
    uses old-style numerals<br>
    extensive coverage of ligatures<br>
    Old-Style or Transitional (not Modern unless it is really good)<br>
    that is not Times New Roman or Georgia<br>
    the acute accent has at least a 30 degree angle (similar to Palatino) in relation to the top of the vowel (unlike Courier, which is more<br>
                                        of a 20 degree)<br>
    prints well</p>
    <p>I have seriously looked at, so far: Century, Palemonas MUFI, Old Standard, Palatino, Caslon Roman</p>
    <p>Here are my problems with each of them (in reverse order):<br>
    Caslon Roman is too spiny. I like Caslon, but I have not found a Caslon-based font besides Caslon Roman that is free.</p>
    <p>Palatino does not have the character support I need (it lacks the response and versicle)</p>
    <p>Old Standard, while having a beautiful appearance, is tiring to read after a while.</p>
    <p>Palemonas MUFI - this font is nearly perfect EXCEPT for the fact that its spacing is odd, creating too much white space that, while more legible, uses more space and the letters themselves are rather small at 12 pt (roughly equivalent to 11pt or 10.5pt Times New Roman)</p>
    <p>Century - also does not have the character support I need and, while clear, does not exactly evoke the dignity I would like.</p>
    <p>Thank you.</p>
