    html: |-
      <p>There are two reasons for my wanting the book to have a free or cheap font: 1) because I do not have the money for a full-fledged Caslon ($135 at one online store and it didn't have the versicle) and 2) because I'd like to be able to make the prayer book available to my parish with as little cost as possible while making it look attractive. At this point in time, I am not planning on making it available on the wider market.</p>
      <p>The prayer book, I hope, should contain numerous prayers and devotions from the Roman Catholic faith, mostly in Latin.</p>
      <p>My problem with such fonts like Junicode and Palemonas MUFI are that they tend towards the smaller character sizes. </p>
      <p>I would like ligatures (especially æ and œ with accute accents) because much of the prayer book will be in Latin and I prefer the more traditional (medieval) orthography, with j, æ and œ. I know the current Unicode charts do not have an œ with an accute accent, which was why I was looking at Palemonas MUFI, as that character is in its Private Use Area coding. I would be willing to save up money for a font if it contained (in addition to the basic characters almost every serif font contains) the versicle, response, œ with acute, æ with acute and the stylistic categories listed in my first post. These are needed because, as a prayer book, it should be dignified in the appearance of its text, and, as a prayer book largely in Ecclesiastical Latin (which does not distinguish between long and short vowels to the extent of Classical Latin), acutes are needed to denote proper pronunciation.</p>
      <p>Does this help? Thank you.</p>
