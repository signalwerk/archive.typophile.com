      <p>I would consider <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=69" rel="nofollow">Andron</a> which has the characteristics you described, but is not free. There is a free roman available, but it has a more limited character support. The Latin Corpus 1 probably covers your needs, with smallcaps, italic and semibold. At € 169 it is reasonably priced for such a good typeface. Also there is a lot of support if you need extra glyphs made.</p>
      <p><a class="freelinking external" href="http://www.stonetypefoundry.com/cyclesoverview.html" rel="nofollow">Cycles</a> is beatiful. It does not have all the characters you need. Sumner Stone has a use-based licensing system, so contact him with your enquiry, and he might be able to help for a friendly price. Cycles 11 or 9 are probably the ones of most interest.</p>
