    date: 2011-03-31T02:16:00
    date_raw: 31 Mar 2011 — 2:16am
    votes: null
    html: |-
      <p>These wedge serifs are too uneven to my opinion. On /a/f/ are a too wide to my taste.</p>
      <p>I don't think that /g/ complements the style of other letters. It doesn't have the same <em>edginess</em> as others.</p>
      <p>The bottom curve of /C/e/ is too far to the right and makes the letter unstable (falling to the left).</p>
      <p>I find /Q/C/D/U/Z/u/ to be a but too wide. /b/ probably as well but I'm not so sure about that.</p>
      <p>/q/ looks a bit wider than /p/. Most probably because of the a different top (which is correct btw).</p>
      <p>The new /R/ is a very good improvement even though I'd try with an angled stroke. It would still be curved, but would have a bit of an angle just a bit after the tail curve starts. It would give it a bit edginess that will complement those wedged serifs.</p>
      <p>Have you considered cutting the vertical bit of serifs - the short vertical line at the end of serif) to be cut at an angle? Leaning to the right? It may give type a bit of a faster reading feel and dynamism. Although it would be seen on larger sizes only. But is maybe worth a try. It's just a suggestion anyway.</p>
      <p>And definitely try top cut /r/ ear with an angular stroke instead of vertical one. Same could go to /y/.</p>
      <p><strong>But all in all I find this wedge serif style very nice and consistent.</strong> I don't think there are many wedge serif styled families that are really good that the whole style would complement this rather geometric serif. This simply means you should keep on doing this great work.</p>
