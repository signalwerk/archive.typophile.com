    html: |-
      <p>It's a very good start. Anyway, it still resembles very much a slight extended Meta Serif mixing a bit of Guardian (in lowercase) and Greta Text (in uppercase, especially serifs). Some points:</p>
      <p><strong>01</strong>. |g| lower bowl has a very small gap and its right curves are irregular. The ear would use a thinner connection to upper bowl.</p>
      <p><strong>02</strong>. |J| descender uses a somewhat abrupt curve while |j| descender lacks expressivity.</p>
      <p><strong>03</strong>. |S|s| curves are irregular.</p>
      <p><strong>04</strong>. |R| leg does not fits overall style.</p>
      <p><strong>05</strong>. Uppercase vertical serifs (C, E, F, G, L, S, T) are very large and thick, not proportional to horizontal serifs.</p>
      <p><strong>06</strong>. Top of |t| is large and a bit rude.</p>
      <p><strong>07</strong>. |Q| tail seems very thick. Maybe a thinner link to base curve would improve it.</p>
