    html: |-
      <p>yea, I agree with clashmore. Keep going, do some sketches. The typefaces don’t work together at all right now. I thought they were two separate things at first glance. And yea, I get it...the Y is a happy little man, but the way it looks now, being all static...it looks like that little man is running from something, not being overly happy and jumping up and down. My best advice is do some research on logos for evangelism ministries that already exist. And no...don’t copy, of course, but you might see a good logo that conveys the same overall feeling you are looking to convey. Then study that logo. What fonts did they use, how did they treat their type...did they even us a symbol? Stuff like that.</p>
      <p>I also did quite a lot of pro bono work throughout college, it’s actually a really great way to get some experience. Portfolio material is a little more important at the moment and adding payment into it always adds a whole different level of stress to the situation if you can’t do this stuff in your sleep.</p>
