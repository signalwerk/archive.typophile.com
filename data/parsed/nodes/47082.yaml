    <p>Hello all. I am a young graphic design student needing some critique on a logo. It’s for a small nonprofit that needs a lot of help starting up. I agreed to help out pro bono since I don’t feel comfortable charging for work at my current skill level. Right now I’m just trying to learn as much as I can as I work towards my bachelor’s.</p>
    <p></p><div class="imageWrap"><img src="/files/Joyful_6301.png"></div><p></p>
    <p>It’s a rough sketch and in need of tweaking but I wanted to see if you all thought I’m at least heading in the right direction. </p>
    <p>Thanks,</p>
    <p>Josh</p>
