  html: |-
    <p>Can anyone help identify the font used for SmokeEaters? Here is the website for the restaurant if it helps <a href="http://smoke-eaters.com">http://smoke-eaters.com</a>. You can see the font on the exterior of the restaurant uses slightly different outlines around the logotype.</p>
    <p>My hunch is this is probably a modification of an existing font, but any info helps!</p>
