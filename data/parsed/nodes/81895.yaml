      <p>There is a solution but it needs a little programming (Or you might use "microsoft VOLT" which doesn't need programming). There is a feature in opentype called "stylistic alternatives", if you add it to your font ,you'll get something more convenient in glyph window of illustrator (or Indesign), there is a good example of this feature in "zapfino Lt" font which each glyph has many alternates, In illustaror if you choose any letter, in the glyph window you'll get alternate glyphs, of course you should enable the "stylistic alternatives" button in the opentype panel.</p>
