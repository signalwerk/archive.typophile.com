    html: |-
      <p>The advantage the Stylistic Sets method has over six separate fonts is that it's possible to include kerning for all the alternates with one another.</p>
      <p>However, if it's just for display work, the client could manually kern or use "optical" kerning.</p>
      <p>So why not just make six fonts?<br>
      It's actually easier for the end user, because the Stylistic Sets feature is buried several layers down in the GUI, whereas font selection is up front.</p>
