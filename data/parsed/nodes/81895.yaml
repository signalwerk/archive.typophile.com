      <p>Ideally, you could build a font with alternates immediately following the basic forms, and that's the way they would display in the Glyph Palette. Unfortunately, neither FontLab nor InDesign lives in that ideal world. Ideally, in Index mode FontLab would allow you to select a range of characters--your regular characters and alternates--then sort by name, so that B would be followed by Ba.t1, B.alt2 and so on, but...FontLab doesn't allow selective sorting: it's all or nothing. Plus, even if FontLab accommodated you, ID (at least CS3) doesn't allow you to select Glyph Index as a viewing mode in the palette, so you're screwed coming and going.</p>
      <p>So, your best bet is to select the Latin 1252 codepage, then put your alternates, in alphabetical order, in the "unused" glyph slots, probably quote base single, florin, quote base double, ellipsis, and so on. At least, then, the alternate glyphs would appear in alphabetical order for easier selection.</p>
