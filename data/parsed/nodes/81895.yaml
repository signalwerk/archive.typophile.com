      <p>I would put the alternates in separate Stylistic Sets, and instruct your client to set their headings six times, stacked, and apply a different Stylistic Set to each line.</p>
      <p>Immediately, they would get to compare six different looks (you could group alternates in each Set to harmonize).</p>
      <p>Then they could manually select, copy and paste individual characters from line to line, till they get the optimal setting.</p>
