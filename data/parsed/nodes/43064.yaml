      <p>Firstly the dotted lines add a lot more unneccessary activity to the page - try making them lighter and solid.</p>
      <p>Also in the professional experience section has a few issues - the city name and time period which is aligned to the right margin looks out of place with the unjustified text immediately underneath it. It also doesn't run very easily with the company name and position headings on the other side of the page. I'm not necessarily suggesting you justify the text, but you could try that. I'd suggest either putting the city name and time period under the other two headings, or left align them to a tab rather than right aligning them.</p>
      <p>The headings in this section also don't differntiate themselves enough from the text - add some sort of hierachy there; maybe the grey colour you've used for the text with the headings black? A different weight, different size, or maybe even a sans?</p>
      <p>The text does feel all blocked up, but probably because there isn't any hierachy or contrast going on anywhere, so it all looks rather homogenous.</p>
      <p>I also don't think the circular bullets work well with that font.</p>
      <p>Hope some of that helps (not that I'm any expert, just a student)</p>
      <p>-Rafe</p>
