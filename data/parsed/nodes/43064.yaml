    <p>Hi,</p>
    <p>I'm a student of architecture and I'm trying to create a resume at the moment using InDesign.<br>
    I've had a look at some other examples which have been posted on this forum, and followed a few 'design tips and tricks' type tutorials that I found on the internet, and this is what I have come up with so far....</p>
    <p>The typeface I'm using is Adobe Garamond Pro with the sub-headings set in 11pt and the rest of the text set in 10pt with 12.75pt leading. That box in the top right hand corner is for a passport type photo to be added to later, as the places I'm applying to require that. I like the layout more or less, but it still looks cluttered or awkward to my eyes and I can't work out why.</p>
    <p>Any comments or feedback would be greatly appreciated.</p>
