      <p>Reduce your tracking, increase your leading!  My eye goes down instead of across, especially in the "Professional Experience" section.</p>
      <p>The bullets look out of place... In general, get rid of all (or most) lines, and think of the text itself as the visual elements.  For the dates and locations, perhaps move them to be right after the names of the firms - try italic, or lighter grey, or something to deemphasize them.  Where they are right now is unscannable and ugly.</p>
      <p>Resumes need to work as a glance, a scan, and a read - I agree with rafe that right now it's all a bit too homogenous.</p>
      <p>Good luck!</p>
