      <p>The confusion over correct nomenclature continues to muddy since even us "experts" blurr the definitions as time wears on.</p>
      <p>Instead of getting too granular in definitions, let's consider the broader picture:</p>
      <p>A <strong>type design</strong> is to a type designer like a song is to a composer.</p>
      <p>A song can be sung at different octives, by various performers and cadence but essentially what you <em>HEAR</em> is the same song. </p>
      <p>A <strong>type design</strong> (expressed in letterform or individual typeface) is what you <em>SEE</em>... printed in books, on the TV or computer screen, adhered on the sides of trucks, cut or sandblasted in stone.</p>
      <p>A <strong>font</strong> is to a typeface like recorded media is to music or song.<br>
      You can listen to the same "performance" of <a href="http://en.wikipedia.org/wiki/Al_jolson" target="new" rel="nofollow">Al Jolson</a> singing <em>Swanee</em> from old films, shellac and vinyl records, audio tape, eight-track or cassette, video tape, CD, DVD, Blueray, online or downloadable digital, and whatever the future will bring.</p>
      <p>Similar to the arguments by musicians and audiophiles -- designers, typophiles will debate the loss or gains of a type design when "rendered" by different font technologies.</p>
      <p>But alas, I fear most people use the term "font" to everything type related.</p>
