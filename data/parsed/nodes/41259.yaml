      <p>I thank you all for your intervention. I'm not alone in typographic world. It seems that I have touched one of the main discussion topics of this microscopic area. Maybe it wasn´t clear enough, but I never used the terms as synonyms, and I DO NOT think they are the same.<br>
      Wonderful comparison Norberto. It was as clear to me as listening to the PNY album of Portishead without being able to be in the center of the orchestra :(.<br>
      I just find quite insulting to talk about typefaces as if they only existed in binary language... where is Jenson among all that? Or Griffo? Or Garamond?... and don't have to go that far... what about Akzidenz Grotesk or Helvetica, Univers? They were first made of metal. And apollo? Do not forget it was conceived to use with a film pelicule...<br>
      What I mean is... the font is only the means you materialize the original thinking, drawing... a good example? What about a Bodoni on a coated paper? A huge mistake... that I have to see in hundreds of female magazines...but that's only a radical position. I can accept that a typeface like Didot may funtion from 72pts on... So everything has its on context, artistic, historic, cultural, economical...<br>
      Anyway... thank you for your opinion. :)</p>
