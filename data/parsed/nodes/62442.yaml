    <p>:)</p>
    <p>I originally trained in the empirical sciences where line spacing tends to be quite narrow compared with the arts.</p>
    <p>In that field, I observed that when arts professionals were confronted with papers written by scientists, they would squint and the page and then reject it without finishing a sentence. I thought artists were just stupid and unable to analyse either abstract or concrete subject matter.</p>
    <p>However, when my career switched the arts a few years ago, and I experienced the inverse difficulty and its not the content. Rather, it is a fault of the type.</p>
    <p>For example, <a class="freelinking external" href="http://blog.graydesign.com/wp-content/uploads/2006/05/semiotics_paper_rev2.pdf">this paper</a> on graphic design has huge line spacing and its nearly impossible for me to read. Specifically, as my eyes scan across the words, my line of sight drops into the void below the text. This creates a pause at random intervals along the lines.</p>
    <p>Furthermore, when I reach the end of one line and attempt the read the start of the next line - my eyes instinctively search the empty space between these wide separated lines!</p>
    <p>I conjecture that all of the difficulties described above stem from learned convention rather than any disability of artists or scientists.</p>
    <p>My career now spans the domains of art and science, and line spacing in my own work has become a serious concern because my audience may include both scientists and artists. Does typography offer a clever solution to a ridiculous situation?</p>
    <p>Percy Snow, author of Two Cultures, would be laughing.</p>
