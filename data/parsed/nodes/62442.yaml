      <p>This is interesting. One question, though: are you talking about <em>manuscripts</em> or <em>any kind</em> of publication, such as journal articles? </p>
      <p>This, because I'm surprised that your Arts readers would be repelled by single spacing, since it's what you find in all printed publications, including newspapers, magazines and almost all books, as well as on computers, whether in emails or on the web. </p>
      <p>In my field, linguistics, anything in print will always be single spaced, whether it appears in a book or a journal article. However, there is some variation in manuscripts. It's true that most recently, word-processed manuscripts tend to be single-spaced; however, in the days of typewriter manuscripts and the early days of computer-printed manuscripts up to the mid- and late-1980s, double spacing tended to improve legibility and for that reason was preferred. Many old typescripts and published theses I have from that era are double-spaced. However, this is no longer the case for those from the digital word processing era. </p>
      <p>One more thing about manuscripts: most editors I have dealt with require manuscripts to be submitted with double spacing for practical reasons: the extra space simplifies the job of mark-up for reviewers and proof-readers and for those down the line who need to read the mark-up and make the specified changes.</p>
