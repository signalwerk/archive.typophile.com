      <p>Hi aluminum,</p>
      <p>We are the audience of that paper. The paper is provided on line. Consequently, his audience is the web user and not a particular instructor. However, that was not my concern.</p>
      <p>Submission guidelines in the Arts are not dictated by an instructor. They are define by school regulations, and are typically double spaced or more. There are two reasons why this cannot be for the purposes of hand written corrections. First, similar rules require that instructors write on a separate sheet. Second, the submission is retained for published archives that must not be written on. The spacing requirement is equal to a border requirement.</p>
      <p>In contrast, university submission guidelines in the Sciences typically require less spacing. However, I dug out my first degree dissertation and the total border is equal to the total line length. In that case, the layout was dictated by my university's LaTeX template.</p>
