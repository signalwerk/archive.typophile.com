    html: |-
      <p>I rarely find anyone accepting unsolicited PDF portfolios from prospective interns; most people don’t want their emails getting jammed up with gigantic files from clueless students who output everything from Indesign as a “High-Quality Print” PDF and so all PDFs are ignored as a matter of priciple. If a design firm is requesting PDF files, try to get it under 500kb before emailing; you can always post a hi-res version online somewhere and email a link along with your small PDF. </p>
      <p>It’s much better to have a web site that people can just browse, and you can post any crazy files you want to on a web site linked from images. <a href="http://www.jpad.biz" rel="nofollow">My horrid little web site has brought me three internships in as many years.</a> Indexhibit is nice, but if you’re really desperate you can just tweak one of the Dreamweaver templates (most designers don’t even look at them and won’t recognize them).</p>
      <p>As for the work, pick the best pieces you have, if you really don’t have a clue what to pick ask your professors and fellow students. Keep in mind that when people say 10-12 pieces that means 10-12 (or whatever number) pages of stuff to look at, not 10-12 multi-page projects. If you talk a lot at job interviews put more stuff online and take less in person—I run my mouth so much I’m lucky to get through five boards before I’m out of time. Lastly, go to any portfolio review days put on by local design organizations. Drag out every wild piece of crap you have; one good suggestion can take a real turd and turn it into a great showpiece.</p>
    html_clean: |-
