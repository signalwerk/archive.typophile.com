      <p>Honestly it's best to get a website because it's kind of a pain for people to download your pdf for viewing especially when there are several applicants. It also clogs up their inboxes and makes it hard to share your work around the office.</p>
      <p>There are some sites that you can upload your work to like portfolios.com or foliolink.com.</p>
      <p>What you send should be examples of your best work that show your strongest skills as a designer.</p>
