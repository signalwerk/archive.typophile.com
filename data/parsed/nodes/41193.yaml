      <p>Consider what kind of work the studio specializes in. Obviously, you'll want to showcase any online skills you have for an employer that does a lot of web work.</p>
      <p>When I'm looking for magazine designers, I prefer a PDF for the very reasons Haley cites in support of online portfolios: easy to share via e-mail (or place in a "candidates to consider" folder on our server), easy to zoom in to see detail, easy to look under the hood to see what type was used... ;)</p>
