      <p><a href="http://indexhibit.org/" title="http://indexhibit.org/">http://indexhibit.org/</a> is a cool project, and I've seen a lot of designers use the format. Just buy a domain and some server space, and you can plug in your images. Make sure to follow the instructions on the site very carefully, though, if you do decide to go this route.</p>
      <p>In terms of what you should show, 10 pieces is plenty. If you don't have 10 strong pieces, show 5, or 6, or however many you think can stand on their own outside the context of your portfolio.</p>
