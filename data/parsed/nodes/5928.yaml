    html: <p>Zack, I recently got a promo copy of a design magazine where the copy was set in one column across the length of the publication and the pull quotes had minus leading so the copy's asenders and decenders crashed into one another. It was totally unreadable. I didn't subscribe. I couldn't get by the horrible layout to read the content. Keep this in mind. Ask yourself what is most important, reading the content or art for art sake.</p>
