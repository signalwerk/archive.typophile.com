  html: <p>I am trying to start a zine this summer, and am in the design phase at the moment. I would like to push the envelope a little (or a lot?) with the layout, and so I'm looking for ideas. <br> <br>The only print example I've seen that is somewhat close to what I'm thinking of is Mark Danielewski's <i>House of Leaves</i> (<a href="http://www.english.ucsb.edu/faculty/rraley/courses/engl165/readings/Danielewski.gif">sample page</a>). <a href="http://www.unicamp.br/~hans/mh/glas.jpg">Another picture </a>came up in a Google search that is also similar. <br> <br>Does anyone know of any other books or magazines with layout in a similar vein? Hopefully my little public library will have a few of them.</p>
  html_clean: <p>I am trying to start a zine this summer, and am in the design phase at the moment. I would like to push the envelope a little (or a lot?) with the layout, and so I'm looking for ideas. <br> <br>The only print example I've seen that is somewhat close to what I'm thinking of is Mark Danielewski's <i>House of Leaves</i> (<a href="http://www.english.ucsb.edu/faculty/rraley/courses/engl165/readings/Danielewski.gif" class="link-external">sample page</a>). <a href="http://www.unicamp.br/~hans/mh/glas.jpg" class="link-external">Another picture </a>came up in a Google search that is also similar. <br> <br>Does anyone know of any other books or magazines with layout in a similar vein? Hopefully my little public library will have a few of them.</p>
