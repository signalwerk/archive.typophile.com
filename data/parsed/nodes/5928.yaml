    html: <p>Zach, (first sorry for butchering your name) isn't it the ultimate goal in communications to convey a message while not even noticing how its presented? A good example was an article in Photoshop User. Bert Monroy is an unbelievable Super Realist Illustrator, but he's a poor writer and the layout for his multipart article was so bad you couldn't figure out what followed each other. There wasn't a clear cut flow to the paragraphs. I wrote to the editor about this and the next issue his second part of his article the paragraphs were numbered so you could easily follow the instructions.</p>
