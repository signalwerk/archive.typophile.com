    html: "<p>I couldn't get by the horrible layout to read the content. Keep this in mind. Ask yourself what is most important, reading the content or art for art sake. <br> <br>I am trying to keep this in mind =96 the main reason I inquired here was = so that I could see if this sort of idea has ever been done in a way = that doesn't destroy readability. To draw a musical analogy, while I'm = trying to avoid the layout equivalent of Bach or Mozart, I'm equally = trying to avoid atonalism... somewhere around Bart=F3k is where I'm = trying to be. It will probably be a hard balance to find, especially by = someone as inexperienced as I am. Maybe another way of describing what I = have in mind is blurring the line between form and content, rather than = just mixing up the form for the heck of it. Of course putting an idea = like that into actual practice is the hard part. <br> <br>By linking those two examples I wasn't necesarily saying I think those = are great examples of experimental layout, just the only examples I = could find. A slightly less-offensive example that I forgot about is = Derrida's Glas, which is basically two columns per page, one with = a text on Hegel and the other on Jean Genet. (If I had read it I might = be able to explain why this choice wasn't just for the heck of it = either.) A sample spread is on this page: <a href=\"http://nersp.nerdc.ufl.edu/~mrogal/th5.html\" target=\"_blank\">http://nersp.nerdc.ufl.edu/~mrogal/th5.html</a> <br> <br>zach</p>"
