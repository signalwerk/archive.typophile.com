    html: <p>I loved House of Leaves. I still think it is one of the best literary works I've ever read. I saw Danielewski's name twice in the end credits of the Derrida documentary (<a href="http://www.deridathemovie.com" target="_blank">www.deridathemovie.com</a>). But I wonder, do you intend to write all the material and layout the entire zine yourself? <br> <br>A lot can be observed from Danielewski's approach, who spent 10 years writing House of Leaves before he learned how to use the software and typeset it himself. After all, how well would you be able to understand what he's trying to write after it's been broken up by a hired typesetter who sees only the sentences and paragraphs and where they should start and stop? Or whether the footnotes should run down the margins, or the bottom of the page, or inside a box with a blue border which is continued at the same position for 8 right-facing pages with the mirrored version on the left facing pages before coming to an end at solid black box? <br> <br>I just think it would be too difficult for a zine. <br> <br>For those of you who haven't read this book, I highly recommend it. You cannot ignore the typesetting</p>
    html_clean: <p>I loved House of Leaves. I still think it is one of the best literary works I've ever read. I saw Danielewski's name twice in the end credits of the Derrida documentary (<a href="http://www.deridathemovie.com" target="_blank" class="link-external">www.deridathemovie.com</a>). But I wonder, do you intend to write all the material and layout the entire zine yourself? <br> <br>A lot can be observed from Danielewski's approach, who spent 10 years writing House of Leaves before he learned how to use the software and typeset it himself. After all, how well would you be able to understand what he's trying to write after it's been broken up by a hired typesetter who sees only the sentences and paragraphs and where they should start and stop? Or whether the footnotes should run down the margins, or the bottom of the page, or inside a box with a blue border which is continued at the same position for 8 right-facing pages with the mirrored version on the left facing pages before coming to an end at solid black box? <br> <br>I just think it would be too difficult for a zine. <br> <br>For those of you who haven't read this book, I highly recommend it. You cannot ignore the typesetting</p>
