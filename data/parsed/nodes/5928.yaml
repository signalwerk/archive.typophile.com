    html: "<p>Ricardo, thanks for that link -- it would've never occurred to me but you're right.  <br> <br>The Talmud example is perhaps a good segue into one class of the ideas I'm toying with: unusual juxtapositions. I am pretty sure that in the Talmud (someone correct me if I'm wrong) the centermost text is the scriptures (exactly which I'm not sure), surrounded by notes/commentary on it (by some ancient authority?), and then notes/commentary on the first layer of commentary (by some less ancient authority?). <br> <br>One kind of \"unusual juxtaposition\" would be to take the Talmud idea pretty literally: first write a \"core article,\" then get someone else (or myself, or myself under pseudonym?) to write running commentary on it, perhaps pro, perhaps con; and then either leave it at that or repeat with a third person. This, I think, would disturb readability hardly at all, especially if the comments were outside of the core article's text box. (Like in the Talmud example.)  <br> <br>Actually, I just remembered, now that I wrote this, a book I read a while ago called <i>The Post-Evangelical</i>. It's basically a controversial book, for evangelicals at least, that argues for a new phase in evangelicalism. For the American edition they got six or eight well-known evangelical (or Christian at least) thinkers to do running commentary in little text boxes peppered throughout. They cover a fairly wide spectrum, so they develop some interesting conflicts of perspective, both with the author and between each other. So that would be a variation: getting a bunch of people to do one level of commentary, instead of concentric levels. (Sample pages are <a href=\"http://www.amazon.com/gp/reader/0310253853/ref=sib_dp_pt/103-1822977-9008604#reader-link\">here,</a> click 'excerpt'.) <br> <br>Another variation on this idea would be to replace the core article with something else, such as public domain material like speeches, or copyright-expired (e.g. Dover) stuff. Yet another variation would be replace the direct commentary with quotes, statistics, sidebars, etc., but instead of choosing material that is directly relevant to, and in agreement with, the core text, as one conventionally does, choosing material that undermines it, or just doesn't seem to even be about the same topic. Like how the two texts in <i>Glas</i> are about different things. <br> <br>Probably these ideas aren't particularly mind-blowing, but I think if done with some thought, you could get some interesting effects, and without the disruption for the reader (or layout fatigue Jesse is alluding to) that the more radical ideas I have might cause.</p>"
