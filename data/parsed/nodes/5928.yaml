    date_raw: 20 Aug 2004 — 11:34pm
    votes: null
    html: "<p><i>isn't it the ultimate goal in communications to convey a message while not even noticing how its presented? </i> <br> <br>No, I don't think there is one single goal, let alone an ultimate goal. Readability, or conveying the message, is one goal, probably the most important one most of the time, but I think you can pursue other goals without <i>necessarily </i>hampering readability too much. Or -- harder to imagine or execute -- \"hampering\" it in a way that serves a larger purpose. I realize the line between this and the kinds of bad design experiments people have been sharing is a thin one. <br> <br> <br>Maybe I should spill some of my half-formed beans about this project. I think the two main things I'm trying to get past are: (brace yourself for po-mo scare quotes) <br> <br>1. The idea of linear, \"original\" texts that we, designers, simply put onto the page in one form or another that has no effect on what \"the text\" \"says\" or \"means\". That design is purely an interpretive art parasitical on writing. <br> <br>2. Also, the idea that these texts are simply and only outward expressions of some inner state of the author: that they are self-identical, that they mean one thing and not another, and that the author, if asked, has final say on what the text actually means.  <br> <br>I realize a lot of these ideas are old hat, but it just doesn't seem to me that they have trickled down into affecting the practice of graphic design/typography to a great degree. (Not that I am an expert.) I have had a few humble ideas for how to make intelligent (I hope) use of them, which I will try to post in the morning.</p>"
    html_clean: "<p><i>isn't it the ultimate goal in communications to convey a message while not even noticing how its presented? </i> <br> <br>No, I don't think there is one single goal, let alone an ultimate goal. Readability, or conveying the message, is one goal, probably the most important one most of the time, but I think you can pursue other goals without <i>necessarily </i>hampering readability too much. Or -- harder to imagine or execute -- \"hampering\" it in a way that serves a larger purpose. I realize the line between this and the kinds of bad design experiments people have been sharing is a thin one. <br> <br> <br>Maybe I should spill some of my half-formed beans about this project. I think the two main things I'm trying to get past are: (brace yourself for po-mo scare quotes) <br> <br>1. The idea of linear, \"original\" texts that we, designers, simply put onto the page in one form or another that has no effect on what \"the text\" \"says\" or \"means\". That design is purely an interpretive art parasitical on writing. <br> <br>2. Also, the idea that these texts are simply and only outward expressions of some inner state of the author: that they are self-identical, that they mean one thing and not another, and that the author, if asked, has final say on what the text actually means.  <br> <br>I realize a lot of these ideas are old hat, but it just doesn't seem to me that they have trickled down into affecting the practice of graphic design/typography to a great degree. (Not that I am an expert.) I have had a few humble ideas for how to make intelligent (I hope) use of them, which I will try to post in the morning.</p>"
