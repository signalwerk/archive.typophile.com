    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Font%20Retailers" class="freelinking" rel="nofollow">Font Retailers</a> : Font Bros</strong></p>
    <p>Launched August 2006, Font Bros Typography Supply Company is the brain-child of <a href="/wiki/Stuart%20Sandler" class="freelinking" rel="nofollow">Stuart Sandler</a> and <a href="/wiki/Mike%20Ibach" class="freelinking" rel="nofollow">Mike Ibach</a>. As a font retailer of display typography, Font Bros offers selections from other foundries including: <a href="/wiki/Astigmatic%20One%20Eye" class="freelinking" rel="nofollow">Astigmatic One Eye</a>, <a href="/wiki/ByAndreas" class="freelinking" rel="nofollow">ByAndreas</a>, <a href="/wiki/Mark%20Simonson%20Studio" class="freelinking" rel="nofollow">Mark Simonson Studio</a>, <a href="/wiki/Alphabet%20Soup" class="freelinking" rel="nofollow">Alphabet Soup</a>, <a href="/wiki/Fonthead%20Design" class="freelinking" rel="nofollow">Fonthead Design</a>, <a href="/wiki/CBdO" class="freelinking" rel="nofollow">CBdO</a>, <a href="/wiki/Sideshow" class="freelinking" rel="nofollow">Sideshow</a>, <a href="/wiki/Wilton%20Type" class="freelinking" rel="nofollow">Wilton Type</a>, <a href="/wiki/Blue%20Vinyl" class="freelinking" rel="nofollow">Blue Vinyl</a>, <a href="/wiki/Font-O-Ville" class="freelinking" rel="nofollow">Font-O-Ville</a>, <a href="/wiki/Outside-The-Line" class="freelinking" rel="nofollow">Outside-The-Line</a>, and <a href="/wiki/Sparkytype" class="freelinking" rel="nofollow">Sparkytype</a>. Font Bros is also the exclusive retailer of the ever-popular <a href="/wiki/Fontalicious" class="freelinking" rel="nofollow">Fontalicious</a> fonts which have been re-mastered for release on the site.</p>
    <p>URL: <a href="http://www.fontbros.com" title="www.fontbros.com">www.fontbros.com</a></p>
