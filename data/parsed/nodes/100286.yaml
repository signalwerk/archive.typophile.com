    html: <p>Most laypeople--even grad-school admissions officers--can't tell Bodoni from baloney. A best-case scenario is that they won't even notice you used a different font for the extract quotes. A worst-case scenario is that they will notice, and think it's a mistake. My suggestion would be either to use Baskerville throughout, or use something obviously different for the extract quotes, maybe a humanist sans serif like Agenda Light.</p>
