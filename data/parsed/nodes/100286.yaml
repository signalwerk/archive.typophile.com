    html: "<p>Alex, as others already pointed out, I wouldn't set indented quotations in a different font: I think you should mantain the overall texture of the page homogenueus. Instead, you could try a smaller size and leading (eg. main text in 11 pts, quotations in 9,5): that is the standard way in essays literature. Which Baskerville are you using, by the way? It looks like some version of Berthold or Luin's \"Classico\". And may I suggest you to check the apostrophes? The ones you're using don't seem right.</p>"
