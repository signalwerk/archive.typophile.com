    html: <p>I don't think an admissions committee will put your application in the reject pile due to use of weird fonts, but I think if the Baskerville doesn't get along with the text you are quoting, you should consider changing the whole document rather than using a completely different font for the extracts. FWIW, for an essay that covers all of Habsburg history from Middle Ages to 1918, I'd probably use something that looks academic but otherwise kind of "neutral", like Sabon or Minion.</p>
