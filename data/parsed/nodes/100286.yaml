      <p>I think that pairings such as Baskerville + Centaur don’t work at all. If I noticed such a setting, I would assume that somebody made a mistake. Mojo’s suggestion—a humanist sans—sounds (and probably looks) better to me. Have a look at <a href="http://www.stormtype.com/family-john-sans.html" rel="nofollow">John Sans</a> for something that blends in well with Baskerville.</p>
