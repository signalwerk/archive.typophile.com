    <p>I'm in the process of editing and reformatting some old undergraduate papers of mine (for possible use as "academic writing samples" for some of my upcoming grad school applications).</p>
    <p>This particular one is a history paper on the Habsburg dynasty.  I've chosen to set it in 11pt Baskerville, which works fairly well.  However, there are a couple of places where I use indented quotations from a primary source (a publication of laws by Charles V).  I'd like to use a slightly different font for these, but I'm having trouble finding something appropriate.</p>
    <p>I want something that not only combines well with Baskerville, but doesn't immediately scream "different font here".  However, if possible, I'd also like something that can evoke the sixteenth-century European origin of the text.  (The original folio was printed in London in 1532, in English; I assume it was translated from either German or Latin.  It appears to use something similar to Caxton's Flemish blackletter types; <a href="http://www.altsan.org/creative/actes_xxvi.png" rel="nofollow">here's a sample from the microfilm version I used</a>.)</p>
    <p>At the moment I'm using Janson Text, but I'm wondering if something slightly more archaic would be better.  Are there any good fonts out there that could evoke a very subtly Teutonic feel without clashing with Baskerville?  (Preferably one that's either included in Windows or Office, or at least is not expensive; this is not paid work so I don't have a budget to speak of.)</p>
    <p>Here's a sample of what I have at the moment: <a href="http://www.altsan.org/creative/Habsburg_excerpt.pdf" title="http://www.altsan.org/creative/Habsburg_excerpt.pdf">http://www.altsan.org/creative/Habsburg_excerpt.pdf</a></p>
