    <p>Hi all, wanted to post a mark in progress I’m working on to get some feedback, this a personal identity for a portfolio/blog site. I’ve been through lots of sketches and I’m at this point trying a purely typographic mark, though I’m not necessarily sold on that approach. The kerning on “digital” needs some work but I’m more looking to see if the overall idea is working at this point. Any feedback or ideas for other typeface combinations or other directions to try greatly appreciated, thanks.</p>
