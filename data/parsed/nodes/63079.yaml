      <p>I think the lettering style looks cool - I guess it just depends on what you want your logo to say about you. I see "modern", "friendly", "slightly techno", "systematic yet playful".<br>
      I like the stacked version. I also enjoy the n-i pair and how your "a" is the reverse of your "e". I would tweak the kerning a bit here and there: I think you need to tighten up d-a and s-m<br>
