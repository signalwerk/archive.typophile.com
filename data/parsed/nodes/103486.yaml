      <p>Hello Rafa,</p>
      <p>I found myself in this very same situation as I think a lot of people taking on a typeface for the first time found themselves. </p>
      <p>I'm by no means an expert in typeface design but I have tackled a few typeface projects already!</p>
      <p>Check my work here if you like: <a href="http://www.behance.net/jonathanmartin" title="http://www.behance.net/jonathanmartin">http://www.behance.net/jonathanmartin</a></p>
      <p>Firstly I would recommend getting the book 'Designing Type' by Karen Cheng. This book is recommended by many professional typeface designers and it's a really excellent reference book - well worth the £20!</p>
      <p>I really like your design to begin with, some really interesting forms coming through! I started with a geometric for my first typeface design (Fassade) but the lowercase is the really challenge as I'm sure you may have already found.</p>
      <p>I think you need to be made aware of 'optical balancing' in typefaces. Although geometric typefaces give the impression all the strokes are the same weight this is not actually the case, certainly not in Futura's case.<br>
      So all the strokes will need adjusting slightly: the horizontal strokes are slightly thinner than the vertical strokes. If you where to look at futura close up and analyse the strokes you will see that their is a slight stroke weight variation. This stroke contrast becomes even greater in the bolder weights.<br>
      (this is carefully examined and explained in 'Designing Type' book.)</p>
      <p>Secondly the other thing that needs attention is with the lowercase letters that contain a curved stroke meeting a straight stroke b, d, p, q for example. In Futura these are not just a circle bolted onto a straight stroke. As you will see if you were to closely examine Futura's b, p, q etc. the curved stroke tappers into the straight stroke. This is to  reducing the visual weight at the joint. Remember that typefaces are not mathematical structures (even geometrics) they have to prove themselves to the eye and rarely does this happen if they are made to strict mathematical shapes and grids. - Paul Renner's understanding of optics is what makes Futura such a brilliant design </p>
      <p>I strongly recommend that you get a hold of a copy of 'Designing Type', as it explains these details in typefaces much better than I ever could on this forum. </p>
      <p>Your design looks good at the moment it just requires some slight adjustments. I hope this has been useful. </p>
      <p>Jonathan</p>
