    <p>Hello all,</p>
    <p>First of all I want a thank to the people in this forum for the support and knowledge given, although this is my first post I've been consulting the site on a regular basis and has been always a great help.</p>
    <p>I was trying to create a typeface of my own based on early geometric fonts like Kabel or Futura with a contemporary look to work as a display typeface with alternate glyphs and features for titling, but the project has become a monster itself and I'm getting stuck in the way and I'm a bit desperate for a second opinion.</p>
    <p>Open type programming and kerning have become a pain and I am aware of some inconsistency across some glyphs and symbols, curves are far from perfect and the are more problems for sure.. so I feel it may need a close analysis from someone outside to get to the critical points and have a real feel about the project.</p>
    <p>I have attached a PDF with the basic chart, alternate caps, small caps and diacritics. Please ask for more if you think you need closer details or anything that could help.</p>
    <p>Thanks in advance,<br>
    Rafa</p>
