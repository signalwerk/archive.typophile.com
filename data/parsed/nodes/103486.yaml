      <p>@JM Type Design</p>
      <p>Hi Jonathan,</p>
      <p>Thanks for the reply! I am already familiar with your work on behance and your types, I have to say Fassade project is really close to my approach, but maybe mine is a bit more radical in embracing geometry and the alternative forms  are a bit more experimental.</p>
      <p>I am also familiar with the optical balance made on Futura and other geometric types, and already got the Karen Cheng's book! A very helpful manual on typedesign on my opinion as well. The point is that I was trying to make those adjustments not so obvious to get a more radical look, as the font is intended to work as a display typeface I was trying to avoid the tapering of the stroke more subtle.  For a bold font like this maybe those joints need more attention and I will need to taper them a bit more to reduce some weight. </p>
      <p>If you think you can get into more detailed issues in the font or into concrete glyphs problems feel free to say whatever you think, it will sure be useful for me as I was looking for a second pair of eyes or more.   ;)</p>
