      <p>Hi Jon, </p>
      <p>I've been thinking these days on doing just the opposite with the R glyph, and maybe rise their waist a bit to see if matches other glyphs like E, F, G and H... </p>
      <p>Know the horizontal strokes of A, P and R have almost the same distance from the baseline and i think it could allow the trick so i can leave A, E, F like they are right now, and have their waist lowered only for the alternate caps which are also more expanded as you can see on the PDF.</p>
      <p>Another major issue you could be right is about the C... I liked the look it gives to the font but perhaps it is just too much, maybe I can have this as an alternative form by using stylistic sets or having this on the alternate caps, and make the font a more functional tool as you say.</p>
      <p>I'm afraid these are busy days for me but I'll try to make those adjustments and upload the results asap.</p>
      <p>Many thanks for your help!</p>
