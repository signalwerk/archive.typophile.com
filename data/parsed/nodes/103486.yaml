    html: |-
      <p>This typeface really seems to combine the features of many typeface released at around the same time as Futura. Erbar Grotesk, Elegant Grotesk, Kabel, and the lowered waist on the R reminds me of architectural lettering like Neutraface. </p>
      <p>I think it might be a case of just getting the consistency right. There a lot of ideas going on at once, maybe try and refine these forms abit. For example see what happens if you lower the waists on the E, F, A etc like you have done with the R? On the other hand the features you all ready have will give each letter a unique voice, especially at display sizes. </p>
      <p>It's a very careful balancing act. I think you defiantly need to find more of a balance so it becomes more of a functional tool and not just an experimental display face. I really like the E, the M, the Q has a really nice tail I think the only glyph that doesn't quite work is the C.</p>
      <p>Just keep plugging away looks great so far!</p>
