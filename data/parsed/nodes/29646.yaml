    <p>Hello, first post!</p>
    <p>i was wondering if anyone could tell me the type used for orange’s idents?  </p>
    <p><a href="http://www.orange.com/images/common/orange.gif" title="http://www.orange.com/images/common/orange.gif">http://www.orange.com/images/common/orange.gif</a>, also, <a href="http://www.orange.co.uk/" title="http://www.orange.co.uk/">http://www.orange.co.uk/</a></p>
    <p>i’d primarily like to know the typeface used in the logotype, but also what the other collateral faces that are used, like the light title text, for example....</p>
    <p>cheers,</p>
    <p>Tom</p>
