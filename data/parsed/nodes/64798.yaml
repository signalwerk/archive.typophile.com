      <p>What I'm referring to is U&amp;lc fonts where the ONLY difference is that one has old style figures as the default, and the other has lining figures. So, a different beast than the "SC + OSF" font.</p>
      <p>But even if you are using "U&amp;lc + LF" and you want to convert the figures to those in the SC+OSF font, you could use "find/replace" (if your app has a change-font component in that search feature.</p>
