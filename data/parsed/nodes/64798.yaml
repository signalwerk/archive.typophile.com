      <p>Another option is to have someone (or ask the foundry) to generate a custom version of the font for you with the oldstyle figures in the U&amp;lc font. I used to do this for some of my book work -- after either ascertaining that the standard EULA allows such modifications (i.e. Adobe fonts) or contacting the foundry for permission to do so.</p>
      <p>It was precisely this frustrating experience that led me to develop Whitman with two different figure style fonts and convince FB to release it that way. (This was prior to OpenType.)</p>
