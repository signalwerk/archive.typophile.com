    <p>Is there some way to easily use old style figures in non-OpenType fonts that support small caps and old style figures without having to format the number individually?</p>
    <p>This can be very time consuming in text that has a lot of numbers.</p>
    <p>Any suggestions for a quick formatting approach would be appreciated . . . is there some kind of script out there?</p>
    <p>David</p>
