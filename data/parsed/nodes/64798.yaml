      <p>If your version of InDesign happens to be the latest -- CS4 -- you can simply use a GREP style to toggle a font for digits only.</p>
      <p>In short: create a <em>character style</em>, only defining the font for the alternate digits; then, in the appropriate paragraph styles, create a new GREP style. Coincidentally, these are predefined with "\d" -- i.e., "all digits" -- so all you have to do is set the character style.</p>
      <p>And for older versions of ID, I'd suggest creating a character style and simply use search-and-replace to find all digits -- use "^9" as search code -- and replace with no text, and in formatting: your character style.</p>
      <p>Note that <em>both</em> options heavily rely on the fact that the digits should have the regular character codes (as you are only changing the font). If you have a font with both lining and oldstyle digits, you cannot use this trick and have to manually replace each digit one by one.</p>
