      <p>The payment is nice, even if it is 90 days later :)<br>
      For me with custom work, the deadline seems to speak the loudest. On my self iniated work, I'm prone to let time work out the problems, maybe let a font simmer on the back burner for awhile. I can only paraphrase, but about 5 years ago Eye magazine featured a Gerard Unger interview in which he mentioned having to build in time for reflection as a way to counteract the sometimes speedy process of drawing glyphs.</p>
