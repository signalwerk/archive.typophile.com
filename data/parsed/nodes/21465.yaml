    <p>How many new retail typeface releases (families, not individual fonts) do you figure there are in a year?</p>
    <p>How many from your particular foundry?</p>
    <p>For us at Adobe, I think these days we are down to only a couple of new type families each year (not counting non-western designs).</p>
    <p>Regards,</p>
    <p>T</p>
