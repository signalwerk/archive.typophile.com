    html: |-
      <p>I said I touched 200 fonts last year. I touched them for different reasons. Sometimes its hinting, sometimes its changing font formats, sometimes its adding extra glyphs, sometimes its designing new weights, and sometimes its designing new fonts. The work could take several minutes to several weeks. I have on occasion drawn a complete Type1 character set over the weekend, and kerned it on Monday, but I agree with Eric, that it is important for reflection. So you do wind up saving the reflection for your own work. Your custom clients are not paying you to reflect.</p>
      <p>James</p>
