    <p>It is a "little" similar to Optima but the numbers are different, especially the "5".</p>
    <p>The number "52".<br>
    <a class="freelinking external" href="http://www.axisandallies.org/files/images/aap1940-3330.preview.jpg">http://www.axisandallies.org/files/images/aap1940-3330.preview.jpg</a></p>
    <p>I have a science fiction novel that has the same style of numbers, and it was printed back in 1983. </p>
    <p>New Millennium Sans is a bit similar except for the numbers and being too recent.</p>
