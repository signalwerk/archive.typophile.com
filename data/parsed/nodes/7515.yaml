  html: "<p>This may not come directly under 'identifying type' but since that's my ultimate purpose I thought I'd post this here. <br>I'm presently working on a research project which requires the design analysis of about 200-300 books. One of areas I'm looking at is typography and I've been looking for a simple way of classifying typefaces that is neither too general (ie. plain ole serif, sans serif etc.) nor too detailed (down to the exact typeface).   <br>The closest I've come to something that would work for me is the system that classifies type under 11 different categories: Humanist, Garald, Transitional, Didone, Mechanistic, Lineal, Incised, Script, Manual, Black Letter and Non-Latin.  <br>However, some of the books I'm analysing have typewritten and handwritten elements. Now, I know these aren't 'typefaces' but their intention is take on the role of a typeface - so it would be nice if there was a system that did account for these as well. <br>Or is that asking for too much?! <br>Any advice would be greatly appreciated.  <br> <br>R</p>"
