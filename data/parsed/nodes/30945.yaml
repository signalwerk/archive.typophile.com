    <p>I am so bummed that the Alphabet Synthesis Machine is gone! (<a href="http://alphabet.tmema.org" title="http://alphabet.tmema.org">http://alphabet.tmema.org</a>)</p>
    <p>My FontLab class has an exercise that is centered around that, so now I am looking for a replacement. What other font creating machines are there online? I've been searching and haven't found anything.</p>
    <p>All suggestions appreciated!</p>
    <p>Thanks.</p>
