      <p>Wow! Is that cool. Or awesome. Or twenty-three skidoo. Or whatever the hell the Armenian equivalent of <em>any</em> of those terms is. I have never seen anything exactly like that. Which says a lot,</p>
      <p>Which leads me to conclude that this is the effort of a REALLY good sign-painter or lettering artist, given all of the other visual clues. However, finding the responsible party might not be a cakewalk.</p>
      <p>On the other hand, it would be a much more enjoyable way of wasting a lot of time than watching a bunch of truly awesome cat videos. If you know what I mean…</p>
