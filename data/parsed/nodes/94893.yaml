      <p>If you don't mind being a bit crass you could use "kaken", literally: "of the shit". But that's Beirut-Armenian slang, it won't work most places. Like my license plate, "TOOZ OTO": "oto" is obvious; "tooz" means "fig", which in our slang means "babe". If you're curious, it's the one in the middle here:<br>
      <a href="http://www.thetruthaboutcars.com/wp-content/uploads/2008/08/ford-flex-fashion.jpg" title="http://www.thetruthaboutcars.com/wp-content/uploads/2008/08/ford-flex-fashion.jpg">http://www.thetruthaboutcars.com/wp-content/uploads/2008/08/ford-flex-fa...</a></p>
      <p>hhp</p>
