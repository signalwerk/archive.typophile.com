    html: |-
      <p>What do you mean by "does not work"? Just that the application does not see the font? If so, that may be a naming problem. With FontBook, select your font and type "cmd I" to get the information on it. You should then get its Postscript name, its Full name, its Family and its Style. </p>
      <p>The font is called using the Family and the Style in textEdit and PhotoShop. </p>
      <p>It is called with its Full name in Word and Microsoft applications. </p>
      <p>It can be accessed in various ways in XeTeX. I don't know about Flash. I could even manage to fix a third name for InkScape (using the so-called fields "WSS Family" and "WSS Subfamily") and InkScape would only want to use that name, none of the others.</p>
