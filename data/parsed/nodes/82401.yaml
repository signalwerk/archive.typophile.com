  html: <p>I just created a font on fontlab, i clicked on generate font and successfully installed it to my font book on my mac. Strangely it works in illustrator but it doesn't work in flash, word or powerpoint. Can anyone tell me what is going on???</p>
  html_clean: <p>I just created a font on fontlab, i clicked on generate font and successfully installed it to my font book on my mac. Strangely it works in illustrator but it doesn't work in flash, word or powerpoint. Can anyone tell me what is going on???</p>
