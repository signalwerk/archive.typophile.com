    <p>Hi everyone, brand new here!<br>
    I have been searching everywhere trying to figure out this font and I'm hoping I can get some new insight here. I'm hoping to find the exact font to the new Kodak ads they're running. Neutura is close, but some of the letters are different like the lowercase t. </p>
    <p>Here is an image:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/kodakFont_6525.png"></div><p></p>
    <p>I appreciate any help you guys can offer!</p>
