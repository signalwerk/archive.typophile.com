      <p>This is a new one to me. The closest I could find was <a href="http://new.myfonts.com/fonts/tipografiaramis/dina/" rel="nofollow">Dina</a> by Ramiz Guseynov. It has some of the same idiosyncracies, but it is not identical. I wonder if the same designer may have created this font for Kodak?</p>
      <p>- Mike Yanega</p>
