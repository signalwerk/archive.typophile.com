    <p>This week, the Texas DOT is having an e-vote for our new license plate design. There are five designs, including the current plate. As of this morning the vote totals are as follows:</p>
    <p>“Lone Star Texas”</p><div class="imageWrap"><img src="/files/plate_sky_mountains_6076.jpg"></div>39,165<p></p>
    <p>“Natural Texas”</p><div class="imageWrap"><img src="/files/plate_bluebonnets_6248.jpg"></div>24,759<p></p>
    <p>“Traditional Texas”</p><div class="imageWrap"><img src="/files/plate_traditional_5056.jpg"></div>18,935<p></p>
    <p>“New Texas”</p><div class="imageWrap"><img src="/files/plate_skyline_5640.jpg"></div>12,285<p></p>
    <p>“My Texas” (current design)</p><div class="imageWrap"><img src="/files/plate_my_texas_6127.jpg"></div>9.283<p></p>
    <p>I feel like each one has some detail that bothers me way too much. The red text on the blue background of the current design looks a bit off (though it looks better when printed on metal).</p>
    <p>“The Lone Star State” on the “Lone Star Texas” design is written in brush script, and “The” is  written smaller than “Lone Star State,” which throws me off.</p>
    <p>The “Natural Texas” design is the most passable in my opinion, but that stretched “The Lone Star State” at the bottom looks a bit off.</p>
    <p>The “Traditional Texas” design just screams “Look at me! I know how to use Photoshop!”</p>
    <p>I feel like the “New Texas” design would be a lot more effective with a bold sans serif at the top — it would make the design look a lot more clean and modern.</p>
    <p>Here’s the site for voting:<br>
    <a href="http://apps.dot.state.tx.us/services/vehicle_titles_and_registration/vote_plate.htm" title="http://apps.dot.state.tx.us/services/vehicle_titles_and_registration/vote_plate.htm">http://apps.dot.state.tx.us/services/vehicle_titles_and_registration/vot...</a></p>
    <p>What do you think?</p>
