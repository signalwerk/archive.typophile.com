    <p><img src="http://payload24.cargocollective.com/1/2/88418/2794872/herbie1_2_860.jpg"></p>
    <p>Herbie is a uppercase display font with alternates on every character (lowercase), based only on circles and geometric lines. Herbie is inspired by, as the name might indicate, Herb Lubalin's work and the decorative style and kerning of his era.</p>
