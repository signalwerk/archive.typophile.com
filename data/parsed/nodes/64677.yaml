    <p>Apologises if this has been posted before. While hunting headless men I found this beautiful resource. Large scans, page by page of this illustrated and hand-scribed book.</p>
    <p><a class="freelinking external" href="http://daten.digitale-sammlungen.de/~db/0003/bsb00034024/images/index.html?id=00034024&amp;fip=196.210.192.101&amp;no=48&amp;seite=1">http://daten.digitale-sammlungen.de/~db/0003/bsb00034024/images/index.html?id=00034024&amp;fip=196.210.192.101&amp;no=48&amp;seite=1</a></p>
    <p>It seems to be the full book, I haven't gone through all the pages yet though. And there's a mention of a PDF download - but it's all German to me. :)</p>
    <p>Read more about the book here:</p>
    <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/Nuremberg_Chronicles">http://en.wikipedia.org/wiki/Nuremberg_Chronicles</a></p>
    <p>-Rudolf</p>
