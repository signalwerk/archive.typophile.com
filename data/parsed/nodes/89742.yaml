      <p>Okay, I didn't get the problem from reading your original posting. </p>
      <p>You don't need to »double-click« in the Glyph Palette. You click-and-hold on the base character (&amp;), the fly-out menu appears revealing all the alternative characters for this base glyph. Then you just hover over the one you want and let go. The character will be inserted. I just tried it again using Arno Pro in Illustrator.</p>
