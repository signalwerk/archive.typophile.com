    html: |-
      <p>What version of Illustrator are you using? I’m going to guess CS5. </p>
      <p>(And Ralf, I’m going to guess you’re using something different, probably CS5.5.)</p>
      <p>I’m pretty sure there is a known bug in various CS5 apps such that they do not properly interpret GSUB Lookup Type 3, alternate substitutions. These are the ones that take the syntax “sub <em>x</em> from [<em>x.alt</em> <em>x.alt2</em> <em>x.alt3</em>]”.</p>
      <p>The app only substitutes the first in the list. Which is what Trevor is experiencing. I am able to duplicate his problem on my machine with Arno Pro and Illustrator CS5. (Other fonts, too.)</p>
      <p>We experienced a similar bug with Richard Lipton’s Canto. We noticed it in InDesign, where the entire Swash feature doesn’t work in CS5 because of the presence of a few Type 3 lookups. </p>
      <p>The OTL implementation in InDesign is a little different, so you can in fact insert the glyphs from the glyph palette. I believe that is because InDesign CS5 converts to GIDs when inserting from the glyph palette. (You can also insert the Arno Pro alt ampersands.)</p>
      <p>But copying from InDesign and pasting back into Illustrator won’t help, because Illustrator doesn’t use the GID, instead relying on the feature — which is implemented incorrectly. So, basically there’s no way (that I have discovered) for Trevor to get the ampersand he wants from within Illustrator CS5. </p>
      <p>Various attempts to alter the Canto OTL code to work around this caused it to not work as desired in other versions. So, in the end we decided to leave it, because the feature was in fact written to spec and this is essentially an Adobe bug of not implementing to spec. </p>
      <p>Trevor, you can try scouring the Adobe support sites to see if there was an update release to fix this. I can’t swear that I’m using the absolute latest version.</p>
      <p>I believe these issues are resolved in all CS5.5 versions. (But, of course, that’s an actual upgrade, not an update.)</p>
      <p>Or go backwards. I believe previous versions also work fine. I know CS3 does. Never had CS4.</p>
