    <p>I am new to this place, so let me do some catch-up. </p>
    <p>Set 01 was mostly illustration with the exception of the “Designerd” tee. We designed this one for Matthew to wear at a speaking engagement and I just thought that it was really best suited for production and addition to the Chop Shop line.</p>
    <p>this one is also available for women folk in American Apparel girly sizes.</p>
