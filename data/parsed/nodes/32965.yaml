    <p>Hi, I work for an architects firm regenerating the Royal Festival Hall on London’s Southbank. This is an iconic modernist building, built for London’s 1951 great exhibition:</p>
    <p><a href="https://web.archive.org/web/20081007002221/http://www.southbankcentre.co.uk/about-southbank-centre/transforming-southbank" title="http://www.southbankcentre.co.uk/about-southbank-centre/transforming-southbank">http://www.southbankcentre.co.uk/about-southbank-centre/transforming-sou...</a></p>
    <p>We are currently renovating the 1950’s auditorium and need to replace some of the row numbers. I’m assuming this is probably some classic font and would love to be true to it’s origins. I only have a D so far but will post the rest later this week (once the builders have torn them from the floor! ... sorry... gently pried)</p>
    <p>any help very much appreciated!</p>
    <p>Sam</p>
