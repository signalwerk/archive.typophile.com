      <p>Too bad Master Card’s logo is taken because in some ways that’s the obvious solution with a name like that. Which brings me to my 2 cents. All of these logos ideas are okay but are a little too fussy &amp; clever. I say that because the name itself sounds classy &amp; simple. So I would go that way. Think of obvious stuff &amp; find a way to make that it simple &amp; low key. If you really want to go the other way &amp; be very special effect/lucas film-y; why not a binary stars? One red one blue? Then just pick a font and write the name simply underneath. Or do something with the two holes in the upper case B maybe, but keep it understated.</p>
      <p>Why this name? What’s it mean?</p>
      <p>Thanks for showing this to us.</p>
