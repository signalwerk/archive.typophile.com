      <p>Thank you for all the feedback everyone.  I feel that maybe I haven’t explored the word color as much as I should.  I am having a tough time coming up with concepts of color that aren’t old and used or just to busy (test patterns, color blocks, etc.)  </p>
      <p>eliason the ’57 Chevy isn’t what I was looking for.  I was trying to play with a few scripts just to explore some different typeface options but it doesn’t sound like I got the effect I was looking for-a techy, yet artsy typeface.</p>
      <p>Sharon the dots are supposed to look like the connector circles on circuit diagrams but the more I look at them the more I believe they should be more subtle.</p>
      <p>Eben I really think your on point.  I’ve played with the binary star concept a lot and have missed the mark.  I would really like something modern and understated.  Maybe I will revisit.  I chose the name for two reasons: (1) Playing off the phrase “Primary” Colors and (2) Adding the Binary to mean digital since all my work is ’digital colors’ in essence.</p>
    html_clean: |-
