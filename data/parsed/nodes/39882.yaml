    <p>I’ve just chosen 10 sketches from my discovery phase for a logo for my visual design company Binary Colors.  I specialize in flash animation and motion design.  I want the logo to have a tech feel but still show characteristics of my design background.  Any and all critiques would be appreciated no matter how painful.</p><div class="imageWrap"><img src="/files/bc_final10_4661.gif"></div><p></p>
