  html: "<p>SEA LIFE AT SOTHEBY'S  <br> <br>Please view Jardin Galerie on-line invitation for this event here : <br><a href=\"http://jardingalerie.org/may26.html\" target=\"_blank\">http://jardingalerie.org/may26.html</a> <br> <br>and their Fundraising Site for artists, sponsors and friends here : <br><a href=\"http://jardingalerie.org/fundraiser/5.26.05/index.html\" target=\"_blank\">http://jardingalerie.org/fundraiser/5.26.05/index.html</a> <br> <br>Please join them with your own concrete and/or abstract expression <br>of Sea Life. Contribute to their cause to give a strong voice to <br>children. Celebrate with them as they work to fulfill the mission <br>of Jardin Galerie and Jardingalerie.org : <br> <br>\"SHOWCASING CHILDREN'S ART ACROSS CULTURES <br> AND HIGHLIGHTING ART'S ESSENTIAL ROLE IN <br> DEVELOPMENT, EDUCATION AND COMMUNICATION\" <br> <br> <br>Sea Life [as8].gif [112 Kb] : <a href=\"http://tinypic.com/2005rb\" target=\"_blank\">http://tinypic.com/2005rb</a> <br> <br>-- <br>Alessandro Segalini <br> <br> <br> <br>                    * <br> <br>All of the children who have exhibited with JG  <br>will be making drawings and paintings on the  <br>theme of SEA LIFE and I would like to invite you, <br>my personal friends who are artists, to make a <br>piece of art for this event as well, based on the <br>same theme for exhibition on line and/or at  <br>Sothebys Auction House here in New York. Sotheby's <br>has been very generous in giving us their main <br>lobby at a reduced fee for one night only for <br>this special event. I will show and photograph <br>as many of your artifacts at Sothebys as I <br>possibly can. All works of art sent to us will be <br>shown on line. If you can photograph your work <br>and send us a jpeg ahead of time it would be <br>helpful. If you do not have enough time I will <br>photograph it when it arrives here in New York. <br>Please pass this information along to any other <br>artist that you know and respect who you believe <br>may be interested. <br> <br>Any kind of art will be accepted: Drawing,  <br>painting, sculpture, photograph, lithograph, &amp;c. <br> <br>  John A. Hiigli <br>  <a href=\"mailto:john@jardingalerie.org\">john@jardingalerie.org</a> <br> <br>SEA LIFE evolved out of my attempt to organize  <br>children's art work at the french american  <br>preschool (Le Jardin a l'Ouest) around themes of <br>interest to young children. It really began with  <br>Exhibition #7 in May of 2003, which featured  <br>ANIMALS drawn and painted by children from 3  <br>years to 13. We were surprised at the great  <br>variety of animals that children knew about:  <br>dogs, rabbits, tigers, birds, beavers, unicorns, <br>bears, horses and many other examples of animal  <br>life on the land today. In addition we saw many  <br>examples of fantastic prehistoric creatures, We  <br>also saw examples of sea life (see Max and  <br>Nicholas from the after school group associated  <br>with PS 87 and other West Side Manhattan schools <br>known as For Art's Sake. <br> <br>This gave me the idea for an Exhibition  <br>featuring SEA LIFE, which opened the following  <br>spring with several groups of child artists from <br>Hungary, from Le Jardin and from The Children's  <br>Art Carnival. From the Art Carnival we received  <br>extraordinary collages in the manner of Beardon  <br>of individual fish and varieties of other sea  <br>life and coral found near the ocean's shoreline: <br>fish swimming under water, fish jumping out of  <br>the water (in one case nearly into a fisherman's <br>boat), etc. From Le Jardin a l'Ouest we saw an  <br>assortment of beautifully colored fish swimming  <br>alone and in schools including a bee fish by  <br>Simon. From Hungary we received a number of  <br>interesting sea vessels and a great variety of  <br>imaginative sea creatures, including: sharks,  <br>penguins, squids, crocodiles, star fish, whales, <br>a green fish growing flowers on his/her back, a  <br>fish shaped like a stringed instrument propelled <br>by twin helicopter blades, a red-white-green flag <br>fish, and a fish taking the shape of a question  <br>mark. <br> <br>These exhibitions demonstrate the great  <br>expressive power of children's imagination when  <br>focused around a theme that they know and are  <br>naturally interested in. <br> <br>As adult artists we consider the great seas in a <br>different way than do our children. We are aware  <br>of the importance of the sea for our survival as <br>well as our pleasure. This year we learned all  <br>too vividly that as the sea gives to us she also <br>taketh away. By joining together with children in <br>working around the theme of SEA LIFE we can focus <br>our creative energies around the beauty and the  <br>mystery of a powerful aspect of our lives that  <br>touches nearly all of us in some way. At the  <br>same time we can make a contribution to those  <br>who have suffered from forces of nature that can <br>be at times difficult to fathom. <br> <br>The benefit art exhibition/auction Sea Life will <br>donate a portion of its proceeds to an  <br>organization attempting to rebuild in South East <br>Asia. It will also focus our attention on the  <br>efforts of children's arts organizations here in <br>New York and overseas who believe in the power of <br>children's art to express love, knowledge, hope  <br>and joy ! <br> <br>                    *</p>"
