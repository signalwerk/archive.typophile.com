      <p>Here's what I would do.<br>
      For "CEO" and "YOU" use the small caps from the new font Baghadeer <a href="http://www.typophile.com/node/106934" title="http://www.typophile.com/node/106934">http://www.typophile.com/node/106934</a> in either regular or bold as appropriate. For "of" use the same font in the illustrated book cover or the script from Baghadeer. No gradient, this will fix the contrast issue. Just use the same blue that is used for the author's name.<br>
      I would make "CEO" and "YOU" the same size. And don't try to put "of" behind stuff. Just place that word in it's normal place so you can read it on Amazon.<br>
      I think the picture is okay. This author is giving some tough, straight talk to the buyer. Test and see if you can read the subtitle at Amazon size. Decide whether you need to read this (the subtitle) on Amazon or not.</p>
