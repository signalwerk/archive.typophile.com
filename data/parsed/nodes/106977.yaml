      <p>That's a tough one, MissDaisy. There are three ways that I see you can approach this:</p>
      <p>1) Use the same image but move and rotate it so that it looks as though she's leaning on the right edge. This will give her a business casual "You" feel. A little more personal and approachable. The arms crossed and the dominating presence is intimidating... truly not working as a friendly authority.</p>
      <p>Now you have room on the left side to play with the type flush left.<br>
      "Center-type is a convention best remaining in poetry." my art director would say...</p>
      <p>2) Find a new image in the shoot where she's not crossing her arms. Perhaps one that looks like she's pulling you aside for a pep-talk.</p>
      <p>3) Pitch a whole new idea after you do exactly what she wants and give her the best damn sales pitch on why your idea is superior.</p>
