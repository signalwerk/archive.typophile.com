    <p>Designed this book cover, and it seems missing to me. I was trying to go after a sexy, bold font.<br>
    Client wants her whole body on the cover. Problem I think is that it looks fine if you are looking at it, while holding in your hand; but won't stand against competition on an Amazon page. Any suggestions for a better bold, sexy sans serif for title, would be appreciated.</p>
    <p>Would love valid criticism and suggestions besides it looks amateur...</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CEOofyou2F_3458.jpg"></div><p></p>
