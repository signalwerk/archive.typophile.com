      <p>Dear Bald Condensed,</p>
      <p>No offense was taken by me and I certainly hope none was taken by you. I did not intend to give the impression that I was trying to stymie your efforts to provide a validated identification to our friend Drmns. I have spoken with Johnathan recently and he mentioned that they are very busy with EXCHANGE. I simply was trying to help you ferret out the truth in a timely manner. If any offense was taken by you, I offer my most sincere apologies. My colloquial expressions often get in the way of my meaning.</p>
      <p>If facts are what you are after, I have a handful of leads for you:<br>
      - The two sources I previously mentioned are relevant to this discussion.<br>
      - Check with Scott Stowell at Open. He commissioned the font. I am sure that he will offer good information since he has been a friend of Johnathan's since before Jonathan shared that tiny office with Barry Deck. My goodness! What a scene that was!<br>
      - If my memory is correct, this particular version of RETINA was shown as an example of Tobias' work in the TDC Annual in 2001. I believe that the caption mentioned Art:21. I could be mistaken on that last point. I do not have this annual anymore, but you should look into it.<br>
      - Do check with H&amp;FJ. They are busy but they are also very generous. They will eventually reply to your inquiry. Please tell them I said hello.</p>
      <p>Do you go through such extensive lengths to validate all type identifications in this forum? Impressive! Thank you for all your hard work!</p>
      <p>Do you know what Stephen finds funny about my earlier comment? I think he is making a joke at my expense.</p>
      <p>Sincerely,<br>
      Randolph T. Burke</p>
