    html: |-
      <p>It IS Cyrillic, but it's the version that was developed for religious texts. Do some searches for Slavonic or old church Slavonic and you should find a fair number of fonts to add to Izhitsa. Not encouraged during the Soviet era but afterwards a popular letter-form for Russian and Ukrainian book titles, headings and advertisements.<br>
      Don</p>
