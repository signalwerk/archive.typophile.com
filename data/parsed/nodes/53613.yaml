    <p>While looking through the bookstore, I came across this book. The cover caught my eye. It's so simple, yet it still has some elegance to it. The tree on the cover reminds me of the little scribbles I make in my notebook. I couldn't find a picture of the back cover, but it has similar swirls around the edges.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/3willows cover_3496.jpg"></div><p></p>
    <p>I also found this book, The Joy Luck Club. The title is so familiar, but I've never read it. I love the cover. I like the color scheme and the simple design...I think it has a sort of Asian feel to it. It is simple and elegant and I like it, and even though stacking type is a type crime I love how the author's name makes the cover asymmetrical.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/joy luck_4577.jpg"></div><p></p>
