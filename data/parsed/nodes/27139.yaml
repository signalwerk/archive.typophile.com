  html: "<p>POSITION AVAILABLE <br> <br>Title       TYPEFACE DESIGNER <br>Location    New York, NY <br>Date        30 November 2004 <br> <br> <br>Hoefler &amp; Frere-Jones has a rare opening for a full-time typeface designer. <br> <br>This designer will contribute to a design program that specializes in the invention of original typefaces, and develops designs for some of the world's leading publications, corporations, and institutions. <br> <br>Duties will include font prototype development, adaptation and extension of existing designs, and all aspects of technical production from drawing to kerning to final manufacture. Applicants should be intimately familiar with typography and its history, and have direct experience drawing letterforms digitally, preferably in a type development program such as FontLab or Fontographer. Applicants will be expected to exhibit strong analytical skills, good problem-solving abilities and a predilection for technological solutions, and excellent verbal and written communication skills. <br> <br>A strong candidate will have professional experience working with font development software to create typefaces in industry-standard formats (PostScript, TrueType, OpenType), and/or familiarity with the Python programming language. However, this position is open to applicants of all levels, from recent college graduates to experienced type designers. <br> <br>The position is full-time in our offices in New York City. No exceptions! <br> <br>Required Experience: <br> <br>   - Proficiency with the Macintosh operating system (OS9/OSX) <br>   - Fluency with PostScript drawing tools <br>   - Working knowledge of type history <br>   - Maniacal obsession with letterforms <br> <br>Preferred Experience: <br> <br>   - Proficiency with FontLab, RoboFog, or Fontographer <br>   - Professional experience in type design or graphic design <br>   - Object-oriented programming experience, ideally Python <br>   - Familiarity with Windows operating systems (XP/NT) <br>   - BS/BA or equivalent <br> <br>Please send r</p>"
