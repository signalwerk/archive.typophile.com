      <p>&gt; <em>Well, sometimes Illustrator renders a different crazy blend (shown in second pic) out of nowhere</em></p>
      <p>Blend is based on outline interpolation. Strange transitions may happen when the paths are not compatible: different number of nodes, different starting points, or different path directions.<br>
      In Illustrator, path direction is controlled in the "Attributes" palette.</p>
