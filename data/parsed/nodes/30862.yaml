      <p>It took me a few looks but I finally noticed your "bug" the odd shape of the first blend between the first object and the 3, correct? </p>
      <p>I would say, to a degree this "bug" can be reproduced. Notice the path that the blend is set to, though it's a non-stroked path, it still acts like any other path in illustrator. Meaning you can adjust the end points and the actual path, maybe by adding curves (which would change the angle of the blend in an abnormal way.) You might even try adding other path based filters (such as the zig-zag) and vary the blend mode (smooth blend to specific steps).</p>
