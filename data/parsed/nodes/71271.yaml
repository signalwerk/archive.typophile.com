    html: |-
      <p>Thanks, guys. I think I get it; at the smaller sizes where hinting would do the most good, the distress wouldn't be visible, so it sort of defeats the purpose of using a distressed font at a smaller size where the hinting is required.</p>
      <p>That makes sense. I think I will skip the hinting unless testing shows it to be an absolute necessity. I find it doubtful anyone would want to use the font at sizes lower than, say, 16 pts anyway.</p>
      <p>Most of the real-world samples I have seen from the era (newspapers, books, broadsides, &amp;c.) showing distress of this sort have been set at about 16 or larger, anything smaller is usually much crisper (i.e. inked less), and therefore cleaner.</p>
      <p>Regards,<br>
      -Duncan</p>
