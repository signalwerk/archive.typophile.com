      <p>If one were to hand-hint it with TrueType outlines, you could make it work pretty well at small sizes, but it would be a crazy amount of work. With PostScript outlines... hmmm, not sure it's worth bothering with glyph-level hints, just setting global values and blue zones.</p>
      <p>Cheers,</p>
      <p>T</p>
