    html: |-
      <p>As noted, manual TrueType hints could aid legibility at smaller sizes, but at those sizes, there aren't enough pixels to show the distress. So your font would look like a well hinted Garamond font at smaller sizes where the hints do the most work. </p>
      <p>Please let me know if you have any questions about that.</p>
      <p>Jason C</p>
