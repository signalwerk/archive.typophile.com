    <p>Hi folks.</p>
    <p>Does anyone have any advice on hinting "distressed" glyphs? That is to say: the horizontal and vertical stems are inconsistent in width, and not necessarily horizontal or vertical.</p>
    <p>I have seen advice that one should hardly ever apply hints to a script font because hints can decrease the quality of these fonts and make them look worse - would that also apply to one that is "distressed"?</p>
    <p>Some inconsistency is actually desirable; I am trying to replicate the "slightly over-inked, decayed Caslon typeface on dampened paper" look common in revolutionary-era colonial America (mid- to late 1700's).</p>
    <p>To hint, or not to hint- That is the question.</p>
    <p>An example of the font in question follows, screen-captured from FontLab's metrics window. Below the posted image is a link to a higher resolution copy so you can get a closer look, if desired:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fonty_sm_6340.jpg"></div><p></p>
