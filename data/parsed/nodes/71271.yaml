      <p>BTW, remember that in FontLab Studio, the default preferences for both PostScript-based and TrueType-based fonts are "Autohint unhinted glyphs", so even if you don't do any hinting, FontLab Studio will autohint them when generating the fonts. You may want to disable those options. </p>
      <p>Also, I recommend having a look at my tutorial:<br>
      <a href="http://sites.twardoch.com/typography/font-tech/" title="http://sites.twardoch.com/typography/font-tech/">http://sites.twardoch.com/typography/font-tech/</a></p>
      <p>Best,<br>
      Adam</p>
