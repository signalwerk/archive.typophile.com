      <p>That would be Garamond Italic and small caps:<br>
      <a href="http://www.myfonts.com/fonts/linotype/adobe-garamond/" title="http://www.myfonts.com/fonts/linotype/adobe-garamond/">http://www.myfonts.com/fonts/linotype/adobe-garamond/</a></p>
