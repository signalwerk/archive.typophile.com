      <p>'Life During Wartime': probably hand-done as all repeating letters are different (3 /i and 3 /e); loosely similar: <a class="freelinking external" href="http://www.myfonts.com/fonts/mawns/brannboll-ny" rel="nofollow">Brannboll</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ahmet-altun/harman" rel="nofollow">Harman</a> Script, <a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/spumante" rel="nofollow">Spumante</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/rosarian" rel="nofollow">Rosarian</a></strong>, <a class="freelinking external" href="http://www.myfonts.com/fonts/resistenza/superb" rel="nofollow">Superb</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/eurotypo/lavinia" rel="nofollow">Lavinia</a>, <a class="freelinking external" href="http://creativemarket.com/lbolter/205051-LBPie" rel="nofollow">LBPie</a><br>
      'a film by Todd Solondz': again, hand-done (3 different /d); alternatives: <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/Learning-Curve-Pro" rel="nofollow">Learning Curve</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/school-script" rel="nofollow">School Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/propisi" rel="nofollow">Propisi</a><br>
      'DURING': reminds me a lot of <a class="freelinking external" href="http://www.myfonts.com/search/spire" rel="nofollow">Spire</a> with a reduced /R leg of course</p>
