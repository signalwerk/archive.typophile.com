    html: <p>A nice idea, but why is this bible page suffering from No-Hyphenation? Gutenberg got it right -- a narrow column justifies correct hyphenation.</p>
    html_clean: <p>A nice idea, but why is this bible page suffering from No-Hyphenation? Gutenberg got it right -- a narrow column justifies correct hyphenation.</p>
  - id: 504613
    user: 116628
    date: 2012-04-10T02:12:00
    date_raw: 10 Apr 2012 — 2:12am
    votes: null
    html: |-
      <p>I tried it with hyphenation first.  It would have been more efficient per line and required a larger type to end on the same word as Gutenberg's, and I didn't like it as much at that larger size.  If I had had access to the full text of it as-hyphenated, I probably would have tried harder to make that work, but as I said, I was actually quite surprised and disappointed to find out that one of the most famous books ever written doesn't have a text-only version anywhere I could find.  I can find the Vulgate generally, but not the Gutenberg text as-written and as-hyphenated.  Transcribing it myself wasn't an option, as my Latin isn't strong enough (understatement), nor my ability to parse some of the more peculiar features of 15th century blackletter, particularly abbreviations.</p>
      <p>I certainly wasn't trying to correct (or even improve!) on Gutenberg.  I merely wanted to turn it into a historically anachronistic version.</p>
      <p>I was more happy with the Vogue Paris cover, but it risks seeming political, which wasn't my intent.</p>
