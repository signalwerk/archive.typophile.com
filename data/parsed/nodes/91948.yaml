    html: |-
      <p>Hrant, that's explained in the full blog post.</p>
      <p>I must admit it's ... unsettling, perhaps ... to see iconic, or at least immediately recognizable, text in what "obviously" is the wrong font. Perhaps it's only "obviously wrong" because this does not concern <em>just</em> the font, but the image-as-a-whole.</p>
      <p>Imagine the Vogue cover, for example, not in full color but in black-and-white. (And also slightly different make up &amp; hair-do for the lady.) That will make it look like a period cover -- and we all know what period I mean as well. But instead we see it in a clearly <em>modern</em> context, with bar code and all.</p>
