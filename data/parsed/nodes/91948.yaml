    html: |-
      <p>Of course. All present-day versions of 1850s types are changed from their originals.<br>
      That’s why I put quote marks around my font attribution.<br>
      But within the context of all the other reworkings, the Darwin exercise is quite different, involving no anachronism in type style, only the means of reproduction.<br>
      The typeface of the reset Darwin title page would not have looked alien in 1859, other than by deviating from the convention that such types would not be used for title pages, only in ads such as <a href="http://pinterest.com/pin/49539664621259744/" rel="nofollow">this</a>.</p>
