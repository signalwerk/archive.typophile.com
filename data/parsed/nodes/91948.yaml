    <p>I was playing around with type and decided to take some historic documents and images outside their original context by <a class="freelinking external" href="http://www.unhelpful.org/2012/04/03/re-contextualizing-type-alternate-histories/ " rel="nofollow"> changing the typography</a>.  This was just something to amuse myself, so the images are not intended to be faux-forgery quality.</p>
    <p>I figured I'd post it here as someone here might actually enjoy it.</p>
    <p>A pair of thumbnails here, more on <a class="freelinking external" href="http://www.unhelpful.org/2012/04/03/re-contextualizing-type-alternate-histories/ " rel="nofollow"> the blog post itself</a>.</p>
