      <p>I experimented with a similar idea some years ago, except with the variation that each glyph was a half letter, not a connection between two letters, based on the reasoning that the form of letters varied less than the connections between them. Hence it would be possible to minimise the size of the glyph set because rather than needing an individual contextual glyph for each letter with each class of join on the left and each class of join on the right, you would only need half letters for each join class. So, for instance, lets say for a given letter there were 3 ways in which it could join on the left to a preceding letter and 4 ways it could join on the right to a following letter, plus one non-joining shape left and right, that would require 20 variant glyphs for a full letter approach, but only 9 for a half letter approach.</p>
      <p>Tom Milo goes one step further with this Arabic fonts, decomposing each letter into strokes and re-using stroke glyphs in a modular way to create multiple letters.</p>
