      <p><em> I wonder if something like this is even possible with opentype? </em></p>
      <p>Yes, it is quite possible.<br>
      It might be quite tricky to twist your head around.</p>
      <p>I think it might have some merit for conceptualizing extremely "organic" handrwiting, but not for traditional calligraphic styles which are already formalized in joining rules that translate well into the Contextual Alternates feature — after all, that is what the feature was invented for.</p>
      <p>I think you should give it a try, starting with a formalized chancery script, to get the gist of the process.</p>
