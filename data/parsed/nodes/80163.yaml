      <p>Edmund Fry tried that a couple hundred years ago, but it didn't catch on.<br>
      Not surprisingly, as it must have been almost impossible to compose with accurately or with any speed.</p>
      <p>It's redundant now, with the ability of the contextual features in OpenType to mimic the joining rules of traditional cursive calligraphy.</p>
      <p>In fact , that was the origin of the Contextual Alternates feature, in Robert Slimbach's Sanvito, in which Adobe automated the alternates which previously existed (but had to be annually applied), in conjunction with the development of OpenType support in InDesign.</p>
