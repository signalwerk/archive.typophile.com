    html: "<p>Blue Island create the visual impression of individual letters being made up of strokes connected from other letters, but it is made in a conventional way, with each letter being represented by an individual if eccentric glyph. It is a very clever piece of design work, but technically it isn't any different from a typical font. It is really the opposite of the idea expressed in this thread: precomposed glyphs that look decomposed in use, not decomposed glyphs that look precomposed in use.</p>"
