  html: |-
    <p>In connected script fonts, the transition between characters is often an issue:<br>
    <img src="http://updo.nl/file/ee197a29.png"><br>
    I got the idea to solve this by slicing every character in half, vertically, and connecting the second part of every character with the first part of every character, thus forming pairs for every transition:<br>
    <img src="http://updo.nl/file/212529b2.png"><br>
    This example now consists out of the pairs /_h/, /ha/, /al/, /lf/ and /f_/<br>
    This way, any two characters can be used subsequently without interrupting the flow.</p>
    <p>Using this method, a font would consist out of roughly 26*26=676 "characters" or pairs. This may seem a lot, but if we assume that every transition between any 2 letters is unique, fixing the issue on character-level would take way more different characters<br>
    (every letter has 26 (or 27 including blank space) possible predecessors and 26 possible successors, resulting in roughly 26^3=17576 characters).</p>
    <p>Of course, not every transition is unique in a connected script font and splitting a font up in pairs of characters instead of the actual characters may seem a bit superfluous in most cases, but it would also make for some interesting design possibilities.</p>
    <p>I would very much like to hear your opinion on this.</p>
    <p>(Also, first post. Hi!)</p>
