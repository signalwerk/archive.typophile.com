    votes: null
    html: '<p><i>Rian, first of all.: Welcome to Typophile, I may as well tell you that I am a fan of your work, then.. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></i> <br> <br>You may have already noticed, seen and read some of these.: <br><i>&gt; <a href="http://www.itcfonts.com/ulc/article.asp?sid=PULWCD7F6DG09H11WGKWEJFN07BN7G1C&amp;sec=ulc&amp;issue=articles&amp;art=excoffon" target="_blank">www.itcfonts.com/ulc/article.asp?sid=PULWCD7F6DG09H11WGKWEJFN07BN7G1C&amp;sec=ulc&amp;issue=articles&amp;art=excoffon</a> <br>&gt; <a href="http://www.myfonts.com/person/excoffon/roger/" target="_blank">www.myfonts.com/person/excoffon/roger/</a> <br>&gt; <a href="http://www.linotype.com/7-388-7/rogerexcoffon.html" target="_blank">www.linotype.com/7-388-7/rogerexcoffon.html</a></i> <br> <br><i>Sadly enough, it seems pretty hard to find decent information, details and / or listings of his work..</i></p>'
    html_clean: '<p><i>Rian, first of all.: Welcome to Typophile, I may as well tell you that I am a fan of your work, then.. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></i> <br> <br>You may have already noticed, seen and read some of these.: <br><i>&gt; <a href="http://www.itcfonts.com/ulc/article.asp?sid=PULWCD7F6DG09H11WGKWEJFN07BN7G1C&amp;sec=ulc&amp;issue=articles&amp;art=excoffon" target="_blank">www.itcfonts.com/ulc/article.asp?sid=PULWCD7F6DG09H11WGKWEJFN07BN7G1C&amp;sec=ulc&amp;issue=articles&amp;art=excoffon</a> <br>&gt; <a href="http://www.myfonts.com/person/excoffon/roger/" target="_blank">www.myfonts.com/person/excoffon/roger/</a> <br>&gt; <a href="http://www.linotype.com/7-388-7/rogerexcoffon.html" target="_blank">www.linotype.com/7-388-7/rogerexcoffon.html</a></i> <br> <br><i>Sadly enough, it seems pretty hard to find decent information, details and / or listings of his work..</i></p>'
