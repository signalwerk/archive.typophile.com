    votes: null
    html: "<p>Grant, Olive, ooooh please. <br> <br>Rian, some print stuff: <br>1) S Carter's \"20th Century Type Designers\" has a page of his fonts. <br>2) Issue #12-OldSeries of Herbert Spencer's Typographica has a killer article on Mistral, including highly varied initial sketches that contain many ideas for many unreleased fonts. <br> <br>And here's a thread you might enjoy: <br><a href=\"http://www.typophile.com/forums/messages/30/1405.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/1405.html</a> <br> <br>hhp</p>"
