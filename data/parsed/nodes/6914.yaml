    html: "<p>Hey Rian, nice to see you hanging about... <br> <br>I have a couple of Fonderie Olive specimen books with a bunch of Excoffon designs. I could probably scan a post portions of them if you'd like. <br> <br>In the meantime, there is also this partial visual index of Excoffon's work from the <a href=\"http://www.klingspor-museum.de/\">Klingspor Museum Offenbach</a>: <br> <br><a href=\"http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Excoffon/RExcoffon.pdf\" target=\"_blank\">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Excoffon/RExcoffon.pdf</a></p>"
    html_clean: "<p>Hey Rian, nice to see you hanging about... <br> <br>I have a couple of Fonderie Olive specimen books with a bunch of Excoffon designs. I could probably scan a post portions of them if you'd like. <br> <br>In the meantime, there is also this partial visual index of Excoffon's work from the <a href=\"http://www.klingspor-museum.de/\">Klingspor Museum Offenbach</a>: <br> <br><a href=\"http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Excoffon/RExcoffon.pdf\" target=\"_blank\">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Excoffon/RExcoffon.pdf</a></p>"
