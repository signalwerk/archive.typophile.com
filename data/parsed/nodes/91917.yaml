    html: <p>In a lot of places, particularly C/G/O/Q, you're getting heavy corners because you rounded the inside more than the outside. And, in general, from glyph to glyph it looks like you can't decide just how square or round the strokes are to be, and the differences do not look deliberate in the fullest sense of having a reason. I was reluctant to point out specific things, because that would be prompting tweaks on top of tweaks, which would only have you drifting further away from consistency and the big picture. The first design was drawn much better, presumably because you wanted it to look like that. If you want to make a basic Swiss grotesk (and if that's what you want to do, I won't discourage you from it quite as much as Hrant would, though it is self-evidently true that the world will not beat a path to your door for it), you need to start by drawing the strokes you want to see, not hammering them out of a different design, leaving artifacts of it here and there.</p>
