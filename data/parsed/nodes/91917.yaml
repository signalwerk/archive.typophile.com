      <p>I agree with Jasper. The good news is I think you're already leaning towards the necessary individuality: massive x-height. So I would try pushing that a little further, probably by shortening the descenders.</p>
      <p>Your caps are nicely proportioned; with a large x-height you can (and probably should) make them as high as the ascenders (where usually they should be shorter).</p>
      <p>There are many tweaks I would make, but the one that stands out the most is the "g": make the descender curve flatter, to match the overall style</p>
      <p>hhp</p>
