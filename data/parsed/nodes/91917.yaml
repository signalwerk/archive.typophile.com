      <p>So you've decided to make it <em>more</em> conventional? If this is intended as a learning experience, that makes sense; but it will be even harder to sell.</p>
      <p>In any case the PDF is revealing two important technical issues:<br>
      - It seems you've made the horizontals and verticals mathematically equal... which makes the former appear thicker!* This is a cornerstone "optical illusion" in type design. Look how out-of-whack the "L" and the "O" look.<br>
      - Your vertical proportions, your color and your spacing are each pointing at different point sizes. Do you know what kind of applications you'd like to address with this design? Your original chunky x-height made a direction easier to find - now it's less clear to me.</p>
      <p>* A cool quote from Fiona Ross's presentation in Yerevan in June: "If you want things to look the same you have to make them different."</p>
      <p>hhp</p>
