    html: |-
      <p>Line &amp; circle fonts are a dime a dozen, and are very 20th century. Squarish circle fonts (like your original was) aren't exactly rare these days, but at least they have a contemporary feel. Your initial design also enjoyed a bit of distinctiveness in its very large x-height. Even with those good attributes (which the new version has lost) such a design will need help getting noticed, possibly via a large number of weights, interesting OpenType features or tantalizing pricing.</p>
      <p>Your target range of 9 to 14 is too broad - and my view is that fonts that can work for text above 12 point need to have an unusually small x-height (which could actually be a distinctive feature). If you want to shoot for the bottom of that range the proportions are fine, but the color needs to be a bit darker and the spacing significantly looser. If you want to shoot for around 12 point I think your color is light but OK, but the spacing needs to be looser.</p>
      <p>hhp</p>
