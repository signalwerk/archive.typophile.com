      <p>hmm, thanks for the input y'all. I'm hoping you can help shed some light on some of your comments as I'm still trying to wrap my head around some things. </p>
      <p>- You both mentioned the lack of 'character' on the design. I'm assuming you're both reacting to the same thing? (Rounder corners on the O's vs. the more squared corners of previous rounds?) My reasoning was that I was afraid it would start looking too much like Eurostile –&nbsp;but it seems I took it way too far. What are your thoughts? </p>
      <p>-  hrant: you mentioned the vertical and horizontal stems being mathematically equal. They're actually different, but not by much. I will correct - thanks for pointing that out. </p>
      <p>- As far as what the application of this face will be, I'd like for it to be a text face –&nbsp;something that sets well between 9 — 14pts (which is why I went with the taller x-height and open counters). Could use any pointers on how to correct it to match that usage better. </p>
      <p>- cerulean: you mentioned the rounder curves not matching inside/outside. Could you be more specific? I'm not sure I understand the comment. </p>
      <p>Thanks y'all. </p>
      <p>dm</p>
