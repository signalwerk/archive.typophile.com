      <p>I love how you've used superellipses -- you've done a fine job with one of my favorite shapes. Your optical corrections are also great. The basic character is good; please push it further! Still, legibility is the most important thing, and you've got that.</p>
      <p>The B is an issue; I think both bowls are out a bit too far, but especially the top. As for the 3, it just doesn't fit. Maybe you could try a flat top, less of a complete curve, and/or a shorter midbar? Or maybe used a superellipsis with the 3 -- it really does look out of place with the letters -- but then you'd have to apply that to the other numerals (which might not be such a bad idea, since it'd make your face more distinctive).</p>
