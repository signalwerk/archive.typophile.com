    <p>Hello ,<br>
    i wanted to present my font called Afrobeat Font</p>
    <p><a href="http://www.resistenza.es/afrobeatfont/" title="http://www.resistenza.es/afrobeatfont/">http://www.resistenza.es/afrobeatfont/</a></p>
    <p>Inspiration</p>
    <p>The pounding tribal rhythms of Afrobeat music is expressed through this psychedelic brand new font, Afrobeat. Every letter becomes art as every letter is elegantly placed side by side, like music notes, creating music for the eyes. </p>
    <p>Afrobeat is a musical style performed by many African artists such as Fela Kuti, Femi Kuti, Antibalas and many more, which is a fusion of jazz,funk, and psychedelic rock, originating from the 60s and was based on the political movements of Nigeria.</p>
    <p>The Font</p>
    <p>This font is perfect for when you want to use eye-catching big texts for anything from posters and flyers for concerts, events, parties, to CD covers, advertisements, and art, but it´s especially striking for printed projects.</p>
