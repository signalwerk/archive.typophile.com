  html: |-
    <p>Hello typophiles,<br>
    I'm designing a brochure for a secondary school in town. I want to give them a fresher look as they want to slowly get away from an old conservative institution. It's a "business school" in the sense that preparing kids for the real world is their main goal.</p>
    <p>Do you have any font to suggest for a nice coupling with Optima Regular  (school's corporate font)? </p>
    <p>thanks</p>
