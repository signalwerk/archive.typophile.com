      <p>Hello Chris, your post didn't sound harsh at all.<br>
      Optima was really popular in the late 70 (probably because it was first published then). Thanks for the suggestions. I was actually going for Bliss. I'll post some design in a later stage so you'll see the results!</p>
      <p>Thanks again.</p>
      <p>tezzu</p>
