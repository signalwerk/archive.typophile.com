    html: <p>If they want to look more progressive they shouldn't use Optima. You could always keep it for their logo, but I wouldn't use it anywhere else.</p>
    html_clean: <p>If they want to look more progressive they shouldn't use Optima. You could always keep it for their logo, but I wouldn't use it anywhere else.</p>
  - id: 281162
    user: 1115
    date: 2008-05-29T19:41:00
    date_raw: 29 May 2008 — 7:41pm
    votes: null
    html: <p>I hope my post didn't sound too harsh. Optima, to my eyes, is not a current looking typeface. I was a teenager in the 80's and saw a lot of Optima. I don't know if anyone else feels the same way. I would try and steer them towards something more neutral, but still contemporary. There are a lot of typefaces out there that could work if they're open to something else. If they have to stick with it, I would look at a sans that works, and keep it to a minimum. Maybe Avenir, Gotham, Frutiger?</p>
