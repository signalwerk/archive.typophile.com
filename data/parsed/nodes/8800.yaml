    html: "<p>Speaking of 'Fleischmann on Punchcutting', you should definitely get hold of a copy of Fred Smeijer's <i>Counterpunch.</i> I can't remember how much of it is specific to Fleischmann, but it will give you a good insight into how the type was made. <br> <br>The <a href=\"http://www.preusstype.com/pdf/FMGot_Spec_eng.pdf\"><i>Fleischmann Gotische PT</i></a> from Preuss Type is worth taking a look at and has a decent biographical note. <br> <br>Regarding the ethical question, I consider scholarship fair use, but the legal question depends on where you reside. The 1908 edition is out of copyright, but you would need to be able to read French. The 1978 edition is still in copyright, so would be subject to whatever the law is regarding copyright in your jurisdiction (note, not the law in the country of origin). <br> <br>There is a practical issue, also, which is that the book is <i>huge</i>. I only have one or two books in my library that are larger. So it would be difficult to scan. But pages could be photographed by someone with a table-mount or a steady hand. I have taken macro-shots of all the Granjon Greeks in the book, and a few other pages. Here is a fascinating type, Van den Velde's English No.28: <br><img src=\"http://www.typophile.com/forums/messages/30/63744.jpg\" alt=\"Van den Velde English 28\"></p>"
    html_clean: "<p>Speaking of 'Fleischmann on Punchcutting', you should definitely get hold of a copy of Fred Smeijer's <i>Counterpunch.</i> I can't remember how much of it is specific to Fleischmann, but it will give you a good insight into how the type was made. <br> <br>The <a href=\"http://www.preusstype.com/pdf/FMGot_Spec_eng.pdf\"><i>Fleischmann Gotische PT</i></a> from Preuss Type is worth taking a look at and has a decent biographical note. <br> <br>Regarding the ethical question, I consider scholarship fair use, but the legal question depends on where you reside. The 1908 edition is out of copyright, but you would need to be able to read French. The 1978 edition is still in copyright, so would be subject to whatever the law is regarding copyright in your jurisdiction (note, not the law in the country of origin). <br> <br>There is a practical issue, also, which is that the book is <i>huge</i>. I only have one or two books in my library that are larger. So it would be difficult to scan. But pages could be photographed by someone with a table-mount or a steady hand. I have taken macro-shots of all the Granjon Greeks in the book, and a few other pages. Here is a fascinating type, Van den Velde's English No.28: <br><img src=\"http://www.typophile.com/forums/messages/30/63744.jpg\" alt=\"Van den Velde English 28\"></p>"
  - id: 57764
    user: 1250
    date: 2005-01-24T22:21:00
    date_raw: 24 Jan 2005 — 10:21pm
    votes: null
    html: "<p>In the past I have borrowed the 1978, making photocopies of some parts and 600dpi scans to compare against the 1908, which I have on what seems to be an indefinite loan from UCLA. And yes, these are bulky books - a lot of ginger propping required to get good scans and avoid damage. <br> <br>BTW, here's a collage I did about a year ago: <br>(175 Kb) <a href=\"http://www.themicrofoundry.com/other/Fman65.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Fman65.gif</a> <br>The \"Jan\" is Jan Middendorp. <br> <br>Speaking of cameras, I recently I bought a used Ricoh RDC-7, and it's quite amazing: it's \"only\" 3.3 megapixels, but it has a double-exposure \"Pro\" mode that offsets two shots by half a pixel and effectively gets double the resolution, although only in the horizontal dimension; that wouldn't be such a big deal of itself, except when you factor in the camera's ability to take macro shots at <i>one centimeter</i> distance! The net result is an effective resolution of over 2000 dpi. Now, the Pro mode does require a stable shot, but I've used a tripod with good results. The biggest drawback of a camera versus a scanner though is that only the very center of a macro photo is in total focus... unless I make some kind of precision concave backing plate that I could nestle pages on.  :-) <br> <br>Another cool feature the camera has is a 1-bit \"text\" mode that results in much smaller image sizes; although the result has no anti-aliasing, it makes it possible to photograph many pages and then run them through OCR with great results - sort of like a spy camera! <br> <br>hhp</p>"
