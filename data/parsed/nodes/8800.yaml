    html: "<p>Thanks for the information John. I will check out the library tomorrow.  I chose Dutch type making for this project specifically for the intricate and unique typefaces produced. I will update with more info as I continue searching. I would also appreciate more input/advice from others. <br> <br>EDIT: I am looking into the possibility of a typophile in my area with this book seeing as it is more than $500 US to get a used copy. Library has the worst selection of typography books I've ever seen. You'd think being a major research university, they'd have more. Any other ideas? <br> <br>Rob&lt;/font&gt;</p>"
