    html: "<p>Rob, sorry, I just saw your post #33 - for some reason I never got an email copy of it - and I rely on that mechanism heavily. <br> <br>1) I know somebody who might sell his 1978. What's a fair price to you? <br> <br>2) I wouldn't sell copies of my copies of the 1978. And even giving them away might be beyond the ethical threshold (even if it's Fair Use). <br> <br>3) I guess I can sell you copies or scans from the 1908. Like I said though it's UCLA's, so maybe I'd need to keep like 50% of the proceeds as a shipping &amp; handling fee or something and make the rest a donation to the UCLA library! :-) Or maybe 1/3rd each for me, UCLA and TEFF... Are you looking for specimen scans, or the text, or both? Because the 1908 text <i>is</i> in French. But hey, if you don't read French you could then pay me to translate as well. ;-) So how much dough are we talking about? FYI, the last time I checked, the street price for the 1908 was about $1200... <br> <br>BTW, if you need a dpi greater than 600 then I'd have to take the glorious old monster to a service bureau. <br> <br>hhp</p>"
