    html: "<p>I'm no expert, but John's recommendation is certainly very good. Compared to the 1908 edition, the 1978 edition has the advantage of being in English (unless you [also] read French), being updated (although I don't know if much was added concerning F'man), and being much more easily obtainable*. The 1908 edition however has the advantage of being [even] better printed - this is especially apparent in some smaller sizes and on pages containing both large and small fonts. If you hit a wall trying to find a copy of one or the other, let me know. <br> <br>* In fact I was under the impression that it was available <i>new</i> for around $250! <br> <br>Also of interest might be \"Fleischman on Punchcutting\", although: it's more of a \"trophy\" book; the type used seems damaged (look at the \"e\"). <br> <br>Influences: I've had trouble noticing any. F'man was a genius (and I never use that word lightly). To me Rosart is subordinate, and Bodoni was an artist, not in the same craftsman league. As for F'man's influence on later designs (like Caslon), my feeling is that only the superficial merits were taken, leaving the core untapped. <br> <br>BTW, there is a font among the ones that F'man cut that stands out as his pinnacle: the #65. The fabulous ideas in it have yet to be really understood. And as nice and useful as Dutch type is now, something has been lost from F'man. <br> <br>hhp</p>"
    html_clean: "<p>I'm no expert, but John's recommendation is certainly very good. Compared to the 1908 edition, the 1978 edition has the advantage of being in English (unless you [also] read French), being updated (although I don't know if much was added concerning F'man), and being much more easily obtainable*. The 1908 edition however has the advantage of being [even] better printed - this is especially apparent in some smaller sizes and on pages containing both large and small fonts. If you hit a wall trying to find a copy of one or the other, let me know. <br> <br>* In fact I was under the impression that it was available <i>new</i> for around $250! <br> <br>Also of interest might be \"Fleischman on Punchcutting\", although: it's more of a \"trophy\" book; the type used seems damaged (look at the \"e\"). <br> <br>Influences: I've had trouble noticing any. F'man was a genius (and I never use that word lightly). To me Rosart is subordinate, and Bodoni was an artist, not in the same craftsman league. As for F'man's influence on later designs (like Caslon), my feeling is that only the superficial merits were taken, leaving the core untapped. <br> <br>BTW, there is a font among the ones that F'man cut that stands out as his pinnacle: the #65. The fabulous ideas in it have yet to be really understood. And as nice and useful as Dutch type is now, something has been lost from F'man. <br> <br>hhp</p>"
