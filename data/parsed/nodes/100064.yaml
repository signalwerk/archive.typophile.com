      <p>Searching MyFonts for "circled numbers" gets you stuff like <a href="http://www.myfonts.com/fonts/jonathan-hughes/fyra/" rel="nofollow">Fyra.</a> But if you don't anticipate your lists being that long, there are more choices.<br>
      ① to ⑳ and ❶ to ⓴ are in encoded in Unicode. <a href="http://www.myfonts.com/search/char%3A%E2%91%A8/fonts/" rel="nofollow">Here's all the fonts on MyFonts that contain the character ⑨.</a> Some of them don't go up to ⑩ but you can see there is a lot to choose from.</p>
