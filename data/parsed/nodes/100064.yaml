    date_raw: 26 Jan 2013 — 3:01pm
    votes: null
    html: |-
      <p>Find Fonts, Advanced Search, available characters, contains, ...and paste in a character the font needs to have (from whatever source is most handy, like the character map application, unicode.org charts, Wikipedia... I'm working on a font family that has them, so I copied it out of the Metrics window in Fontlab).</p>
      <p>One way would be to click through to each specific font's page and select the tab that says Glyphs, which shows you the whole character set. But to make it much easier to compare them all, just copy from this: ①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳ and paste it into the sample text field at the top of the list, the place where it probably says "[Pangrams]".</p>
