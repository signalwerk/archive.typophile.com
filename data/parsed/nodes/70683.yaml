    <p>Noob here;  please have mercy...</p>
    <p>Question: what contemporary text typeface might work well with the following fonts for use in an architect's studio?<br>
         • Eurostile Candy Pro Regular + Bold<br>
         • FP Head Pro Light + Book<br>
         • Neuropol X Light + Regular<br>
         • Yumi Light + Normal</p>
    <p>Perhaps Droid Sans or Myriad Pro?<br>
    Any thoughts?<br>
    Thanks!</p>
