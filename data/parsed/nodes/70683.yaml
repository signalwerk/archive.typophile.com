      <p>Typophile community: mad respect for the aesthetic and intellectual response thus far!</p>
      <p>riccard0: may I re-phrase my question, what typeface might suggest the future as imagined at the beginning of the twenty first century?</p>
      <p>Queneau:  We have used Neutra font from House Industries for cast dimensional numerals as indicated below.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/12neutra_4654.jpg"></div><p></p>
      <p>Love Neutra's work and the numerals can be gorgeous but the typeface strikes us as dated.  Agreed some humanist aspect helps keep the sans from frigidity and thus your other selections for consideration.</p>
      <p>Andreas Stötzner: yes, yes and yes! Can it somehow be more superelliptical?</p>
      <p>frode frank: Apex New and Apex Sans very nice also!</p>
      <p>malcolm: we agree!  To that end we've decided to budget for font design services; unfortunately the dollar value will not be very great, but perhaps the 'customization' will be minimal.  Any clue regarding the least we can spend?  Looking forward to working with someone from this community!</p>
      <p>Question for your consideration: does Univers appear dated?  Can it be used for text?  We have used it successfully for etched lettering.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/17univers_6739.jpg"></div><p></p>
      <p>As an aside, the marketing team and their consultants (at the global firm where I served as architect) spent many months re-selecting their new text typeface, Verdana.</p>
