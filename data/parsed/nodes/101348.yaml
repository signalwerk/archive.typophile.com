    html: |-
      <p>Another possible approach just occurred to me. I haven’t thought through all the possible ramifications.</p>
      <p>You could probably deploy a certain amount of hanging punctuation using a series of space-punctuation / punctuation-space contextual substitutions, combined with backstopped kerning pairs.</p>
      <pre>    sub space @punct' by @punct_hang_left;
          sub @punct' space by @punct_hang_right; </pre><p>
      You’d need relevant sets of <em>.calt_hanglft</em> and <em>.calt_hangrt</em> alternates with sidebearings adjusted accordingly. And you’d want to put in positive kerning pairs between space and these alternates to restore “normal” spacing, since they’ll be substituted throughout the text. But then, when they occur at the beginning or end of a line, the kerning won’t be relevant and the adjusted sidebearings will create the hanging effect.</p>
      <p>However, it might not be possible to account for hyphens in automatic hyphenation. You’d have to test applications to see whether or not they respect a separately encoded u+00AD soft hyphen in a font, along with any subsequent gsub (which would just be a single subst in this case, not a contextual subst).</p>
      <p>And this approach won’t work on any punctuation at the beginning of a paragraph — opening quote, as a primary example — since there’s no preceding space, obviously.</p>
      <p>It would take some tinkering to cover all eventualities. But there might be potential in this approach.</p>
