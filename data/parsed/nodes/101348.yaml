    html: |-
      <p>David — </p>
      <blockquote><p>And does OT layout see &lt; space-CR-" &gt; the same as &lt; space-" &gt; ?</p></blockquote>
      <p>No, I’m pretty certain that a hard return is a boundary for both OT backtrack and lookahead input sequences. Now that I think about it, it’s probable that any line end, soft or hard, bounds both the backtrack and lookahead also. And layout engines generally treat the intermediate space as belonging to the previous line, which is how this would work for end-of-line. </p>
      <p>But, like I said, I didn’t test this overall approach. You’re right, it might not work at all with beginning-of-line.</p>
      <blockquote><p>...but it would if one made a composite of each Uppercase letter with a hanging “, and sub for each “-Cap typed, for a Cap with a hanging “ attached... maybe?</p></blockquote>
      <p>Interesting. Yeah, that would probably work. But you’d have to go through the trouble of composing all those <em>quotedblleft_capital.hanging</em> “logotypes” and then kern the space to them all. Could be scripted, I reckon.</p>
      <p>I’d probably approach beginning-of-line with the <em>ignore sub</em> approach I mentioned before. It’s pretty reliable for this situation.</p>
