  html: |-
    <p>In the course of developing a revival of Mergenthaler Linotype's <a class="freelinking external" href="http://typophile.com/node/100527" rel="nofollow">Benedictine</a> (1915-1922), I am considering the possibility of including hanging punctuation marks (quotes, periods, colons, hyphens and the like) in the OpenType implementation. I was thinking of using contextual alternates to substitute punctuation marks at the begining/ending of lines with the corresponding hanging (null-width) marks. However, I haven't been able to figure out how to detect within the "calt" feature a begin/end of line event. Is this possible? Or, more generally, is there any way of implementing mechanically this type of substitutions?</p>
    <p>Thanks in advance for your advice.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/hanging_5718.png"></div><p></p>
  html_clean: |-
    <p>In the course of developing a revival of Mergenthaler Linotype's <a class="freelinking external link-kept" href="/node/100527/" rel="nofollow">Benedictine</a> (1915-1922), I am considering the possibility of including hanging punctuation marks (quotes, periods, colons, hyphens and the like) in the OpenType implementation. I was thinking of using contextual alternates to substitute punctuation marks at the begining/ending of lines with the corresponding hanging (null-width) marks. However, I haven't been able to figure out how to detect within the "calt" feature a begin/end of line event. Is this possible? Or, more generally, is there any way of implementing mechanically this type of substitutions?</p>
    <p>Thanks in advance for your advice.<br>
    </p><div class="imageWrap"><img src="/files/hanging_5718.png"></div><p></p>
