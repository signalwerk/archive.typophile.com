      <p>Kent: <em>It’s also possible to get something like this to happen with GSUB Type 5 contextual substitutions – relying on some careful ignore sub statements — but it’s a bit of a hack and can become cumbersome.</em></p>
      <p>It also has the unintended consequence of messing up in-line spacing of contextually triggered line-initial or -terminal substitutions or spacing adjustments at glyph run boundaries. Remember, OpenType Layout is applied to glyph runs, and these can be terminated by many things other than beginning and end of line: change of font (including weight or style change within the same family), change of point size, change of direction in bidi text, and even change of text colour in some software.</p>
