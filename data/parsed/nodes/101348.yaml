    html: |-
      <p>Although the inherently technical jargon of the discussion probably obscures the fact, hanging punctuation is something that is ostensibly possible with the Optical Bounds features — {opbd} {lfbd} {rtbd} — discussed recently here: <a href="http://typophile.com/node/100183" title="http://typophile.com/node/100183">http://typophile.com/node/100183</a></p>
      <p>But these features are not implemented in any common software that I know of.</p>
      <p>It’s also possible to get something like this to happen with GSUB Type 5 contextual substitutions – relying on some careful <em>ignore sub</em> statements — but it’s a bit of a hack and can become cumbersome. And I think it will only deploy reliably with beginning-of-line cases, not end-of-line. If you put this in {calt} however, then it will be on by default; it’s best not to put discretionary features in {calt}.</p>
    html_clean: |-
      <p>Although the inherently technical jargon of the discussion probably obscures the fact, hanging punctuation is something that is ostensibly possible with the Optical Bounds features — {opbd} {lfbd} {rtbd} — discussed recently here: <a href="/node/100183/" title="http://typophile.com/node/100183" class="link-kept">http://typophile.com/node/100183</a></p>
