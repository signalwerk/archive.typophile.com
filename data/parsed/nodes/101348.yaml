    html: |-
      <p>Yes, TeX gives the most flexibility, most control. Back when Richard Eckersley was alive, he flirted off &amp; on with using hanging punctuation. Richard was enamored with the constant text page, preferring to card rather than run long or short pages. While he'd never presume to tell a compositor how to set type, he even preferred to card over ending a page with an orphan, or either ending or beginning a page with less than a full line of type (including paragraph indents).</p>
      <p>We tried all manner of hanging punctuation -- left side only (only quote marks), and both left &amp; right sides. We kept running into tricky constructions on the right, How about period-closequote (now quotedblright)? Hang both? How about quoteright followed by quotedblright? And when that's preceded by a period? Always hang hyphens? How about en-dashes. Etc.</p>
      <p>Ultimately, Richard gave up on the notion, Nice in theory, often too awkward in practice.</p>
      <p>While Richard's fame was probably for <cite>The Telephone Book,</cite> he was the consummate designer; in a restrained way (usually), he considered every detail. Before pretty much abandoning hanging punctuation, we worked with it a number of years, and with varying kinds of texts.</p>
      <p>Here's a link to a web site built by his son, Sam.</p>
      <p><a href="http://www.richardeckersley.net/" title="http://www.richardeckersley.net/">http://www.richardeckersley.net/</a></p>
      <p>(With Sam making a strong showing in the field, there are now three generations of Eckersley graphic designers...)</p>
