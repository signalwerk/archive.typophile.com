    <p>Hi fellas<br>
    I'm looking for a book (or site) which shows the differences in fonts of different vendors. For example: an Adobe Caslon is maybe more true to the original than an ITC Caslon but the ITC has maybe a better legibility in smaller grades due to an increased x-height and a Berthold Caslon blablabla....</p>
    <p>Does something like this exist or do i have to invent it? ;-)</p>
    <p>Cheers and thanx for help!</p>
    <p>Roland</p>
