    html: |-
      <p>With limited knowledge of your market and its competitors I can only speak to the packages presented and my knowledge of the NZ coffee market. #1 seems to work best of the four options due to its simplicity and restraint. The limited colour palate assists with the idea that the name portraits (platinum) by allowing so much use of this silver packaging base layer. Move the bean cluster up slightly so that it does not cramp the blend bar so much. The brand mark needs more dominance, the 100% logo needs less. </p>
      <p>The burgundy bar and yellow screen of #2 seems to restrict the map too much and fails to let it breathe and use the space like it does in #1. </p>
      <p>#4 is far too cluttered and this complex grid offers little to the idea of sophistication or high end. </p>
      <p>#3 has potential but lacks some of the sophistication and clean lines of #1.</p>
      <p>Best.<br>
      -nic</p>
