      <p>Number 1 is really nice, the bean cluster really disrupts the background image though, I'd consider moving it or removing it all together. Also the logo seems too cramped vertically, let it breathe a bit and add increase the height of the black box. I'm not sure what the top insignia is; but one thing to consider is that once the package is open and the customer rolls it down that will most likely be lost in the fold; so if it's important even moving it down 1/2 an inch might be worth it.</p>
      <p>I can see where the color for the map in #2 came from and I like it as well. Again the logo should have a bit more room and the 100% is tight to the bottom, I'd move it up a tad. </p>
      <p>Cheers!</p>
