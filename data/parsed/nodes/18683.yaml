    html: <p>My problem with these designs aren't with the look as much as how they will stack up against other Gourmet Coffees. Did you get competing brands and see what they were doing? Did you do shelf space testing? Will your brand jump out to consumers or will it fade into the background when its in a commercial enviroment? I will suggest the name is to subtitle and needs to be bumped up (size) and you might want to make some of the important information with more contrast. My suggestions have nothing to do with design but with sales.</p>
