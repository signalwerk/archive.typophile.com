      <p>Thanks to all.  The feedback is greatly appreciated.  </p>
      <p>Dan, in the beginning the coffee will be sold locally and there is no packaging like this on the Island.  No tests have been done at the international level, however due to the fact that Puerto Rico has to import coffee to supply the local demand, international retail sales are not the main objective.  </p>
      <p>Chris, I found two online retailers <a href="http://www.demiislita.com/cafe_us.html" title="http://www.demiislita.com/cafe_us.html">http://www.demiislita.com/cafe_us.html</a> and <a href="http://www.ebay.com" title="http://www.ebay.com">http://www.ebay.com</a>... look for Encantos.  </p>
      <p>Thanks again.</p>
      <p>Edgardo</p>
