  html: |-
    <p>Hi all</p>
    <p>I'm trying to install Robofab</p>
    <p>I have downloaded Robofab from git and followed the instructions here - <a href="http://robodocs.readthedocs.io/roboFabDocs/source/intro/install.html">http://robodocs.readthedocs.io/roboFabDocs/source/intro/install.html</a></p>
    <p>When I try to run the install.py script I get this.</p>
    <p>Installing RoboFab: about to write a path to '/Applications/robofab/Lib' in '/Library/Python/2.7/site-packages/robofab.pth'...<br>
    Traceback (most recent call last):<br>
      File "/Applications/robofab/install.py", line 25, in<br>
        p = install(dir, "robofab")<br>
      File "/Applications/robofab/install.py", line 18, in install<br>
        f = open(fileName, 'w')<br>
    IOError: [Errno 13] Permission denied: '/Library/Python/2.7/site-packages/robofab.pth'</p>
