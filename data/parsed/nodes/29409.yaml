    <p>So I’ve been looking for what seems like forever for a typeface that I’ve not been able to turn up as yet.  I’d love to find the font used on the Sokol Blosser winery’s Evolution No. 9.</p>
    <p>Here’s a link to a pic:</p>
    <p><a href="http://sokolblosser.com/images/image_library/Evolution-bottle_349.jpg" title="http://sokolblosser.com/images/image_library/Evolution-bottle_349.jpg">http://sokolblosser.com/images/image_library/Evolution-bottle_349.jpg</a></p>
    <p>I’d apparently make a reasonably lousy private (or public, for that matter) detective as repeated attempts at locating this rogue typeface have turned up snake eyes.  Welcome any guidance any of you may have.  Thanks!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/29408" class="topic-previous" title="Go to previous forum topic">‹ whose eyes!!!</a> <a href="/node/19895" class="topic-next" title="Go to next forum topic">greek old style !! ›</a></div>
