    <p>I've been trying to ID a font used on a typewriter in the early 1960s. I've search the net and find some that are close but not exact. This was a very popular font used in auto and marine sales documents!! I'm sure someone has seen it!! Please take a look.</p>
    <p>Thanks,</p>
    <p>Rob</p>
