    html: "<p>The mention of Adidas (is the name itself really supposed to be lc, like e.e. cummings?) reminds me: around the same time, I collected a bunch of all-lc logos and made a handout showing that lots of companies have that kind of logotype, but that names (i.e. proper nouns) are always written with initial caps and internal lc. If it would be useful, I'll see if I can dig it up. <br> <br>Re: small caps -- I don't know what kind of company Nathan's client is, but it's pretty doubtful that they'd be able to use small caps company-wide in all applications (that is, people writing or typing the company name, as opposed to printing the logo).</p>"
    html_clean: "<p>The mention of Adidas (is the name itself really supposed to be lc, like e.e. cummings?) reminds me: around the same time, I collected a bunch of all-lc logos and made a handout showing that lots of companies have that kind of logotype, but that names (i.e. proper nouns) are always written with initial caps and internal lc. If it would be useful, I'll see if I can dig it up. <br> <br>Re: small caps -- I don't know what kind of company Nathan's client is, but it's pretty doubtful that they'd be able to use small caps company-wide in all applications (that is, people writing or typing the company name, as opposed to printing the logo).</p>"
