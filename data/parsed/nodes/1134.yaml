    html: <p>This is actually one rare place where a unicase design (assuming we're really talking about a logo and not orthography) might work great. It would satisfy some of the "UC envy", but also force a clean break with the idea that the capitalization has to be the same in text (since a unicase would make that effectively impossible). <br> <br>As for the lower readability of all-caps, there is empirical evidence all over the place, but it doesn't apply to a single word you have all the time in the world to read. <br> <br>hhp <br></p>
