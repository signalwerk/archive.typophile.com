    html: <p>Yep, small caps would pose a logistical problem.  And would likely not be adapted company wide. <br> <br>I'm also not sure if visually I agree with any caps at all -- except in the logo. <br> <br>I like the readability point -- any hard data I can point to for that? <br> <br>Another thing to consider is the headlines used in corporate literature.  They use an endorsed brand architecture similar to that of redhat or adobe (ie. Adobe Illustrator, Adobe Photoshop, etc.) <br> <br>What you'll notice is the corporate signature is not integrated into the actual headline, but is used to sign the page.  The headline is arranged with secondary type only so the corporate name is displayed with secondary type consistent with the product name. <br> <br>Sometimes these branding architectures for headlines use a cascading model where you would also see a tagline. <br> <br>So my problem is also in developing a consistent look that communicates things correctly.  Having the company name as caps (i.e. UNICON Product) takes the focus away from the product.  Which is not consistent with the brand architecture strategy they're going with. <br> <br>Any thoughts on this? <br> <br> <br></p>
