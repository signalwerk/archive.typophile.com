    html: <p>Not sure how you're separating a branding issue from a visual design one. <br> <br>My view is that it's all visual communications (and more when considering branding / brand strategy).  Since there are both implicit and explicit messages to any visual communication program, having technical issues with the visual design can imply negative messages about the company. <br> <br>My view, based on my connection with the company vision, is that it's more a crutch than anything else.  They want it to stand out.  But it doesn't integrate elegantly into the overall design system.  But, when dealing with folks on the business side of the fence, it's not always easy to make a case for elegant design.  So I was wondering if anyone has come across this issue and what if any tactics they used to deal with it. <br> <br>Thanks, <br>Nathan</p>
