  html: <p>I have a client who's logo is rendered in all caps.  That in itself is fine, but they also demand for the name be written in all caps all the time.  So in body text when referring to the company name it has to be written as UNICON rather than Unicon. <br> <br>Visually it's not very functional.  Seems too aggressive and undermines the strength of the overall visual identity system that I'm developing. <br> <br>Does anyone have any thoughts on this issue?  Have you ever dealt with this type of thing?  What are some strong arguments to made for losing it? <br> <br>Nathan</p>
