    html: <p>Dunno how receptive they are to plain logic, but it's a simple and accepted rule of usage that proper nouns are written with initial caps, not all caps. When a company name appears in all caps, one assumes it's an acronym, and will then wonder what the initials stand for. <br> <br>Writing in all caps is like adding extra exclamation points. It doesn't say "this is extra important" -- it says "we know <i> you</i> don't think this is as important as <i> we</i> think it is."</p>
