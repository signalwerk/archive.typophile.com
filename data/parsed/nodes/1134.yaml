    html: <p>I refused to use logo's in my clients work. Never. Well I never say never. The back of a business card, white ink, six point, maybe.  <br> <br>But what is wrong with using all uppercase? That is why there is typefaces called "title". Stanley Morison wrote that you should never use all uppercase italic. Certainly never swash within words. Only the first or last characters of a word. <br> <br>Hogwash. <br> <br>Bruce Rogers used them all with great gusto. The beauty of wrongness, isn't it a wonderful thing? <br> <br>Stanley Morison on the other hand could never make anything look charming or beautiful. Simply it never happened for him. Too much time preaching.  <br> <br>I noticed everyone likes Eric Gill. His justification idea, it sucks big time! That was really stupid!!!  <br> <br>Is anybody Catholic? I think Gill should have spent less time playing with his puppy dog.  <br> <br>Gerald Giampa <br>P.S. I would not be inclined "TOO OFTEN" to use uppercase within text. But I never say never. <br></p>
