    html: "<p>The logotype is a graphic, not text. That's the bottom line.  <br> <br>I had this problem years ago, working for an organization that was changing its name &amp; identity. The new logotype was all-lowercase. Everyone thought they had to write the org's name that way. I'm not sure why it was so hard to get them to understand the difference between the graphical treatment and the name itself, but it took a long time to get it to sink in. I stressed the difference between the logotype, which is a graphic (like a picture, I said), and the name itself. I pointed out Boeing's logotype, which is in all caps: when you refer to Boeing do you write BOEING? I even resorted to using the Coca-Cola logotype: If you refer to Coca-Cola, do you type it in red curly script? I think that last one finally helped. <br></p>"
    html_clean: "<p>The logotype is a graphic, not text. That's the bottom line.  <br> <br>I had this problem years ago, working for an organization that was changing its name &amp; identity. The new logotype was all-lowercase. Everyone thought they had to write the org's name that way. I'm not sure why it was so hard to get them to understand the difference between the graphical treatment and the name itself, but it took a long time to get it to sink in. I stressed the difference between the logotype, which is a graphic (like a picture, I said), and the name itself. I pointed out Boeing's logotype, which is in all caps: when you refer to Boeing do you write BOEING? I even resorted to using the Coca-Cola logotype: If you refer to Coca-Cola, do you type it in red curly script? I think that last one finally helped. <br></p>"
