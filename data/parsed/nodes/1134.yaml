    html: <p>This confusion between the concepts of "name" and "logotype" seems common. I've even had clients who always tried writing their name in their logo font and colour (a la the Coca-Cola example), or even sticking their logo into bodies of text in place of a name! I keep reading, in magazines, designers who say that clients are "getting smarter". I don't think so. <br> <br>Part of the problem may be that logo/identity designers aren't providing logo <i>and</i> editorial guidelines for new company names and identities. Editorial guidelines will say what the company's name actually is, and how it is to be spelled. <br> <br>Remind your client that a logo is a <i>symbol</i>, not a word, even if it has letters in it. <br> <br>Paul</p>
    html_clean: <p>This confusion between the concepts of "name" and "logotype" seems common. I've even had clients who always tried writing their name in their logo font and colour (a la the Coca-Cola example), or even sticking their logo into bodies of text in place of a name! I keep reading, in magazines, designers who say that clients are "getting smarter". I don't think so. <br> <br>Part of the problem may be that logo/identity designers aren't providing logo <i>and</i> editorial guidelines for new company names and identities. Editorial guidelines will say what the company's name actually is, and how it is to be spelled. <br> <br>Remind your client that a logo is a <i>symbol</i>, not a word, even if it has letters in it. <br> <br>Paul</p>
