    <p>Ive been really inspired by vintage style boxing posters. </p>
    <p>ive been using the Knockout, Trade Gothic, Univers  for a while and am looking for other ideas:<br>
    tall, condensed, clean typefaces.</p>
    <p>also... think credits listed at the bottom of old movie posters (tall, condensed)</p>
    <p>any ideas / inspiration?<br>
    thanks</p>
