    <p>Hallo everybody!<br>
    I've just released Josefin Sans and Slab under SIL license, <a href="http://is.gd/hjDmw" title="http://is.gd/hjDmw">http://is.gd/hjDmw</a> &amp; <a href="http://is.gd/hjcKV" title="http://is.gd/hjcKV">http://is.gd/hjcKV</a> on Google Font Directory.</p>
    <p>I know it's not perfect but I hope you like them, thank you for your comments here :-) , on the next days I'll update my site and play with them.</p>
    <p>cheers!</p>
