    <p>I am finally working on a project that justifies and needs dynamic custom font rendering on an HTML page. I am aware of CUfont (which is perhaps what Typophile is using for its headers?) and Typekit and remember from a post about a year or two ago that Google has an offering as well.</p>
    <p>Can anyone provide some links to some nice sample sites that are using these or other custom web font technologies? Also interested in perceived pros and cons between the different options from a technical, as well as cost perpective.</p>
    <p>PS - I must suck at using the search function here at Typophile because I have seen threads discussing this stuff before but could not surface anything using the search tool today.</p>
