    html: |-
      <p>Dynamic fonts (no Flash) is certainly the best option. Typekit is fine, but you make sure you pick something that also renders well under the worst conditions: Win XP. Many resellers have browser samples. </p>
      <p>For good text type, a place to start is the masterful Webtype. There’s also Fontfont, Typotheque’s Fedra Screen, Ascender fonts and Adobe, along with <a class="freelinking external" href="http://typedia.com/blog/post/cure-for-the-common-webfont-part-2-alternatives-to-georgia/" rel="nofollow">this list</a> and <a class="freelinking external" href="http://typedia.com/blog/post/cure-for-the-common-webfont-part-1-alternatives-to-arial-and-helvetica/" rel="nofollow">this</a>.</p>
      <p>For display, the market is bigger, as the type designer doesn’t need to make such a huge effort to render the fonts acceptable at larger sizes.</p>
