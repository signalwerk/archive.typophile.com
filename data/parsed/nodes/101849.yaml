      <p>Another factor that Hrant doesn’t mention is the ability to pack lines tighter. This is relevant in newspaper/magazine design because a multi-column text will have shorter lines and thus need less space between the lines* than, say, a book. Also, counter to what Hrant says, in large sizes (well above text size) the same requirement comes into play in, for example, a headline. This ties in with headline faces commonly being spaced tighter horizontally than text faces: they are also “spaced” tighter vertically, using the x-height and descender depth as the main variables.</p>
      <p>* I’d love for someone else to explain this in depth, but in general:<br>
      1: At a certain distance (and this distance is closely intertwined with the length of the lines and whitespace around the text) lines begin to form a visual “mass” instead of just separate lines.<br>
      2: In a book, with longer measure, it’s hard to find the next line if the lines don’t have enough space between them.</p>
