      <p>Hi Sevag! You can tell a question is good when it's hard to answer...  :-)</p>
      <p>I don't think "if it looks good, it's good" always works. If it did, text fonts would have descenders longer than ascenders (because some of the former need more room to look nice) but the opposite is true... Things beyond looks matter when you're making a text font. Some things to keep in mind:<br>
      - More important than the relationship of the x-height to the Em is the relationships between the x-height, ascender height, descender depth, cap height and numeral height(s). The x-height is the main player (at least in the Latin alphabet, but for example not in the Georgian) but it can't ignore the rest.<br>
      - In a text font an x-height is usually around 60-65% of the ascender height, but it can go over or under that for specific uses: under, for let's say a large book set in a relatively large point size; over (by a good deal) if it's for a newspaper. The reason for this is that the requirements for reading shift a bit, depending mostly on size, but also other factors: in "choppy" reading like in a newspaper seeing individual letters clearly is more important, whereas when reading an immersive book in comfort the ascenders and descenders matter more (because they help define boumas).<br>
      - Cap height is typically a little under ascender height, and descender depth is less than ascender height (sometimes by a good amount - check out Berling). Numerals can have a variety of schemes...<br>
      - The big one... The vertical proportions are tied in to two other major parameters: the color (darkness) of the font, and the overall spacing. This is because each one of those three things points to a certain ideal point size range, and they have to be pointing at the same range. Smaller sizes require darker color, a bigger x-height and looser spacing; larger sizes, the opposite. It's hard to get a feel for what's a good balance, but it helps a lot to look at existing fonts by masters like Carter. Remember though that there's no precise formula, and personal taste can shift things quite a bit, especially when it comes to color.</p>
      <p>I hope that helps.</p>
      <p>hhp</p>
