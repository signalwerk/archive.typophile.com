      <p>Good points - there's certainly a lot more in here... For example that the overall width of a font also plays into what vertical proportions work well; and how the frequency of linebreaks (which is very high in newspapers) affects what role width ends up playing in economy...</p>
      <p>Also, even in a book "packing lines tighter" matters, because it's not just a matter of collision. For example when the descenders (which are linguistically infrequent) are too long you're wasting vertical space that could be used to amplify readability in other regions (mostly the x-height, but secondarily the ascenders). I use the term "apparent leading", which is what I think determines ease of "line return" when reading.</p>
      <p>One thing you wrote that I'm not getting is that #1. Is that an aesthetic issue?</p>
      <p>hhp</p>
