  html: <p>Hello. I'm working on my first serious text face and currently the x-height is set to 410 units which happened automatically upon drawing the first character. I'm a newbie and know very little about the technical aspects of typeface design. Apart from readability, what are the other aspects which will influence when deciding the x-height; how does a designer determine the appropriate x-height.  Thank you.</p>
