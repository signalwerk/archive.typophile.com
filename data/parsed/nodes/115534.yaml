      <p>Don't know the original name but I guess you could easily replace it using one of the following: Suitcase <a class="freelinking external" href="http://www.myfonts.com/fonts/suitcase/vafle" rel="nofollow">Vafle</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/suitcase/purista" rel="nofollow">Purista</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/inventory" rel="nofollow">Inventory JNL</a><br>
