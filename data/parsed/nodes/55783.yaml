      <p><em>"The ability to work with interior and exterior contours independently has pretty much always been there."</em></p>
      <p>Oh, good point. I guess that leaves us with the question why something like Legato wasn't already conceived of in metal, or any other one of those "older" medial contexts. Or are there any pre-digital typefaces that attempt something like Legato?</p>
      <p>To remain on the level of tools/media for a second, I'd at least suggest it's easier to do this in vectors, and more flexible – as in, less laborious to quickly try out many variants and new ideas, and to play with the shapes; so that, while the digital medium isn't the only one to allow for such treatments, it may well be more conducive to them.</p>
      <p>On the level of the broader cultural context, my theory* is that for something like Legato to emerge, PoMo craziness had to happen,** and pass, to allow for the new medium to truly start searching for its own and inherently new "visual vocabulary" – which will be independent from the established one to a degree, but not so narcissistic as to be anti-usability. Which FWIW is a classic feature of medial paradigm shifts.</p>
      <p>* Which is always in a state of (re-)construction, and doesn't claim to be "right".</p>
      <p>** Which of course, in turn, goes back to the availability, and flexibility, of digital tools; so I guess that goes to show how intrinsically connected visual shapes are both to the tools/media they're shaped by, and to their overall cultural context.</p>
