      <p>Kent, can I have that pdf too? I give you my e.mail.</p>
      <p>From a geometrical point of view I think the operation on the contour of the 'o' is not rotation but skewing (I think it is what Nick Shinn wrote). In that way the upper right and lower left regions of the letter are thickened.<br>
      The trick with black/white is, I think, that you have two opposite movements: the black is leaning forward while the inner white is slightly leaning backward. Maybe this “counter-movements” makes the letter appear upright while it is slanted, I don‘t know. But the effect is a diagonal stress forward (maybe the interconnection wanted by Bloemsma) without being an ‘italic’. I suppose that stress (that is the opposite of the red dashed line in the image above) is responsible for the “calligraphic ductus” seen by non type obsessed persons (a more natural 'flow')</p>
      <p>Looking at the t that Nina posted, I see the same stress (look at the bottom-left part) obtained in the same way: the outer contour is pulled along a diagonal, while the inner contour remains straight.</p>
      <p>What I find interesting is that the conceptualization Bloemsma did is actually based on the interaction of surfaces (black area against white area), that is a conceptualization not done in terms of lines (the so-called anti-chirographic point of view). Obviously you can re-tell the whole story in terms of marking tools and strokes.</p>
      <p>For the discussion on the tools. I think that vector drawing softwares, so based on the metaphor of drawing board, with splines etc., are actually a conceptual obstacle for thinking in terms of surfaces: you are forced to manipulate dematerialized ‘curves’ (that is good mathematically, instead.)</p>
