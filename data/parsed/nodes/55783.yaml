      <p>As a side note (but maybe not really), the Icone comparison is quite interesting, also with respect to the relations between design and media. In the monograph (Adrian Frutiger: Typefaces. The complete works), Frutiger explains how the design of Icone (1978, published 1980) was a direct response to the new digital medium, although in terms of striving to offset its negative effects (digital distortion): "Instead of 'lines' that could easily be defined geometrically, [Icone] is characterized by a rather 'wild' stroke design. Curves and asymmetrically flaring terminals are among its key characteristics. There are no traditional serifs, which would hinder slanting." (My translation, I have the German edition.)</p>
      <p>Icone on the left, Legato on the right:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/icone-legato-t_4952.gif"></div><br>
      Now while there seems to be a bit of similarity between these glyphs, to me they also show the notable difference in the thinking behind their designs: Icone's "t" is "flowing" throughout, and harmoniously. Both sides of the stem are curved, and stretching the imagination a bit, the glyph could still be seen as "painted" - and it was not Frutiger's intention to depart from the chirographic model, he just "gummied" the contours (in fact calling Icone "gummy type") to make it less vulnerable to distortion. In Legato, the "t" has a lot more tension between the contours, a much more strongly differentiated "pull" of the curves - which underpins the notion of the tension between the (more) independent contours being a driving force behind its design.<p></p>
