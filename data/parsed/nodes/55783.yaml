      <p>It's always good to have an opportunity to think about Legato again.</p>
      <p>Lately I've been thinking that the concept of stroke, while not applicable to Legato in the traditional way, can't be entirely dismissed either. Or, to put it another way, what we call stroke in other typefaces is actually a composite phenomenon made up of the relationship of edges not only to each other but also to a <em>line.</em> And while in Legato the relationship of the edges is liberated, the sense of the line remains and this is part of what makes it ‘click together’ or ‘appear conventional’. What is the line? In stroke-based writing and parachirographic type design, it is the path that the stroke follows, and hence the underlying structure of the letters. In Legato, the structure is undeniably there, despite the independent treatement of the inner and outer walls. In one sense, this shouldn't surprise us, since the shapes of our letters derive from a stroke-written alphabet -- unlike, say, cuneiform -- and hence they retain the line-structure even when subjected to novel design treatments (a more radical departure, in this regard, is something like Renner's original design for the Future lowercase r, which begins to break the line-structure). In another sense, though, Legato must make us pause, and ask just <em>what</em> establishes the line when the inner and outer lines lose their relationship to each other?</p>
