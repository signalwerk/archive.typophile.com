      <p><em>"I don’t buy his argument that the “forward motion” of the stress helps particularly. After all, italics have this forward motion, and are generally less readable."</em><br>
      But you're comparing two much different implementations of the idea of "forward motion". Italics have a lot of other features that (I'd expect) influence their readability (the slant angle, and the classically narrower widths, to name but two). Also, Bloemsma isn't just talking about "'forward motion' of the stress" – he's defining that more closely as the tension between the black and the intra-/inter-letter space, that breaks up the isolation of individual letters; and I have no reason so far not to believe (a) what he says, (b) my eyes.</p>
      <p><em>"In other words, if you redrew Legato with just a normal old style stress, I suspect you wouldn’t lose anything as far as readablity."</em><br>
      Now *that* would be the ultimate thing to try. I'd contest it. Hell, I'd bet a bottle of decent wine that you would (lose something in terms of readability, that is). Except even that surely wouldn't yield a clear and uncontested result (who's going to do it, and how exactly, and how are you going to test the results "independently"?).</p>
      <p>SamSans: I don't know, this looks a *lot* more chirographically-informed to me than Legato. Yes there are some dissonances between the contours (like in the "s"), but they're much more gentle, and follow a "logically"-appearing, much more easily discernible pattern.</p>
