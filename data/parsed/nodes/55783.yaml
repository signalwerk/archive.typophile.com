      <p>What I love about Legato is not so much the look of the typeface itself (although I think there is beauty in it) but the idea behind it. The top-heavy Antique Olive-like thing may have been Bloemsma’s personal taste or an ideal idea of his, but apart from that I wonder what he would have come up with next.<br>
