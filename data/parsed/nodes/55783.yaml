      <p>Yeah doing the experiment of an old-style Legato would be an effort--but interesting. I'm not about to do it soon, though :) </p>
      <p>As far as SamSans, yes it has the feel of the hand in it, in a good way I think, but also its lines have constant contradiction of what a pen would draw. </p>
      <p>I also don't buy the chirographic=bad boogyman of Hrant. I think the pen does some things that helped readability, and some that hurt. And since Jenson, type designers have been modifying those things that hurt. Departing from the pen isn't inherently good or bad. Our letter shapes are based on the broad pen, so going too far away is always tricky to pull off successfully. </p>
      <p>Ultimately the test of whether Legato's unique stress pattern is a positive breakthrough is to do designs that follow it, but are more successful aesthetically than Legato. And if there is something else there having to do with notan, then develop that. Each person can have a go. I am just skeptical that this is a promising direction.</p>
