      <p><cite> &gt; “Legato is consequently a product of the tool of our time” </cite></p>
      <p><cite> &gt; what vector drawing software really allows us to do is to design individual contours</cite></p>
      <p>I don't agree that this characteristic is inherently unique to vector-based digital type design. The ability to work with interior and exterior contours independently has pretty much always been there.</p>
      <p>When cutting a metal punch using counterpunches, one would pretty much cut the counterpunch completely separate from the punch, generally in advance of the punch itself. So interior counters are determined independent of the cutting of the outer contours. How one relates the cutting of those outer contours, then, is a choice, not necessarily determined by the tools.</p>
      <p>Phototype masters could just as easily have been made from a solid outer shape with an independent contour cut from white material and superimposed. Or, if cutting rubylith, there is nothing inherently limiting about the tools that prevents considering interior independent of exterior.</p>
      <p>I'm not arguing that Legato is not a product or phenomenon of our time, but I don't think you can put it down to the tools.</p>
      <p>-- Kent.</p>
