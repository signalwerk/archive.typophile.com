      <p>&gt;If Legato is a successful design or not isn’t the question. The question is if Bloemsma’s way was a new one with potential for a general new approach to designing type or not.</p>
      <p>Well, I don't see why we can't look at both questions. If it wasn't successful--and I don't here mean commercial success--then I think there's a higher bar to make the case that it's a breakthrough, to be followed. I don't see what the general new approach is, if not the changed stress, which I don't think works. </p>
      <p>Hrant sees some kind of breakthrough in balancing black and white is a more readable way. I don't see that, and if that's not the breakthrough, what is? </p>
      <p>If it is the breakthrough, then show me another example, or create one, and I'll be convinced. Kris Sowersby did a Legato-influenced sans that I think was more successful aesthetically than Legato, but I don't think it used the forward stress of the black, which is the distinctive design idea of Legato. --A back-slant of the white is, of course, a characteristic of old style type. </p>
      <p>I agree it is very sad that Bloemsma is not around to further his innovative ideas, and it seems he was much loved by those who knew him.</p>
