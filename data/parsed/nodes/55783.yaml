    html: <p>Peter, I think Bloemsma was extremely systematic, perhaps even unwisely so. But I suspect the system was in what he wanted visually, and not in doing the same mechanical steps on things. I don't think you can get things to look the same by doing the same thing to different shapes. The eye is too complicated and changes what we see vs what's on the page or screen in ways we don't fully understand. So I would bet he just fiddled with the glyphs until he got that crossed diagonal effect he wanted.</p>
