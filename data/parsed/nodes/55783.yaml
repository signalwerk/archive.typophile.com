      <p><em>"Legato is consequently a product of the tool of our time"</em><br>
      Absolutely, and it utilizes the possiblities of said tool in an extremely interesting way. I mean, what vector drawing software really allows us to do is to design individual contours, i.e. also really design the white. As was also mentioned in <a href="http://typophile.com/node/16140" rel="nofollow">this thread</a>, so many people talk about how the white is important, but for me personally, I never really "saw" it until I discovered Legato. In Legato, the white is not just the ground the black figure lies on – it interacts with the black. I don't quite understand yet what that may do for readability, but if nothing else, it's very exciting. The glyphs look a lot more… alive.</p>
