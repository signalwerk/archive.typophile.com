      <p>Don't get me wrong: I'm on board for the thesis that there's something about Legato that may be unique to this cultural moment.</p>
      <p>But I still can't accept that digital tools are a driving factor.</p>
      <p><cite> &gt; I’d at least suggest it’s easier to do this in vectors, and more flexible – as in, less laborious to quickly try out many variants and new ideas,</cite></p>
      <p>Altaira, only insofar as there is an overall acceleration of the heuristic try-it-and-see process.</p>
      <p>But, for example, replicating what I'm interpreting in Jan's image -- the -0.5° / +4.5° experiment -- would be no big deal in a non-digital environment. I'm thinking phototype more than metal, in this case. Draw two ovals (using compass and french curves for instance), put 'em down on a table and rotate to your heart's desire until you get just the right relationship. Not *that* big a deal. Pretty flexible.</p>
      <p>When they're just right, take a photograph, make a film master, arrange some test words and phrases, see what they look like. True, getting them into an actual font and on to plates and a press for real printed samples, maybe a bit more work.  But really, digital tools aren't such a quantum shift as to make something like Legato inconceivable in a previous technological environment -- from the standpoint of working methods and technique.</p>
      <p>I think it's more about a zeitgeist/gestalt thing, not technology, tools, or materials.</p>
