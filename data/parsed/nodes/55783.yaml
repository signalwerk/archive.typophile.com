      <p>On the readability of Legato, which Peter again notes, I do agree with many here that Legato is unusually readable for a sans. And I think a lot has to do with Boemsma's success in breaking up the picket fence. But other stressed sans do it, including Lydian, Optima and Cyrus Highsmith's <a class="freelinking external" href="http://fontbureau.com/fonts/Amira" rel="nofollow">Amira</a>--which also violates pen rules systematically. </p>
      <p>Nina, I think that what you report about people reacting saying it looks more pen drawn is actually correct, in that the modulations are there as in a pen-drawn stroke, even though Bloemsma's modulations violate pen rules. For example, Carl Crossgrove's Beorcana is quite readable and has a strong pen-drawn quality.  </p>
      <p>So while I appreciate the readability of Legato, I don't think the forward stress of the black that is distinctive to Legato is the only way or best way aesthetically to achieve what it does by way of readability.</p>
