      <p>Note that the contours are slightly twisted or wrenched against one another ("verdreht" in Jan's FontShop image) rather than simply rotated. For example, the outer side points have a counter-clockwise rotation, whereas the outer top and bottom points are rotated clockwise. This kind of distortion of an ellipse might be achieved by some combination of skewing (slanting) and rotating. But I suspect Bloemsma just adjusted it my hand and eye until he got the effect he wanted. </p>
      <p>Also, when I played with my semi-bold version (a free-bee from FontShop!) the line connecting outer top and bottom points are between 1.5 and 2 degrees off vertical, not 5.5 degrees. Maybe the bold is different. The whole thing is very subtly done.</p>
