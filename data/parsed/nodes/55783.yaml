      <p>Nina, about some people seeing a calligraphic ductus in Legato, see the post I referenced above: <a href="http://typophile.com/node/16140" title="http://typophile.com/node/16140">http://typophile.com/node/16140</a> (my 25 November 2005 3:04 pm post).</p>
      <p>I wrote there as well: "it is possible that fundamental—rather than incidental—norm-violations, such as those introduced in Bloemsma’s Legato, where the violations are neither additive or subtractive (or based on sampling, like for instance Fudoni), might lead to something that is advantageous from a ’heightened readability’ point of view." So I think what is unique about Legato is that it's norm violations are fundamental rather than incidental.</p>
      <p>The 25 November 2005 3:04 pm post tries to suggest why I think this is advantageous from a readability or perceptual processing in reading point of view as well.</p>
      <p>I think the vector-based paradigm catalyses and facilitates such interventions and initiatives, however I agree with Kent that. In digital fonts it is still the font and not the outline that is designed. A font is designed by defining shapes and counter-shapes through vector manipulation. The vector is not the intentional object of design. When it's mathematics or geometry become the object of design, I think type design fails.</p>
