      <p><em>"only insofar as there is an overall acceleration of the heuristic try-it-and-see process"</em><br>
      I believe the "liberation" from costly, material, long-winded and involved processes in the type design and testing workflow that the digital environment has brought about has definitely cultivated an atmosphere of "freedom" in experimentation.<br>
      It's not only what a given tool can or can't do that matters, but rather what it <em>suggests</em> doing, or makes easy to do. I'm sure somebody could <em>technically</em> have drawn something like Legato using a pen on parchment, but then they didn't.<br>
      Tools influence thinking. And yes they influence heuristics, not just production. Ideas are born in friction and dialogue with tools, and materials. A pen is more conducive to drawing single strokes, while two contours with nodes and handles on them are posing the question more overtly if they should be treated as two sides of the same "line", or more independently.</p>
      <p><em>"replicating what I’m interpreting in Jan’s image — the -0.5° / +4.5° experiment — would be no big deal in a non-digital environment"</em><br>
      Except of course Bloemsma didn't just rotate the contours and voilà. I still can't figure out what exactly he did, but to me it looks like some serious node tweakage going on. I'm still not saying this wouldn't have been technically possible in a non-digital workflow, but I personally don't see how anyone would arrive at such a solution with non-digital tools (notwithstanding the fact I'm a beginner in this, and might just not be seeing things).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/legato-o_4959.gif"></div><p></p>
      <p>I tend to agree it's probably more about an overall cultural context than just the tools taken by themselves. But I'm suspecting that's more of a rhetorical/logical difference, since I believe that this same cultural context is itself heavily influenced by the tools/possibilities at the disposal of those people who make publicly visible things, and by the solutions found by them via the tools/possibilities – in a rather involved circular relationship.</p>
      <p><em>"I’m sure there have been yet other “emancipated countershape” types before Legato."</em><br>
      Lots. Display faces, and Po-Mo experiments.<br>
      What I was trying to get at was that Legato doesn't just emancipate the counterspace for the fun of it, but actually ends up being beautifully readable, which makes it such an amazing fusion of novelty and usability. Are there any <em>text</em> faces that did this previously? (Serious question, I'm ready to be educated. :-) )</p>
