      <p>&gt;what you make of Bloemsma’s illustration of how Legato’s construction principle and contrast helps readability </p>
      <p>I think that the modulation and also relatively wide spacing helps readability, but I don't buy his argument that the "forward motion" of the stress helps particularly. After all, italics have this forward motion, and are generally less readable. His innovation keeps the letters looking upright with some of this italic effect, but I suspect it's not much of a benefit. In other words, if you redrew Legato with just a normal old style stress, I suspect you wouldn't lose anything as far as readablity. </p>
      <p>Another interesting example, also obviously influenced by Dwiggins, is John Downer's <a class="freelinking external" href="http://fontbureau.com/fonts/SamSans" rel="nofollow">SamSans</a>, which was until recently the 'Featured Face' here on Typophile. That has a lot of angular inner outlines and smooth outer, and modulation. It is a little narrow for my liking--though a narrow informal sans was indeed his brief--but I think extremely readable for being a narrow sans. Interestingly, his "e" has some of the forward/backward motion of Legato--it is from 1993!--but not generally.</p>
    html_clean: |-
