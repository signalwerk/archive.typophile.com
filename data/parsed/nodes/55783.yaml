      <p>I guess it depends on how you want to go about defining your "independentness." I mean, ultimately, if a design is successful the various contours are going to be bound together in some fashion. </p>
      <p>Yes, in Quiosco there are still straight parallel stems. I was looking more at the interaction/independence of the inner and outer curve of the n arch -- these have a radically different thrust from one another, creating an interesting tension, which was the focus of Cyrus's formal exploration. (Note also the non-parallel right stem that results from this tension.)</p>
      <p><cite> &gt; while those in Legato look pretty… twisted :-). </cite></p>
      <p>Non-parallel, swelling or flaring stems are nothing terribly innovative in and of themselves, of course. </p>
      <p>I believe in this case they arise out of Bloemsma explicitly stated aversion to straight lines. Which makes his aesthetic rather ironically non-digital -- since you could argue that straight, square, plumb, and parallel are in large measure inherent in digital tools.</p>
      <p>For another interesting comparison, take a look at what Frutiger was doing in Icone (ca. 1980). Legato on the left, Icone on the right:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Legato-Icone_n_5573.png"></div><p></p>
