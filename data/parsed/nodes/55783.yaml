    html: |-
      <p>&gt;Are there any text faces that did this previously?</p>
      <p>I don't think there are any other faces that have done what Jan's very helpful graphic shows: squared off rounds, with a forward slant outside and a back slant inside.</p>
      <p>This is innovative, but to my eyes rather ungainly and awkward, and though readable, also no breakthrough on readability. To me Legato is very interesting, without really being a successful design. </p>
      <p>Something which has a resemblance in some ways is Fedra. It also has somewhat squared off rounds, and subtle differences between the inner and outer outlines. To me it is a fresh and very successful design, both in aesthetics and readability. </p>
      <p>I don't see Legato as a significant breakthrough for the future of type design. Note for a start that Bloemsma's theory of Legato is not Hrant's theory. Bloemsma was concerned to get 'flow' from one letter forward to the next, and correct the tendency of Roman letters to turn into a picket fence--which is indeed a real and important problem. </p>
      <p>The name 'Legato' clearly indicates this goal. Bloemsma wasn't concerned so much with 'notan', the balance of black and white, as with forward movement and coherence of word image, which he thought was harmed by the dominance of verticals.  </p>
      <p>Further, having the inner and outer outlines follow different patterns, and not follow the pen is as old as Jenson. The modifications are generally more subtle than in the case of Legato, though as Kent noted already Dwiggins was willing to go further than his predecessors, in consciously changing inner outlines to make a tension between inner and outer shapes. The innovation here in Legato is to me not any innovation in notan or in departing from the written stroke, or in having inner and outer shapes different. Instead, it is the innovative stress pattern that Bloemsma himself points to in the diagram that Jan reproduces. </p>
      <p>Bloemsma's experiment is intriguing because it was innovative, and he carried it though with great subtlety and control. But personally I think in the end it doesn't work. The "s" is particularly awkward and heavy to my eyes. </p>
      <p>I don't think I've ever seen it here in the US in print. Have any graphic designers taken it up in Europe? It might just be ahead of its time, as Hrant argues, with some great breakthrough on notan. But it may also just be a fascinating but unsuccessful experiment, which is my suspicion.</p>
