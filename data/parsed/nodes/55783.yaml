      <p>It's a nicely drawn irregular sans.<br>
      What makes it unique is the amount of BS that's been attached to it.</p>
      <p>As Nina has demonstrated by reversing Bloemsma's rotation cue, there is the tell-tale residue of skew, confirming the face's chirographic construction. So basically it is a humanist sans, with the counters made slightly more symmetrical. I think Bloemsma designed primarily with hand and eye, and that the detailed rationalization is post facto, and not very convincing. Type founders have been thinning out the thickest part of the chirographic stroke from Jenson to Quiosco (compare "p"s).</p>
      <p>I suspect that he had the general idea that an irregular sans could be drawn with some tension, by chafing against the usual precepts of simple geometry and chirography, and that there might be some readability benefit in that. But the face still has a predominantly chirographic stress, as can be seen by flipping the "o"--Legato above, Maiandra in the middle, and most subtle of all, Productus, below.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Ooos_6215.jpg"></div><p></p>
      <p>Legato has something of the feel of an old-fashioned humanist sans, say Goudy Sans; its slightly uncrisp execution, and the fact that the letter shapes themselves are not particularly novel, might contribute to its lack of popularity, although it does have the even width and semi-condensed proportions of the contemporary sans genre descended from Meta.</p>
      <p>I'm not knocking the face, just questioning the theory.</p>
