      <p><cite> &gt; Are there any <em>text</em> faces that did this previously? (Serious question, I’m ready to be educated. :-) )</cite></p>
      <p>Okay, this is separate from the pre-/post-digital tools debate. </p>
      <p>I think Cyrus Highsmith's <a class="freelinking external" href="http://www.fontbureau.com/fonts/Quiosco" rel="nofollow">Quiosco</a> demonstrates the same kind of independence of interior/exterior contours. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quiosco-nop_6549.png"></div><p></p>
      <p>&nbsp;<br>
      I can't swear that it is strictly "previous" to Legato. Certainly not by much. The first appearance of Quiosco was 2002 in <a href="http://www.fontbureau.com/projects/LaPrensaGrafica" rel="nofollow"><cite>La Prensa Gráfica</cite></a>. I believe that the published date of Legato is 2004. Who knows how long he was working on it or when he started.</p>
      <p>I'm pretty sure Cyrus knew Evert, and most likely respected him. But I don't know if there were any specific influences either direction. As I've said, I believe this is more of a zeitgeist thing.</p>
      <p>Cyrus's stated influence in this direction was Dwiggins.</p>
      <p>-- K.</p>
