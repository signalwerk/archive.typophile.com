      <p><em>"Yes, but what then is a metal punch and graver more conducive to?"</em><br>
      Heh, Kent, I had a sentence in there that read something like, "I don't know enough about the processes of punchcutting et al. to bring them into this equation", but I deleted it because I thought I was writing too much anyway. :-Y<br>
      Certainly a direct/logical assumption would be that punches and gravers are not especially conducive to adhering to a rigid "stroke" based model – but then I don't really understand why the latter has been followed for so long even with those tools. Maybe because culturally, there's still been a traditionalist adhesion to the pen, a dominating conservatism. And that seems to change a bit recently, I assume due to the [tool-/visuals-inspired] visual/cultural shift we've been going through.</p>
      <p>Regarding how Dwiggins designed counterspace: It'd be very interesting if somebody could maybe put up some pictures/samples or post some links? I've seen the hmnu counters in Caledonia, which you cite/show in the Whitman specimen, but not much more that would clearly show this approach of his.</p>
      <p>By the way, one thing I've found quite striking about showing Legato to people not obsessed with type has been that, not only do they tend not to realize what's going on with the contours (which probably means it's so low-key that it's definitely not too innovative to work in text), but some actually see a hand-written/"calligraphic ductus" in it – the very same thing it breaks! I wonder if that has something to do with John's "line" idea. Maybe Legato strikes that fine line (ignore bad pun) where its black and white aren't yet perceived as totally independent black and white "areas of space", but the "stroke" isn't really there anymore either? Hmm.</p>
      <p><em>"…though readable, also no breakthrough on readability"</em><br>
      William, considering it has no serifs, to my eyes it's quite amazingly readable for longish text, which I think may very well come down to the way it handles the white. I have an idea about that brewing… but have to get some work out of the way first. But then maybe Hrant will join in.</p>
      <p>Speaking of Fedra (which I agree is a great design), I must say the interplay between the contours doesn't strike me as nearly as distinctive a feature in Fedra as it is in Legato. If anything, it's extremely subtle, to the point where I wonder if it was as much a driving force behind the making of Fedra as it was in Legato.</p>
      <p><em>"Kris Sowersby did a Legato-influenced sans that I think was more successful aesthetically than Legato"</em><br>
      Oh really? What's it called?</p>
