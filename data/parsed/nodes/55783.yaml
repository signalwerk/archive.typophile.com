      <p><cite> &gt; numeric precision for example. </cite></p>
      <p>Numeric rigidity, perhaps, but I don't know about "precision" per se. </p>
      <p>Let me point out that Linotype brass machining was capable of tolerances down to one-quarter of a thousandth of an inch. Much finer than a single unit in a 1000-unit Postscript em at anything under 288 pt sizes. </p>
      <p>There are curves in Linotype working drawings from the 1940s that are tricky to replicate with beziers. And having done so, those curves are going to get obliterated at 12-point output in a way that they aren't in metal.</p>
      <p>All I'm saying is that numerical precision is a tricky notion. Anyone who's worked with rotated ovals and then tried to get bezier extrema points to maintain those precise curves will understand what I'm talking about.</p>
