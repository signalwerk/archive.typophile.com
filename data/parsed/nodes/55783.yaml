      <p>Its design concept.</p>
      <p>I can’t put it any better myself, so here’s what Hrant Papazian had to say on typographica (best of 2004):</p>
      <p><em>Evert Bloemsma's Legato typeface is something truly new, which is extremely rare. Its essential attribute is that the black of the individual letterforms is made equal in importance to the white inside and between the letters. It does this by disposing of the linking between the two edges of the black, something inherent in the conventional forming of shapes derived from a marking tool, such as the broad-nib pen.</em></p>
      <p>By making the black and white harmonize, Legato approaches an ideal of readability, since reading involves the perception of positive/negative space as one thing. Also, it does this while still appearing conventional to the reader -- a key feature in any text face. All this makes it the best typeface of a much longer period than just 2004!</p>
