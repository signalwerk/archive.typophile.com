      <p>Frode, look at its "o" really large and you'll see how the inner contour is independent from the outer one, following a different design logic. To my eyes, the amazing thing is that they still click together: the glyphs feel very harmonious (definitely not like they're collaged together from non-matching contours).</p>
      <p>Rather than just an interesting experiment, I see this as a huge cultural contribution. In my view, this marks an important step in the emancipation of the "medium" of digital type from its predecessors. Today we don't design "strokes", we design separate contours, and I think Legato demonstrates very vividly – and very beautifully – what kind of impact that can have on a new* way of seeing, and making, type.<br>
      * "New" not in a destroying-all-that's-old-for-the-sake-of-it sense, and not in a "we do this because we can" way; but in an open-minded, constructive and practicable way. It's not a Po-Mo experiment; it actually works/reads very well!</p>
      <p>(God I love it.)</p>
