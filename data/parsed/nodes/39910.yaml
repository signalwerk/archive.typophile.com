    <p>I downloaded Microtype Typographic ruler form </p>
    <p><a href="http://www.microtype.com/typometer.html" title="http://www.microtype.com/typometer.html">http://www.microtype.com/typometer.html</a></p>
    <p>and I am trying to understand how to use it. The PDF has a note that reads.</p>
    <p>———<br>
    This font is Helvetica, where the measured cap height is 72% , and the x height is 52%, of the specified font size.Thus when you select Helvetica 20 point, the cap height is 14.5 points, and the x height is 10.5 points.<br>
    This proportion can generally be regarded as “standard”, and the sizes shown can be used with most fonts.<br>
    Following are cap height percentages for some common fonts (these might vary according to font manufacturer):<br>
    American Typewriter 66%<br>
    Antique Olive 75%<br>
    Avant Garde 75%<br>
    Benguiat 66%<br>
    Bodoni 70%<br>
    Bookman 69%<br>
    Century Schoolbook 72%<br>
    Clearface 69%<br>
    Franklin Gothic 70%<br>
    Futura 75%<br>
    Garamond 62%<br>
    Gill Sans 67%<br>
    Lubalin Graph 72%<br>
    News Gothic 77%<br>
    Optima 69%<br>
    Times 68%<br>
    Univers 70%</p>
    <p>To precisely determine the size for any font, use the line spacing gauge on this ruler to measure the cap height, and divide it by the cap height percentage of the specific font.<br>
    ——</p>
    <p>Can a typographer help me to understand this please?</p>
    <p>thanks</p>
