      <p>This looks like it has evolved from the Victorian/Edwardian version - which would probably be hand drawn, or certainly very adapted from a font, which I will have a look through my old founder's books for when I get a mo. </p>
      <p>Possibly an inspiration for Belwe, though I've no idea if he partook.</p>
      <p><a href="http://www.dewarswow.com/flash_timeline/timeline.aspx?SectionId=1899" rel="nofollow">Dewar's</a> </p>
      <p>Very likely a long way from an actual font - although quite Belwe'esque if you squint.</p>
