    <p>hey all,<br>
    i'm working on a project that requires me to reuse an existing font which i cannot identify.  If anyone happens to know what font(s) are in use on the attached label, the info would be greatly appreciated.  Incase it is not all easy to make out, i'm looking for the font(s) used on the Dewar's scotch whisky white label.</p>
    <p>thanks!</p>
