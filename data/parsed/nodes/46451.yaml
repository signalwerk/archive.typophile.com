      <p>Thank you, Michel. In the meantime I asked an italian TeX user that I knew for having used the Fell Types to investigate a little. He sent me a test pdf output telling me everything was working right. But when I looked at it, it was bad exactly the same way as another pdf I received. I asked him about this and sent him a screen save and he answered that it used Acrobat Reader 5 and the output was good and sent me, as a proof, a jpg. We both are on Windows XP. I use Acrobat reader 8 and the output is bad. I tried another pdf reader, Sumatra, an open source, and the output is good. So it seems the problem is in the chain pdf creator-pdf reader: somewhere the "Postscript=1000 em size" identity should have remained.</p>
      <p>Igino</p>
