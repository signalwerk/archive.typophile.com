    html: |-
      <p>The Acrobat/PDF issues are a problem we've recently learned about with unusual (non-1000) upm sizes for Type 1 and OpenType CFF fonts and PDFs created with xdvipdfmx.</p>
      <p>If the PDF is created using Acrobat, it works fine. If the PDF is created with xdvipdfmx, it will look incorrect on screen in Acrobat 8 and 9, and print incorrectly. Although it will look correct on screen in some older versions of Acrobat, it will still print incorrectly (at least to Adobe PostScript devices).</p>
      <p>I expect that the on-screen problem in XeLaTeX is related to the same issue of upm scale. That one is clearly a XeLaTeX bug.</p>
      <p>Regards,</p>
      <p>T</p>
