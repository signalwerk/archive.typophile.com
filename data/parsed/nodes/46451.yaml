      <p>I don't know the reason. All I know is that if I change the em size of the otf font from 2048 to 1000 using Fontforge, the problem seems to disappear. Is the em size the very reason? I have no idea. Does the license allow changing it? I would say no. Is there a way to do the equivalent using low level variables in XeLaTeX without touching the font? I dont' know either and I don't think that's the way to go. The font seems to work well with InDesign but it would indeed be more fun with XeLaTeX because it is then easier to adjust the opticals to get them automatically.</p>
      <p>[added] In the texlive installation, the files XeTeX-notes.pdf and XeTeX-reference.pdf (that on my mac are in /usr/local/texlive/2007/texmf-dist/doc/xetex) and the file fontspec.pdf (in /usr/local/texlive/2007/texmf-dist/doc/xelatex/fontspec) contain useful information.</p>
