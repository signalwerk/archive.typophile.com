    <p>Hello!</p>
    <p>I have been spending all day trying to get support for OT fonts on my Linux machine, and the best I have done so far is with XeLaTeX. I have, however, been having a few problems getting Igino Marini´s Fell Types to work properly. I have control over all of the special OTF features, it´s just that the spacing is really messed up and they come out much smaller than I specify. I have gotten a few other OTF faces to work fine, so I´m not sure where the problem is. Can anybody point me to some assistance???  </p>
    <p>The example below is as follows:</p>
    <p>Delicious at 10pt;<br>
    Linux Libertine at 10pt;<br>
    IM Fell Double Pica Pro at 80pt.</p>
    <p>Thanks!!!<br>
    Glen</p><div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto_6485.png"></div><p></p>
