      <p>I compiled on my mac (ppc with OS X 10.4.11) the latest pre-release version (revision 811) of XeTeX using the tarball at the bottom of <a href="http://scripts.sil.org/svn-view/xetex/TRUNK/" rel="nofollow">this link</a>. I tried your fonts without touching them with the following input copied from page 164 of Lawson's book, <em>Anatomy of a Typeface</em>:</p>
      <p><code><br>
      \documentclass{article}<br>
      \usepackage{fontspec}</code></p>
      <p>\font\flower="IM FELL FLOWERS 2" at 17.5pt<br>
      \font\capital="IM FELL French Canon PRO Roman" at 39pt<br>
      \setromanfont{IM FELL Great Primer PRO}<br>
      \setlength{\textwidth}{4.5in}<br>
      \setlength{\parindent}{0pt}<br>
      \begin{document}<br>
      \fontsize{17.5}{20}\selectfont<br>
      {\flower 1} \textsc{the application}: This is levelled at that numerous part of mankind, who, out of their ample fortunes take care to accomplish themselves with everything but common sense.</p>
      <p>\bigskip<br>
      \begin{center}<br>
      73. \textit{The Old Hound.}<br>
      \end{center}</p>
      <p>{\capital A\kern0.05em}n old Hound, who had been an excellent good one in his time, and given his master great sport and satisfaction<br>
      \end{document}<br>
      </p>
      <p> Using the commands <code>xelatex -no-pdf p164.tex</code> and then <code>xdv2pdf p164.xdv</code> here is what I get:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hound_4933.jpg"></div><p></p>
      <p>Your fonts seem to work just fine. However, if I use <code>xdvipdfmx</code> instead of <code>xdv2pdf</code> I still get a bad pdf output with fonts having an em-size of 2048 (and <code>xelatex</code> without the <code>-no-pdf</code> option uses <code>xdvipdfmx</code> to produce the pdf output). </p>
      <p>Michel</p>
