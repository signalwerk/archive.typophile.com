    <p>Hello Typophile,</p>
    <p>I stumbled onto this forum today, many sharp minds and eyes here it seems...<br>
    I released some work recently, working under the name Adam Tension. Sort of an exhibit, with a variety of work for a variety of reasons.</p>
    <p><a href="http://www.leftrightoutput.com" title="http://www.leftrightoutput.com">http://www.leftrightoutput.com</a></p>
    <p>I'd really appreciate some feedback, though this area of the forum doesn't seem to be too busy. It's very heavy with typography, I figure some opinions can be found here.</p>
    <p>Cheers,<br>
    Clint</p>
