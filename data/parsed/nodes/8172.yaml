  html: <p>Hello,  <br> <br>I meant to bring in an eye magazine to scan in an example but surely one of you have one close by and can help me. <br>Basically what font do they use for the body text in the main articles. I know at the back under typography they mention Proforma and Egyptian, I can account for the other fonts mentioned but am mixed up between egyptian and proforma because there seems to be a few different kinds of egyptian available (505, OL). <br> <br>Basically to make things simple my question is where do they use Proforma (is it in the main articles text?) and where do they use Egyptian. <br> <br>Thanks alot, <br> <br>David.</p>
  html_clean: <p>Hello,  <br> <br>I meant to bring in an eye magazine to scan in an example but surely one of you have one close by and can help me. <br>Basically what font do they use for the body text in the main articles. I know at the back under typography they mention Proforma and Egyptian, I can account for the other fonts mentioned but am mixed up between egyptian and proforma because there seems to be a few different kinds of egyptian available (505, OL). <br> <br>Basically to make things simple my question is where do they use Proforma (is it in the main articles text?) and where do they use Egyptian. <br> <br>Thanks alot, <br> <br>David.</p>
