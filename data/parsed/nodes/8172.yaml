    html: <p>I think they use Proforma Medium for most of their text (see below). I don't have a magazine in front of me, but I thought they used <a href="http://www.myfonts.com/search?search%5Btext%5D=Clarendon" target="_blank">Clarendon</a> for headers, but it's in the Egyptian vein (They tend to be blocky and bold, here is <a href="http://www.myfonts.com/fonts/ef/egyptian/" target="_blank">one</a> from E&amp;F). You should be able to distinguish the two quite easily.  <br> <br><img src="http://www.typophile.com/forums/messages/83/55964.jpg" alt=""></p>
