    date_raw: 24 Mar 2005 — 4:31am
    votes: null
    html: '<p>Marten Thavenius on the FDK forum wrote: <br> <br>I did some more trial &amp; error testing and I think I found a way. Here it is if someone is interested. <br> <br>Add a value consisting of non-hex data in the third column in the GOADB, like uniX or NULL and FDK will leave the Unicode index empty for that glyph. And the best of all, no error is reported. <br> <br>I also did a diff between two OT files; one using this "feature" and one not, and the only differens is the non-existent unicode values for that particular glyph. <br> <br>news:adobe.opentype.developers.fdk</p>'
    html_clean: '<p>Marten Thavenius on the FDK forum wrote: <br> <br>I did some more trial &amp; error testing and I think I found a way. Here it is if someone is interested. <br> <br>Add a value consisting of non-hex data in the third column in the GOADB, like uniX or NULL and FDK will leave the Unicode index empty for that glyph. And the best of all, no error is reported. <br> <br>I also did a diff between two OT files; one using this "feature" and one not, and the only differens is the non-existent unicode values for that particular glyph. <br> <br>news:adobe.opentype.developers.fdk</p>'
