    html: |-
      <p>Sometimes this is a name length issue, although that tends to happen more in Windows. If you're using FontLab studio, in the font info interface, the Names page, check the "yin/Yang" looking button which checks for errors in font names. </p>
      <p>Although this is just a guess, it could be something else completely. </p>
      <p>Jason C</p>
