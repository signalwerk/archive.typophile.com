  html: |-
    <p>I have a semi large type family that has a problem with installing certain fonts that receive an error stating that they are "not a valid font file."</p>
    <p>The type family is set up with 3 sub families like this:</p>
    <p>fontname-regular<br>
    fontname-regular-italic</p>
    <p>fontname-alt1-regular<br>
    fontname-alt1-regular-italic</p>
    <p>fontname-alt2-regular<br>
    fontname-alt2-regular-italic</p>
    <p>If you google "was not a valid fontfile", you'll discover a host of problems and solutions from the users end. But my issues only seem to effect the 'alt2' sub-family of the typeface which makes me think this is a problem caused on my part. </p>
    <p>When installing the complete typeface, it only seems to effect 1 or 2 fonts in the alt2 sub-family, and not always the same two.</p>
    <p> I've encountered the problem on both osx 10.6.8 and winXP</p>
    <p>If anyone would like to look at the fonts, please let me know and I'll send you the files.</p>
