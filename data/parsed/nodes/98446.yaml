    html: |-
      <p>Thanks for your help so far. After remaking one font from an old working file, I tracked the issue down to one stylistic alternative. When I renamed the guilty character from k.salt to k.alt, the font exports and installs without problem. </p>
      <p>No idea why the salt doesn't work in one subfamily of fonts, but is fine in the others... but at least it's usable now!</p>
