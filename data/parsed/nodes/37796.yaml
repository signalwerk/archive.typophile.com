      <p><em>Since the designer has chosen this font and not one with even width caps, the best that can be done is to optimize the optical density of the composition.</em></p>
      <p>I have to respectfully disagree, James. The modulating widths in the typeface are meant to assist in readability as a text.  A logotype/wordmark has different requirements.  These specific letters need to hold together as a singular unit.  So, I consider it necessary to adjust certain letter widths like the N and maybe the A to harmonize better.</p>
      <p>That all said, your examples of additional letterspacing do help minimize some of the unevenness.  Therein lies my biggest criticism of Casini's latest version: it all feels incredible cramped.  The C and A have a nice space, but the S feels a touch too close to the A (some redrawing of the S could probably solve this).  And then the INI feels like it's about to get into a fender bender and needs to back off.</p>
      <p>(edited to add italicized quote at top)</p>
