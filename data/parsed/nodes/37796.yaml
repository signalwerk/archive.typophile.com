    html: |-
      <p>This is stock Futura light, the URW++ version methinks. It's not custom lettering so complaints about letter widths seem inappropriate.</p>
      <p>Futura has proportional capitals based on the carefully-worked-out ratios of the Trajan inscription. The differing letter widths harmonize in complimentary fashion. They're not designed to please people who think every element in a logo or a typeface should be uniform. It amazes me how many graphic designers and art directors evidently fail to appreciate this. Sure the N looks wide---it's meant to be that way.</p>
      <p>Since the designer has chosen this font and not one with even width caps, the best that can be done is to optimize the optical density of the composition. So we tighten up the space between C and A, and do the same for A and S.</p>
      <p>Increasing the overall spacing makes the uneven density less noticable and adds elegance.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/casini1_4364.gif"></div><p></p>
      <p>^ The large S looks unweildy to me too, so I moved it to a dropped position to allow A to be brought closer beside it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/casini2_6083.gif"></div><p></p>
      <p>^ I think this works better. A tad more letterspacing makes it a touch more elegant.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/casini3_5113.gif"></div><p></p>
      <p>^ Substantially more spacing gives a more relaxed vibe appropriate to the product(s) conducive to a life of refinement.</p>
      <p>j a m e s</p>
