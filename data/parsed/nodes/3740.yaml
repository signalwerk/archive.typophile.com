  html: "<p>I'm using fontographer on a pc and am trying to save a mac-truetype version of a font that I've made... my friend, who runs osx, says that he can't get it to work. The file extension is .Suit$. You can download it here: <a href=\"http://www.craigbutterworth.com/type/index.html\" target=\"_top\">http://www.craigbutterworth.com/type/index.html</a> <br>Anyway, I'd appreciate any help that you can give. <br>_Craig</p>"
