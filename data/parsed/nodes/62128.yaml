    html: |-
      <p>Thank you Craig and Tiffany, very helpful comments all around.</p>
      <p>I separated the wheat from the chaff and ended up with much more space, as a result, I've opted for a different layout. (Resume2 above)</p>
      <p>As far as the font choice, do you think using a serif is too plain/boring/stuffy? I wanted to challenge myself to use a serif, particularly because I wanted to attempt a hierarchy without bold type, and I feel like a serif will help the résumé stand out. I like Warnock because it has a contemporary feel that other serifs I own do not. Can anyone speak to this more specifically?</p>
      <p>Thanks again.</p>
