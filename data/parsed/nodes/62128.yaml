    <p>Hello all.</p>
    <p>I am looking for feedback on my résumé. I stuck entirely with Warnock Pro, relying on caps and italics to build hierarchy rather than bold weights.</p>
    <p>Do you think there is enough contrast to point out the different sections? Is there too much info? Do the old style figures fit? Yes or no on italic ampersands?</p>
    <p>Any and all feedback is most appreciated.</p>
    <p>Thanks.</p>
