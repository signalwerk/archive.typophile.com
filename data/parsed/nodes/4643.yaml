    html: <p>You guys are right about bootleg fonts. That said, Myriad Pro is available for FREE from Adobe, if you buy their software. It's bundled with Illustrator CS, as are many other OpenType fonts like Minion Pro, and if you buy the whole CS suite you can download the complete Brioso Pro Opticals set of 42 fonts. At $35 per font, that's $1470 worth right there, more than the cost of the suite!</p>
