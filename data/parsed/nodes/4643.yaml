    date_raw: 8 May 2004 — 8:49am
    votes: null
    html: "<p>I'll begin by saying that I've hotwired many fonts before. In fact I've stolen Myriad before. Then I designed my first typeface and I realized that it takes many many months to draw all those letters. Perhaps <a href=\"http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=tphinney-users\" target=\"_blank\">Thomas</a> can enlighten us, but I imagine it took <a href=\"http://www.adobe.com/type/typedesign/twomblybio/main.html\" target=\"_blank\">Carol</a>, <a href=\"http://www.adobe.com/type/typedesign/slimbach.html\" target=\"_blank\">Robert</a>, <a href=\"http://www.adobe.com/type/typedesign/slye.html\" target=\"_blank\">Christopher</a>, Fred and the rest of the Adobe Type staff many moons of labor to create Myriad Pro given the thousands of letters and languages included in the font. <br> <br>But to answer your question, I don't know if Adobe sells a true type version anymore. They sell individual weights of the font for a mere 35 dollars. Perhaps the best way to find out is to do this: <br> <br>Hey Thomas, is it possible to purchase a true type version of Myriad? <br> <br>Cheers, <br>Randy</p>"
    html_clean: "<p>I'll begin by saying that I've hotwired many fonts before. In fact I've stolen Myriad before. Then I designed my first typeface and I realized that it takes many many months to draw all those letters. Perhaps <a href=\"http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=tphinney-users\" target=\"_blank\">Thomas</a> can enlighten us, but I imagine it took <a href=\"http://www.adobe.com/type/typedesign/twomblybio/main.html\" target=\"_blank\">Carol</a>, <a href=\"http://www.adobe.com/type/typedesign/slimbach.html\" target=\"_blank\">Robert</a>, <a href=\"http://www.adobe.com/type/typedesign/slye.html\" target=\"_blank\">Christopher</a>, Fred and the rest of the Adobe Type staff many moons of labor to create Myriad Pro given the thousands of letters and languages included in the font. <br> <br>But to answer your question, I don't know if Adobe sells a true type version anymore. They sell individual weights of the font for a mere 35 dollars. Perhaps the best way to find out is to do this: <br> <br>Hey Thomas, is it possible to purchase a true type version of Myriad? <br> <br>Cheers, <br>Randy</p>"
