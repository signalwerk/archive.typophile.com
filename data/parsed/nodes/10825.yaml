    html: <p>You'll never get sharp text in photoshop. You'll never get sharp downsamples on images either. Try Macromedia's fireworks. The kearning really sucks, but the type is very crisp (the image downsamples too, for that matter). Photoshop just wasn't designed with 72 dpi in mind.</p>
