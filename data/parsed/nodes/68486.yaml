      <p><cite>What's the advantage of using GREP over a plain, case-sensitive search for "Th"?</cite></p>
      <p>The advantage is that you create it as part of a paragraph style, and the substitutions happen automatically. There's no need to worry about doing it as the very last step (and maybe forgetting to). You just set up a GREP style at the beginning, and forget about it.</p>
