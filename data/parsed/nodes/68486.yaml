    votes: null
    html: |-
      <p>I wasn't aware of Th ligatures in normal printing faces. As noted, they may serve a purpose in script faces.</p>
      <p>I know I once saw a manual <em>typewriter</em> with the letters "th" as a single character on one of the keys - if it was a superscript "th" for numbers, that might have made sense, but simply as a way to make typing quicker by saving a keystroke, I thought it was a horrible idea.</p>
      <p>The "ct" and "st" ligatures are mannered items used for self-consciously antique faces. For a run-of-the-mill roman, they would not be appropriate. If Adobe is producing faces like Times Roman, Century Expanded, or even Garamond, with a "Th" ligature, I would be predisposed to think it a very bad idea, although I might change my mind when I actually see the ligature in question. (It doesn't even seem to be a necessary kerning combination, let alone a potential ligature.) But if it's just script faces, or fancy swash italic faces, that's different.</p>
      <p>EDIT: Having seen it in Adobe Garamond on MyFonts, and in Franklin Gothic in this thread, I concur with the original poster's opinion. It is out of place in ordinary text faces, and should not be inflicted on people who might use it with word processing programs that don't provide the opportunity to turn it off.</p>
      <p>It is a disaster from an aesthetic point of view, and I cannot but wonder what those responsible could have been thinking.</p>
