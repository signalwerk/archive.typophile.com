    html: |-
      <p>It's a designer decision, plain and simple. By and large, it's the choice of designer Robert Slimbach -- but to a great extent, Robert guides the style of Adobe Originals in general, so it has evolved into a common ligature for most/all of our fonts. If another Originals designer doesn't want it in their fonts, we don't put it in.</p>
      <p>We have noted opinions, both for and against, ever since it first appeared (which I think was in the first Adobe OpenType fonts).</p>
      <p>I agree that it's helpful to cite specific typeface designs, since its success (IMO) does vary depending on the design. On one hand, I'd say there is very little chance of it going away in Adobe fonts, since, like I said, it is Robert's preference. On the other hand, we are interested in customer feedback and do take note of it. Opinion is mixed; it is not universally despised by any means.</p>
      <p>For InDesign users, one technique for turning it off: Make a GREP style that finds 'Th' and applies a character style with ligatures disabled.</p>
