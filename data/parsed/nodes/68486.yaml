      <p>For those who still see Adobe's role in the propagation of the 'Th' ligature as some kind of evil plot to destroy the universe, I can tell an anecdote: During the development of Adobe Clean (Adobe's new corporate sans serif typeface), there was a joined Th ligature. Robert and I were discussing design details one day, and I said that I thought that letter pair might look better unjoined. Not long after that, he rolled out a revision without the ligature, and said he had tried it out and agreed that it looked better without it. (In fact, there is a ligature glyph, but it's virtually the same as the regular unjoined letter pair.)</p>
      <p>Robert might very well have gotten feedback from others in the Type group; it's not like I have some fantastic history of telling him how to improve his designs. The point is that Robert listens to others, considers the options, and does what he thinks is right for the design -- just like many <em>many</em> other type designers out there.</p>
