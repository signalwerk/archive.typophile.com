    html: <p>I think you've summarized this issue fairly well, Joe. We used to experience books with occasional ugliness in their typesetting (or opportunities for improvement) where the <em>fi</em> and <em>fl</em> ligatures were omitted. Now with InDesign defaults and the (very nice) book faces Adobe ships with the various flavors of Creative Suite, we have an excessive of <em>Th</em> ligs included, particularly at the beginning of sentences and paragraphs. Over the length of a whole novel (see <em>The Magicians</em> by Lev Grossman from last year) the <em>Th</em> ligatures are incredibly distracting.</p>
