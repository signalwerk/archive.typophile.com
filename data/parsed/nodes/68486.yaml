    html: |-
      <p>I suppose I should have been more specific about what fonts I meant. I thought everyone would know (and I think most did) that I meant the Adobe Originals faces, progenitors of this ligature: specifically Arno and the Garamonds. And I was also talking about standard, garden-variety text setting. Titling and lettering are a different ballgame.</p>
      <p>Really the only solution is to allow ligatures to be chosen individually. Making "Th" discretionary isn't the answer, because those who do like to use it are unlikely to want a text full of "ct" or "st" ligatures. (Maybe there should be three categories: standard ligatures, controversial ones, and those that will only rarely be used. Better yet: let users define their own sets.)</p>
      <p>I'm curious: What's the advantage of using GREP over a plain, case-sensitive search for "Th"? In my experience, using find and replace to apply a "no ligatures" character style globally doesn't work, because this replaces any previously applied character style, and that's a problem if "no ligs" style isn't based on the replaced one.</p>
      <p>You can use find and replace to turn off ligatures as local formatting, but the wider set of the non-ligature combination can and will cause reflow if, like me, you make the avoidance of loose, gappy lines a priority.</p>
