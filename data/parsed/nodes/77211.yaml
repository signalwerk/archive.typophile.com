    html: <p>Oh, sorry. I read 'transtype' and skipped 'fontlab'. So, you are using it already. If you are correctly generating the fonts there should not be a problem. Can you give more info on how you are generating the OT fonts? I don't fully understand your sentence ' some glyphs are falling back to other fonts'...</p>
