    html: |-
      <p>Have you checked the encoding in the resulting font? It would be worth checking whether the problem letters in the generated font have the correct Unicode values.</p>
      <p>Another thought: are the problem letters by any chance the ones that have the double-mapping problem: Delta, mu, Omega? See Paul Hunt's post in the following thread:<br>
      <a class="freelinking external" href="http://typophile.com/node/37077" rel="nofollow">http://typophile.com/node/37077</a></p>
