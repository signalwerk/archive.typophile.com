    html: <p>I import the mac font in fontlab and then I go Glyph-&gt;Glyph Names-&gt;Reencode Glyphs and choose MacOS Greek Encoding and export the font in opentype or truetype. But some greek letters when i type them they are not being written with this font but with some other like courrier new(depends on the font fall back rules in the software like quark that I use)</p>
