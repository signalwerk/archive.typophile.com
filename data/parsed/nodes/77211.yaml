    <p>Hi,</p>
    <p>I have transferred some greek fonts from an old Mac OS 9 to a PC. I have the .mbn files and want to convert them to truetype or opentype. I'm trying using transtype or fontlab studio but some glyphs are falling back to other fonts. What can I do?</p>
