  - id: 571516
    user: 62738
    date: 2014-02-16T11:04:00
    date_raw: 16 February 2014 - 11:04am
    votes: 0
    html: "<p>As a secondary utility, they're also great for revealing bugs or incompletions in font libraries and text engines. Once you get to minimal-font levels, it turns out there are actually a lot of things that the OpenType specification allows, but that any number of text engines will reject. For instance: OTS, the sanitizer used in Firefox and Chrome, doesn't like tables that live inside other tables, despite only WOFF forbidding this due to the fact that it packs table data as gzipped blocks. Despite being 100% legal, it will claim the font is corrupted.</p>"
