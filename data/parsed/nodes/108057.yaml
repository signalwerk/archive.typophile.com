    <p>This is my first post here and I'm still wet behind the ears when it comes much of the tech details of creating a font, so please excuse my noobness.</p>
    <p>I've created <a href="http://pixelambacht.nl/2013/font-face-render-check/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">a little check to see if &lt;code&gt;font-face&lt;/code&gt; is supported</a> by a browser. For this I created a TTF file that contains one single glyph, which metrics I check with JavaScript to confirm it actually rendered. I created this font as follows:</p>
    <ol><li>I drew the glyp (a very wide rectangle) and created a one-glyph font with <a href="http://icomoon.io/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">the Icomoon icon font application</a></li>
    <li>I stripped all metadata (or reduced mandatory metadata to a single character) using a free tool called TTFEdit</li>
    </ol><p><a href="https://github.com/RoelN/font-face-render-check/tree/master/dev" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">This results in a TTF file of just 836 bytes.</a> I was wondering if I could bring the file size down any further.</p>
    <p>I tried the following:</p>
    <ol><li>Set the glyph to the space character (as this is a mandatory "glyph" in the Icomoon tool, so it technically contains two glyps together with my custom one). But is seems Windows (or at least Chrome on Windows) doesn't allow for this and shows an empty space instead of the glyph you put in your font</li>
    <li>Convert to WOFF, which results in a file of 660 bytes but is supported by fewer browsers than TTF</li>
    <li>Edit the font in FontForge, some other freeware tools, and online apps in an attempt to strip more data. The resulting file was alwas bigger when saved.</li>
    </ol><p>I looked for (Linux command line) tools that would allow me to strip the space glyph, tables or further (meta)data from the file. The glyph doesn't have to be pretty, so I could sacrifice stuff like kerning or hinting data. But I can't find any tool that allows me to do this.</p>
    <p>Any ideas what else I could try?</p>
