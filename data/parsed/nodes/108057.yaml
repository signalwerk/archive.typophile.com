      <p>I suspect most validators assume you can't have a valid font if it contains overlapping font tables (or encapsulating tables), because with "normal usage" this is true, and it allows them to quickly filter bad/corrupt fonts before continuing with more advanced checks.</p>
      <p>Based on feedback from this discussion I've now further reduced the <a href="http://font file size to 544 bytes" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://font file size to 544 bytes</a>.</p>
