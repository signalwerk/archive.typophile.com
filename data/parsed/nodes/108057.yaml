    html: |-
      <p>I’ve managed to cut 4 bytes from the cmap table down to a total of 16 with <a href="http://github.com/grzegorzrolek/null-ttf/commit/1067c65803cc55bc6a0fdd85935acf984f410676" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this little dirty hack of overlaid entries</a>. Here’s how it goes.</p>
      <p>If the only subtable is a subtable format zero and it has a length of 8 bytes (that’s the minimum on OS X at least), you get the whole cmap table as follows:</p>
      <p><code>0x0000 0x0001 Version, no. of subtables<br>
      0x0000 0x0000 Platform, encoding<br>
      0x0000 0x000C Offset to the subtable<br>
      0x0000 0x0008 Subtable’s format, length<br>
      0x0000 0x0000 Rest of the subtable</code></p>
      <p>Now here’s the trick: you can make the offset entry point onto the eighth byte, that is, back onto the offset entry itself, and reuse it as the subtable’s format and length. In other words, make the subtable overlap the offset entry:</p>
      <p><code>0x0000 0x0001 Version, no. of subtables<br>
      0x0000 0x0000 Platform, encoding<br>
      0x0000 0x0008 Offset / Subtable’s format, length<br>
      0x0000 0x0000 Rest of the subtable</code></p>
      <p>This produces no complains both from Font Book and the Font Tools on OS X. It’s also completely valid as far as the spec is concerned. I’m curious how such backward-pointing offsets behave on other platforms as well if anyone is willing to do some experiments. Hand crafting in hex will be necessary, I suppose, as higher-level font assemblers normally don’t do this.</p>
