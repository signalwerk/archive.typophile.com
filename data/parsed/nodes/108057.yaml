    html: |-
      <p>Yes, there’s a single glyph and it has no contour data. Those few null bytes are basically it; you can’t make the glyf table any shorter as this would make the table simply nonexistent and the font itself invalid. The glyph’s metrics are also set to zero, but only for the purpose of having as much of null bytes in a row as possible.</p>
      <p>It was also built specifically for OS X. This means that even the dedicated browsers, if employed with OpenType Sanitiser or other such mechanism, unfortunately won’t read it. Safari handles fonts directly at the system level, so no issues there.</p>
      <p>From the Windows side of things the lack of an OS/2 table would be the most obvious catch. There’s also no Microsoft’s bits in the cmap table. Not sure about other details, can’t really check without any Windows machine currently in my reach.</p>
