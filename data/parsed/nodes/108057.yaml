      <p>For editing fonts on a code level, I use the <a href="https://github.com/behdad/fonttools/">Python fontTools</a>.</p>
      <p>By stripping out the TrueType instructions, empty name records and Mac cmap, and deleting the gasp table you can save some more size.</p>
      <p>A few bytes can be shaved off by using an <a href="http://www.microsoft.com/typography/otspec/os2ver1.htm">OS/2 table version 1</a> instead of <a href="http://www.microsoft.com/typography/otspec/os2.htm">version 3</a>, which is a little bit shorter.</p>
      <p>The glyphs can be made smaller too, actually as they are now they are invalid. The space should contain no contour, and the last point in the hyphen glyph is a duplicate of the first one.</p>
      <p>By changing all this I got the TTF size down to 572 bytes. I haven’t done any tests if this will break the font, but I think it shouldn’t.</p>
      <p>→ <a href="https://github.com/fsi-jens/font-face-render-check/commit/ac8b7dbd68813f2b4eb7b3fa692adf3061e80bdb">https://github.com/fsi-jens/font-face-render-check/commit/ac8b7dbd68813f...</a></p>
