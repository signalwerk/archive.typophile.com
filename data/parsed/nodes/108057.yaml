      <p>it certainly is for webfont purposes, which is what I needed it for. Browsers currently have no mechanism to tell you whether an @font-face font is genuinely ready for styling text with, so we use these tiny tiny fonts that we can bundle or generate on a page, rather than as download, to style a stretch of text as "desired font, tiny font". As long as the text dimensions match the tiny font's, we know the desired font -despite even possibly already being done downloading- is not available for text styling yet. Amusingly, even if a webfont is available for page styling, if it is also used inside a canvas, it will need to be checked for again because the browser now needs to load it into a different graphics context. Having the tiniest of fonts available there helps.</p>
      <p>And of course once you go down that path, seeing exactly *how* tiny you can legally make a font is a neat added exercise.</p>
