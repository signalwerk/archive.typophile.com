    html: |-
      <p>The detailing of the letters is a bit "large" for the finesse of the spacing, in particular the thickness of the stem to which the ball is attached.</p>
      <p>This is not a display font, it is designed for small recognition of the characters as wholes; that is why the thin strokes of W are heavier than the joints of n, r and d: because those stems are part of the basic shape of the letters, whereas the thinned joints aren't, and are relatively slight because they will "fill in" with ink or visual bleed. However, at display size, the fine stems and serifs no longer have to strive for attention, and should be scaled back.</p>
      <p>I would also consider overlapping some letters --i and n, d and s -- in the manner that the W and tittle have overlapped.</p>
    html_clean: |-
