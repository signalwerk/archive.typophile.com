      <p><cite>"And merging W and i (which you suggested) doesn't?"</cite><br>
      Indeed, to my eye this is less obtrusive, a less-strong binding (and more decorative); quite comparable to what you would see in say an "f_i" ligature. Whereas making serifs run into each other goes much further, in my eye/mind, into the direction of fusing letters together very strongly.* But hey, YMMV. </p>
