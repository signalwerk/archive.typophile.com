    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-5_6302.jpg"></div><p></p>
      <p>@ nina<br>
      You're absolutely right about the problems I encounter when scaling the logotype. I've experimented and if I scale to less than 40mm in print (and 200px on screen), the characters join optically anyway. I'm reluctant to shave any more off the outer serifs as I don't want them to become smaller that the inner ones. If I do start to go down that road, it may have a negative knock-on effect as I'll have to alter all serifs to match the tweak. I don't want to potentially spoil something that is almost perfect for the sake of decimal points' worth of spacing (and my stubbornness!).<br>
      What I've done is simply increase the spacing on "i" and "n" and "d" and "s" to compensate although, looking at the rendered jpeg again, could perhaps push a little more (shown in figures 2 &amp; 3).</p>
      <p>@ John Nolan<br>
      Figure 1 shows the notch modification on the stem of "W" and tittle, which I completely agree with and have carelessly overlooked.</p>
      <p>@Arno Enslin<br>
      It's an interesting concept as I can see the notch where the missing stem used to be could slip nicely into the space between the left hand serifs on the "i".<br>
      But... my eyes simply see a hybrid "X" with some sort of radioactivity induced growth or prosthesis!</p>
