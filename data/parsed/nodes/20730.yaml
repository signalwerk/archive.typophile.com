    date_raw: 18 Jun 2006 — 2:56am
    votes: null
    html: |-
      <p>You're smart. The places you left open, are just those letters which i changed a bit, that is to say i replaced the dotted ascenders into regular ones:</p>
      <p>h - d - b</p>
      <p>Also the x is different in the second sample.</p>
      <p>Eventually, i wanted to create a readable bitmap font, in the smallest grid possible.<br>
      (well, the first sample isn't readable at all without introduction, i know, but it was just a false topic start).</p>
      <p>This font requires a maximal grid of 7 x 5 (h x w), seems quite small to me.</p>
      <p>There is, by principle, no meeting of horizontal and vertical lines, in order to keep the letterforms 'open'. (that's why i changed the shape of x).</p>
      <p>By the way, the first sample is medieval Dutch; the first 2 lines of Van den Vos Reynaerde (Reynaert the Fox).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSC04104_5890.JPG"></div><p></p>
