    html: <p>Omni was Image Club's simplified take on Optima, essentially it lacks the concavities on the vertical and horizontal strokes. For whatever reason, Agfa decided not to include Omni on Fonts.com after they purchased the Image Club library along with the remnants of the EyeWire site from Getty Images. <br> <br>The only place to obtain Omni today is to locate a used copy of Image Club's Letterpress CD (which I happen to have a few of in my software archive). If you're interested in following this up, contact me through my <a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=grant-users">Typophile profile</a>.</p>
    html_clean: <p>Omni was Image Club's simplified take on Optima, essentially it lacks the concavities on the vertical and horizontal strokes. For whatever reason, Agfa decided not to include Omni on Fonts.com after they purchased the Image Club library along with the remnants of the EyeWire site from Getty Images. <br> <br>The only place to obtain Omni today is to locate a used copy of Image Club's Letterpress CD (which I happen to have a few of in my software archive). If you're interested in following this up, contact me through my <a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=grant-users">Typophile profile</a>.</p>
