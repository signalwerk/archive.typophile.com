      <p>I do like Richard Eckersley's designs; I've been meaning to get a copy of <em>The Telephone Book</em>.</p>
      <p>But yes, I think we're talking about similar but distinct things. To follow your train of thought, about creating and resolving tension in a <em>graphic</em> sense — well, it's tricky. And unless you're working with an unusual book and have an author (and publisher) who's willing to play along, your most striking choices will be confined to the front matter.</p>
      <p>But maybe we're working with the wrong metaphors.</p>
      <p>Yes, music has timbre and stresses and fermatas and changing rhythms: but that's an elements of the <em>art</em> of music. Writing has all these things too. The <em>text</em> that you're designing when you typeset a book has all these things, because writing is an art. So what is typography, then? It's sort of a performance of the writing, and maybe it has a similar impact on the receival of the text as an individual musician's (or conductor's?) interpretation of the score. It colors the content, but only that. Obviously, in the world of artist's books (in which I have spent some very enjoyable time), the design <em>is</em> the content, but that's book design as a fine art, not a craft.</p>
      <p>But a conductor can choose to lengthen and emphasize pauses, or to speed by and overlook them; so can typographers. When you choose to start each chapter on a new recto, or to run them all together with only subheads in between, you're making the same kind of choice, right?</p>
      <p>But I'm meandering. To respond more directly to your examples, I probably wouldn't run an image over pages i – iii, because I would usually want the full title to be dramatically different from the half title. I would want to <em>not</em> unify them, for fear that it would weaken the title itself. But I believe that it worked for the Gettysburg book (it's kind of hard to tell online).</p>
      <p>For a different way to build some tension across different spreads, what if you put half a title on the top of page iii and the rest of the title (or the subtitle) on the bottom of page v? With nothing in between? Then you're not only separating the parts of the title with space, but also with time, because you need to turn the page to finish reading. But again, this would only work for an unconventional book. It would need to be part of a "concept," which might carry through in ways like putting chapter titles at the top of rectos and starting the chapter text on the bottom of the following recto. You could even print the first part of the title and the chapter titles on translucent vellum or something so that both pages can be seen at once. But obviously, I'm really reaching here. This would fly in the book arts world, but maybe nowhere else.</p>
      <p>I get the sense that there aren't actually that many typographers on Typophile, but it would be great to hear some other opinions as well — on type, music, theatre, motion, time, tension … This doesn't need to stay a two-person conversation.</p>
