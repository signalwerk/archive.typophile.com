      <p>Anyway, to expand on this, yes, I'm also interested in the similarities between typography and theatrical design. I actually don't know that much about music in a technical sense, but I know that Bringhurst for instance uses many music metaphors to explain typography.</p>
      <p>Music, however, is an art in itself, whereas typography isn't. No one ever argues that music should be a "crystal goblet"; no, the point is to be expressive, unless you're making muzak for elevators.</p>
      <p>And things like sound and lighting design, in a theatrical context, fall somewhere in between: they are crafts more than fine arts, existing only to serve a performance, but they often can — and should — have a very noticeable presence.</p>
      <p>And of course, in a live setting, you're dealing with events that happen over time. Typography also deals with time because it takes people a measurable amount of time to read something, but typography's impact on this operates on a much more subtle level. As I said recently in a different thread, you can do things like put in lots of letterspacing and widely spaced lines in inscriptions to try to force readers to slow down and savor the words. But this is on the level of typographic treatments, not type design itself. Do type designers ever think about rhythm and time? Does visual rhythm operate the same way or serve the same end as musical rhythm?</p>
      <p>In regards to book design, I do find very well designed books to be satisfying in a somewhat visceral way because they create an experience that the reader goes through over time as they turn the pages. There's a fantastic children's book, <em>The Invention of Hugo Cabret</em>, that demonstrates this wonderfully. It is a book that is meant to feel like a silent movie, and it does. Comprised of about 80% illustrations, you feel the motion of the movie as you flip through the pages. And some books can create suspense and release and tension and conclusion just by forcing an important part of the text onto the next page, inherently building in a pause as you turn the page before revealing what it is.</p>
      <p>I designed a book of short stories where one of the stories was about a woman who decided to write out by hand all the numbers from one to a million: ONE TWO THREE FOUR FIVE …</p>
      <p>There's a line that describes her sitting down, picking up a pen, and beginning the task. The line is followed by all the numbers she wrote, spelled out. This creates a visual and narrative hiatus in the storytelling — the whole world freezes as you just stare at the pages of numbers and try to understand the significance of her task.</p>
      <p>When I designed it, I made sure that the sentence about her putting pen to paper fell right at the bottom of a righthand page because I wanted there to be no visual hint of what was to come until you turn the page and suddenly there's this sea of numbers staring at you. In the theatre world, the stage manager would be waiting breathlessly for that pen to touch the paper, to call the sound cue that would start a new piece of underscoring as we delve into the character's obsession with writing down all the numbers.</p>
      <p>That moment in the design of the book felt like a theatrical <a class="freelinking external" href="http://en.wikipedia.org/wiki/Cue_(theatrical)" rel="nofollow">cue</a>.</p>
      <p>In the end, we had to change the trim size on the book and I couldn't make the page break fall right anymore. But while it worked, it was an example of a visual design choice that played with time. You didn't see the monotonous stream of numbers ahead of time; you couldn't prepare yourself; they caught you by surprise when you flipped that page. I regret not finding some way to pull it off in the end. It was like a light cue on a zero count or a piece of music that comes in without warning: a defining moment in the <em>rhythm</em> of the visual design of the book.</p>
