      <p>Yes,</p>
      <p>What you're talking of relies on content, and that's fair enough. My old friend and mentor Richard Eckersley use to do this, see Bill Regier's <cite>Book of the Sphinx</cite>, esp the part title and chapter pages. The link below has a "look inside," not as good as having the whole book, but...</p>
      <p><a href="http://www.amazon.com/Sphinx-Texts-Contexts-Willis-Regier/dp/0803215975#reader_0803215975" title="http://www.amazon.com/Sphinx-Texts-Contexts-Willis-Regier/dp/0803215975#reader_0803215975">http://www.amazon.com/Sphinx-Texts-Contexts-Willis-Regier/dp/0803215975#...</a></p>
      <p>I was speaking more in a graphic sense. Things I've tried include starting the title on the recto and continuing it on the facing verso (not overleaf), or most of the title page type on the recto but a couple key words on the facing verso -- not simply the author name, or complete subtitle or publisher's imprint. The verso does not balance -- hence the tension -- but the spread does.</p>
      <p>But if you don't graphically balance the title page &amp; try to rely on a graphic balance with a later page -- say the dedication page -- the title page just won't work.</p>
      <p>An image with a series page &amp; title page is easy, for a "look inside" see</p>
      <p><a href="http://www.amazon.com/Retreat-Gettysburg-Logistics-Pennsylvania-Campaign/dp/0807872091#reader_0807872091" title="http://www.amazon.com/Retreat-Gettysburg-Logistics-Pennsylvania-Campaign/dp/0807872091#reader_0807872091">http://www.amazon.com/Retreat-Gettysburg-Logistics-Pennsylvania-Campaign...</a> </p>
      <p>( The cover -- jacket -- is <strong> not</strong> my design) The Amazon "look inside" doesn't show the other FM pages, which also have pieces of images from the book on what would normally be blanks. With the right images, this lets you presage the story just a bit, maybe even generate a little tension the text can resolve.</p>
      <p>You can take an image and spread it over three pages, say beginning with the bastard title &amp; ending on the title. If you start on the title, you've got image on the copyright page, where it doesn't belong. But this is a trick, and usually not a good one (aka "cheap trick"). I've had more luck with a second half title facing &amp; followed by a blank -- then you can run the image across the spread &amp; finish overleaf. </p>
      <p>Still sort of a pointless trick unless you've set it up with other images in the front matter. I did use  this in <cite>Retreat from Getysburg</cite>, but it looses it's effectiveness in the "look inside," it needs the open pages of the book. Or perhaps it never worked &amp; I'm deluding myself. </p>
      <p>I find this sort of thing is best done using smaller pieces of images from later in the book, perhaps cropped to have tension, perhaps highly posturized, usually full bleed, etc. etc. No blanks at all in the FM. You can continue the theme if the text allows, but you never have the control you have in the front matter.</p>
      <p>The idea is the reader turns the page to see the complete image, then turns back for the content. There is an element of control here, unlike the <cite>Book of the Sphinx</cite>; there, you have no idea how the reader will progress, at best what's been done is to set up a promise, which is not control.</p>
