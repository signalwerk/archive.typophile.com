      <p>Yes, rhythm. I don't trust trying to control that in a book. The reader is too free to create their own rhythms.</p>
      <p>Here's a short conundrum: In most art, tension and release play a key role. In music, these can occur because the composer, and to a small extent, performer, controls <cite>time</cite> for an audience. This just doesn't happen in a printed piece.  I think both the tension  and release has to occur on the same spread. Think about designing a title page (usually page iii). Try to set up some tension that isn't resolved until page iv or later. I've never been able to get this to work, such a title page is always a disaster.</p>
      <p>However, if you use a two-page spread for the title, you can do it. Much easier than with a single page, too.</p>
      <p>* * *</p>
      <p>I do think that character fit and word spacing can be rhythmical, but not in any terribly important way. If they are poor, they break any hope. If they are good, they properly go unnoticed.</p>
