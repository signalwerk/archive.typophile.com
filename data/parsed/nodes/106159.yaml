      <p>"I think both the tension and release has to occur on the same spread. Think about designing a title page (usually page iii). Try to set up some tension that isn't resolved until page iv or later. I've never been able to get this to work, such a title page is always a disaster."</p>
      <p>Could I ask how specifically you've tried to do this?</p>
      <p>The half-title sets up some tension that's resolved on the title page, but no one looks at it anyway, so it's a little bit pointless. Which doesn't mean it's not worth doing.</p>
      <p>You can set up some tension with a small quote from the book before the title page, so that the reader is intrigued by a sample of the text before the title is revealed — like how the title of a movie is always the last thing the narrator says in the trailer. Though of course the reader knows the title already.</p>
      <p>A second half-title after some prelims is not really a release of tension, but is still a part of the rhythm (like the house lights going down after the curtain speech). It says, "We didn't really start yet. But NOW we're starting." Again, like a movie whose title isn't shown till after the prologue. I wonder if anyone's designed a book where the title literally doesn't appear till after the prelims, or, if fiction, the prologue? Maybe with the right book it could work.</p>
      <p>And then there are experiments like Dave Eggers's novel <em>You Shall Know Our Velocity</em>, where the text of the book starts on the bare binder's board of the front cover and continues uninterrupted over the endpapers and into the body of the book. There are no prelims at all; the first printed word on the cover is the first word of the story. The title appears nowhere. That has to have some effect on how the reader experiences the book's rhythm, regardless of any choices the reader makes.</p>
      <p>But when an author designs his own book, the traditional roles of writer and typographer break down and we come very close to the territory of artist's books — though in this case, the book was a successful novel destined for mainstream distribution, which makes it all the more interesting.</p>
