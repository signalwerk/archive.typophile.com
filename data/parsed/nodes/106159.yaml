    <p>A continuation of an off-topic conversation that started in a different thread:</p>
    <p>CHARLES ESSERTSON:<br>
    A very off-topic note to Joshua -- Just looked st your web site. Wonder if you know my cousin, David (Ellertson)?</p>
    <p>JOSHUA LANGMAN:<br>
    (No, Charles, I don't know David. Maybe I should? Googling the name didn't seem to find the right one, but then I don't know who exactly I should be looking for.)</p>
    <p>CHARLES ELLERTSON:<br>
    (Boy, to really go off-topic in the thread -- David is a set designer at the Met. Believe the official title is: "Resident Assistant Scenic Designer at Metropolitan Opera."</p>
    <p>I noticed on your web site that in addition to type, you were involved with set design. Before becoming involved with type, I was a recording engineer, with some involvement in theater, esp. dance. I've long pondered the relationship between type and music; they seem so disparate, in that with music you control time. Very difficult to control time with graphics. And yet in ways I can't explain, there are similarities. I'm always fascinated to find people involved in both.)</p>
    <p>JOSHUA LANGMAN:<br>
    (Yes, I'm actually a professional lighting and sound designer in the theatre in addition to a graphic designer. I don't know about time in graphics per se, but books certainly have a rhythm to them. As do performances. But I feel like we should take this to a different thread, so I'll start one.)</p>
    <p>… and here we are.</p>
