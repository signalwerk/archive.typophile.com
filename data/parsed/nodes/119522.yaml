      <p>I also recently saw this trailer and simply assumed that the typeface used was <a class="freelinking external" href="http://www.myfonts.com/fonts/sweet/sans/" rel="nofollow">Sweet Sans Heavy</a>. I was wrong.</p>
      <p>The closest I got on this is <a class="freelinking external" href="http://www.fonts.com/font/monotype/sackers-gothic" rel="nofollow">Sackers Gothic Heavy</a>. The apostrophe and quotes don't match at all but the basic lettering is pretty close. Of course, we're looking for something much bolder, here.</p><div class="imageWrap"><img src="http://typophile.com/files/sackers_6400.png"></div><p></p>
