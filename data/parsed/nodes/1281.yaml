    html: "<p> As a swede, growing up with subtitles both on TV and on film, I actually never thought about the type used before. <br> <br>\"What should be expressly forbidden is the use of any typeface ten years ofage or older designed for print: No Univers, no Helvetica,...\" <br> <br>Well, I think it's one of those two used in this country..or ? Any swede out there who knows? <br> <br>I guess it's true sometimes what Emigre says \"it's the reader's familiarity with a face that account for it's legibility\" <br> <br>A serif would never work for me. </p>"
