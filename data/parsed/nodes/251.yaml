    html: <p>Fabio, sorry for the miscommunication. What he had advised is not a more traditional approach with Shard in particular, but to put it aside and experiment with something less unique. I took this to mean "more traditional". Maybe I mispoke. <br> <br>Hrant, I suspect Carter has had his share of drafting experience under his belt, and now works exclusively digitally? I'm just one year out of design school. Realistically, I wonder if I can be expected to work competently digitally. <br> <br>I think I may have jumped to digital too quickly given my knowledge of type, hence the noticeable inconsistencies of my designs. I find the constant reworking on paper more frustrating to deal with than tinkering with glyphs on a computer. Probably I just ignore my mistakes much easier on computer where I cannot on paper?  <br>  <br>Andrew <br> <br></p>
