    html: <p>The 'd' is wonderful, as well as p and q, and I like your round letters generally. I think there is a problem with the junctions in the vertical letters, especially in 'f' and 't' where readability is affected.  <br> <br>Is the problem that the bottom of the left vertical on h m n etc is too fat? That the cut at the joint is too deep?  <br> <br>Is the 'southwest' part of the e and c too fat? <br> <br>I suspect the bottom of the 'l' either straight or like the right bottom of h will look more harmonious. <br> <br>I think that your round letters are so original and good that making the vertical ones more harmonious with them will result in a very useful display face. Even if the vertical are more conventional, but harmonious, the look will still be very original and intriguing. <br> <br>I am a beginner so listen to the pros, but I think you have a gem that is still half in the rough.  </p>
