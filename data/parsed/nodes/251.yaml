    html: <p>That new "conventional" design is only useful for practicing certain skills in type design - otherwise neither the culture nor the market of type design need it. <br> <br>John Langdon is a talented letterer more than a type designer. <br> <br>There is no real requirement of drawing on paper first (although that's how I do it myself). Although it can be argued that drawing software has yet to be made as compatible with the human hand as the pencil (and not the fancy broadnib pen - I'm talking about drafting, not chirography), one should also note that the very best designers (like Carter) draw directly on the computer. So it seems to be a matter of personal affinity as well as getting used to it. <br> <br>hhp <br></p>
