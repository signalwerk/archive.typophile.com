    html: <p>I, also, think that this face has tons of potential. While looking at the l.c., I wonder if you have considered reconciling the ascenders of b, d, h, and k? More specifically, could the ascender of the d (which is a handsome character) work if inverted horizontally to match that of b, h and k? <br>Also, when setting your characters in rather short entries (headlines, etc.), is a "font" absolutely necessary at this time? Could the letters be placed carefully in a vector drawing program and then imported into the final application of choice? Yes, I know, quite a bit of labour... but in the short term, this procedure might replace the absolute necessity of purchasing a font-building program... until you have more coin.</p>
