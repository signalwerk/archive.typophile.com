    html: <p>Hi Andrew, <br> <br>I think you should continue with Shard. See, the lowercases are really nice. I respectfully disagree with your teacher, who asked you to draw more tradicional characters. The lowercases are far from traditional designs, so should be the uppercases. <br> <br>Also, about drawing sketches... to me it's something very particullar the way we design. That's not a rule that you have to draw all characters on paper. I respectfull typefoundry I know, sketches just main letters like "n" and "o" and do the rest directly at Fontographer. <br>One think I'm sure, no matter if we design type with hand or mouse, the most important are our eyes. <br>Fabio</p>
