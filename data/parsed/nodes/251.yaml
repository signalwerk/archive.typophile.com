    html: <p>This is nice. I'm not sure what i'd use it for, but  <br>it's still nice. The only comment I'd make is  <br>that your numerals look too bland compared  <br>to the lc. So much, that it looks to me like a  <br>different font. Add some of the "shard-ness" or  <br>was that "sharditude," to them. <br> <br>On the other hand... <br>I'd say your lc is just right. Yes there are  <br>some characters that have less of the  <br>"shardification," but i tend to feel like less  <br>weirdness is better because it makes a font  <br>more usable/readable (particularly in a lower  <br>case) . Otherwise it becomes really difficult to  <br>read and really narrow in it's application  <br>(klingon spaceship lettering only :-). You've got  <br>it right here IMHO.  <br> <br>If you want, I'd think more of the caps could be  <br>"shardical." <br> <br>Good luck <br>randy <br> <br>Oh... shard is also just the right name.</p>
