    html: "<p>Some of the capitals you've drawn are very good sketches. Especially the C, D E and F. <br>For the G, try to keep it consistent with the C. The same goes for B and R. <br>If the idea behind Shard is to have a pretty good deal of anarchy among letters, you're always in time to add it later. <br>Out of experience I can tell you it's always best to keep an internal consistence among letter parts. Then, you may change many of them and introduce the desired degree of randomness. <br>Maybe after the summer I should post a typeface I started in 1999, full of hydiosincracies and with a wide array of influences. Usually I find uncomfortable to discuss in public, and I prefer single discussion with each one of friend and colleagues, but I got stuck at least two times with that face: it's too varied. <br> <br>But since Barry Deck pretty liked it (his Eunuverse was one of the initial influences) I might find useful any imput. <br>I said this because, in some ways, Shard has problem(s) similar to the ones I find in my own freezed typeface.</p>"
    html_clean: "<p>Some of the capitals you've drawn are very good sketches. Especially the C, D E and F. <br>For the G, try to keep it consistent with the C. The same goes for B and R. <br>If the idea behind Shard is to have a pretty good deal of anarchy among letters, you're always in time to add it later. <br>Out of experience I can tell you it's always best to keep an internal consistence among letter parts. Then, you may change many of them and introduce the desired degree of randomness. <br>Maybe after the summer I should post a typeface I started in 1999, full of hydiosincracies and with a wide array of influences. Usually I find uncomfortable to discuss in public, and I prefer single discussion with each one of friend and colleagues, but I got stuck at least two times with that face: it's too varied. <br> <br>But since Barry Deck pretty liked it (his Eunuverse was one of the initial influences) I might find useful any imput. <br>I said this because, in some ways, Shard has problem(s) similar to the ones I find in my own freezed typeface.</p>"
