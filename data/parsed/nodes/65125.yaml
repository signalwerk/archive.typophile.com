    html: |-
      <p>Marco hit it on the head. Use all small caps, no need to do a regular cap at the beginning. If you can, use open type all small caps for your character styles (in InDesign), that way it will force capitals to be small caps.</p>
      <p>OH! and be sure to letterspace small caps!</p>
