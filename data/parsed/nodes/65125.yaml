    html: |-
      <p>Although I'm not about to claim I'm a massive small caps expert, I have been using it quite a bit lately. If it was me, I wouldn't capitalise NASA at all if you're using small caps already. I'm not a fan of caps used with small in the same word. I think to keep consistent with the rest of your acronyms, I would probably use small caps on the WF/PC as well.</p>
      <p>Can I ask why you're not using small caps for acronyms less than 3 letters?</p>
