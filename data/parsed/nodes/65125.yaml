  html: |-
    <p>Usually I simply let acronyms stand in full caps, but my latest thing is just packed with acronyms (not a surprise when discussing NASA).  Not being familiar with small caps, I just need to know whether to capitalize the first letter.  Is it "nasa" or "Nasa" when in the middle of a sentence?  And since my plan is to make small caps any acronym longer than 3 letters, would "WF/PC" be full caps or small caps?</p>
    <p>Thanks!</p>
  html_clean: |-
    <p>Usually I simply let acronyms stand in full caps, but my latest thing is just packed with acronyms (not a surprise when discussing NASA).  Not being familiar with small caps, I just need to know whether to capitalize the first letter.  Is it "nasa" or "Nasa" when in the middle of a sentence?  And since my plan is to make small caps any acronym longer than 3 letters, would "WF/PC" be full caps or small caps?</p>
    <p>Thanks!</p>
