    votes: null
    html: |-
      <p>Filosofia is a Didone, and its high contrast coupled with<br>
      the vertical axis and the high regularity put it outside<br>
      what I class as a text face. With some ink bleed at small<br>
      sizes it would have a better chance, but its proportions<br>
      are too dainty for small text.</p>
      <p>hhp</p>
