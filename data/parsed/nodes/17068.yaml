    html: |-
      <p>I don't love Eidetic. But I try to put my personal tastes<br>
      aside when it comes to judging if a font is texty or not.</p>
      <p>Tribute: I agree, it's a text face. Note that I put a<br>
      question mark after "still only" - basically because I<br>
      haven't been following Emigre recently. I remember<br>
      when Eidetic came out I thought it was their first real<br>
      text face - so I stand by that. Tribute's "g" was suspect<br>
      to me when I first saw it, but then I saw the issue of<br>
      the magazine where it was used, and realized it's fine.<br>
      So I'm sorry, I forgot to remember Tribute.</p>
      <p>Vendetta: Out of context I agree that it <cite>can</cite> be a<br>
      text face. But it has a "fatal" problem in that respect:<br>
      its central feature -the facetness- can only really click<br>
      with optical masters. Lacking optical masters, that feature<br>
      basically kills it as a well-rounded text font: if you set it<br>
      at more than one size, it becomes more than one face.<br>
      Excoffon knew this, which is why -even with the<br>
      availability of the pantograph- he decided to make<br>
      Mistral's roughness inversely proportional to size.</p>
      <p>The others: no.</p>
      <p>hhp</p>
