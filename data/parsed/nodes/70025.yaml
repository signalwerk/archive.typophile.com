  html: |-
    <p>I am looking to hire someone with custom font creation tools and experience to assist in creating an original, custom font. </p>
    <p>Letterforms (glyphs mostly) are already hand drawn and converted to Adobe Illustrator file. I need someone who can take that file and put it into Fontlab, or other font creation software to create a usable Mac/Windows TT or other format font. These forms are unique, so kerning and spacing of the fonts will be very important. </p>
    <p>Total characters: approx. 60 (with some punctuation, etc.) </p>
    <p>I need someone with font creation experience, Adobe Illustrator, and samples of previous work.<br>
    All rights, copyrights, etc. of all work created will be solely of the client.</p>
    <p>Anyone interested, or know where I could find someone to assist with this project?</p>
    <p>I have included a small sample, with both the upper and lower case variant of each letterform.</p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lettersample_4297.jpg"></div><p></p>
