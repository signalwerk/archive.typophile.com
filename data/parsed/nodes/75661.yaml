    html: <p>A small file file sizes was the genesis for <a href="http://www.emigre.com/EF.php?fid=105" rel="nofollow">Matrix</a> (Licko, Z., 1986). This was done to burden the load on old postscript printers. There’s a nice <a href="http://www.emigre.com/EFfeature.php?di=105" rel="nofollow">history of the typeface</a> on Emigre’s website.</p>
