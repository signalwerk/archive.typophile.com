    html: <p>Tim, yes they have. Early imagesetters had slow RIPs so complex pages, pages with heavy images, or complex fonts took longer to process in the RIP. Same deal with the early laserprinter RIPs. Thus some fonts were designed with this in mind. That meant straight lines were favoured over curves, and the number of segments were kept low. Some RIPs would use curve-flattening – converting the curves short segments of straight lines.</p>
