      <p>Jackson: Trixie is actually a really interesting case! The folks at FontShop offer FF Trixie Web as a Web FontFont, which despite its detail is only about twice the file size of an average font. This is certainly acceptable. The problematic faces I'm talking about are extremely large —&nbsp;1.5mb/variation, etc.</p>
      <p>Thanks for the tip, Bob!</p>
      <p>Claus: That's really interesting, about the old imagesetters. It can sometimes seem like the web/screen hurdles we face are brand new, but I'd guess there are quite a few parallels to previous technologies.</p>
