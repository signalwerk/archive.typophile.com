      <p>Tim&gt; Are there strategies for simplifying overly complex letterforms? </p>
      <p>There are, as functions of the size of use, and the resolution of use, "design compression" software is possible. </p>
      <p>Tim&gt; Have type designers had to consider file size in this way before?</p>
      <p>In modern situations, there is a clear question to ask to the thousands of designs in use today where the average letter would be a larger file than most complete fonts — are you not better served as a graphic?</p>
      <p>I know @FF use is going to have a great pull on people's minds, but I also think it can get kind'a ridiculous.</p>
