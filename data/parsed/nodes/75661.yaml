      <p>Generally, I try to avoid Fontographer's Clean Up Paths feature except to insert extrema: even at its lowest setting, it's a little too aggressive about simplified, especially with round-serif fonts. However, sometimes--as noted above--Clean Up Paths works like a charm. The example below shows the letterforms as I originally drew it (left), with 97 nodes and all-straight-line segments. Using CUP at the maximum (5) setting reduced the number of nodes to about one-third the original, and still maintained the felt-tip-pen-on-napkin effect I was going for.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/boop_boop_3981.png"></div><p></p>
