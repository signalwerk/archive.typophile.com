    <p>Hi all. Here we go again.</p>
    <p>I'm looking for a typeface suggestion for logo/corporate-identity for a program that helps institutions in developing countries improve their ability to train/educate their agronomists and agricultural professionals.</p>
    <p>And if that aint enough, the customer likes Century Gothic. So I'm looking for geometrically-round (optically-corrected) /o/ and single-story /a/, with an option for an /i/ with a circular dot. True small caps would be a big plus.</p>
    <p>Some adjectives: modernizing, innovating, professional education, higher education, agriculture, organic.</p>
    <p>I came up dry, on my own. That's why I'm back to the well! Thanks, in advance, for your insights/suggestions.</p>
