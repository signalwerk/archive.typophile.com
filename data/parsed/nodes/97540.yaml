      <p>I'll have leeway on the single-storey /a/, at the end of the day. But this will almost certainly NOT be used for web-text or print-body-text, in any way/shape/form. So, dump the /a/ requirement. And a square-dot on the /i/ can always be replaced with a circle, if it gets used for a logo.</p>
      <p>I use Relay personally. I like how it looks back on Metro and art deco without being too obvious. I'm a little concerned about using it for this though: this should look forward.</p>
      <p>Century Gothic screams "the West," eh? If so, that's indeed another strike. Agronomists and educators in our Host Countries (i.e., the non-US-countries listed) should see it and say "yes, they help us make our institutions better, I want to use them again." Sensitivity to local culture is, in theory at least, baked into everything this organization does.</p>
