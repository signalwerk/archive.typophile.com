      <p>I looked at H&amp;FJ's whole library. Archer almost made it for me, but I was concerned that the slab serif would have old-timey connotations for some. Whitney really sent me. But ultimately, the subtle beauty of it was going to be lost on the customer. "It just looks like you typed out the word." So, with sadness, I dumped that line of inquiry.</p>
      <p>Your Hess Gothic Round is gorgeous, Nick. If they insist on looking like an industrialized, imperialistic Western Power -- but friendlier! -- I'll steer that way.</p>
      <p>I've tried an Avance treatment, still in draft form. I really like how the letters have a bit of an unfamiliar look to me (a Westerner thru and thru), but the serifs seem to drive the motion forward. Good, subtle symbolism in a face that's not ostentatious, but not "plain." We'll see how it flies.</p>
