      <p>That's a very wide spectrum of countries so I have to concede that it would be better to standardize. But Karl is right, and I'd add that a monocular "a" seriously reduces readability (assuming you'll use the font for a decent amount of text).</p>
      <p>My main question now is: do they want to look like they're a bringing solution from outside (specifically the West) or do they want to appear more sensitive to local cultures? If it's the latter that's one more srtike against something like Century Gothic.</p>
      <p>It's always hard to convince a client that their personal visual taste might be detrimental to the objective at hand, but intelligent clients can handle it.</p>
      <p>hhp</p>
