      <p>Well, since you mentioned Leitura Sans... I must say that I'm finishing two new workhorse typefaces: Glosa and Prelo.</p>
      <p>Glosa is a serif typeface in three styles: Roman with sharp serifs, News with bracketed serifs and Headline, with x-height matching the small caps. Prelo is a sans with the same x-height as Glosa, and 9 weights from Hairline to Black with matching italics.</p>
      <p>If you want to, send me an email and I don't mind to send you digital specimens of both typefaces, since the fonts aren't available and will not be available that soon.</p>
