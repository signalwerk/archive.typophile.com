      <p>I used Farnham Display for headlines and Mercury Text for body text (with Shaker for captions) when I redesigned my former school's newspaper. When reviewing samples of Mercury and Farnham, I found Mercury smoother to read, although part of this may be colored by Yves' excellent review of the Fleischmann revivals (in the Typographer.org archives). I purposely wanted type that readers would notice; my reasoning was that even if future editors did not design pages very well, the terrific, exciting type would carry the layout.</p>
      <p>If you're concerned about Farnham, you should be aware (if you're not already) that Christian Schwartz made a headline version to tone its quirks down a bit (see it <a href="http://www.christianschwartz.com/farnhamhead.shtml">here</a>). And if you're concerned about cost, before I bought Shaker I used Myriad Pro as the complement and it worked quite well. I just wanted more style, even in the captions.</p>
      <p>EDIT: I've also been compiling a list of newspaper types, and I think mine is now pretty exhaustive. You actually mentioned most of my absolute favorites, but you may also want to consider Chronicle from Hoefler &amp; Frere-Jones, Arnhem from OurType, Lexicon from The Enschede Font Foundry, Eudald from Feliciano Type Foundry, Leyden from Psy/Ops, and Houston from Christian Schwartz.</p>
