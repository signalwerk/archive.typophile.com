      <p>It's good to see you thinking deeply about your type choice for the paper. My first piece advice would be to <em>print</em> every font you're considering, preferably the kind of paper that you'll be using. A 100dpi monitor is no way to test newspaper fonts. Most good foundries have a PDF specimen available, and some suppliers (like FontShop) will supply a PDF with a selection of text formatted to your preference for testing.</p>
      <p>&gt; "I doubt that the budget will accomodate most of the fonts I’ve mentioned"</p>
      <p>What is your budget? When you're talking about type families, the prices don't differ very much.</p>
