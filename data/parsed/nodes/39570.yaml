    <p>Hi, </p>
    <p>I'm redesigning a daily newspaper that's moving to a tabloid size. It will still be a serious publication, not tabloid in nature. All the daily headlines will be in there, but there will also be a large lifestyle section. At the same time, the editors are keen on a "fresher" look, especially since the paper is moving to a new format.</p>
    <p>This newspaper has been through 2-3 redesigns already in the last 10 years, and has moved from Century to Franklin Gothic for display. I like a classic typeface as much as the next person, but I think we are ready for a more contemporary, more energetic feel. At the same time, the pages have to be reader-friendly and legible.</p>
    <p>I'm looking for a serif that has a variety of weights, as well as a sans and a slab serif to go with. I absolutely love these serif families with all my heart: Mercury, Farnham, Greta Display, Prensa and Publico. (As you can see, I'm big on x-height). For sans, I lust after Amplitude and Leitura Sans. As for the slab, I would get Freight if the budget allowed, but sadly, it does not.</p>
    <p>So here are the issues.</p>
    <p>1. Are the "spiky" faces like Farnham too fancy and distracting for news? They would be perfect for the lifestyle section but I fear they will be too "much" for news. I have seen Mercury used in a major daily newspaper and got very excited by the letters, but I was looking at it as a designer, not a reader. Should I go back to the drawing board and relook at the classic faces? Or should I seize the opportunity to give the paper a new look? (We will be showing prototypes to focus groups: if they hate it, then well, back to the drawing board)</p>
    <p>2. I doubt that the budget will accomodate most of the fonts I've mentioned. What similar or comparable typefaces would you recommend that will be less expensive? Are there typefaces that have serif, slab and sans in the same family? </p>
    <p>I apologise in advance if these are issues that have been brought up before. Thanks for your time!</p>
