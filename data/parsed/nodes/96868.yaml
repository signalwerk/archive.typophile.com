    html: |-
      <p>As far as I know only the HTF version has that attribute*. If you can't find just the right matching numerals do considering having a set** made to your exact specifications, which is the sort of work I do regularly for clients:<br>
      hpapazian at gmail dot com</p>
      <p>* Which BTW is more than just about serif thickness - it's meant for use at varying point sizes - AKA "optical scaling".</p>
      <p>** Although since H&amp;FJ does not allow modification they would have to work as separate fonts.</p>
      <p>hhp</p>
