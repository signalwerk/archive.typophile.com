    <p>I am doing a project for my class called Communication Design 154b at the desma department at UCLA. I am comparing the photographers, Robert Capa, and Henri Cartier Bresson. I was looking to use two fonts in a book that will include my analysis and comparison of them. Both of the photos I am comparing were taken in the 1930's. The font research is part of the project. I'd be glad to here anyones advice and would be thankful.</p>
    <p>I think this the best one:<br>
    Robert Capa: The Definitive Collection-<br>
    <a href="http://www.amazon.com/Robert-Capa-Definitive-Richard-Whelan/dp/0714844497/ref=pd_bxgy_b_img_b" title="http://www.amazon.com/Robert-Capa-Definitive-Richard-Whelan/dp/0714844497/ref=pd_bxgy_b_img_b">http://www.amazon.com/Robert-Capa-Definitive-Richard-Whelan/dp/071484449...</a><br>
    --<br>
    Henri Cartier-Bresson: Photographer (Hardcover)-<br>
    <a href="http://www.amazon.com/Henri-Cartier-Bresson-Aperture-Masters-Photography/dp/0893817449/ref=pd_sim_b_img_4" title="http://www.amazon.com/Henri-Cartier-Bresson-Aperture-Masters-Photography/dp/0893817449/ref=pd_sim_b_img_4">http://www.amazon.com/Henri-Cartier-Bresson-Aperture-Masters-Photography...</a><br>
    --<br>
    An Inner Silence: The Portraits of Henri Cartier-Bresson (Hardcover)<br>
    <a href="http://www.amazon.com/Inner-Silence-Portraits-Henri-Cartier-Bresson/dp/0500543178/ref=pd_sim_b_img_3" title="http://www.amazon.com/Inner-Silence-Portraits-Henri-Cartier-Bresson/dp/0500543178/ref=pd_sim_b_img_3">http://www.amazon.com/Inner-Silence-Portraits-Henri-Cartier-Bresson/dp/0...</a></p>
    <p>much appreciated.</p>
