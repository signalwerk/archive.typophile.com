      <p>Oh, sorry for the late answer, i've been real busy with other projects.</p>
      <p>So, first lemme tell ya' guys that there wasnt a brief, not even close to one, nor an explanation.. There was some kind of a chit-chat with the client and what i can remember the most was "we need something more professional, but we really like our old logo" after that i just throwed what I thought it would be better than the actual logo (anything can be better than that.. thing imho) anyways, I've talked with the client and he gave more specific (sort of)directions, his company does JAVA applications, so java's icon or similar stuff = good. I tried to convince him to avoid the pixel stuff, and he gave me an opportunity, so, with java's icons in mind I came up with this, i tried to recreate java's logo in a different way, same structure, but different shapes, i like it, but i would love to hear opinions&amp;comments about this before sending it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2hsoftwarelog07_5649.png"></div><p></p>
