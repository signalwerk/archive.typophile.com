      <p>Well, looks like the client didn't like this at all, this is like my 6th attemp, and i have to tell ya guys that im blocked, there isnt any concept behind this, thats why im trying to just use a good typo-application.. oh well, I did a new variation, my client told me that the number 2 was kind of odd, so i changed it to look more like 2, and less flipped 5.. I dont know.</p>
      <p>The client loves his old logo, he suggested me to try something with pixels, but i dont like that idea at all, i have tried a couple of times to do something with that concept but it just doesnt work for me, the ironic thing here is that i am a pixel artist, ha.</p>
      <p>Ill appreciate any comments or suggestions to complete this because im kind of lost here.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2hwtf_5673.png"></div><p></p>
