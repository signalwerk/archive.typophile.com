    <p>Greater Albion Typefounders hopes to release two new faces shortly- Bamberforth and Eldridge.  A brief preview can be found at <a class="freelinking external" href="http://gatf.wordpress.com/" rel="nofollow">http://gatf.wordpress.com/</a>.</p>
    <p>In the meantime, we have new year's special offers on our three most recent releases- Braxia, Tectura and Clunic - at <a class="freelinking external" href="http://www.myfonts.com/foundry/gatf/" rel="nofollow">http://www.myfonts.com/foundry/gatf/</a>.</p>
