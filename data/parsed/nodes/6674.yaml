    html: "<p>Thanks for your comments! <br> <br><b>Paul:</b> <br>&gt; however a crisper version might be nice as well. <br> <br>Actually I started this with sharp forms, but soon realised it wasn't really working. Then I started softening corners and connections, and also tweaking curves, improving the shapes, etc. I don't plan going back to the sharp version now. <br> <br> <br>&gt; i'm assuming you based this off another font or <br>&gt; some lettering? if so what is it? <br> <br>No, it's not directly based on any lettering or font... <br> <br> <br>&gt; it almost looks like a Goudy face. <br> <br>But certainly <a href=\"http://www.myfonts.com/fonts/linotype/goudy-text/\"> Goudy Text</a> is one of my main sources of inspirations for this project. <br>Another great reference for me is Ingo Preuss' <a href=\"http://www.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/\"> Fleischmann Gotisch</a>. <br> <br> <br>&gt; Any caps in the works yet? <br> <br>Just some rough sketches of a few letters. <br>When I complete the A-Z set I'll post them here. <br> <br> <br><b>Raph:</b> <br>&gt; A few nitpicks: the upper left curve on the 'g'  <br>&gt; doesn't look perfectly smooth to me - kind of  <br>&gt; Bezier-ish. <br> <br>Not sure what you meant by 'bezier-ish', but I ended up changing the 'g' anyway (see below, next post). <br> <br> <br>&gt; I'm not a huge fan of the comma-like dot on ij;  <br>&gt; to my eyes, a traditional soft diamond would  <br>&gt; read more nicely. <br> <br>I guess you're right. <br> <br> <br>&gt; The wide letterspacing seems to work in the  <br>&gt; setting above, but I can imagine uses where  <br>&gt; tightening it up a little would be better.  <br> <br>Yes, I already suspected that the spacing could be tightened. <br> <br> <br>&gt; The 'rv' looks almost like a ligature. Any  <br>&gt; plans for more ligs?  <br> <br>No plans for ligatures (except for standard fi and fl ligatures) by now.</p>"
