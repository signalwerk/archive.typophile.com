  - id: 46747
    user: 1353
    date: 2004-10-14T06:59:00
    date_raw: 14 Oct 2004 — 6:59am
    votes: null
    html: <p>Thanks for the great comments, guys. <br> <br>Randy, I will draw some alternates for the 'r' and see how it works. I understand that the current one may look strange in some cases. About the 'z', I concluded that the thick horizontal strokes in it should be thicker than the vertical thick strokes of the other letters, because of the long thin stroke (in 'z'). But I see that I made it too dark, so I'll adjust it. <br>Your comment about the caps is exactly the kind of thing that I needed. I have already started working on new forms. <br> <br>And Hrant, I think that the main problem in making 'Ae' and 'Oe' ligatures (Uc+lc) is that it violates 'notan'. :-) <br> <br>Raph, yes, the asymmetry of the circumflex is intentional. I made it symmetrical at first, then changed it, but forgot to update the caron. You have a very good point about the Eth. And regarding the parethesis and brackets, I now realize that they're even lighter than the math symbols. I'll work on that. <br> <br>Dan, do you know where can I find a good reference about the Dfr-ligatures and Dfr-encodings?</p>
    html_clean: <p>Thanks for the great comments, guys. <br> <br>Randy, I will draw some alternates for the 'r' and see how it works. I understand that the current one may look strange in some cases. About the 'z', I concluded that the thick horizontal strokes in it should be thicker than the vertical thick strokes of the other letters, because of the long thin stroke (in 'z'). But I see that I made it too dark, so I'll adjust it. <br>Your comment about the caps is exactly the kind of thing that I needed. I have already started working on new forms. <br> <br>And Hrant, I think that the main problem in making 'Ae' and 'Oe' ligatures (Uc+lc) is that it violates 'notan'. :-) <br> <br>Raph, yes, the asymmetry of the circumflex is intentional. I made it symmetrical at first, then changed it, but forgot to update the caron. You have a very good point about the Eth. And regarding the parethesis and brackets, I now realize that they're even lighter than the math symbols. I'll work on that. <br> <br>Dan, do you know where can I find a good reference about the Dfr-ligatures and Dfr-encodings?</p>
