    html: "<p>I like it. A lot. Clearly you've put a lot of thought into preserving the gothic letterforms in a much more legible font than usual. The hairline in the 'a' is a thing of beauty in itself. <br> <br>A few nitpicks: the upper left curve on the 'g' doesn't look perfectly smooth to me - kind of Bezier-ish. I'm not a huge fan of the comma-like dot on ij; to my eyes, a traditional soft diamond would read more nicely. The wide letterspacing seems to work in the setting above, but I can imagine uses where tightening it up a little would be better. <br> <br>The 'rv' looks almost like a ligature. Any plans for more ligs? <br> <br>Like paul, I'm definitely looking forward to seeing an uppercase.</p>"
