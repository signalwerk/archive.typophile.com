  - id: 46745
    user: 4406
    date: 2004-10-13T15:35:00
    date_raw: 13 Oct 2004 — 3:35pm
    votes: null
    html: "<p>Fine, fine work. I have only minor nits. <br> <br>1. I think you might have the path direction wrong on the ij dots. They render just fine with Ghostscript, but on OSX Preview they show up as tiny dots. <br> <br>2. left side bearing on f (and its ligs) seems a little loose. <br> <br>3. Asymmetry in circumflex intentional? It doesn't seem to be mirrored in the caron. <br> <br>4. Of the less common characters, I found the OE and capital Thorn particularly delightful. Capital Eth is functional, but I feel the crossbar and vertical line interfere with each other a bit. Most other blackletters seem to solve this by making the crossbar heavier, at least as dark as what you've got on the Z. <br> <br>5. Of the caps, NM don't seem to fit the ornateness of the other glyphs. Consider the solution adopted by Amador: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51175.png\" alt=\"72 point N and M from Amador\"> <br> <br>6. Parens and brackets are <i>really</i> light. I think going with the same slightly blobby style as the math symbols and dashes would be a win. (Kudos on the latter, btw; it's the kind of detail most people wouldn't care about, but makes the difference between a great and an outstanding font). <br> <br>7. i-circumflex and i-umlaut crash into each other in the showing. Probably wouldn't be an issue in real text. <br> <br>8. Capital N-tilde crashes into the vertical stroke, as well. <br> <br>Overall, great work!</p>"
    html_clean: "<p>Fine, fine work. I have only minor nits. <br> <br>1. I think you might have the path direction wrong on the ij dots. They render just fine with Ghostscript, but on OSX Preview they show up as tiny dots. <br> <br>2. left side bearing on f (and its ligs) seems a little loose. <br> <br>3. Asymmetry in circumflex intentional? It doesn't seem to be mirrored in the caron. <br> <br>4. Of the less common characters, I found the OE and capital Thorn particularly delightful. Capital Eth is functional, but I feel the crossbar and vertical line interfere with each other a bit. Most other blackletters seem to solve this by making the crossbar heavier, at least as dark as what you've got on the Z. <br> <br>5. Of the caps, NM don't seem to fit the ornateness of the other glyphs. Consider the solution adopted by Amador: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51175.png\" alt=\"72 point N and M from Amador\"> <br> <br>6. Parens and brackets are <i>really</i> light. I think going with the same slightly blobby style as the math symbols and dashes would be a win. (Kudos on the latter, btw; it's the kind of detail most people wouldn't care about, but makes the difference between a great and an outstanding font). <br> <br>7. i-circumflex and i-umlaut crash into each other in the showing. Probably wouldn't be an issue in real text. <br> <br>8. Capital N-tilde crashes into the vertical stroke, as well. <br> <br>Overall, great work!</p>"
