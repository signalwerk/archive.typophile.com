    html: "<p>Better by the day, Eduardo! <br> <br>About the \"r\", I was thinking \"too droopy\" at first too, but then I became unsure, since I got the feeling that in actual setting it'll blend in - and now I think it does that OK. <br> <br>&gt; Should these glyphs then be Ae and Oe <br> <br>I voiced that idea on Typo-L a while back, at which point Gary Munch said he had the same idea even a year or two before! Not enough people seem to like it though. <br> <br>Here are rough sketches from about 5 years ago, for Paphos: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51159.gif\" alt=\"AeOe\"> <br> <br>hhp</p>"
