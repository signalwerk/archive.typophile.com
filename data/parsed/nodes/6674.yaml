    html: "<p>Hi Eduardo, <br> <br>I just stumbled in here and found this beauty. I noticed the slight bend in the terminals. Are you planning another Linotype triumph? :-) <br> <br>There are two sticking points I noticed straight away. The r. I understand the desire to improve spacing, but the form is suffering for it. Too droopy IMHO. Second is the z. In both versions the horizontal strokes seem about 10% too thick. In the version with the crossbar, the balance is off. Try shortening the top arm, and lengthening the bottom arm. It should sit better. <br> <br>In the caps. First let me say, I'm not very familliar with the traditional forms. However, it seems that your set of caps was drawn by two people. One person did the BCEFGLOQT (this person likes the ogee shape), and another did the HIJKMNPRSUVWY (this person likes the thin verticals). They collaborated on the D, and aliens abducted them and drew the A and X :-) That's my theory! Kidding aside, if you were to set the words Birmingham Daily News, the three caps would be too far divergent for a cohesive masthead IMHO. <br> <br>Of the two ideas, I prefer the second, the one with the thin vertical strokes. I notice that it is mostly the round characters get the ogee shape (FYI what I'm calling an ogee is the s shaped stroke that looks like a dolop of toothpaste). Consider making this stroke more vertical with an added thin, as in the I and J. <br> <br>I also notice two different kinds of finishing treatments to your strokes in the caps. Note the top of the B vs the top of the D. Bottom of F vs Bottom of J. BTW, tail of the Q looks a little wobbly on the bottom. <br> <br>I like the OE cap combination very much. I have a side question about the OE and AE. When in all caps and all lower case settings these make perfect sense. With this type of font, just about the only reason you'd have an all cap setting is in a tatoo! Should these glyphs then be Ae and Oe to lead in a scentence such as: Aesthetics are great! or should it be: </p>"
