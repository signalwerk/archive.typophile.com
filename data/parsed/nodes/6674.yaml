    html: "<p>These are some of the changes I made last night, based on some of the comments here and also based on my own ideas. <br> <br>Modifications: <br>- Shorter ascenders; <br>- Spacing: tightening and adjustments; <br>- Diamond-like dots on 'i' and 'j'; <br>- 'g': removed detail on upper right corner/ more organic shape; <br>- 'd': new shape, more consistent with a blackletter alphabet; <br>- 's': softened transitions; <br>- 'r': removed detail, it's less confusing and better for spacing. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/49032.gif\" alt=\"5\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/49033.gif\" alt=\"6\"></p>"
    html_clean: "<p>These are some of the changes I made last night, based on some of the comments here and also based on my own ideas. <br> <br>Modifications: <br>- Shorter ascenders; <br>- Spacing: tightening and adjustments; <br>- Diamond-like dots on 'i' and 'j'; <br>- 'g': removed detail on upper right corner/ more organic shape; <br>- 'd': new shape, more consistent with a blackletter alphabet; <br>- 's': softened transitions; <br>- 'r': removed detail, it's less confusing and better for spacing. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/49032.gif\" alt=\"5\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/49033.gif\" alt=\"6\"></p>"
