  html: |-
    <p>'Tomate' has been released. It started in 2006 as a brush lettering exercise for a poster and was later used for the ReType identity. In 2008 its author decided to turn it into a super fat typeface suitable for packaging and mass consumption products. The possibilities of ultra heavy forms are explored in this alphabet; trying to solve the design problems that these sort of forms present. 'Tomate' shows influences from the beautiful 'Goudy Heavyface Italic' which is a design Espinoza admires.</p>
    <p><a href="https://web.archive.org/web/20170429225643/http://www.re-type.com/">http://www.re-type.com/</a></p>
    <p><img src="/web/20170429225643im_/http://www.typophile.com/sites/default/files/old-images/specimen-tomate-1_4799.gif"></p>
