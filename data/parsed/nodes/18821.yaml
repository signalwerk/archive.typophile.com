    html: "<p>You are not totally off the mark, but to be fair to those MS engineers, their observation was pretty accurate: they didn't define a standard type family, they just looked at what was out there and what other people were already doing. And what people were doing was inherited from practices determined by earlier digital type and by phototype, e.g. the number of fonts that could be included on a disk for phototype.</p>"
