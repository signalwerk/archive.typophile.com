      <p>Well, as a matter of fact, that tedious font naming issue is not the problem of any font platform or font creator program.<br>
      It is in fact because when Microsoft engineers, back yonder, built their marvellous DOS and Windows Operating Systems, they, in their infinite wisdom, figured that a single font family seems to have Plain, Italic, Bold and Bold Italic variants. That is the maximum of four variants. And that is STILL the reason for two different family naming.<br>
      Or am I totally of the mark here?</p>
