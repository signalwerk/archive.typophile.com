      <p>Hi Caco. I design and print wedding invitations. I design mostly unorthodox shapes/sizes digitally and then have either photopolymer or metal engravings made from film and print them on my Vandercook SP15.</p>
      <p>Gimme your email address and I'll get in contact ... I can send you some examples, maybe those will get your juices flowing.</p>
      <p>And when dealing with a very tactile technique like LP, remember: inks and paper are going to be just as important as what's on the page itself.</p>
      <p>As for type: you can use almost anything you like, although I have a personal fondness (since I like really hard impression) for lower-contrast slabs and transitionals.</p>
