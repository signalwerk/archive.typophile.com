    html: <p>There is a process by which type that you set on a computer or hand-render can be burned on to a photopolymer plate. The plate can then be put on a letterpress and printed in the traditional way . . . so just about anything you can imagine, can be printed (really fine lines can be difficult). I would find a local press and sit down with them. Many people who own a press today are artists themselves and love a challenge.</p>
