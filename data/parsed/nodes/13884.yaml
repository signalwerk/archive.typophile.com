  html: |-
    <p>I’m in the big challenge of designing a wedding invitation for myself. I want to get it done in letterpress, but I don’t want to get caught in the same old traditional invitations. I have been looking over the Internet and all I found is generic designs.<br>
    So I have two questions for you guys:</p>
    <p>1. Can someone help me find a good book or website that contains ideas of what can be done for a wedding invitation or maybe not just wedding but over all contemporary letterpress design?</p>
    <p>2. I don’t have much experience in letterpress jobs, does anyone know what kind of digital font is suitable for letterpress, any suggestions?</p>
