      <p>I have to admit that I might have sounded rude to somebody so type-innocent.</p>
      <p>Looks like Janet’s not gonna come back. I’m sorry about that.<br>
      I might have get carried away, due to the amount of posts asking for quality fonts for free.</p>
      <p>For the record (and just in case Janet isn’t gone):<br>
      ITC Giovanni is a typeface designed by Robert Slimbach, a type designer with a lot of reputation. I actually like it very much. Years of experience and a lot of work are necessary to produce a typeface like ITC Giovanni. That’s why it has its price.</p>
