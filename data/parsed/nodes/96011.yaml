      <p>Shuneet is my wife's name. Hebrew for coral.</p>
      <p>My goal with the Latin and Hebrew is that they should coexist.  As it a Hebrew font with merely a matching Latin, I have the Hebrew dominate.  The Latin is a little lighter and to reduce the visual impact of the verticals, some of them are tilted slightly.</p>
      <p>There is still a lot to do!</p>
      <p>Mike</p>
