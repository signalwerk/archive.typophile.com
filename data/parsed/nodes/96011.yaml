      <p>As you requested, Hrant, here are a couple of parallel texts  with Hebrew and Latin.  Note that I have assumed that the purpose of using the Hebrew Font Shuneet is to present the Hebrew text and that the other text is of less importance. </p>
      <p>In many fonts, such side by side presentation would have the English dominate simply because of the shape of the letters - the English having more verticals and more complex shapes.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hebrew_font_shuneet_v2_feeding_street_cats_684x153_4327.jpg"></div><br>
      The above text is in Shuneet Square with the text from a newspaper article.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hebrew_font_shuneet_v2_tachat_eynecha_724x194_4254.jpg"></div><br>
      The above text is Shuneet Thin. On my web site you can see a PDF of the whole song which was written and composed by the Ethiopian-Israeli singer Malka Ingedashet.<p></p>
      <p>Mike</p>
