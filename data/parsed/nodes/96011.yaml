  html: |-
    <p>I have just released  the Hebrew Font Shuneet Version 2.0<br>
    which now includes a family of different weights. These are Shuneet Light, Shuneet Thin, Shuneet Book, Shuneet Normal, Shuneet Demi and Shuneet Heavy. Each has a matching set of Latin and numeric characters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hebrew_font_shuneet_v2_face_of_the_waters_589x330_5097.jpg"></div><p></p>
    <p>There has been some discussion in this forum as to what 'matching' should mean in this context.  I take it to mean that a block of Hebrew text and a block of English text should look well together.  Also foreign words or sentences embedded in a block of Hebrew text should not detract from the appearance of the Hebrew.</p>
    <p>I have also worked on improving the fonts that were included in Shuneet Version 1.0 with the goal of making achieving greater family harmony.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hebrew_font_shuneet_v2_499x585_4879.jpg"></div><p></p>
    <p>  Take a look at my web site :  <a class="freelinking external" href="http://hebrew-font-shuneet.com/" rel="nofollow">http://hebrew-font-shuneet.com/</a> where there are many examples.</p>
    <p>These fonts are available for free download.</p>
    <p>Mike</p>
