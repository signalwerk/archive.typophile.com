      <p>The matching Latin fonts are in the same files as the Hebrew.  I have designed the Latin so that it looks 'just like Latin font should' but at the same time does not clash with the Hebrew.  For instance I toned down the vertical emphasis that most Latin has. However I avoided any 'faux' Hebrew shapes.<br>
      Mike</p>
