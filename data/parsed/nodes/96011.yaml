      <p>I noticed you changed the licensing on this version of your font and I'm wondering why. </p>
      <p>Previous versions were shared with a CC-BY-SA license. According to your site, the new license you chose to distribute with your font is the more restrictive Creative Commons license (CC-BY-NC-ND). This license puts your fonts in conflict with other free-culture licensed content. </p>
      <p>The <a href="http://en.wikipedia.org/wiki/SIL_Open_Font_License" rel="nofollow">SIL Open Font license</a> or the <a href="http://en.wikipedia.org/wiki/GPL_font_exception" rel="nofollow">GPL-FE</a> would allow your font to be distributed with free/libre licensed content and open-source tools.</p>
    html_clean: |-
