      <p>Hey Randolph. Christopher Burke is an Englishman – so no need for that umlaut ; ) his name is spelt just like yours. Personally I thought Rudolf Wolf's <a href="http://www.linotype.com/1224/memphis-family.html" rel="nofollow">Memphis</a> to be closer to Futura – if only for the single storey 'a', the range of weights and the near-contemporary date and place of its creation.</p>
      <p><em> is that a good thing or a bad thing?</em></p>
      <p>The purists' argument here would be that if you can use Futura (as it's already defined by Demetre as part of the house style) why would you choose Avant Garde instead? In other words, go to the original source, not the derivative.</p>
      <p>According to Bringhurst, not only can Futura work for extended text setting, but one should (6.5.1) Start with a single typographic family and (6.2.3) Use what there is to best advantage.</p>
