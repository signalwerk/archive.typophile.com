      <p>Thanks everyone for your comments. I guess this thread is another great example of why I feel confused quite oftenly when I'm trying to choose the correct typeface to accompany a typeface.  I realize that there isn't alway just one good answer. Such as, when using Futura ALWAYS use Gill Sans as a supporting typeface in all cases. </p>
      <p>I personally feel that using Futura for all of the text begins to look a bit monotone, drab and yet somehow over designed in some way. I also lean towards the sans typefaces as I feel they feel more modern and for the amount of text we use in real world applications from emails, proposals, contracts, etc. At the same time this I realize this is a personal preference and perhaps I am making typographical mistakes by choosing a sans to accompany the Futura family. However, I sometimes wonder if someone saying not to use Helvetica for body copy and someone else saying there is nothing wrong with Helvetica turns into a PC vs Mac debate in a way.</p>
      <p>Any more fuel you can add to the fire is greatly appreciated. In fact any resources anyone has related to typeface pairings would be a great help as well.</p>
      <p>Thanks.<br>
      Demetre</p>
