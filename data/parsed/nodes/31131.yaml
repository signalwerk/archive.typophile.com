      <p>Well, the Helvetica argument could seem a bit fanboyish, with neither side seeming to have a more valid claim, but to my understanding, there's some definite validity to the argument against using it for body text. The reason comes down to stroke contrast. If you look at typical serif text, the line that makes up each character changes in width (for example, look at an "o": the stroke will usually be thinner at the upper-left and lower-right or at the top and bottom). The problem with sans-serifs is that they are often monoline, meaning that they have very little stroke contrast. The lack of stroke contrast, plus the loss of serifs, which some consider to be useful for guiding the eye from letter to letter, is why many would recommend against using sans-serifs for extended text. You may see it a bit yourself if you print out an essay in a sans versus in a serif -- I find that the sans version will tire me out more quickly.</p>
      <p>That said, as James said, Helvetica can be terrific if used by someone who knows what they're doing (see the upcoming Helvetica movie for it's popularity). But when used by most, it runs the risk of seeming like it was just the default choice.</p>
      <p>So, my suggestion: Don't use Helvetica, since it has little in common with Futura to suggest it as a strong companion and it is <em>not</em> on most PCs (they would have to use Arial -- blech!). If you're absolutely committed to using a sans other than Futura (which, I agree with Jackie, would be fine to use) try something more humanistic as Thomas suggested -- it will make for easier extended reading and will contrast with Futura (mechanical geometry vs. humanism). But to say that sans-serifs are simply more modern is not quite right, as there are tons upon tons of serifs that can feel incredibly contemporary. The problem is in finding something common to just about every PC: the only ones that are just about everywhere that I would use are Verdana, Georgia, and Trebuchet. Check them out, especially Georgia.</p>
