    <p>Hello,</p>
    <p>I am trying to find a typeface that can be used to accompany our Futura based logo and wordmark.</p>
    <p>I have constantly read not to use two sans fonts together. However, I would really like to use Helvetica as a companion font for a few different reasons listed below, and I was wondering is this something that is seen as a very bad thing?</p>
    <p>1. Using Helvetica for proposals and correspondance for word docs so that it is easily available on clients computers regardless of PC or Mac.</p>
    <p>2. It seems to look more modern and cleaner than a serif in these applications.</p>
    <p>Any feedback and or alternative suggestions.</p>
    <p>Thanks!<br>
    Demetre</p>
