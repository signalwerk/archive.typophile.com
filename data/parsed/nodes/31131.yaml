    html: |-
      <p>If you are looking for a good companion for Futura, look to the structure of the letters.</p>
      <p>Futura is a highly geometric, Bauhaus-inspired and Art Deco-style letterform.</p>
      <p>Bodoni is a serifed letter with a highly geometric form, and makes a good companion for Futura. I recommend ITC Bodoni, Berthold Bodoni Old Face or URW European Bodoni. Didot or Walbaum (Monotype Walbaum or Storm's Walbaum are the best choices here) are also good choices.</p>
      <p>Another option is to choose a slab-serifed geometric font, such as Memphis, Beton or Rockwell.</p>
      <p>Other fonts from the Bauhaus and Art Deco eras are good options too, such as Erbar's Candida (an underrated and underused font) and Koch's Marathon (also highly underused and quite elegant).</p>
      <p>I hope these suggestions give you some good ideas.</p>
      <p>David Thometz</p>
