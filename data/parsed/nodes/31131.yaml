      <p><cite>So, is there a such thing as a serif-ed Futura? And if not, why?</cite></p>
      <p>There are plenty of geometric slab faces that fit the bill, although Serifa seems closer as it's a mostly geometric design with the same sort of traditional stroke weight tapering that was added to Futura to keep it readable. Putting smaller traditional serifs on a geometric font wouldn't work, they'd look too small and seem out of place.</p>
