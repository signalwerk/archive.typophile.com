      <p>The A in the Hyundai logo isn't as curvaceous (spent two years working on the account for Hyundai's former AOR/Digital). </p>
      <p>Couldn't find a match to this anywhere. Pluto Sans seems to be the best match for the proportions of the LUM (flatten the bottom of the U and square off its interior corners), just need to create the A:<br>
      <a href="http://www.myfonts.com/fonts/hvdfonts/pluto-sans/medium/" title="http://www.myfonts.com/fonts/hvdfonts/pluto-sans/medium/">http://www.myfonts.com/fonts/hvdfonts/pluto-sans/medium/</a></p>
      <p>Options with a squared-off U:<br>
      <a href="http://www.myfonts.com/fonts/jawfonts/walcott-gothic/sunset/" title="http://www.myfonts.com/fonts/jawfonts/walcott-gothic/sunset/">http://www.myfonts.com/fonts/jawfonts/walcott-gothic/sunset/</a><br>
      <a href="http://www.myfonts.com/fonts/jukebox/walcott-gothic/sunset/" title="http://www.myfonts.com/fonts/jukebox/walcott-gothic/sunset/">http://www.myfonts.com/fonts/jukebox/walcott-gothic/sunset/</a></p>
      <p>Options with an asymmetrial A:<br>
      <a href="http://www.myfonts.com/fonts/t26/rusty/bold/" title="http://www.myfonts.com/fonts/t26/rusty/bold/">http://www.myfonts.com/fonts/t26/rusty/bold/</a></p>
