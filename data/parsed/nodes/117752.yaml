    html: |-
      <p>As for the last part about flipping and mirroring _A_ to make other letters, I know that they would end up looking somewhat similar to several letters in the lowercase of Handel Gothic. It's probably not a good idea to flood this alphabet with various other letterforms from Handel Gothic. The Hyundai logo reads well, in my opinion because the Handel Gothic style  _A_, _U_ and _N_ are contrasted with a standard _Y_.<br>
      Might be interesting to make a modified ALUMA into a font.<br>
      Don</p>
