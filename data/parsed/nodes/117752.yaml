    html: |-
      <p>Good digging Kevin. I found no matches for the odd combination of an asymmetrical round top _A_ and squared _U_ with box interior. I knew the curve on the Hyundai _A_ was too boxy, but since I missed the matching _A_ in Rusty, I used Hyundai's _A_ to poke the discussion forward.<br>
      I was hoping someone would find some options for the the capital letters beyond ALUMA. Your collection is indeed helpful for making the decisions that needed to produce these "squaring the circle" letters. One possibility is to use Purista Bold as the default for letter proportions and adjust with ideas from other fonts: including widening the _M_ so that it would be somewhere between the width in Purista and Pluto; using the _A_ in Rusty; and perhaps the S from Pluto.<br>
      Perhaps ALUMA would be less conflicted and have more impact if the _U_ was a flipped _A_ without the crossbar. Which raises the possibility of making _N_ using a mirrored _A_ without the crossbar. And so forth.<br>
      Don</p>
