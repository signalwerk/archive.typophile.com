    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Books</strong><br>
    A wealth of information has been published about the art of type. "The <a href="/wiki/Triumvirate" class="freelinking" rel="nofollow">Triumvirate</a> of Typography"—selected primary works of three authors—offers a foundation for every great typographic library. Included below is an evolving index of notable books written about the art and history of <a href="/wiki/typography" class="freelinking" rel="nofollow">typography</a> and <a href="/wiki/type-design" class="freelinking" rel="nofollow">type-design</a>. </p>
