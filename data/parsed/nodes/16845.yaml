    <p>A typeface family is a set of typefaces released under a common trade name that differ in <a href="/node/14703/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">weight</a>, <a href="/node/add/wiki?edit%5Btitle%5D=width" title="Create node &quot;width&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">width</a>, <a href="/node/add/wiki?edit%5Btitle%5D=inclination" title="Create node &quot;inclination&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">inclination</a>, <a href="/node/32404/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Optical Size</a> and <a href="/node/add/wiki?edit%5Btitle%5D=character%20set" title="Create node &quot;character set&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">character sets</a>, but belong to the same stylistic class because of some common design characteristics such as stroke modulation and treatment of serifs. Helvetica, Times, Palatino, <span class="caps">ITC</span> Stone Sans, <span class="caps">ITC</span> Stone Serif, <span class="caps">ITC</span> Stone Informal and <span class="caps">ITC</span> Stone Humanist are all different&nbsp;families.</p>
