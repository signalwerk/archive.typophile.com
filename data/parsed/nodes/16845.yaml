    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Family</strong></p>
    <p>A typeface family is a set of typefaces released under a common trade name that differ in <a href="/node/14703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">weight</a>, <a href="/node/add/wiki?edit%5Btitle%5D=width" title="Create node &quot;width&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">width</a>, <a href="/node/add/wiki?edit%5Btitle%5D=inclination" title="Create node &quot;inclination&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">inclination</a>, <a href="/node/32404" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optical Size</a> and <a href="/node/add/wiki?edit%5Btitle%5D=character%20set" title="Create node &quot;character set&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">character sets</a>, but belong to the same stylistic class because of some common design characteristics such as stroke modulation and treatment of serifs. Helvetica, Times, Palatino, <span class="caps">ITC</span> Stone Sans, <span class="caps">ITC</span> Stone Serif, <span class="caps">ITC</span> Stone Informal and <span class="caps">ITC</span> Stone Humanist are all different&nbsp;families.</p>
    <p><strong>Discussion:</strong><br><a href="http://www.typophile.com/node/35727">How Related are Members of Type Families?</a><br><a href="http://typophile.com/node/39843">Type Terminology: Systems? Suites? Super&nbsp;Families?</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.fonts.com/AboutFonts/Articles/fyti/TypeFamilies.htm"><span class="caps">FYTI</span>: Type&nbsp;Families</a></p>
