    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Family</strong></p>
    <p>A typeface family is a set of typefaces released under a common trade name that differ in <a href="/wiki/weight" class="freelinking" rel="nofollow">weight</a>, <a href="/wiki/width" class="freelinking" rel="nofollow">width</a>, <a href="/wiki/inclination" class="freelinking" rel="nofollow">inclination</a>, <a href="/wiki/optical%20size" class="freelinking" rel="nofollow">optical size</a> and <a href="/wiki/character%20set" class="freelinking" rel="nofollow">character sets</a>, but belong to the same stylistic class because of some common design characteristics such as stroke modulation and treatment of serifs. Helvetica, Times, Palatino, ITC Stone Sans, ITC Stone Serif, ITC Stone Informal and ITC Stone Humanist are all different families.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://www.typophile.com/node/35727" rel="nofollow">How Related are Members of Type Families?</a><br>
    <a href="http://typophile.com/node/39843" rel="nofollow">Type Terminology: Systems? Suites? Super Families?</a></p>
