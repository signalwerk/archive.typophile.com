    html: <p>I guess indeed <a href="http://www.myfonts.com/fonts/linotype/friz-quadrata/bold-italic/testdrive.html?s=KFC&amp;p=72" target="_blank"> this</a> is about the closest you'll get  <br>using an existing typeface. Logos of big companies  <br>usually are custom designed, Michelle. It prevents  <br>misappropriation and lends the logo its uniqueness. <br> <br>If you stretch the characters a bit and insert the  <br>inline yourself you can approximate the logo.</p>
