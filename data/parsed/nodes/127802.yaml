    <p>So for the longest time I just assumed it was Helvetica Neue Extended (Light/Bold) but then this morning when doing screen grabs for a project noticed the R wasn't right. I contacted another type nerd who immediately ID'd it as Trade Gothic but then realized they didn't have the right weights and the C isn't right.</p>
    <p>So I'm coming to the experts. Any ideas?</p>
