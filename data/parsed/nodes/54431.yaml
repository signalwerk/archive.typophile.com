      <p>For those who do not have volume 2 of the book "Alphabete" by Stiebner/Huber, published in 1990, I scanned the 7 Aurora alphabets contained in this book.</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/aurora1.gif" title="http://www.sanskritweb.net/temporary/aurora1.gif">http://www.sanskritweb.net/temporary/aurora1.gif</a></p>
      <p>see <a href="http://www.sanskritweb.net/temporary/aurora2.gif" title="http://www.sanskritweb.net/temporary/aurora2.gif">http://www.sanskritweb.net/temporary/aurora2.gif</a></p>
      <p>see <a href="http://www.sanskritweb.net/temporary/aurora3.gif" title="http://www.sanskritweb.net/temporary/aurora3.gif">http://www.sanskritweb.net/temporary/aurora3.gif</a></p>
      <p>No additional information is given in the "Alphabete" book about the source of these fonts. My guess is that the fonts depicted were photocomposition fonts, perhaps drawn from some of the old Berthold Staromat photo-typesetting fonts, but Berthold offered twelve Aurora alphabets, not only seven.</p>
