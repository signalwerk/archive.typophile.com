    html: <p>The Berthold AG made PS Type 1 fonts of 7 different Staromat styles (light, bold etc. etc.) of Aurora in the years 1991 and 1992. This was shortly before the bankruptcy. The Hunt ripoff outfit does not sell these due to trademark conflict with the name Aurora which could not be registered by Harvey and Melissa Hunt. The Bitstream outfit made PS fonts of two narrow Aurora styles selling them also under the name "Swiss 939" (see <a href="http://www.sanskritweb.net/forgers/bitstream2.pdf" title="http://www.sanskritweb.net/forgers/bitstream2.pdf">http://www.sanskritweb.net/forgers/bitstream2.pdf</a>, page 2).</p>
