    <p>Hi Everyone,</p>
    <p>I recently discovered on a website what looked a lot like Aurora Grotesk, an old metal face used a lot in the early 20th century. I emailed the webmaster and he directed me to <a href="http://www.urbanfonts.com/fonts/Reservoir_Grunge.htm" rel="nofollow">this link</a>.</p>
    <p>Has someone done a digitisation of Aurora Grotesk before, making this just a rip off, or has someone genuinely made a digital replica of this old metal family?</p>
