      <p>Hello Rafe, Antonio addressed me to this thread.</p>
      <p>As Uli already said, Aurora is a C.E. Weber typeface. I have not been able to determine a precise date yet, the earliest records I have found would state a date around 1912. The narrower weights came later.<br>
      The cut of Aurora Grotesk you are looking for is the boldest version of the extended weights: Aurora-Grotesk Breitfett ("Garnitur V").<br>
      The Aurora family has been generically credited to Johannes Wagner, but the family is described in Weber specimens (I have two) as an "Hauschnitt" (in-house) design. While I'm pretty sure the original version is Weber's, at the time the design was so widespread that almost every German foundry had its version (some with very small differences). It may even be that some of them were produced as authorized versions after the original. In Italy we had Nebiolo's own version, Cairoli, and in Spain they had Grotesca Ideal, produced by the Gans foundry.</p>
      <p>It's quite difficult to find faithful digital versions of the Aurora family outside the two condensed weights mentioned by Uli, which are well done and available from Bitstream in Type1 and Truetype format. Optimo's Dada Grotesk is an interpretation steering towards a less geometric and late 19th century feeling, but not really faithful to the original.<br>
      I don't know about the quality of Annonce; in general Canada type's digital versions do not look accurate to me.</p>
      <p>EDIT: A thank you to Henning Krause, Erik Spiekermann and Elena (from Spain) for the help in my research so far.</p>
