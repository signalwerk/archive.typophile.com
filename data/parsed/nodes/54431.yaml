      <p>I am quoting from the blurb on Myfonts website</p>
      <p>‘<br>
      Annonce is a digitization and expansion of a 1912 Johannes Wagner Foundry classic called Aurora Grotesk, which also circulated later on in metal under the name Annonce.</p>
      <p>Bold, extended and clear as a bell, Annonce stood out as the definite big sign font long before Helvetica and Venus.’</p>
      <p>I am not sure that you can be clear that it was an original design of Johannes Wagner; the same typeface appears under a multiple of names in the Handbuch der Schriftarten, p210, 1926:</p>
      <p>Krupp-Hallo,  Wagner &amp; Schmidt and then Ludwig &amp; Mayer<br>
      Venus-Grotesk, Breite fette, Bauersche Gießerei<br>
      Akzidenz-Grotesk, Breite fette, Haas’sche Schriftgießerei<br>
      Siegfried-Grotesk, D. Stempel<br>
      Koloß, Breite, J. John Söhne, Hamburg<br>
      Klassische Grotesek, Breite fette, J. D. Trennert &amp; Sohn<br>
      Edel-Grotesk, Fette, Ludwig Wagner<br>
      Progreß-Grotesk, C. E. Weber<br>
      Favorit-Grotesk, Otto Weisert</p>
      <p>Now which is the original? It seems to me that the design is quite different from the regular width and weights of Aurora, suggesting that is not part of the original design. More likely that it was added to the family at a later date, and then given the name Aurora to benefit from the ‘brand name’</p>
