    html: |-
      <p>I've been working on Macs using DTP setups since 1984, and I love my current setup. While they've changed the MacBook Pro configuration to the point that I don't think I'd like the newer models being offered, I have a 15" MacBookPro2,2, Intel Duo Core. It only came with 1 gig of RAM, but I doubled that for $30 USD (including shipping). I'm running CS3, use FontExplorer for font management, and among many other things have Parallels running Windows XP.</p>
      <p>It's a very steep learning curve if you haven't used it, but Adobe CS3 is the gold standard for DTP work — InDesign for page layout with Photoshop for image editing and Illustrator for vector tweaking. Well worth the investment in the long run for anyone in the DTP business.</p>
      <p>Also, and very importantly, I rarely use my laptop as a laptop. I use it with a mouse, and external keyboard and monitor, meaning I use it the way a tower is used. From what I've seen this is the current trend since the price and expandability of laptops has gotten much better. It offers the best of both worlds. I use is as a desktop computer, but can unplug it and be free of my desk any time I want.</p>
