  html: <p>I am fairly new to digital printing. I have been getting by with an old tower with Windows XP and Microsoft Word 2003. But I have some money saved up and am looking to buy a laptop, that would possibly come equipped with what Id need to make books. I do not know much about Macs but I would be willing to try it. I am unfamiliar with publishing programs, and was also wondering if there are any computer packages available out there that come equipped with the best software for publishing and design. I can spend about $3000. Thank you all for any help you can give.</p>
