    html: |-
      <p>Books that are less text-heavy (cookery books, travel guides, etc) are often designed with either a "Desktop Publishing" (DTP) layout program, like <a href="http://www.scribus.net" rel="nofollow">Scribus</a> (free, and zero price) or InDesign or Quark (proprietary, and expensive).</p>
      <p>Books that are very text-heavy (novels, academic texts) are also designed with a "typesetting" program, like <a href="http://en.wikibooks.org/wiki/LaTeX" rel="nofollow">LaTeX</a> (or its less book-focused cousin, <a href="http://wiki.contextgarden.net/What_is_ConTeXt" rel="nofollow">ConTeXt</a>.) LaTeX is especially good at typesetting mathematics and other scientific literature.</p>
      <p>The excellent <a href="http://www.withouthotair.com/" rel="nofollow">Without Hot Air</a> book (available to download in full at no cost) was designed by the author with LaTeX and nicely shows off what it can do.</p>
