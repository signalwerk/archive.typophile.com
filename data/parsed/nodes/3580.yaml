  html: <p>The whole thing appears to be a custom job. The A and R are typical modifications, but rare (non-existent, as far as I know) in fonts with these proportions. There are extended sans serif fonts you could start from such as <a href="http://www.myfonts.com/fonts/linotype/blair-itc/medium/testdrive.html?s=flatron%a0lcd&amp;p=48" target="_blank">ITC Blair</a>.</p>
