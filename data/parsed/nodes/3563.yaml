    <p>Hi Guys, <br> <br>New member so this is my first post. <br> <br>I'm looking for a little inspiration for a current project.  <br> <br>Basically I need some visuals for backgrounds on a kiosk. Categories are as follows - Email - Web Search - Chat - Games all the content is online delivered via ADSL.  <br> <br>I have actually designed this service 2 times previously (both had a life of about 1.5 years) and am now doing a complete redevelopment. So finding it a little difficult to reinvent for a third time.  <br> <br>I'm looking for more abstract imagery rather then the typical.  <br> <br>Could be done in photography but moving more towards illustration or maybe even a mix.  <br> <br>Any ideas???</p>
