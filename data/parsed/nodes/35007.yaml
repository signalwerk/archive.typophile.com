    <p>I noticed that the mysterious, hyped-beyond-belief teaser for the JJ Abrams film is now available to view online at the <a class="freelinking external" href="http://www.apple.com/trailers/paramount/11808/" rel="nofollow">Apple Trailers</a> site today.</p>
    <p>I'm curious to know if anyone recognizes the type used in the credits at the end of the teaser. Many thanks in advance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/11808_type_5627.gif"></div><p></p>
    <p>Very nice and clean, whatever it is!</p>
    <p>-Joe</p>
