      <p>Thanks again Hrant. You really <strong>have</strong> saved me a lot of time rummaging through the library there. </p>
      <p>Superscript characters that small and close would be for people who... er, pay attention.</p>
      <p>In that the TDC list is talking about the typefaces that represent salient technical or artistic development, I think the Unger Fraktur referred to is the 1793 design that attempted to match fraktur for Didot's 'antiqua' proportions. </p>
      <p>So the list of examples-to-be-sourced is now looking like</p>
      <p>Lucida, Fette Fraktur, Peter Jessenschrift, ITC Marconi, Apollo, ITC Flora, Digi-Grotesk S.</p>
      <p>TIA for any contributions!</p>
