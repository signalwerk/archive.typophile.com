    <p>Hello everybody</p>
    <p>I'm working on an illustrated reference resource drawn from the <a href="http://www.tdc.org/reviews/typelist.html" rel="nofollow">TDC list of '100 Top Types of all Time?'</a> I am looking for foundry specimen sheets and covers, promotional material, scans, .jpeg files of examples in use of the following sixteen (in no particular order); these are the ones that have fallen through the cracks in my research to date...</p>
    <p>Unger Fraktur, Lucida, Bauer Bodoni, Fette Fraktur, ITC Garamond, OCR-A, Peter Jessenschrift, Bitstream Charter, Adobe Poetica, ITC Marconi, FF Thesis, Apollo, ITC Flora, Digi-Grotesk S, Compacta.</p>
    <p>Accompanying information about image provenances and copyright permissions, as applicable, would be most welcome. Thanks in advance.</p>
