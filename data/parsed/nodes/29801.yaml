      <p>Ben, it turns out that the glorious 1908 Enschede specimen book shows a large complement of fraktur fonts cut by Unger (I'm guessing all of them). I don't know which one the TDC list is about, but I've taken a macro photo of the second-largest size for you. Below is a 25% version - and I'll email you the full one in a minute. BTW, "gros parangon" is about 22pt.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/UngerFraktur-s_4249.jpg"></div><p></p>
      <p>hhp</p>
