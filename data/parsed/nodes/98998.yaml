      <p>That is a nice chart.</p>
      <p>The first post, though, referred to the subject in a way that I found odd - it seemed as though the OP was looking for a chart that would show the kind of typeface design software in use at the time of, say, the Battle of Hastings. "Throughout history" implies that something is shown over the entire span of time since the invention of writing, as opposed to only throughout its own history.</p>
