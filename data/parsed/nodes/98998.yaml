    html: |-
      <p>I have found an essay from the Department of Computer Science at Stanford University, <cite>Letterform Design Systems</cite> by Lynn Ruggles, a PDF of which can be downloaded using the link below (this link will trigger a download depending on your browser):</p>
      <p><a href="ftp://reports.stanford.edu/pub/cstr/reports/cs/tr/83/971/CS-TR-83-971.pdf" title="ftp://reports.stanford.edu/pub/cstr/reports/cs/tr/83/971/CS-TR-83-971.pdf">ftp://reports.stanford.edu/pub/cstr/reports/cs/tr/83/971/CS-TR-83-971.pdf</a></p>
      <p>It includes an overview of the InTeractive Synthesizer of LetterForms (ITSLF) designed by H. W. Mergler and Y. M. Vargo in 1967, the first system in Pedro's infographic. I have only just started reading through this but it actually addresses your initial request very nicely.</p>
