      <p>That is a legal question. I am not a lawyer so I can't comment whether it's legal for you to copy Koren or not. </p>
      <p>However, since you have stated publicly on this forum and verbally on the phone to me about 3.5 years ago, that you would pay the children of Koren for your Crown font, this means that you publictly admit that your Crown font is a copy of the Koren typeface and that somebody in the Koren "family" deserves royalties on the typeface. Your only contention is <em>who</em> should receive the money – Koren's descendants or the company that owns the rights to the font.</p>
      <p>I guess the question is, is the Crown font vaguely influenced by Koren, or is it a copy. I think that most people on this expert forum on type would agree that your image is very much Koren and would be considered a copy.</p>
