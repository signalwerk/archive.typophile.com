      <p>This article says that Koren drew the font before there was a publishing company on his name. </p>
      <p>If so, the font was his own work, and not a work for hire. </p>
      <p>Hence, his children do deserve to receive a royalty according to Jewish law. Yet, according to secular law, it is a public domain desisn. The current code from Masterfont may belong in part to KPJ, but not those derived from earlier drawings.</p>
      <p>Do you agree, Raphael?</p>
