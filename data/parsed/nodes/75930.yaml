      <p>The typeface design, better known as Hadasa (after the Hadasa Printing School where he taught) was named at first, "Queen Esther". This is allusion to Hadasa, for the Talmud tells us that "Esther's real name is Hadasa". When I worked closely with John Hudson (who designed the nikkud and taam), "Queen Esther" was renamed after its great creator, Henri Friedlaender zal.</p>
      <p>Mr. Friedlander told me in 1988 that my version was closest to the original drawings. The is likely due to the fact that I did not use photo-typesetting specimens. Rather, I used old magazines and newspapers as specimens. I created it by eye only, and a crude grid system. In those days, I didn't have a scanner.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Onk_Ber1_bold_5299.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ruth_henri_v5_4135.jpg"></div><p></p>
