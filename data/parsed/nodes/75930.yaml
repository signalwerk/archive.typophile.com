      worked steadily as a designer for leading American publishers<br>
      including Alfred A. Knopf; Atlantic, Little Brown; Ballantine<br>
      Books; Fleming H. Revell; Harper &amp; Row; Harry Abrams;<br>
      Houghton Mifflin Company; J.B. Lippincott Company; McGraw-<br>
      Hill; Pocket Books; Random House; Thomas Y. Crowell; and<br>
      Viking Press, among others. In a short span, he designed book<br>
      jackets or covers for more than 200 books.</p>
      <p>Ismar David remained a free-lance artist throughout his career.<br>
      In addition to steady work in cover design, calligraphy, and<br>
      lettering, Ismar David earned commissions for book illustration<br>
      and developed the style of illustration for which he is best<br>
      remembered—a style characterized by striking patterns of<br>
      lines. This distinctive linear style was particularly well suited<br>
      for the Limited Edition Club’s 1971 publication of Pascal’s Les<br>
      Pensées, for which David created a dozen full-page, hypnotic<br>
      color-illustrations—pre-separated in the tradition of printmaking—<br>
      as well as ornamental tailpieces, and text frames. As<br>
      would become his custom, Ismar’s conceptions in vivid<br>
      oranges, greens, purples, blues, and golds were meant to<br>
      accompany the thoughts of the author, not to illustrate them literally.His 58 illustrations for the Union of American Hebrew<br>
      Congregation’s 1973 bilingual edition of The Psalms followed<br>
      the same non-literal approach. For this project, which David<br>
      considered his most personal work, he combined his ideas<br>
      about illustration and type and book design, and his efforts<br>
      were recognized by The American Institute of Graphic Arts<br>
      (AIGA) with a 1973 “Fifty Books of the Year”distinction. Both<br>
      Les Pensées and The Psalms proved to be very popular among<br>
      collectors, and they stand as two of his best efforts in book<br>
      illustration.</p>
      <p>Though he never lost interest in graphics, much of David’s<br>
      energy in the latter part of his career was devoted to architectural<br>
      design and decoration. Perhaps his most important work<br>
      in this field was produced during a thirty-year association with<br>
      Pinelawn Memorial Park in Farmingdale, NY. Beginning in<br>
      1965, he planned the layout of the park, including fountains and<br>
      other features; he also designed mausoleums and other<br>
      building complexes, and their interiors. He also lettered<br>
      numerous inscriptions for wall decorations and architectural<br>
      features in the park. </p>
      <p>Proof of Ismar David’s uninterrupted<br>
      connection with graphics came in 1991, when in collaboration<br>
      with calligrapher and partner Helen Brandshaft, he designed<br>
      and illustrated a bilingual version of The Book of Jonah,<br>
      published by the Chiswick Press in a limited edition.<br>
      Teaching was another constant element in Ismar David’s career.<br>
      In addition to instructing at the Cooper Union and Pratt<br>
      Institute, he gave lectures and conducted workshops on Latin<br>
      and Hebrew calligraphy over the years. Eventually he distilled his well-tested teaching materials and summarized his views on the historical, aesthetic, and technical aspects of the Latin alphabet into Our Calligraphic Heritage: The Geyer Studio Writing Book. The three-part work of text, alphabet folders, and<br>
      compositions, encased in a box designed to function as an<br>
      easel, was published in a limited edition in 1979 by the Geyer<br>
      Studio—a professional calligraphy studio for whom David<br>
      worked as a contractor from the late 1960’s through the early<br>
      1980’s. Ismar produced the Hebrew counterpart to Our<br>
      Calligraphic Heritage with the 1990 publication of The Hebrew<br>
      Letter: Calligraphic Variations. This instructional work<br>
      includes a text and alphabet charts, and is a writing book in the<br>
      tradition of European writing books. In both works, David<br>
      fuses the rich historical background of the calligraphic arts<br>
      with practical and aesthetic aspects of the art of writing in the<br>
      twentieth century.</p>
      <p>In the early 1990s, Ismar David continued to take on select<br>
      commissions for graphic design; however, he also expressed his<br>
      personal interest in three-dimensional form with the creation<br>
      of such objects as a folding baby cradle and a paper Elijah’s cup<br>
      and folding seder plate. Before he died on February 26, 1996, in<br>
      New York City, Ismar David produced his 1996 greeting card—<br>
      the last in a forty-odd-year series that traces the evolution of<br>
      his lettering and illustration styles, and the constant influence<br>
      of biblical themes.</p>
