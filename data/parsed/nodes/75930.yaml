      <p>Judah L. Magnes, President of The Hebrew University of Jerusalem asked Eliyahu Koren, then Korngold, to create a new font for an entirely new edition of the Hebrew Bible that he sought to publish under the University's auspices during World War II. The Bible was to be the first Bible designed, edited, printed, and bound by Jews in nearly 500 years. A design competition was held, and Korngold's font won.<br>
      The preliminary version of the font that grew out of the competition was used in an edition of the Book of Jonah issued in 1946 by the publishing house of The Hebrew University (later Magnes Press). The font was not cast for this modest publication, but rather drawn by Korngold and reproduced photographically. The font was based on the Moshe Ben-Asher Codex of the Prophets manuscript, belonging to the Karaite community in Cairo, the earliest Medieval manuscript with a colophon, written in 895 CE in Tiberius.</p>
