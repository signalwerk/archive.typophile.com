      <p>One book, with a dark blue cover, was published by a now defunct publishing house, "Machon L'Ohalei Shem" in the nineties. The other book is much older, with a gold cover. I think its called: "Zchus hayotzim".</p>
      <p>Very few rabbis are expert is this topic, which is like why you think that it does not exist. Fewer can rule on this matter.</p>
      <p>The famed Tzemach Tzedek rule of this matter over two hundred years ago. No one since then has refuted his views about "Zchus hayotzim". He delineates 5 factors that can earn worldide exclusivity forever.</p>
      <p>This responsa is published in Hebrew in two other books, "Chidushei Tzemack Tzedek Al Hashas", with commentaries, pp. 78-??, by "Machon L'Ohalei Shem", 1992, and "Chidushei Tzemack Tzedek Al Hashas" by Kehos (in print).</p>
