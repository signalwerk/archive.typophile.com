      <p>Bill,</p>
      <p>This book is from about 18 years ago. It's out of print, and never was scanned and placed online for eternity.</p>
      <p>Years ago, I bought it when it fist came out. Years later I bought it again. I've moved a few times since, and do not find my copy.</p>
      <p>Ari Davidow sent me his copy to borrow. I got it today. I intend to create a dozen designs of his, with bold versions, nikkud and taam too.</p>
      <p>Everyone pales by comparison. Ismar David zal was the greater known Hebrew type designer.</p>
