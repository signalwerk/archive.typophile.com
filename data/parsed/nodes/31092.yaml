      <p>is it your font or someone else's? FontLab can open it and you can view the values in the 'font info' </p>
      <p>if it is a TrueType based font you could run it through the Microsoft Font Validator and it will kick up a bunch of errors that probably will relate to the heights in the 'OS/2' table. </p>
      <p>If the font is CFF based OTF then it's not going to work in the Validator.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/truetype_3471.jpg"></div><p></p>
