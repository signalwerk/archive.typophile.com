      <p>"Most applications" is not very specific or helpful. Please name specific applications it does or does not occur in! We need to know if these are GDI applications, WPF applications, or CoolType applications....</p>
      <p>It probably is a usWinAscent problem. Or more accurately, an application problem, as many apps incorrectly use usWinAscent for clipping, in violation of the specifications since day 1. However, since this is a well-known application defect, font makers try to work around it. But without more info, we can't say for sure.</p>
      <p>Cheers,</p>
      <p>T</p>
