    html: |-
      <p>Generally clipping is caused by an incorrect WinAscent value. The WinAscent and WinDescent are the highest and lowest values in the WinANSI character set (original spec definition).  </p>
      <p>1. is the font PostScript based outlines output as an .otf file?<br>
      2. What application are you using?</p>
      <p>I doubt Vista is using a different method of height calculation since the WinDesent and WinAscent and many other metric information goes back to the original bitmap formats in most operating systems and these usually are kept so they don't break existing 'things'.</p>
