    html: |-
      <p>The copyright of a Booker font says:  "1995 Solotech Design. All Rights Reserved."<br>
      According to Luc Devroye info on Solotech:<br>
      <a href="http://luc.devroye.org/fonts-29677.html" title="http://luc.devroye.org/fonts-29677.html">http://luc.devroye.org/fonts-29677.html</a></p>
      <blockquote><p>"[...] some of their fonts (if not all) are exact unaltered copies of other people's fonts."</p></blockquote>
      <p>Therefore I don't think the original font name was "Booker".</p>
      <p>This is one of these fonts copied/sold by many forgery companies under different names and although I doubt any of them is the original design, I'll list them here to help discovering the original:<br>
      <strong>Booker</strong> -  1995 Solotech Design. All Rights Reserved.<br>
      <strong>Dishrow</strong> - Converted to PC format for distribution by Reaso<br>
      <strong>Eliza</strong> - Generated by Fontographer 3.5<br>
      <strong>Enterprise</strong> - (C) 1992-1993. ATTITUDE, INC. All Rights Reserved.<br>
      <strong>Marathon 3 / 4 / 7 / 8</strong> - Cambridge Fontworks<br>
      <strong>Rosehill</strong> - (no copyright info)<br>
      <strong>RUGGELLfont</strong> - Copyright Arcmedia.com Inc.<br>
      <strong>TavisSSi</strong> - Copyright 1995 Southern Software, Inc., All Rights Reserved<br>
      <strong>TavisSSK</strong> - Copyright 1995 Southern Software, Inc.,<br>
      <strong>Upright</strong> - Generated by Metamorphosis Professional 2.03<br>
      <strong>Upsilon</strong> - Fantazia Fonts and Sounds<br>
      <strong>Upsilon</strong> - Converted to PC format for distribution by Reasonable Solutions, Inc.<br>
      <strong>Upsilon</strong> - Copyright 1991, Atech Software, Carlsbad CA</p>
