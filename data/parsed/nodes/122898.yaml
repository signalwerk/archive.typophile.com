    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2015-01-28 at 3_5486.42.49 PM.png"></div><p></p>
    <p>I inherited this font that I believe is  called "Booker" but I cant find any license information  for it on the web — does anyone know where it might have come from/who the designer might be? </p>
    <p>If nothing else, I would love to find a similar font that is available for commercial use.</p>
