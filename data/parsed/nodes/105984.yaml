    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontid_3909.jpg"></div><p></p>
    <p>Hi there! I've been looking everywhere for the script font used in this image, an ad for Los Santos in GTAV. It's just perfect. I've tried using font identification websites such as whatthefont but to no avail.. I've found similar fonts, such as wisdomscript, pacifico, missionscript, recklame, and lobster, but nothing close enough to the one used in this image.</p>
    <p>I'm hoping its not a custom font created by rockstar because I love it already and want to use it :P</p>
    <p>If anyone can help me out that'd be great!<br>
    Thanks!</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Sign Painter HouseScript by House Industries        </div>
            </div>
