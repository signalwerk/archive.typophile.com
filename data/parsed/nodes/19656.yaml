  html: <p>I'm wondering if there's a simple method for plotting equations into a drawing program (doesn't matter which), and then producing glyphs from that. For instance, I like the "<a href="http://www.mathematische-basteleien.de/eggcurves.htm" target="_blank" rel="nofollow">egg curve</a>," but I can't see an easy way to move from the equations to the glyphs. I don't exactly want to learn Postscript.</p>
  html_clean: <p>I'm wondering if there's a simple method for plotting equations into a drawing program (doesn't matter which), and then producing glyphs from that. For instance, I like the "<a href="http://www.mathematische-basteleien.de/eggcurves.htm" target="_blank" rel="nofollow" class="link-external">egg curve</a>," but I can't see an easy way to move from the equations to the glyphs. I don't exactly want to learn Postscript.</p>
