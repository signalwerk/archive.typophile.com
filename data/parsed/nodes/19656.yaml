    html: <p>That's just what I had in mind.  I'm actually very much interested in using mathematical formulae for encoding design intentions instead of endless twiddling with control points.  If you're familiar with Knuth's Computer Modern fonts, you'll be aware that they are often criticized for - among other things - being to formulaic; and rightly so. My point is that this is more the fault of the authors attitude and the temptation of the tools than the idea itself, but the temptation seems very real!</p>
