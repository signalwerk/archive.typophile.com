      <p>Thanks, Tim. I'm interested mainly in using the equations as a starting point for creating shapes. I've got nothing against free drawing, messing with Bezier curves, etc.</p>
      <p>I actually got interested in the idea of using equations when I started pencil-sketching some glyphs based on my own print handwriting-- the same egg-like shape kept occurring over and over, and I thought there oughta be a way to define it precisely and then reproduce as starting point.</p>
