    html: |-
      <p>You can use gnuplot, which is available for free on most operating systems, to output EPS graphics from nearly any well-behaved 2D or 3D function.  On newer versions of OS X, there's a "Grapher" application that can also export to EPS or PDF.  Most interactive Font editing programs should be able to somehow deal with those formats.</p>
      <p>But be careful, mathematical functions seldom make for good glyphs, and in my opinion their overuse has given mathematical or parametric font creation tools such as METAFONT an undeserved bad reputation.</p>
