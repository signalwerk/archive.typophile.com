      <p>It's a strange advice for a person who's going to pass his honeymoon in Venice, but...</p>
      <p>I live in Mestre and I recommend you to visit the Biblioteca Nazionale Marciana (Marciana Library), the most important library in Venice and one of the most important in Italy (not only the museum: go into the library). There you can find a lot of incunabula and books of the sixteenth century (see OPAC at <a href="http://polovea.sebina.it/SebinaOpac/Opac" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://polovea.sebina.it/SebinaOpac/Opac</a>). In Marciana there's the complete aldine collection (for example, there are two copies of DE AETNA by Pietro Bembo [IMPRESSUM VENETIIS IN AEDIBUS ALDI ROMANI MENSE FEBRVARIO ANNO .M.VD.]; the most beautiful copy is "ALDINE 380": it's a magic to hold it in your hands [but less then to hold your future wife in your arms]). Warning: to read requested book(s) you have to wait half an hour, at least; so, if you are going to take a visit, you must have clear ideas of what you want to see before entering. You can find information about the rules of the library at <a href="http://marciana.venezia.sbn.it/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://marciana.venezia.sbn.it/</a> (in italian).</p>
      <p>And if you have time, you can visit "Tipoteca Italiana Fondazione": a typeface and printing museum in Cornuda (not so far from Venice; nevertheless there's some difficult to reach it by train). It's very very interesting (information at <a href="http://www.tipoteca.it/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.tipoteca.it/</a>) and it's near to Asolo (remember Bembo) and not so far from the Dolomites (better than a museum for the honeymoon; and in november is not so cold yet).</p>
      <p>Good luck.</p>
    html_clean: |-
