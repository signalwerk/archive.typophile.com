    <p>Hi, this is the first time I've posted on this site. I will admit, I am not very experienced in the area of type. I am currently going to school for Visual Communications in Oregon, and am taking my second course on typography. I am, however, suprised how much more interested I am in type than I thought I would be!</p>
    <p>Our first assignment for this course is to design an upper-case alphabet based on the letters "Dakota". This was a logo for a local store that our instructor got permission to use for this assignment. </p>
    <p>I decided that all the letters should be based on strict geometric shapes, with no compound shapes. And this is what I came up with.</p>
    <p>The top line is what we were given to work with, followed by the alphabet. The bottom two lines are two sample words to see how they start working together.</p>
    <p>I guess I am just looking for some feedback, comments or criticism. </p>
    <p>Thanks!<br>
    Dani</p>
