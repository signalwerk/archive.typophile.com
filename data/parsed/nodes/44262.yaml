      <p>Nice work overall. Here are a few thoughts:</p>
      <p>I understand you were locked into the "T" from the "DAKOTA" logo, but "T" and "Z" don't follow the rules established by "E" and "F", and instead look shortened since the crossbars are set lower. While you are locked into this with the "T", you might find a different solution with "Z".</p>
      <p>"B", I think, needs a vertical bar on the left as in "E", "F", "H", "K", "L", "M", "N" and "W".</p>
      <p>I very much like "R", but there's a bit of tension where the circle and the left bar almost touch. More space here (and less space for the triangular tail) could balance it better. This same tension exists in "G", "J", "P", "Q", "U" and "Y".</p>
      <p>In the tail of the "Q", the base of the triangle should sit flushly and horizontally on the baseline rather than being tilted.</p>
      <p>The "G" reads almost more like a "6". Would a square or triangle be a better solution than the smaller half-circle?</p>
      <p>Conversely, would perhaps a quarter- or half-circle make a better tail for the "J"?</p>
      <p>David Thometz</p>
