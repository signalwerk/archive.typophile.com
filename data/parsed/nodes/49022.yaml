    <p>Hello, this is my first post.</p>
    <p>I want to go to a short design course in the Netherlands [short: one-two months, if it's more I don't care] , doesn't have to be about typography, but printed media in general.</p>
    <p>After looking for this kind of short courses for several weeks, I feel a little lost. Just couldn't find anything, just master studies.</p>
    <p>I have looked at Utrecht school of arts, KABK, ArtEZ, etc. Im looking for something not too formal, want to experiment. There's a school in Barcelona <a href="http://www.tenemosunplan.com" title="www.tenemosunplan.com">www.tenemosunplan.com</a> . I'm looking for something like that -lots of practice- </p>
    <p>So the question is: Do you know any academy, school, university... offering this kind of courses? [can be anywhere in the Netherlands, small or big institutions, whatever! :) ]</p>
    <p>Thank you all in advance.</p>
