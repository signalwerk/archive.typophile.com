    html: <p>Believe it or not, this is hand calligraphy. Every letter is slightly different and they are all flow together naturally. Of course there are some fonts that attempt to emulate this, of which <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/bickham_script_pro_complete_pack/?affid=99346" rel="nofollow">Bickham Script</a> is probably the best in this style.</p>
