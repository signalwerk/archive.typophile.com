  html: |-
    <p>I got already designed type faces in Illustrator but I need now to implement them in FontLab. What I need is to not screw something on the beginning! Like dimensions of my letters in Illustrator and dimensions of my letters implemented in FontLab like font height, width, ascender, descender etc. Need help or some good tutorial or guide for professionals not amateurs!!! cause I wanna do my first font well.</p>
    <p>My font on which I currently working is non serif and modern looking. I need some spacing/kerning advices too. I need to make "my beauty" right! Help me!</p>
