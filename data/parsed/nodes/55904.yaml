    html: |-
      <p>Starting with the most important: vertical metrics (it is the "worst" to correct later if you get it wrong ;)</p>
      <p>If you work with a UPM of 1000, try to import your capital letters around 700 in height in FontLab. This will make them pretty "standard" in height compared to other fonts.</p>
      <p>As for spacing and kerning: try things out, test it, look at other (similar) fonts and learn from them ;)</p>
      <p>There are some very good articles in the TypoWiki - look especially in the "How-To" section...</p>
      <p>Good luck! :)</p>
