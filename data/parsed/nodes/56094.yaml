      <p>If it's a one-off situation, then yes, some combination of grinding and a kerning saw was probably used.</p>
      <p>But we should realize that they would have been used more broadly than just fitting a few extenders. It looks to me like pretty much every line is affected and would require some careful fitting together, whether the extenders are in proximity or not.</p>
      <p>Looks like it would have been quite a little puzzle to fit together.</p>
