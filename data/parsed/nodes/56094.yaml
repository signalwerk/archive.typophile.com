      <p>This type is by Jacobus van de Velde, not Jan. Sorry, I should have been more specific in the original post. Harry Carter notes that ‘Jacobus van de Velde’ is recorded as a bookseller in Amsterdam at the time of his marriage in 1682 and of his death in 1709’. An undated type specimen bearing his name in the Enschedé collection is thought to have been produced around 1699.</p>
      <p>Here's what the Enschedé/Carter <em>Typefoundries in the Netherlands</em> (the source of this image, fig.110 p.140) has to say about the provenance of this type:</p>
      <p>‘The matrices owned by Alberts &amp; Uytwerf also passed eventually to the Brothers Ploos van Amstel. Among the types we acquired from them we still have one of the types offered for sale by Van de Velde. It is our <em>English-bodied Roman No.28</em>. In our collection there is also one of the types shown in the earliest specimen of Alberts &amp; Uytwerf, the [<em>Large</em>] <em>Two-line Small Pica Roman No.29</em>...’</p>
      <p>This No.29 is very similar in style to the van de Velde roman.</p>
      <p>The image above is from an Enschedé re-setting of the No.28 type as it appeared in van de Velde's original specimen. There are other specimens of the type in the Enschedé/Carter book, alongside No.29, but as reported in the other thread, this is a difficult book to scan or photograph on account of its size.</p>
    html_clean: |-
