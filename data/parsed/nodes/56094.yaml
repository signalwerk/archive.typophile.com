    html: <p>Yes, the c does look busted. It's a sad fact that we just cannot do something like this with digital type, it'd look retarded rather than strangely intriguing, as I think this does. But I think the s is even weirder, it looks as if it's from another typeface, its weight, width and angle is all wrong. The g also look weird in similar ways, from what we can see of it. It might be slightly corrupted by some lens distortion, though. And what was old Jacobus thinking when he cut that d? Another highly interesting thing is the differing obliqueness of several characters. And look at that enormous overshoot on the o and e, and that r stretching its nose toward the heavens. This typeface is even weirder than Fleischmann's weird stuff, in a more random way. Gee, I dig Baroque weirdness!</p>
