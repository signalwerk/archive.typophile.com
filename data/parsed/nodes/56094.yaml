      <p><em>How is it that the ascenders and descenders overlap (see 3rd and 4th lines)?</em></p>
      <p>Very carefully, I would guess. :)</p>
      <p>I don't think it is a feature of the type, but of this specific setting. On the same page in the Enschedé/Carter book, there is another showing of this type, a poem with much more generous linespacing (and featuring a long-s_t ligature that doesn't appear in the specimen setting).</p>
      <p>The images above are from a painstaking re-setting of the type as it was shown in the original JvdV specimen, and my guess is that in order to fit as much type as possible onto the specimen this type was shown with negative leading. Since this was a one-off showing, my guess is that the blank tops of the sorts in the lower line were ground down to make room for the descenders. That would be easier than casting large on the body and vertically kerning descenders onto the face of the type below.</p>
    html_clean: |-
