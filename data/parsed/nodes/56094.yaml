    <p>I'm absolutely in love with this type, scanned and uploaded by John Hudson in <a class="freelinking external" href="https://web.archive.org/web/20150123082856/http://typophile.com/node/8800" rel="nofollow">this old post</a>: </p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123082856im_/http://typophile.com/files/van_den_Velde_4053.jpg"></div><p></p>
    <p>So I'm wondering if anyone has some information about this lovely typeface and its author. I can't find much on the Internet, I guess van den Velde is Jan van den Velde (1568--1623), calligrapher and author of "Spieghel der Schrijfkonste", but that's about everything. This little scan has been very influental in the drawing of my <a class="freelinking external" href="https://web.archive.org/web/20150123082856/http://typophile.com/node/56025" rel="nofollow">first oldstyle-experiment</a>, so I've become very curious about this wonderfully idiosyncratic type.</p>
