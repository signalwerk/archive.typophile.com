      <p>It certainly wouldn't have been common, but I believe that vertical kerns (overhangs) were done on rare occasion. Obviously an oversized cast on a small body would require very careful composition to avoid colliding extenders (and careful handling so as not to knock those kerns off).</p>
      <p>Not sure why that approach would have been taken with this particular face.</p>
