      <p>The late afternoon light was nice, so I got out my camera and managed to get a reasonably good photograph of the full Enschedé resetting of the van de Velde roman specimen, which shows complete alphabets for uppercase, lowercase and smallcaps, as well as numerals and some punctuation. Sorry the photograph isn't as sharp as the one above.</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123082856im_/http://typophile.com/files/JvdVfull_6021.JPG"></div><p></p>
      <p>Note that we don't know who cut this face. Van de Velde advertised the types for sale, but he is identified in records as a bookseller, not a type founder, so it is entirely likely that he was only the distributor, not the maker, of the type.</p>
