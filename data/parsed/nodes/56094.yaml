      <p>The 'n' and 'm' differ significantly. For instance. the top serif of the 'n' consistently looks larger than that of the 'm' and the corresponding notch is higher. It doesn't appear to be an effect of ink as it happens on both scans and consistently.</p>
      <p>The weight of the verticals is a little different, the arch differs, the "feet" serifs on the 'n' look wider...</p>
      <p>I'm partial to that 'n' (actually, I really, really like it) but it's very interesting that the differ that much and yet they both work with the other characters. </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123082856im_/http://typophile.com/files/mn_6284.png"></div><p></p>
