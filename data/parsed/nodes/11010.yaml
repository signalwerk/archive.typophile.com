  html: <p>Typographic logo for Rubicon Design + Fabrication designed July 2001. This was <br>cut-up letterforms /work in progress  I was experimenting with when the client dropped by the studio, looked at it and wanted it as is.. Their slogan is “more custom than your mom”. All collateral (postcard, letterhead, fax cover sheet, businesscards, website) all use various version of the logo. <br><br><img src="http://www.typophile.com/forums/messages/29/894.jpg" alt="Rubicon logo.jpg"></p>
