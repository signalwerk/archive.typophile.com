  html: |-
    <p>Is there a recent version of all the attributes of the FontLab Options() class somewhere? The <a class="freelinking external" href="http://dev.fontlab.net/flpydoc/view_html.html" rel="nofollow">Unofficial FontLab/Python API Reference</a> is still based on FL 4.x, and the attributes are not listed in the docstring too unfortunately.</p>
    <p>I'm especially interested in controlling the 'Export old-style non-OpenType "kern" table' option.</p>
    <p>Thanks,</p>
    <p>-Paul</p>
