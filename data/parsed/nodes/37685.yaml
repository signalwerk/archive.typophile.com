      <p>It's "TTEWriteKernTable".</p>
      <p>As regards a list of available options: Just go to the Options/Preferences Panel and save the options. The .reg text file covers all available options -- they are the same for scripting.</p>
      <p>To find out which is which (sometimes, names are a bit cryptic) do this:<br>
      (1)<br>
      -- in the Options/Preferences Panel, save the current set of options<br>
      -- switch on/off the option that you are looking for<br>
      -- save this new set of options by different name<br>
      -- open both text files e.g. in BBEdit and use "compare front documents"<br>
      This will show you which entry was altered.<br>
      (2)<br>
      In a next step, set the desired option to the desired state, again save options, and check the .ref file for the value of this option. Or "print" the value of this option by script.</p>
