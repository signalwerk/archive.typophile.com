  html: |-
    <p>I am proud to announce the release of Cabulosa, a brasilian urban calligraphy inspired typeface.</p>
    <p>Available at <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0303" rel="nofollow">YWFT</a>.</p>
    <p>For further information on Cabulosa, download the pdf <a class="freelinking external" href="http://www.chibachiba.com/Cabulosa.pdf" rel="nofollow">here</a></p>
    <p>And for those of you who aren't familiar with the style, here's a preview of a nice documentary that is about to be released on the theme. Directed by João Wainer:</p>
    <p><a href="http://www.youtube.com/watch?v=8-lDyq6pw0E" title="http://www.youtube.com/watch?v=8-lDyq6pw0E">http://www.youtube.com/watch?v=8-lDyq6pw0E</a></p>
    <p><a href="http://www.youtube.com/watch?v=TtlRZdLGi3I" title="http://www.youtube.com/watch?v=TtlRZdLGi3I">http://www.youtube.com/watch?v=TtlRZdLGi3I</a></p>
