      <p><cite>"the ‘font’ from which the type springs (so to speak)"</cite></p>
      <p><cite>"it’s mostly believed to originated in France, where the idea of a spring of water, was close enough to the ideas that spring from words, I guess, to merit the additional definition of the word…"</cite></p>
      <p>On an etymological side note.</p>
      <p>Our "font" has nothing to do with the font as in fountain, or spring -- it comes from the French <em>fondre</em> (Lat. <em>fundere</em>), to melt. So traditionally, our word "font" would refer to the founded metal type set (correct?).</p>
