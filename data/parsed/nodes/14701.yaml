    html: |-
      <p>When I was serving my apprenticeship during the age of dinosaurs, my ITU lesson books explained pragmatically that "font" sprung fom the word "fount" (still used today in the UK) meaning a source from which words gushed. It went on to say that a Font is an assemblage of enough letters, punctuation and figures with which to set a collection of words. So I guess I am saying about the same things that Mark has said. </p>
      <p>The smaller the point size, the more characters of each you got; following what was called a "font scheme", which meant that you got more a's that z's roughly.</p>
      <p>I realize that the common useage of "font" today is for the actual stye of the typeface. I have no argument with that. Many terms in current use have come from ancient ones, and even thopught somewhat bastardized they become the modern nomenclature.</p>
      <p>A couple of months ago I received a commission to make a simple wordmark for a young art director,and at first was confused becuase she wanted it to be an origianl "font". Once we were on the same page everything was OK.</p>
      <p>In my world a font is still a font of so many pounds of lead when I cast fonts for printers and designers, and I've gotten used to calling a digital face a font.</p>
      <p>Jim</p>
