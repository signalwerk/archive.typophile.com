      <p>&gt;make sense</p>
      <p>According to my Oxford Concise Dictionary, the word Fount (English spelling) and Foundry come from the same French root, 'fondre', which means according to my French dictionary not only 'melt,' mentioned above, but more relevantly 'cast', as in casting a metal statue. So a foundry is a place that casts metal, and a 'fount' or 'font' is a casting of an alphabet in metal. Makes sense to me.</p>
