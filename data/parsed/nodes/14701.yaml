      <p>Here's my simple explanation:</p>
      <p>You've got a collection of letters, numbers, symbols, etc. that can be used together to form words, paragraphs, tables, etc.</p>
      <p>The physical embodiment of such a collection (whether it's a case of metal pieces or a computer file) is a <strong>font</strong>.</p>
      <p>When referring to the <em>design</em> of the collection (the way it looks) you call it a <strong>typeface</strong>.</p>
      <p>A <strong>typeface family</strong> or <strong>font family</strong> refers to a related collection of typefaces or fonts.</p>
      <p><strong>Weight</strong> refers to the thickness of the strokes that make up the letters, numbers, etc. of the typeface (light, bold, etc.).</p>
      <p><strong>Style</strong> refers to a distinct design variations within a typeface family (italic, condensed, etc.).</p>
