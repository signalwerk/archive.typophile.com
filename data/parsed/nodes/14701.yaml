      <p>Another reason terminology gets confusing is because the original defintions were loose to begin with and commonly misused in advertising copy.</p>
      <p>Hence, a typeface (specific design like "Neue Helvetica") might be part of a family (also called "Neue Helvetica") which generally follows a convention of weight and style variants. </p>
      <p>Weights HAD generally referred to versions created with different <a href="/wiki/stem" class="freelinking" rel="nofollow">stem</a> thickness (Thin, Light, Medium, Book, Demi, Bold, Extrabold, Heavy, Ultra, 45, 55, 75, etc. are just some common terms used and abused).</p>
      <p>Styles HAD generally referred to commonly excepted design variants which maintained visual continuity of look and feel -- though not ALWAYS true -  <a href="/wiki/Italic" class="freelinking" rel="nofollow">Italic</a> (though sometimes regarded a "weight"), <a href="/wiki/Oblique" class="freelinking" rel="nofollow">Oblique</a>, 46, 56, Cursiv, Condensed, 47, 57, Compressed, Expanded, Extended, <a href="/wiki/Inline" class="freelinking" rel="nofollow">Inline</a>, Outline, <a href="/wiki/Handtooled" class="freelinking" rel="nofollow">Handtooled</a>, Shadow, <a href="/wiki/Titling" class="freelinking" rel="nofollow">Titling</a>, <a href="/wiki/Diplay" class="freelinking" rel="nofollow">Diplay</a>, <a href="/wiki/Poster" class="freelinking" rel="nofollow">Poster</a>, are just a few of the dizzying nomenclature thrown about.</p>
      <p>When Linotype made <a href="http://www.myfonts.com/fonts/linotype/packages/172714/" target="new" rel="nofollow">Neue Helvetical Family</a> available in 51 <em>Styles</em> purchasable as a single part number, things really got confusing. What was Helvetica 57 Condensed Oblique? A <a href="/wiki/Squooshed" class="freelinking" rel="nofollow">Squooshed</a> slanted version of 57, or did they really just mean Helvetica 58? It's <a href="http://www.fonthaus.com/xheight/typefam.cfm" rel="nofollow">Adrian Frutiger's</a> fault for using those <a href="http://www.fonts.com/AboutFonts/Articles/fyti/TypeFamilies.htm" rel="nofollow">damned numbers</a>.</p>
      <p>Does a type vendor license typefaces from a type foundry, so they in turn can manufacture a font that the end user can install the font and who license to right actually use the typeface design AND the software technology under a set of legal agreements? Yup, I think that's right.</p>
