      <p>Yeah, the language is a mess for a variety of reasons. Here's my understanding of the 'correct' usage:</p>
      <p><strong><a href="/wiki/font" class="freelinking" rel="nofollow">font</a></strong>: refers to the <em>file</em>, the data on your machine, the 'font' from which the type springs (so to speak), common usage for 'font' makes it interchangeable with 'type' or 'typeface', even though it's imprecise</p>
      <p><strong><a href="/wiki/typeface" class="freelinking" rel="nofollow">typeface</a></strong>: the literal face of the font, the design. Common usage often makes this refer to the roman, with the implication that the other weights and styles are part of the typeface, which is, again, imprecise.</p>
      <p><strong><a href="/wiki/type" class="freelinking" rel="nofollow">type</a></strong>: refers to characters that use a predetermined design for assembling into words, etc. Also refers to the output (type on a page, etc.), common usage makes it interchangeable with font, but is imprecise.</p>
      <p><strong><a href="/wiki/family" class="freelinking" rel="nofollow">type family</a></strong>: a group of typefaces that have a common design origin/theme</p>
      <p><strong><a href="/wiki/glyph" class="freelinking" rel="nofollow">glyph</a></strong>: a specific visual mark/design, doesn't necessarily carry any meaning or symbological cues</p>
      <p><strong><a href="/wiki/letter" class="freelinking" rel="nofollow">letter</a></strong>: the set of shapes upon which we all loosely agree on that carry certain alphabetic meanings and cues, which can be expressed with different glyphs and typefaces, as long as it shares enough of the commonly recognized shapes that it is recognized as a meaningful symbol, blah, blah, blah, philosophy.</p>
      <p><strong><a href="/wiki/character" class="freelinking" rel="nofollow">character</a></strong>: a printed/displayed/written letter or symbol, refers to the thing without referring to its design attributes (I think)</p>
      <p><strong><a href="/wiki/lettering" class="freelinking" rel="nofollow">lettering</a></strong>: any creation of letters not employing type/fonts (implying that it's done by hand)</p>
      <p><strong><a href="/wiki/sort" class="freelinking" rel="nofollow">sort</a></strong>: a piece of metal type</p>
      <p><strong><a href="/wiki/weight" class="freelinking" rel="nofollow">weight</a></strong>: the visual darkness or lightness of the strokes in a character: ultra light, light, semibold, black, ultrablack, etc.</p>
      <p><strong><a href="/wiki/style" class="freelinking" rel="nofollow">style</a></strong>: an alteration in the design that is distinct but isn't weight-related: italic, roman, regular, text, display, small caps, etc.</p>
      <p>This is my own working understanding of these <a href="/wiki/terminology" class="freelinking" rel="nofollow">terms</a>. There are others here who probably disagree (or know better than I do), and my definitions are meant to be brief, not comprehensive.</p>
      <p>"<em>Why do Herculanum, papyrus and odd fonts like that come standard with my OS X system?</em>"</p>
      <p>Because most people can't see the difference between <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a> and <a href="/wiki/Times%20New%20Roman" class="freelinking" rel="nofollow">Times New Roman</a>, and selling is about 'perceived value', so more different-looking fonts = value. Also, most people don't have the design mind or skills to add true charater to a layout, so a novelty/display face allows them to 'paint on the aesthetic' with the click of their mouse. The less cynical view: there's a good use for any type (font), and variety is the spice of life.</p>
