      <p>"what is a font?"</p>
      <p>I know it's confusing. Part of this comes from incorrect use of terms by the wide assortment of participants, from newbie founders to the aged and beyond...</p>
      <p>No one knows for sure where the word comes from except that it's mostly believed to originated in France, where the idea of a spring of water, was close enough to the ideas that spring from words, I guess, to merit the additional definition of the word...</p>
      <p>But eventually, font came to mean a single size of a single style, remembering that before multiple masters and scaleable outlines, (film aside), a font was metal, or wood, and so it was only good for a single size...</p>
      <p>Digital outline font, means a bit more can be done with this new kind of font. Font Family, means a clooection of styles meant to be used in conjunction, like Roman, italic and bold. Font library them means a collection of families and styles... and so on. . . </p>
      <p>"Enigma has 3 fonts, 2 wheights, and 4 styles"<br>
      I don;t know what this means either, and I've been around for while. Maybe, it's a marketing ploy to make Enigma enigmatic.</p>
      <p>"Why [...] fonts like that come standard with my OS X system?<br>
      Originally, fonts came with OS so you could see the OS, like Chicago, or something. But then, when OS makers wanted to attract broader audiences, they expanded the fonts they "bundled" with the OS. Now, the OS folk want certain classes of users, (not graphic designers e.g. but dentists, e.g.), to have all the fonts they needed from the start, to make the documents they needed. So, Herculanum was included for people interested in sharing ideas that felt buried under volcanic ash, or somethin'.</p>
      <p>Hope that helps...</p>
