      <p>Font?</p>
      <p>Not to spread any more misinformation than already exists, I will share my understanding of the origin of the term <em>font</em>.</p>
      <p>As told to me by several "old coot" typesetters (skilled craftsmen who set lines of copy professionally prior to Macs and PostScript), the term <em>font</em> is derived from <em>fount</em> and <em>foundry</em> going back to the manufacture of type using molten metal. The <em>fount</em> was the reservoir or pot of molten <a href="http://www.bastoky.com/Typo.htm" target="new" rel="nofollow">lead/tin/antimony</a> which was used for casting individual type characters, and eventually complete lines of type (linecasters, Linotype contraction of "line-of-type").</p>
      <p>Type casting referred to the manufacture of typefaces, hence it was often done by metal <a href="/wiki/foundry" class="freelinking" rel="nofollow">foundries</a>. The <em>font</em> then loosely referred to the finish casted <em><a href="/wiki/sort" class="freelinking" rel="nofollow">sort</a></em> of the typeface, which was a SINGLE point size set of individual type characters sufficient enough for composing typical print jobs.</p>
      <p>So, that is the mysterious origin of <em>font</em> as told to me by the errant Knights of <a href="/wiki/Aldus%20Manutius" class="freelinking" rel="nofollow">Aldus Manutius</a>... again, just legend.</p>
      <p>-------------------------------------<br>
      Yes, I'm old, mwah-ha-ha!</p>
