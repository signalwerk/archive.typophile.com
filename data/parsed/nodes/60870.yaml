      <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_6196_5200.gif"></div><p></p>
      <p>I see what you're trying to do here.  I didn't pick up the figure-ground-reversal at first.  I didn't even get it on the second or third time.  I believe you're trying to have that duality of image but frankly, it's not working because the balance isn't there.</p>
      <p>Some observations:<br>
      The rounded corners throw me off; makes me think "children" or "immature."  There's no sophistication here.  Is there a reason you haven't ALL CAPS?  You have a lot of vertical movement with the House and Pencil illustration, which can be cool, but you need to follow it with the typography.</p>
      <p>Questions to ask yourself:<br>
      If she's fun/funky, why not tilt the house?  Capitalize on the fun/funky 'cause that's what's going to set her brand apart from anyone else.</p>
      <p>Architecture is about the 3D form, yes?  Why leave this as a 2D logo?  What would happen if you add depth to the illustration but kept the concept of the pencil within the house?</p>
      <p>best regards,<br>
      daniel</p>
