  html: |-
    <p>Hi everyone,</p>
    <p>Currently I'm helping a friend out. She's an Interior Architect who recently started up up her own business. Her clients are (richer) private home owners and companies (mostly headoffices). The logo should both reflect being a small studio, as well as have a professional enough look for the bigger companies. </p>
    <p>I'm almost set on the logo, which represents a house, with a pencil inside (interior) and is a capital A &gt; the first letter of the studio name. </p>
    <p>But now having troubles with the lockup. The type is Univers, and not kerned yet.</p>
    <p>I would like to hear your reactions on the logo, and suggestions on the typography,</p>
    <p>Thanks,</p>
    <p>Marco</p>
    <p>NEW DESIGN BELOW</p>
  html_clean: |-
