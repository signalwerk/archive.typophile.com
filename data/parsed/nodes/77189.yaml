      <p><em>When I hear a designer say "it would have been a lot of work", this makes me questions the overall integrity of the font.</em></p>
      <p>Certainly, integrity may be defined as each font in a typeface family having exactly the same characters and features.<br>
      I sacrificed a little of that for what I considered increased utility. Rather than skimping on features and styles in some weights, please think of it as generosity in other weights :-)</p>
      <p>When comparing weights, it's also useful to consider their range, not just their number.</p>
