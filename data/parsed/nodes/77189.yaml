      <p>I didn't mean to say that your font is overpriced (indeed, it seems roughly in line with the pricing of most high quality families from independent foundries) but that $349 is outside the likely budget of the typical home user such as myself. Most fonts (except for "novelty" display styles) are aimed squarely at the professional design market and the price reflects that. Good fonts are lot like good camera lenses: most non-professionals (with the exception of a few hobbyists with nice jobs) can't really afford them, but that doesn't stop us from admiring the when we see them ;)</p>
      <p>As for a monospaced version, I don't think that would be necessary. You've already got the early 20th century "industrial" look down.</p>
