    html: |-
      <p>There are a couple of questions that I was expecting to be asked, but as nobody has done so, allow me:</p>
      <p><em>Nick, why are there no italics for the extreme weights (Thin and Black)?</em></p>
      <p>It would have been a lot of work, the Thin requiring much delicate drawing, and the Black being awkward to design/draw. And I reason that those weights would rarely if ever be licensed or used by designers.</p>
      <p><em> Why are there no small caps, fractions, superiors and inferiors, in the Thin, Extra Light and Black weights?</em></p>
      <p>Again, it would have been a lot of work, which I don't believe would ever have been used. These are "expert" features used in body text, so are not required in display weights.</p>
      <p>***</p>
      <p>Was I correct in my assumptions?<br>
      Is there no call for Thin italic or Black small caps?</p>
    html_clean: |-
