    html: |-
      <p>No.<br>
      But perhaps I should add some monospaced styles!</p>
      <p>**</p>
      <p>BTW, I don't know about affordability, but I've tried to make it value for money: the ‘text’ fonts at $59 have a range of  features (small caps, fractions, superiors &amp;c.) in Extended Latin encodings, 700 glyphs per font—which is comparable to many such similarly loaded contemporary typefaces. The display weights (without small caps, &amp;c.) also have the Extended Latin encoding, and the four basic sets of figures (tabular/proportional/lining/oldstyle), 280 glyphs for $39, the same price the original Type 1/TrueType Bodoni Egyptian sold for, which had only basic Western encoding and no figure alternates, just over 200 characters per font. </p>
      <p>The full family at $349 for 8 weights of roman, 14 fonts in all, accounts for the majority of sales, so that price point has proven to be quite realistic.</p>
