    html: |-
      <p>This truly is a beautiful piece of work.</p>
      <p>My only question is in regards to pricing.  I see on myfonts it is currently $245 with the promotion and $350 without it.</p>
      <p>With the lack of weights/styles what justifies the pricing when I could purchase Archer with 25 Styles for $280 and get all the weights that weren't created for Bodoni Egyptienne or even spend $50 more when the Bodoni promotion ends and get all 40 styles of archer for $400.</p>
      <p>14 styles of Bodoni Egyptienne for $245<br>
      25 styles of Archer for $280</p>
      <p>It makes it hard to consider Bodoni when I am getting 11 additional weights for $35 with Archer.</p>
      <p>I only bring this up because I am currently very seriously considering this purchase myself and I am having to decide between the two.  When I hear a designer say "it would have been a lot of work", this makes me questions the overall integrity of the font.  I am not so sure HFJ said the same thing when designing Archer and is this evidenced by the weights/styles available.  It may be easier for me to justify spending that $35 and going with Archer even though this is such a new and beautiful font.</p>
