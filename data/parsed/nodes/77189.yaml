      <p>Both of these are fine designs.</p>
      <p>The standard EULA for Archer is very different from the EULA for Bodoni Egyptian, so your intended usage could tip things. </p>
      <p>Compare this:<br><a href="http://www.typography.com/home/eula.php" class="link-external">http://www.typography.com/home/eula.php</a><br>
      and this:<br><a href="http://new.myfonts.com/fonts/shinn/bodoni-egyptian-pro/regular/buy.html" class="link-external">http://new.myfonts.com/fonts/shinn/bodoni-egyptian-pro/regular/buy.html</a><br>
      (click on view license)</p>
      <p>Nick's standard EULA is far more liberal, allowing public PDFs and modifications.</p>
      <p>Also, Nick's EULA is for 5 computers, and you're quoting the H&amp;J price for one.</p>
      <p>Plus, Bodoni Egyptian is available with an @font-face license at FontSpring.</p>
      <p>Finally, Archer is everywhere, Bodoni Egyptian is not (yet!)</p>
