      <p>Santiago,<br>
      It was a feature I've seen on some Bodoni interpretations.<br>
      I liked it, but on a slab serif there was only room for it in the very lightest weights.</p>
      <p>Similarly, I gave the lining dollar two vertical bars on the lightest weights, but only one elsewhere.</p>
