      <p>Hi everyone, greetings from <a href="http://www.nyloo.com/html/ent/792/ent.40792.1.asp">Gregolimano</a>! Enjoying my last days off and looking forward to my return on my favourite Typophile Board. I can actually waterski now! And guess what? After all those years I finally managed to read a <a href="http://www.nologo.org/">serious book</a>, like, with real paper pages ‘n’ stuff! :^D</p>
