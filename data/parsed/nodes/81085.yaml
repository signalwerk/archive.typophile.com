      <p>- "oki-ni": looks like custom for me, may be from a commercial typeface with  a /n totally redrawn; some suggestions for base font: <a class="freelinking external" href="http://www.dafont.com/suzuki.font" rel="nofollow">Usuzi</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/typodermic/injekuta/" rel="nofollow">Injekuta</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/typodermic/uniwars/" rel="nofollow">Uniwars</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/microgramma/" rel="nofollow">Microgramma</a>/<a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/eurostile/" rel="nofollow">Eurostile Extended</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/typodermic/nesobrite/" rel="nofollow">Nesobrite</a>...<br>
      - "PASS" "BUCKET": <a class="freelinking external" href="http://www.dafont.com/wadim-giant.font" rel="nofollow">SF Wadim Giant Heavy</a><br>
      - "givenchy": most certainly custom from scratch<br>
      - "french affair": <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/bodoni-poster/" rel="nofollow">Bodoni Poster</a></p>
