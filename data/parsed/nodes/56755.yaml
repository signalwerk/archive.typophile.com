    html: |-
      <p>I usually just copy the current version of the glyph and then append it to the font. FontLab will put it after all the encoded glyphs and tack a ".00x" to the name, where "x" is a number starting with 1. It will also leave the unicode value blank. You can make as many of these as you need and you can preview them in the Metrics or Preview windows by typing the names like this: e/e.001/e.002/e.003 etc. </p>
      <p>Tip: If you also put them next to each other in the Index mode of the Font window, you can use command-[ and command-] in the Metrics window to quickly flip between the different versions without having to type out the names.</p>
      <p>If you have settled on your favorite, and it's not the version without the extension and unicode number (e.g. not "e" in the example above), add an extension such as ".000" to the current (encoded) glyph and delete its unicode number. Then remove the extension from your favorite and auto-generate the proper unicode value. It will pop into place with the other encoded glyphs. You may also want to rearrange its position in the Index view.</p>
