    html: |-
      <p>A good question, and another way of doing things: If I can make the selection on screen in FL, I rarely do the work with temporary alternates, usually using the mask, (and swap function to switch as rapidly as possible for comparison. I often end up with a line of glyph designs in the mask layer, but this way, I always know where they are. If I am making the decision in print, I usually make a second font I can switch to. This might be influenced by the fact that I don't like alternates, and I don't like fiddling with proofs. </p>
      <p>Cheers!</p>
