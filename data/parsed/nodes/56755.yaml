  html: |-
    <p>When building a font in FontLab, let's say you want to tweak a glyph. What's the best way to create a new glyph or three to try out alternatives? Obviously you will want to hit "Generate Glyphs," but I confess that the options on that dialog really confuse me and my poking around has resulted in some messy font windows and some weird results like rejected glyphs being encoded in the kerning, etc. Along those same lines, I'm unsure sometimes whether I want to be copying and pasting glyphs, or outlines.</p>
    <p>I take this to be pretty bread-and-butter in the work of designing fonts, so I'm sure some of you with more experience have worked out best practices for generating glyphs such that<br>
    - their names make sense<br>
    - their positions in the font window make sense<br>
    - they are easy to set up as simultaneous comparisons in preview<br>
    - the "winner" of the comparison can be slotted into the appropriate spot<br>
    - the "losers" are "archived" somehow</p>
    <p>Thanks for any hand-holding you're willing to provide!</p>
