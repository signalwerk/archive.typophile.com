    html: |-
      <p>My method is the same as David's: I keep different versions of the same glyph in the mask layer, usually spaced out to the sides of the current edit, and using the swap-outline-with-mask function when I want to compare the different forms side-by-side.</p>
      <p>Each time I generate a test font for press tests or other proofing, I archive the FontLab source and move to a new one for the next round of edits.</p>
