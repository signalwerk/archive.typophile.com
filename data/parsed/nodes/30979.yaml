      <p><em>I want people to know that I’m not just selecting a typeface and running with it</em></p>
      <p>Isn't your logotype just a typeface, or did you draw it from scratch?  Nobody who sees that will think, "Oh, he does type design particularly well."  I consider myself to be a type fanatic and love to modify type for my own needs, but I'm still quite happy to select a typeface and run with it when it works.  I think you're overanalyzing this.  But if you want to stick with type of a similar vein, kill the symbol.  Or, use the symbol as an extra graphic element on your stationery or website, but not locked up with the type.</p>
