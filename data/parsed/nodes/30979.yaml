      <p>Here are a few things that I'd suggest looking at:</p>
      <p>1. Let's start off with the big one: do you really need a symbol for this?  A symbol is best used when augmenting a slightly abstract name or concept.  Here, you're just explaining the name, which is unnecessary.  Plus, I don't think it's really distinctive enough as a symbol.  I get it –&nbsp;the mid-brain.  If there were something else hidden within, like a great monogram or something, that might help.  But still, I think it's superfluous.</p>
      <p>2. If you are going to use this symbol, then the typeface for "mid-brain design" is competing visually with it.  The serifs, the open 'a' counter, and the ligatured "gn" are all distracting from the symbol.  I think the type should be simpler, with a little bit more modernity to meld better.</p>
      <p>3. I get web and print.  What is "photo" ?  Is that another service you offer?  So you're a photographer too?  Great.  Should be a separate business, I think.</p>
      <p>4. The layout of the various type elements are all over the place, also contributing to a visual mess.  The symbol on the left, the "web, print..." modifier on the right, and the tagline too-tightly stuck underneath the name.  Kill the "web, print, photo" bit.  It's not necessary.  By saying you do web and print, that says you do pretty much anything, so it's not needed.  Find a better way to place the tagline that balances better with your main typeface.  Balancing form with function is a decent tag, but the type lockup is all unbalanced.</p>
