      <p>Good points.</p>
      <p>Do I need a symbol?  Hmm, perhaps not, but it does work well.  The logo as you see it is really the master logo.  Components can be removed (and often are).  </p>
      <p>I don't want the main type to be too simple (I want people to know that I'm not just selecting a typeface and running with it).  </p>
      <p>re: photo - yes I am a photographer as well, and yes its a bit muddled.  I don't lead with it, and its really just support for the other things I do.  Separate business idea is good, perhaps in the future.  I agree that the web, print, photo part isn't entirely necessary (think of it as a separate graphic element, not necessarily the logo proper).</p>
