      <p>Kerning is definitely in the eye of the designer, but some tips to get a more atheistic appeal to your letter spacing would be,</p>
      <p>1. turn the type upside down and stand back (atleast 30 inches) from your type, the spacing between words should become more apparent. Squinting your eyes will also help.</p>
      <p>2. Remember that the spacing is the negative space between two positive shapes, so the letterforms will usually dictate if spacing should be tighter or looser. (Edit: I meant to imply that the negative space should be balanced based on how much positive shapes are around it.) Don't be afraid to tuck letters into each other if you feel it'll be balanced visually better (such as under the cross of a T or the arms of a Y).</p>
