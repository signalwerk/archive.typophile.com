    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figura_3432.JPG"></div><p></p>
    <p>Hi, can you please help me again with this candy logo? I'd like to know in which font the word "Coffee" above the "classic" is written, and also the "classic", which reminds me of Mistral, although, to my untrained eyes, all calligraphic fonts look similar.</p>
    <p>Thanks in advance.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Binner D        </div>
