    html: |-
      <p>I just noticed this, actually, in the <a href="http://www.loa.org/volume.jsp?RequestID=56" rel="nofollow">first volume</a> of the Library of America's edition of Henry James's collected novels (1871–1880), published in, I think, 1984. All contractions are spaced: "ca n't", "do n't", "it 's". I can't remember if I saw a "won't" – not sure what would have been done with that.</p>
      <p>The editorial decisions made in this book were a bit odd – they wanted to present the novels in their initial forms, though multiple revisions exist of most of them – and the spaced contractions are probably part of that. </p>
      <p>It is decidedly jarring to a modern reader &amp; seems out of place in a reading edition – though I think an argument could be made for it for a scholarly edition (which the Library of America isn't).</p>
