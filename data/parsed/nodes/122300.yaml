    <p>(Cross-posted from <a href="http://english.stackexchange.com/questions/217821/space-before-apostrophe/" rel="nofollow">english.stackexchangecom</a> since folks here are more likely to have come across this sort of thing before.)</p>
    <p>In the 1928 Scribner’s (NY) edition of <cite>The Plays of J. M. Barrie</cite>, I’ve noticed an odd convention: where a contraction happens in middle of a word (e.g., “don’t” for “do n(o)t”), the apostrophe has the usual appearance. But when the contraction removes the entire first part of the word (e.g., “it’s” for “it (i)s” or “I’ll” for “I (wi)ll”), the typesetters consistently left the inter-word space there: not “it’s” or “I’ll” but “it␣’s” or “I␣’ll” (using ‘␣’ to represent a space):<br>
    <img src="http://i.stack.imgur.com/12TQh.png" width="600px" alt="Illustrative example"></p>
    <p>In the comments someone mentioned seeing a book from that era with “y’all” written as “y’␣all”. The idea is the same: if the apostrophe indicates elision of part of only one word, the words aren’t run together.</p>
    <p>• Was this a reasonably widespread practice, or merely an idiosyncratic house style? or<br>
    • Was this perhaps an idiosyncratic <em>authorial</em> style, like A. A. Milne’s use of “sha’n’t” in <cite>Winnie the Pooh</cite>, and should therefore be preserved in reproductions?</p>
