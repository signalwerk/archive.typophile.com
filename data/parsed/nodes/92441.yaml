  html: |-
    <p>So, I spent weeks on end tidying up the normal weight to a font. Now I want to do bold. As a starting point, are there any general guidelines to stick by? I believe there's a technique of shifting the right-sides of the strokes. What should I watch for if I do this? Does this mean I should maintain the left sidebearings from my regular weight? </p>
    <p>Of course I expect to be redrawing and taming the letters drastically in the refinement process. I'm asking about any prepatory, preliminary production work that would help me get started.</p>
