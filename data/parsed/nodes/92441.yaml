    html: <p>My method is to use FontLab's auto bold to get an idea of overall colour, width and contrast. I plop the result into the mask layer as a guide, but the curves are messy so I scale and stretch (and tweak) the curves from the regular to fit the proportions of the bold. That way the curves don't lose so much tension. Also you need to check the alignment zones (in my experience FontLab shortens caps and extenders when you select 'keep glyph dimensions'. And your x-height will need to be bumped up a bit, more so in a sans serif design.</p>
