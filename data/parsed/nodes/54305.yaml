  html: |-
    <p>Hello,</p>
    <p>I am trying to select the right paper for my Moroccan wedding invite and each printer I have asked seems to suggest something else.</p>
    <p>I want the look of French paper, the Speckletone look, but in a paper with some cotton in it so that it will take the impression very well. Most of my printers seem to feel that French paper is better for silkscreen than letterpress.</p>
    <p>Anyone know what might be a good choice?</p>
    <p>thanks!</p>
