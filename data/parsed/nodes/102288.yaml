    <p>Hi everyone,<br>
    I am writing an essay about the comparison between Latin typography and Japanese typography, underlining elements in contrast and in common. </p>
    <p>There is a huge bibliography about Latin typography but it is hard for me to find exhaustive information about the Japanese typography, in terms of concepts as kerning, line length, or layout, hierarchy, etc.</p>
    <p>I hope it is clear what I am trying to say.</p>
    <p>Thank you for your help</p>
    <p>G</p>
