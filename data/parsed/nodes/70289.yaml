    <p>I bet this question has been asked a million times: basically, is there anything out there other than Times New Roman and Arial for the most common cross-platform fonts (for print)?</p>
    <p>I am designing templates for a non-profit governmental, political conference that needs a lowest-common-denominator font that can be found cross-platform. The templates will need to be accessible by all staff members who will all share in generating a body of documents within a one-week time frame from a home-office printer (like I said, non-profit...); they will hopefully come across with some semblance of a brand and consistent look. (The staff members are coming from all around the world, most will be using their own computers--who knows how old their PCs are). Every year, the conference has defaulted to Times New Roman and Verdana as the body and header fonts, respectively. </p>
    <p>As I am not too familiar with the PC system, does anyone out there now if there is a common serif font with non-lining numbers (like Georgia, but for print?)</p>
    <p>Speaking of Verdana, I am similarly looking for a new sans serif font for the header type that is common to all/most pc's and macs. Arial and Verdana, so far, seem to be the only ones that don't need to be substituted when the documents are transferred from PC-Mac-PC. I used Franklin Gothic last year for table tents and name badges, signage that was generated on location, etc...but this year, the documents were sent back to me using Verdana once again (I think this is because when the PC users open a document with Franklin Gothic specified from my mac, it asks for you to choose a new, substitute font--so they just chose Verdana). Should I re-convert everything to Franklin Gothic? </p>
    <p>As I will be working remotely this year from a different time zone, it will be hard to be the control freak who makes sure all documents are looking consistent before they are printed out </p>
    <p>The logo that will be on all documents is attached (it uses Interstate, and the 'th' is Caslon 540 italic).</p>
