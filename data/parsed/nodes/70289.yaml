    html: <p><a href="http://en.wikipedia.org/wiki/Constantia_%28typeface%29" rel="nofollow">Constantia</a>. Ships installed on Windows Vista and Windows 7, and with Office 2007 and some other MS products. Non-lining numerals are the default style; lining and other numeral styles are accessibly via OpenType Layout features, as are smallcaps, superiors, etc.</p>
