    html: <p>Well, for <a href="http://www.fonts.com/findfonts/detail.asp?pid=242801">Helvetica Cyrillic</a> and <a href="http://www.paratype.com/fstore/fonts/Helvetica-Greek-Monotonic.htm">Helvetica Greek</a> you're in luck. <br> <br>For Japanese, I recommend <a href="http://store.adobe.com/type/browser/P/P_1802.html">Heisei Kaku Gothic</a>. <a href="http://www.dynalab.com/DesktopDefault.aspx?TabId=3548">Dynalab</a> has has a similar Chinese font (Hei) in one of their paks. <br> <br>You can browse through Monotype's list of <a href="http://www.monotypeimaging.com/isv/wt_list.asp">Non-Western</a> fonts as well. I didn't find a good match for all scripts, but for Bengali I'd go with <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=bengali">ITR Dilip</a>, for Devanagari <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=devanagari">ITR Mitra</a> (although Chakra, Kable, or Yogesh would probably also work), for Gujarati <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=gujarati">ITR Mohan</a>, for Kannada <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=kannada">ITR Sarita</a>, for Telugu <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=telugu">ITR Prabha</a>. Their <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=hebrew">Arial Hebrew</a> isn't bad. <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=thai">Arial Thai</a> is also serviceable, but I'd go for UPC Browillia instead. For Korean, <a href="http://www.monotypeimaging.com/isv/wt_fontsample.asp?lan=korean">HY Gothic</a> will do, but I find it aesthetically flat. <br> <br>I'm sure I'm doing a disservice to smaller, independent foundries who have made fonts to harmonize with the <a href="http://www.theage.com.au/articles/2004/05/18/1084783500044.html?from=storyrhs&amp;oneclick=true">Most Ubiquitous Font in the World</a>�.</p>
