  html: <p>Hello typophiles, <br> <br>I am looking for a resource or resources to find other alphabets that match the design of helvetica. <br> <br>For non-latin words and phrases, I don't want to just set the translated words in helvetica, I want the actual letterforms used in these languages. <br> <br>The thing is, I don't know yet what languages I will need, and what alphabets they use. <br> <br>Help!</p>
