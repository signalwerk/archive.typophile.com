    html: "<p>Hey, Raph, killer. <br> <br>1) Arial (which is a Helvetica clone) has an Arabic (at least in my version of Windows, XP-Home), although looking at it now it doesn't look very Helvetica at all... Which however does mean it looks more Arabic and more readable.  :-) <br>2) There's a font called Arial-Unicode: it covers gobs of codepages (it's about 30Mb) but some of its parts -like the Armenian- are quite lousy, and I don't know if it's even generally available...  :-/ <br> <br>Here's an idea: look into Abbar's <i>Univers</i> Arabic (featured in an issue of Eye last year) which will probably be sufficiently Helvetica for you. But really, there <i>must</i> be a \"decent\" Arabic Helvetica somewhere - it's a face that has infested virtually every script, why not Arabic? <br> <br>hhp</p>"
    html_clean: "<p>Hey, Raph, killer. <br> <br>1) Arial (which is a Helvetica clone) has an Arabic (at least in my version of Windows, XP-Home), although looking at it now it doesn't look very Helvetica at all... Which however does mean it looks more Arabic and more readable.  :-) <br>2) There's a font called Arial-Unicode: it covers gobs of codepages (it's about 30Mb) but some of its parts -like the Armenian- are quite lousy, and I don't know if it's even generally available...  :-/ <br> <br>Here's an idea: look into Abbar's <i>Univers</i> Arabic (featured in an issue of Eye last year) which will probably be sufficiently Helvetica for you. But really, there <i>must</i> be a \"decent\" Arabic Helvetica somewhere - it's a face that has infested virtually every script, why not Arabic? <br> <br>hhp</p>"
