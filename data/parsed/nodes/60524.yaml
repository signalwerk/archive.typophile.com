      <p>Bowfin; to anwser your question, 'Nieuw Zuid' (New South in English) is the name of a district/neighbourhood in the city of Antwerp ('Antwerpen' in Dutch)..</p>
      <p>When doing a search for this image I only came across the 'Nieuw Zuid' part, which design seems to also be used on <a href="http://www.laundryday.be/" title="http://www.laundryday.be/">http://www.laundryday.be/</a></p>
      <p>To add to the list of fonts that could be used, the U seems to correspond with Myriad Pro Condensed</p>
