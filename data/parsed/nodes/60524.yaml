      <p>What does the sample represent? It has clearly been tightly spaced for a reason, such as style, or space saving (not legibility, I would say). It's possible that more than the Z was borrowed from another font, or that some graphic manipulating was done for artistic effect. This might all have been done with fonts that were at hand, and if the weights matched, then why not mix them to create something new?  </p>
      <p>I suspect designers often do this, and it creates challenges for Type ID Board members :)</p>
      <p>- Mike Yanega</p>
