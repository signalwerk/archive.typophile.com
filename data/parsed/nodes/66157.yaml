      <p><a href="http://www.societyofscribes.org/" title="http://www.societyofscribes.org/">http://www.societyofscribes.org/</a> in New York City.  </p>
      <p>If they don't have classes on Hebrew script they will know who will. </p>
      <p>Another route: google "ketubah new york city" or "ketubot new york city</p>
      <p>I think the Ketubah (decorative marriage contract) is an important part of business for a lot of Hebrew calligraphers. So you can ask these people. </p>
      <p>Another way: google  "scribe sofer new york city" that will get you the Torah scribes.</p>
