      <p>I learned from the book "ל.פ.טוב "כתב אמנותי עברי<br>
      and from copying Hebrew texts that I admired.<br>
      I guess the book is out of print but there are many references to it on<br>
      Israeli web pages.<br>
      The book has alphabets with small arrows suggesting a stroke order.</p>
      <p>However no one can answer your question with any confidence without knowing<br>
      the purpose of the calligraphy! Do you want to learn "Stam", "Yerusalmi" etc<br>
      There are so many styles...</p>
      <p>Mike</p>
