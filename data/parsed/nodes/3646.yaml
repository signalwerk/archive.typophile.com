  html: <p>On a recent trip to the Design Museum (http://www.designmuseum.org) in London (Highly recommended), I spotted this wall/desk calendar in the shop. <br> <br><img src="http://www.typophile.com/forums/messages/30/28765.jpg" alt="Calendar Image"> <br><img src="http://www.typophile.com/forums/messages/30/28766.jpg" alt="Calendar Image2"> <br> <br>The magnetic circle can be positioned to surround the number. Really interesting shapes, anyone know of any other interesting typographic calendars?</p>
