    html: |-
      <p>I'm assuming:<br>
      - You started this very recently.<br>
      - You're not a type design god. :-)  Even though you know I like your work.</p>
      <p>Plus you plan on releasing this today. Considering you've spent more time on your commercial releases (even though you <em>are</em> very fast) it just seems to make sense that this would probably be not as well-made, hence a poor reflection on what paying customers get. What I'm getting at is that even a free font shouldn't be too rushed.</p>
      <p>Free-versus-minimal_price: I used to think charging a nominal amount makes sense, but then I realized it's counter to the purpose of maximum-exposure. As for a "Game of Thrones" mini-barrier, I think that makes sense for a free font, but for a paid one it does seem like too much.</p>
      <blockquote><p>The base price of $5 should also clearly state that this is not the same kind of product as my $25 fonts.</p></blockquote>
      <p>I think many people (in the realm of free/very_cheap fonts) don't pay that kind of attention. :-/  Just say it in the initial MyFonts description (which many free-font people won't even read though, but them you don't need to worry about impressing, since they very rarely buy anything - you just need them to expose your work through usage).</p>
      <p>All that said, doing very steep introductory discounts does seem to be the go-to strategy on MyFonts:<br><a href="http://typophile.com/node/99369">http://typophile.com/node/99369</a></p>
      <p>hhp</p>
