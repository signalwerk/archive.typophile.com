    <p>I liked the unusual uncial script used for Talisa Stark's letter in the most recent Game of Thrones episode:</p>
    <p><a href="http://4.bp.blogspot.com/-6i6oGTFzUVE/UZBFQbkhKPI/AAAAAAAADG4/mjdGcb5qE2Q/s1600/From+the+Set+-+Talisa%27s+Letter.jpg">http://4.bp.blogspot.com/-6i6oGTFzUVE/UZBFQbkhKPI/AAAAAAAADG4/mjdGcb5qE2...</a></p>
    <p>So I decided to make a font out of it:</p>
    <p><a href="http://www.cinga.ch/type/volantene.png">http://www.cinga.ch/type/volantene.png</a></p>
    <p>I'd like to put it up on MyFonts as soon as possible...  probably I won't make it until the next episode airs, but still. I figure I'll offer it for free, since it's really more of a fan service than anything serious. That will also free me from the obligation to fill in all the annoying symbols and special characters.  ;o) I've always wanted to release a font for free to attract some attention to my foundry, and this seems like a good PR opportunity.</p>
    <p>If you see something that needs changing, do tell me, but make it quick.  I expect to submit it within a day. I know the {B} is out of character, I'll definitely change that.</p>
