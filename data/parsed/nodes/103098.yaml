      <p>@ Craig: You're right about {I}. I had thinned it a bit already, but clearly not enough. I'm not sure what you mean by narrowing {T} at the bottom, but I made the whole letter narrower; does that address the issue? I also noticed {A N M} were too dark; fixed. </p>
      <p><img src="/sites/default/files/old-images/OITNAO_6650.png"></p>
      <p>As for {X x}, I rather like them the way they are... sure, they're extra-special, but I tried more normal designs at first (including descenders on the lc), and they failed spectacularly. Maybe I just went at it the wrong way. Do you have an example of the shape you would suggest?</p>
      <p>The font is 100% drawn on screen with Glyphs. I don't own a broad-nib pen.</p>
      <p>@ Hrant: I don't worry about zombies downloading my font; I rather worry about people wanting my font and ending up discouraged by the barrier. Something easy to know is just fine then.</p>
