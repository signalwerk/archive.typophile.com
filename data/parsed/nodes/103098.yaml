      <p>@Hrant: Are you assuming the font is badly made based on its short timescale, or are you seeing blatant shortcomings in the sample? In the latter case, if you'd list them here, I could do something about them and leave a better impression in the first place.  ;o)</p>
      <p>I'm toying with the idea of pricing the font at $5, and putting up a password-protected sale that gives you the font for free if you say "hello" in Valyrian (which, frankly, is just a google away). That way, the target audience (Game of Thrones fans) are not discouraged by a credit card hurdle, while I might still make some money off the font later when the sale is over.  ;o)  Do you think that's too complicated?</p>
      <p>The base price of $5 should also clearly state that this is not the same kind of product as my $25 fonts.</p>
      <p>PS: I updated the link above. The new {B} is much nicer.</p>
