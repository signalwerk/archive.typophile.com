    html: <p>Students will continue to be welcome. Student <em>questions</em> need their own forum. Half the time they are ill-disguised attempts to get us to do their homework for them, often at deadline and typically using misspelled, all-lower-case postings. I covered this in the bug report, and, Christian, you aren’t really responding to it, but that is a classic Typophile dodge.</p>
