  html: |-
    <p>Nearly every week, students show up to ask questions based on their coursework. Some of these questions are plainly an appeal for us to do their work for them and should be deleted. Others show that the student has done some work and just needs a nudge or a pointer, and those are fine.</p>
    <p>But the fact remains that these student discussions are a species unto themselves. They need their own space. They certainly are not “general” discussions.</p>
