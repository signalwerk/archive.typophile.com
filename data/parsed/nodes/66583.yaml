    html: <p>Typophile was started as a student project. Students have always been welcome here. When I joined Typophile as a student (in its first year), it was hard to get any information on type design. It seemed to me that trade secrets were the name of the game. Part of the original intent of Typophile was to make typography and type design accessible to students and even *gasp* hobbyists. I hope this always remains true.</p>
