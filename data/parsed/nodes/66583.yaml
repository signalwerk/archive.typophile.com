    date_raw: 4 Feb 2010 — 11:31am
    votes: null
    html: <p>There should be some guidelines established, both for how students present their questions and how they are answered. In my opinion, constructive advice in general terms is fine, as is referring toward other research material, and I'd say it's fair to call out glaring errors. To the point that it becomes doing their homework for them, that is to be prevented. How do we set the limits?</p>
