    <p><a href="http://www.flickr.com/photos/hellocatfood/4745107155/" title="Dataface glyphs by hellocatfood, on Flickr" rel="nofollow"><img src="http://farm5.staticflickr.com/4096/4745107155_5d917e5304.jpg" width="333" height="500" alt="Dataface glyphs"></a></p>
    <p>Dataface is a typeface created through the the "glitching" of the Liberation fonts. The process of making Dataface (and any other glitch typeface) is <a href="http://www.hellocatfood.com/2010/07/16/create-your-own-glitch-typeface/" rel="nofollow">described here</a> (Linux only)</p>
    <p>Dataface is released under the Open Font License and is available to download for free from the <a href="http://openfontlibrary.org/font/dataface" rel="nofollow">Open Font Library</a></p>
