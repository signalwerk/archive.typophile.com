    html: |-
      <p>OK, thank you for the brutal  honesty! (that’s why I came here instead of asking friends or family) I am a beginner with logos and I will take any advice you have. </p>
      <p>I did try a set that had different typefaces- mostly sans serifs, and some color variations. However, the client didn’t like those. I do agree that if I do something really great that stands out the client may just get rid of all the restrictions and choose that idea. Which would be ideal. Somehow I’m just not getting there. I sometimes get a mental block and find it hard to work on projects that are for things I don’t know much about/have much interest in- such as insurance companies.</p>
