      <p>Once again, I agree with Ratbaggy. There is a lot more to designing a logo than following literal directions of a client. </p>
      <p>Honesty?  Ok, but it’s brutal.</p>
      <p>The client could do what you’ve done by themselves. Where’s the polish? Where’s the relationship between the typefaces? Where’s any considerations of shape or style? Why would you draw a map of California <em>so literally</em> it looks like grade school clip art?</p>
      <p>Warned you.<br>
      Sorry...but sometimes honesty is needed.</p>
