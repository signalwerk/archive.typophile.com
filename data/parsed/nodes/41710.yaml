  html: |-
    <p><a href="http://www.type-together.com/tt.php" rel="nofollow">TypeTogether</a> is proud to announce the recent release of two new font families:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cora_4296.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Bree_5594.gif"></div><p></p>
    <p><a href="http://www.type-together.com/ampl_font.php?idpuente=17" rel="nofollow">Cora</a>, designed by Bart Blubaugh, is a sans serif with an experimental bent, offering a large x-height, some contrast of stroke weight, and capitals inspired by classical lettering. It has 6 weights, Regular, Medium, Bold and the accompanying Italics.<br>
    <a href="http://www.type-together.com/ampl_font.php?idpuente=13" rel="nofollow">Bree</a>, designed by Veronika Burian and José Scaglione, is a fluid upright italic with a set of alternate letters when a more classical look is desired. It is based on TypeTogether's logotype and contains 5 weights, Thin, Light, Regular, Bold and Extrabold.</p>
