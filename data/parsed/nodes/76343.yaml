      <p>"Ristorante" is very, very similar to the font, Freshscript  - but you will have to do a slight modification to the letter "t" to match it.<br>
      "pizzeria"  I believe is ITC Eras Book - with a lot of letter spacing.<br>
      "GNA" is Zapf Chancery - but you will have to chop off the tail of the "G" to make it match.<br>
      But as for "West Reading, PA" - no idea, but you may want to try looking in the Brush family.</p>
