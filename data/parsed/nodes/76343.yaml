    <p>First, I am new here. Hello. </p>
    <p>A client of mine has given me a t-shirt to be recreated and contains four fonts that I cannot identify for the life of me. </p>
    <p>I have scanned then traced the image in illustrator, then thew em' in photoshop and converted it into a jpeg as i see thats the preferred format here.</p>
    <p>I greatly appreciate any help I receive on this.</p>
