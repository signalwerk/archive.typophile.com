    <p>Eco Typeface -- Work in Progress</p>
    <p>This typeface is still in development. It's been inspired by a similar typeface but redrawn from zero -- no copy/paste has been used.</p>
    <p>Do you have any ideas how to make it better or is it good enough? The point is that one day Eco should become a commercial typeface. </p>
    <p>Note: Eco has only lower case letters because it's a display typeface.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/eco01_6103.png"></div><p></p>
