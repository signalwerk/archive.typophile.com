    html: |-
      <p>Jedan , you might need to find another name for this one I’m afraid. There’s a typeface called <a href="http://www.fsd.it/fonts/eco.htm" rel="nofollow">Eco</a> by Fabrizio Schiavi that’s been around for a while now.</p>
      <p>Other than that, I’m not sure your typeface quite works yet. Many glyphs seem confusing and out of touch with the others (s, x, k, z, v, y) and I second Kevin’s take about the c and t being difficult to tell apart. Are there any uppercase letters? Punctuation? </p>
      <p>I don’t want to sound overly negative: as a display typeface it might have some uses, but my humble advice is to keep working on it. Modular/geometric typefaces like the one you’re doing are very hard to do right, because of the crudeness of the shapes you necessarily have to work with. I hope this helps.</p>
