    html: <p>What you chose was really a reasonable choice, since Eclat does have a regular, somewhat formal 'feel', but my thinking about the categories was that the Formal Scripts were like the ones you would see on formal stationery. I couldn't see Eclat being used that way, so I put it in Part 7. <br> <br>I didn't mean to sound critical, just wanted to help clarify how I categorized  the scripts. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
