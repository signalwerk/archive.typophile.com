      <p>I don't know much about Vignelli's graphic design work, and in general I'm not terribly interested in graphic design. But I don't have a problem with someone saying that he believes only six typefaces are necessary. In order to be even internally consistent, the statement presumes the context of a particular kind of design -- presumably the kind Vignelli practices and advocates -- since it is easy enough to conceive of a kind of design that would require seven typefaces, and another that requires eight typefaces...</p>
      <p>There is a very find book designer and publisher in Germany, whose work I have admired, who has used only the Janson for many years. If he were to tell me that only one typeface is necessary, I wouldn't argue with him, since he has demonstrated this to be true in the kind of design he practices.</p>
      <p>There is an aspect of Vignelli's statement that I find quite refreshing: it suggests that he views typefaces as tools to be used in design, rather than considering the design of the typeface to become integral to the design. This is a legitimate view, usually indicating an understanding of design focused on spacial arrangement rather than stylistic evocation. Often, a distinctive typeface is used as a kind of stylistic shortcut by lazy designers. Limiting the typographic palette forces one to work harder at other aspects of design.</p>
