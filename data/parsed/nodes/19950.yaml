      <p>&gt; <em>I really don’t think I have a ‘look’</em></p>
      <p>Patty, I also felt the same way. I am a very strong proponent of facing design problems without resorting to habitual solutions. </p>
      <p>Though I have a few "favorite" typefaces, preferred color schemes and personal preferences on text color/texture, I consider them all to be only "affections" and avoid using "taste" when seeking solutions.</p>
      <p>But several years ago I contracted a freelance copywriter I knew (who didn't know I moved to a new company) and he said he thought I was working there since he <em>recognized my style</em> from the corportate ad campaigns running in magazines. Disconcerting, but enlightening.</p>
      <p>I do know there are strong "marketing" reasons in establishing a house "style", since many clients gravitate towards what <em>they</em> can recognize, or what they <em>are told by others</em> to recognize. There are plus and minuses to "style" and one of the biggest pluses is increased and continual (as long as you remain "in style") business.</p>
      <p>Type and graphic designers are no different in this than song writers and performers. Some write the songs you like to hear, some sing the songs the way you like it.</p>
      <p>I guess that's why I keep scratching around looking for project opportunities :-\</p>
