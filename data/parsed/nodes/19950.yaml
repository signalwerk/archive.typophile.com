      <p><em>Much of the modernist work of that period has a very distinct look but it seems to come from a very strong philosophy on what was considered to be straight forward, functional and objective.</em></p>
      <p>...and utopian. The progressive social utopianism of the modernist movement mustn't be overlooked.</p>
      <p>Hrant comments that the modernist design approach is about art -- as he puts it 'more about the creator than the created' --, but this ignores the social programme of modernism, which is concerned with neither the creator nor the created object, but about the role of both in a new aesthetic and social creation.</p>
      <p>I write this with very little sympathy for such a programme: I'm not a modernist and I'm suspicious of utopianism. But I think it is important to understand the motivations of modernism, and not to misrepresent them.</p>
