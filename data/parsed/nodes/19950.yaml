      <p>I think designers with dogmatic manifestos are charming, even when I don't agree with them. Kind of like the eccentric uncle who adds spice to every family reunion. It's part of what makes the world of design and art fascinating. I wouldn't want to live in a primary-colored world, but Mondrian and the DeStijl crowd nevertheless had a cool new way of expressing themselves. </p>
      <p>While Vignelli's work operates within a consistent vocabulary, I don't agree that it looks dated. In fact, when you go through design history books, his designs from the 1950s and 60s look startlingly contemporary, which can't be said about much from that period.</p>
