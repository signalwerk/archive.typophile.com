      <p>I don't agree with his views on typefaces for the most part but I really enjoy and think highly of much of his work, as I do about other modernist works before and of that time period. I definitely agree with Tiffany regarding Vignelli's use of the grid.</p>
      <p>I try to approach his views on typeface selection in a not so dogmatic way, rather I try to take from it the importance of knowing a few select type-families really in depth and learning to use them well. I think sometimes it can take some time to warm up to and learn to use a typeface beautifully. So I try not to see it as 6 being some sort of magic number, or the 6 he chooses, but more so about being able to use some of the 'few' well designed typefaces effectively (not that I think there is only a few, but the number is small in the grand scheme of all the badly designed ones imo). I still think taking the time to choose the most appropriate typeface is really important  as well.</p>
      <p>Last fall I had the pleasure of meeting Mr. Vignelli while he was in Toronto; picked him up from where he was speaking to take him to our school. During the ride we talked about typefaces and I had explained that I was interested in designing my own typefaces and asked him if he thought new typefaces should be designed to accomodate new mediums or to improve functionality in existing mediums/applications rather than just modifying the old types to work. To my suprise he supported the idea of a new typefaces providing that its improvement over the old was significant. This was good to hear but I suppose this also puts forth the question of how you measure the functional aspects of one typeface over the other, not always so easy; it could very well become a subjective decision resulting in Helvetica again. Nevertheless, it was a really fun and inspiring talk that he gave to us!</p>
