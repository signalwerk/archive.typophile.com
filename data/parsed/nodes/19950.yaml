      <p>&gt;Limiting the typographic palette forces one to work harder at other aspects of design.</p>
      <p>That may be a useful educational exercise, but as a general principle it seems to me to put an ideology ahead of the needs of the text. It seems to me that graphic design should communicate the text in the most effective way possible, where that 'effectiveness' will vary greatly with the text and the purpose of the author and publisher. For example telephone address and number listings will call for a different approach than an advertisment for a pop star's new record. Yes, you can use Helvetica for both, but I really doubt that today this is the best solution for either one. </p>
      <p>&gt;book designer ...whose work I have admired ... has used only the Janson for many years</p>
      <p>Note that they are publishing books, and probably of a similar genre. Also, generally speaking book faces are quieter and less differentiated than display faces. Further, many books don't need to be trendy or fashionable in their text, which some magazines and many advertisments will want. So I don't doubt that a book publisher could use the same typeface very effectively for years. But this doesn't make Vignelli's principle valid. </p>
      <p>I think that the '6 faces' thing is narrow minded, and I don't like Vignelli's work on the NY subway. However, in the thread last year someone posted a link for the guidelines for the National Park brochures that Vignelli designed. And these were excellent. And here a designer notes how good his lay-out guideliness for his magazine are.  </p>
      <p>So it seems to me that here is a guy that is both talented and dogmatic, and the result is a mixture of good and bad work, but in any case there is probably a lot to be learned from him.</p>
    html_clean: |-
