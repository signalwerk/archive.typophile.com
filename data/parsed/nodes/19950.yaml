      <p>Chris,</p>
      <p>I don't say that there were no good graphic designers then. I'm referring to the degradation that type manufacturing processes brought to typographic practice. Phototype for setting books in the 70's seems like a bad dream now. The absence of size-specific designs, new, klunky typesetting technology, the limitations to character sets, badly-converted "classics", all contributed to a measly palette for designers to work with. Vignelli wisely constrained himself well within this limited range. But his attitude now is simply eccentric and ossified. His comment about Helvetica's proportions also indicates his focus on display typography. </p>
      <p>I also have similar queasy feelings about some of the designers you mention. It isn't necessarily their work or their impulses. The modernism bug was still going around, mutating and breeding with the Art Deco and Art Nouveau bugs, and I can't make myself like it. I suppose it was a trend, like everything.</p>
      <p>I also don't say we have oodles of terrific graphic designers now, compared to then. Though there's a wealth of well-made type now, very few people operating as graphic designers actually understand how to use it. I imagine Shahn, Rand, et al could run circles around newer designers in their understanding of how type works. </p>
      <p>"If youth but knew, and age but could"</p>
