    <p>So Vignelli says that all we need as typographic designers are 6 typefaces, and no more. I got a little offended by this, and felt that he, well, missed the point of variety in type design. I find this quasi-utilitarian position a little strange. One typeface could theoretically function suitably (ie we could read it), but 6 is apparently the precise number that will cover the gamut of human emotion in the present, and oddly, in the future too. He claims to detest 'sameness' in design, but he contradicts his own polemic when his typographic designs are the very epitomy of this. They all borrow from a specific and unchanging box of modernist visual language. Heavy horizontal bars, grotesk types, a blind allegiance to the grid etc etc. It's not even as if he is using these 6 typefaces in a variety of ways either. Furthermore, despite hundreds of years of type design, he finds it suitable to include one of his own creations -- our bodoni -- in this elite club. I just don't get it. </p>
    <p>Rant over.</p>
