      <p>Actually it would be great to have a good, relatively impartial history of modernism in type design. There are the wonderful Heller-Filli books, but these are about the look of advertising and display. I would be interested to see the differences in design and typography, as seen first by those in the movement, and then from a current perspective. </p>
      <p>My feeling is that modernism in archicture was mainly a disaster, but in type some good products and ideas came out of it. I would like to read more about the conflicts and changes within modernism--such as Nick has pointed out--and its real accomplishments and failures.</p>
      <p>The ideal of being devoid of style, which Chris interestingly points out, is obviously naive in hindsight. I do think as Chris notes, they were in the later phase on to something in their thoughts about 'system', which photo type enabled them to think about in a new way.</p>
