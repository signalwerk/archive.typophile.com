      <p>Much of the modernist work of that period has a very distinct look but it seems to come from a very strong philosophy on what was considered to be straight forward, functional and objective. Rather than the designers trying to conform to a certain aesthetic or to leave their visual mark on a project. I respect that, and this is what I like about many of the past modernist designers. </p>
      <p>Listening to Massimo talk he brought up an interesting point. I don't necessarily agree with it since I don't feel it is relevant for every project be said he felt that here was no target audience. As soon as you determine or direct your design to a specific audience you are already starting to narrow down its effectiveness, and when you have something being implemented that will be viewed by people of many different cultures like the material for the national parks, you need to keep it as universal as possible. So I think when your have a firm view on visual communication like that, there is bound to be a strong continuity between your work.</p>
      <p>In terms of aesthetics I see a lot of designers today I think trying to emulate that "swiss style" and often very poorly, just seems to come off like faux modernism; very shallow and not based on strong principals that they have a firm understanding of. One of the few studios that I think pulls it off quite nicely is Experimental Jetset. They recently contributed a very interesting article about modernism today for our school magazine called Verso. (email me if you are interested)</p>
      <p>I find graphic designers like David Carson have more of a look, he’s obsessed with himself, and does whatever the heck he wants which is why all of his work usually ends up looking the same, and at the same time I can’t really see what the ideas behind his work is in the same way I see it with Massimo, aside from the fact that he wants to make it one way so he does.</p>
