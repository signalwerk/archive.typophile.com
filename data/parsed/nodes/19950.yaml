      <p>If you lived through modernism, you would see that it was an attempt at utopian design that tried to grasp the new mass-production world of the time and create design which was more system and process oriented rather than the single item as work of art theory which it rebelled against. Vignelli was a man of system design and he was good at it.  His critics look at his single works and compare them to others' single works rather than the production system that they were. Hindsight is easy but modernism did a great service to the design profession.  It brought it out of the "Just make it pretty" artiste school and into the "just make it communicate" school.  This elevated the profession in the corporate world and brought about what we now call branding.  You can debate the success or failure of the aesthetic that now remains of modernism in retrospect but the truth is, modernists were trying to make design devoid of style.  Sadly, its major critics complain about it because of style!</p>
      <p>ChrisL</p>
