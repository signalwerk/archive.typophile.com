    html: <p>It is my experience that designers tend to fall (loosely) into two categories - those who have a 'signature' look like Mr. Vignelli (or Louise Fili, in earlier days Fred Marcellino, I could come up with more examples but I'm running out the door) that they apply to nearly every project and those who are more chameleon-like, trying to adapt the design to the specifics of the project. The two are vastly different approaches to design, and you need to know a designer's approach before you hire them.  I'm in the latter category for sure and it has backfired on me from time to time - people saying my 'look' isn't right for them when I really don't think I have a 'look' and in fact think I could probably do nearly any type of design except perhaps the David Carson illegible look. I could certainly do 'Vignelli' with my eyes closed.</p>
