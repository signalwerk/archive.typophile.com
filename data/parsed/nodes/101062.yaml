      <p>The grotesque from 70's NASA technical report reminds me of letterings done with <a href="http://typophile.com/node/79271" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Leroy Lettering Machine</a> (including some suggestions for similars such as Leroy Lettering Light, Planscribe, Engineering Plot) Adding <a href="http://www.myfonts.com/fonts/urw/gordon/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gordon</a> and <a href="http://www.myfonts.com/fonts/btn/register-sans-btn" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Register Sans</a>.<br>
      Unfortunately, I don't have a match for the monospaced either but I can point point to a direction that you may find helpful: <a href="http://www.fontshop.com/fonts/downloads/neubauladen/nb55set" title="Click to visit an external URL." class="freelink freelink-external freelink-external">NB55</a> by <a href="http://www.neubauladen.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neubauladen Stefan Gandl</a>, <a href="http://NE Saber and Saber Hund" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://NE Saber and Saber Hund</a>, suprb <a href="http://www.youworkforthem.com/designer/48/suprb/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ASCA and ASCA-D</a>, Identikal <a href="http://www.hypefortype.com/bennu-sans-a.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bennu Sans A and B</a>, <a href="http://www.myfonts.com/fonts/scannerlicker/gerusa/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gerusa</a>, <a href="http://www.myfonts.com/fonts/dimitrelima/0arame/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ARAME</a>, <a href="http://www.myfonts.com/fonts/nicksfonts/roundabout-nf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Roundabout</a></p>
