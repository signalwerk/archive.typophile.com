      <p>The grotesque from 70's NASA technical report reminds me of letterings done with <a class="freelinking external" href="http://typophile.com/node/79271" rel="nofollow">Leroy Lettering Machine</a> (including some suggestions for similars such as Leroy Lettering Light, Planscribe, Engineering Plot) Adding <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/gordon/" rel="nofollow">Gordon</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/btn/register-sans-btn" rel="nofollow">Register Sans</a>.<br>
      Unfortunately, I don't have a match for the monospaced either but I can point point to a direction that you may find helpful: <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/neubauladen/nb55set" rel="nofollow">NB55</a> by <a class="freelinking external" href="http://www.neubauladen.com" rel="nofollow">Neubauladen Stefan Gandl</a>, <a class="freelinking external" href="http://www.hypefortype.com/catalogsearch/result/?q=Neutura" rel="nofollow">NE Saber and Saber Hund</a>, suprb <a class="freelinking external" href="http://www.youworkforthem.com/designer/48/suprb/" rel="nofollow">ASCA and ASCA-D</a>, Identikal <a class="freelinking external" href="http://www.hypefortype.com/bennu-sans-a.html" rel="nofollow">Bennu Sans A and B</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/scannerlicker/gerusa/" rel="nofollow">Gerusa</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dimitrelima/0arame/" rel="nofollow">ARAME</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/roundabout-nf" rel="nofollow">Roundabout</a></p>
