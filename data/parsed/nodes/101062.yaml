      <p>The monospaced letters (but unfortunately not the numerals) are very similar to <strong><a href="http://www.fontsquirrel.com/fonts/ProFontWindows" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ProFontWindows</a></strong> free font designed by Andrew Welch (SQ Software, 1987)</p>
      <p>The grotesque is very close to <strong><a href="http://ITC Franklin Gothic Book" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://ITC Franklin Gothic Book</a></strong> with small differences in /G, /1 (you can use /I) and /8</p>
