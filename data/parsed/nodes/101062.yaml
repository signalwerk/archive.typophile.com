      <p>The monospaced letters (but unfortunately not the numerals) are very similar to <strong><a class="freelinking external" href="http://www.fontsquirrel.com/fonts/ProFontWindows" rel="nofollow">ProFontWindows</a></strong> free font designed by Andrew Welch (SQ Software, 1987)</p>
      <p>The grotesque is very close to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=ITC%20Franklin%20Gothic%20Book%20-%20Regular&amp;fid=f0fa0fd2fd18567fc887a33456871365&amp;fsize=48&amp;text=SIMPLIFIED%20CONTROL%20AND%20FLIGHT%20MANAGEMENT%20FOR%20THE%201980's&amp;wrap=2" rel="nofollow">ITC Franklin Gothic Book</a></strong> with small differences in /G, /1 (you can use /I) and /8</p>
