      <p>Thanks for the prompt replies. </p>
      <p>Leroy was a good pointer. I will pursue it further. Lineto's Gravur Condensed comes close as well. </p>
      <p>Incidentally the monospace is also a Lineto creation called <a class="freelinking external" href="http://lineto.com/1.0/cont_des_37.html" rel="nofollow">Autoscape</a>. I had seen it in use in a degree project, and I managed to track down the guy, who then passed on the name to me. There is an obvious connection to ProFont like you mentioned.</p>
