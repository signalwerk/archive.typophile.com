  html: |-
    <p>Can anyone recommend good serif and sans serif text faces to use with Felix Titling?</p>
    <p>This is an identity project for an historical society &amp; museum. It looks like Felix Titling will be used at display in the mark. I have tried to find a similar face that would work at both display and text sizes-- I've looked at  H&amp;FJ Requiem and  also Throhand, but their serifs are too fussy at display size. I've also looked at Bembo, but the caps are too heavy at display size.</p>
    <p>I'll also need a sans serif, and am looking at H&amp;FJ Verlag--I think this will work well but am open to other suggestions.</p>
    <p>Thank you!</p>
