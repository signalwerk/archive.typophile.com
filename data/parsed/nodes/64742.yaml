      <p>@ Karsten</p>
      <p>I have opened a font with stylistic features this morning and messed up the index in FontLab (those characters, that are involved in the stylistic feature). Then I have generated the font and have merged the original GSUB table, which I had decompiled before, into the generated font. And the features work!</p>
      <p>I already wrote, that the question "binary/compile" is obsolete, if you mess up the index in FontLab, because FontLab deletes the imported GSUB table. But it seems to be untrue, that a glyph order, which was changed in FontLab, can result in funny features, at least not, if you have meant the substitution features.</p>
