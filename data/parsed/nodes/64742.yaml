    html: |-
      <p>There is no dilemma.</p>
      <p>When choosing "binary", FLS will simply include OTL tables "as is" in the OTF to be generated. In this case, the glyph set and glyph order better not be changed after having imported the font, for the simple reason that OTL tables are glyph index based.</p>
      <p>One may blame FLS for strange behavior, but not in this case.</p>
