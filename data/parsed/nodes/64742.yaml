      <p>@ Evie</p>
      <p>Check your Fontlab options ‘Opening OpenType &amp; TrueType’and ‘Generate OpenType &amp; TrueType’. If ‘Read OpenType layout tables’ is activated and if you have opened an OpenType font in FontLab, FontLab has automatically imported the tables.</p>
      <p><cite>whats the safest way to save the font and make sure all OT features work?</cite></p>
      <p>If you have not changed OT features or kerning, I would say, that the safest way is, to choose binary. But at the moment I am not sure, what would happen, if you change anything in the kerning, because the kern feature is stored in the GPOS table, while the glyph substitution features are stored in the GSUB table.</p>
      <p>I assume, that this also was answered before. Either on Typophile or on the Fontlab forum.</p>
