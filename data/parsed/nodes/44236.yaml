    html: "<p>There is another way that is often simpler, and doesn’t require changing modes: Select a glyph (or range of glyphs) in the Font window and drag it (them) to the glyph area of the Metrics window. In this case, you can only insert, not replace. An insertion point will appear in the window to let you know where the glyph(s) will be inserted.</p>"
