  html: |-
    <p>I’m currently working on superior figures (in Fontlab), and I’m dragging and dropping the non-keyboard characters into the metrics window. This is giving me a headache due to some nasty bugs involving the characters popping in at the end of seemingly random lines and copy/paste not working properly with them. Is there a better way to do this?</p>
