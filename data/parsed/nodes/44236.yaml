    html: |-
      <p>“This is giving me a headache...”</p>
      <p>“Try typing in glyphnames preceded by a slash and followed by a space or another slash, or typing in hexadecimal Unicode numbers preceded by a backslash or “\u” and followed by a space, another backslash or a slash. Example:<br>
      01234\u20AC/dollar 56789”</p>
      <p>Try placing you foot in your ear, and then wiggling your toes. With this method, you should be able to hear the crying multitudes.</p>
      <p>Because FL is not capable of simply copying a glyph into the metric window, without the user diddling with invisible spaces, actual spaces and the confounded slash marks, the “next”, (cmmd-]), is the only truly headache-proof method. This is particularly slow when kerning large OT glyph sets, and so those who are serious, must carefully sequence the glyphs in their fonts.  It’d be sweet if one could paste a glyph into the metric window’s glyph cells, as opposed to the text line, but that’d cause work somewhere. Amazingly, Fontographer succeeded into the post-256-glyph-limit world without a text line in the metrics window, but that success is a deep dark secret not to be revealed here. :)</p>
      <p>Cheers!</p>
