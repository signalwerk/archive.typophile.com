      <p><cite>The character U+0313 does not occur even once in the file. There is however plenty of precomposed unicode tharacters with the psili.</cite></p>
      <p>If you take a look at the Unicode code chart, you'll see that these precomposed characters decompose to sequences including U+0313. In theory (for the sake of machine text processing), the correct way to encode Greek in Unicode is to use the base character plus combining modifiers, but in practice people tend to use the precomposed forms, because these are much more widely supported by current software. The precomposed glyphs in the extended Greek section are a legacy of older standards that used different principles being folded into Unicode, sort of like the presentation forms in extended Arabic.</p>
      <p>The precomposed forms contain all the glyphs that you need in normal everyday use, but for prosodic marking or certain situations involving transliteration from epichoric alphabets, you still need combining diacritics.</p>
