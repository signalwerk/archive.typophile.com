    <p>What is this commonly used for?<br>
    U+0313: Combining comma above</p>
    <p>Is it correct to design this as a 180° flipped version of U+0312 «Combining Turned Comma Above» (which, I assume, is the one to use in a gcommaaccent)?</p>
    <p>And: Does it have anything to do with the caron as used in dcaron, lcaron, tcaron, or is it designed independently of that?</p>
    <p>I've found these two threads, which however only mention u+0313 in passing:<br><a href="http://www.typophile.com/node/34728">http://www.typophile.com/node/34728</a><br><a href="http://www.typophile.com/node/35356">http://www.typophile.com/node/35356</a></p>
    <p>Thanks for any insight.</p>
