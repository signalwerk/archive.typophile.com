      <p>Polytonic Greek and Americanist orthography are unlikely to overlap in usage, but it's still a bit of a shame that Unicode decided to unify the combining psili with the combining comma above, considering the different design traditions for these two uses. But then there are other cases of unfortunate unifications in Unicode.</p>
      <p>I agree with David (archaica)'s recommendation about the design of the comma above. He has explained it nicely.</p>
      <p>Is the combining comma above used frequently in American orthographies? Many Salishan languages seem to use the modifier letter apostrophe to mark ejectives after the consonant, following IPA, instead of putting the comma above the consonant.</p>
