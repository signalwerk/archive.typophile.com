    html: '<p>Just one remark. Curiously enough, Unicode defines 77 precomposed Greek characters with psili from U+1F00 to U+1F30, for instance U+1F00, U+1F02, U+1F04. You can see them in the following Unicode chart: <a href="http://www.unicode.org/charts/PDF/U1F00.pdf">http://www.unicode.org/charts/PDF/U1F00.pdf</a>. I downloaded the xml file containing <a href="http://archimedespalimpsest.net/Supplemental/ArchimedesTranscriptions/Method/"><strong>Archimedes Method</strong></a> in polytonic Greek. The character U+0313 does not occur even once in the file. There is however plenty of precomposed unicode tharacters with the psili.</p>'
