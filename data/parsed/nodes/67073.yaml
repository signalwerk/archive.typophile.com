      <p><cite>Is it correct to design this as a 180° flipped version of U+0312 «Combining Turned Comma Above» (which, I assume, is the one to use in a gcommaaccent)?</cite></p>
      <p>That depends on whether you intend it for Americanist use or Greek. The Americanist linguistic orthographies originated in the typewriter era, so the original form for that variant of U+0313 was an actual comma. The Greek spiritus lenis has a somewhat different shape, more tightly curved than a comma. If you have Arno Pro, take a look at it for an example. Arno Pro mostly doesn't have combining diacritics, but you can look at U+1FBF (or U+1FBD), which is the spacing form of Greek U+0313. The spacing turned comma in Arno (U+02BB) is quite different, although in combination with g (U+0123) the difference is less.</p>
    html_clean: |-
