      <p>Yes, sort of. I mentioned Arno just because they put a lot of good work into the polytonic Greek for it, but lots of other fonts are relevant too. Just for reference, here are the shapes in Arno, but Nick's examples work very well also.</p>
      <p><img src="/sites/default/files/old-images/accent-breathing1_4639.png"></p>
      <p>In Greek, U+0313 is the combining form of U+1FBF, and they should look the same. They are both breathing marks, and both should look like Nick's "breathing" form. </p>
      <p>The problem is that Unicode has combined two similar but slightly different forms in U+0313. However, you probably aren't making a polytonic Greek character set. In a font that has extended Latin support but no polytonic Greek, a comma shape (Nick's "accent" form) is appropriate for U+0313. And actually even in a font with both extended Latin and polytonic Greek, if you have precomposed glyphs for all the polytonic Greek letters with breathing marks, then the U+0313 grapheme can safely be comma-like, since it will only be seen in Latin contexts.</p>
      <p>Of course, the number of people who use polytonic Greek is probably several orders of magnitude larger than the number of people who use Salishan languages, not that either is of much commercial significance :)</p>
