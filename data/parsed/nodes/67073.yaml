      <p>According to the Unicode charts, this is the psili or the smooth breathing mark used in the polytonic orthography of Greek, marking the absence of an /h/ sound in Ancient Greek for an initial vowel. It is also used to indicate the ejective or glottalized voice in Americanist orthography of several American languages, such as Hənqəminəm (see <a href="http://www.languagegeek.com/salishan/henqeminem_text.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this link</a>). So Unicode uses the same code points for Greek and Latin.</p>
      <p>The combining turned comma above, U+0312, is not used in Greek, and I'm not sure there are orthographies where it is used together with U+0313. But I suspect they can be flipped versions of each other.</p>
      <p>This has nothing to do with the caron, even though dcaron, lcaron, and tcaron have superficially apostrophe-like carons.</p>
