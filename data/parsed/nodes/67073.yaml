      <p>Good old U+0313. The combining comma is preferred by some communities and/or linguists, but other communities and/or linguists prefer the modifier apostrophe instead. (Linguists have often been the main arbiters of orthographic decisions, but this is changing nowadays.) Although for a while now the variation has been due to technical capabilities among computers and typesetting systems, it’s largely an aesthetic issue at this point.</p>
      <p>When reproducing older texts, such as those gathered by linguists in the early 20th century, using the combining comma is obligatory if one aims for precise reproduction. And precise reproduction of old materials is becoming very important with the spread of digital language archives, endangered language corpora, and other language documentation efforts.</p>
      <p>BTW, the combining comma was used for quite a few other language families besides Salishan – and its neighbors Wakashan, Chimakuan, Chinookan, etc. – since nearly all languages in western North America have one or two ejectives. I’ve also seen it used for Mesoamerican and South American languages, Siberian languages, and Caucasian languages. Basically anywhere an American linguist might have encountered ejectives, there you’d find the combining comma pop up.</p>
      <p>In linguistic transcription it’s much less common in new work as people move to IPA, but transcription traditions in some circles can be extremely hard to change. In addition, historical linguists prefer to use older symbols rather than invent new ones due to the structure of their science, and so even people otherwise using IPA – e.g. me – will maintain crufty old Americanist transcriptions in certain situations.</p>
      <p>I personally dislike the combining comma, but I think my dislike stems largely from its poor implementation in many fonts. I don’t mind it too much when reading works set by the US Government Printing Office back before WWII, for example. (The USGPO printed for the Smithsonian, among a few other sources of linguistic research back then. Someone needs to do a typographic study of their practices and products over the years, which are a standing testament to the versatility of Scotch Modern.)</p>
      <p>As for its relationship to the caron as used in dcaron, lcaron, tcaron, I don’t think the combining comma should be considered related at all. The comma-accented caron is in my experience always an apostrophe shape, rather than the slightly smooshed appearance of many true combining commas. The two diacritics are in any case very different in their functions. You might also consider h-caron, i.e. U+0215 ȟ, which lacks the comma-accented form despite having an ascender because it lacks the weight of typographic tradition. It’s used for IPA /χ/, a voiceless uvular fricative, in some American languages.</p>
