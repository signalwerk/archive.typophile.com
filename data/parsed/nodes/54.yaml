  html: "<p>I'm wondering if anyone knows a key command (PC or MAC) that will create the lowercase letter \"o\" with a macron (horizontal line) over it. I realize this can be created using a program like Fontographer, but was hoping for a quicker, easier solution. I haven't been able to figure it out. Thank you in advance, and please feel free to e-mail me your response: <a href=\"mailto:kenny.eicher@imgusa.com\">kenny.eicher@imgusa.com</a></p>"
