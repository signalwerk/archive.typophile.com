    date_raw: 13 May 2004 — 5:47pm
    votes: null
    html: <p>Questions are great...  It is going to be a mix. The main portion of the paper is going to be more towards the Joe Friday (Just the facts) approach. At times almost an upbeat approach to presenting news since it is a community paper. There will obviously be a more hip section for the paper since it is so close to a college campus. The paper also is venturing to be a watch-dog for the community (as I think most papers should do anyway). <br> <br>Hope that clarifies the tone a little better. <br> <br>Thanks, <br>A</p>
