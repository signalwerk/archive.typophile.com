    html: <p>Adam look at a Foundry rather than a specific face. Go over to Font Bureau, they create alot of text faces for newspapers and magazines. You might want to use one font for the front section and another for the hip section. I like FB Village quite alot, readable with some interesting characters. FB Miller is nice too. For the funkier section you might use a san serif face like FB Hermes or FB Benton Gothic. What ever you choose they all have a wide range of weights.</p>
