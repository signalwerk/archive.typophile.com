    date: 2004-05-13T07:45:00
    date_raw: 13 May 2004 — 7:45am
    votes: null
    html: <p>It is about 100,000-150,000 people. The audience is kind of split actually. It is right between a college area and a new booming area of town. So there will be a focus on content for a younger crowd (18-28) and an older crowd with children who are in school. <br> <br>The paper is being introduced to fill a gap in the reporting from the local metro daily which doesn't have the ability to cover the area as well as a small community paper will. <br> <br>Thanks, <br>A</p>
