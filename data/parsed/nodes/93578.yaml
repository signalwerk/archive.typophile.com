    html: |-
      <p>The style is the one of Engravers Gothic/Sackers Gothic, or Blair.<br>
      Other similar include Sweet Sans, Corporation (<a href="http://www.myfonts.com/fonts/pavel-lipcean/corporation/">http://www.myfonts.com/fonts/pavel-lipcean/corporation/</a>), Anisette (<a href="http://typofonderie.com/fonts/anisette-family/">http://typofonderie.com/fonts/anisette-family/</a>).<br>
      Even more: <a href="http://www.fontshop.com/fontlist/genres/wide_grotesque/">http://www.fontshop.com/fontlist/genres/wide_grotesque/</a></p>
