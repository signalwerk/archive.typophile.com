    html: <p>The word ‘Pflanzl’ (or Pflanzerl, Pflanzel) is said to originate from ‘Pfann-Zelten’, i.e. a pan-fried flat pie. Most common is the ‘<a href="http://de.wiktionary.org/wiki/Fleischpflanzl" rel="nofollow">Fleischpflanzl</a>’ [hamburger].</p>
