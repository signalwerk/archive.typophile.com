      <p>Guess what: the text in the first sample actually is about stencil lettering! :-)<br>
      Translated, it says:<br>
      <cite>Before serving, take a sheet of paper according to the bowl’s form, cut out names or figures at will, place the paper on the crème, finely grind good chocolate and sprinkle it over the paper, remove the paper very slowly, that way the chocolate will leave an image on the crème of what was cut out of the paper.</cite></p>
      <p>Full transcription of the original:</p>
      <p><cite>Mandl-Crême.<br>
      Hierzu wird ein Vierling Mandeln gesotten, geschält u. dan(n) zusammengemengt.<br>
      Dan(n) wird eine Maß süßer Rahm, mit einer, auf einer Citrone abgerie-<br>
      benem Stück Zucker gekocht, auch allenfalls etliche Blätter Pomeranzen-<br>
      Blüthe oder ein Stück Zimt dazu genom(m)en u. hier auf die gewiegten<br>
      Mandeln hinein gethan. Wen(n) es nun ½ Stunde gestanden ist, schlägt<br>
      man 14 Eierdotter daran, seiht es durch ein feines Sieb oder Tuch, damit<br>
      die Mandeln hinweg kom(m)en, dan(n) gibt man es auf eine flache Schüssel<br>
      und lässt es auf einem Hafen mit siedendem Wasser zusam(m)engehen.<br>
      Ist der Crême fertig, so lässt man(n) ihn gut abkühlen. Ehe man ihn zur<br>
      Tafel gibt, schneidet man in einen Bogen Papier, nach der Form der<br>
      Schüssel, Namen oder Figuren nach Belieben aus, legt das Papier<br>
      auf den Crême, reibt gute Chocolade fein u. streut sie darüber, nim(m)t<br>
      das Papier ganz langsam von dem Crême ab, so wird dasjenige von<br>
      der Chocolade an dem Crême aufgezeichnet sein, was in Papier ausge-<br>
      schnitten ist. Andere Crême können auf die nämliche Art geziert werden.</cite></p>
      <p>F</p>
