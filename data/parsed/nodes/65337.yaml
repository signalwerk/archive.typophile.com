      <p>Delicious! Thanks, Hanno.<br>
      Here’s what I read into it. Any takers for the superscript abbreviation (?) in the recipe for Wirsing-Pflanzl, between ‘2’ and ‘Sem(m)el’? Is it ‘dl.’? Nina?</p>
      <p><em>Pflaumen-Kuchen<br>
      Man thut 3 Kochlöffel voll Mehl in ein Häferl,<br>
      schüttet Milch daran, bis es ein fester Teig wird, schlägt<br>
      3 Eier daran u. etwas süßen Rahm, salzt u. zuckert<br>
      ihn, läßt in einer Pfan(n)e Schmalz heiß werden, den Teig<br>
      hinein, läßt ihn anziehen, kehrt ihn um.</em></p>
      <p>Wirsing-Pflanzl.<br>
      Man siedet den 4. Theil von einem Wirsingkopf,<br>
      wiegt ihn fein, ein Stückchen kalten Braten, Zitrone<br>
      u. Petersil, weiche um 2 <strong>[?]</strong> Sem(m)el in die Milch<br>
      ein, winde sie aber [aber], drücke sie aus u. rührt alles<br>
      gut unter einander, nim(m)t dan(n) 4 Eierdotter dazu, das<br>
      Weiße zu Schnee geschlagen, salzt es, bestreicht<br>
      den Model mit Butter und backt es schön<br>
      heraus.</p>
      <p>Käs-Kuchen.<br>
      Man macht einen mürben Teig, walgt ihn Meßer-<br>
      rückendick aus, thut Dopfen ausdrücken, treibt ihn dan(n)<br>
      ab, schlägt 5 Eier daran, süßen oder sauren Rahm,<br>
      Weinbeer u. Zucker, rührt alles gut untereinander,<br>
      lege den ausgewalgten Teig auf ein Blech, bestreiche<br>
      ihn mit dem Abgerührten u. bäckt ihn bei schneller<br>
      Hitze.</p>
      <p>Schinken-Pflanzl.<br>
      Man macht von einem Ei, Fleckeln, wiegt etwas<br>
      von einem Schinken, thut Petersilgrünes u.<br>
