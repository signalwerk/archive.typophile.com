      <p>Hanno, thanks for posting this! Awesome. Do you have more? Please!!</p>
      <p>The first part of the second sample reads:<br>
      <cite>Butter lasse zergehen, die Hegfe auch dazu, dieses alles/ rühre in einem Hafen gut ab, ein schönes Mehl/ dazu bis der Teig die gehörige Dichte hat, lege dan[n] den/ Teig auf ein Brett, ziehe ihn auseinander, fülle ihn mit/ gewiegten Zwetschgen, schneide Stücke, rolle sie zu-/sam[m]en, bestreiche eine Reine mit Schmalz u. backe/ sie, zuvor lasse man sie aber gehen.<br>
      </cite></p>
      <p>The spelling of ‘Hefe’ [yeast] and the use of ‘Hafen’ [pot] and ‘Reine’ [pan] – the former maybe familiar from its diminutive ‘Haferl’ [mug] – indicate that this was written in Bavaria or Austria.</p>
      <p>One can also spot the two different origins of the modern eszett (ß):<br>
      At the bottom of the first sample, it says <cite>Rahm- oder Milch-Crême./ Man gieße Milch an 2 Löffel voll Mehl u. rühre es damit gut ab</cite> – ‘gieße’ is written with long s and tailed z; <strong>ſʒ</strong>.<br>
      In the second sample however, the second word, ‘lasse’, is written with long s and round s; <strong>ſs</strong>.<br>
      Both forms can be found in both samples.</p>
      <p>As Michael said: what a treasure!</p>
