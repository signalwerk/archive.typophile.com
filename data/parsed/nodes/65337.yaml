      <p>Another finding:<br>
      In the second sample, the first line of the recipe for <cite>Beschamel-Auflauf</cite> reads:<br><cite>Man nimt ½ Maß gute Milch, ¼℔. Mehl, ¼</cite></p>
      <p>‘℔’ is the then common abbreviation for ‘Pfund’ [pound], also known as the <a href="http://www.decodeunicode.org/de/u+2114">l b bar symbol (Unicode 2114)</a>. It arose from a script lb-ligature (for the Latin ‘librum’), see <a href="http://www.typophile.com/node/31818">this thread</a> on Typophile, or <a href="http://www.fontblog.de/pfundiges-zeichen">this one</a> on German Fontblog.</p>
