      <p>Language-sensitive handwriting!<br>
      While ‘Mandl’ [almond] is a German word and thus is written in Kurrent, the French ‘Crême’ is rendered in Roundhand! Nice.</p>
      <p>Totally illegible? No. Most Germans under the age of ~70–80 wouldn’t be able to decipher <a href="http://www.flickr.com/photos/hardwig/3066061485/">Kurrentschrift</a>, though. Back in school, I had an art teacher who taught us how to read and write it – lucky me. </p>
      <p>The recipe starts with: ‘Hierzu wird ein Vierling Mandeln gesotten, geschält u. dan(n) zusammengemengt’.<br>
      Vierling is an old South German weight unit which equals to 8 Loth or, nowadays, 140 grams.</p>
      <p><a href="http://en.wikipedia.org/wiki/Kurrent">Wikipedia</a> has an alphabet and a few links.<br>
      Like with other unfamiliar letterforms (Textura, for instance), it’s a matter of <a href="http://www.houseind.com/showandtell/2009/03/31/swiss-pre-modernism">practice</a>. That, and knowing the pitfalls:</p>
      <p>There’s the <a href="http://en.wikipedia.org/wiki/Long_s">long s</a> (ſ), the <a href="http://en.wikipedia.org/wiki/Z#Blackletter_Z">tailed ‘z’</a> (ʒ), and other blackletter characteristics, like unusual forms for ‘k’ and ‘x’. The ‘h’ has a descender aswell, and looks almost the same as a ‘long s’ with loops, or an ‘f’. </p>
      <p>The letter ‘c’ is a mere downstroke (like a dotless ‘i’), while ‘e’ is a double downstroke. Latter can easily be confused with an ‘n’. On top of that, ‘u’ is identical with ‘n’, were it not for the (curled) <a href="http://www.flickr.com/photos/tags/udistinguisher/">stroke above the ‘u’</a>. Not to confuse with doubled letters (like the ‘n’ in ‘dann’): they were often marked with an overbar.</p>
      <p>These similarities consequently lead to a zigzag overkill. <a href="http://faql.de/sonstiges.html#rekorde">Have a look at the word ‘Aluminiumminimumimmunität’</a> [aluminium minimum immunity – whatever that may be], written in Kurrent, at faql.de. Then you’ll know why this script badly needs a dotted ‘i’ and a ticked ‘u’!</p>
    html_clean: |-
