    html: |-
      <p>Hello all,<br>
      I know it is a pretty late reply (1,5 years!) :) but I got quite interested in the subject matter after reading your posts and made a small investigation. (and hopefully someone will read this anyway)</p>
      <p>At the Finnish Road Administration office they told me it is some sort of custom design similar to Helvetica Bold (sic!) created in the sixties and they admitted that engineers, not typographers, designed the letter forms. </p>
      <p>I heard that probably at some point the Finnish Road Administration will have to consider updating to a new typeface since, apart from not being too handsome, the letters don't function well on the reflective material used nowadays in traffic signs.<br>
      A good article about a similar situation in the US was published in the <a class="freelinking external" href="http://www.nytimes.com/2007/08/12/magazine/12fonts-t.html?_r=2&amp;adxnnl=1&amp;oref=slogin&amp;ref=magazine&amp;adxnnlx=1190189763-Mmz37gsx1bmBxABDDfsI6w" rel="nofollow">NY Times</a>.</p>
      <p>I was told that the letters don't exist in a standard font format but the shapes are available in AutoCAD files (which I will receive soon by email).<br>
      If I understood correctly every time a sign with altogether new content has to be created it has to be set manually letter by letter since no kerning values exist for the current font.</p>
      <p>Jan, if you would like me to send you the files once I receive them leave me a comment on my <a class="freelinking external" href="http://typotrip.wordpress.com" rel="nofollow">TypoTrip</a> blog (I don't want to publish my email here because of spam).</p>
      <p>Best,<br>
      Wojtek</p>
      <p>UPDATE 13:16<br>
      I have now received the shapes. If anyone's interested contact me as mentioned above.</p>
