    html: |-
      <p>Although there are only a few discrete letters in "MR PORTER"<br>
      and this makes it difficult to be sure,<br>
      it looks like Eyechart Bold</p>
      <p>A similar one (not so strong) is: Eyeglass Bold</p>
      <p>I found it using "Find my Font" utility: <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a><br>
      Fivos</p>
