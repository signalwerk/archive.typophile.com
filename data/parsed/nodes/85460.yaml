    votes: null
    html: <p>Eyechart Bold is very similar (rip-off?) to Engravers Gothic. Part of the thickess, MR PORTER woodmark is very close to <a class="freelinking external" href="http://new.myfonts.com/fonts/paratype/engravers-gothic/" rel="nofollow">Engravers Gothic</a>, something in between regular and bold weight (some kind of semibold). Could be Engravers Gothic (regular) artificially thickened with an outline stroke...</p>
