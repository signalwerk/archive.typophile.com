  html: |-
    <p>I was hoping someone might be able to help me identify the font used in the 'Mr Porter' logotype. I'm aware that the studio 'Saturday' had a lot to do with their re-brand, and know that the script font also used on the website was designed for them exclusively. Is the sans-serif in question the same, or is it an available typeface.<br>
    It would also be great to hear some suggestions of which other typefaces are similar...</p>
    <p><a href="http://www.mrporter.com/" title="http://www.mrporter.com/">http://www.mrporter.com/</a></p>
    <p>thanks in advance</p>
