      <p>Hi Justin!<br>
      I had started out with equal thickness, but as the hind part of "häusle" has a lot less ascenders than the front part, it came out much brighter in my printouts, so I increased the line width of those three letters a little bit to make them compete against the others better.</p>
      <p>Will definitely play up on the differences between the hs, though. Good advice, much appreciated!</p>
