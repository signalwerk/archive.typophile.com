    html: |-
      <p>Thanks for you reply, Alex.</p>
      <p>The diverting slant in the "u" results from the initial construction, which was based on the way you would write a u with joined up writing, as a series of loops, hence the slight thickening of the u's bars.</p>
      <p>I will straighten that and see it how it comes out.</p>
      <p>regarding the s, the hook shape is a regional thing. People learn to write it like that in elemetary school, so I thought I might add that to incorporate some of the local peculiarities.</p>
      <p>To straighten that thing out, I think I would have to add a "second storey" to the thing.<br>
      Not to thrilled about that beforehand but maybe the result will change my mind.</p>
      <p>Advice much appreciated, thank you!</p>
