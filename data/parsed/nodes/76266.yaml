    html: <p>I prefer the original s, partly because its similar to how I draw it with a brush. I can see very slight differences in the two h's and I think you should exaggerate those a bit more. You don't want people to think you've used a font! The a &amp; u still look a little heavy. Use the c as a model for a.</p>
