    html: "<p>Thank you both for your input.  <br> <br>Mark, Requiem it is. I had a (very) slight moment of doubt when I saw the \"Y\" at your link, but the character set also shows the \"Y\" used on the book. I'm sort of partial to that particular letter.  <br> <br>Just curious: Is there a special name for the vertical serifs at the ends of the \"T\" crossbar? <br> <br>My friend will be pleased, and I like it too. Thank you.</p>"
    html_clean: "<p>Thank you both for your input.  <br> <br>Mark, Requiem it is. I had a (very) slight moment of doubt when I saw the \"Y\" at your link, but the character set also shows the \"Y\" used on the book. I'm sort of partial to that particular letter.  <br> <br>Just curious: Is there a special name for the vertical serifs at the ends of the \"T\" crossbar? <br> <br>My friend will be pleased, and I like it too. Thank you.</p>"
  - id: 22977
