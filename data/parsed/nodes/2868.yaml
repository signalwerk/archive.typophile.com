    html: <p>Looks like Hoefler's <a href="http://www.typography.com/catalog/requiem/index.html">Requiem</a>. You can see it more clearly on <a href="http://www.amazon.com/gp/reader/0385315902/ref=sib_dp_pt/102-2383946-5488922#reader-link">Amazon</a>. (That includes the italic "of the" as well.)</p>
