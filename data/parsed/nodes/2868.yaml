  html: <p>Hi, Just to be clear, the title of this book refers to mail not to typography.  <br> <br>I mentioned this typophile forum to a designer friend, and he asked me to post the following. He's always wanted to know the name of this beautiful serif font. Any info is appreciated. Thank you. <br> <br><img src="http://www.typophile.com/forums/messages/83/25060.gif" alt="Book type for ID"></p>
