    date: null
    date_raw: null
    votes: null
    html: <p>Requiem has several alternate characters which can make it a little tricky to identify sometimes. The roughness of your sample image threw me at first, too. <br> <br>I don't think there is a special name for those vertical serifs. As far as I know they are just called vertical serifs.</p>
