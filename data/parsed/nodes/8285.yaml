  html: "<p>I can't identify the font used for the shirt numbers of Celtic and Chelsea (in Champions league games). It's a very bold Sans with a thin centered line. The 8 and 4 are curious characters. A picture of the Celtic 10 can be found on: <br><a href=\"http://www.goal.com/DWH_Club.aspx?idSocieta=223&amp;idStagione=9\" target=\"_blank\">http://www.goal.com/DWH_Club.aspx?idSocieta=223&amp;idStagione=9</a> <br>and clicking the left picture. <br>A picture of the Chelsea 8 is to be found on: <br><a href=\"http://www.chelseafc.com/matchreport.asp?id=268638&amp;nav=Navigation+-+Matches\" target=\"_blank\">http://www.chelseafc.com/matchreport.asp?id=268638&amp;nav=Navigation+-+Matches</a> <br>The Chelsea 22 can be viewed on: <br><a href=\"http://www.chelseafc.com/matchreport.asp?ID=268654\" target=\"_blank\">http://www.chelseafc.com/matchreport.asp?ID=268654</a> <br>Any suggestions?</p>"
