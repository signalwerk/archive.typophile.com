    html: <p>I've found it very hard to find a good shot of the letters from those sites you've given... I assume you're looking for the numbers on the back of the jerseys, correct? <br> <br>You could look through Mike's <a href="http://bowfinprintworks.com/LinedFontGuide01.html" target="_blank">Lined Fonts ID Guide</a>, but I haven't found anything to match exactly. <br> <br>How about <a href="http://www.myfonts.com/fonts/fontfont/ff-tokyo/one/testdrive.html?s=1234567890&amp;p=72" target="_blank">Tokyo</a> or maybe <a href="http://www.myfonts.com/fonts/parkinson/hotel/hotel/testdrive.html?s=1234567890&amp;p=72" target="_blank">Hotel</a> to get you started?</p>
