      <p>Wow, thanks for all the replies. I'm pretty familiar with the MICR / E13B origins of these typefaces, and in fact what I'm trying to do is track the influence through the correct lineage, so to speak. The one article I referred to in the post[1] is quite good in some regards, but I think the authors are incorrect on a few points and I want to make sure to get it right. For example, they discuss the proliferation of Data 70, but even some of the examples they show are definitely Moore Computer or Orbit-B. They do refer to Data 70 "and its variants," but even that is incorrect if Moore Computer came first. At any rate, Amelia is arguably MICR-based, as is Countdown (kind of a stretch), both of which definitely pre-date Data 70. Incidentally, my goal isn't to prove these guys wrong, I just want to make sure I get the order right when I discuss the history.</p>
      <p>Stephen: thanks for that link, one of the commenters mentioned Orbit-B, so now I finally have a name and a history for this other type I've been seeing but didn't have a name for. I think that actually may be the original font (seen on a U-Haul truck) that started me thinking about this to begin with.</p>
      <p>aluminum: I've been trying to come up with a name (assuming there isn't already a standard one) for that blocky thing that characterizes these fonts (is it technically a gigantic serif?), and "digital tumor" is certainly in the running now. I've also been considering "floating chad."  Google didn't think that was a common term, so is that yours?</p>
      <p>Ricardo: Too bad there's not much else in the WTF thread, but the first name of the designer is a huge clue. Thanks! </p>
      <p>[1] Owens, Mark, and David Reinfurt. "Pure data: moments in a history of machine-readable type." <cite>Visual Communication</cite>. 4.2 (2005): 144 - 150.</p>
