      <p>Kriss, this is an interesting hypothesis, and one well-worth thinking about. Among the various accounts of Data 70 one can find on the web, some of them at least seem to suggest this possibility. MyFonts, for example, says that Data 70 "simulates output generated by computers," which is pretty ambiguous but could indeed include the kind of practice you're talking about.</p>
      <p>I'd love to see an example of what you're describing if you can find one. Still, intentionality is a tricky thing in type design, it seems. So whether Newman intended Data 70 to mimic these hacker tricks you describe, it would still be possible and valid for type consumers to take Data 70 as a reference to MICR and use it as such. </p>
      <p>The journal article I mention in the first post here only mentions Data 70's origin in MICR, but the examples the authors provide of Data 70 allegedly in use are actually Moore Computer and Westminster -- two faces which bear a much closer resemblance to MICR (in my opinion) than Data 70. (FWIW, the earliest accounts I have of both Moore Computer and Westminster make it pretty clear that their designers each had MICR in mind).  And while the article gets the identification wrong, I think it still makes a valid point about Data 70's association with futurism, anxiety about cybernetics, and (originally) dystopia. </p>
      <p>My point is just that whatever inspired Data 70, it has been taken as a reference to MICR, which in my mind aligns it strongly with Moore Computer, Westminster, Orbit-B etc.</p>
