      <p>I found this post whilst searching for the origins of data 70 because I had a sneaky suspicion it may have been lost and the reality of where this futuristic computer font came from has always amused me.</p>
      <p>From this post I'm guessing it has, mostly because it's an origin in the hacker domain rather than design.</p>
      <p>You see the way I understand it, these fonts are not based on that icky MICR mess at all, they are based on old printers and hacker ingenuity.</p>
      <p>Old printers, attached to mainframes, used to have no fonts, all they could do was print text in normal, bold or italic. Italic was pretty much the same as normal but the bottom half of the letters where all shifted one pixel/dot to the left. Naturally, for it is what they do best, the hackers of that time worked out a few tricks. One of these simple tricks was printing text in normal, then backspacing and printing the same text over the top of this again but in italic. Creating strange letters that were normal at the top but bold at the bottom.</p>
      <p>Thus creating a new font, a new braver bolder font of the future... :)</p>
      <p>This would I guess have been sometime in the 60s, possibly even earlier.</p>
      <p>This simple trick of combining normal/italic to create a computer font, seems to have been lost as I've just been searching around for any reference to it and this post was actually the closest thing I could find.</p>
      <p>So I thought you might be interested, the two fonts you are talking about could have been built independently referencing this same source.</p>
      <p>Kriss</p>
