      <p>Luc Devroye has an interesting interview with Stan Davis, the creator of Amelia:<br>
      <a href="http://cg.scs.carleton.ca/~luc/amelia.html" title="http://cg.scs.carleton.ca/~luc/amelia.html">http://cg.scs.carleton.ca/~luc/amelia.html</a></p>
      <p>He mentions several of its associations, but doesn't quite say what he intended for it. For my part, I'm unclear whether to put it in the same category as Moore Computer et al. Its features look more fluid and globular (perhaps like solder blobs) than the right-angle strictures of MICR. But its certainly possible that Amelia's ability to associate with sci fi stems from its broad resemblance to Data 70.</p>
