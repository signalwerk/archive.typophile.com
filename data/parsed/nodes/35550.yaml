    <p>Hello,</p>
    <p>I'm doing a little bit of research on the history of typefaces designed to reference computers or video games. Specifically, one thing I'm trying to figure out is the relationship between <a href="http://www.myfonts.com/fonts/letraset/data-seventy/" rel="nofollow">Data 70</a> and this <a href="http://www.myfonts.com/fonts/agfa/computer/" rel="nofollow">Computer</a>. Data 70 is relatively easy to find out about, but "Computer" (probably because of its generic name) is much less so. </p>
    <p>One thing I'm trying to determine, for example, is which came first. The Monotype "Computer" I linked to above seems to be mostly identical to "Moore Computer" which I found in an undated VGC catalog. According to <a href="http://cg.scs.carleton.ca/~luc/vgc-typefaces.html" rel="nofollow">this</a>, Moore computer dates to 1968, but I can't find a source to corroborate that. If that's true, it's significant since I've got a journal article claiming that Data 70 (designed in 1970 by Bob Newman) was the first typeface to base its design on MICR (E13B) characters, subsequently influencing 70s design, particularly in sci-fi contexts. I have found uses of 'Computer' as far back as 1972, but I had assumed it was based on Data 70, much like the dozens of examples of Data 70-like lettering (check out the <a href="http://www.vidgame.net/PONG/magnavox/odyssey_logo.jpg" rel="nofollow">Magnavox Odyssey Logo</a> for example).</p>
    <p>Anyway, can anyone shed some light on this font? I'd be particularly grateful for any ideas on how I could confirm its date or figure out who designed it.</p>
    <p>Thanks in advance.</p>
