      <p>Good question, Hrant. By 'soft' I am thinking of bending the verticals. Often such faces are quite informal display faces, and have a lot of irregularity and swashiness, and are not so readable. </p>
      <p>But come to think of it Comic Sans is quite readable. Also I do think all the verticals in the roman lower case often gets you into trouble in a text face, creating too much dazzle and lack of differentiation, particularly in words like minimum and millenium. So, yeah, I would agree that softness in itself does not hurt readability. Just that most of them are not in fact designed with readibility in mind, and aren't particularly good in that respect.</p>
