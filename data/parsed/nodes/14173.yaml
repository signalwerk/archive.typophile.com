      <p>I think some of the wiki info, and the sources for that, got a bit garbled. Schelter Antiqua and Tauschnitz Antiqua (basically just some alts) were the start for Benton's Souvenir.</p>
      <p>Here's a comparison, Souvenir is the 2nd and 4th line:<br>
      <a href="http://www.incipit.com/images/SchelterSouvenirComp.jpg" title="http://www.incipit.com/images/SchelterSouvenirComp.jpg">http://www.incipit.com/images/SchelterSouvenirComp.jpg</a></p>
      <p>Um, I'm not 100% sure about the 1967 date for Ed B. starting his ITC version. "Souvenir" doesn't appear in the Photo-Lettering Alphabet Yearbook until the 1969 version (page 1317), but that certainly doesn't mean he wasn't working on one earlier. You've all probably read this, with a separate sighting:<br>
      <a href="http://www.stbride.org/conference2003/proceedings2003/phototype.html" title="http://www.stbride.org/conference2003/proceedings2003/phototype.html">http://www.stbride.org/conference2003/proceedings2003/phototype.html</a></p>
      <p>Lastly, I heard years ago that ATF Souvenir was first revived for Gold Medal Flour advertising, but haven't had time to track down an exact year or even verify if that's true. Nick Shinn's Art Paul attribution may be the best target.</p>
    html_clean: |-
