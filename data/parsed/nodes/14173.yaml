      <p>I too associate Souvenir with the '70s heyday of ITC, but in fact ITC Souvenir was a faithful photization of the original Benton font, large x-height and all. ITC did a bunch of other faces as "revivals" of Benton originals, including Cheltenham, Clearface, Franklin, Cushing, etc., but in most cases jacked up the x-height, cleaned up the quirks, and in general brought it squarely into the '70s.</p>
      <p>I've considered doing a serious digitization of the original Benton Souvenir, but have concluded that there's not that much that such a version would have to offer over the ITC version. Benguiat got his drawings right, and this particular font has such a low stroke contrast that it scales well even without ATF's magical optical scaling technology.</p>
      <p>I assume you've come across this link:</p>
      <p><a href="http://www.graphic-design.com/letters/tips/souvenir.html" title="http://www.graphic-design.com/letters/tips/souvenir.html">http://www.graphic-design.com/letters/tips/souvenir.html</a></p>
      <p>I was able to track down a sample of <a href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n2888.pdf" rel="nofollow">Schelter-Kursiv</a>, which certainly suggests a strong influence on Benton (the lowercase 'g' in particular is quite distinctive), but I think there's still a strong case to be made that Benton's interpretation, bringing his uniquely clean American look to the basic idea, was the first with all the ingredients for its widespread popularity.</p>
      <p>In the '80s, it was nearly as fashionable for type snobs to bash Souvenir as it is to bash Comic Sans today, but I will always have a warm spot in my heart for Souvenir because it was the main font in Ranger Rick magazine, a favorite when I was a wee lad.</p>
    html_clean: |-
