    <p>How do :o)</p>
    <p>I'm doing a little research into Morris Benton Fuller's Souvenir.</p>
    <p>On my travels I've heard lots of suggestion that it was very influenced by two german faces Schelter-Antiqua and Schelter-Kursiv from Germany’s Schelter &amp; Giesecke foundry. I've yet to track down any evidence to suggest this -- can anyone shed any light on the matter? </p>
    <p>It's not a typeface that everyone necessarily enjoys, but something about its longevity in the face of fashion intrigues me. It's nothing if not friendly, even if it is in a stupid grinning kind of way.</p>
    <p>If you know of anything interesting about souvenir, I'd really appreciate hearing about it.</p>
    <p>peas</p>
