      <p>I had clicked on the link in the 'new entries' box to get in, but then it blocked me when I tried to go back--same link. </p>
      <p>Anyway, since the wiki seems stuck, here is the additional info for those who are interested:</p>
      <p>Schelter &amp; Giesecke, a major German type foundry, had launched Schelter-Antiqua as their own original in-house design with very elaborate and beautiful specimens, an essay on its features, and a warning that they had protected it under German law (gesetzlich geschützt). It was intended as a very serious contender in the legibility stakes and the Schelter &amp; Giesecke specimen contains a fascinating 4-page article on it. There is much emphasis on the care put into avoiding over-fine hairlines and achieving good spacing. Having invested so much work in a complete series (condenseds and semi-bolds and so on) no wonder S&amp;G got legal protection for the face, in Germany at least. In fact there were several imitations, and one of them (not very close, but not that distant either) from an Austrian foundry was called 'Souverän'--probably not coincidentally similar in name to Souvenir.</p>
      <p>Benton had produced at the same time his entry in the legibility stakes, namely Clearface. Perhaps for this reason, he took some ideas from Schelter-Antiqua, but went a different direction, giving it a distinctive 'cuddly' look quite different from the German type. Its origins as a 'legibility' face, as well as Benton's and then Benguiat's skills, may account why among 'soft' designs it stands out as extremely readable.</p>
