      <p>Here is the info from Myfonts about Souvenir:</p>
      <p>"Souvenir was originally drawn by Morris Fuller Benton in 1914 as a single weight for the American Type Founders company. It was revived in 1967 by Photo-Lettering and optimized for phototypesetting equipment. ITC was formed in 1971 and, with the help of Photo-Lettering, introduced ITC Souvenir as one of its first typeface families. ITC Souvenir was designed by Ed Benguiat and comes in four weights, each with a matching italic."</p>
      <p>Mac McGrew's 'American Metal Typefaces of the Twentieth Century' adds some interesting information. Its working title was 'Round Roman' and the original one-weight metal version achieved little popularity. The photo type version by Benguiat was so popular that 'Matrotype' in England cut metal faces based on it, one of the few cases of a photo type being cut in metal. </p>
      <p>I agree with Nick that Souvenir is a very good typeface. It is 'warm and fuzzy' and designers, who have to look at the stuff all day tend to get sick of this mood pretty fast. However, the public, who look at a sign or ad now and then with such type, appreciates its warmth. </p>
      <p>Among 'warm and fuzzy' types, Souvenir is outstanding, as Nick says, in how well it works together. Note that the light version, which Nick feels is best, is Morris Fuller Benton's. The heavier weights, as McGrew explains, were drawn by Ed Benguiat. I don't know if Benguiat redrew the light version, or this is a pretty faithful revival of that weight.</p>
