      <p>Also, Golden Retrievers always come back!</p>
      <p>The interesting aspects of the faces like Souvenir that became "popular" in the late 60s through early 70s was that the heavy bulbuous weighted faces were originally popular in the early 1920s.</p>
      <p>I'm not sure when <a href="http://www.linotype.com/7-2411-7-18184/itcsouvenir.html" rel="nofollow">Souvenir Bold</a> came on the scene (M.F. Benton or Photo-Lettering?) but Oswald Cooper's <a href="http://www.linotype.com/7-2112-7-16759/cooperblack.html" rel="nofollow">Cooper Black</a>, produced 1921, became so popular that Lanston Monotype released <a href="http://www.p22.com/lanston/products/heavyface.html" rel="nofollow">Goudy Heavyface</a> in 1925 to rival it.</p>
      <p>All of these were revived and widely used during the 1970s.</p>
      <p>----------------------------------------<br>
      Yes, I'm old, but I'm not bulbuous!</p>
