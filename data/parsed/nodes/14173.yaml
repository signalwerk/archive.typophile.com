      <p>I don't know anything more than you do of its origins.<br>
      So for want of anything better, this is by way of an appreciation.</p>
      <p>The earliest usage I've come across, other than in a specimen, was for the title of an article in a mid '60s Playboy magazine. Arthur Paul liked to use a lot of exotic types, as did many ADs at the time. That was before Ed Benguiat did the ITC family.</p>
      <p>When I started work in Toronto in the mid '70s, Souvenir and Korinna were the hot faces, which was cool because I worked in a small promotion company, and we actually had them, on our Quadritek typesetting system. They were much despised even then (ubiquity does that), but quite useful. The light and bold weights of Souvenir brought a very fresh look to typography. The italics, same width as the roman, gave a modern look to layouts.</p>
      <p>Souvenir has always been my favorite Benguiat face. I love the originality of the letterforms, yet they all work together. The style is derived from art nouveau, but always struck me as being futuristic. Ed's workmanship/design is astonishing, virtuoso, and beautiful, especially on the light weight.</p>
      <p>The Swash variants are somewhat tacky. But hey, they did it to Caslon.<br>
      Some of those po-faced Dutch faces could do with a good swashing.</p>
