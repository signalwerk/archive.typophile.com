    html: |-
      <p>There seems to be some distortion in your image. Is this printing on fabric?</p>
      <p>The A is unusual for two reasons: it has the half top serif, and it has almost no serif on the right leg. The closest A I have found to this is <a class="freelinking-external" href="http://new.myfonts.com/fonts/adobe/hiroshige/">Hiroshige</a>, but it doesn’t seem to be a very close match for other letters like the R and T. Another calligraphic serif is <a class="freelinking-external" href="http://new.myfonts.com/fonts/ef/itc-tiepolo/">Tiepolo</a>, but I can’t say that’s a clear match either.</p>
      <p>Anyone else have any ideas?</p>
      <p>- Mike Yanega</p>
