  html: |-
    <p><strong>Sudtipos</strong> proud to announce the release of <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000597#specimen" rel="nofollow">Voyeur</a></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typovoyeur_5532.png"></div><p></p>
    <p>Since you like to look, Angel Koziupa and Alejandro Paul bring you Voyeur, an entirely different direction from their usual collaborations. This typeface attracts two opposite design theories by mixing bold and blocky modernism with delicate ornamentals. The unlikely mix is not haphazard, however. It is calculated with an alchemist's (or voyeur's) attention to detail. This font includes many, many different ornamental treatments, each adjusted specifically for its letter form counterpart. Open your glyph palette to find plenty more variation and alternative combinations.</p>
    <p>For everyone's eyes only.</p>
    <p><strong><a href="http://www.sudtipos.com" rel="nofollow">Sudtipos fonts</a></strong></p>
