      <p><cite>Do non-Icelandic designers care enough to properly design and kern the ð for example?</cite></p>
      <p>I assume you’ve read your <a href="https://web.archive.org/web/20080821195100/http://briem.ismennt.is/2/2.11/2.1.5.eth.trouble.htm">Briem</a>? ;-)</p>
      <p>For your question:<br>
      I guess you have to accept that you can’t separate typography from language. Let me explain. To my knowledge, a ‘g’ followed by an ‘f’ is absolutely rare in English language.*) In German, though not very frequent, it’s more common. A few words that come to my mind: wegfallen [to drop out], Bergfahrt [ascent], Tagfalter [butterfly], dingfest [fixated] – let alone names like Siegfried or Mangfall.<br>
      This, of course, is due to the orthographic convention of writing compound nouns in one word: Ringfinger.</p>
      <p>Now have a look at this. A simple term, in two languages, set in a common typeface – common both in England and Germany.</p><div class="imageWrap"><img src="/web/20080821195100im_/http://www.typophile.com/files/Baskerville_4083.png"></div><br>
      While the ‘train conductor’ looks perfectly normal and unobtrusive (that’s what typographers want to achieve, usually), the ‘Zugführer’ has two major problems:<br>
      1. ‘g’ and ‘f’ collide, although kerning is on.<br>
      2. It has a capital letter, which is/might be inappropriately fancy<p></p>
      <p>The design of Baskerville isn’t defective – it’s just British. That is, it doesn’t have to repress its descenders, because they’ll hardly ever meet. And it may have swashy caps, because those are rare and <em>should</em> stand out.</p>
      <p>Baskerville (or Caslon) will look best with English text. And German will look better with typefaces made by designers who are aware of its peculiarities. Just compare to <a href="https://web.archive.org/web/20080821195100/http://www.fontshop.com/fonts/singles/linotype/aldus_lt_std_italic_ot/?sample_text=ein%20Zugführer&amp;sample_size=48">Aldus</a>, <a href="https://web.archive.org/web/20080821195100/http://www.fontshop.com/fonts/singles/linotype/stempel_schneidler_std_italic_ot/?sample_text=ein%20Zugführer&amp;sample_size=48">Schneidler</a> or <a href="https://web.archive.org/web/20080821195100/http://www.fontshop.com/fonts/singles/fontfont/ff_meta_serif_lf_book_italic/?sample_text=ein%20Zugführer&amp;sample_size=48">Meta Serif</a>. I’m not saying that this is a black-and-white issue, nor that Non-Germans can’t design<!--
