      <p>“Do non-Icelandic designers care enough to properly design and kern the ð for example? I admit that while I do care it’s low on my list.”</p>
      <p>Yes, we do care enough. If you include glyphs in a font, they should be given equal respect and attention as those of your native tongue. Think of the user. If they purchased a typeface seeing Icelandic glyphs were there, they assume they are usable for their language. Type design requires attention to detail and caring for other language characters is part of it.</p>
      <p>ChrisL</p>
      <p>Here is a starting point:</p>
      <p><a href="https://web.archive.org/web/20080821195100/http://diacritics.typo.cz/index.php?id=12" title="http://diacritics.typo.cz/index.php?id=12">http://diacritics.typo.cz/index.php?id=12</a> </p>
