    <p>Here’s one to ponder. It became quite obvious in <a class="freelinking-external" href="https://web.archive.org/web/20080821195100/http://typophile.com/node/43879">this other thread</a> that as a native English speaker, I am insufficiently prepared for non-English design issues like clashing diacritical marks and the historical use of certain ligatures and digraphs.</p>
    <p>English speakers are probably more susceptible to this — as English uses a simpler set of characters than other European languages — but written differences must exist in multiple directions across cultures and languages. So I was wondering what top traps type designers might fall into, through natural ignorance of other cultures and writing systems. Do non-Icelandic designers care enough to properly design and kern the ð for example? I admit that while I do care it’s low on my list.</p>
    <p>So, do any grievances with English (or other) speaking designers need to be aired, or are there any other things I should be aware of before I kern and wrap-up my current design?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080821195100/http://www.typophile.com/node/44082" class="topic-previous" title="Go to previous forum topic">‹ My "type" of restaurant...</a> <a href="/web/20080821195100/http://www.typophile.com/node/39537" class="topic-next" title="Go to next forum topic">Any advice on typeface for a gravestone ? ›</a></div>
