    <p>Really quick — and hopefully not too stupid — question about the FontLab Metrics window:</p>
    <p>Anybody know if there’s a way to increase the leading between multiple lines of type displayed in the Metrics window? I can’t find a preference. This applies to the window display and the printed Font Samples.</p>
    <p>I’m finding it more difficult than it could be to reasonably judge colour in a paragraph or with multiple lines because they’re set solid. This also means the kerning marks beneath pairs often clash with ascenders in the line below — another hindrance to determining the look/colour/balance of a whole paragraph.</p>
