    <p>A week ago I got a project from a client in which I have to complete a design that was started by another designer. My client really likes the fonts and wants me to use the same one for the rest of the project. They only have a jpeg copy of the design. I do not have a clue what is the name of these fonts and I tried every where and last time I had a meeting with the client they said that the previous designer worked at a sign writing company so I’m thinking maybe they have them available on their programs, if you can help me recognize the font it would be greatly appreciated. </p>
    <p>Thank you</p>
