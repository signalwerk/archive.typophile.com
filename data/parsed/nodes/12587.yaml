  html: |-
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Tools" class="freelinking" rel="nofollow">Tools</a> : <a href="/wiki/Type%20Design%20Tools" class="freelinking" rel="nofollow">Type Design Tools</a> : Visual TrueType (VTT)</strong></p>
    <p>Expert's font tool from Microsoft for dealing with the low level software language of editing <a href="/wiki/hinting" class="freelinking" rel="nofollow">hinting</a> information for <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> fonts, and <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts using TrueType outlines (<a href="http://graphics.cs.ucdavis.edu/GraphicsNotes/Quadratic-Bezier-Curves/Quadratic-Bezier-Curves.html" rel="nofollow">Quadratic Bezier</a>) for the glyphs. The program itself is friendly enough, but <a href="/wiki/TrueType%20hints" class="freelinking" rel="nofollow">TrueType hints</a> are encoded in their own stack-based programming language -- as complicated as the language used to describe font outlines themselves -- and the GUI can go only so far to mask the complexity and power of the hints. </p>
    <p>Originally designed by the architect of the TrueType font format, <a href="http://www.typesolutions.com/" rel="nofollow">Sampo Kaasila</a>. Released as 'TypeMan' for the Macintosh. Completely rewritten by Beat Stamm of Microsoft Typography and released for both Windows and the Macintosh. </p>
    <p>Available from <a href="http://www.microsoft.com/typography/tools/vtt.aspx" rel="nofollow">Microsoft Typography</a> upon completion of an application. Both Windows and Mac OS are supported.</p>
