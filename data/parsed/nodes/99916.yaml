    html: |-
      <p>Gestural does not require thick-and-thin drawing.  A line can have a gesture and be of one weight.  Matisse has demonstrated this in some of his work.<br>
      Most handwriting in modern times is written with a tool that is not broadnibbed.  True, weight of pressure and speed of stroke can make a line fade to some degree, even with a rapidograph.<br>
      If a child learning to write, traces the pathways of letterforms, it makes sense that this can take part in the imprinting of the form as well as the visual learning.  I have a hard time seeing how this would vary with culture--Even if a given culture is more prone to using a brush instead of a ballpoint pen. It would seem that whatever makes a cultural variance is a function of the typical tool mixed with the script.</p>
