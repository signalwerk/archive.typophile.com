      <p>Nick, Nick, Nick…</p>
      <p>Your “component letters” theory is so…2004. Surely, in the ensuing nine years, the ideographic theory has regained some of its lustre (a tip o’ the Hatlo hat to the Brits in the forum), if not <em>panache</em> , <em>élan</em> and/or <em>joie de vivre</em> (likewise to the Frenchies).</p>
      <p>In the end, <strong>how</strong> we read has nothing to do with what shapes culture; it’s <strong>what</strong> we read, and—increasingly—what we <strong>don’t read but are incessantly exposed to</strong>, that shapes culture…such as it is…</p>
