      <p>Thanks for posting this, Peter. Very interesting.</p>
      <p>It makes sense, of course, that over the long period in which, as Bringhurst notes, everyone who was a reader was also a writer, the reading process would have harnessed a motor gesture decoding system. A lot of interesting questions arise from this, especially with regard to the variable balance of visual and gestural pathways in the context changing text cultures. Are we, for instance, in the midst of a change in that balance due to the relative infrequency of handwriting and its secondary role in text creation in our culture?</p>
