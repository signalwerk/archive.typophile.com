      <p>One question in regard to this statement: <cite>Indeed, recent developmental data show that reading acquisition is facilitated when young children are taught to write or finger-trace the letter shapes compared with classical grapho-phonemic teaching without a haptic component.</cite></p>
      <p>Would the haptic component also be enhanced by letting children learn to write (i’m speaking of Latin languages/scripts now) their script with a broad-nibbed pen to better distinguish the pattern of letters? Nowadays they have to write their letters (very close to printed letters with almost no handwritten origin) with ballpoint pens showing no stroke contrasts, resulting in writing and reading difficulties.<br>
      Or am i moving too far from the above thesis?</p>
