      <p>The problem with depicting a warning for ionizing radiation is that you can't really sense it apart from being a little bit warm. How does one illustrate an invisible fire that will make you sterile and give you cancer and make your hair and teeth fall out in some days to weeks' time? How does one even imagine such an image? Abstract symbols pulled out of one's arse seem to be the only recourse, and with those you need a massive public education campaign, and we're back to where we started.</p>
      <p>Yes, large sources can get a very very hot. That's how nuclear power plants work, but if you're close enough to feel it that much you're pretty well cooked already.</p>
