    html: |-
      <p>The point of this ugly thing is that the radioactive symbol on its own is meaningless without familiarity. If I didn't know what it meant, I'd assume it was a ventilation fan. The biohazard symbol has the same problem; though it doesn't really resemble anything, it doesn't look all that unplesant without understanding its usage.</p>
      <p>The triangle frame is an interantional symbol for "Danger" but it too is entirely abstract. Nothing particularly dangerous about it, except that it might hurt if you sat on one.</p>
      <p>The skull and bones has had pretty long use as a symbol for poison, but this could have been handled with better stylistic consistency. But what does this symbol really say? Is it "this will make you dead" or "Warning: pirates"?</p>
      <p>The running man symbol is the only one that is totally intuitive, and even that has the problem of having a directional arrow. What will people do if the exit is in the opposite direction?</p>
