      <p>I've said before that a foolproof world is an ugly world. I feel vindicated, which is not the same as satisfied.</p>
      <p>"The symbol is to be placed on the device housing the source, as a warning not to dismantle the device or to get any closer. It will not be visible under normal use, only if someone attempts to disassemble the device."</p>
      <p>So, <strong>it says</strong> the ceiling fan is falling at a rate that is fatal unless you jog (that way -&gt;), <strong>but it means</strong> "not to dismantle the device or to get any closer". Now, is it so badly designed that it is not only ugly, but broken as well, by the same misguided designers? I don't think I am being too philosophical to say that there might be a correlation. Way to go, team of "human factor experts, graphic artists, and radiation protection experts" and middle management, conservative brass and PR-monkeys.</p>
