      <p><em>How does one illustrate an invisible fire that will make you sterile and give you cancer and make your hair and teeth fall out in some days to weeks’ time? How does one even imagine such an image?</em></p>
      <p>Photos of Tammy Faye Baker w/o the paint? Give the right idea instinctively.</p>
      <p>I just think that a mod of the existing symbol is the right idea. It puts to use the fortune already spent on education. With as many people as there are already aware of it, it isn't worthless. But it isn't stellar, as it is too abstract, and only seems to be chosen because it look like it belongs with similar symbols (biohaz./fallout shelter). There are a lot of ideas that might work better. Flames made of dotted lines? A diseased, shedding cat? Mr. Yuck with x's for eyes? Mr. Yuck is great, from a universal stand point, I imagine.</p>
      <p>I suspect a team of professionals could come up with something both abstract and pertinent.</p>
      <p>The other problem, I think is that the Rad symbol has been overused, decreasing it's alarm. Since people see it where there is indeed radiation, but they are very unlikely to suffer adverse affects (normally), they disregard the mediocre symbol. Which is why the IAEA wants the new symbol to mean, "dangerous, no really this time"; we broke the last one.</p>
