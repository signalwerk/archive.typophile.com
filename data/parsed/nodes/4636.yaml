    html: <p>I recently designed a brochure on my MACG4 using Illustrator. I originally thought the client wanted me to send the files to press, however I learned after-the-fact that they were going to print from their destop-printer and gbc-bind for their presentations. They couldn't use my MAC fonts and I purchased fonts from FONTS.COM that matched my font names... the client could use a few of them, the ones that came in with .TTF (True Type Fonts), however a couple of the most important fonts came in as Windows Postscript Fonts. The client couldn't install for some reason on his PC. QUESTION. If I buy OpenType Fonts with same names as my original fonts, can I use them on both my MAC and their PC platforms? Also, is it possible to use TrueType on the MAC... I always thought NO, but who knows?</p>
    html_clean: <p>I recently designed a brochure on my MACG4 using Illustrator. I originally thought the client wanted me to send the files to press, however I learned after-the-fact that they were going to print from their destop-printer and gbc-bind for their presentations. They couldn't use my MAC fonts and I purchased fonts from FONTS.COM that matched my font names... the client could use a few of them, the ones that came in with .TTF (True Type Fonts), however a couple of the most important fonts came in as Windows Postscript Fonts. The client couldn't install for some reason on his PC. QUESTION. If I buy OpenType Fonts with same names as my original fonts, can I use them on both my MAC and their PC platforms? Also, is it possible to use TrueType on the MAC... I always thought NO, but who knows?</p>
