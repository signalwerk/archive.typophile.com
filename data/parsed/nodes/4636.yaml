    html: <p>Matthew,  <br> <br>what exactly are you trying to install on Windows? Mac Type 1 fonts? Or Windows Type 1 fonts? Windows Type 1 fonts don't have any sort of "bitmap files".  <br> <br>The primitive necessity to have mandatory bitmaps along with Type 1 fonts is a MacOS-only limitation.  <br> <br>MacOS supports Mac Type 1 fonts (suitcases with LWFN printer files). Windows supports Windows Type 1 fonts (.pfb and .pfm files). Please be more specific on what you are trying to achieve, on what (exactly) system and how you are proceeding (step by step).  <br> <br>Adam</p>
