    html: <p>The only reason to install ATM Light on Windows 2000 (or XP) is if you need support for "multiple master" Type 1 fonts. <br> <br>Also, if you've installed and deinstalled some older version of ATM Light, you may have broken Windows native support for both Type 1 and PostScript flavored OpenType fonts. You'll know because you won't be able to install them and will get error messages. In that case, you need to install a patch available from Adobe to fix the problem. Installing the latest ATM (Light or Deluxe) will also fix the problem. <br> <br>T</p>
