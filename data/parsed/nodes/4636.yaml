    html: <p>All you need on Windows are <i>either</i> <br> <br>PFB + PFM <br><i>or</i> <br>PFB + AFM + INF <br> <br>The PFB file contains the outlines. The other files contain metrics, kerning and other information. The PFM essentially contains the same information as the AFM and INF, but in a different form. The PFM is always what is registered as an installed font (although both it and the PFB are actually installed); if you install using the AFM + INF combination, Windows will generate a PFM during the install process. <br> <br></p>
