  html: <p>I'm trying to install a multiple font family in windows that is postscript. I'm not using any font management software, just dragging and dropping. When I try to install multiple bitmap files, after the first file is installed, it won't let the rest of the bitmap files install. Is there a way/program to consolidate the bitmap fonts into one file? Is this the problem? </p>
