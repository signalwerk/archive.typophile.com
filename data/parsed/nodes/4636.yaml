    html: "<p>Tar: <br> <br>Apple invented TrueType, and all the Mac system fonts are TrueType, so you can definitely use TrueType on a Mac! However, both Type 1 and TrueType fonts come in Mac and Windows flavors. Mac OS X can use Windows style TTF fonts, but they don't work with applications running in \"Classic.\" <br> <br>As for OpenType, Adobe carefully changed all the names for their OpenType format fonts relative to the Type 1 versions. So you couldn't just substitute without updating the file. <br> <br>Note that the client should be able to use Windows Type 1 fonts on just about any version of Windows. They may need to install ATM Light if they have something quite old, or perhaps they need the same patch mentioned earlier in this thread. <br> <br>T</p>"
    html_clean: "<p>Tar: <br> <br>Apple invented TrueType, and all the Mac system fonts are TrueType, so you can definitely use TrueType on a Mac! However, both Type 1 and TrueType fonts come in Mac and Windows flavors. Mac OS X can use Windows style TTF fonts, but they don't work with applications running in \"Classic.\" <br> <br>As for OpenType, Adobe carefully changed all the names for their OpenType format fonts relative to the Type 1 versions. So you couldn't just substitute without updating the file. <br> <br>Note that the client should be able to use Windows Type 1 fonts on just about any version of Windows. They may need to install ATM Light if they have something quite old, or perhaps they need the same patch mentioned earlier in this thread. <br> <br>T</p>"
