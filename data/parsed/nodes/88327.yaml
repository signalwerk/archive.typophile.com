      <p>This is my feeble attempt to come up with an overall 'font naming' scheme that could work for all of us.</p>
      <p>1) TypeFaceName 25, TypeFaceName 26... all the way to TypeFaceName 95, TypeFaceName 96</p>
      <p>15, 25, 35, 45, 55, 65, 75, 85, 95 and 100 (allows for up to 10 weights in total). Hell, you could even continue upwards (115, 125) if needed. But I think '100' (10 weight categories) is a pretty generous weight progression scheme.</p>
      <p>No need to add 'Ultra Thin...Ultra Thin Italic, etc. This numbering scheme has been successfully used by Neue Helvetica and other such font families. I think many users understand this numbering scheme (55 being the middle and regular or normal weight). Odd numbers for 'roman' and 'even' (like 26, 36, 46, 56...) for cursive or oblique styles.</p>
      <p>2) As far as Condensed or Expanded variations on the family could be added as... TypeFaceName 51 (could refer to Narrow), TypeFaceName 52 (Narrow Italic), etc. TypeFaceName 53 (could refer to Condensed), TypeFaceName 54 (Condensed Italic). And, TypeFaceName 57 (could refer to Expanded), TypeFaceName 58 (Expanded Italic), etc. TypeFaceName 59 (could refer to Ultra Expanded), TypeFaceName 60 (Ultra Expanded Italic). Although, for the most part, most families would only include a Cond. and Expanded variation. But, there is room in this scheme for 'ultra' extreme width variations.</p>
      <p>3) An added extension for 'Swash' could be SW, an extension for 'Small Capitals" could be Sc, Old Style Figures OsF, Decorative Ornamental Capitals DOC, Display could be DSP, Stencil could be STN, Outline could be OUT, Graffiti could be GRF, etc.</p>
      <p>4) Optical axis could have 'XL' for 'x-height Large".</p>
      <p>I really think something like this makes a lot of sense.</p>
      <p>It eliminates the problem with really long font names. FontLab has a maximum limit of 31 characters for a font name anyway.</p>
      <p>This simplifies everything. You can add 'Where no man has gone before...variations' as WNMHGB or whatever.</p>
      <p>So, a complete example incorporating a lot of this would look like...</p>
      <p>TypeFaceName 25 ScOsF XL</p>
      <p>Short and sweet! What do you all think? Is this a possible complete 'font naming' solution to all our problems going forward.</p>
      <p>Any and all other ideas welcome. Thanks.</p>
