      <p>&gt;So the x-height isn't the only thing changing?</p>
      <p>Let me clarify a bit more... I created an idea for a new serif font family.</p>
      <p>After mastering and testing, I decided that the x-height looked a bit too large overall, aesthetically.</p>
      <p>So, I created an alternate version... proportionally smaller x-height, which allowed for taller ascenders and decenders.</p>
      <p>Basically, an 85% reduction, with some added weight to keep the color working well with the existing capitals.</p>
      <p>However, I think both variations could work well together, or separately, under different typographic conditions, and depending on the copy size.</p>
      <p>Soooo, with this in mind, what would be best. Use something like 'XL' or call it 'Small Text'.</p>
      <p>I'm not sure which would be more proper. Thanks.</p>
