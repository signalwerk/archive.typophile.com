    html: |-
      <p>The system has its merits… But:<br>
      - No system could ever account for all possible variations. Especially outside text families and type systems (a la Univers, which I think was the first to introduce the numbering scheme).<br>
      - My ultralight is your hairline, is others’ white. And this holds true for my 15 and your 15.<br>
      - If 55 is regular and 56 is italic or oblique, what will happen if my font has both?<br>
      - Acronyms aren’t human friendly. And there are already too much acronyms in font names (or you do think foundries will abandon their prefixes just for the sake of tiding up our menus?).<br>
      - I don’t think XL is a good solution for large x-heigh. First of all is uppercase, then it looks something which is applied to the entire typeface, being mostly viewed as a size symbol. I would think it’s the cut for clients that want to “make the logo bigger!” ;-)</p>
      <p>All that said, sure a system could be useful, but I don’t think you will find consensus. But you can start implementing it with your own fonts, encouraging other to adopt it. If it will make sense to them (as it did with Neue Helvetica), people will follow suit.</p>
