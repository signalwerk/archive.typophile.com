      <p>&gt;hrant, yes, I read through the other thread. Thanks. And, I like all your suggestions. You made many good points. The overall discussion was very interesting. But sadly, nothing was really resolved. Just some good ideas and no definitive set of guidelines to follow.</p>
      <p>As you know, there are many variables that can change in an extended family of fonts.</p>
      <p>Here are some examples: (for general discussion)</p>
      <p>1) Weight<br>
      2) Styles— Cursive or oblique, small caps, lining vs. old style figures (tabular &amp; proportional).<br>
      3) Swash, decorative capitals, special endings and alternate 'glyphs'.<br>
      4) Condensed and expanded typeface variations.<br>
      5) Optical axis—(x-height, stem, hairline, serif lengths) overshoots and overall body proportion changes.<br>
      6) Outline and other effect variations (stencil, distortions (graffiti), etc.)<br>
      7) Where no man has gone before...</p>
      <p>For weights, I like the numbering solutions... (25 Ultra Thin, 26 Ultra Thin Italic...95 Ultra Black, 96 Ultra Black Italic, etc.)</p>
      <p>But, I have also seen type designers name their weights (200, 300, 400...900) and with variations like (200-A, 200-B, etc.)</p>
      <p>I like the numbering scheme, simple and elegant. Easy to understand.</p>
      <p>But, shouldn't we all be using a 'naming template' or guidelines for just such things?</p>
      <p>I think the 'key' here is consistency. A standard 'code' that we should all go by, so that the user is not confused by all this new terminology.</p>
      <p>I do not want to reinvent the wheel, perhaps there already is a PDF guideline online for just this sort of thing.</p>
      <p>If there is, please point me in the proper direction.</p>
      <p>It would be great if we all had and used this 'common' naming scheme going forward.</p>
      <p>Maybe we can come up with 'extensions' that would properly tag all fonts with all variations listed above.</p>
      <p>That would be great! Thanks all.</p>
