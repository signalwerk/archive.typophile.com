    <p>I'm in the process of creating an extended family of fonts.</p>
    <p>One of the variables I'm introducing is a substantially larger lower case x-height.</p>
    <p>Question: Besides calling the "larger x-height" font "TypefaceName_6 point", or distinguishing  between text and display, what would be a better approach to an overall naming convention for the entire series?</p>
    <p>Any ideas appreciated. Thank you.</p>
