      <p>Sorry to be late to the party. David, my comment about CT italics on the ATypI list was not that 'that Italic styles needed to be lightened from their nominal weight for print'. On the contrary, what I noted was that although the diagonal stems gather more pixels the colour filtering makes them appear lighter than the vertical stems (although this is in part dependent on the tuning of the CT renderer). So in order to maintain a good contrast (notan for Hrant) in the italic, you do <em>not</em> want to make it too light. So my recommendation is to sort out the weight of the italic first with a few test glyphs, and then derive the appropriate weight for the roman relative to the italic.</p>
      <p>Here is the exchange from the ATypI list. Your initial quetion in italics, and my response in bold. The link is still live.</p>
      <p><em>We all know that to make a non-upright style to match an upright style, you make the non-upright style lighter to compensate for the angle, and you're done for print. But we also know you cannot trust the weights to look right on the screen, because the upright gathers fewer pixels than the non-upright, the "color" of the non-upright out darks the upright, (until it's time to print).</em></p>
      <p><strong>Some of this depends on how one tunes the CT renderer. What I notice, with the fairly light tuning I use, is that although the oblique stems gather the same number or more subpixels than the upright, the colour filtering is such that they appear lighter. The contrast of the pixels gathered in the upright stems tends to have a higher contrast than those in the oblique.</strong></p>
      <p>When I was designing Constantia, my solution to the issue was to make the roman a touch darker than I would have for a purely print type, and this gave me more leeway with the weight of the italic: I could ensure that it didn't render darker than the roman without making it too light when printed.</p>
      <p>See: <a href="http://www.tiro.com/John/CTroman-italic.gif" title="http://www.tiro.com/John/CTroman-italic.gif">http://www.tiro.com/John/CTroman-italic.gif</a></p>
      <p>[Note that this screenshot is of Windows XP CT rendering in Word, so does not display subpixel positioning. The usual caveats apply about looking at ClearType in screenshots, especially on different monitor resolutions.]</p>
    html_clean: |-
