      <p>&gt; 8 pixels per em, is the minimum in a Hrantless world</p>
      <p>And a Fleishmann-less world, and a Tracy-less world, and...<br>
      Abbreviating x-height features to give some more room to<br>
      the extenders is a very old trick, and there’s no reason it<br>
      can’t be applied to save em-space in bitmap fonts (if you<br>
      really want to save as much space as possible, which is of<br>
      course never the only factor).</p>
      <p>Furthermore, you can make an “e” like John’s (in fact people<br>
      already have) and readers will read it fine as an “e”; you can<br>
      even make a binocular “a” that’s missing the bottom row and<br>
      it’ll still work (because when it comes to individual letters,<br>
      people are really very very good at deciphering them).</p>
      <p>So although 8 pixels is indeed a healthy lower bound, it’s by no means<br>
      an absolute minimum, and in some cases breaching it is Good Design.</p>
      <p>hhp</p>
