      <p>"Take a look at Perpertua on screen with CT, it works pretty well, but the “g” really does not render well, as it has a very vertical and lengthy part to the glyph."</p>
      <p>I've migrated to a bilaterally symmetrical lower bowl for screen fonts.</p>
      <p>"The goal in all of this is to cause as little distortion to the original outline as possible."</p>
      <p>A noble goal. But as the resolution falls the goal should change to causing as little distortion to the best outline possible.</p>
      <p>"If you do not care about print output, or you do not care about black and white screen output, then you can mostly do away with x-hints. "</p>
      <p>The other "if" you should add, is, "if the composition system is exclusively going to sub-pixel position the origin and advance width of each letter according to the original outline, and only the original outline, then you must! mostly do away with x-hints, because, in the lower reaches of resolution. One cannot design/hint for separate distortion of figure and ground, can they?</p>
      <p>The other if, is: if type were just x and y, this'd be short discussion. The only reason it continues, is because type has x, y, and a. and these angled strokes are both x and y. I of course, believe that no avenue to a fully crafted solution exists unless x and y and a are all under complete control of the designer, which is TT and any number of "natural"rasterizers.</p>
      <p>But, be that as it may be, I think everyone agrees that at the very lowerst reaches of resolution aliased type works best yes? (7-10). Agreed? So, is CT going to have a base ppm, below which aliased letters &amp; spacing are used, or in the lower reaches, what?</p>
      <p>"Johns theory on italics again, but either way its all pretty subtle, and making these decisions by eye are what type design is all about."</p>
      <p>I am certain that making decisions by eye is appropriate in many many instances of type design. But, there are other instances of type design, where the term eye is not appropriate because the decision is bigger than any eye can take in.</p>
      <p>"is whether anybody actually ever made a font with rendering optimized for teen-PPEM grayscale (non-subpixel) rendering. Or did CT and/or too-much-effort/size kill that avenue."</p>
      <p>Rip Van Papazian just woke up? Can you say that again?</p>
