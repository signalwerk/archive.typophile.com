      <p>Thanks, John, that’s a good overview, and the back story about how everyone is still finding their way with CT is helpful in dispelling any hint of conspiracy. </p>
      <p>I didn’t realise the Win95/98 rasteriser was so good. I think I went straight from 98 to XP, and the minute I turned on CT and saw how good Arial looked in Eudora, I would never have thought of going back. I believed I had never seen such good screen type. But I never did a comparison with Win 95/98 at comparable resolutions, and would be very interested to hear more. </p>
      <p>On my near 150 dpi screen, I must say Georgia really does look like 300 dpi type, or maybe even 600 dpi type. But only from a viewing distance of at least 18 inches. Just as in depth of field calculations in photography, real world viewing distance is the crucial variable, and enlargements are evaluatively misleading except to persons highly skilled in the art.</p>
