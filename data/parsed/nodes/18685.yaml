      <p>David, I’ve been pretty vocal about the fact that CT doesn’t look very good on my Panasonic 96dpi screen: it looks too fuzzy, but then so does greyscale on the same screen. The first screens on which I saw CT looking good were c. 115dpi. I know my Dell 146dpi screen is higher resolution than most people use. The irony, of course, is that my Panasonic with the shіtty screen cost more than my Dell with the great screen :)</p>
      <p>The specific thing we were looking at above, though, was the linking strokes of script faces, and the question, as I understood it, of whether these needed x-direction deltas in order to connect correctly. This seems to me independent of the question of whether the type looks good over-all at the low end of ’normal’ monitor resolutions. The important observation is that subpixel positioning, i.e. Vista CT, handles the connections very well, even down to an x-height of 5 pixels. If full pixel positioning is used, as in XP CT, then some of the connections will break.</p>
