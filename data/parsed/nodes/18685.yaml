      <p>David, note that my last visual, the progression of CT-rendered g, is a different font from the enlarged g images above, which are Georgia enlarged from the previous comparison images.</p>
      <p><em>So is the superior (to me) Quartz rendering of the g for the screen simply to be considered a positive artefact of an inferior system, or is it to be considered as deliberate philosophical difference with some defensible rationale?</em></p>
      <p>Are you talking just about the middle horizontal stroke, or about the whole letter. I think the whole letter looks like a fuzzy mess in all three Quartz renderings. But if you look just at that middle stroke, then I think an argument could be made in favour of exceptional greyscale antialiasing in the y direction to improve two-pixel rendering of such strokes, i.e. of horizontal strokes that jump to two pixels at smaller sizes than other horizontal. But I think it needs to be exceptional, because I don’t want greyscale antialiasing being applied to single pixel stems, because that reduces the contrast. Apple seem to be simply ignoring all hints and letting the colour and grey fall where they will at all sizes. So I think you have to say that any nice bit is ’a positive artefact of an inferior system’. If you don’t like losing x-direction hints in ClearType, I presume you are not in favour of losing all the hints in all directions in Quartz.</p>
      <p>In the Vista version of ClearType, you could indeed hint for greyscale antialiasing of this stroke, but it would be unexceptional, because you would have to set the gasp table to allow y-direction antialiasing at all the sizes you wanted to render this part of the g in that way, and so all other horizontal stems would be affected.</p>
      <p>Georgia, of course, at the size shown above, was hinted for b/w rendering, which explains why the g is hinted as it is. My last example is Constantia, hinted for CT but without y-direction antialiasing turned on in that sample (a quickly made grab from inside the FontLab hint preview). Here is the same showing the y-direction antialiasing kicking in at 26 ppem:</p>
      <p></p><div class="imageWrap"><img src="/files/ConsgprogYAA.gif"></div><p></p>
      <p>_</p>
      <p>Note that the horizontal stems are still contrained by their hints, so you don’t get the wandering double- and triple-runs of grey pixels on every hairline as in the Quartz rendering, but you gradually see the effect of the y-direction antialiasing along the curves.</p>
