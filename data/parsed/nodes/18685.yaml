      <p>Further to what I just wrote:</p>
      <p>Hrant, the issue of y-direction greyscale antialiasing at small sizes in ClearType is exactly the same as the issue of greyscale antialiasing at small sizes vs. b/w bitmaps. You don’t turn on greyscale antialiasing until main stems pop to 2 pixels, and then you make sure that any thin stems that are still rendering at 1 pixel are gridfitted. But you lose contrast on thin curves even in a font that has been as well-optimised and hinted for such environments as Georgia:</p>
      <p></p><div class="imageWrap"><img src="/files/Geoegraa.gif"></div><br>
      _<p></p>
      <p>Black and white, single-bit bitmaps still out perform all other screen rendering technologies for small text in readability studies, even ClearType. ClearType puts back most of the contrast in the intermediate sizes that is lost with greyscale antialiasing. This is probably ClearType’s single biggest contribution to screen readability, especially since increasing screen resolution means that those intermediate ppem sizes (approx. 17-25) are now rendering typical text sizes such in the nominal 9-12pt range:</p>
      <p></p><div class="imageWrap"><img src="/files/Geoect.gif"></div><br>
      _<p></p>
      <p>It’s the notan, stupid. :)</p>
