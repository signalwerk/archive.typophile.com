    <p>So is this right?</p>
    <p>Alpha CT Omega Font Spec.</p>
    <p>Take TT outline that has been made for screen use, e.g.:<br>
        a. alignments quantized to a norm of 8, 2 for descent, etc.<br>
        b. vertical stems quantized to 8, Cap round and square, etc.<br>
        c. horizontal stems quantized  to 4, 2 thick, two thin for O.S* e.g.<br>
        d. all laterally and bilaterally symmetrical contours, are exactly.<br>
        e. Quantize all kerning data.<br>
        f. There are also built-in assumptions about good screen letter design including, but not exclusively, managing maximum distinctiveness-in-appearance among  1lI!ijïíî and ¡, e.g.</p>
    <p>Additional CT specific outline manipulations:<br>
        a. for full horizontal adaptability to the rasterizer,<br>
            1. Quantize all horizontal counters.<br>
            2. Quantize all inter-character spaces.<br>
            3. Quantize all kerning data.<br>
            4. Lighten all diagonal strokes.<br>
        b. for full familial adaptability to the rasterizer,<br>
            1. Lighten all diagonal strokes in Italic.<br>
            2. Lighten all diagonal strokes in Bold Italic the same amount as<br>
                was reduced from the normal italic, (and from roman diagonals?)</p>
    <p>Quantize, in this context, means to reduce an indiscrete group of values to a few discrete groups by averaging them together. This should be done to the values, representing features of typefaces, whenever the complexity of these features far exceeds the ability of the output to display them to the user. </p>
    <p>Lighten in this context, means to remove areas of black (that would otherwise be controlled by TT hints).</p>
