      <p>The comparison above was thrown together very quickly in my CT test tool (yes, using subpixel positioning), with both fonts at a nominal 9pt. I didn't play with the various tuning and API option settings in the tool, and Constantia actually looks heavier in that example than it does using my normal tuning.</p>
      <p>Here is a comparison in WordPad on Windows XP SP2, i.e. without subpixel positioning, using my preferred tuning. Both fonts are nominal 9pt again, but this time on explicit 11pt leading.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ConsCambXP.gif"></div><p></p>
      <p>_</p>
      <p>Miguel, I generally find condensed typefaces considerably slower to read than nicely round ones: too many upright stems in close proximity and not enough well defined horizontals. Constantia aims for something close to traditional book face proportions with longer extenders and rounder proportions.</p>
      <p>In <a href="http://psychology.wichita.edu/surl/usabilitynews/81/legibility.htm" rel="nofollow">raw legibility testing</a> (accurately identifying individual glyphs flashed on screen), the alphabet characters in Constantia scored higher than Cambria. Unfortunately, the results for non-alphabetic characters were skewed by the fact that Constantia has default oldstyle numerals and currency symbols and Cambria has default lining forms. It's remarkable how few people can tell the difference between an oldstyle zero and a lowercase o when they see it at 8-t on a 120dpi screen for 34 milliseconds :)</p>
