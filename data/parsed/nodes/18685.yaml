      <p>You mean integer (because 1/3 is still discrete).</p>
      <p>I can understand that in terms of results-for-effort*, but not technically. What's there to stop a hinter from tweaking the outlines, per PPEM**, with 3x x-axis resolution? And why would VTT have been given the ability to distinguish between 1-bit versus gs hints? For somebody who prefers Mana's rendering quality to the CT stuff (for more than one reason) might it not be not only doable but worthwhile?</p>
