      <p>Bill: <em>I see a lot of quite interesting discussion on side topics, but I don’t see much hard info coming out. What does this mean? What are the implications? Is ClearType ClosedType? Is there a desire not to share information, or is it simply that nobody has yet had time enough to document the required information properly?</em></p>
      <p>I don’t see the discussion regarding different rendering systems etc as side topics. They are directly relevant to the questions David raised and organic to the discussion of those questions.</p>
      <p>I don’t think anyone is being stingy with information; rather the opposite: there is a lot of data, as the images attest, but no definitive set of guidelines, which is what David’s original post was aiming for. As I wrote earlier, the CT font collection represents the response of several designers to the question of how to design type for the CT environment. There are some commonalities in the approaches, and also some differences. At the initial briefing, the MS ART folk explained how CT rendering works, and made some suggestions based on their observations and experiences working on the Frutiger and Berling fonts for the MS Reader, then through the design process they provided testing and feedback. But they largely let the designers find their own way. The point I tried to make in the early portions of the discussion here is that we are collectively still finding that way: looking at what works and what doesn’t, getting a more accurate picture, through images, of what ClearType does with letterforms, and so on. In starting this discussion, David has written what may be the first attempt to formalise or systematise design guidelines for ClearType. It is not ’simply that nobody has yet had time enough to document the required information properly’ but that the required information is still being collected, and I think there needs to be more practical type design experience before guidelines can be considered anything but preliminary. The approach from Microsoft in the CT font collection was to approach design for CT from the perspective that CT is sufficiently close to print for types to be made that will work well in both media. David disagrees with this perspective — and I’m cautious enough to both question it and try to apply it —, and I think an important contribution to design for CT will come from that disagreement.</p>
