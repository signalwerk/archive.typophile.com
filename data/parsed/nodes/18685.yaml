      <p>&gt; In print, all parts of a letter have the same<br>
      &gt; contrast and the same sharpness. That is, the<br>
      &gt; ink is the same blackness on the hairlines as<br>
      &gt; on the main stems and bowls, and the outline<br>
      &gt; is equally sharp</p>
      <p>John, you seem to be completely ignoring one fundamental difference between print and screen. On screen, the whitespace GLOWS. It emits light. If you want to compare it with print, think of the screen behaving like glossy paper. One of the most important elements of having readable type in print is selecting a paper that does not heavily reflect light so the amount of light that whitespace reflects is reduced. </p>
      <p>The human eye should avoid looking straight into a light source for a long time, and it cannot stand shapes that appear in extreme contrast. </p>
      <p>I would be interested to see black/white contrast studies of well printed books. I don’t know if such studies were ever made but to my intuition, this is one of the fundamental elements of readability. I wouldn’t be surprised if we discovered that there is a certain sweet spot in the contrast the amount of perceived light black printed type reflects vs. the amount that the paper reflects, as well as the overall amount of perceived light. Simulate this and you’ll have readable type. </p>
      <p>Remember that early computer screens used white type on black screen, and were generally perceived as quite readable. This is obviously because “glowing” screens where type is white emit less light than “glowing” screens where type is black and the “paper” is white. </p>
      <p>I think optimizing the black-vs-white contrast (in terms of delivered light) should be at least the next step in looking for an optimal readability solution. I personally strongly prefer screen reading environments where type is relatively bold. </p>
      <p>This is where Mac OS X excels: it delivers pretty bold letters even for very delicate designs. In a sense, it simulates optical scaling of the old prints to some extent: it consistently adds a certain amount of boldness to the edges. The added boldness makes up a relatively larger part of the letterforms in very small screen sizes and a very small part in the larger screen sizes. In other words, the Mac OS X algorithm helps preserving more consistent stem weights across the 7-12 points range. In addition, it never delivers type with weak, pitiful one-pixel stems that I truly detest. </p>
      <p>One-pixel stems are death of readability. When bitmap fonts were done for screen, and later, when Verdana originally came out, the users would see the small screen sizes (7-10 pt) on CRT monitors that added some boldness to the pixels by slightly blurring them. But the moment I saw Verdana 8 pt, monochromatic, on an LCD panel, I screamed: oh my God, this is too thin and too “sharp”. So I went on to look for bolder fonts for my screen. When I got my first Dell notebook with a 133 dpi screen 4 years ago, I begged Microsoft for a review copy of Matthew Carter’s latest addition to the Verdana installment, Nina (which is now finally available for sale on <a href="http://www.myfonts.com/fonts/ascender/nina/regular/opentype-tt/298825/" title="http://www.myfonts.com/fonts/ascender/nina/regular/opentype-tt/298825/">http://www.myfonts.com/fonts/ascender/nina/regular/opentype-tt/298825/</a> ). I used it as my normal Windows UI font at 18 ppem because that was the size where 1-pixel stems turned into 2-pixel stems. </p>
      <p>More recently I started using the ITC Officina version hinted by ParaType because it comes in a large range of weights (Regular, Medium, Bold, Extra Bold, Black), that are all carefully hinted and deliver very pleasing images on various screen sizes.<br>
      <a href="http://www.twardoch.com/tmp/officinaui1.gif" title="http://www.twardoch.com/tmp/officinaui1.gif">http://www.twardoch.com/tmp/officinaui1.gif</a><br>
      <a href="http://www.twardoch.com/tmp/officinaui2.gif" title="http://www.twardoch.com/tmp/officinaui2.gif">http://www.twardoch.com/tmp/officinaui2.gif</a></p>
      <p>It is still far from a perfect screen font for me, but it’s the best I could get so far. For monospaced fonts, I’ve been always using the gorgeous Lucida Console which at 18 or 19 ppem delivers images that are simply great:<br>
      <a href="http://www.twardoch.com/tmp/lucidaconui.gif" title="http://www.twardoch.com/tmp/lucidaconui.gif">http://www.twardoch.com/tmp/lucidaconui.gif</a><br>
      (Since it’s a monospaced font used for programming, I don’t mind the very condensed linespacing). </p>
      <p>As for John’s Constantia CoolType sample, to my eye (and in my screen reading environment which is the 17” wide panel built into the Dell Inspiron XPS2 notebook), the sizes 7, 8, 9 pt look good (apart from the “la” blob in the 9 pt size. 10 pt and 11 pt appear weak, way below the boldness of the type that I like. The last three sizes display some annoying discrepancies in the regularity of the type (“o” generally appears weaker than the other letters, “m” and “w” are optically larger than “o” or “u”, also the perceived stem thicknesses vary). </p>
      <p>A.</p>
