      <p>I should have started, and defined the more basic stuff then? : CT rounds in the Y dimension to integer values and rasterizes in color. A new Gasp table allows, in addition to the existin’ gaspabilities, the ability to separately control use of y color. CT recons in X in sub pixel values but doesn’t round†, rasterizing X in color, always. Correct so far?</p>
      <p>The steady stream of wisdom from MS Typography has been that regularly, or well-hinted TT fonts will work fine in the CT environment, (sans post IUP deltas)*. </p>
      <p>*IUP is a hint, you look it up in definition and usage, it’ll make total sense. These (post IUP deltas), were common in early hinted TT, and spread monstrously as the technology was employed at the lower levels of the production quality spectrum to make bitmaps from outlines on-the-fly crappily. I raise this issue, because system quality hinted TT , (as we called it), for Aliased or Antialiased use (sans post IUP deltas) and Hrants “super hinted font” are, like Sir Charles and the Phantom, one and the same. </p>
      <p>†if a width value is 33.333 pixels, it rounds to 33.3 and keeps or tosses the .033?</p>
