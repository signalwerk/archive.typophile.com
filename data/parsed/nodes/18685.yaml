      <p>Hardware anti-aliasing works based on bitmaps, right?<br>
      So it's necessarily hopelessly inferior to anti-aliasing from vectors.</p>
      <p>The thing is, AFAIK such display systems work by taking a<br>
      double-resolution image and anti-aliasing it down to their<br>
      native resolution* (because it's cheaper than having that<br>
      great a resolution) and this might throw off CT's colors.<br>
      But: you could always write a special driver; and you<br>
      should be able to turn off the hardware AA.</p>
      <p>* Not much to test, really.</p>
      <p>BTW, anybody remember those hi-res b&amp;w monitors (Viking, I believe) from the 80s? Not a new idea.</p>
      <p>&gt; how necessary is hinting today if Apple’s Quartz ...</p>
      <p>Small stat for you: Mac market penetration: ~5%.</p>
      <p>&gt; users appear to be delighted?</p>
      <p>Apple users get delighted at anything with an Apple logo on it.<br>
      Except maybe if it blows their eardrums out.</p>
      <p>--</p>
      <p>The global comparison you want would be revealing, but there is<br>
      the issue of gamma difference between platforms, and you would in<br>
      fact be hard-pressed to find anybody to do it for you. Why don't<br>
      you do it? And be sure to include the rendering that outperforms<br>
      them all onscreen: handmade gs.</p>
      <p>BTW, some combinations of such comparisons have been done,<br>
      including on Typophile. My own conclusions have been that:<br>
      1) For Roman, the quality order is: handmade, CT, Quartz, CoolType.<br>
      2) For Italic: handmade and CT are tied overall, then the rest again.</p>
      <p>But what would blow them all away is superhinted CT.<br>
      Or handmade subpixel, which however requires color addressing.</p>
      <p>&gt; someone who claims that Quartz-rendered text is easier to read </p>
      <p>Let me take a wild guess: he also happens to be the<br>
      proud owner of both the iPod and the Mini iPod,<br>
      and an Apple-branded hoodie?</p>
      <p>hhp</p>
