      <p>For diminishing returns - I understand.</p>
      <p>One other tangential question: I remember when VTT was modified to be able to specify if a hint was for 1-bit <strong>OR</strong> grayscale rendering (the former being the old MS core font cornerstone). What I've since wondered (and at TypeCon'04 somebody from Ascender replied to me in the affirmative, but I'm still doubtful) is whether anybody actually ever made a font with rendering optimized for teen-PPEM grayscale (non-subpixel) rendering. Or did CT and/or too-much-effort/size kill that avenue.</p>
      <p>hhp</p>
