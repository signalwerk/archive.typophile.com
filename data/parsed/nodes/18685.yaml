      <p>There is also no point in trying to get someone who is rasterizing at 150% of the norm to “think Normally”, I guess. 145 x 435 is it? We keep coming back to this, seemingly to suit your need to say “Soon!” But when do you expect your ivory tower resolutrion to expand to cover 10% of the 100% of users MS wants CT to cover?</p>
      <p>John, just about every time you open you typewriter, I need to drag very important details out about how YOU are forming your opinion. Everybody knows you are an authoratative type person, so if you say, :It looks Great here!” leaving out that its 145 x 435 is it? &amp; Some Hints and on Fonts HandTaylored to CT, NO ONE IS SURPRISED. We don’t expect and font at any size above 10 pt to be a big problem Okay?</p>
      <p>The big thing, is that if what you believe the CT = Everything line, you make a reasonable and stable core set of values for your testing, that are unimpaired, impartial, and thorough. If you don’t do that, if every    single    truth     has to be teased out, then you’re saying more than any test could. </p>
