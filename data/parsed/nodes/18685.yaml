      <p><em>high contrast is essential to good readability</em></p>
      <p>That’s not using the term “contrast” in a typographic sense. The scientists are getting to you John :-) What’s meant is sharpness.<br>
      High contrast faces (Didone) don’t usually rank highly with typographers for extended text. </p>
      <p>A little sharpness is useful, but why overdo it? The best faces have their share of adnate and ball terminals. To make sharpness the main feature of a face is somewhat limiting (I did that with Beaufort; Arrow seems to be the face in that genre that does best, and it’s not a popular taste). Vendome, Esprit also. Interestingly, ClearType Calibri has a softening, apparent in print and at larger sizes. </p>
      <p>Surely the thick horizontal stroke on the bottom bowl of the “g” is an important feature of the traditional contrasted-stroke serif face? The idea being that the horizontal stroke should have the same visual weight as the two vertical strokes on the sides of the round above. But the CoolType and ClearType versions shown do away with it completely!</p>
      <p>A traditonally important “role architectural” (to use an Enneson term) feature of the “g” has been sacrificed at the altar of sharpness — perhaps it works, but it seems peculiar.</p>
