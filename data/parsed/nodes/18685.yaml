      <p><em>It’s been cautious in terms of positioning, but in terms of leveraging the color (hence sharpness) of subpixels it’s by far the most aggressive.</em></p>
      <p>The gradual implementation is what has been cautious, i.e. how different versions of ClearType have gradually extended the subpixel rendering model in released products, accompanied by testing. Regarding the ’aggressive’ use of colour, don’t forget that even the first public version of ClearType was the result of a lengthy R&amp;D process, and it is precisely the colour-filtering aspct of ClearType that is most innovative (and which Microsoft have patented). The CoolType and Quartz renderings look pretty cobbled-together in comparison, and also lack the focus (pun intentional) of Microsoft’s readability interest. Making type look nice and smooth is not the same thing as making it readable.</p>
