      <p>Nick: <em>That’s not using the term “contrast” in a typographic sense. The scientists are getting to you John :-) What’s meant is sharpness.</em></p>
      <p>No, what is meant is contrast in terms of the letterforms being black rather than grey (presuming a ’white’ background). Sharpness is a different measure. In print, all parts of a letter have the same contrast and the same sharpness. That is, the ink is the same blackness on the hairlines as on the main stems and bowls, and the outline is equally sharp (which is not to say that the type image is always rendered sharply, i.e. clearly, but only that the quality of the line where the black meets the white is largely consistent). On screen, as soon as you move away from b/w bitmaps, you lose the consistency of contrast and sharpness. Whether you are dealing with greyscale or with subpixel rendering, some parts of the letter will be lighter or darker than other parts, and some parts of the outline will be rendered sharper or fuzzier than other parts. This is a degradation of the identity of the letters, with significant impact on every proposed model of reading, regardless of whether the fundamental cognitive unit is considered the individual letter, the bouma shape or the role architecture of parts of letters. As soon as you reduce the consistency of contrast and sharpness, you are relatively inflating the importance of some features and degrading that of others. Because the effect is relative, it is independent of the question of what is ideal contrast or ideal sharpness: as Adam notes, printed books vary in sharpness, and we find that matte, offwhite paper is better for continuous reading than bright white paper (but this is <em>not</em> because of contrast per se but because of the glare factor from reflected light). What matters is not whether contrast or sharpness is ideal, but whether it is consistent and does not degrade parts of letterforms.</p>
