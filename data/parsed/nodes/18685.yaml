      <p><cite>CT doesn’t look very good on my Panasonic 96dpi screen</cite><br>
      I knew that, but never ever knew that you did...<br>
      <cite>my Panasonic with the shіtty screen cost more than my Dell</cite>.<br>
      as a Mac user, I’m pretty much immune to getting good deals on screens, but they’re all good... :)<br>
      <cite>the question, as I understood it, of whether these needed x-direction deltas</cite><br>
      Actually no. Deltas are not used. The question I had was: without x direction control of any kind, in the lower reaches of the spectrum (11-23 ppm), before aliased takes over (8-10ppm), can fonts that are rich in x requirements survive without hints, on rasterizing alone.</p>
      <p>Two examples of this are simple connecting scripts (not fancy as they’d be less useful to read at small sizes), and monospaced serif fonts, (though sans’ll be no picnic either). </p>
      <p>The first example says: fix my width and then mdap or mirp that connector to a regulated cut-through and ensure consistent connectivity.<br>
      <cite>If full pixel positioning is used, as in XP CT, then some of the connections will break</cite><br>
      Not my way, ever. </p>
      <p>The other example, monospaced, says to set that width to maintain it’s exact consistency for all characters, and then work your way into the glyph to settle the unruly stems, side blurtings and counters therin.</p>
      <p>No matter how you look at it, without pixel positioning, without high resolution displays, without x-hints, and without CT modified outlines, (i.e. where the world, its fonts, and screens are today), these x-rich typographic problems are only solveable as the rasterizer sees things and the craft of making it right, to the pixel, has been jettisoned.</p>
      <p>The irony, of course, is that until recently, the future actually, there was no market for the craft, and our industry has been beaten up for not “providing solutions.” Now, the W3c is proposing a way out!, so that well hinted fonts can actually be marketed outside of that tight OEM circle, licensed, linked and counted, but: a. MS is against it, and b. the environments where crafted fonts can be use, well, done been discontinyoud frum lack o quality pro ducks. dahhhhh. :)</p>
