      <p>Bill, you are talking about the weight of the horizontal stroke across the top of the lower bowl of the g, yes? This appears light in the Georgia comparisons for ClearType and CoolType because it has been hinted to be only one pixel deep at the sizes shown. All three of these rendering systems respect y-direction hinting; Quartz doesn’t and allows this stroke to be up to three (grey) pixels deep. In the strong Quartz example, the space between the two bowls is completely lost.</p>
      <p>The key to the enlargements below is as in the previous post:</p>
      <p>Images 1-3: Mac OS X Quartz rendering, with strong, medium and light antialiasing. The medium setting is apparently what Apple recommend for LCD screens. [Note: the top of the light sample is cropped too tight.]</p>
      <p>Image 4: Acrobat CoolType rendering in Windows Acrobat 7.05</p>
      <p>Image 5: ClearType rendering in Windows XP. This is as I have CT tuned on my Dell system; a more thorough test would involve different kinds of CT tuning.</p>
      <p>Image 6: ClearType rendering with subpixel positioning.</p>
      <p></p><div class="imageWrap"><img src="/files/Geog12.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/Geog34.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/Geog56.png"></div><br>
      _<p></p>
      <p>What you see in these images is the difference between darkness produced by heaviness in the Quartz rendering, and darkness in pixel contrast in the ClearType rendering. The CoolType rendering has fairly decent contrast in the horizontal stroke, but becomes weak in the vertical join to the upper bowl.</p>
