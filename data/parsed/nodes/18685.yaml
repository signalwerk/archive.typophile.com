      <p><em>Is it possible that readers may prefer fuzzier images? Further, is it possible, as I suspect it might be, that for long term reading (i.e. reading over a period of many hours) a fuzzier image may be less tiring? I worry about fatigue in any high contrast reading system...</em></p>
      <p>All the studies I’ve heard about indicate the opposite: that high contrast is essential to good readability, that reduction of contrast reduces readability, and that fuzzy text causes eye strain. Kevin Larson would be the best person to summarise the literature on this for us. Eye strain is one of the most easily measured aspects of reading, since movement of the involved muscles can be tracked very accurately.</p>
      <p><em>It would be interesting to know how MS controlled for screen brightness, contrast, gamma in its research.</em></p>
