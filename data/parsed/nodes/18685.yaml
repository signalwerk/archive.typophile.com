      <p>The horizontal stroke at the top of the lower bowl of the lowercase g is a problem area for screen type, because the ductus pattern of the letter usually means that this stroke is heavier than other horizontal stems, and often close in weight to vertical stems. This means that at transitional ppem sizes, where vertical stems are jumping to two pixels and horizontal stems are remaining at one pixel (usually around the 17-19 ppem size for typical text faces), this stroke will either appear too dark (if it jumps to two pixels) or two light (if it remains at one pixel). In b/w and greyscale rendering, this problem can be largely hidden, since both horizontal and vertical stems are rendered to whole pixels and my employ shades of grey. But in subpixel rendering, the problem becomes acute, because the vertical stems will actually be rendering to intermediate weights between one and two pixels, while that stroke of the g must either remain at one or jump to two.:</p>
      <p></p><div class="imageWrap"><img src="/files/Consgprog.gif"></div><br>
      _<p></p>
      <p>Obviously, in a more monoline design, this kind of problem can be avoided.</p>
