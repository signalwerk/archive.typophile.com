    html: <p>Adam, you seem to have bypassed my main point about <em>consistency</em> of contrast and sharpness. I’m not arguing with you that ideal contrast and sharpness may not lie in extremes of either, I’m arguing that the level of contrast and sharpness in letterforms should be consistent, as it is in print. What is not good is variable contrast, where one part of a letter is lighter or darker than another part of a letter, or where one part is sharper and another fuzzier. The great thing about print is that the ink is a single tone, whether it is on a straight stem, a round bowl, a hairline — the colour of the ink is consistent. This is what is lost in greyscale antialiasing, but largely regained in ClearType because of the colour filtering which makes it possible to render curves and fine lines with contrast similar to that of straight stems.</p>
