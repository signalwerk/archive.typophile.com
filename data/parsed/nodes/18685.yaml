      <p>But John, you are comparing against the Windows 2000/XP greyscale rendering with 21 shades of grey which I always considered a huge flop. It creates far too weak diagonal and round shapes. The old Windows 95/98 rasterizer that did antialiasing with just (AFAIR) 5 shades of grey was much much better, and Mac OS X is *way* better than the Windows 2000/XP greyscale a-a. </p>
      <p>What the Windows 2000/XP greyscale antialiasing does to stems rendered at 1 pixel is the worst thing of all renderings I’ve seen. It’s worse than ClearType, Mac OS X, Windows 98, CoolType, FreeType, Flash classic, Saffron etc. </p>
      <p>Georgia and Verdana were developed with the Windows 95/98 rasterizer in mind. The “transitional” sizes of Verdana and Georgia (where antialiasing knocks in but the stems are still mostly 1-pixels) are just a massive catastrophy. I’m sure neither Carter nor Rickner envisioned in that way. I guess I’ll install Windows 98 in my VMware and make some screenshots. (BTW John, if you have a Windows 95/98/98 SE CD somewhere, you can set it up easily and at no extra cost — I’ve written an detailed recipe at <a href="http://www.fontlab.com/FontLab-Product-Support/FontLab-FAQs/FAQ-Fontographer/" title="http://www.fontlab.com/FontLab-Product-Support/FontLab-FAQs/FAQ-Fontographer/">http://www.fontlab.com/FontLab-Product-Support/FontLab-FAQs/FAQ-Fontogra...</a> )</p>
      <p>But this does not tell you anything about the superiority of ClearType subpixel rendering vs. classic antialiasing. I think I’ll agree that ClearType does better than the Windows 2000/XP antialiasing for small sizes but I’m still in heavy doubt whether it’s significantly better than the good old Windows 98 antialiasing. </p>
      <p>Adam</p>
