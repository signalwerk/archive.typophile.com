      <p><em>But therein lies the problem, no?</em></p>
      <p>No, therein lies the design brief :)</p>
      <p>Obviously, if you are not optimising for either screen or print, then you are compromising both. But if your goal is not to optimise for either, but to create as good a hybrid as the target rendering technology on the screen side will allow, then compromise is the design solution. Now I think David is quite right to question whether the target rendering technology of ClearType is really good enough, close enought to print, to establish a design space in which such hybrids are viable. That is the sort of question that should be asked, and in many respects the CT font collection represents the efforts of several different designers to respond to that question, since the general design brief was for types designed for CT rendering which would also look good in print, and the specific brief for Constantia was for a typeface that could be used in both eletronic and print media editions. </p>
      <p><em>But you like your [methodology] best, no?</em></p>
      <p>There were half a dozen different designers working on the CT fonts (not including the Japanese design, but including Matthew's Latin, Greek and Cyrillic companion), and each took a different approach to the brief and worked out a different methodology. Far from saying that I like mine best, I think the range of possible approaches is far from exhausted, and I don't think we're in a position to claim that there is a right way to design for ClearType that everyone should follow. It is still very much a live design problem, which should be subject to more thought and, crucially, explored in more designs.</p>
      <p>If I were starting Constantia now, with what I've learned and observed, I would certainly do some things differently. Most likely, my approach would combine aspects of the methodology I developed for weight with Jelle's approach to spacing in Cambria, which I think worked out better for screen than Constantia's.</p>
