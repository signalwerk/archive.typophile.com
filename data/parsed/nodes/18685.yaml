      <p>I have just rebooted and gone back to this thread and find that for a couple of days I was looking at this thread with some video defects that have obviously since gone away. The g’s in Constantia look much better, and the CoolType version looks very much better. I also now think I can discern uneven fencing in the I row. Evaluative perils lie everywhere. Today the thoughtful design of the a and g in Constantia comes out for me. I’m not sure I am ultimately convinced by the approach but I see that there is a good idea here that is being carefully worked out and it is good that we have a chance to see this and work with it. The blobless a has perhaps been taken too far but one can see here a clear will to design the letter such that distortion will be minimal in the top half. One can also easily see that the design is marred by the CoolType rendering because there is clearly insufficient contrast in the top stroke of the a, exactly what John is complaining about in this renderer. In the g, there is careful thought to make the space between the two bowls as distinct as practically possible. This preserves the glyph integrity maximally though I am not yet convinced it helps legibility or ’scansion’ (my theory being that having the two bowls touching probably makes for a more legible character, but that doesn’t detract from the interest in seeing what happens when you make them as separate as you can). The k also seems to have some interesting thought. Altogether one can see that this is very far from a print type translation to screen, rather, that careful thought has gone into maximising the glyph forms for legibility. </p>
      <p>And now in an attempt to cut through the noise (admittedly some of it produced by me) can I ask what this thread is really about? What I see is that someone (who just happens to be the world’s greatest font technician) is very tactfully asking for some detailed information about CT2 hinting. Then I see a lot of quite interesting discussion on side topics, but I don’t see much hard info coming out. What does this mean? What are the implications? Is ClearType ClosedType? Is there a desire not to share information, or is it simply that nobody has yet had time enough to document the required information properly?</p>
      <p>David, can I ask, re ’3x apparent resolution’ gain from anti-aliasing. This is the figure that has been claimed ever since Xerox and others started showing off their ’600 dpi’ LCDs a few years back, i.e., 150 dpi LCDs with anti-aliasing. Is the 3x figure really justified?</p>
