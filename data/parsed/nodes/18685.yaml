      <p>Answer the question David: do you think there is any point in making and discussing samples with an x-height smaller than 5 pixels? You charged that I was contributing to a ’big lie’ by making samples on a high res monitor, despite the fact that my monitor resolution is irrelevant to the range of ppem sizes in the samples. I responded that I showed samples down to a 5 pixel x-height, and that below that the counters start collapsing and the text becomes unreadable regardless of whether it is rendered with ClearType or b/w bitmaps. So where is the big lie? You asked for samples of script faces with joining connecting strokes. I provided them, down to the ppem size at which the letters remain legible.</p>
      <p>[Since Typophile’s image upload doesn’t seem to be working properly, I have posted my image of a 4-pixel e <a href="http://www.tiro.com/John/italicebm.gif">here</a>. Again, the point regarding that image is that this form is an exception, not the rule or the norm, and the letter e almost always requires 5 pixels to render legibly.]</p>
