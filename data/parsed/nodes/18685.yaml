      <p><em>I’m still wondering: isn’t that something hinting could help unlock?</em></p>
      <p>In what way? You have a horizontal stem. You have a non-divisible pixel in the y-direction (presuming typical horizontal RGB array). At small sizes, you only have the one pixel height to represent that stem. Making the pixels that make up that stem anything other than black is a reduction in contrast. Look at that CoolType lowercase a: the contrast in the hairline on the bowl is completely shot, the grey is less than 50%. In the Quartz examples, event the flatter portion at the top of the letter is cut through, despite grabbing up to three pixels of height to render the stem in the ’strong’ version. What are you hoping that hinting will improve in this? Making the stem darker? Why not just make it black? Adding a second layer of grey pixels around the outside of the letterform? That’s what Quartz is doing, and the result is superfuzz, with even flat serifs being rendered by 2-3 pixels in height, creating a fuzzy grey zone along the x-height and baseline.</p>
    html_clean: |-
      <p><em>I’m still wondering: isn’t that something hinting could help unlock?</em></p>
      <p>In what way? You have a horizontal stem. You have a non-divisible pixel in the y-direction (presuming typical horizontal RGB array). At small sizes, you only have the one pixel height to represent that stem. Making the pixels that make up that stem anything other than black is a reduction in contrast. Look at that CoolType lowercase a: the contrast in the hairline on the bowl is completely shot, the grey is less than 50%. In the Quartz examples, event the flatter portion at the top of the letter is cut through, despite grabbing up to three pixels of height to render the stem in the ’strong’ version. What are you hoping that hinting will improve in this? Making the stem darker? Why not just make it black? Adding a second layer of grey pixels around the outside of the letterform? That’s what Quartz is doing, and the result is superfuzz, with even flat serifs being rendered by 2-3 pixels in height, creating a fuzzy grey zone along the x-height and baseline.</p>
