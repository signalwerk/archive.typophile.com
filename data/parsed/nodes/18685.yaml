      <p>[Edit] Carl, In general the CT team has said that in most cases special CT hinting is not required, but 'light' <em>y</em> direction hinting is appropriate, with some <em>x</em> direction hints to help in print and certain other scenarios. </p>
      <p>There are some advanced techniques but these are really only appropriate in very specialized places (for example in a UI font), but in these cases they've often been able to give more specific advice and pointers to those that need it.</p>
