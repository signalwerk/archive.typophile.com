      <p><cite>I wouldn’t be surprised if we discovered that there is a certain sweet spot in the contrast the amount of perceived light black printed type reflects vs. the amount that the paper reflects, as well as the overall amount of perceived light. Simulate this and you’ll have readable type.</cite></p>
      <p>A non-technical observation: It’s interesting that Typophile treads are set black against gray. I’m not sure it’s a “sweet spot”, but I think I prefer it to a white background. If it were white I might have to turn down the brightness on my screen. </p>
      <p>In college, I took a couple classes in television production. One of the things I learned, was that no matter what level of techincal precision one is working with, you can never stop a user from “fooling around with the nobs” to make things look the way *they* want. In the case of television production, this was often discouraging because of the loss of control over the product. In the case of type, I’m not sure it would be a bad thing...</p>
