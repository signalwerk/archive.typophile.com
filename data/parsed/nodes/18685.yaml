      <p>Ah, yes, <em>here</em> the Const g looks very good, although I would like to see it in context, and though that showing brings up a lot of other issues. But still, that is very impressive. I was just talking about the middle stroke of the g, as that was what stood out for me as the most distracting defect in the previous CT1/2 and Cooltype showings. The contrast is excellent here.</p>
      <p>Our exmination seems to reveal that the Quartz method is too fuzzy in comparison to the others, but on the other hand what strikes me is how good it looks given that there is no use of hinting whatever. It doesn’t seem fair! </p>
      <p>And that leads to another question. Judged by the simple criteria of sharpness and contrast (one might borrow the term ’acutance’ from image evaluation, although that technically should only refer to the evaluation of a knife edge image), the CT2 method seems unquestionably superior to the others. But those are very simple criteria. Is it possible that readers may prefer fuzzier images? Further, is it possible, as I suspect it might be, that for long term reading (i.e. reading over a period of many hours) a fuzzier image may be less tiring? I worry about fatigue in any high contrast reading system but most particularly in any transilluminated reading system. In other words, I am trying to shift the ground away from simplistic evaluation of legibility towards a discussion of what might happen over very long periods of reading which, after all, is what really counts.</p>
      <p>Then there are other questions: the only system we have evaluated without hinting is Quartz. How do the other systems behave when confronted with unhinted fonts? With badly hinted fonts? Apple seems to be looking ahead three or four years, MS seems to be looking backwards two or three. What is going on in LCD development? Are we coming closer to the point when 200 or 300 dpi screens may be common? Even if we do get there, well-hinted fonts will look better, but, with AA, how much better? </p>
      <p>It would be interesting to know how MS controlled for screen brightness, contrast, gamma in its research. Then there is the issue that most users dial up brightness much too high for comfortable long-term viewing, even though that may provide an apparent short-term boost in viewability.</p>
