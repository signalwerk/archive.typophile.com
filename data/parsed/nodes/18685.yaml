      <p>“Adam, you seem to have bypassed my main point about consistency of contrast and sharpness.”</p>
      <p>Which he shouldn’t have done, but we’ll have to forgive him since there are many complex things going on here. Adam, I think, is turning his focus to what constitutes an ideal screen reading font, which is not quite the same thing as the CT2 focus, which has the perhaps too ambitious goal of finding fonts equally at home in print and on screen. I can imagine that might be true even if displays were 600 dpi. </p>
      <p>Adam reminds us of Lucida Console and white type on black screens. I do a lot of writing. I couldn’t do it unless I used XyWrite, which gives me a black screen and Lucida Console in white. </p>
      <p>But that’s an experience totally outside of WYSIWIG, which is not even contemplated by CT2. So in a way it is unfair to hold CT2 to these absolute standards, but equally, it is fair, since where are we if you can’t now give me a better extended time screen reading experience than I had in PC-DOS? </p>
      <p>Adam’s comments on the fuzziness he likes in Quartz remind me a bit of what happened when laser printers went from 300 dpi to 600 dpi. All of a sudden, users were miserable, because Courier at 600 dpi is so much less readable than at 300 dpi. The old stuff was fuzzier, bolder, vastly more legible. </p>
      <p>I have what I might describe as a Volk-theory, that noise in reading and in music can be helpful as a subliminal aid to concentration. However, perhaps it’s stupidly distracting even to mention that. </p>
      <p>In the meantime, David is bringing to our attention that CT2 has noise forms that may impair legibility and concentration, i.e. irrationally moving stems. However, I cannot see evidence of artefacts in the row of I’s here, and I am looking at them with CT1. On the other hand, I remember in previous threads some persuasive illustrations of this problem. Am I running at a sufficiently high dpi count to negate the problem in this instance? </p>
      <p>“What is not good is variable contrast, where one part of a letter is lighter or darker than another part of a letter, or where one part is sharper and another fuzzier.”</p>
      <p>However, John, what do you think of this? That perhaps the more complex letterforms we are seeing in the pretty seriffed CT fonts inherently suggest lightness and darkness in a way that simpler letterforms do not? Because contrast, light, and darkness are also formal attributes of every font quite apart from the rendering system, and that goes beyond intercharacter space, counter space, etc. - it’s terribly complex. Am I making sense? </p>
      <p>So I’m wondering if Adam isn’t ultimately calling for a kind of design simplification that isn’t really consistent with the CT2 project as it has evolved and may only be consistent with a few users’ expectations.<br>
      Deep issue! At root is the possibility that WYSIWYG should not be the invariable modality, and think how that would confuse most users today. </p>
      <p>Adam, I looked at the Officina images you referenced, and I must say they look terrible on my 1920x1200 screen. Are they intended to be examined on a lower-res screen?</p>
