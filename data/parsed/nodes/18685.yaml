      <p>145 ppi? I see. Yes, it’s quite good. Now, back to reality,<br>
      (i.e. the approx. 329,695,432 users below 145 dpi.)? </p>
      <p>Just to be clear, “big lie” testing can be pretty clearly demonstrated here, and in nearly every other test MS has run. One large typographic flaw sits somewhere, in the pile skewing the result, waiting to be found.  In this case, using resolution 1.5 to 2.0 times the installed base is not a test that answers the question, John.</p>
      <p>The best “big lie” marketing so far is the “save $2,000 per employee with CT” assuming everyone will use “improved text” to read long “work” documents, as opposed to the more likeable reading on ESPN.Com, Ebay, or Wikipedia.</p>
      <p>The “big lie” in design, told repeatedly and even AFTER the CT fonts were designed and tested, is that “normal hinted TT fonts work fine in CT”, when in fact, they don’t. And, they didn’t to a degree extreme enough to require the core set of outlines to be specially designed for CT and then redesigned until they worked with special hints.</p>
      <p>If we are to get past the big lies John, you are helping in a way called “not”...Even an idiot like me can make a perfect screen font at 24 x 72 pixels (12 pt 145 dpi). I learned by 1988 that waterfalls as you show are only effective on typographic baboons, lower echelon clients, and below average engineers. A script face that can be CTed at any size from 10.1 to 13.5, 96 dpi., and Courier, same sizes and resolution, i.e. I said proof, not froof, poof or goof...:)</p>
