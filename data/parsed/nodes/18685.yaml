      <p><em>However, John, what do you think of this? That perhaps the more complex letterforms we are seeing in the pretty seriffed CT fonts inherently suggest lightness and darkness in a way that simpler letterforms do not? Because contrast, light, and darkness are also formal attributes of every font quite apart from the rendering system, and that goes beyond intercharacter space, counter space, etc. - it’s terribly complex. Am I making sense?</em></p>
      <p>Yes, you are making sense, but the formal aspect of contrast, which is inherent in the design, needs to be distinguished from the medial aspect of contrast, i.e. the contrast provided by the medium. In print, you have a consistent medial contrast, provided by the monotone ink, which is the same colour whether it is on a stem, a bowl or a hairline. This medial contrast provides, if you will, the base level on which the formal contrast of light and dark design elements rests. The same is true of single-bit bitmaps on screen, although obviously the design opportunities are greatly reduced by the crudity of the pixel grid.</p>
      <p>In antialiasing, whether greyscale or subpixel, the medial contrast is reduced. The stems, bowls and hairlines are no longer made up of the same colour. The colour, and hence the relative contrast, varies in different parts of a letter. So the medial base contrast is degraded, undermining the formal contrast of the design. There are two approaches to improving text rendering in such circumstances:</p>
      <p>One is to design typefaces with formal characteristics that are tailored to the degraded medial base contrast, i.e. designs which respond to the effects of antialiasing and try to counteract the degradation. The usual method is to design formally low contrast shapes, e.g. sans serifs and slab serif typefaces with little modulation in stroke weight. The limitation of this approach is seen in the variation of sharpness between straight stems and curves, and artifacts of degraded medial contrast that remain even in designs tailored to the medium. Greyscale Verdana has better consistency of contrast than greyscale Georgia, but medial degradation is still visible where curves narrow to join stems: as the stroke becomes formally lighter, the medial contrast is inevitably reduced.</p>
      <p></p><div class="imageWrap"><img src="/files/VerdGrey.gif"></div><br>
      _<p></p>
      <p>So the other approach is to tackle the problem from the rasteriser side rather than from the type design side. This is what ClearType aims to do, by using colour filtering of subpixel antialiasing to restore, as far as possible, the medial base contrast, to make it as consistent as possible, so that stems, bowls and hairlines are rendered in similarly dark tones. </p>
      <p></p><div class="imageWrap"><img src="/files/VerdCT.gif"></div><br>
      _<p></p>
      <p>The benefit of attacking the problem from the rasteriser side is that it greatly expands the design opportunities. You are not tied to low modulation designs that try to reverse the medial degradation of greyscale, because the medial base level is so much higher. Now, obviously it is still not as high as ink on paper, but it is a lot closer than greyscale, and this opens up the design opportunities considerably. Some of the MS ClearType Collection fonts push those design opportunities more than others. I admit that there are days when I look at the formal details of some Constantia glyphs and wonder if I have not pushed too far, or if the current CT rendering and screen resolutions are really good enough for such shapes. But the design is aimed at an improving technology, not a static one.</p>
      <p>The fault I find with the Quartz and CoolType rendering is that they achieve improved smoothness of curves in the x-direction with subpixel rendering, but they do nothing to improve the medial base contrast. Stems, bowls and hairlines are all still rendered with varying levels of tone, often as bad as greyscale antialiasing. It is as if someone had partially scrubbed a printing plate with solvent before taking an impression: fracturing the medial contrast and washing away bits of the letters.</p>
