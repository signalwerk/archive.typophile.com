      <p>I chose “healthy” exactly because it’s a bit mushy (like humans).<br>
      But trying to elaborate, I would say that 8 point is a lower bound<br>
      when certain other things are assumed, things that normally are safe<br>
      to assume, but not always. For example by making the bowl of the “g”<br>
      one pixel shorter to allow descenders to be 1 pixel, you create a certain<br>
      ugliness, which is nominally undesirable; but whether it is in fact <cite>too</cite><br>
      ugly depends on other things, like if you absolutely must fit a paragraph<br>
      within a certain vertical bound, or if the display font in the composition<br>
      at hand exhibits a lot of irregularity, etc.</p>
      <p>Think for example of this:<br>
      <a href="http://www.tdc.org/news/2005Results/Minuscule.html" title="http://www.tdc.org/news/2005Results/Minuscule.html">http://www.tdc.org/news/2005Results/Minuscule.html</a> _<br>
      (And that image shows the least pushy cut in that family.)<br>
      The question is, do the “distortions” inherent to this<br>
      design make it <cite>useless</cite>? I tend to think not.</p>
      <p>hhp</p>
