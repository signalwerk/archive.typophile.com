      <p>"The great thing about the sfnt file format is that it is so readily extensible and is a great basis on which to build new stuff."</p>
      <p>:) @ack</p>
      <p>"I don’t know enough about Chinese typography to comment on that, and I’m not sure how you compare SCREEN typography in OT with what was available in metal type — a singular case of apples and kumquats"</p>
      <p>Yes...Well, here's the way it works. The keys tinkle different, to begin where all such discussions of "universal" font formats should, with the users. First,  the users who input, and then the users that read the result. (Assuming that the mill of commerce has taught the former to obey the latter even before being told to do so by the Central Party;)). </p>
      <p>In this alternate key tinkling universe, the individual characters (40,000 or so), representing what we call words or phrases, are build up of a small number of strokes (18 or so), representing the not-so-long-ago abandoned manual strokes produced with the hand. These small number of strokes play out into hundreds of variants as they are combined into radicals, (parts of whole characters closest in Latin to something like a letter, syllable, or word), and again slight variations occur in strokes and in radicals as they are combined to form complete characters. But back at the input, there are a number of ways to accomplish it; from hunting for the complete character, to typing a phonetic translation in another script to built radicals up to characters.</p>
      <p>The broadest method coming into general use is the input of radicals to form complete characters, and the future trend is towards the most intelligent computer-aided input possible, which would allow several parallel and instantly selectable systems, (i.e. The user can float amongst hunt and peck, input by phonetic, or by radicalanji). And what the readers want is fine Chinese, which is to say as much refinement to the strokes as the designer can provide to "even out" the great variety of density and complexity in the Characters. That is the market for text, where I think all "universal font format" critiques rest, but those ideas exend to nearly all applications. The important message I took away from learning this is/was, that the best and future input method, and best output result are both achieved by careful preparation of fonts to make them able to react through the underlying strokes and radicals of the characters,,, to the input and to the output conditions — then making a font by combining the parts in the font tools and removing overlap is obviously the wrong solution for the long term, (a long term which happens to be now relative to when Apple published their Eastern Scripts the first time...).</p>
      <p>Why? "I firmly believe that real Chinese and fancy Arabic CANNOT BE MADE for TEXT &amp; DISPLAY, or for SCREEN AND PRINT" — would be obvious to anyone who's designed or claimed to design baby scripts like Latin for multiple size use (and/or low resolution). In addition, when you throw the resolution problem at stroke and radical unaware Chinese fonts, well, its worse than having an elephant squat upwind of you in a hurricane... e.g... I once was asked to estimate "where it might be safe to rasterize the simplest Chinese design without hints, grey scale, or dropout control, so I proofed the first two levels of the Japanese Industry Standard character set (14,000 or so), and located a character with 33 transitions, e.g. 16 black strokes, and 17 white spaces. So the answer was 67 and that is what I still give as an answer for all scripts when anyone asks about that sort of number for any script...67.</p>
      <p>This is why I critique this format so harshly: A. Without the use of more intelligent composites and the capability of variations at input/output, not fontput(!), OTKaput 20?? in China. B. Without the employment of more intelligent people in the driver's seat, or intelligent and talkative passengers, we only have the best "Latin First!" font format in OT.</p>
      <p>And...Metal is not the object, it is a Marker.</p>
