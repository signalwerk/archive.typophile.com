    html: <p>It seems to me that the majority of users are interested in having fonts that are relatively simple to use and which work consistently across a wide range of applications, and this ease of use and compatibility is more important, for most users, than having fonts that do lots of clever things but inconsistently and only if the user knows how to operate them properly. Having sliders to perfectly fine tune a typeface for a particular size and output configuration sounds wonderful, but you are expecting the user to have the same expertise as the type designer in determining what that optimised font should look like. It seems to me that most users would prefer to have a simple font labeled 'Use this for ten point text on your 600 dpi printer'.</p>
    html_clean: <p>It seems to me that the majority of users are interested in having fonts that are relatively simple to use and which work consistently across a wide range of applications, and this ease of use and compatibility is more important, for most users, than having fonts that do lots of clever things but inconsistently and only if the user knows how to operate them properly. Having sliders to perfectly fine tune a typeface for a particular size and output configuration sounds wonderful, but you are expecting the user to have the same expertise as the type designer in determining what that optimised font should look like. It seems to me that most users would prefer to have a simple font labeled 'Use this for ten point text on your 600 dpi printer'.</p>
