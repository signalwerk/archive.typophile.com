      <p>I recently noticed this statement:</p>
      <p>“What OpenType cannot do is the kind of thing Tom Milo is doing with his Arabic engine, but then no previous Arabic typesetting system has been able to do what Tom is doing, which is to directly model both the rules and the order of the classical calligraphic styles”</p>
      <p>This is not true. We - the DecoType team - set out to design Arabic typography, not calligraphy. By closely inspecting Middle Eastern typesetting and reading their own statements we learned that these craftsmen modeled their work after the ubiquitous Arabic script grammar. With hindsight, that is the only thing one could have expected: it happens everywhere. For normal text use, type designers have always reproduced script, not redesigned it.</p>
      <p>Presently, our engine does _exactly_  what previous Arabic typesetting systems used to do. Not the Dutch or the Italian ones, but the Turkish and the Lebanese ones, of course.</p>
      <p>As for calligraphic styles, these are beyond our competence, we don't touch them. We deal with scripts that were in use as metal typography: naskh, ruqah, nastaliq and, to a lesser extent, thulth.</p>
      <p>As for the fact that Open Type cannot deal with Arabic typography in this sense, it's not our fault. We did not impose or raise the standard, we just implemented it.</p>
      <p>I hope that clarifies the matter.</p>
      <p>t</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
