      <p>Somebody asked me in private. I gave this explanation, and thought that others would wonder the same thing.</p>
      <p>&gt;&gt; "I don’t know the details of what Thomas Milo is doing for Arabic in<br>
      OpenType, but it must be, as the Israelis say: 'Mamash.'"</p>
      <p>&gt; What does this mean?</p>
      <p>I am sorry for not explaing myself earlier.</p>
      <p>"Mamash" is a Hebrew term for "actual" or "real". </p>
      <p>The Israelis use it as a super-complimentary explaim about something which they consider very great, something like the Americans say: "Wow, cool!" Or in yester-year: "Keen!" "Groovey!" [Dis people really say that?] Or the British: "Jolly good!"</p>
      <p>But for the Israelis, it is even more superior. I am sure in Europe or Arabic, you have an equivalent term.</p>
      <p>=====<br>
      NOTE:<br>
      =====</p>
      <p>Like most every Hebrew term that Israelis use, "mamash" has its origins in Biblical writings. In this case, "mamash" originates in the Biblical commentary of the great medieval sage, Rabbi Shlomo Yitchaki, who questioned how G-d was able to fool Abraham to think that his guests were ordinary Bedouins when actually they were angels? Rashi (as he is known by this acrostic of his name) explained that G-d dressed the angels in human bodies, using the phrase: "the 'mamash' of the angels".</p>
      <p>["Mamash" also has a negative connotation among well-versed Chassidic Jews. Rashi's comment: "the 'mamash' of the angels" refers to the "waste of the angels", based upon a profound kabbalistic teaching that this world results from the waste or excrement of the spiritual world above it, and that spiritual world results from excrement of the spiritual world above it, etc. As this can be interpreted derogatory, I specified how the Israelis use it, to emphasize only the positive meaning] :)</p>
    html_clean: |-
