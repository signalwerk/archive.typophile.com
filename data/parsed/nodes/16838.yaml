      <p><em>The problem for Arabic is one that you don’t see, even though you’re staring Milo’s stuff in face?</em></p>
      <p>Our difference is that I see the need as being particular to circumstance, and I'm not convinced that the technology required to do what Tom does is the same technology as I need for other kinds of Arabic text processing. This is not simply because his technology is slower than OpenType, but that OpenType itself is too slow when it tries to emulate (imperfectly) calligraphic models. The problem is in using processing models of great complexity where a simpler model is appropriate to the particular circumstances. You might be willing to wait for a page of the Qur'an to be slowly rendered in immaculate emulation of the calligraphic norms, but you don't want to wait the same amount of time for an email using a much simpler style of the script to be displayed. This is why I favour multiple technologies tailored to different circumstances, rather than a one-size-fits-all technology, whether that is OpenType or something else.</p>
      <p>[UPDATE 1 May 2007 : the above comments about the relative speed of OpenType vs Tom Milo's ACE layout engine were based on secondhand claims. Tom challenges them, and I have not had the opportunity to make a direct comparison myself. Tom's new Tasmeem plug-in for InDesign ME will hopefully provide such an opportunity, and I'll be more than happy to withdraw the above comments. For now, they should be taken as reportage of what I had been told, with full acknowledgement given to Tom's disagreement: 'ACE beats OT hands down. It was already fast on a 4Mhz computer in 1986. In Tasmeem there is no apreciable difference in rendering speed between ACE and OT - yet the ACE tasks are far more elaborate.']</p>
      <p>I recently made an OpenType font that supports correct display of the Hebrew Bible text. In order to handle the complexities of the Biblical text, my font ended up being many times slower to process than a typical Hebrew font designed for use in modern Hebrew. The trouble is that my font remains that much slower even when used for modern Hebrew text. This is an example of what I am talking about: complexity that is appropriate for the circumstances of typesetting the Hebrew Bible is not appropriate for reading Hebrew email. In this case, the complexity is within the font, but in Tom's case the complexity is in the rendering engine. In either case, the complexity is excellent and necessary for its intended purpose, but is an ineffeciant overhead when the technology is employed for other purposes.</p>
