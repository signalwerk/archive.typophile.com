      <p>"more than one proprietary Asian font development environment that uses a stroke-based system to assemble glyphs from collections of radicals. But that’s a separate question from what format the font ships in"</p>
      <p>I'm sorry Thomas, but this is not correct. Imagine for a second, that you were in charge of the Corporate annual report, but the font your company uses does not come with the Warnok glyph?  This' to say, it may be true for Latin, that there can be a clean and complete break between the technology of the founder and that of the user, (though I for 1 (and apparently, only), do not believe it), but the universal requirement for where the break is, is broader. Broad enough, in fact, that I believe some users need access to composite controls, and even more need it for variation control, or, as I said before, foundries of quality are forced to ship 100's of styles per family.</p>
      <p>"BTW, David, Chinese does not solve the adjacency problem by grouping radicals into characters. Chinese solves the adjacency problem by then making those characters monospaced,"</p>
      <p>Or not. I don't think I understand your point, but that may be because you don't understand mine? "Chinese does not solve the adjacency problem by grouping radicals into characters" could only mean that you don't consider the Chinese character to be a word, or what? They solve the problem by caching the word into a uniform cell, and then using those cells uniformly, for the most part.</p>
      <p>Idris, </p>
      <p>I'm a bit confused by Taco.<br>
      "I suspect this also brings the greatest flaw in his proposition to the spotlight: for the average user it will be too hard to program such a stack."</p>
      <p>Does he mean the average type street user, or main street user? There is no intent for the average user to ever even know the stack exists, or that a stack could or should exist for them to look for...So, maybe the issue of discussing this is that I have no idea what common ground Taco, you and I have in anything from hinting to semantics. I mean, it took me two or three weeks to convince a few people around here, and they and I should be, more or less, on the same patch of intellectual ground. ;)</p>
