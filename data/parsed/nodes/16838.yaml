      <p>I don't know the details of what Thomas Milo is doing for Arabic in OpenType, but it must be, as the Israelis  say: "Mamash."</p>
      <p>I have heard outstanding praise from one whose opinion I value a lot, and can imagine that he's doing something like I would want to do, but my focus is not Arabic, but Biblical Hebrew, Nikkud Hebrew for poetry, students, and children, and invitational Hebrew for birthday, bat mitzvah, and wedding invitations.</p>
      <p>I think that MS VOLT and OpenType is the tool and font format to let our imaginations go wild. Contextual replacement is the key to everything, as I imagine that Thomas is exploiting for Arabic.</p>
      <p>On a different topic, I think Multiple Master technology failed because certain letterforms, like the m and w need wider widths and radical design  changes at small point sizes in one direction, and a totally different set of rules for narrower widths and different letter designs for larger point sizes in the other direction.</p>
      <p>DBerlow, is this what you had in mind in part?</p>
