      <p>Thoughts:</p>
      <p>Reading everyone's comments, it seems to me that, as far as the long-term (maybe long-long-term-&gt;) future is concerned, we need something like an OOo (OpenOffice.org) approach. Something as important as a universal font format should be an open source as well as openly developed thing. For example, the state of Mass. (following an international trend) has just mandated switching to open document formats for electronic communication.</p>
      <p>Between the work of people like the Letterror crew, creative ideas like those of Nick Shinn and SIL, and the cooperation of font creation developers/managers like Adam and George Williams, there is no reason why the type-developer community cannot or should not take the lead here. If the community acts proactively, and unites around a common aproach, the commercial interests will follow its lead in the end, and help to make it successful. </p>
      <p>A nice thing about OOo is that, since it's open-), developers can use it as a real life testing ground for ideas; there is no commercial interest to stop you. For truly high-end typesetting there is TeX, also open to hack and develop. </p>
      <p>If we get an open standard going, meeting the needs of both the average user and the high-end typesetter, commercial interests will not wait long before jumping on the bandwagon...</p>
      <p>Idris</p>
