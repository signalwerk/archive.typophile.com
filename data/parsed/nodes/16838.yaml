      <p><em> This is where you run up against the strategic and economic interests of the software developers, and so long as you are relying on them for the software to actually use the font you will have to deal with this problem.</em></p>
      <p>This is exactly where alternatives like OOo and TeX can play a very fruitful role. Free and open source.</p>
      <p><em>So perhaps the answer is to consider high quality typography as a specialist software goal (which is basically what TEX did, although the results were not always so high quality)</em></p>
      <p>In the case of TeX, I think we have to distinguish the capabilities of TeX from the limitations of its users, who are not generally typographers. Also, LaTeX makes high-end typography difficult because many things are hard-wired in that format (though the relatively recent memoir package alleviates this).</p>
      <p>Any high-end software can be used to make mediocre output. Yet few if any layout programs can match what a competent typographer/typesetter can do with TeX-) particularly in some areas like critical editions and similar complex layout, including control of orphans, widows, typesetting on a grid, etc.</p>
      <p>The newer format ConTeXt gives non-programming users a degree of access to typographical sophistication with TeX that was previously accessible only to expert TeX programmers. When added to the microtypography features of pdfTeX there is little that ConTeXt cannot do when it comes to hq typography; it is truly an amazing engine and perhaps the best kept open secret in the high-end typesetting world.</p>
      <p>Here is a draft manual explaining and illustrating some high-end typesetting control capabilities of TeX:<br>
      <a href="http://www.pragma-ade.com/general/manuals/style.pdf" title="http://www.pragma-ade.com/general/manuals/style.pdf">http://www.pragma-ade.com/general/manuals/style.pdf</a></p>
      <p>See especially pages 29--38</p>
      <p>It's not your grandfather's (or even your father's) TeX anymore;-) </p>
      <p>Best<br>
      I</p>
