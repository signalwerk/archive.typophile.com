      <p>So what are you proposing, then, David? I'm having trouble following your argument. You want variations in fonts, yes? and I point out that variations imply users who are knowledgeable and competent enough to be able to select appropriate variations with some kind of user interface. Maybe there are enough such users to justify the development of some clever typefaces, but are there enough such users to interest mass-market software developers in supporting the technology? Are you suggesting a format specifically for professional, experienced typographers? If that's the world you wanted to inhabit, perhaps you shouldn't have started Bitstream and begun this whole democratisation of type mess :) </p>
      <p>Given that the current companies developing and supporting font formats and related technology are mass-market software developers, I don't think we can be surprised or very critical of what they've done. They are supporting technologies for their user base, which is people who don't know much about typography. What's the point on hammering at them? The only way they would change is if a really big OEM client came along who wanted something more and better and had enough money to make it worthwhile.</p>
      <p>It seems to me that, although addressing a different set of issues, the SIL folk had the right idea with Graphite: if what MS, Adobe and Apple are producing is too limited for you, design your own font format or format extension, build tools to make it, and then build applications to use it. That is the only way you are going to get away from the lowest common denominator of mass-market software.</p>
      <p>But I'm still not sure exactly what you think this wonderful new font format should do or how it should do it, or what the specific benefits are. Do you have a spec? You are very good at making gnomic criticisms of OpenType -- I'm still not sure what the heck you were getting at with the Arabic comment --, and at telling other people that they just don't get it when they can't understand your oblique references, but what are the specifics? What should be in the great font format? And why are those features better located in the font file than in the development tool? And don't presume that I'm smart enough to follow anything vague: spell it out for me.</p>
      <p>Heck, if I understood you, I might agree with you.</p>
