      <p>The best and most damaging critique of the OpenType format is is level of acceptance, esp. the number of apps that implement any / a significant portion of the layout features. Being at a point where the "current" font standard is too advanced - for app writers anyways - there appears to be little point in dreaming up newer and even whackier ones. Similarily, unless there is a long queue of not yet registered new feature tags that are about to come out in a new revision of the standard the font designers are not really pushing the envelope with OpenType either. </p>
      <p>We don't need hyperdrives - we need the trains to arrive on time.</p>
