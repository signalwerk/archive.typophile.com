      <p>There is something called Adjacency. The issues of Adjecency manifest themselves in different ways in each of the major scripts. Having separate technologies to deal with them, is as stupid as I've ever heard, but Cutting Edge Luddites have their entertaining moments don't they!? :) Is there a type word beyond more kerning pairs, for typographic adjacency,,, please? </p>
      <p>With Latin, and with the exception of connecting scripts and a few other type styles, in our everyday working fonts we've herded our adjacency issues into Kerning Pairs, and, standing by our love of long-necked "f's" we do all sorts of things. This had been a nontrivial exercise from Gutenbaby's time until mechanical composition nearly killed even the f ligatures. Later, just to make sure we didn't find ourselves behind in an adjacency crisis, we let the beast spread from the simple problem of adjacent characters in a font, to the far more profittable and complex problem of adjacent style issues.  Chinese, solves its adjacency "upfront", in a sense, caching all the combinations with a myriad of parts into each character, and solving the issues well enough to set characters in any direction and dimension or on any curve, without kerning or substitution.</p>
      <p>Arabic, has a few styles without adjacency issues, mostly simplified, scratched and modern, I think. It also has some with moderate, or easily predictable adjacency that I'm sure are solved from metal to OT. But the further, back (or forward !;) ) you go, perhaps in relation to some "golden age" of leisure time (or a future age of super computing power in a pack of gum), you find what I'd call roiling adjacency, where, yeah, it'd take a little while for the final forms to settle as issues resolve themselves among the input (BUT SO WHAT!). It could be unique when it finally stood still, depending on that input. But we'll not know for while yet, we're still making up our dumb "a**" logos. ;)</p>
      <p>The important think (!) to remember, as this seems to such cause great shirking in the name of progress, is that when you put a trailer hitch on to the back of your car it does not automatically slow your car down. In fact, you have to hook it up to something for that to happen. Another important think to remember, even though you probably didn't know it before, is that this problem could be defeated much like the towing problem, by adding a hook that allowed composite parts to be stacked (like trailers rollin' down the highway), instead of being processed independantly, and all existing fonts'd still work JUST FINE. In addition, real designers would also be able to make parts react to composition the way the brain sometimes wants to read 'em.</p>
      <p>"That (stack-based composites and variations), is exactly what Arabic needs today, so that books can be enjoyable to read again. And so I can get on with my own critical editions…"</p>
