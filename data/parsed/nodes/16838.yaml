      <p>Hi David,</p>
      <p><em>I’m a bit confused by Taco.</em></p>
      <p>It seems to me that the point is to put a mechanism in place where the typical user can, at a high-level, define how TeX uses a given font for the kinds of advanced capabilities that we have been discussing, and do it in a way that fits your ideal of </p>
      <p><em>and all existing fonts’d still work JUST FINE</em></p>
      <p>I don't think TeX is concerned about hinting and related font technology (should it be?). The main idea I get from your comments is a mechanism to implement advanced-script needs with at least a reasonable degree of font format agnosticism. </p>
      <p>What Taco is trying to say (I think) is that, the way Knuth did it, the "ligature&amp;kern-program" is done at a level to which the normal user would not have high-level access. But for issues of adjacency some high-level access may be required because the various script-issues involved may not be reducible to a single paradigm, as in the case of traditional Western typography. TeX may implement, for a given advanced script, a generalized model, and users can give the parameters for a given font. </p>
      <p>But perhaps this makes font format agnosticism difficult, because you need something like an afm file to provide the needed parameters for generalized kerning aka adjacency. Anyway, the engagement of typophiles like you is a great asset as the right course of action is plotted.</p>
      <p>Note that I refer to use 'advanced-' instead of 'complex-' or 'problem-' with respect to scripts like traditional Arabic and associated technology. The latter two adjective-prefixes have pejorative connotations that feed an incorrect framing of the overall problem. To say that ``This problem/complex script requires complex technology'' basically frames the issue in a way that lets font designers and software companies off the hook...<br>
      Best<br>
      I</p>
      <p>PS. The font that typophile.com uses a right single quote that is out of harmony with the left single quote. I think that a site like this one should look into that-)</p>
