    user_id: 2969
    user_name: dberlow
    user_path: null
    date_raw: 2 Jan 2006 — 4:51am
    date: 2006-01-02T04:51:00
    votes: null
    html: <p>MM are Junk, were junk and will always be junk, next to 64 potential axis, 64 potential intermediates per axis, of TT variations. AND! the ease of development (for normal everyday designers) that were presented by variations technology in combination with Mutator and Fog...was simple as pi. Anyone who ever made a TT variation and MM font knows what I'm talking about. Everyone else is in le dark. MM was, for those of us who did both, like trying to control a puppet's mouth with strings attached only to its arms and legs. Variations allowed strings for each tooth, if ya wanted. Erik's work is to make variations again, of which MM is always, and only, a subset.</p>
  - id: 102338
    user_id: 1854
    user_name: blairyo
    user_path: null
    date_raw: 3 Jan 2006 — 11:45am
    date: 2006-01-03T11:45:00
    votes: null
    html: |-
      <p>David, could you please explain how you use Mutator? Manipulating outlines is straightforward, but when you try to save the changes, Mutator crashes. I'd appreciate it if you could help me to solve this problem. </p>
      <p>GX/AAT Variations are great fonts. Zycon, Jam, Chunk and Buffalo Gal show the amazing things that can be done with a font outline. Skia looks good and for layout work and logo design, its condensed and extended variations provide useful options. </p>
      <p>If creating GX/AAT or MM variations was easy, more designers would have built their own variations fonts, but it's not and most people probably give up in frustration. </p>
      <p>If Adobe's MM fonts are not counted, only a handful of MM fonts have been released since the format's introduction in the early 1990s. </p>
      <p>To my knowledge, apart from the fonts that were commissioned by Apple, no GX/AAT variations fonts have been released. </p>
      <p>Designers do use MM and variations; my local council's logo was nicely redesigned in Skia Condensed. Sadly, OSX does not make it easy to use MM and AAT variations. The OS supports the format, but in OS 10.4, few applications display the variations sliders. </p>
      <p>After giving up the battle to create a variations font in Mutator, I reluctantly decided to create a Multiple Master font instead. After much fiddling with point directions, obscure error messages, baffling dialogue boxes and inadequate documentation, I eventually managed to build a MM font in FOG. It worked, but the process could have been much easier. The Type 1 format doesn't allow for special characters like ligatures and swashes, so for me, a GX Variations font similar to Skia would have been a better solution.</p>
      <p>Creating GX/AAT substitutions with the classic Apple Font Tools is relatively straightforward, but the newer OSX Unix command-line tools are beyond me. I suppose I'll get it, eventually, but why have the techniques become harder? Is this progress? The documentation, which seems to be written by programmers for programmers, may be ideal for engineers, who have the training and aptitude, but the people who really use fonts—graphic designers, illustrators, etc—are expected to wade through page after page of academic theory and PR which describes the amazing things the technology can do. I don't want to be told what's theoretically possible; I want to know how to do it! In an ideal world, designers would figure it out for themselves, but in the real world, they don't.</p>
      <p>Finally about OpenType; at the moment, the OT format is too messy. The specification needs to be finalised and all the features built into the operating systems. After that, the various platforms and OS' must be compatible. After that, users need a font tool that enables OT features to be specified without lots of coding. I wonder if this Nirvana will ever happen?</p>
