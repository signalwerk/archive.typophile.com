      <p><em>What do people here think of SIL’s Graphite?</em></p>
      <p>An interesting approach. I prefer something like what we do in the TeX/Omega/Aleph world: filters which select font features and which the user loads at will. I have been playing with Arabic Typesetting (arabtype.ttf: MSOffice 2003 proofing tools or Windows Vista) and, in MSWord at least, the features are set in stone. (Caveat: I don't use Word for typesetting; maybe there is a way to select/change desired font features that I could not find.)</p>
      <p>For example:</p>
      <p>i. Turn ligatures on/off;</p>
      <p>ii. Have a choice of ligature sets. For example, at small point sizes certain ligatures don't work well. The typesetter should be able to choose which ligature set works best for the task at hand.</p>
      <p>iii. Turn vowelization on/off, perhaps even control diacritic-vowel positioning;</p>
      <p>iv. Alternate character control;</p>
      <p>Other features, like character substitution based on interword spacing within a paragraph, require a better typesetting engine, like TeX or InDesign (which uses TeX's h&amp;j algorithm, but I have no idea if this feature is available in InDesign; have not yet had the opportunity to use that program).***</p>
      <p>To summarize: For advanced typography and typesetting of complex scripts, opentype alone will not do (from what I have learned so far). A postprocessor engine that gives the user more control over font features in a variety of contexts is needed. The font format itself should provide "hooks" (like anchor points for a given feature in otf) from which the postprocessor then creates a myriad of typographic possibilities. </p>
      <p>Happy Holidays<br>
      Idris</p>
      <p>*** I have noticed that Donald Knuth is rarely given the credit deserved for the h&amp;j algorithm. Even Bringhurst (e.g., p.191) seems to go out of his way to avoid mentioning TeX...</p>
