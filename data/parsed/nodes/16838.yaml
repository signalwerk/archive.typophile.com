      <p>When this old discussion was revived I read all of it and was a bit surprised how DecoType's ACE was completely misunderstood. I consider one misreading as particularly serious because it obscures ACE's biggest advantage compared to OT.</p>
      <p>In a couple of comments throughout this discussion I see this inference at work:<br>
      (1) "Complex script" OT fonts are hard to make, &amp; slow in performance when used.<br>
      (2) ACE fonts do (for OT-trained minds like mine) even more "complex" things.<br>
      (3) Hence ACE fonts must be harder to make, and performance must be worse.<br>
      This were true if -- as implied by an unspoken premise -- ACE's layout logic were identical with OT's layout logic. But this is <em>not</em> the case. Unlike OT layout tables, ACE is built on a few simple (albeit "meta") ideas and has a clean, straightforward mechanism, the most elegant one I have seen so far.</p>
      <p>Given this, another conclusion, though meant to be praise, is almost an insult:<br>
      Use OT for everyday stuff that does not need much sophistication, and reserve ACE for high-end typesetting with all bells and whistles.<br>
      Again, this is a conclusion that is drawn from experience with <em>OpenType</em> layout technology, which indeed suggests -- whenever "extras" are not required -- to reduce complexity of features to avoid performance issues (and keep production efforts at a reasonable level). Since ACE is a very clean and simple architecture, making this distinction between less and more sophisticated/complex fonts does not make sense. For ACE, it just does not matter if there are a few alternates less or more. And the tricks it does with attachments are applied to very simple fonts as well as very complex ones. No difference there.</p>
      <p>I even wonder if talk about "complex" fonts originated in an OT environment -- because OT layout table logic <em>makes</em> some things complicated. OT layout tables have a big problem: their "simplicity". They literally scratch on the surface -- they try to <em>mimic</em> a script's <em>appearance</em> by accounting for every single tiny adjustment needed to achieve this appearance. E.g. by minutely defining that this mark must be attached to this base at this coordinate. This is evidently simple (in terms of "common sense") but does not account for the fact that some scripts require so many of these tiny adjustments, which even need to interact which each other, that it is suicidal to mimic "complex" layout behavior on the level of tiny adjustments.<br>
      ACE in contrast digs deep into the structure of a script, and rather than accounting for this or that tiny adjustment, it sets out with some very global observations about layout behavior, e.g. it knows that there are base glyphs, to which marks need to attach -- somehow. Btw, Milo explains all ideas behind ACE in his papers.</p>
      <p>Regarding Nadine Chahine's comment "one does not need complex technology to make good Arabic typefaces", this seems true. Yet I think it should not be a type designer's technical competence that determines whether he <em>can</em> make this or that kind of typeface. Since there is no difference between simple and complex in ACE, it is the design that decides what it needs, not the designer's technical competence.</p>
      <p>Karsten</p>
