      <p>Laurie,<br>
      The Cliff notes version is:<br>
      <a href="/wiki/MultipleMaster" class="freelinking" rel="nofollow">MultipleMaster</a> fonts were originated in the 80s by Adobe as a way to generate variations of different fonts based on axis (or master). A pair of axis might change weight from light to bold. Another pair of axis might change condensed to extended, Users could dial in anything between the extremes designed into the axis pairs. The idea was to let the user select the degree of boldness or extendedness, or whatever. After several years of production, Adobe abandoned the concept as an end product. However, Multiple Master (MM) axis are used today by type designers in programs like FontLab to help generate variations of weight, etc.. It is now mostly an interpolation tool and assumes some degree of cleanup by the designer afterwards but much less than starting from scratch for each variation. I am sure there is a much better explanation on the Adobe site. You can also do a search on this site and find insightful dialogue including people who have had a role in MM development.</p>
      <p>OpenType is a developed set of standards put together by a combination of groups. The two most influential being Adobe and Microsoft. The consortium worked hard to address the shortcomings of previous standards and came up with a cross-platform solution which addresses multiple language and script usage along with including what used to be "Expert Sets" for small caps and oldstyle figures and stylistic alternates, ligatures, and contextual alternates. The real info on opentype is best read from the Adobe and Microsoft web sites.<br>
      A Google search will get you more than you ever dreamed of as resources. Again, search this site as well where you will find plenty of comments from Adobe and Microsoft staff as well as some very savvy Indi font designers.</p>
      <p>As a start, here is a wikki entry on Opentype:</p>
      <p><a href="http://typophile.com/wiki/OpenType" title="http://typophile.com/wiki/OpenType">http://typophile.com/wiki/OpenType</a></p>
      <p>ChrisL</p>
