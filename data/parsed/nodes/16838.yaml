      <p>``Perhaps the solution for character to glyph mapping could be something like this: Assume a 'script' definition as in Unicode. Add a 'language' setting, and a 'typographic  style'. Call that a 'Script environment'. All Adjacency within such a Script environment can be written down independant of actual fonts. You have to make some combinations in a Script environment optional of course, so that font families do not have to be perfect.</p>
