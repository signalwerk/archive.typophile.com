      <p><em>In this way, all of the functionality that should be in the font format can at least be in the tools.</em></p>
      <p>I've never been convinced that interpolation belonged in the format, whereas it is very important that it be in the tools, and the tools should not be limited by the specifics of the format. The attractive thing about Erik's superpolator is that it isn't trying to conform to a particular format's notion of masters or variations.</p>
      <p><em>nor will it get indigenous complex Arabic type going</em></p>
      <p>I suggest spending some time on the VOLT community website to see just how much indigenous Arabic font development is happening. A lot of it is pretty rough, some derivative, but they are definitely getting going. The largest VOLT user groups are, by far, indigenous Arabic and Indic script developers.</p>
