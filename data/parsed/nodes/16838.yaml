      <p>Today's NYT editorial 'Working Together for the Average Joe' criticises the electronics industry for releasing incompatible products. The writer's comments could be applied to font formats, font engines, operating systems and platforms.</p>
      <p>The article is here;<br>
      <a href="http://www.nytimes.com/2006/01/07/opinion/07sat4.html?th&amp;emc=th" title="http://www.nytimes.com/2006/01/07/opinion/07sat4.html?th&amp;emc=th">http://www.nytimes.com/2006/01/07/opinion/07sat4.html?th&amp;emc=th</a> (registration necessary).</p>
      <p>Some quotes;</p>
      <p>"People would be willing to spend even more [on electronics goods] if the industry bothered to make their products work with one another. …companies are losing a combined $3.8 billion in estimated sales of additional products, content, and services by selling stand-alone devices and leaving consumers to make them work together or - as is more often the case - not work together. It predicts that such lost sales will rise …if things don't improve."</p>
      <p>"Tech visionaries love to wax poetic about the networked home, straight out of the Jetsons. Maybe if you're Bill Gates. For most people, the reality is a Babel of devices and technical-support staffs that blame other companies and don't help. Computer owners have to become security experts, network specialists and troubleshooters. So people buy less."</p>
      <p>"The rewards are rich, and first isn't always best. The iPod wasn't even close to being the earliest digital music player on the market. Now it's the leader because average people found it usable."</p>
      <p>"Still, Apple would do well to ditch the closed-circuit approach and cooperate with other companies better - or risk repeating the mistakes of the past."</p>
      <p>Quite… The key words are 'cooperate' and 'usable', but will the industry listen?</p>
