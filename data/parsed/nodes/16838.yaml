      <p>Welcome to Typophile Idris.<br>
      At the moment, only professional design programs support most of the opentype features. This covers the high end users tools fairly well but the typical word processor user will have a bit longer to wait. Depending on how much you believe the dates developers give you, somewhere around a year or so should bring OTF to the main stream.<br>
      Opentype will, in my opinion be around much longer than MM. If it goes away, I am sure it will be supported in whatever comes after.<br>
      Opentype does such a much better job than TT or Type 1 in supporting large character sets that it is hard to resist.  This is a major boon to non-Latin scripts which need full coverage to be workable. The contextual options and attention to diacritics help even more. </p>
      <p>You can search here, on the Microsoft site, and the Adobe site for many discussions on Opentype features and problems.</p>
      <p>I hope you will continue to share your views and findings here in the Typophile community.</p>
      <p>ChrisL</p>
