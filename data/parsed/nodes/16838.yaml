    html: |-
      <p>Coming late to this thread, I would like to make a few corrections and observations and apologize in advance for length:</p>
      <p>John Hudson writes, </p>
      <p>'FontLab only supports primary master <a href="/wiki/interpolation" class="freelinking" rel="nofollow">interpolation</a> (but as a design tool it also supports extrapolation, thanks to Adam Twardoch, which is a nice feature that MM didn’t have).' </p>
      <p>John, a moment's reflection will make you realize that this statement is untenable. All MMs are extrapolable. Think about it. There is nothing in an MM font that prevents this. All you need is a 'Creator' app that will allow the user to extrapolate. Adobe did, indeed, have a version of ATM (could it have been 2.4?) that permitted extrapolation. The feature was taken out because it was felt that the instances were unpleasing and did not reflect Adobe's quality image - always the risk with extrapolation. But any app developer that wished to could write a 'Creator' that did extrapolation. In other words, this is not an issue of the font format, it is an issue of the software used to support it.</p>
      <p>'What should be in the great font format? And why are those features better located in the font file than in the development tool? And don’t presume that I’m smart enough to follow anything vague: spell it out for me.' </p>
      <p>Let me explain why David is so impatient, John, with the thinking behind this remark. This goes back to the late 1980s and <a href="/wiki/Sumner%20Stone" class="freelinking" rel="nofollow">Sumner Stone</a>'s reign at Adobe. It had long been realized that multiple axes were a desirable design tool, thanks to the pioneering work of the late Stephen Harper (among others - and have I got his name right?). But it was Sumner who had the idea of putting variable type in the user's hands, and not just the type designers, and then went on to sell <a href="/wiki/John%20Warnock" class="freelinking" rel="nofollow">John Warnock</a> on the idea. Warnock did indeed eventually embrace it, and of course MM is still a critical component of Acrobat and for that matter any Acrobat-alike, such as OS X Preview. In other words, it is already 20 years ago that someone had the idea of putting variations and other features into users' hands. Having lived through this 20 years ago, David is naturally surprised that the issue should still be up for discussion. </p>
      <p>Mark Simonson writes 'There were only a small number of MM fonts built, mostly by Adobe, and you needed ATM to use them.' Mark, I am unaware of any MM font that cannot be used by any app in XP, OS 9 and OS X. ATM is 'hard wired' into XP, OS 9 and, roughly speaking, OS X.</p>
      <p>On the other hand, it was as difficult as you like to use the fonts to their fullest capabilities. In this sense you are quite correct. </p>
      <p>Thomas writes,</p>
      <p>"Yes. Unfortunately, our experience with MMs was that applications were not very interested, and users did not easily “get it.” Of course, one could put this down to insufficient evangelism (my own explanation of it)."</p>
      <p>I disagree with this. One program and one program alone ever had the MM interface down to the point where anyone could enjoy using MMs: Lari Software's Lightning Draw GX which worked on System 7.5 through 8.1 and perhaps beyond. Unfortunately, although the revelatory LightningDraw feature set has driven the bulk of Adobe Illustrator improvement from versions 7 through 9, Adobe itself never got the interface right. The problem wasn't evangelism. The problem was that Adobe never showed app developers how to do it right, and never helped font editor developers to make MM development easy. The reason it didn't help font editor developers was because it wanted to keep all good MMs to itself. But Adobe really shot itself in the foot by not committing interface engineers to showing everyone, especially its own app developers, how to make MMs both easy and fun to use. This is really a pity. And of course, as David points out, MMs are hopelessly primitive compared to Variations and other successor technologies. </p>
      <p>Paul D Hunt writes,</p>
      <p>"dream format: multimaster opentype fonts"</p>
      <p>Paul, way back in the infancy of time, say 1997-2000, this was the format that everyone expected to have. MM was withdrawn from the OT spec because Microsoft believed it would be too much trouble for its app developers to support. This is right in the sense that it would be difficult to app developers to support well, in the absence of built-in OS support such as Apple had demonstrated with GX. But it is not right in the sense that the beauty of MMs is that the app doesn't have to know it is looking at an MM. As far as the app is concerned, an MM can be any other font. And in spite of all of that, MS deserves credit for being the first app developer to support the optical axis in MM fonts automatically (as in mid 1990s versions of MS Word). Another word for your dream format is Apple's <a href="/wiki/GX" class="freelinking" rel="nofollow">GX</a>, from the late 1990s, which did just about everything in MM and OT, and quite a bit more. GX almost became a dual Mac/Win standard, but there were some last minute hitches over money. This time around, instead of getting <a href="/wiki/USB2" class="freelinking" rel="nofollow">USB2</a>, which really works, we got OT, which really doesn't.</p>
      <p>What David is really talking about is that there is no provision in <a href="/wiki/type%20technology" class="freelinking" rel="nofollow">type technology</a> for optimally implemented type. And that's because, as he instances, few here have ever had to design a 10 pt type for 600 dpi rasterization. Few here have any concept what a type can, and should do, beyond its basic unitary design. Type needs to be better, and at the same time it needs to be more fun. </p>
      <p>I think it is unnecessary to spend time on the issue of MMs and OT, because I think it is clear, as some at Adobe and other companies believe, that MMs will rejoin OT as soon as OS's and apps run out of other features and need some novelty. In two years, five years, or ten years, we will see MMs in OT again. But, as David would point out, what is the point of doing something so old-fashioned when so many more advanced things could be done? It should be happening now. The painfully simple technology we have today has a bad effect on designers because it doesn't challenge them to go to the extremes of their craft.</p>
