      <p><em>This is my own principal critique of OpenType, and it is not a critique of the font format but of OpenType Layout. A lot of the OTL features were defined by Adobe and Microsoft long before either company implemented support for them in any products, and I don't think we've been left with the best set of features we could have had. Of course, it is possible to define new features, but what already exists has determined application functionality and it would now be difficult to revise the whole model.</em></p>
      <p>At the moment we have some features that are identified as being on by default but possible to turn off (e.g. liga), some features that are off by default but possible to turn on (e.g. dlig), and some features that are on by default and impossible to turn off (e.g. rlig). The distinction between standard and discretionary ligatures is a useful one, but I don't think that it is useful to have a feature level distinction between ligatures that are always on and ligatures that are on by default but can be turned off; that is, I do not think this is a distinction that requires two separate features. I also find myself longing for an equivalent of the 'required' state of rlig lookups for other features. So I think it would be better for there to be a flag in the lookup that determines whether particular lookups within a feature, e.g. liga, are required or not, i.e. can be switched off or not. This would be a basic aspect of the GSUB and GPOS lookup types, rather than something that requires multiple features, and a single feature could include both required and non-required lookups. Some features, such as ccmp and locl, might still be presumed by applications and engines to be required, and no UI would be provided to turn them off, but it would be possible to include some required lookups within the features that users can toggle. So, for example, rather than splitting your Arabic ligatures between the rlig and liga features, you would put them all in a single feature and set the appropriate flags for individual lookups. I'm working on a project at the moment in which it would be useful to be able to mix required and non-required lookups in the 'calt' feature, because there are some cross-stylistic-set glyph combinations that could occur that are simply incorrect, ugly and colliding. I should be able to ensure that these do not occur while still allowing the user to turn off contextual alternates if this does not result in such combinations.</p>
      <p>As to whether OpenType will go the way of Multiple Master, no, I don't think so. But I think some poorly conceived OTL features will never be implemented, and may be formally deprecated, e.g. the 'rand' feature.</p>
