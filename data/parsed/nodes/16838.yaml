      <p>&gt;the font developers are responsible for translating the feature names into all possible languages.</p>
      <p>It would be nice if the OpenType format supported "developer's naming" for stylistic alternates, which would also be supported by layout apps. Give developers the choice to translate their feature names or not.</p>
      <p>Failing that, developers can always do a special font for a special feature. For instance, "Caslon Historic" could implement historical forms as an always-on contextual alternate; the feature is a legitimate OT feature, but is not AFAIK supported by any layout apps.</p>
      <p>In fact, the OT feature tag definition of Contextual Alternate is somewhat one-dimensional (something about scripts) for what its actual capabilities are.</p>
