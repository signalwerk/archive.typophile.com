    <p>Hi all,</p>
    <p>This is my first message to this forum. I look forward to getting to know this community!</p>
    <p><a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts are all the rage today. Are there any critiqes of the format, or discussions of its limitations? </p>
    <p>How many typesetting applications can actually take full advantage of opentype fonts?</p>
    <p>What are the chances that OpenType (at least some of its advanced features) will go the way of <a href="/wiki/MultipleMaster" class="freelinking" rel="nofollow">MultipleMaster</a> fonts?</p>
    <p>Context: I am working on a Classical Arabic-script typesetting system with very high-quality typographical standards. I primariliy use <a href="/wiki/TeX" class="freelinking" rel="nofollow">TeX</a> and <a href="/wiki/ConTeXt" class="freelinking" rel="nofollow">ConTeXt</a>.</p>
    <p>Best to all<br>
    Idris</p>
