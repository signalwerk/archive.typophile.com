      <p>From the links to the ISO story we have this:</p>
      <p>"This allows, [mpeg’s adoption of OT] for example, for the streaming of text in a format based on 3GPP Timed Text providing a low bit rate solution for subtitles or karaoke-like applications growing in popularity worldwide."</p>
