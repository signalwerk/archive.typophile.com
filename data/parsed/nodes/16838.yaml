      <p>I was asked to critique the open type format, and I did. Now, I've been asked to tell you who would use this stuff, and I already did. You should r e a d it again if you didn't get it, but I firmly believe that real Chinese and fancy Arabic CANNOT BE MADE for TEXT &amp; DISPLAY, or for SCREEN AND PRINT, to the standards of even metal, with OT. I pointed this out several ways, including to say that I think anyone who believes they are doing the same for Latin is a Lier. Even the great Verdana, e.g. is not suitable for anything but screen and printer agate. </p>
      <p>Should a "Standard" be thus so limited? I have asked a dozen questions here and gotten no answers, just more baby questions :)</p>
