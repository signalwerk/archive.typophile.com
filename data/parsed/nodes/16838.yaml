      <p>Hi Sander:</p>
      <p><em>Is an ever more perfect rendition of calligraphic arabic according to centuries old rules really the future (and end-all) of Ararbic [sic] typesetting?</em></p>
      <p>There are two schools of thought on this. One school, perhaps the dominant school, says, ``Hey, let's adjust Arabic-script typography to fit Western digital typography technology; forget the manuscript tradition''. The other says, ``No, let's create a technology that can bring the manuscript tradition into the age of digital typography just as it was brought into the age of metal-type at the turn of the 20th century''.</p>
      <p>In my own opinion, there has been very little that comes out of the first school that is aesthetically pleasing at all. The first school represents a defeatist attitude that is unfortunately quite common. It is also unfortunate that the only available book on Arabic typography promotes this defeatism.</p>
      <p>There is a perhaps hidden subcontext to your question that needs fleshing out: The relation of calligraphy to manuscript writing in Arabic is a bit different than that relationship as it exists in European history. Although Islamic civilization was aware of printing technology before Europe, it was hardly accepted for serious works until the 20th century. It was never a matter of technology but of aesthetics. In the context of a Muslim civilization that maintained its territorial and intellectual independence, there was the spine to accept metal press technology only on its own terms. As Imperialism took root and the new coopted intellectual classes begin to worship everything European, that backbone gave way to the defeatist attitude that dominates so much of Arabic typography to this day.</p>
      <p>I cringe when I read Arabic books today, just like Knuth cringed when he saw the first printing sample of one of his books using the then nascent digital typography. But instead of being defeated, Knuth spent ten years designing a system that can be programmed to implement the bulk of traditional typography plus be ready for future developments. </p>
      <p>That is exactly what Arabic needs today, so that books can be enjoyable to read again. And so I can get on with my own critical editions...</p>
      <p>Thomas Milo takes the second approach; opentype capabilities help as well. </p>
      <p>By the way, one can take a proactive approach to traditional Arabic-script typography without being reactionary. Once the proper rendering algorithms, etc. are available, we can build on tradition and move into the future from a truly authentic foundation, as opposed to one based on the limitations (wrt Arabic-script) of Western digital typography technology. </p>
      <p>All the best<br>
      I</p>
