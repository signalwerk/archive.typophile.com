      <p>Hi Idris, </p>
      <p>"Could you flesh out your adjacency/stack-based-composites-and-variations idea a bit more?" </p>
      <p>I can try. Once you have the composites on a stack, you have two sorts of opportunities to deal with; One are additional design issues, how and when the different parts are called and what else you can do to them in combination with x-y movement, scaling, rotation, location in variation space and hints, all at your disposal to best solve the "local" marking and adjacency issues and improve to either a wider range, or a more precise target of quality, for output. There's a lot more to say about that though to make it clear in detail, but the singular most important thing is without the right APIs, the founder must precache all the "arrows" he or she wants to "target" to "users". The second opportunity is of course in the output, how does the stack with interacting components and variations get the best possible transformed image to the rasterizer, and then to the user, who presumably asked for it in the first place, completing a loop with the type designer, if they're good. Today's font API's don't dare ask much of the user, os or beyond, and therein lies the barrier, a sparsely populated loop of possibilities that practically no one can breech for the masses of PC users.</p>
      <p>TeX, bless it's heart, has been applied to every single script, application and occupation, but has never made a mass audience happy. I will gladly help you in and out of list, but not for hire. Nadine, John, and many others have said that the spec. comes from the users. I think that the spec. "they" need, (i.e. for what could be advertised as a "World Wide Operating System") is what we've got now, plus, a "few minor tweaks" a new old table or 3, and an API adjusted here or there to "ask more." The major problem lies in the will of three companies, Yes, I can arrange some sort of thing with ISO all by myself to change the Written Spec., but it'd be so much more effective if the companies who were making billions of users wear the typographic equivalent of cardboard shoes to formal occasions Actually do it. They are the API Barons and without really getting them overboard, as I'm sure SII can attest if the Seahawk Bowl hasn't completely consumed his reason, canoeing without a paddle comes to mind. </p>
      <p>And John, (thank a higher deity of your choice), agrees with me fully, or at least I've rocked enough so he can see over the side,,,;) which means I can call my brain surgeon off defcon 4, where he was fully prepared to downgrade me to a clam shucker, or pack me off to a grape stomping school, he's not quite sure, my brain surgeon having received a C- in the phrenology of type from the University of Southwestern Kamchatka at Murlké. This Arabic Specimen is absolutely gorgeous! Crisp, Clean and Precise. For numerous applications, I'd think it'd be perfectly suitable. But on the other hand, I could easily imagine applications where it would be cold, monotonous and inappropriate. But I can also see a relative of this type squirming and twitching around slightly into 37 different word spaces, 4 different 2-dot-accent variations, 246 versions of the 75 glyphs present, not just for better line endings, but then it'd be appropriate for something else, and then something else...for something else.</p>
