      <p>OT is lacking or deficient in the following:<br>
      1. It is missing variations, MM or ANY KIND. All styles are descrete outlines and that's just so 1980's. Size axis are cut off, and resolution axis, sheesh, they don't even know what you're talking about.<br>
      2. OT relies on the old TT composite method, which combines bitmaps after they have been rendered to bits, (too late for combinatorial hints.).<br>
      3. OT as John Points out, the features are limited by Adobe's and MS's desire/footprint. But the real bummer is that the UI hooks to these features are "hardwired" into app(s), so the end of spreadable creativity in this area comes up pretty fast. I.E. An update is required so that the feature tables include the UI names of features, so they can be passed directly thru apps. to users.<br>
      4. There are no options for encrypting anything, so all of your work goes public. when you publish it.<br>
      5. And the worst thing about OT? The format is privately held by companies who are overwhealmingly not type founders so it's inevitable that the format would be cast with second-rate concepts, by inexpert technocrats, into very solid concrete.</p>
