      <p>Someone has pointed out (I can't remember who) that OpenType is already much more successful than Multiple Masters ever was. There were only a small number of MM fonts built, mostly by Adobe, and you needed ATM to use them. </p>
      <p>There are already thousands of OT fonts on the market by multiple vendors and they have OS-level support on both Windows and Mac (and Linux too I think). Application support is good (mostly Adobe for advanced typographic support, Microsoft for non-Roman script support) and getting better--the next version of Quark will rival the support you see in Adobe's offerings. Add to this the fact that there is one format for all platforms, something that was never true of earlier formats. I can't imagine how OpenType will do anything but become more widely embraced, given all it's advantages and support by the major OS/application players. </p>
      <p>This was never true of MM, even though it was pretty neat.</p>
