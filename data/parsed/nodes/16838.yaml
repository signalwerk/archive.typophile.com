      <p>Hello, Bill. I don't think anyone is going to look at GX again, least of all Apple. But this relates back to what I said earlier in the thread, that you can't divorce type technology from the strategic and economic interests of OS developers unless you take full responsibility for the entire rendering model, plugging into the system resources only when you need to or find it efficient without compromising what you want to do. There are good examples of software that does this, mostly specialised software dealing with e.g. music layout or mathematics typesetting. I mentioned SIL's Graphite as another example: a model that allows SIL to provide support for scripts and languages without waiting for support from MS or Adobe and without being limited to the Mac OS and AAT support.</p>
      <p>The great thing about the sfnt file format is that it is so readily extensible and is a great basis on which to build new stuff. There is no reason at all why one couldn't spec new tables to support things one wanted and no reason why one couldn't make tools to build such tables. And now that OpenType is becoming an ISO standard (as part of the MPEG standard) there is a mechanism for having such tables formally recognised as part of the OpenType format withouth relying on MS or Adobe (although the international standards process is not for the the impatient or easily frustrated). But getting something into a font spec, or even getting the tables into a font, is not the same thing as getting the layout behaviour supported in applications. This is where you run up against the strategic and economic interests of the software developers, and so long as you are relying on them for the software to actually use the font you will have to deal with this problem.</p>
      <p>So perhaps the answer is to consider high quality typography as a specialist software goal (which is basically what TEX did, although the results were not always so high quality), and not something we should expect from mass market software.</p>
