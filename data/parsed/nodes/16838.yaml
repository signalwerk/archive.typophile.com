      <p>Sorry for joining in late... I'll try to be quick as there's a lot to be said and never enough time.</p>
      <p>&gt;There are two schools of thought on this. One school, perhaps the dominant school, says,<br>
      &gt;“Hey, let’s adjust Arabic-script typography to fit Western digital typography technology;<br>
      &gt;forget the manuscript tradition”. The other says, “No, let’s create a technology that can<br>
      &gt;bring the manuscript tradition into the age of digital typography just as it was brought &gt;into the age of metal-type at the turn of the 20th century”.</p>
      <p>There's another approach to this and it fits neither schools: we are here to solve problems. If the design problem is a new one, then the solution will be new. If it's an old problem, then old solutions would work. I refer here to the aesthetics and not the technology as rendering calligraphic designs is still a work in progress and still unavailable to a large audience.</p>
      <p>Example 1: An Arabic signage face for an airport is a new problem (ie 20th century and later) and as such, when you design it, you don't think: hmm, what would the Ottomans do? Rather, you look at what the problem is (legible from distances etc...) and then see what style of the script fits best and how can you make sure that it fits the design brief. Obviously, not a Thuluth or a Nastaliq.</p>
      <p>Example 2: An Arabic face for the setting of a poetry book. Well, there's a large repertoire of script styles for that, wonderful! Call Tom Milo and you'll be happy.</p>
      <p>I think we miss out on a lot if we say that one or the other is a better school of thought. The important thing is that the type needs to function.</p>
      <p>A slightly off-topic note: one does not need complex technology to make good Arabic typefaces. The heritage of "unhappy" design solutions is not just because of the technology. It has a lot to do with the designers as well. Take a look at Tim Holloways' Markazi font. It can be easily represented with OT today and it is one of the most avant garde and fresh designs that has ever been designed for Arabic, absolutely wonderful. It is obvious that he is a talented designer and understand 2 important things: 1- the nature of the script, 2- what a typeface needs to do.</p>
