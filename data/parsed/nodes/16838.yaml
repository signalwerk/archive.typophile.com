      <p>" TeX may implement, for a given advanced script, a generalized model, and users can give the parameters for a given font."</p>
      <p>I see. I think this should say:<br>
      TeX may allow the implementation of a generalized model,for a given enriched opportunity script ;). Then, typographers can create fonts and the typogrphy required for this opportunity, and users can interact if they need to with the parameters for a given font's typography, or in cases of extremely rare opportunities, with individual characters within the font, but in general, the user's are specifying no more than line length, leading point size and other "last opportunity" variables, and the font/TeX takes the other cares away...</p>
      <p>"Hmm. David and Thomas, are you saying that Chinese language programs assemble Chinese characters on the fly from radicals?"</p>
      <p>Hmm? There are some for sure, that assemble on-the-fly, which is to say, when the character is called by the font manager little parts recipies and interpreters whirl out Chinese glyphs. My guess, is when the MS and Apple fonts were being specified, the imagination of the specifiers was to ask the Japanese partner for "The" definition of "Quality". That definition was of fonts made in digital format to mimic a size of a font made for metal or film. Narrow specification complete for wide application, figure out the input your selves... Other font makers "over there" have other standards of quality more appropriate to applications outside of print, where vast glyph armies that don't scale, rotate, skew, contour, shadow or color well, are... less useful to the market.</p>
