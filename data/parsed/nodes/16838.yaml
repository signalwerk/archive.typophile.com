      <p>John wrote earlier:</p>
      <p>"What OpenType cannot do is the kind of thing Tom Milo is doing with his Arabic engine, but then no previous Arabic typesetting system has been able to do what Tom is doing, which is to directly model both the rules and the order of the classical calligraphic styles. "</p>
      <p>This is not correct. We set out to emulate what Middle Eastern typographers were able to do. All Middle Eastern typography was focused on direct modeling of the classical calligraphic styles, nothing less. Quite specifically, we were inspired by a personal document written and typeset by Ohanis Mühendisoğlu in which he explains and proves how he did it.</p>
      <p>Elsewhere on typophile I placed images of Mühendisoğlu's naskh and (nas)taʿlīq typefaces that unambiguously prove his: he directly modeled both the rules and the order of the classical calligraphic styles.</p>
      <p>Mühendisoğlu's naskh became the mother of all naskh typefaces. In the Aramco World article about Tasmeem, you can find illustrations how he inadvertently left an idiosyncrasy in his design that can be found in practically all later Western naskh typefaces.</p>
