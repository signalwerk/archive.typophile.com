    html: "<p>Erik is likely referring to the intermediate masters technology employed by Adobe for a small number of their later MM families (Adobe Jenson and Kepler, I believe, but I'm not sure about others). David Lemon at Adobe described to me their attempt to model the Kepler design space: it sounded like a cross between Frick and Watson's famous DNA model and a Kalder mobile, with sixteen primary masters and intermediate masters between some of them. FontLab only supports primary master interpolation (but as a design tool it also supports extrapolation, thanks to Adam Twardoch, which is a nice feature that MM didn't have).</p>"
