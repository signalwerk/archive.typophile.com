      <p>Hi Paul,</p>
      <p><em>is this the type of thing you’re alluding to?:</em></p>
      <p>That is a start, but I was also referring to a concern that has come up in this thread, including dberlow's comments, viz., that the format was designed largely with commercial interests in mind. If so, then typographers and high-end typesetters should take the lead on the Next Big Thing (tm), and not merely follow the lead of the commercial giants. OOo and TeX provide free, open source platforms for testing new ideas in both the mundane word-processing world and the high-end typesetting world, so we don't have to "wait" for the commercial interests to act first; let them follow the community's lead.</p>
      <p>Best<br>
      Idris</p>
