      <p>Various comments:</p>
      <p><cite>coming into general use is the input of radicals to form complete characters, and the future trend is towards the most intelligent computer-aided input possible....</cite></p>
      <p>Even if this is true, it is essentially independent of fonts. Each collection of radicals need to be mapped to a character, and this can happen before or after mapping to glyphs in the font. Or contrariwise, a character could be mapped down to a collection of radicals for drawing purposes. You still need to know the character regardless.</p>
      <p>Incidentally, there is more than one proprietary Asian font development environment that uses a stroke-based system to assemble glyphs from collections of radicals. But that's a separate question from what format the font ships in. It's akin to the fact that we can use multiple master tech as a design tool regardless of what format we ship the final fonts in.</p>
      <p><cite>There is something called Adjacency. The issues of Adjecency manifest themselves in different ways in each of the major scripts. Having separate technologies to deal with them, is as stupid as I’ve ever heard....</cite></p>
      <p>I agree. It's a good thing that OpenType uses the same technologies of GPOS, GSUB, and contextual layout regardless of the script. Sometimes the feature tags differ, but that's pretty trivial, really. (Of course, one could say something similar about GX/AAT as well.)</p>
      <p><cite>Is there a type word beyond more kerning pairs, for typographic adjacency,,, please?</cite></p>
      <p>Contextual layout behaviors. This encompasses kerning and more. Note btw that kerning in OpenType is not restricted to pairs....</p>
      <p>BTW, David, Chinese does not solve the adjacency problem by grouping radicals into characters. Chinese solves the adjacency problem by then making those characters monospaced, at least in metal and AFAIK film composition systems. However, Chinese writing is not necessarily monospaced; the typesetting systems imposed new constraints upon the pre-existing script. (All of this is true for Japanese as well, btw.)</p>
      <p>WRT GX/AAT, whether or not Apple ever developed a version for Windows is irrelevant - they never deployed it on Windows, and they refused to license it to Microsoft. Result: GX/AAT is and has always been a Mac-only technology in any way that matters.</p>
      <p>For multiple master fonts, ATM Light is required on Windows 2000 and XP to get them to work. (Perhaps the default instance will show up without ATM, I forget how that worked.)</p>
      <p>I'm not going to respond to Bill's comments and speculations, regardless of the truth or falsehoods in them. I did a big public presentation at ATypI a while back on why MM fonts went away, and I was there when the decisions were made. Bill can believe what he wants.</p>
      <p>Cheers,</p>
      <p>T</p>
