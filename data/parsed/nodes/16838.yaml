      <p>I have a question. Earlier, Thomas spoke of how big an advance OT is, how it shouldn't be surprising that apps can't deal with it yet (10 years later), how 'difficult' everything is.</p>
      <p>Wait a minute, Thomas. Apple did this all with GX in the mid 1990s, and they had the code for both Windows and Mac. So where's the difficulty? Where's the 'advance'? In another ten years we might have a bit more OT progress, a bit of MM, but what is that compared to what Apple coded for both platforms in 1995? Something is wrong with this picture, because here we are ten years after OT and neither MS nor Adobe yet supports it fully in their own apps. Under these circumstances, why would, and how could, anyone else support it? And as David points out, if it really is useless for Chinese and Arabic ... what's the point?</p>
      <p>Here's my dummy's question. Simplifying the issues to an extreme, is it roughly true to say that the philosophy of GX was to make advanced typography features easily available to app developers whereas by contrast, with OT, the burden is on the app developer to implement advanced typography features himself?</p>
      <p>And if OT really is a cock-up, as it appears it is, isn't it better to admit that now and try to fix it before any more app developer time is lost? We've had ten years of excuses. That isn't good enough.</p>
      <p>And finally, isn't it time for everyone - Adobe, MS, and even Apple - to look at GX again as a model? GX was not just about type, after all. The point of GX was to provide built-in code for all advanced graphical application development so that, for example, an Illustrator-quality app could be built to version 2.0 quality in six months and to version 8.0 quality in 12 months, and this by a tiny team. I give just one example. LightningDraw was the first bezier curve program to offer transparency. That's because GX had it built in and all the app had to do was call it. That happened around 1996. It took Corel, Adobe, and Macromedia another three years or so of phenomenal effort to get transparency into Illustrator, Draw, and Freehand. What a waste of intellect and shareholder dollars.</p>
      <p>Now look at Adobe and MS and their investment in their own complex apps which now enjoy near-monopoly status. And you wonder why they don't really want to make things better for other app developers. </p>
      <p>Now look at Berlow's comment roughly to the effect that foundries have to all intents and purposes been effectively excluded from OT development. </p>
      <p>Now ask yourself: if you're going to stealth in a closed type situation, what better thing to call it than _Open_ Type?</p>
      <p>What a complicated situation this is. Where do we go from here? Where are the people of intellectual calibre adequate to lead us out of this mess?</p>
