      <p>I think many (though not all) of the criticisms of OpenType made here are valid and reasonable. However, there are a couple of things worth keeping in mind:</p>
      <p>A) Even if it's imperfect, OpenType is a huge advance over plain old Type 1 and TrueType.</p>
      <p>B) It's a huge amount of work to develop a font format, and a font format needs support from OS and application developers. The only reasonable alternative to having OS and app developers do it themselves is a consortium or standards body - which is where OpenType is moving anyway. Font developers can't do it by themselves.</p>
      <p>C) It's also a huge amount of work to do all the support infrastructure for a font format, especially the layout stuff in apps/OSes, the tools, and so forth. This infrastructure stuff is like a huge ship - it turns very slowly when it needs to make a course correction. This means that any new format takes years to get everything in place and iron out the kinks and bugs in the support.<br>
         TrueType had a slightly rough start back in the early 90s, and that tainted it for over a decade in the eyes of the professional publishing industry. Type 1 MM never got wide application support (I'm the one who pointed out that we had more active OpenType support in applications before shipping any fonts than we had for MM when we stopped making new ones). OpenType has had a fine start, but it's taken quite a few years to get to where we are now, and we're still not quite "there" yet - though we're close.</p>
      <p>So, I think that all of these factors mean that the costs and difficulty of trying to change directions to "something else" are pretty large. Is it worth waiting another 5-10 years, and scrapping and re-doing the existing infrastructure investment?</p>
      <p>Comments on a few specific things:</p>
      <p>&gt; 1. It is missing variations, MM or ANY KIND. All styles are descrete outlines and that’s just so 1980’s. Size axis are cut off, and resolution axis, sheesh, they don’t even know what you’re talking about.</p>
      <p>Yes. Unfortunately, our experience with MMs was that applications were not very interested, and users did not easily "get it." Of course, one could put this down to insufficient evangelism (my own explanation of it).</p>
      <p>&gt; 3. OT as John Points out, the features are limited by Adobe’s and MS’s desire/footprint.</p>
      <p>Well, although the existing spec has accepted a number of proposals from other parties, it's now becoming an open standard so this won't be true in the future, if it ever was.</p>
      <p>&gt; But the real bummer is that the UI hooks to these features are “hardwired” into app(s), so the end of spreadable creativity in this area comes up pretty fast. I.E. An update is required so that the feature tables include the UI names of features, so they can be passed directly thru apps. to users.</p>
      <p>In a global environment, the choice is one between having the feature names hardwired into the applications, or saying that the font developers are responsible for translating the feature names into all possible languages. If you come up with a new feature, are you up for translating its name into every single language supported in the Mac and Windows UIs? I know I'm not....</p>
      <p>&gt; 4. There are no options for encrypting anything, so all of your work goes public. when you publish it.</p>
      <p>It's possible to stick an encryption mechanism on top of any font format, including OpenType. I know that some Asian font developers have used PACE technology (<a href="http://www.paceap.com" title="http://www.paceap.com">http://www.paceap.com</a>) to do encrypted OpenType fonts on Mac OS. Not sure if their Windows stuff will do fonts as well, could be.</p>
      <p>That being said, I think that encrypted fonts that are tied to a user's computer are a bad idea for a whole bunch of reasons. But that's another topic.</p>
      <p>Cheers,</p>
      <p>T</p>
