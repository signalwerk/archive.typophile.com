      <p>From Adobe on the same topic:</p>
      <p>"OpenType fonts have been embraced by creative professionals worldwide, who recognize the benefits of multilingual support and the new levels of creative control they have when delivering high-impact text for print, the Web, and a wide variety of computing and display devices," said Digby Horner, senior vice president of Engineering Technologies at Adobe. "The ability to compress and embed beautiful resolution-independent text as part of an MPEG-4 application will expand the creative options open for everyone working with a broad range of multimedia technologies."</p>
      <p>Yow. Now that is a lot to live up to: compressed and embeded beautiful resolution-independent KANJI IN MOTION at text sizes...</p>
