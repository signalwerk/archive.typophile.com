      <p>Idris: <cite>There are two schools of thought on this. One school, perhaps the dominant school, says, “Hey, let’s adjust Arabic-script typography to fit Western digital typography technology; forget the manuscript tradition”. The other says, “No, let’s create a technology that can bring the manuscript tradition into the age of digital typography just as it was brought into the age of metal-type at the turn of the 20th century”.</cite></p>
      <p>But do you see these two sides as the only two possible sides? Besides, aren't these <em>technological</em> sides, and not really font design and looks related as such? Is part of what you are saying with bringing the  manuscript tradion into 20th century is akin to being able to properly spell <em>naïve</em>? Or am I confused? </p>
      <p>I'm still also mystified at the lack of the evidence in form of additional features (which can do pretty darn anything[1] with just the existing lookup types) for a push in the direction of change. After all, if it is being held back, surely pressure for such with accompanied patches for pango / qt would cause some to exist by now? </p>
      <p>[1] and by anything I mean that you can make a virtual machine equivalent to Turing machine</p>
