      <p>Nothing to do with the topic of the thread, but a correction:</p>
      <p>&gt;not-so-long-ago abandoned manual strokes produced with the hand</p>
      <p>&gt;coming into general use is the input of radicals to form complete characters, and the future trend is towards the most intelligent computer-aided input possible</p>
      <p>AFAIK, neither of these statements is accurate. I was recently in China. Everybody is trained to do decent looking characters--which are not easy--and I was struck that every broken-down shop has hand-written signs and posters that generally look quite competent, and sometimes excellent. The tradition of writing characters is strong, and alive. (They generally don't understand that roman characters look wrong when written with a round brush, but that is another matter.) </p>
      <p>The current method of inputing Chinese characters into the computer is through the romanized phonetic Chinese, Pin Yin. You type the phonetic pronunciation in roman characters, hit the tone number (1-4) and the character pops into your text. Everyone in China is now taught Pin Yin writing along with Pu Tong Hua (Mandarin), so all young people can use use the computer in this manner, if they have gone through elementary school. There is no reason to think the inputting through strokes or radicals is the wave of the future. </p>
      <p>The traditional education involved simultaneously teaching water color painting and calligraphy. I thought I heard that this is being dropped, and the use of romanization for the computer in this way may threaten the general excellence of Chinese writing. By the way, you can't judge Chinese graphic design by the horrible examples you see in China Towns in US cities. The general level of graphics in Chinese cities is much better. How they handle words in roman text and logos, which are fashionable, is often clumsy, though.</p>
