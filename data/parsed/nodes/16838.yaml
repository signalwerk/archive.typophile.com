      <p>David, you've described to me why variations are an attractive type design tool to address optimisation for diverse different size and resoluton conditions. I don't doubt it. But the question is whether this is something that belongs in the font format, as something shipped to the user that he is supposed to figure out how to make optimum use of with sliders or other UI options, with the caveat that only some applications may support such features? Or is it better implemented as a tool to develop discreet instances tailored to particular conditions and licensed as individual fonts?</p>
      <p>I think font formats should be pretty simple containers into which richly developed content can be poured (and yes, I know that I've left myself open to another elephant shіt metaphor). We've seen how long it takes software developers to support OpenType Layout properly, and this is a level of additional complexity that is necessary to support most of the world's written languages in even a basic way. We could define the world's most wonderfully featured font format, that would do everything we want and do it better than OT or AAT or Graphite or ?, but if those features end up supported by one minor start-up application in a corner niche of one platform with a tiny share of the market, so what? A font format is one part of a text processing and graphical layout architecture, and it is the whole thing that needs to be overhauled, not just the font specification, which is so much virtual paper by itself.</p>
