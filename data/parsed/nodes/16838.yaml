      <p>Karaoke is a technology 99% of the world can relate to, but some would argue that quality captioning text for translated subtitles or captions for the hearing-impaired are more important.</p>
      <p>MPEG previously used OpenType as an externaly referenced proprietary spec, but other standards (digital TV, high-def DVD etc.,) require the standards they reference to be open standards. As MPEG had already accepted OpenType it was decided that OpenType should be standardized through ISO's MPEG sub committee (SC29).</p>
      <p>If you'd like a copy of the PPT we presented on this at ATypI I'd be happy to forward it. </p>
      <p>Cheers, Si</p>
