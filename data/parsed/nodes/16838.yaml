      <p>Hmm. David and Thomas, are you saying that Chinese language programs assemble Chinese characters on the fly from radicals? </p>
      <p>I don't think this is true. Also it seems mind-boggling to think of a program that could do this, given that there are none, it seems, that automate kerning and bolding that well. Assembling the radicals would also involve rescaling as well as bolding and thinning, and the characters splash around more than roman, so the fitting problems would be greater. </p>
      <p>In 'Now Read This,' on the new Microsoft Clear Type fonts, they say that the Kanji characters (= Han Zi = Chinese characters) for the font Meiryo were drawn by a team. The first 3000 were drawn, and "carefully analyzed as models to make subsequent production of the rest as automated as possible." The others were produced by the Japanese firm C &amp; G, "using their in-house automated production method working with the analyzed data of kanji radicals." I gather from this that they needed additional information on each radical--perhaps for just this typeface--as to how to scale it, and perhaps also needed to look and correct. </p>
      <p>In any case the all the Kanji characters are in the font, and not assembled on the fly. As I said, Chinese is input using the Pin Yin romanization, and I would guess that Japanese is input using the Japanese alphabet, hiragana, rather than radicals.</p>
