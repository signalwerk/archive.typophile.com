      <p><em>But do you see these two sides as the only two possible sides? Besides, aren’t these technological sides, and not really font design and looks related as such?</em></p>
      <p>The two are related. Without the adequate technology, font design suffers. Why design a serious font that implements fine traditional typography if there is no engine to render it?</p>
      <p>Again, I don't deny that there are works of beauty out there with the limited technology, but even those designs could be better if there were a technological paradigm appropriate for Arabic out there.</p>
      <p>The ligature approach is extremely inefficient as far as traditional Arabic is concerned, and puts far too much burden on the type designer. With the correct technology one can do really fine Arabic typography with no ligatures, and type designers would take less time on any given advanced font.</p>
      <p><em> Is part of what you are saying with bringing the manuscript tradion into 20th century is akin to being able to properly spell naïve? </em></p>
      <p>Yes, that is part of it. For example, there is no application that makes it easy/painless to implement vowels and diacritics. Try editing/correcting anything more than a couple of vowelized sentences in Word or anything else and u'll see what I mean. </p>
      <p>Best<br>
      I</p>
