      <p>Rather than a critique of OpenType, I'd like to offer an alternative, hypothetical model for a font format:</p>
      <p>SPINE-BASED METAFONT</p>
      <p>That's spine not spline.<br>
      Each glyph's 'artwork" would be the basic, un-stroked path(s) that lie at the centre, or spine, of the glyph's stem(s).<br>
      These spines may be fleshed out by the type designer in a number of ways.<br>
      1. Most obviously, "expand stroke"; this would have sliders for width, contrast, and angle of contrast -- and these values could be varied for different sections of the spine.<br>
      2. Terminal. These could be specified from a variety of boxes for different serif types, including "no serif". Each of these options would be editable, for instance "no serif" could be varied between perpendicular and round.<br>
      3. Outline Style. This would be applied to the outline eventually generated by the user. Like the Adobe Illustrator feature. This could make a rough, size-scalable texture, for instance.</p>
      <p>These values would not be applied by the font tool and forgotten, but would be part of the font.</p>
      <p>Then rather than calling up an outline for each glyph, the font tables would specify values for each of the "fleshing out" variables. Variations of these values could be included in the font, specifically for different output devices. End users, should they desire, could over-ride the built-in values. Compare with the Edit Kern Table feature of Quark XPress, or Multiple Masters. </p>
      <p>The spine-based model of font design is rather like character-building in a video game (or the recent South Park website, threaded at Typophile recently).</p>
      <p>While it may not be as subtle as outlines in rendering display type, the spine-based format would be more amenable to joined cursive letterforms and ligatures. </p>
      <p>It would be possible, for instance, for a display/output device to smoothly "force-join" spines that don't quite line up.</p>
      <p>The creation of characters missing from encodings not supported by the font could be done intelligently by the user's application defaults -- such applications would have a database of spines for all encodings, compare the font with the required encoding, substitute missing characters/spines as necessary, and apply whatever the "flesh out" values of the font are.</p>
      <p>This idea isn't new, but goes back to Donald Knuth's pioneering work of 30 years ago.</p>
      <p>Also, it could be connected to live streaming data, as per the LettError "Twin" typeface.</p>
      <p>This mutable basis for a font format is more appropriate to the digital era than the present one of fixed outlines.</p>
      <p>I've just come across the SVG font format, which seems to be along these lines?</p>
