      <p>Hi Israel, just for the record, I want to clear up the point you raised here:</p>
      <p>&gt;On a different topic, I think Multiple Master technology failed because certain letterforms, like the m and w need wider widths and radical design changes at small point sizes in one direction, and a totally different set of rules for narrower widths and different letter designs for larger point sizes in the other direction.&lt;</p>
      <p>The design differences for m and w over large axes are not so great that they have not been resolved by slight compromises in design at the axis extremes -- or even without compromise. However, when the letter really does need to change, Adobe (but almost nobody else) used an intermediate master. This was first implemented in ITC Garamond MM for the w.</p>
      <p>An impeccable source who would probably prefer to remain unnamed has definitively explained Microsoft's historical reluctance to support MM in OT. One major reason was that neither MM nor Variations gave Microsoft the kind of hinting quality it was looking for. Microsoft thought that optical variations could (for which you might read would) add much to their quest for better screen quality, but not until they could be hinted better. </p>
      <p>That is an entirely understandable position to take, especially given the vast amount of work MS has put into screen quality. Adobe didn't come up to the plate on that. Another point, but one I find less acceptable, is that "proper support" (by which Microsoft really does mean proper support) would mean 'we needed to seamlessly integrate it throughout the whole font API in Windows. This would mean adding additional "font state" for every API, and/or adding additional APIs (ExtExtTextOut was just too much!) This would have been a large testing/architectural hit for, in my opinion, something not used by many customers. (I agree that this is a catch-22 situation)'</p>
      <p>That's not so easy to accept because adequate (if not proper) support for MM was already automatically present for all Windows apps via ATM (built-in or not). But Microsoft's hinting concerns _were_ important.</p>
      <p>Finally, when you consider that while Microsoft was not willing to dump its MM customers (to the extent that Vista still supports MM via ATM 4.1 if UAC is turned off), but that both Apple and Adobe are willing to dump MM customers, you can see where Adobe would prefer to sit on its hands rather than do any extra work for other companies. This has been a traditional cultural problem for Adobe: it wouldn't support MM development in Fog; it wouldn't support MM usage in anyone's apps; it wouldn't add value to OT STD fonts because that would benefit other foundries; it wouldn't support ATM or MM in OS X; there are countless other examples of its cutting off its nose to spite its face -- but they can all be understood when you realize that Adobe's gut allegiance is to closed standards. Never forget that John Warnock cried when he made the public announcement that the Type 1 spec would be released. Time and time again, for 16 years, I have heard the same thing from dozens of companies: "Adobe wouldn't give us the support we needed." And that's of course why ATM is built into Adobe's apps: that way, MMs can work within Adobe's apps (though not elegantly) but not necessarily in other companies' apps. Obviously, the last thing we want is a font format that only works in Adobe's apps.</p>
      <p>Dropping MM support was not a popular move, and the executive who made the decision, a tosser (as they say in England) called Dan Mills, was soon thereafter let go.</p>
      <p>So whatever the reason MM or a superior technology is not, at present, with us, it's not because of the shape of m and w. </p>
      <p>Anyway, that's why MM lost out in the late 90s. But going back in history, there are other reasons. Apple's GX supported both MM and GX variations superbly and fully at the OS level. GX gave you all of that plus essentially everything that OT provides. </p>
      <p>Microsoft strongly desired to license GX for Windows 95. So we could basically have had everything we want and still don't have in font technology on August 24, 1995, except for one thing:</p>
      <p>Apple wanted too much money -- even for Microsoft -- and there were some other fancy restrictions they wanted to place on the technology. But they were within a heartbeat of agreeing on a deal that would have benefited us all colossally (not just as regards fonts; GX made much of advanced application programming ridiculously easy).</p>
      <p>Remember how Apple wanted too much money for Firewire? That's why we have USB2, which nobody wanted to design.</p>
      <p>Apple lost out -- because GX didn't ultimately benefit it -- and MS lost out because it had to redevelop the technology in a much less elegant manner that 13 long years later is still not there. (GX took only 4MB of additional memory!)</p>
      <p>What's the greatest argument in favour of MM? Well, today, it's that I just sent a font to someone. He asked, 'could it be a little darker?' -- sure it could, if he wasn't on a Mac. </p>
      <p>I suppose the moment will never come again when there could be a unified graphical technology and programmer toolbox for MS and Apple.</p>
      <p>What a pity! It was so close!</p>
