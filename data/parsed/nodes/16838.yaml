      <p>DB: <em>I firmly believe that real Chinese and fancy Arabic CANNOT BE MADE for TEXT &amp; DISPLAY, or for SCREEN AND PRINT, to the standards of even metal, with OT</em></p>
      <p>I don't know enough about Chinese typography to comment on that, and I'm not sure how you compare SCREEN typography in OT with what was available in metal type -- a singular case of apples and kumquats --, but I do know quite a lot about Arabic typography. What can be done with OpenType for Arabic is better that 99% or more of the metal typesetting of Arabic ever produced. In fact, there is really only one example of metal typesetting that surpasses what has currently been done with OpenType, and that is found in one half of one book printed in the Ottoman Empire near the turn of the 19th-20th centuries. It is only found in one half of the book presumably because the system was so difficult to get right that the compositors seem to have stopped paying attention in the second half; perhaps they had a deadline to meet and couldn't spend so long selecting the appropriate special sort to use in each instance. I have not analysed this edition, but I would be surprised to find that there was anything in it that could not be modelled in OpenType. As long as you are dealing with a discreet set of fixed shape sorts that are positioned relative to one another, there isn't a lot you can't do in OpenType with some ingenuity in the layout lookups. What OpenType cannot do is the kind of thing Tom Milo is doing with his Arabic engine, but then no previous Arabic typesetting system has been able to do what Tom is doing, which is to directly model both the rules and the order of the classical calligraphic styles. This involves dynamically adjusting the glyph shapes on the fly and breaking the text string into stratified layers and writing them successively, anticipating what will be the int subsequent layers. Neither of these things can be done in OpenType, but then they couldn't be done in any other typesetting system either.</p>
      <p>Tom's technology is another good example of a specialised typesetting system, appropriate for a high end publishing system employing the classical script with all bells and whistles. And it is crucially important that such technology exists, but you wouldn't necessarily want to use it for your Arabic e-mail. There are technologies and levels of implementation that are appropriate to different circumstances, and the level of complexity that you want for one purpose might simply be an inefficient processing overhead in another situation.</p>
