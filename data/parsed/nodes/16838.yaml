      <p>John,</p>
      <p>I agree with you that set of features registered in OpenType spec is not ideal. I also agree that feature descriptions are confusing sometimes because they are largely a mix of requirements/recommendations/hints for app/font devlopers without clear indication of what is what.  </p>
      <p>But I do not agree with your method of solving inconsistencies in feature set by introducing new concept of required and not-required lookups within a single feature. Not because it will require changing all implementations<br>
      of OpenType layout in the world :). It is not actually many features that will require both required and not-required lookups. 'liga', 'calt', 'kern' - what else? I do not see it is worth to introduce new concept in OpenType layout format. This concept may be very confusing and hard to define behavior for - basically, for the same reasons why we do not recommend using required feature now.</p>
      <p>Your approach may be useful in tools, though. Particular tool may provide a feature that will assign "required" lookups from one feature tag to some other (if tool is smart about relations between features). But it is not about OpenType layout specification.</p>
      <p>Thanks,<br>
      Sergey</p>
