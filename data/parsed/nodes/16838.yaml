      <p>"David, could you please explain how you use Mutator"<br>
      Not really. I mean, I can flap on about drawing a style and drawing another style with identical points, and then about making an axis, assigning its granularity, and then about outputting polations of various kinds, editing them and re-vacuforming them, but...Apple does not support Mutator, in fact, they revised the application ('99 or '00 I think), not to work, or at least since their revision it has not worked for me or anyone I know. Beating a dead horse comes to mind. </p>
      <p>The only way these things will be put into a future font standard, is if all three companies suddenly wake up, realize they are in old mud, and TOGETHER, plan a better future for type. That, for the last ten years, has seemed to me like illuminating a black dog on a dark night, knowing that the dog is there, and trying to get other people to see it. </p>
      <p>"TrueType had a slightly rough start back in the early 90s, and that tainted it for over a decade in the eyes of the professional publishing industry."</p>
      <p>ollol ...I think that's one point of view. </p>
      <p>Another, would be that "Font Wars" occurred because Adobe went 1-r-2 negotiations too far in trying to have a monopoly on Type and Page Descriptions, and... Interpreters ;). Apple developed TT and offered it to MS with nice binding provisions. Then, Apple and Adobe Agreed that Apple wouldn't use no stinkin' PS Clone, and Adobe Would put TT into Its interpreters. So, peace came to the foundries, and OS...but, because MS and Apple Didn't bind, and Adobe Didn't really let TT in for a while, the war damages moved to the users where they continue in a lingering fester of occasional mishaps, like Courier ending up in an airport poster, with really bad spacing, like, it was substituted. </p>
      <p>Another, completely different point of view, would be that Adobe had a very narrow sense of quality in type — high quality for print and 300 dpi, only. TT came along and offered both Higher and Lower, in addition to High Quality type. This caused great, and to me hilarious, consternation. Still does. But at the time, unfortunately, decisions were being made about type on the web, and based on one format being incapable of delivering web quality type, and the tainted quality of TT, we got the web all the way up to proportional bitmaps as good as a typewriter of no particular distinction, in no time flat. ;)</p>
      <p>I don't mean to pick you at all Thomas, its three whole companies and their imagination-free trudge on, head down, devotees.</p>
      <p>Before anyone else outside of Microsoft had the right to VOLT, FB made the right stuff available in fonts for customers who wanted future OT compatibility. We as a company, and I as me, are/is — all for, all formats, all the time. Being without sin on this issue,, I'm left with the obligation to throw rocks. :) We (founders), have Got enough sticks: broad character sets, a plethora of rasterizers (2 being 2/3 of a plethora in this case), a resolution range from here to kingdom dumb (can you do 7 ppm?), not to mention the moving target of fashion and We also have to erase a barrier that divides us from users: where we do more of their composition, and they put better butter in the fridge, as directly as possible, if not in person. Where, exactly are the carrots?</p>
      <p>"for the most part the only things you need to type are glyph names, numbers, and the occassional -&gt;"</p>
      <p>Wow! I can't wait to define glyph substitutions myself! I sounds so...fulfilling. It could possibly mint thousands of new type designers with all the skills of a ...typist.</p>
      <p>We really do need a higher standard, shared by ALLLLLLLLLLLLLL, that allows even higher quality and even lower quality, even more functionality and even less functionality, than the "modern" formats. Scary? Big Deal, The things I list for additions to a new font format are enough to directly and indirectly cause universal employment, at least. Otherwise, we're letting the 15th anniversary year of the "peace(s)" slide by, and you're indicating that a "consortium" of some sort is going to cast the current plateau of rather inflexible and tainted technologies into broader standardage than it already is? <strong>...sounds like old fish stew with fresh greens.</strong></p>
