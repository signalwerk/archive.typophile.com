      <p>"If you come up with a new feature, are you up for translating its name into every single language supported in the Mac and Windows UIs?"</p>
      <p>Apparent Reasoning: "if Adobe Doesn't want to do it, (translate features into UMPTEEN languages), then why would anyone want to do anything at all about the issue?" Answer, they wouldn't, I wouldn't. I'd call it "Cap Figures", it'd pass through the suddenly genius app, and the user would see it "Cap Figures". . . I'm not trying to please the whole world, just a few endowed customers. The rest of the wolrd would never even need to know that Adobe was doing the right thing.</p>
      <p>"That being said, I think that encrypted fonts that are tied to a user’s computer are a bad idea for a whole bunch of reasons"</p>
      <p>Reasoning: "The only way to implement encryption will make all customers unhappy." Adobe did it that way, released encrypted fonts as Retail Products...but that does not mean Encrypted fonts do not have a huge audience of customers who simply do not want their fonts wandering off with every change of Art Director. And, NO ONE is holding a gun to either the founders or the buyers head to make or use Encrypted fonts. It is called a choice...heard of that have you? Only the people who wanted it would ever need to know it existed...</p>
      <p>Problem: MS, Adobe, and Apple seem unable to see type in the Bigger Picture.<br>
      A technical plateau, now, 14 years old, is not a good thing. </p>
      <p>"Is it worth waiting another 5-10 years, and scrapping and re-doing the existing infrastructure investment?"</p>
      <p>ALL of crit points I made are font format issues in the hands of OS font management software. Apps, would need to make zero changes, or just erase code and turn it over to the right authority, the OS...That has been the No.1 issue from DAY ! of OpenType, pka TT Open. Adobe has no OS, so it wanders back and forth. Apple and MS could not work out a way to share what they share, and MS STILL doesn't have OT implemented at OS level, despire warnings that implementing App by App for "competitive reasons" was just plain bone headed, YOU HEAR ME SHAMEN? ;)</p>
      <p>And variations, well, I guess that's just "too hard," it's much easier to toss a thousand fonts into a menu and let the user swim, or sink.</p>
