    html: "<p>A small correction, Chris: not a pair of axis (sic - the plural is axes) but a single axis between a pair of principal masters. So a single-axis MM font had two masters. A two-axes MM font had four masters. And so on. The maximum number of axes allowed by the format was four, i.e. sixteen principal masters. [I use the term principal masters, because in later versions of MM, Adobe introduced the idea of intermediate masters, i.e. a master part way along an axis between two primary masters, which would affect the interpolation on either side of it.]</p>"
