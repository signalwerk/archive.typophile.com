    <p>HI all, I've been using this mark for a little while now but never had any opinions from any type people. So let me know what you think! It's for my freelance company studio513.net better known as Studio513. My tag line is "Embracing the butterfly effect." The 513 was my late grandmother's birthday so I named it after her.</p>
    <p>So the little icon representing me is what I'm talking about....</p>
    <p>Thanks!</p>
