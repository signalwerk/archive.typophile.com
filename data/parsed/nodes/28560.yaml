      <p>About your website, i don't see any reason why to use Flash at all as everything you are doing/showing can eassily be achieved in HTML/CSS. Why don't you look into a free blogging software such as Wordpress to show your work (have a look, this is what i use) - You don't have to be a technical whizzkid to implement it and it can be easily customised to meet your needs.</p>
      <p>And this might just be a personal opinion, but it might be a good idea to remove that counter at the bottom of the page.</p>
