    html: |-
      <p>Hi Datura</p>
      <p>Does the butterfly (and your tagline) describe what you do? If so, stick with the butterfly, but I think you could try to make it fly (it's a bit rigid for a butterfly).</p>
      <p>Are you totally happy about '513'? Is it well-known among your customers? I mean, choosing a firm name because it is your grandmother's birthday is not the normal way of making an excellent firm name. I knew a person who set up a design firm called 'Magnolia' because she liked the movie. I would say that this is not the best approach.</p>
      <p>--<br>
      soren olsen</p>
  - id: 161281
    user_id: 14800
    user_name: Datura513
    user_path: null
    date_raw: 7 Oct 2006 — 9:52am
    date: 2006-10-07T09:52:00
    votes: null
    html: |-
      <p>Maybe I should explain a little more. I am no where near a "design firm." My full time job is for another company. This is more of a place for me to display my freelance work. I'm prob considered and amateur to the people on this site!</p>
      <p>My tagline is "Embracing the butterfly effect." Which to me is a metaphor for the design process--how one thing effects another in the design itself. </p>
      <p>About the 513--my grandmother was more of my mother and I lost her when I was 18, it changed my whole life. I feel like she is still watching over me which is why I named the studio after her. My goal is for her to be proud of me and my art.</p>
  - id: 161398
    user_id: 4004
    user_name: soren_olsen
    user_path: null
    date_raw: 8 Oct 2006 — 8:24am
    date: 2006-10-08T08:24:00
    votes: null
    html: |-
      <p>My point is that you must not choose a firm name (no matter how small a firm) that becomes an obstacle. If your grandmother meant a lot to you, then fine. But if everyone that sees the mark misinterpret it, then you should not use it, but change to something else.</p>
      <p>I was in fact only talking about principles. And choosing a name for personal reasons that are not obvious to the spectator _must_ be the wrong way of thinking.</p>
      <p>That said, your mark probably works just fine. '513' has really no irrelavant connotations. I was more worried about the Magnolia case.</p>
      <p>But one weakness about your mark is this: when people see, they go: "It reads 53" or "It reads 53 or 513" (the middle digit has a different style than the other two).</p>
      <p>I like the way you have flipped the 5.</p>
      <p>--<br>
      soren_olsen</p>
