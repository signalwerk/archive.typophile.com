    <p>Here is a problem I keep running into. I try to move a bezier handle, either manually or using arrow keys, and the handle on the opposite side of the node is affected. Here is an example: </p><div class="imageWrap"><img src="http://typophile.com/files/fontlab_edit_5851.gif"></div><p></p>
    <p>On the left, I have selected the bezier handle. The result is on the right. I doesn't matter which direction I move it, I get the same result. I would love to find out what I'm doing wrong. Thanks for any help you can give me.</p>
