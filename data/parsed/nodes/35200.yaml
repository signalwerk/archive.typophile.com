    html: |-
      <p>&gt;You may have 2 nodes in close proximity and be choosing the wrong one</p>
      <p>You can detect if you have one node on top of another or almost on top by clicking, and then moving the node eg ten units (shift + arrow). The two will then separate, and you can delete one. Also look out if your node is a start point, as it can limit what you do. You can always change the start point (from the contextual menu) if you are having trouble.</p>
