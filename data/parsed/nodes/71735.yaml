      <p>There's not much authenticity in digitizing punches.<br>
      IMO an authentic copy font should be able to create a facsimile page that is indistinguishable from the original.<br>
      That's difficult, unless you're printing letterpress on 100% rag stock.</p>
      <p>By any other measure, there will be questions about what is "authentic" -- letter shapes, which size is being used as a model, how much distress is being applied, whether the punch or the printed page tells the truth, how much accommodation/modification should be made for present day demands, &amp;c., &amp;c,</p>
