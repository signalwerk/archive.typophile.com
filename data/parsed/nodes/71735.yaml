      <p><cite>whether the punch or the printed page tells the truth</cite></p>
      <p>Can’t this question be answered with the statement, that people don’t read punches, but prints? Augereau is probably more the punch than the print.</p>
      <p>These are my favorite digital “Garamonds”:</p>
      <p>1. Merlo<br>
      2. Stempel Garamond slightly enbolded with Fontographer<br>
      3. Berthold Garamond less slightly enbolded with Fontographer<br>
      …<br>
      ∞. Garamond Premier Pro</p>
