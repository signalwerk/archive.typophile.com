    <p>While weighing my options for a professional Garamond—it may be my personal favorite of all type families—I came across a comment on <a class="freelinking external" href="http://cg.scs.carleton.ca/~luc/choice.html" rel="nofollow">this website</a>, claiming Abrams' "Augereau" to be "the most authentic digitization" of Garamond's original punches. I started drooling over Augereau, which is really beautiful, but found that it doesn't look very authentic. Somebody on these forums pointed out the capital R is more heavily stylized than the original; I discovered that the arms of the capital W don't cross. What gives?</p>
    <p>Furthermore, there seems to be conflicting information on the web about the various Garamonds—not even including the Jannon misattributes. Some say Stempel is the most authentic, while others claim this or that feature is too short, too curved, or just plain different. Bitstream renamed all their Garamonds, and Adobe offers two.</p>
    <p>I'm just now getting heavily into typography (I'm coming over from the world of music engraving) and the only Garamond I have any concrete opinion about is the actual original. Before I fork over the cash for Augereau—or any other Garamond—can anybody advise me on its authenticity, or the authenticity of any of these in general?</p>
    <p>Thanks!</p>
    <p>—Bram</p>
