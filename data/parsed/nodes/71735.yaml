      <p>Rather a sweeping generalization, John.<br>
      Claiming untruths is not bullshit, it's just false.<br>
      However, claiming that, for instance, a large x-height (or a small one) improves legibility, <strong>is</strong> bullshit, because it is neither true nor false.<br>
      Then again, there is advertising which is true, and not bullshit but genuinely informative -- such as the present Font Bureau banner ad at Typophile which states that Ibis has 48 styles and is designed by Cyrus Highsmith.</p>
