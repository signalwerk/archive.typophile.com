    html: |-
      <p>@ William</p>
      <p>You are much more competent on that field. But when I compare Merlo and Stempel Garamond, I see more similarities than differences, except from the different stroke width and contrast. The feeling, that I have, when I see these typefaces, is similar, more than in the comparison of Sabon and Stempel Garamond, which is often called a Garamond, isn’t it? But I wouldn’t exclude, that I see the similarity, because I simply like both typefaces very much. They are in the top ten of my favorites. And Merlo is intended to be used in another point size than the digitized Stempel Garamond. Stempel Garamond is more agile or less even with regard to the single glyphs, but this does not disturb the legibility, because the glyphs are in harmony. I wish there would be optical sizes for both typefaces. For using them in the same document, they are too different.</p>
      <p>Another word to Augerau: The plain metrics and the kerning are a desaster, especially the kerning, as far as I remember. (Much worse than in Stempel Garamond, which already is not well spaced and kerned.)</p>
