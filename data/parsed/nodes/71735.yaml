      <p>Arno: <em>Augereau is probably more the punch than the print.</em></p>
      <p>I think Augereau is more Abrams than (Garamond) punch or print.</p>
      <p>I had the pleasure of meeting Mr Abrams at an ATypI congress, and I have a copy of the nice specimen book of his ‘Jenson revival’, Abram Venetian. It has been a long time since I looked at his Augereau, but I don't doubt that it represents his ideas about the 16th Century French style just as his Jenson represents his ideas about the 15th Century Venetian style.</p>
      <p>There's a long history of new type designs being passed off or advertised as ‘the most authentic revival’. My favourite example is the 1924 Caslon Foundry complete recutting being sold as ‘struck from the original 18th Century punches’. It's advertising, which is another way of saying bullshіt.</p>
