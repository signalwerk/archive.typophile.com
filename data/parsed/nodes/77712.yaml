    <p><strong><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ArdoisePTF" rel="nofollow">Ardoise PTF</a></strong></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/order/ArdoisePTF" rel="nofollow">From € 210 for 8 users.</a></p>
    <p>→ <a class="freelinking external" href="http://www.typofonderie.com/alphabets/try/ArdoisePTF" rel="nofollow">Test it online</a><br>
    → <a class="freelinking external" href="http://www.typofonderie.com/alphabets/use/ArdoisePTF" rel="nofollow">In use</a><br>
    → <a class="freelinking external" href="http://www.typofonderie.com/icono/alphabets/pdf/ArdoisePTF_pdf.pdf" rel="nofollow">Full pdf specimen</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ardoiseptf_05_5719.jpg"></div><p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ArdoisePTF" rel="nofollow">A new typeface by Jean François Porchez</a></p>
    <p>Ardoise PTF was born from a research started with the <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/Charente" rel="nofollow">Charente typeface created in 1999</a>. The later, designed for the daily La Charente Libre, met the needs of a newpapers typeface featuring a low contrast, straightforward forms, as Franklin Gothic.</p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ArdoisePTF" rel="nofollow">Ardoise PTF</a> and its 45 series could be considered as an homage to Antique Olive, but unexpectedly… Ardoise, indeed, share purity and dynamics on its design that give it a unique elegance while showing excellent readability. Its sturdiness virtually immune it to distortion. Each font feature a full glyph set who cover most of latin languages, all aspects of typographic needs such small caps, various set of figures, dingbats &amp; so on. In addition, few alternates glyphs (a, c, g, l) can change the overall aspect of text setting.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ArdoisePTF_exemple_4720.gif"></div><p></p>
    <p><strong><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ArdoisePTF" rel="nofollow">Ardoise PTF special offer</a></strong></p>
    <p><a href="http://www.typofonderie.com/alphabets/view/ArdoisePTF" title="http://www.typofonderie.com/alphabets/view/ArdoisePTF">http://www.typofonderie.com/alphabets/view/ArdoisePTF</a><br>
    To celebrate the launch of the Ardoise PTF, clients benefit a special price of only euros 168 of any of the packs (standard price at € 210). To access this special offer, you must login at, then jump to your account page.<br>
     → <a class="freelinking external" href="http://www.typofonderie.com/contact/" rel="nofollow">Please contact us for activation.</a><br>
    Available through 31 January 2011.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2010_typofonderie_bag_large_6733.jpg"></div><p></p>
    <p><strong><a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=481" rel="nofollow">PTF Bag</a></strong></p>
    <p>How to get yours? Very simple, First-come, first-served: if you buy for more than 211 euros of fonts at Typofonderie, you will automatically receive this bag with your printed specimens, invoice and license.</p>
