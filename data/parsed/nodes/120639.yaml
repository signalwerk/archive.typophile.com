    html: |-
      <p>Your answers are fonts with serifs.<br>
      The lighting on the dog tag may make the letters appear to have serifs, but they could perhaps actually be a sans serif with the light hitting some sides of the raised lettering more than others, which could give the impression of serifs.<br>
      If you have the original and not just a photo, close examination with a magnifying glass should resolve this point.<br>
      don</p>
