  html: |-
    <p>I have been trying to find anything reasonably similar to the font used by dog tag military embossing machines for days now. The font itself must be lighter than the embossed result.  Answering Identifont's questionnaire i says that Briem Mono, Century Schoolbook Monospace or Computer Modern Teletype (CMTT10) are a good match, but I do not agree. Particularly letters O, G, Q and C are different, for example, the O on a dog tag looks like an athletics race track.</p>
    <p>Does anyone know what font this is?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/desc_307320919_00.jpg" width="588" height="343" alt="">
