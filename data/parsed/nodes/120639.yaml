    votes: null
    html: |-
      <div class="comment-spam-body"><p>Comparing the present image with the one in node 3286 I conclude that both are monospaced fonts, which makes sense for stamping keys.<br>
      But I see significant differences, even with this ambiguous image, in letterforms.<br>
      Look for example at the center strokes in _E_ and _F_. Much further in this tag than the one in node 3286. Huge serifs on _I_ in node 3286, but none detectable in this image.  A letter by letter comparison reveals other differences.<br>
      Based on this image I still don't see serifs, or at the most I could perhaps see the hint of tiny ones.<br>
      For a substitute you could use either a Sans serif, as suggested in previous posts,  or a monospace version of a tiny square serif like Cushing Two <a href="http://www.myfonts.com/fonts/bergsland/cushing-two/" title="http://www.myfonts.com/fonts/bergsland/cushing-two/">http://www.myfonts.com/fonts/bergsland/cushing-two/</a> or Bushing <a href="http://www.myfonts.com/fonts/bergsland/bushing/" title="http://www.myfonts.com/fonts/bergsland/bushing/">http://www.myfonts.com/fonts/bergsland/bushing/</a>  or Knubi <a href="http://www.verg.com.au/portfolio/knubi/" title="http://www.verg.com.au/portfolio/knubi/">http://www.verg.com.au/portfolio/knubi/</a><br>
      Unfortunately, the more I look at this I am, persuaded that there is no close digital font.<br>
      Don</p>
      <p>Don</p>
      </div>
