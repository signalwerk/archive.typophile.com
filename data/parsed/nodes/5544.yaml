    html: <p>Jean, that is quite a coincidence! How did you manage to find yourself there? <br> <br>The Newton was originally released in 1993 (discontinued in 1998), so it's very probable that Mr Berlow was using one at that particular ATypI. On a related note, at last year's TypeCon, I was showing Mark Simonson how I had converted his <a href="http://www.ms-studio.com/oldbitmapfonts.html">old hand-tuned bitmap fonts</a> to work on my own Newton.</p>
