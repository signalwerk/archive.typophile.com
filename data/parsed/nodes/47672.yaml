    <p>I’m currently having a debate with another designer on how to appropriately configure widely spaced titles on top of each other.</p>
    <p>In the attached example I’m showing 2 methods. The first uses a consistent letter spacing but a variable size to achieve a justified look, and the second uses consistent size but variable letter spacing to achieve the same result.</p>
    <p>Are there any rules governing this or is it left up to the designer?</p>
