      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tif_4728.jpg"></div><p></p>
      <p>i don't like so much color tattoos, especially in this case: in the middle of the word, any other color (e.g. red) in my opinion breaks the optical weight of the word making it seems two words spaced. i like underlines and in my opinion in this case this works well, it retains the absence of style (as you said, even if i think there's more style here than in many other tattoos) you loved.</p>
