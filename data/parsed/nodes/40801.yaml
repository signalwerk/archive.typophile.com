    html: <p>For me 40’s Hollywood really suggests the hand-painted posters, title cards, credits and sho-cards. What kind of material does this need to go with—does it need to evoke epic films, propaganda films, noir? Or just the immaculately dressed stars in fitted clothes side of Hollywood?</p>
