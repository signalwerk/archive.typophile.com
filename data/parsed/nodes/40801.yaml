    <p>Hi there!</p>
    <p>I have a random, vague question...I know there is no <em> real </em> answer, but I am hoping someone can give me some thoughts, good ideas about this one. My client asked for a typeface that is "hollywood 40s". She also used the words "retro" and "streamlined". Any one have any good thoughts for typefaces under this description?</p>
    <p>Thanks much in advance...</p>
