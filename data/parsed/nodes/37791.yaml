  html: |-
    <p>My supervisor just showed me the slide show she created for a presentation she is giving today. It is not very funny, but she thinks it is, and to add insult to injury, the entire thing is set in Comic Sans. I had to bite my lip, as the proliferation of Comic Sans in our company emails has become a running joke among a few of my peers here at the plant, and this is the icing on the cake.</p>
    <p>Is it my responsibity to enlighten my supervisor? I consider it an embarrassment to the art department as a whole, but I am not the art director, so should I just let it go and shake me poor head in despair?</p>
    <p>What would Tschichold do?</p>
