  html: "<p>I realize that my request is general and subjective. I’m in the brainstorming stage of designing a CD album with liner notes and CD imprint for a live band performance of 1970s songs. I don’t even know what the songs are at this point. For right now, the background is an extreme blowup of someone wearing a tie-dyed tee shirt wearing buttons of the members of the band and a trippy but post-psychedlic peace button. For right now, I’m using Arnold Boecklin, the typeface from That ’70s Show for the name of the band and the performance. I like it, but I my wind up rethinking it at a later date. I’ve spray-painted the world “LiVE!’ in Photoshop and imported it on top of the shirt. So here’s my request: Off the top of your brilliant minds, name some other fonts I might possibly use for headlines and even body copy for a 1970’s tie-dyed integration.</p>"
  html_clean: "<p>I realize that my request is general and subjective. I’m in the brainstorming stage of designing a CD album with liner notes and CD imprint for a live band performance of 1970s songs. I don’t even know what the songs are at this point. For right now, the background is an extreme blowup of someone wearing a tie-dyed tee shirt wearing buttons of the members of the band and a trippy but post-psychedlic peace button. For right now, I’m using Arnold Boecklin, the typeface from That ’70s Show for the name of the band and the performance. I like it, but I my wind up rethinking it at a later date. I’ve spray-painted the world “LiVE!’ in Photoshop and imported it on top of the shirt. So here’s my request: Off the top of your brilliant minds, name some other fonts I might possibly use for headlines and even body copy for a 1970’s tie-dyed integration.</p>"
