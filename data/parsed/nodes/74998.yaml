    html: |-
      <p>Don't get too fancy with psycedelic faces. less is more. use it sparingly. the rest can be Futura, Akzidenz Grotesk, Franklin Gothic, Compacta....</p>
      <p>If you use something like Mojo, keep in mind that you need to distort it a lot in order to look like 60's poster art: <a href="http://www.wes-wilson.com/wp-content/gallery/brignall-article/brignallimg1.gif" title="http://www.wes-wilson.com/wp-content/gallery/brignall-article/brignallimg1.gif">http://www.wes-wilson.com/wp-content/gallery/brignall-article/brignallim...</a></p>
      <p>Don't get too fancy with colors and effects. It's easy to make it look cheesy or retro like this: <a href="http://ec3.images-amazon.com/images/P/B0007IO6WS.01._SCLZZZZZZZ_.jpg" title="http://ec3.images-amazon.com/images/P/B0007IO6WS.01._SCLZZZZZZZ_.jpg">http://ec3.images-amazon.com/images/P/B0007IO6WS.01._SCLZZZZZZZ_.jpg</a>  Doesn't look anything like the psychedelic era to me.</p>
      <p>You might wanna go to a used record store to get some inspiration.</p>
