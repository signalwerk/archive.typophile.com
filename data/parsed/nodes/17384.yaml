    <p>I'm thinking of putting together a "General Posting Guidelines" thread (not this one) that would remain at the top of the posting area in the General Discussion Board mainly to inform newcomers to the boards on how to get the most out of the typophile experience. I'm wondering:</p>
    <p>1) Is this a good idea?</p>
    <p>2)What are some standards you think should be recommended. Here are a couple i think there should be:</p>
    <p>A) Search before you post: many topic have been discussed before. Please use the search function before posting a new thread to see if the subject you're interested in has already been covered.</p>
    <p>B) Image guidelines: Images MUST be in RGB format and should not exceed certain dimensions (what dimensions should those be? you tell me!)</p>
    <p>So, post here with what you think our community guidelines should be. (Or if there are already some in place, please point me to them!) Thnx for looking.</p>
    <p>***Update: the guidelines can be found at <a href="http://typophile.com/readme" title="http://typophile.com/readme">http://typophile.com/readme</a></p>
