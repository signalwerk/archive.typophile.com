    html: <p>Fowler's rule separating "that" and "which" is widely used by editors and teachers in the United States but has never been widely adopted in Britain. It's a bit artificial, in my opinion, since it's sort of an arbitrary creation - as if I were to say "people should only use the word 'desktop' to refer to computer interface spaces and never use it to refer to a piece of furniture", and then expect everyone to obey me - but people complain about violations anyway.</p>
