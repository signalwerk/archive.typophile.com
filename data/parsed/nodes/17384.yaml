      <p>The BBC answer doesn't mention Fowler, of "Modern English Usage". Fowler had a campaign to distinguish between "that" and "which". The idea is that you should use "that" when the clause defines or identifies that which comes before: "The assassination that triggered the First World War." But when you are expanding on the previous, then you use "which": "Romney's speech on religion, which was highly controversial."</p>
      <p>There is some debate about how valid this rule is, but I think it's helpful.</p>
    html_clean: |-
