    html: |-
      <p>I have long advocated posting a request to refrain from personal attacks--at the place where people do their posts. Here is the one from Typographica:</p>
      <p>"Please refrain from off-topic banter and personal attacks. Your comment may be edited or removed at the discretion of Typographica editors. Our goal is not to stifle debate but to keep it relevant."</p>
      <p>I would not want the stuff about refraining from off-topic banter, though. In good Talmudic style, some of the best stuff on Typophile happens when people go off on a tangent and people join in the discussion of it. A little irrelevant humor is welcome also. </p>
      <p>And the policing warning is not a necessity. Typophile is so active that it is probably unreasonable to ask volunteers to police it. But if the notice is there, then a firm warning from a moderator, and a very rare after-the-fact removal with an explanation might be healthy also.</p>
