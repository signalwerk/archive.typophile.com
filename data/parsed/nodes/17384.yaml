    html: |-
      <p><em>...commercial fonts for illegal download.</em></p>
      <p><strong>illicit</strong> would be preferable to "illegal", because in some countries there is no "legal" basis to the act of "font theft" or "unauthorized sharing of software", no actual state laws or legislation relating directly to it.</p>
      <p>The only real standard for this kind of thing is the commercial nature of font vending and the moral outrage of type makers and vendors whose commercial rights are violated. For example, a user who breaches the terms and conditions of a font product's EULA makes illicit use of the product, but there may be no legal redress to their behaviour, depending on which country we're talking about.</p>
      <p>It may be wise to put in a statement dealing with the "unauthorized distribution or sharing", breach of EULA and the <strong>commercial rights</strong> of authorized vendors.</p>
      <p>j a m e s</p>
