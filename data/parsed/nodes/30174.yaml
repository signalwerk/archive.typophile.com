    <p>Photoshop project manager John Nack released a picture of the new Adobe branding system for its software icons on his <a href="https://web.archive.org/web/20191004135611/http://blogs.adobe.com/jnack/2006/12/whats_up_with_the_icon.html">blog</a>. He did this because of the many criticisms that erupted when he revealed that the Photoshop CS3 and Bridge 2.0 icons were not placeholders, but rather the planned icons.</p>
    <p>In the post, guest writer Ryan Hicks mentions that <a href="/web/20191004135611/http://www.typophile.com/node/16060" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Slimbach</a> was heavily involved in the design of the icons, lending a custom version of his upcoming typeface Gauge for the lettering. While the icons are not an ideal place to get a feel for the typeface, I thought that some around here would like what I presume is a "sneak peek" at Gauge.</p>
    <p>Here's the color wheel of new Adobe icons (partial key: Ps=Photoshop, Ai=Illustrator, ID=InDesign, Dw=Dreamweaver, AE=After Effects, Br=Bridge, LR=Lightroom):</p>
    <p><img src="/web/20191004135611im_/http://www.typophile.com/sites/default/files/old-images/adobe color wheel_6281.jpg"></p>
    <p>I'm not sure yet if I like them or not. I'm tending toward appreciating the simplicity and emphasis on type, but I did like the feathers/flowers/butterflies of yesteryear.</p>
  html_clean: |-
    <p>Photoshop project manager John Nack released a picture of the new Adobe branding system for its software icons on his <a href="https://web.archive.org/web/20191004135611/http://blogs.adobe.com/jnack/2006/12/whats_up_with_the_icon.html" class="link-external">blog</a>. He did this because of the many criticisms that erupted when he revealed that the Photoshop CS3 and Bridge 2.0 icons were not placeholders, but rather the planned icons.</p>
    <p>In the post, guest writer Ryan Hicks mentions that <a href="/node/16060/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Robert Slimbach</a> was heavily involved in the design of the icons, lending a custom version of his upcoming typeface Gauge for the lettering. While the icons are not an ideal place to get a feel for the typeface, I thought that some around here would like what I presume is a "sneak peek" at Gauge.</p>
    <p>Here's the color wheel of new Adobe icons (partial key: Ps=Photoshop, Ai=Illustrator, ID=InDesign, Dw=Dreamweaver, AE=After Effects, Br=Bridge, LR=Lightroom):</p>
    <p><img src="/web/20191004135611im_/http://www.typophile.com/sites/default/files/old-images/adobe color wheel_6281.jpg"></p>
    <p>I'm not sure yet if I like them or not. I'm tending toward appreciating the simplicity and emphasis on type, but I did like the feathers/flowers/butterflies of yesteryear.</p>
