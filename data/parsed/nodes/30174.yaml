      <p>I immediately thought "periodic table," but I like the simplicity of it. I was never a fan of the more abstract recent icons. Pretty, but not very helpful in identifying the application in the dock. The old icons (Botticelli Venus for AI, eye for PS) were okay. The new scheme seems like a variation on Macromedia's scheme (round, single color icons with a letter or two). Come to think of it, Microsoft has been using the letter icon idea forever for Office (though they are consistently unattractive, in my opinion).</p>
      <p>I find that I look for color first when looking for an icon in the dock. I've had trouble finding the iTunes icon since it went from green to blue. There are a lot of blue icons in my dock. Having a nice, big, easy to read letter helps a lot for me, more so than shape or other details. So, I think I am going to like the new Adobe icons, even though they are rather plain.</p>
