      <p>Well, I'm actually glad the feathers/flowers/butterflies are replaced by something comprehensive.<br>
      Since the main goal of icons is to convey a message in a quick and easy way, the last icons didn't really do their job too well, in my opinion. There was no réal way of telling the difference between the programs, other then learn which icon is which program. But that defeats the whole purpose of an icon, I would say.<br>
      I do think the new icons do that a lot better. These almost work like file-extentions, thus making them easier to recognise. And of course that all programs are now integrated in a more uniform shape, also contributes to recognition.</p>
      <p>If I <strong>like</strong> the icons, easthetically speaking, I'm not sure yet.</p>
