      <p>&gt; <em>The only thing I don’t understand about the Adobe icons is why it is sometimes UC+SC and sometimes UC+LC.</em></p>
      <p>The logic behind it is more or less simple and consistent: UC+SC is used in compound names — FreeHand (FH), PageMaker (PM), ColdFusion (CF), InDesign (ID), etc. —, and UC+LC is used in single word names — Flash (Fl), Director (Di), Flex (Fx), Premiere (Pr), Photoshop (Ps). Of course, there are exceptions like Illustrator (Ai) and GoLive (Gl), for example. And the rocket-arrow icon is <a href="https://web.archive.org/web/20191004135611/http://labs.adobe.com/wiki/index.php/Apollo">Apollo</a>.</p>
      <p>&gt; <em>Miguel — who is your employer? Maybe you should change your name.  :))</em></p>
      <p>Unfortunately I can't. The HB-1 Visa is under my "old" name ;^P</p>
