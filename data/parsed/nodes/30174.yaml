      <p>My impressions:</p>
      <p>I have tried to keep an open mind, but I immediately thought of the periodic table when I first saw this, and can't get it out of my head. </p>
      <p>I have to admit I am not crazy about the icons. I understand they are parts of a whole with the color wheel concept, but individually there's really nothing to them other than type over differently colored gradations. They do nothing to tell me what the software does, and although now I have that understanding, it's confusing to the new kid on the block. Also, I have at times up to 6 Adobe icons in line across my dock, and I really don't want them to be quite so uniform and text-based.</p>
      <p>I do like the concept from a simplicity standpoint, also because it's a complete 180 from what they have been doing for the icons in the past, but it's too far removed. Adobe is well known for its polished, user-friendly interfaces. This just seems like a step backwards to me.</p>
      <p>I would at least work in some simple art that somehow gives a slight hint at what the program actually does.</p>
