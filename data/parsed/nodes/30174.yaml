    html: <p>Because people have been mentioning how much they'd love to know what's new in InDesign CS3, I thought I'd remind everyone that when Quark 7 was released, Adobe revealed several of ID CS3's features, which are <a href="https://web.archive.org/web/20191004135611/http://quarkvsindesign.com/articles/a1/features/2006/sneak-peek-indesign-cs3"></a>summarized at QuarkVsInDesign.com. It is assumed that ID CS3 will have a similar interface to PS CS3. I would personally guess that Adobe will also add even more Photoshop-like functionality to ID, past the "Photoshop Effects" mentioned in the article, but that's just a guess. Of course, I'm sure that they saved the whizbangiest features for closer to the release date, so I'm still very excited to see what ID CS3 will offer (along with the new AI).</p>
