    html: <p>I don't really get the immediate connection to poker on that logo, but I guess I could understand it a little maybe. It looks like the rounded shapes were put into perspective, and <em>then</em> the little pointy bits were added... they don't seem like they're in perspective with the logo. Maybe work on tweaking that so they seem to fall back into space as well. The descender on the /p/ is a bit short, and the angles on the terminals of the /c/ don't seem to be the same, so the /c/ looks like it's tipping (the two points for each terminal don't line up to its vertical counterpoint, either). The subtitles also stick off the logotype a bit too far... shorten that up a bit so it fits perfectly within the width of the "opc."</p>
