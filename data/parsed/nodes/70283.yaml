  html: |-
    <p>Hi, </p>
    <p>I was asked to design a logo for the 'OPC'.<br>
    Couple of things I took in account, it should have an official look to it,<br>
    use of blue and red (nba-nfl...), the short for 'open poker championship' should<br>
    be well readable (easy reference for people;'yeah I'm attending the OPC')<br>
    and there should be a direct link to poker in the main visual.</p>
    <p>I created the following logo's but I feel there could be some improvement (mainly on the visual consistency-coherence and used type),</p>
    <p><a href="http://img534.imageshack.us/img534/3774/opcx.jpg" title="http://img534.imageshack.us/img534/3774/opcx.jpg">http://img534.imageshack.us/img534/3774/opcx.jpg</a></p>
    <p>It would be nice if you guys could share some thoughts !</p>
    <p>Thanks in advance, </p>
    <p>Matt</p>
