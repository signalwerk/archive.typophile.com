    html: |-
      <p>ALL comments here are right. The basis of the prices is a equation between many informations. But, the mostly important stills the market feeling and, in my point of view I think the "fame" of the foundry or type designer is a important factor, too. If the "Palimpsest" project, by Freiberger, was made by a famous designer, sure which the font will be a higher price.</p>
      <p>So, the "Nick" table can be this way</p>
      <p>1. Whether a typeface is an attractive design.<br>
      2. How many OpenType features it has.<br>
      3. How many languages it supports.<br>
      4. How ornate it is.<br>
      5. What its price is.<br>
      6. What the EULA permits (e.g. number of terminals).<br>
      7. Is the typeface own by a famous foundry?<br>
      8. Similar fonts medium prices</p>
