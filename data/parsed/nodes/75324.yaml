    <p>Hello everybody!</p>
    <p>I have a quetsion about the price of fonts. I don't know exactly by how much price I sell one font with more of 100 glyphs to MyFonts...</p>
    <p>If I sell a font with more of 100 glyphs to MyFonts, what is the price?<br>
    If I sell a font with more of 1000 glyphs to MyFonts, what is the price?<br>
    If I sell five fonts with more of 100 or 1000 glyphs to MyFonts, what are prices?</p>
    <p>So I and my colleague intend to sell our own fonts to MyFonts, but we don't know exactly what the prices.</p>
    <p>I saw the fonts family PF Beau Sans Pro, MyFonts sells one font by 79 dollars while it sells a fonts family by 729 dollars. I imagine the Parachute foundry sold to it by very high price. </p>
    <p>Kevin</p>
