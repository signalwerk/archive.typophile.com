    date_raw: 17 Oct 2010 — 12:28pm
    date: 2010-10-17T12:28:00
    votes: null
    html: "<p>Price should also be based on utility; that is, how useful the font is to a wide range of uses. Most of my fonts are designed for headline use, and most have a specific \"attitude,\" both of which limit their applications. Consequently, I don't ask a lot for them. The low price doesn't mean an inferior product: all the glyphs are hand-drawn (no autotracing, ever), hand-tweaked and hand-kerned for ALL possible letter combinations. Generally, what I lose in margin I gain in volume...</p>"
