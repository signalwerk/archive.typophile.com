    votes: null
    html: <p>Price can also be a marketing and branding tool. Some designs deliberately price high, offer very limited discounts, and only sell directly. This fosters an exclusive boutique brand that attracts fewer buyers, but more of them are high-end corporate buyers who outfit a lot of computers at once. On the other end, some people sell cheap and use free fonts and discounts to promote their work, which attracts lots of non-business users, students, and small businesses.</p>
