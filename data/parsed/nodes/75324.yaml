    html: |-
      <p>Study fonts on the sales charts at MyFonts and base you pricing policy on:</p>
      <p>1. Whether a typeface is an attractive design.<br>
      2. How many OpenType features it has.<br>
      3. How many languages it supports.<br>
      4. How ornate it is.<br>
      5. What its price is.<br>
      6. What the EULA permits (e.g. number of terminals).</p>
  - id: 434679
    user_id: 17347
    user_name: Andreas Stötzner
