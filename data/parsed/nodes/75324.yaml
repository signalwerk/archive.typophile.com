    html: |-
      <p>The pricing will most instances be dictated by the market. And not by the number of glyphs.</p>
      <p>When an average text font (single) containing 490 glyphs (e.g. Latin and Greek, good coverage) would cost $49, that makes ¢10 per glyph.<br>
      If I adopt this formula to the Andron family (which has more than 13.000 glyphs) I end up at a single licence price of $1.300 – which no one would ever pay.</p>
      <p>There seems no other way than to look at the prices competitive fonts are offered at. And to make a competitive pricing in that range.</p>
  - id: 434690
    user_id: 6470
    user_name: oldnick
