    <p>Gallery 51 of North Adams, Massachusetts announces a juried exhibition of contemporary letterpress work to be held from March 22 through April 23, 2007. </p>
    <p>We invite submissions from printers, studios and designers who have produced work with letterpress technology within the past decade. Download your entry form online at <a href="http://www.contemporaryletterpress.com" title="www.contemporaryletterpress.com">www.contemporaryletterpress.com</a>. Provide the information required and send it to us with samples of your work.</p>
    <p>The deadline for submitting work is February 28 , 2007. </p>
    <p>Entries will be judged by a panel of distinguished curators of contemporary art, design professionals and educators. Selected work will be exhibited at the Gallery 51 space and presented online afterwards.</p>
    <p>The exhibition seeks to showcase a full range of work from traditional print to web-based projects and focus on the artistic merits of the medium. We will be presenting work of the highest caliber and aim to raise awareness of craft of letterpress printing.</p>
    <p>Please feel free to email us with any questions. We look forward to seeing your work.</p>
    <p><a href="http://www.contemporaryletterpress.com" title="www.contemporaryletterpress.com">www.contemporaryletterpress.com</a></p>
