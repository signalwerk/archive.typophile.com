    <p>I've got an invitation from my friend and was absolutely impressed by the work the printer did on it. Very decent, with steel engraving and matching envelopes for the reply. Nice paper too.<br>
    The following type has drawn my attention and I wonder if someone can tell me what this is </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/marriage_type.jpg"></div><p></p>
