      <p>And it works!</p>
      <p>&gt;&gt;Office currently only uses old style kerning, not OpenType kerning.<br>
      Yes, I converted the Class OT Kerning to Plain FL Kerning before generate the font files :) The real problem is the Word configuration! Thanks Paul for the hint!</p>
