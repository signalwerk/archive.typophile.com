    html: |-
      <p>Simon, </p>
      <p>do I understand this correctly? </p>
      <p>Microsoft produced a new set of OpenType fonts (the ClearType collection: Cambria, Calibri, Candara, Constantia, Corbel etc.) which does not contain old-style but only OpenType kerning, Microsoft made these fonts the standard fonts for Office 2007 but at the same time Office 2007 does not support OpenType kerning but only old-style kerning, which the new standard fonts don't have? This would mean that with Office 2007 and the new fonts, it's not possible to get any kerning at all, while it's still possible to get kerning using the old fonts, like Arial or Times New Roman, since they use the old-style kerning. </p>
      <p>Is that right? I'm puzzled. </p>
      <p>Adam</p>
