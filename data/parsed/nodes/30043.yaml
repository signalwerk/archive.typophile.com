    date_raw: 12 Dec 2006 — 11:42am
    votes: null
    html: |-
      <p>you have to turn kerning on in MS Office Apps.<br>
      Go to Format&gt;Font&gt;Character Spacing and Check the box for "Kerning for fonts:" and set the point size as low as the lowest size you will be using (or lower).</p>
