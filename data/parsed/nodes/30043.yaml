  html: |-
    <p>Hello,</p>
    <p>I’m working in a new typeface using the OpenType technology. The kerning feature works well in all applications except Microsoft Office (on Mac and Windows too). What is happening? </p>
    <p>P.S.: I’m working in Mac OSX using FontLab 5.02</p>
