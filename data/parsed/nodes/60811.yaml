    <p>Lettering at first was drawn for Miroslav Krleza's book Croatian God Mars - it's about WW I and tragedy of life in Croatia. At first it was drawn as a high contrast stencil serif display lettering. And then it expanded with more letters and then started redrawing to create regular serif, just that it will need some contrast re-adjusting to become text typeface. </p>
    <p>Started as a college(Department for the Design of Visual Communications at Arts academy in Split) project with guidance of Nikola Djurek (<a href="http://www.typonine.com" title="www.typonine.com">www.typonine.com</a>), and now trying to produce whole set of display serif typeface.</p>
    <p> Also started to create wide selection of ligatures and swash combinations. </p>
    <p>Currently all caps, and hope to start digitizing lower case drawings.</p>
