    html: |-
      <p>Now, that's a tasty stencil.</p>
      <p>The serifs have issues, though. Some of the serifs aren't aligned with the bottom of the stems. The serif of the top arm of the K has weird artifacts (and the leg is wobbly). The stem of the B has strange artifacts as well. The swash-R leg doesn't connect to the bowl.<br>
      In other words, quite a few small inconsistencies. But I like the overall look, it's not a style you would expect to be stencilled, which is very nice.</p>
