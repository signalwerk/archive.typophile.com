    html: |-
      <p>To comment out the name table, you need only  replace <code>&lt;name&gt;</code> with <code>&lt;!-- &lt;name&gt;</code> and <code>&lt;/name&gt;</code> with <code>&lt;/name&gt; --&gt;</code>. If <code>fin</code> is the input file and <code>fout</code> the output, then<br>
      <code><br>
      intext=fin.read()<br>
      fout.write("%s" % intext.replace('&lt;name&gt;', '&lt;!-- &lt;name&gt;').replace('&lt;/name&gt;', '&lt;/name&gt; --&gt;'))<br>
      </code><br>
      does the job.</p>
      <p>If you have many substitutions and you want to perform them in one pass, then regular expressions may be useful indeed. <a href="http://code.activestate.com/recipes/81330-single-pass-multiple-replace/" rel="nofollow"><strong>This link</strong></a> discusses how that can be done.</p>
      <p>Michel</p>
      <p>Added: you need <code>from string import replace</code>.</p>
