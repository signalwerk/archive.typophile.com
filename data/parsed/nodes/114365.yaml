    date_raw: 20 Feb 2014 — 3:06pm
    votes: null
    html: |-
      <p>There are two different sans serif fonts used on the poster but the red lettering looks a lot like <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/block-gothic-rr/?refby=bowfin" rel="nofollow">Block Gothic</a> from Red Rooster. A little height/width tweaking seems like it would match very well.</p>
      <p>The gold sans at the top is something else that looks commonplace.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
