    html: |-
      <p>RASHOMON looks like an adaptation of Font Bureau <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/aardvark/?refby=bowfin" rel="nofollow">Aardvark</a>. The A and H have been changed to have normal crossbars, but otherwise this seems like the source (or inspiration) for this lettering.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
