    html: <p>The gold sans is <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/univers/" rel="nofollow">Univers</a>, by Adrian Frutiger. Available from Linotype and Adobe. Best match is probably the Black (75) weight.</p>
