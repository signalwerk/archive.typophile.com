  html: |-
    <p>im in need of alternatives for fedra sans display 1.  i love the delicate qualities of the font, but need something slightly thicker. Hairline seems too thin, while thin is too thick! so i'm looking for a new typeface altogether.</p>
    <p>Any help appreciated.</p>
    <p><a href="http://www.typotheque.com/fedra_sans_display" title="http://www.typotheque.com/fedra_sans_display">http://www.typotheque.com/fedra_sans_display</a></p>
