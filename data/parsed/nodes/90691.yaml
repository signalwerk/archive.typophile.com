    html: |-
      <p>While "Paste Special" and "Copy to composites" must me done for every individual base glyph, the Metrics Assistance tool does allow for multiple groups to be updated at once (after a bit of tedious box-checking). But you do have to create the metrics classes first.</p>
      <p>Some previous discussions about replicating "Copy to composites" with Robofab:<br>
      <a class="freelinking external" href="http://typophile.com/node/50404" rel="nofollow">Python/Robofab - Copy to composites</a><br>
      <a class="freelinking external" href="http://typophile.com/node/40232" rel="nofollow">Macro - Copy to Composites</a></p>
