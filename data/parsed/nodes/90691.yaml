    date: 2012-03-04T22:16:00
    date_raw: 4 Mar 2012 — 10:16pm
    votes: null
    html: |-
      <p>FontLab's Metrics panel also has a feature to do this— while in Metrics mode, there's a down-arrow underneath the active glyph which reveals a menu with "Copy to composites." If the glyph has composites, a dialog will appear lettering you choose which ones to change. And if you're using metrics classes (or wish to take the time to create them), the Metrics Assistance tool could further automate the process.</p>
      <p>For python scripting, you might find some useful ideas in a couple of of <a class="freelinking external" href="http://benkiel.com/typeDesign/" rel="nofollow">Ben Kiel's scripts</a>. Robofab seems to provide more direct access to sidebearings (via the leftMargin and rightMargin attributes of the RGlyph object) than FontLab's native API.</p>
