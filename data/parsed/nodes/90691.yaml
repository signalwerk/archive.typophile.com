    html: <p>The only Python I'm familiar with is Monty, but you can accomplish the same task, script-free, using the "Paste Special" command.</p>
    html_clean: <p>The only Python I'm familiar with is Monty, but you can accomplish the same task, script-free, using the "Paste Special" command.</p>
  - id: 497713
