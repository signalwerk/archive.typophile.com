      <p><cite>Just curious, what dictionary bugs are you referring to?</cite></p>
      <p>We've reported several over the years. The ones that are currently driving us nuts (who knows what tomorrow will bring!) are:</p>
      <p>1. You can't directly enter a word with an apostrophe (the PREFERRED apostrophe, U+2019) in the exception dictionary. No matter what you do, the apostrophe winds up U+0027. So, when a word with an apostrophe (U+2019) is encountered in the text, the word isn't found in the exception dictionary, and the basic Proximity UDC patters are followed. You can enter words with U+2019 using a script, but what a nuisance!</p>
      <p>2. There is a bug in the Paragraph &gt; Hyphenation panel when you use the document dictionary. Specifically, you have to say "3" in the "After First" box, to get ID to allow a hyphen after 2 letters. The inverse for the "Before Last." If you want to require three letters to come down, you have have to enter a "2". That is, to require two letters to remain on a line and three letters to come down, the First/Last setting has to be 3/2. BUT: Should you encounter a word not in the document dictionary, ID revers to the Proximity UDC dictionary, which does honor exactly what is in the Paragraph&gt;Hyphenation setting. So, if you don't have "because" in your document dictionary, and if you set the Hyphenation panel for 3/2, "because" won't be hyphenated.</p>
      <p>Etc. Discovering bugs is no fun, documenting them to report them even less fun -- esp. when they are never fixed!</p>
    html_clean: |-
