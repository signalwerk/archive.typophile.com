      <p>Igor, it is possibler that everything works with the Mac -- we've been using Windows since CS2 (Windows XP &amp; now Vista). We have had trouble with hyphenation all along. Some of it was due to our utilities, but some was Adobe bugs, written up, submitted, and acknowledged. With possessives I don't have an example at hand, but it does happened. Still, with your input, I will check again tomorrow to see if we can get a word with U+2019, entered by hand, in the exception dictionary</p>
      <p>As to the number of hyphens -- are you using the document dictionary (one that is embedded in the file), or just the Proximity UDC? It is only when both are at play that the conflict rears it's head, though the "lie" is always needed with the document dictionary.</p>
      <p>* * *</p>
      <p>With CS2, we used to change the UDC with every job. It was a pain, but it did work. We extracted every word over five letters in a book's text, hyphenated them to taste, put them in the exception dictionary, then wrote off a new UDC. With that system, we could usually tell when ID went to the basic Proximity patterns. The downside was that if you forgot to install the different UDC's with their proper job, and if any recomposing occurred with another job's dictionary, you obviously got errors. Another downside was you couldn't give the files to anyone else -- say, the publisher -- because the hyphenation was dependent on that UDC. You could give them that too, but good luck teaching them how to install it. Use of a document dictionary solves this problem.</p>
