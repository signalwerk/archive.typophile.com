      <p>The sound/interactive/etc. features in Indesign could be quite cool. I could actually enjoy doing layout for interactive digital magazines for tablets if I didn’t have to deal with the Flash interface, actionscript, etc. But this all depends on PC makers finally getting it together in the tablet space, and right now we have something like ten years of evidence to suggest that they haven’t got a clue how to pull off a usable tablet. If the PC makers can’t keep Flash relevant it won’t matter, because something else we have pretty clear evidence of is that Adobe’s executives don’t know how to beat Steve Jobs in a software war. I won’t be at all surprised if the feature set for Indesign CS6 revolves around building that stuff for HTML5/CSS3.</p>
