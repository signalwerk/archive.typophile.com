      <p>My biggest complaint is that we get new, expensive releases of InDesign, but old bugs remain. There are bugs we reported -- and were acknowledged -- with CS2, particularly the dictionary -- that are still present in CS4. Hyphenation, after all, is one part of H&amp;J, and good H&amp;J is pretty basic to any layout program.</p>
      <p><cite>I'm not sure if it's possible at present to simply remove any plugin whose features you don't need -- perhaps the program won't start, or crash</cite> Yup. Crash to the point where you have to reinstall the program. I'll grant that it is a chore to test the program with the various operating systems, but Jeez, that's a part of selling software.</p>
      <p>You aren't supposed to use obscenities. Should I say I'm miffed? &amp; I'll allow I'm being a curmudgeon, but aren't bug-fixes to basic functions more important than new features?</p>
