    html: |-
      <p>Surely, ID CS5 is lacking some important and much needed improvements, as endnotes, better footnotes, named stylistic sets, sidebar texts –to name a few. But the animation features are very interesting –and <strong>not</strong> just for tablets.</p>
      <p>I can remember a dozen newspapers and publications which went online with page transitions after ID CS4 included this feature. A small newspaper from a small city in my country used this and increased its ad income (as any ad also gets web dissemination).</p>
      <p>Now, it's possible to build whole web articles inside ID, including zoomed in/out photos and captures. I consider this extremely useful for instructional and technical materials. And the SWFs maintain high typographical quality.</p>
      <p>An example: I know two printed technical reviews with huge financial problems. They would like to go online and survive. But to publish PDFs on the web causes some problems: it's less atractive to most people, the Reader bars takes part of browser view and a PDF could be shared easily, makng piracy very easy. To publish through SWF in an subscription-based site is a great idea to them.</p>
      <p>Besides the animation features, the span/split columns is really great. And the vertically justified text in non-rectangular frames is also very welcome. For me, it's a well worth upgrade, although Adobe's prices are intimidating.</p>
    html_clean: |-
