      <p>I just lost the followup I posted in here by accidentally hitting a link in this tab instead of a new tab.  oops.</p>
      <p>Let's see if I can't get the gist however.</p>
      <p>Yes, Windows' "Font Smoothing" was available when Windows 95 was released and included in their first plus! pack - this is in my blog post. In fact I mention when anti-aliasing and ClearType came to each OS.</p>
      <p>"Windows rasterizing" - that's not to say "anti-aliasing."  Both are part over rendering, but I was referring to the basic rasterizer which produces pretty much the same result in versions of dating back to 95.  Type rendering obviously includes rasterizing, anti-aliasing, kerning, etc. and the overall rendered effect we see now is not the same as it once was.  There's also no denying the vast amounts of legacy code that exists in all facets of every Windows framework.</p>
      <p>The post was written as if speaking with the average readership of my site.  Since only I can see the logs and traffic data, only I know who's using which OS and browser to visit.  IE accounts for under 9% of visits and Safari is under 50%.  The majority of people visit with a Moz-based browser, Firefox being the most popular of those.</p>
      <p>"My buddy and I think Mac OS fonts look like crap" is not how you write an article.  I stick by my "colourful" and playful remarks regarding Ou. It's not the first time he's written such drivel and it will likely not be the last.<br>
      If one thinks Mac OS fonts are "full-fuzz" then I suspect that person doesn't spend much time around the OS. I use both mac OS and Windows every day and have for years. Each has benefits and of course issues.  Font rendering is a strength in Mac OS, not a weakness. I'm also a huge fan of FreeType and quite enjoy its results in Camino as well. Even spec'd it for a software project I designed a few years back.</p>
      <p>Bruno</p>
