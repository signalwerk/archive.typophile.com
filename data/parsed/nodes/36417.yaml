      <p>I have included an addendum mentioning WPF.  I hope you don't take offense to only including it this way. It's really not the point of the article, since I'm not really debating that Windows on a whole is inferior.  I've used Windows for 13 years. Still using it today, though my primary Machine is a Mac (have multiple of each in fact).</p>
      <p>For XP WPF required installation of .NET and obviously is only available to .NET applications. This is not wholly different than how the system services in Mac OS work, but in that case it's something that exists on every system and used by every application that does not implement its own type rendering. </p>
      <p>With regards to the Illustrator sample, I'm about to make a significant addition to it as well as move the image up so it doesn't immediately follow the mention of Windows.  The image was generated on a Mac but should be identical to one created with the same application version in Windows.</p>
      <p>As an aside, I'm not really a big fan of Arial.  I used it mainly because it was a short name I could fit multiple times horizontally within the page layout and it's a face a large number of people would instantly be familiar with.</p>
      <p>Bruno</p>
