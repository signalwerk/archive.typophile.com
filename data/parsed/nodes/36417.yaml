    html: <p>Tom - Windows font smoothing was introduced in August 1995 as part of the Windows 95 plus! pack add-on. As I recall Laurence Penney (that cheeky hacker) produced a hack to activate it without Plus! Soon after we posted an official free download. One aspect not mentioned in the article was the MS philosophy of not applying antialiasing for single pixel stems, which was different from other approaches – hence you’d never see the Arial sample in the article displayed like that until it jumped to two pixel stems.</p>
