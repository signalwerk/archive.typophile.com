      <p>The Arial image is just an example of what Anti-Aliasing *IS* - it's not a Windows image nor is it purported to be one. it's not an example of "bad" or "good" - just an exampe showing the difference between something that isn't and something that is anti-aliased.  I show manual examples directly after it, clearly also not indicative of Windows or Mac font rendering.</p>
      <p>Further, it's specifically labeled as being rendered by Adobe Illustrator.  Keep reading the article and you'll find I touch rather sharply on the fact various software applications contain their own font rasterizing and layout engines.</p>
      <p>All image samples are clearly labeled in the article including their source. They're all 100% authentic and very carefully verified to make sure they're accurate.  You don't even have to worry about gamma issues of color correcting profiles because all PNGs in use at the site have been stripped of this meta-data, ensuring the images appear the same in all browsers on all platforms.</p>
      <p>Brun-o</p>
