      <p>Thanks Bruno,</p>
      <p>Glad to hear you're updating the article.</p>
      <p>I think you make the point in the article that these days we rarely see the system's default text rendering outside of the default browser, and even here the trends are changing – you mention Freetype in Firefox cross-platform, Quartz in Safari cross-platform, etc., and this matches what Adobe has been doing for years with Cooltype and Acrobat viewer even before that, and of course Word reading mode etc., etc., </p>
      <p>Hence my position that the issue here is that IE’s competitors have moved the bar re. rendering (user-preference apart) and that MS has failed to adequately react. MS has a better rendering story than GDI compatible widths ClearType, (which hasn’t really changed since it was implemented in unreleased versions of Windows 2000) but users of IE haven’t benefited from it. Don’t know if you were at TypeCon, but I think one of the best parts of that event was hearing Bill Hill (who has moved from the MS Advanced Reading Technology team AKA ClearType team) to IE. If he can convince his team to move the needle on web typography, rendering etc., then we all benefit.</p>
      <p>Cheers, Si</p>
