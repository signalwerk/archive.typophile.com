      <p>In seeing previous threads on this subject, it has occurred to me that there should be a meta-thread discussing these screenshots everyone is throwing around. Technically, it's necessary to have an actual display device and a human being present to assess things like legibility. So, it's not really possible to "prove" much just by displaying screenshots. For example, CRT intended output can only be judged by looking at the tube itself. There's  just a lot of variables in play. I imagine we'll be arguing about it until we all get resolution-independent OSes and some 200ppi displays. </p>
