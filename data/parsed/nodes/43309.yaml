    <p>A few months ago, I raved here about a book I discovered called "Fonts and Encodings" by Yannis Haralambous. </p>
    <p><a href="http://typophile.com/node/40164" title="http://typophile.com/node/40164">http://typophile.com/node/40164</a></p>
    <p>As you may recall from that thread, I was dismayed to find that the book had some serious typographic errors in the code listings. Other people also pointed out errors they had found. Not only that, but the book was not yet available in electronic form on O'Reilly's website.</p>
    <p>First the good news: The book is now available to view online (for free if you own the dead tree edition) through O'Reilly's Safari Books Online service:</p>
    <p><a href="http://safari.oreilly.com/9780596102425" title="http://safari.oreilly.com/9780596102425">http://safari.oreilly.com/9780596102425</a></p>
    <p>More good news: The errata file for the book has been updated (previously it contained only a few minor errors).</p>
    <p>The bad news: The code listing errors are still in the book, and are listed so far only as "possible errors" in the errata file.</p>
    <p>In spite of the still-to-be-corrected errors, I think this is on balance a very good thing. Considering the shear amount of material in the book (over 1000 pages), having it available in electronic form (i.e., searchable, being able to copy snippets of code, etc.) makes it more useful by a magnitude.</p>
    <p>Given that the errors are now listed (however tentatively) in the errata file means that they will likely be corrected eventually, so there is hope on that front as well.</p>
