      <p>I would assume that 'Avenir' is simply a conversion to OpenType of Adobe's Type 1 version of Avenir since AFAIK all of their fonts had 'Std' appended to the name when they released their library in OpenType format.</p>
      <p>Some of the Standard versions might have had spacing problems introduced, but then some of the standard versions might also have corrected spacing problems which were present in the earlier versions. I don't think you can make any inferences based solely on the fact that 'Std' is appended -- this is simply what Adobe uses to designate OpenType fonts which have standard Western European Character sets (as opposed to Pro fonts which also include Central European as well as Cyrillic and Greek in some cases).</p>
      <p>Basically, if you want to choose one version over the other you'll simply have to experiment and see which offers the better quality. And of course there's no reason why you can't keep both if in doubt. After all, if you get rid of either, you're going to run into problems with any existing documents which use that font.</p>
      <p>André</p>
