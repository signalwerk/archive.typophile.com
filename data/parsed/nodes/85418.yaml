    <p>Hi, I am in the process of sorting through my companys extensive font collection and I am trying to get rid of duplicate fonts. I have Avenir and Avenir LT Std as open type fonts.<br>
    My question is which one is better to keep, and what is the difference between the two?<br>
    I know I'm going to have the same problem when I get to Helvetica. I have searched online with no luck so far. Thank you for any advice given.</p>
