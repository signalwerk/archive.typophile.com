  html: "<p>There seem to be two problems really:  <br>FontLab crashes on exporting Type1, after minor changes in a file I succesfully exported several times before from.  <br>In the font I did manage to export some characters like Ampersand and Parentheses don't show up in use. I exported following what I read the manual &amp; Leslie Cabarga's book, but still.... <br>I'm kind of in a hurry: does anyone have a possible answer? Would be GREATLY appreciated.</p>"
