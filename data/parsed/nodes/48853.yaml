    <p>Are there any disadvantages to having a large number of kerning pairs ?</p>
    <p>What would be a large number of kerning pairs ?</p>
    <p>I am using Class Kerning but when I expand the classes (to see how many pairs I have) I have 6500 pairs, is this a normal amount for a font or should I limit the amount of pairs.</p>
