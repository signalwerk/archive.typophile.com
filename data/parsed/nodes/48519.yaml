      <p>Adam, it's working. One may have to restart the program if a font was open at the time the change was made. Closing the font and re-opening it won't do it. Now that we've done that, is there any way to get the font window to look normal? </p>
      <p>In addition, though I understand this to be a program reference only, I have heard -- not entirely verifiably -- of the settings being stored somehow in the font file and causing havoc when the font is opened on another machine.</p>
