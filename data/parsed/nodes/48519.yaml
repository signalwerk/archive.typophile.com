    <p>As well known, my complaint that Fontlab doesn't provide adequate zoom is longstanding. Fog 5 beta, available since 1996, 12 years ago, provides 3200% which is just about adequate for fine work. </p>
    <p>Some time ago, Adam Twardoch published, on the type design list, a technique for tricking Fontlab into zooming to 3200%:</p>
    <p>'In FontLab Studio, 100% means that the area between the "visual ascender" and the "visual descender" fits within the current window. In Preferences / Glyph Window / Dimensions, you can set up the visual ascender and descender. By default, itâ€™s 100 and -40 % of the UPM size. If your glyph window is 700 pixels high, and the UPM size is 1000 units, then by default, the visual area that fits within the glyph window will be 1400 units (100% + 40% of the UPM size). So in the 100% view, each pixel represents 2 font units. In the 400% view, one font unit is represented by 2 pixels. In the 1600%, one font unit is represented by 16 pixels. If you change the visual ascender and the visual descender to 5 and -2, then the 400% view will show each font unit on 30 pixels. I believe this would correspond to Fontographerâ€™s 3000% zoom. You can change the visual ascender and descender forth and back in Preference without any influence on your font data -- itâ€™s just a screen scaling factor.'</p>
    <p>I am not finding this working in Fontlab 5.04 under Vista. What am I doing wrong?</p>
