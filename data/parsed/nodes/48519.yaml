      <p>&gt; Now that we’ve done that, is there any way<br>
      &gt; to get the font window to look normal? </p>
      <p>No, unfortunately not. It is more less of a workaround. Also, you don't necessarily have to be as extreme as to use 5 and -2, maybe something like 20 and -8 would be acceptable for you. </p>
      <p>&gt; the settings being stored somehow in the font file</p>
      <p>The settings from Preferences (Options) are stored per user on the local machine. The settings in Font Info are stored in the font file. So no problem here. </p>
      <p>A.</p>
