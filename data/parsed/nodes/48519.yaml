    votes: null
    html: <p>John, in that session, there were probably four open fonts. Some were scaled big, some small, and that one mixed. Next time I opened the four fonts, they were all scaled big. Probably interesting things would begin to happen if I opened some new fonts. Adam says that the font DB cannot carry any of the relevant information, that it is a preference-only setting. So far the program <em>seems</em> to be behaving as if this is not true. (Try working in a scaled-up environment and then sending font DBs to users with default settings.) We must hope that the issue will be moot in a new release by expanded zoom, though I can't imagine why this can't be incorporated into a dot release sooner than that.</p>
