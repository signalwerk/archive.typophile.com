      <p>Adam, I still think there may be some way that font databases store some of this information. For example, I have FLS 5.02 and 5.04 on my system. 5.04 has the 5,-2 setting you originally suggested to me, while 5.02 has the default 100,-40 setting. </p>
      <p>I am now editing in 5.02. If I open a font that was previously edited at 5,-2 in 5.04, it opens with the font window appearance and zoomability of the 5,-2 setting. But if I open another font file that wasn't edited and saved with this setting, I get the default appearance and zoomability. In other words, I have one program running, and am experiencing both behaviours.</p>
      <p>What gives?</p>
