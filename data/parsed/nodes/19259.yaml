    html: |-
      <p>It’s possible that someone used a typeface for the “ocean club” logo, but the constructs are so easy to draw. (They are actually simplified parallel and concentric outlines, not what most typefaces are about.)</p>
      <p>Essentially only three character — o, e and n.<br>
      The c just is cut from the o.<br>
      The e was flipped and rotated for the a and b.<br>
      The n was flip for the u, and bisected to create the l.</p>
