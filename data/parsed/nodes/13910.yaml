    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Letter Spacing</strong></p>
    <p>The spacing between a series of characters in a line or paragraph of set text; also known as <a href="/wiki/Tracking" class="freelinking" rel="nofollow">tracking</a>. Spacing can be <a href="/wiki/Tight" class="freelinking" rel="nofollow">tight</a> or <a href="/wiki/Loose" class="freelinking" rel="nofollow">loose</a>. Note: letter spacing is different from <a href="/wiki/Kern" class="freelinking" rel="nofollow">kerning</a>.</p>
