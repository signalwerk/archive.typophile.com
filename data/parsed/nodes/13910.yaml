    <p>The spacing between a series of characters in a line or paragraph of set text; also known as <a href="/node/add/wiki?edit%5Btitle%5D=Tracking" title="Create node &quot;Tracking&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">tracking</a>. Spacing can be <a href="/node/add/wiki?edit%5Btitle%5D=Tight" title="Create node &quot;Tight&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">tight</a> or <a href="/node/add/wiki?edit%5Btitle%5D=Loose" title="Create node &quot;Loose&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">loose</a>. Note: letter spacing is different from <a href="/node/12054" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">kerning</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/15794">Spacing&nbsp;Method</a></p>
