    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Martin&nbsp;Majoor</strong></p>
    <p>Martin Majoor has been designing type since the mid-1980s. After a student placement at <span class="caps">URW</span> in Hamburg, he started in 1986 as a typographic designer in the Research <span class="amp">&amp;</span> Development department at Océ-Netherlands. There he carried out research into screen typography and worked on the production of digital typefaces for laser&nbsp;printers. </p>
    <p>In 1988 he started working as a graphic designer for the Vredenburg Music Centre in Utrecht, for whom he designed the typeface Scala for use in their printed matter. Two years later <span class="caps">FSI</span> FontShop International published <a href="/node/31192" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Scala</a>™ as the first serious text face in the then-new FontFont-Library. In 1993 <span class="caps">FF</span> Scala was augmented with a sans-serif version, <span class="caps">FF</span> Scala Sans, which was also released by <span class="caps">FSI</span>. In the eyes of the designer the sans and the serif versions complement each other admirably. They follow the same principle of form but are two distinct designs. The second largest newspaper in Holland (Algemeen Dagblad) used both <span class="caps">FF</span> Scala and <span class="caps">FF</span> Scala Sans for text and headlines and is a good example of how the two families can work&nbsp;together. </p>
    <p>In 1994 Majoor started working on the design of the Dutch telephone directory, for which he did both the typography and, more importantly, created a new typeface. The face is called Telefont and comes in two weights: Telefont List and Telefont Text. The Dutch phone company <span class="caps">PTT</span> Telecom holds exclusive rights to both fonts.<br>
    Perhaps as a reaction to the very formal work on the phone books, Majoor designed <span class="caps">FF</span> Scala Jewels in 1997, a quartet of classic decorative typefaces based on the capitals of <span class="caps">FF</span> Scala&nbsp;Bold.</p>
    <p>Majoor’s third major typefamily, <a href="/node/add/wiki?edit%5Btitle%5D=FF%20Seria" title="Create node &quot;FF Seria&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Seria</a>™ was released in 2000. It consists of a serif version and a sanserif versions. In 2001 it was awarded a “Certificate of Excellence” from the <span class="caps">ISTD</span> International TypoGraphic Awards 2001 in London and a “Certificate of Excellence in Type Design” from the <span class="caps">AT</span>ypI Type Design Competition “Bukva:raz!” in Moscow. In 2006/2007 Majoor worked together with Pascal Zoghbi, who designed Sada, the Arabic counterpart for Seria. It was published in the book ‘Typographic&nbsp;Matchmaking’</p>
    <p>The <a href="/node/36102" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Nexus</a>™ family (2004) has three versions (a serif, a sanserif and a slabserif), that are all ‘connected’. There is also a typewriter versions and two sets of elegantly drawn swash capitals. It was one of FontShops first OpenType® fonts and two years later it won the first prize at the Creative Review Type Design Awards 2006, in the catagory Text&nbsp;Families.</p>
    <p>Majoor taught typography at several Schools of Arts and since 1992 he gave lectures at conferences in Budapest, Antwerp, Paris, San Francisco, Barcelona, The Hague, Berlin, Prague, Warsaw and Stockholm. His work was exhibited in Rotterdam, New York, Paris, London, Berlin, Capetown, Helsinki, Barcelona, Bologna and Ontario. He wrote articles for magazines like Items, 2+3D and Eye. He works as a graphic designer and type designer in both The Netherlands and&nbsp;Poland.</p>
    <p><strong>Typefaces</strong><br><a href="/node/31192" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Scala</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Telefont" title="Create node &quot;Telefont&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Telefont</a><br><a href="/node/add/wiki?edit%5Btitle%5D=FF%20Seria" title="Create node &quot;FF Seria&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Seria</a><br><a href="/node/36102" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span>&nbsp;Nexus</a></p>
    <p><strong>External&nbsp;Links</strong></p>
    <p><a href="http://www.martinmajoor.com/">http://www.martinmajoor.com/</a><br><a href="http://www.typotheque.com/articles/my_type_design_philosophy.html">http://www.typotheque.com/articles/my_type_design_philosophy.html</a></p>
