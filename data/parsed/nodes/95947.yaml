    html: |-
      <p>There are a great many 3D chiseled fonts, but I don't know of, and couldn't find, any that have the distinctive separator lines displayed in your sample.</p>
      <p>The closest I could find, is Allen Walden's free  <a class="freelinking external" href="http://www.fontspace.com/allen-r-walden/beveled" rel="nofollow"> Beveled Font </a>. This has the same shapes and may very well have been the basis.</p>
      <p>Edit add:<br>
      Found one that just has the separator lines - very different basic shapes, though: <a class="freelinking external" href="http://www.1001fonts.com/heavy-bevel-brk-font.html" rel="nofollow">Heavy Beveled BRK - Ænigma Fonts</a></p>
      <p> - Herb</p>
