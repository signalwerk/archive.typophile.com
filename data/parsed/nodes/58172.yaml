  html: |-
    <p>My interest in this topic does have an end goal. To setup a mentorship program.</p>
    <p>By a convoluted definition, a mentorship is an opportunity for a protege to be an observer first, practice later with the goal of gaining knowledge. Whereas an internship is given based on the perceived ability of the person to work right away.</p>
    <p>As you can imagine there is some overlap in that a senior designer or creative director may mentor an intern indirectly, but their primary focus is really on getting the job done right and on time (as its a business). </p>
    <p>At least this is how i see it. So the end question....is there a place for mentoring in graphic design outside of internships? Does anyone mentor young students or graduates? Is this whole conversation crazy?</p>
    <p>cheers.</p>
