  html: <p>Hello. I'm looking for a font with long tails on certain characters, similar to the figure labels that could be seen on some old patents, such as the examples provided here. The closest I've found is <a class="freelinking external" href="http://www.fonts101.com/fonts/view/Brandname/15468/Regork" rel="nofollow">Regork</a>, but I was hoping to find other choices, as well. Thanks in advance for any suggestions!</p><div class="imageWrap"><img src="http://typophile.com/files/fig2_6594.png"></div><div class="imageWrap"><img src="http://typophile.com/files/fig14_6651.png"></div><p></p>
