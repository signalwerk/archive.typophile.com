    html: <p>Your best bet would be to buy a sufficiently retro-style font, along the lines of <a href="http://www.veer.com/products/typedetail.aspx?image=DET0000260#specimen" rel="nofollow">Dazzler</a> or <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000055" rel="nofollow">Trisect</a>. There are a bunch of similar ones out there. But do you want to make it yourself? In that case, outline a font you like, duplicate it a number of times, and mess with the curves to get it to look right. But I'd recommend buying something instead.</p>
    html_clean: <p>Your best bet would be to buy a sufficiently retro-style font, along the lines of <a href="http://www.veer.com/products/typedetail.aspx?image=DET0000260#specimen" rel="nofollow" class="link-external">Dazzler</a> or <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000055" rel="nofollow" class="link-external">Trisect</a>. There are a bunch of similar ones out there. But do you want to make it yourself? In that case, outline a font you like, duplicate it a number of times, and mess with the curves to get it to look right. But I'd recommend buying something instead.</p>
