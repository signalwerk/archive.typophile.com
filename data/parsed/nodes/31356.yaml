    html: |-
      <p>The way I would approach this is to draw the skeleton* line with a stroke (say 1pt) in the background colour and copy it to a lower layer then make a wider white stroke (11pt), copy to lower layer, make the new stroke a tiny bit wider (13pt), copy again and make white stroke (23pt). The figures are based on the thin strokes being 1pt and the white strokes 5pt, but you would have to finetune it to get it right. The other thing to keep an eye on is how the ends of the strokes are affected.<br>
      Tim</p>
      <p>*the line that runs through the centre of the character</p>
