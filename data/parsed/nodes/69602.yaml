    html: |-
      <p>Regarding the apostrophe, I've lost count of how many different ways there are to encode/display glottal stops. On the basis that the spacing modifier range was specifically encoded for the purposes of phonetics, my recommendation is to use those characters where possible.</p>
      <p>Regarding the spacing acute, I would recommend using U+02CA, the combining modifier character, rather than U+00B4. I agree with your interpretation of the spacing accents in the 00 range as legacy characters. It should also be noted that these spacing accents have compatibility decompositions to space+mark, so there is the risk, albeit small, that in some normalisation situations these might be decomposed, which would affect spacing and kerning.</p>
