  html: |-
    <p>I have released Version 2 of Mike Hebrew, you may look at examples<br>
    and download the font from <a href="http://cunliffethompson.com/font" title="http://cunliffethompson.com/font">http://cunliffethompson.com/font</a></p>
    <p>The first four items are Mike Hebrew, Regular, Bold, Italic and Bold Italic.<br>
    The last item is Mike Hebrew Web.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font_family_v2.gif"></div><p></p>
    <p>The demands of readibility especially at small font sizes were leading<br>
    me away from my original design concept. In V2, these demands are<br>
    satisfied with Mike Hebrew web which may be used for reading email and looking at Isreali web pages. It is more square than the Mike Hebrew family and so my be used<br>
    at a smaller size. Adding Mike Hebrew Web has enabled me to avoid compromises with the<br>
    other members of the family.</p>
    <p>I would be particularly interest in views from Israelis on the use of Mike Hebrew Web.</p>
