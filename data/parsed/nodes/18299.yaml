    html: |-
      <p>Raphael,</p>
      <p>Thanks for you comment. I have now increased the gap in the Heh.</p>
      <p>I imagine the font would be used for decorative effect in small doses.</p>
      <p>However, I have the Mike Hebrew Web as my default font in a browser<br>
      and in response to this experience I am going to add<br>
      Mike Hebrew Web Bold in the next release. The online newspapers<br>
      HaAretz and Ynet require a bold.</p>
      <p>Mike<br>
      <a href="http://www.cunliffethompson.com/font" title="http://www.cunliffethompson.com/font">http://www.cunliffethompson.com/font</a></p>
