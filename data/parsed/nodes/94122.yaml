    html: <p>The first O looks like it's almost bumping into the R.   I think it could use a smidge more space.  Otherwise, it all looks good, including the TO combination. I'm not crazy about the color combination, BTW.  I don't know what to call the reddish background, but I hope that that shade of red and the yellow aren't the school colors :)</p>
