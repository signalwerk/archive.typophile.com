    <p>(REPOSTED FROM THE DESIGN FORUM)</p>
    <p>Hello all - Hope people are well on this sunny day (if it is in fact sunny where you are)....</p>
    <p>Below are two screengrabs of my new portfolio site. 1)The two irregular black slabs in the corner are 'test' buttons....ignore them, they'll be replaced with the thumbnails for each section. 2)The site is fairly heavily animated, so bare that it mind.</p>
    <p>The structure for the site is pretty much there, but I'm having a nightmare deciding on how to display my work. I produce a mixture of canvases, photography and custom shoe work....I need something appealing, commercially tangible, and fairly subtle. So far I've stuck on using speech bubbles to contain my pics - they fit in with the semi-comic book style I've created for the site, which also mimics my canvases.</p>
    <p>MY QUESTIONS:<br>
    -----------------------------------------<br>
    Is the speech bubble idea really awful?</p>
    <p>Any other alternatives you can think of? (eg. Scrolling rectangular boxes that obscure the background and display the pics ontop of those)<br>
    -----------------------------------------</p>
    <p>Any ideas would be a huge help - I'm stuck at this hurdle and need to get this finished.</p>
    <p>Many thanks :)</p>
    <p>P</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sitepic1.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/sitepic2.jpg"></div><p></p>
