      <p>Hiya Tim,</p>
      <p>Thanks for the reply....</p>
      <p>I'm playing with different 'stems' for the bubble - the zigzag is a bit 'naff' as my girlfriend put it.</p>
      <p>Bubbles will be reshaped for each item. This is fairly time consuming but I really don't want to rely on a straight slideshow image style. In terms of navigating bewteen pics, it's likely to involve closing the bubble and purely using thumbnails (which may get annoying for the viewer), or else fwd and prev buttons somewhere on the page - only problem with that is that speech bubbles seem to 'come from somewhere' direction-wise....Randomly loading up different speech bubbles with a fwd &amp; prev buttons seems a bit dis-jointed, does that make sense?</p>
      <p>The main thing is that the concept seems ok. I've actually added some white in&amp;outlines to the bubble which seems to soften the drop shadow.<br>
      I'll give it a go without it though. Thanks dude :)</p>
