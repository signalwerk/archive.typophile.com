      <p>I don't think the speech bubbles are a bad idea for the shoes the style seems to suit a comic book feel, not so keen on the zigzag – it seems a bit shouty, or the heavy drop shadow, I would also like to see the image filling the bubble. Does your other work suit this style? How are you going to navigate to the next pair? Will you reshape the bubble to suit each item?<br>
      Tim</p>
