      <p>&gt; But you’re certainly right that the more “established” a person the less he’s likely to want/need other people’s opinions.</p>
      <p>I’ve used this forum for several critiques and every time the responses have contributed to better work. The reason I don’t post all of my work is because I feel that if I’m going to be asking others’ opinions I should put some time into evaluating other work on the forum. Often, I just don’t have that time. </p>
      <p>&gt; Which is sad.</p>
      <p>“Established” designers seek criticism, no? Just that it’s not on forums but through employees. I work on my own but show everything I do to a group of people whose opinion I value. That’s probably a reason many people don’t post on forums—one often doesn’t know the credibility of the audience. Now, this can sound like a good thing, but I’ve seen it just be annoying.</p>
