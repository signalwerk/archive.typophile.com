    <p>if you dont know the CC-system at all, <a href="http://en.wikipedia.org/wiki/Creative_Commons" target="_blank" rel="nofollow">here is the wikipedia-entry</a> about it.</p>
    <p>i plan to release on of my fonts for free (its just a headline-font with a sovjet touch, not mouch really). but i dont want any a**h*** to be able to get profit out of it. so im comparing different possibilities.</p>
    <p>i dont have a lawyer and wont pay a lawyer to write me a good EULA, so i have to rely on already written stuff. so creative commons came to my mind, i read about it earlier.</p>
    <p>has anybody of you experience with this? is there another good way you found out working for you?</p>
    <p>THANKS!<br>
    -thierry</p>
