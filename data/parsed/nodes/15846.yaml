      <p>&gt;i dont have a lawyer and wont pay a lawyer to write me a good EULA, so i have to rely on already written stuff. </p>
      <p>Find a EULA that seems sensible, and ask the foundry if they'd be willing to let you use it. I think you'll find that most would be happy to share this with you - consolidating EULAs is something most designers see as a good thing. </p>
      <p>When Ascender's Bill Davis was at Agfa Monotype he went on the road offering AMT's EULA text to foundries - so Monotype Imaging may be a good place to start. </p>
      <p>Whatever you decide I'd recommend bringing the chosen EULA back here for a critique.</p>
