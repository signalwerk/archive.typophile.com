    html: |-
      <p>Left justified means that you justify all lines except for the last one which is ragged but left-aligned.<br>
      Center justified means that you justify all lines except for the last one which is ragged but center-aligned.<br>
      Right justify means that you justify all lines except for the last one which is right-aligned.</p>
      <p>But, agreed, the question is confusing.  I presume he means in a list if things should appear like:</p>
      <p><code>I.____<br>
      II.___<br>
      III.__<br>
      IIII._<br>
      V.____<br>
      XVIII.<br>
         e</code><br>
      or<br>
      <code>____I.<br>
      ___II.<br>
      __III.<br>
      _IIII.<br>
      ____V.<br>
      XVIII.</code><br>
      or<br>
      <code>__I.__<br>
      _II.__<br>
      _III._<br>
      _IIII.<br>
      __V.__<br>
      XVIII.</code></p>
      <p>(okay it's hard to center 2-3 characters in monowidth).  Also, off topic, is it possible to show whitespace on «code» because, well, it's kind of important for codes.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
