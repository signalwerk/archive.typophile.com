      <p>I think he means when they are in a column.<br>
      For instance, arabic numerals are set flush right, so that corresponding powers of ten line up vertically.<br>
      However, that principle doesn't apply to roman numerals, so having a pair of adjacent columns flush right-flush left may seem a bit ungainly, if there is no real need for it.</p>
