    html: |-
      <p>Can someone explain to me the difference between justified left and flush left? Where did the terms<br>
      justified left<br>
      justified center<br>
      &amp;<br>
      justified right<br>
      come from?<br>
      What do they mean.</p>
      <p>Justification was always the process of causing a set line to be the width of the measure; originally in machine-set type, by space bands that expanded to fill the measure.</p>
      <p>Suddenly, I'm seeing "justified" applied in a way that makes no sense at all.</p>
      <p>And, this query really confuses me: Roman numerals are individual characters. How can they "justify" in any fashion at all?</p>
      <p>Curt Akin</p>
