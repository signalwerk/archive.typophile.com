      <p>Well, yes there will be lots of possibilities, but some pairs are still going to be cross-linguistically more common than others, and diacritics which are not commonly used may not occur adjacent to others -- for example, I *think* that if one had an <em> sa </em> ligature in a font, that it would be more important to also implement <em>sá</em> than <em>șä </em>. But I'm basing that on the fact that <em>ä</em> doesn't occur in Rumanian and AFAIK that's the only language which uses <em>ș</em>. Even within a language which contains a variety of diacritics, it's not necessarily the case that all of those diacritics will occur adjacent to one another, and while it's relatively easy to find information on which diacritics are used in which languages, I haven't found information on diacritic pairs..</p>
      <p>André</p>
