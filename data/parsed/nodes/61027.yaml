      <p>I use terminal windows and unix utilities to find those files and process them. Maybe you can do better with Mac utilities, I don't know.  For dictionaries installed by Firefox,  I type the command "cd $HOME/Library/Ap*ort/Firefox" in a terminal window and then<br>
      <code><br>
      find . -name "*.dic"<br>
