    html: |-
      <p><cite>Frequency analysis is what you really need.</cite></p>
      <p>Most obviously. To get frequencies (absolute or relative) of bigrams, all you need is a very basic script that can be run on some utf-8 encoded input. To get such a script (for alphabetic bigrams), you can just copy what is between the cut lines and paste it in a terminal window and you will get an executable file named <code>bigrams</code> in your current folder.<br>
      <code><br>
      ----<br>
      cat &gt;bigrams &lt;&lt;'EOF'<br>
      #!/usr/bin/python</code></p>
      <p># M. Boyer 2009</p>
      <p>import codecs, sys<br>
      infile=codecs.open(sys.argv[1],"r","utf-8")<br>
      text=infile.read(); infile.close()</p>
      <p>tallies={};&nbsp; nbdata=0;&nbsp; prev=' '<br>
      def tallyq(c):<br>
      &nbsp; return c.isalpha()</p>
      <p>for char in text:<br>
      &nbsp; if (tallyq(prev) and tallyq(char)):<br>
      &nbsp; &nbsp; datum=prev+char # ; datum=datum.lower()<br>
      &nbsp; &nbsp; nbdata=nbdata+1<br>
      &nbsp; &nbsp; if datum in tallies:<br>
      &nbsp; &nbsp; &nbsp; tallies[datum]=tallies[datum]+1<br>
      &nbsp; &nbsp; else:<br>
      &nbsp; &nbsp; &nbsp; tallies[datum]=1<br>
      &nbsp; prev=char</p>
      <p>for d in tallies:<br>
      &nbsp; print('%s;%d;%.3f%%' %<br>
      &nbsp;&nbsp; &nbsp; (d.encode('utf-8'), tallies[d], 100.0*tallies[d]/nbdata))<br>
      EOF<br>
      chmod 755 bigrams<br>
      ----<br>
      </p>
      <p>Then you decide what you want to run it on. For instance, if you want to run it on Chekhov's text  Дама с собачкой (The lady with the little dog), you can type (or copy and paste) the line</p>
      <p><code>&nbsp;&nbsp;	lynx -dump <a href="http://lib.ru/LITRA/CHEHOW/d.txt" title="http://lib.ru/LITRA/CHEHOW/d.txt">http://lib.ru/LITRA/CHEHOW/d.txt</a>  &gt; dama.txt</code></p>
      <p>and then run (maybe after removing some html references at the bottom)</p>
      <p><code>&nbsp;&nbsp;	./bigrams dama.txt  | sort</code></p>
      <p>Here is a copy paste of part of the output<br>
      <code><br>
      то;372;1.927%<br>
      тп;1;0.005%<br>
      тр;85;0.440%<br>
      тс;31;0.161%<br>
      ту;26;0.135%<br>
      тф;2;0.010%<br>
      тх;1;0.005%<br>
      тч;7;0.036%<br>
      </code><br>
      There were 372 occurrences of то which reprensents 1.927% of all bigrams (after cleaning the text).</p>
      <p>With the internet, there are now many sources of texts in all languages. There is also nothing to prevent you from running the script on a dictionary to know possible combinations; it seems you then don't need the frequencies but it may still be interesting to see what were the words containing bigrams with very low frequencies. A simple <code>grep</code> answers the question.</p>
      <p>Michel</p>
      <p>[added] I guess the mac does not come with lynx installed. I must have installed it myself. That example may be more for Linux than mac users. Sorry.</p>
    html_clean: |-
