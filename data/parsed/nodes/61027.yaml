      <p>I always wish there would be some linguistics textbook that covers this stuff. Maybe Steve Peters will chime in here with some help.</p>
      <p>If you have time to figure out the syntax to sift through text file wordlists it’s pretty easy to put this stuff together using Python or just Bash scripting (grep "*öö*" file.txt | wc -l). The <a href="http://www.openwall.com/wordlists/" rel="nofollow">OpenWall wordlists disk</a> is worth it’s low price if you don’t need to analyze actual text. Ask around in the netsec world and I’m sure even more dictionaries exist. Project Gutenberg and similar resources probably have real texts covering many of the languages you need to analyze.</p>
