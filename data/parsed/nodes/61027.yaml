    html: <p>One source of information I have used for similar purposes is <a href="http://wiki.services.openoffice.org/wiki/Dictionaries" rel="nofollow">Open Office Dictionaries</a> and other dictionaries for spelling checkers. For instance, if you click on the link for Canadian English (<a href="http://ftp.services.openoffice.org/pub/OpenOffice.org/contrib/dictionaries/en_CA.zip" rel="nofollow">zip file</a>) you get a folder containing a file with extension .dic with 62341 entries (including "derived" entries). Other dictionaries can be much larger. The .dic file is plain text. If you remove what follows the slash after each word, you get a file on which you can run programs to extract pairs, count them, etc. Of course, that gives no information on the frequency with which those pairs occur in actual texts but that gives information on possible pairs for the language you chose. Some dictionaries are utf-8 encoded, others are latin1 and so on. The encoding is given at the first line of a second file with extension .aff. Some programming ability is thus required.</p>
    html_clean: <p>One source of information I have used for similar purposes is <a href="http://wiki.services.openoffice.org/wiki/Dictionaries" rel="nofollow" class="link-external">Open Office Dictionaries</a> and other dictionaries for spelling checkers. For instance, if you click on the link for Canadian English (<a href="http://ftp.services.openoffice.org/pub/OpenOffice.org/contrib/dictionaries/en_CA.zip" rel="nofollow" class="link-external">zip file</a>) you get a folder containing a file with extension .dic with 62341 entries (including "derived" entries). Other dictionaries can be much larger. The .dic file is plain text. If you remove what follows the slash after each word, you get a file on which you can run programs to extract pairs, count them, etc. Of course, that gives no information on the frequency with which those pairs occur in actual texts but that gives information on possible pairs for the language you chose. Some dictionaries are utf-8 encoded, others are latin1 and so on. The encoding is given at the first line of a second file with extension .aff. Some programming ability is thus required.</p>
