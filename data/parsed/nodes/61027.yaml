      <p>I guess there are indeed good references for English.</p>
      <p>Before continuing, let me say that <a href="http://en.wikipedia.org/wiki/Lynx_(web_browser)" rel="nofollow"><strong>Lynx</strong></a> for Mac OS X can be downloaded from <a href="http://www.apple.com/downloads/macosx/unix_open_source/lynxtextwebbrowser.html" title="http://www.apple.com/downloads/macosx/unix_open_source/lynxtextwebbrowser.html">http://www.apple.com/downloads/macosx/unix_open_source/lynxtextwebbrowse...</a>. To use it at the command line, you add <code>/Applications</code> to your path. I assume this is done, and that <code>"Terminal &gt; Window Settings &gt; Display"</code> is set to <code>Unicode (UTF-8)</code>. What follows is then good for Linux and Mac users that are used to unix commands.</p>
      <p>Now, some digrams may cause more than kerning problems. For instance, in the Typophile thread <a href="http://typophile.com/node/40439" rel="nofollow"><strong> f + umlauts</strong></a>, Florian Hardwig mentions that the diagrams <strong>fä</strong>, <strong>fö</strong>, <strong>fü</strong> may cause a clash between the umlauts and the f. Those combinations occur in German. How often? Let's check. </p>
      <p>On the <a href="http://www.gutenberg.org/catalog/" rel="nofollow"><strong>Project Gutenberg Catalog</strong></a>, I find Kant's <a href="http://www.gutenberg.org/etext/6343" rel="nofollow">Kritik der reinen Vernunft</a>. On that page I see no html version, and no utf-8 version. I see a plain text iso-8859-1 file and if I right click the "main site" link and paste it I get that the iso-8859-1 text has url</p>
      <p>	<a href="http://www.gutenberg.org/dirs/etext04/8ikc210.txt" title="http://www.gutenberg.org/dirs/etext04/8ikc210.txt">http://www.gutenberg.org/dirs/etext04/8ikc210.txt</a></p>
      <p>I will thus need to tell lynx to expect iso8859-1 text; I will save the result in kritik.txt as follows (on the command line):<br>
      <code><br>
      	lynx --dump -assume_charset=ISO8859-1 <a href="http://www.gutenberg.org/dirs/etext04/8ikc210.txt" title="http://www.gutenberg.org/dirs/etext04/8ikc210.txt">http://www.gutenberg.org/dirs/etext04/8ikc210.txt</a> &gt; kritik.txt<br>
      </code><br>
      The resulting file  kritik.txt now contains the utf8 text (lynx did the reencoding).</p>
      <p>Now I look at the digrams in kritik.txt; I do not try to be efficient; the bigrams code above is not, and as long as I get my answer in reasonable time, that's fine with me. I'll just find all bigrams in the text and then <code>egrep</code> those containing fä, fö, fü (I replaced semicolons by tabs in the <code>bigrams</code> code)<br>
      <code><br>
        ./bigrams kritik.txt | egrep "f[äöü]"<br>
       </code><br>
      and I get the output<br>
      <code><br>
      fö      27      0.003%<br>
      fü      697     0.079%<br>
      fä      255     0.029%<br>
      </code><br>
      which means that there is a total of 27+697+255 = 979 possible clashes in Kant's text. In my library, the book is 847 pages. On the average, that is more than one possible clash per page. A few simple an inefficient scripts, unix commands and pipes often give answers faster than sophisticated programs. </p>
      <p>Michel</p>
