    html: <p>&gt; [DIN is] displayed in my 1985 Letraset catalogue <br> <br>Oh yeah? Huh, I thought it was only used internally by the German highway system. So then sure, it is a font - as long as the spacing is defined too*. And I guess I'm with Joe about wondering why the FF DIN name was not an issue. Maybe because both the Letraset one and FF one are derived from the original German highway one, and <i>that</i> one is in the public domain? In the same way that there are many fonts that look like Interstate, but FontBureau can't complain. <br> <br>* If there's no spacing info, you could say it's not really a font - it's just a bunch of letters. A font is notan, not just the blackbodies. <br> <br>&gt; I consider Highway Alphabet Series E (Modified) a font as well. <br> <br>Well, even though it's in the public domain (which is probably why the name is not protected - except it's too clunky to "borrow" anyway), since from what I know it's a bunch of letterform drawings with spacing definitions, then I guess it is indeed a font, even though it requires a human to render it by hand (the way it's "encoded") - kinda like Letraset in fact! <br> <br>hhp <br></p>
