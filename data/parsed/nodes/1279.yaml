    html: <p>I visited Cape-Arcona.com today and saw on their first page, that Cape Arcona took down their font CA COSMOLAB. <br>Folks, you know they had problems with that big font foundry (it's Berthold right?) because CA renamed his CA COSMO who was to similiar to Bertholds font COSMO. <br>And after that, Bethold claimed, that the announcement that they renamed the font is not legal and that they must rename CA COSMOLAB to some other name WITHOUT mention that to CA customes. It's insane! <br>Haha, on a sidenote, they say "thank you" to the "unnamed type foundry" that they made Cape Arcona famous for that.</p>
