  html: <p>Hi <br> <br>I was interested to see that a 'Large Foundry' have threatened legal action against Cape Arcona Fonts for a font name which is similar. And that Cape Arcona have changed the name of that font as a result. <br> <br>I wondered if anyone knows where the law stands on this kind of issue, are there any cases where this has reached court. <br> <br>As a german based firm, is Cape Arcona liable to the law as it is judged in Germany, or can it be called to account by a US firm in the US where copyright of font name is more strongly protected. <br> <br>Jim <br>===</p>
  html_clean: <p>Hi <br> <br>I was interested to see that a 'Large Foundry' have threatened legal action against Cape Arcona Fonts for a font name which is similar. And that Cape Arcona have changed the name of that font as a result. <br> <br>I wondered if anyone knows where the law stands on this kind of issue, are there any cases where this has reached court. <br> <br>As a german based firm, is Cape Arcona liable to the law as it is judged in Germany, or can it be called to account by a US firm in the US where copyright of font name is more strongly protected. <br> <br>Jim <br>===</p>
