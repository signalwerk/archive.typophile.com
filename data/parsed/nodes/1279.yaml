    html: "<p>Jim -- <br> <br>Just to clarify: Typeface names are protected (if at all) by <b>trademark</b> law, not copyright. That is, typeface names can be protected as product names -- elements of business and trade -- not as intellectual property.  <br> <br>-- Kent.</p>"
