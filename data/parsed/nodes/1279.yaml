    html: <p>So, don't hate the game, hate the playa? <br>__ <br> <br>Jim, I believe that's the case in the US also. <br> <br>It's a legal game of chicken, played by people with money  <br>to scare the people without money. <br> <br>Speaking generally (since the practice isn't limited to the  <br>type industry) it's common for firm A to threaten firm B,  <br>in full knowledge that they (firm A) don't have the legal  <br>grounds to win. They just know firm B doesn't have the  <br>funds to engage in a long legal battle. In many instances  <br>firm B would go bankrupt before they could win and have  <br>their court costs paid by firm A. So firm B just has to suck it  <br>up and change their behavior or compete differently or  <br>whatever the issue is. <br> <br>I should finish by saying I'm all for the use of the law when  <br>it's necessary to protect legitimate copyrights / trademarks / <br>trade names / trade dress / et cetera. It just pains me when  <br>people can't see how to make a real living and just sue as a  <br>way to eliminate competition. <br></p>
