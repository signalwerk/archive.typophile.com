  - id: 137837
    user: 1160
    date: 2003-09-19T14:57:00
    date_raw: 19 Sep 2003 — 2:57pm
    votes: null
    html: "<p>Of all these instances, I can see how CA Cosmo is too  <br>similar to Cosmo. I can see the argument that it could  <br>cause confusion in the marketplace and be unfair  <br>competition. (That said I don't get how DIN and FF DIN <br>can exist and get along together.) <br> <br>But is Omicron Delta too close to Delta or City Slicker too  <br>similar to City?  <br> <br>______ <br>Here's another area re: naming: <br>I worked with a creative director who once worked with  <br>Estee Lauder. She explained to me that Lauder wanted to  <br>trademark a product line called Beautiful, but couldn't. The  <br>trademark folks said it was too common a word. <br> <br>You can see this play out. If Lauder could call their line  <br>Beautiful, they could potentially prevent Mary Kay and MAC  <br>and anybody else from saying their products are beautiful. <br> <br>Similarly, the agency where I worked had the same problem  <br>when they were naming JetBlue. One possible name was  <br>\"it.\" They took the name (and a few others) all the way  <br>through the review process and got stuck in legal because  <br>the name was, again, too ubiquitous to trademark. (The  <br>FAA had the final veto, but that's another issue.) <br> <br>______ <br>Other lameness: Apple Computer, Inc.'s iTunes Music store  <br>is being <a href=\"http://money.cnn.com/2003/09/12/technology/beatles_apple.reut/\" target=\"_blank\">sued</a> by Apple Corps., the Beatles' label, because <br>Apple is now in the music industry...</p>"
