    html: "<p>Nice collection! But you realize there are perhaps dozens of diﬀerent typefaces on these tickets, right? <br><br>Anyway, I’ll cherry-pick some of the obvious ones: <br><br>- Copperplate Gothic (Burnside, Strand Theatre, Center Theatre) <br><br>- Metro (Avon Theatre) <br><br>- Cheltenham (Queen Theatre) <br><br>- Goudy Bold Italic (“Drive-In Theatre” on Burnside) <br><br>- Nobel Bold (“Good only date sold” on Burnside) <br><br>- Avant Garde Gothic, squooshed (Columbia Drive-In) <br><br>I’m sure there are various weights of Monotype Grotesque, Spartan/Futura, and some of the older slabs, like Rockwell, Stymie or Memphis in the mix,&nbsp;too.</p>"
    html_clean: "<p>Nice collection! But you realize there are perhaps dozens of diﬀerent typefaces on these tickets, right? <br><br>Anyway, I’ll cherry-pick some of the obvious ones: <br><br>- Copperplate Gothic (Burnside, Strand Theatre, Center Theatre) <br><br>- Metro (Avon Theatre) <br><br>- Cheltenham (Queen Theatre) <br><br>- Goudy Bold Italic (“Drive-In Theatre” on Burnside) <br><br>- Nobel Bold (“Good only date sold” on Burnside) <br><br>- Avant Garde Gothic, squooshed (Columbia Drive-In) <br><br>I’m sure there are various weights of Monotype Grotesque, Spartan/Futura, and some of the older slabs, like Rockwell, Stymie or Memphis in the mix,&nbsp;too.</p>"
  - id: 45454
    user: 4406
    date: 2004-09-01T02:33:00
    date_raw: 1 September 2004 - 2:33am
    votes: null
    html: '<p>Marc: I think you nailed a good many of the fonts. I’ll chip in a few more guesses. <br><br>“Nobel” is basically a Kabel clone, and was released in 1993. The most likely sans-serif font for these tickets is Spartan, as it was very common in newspaper printing. <br><br>The “<span class="caps">ADMIT</span> <span class="caps">ONE</span>” on the Ocotillo ticket is <a href="http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=ADMIT+ONE&amp;search%5Btext%5D=rockwell">Rockwell</a>. The Burnside ticket has some <a href="http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=Drive-In+Theatre&amp;search%5Btext%5D=goudy+bold+italic">Goudy Bold Italic</a> on it. <br><br>There are a fair number of instances of <a href="http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=24&amp;PREFS_SET%5BRenderString%5D=TILTON+THEATRE&amp;search%5Btext%5D=alternate+gothic">Alternate Gothic</a> for condensed sans text. The Columbia ticket stands out as inauthentic in its use of Avant Garde. Many of the numbers are in various American Gothics. <br><br>Serial number printing machines tended not to use real fonts. You can use Alternate Gothic in a pinch, but the numerals of <a href="http://www.myfonts.com/fonts/fontboutique/noga/">Noga</a> look a bit more authentic to my eye. For the more condensed variants, you may also have luck with <a href="http://www.myfonts.com/fonts/hollandfonts/pacific-standard/">Paciﬁc Standard</a> or <a href="http://www.myfonts.com/fonts/castletype/standard/condensed/testdrive.html">Standard Condensed</a>. <br><br>Looks like a fun project. Best of&nbsp;luck!</p>'
