  html: <p>As per the subject, if I extract a font's info using ttx and I want to find where each glyph stroke begins and ends? Since I don't know much about the tables in fonts, I am not sure what values represent the lines used to draw a glyph.</p>
  html_clean: <p>As per the subject, if I extract a font's info using ttx and I want to find where each glyph stroke begins and ends? Since I don't know much about the tables in fonts, I am not sure what values represent the lines used to draw a glyph.</p>
