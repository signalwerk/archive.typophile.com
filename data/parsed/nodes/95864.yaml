    html: |-
      <p>For TrueType fonts, look in the &lt;glyf&gt; table, each &lt;TTGlyph&gt; element contains the point coordinates for that glyph's contours.<br>
      <code><br>
      &lt;glyf&gt;<br>
      &nbsp;&nbsp;&lt;TTGlyph ... &gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&lt;contour&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;pt ... /&gt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;pt ... /&gt;<br>
      </code></p>
      <p>In CFF OpenType fonts, the outline data is represented as PostScript code contained within &lt;CharString&gt; elements, which can be found in the &lt;CFF&gt; table. Unfortunately, determining point coordinates from the charstrings is not so straightforward unless you're fluent in PostScript.</p>
