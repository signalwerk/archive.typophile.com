    <p>Nice to meet you all. I'm a growing typo-addicts and wish to acquire some knowledge based on this typeface. I wish this question wasn't brought onto the forum before and hopefully it isn't a sensitive subject, as the topic is a fairly censored conspiracy.</p>
    <p>I was browsing fonts for a better knowledge of san-serifs and I laid my eyes on this typeface.</p>
    <p>It is really interesting of how Robert Slimbach created this typeface with such a calligraphic influence. I believed it is one of favorites for typefaces I may use in the future.</p>
    <p>Upon further research of Slimbach, I found out that he was obsessed with revivals and calligraphic nature of the older typefaces such as Garamond. However, a lot of books and information online did not mention how he concludes his design on cronos.</p>
    <p>Then I ran into an invisible filter that covers all the backgrounds of this typeface. I did not found out much but supposedly it was a copy of the typeface, Today San Serif, by Scangraphic. Yet Adobe declared Cronos was an original face developed by Slimbach himself.</p>
    <p>I wish to find out more information about this typeface and its relationship with the "original" and the "Slimbach's version". I hope the fellow typographers can direct me to some books or other sources to find out more information. </p>
    <p>Thanks you for your time!</p>
