    html: <p>My local Giant supermarket switched over to Chronos for all their signage. I don't know about its relationship to Today, but I find it a little annoying, though generally I'm a big fan of Slimbach. Is it just me, or do others see some kind of forced or false bonhomie about it. To me its softness feels laid-on, rather than organic. Of course the whole thing is very well drawn, but I still find it off-putting.</p>
