      <p>I find him quite obsessed with the typography history.(which I love, by the way). If you go on google book or something and search his name, there are a lot of mini-articles about him. I've read through his research on Garamond and Jenson, they are very fascinating to me. That he actually traveled around europe to find original prints and cuts, then redraw them, then, again, uses the historic calligraphic knowledge of his to determine Garamond's italics.</p>
      <p>So, yeah, he's awesome like that in my opinion, haha.</p>
