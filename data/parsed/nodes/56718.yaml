      <p>Robert Slimbach, who joined Adobe in 1987, began working seriously on type and calligraphy four years earlier in the type drawing department of Autologic in Newbury Park, California. Since then, he has concentrated primarily on designing text faces for digital technology, drawing inspiration from classical sources. In 1991, he received the Prix Charles Peignot from Association Typographique Internationale for excellence in type design. Slimbach now directs Adobe's type design program. He has designed typefaces for the International Typeface Corporation, as well as the Adobe® Originals families Arno™, Brioso™, Caflisch Script®, Cronos®, Adobe Garamond®, Garamond Premier, Adobe Jenson®, Kepler®, Minion®, Poetica®, Sanvito®, Utopia®, Warnock®, and Myriad® (co-designed with Carol Twombly).</p>
      <p><a href="http://store1.adobe.com/cfusion/store/html/index.cfm?event=displayDesignerInfo&amp;code=SLIM&amp;store=OLS-US" title="http://store1.adobe.com/cfusion/store/html/index.cfm?event=displayDesignerInfo&amp;code=SLIM&amp;store=OLS-US">http://store1.adobe.com/cfusion/store/html/index.cfm?event=displayDesign...</a></p>
      <p>Created by Adobe type designer Robert Slimbach, Cronos is a new sans serif typeface family that embodies the warmth and readability of oldstyle roman typefaces. Because it derives much of its appearance from the calligraphically inspired type of the Italian Renaissance, Cronos has an almost handwritten appearance, setting it apart from most other sans serif designs and making it an effective choice for text composition. The italic design was inspired by early chancery style italics and is both elegant and distinguished. </p>
      <p><a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1733" title="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1733">http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=...</a></p>
