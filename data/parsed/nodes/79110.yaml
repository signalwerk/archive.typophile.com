  html: |-
    <p>Hi everybody,</p>
    <p>I'm looking for two fonts used in logos. The first one comes from ROC La Voulte-Valence Rugby Union Club. Letters are quite "square", geometric ones with some "holes" on the upper part of the letters. As the hole structure is the same for a same letter, I imagine that it's specific to the font.<br>
    The second one is from DRU or Dannish Rugby Union Federation, it seems to be a condensed font.<br>
    As usual, images are attached.</p>
    <p>Best Regards,<br>
    12HAL9000</p>
