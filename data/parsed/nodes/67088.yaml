    <p>Hi everyone, newcomer here.</p>
    <p>Ok, so im doing a thesis project on a display font. My typeface is going to be design in a 2x6 grid. So it would be align vertically and horizontal.</p>
    <p>I want to see what you guys think about it, also if you have any resources or if you know any information on grid fonts.</p>
    <p>The person that actually got me into this whole grid base was Wim Crouwel, got his book as a ref.</p>
    <p>thanks in advance.</p>
