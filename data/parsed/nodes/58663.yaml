    html: |-
      <p>Wow, this goes waaaay back. It was released by an LA-based typesetting company that dabbled in type design in the early days of Fontographer. I remember seeing an article in Step-by-Step Graphics (later Step: Inside Design, which folded recently) that detailed the design process. The designer was very open about his admiration of Triplex and his desire to make a similar face.</p>
      <p>Maybe this description will help jar the memories of other early-DTP vets. There’s a chance that I still have the type specimen, but it’ll be a week or two before I have time to check. Frankly, I’ll be surprised if the company that issued the font is still in business.</p>
      <p>There’s not a lot of subtlety here, and you’d be within your legal rights (as I understand them) to redraw the characters for the logo. Then you can choose another, better-drawn, legally available face as a complement.</p>
