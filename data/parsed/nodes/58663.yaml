    <p>Hi All—</p>
    <p>I have this font loaded on my machine, originating from a disk that has been passed around my work forever.  Now I have successfully pitched it on a huge logo rollout, only to discover I cannot find it anywhere to purchase and have a legitimate licensing agreement.  On my machine, it is identified as Simplix Bold.</p>
    <p>I’ve been to whatthefont and identifont, and they both lead me to an Emigre font called Triplex, but there are significant differences, for example in the lowercase “a” and “e”.</p>
    <p>Any ideas?  Thanks so much!</p>
    <p></p><div class="imageWrap"><img src="/files/identify_5067.jpg"></div><p></p>
