  html: |-
    <p>Hi all,</p>
    <p>Months ago I saw a website that showed a word (perhaps a word the user even chose), where the typeface was outlined, and it morphed from one typeface to another. It was great for demonstrating how different the shapes, x-heights, sizes, set-widths of varying faces can be.</p>
    <p>Does anyone know what I’m talking about? And if so, please point me back to that website!</p>
    <p>Thanks,</p>
    <p>Paula</p>
