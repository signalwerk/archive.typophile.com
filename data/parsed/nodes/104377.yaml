    html: |-
      <p>Interesting website. It shows the same font on many products. Also did you note the company info on Compagnie de Provence:</p>
      <p>---start quote---<br>
      En France, notre marque est présente à travers 7 boutiques en nom propre et chez environ 300 revendeurs.</p>
      <p>Nous sommes présents dans des magasins de décoration indépendants, chez Botanic et Truffaut, et des grands magasins comme le Bon Marché, les Galeries Lafayette, le BHV, La Grande Epicerie ou Conran Shop.</p>
      <p>A l’étranger, notre marque est diffusée dans environ 40 pays.</p>
      <p>Les magasins Selfridges, John Lewis, Conran Shop au Royaume Uni, Stockmann en Finlande, Illums Bolighus à Copenhague, Ahlens en Suède et Norvège, Globus en Suisse, De Bijenkorf aux Pays-Bas, KaDeWe à Berlin, Sephora en Chine, David Jones en Australie, nous font confiance.<br>
      ---end quote---</p>
      <p>The scale of  Compagnie de Provence suggests a bespoke font. Perhaps in-house. Perhaps by a design studio, like A2, ChristianSchwartz, or more likely a French studio.<br>
      So this would seem to narrow the search to identify the font designer.<br>
      Google "marketing agency for Compagnie de Provence" yields some interesting leads.<br>
      Something called <a href="http://agence5970.com/projects/compagnie-de-provence" rel="nofollow">agence5970</a> may have been involved.<br>
      Interesting, but does not answer the font ID question.</p>
      <p>Indeed I could be wrong &amp; this is something off the shelf.</p>
      <p>Don</p>
