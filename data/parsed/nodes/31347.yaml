      <p>I don't get a lot of rolling eyes. If I see something I like I might comment on it or take a picture. Most people that know me realize that's just what I do. That covers more than just fonts, also logos, layouts and illustrations. I pay attention to colors used the most.</p>
      <p>I try to take it easy on my friends that aren't designers. I wouldn't want to go to lunch with an accountant to hear her cooingly hype how great the latest money managing software is.</p>
