    <p>We've all been through it. We're out at dinner. We're ordering our food. Looking at the menu you notice, <em>Hey, they used Triplex Serif for the design. Cool.</em> </p>
    <p>They say <em>What?</em> You look up and reply, <em>You know, the font. They used Triplex Serif for the font. It's from Emigre.</em></p>
    <p>And then the eyes start rolling.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/images_6744.jpg"></div><p></p>
    <p>Your date/friends/waitress think you're a massive dork, and you hang your head in shame. The end.</p>
    <p>Happens to me just about every day, and I'm used to it. My friends are used to it also. They've accepted the fact that I'm a font nerd and sometimes, SOMETIMES, they even ask me to I.D. one for them.</p>
    <p>So, how do you deal with the rolling eyes? And what is your typical response?</p>
