      <p>Hey Jackie, how much did you cross paths with my buddy Charlie Toor, who had a shop on (I think it was) E 45th, Charles Toor Tradegraphics or something like that. I believe he had Alphatype as well. He moved up to NH around 1970 to establish a mom and pop printing business and I ran his darkroom, made plates (ah, the old days of high craft -- and I do mean high -- hand-rubbing that red lacquer onto the R plates and having to use exactly the right touch and pressure so that halftones would come out even and not streaky), and occasionally ran a press. He taught me to set display on his Typositor and many other things about type . . . and music. </p>
      <p>He's a fantastic jazz pianist (studied with Jaki Byard for many years) and plays out and sings around here in the White Mountains of NH. When he was a teen he used to sneak over from Brooklyn to hang out at the Royal Roost. One night Bud Powell was in the room but he was so messed up he couldn't play, so Max Roach and Diz and I'm not sure who else plucked Charlie out of the audience and had him play piano!! He claims that he managed to hold his own despite much challenge from the rest of the players.</p>
