      <p>I guess I did come off a bit superior there. That wasn't my intention at all, Paul. I don't somehow make it my duty to lecture everyone I see on their typographic mistakes or subject them to hearing about my recent favorite type discoveries. But I've found that for every person that never noticed type and has no interest in it, there's someone who never noticed it but is excited to learn. Somehow typography came up while talking to a classmate in my Shakespaere class. He asked me why type interests me, and I told him that it's learning about the history of each typeface and being able to see the intricacies of letterforms that give a font its character. The next day, he told me that he spent an hour-and-a-half the previous night in Word going through each of his installed fonts at a big point size. He was honestly excited to have learned about type, and I was genuinely happy to have given someone some typographic appreciation.</p>
      <p>It is tempting to point out to someone that their sign is an exemplar for how not to kern, but I don't -- I save my comments for those who want them.</p>
      <p>One other thing that my year-old passion for type has made me think about is what other passions there are that I've never given a second thought to. I know that people have forgotten more about music, painting, ancient history, etc. than I'll ever know, but are there people who feel passionate about things like wood? Tiling? Globes? Cell phones? I've always entertained the thought of some day writing about all these passions and what people find so fascinating about them.</p>
