      <p>When I was first really falling in love with type in the early 70s, I was living in Boston with a roommate. I worked at an art supply store (Charrette) and Jeff operated a typositor in a local composing room, so we talked about type all the time. For evening meals we often went to a Greek resto around the corner called Ann's Lunch, and as the food was outstanding and reasonably priced, it was also a hangout for cops. </p>
      <p>At that time the Boston police must have decided they needed an advertising agency or something, because overnight all the cruisers went from saying BOSTON POLICE in Helvetica Light a/c, to very large <strong>boston police</strong> in Futura Black lc. Not exactly what any of us would call a subtle change. </p>
      <p>Okay, Jeff and I walk into Ann's and I see a table with four cops. I approach them with all the excitement and zeal of age 22 and say, "Wow!! What do you guys think of the lettering on your cars?" They all look at me like I'm from Mars (or more likely, <em>on</em> something) and say, "What?!" I explain, with just a bit of impatience, "You know, the writing on your cruiser doors." They look at me deadpan, then at each other, then back at me and say, "I dunno, Mac. It still says 'Boston Police,' don't it?"</p>
      <p>It was in that moment that I realized the world was divided into two distinct groups . . .</p>
