      <p>It's funny because I've been reading all the previous posts, and I think that when I talk about type to most of my friends who aren't familiar to typesetting and type design, they seem interested. </p>
      <p>Me and my partner have a theory to explain the lack of knowledge on type design. In a movie the stars are the actors and the director, though people are aware that someone has been paid to design the set, another one to do the lighting, another to work on the special effects and so on. What is more complicated with type is that almost everybody has learned to write. The act of writting is given to almos everyone, which makes it natural. The other thing is that: it comes with the computer, it's already in it when you buy it. Who would imagine that someone designed it.</p>
      <p>I think that being passionate about something allows you to talk about almost anything and be interesting, unless you're trying to brainwash your audience. For example, I always tought curling was so boring. Until a friend of mine who is a curling passionate, explain me in a bar, drawing the ice with coasters, the rules and the issues of playing curling. You know what? I'll probably go give it a try.</p>
    html_clean: |-
