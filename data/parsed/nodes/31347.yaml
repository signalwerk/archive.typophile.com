      <p>Hey Chris -</p>
      <p>Marvin Kommel was more than 20 years my senior. He was a competitor - and in the last few years of his life, a true friend.</p>
      <p>My frog loving friend was Jame R. Harris - aka Jimmy. He was once the art director of trade books for Ballantine - and later the art director for Perigee and River something or other for Berkley Books, part of Penguin USA.</p>
      <p>When I go to my local Barnes &amp; Noble now - I am sadden how so many books look the same. The designers do not seem to do as much handtailoring or handlettering as they use to - and so much of it looks -- well, the same.</p>
      <p>And yes Chris - fact of life - as you get older, you lose loved ones... no getting around it -- unless you are in to the alternative... and I'm not - fortunately, I have a very nice life - and as you can see, two very sweet, loving doggies :)</p>
      <p>&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;</p>
      <p><em>You know, I never thought of it that way. A subliminal experience. I don’t think I’ve ever heard anyone ever describe design in that way. I guess that good typography is supposed to be invisible. Something to catch your eye, but also to let go so you actually read it.<br>
      But what is wrong in cracking the illusion?</em></p>
      <p>That is what we have headline (display) type for... body copy - nice grays, nothing that makes you turn away... headline - for the designer in us all...</p>
      <p>&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;</p>
      <p>Bruce, I wish I did know your friend. He was out of the city before I opened Gryphon. I was on E. 46, then E. 44, then W. 28 and then E. 43 -- just about 20 years of moving around...<br>
      Hope he is still with us - we've lost so many good ones...</p>
