      <p>I admit, I point things like that out. Partly because it's fun, but also partly to demonstrate how pervasive type really is. I agree with David that there are times where it's supposed to be subconscious, but that certainly doesn't apply all of the time. Type can have a great deal of character and presence. I, as a designer, capitalize on that regularly.</p>
      <p>But I never expect people to care too much about font geekery, and I keep it to a casual statement. A lot of times people crack jokes, and occasionally someone asks me to elaborate, but many of my friends are more type-conscious/-sensitive now as a result. You can't really make people care, but you can open a few eyes. If you're at a party and two people out of twenty think "hmm, that's interesting, I never thought of that", then they take that awareness with them. Perhaps you're saving another graphic designer a headache, or even creating a font license sale for some indie font designer down the road.</p>
      <p>But if someone actually rolls their eyes, I usually tell them "I admit, it's a subtle thing, but both god and the devil are in the details, so type designers are keeping some pretty interesting company."</p>
