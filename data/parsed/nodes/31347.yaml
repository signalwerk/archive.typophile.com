      <p><cite>they very simply don’t care nor should they.</cite></p>
      <p>I'm not sure I agree Paul. Isn't it nice when you manage to get someone's attention about something they had never thought much before? Last Friday I went to my stretching and after class I had a chat with the instructor, the last person you'd think would be interested in typography or architecture. She asked me what I was doing so I proceeded to explain  and I guess at some point she started to see how fascinating the subject was and she asked me more and more questions and I could tell I had really planted a seed or something. The same with my partner, when I start telling him about the amazing experience of turning the pages of an old book, the smell, texture, typography, layout...he stops whatever he's doing and listen. I promise you. I guess it's the twinkle in my eyes, people notice when something REALLY revs my (little) engine.<br>
      But if you think you're going to grab someone's attention to typography by dissing a menu because is set in Comic Sans (and you're right to do it, of course), well, I think you're going to get only rolling eyes, which is a pity.<br>
      I think it's important you draw attention not only to typography but to many other subjects that people tend to find irrelevant. People have lost their ability to *see* and it's the most amazing (and rewarding) experience when you make them see again.</p>
