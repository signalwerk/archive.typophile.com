      <p>DanGayle - I think you need to find some friends who appreciate fine type with their fine wine.</p>
      <p>Bruce - I love the Boston Police story.</p>
      <p>Pattyfab - where I am living now, some of the restaurants have found a program for Windows - that designs and makes menus. I'm pretty proud of one of the restaurants, they had ITC Anna and Caslon in their computer - and it did a very nice job. There was one steak house here that insisted on Old English in all caps - I redid the menu for them - they paid for it -- and unfortunately, they soon went out of business. Not their fault - odd landlords....</p>
      <p>Now to share my own story. Some of you may remember Marvin Kommel. He owned MKP Type aka Type Emporium. He was mostly a typesetter's typesetter. If Photolettering, Cardinal, Haber, etc. didn't have the typositor face and needed the job overnight- they went to Marvin. Marvin, btw, was not only a competitor of mine, he too, was an Alphatype shop. </p>
      <p>Marvin and I would met every Monday for lunch. He would give me all the details of which typesetter's funeral he went to that weekend. (Those last few years 1992-1996 was very rough on typesetters...) After a lovely lunch (boy, did he know how to eat well) we would walk around bookstores. Not only did we play guess which font in used on the title of the book - we expanded it to -- guess which typeshop set it*,  who designed it and which publisher. We were always loud and enjoyed ourselves, especially if others were around the bookstore. So many really didn't (and still don't) understand how much work went into something that looked so simple, or how many of us truly took pride and care in our work.</p>
      <p>Thanks for my memory. Marvin passed away three Januarys ago. RIP Marvin.</p>
      <p>• Ttrick question most of the time with Marvin -- it may have been billed by another typehouse, but so many times it was an MKP font that produced it...</p>
