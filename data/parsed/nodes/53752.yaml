    html: |-
      <p>OK, maybe to put some people's mind at ease: There is absolutely nothing wrong with doing OT TTF, nada, njet, zilch. Larger file sizes are not really an issue, they should only differ by a few k. If it is very much more, then the TTF fonts are hinted!</p>
      <p>Dalton Maag produces all its fonts in TTF format because they work reliably. We have never had any issues with TTF. This is particularly true for anything outside the standard ANSII char set.</p>
      <p>OTF (CFF) fonts did have some problems with older apps in dealing with Central European characters, and other non-Latins. The reason is that in TTF all glyphs map straight to Unicode, whilst with CFF you still have, in essence, a PostScript font based on glyph names, padded with a huge wrapper that makes it OT. The glyph names then point to Unicode. So, if your font hasn't got a clean glyph name table it won't point correctly to Unicode and it won't either display correctly or print. As it is, in essence, still all based on glyph names, the conversion tables in your printer drivers have to be fully compliant with your glyphs names in the font, otherwise they won't be recognised.</p>
      <p>You may have found that when loading a TTF into MacOSX with FontBook you get a warning not to install the font as it is corrupted and will explode your system, followed by complete annihilation of the area you live in. This is due to a 'bug' in Fontbook that demands there is a 'fpgm' table present in all TTF fonts. This table is only needed if the font has been hinted. You can ignore the warning. Your font will work and life will go on.</p>
      <p>Phew, that was a rant. Again, use TTF. It works, there is no downside. </p>
      <p>Bruno Maag<br>
      Dalton Maag</p>
