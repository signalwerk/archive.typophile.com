      <p>When you say "characters, glyphs or ligatures are not displaying in a variety of applications across platforms", have you looked into which OT capabilities Windows based apps have vs. Macs. Some Windows apps are different than Mac versions. Ligature substitution shouldn't be problem in either flavor of OT, but other features vary a lot when it comes to OT capabilities.</p>
      <p>I'm especially interested in responses you get as I will soon be involved in a similar assignment. I work in a very large creative studio that is about to undergo major upgrades. We are migrating from Freehand as our layout app to Adobe CS4. We will also be migrating our Font Reserve Server to Universal Type Server. I will be responsible for most of that and converting our proprietary font collection to OT format. I won't be converting our general font collection as these will need to be repurchased. I will have to do fixes though, till new licenses are attained. UTS I'm told will automatically purge corrupt or orphaned PS fonts.</p>
