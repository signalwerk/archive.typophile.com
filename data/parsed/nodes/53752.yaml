    <p>I would love to get some weigh-in regarding the conversion of fonts across platforms. We have a little experience in this realm, but we are running into problems. We have a large office of creative contributors, both the PC and Mac platforms are represented here so because there is so much back and forth with files including the fonts, we have decided to install Extensis Universal Type Server so we can all be on the same page.</p>
    <p>We have opted to convert everything to Opentype Postscript (.OTF) because, from the tests that we have done, the file size is considerably smaller. But frequently what's happening is that characters, glyphs or ligatures are not displaying in a variety of applications across platforms.  There doesn't appear to be a pattern to it, but when we convert the font to OpenType TrueType (.TTF) the problems seem to be diffused.</p>
    <p>The main question we have is; If we convert some fonts to TrueType does that disable any of the advanced OpenType features in the font itself?  I have my assumptions, but i wanted to open it up for your input. </p>
    <p>Your help is appreciated, we are currently converting thousands of fonts (all above board) and would love to have this done right.</p>
    <p>Thank you.</p>
