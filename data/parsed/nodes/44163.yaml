    html: |-
      <p>Dutch:</p>
      <p><em>Articles:</em> de, het, een</p>
      <p><em>Pronouns:</em> ik, mij, me, jij, je, u, hij, zij, ze, het, hem, haar, het, wij, we, ons, jullie, hen, hun.</p>
      <p><em>Possessive pronouns:</em> mijn, jouw, zijn, haar, ons, onze, jullie, uw, hun</p>
      <p>And some of the ones that Ch added for English also in Dutch:</p>
      <p><em>Prepositions:</em>  bij, tot, op, om, in, uit, door, naar, voor, achter, boven, onder, naast, langs, tegen (just a selection)</p>
      <p><em>Conjunctions:</em> al, als, behalve, dan, dat, doch, doordat, dus, evenals, hoewel, maar, mits, nadat, nu, of, om, omdat, tenzij, toen, tot, want (just a selection)</p>
      <p>If you want to know what some of them are in English, let me know. :)</p>
