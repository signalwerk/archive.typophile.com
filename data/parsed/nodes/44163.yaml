    <p>hi guys,</p>
    <p>i was wondering if people could help me compile a list of common words/pronouns from as many languages as people know. Kind of like Bello words but not just English, words that would be useful for a range of languages.</p>
    <p>Some examples:</p>
    <p>English: the, and, it, you, who, he, she, why</p>
    <p>French: le, la, les, que, qui,</p>
    <p>cheers.</p>
