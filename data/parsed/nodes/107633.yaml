    <p>Hi guys,</p>
    <p>I have been working as the creative director of magazines (having recently joined a large magazine that comes as a supplement in a newspaper) for the past three years. I have just been promoted to creative director of the entire newspaper, which includes its broadsheet, a supplement and a separate magazine supplement that I have been creative director of.</p>
    <p>As such, given my experience with magazines, a newspaper is quite the change. I recently redesigned the magazine as creative director of that, and that is the reason I have been promoted essentially. </p>
    <p>That's just some background. We are purchasing Type Together's Coranto 2 and LFT Etica as a serif-sans pair, but everyone seems to want to keep the masthead font, which is set in Utopia Display. I think it is really quite poor, but then that is probably because most mastheads on newspapers are essentially custom variations of fonts. But Utopia is not a font I like anyway, and it does look desperately generic. It just doesn't look nice.</p>
    <p>Are there any fonts similar to Utopia, but with a bit of flare and originality (I know this is an oxymoron given I'm not a fan of Utopia) that could go and replace the masthead font? Or does anyone have any suggestions for one? It has to stay serif.</p>
    <p>Your help would be greatly appreciated!</p>
    <p>Thanks.</p>
