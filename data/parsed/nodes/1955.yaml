    html: "<p>Fedra is a bit idiosyncratic already - maybe a more docile display face would match it better? <br>But something contemporary, not a grot - I guess a dark (and maybe wide) humanist sans. <br> <br>I think a logo in Sabbath (Newlyn's, right?) might work really well with Fedra. <br> <br>If you can get Jürgen Weltin's Yellow font (attached) for display, that would rule: it has some blackletter overtones, and a wonderful synthetic feel, just like Bilak's work. <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/19926.gif\" alt=\"Yellow\"> <br> <br>hhp <br></p>"
