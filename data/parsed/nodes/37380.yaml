    html: |-
      <p>James, before using a font in a project, I check (among others) following list. I am a designer working mostly with texts in Czech language, so my comments are related to Central European characters only.</p>
      <ul>
      <li>diacritical marks – proper shape, position and size (one of the most problematic glyphs in Czech language is <em>dcaron</em>, if this character is drawn properly, it is a good indicator the rest of the characters will be probably – but not always – acceptable)
      </li><li>kerning of accented letters (many type foundries somehow forget to kern accented letters, they probably don’t know that in many European languages accented characters could appear next to each other – even four in a sequence “tříšť”; several type foundries do kern accented letters but only with non accented letters)
      </li><li>proper kerning of letters <em>dcaron, tcaron</em> and <em>lcaron</em> (special attention is needed as those letters could be followed by letters of x-height or letters with ascenders)<br>
      </li></ul>
