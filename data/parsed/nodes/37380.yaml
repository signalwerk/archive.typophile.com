  html: <p>What should designers look for when purchasing a font? I’m thinking about stuff along the lines of well-drawn vectors, good letterspacing and kerning, Opentype features in Opentype fonts, oldstyle figures in text fonts, and so on.</p>
comments:
  - id: 228951
    user: 9349
    date: 2007-09-22T16:42:00
