    votes: null
    html: |-
      <p>Apart from good technical quality, build and execution, I always look for well-honed design value and conceptual specifity.</p>
      <p>Default oldstyle figures are nice for book and literary work and ads, and msot kinds of display typography, but lining figures have huge practical advantages if you're doing annual reports, point-of-sale literature, maps, instruction manuals and the like.</p>
      <p>OT features: built-in smallcaps are handy but with some OT fonts they're poorly kerned and it's easier using a separate smallcaps font. OT capitals spacing feature I find very useful if the font maker has established useful settings---it saves you time and tracking experiments.</p>
      <p>j a m e s</p>
