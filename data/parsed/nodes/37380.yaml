      <p><em>How can you view the quality of the technical aspects James (P) lists without buying the font?</em></p>
      <p>An important question, and an issue I run into when buying fonts from some newer and/or independent foundries (many majors' draws of classics fall into this category too to be fair). The letterspacing is downright awful at times and I have had to track and kern the $hit out of some typefaces in order for them to at least look normal. I don't think there's any real way to know that until you take the plunge.</p>
      <p>I generally look for value, OT features, and usability of the face when I make purchases. Can I use this face more than once? How many options do I have to set text with it? I also like old style numerals so, I like looking for faces that have them as an OT feature.</p>
      <p>I gotta throw a thumbs up to Font Bureau for Interstate. The spacing on the family is the best of any sans-serif font I have ever used, period. It requires the least maintenance, and is beautifully drawn so it gets a lot of use from me.</p>
      <p>The Thesis SuperFamily ain't too shabby either. Luc(as) knows fonts! They're both pricey as hell...but worth the dough. An example of quality being worth the price tag. Very versatile. I use the ever loving crap out of both families. :)</p>
