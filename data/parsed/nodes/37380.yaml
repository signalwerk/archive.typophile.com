      <p>A "hack encoding" is when you encode a glyph incorrectly intentionally. For example, putting alternate characters into the slots intended for math characters. </p>
      <p>The uni name thing is a workaround to overcome a deficiency in Apple's font support, but it's a just a different (and equally valid) way to make a font. It doesn't break any rules, it's just a pain in the butt.</p>
