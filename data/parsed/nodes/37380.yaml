      <p>James,</p>
      <p>I think first the designer has to decide which font he or she will be purchasing. It has to marry the job they are working on. Next, if you purchase a font, you want one that has been well made. What I mean by that is, the letters fit together like they should, there should be punctuation, numbers and incase it is a display typeface and not just a text face - then a few alternative letters would be nice.</p>
      <p>Then a font that will be able to work with your computer's system - and to the printer you send it out to, if you are having the job printed. (I'm on a MAC - Mac Type 1 are stabile, .ttf can be trashed - and not all Pro or OT fonts are created equal.)</p>
      <p>Then you just need to know the font works for you. Best of luck to you on your first purchase.</p>
      <p>P.S. An what is really nice about owning the font - is if they change the way the fonts are produced, they normally replace the one you have with the new type. I can still remember my Mac Type 3 floppy disks going out the door and new Mac Type "A" fonts returning...</p>
