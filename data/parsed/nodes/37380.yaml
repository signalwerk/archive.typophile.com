      <p>I hate with a passion the "parts bin". Characters pulled from a generic font that is contrary to the majority of the design. Particularly, these guys: @, ®, ©,¶, ™, €, and $. The math symbols are the usually victims. I don't set anything needing the math symbols but if they're there, it's nice to see them native to the font. </p>
      <p>But when you bomb the registered trademark, copyright, and "at" symbols I have to seriously rethink if i really want the font.</p>
      <p>Usual offenders: Linotype, Monotype, ITC and Bitstream. </p>
      <p>Font Bureau offer (as well as others) generally excellent fonts. However many "at" symbols are optimized for capitals whereas I think they are mostly important in the lowercase for email addresses. Tedious baseline shifting is not fun. So be weary of special symbols.</p>
