      <p>Florian Hardwig wrote:</p>
      <p><em>If you don’t bother designing such time-consuming glyphs as superscript 1,2,3s, vulgar fractions or basic mathematical operators [...], then please leave their slots blank.</em></p>
      <p>Florian, there's actually a technical reason to fill the blank slots with placeholders. If you just leave them empty, the common code pages will not be supported by the font and thus it may show up in weird places in the font menu of apps like InDesign, e.g. at the bottom between the CJK fonts. You could use spaces but I think that's even more confusing than stick figures appearing :)</p>
