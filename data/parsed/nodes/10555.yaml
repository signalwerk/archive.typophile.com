    votes: null
    html: "<p>You also need to raise the parentheses in the phone number, to center them on the type. If you go for OSF-numerals the position of the par's is probably going to be ok. <br>Oh, and don't use a division, but a proper en-line. <br>Oh once more: I find @'a are almost always too big. Reduce it's size a bit and adjust the spacing to the left a bit. <br>Aaaanndd: less space after the point after your initial would be an improvement, too.</p>"
    html_clean: "<p>You also need to raise the parentheses in the phone number, to center them on the type. If you go for OSF-numerals the position of the par's is probably going to be ok. <br>Oh, and don't use a division, but a proper en-line. <br>Oh once more: I find @'a are almost always too big. Reduce it's size a bit and adjust the spacing to the left a bit. <br>Aaaanndd: less space after the point after your initial would be an improvement, too.</p>"
