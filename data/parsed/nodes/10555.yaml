    html: <p>Are you certain that you need that border?  Unless you’ve got a very anal/fancy/expensive printer, chances are you’re going to have a very hard time getting that thing to center properly when the cards get cut.    The small size of a business card is just going to draw attention to the small inaccuracies that will certainly come from the cutting.</p>
