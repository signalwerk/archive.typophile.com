    html: <p>The G and D of Graphic Designer need some attention to kerning compared to your name, but the overall kerning is better. There is no hard and fast international rule for the use of hyphens or en-dash in the phone number, I suspect it is somewhat governed by local preferences, but I agree that the hyphen is a stronger character than the en-dash. Neither of the rules of your border join at the top left corner on the pdf*. Another thing to consider when using borders is that the trimming process can be slightly inaccurate and give you off-centre borders, you can either speak sternly to your printer or consider an assymetric design. <br>Tim <br>* a good reason to use a pdf, although it is simpler to view a jpeg on screen.</p>
    html_clean: <p>The G and D of Graphic Designer need some attention to kerning compared to your name, but the overall kerning is better. There is no hard and fast international rule for the use of hyphens or en-dash in the phone number, I suspect it is somewhat governed by local preferences, but I agree that the hyphen is a stronger character than the en-dash. Neither of the rules of your border join at the top left corner on the pdf*. Another thing to consider when using borders is that the trimming process can be slightly inaccurate and give you off-centre borders, you can either speak sternly to your printer or consider an assymetric design. <br>Tim <br>* a good reason to use a pdf, although it is simpler to view a jpeg on screen.</p>
