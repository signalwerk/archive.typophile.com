    html: <p>Lex, fyi the PDF makes your type look heavier. I would print a version of your latest layout and contact your printer and discuss potential problems of raised printing. Talking to your printer early on can save a lot of problems later as Tim noted. That design might have 20% waste just from cutting. <br> <br>One last thought, if you are going to emboss anything, let it be you mark in the middle of the card. Make it a blind emboss or a pastel foil emboss. You might also look into a foil stamp.</p>
