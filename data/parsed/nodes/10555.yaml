    html: <p>Thanks for the advice Daniel. <br> <br>I was actually thinking of going with PMS Black 12, but the printer said it would be more expensive, so I'm still debating whether or not to use it. I also want to print with raised ink if I can afford it. <br> <br>The mark in the middle is a quarter rest from musical notation. I put it on the card so people would ask me about it, and it would be a quirky reminder of me whenever they see the card. <br> <br>I was also thinking of going with OSF for the phone number. I know that this is not normally advised, but it might work. I'll post a sample when I get home. <br> <br> - Lex</p>
