    html: <p>Alex, look at making the border a tint of your black and look at PMS blacks like PMS Black 6 which has a red tint in it. The PMS blacks have a bit more depth. As for the type look at the spacing between the E,X and A (EX to tight XA to loose),  the J and O and the K,O and M it seems to be a bit loose. Last point I haven't a clue what that mark in the middle of the card is. Good start</p>
