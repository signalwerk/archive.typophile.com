    html: <p>Thanks Bert. <br> <br>Looking at the @, I agree with you. I'll take it down a couple of point sizes and use a bolder weight. <br> <br>I always thought that hyphens were used in phone numbers. The line is actually a hyphen (<a href="http://store.adobe.com/type/browser/F/JENA/F_JENA-10005000.html" target="_blank">as you can see here</a>). Should I go with the en-dash anyway because the hyphen is so slanted? What about lowering the macron down to the same level as the hyphen, as it has a nicer shape than the en-dash? <br> <br>I'm also wondering about the space between the parentheses and the rest of the phone number. To me it looks a little big. What do you guys think? <br> <br> - Lex</p>
