    html: <p>Daniel, <br>I was going to post the GIF, but CorelDraw 8 does some funny things with exporting. A lot of the kerning problems of the original, such as the LE in ALEXANDER were caused in part by this. I'll try a version without parentheses. <br> <br>I used the "Caption" optical weight of <a href="http://store.adobe.com/type/browser/P/P_1716.html" target="_blank">Adobe Jenson Pro</a>. Should I use the regular weight to compensate for the raised printing, or should I go to Caption Light? <br> <br>Alessandro, <br>I like the spacing around the phone number and e-mail address in your version. I'll try to match it. I'll also increase the mark's size. I still like the border, but maybe I can go with embossing (again increasing the price) instead of printed to put the focus on the text. <br> <br>Tim, <br>I think the hyphen works well too. The unjoined border is, again, something that happened when I exported from CorelDraw. I'll try to figure out how to fix that. My original design (I didn't post it here) had borders much closer to the edge of the card and I moved them in for the reason you mentioned. <br> <br>Thanks again to everyone for helping me out with this. I'll post some updates later today. <br> <br> - Lex</p>
