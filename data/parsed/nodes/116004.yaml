      <p>It looks like an emboldened/rounded <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=Yikes%21%20-%20Regular&amp;fid=65118801617512898ee05330233fef7d&amp;fsize=60&amp;text=MULLIGAN%E2%80%99S&amp;fit=1" rel="nofollow">Yikes!</a></strong> free font by W. Allen Montgomery [1997]</p>
      <p>There is also a very similar commercial font called <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/zoinks/" rel="nofollow">Zoinks</a></strong> by Comicraft with a design date of 2003, so I'm really confused and I suggest to be extra careful if you need to acquire a commercial license for your project.</p>
