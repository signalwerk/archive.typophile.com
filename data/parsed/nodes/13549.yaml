    <p>After the reunification of Germany, Kapr was a tireless supporter of Blackletter. He even lobbied the Bundespräsident, hoping that  the reading and/or writing of Blackletter and Sütterlin could be reintroduced into the curricula of German elementary schools. It was not.</p>
