    <p>b. Stuttgart, 1918<br>
    d. Leipzig, 1995</p>
    <p>1938-1948: student, <a href="/wiki/Stuttgarter%20Akademie" class="freelinking" rel="nofollow">Stuttgarter Akademie</a><br>
    1949-1950: lecturer, <a href="/wiki/Academy%20of%20Fine%20Arts" class="freelinking" rel="nofollow">Academy of Fine Arts</a> (Weimar)<br>
    1951: Professor, [Hochschule fuer Grafik und Buchkunst | Hochschule für Grafik und Buchkunst]]  (Liepzig)<br>
    1956-1978: head, <a href="/wiki/Institute%20of%20Book%20Design" class="freelinking" rel="nofollow">Institute of Book Design</a><br>
    1959: Rector, <a href="/wiki/Hochschule%20fuer%20Grafik%20und%20Buchkunst%20" class="freelinking" rel="nofollow"> Hochschule für Grafik und Buchkunst</a> (Liepzig)<br>
    1966-1973: Rector, <a href="/wiki/Hochschule%20f%C3%BCr%20Graphic%20und%20Buchkunst" class="freelinking" rel="nofollow">Hochschule für Graphic und Buchkunst</a> (Liepzig)<br>
    1964-1977: Art director, <a href="/wiki/Typoart" class="freelinking" rel="nofollow">Typoart</a> typefoundry (Dresden)</p>
    <p><strong>Fonts Designed</strong><br>
    <a href="/wiki/Faust" class="freelinking" rel="nofollow">Faust</a> (1959)<br>
    <a href="/wiki/Leipzig" class="freelinking" rel="nofollow">Leipzig</a> (1963)</p>
    <p>After the reunification of Germany, Kapr was a tireless supporter of Blackletter. He even lobbied the Bundespräsident, hoping that  the reading and/or writing of Blackletter and Sütterlin could be reintroduced into the curricula of German elementary schools. It was not.</p>
    <p>Kapr wrote one of the most extensive histories and analyses of Blackletter type in the German language, <em>Fraktur</em> (Mainz: 1993).</p>
