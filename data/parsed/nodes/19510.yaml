  - id: 120464
    user: 12647
    date: 2006-04-26T13:14:00
    date_raw: 26 Apr 2006 — 1:14pm
    votes: null
    html: <p>I appreciate all the comments.  I will definitely work on the proportions, I agree with that.  We decided to change the spelling in order to give it our own definition.  Brotherhood is used in so many places and contexts.  We wanted to set ourselves apart a bit.  The type isn't nearly done.  We liked the symmetry.  The two figures share heads/thoughts, almost become one.  And actually together, they do make one symbol.  An equal amount of people saw the two figures facing each other as they did facing apart. Most people saw the umlaut U before they even saw two figures though.</p>
