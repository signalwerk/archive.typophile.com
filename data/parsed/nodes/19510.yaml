  html: <p>I've been working with the logo for my own design company and as all designers know these things are rarely completely finished.  The company is pronounced like brotherhood and is made up of real brothers and brothers from different mothers. I haven't settled a typeface yet, I've been using amerika sans.  The icon is simple and works off the ulauted U. I am having a bit of trouble with the word design. Let me know what you all think.</p><div class="imageWrap"><img src="http://typophile.com/files/bhud_logo.jpg"></div><p></p>
