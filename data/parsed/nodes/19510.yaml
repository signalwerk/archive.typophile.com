      <p>I think the proportions between the mark and the type need to be worked out a little more, and I think the mark is a bit too large. The tracked out "d e s i g n", I think needs to go or be re-worked, this sort of type configuration has been done many times but I think it works better with a longer word that does not have to be tracked out this much. I think the typeface can work but perhaps carry over some of the thick and thin relationships as seen in the "u" and other letters into the mark so that its less monotone in weight.</p>
      <p>Perhaps try reducing the size of the mark and maybe something a little more assymetric and its arrangement may turn out a more dynamic.</p>
      <p>I don't post that often, and I am just a student; There are some people here that I am sure could give you a much more detaled critique but I hope this is somewhat helpful!</p>
