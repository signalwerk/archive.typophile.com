    <p>hello everyone.<br>
    here is something i have been working on lately. it is inspired by italian futuristic type (not to say fascist one!).<br>
    it is really fresh, so no time to make proper kerning. hpowever, some ligatures are already here. i am aware there are similar typefaces around, but i think this still has some potential &amp; autonom character.<br>
    what do you think?</p>
