    html: |-
      <p>/R/ thing...</p>
      <p>1. It needs a bit of counter narrowing (compared to /P/ it looks wider.<br>
      2. Tail seems too narrow for the wider top making the whole glyph unstable. I'd widen it a bit.</p>
      <p>Since these two things are related maybe one of them will improve the shape of this glyph so don't think you have to change both aspects. Try narrowing counter first then focus on tail.</p>
