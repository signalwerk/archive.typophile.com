    html: |-
      <p>I second Trevor. Upper-case are unpredictably randomly wide, lower-case are all predictably wide as any proportional font face. There should be two fonts in this family. The unpredictable one and the usual readable face.</p>
      <p>One more thing. I think you should finish lower case because it looks promising.</p>
      <p>P.S. I especially like your question mark. Nice details.</p>
