    html: <p>Hehehe, this kind of request always takes me back to the discussion I had with <a href="/wiki/Nick%20Cooke" class="freelinking" rel="nofollow">Nick Cooke</a> of <a href="/wiki/GType" class="freelinking" rel="nofollow">GType</a> fame. As he never intended it to be, Nick was quite surprised when I told him there was an uncanny similarity between his delicious brush script <a href="http://www.identifont.com/show?4Y0" rel="nofollow">Gizmo</a> and Korean cursive calligraphy. If you want to go Zen without being too obviously Asian, this is the way to go. ;^)</p>
