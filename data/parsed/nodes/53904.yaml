    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Handwriting 2_5361.jpg"></div><p></p>
    <p>Today is National Handwriting Day in commemoration of John Hancock, the first person to sign the Declaration of Independence. This special day was established to promote the fine art of handwriting. <a href="/wiki/www.monotypeimaging.com%20" class="freelinking" rel="nofollow"> Monotype Imaging</a> has provided Typophile with examples of <a class="freelinking external" href="http://msg1svc.net/colov/155227/62/25130/5798/0/H/jegf.html " rel="nofollow"> Handwriting Day Fonts</a> that add a personal, handwritten quality to a variety of projects. The <a class="freelinking external" href="http://msg1svc.net/colov/155227/62/25130/5798/0/H/jegf.html " rel="nofollow"> Handwriting Value Pack</a> found on <a href="/wiki/www.fonts.com%20" class="freelinking" rel="nofollow"> Fonts.com</a> provides five great fonts that deliver the look and feel of handwriting designs. </p>
    <p>Handwriting has inspired some great formal script typeface designs including several<a class="freelinking external" href="http://msg1svc.net/colov/155227/53/25130/5807/0/H/jegf.html " rel="nofollow"> Inaugural Invitation Fonts</a>. For example, the <a class="freelinking external" href="http://www.nytimes.com/2008/12/21/nyregion/thecity/21prin.html " rel="nofollow"> invitations</a> to the January 20th presidential inauguration, which while hand engraved on copperplate, were based on modified versions of two Linotype typefaces: The   <a class="freelinking external" href="http://msg1svc.net/colov/155227/55/25130/5809/0/H/jegf.html " rel="nofollow"> Shelley™ Allegro</a> and the <a class="freelinking external" href="http://msg1svc.net/colov/155227/51/25130/5805/0/H/jegf.html " rel="nofollow"> Kuenstler™ </a> fonts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Inauguration 2_5434.jpg"></div><p></p>
    <p>Designed by <a class="freelinking external" href="http://www.monotypeimaging.com/ProductsServices/TypeDesignerShowcase/MatthewCarter/" rel="nofollow"> Matthew Carter</a> for Linotype in 1972, the<a class="freelinking external" href="http://msg1svc.net/colov/155227/55/25130/5809/0/H/jegf.html " rel="nofollow"> Shelley™ Allegro</a> font is a formal script design that can bring elegance not only to invitations, diplomas, or greeting cards, but it also works equally as well in display applications such as packaging or advertising. Based on the traditional English copperplate scripts, the<a href="/wiki/%5B%5Bhttp%3A/%252Fmsg1svc.net/colov/155227/51/25130/5805/0/H/jegf.html%20" class="freelinking" rel="nofollow"> Kuenstler™</a> font   is another formal script and features a small x-height and fine hairlines.</p>
