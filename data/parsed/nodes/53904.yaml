    <p>Designed by <a class="freelinking external link-external" href="http://www.monotypeimaging.com/ProductsServices/TypeDesignerShowcase/MatthewCarter/" rel="nofollow"> Matthew Carter</a> for Linotype in 1972, the<a class="freelinking external link-external" href="http://msg1svc.net/colov/155227/55/25130/5809/0/H/jegf.html " rel="nofollow"> Shelley™ Allegro</a> font is a formal script design that can bring elegance not only to invitations, diplomas, or greeting cards, but it also works equally as well in display applications such as packaging or advertising. Based on the traditional English copperplate scripts, the<a href="http://msg1svc.net/colov/155227/51/25130/5805/0/H/jegf.html" class="freelinking link-external" rel="nofollow"> Kuenstler™</a> font   is another formal script and features a small x-height and fine hairlines.</p>
