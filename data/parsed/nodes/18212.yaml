      <p>And I counter-retort: Dictionaries are sprawling, decades-long projects and often include entries that are out of date. They attempt to describe (not PREscribe) the uses of various lexical items. You have a "Webster's" that says "to found" is "current in all regions of the U.S." Guess what! Your Webster's is WRONG. IT IS INCORRECT. I've lived in several regions of the U.S.; it's never come up in any conversation I recall, nor, for that matter, in any book I've read (and please don't challenge my literacy on that count, thank you very much).</p>
      <p>Moreover, if you'd taken your courses in linguistics, you'd know that texts sometimes to use "metadiscourse" to explain what they are doing with their own words. That is PRECISELY WHY your Webster's provides a clarification of how they are using "archaic" and "obsolete"-- in common discourse, we don't use them quite the way Webster's does. And that is FINE. As any linguist would tell you.</p>
      <p>Now, back to the matter at hand: you posed a question. You got some responses from people TRYING TO ASSIST YOU. And you hurled an insult instead of gratitude, simply because their answers somehow confounded your preconceived notion of what you'd expect to learn. That, again, is BAD MANNERS. And, for your own sake, it's impractical, because it simply results in people responding as I am now: not with help, but with rants that amount to: bite me. This cockamamie politics of etymology would perhaps impress a third-rate 19th-century philologist but does absolutely nothing for me.</p>
