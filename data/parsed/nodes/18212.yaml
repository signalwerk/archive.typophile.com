    html: <p>Uli, the verb will not often be used in its simple transitive form because it applies ambiguously to the sequence of processes involved in making type. The normal word for the pouring of metal into matrices is casting. But Updike writes of "type-founding" (PT 2nd ed II.247), so does Goudy (at the very start of Typologia), and a search for "type-founding" gives lots more references.</p>
