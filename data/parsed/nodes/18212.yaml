    <p>While it is easy to find attestable quotations for the use of the nouns "type foundry, foundry type, type founder, type founding, etc.", it seems to me that the verb "to found" is a ghost word in modern English dictionaries.</p>
    <p>Does anyone know whether the English verb "to found" included in almost all modern British and American dictionaries WITHOUT the caveat "dated, archaic, etc." and usually defined as "to melt lead and pour into a mold; to cast foundry type, etc." has ever been used during the past two centuries?</p>
    <p>Can anyone supply attested quotations for the verb "to found" from any book on or by type-foundries published during the past 200 years?</p>
