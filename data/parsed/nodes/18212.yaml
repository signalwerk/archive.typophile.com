      <p>From the online Oxford Dictionary which comes installed with OS X:</p>
      <p>----</p>
      <p><strong>found</strong> 2 verb [ trans. ] </p>
      <p>1 establish or originate (an institution or organization), esp. by providing an endowment : <em>the monastery was founded in 1665</em> | [as adj. ] ( <strong>founding</strong>) <em>the three founding partners.</em><br>
      • plan and begin the building of (a town or colony). </p>
      <p>2 (usu. <strong>be founded on/upon</strong>) construct or base (a principle or other abstract thing) according to a particular principle or grounds : <em>a society founded on the highest principles of religion and education. </em><br>
      • (of a thing) serve as a basis for : <em>the company's fortunes are founded on its minerals business. </em></p>
      <p>ORIGIN Middle English : from Old French <strong><em>fonder</em></strong>, from Latin <strong><em>fundare</em></strong>, from <strong><em>fundus ‘bottom, base.’ </em></strong></p>
      <p><strong>found</strong> 3 verb [ trans. ] </p>
      <p>melt and mold (metal).<br>
      • fuse (materials) to make glass.<br>
      • make (an article) by melting and molding metal. </p>
      <p>ORIGIN early 16th cent. : from French <strong><em>fondre</em></strong>, from Latin <strong><em>fundere ‘melt, pour.’</em></strong></p>
      <p>----</p>
      <p>Nothing about it being an archaic word, although these are the 2nd and 3rd senses--the first being found as in "I found a penny!" (although you could mean sense 3 in this case).</p>
