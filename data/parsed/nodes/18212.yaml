      <p>When I started my font publishing business (aka "foundry") in 1999, I tried hard to think up a clever name like "Device" "Sysops" or "Virus", but being the vain unimaginative fellow I am, settled on ShinnType. The full legal name is Shinn Type Foundry Inc., which is in my distributor contracts, so some of them end up billing (now there's an old printing term I'm perpetuating) me as "Shinn Type Foundry", although it's really only appropriate for legal documents, which tend to be somewhat archaic.</p>
      <p>I never found fonts. For the same reason that although I scroll when I surf, it's pages that I look at, and I never get my feet wet.</p>
      <p>There is one frequent contemporary usage of "found" as a verb, as a past participle relating to the establishment of a business. This archaic usage has persisted because of the tag-line that indicates a comapany is no fly-by-night outfit, and "founded in 1999" is a permanent statement.</p>
