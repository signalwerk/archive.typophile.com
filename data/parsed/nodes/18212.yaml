      <p>Very few Typophile members (including type designers) have experience with actual type founding. Not all Americans who are knowledgeable about the history typefounding are Typophile members.</p>
      <p>I can tell you that the verb "to found" is not in common usage among contemporary type designers, even though it is common to speak of "digital type foundries," a usage which is simply metaphorical. Nowadays, you "design" or "develop" or "generate" a font, you don't found it; there is no molten metal involved anymore. If "to found" is not archaic yet, it is on its way, at least in regards to type.</p>
