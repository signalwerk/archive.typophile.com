      <p>&gt; From the online Oxford Dictionary which comes installed with OS X:</p>
      <p>The great 20-volume Oxford English Dictionary has this attested quotation:</p>
      <p>1672 Marvell Reh. Transp. i. 6:<br>
      "Lead, when moulded into Bullets, is not so mortal as when *founded* into Letters!"</p>
      <p>Here *founded* was definitely used in the sense of "to cast, to melt"</p>
      <p>But the question is whether "to found" (meaning: to cast) was still used in the centuries after 1672. Any later quotations from any books on typefoundries, typesetting etc. would be appreciated.</p>
