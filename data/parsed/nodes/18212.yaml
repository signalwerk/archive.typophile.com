      <p>&gt; Uli, you need a course in sociolinguistics. And manners.</p>
      <p>I retort:</p>
      <p>jlg4104, you need a course in linguistics. And in lexicography.</p>
      <p>The current 11th edition of "Webster's Collegiate Dictionary" and also "Webster's Third New International Dictionary" use two temporal labels:</p>
      <p>- "obsolete" means that there is no evidence of use since 1755.<br>
      - "archaic" means that a word is found today only sporadically.</p>
      <p>Then Webster's defines:</p>
      <p>"Words current in all regions of the U.S. have no label."</p>
      <p>The verb "to found (= to melt etc.)" has no label.</p>
      <p>So, "to found" is a verb  "current in all regions of the U.S.".</p>
      <p>It is neither obsolete nor archaic for Webster's lexicographers.</p>
      <p>But there is not ONE American at Typophile who can give an attestable quotation for this verb which is "current in all regions of the U.S."</p>
