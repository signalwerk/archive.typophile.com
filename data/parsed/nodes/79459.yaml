      <p>Because of the time period it may be a long shot that this was ever digitized, if it was even a typeface and not just a custom logo. I have a suggestion that may give a similar result: use <a href="http://new.myfonts.com/fonts/parachute/pf-fusion-sans-pro/" rel="nofollow">PF Fusion Sans Black</a>, and make the W from overlapping U's.</p>
      <p>- Mike Yanega</p>
