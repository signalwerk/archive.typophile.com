    html: |-
      <p>For one thing I think the S is wrong, and the font does not show an alternate W. Sometimes film or metal versions did have alternates that were not digitized. There are so many sans serif typefaces, especially among film types anything might have been possible, but the books I have do not show Grotesque No.9 with this W.</p>
      <p>- Mike Yanega</p>
