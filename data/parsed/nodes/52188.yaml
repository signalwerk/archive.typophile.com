      <p>The irony is that the first paragraph refutes the second. </p>
      <p>Nobody can fully capture a piece of art or craft by words alone, of course. But that is really a straw man. For words can often shed light both on the finished product and the process that produced it; and that is all writing about art tries to do. Indeed the first paragraph does give interesting insight into the process of a ship designer.  </p>
      <p>In fact creativity in art, and science and craft share that they are constrained problem-solving processes, and so have a lot in common even though they are in different fields. </p>
      <p>And writing about literature, music, or visual is often delightful.  Some of us even greatly enjoy reading about type--including when Nick Shinn writes about it on Typophile, which fortunately is pretty often :)</p>
    html_clean: |-
