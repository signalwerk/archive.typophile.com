      <p>@Graham: <em>I for one wish, no hope and prey that craftsmanship can once again be elevated to where it once was.</em></p>
      <p>"prey" &gt; pray.</p>
      <p>Careful what you pray for. You're the first to mention "craftsmanship". Isn't this thread about design?</p>
      <p>Did you have a specific time or place in mind for "where it once was" ? It sounds a lot like classical ancient Greeks looking back with starry eyes to their "golden age" and the "silver age" that came after it, then the great fall from grace into the Greek dark age before their reinventing themeselves in classical form.</p>
      <p>In other words the Golden Olden Days syndrome in which design (or craft) was always better in the recent past than it is today. In some instances this way of viewing history is proven valid, and in ass many other instances it turns out to be a load of wishful romanticism and nothing more.</p>
      <p>I'm curious about what you mean by "where it once was", since that implies a certain time &amp; place.</p>
      <p><em>We have many fine craftsmen and women in modern type design and typography, but alas their number are few compared to the masses.</em></p>
      <p>Sounds like a sweeping and generalized view based on a personal impression of the world. Do you have any figures or statistical studies to back it up? Or can you be more sepcific? Are you referring to professional graphic / visual designers versus non-designers (untrained) and other folks who aren't designers by instinct or trade but have the means to design using a computer and software?</p>
      <p>Also, "modern" is a very loosely employed word that can refer to people, places and things ranging in date from the present back to the Italian renaissance of the 15th century. I think the word(s) you really want there are "contemporary" or "present day".</p>
      <p>j a m e s</p>
