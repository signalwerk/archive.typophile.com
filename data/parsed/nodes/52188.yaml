    html: <p>James. Implicit in my 'generalized' remarks following Nick's very fine post is the characteristic 'vagueness' that one may find in cooking recipes for example. The vagueness is not confusion or ambiguity but a recognition that the actual fitting together of the components is up to the individual's perception and experience.</p>
