  html: "<p>I have a number of fonts that I'd like to remove permanently from my computer. (windows XP), <br>these include: <br>Frankin <br>Marlett <br>Microsoft Sans <br>Sydnie <br>Webdings <br>ZWAdobeF <br>ITC American Typewriter <br>Antiaue Olive <br>Banco <br>ITC Bookman <br>Carta <br>BrushScript <br>Adobe Caslon <br>Cooper <br>Eccentric <br>ITC Eras <br>ITC Flora <br>Kaufmann <br>ITC Machine <br>ITC Officina <br>Serpentine <br>Sonata <br>Listho <br>ITC Lubalin <br> <br>these are the worst offenders, there are others. <br>I've tried searching for the files but the system doesnt find them, and have deleted everything except the essentials (Arial, Courier, Verdana, Tahoma) from the Fonts folder in the control panel. <br>Some fonts appear in some applications and not others. Eventually I'd like as few typefaces loaded permanently as possible. <br>Anyone know how to acheive this? <br></p>"
  html_clean: "<p>I have a number of fonts that I'd like to remove permanently from my computer. (windows XP), <br>these include: <br>Frankin <br>Marlett <br>Microsoft Sans <br>Sydnie <br>Webdings <br>ZWAdobeF <br>ITC American Typewriter <br>Antiaue Olive <br>Banco <br>ITC Bookman <br>Carta <br>BrushScript <br>Adobe Caslon <br>Cooper <br>Eccentric <br>ITC Eras <br>ITC Flora <br>Kaufmann <br>ITC Machine <br>ITC Officina <br>Serpentine <br>Sonata <br>Listho <br>ITC Lubalin <br> <br>these are the worst offenders, there are others. <br>I've tried searching for the files but the system doesnt find them, and have deleted everything except the essentials (Arial, Courier, Verdana, Tahoma) from the Fonts folder in the control panel. <br>Some fonts appear in some applications and not others. Eventually I'd like as few typefaces loaded permanently as possible. <br>Anyone know how to acheive this? <br></p>"
