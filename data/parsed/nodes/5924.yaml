    html: <p>Don't delete - these  <br> <br>Franklin Gothic (medium and medium italic)  <br>Marlett  <br>Microsoft Sans  <br> <br>As there are all fonts used by the user interface. Marlett and MicroSS can't easily be deleted as they are 'system file protected'. <br> <br>All of the others, except Webdings are not fonts that come with Windows, so removing them may break other apps (unlikely but possible). <br> <br>Cheers, Si <br> <br> <br>  <br></p>
