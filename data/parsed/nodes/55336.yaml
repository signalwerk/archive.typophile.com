    html: |-
      <p>Tomi, now I feel less special: for the Thessaloniki conference of 2002 (or was it 2004?) Carson canceled, then rescheduled at the last minute, causing a $6000 first class ticket to be bought, then canceled again.* The good news is that Spiekermann and Brody did a superb job filling in - much more satisfying than when I saw Carson speak at... I think it was ATypI99 (where a gaggle of fawning wannabes lined up for an audience afterwards).</p>
      <p>* This type of behavior reinforces my view that on the Art--Design axis Carson is closer to the former. Design is essentially about <em>other people</em>.</p>
      <p>hhp</p>
