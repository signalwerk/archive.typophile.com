    <p></p><div class="imageWrap"><img src="http://typophile.com/files/carson_4605.jpg"></div><br>
    David Carson was a school teacher and pro-surfer before be began his career as a Typographer. His first graphic design book, The End of Print, is the highest selling graphic design book of all time, selling over 200,000 copies and printed in 5 different languages. Carson pushes the limits on both graphic design and typography. He experiments in new ways of communication through his designs and uses a variety of different mediums. He is a very inspirational designer and continues to follow his intuition to drive his work. <p></p>
    <p>Check him out at DavidCarsonDesign.com</p>
