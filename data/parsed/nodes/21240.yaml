      <p>I think you're on the right track by suggesting that this is an existing font that has been modified. It seems very likely that those serif wedges are added on, because they don't even match the strokes they are related to.</p>
      <p>The only distinctive letters are the G and W, so if you can find an uneven sans that matches those two letters, you are about finished.</p>
      <p>I've been looking, and the closest so far in terms of those letters (with flattening) is Ocean Sans from Monotype. Most uneven sans faces I have seen have a G with no 'jaw', and/or a 'chin' that starts at the baseline. </p>
      <p>- Mike Yanega</p>
