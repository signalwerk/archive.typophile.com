    <p>I came across this one ont the Gwand Fashion Competition Website. </p>
    <p><a href="http://www.gwand.ch/" title="http://www.gwand.ch/">http://www.gwand.ch/</a></p>
    <p>It's features are very distinctive ... it's like a 'semi-serif' ... so only half as much serifs than in a normal font, and then it has kind of a Peignot-rhythm going on in its line-widths. Could be custom-drawn but who would cook up something like in the context of creating a Logo? It must be based on a existing design.</p>
