    html: |-
      <p>I agree but still ... I guess it must be some display type ... could also be something found in a 70's Letraset Catalogue, some font obscure enough for not making it into a digitized version. The designers found it to be funky (which it is) and redrew the necessary characters from scan. Similar things happened with Letraset's 'Pinball' font ... I don't think it exists in a commercialised version, but it started popping up as a post 'Dot-Matrix' option, it looked less digitized (which was more of a 90's sensibility). It got used for Olafur Eliasson's Weather project at Tate Modern. We redrew a version for a book project. I just think this project followed similar lines.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-3_3872.gif"></div><p></p>
