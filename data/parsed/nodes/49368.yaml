    html: |-
      <p>Of course, there's nothing wrong with licensing the real typeface. However, doing a Google search for</p>
      <p>mgopen site:typophile.com</p>
      <p>will bring up a typophile node that mentions the mgopen fonts, which include a font similar to Optima. I haven't ever really looked closely at the quality of MGOpen Cosmetica, but I believe it is more ethical to go with an open source option than to go with downloading a pirated version of Optima.</p>
      <p>For non-commercial use, there is also a URW version of Optima in the fonts released with GhostPCL:</p>
      <p><a class="freelinking external" href="http://www.artifex.com/downloads/" rel="nofollow">http://www.artifex.com/downloads/</a></p>
      <p>Here are some other Google searches you can perform to find Typophile information on good "free" fonts, in all the meanings of that word.  I suggest the google searches because some of the internal typophile links to its own wiki pages seem to be out of date.</p>
      <p>good libre fonts site:typophile.com</p>
      <p>faq free site:typophile.com</p>
      <p>st</p>
