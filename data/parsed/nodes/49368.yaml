    html: |-
      <p><cite>The type designer may think otherwise. In downloading at least the thief shows that they value and respect the work enough to pilfer it, rather than going with a forgery that someone wasn’t even paid to produce.</cite></p>
      <p>My understanding of the fonts from URW and from the MGOpen collection was that they were typefaces released under fairly "free" terms from reputable sources. I apologize if it wasn't clear that I was limiting my comments to these particular options in this particular case.</p>
      <p>In general, I know that the question of when a look-alike typeface is a forgery and when it is a legitimate copy done by a legitimate foundry is one that has come up here before, and I certainly don't have enough knowledge to be able to add anything to that debate. I'm also not suggesting that being licensed as open-source is more important than quality of the typeface or whether someone was appropriately paid for their work.</p>
      <p>However, in this case I did try to do reasonable research into the origins of these typefaces. If my understanding of these particular typefaces is incorrect, I would certainly like to know it. When a good typeface that is created in an ethical manner is given as a gift in this way, I do feel it's appropriate to respect that gift by letting others know about it.</p>
      <p>st</p>
