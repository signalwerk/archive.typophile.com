  html: |-
    <p>Hi!</p>
    <p>I'm writing a small essay about the age of enlightenment and would like to know which fonts that are used on this page: <a href="http://en.wikipedia.org/wiki/File:KantWasIstAufkl%C3%A4rung.png" title="http://en.wikipedia.org/wiki/File:KantWasIstAufkl%C3%A4rung.png">http://en.wikipedia.org/wiki/File:KantWasIstAufkl%C3%A4rung.png</a></p>
    <p>Note that "sapere aude!" (ninth line) is written in a different font than the rest.</p>
    <p>Help is much appreciated!</p>
    <p>Best regards,<br>
    Johan</p>
