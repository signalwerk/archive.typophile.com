  html: |-
    <p>Dear Adobe, </p>
    <p>Congratulations on your sweet purchase! Now that the merger is complete, please be kind to <a href="http://www.macromedia.com">Macromedia</a>. </p>
    <p>Fireworks is 100x better than ImageReady. So make sure you know which limb to amputate before the anesthesiologist arrives.</p>
    <p>Oh, and in case it wasn’t clear, Golive is teh suk. Dreamweaver is the good one… Chop accordingly.</p>
    <p>Keep Photoshop for photo editing and Fireworks for web production. You put the PHOTO in Photoshop, now don’t make it EVERYTHINGshop.</p>
    <p>Don’t try to turn SWF into a giant PDF engine. PDF is cool and SWF is cool, but for different reasons. If the twain meet, just make sure it’s a good idea first, okay.</p>
    <p>Cheers, and many happy ROIs!</p>
    <p></p><div class="imageWrap"><img src="files/macrodobia.png"></div><p></p>
