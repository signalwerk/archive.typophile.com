    <p>Can somebody tell me what fonts are used in this banner from iStockPhoto:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/iStockPhoto fonts_5221.jpg"></div><p></p>
    <p>I'm mostly interested in the font(s) of the "only" and "on iStock" parts, but the font of "Find something extra special..." would be interesting, too.</p>
    <p>Even if you shouldn't know exactly what the fonts are called, I'd be interested in similar fonts, too.</p>
    <p>Thanks!</p>
