    <p>I'm a university student studying design ... The quarter's project for a class called "Communication Design" is to investigate the day of our birth through research, interviews, etc ... we're to categorize the information into three categories (local, national, and global) and communicate our findings graphically in three posters.</p>
    <p>This is my poster for LOCAL (right now its tabloid size ... will be blown up later) ... love to hear suggestions feedback blabla ..</p>
    <p><a href="http://users.dma.ucla.edu/~georgebrower/local.pdf" title="http://users.dma.ucla.edu/~georgebrower/local.pdf">http://users.dma.ucla.edu/~georgebrower/local.pdf</a></p>
