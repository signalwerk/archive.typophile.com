    html: |-
      <p>I think the layout is really great and I love the "route" - you can't get much more local than that, I think it was ingenious.</p>
      <p>The date the way it is behind all the text is really throwing me. By relying on the date as the background, I don't know how you would make the posters look materially different for the local, national, and global from a decently far perspective.</p>
      <p>The body copy is just a little too tiny for me as well. Maybe that was what you went for, an impression of something and then information that you would "uncover" as you got closer? Not entirely sure there.</p>
      <p>Also, and I mention this because it was an AMAZING piece of advice from an old professor that I defied once, much to my ensuing pain: always construct your mechanicals at final size or bigger, if at all possible. If you are blowing your poster up it can change some of your weighting or proportions visually and then you have to rework which can get aggravating.</p>
      <p>Good start!</p>
