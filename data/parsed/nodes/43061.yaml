      <p>You are on top of it. There are some good threads on this subject where all the basic opinions are outlined.</p>
      <p>I feel it all depends on the publication and the type. Some faces have small caps of varying height. Some people will set a three letter acronym in SC. What face are you using and what is the range of possible usage in the publication?</p>
      <p><a href="http://www.typophile.com/node/12543" title="http://www.typophile.com/node/12543">http://www.typophile.com/node/12543</a></p>
