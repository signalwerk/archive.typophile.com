    <p>Was encouraged to post this here, so here goes:</p>
    <p>What rules/guidelines do you subscribe to in regards to proper use of small caps? For instance, I noticed that the Atlantic Monthly uses full caps for three letters or fewer; small caps for four letters or more.</p>
    <p>Does the use of italics change anything? (Yes, I unfortunately need to set something in caps *and* italics. Even in small caps it looks a bit funky, but a lot less funky than in full caps.)</p>
    <p>Which, I reckon, is the final rule: which looks better?</p>
    <p>But, lacking a style rule (or at least I couldn't find anything relevant in the Chicago Manual of Style), I thought I'd solicit opinions here.</p>
    <p>Thanks in advance.<br>
    __</p>
    <p>David</p>
