      <p>Thanks for the link to that thread. I did do a search before I posted, for what it's worth, although I admit I was a wee bit impatient sorting through it.</p>
      <p>Anyway, face is LTC Deepdene. It's actually in the acknowledgments page of a poetry book, so it's small-ish (9 pt.) and there aren't all caps/small caps occurrences anywhere else in the book.</p>
      <p>That said, on the same page is a three-letter all-cap, and for that I'm keeping full caps. For the longer word (seven character) I'm 99% sold on small caps, with 10/1000-em tracking (which is probably conservatively tight, but it works--a reminder here that the text is set in italics, as that's proportionately relevant).</p>
      <p>Granted, too, it is, in effect, "fine print," but thought it was as good a time as any to solicit opinions.<br>
      __</p>
      <p>David</p>
