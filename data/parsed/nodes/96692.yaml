    html: <p>What amazes me is the gender difference.  It seems odd the women would be less affected by the type difference.  I wonder if this is some kind of hunter-gatherer thing that would make visual acuity of shapes more important for hunters (and hunted)?  Those who survived best were those that could best distinguish friend from foe or food from foe.</p>
