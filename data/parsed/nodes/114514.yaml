    <p>Hello,</p>
    <p>I need a free software tool for Windows XP to edit the family name for some OT fonts and TTX 2.4 seems the ideal candidate for this job.</p>
    <p>I've just downloaded the sources file of TTX 2.4 from sourceforge, but installing from source is not so easy...</p>
    <p>Luckily, according to the install.txt file in the Doc folder, "for Windows and MacOS there are easy-to-use TTX installers". So where can I download these installers?</p>
    <p>Thank you!</p>
    <p>Manosk</p>
