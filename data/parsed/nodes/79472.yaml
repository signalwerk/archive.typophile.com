    <p><a href="/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a> designed Verdana and its serifed companion, <a href="/node/14719" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Georgia</a>, for <a href="http://Microsoft" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Microsoft</a> in 1996. Designed as a screen font, Carter began his design with bitmaps and created outlines to match. The fonts were <a href="/node/13964" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">hand-hinted</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Tom%20Rickner" title="Create node &quot;Tom Rickner&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tom Rickner</a>.</p>
