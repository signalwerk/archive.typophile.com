    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Verdana</strong></p>
    <p><img src="http://upload.wikimedia.org/wikipedia/commons/thumb/0/01/VerdanaSpecimen.svg/198px-VerdanaSpecimen.svg.png" img=""></p>
    <p><a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a> designed Verdana and its serifed companion, <a href="/wiki/Georgia" class="freelinking" rel="nofollow">Georgia</a>, for <a class="freelinking external" href="http://www.microsoft.com/typography/fonts/family.aspx?FID=1" rel="nofollow">Microsoft</a> in 1996. Designed as a screen font, Carter began his design with bitmaps and created outlines to match. The fonts were <a href="/wiki/hinting" class="freelinking" rel="nofollow">hand-hinted</a> by <a href="/wiki/Tom%20Rickner" class="freelinking" rel="nofollow">Tom Rickner</a>.</p>
    <p><a class="freelinking external" href="http://www.will-harris.com/msfont-hint.htm" rel="nofollow">Interview with Tom Rickner</a></p>
