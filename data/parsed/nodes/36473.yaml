      <p>In their link <a href="http://www.unicode.org/standard/standard.html" rel="nofollow"><strong>About the Unicode Standard</strong></a>, the <a href="http://www.unicode.org/" rel="nofollow"><strong>Unicode consortium</strong></a> states that the entire content of the Unicode Standard including the Character Code Charts is available online. Here are their online <a href="http://www.unicode.org/charts/" rel="nofollow"><strong>Unicode Character Code Charts</strong></a> and here is the <a href="http://www.unicode.org/charts/PDF/U0100.pdf" rel="nofollow"><strong>Latin Extended-A</strong></a> chart. And here is a grab of the glyphs for U+0162 and U+0163 from the Latin-Extended-A chart provided by the Consortium:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fromlatina_4892.gif"></div><p></p>
  - id: 223140
