    html: |-
      <p>The 'true' Romanian forms for these characters were a recent addition to Unicode... </p>
      <p>U+0218    Ș    LATIN CAPITAL LETTER S WITH COMMA BELOW<br>
      U+0219    ș    LATIN SMALL LETTER S WITH COMMA BELOW<br>
      U+021a    Ț    LATIN CAPITAL LETTER T WITH COMMA BELOW<br>
      U+021b    ț    LATIN SMALL LETTER T WITH COMMA BELOW</p>
      <p>So older fonts, older keyboard layouts and older apps may only support or expect the legacy code-points, that were 'shared' (uneasily) with Turkish - +015e, U+015f, U+0162, U+0163 </p>
      <p>Cheers, Si</p>
    html_clean: |-
      <p>The 'true' Romanian forms for these characters were a recent addition to Unicode... </p>
      <p>U+0218    Ș    LATIN CAPITAL LETTER S WITH COMMA BELOW<br>
      U+0219    ș    LATIN SMALL LETTER S WITH COMMA BELOW<br>
      U+021a    Ț    LATIN CAPITAL LETTER T WITH COMMA BELOW<br>
      U+021b    ț    LATIN SMALL LETTER T WITH COMMA BELOW</p>
      <p>So older fonts, older keyboard layouts and older apps may only support or expect the legacy code-points, that were 'shared' (uneasily) with Turkish - +015e, U+015f, U+0162, U+0163 </p>
      <p>Cheers, Si</p>
