      <p>Here is something else that does not quite fit the world I am used to. It comes from <a href="http://www.unicode.org/charts/PDF/U0100.pdf" rel="nofollow"><strong>this chart</strong></a> of Unicode's standard:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/gcedilla_6174.gif"></div><br>
      The name mentions a cedilla, and the definition in BNF style says that it is built with a G and a character 0327 which is indeed a cedilla, yet the Gcedilla they display is with a comma. I must confess that I don't like this. This obviously confirms Miguel's comment. [edit] about my too strict interpretion of what looked to me like a BNF definition. The same holds for g, K, k, L, l, N, n, R, and r. Only S, s, T and t are shown with a cedilla in that chart.<p></p>
      <p>Michel</p>
