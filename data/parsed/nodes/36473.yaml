      <p>I tried other things and here is what I found. The characters whose glyphs are<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tT_4667.gif"></div><br>
      are in 0x0162 and 0x21A for the majuscule,  0x0163 and 0x021B for the minuscule and here is what they are named by Adobe in Myriad Pro:<br>
      <code><br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni0162 : Tcommaaccent<br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni0163 : tcommaaccent<br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni021A : uni021A<br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni021B : uni021B<br>
      </code><p></p>
      <p>It is the characters in 0x0162 and and 0x0163 that are not recognized by the Mac. If we rename the above four characters as follows:<br>
      <code><br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni0162 : Tcedilla<br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni0163 : tcedilla<br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni021A : Tcommaaccent<br>
      &nbsp;&nbsp;&nbsp;&nbsp; uni021B : tcommaaccent<br>
      </code></p>
      <p>then all the characters in the resulting font are recognized by the Mac, be they called *commaaccent or *cedilla. So it is not the names that are causing a problem but what they are naming. Is Tcommaaccent uni0162 or is it uni021A? As pointed out by Adam, in a quite different style, one way to lift the disagreement is not to use the names Tcommaaccent and tcommaaccent and use uni0162 and uni0163, on which everyone agrees.</p>
      <p>Michel</p>
      <p>PS. Notice that if we execute the command<br>
      <code><br>
      curl -s <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" title="http://www.unicode.org/Public/UNIDATA/NamesList.txt">http://www.unicode.org/Public/UNIDATA/NamesList.txt</a> | egrep '^0162|^0163|^021A|^021B'<br>
      </code></p>
      <p>to get the names in Unicode's NamesList we get this:<br>
      <code><br>
      &nbsp;&nbsp;&nbsp;&nbsp;0162    LATIN CAPITAL LETTER T WITH CEDILLA *<br>
      &nbsp;&nbsp;&nbsp;&nbsp;0163    LATIN SMALL LETTER T WITH CEDILLA *<br>
      &nbsp;&nbsp;&nbsp;&nbsp;021A    LATIN CAPITAL LETTER T WITH COMMA BELOW *<br>
      &nbsp;&nbsp;&nbsp;&nbsp;021B    LATIN SMALL LETTER T WITH COMMA BELOW *<br>
      </code></p>
      <p>and those are the names displayed by the Macintosh character palette.</p>
    html_clean: |-
