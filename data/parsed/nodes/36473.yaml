    user_name: Miguel Sousa
    user_path: null
    date_raw: 29 Aug 2007 — 12:16pm
    date: 2007-08-29T12:16:00
    votes: null
    html: |-
      <p>Thomas also points out that "they may not have always recognized the glyph names as defined in Adobe’s glyph naming standards", which seems to be true given the fact that the Adobe Glyph List For New Fonts v1.6 associates the name Tcommaaccent to codepoint 0162, and tcommaaccent to codepoint 0163:<br>
      <a href="http://partners.adobe.com/public/developer/en/opentype/aglfn13.txt" title="http://partners.adobe.com/public/developer/en/opentype/aglfn13.txt">http://partners.adobe.com/public/developer/en/opentype/aglfn13.txt</a></p>
      <p>It's also worth mentioning that the history of these two characters has been eventful, judging by the notes on that same file:</p>
      <p>#   1.1  [17 April 2003]  Renamed [Tt]cedilla back to [Tt]commaaccent:<br>
      #<br>
      #   1.0  [31 Jan 2003]  Original version. Derived from the AGLv1.2 by:<br>
      #	-  removing the PUA area codes<br>
      #	- removing duplicate Unicode mappings, and<br>
      #	- renaming tcommaaccent to tcedilla and Tcommaaccent to Tcedilla</p>
