      <p>There are several issues that come together here: </p>
      <p>1. Mac OS X ignores the glyph-to-Unicode mapping provided in the "cmap" table of OpenType PS (CFF/.otf) fonts, while it uses it for OpenType TT (.ttf) fonts. For OpenType PS fonts, Mac OS X uses the glyph-to-glyphname mapping provided in the font and then maps the glyphnames to Unicodes itself. </p>
      <p>2. Unfortunately, Mac OS X does not recognize the "*commaaccent" glyphnames that are defined by Adobe for Romanian and Baltic languages (such as Tcommaaccent, Rcommaaccent, Kcommaaccent, Ncommaaccent) but instead only recognizes the "*cedilla" names (Tcedilla, Rcedilla, Kcedilla, Ncedilla) or the "uni****" names (uni0162, uni0156, uni0136, uni0145). This means that Mac OS X will fail to recognize the glyphs Tcommaaccent, Rcommaaccent, Kcommaaccent, Ncommaaccent and map them to their respective Unicodes.  </p>
      <p>3. On top of that, there is another confusion. Originally, the Unicode consortium defines the codepoints U+015E, U+015F, U+0162, U+0163 as suitable for both Turkish and Romanian, and defined them as containing the cedilla accent. Turkish indeed uses cedilla in U+015E, U+015F but does not make any use of U+0162, U+0163. But the Romanian normalization delegation raised an objection towards those mappings because in the Romanian typographic tradition, glyphs with a commaaccent are preferred. So the Unicode consortium added the mappings U+0218, U+0219, U+021A, U+021B, and defined them as containing a commaaccent. </p>
      <p>4. Unfortunately, many of the Romanian locale definitions used in operating systems still use the "old" mappings rather than the "new" mappings. So it is common practice that Romanian texts contain U+015E, U+015F, U+0162, U+0163 rather than U+0218, U+0219, U+021A, U+021B. </p>
      <p>5. Nonetheless, the preference that the Romanian characters should be rendered using a commaaccent still applies. Since a "T/t with cedilla" does not seem to be used in any living language, many type designers have decided to draw U+0162, U+0163 as a "T/t with commaaccent". So the glyphs for U+0162, U+0163 and for U+021A, U+021B are identical in many fonts, and that's how it should be. </p>
      <p>6. Since the U+015E, U+015F are used as "S/s with cedilla" in Turkish but are also used in "old" locales for Romanian, many OpenType fonts now contain a "locl" glyph substitution that replaces the glyphs Scedilla (U+015E), scedilla (U+015F) with the glyphs uni0218, uni0219 in Romanian context. This is not a very elegant solution but seems a pragmatic one. </p>
      <p>To resolve the problem, Apple should do two things: </p>
      <p>a) change the Romanian locale/keyboard layout definition so that it no longer uses the U+015E, U+015F, U+0162, U+0163 codepoints but instead uses U+0218, U+0219, U+021A, U+021B. </p>
      <p>b) change the manner how it treats OpenType PS (.otf) fonts in that it no longer relies on glyphnames to build a glyph-to-Unicode mapping but instead, directly uses the "cmap" table included in the font. </p>
      <p>To avoid problems with current Mac OS X versions, font developers should do three things: </p>
      <p>a) do not use the "*commaaccent" glyphnames but use the "uni****" glyphnames instead</p>
      <p>b) draw the "Scedilla" and "scedilla" glyphs with a cedilla, and draw the "uni0162", "uni0163", "uni0218", "uni0219", "uni021A", "uni021B" glyphs with a commaaccent ("commaaccent" does not mean that the accent has to look 100% like a small comma, but it should be disconnected from the base letter, should be thicker at the top and thinner at the bottom)</p>
      <p>c) provide the following OpenType feature definition code in their fonts: </p>
      <p><code>feature locl { # Localized Forms<br>
      language MOL; # Moldavian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
      language ROM; # Romanian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
      } locl;</code></p>
      <p>Optionally, the type designer could provide stylistic alternates "uni0162.cedilla" and "uni1063.cedilla" that indeed would be "T/t with cedilla", suitable for Semitic studies and similar applications. These could be available through the "ss**" and "salt" OpenType layout features. </p>
      <p>Should the type designers feel that he desperately needs to to draw the "uni0162", "uni0163" glyphs using a cedilla, they should provide the following OpenType feature definition code in their fonts: </p>
      <p><code>feature locl { # Localized Forms<br>
      language MOL; # Moldavian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
        sub [uni0162 uni0163] by [uni021A uni021B];<br>
      language ROM; # Romanian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
        sub [uni0162 uni0163] by [uni021A uni021B];<br>
      } locl;</code></p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
    html_clean: |-
      <p>There are several issues that come together here: </p>
      <p>1. Mac OS X ignores the glyph-to-Unicode mapping provided in the "cmap" table of OpenType PS (CFF/.otf) fonts, while it uses it for OpenType TT (.ttf) fonts. For OpenType PS fonts, Mac OS X uses the glyph-to-glyphname mapping provided in the font and then maps the glyphnames to Unicodes itself. </p>
      <p>2. Unfortunately, Mac OS X does not recognize the "*commaaccent" glyphnames that are defined by Adobe for Romanian and Baltic languages (such as Tcommaaccent, Rcommaaccent, Kcommaaccent, Ncommaaccent) but instead only recognizes the "*cedilla" names (Tcedilla, Rcedilla, Kcedilla, Ncedilla) or the "uni****" names (uni0162, uni0156, uni0136, uni0145). This means that Mac OS X will fail to recognize the glyphs Tcommaaccent, Rcommaaccent, Kcommaaccent, Ncommaaccent and map them to their respective Unicodes.  </p>
      <p>3. On top of that, there is another confusion. Originally, the Unicode consortium defines the codepoints U+015E, U+015F, U+0162, U+0163 as suitable for both Turkish and Romanian, and defined them as containing the cedilla accent. Turkish indeed uses cedilla in U+015E, U+015F but does not make any use of U+0162, U+0163. But the Romanian normalization delegation raised an objection towards those mappings because in the Romanian typographic tradition, glyphs with a commaaccent are preferred. So the Unicode consortium added the mappings U+0218, U+0219, U+021A, U+021B, and defined them as containing a commaaccent. </p>
      <p>4. Unfortunately, many of the Romanian locale definitions used in operating systems still use the "old" mappings rather than the "new" mappings. So it is common practice that Romanian texts contain U+015E, U+015F, U+0162, U+0163 rather than U+0218, U+0219, U+021A, U+021B. </p>
      <p>5. Nonetheless, the preference that the Romanian characters should be rendered using a commaaccent still applies. Since a "T/t with cedilla" does not seem to be used in any living language, many type designers have decided to draw U+0162, U+0163 as a "T/t with commaaccent". So the glyphs for U+0162, U+0163 and for U+021A, U+021B are identical in many fonts, and that's how it should be. </p>
      <p>6. Since the U+015E, U+015F are used as "S/s with cedilla" in Turkish but are also used in "old" locales for Romanian, many OpenType fonts now contain a "locl" glyph substitution that replaces the glyphs Scedilla (U+015E), scedilla (U+015F) with the glyphs uni0218, uni0219 in Romanian context. This is not a very elegant solution but seems a pragmatic one. </p>
      <p>To resolve the problem, Apple should do two things: </p>
      <p>a) change the Romanian locale/keyboard layout definition so that it no longer uses the U+015E, U+015F, U+0162, U+0163 codepoints but instead uses U+0218, U+0219, U+021A, U+021B. </p>
      <p>b) change the manner how it treats OpenType PS (.otf) fonts in that it no longer relies on glyphnames to build a glyph-to-Unicode mapping but instead, directly uses the "cmap" table included in the font. </p>
      <p>To avoid problems with current Mac OS X versions, font developers should do three things: </p>
      <p>a) do not use the "*commaaccent" glyphnames but use the "uni****" glyphnames instead</p>
      <p>b) draw the "Scedilla" and "scedilla" glyphs with a cedilla, and draw the "uni0162", "uni0163", "uni0218", "uni0219", "uni021A", "uni021B" glyphs with a commaaccent ("commaaccent" does not mean that the accent has to look 100% like a small comma, but it should be disconnected from the base letter, should be thicker at the top and thinner at the bottom)</p>
      <p>c) provide the following OpenType feature definition code in their fonts: </p>
      <p><code>feature locl { # Localized Forms<br>
      language MOL; # Moldavian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
      language ROM; # Romanian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
      } locl;</code></p>
      <p>Optionally, the type designer could provide stylistic alternates "uni0162.cedilla" and "uni1063.cedilla" that indeed would be "T/t with cedilla", suitable for Semitic studies and similar applications. These could be available through the "ss**" and "salt" OpenType layout features. </p>
      <p>Should the type designers feel that he desperately needs to to draw the "uni0162", "uni0163" glyphs using a cedilla, they should provide the following OpenType feature definition code in their fonts: </p>
      <p><code>feature locl { # Localized Forms<br>
      language MOL; # Moldavian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
        sub [uni0162 uni0163] by [uni021A uni021B];<br>
      language ROM; # Romanian<br>
        sub [Scedilla scedilla] by [uni0218 uni0219];<br>
        sub [uni0162 uni0163] by [uni021A uni021B];<br>
      } locl;</code></p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
