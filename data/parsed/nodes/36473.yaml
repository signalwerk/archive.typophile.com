    html: |-
      <p>Pages is an Apple application that is part of the iWork suite :)</p>
      <p>Romanian layouts have been a major problem in the last few years. Pre-Windows Vista keyboards have S and T with a cedilla, not a comma underneath so most applications and documents use the non-stardard Microsoft way. And most Windows fonts, like Arial, Verdana and Times New Roman, don't have the T and S with a cedilla (Microsoft issued an update a couple of months ago, but you have to search for it, it's not in the mainstream Windows Update) and if you write a web page with those letters or the equivalent HTML entities Internet Explorer will display empty squares instead and Firefox will try to "build" the letters.</p>
      <p>It seems that the letters T and S with cedilla are not part of Myriad Pro (or at least they won't show up as regular Myriad Pro letters).</p>
      <p>Thanks for helping me clear things out.</p>
    html_clean: |-
