      <p>The necessary letters are in the fonts.</p>
      <p>I strongly suspect that "acm" is running into a Mac OS issue wherein they are using glyph names to determine encoding, instead of using the encoding built into the font, and then on top of that they may not have always recognized the glyph names as defined in Adobe's glyph naming standards, in favor of their own schemes. The latter problem is likely better in newer versions of Mac OS, even if the former is not.</p>
      <p>What version of OS X are you running, acm?</p>
      <p>Regards,</p>
      <p>T</p>
