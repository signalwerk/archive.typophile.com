    votes: null
    html: |-
      <p>The same Latin-Extended-A chart also points out that "a glyph variant with comma below is preferred for Romanian":<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/0162_0163_6174.png"></div><p></p>
      <p>And that is also the opinion of two esteemed expert residents:<br>
      <a href="http://www.typophile.com/node/2764#comment-22015" title="http://www.typophile.com/node/2764#comment-22015">http://www.typophile.com/node/2764#comment-22015</a><br>
      <a href="http://www.typophile.com/node/3970#comment-29637" title="http://www.typophile.com/node/3970#comment-29637">http://www.typophile.com/node/3970#comment-29637</a></p>
  - id: 223229
