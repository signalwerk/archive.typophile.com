    date: 2007-08-29T07:19:00
    votes: null
    html: |-
      <p>Of course, and as pointed out by Thomas, the real issue here is a naming issue. In the Myriad Pro Regular font that I bought directly from Adobe on Aug 27, the unicode characters U+0162 and U+0163 (look above) are named <code>Tcommaaccent</code> and <code>tcommaaccent</code>; if they are renamed <code>Tcedilla</code> and <code>tcedilla</code> respectively, then textedit and Word gain access to those Myriad Pro characters and insert them correctly in your file. It no longer seems those characters are undefined in Myriad Pro. I checked.</p>
      <p>Michel</p>
