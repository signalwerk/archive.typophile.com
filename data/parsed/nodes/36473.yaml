      <p>Michael:<br>
      I appreciate your efforts but hold on a second as you're creating more confusion than helping to solve Andrei's problem. Thanks.</p>
      <p>Andrei:<br>
      One thing is for sure, the characters you need are in the fonts you have — as Thomas said —, so there's no need to modify them.</p>
      <p>Now, the problem you're having is most likely related with Mac OS X not reading the fonts' 'cmap' table and relying on the glyphs' names instead. I'm also running OS X v10.4.10. I don't use Pages but I did a test with TextEdit and I had no problems with the said characters (Ș ș Ț ț). Can you please confirm this in your end?</p>
      <p>On the other hand, I tested — still in TextEdit v1.4 (220) — a few other "related" characters (Ş ş Ţ ţ) and some of them — highlighted in red — were replaced by Lucida Grande, despite Myriad Pro v2.007 containing them. I reckon this is a bug in Mac OS X or TextEdit, not in the font.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MyriadProv2007_MacOSX_3599.png"></div><p></p>
