    html: |-
      <p>Miguel</p>
      <p>Here is how I read the notes from the Standard that you displayed above concerning U+0162 and U+0163. A first point says that U+0163 is used in Romanian, for Semitic transliterations and there is a ... that usually suggests other uses. The next point insists that the character is used in Romanian data, and will thus stay in archives even if a new glyph is now preferred. The third point states explicitly that for Romanian, the new preferred glyph, a t with comma below, is to be found at U+021B.</p>
      <p>Great! Romanian was granted  four new characters, namely U+0218, U+0219, U+021A and U+021B as mentioned above by sii. I don't see how this should imply that people in Semitic studies (and others) should now be deprived from their glyphs in U+0162 and U+0163. </p>
      <p>If  there is any doubt left, there is a last line; it is in <a href="http://en.wikipedia.org/wiki/Backus-Naur_form" rel="nofollow"><strong>Backus Naur form</strong></a> (BNF), commonly used in Computer Sciences (in particular in the syntax of programming languages) and it leaves no ambiguity;  it defines the glyph U+0163 as a composed glyph; a glyph composed of those in  U+0074 and U+0327; U+0074 is just a "t"; now what is U+0327? It is so small on the screen that we may have doubts. So we just go to the page <a href="http://www.unicode.org/charts/" rel="nofollow"><strong>The Unicode Character Code Charts By Script</strong></a> and enter "0327" in the slot for "Look up by character code" and then click "go". The most current chart is said to be <a href="http://www.unicode.org/charts/PDF/U0300.pdf" rel="nofollow"><strong>here</strong></a>. We look and we find this nice glyph:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/u0327_5787.gif"></div><br>
      and in the notes under, we learn how the corresponding character is to be named: "combining cedilla"<br>
      <div class="imageWrap"><img src="http://typophile.com/files/cedilla_4865.gif"></div><br>
      So U+0163 is defined in BNF as a "t" with a "combining cedilla" under. The people in Semitic studies are safe (and maybe others as well), they may keep their  "tcedilla" glyph in U+0163!  <p></p>
      <p>Michel</p>
