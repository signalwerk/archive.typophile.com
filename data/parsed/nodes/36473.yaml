      <p>Note that the figure is illustrating possible glyph variants at the script level, not at the individual language level. The 'real caron' forms are legitimate ways of representing these diacritic characters within the Latin script system and, indeed, there may be situations or languages for which these forms are preferred. But for Czech and Slovak the apostrophe-like form is very much the norm, and I've not seen the other form used with L/l d or t in any Czech typography. So again the issue is one of what languages you are targeting. The majority of Latin font development is targeted at languages of European use or origin, so the expectation is that the Czech and Slovak forms for these diacritic letters will be the default forms in most fonts.</p>
      <p>As the target language coverage for fonts expands, the support of language-specific glyph variation will become more and more important. Thankfully, we're beginning to see it implemented, albeit not in an ideal way, in major apps like InDesign CS3 (and even in CS2 ME).</p>
