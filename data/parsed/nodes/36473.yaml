      <p>&gt; <cite>It should be noted that Unicode also encoded a number of other characters nominally ’with cedilla’, but for which a comma accent form is preferred in all the European orthographies that use these diacritic letters: K/k, R/r and, importantly it turned out, T/t.</cite></p>
      <p>Should I conclude that the above R/r characters in Times New Roman are wrong?</p>
