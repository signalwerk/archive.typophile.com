      <p><em>Is there other instances in the Unicode “specification” that require such an exegesis?</em></p>
      <p>Yes, quite a few. Perversely, the relative messiness of Unicode as a standard is a testament to its success: it was willing to accept dubious encodings and politically motivated proposals (e.g. the Arabic presentation forms and the composed Hangual syllables), at least during the early years, in order to get the standard off the ground.</p>
      <p><em>So, for me something that looks like a cedilla even if it does not look like an attached cedilla is a cedilla; mixing detached cedillas with attached cedillas is no problem for me. But mixing a comma with a detached cedilla feels really weird.</em></p>
      <p>An unattached cedilla is probably pretty acceptable to a Romanian or Baltic reader. Indeed, there have been attempts to design what Chuck Bigelow call a 'commadilla', a deliberatly ambiguous, disconnected form that could be read as either a cedilla or a comma accent according to the preference of the reader.</p>
