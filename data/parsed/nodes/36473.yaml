      <p><em>Should I conclude that the above R/r characters in Times New Roman are wrong?</em></p>
      <p>Not in themselves: as I just wrote, this kind of unattached curved shape is probably an acceptable 'commaaccent', but it would be better if all the commaaccent glyphs were consistent. It isn't crucial for European languages, because the T/t commaaccent is only used alongside S/s commaaccent, not alongside the Baltic diacritics.</p>
      <p>By the way, at which version of Times New Roman are you looking? The Windows Vista version distinguishes T/t with cedilla from T/t with commaaccent.</p>
