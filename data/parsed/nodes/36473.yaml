      <p>&gt; <em>Here is how I read the notes from the Standard that you displayed above [...]</em></p>
      <p>That is not exactly the way the notes are to be read. The entries with a bullet (•) are Informative Notes, the ones with an arrow (→) are Cross References, and the ones with an equivalent sign (≡) are Canonical Decompositions. According to the Unicode 5.0 reference book, these are defined as:</p>
      <p><strong>Information About Languages</strong><br>
      An informative note may include a list of one or more of the languages using that character where this information is considered useful. For case pairs, the annotation is given only for the lowercase form to avoid needless repetition. An ellipsis "..." indicates that the listed languages cited are merely the principal ones among many.</p>
      <p><strong>Cross References</strong><br>
      Cross references are used to indicate a related character of interest, but without indicating the nature of the relation. Possibilities are a different character of similar appearance or name, the other member of a case pair, or some other linguistic relationship.</p>
      <p><strong>Decompositions</strong><br>
      The decomposition sequences (one or more letters) given for a character is either its canonical mapping or its compatibility mapping. The canonical mapping is marked with an <em>identical to</em> symbol ≡.</p>
      <p>In addition, in page 564 one can read the following:<br>
      <strong>Images in the Code Charts and Character Lists</strong><br>
      Each character in these code charts is shown with a representative glyph. A representative glyph is not a prescriptive form of the character, but rather one that enables recognition of the intended character to a knowledgeable user and facilitates lookup of the character in the code charts. In many cases, there are more or less well-established alternative glyphic representations for the same character.</p>
      <p>Designers of high-quality fonts will do their own research into the preferred glyphic appearance of Unicode characters.[...]</p>
