    <p>Hello,</p>
    <p>I'm planning to work on my website design and I'm going to use a dynamic text replacement technique that will automatically change the headlines with an image. That way I'm able to use other fonts than the regular Arial, Verdana, Georgia, Courier and Times New Roman and, so far, I'm going for the Myriad Pro available in Mac OS X.</p>
    <p>However, there's a slight problem: Romanian, the language I use on my website, has some characters not available in the default Myriad Pro like Ş and Ţ and I thought I could try and add those by hand.</p>
    <p>Am I allowed to do that? And am I allowed to upload a font from the operating system to the server so I can use it to generate images with it?</p>
    <p>Thank you.</p>
