      <p>Fontlab Ltd.'s current recommendation is to design four glyphs using a cedilla accent, and giving the S with cedilla glyphs the  <code>*cedilla</code> names and the T with cedilla glyphs <code>uniXXXX</code> names or <code>*cedilla</code> names. The notes that follow the glyph names are not the Unicode character names but actual descriptive names:</p>
      <p><code>U+015E "Scedilla"</code> Latin capital S with cedilla<br>
      <code>U+015F "scedilla"</code> Latin small s with cedilla<br>
      <code>U+0162 "uni0162"</code> or <code>"Tcedilla"</code> Latin capital T with cedilla<br>
      <code>U+0163 "uni0163"</code> or <code>"tcedilla"</code> Latin small t with cedilla</p>
      <p>The remaining glyphs in question should include glyphs with the commaaccent diacritic and should use <code>uniXXXX</code> names, <em>not <code>*commaaccent</code> names.</em></p>
      <p><code>U+0122 "uni0122"</code> Latin capital G with commaaccent below<br>
      <code>U+0123 "uni0123"</code> Latin small g with turned commaaccent above<br>
      <code>U+0136 "uni0136"</code> Latin capital K with commaaccent below<br>
      <code>U+0137 "uni0137"</code> Latin small k with commaaccent below<br>
      <code>U+013B "uni013B"</code> Latin capital L with commaaccent below<br>
      <code>U+013C "uni013C"</code> Latin small l with commaaccent below<br>
      <code>U+0145 "uni0145"</code> Latin capital N with commaaccent below<br>
      <code>U+0146 "uni0146"</code> Latin small n with commaaccent below<br>
      <code>U+0156 "uni0156"</code> Latin capital R with comma below<br>
      <code>U+0157 "uni0157"</code> Latin small r with commaaccent below<br>
      <code>U+0218 "uni0218"</code> Latin capital S with commaaccent below<br>
      <code>U+0219 "uni0219"</code> Latin small s with commaaccent below<br>
      <code>U+021A "uni021A"</code> Latin capital T with commaaccent below<br>
      <code>U+021B "uni021B"</code> Latin small t with commaaccent below</p>
