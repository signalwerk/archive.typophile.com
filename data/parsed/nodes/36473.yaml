      <p><em>The name mentions a cedilla, and the definition in BNF style says that it is built with a G and a character 0327 which is indeed a cedilla, yet the Gcedilla they display is with a comma. I must confess that I don’t like this.</em></p>
      <p>Go back and read my long post again. All the 'with cedilla' characters in Unicode except C/c cedilla and S/s cedilla are properly displayed with the comma accent form in the European orthographies that use these characters. The unification of cedilla and comma accent under the name cedilla was an early error in Unicode, and one which for stability reasons they chose not to correct except in the case of the S/s and T/t comma accent for Romanian (and given the massive confusion and conflicting text encodings that that correction has produced, one can see why they would avoid throwing the Baltic languages that use the other 'cedilla' characters into the same mess). It was a mistake to conflate these two diacritic marks and a mistake to call them 'with cedilla' in the formal names, but it is an old mistake and one that we have to live with.</p>
