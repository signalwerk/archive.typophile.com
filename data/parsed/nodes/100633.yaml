    html: <p>Thought it could have been <a class="freelinking external" href="http://commercialtype.com/typefaces/graphik" rel="nofollow">Graphik</a> until I've seen <a class="freelinking external" href="http://nodeberlin.com/archive/fall-out" rel="nofollow">the digits</a>. If they come from from the same typeface, that could not be Graphik. They're closer to some <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/futura/" rel="nofollow">Bitstream version of Futura</a> (to get this kind of cut on <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/futura/bold/glyphs.html#glyphs/243667/20" rel="nofollow">1</a>).</p>
