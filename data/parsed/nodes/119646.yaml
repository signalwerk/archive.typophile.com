      <p>Couldn't find any exact matches; suspect it is heavily customized.</p>
      <p>Closest I could find for recreating the look is All Round Gothic Bold (customize the J, change the angle of the terminals on the C):<br><a href="http://www.myfonts.com/fonts/flat-it/all-round-gothic/">http://www.myfonts.com/fonts/flat-it/all-round-gothic/</a></p>
      <p>The free Google font Montserrat Bold also comes close, with an alternate A with a rounded top and a J with a left pointing serif that could be modified....</p>
