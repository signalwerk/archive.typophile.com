    votes: null
    html: <p>You can just set the horizontal scaling to 97% in the character panel, or, if copy fitting is your goal, you can allow glyph scaling in your justification options.</p>
    html_clean: <p>You can just set the horizontal scaling to 97% in the character panel, or, if copy fitting is your goal, you can allow glyph scaling in your justification options.</p>
