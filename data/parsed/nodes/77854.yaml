  html: <p>Is there a way in IND to condense or expand type? I need to condense a tiny bit of text about 3%. Is this possible?</p>
  html_clean: <p>Is there a way in IND to condense or expand type? I need to condense a tiny bit of text about 3%. Is this possible?</p>
comments:
  - id: 446688
    user: 20652
    date: 2011-01-08T05:11:00
    date_raw: 8 Jan 2011 — 5:11am
    votes: null
    html: |-
      <p>Yes, it's possible in the Character pane. It's the icon with the cap T and the arrows beneath.</p>
      <p>I tend to rely on a combination of condensing and negative tracking so it's not so obvious.</p>
    html_clean: |-
