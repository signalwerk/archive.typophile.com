    <p>Hi,<br>
    I have a problem.<br>
    I created a font with Fontlab Studio 5.</p>
    <p>I have this cases:</p>
    <p>Thin<br>
    Light<br>
    Regular<br>
    Bold<br>
    Black</p>
    <p>Ombra</p>
    <p>On Mac all cases work fine.<br>
    On Pc, I open Thin, system open Ombra...<br>
    In Illustrator Thin doesn’t appear...<br>
    Why???</p>
    <p>The fonts are .ttf.</p>
    <p>Thank you!</p>
