    html: <p>Retina was commissioned by the Wall Street Journal, and so far as I know they retain exclusive usage rights. It's possible that the contract between the WSJ and Hoefler &amp; Frere-Jones will allow H&amp;F-J to license the font to other customers at some time, but I don't recall any announcement of a specific period of exclusivity.</p>
