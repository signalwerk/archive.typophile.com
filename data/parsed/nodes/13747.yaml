    html: |-
      <p>This might help those who have joined the hunt.</p>
      <p>By my recollection only (I'm not near my reference library), the Sans Serif Shaded was part of the T.J. Lyons Collection of Wood Types that Letraset originally licensed before Agfa-Compugraphic.</p>
      <p><strong>CORRECTION:</strong> Sans Serif Shaded originally came from the foundry of Stephenson Blake &amp; Co. and NOT T.J. Lyons</p>
      <p>The shaded version became wildly popular in late '60s -- early '70s, making its way onto many bookcovers and record albums (you know, those big black round flat things before CDs).</p>
      <p>I remember being amazed that the design originated from an old wood type, since to me it seemed very contemporary. Gee, it was old, but came back in style!</p>
      <p>Someone please correct me if my recollection is wrong, as I wouldn't want to create false history.</p>
      <p>-------------------------------------------------<br>
      Yes, I'm old, but I'm Sans Serifs Shaded!</p>
