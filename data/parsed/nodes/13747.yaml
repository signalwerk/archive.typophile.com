      <p>For "old" type buffs like myself, many of the typefaces I've used from the past haven't made it into the digital realm or were pooly translated.</p>
      <p>What adds to the problem of "hunting down" older typefaces is that names might be different, the designer has actually created a "new" version, or that it becomes hidden under a ridiculous category like "Fancy" or "Unique"!</p>
      <p>The game is afoot! or is it "The game is a face" or "The face is afoot"?</p>
      <p>BTW- what is the application you intend? Long or short text? Cap sizes larger than 5 inches? Five feet? If you only need a few letters, it might be easier to find someone who can set it using photo-headliner, etc.<br>
      -------------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
