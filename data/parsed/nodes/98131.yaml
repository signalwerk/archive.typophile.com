  html: <p>I've created a font in Font Lab as a kind of experiment, worked out the metrics / kerning pairs and exported it as as TT font. It works fine, but when in Illustrator / Indesign the font name appears in brackets in a defualt font  rather than appearing in it's own font style. Has anyone come across this - it's no biggie, but i really want it to look as good as all the other fonts, and it looks a bit budget.</p>
