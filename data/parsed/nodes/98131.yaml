      <blockquote><p>the font name appears in brackets in a defualt font</p></blockquote>
      <p>That's usually an indication that a font is missing in an existing document, though there <a class="freelinking external" href="http://www.typophile.com/node/71766" rel="nofollow">are apparently other causes</a>. Maybe try <a class="freelinking external" href="http://helpx.adobe.com/x-productkb/global/troubleshoot-fonts-mac-os-x.html" rel="nofollow">clearing the font caches</a>.</p>
