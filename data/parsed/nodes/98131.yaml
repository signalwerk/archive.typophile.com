      <p>The point of adding it to the application font folder is to see if it works in the application menu when added in this way, as using any font management tool is effectively at a level of remove from the application.</p>
      <p>If when added to the application font folder you are still seeing the same problem then there is definitely a problem with the font and you can attempt to figure out what.</p>
