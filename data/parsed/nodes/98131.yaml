    html: |-
      <p>Without seeing the naming conventions I can't really suggest much else. You could try copying the following:</p>
      <p><strong><em>Absent Normal (Regular)</em></strong></p>
      <dl><strong>Names and Copyright</strong><br>
      Family Name: Absent<br>
      Weight: Regular<br>
      Width: Normal<br>
      Number: 400<br>
      [no boxes ticked]<br>
      Style Name: Regular<br>
      PS Font Name: Absent<br>
      Full Name: Absent<br>
      Menu Name: Absent<br>
      FOND Name: Absent
      <p><strong>OpenType-specific names</strong><br>
      OT Family Name: Absent<br>
      OT Style Name: Regular<br>
      Mac Name: Absent</p>
      <p><strong>Additional OpenType names</strong><br>
      (whatever other fields are auto-populated in this area you should make sure you have the following. In each case the first number corresponds to the NID, the second to the PID, the third to the EID and the fourth to the LID. You may need to adjust some of these manually)</p>
      <dd><code>1.1.0.0: Absent<br>
      1.3.1.1033: Absent<br>
      2.1.0.0: Regular<br>
      2.3.1.1033: Regular<br>
      16.3.1.1033: Absent<br>
      17.3.1.1033: Regular<br>
      </code></dd>
      </dl>
      <p>This is in line with <a href="/wiki/Recommendations%20for%20dealing%20with%20font%20problems%20in%20Microsoft%20Word%202011%20for%20Mac" class="freelinking" rel="nofollow">Adam Twardoch's updated naming guidelines</a>, which you may find it useful to read through.</p>
