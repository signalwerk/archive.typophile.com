    html: |-
      <p>Doesn't the font have a separate macron which you could just kern over the character(s) in question? That would be the best solution.<br>
      If you do use a different font, I'd advise to use it only for the macron, not the complete o-with-macron. (Edit: Or just switch to a different cut of Baskerville altogether that has everything you need – but that may not be an option.)</p>
