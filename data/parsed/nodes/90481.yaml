  html: <p>I'm working on a text set in Baskerville (MT) which has a few Japanese names with a macron, such as "Jun'ichirō". Unfortunately, Baskerville doesn't seem to offer this in the glyphs panel. Any suggestions/similar fonts with this diacritic? Thank you.</p>
