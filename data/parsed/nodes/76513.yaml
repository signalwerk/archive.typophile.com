    html: <p>Arial contains a few anemic arrows but, most likely, the arrows in the PPT presentation are from one of the Wingding fonts. Consequently, using your preferred method, you're stripping the code which will render the proper character. For this project, change YOUR preferences and save yourself a lot of headaches...</p>
