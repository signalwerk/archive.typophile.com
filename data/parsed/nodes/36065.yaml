    <p>It seems Pentagram’s Michael Beirut <a href="http://blog.pentagram.com/2007/08/new-work-166-perry-1.php" rel="nofollow">thinks Peter Bilak designed Scala Sans</a>. I think he means <a href="http://www.typotheque.com/site/fonts.php?id=1" rel="nofollow">Fedra Sans</a>. Am I wrong?</p>
