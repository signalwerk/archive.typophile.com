      <p>I subscribed to Baseline from issues 20 to 37, and even paid a bundle for all their back issues (back to #11). Then I bought the elusive #10 on eBay. In the end though, I realized that the amount of type design (as opposed to typography, which is broader, less focused) content for the price was too low, and frankly getting lower. And realizing that my collection had become worth as much as it ever would, I sold the bundle on eBay (for a decent, not stellar price). These days I read two others: <a href="/wiki/typo%20magazine" class="freelinking" rel="nofollow">TYPO</a>, and <a href="/wiki/tipoGrafica" class="freelinking" rel="nofollow">tipoGrafica</a>. Plus the occasional "special type issue" of things like Eye, although I've massively cut down on my physical browsing time lately.</p>
      <p>hhp</p>
