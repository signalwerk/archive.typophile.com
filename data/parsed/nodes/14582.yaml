  html: <p>I'm constantly looking out for typography magazines and think I may have found one of the best. It's called <a href="/wiki/baseline%20magazine" class="freelinking" rel="nofollow">baseline</a> (<a href="http://www.baselinemagazine.com/" title="http://www.baselinemagazine.com/">http://www.baselinemagazine.com/</a>) and for £48 for a quarterly magazine it beats pretty much any other I have come across so far. What I'm after are recommendations for other typesetting/typography journals/magazines. I don't actually know anyone else in person who gets the same enjoyment out of typography as I do and it's not really the sort of thing which I can talk about down at the pub with my mates! so any pointers are gratefully received!</p>
  html_clean: <p>I'm constantly looking out for typography magazines and think I may have found one of the best. It's called <a href="/wiki/baseline%20magazine" class="freelinking link-lost" rel="nofollow">baseline</a> (<a href="http://www.baselinemagazine.com/" title="http://www.baselinemagazine.com/" class="link-external">http://www.baselinemagazine.com/</a>) and for £48 for a quarterly magazine it beats pretty much any other I have come across so far. What I'm after are recommendations for other typesetting/typography journals/magazines. I don't actually know anyone else in person who gets the same enjoyment out of typography as I do and it's not really the sort of thing which I can talk about down at the pub with my mates! so any pointers are gratefully received!</p>
