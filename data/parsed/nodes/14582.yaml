      <p>Also if you have a spare GBP 275 lying around you could buy the Octavo, journal of typography box set . </p>
      <p>"Limited edition, numbered, boxed set from an edition of 225. Contains 7 printed issues and an interactive CD-rom. Wide-ranging articles discuss typography in design, the visual arts, architecture and the environment. The first typography journal to practice what it preaches, its eight issues are a typographic journey from three-column grid to interactive CD-rom. Pre-Mac typographic experimentation at the limits of photo-typesetting, repro and print technology. Innovative, intelligent and influential. Challenging the narrow dogma of then traditional theory and commercial acceptability. Typography in Britain would never be the same again."</p>
      <p><a href="http://www.markholtdesign.com/" title="http://www.markholtdesign.com/">http://www.markholtdesign.com/</a></p>
