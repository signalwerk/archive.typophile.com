    html: |-
      <p>A ligature based font will require tens of thousands of glyphs (18,000 according to <a href="http://www.crulp.org/software/ling_resources/UrduLigatures.htm" title="http://www.crulp.org/software/ling_resources/UrduLigatures.htm">http://www.crulp.org/software/ling_resources/UrduLigatures.htm</a>), so it will take some effort to draw them all.</p>
      <p>But a ligature based font would be easier to implement on the OpenType side, as it makes certain things simpler e.g. you have total control on dot positioning without the need of complex substitution rules, control over vowel positioning might be easier too (but I had some bad experience with mark positioning over ligatures in the bast, it is one of the reasons I maintain a ligature-free policy for all my fonts), and it would work even with most simple-minded OpenType implementations (where is fonts like Nafees Nstaleeq require the most sophisticated ones).</p>
      <p>But if you have to draw every ligature for every possible combination of members of a letter group the number of glyphs might be much higher e.g. if you have a بي ligature, and given that Arabic and Urdu have 12 Baa-like letters in the initial form and 4 Yaa-like letters in the final form, you have a total of 48 ligatures for every possible combination, while Nafees Nastaleeq has only 2 glyphs etc. Some of these combinations might not be valid in Urdu e.g. ىى so you may just choose to support only valid combinations but if some day someone invents a word that uses such combination e.g. in transliteration a foreign name, your font will give suboptimal and inconsistent result, but, depends on your goals, this may be an acceptable compromise.</p>
      <p>I think Monotype built a Nastaleeq font that way.</p>
