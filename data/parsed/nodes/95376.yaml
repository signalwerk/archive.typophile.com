      <p>Hi Rashid.</p>
      <p>Thanks for posting again in a new thread. It is hard to advice when I don’t know what you’ve done in the past, so I assume you are a beginner. </p>
      <p>Starting from scratch, I’d try to figure out what tools the calligrapher used, get hold of one, and try your own hands at calligraphy. That will teach you how direction, pressure, angle, speed and all the other factors affect the outcome. Pay attention to thins and thicks, terminals, verticals, horisontals etc. The second step is learning how to draw Bezier curves with extrema points. The third step would probably be scanning and digiziting the calligraphy samples in a vector drawing application like Illustrator, or ideally directly in a font drawing application like Fontlab. Now it starts to become very apparent that letters are not only black, but also white: white inside letterforms and white between letterforms. These areas should harmonize with each other as well as with the black. Therefore, step four is studying spacing. Step five is optical adjustments. Why does the /O/ go above and below the /H/? Why is blacks in /g/ thinner than the blacks in /o/? Why is a bold taller at the x-height than a regular? Why is the /u/ narrower than the /n/? And so on and so on.</p>
      <p>That should take you a couple of years. Come back when you’re done, and I’ll explain the rest :)</p>
