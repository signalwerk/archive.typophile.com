      <p>You should begin by carefully planning the glyph set. I recommend doing this in a spreadsheet, in which you can keep track of all the letters, positioning forms, ligatures, etc. For a big font project, this is very important.</p>
      <p>I've not tried to use Font Creator, so can't advise on whether you might need other software.</p>
      <p>If possible, see if you can do the design and outline creation work directly in a font tool, rather than in Illustrator. This will save you time having to import from Illustrator files, and will mean that you can apply spacing and doing live tests as you go along.</p>
