      <p>Nastleeq is fairly complex than avarage Arabic fonts (or rather OpenType does not lend itself to that kind of sophistication), so my advice is to start by studying and mastering basic Arabic OpenType techniques, before moving to more sophisticated ones.</p>
      <p>CRULP have a nice <a class="freelinking external" href="http://www.crulp.org/software/localization/Fonts/nafeesNastaleeq.html" rel="nofollow">Nastaleeq font</a>, together with the Volt project (and a license that allows free use and modification), you may want to study it for advanced OpenType techniques used to build high quality Nastaleeq fonts.</p>
      <p>The font has its issue though, it lacks many Arabic letters not used in Urdu, and the vowel marks positioning is completely broken, and has no support for kashida. I started a <a href="/wiki/https%3A/%252Fgithub.com/khaledhosny/hussaini-nastaleeq" class="freelinking" rel="nofollow">derived project</a> to address the first two issues, and I hope to add kashida support along the way of learning more about Nastaleeq and OpenType.</p>
      <p>As for your points, 1-5 are the easy ones and does not differ greatly from the way regular fonts are designed. Step 6 is where all the complexity and steep learning curve. I never used Volt, I usually use FontForge, but for such a project I'd write the substitution code in Adobe feature files (and compile it in with FontForge, but most people will use AFDKO).</p>
    html_clean: |-
