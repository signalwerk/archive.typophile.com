      <p>I think you need to experiment with different tools and work out what approach will be most comfortable for you. I use FontLab for most of my design work, using its drawing tools which are similar to Illustrator but with some differences. Most font tools have drawing tools like these, and most have free trial versions that you could download and test.</p>
      <p>For the spreadsheet, you would start with a list of unique glyph names. If you want the names to be parseable by Adobe Acrobat, so that it can reconstruct text strings from PDFs distilled from printer streams, then you probably want two different sets of names: one set of easily understood development names such as 'aReh.fina' and one set of parseable names in the format 'uni0631.fina' (in accordance with <a href="http://www.adobe.com/devnet/opentype/archives/glyph.html" rel="nofollow">Adobe's glyph naming rules</a>). I can't really provide an example, because the whole point of the spreadsheet is to organise the font planning in a way that makes most sense to you. So whatever information about glyphs you think would be helpful can all be collected in one place.</p>
      <p>You might find this workflow document helpful:<br>
      <a href="http://www.tiro.com/John/FontLab-to-VOLTworkflow.pdf" title="http://www.tiro.com/John/FontLab-to-VOLTworkflow.pdf">http://www.tiro.com/John/FontLab-to-VOLTworkflow.pdf</a></p>
      <p>[UPDATE: corrected that link]</p>
      <p>It seems to me that you are setting out to do something very ambitious without a lot of experience of the basics of font creation, which is a pretty technical job. I suggest you try to break down your learning into steps, and start by familiarising yourself with what the different tool options are, explore how they work, and decide which suits you best (while at the same time confirming that it will be able to do everything that you need it to do in order to make the kind of font you have in mind).</p>
