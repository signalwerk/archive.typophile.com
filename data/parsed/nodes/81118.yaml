      <p>An Act of Pure Genius<br>
      A very perfectly dressed man stands next to you on a crowded subway.  From your vantage point just above his left shoulder, you notice a small bit of lint disturbing the otherwise astonishingly flawless appearance.  While his head is turned away, you flick the lint off of his lapel without him ever noticing. </p>
      <p>At your stop, you leave the train with the full knowledge that, on this day, you have achieved a perfection which was solely due to your amazing skill and superior perspective.</p>
