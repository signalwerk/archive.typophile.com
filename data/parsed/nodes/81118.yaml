      <p>Century Expanded would be a perfect typeface if only it were a little less condensed.<br>
      Imprint would be a perfect typeface if the capital J didn't descend below the line.<br>
      Garamond would be a perfect typeface if the capital J didn't descend below the line, and the counter on the lowercase e were larger.<br>
      Times Roman would be a perfect typeface if only everyone else wasn't using it.</p>
      <p>On the other hand, levity aside, and referring to the older thread referenced here, the serifs on the I in Bell Gothic are there for a reason - so that people reading something in it can, easily and unambiguously, in all cases, tell I, l, and 1 apart with no chance of error. This was a good idea for a typeface for setting telephone books.</p>
