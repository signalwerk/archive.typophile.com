  html: |-
    <p>We all know that there's no such thing as perfection, and that applies just as well in the world of type design. But what are some typefaces that come close if it wasn't for one little thing (one character, the italics, usability, numerals, etc)?</p>
    <p>Examples:  </p>
    <p>Baskerville would be a perfect typeface if only its 'a' wasn't so wide and round.<br>
    Univers would be a perfect typeface if only it had small caps.<br>
    Futura would be a perfect typeface if only its ascenders weren't so weirdly tall.<br>
    Miller would be a perfect typeface if only it's 'k' didn't have a curved leg.</p>
    <p>Have at it!</p>
