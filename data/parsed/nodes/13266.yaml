  html: <p>Born and raised in Mexico City, Armin Vit is a graphic designer and writer now living in Brooklyn, New York. He has written for <a href="/wiki/AIGA" class="freelinking" rel="nofollow">AIGA</a>’s <a href="/wiki/VOICE" class="freelinking" rel="nofollow">VOICE</a>, <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>, <a href="/wiki/Eye" class="freelinking" rel="nofollow">Eye</a>, <a href="/wiki/HOW" class="freelinking" rel="nofollow">HOW</a> and <a href="/wiki/STEP" class="freelinking" rel="nofollow">STEP</a> magazines among others. His work has been published in numerous publications around the world and has garnered a few awards. He is a former faculty member of <a href="/wiki/Portfolio%20Center" class="freelinking" rel="nofollow">Portfolio Center</a> and has lectured on topics ranging from typography to branding in locations ranging from San Diego to Berlin. He is co-founder of <a href="/wiki/UnderConsideration" class="freelinking" rel="nofollow">UnderConsideration</a> and founder of the (in)famous <a href="/wiki/Speak%20Up" class="freelinking" rel="nofollow">Speak Up</a>. Currently, he spends his daytime working at <a href="/wiki/Pentagram" class="freelinking" rel="nofollow">Pentagram</a>. Feisty behind the keyboard, Armin remains timid at heart.</p>
