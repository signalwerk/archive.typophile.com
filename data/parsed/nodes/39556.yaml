  html: |-
    <p>Hello,</p>
    <p>I’m working on this project called Mentorskap (swedish for mentorship).</p>
    <p>It’s a practical training projekt at my school for students studying at different health care programs, social studies and physical therapy.</p>
    <p>This project brings in people from the field to help the students with their practical training, a mentor.</p>
    <p>I’ve narrowed it down to three elements that I want to present in the logo. The student, mentor and the school.</p>
    <p>In these three sketches the student i the yellow part, the box is the school (a box with four sides representing the four years of each program) and the small line beside the yellow part is the mentor.</p>
    <p>Any feedback you can give is much appreciated.</p>
    <p>Peter</p><div class="imageWrap"><img src="/files/mentorskap_logo_comp_1_4046.jpg"></div><p></p>
