    <p>Some of the core fonts of Windows 7 will feature the Capital Sharp S at its new codepoint 1E9E. This has been confirmed to me yesterday by Microsoft and Ascender Corp. representatives.<br>
    An article in German and an image can be found at<br><a href="http://www.signographie.de/cms/front_content.php?idcat=130">http://www.signographie.de/cms/front_content.php?idcat=130</a></p>
