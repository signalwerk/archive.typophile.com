      <p>&gt;I tried to express my disppointment about the form the new glyph got in Microsoft’s sans-serif faces</p>
      <p>Sorry, that wasn’t clear from your original post. Happy to pass feedback to the designers - in the case of Arial that would be Monotype and as I recall Ascender did the other sans. </p>
      <p>Probably too late to change them for Windows 7, but they can always be updated in the future. </p>
      <p>Also most of the sans faces are user interface fonts, that would only get rendered at small sizes in UI. That may be a reason for the design, but could also be a reason to have them stand out more. </p>
      <p>Anyway if you have any more detailed feedback please send it directly to me.</p>
      <p>Cheers, Si</p>
