      <p>Depending on the use to which the document is to be put you could do a <a href="http://rally-speed.tripod.com/Technic.htm">rally roadbook</a>, if it slightly less important to have the directions as useable as that, you could do a ’map’ with the directions following the roads from the top left corner to bottom right.<br>
      Tim</p>
