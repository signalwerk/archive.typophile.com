      <p>You could set it in roman U&amp;lc, but have proper names, such as X ROAD in small caps, and geographical features, such as <em>the embankment</em> in italic.</p>
      <p>(Sorry, X ROAD was supposed to be in small caps, but Typophile doesn’t support the “small” tag.)</p>
