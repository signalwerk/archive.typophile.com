  html: |-
    <p>I am working on a document that involves copy that is basically just directions written down how you would say them eg Go to the bottom of x road, turn left. Take a right along the enbankment etc.</p>
    <p>I dont want to just have it as an ordinary paragraph and as there is no higherarchy for headers/pull quotes etc im looking for other ideas to make it more interesing?</p>
    <p>I was thinking along the lines of using // instead of full stops or dingbat arrows?</p>
    <p>Anyone done anything similar or any ideas?</p>
