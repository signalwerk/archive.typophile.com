    html: <p>Racheluh, 1. It's difficult to suggest a font to go with a logo we can't see. 2. What kind of music is this? 3. Who is the target audience? 4. Té Rowan's earlier remark is applicable. Readable, edgy, stylish, psychedelic, other? 5. What is a lyric sheet, in this context? Is it one sheet of paper? Stapled big or little sheets of paper? Something on the internet? A little booklet for a CD package? Is the logo going to be close to the lyrics? 6. What do other lyric sheets use?</p>
