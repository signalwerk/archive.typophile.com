    html: |-
      <p>The thing is, during the psychedelic era there was a limited range of fonts available at text size, and these were all quite legible. So, in order to create a suitably mysterious effect, designers made these really hard to read by printing them in weird shit colours—with complementary simultaneous contrast, for instance, or in different colors with similar tones, such as cyan on black.</p>
      <p>The lyrics of Sgt. Pepper, for instance, were printed in Times Roman (IIRC) black on red, also surprinting an inset close-cropped photo of the Beatles in colorful pseudo-antique military uniforms.</p>
