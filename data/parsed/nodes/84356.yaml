    <p><a href="https://www.fontfont.com/fonts/nuvo-mono" rel="nofollow"></a></p><div class="imageWrap"><a href="https://www.fontfont.com/fonts/nuvo-mono" rel="nofollow"><img src="http://typophile.com/files/ff_nuvo_mono_590_4263.png"></a></div><p></p>
    <p><a href="https://www.fontfont.com/designers/siegfried-rückel" rel="nofollow">Siegfried Rückel</a> expands his typeface <a href="https://www.fontfont.com/fonts/nuvo" rel="nofollow">FF Nuvo</a> with a <a href="https://www.fontfont.com/fonts/nuvo-mono" rel="nofollow">monospaced variant</a> for all weights, including Small Caps (<a href="http://t.co/Dsgm9Wz" rel="nofollow">!</a>) and Italics. This offers new options for traditional and unusual designs. The design retains its stroke endings with “chipped” corners, which make them appear soft when seen from a distance or in small point sizes, but reveal their peculiar forms at a closer look. However its x-height was lowered somewhat in comparison to FF Nuvo to emphasize FF Nuvo Mono’s typewriter character. The calligraphic touch in the characters a, g and y make this typeface stand out among other typewriter-like faces, as do the alternate characters for a, g, k, s and y, which add typographic versatility.</p>
    <p>FF Nuvo Mono is available on <a href="https://www.fontfont.com/fonts/nuvo-mono" rel="nofollow">FontFont.com</a> and <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nuvo_mono_ot_1/" rel="nofollow">FontShop.com</a>, also in <a href="https://www.fontfont.com/fonts/nuvo-mono/packages#44551" rel="nofollow">Office</a> and <a href="https://www.fontfont.com/fonts/nuvo-mono/packages#44557" rel="nofollow">Web</a> versions. FF Nuvo Web Medium is still available for <a href="https://www.fontfont.com/free#ff_nuvo_web_medium" rel="nofollow">free download</a>.</p>
