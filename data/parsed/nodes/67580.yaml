      <p>Hard to say which scripts you prefer.<br>
      Have a look at fonts similar to <a href="http://www.myfonts.com/fonts/adobe/monoline-script-mt/morelikethis.html" rel="nofollow">Monoline Script</a>. </p>
      <p>I see some stylistic characteristics in these for example:<br>
      Susa<br>
      Handsome<br>
      Mullen Hand<br>
      Coffee Service<br>
      Matinee Idol<br>
      and more …</p>
