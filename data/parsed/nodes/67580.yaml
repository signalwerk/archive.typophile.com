  html: |-
    <p>Hi there,</p>
    <p>Looking for something similar to this retro/vintage script font (used on an 80s portuguese tv show).<br>
    The letters aren't even the same so this is probably all handwritten - but I'm desperately looking for something like this.</p>
    <p>The words are cut - it read 'ora' and 'olha' (the complete words would be 'agora escolha').</p>
    <p>Thanks in advance!</p>
