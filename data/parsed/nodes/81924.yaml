    <p>Sorry I don't know the right terminology for this, but my question is about typefaces with caps that extend below the baseline, like:</p>
    <p>[link removed by admin, see comment below]<br>
    and, well, *shudder* <a href="http://new.myfonts.com/fonts/ef/papyrus/" title="http://new.myfonts.com/fonts/ef/papyrus/">http://new.myfonts.com/fonts/ef/papyrus/</a><br>
    (<a href="http://new.myfonts.com/fonts/crmfontco/rennie-mackintosh-renaissance/" title="http://new.myfonts.com/fonts/crmfontco/rennie-mackintosh-renaissance/">http://new.myfonts.com/fonts/crmfontco/rennie-mackintosh-renaissance/</a> ?)</p>
    <p>I've got a friend whose designer will NOT set his text-based logo in mixed case, because the brand name starts with an "i". The designer is avoiding iPhone, iPad, &amp;/c.</p>
    <p>Say it's "iCyou" or something like that. Or, was. And we're looking for a new setting of it.</p>
    <p>I'm thinking along the lines of: if there were a typeface with caps that act like (this) Berlin and (this) Papyrus does, in the sense of chewing up a lot of vertical space... and if said typeface had a Small Caps font... </p>
    <p>And yet the style of the face itself were nicely gothic sans, really quite no-nonsense. Meh, that part of the requirement is loose... but something clean, normal, clear, and sans. Friendly humanist would be OK, as would geometric. Just not silly.</p>
    <p>What do you know about this? Any typefaces for me to check out?</p>
