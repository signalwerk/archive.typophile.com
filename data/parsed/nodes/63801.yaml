    html: |-
      <p>Open up the PDF and view the 'Document Properties-Fonts'. If the font was embedded you'll see something to the effect of 'Font Name -- Embedded Subset'.</p>
      <p>A correctly made PDF will open and print fine on a PC or a Mac (I've been doing this since 1993) and will contain all it needs (fonts, and images) to be viewed and printed as intended.</p>
      <p>Insert someone who doesn't know what they are doing and it's a crap shoot. (72dpi RGB images, fonts not embedded, etc.)</p>
      <p>In Essence PDF (Portable Document Format) was created by Adobe to be platform and device independent.</p>
      <p><a href="http://www.adobe.com/pdf/about/history/" title="http://www.adobe.com/pdf/about/history/">http://www.adobe.com/pdf/about/history/</a><br>
      <cite>"Regardless of the computer's operating system, PDF was reliable and consistent, displaying and printing the same every time."</cite></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Acrobat-Fonts_5936.png"></div><p></p>
