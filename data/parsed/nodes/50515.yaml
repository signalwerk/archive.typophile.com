    <p>This may not be a direct relation to typography. I am doing a research on the design movement, from 1890s till present.</p>
    <p>There are 7 major design styles/movements in history from 1890 to today. They are:<br>
    1.	Victorian Era<br>
    2.	Art Nouveau Style<br>
    3.	Modern Movement<br>
    4.	Fifties’ American Kitsch<br>
    5.	Post-modern Rebellion<br>
    6.	The Contemporary Look<br>
    7.	The Digital Age</p>
    <p>Now, I am concentrating on the digital age. Is there any articles about this movement’s influences, introductions, or maybe typography in the digital age?</p>
