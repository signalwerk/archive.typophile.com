      <p>I don’t think you should overtly telegraph that you’re targeting children by using “early reading” single bowl /a and /g. Nobody likes to be dumbed down to, certainly not 9–13 year olds. I would add that double bowl /a and /g add sophistication that children that age might ﬁnd attractive, and for legibility and readability these forms are far preferable, the two-storey /a in particular disambiguating from /o.</p>
      <p>I like your idea of using a slab, it is unfussy and has a clarity suitable to the subject matter.</p>
      <p>Therefore I would recommend my Bodoni Egyptian. It is not overtly cute or trendy; neither is it a traditional, old-fashioned geometric slab serif, but a new idea of applying a monoline treatment to a classic style.</p>
      <p>And, with its small x-height, it does not create an intimidating text mass at Regular weight, as the larger x-height slab serifs do.</p>
      <p>The Bodoni Egyptian also has a large selection of weights (the Thin and Extra Light are quite interesting at display sizes), and all the bells and whistles such as small caps, alternate ﬁgure styles, and compound fractions—good for scientiﬁc material.</p>
      <p><a href="http://origin.myfonts.net/s/aw/original/99/0/51097.pdf" title="http://origin.myfonts.net/s/aw/original/99/0/51097.pdf">http://origin.myfonts.net/s/aw/original/99/0/51097.pdf</a></p>
