    <p>Hello, I'm looking for a highly legible font for use in body copy, cutlines, and possibly heads and sub heads for a children's magazine (ages 9-13).<br>
    I need a contemporary and friendly look . Must be easy to read, and have some character  while being the neutral font to some animated display fonts.<br>
    The magazine content is science-oriented and educational, packaged in a cool, entertaining way.<br>
    Definitely not stereotypical (no Clarendon, or New Century Schoolbook as much as I like them). Because the magazine includes both genders, and softer, human content, I don't want a cold. science-y looking font.<br>
    Preferably one story "a" and "g." I'm leaning towards slab serif or humanist. Bree is one of my selections, but have some concern about the legibility with its slight condensed look.  I'm pairing it with a sans, currently looking at Tenso, which has some character and flexibility.<br>
    All suggestions welcome!</p>
    <p>I also welcome any info on selecting readable fonts for kids (who are reading less than previous generations), specifically font test research or any kind of concretes to provide guidance on typography for kids. (Does text really need to be broken into small blocks? I don't think so, but research would help substantiate.)<br>
    Thanks for reading this!</p>
