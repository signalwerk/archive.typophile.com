    <p>I've done a search and it didn't come up so maybe no-one's tried it. When I did a search for PC Font Viewers, Typograf seemed to come up as the preferred choice, however I thought it was pretty piss poor, the interface was out of the 1970's and half the options didn't work on XP64, I guess I'm used to Macs were the Font managment options are really good.</p>
