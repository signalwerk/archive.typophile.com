  html: |-
    <p>I haven't posted here for a while but I thought some people might find it useful to try this <a href="http://www.babelstone.co.uk/Software/BabelMap.html" title="http://www.babelstone.co.uk/Software/BabelMap.html">http://www.babelstone.co.uk/Software/BabelMap.html</a></p>
    <p>I've done a search and it didn't come up so maybe no-one's tried it. When I did a search for PC Font Viewers, Typograf seemed to come up as the preferred choice, however I thought it was pretty piss poor, the interface was out of the 1970's and half the options didn't work on XP64, I guess I'm used to Macs were the Font managment options are really good.</p>
    <p>However, Babelmap is not bad, I'm working mostly with OpenType fonts across platforms and BabelMap has very comprehensive unicode display options, plus it's donation ware. Anyhow hope this is helpful to anyone looking for a good Unicode font viewer.</p>
