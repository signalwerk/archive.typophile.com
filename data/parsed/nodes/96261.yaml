    <p>For the next three weeks, I will be offering any and all fonts from <strong>my entire collection</strong> at myfonts.com for <strong>75% OFF RETAIL PRICE</strong> to accredited graphic design and typography programs and, through such programs, to students, as well. In other words, if an instructor takes orders from his or her students, collects the funds, and places the order, the discount will apply.</p>
    <p>Please contact me directly at himself [at] nicksfonts [dot] com for the special promotional code.</p>
