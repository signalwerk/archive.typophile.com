      <p>Kthomps5 and Dpape. Thank you both for the reply! </p>
      <p>Yes the Hubert Jocham Double U Serif  looks to be a match. </p>
      <p>Although the "e" doesn't seem to slant up and the dot of the "i" looks higher up. Those details may be custom to the headline. I'm calling it mystery solved.</p>
      <p>Many thanks again. I love the Typophile folks. </p>
      <p>JC</p>
