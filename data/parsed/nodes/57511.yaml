    <p>I was looking at the Charis font, and in the features, found</p>
    <p>feature rlig { # Required Ligatures<br>
     # from AAT 'morx'; type 1, sel: 0, cvrg: 20000002<br>
     # Latin<br>
    lookup rlig35 {<br>
        sub equal uni0338 by notequal;<br>
        sub A acutecomb by Aacute;<br>
        sub A gravecomb by Agrave;<br>
        sub A uni030F by uni0200;<br>
        sub A uni0302 by Acircumflex;<br>
        sub A uni0311 by uni0202;</p>
    <p>etc. . .</p>
    <p>Is this considered appropriate for rlig, or should it really be in a ccmp feature? Does anyone care? (Hey, at least I didn't ask "What does it all mean?")</p>
    <p>BTW, does anyone know of a discussion forum for working on Charis?</p>
    <p>TIA,</p>
    <p>Charles</p>
