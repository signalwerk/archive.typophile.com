    html: |-
      <p>Thanks, Adam. I made the change and the features file (as seen by FontStudio) is much better.</p>
      <p>Perhaps there is another switch that I need to change? With neither setting did the lookups come through, so of course the features won't compile.</p>
      <p>I am trying to get Charis in shape to use for bookwork when the general topic is linguistics. I have made up a fair number of extra glyphs in Minion, but there are several problems, including (1) There are some glyphs I do not have the skill to draw well, (2) The final fonts cannot in any case be released to a customer for "repurposing," and (3) certain ideosyncrocies of Minion, such as the differing accents on caps from lower case -- make some people prefer a more regularized font.</p>
      <p>With kerning and old-style numbers, Charis should function well for linguistics. I notice SIL has just released a version with small capitals.</p>
      <p>If I have to start over with the OT features I will, but it seems a shame to not incorporate what has already been done.</p>
      <p>Thanks again,</p>
      <p>Charles</p>
