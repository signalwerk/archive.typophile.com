    <p>Can anyone suggest some good OpenType fonts that are good for running text and have good latin <em>and</em> classical greek character sets? </p>
    <p>Some examples would be Adobe's <a href="http://store.adobe.com/type/browser/P/P_1719.html" title="Check out the font" rel="nofollow">Minion Pro</a> and the new <a href="http://store.adobe.com/type/browser/landing/garamond/garamond.html" title="Visit Adobe's page about Adobe Garamond Premier Pro" rel="nofollow">Garamond Premier Pro</a>.</p>
