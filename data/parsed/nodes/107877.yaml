    <p>Dear all, I am working on developing a logo for a Korean exhibition.<br>
    I would like it to have a Korean feel and base it on a traditional yin yang, please see the attached image.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/klogo_4098.jpg"></div><p></p>
    <p>Could anyone please suggest any western typefaces that have a similar feel to the Korean symbols surrounding the yin yang in the attached image? (I would like to have the exhibition title going around the yin yang) Thank you very much in advance and any help is greatly appreciated!</p>
