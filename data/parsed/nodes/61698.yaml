    <p>Does anyone have a copy <em>TYPOS 5</em> published in 1982 by the London College of Printing? I’m looking for an article by David Rutt covering <a class="freelinking-external" href="http://www.katranpress.com/stamps_gill_1_1.html">Eric Gill’s postage stamp designs</a>. I actually have an <em>old</em> photocopy of this article, but am hoping to get some scans of the illustrations. I can’t find a copy locally (Boston) or even many mentions to this journal online. As always, any help or hints would be greatly appreciated. </p>
    <p>Michael</p>
