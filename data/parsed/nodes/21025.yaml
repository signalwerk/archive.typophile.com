      <p>This is a lot bigger issue than you may think.</p>
      <p>Web designers in every part of the world are at this very point using fonts that they've gotten bundled or preinstalled. They don't read EULAs because they don't probably even notice the licensing issue. This happens mostly because many web designers aren't that design-aware at all, and just mind about the technical issues.</p>
      <p>I've seen Windows computers that have everything from Baskerville to Bodoni (E+F) preinstalled in them, and people use them freely without regret. Be it personal or commercial work.</p>
      <p>And how about all those small companies that use all possible Arials and Verdanas (duh) in their ads and signage? How would they care about some fonts that came with the machine?</p>
