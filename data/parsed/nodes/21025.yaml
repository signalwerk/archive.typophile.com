    html: |-
      <p><cite>Thomas P. can comment better than I, but I am pretty sure that there are no restrictions on using Adobe bundled fonts commercially.</cite></p>
      <p>You can use Adobe's bundled fonts the same ways you can use Adobe fonts licensed separately. The only difference is in the minimum license (1 user versus 5 user).</p>
      <p>Given the huge number of various licenses out there, I'm sure there's *somebody* whose license says you can't use the bundled fonts in work you get paid for. But I don't recall ever seeing such a license, myself.</p>
      <p>Regards,</p>
      <p>T</p>
