    html: |-
      <p>Historically most EULAs of products that bundle fonts don’t call out any font specific usage rights or restrictions – the fonts are covered by the same restrictions as the main application or operating system – the standard stuff prohibiting redistribution, modification, reverse engineering etc., often the apps own functionality and settings in the fonts contradict the product’s EULA (eg. font embedding and printer-download). </p>
      <p>Also as its common sense that fonts are used to produce printed content this right has never really been identified. Interestingly Microsoft is changing this with font specific section in the Windows Vista EULA… </p>
      <p><cite>1 d. Font Components.  While the software is running, you may use its fonts (including software, metrics and data) to display and print content. You may only:<br>
      • Embed fonts in content as permitted by the embedding restrictions in the fonts; and<br>
      • Temporarily download them to a printer or other output device to help print content.<br>
      </cite></p>
    html_clean: |-
