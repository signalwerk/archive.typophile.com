    <p>Are there <em>any</em> restrictions in using typefaces bundled with software in commercial graphic design work?</p>
    <p>I'm mostly building websites, so I'm either using the typefaces in graphics or in Flash objects. The font files aren't distributed in any way, of course.</p>
    <p>How about books and print design? If you're on Windows, can you use e.g. Arial (duh) in a print project without getting a commercial license?</p>
    <p>I've purchased all my fonts so far, but am just curious.</p>
