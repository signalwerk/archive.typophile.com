    html: <p>There are two very good essays, one about Arabic and one about Hebrew, in <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1932026010/qid=1074703376//ref=sr_8_xs_ap_i0_xgl14/103-4402685-6125406?v=glance&amp;s=books&amp;n=507846"><i>Language Culture Type</i></a>. <br> <br>One of the best books I have on Arabic calligraphy is <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0197276040/qid=1074703432//ref=sr_8_xs_ap_i11_xgl14/103-4402685-6125406?v=glance&amp;s=books&amp;n=507846"><i>The art of the pen</i></a>, which not only shows a lot of wonderful stuff but also explains what you are looking at. The section at the back showing examples of the major calligraphic styles may be particularly useful for you.</p>
    html_clean: <p>There are two very good essays, one about Arabic and one about Hebrew, in <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1932026010/qid=1074703376//ref=sr_8_xs_ap_i0_xgl14/103-4402685-6125406?v=glance&amp;s=books&amp;n=507846" class="link-external"><i>Language Culture Type</i></a>. <br> <br>One of the best books I have on Arabic calligraphy is <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0197276040/qid=1074703432//ref=sr_8_xs_ap_i11_xgl14/103-4402685-6125406?v=glance&amp;s=books&amp;n=507846" class="link-external"><i>The art of the pen</i></a>, which not only shows a lot of wonderful stuff but also explains what you are looking at. The section at the back showing examples of the major calligraphic styles may be particularly useful for you.</p>
