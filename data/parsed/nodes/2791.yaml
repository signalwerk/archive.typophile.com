    html: <p>My book on Hebrew from Gabriel Mandel Khan (in Italian) arrived today, and I'm quite dissapointed. The images in the book are often not the original photos of bookpages, but are drawings, and they are quite small, so you can't see the letters well.  <br>And I also hoped that there would have been some info about STAM, the special hebrew script, that is used in the Thora, and that has to be written in consideration of special rules (to be kosher); but the book doesn't even mention STAM. <br>Can you tell me if the books above have information on STAM ??</p>
