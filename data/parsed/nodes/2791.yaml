    html: "<p><i>A copy of \"Art of the Pen\" arrived a few days ago.</i> <br> <br>I recently purchased the volume on <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0197276008/qid=1075684877//ref=sr_8_xs_ap_i12_xgl14/104-5398408-0701566?v=glance&amp;s=books&amp;n=507846\"><i>The Abbasid Tradition</i></a> from the same series, which covers the earliest Qur'anic manuscripts. As I'm able, I plan to pick up the other three volumes on Qur'anic calligraphy: <i><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0197276016/qid=1075685021/sr=1-15/ref=sr_1_15/104-5398408-0701566?v=glance&amp;s=books\">The Master Scribes</a>, <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0197276024/qid=1075684977/sr=1-2/ref=sr_1_2/104-5398408-0701566?v=glance&amp;s=books\">After Timur</a>,</i> and <i><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0197276288/qid=1075684977/sr=1-3/ref=sr_1_3/104-5398408-0701566?v=glance&amp;s=books\">The Decorated Word</a>.</i> There is also an interesting, if less visually stunning volume on the early examples of <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0197276059/qid=1075684977/sr=1-10/ref=sr_1_10/104-5398408-0701566?v=glance&amp;s=books\"> bills, letters and deeds</a> on papyrus.</p>"
