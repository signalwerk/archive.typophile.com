    html: <p>I've never seen <i>The Art of the Pen</i>. I'll take Mr. Hudson's word for it, but it seems rather steeply priced at the moment. I have a copy of Abdelkebir Khatibi and Mohammed Sijelmassi's <i>The Splendor of Islamic Calligraphy</i>, published by Thames and Hudson, which provides a decent catalog of styles. It was republished recently and is now far more affordable than the copy I got soaked by in Istanbul some years back.</p>
