    html: "<p>The best Hebrew calligraphy manual I've found is <i>Calligraphy: Hebrew Lettering</i> with examplars by Noah Ophir and text by Leila Avrin (who also wrote some good stuff on the calligraphy of <i>kettubah</i>, Jewish marriage contracts, in <i>Fine Print</i> magazine sometime in the 1980s). It was published by Tav (1993), in Jerusalem, but I've not seen it available from any North American sources. I picked up my copy from <a href=\"http://www.chb.com/company-47246826.html\">Falkiner Fine Papers</a> in London.</p>"
