    html: <p>Ine, the established rules for the formation of STAM are written in the <i>Mishnat Sofrim</i>. You can find a very good English summary of the rules, with examples, at Mordechai Pinchas' excellent sofer resource website. Here is a direct link to his pages on <a href="http://www.bayit02.freeserve.co.uk/html/alef_bet.htm"> The Formation of the Letters</a>.</p>
