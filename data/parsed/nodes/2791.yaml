  - id: 22249
    user: 1262
    date: 2004-01-21T17:30:00
    date_raw: 21 Jan 2004 — 5:30pm
    votes: null
    html: <p>Another very good book is TF Mitchell's <i> Writing Arabic</i>. This book focuses almost exclusively on the <i>ruq'ah</i> script, the most common daily handwriting style found in the Middle East, but it is the only text I've come across, apart from Thomas Milo's essay in <i>Language Culture Type</i>, that treats connectivity of the Arabic script as something other than collections of 'ligatures'. <br> <br>John B's recommendation of <i>The splendor of Islamic calligraphy</i> is a good one, which I'll second. Its catalogue of styles is not as complete nor as nuanced as that in <i>The art of the pen</i>, i.e. it misses a number of significant sub-styles, but it has many good examples of fine work. Perhaps a academic library near you has a copy of <i>The art of the pen?</i></p>
    html_clean: <p>Another very good book is TF Mitchell's <i> Writing Arabic</i>. This book focuses almost exclusively on the <i>ruq'ah</i> script, the most common daily handwriting style found in the Middle East, but it is the only text I've come across, apart from Thomas Milo's essay in <i>Language Culture Type</i>, that treats connectivity of the Arabic script as something other than collections of 'ligatures'. <br> <br>John B's recommendation of <i>The splendor of Islamic calligraphy</i> is a good one, which I'll second. Its catalogue of styles is not as complete nor as nuanced as that in <i>The art of the pen</i>, i.e. it misses a number of significant sub-styles, but it has many good examples of fine work. Perhaps a academic library near you has a copy of <i>The art of the pen?</i></p>
