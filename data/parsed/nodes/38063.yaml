    <p>I was going through an old PC, and stumbled across an archive of FUSE fonts that they used to post on their website during conferences.</p>
    <p>Whatever happened to FUSE? Is it still going and just something I’m failing to locate? The most up-to-date reference I could find is 1999.</p>
    <p>I quite liked all the “experimental” (illegible?) pieces of work they could produce quickly, if simply for nothing but their curiosity value.</p>
    <p>simon</p>
