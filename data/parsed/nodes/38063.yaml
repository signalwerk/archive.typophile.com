    html: |-
      <p>Odd, I have all of those (124 in total sitting now in Suitcase, waiting for *that* project) that FF are selling, and I *definitely* didn’t purchase them. </p>
      <p>I also remember the FTP servers they used as link outs from the website being notoriously slow as they were shredded when new faces went live with accompanying poster. It took me about 8years of successive FTP failures to get Moonbase Alpha, which I saw in Wired. Obviously if they were not all sold, the legality of use is now in question (CanYou I used I think). I could of course be dreaming the whole exercise. :/</p>
      <p>—rambling questions—<br>
      1. Wasn’t Blur initially a Brody face for FUSE or was it a separate project?<br>
      2. In another thread russellm said, “It could be an interesting exercise to use type to influence the mood of the reader and the way the book is read, like the sound track in a movie...”. FUSE instantly sprung to mind then in one of their poster sets...anyone remember?<br>
      —/rambling questions—</p>
