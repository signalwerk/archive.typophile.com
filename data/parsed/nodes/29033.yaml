    html: <p>Transferring is allowed by some EULAs. So, technically, yes, you could do the work and when you are finished transfer the rights of use to your client. Because I'm paranoid I would always call the foundry before licensing and let them know what I'm planning to do. Let them answer that it is ok. Cover all bets so to speak. Then when you are going to transfer the fonts, get back in touch with the foundry again and ask them how they require you to do it.</p>
