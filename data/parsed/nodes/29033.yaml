    <p>Hi, I want to purchase a font from myfonts.com for a client. I think that they generally sell licenses that allow a font to be used on 5 computers.</p>
    <p>My client should be able to use the font on a limited number of machines as well as I on one machine. Can I buy  a license over my myfonts.com account, so that the client can use it on 4 machines and I can use it on mine, or do I have to buy 2 licenses, which seems  a bit of a waste of money to me.</p>
    <p>If I didn’t use the font, could I still buy a license for my client? Or should they buy it themselves?</p>
    <p>Many thanks for answers.</p>
