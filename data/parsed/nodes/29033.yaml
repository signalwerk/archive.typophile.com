      <p>i know some eulas dont allow this, but - given its allowed by the eula - you could buy one license, design the whole stuff, delete the fontfiles from your computer (including backups) and then the client could install the font - right?</p>
      <p>of course problems will come up if you have to design something for them again, and they have to delete all the fonts on their computer, give you the license, you do it, and the whole thing starts again… but i work for many startups and getting them to pay for ANY font is hard - this could help ("lets just take arial", erm).</p>
