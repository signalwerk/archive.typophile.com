      <p>Not sure what you mean by the first question. </p>
      <p>For the second one VOLT can’t currently convert OpenType Layout tables (GSUB, GPOS etc.,) into its own source format so it removes them when you open a font. </p>
      <p>You could use a tool like FLAB to export a font + VOLT source tables - although in our experience this gives mixed results.</p>
