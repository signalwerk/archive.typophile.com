    html: |-
      <p>David, </p>
      <p>The *whole point* of “Ship Font” in VOLT is to strip the private VOLT tables from the font. If you don’t want to do that, just use Save. </p>
      <p>VOLT strips existing OTL tables from a font when opening it because the purpose of VOLT is to create new OTL tables from the private VOLT data that the user edits. </p>
      <p>Perhaps I’ll ask: </p>
      <p>1. Why do you want to use “Ship Font” while retaining the private VOLT tables? </p>
      <p>2. Why do you want to keep existing OTL tables when opening a font in VOLT? </p>
      <p>Regards,<br>
      Adam</p>
