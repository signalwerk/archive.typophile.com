  html: |-
    <p>I just upgraded my FontLab studio. When I compile features I get this type of warning now about the aalt feature:<br>
    [WARNING]  feature 'liga', referenced in aalt feature, either is not defined or had no rules which could be included in the aalt feature.<br>
    It still compiles, but has something changed about this feature?</p>
