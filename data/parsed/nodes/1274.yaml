  html: <p>We're happy to announce the first in a series of monthly desktops that we're calling the Typophile Calendars, available at <a href="http://www.typophile.com/downloads/" target="_top">http://www.typophile.com/downloads/</a> <br> <br>July 2002 kicks it off with a reproduction of a letterpress study by  Bauhaus designer Alma, available in both 1024x768 and 1152x768(widescreen).  <br> <br>Born in St. Petersburg, Russia, Alma was accepted to the Bauhaus textile design program in 1928 and produced a  variety of compelling work under instructor Josef Albers. Two years later, she left the Bauhaus early to pursue her own endeavours.  <br> <br>For more on Alma and her contribution to graphic design, we encourage you to visit <a href="http://www.almaconservancy.org" target="_top">http://www.almaconservancy.org</a> <br> <br> <br>We welcome your collaboration for the Typophile Calendars. Send your desktops to <a href="mailto:submissions@typophile.com">submissions@typophile.com</a>.  <br> <br>Please include your name, country, and the composition's historical context, if any.  <br> <br> <br><a href="http://www.typophile.com/downloads/" target="_top">http://www.typophile.com/downloads/</a></p>
