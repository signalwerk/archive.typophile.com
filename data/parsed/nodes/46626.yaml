  html: |-
    <p>From <a href="https://web.archive.org/web/20080907170148/http://blankislikeblank.com/">Blank is Like Blank</a><br>
    - You shouldn’t stay in the same position for too long.<br>
    - If it’s good, it transcends language.<br>
    - Working in the industry will affect your family life at some point.<br>
    - It creates careers for art-school dropouts.<br>
    - The same concepts are endlessly recycled.<br>
    - You fast-forward through the boring stuff.<br>
    - The Internet took it to a whole new level.<br>
    - It’s hard to transition out of.<br>
    - They both have weird self-congratulatory award shows.<br>
    - Only the people who create it are delusional enough to call it art.</p>
