    date_raw: 3 Oct 2012 — 3:17pm
    votes: null
    html: |-
      <p>It’s not specifically a “whitelist” per se — I used the term generically. An admin can assign a special role that we use to let certain accounts that are constantly flagged for no good reason to bypass the antispam checker when they post. </p>
      <p>We see blatant spam because the antispam module is not perfect and leaves much to be desired — i.e., it gives periodic false negatives. And it also gives occasional false positives.</p>
