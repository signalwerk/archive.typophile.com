    html: |-
      <p>&gt; and whitelist your account</p>
      <p>I doubt if there is a whitelist. The main purpose of a whitelist is to distinguish between posts that should appear immediately and posts that need to be reviewed first by a moderator before appearing (like a post from a brand new account that might be spam).  Since we see blatant spam sometimes, it's clear that first-time posts are not being reviewed, so this method isn't being used.</p>
