    html: <p>Si, that BBC article reads more like the stuff of horoscopes -- hard to take too seriously. (Then again, it's just the article and not the actual study.) <br> <br>I can't help thinking of color psychology as it may relate to the subjective area of type selection. Those color studies are interesting and have merit, but I rarely defer to them as 'truth.' I would have to consider any psychology of typography study in the same way (especially if it's as trite as the suggestion to "use Courier for a resignation letter.") <br> <br>For example, we've been culturally trained to believe red is the color of love (valentines day, roses). But color psychology suggests that blue is the color of love (private, caring) and that red is the color of power (can't argue with that). We've been culturally trained to recognize blue as corporate (stable, trustworthy). We tend to think of yellow as bright or warm (fresh or sunny) while color psychology suggests yellow represents control or conflict. <br> <br>So, these readily contradict each other. Both of them may be right in their own way, in their own context. For me, the selection of color (and type for that matter) are all about the context and the audience.</p>
