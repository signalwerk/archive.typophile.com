    html: <p>Testing the link, I noticed that it works better if you set Acrobat to show you the pages as spreads.  <br> <br>What the text completely lacks is my stance on curent design trends, from oliver vaughan to stefan sagmeister and my thesis that we live in an overdesigned, emotionally supercharged world in which emotion-by-design has become an all-too-important salesfactor and that as designers we have to ask ourselves if it is okay to be just another cog in the turbocapitalism machine, basically producing more literally waste and keeping a dying over-consumption-system artificially alive. In the 90s we were all happy for better and more design, currently I'm not so sure anymore. Emotional design has become a manipulative tool in the wrong hands.  <br> <br>Errr, political ranting apart... I also have some english texts on emotional design, but they're rather focussed on product design and stuff like that. If you want, I can zip them and upload them on the server so you can download 'em.  <br> <br></p>
