    html: "<p>Type &amp; Layout: How typography and design can get your message across - or get in the way <br>By Colin Wheildon  <br> <br>This is a recent work, very practical for art directors who are interested in getting the text read, rather than just looking good. <br> <br>Wheildon is an ad man, using direct marketing as his laboratory, just as the famous Claude Hopkins (1910s) and David Ogilvy (1950s) did before. What they would do is a split run, and vary one typographic feature between the two (say do one half in serif face, and the other sans) and see which got the better response. <br> <br>However Nikolaj, you seem to be interested in the emotional effects of typography. <br>Usually, pyschologists and researchers such as Wheildon look at the mental mechanics of reading, in particular legibility and readability. <br> <br>And there's a reason for that. <br>Any piece of typography has so many variables, that it would be impossible to isolate, in an experiment, the emotional effect of: <br>-typeface <br>-leading <br>-alignment  <br>-measure <br>-size <br>-page layout <br>and of course there is the meaning of the text to consider. <br> <br>This is the preserve of art and design, not science. <br> <br>I feel your need. It seems that most writing about typefaces discusses: <br>- historical reference <br>- description of features/classification <br>- technology <br>- politics of design <br>- cultural theory <br>- readability/legibility <br>- circumstance of its design process <br> <br>I've written a lot about typefaces, but it's very analytical (note my penchant for lists), and that seems to be the norm -- journalistic, commercial. So, which writers let the subject get under their skin? <br> <br>Jon Coltz, for one, at daidala.com <br> <br>Any other suggestions?</p>"
    html_clean: "<p>Type &amp; Layout: How typography and design can get your message across - or get in the way <br>By Colin Wheildon  <br> <br>This is a recent work, very practical for art directors who are interested in getting the text read, rather than just looking good. <br> <br>Wheildon is an ad man, using direct marketing as his laboratory, just as the famous Claude Hopkins (1910s) and David Ogilvy (1950s) did before. What they would do is a split run, and vary one typographic feature between the two (say do one half in serif face, and the other sans) and see which got the better response. <br> <br>However Nikolaj, you seem to be interested in the emotional effects of typography. <br>Usually, pyschologists and researchers such as Wheildon look at the mental mechanics of reading, in particular legibility and readability. <br> <br>And there's a reason for that. <br>Any piece of typography has so many variables, that it would be impossible to isolate, in an experiment, the emotional effect of: <br>-typeface <br>-leading <br>-alignment  <br>-measure <br>-size <br>-page layout <br>and of course there is the meaning of the text to consider. <br> <br>This is the preserve of art and design, not science. <br> <br>I feel your need. It seems that most writing about typefaces discusses: <br>- historical reference <br>- description of features/classification <br>- technology <br>- politics of design <br>- cultural theory <br>- readability/legibility <br>- circumstance of its design process <br> <br>I've written a lot about typefaces, but it's very analytical (note my penchant for lists), and that seems to be the norm -- journalistic, commercial. So, which writers let the subject get under their skin? <br> <br>Jon Coltz, for one, at daidala.com <br> <br>Any other suggestions?</p>"
