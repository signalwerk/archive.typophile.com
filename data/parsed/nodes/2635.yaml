    date: 2004-01-14T11:09:00
    date_raw: 14 Jan 2004 — 11:09am
    votes: null
    html: <p>It's not so much the bad company hing that iffs me, but that design -- rather than complementing a good product -- has turned out to be a false promise in itself. We buy things because OF their emotional design, despite the fact that technically they may not even work as good as a less-overdesigned product (take the Starck lemon-sueezwer or the Starck 1 wash-basin, take Ray Gun...). Also, I think that design has become THE most important marketing factor for products in an oversaturated market. Thus we have the 103rd detergent that is EXACTLY as good or bad as the other 102, yet it has a different design and thus feigns to be different. The same goes for any kind of product and many companies, generally. By this, we actively prolong a system, that in the end is anti-ecological and in many ways also economical nonsense. This, imo, is NOT what design is about. (Although, of course nonsense is always cool... so... ) <br> <br>I think we need less emotion in our design, but rather a keen, maybe even intellectual, journalistic approach to what we do. Content first, seduction only as a means to promote positive content. </p>
