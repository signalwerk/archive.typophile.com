      <p>It might be Durer Caps from P22 –<br>
      <a href="http://www.p22.com/ihof/font.asp?font=durercaps&amp;face=durercaps" title="http://www.p22.com/ihof/font.asp?font=durercaps&amp;face=durercaps">http://www.p22.com/ihof/font.asp?font=durercaps&amp;face=durercaps</a></p>
      <p>Matt, if neither you nor the Mardensteigs have registered "Pacioli" as a trademark, there should be no legal problems in terms of your distributing a font by that name. If someone else has registered the name, they could claim infringement. You could register the name yourself, but you might have to prove that it could not be confused with any other typeface name.</p>
