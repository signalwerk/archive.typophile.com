      <p>Muz, There are definitely some optical issues with the forms, but that is the result of being built by a mathematician and not an artist. I decided to keep it true to the original form rather than fixing things like that.</p>
      <p>Chris, I wasn't aware of Mardersteig's capitals. I'm fairly certain that there are no other retail fonts currently on the market with the name pacioli, though.</p>
      <p>Aziz, I don't think that is my version. The grid lines appear to be thicker.</p>
