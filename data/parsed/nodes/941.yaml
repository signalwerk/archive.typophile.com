    html: <p><img src="http://www.typophile.com/forums/messages/29/14274.gif" alt="blazium-revisions"> <br> <br>Here are some revisions. I like the new symmetrical W loads better than the original, so thanks for encouraging me to lose the top <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>The solid bar letters are nicer than I thought they would be. I can use the broken bar for lowercase alternatives. <br> <br>Does opening the 4 and/or narrowing the gap help at all? <br> <br>The P is a bit of a problem area at the moment. If I gain legibility then I lose seventies future vision :/  Not sure what to do with it; every new idea makes it look like an R.</p>
