    html: <p>Fun stuff! (Soylent Green turns out to be people, by the way.) <br> <br>I have a hard time deciphering the 4 and the P -- they're the only characters where the black shape at the bottom is supposed to be read as part of the letter, rather than just serving as a decorative device. And I agree with Cristian's comments about the W -- looks like an M to me.</p>
