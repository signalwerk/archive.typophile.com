  html: "<p><img src=\"http://www.typophile.com/forums/messages/29/14231.gif\" alt=\"blazium\"> <br> <br>Hi, this is my first go at a critique! My fingers are quivering as I type <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>My views: I'm pretty happy with it, it smells of lovely \"Logan's Run\"-style gleaming computing. <br>I'd like to keep it monospaced but the T irks me. The W is maybe going too far?  <br> <br>Any thoughts or advice would be greatly appreciated!</p>"
