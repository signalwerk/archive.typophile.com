    html: "<p>Hi Cristian, <br> <br>Thanks for the comments! <br> <br>1 - fair enough. The K looks a bit sharper than it actually is, but I agree they need to be more rounded anyway. <br> <br>2 - I can lose the W top. But I like the 4: I wanted something similar to the 4 in Data 70. I'll try it out though. <br> <br>3 - this was a definite style decision. The broken bar gives it more of a computer/MICR feel. Your suggestion gives more unity, but at the loss of some of the flavour I was after. <br> <br>But hey, I'll try out your suggestions and post up some alternatives soon.</p>"
