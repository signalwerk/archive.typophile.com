      <p>Hi Ricardo,</p>
      <p>I was thinking about handmade typeface to reflect the process of cleaning as "hand made" activity. That's why I created those two hands. I don't want the logo to look trendy. I'm far from that. I just wanted to put more energy in it and make both the sign and typeface looking consistent.</p>
