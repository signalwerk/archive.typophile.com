    <p>Hi,</p>
    <p>I'm designing a logo for a cleaning company but can't deside on typeface.<br>
    I know it should be clean, professional and "white" but on the other hand I'd like it to be more funky and handmade-like.<br>
    Any suggestions much appreciated.</p>
