    <p>Hi, I'm trying to develope an identity for a company.  Its gotta be very ornate, oppulent, luxurios etc.  I'm trying something with letters that weave in and out of each other</p>
    <p>You know, kind of like the TDC logo, but in a straight line.  And a little more elegant.</p>
    <p>The letters are "PBS"</p>
    <p>I started sketching the idea</p>
    <p>I originally was using baskerville, but its too heavy to properly interweave the characters with each other.</p>
    <p>Any advice?</p>
