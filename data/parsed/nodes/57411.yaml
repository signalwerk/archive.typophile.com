    html: |-
      <p>The font that immediately sprang to mind seeing your sketch was Parsons, available in digital form as <a href="http://new.myfonts.com/fonts/nicksfonts/parsnip-nf/" rel="nofollow">Parsnip NF</a>. This will give you a very old-school flavor, perhaps not what you're looking for.</p>
      <p>In the original, there are lots of alternate characters and long extenders, but none for the caps P, B, and S specifically. In general, that kind of thing would make it easier to weave.</p>
      <p>Probably just a wacky idea, but maybe it leads you somewhere.</p>
