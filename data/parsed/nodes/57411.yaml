    html: |-
      <p>A designer is one who understands when to do what where with whom how and why. So you are way out of line, paragraph.</p>
      <p>Andrew,<br>
      You need a font with not to many thicks and thins and some jaunty serifs. A little of personality for each of them ideally. I would suggest you go find some examples of old wood type (think dada-esque) and just rifle through till you find "the one". I don't know where in your town you might be able to do that, but that's where you step in. Am I on the right track?</p>
