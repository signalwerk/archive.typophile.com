    html: <p>I did call Minion fussy on these boards. Then I got Minion Pro, and found it not fussy. I just now took the trouble to try to compare the letter forms large.  <br> <br>Minion Pro slightly thickens the serifs at the tips. I think that did it. To me the original was a little too calligraphic in its finish.  Minion Pro is also very subtly refitted, but you can definitely notice the difference when you set text in both as I have - Minion Pro is more compact, and the color is better.  <br> <br>Fussy to me is decorative elements that don't harmonize with the overall design. In this case, I think it was the sharper serifs (same length) that were to me fussy. I first got on these boards to ask about Minion, and felt pretty happy later when I found out that Slimbach had corrected just what I had felt was wrong, but couldn't put my finger on.  <br> <br>I think that the Victorian period had a lot of fussy design, but this may be more true of the later Victorian periond - I don't know enough of the history.  <br> <br>I also said I find the serifs in Hoefer's Requium fussy - apparently I'm the very distinct minority.  <br> <br>I am not against ornament, but I think it is hard to bring off well. When it is brought off well it is breathtaking, a tour de force. Probably it is out of place in text type.   <br>  <br> <br>   <br> </p>
