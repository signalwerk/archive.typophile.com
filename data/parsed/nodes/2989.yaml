  html: <p>What exactly does it mean for type to be "fussy"? I've seen the term used in Typophile discussions as well as other sites. Any other terms I should be aware of? <br> <br>Thanks, <br>Addison</p>
  html_clean: <p>What exactly does it mean for type to be "fussy"? I've seen the term used in Typophile discussions as well as other sites. Any other terms I should be aware of? <br> <br>Thanks, <br>Addison</p>
