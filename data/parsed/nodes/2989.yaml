    html: <p>Good question. I myself don't hear it too often (fortunately), although recently on SpeakUp (which I rarely frequent, only because I have to draw the line <i>somewhere</i> :-) somebody was defending the use of Times because it "wasn't fussy". Which is pretty funny because Times is strongly self-conscious - in a way it's really a display face. <br> <br>I don't think you'll get a consensus, just a vague feeling. <br> <br>To me it means "detailed" in a self-conscious way. Minimalists like their bread dry, and they tend to confuse the power of expression with fussiness. <br> <br>A more focused term might be "mannered", which is actually used in a sufficiently coherent way by a number of designers. <br> <br>hhp <br></p>
