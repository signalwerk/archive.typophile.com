      <p>It would be interesting to compare those books printed in Minion and Minion Pro, if anyone knows.  <br> <br>I have compared the outlines of <!--attachment: minion_pro_vs_minion-25884.pdf*mime_pdf.gif*application/pdf*438.3*Minion+Pro+vs+Minion+*minion+pro+vs+minion%2epdf --></p><center><br>
      <table border="1"><tbody><tr><td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf">Minion Pro vs Minion <br><a href="http://www.typophile.com/forums/messages/30/minion_pro_vs_minion-25884.pdf" target="_blank"><b>minion pro vs minion.pdf</b></a> (438.3 k)</td></tr></tbody></table>
      </center><!--/attachment--> at 300 pt, set with Illustrator CS.  <br> <br>I find it quite interesting, having seen the effect on the set type, and knowing that Slimbach is a master who here had another crack at improving the type for fit and color, a number of years later. <br> <br>You will notice that the serifs and thins are noticeably thickened, and that the o is not only thicker, but narrower. The overall effect when set is that the type is sturdier and sets narrower. The new Pro regular now sets nearly as compact as the old display weight, which was lighter than the old regular. <p></p>
