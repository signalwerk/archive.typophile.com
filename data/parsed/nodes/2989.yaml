    html: <p>Hmmm... I've heard Minion referred to as fussy -- I always considered it a pretty good text face. Realizing that "fussy" is probably somewhat subjective, it appears that "fancy" and "showy" could be interchanged. Are types like Bodoni and Fleischmann considered "fussy" or are they simply not good for long text? I suppose it would apply only to types that attempt to be suitable for longer reading.</p>
