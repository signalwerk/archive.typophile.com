    date: null
    date_raw: null
    votes: null
    html: <p>I equate fussy with 'over-designed' or even 'unskillfully tweaked'. But it's usually in the details. I also think of a design that's focused on details but not the whole picture. For example, the type may all be nicely set, but all the typeset elements are competing because no clear decision was made as to what was and wasn't important.</p>
