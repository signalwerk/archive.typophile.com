    html: <p>According to the Adobe web site, Minion was released in 1990, and Minion Pro in 2000. In between, I believe, a multiple master version was sold. What I find most interesting about this is that in the ten years, evidently Slimbach concluded - probably from feedback or experience with other faces - that digital text type should be slightly darker than he had originally thought was appropriate.   <br> <br> <br> <br></p>
