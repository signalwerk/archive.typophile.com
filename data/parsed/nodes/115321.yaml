      <p>The postscript name is EPSON-KYOKASHO<br>
      NameID=7 EPSON 教科書体Ｍ and EPSON-KYOKASHO is a trademark of SEIKO EPSON CORPORATION.</p>
  - id: 574924
    user_id: 18942
