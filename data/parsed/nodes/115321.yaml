    html: |-
      <p>Epson Kyokasho has narrow characters in the ASCII range and the corresponding normal characters in the range uniFF01 to uniFF5D.</p>
      <p>If I extrapolate the digits in the two ranges by  160%, if I interpolate the uppercase characters by 50% and if I use the lowercase in the 0xFF31-0xFF5A range (except for m and w) I get the following, which is pretty close to your sample:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ThomasRenaut_6144.png"></div><p></p>
      <p>I could not find the EULA. The font can be extracted with unzip from an exe file found on the EPSON site <a href="http://www.epson.jp/download2/printer/driver/win/page/ttf30.htm" title="http://www.epson.jp/download2/printer/driver/win/page/ttf30.htm">http://www.epson.jp/download2/printer/driver/win/page/ttf30.htm</a> which is all in Japanese.</p>
