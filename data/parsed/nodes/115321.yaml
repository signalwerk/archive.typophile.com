      <p>If, like me, you never run exe files except from very trusted sources, you can use a procedure for applying WinRAR to extract the fonts without running the exe, as described by "Sham" in the Yahoo answer at <a href="https://ca.answers.yahoo.com/question/index?qid=20130523231027AAy7WJb" title="https://ca.answers.yahoo.com/question/index?qid=20130523231027AAy7WJb">https://ca.answers.yahoo.com/question/index?qid=20130523231027AAy7WJb</a><br>
      Worked perfectly for me on the exe mentioned by Michael.<br>
      Now to see if I can replicate his extrapolation &amp; interpolation result :)<br>
      Don</p>
