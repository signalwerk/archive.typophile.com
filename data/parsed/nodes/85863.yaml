      <p>For something similar to Din but a bit … well, different, try Interstate.</p>
      <p>Centro doesn't look that interesting to me. And I'm not sure how well it would go with Din. It would seem to go better with something like, well, Centro Sans. However, the combination might work very well.</p>
      <p>Even so, neither of these faces say "creative" or "IT" to me.</p>
      <p>Have you considered one of the bolder weights of <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100042" rel="nofollow">Ideal Sans</a>, which is solid but a bit quirky, with maybe something like <a href="/wiki/%28http%3A/%252Fnew.myfonts.com/fonts/adobe/warnock/" class="freelinking" rel="nofollow">Warnock</a> for text?</p>
      <p>A couple other suggestions for text:<br>
      Quadraat<br>
      Scala<br>
      Skolar</p>
      <p>Some suggestions for display:<br>
      Forza<br>
      Possibly good old Myriad?<br>
      Quadraat sans<br>
      Scala sans<br>
      Seria sans</p>
