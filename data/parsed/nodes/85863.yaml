    <p>Hi all.</p>
    <p>I'm relatively new to serious typography, I've known the basics for a while and happily stayed in my comfort zone using Helvetica, Futura and other essential fonts.</p>
    <p>However, I'm now trying to design a corporate look and would like to really utilize typography to get it right.</p>
    <p>It's an IT company with a creative side so I'd like the types to reflect that, but not be too "designery" since they are still rooted in hardcore systems design.</p>
    <p>The challenge is to find fonts that would work both in print/PDF and web (using font face). At the moment I'm leaning towards using PF Din Display Pro for headlines, most likely a light weight, and PF Centro Serif Pro for body text. My reasoning being that Centro is quite peaceful and sort of fades to the background while still being modern and fresh enough and DIN just looks nice as a headline font and is not Helvetica since I think I've overused it lately :)</p>
    <p>Any thoughts? My biggest fear is that the combination of DIN and Centro won't have enough tension, which would make the designs fall flat. Sorry I don't have any example pictures for you but I'm still in the early stages of wireframing and doing really basic design tasks but I'd like to get typography sorted early on in the design process.</p>
    <p>Thanks in advance,<br>
    P</p>
