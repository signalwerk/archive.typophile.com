      <p>Actually most text fonts (and certainly the good ones) allocate more of the vertical space to the ascenders than the descenders. This is mostly because of letter frequency. What fonts have you been looking at?</p>
      <p>By "too timid" I meant that the terminal of the descender could do a lot more than merely taper. It doesn't have to be huge though.</p>
      <p>hhp</p>
