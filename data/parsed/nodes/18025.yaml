    <p>Archive06 <a href="http://www.sta-archive.com" title="www.sta-archive.com">www.sta-archive.com</a> is the competition developed to recognize outstanding achievement in Chicago graphic design during 2005.  It’s different from other competitions because it:</p>
    <p>• focuses exclusively on Chicago designers,</p>
    <p>• signifies winners as leaders among Chicago designers,</p>
    <p>• promotes winners to Chicago’s design community,</p>
    <p>• promotes winners to Chicago’s business community, </p>
    <p>• and - most importantly - places winners in the Chicago Design Archive <a href="http://www.chicagodesignarchive.org" title="www.chicagodesignarchive.org">www.chicagodesignarchive.org</a> alongside Laszlo Moholy-Nagy, Frederic Goudy, Oswald Cooper and many other great typographers and designers.</p>
    <p>It’s sponsored by Chicago’s Society of Typographic Arts <a href="http://www.sta-chicago.org" title="www.sta-chicago.org">www.sta-chicago.org</a> – the fun, gracious, straightforward and accessible organization dedicated to preserving the traditions of Chicago design and building a vibrant Chicago design community. </p>
    <p>Deadline is March 17.</p>
    <p>Interested? Then check out the Archive06 page at www.sta-archive.com.</p><div class="imageWrap"><img src="http://typophile.com/files/STA-Archive06.gif"></div><p></p>
