    everythin	56	0.4157078168
    programme	54	0.4008611090
    &lt;Knghtbrd	49	0.3637443397
    </pre></blockquote>
    <p>By the way, the file I used to run through this was the BSD <code>fortune</code> command run 5000 times (fortune.txt in the attachments), so some of it might seem odd. You'll also find output similar to the above with the first 40 pairs, and all pairs. The first attachment is the script itself.</p>
    <p>To use the script, open up a terminal and <code>cd</code> to the directory you've put the script in. I haven't tested this on my Mac yet, but it should work. Note, the script require zsh and probably GNU coreutils. You'll want to change the name first. ('%' represents a prompt.)<br>
    <code>% mv pairs.zsh.txt pairs.zsh</code></p>
    <p>And make it executable:<br>
    <code>% chmod +x pairs.zsh</code></p>
    <p>Finally, to run it:<br>
    <code>% ./pairs.zsh LENGTH FILE</code><br>
    (Where LENGTH is the length of pairs, and FILE is what you wish to run the script on.)</p>
