    votes: null
    html: <p>Maybe the English language has changed, or perhaps it’s my memory, but the old reckoning listed <strong>e t a i n</strong> as the five most frequently used letters, and in that order. On the other hand, if “stardate” appears more frequently than “anything,” the text from which this data was mined is probably not terribly old school itself…</p>
  - id: 506663
    user: 39424
    date: 2012-04-22T13:59:00
    date_raw: 22 Apr 2012 — 1:59pm
    votes: null
    html: <p>Right, I didn't exactly choose the best text to mine this data from, just to test the script. Also, according to <a href="https://en.wikipedia.org/wiki/Letter_frequency" rel="nofollow">Wikipedia</a> (not that Wikipedia is the best authority), the most used letters in English are <strong>e a i n o</strong>.</p>
