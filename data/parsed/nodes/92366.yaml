    <p>Prompted by curiosity and <a href="http://typophile.com/node/5106" rel="nofollow">previous</a> <a href="http://typophile.com/node/91109" rel="nofollow">threads</a>, I've made a script that counts glyphs pairs, and lists them. I know it's been done <a>before</a>, however I wanted one with a little more flexibility. Unfortunately, because this is a shell script that uses old Unix tools like <code>grep</code>, there isn't really Unicode support. I'm going to have to rewrite it in something else in order to get that working better.</p>
    <p>So here's some sample output. The first column is the glyph pair. Second column:  count in file. Third: percentage.</p>
    <blockquote><pre>First 5 1 glyph pairs
    e	74725	10.9311960023
    t	52313	7.6526417727
    o	50175	7.3398830300
