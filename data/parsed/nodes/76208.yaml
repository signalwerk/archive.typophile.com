    date: 2010-11-11T06:43:00
    date_raw: 11 Nov 2010 — 6:43am
    votes: null
    html: <p>I can guess that this may be one of those clients who has a problem with communicating what he wants. Still, it's a fair bet that what he hates is the whole concept, so the problem isn't going to be fixed with any mere changes we could suggest to make it look nicer. And no matter what his problem with it is, there is significance in the fact that I'm looking at it and I don't know what the heck it is about. It's a fine diagram of a spinning stack of blank posters, though.</p>
