  html: "<p>There's plenty of info about kerning in the Fontlab manual, but very little about spacing, which is very important to get right before you start kerning. <br>I've been messing around with Fontlab for ages trying to figure out how to create the equivalent of Fontographer's equivalence classes. Fontographer had a very simple but effective way of  applying the same sidebearing values over a range of characters with similar characteristics, ie. take the sidebearing on the left of cap H (the base character, just H by the way, and not  _fog0, H) and apply the same value to the left of B, D, E, F, I, K, L, M, N etc. You could copy and paste the characters from the metrics window into the metrics assistance 'apply to these characters' line.  <br>Is there no way to do this in Fontlab? Is typing the characters the only way to do this? It can be particularly long-winded if, say, you are doing a Cyrillic alphabet and you have to type afii10058 (or whatever) for each character. <br>And another thing: I can't seem to delete a line once it's there - no delete possible? What happens if I want to get rid of the whole lot and start again/or import metrics from another font instead? <br>Also, when you click on the apply and save button the Metrics Assistance window disappears and you have to go and open it from the menu again. <br>It's all a bit clumsy and non-designer friendly, more aimed at programmers I'd say. <br> <br>I'd appreciate any help on this <br> <br>Thanks in advance <br> <br>Nick Cooke</p>"
  html_clean: "<p>There's plenty of info about kerning in the Fontlab manual, but very little about spacing, which is very important to get right before you start kerning. <br>I've been messing around with Fontlab for ages trying to figure out how to create the equivalent of Fontographer's equivalence classes. Fontographer had a very simple but effective way of  applying the same sidebearing values over a range of characters with similar characteristics, ie. take the sidebearing on the left of cap H (the base character, just H by the way, and not  _fog0, H) and apply the same value to the left of B, D, E, F, I, K, L, M, N etc. You could copy and paste the characters from the metrics window into the metrics assistance 'apply to these characters' line.  <br>Is there no way to do this in Fontlab? Is typing the characters the only way to do this? It can be particularly long-winded if, say, you are doing a Cyrillic alphabet and you have to type afii10058 (or whatever) for each character. <br>And another thing: I can't seem to delete a line once it's there - no delete possible? What happens if I want to get rid of the whole lot and start again/or import metrics from another font instead? <br>Also, when you click on the apply and save button the Metrics Assistance window disappears and you have to go and open it from the menu again. <br>It's all a bit clumsy and non-designer friendly, more aimed at programmers I'd say. <br> <br>I'd appreciate any help on this <br> <br>Thanks in advance <br> <br>Nick Cooke</p>"
