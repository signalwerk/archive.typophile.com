    html: "<p>Thanks for that Nick, but that only works one time. What I am trying to do is apply the same sidebearing values to characters with similar characteristics based upon the values of one character, so that if the sidebearings change on that base character the changes are applied to all the other characters. This ensures spacing consistency as you only change the value of the base character. <br>Take the word ILFRACOMBE where I is the base character. If I add more space around the I the whole word opens up like so: I L F RACO M B E apart from ACO which are not straight sided. <br>I have sussed put how to do it. It can be done in the Metrics Assistance panel under 'Tools', but lines can't be deleted here for some unknown reason. To delete an unwanted line you have open to the Collection/Classes panel in the top toolbar, select the line you want to delete in the 'classes' window and delete it there. It is called kerning classes, but is really the metrics class one sets in 'Metrics Assistance'. The incorrect terminology was confusing me. This info can then be saved as a .flc file by clicking the menu icon, which can then be used for other fonts. It's very long-winded initially but can save a lot of time in the long run. <br> <br>Phew! that's all for now.</p>"
