    html: |-
      <div class="comment-spam-body"><p>I do hope people note Akira's comment about OPTI.<br>
      For anyone who has not seen any of my posts about OPTI, here is the essential problem.<br>
      OPTI/Castcraft has a notorious reputation of as a forger of unauthorized clones of digital fonts.<br>
      A relatively small proportion of its fonts were original digital creations.<br>
      Unfortunately, even the original digital fonts by OPTI are probably unusable for publication. OPTI is a defunct organization and these fonts are orphans for which there is no way of obtaining appropriate intellectual property permissions.<br>
      If a poster considers that there never was a digital version other than the one created by OPTI, then any discussion of this font should make clear that the font is in effect unusable.<br>
      This problem comes up fairly often. See for example the discussion in <a href="http://typophile.com/node/122803" title="http://typophile.com/node/122803">http://typophile.com/node/122803</a><br>
      Don</p>
      </div>
