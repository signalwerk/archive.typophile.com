    html: |-
      <p><em>Bonus: slogans such as “We love wood and humans!”</em><br>
      Be sure to visit a couple of 100 yen stores for those, too:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/surely-use_4718.jpg"></div><p></p>
      <p>Apart from that, just walking around can already be total typographic input overload. I second the restaurants – <a href="http://homepage.mac.com/altairas_eye/.Pictures/tokyo03/DSCF0021_1.JPG" rel="nofollow">lettershapes everywhere</a>, some <a href="http://homepage.mac.com/altairas_eye/.Pictures/tokyo06/P1010548.JPG" rel="nofollow">beautiful calligraphy</a> (and/or <a href="http://homepage.mac.com/altairas_eye/.Pictures/tokyo06/P1010538.JPG" rel="nofollow">funky stuff</a>). But even just <a href="http://homepage.mac.com/altairas_eye/.Pictures/tokyo06/P1010515.JPG" rel="nofollow">stenciled signs</a>, <a href="http://homepage.mac.com/altairas_eye/.Pictures/tokyo06/P1010517.JPG" rel="nofollow">traffic directions painted on streets</a>, or LED signs are just… amazing. I found it especially funky how the different alphabets/scripts are combined and interchanged (like <a href="http://homepage.mac.com/altairas_eye/.Pictures/tokyo07/P1010677.JPG" rel="nofollow">here</a>).</p>
      <p>BTW if you're in/near Tokyo, and interested in graffiti: while Tokyo doesn't seem to have any really, <a href="http://homepage.mac.com/altairas_eye/.Pictures/tokyo07/P1010752.JPG" rel="nofollow">Yokohama does</a>.</p>
