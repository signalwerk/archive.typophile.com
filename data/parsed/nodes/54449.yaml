    html: "<p>Take a walk through a light industrial area. That's where the true Japanese font wonders lie. You'll find bizarre interpretations our our alphabet, grungy kanji stencil fonts and clunky scripts with descenders chopped off. Bonus: slogans such as \"We love wood and humans!\"</p>"
