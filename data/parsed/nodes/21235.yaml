    html: |-
      <p>About 6 years ago there was one lass at college who assumed everything you typed had to be done in Times New Roman as if it was an unwritten rule... I'm not sure why she thought this (maybe because it was the default choice in Microsoft Word) or why she joined the course, but she did leave a few weeks later. Perhaps she had a breakdown over the idea of using other fonts!</p>
      <p>Still, at least Microsoft are "experimenting" with another option as the default font. It'll probably involve lots of costly upgrades to the consumer, though. You know, will only work with XP Pro edition 2012 or something silly!</p>
