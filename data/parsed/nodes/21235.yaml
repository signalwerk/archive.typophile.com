    html: |-
      <p>From Word 2003 help - i typed "how do i change default font"<br>
      <cite><br>
      Set the default font   </cite></p>
      <p>If your document already contains text formatted with the properties you want to use, select that text. </p>
      <p>On the Format menu, click Font. </p>
      <p>Select the options you want to apply to the default (default: A predefined setting. You can accept the default option settings, or you can change them to suit your own preferences.) font. If you selected text in step 1, the properties you want will appear in the dialog box. </p>
      <p>Click Default. </p>
      <p>Any new document you open will use the font settings you selected.</p>
      <p>Note  The default font applies to new documents based on the active template (template: A file or files that contain the structure and tools for shaping such elements as the style and page layout of finished files. For example, Word templates can shape a single document, and FrontPage templates can shape an entire Web site.). Different templates might use different default font settings.<br>
       </p>
      <p>&gt;I wish Illustrator didn’t always default to Myriad.</p>
      <p>That's an Apple/Adobe co-branding thing - get with the iLife and iLive with iT :-)</p>
