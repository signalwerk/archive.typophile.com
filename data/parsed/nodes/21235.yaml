      <p>This article is silly. If the FOSS universe gets any nice new system fonts it will probably be in the same way MS Office does, by commission. There's no reason Novell, Sun or Google can't pay for fonts if the need arises. I think it's happened in the past. The oldest open-source myth is that the people who create it aren't getting paid. </p>
      <p>I predict that for 99.99% of consumers, the new fonts have no effect on whether or not they chose to use Microsoft Office.</p>
