    html: <p>Well this is going off-topic a bit, but the switch to Calibri isn't exactly an experiment. Of course Office 2007 hasn't shipped yet but the new default is still there in the latest beta, so unless someone has a serious change of heart we'll be seeing a lot more of that font in the future. Although the font will work 'down-level' it's definitely been designed for the latest rendering technology. There's plenty of information here and on the blogs if your interested - search on "Calibri"</p>
