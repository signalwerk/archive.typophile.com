      <p>True, not everyone'll like the short J. Same with the detached Q. It would, however, matter less in body text, which I intended to suggest. PT Sans might work, too, if you prefer a sans-serif there. Both have a caption style for the small text… and, boy, does it make a difference!</p>
      <p>Crimson in the logo looks pretty respectable to me. Sure, I'm not an expert, no matter how one stretches, twists or bends that term.</p>
