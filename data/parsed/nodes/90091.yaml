      <p>Dude, you shouldn’t run random stuff through FontSquirrel like that. Have you seen the checkbox with the big red bold text next to it in the bottom there? Besides, autohinting is crap. Bloated file size and lousy rendering.</p>
      <p><em>font design help</em><br>
      It’s not too clear from your post what exactly it is you are looking for. Do you want help designing a font? Are you looking for a font that is suitable for online use to go with your logo? Maybe <a class="freelinking external" href="http://www.webtype.com/font/poynterserifre-family/" rel="nofollow">Poynter Serif RE</a> (which can be self-hosted). In any case, quality isn’t free.</p>
      <p><em>ledgibeo</em><br>
      ?</p>
