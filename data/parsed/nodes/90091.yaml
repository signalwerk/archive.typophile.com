    html: |-
      <p><cite>This blog UI only uses FS font kits.</cite></p>
      <p>Are you sure? Maybe you should contact the creators of this blog UI and complain about such an arbitrary restriction.</p>
      <p><cite>I can generate font kits as long as they are not blacklisted.</cite></p>
      <p>I haven't checked, maybe Crimson's EULA allows this kind of use, maybe not.</p>
      <p>Since your comment reflects a common misunderstanding:<br>
      The fact that fonts are not blacklisted and that FS does not refuse to convert them does <em>not necessarily imply</em> that you are allowed to convert them. It only means that these fonts are ... not blacklisted (yet).<br>
      As Frode said, see FS's big red bold text and check the fonts' EULA. That is what matters, rather than whether fonts happen to be blacklisted or not.</p>
