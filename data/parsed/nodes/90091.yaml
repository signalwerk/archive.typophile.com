    <p>This blog has 30k words on it and needs to be ledgibeo. :)</p>
    <p>Here is a text page. <a href="http://www.josephvincentphotography.com/photographic-style/" title="http://www.josephvincentphotography.com/photographic-style/">http://www.josephvincentphotography.com/photographic-style/</a></p>
