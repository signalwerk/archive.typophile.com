    html: |-
      <p>I bought the boxed set. All 3 of them are wonderful.</p>
      <p>Logotypes and Letterforms:<br>
      It each page, it shows you the final logo, the font it was based on, and how it was customized.</p>
      <p>Fonts and Logos:<br>
      It's a deeply study of fonts styles subtleties. Great for type designers.<br>
      You will learn to look at fonts in a different way.<br>
      The chapter about script it's outstanding!!!</p>
      <p>Dangerous Curves:<br>
      It's more about the process of creating custom lettering. For each logo, it shows you the first sketches, how it evolved, the proposals presented to the client, how the logo was refined, and the final art.</p>
      <p>All 3 are excellent. And worth every penny.</p>
    html_clean: |-
