      <p>OK, here's my offer: you let me sell the Williams Caslon bundle myself, and I'll just give you your price+10%...</p>
      <p>Seriously: these days grocery stores will have two sizes of a product, where the per-weight/volume/count of the smaller one is nominally higher, but then they discount the smaller one and not the larger, making the smaller a better buy. And then they "helpfully" put the per-weight/volume/count cost on each one, but in different units! Like for cooking oil the smaller one will be in cents-per-ounce and the larger will be in dollars-per-gallon; for toilet paper one will be in dollars-per-sheet and the other in cents-per-square-foot! So you need to work a calculator (assuming you even know how many ounces are in a gallon or you're willing to use a ruler on buttwipes, in public) to make sure you get the best deal. So you give up and grab the big one because larger quantities are <em>supposed</em> to be cheaper. So they make more money - and you don't even realize it. Kinda like voting.</p>
      <p>hhp</p>
