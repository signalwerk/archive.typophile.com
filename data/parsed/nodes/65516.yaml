  html: |-
    <p>Master typographer Doyald Young has released THE DOYALD YOUNG COLLECTION, the boxed reference set of the celebrated graphic design icon's three acclaimed books on type, font and logotype design. Mr. Young is a recipient of the 2009 AIGA Gold Medal, is a Fellow of the AIGA, and is the Inaugural Master at Art Center College of Design, where he has taught typography and lettering for more than three decades.</p>
    <p>Check out the new boxed set Collection at his website:</p>
    <p><a class="freelinking external" href="http://doyaldyoung.com/DYC01.html" rel="nofollow">http://doyaldyoung.com/DYC01.html</a></p><div class="imageWrap"><img src="http://typophile.com/files/DoyaldYoungBookSet_5617.jpg"></div><p></p>
