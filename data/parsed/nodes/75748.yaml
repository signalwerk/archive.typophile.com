    <p>After 13 months of hard work, Iza W and Intellecta Design are proud to announce Penabico. This is a free interpretation of the copperplate script styles to be found in the Universal Penman.</p>
    <p>London, 1741, the monumental publication of engraved work by George Bickham (along with collaborators Joseph Champion, Wellington Clark, Nathaniel Dove, Gabriel Brooks, William Leckey and many others).</p>
    <p>This enhanced OpenType version is a complete solution for producing documents and artworks which need this kind of calligraphic script: More…</p>
    <p>100s of stylistic alternates for each letter (upper- and lowercase), accessed with the glyph palette;</p>
    <p>250 ornaments and fleurons (mostly in the copperplate roundhand renaissance style) encoded in the dingbats range and accessed with the glyph palette (plus a special set with over 50 of these ornaments accessed with the ornaments feature);</p>
    <p>an extensive set of ligatures (100s of stylistic and contextual alternates plus discretionary ligatures) providing letterform variations that make your designs really special, resembling real handwriting on the page;</p>
    <p>complete, intricate, ready-made calligraphic words;</p>
    <p>abbreviations (in many languages).</p>
    <p>The principal font contains the complete Latin alphabet, including Central European, Vietnamese, Baltic and Turkish with all diacritic signs, punctuation marks (including interrobang). The German ‘ß’ (germandbls, eszett, sharp s) even has over six different alternate forms. And we don't forget to add the unconventional germandbls uppercase.</p>
    <p>In non-OpenType-savvy applications it works well as an English commercial script style font. Because of its high number of alternate letters and combinations (over 1500 glyphs), we suggest the use of the glyph palette to find ideal solutions to specific designs. The sample illustrations will give you an idea of the possibilities. You have full access to this amazing stuff using InDesign, Illustrator, QuarkXpress and similar software. However, we still recommend exploring what this font has to offer using the glyphs palette.</p>
    <p>Two last things — we have placed some of the ornaments, catch-words and other material in supplementary fonts, for easier access in non-OpenType-savvy programs. They are: Penabico Words (see the pdf user guide in “Gallery”), Penabico Abbreviations (free font), and Penabico Extras (free font). And, when buying Penabico you get the 'Penabico EPS Bonus Set", a gift pack containing various highly intrincated frames in EPS format, easy and ready to work with your preferred vector design software like Corel or Illustrator</p>
    <p>See the entire power of Penabico at MyFonts.Com</p>
    <p>http://new.myfonts.com/fonts/intellecta/penabico/</p><div class="imageWrap"><img src="http://typophile.com/files/47751_6125.png"></div><p></p>
