    date: 2007-08-08T11:28:00
    date_raw: 8 Aug 2007 — 11:28am
    votes: null
    html: <p>That rule at the bottom of the second page of the spread doesn't serve any useful design purpose. If it's to indicate the end of a chapter, that's already obvious from the fact that the text doesn't fill the page. It is especially unnecessary if you choose the column alignment where the left column goes to the bottom of the page. But unless you plan to have a rule at the bottom of all pages, I would eliminate it in either alignment scenario.</p>
