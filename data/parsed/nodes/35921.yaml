    date: 2007-08-08T15:40:00
    date_raw: 8 Aug 2007 — 3:40pm
    votes: null
    html: <p>I tend to follow what Nick is suggesting. Or at least what I'm reading into it. I always protect against widows and orphans. It is, for me, more important that a thought begins and ends cohesively than the bottom of the page always align. I tend to like a little vertical rag, it helps add variety too.</p>
