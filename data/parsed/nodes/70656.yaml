  html: |-
    <p>For a branding project, I'm designing the corporate presentation template.<br>
    I want to know which format is better for online distribution &gt; PDF or PPT?<br>
       points to be considered :<br>
       1. The type rendering methods of microsoft PPT &amp; Adobe PDF. I found that in PPT especially at smaller sizes the typefacec is not rendered correctly. ( i'm using FF DIN / sapient &amp; Amplitude)<br>
       2. The document creator ( from my clients marketing dept -a non designer) has to use powerpoint to create the presentation &amp; then has to convert it into PDF ( since PPT dosen't embedd fonts)</p>
    <p>Pls help</p>
    <p>Amogh</p>
