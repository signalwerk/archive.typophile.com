    html: |-
      <p>Consider the EULA’s: </p>
      <p>Amplitude (Font Bureau)<br>
      Embedding of the Font Software is expressly prohibited. For the purposes of this agreement "embedding" shall be defined as the temporary duplication of the Font Software in formats that include, but not limited to the PDF, Flash, TrueDoc and/or other Web Embedding Font Technology ("WEFT") formats now in existence as well as any other format that may be created in the future.</p>
      <p>FF Din (Fontfont)<br>
      You may embed the Font Software in documents, applications or devices either as a rasterized representation of the Font Software (e. g., a GIF or JPEG) or as a subset of the Font Software as long as the document, application or device is distributed in a secure format that permits only the viewing and printing but not the editing of the text.</p>
      <p>I couldn’t find any typeface named Sapient, so I’m not sure about that.</p>
      <p>Essentially, FF Din allows embedding in a PDF document if it’s secured and Amplitude doesn’t. Power Point (in Windows) does not render your fonts incorrectly per se, just differently. If the fonts were hinted for screen, they wouldn’t look “wrong”. </p>
      <p>I think your best option is to stick with FF Din and export the presentation as a PDF, since embedding the fonts in a PPT would be a EULA violation (because you can edit the text). Viewing the presentation as a PDF would also rid you of the rendering problem.</p>
