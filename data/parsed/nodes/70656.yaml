    html: <p>If your goal to simply show &amp; explain the template, a PDF is probably the best solution. But an actual PowerPoint file template would certainly be a timesaver for the end users and would help compliance in that you could set it up with the logo (and any other mandatory elements) already sized and correctly placed, corporate colors, etc. Just don't embed the fonts unless the license agreement permits it (and you can't embed fonts in the Mac version of PowerPoint anyway).</p>
