    html: "<p>one tip I learned from my old boss if you are showing to a live group: he saved the PDF as a giant one-page jpg, and then opened it in Photoshop, which has smooth scrolling and zoom with the navigator tool. It worked well for the project we were doing, and the stage we were at (first pitch) because we were showing a large scale look and feel as well as the smaller graphic components.</p>"
