      <p>Are you designing for Sapient Corp. or someone else?  </p>
      <p>MS Office uses the OS’s rendering, which on newer versions of Windows is Cleartype. Adobe has it’s own rendering engine. </p>
      <p>You’ll have to contact Font Bureau with your request regarding Amplitude, but I’m sure they’ll be helpful.</p>
