      <p>Hei Frode takk for din interesse,<br>
      jeg har altså dette uferdige display-typsnittet som jeg gjerne skulle sett bli implementert,<br>
      ser at du har god greie på typo (grattis med gull i visuelt for Satyr forresten, utrolig godt håndtverk!)</p>
      <p>Om du er interessert i å ta tak i dette prosjektet så er du hjertelig velkommen til det! Jeg er jo ingen typograf, bare veldig glad i form (interaktiv designer i apt). Drops-typoen er jo ganske leken og løs i formen enn det du er vant til å jobbe med, men det kunne kanskje vært gøy å eksperimentere med for deg?<br>
      Og i så fall, vil du kikke på vektorfilene direkte eller skulle vi møttes over en kaffe en dag? Jeg er åpen for det meste :)</p>
      <p>Mvh,<br>
      Espen<br>
      99704631</p>
