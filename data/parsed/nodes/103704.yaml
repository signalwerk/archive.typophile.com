    <p>Hi,<br>
    I´ve started a quite interesting project on a font face that I´ve called "Drops", but I´m not skilled enough to<br>
    set the font as a working type face. It´s also not quite finished, so I´m looking for someone who´s interested in<br>
    finishing it for me.<br>
    You will be appointed as collaberative founder, and you will get paid by me if you can do the job right :)<br>
    Here´s a sample, let me know if you´re interested and I´ll show you the whole story...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/drops_4302.jpg"></div><p></p>
    <p>Regards,<br>
    Espen</p>
