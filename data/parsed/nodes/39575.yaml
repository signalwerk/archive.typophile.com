      <p>It does take a long time, but I create sets and then manually put all my fonts into it. Once you've set it up, it's easy to add fonts. Kinda like playlists in iTunes.</p>
      <p>My sets are:</p>
      <p>antique/distressed<br>
      calligraphy/uncial<br>
      check these out (for fonts I want to use soon)<br>
      condensed<br>
      deco<br>
      dingbats<br>
