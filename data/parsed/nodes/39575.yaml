    votes: null
    html: |-
      <p>"why aren’t tags built into fonts to make it easier?"</p>
      <p>The fonts actually contain that parameter, I mean PANOSE system codes, and there are font managers that can filter and sort lists using that codes as criteria. Unfortunately, foundries are not consistent in setting that PANOSE parameter.</p>
