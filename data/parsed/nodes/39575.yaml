  html: <p>I use font Linotype font explorer and Veenix font tools to manage my fonts. But still it takes forever to go through everything.  I have tons of fonts and wanted some suggestions on how others tend to search through their libraries to choose fonts. The best thing i can think of is to manually go through each font and tag meta data for searching. but that would take forever. why aren't tags built into fonts to make it easier?</p>
