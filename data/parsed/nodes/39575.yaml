    votes: null
    html: |-
      <p>Indeed... i find myself going to MyFonts more often than ever just to do a quick search for something like "chalkboard" -- when the results come up, I can almost immediately recognize some font(s) I have, then go into Font Agent and activate it/them.</p>
      <p>At present, I've got my library organized mostly by foundry... Adobe in one set, Bitstream another, etc, etc. Of course, I had to break my "Web" fonts into multiple sets, and they're still too huge. And I find myself creating job-specific font sets more often than I used to, and keeping them longer -- I keep re-using the "pirate" set I built two years ago.</p>
      <p>Organizing by style is one of my laundry-list things-to-do, but I fear I'll never get around to it; my biggest complaint/problem is that you can't permanently (or semi-permanently) tag fonts by style - sets you create in FontAgent/Suitcase/FontExplorer/etc are only good until you trash your system or upgrade... then you've gotta start all over again. The only way I can see to keep style sets organized thru catastrophes is to organize them in the Finder (by folder) in my master sets, but then I lose my foundry organization. And with 10,000+ fonts, I'm loathe to have multiple "master" sets (no pun intended).</p>
