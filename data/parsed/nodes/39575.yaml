    html: |-
      <p>You CAN save your Font Explorer sets - go to Configure -&gt; Load and save the file on a backup hard drive. Then when you upgrade or crash you can import it. Could have saved myself a ton of work recently had I known that.</p>
      <p>Organizing by foundry generally is less useful for me, as that is rarely my jumping off point when I'm choosing a font for a job. I don't say to myself "I think I'll use something from Emigre" it's more like "what's a good sans I haven't used recently?" or "what's an elegant serif that has an expert set". If I already know which font I want I just type to it. And I don't need job-specific sets anymore with self-activation (altho that isn't working for me in Quark right now). I also tend to leave fonts for current jobs open for the duration of the job.</p>
