      <p>So, building on this, could someone answer this question for me.</p>
      <p>I've known of Major Toy Companies who release a current Style Guide and throughout that Style Guide in various Art displayed on the pages, they will use x amount of fonts from various Foundries. They have bought them to display in their Style Guide, but the Style Guide might go out to a thousand supplier/makers on behalf of that Major Toy Company. At the back of the Style Guide they will have a list of the fonts and where to buy them.</p>
      <p>So say, someone (an individual supplier) is producing large bouncing balls...<br>
      He sees that he can get a Font from that Style Guide by also buying from the same Foundry.</p>
      <p>But then this Supplier goes ahead and produces 200,000 large bouncing balls with the Toy Company's Character/logo etc and the Font Designer's Font.</p>
      <p>In a License, how does the Font Designer protect him or herself from this mass usage of his Font?<br>
      The supplier's Graphic Design Department probably bought the Font as if they were less than a Commercial enterprise. The balls go to another part of the world were the Font Designer never sees them.</p>
      <p>Just life?...or can you have a clause against mass usage of a Font?<br>
      Is the original Major Toy Company liable?</p>
      <p>I'm new to Font Design and Font protection, so I'd love any feedback.<br>
      Cheers<br>
      Drj</p>
