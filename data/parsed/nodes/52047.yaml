      <p>Rican, Not many fonts cost 'hundreds of dollars'. Most are between $10-$50 depending on the character set and versatility.</p>
      <p>Rasendyll, Be careful giving that kind of advice (I acknowledge that you say you are 'not a lawyer') but the user must check the license (it may not allow off-site use) and if they have any queries about what they can do with the font, to check with the distributor or the foundry.</p>
