    <p>Hey everyone</p>
    <p>I thought this would be my best hope of settling a question raised at work.</p>
    <p>I'm putting together some brand guidelines for a client and the corporate typeface I'm proposing is Lineto's TYP1451.</p>
    <p>Now my client is sourcing numerous design companies to produce booklets, brochures and posters. My question is: Does each company working on their corporate materials have to purchase the typeface, or is it just a case of my client buying a multi-user license and supplying it on demand to each design company working on it...?</p>
    <p>Any help  on this issue would be greatlu appreciated!</p>
    <p>Thanks<br>
    M</p>
