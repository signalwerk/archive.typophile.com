      <p>Rican,</p>
      <p>I think the key to your question is the word probably.  Speaking as a designer (and not a lawyer) I'd have no problem with your client sending you the font for one off use on a project for them provided:</p>
      <p>1. They had sufficient licensing to cover the copy sent to you in addition to any others they might have in use.</p>
      <p>2. That you delete the font immediately the project is finished, and don't leave it sitting around on your system to 'probably' not be used - but then maybe come in useful for another project one day (say in three year's time) when you've forgotten all about where it came from in the first place.</p>
      <p>That said, I'm no lawyer and that's just my personal viewpoint, others may well feel differently.  In any event, the cost of purchasing a license yourself would seem to be an expense that can legitimately be passed on to the client.</p>
