      <p><cite>Does each company working on their corporate materials have to purchase the typeface…</cite></p>
      <p>Emphatically YES. And designers get really pissed when clients email us the fonts and claim that they don’t nneed to be paid for.</p>
      <p><cite>…or is it just a case of my client buying a multi-user license and supplying it on demand to each design company working on it?”</cite></p>
      <p>If you’re interested in that kind of license, you’ll need to work out a deal with Lineto. Contact them directly.</p>
