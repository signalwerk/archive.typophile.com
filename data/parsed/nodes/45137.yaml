    <p>a while back, I designed a web site for a group restoring a WWII Lancaster bomber. The site is due for some restoration, redesign and improvements. (they let the domain name laps) </p>
    <p>Any suggestions for fonts? </p>
    <p>web page text choices are obviously limited. So I just want it to be readable. A significant number of older viewers with dated operating systems. </p>
    <p>In addition to the site, I'll also be addressing a logo (or, perhaps more correctly, a badge), various page elements, some banners, and some merchandise things (hats, mugs, shirts etc.), where I'll have more freedom to pick and choose fonts. </p>
    <p>The airplane itself was built in Toronto in late 1944 and was in the Royal Canadian Air Force from 1945 to 1965. (interesting trivia: the Canadian-built Lancasters had round headed rivets, which made them 30MpH slower than their British-built counter parts with flush rivets.) It sat in a supply depot until the end of the war. In the post war years it was used variously in Cold-War anti-submarine patrols and search and as a rescue plane. It's being restored to 1945 condition and is and will continue to be an official war monument, so that's primarily the era I want to draw references from, with some things from the 50s and 60s thrown in for good measure. </p>
    <p>Thanks.</p>
