  html: <p>Greater Albion Typefounders have just announed the release of our next family 'Mellin'.  We've also announced discount offers on our two most popular families 'Bonning' and 'Vertrina'.  Details of these offers and previews of Mellin can be found on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  Alternatively, ou can try out the families concerned for yourself on <a class="freelinking external" href="http://new.myfonts.com/foundry/Greater_Albion_Typefounders/ " rel="nofollow"> MyFonts.Com</a>.</p>
