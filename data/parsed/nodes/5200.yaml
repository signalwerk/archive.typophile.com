    html: <p>Uhm, I don't get it either ... I was looking for a font, wanted to know its name, and Mike helped me out.  I don't see why I'm suddenly the font world's number one enemy (pardon if I "LOL" at that). <br> <br>I was being honest.  It DOES look better - to me.  Now, if I said "congrats for creating a wonderful ripoff font, more power to you, I'll download more of your work!" then I will understand the rabid flaming.  But I didn't ... I said it looks pretty good - to me.  I'm not lying.  It does.  Does that mean I support font stealing?  Now where did you get "that" idea? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I was looking for that font because I saw it used on a game manual (Blizzard Entertainment's Diablo 1 manual, to be exact, go sue flame them too, if you want, they even printed the damn thing using that font and exocet, haha). Well, anyway, I liked it, so I hunted for it.  Mike helped out, and I'm very thankful.  I also appreciate the trivia and comments by everyone here.  But remember that I am not the enemy here.  It's those terrorists! errr, font thiefs! <br> <br>Anyway, cheers people.  I had a jolly laugh, even if I was grossly misunderstood.  Thanks again Mike.</p>
