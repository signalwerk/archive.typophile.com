    date_raw: 14 Jun 2004 — 10:53am
    votes: null
    html: <p>This brings up a curious question for me. Let's assume for one moment that the glyphs are not just hacked up copies of Charlemange (although, that makes me question Mason as well, as it bears a lot of similarities to Chalemange as well, doesn't it?). If I'm inspired by a font I see, and I design a font that uses those characteristics, how is that theft? The laws in the US do not protect type design. They protect the software that allows one to use the font. It's not theft, it's a protected act that the patent office and copyright offices in the US have zero problem with.  <br> <br>I view this the same way I view copycat films in Hollywood. It's lame as an artist to create by slavishly copying, but it's not unexpected or illegal. <br> <br>(Yes, I know that not everyone here is from the US, and the copyright protection of font design is different outside of our little western nation.)</p>
