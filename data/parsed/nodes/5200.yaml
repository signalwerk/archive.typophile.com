    html: <p><i>Mark, Tolitz stated herself that the Diablo manual used Exocet. All the more reason to think that the accompanying font was legitimate.</i> <br> <br>Oops, I missed that, and I agree with you. <br> <br>If a designer likes a font, they will use it, and don't usually pay much attention to the pedigree. I don't really have a problem with that or even derivative fonts like Parish, in and of themselves. I do have a problem when someone tries to pass off such a font as an original work.  <br> <br>I do think derivative fonts should be allowed to exist somehow in a way that's fair to the original designers. There is certainly a demand for them. The one avenue that is allowed now in some licenses is that, if you have a legal copy of a font, you can make a derivative version for your own use. The problem is when you try to distribute it, which puts the maker of such a font in a very dubious and possibly illegal position. In an ideal world, Carol Twombly and Jonathan Barnbrook would get a cut of the proceeds from something like Parish. Or maybe there should be a requirement that, for example, anyone using Parish should have a legal copy of Charlemagne or Mason. In fact, there's no reason why people couldn't do this on their own now.  <br> <br>It's a little sticky with Parish in particular, though. The basic font data seems to me to have come from Charlemagne. The designer then took ideas from Mason and applied them to Charlemagne. I think taking the basic font data from Charlemagne is very different taking visual ideas from Mason. The first is more to do with software copyright, the second is more about artistic integrity. Software can be protected legally. Ideas usually can't (except by patent). I wonder if </p>
