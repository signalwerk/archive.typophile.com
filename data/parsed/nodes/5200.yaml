    html: <p>I'd like to see a bezier-by-bezier comparison of Ma(n)son, Parish, and Charlemagne to see exactly where the thefts occurred. <br> <br>For the record, I didn't think Yves' message was a personal attack -- it was an attack on the attitude of laughing (that's what LOL means, Jose -- "laughing out loud") at the idea that after all the stealing, the end result was actually preferable, which connotes a kind of tacit acceptance of the theft. <br> <br>That's kind of why I'd like to see the beziers -- it's one thing to steal an idea ("good artists borrow, great artists steal") and improve on it; it's quite another to simply steal another's work, customize it a little and then call it your own. <br> <br>For example, Carol Twombly didn't come up with the ideas for Charlemagne (or Trajan, for that matter) out of thin air -- they're based on forms from history. She built on those ideas and created something both respectful of history and original at the same time. <br> <br>If the Parish designer printed out the Charlemagne and Mason sets, then traced them, added the Mason-inspired accents to the Charlemagne forms by drawing them on the paper, then scanned it in and did every bezier from scratch, then I wouldn't really have a problem with it. But if the designer simply converted Charlemagne and Mason to outlines, then modified the beziers, I'd be much more upset about it. <br> <br>Finally, if it is an outright theft, as it looks like it is, it doesn't matter how hard the font is to find. The legal argument about international copyright is immaterial to me; it's a breach of professional ethics, especially to turn around and charge for the theft. </p>
