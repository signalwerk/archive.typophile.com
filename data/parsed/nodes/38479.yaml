    <p>Howdy All -</p>
    <p>I've got a customer who's saying they need to use ADA Compliant fonts, but doesn't actually have any clue what specifically makes a font ADA Compliant. I did a Google search and found little to no useful information so I was hoping some of you might have some experience with this. Does anyone know what the ADA Guidelines RE: Fonts are?</p>
    <p>Thanks!</p>
