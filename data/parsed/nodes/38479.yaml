    html: <p>I work in the museum exhibit design industry. Accordingly, I work with ADA guidelines often. ADA is vague regarding specific fonts. Its more about size, placement and contrast. Essentially, use common sense. Consider the needs of your audience. Avoid decorative fonts and generally be a responsible, helpful graphic designer. If the project is related to type in an environment, the Smithsonian has developed a more comprehensive set of guidelines. They would be ADA compliant.</p>
