      <p>There are a few folks on Typophile who have a bit more experience than I, so I'm sure they'll add or correct as needed:<br>
      Although the ADA is vague about specific fonts, there are a couple of things to check when picking a font. See this part of the spec:<br>
      <a href="http://www.usdoj.gov/crt/ada/reg3a.html#Anchor-10133" title="http://www.usdoj.gov/crt/ada/reg3a.html#Anchor-10133">http://www.usdoj.gov/crt/ada/reg3a.html#Anchor-10133</a></p>
      <p>The font should be "sans serif or simple serif type", and as far as proportions:<br>
      "Letters and numbers on signs shall have a width-to-height ratio between 3:5 and 1:1 and a stroke-width-to-height ratio between 1:5 and 1:10."</p>
      <p>What falls into "sans serif or simple serif type" is not spelled out, but the proporitons should give you an idea. The basic idea is to steer you away from fonts that are too thin or too thick.</p>
      <p>Jason C</p>
