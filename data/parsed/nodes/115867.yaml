      <p>I would call these constraints-based design, rather than algorithmic.<br>
      After all, PostScript, which is the medium in which almost all typefaces are now designed, is inherently algorithmic. Interpolation, for instance, is algorithmic.</p>
      <p>Here is an interesting area of “algorithmic” type design, termed “parametric”:<br><a href="https://www.typotheque.com/fonts/elementar/about">https://www.typotheque.com/fonts/elementar/about</a></p>
