  html: |-
    <p>This is less of a question, but more of an interesting read: <a href="http://arxiv.org/abs/1404.1775" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fun with Fonts: Algorithmic Typography</a>. The actual PDF can be downloaded from the link in the upper-right.</p>
    <p>From the abstract: Over the past decade, we have designed five typefaces based on mathematical theorems and open problems, specifically computational geometry. These typefaces expose the general public in a unique way to intriguing results and hard problems in hinged dissections, geometric tours, origami design, physical simulation, and protein folding. In particular, most of these typefaces include puzzle fonts, where reading the intended message requires solving a series of puzzles which illustrate the challenge of the underlying algorithmic problem.</p>
    <p>Enjoy :)</p>
