      <p>This isn't working for me:</p>
      <p>- The mark isn't aligned at all with the type.<br>
      - The elements in the mark are all drawn in different styles, with different line weights, and look "cliparty".<br>
      - The big guy looks like he's punching the little guy in the head.<br>
      - "TLAfrica" means nothing to me.</p>
      <p>Try going with the full name "Transformational Leadership". Your mark doesn't need to be as literal as this, and it doesn't need as many elements. Simplify.</p>
      <p> - Lex</p>
