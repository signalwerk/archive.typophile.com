      <p>It's fun to make music industry analogies with fonts, believe me, I try. There are more differences than similarities between digital music and digital fonts.</p>
      <p>Similarities:</p>
      <p>Fonts and music can be easily downloaded, distributed and shared.<br>
      Fonts and music are subject to fashion. Some songs/fonts are classics, some are not and diminish in value until they're eventually considered ironically cool.</p>
      <p>Differences:</p>
      <p>Fonts are tools for professional designers to use in their businesses while music is usually for personal use. When someone uses a font, they're likely "broadcasting" it in some way: using it on a website, a poster, and album cover . . . the font gets seen by many people. That can have the negative effect of overexposure. A novel display font doesn't seem as novel when it's seen by the public. Music normally isn't broadcast by illegal downloaders. While illegally downloading music can reduce the number of potential sales, listening to it doesn't actually reduce the perceived value of the music. I can listen to a pirated song 1000 times and it doesn't affect the perceived value of the song to other people. Unlike music, the fashion cycle of fonts is based less on trends and more based on public exposure of individual fonts.</p>
