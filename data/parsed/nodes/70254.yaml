      <p>Ophello - I'll start by giving a simple piece of advice: Remember you are fresh out of school and debating with a community that makes its living in type design and typography and has been for decades. You should be learning from these people, and taking their words seriously - not trying to prove them wrong with every statement. They will not let it go so easily :)</p>
      <p><cite>A lot of designers...I dare say ALL students who graduate from design schools...do this regularly.</cite></p>
      <p>I agree with you in <cite>part</cite>, that many students use unlicensed fonts while they are in school. I believe it has a lot to do with lack of funds but <strong>*mostly*</strong> because students are not being educated by their teachers about how to properly obtain and use fonts. This knowledge is critical for students who are attending a design school and planning a career as a visual designer.</p>
      <p>I also have a very hard time believing that a computer lab at a huge state university had legal licenses for all the computers. But what do I know ….</p>
      <p>To say that "ALL" students use fonts illegally, and regularly after graduation is a gross generalization. What you know of design school you learned from your experience at OSU, a school that doesn't have a properly specialized program for visual designers or typography (correct me if I'm wrong - I hope this isn't taken as an insult to your education, not intended at all), so I don't think you can speak for everyone around the globe who learned things very differently. Many members of this community (including myself) graduated from design school with a solid understanding of our industry (visual design), and an understanding of how utilizing fonts and supporting other designers (type designers) is essential to our business and building a solid reputation as a design professional. </p>
      <p>My advice to your original query: Keep the fonts for experimentation, to learn and to play, but don't use them in anything that is public-facing, unless you go directly to your local font retailer and/or foundry and purchase a legal license.</p>
    html_clean: |-
