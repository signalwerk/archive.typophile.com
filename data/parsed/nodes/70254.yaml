      <p>@all</p>
      <p><em>As I continue my freelance enterprises, I will gladly start purchasing licenses for the typefaces I use. I simply haven't been able to afford it. I'm not a criminal -- just going through a learning process.</em></p>
      <p>This guy reminds me of me and every other aspiring professional musician in the pre-digital era. (That's pre-digital, folks.)<br>
      At that time, purchasing the "sheet music" for popular songs was an impossible proposition. Pricing was geared for the amateur whose purchases were few and far between. And, of course, jazz tunes weren't published at all - somebody had to sit down and write out the melodies and chord changes.<br>
      The answer was - what was called at the time and probably still is - "fake books". These were black market compilations of tunes written out by professionals for other professionals and music students. (Also, the quality of the fakes were better than what was sold to the public, too. The chord changes (harmonies), especially, tended to be more accurate.)<br>
      At the Berklee College of Music, there was one fake book that everybody had and it was an indispensable "textbook" (but, of course, you couldn't buy it in a store) and you carried it with you all the time.<br>
      It was ironically titled "The Real Book" as a play on the phrase "fake book" and because of the accuracy I mentioned - to musicians, an inside joke.<br>
      Far from harming anyone, it served a great good. I wish I still had my collection of fake books, but they got lost in the shuffle years ago.</p>
      <p>I can't imagine how an aspiring  designer is supposed to learn to handle typefaces if they don't have a "learning" collection.<br>
      That's just my take on ophello's post - I think it's for real. And even if he isn't, his problems are.<br>
      Not looking to debate this back and forth. He just reminded me of me.</p>
      <p>Rich</p>
