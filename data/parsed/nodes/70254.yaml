    <p>I graduated from OSU with a BFA in Applied Visual Arts last year and have been doing freelance design since then. While I was at school, we had access to a large collection of fonts. I copied them to my computer and still have them on my machine (*everyone* did this). I use them regularly in my designs today.</p>
    <p>What do I do now that I'm out of school? I can't afford to pay for all the fonts I have on my machine...am I really supposed to make do with system fonts? Are font companies going to zero in on my house via GPS, bust my door in and arrest me for using their fonts in my work? Will the font designers rip all my posters down and declare me a thief? Will the ground open up and swallow me down to the 7th Circle of Hell?</p>
    <p>What's a broke freelance designer to do? Free fonts are usually crap.</p>
