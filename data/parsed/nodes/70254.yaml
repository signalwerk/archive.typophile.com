      <p>Rich: <em>I can't imagine how an aspiring designer is supposed to learn to handle typefaces if they don't have a "learning" collection.</em></p>
      <p>In this case, ophello reports that as a student he had access to a large number of fonts, which he then copied to his computer and took with him when he ceased being a student. Presuming -- a big presumption -- that the school had legitimately licensed all those fonts for use by its students, there you have both the learning collection you suggest is necessary and the legitimate learning context in which it is used. If someone failed during his or her time as a student to learn to handle type while having access to such a collection, that is either an individual failing or reflects badly on the school and its curriculum; in either case, it isn't resolved by an individual making copies of all those fonts and continuing to work with them after he or she has ceased to be a student at that institution.</p>
      <p>Ophello, the first thing for you to do, if you genuinely want to do the right thing, is to delete from your system any font for which you do not have a license that permits it to be installed on your system. You will still have a lot of fonts left: fonts that came with your system, fonts that came bundled with software, plus any fonts that you have licensed. In fact, you'll still have enough fonts to constitute something like Rich's ‘learning collection’ if that is what you want or need. Some of these fonts will be appropriate for some jobs, and for other jobs you can build the price of new font licenses into your design fee.</p>
