      <p><cite>Fonts are tools.</cite></p>
      <p>Tools that can be copied infinitely without using resources will lose their value. It's like inflation: the more money becomes available, the less it is worth.</p>
      <p>There is no universal accountability system in place for protecting the intellectual property of type and software designers. They're in the mix with every other type of digital media.</p>
      <p>The problem is a tricky one:</p>
      <p>A. people who are in college could be required to register the fonts and software on their computer in order to prevent piracy. But...</p>
      <p>B. those kind of accountability systems are perceived as a threat to privacy and many would be against it because of "civil rights violations" and a fear of "Big Brother."</p>
      <p>I think piracy in this century is a huge issue and no single party is dealing with it fairly. The RIAA is suing the hell out of a few unlucky people, yet the perceived damages they did by sharing music was often blown completely out of proportion.</p>
      <p>It's a story of the Big Suits "trampling the rights" of the little guy. It's a paranoid parade of confusion and conflict with no end in sight. Millions get off the hook and a few people are made to pay for their actions. This is clearly the wrong way about it. It is also the only way we've figured out.</p>
      <p>When a brilliant type designer slaves away three years to create a typeface that people want to use, they've really created something untouchable and invisible. This is the struggle that type and software designers face when publishing fonts.</p>
      <p>As I continue my freelance enterprises, I will gladly start purchasing licenses for the typefaces I use. I simply haven't been able to afford it. I'm not a criminal -- just going through a learning process.</p>
      <p>If colleges would offer a font umbrella and allow graduated students to work with their college's licenses legally until they are able to pay for licenses themselves, then we'd have at least a temporary solution. I also think my teachers should have talked about this stuff more. It was only ever mentioned in passing and most students never talked about it. The attitude was "there's nothing we can do to stop it, so why bother?"</p>
