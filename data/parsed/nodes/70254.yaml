      <p><cite>I used an emigre font on my website which I created in an interactive design class at OSU. I think that's probably legit as far as legal use is concerned.</cite></p>
      <p>(Usual disclaimer: I'm not a lawyer, and I'm not trying to offer legal advice, just passing along my understanding of this area.)</p>
      <p>Are you saying:</p>
      <p>1) You created a font from scratch and licensed it to Emigre?<br>
      2) You created a font from scratch in imitation of an Emigre font?<br>
      3) You took an existing Emigre font file and modified it?</p>
      <p>The first case is certainly legal. The second case seems to be often legal in the US, though it can depend on the details, and whether the original typeface had a design patent. The third case seems to rarely be legal, although again the details could matter.</p>
      <p><cite>I used Trajan, but that comes on every mac.</cite></p>
      <p>Actually, it doesn't. It is however bundled with many versions of Adobe Creative Suite (and many member applications of the suite), so if you have a license for that, you're probably clear.</p>
      <p>Cheers,</p>
      <p>T</p>
