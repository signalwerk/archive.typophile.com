      <p>Here's a utopian idea. Tell me if you think this would work:</p>
      <p>Font designers are all paid in full by one single type foundry. If you spend 9 months creating a typeface, you are paid for 9 months of work. If you're starting out, you pay the font foundry to advertise it for you and see if it becomes popular or useful. The more often your font is used, the more shares of the company you get.</p>
      <p>The foundry makes money from membership fees, advertising on their website, holding design conferences and type workshops, and licensing their software security protocols to design companies like Adobe who agree to make their software work exclusively with the foundry.</p>
      <p>Users pay a monthly fee and get access to any font they want for as long as they want. The more they pay, the more fonts they have access to. The fonts can only be used by purchasing a special USB dongle that activates their use on the computer. They aren't actually stored on the computer but exist entirely on the internet and cannot be downloaded or pirated.</p>
      <p>Problem solved?</p>
