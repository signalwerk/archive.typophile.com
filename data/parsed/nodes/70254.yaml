      <p>Worrying about this is a start. My suggestion is: try to be on the legal side. You can start by licensing the font you are going to use for your present work (normally you can charge your client a little extra so you can pay the fonts or at least a part of it). You don’t need to buy all the family, just the weights you are going to use. If your buy is wise, probably those fonts will be useful for future works, so you can save the extra charge for the time you need to buy again. Repeat the process.</p>
      <p>Type design implies a lot of time, maybe years just to develop a single family. It’s fair to compensate to the guy who makes possible your work.</p>
