    <p>I'd like to find a font like the one from the book <a class="freelinking external" href="http://books.google.com/books?id=c3ETv37GqfcC&amp;printsec=frontcover&amp;dq=eats,+shoots+%26+leaves&amp;ei=HfH9SIiBNpCoMoDG6KUD#PPR11,M1" rel="nofollow">Eats, Shoots &amp; Leaves</a>.</p>
    <p>Aldus Manutius the Younger said that the main purpose of punctuation is the clarification of syntax, but I think really strong punctuation can help make reading more musical and playful.</p>
    <p>Any ideas? Know what the exact font Truss uses Eats, Shoots &amp; Leaves?</p>
