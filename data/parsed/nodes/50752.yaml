    html: |-
      <p>The irony of FF Quadraat in <cite>Eats, Shoots &amp; Leaves</cite>, at least from my perspective, is that there is no kerning between quotation marks and periods or commas. So the many sentences with phrases enclosed in quotation marks with periods or commas outside have all these huge, unsightly, gaping holes with pitiful little points floating in them. </p>
      <p>It's not quite as glaring when the points are contained within quotes, but kerning is still absent.</p>
      <p>On second thought, maybe that's why you perceive the punctuation as prominent.</p>
      <p>Mildly enjoyed the book, but never got over the irritation of this lack of kerning.</p>
      <p>-- K.</p>
