    html: "<p>If you look at <a href=\"http://bowfinprintworks.com/SansIDPage09.html\" target=\"_blank\"> this page</a> in the Sans Serif Font ID Guide, you can see other styles with similar shape characteristics to Trebuchet: Agenda (Font Bureau), Faceplate Sans (Psy/Ops), Mahsuri Sans (Agfa), Today Sans (Spiece), Parisine Bold(Agfa), and Projekt (Linotype). Of course details will not match in each font, like the serif on the 'i', or the curved 'l', or the open lower bowl on the 'g'.  <br> <br>However, finding an equivalent seems like an odd exercise for such a ubiquitous font. Doesn't Microsoft give it away?</p>"
