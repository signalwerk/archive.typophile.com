    html: <p>Sorry for the delay, Yves. <br> <br>Well, MS wants people to pay, not for the fonts per se, but for the <br>program(s) that bundle the fonts. That was the main point put to <br>me by an upper level MS Typography rep who actually replied to <br>my e-mailed inquiry (boy, was I surprised). <br> <br>Outside opinion, based partly on the timing, was that Linux users <br>were being pointed to those fonts by many Linux resource sites <br>and were grabbing them in very large numbers. <br> <br>Certainly it's MS' right to do with the fonts what they choose, but <br>increasingly they have been choosing to slap their customers <br>upside the head. The user of a properly purchased MS application <br>who has a font that has become corrupted cannot simply get a <br>replacement off the installation CD. The fonts don't exist as indi- <br>vidual files. <br> <br>Personally, I feel that, after making sure that Arial, TNR and, to a <br>lesser extent, Verdana are specified in millions of HTML pages <br>around the world, MS ought to make these fonts available to all. <br> <br>Of course, as Justin showed, the fonts are available elsewhere. <br><br></p>
    html_clean: <p>Sorry for the delay, Yves. <br> <br>Well, MS wants people to pay, not for the fonts per se, but for the <br>program(s) that bundle the fonts. That was the main point put to <br>me by an upper level MS Typography rep who actually replied to <br>my e-mailed inquiry (boy, was I surprised). <br> <br>Outside opinion, based partly on the timing, was that Linux users <br>were being pointed to those fonts by many Linux resource sites <br>and were grabbing them in very large numbers. <br> <br>Certainly it's MS' right to do with the fonts what they choose, but <br>increasingly they have been choosing to slap their customers <br>upside the head. The user of a properly purchased MS application <br>who has a font that has become corrupted cannot simply get a <br>replacement off the installation CD. The fonts don't exist as indi- <br>vidual files. <br> <br>Personally, I feel that, after making sure that Arial, TNR and, to a <br>lesser extent, Verdana are specified in millions of HTML pages <br>around the world, MS ought to make these fonts available to all. <br> <br>Of course, as Justin showed, the fonts are available elsewhere. <br><br></p>
