  html: <p>Hi guys and gals, <br> <br> <br>Im working on some design work - I'm look for some "retro" (hate that word) motoring "typefaces" from the 60s and 70s... <br> <br> <br><img src="http://www.typophile.com/forums/messages/83/35076.jpg" alt="Autosport"> <br> <br> <br>For instance this Autosport type for a start - and any other suggestions of 60s and 70s type that looks "motoring" like - in particular motorsport-esque... <br> <br> <br> <br>James <br></p>
