    html: |-
      <p>You get this error because the classes doesn’t have the same number of elements.</p>
      <p><code>lc: a b c d<br>
      smcp: a.smcp b.smcp c.smcp d.smcp</code></p>
      <p>In the example above, each class has four elements. I can now call the classes in my OpenType code, like this:</p>
      <p><code>feature smcp {<br>
      sub @lc by @smcp;<br>
      } smcp;</code></p>
      <p>If the small cap feature is activated, a /d/ (which is in the @lc class, remember) will be subsituted for the glyph occupying the same “slot” in the @smcp class. In this case /d.smcp/. If the @smcp class only has three letters there’s no way for the OT engine to know what to do.</p>
