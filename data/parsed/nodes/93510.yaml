    <p>Hello experts on the field</p>
    <p>I created a font that has 2 variations of the capital letters and 3 variations of the lower cases. It is a serif font traced from a popular children's book from the end of the 19th century so it was done by hand. I consulted the 2006 post by steff_en and got some answers. </p>
    <p><a href="http://typophile.com/node/17887#comment-511377" title="http://typophile.com/node/17887#comment-511377">http://typophile.com/node/17887#comment-511377</a></p>
    <p>I set my classes and followed twardoch instructions and I got no errors, I generated the font but it does not do what I intended. That is: everytime I type a particular letter for the second or third time I want them different. As I mentioned, I made 3 versions of every small cap letters and 2 versions of the capital letters. Ex: in the word "tomorrow", I would like the three "o"s and the two "r"s to be diferent in the same word.</p>
    <p>Please help!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/screenshot_4059.jpg"></div><p></p>
