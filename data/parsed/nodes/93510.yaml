    html: |-
      <p>The bottom of the Classes panel shows the total number of glyphs in the selected class (110 in your screenshot). In order to substitute a class by another class, each class must contain the same number of glyphs, sorted in the same order relative to the other. If <code>@class1</code> contains 110 glyphs <code>[A B C ...]</code>, then <code>@alt1</code> must contain 110 alternates <code>[A.alt1 B.alt1 C.alt1 ...]</code>, and <code>@alt2</code> as well <code>[A.alt2 B.alt2 C.alt2 ...]</code>.</p>
      <blockquote><p>I created a font that has 2 variations of the capital letters and 3 variations of the lower cases.</p></blockquote>
      <p>This could be the source of the problem. If <code>@alt2</code> contains only lowercase alternates, it can't be substituted for a class that also contains capitals. A solution would be to separate up the upper- and lowercase glyphs into different sets of classes (with related classes containing the same number of glyphs), and "rotate" each set independently.</p>
      <p>Also, see <a class="freelinking external" href="http://typophile.com/node/19625#comment-269297" rel="nofollow">Miguel Sousa's explanation</a> of the code, including why certain parts may be unnecessary. Even after separating by case, the whole thing should work with only one rule for the uppercase and two for the lowercase.</p>
      <pre>sub @uppercase @uppercase' by @uppercase_alt1;
      sub @lowercase @lowercase' by @lowercase_alt1;
      sub @lowercase_alt1 @lowercase' by @lowercase_alt2;
      </pre>
