  html: |-
    <p>I’m looking for a glyph shaped like a paperclip<br>
    because it would be nice to display a paperclip onscreen<br>
    without having to use use an image file.</p>
    <p>Does one exist in any open-source or microsoft core font?<br>
    The closest thing i can find resembling a paperclip is<br>
    Unicode 06E9, the ‘Arabic Place of Sajdah’ glyph.</p>
