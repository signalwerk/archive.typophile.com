  html: |-
    <p>What is the # of em units to match a PC’s pixel? ( Not a mac’s ).</p>
    <p>The reason I ask is that I have font which uses 1000 UPM &amp; has 100em unit pixels ( vector not bitmap ). </p>
    <p>This font looks nice &amp;  crisp at 10 pt - on a mac. </p>
    <p>But it does <strong>not</strong> look crisp at any size on the PC. It has been true type hinted ( which helped alot ) but it seems quite clear - it just isn’t fitting the grid.</p>
    <p>Any ideas?</p>
