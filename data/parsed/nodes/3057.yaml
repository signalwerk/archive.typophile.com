  - id: 24289
    user: 804
    date: 2004-02-11T07:43:00
    date_raw: 11 Feb 2004 — 7:43am
    votes: null
    html: "<p>Thanks for the critiques. Daniel you commented that everything screams for attention. This is true. This is actually intentional.  The restaurant is located between 2 bars with heavy, crowded foot traffic especially on week-end nights. Some clients (at these  <br>hours) are often inibriated, or in the process of becoming so.In some ways it's important to be a bit loud graphically speaking. The same reason for using reflective materials. As you can tell from menu (prices) this is not high-end,  but really great Mediterranean basics at affordable prices. The owner made a lot of good decisions with the location and menu offerings. The result is that often the place is packed with people waiting in line. I think what has become most obvious in all the critiques is that the forks may be too \"obvious\" instead of a little added nuance. The bold type is unusual for menu design but in my opinion appropriate to the clients. I do have a ligther weight which looked classier but was ruled out because it was less legible at a distance. There is no menus on the tables but a couple huge backlit menus with photos of the food behind the counter. I should comment that design should always be viewed in context, which is obviously somewhat limited on a discussion board, as atmosphere is hard to absord as well as antisipating <br>the interaction clients are having with the design/and or services offered. I sent the typophile link to my client with the warning that people visiting site leaving critiques are pros and  <br>often very critical compared to his customers visiting the establishment. He phoned me after reading a few critiques and sounded a bit shocked. He is a great client to work with and has left me with a lot of the choices other than the actual content. A lot of trust- which was much apprciated. So what did I learn from this experience/job. well for starters, most designs can always be improved upon (especially if budget/time frame allows), Example- one of my firms web designs we did for a client last year is not to my personal quality standars, as it could be refined (which we just started on) but with 36 hrs to launch from start to finish- the timing was the priority and not the fine tuning of all elements and text. The solution: do your best. To be honest, this job ran 40 hours over budget (which I ate) due to a miscalculation on the extremely slow process of working at full resolution on the backlit 160\" x 24 menu boards that are over 800 megs (at 240 flattened dpi),  with many changes over the  <br>course of the job. Client ended up getting a bit impatient as things were running late (which is understandable), so where does one quit. Hopefully not untill it is the best it can be. But when exactly is that? A lot of smaller budget jobs do not allow for focus groups, so it becomes a lot of personal choices based on observations regarding the clients target market, objectives, etc...  <br>Always a challenge, but I guess this is why we loved doing what we do.   </p>"
