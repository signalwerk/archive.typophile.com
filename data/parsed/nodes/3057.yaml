    html: <p>Hi Ole, <br> <br>I like the MED MIX. You're not resorting to the diamond shaped E that is as bad as chop suey type for a chinese restaurant. Nicely played. But before moving to the signage (which I agree is busy), i want to voice some concern about the execution of MED MIX. It looks to me like it has a light/shadow chisel thing happening. That is nice, though it looks a little inconsistent with where the light would be if it was actually chisled. Check the widths of the white areas too for consistency (could be the gif). You also have a dimensionality to it </p>
