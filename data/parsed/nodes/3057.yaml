    date_raw: 11 Feb 2004 — 8:07am
    votes: null
    html: <p>Hey Randy. Thanks for the props. Well I am afraid I will dissappoint you a bit, as stated earlier it is only the Logo type that I designed, not the body copy (called Harmony, by designer unkown to me). The reason for choosing the body copy to be set in Harmony vs. all the other choices out there, was that it is readable at a distance,  familiar and friendly like the folks that work at Med Mix. As for the Logo type, the chisel effect with a single source of light, was kind of where this was going when I started but then it shifted direction into where it ended up... an eclectic mix of cuts. As for the devits, I confess I was unable in solving the issue with the devits in the M. I tried 4 or five different angles/cuts but nothing worked so with the time running out, I chose the results yoy see. I will post a few other version in a few minutes so you can see process... <br>As far as the borders. I am not exactly sure what this classic greek pattern is called but it is traditional. I personally like the mix of all the elements but perhaps it is not to everyones liking.  <br>In the mix of feelings people like yourself have about it, perhaps there could be a better choice to go with only forks, or just the border. </p>
