    html: <p>Thanks for the critiques. Here is a few of the reasons for the selected choices. The blue is representative of the Mediterranean sea and the colors of the Greek flag. I am designing for contrast, as signage is outdoors and establishment is open till' 2am daily. Lettering used on signage are reflective, as to be more visible at night. Colors are very limited when using reflective, so  <br>choices came down to yellow, white, silver and red. Background colors could not be "warm" colors, ie tans, beige, soft greens or blues as reflective materials are not available in these colors. Best match for background colors came down to complementary colors that would match reflective colors. Blue was the choice.  <br> <br>I designed a Sans Serif face to match the body type of Harmony. The suggestion of using Jeremy Tankard's "Sophia" was a good suggestion, in fact an inspiration for my "E" design.  <br> <br>I am surprised at how little commentators like the forks. I guess  <br>I thought it was clever.They were intended to be more decorative <br>than iconographic.  <br> <br>Besides the post I uploaded yesterday there are other elements <br>to consider. Here are a few more. <img src="http://www.typophile.com/forums/messages/29/26255.jpg" alt="harmony typeface"></p>
