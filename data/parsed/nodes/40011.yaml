    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Neuland</strong></p>
    <p>Neuland is a typeface designed by the German master calligrapher and early 20th century typeface design <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a>. The typeface was created at, and released by the <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> foundry. Today, the digital version is available at <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>. <a href="/node/12106" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">P22</span></a> has also made their own&nbsp;version.</p>
    <p>Neuland arose out of Koch’s desire to begin cutting his typefaces himself. Previously, his punches were made by Klinsgpor staff, who made them by referencing his&nbsp;drawings.</p>
    <p>Koch cut each letter at actual size. There was no pre-planned “design.” Because of this, each size of lead type’s design was different. This is sadly lost in the digital version, which does not have optical&nbsp;masters.</p>
    <p>Koch would go on to cut his own “serious” type as&nbsp;well.</p>
    <p>Upon seeing the initial concept, <a href="/node/add/wiki?edit%5Btitle%5D=Karl%20Klingspor" title="Create node &quot;Karl Klingspor&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Karl Klingspor</a>, the foundry’s head, told Koch that he found Neuland ugly, but that Koch should go ahead and make it anyway… Klingspor was sure that the end result would sell well. It&nbsp;did.</p>
    <p>Neuland Inline was used as the logo for the movie <em>Jurrasic Park</em>. The font seems all tied up with weird tribal art now. It is of course pure Weimar German, and not African at&nbsp;all.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/39867">Alternative to&nbsp;Papyrus</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.studio-gs.com/neuland.html">New Black&nbsp;Face</a></p>
