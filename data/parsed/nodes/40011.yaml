    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Neuland</strong></p>
    <p>Neuland is a typeface designed by the German master calligrapher and early 20th century typeface design <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>. The typeface was created at, and released by the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry. Today, the digital version is available at <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>. <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a> has also made their own version.</p>
    <p>Neuland arose out of Koch's desire to begin cutting his typefaces himself. Previously, his punches were made by Klinsgpor staff, who made them by referencing his drawings.</p>
    <p>Koch cut each letter at actual size. There was no pre-planned "design." Because of this, each size of lead type's design was different. This is sadly lost in the digital version, which does not have optical masters.</p>
    <p>Koch would go on to cut his own "serious" type as well.</p>
    <p>Upon seeing the initial concept, <a href="/wiki/Karl%20Klingspor" class="freelinking" rel="nofollow">Karl Klingspor</a>, the foundry's head, told Koch that he found Neuland ugly, but that Koch should go ahead and make it anyway… Klingspor was sure that the end result would sell well. It did.</p>
    <p>Neuland Inline was used as the logo for the movie <em>Jurrasic Park</em>. The font seems all tied up with weird tribal art now. It is of course pure Weimar German, and not African at all.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/39867" rel="nofollow">Alternative to Papyrus</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://www.studio-gs.com/neuland.html" rel="nofollow">New Black Face</a></p>
