    <p>Last night, when rereading Morison’s <em>A Tally of Types</em>, I saw that his bit on Times New Roman was set with a cut that’s more extended. I began to wonder if anybody had digitized this particular variant of TNR.</p>
    <p>I quickly found out that nobody did, but that wasn’t the point. This observation also sparked a little conversation on Twitter:</p>
    <p>“There was a lovely cut [of TNR] that a US company issued in PS1 around 1990,” my friend <a href="http://twitter.com/jackyan/statuses/1656958315" rel="nofollow">Jack Yan</a> said. It was “weightier, but it wasn’t Times Ten.”</p>
    <p>I did a sleuth around the web, and found further that Times Millenium, Times Classic and Times Modern (all designed for the newspaper when it redesigned) was only released internally. There are also the Europa, Ten and Seven variant, but these didn’t match Jack’s criteria for the face he saw in the ’90s</p>
    <p>I wonder if anyone with a knowledge of TNR’s history can advise on this subject?</p>
