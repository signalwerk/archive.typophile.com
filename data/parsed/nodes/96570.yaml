    html: |-
      <blockquote><p>Duplexing mostly referred to an Italic having its metrics forced from the Roman, no?</p></blockquote>
      <p>Not exactly. It refers to two faces fitting on the same set of matrices. The most common pairing was certainly a Roman with corresponding Italic. But you also had Roman duplexed with Bold. </p>
      <p>And you had special setups like a body text duplexed with gothic for certain kinds of work — like Corona with Erbar Bold, for example, or Excelsior with Memphis Bold.</p>
      <p>So, duplexing is uniwidth for two.</p>
    html_clean: |-
