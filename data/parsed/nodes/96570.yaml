      <p>Duplexing mostly referred to an Italic having its metrics forced from the Roman, no? My problems with "duplexing" is that it has a hang-up with 2, and it's not very descriptive.</p>
      <p>BTW a related idea that I find useful is when a font can be made uniwidth with another when a specific tracking value is applied. For example a Bold that becomes uniwidth with the Roman when a tracking of -10 is applied (something I've done in my Patria, and we almost pulled off in Ernestine). I've been calling that "fixed offset".</p>
      <p>hhp</p>
