    html: |-
      <p>&gt; Why TT (TrueType) vs. PS (Postscript)?</p>
      <p>The only reason for adding the suffix TT was to make the two font names different. Fonts with identical font names cannot be used on the same system.</p>
      <p>Hinting differences between TT and PS fonts are irrelevant here, because the offset plate-making raster image processor discards all TT and PS hints, which are not required for the high resolution of 1000 dots per cm (which is equal to 2540 dots per inch).</p>
    html_clean: |-
