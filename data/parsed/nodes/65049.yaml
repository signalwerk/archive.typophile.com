      <p>Hi Paul,<br>
      I know what you mean and I agree with your opinion,<br>
      I just showed the font has Blackletter like element.<br>
      But I thought it would be nice for fancy logos, say, the poster for theater play:-)</p>
      <p>There several kind of Japanese typefaces that were inspired by European typeface styles in Meiji and Taisho-era. For example, Japanese cosmetic maker Shiseido has a corporate font originated in Taisho era, which has been used for its branding items. It seemed that the form of this font came from Socho （宋朝体）style, but I feel it has the similar feeling of Blackletters as the end of the strokes are very sharp and horizontal strokes are bended like Blackletter's stems. The skeleton is very unique but I think it is very beautiful and elegant.<br>
      (Quoted from Japanese design magazine "Design Note".)<br><img src="/sites/default/files/old-images/shiseido_6139.jpg"></p>
      <p>Japanese typeface and Latin typeface are completely different constitution.<br>
      I would like to know what isokon focus on when he looks for Japanese Blackletter.</p>
