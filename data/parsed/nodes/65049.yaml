      <p>Greetings Isokon,</p>
      <p>I highly recommend you look into the work of Jun Takechi. You can find some examples of his designs in <em>Applied Typography 7</em> and <em>Applied Typography 8</em> from the Japan Typography Association, published in 1997 and 1998, respectively. There may be more examples in previous or later editions, but those books are very expensive and very hard to track down.</p>
      <p>He designs both Japanese and Latin type. Much of his Latin work reminds me of the work of Margot Chase or Jonathan Barnbrook.</p>
    html_clean: |-
