    <p>I'm outputting a family of fonts for a client (modifyed versions of another font). Some of the fonts (I've a Book, Book Italic, Regular, Italic, Medium, Medium Italic, Bold, Bold Italic) will not show up in the menus although I've cleaned the font caches.</p>
