    html: |-
      <p>Yes, FontLab assigns 400 to both, but that's easily overridden manually (as Martin thinks), and doesn't cause any problem other than poor sorting of styles within some Adobe apps.</p>
      <p>But the reason I mention above is a much stronger reason not to have Book and Regular in the same family, which does not have any workaround, let alone a trivially easy one.</p>
      <p>Cheers,</p>
      <p>T</p>
