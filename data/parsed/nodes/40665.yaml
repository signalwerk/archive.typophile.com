    html: |-
      <p>"Not a good idea to have Book and Regular in the same family, as both have “400” as their weight number." </p>
      <p>This conflates two separate issues:</p>
      <p>1) All different weights in a family should have different values for usWeightClass. There are other potential complications with usWeightClass: see my first post in this thread (with the big chart)... <a href="http://typophile.com/node/16327" title="http://typophile.com/node/16327">http://typophile.com/node/16327</a> </p>
      <p>2) InDesign (only) has some issues with families that have multiple fonts that it considers to be "regular" weight, which includes the name "book" among others. See my and Miguel's posts in this thread: <a href="http://www.typophile.com/node/35394" title="http://www.typophile.com/node/35394">http://www.typophile.com/node/35394</a> (where I again explained that this was a separate issue, despite Nick's belief that one was causing the other problem)</p>
      <p>Cheers,</p>
      <p>T</p>
    html_clean: |-
