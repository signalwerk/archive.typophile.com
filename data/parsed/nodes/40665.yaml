      <p>2) InDesign (only) has some issues with families that have multiple fonts that it considers to be "regular" weight, which includes the name "book" among others. See my and Miguel's posts in this thread: <a href="/node/35394/" title="http://www.typophile.com/node/35394" class="link-kept">http://www.typophile.com/node/35394</a> (where I again explained that this was a separate issue, despite Nick's belief that one was causing the other problem)</p>
