      <p><em>Nick’s belief that one was causing the other problem</em></p>
      <p>My "belief" is correct, as an observation of the way that FontLab assigns 400 to both Book and Regular, in the first page of its Font Info dialog. I'm also aware of the problem with InDesign, but didn't mention it (I try to avoid criticizing Adobe).</p>
      <p>Thanks for clarifying the issue, with links, Thomas.</p>
      <p>Happy New Year, Martin!</p>
