    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Boltvisa_5192.png"></div><p></p>
    <p>To celebrate the Olympics we’re offering a chunky 25% discount off all Houschka font packs and single fonts until August 12th when the curtain comes down on the London 2012 games.<br>
    Choose between original Houschka Pro,  Houschka Rounded or the more corporate and businesslike Houschka Alt Pro.</p>
    <p>All Houschka OpenType Pro fonts contain extended character sets which include contextual alternates, ligatures, extra stylistic sets, small caps and multiple figure options, plus support for Central European and Cyrillic languages in addition to the Western set.<br>
    Visa’s high profile use of Houschka Rounded in their ongoing “life flows better” branding campaign has created quite a buzz around Houschka so if you've been considering a purchase now is the time to make it. You've got until end of play on August 12th, so enjoy the Olympics and happy shopping!</p>
    <p><a href="http://www.g-type.com/fonts" title="http://www.g-type.com/fonts">http://www.g-type.com/fonts</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/3xHouschka_5759.png"></div><p></p>
