    html: |-
      <p>.bmap files are most likely old (pre-OS X) Macintosh resource-fork bitmap fonts. If the goal is still to "convert" to TTF, gohebrew's original advice on converting to TTF outlines still applies*: there is no inexpensive way to convert bitmap/raster data into scalable outlines; at least not a way that will yield acceptable results.</p>
      <p>*One point to clarify though: it *is* actually possible to include ("embed") bitmap data in a TTF file. This is frequently done as a sort of cheap replacement for high-quality, manual TrueType hinting. Bitmaps in TTFs are usually provided as a supplement to outline data that doesn't render well at small sizes. However, it is possible to build a "bitmap-only" TTF, i.e. with only embedded bitmaps and no outline data. Not all operating systems and applications can make use of these effectively, though, and even those that can may encounter some problems. Bitmap-only TTF should not be viewed as anything more than a temporary solution.</p>
