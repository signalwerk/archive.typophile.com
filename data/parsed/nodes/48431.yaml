      <p>Here's a link to the format details from Microsoft:<br>
      <a class="freelinking external" href="http://support.microsoft.com/kb/65123" rel="nofollow">http://support.microsoft.com/kb/65123</a><br>
      That will help you figure out what's in the font, if you open it up in a hex editor.</p>
      <p>If it's a Windows pre-3.1 font, I think most of those were bitmap, in which case you're out of luck, but there were vector printer fonts also. I don't know of a converter for those, but it seems like something that ought to exist somewhere. If it's something else like a device font, I'd guess you should probably go to the vendor that produced it and see if they can convert it for you.</p>
