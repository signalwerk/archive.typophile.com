      <p>Are .fnt fonts with vector or bezier curve outlines or bit map descriptions?</p>
      <p>TrueType TTF fonts only support outlines, and do not support bit map descriptions.</p>
      <p>If rhe .fnt fonts have bit map descriptions, there is no inexpensive way to convert them to TrueType TTF fonts. Rather, a talented graphic artist and type designer must create outlines which match the bit map descriptions.</p>
      <p>The cost of this kind of font conversion depends upon the experience and pricing structure of the graphic artist and type designer.</p>
      <p>I estimate that the cost per font will be about $2,000 per font, or a flat amount for many such fonts, as low as $500 to $750 per font, depending upon the number of fonts, and their resolution. If anyone quotes you much less, become very wary and expect to receive inferior workmanship.</p>
