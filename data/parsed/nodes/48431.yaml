      <p>You don't want to edit it with a hex editor; it's just a way to check the file format, by looking at the location where the relevant information is stored (the 68th byte, it looks like). But on reading that page again, I realize that the FontFmt.exe tool probably tells you that. However, not having any *.fnt files to try it out on, I don't really know.</p>
      <p>If *.fnt fonts still work on Windows, there's an easier way to guess whether it's bitmap or vector. Just install the font and try it out. If it looks horrible when used at an odd prime-number size like 17 points, it's probably bitmap.</p>
