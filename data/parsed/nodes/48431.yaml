    date: 2008-08-20T15:53:00
    date_raw: 20 Aug 2008 — 3:53pm
    votes: null
    html: |-
      <p>If the resource fork is intact, yes, OS X should be able to read the files, though I don't think it actually makes use of them as installed fonts, unless combined with the corresponding PostScript Type 1 file (this is the old way that PostScript Type 1 outline fonts were supported under pre-OS X Mac). The old ResEdit utility, running under Classic, should be able to read them (and edit...sort of, though it usually mangles some contents; and it does not do any kind of conversion to other formats). Many font-editing applications can also read them.</p>
      <p>Unfortunately if the files have ever been stored on a filesystem that is not aware of resource forks (that is: nearly every non-Macintosh file system), or compressed/archived using a method that does not preserve resource forks (tar, rar, gzip, non-OS X zip), then the files will be useless since all of the useful information is included there.</p>
