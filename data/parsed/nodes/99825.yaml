    html: |-
      <p>[A year and two months later...]</p>
      <p>Wow, sorry I missed your question.</p>
      <p>Funny, I had completely forgotten I made that font (and I seem to have lost my development sources). It must have been a two-hour affair. I therefore can't answer your question.</p>
      <p>So I went and looked up my forgotten work. It could probably only be selectively usable for designs with a deliberate "malformed" look. Here it is, for the curious:</p>
      <p><a href="http://openfontlibrary.org/en/font/average-mono" title="http://openfontlibrary.org/en/font/average-mono">http://openfontlibrary.org/en/font/average-mono</a></p>
      <p>I do recall it was inspired by Averia, which fascinates me despite that I have no use for the result :) and I also remember trying to select the most disparate-appearing fonts among all those I blended.</p>
      <p>Maybe it could form a reference background to inspire sketches of a new monospace font that is in some sense a stylistic blend or average of so many fonts. I don't plan on that.</p>
      <p>I don't suppose it's easily possible hunt down and list all typewriter-ish monospace fonts. (Maybe some expensive reference sold to type designers has done so already, besides.) Obviously, I forsook the effort, although I still think it would make a fascinating wiki article.</p>
      <p>hrant, have I missed any posts about your experiment?</p>
