    html: |-
      <p>John, Courier New is a system font on Mac OS X. It’s metrically identical to the Windows system font, but there are some differences in the character set coverage.</p>
      <p>Courier New on Windows 7 has 3248 glyphs, expanded to 3458 on Windows 8.<br>
      Courier New on Mac OS X 10.6 – 10.8 has 3151 glyphs.</p>
      <p>These are most of the encoded glyphs that are in the Windows 8, but not in the Mac version:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CourierNew-diff_5901.png"></div><p></p>
      <p>The outlines are mostly also identical. MS and Apple seem to have started from the same version and added new glyphs independently.</p>
    html_clean: |-
