      <p>It's a reliable <em>average</em> in the US film industry.* So allows for a quick initial judgement of how long a film is likely to be based on the number of pages in a script. Of course there will be variance for individual films, particular directors, etc., but it is a useful average. When I was writing for theatre and occasionally acting, we similarly reckoned about 1.5 minutes per page of script. People didn't pull these numbers out of a delusional nowhere: they noticed over time that these correlations were common, and hence provide a useful approximation.</p>
      <p>* I'm guessing that Bollywood, for instance, has its own average, based on the formatting of its scripts and the languages and scripts used.</p>
