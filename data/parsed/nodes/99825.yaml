    html: |-
      <p>"...and blunt versions seem very odd to me."</p>
      <p>They are not correct. Most versions with square serifs are based on versions derived via early postscript stroke fonts intent on conservation of point data vs authenticity. Corners like those in a true typewriter ? would have poked the ribbon and then the paper to shreds. </p>
      <p>The Bitstream versions of this and Prestige, available from Myfonts, are authentic, drawn from enlargements of actual IBM types.</p>
