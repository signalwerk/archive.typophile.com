  html: |-
    <p>Has anyone written an article comparing all the Courier variants and Courier-inspired faces out there? Courier (Adobe, Monotype, Linotype, ParaType, E+F, and more), Dark Courier, Monospace, Nimbus Mono, FreeMono, Courier New, Courier Ragged, Hellschreiber Serif, etc.</p>
    <p>I know what you're probably thinking. "Courier, really? That tired old hanger-on from days of an obsolete technology" etc etc. Or maybe you're like me, and are actually somewhat fond of the old workhorse.</p>
