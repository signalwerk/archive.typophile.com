      <p>I only did girl versions of her and Prestige Elite. It was clear to me  at the time of my revivals, that the letter gothic types were intended to be boys, making the girls even clearer. I mean it wasn't like they couldn't make sharp corners, they didn't always want them, and the types showed this clearly. </p>
      <p>"...then the divorce settlement would have likely been pretty impressive..."</p>
      <p>I think each character got exactly the same amount in the final settlement. Her sister, a really nasty 12 pitch, wanted more, but that was another case.</p>
      <p>"...anybody amateur enough to submit a script to a big studio that's way off in length..."</p>
      <p>Hollywood movies have lengths related to their scripts' lenghts? So why should acceptance criteria be based on a script's page length? It just becomes a series, a sequel, a directors cut, or someone gets burned.</p>
      <p>Or think Walter Burns! One minute could take five pages with all the people talking over each other, alternating with short staccato whitespace-wasting lines. And <em>2001:...</em> a four hour movie on a 20 page script was as Kubrick said, "...basically a visual, nonverbal experience" and that it "hits the viewer at an inner level of consciousness, just as music does, or painting", or a good Courier 10 pitch, I might add.</p>
