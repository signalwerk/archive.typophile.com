      <p>bbg, I'm curious about your comment where you say "most:"<br>
      "Most versions with square serifs are based on versions derived via early postscript stroke fonts . . ."</p>
      <p>If most of them were derived of early postscript stroke fonts, I'm curious about any that were not (especially if they were based on actual typewriter type). I'm curious to find any Courier variant which is derived of (or inspired by) actual typewriter type heads, but which is modified to have sharp corners on serifs, stroke ends etc.</p>
      <p>hrant, if I may ask . . . how is progress coming on the (Courier-related?) design which I presume you must be working on, based on a comment you made? :)</p>
      <p>All,</p>
      <p>I think a list of Courier variants would make a great TypeWiki page; OR it could be a section of a page on Courier. (And there isn't any page about Courier, as I write this!)</p>
      <p>Here's my start, which does not include all pertinent information available to me . . . If I would be welcome to copy this as a page stub to TypeWiki, I'd be happy to--or I welcome anyone else to.</p>
      <p>A question that arises: what "Typewriter" typefaces may <em>not</em> be derived of Courier (or certainly are not), yet resemble it? Where would METAFONT/Computer Modern fit in the list?</p>
