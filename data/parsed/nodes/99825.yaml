      <p>[EDITED to include variants first listed by ChristTrekker--duh! :p ]</p>
      <p>bbg, I'm curious about your comment where you say "most:"<br>
      "Most versions with square serifs are based on versions derived via early postscript stroke fonts . . ."</p>
      <p>If most of them were derived of early postscript stroke fonts, I'm curious about any that were not (especially if they were based on actual typewriter type). I'm curious to find any Courier variant which is derived of (or inspired by) actual typewriter type heads, but which is modified to have sharp corners on serifs, stroke ends etc.</p>
      <p>hrant, if I may ask . . . how is progress coming on the (Courier-related?) design which I presume you must be working on, based on a comment you made? :)</p>
      <p>All,</p>
      <p>I think a list of Courier variants would make a great TypeWiki page; OR it could be a section of a page on Courier. (And there isn't any page about Courier, as I write this!)</p>
      <p>Here's my start, which does not include all pertinent information available to me . . . If I would be welcome to copy this as a page stub to TypeWiki, I'd be happy to--or I welcome anyone else to.</p>
      <p>A question that arises: what "Typewriter" typefaces may <em>not</em> be derived of Courier (or certainly are not), yet resemble it? Where would METAFONT/Computer Modern fit in the list?</p>
      <p>Reference; NOTE that most of these have lists (even quite long ones) which were not incorporated into the below list!<br>
      <a href="http://typophile.com/node/13885" title="http://typophile.com/node/13885">http://typophile.com/node/13885</a><br>
      <a href="http://typophile.com/node/18207" title="http://typophile.com/node/18207">http://typophile.com/node/18207</a><br>
      Re selectric <a href="http://selectric.org/selectric/" title="http://selectric.org/selectric/">http://selectric.org/selectric/</a> and <a href="http://ibmcomposer.org/joomla/index.php?option=com_content&amp;view=article&amp;id=54&amp;Itemid=56" title="http://ibmcomposer.org/joomla/index.php?option=com_content&amp;view=article&amp;id=54&amp;Itemid=56">http://ibmcomposer.org/joomla/index.php?option=com_content&amp;view=article&amp;...</a> <a href="http://ibmcomposer.org/joomla/images/stories/fonts/ComposerFonts.pdf" title="http://ibmcomposer.org/joomla/images/stories/fonts/ComposerFonts.pdf">http://ibmcomposer.org/joomla/images/stories/fonts/ComposerFonts.pdf</a> <a href="http://typebarhead.blogspot.com/2012/04/ibm-selectric-typeball-fonts.html" title="http://typebarhead.blogspot.com/2012/04/ibm-selectric-typeball-fonts.html">http://typebarhead.blogspot.com/2012/04/ibm-selectric-typeball-fonts.html</a><br>
      <a href="http://lineto.com/The+Fonts/Font+Categories/Typewriter+Fonts/" title="http://lineto.com/The+Fonts/Font+Categories/Typewriter+Fonts/">http://lineto.com/The+Fonts/Font+Categories/Typewriter+Fonts/</a><br>
      <a href="http://www.identifont.com/similar?IG" title="http://www.identifont.com/similar?IG">http://www.identifont.com/similar?IG</a><br>
      <a href="http://en.wikipedia.org/wiki/Courier_%28typeface%29#Variants" title="http://en.wikipedia.org/wiki/Courier_%28typeface%29#Variants">http://en.wikipedia.org/wiki/Courier_%28typeface%29#Variants</a><br>
      <a href="http://delubrum.org/" title="http://delubrum.org/">http://delubrum.org/</a> [has lists of fonts]</p>
      <p>Courier [Adobe, ParaType, E+F, and more . . .]</p>
      <p>Hellschreiber Serif</p>
      <p>Courier Ragged</p>
      <p>Courier Std [Have run accross this name, don't remember where?]</p>
      <p>Courier Old [Have run accross this name, don't remember where?]</p>
      <p>Selectric [wide open territory?]</p>
      <p>Monospace</p>
      <p>Courier Final Draft</p>
      <p>Courier MMS ("Movie Magic Screenwriter")</p>
      <p>Courier New/as on various platforms</p>
      <p>Courier Screenplay / Source: FadeIn software (may be derived of a bitstream version)</p>
      <p>American Typewriter</p>
      <p>Everson Mono?</p>
      <p>METAFONT/Computer Modern?</p>
      <p>FF Magda?</p>
      <p>Lucida Typewriter?</p>
      <p>Liberation Fonts/Miriam Mono CLM Current source: <a href="https://fedorahosted.org/liberation-fonts/" title="https://fedorahosted.org/liberation-fonts/">https://fedorahosted.org/liberation-fonts/</a></p>
      <p>Nimbus Mono URW</p>
      <p>Courier 10 Pitch/aka Courier 10 BT</p>
      <p>Dark Courier</p>
      <p>GNU freefonts/FreeMono</p>
      <p>URW++</p>
      <p>TeXGyre Cursor, Derivation Nimbus Mono URW, Current source <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/cursor" title="http://www.gust.org.pl/projects/e-foundry/tex-gyre/cursor">http://www.gust.org.pl/projects/e-foundry/tex-gyre/cursor</a>, License: GUST Font License, an instance of the LaTeX Project Public License.</p>
      <p>TeX psfonts/Courier, Adobe Type 1/IBM/MIT X Con­sor­tium. [Released 1991?] [Derivation?] Existing source: <a href="http://ctan.org/tex-archive/fonts/psfonts/courier" title="http://ctan.org/tex-archive/fonts/psfonts/courier">http://ctan.org/tex-archive/fonts/psfonts/courier</a> License: IBM/MIT X Consortium Courier Typefont agreement [Full copy of in context?]</p>
      <p>TeX psfonts/Courier, Bitstream. Released: 1994. [Derivation?] Existing source: <a href="http://ctan.org/tex-archive/fonts/psfonts/bitstrea/courier" title="http://ctan.org/tex-archive/fonts/psfonts/bitstrea/courier">http://ctan.org/tex-archive/fonts/psfonts/bitstrea/courier</a> License: GNU General Public License</p>
      <p>txtt, Current source: <a href="http://www.ctan.org/tex-archive/fonts/txfonts/pfb" title="http://www.ctan.org/tex-archive/fonts/txfonts/pfb">http://www.ctan.org/tex-archive/fonts/txfonts/pfb</a></p>
      <p>Liberation Mono? [Wide open territory?--because of fonts like it, which to my eyes are not typewriter-like at all, but neo/coding fonts (because they have few or no typewriter-esqe serifs etc.)</p>
      <p>Luxi Mono, re <a href="http://en.wikipedia.org/wiki/Luxi_fonts" title="http://en.wikipedia.org/wiki/Luxi_fonts">http://en.wikipedia.org/wiki/Luxi_fonts</a></p>
      <p>Courier Prime</p>
