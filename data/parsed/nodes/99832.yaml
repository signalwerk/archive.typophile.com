    <p>I'm looking for a blackletter, preferably bastarda, to use for display type in a book project about 15c Flemish painting. Here's the thing: I would really like to use a type of explicitly Flemish origin, and that's proving harder to find than one might expect. </p>
    <p>The closest I've gotten is TEFF's Bugundica. It's got just the character I want, but of course isn't Flemish. It's also a little more expensive than the budget of this project can support.</p>
    <p>Any ideas?</p>
