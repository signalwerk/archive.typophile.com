      <p>Waaaaait a minute. I interpreted Burgundica's origins incorrectly, with the idea that the name referenced the French region of Burgundy, and being unaware that the Duke of Burgundy controlled Flanders in the 15th century. Actually reading TEFF's description of that type makes it clear that it's pretty much exactly what I want and I should just bite the bullet and pay for it.<br>
      So: nevermind.</p>
