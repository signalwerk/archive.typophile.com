    html: <p>Johston may deserve to be on the list, if only by association. His work inspired countless of people (rather patron saint-y, huh!), including John Howard Benson of the John Stevens Shop in Newport, Eric Gill, and Hermann Zapf. I'd be willing to bet that Johnston IS Zapf's patron saint, or guardian angel, or whatever� <br> <br>And Gill Sans wouldn't have ever come about without Johnston's (flawed) Underground Script (which wasn't really intended to be a proper typeface anyway?). Despite my allergies to Gill Sans (due to its over-use/abuse), it is a well made piece of work. <br> <br>I looked up "nonce" in the dictionary, and I still don't think I get your comment, Vincent. Do you mean that since he only designed one typeface, he can't be a patrron saint? (Actually he designed several typefaces� I think that Perpetua alone merits his canonization�) <br> <br>My patron saints are Baskerville, Kindersley, and Koch, I think.</p>
