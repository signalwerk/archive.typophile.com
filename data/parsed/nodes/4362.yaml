    html: <p>I can't believe I'm about to defend Gill.... <br> <br>I just wanted to point out that Johnston's Underground typeface started out as a collaboration between Gill and Johnston. Gill actually got paid some substantial fee for his contribution. But he dropped out before the project was finished. <br> <br>So Johnston Underground had substantial input from Gill, and therefore accusing Gill of "ripping it off" seems pretty goofy to me. <br> <br>That being said, I still have a lot of questions about his personal life that would lead me to think twice about considering him a typographic saint. I mean, I have nothing against free love in general, but I'm not sure one's practice of it should extend to one's family pets and one's own children. <br> <br>T</p>
