  html: <p>Hello everyone, I'm designing a calendar for the year 2005. Instead of having a traditional saints' feast days, like those that can be seen on church calendars, I'd like to try having a "patron typographer," or something like that, for each day. Some of these typogragraphers/type designers would have further details/descriptions/portraits/work samples/etc., and some would only have their names listed. <br> <br>So, who has a "patron saint," whose spirit they try to channel for inspiration? <br> <br>Conversely, does anyone have "typographic demon," whose presence occasionally needs to be exorcised from your work? <br> <br>Dan</p>
