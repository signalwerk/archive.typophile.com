    html: <p>Well, a year does have 365 days! Just like the Catholic Church's calendar of saints (if that's what it is really called?) My calendar will have saints days on many days (like a third of them, so far). My list may not be long enough! Some saints are paired up on church calendars, too, making the list even longer. <br> <br>What I don't want to make is something like Pentagram's 2004 calendar. They got 12 designers (living and dead) picked. Each month has the days set in a different typeface. In addition to holidays, the 12 type designers birthdays are listed. That is a neat promo piece, but I'm not going to learn anything new from it. I'd like my calendar to be a bit more encyclopedic. <br> <br>Since we are on the subject of religion, let me issue a public mea culpa here for including GGL on my list!  <br> <br>Since this will be my calendar, the list sort of follows my interests. I don't think that I could hurt my own feelings  You'll notice that there are several "Offenbachers" on the list (Klingspors, Koch, Hoefer), since I'm studying there now, and am naturally interested on what happend there in the past.  <br> <br>I'm going to have to stay steadfast with Gill, though. His work has inspired me for years. Although he most certaintly was, in some regards, a shady character, we are only speaking about allegations here. He has been dead since 1940, and rumors have a funny way of spreading. If you give me definitive legal evidence that he molested children, or engaged in rampant beastiality, I'll take him off my list. Ok?</p>
