    html: '<p>Apparently, the Pope is leaning towards declaring St Isidore of Seville (7th century) the patron saint of the Internet, following the lead of  Spanish catholics in 1999 who declared him Protector of the Internet. He produced the first encyclopaedia, among other things.  <br> <br><a href="http://www.news24.com/News24/Technology/News/0%2C" target="_blank">2-13-1443_1355345%2C00.html,http://www.news24.com/News24/Technology/News/0,,2-13-1443_1355345,00.html</a> <br> <br>"All spiritual growth comes from reading and reflection. By reading we learn what we did not know; by reflection we retain what we have learned. " (from his Book of Maxims) <br> <br>*** <br> <br>Oswald of Chicago: <br> <br>"A quick way to have your type forgotten is to bore the reader with repetitions of some small cleverness." <br> <br>"Hybridizers have a moral responsibility...in crossing the calligraphic with the typographic." <br> <br>"Letters made odd deliberately are ill-at-ease and lead restricted lives."</p>'
