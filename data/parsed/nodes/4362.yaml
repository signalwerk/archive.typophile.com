    html: <p>I was the one who brought it up, and it was basically a reaction to the phrase "patron saint," which I think can be reasonably believed to imply that someone is of good character (whatever the heck that is). <br> <br>Although many of us keep our professional and private lives separate, Gill didn't very much at all. I mean, some of his students who studied under Gill, really *studied under* Gill, if you get my drift. <br> <br>If we'd been asked whose work we found most inspirational and admired most, I'd have had absolutely no qualms about seeing Gill on the list. <br> <br>Dan may very well have meant "patron saint" to mean no more than that, of course. But I don't think I'm out of line in thinking that its more literal meaning can be seen as flavoring the concept a little. <br> <br>T</p>
