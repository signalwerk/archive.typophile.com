    html: "<p>I think you should't look at it from such a Christian angle. Sure, that's the association \"Saint\" usually has, but then what about the title of Cabarga's book: \"Logo, Font and Lettering Bible\"? <br> <br>And what about Griffo? He was hanged for the murder of his son-in-law. And Goudy was a certifiable skirt-chaser. And Koch was a woman-hater. And Beatrice Warde was a husband-swapper who caused Frederic to hang himself*. And hey, don't let me start on friggin' Louis XIV!! Gill simply made the mistake of keeping a diary. <br> <br>* Speaking of which, Dan, you really need to add Cassandre. Even though he hung himself because a font house rejected his designs - what a lousy Catholic, eh? <br> <br>hhp <br></p>"
