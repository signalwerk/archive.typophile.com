  html: <p> Today I had the unfortunate experience of locking myself out of my appartment.  <br> <br>The cheap bastard I am, I didn't want to pay the $30 the locksmith wanted... I decided to try with a ladder. <br> <br>It didn't reach up so I had to do some serious spiderman climbing to get in, and now I'm hoping nobody called the cops. <br> <br>Anyone else played spiderman today? </p>
