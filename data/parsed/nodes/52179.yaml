    votes: null
    html: |-
      <p>It is described in the OpenType <a href="http://www.microsoft.com/typography/otspec/name.htm" rel="nofollow">"name" table</a> specification. Scroll down to the "Name IDs" section and read the description for ID 18: Compatible Full (Macintosh only). This is the entry that the "Mac Name" field represents. </p>
      <p>Regards,<br>
      Adam</p>
    html_clean: |-
