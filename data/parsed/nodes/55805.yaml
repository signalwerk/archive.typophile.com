      <p>Sure:</p>
      <p>feature liga { # Standard Ligatures<br>
       # Latin<br>
          sub C T by C_T;<br>
      } liga;</p>
      <p>. . .</p>
      <p>feature ss01 {<br>
      sub C_T by C_T.alt;<br>
      } ss01</p>
      <p>Be warned I didn't try it. (This works only if your stylistic set feature(s) are below your *liga* feature. But as you described things, that is how they should be placed.)</p>
