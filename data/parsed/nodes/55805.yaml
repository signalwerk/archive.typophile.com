      <p>Well Adam, it has been <em>their</em> choice to change the company name to the one of their main product, not mine.<br>
      If they wished to avoid confusion they proceeded exactly in the wrong direction, but on my part I will make the extra effort to call it "FontLab Studio"… :=)</p>
      <p>Besides, I have a big admiration for Pyrus/FontLab, so no need of linguistic jokes to prove your point. Right now, I'd rather live in Russia than in the US and if there's a person you need to convince about how difficult it's to communicate in another language (English), it's surely not me.<br>
      I just appreciate English's flexibility, but I'd rather speak polish with you…<br>
      <cite><br>
      Dorastają przez miłość, i potem tak nagle dorośli<br>
      trzymając się za ręce wędrują w wielkim tłumie -<br>
      (serca schwytane jak ptaki, profile wzrastają w półmrok).<br>
      Wiem, że w ich sercach bije tętno całej ludzkości.</cite></p>
      <p>Trzymając się za ręce usiedli cicho nad brzegiem.<br>
      Pień drzewa i ziemia w księżycu: niedoszeptany tli trójkąt.<br>
      Mgły nie dźwignęły się jeszcze. Serca dzieci wyrastają nad rzekę.<br>
      Czy zawsze tak będzie - pytam - gdy wstaną stąd i pójdą?</p>
      <p>Albo też jeszcze inaczej: kielich światła nachylony wśród roślin<br>
      odsłania w każdej z nich jakieś przedtem nie znane dno,<br>
      Tego, co w was się zaczęło, czy potraficie nie popsuć,<br>
      czy będziecie zawsze oddzielać dobro i zło? </p>
      <p>:)<br>
      Claudio</p>
