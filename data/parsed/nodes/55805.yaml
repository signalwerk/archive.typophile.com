  html: <p>Say you have a stylistic alternative character C.alt, but you also have the ligature CT, is there a way to, if you have the stylistic alternate character activated, AND the ligature feature activated that you end up with the CT.alt character…???</p>
  html_clean: <p>Say you have a stylistic alternative character C.alt, but you also have the ligature CT, is there a way to, if you have the stylistic alternate character activated, AND the ligature feature activated that you end up with the CT.alt character…???</p>
