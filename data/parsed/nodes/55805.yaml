    html: |-
      <p>&gt; FontLab won’t allow you to order lookups<br>
      &gt; independently of features.</p>
      <p>John, </p>
      <p>FontLab (the company) doesn't really mind your business and certainly has no business in allowing or disallowing you to do something :) </p>
      <p>FontLab Studio (the product, which I assume you were referring to) doesn't actually allow you to order features at all, because the order of features in the font has no relevance. It allows you to reorder lookups, but this indeed is done by changing the order of feature entries with which the lookups are associated with. But it is important to remember that by reordering the feature definitions in FontLab Studio's OpenType panel, you're actually reordering lookups. </p>
      <p>I think what John means is that by following the simplistic notion introduced by Adobe FDK for OpenType 1.x that each lookup is defined within a feature definition, the flexibility in which you can order your lookups is limited. Fortunately, by my feature request Adobe implemented the ability to define lookups outside of feature definitions in the Adobe FDK for OpenType 2.x syntax, which will be used in FontLab Studio 6 (no release date yet). </p>
      <p>Regards,<br>
      Adam</p>
