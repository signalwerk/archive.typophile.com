    html: |-
      <p>Piccic, </p>
      <p>the problem is not marketing criteria, the problem is potential confusion. </p>
      <p>FontLab produces and sells many applications: FontLab Studio, FontLab Fontographer, FontLab TypeTool, FontLab TransType, FontLab ScanFont etc. Some users say "FontLab" when they mean "FontLab TypeTool", others say "FontLab" when they mean "FontLab Studio". </p>
      <p>It's basically like saying "I test this font in Adobe", when one actually means "Adobe Acrobat" or "Adobe Photoshop" or something else. </p>
      <p>I'm simply concerned with clarity and avoiding ambiguity. Old-timers may understand very well when one uses "mental shortcuts" or "abbreviations", but since this is a public forum with the idea of serving not only 1-to-1 communication but also allowing others to learn from what is being discussed here. </p>
      <p>And realizing that Typophile has users from all over the world, for many of whom English may be the third language (like in my case) or perhaps second at best, I prefer to stay on the safe side when communicating, i.e. avoid confusion and misunderstandings. </p>
      <p>&gt; you won’t see me add a “Studio” each time I talk of FontLab</p>
      <p>Sure thing, you can call it whatever you want, "the rusty old thing", "the Russian pest", "лаборатория шрифтов" or "it". Some people will get it, others won't. One can never guarantee that there will be no misunderstanding but one can minimize its probability :) </p>
      <p>Cheers,<br>
      Adam</p>
