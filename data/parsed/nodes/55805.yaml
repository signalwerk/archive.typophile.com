      <p>&gt; Yes, but when I started using ‘FontLab’ it was a piece<br>
      &gt; of software produced and sold by a company called Pyrus. </p>
      <p>Oh, I know what you mean. I realize that every time I talk to somebody from Linotype-Hell or Agfa Monotype, or when I use FutureSplash Animator. ;) </p>
      <p>&gt; He was very confused by the VOLT UI, because he<br>
      &gt; couldn’t figure out how to re-order the features. </p>
      <p>I think originally, the simplistic view of AFDKO did make sense. It's just like the one glyph-one glyph name-one Unicode thinking. Once you introduce the notion that some or all glyphs may not have names at all, and that some glyphs may be associated with none or with many Unicode codepoints, or may represent a sequence of Unicode codepoints, people's minds starts to drift off :) </p>
      <p>We're working on the ideas for a FLS6 UI for OpenType Layout. </p>
      <p>A.</p>
