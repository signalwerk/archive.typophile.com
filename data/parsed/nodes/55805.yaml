    html: |-
      <p>Presuming you have created the /C_T.alt/ ligature glyph, there are two ways you can do this. Which method you use depends on how you order your lookups (or, in FontLab, how you order your features, since FontLab won't allow you to order lookups independently of features).</p>
      <p>If you order your stylistic alternate substitution first, then you need to do this:</p>
      <p>feature ss01 {<br>
      sub C by C.alt;<br>
      } ss01</p>
      <p>feature liga { # Standard Ligatures<br>
      # Latin<br>
      sub C T by C_T;<br>
      sub C.alt T by C_T.alt;<br>
      } liga;</p>
      <p>If you order your ligature substitutions first, then you need to do this:</p>
      <p>feature liga { # Standard Ligatures<br>
      # Latin<br>
      sub C T by C_T;<br>
      } liga;</p>
      <p>feature ss01 {<br>
      sub C by C.alt<br>
      sub C_T by C_T.alt;<br>
      } ss01</p>
    html_clean: |-
      <p>Presuming you have created the /C_T.alt/ ligature glyph, there are two ways you can do this. Which method you use depends on how you order your lookups (or, in FontLab, how you order your features, since FontLab won't allow you to order lookups independently of features).</p>
      <p>If you order your stylistic alternate substitution first, then you need to do this:</p>
      <p>feature ss01 {<br>
      sub C by C.alt;<br>
      } ss01</p>
      <p>feature liga { # Standard Ligatures<br>
      # Latin<br>
      sub C T by C_T;<br>
      sub C.alt T by C_T.alt;<br>
      } liga;</p>
      <p>If you order your ligature substitutions first, then you need to do this:</p>
      <p>feature liga { # Standard Ligatures<br>
      # Latin<br>
      sub C T by C_T;<br>
      } liga;</p>
      <p>feature ss01 {<br>
      sub C by C.alt<br>
      sub C_T by C_T.alt;<br>
      } ss01</p>
