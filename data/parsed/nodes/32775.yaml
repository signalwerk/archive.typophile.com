    <p>Does anyone here still have one?<br>
    Does anyone here still use one?</p>
    <p>Earlier this morning I was on another site identifying a typeface. I suggested a base font and implied that the designer may have used their <em>rapidograph</em> to achieve the handtailored "S."</p>
    <p>I received a polite thank you - and something that stopped me dead in my tracks...<br>
    "Thanks Heron, out of curiosity, what’s a rapidograph?"</p>
    <p>Just had to share.</p>
