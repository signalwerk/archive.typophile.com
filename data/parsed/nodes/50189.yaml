    html: |-
      <p>So I emailed Ken Garland, guy who initiated the manifesto and this is what he said:</p>
      <p>fushia</p>
      <p>nice to hear from you. I'm glad you found the manifesto of some use, even<br>
      after all these years.</p>
      <p>as to your query: the headning type was hand-drawn by me; the text type<br>
      was<br>
      made by Ludlow Typograph Company of USA (now defunct) and was called<br>
      Recod<br>
      Gothic.</p>
      <p>I hope you soon get pissed off with catfood, stripey toothpaste and<br>
      shaving<br>
      cream: no sort of diet for a forward-looking young person (which I assume<br>
      you are).</p>
      <p>ken g</p>
