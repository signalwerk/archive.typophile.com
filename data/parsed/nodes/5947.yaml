    html: <p>I ran my font library (1600+ according to Suitcase) through Font Doctor and it took about and hour and half to do all the diagnostics (duplicate fonts, font IDs, etc.). There must be something wrong when it takes 20 hours. I don't have any tips other than regular system maintenance - weekly Cocktail, monthly Disk Warrior. I am running 10.3.5 and Adobe CS and the only app that crashes is InDesign. Pretty rare though. <br>GOOD LUCK! <br>peace</p>
