    html: |-
      <p>&gt; then replace 'space' 'space' with 'space'</p>
      <p>One of the built-in GREP searches is "Multiple Spaces to Single Space".  It's better than just searching for "space space", because it'll also take care of situations where there are more than 2 spaces.</p>
      <p>I use it routinely on documents to eliminate multiple spaces.</p>
