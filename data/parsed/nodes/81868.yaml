    votes: null
    html: |-
      <p>With GREP, you could search for <code>\s*-\s*</code> and replace that by <code>_–_</code> (use spaces instead of the underscores).<br>
      This will match any number of spaces (including zero) and any kind of spaces (including non-breaking and thin ones etc.), before and after the hyphen.</p>
    html_clean: |-
