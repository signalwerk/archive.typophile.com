  html: |-
    <p>Hi folks,</p>
    <p>I'm trying to figure out how I can get the GREP function to locate all hyphens in my document and change them to en dashes. In addition, I'd also like to add a space before and after the en dashes... a lot of the hyphens in my text document are sitting adjacent to the last letter in a word.</p>
    <p>Attached is a screen grab of what I'm hoping to achieve (top is bad, bottom is what I'd like to change to).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture_6672.jpg"></div><p></p>
    <p>Any tips would be incredible helpful. Adobe forums have been useless!</p>
    <p>Thx</p>
    <p>J</p>
