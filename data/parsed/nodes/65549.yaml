  html: |-
    <p>Hello there.</p>
    <p>First post around here and maybe not so interesting to you guys, but I could use some tips regarding setting text ragged right in indesign. I usually set it justified and always manage to get nice looking blocks with that, but want to leave that now and discovered that accomplishing nice looking  right rags is actually more complicated than I thought.<br>
    In my settings I thought it would be a good thing to avoid as many as possible hyphens, but this of course causes an ugly right rag.<br>
    Dou you guys have ideas about reaching a nice compromise (few hyphens, nice rag)? Or is it a matter of fixing a lot of it 'by hand'.<br>
    Oh and I'm using Perpetua.</p>
