    html: <p>It all depends on your column width that influences how often you need to hyphenate. I don’t matter more than three hyphens at the end of lines as long as the word breaking makes sense and does even enhance reading comfort. Which is often the case in German texts. English of course has not that many compound words. If the hyphenation is a clear one what’s so bad about it? A nice rag is always achieved by fixing it manually. In your InDesign settings you should not let the application do the paragraph composing. Nice idea though, but it never works as soon as you want to change the line break manually. And it’s not a question which typeface you use. The narrower the column the harder it is to achieve a nice rag.</p>
