    html: "<p> Tim - Welcome to the forum. This is indeed fun and quirky and could have a lot of specialty uses.  <br> <br>Some things that I think you can do right off the bat to make it work better... <br> <br>Try to bring the widths and weights closer together. When you test this with sample words and phrases, you might get a uneveness that you weren't intending.  <br> <br>For example, the bowl on lc 'q', the thin lc 'l', the thick uc 'F', when brought together might jar a bit. But maybe that's your intention.  <br> <br>As far as weights, the lc 'm' and lc 'h' seem exaggeratedly thin, the lc 'e' and 'u' seem a little fat. <br> <br>My favorite letter is the lc 'g'.  My least favorite are the lc 'u' and the uc 'U' -- I would look at the triangle shape that develops. <br> <br>The best designers at nailing these kind of fonts:  One Way Out. I don't have the link, but if you go to MacSurfShop.com, I think you can find a link there. They used to distribute through t26 and now they sell mostly to religious organizations. <br> <br>One Way Out fonts are quirky, but magically delicious. <br> <br>good luck <br> <br>bj </p>"
