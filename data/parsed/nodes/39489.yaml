    <p>Hi...</p>
    <p>I used (a fully paid-for) Fontographer before on 98/2000/2000Pro, but upgraded to XP Pro recently and now that software does not work. I see work-arounds on the web for getting it to work in XP, but maybe it’s time to upgrade.</p>
    <p>I don’t have the circa-$1,000 for a new copy, does anyone know where I can get a legal copy at a VERY good price?</p>
    <p>TIA<br>
    bimjim</p>
