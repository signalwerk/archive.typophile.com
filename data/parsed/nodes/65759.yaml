      <p>I just discovered this. It's great that you are extending Oksana to include Greek!</p>
      <p>The redrawn shapes look good in general. I'd like to see the round capital Epsilon in an all-caps context, but I think it will work well.</p>
      <p>I think the open phi should be the default. As for the open theta, I wonder how a tiny lead-in stroke (like for upsilon) would work. Or just make the opening a tiny bit wider. Right now it's a bit too close to a flipped beta for comfort.</p>
      <p>I am not sure about the lead-in stroke for the lowercase omega. I am too used to seeing it curled inwards.</p>
      <p>I am not someone who thinks chi should <em>always</em> descend, but in this design, I think the descending chi is better. A non-descending chi can be confused with a script kappa.</p>
      <p>I like the angle of the tonos just fine right now.</p>
      <p>Good luck!</p>
