      <p>Excellent work!<br>
      Some notes/suggestions from me as well:</p>
      <p>1. I would continue the right side of Pi's arm, in a way similar to pi. It seems quite out of balance like that.<br>
      2. I agree with praitsidis note about zeta (it could look more like the bottom bowl of xi).<br>
      3. I would lengthen the terminal of delta a little more (to the right). And maybe shorten the eye of delta a little bit (make it a little smaller than omicron).<br>
      4. I would shorten the middle stem of omega and maybe close it more from the right side.<br>
      5. I would make the top bowl of xi more round (now it seems as if it's falling). Maybe raise the middle juncture a little bit.</p>
      <p>Again, excellent work. I can't wait for its release.</p>
      <p>George Triantafyllakos - backpacker.gr</p>
