      <p>As I can attest from a visit several years ago, the Korean diaspora in Southern Ukraine is also very heavily Russified. They were cut off completely from their homeland for many decades. All except the very elderly have forgotten Korean. They are incomparably more assimilated than Korean-Americans, Korean-Chinese, or Korean-Japanese. I would say Soviet restrictions on movement and minority cultural expression did play a role here.</p>
      <p>It wasn't really until after the Soviet breakup that Koreans and other ethnic minorities could become active in promoting and celebrating their own culture.</p>
      <p>By the way, it's interesting how some places in Southern Ukraine and Crimea have retained ancient Greek names.</p>
