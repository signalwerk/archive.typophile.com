      <p>Lowercase chi is supposed to descend. I don't know if modern Greek commonly accepts x for chi, but I think the traditional form would better fit your design even so.</p>
      <p>I agree that the open-form theta would work better, but as regards the closed-form theta, I disagree and think the bar sticking through is good in this face. As with phi, a thorough font should include both forms as alternates. So, yeah, make an open phi too.</p>
    html_clean: |-
