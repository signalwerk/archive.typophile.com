      <p>This is very charming!</p>
      <p>I'm no Greek expert, but being very much involved in [anti-]Latinization I'd emphasize what Petros said about the "a".</p>
      <p>Also, from a purely formal level:<br>
      - The bars coming out of the lc theta are bothersome.<br>
      - People might tell you that the weight contrast in the lc mu is wrong, but I personally think it works fine.<br>
      - The UC Xi is too crowded. Although the classic "three bars" form would be too awkward, some gap might be useful. Try simply removing the horizontal segment!<br>
      - The lc xi is leaning rightward.<br>
      - The UC Sigma needs some thinning at the joins.</p>
      <p>I haven't looked at the spacing.</p>
      <p>hhp</p>
