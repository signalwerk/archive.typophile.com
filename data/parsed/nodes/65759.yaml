      <p>I like the look'n feel of the light text sample very much - modern but classical. My suggestions and comments:<br>
      1. The alpha looks ok for me, I've seen that variant in Greece, but I'm not a native greek reader. I think since your latin a is double-storey it looks different enough.<br>
      2. Agree with G30 (sorry, couldn't help ;-) on Pi. The current one looks like a Tl ligature.<br>
      3. The top left spur on Beta (and Pi) looks a bit long - Gamma is ok.<br>
      4. The Delta is imho too "cyrillic". (Same for Lambda) I'd use the A as a pattern. What about softening the bottom left corner (like in Sigma).<br>
      5. Widen the right gap of the Sigma a bit more.<br>
      6. The bottom curl of the Tau looks out of order. It is not in Gamma, Iota or Rho.<br>
      7. Agree with hrant on theta. The style of your typeface would go well with an open one.<br>
      8. I think the top spurs of zeta and xi should be similar.<br>
      9. Ah yes, and the Xi - imho better without the connecting diagonals.</p>
      <p>Andreas</p>
