  html: |-
    <div class="info">Submitted by <a href="/user/1275" title="View user profile.">jfp</a> : 16.Mar.2009 8.13am </div>
      <p>[[http://www.typofonderie.com/profile/press/newsletter0309 | Newsletter March 2009]]</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fonts_en_50_4570.png"></div><p></p>
    <p>For the first time, you can now buy <a class="freelinking external" href="http://www.typofonderie.com/alphabets/byfonts/ "> fonts separately</a> for a selection of families. From € 50.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lemondesansptf_sample1_6371.gif"></div><p></p>
    <p>Le Monde Sans PTF, <a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=303 "> fully revised,</a> with many new glyphs, Small caps for all weights, OpenType features. Enjoy right now the  <a class="freelinking external" href="http://www.typofonderie.com/icono/alphabets/pdf/LeMondeSansPTF_pdf.pdf "> pdf specimen.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/costastd_launch2009_5494.jpg"></div><p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/Costa "> Costa Std</a><br>
    Not everybody need <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/CostaPTF "> full featured Costa Ptf.</a> After several requests, <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/Costa "> Costa Std</a> is now also available from € 140. Until the 16 April 2009, you can even save 20% and <a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/Costaoffer "> buy it from € 112.</a></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/#specialoffers "> Special offers</a><br>
    <a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/Ambvaluepack "> Ambroise 3 packs: € 315</a><br>
    <a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/LeMondeSansJournalvaluepack "> Le Monde 3 packs: € 315</a></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/VuittonPersona "> Vuitton Persona</a><br>
    Porchez Typofonderie <a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=306 "> was asked to design</a> an all-capital two-color custom font for Louis Vuitton Malletier, a French luxury fashion and leather goods company</p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=309 "> Une certaine vision de l’histoire des caractères typographiques 2 (English version)</a><br>
    Featured here is the second part of a small history of type. This history, normally told from the Anglo-Saxon point of view, is from a French perspective, allowing the reader to form one’s own opinion. Part One, covering the origins to the twentieth century is also available.</p>
