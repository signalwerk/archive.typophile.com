      <p>I stand corrected. This is an inept Victorian design, rather than a modern mish mash. Looking at the full alphabet, I see no reason to modify my critical appraisal. It's still a somewhat standard Latin with discordant coat hooks pasted on -- presumably so the chorus girls have someplace to hang their costumes after the show.<br>
      Don</p>
