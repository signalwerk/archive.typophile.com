    html: <p>The font is Chorus Girl and the only source I'm aware of is on the CD bundled with the <a href="http://www.amazon.com/Victorian-Display-Fonts-CD-ROM-Electronic/dp/0486999564/ref=sr_1_1?ie=UTF8&amp;qid=1394897721&amp;sr=8-1&amp;keywords=24+fonts+victorian" target="_blank" rel="nofollow">24 Victorian Display Fonts CD-ROM and Book </a>.  Dover stopped making and selling these several years ago, so I've linked to one possible solution (just make sure the CD is intact).</p>
