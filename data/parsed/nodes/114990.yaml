    html: |-
      <p>Might help if you gave some hint as to the nature of the image, logo, menu, old book etc and an approximate date.<br>
      At first glance this looks like a "Latin" type such as Etienne <a href="http://www.myfonts.com/fonts/paratype/etienne/" title="http://www.myfonts.com/fonts/paratype/etienne/">http://www.myfonts.com/fonts/paratype/etienne/</a> Latin CT <a href="http://www.myfonts.com/fonts/castletype/latin-ct/" title="http://www.myfonts.com/fonts/castletype/latin-ct/">http://www.myfonts.com/fonts/castletype/latin-ct/</a> ITC Barcelona <a href="http://www.myfonts.com/fonts/itc/barcelona/" title="http://www.myfonts.com/fonts/itc/barcelona/">http://www.myfonts.com/fonts/itc/barcelona/</a> or Spike <a href="http://www.myfonts.com/fonts/quadrat/spike/" title="http://www.myfonts.com/fonts/quadrat/spike/">http://www.myfonts.com/fonts/quadrat/spike/</a> with a shadow line and coat-hook ornaments pasted amidships.<br>
      This is not to say that someone has not packaged this mish mash as a font. Could have been done by a Victorian typemaker with little imagination or a similarly changed modern designer.<br>
      Compare it with the somewhat similar, but much better designed Algerian <a href="http://www.myfonts.com/search/algerian/fonts/" title="http://www.myfonts.com/search/algerian/fonts/">http://www.myfonts.com/search/algerian/fonts/</a><br>
      Don</p>
