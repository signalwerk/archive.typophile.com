      <p>Passava un any (2001) a Barcelona. Encara és la meva ciutat favorita fora de Dublin. M’encanta l’esperit d’els Barcelonins, i el disseny sempre esta una inspiració per a mi. Especialment per a la tipografia. Podria passar hores a les velles botigues de llibre o fotografiant exemples de ‘found type’. ¿Encara existeix la revista Neo2? El disseny pels llibres de Laus sempre estaven dissenyats bé. Tinc moltes carpetes de cartells i flyers recollits.</p>
      <p>… and I’ll always remember the <a href="http://en.wikipedia.org/wiki/Caganer" rel="nofollow">Caganer</a>, what an icon!</p>
