    <p>hi im Javi from <a href="http://www.inocuothesign.com" title="http://www.inocuothesign.com">http://www.inocuothesign.com</a> from barcelona obviously, during the last 10 years i see different episodes of the activity in my town around graphic designs illustration and audiovisual inspired in graffiti roots and street culture for different clients. Galleries, exhibitions free magazines, music industry and club culture goes growing..design as a trademark bla bla bla . i kind a dream come true made in spain.<br>
    Well we restyling our activity every day and decontextualized every format or any style respecting the traditional work to jump to international. its hard but the point is:</p>
    <p>what is the real perception of other people from Barcelona? what do you think about spanish design?</p>
    <p>lets talk about tapas guys!!! </p>
    <p>best<br>
    Javi</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/K_5296.jpg"></div><p></p>
