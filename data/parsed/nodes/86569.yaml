    <p>hey guys<br>
    i have been looking at some posts where people were talking about python.<br>
    i was wondering what do they actually do with python.<br>
    do they kern automatically or check their kerning using python.<br>
    or do they create glyphs using python.<br>
    if you use python can you please mention what you use it for and any relevant sources to learn python <em>for</em> fontlab( i have some programming experience(Matlab Fortran C))</p>
    <p>Cheers<br>
    M</p>
