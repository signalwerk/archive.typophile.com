    html: |-
      <p>Here's an old discussion on Typographica that seems relevant to your question:</p>
      <p><a href="http://typographica.org/2005/on-typography/an-introduction-to-robofab/" title="http://typographica.org/2005/on-typography/an-introduction-to-robofab/">http://typographica.org/2005/on-typography/an-introduction-to-robofab/</a></p>
      <p>The discussion is about RoboFab, a Python library that can be added to FontLab to make it easier to script. In particular, some of the comments are from type designers telling how they use scripting in font development.</p>
      <p>(The Typographica article is old, and unfortunately the images seem to be broken.)</p>
