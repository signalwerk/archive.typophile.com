    <p>Hi, </p>
    <p>I have a question, someone have some fonts came from Canadian Type??!?!<br>
    I have, but I have a dubt, I can't understand why for example in the Clarendon Text font the alternate ligatures are not in the same file of the file of the text. It's quite an inconvenient situation, because when I use some Canadian Type if I want to set my text with alternate ligatures I can't do it in a easy way in illustrator or in indesign, but I must search and replace the couples of letters that need alternate ligatures...<br>
    why they made font files so strange?!?!?!<br>
    do you have the same problem with fonts from Canadian Type?!?!??!</p>
