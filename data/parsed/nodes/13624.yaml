    html: |-
      <p>“Most fonts specifically made for screen use are only hinted with small text sizes in mind anyway.”</p>
      <p>I’m pretty sure this is not entirely true. The fact is that most fonts hinted for use on computer screens contain hints for all ranges of sizes. What is true is that some outline fonts designed to be hinted and used on computer screens have been designed with small sizes in mind, so like any good text face the lowercase is too big and spindly for larger sizes...</p>
      <p>What makes these fonts no better than anything else for you purpose, is that<br>
      “headline/subhead size, image/flash based” specification. So, you are best off selecting something with niether small black, nor small white features, be they thin strokes, spaces ’twixt serifs, or anythinig else that a relatively unintelligent rasterizer would confuse with nothing, and make disappear, or something else that’d make these wee features look bigger than they are s’posed to be. </p>
      <p>So, yeah, don’t Bodoni.</p>
