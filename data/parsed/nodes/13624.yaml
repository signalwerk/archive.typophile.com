    <p>I’m curious if people have any favorite “screen-friendly” serif faces. I am thinking headline/subhead size, image/flash based (I’m not talking about “HTML” text fonts here).</p>
    <p>I ask because some clearly work better than others. for instance Bodoni with its extreme thins tends to break apart at anything other than large sizes. What are the serif faces that hold up better in digital media?</p>
    <p>I’ve been poking around this site (please get the search feature working soon!) looking for a topic about this, but didn’t see one. If it exists, please point me to it. </p>
    <p>Thanks,</p>
    <p>John-Paul<br>
    <a href="http://www.nsideas.com" title="http://www.nsideas.com">http://www.nsideas.com</a><br>
    <a href="http://www.mmodule.com" title="http://www.mmodule.com">http://www.mmodule.com</a></p>
