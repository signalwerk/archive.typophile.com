    html: |-
      <p>I don’t think stroke modulation is a problem as long as the width of the narrowest line isn’t too low.</p>
      <p>In other words, a heavy black serif might have tons of stroke modulation, but look fine on the screen because the minimum stroke width is still pretty beefy.</p>
