    <p>Hey guys, this is my first post.</p>
    <p>I put together this simple page for a presentation I gave yesterday.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Handout_6079.jpg"></div><p></p>
    <p>My problem is that I don't feel the text 'sits' well on the large A4 page. It's got to be on A4 for various reasons, so my question is:<br>
      <em>How could I place this text layout more effectively on the page? Are there any guidelines you could give for setting text on A4?</em></p>
    <p>Sebastian</p>
