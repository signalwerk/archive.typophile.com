    <p>Hi,</p>
    <p>I am about to start a book project and would like the type treatment to be based around  1970's/80's Americana Truck aesthetics. Also with the possibility of having a slightly feminine feel to it as the project is based around two blonde, truck driving sisters. </p>
    <p>Any font recommendations would be great.</p>
    <p>Thanks</p>
