      <p>Awkward or not, it is a funny exercise. Or: it could be. I remember examples of Cyrillic and Greek blackletter designs being discussed here.<br>
      I have no Hebrew expertise, but I think the main mistake is in the distribution of stress in the letterforms. For Latin vertical stress is essential. For Hebrew horizontal stress is essential. This has been neglected. – I’d like to see some Hebrew type master executing this!</p>
