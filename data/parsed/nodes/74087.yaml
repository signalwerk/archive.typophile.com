    <p><a href="http://www.underconsideration.com/brandnewclassroom/archives/hebrew_translations_of_latin_logos.php" rel="nofollow">Here's some student work</a> from a class taught by Oded Ezer, involving translating Latin logos into Hebrew. (Has this been discussed here already?)</p>
    <p>Unfortunately I don't read Hebrew, but this Hebrew version of the New York Times logo just won't leave my mind.<br>
    I've thought a lot about Hebrew Blackletter since reading some of Hrant Papazian's comments about it, and this is an interesting example, although I don't know enough to understand how good it is.</p>
