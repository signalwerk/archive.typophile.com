    html: <p>I don't know Hebrew either, but this does not look like Hebrew at all. Generally, I find the idea of forcing a style of a specific script on another one very awkward and does harm more than good. Instead of translating the specific style, one needs to translate the feeling behind it, so for this example I'd choose some Hebrew style that give the impression of old, antiqued type (or whatever you think blackletter stands for).</p>
