      <p>I had thought that the miniscules of the Hebrew logo were a fairly good application of the style to the Hebrew character. But reproducing the Latin minuscule - majuscule structure in Hebrew is a mistake.</p>
      <p>Thus, I would see a Hebrew blackletter as being in "all-caps", but with the characters much less ornate than the capitals of Latin blackletter, being much closer to the lower-case of the example given, but in a larger size.</p>
