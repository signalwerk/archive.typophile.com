      <p>(Warning: Amateur opinion.)</p>
      <p>The <strong>+</strong> is tiny; how about drawing your own to fill more of the space? </p>
      <p>Also, have you tried aligning the <strong>F</strong> with the median position of the <strong>W</strong>'s left slope, rather than with its utmost tip?</p>
