    <p>Hello Everyone.</p>
    <p>So, this may turn into a long story, here we go...</p>
    <p>I recently purchased an HP Laserjet 1320 to spec type with since it is a 1200 dpi printer. Everything seemed to be going fine and dandy until once day, I noticed on any type smaller than about 12 point, there were some weird inconsistencies in the kerning of the font I am developing. The only reason I noticed is because the spacing problem was between /d/o/l/.</p>
    <p>As everyone knows, the spacing of /d/o/l/ should leave the o directly in the middle of the stem of the /d/ and /l/ because I have the same right side bearing on the /d/ as the left sidebearing of the /l/, and the /o/ has even metrics left and right. So why the heck would this be happening? </p>
    <p>I drive up to my old school where they have a HP Laserjet 5200, and print out my file, and voila, no spacing errors. So i'm thinking "well, I guess the postscript driver on this older HP 1320 must not be as precise as the newer 5200". So, after a bit of reluctance, I went ahead and found a decent deal on an HP 5200.</p>
    <p>Fastforward a week... the 5200 arrives, and guess what.... SAME DARN PROBLEM!!!! Now I am just getting really bummed out...</p>
    <p>So I decided to just expand the type on the page, and it printed with the correct spacing... but, am I compromising my fonts glyph contours by doing that?</p>
    <p>My next idea was that maybe since I've updated to Mountain Lion, and I'm pretty sure my school has not, maybe Mountain Lion has some sort of different thing going on to make this happen. Which brings me to ask, has anyone with Mountain Lion noticed any problem like this?</p>
    <p>Any help would be greatly appreciated! I'm getting really annoyed with the idea that I might be making metrics and kerning changes based on incorrect printouts....</p>
    <p>Thanks!<br>
    Josh</p>
