      <blockquote><p>If you don't mind me asking, if you don't trust a laser printer for kerning, what do you use?</p></blockquote>
      <p>Well, for initial work, I trust my experience a fair bit. I use the FontLab Glyph pallet at 128 points, with several words in the window, and at least one wordspace .</p>
      <p>But I make final decisions from a printed book. If it is a new-to-us font, I make sure to get a copy when printed. Sometimes I have to pay for it. Use to be the typesetter was always given a complimentary copy, but that's rare these days. However, most often the publisher has no use for the F&amp;Gs after the book is bound, and will send us those for free.</p>
      <p>You need to check the kerning based on the media you're aiming the font at -- as I said in that long post. If you've got a friend at a publishing house, sometimes you can get a page or two printed offset when they're doing a test on something else. Offer the publisher a free license (or reduced price for a license for three, four, five machines ... whatever). They're saving you about $300, after all...</p>
      <p>As Hrant says, if laser is to be your final output, you have to trust it. Find a machine where the kerning is the same between the same letter pairs no matter where they occur. Rarer than you might think, that. If John Hudson had good luck with the Brother, I'd trust that. We use HP 5550s in the office to make proof sets, and I don't trust them. Good enough for proof sets, not to judge kerning with 10-point type.</p>
