      <p>Not that this addresses your problem, but:</p>
      <blockquote><p>the spacing of /d/o/l/ should leave the o directly in the middle</p></blockquote>
      <p>There are at least three reasons that's not necessarily true:<br>
      - The left and right sidebearings of the "o" can be different, because: in a design with steep stroke stress the vertical positions of the extrema could be different enough to warrant it; the frequency of shapes to the left versus right of an "o" are different.<br>
      - Ideally spacing should be propagated: the <em>left</em> side of the "d" isn't the same as the <em>right</em> side of the "el", and that affects the other sides.<br>
      - To me the "el" should be looser (because it needs help standing out).</p>
      <p>BTW, there <em>is</em> one good reason to rely on a laser printout to judge kerning: if that laser print is your final output! :-)  Not exactly a rare thing either...</p>
      <p>hhp</p>
