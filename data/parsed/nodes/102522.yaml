      <p>A lot of good advice here. I'd also suggest, that many laser printing devices are not actually the resolution they seem from the name or literature, or at least not in the same sense that type designers think of resolution, i.e. as an array of more or less fully addressable pixels at x number of them per inch. I think there's probably a lot of information on this from the past, but it's been forgotten. </p>
      <p>The summary is pretty clear though — when quality assuring the details of text type, one is advised to either use typeset output, or double the proof size along with the viewing distance, or acquire a reducing lens to point at such an oversized proof.</p>
