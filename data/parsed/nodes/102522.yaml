      <blockquote><p>I recently purchased an HP Laserjet 1320 to spec type with since it is a 1200 dpi printer.</p></blockquote>
      <p>I would like to suggest you to create a test document with sizes such as 12 pt and smaller. Print this document at 600 dpi and at 1200 dpi. When the 1200 dpi output is darker in all sizes than the 600 dpi output, it is probably the rasterizer which renders the characters in a ‘different’ way at 1200 dpi. I have a Brother printer with a PostScript clone rasterizer. At 1200 dpi it rasterizes type in a way that is similar to graphics. All pixels that are touched by the outline are rendered black. At 600 dpi, only the pixels of which the center lies within the outline are rendered black. Someone from Adobe confirmed me this story, so the Brother PS clone seems to be perfectly mimicking the PostScript specs when it comes to rasterizing type. I have seen image setter output showing exactly the same effect. Back in the days when true 1200 dpi printers were rare, dedicated rasterizing suffered from being time consuming and laser image setters had rather thin spot diameters anyway, the idea of skipping a step in the rasterizing process may have been advantageous. Nowadays, processors have become much faster, and I think therefore it is now wrong to not rasterize 1200 dpi output exactly the same way as 600 dpi. I wonder that some of the engineers and programers do not seem to adjust their rasterizing algorithms accordingly.</p>
      <p><strong>Back to kerning:</strong> When rasterizing is inaccurate (as might be the case at 1200 dpi), spacing and kerning will become inaccurate too. But also rounding effects have to be handled some way or another. I do not know where the rounding effects are ‘hidden’. Between characters? In the combination of characters and word space? Is there a difference in handling rounding effects between justified and non-justified setting? I’d test this as well. In oder to avoid as much trouble as possible, I set all my test documents ragged left, switch off all InDesigns H&amp;J tricks and make sure that kerning is set to ‘metric’.</p>
      <p><strong>Back to spacing lowercase l:</strong> Although Walter Tracy recommends this in Letters of Credit, I do not think that it makes sense to space the lowercase l wider than d at the right. Tracy’s rule may have made sense in the days of unitizing at 18 units/em where a tight fitted lowercase l would stand out more than a loose fitted lowercase l, but today I think it doesn’t make sense anymore. When spacing, I ignore everything that is above the x-height or below the baseline. Except for f. I checked many many typefaces against Tracy’s rule and concluded that it is rather an exception than a rule. I recall a Swiss book propagating to space all ascenders (such as b, h, k at the left) and wider than the other letters in order to avoid words like ‘illuminate’ to become a dark spot at ‘illu’. It has to be noticed though, that the example was set in a tightly spaced Helvetica-like typeface at a small headline size. I think in that case, the observation was right, but the method chosen was wrong. When one uses tight headline spacing at relatively small headline sizes, as was advocated by Berthold and many typesetting houses that worked for the advertising agencies in those days, it is not just the l in ‘illu’ that messes up the balance between the intercharacter spaces and the counters. It is rather likely that all spacing is crappy.<br>
      We should rather try to look what happens in front of our eyes, than trying to condition our eyes through misunderstood legends from the past.</p>
