      <p>I've been kerning type a long time -- counting photocomp, about 35 years. To this day, I never rely on a laser printout to judge kerning. In a way, laser printouts are a step backwards, because with photocomp, we could run out our tests on the typsetting machine. At least there, whatever rounding decisions the software was making were the same as when used for work.</p>
      <p>Here's a long thread that goes into some of the issues:</p>
      <p><a href="http://typophile.com/node/100135" title="http://typophile.com/node/100135">http://typophile.com/node/100135</a></p>
      <p>Good luck with it all,</p>
