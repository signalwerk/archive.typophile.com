    html: |-
      <p>When you say "rounded", do you mean soft ends? If you want something heavier than this, you're getting into <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/vag_rounded_std_complete_vp/" rel="nofollow">VAG</a> and <a href="http://www.fontshop.com/fonts/downloads/itc/frankfurter_std_virtual/" rel="nofollow">Frankfurter</a> territory.</p>
      <p>Or perhaps you mean "rounded corners", in which case <a href="http://www.fontshop.com/fonts/singles/paratype/magistral_extra_bold_ot/" rel="nofollow">Magistral</a> or <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_max_ot_black/" rel="nofollow">FF Max</a> may fit the bill.</p>
      <p>But either way, there's nothing good that is rounded, heavy, <em>and</em> this wide.</p>
