  html: <p>I was searching around for a typeface to use in a magazine I am creating for my final advanced type project. <br> <br><a href="http://tinyurl.com/42556">AUTO by Underware</a> <br> <br>AUTO was the one I found that seemed the best suited to what I was doing with my project. The magazine is focused on design and indie music, discussing packaging - posters - old vinyl - ephemera - etc. <br> <br>The price tag for AUTO is WAY to high for a personal/student project so I wondered if you great typophiles had some suggestions for body type that was in the same vein and feel as AUTO - but in a much lower price range, or (yeah right) free. <br> <br>THANKS guys and gals <br> <br>shawn</p>
  html_clean: <p>I was searching around for a typeface to use in a magazine I am creating for my final advanced type project. <br> <br><a href="http://tinyurl.com/42556" class="link-external">AUTO by Underware</a> <br> <br>AUTO was the one I found that seemed the best suited to what I was doing with my project. The magazine is focused on design and indie music, discussing packaging - posters - old vinyl - ephemera - etc. <br> <br>The price tag for AUTO is WAY to high for a personal/student project so I wondered if you great typophiles had some suggestions for body type that was in the same vein and feel as AUTO - but in a much lower price range, or (yeah right) free. <br> <br>THANKS guys and gals <br> <br>shawn</p>
