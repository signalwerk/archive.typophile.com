    <p>I have decided that it is time to learn a spot of Python / Robofab to make things happen. During my scouting, I came across Drawbot, “an ideal tool to teach the basics of programming.” Sounds like me! However, it refuses to work on my machine (10.4.5) and before I spend more time figuring out why, I would like to know if anyone here has found it useful—especially in regards to learning Python for typeface produciton. </p>
    <p>Cheers! </p>
    <p>—K</p>
