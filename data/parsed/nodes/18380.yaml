      <p>kris,</p>
      <p>having learnt some DrawBot with <a href="http://www.petr.com" target="_blank">Petr van Blokland</a> in my undergrad course and now with <a href="http://www.letterror.com" target="_blank">Just van Rossum and Erik van Blokland</a> in the postgrad, I can only say Drawbot is one of the funnest ways imaginable to learn something as dull as a programming language: With incredible little knowledge you can at least do some funny patterns and through programming these learn using dicts, lists and tuples, for-a-in-x-loops and if-then-loops, objectifying your programming into methods and classes etc etc. </p>
      <p>nice book: David Beazley, Python Essential Reference, Riders Press</p>
      <p>Have fun with Drawbot, and holler if you can’t get it to work.</p>
      <p>kai</p>
