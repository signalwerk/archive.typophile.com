    html: |-
      <p>I could have sworn that Michael made his (custom designed) typeface commercially available at one point. I have this vague and unconfirmed memory of seeing it in a little box (back in the days of floppy disks) on a shelf at store called Builder’s Booksource in Berkeley. I’ve never seen it or any reference to it since, and now wonder if I imagined the whole thing.</p>
      <p>Does anyone know?</p>
      <p>Otherwise, Eagle seems to be the closest match.</p>
