    html: |-
      <p>There are lots of diagnosis you can perform to find the problem. With the provided information there is nothing that anyone can do. Try these methods:</p>
      <p>1. Empty the arabic block glyphs so there is no shape in the glyphs, but glyphs are there and then generate the font. If the font worked, then there is something wrong with shape of glyphs.</p>
      <p>2. There might be a problem with name of glyphs, make sure that name of glyphs are according to Adobe standards. For example character with unicode number of 0641 should be named uni0641. If you rename glyphs, you have to rewrite the OT features of the font.</p>
      <p>3. There might be a problem with opentype features of the font. Have you created proper opentype features for the arabic part or you have already used a template with binary OT features? Empty the OT features then generate the font. If the font worked, then you have to consider rethinking the OT features.</p>
      <p>Good luck</p>
