    html: <p>Well, guess what? After deleting here and there, resetting here and there, I found out it was the glyph at 0600 the culprit for all this mess. I tried to redraw it, repaste it, re-everything, but the only way to make the entire font work, was fully deleting the 0600 glyph. I filled the OT features again and worked as a charm. Thanks again for your advice, Bahman Eslami!! :)</p>
