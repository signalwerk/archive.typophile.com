  html: |-
    <p>I made a font recently and it worked fine. Then I decided to do the Arabic unicode block, then the Arabic presentations A and B.<br>
    Now that I generated the font, Word crashes (but not InDesign) when I copy an arabic text (from Wikipedia) and paste it in a document using my font. I used UnicodeView and the Character Map to see the font and it all works, except when selecting the Arabic block (0600 - 06FF). CharMap crashes and Unicode View fills the screen with error messages saying some dll crashed and a memory segment was violated, blah blah blah.</p>
    <p>What intrigues me is the fact that Arabic Presentation Forms A and B (FB50-FDFF &amp; FE70-FEFF respectively) do not generate this error. Also, when generating the font, FontLab Studio 5 does not warn of anything wrong and generation is successful.<br>
    Any ideas? I'm lost. Easiest thing to do is delete the arabic block, but I'd rather solve this error.</p>
    <p>PS: I use InDesign CS6, so the text is backwards, so no use. (They say I need InDesign MENA but I won't buy it). My OS is Windows 7, 64b, latin america. My Office is MS Office 2013. Works great with arabic in every font, except mine. So, it IS my font.</p>
