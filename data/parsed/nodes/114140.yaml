    html: |-
      <p>This type of font can be made by cutting serifs on a Didot and making some other edits.<br>
      Can't recall off hand if this one is a bespoke font for New York Magazine. If so, presumably it would have been made by legitimate means, i.e. from scratch or a scan of a printed Didot specimen rather than from an existing digital didot.<br>
      Another sans serif Didot<br>
      <a href="http://www.typographyserved.com/gallery/Sans-Serif-Didot/2135920" title="http://www.typographyserved.com/gallery/Sans-Serif-Didot/2135920">http://www.typographyserved.com/gallery/Sans-Serif-Didot/2135920</a><br>
      Link to purchase it<br>
      <a href="http://www.hellofont.com/vfonts/156" title="http://www.hellofont.com/vfonts/156">http://www.hellofont.com/vfonts/156</a><br>
      An example of Didot snipping <a href="http://dev.typophile.com/node/103636" title="http://dev.typophile.com/node/103636">http://dev.typophile.com/node/103636</a><br>
      Another similar<br>
      <a href="http://typophile.com/node/84062" title="http://typophile.com/node/84062">http://typophile.com/node/84062</a><br>
      Don</p>
