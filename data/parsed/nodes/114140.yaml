      <p>Agree with Don. Most probably a bespoke typeface for New York Magazine but unfortunately, I wasn't able to find any information on it.<br>
      Some alternatives you might like: <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/simply-grotesk" rel="nofollow">Simply Grotesk JNL</a>, <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/s/stark-debonair.html" rel="nofollow">Stark Debonair</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/vanitas" rel="nofollow">Vanitas</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/andrijtype/seaside" rel="nofollow">Seaside</a>, <a class="freelinking external" href="http://www.swisstypefaces.com/fonts/sangbleu" rel="nofollow">Sang Bleu</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/castletype/carisma" rel="nofollow">Carisma</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeinnovations/contax-sans" rel="nofollow">Contax Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/green-type/patriciana" rel="nofollow">Patriciana</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/euro-sans-pro" rel="nofollow">Euro Sans</a>, <a href="/wiki/https%3A/%252Fwww.behance.net/gallery/Tenor-Sans/3351597" class="freelinking" rel="nofollow">Tenor Sans</a></p>
