    html: <p>I think it's because TextEdit throws away kerning and doesn't care about OpenType features. It ignores them. It prefers to see Apple's own AAT tables built into the font. So that's why TextEdit likes Apple's own fonts. <br> <br>InDesign, on the other hand, is OT-savvy, but not AAT-savvy, I think. So it's the other way around. There is less than a handful of fonts that have both OT and AAT tables (ok, only one, I guess). I suspect that most people are going to ignore AAT and develop OT tables for their own fonts, regardless of which technology is better. <br> <br>I'm totally guessing. <br> <br>Alan</p>
