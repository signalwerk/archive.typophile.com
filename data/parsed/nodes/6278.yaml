  html: <p>After making a kerning run through my current project, I fired up TextEdit on Mac OS X 10.2 to check out the results. I was a bit shocked and fully dismayed to see nary a kern. Adobe InDesign 2.0, on the other hand, handles the kerning just fine. <br> <br>After a bit more exploring, it seems clear that you have to choose a platform. Apple supplied fonts kern only with apps that use their text engine, no kerning in sight in InDesign. FontLab generated fonts, OpenType in my case, kern great in InDesign but fall over in TextEdit. <br> <br>Is this really the sad state of type on Mac OS X? After finally settling on OpenType as a crossplatform format, are we going to have to go back to offering multiple downloads, one for each text engine? Or is there a way to insert an Apple format kerning table into my OpenType font?</p>
  html_clean: <p>After making a kerning run through my current project, I fired up TextEdit on Mac OS X 10.2 to check out the results. I was a bit shocked and fully dismayed to see nary a kern. Adobe InDesign 2.0, on the other hand, handles the kerning just fine. <br> <br>After a bit more exploring, it seems clear that you have to choose a platform. Apple supplied fonts kern only with apps that use their text engine, no kerning in sight in InDesign. FontLab generated fonts, OpenType in my case, kern great in InDesign but fall over in TextEdit. <br> <br>Is this really the sad state of type on Mac OS X? After finally settling on OpenType as a crossplatform format, are we going to have to go back to offering multiple downloads, one for each text engine? Or is there a way to insert an Apple format kerning table into my OpenType font?</p>
