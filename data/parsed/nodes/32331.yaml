    html: |-
      <p>If you open up the macro in a text editor you'll find the following paragraph:</p>
      <p><em>Purpose: This script sets the start point for every contour in every<br>
      glyph. Useful for making it easy to compatibilize several single master<br>
      faces in preparation converting them into an MM face.</em></p>
      <p>So looks like the main goal of this macro was to lay the work for "Add Master Design", another AFDKO macro.</p>
      <p>Looking at the Adobe Type 1 Font Format spec, there's a paragraph that reads:</p>
      <p><em>Whenever possible, use the <strong>closepath</strong> command to draw one<br>
      of the straight line segments, rather than closing a character<br>
      with a <strong>closepath</strong> that results in a zero-length line segment.</em></p>
      <p>This essentially means that a starting point should preferably be placed <em>after</em> a straight line.</p>
      <p>The placement of the start point(s) can also have some influence on how the glyphs render at small sizes. AFAIK, this is related with which set of hints is in effect for a portion of the outline(s) at a given time.</p>
      <p>The image below displays the rasterization of similar glyphs representing the letter 'A'. The only difference between them is the placement of the starting points (on the internal contour – the counter – and on the external contour). Observe how the counter is not in its optimal position in some of the examples, and/or how the "legs" of the 'A' are sometimes either too thick or too thin.</p>
      <p><img src="/sites/default/files/old-images/startpt_A_4418.png"></p>
