    html: |-
      <p>It's when a node goes wacky an literarily creates a spike. I've seen a few recently while working on a project. It happened after applying a transformation to the outlines. Now imagine something like this happening while you're using the font... ouch!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/spike_e_4084.png"></div><p></p>
      <p>Here's a paragraph from the Adobe Type 1 Font Format spec about it:</p>
      <p><em>Make sure that any subpath section formed by the closepath<br>
      command intended to be zero length, is zero length. If not, the<br>
      closepath command may cause a “spike” or “hangnail” (if the<br>
      subpath doubles back onto itself) with unexpected results.</em></p>
