      <p>BTW, if you look at <a href="/wiki/Minion" class="freelinking" rel="nofollow">Minion</a> you'll find that all contours have at least one straight segment — although it may be just one unit long in round glyphs such as the 'O'. This was done in order to avoid <a href="/wiki/spiking" class="freelinking" rel="nofollow">spiking</a>, when generating font instances from the MM source. (AFAIK, there's no reason to do this if you're generating the instances with FontLab)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/minion_o_5567.png"></div><p></p>
