    <p>Hi,</p>
    <p>What exactly is the need to set start points correctly? And what is "correct"?</p>
    <p>If we forget about the bug in FontLab (and hope it’s fixed soon) when a tangent (if a startpoint) gets converted into two nodes on the same spot) – what is the real need to use, for instance, the "Fix Startpoints" macro in AFDK?</p>
    <p>Or use the "Relocate Startpoints" option in FontLab (where you can choose between four positions)?</p>
    <p>What could be the worst that happens if I not set the starpoints correctly according to the FDK?</p>
    <p>Any practical situations that explains the whole picture?</p>
    <p>I’m anxious to know :)</p>
