    html: |-
      <p>I don't know which tool was used to generate instances (during the font production phase), before we started using FontLab.</p>
      <p>What I'm saying is, back in the day when Adobe was still producing and selling MM fonts, that trick had to be done, otherwise the rasterizer could create spikes in some glyphs, for instances created on-the-fly by the user — not by the font developer.</p>
      <p>Nowadays there's no need for that artifact, unless you're licensing your fonts in MM format ;-)</p>
