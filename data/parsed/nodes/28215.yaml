    <p>Hello,</p>
    <p>I am in the process of redesigning my online portfolio. The old version (still online) just doesn't do it for me. I have tried to make it as mathematical as I can, all in keeping it ergonomically simple and aiming for intuitive navigation. It will be coded in HTML and will have the project menu at the bottom in flash technology. It is but a screen shot, but your opinions, your comments and crits are welcome.</p>
    <p><a href="http://www.dache.ch/dsin.png" target="new" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.dache.ch/dsin.png" target="new" rel="nofollow"><img src="http://typophile.com/files/previedsin_4953.png"></a></div><br>
    <a href="http://www.dache.ch/dsin.png" target="new" rel="nofollow">Link to new design</a><p></p>
    <p>Thanks.</p>
    <p>Regards,<br>
    David Pache</p>
