    html: |-
      <p>You mentioned wanting to specify Corbel. I'd avoid that, as 1) Vista won't be immediately adopted by everyone once released and 2) most viewers will then see plain-ol' Verdana anyway. I'd stick to what are now regarded as the standard web fonts for maximum compatibility among systems old and new (and Mac or PC).</p>
      <p>I also commend you for jettisoning Flash. While a great tool, it makes navigation really difficult and doesn't allow deep linking to specific projects in your portfolio. ("Hey, Steve, check out what this guy David did. Uh, just go to his site, then click on this, then scroll to this, then...")</p>
      <p>I like how clean the site looks. But, I'd still advocate including a different size, or a different font for headlines/subheads. It will make text-heavy pages (like "about") easier to read.</p>
