      <p>I am not keen on flash in portfolio sites, especially when the menu contains thumbnails of pieces of work; how do you see the print/webdesign sections working with the scrolling menu? I do like the simplicity of the design, but with simple/dry design the composition has to be spot on, for example the image area should have an equal space top and bottom (I understand the thinking behind it – the menu of extra pages) and should be aligned to the right, the scrolling flash menu takes up a rather large portion of the screen.<br>
      Tim</p>
