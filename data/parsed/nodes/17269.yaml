    <p>Hi there.</p>
    <p>I know the first War of the Worlds title logo used Perpetua, however, I was wondering if anyone could identify this font (pictured in the 2 images below). There was a case at the WTF forums and nobody ever identified, hoping someone here would be of more help. Thanks in advance. :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/worlds1.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/worlds2.jpg"></div><p></p>
