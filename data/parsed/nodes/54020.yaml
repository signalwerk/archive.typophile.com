      <p>Hello,</p>
      <p>With normal copy/past actions only the right side kerning is copied. If you select <em>Paste Special</em> you can select what you want to paste, e.g. Outline + left side kerning + right side kerning.</p>
      <p>Eigi</p>
    html_clean: |-
      <p>Hello,</p>
      <p>With normal copy/past actions only the right side kerning is copied. If you select <em>Paste Special</em> you can select what you want to paste, e.g. Outline + left side kerning + right side kerning.</p>
      <p>Eigi</p>
