    <p>I've been trying to copy entire glyphs in Fontlab -- for example, copying a single quote, to also work as a left quote and right quote (don't worry, I have a very expressive hand-written font, and this is appropriate for the design).</p>
    <p>When I do this, the kerning will copy, for the glyph in question vs. it's pair to the right. But, it will not copy the kerning for the glyph regarding it's pair to the left. Is there any way to do this? I have tons of individual pairs, since it's a very non-conventional font, and this becomes a big issue, especially, since even if I do it manually (which is very consuming), whenever I regenerate the kerning it erases all the manual changes. Is there a better software to take this on?</p>
    <p>I understand that class kerning is another approach to solving this issue. Unfortunately, I'm also having trouble with expanding kerning classes that were not built in a functional way earlier, so that I can't rebuild the classes in the way that I'd like to now. I just posted a question about this under a previous thread, so if that's answered it might alleviate this issue.</p>
    <p>Thanks.</p>
