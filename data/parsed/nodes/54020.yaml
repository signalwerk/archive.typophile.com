      <p>I do something similar sometimes -- use essentially the same numbers for superiors, numerators, and denominators. The vertical position is different of course. (Usually the superiors are a bit smaller, but in a pinch, the same side bearing can work.)</p>
      <p>So, kern one set, write off a AFM, grab all the numbers (grep "\.super" for instance) to a separate file. Here, search &amp; replace ".super" with .numr" and put them into the AFM. Then S&amp;R ".super" (or .numr) with ".dnom", and put them in the AFM file as well. Then import he new AFM back into Fontlab.</p>
      <p>Takes about as long as it took to write this post.</p>
      <p>You could do the same with "quote". Anyway, the moral is don't forget the AFM file as a vehicle for doing this kind of work.</p>
      <p>* * * </p>
      <p>Note: Before I get too much flack, if you are trying to minimize kerning, you don't give numerators and denominators the same side bearings. If you do it as above, you minimize kerning time with the numbers themselves, but usually have to kern them ALL with the fraction bar. But this way is fast, and when you hit 12/64, the fraction looks good.</p>
