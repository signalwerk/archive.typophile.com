    <p>i like the way the font looks and would like to use it for headlines and such. the actual img on the site is too small for me to make sure, so i WTFed the larger one found at brandsoftheworld; i can’t rely on BOTW having the most accurate versions of logos. the two closest results for that WTF are “Helvetica 83 Heavy Extended Oblique” and “Helvetica Neue Exp Heavy Obl”. do either of those sound about right for the actual ito en logo?</p>
