  html: |-
    <p>Dear all</p>
    <p>I've recently had to use Avant Garde as a headline font (body Myriad) with a logo composed of 3 lower case Futura letters within a geometric shape.</p>
    <p>Im dead against it frankly as </p>
    <p>1 Avant Garde isnt a pretty sight for me<br>
    2 Two kind of similar geometric shaped fonts that are kind of the same, look plain wrong together.</p>
    <p>Any thoughts?</p>
    <p>Thanks</p>
    <p>Stephen</p>
