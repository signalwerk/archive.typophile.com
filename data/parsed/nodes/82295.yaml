    html: |-
      <p>I don't know if "big" typefaces are really a thing of the past. After all, printing material on paper is still very common - and that's where a lot of effort is put into typeface choices, both for advertising and editorial material.</p>
      <p>A magazine like Vogue isn't going to download a font off of Dafont or use a 1001 fonts CD, after all.</p>
      <p>The market has changed because the number of professional typeface designers that are visibly active, independently of major typefoundries, is of course much larger now that they can make .TTF files for download instead of Monotype matrices and the like.</p>
      <p>But there are so many very familiar typefaces that people are happy with - Times Roman, Optima, Caledonia, Helvetica - nothing has come along to make them look "old-fashioned", the way it happened to Century Expanded (but more so to faces like Modern No. 7) and Caslon. Baskerville and Garamond, for example, haven't worn out their welcome.</p>
      <p>Stone Sans is clearly very popular, though - although there are several other typefaces out there that closely resemble it. So much so that there is no clear winner...</p>
