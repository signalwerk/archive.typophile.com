      <p>Isn't it that there are much more type designers out there than ever? I think the current trend goes more towards individualism. </p>
      <p>There are typefaces coming up trying to further blur the boundaries between categories. Serifs go wedge serif towards slabs. Sans serifs go stressed sans. All these concepts are rethought quite often. "Friendly" is in, but what is friendly? </p>
      <p>I think a really interesting font is the brand new <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100042" rel="nofollow">Ideal Sans</a>. A stressed sans that looks extremely balanced. Very harmonic, but not too playful to my eye. </p>
      <p>Another font that defies categories a bit is <a class="freelinking external" href="http://processtypefoundry.com/fonts/capucine/" rel="nofollow">Capucine</a>. </p>
      <p>I would bet big fonts are a thing from the past.</p>
      <p>The Helvetica of the 1990s was btw Meta Sans.</p>
