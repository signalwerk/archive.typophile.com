    <p>We’re happy to announce that the new Type ID board is sponsored by FontShop, a long-time supporter of Typophile.</p>
    <p>Once you’ve identified that mystery font, we encourage you to go buy it at <a href="http://www.fontshop.com">FontShop.com</a>. With over 30,000 fonts  and dozens of foundries to choose from, they’re bound to have just what you’re looking for.</p>
