    <p><img src="http://www.graphicdeclaration.com/images/GD_branding_bizcard_1.jpg"></p>
    <p>This will be printed on clear plastic and shown is the A side. I'll up the B side next which has all the details. But for the A side I just wanted to state a graphic declaration. What do you think of this color scheme?</p>
    <p>For the longest time I was keen on using blackletter ...and I would like to take this opportunity to thank all those who have given me their kind advice, also like to thank J.A.M. for his awesome generosity in letting me try out his unreleased Flamand Script.</p>
    <p>Comments and crits greatly appreciated, thanks in advance!</p>
