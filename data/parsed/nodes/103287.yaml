      <p>5star I love the audacity of this design. It has a very distinct 90's digital retro feel. Try the heavier weight but you might find the slab shadow will lose its emphasis. It gets enough attention as is and its a bonus that you're using easily clashed colours like magenta and cyan &amp; yellow.<br>
      It reminds me of websites with star mouse trails and MPEGS playing. This style is prominent in the fashion &amp; style industry, check out <a href="http://www.openingceremony.us/" title="http://www.openingceremony.us/">http://www.openingceremony.us/</a> &amp; <a href="http://www.lifelounge.com.au/" title="http://www.lifelounge.com.au/">http://www.lifelounge.com.au/</a></p>
