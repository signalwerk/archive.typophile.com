    html: |-
      <p>Are we talking about a business card, or a magazine cover?</p>
      <p>By “up” the B-side do you mean upload?</p>
      <p>Regardless, the direction of the “drop shadow/3-D zoom effect is a bit trendy, and likely to date very quickly. Within a year I would guess. In addition, it is “zooming” backwards. If it were “bursting forward with declaration” I would recommend it zoom from bottom left to top right, leading into the reading direction.</p>
      <p>To make it more timeless, I would stick with black and red. At the very least, a dark shadow so that the type “declares” its self off of the black. The yellow and cyan seem to exist on the same plane. If you want to switch it up a bit you could use a red shadow with type black. That way, it might look a little more trendy, hip, fashionable, contemporary &amp;c but still stand on a colour palette that is a bit more timeless.</p>
      <p>Perhaps you can speak a bit more about the firm, so we can make informed semantic decisions about the context and fitness for purpose instead of taking subjective aesthetic shots from the hip in the dark?</p>
