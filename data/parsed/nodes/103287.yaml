    votes: null
    html: |-
      <p>Dan, thanks for your comment(s). 'Audacious' just about sums it up. I believe that anyone foolish enough brave enough to step up and declare their independence either through their own enterprise or whatever their means maybe, is an audacious act!</p>
      <p>Who are you to be free?</p>
      <p>And... how dare you to strive to be free?</p>
      <p>My graphic firm is all about trying to communicate  that spirit of a declaration of independence. Within each graphic we (in vain) strive to be alive. Hard explain really. How do you describe a tour de force ....as compared to what? A polite/stale/trite center column gentile format? Really? Is that what free enterprise is all about ...becoming stale?</p>
      <p>I'll leave that answer to those best qualified.</p>
      <p>Chris, thanks for your reply bro. The direction of the projection has the sole purpose to add tension to the composition ...and to some small degree set up the word GRAPHIC.  The eye then travels to the word DECLARATION and then bottom right and then back up to the word GRAPHIC ...and on and on it goes. A graphic declaration as simple as that.</p>
      <p>20th Century Fox has somewhat of the same idea. Albeit composed in perspective vertically stacked. I chose to present the graphic flat. Flat to the picture plain. The 'projection', the element which heightens the text, is without emotional baggage of a perspective overture . It too is flat to the picture plain.</p>
      <p>Why flat? Well, that my friend is worth a semester's worth of lessons. Modern lessons. Non-biased lessons...</p>
      <p><img src="http://www.graphicdeclaration.com/images/GD_branding_bizcard_4.jpg"></p>
      <p>...I'm going with DIN as our typeface of choice. Some subtle difference from my original choice of Berthold (and light years away from my romantic choice of blackletter), I think it offers a slightly more relevant openness. And by B-Side I refer to flip side of the business card ..just like a old skool 45 record ... B Side. Get it???</p>
      <p>Upped on the A side is what is shown above ...I'll up the B side soonish like. You know, with the firm's stuffs like what up? Contact 'n' stuff.</p>
      <p>Ya? </p>
      <p>It's been a long time coming ...</p>
      <p>:)</p>
