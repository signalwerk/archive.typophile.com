    html: |-
      <p><cite>You have "neo" bracketed. If it's based on Helvetica, it would formally be neo-grotesque, correct?</cite></p>
      <p>Neo-grotesque is a phony category invented to inflate the perceived importance of 1950s/60s modernism, aka Swiss modernism or the International Style. But none of the original neo-grotesque families really does anything new stylistically; regimented grots/gothics with horizontal terminals date back to the nineteenth century and ATF had produced excellent examples in the early twentieth. The careful planning of the entire Univers family is really the important feature of the neo-grotesques and is not a stylistic feature. For the sake of honest design history the entire notion of the neo-grotesque category needs to be swept into the gutter.</p>
