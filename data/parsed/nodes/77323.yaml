      <p>"For the sake of honest design history the entire notion of the neo-grotesque category needs to be swept into the gutter."</p>
      <p>That is the most sensible thing I've read so far about this. In a sense then, you can't really produce a new neo-grotesque. It seems like the term was the "contemporary" classification of the 50's-60's for sans-serif designs, and now makes much less sense 50 years later. If it's not a formally differentiated style, then "neo" is really anachronistic, correct?</p>
