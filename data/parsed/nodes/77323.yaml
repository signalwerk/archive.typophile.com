  html: |-
    <p>Beside the obvious sans category, what classification would best suit FF Blur? Contemporary or "ambiguous" are all I can come up with. I'm working on list, and have not used "contemporary" yet, and don't want to. "Ambiguous" would not really be a classification, but more a lack thereof. </p>
    <p>How 'bout: Blurry Neo-Grotesque?</p>
    <p>Thanks!</p>
