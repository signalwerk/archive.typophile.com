      <p>It's merely (neo-)grotesque.<br>
      Different variants within the same type family, such as outline and shaded, are not classed as different typefaces, so why should blurred/rounded be?</p>
      <p>Neville Brody originally created this style by sandwiching sheets of clear acetate between negative type image and positive film, for an out-of-focus contact print. That's mentioned in the <em>Graphic Language</em> book.</p>
