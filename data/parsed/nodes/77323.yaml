      <p>Distressing is a category of style (bold and italic are others) which  may be applied to many traditional categories of type.</p>
      <p>FontShop lists eight cross-categories of "Distressed".</p>
      <p>Perhaps if it is done with a generic provenance (such as Blur), the result may be considered a new typeface, rather than a variant of an existing one (e.g. Metallophile, clearly a Futura family member).</p>
