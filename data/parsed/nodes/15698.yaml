      <p>ITC was formed in 1970. Why would a Czech font be more appropriate? And what does ITC have to do with anything anyway?</p>
      <p>For what it's worth, the cover line was a quote taken from a lengthy article in that issue that followed an infantry unit from basic training to active combat in Vietnam. The war was in its early stages at the time and the idea that U.S. soldiers were killing little girls was pretty shocking to Americans at the time. This was two years before My Lai. (Source: The Art of Advertising, George Lois on Mass Communication, 1977.)</p>
      <p>It doesn't say in the book I got this info from why Lois chose Bodoni. I suspect that he wanted something that looked sober and factual, and perhaps a face that looked like what the articles were set in. (They usually used Franklin Gothic on the cover.)</p>
      <p>By the way, the three Esquire covers that made the top ten were all designed by George Lois. He practically set the standard of what a good magazine cover is.</p>
