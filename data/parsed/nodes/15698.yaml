      <p>1966 was a very different time, not only in typography and magazine design, but in life in the U.S. This was the first time in American history that major media were asking very tough questions of our government. As Mark indicates, this was a shock to America.  We were killing babies. I graduated from college in 1966 and was soon after "absorbed" into the military. The following year, I was sent to Viet Nam.  I was stationed a few mile from My Lai when the massacre happened and heard about it from some nearby soldiers. I was there for the Tet offensive of 1968 and sent home the day Martin Luther King was shot. The world had changed greatly in 2 years. I was called a baby killer and spat upon after arriving back in the States.  This never would have happened 2 years earlier.<br>
      Sorry, back to type.<br>
      Lois probably chose a "normal" type to contrast this most "un-normal" act. It looked like a normal quote pulled from a magazine and just ripped your guts out for that reason. The land of Ozzie and Harriet, Father Knows Best, and Lassie were jolted out of their Hollywood dream by the stark, naked, unembellished truth of war.<br>
      Sorry again, back to type.<br>
