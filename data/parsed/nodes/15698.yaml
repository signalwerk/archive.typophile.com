      <p><em>It doesn’t say in the book I got this info from why Lois chose Bodoni. I suspect that he wanted something that looked sober and factual, and perhaps a face that looked like what the articles were set in. (They usually used Franklin Gothic on the cover.)</em></p>
      <p>By the way, the three Esquire covers that made the top ten were all designed by George Lois. He practically set the standard of what a good magazine cover is.</p>
      <p>FWIW, one of the first jobs the young George Lois had as a CBS staff designer, working under William Golden, was to redesign all the characters of Bodoni – Didot Bodoni as they called it – as the CBS corporate face. And he complained – jokingly – about how demanding Golden was. Bodoni does the job perfectly on the Esquire cover. Lois: big ego, but brilliant indeed.</p>
    html_clean: |-
      <p><em>It doesn’t say in the book I got this info from why Lois chose Bodoni. I suspect that he wanted something that looked sober and factual, and perhaps a face that looked like what the articles were set in. (They usually used Franklin Gothic on the cover.)</em></p>
      <p>By the way, the three Esquire covers that made the top ten were all designed by George Lois. He practically set the standard of what a good magazine cover is.</p>
      <p>FWIW, one of the first jobs the young George Lois had as a CBS staff designer, working under William Golden, was to redesign all the characters of Bodoni – Didot Bodoni as they called it – as the CBS corporate face. And he complained – jokingly – about how demanding Golden was. Bodoni does the job perfectly on the Esquire cover. Lois: big ego, but brilliant indeed.</p>
