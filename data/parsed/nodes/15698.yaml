      <p>For the type only cover, I'm reminded of what Bob Gill (Pentagram founder) had to say in his 1970s How-To book on graphic design (titled "Forget everything you know about graphic design"?), which was that the more interesting the copy is, the less creative treatment it needs. I think he gave the example of "Cure for cancer discovered" needing no creative spin. That philosophy was implemented by George Lois.</p>
      <p>The layout style Lois used for "Oh my God.." was an ad headline style of the '60s, whereby it looked like it was a text setting, blown up big -- Upper and lower case, flush left. Very informal and conversational, like the ad copy of the time. (However, they did nuance the setting for scale by tightening it up a lot.)</p>
      <p>At that time, Bodoni was appreciated as an un-fancy font (and is to this day by Massimo Vignelli et al), due to its rationalized geometric structure. Used real big in headlines, the serifs are like slab serifs, and the few funky idiosyncracies like the kink in the y's tail serve to roughen up the geometric logic of its overall construction, accentuating the "this is a scrap, enlarged" idea.</p>
      <p>Carl Ally countered Helmut Krone's "We Try harder" ads for Avis, which had body text set in something like 24 pt Perpetua Bold, with similar "big type' ads for Hertz, set in Bodoni Bold. Although they were working with typositor types, the idea was that those guys were blowing up fine text types to headline size and using them as massive "text" weapons. This effect of typographic scale can be appreciated more when you hold the magazine, rather than see it in a reproduction.</p>
      <p>Lois had done type-only headline ads (eg. "John, is Billy Coughing, Get him some medicine," again on a black background), and I don't think he drew a distinction in technique between the ads and editorial. It's all about the Big Idea. His Esquire covers used the same creative vocabulary as his ads. In "My God..", you have a headline and body copy, with an asymmetric use of plenty of "white" space. It is the ruthless minimalism, coupled with an exact positioning and balance of elements, which makes this a masterpiece. And the Big Idea. If Andy Warhol put the language of popular, commercial culture in the art gallery, George Lois put conceptual art on the street.</p>
      <p>BTW, Lois had served in the Korean War.</p>
