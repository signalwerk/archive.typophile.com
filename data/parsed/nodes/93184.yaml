    <p>Hi everyone,</p>
    <p>I've got a bit of time on my hands at the moment and am seriously considering giving type design another shot. My previous attempts (2 years ago) have resulted in nothing special, and the software I was using (fontforge) was frustrating to install and use. In particular, the lack of compatibility between Illustrator and fontforge got the better of me, and I came to the conclusion that it was just too much trouble to be worth it.</p>
    <p>I've been toying with the idea of giving either Glyphs or Typetool a shot (Typetool in particular seems a good cheap option, as I am a member of University faculty). </p>
    <p>However, the interface of Glyphs seems much more friendly, and, even though it is more expensive, seems more integrated with the Mac environment.</p>
    <p>I'm curious as to what people's thoughts are. Should I be giving fontforge another shot, or is it just too worrisome to deal with? Would Glyphs or Typetool be more appropriate for someone with no training in type design and someone who isn't going to pursue it professionally?</p>
    <p>Thanks, your feedback would be appreciated!</p>
