    html: <p>It is very complicated, indeed. It would be interesting to compare OpenType feature files between Zapfino Extra Pro and Bickham Script Pro; Adam posted (on another list I think) that Zapfino may actually outdo Bickham in complexity of contextual substitutions. It's possible, but in any case it's great to have another typeface of such complexity out there. <br> <br>Nobody has published a particularly detailed tutorial, but it's a subject that has been discussed in various OT feature production seminars. We'll be posting the feature file for Bickham Script Pro shortly, which should help. <br> <br>Regards, <br> <br>T</p>
