    html: "<p>John writes:  <br> <br>&gt; I wonder if Adam might have made  <br>&gt; a bit too much use of the looped d forms <br> <br>Oh, c'mon John <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Dan's image is a bit over the top because he activated discretionary ligatures. This is the reason why all the many loops appear -- normally, the dligs should better stay off. John is right: the looping forms have indeed pretty extreme impact on the overall appearance of the text, so they should be used with care. We had quite some concerns about the issue of the looped forms and we put extra care in making sure that they will not be overloaded. I reduced the frequency of the looping forms compared to the other forms. There is just one looped \"d\" form out of basic four set, plus there is a discretionary \"di\" ligature. If discretionary ligatures are on, in the word \"dedicated\" you get a pretty extreme clutter, but when the dlogs are off, the look is calmer.  <br> <br>Below is a piece of text with the contextual alternates and contextual ligatures turned off:  <br><img src=\"http://www.typophile.com/forums/messages/30/56402.png\" alt=\"Zapfino Extra LT Pro with contextuals off\"> <br> <br>Here is the same text with the contextuals on:  <br><img src=\"http://www.typophile.com/forums/messages/30/56403.png\" alt=\"Zapfino Extra LT Pro with contextuals on\"> <br> <br>It is important to realize that the letter combinations come out in a pseudo-random manner. Therefore, it is not really possible to foresee all possible combinations in all languages. We did quite some visual testing in various languages.  <br> <br>When the contextuals are on, you can see that the word \"dedicated\" comes out differently, depending on the surrounding text. As you can see in the text, the extreme swashes (\"battlefield\", \"altogether\") come out from time to time. Of course, you can always touch up the text manually. Since the features are contextual, exchanging one of the letters (by turning off the contextual alternates feature, activating the swash or stylistic alterate feature, activating one of the stylistic set features, entering a glyph directly via the Glyphs palette or a PUA Unicode index etc.) usually has impact on the remaining text. On the illustration below, in each line, I highlighted the glyphs that I manually exchanged -- you will notice that the rest of the text changes as well.  <br><img src=\"http://www.typophile.com/forums/messages/30/56404.png\" alt=\"Touching up Zapfino\"> <br> <br>Regards, <br>Adam</p>"
