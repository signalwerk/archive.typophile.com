    html: "<p>Working on the Zapfino Extra LT Pro project was a lot of fun, and a great honor. I wouldn't necessarily consider Zapfino Extra LT Pro and Bickham Script Pro direct \"competitors\". Both typefaces have different flavor. Bickham is a quite formal copperplate script with one set of basic lettershapes and plenty of beautiful complicated swashes. Zapfino is less formal, has less swashes but more basic shapes. Bickham simulates masterful \"slow\" calligraphy, Zapfino mimics a quicker, free hand. The structures of the features differ a lot as well. Since Bickham has less basic forms and more swashes, the features are more tied to particular letter combinations, with great care put into smart implementation of initial and final forms. Zapfino has more basic forms and less swashes, so the focus of the features is a pseudo-randomization. With Zapfino, if you type the same word three times, great chances are that each of the renditions will be different. The original Zapfino typeface is designed in four separate sets, but the principle is that all letterforms can interact with each other. Zapfino Extra LT Pro makes it possible for the first time, because all four sets of glyphs have \"equal rights\". The additional more swashy characters are designed to appear less often, and the OpenType implementation follows this principle. As with Bickham, Zapfino has contextual rules with the scope that goes beyond a word boundary. But generally speaking, the implementation of the OpenType features in both fonts is pretty different. I think they both complement each other rather nicely.  <br> <br>I have made some Zapfino movies. I put some Flash movies at: <a href=\"http://www.twardoch.com/zapfino/\" target=\"_blank\">http://www.twardoch.com/zapfino/</a> <br>They are just very plain real-time screen recordings of myself typing in InDesign. No tricks, no manual glyph selection. This is a pretty good illustration of the amazing effects that you can get by just typing.  <br> <br>As explained on <a href=\"http://www.linotype.com/8-36-8-17886/re-introducingzapfino.html\" target=\"_blank\">http://www.linotype.com/8-36-8-17886/re-introducingzapfino.html</a> the user is still free to touch up and fine-tune the text. You can select specific sets manually, enter the swashes, discretionary ligatures etc. But just typing gives you a pretty good first start.  <br> <br>For anybody interested in details, you are welcome to visit TypoTechnica in London: <a href=\"https://www.linotype.com/forms/typotechnicaform.html\" target=\"_blank\">https://www.linotype.com/forms/typotechnicaform.html</a> <br> <br>Best, <br>Adam</p>"
