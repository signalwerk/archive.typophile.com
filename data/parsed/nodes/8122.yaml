    html: <p>I was just looking at this today and it is really cool. I was wondering when there would be an OpenType of this font. The glyph substitution seems to be extremely complicated, and I would be interested to see how Adam programmed this. It would be great if he or someone else who is very OT-savvy to write a tutorial on doing similarly sophisticated substitions. (Or are there such tutorials already?)</p>
