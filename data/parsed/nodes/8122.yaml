    date_raw: 19 Dec 2004 — 8:48pm
    votes: null
    html: "<p>Hrant, my Clio Greek, which you saw at ATypI in Rome is based on the smaller sizes of Granjon's Greek (the smallest sizes have the most ligatures, which is why I think Greek ligation was functionally employed to be economical of space in e.g. foot and margin notes). There are currently, to my knowledge, three Byzantine style Greek fonts that could make very use of really extensive OpenType Layout: my Clio (still only partially complete), Frank Jalleau's digitisation of Garamond's grecs du roi, and George Mathiopolous' digitisation of Zacharias Kalliergis earlier renaissance type. Matthew Carter's Wilson Greek also has a relatively high number of ligatures, but fewer than the renaissance models: by the time of the Foulis Press type on which Wilson is based, ligatures were disappearing from Greek typography. <br> <br>I think you and I probably share the view that Granjon's are the best of the renaissance Greeks. Some commentators have tended to downplay them because they are so obviously based on Garamond's grecs du roi, but the fact that they're derivative doesn't alter the fact that they are much more accomplished than Garamond's original. Simply, Granjon was a better craftsman than Garamond.</p>"
