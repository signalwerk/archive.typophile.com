hts, in comparison to Zapfino's two, the amount of encoded contextual features is, as far as I can tell, far larger in Zapfino. <br> <br>The programming of this new verion of Zapfino was done by Adam Twardoch. <br> <br>Here are two images showing a bit of the potential of the new Zapfino. I created the first by setting text in the new Zapfino, with all OpenType features turned off. With old versions of Zapfino, this is what you would have gotten by using just the Zapfino One font. In the second image, I selected the text, and turned on two OpenType features: Discretionary Ligatures, and Contextual Alternatives. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/55692.gif\" alt=\"Zapfino, without OpenType features\"> <br><img src=\"http://www.typophile.com/forums/messages/30/55693.gif\" alt=\"Zapfino, with two OpenType features\"> <br> <br>So, I've posted this in General Discussion instead of in News, because I'd like to hear what you think about the new Zapfino (or even of the old Zapfino's, Hermann Zapf's calligraphy, or anything else</p>"
