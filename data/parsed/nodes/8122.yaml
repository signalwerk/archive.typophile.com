    html: "<p>Thomas: it would be wonderful to see the scripts for Bickham. I am surprised and pleased to see that such sophistacated and beautiful fonts are being released at such affordable prices (from both vendors), and that Adobe is making their tools readily available to font developers. <br> <br>It is interesting to see on the Zapfino animation just how complicated and almost wacky the substitutions are compared to the ones on Bickham. The subsititutions on Zapfino continue even when typing into the next word! I am curious not only how this was done but what kind of rules were used and for what reasons, i.e. the criteria for deciding what gets switched and when.  <br> <br>BTW, kudos on the website for Zapfino. It is the best site I have seen for a font and the animations really show off the font well.</p>"
