  html: "<p>Linotype is pleased to present the newest updates to the successful Zapfino family, <a href=\"http://www.linotype.com/61955/zapfinoextraprocontextual-font.html\" target=\"_blank\">Zapfino Extra LT Pro (Contextual)</a> and <a href=\"http://www.linotype.com/61959/zapfinoextraforteprocontextual-font.html\" target=\"_blank\">Zapfino Forte LT Pro (Contextual)</a>. <br> <br>Zapfino was first designed by Hermann Zapf in 1998. Not completely satisfied with the result, Zapf revisited the design a few years later, with Linotype's Type Director <a href=\"http://www.linotype.com/7-469-7/akirakobayashi.html\" target=\"_blank\">Akira Kobayashi</a>. This effort was released as Zapfino Extra and Zapfino Forte (a new, bold weight) in 2003. Since that time, both Zapf and Linotype have heavily investigated the potential offered by OpenType's advanced features. <br> <br>The contextual versions of Zapfino work with OpenType-supporting applications, like Adobe InDesign 2.0 &amp; CS, Adobe Ilustrator CS, and Adobe Photoshop CS. When a designer sets texts in these new fonts, and activates all OpenType features, the font will draw on an enormous databank of contextual alternates and ligatures, changing your text as you type or select, and giving you a result that would have taken a lot more time to create by using the old Zapfinos (which required you to switch between four different alphabets to find the glyph you wanted). <br> <br>Of course, using the glyph palette, you can edit text set in Zapfino even further to your liking. <br> <br>To our knowledge, Zapfino is the most advanced OpenType font released for a latin-based alphabet to date.  <br> <br>I would personally be interested if anyone here would objectively compare Zapfino with Adobe's recent release, the fabulous Bickham Script Pro. Although Bickham Script Pro has a few more glyps (1700+ to Zapfino's 1600+), and Bickham has three complete weights, in comparison to Zapfino's two, the amount of encoded contextual features is, as far as I can tell, far larger in Zapfino. <br> <br>The programming of this new verion of Zapfino was done by Adam Twardoch. <br> <br>Here are two images showing a bit of the potential of the new Zapfino. I created the first by setting text in the new Zapfino, with all OpenType features turned off. With old versions of Zapfino, this is what you would have gotten by using just the Zapfino One font. In the second image, I selected the text, and turned on two OpenType features: Discretionary Ligatures, and Contextual Alternatives. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/55692.gif\" alt=\"Zapfino, without OpenType features\"> <br><img src=\"http://www.typophile.com/forums/messages/30/55693.gif\" alt=\"Zapfino, with two OpenType features\"> <br> <br>So, I've posted this in General Discussion instead of in News, because I'd like to hear what you think about the new Zapfino (or even of the old Zapfino's, Hermann Zapf's calligraphy, or anything else</p>"
