    html: <p>Hermann Zapf did seem to address the final letter alternate issue in his design, John. Zapfino Extra has 16 glyphs specifically intended for use as the closing letter of a line. 2 "a"s, 2 "d"s, 4 "e"s, 3 "n"s 1 "o", 1 "t", and 1 "y". There are also 2 extra swash glyphs that may be added onto the crossbar strokes of the "f" or the "t" as connectors.</p>
