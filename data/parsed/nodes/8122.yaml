    votes: null
    html: "<p>I wouldn't be surprised if the lookups for Zapfino Extra Pro were more complex than those for Bickham Script Pro. I drafted a memo on Zapfino OT for Linotype when Adam started on the project, outlining our experience making the Apple version and suggesting what might be done for OpenType. I'm really glad Linotype decided to go 'whole hog' and do the major contextual work. <br> <br>One of the reasons the Zapfino lookups may be more complex than Bickham Script's is that there are a lot of possible combinations among the Zapfino stylistic variants that actually look quite bad -- e.g. letters with clashing extenders --, so one of the big tasks in Zapfino would be to ensure that chaining contextual lookups do not result in combinations that look bad. I think there are probably fewer problematic instances in Bickham Script because there is greater regularity in the design. Zapfino is a difficult design to work with well. If you compare the two illustrations Dan provided, there is no doubt that the lower one is more exciting, but the upper one is tidier. It is quite easy to make a mess with Zapfino, and I wonder if Adam might have made a bit too much use of the looped <i>d</i> forms: these can overwhelm the forward movement of the script. The contextual stuff is really great, but to get the very best out of Ζapfino typographers will still need to manually adjust the results with any eye to the overall composition. Bickham Script is more forgiving. <br> <br>And I really wish Hermann would draw some terminal forms, so that words don't end with the long tail going nowhere. When users were querying the radical differences between the Zapfino that shipped with the first version of OSX and the one that shipped with Jaguar, I encouraged them to think of Zapfino -- which had already been through two incarnations before Apple licensed it -- as a kind of typographic laboratory: the font that might never be 'finished'.</p>"
