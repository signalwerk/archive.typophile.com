      <p>The file size seems right to me—my copy is the same size.</p>
      <p>Zapfino Forte is not the bold version of Zapfino Extra, but rather a separate, heavier font that Hermann Zapf drew to accompany Zapfino Extra.</p>
      <p>It can be used like a bold, but isn't the bold, if that makes sense.</p>
      <p>Therefore, it does not have the same number of features that Zapfino Extra has, i.e., it has far less glyphs (it doesn't have four variants for each letter, like Zapfino Extra). </p>
      <p>When you mean that the font doesn't work, I assume that you mean that you can't get the OpenType features out of it that are in Zapfino Extra. Does it work otherwise, i.e., when you type, does text appear on the screen? If so, it would probably seem that the font is actually functioning properly. </p>
      <p>If you need more help, or ever need any assistance with Linotype products, please do contact us again at <a href="mailto:info@linotpe.com">info@linotpe.com</a>, or +49 (0) 6172 484-418 (Phone), or +49 (0) 6172 484-429 (Fax). I try to help out on Typophile wherever I can, but Linotype's support staff does not search or visit this forum often.</p>
