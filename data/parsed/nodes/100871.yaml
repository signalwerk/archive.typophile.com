    <p>I'm currently wondering how Google manages to make Roboto look pretty much exactly the same on different browsers. If you're wondering, have a look at it in Firefox, and then a webkit browser like Chrome:</p>
    <p><a href="http://www.google.com/nexus/4/" title="http://www.google.com/nexus/4/">http://www.google.com/nexus/4/</a></p>
    <p>Now, here's a comparison to what it looks like on a test page I've set up:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/web-font-differences_4183.png"></div><p></p>
    <p>The rendering in Safari makes the font unusable. So the question is:</p>
    <p><strong>How does Google do it?</strong> It seems like I'm missing something? At first I thought they might be serving different fonts, but I've checked, and they are identical. I feel like I'm missing something?</p>
    <p>Any insights are greatly appreciated!</p>
