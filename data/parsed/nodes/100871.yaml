      <p>It seems like editing posts is not a feature here. Sorry for breaking the layout with that image, I didn't check and thought it was &lt;600px wide.</p>
      <p><strong>Problem solved:</strong> I just realized that a webkit style was disabling subpixel antialiasing, which made the fonts appear much thinner compared to how they were rendered with subpixel antialiasing in non-webkit browser.</p>
