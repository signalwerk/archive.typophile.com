    html: "<p>Glad you like it! Yes, it's custom (working title: Faina). I've only really finished the caps of the condensed medium weight seen above but it's already come in handy on lots of book covers. I'm also working on a wider version where the boxy corners get more pronounced. I hope to complete bold versions of both condensed and extended fonts (caps only) and interpolate a lot of options from there.</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/faina-hambur_6007.gif\"></div><p></p>"
