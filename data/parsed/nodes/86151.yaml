      <p>Hey, Cool Hand! Hope all is well.<br>
      [Just the man I want to talk to but not about this. I need to know if a FontLab Python script is doable for something and if you can do it and at what price. Expect an email.]</p>
      <p>And since it IS you, I'll answer:</p>
      <p>The question was born of time-wasting experience while discussing this stuff with attorneys.<br>
      Not one of them had any idea how, technically, a font was put together. And that adds a kind of mystery to the discusion that I'm detecting with ehague. Ehague is vague (hey, that rhymes!)on the point and the nature of a font's construction is a critical "fact" in the legal sense.<br>
      That a font is not "code" as people would normally conceive of it, but rather a database containing labels and numbers is very important.<br>
      Hence, OpenType "Tables". Tabular data. Every attorney I've spoken to, was rather taken aback by that.  "You mean that's all it is?" was the usual response.</p>
      <p>I'm technical. You're technical. We have the background to read the OpenType spec and understand what it says. (You moreso than me, I'm sure.)<br>
      Telling a a lawyer or a judge to "go read the OpenType Spec" is not only counter-productive, but you don't talk to judges or write briefs that way.</p>
      <p>Does that cover it? Or did you have a different point in interjecting?</p>
