      <p>On the contrary, it seemed to me that SSi was directly arguing merger doctrine: that the placement of points was determinative and hence not protectable by copyright. Paul King was certainly arguing that against me and Thomas and others on comp.fonts at the time. His whole (copyright) case rested on this, and he settled when Judge White's summary judgement very clearly stated that the position of points was not determinative and was protectable by copyright.</p>
