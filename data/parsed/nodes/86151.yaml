      <p>I find it sad, and personally, offensive that the legal system has no reasonable, verifiable, fair to all, and absolute way of protecting the original visual design of a typeface.  It bothers me, yes, because I am one of the few hundred people in he world who chooses  to design type.  I am glad that at least there is some kind of alternative way to hold back the hordes of ripoff artists who would surely take a shot at type design piracy if the "software" laws were not in place.  As unfair as they may seem to the few hundred practitioners of type design, it is still the only tool at our disposal.</p>
      <p>Thomas (above) mentioned the "legal" procedure that a font pirate could follow and not be prosecuted under current laws.  Surely this is not "airtight" protection.  It does possess one very significant deterrent to thieves and pirates.  It involves many hours of work (and reasonable skill).   </p>
      <p>After all, thieves and pirates become thieves and pirates to avoid the "many hours of work" honest men accept as needed. Without this "Work-around" called software similarity, all a thief has to do is duplicate someone else's font files and that is hardly any work.</p>
      <p> Although I pride myself as a man who does not believe in violence, I must admit that I chuckle to myself at the thought of planting a bit of code in a font that would flawlessly determine if the file were a legitimate one or not. Those found to be tainted would proceed to melt the host computer into a foul smelling blob of vermin that clung forever to the guilty culprit--Fun thought but quite impossible so I will make myself content with the knowledge that thieves hate work.</p>
      <p>Above all, I don't want to punish our good paying customers for their honesty by making them bear the burden created by the thieves and pirates who roam free.  If we cannot always punish the guilty, then let us surely add no misery to the innocent purchasers of our wares instead.</p>
