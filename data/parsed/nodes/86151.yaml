      <p>@kentlew</p>
      <p>Thanks.</p>
      <p>@ehague</p>
      <p>If you'd be so kind, my request for the citations still stands. However, because of time factors - I'd love to argue from all angles - I decided to cut to the chase.<br>
      Ye olde bottom line.</p>
      <p>Check out the case "Meshworks v Toyota". In that case, the court held that vector depictions of Toyota cars - exactly like fonts are depictions of typefaces - are "slavish imitations" of the cars by digital means and therefore not copyrightable. The appeals court upheld the lower courts ruling, (a good thing for the "strength" of the precedent), and denied the plaintiffs a copyright on the vector-based depictions of the cars. The decision was even humorously apologetic with a "nice try, but sorry, you're screwed" kind of tone to it.</p>
      <p>The court ACKNOWLEDGED that there was choice, acknowledged that there was great labor, but still, in line with clear precedents, like Feist, in essence told the plaintiffs that their copyright registration was good for nothing.</p>
      <p>All you have to do is substitute the word "typeface" for "cars" and the reasoning will lead you to exactly the same result. Eldred doesn't even enter into it, but it is, I guess, additional bad news.</p>
      <p>Meshworks has been written about quite a bit.</p>
      <p>Uh, Typophilers - don't get in a snit about "slavish imitation'. It's no slur and doesn't necessarily mean, literally, slavish imitation. If Hague responds, I'll explain.</p>
