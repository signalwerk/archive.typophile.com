      <p>"If we take it as a given that type design enjoys comparatively little protection in the US (or that these protections are rarely invoked)...."</p>
      <p>I know that wasn't your question, but I don't think it is at all reasonable to take that as a given, and there is a big difference between something being legal and illegal, even if the "protections are rarely invoked."</p>
      <p>Or to put it another way, if there was NO legal protection for digital font files, if font file sharing were legal, that would be a huge blow the type industry. The font retail market as we know it today would pretty much vanish overnight. The fact that typeface design is incarnated in OpenType and TrueType fonts, which are then treated as software for IP purposes, is a pretty big deal, and in terms of understanding how the field of type design is doing.</p>
      <p>It's as if the visuals of a film were not protected, but all forms films are distributed in were protected, and it was legal to do a recording of the picture you saw in the theatre. The film industry would not like this, but as long as the product they actually distribute was still legally protected (like fonts are), the fact that some abstract concept of the film was not protected would not have a major economic impact. Same principle explains the health of the type industry.</p>
      <p>Of course, retail font sales aren't everything... but for many, perhaps most type designers they are a vital portion of their income (or their employers' income).</p>
      <p>Cheers,</p>
      <p>T</p>
