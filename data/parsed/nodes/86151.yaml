      <p>@dunwich<br>
      <em>"Richard, if you are going to use Typophile as a platform for passing yourself as some sort of web typography expert, you should at least stick to the subjects where you are remotely credible."</em></p>
      <p>It's true, I'm incredible. Or so my girlfriends have always told me. This is not news. Incidentally, the following comment I've written is rated "For Mature Audiences" and there are parts during which you might have to excuse yourself.</p>
      <p>@butterick<br>
      Even if IP law is not your thing, you being an attorney and therefore (I should hope) more aware than most about how the legal system works - I'd like to point out that what you've written - especially regarding biases from hired guns with vested interests in telling a client what they want to hear - should be taken quite seriously. An adversarial approach is the one to take. And if an attorney like William Patry or Jessica Litman or James Boyle could be enticed onto a panel, wow, that would be something.</p>
      <p>@all</p>
      <p>I'm glad that Thomas Phinney - who I like and respect and who has a high degree of intellectual integrity - has made it clear that for the most part, his views are a pass-along of stuff he's been told by lawyers working for Adobe and a lawyer for litigants like Font Bureau. I don't know if it was his intention or not, but this does get me off a hook. (Thomas loves type and the type community and should he feel those things being threatened and should his considerable powers of reason and analysis fail him as a result, I would understand anyway. We're all suckers for love.)</p>
      <p>Which brings me to the question:</p>
      <p>Which would you prefer, arranging your business affairs based on a realistic and unbiased assessment of the protectability of fonts under copyright law today - in light of thirteen or so years of new case law and the proliferation of fonts into the six figures and a move into the mainstream of people's consciousness - or stay stuck in 1997, all comfy and self-deceptive and base your decisions on what amounts to corporate propaganda left over from a time when a few big companies thought they could gain competitive advantage and an enduring revenue stream by, in effect, securing access to the use of human language itself by claiming ownership of digitized versions of the alphabet.<br>
      (Of course I don't actually think those involved thought of it that way. But it really does boil down to that. And it really <strong>was</strong> that grandiose an ambition. It makes you wonder how anybody could ever think that such a thing would or could fly over the long term. But I would have reached for that brass ring, too.)<br>
      And if any company should be looking and listening and analyzing, it's Extensis. Of course that does not preclude continuing to promote the old notions - but certainly a company with as vested an interest in fonts as licensed products as Extensis should be extra careful to keep an open mind and an ear to the ground. It might seem to make sense to crow - as a marketing ploy - about these nuisance suits like Font Bureau v NBC but they are actually a bad thing for you, not a good one. All it would take is one NBC or a Universal to say, "F-ck you, we're not settling" and that would be that. What's being played is a game of legal brinksmanship and it won't be the litigant or the lawyer in that one particular case who "loses" - it will be the entire type community at large.<br>
      (And making a point to mention these cases at every turn in the interest of justifying some of the company's products existence with FUD is a sign of tremendous weakness, not strength.)</p>
      <p>[What follows next is an example from business history. Dunwich, perhaps now you should go to your room.]</p>
      <p>Anybody remember a company named MCI? Here it is from Wikipedia:</p>
      <p><em>MCI Communications Corp. was an American telecommunications company that was instrumental in legal and regulatory changes that led to the breakup of the AT&amp;T monopoly of American telephony and ushered in the competitive long-distance telephone industry.</em></p>
      <p>MCI was unusual in that the source of it's entrepreneurial opportunity was revealed through legal analysis. Management at MCI had come to the conclusion that AT&amp;T, an American institution, politically untouchable, was clearly in violation of Anti-Trust laws and that a serious legal challenge would, at a minimum, end ATT&amp;T's monopoly on long-distance telephone service in America, thereby paving the way for MCI - which had positioned itself to cater to the long-distance market.<br>
      The "smart money" thought MCI was crazy. Going after AT&amp;T was like going after Mom and Apple Pie. Break up the Bell System? Yeah, tell me another one. But top management at MCI and their attorneys couldn't see it any other way. And they were proved absolutely correct. </p>
      <p>The point here is that the legal landscape can change drastically and quickly.<br>
      And the big question is: well, if it does, what will be its effects on my business? What steps might I need to take?</p>
      <p>I'm not going to argue here whether or not fonts are or are not protected under copyright. (I will elsewhere, though.)<br>
      However it's only fair to tell you this: harping on Judge Whyte's comments in Adobe v Southern as if it is in any way significant and/or definitive is a disservice.<br>
      It's not a published opinion and it has absolutely no force as precedent. An attorney could not even cite it in a brief. It is not binding on any court, even in the same district.<br>
      It's just a news item: "Judge Whyte Said Blah, Blah, Blah During Adobe v Southern Trial".<br>
      But, it was seized and publicized with fervor - and it still is - in an effort to prop up the notion that even though typefaces have no copyright protection at all, fonts are "software" and that somehow, by waving the magic wand of digitization, the typeface now enjoys protection.</p>
      <p>In other words, it's irrelevant. Unless you want to take advantage of people's lack of knowledge of copyright law.<br>
      Presenting it as legal precedent is bogus and frankly, once I found out about the deception, I was pissed off.</p>
      <p>That's all for today.</p>
      <p>Dunwich, you can come back into the living room now.</p>
