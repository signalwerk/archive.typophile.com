      <p>When I have the energy and the time, I try to be a pain in the ass on as many threads and forums as possible. I lost all track of this one, and I wanted to pick up on something Butterick wrote.</p>
      <p>(BTW - Love Dezcom's pic. And having grown up in Brooklyn during the era of "Goodfellas", I'm familiar with the Tony Soprano school of dispute resolution. And that's all I'll say about THAT except to say that you couldn't do business in the apparel industry of New York without having to deal with certain kinds of people.)</p>
      <p>@butterick</p>
      <p>RE: The reasoning in Judge Whyte's comments.</p>
      <p>When I first read it, I half bought the notion being promulgated by Adobe. In fact, I spent several hours a few months back with somebody quite into the open source movement, and it came up in casual conversation and HE bought that reasoning, too. (A lot of people active in open-source do so out of purely philosphical or political disposition. I've been suprised at how little the actual details of the law figure in their thinking.)</p>
      <p>But Whyte is completely erroneous. And my even half-buying into it stems from a fundamental misunderstanding of what constitutes protectable expression under copyright law.<br>
      A big part of the reason, I think, is that the copyright industries spend hundreds of millions of dollars a year to obfuscate the issue and frame it to their advantage - it's an ongoing and unceasing political campaign - and so it takes awhile to undo the confusion from that. It effects lawyers and judges, too, obviously. After all, that's where the payoff is.</p>
      <p>First, the notion that there is choice in the selection of points is dubious to begin with, but let's let that go and assume there is choice.<br>
      Just because there is choice, it does not follow that there is protectable expression. Can you copyright a color scheme? There's choice, right?<br>
      Is the choice of route between two destinations - like those chosen by Google Maps and Mapquest - copyrightable? After all, there's choice. (I bet the lawyers DID give that one some thought.)</p>
      <p>A failure to connect choice and protectable expression is missing in Whyte's writing. But like I said, he was deciding a case, wrote this and that, and the opinion wasn't published. Like a lot of judges, I think his concept of the technical issues was dim, to say the least.</p>
      <p>One of the reasons I write comments in forums - unpaid work - is for the same reason experienced stand-up comics play small comedy clubs for free - to try out new ideas.</p>
      <p>And I came away from this thread with the spark of an idea for writing about the law as a technology of sorts. We talk about the "legal <strong>system</strong>". And where there is a system, there is, at a minimum, a set of interrelated parts working together as a part of an overarching scheme - a technology of sorts. In fact, I've heard lawyers refer to what ordinary people would call "forms" - stuff to be filed with the court to get a certain result - as "instruments". And this helps to strengthen my instinct that it's a line of thought worth pursuing. I'm just wondering now if anybody has ever taken the same tack.</p>
      <p>'nuff said.</p>
