      <p>And the new market of computer typesetting means that the number of digital typefoundries run by professional type designers is much larger as well. It is not like the "old days", where there was ATF, Monotype, Linotype, and Ludlow - and one took one's pick from what they offered.</p>
      <p>From those days, when new players entered the field - IBM with its Selectric Composer, Compugraphic with its phototypesetting machines, and so on - there was no choice but to copy and imitate the established popular styles. If there <em>had</em> been good protection for type designs, then there would have been no competition in typesetting machines.</p>
      <p>Now, it is different. The owners of the typefaces sell fonts in a standard format - TrueType, Adobe Type 1, OpenType - that fits everything. Strong protection for type designs will only protect the type designs - they won't give, for example, a monopoly of the computer industry to Monotype, because only Monotype desktop computers will allow you to print using Times Roman, since Times Roman is only available in the XYZ digital font format that can only be used by the Monotype operating system.</p>
      <p>And, in fact, even where type designs are strongly protected, the protection has a limited term - so Times Roman, for example, can be freely imitated - and there is more than one open-source imitation of it available.</p>
      <p>I have said this before, but what I see as the problem is that professional type designers really have one serious market, and that a narrow one - magazine art directors who want a distinctive unique look for their publications. Almost everyone else who uses type has an embarrasment of choice - all the "old standby" typefaces are easily available, and only a tiny fraction of type users have any motive to use, say, Stone Sans instead of Helvetica.</p>
      <p>So today's type designers are not getting rich. Far too much competition, far too small a market. Type design is largely only a labor of creative love - and even if great things are being achieved, they languish in obscurity.</p>
      <p>I think this is worrisome even beyond the urgency of the economic issue to type designers. Our age seems likely to leave no typographic legacy behind, no titans to rank beside Benton, Dwiggins, Goudy or Zapf.</p>
      <p>Oh, wait. Our age may be remembered for Comic Sans and Papyrus.</p>
