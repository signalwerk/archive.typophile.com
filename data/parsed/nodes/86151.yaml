      <p>"It's not a published opinion and it has absolutely no force as precedent. An attorney could not even cite it in a brief. It is not binding on any court, even in the same district."</p>
      <p>You say something like that, which as Matthew points out is wrong on at least three counts, and wonder why we don't take you seriously on font legal stuff?</p>
      <p>My "views are a pass-along of stuff he's been told by lawyers working for Adobe and a lawyer for litigants like Font Bureau."</p>
      <p>Not entirely. They are a combination of reading a lot (including case law), AND talking to lawyers a lot. And not only lawyers working for foundries.</p>
      <p>"Thomas loves type and the type community and should he feel those things being threatened and should his considerable powers of reason and analysis fail him as a result, I would understand anyway. "</p>
      <p>Don't insinuate if you're not willing to accuse. And in this case, even the insinuation is unfair. Although I do have plenty of strong feelings about matters typographic, they don't particularly color my judgment on questions of business, history and legality. I have a pretty long track record of dispassionate analysis: I'm hardly a fan of George W. Bush, but came out against the authenticity of the Killian memos, for example.</p>
      <p>Just to be clear: I think that US law is "reasonably settled" on the question of whether common digital outline fonts are covered by copyright as software, and that they are. By "reasonably settled" I mean that there is some case law and precedent, and that all the major parties involved seem to agree on the nature of legal reality on the general issue. Also that, as Matthew Butterick said, it's not at all apparent that anybody will (ever? say within my lifetime, anyway) have sufficient motivation to seriously re-open the issue in court, in hopes of getting a contrary outcome, which I expect would take years and cost millions of dollars. No single party has enough to gain, as far as I can tell. It's my belief that even if somebody did pursue it, they'd have a less than 50/50 chance of changing the current status quo. Not at all impossible, just worse than even odds.</p>
      <p>As a separable and distinct question, I also believe that considering fonts to be software for purposes of copyright is reasonable. I think this is a much more hotly contested question however, and plenty of smart and well-informed people are on each side of that particular fence.</p>
      <p>But that's a separate question from "what's the status quo." So, until or unless somebody contests it in court, there is a common understanding, and nobody big enough to be well worth suing has been violating that understanding without getting chased by the copyright holders.</p>
      <p>I wish that the abstract design of a typeface were protected under copyright law in the USA, but that's just not the case, and I wouldn't pretend otherwise. As best as I understand it, taking a current retail-licensed font, printing it out at large size, scanning it back to a bitmap, and tracing outlines from that does not infringe the copyright on the font software. It may be a contract violation if the person doing it licensed the font, and the license forbids it. It is normally unethical. But not AFAIK illegal unless the typeface is protected by design patent, which is rare.</p>
      <p>This is just one of several cases where my belief about the state of font copyright law is quite the opposite of what I would like....</p>
