      <p><em>In that case, the court held that vector depictions of Toyota cars - exactly like fonts are depictions of typefaces - are "slavish imitations" of the cars by digital means and therefore not copyrightable.</em></p>
      <p>The problem with this analysis is that in the case of a car, the car is the product and the vectors are the design, while in the case of a font, the vectors are the product and the design, these days, typically has no independent existence. A font is not a depiction of a typeface; a font is a computer program (according to the generous definition of the USCO) that in combination with other computer programs displays encoded characters on screen, in print, or other media. The point of Judge Whyte's analysis -- which was also mine at the time, in debates with the owner of SSi -- is that the choice of point placement in the vectors affects the display in different ways and the way in which the outlines interact with other aspects of the font software (notably hints, also interpolation algorithms etc.), and therefore their placement is not determined by a pre-existing design. In other words, you're begging the question, because the judgement you are challenging explicitly contradicts your challenge in affirming that font outlines are <em>not</em> imitations, slavish or otherwise, of a typeface.</p>
      <p>I call myself a type designer because that is the common term for what I do, and because I like the associations with a long history of past practice and people whom I admire. But what I actually do every day is create fonts, a large part of which is a design process, but what I am designing isn't a typeface that is then depicted by a font: what I am designing, with more or less precision, is the various ways in which encoded text set in the font will appear.</p>
