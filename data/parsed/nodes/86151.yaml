      <p><em>No, trademark came about to avoid confusion in the minds of the buying public. It's a public good, not some kind of corporate welfare.</em></p>
      <p>The mass market for packaged goods emerged as a system that benefitted both producers and consumers, and in between enabled the advertising industry and boosted mass media exponentially. Trademarking was an integral part of the system, so that a company might advertise in publications distributed nationwide, and have merchants and consumers in every town identify its products. </p>
      <p>In 1882 Harley Procter put a wrapper around a bulk product, branded it Ivory Soap, and placed ads for it in Ladies Home Journal, kickstarting consumer culture.  Ad revenue dropped the price of magazines, circulation soared, and product shifted. Feedback loop.</p>
      <p><em>I'm not surprised you present it as something for business, and not the public, though. Like I said, it's amazing what hundreds of millions of dollars a year in spin can do over time. So I forgive you.</em></p>
