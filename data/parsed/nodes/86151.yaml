      <p>1. The Toyota court analogized to a better-developed realm of case law than that which existed for the precise subject matter it was dealing with. Analogy is a perfectly respectable mode of legal reasoning. </p>
      <p>2. Toyota is precedent in the circuit in which it was decided (10th circuit). It is binding on other 10th Cir. courts. Otherwise it works as persuasive authority on courts in other circuits. </p>
      <p>3. Settled expectations is a legal concept that refers to situations in which parties have operated for some time under the belief that, for example, they have property rights in something or that a contract they are party to is valid. The entire digital font industry believes it has a property interest in its digital fonts and has become party to innumerable licensing agreements as a result. This is just one thing a court or legislature might consider if it were going to completely abrogate copyright in digital fonts.</p>
      <p>4. Fonts are created using a) selection of bezier points that best fit the contours of a glyph sought to be described (and the contours of other glyphs that the glyph must be harmonized with) b) the setting of sidebearings c) the programming of any substitution, class kerning, etc. d) any other incidental choices (e.g., how the hinting will be handled, how the font will appear in font menus). Am I missing anything important? </p>
      <p>Beyond that I think I'm done arguing this.</p>
