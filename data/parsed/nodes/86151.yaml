      <p>Thank you for the links.</p>
      <p>&gt;but the reasoning isn't unfounded.</p>
      <p>I'm not familiar enough with what the term "unfounded" means in this context to argue one way or the other. If you want to substitute the words "makes sense", I'm ready to go.</p>
      <p>&gt;(And it has been cited a handful of times over the years according to Westlaw.)</p>
      <p>What sort of citations? Where and by who and the purpose the citation served makes a big difference. Could you post them here? I don't have a Westlaw account.</p>
      <p>&gt;The language of 57 Fed.Reg. 35 is doesn't seem all that equivocal</p>
      <p>I'd like to go back and read "The language of 57 Fed.Reg. 35" and I'll get back to you.<br>
      It seems like 57 Fed.Reg. 35 and Adobe v SSI are getting mixed together there, and I'd like to separate the two.<br>
      Also, policy decisions regarding registrability are exactly that: decisions regarding registrability. It is no guarantee of anything. A valid registration is neither a mandatory NOR a persuasive authority.<br>
      Especially since nearly all works consist of protectable and unprotectable elements. How could it mean anything?</p>
      <p>The idea that registration counts for something, leads the general public to believe that simply because they can obtain a registration of copyright, the work necessarily has protection. And nothing could be further from the truth.<br>
      It's no more protectable than if they had done nothing and saved the fee. The geniuses (or whores, I think it's fair to say) in Congress have imparted protection as soon as the expression is fixed in a tangible form, with no further ado.</p>
      <p>This is big point of confusion for a lot of people, and needs to be cleared up. So thanks for bringing it up.</p>
      <p>(There's a book on copyright named: <em>Freedom Of Expression</em> by Kembrew McLeod. As an exercise in the absurd, McLeod trademarked the expression "Freedom Of Expression" which appears like this: Freedom Of Expression™ throughout the book.<br>
      I don't know about other readers, but it got a laugh out of me every time. [It's a book worth reading if you're into this stuff and you can get it real cheap. Not an A list title.] I just got to thinking about it in relation to the USPTO and registrability. I have the feeling I could get registration for a novel titled The Great White Whale that, outside of the title, reads exactly the same as Melville's book on the same theme. That wouldn't mean much in court would it?)</p>
      <p>But I'll check it all out.</p>
      <p>Uh, just discovered your link to Citations Rules takes me to a page on the Typophile Wiki section.  ??</p>
