      <p><em>As others have said, copyright law is just not a big factor in how the font industry operates. In the US, it wouldn't surprise me at all if Adobe v. SSI ends up being the last word on the issue.</em></p>
      <p>Indeed. The case was important because at the time there were companies seeking to make a business from essentially repackaging and reselling fonts, which is why it was tackled as a classic copyright violation, the same as republishing a book without permission. Since Judge Whyte's summary judgement in that case, that business model has mostly evaporated or, at least, no longer attempts to claim legitimacy and operate in plain sight. But I think the judgement, and the pause it gave to such unlicensed repackagers and resellers, was only partially responsible for the decline of that business model. Equally or more important has been the development of unlicensed font distribution via torrents and other online channels: why would someone pay $X for a CD of renamed fonts when they can download the originals for free?</p>
