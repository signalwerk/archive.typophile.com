      <p>Not sure about the apropriateness of giving the source of this. Let it go at, an attorney familiar with fonts, that's all:</p>
      <p>"An unpublished district court opinion is not precedent in that no court is obligated to follow its decision, including other judges in the same district court. You may or may not even be able to cite to it in a brief to the same district court (though sometimes you might because judges in a district court probably know each other well and might be influenced by how their fellow judges ruled). </p>
      <p>The citation for Adobe v. Southern Software is this: Adobe Sys. Inc. v. S. Software, Inc., No. C 95-20710 RMW (PVT), 1998 WL 104303 (N.D. Cal. Feb. 2, 1998). This case was not published in the Federal Supplement, or even the Federal Appendix. The first set of numbers after the case name is simply the district court number assigned to the case. The second set of numbers (following the comma) is a citation to Westlaw's database (indicated by "WL").  The parentheses indicates that the decision was issued in the Northern District of California in 1998. (If this case had been published officially in the Federal Supplement, the cite would look something like: Adobe Sys. Inc. v. S. Software, Inc., 50 F. Supp. 3d 100 (N.D. Cal. 1998).) So the case is officially unpublished, though its inclusion in Westlaw's database is usually afforded at least a little influence. But nobody is obliged to follow the decision as precedent. The case is really only important to another court, even in the same district, to the extent that its reasoning is persuasive. And that, really, is the debate: is it persuasive? It does not stand for the blanket proposition that computer fonts are copyrightable throughout the land, as everyone seems to have taken for granted. Computer fonts are not even necessarily copyrightable in the Northern District of California. </p>
      <p>Just because a decision is not officially published doesn't mean you can't find it on the internet. There are lots of them out there, and they are useful and informative to many people, but they are not precedent."</p>
