      <p>Note the difference between mandatory and persuasive authority. This gives a fairly good summary: </p>
      <p><a class="freelinking external" href="https://web.archive.org/web/20150124161626/http://faculty.law.lsu.edu/toddbruno/mandatory_v__persuasive.htm" rel="nofollow">http://faculty.law.lsu.edu/toddbruno/mandatory_v__persuasive.htm</a></p>
      <p>Also see:<br>
      <a href="https://web.archive.org/web/20150124161626/https://docs.google.com/viewer?a=v&amp;q=cache:CfDlzv4IgeMJ:www.uscourts.gov/uscourts/RulesAndPolicies/rules/Unpub_Opinions.pdf+&amp;hl=en&amp;gl=us&amp;pid=bl&amp;srcid=ADGEESgYUxO8Z1z18PaqhrEgqHq30FlPy_6fXzgsaRWZIV_eMDkTPvlSRGY-_xzy3vFxgfvAIf1WlwQuVWIP_Qw4TcCJaj0SA4XJADoT7Fqd6k_xH4jMqIF3vXlmcm9KuPSbQWkHt2G_&amp;sig=AHIEtbQNDhndobgiPEa9R_2CBTk0yTwtlQ" rel="nofollow">Circuit Citation Rules (Unpublished Opinions)</a></p>
      <p><cite>And that, really, is the debate: is it persuasive? It does not stand for the blanket proposition that computer fonts are copyrightable throughout the land, as everyone seems to have taken for granted.</cite></p>
      <p>It isn't mandatory authority, but the reasoning isn't unfounded. (And it has been cited a handful of times over the years according to Westlaw.) It also offers the argument that 57 Fed.Reg. 35 (February 12, 1992) (“Registrability of Computer Programs that Generate Typefaces”) supercedes the previous stance of the Copyright Office that fonts didn't count as protectable software. The language of 57 Fed.Reg. 35 is doesn't seem all that equivocal—</p>
      <p>The portion reproduced in Adobe v. SSI:</p>
      <p><cite>After a careful review of the testimony and the written comments, the Copyright Office is persuaded that creating scalable typefonts using already digitized typeface represents a significant change in the industry since our previous Policy Decision. We are also persuaded that computer programs designed for generating typeface in conjunction with low resolution and other printing devices may involve original computer instructions entitled to protection under the Copyright Act. For example, the creation of scalable font output programs to produce harmonious fonts consisting of hundreds of characters typically involves many decisions in drafting the instructions that drive the printer. The expression of these decisions is neither limited by the unprotectible shape of the letters nor functionally mandated. This expression, assuming it meets the usual standard of authorship, is thus registrable as a computer program.</cite></p>
