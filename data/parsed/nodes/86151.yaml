      <p>Although digital font products (as they are referred to in license agreements) are frequently compared with other digital commodities such as recorded music, photographs, films and videos, there is an important distinction.</p>
      <p>Those are end products, entertainment consumed by the general public.</p>
      <p>It may seem that fonts are similar, to the extent that they are most readily conceived of as collections of images with cultural properties, but the big difference is that as an economic product they are primarily professional tools which function economically in the business-to-business market, software purchased by professional designers to help them make, and add value to, their own products and services.</p>
      <p>Business people are less inclined to piracy than consumers, as cheating is not a best practice.</p>
      <p>I can't speak for other foundries or the font industry in general, as figures are hard to come by, but Shinntype, founded in 1998, is doing better than ever. I have in the past taken issue with software bundling as an unfair business practice, and suspect that it has suppressed the potential mass market for fonts, but that is an issue of size rather than kind, and, as Ray says, it's debatable whether "free" stimulates or restricts the market. "Free", as argued by <em>Wire</em>'s Chris Anderson, is a unique quality of the digital economy, in which the rules and behavior are somewhat different than for physical goods. </p>
      <p>It's impossible for law and regulation to keep up with the technology marketplace—things have, to a large extent, sorted themselves out, as ethics emerge via informal social contracts as much as by formal EULAs. The legal status of typefaces, protected more as software than as design shapes, is hard to grasp, not quite logical, and open to negotiation—but that in itself opens up economic space for license format proliferation. Recently, the font industry has managed to sort out the webfont issue, a thorny roadblock for ten years.</p>
