      <p>A lot of disciplines borrow techno-scientific terms to impress themselves, and others, with how logical and rational they are.</p>
      <p>I'm not sure who you mean by "copyright industries", but it is not just those who produce creative content—copyright is also fundamental to the emergence of packaged goods.</p>
      <p>Ultimately every business needs to be able to protect its brand—consider the origin of that term, and the penalty in the Old West for pirating a brand or branded property.</p>
      <p>I'm sure you can exploit the metaphor of law-as-technology, because there is a similarity in all human-formulated systems.<br>
      For instance, mechanical servo systems and biological ecosystems operate on feedback, and are hence cybernetic.</p>
      <p>As John von Neumann, father of game theory, put it, "The territory is not the map."</p>
