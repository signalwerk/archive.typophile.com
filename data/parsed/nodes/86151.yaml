      <p>Here are two cases that apparently didn't get all the way to trial but which nonetheless cited Adobe v. SSI. </p>
      <p>ITC v. Adobe, 2004 WL 2814678 (N.D.Ill.)<br>
      Monotype v. Red Hat, Inc., 2002 WL 32678232 (N.D.Ill.)</p>
      <p>Westlaw lists another 39 cites to cases, treatises, and secondary sources. </p>
      <p>The fact of the matter is that there just isn't a lot of case law on this subject. Though Adobe v. SSI exerts no power as mandatory precedent, it is more directly on point to the subject of the copyrightability of digital fonts than is, say, the Toyota case.</p>
      <p>Don't get me wrong—the Toyota case certainly lines up the arguments whereby the selection of control points might not be considered sufficient to engender a crucial modicum of originality (though the opinion's "creative labor" language seems to go further than the precedent it cites). However, a few distinguishing points—</p>
      <p>1. When I said "unfounded" I was referring to the Adobe court's reasoning's basis in the Fed. Reg. that speaks directly to the copyrightability of digital fonts as software. The Toyota court analogizes heavily to cases dealing with per se copyrightability of photography because, as it acknowledges, vectorization is sort of new ground and there isn't a lot of precedent (or a convenient statement coming from the Copyright Office) on the issue.</p>
      <p>2. There's also the issue of the "slavish copying." The characterization of the creation of a bezier outline of a character in a digital font as a transcriptive, pseudo-mechanical task makes sense to a degree when one is talking about digitizing a sketch, say. But when the creation of the unprotectable expression is concurrent with and inextricable from the digitization of it, it's hard to avoid regressing into the argument that typeface design is a highly creative process that ought to receive protection.</p>
      <p>The danger in going against Adobe v. SSI is that it would upset a great deal of settled expectations as far as contracts/licensing digital fonts goes. That was the tradeoff in Toyota—sure, there's something to be gained when a court tries to keep the originality requirement from getting too soft, but here this company was thinking it had contracted to produce something that would require further licensing if Toyota's contractor wished to use the vectors further, only to get burned when it realized it had negotiated something it couldn't claim rights to.</p>
