      <p>I wouldn't say that bezier points are selected to FIT a contour.<br>
      The contour doesn't exist until the BCPs define it.<br>
      Bezier points are used to CREATE and define/fix a contour, just as graphite is used to realize a line when drawing with a pencil.<br>
      The hand-tool that does the digital drawing may be a mouse, stylus, track ball or track pad.<br>
      Make no mistake, this is hand-eye-brain feedback-loop DRAWING—I don't know any type designers who create glyphs by typing numbers.</p>
