    <p>I'm working on putting together a law review comment topic that will focus on the IP protections afforded to typeface design within various American IP regimes. </p>
    <p>If we take it as a given that type design enjoys comparatively little protection in the US (or that these protections are rarely invoked), I'd like your input on the following question:</p>
    <p>Is type design prospering anyway? Or is the field arguably a fraction as explosive as it would be were the supposed incentives to create better protected?</p>
