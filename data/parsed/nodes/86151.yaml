    html: <p>I don't think protecting the IP affects a font designer's income significantly. While I'm, sure I lose some sales to piracy I also gain a lot of sales from piracy. If IP protection had an effect on whether or not a font designer was able to commit to font design as a full-time job, that would have some impact on font design . . . but I think it's a stretch of the imagination. Overprotecting IP has a negative impact on a font designer's relationship with their customers. Is a font designer going to quit developing a font because people are copying their other fonts? You'd have to be a very sensitive font designer. Nah. If font designs themselves were protected it would halt innovation. I'd certainly get into another business.</p>
