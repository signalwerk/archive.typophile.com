      <p><cite>You can identify a pirate, serve them with a lawsuit . . . . Not necessarily easy or cheap.</cite></p>
      <p>I would also think there would also be especially tricky discovery/evidentiary issues to worry about. It would be easy enough to prove that a TV commercial used a Lady Gaga song without licensing it—or even that it used a cover of the song's underlying composition without licensing it—but to prove that the font you see rendered in motion graphics wasn't properly licensed must be a hassle of another magnitude. (In that situation, the missing copyright protection for typeface design would be analogous to the composition rights.)</p>
      <p>My thinking is that the design world—or however you want to lasso in the main consumer base of digital fonts—generally suffer from a) a lack of awareness about the legal dimensions of font use, b) a justifiable lack of fear about the consequences of playing fast and loose with a font EULA, and, to that point, c) a certain degree of comfort in industry norms. </p>
      <p>Trying to sue every TV network or movie studio or magazine that uses a font of dubious licensing pedigree would never result in a paradigm of font licensing as assiduously respected as those surrounding image or music licensing. More litigation would only chill legitimate type consumption.</p>
