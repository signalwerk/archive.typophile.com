      <p>@ehague</p>
      <p>&gt;The danger in going against Adobe v. SSI is that it would<br>
      &gt;upset a great deal of settled expectations as far as<br>
      &gt;contracts/licensing digital fonts goes.</p>
      <p>Wrong. And I have no idea what you mean by the phrase "settled expectations".<br>
      Look, it's simple: one judge wrote something that doesn't matter as precedent.<br>
      Those with an interest in insisting that fonts were copyrightable software jumped on it and blew it out of proportion out of self-interest. So what else is new?</p>
      <p>&gt;"The Toyota court analogizes heavily to cases dealing with per se copyrightability of photography because, as it acknowledges, vectorization is sort of new ground and there isn't a lot of precedent (or a convenient statement coming from the Copyright Office) on the issue."</p>
      <p>Also wrong. They don't analogize at all. They cite and explain the case law upon which their decision is based. Legal scholars expert in copyright have called it a very well-reasoned opinion. Read the decisions cited. The court in Meshworks isn't winging it.<br>
      And it's an appeals decision, too.<br>
      There's nothing equivocal about it.</p>
      <p>One question: do you know anything about how fonts are constructed? What they actually are? THAT I'd really like to hear in your own words.</p>
      <p>And if you think the USPTO decides what's protectable, or even has a great influence on court decisions, go ahead, believe that.</p>
      <p>Uh, frankly, I detect some partisanship here. A desire to find a result. Even if it's fog. Not an effort to find out how things really stand. Your thumbnail synopsis of the case is way off.</p>
      <p>Thanks for the links, once again. And good luck with your research. Hopefully you'll be able to make it available when done.</p>
      <p>Incidentally - I don't know if the page is still there, but when Meshworks was decided, William Patry wrote a bit about it on his blog. Interestingly, an IP lawyer in LA commented on the connection between the vector-based renderings done by Meshworks, and fonts.</p>
      <p>If your argument is that vector outlines are a kind of protectable expression separate and apart from the expression produced when those vector outlines are interpreted and rendered, go for it.</p>
