      <p><cite>Why are there so few suits between font rights holders and non-licensing entities?</cite></p>
      <p>I consider font piracy a long-dead horse unresponsive to further beatings. So I will only say that your observation is true of many media industries, not just fonts. </p>
      <p>Rationally speaking, if you're a rights holder, you would only go to court against a pirate if:</p>
      <p>1) You can identify a pirate, serve them with a lawsuit, and bring them into the jurisdiction of a convenient court. (Not necessarily easy or cheap.)</p>
      <p>2) The pirate can pay the damages OR the lawsuit will have a deterrent effect on others considering piracy.</p>
      <p>3) Most important: the gain from #2 outweighs the value of just finding new customers who are willing to pay for your product. (I.e., the expected return from spending your money on litigation &gt; spending the same money on marketing &amp; sales.)</p>
      <p>Therefore, one might predict that the rights holders most likely to sue pirates are the ones who believe they've already reached the boundaries of their market, so they have to change the habits of people inside the market. For instance, the RIAA's famous (and arguably pyrrhic) campaign of suing individuals who had copied music.</p>
      <p>But in most industries — especially small ones — it makes better sense to put your capital toward market growth, not ligitation. Indeed, as I sit here enjoying my Spotify account — a new arrival in the US, which essentially duplicates the experience of Napster in 2000 — I think maybe even the record companies have learned this lesson, however slowly.</p>
