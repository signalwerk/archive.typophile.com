    <p>I would be very interested in type persons views on these three faces, all of which I love, but are not much used. </p>
    <p>The latter two are both by Zapf. The Renaissance is a wonderfully clear face, with character, but not too much. Aldus has a lovely hand woven feel to it. And Weiss is such a deco beaut, but again, very clear and unfussy.</p>
    <p>Any thoughts as to why we seem them so rarely??</p>
    <p>John</p>
