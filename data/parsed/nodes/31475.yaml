      <p>Birminghamiensis, Manchesterius and of course Londinium...</p>
      <p>John, do you know the book <a href="http://www.delphipress.com/" rel="nofollow">'Fonts &amp; Logos' by Doyald Young?</a> Features quite a lot of beautiful Zapf work and comments about same, which I hadn't known about. I agree with the other respondents here that Aldus and Zapf Renaissance were simply outshone or out-marketed (depending on your degree of cynicism) by the rest of the man's prodigious output. And Aldus may be underrated, but that 'one weight only' thing does get in the way.</p>
      <p>Weiss may be unfussy, and may be quite like <a href="http://www.myfonts.com/fonts/atf/bernhard-modern/familytree.html" rel="nofollow">Bernhard Modern</a> in terms of its elegant proportion, but I recall using it as a business report text face and it appears very pale – a bit spidery really, on the page.</p>
