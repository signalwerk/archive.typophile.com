    html: |-
      <p>I agree, I love all three of those designs. Zapf-Renaissance was one of the most expensive single font packages I've ever bought. I believe I dropped $300 or so on it back in 1996 or thereabouts. I bought it from Fonthaus, who was distributing it for Scangraphic. I think Scangraphic's collection was later absorbed by E+F or Linotype.</p>
      <p>It could use an overhaul. There were some metrics and kerning problems with the version I bought.</p>
      <p>The complaint about the absence of a <a href="http://www.linotype.com/109964/aldusnovabookbold-font.html" rel="nofollow">bold verison of Aldus</a> and <a href="http://www.linotype.com/109961/aldusnovabookitalic-font.html" rel="nofollow">its corresponding italic</a> is now answered with the Aldus Nova release, but for now it's only available as part of the large Palatino Nova package bundle. Sadly it will be a while before I have the $999 to spend just to get to those two new weights. Palatino Nova is also missing Palatino Heavy, which I was always fond of. I also miss the look of the foundry versions and the alternate extenders, and the original Palatino Italic swashes. Seeing those is still a rare treat.</p>
