      <p>Unicode U+2116, NUMERO SIGN.</p>
      <p>Times New Roman has one, in what seems to be its slightly peculiar script-like default style. Unless you were looking for a real cowboy woodtype one?</p>
      <p>Since you now have the unicode, you could use <a href="http://earthlingsoft.net/UnicodeChecker/" rel="nofollow">UnicodeChecker</a>, for instance, to find all fonts containing this glyph.</p>
