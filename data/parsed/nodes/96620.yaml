      <p>Hebrew is much easier than Arabic in the non-Latin group. Matching Hebrew to Latin is much easier than Arabic. But Arabic is not impossible hrant can you post or point to some examples.</p>
      <p>There is a forum discussion already on how to best match a Latin design, like those that you mention, to Hebrew. See baruchgorkin.com for examples.</p>
      <p>I started doing this at Font World in the early nineties. It is much easier to create a Hebrew font design from scratch that matches a Latin font design that to create a Latin font design from scratch that matches a Hebrew font design.</p>
