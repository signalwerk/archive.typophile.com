    html: <p>In ye olden days BDTP (before desktop publishing), typesetters could insert spaces of various sizes (thin, normal, en, em) wherever they wished. You could insert a regular space on either side of the underscore, then adjust the horizontal scale of those spaces to match your requirements. Once you are satisfied with the results, you could copy and paste the space+underscore combos (beginning and ending) wherever you wanted.</p>
