    html: <p>elastik, I don't know if that works with your text flow, or if it's even more complicated than the suggestions made before, but you might as well try using table cells and take the bottom cell border as your (under-)line (with the stroke weight of your choice applied). One cell with a variable width sits in the middle (for your text) and two cells with fixed widths to its right and left. All the other cell borders (above and vertical) are then set to "none"/no stroke.</p>
