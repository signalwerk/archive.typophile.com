    html: |-
      <p>Uh, I'm pretty tired so I'm not sure I understand what your goal is, but you can probably do this with a series of search-and-replaces.</p>
      <p>Step 1:<br>
      find: [space]<br>
      replace with: [hair space][thin space][hair space]</p>
      <p>Step 2:<br>
      find: [thin space]<br>
      replace with [character style: notUnderlined]</p>
      <p>You then have the underline extending past the word the width of a hair space, a break, &amp; new underline that extends a bit before the word. If you want the break to be bigger, you can replace the thin space w/ a regular space, then muck with the word-spacing parameters.</p>
      <p>Obviously, you want to do this after all editing is done.  :0)</p>
      <p>Jay</p>
