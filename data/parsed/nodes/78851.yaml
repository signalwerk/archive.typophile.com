      <p>Charles_e - I agree totally, but I think that's what is making this project as interesting as it is. I've looked at type differently since working on it. I was always quick to label - humanist, old style, transitional, slab - use what is appropriate to the project. (and normally what falls under the company standards). This has been an opportunity to look at fonts that rather blur the edges of the categories I've been a little too tight with - at least in the object version. </p>
      <p>Is it possible to take the pieces we like best from different styles and create something new and perhaps, timeless? I like to hope so - I bet the gurus here could do it - but as stated above: a gilded cage, with appropriate beverages and a lengthy lease would be needed.</p>
      <p>: )</p>
      <p>Excellent book suggestion too.</p>
