    <p>I came across an interesting project and wanted to get the opinions of the gurus here at typophile.</p>
    <p>It's a novel length fantasy - 600+ pages - and it needs designed.</p>
    <p>Things to keep in mind:<br>
    There are to be two versions of the book - one to be read and one to be looked at (it's a self-aware object — also read as: deluxe edition)<br>
    The book (text) is about the book (object) and its writer.<br>
    Moreover, the book spans from about 400 B.C. to the 1960s.<br>
    Finally, the pen "writing" the book was stolen from the book of fate and is writing in its own distinctive hand.</p>
    <p>I've been struggling with font choices. I normally use a historically appropriate family and run with it. In order to do so on this project, I'd need a timeless or better yet, an immortal font.</p>
    <p>It's an interesting concept and I thought I'd throw it out into the forums. Would a full-out calligraphic solution be appropriate for the object? If so, what would the "readable" book be set in to coordinate? The book not only spans centuries, but also jumps from continent to continent, making references to many of the greatest civilizations in history. An entire chapter could be set in Chinese in the object and it would be correct... but should it be? In short, I have so many options that my head is spinning.</p>
    <p>What would you do?</p>
