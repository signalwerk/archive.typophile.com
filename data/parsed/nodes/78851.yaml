    html: |-
      <p>Well, Times Roman is generally considered not to be comparable to combining chocolate ice cream with sweet and sour ribs... although it's definitely not timeless, either.</p>
      <p>While the authentic Phemister old style is clearly Victorian, Century Oldstyle... no, it's too condensed, and so it looks like it belongs in the phototypesetter era.</p>
      <p>Goudy Friar was admitted to be a "Typographical Solecism" by Goudy... and then there's Goudy Thirty, which, amazingly enough from my point of view, has been digitized. For something with an "old" feeling, and yet not localizable to a particular epoch, they have some merit, although I don't think they are actually quite what you seek.</p>
