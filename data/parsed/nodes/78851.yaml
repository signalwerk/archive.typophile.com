      <p>Clearly, Times Roman is right out. So, unfortunately, is, say, Cloister Lightface. And Univers would clearly be the exact opposite of what you want.</p>
      <p>I would say that one might sort of squeak by with, say, Caledonia or Garamond. A typographer would peg them to a particular era, but they don't strongly suggest a particular era to the general reader. But I'm pretty sure you want something a bit less ordinary than this. (Weiss Roman and Palatino are a notch more decorative, still not heavily temporalized, but they're still fairly routine as well.)</p>
      <p>The suggestions so far given here are excellent ones, but if you want to use a typeface that is more conventional than a calligraphic one... then, although Cloister Lightface or Jenson is not feasible (great for a deluxe edition of something like <em>Lord of the Rings</em>, yes, but not this) I think the closely related typeface Centaur might do very nicely.</p>
