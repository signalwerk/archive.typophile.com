      <p>That's strange that Brioso was mentioned.<br>
      I've used it a few times with some success professionally - pairing it with Kanji (Japanese). Brioso was my first thought for the object version, but I didn't think anyone else would read it for 600 pages. I've been fond of that family since it first came out, but I always had a little guilt attached to using it. </p>
      <p>I think I'm going to try the first 20 or so pages in Brioso, Trinité and Beorcana respectively - I think those will fit the "object" version very well.  </p>
      <p>Now for the "readable" version... I think that frode frank is absolutely right in that Trinité can stand up to both versions, but I worry for Brioso and Beorcana. Centaur, Caslon, and Catull and Garamond are the forerunners for the readable - I'd be interested to hear what pairings everyone here would suggest.</p>
      <p>This thread has been incredibly helpful - thanks again!</p>
