      <p>All out calligraphic? I can't think of any calligraphic script that wouldn't be a very obvious "font" over 600 pages. The ones I've seen with lots of alternates and ligatures are either very unformal or way too formal for text. So, in short: the kitch pitfall is definitely present. </p>
      <p>A few "object" faces that come to mind: Trinité, Brioso and Maiola. I also second Beorcana. Of these, Trinité is perhaps best suited to handle both the "book" and the "object", with it's variants - no. 4 italic for the most extreme. With Brioso, there's the obvious pair Kazuraki for Hiragana, Katakana and quite a bit of Kanji (I'm no expert on Chinese, but I seem to remember that they share at least the Kanji signs with the Japanese).</p>
