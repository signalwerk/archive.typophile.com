    <p>So ladies and gents, I'm working at a company that is pretty much just forming an in-house design department. I have a few questions that I'm hoping to find answers to. </p>
    <p>1) How much is a reasonable target price to get a design firm up and running? We have virtually NO purchased typefaces, most are system fonts.</p>
    <p>2) What are some of the best valued combined packages that contain multiple typefaces? I need the classics too (I can't live without Univers.)</p>
    <p>3) I also need some more modern typefaces to keep things fresh, any suggestions on more modern packages? (I also can't live without the Thesis Family.) </p>
    <p>4) How do I convince my company that after taking the huge hit financially in purchasing a "classics" package that modern typefaces also need to be part of the budget?</p>
    <p>I'm hoping a few of you might be able to point in the right direction. I know the subject of price is a touchy subject so if you'd rather not discuss it in a public forum please e-mail through the link on Typophile or at the e-mail address listed on my site. Thanks all!</p>
