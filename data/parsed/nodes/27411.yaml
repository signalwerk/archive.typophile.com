      <p>Good luck with the new job.<br>
      Bitstream's Type Oddity, sorry, Odyssey, will provide all the classics, including your fave, Zurich. For a Typophile, there's hours of fun there just relating the wacky names to the proper ones. Also included are new fonts from a variety of independent foundries (self-interest declared).<br>
      It's affordable, but not the latest versions, and not OpenType.<br>
      However, it delivers the canon, and in a way that doesn't make it indispensible. So when a job cries out for a spiffy new OT typeface, you should be able to justify the expense, because there's nothing like that in the collection, and continue to add to your library in that way.</p>
