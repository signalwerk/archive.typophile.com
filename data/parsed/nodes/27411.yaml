      <p><code>Much like … you can download music to ‘try’ and then you go out to buy the album cause you like it … of COURSE you do!</code></p>
      <p>Paul, I agree with you that enforcing licensing policies is a nightmare, but there really isn't much a foundry can do if someone decides to download one of their multi-thousand dollar packages without paying anything. I mean, it's as simple as running a Google search with the words <code>font folio 10 torrent</code> and then using a torrent client to download the stuff.</p>
      <p>In the end, all this discussion about licensing -- whether or not a EULA allows for the fonts to be installed on one, two, five, or more machines; whether a PS1 font can be converted into an OT font; etc -- is really a matter of trusting that some people will respect the licence. What are you going to do if someone doesn't? Ever heard of a foundry getting a warrant to check whether one of their fonts is being used on eight computers instead of the allowable five? Or to make sure that the client is not using an OpenType font they created from the PS1 font originally purchased?</p>
      <p>My point is, in the real world foundries <em>have</em> to trust their paying customers, because it's just so easy to obtain their fonts for free from illegal sources anyway. And if it's all a matter of trust, why not go the "try &amp; buy" way?</p>
      <p>(I'm afraid we're straying further and further from the original topic, but it's my fault.)</p>
