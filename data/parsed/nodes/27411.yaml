      <p>&gt;I’m working at a company that is pretty much just forming an in-house design department. </p>
      <p>I'm surprised no one asked for an explanation to this. What type of company would decide they want to set up an "in-house" design department, that would need to be stocked with a wide range of typefaces? </p>
      <p>Most companies I've had experience with set up an in-house design department so that they can remove or reduce their dependency on the outside design firms they use. Either they want to do everything in house or they want to do the grunt work in-house to cut out the middle-man's markup. Either way they’d normally start with the fonts their existing design resources are using and then acquire additional fonts as the need arises. But maybe I’m missing something?</p>
