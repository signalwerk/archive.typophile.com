      <p>Stated policy and practice often diverge.</p>
      <p>I've had type designers give me a tryout before, and I think a brilliant idea is linking that tryout to some printed swag showing the font in use. For a few dollars (less than the font) you can get a good taste—the font designer gets to sell a printed sample rather than giving it away, and the customer gets a disc with a tryout version of the font plus printed sample.</p>
