      <p>Thank you, William. The decision to place the Hebrew on the left was made largely out of Conservative tradition. At one point, I tried it the other way, but given that the annotations surrounding the Hebrew text were often extensive, the right-hand position was clearly better. What one might do in the abstract is often quite different from managing a real-life situation--especially so with glossed texts that are laid out Talmudically. Though Hebrew has pride of place, with a heavier weight than any of the Latins, it is a book dominated by the Latin alphabet. It is, after all, an American book made for liberal-leaning congregations. </p>
      <p>A far more controversial decision was the placement of the transliterated passages on the left, with the English, rather than near the Hebrew passages in question. The prevailing thought there (I was in the outvoted minority) was to allow those who wished to avail themselves of a purely Hebrew prayer experience the freedom to do so without interruption. Whether or not you think that makes sense, placing the transliterations on the right, with the Hebrew, would have cut down on the space for the annotations, which are a hallmark of Conservative intellectual life. There is a great deal going on in this book, and to keep it clear and easy to follow at all times requires decisions that one might well reconsider for more simple publications.</p>
      <p>I did NOT work on Mishkan T'filah, but I am working with the CCAR, the Reform rabbinical organization, on a prayerbook for mourners at home and, soon, their new Mahzor. Israel Seldowitz and I are well into a new typeface for it, this one based on Ismar David's work.</p>
      <p>Funny you mention the lamed. II find it quite a bit less distracting than Friedlaender's design, with its little top flag, but it's good to know your opinion. Perhaps we'll change it in some future version.</p>
