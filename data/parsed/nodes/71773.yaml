      <p>I'm coming in a little late to this discussion, but I have to agree with typograph. The font Shlomo in it's current form is all over the place. There seems to be no rhythm to the font and seems to be very messy. I think a Hebrew reader will be disturbed by it. On the other hand, Libi is much better.</p>
      <p>I'm not a font designer, rather a typesetter, so I can't tell you why Shlomo doesn't work, just that I wouldn't choose it and I find it unreadable. Sorry if that's not terribly helpeful – but listen to typograph – he seems to understand <em>why</em> it's not readable.</p>
      <p>But from what I've seen, the problem here isn't whether a single letter needs to be wider or thinner or whether the kerning needs to be tweaked, but rather in my eyes, there seems to be a fundamental problem with the font. It doesn't seem to be organic. I have to say, that I find it quite hard to read. Sorry :-(</p>
