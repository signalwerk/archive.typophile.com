      <p>To Tevi: The commentary on page 210 begins with a continuation of the commentary on 209, which had to be set in a slightly narrower column to accommodate the Hebrew, so I decided to keep it narrow on 210, returning to full width on on 211. It was going to create a dissonance one way or the other, so I chose to keep it consistent with something. These are lose-lose situations in which one can only try to rationalize the lesser of two evils.</p>
      <p>To David Hamuel: Yes, like those--precisely!!<br>
      About the kamatz in the Leningrad: What I meant to say was that, in some of its earlier publications, the Rabbinical Assembly used a patach with a dot underneath to denote the kamatz katan and the standard "T" form for the normal kamatz. The patach-underdot was the form of the NORMAL kamatz in the Leningrad and Aleppo. This is not a bubbe-meyse; my evidence for the Leningrad is the full facsimile published by Eerdmans/Brill, a copy of which I own. The Aleppo can be seen online: <a href="http://www.aleppocodex.org/" title="http://www.aleppocodex.org/">http://www.aleppocodex.org/</a> --look and see for yourself. There are places in both codices where the two elements run together, and others that appear to be more of a vertical line than a dot (runny ink), but it's perfectly clear to see that this two-part form of the kamatz was the manner of the time, at least with this scribe. I can't claim any special khokhma on the subject beyond my observations, which, at the end of the day, is all that matters to me.</p>
      <p>Update on the new David font: I started all over again to make something new. It retains a four or five things from David that will be recognizable, but overall it's moved to an all new place. The first David I made with Israel will be used in the home mourner's siddur, but probably never again. The weights of the new font (I'm making three) bear no relation at all to Ismar's eponymous font. I think I may call it Sh'lomo--Son of David. It's farther from David than the Milon font is from Hadassah. I may post it when it's ready, though I am not a blogger by habit.</p>
      <p>Cheers,<br>
      Scott</p>
