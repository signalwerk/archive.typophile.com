      <p>William, thanks for your comments. I found many of them quite helpful. Here are the latest versions, which now include a semi-light and a bold. You'll note that several characters have been redesigned, others changed in various small ways. I design type for text, so I'm loath to show large letters as I did here. As such, I'm far more concerned with sidebearings and fit than I am with the smallest details of character design. In Hebrew, especially when nikkud and taamim will be deployed, letter fit is a matter of life and death. You don't have the same options of using kerning tables to fix things; it all has to happen in the sidebearings. That can be quite challenging, especially when narrow letters have to accommodate an elaborate apparatus of diacriticals.</p>
      <p>The JPEG renderings of the text sizes looks horrible here and give a poor impression of the stroke details and weights. I think I won't post pictures of type again. If anyone is interested in seeing the fonts, email me and I'll send a PDF that can be printed.</p>
      <p>In the meanwhile, I wish everyone Shanah Tovah. May you all be inscribed in the best books.</p>
