      <p>Thank you, all. I believe I may have misstated my case. I do deploy kerning pairs in this font and in other Hebrew fonts I've made. What I meant to say, or at least emphasize, was that in Hebrew with diacriticals, kerning pairs have limited usefulness, as the context of intervening nikkud and taamim have to be taken into account, especially so with narrow glyphs, such as yod and vav. That being the case, I strive to be utterly judicious and disciplined setting the sidebearings to work in most every circumstance. This is what I learned to do many years ago casting metal type. Without that decade of experience working in metal, I don't know that I would really understand the discipline of typefitting. I should add, too, that were this font intended only for Modern Hebrew, I would have fit it somewhat differently, likely a bit tighter.</p>
      <p>While I'm here, may I ask your opinion of the tsadi and tsadi sofit? Are they beyond the pale? Do you think the aleph should have the same sort of upper member?</p>
      <p>Again, Shanah Tovah (to my Christian and Muslim colleagues, too--everyone likes a New Year),</p>
      <p>Scott</p>
