      <p>Just got back from vacation, and am catching up. I've never designed a Hebrew font, so the following may just my inexperience speaking. But since you asked...</p>
      <p>I like a lot the way the terminals are handled. To my eyes they are nicer than those of David, which is a fine font, but somehow looks a bit clunky and dated to me. I particularly like the lamed in Shlomo. </p>
      <p>However, to me there are a number of problems with the characters. One problem is that I think the rhythm is disturbed by the extra width of the chet and tav compared to the hey. I have just opened some of the most popular Hebrew fonts and compared them to your current version of Shlomo: Narkis Tam, Narkism, Frank-Reuhl, Hadasa, and David. Many have the chet *slightly* wider than the hey, which makes sense in equalizing the white space within the two characters, as the hey has the white gap on the left that the chet doesn't. But visually yours seems to go too far to me in being too wide. Also the tav isn't normally quite as wide as chet internally, as it has that squiggly leg on the left, which visually opens it up inside a bit.</p>
      <p>I would say that the mem sofit is a bit too wide also compared to the mem, though there it's easier to get away with, as it comes at the end of words and you don't get so much of a problematic "accordion" effect, which to me happens with the chet and tav. Some greater width of the mem sofit is justified by the white gap in the regular mem, but again not quite that much. David has a pretty wide mem sofit also, but I think it goes a bit too far also. In some of the others the mem sofit is even narrower than the mem.  </p>
      <p>To me there is something disturbing and not good looking about the top of the regular mem. In all of those other fonts, the left side of the arch in the mem thins going into the stem. Yours doesn't and that's part of the problem. The curve also to me looks too symmetrical and weak, but to tell you the truth I'm not that crazy about David's mem either, which I can see influenced you here--though David does have thinning where the stem joins. </p>
      <p>The samech also looks to me uncomfortably symmetrical. In all of those other fonts, including David, the left stroke is less curved than the right, and to me looks more "right". </p>
      <p>Finally, to me the shin should have less white space to the left of the middle stroke, and more to the right. This is true in all of the fonts I mentioned. Especially relevant is Narkis Tam, as you have adopted the characteristic Narkis shape with the smoothly rounded bottom of the shin. He joins the middle branch a lot higher on the left, which makes the counter on the left smaller than on the right.</p>
      <p>(We have, alas, just lost Tzvi Narkis, designer of Narkis Tam and Narkisim and other great fonts.)  </p>
      <p>A lot of this critique on issues of shape relate to the sense of motion to the left in Hebrew. The nature of the conventional asymmetries in these characters contribute to that motion to the left. (I would also increase the asymmetry of the aleph for that reason, but that is just personal preferance; I wouldn't say that the current shape is a problem.) The other thing is about visually even color and rhythm, which I am admittedly a fanatic about, as I think that this contributes to readability.</p>
