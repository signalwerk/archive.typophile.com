    html: <p>I was referring to how the glyphs are laid out together, when setting a RTL segment of text it gets reordered first then OpenType layout applied, so it is treated more or less as LTR segments by the OpenType engine, so the kerning need to be set visually not logically. Old 'kern' table, as compared to OpenType 'kern' feature, is applied before reordering the text, so it does not suffer from this complication (but you can't use it to kern any un-encoded glyph, so it can be largely useless).</p>
