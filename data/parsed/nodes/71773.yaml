    <p>At the urging of my dear friend and colleague Israel Seldowitz, I wish to share with the Typophile Hebrew group some news about Mahzor Lev Shalem, the new High Holidays Mahzor I designed and produced for the Rabbinical Assembly. It's a work of 944 pages, measuring 6.5" (16.5cm) x 9.1875" (28.34cm). The Hebrew type, inspired by Henri Friedlaender's Hadassah, was made by me and Israel. </p>
    <p>You might be interested in reading this:<br>
    <a href="http://www.aiga.org/content.cfm/the-rabbi-of-book-design-an-interview-with-scott-martin-kosofsky" title="http://www.aiga.org/content.cfm/the-rabbi-of-book-design-an-interview-with-scott-martin-kosofsky">http://www.aiga.org/content.cfm/the-rabbi-of-book-design-an-interview-wi...</a></p>
    <p>You can see a sample of the mahzor here:<br>
    <a href="http://www.rabbinicalassembly.org/Mahzor.KolNidrei.pdf" title="http://www.rabbinicalassembly.org/Mahzor.KolNidrei.pdf">http://www.rabbinicalassembly.org/Mahzor.KolNidrei.pdf</a></p>
    <p>The first printing of 130,000 sold out before all the books were off the bindery line. A second printing of another 50,000 copies, which contains a number of small corrections, is now underway.</p>
    <p>All the best,<br>
    Scott</p>
