      <p>LIBI? I can assure you Masterfont had nothing to do with this!  This is a rather close replica of the principal text type made around 1560 by Guillaume (II) Le Bé for Christophe Plantin's Polyglot Bible. Some years ago, my friend Matthew Carter digitally rendered the display cut for use in Barry Moser's well-known Bible, where they appeared only as numbers for the Psalms. It had never been set up as a proper font. In this collaborative effort, we're making the display as well as the text. Israel Seldowitz will do the encoding after the glyph set is finished. The spacing you see here (sorry, it's not a very clear--I can't seem to upload a PDF) is sidebearings only--no kerning table. The nikkud and taamim were placed manually, as a demo. I'll tell Messrs. Le Bé and Plantin that you recommend an adjustment of the proportions.</p>
      <p>This is one of the great legacy types from the Golden Age, which, sadly, have been ignored in modern Jewish publishing. We hope it will have a long and healthy revival.</p>
