      <p>I think there's a problem trying to look at this on screen, because in converting to pixels, the spacing within and between characters is slightly changed...</p>
      <p>But looking at this small, without nikud, I'm wondering whether the shin is too narrow. I am a fanatic about even color, and I don't know if you share that. When I look at samples of Zvi Narkiss's fonts on p. 100 of Language Culture Type, I see an awesome evenness and balance. (I notice he does tricks to lighten the middle stroke of the shin.) I can't really give a good critique because of its being on screen, and my not having done a Hebrew type. </p>
      <p>A good, traditional "proofing" technique is to put every letter between every other letter. In roman type you have strings like this: aaabacadaeafagahaiajakalamanaoapaqarasatauavawaxayaza then babbbcbdbebfb ... etc through the alphabet. Of course you can do the same with Hebrew. Then you print it out small, and some issues pop out that wouldn't be so obvious otherwise.</p>
