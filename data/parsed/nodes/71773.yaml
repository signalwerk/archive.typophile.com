      <p>As I mentioned in my posting of 28 July, what began as a new version of Ismar David's ubiquitous font morphed into something new, a font I'm calling Shlomo. It contains some quotations from David, but is generally simpler in form. Though the attached images include a very large size, keep in mind that it's intended for text. I'm developing it for the Reform religious community, in which fluent Hebrew readers are in the minority. There will be a bold weight beside the regular and medium (for small text) shown here, but I haven't gotten to it yet. The encoding of the nikkud (there will be taamim, too) hasn't begun, so what's here has been "hand composed," awaiting my last adjustments to the glyphs and their sidebearings. There's no kerning table yet, either; these samples driven completely by the sidebearings, which, for Hebrew with diacriticals, have to be considered very carefully.</p>
      <p>I'd be happy to hear your thoughts.</p>
      <p>Cheers,<br>
      Scott</p><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoIII_6382.beta3-1.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoIII_3824.beta3-2.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoIII_6569.beta3-3.jpg"></div><p></p>
