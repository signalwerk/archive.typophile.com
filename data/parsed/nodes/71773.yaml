      <p>I don't about Hebrew, but you can set OpenType kerning pairs for Arabic, it just has to set in an awkward way.</p>
      <p>In LTR scripts, you kern glyphs by changing the right side bearing of the left glyph. However for RTL scripts, because layout engines still layout glyphs from the left to right, you have to change the left side bearing of the glyph on the right (thus making them closer) <strong>and</strong> the glyph on the left to avoid having gap after the kerned pair.</p>
    html_clean: |-
