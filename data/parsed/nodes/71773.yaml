      <p>Thanks for all the kind words. The kamatz katan had been a feature of Conservative siddurim for some time (often as a patach with a dot underneath--as it appears in the Aleppo and Leningrad Codices), but the sh'va na and sh'va nach had never made the cut. One thing I advocated for (at Israel's urging) that made it in was the patach g'nuvah, the patach at the right side of the letter. I suspect some people will think it's a mistake, until they see it recur a number of times.</p>
      <p>The red in the file is PMS 1805, but the red we printed was a special mix, made to match the endleaf color, Ecological Fibers' Crimson in the Rainbow series. It worked well in the first printing, though in the second, now just off press, I asked that they stiffen it a bit. The paper, which is quite nice at 28# (42gsm) weight, has good holdout and opacity, so it can take a solid hit. </p>
      <p>Good luck with the Pirkei Avot!</p>
