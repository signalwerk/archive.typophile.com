    html: |-
      <p>Thank you all, for your helpful comments. I've made a considerable number of changes to Shlomo since I last posted--starting with the alef. As with all text types that aspire to usefulness, I'm trying to make it disappear, so most of the eccentricities have been jettisoned. David did a good job of embarrassing me out of the tsadi sofit (and with it, the tsadi). Did I go too far? Maybe one more pass and I'll call it finished. </p>
      <p>Michael, your question about the wide final forms is a good one. As you know, one cannot break words in Hebrew, so the wide final letters were adopted for justification. Some surviving early fonts have final letters of two widths. Over the past century, they fell out of favor, as mechanical typesetting systems took over-- Monotype, linecasters, film, then digital--and the wide letters were no longer available. I made a set for Milon, the font I made (with Israel Seldowitz) for Mahzor Lev Shalem. When I showed samples, everyone said "no way," for the reason that too many people would be unfamiliar with them. The only reasonable solution, then, was setting the type unjustified. In this font, I'm hoping to squeak by with a new strategy, making wide letters that aren't too wide as to be confusing, but wide enough to prevent holes in the lines. Chances are I'll never use them! </p>
      <p>Piccic, that is, indeed, Magma--Sumner's best work, in my opinion. I've never used the lowercase, just the caps.  </p><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoVII_4201.beta2-2.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoVII_5904.beta2-9.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoVII_4426.beta2-8.jpg"></div><p></p>
