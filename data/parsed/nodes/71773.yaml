      <p>Isn't it great to have such a loyal defender? Israel, you're the best (though hardly impartial). Be that as it may, I'm grateful for serious criticism, so fire away, Bill et al. This is a font intended to be read over a long haul at religious services, invariably with nikkud. That it seems to have good display qualities makes me a little cautious. I tend to prefer fonts that have elegant forms, but have the more important characteristic of disappearing as you read them--the essential Caslon quality, as Bill knows well. Peculiarities are especially unwelcome. What would Mr. Updike say? Fortunately for me, he was a staunch Episcopalian . . .</p>
      <p>Here it is, in regular and medium weights, without nikkud. I have not yet completed the kerning, so what you see is fit largely through sidebearings alone.</p>
      <p>Best,<br>
      Scott</p>
      <p>P.S. One thing I am trying to accomplish here is a revival of the extended forms for justification. Because such glyphs vanished with the advent of mechanized typesetting, I am aware that readers are no longer accustomed to them. So I've made them quite subtle, in hope that they'd blend in easily, while at the same time make for tighter lines and paragraphs. That Hebrew readers have become used to very poor, loose composition is quite unfortunate.</p><div class="imageWrap"><img src="http://typophile.com/files/Shlomo7_3813.5.NoNikkud.jpg"></div><p></p>
