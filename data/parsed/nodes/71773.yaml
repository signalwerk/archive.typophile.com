      <p>Here's how the font has progressed. The stems have been regularized and many of of the characters have been revised, some quite significantly. There's much work to be done, finishing the spacing work and encoding the positions of all the diacriticals, but I can't imagine that the glyphs will change greatly. After about 25 passes, I think this is it. A bold and light will be added, and it's likely that I'll add a titling version, incorporating some of the more decorative details that were abandoned after the first version. My goal has been clarity and simplicity, an easy-reading type that's well-suited to less advanced readers. Beside the nikkud, there will be a full battery of taamim. </p>
      <p>A number of colleagues offered very helpful critiques: Lance Hidy, Misha Beletsky, Ed Feld, Howard Gralla, David Sarna, David Stein, and, of course, Israel Seldowitz, my partner in crime. I thank all of them!</p>
      <p>By the way, I did this work in the new Fontographer 5, which feels as if a good old friend has emerged healthy from years in rehab.</p>
      <p>Cheers,<br>
      Scott</p><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoV_5253.beta2-1.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoV_6392.beta2-2.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/PhilidorShlomoV_4565.beta2-3.jpg"></div><p></p>
