      <p>Yes, I can see that the all the commentary put strong constraints on what you could do. I don't have a strong feeling that one way of mirroring is better than the other—probably it depends on other factors.  </p>
      <p>I see you have a special character for the kamatz katan, but no special character for the schva na—which your friend Israel has discussed endlessly here :)  Probably that was a decision of the editors, right?</p>
      <p>I also like the design of Mishkan T'filah, as it was such an improvement over Gates of Prayer. But this is still better. I love your sensitive use of the red, which really has helped you pull off the impossible of making all this into a coherent, readable structure, which is beautiful to boot.  </p>
      <p>One more question, a printing question. The bright red in the PDF is a traditional printing color, but I see most second color reds now are almost always deeper, like a brick red of some sort. I thought that this was because the bright red would be too transparent and weak in offset printing, as opposed to the old classic letter press. </p>
      <p>Does the published version use the same red? Any advice on choosing reds? I am seeing JPS tomorrow about my new guide to Pirke Avot, which uses a red also, so any insight is most welcome!</p>
