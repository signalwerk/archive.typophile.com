      <p>I don't really understand what your original idea is, so I can't really help there.</p>
      <p>I do have a suggestion for you, though: I'd put your more experimental projects on hold for the time being and try working on a more conventional design while you master the tools you are using and gain a better understanding of the OpenType format. You'll then be in a much better position to decide whether your projects are feasible, and whether opentype fonts is really an appropriate technology to use for that project.</p>
      <p>FontLab and FDK are both fairly complex tools, and while GSUB rules can be fairly powerful, they also have many limitations and are not designed with the kinds of things you have proposed in mind. Learning how all the pieces fit together is a lot easier if you are working on the kind of thing which can be readily compared with existing OT fonts. OpenType coding also differs in some fairly salient ways from programming which may not be obvious until you're more used to working with OpenType lookups.</p>
      <p>I'd start by reading through the FontLab manual as well as the documentation on Adobe and Microsoft's sites with the goal of understanding the big picture rather than using them as 'troubleshooting guides' whenever you encounter an error.</p>
      <p>André</p>
      <p>[p.s. Some of the you are doing would likely be more readily implemented using AAT rather than OpenType, though the set of tools available for developing AAT fonts is both more limited and less user friendly than those available for OpenType, so I definitely wouldn't recommend that as a place to start; however, if you are determined to do this as a font and find that OpenType doesn't meet your needs that might be an option to consider somewhere down the road].</p>
