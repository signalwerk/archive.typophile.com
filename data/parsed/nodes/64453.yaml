    user: 31798
    date: 2009-11-19T19:05:00
    date_raw: 19.Nov.2009 7.05pm
    votes: null
    html: |-
      <p>That lookup is way to big. It looks to me like like what you're trying to do definitely requires tables which are larger than what the OTSpec was really designed to handle. OT doesn't include a type of rule which allows for non-local context over arbitrary distances, and trying to mimic such rules using code such as above is really pushing the limits. The 'useExtension' tag might allow this to compile, but it's still going to really slow down the user's system.</p>
      <p>What exactly is it that you are trying to do with the above rule? What's in @59 and @50?</p>
      <p>André</p>
