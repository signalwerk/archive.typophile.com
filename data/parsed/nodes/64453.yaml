  html: |-
    <p>Chain contextual lookup subtable in GSUB feature 'dlig' causes offset overflow.</p>
    <p>it's driving me nuts</p>
  html_clean: |-
    <p>Chain contextual lookup subtable in GSUB feature 'dlig' causes offset overflow.</p>
    <p>it's driving me nuts</p>
comments:
  - id: 379351
    user: 31798
    date: 2009-11-19T08:48:00
    date_raw: 19.Nov.2009 8.48am
    votes: null
    html: |-
      <p>It means that the size of the your lookups has become too large for them to be referenced using the 16 bit offsets used in standard GSUB tables.</p>
      <p>Read up on the 'useExtension' keyword in the OpenType Feature Syntax reference.</p>
      <p><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html</a></p>
      <p>André</p>
