  html: |-
    <p>Tipoteca Italiana<br>
    Cornuda, Treviso province.<br>
    Located in the buildings of the old "Canapificio Veneto", the Tipoteca hosts events that increase the value of typography.<br>
    Tipoteca is not only a rich collection of typefaces, but also archive, museum, casting and restoring workshops, printshop and library.</p>
