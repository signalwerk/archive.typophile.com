  html: |-
    <p><strong>// THIS WEEK'S TYPOGRAPHY BATTLE</strong></p>
    <p>Draw us a new logo! Yes, that is right. Typophile is ready to move past the pixel-T, and especially the pixel-7. We are looking for not just one amazing drawing, rather a large handful that can be rotated on the red square and potentially used in other Typophile promotional materials. What better way to show off the talents in this community, than to display them proudly in our mark?</p>
    <p>Examples of previous logos:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/black_pixel_3948.png"></div><p></p>
    <p>// REQUIREMENTS</p>
    <p>- Draw only the letter T -- it can be uppercase or lowercase.<br>
    - How you draw it is up to you (vector tools or ink), just as long as the file is submitted in the proper format.<br>
    - By participating, you pledge that the work is of your own design.<br>
    - Do not use any fonts or other rights-protected imagery (unless you own the rights to the design).</p>
    <p>- Image size: 500 width x 500 height. 600 dpi<br>
    - Color: Black and White<br>
    - Format: TIF</p>
    <p><strong>Judging</strong> // <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> will judge the entries, keeping in mind the popularity of the entries in the thread. </p>
    <p><strong>Copyright Retention</strong> // Participants (those who submit entries to Typophile) grant Typophile permission to use the artwork/design for promotional use, as we see fit, and for applications not limited to the website. Participants retain copyrights and Typophile agrees not to sell or transfer our usage rights. (In other words, we don’t require exclusive rights, just unlimited usage.) </p>
    <p>// ABOUT TYPOPHILE'S TYPOGRAPHY BATTLES</p>
    <p>This is your chance to stretch your type muscles on a weekly basis. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>Link directly to this thread: <a href="http://www.typophile.com/battle27" title="http://www.typophile.com/battle27">http://www.typophile.com/battle27</a></p>
