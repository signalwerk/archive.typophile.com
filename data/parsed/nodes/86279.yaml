    html: |-
      <p>One option is to start with a modern take on the main historical classifications:</p>
      <p>• A venetian or old style/humanist serif: <a href="http://www.adobe.com/type/browser/landing/arno/arno.html" rel="nofollow">Arno Pro</a> by <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach</a><br>
      • A transitional serif: <a href="http://new.myfonts.com/fonts/fontbureau/whitman/" rel="nofollow">Whitman</a> by <a href="/wiki/Kent%20Lew" class="freelinking" rel="nofollow">Kent Lew</a><br>
      • A didone/modern serif: <a href="http://www.typejockeys.com/fonts/Ingeborg" rel="nofollow">Ingeborg</a> by <a href="/wiki/Typejockeys" class="freelinking" rel="nofollow">Typejockeys</a></p>
      <p>• A humanist sans: <a href="https://ourtype.com/#/try/fresco-sans/" rel="nofollow">Fresco Sans</a> by <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a><br>
      • A geometric sans: <a href="http://www.primetype.com/faces_info.php?fid=44" rel="nofollow">Superla</a> by Herr <a href="/wiki/Karl-Heinz%20Lange" class="freelinking" rel="nofollow">Karl-Heinz Lange</a><br>
      • A grotesque sans: <a href="http://www.optimo.ch/typefaces_Theinhardt.html" rel="nofollow">Theinhardt</a> by <a href="/wiki/Fran%C3%A7ois%20Rappo" class="freelinking" rel="nofollow">François Rappo</a></p>
      <p>• A humanist slab: <a href="https://www.typotheque.com/fonts/charlie" rel="nofollow">Charlie</a> by <a href="/wiki/Ross%20Milne" class="freelinking" rel="nofollow">Ross Milne</a><br>
      • A geometric slab: <a href="http://new.myfonts.com/fonts/urw/memphis/" rel="nofollow">Memphis</a> by <a href="/wiki/Rudolf%20Wolf" class="freelinking" rel="nofollow">Rudolf Wolf</a><br>
      • A grotesque slab or Clarendon: <a href="http://new.myfonts.com/fonts/urw/serifa/" rel="nofollow">Serifa</a> by <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a></p>
      <p>Now you gotta connect the dots.</p>
