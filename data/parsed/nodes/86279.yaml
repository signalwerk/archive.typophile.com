      <p>There is A LOT to learn from working with only a few carefully selected fonts, as opposed to the usual scrolling-through-font-list-design. Get familiar with the historical classifications, what ideas informed the type designer and why a particular face works better in a particular situation, and you’ll start understanding what exactly you should look for when that next project needs 6 pt. text typeset on uncoated paper printed on an outdated laserjet from the late eighties. Furthermore, you’ll start <em>designing</em> — not just copying the latest trend.</p>
      <p>(That last part is not necessarily intended for you :)</p>
