    html: |-
      <p>I would heap all those fonts into one folder (preferably on a separate standalone disk-dribe) and when a job comes around where you need a font, search that for the best option (pref a late version OT, Pro or Extended) and copy that to your workstation. That will also give you occasion to check whether it is a legally acquired font.</p>
      <p>To make things easier you could make in inventory of all the stuff you have in the form of an automatically made specimen book. There is s/w to help you do that.</p>
      <p>Do NOT do your own conversions to OT. Lots of problems in practice, eg missing euro-signs, etc.</p>
