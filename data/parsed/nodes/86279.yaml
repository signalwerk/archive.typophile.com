    <p>Hello,</p>
    <p>I've started to work in a new medium-sized design studio. When I came here all of the 4 designers before me had a few font collections based on a same collection. I mean they were given a font folder and then they added their own font's later. When I came to here I had to copy all the folders and merge them into one (because I was given a new computer) And when I check the fonts it the file it just looks like a disaster! postscripts, opentypes, truetypes they are all mixed up! Since I was a mac user I was prefer to choose OpenType when buying one. And also because of that I never intended to learn what was the technical difference. But now I got tons of unorganized mixed pile of fonts to use but I'm always uncortable when something important like this kept unorganized. so here are my questions;</p>
    <p>- First of all what is the best font manager program? Suitcase Fusion 3 or Fontexplorer X ? The studio have both licenses so the I can choose between those two. Or if you can advice a better one I can buy it for myself.</p>
    <p>- Will there be any corruption (in kerns or anything) if I convert all the fonts to opentype with a software Font XChange?</p>
    <p>- Most of the fonts in the collection is weirdly ungrouped in the management programs. I mean for example Bell Gothic has 3 families for bold regular and roman. And inside them their italic and regular format. But I mean come on, they're all Bell Gothic why are they separate families? What could have happened to the fonts? And how can I rearrange them in to same family tree like they supposed to be.</p>
    <p>Thanks for sparing time. Oh btw english is not my naive language, excuse me if I've made grammar mistakes :(</p>
