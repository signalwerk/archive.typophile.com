      <p>frode frank said it better than I could. I wouldn't worry about what font manager to use too much, or even if you need one. Personally, I use Suitcase Fusion 3 and keep a couple different Libraries. A 'Library' in that app is like switching to a completely different set of preferences. So, I have a 'Junk' library with unlicensed/dodgy fonts that I might occasionally refer back to to handle old projects or something. This is a giant list of fonts--unusable for commercial design work. I also have a 'Production' library, which is the fonts I'm likely to use on a day-to-day basis. Its still more fonts than I want active all the time, and I like Suitcase's features for organizing them. </p>
      <p>Disclaimer: I don't work for Extensis, but I used to.</p>
