    html: |-
      <p><cite>Will there be any corruption (in kerns or anything) if I convert all the fonts to opentype with a software Font XChange?</cite></p>
      <p>The font names within families will get screwed up and every font will be its own family. Your kerning will probably be ok if you actually have good kerning files for the Postscript fonts to begin with. And the Truetype fonts should be left alone.</p>
      <p><cite>Sounds like a case of pirated fonts.</cite></p>
      <p>My thoughts exactly. Start by cutting the entire firm down to the fonts the business has receipts for and delete everything else. Synchronize everyone on one small set of legit fonts, buy more as needed, and manage all fonts from one server instead of spreading them around.</p>
      <p>If you don’t nail this down now it will bite you on the ass later. Either a big job will get screwed up because of problems with the crazy font collection or somebody will notice an unlicensed font in a job and you or your client will get a bill, or worse, served with legal papers.</p>
