  html: |-
    <p>Hey. I'm getting married in January and trying to make choices on text for the invitations. We all know that Bickman was an incredible typographer but I'd like to use a script that hasn't been used on 90% of wedding invitations :)</p>
    <p>Can anyone suggest some really classic, beautifully swashed or not swashed fonts? </p>
    <p>I'm going to be crafting the invitations myself but, of course, printing the text and inserting it into the invitations.</p>
    <p>Thanks! I appreciate.</p>
    <p>Carolann</p>
