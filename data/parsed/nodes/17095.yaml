      <p><em>I forgot to mention that in public school we used to try to get away with tying two or three pencils together to do “lines” which were given to us as punishment. You know the kind of thing: “I will not ever again” etc.</em></p>
      <p>I've seen Tim Holloway using two pencils taped together -- with one edge of each shaved down to reduced the space between the points and to make the whole more stable -- to sketch the basic contrast of an Arabic letter before refining the outlines, making optical adjustments, and inking.</p>
      <p><em>In the Jarrold Printing Museum in Norwich and they have an old machine which produces ruled paper. It is quite literally a set of evenly spaced pens, which paper is rolled past.</em></p>
      <p>There is a huge old wooden ruling machine in the lobby of Benwell Atkins printers in Vancouver, of the kind used to rule large ledger folio pages. Rather than having pens, it has fine, taut threads that are inked and then lowered onto the the paper (very similar, in fact, to the string-slapping technique used by ancient Egyptian wall painters to make the straight vertical lines between columns of hieroglyphs). It looks a lot like a kind of loom, and the strings could be raised or lowered individually to produce different line spacing configurations. Sadly, the machine is no longer in working order.</p>
      <p>If you are in the Vancouver area, I recommend dropping by B/A on Great Northern Way to take a look at this wooden beast of a bygone era.</p>
