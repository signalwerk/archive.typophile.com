      <p>Stuart,<br>
      Perhaps you are getting at the master-apprentice relationship.  Typically this relationship ends when the apprentice has either learned enough of his master's wisdom to go on his own, or there is a tenson developed where apprentice questions the master's ability to overule him (or the master thinks his apprentice to be a dolt).<br>
      I think the relationship has to at least start with the acceptance by the apprentice that knowledge is coming down to him/her and that this is not a colleague relationship. Maybe what you are saying is that you would not see peoplewilling to be subserviant if they already felt they had achieved some resonable degree of knowledge and skill?<br>
      I think this also varies with the type of task being taught. Learning how to cut a punch or make a casting is more akin to your carpenter example. Learning to design one's own typeface would be another story. Here there are far more avenues to take and plenty more room for dissagreement on form.<br>
      The technical part of the craft has changed to more of the software knowlege including FontLab and VOLT, as well as hinting, scripting, and OTF feature construction.</p>
      <p>ChrisL</p>
