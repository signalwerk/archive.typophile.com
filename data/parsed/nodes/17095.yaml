    html: |-
      <p>I think the problem is the notion of "apprenticeship" in the first place. It's a very beguiling word: Dan's romantic notion of chisel-edged pencils and handmade paper is so seductive that I would like to apply for this apprenticeship myself. I can see myself spending a year with an Old Master, sharpening pencils and fetching pots of tea, while quietly taking in a body of received wisdom. I'm not exactly sure why an Old Master would pay me to do this, though; I suspect I'd have to pay the Old Master. In which case what I'm describing wouldn't be an apprenticeship, it would be grad school.</p>
      <p>Almost all of the accomplished type designers I know -- certainly all the designers of my generation, and everyone younger -- learned on the job. This is a twofold process of learning established tradecraft, and developing your own techniques out of necessity. In my experience, this environment is unique to the commercial pressures of a professional setting: as Christian points out, this does not happen with FontLab &amp; a web browser in your spare bedroom. That's good too, but it is different.</p>
      <p>The workplace can be an amazing crucible for developing new skills, and sharpening the ones you have. It requires that you learn quickly, think on your feet, and demonstrably improve every day. It also, as John Hudson points out, demands a real facility with a range of abilities and interests, from drawing outlines to writing code. Its upsides include a paycheck, a collaborative environment, access to practitioners of the craft, and hands-on experience with real-world projects. Its downside is that it's real work, and very little real work involves lofty discussions about the echt Imperialness of an inscriptional roman. Also, some of it will be tedious, and most of it will be hard.</p>
      <p>Think about what you really want out of an apprenticeship. If it's something that you think could be satisfied in the workplace, send out some portfolios. We're always looking for good people (careers-at-typography.com), and I imagine that the folks at Font Bureau and House Industries are as well. If you think you'd rather take the time to focus on learning for learning's sake, consider a graduate program. Reading and KABK have strong programs in type design, and Yale, CalArts and Cranbrook have much to offer here as well.</p>
