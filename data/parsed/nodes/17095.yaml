      <p>There is another aspect of learning which can neither be "just taught" nor can be self-learned. It has to do with direct one-on-one interaction within physical proximity and then gradually at a distance from one another.</p>
      <p>I don't believe it always requires a long period of time, in fact, I don't sense that the passage of time is an actual factor as opposed to a skill, knowledge or awareness that develops at its own rate.</p>
      <p>This may not be what typically is associated with being an apprentice or student, but it does have something to do with the way one acquires certain forms of knowledge or understanding. During the early stages and at certain critical points, one needs to be directly observed, guided and evaluated before one progresses to the next area of development.</p>
      <p>I can't seem to think of any examples in Western civilization, but for the Chinese, learning to be an approved practioner of Traditional Chinese Medicine is about as clear an example I can think of. There is a certain body of knowledge (massive, actually) which must be absorbed, and then there are several "skill/awarenesses" that must be developed and mastered. (Like sensing if a patient's Chi is sufficiently unblocked by acupuncture or if another technique is required.) There is no instrument for sensing Chi. You can't learn Chi or acupuncture from a book, and even when it's taught, it's not easily learned or understood. </p>
      <p>The Chinese call this level of teaching/learing "transmission" which suggests that there is something more being imparted to the student than just knowledge. I feel that's true about typography as well. (Though, thank goodness, not too many people that I can think of have been killed or maimed by poor typography.)</p>
      <p>I've never been an actual "apprentice" but I have been lucky enough to have had a few mentors, none of whom "taught" me anything directly, but whom I have learned from through their occasional guidance, from my direct observation, and from just spending periods of quality time together, listening, asking question, talking about life... and, oh yes, drinking wine (when with Aaron Burns) or beer (when with Ed Benguiat or Otl Aicher).</p>
