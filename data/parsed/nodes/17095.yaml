      <p>Dan, you will probably find that 90+% of type designers are not full-time type designers, and of the 10% who are full-time, 90+% of them work on their own. It's a function of the changes in technology in the last 30 years; type design no longer requires the backing organisation which was necessary from the mid 15th through late 20th centuries.</p>
      <p>And even where many foundries publish the work of many designers, the majority of them will be independent contractors, much like authors, working on their own.</p>
      <p>At one point Thirstype consisted of Rick Valicenti, Patric King, and myself sitting side-by-side in a room, primarily doing graphic design work, with some type stuff on the side. But the majority of the Thirstype designers were located far away, and were busy working at their own design firms doing the occasional bit of type work. I would imagine that the working arrangement at Fountain and many of the other small indy foundries is very similar. Underware is a group consisting of three gentlemen working in three cities.</p>
      <p>The companies with design staffs are large companies which have been around for decades: Monotype and Linotype.</p>
      <p>Another factor in the apprenticelessness of many type designers: they work out of their homes, and there is either not room for another person, or it would be awkward. (Personally, I live and work in a 425 square foot 2 bedroom apartment with my wife/partner and our two small dogs. It would not be feasible for us to have someone join us during the working day.)</p>
      <p>So... Apprenticeship is not dead, and will never die; but it is not the only way to begin in the type industry. There are many ways which type designers now help each other develop and hone their craft, with this website being one such information channel.</p>
