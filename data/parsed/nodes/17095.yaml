      <p>Wow, thank you all. I was forced to take notes just for this reply.</p>
      <p>Norbert — Beautiful references. You are finely tuned in to what I am saying. (Schwartz, as well.) You must be an asiaphilliac like me. On the subject of phenomenal arts — have you seen the Kôdo documentary? The drummers have to cut their own drum sticks and make their own drums and flutes. (They also run around the whole island they live on every morning, and their resting breath is spent playing the flute.)</p>
      <p>That transmission is sort of what I am looking for. That is what you get at college, and the main reason why students fervidly pay $20k a semester instead of signing up for DeVry online.</p>
      <p>Through a program, online pairing, or conventional "internships" the learning feels cold and commercial. Or at least with my experience it has (which was not specifically in "type" design but magazine publication, and then identity refurbishing and web). It's like that dreaded question Liza and Donald always ask on Typeradio: "Does money make the world go 'round?”</p>
      <p>Stuart — How many young fresh graduates went to TypeCon in New York? Sadly, I couldn't make it. I'd imagine there are many others like me in the same situation. All wishing they could have a real world teacher. It is sad to think that this could all be because no one is interested in learning from someone who has already done it before you, but I just can’t wrap my brain around that. I think many designers my age have lost faith in this whole Master &amp; Apprentice dream (or else they really enjoy the massive ad firm idea).</p>
      <p>I guess the big thing is, I don't want to start on my own. What I am really dreaming of is a grandfatherly master teaching me conservative roman type as he scrapes the pencil across some rough Arches Rives BFK. It seems like all the successful and current designers have interned or apprenticed in Basel :) or The Hague or Sweden.</p>
      <p>Chester — I agree. It would be incredibly awkward coming over to someone’s apartment to work. Their life completely exposed to this stranger.<br>
      And I do understand that custom type projects are far and few in between. But I have great type setting skills. I also have two chubby Lithuanian hands that are great with emptying trash and comping. Why would someone turn down an apprentice willing to dust his employer’s blinds?</p>
      <p>I will definitely try the Critique forum, though. Thank you all again.</p>
