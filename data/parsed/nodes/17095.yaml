    <p>I was born in the wrong era. I cannot help but notice the lack of apprenticeships, especially in America.  An ongoing search on the internet and through "inside connections" have led me to believe that the age of Master &amp; Apprentice are thoroughly dead. Am I looking in the wrong closets or am I actually on to something?</p>
    <p>Now, understandably, we could all toss it up to the laws of singularity, but maybe I am lost in dreaming that type design is still a romantic profession — or atleast the dreams I had after my Looking Closer III reading assignments. I mean, aren't most of the type foundries out there one or two man studios (i.e. Fountain, ThirstType, Orange Italic, DresserJohnson)?</p>
    <p>I truly believe that any type-obsessed young entry level would give up everything and live in a 4ft x 4ft wood shack, brushing their teeth with muddy water, just to learn from the likes of Frank E. Blokland, Matthew Carter, or (my favorite) Fred Smeijers (in house/not university, that is).</p>
    <p>I guess the real question (and the reason for this post) is: are apprenticeships really dead? and if they aren't how does one find a devoted master of the craft to teach them?</p>
