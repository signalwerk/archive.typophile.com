      <p>Hi Dan,</p>
      <p>This thread has been very interesting to read, thanks for your thoughtful post. . .</p>
      <p>In general I think apprenticeship has gone by the wayside primarily because there haven't been any apprentices . . .</p>
      <p>I say this primarily in part due to the fact that much information required to work or start a business in this field can generally be learned on ones own. By the virtue of this forum, type design books, Typecon, e-mailing other type designers, etc . . . There is a host of ways a self-taught font designer can acquire growing knowledge in this industry . . .</p>
      <p>As a result of this virtual interaction, there isn't really an opportunity to be apprenticed but rather participate in the type design community at large and learn from asking . . .</p>
      <p>That said, I don't think there has been anybody I've ever asked questions about the craft who hasn't been more than willing to help but the reality is that most of the time anybody who has the desire to run their own foundry usually will make the decision to start from scratch rather seek out professionals who do it for a living and apprentice . . .</p>
      <p>So I still resolve that there is a shortage of apprentices who want to be apprenticed and rather turn their efforts to self-teaching . . . As you can see from the posts above, there is no shortage of opportunties to be apprenticed, just not many who wish to pursue them . . .</p>
      <p>Stuart :D</p>
