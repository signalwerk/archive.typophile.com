      <p>Great posts Chester, John, Norbert.</p>
      <p>I had the great fortune to work for a year as a junior art director for Raymond Lee, who I consider (in retrospect) to be my mentor. Ray is one of the "Big Idea" creatives who came to the fore in the 1960s. I have never done a piece of art direction since I left him, without him standing at my shoulder, so to speak, and I don't even have to ask myself "How would Ray have done this" because any time I stray, it sucks.</p>
      <p>Another big influence is newspaper designer Tony Sutton. Tony is a meticulously un-fussy typographer, if you know what I mean; for instance he has no use for old style figures. So he's kind of an exemplary benchmark -- I design faces with him in mind, either for him, or in spite of him.</p>
      <p>I'm a self-taught type designer, so there's no one like Ray or Tony there. But Oz Cooper is my virtual sensei.</p>
