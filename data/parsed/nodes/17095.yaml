      <p>Apprenticeships are still very much alive at a few University Letterpress/Printmaking shops – masked under the guise of formal classes. I was a printmaking major who never graduated. Rather, I spent my time learning to set lead type from a master printer who liked to circumvent the system as much as I did.</p>
      <p>You might think about enrolling in a University Book Arts curriculum where you'll learn not only to set type and operate old presses, but also to skillfully bind books and create wood type for titling. Usually, there are so few students enrolled in Book Arts programs that it may well seem like a one-on-one apprenticeship.</p>
