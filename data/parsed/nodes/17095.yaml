      <p>I think Daniel's onto something here. It does seem very difficult to break into the type industry. As Chester pointed out, over 90% of type designers are not full time type designers. It is very difficult to balance the time to do something that requires so much of your time and a way to bring home the bacon (or the daily bread if you're a vegetarian).</p>
      <p>If more designers could find it as a viable source of income, you would find more designers involved in type design. It really is a starving artist field, not to say that there aren't quite a few success stories, but I'm willing to say that it might be harder to make a living as a type designer than as a fine artist. That's saying a lot. Lucky me, I happen to be interested in both. :)</p>
      <p>The tools are certainly here on this site for finding a "Master" and honing your craft— the knowledge here is invaluable. The tools that are missing however, are how to parlay that knowledge into a career. Is this even possible?</p>
