      <p>I used the acupuncture and Traditional Chinese Medicine (TCM) analogy because most people, even western medicine, believe that it does work... just not certain about the how or why. Most people also accept the fact that if you were to seek treatment, you wouldn't go to someone who got their training from a book or via the Internet, would you?</p>
      <p>Having studied Tai Chi Chuan and Qi Quong for nearly ten years, and Tui Na (Chinese healing massage) and foundations of Traditional Chinese Medicine on and off for three years with two Chinese Masters has nothing to do with my choice of analogies. I could have used Yoda teaching Luke Skywalker how to use the Force instead. ;-)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/yoda.jpg"></div><br>
      Master Yoda hopes to speak at TypeCon 2006.<p></p>
  - id: 102832
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 5 Jan 2006 — 9:02pm
    date: 2006-01-05T21:02:00
    votes: null
    html: |-
      <p>The apprentice model of learning type design has largely disappeared because the manufacturing processes and businesses that supported it have disappeared. The days when Matthew Carter could go, as a young man with his father's recommendation, to learn to cut punches by hand at Enschedé are gone because that highly skilled manufacturing process has disappeared, as have the mechanical versions of the same. They have been replaced by digital production tools that pretty much anyone can learn to use with some modicum of skill, and which have user interfaces that have much in common with non-specialist digital art and design tools, meaning that basic skills can be learned from a readily available books or courses.</p>
      <p>I think it is important to realise that apprentices derive from manufacturing processes, not from design processes. Historically, most people learned to design type by learning to make type, or came to it through related activities of calligraphy (e.g. Hermann Zapf), stonecutting (e.g. Eric Gill), or sign painting (e.g. John Downer). Very few people ever apprenticed specifically as type designers. They apprenticed as drawing office staff producing production drawings from other people's designs, or as mechanics operating cutting or casting equipment, or they learned through the training or apprenticeship models of those related fields (e.g. David Kindersley, who apprenticed as a stonecutter with Gill, and after establishing his own career as a stonecutter took an interest in the spacing of mechanically reproduced lettering and type design).</p>
      <p>One of my favourite stories about how someone became a type designer, which I think I've told here before, is that of Tim Holloway. He was hired for a junior management position by Walter Tracy at Linotype, and set to spend some time working in each othe various departments in order to learn how the whole business worked. When he got to the drawing office, he discovered that he had a natural talent as both a draughtsman and a designer. He never took the management position, and stayed in the design department. I consider him among the greatest living type designers, right up there with Matthew and Hermann, although he is overlooked by most people because almost all his work has been in non-Latin type design.</p>
      <p>These kind of practical apprentices have disappeared because the people who design and make type don't really need apprentices to help with the making bit. If you need someone to help you <em>manufacture</em> fonts you don't need a beginner, and if you need help you're not in a position to teach anyone else: you need someone who knows more than you do. So the kind of 'entry level positions' that foundries are trying to fill is for people who already have good technical skills and experience, e.g. people like Tom Grace who went from the MA programme at Reading to work with Jeremy Tankard and is now working for Jean-François. I know that when my colleagues and I look at the graduates from places like Reading, we're not necessarily looking for the best designers, but for people who can do Python scripting or other programming, or who have good proven skills in being able to work with the tools, understand the font formats, and can produce robust fonts. In other words, we're looking for people who are already past the apprentice level.</p>
      <p>In this situation, even the old economic model of apprenticeship -- having someone work for you for little or nothing, or even having them pay you for the privilege -- isn't attractive to potential employers/trainers. I simply don't have time to train someone, and I doubt if many of my colleagues do.</p>
      <p>Some of the larger companies have intern programmes, which is as close as you are likely to get these days.</p>
