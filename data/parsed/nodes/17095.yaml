      <p>This has been mentioned before, but there is definitely something to be said about manually composing type, adding spacers, coppers, lead, hand inserting ligatures, proofing and spot reading galleys prior to pulling proofs, in other words, getting intimate with tangible type.</p>
      <p>It may have something to do with multiple synapse firing off during "hand-to-eye-to-hand" activities. It may have something to do with directly associating real three-dimensional space with spacing two-dimensional elements (and notan) and finally manipulating virtual space... though just a gut feel and nothing to substantiate the advantages of touching type.</p>
      <p>It's like saying a "Master Typographer" could space type blindfolded by just running the hand over composed type... like <em>Zatoichi, the blind swordsman</em> slicing the wing off a moth in mid air.<br>
