      <p>Another situation that makes any viable "on-the-job" training difficult is the sheer lack of type-aware businesses to seek employment at.</p>
      <p>Though I am not a type designer, my typographic "on-the-job" training took place over the course of years at several printshops, a small book publisher, a daily newspaper, all of which had "seasoned pros" who were typographers, metal and photo composers, lettering artists, and ex-sign painters. I also spent time at type shops (those musty old warehouse establishements that ran 3 shifts setting type 24x7) watching type directors/typographers markup and edit galley proofs.</p>
      <p>Prior to the mid-eighties, you could find such companies in virtually every mid-sized town to large city... all busy making a living doing something knowledgeably with type.</p>
      <p>By the time I got to Compugraphic my typographic portfolio got me a spot as their Art Director in charge of type related promotional material and specimen books. Another 14 years gave me the opportunity to learn and collaborate with some of the best known and respected typographers and type designers around the globe.</p>
