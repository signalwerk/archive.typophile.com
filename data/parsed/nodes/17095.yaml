      <p>Only a few weeks ago I was re-reading Paul Rand's essay, <em>Good Design Is Good Will</em>, Yale University 1987:
      </p><ul><em>Even if it requires no extensive schooling, design is one of the most perplexing pursuits in which to excel. Besides the need for a God-given talent, the designer must contend with encyclopedic amounts of information, with a seemingly endless stream of opinions, and with the day-to-day problem of finding "new" ideas (popularly called creativity). Yet it is a profession relatively easy to break into. Unlike those of architecture and engineering, it requires no accreditation (not that accreditation is always meaningful in the arts). It entails no authorization from official institutions as do the legal and medical professions. This is equally true of other areas of the business world, for example, marketing and market research. There's no set body of knowledge that must be mastered by the practitioners. What the designer and businessman have in common is a license to practice without a license.</em></ul>
      <p></p><p>Apprecticeships (as similar to the old "Guild Systems") are still maintained by trades such as plumbing, carpenters, electricians, etc., and are strictly regulated from within in terms of level of accreditation as in tradesman to Master Electrician. Even the unions associated with typesetting, printing and newspaper publishing had maintained systems of apprenticeship as a way of teaching and regulating the skill sets of their levels. </p>
      <p>But as mentioned by others above, we simply have to nourish these skills and share the knowledge via our community. It's really the MAIN reason I felt compelled to "resurface" in the type community, plus a true sense of DEBT that I owe to those who had taught me over the years.</p>
