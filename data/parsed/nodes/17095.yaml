      <p>Forums like this one are all well and good, but there's still something to be said for working one-on-one with a designer you respect. I was lucky enough to go through a couple of internships that ended up being more like apprenticeships (complete with poverty and dodgy living situations), and my first 9 or 10 months on the Font Bureau design staff were a lot like an apprenticeship too. I learned quite a bit about drawing, spacing, and type production, which you could probably pick up here, or from books, or even by trial and error, but I don't think I could have learned about the business side - things like dealing with clients, and meeting deadlines - any other way.</p>
      <p>So my point is - although graduate programs appear to be eclipsing apprenticeships as the way to learn about drawing type, apprenticeships do exist, so don't give up hope. I know Font Bureau always has an eye out for the next diamond in the rough, and I don't think they're the only ones. The important thing is to keep reading about type, and looking at type, and drawing type, so that when you find an internship, you have a good base of knowledge to build on.</p>
      <p>Your profile says you're in Brooklyn, so feel free to contact me off-list for more info on type stuff going on around the city.</p>
