      <p>One thing to remember about apprenticing in the <em>Black Arts</em> was that it was originally born of the Guild System, specifically the Printers Guild. You didn't simply "learn" from a Master, but worked for a specific guild (Printers Guild of Padua, Italy) and received additional training as the guild saw fit. Guild and trade secrets were (and still are in certain professions) kept highly guarded.</p>
      <p>Today, Printer Guilds still exist, but more in light of preserving the craft and as a means of educating. (<a href="http://www.fiveroses.org/HCCP_index.htm" target="new" rel="nofollow">The Yale Honorable Company of College Printers</a>, the world’s oldest continuous student printing guild.)</p>
      <p>To a lesser degree, the same holds true with Typographers Guilds. IMHO, certain "secrets" of the Black Art can still be learned (the wisdom of the "Typographic Eye") and experienced but only by DOING, not by reading or talking with someone about it. Get up close and personal with a private letterpress shop that does fine printing.</p>
