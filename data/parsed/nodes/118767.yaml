    <p>Hi all,</p>
    <p>I'm trying to identify this bold font found in a series of "iconic handbag" illustrations.</p>
    <p>The font, I believe, is most similar to is Brandon Grotesque, but this is a little more ornate.</p>
    <p>Any help from anyone more knowledgeable on the matter would be most appreciated.</p>
    <p>Thanks in advance!</p>
