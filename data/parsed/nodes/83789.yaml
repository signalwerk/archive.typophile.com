    <p>Good afternoon,</p>
    <p>I was curious if anyone had an opinion on computer displays...</p>
    <p>I am shopping for a new monitor, and would like something with superb color accuracy, as well as excellent, crisp, type rendering.</p>
    <p>So far, I am really liking the NEC 27" Spectraview (<a href="http://www.necdisplay.com/p/desktop-monitors/pa271w-bk-sv" title="http://www.necdisplay.com/p/desktop-monitors/pa271w-bk-sv">http://www.necdisplay.com/p/desktop-monitors/pa271w-bk-sv</a>).</p>
    <p>I have also looked at the Apple Cinema Displays, but I do not like a glossy screen.</p>
    <p>Any opinions would be greatly appreciated!</p>
    <p>Best,</p>
    <p>Justin</p>
