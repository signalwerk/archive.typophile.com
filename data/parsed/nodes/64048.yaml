      <p>@SKUMATIK, I should have been more clear.<br>
      Yes, that was all custom Illustrator work by me for my business <a class="freelinking-external" href="http://butterlabel.com">http://butterlabel.com</a>, and the site should launch officially “shortly”.</p>
      <p>The “LABEL” underneath is a massaging of <a class="freelinking-external" href="http://typophile.com/user/1043">Mark Simonson</a>’s <a class="freelinking-external" href="http://www.ms-studio.com/FontSales/mostra.html">Mostra</a> typeface, which is beautiful. This was made before he relaunched Mostra as an OpenType face. Need to upgrade.</p>
      <p>Also, Berthold’s Akzidenz Grotesk on the flip side. The Light with Oldstyle Figures is snappy.</p>
