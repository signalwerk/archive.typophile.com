      <blockquote><p>Is this what you had in mind? Or did you mean the Linotype (linecaster) Monticello differs from the ATF Oxford.</p></blockquote>
      <p>That's actually what I was thinking of.  Lawson writes</p>
      <p><cite>Rather than simply copying the original, Griffith took into consideration such factors as the heavy appearance of its lowercase ... [he] had to thicken the capitals slightly...</cite> </p>
      <p>And the samples of Linotype Monticello look rather different to my eyes, although I suppose the output from a line caster would look different from that of a hand press for other reasons besides the type itself.</p>
      <p>I'd assumed the digital Monticello was closer to the machine Monticello than to Oxford; it's rather hard to tell just by looking at images on MyFonts.  If I'm wrong then so be it.  :)</p>
