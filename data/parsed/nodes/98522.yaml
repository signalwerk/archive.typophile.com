    <p>Lawson's book has piqued my interest in this typeface, originally known as Binny &amp; Ronaldson's Roman No 1.  Does anyone know of a digital implementation?  I can't find any on MyFonts or through Google.</p>
    <p>I'm aware of Monticello but I understand that's more of a derivative (like Sabon is to Garamond) than a direct adaptation.</p>
