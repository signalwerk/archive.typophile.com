      <blockquote><p><em>Rather than simply copying the original, Griffith took into consideration such factors as the heavy appearance of its lowercase ... [he] had to thicken the capitals slightly...</em></p></blockquote>
      <p>In this, Lawson is incorrect. He either misinterpreted or misunderstood his sources.</p>
      <p>The case was in fact the opposite. Griffith chose to reduce the weight of the capitals slightly in order to get a more appropriate balance under contemporary press circumstances. </p>
      <p>As Griffith explained in an article in <em>Linotype News</em> in 1951:</p>
      <blockquote><p>“Before the Monticello project assumed tangible form, Fred Anthoensen of Portland, Maine, provided specimen pages set in Oxford type and printed on a variety of papers commonly used in commercial and book printing. These specimen pages provided the means for an analytical study of the contemporary behavior of the type in comparison with its action in the medium for which is was originally designed. It’s finer qualities [ . . . ] failed to materialize to the last degree when impressed on modern papers. On relatively smooth stock the capitals were as weighty and obtrusive as Scotch, an effect quite contrary to Binny’s intent. This, and other inconsistencies, made it clearly evident that Binny’s type could not be satisfactorily uprooted and transplanted for contemporary printing by a weight-for-weight and curve-for-curve copy of the original.”</p></blockquote>
      <p>Referencing some of the same material I just quoted, as well as drawing from correspondence, Creesy describes the situation more explicitly in his 2006 <a href="http://press.princeton.edu/Monticello/" rel="nofollow">article</a> from <em>Printing History</em> (which was linked in that other thread referred to above):</p>
      <blockquote><p>“Griffith was particularly concerned about the relative weight of the capitals and lower-case letters. He had been comparing his favorite historical example of Pica No. 1, Marshall's <em>Life of Washington</em>, with samples of Oxford set for him by Fred Anthoensen, whose Anthoensen Press in Portland, Maine [ . . . ] His theory was that Binny had to thicken the capitals because otherwise, under the conditions of early 19th-century printing – using damp rag paper, ink balls, and heavy impression under soft packing – they would look too light relative to the denser lower-case letters. But when the very same type, represented by Oxford, was printed with a modern letterpress – using smoother papers, precision form rollers, hard packing, etc. – the capitals looked too dark. Consequently, he thought he would have to restrain the capitals "just a shade" to get the desired balance.”</p></blockquote>
      <p>I encourage you to read Creesy’s entire article.</p>
