    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Akira Kobayashi</strong></p>
    <p>Akira Kobayashi was born in Japan, where he worked as a typeface designer until 2001. Since 2001, he has been the Type Director at <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>His typefaces at Linotype have included: <a href="/wiki/FF%20Clifford" class="freelinking" rel="nofollow">FF Clifford</a>, <a href="/wiki/FF%20Acanthus" class="freelinking" rel="nofollow">FF Acanthus</a>, <a href="/wiki/Conrad" class="freelinking" rel="nofollow">Conrad</a>, <a href="/wiki/Zapfino%20Extra" class="freelinking" rel="nofollow">Zapfino Extra</a> (with <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>), <a href="/wiki/Optima%20nova" class="freelinking" rel="nofollow">Optima nova</a> (with <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>),  <a href="/wiki/Palatino%20nova" class="freelinking" rel="nofollow">Palatino nova</a> (with <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>), <a href="/wiki/Palatino%20Sans" class="freelinking" rel="nofollow">Palatino Sans</a> (with <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>), and <a href="/wiki/Avenir%20Next" class="freelinking" rel="nofollow">Avenir Next</a> (with <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a>). Additionally, he designed the new <a href="http://www.linotype.com/3132/linotypeofficealliance.html" rel="nofollow">Linotype Office Alliance</a> fonts.</p>
    <p>He also has designed several typefaces for <a href="/wiki/TypeBank" class="freelinking" rel="nofollow">TypeBank</a>, <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a>, <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>, and <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>.</p>
