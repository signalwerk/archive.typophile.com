    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Akira&nbsp;Kobayashi</strong></p>
    <p>Akira Kobayashi was born in Japan, where he worked as a typeface designer until 2001. Since 2001, he has been the Type Director at <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>.</p>
    <p>His typefaces at Linotype have included: <a href="/node/31137" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Clifford</a>, <a href="/node/add/wiki?edit%5Btitle%5D=FF%20Acanthus" title="Create node &quot;FF Acanthus&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Acanthus</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Conrad" title="Create node &quot;Conrad&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Conrad</a>, <a href="/node/15613" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Zapfino Extra</a> (with <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>), <a href="/node/15686" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optima nova</a> (with <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>),  <a href="/node/16863" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino nova</a> (with <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>), <a href="/node/add/wiki?edit%5Btitle%5D=Palatino%20Sans" title="Create node &quot;Palatino Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Palatino Sans</a> (with <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>), and <a href="/node/12461" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir Next</a> (with <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a>). Additionally, he designed the new <a href="http://www.linotype.com/3132/linotypeofficealliance.html">Linotype Office Alliance</a> fonts.</p>
    <p>He also has designed several typefaces for <a href="/node/add/wiki?edit%5Btitle%5D=TypeBank" title="Create node &quot;TypeBank&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TypeBank</a>, <a href="/node/13402" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span></a>, <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a>, and <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a>.</p>
