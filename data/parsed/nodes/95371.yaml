      <p>Frank, I suspect you’re using “Brody” as generic shorthand to reference the formal experimentation of twenty odd years ago.<br>
      I don’t recall anything like Gareth Hague’s 2012 face from back then, certainly not by Neville Brody.<br>
      Sure there were some exotic boxy fonts by Kisman, Licko, di Sciullo, eboy, &amp;c., but nothing based on the concept of rotated slant.<br>
      The way that Hague has used rotation to give formal structure to a typeface complementing the wayward angularity of the Olympic logo is a brilliant concept.</p>
