      <p>I’m just being Frank.  </p>
      <p>Frankly the typeface isn’t as nicely stylized as Brody’s, but reminiscent of work he was doing thirty years ago. The 2012 London Olympic typeface is functional, and might look great for labeling an electrical box, but I find its use for the Olympics questionable. I’m not familiar with British culture, but wondering if the type design for this monumental occasion is an accurate representation of what Great Britain is all about — regimented, stiff and overly restrained. </p>
      <p>I don’t find it to be a bad typeface design, but a bad choice for the Olympics. Perhaps your article will discuss the context of this particular type design.</p>
      <p>— F.U. Finkelstein</p>
