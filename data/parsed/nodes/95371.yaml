    html: |-
      <p>Is the rotation more than a simple twist to hundreds of years of italic design? Is it really brilliant? It’s a nice twist, but just a twist, not a leap. Looking forward to Hrant’s enlightenment on this font. </p>
      <p>And I’m not using “Brody” as shorthand for anything other than Neville Brody’s heavily geometric work in the early 1980s, not necessarily boxy, but the same solid, even stroke with the same stroke proportion. To me the roots of both the logo design and typeface go back to Brody’s new wave work back then, but lacking a new millennium sense of global appeal. </p>
      <p>As I mentioned before, the type has plenty of functional qualities, but is in no way a monumental type design. I don’t see it in future text books as a Helvetica, but maybe a Hobo.</p>
    html_clean: |-
