      <p><em>Is the rotation more than a simple twist to hundreds of years of italic design? Is it really brilliant?</em></p>
      <p>In the way that it complements the logo, yes.<br>
      I say that from the perspective of wondering what I would have done had I been tasked with designing a typeface to go with the logo.<br>
      I don’t think contemplating any of Neville Brody’s type designs would have pointed in the direction of Hague’s solution.</p>
      <p>In general, the bit of history that concerns “rotated italics” does not lead directly to the 2012 face.<br>
