    html: |-
      <p>The fact that this is cast iron leads me to believe that it is genuine. Imagine the technique required to produce this if it were done with a sand form. The craftsman would use a template (a blank slate with bevels and such), and paste the letterform onto that (maybe using rolled bits of clay — tightening up forms as needed wit a quick slash of a knife). Makes it feasible that doing serifs and other refinements was out of the scope of the persons’ capabilities or even not very economical.<br>
      Master pushed into sand. Melted iron poured into that. Presto.</p>
      <p>@oldnick: Stone doesn’t come into this : )</p>
      <p>Anecdotal: sans styles have been around before serif styles…</p>
