    <p>I snapped a picture of this cast-iron grave slab (with my iphone, hence the crap quality, tried clearing it up a bit) while visiting the cathedral at Strängnäs, Sweden.</p>
    <p>There are two names and a date, all in a sort of flared, glyphic style I guess imitating stone carving, and below that text I honestly can't decipher due to the rusting. And at the very top there's another text, saying "MEMENTO MORI", in a style which, well, take a look:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fff_5144.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/jjjjjj_3963.jpg"></div><p></p>
    <p>Is this really from 1696?</p>
