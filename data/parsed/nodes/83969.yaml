    html: '<p>I have no elements to agree or disagree. What I note: it tries to keep Trajan proportions and uses old Roman abbreviation system. Memento mori is Latin for "Remember you will die". Die is "day" and after 27 the word faded probably indicates the month in Latin numerals.</p>'
