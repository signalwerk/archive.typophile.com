      <p>As for the capital letters, you might like Mark Simonson's Goldenbook <a href="http://www.myfonts.com/fonts/marksimonson/goldenbook/" title="http://www.myfonts.com/fonts/marksimonson/goldenbook/">http://www.myfonts.com/fonts/marksimonson/goldenbook/</a> which has capital letters similar in proportions to your sample and also has similar tiny serifs. It has a late 1920's flavor.<br>
      Don</p>
