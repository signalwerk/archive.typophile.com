  html: |-
    <p>Hi there. I’m working on a rebrand for a technological company which creates software solutions for mobile phones / smart phones. It’s a rapidly expanding company, at the cutting edge of this technology and I want a type family which reflects this but doesn’t look like it’s trying too hard to be trendy. I was thinking of one of Xavier Duprés’ typefaces - possibly Sanuk (I know Sony used Vista) - but I’d like to hear if anyone has any other ideas as I think Sanuk may be a bit harsh. They currently use Futura. Obviously it will have to translate across the all usual corporate literature.<br>
    Thanks<br>
    Sarah</p>
  html_clean: |-
