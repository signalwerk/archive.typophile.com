    <p>Hello-</p>
    <p>I am working on setting up an online ordering program for a printing company.<br>
    Clients will be able to typeset basic business cards (created by a designer) with the software provided by <a href="http://www.nowtg.com" title="www.nowtg.com">www.nowtg.com</a></p>
    <p>I am having an issue with providing the software company with the fonts to use.<br>
    The software uses a microsoft word type editor to input the text for the business card.</p>
    <p>I have provided several fonts for nowtg to upload to the server for the editor, however we are running into several problems.</p>
    <p>With the font Univers, there are several versions that I need uploaded. </p>
    <p>Univers Condensed Bold Oblique, Univers Condensed Bold &amp; Univers Condensed Oblique etc.<br>
    However, when I submit the fonts, the support staff is running into problems because of the "typeface name."<br>
    All of the typeface names say "Univers" and this causing the upload problems.<br>
    (see screen shots)</p>
    <p><a href="http://img.photobucket.com/albums/v346/edouble/Picture1.png" title="http://img.photobucket.com/albums/v346/edouble/Picture1.png">http://img.photobucket.com/albums/v346/edouble/Picture1.png</a><br>
    <a href="http://img.photobucket.com/albums/v346/edouble/Picture3.png" title="http://img.photobucket.com/albums/v346/edouble/Picture3.png">http://img.photobucket.com/albums/v346/edouble/Picture3.png</a><br>
    <a href="http://img.photobucket.com/albums/v346/edouble/Picture5.png" title="http://img.photobucket.com/albums/v346/edouble/Picture5.png">http://img.photobucket.com/albums/v346/edouble/Picture5.png</a></p>
    <p>Is there any way to change the typeface name??</p>
    <p>I have tried TransTypePro, FontLab and FontRenamer but I have been unsuccessful.</p>
    <p>Any advice would be highly appreciated!</p>
    <p>thank you-<br>
    Eric</p>
