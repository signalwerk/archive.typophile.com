    html: |-
      <p>At first sight it looks like the naming convention of the PostScript Type1 versions has been directly used for the (converted) TrueType fonts. One would expect that the deducted Font Subfamily names/style attributes ([TT/PS1] Full font name/FullName minus Font Family name/FamilyName) to work well with PS Type1 (if I recall well, from already Windows 3.1 on it is allowed for this format to go beyond the four styles Normal, Italic, Bold, BoldItalic) and probably also with TrueType fonts in the Adobe font engines, but not in other applications under Windows. But experts like Thomas Phinney or John Hudson should correct me if I am wrong.</p>
      <p>Renaming as such –if, of course, allowed by the copyright holder– should not be a problem and the current naming could perhaps be kept for the NameID's 1 and 2 of PlatformID 1 and for the NameID's 16 and 17 of PlatformID 3, I reckon.</p>
