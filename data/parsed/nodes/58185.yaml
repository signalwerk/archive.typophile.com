    html: |-
      <p>You’ve touched on one aspect of how we calculate it. We certainly bias it towards recent sales.</p>
      <p>However we don’t document it publicly, and I’m not going to here, principally because we reserve the right to tweak the formula as to how font popularity is exposed and utilized. It’s a tricky thing to compare the popularity of an expensive 20-weight text family that sells a handful of copies, with an inexpensive display font that sells in the hundreds per week. Yet even within a genre and a price bracket, there’s no single answer to the question of the best formula to use.</p>
      <p>I’d be interested to hear how other distributors do it, and even how foundries determine their own “bestsellers”. How much cash did this family generate this week (or other period)? How many weights have been sold? How many sales did this family play a part in? Are last month’s sales part of this font’s current popularity? If so, what about the month before last? If so, to what extent? Are the families as organized by the foundry or by the distributor the best aggregation units for popularity scores? Perhaps we should build a grid with hundreds of controls so everyone who sells a font can appear high up on some list...</p>
