  html: <p>Just wondering if anybody out there knows how the MyFonts popularity scores are calculated.  At first it seemed to be 5000 points per sale, then this changed to 5001, then later sales are 501.  Do fonts get less points per sale the longer they’ve been available?</p>
  html_clean: <p>Just wondering if anybody out there knows how the MyFonts popularity scores are calculated.  At first it seemed to be 5000 points per sale, then this changed to 5001, then later sales are 501.  Do fonts get less points per sale the longer they’ve been available?</p>
