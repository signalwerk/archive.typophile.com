      <p>While I certainly agree that under some circumstances popularity ranking systems should not be publicized in great detail as that would lead some to try and game the system to their own advantage (as I’m sure a few will try to do anyway), it’s not unfair to expect a very generalized explanation of the guiding principles of such a formula. We aren’t talking about democracy or the Academy Awards here, after all.</p>
      <p>Summarizing what L.P. said, MyFonts’ formula is biased toward recent sales, and there may be other factors. Not very detailed, but at least it’s no longer mysterious. That maybe isn’t all that a lot of people would want to know about it, but it is sufficient to assure that they aren’t pulling numbers out of their butts while still not providing enough information that someone could artificially skew the results, at least not without significant personal expense.</p>
