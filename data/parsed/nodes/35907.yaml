    <p>Hi everyone,</p>
    <p>this is my first time posting a thread but I have been keeping an eye on this site for a while now and I love it!! </p>
    <p>I am just looking for some advice really. I am about to go into 4th year of my Visual Communications degree and have been driving myself mad trying to think of a thesis topic that will both hold my attention (as I’m not a natural writer) and will be interesting for the reader.</p>
    <p>I found this quote which I liked and found interesting and thought that I could use it as a starting point for my thesis </p>
    <p>“It is no exaggeration to say that designers are engaged in nothing less than the manufacture of contemporary reality”  </p>
    <p>I’m thinking of exploring the boundaries between promoting and selling, i.e. advertising and graphic design, I would also like to look at the promotion of lifestyle through the selling of a particular product or service and the branding of the product as a whole (do we buy Coke because it tastes better or because we are conditioned to do so?) </p>
    <p>I suppose I’m just looking for a few starting points to get my ideas together and a little feed back on the idea, is the subject to big? should I think about exploring just one company and its use of branding? (Mac could be interesting?)</p>
    <p>Any ideas or suggestions will be greatly appreciated! And thank you in advance for your help!</p>
