    html: <p>Your proposed topic won’t be hard, dozens to students bring it up every year. This is a topic that has been explored ad infinitum; <em>Adbusters</em> magazine has managed to hack away on the topic for years, twice in the last fifty years liberal designers have put out a short manifesto on the subject, and just about every left-wing  publication brings up the subject on a pretty regular basis. So if you want your thesis to tread new ground, come up with something else. But if you want to retread this unending, pompous, callow critique of marketing you’ll have no trouble dredging up piles of fodder in <em>Adbusters</em>, <em>Mother Jones</em>, <em>Utne Reader</em>, <em>Metropolitan</em>, and so on.</p>
