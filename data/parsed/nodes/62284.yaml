  html: |-
    <p>Hello fine typofolks,</p>
    <p>I'm working on a wordmark for author Leif Enger. It's a clean, slender sans with an Urnes style ligature to hint at the client's Scandinavian ancestry. I'm shooting for 'dignified and literary.' The main applications will be standard business card, letterhead, etc. </p>
    <p>The forms were build from scratch, and I've been staring at them a bit too long; I'd love any advice on weight, balance, kerning, or anything other thoughts.</p>
    <p>Also, I'll likely be developing a version for web use, and I'd be grateful for any pointers to keep the lines crisp at web sizes. Thanks all!</p>
    <p>- Reed</p>
