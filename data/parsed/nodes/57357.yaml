      <p>I think the points at extrema are desirable because of hinting. </p>
      <p>But I don't think it's as important in italic, extrema aren't going to define widths as clearly. I see the same thing you do and I'm just going my merry with all those red arrows, whenever putting an extremum makes stuff look worse. </p>
      <p>Hopefully a hinting maven can enlighten us. I was encouraged by hearing Matthew Carter say he breaks the "rules" regularly.</p>
