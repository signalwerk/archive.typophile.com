  html: |-
    <p>How much headache am I causing by ignoring some of the FLS “nodes at extrema needed here” beasty red arrows in an italic typeface? With a condensed italic typeface in particular, I notice that close proximity nodes can make hinky little curve kinks when complying with the little red arrow beastie and inserting the requested node. The curves look better without it on screen and on laser prints so what the hell is the point? I understand in upright fonts where nodes align nicely for hinting but in italic, what the hell good are they?</p>
    <p>Desperately trying to remain Hinkyless in Virginia,</p>
    <p>ChrisL</p>
