    <p>Hi all,</p>
    <p>I would greatly appreciate any help on this one.  The image below is no later than 1971 or 1972.  The type looks very much like Univers 65 Bold, yet it is a bit more condensed, but not to the extreme of Univers Condensed.  It has a more rounded condensation. (I'm looking at the S and G).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/underground3.jpg"></div><p></p>
    <p>Anybody have ideas as to what this can be?</p>
