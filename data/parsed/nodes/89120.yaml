    <p>Hi guys-<br>
      Was wondering if anyone can ID the font used in the header of this website <a href="http://www.rxtrace.com" title="www.rxtrace.com">www.rxtrace.com</a> - for the word RXtrace. I also attached an image of it.</p>
    <p>I created this graphic and now I'm doing an official logo for the site, but I can't find the font on my system and from what I can tell the client doesn't want to stray too far from it, if at all.  I can't remember for the life os me what it was.</p>
    <p>any help would be greatly appreciated. Does anyone know of a similar font that would work in corporate deisgn.  I've tried looking everywhere for other similar fonts that have the exaggerated ball terminals that this one has, any suggestions along those lines would be helpful as well.</p>
    <p>thanks so much<br>
    Matt</p>
