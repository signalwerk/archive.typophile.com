      <p>According to your description I do believe that it is either a trap or an impossible mission.</p>
      <p>First of all there is no "Asian feel" for Western typography – one can do his best to harmonize two writing systems, but cannot transfer the feeling of one system simply onto another. Or, at least, he can transfer a typeface's aura to another typeface. Trying to make it "feel Asian" is either stereotypical and caricatural – China for Tian'anmen and dragon, Japan for Mt. Fuji and Sun Flag, etc. – or impossible.</p>
      <p>Second, there is a trap of using a style of Western typography from a certain period, i.e. the 1930s and the 1950s, to imitate the feeling of Western type in Asian countries at that time (these type would be similar to those that appear in old matchboxes exported to those Asian areas). But keep in mind that for many Asian countries, those days were the time of national defeat and colonialism. Trying to evoke the feeling of Western invasion and colonial rule certainly isn't something pleasant...</p>
