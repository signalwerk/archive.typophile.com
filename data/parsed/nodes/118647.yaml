      <p>Yup, good job finding out I’m from the Philippines! Baybayin, our ancient script, has long been discarded and it is no longer being used as a means of communication. We’ve been using the Latin alphabet for centuries and because of the dearth of design professionals that specialize in typographic design in my country, there isn’t really an effort to produce typefaces that are rooted in our culture (pre-colonial, colonial or contemporary).</p>
      <p>It’s pointless if I scour the web for contemporary typefaces that are authentically Filipino. That’s why I’ve resorted to looking for Latin alternatives. I may have made a mistake of using the term “pan-Asian” since I realized our culture is just too diverse and complex. </p>
      <p>I really appreciate the options riccard0 provided. They are more or less examples of what I was talking about.</p>
