      <p>An Asian city that is not currently rooted in an Asian writing system! I can understand why you cannot disclose your client, of course, but my knowledge of geography is telling me something isn't right here.</p>
      <p>They haven't switched over to the Latin alphabet in Singapore, Macao, or Hong Kong - the only Asian cities I can think of that are not integral parts of nations that are very much using Asian writing systems (China, Japan, Korea).</p>
      <p>The Philippines, Indonesia, and Malaysia... they use the Latin alphabet to various extents. But the traditional writing systems of their languages are either the Arabic script, or an Indic script, not something related to Chinese characters.</p>
      <p>Of course, an Indic script doesn't stop Tibet or Thailand from being Asian in character.</p>
      <p>My worry is that if we give you the name of a typeface that tastefully evokes in a subtle manner Chinese characters, this may be a solecism, as they may not have anything to do with the cultural identity of the city in question.</p>
      <p>And if it's "city branding" to the extent of being used in the city's subway stations, your latitude for decorative flourishes is limited by more than the dictates of taste.</p>
