    <p>Hey guys!</p>
    <p>I’m currently working on branding for an Asian city and I imagine the wordmark to have a modern, Western-friendly appeal, but with a subtle Asian warmth and sharpness to it. </p>
    <p><img src="/sites/default/files/old-images/asian-01_4472.png"></p>
    <p><img src="/sites/default/files/old-images/asian-02_6470.png"></p>
    <p><img src="/sites/default/files/old-images/asian-04_4544.png"></p>
    <p>ITC Symbol Std has caught my attention so far, but I’m really not comfortable with the varying thickness of the stems and the loops. Also, the thicker weights look nice but when it comes down to the lighter weights, the typeface looks odd.</p>
    <p><img src="/sites/default/files/old-images/asian-03_4874.png"></p>
    <p>I have also found Penumbra to be appealing although I wish it had more subtle serifs and available lowercase letters for the wordmark I’m designing.</p>
    <p>I’m not sure if you guys have encountered something like this before, but if you can help suggest alternatives, I’d be eternally grateful!</p>
