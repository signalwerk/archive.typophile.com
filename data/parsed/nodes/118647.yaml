      <p>Come to think of it, in the case of the Philippines, matters are more complicated. Babayin, the original script for the Tagalog language, is indeed Indic.</p>
      <p>Ah: only about a third of the people of the Philippines have Tagalog as their first language. Pilipino is the "standard register of Tagalog" - the country's formal official language. Oh, and there is also a Filipino language, aimed at replacing Pilipino. However, most of the people there speak, if not Tagalog, another closely-related language.</p>
      <p>But people of Chinese and Japanese descent play a significant role in the society as well. English is the Philippines' other official language, and Spanish also has an influence.</p>
