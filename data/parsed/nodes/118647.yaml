      <p>Fidel (fdpamintuan) is from the Philippines (or so it says his profile <a href="http://typophile.com/user/36837">http://typophile.com/user/36837</a>), and Filipino is written using the latin alphabet.<br>
      The right stylistic influence could be Baybayin (<a href="http://en.wikipedia.org/wiki/Baybayin">http://en.wikipedia.org/wiki/Baybayin</a>), but it probably would be at most nostalgic.<br>
      That said, there are other forms in which a typeface could give a “feel” of something without necessarily mimiking (or, as it seems the concern, parodying) a different writing system.<br>
      And, in this case that becomes a necessity, since, for me, pan-asian goes from the Urals to the Bering Strait, covering a large number of different scripts!</p>
