    html: <p>Abstract symbols taking on different meanings and connotations through variations in their physical form. Their form nonverbally affecting the meaning of something that intrinsically conveys verbal information. I guess, at some level, it's the fact that symbols convey meaning verbally and nonverbally at the same time--the duality of meaning conveyed by glyphs--often conscious verbal meaning and often unconscious nonverbal meaning, simultaneously. The fact that it is all so utilitarian and practical at the same time belies the beauty of it all.</p>
