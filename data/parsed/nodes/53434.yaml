    html: |-
      <p>LOL DEZCOM!</p>
      <p>for me, my love of typography comes from the ability to artisticly express myself through typography and calligraphy. when i practice calligraphy, i can give for to thoughts ,straight away. it's a kind of drawing art for me, abstract in a way, more relates to pure form and meaning.</p>
      <p>i also think it's a great way to contribute to the hebrew culture's development (when designing in hebrew offcourse).<br>
      letters for me have symbolic power, somehow a good form just lures you to "enter" in it and explore. letters have history. ancient letters call you to salvage them and be inspired by them.<br>
      a word can be worth about a thousand pictures (sometimes).</p>
      <p>there was a female israeli poet named Yona Wallach,<br>
      which wrote a poem about words, which i will write here in hebrew and english (adapted to english by the poet). i think this sums up my relationship with letters:</p>
      <p>Let the Words/ Yona Wallach</p>
      <p>Let the words act in you</p>
      <p>let them be free</p>
      <p>they will enter you inside</p>
      <p>making forms upon forms</p>
      <p>will form in you that experience</p>
      <p>let the words act in you</p>
      <p>they will do in you as they please</p>
      <p>remaking new forms in the thing</p>
      <p>they will make in your thing</p>
      <p>exactly the same thing</p>
      <p>for they are the thing they make</p>
      <p>you will understand that they revive</p>
      <p>for you that experience and its meaning like nature</p>
      <p>because they are nature and not an invention</p>
      <p>and not a discovery for they are yes nature</p>
      <p>they will make the thing nature in you</p>
      <p>like giving sex is life to the word</p>
      <p>let the words act in you</p>
      <p>תֵּן לַמִּלִּים/ יונה וולך</p>
      <p>תֵּן לַמִּלִּים לַעֲשׂוֹת בְּךָ<br>
      תֵּן לָהֶם הֱיֵה חֹפְשִי<br>
      אֵלּוּ תִּכָּנַסְנָה בְּךָ תָּבֹאנָה פְּנִימָה<br>
      עוֹשֵׂי צוּרוֹת עַל  צוּרוֹת<br>
      יְחוֹלְלוּ בְּךֳ אוֹתָה חֳוָיָה<br>
      תֵּן לַמִּלִים לַעֲשׂוֹת בְּךֳ<br>
      אֵלוּ תַּעֲשֶׂינָה בְּךֳ כִּרְצוֹנָן<br>
      עוֹשֶׂה צוּרוֹת מֵחָדָשׁ בַּדָּבָר<br>
      תַעֲשֶינָה בַּדָּבָר שֶלְךָ<br>
      אוֹתוֹ הַדָבָר בְּדִיוּק<br>
      כִּי הֵן דָּבָר אוֹתוֹ תַעֲשֶינָה<br>
      הָבֵן תָבִין כִּי אֵלוּ תְּחַיֶינָה<br>
      לְךָ אוֹתָה חֳוָיָה וּפֵרוּשָׁהּ כְּטֶבַע<br>
      כִּי הֵן טֶבַע וְלֹא הַמְצָאָה<br>
      וְלֹא גִלוּי כִּי כֵּן טֶבַע<br>
      תַעֲשֶינָה טֵבַע דָּבָר בְּךָ<br>
      כְּמוֹ שֶתֵּן מִין חַיִים לַמִּלָה<br>
      תֵּן לַמִּלִים לַעֲשוֹת בְּךָ</p>
