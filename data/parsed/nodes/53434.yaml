    html: |-
      <p>(Forgive me if this sounds too highfalutin; the language is more romantic than I intend but the thoughts are sincere.)</p>
      <p>Type design is<br>
      a tool for discovering entirely new possibilities<br>
      and<br>
      a tool for discovering the wisdom of the ways things have been done before. </p>
      <p>Type design is<br>
      an exercise in letting your impulses take shape<br>
      and<br>
      an exercise in growing to understand the needs of others whom your creations will serve.</p>
      <p>Type design is<br>
      a reminder that consistency requires steady effort and discipline<br>
      and<br>
      a reminder that unbending application of systematic thought leads to failure.</p>
      <p>In these ways, figuring out how to design type strikes me as a microcosm of how to approach life.</p>
