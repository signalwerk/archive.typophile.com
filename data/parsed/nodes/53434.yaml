    html: <p>The mystery and magic of letters. The strange, compelling marriage of visual beauty and meaningful language. Abstract shapes becoming meaningful, expressing every shade of joy and regret, expressing everything from the theory of relativity to "I love you"--with style. The way the wrong letter design refuses to sit happily next to others in an alphabet, and the magic of when they they are right; when they sing beautifully together, in the unique harmony of a coherent design, pouring out on the page in a kaleidoscope of words and dancing shapes.</p>
