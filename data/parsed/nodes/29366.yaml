    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Ray Cruz</strong></p>
    <p>Ray Cruz is a graphic artist, consultant and custom lettering designer. For over three decades his diversified skills have allowed him to work with advertising agencies, publishers, package design firms, branding firms and corporate clients. Designing new and custom typefaces is his favorite endeavor. Ray has received over 30 graphic and type design awards from <a href="/wiki/TDC" class="freelinking" rel="nofollow">TDC</a>, <a href="/wiki/AIGA" class="freelinking" rel="nofollow">AIGA</a>, <a href="/wiki/ADC" class="freelinking" rel="nofollow">ADC</a> and other art associations. Currently, he is an adjunct professor at <a href="/wiki/FIT%20and%20Kean%20University" class="freelinking" rel="nofollow">FIT and Kean University</a> teaching <a href="/wiki/type%20design" class="freelinking" rel="nofollow">type design</a> and drawing with <a href="/wiki/Adobe%20Illustrator" class="freelinking" rel="nofollow">Adobe Illustrator</a>. He is a member of the Type Directors Club and other art associations.</p>
