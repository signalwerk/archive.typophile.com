      <p>Thanks everyone for the comments and suggestions.  I will continue to think about the suggested typefaces.</p>
      <p>As to the designer's skills, she has done very good work on other projects, but seemed to struggle on mine.  I probably should have ejected a bit earlier, but she's young and I wanted her to get a "win" on this one (plus I know she can do some really good work).</p>
