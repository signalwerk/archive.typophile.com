      <p>I realized I never closed this out..timd had a good suggestion.  We tried a lot of typefaces and agreed on a version of Eurostile for the text.  I ended up paying the original designer about 50% more than we originally agreed on to get things finalized.</p>
      <p>I also hired another designer and asked for something more elegant (to pair with something like Fournier or Baskerville).  Despite clear direction and good understanding, he really couldn't get anything that really worked.</p>
      <p>What we've got now looks pretty decent (my original post may have been a poorly-matched size/resolution for the forum's software).  Perhaps in 5-10 years we'll have the desire to change and a healthy budget to finance it.</p>
      <p>Thanks everyone for all the input.</p>
