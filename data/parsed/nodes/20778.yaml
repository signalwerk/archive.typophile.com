      <p>cjg:<br>
      "Good suggestions above… it does look like the marque needs a few more iterations."</p>
      <p>Agreed.  It's improved from where we started, and she has sent me some variations with the lightning angled differently, but, as mentioned, I've been very patient with her and it may be time to give another person a shot.</p>
      <p>"a sans would be fine, but perhaps consider one with more variation"<br>
      That's why I came here: I was looking for a sans with more variation. With the letters I have, most of the sans faces started to look almost indistinguishable; I'll consider the suggestions and am open to more.</p>
      <p>"Also think about including a very sweepy ampersand"<br>
      I've considered this, and the ampersand has a long history of livening up dull sections of prose.  But my tentative conclusion is to search for an attractive but plain and unobtrusive ampersand that won't compete with the icon.  I want people's attention on the marque and the company name, not the ampersand, if possible.</p>
      <p>Do you know of a sweepy ampersand that won't dominate the design?  I'd like to see an example of what you had in mind.</p>
