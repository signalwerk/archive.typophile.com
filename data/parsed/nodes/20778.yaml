      <p>Thanks for the suggestions, j_polo9.  Just for accuracy, none of the logos I mentioned are from the 1980's: Herman Miller hails from the 1940s, Motorola from no later than the 1960's, Apple from the late 1970's, the Burton mark is from probably the last 2 years, and Nalgene has recently adopted something very similar: "Paul Rand with attitude" is quite the rage in some circles these days, at least as far as a nerd like me can tell.  The half-century plus between Herman Miller and Burton says something longevity of such simple designs.</p>
      <p>Again, no offense about "clip art."  It's good to get honest feedback from disinterested parties (most people, even strangers on the street "make nice”).</p>
      <p>Your point about the relative size of key and lightning is good...I want the mark to be distinguishable at a distance / small sizes / low resolution, which, with this illustration, led to a big key.  And a simply reducing the size of the key actually looked worse than this.  I do like how the angles subtly mirror the letter "K."</p>
      <p>As far as the brainstorms, the designer proposed no shortage of concepts, including many very similar to yours, some of which looked pretty good.  But we rejected them in favor of a graphical icon and distinctive, but relatively unmodified, logotype.  So we don't need more concepts, just execution, and are very close to hiring someone else to do a very different-looking variation on some of the same basic ideas.</p>
      <p>As the company name includes the word "kite," a graphic of a kite is considered superfluous.</p>
      <p>Thanks again for the help; I will try to update this as we progress.</p>
