      <p>OK - I know I'm probably gonna get slammed for this, but I have to interject.</p>
      <p>Kourtney, what did you expect? You hired a junior designer to create your identity and gave her no real direction about what you wanted your mark to do. After much talk about Paul Rand, Apple and Herman Miller logos, Bringhurst and Glyphs she's was graciously given the task of formulating some workable concepts for you. Since she's inexperienced and doesnt know better, she goes off on a whole gamut of concepts, rather than clarifying what needs to be communicated. At this point, you've probably spent a long time developing and seen hundreds of treatments, you still dont have what you want (because you dont know), and you settle for basically a wordmark and an illustration of that name. So now you've taken one of HER designs and offered it up here for an overhaul.</p>
      <p>Good design doesnt work that way. And I suspect you know that. It seems you have an appreciation for good design, but dont realize what a designer requires to achieve it. </p>
      <p>Had you given her a clear design brief, with realistic expectations, and not saddled her with famously successful work as her goal, you may have gotten a good design that was meaningful and original. Surely, a win for both of your businesses.</p>
