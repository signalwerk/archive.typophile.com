      <p>Anthony,</p>
      <p><cite>You hired a junior designer to create your identity and gave her no real direction about what you wanted your mark to do.</cite></p>
      <p>As a non-designer with no training in art, I gave her as much direction as I could.  I didn’t repeat it here because I was only looking for <strong>typeface</strong> suggestions to go with her icon.</p>
      <p><cite> After much talk about Paul Rand, Apple and Herman Miller logos, Bringhurst</cite></p>
      <p>I haven’t talked about Bringhurst or that stuff to her.  I named Rand and the famous marques to <strong>defend her work</strong> against the guy who said “clip art" (and to correct his historical errors).  As to not being specific enough, part of what I expected from a designer was to, well, design stuff.  :)</p>
      <p><cite>Since she’s inexperienced and doesnt know better, she goes off on a whole gamut of concepts, rather than clarifying what needs to be communicated.</cite></p>
      <p>She generated concepts, and I gave feedback on those approaches and bounded the design.  I considered the icon essentially finished, and only came here looking for type.  I do stand by my statement that the designer seems less obsessive about typefaces than I am (hence my presence on Typophile).  But it could just be the case with this particular project.</p>
      <p><cite>settle for basically a wordmark and an illustration of that name</cite></p>
      <p>The decision to use an icon and a prefab typeface for logotype was mine.  If you don't like that, that's my fault, not hers.</p>
      <p><cite>So now you’ve taken one of HER designs and offered it up here for an overhaul.</cite></p>
      <p>If you read my original post, I was <strong>not</strong> asking for an overhaul of the icon, but only some suggestions on <strong>typefaces</strong>.  I posted the logo (with Linear: my choice, not the designer’s) so that people could recommend appropriate typefaces for it; it was other posters who called the icon into question, and I have defended it.</p>
      <p><cite>Good design doesnt work that way. And I suspect you know that. It seems you have an appreciation for good design, but dont realize what a designer requires to achieve it.</cite></p>
      <p>Guilty as charged!  Yet where would you expect an engineer turned salesman turned entrepreneur to learn this?</p>
      <p>I have admitted that working with this designer has given us a much more concrete idea of what we need.  We were really planning to use this icon, and still may.</p>
      <p>I’ve been here defending the designer quite a bit, and in her further defense, this was kind of a low-budget project.</p>
      <p>I still think that she is very talented, and would be horrified if anyone thought less of her due to my posting here.</p>
