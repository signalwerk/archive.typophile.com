      <p>This traditional effect has been compromised by the subtleties of digital technology, misapplied.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NS2_3787.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/NS_6707.png"></div><p></p>
      <ul>
      <li><em>Above: poster's most recent version; below, my modification.</em></li>
      </ul>
      <p>Firstly, I don't like the optical alignment of column edges. It subverts the glyph metrics that have been designed into the font, and creates a soft column edge; metal-style typography should be hard.</p>
      <p>Secondly, tight spacing and kerning of small caps is wack/naff. The traditional look is for letterspaced capitals, and that includes small capitals. Furthermore, kerning small capitals creates wonky spacing--here the R_W is tight, but the W_Y is still cavernous. So in my modification, I have tracked out the small caps, and added letterspacing between Æ and R, R and W, and N and comma. Now this different parameter for small caps serves to distinguish it better from the U&amp;lc setting, and makes it the same scale as U&amp;lc: true small caps, not just shrunken capitals that are a bit beefier. Also, letterspacing of the small cap run-in harmonizes it better with the drop cap as a single word, with the letterspacing approximating the mini-gutter width between the drop cap and the three-line text indent.</p>
      <p>Thirdly, the drop cap is, like all the best typography, supposed to imply the precision of an underlying grid/matrix/armature, because it's a reassuring recognition for the viewer to know that the work has been precisely assembled. Therefore, the bounds of the drop cap should define a square that aligns with the text matter at baseline, with the column edge at left, with the top of the small caps at top (also because the implication of "caps with small caps" is tacky and to be avoided at all costs), and at right be separated from the text matter by a clearly defined margin; this is why I have aligned "Æ" with the two glyphs beneath it.</p>
      <p>And don't get me started on the Th ligature...</p>
