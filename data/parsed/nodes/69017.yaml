    html: |-
      <p>Zach, in inquiring into ornamental initials, it would appear that you are tempted to increase the register of your design, without having first mastered the basic technique.</p>
      <p>Let us conceptualize a hierarchy of drop caps, with the proviso that in every case the end result must be related to the text face, and speak the same idiom.</p>
      <ol>
      <li>The text face at an increased point size (tradition dictates 3× larger)</li>
      <li>A different weight or display cut of the text face</li>
      <li>A related face with finer detail (such as Jenson if your text face is Arno)</li>
      <li>Titling capitals, calligraphic or inscriptional (e.g., Rialto, Sistina)</li>
      <li>Inline capitals (Castellar, Smaragd, Augustea Open)</li>
      <li>Decorated capitals / Ornamental initials</li>
      <li>Rubrics, illuminated capitals (etc.)</li>
      </ol>
      <p>I have no first hand experience with the last of these. But you might look at the work of Petra Heidorn and Dieter Steffman at moorstation.org. Lanston Type Company may have something to offer (see <a href="http://p22.com" title="http://p22.com">http://p22.com</a>), and a quick hunt on MyFonts turned up the name Gilles Le Corre.</p>
      <p>Before embarking on any design, have a look at the specimens from <a class="freelinking external" href="http://www.flickr.com/photos/bookhistorian/" rel="nofollow">The History of the Book</a> (Amsterdam). Of particular interest would be their samples from <a class="freelinking external" href="http://www.flickr.com/photos/bookhistorian/collections/72157622843746612/" rel="nofollow">16th century Italy</a>.</p>
    html_clean: |-
