      <p>A few observations:</p>
      <p>You might consider picking a dedicated font for the drop caps. It need not be a display face or set of capitals <em>per se.</em> If your choice falls to Arno Pro Display for the task, you might select one of the heavier weights.</p>
      <p>Margin kerning: a character like C can hang ever so slightly in the margin; characters like T and V benefit even more from this practice.</p>
      <p>Each successive line of text should line up more or less neatly. There is sometimes a need to kern the first line closer, but the second line should come up to the bounding box of the drop cap. (In Nicola's first sample, the lines align, but the C is given too much space on the right side.)</p>
      <p>Nick is correct about lining up the tops of the caps. The small caps can sometimes be just a hair lower, but not as low as you have placed them.</p>
      <p>About the design as a whole: you have burdened your opening with the word CHAPTER in all caps followed by a rule and the chapter number. This detracts significantly from the visual impression the drop cap is trying to make.</p>
      <p>Instead, try putting CHAPTER I in small caps at the same point size as your body. Or just use the roman numeral at a display size and dispense with the word <em>chapter.</em></p>
      <p>Are your margins really that generous? If so, excellent! But move the folio down just a notch.</p>
