      <p>Zach, I dared myself to play a little with your text setting - hope you take it as a typophile's friendly cooperation and not as a sign of arrogance. In general terms, I am not a fan of the drop cap technique, but if you want to create an "old style" feeling it can work. But there are some things to manage: in the first image, I've aligned the drop cap to the left margin with the paragraph nested style, increased the kerning in the space between D and ae, and increased the tracking in the small caps of "aerwyn" (I think it needed it). The second example is similar but doesn't feature the drop cap, just small caps (with capital C) - I believe Tschichold often used to set the paragraph beginning this way (but all small caps, including C, should be preferable, in my opinion). There's the same tracking in the small caps. Finally, the paragraph with no drop cap, no small caps: in most cases, I believe this setting works the best way. As of the matter about how many words should be set in small caps, in the begininnig of a paragraph, I think you should condiser the sense of the phrase. There was a thread months ago which dealt with the matter, got to find it and link it here.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DROP_4255.jpg"></div><p></p>
    html_clean: |-
