    html: |-
      <p>Drop cap aside, I think the weakness on this page lies in the spatial relationships of text to sinkage to margins.</p>
      <p>It would be easier to evaluate in a spread, since this left-hand opener won’t occur in isolation.</p>
      <p>First of all, the presence of a running head (book title, I presume?) is unorthodox on a chapter opener. Although it may be properly centered, because it is italic and because of the excessive word space in the chapter head, it looks disturbingly off center from the text/head. Its presence also makes the placement of the chapter head look too low. I would lose the running head.</p>
      <p>And Miller Italic (transitional/modern) with Arno (oldstyle)?? Sorry; doesn’t work for me.</p>
      <p>With this sink, the proportions of your text block are almost square, which makes for a pretty static element. And it doesn’t feel well engaged with your overall page proportions and margins. I would try losing and dropping about four more lines (maybe even as much as that entire last paragraph). Then activate the sink area differently with your chapter title.</p>
      <p>The margins may be generous, but unless you’re going to be able to use a sewn binding (which I’m guessing not — fantasy books don’t generally get that kind of production), then that gutter margin looks way too tight to me. I suspect you’re going to start losing your text blocks into the binding&nbsp;—&nbsp;visually, if not literally — which is going to really mess up your classical page design.</p>
      <p>Seriously, trim your proofs and tuck them into a bound book or dummy and check how your margins work in three dimensions.</p>
      <p>Hope this is helpful perspective.</p>
