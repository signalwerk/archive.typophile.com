      <p>I don't find that satisfactory in a face where ascenders are taller than caps.<br>
      Better to align with what is immediately obvious and close at hand.</p>
      <p>This also makes the distinction between "pure" caps with small caps and caps with small caps as a variant of mixed case, observing the traditional principle of historical hierarchy where the older letter forms precede the later.</p>
