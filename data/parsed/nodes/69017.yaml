      <p>I'll second everything Kent said.</p>
      <p>Zach, a touch less margin kerning on the C will do.</p>
      <p>However, a drop cap is more difficult to justify with a spread that is far from busy. (Pun fully intended.) The chapters don't appear to have titles, so you might reconsider how to introduce them.</p>
      <p>Play with the weight and the positioning of the drop cap until it "locks" with the text block.</p>
      <p>Even of the context does not demand it, set everything up to the word "capital" in small caps. This will give a better idea of how the design will perform across multiple chapter openings. It is unusual for only the first opening word to get the small caps treatment.</p>
