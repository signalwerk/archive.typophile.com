      <p>Miss Tiffany &amp; Engelhardt,</p>
      <p>Thanks! I have made a smoother transition, mostly by going back to the original and narrowing the line through A and R, but still with a fairly thick crossline in t. The small swash at the buttom of the t is still there — it might help readability, but it also subtracts from the vertical feel of the A, R and t lines being parallel. A bit unsure about that.</p>
      <p>I’m not too keen on rotating the A though. As I see it, it doesn’t matter if the A is read as 4, just as long as you read the t as a t at most times. As the logo does owe a thing or two to tags, grafitti etc, ultimate readability is not the real goal.</p>
      <p></p><div class="imageWrap"><img src="files/artologo_05.gif"></div><p></p>
      <p>Søren Meisner</p>
