    html: |-
      <p>I’m with Jan. Let’s say it’s <strong>a</strong> fette Fraktur.<br>
      Back in the days, fonts didn’t necessarily have genuine names, but were described by their genre. Almost every foundry had some fette Fraktur. The known digitizations are based on the Stempel version, which before was distributed by C.E. Weber, which in turn goes back to the one designed by Johann Christian Bauer and released by  Joh. Peter Nees &amp; Co. Of course there are differences from version to version. If you don’t know about the origin, I doubt that you can track down – or assign – a proper name. </p>
      <p>The B and D in <a href="http://moorstation.org/typoasis/designers/steffmann/samples/f/fettehaenel.htm" rel="nofollow">Fette Haenel-Fraktur</a> are a better match. The other characters aren’t. Do you have a full alphabet?</p>
