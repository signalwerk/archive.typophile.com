      <p>Whitespace is instinctively hard to grasp (probably mostly because we're taught to mark the black, because that's what's practical) which is probably why it generally gets short shrift, but it's also possible to give it <em>too</em> much relevance (perhaps as an over-reaction to the established "injustice"). Because really, the important thing is notan: the unity and relationship of black and white. Practically speaking, this means we should ideally design their border, not one or the other. Which is easier said than done!</p>
      <p>hhp</p>
