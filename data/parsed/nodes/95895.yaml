      <p>I'm sure the maximum is not the norm (by definition) and I doubt if it can ever become the norm*; but to me it is the direction to head. It shows -or at least hints at- what our reading mechanism is capable of, and I hope we can make fonts that leverage this mechanism to its fullest. My own reasons for trying to understand reading involve virtually no academic curiosity - I want to help, on the ground.</p>
      <p>* Unless we can implement a dynamic display system where letters are enlarged in proportion to their distance from the fixation point, with saccades becoming "virtual"; we just need to figure out a way to ideally trigger a refresh (and as needed a regression) of the text displayed.</p>
      <p>In terms of regressions (which can only exist as a result of bad guesswork - any model worth its salt needs to convincingly account for guesswork) I would certainly expect that one would be more likely the longer the previous saccade, all else -most notably the experience of the reader- being equal.</p>
      <blockquote><p>wouldn't he or she need to know what the shapes delivered by crowding, that constitute the min’s representation of words look like?</p></blockquote>
      <p>Ideally yes.<br>
      But even lacking that information it should be possible to improve things based simply on the principle of bouma divergence.</p>
