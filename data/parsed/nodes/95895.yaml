      <p>Since we only read to the right of a fixation* when a saccade is long enough** to overshoot words that the fovea (even the "extended" one you guys refer to) cannot capture, then... Hey, if you want to speak of the fovea as being 20 characters big, go for it.  :-)</p>
      <p>* Hmmm, I'm starting to wonder about this... Should I?</p>
      <p>** Without triggering a subsequent fixation.</p>
      <blockquote><p>What speed is immersion</p></blockquote>
      <p>Of course it varies by individual (thanks to experience, which is gained more slowly than one might think*) but towards the top end it should be at least 500 wpm (if memory serves - I admit to having become a bit rusty on the numbers). However I actually don't believe immersion is black-and-white: after maybe around age 10 virtually everybody knows how to read immersively at least a little bit; but what might be called "deep immersion" requires pretty good conditions. Conditions that I feel are not being reproduced in labs.</p>
      <p>* For example it's been shown that grad students read faster than undergrads.</p>
      <p>Parafoveal boumas aren't more important than foveal ones, but they're not less important either. The key thing it: <em>somehow</em> they're being used; not all the time, but certainly when Distinctiveness×Context÷Blur is high enough. I think we might essentially be disagreeing on how incapacitating Blur (low fidelity + crowding) is.</p>
      <p>hhp</p>
