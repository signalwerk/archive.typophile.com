      <p>Hrant, long saccades do not contradict what Peter has written, that I can see. He says that there is enough information in the parafovea for the brain to guess that it can skip small words and still get the meaning of the sentence. And if the skip was wrong, the eye can jump back—which it does pretty often. </p>
      <p>You say that everything changes with 'immersion'. What speed is immersion, and what evidence is there of a shift in the function of the fovea? Note that the study Peter linked earlier says that when the central 11 letters are fuzzed out in a 'moving window', people can't read at all. If the parafovea in the 11-20 letter region to the right (in l-r language alphabets) were so important, I don't see why this should be so. Can you explain it under your theory?</p>
