    <p>I have often heard that typography is more about the white spaces.<br>
    I've been practicing in graphic design for around ten years and consider myself a pretty decent typographer, certainly not a typography superhero but decent. Yet I still have a hard time grasping the "white spaces" concept.<br>
    Contributions anyone?</p>
