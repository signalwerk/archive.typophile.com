      <p>[Hrant] “virtually nothing anybody has said in the past few years has made me sufficiently doubt the model that I built up in those beginning years.”</p>
      <p>Your model is based on the notion that most of the visual part of reading — what I like to call rapid automatic visual word-form resolution — happens <em>away</em> from the fixation point, and the word the fixation and visual attention is on, i.e., in parafoveal vision, away from where direct visual attention is attentionally allocated. This is monumentally counter-intuitive. Virtually everything I've read supports the widely-held notion that while visual attention and word recognition is occurring at the fixated word, some kind of ancilliary gathering of information is occurring relative to the next word to be fixated, which benefits the processing of that subsequent word once it is fixated. The bulk of rapid automatic visual word-form resolution happens inside the uncrowded span.</p>
