      <p>Average saccade distance is 7-9 characters. How frequent are those long saccades (20 characters)? And what do they tend to encompass in terms of text (short, common, contextually obvious words that are skipped?)?</p>
      <p>I've experimented with wilfully inhibiting saccades, trying to maintain a fixation and consciously examine my parafoveal perception of text. And it is <em>bloody difficult.</em> We want to read and we are trained by habit to read, and since saccades are unconscious actions they are hard to inhibit. So unless I was trying this with an eye tracker to determine whether I was successful in maintaining a fixation and not unconsciously flicking ahead, I don't think I could say whether perception of content in the parafovea was actual or the result of a sneaky saccade. I do know that I always seem to have better perception of content to the right of my fixation than to the left, which is why I suspect that I am unconsciously shifting my fixation despite my efforts to maintain it in one place. I also know that the more successful I seem to be in maintaining a fixation, the less I can perceive any meaningful content in the parafovea: crowding causes the letters to blur into each other, and I reckon one would need radically distinctive shapes in order to resolve parafovea boumas into unambiguous cues: writing systems don't provide such shapes -- could they even? given the number of linguistic entities that they need to represent --, and hence what I perceive in the parafovea often might be resolved to any number of possible letter sequences that look roughly the same in crowding.</p>
