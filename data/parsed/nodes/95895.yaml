      <blockquote><p>But isn't the 'fovea' not sharply defined physiologically?</p></blockquote>
      <p>I think it's best to base definitions on observable things, and to me the only useful definition of the fovea is derived from acuity, which is known to fall steeply beyond a certain point (preventing decipherment of individual letters). Speaking of the fovea as something more only serves to obscure the powerful role of decipherment beyond individual letters (i.e. reading boumas deep into the parafovea).</p>
      <blockquote><p>So really the issue is how many characters can be recognized.</p></blockquote>
      <p>How many <em>boumas</em> (which can be single letters in the fovea, and full words quite a distance from the fovea).</p>
      <p>Peter, just like concluding that the parafovea is totally useless because individual letters are too blurry, there must be something wrong with the mainstream interpretation of crowding. The proof is in the pudding: saccades can be long enough to blow the model you describe out of the water.</p>
      <p>hhp</p>
