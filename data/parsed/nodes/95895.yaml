      <p><em>sometimes when I'm driving out of a "blind" area I'll look straight ahead instead of continuously flicking my head left-right, ready to hit the brakes if I detect movement in the parafovea. Also, I have on occasion caught myself using the parafovea after the fact, for example when playing tennis</em></p>
      <p>Movement is, as your tennis experience shows, a whole other ball game. We are attuned to movement in the parafovea, for all sorts of good evolutionary purposes. And yes, there is evidence that some sports players are as good as they are in part because of exceptional peripheral vision (I recall a news story about Gretsky being tested in this regard).</p>
      <p>But text in the parafovea is static and crowded. So the fact that we do one kind of thing very well in the parafovea and peripheral vision -- sense movement --, is not an indicator that we do something else well.</p>
      <p><em>But the information is still there - it can't disappear</em></p>
      <p>Let me make a scholastic distinction between antecedent information and effective information. We're surrounded all the time by an immense amount of antecedent information, i.e. information that we might cognitively process, consciously or unconsciously, with the appropriate sense abilities. But we don't always have the appropriate sense abilities. For example, I have about an average sense of smell for a human being, which determines the amount of effective olfactory information I am able to glean from the vast amount of antecedent smell information that surrounds me. My dog has vastly better sense abilities when it comes to smell, though, both in terms of her physiological ability to smell more and her apparent ability to process that information.</p>
      <p>The antecedent information available in the text in our parafovea vision does not necessarily make the transition into effective information, except in the way that researchers have already been able to demonstrate: next-fixation cueing. Now it seems to me that this demonstrated use of parafoveal vision to cue the next fixation provides a likely clue as to what happens in long saccades, which is why my question about what kind of text those saccades typically cover is an important one. If such saccades tend to include multiple short and common words, then it seems very likely to me that in cueing the next fixation the brain is already guessing or assuming what those words are, and that process can be more easily explained, I think, by linguistic context than by a putative 'hidden-from-consciousness mechanism to read extremely blurry boumas' (cf Brother William's razor).</p>
      <p>Now, to give your idea its due, I am willing to accept that <em>if</em> particular short words happen to have highly distinctive blurry boumas that are not easily confusable with other blurry boumas, then that is information that could contribute to guessing the content and hence prompting a longer saccade. I also think that frequency of potentially confusable boumas being resolved to particular short words would likely be made use of in such guessing, i.e. if a particular blurry bouma turns out to be the word 'and' much more often than not, then that would encourage the reader to assume that when cueing a long saccade.</p>
      <p>The nature of crowding seems to me to strongly militate against recognition of parafoveal boumas as parts of longer words, which is why I am anticipating that longer saccades are made up of shorter words.</p>
