      <p>I don't have a great interest in bouma and parafoval recognition and these types of things because I regard myself as a display face maker, not a text face maker.  However all this talk has got me curious.  It seems to me when discussing the shapes of words that are not in the center of your vision, that mostly what counts is the outside of the letters, after all, thats what would make up a word shape--whether or not the outside of the letters were curved or straight, if they had any ascenders or descenders, etc.</p>
      <p>I'd be very interested to see how a face might do that only has the outside of the letters intact, and with insides that are all messed up and random.  I think the only problem may be with the lower case e and a, i think seeing those crossbars in the middle of the letter is very important.</p>
