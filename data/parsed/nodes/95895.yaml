      <p>The decreasing acuity of the parafovea (plus the fact that saccades <em>do</em> go way beyond the fovea) is exactly why [multi-letter] boumas exist; Kevin is probably correct that you don't need boumas in the fovea, and that's probably why they don't show up in his fovea-centric field testing.</p>
