      <p>Some say that the clinking of the glasses during a toast was meant to involve the "final/fifth sense"... hearing.<br>
      Using pens, as a first resort, has provided me with spacing skills that I would have missed out on otherwise. I find white spaces, spacing, etc. to be a lot like the rhythm and meter found in music. I find I am more interested, as I age, in the spaces/time between the notes.<br>
      Much like one's inability to pull apart a thread of music, without disrupting the flow, one must look at the paragraph in toto. One of the first books that gave me an "Aha" was a little book by Rudo Spemann, it took me a year to see the "white" but what a revelation it was.<br>
      The book by Cyrus is wonderful and augments what I have learned by doing.</p>
