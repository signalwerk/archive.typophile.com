      <p>[Hrant (re: “parafoveal boumas”)] — “[…] <em>somehow</em> they’re being used […]”</p>
      <p>Yes. I think the <em>information</em> your so-called “parafoveal boumas” provide 1) contributes directly to sense-following by supporting skipping and 2) contributes indirectly to fixation times by providing a preview benefit that facilitates a) strategic saccade planning and b) the uptake of visual information at the next fixation. </p>
      <p>The<em> information</em>, which is sometimes referred to with the terms “ensemble statistics” or “summary statistics” is known to be coarse grained, and presumed to be locally differentiated (i.e., not just about the envelope structure of the word). It is also about as resolvable in actual “word-form resolution” terms as the “metamers of moby dick” we dickered about some time ago are. See: <a href="http://typophile.com/node/92761" title="http://typophile.com/node/92761">http://typophile.com/node/92761</a></p>
