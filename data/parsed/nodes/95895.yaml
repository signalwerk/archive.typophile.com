      <p>I haven't seen a corpus of long saccades to study the saccaded text (that would be very interesting). But the simple fact that they exist is the key thing.</p>
      <p>I've tried conscious parafoveal reading myself, and you're right about the difficulty! :-)  But I do use the parafovea consciously sometimes, mostly for its superior (to the fovea) ability to detect motion: like sometimes when I'm driving out of a "blind" area I'll look straight ahead instead of continuously flicking my head left-right, ready to hit the brakes if I detect movement in the parafovea. Also, I have on occasion caught myself using the parafovea after the fact, for example when playing tennis; I have to think professional tennis players have moved this ability fully into real-time consciousness.</p>
      <blockquote><p>I do know that I always seem to have better perception of content to the right of my fixation than to the left, which is why I suspect that I am unconsciously shifting my fixation</p></blockquote>
      <p>But fixation location data does not support this perception; there is no "forward stutter" in fixation points before a big leap. So ignoring the left side is probably coming from our brain knowing it doesn't need it, and the effort is better spent on the right side.</p>
      <p>As an aside concerning directionality: Derrick de Kerckhove has co-edited a book ("The Alphabet And The Brain: The Lateralization Of Writing") which included an article by himself where he claims that leftward writing systems have inferior readability because the left halves of our retinas (which receive the right half of the visual field) are closer to the parts of the brain that read.</p>
      <blockquote><p>crowding causes the letters to blur into each other</p></blockquote>
      <p>But the information is still there - it can't disappear, so here's what I think: it's entirely possible there's a hidden-from-consciousness mechanism to read extremely blurry boumas, something we've never been consciously trained to do. This "library" would be built up in our minds without us even realizing.</p>
      <p>BTW, about the relative speed of fovea-less reading: how much time were people given to adapt to it? Since it's such a strange experience I think people could speed up a good deal with practice. Consider how long it takes for children to transition from letterwise reading to immersive reading.</p>
      <p>hhp</p>
