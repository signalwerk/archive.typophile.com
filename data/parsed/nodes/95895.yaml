      <p>The current view is that, during a fixation on a foveated word (while rapid automatic visual word-form resolution is occurring relative to that foveated word) parafoveal vision is covertly or sub-attentively gathering coarse-grained information on the next word to be fixated, and the claim is this facilitates the processing of the next word to be fixated. I think this idea is an elegant one, makes excellent intuitive sense, and is well-supported by the data on the size of the uncrowded span, and <em>average</em> saccade length.</p>
      <p>My impression Hrant, is that you under-estimate the demonstrable extent of the uncrowded span and focus on maximum saccade length, rather than the mean, or the most common saccade length — treating the maximum as the norm or what can become the norm — to come up with your ideas. I would want to know how regressions and corrective saccades factor into this estimate as well. Do they normally occur more frequently when saccades exceed the mean or most common length? What is the spread? How many saccades exceed the mean or most frequent length. How many undershoot it. Is there a cluster effect around the mean or most common saccade length?</p>
      <p>If the type designer is to design for recognizing shapes that we haven't learned to decipher consciously (because we don't have to) but can be mapped to words, wouldn't he or she need to know what the shapes delivered by crowding, that constitute the min’s representation of words look like?</p>
