      <p>And evidence of even longer saccades* clearly extends that range, because absolute certainty is not the point; if the bouma is distinctive enough, and if the context is helpful enough, you can read it very deep into the parafovea. But there's no point referring to that as an "extended fovea" - just call it what it is: the parafovea delivering content.</p>
      <p>* Exceptions are what let us see inside.</p>
