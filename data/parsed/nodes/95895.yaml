      <p>Previously you -correctly- cautioned me against relying too much on intuition (and I would note here that even the very existence of saccades is counter-intuitive). However I would actually say that virtually everything you've read (and I've read) sadly suffers from a total oblivion of intuition, which isn't some divine gift - it comes from experience with anecdotal evidence. Everybody rightly points this out all the time: the people doing typographic testing have virtually zero typographic experience.</p>
      <p>"When intuition is joined to exact research it speeds the progress of exact research."<br>
      – Paul Klee</p>
      <p>All those studies crumble in credibility when you try to factor in the simple existence of very long saccades. So why are all these scientists failing? I've opined this before: their tests suck at getting people truly immersed. When you're not immersed, yes, the fovea is king. But when you <em>are</em> immersed, the fovea is nothing that special.</p>
      <p>hhp</p>
