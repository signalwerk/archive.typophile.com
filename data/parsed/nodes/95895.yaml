      <p>The three qualities of positive mark which types may possess are:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Hamburg_5853.png"></div><br>
      One-dimensional: line with no thickness, with an equivalence between letter as line and letter as counter.<br>
      Two-dimensional: line as area, emphasizing the graphic ﬂatness of the surface upon which the mark rests.<br>
      Three-dimensional: complex shapes suggesting natural objects with depth, and/or a depth to the substrate.<p></p>
      <p>Counter shapes and spaces between letters have a different relationship with each of these, and consequently with the document surface as a whole, of which they are putatively a part.</p>
