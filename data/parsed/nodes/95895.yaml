      <p>re: the parafovea /  [not] <em>delivering</em> much <em>semantic information to the brain</em>.</p>
      <p>The parafovea delivers <em>visual information</em> to the visual cortex. The deeper you go into the parafovea, that coarser the resolution capabilities of the parafovea are. Critical details of the role-unit components of letter forms (bowl / stem / counter) get lost or scrambled. Beyond a certain point, and up to about 15 character spaces, only “ensemble statistics” or “summary statistics”, that are sufficient for the guidance of eye movements, but insufficient for unambiguous word-recognition are available. Still, in the near parafovea the resolution capabilities are often sufficient for the visual system to predict and confirm correctly the identity of short contextually expected words like ‘the’ and ‘in’ and ‘at’ without having to attend to them specifically. Except in [to clarify: with the exception of] these cases, fixational attention is required for identification to occur. Also, in the near parafoveal, just beyond the reach of foveal vision, there can be what is called “eccentric enhancement” of what strictly speaking falls in the near parafovea just outside the actual fovea. This has the effect of enlarging the “uncrowded span” to the point where 5 to 8 letter words are fully accessible in a single fixation to parallel processing.</p>
    html_clean: |-
