      “Chung et al. (1998) found a 4.4-fold reduction in maximum reading speed at 15° eccentricity compared with central vision.”</p>
      <p>The findings of the paper “are consistent with the following interpretation. When text is presented in peripheral vision, the visual span gets narrower; the reader recognizes fewer letters per fixation. As a consequence, the reader saccades through the text in smaller steps with a corresponding reduction in reading speed. In effect, the capacity of normal vision to process several letters in parallel deteriorates in peripheral vision. According to this interpretation, a fundamental limit to reading in peripheral vision is the reduction in the size of the visual span. This may explain the reading deficits commonly observed in people with central scotomas.”</p>
      <p>You can also try and sort through the links that come up when you google “reading without a fovea.”</p>
