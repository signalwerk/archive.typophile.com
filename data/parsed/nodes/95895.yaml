      <p>Hrant, if your going to help people on the ground with an understanding of reading that can stand up, you need to take the time to deal with the empirical studies. The eye movement research hasn’t really taken full account of the crowding findings yet (which come from perceptual psychophysics), and crowding studies haven’t so far addressed the additional complications involved in assessing the parafoveal preview benefit (a concept that comes from the eye movement in reading studies). </p>
      <p>The parafoveal crowding and ensemble statistics findings come from tests using sidelong attention and involve no time constraints. Parafoveal pre-processing happens sub-attentively, and has a one-quarter second or so time constraint. Grouping and configural effects also modulate crowding, so an adequate theory of parafoveal pre-processing that can address issues in type design will need to take all this into account.</p>
