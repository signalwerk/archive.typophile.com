      <p>Hrant, the periodicity, moving horizontally across the word or lines of text, that Bill is referring to in his post above, is what I have been calling ‘narrow phase alignment.’ Perfect phase alignment is like a grating, and gives rise to a picket-fence effect in type. In a sense, the periodicity <em>is</em> an illusion, but the narrow phase alignment around a periodic mean is a fact, documentable with Fourier Transforms. </p>
      <p>I think of narrow phase alignment as relating to the black.</p>
      <p>The whites to me are a bit of a different story. I think good notan requires that the whites inside and between letters are all “in synch.” What that means specifically in terms of individual letters is difficult to describe, because, for example the o and the bowls of d / p / q / b have a circular expressedness, while n / h / u have a predominantly oblong or rectangular expressedness, and the a / e / s / z have a distrubed expressedness. So there must be a deviation from perfect equivalence to approximate a kind of optical cohesion. </p>
      <p>The narrow phase alignment in the blacks and the optical cohesion in the whites hold the word together in gestalt terms as an internally well-composed visual unit.</p>
      <p>You might insist there is no rhythm in text face design, but if you deny that the narrow phase alignment exists you are just wrong, and if you deny that it is important for easy word-recognition, you are telling me you are out of touch with what happens in the visual cortex during a fixation. In reading alphanumerical symbols, the visual system uses spatially frequency channels tuned to statistical regularities in the stimulus.</p>
      <p>This has yet to be shown empirically, but I think it will eventually become evident to researchers looking at reading, that both the narrow phase alignment of the blacks and the rhythmic cohesion of the whites are critical for the rapid automatic visual word-form resolution that underlies reading.</p>
