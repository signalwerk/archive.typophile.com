      <p>Ok, I'm confused. I just started reading the Legge et al paper and they say that Rayner and Bertera (1979) used an eye tracking method to mask letters. "When the mask covered the seven central letters, reading speed was very low, about 12 words/min. When the mask covered 11 letters, reading was essentially impossible."</p>
