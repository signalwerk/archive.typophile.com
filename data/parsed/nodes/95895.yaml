    html: <p>Thanks for the correction Peter. But isn't the 'fovea' not sharply defined physiologically? So really the issue is how many characters can be recognized. The slowing of reading to less than a quarter of normal at 15+ degrees is really interesting. Actually I'm surprised you can be that fast with the middle 15% blotted out. According to <a class="freelinking external" href="http://en.wikipedia.org/wiki/Fovea_centralis" rel="nofollow">this article on the Fovea</a>, the fovea only covers 2 degrees. If we can see enough in the flanking 6 or 7 degrees to read even a quarter the speed, then I think that Hrant must be right that quite a bit of information is got up to the 20 letters of the biggest saccade. If the fovea is 2 degrees, and gets you sharply 4-5 letters, then an additional 6 degrees would span an additional 9 or 10 letters. So the those letters may not be so clear, if you can read with them, even slowly—and probably more quickly than at 15 degrees—that's very significant. I'm getting more converted to Hrant's view on the importance of the parafovea from this information. Peter, is there something I'm not getting in your view, or do you agree?</p>
