      <p>Legge and Pelli have shown the the issue is how wide the “uncrowded span” is. Pelli claims this varies from individual to individual, with a range from 5 to 9 characters, and that isolating sections of text from the background text using an eye-tracker can maximize this.</p>
      <p>Most eye movement scientists have concluded that the information in the parafovea to the right side of the fixated word, when it contains new words, sets up the following saccade and provides some visual information about the upcoming words which goes beyond just the word’s length and boundaries, but, because the uptake there is sub-attentive, doesn't lead to actual full visual word form resolution to the point at which word identification can occur. </p>
      <p>The information in this area is subject to heavy crowding, and provides what is termed a “parafoveal preview benefit.” The parafoveal preview benefit speeds up next-word recognition, but doesn’t replace a fixation to it. The effect is similar to priming.</p>
      <p>What the visual information is that is provided in parafoveal preview is unclear and controversial. Perceptual psychophysicists, who emphasize crowding use the term “ensemble statistics” or “summary statistics” to describe it, and have used scrambled letter ‘mongrels’ to help us visualize it. The people who study eye movement say some letter-level information is gathered. Herman Bouma used terms like circular or rectangular expressedness, and sidedness at the stoke and letter level to describe what can be gathered from the near parafovea.</p>
      <p>I think “ensemble statistics” or “summary statistics” are terms that suggest the information is averaged across a word, which I don’t think is accurate. I've suggested to Pelli that a term like “jumble statistics” be used.</p>
