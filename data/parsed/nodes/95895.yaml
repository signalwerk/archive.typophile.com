      <p>By the way, I think it is plausible that robust deep-parafoveal <em>predictions</em> about word-identity <em>are</em> selectively made on the basis of semantic context and lexical expectation, relative to the new ensemble of summary statistics encountered in a specific parafoveal preview event. But in these cases accurate sense following requires confirmation and confirmation requires fixation on the word, rather than skipping. If efficient processing of the blacks and whites in parallel is the issue here, the relevance of phase alignment in the blacks, and rhythmic cohesion in the whites is again key)</p>
      <p>The frequency of this depend on the “given” versus “new” (to the text – not the reader) status of the words in the text at hand.</p>
      <p>Providing informative summary statistics (hpp: boumas) is a design challenge here, and the relationship of providing informative summary statistics to meeting the constraints governing efficient processing during a fixation is what needs investigation. Probably there are countervailing pressures here and the solution is a balancing act.</p>
