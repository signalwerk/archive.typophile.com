    html: <p>No, Hrant, I am not going to stop using words in the way that the majority of people discussing type use them just to accommodate your idiosyncratic insistence. 'Flow' isn't intrinsic to rhythm -- especially not to visual rhythm --, and replacing rhythm with 'pattern' doesn't doesn't improve understanding at all, because it immediately prompts the question 'What kind of pattern?' To which the answer is 'A rhythmic pattern'. What is intrinsic to all notions of rhythm is <em>regular recurrence,</em> and that is what one sees in the narrows phase alignment of stems in Latin text.</p>
