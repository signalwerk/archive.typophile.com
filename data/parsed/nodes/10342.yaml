  html: '<p>I know this <span class="caps">HAS</span> to be a “stupid” question, but here goes: How do I correct path directions? <br><br>More speciﬁcally, let’s say I duplicate part of a glyph and ﬂip it horizontally. I now want to place the two pieces together, but when they overlap, they cut one another out. In Fontographer, you’d just select the whole “negative” area and reverse the paths to get it to work — but doing that in Fontlab doesn’t do anything at all. <br><br>What am I doing wrong? <br><br><span class="caps">TIA</span>, <br>Maury</p>'
  html_clean: '<p>I know this <span class="caps">HAS</span> to be a “stupid” question, but here goes: How do I correct path directions? <br><br>More speciﬁcally, let’s say I duplicate part of a glyph and ﬂip it horizontally. I now want to place the two pieces together, but when they overlap, they cut one another out. In Fontographer, you’d just select the whole “negative” area and reverse the paths to get it to work — but doing that in Fontlab doesn’t do anything at all. <br><br>What am I doing wrong? <br><br><span class="caps">TIA</span>, <br>Maury</p>'
