    html: "<p>there are three actions wich reverse contours somehow <br> <br>one is: tools -&gt; operations -&gt; reverse contours another is: tools -&gt; outline -&gt; reverse all contours wich both reverse ALL the contours in the glyph and just reverse your problem :| <br> <br>the this should be the one you need: don't select a contour in your glyph, just right-click on one of the nodes of the outline you want to revert and choose &gt;revert contour&lt; you see, the missing of the magic little s in the end does the job ;)</p>"
