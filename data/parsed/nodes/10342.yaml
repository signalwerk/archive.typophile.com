    <p>I know this HAS to be a "stupid" question, but here goes: How do I correct path directions? <br> <br>More specifically, let's say I duplicate part of a glyph and flip it horizontally. I now want to place the two pieces together, but when they overlap, they cut one another out. In Fontographer, you'd just select the whole "negative" area and reverse the paths to get it to work -- but doing that in Fontlab doesn't do anything at all. <br> <br>What am I doing wrong? <br> <br>TIA, <br>Maury</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/10431" class="topic-previous" title="Go to previous forum topic">‹ Illustrating OpenType Substitutions for Users</a> <a href="/node/10315" class="topic-next" title="Go to next forum topic">Class spacing/metrics in Fontlab ›</a></div>
