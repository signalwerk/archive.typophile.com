      <p>“I don’t see a need to either return to older forms or adopt Latin script as the Czechs have done.”</p>
      <p>Abandoning it is certainly not an option, it would be a chore, and simply drown in ugly diacritics. The current alphabet is quite nifty in replicating the phonetic language with it’s one letter per sound routine, so it has to stay. Nor, is it prudent to subject the folks to learn a whole new glyph forms (the number of people who read books is falling already.) But letter styles do evolve over time, and I feel there is still some room for Cyrillic to grow. I am merely trying to imagine a possible direction for that growth.</p>
