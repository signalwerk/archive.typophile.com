      <p>The discussion is quite sporadic and unofficial. Held mostly on LifeJournal, in different designer <a class="freelinking-external" href="https://web.archive.org/web/20080706222235/http://eldesign.ru/sreda/2007/0131/">articles</a> and occasionally referenced in  <a class="freelinking-external" href="https://web.archive.org/web/20080706222235/http://www.artlebedev.com/everything/izdal/kniga_pro_bykvy/">books</a>.</p>
      <p>The basic argument, is that the only way to really match the perfection of Latin forms, is to adopt Latin. Alternatively, the letters should move away in it’s own direction, and develop a unique aesthetic. Otherwise, it is often feared, that Cyrillic might remain second-best. This is certainly speculative and non-realistic, and there are neither the means nor the will to attempts these reforms. After all, some of us still lament the loss of ѣ (among others).</p>
      <p>I am merely trying to decide, what would hypothetically constitute the best course of action in an ideal world.</p>
