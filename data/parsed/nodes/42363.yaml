      <p>As quirky as Cyrillic is now and as laborious it is to kern, I don’t see a need to either return to older forms or adopt Latin script as the Czechs have done. Three hundred years of use has made it pretty ingrained by now and why confuse all current users even more. It isn’t an issue of whether Latin or Greek or Korean script is better, people just will resist change as readers.<br>
      For me, Cyrillic has its own charm and should be kept. I like the way it looks even if it is more difficult to design than Latin. That is the type designers problem and we can deal with it. Let’s not make it the reader’s problem just so we can tidy it up and save ourselves some work.</p>
      <p>ChrisL</p>
