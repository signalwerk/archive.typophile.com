      <p><em>the perfection of the Latin form</em></p>
      <p>? The Latin script is not without problems.</p>
      <p>Sequences with vertical stems are dodgy: so you can get some words, like, er, Cyrillic, which go all op art in the middle, and loosey-goosey elsewhere, I mean, just how much kerning should there be in C-y?</p>
      <p>And in many genres, (especially bold and condensed) diagonal lines are awkward—not a problem for Cyrillic!<br>
      As an aside, don’t those Constructivist-era posters look great with all their bold condensed rectilinear letterforms!</p>
      <p>Also, Latin scripts require much more kerning than Cyrillic (or Greek), on account of the diagonals.<br>
      (Although Ge and Che, and Gamma, can be nasty.) </p>
      <p>I would say Cyrillic type designers should continue to be inventive in adapting what they have, just as Latin type designers have added a tail to lower case “l” and “i”, in sans fonts, and employed the italic (monocular) form of “g” in types like Helvetica.</p>
      <p>Recently, Greek type designers, with the “flipped h” form of lambda, have innovated to address the question of “problematic diagonals”.<br>
      I believe this was the same impetus that, over time, caused the triangular Cyrillic “De” to evolve to its present squarish shape.</p>
      <p>The role of the gatekeepers (Maxim and Gerry, you know I’m talkin’ bout you!) in recent years has been interesting — it’s led to a lot of Cyrillic fonts produced by Western foundries, types that are “correct” but extremely conservative.</p>
      <p>Alphabet reform has always been protracted and political, and given the vast number of players today, looks to be evoltionary from now on, rather than decisive.</p>
      <p>***</p>
      <p>If you are holding out the Latin form as being *better* than Cyrillic, take a look at the Bulgarian initiative — IMO, and as someone who has designed both serif and sans fonts to the Bulgarian spec, this Latinized Cyrillic is far from ideal, too “blobby”.</p>
      <p>Of the various Cyrillic languages, Russian is the one with the fewest ascenders, descenders, and floating diacritics.<br>
      If Latin script is held out as exemplary, Bosnian and Serbian produce much better-looking continuous “normal” text than Russian.</p>
      <p>In fact, this seems to be more of an issue with Russian, rather than Cyrillic per se.</p>
