      <p>Looking at the glyphs you can quickly get a basic idea though. Obviously it cannot help but be naive if you are not a reader/speaker; but on the other hand I think if you have an eye you can start to see things. Optical issues are optical issues.</p>
      <p>I will have to see the “pseudo-Renaissance” - that sounds interesting/fun/funny.</p>
      <p>This is perhaps an especially silly idea but I wonder if the constructed/techy/wipeout/designers republic approach to latin might better be used with Cyrilic. </p>
      <p>Perhaps even more silly, I also what a Chinese/ Japanese approach would yield if only because Chinese as it began was almost geometric and certainly mono-line. And it was a bit unlovely IMHO. The brush forms work way better because the tell tale features of the tool offer, as Peter Enneson might say: ’salient features’.</p>
