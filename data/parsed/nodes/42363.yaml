      <p><em>Optical issues are optical issues.</em></p>
      <p>Yes, and getting relative proportion and weight right in Cyrillic is more demanding than in Latin because of the repetition of similar but not identical shapes. But the biggest problem that designers have when they start working with an unfamiliar script is lack of understanding of idioms. They see various shapes in various typefaces, and they quickly assume that these represent permissable or available forms without understanding their specific contexts. So they mix and match forms from different idioms. Imagine a designer with no prior experience working with the Latin script looking at specimens and deciding that he likes the shape of the y in Bodoni, and the shape of the a in Granjon and the little flourish on the p in Gill Sans Italic, and then incorporating these shapes or details into a single typeface, not understanding that they are particular to certain styles or idioms of the Latin script.</p>
      <p>Of the many things I have learned from working with Maxim over the past decade, the most important has been this: to see and understand the idioms of Cyrillic type. And the benefit I have drawn from this is confidence in making design decisions.</p>
