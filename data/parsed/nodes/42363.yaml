      <p>The trouble with the idea of ’going back to the scribal roots’ of Cyrillic, if one of the concerns with the modern script is the similarity of miniscules to majuscules, is that the reason for that similarity <em>is</em> the scribal tradition. Prior to the Petrine reform, the Cyrillic script was essentially unicameral or uncial, with very little case differentiation per se, only letters written larger or smaller depending on context. The process by which the Latin and Greek scripts developed bicameral alphabets never really happened in Cyrillic prior to the typographic period. What is that process? It is the gradual development of a relatively quickly written formal uncial that becomes the miniscule to a re-imported classical style that becomes the majuscule. And the context of the process is scribal book production. If you look for the parallel Cyrillic context, you find small and large letters both derived from the same uncial forms: the process has not had time to evolve a more independent formal miniscule, and there is no convenient classical style to provide a model for distinct majuscules.</p>
      <p>Post-Petrine Cyrillic handwriting, on the other hand, has developed greater distinction between miniscules and majuscules, so might suggest a new directions in text type design. However, many of these distinctions are evolved from cursive speed, i.e. they are essentially ’italic’, and existing attempts to adapt them to upright forms look awkward to me.</p>
