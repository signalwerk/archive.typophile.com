    <p>There is a discussion going on between Russian type designers over the future of Cyrillics. The main question, is weather the alphabet should continue on it’s 300 year journey of forced latinization (launched by Peter I) which so far has failed to produce a result comparable to the perfection of the Latin form, or step back to it’s scribal roots and branch off in a fit of free-form evolution to become it’s own thing. The problem, is that there simply isn’t enought variety between the letterforms right now, with miniscules being near copies of majuscules, and letters like ШЩЧЦ sticking out like sharpened rakes. What do you guys think?</p>
