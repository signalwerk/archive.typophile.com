      <p>This looks very promising. The characters “y”, “x” and “z” need a lot of work, as you yourself point out. I also think that the style of the “k”, although it looks good by itself, looks too different to the other characters. It looks too narrow, somehow.</p>
      <p>And is it just me, or does the “o” look more upright than the other characters?</p>
      <p>But all in all this is a lovely beginning, and I look forward to seeing the font with capitals.</p>
