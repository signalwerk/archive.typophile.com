  - id: 351814
    user: 36067
    date: 2009-06-14T23:28:00
    date_raw: 14 Jun 2009 — 11:28pm
    votes: null
    html: |-
      <p>Good morning (or evening) and thank you for your good pointers!</p>
      <p>I should concentrate on my "horrible glyphs" (i do them last because they seem to be the most annoying and difficult ones to make, eh. Also as a native Finnish we don't really use letters "z" and "x" in our language so maybe my eye is not used to the shapes of those letters).</p>
      <p>It's true Arild, that the "k" might be too different from the other characters, so I should do some modifications. I do like the style of it so maybe I should try to just fix the proportions to go more with the fellow characters. Now when I look at it, it might have bigger contrast than the other characters, have to check it... I'm also going to check the "o" and "v" too like you two pointed out that there's something to work on.</p>
      <p>––<br>
      I forgot to tell about the background of this font. This typeface is my final thesis of my studies (I'm not a student of typography so I've kind of had to figure out things on my own and because of that there might be some really elementary mistakes in my design). The first part of the project was to go to Spain (north part of Spain) to shoot and examine some street typography. I was inspired by the boat typography I found from the tiny fishing villages. In "el capitano", I'm trying to capture the spirit of the little wooden colorful boats and the custom hand painted names and numbers on them.<br>
      ––</p>
      <p>Thanks for your opinions, keep it coming because it really makes me see the things!</p>
      <p>I'm horrified about the capitals because they seem to be super hard to make and I have huge problems to make them fit to the kind of roundy style of the lowercase. Oh well, back to the work!</p>
