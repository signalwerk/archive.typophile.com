    <p>Hi all, I'm a graphic design student and this is my first try to design a font. This typeface is my school project that I've been working on now for a while. Since it's my first typeface I wanted it to be a display font. Here's a rough sample .pdf what I have now (i haven't done any capitals yet).</p>
    <p>Apologies for the glyphs "y" "x" and "z", they look horrible. The question mark is also a bit weird and squarish... </p>
    <p>(Note: I haven't payed too much attention to the kerning yet.)</p>
    <p>Anyhow, all the critique is more than welcome, I really need it!</p>
