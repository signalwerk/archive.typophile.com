      <p>I actually think the u and the v are okay, but I'm a fan of that style so...take my opinion as...opinion :)</p>
      <p>For the y, try using the same stroke as in the v.  Arild: the o also looks upright to me.  I can't tell which yet but the pq looks a bit odd.  Like the p droops too much or the q is suckin' its stomach in. But looking on their other side they seem to match up so, maybe look into that see if they connect to their stems where they really need to.</p>
