      <p><em>There can't be a right and wrong, surely, just a better or worse?</em></p>
      <p>Not even that.<br>
      It's a question of standards and conventions.<br>
      For instance in many graphic genres it is customary to omit accents on capitals, eg sports kit:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sweater_3544.png"></div><p></p>
      <p>For display caps, I've seen settings where typographers have made up and manually inserted very small accents.<br>
      I'm working on a display font with very small cap accents at the moment, but am making it up as I go along, as I'm not aware of any precedent. Which display fonts have very small accents?</p>
