    html: |-
      <p><cite>Is a missing diacritic considered to be a spelling mistake?</cite></p>
      <p>It depends on a lot of factors. And, as Nick pointed out, conventions.<br>
      For example, in Italian all caps settings, was/is customary to replace accents with apostrophes, but never to omit them. This is eased by the fact that accents happen only at the end of words and that there are several common words distinguished only by one accent. One glaring example is the difference between "e", which means "and", and "è", which means "is".</p>
    html_clean: |-
