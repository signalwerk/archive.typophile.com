      <p>For instance in many graphic genres it is customary to omit accents on capitals, eg sports kit</p>
      <p>This is customary only in U.S., in the Czech Republic, spelling HASEK is not proper (cf. HAŠEK). The only case for omitting accents while writing in capital I know, are grave, acute and circumflex in french – and it does not work with cedilla. In eastern european languages is it not possible (though there are some cases in romanian)</p>
