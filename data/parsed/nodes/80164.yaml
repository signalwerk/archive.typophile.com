      <p>&gt;For instance in many graphic genres it is customary to omit accents on capitals</p>
      <p>I've been watching this change here in Quebec over the past few years. Twenty years ago, omitting the capital accents was considered normal, but as computer technology made the lapse more a question of lazyness and not technical expediency- using accents with capitals has become more and more de rigueur.</p>
