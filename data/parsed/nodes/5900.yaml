    html: "<p>Oh yeah - I had major childhood trauma concerning the \"a\": <br><a href=\"https://listserv.heanet.ie/cgi-bin/wa?A2=ind9910&amp;L=typo-l&amp;P=R1336&amp;I=-3\" target=\"_blank\">https://listserv.heanet.ie/cgi-bin/wa?A2=ind9910&amp;L=typo-l&amp;P=R1336&amp;I=-3</a> <br> <br>Mixing: <br>The various combos are pretty common, except for having a mono \"a\" but a bi \"g\" - that seems very rare. <br>What's \"correct\"? Depends. But generally bi-s are like spinach: funny taste, but good for you. <br> <br>Germans: <br>May god help them: <a href=\"http://news.bbc.co.uk/2/hi/europe/3943507.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/europe/3943507.stm</a> <br> <br>hhp <br></p>"
    html_clean: "<p>Oh yeah - I had major childhood trauma concerning the \"a\": <br><a href=\"https://listserv.heanet.ie/cgi-bin/wa?A2=ind9910&amp;L=typo-l&amp;P=R1336&amp;I=-3\" target=\"_blank\" class=\"link-external\">https://listserv.heanet.ie/cgi-bin/wa?A2=ind9910&amp;L=typo-l&amp;P=R1336&amp;I=-3</a> <br> <br>Mixing: <br>The various combos are pretty common, except for having a mono \"a\" but a bi \"g\" - that seems very rare. <br>What's \"correct\"? Depends. But generally bi-s are like spinach: funny taste, but good for you. <br> <br>Germans: <br>May god help them: <a href=\"http://news.bbc.co.uk/2/hi/europe/3943507.stm\" target=\"_blank\" class=\"link-external\">http://news.bbc.co.uk/2/hi/europe/3943507.stm</a> <br> <br>hhp <br></p>"
