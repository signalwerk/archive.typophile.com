    html: <p>1) I remember loosely that I thought of printed letters as doing things that handwriting couldn't and shouldn't. It (the bi-level 'a' and 'g') just seemed like another weird no-reason rule of Life that I needed to know and not question. I was a very passive kid. However, it did seem to make a little sense, since I remember thinking the same thing about serifs.</p>
