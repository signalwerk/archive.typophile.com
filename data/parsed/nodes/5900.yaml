  html: "<p>Anybody have strong opinions/terrifying childhood memories of lowercase a and g? <br> <br>1) Were you confused the first time you noticed that your schoolbooks used the \"double-decker\" type, while your teacher harped on you about \"not worrying about it\" and focusing on the single-story versions in your handwriting? <br> <br>2) In Sans faces:  should the two forms ever be mixed (double-decker a with single-story g, or vice-versa)?  (This one's serious.) <br> <br>3) Do the Germans have it right?  (Or are they just heavily laden with Besessenheitmitvollkommengeometrischgestalt?)</p>"
  html_clean: "<p>Anybody have strong opinions/terrifying childhood memories of lowercase a and g? <br> <br>1) Were you confused the first time you noticed that your schoolbooks used the \"double-decker\" type, while your teacher harped on you about \"not worrying about it\" and focusing on the single-story versions in your handwriting? <br> <br>2) In Sans faces:  should the two forms ever be mixed (double-decker a with single-story g, or vice-versa)?  (This one's serious.) <br> <br>3) Do the Germans have it right?  (Or are they just heavily laden with Besessenheitmitvollkommengeometrischgestalt?)</p>"
