    html: "<p>1. No. I have no memory at all of my first consciousness of the difference between the single- and double-storey a and g. I have no memory of ever having a problem with the distinction. However, I learned to read quite late (around seven years old), and I suspect most of the books I competently read first used the double-storey versions. By the way, there's something to be said for learning to read after one has developed a reasonable vocabulary: one gets to start with much more interesting books. <br> <br>2. Yes. I think there are very few non-italic typefaces in which the single-storey a looks good, while the either version of the g can be used much more liberally. Frutiger is a good example of a typeface that very successfully matches the double-storey a with the single-storey g, but there are very many others.</p>"
