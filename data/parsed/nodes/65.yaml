    <p>&gt; Dear friends: <br>&gt;  <br>&gt; We are glad to announce a new version of tipografia.cl, that appears at the same time that a very good new: On march, 25th, our friend and collaborator Francsico Gálvez won the Altazor Award in Graphic design for his Elemental typeface. <br>An important prize for Pancho, to his talent and efforts; and a reaffirmation that the typography is occuping a relavant place in Chilean Design. <br>Tipografia.cl brings great news. We introduce three new projects: <br> - Menu, a face based in vernacular chilean lettering, developed by Moisés Arancibia. <br>- Fundamental, an awesome work from Miguel Hernández, Chillán based designer, whom translates to bitmap the Galvez's Elemental face. <br>- The family TCL IndoSans from Rodrigo Ramírez. Tuco was very busy on summer developing weights and inclination variants for his first text face, and introduces this new (and corrected) family. We invite to join participating in this launching, downloading the family and <br>sending us your work. <br>  <br>&gt; But this is not all: <br>We start with the introduction of TallerTCL (TCLWorkshop), a section for people interested in got deep into type design. <br> Also, we have two Argentina's friends unvaluable cooperation in this edition. Natalia Fernández (teacher at Buenos Aires University), who gived to us a collect info about her share in a latin typographic expo. This <br>expo is part in a bigger continental encounter developed last november in Buenos Aires. <br>And Javier Alcaraz article, who found a interesting street communication project in "Misiones" (north side of Argentina)  <br> <br>And to finish, the announcement of the first Typography Diplomma in Chile (and Latin America), starting from May, 2002. An instance to learn, to join and think. <br>  <br>&gt; So, you are invited to navigate and enjoy this upgrade. Send us your comments. <br>  <br>&gt; <a href="http://www.tipografia.cl" target="_top">http://www.tipografia.cl</a></p>
