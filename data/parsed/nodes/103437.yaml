    <p>So what happened?<br>
    On the surface, nothing that would ordinarily send anyone’s hearts racing. There was a regional meeting of STRIPE, a group dedicated to Strengthening the Right to Information for People and the Environment. The attendees, who hailed from China, Indonesia, Japan, Mongolia, the Philippines, and Thailand included representatives from civil society organizations, academia, governments, and international organizations.</p>
