      <p>4) It’s called <em>Georgia</em>, one of the screen-optimised Windows fonts you get with the OS or with a MS application like Office, that’s why Mac-Folks can see that also.</p>
      <p>&gt;3) The font used on this PDF.<br>
      Download the PDF, check File/Properties/Fonts, normally you get there all infos about the embedded fonts.</p>
