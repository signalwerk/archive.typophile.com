    <p>1) The font used for the quote on this page:<br>
    <a href="http://www.barackobama.com/issues/iraq/" title="http://www.barackobama.com/issues/iraq/">http://www.barackobama.com/issues/iraq/</a></p>
    <p>2) The font used in this image, from the Cloverfield teaser trailer:<br>
    <a href="http://img301.imageshack.us/img301/1292/picture3my7.png" title="http://img301.imageshack.us/img301/1292/picture3my7.png">http://img301.imageshack.us/img301/1292/picture3my7.png</a></p>
    <p>3) The font used on this PDF. I’m not sure if it’s the same as number 1:<br>
    <a href="http://img201.imageshack.us/img201/4971/picture4lx9.png" title="http://img201.imageshack.us/img201/4971/picture4lx9.png">http://img201.imageshack.us/img201/4971/picture4lx9.png</a></p>
    <p>4) The font used for people’s posts on this board. Is it Times new roman? It looks different to me - softer.</p>
    <p>5) The font used on the main-page of this website and I think is the same one used to tell name of thread above this post:<br>
    <a href="http://img180.imageshack.us/img180/8216/picture5ie0.png" title="http://img180.imageshack.us/img180/8216/picture5ie0.png">http://img180.imageshack.us/img180/8216/picture5ie0.png</a></p>
    <p>Thank you so much in advance.</p>
    <p>Adam.</p>
