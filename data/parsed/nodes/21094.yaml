    html: |-
      <p>iTunes can be good and evil when it comes to arranging your music. Although, there really is no better way to do this, then have it automagically completed for you. I have a large collection, and I can’t even fathom having to sort them myself at this point. Just be aware that iTunes may not archive things in the most intuitive manner. Sometimes I wonder what the hell that program is thinking, and half of all my problem arise from incorrect information in the ID3 tags.</p>
      <p>It there are things that you are unclear about, as far as wether your information is correct or not, you might consider using <a href="http://www.indyjt.com/software/">iEatBrainz</a>. This tool attempts to match up a tracks acoustical fingerprint with another track that already exists in a large database. It’s not always right, so definitely exercise caution, but for the most part, I have found it useful. In my own experiences, it is most often the first match that will be correct, although on occasion it will produce several results. When this happens, I usually check a third source, such as Amazon.com to ensure that I am properly tagging the track with the appropriate information.</p>
      <p>If there is anything i hate more than having corrupt fonts, strange fonts, or just font crap on my machine, it has to be having incorrectly labeled tracks in my iTunes library.</p>
