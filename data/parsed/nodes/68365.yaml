    html: |-
      <p><cite>But good distressed type visually mimics the physical qualities of real-life…<cite></cite></cite></p>
      <p>No it doesn’t. Distressed type as used by designers is a digital conceit. Type in the real world isn’t tacked up and left to be beautifully abraded until it has a patina that just happens to look really nice when thrown into perspective, tinted the right shade of red, made transparent, and layered inbetween a backdrop and a model holding a beer can. All that matters is that it look good, and it doesn’t need to be produced by analog methods to pull that off.</p>
