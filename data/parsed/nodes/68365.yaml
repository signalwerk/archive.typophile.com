    html: |-
      <p><cite>Depending on the final output distressing digitally yields better results... etc.</cite></p>
      <p>That's a silly argument. You might have more control when faking wear digitally, and it might be faster if you've done it before and have developed a good process or have purchased some off-the-shelf filters (?!?!). But good distressed type visually mimics the physical qualities of real-life, usually ephemeral, objects (hand-drawn, typewritten, stamped, over inked, coarse paper, physically worn, etc.). The best (read: authentic and convincing) way to make it is to try to use a similar processes to what's being mimicked. In this case, for a worn, faded stamp, get a stamp made (can be done overnight) and then play around with watered down ink and different papers (smooth, rough, sized, damp, etc.). I promise you will get better results that way.</p>
