    html: |-
      <p><cite>Come on man, absolutely do not do it digitally.</cite></p>
      <p>Depending on the final output distressing digitally yields better results. The advantage to manual distressing is that it provides infinitely more complexity in the kind damage done to the type. But that only matters if the end product will reproduce the distressed type as a raster graphic at a size that can reproduce the detail. If the text will only been seen at a distance, at a small size, or as a vector graphic it’s much more efficient to work digitally. And when making a font distressed digitally does not distort the proportions of letters. By the time a sheet of paper has been pulled through a hot laser printer, sanded, crumpled, etc. the letters can end up stretched in unsightly ways.</p>
    html_clean: |-
