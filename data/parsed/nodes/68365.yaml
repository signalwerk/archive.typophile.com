    <p>Hi,</p>
    <p>I'm looking for a good way to distress type. I've followed a few Photoshop tutorials online but have not found a method that I like. I want my type to look really beat up. I'm going to try printing the type and the doing a blender transfer to see if that gives me the right look, but I'm curious about how to do it digitally, too. Any tips or links to tutorials would be great. Thanks!</p>
