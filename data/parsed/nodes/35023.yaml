      <p>Thanks warmly for the heads-up Beth.</p>
      <p>I've been doing letterpress (both metal and PPL) for a few years now, although my volume (read: experience) isn't monumental. Which however is exactly the reason my rates are also not monumental. :-)  On the other hand I try not to skimp on taste or quality; here are a couple of (rather poor) shots of something I printed last month - my new business cards:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/newcard1_4755.jpg"></div><p></p>
      <p>(The back of the card is burgundy matching the color of the logo.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/newcard2_5362.jpg"></div><p></p>
      <p>Jonathan, I would be quite glad to take on your letterpress project.<br>
      Please email me at your leisure: hpapazian_at_gmail_dot_com</p>
      <p>hhp</p>
