    date: 2004-01-20T20:25:00
    date_raw: 20 Jan 2004 — 8:25pm
    votes: null
    html: <p>Sorry, I've been working on my website all day. This is what happens when I don't pay attention. :-) <br> <br>Mike wrote me privately about this this evening before it was answered here. I found a font called Stymie Black Italic Flair that matches in some ways but not others. I concluded that it was probably a knock-off of something by P-L when I saw West Behemoth Ital in one of my P-L books. Then I check here and see that Grant's got the exact thing in one of his books (none of mine have it).  <br> <br>Well done, Grant.</p>
  - id: 22163
    user: 2088
    date: 2004-01-21T06:41:00
    date_raw: 21 Jan 2004 — 6:41am
    votes: null
    html: "<p>As the 'other' ancient nerd, I missed out on this fun. It's interesting to see my name grouped with Grant &amp; Mark. I'm flattered. <br> <br>My P-L book doesn't seem to have this one, but I have a collection of old Expresiv Photo Lettering fonts that includes some 70's style 'gems' of a similar sort of flair: Swinger, Walnetto Casual, Palo Alto and Laurent. If you give me a few minutes I'll post samples of them. </p>"
  - id: 22164
    user: 1011
    date: 2004-01-21T07:14:00
    date_raw: 21 Jan 2004 — 7:14am
    votes: null
    html: <p>&gt; <i>That has to be one of the better typeface names I've heard.</i> <br> <br>Those Photo-Lettering designers were on something, to be sure. The typeface names go very well within the various type categories that my book is divided into as well. <br> <br></p>
  - id: 22165
    user: 2088
    date: 2004-01-21T07:20:00
    date_raw: 21 Jan 2004 — 7:20am
    votes: null
    html: <p>As promised, here are the samples, with some more from that same collection (published by Tiger Direct about 1994). You will note that some of the '70's stuff was perhaps 90 years old at the time, but you know how everything old can be new again. Too bad it doesn't work for old nerds... <br><img src="http://www.typophile.com/forums/messages/83/24593.gif" alt="SeventiesTypeStyles"></p>
  - id: 22166
    user: 1043
    date: 2004-01-21T07:22:00
    date_raw: 21 Jan 2004 — 7:22am
    votes: null
    html: "<p><i>That has to be one of the better typeface names I've heard.</i> <br> <br>That's a typical Photo-Lettering name. The names they assigned were almost like the Latin names for plants and animals. They often tell the name of the designer and other facts. \"West\" actually refers to the designer in this case. (The P-L book I have, Alphabet Thesaurus Volume 2, lists the non-swash version as Dave West Behemoth Clarendon Italic 11.) <br> <br>Here are some others: <br> <br>Tommy Thompson Colonial Triple Condensed 3 <br>Tommy Thompson American Colonial Extra Condensed 5 <br>Fiedler Baroque Monogothic 6 <br>Alexey Brodovitch Albro <br>Ziptop Latin Bold Condensed <br>Benguiat Interlock Medium Condensed <br>Rosenblum Mishoogas <br>Rosenblum Poppycock <br>Rosenblum Razzamataz <br>Jamaica Rum Open <br>Crenshaw Outlaw Bold Expanded <br>Benguiat Zenedipity <br>Haupt Casoni Bold 8 <br>Tony Stan Cheltony <br>Sill Animated Cheltenham <br>Pete Dom Husky Bold</p>"
