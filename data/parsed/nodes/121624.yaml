      <p>I've heard that style referred to as a "ribbon" look, with shadows where pieces cross. </p>
      <p>Of course a real ribbon can't be bent into a shape like that, but there is a resemblance. QVC (a tv shopping network) uses a similar effect with their Q, and I'm sure there are many other examples.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/qvc2_5392.jpg"></div><p></p>
