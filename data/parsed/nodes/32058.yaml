    <p>I’m new here and want to say Hi as well as upping a little mystery font - at least to me. I’ve spent almost a day on this one and cannot come up with a close match, so it could be a tweaked font. The R and M are the keys - R has a rounded leg and the M looks, well, wrong somehow.</p>
