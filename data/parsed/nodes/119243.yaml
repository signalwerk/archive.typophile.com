      <p>In the latter part of the 19th century -- at least in North America -- the high contrast moderns were out of fashion for body text, the Scotch Moderns were everywhere and there was substantial use of  low contrast lighter face Caslon styles like Old Style No. 2 &amp; Franklin [nearest digital is  Williams Caslon Text <a href="https://www.myfonts.com/fonts/fontbureau/williams-caslon-text/">https://www.myfonts.com/fonts/fontbureau/williams-caslon-text/</a> ] and the big serifed Ronaldson [good digital at <a href="http://www.myfonts.com/fonts/canadatype/ronaldson/">http://www.myfonts.com/fonts/canadatype/ronaldson/</a> ].<br>
      In the 1890s this assortment of body texts came under pressure from several fronts ranging from historical revivals of fonts with "vigor" to the revolution in printing technology that converted most printing from a craft to high-speed presses, as well as the technology that permitted much more precision and standardization in making type. The introduction of Century, followed by Cheltenham, meant that by 1900 most of these fonts were dropped from the foundry offerings. They were quickly replaced by fonts that are still in common use today.<br>
      The problem with using a 19th century font for a modern book, even a revival, is that it can make the book look quaint and unappealing to the contemporary reader. Noting wrong with being authentic, provided it works with the reader.<br>
      Don</p>
