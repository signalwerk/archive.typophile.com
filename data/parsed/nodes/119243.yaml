      <p>I have an old copy of "Alice" by Penguin - from the Fifties or Sixties, I believe - beautifully set in Scotch Roman (metal, of course). For a contemporary typeface that resembles the late Ninenteenth English century books, you could try Eames or Paperback by House Industries, or Hariett by Okay Type. By the way, if you're into Adobe Garamond, go with it (I have set many books with it): it's a great text face, just be sure to set it in at least 12 points - by my own experience, at 11 or less the body text can look very small.</p>
