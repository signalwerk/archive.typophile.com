      <p>Adobe Garamond is a great and time-tested face. I personally love it, but it may suffer from <em>ubiquity</em>. There are also other serifs around that inherit and probably advance Garalde beauty, such as Sabon, Lyon or Verdigris.</p>
      <p>As for extra goodies, I think that most well-done typefaces come with them, like extra ligatures and swashes in their opentype features.</p>
      <p>You may consider going with a web font service than buying the font so you would have more leeway once you want to change the typeface. Typekit and FontDeck both support opentype features for big faces like Adobe Garamond.</p>
