      <p>I don’t recall Slimbach has done anything close to Garamond Titling. Goudy has titling though.<br>
      Regarding typography books, I think I can safely declare that Robert Bringhurst’s <em>Elements of Typographic Style</em> is a good starter. It covers most aspects related to type, from using type – both physical and digital – to designing type. It also is written in a beautiful yet complex way thanks to the author’s literary background.<br>
      For a more detailed investigation on how type works on screen and on physical print, I recommend Tim Ahrens and Shoko Mugikura’s <em>Size-specific Adjustments on Type Designs</em>. The book is Ahrens’s Master’s Thesis at uReading where he attempts to basically resolve why some beautiful print typefaces suck on screen.</p>
