      <p>Adobe Garamond Pro doesn't feature neither a swashes set, nor different specific size cuts (subhead, display etc). But there is a "titling capitals" set, which is available in the glyphs panel in Indesign: it features only the uppercase letters and lining numbers - see this pdf from Adobe, pages 10 and 30:</p>
      <p><a href="http://www.adobe.com/type/browser/pdfs/AdobeGaramondPro.pdf">www.adobe.com/type/browser/pdfs/AdobeGaramondPro.pdf</a></p>
      <p>If you're after a Reinassance serif with a full set of swashes, check Hoefler Text, less delicate than Slimbach's Garamond:</p>
      <p><a href="http://www.typography.com/fonts/hoefler-text/styles/">http://www.typography.com/fonts/hoefler-text/styles/</a></p>
      <p>And a couple of necessary readings (besides Bringhurst):<br>
      - Jan Tshcichold, The Form of the Book<br>
      - Jost Hochuli, Designing Books</p>
