      <p>I would recommend Garamond over Caslon. The original Victorian editions used Scotch Roman typefaces, but they look drab to modern eyes.</p>
      <p>Although I'm partial to faces like Italia, Jenson Oldstyle, or Morris' Golden Type, they don't come with matching italics, and are more suited to sword-and-sorcery type works than an edition of <em>Alice in Wonderland</em>.</p>
      <p>Century Schoolbook is even a possibility, were the edition directed at younger readers. But given your likely aim, given that you are asking here, I'm thinking that Centaur might be suitable. And then there's Bembo and Poliphilus as other options to consider - these are very well-known faces, however, so you might look for something similar but more unique.</p>
