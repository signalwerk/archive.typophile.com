    <p>We are publishing a heavily illustrated version of "Alice's Adventures in Wonderland" and are hoping to hear recommendations for a font for the body and also for a complimentary initial cap for the beginning of  each chapter.  </p>
    <p>The book has at least one color illustration on every page spread and many of the illustrations will be free-standing with text flowing around them.</p>
    <p>We're hoping to find a handsome font that feels distinctly old-fashioned, but is also very legible.  (I should mention that the tale involves quite a lot of italics and dashes.)</p>
    <p>So far we've favored Garamond and Caslon for the body, but I'd love to find something a little more distinctive.  For the initial caps we've so far considered Algerian and Birmingham New Street.   </p>
    <p>This is going to be a very deluxe cloth bound art book with ribbon bookmark and slip case. We want a font that also conveys artistry and attention to detail.</p>
    <p>Thoughts?</p>
    <p>(Alice in Wonderland was first published in 1865.)</p>
    <p>Wendy Ice, Publisher<br><a href="http://www.daviddelamare.com/alice.html">www.daviddelamare.com/alice.html</a></p>
