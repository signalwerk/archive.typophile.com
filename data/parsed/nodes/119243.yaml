      <p>Thank you for the suggestions!  Please keep them coming.  You're introducing me to fonts that I've missed.  (I can see that my library is about to expand as I'd like to use some of these for other projects I have in mind.)  I will try each  today to see how they feel in the Alice context.  </p>
      <p>kthomps5, you're right, this would have been very interesting to try in a more contemporary style.  In fact, if we pursue a publisher for a softcover edition, it might be fun to give them this option.  But we've promised our readers a more old-fashioned design for this edition.</p>
      <p>Les, for a variety of reasons including lack of funds and the desire to have the work feel really consistent with the vision of the artist, we (the artist and I) are giving a general look to the designer and she has graciously consented to work within those parameters.  Also, I've just been so impressed with the comments here that I thought it would be interesting to hear opinions on fonts I'm considering and maybe learn about something new.  </p>
      <p>Cerulean, very perceptive about the Mouse's Tail.  I hadn't thought of that as a test.  The drop caps have been challenging because with so many fonts we like most of the letters, but one or two just seem odd or uninteresting in this context.  The letters that must work are:  A, C, T, I, F, Y, H.   </p>
      <p>Garamond had been our top choice so far and seems solid, but I guess I'm hoping for that dorsal hair reaction—that particular feeling of rightness one ideally gets with an art project.</p>
