      <p>Well, it would be features that were typical of the 19th century in type. To my understanding, vaguely:</p>
      <p>In the early 19th century you'd have the "moderns" or "didones" with upright stress, classicist rationalisation, high contrast between thicks and thins, more drawn than lettered. Walbaum would be a fairly readable example.</p>
      <p>In the mid-19th century you'd have more type experimentation – but in text mainly building futher on the above with closed shapes and long serifs, larger x-height, more compact type. Look at e.g. Shinntype's Scotch Modern.</p>
      <p>Late 19th century you're starting to see the influence of various revivalist movements like the arts and crafts movement and theorists like Theodore Low De Vinne. On the one hand, heavy, renaissance-inspired calligraphic type that's sort of an "anti-trend" to the above, on the other hand a more subtle evolution that takes into account historical shapes and scales back some of the extremes of Scotch-style type.</p>
