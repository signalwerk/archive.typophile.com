      <p>Tenniel’s illustrations, and the Dalziel’s woodcuts, have a quality of line which is very similar to that of the Scotch. Both type and illustration were printed relief, into the paper, with the impressions being made from media that were sculpted by hand—all very tactile.</p>
      <p>A photo process re-sized reproduction of a painting, and type from a scale-less digital outline (a picture of type, as Gill would have observed), related only by being printed offset, are a different kettle of ﬁsh.</p>
