      <p>I don't... I need to figure out what the font is that was used for this and use it on a rebrand. So if you can't use a substitution font, whoever used this must have used something else, right? Man, who'd a thought this would be so difficult. I appreciate all the help, hopefully we can all fugure this thing out.</p>
      <p>Here's the deal...</p>
      <p>We have been contracted to do a rebrand for these guys:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AZDC.gif"></div><p></p>
      <p>They want to use the same font, but change the logo, colors, etc... so I am trying to figure out what the font is so we can use it in the rebrand. Of course they have no idea what was used or who even did it so I figured I'd try posting on here. As usual, any and all help is appreciated.</p>
      <p>Thanks in advance,</p>
      <p>Beau</p>
