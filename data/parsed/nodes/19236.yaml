      <p>I agree... Though not a fan of Papyrus at all.</p>
      <p>Okay, let's change the focus here since we all agree that the use of Adobe Serif is just stupid. Anyone up for a good recommendation of a new face for their brand? I will do all I can to pull them away from the current face. Maybe we can find something that will be close but better.</p>
      <p>Here's what I would like you to take into consideration, the font will be used for logos, text, web &amp; video - basically everything.</p>
