      <p>Certainly most of LA is flat, topographically as well as existentially. Or rather, most of LA is only interesting in its contribution to the fascinating texture of the whole. But that degree of subtlety is neither interesting nor viable to appreciate in passing.</p>
      <p>Your plan of coming down the coast is solid. If you have time come straight down Pacific Coast Highway, through Malibu to Santa Monica and Venice (don’t miss all the loonie beachwalk performers!) and then down through all the beach cities until you end up in San Diego; if you’re short of time come down the 5 Freeway (where you’ll get a fringe glimpse of desert driving) switch to the 405 and then cross over to Santa Monica using the 10. And if you go inland from Santa Monica your safest bet (although decidedly toursitic) is to use Wilshire Boulevard to go through Beverly Hills (Rodeo Drive etc.) and Melrose Avenue. These are not “fake” things to see, they’re just one aspect of the reality of LA, which I feel is a breathtaking microcosm of the world. Now, if time and mettle permit, at least get yourself to a King Taco*, where you’ll be afforded a small peek into one of the other realities of LA. The last time I took some visitors there (from Singapore) there were three armed guards, and ironically enough one of them was missing an arm! But of course, les goûts et les couleurs ne se discutes pas.</p>
      <p>* <a href="https://web.archive.org/web/20081013182135/http://www.kingtaco.com/" title="http://www.kingtaco.com/">http://www.kingtaco.com/</a><br>
      Caveat: some of the locations are boring.</p>
      <p>SF: It’s an older city, and has paid more attention to preserving itself, so it certainly has more old signage, and much more densely packed. But overall I’ve come to find the city boring - too touristic. LA doesn’t really care about tourists; the tourists have to do the caring in order to make it worthwhile.</p>
      <p>Me: virtually everybody who has ended up meeting me in person after experiencing me online expresses shock at the difference in apparent character. Whether the existence of this difference is good or bad is arguable.</p>
      <p>Anyway, I’ve become quite proud of my city, after all these years of ambivalence and even periodic anim<!--
