    html: |-
      <p>In fact the afternoon rush hour can start as early as 2:30pm! But the morning range is actually complex: depending on the freeway and direction, there are 15-minute windows that are amazingly smooth. Also, on Fridays the evening rush hour is more spread out: it starts earlier and ends later, but/so is gentler.</p>
      <p>In terms of Vegas the good news is that if you’ll be going there as you approach LA County, you’ll skirt the top rim of LA, largely avoiding traffic. But when you come back into LA from Vegas your timing is critical.</p>
      <p>hhp</p>
