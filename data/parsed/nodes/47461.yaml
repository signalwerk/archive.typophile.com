      <p>Nick, if you’d like to meet up let me know when you’ll be passing through LA. Although it’s more memorable for its graffiti and “fauve” lettering, LA is big, so it’s got everything.</p>
      <p>BTW, if you time it right (and you use your mirrors well) the freeways here allow you to cover a huge number of miles very quickly, so you can probably make a side-trip to Vegas. It’s signage central baby. And there’s really nothing like barreling through the desert in the summer.</p>
      <p>hhp</p>
