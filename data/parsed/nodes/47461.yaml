    <p>Hi Typofolks,</p>
    <p>My wife and I are off to California in a few weeks, starting in San Francisco and ending up in San Diego. As an avid photographer of (old) shop signage I would be grateful for any suggestions. I’d really like to go to that signage graveyard in the desert somewhere outside Las Vegas (I think), but probably won’t have the time. </p>
    <p>I’ve only previously been to New York, so am looking forward to California. I know there’s a heck of a lot to see. </p>
    <p>These are some from my European collection:</p>
