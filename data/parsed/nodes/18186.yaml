      <p>Well, I’ve hunted almost everywhre I can think to look, and I couldn’t do any better than to find two pretty similar fonts: <a href="http://www.myfonts.com/fonts/classic/classic/" target="new">Classic</a> from Classic Fonts, and <a href="http://www.myfonts.com/fonts/classic/copper/" target="new">Copper</a>, from the same foundry. The ascenders on Classic are most like the sample; the Initials of Copper are somewhat closer, although the Bernhard Script suggestion has better matching initials (but a non-connected script).</p>
      <p>I would not be surprised if this was a custom font done by this foundry for the bridal magazine, because the weight and style is so similar, and unlike almost any other fonts I saw. I went through all MyFonts and Veer scripts, plus my own Script Guide.</p>
      <p>- Mike Yanega</p>
