    html: |-
      <p>I was just incorporating some new Script Guide samples from Paul D. Hunt, and something looked very familiar. See <a href="http://bowfinprintworks.com/Script01Pg5.html" target="new">OttumHmk</a> from the Hallmark font set. This font’s lower case and even its ’?’ match most of these letters (note the ’z’ also). The ’b’ , ’r’ and ’s’ are different, but I noticed a strong resemblance between Ottum and Snell Roundhand. There’s the same (or very similar) ’b’ to this script. </p>
      <p>So where does this leave us? The Hallmark artist (Rob Leuschke?) who did Ottum might be the one who designed this font for the bride magazine (and Visa ad Patty saw). Not to be too critical, but the number of aspects that seem ’borrowed’ (Bernhard &amp; Snell to name two), takes away from the originality, except that this combination is new.</p>
      <p> - Mike Yanega</p>
