  votes: null
  html: '<p>F O R   I M M E D I A T E   R E L E A S E <br> <br>Typeco announces the limited-edition Indie Fonts book. <br> <br>Typeco is selling a special limited-edition of Indie Fonts (100 copies) signed by the designer and co-editor, James Grieshaber. If you would like a signed copy of this book send us a check for $39.95 + $5.00 S&amp;H  in the USA for each copy you want to: Typeco, PO Box 10661, Rochester, NY 14610. For shipping outside the USA, please request a price quote by e-mail at <a href="mailto:work@typeco.com">work@typeco.com</a> before sending payment. <br> <br>Indie Fonts is designed and co-edited by James Grieshaber of Typeco. Indie Fonts brings together 18 independent font foundries from around the world creating an invaluable resource of over 2000 fonts for designers, art directors and typographers. <br> <br>This hard-bound book is divided up by foundry so that the user can get a feel for the work produced by each group. This also makes it convenient to order fonts directly from their source. To make it easier for the user of this book, a visual font index is provided in the front for quick scanning. There is also a fully cross referenced index in the back of font names, designers, and original designers. <br> <br>Contributing foundries include Altered Ego, Astigmatic, Carter &amp; Cone, Chank, Font Diner, fontBoy, Fountain, GarageFonts, International House of Fonts, LettError, P22, Psy/Ops, SynFonts, Test Pilot Collective, Typebox, Typeco, Typodermic and Typotheque. <br> <br>Accompanying this book is a Bonus Fonts CD-ROM that contains 33 indie fonts on an unlocked disc located in a sealed package in the back of this book. The fonts are licensed from each contributing foundry for use solely by the owner of this book. <br> <br>Contact info: <br>Typeco <br>PO Box 10661 <br>Rochester, NY 14610 <br>Phone: 585.230.1674 <br>Email: <a href="mailto:work@typeco.com">work@typeco.com</a> <br>Web: <a href="http://www.typeco.com" target="_top">http://www.typeco.com</a></p>'
