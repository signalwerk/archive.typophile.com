    html: |-
      <p>My first guess would have been that he could be talking about the invention of the nick.</p>
      <p>But this "imitated from Gothic forms" clearly indicates that what is being referred to is the letterform. Hmm. Printing Types by Updike is said to devote considerable space to Johann Froben, whose chief claim to fame appears to have been scooping the Elzevirs with a Greek New Testament by underhanded means.</p>
      <p>Updike says that the printers of Basle generally used a "squarish" style of Roman type...</p>
