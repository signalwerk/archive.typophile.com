    <p>I'm reading a 1924 English printing handbook and it says, after discussing Elzevir types, the following:</p>
    <p>"This type soon became the prevailing fashion. It was slightly modified by Froben, of Basle, who adopted the peculiar mannerism--probably imitated from Gothic forms--mentioned above, of having his types 'cut on their backs.'"</p>
    <p>What does he mean that the types were cut on their backs?</p>
