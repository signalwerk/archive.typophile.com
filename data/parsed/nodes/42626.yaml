  html: |-
    <p>At the Cambridge website is offered a KJV Bible</p>
    <p><a href="http://www.cambridge.org/uk/bibles/kjv/standard.htm" title="http://www.cambridge.org/uk/bibles/kjv/standard.htm">http://www.cambridge.org/uk/bibles/kjv/standard.htm</a></p>
    <p>featuring a highly interesting old typeface called Antique Old Style No. 3, which has no descenders at all. More precisely, the descenders of f, g, j, p, q, y in Roman and Italic are sqeezed or crippled such that they do not (or almost not) go below the base line enabling extremely non-leaded typesetting.</p>
    <p>I uploaded a sample page here</p>
    <p><a href="http://www.sanskritweb.net/temporary/luke.gif" title="http://www.sanskritweb.net/temporary/luke.gif">http://www.sanskritweb.net/temporary/luke.gif</a></p>
    <p>It seems to me that this KJV Bible edition, which is a reprint, was originally typeset using the foundry type or hot-metal type of Antique Old Style No. 3, which seems to be a modification of one of the various Bookman fonts.</p>
    <p>Question: Is this curious Antique Old Style No. 3 available as a digital font?</p>
