  html: <p>Claudio Pousada and Mauro Oliver have translated to <br>english the site "Santo Tipo". <br> <br><a href="http://www.santotipo.com/eng/home/home-e.html" target="_blank">http://www.santotipo.com/eng/home/home-e.html</a> <br><a href="http://www.santotipo.com" target="_blank">http://www.santotipo.com</a> <br> <br>-------------------------- <br>"The SANTOTIPO project is an open enterprise that works <br>for the development of experimentation on typography. <br> <br>It proposes a way to canalize different views on <br>design, focussing on discoveries and development of <br>experimentation on typography." <br>-------------------------- <br></p>
