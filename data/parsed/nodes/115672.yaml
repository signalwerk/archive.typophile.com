    html: |-
      <p>Letter _o_ appears three times, each one shaped differently. So it's hand lettered. Not a consistent style for the capitals.<br>
      As for the lower case, there is some vague similarity to fonts such as Terragon <a href="http://www.myfonts.com/fonts/linotype/tarragon/" title="http://www.myfonts.com/fonts/linotype/tarragon/">http://www.myfonts.com/fonts/linotype/tarragon/</a> or Clairvaux <a href="http://www.myfonts.com/fonts/linotype/clairvaux/" title="http://www.myfonts.com/fonts/linotype/clairvaux/">http://www.myfonts.com/fonts/linotype/clairvaux/</a><br>
      Don</p>
