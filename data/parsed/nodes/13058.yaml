    <p>Hi people!</p>
    <p>Hedera. Umm... what is it exactly? Ivy leaf... a horticultural dingbat... This little fellow (<a target="_blank" rel="nofollow">see veer's t-shirt</a>) has caught my attention a few times - always sitting by itself for no apparent reason. Is it just pretty? Or is there more to it than that? </p>
    <p>Or am I just being haunted by the thing?</p>
