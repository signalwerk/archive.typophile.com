      <p><cite>it would seem that the Hedera/Aldus-Blatt has been given more recognition in Germany than in other countries </cite></p>
      <p>Yes, because Germany's most famous publisher of design and typography books ("Hermann Schmidt Verlag") uses it as their brand mark.<br>
      But I don't think the ancient roots and the name Hedera are well known in Germany or elsewhere. </p>
      <p>You can find some more information in Parkes "Pause and Effect – an introduction to the history of puntuaction in the west" and in Paul Saenger's "Space between Words".</p>
      <p>I don't know which other typefaces include a Hedera. But if you find out more, please let me know. I would like to compare the different designs.</p>
      <p>Ralf</p>
      <p><a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a></p>
