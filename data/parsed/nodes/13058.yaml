      <p>Thanks Ralf, a great answer. I can rest a little easier now. Judging by the web pages I have found, it would seem that the Hedera/Aldus-Blatt has been given more recognition in Germany than in other countries (<a target="_blank" rel="nofollow">example</a>)... is that the case?</p>
      <p>I feel a little guilty that the meaning passed me by, although I am sure I am not alone...</p>
      <p>In the <cite>Character Palette</cite> (Apple OS X 10.4) I have found the hedera listed under <cite>Ornamental Punctuation</cite> as a <cite>floral heart</cite> and a <cite>rotated floral heart bullet</cite>. Both in Zapf Dingbats. Now I am forced to ask three more questions:</p>
      <p>1/ Is it commonly known in Europe as a hedera, but more commonly referred to as a floral heart in the States? (I am British).</p>
      <p>2/ Other than Dingbats, which character sets include the hedera?</p>
      <p>3/ Was the original use always as a bullet?</p>
      <p>Please forgive my ignorance!</p>
