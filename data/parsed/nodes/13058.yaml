      <p>The Hedera was one of the first punctuation marks of Greek and Romans (beside Interpuncts). In the Middle Ages this meaning was forgotten and it became a decoration for title pages and so on. In Germany we also call it Aldus-Blatt, because the famous italien printer Aldus Manutius used it very frequently.</p>
      <p>Ralf</p>
      <p><a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a></p>
