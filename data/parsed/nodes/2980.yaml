    html: "<p>Marius, <br> <br>There is an article in Baseline Magazine Number 34 2001 called <b>Can packaging be honest?</b> The introduction is by Jeremy Myerson and the main text is by Frank Philippin. The discussion is wide ranging and interesting, addressing such considerations as how we shop, vision problems and information. Philippin reports on two redesign tests he conducted with older consumers one of which is Paracetamol packaging. <br> <br>Also the books: The Total Package, The Perfect Package and others. A search on Amazon should yield related titles. Search at you library (Academic or Public) for them and others too. Librarians can help lots when doing research like this. <br> <br>Jon</p>"
    html_clean: "<p>Marius, <br> <br>There is an article in Baseline Magazine Number 34 2001 called <b>Can packaging be honest?</b> The introduction is by Jeremy Myerson and the main text is by Frank Philippin. The discussion is wide ranging and interesting, addressing such considerations as how we shop, vision problems and information. Philippin reports on two redesign tests he conducted with older consumers one of which is Paracetamol packaging. <br> <br>Also the books: The Total Package, The Perfect Package and others. A search on Amazon should yield related titles. Search at you library (Academic or Public) for them and others too. Librarians can help lots when doing research like this. <br> <br>Jon</p>"
