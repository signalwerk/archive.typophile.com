    html: <p>Marius, my biggest complaint with pharmaceutical packaging isn't the type or the graphics, its the stupid names, that the general public don't get. I think the agencies who create the packaging would be better off spending more time and money researching names through focus groups. More generic names that have memory retention would require less advertising and brand recognition.</p>
