  html: <p>I would be interested in discussing aspects of typography and typeface usage on pharmaceutical packaging - both prescription-based and OTCs. <br> <br>Helvetica is omnipresent, but I think we have a wider choice now. <br> <br>What aspects are most important? Legibility? Contrast? To what extent is the typeface's personality important in the success of the final project? Consider both large and small type on package. <br> <br>I would be grateful if someone knows resources and is willing to share. <br> <br>Regards, <br> <br>Marius Ursache</p>
