    Sign up for Fonts.com Master plan: <a href="http://bit.ly/15YvHyt" title="http://bit.ly/15YvHyt">http://bit.ly/15YvHyt</a></p>
    <p>Monotype has enhanced its <a class="freelinking external" href="http://www.fonts.com/web-fonts " rel="nofollow">Fonts.com Web Fonts</a> service to provide greater flexibility and choice to creative professionals. The new <a class="freelinking external" href="http://www.fonts.com/web-fonts/master-plan " rel="nofollow">Master subscription plan</a> brings together the company’s Web font solution with unlimited access to more than 7,000 desktop fonts. Combined with Monotype’s <a class="freelinking external" href="http://typecast.com/ " rel="nofollow">Typecast</a>™ application for designing with Web fonts in the browser, the master subscription is an industry first that provides a comprehensive solution for working with type throughout the digital and print design processes, bringing unparalleled value to customers.</p>
    <p>The Fonts.com Master subscription plan, which Monotype intends to expand with new features on an ongoing basis, includes: </p>
    <p>Unlimited desktop fonts: Customers receive an unlimited download allowance of more than 7,000 traditional “desktop fonts,” while subscribed to the plan including selections from various typeface foundries and the company’s Monotype® Libraries, comprising the Monotype, Linotype®, ITC®, Bitstream® and Ascender® collections. Included are some of the world’s most widely used designs, such as the <a class="freelinking external" href="http://www.fonts.com/font/linotype/Helvetica " rel="nofollow">Helvetica</a>®, <a class="freelinking external" href="http://www.fonts.com/font/linotype/Frutiger " rel="nofollow">Frutiger</a>®, <a class="freelinking external" href="http://www.fonts.com/font/linotype/trade-gothic " rel="nofollow">Trade Gothic</a>® and <a class="freelinking external" href="http://www.fonts.com/font/monotype/gill-sans " rel="nofollow">Gill Sans</a>® typefaces, in addition to a continually expanding selection of new designs. </p>
    <p>Desktop fonts are delivered automatically and installed on up to five workstations using Monotype’s patent-pending <a class="freelinking external" href="http://www.fonts.com/browse/font-tools/skyfonts " rel="nofollow">SkyFonts</a>™ technology. SkyFonts runs in the background of Macintosh® or Windows® platforms to activate and deactivate OpenType® fonts downloaded from Fonts.com. Desktop fonts may be used for all purposes that Monotype’s standard desktop end-user license agreement allows.</p>
    <p>Web fonts: Subscribers receive access to more than 20,000 Web fonts, including hundreds of hand-tuned selections that offer exceptional clarity, particularly at small text sizes. Subscribers are entitled to up to 2.5 million Web font page views per month and can add an unlimited number of Web fonts to an unlimited number of websites. Customers may receive additional page view allowances by upgrading to a higher level within the plan.</p>
    <p>Typecast: Subscribers receive access to Monotype’s <a class="freelinking external" href="http://typecast.com/ " rel="nofollow">Typecast</a> application, a browser-based tool for designing Web pages with Web fonts. Designers are able to combine, compare and style Web fonts quickly without performing screen captures in third-party applications or through hand coding. Users can visually style text directly within the browser, which offers more scope for creative experimentation, better typographic control and a simplified workflow. The Typecast application enables unlimited experimentation with fonts from the Typekit®, Fontdeck®, Webtype™ and Google Fonts services, in addition to Fonts.com Web Fonts.</p>
    <p>Customers may sign up for the Fonts.com Master subscription plan at <a href="http://www.fonts.com/web-fonts/master-plan" title="www.fonts.com/web-fonts/master-plan">www.fonts.com/web-fonts/master-plan</a>. A live webcast that demonstrates how SkyFonts can be used with the new Fonts.com Web Fonts subscriptions will take place May 3, 2013, at 11:00 a.m. eastern time. Register for the webcast at <a href="http://bit.ly/ZjFbNn" title="http://bit.ly/ZjFbNn">http://bit.ly/ZjFbNn</a>.</p>
