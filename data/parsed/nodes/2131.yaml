  html: "<p>I've been trying to figure this one out for ages: <br> <br><a href=\"http://www.rotovibe.com/files/mbv_font.jpg\" target=\"_blank\">http://www.rotovibe.com/files/mbv_font.jpg</a> <br> <br>additional samples: <br><a href=\"http://cgi.di.uoa.gr/~postg21/Graphics/JPEGs/YouMadeMeRealise.JPEG\" target=\"_blank\">http://cgi.di.uoa.gr/~postg21/Graphics/JPEGs/YouMadeMeRealise.JPEG</a> <br><a href=\"http://cgi.di.uoa.gr/~postg21/Graphics/JPEGs/IsntAnything.JPEG\" target=\"_blank\">http://cgi.di.uoa.gr/~postg21/Graphics/JPEGs/IsntAnything.JPEG</a> <br> <br>I've looked at numerous Bauhaus styles and it looks closest to Chalet Paris 70 which isn't quite right. <br> <br>Any help is very much appreciated! <br>-Spencer <br></p>"
