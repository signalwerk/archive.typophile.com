      <p>It depends on how much “graphic” and how much “novel” the result: if the typewritten text is visually framed, it shouldn’t clash with the rest.<br>
      If that is the case, I would go for an accurate rendition either historically  (which model of typewriter?) and/or visually (a “worn out” face, like <a href="http://www.fontfont.com/fonts/trixie" title="http://www.fontfont.com/fonts/trixie">http://www.fontfont.com/fonts/trixie</a>).<br>
      If the lines (pun intended) between the different kind of text are more blurred, you could use either a classic text face with a monospaced cut (like Century) or a proportionally spaced typewriter face (like the ones suggested in the aforelinked thread or <a href="http://www.fontsquirrel.com/fonts/lekton" title="http://www.fontsquirrel.com/fonts/lekton">http://www.fontsquirrel.com/fonts/lekton</a>).<br>
      About the text faces you mention, I’m most familiar with Perpetua, and I wouldn’t recommend it, finding it a bit “frail” and maybe even pretentious.</p>
