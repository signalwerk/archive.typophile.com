      <p>@ James, they did a lot of writing in her "group". They published a magazine.<br>
      And both her parents were writers. You mentioned social class, and when they met in the 1940, her mother, who came from a middle class family, owned a typewriter, while her father, coming from a working class background, didn't. Her's was an Erica/Erika – I know that.<br>
      @ Nick –  I like it Brown. It's has this slight vintage-tint.  I like it. And nice story about WEC.<br>
      It's hard to make the  typewriter-/monospace/slab work with a serif, so I think it must be a sans. Brown could mix nicely, I think. If anything, perhaps I could use something a little more ...casual, perhaps. But it is a good suggestion.</p>
