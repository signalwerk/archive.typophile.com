      <p>&gt; My story takes place mostly in the 1960-1980s,<br>
      &gt; ...in a beatnik-/alternative surrounding</p>
      <p>Would a beatnik be using a typewriter? I was a young person back then and most young folks didn't use them except maybe in upper-class schools, for college term papers, and office work. And it's harder to imagine a beatnik or hippie using one. You might need to include an explanation of why they are using it.</p>
