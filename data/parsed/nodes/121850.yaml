    <p>Hi!<br>
    I’m new here (though I’ve nosed around earlier).<br>
    I’m working on a graphic novel, or actually it’s more like a ‘graphic bio’ – a biography in the form of a picture book. </p>
    <p>In the book, there are 3-4 different kinds/lines of text  – the narrator’s voice, my main character’s voice – and then excerpts from letters, song texts and poems, written for and by my main character.<br>
    The 3 different kinds of text change a lot throughout the book, so that I sometimes will have all three kinds on one page or spread. Every page is illustrated and sometimes text is set on top of a drawing.</p>
    <p>The two first kinds of text, the narrator and my main character, I think would work with quite many different typefaces,<br>
    My story takes place mostly in the 1960-1980s, when my character was young – in a  beatnik-/alternative surrounding. I’d like the typeface for her and the narrator’s voice to have some warmth, but without attracting too much attention to itself. Maybe slightly handwritten and/or casual.<br>
    For now, I am leaning towards Cronos, and earlier I’ve looked at Joanna, Perpetua or Legacy Sans.</p>
    <p>But, but, but: the letter/poem-texts are causing me a head ache! The only thing that I think really works for them, is using a “oldschool-typewriter”-face (like “Pitch”.) One with a vintage-typewriter-feel.<br>
    But I don't think the typewriter-face doesn't mix very well with any of the above mentioned. The shapes, perhaps, but also when  combined with a typewriter face, they look a little (too) formal.<br>
    I looked at Nexus and Eureka, which both have a monotype-version, that I thought of using in stead of vintage- typewriter-type, but I think those monotypes look too contemporary for my book. Sigh.</p>
    <p>Does this make sense? Do you have any ideas or suggestions?</p>
    <p>I know this is the kind of thing you should discuss with a colleague, while having a coffee – but I don’t have that person right now. So – if anyone has thoughts,  opinions or suggestions on this, it will be very much appreciated! Thanks so much!</p>
