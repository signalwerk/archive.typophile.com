    html: |-
      <p>I just identify 'em. </p>
      <p>As far as I can find, this typeface does not seem to be available in digital form*. It was the first typeface issued by the Word Typeface Center (according to 'Modern Encyclopedia of Typefaces 1960-90' by Lawrence Wallis), a company Carnase co-founded, and it came in five weights, each with an italic face. The image I showed was a scan from the Wallis Book. The book mentions Linotype as a supplier, but Linotype only mentions it as one of Tom Carnase's designs in their <a href="http://www.linotype.com/362/tomcarnase.html" rel="nofollow">designer profile</a> on their site. I suspect it was available as film type, since in the time period it was designed, I think that was the dominant type format being used.</p>
      <p>- Mike Yanega</p>
      <p>[*edit: At least not by this name. One of his other WTC typefaces, 'Favrile' was digitized as 'Francois' by Brendel (I think), and also as 'Fascinate' by NovelFonts, so it's possible that a renamed digital version exists.]</p>
    html_clean: |-
