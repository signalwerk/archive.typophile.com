    html: <p>You could start with almost any bold condensed sans--Impact, for example--in a vector drawing program like Illustrator. Convert your type to outlines, set the fill to white and the stroke to black. Use the direct selection tool to push and pull the various letters into the shapes you want. Then offset the path by a few points (set the joins to "round") and fill the offset with black to create the dark "halo" effect around the letters. Good luck!</p>
    html_clean: <p>You could start with almost any bold condensed sans--Impact, for example--in a vector drawing program like Illustrator. Convert your type to outlines, set the fill to white and the stroke to black. Use the direct selection tool to push and pull the various letters into the shapes you want. Then offset the path by a few points (set the joins to "round") and fill the offset with black to create the dark "halo" effect around the letters. Good luck!</p>
