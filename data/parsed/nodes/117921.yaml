    html: "<p>You might also consider taking a look at the House Industries website (<a href=\"http://www.houseind.com/\">http://www.houseind.com/</a>) and check some of their typefaces. One that is similar is Shag Lounge: <a href=\"http://www.houseind.com/fonts/shagcollection/viewfonts\">http://www.houseind.com/fonts/shagcollection/viewfonts</a>. It all depends on whether you just want a similar face or are trying to recreate the logo. If it's the latter, I would just trace it in Illustrator.</p>"
