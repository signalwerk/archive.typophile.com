    html: |-
      <p>When a _T_ [or any other letter] intermingles with another letter like this, it can be called an interlock. Luc Devroye has complied a collection of Interlocking typefaces at Myfonts <a href="http://luc.devroye.org/myfonts-interlock/">http://luc.devroye.org/myfonts-interlock/</a> You might find something of interest there.<br>
      The Saint is lettering, so you will not find an exact match.<br>
      Don</p>
