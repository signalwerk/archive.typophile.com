  html: |-
    <p>Is there a fast way in Indesign to change biblical text imported from the internet the includes nikud into the appropriate unicode sign.</p>
    <p>The imported text is built  - letter, nikud, dagesh<br>
    I would like to change to - letter+dagesh glyph, nikud</p>
    <p>Bentzi</p>
