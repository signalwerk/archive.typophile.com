    html: |-
      <p>Thanks, Charles.</p>
      <p>The fonts are however TTF fonts, and with all permissions given.<br>
      Note that the fonts did test well in the first round, and that only sub pixel hinting, slightly different names (only the names, not the naming structure) and the addition of the DSIG-table are the changes that have been made.<br>
      I have done some tests where I have taken the DSIG-table out of the fonts again, but with no positive result. The hinting doesn't seem to be the issue either, so now we're testing if it might be the actual name, though it doesn't seem to any dobbelgänger out there.</p>
