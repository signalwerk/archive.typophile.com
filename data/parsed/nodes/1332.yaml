    html: <p>I’m not disagreeing with you — you are the so-called Expert —  <br>just pointing out the <br>things I pointed out, which you overlook because <br>mea culpa is not in your vocab. <br><br>I’m not a trademark designer nor a logo designer <br>nor have I taken a single graphic design class <br>but jay, this stuﬀ goes without saying. Of course <br>you don’t just roll a font out of the box. Of course <br>you look at letter pairings, positive/negative space, ligatures,  <br>color and weight, among a host of other things. <br>Of course you ought to sketch stuﬀ out, but <br>not in the gutterball instance, for us onlookers. <br>We didn’t set craft or artistry back and we weren’t being <br>lazy. We were having <br>fun with a few fonts that have never seen the light <br>of day. <br><br>There’s nothing wrong with being an idealist, but it’s <br>the arrogant manner in which you spread your recycled <br>gospel that is so grating. Humility is a wonderful thing. <br>Do they teach that up on the hill? <br><br>bj <br><br>I love Art Center, btw. I’ve been there three times. <br>You won’t ﬁnd a better guy than Art Center  <br>grad Jeﬀ Soto. He has more humility than anyone <br>I know. <br><br><a href="http://www.jeffsoto.com" target="_blank">www.jeﬀsoto.com</a></p>
