    html: <p>"as a last note (i think i already mentioned this) the use of the word logo is incorrect." <br> <br>The english language is not a set of facts and rules cast in stone. It morphs and is really controlled by common usage amongst the masses.  <br> <br>Today, in everyday conversation, the common term for any mark that is used to ID a product, person, company, etc. is 'logo'. People also use wordmark, trademark, logotype, bug, icon, etc. <br> <br>So while your historical definition has merit, it really serves no purpose to debate its use in every day language. <br> <br>Except for sounding elite in client meetings and/or gaining from the enjoyment in partaking in silly debates online ;o) <br> <br>As for using custom type for every client, if you can do it, and feel that it is so important, then more power to you. <br> <br>Custom type is often a great solution. That said, there are a lot of great typefaces out there that make great raw materials for a logo/logotype/trademark/whateveryouwanttocallit <br> <br>Personally, I don't side with either argument...it all depends on the needs of the client, budget, timeline, etc.</p>
