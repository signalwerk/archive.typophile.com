  html: <p> A friend of mine has asked to design the logo for his new band, "Gutterbäll" - His only criteria is that the logo should look "very heavy metal."  <br> <br>I certainly have some ideas of how to proceed, but before I post some examples, I wanted to open it up for discussion. What typographic treatments lend themselves for effective heavy metal-ness? <br> <br>Feel free to post examples, or throw out ideas. And Yes, they have an umlaut over the "a", just for kicks. <br> <br>jb </p>
  html_clean: <p> A friend of mine has asked to design the logo for his new band, "Gutterbäll" - His only criteria is that the logo should look "very heavy metal."  <br> <br>I certainly have some ideas of how to proceed, but before I post some examples, I wanted to open it up for discussion. What typographic treatments lend themselves for effective heavy metal-ness? <br> <br>Feel free to post examples, or throw out ideas. And Yes, they have an umlaut over the "a", just for kicks. <br> <br>jb </p>
