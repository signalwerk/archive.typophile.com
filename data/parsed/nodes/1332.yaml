    html: <p>thank you hrant, i couldn't agree more. this topic we have gotten off on is very relevant to the issues started in this post. the fact is that people who don't know any better stumble on to these sorts of boards and perceive them as the upper echelon of typographic pursuit. when they see that all people are doing is typing things in on there computers they begin to think this is how it's done. i can't tell you how many students i've had to guide off this path. <br> <br>bj, i must apologize. i had no idea you were not a designer. i'm sorry, it seems you got singled out here. it's great though that you are even interested enough in this subject to visit a site like this. <br> <br>steve, the fact is that even if trade is not the primary purpose (which is very rare) and it is still not a logotype then what is it? i say if you are looking for a blanket term which is what logo has become then a better term is trademark. that's it. this topic really needs to go no further than this. <br> <br>simon, sorry about the website i'm putting together something new at the moment (you know how that goes). in all actuality i was brought to this site, a few weeks back, by a friend who had said one of my marks was posted here and that people where trying to figure out what typeface it was (little did they know it wasn't a typeface). you brought up art chantry. i teach at the same school up here as art taught at. though i don't go for his aesthetic, i respect the work he does.  <br> <br>many of these marks are logotypes, you are correct. they should still be done by hand though. the logotype vs. trademark debate stems from the fact that logo is thrown around with little knowledge of what it really means. as far as your last question goes, i'm not quite sure i understand what you're getting at. <br> <br>david, glad to see that someone else gets the value of what i'm saying here.</p>
