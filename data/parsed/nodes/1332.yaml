    html: "<p>wow... there's way to much here to even respond to. i'll hit the big topics and try to keep it short. <br> <br>on the issue of \"logos\":  <br>1) it's a low brow term. that does not mean that logotype solutions themselves are low brow.  <br>2) just because the dictionary has adopted the incorrect term and defined it does not mean it's correct. many notable identity designers would agree. <br>3) paul rand was producing work when the abbreviations \"logo\" was coming to power as a word. this does not make it a correct term either. <br>4) i do agree that it has become a common term though and that is the reality of it. i don't chastise people over it only people that should know better. my effort was to expose the reality of the term. i think you guys are way to entrenched in an improper blanket term. <br> <br>on the issue of elitism: <br>1) elitism is a beneficial element in culture. it creates high standards. it's there and will never go away. our industry (design) is based on it. get used to it and learn to embrace it. <br> <br>on the issue of insulting people: <br>1) most of the statements i make sound outlandish because they are. most of them are written as jokes with some truth behind them. in the written language they come across with little humor. i'm sorry for that. most individuals i know, in person, who read these posts laugh. it's humorous how up in arms you guys get. <br>2) steve, you are still incorrect. the statements you have listed are very general and site no one individual, directly. i have only reverted to name calling twice. and i've admitted to it when doing it. it is a weak way to debate. <br>3) if some people in general feel insulted that is their own perceived and individual problem. people need to toughen up. i can't believe how sensitive you are being. you'd have a hard time living in places like NY. <br> <br>on the issue of using lowercase: <br>1) it's more efficient while typing and is a modification to the written language. it omits what i consider to be little needed formalities. it is a push toward utilitarianism and minimalism. my doing it is expression of these ideals. david, would you insult wim crowel for his new alphabet because it has no caps? your attempt to discredit through what you perceive as technical inconsistencies is one sided. <br> <br>on the issue of posting to this thread: <br>1) i found the title interesting. i grew up listening to punk rock and heavy metal. <br>2) i was shocked by the typographic practices with in it. i think it's in bad taste and sets a bad example to people learning this craft. to see professionals practicing in this manner sets bad standards. <br>3) i couldn't help it i had to say something. i'm sorry my initial post came out to strong. i was mostly joking. but i don't apologize for it's honesty. these sorts of practices are bad for the craft. they make it seem ok to be a lazy typographer. i stand by this. <br> <br>on the issue of my class: <br>1) it is going well, thanks for asking<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> the class is full every term so much so that i have to ask students to drop. the students have given it amazing reviews each and every time. as a matter of fact i've never seen a bad review. if it were as awful as you are suggesting simon, the school would have been alerted to my offensive and outlandish behavior and never asked me to return. that is obviously not the case. <br>2) the principles i teach are sound. they are a benefit to the industry establishing standards that are very important for young designers. laziness is not permitted and i'm surprised you don't feel the same. <br> <br>i still think this has gone on to long. i've done nothing to damage design here. i've brought up important standards that we should all be striving for. these forums should be an attempt to rise out of hack-dom. not submit to it and defend it. my initial joke of being ashamed has sadly turned out to be true. i would have expected higher standards here.</p>"
