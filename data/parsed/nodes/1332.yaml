    html: <p>bj, are you kidding me… i’m amazed that you would pose such a ridiculous question. but to answer, i think you’re completely missing the point. no typeface can account for every individual letter pairing possible. this alone should be enough to answer your question but i will go further. because it is really much larger than this.  <br><br>it really is less crucial that the type is unique in its letterforms (though important, this is only a side beneﬁt). there are plenty of custom or hand done trademarks that use mundane faces like helvetica for instance. because they are done by hand means they are done with a keen sense of artistry, with emphasis placed on the letter pairings found in the word. the time spent crafting each letterform in it’s relation to other letterforms pushes these marks into a realm that no type set text face can match. the importance of doing marks by hand goes beyond originality and into craft. it’s the ﬁne crafting of each letterform into a piece of display type.  <br><br>this craft is also about not being lazy. typographers of the past knew many things that we are losing today due to ignorance and computer convenience. the more you discard your craft and treat it idly the more standards of excellence we lose, and the bigger the onslaught of ignorant graphic design hacks we create. if creating a trademark is as simple as turning on my computer and typing out something in a text face, than everyone with a computer and one hundred free typefaces is a graphic designer. all you are doing is making this paradigm more and more acceptable. <br><br>you may think i’m an idealist but we should all be maintaining these standards. their implementation helps guarantee that we all have&nbsp;jobs.</p>
