    html: '<p>You see Jay (W), that’s why I didn’t want to answer <br>You’ve done it again and the good people trying to ﬁnd a mark for a band are again bogged down with this issue which is irrelevant. A degree of wandering from the topic is one thing but this is getting silly. <br><br>As brieﬂy as possible: <br>Trademark is not <i>always</i> the correct term, esp. when trade is not the primary purpose. <br>In cases where trademark is not the correct term, logo may or may not be the correct term. <br>»webster is progressive <br>Yes and Oxford about as staid as they come, but both accept that logo is not restricted only to type. Oxford even goes so far as to suggest that logo isn’t always an abbreviation of logotype, but can be an abreviation of logogram etc. <br><br><span class="caps">BJ</span> »Steve is not incorrect in his Gutterball/they construction.  <br><span class="caps">BJ</span>, I don’t think Jay(W) has that in mind as the error. <br>I think that’s too subtle — he just hasn’t read the words properly, or he hasn’t grasped the idea of saying ‘this <i>may</i> be the case <span class="caps">BUT</span> I don’t think so’. He’s a serial misinterpreter, I think he uses miscomprehension as rant fuel or something <br><br><span class="caps">OK</span>, that’s enough. <br>Jay(W), answer this however you like, you tempted me into a reply before, I already wish I had gone with my instincts and ignored you. <br><br>Now, having used up lots of this thread on nothing, I’m going to give some more thought to the original question — ‘What typographic treatments lend themselves for eﬀective heavy&nbsp;metal-ness?’</p>'
