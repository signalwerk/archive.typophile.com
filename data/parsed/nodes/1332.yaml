    html: <p>hector,  why'd you read this thread and then waste even more of your time posting to it?  look at the top of your browser there's a back button. <br> <br>here are a couple of parts from a few reviews i thought some of you might be interested in. it's for a book by William A. Henry, titled "in defense of elitism". <br> <br>Published prior to the crescendo of criticism against affirmative action and related programs, William Henry's new book suggests an interesting interpretive framework. Put off by the excesses that result from extending good causes to the extreme, Henry focuses attention upon the dialectic between elitism and egalitarianism since World War II. In his view, egalitarianism has triumphed, thereby eliminating the creative tension between the two that fuels progress in American society and culture. To quote him, "the positive side of egalitarianism, the will to tolerance, [must be] coupled with the positive side of elitism, the intellectual suppleness to tolerate and accept diverse elements in society while holding firmly to one's own values'" to sustain the balance (194). With no check on its egalitarian tendencies, American culture loses the capacity to distinguish or to judge among alternatives. <br> <br>William Henry was a two time winner of the Pulitzer Prize (once for reporting, once for criticism) and served as Time Magazine's culture critic.</p>
