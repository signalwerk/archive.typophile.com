    html: "<p>\"Logo\" is defined generally as: <br> <br>\"A distinctive name, symbol or trademark of a company designed for easy recognition. [ &lt; LOGOTYPE.]\" (American Heritage Dictionary, Third Edition) <br> <br>As \"logo\" is derived from the word \"logotype,\" it's important to know that a logotype (in the context of a piece of type) could be a trademark, a stamp, a word, phrase or ligature set in a specific proprietary or nonproprietary typeface. Logos were often made into a single piece of type, hence the term \"logotype\". In modern usage, even a proprietary color used in a distinctive way can in some cases carry the effective and legal force of a logo in identity systems. Proprietary fonts are often employed in this manner as well. <br> <br>The Columbia Broadcasting System (CBS), for example, often omits its famous \"eye\" logo in printed or broadcast advertising when it would conflict with the design of the piece, instead relying on its use of Didot or other identifying elements to reinforce its corporate identity. (Philip B. Meggs, A History of Graphic Design, Second Edition, 1992, p. 381.) <br> <br>Here are some of Paul Rand's ideas on the subject of logos, taken from his book, \"Design Form and Chaos\" (1993): <br> <br>\"Here is what a logo is and does: <br>A logo is a flag, a signature, an escutcheon, a street sign. <br>A logo does not sell (directly), it IDENTIFIES. <br>A logo is rarely a description of a business. <br>A logo derives its MEANING from the quality of the thing it symbolizes, not the other way around. <br>A logo is LESS important than the product it signifies; what it represents is more important than what it looks like. <br>The subject matter of a logo can be almost anything.\" (p. 56. Parentheses and emphasis in original, uppercase substituted here for italics in original.) <br> <br>\"A street sign is a kind of logo. Trying to locate an unfamiliar street that has no marker is a bewildering experience. Whether the sign is beautiful or ugly, serif or sans, only the name matters. A logo and a street sign have this in common </p>"
