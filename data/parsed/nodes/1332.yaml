    html: <p>I'd like to clarify something. Even if only for myself. It isn't that I wholly disagree with you, Jay, concerning your opinion on type and logos (marks). From where I sit, as a designer, it would be best to always keep in mind the originality ,or lack thereof, of a logo I might design. However, it would do my boss no favor to spend more time than has been allotted per logo. So, if the client's budget is roomy enough for new type, then I would be nuts not to go that route. However, only <b>IF</b> the project necessitated it.</p>
