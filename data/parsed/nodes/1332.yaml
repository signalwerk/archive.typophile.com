    html: <p>darrel, i'm enjoying the debate as well (slow on this end too). i think everybody is secretly. <br> <br>i feel i've done a pretty good job of outlining elitism in design in many of my posts to this thread. but i can do it again. <br> <br>our world is one of hierarchies. i don't always love this i just accept it. i think you guys have misunderstood this or i haven't expressed it clearly. these hierarchies are alive and kicking in all human endeavors. what makes you think design is any different? what makes certain designers better? are they in fact "better" on some rudimentary level? or is it simply the opinion of a large segment.  <br> <br>what makes you a designer and not your client or your mom? you have a better skill set, training, sense, eye or whatever. the fact is that you are casting yourself into a position based on hierarchies. <br> <br>design is subjective. it's all opinion even the few concrete issues in design like legibility are opinion (though i doubt anyone here will admit it). legibility is the kosher opinion we can all throw around and take no heat for. because design is based on opinion it becomes subjected to elitism. it's a world of cool. we create cool or pander to it in most of what we do. the world of cool is one of the biggest realms of elitism. cool runs rampant through the industry.  <br> <br>this is the reality of the industry and i find little need to debate it. what would be an interesting debate though, would be, is elitism positive or not?  <br> <br>i pose the argument that a healthy dose of it is very good. it establishes high standards that allow some to excel and others to parish. this is the natural order of nature and the world. there is no need to fight it just join the game and enjoy it. take a strong part in it. high standards are what guarantee that you have a job. they make you the designer and not your client or your mom. wouldn't that be bad.</p>
