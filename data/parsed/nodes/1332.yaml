    html: <p>tiﬀany, budget is most certainly an important issue here but more important is the integrity of the client and designer. the fact is that with experience, custom display type and letterforms are really not that hard to produce. it takes a little while to become accustom to it but it is not very diﬃcult. as a matter of fact, i just ﬁnished up a trademark for a client and it took no more then 20 minutes for one mark. trust me, i’ve taught many students these same skills. it’s just a new way of working and seeing typography. you need to remove yourself from the computer for a few rounds. after a few revisions by hand, you can then move to the computer. the trick really is producing a couple of unique letterform directions that speak to the client and then focus your time on the pictographic elements. this is really no diﬀerent then how you would approach a trademark while using a text face. the diﬀerence is the time you would spend putzing around your type collection is spent producing letterforms that do a better job of describing your client in the long run. this is only one of many reasons why you should use custom letterforms. another is the fact that you can work out all the strange and interesting relationships between individual letters more ﬂuidly. a text face can’t do this as well. it’s letter combinations (except ligatures) are utilitarian. they need to work well with all other letters in the alphabet. the fact is that they don’t always do such a great job of this. custom letterforms work in and around each other accenting and stressing or pairing and diﬀerentiating with ﬂuid ease. this is why most of the best marks in design were produced in an era where designers could not be lazy. their only option was to produce trademarks by hand. in most cases if you could not do this you had trouble even pursuing a career in design. the computer has really not made this any easier. it has only illustrated the point that a text face is not a display face. <br><br>nad x, i’m glad you agree. but the fact is that even with so many text faces to choose from, a text face is still not a display face. realistically though, most people producing and using type are not very type literate and many of the cheesy “typefaces” out there, are in actuality display faces. if you have trouble producing your own type, many of these faces can work with some proper optical adjustments. these sorts of faces can also provide great inspiration. although i would never purchase a “typeface” from t-26, they do in fact have many creative ideas in regard to unique or interesting letterforms. my suggestion is to use these as creative inspiration but not as a ﬁnal design for a client. as far as the nike mark is concerned don’t give it to much credit. the spacings between the “n” “i” and “k” are way to small. that said, the fact is that this mark was most likely done in the way i have described. the version you are speaking of was designed prior to the computer revolution. just because a mark looks simple does not mean it’s execution was simple. masterful works usually only look simple. <br><br>as a last note (i think i already mentioned this) the use of the word logo is incorrect. logo is short for logotype. a logotype is a word mark. most trademarks are not just word marks. the correct term is trademark with the appropriate abbreviation being mark. this is more then just semantics. it’s like calling a bicycle a car. though both are forms of transportation a car is very diﬀerent from a bicycle. <br><br>sorry for the long post…  <br><br></p>
