    html: <p>&gt; what were you thinking, seriously, when you were making Brutaal? <br><br>Well, the name came ﬁrst, with no idea what the font would look like… Then I made a trip to Bangkok (friggin’ amazing place — that song is totally true — except it was four nights) and saw shapes I had never seen before*, I mean not in real life — interestingly I’d actually been drawing abtrast sketches with shapes like that since childhood, usually on restaurant napkins and stuﬀ (you know those restaurants that have tablecloths made of paper with crayons for kids to draw with? I go crazy with the red). <br><br>* (840K) <a href="http://www.themicrofoundry.com/other/wat.jpg" target="_top">http://www.themicrofoundry.com/other/wat.jpg</a> <br><br>Anyway, shapes like the ngao (those spiky things at the edges of roofs), but certainly the atmosphere of Siam (to use a now-politically-incorrect term) inspired me immesurably. Take a boat on the big, ﬁlthy Chao Praya, and you’ll feel the “cockroach crawling up your spine” — to use an Armenian expression. It all feels *real*, unlike so much in the West these days. Anyway. <br><br><span class="caps">BTW</span>, in my Daam Entity, Brutaal is the original concept, but Cristaal was actually made into a font ﬁrst, and then Domination Available (a name taken directly from an ad I saw in Thailand) was the lurid climax, so to speak. <br><br>hhp</p>
