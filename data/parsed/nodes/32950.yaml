      <p>Tiffany, could it be some sort of encoding issue?</p>
      <p><strong>Edit:</strong> Correction... I think it's more like what you said earlier -- your client may be using the Unicode version of Times New Roman. If I remember correctly, Times New Roman Unicode does have extra characters in it -- not as complete as Arial Unicode, maybe, but those phonetic characters might be in there. I can't confirm this since I am no longer at my old job, where I had a Mac <strong>and</strong> a PC... Sorry. Anyway, there is more info <a href="http://clagnut.com/blog/161/" target="_blank" rel="nofollow">here</a> and a complete TNR Unicode character chart <a href="http://vlado.fmf.uni-lj.si/seminar/fonts/times.htm" target="_blank" rel="nofollow">here</a>.</p>
