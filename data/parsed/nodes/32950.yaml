    <p>Help!</p>
    <p>I have a client writing a book/dictionary in Word on a PC. When I open it on my mac several of the phonetic characters disappear and an underline replaces it. When I open the file it doesn't ask for a font and it is using Times New Roman. Does Times New Roman on a PC have more characters than Mac? Thoughts suggestions ideas?</p>
    <p>Also, I'm suddenly realizing that I might need to use a different typeface for the book, a typeface which contains all the phonetics which might be used in a dictionary.</p>
