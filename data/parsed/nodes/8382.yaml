  html: <p>Hey all again its time for my newb question of the week. <br> <br>I am doing layout and it requires a 12 point type with (I would think) 14 leading.  Everything looks fine until I turn on "align to base-line grid" then every line is dramatically spaced.  But when I turn off i off (aling to base-line grid) it looks fine but of course the coloumns dont match up.  If I turn leading to 12 then it makes the spacing a little to close between the lines. <br> <br>Anyway, any help would be greatly appreciated.  Thanks.</p>
