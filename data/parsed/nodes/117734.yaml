      <p>"Medic"/"Florid" must be an <strong><a class="freelinking external" href="http://opti.netii.net/fonts-p/index.htm" rel="nofollow">OPTI Phillip-Bold / OPTI Phillip-Medium</a></strong> combination - probably manually compressed.<br>
      The original font (according to opti page) is <strong>Arnholm Sans</strong> but I can't find any digital version of it.</p>
      <p>"INTERNATIONAL" also looks like a manually expanded version of <strong>OPTI Phillip-Medium</strong></p>
      <p><strong>Warning!</strong>: When using OPTI/Castcraft fonts, be careful about quality and legibility issues, especially when you need a license for a commercial project. You can read more about Castcraft here:<br>
      <a href="http://luc.devroye.org/fonts-27506.html" title="http://luc.devroye.org/fonts-27506.html">http://luc.devroye.org/fonts-27506.html</a></p>
