      <p>Scala Sans is the closest match I can come up with:</p>
      <p><a href="http://www.myfonts.com/fonts/fontfont/ff-scala-sans/" title="http://www.myfonts.com/fonts/fontfont/ff-scala-sans/">http://www.myfonts.com/fonts/fontfont/ff-scala-sans/</a></p>
      <p>However, I suspect the reason why What the Font didn't produce a good match is that the type has been manually narrowed. It looks familiar, but doesn't match any of the common sans serifs with multiple weights.</p>
      <p>International is too small to make an accurate ID.</p>
