      <p>Yes, you have to transform the letters a bit, reduce the width to make them look condensed (another unofficial term is to "squeeze them"). In case of "INTERNATIONAL" you have to expand them i.e. increase the letter's width.</p>
      <p>As Bob said, I'm the software engineer behind <strong><a class="freelinking external" href="http://www.findmyfont.com" rel="nofollow">Find my Font</a></strong> application. Find my Font identifies the fonts of an image, either fonts you have on your PC or fonts included in our Online Database.<br>
      OPTI/Castcraft is not yet in our online database but we'll add it at approximately 15 days (on our next major font-database update).</p>
