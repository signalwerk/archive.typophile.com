    html: |-
      <p>Thnk you, it's very generous on your side…<br>
      It has some very interesting solutions, although some lowercase may be distracting in a full-lenghth text.</p>
      <p>Be careful: the UC-LC and UC-UC ligatures remain at capital-height when you activate "Caps to Small Caps", because you placed the [dlig] feature before the [c2sc]. You should either revise the features' order or design small caps ligatures. The problems seems solvable by just swapping these two features' order.</p>
      <p>EDIT: [smcp] needs also to be above [dlig] to avoid this problem.</p>
