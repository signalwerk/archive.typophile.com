    <p>Daphne, the result of my BFA project is being released free under a similar license that Jos Buivenga/exljbris uses.</p>
    <p><a class="freelinking external" href="http://www.arlovance.com/typecaste.php" rel="nofollow">Download Daphne</a></p>
    <p>I'd love to get any response/comments, images of it in use, etc.</p>
    <p>I'm working on an italic right now (doing the roman only far exceeded the requirements of the project and my time limits)<br>
    Eventually, I'm hoping to release a couple more weights: bold and light. </p><div class="imageWrap"><img src="http://typophile.com/files/daphne_6076.jpg"></div><p></p>
