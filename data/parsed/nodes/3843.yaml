  html: '<p>Here are 2 excellent workshops with spaces still available as of 11-4-02... <br>John Downer on signwriting and <br>Carl Rohrs on brush lettering German typefaces. <br> <br> <br>Society of Scribes presents: <br> <br>"An Evening with Carl Rohrs"  <br>Friday, November 8 <br>School of Visual Arts Annex <br>214 East 21st Street <br>6:30pm to 9:30pm <br>$10 members / $15 non-members  <br> <br>A slide lecture of German typefaces will be covered: the cross influence of <br>calligraphy on type and type on calligraphy. Focusing on typefaces from all <br>over Europe done mostly in the 1930â</p>'
