    html: |-
      <p>What’s particularly strange about the whole thing is that in many ways the gov’t has gone so far overboard in protecting copyright the past few years, with the DMCA and such. Then it comes out with the orphan works act, which I thought was a breath of fresh air (for them to recognize the problem of so many 20th century creative works being lost) until I actually read it.</p>
      <p>It does nothing to clear up any of the rights on old material with uncertain ownership, and does plenty just to make creating new work a hassle.</p>
