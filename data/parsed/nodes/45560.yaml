    <p><a href="https://web.archive.org/web/20081011012618/http://www.designobserver.com/">Design Observer</a> has been posting links about reactions to the Orphan Works bill now before Congress. This bill, if passed into law, would modify the existing copyright law.</p>
    <p>Read Lawrence Lessig’s Op-Ed piece, in today’s New York Times, <a href="https://web.archive.org/web/20081011012618/http://www.nytimes.com/2008/05/20/opinion/20lessig.html?_r=2&amp;ref=opinion&amp;oref=slogin&amp;oref=slogin">here</a>.</p>
    <p>Hear illustrator Brad Holland talk about it <a href="https://web.archive.org/web/20081011012618/http://youtube.com/watch?v=CqBZd0cP5Yc">here</a>.</p>
    <p>Detailed analysis <a href="https://web.archive.org/web/20081011012618/http://capwiz.com/illustratorspartnership/issues/bills/?billid=11320236">here</a> and <a href="https://web.archive.org/web/20081011012618/http://capwiz.com/illustratorspartnership/issues/bills/?bill=11322171">here</a>.</p>
    <p>Do something <a href="https://web.archive.org/web/20081011012618/http://capwiz.com/illustratorspartnership/home/">here</a>.</p>
