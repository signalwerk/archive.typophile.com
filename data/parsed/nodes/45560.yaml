      <p>I’ll add a link to an alternative take on this here:<br>
      <a href="https://web.archive.org/web/20081011012618/http://danheller.blogspot.com/2008/05/my-take-on-orphan-works-act-of-2008.html" title="http://danheller.blogspot.com/2008/05/my-take-on-orphan-works-act-of-2008.html">http://danheller.blogspot.com/2008/05/my-take-on-orphan-works-act-of-200...</a></p>
      <p>Also, remember that *currently* US law is such that *unless your work is registered you’re only entitled to actual loss*. No legal fees, no punitive damages. There’s more on this here:<br>
      <a href="https://web.archive.org/web/20081011012618/http://duncandavidson.com/2008/04/the-copyright-conspiracy.html" title="http://duncandavidson.com/2008/04/the-copyright-conspiracy.html">http://duncandavidson.com/2008/04/the-copyright-conspiracy.html</a></p>
      <p>Both of the links above relate to photography, but should be equally applicable to creative works in general.</p>
