      <p>I’m not a lawyer, and perhaps I misunderstand something in the proposed  new law.</p>
      <p>My impression is that the prospective law makes it such that “even if your work is registered, you’re only entitled to actual loss.”</p>
      <p>It seems like there is no incentive whatsoever under this would-be law for anybody to contact or pay a rights holder. After all, the worst thing that can happen is they will come after you, and then you can just offer them the usual reasonable payment, and they’ll just take it, because there are no additional penalties.</p>
      <p>Or am I misunderstanding something there?</p>
      <p>T</p>
