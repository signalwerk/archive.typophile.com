      <p><cite>It seems like there is no incentive whatsoever under this would-be law for anybody to contact or pay a rights holder</cite></p>
      <p>If I understand it correctly this will all come down to what is eventually considered to be a “diligent effort” to find the rights holder. If the “diligent effort” is more expensive then just calling the rights holder to begin with, it will make sense, assuming that rights holders are actually able to track down and sure violators. Given how few creative types could actually afford the legal fees involved, you’re probably right…</p>
