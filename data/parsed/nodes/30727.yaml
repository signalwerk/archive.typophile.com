    <p>I'm creating a very detailed font and I'm not able to get enough detail in with an em square of 1000 in fontlab. The points get mangled in some spots where they can't sit in the location they should be in.</p>
    <p>If I move up to a em of 2048, will I still be able to output the files as postscript or will that cause technical problems?</p>
    <p>I would like to release this font as a CFF flavored OpenType font.</p>
    <p>Thanks,<br>
    Matt</p>
