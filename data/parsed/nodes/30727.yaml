      <p>David, </p>
      <p>even 16,384 is possible in FLS5. It's just that you may run into problems when your glyph coordinates exceed 65,535 during the design process, as your glyphs will be destroyed. </p>
      <p>4,000 and 4,096 are perfectly safe for OpenType TT, but for OpenType PS you need to make sure that none of your point coordinates exceed ±4,095. </p>
      <p>A.</p>
