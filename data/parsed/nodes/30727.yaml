      <p>William, </p>
      <p>Font Audit checks for situations that *may* indicate a mistake. Sometimes, people put two nodes next to each other by mistake but then don't notice it. The font gets produced with this unintentional quirk in the outline. The quirk is never harmful, but if unintentional, it's certainly ugly. And can get noticed if the letter is printed in a huge size, or cut in vinyl for example. </p>
      <p>However, it some cases, like that suggested by Lucas by the way of Nick, such outline quirks may be intentional. Font Audit has no way of knowing the designer's intention, so it flags various situations that may indicate a problem. </p>
      <p>I remember when I installed FontLab Studio on Matthew Carter's computer and was showing it to him, we opened one of this typefaces (I think Mantinia). I was walking through the glyphs and in one of them, there was the red Font Audit arrow. Matthew got very curious: "Oh, what it that?" So I explained him what Font Audit is, and then I clicked on the arrow to show the description of that particular problem. Matthew read the description, thought for a few seconds and said: </p>
      <p>"I don't think so." </p>
      <p>That basically sums up on what you should do with Font Audit warnings: read it, think about it, and make up your own mind. </p>
      <p>Best,<br>
      Adam</p>
