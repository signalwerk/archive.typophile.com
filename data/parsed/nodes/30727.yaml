      <p>I have a need for high precision as well so I had an email exchange with FontLab about this issue a couple of weeks ago after noticing the FogLamp manual had specific information about the UPM that was missing from the FontLab Studio manual. The reply:</p>
      <p>"FogLamp manual does say that OpenType TT fonts can have a UPM of up to 16,000 although FontLab Studio only supports 10,000. That's true for OT PS as well. FontLab theoretically supports 10,000 but according to Yuri Yarmola (our chief programmer) it is not recommended to set UPM to more than 4,000. This may cause value overflow problems with certain math operations in FontLab."</p>
      <p>In a followup email he also said that FontLab would consider enabling support for 10,000 UPM if I could prove I really needed it. I don't have a need for it and I feel certain that applies to 99% of us.</p>
      <p>For text fonts, a maximum 4,000 UPM will work just fine -- attaining high precision is easy to do. So I am happy with the 4,000 number.</p>
      <p>It also helps to know that when generating a font, FontLab Studio retains the precision in the finished font of whatever UPM you digitized to, unlike Fontographer which rounds down to 1,000 UPM at generation time even in the most current version from FontLab.</p>
