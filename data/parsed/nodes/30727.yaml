      <p>For the sake of completeness: </p>
      <p>I have just tested FontLab Studio and found out that internally (in .vfb) it's possible to have an UPM size up to 32,767. The glyph coordinate limit is from –32,768 to +32,767. It's easy to find out yourself: if you put a point at x=32,767 and move it one unit to the right, it will pop up at –32,768. </p>
      <p>A.</p>
