      <p>Adam wrote: <em>Adobe’s recent complex-script fonts (Adobe Arabic, Adobe Hebrew, Adobe Thai) are OpenType PS and use a 2048 UPM.</em></p>
      <p>Actually, only the Adobe Arabic fonts have a UPM of 2048, the Hebrew and Thai have UPMs of 1000. My approach is to tailor the UPM to the design. If I can accurately represent a design using a UPM of 1000, I will do so because there will be fewer point coordinates with four digit values and hence the size of the font file will be smaller. In the case of the Adobe Arabic, the designer Tim Holloway felt that he needed that larger UPM size to achieve the refinement he wanted, and since he is used to thinking in a 2048 em, having now worked on a number of fonts with that UPM, we settled on that.</p>
      <p>In another project I am working on, I'm using a UPM of 4096, because that's what I feel is necessary to accurately represent the complexity of the design.</p>
      <p>The great thing about TT/OT with regard to the em square is that it does allow this flexibility, and means that the design does not need to be forced into a standard grid. Unfortunately, some font companies have settled on a standard em square, usually 1000, and although this makes sense in terms of converting existing PS Type 1 font data, it seems to me an unnecessary and unwelcome restriction to apply to new designs.</p>
