      <p>Matthew, </p>
      <p>for both OpenType PS (.otf) and OpenType TT (.ttf), you can use a UPM size anywhere up to 16,384, though the PostScript specification recommends that no glyph coordinates should extend the range -4000 to +4000. Adobe’s recent complex-script fonts (Adobe Arabic, Adobe Hebrew, Adobe Thai) are OpenType PS and use a 2048 UPM. </p>
      <p>But you’re in no way limited to 1000 and 2048. You can use 1024, 1500, 2000, 2048, 2382, 3000, 3420, 4000 or whatever you like as UPM size. Doesn’t matter. </p>
      <p>The only limitation I was able to find so far is that for OpenType PS fonts with the UPM size other than 1000, the text cursor in InDesign CS (and older versions) would appear of wrong size (i.e. for a 2000 UPM font, if you select some text, on screen only the bottom half of the text will be selected and for a 3000 UPM font only the bottom third). But that’s only a cosmetic screen display problem and it has been fixed in InDesign CS2. </p>
      <p>Adam</p>
