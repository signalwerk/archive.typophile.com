  html: |-
    <p>I tried posting this on my personal blog/site and it crashed in a really nasty way — repairing that is going to take ages. As well as other things.</p>
    <p>The thing is: my girlfriend passed away on July 7, on the 52d day in hospital and care — a second brainstem stroke proved to be unsurmountable (is that a word?). I don’t have words for how I feel about this (and somehow I still have to share…).</p>
    <p>So now I am designing cards and ads featuring ‘her’ font: National Light (are you reading this, Kris?).</p>
    <p>Miep Jukkema<br>
    1954–2012</p>
    <p><a href="http://www.miepjukkema.nl" title="www.miepjukkema.nl">www.miepjukkema.nl</a> (that’s still running ok)</p>
