      <p>A difficult genre—can look stuffy and quaint, but its nice fit gives Winco edge.<br>
      And the “some serifs” on c and s give it a distinctive personality.<br>
      Winco compares well with recent glyphic releases Carter Sans and Ideal Sans.<br>
      I haven’t seen any commercial use of either of those well-publicized faces, so I hope Ramiro’s does better.</p>
