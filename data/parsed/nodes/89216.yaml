    html: |-
      <p>Hi there,<br>
      I've been thinking on the 'incise' genre. When you take a look to the most relevant examples of this category (Optima, Pascal, etc.) one thing is evident: they have roman faces's contrast (high). I think, in a way, they are unfair to their sans nature, or maybe too ambiguous. After all, when you choose a sans is mostly because you need robustness and a modern look.<br>
      When I designed Winco I avoided high contrast. I just wanted a sans with attitude and quirkiness, and exploring expressionism and forgotten book jacket alphabets was a way find the creative framework.<br>
      In my opinion Winco leans more toward some humanist sans with modulated strokes like, for example, FB Productus.</p>
