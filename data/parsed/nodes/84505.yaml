    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Steve Matteson_5640.JPG"></div><p></p>
    <p>&nbsp;<br>
    <strong>Branding Through Custom Typography</strong></p>
    <p>When: Tuesday, August 16th, 4:00-5:00 PM Eastern</p>
    <p>Please join Monotype Imaging’s Creative Type Director, Steve Matteson, for a free HOW Magazine DesignCast titled “<a href="http://www.howdesign.com/designcasts/" rel="nofollow">Branding Through Custom Typography</a>.”</p>
    <p>Register for free <a href="https://www1.gotomeeting.com/register/798827097" rel="nofollow">here</a>.</p>
    <p><strong>About the DesignCast</strong><br>
    For his DesignCast presentation titled “Googley Fonts - Custom Type Design as Brand Touchpoint,” Steve will discuss how typefaces are a critical tool for creating a brand voice. Used properly, type will maintain a positive connection between a product and a user – particularly in an interactive setting. Steve Matteson, creative type director for Monotype Imaging, is a designer of typefaces for brands such as the Microsoft® Xbox® video game console and the Google Android™ operating system, for which Steve designed the Droid™ fonts. Steve will reference these projects in his presentation, as he discusses why type is important, what goes into the type design process and what the challenges can be when creating typefaces for electronic media.</p>
    <p><strong>About Steve Matteson</strong><br>
    Steve Matteson is the creative type director for Monotype Imaging. A 1988 graduate of the School of Printing at Rochester Institute of Technology, Steve found his passion for type and typography among the historic collections of books, metal type, type-casting equipment and printing presses. In 1990, Steve was hired by Monotype Typography as a contractor to aid in the production of Microsoft's first TrueType® fonts. Having already spent more than two years mastering the hinting algorithms of a similar technology for another company, TrueType was an easy transition. He produced fonts for customers such as Apple, Hewlett-Packard and Microsoft. Working on the technical aspects of type has helped Steve fuel his ambition to design new typefaces. One of his early projects was a revival of Frederic Goudy's Truesdell™ design, completed in 1993. These were quickly followed by the Andalé® screen font design for mainframe terminal emulation, in addition to the Blueprint™, Fineprint™ and Goudy Ornate™ typefaces, as well as user interface fonts for the original Xbox, the Windows Vista® platform and Android OS. Some of Steve’s more recent creations include Endurance™, Miramonte™ and Bertham™ designs. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>.</p>
