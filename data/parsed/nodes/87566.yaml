    <p>I'm currently developing a typeface for a company rebrand... it is similar in style to 'Konstruct Square' -</p>
    <p><a href="http://www.fonts.com/findfonts/detail.htm?productid=475162" title="http://www.fonts.com/findfonts/detail.htm?productid=475162">http://www.fonts.com/findfonts/detail.htm?productid=475162</a></p>
    <p>This will primarily act as the main font for the logo and any headings but I was curious what people's opinions would be for a good secondary typeface, that would compliment this one when used alongside for body text?  My initial thoughts are a mono-space typeface. </p>
    <p>I admit this is potentially a very open question and has endless options for choice... but think of it in terms of - you have this 'squared' typeface what would be your initial choice for pairing with it.</p>
