      <p>No, I’m afraid in this context I think skipping the bulk of the text <em>is not so natural</em>. After all, it’s not a corporate website that you’re reading. If I go to the trouble of writing something it's because I really do think it's important for the question I am posing. If you don't want to read it, that’s absolutely fine. Simply don't answer. No one is forcing you. You are free to leave and spend your time on anything more worth your while.</p>
      <p>Yes, I actually <em>was trying</em> to make it as easy as possible for others to help me. Perhaps what I did was not sufficient in your opinion but that doesn't warrant a rude answer on your part. Whatever I might do wrong, I do out of ignorance, not out of ill will. You could have written one line of text politely suggesting I change my approach. It would have been the same effort on your part. You see, some of us come here humbly hoping to gather a few tidbits of knowledge and I assure you we really are fully aware of our shortcomings. I want to be better and I want to learn more about your profession and I want to use typefaces properly. One would think people in your line of work would appreciate that. I don't expect to be treated with sarcasm just because I'm not an expert like you. Whether your comment was a reasonable critique or not, the sarcasm is completely out of place. How will your work ever be properly appreciated if you don’t nurture those who approach you?</p>
      <p>The next time you see me post a question please consider this: I understand that your answer is free, but if it's rude and it's not helpful, I think I'll be able to live without it.</p>
      <p>Now, to end this in a more positive way, I'd like to thank you for explaining the line-by-line comparison. From now on I promise <strong>I'll follow your suggestion in an effort to not waste your time or anyone else's</strong>.</p>
      <p>Also, to take this a bit further, I'm wondering if it might be helpful to post some guidelines like this for newbies like me. They could be included in "PLEASE READ: Typophile Forum Posting Guidelines" or in a similar post. Perhaps there are a few recurring questions that could be answered more easily if such guidelines existed. Would it be a good idea to ask the community about this? Would it save you time?</p>
