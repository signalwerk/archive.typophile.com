      <p>@ Mr. Shinn:<br>
      First of all, thank you for being so helpful. As usual.<br>
      Second, you have small sizes in the four PDFs I linked to. Usually PDF specimens have small sized text, you know. Clicking on a link isn't that hard. I added the screenshot as an extra courtesy. I thought maybe it would be helpful to see the letters more closely. I imagine a trained eye can tell a lot about a face from just seeing how the letters are constructed?<br>
      Third, if you go to myfonts you can look at them however you want. Myfonts usually saves in your browser whatever settings you last used in their font specimen tool so if you go there you can look at the font with your own preferred settings with no additional effort on your part.<br>
      Fourth, I am a novice. If you really want to respond to my question and are too lazy to click on anything at all to see the kind of specimen you want, then be kind enough to recommend the type of screenshot you would like to see and perhaps that way I can actually learn something from you. Is it long paragraph text? Are there any specific words you usually use in a sample to evaluate legibility?<br>
      Fifth, if I wanted to judge these faces solely on the base of legibility then I would have asked it that way. But I didn't, did I? My question was general from the start. It is in bold. The part about 14-18px is not. I'm curious about anything that pops into the mind of an experienced typographer when looking at these faces: personality (Does one strike you as more neutral? Does one look more antiquated?), flexibility (Does one strike you as more of a workhorse? Does one look like it would be easier to combine with other faces?), etc. So it is not all about legibility.<br>
      Sixth, of all the people in the forums you are certainly one of the least generous and constructive. You remind me of certain bad teachers I had at university. All that wasted knowledge. I am sorry I ever bought one of your fonts and I never will again.</p>
