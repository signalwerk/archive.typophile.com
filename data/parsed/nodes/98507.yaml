      <p>May I just request, as both a developer and a reader, that you please endeavour to avoid the all-too-common mistake of specifying web text in absolute pixel sizes?  A fixed pixel size is quite likely to be either unreadably tiny or unattractively huge (more likely the former) on anything other than the particular range of display formats which use a DPI value close to the designer's.</p>
      <p>My laptop, for example, has a display resolution of 120 DPI, and I'm constantly plagued by tiny flyspeck text on websites.  I can only imagine what users of these new 200-300-odd DPI screens have to deal with.</p>
      <p>If you really must use a fixed size of text, IMO it's better to use points rather than pixels, because (at least in theory) that should be translated to display DPI.  I wouldn't recommend even that, however: many browsers actually map point size to a fixed pixel size (which is utterly broken behaviour, but that doesn't stop them, alas); also not all computer screens have an accurate DPI configuration.  (I've seen 15-inch notebooks with 1600x1200 pixel screens which generally come out to more than 130 DPI physically, but are often configured for only 96 or 120, so everything comes out smaller than natural.)</p>
      <p>As a rule, I always use relative scaling for text when I'm designing web pages myself.</p>
