      <p>What you can do is to grab the free styles of each family offered at MyFonts, and drop them into the Web-font testing tool ( <a href="http://www.impallari.com/testing/" title="http://www.impallari.com/testing/">http://www.impallari.com/testing/</a> ) and see for yourself.</p>
      <p>Cala, for example, will give you a 8 pixels x-height when set at 16px on the web.<br>
      It's not the ideal (a 9 pixels x-height will be better) but it's also not bad at all.<br>
      If you use it for web body text, set it at 17 or 18 pixels and it will look better.<br>
      They also work well for headlines.</p>
      <p>They all seem to be very good and well made fonts.</p>
