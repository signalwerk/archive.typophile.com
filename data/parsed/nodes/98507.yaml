      <p>Pardon me for being so lazy Andres.<br>
      I didn’t read all your post, just the ﬁrst paragraph about web type, then looked at the pictures and jumped to the conclusion that they were what you wanted an opinion on.<br>
      You said, “Help me compare these four lovely faces” and showed four images—so I would say my response in skipping the bulk of text is quite natural.</p>
      <p>You’re asking people for their professional opinion, for free, so why not make it as easy as possible for them to help you? Why should I have to click on links and download PDFs? That’s too much like real work!</p>
      <p>You seem to be familiar with my posts here, so you should know that I post a lot of images in threads, and like to see discussions visually illustrated within the context of a thread, so that there is a coherence to them, and people are not required to wander off into hyperlink space and get lost browsing. And I usually make a point of asking to see a typeface in context, rather than an alphabet showing.</p>
      <p>Now you may think that the comments I’ve just made are not “generous” or “constructive”, but I think they are a reasonable critique of your post.</p>
      <p>For comparison of types in alphabetic layout, it would be better to show them line by line, like the following, so that the viewer can appraise them without having to look back and forth great distances:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Four_3596.png"></div><br>
      And rather than an alphabetic comparison, a word or two would give a better feel of the typeface.<p></p>
      <p>(Thanks for your comment, Hrant.)</p>
