    <p>Hi everybody!</p>
    <p>I'm a web designer learning to care more about type. I'm going to buy some serif fonts for use on websites. I've seen several by Dieter Hofrichter that seem to have an affordable price, a contemporary feel, good quality and will also look good in display sizes.</p>
    <p><strong>Given the list below, what you think the pros and cons of each might be compared to the others?</strong> Keep in mind that, although I'll be buying both a print and a webfont license, I'll mainly be using them for web sites. That includes body text at a 14-18px size.</p>
    <p><strong>Cala</strong><br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/hoftype/cala/" rel="nofollow">At MyFonts</a><br>
    <a class="freelinking external" href="http://www.hoftype.com/sites/default/files/media/pdf/PDF-Cala.pdf" rel="nofollow">PDF at Hoftype</a></p>
    <p><strong>Carat</strong><br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/hoftype/carat/" rel="nofollow">At MyFonts</a><br>
    <a class="freelinking external" href="http://www.hoftype.com/sites/default/files/media/pdf/PDF-Carat.pdf" rel="nofollow">PDF at Hoftype</a></p>
    <p><strong>Sina</strong><br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/hoftype/sina/" rel="nofollow">At MyFonts</a><br>
    <a class="freelinking external" href="http://www.hoftype.com/sites/default/files/media/pdf/PDF-Sina.pdf" rel="nofollow">PDF at Hoftype</a></p>
    <p><strong>Sina Nova</strong><br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/hoftype/sina-nova/" rel="nofollow">At MyFonts</a><br>
    <a class="freelinking external" href="http://www.hoftype.com/sites/default/files/media/pdf/PDF-SinaNova.pdf" rel="nofollow">PDF at Hoftype</a></p>
    <p>I've printed out the PDF samples and I keep staring at them but I just don't have enough expertise to properly compare them beyond obvious things like x-height.</p>
    <p>Here is screenshot for those of you feeling too lazy to click around:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hoftype_fonts_3530.png"></div><p></p>
