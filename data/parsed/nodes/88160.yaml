    html: |-
      <p>In FontLab, it’s very simple to do that:</p>
      <p>Edit &gt; Font Info &gt; Names and Copyright &gt; Family Name</p>
      <p>All Fonts should have exactly the same Family Name and their appropriate Weight Names. The Font should appear with a correct drop-down menu now.</p>
