    html: |-
      <p>The practice of using a single space after the period goes back to ye Olden Dayes of dedicated phototypesetting. These machines DID NOT strip double spaces so, in order to prevent the following scenario, a single space after a period became the norm.</p>
      <p>If a single space following a period fell at the end of a line, the space became a line break. If a double space after a period came at the end of a line, one or the other of the spaces became a line break, which meant that there was an additional, unwanted space either at the end of the first line or at the beginning of the second.</p>
    html_clean: |-
      <p>The practice of using a single space after the period goes back to ye Olden Dayes of dedicated phototypesetting. These machines DID NOT strip double spaces so, in order to prevent the following scenario, a single space after a period became the norm.</p>
