    html: |-
      <p>As I mentioned before in a similar thread, kerning of the difficult cap-lowercase combinations (in Linotype two-letter "logotypes" at first) rendered "double spacing" unnecessary.</p>
      <p>Previously, if only a single space occurred before a "T_o" or similar combination, that didn't sufficiently associate the capital with its word.</p>
      <p>Even today, double-spacing improves the appearance of certain types that have kerning between the space and letter characters. For instance, when the period at the end of a sentence is kerned under an "f", and the following sentence begins with a T.</p>
