    html: |-
      <p>you know what was interesting about that slate article?</p>
      <p>most articles there, especially from the writer who did<br>
      this one, draw a few hundred comments, after a while.</p>
      <p>this one had a thousand comments  right off the bat,<br>
      and the total count has since climbed to over 2200...</p>
      <p>so people obviously _care_ about this issue!  really!</p>
      <p>-bowerbird</p>
      <p>p.s.  and -- at least at the start -- the overwhelming<br>
      majority of posters said "i use two, and i ain't changing".</p>
