    html: "<p>The break between one sentence and the next is already clearly indicated by not one but two conventions: a fullstop at the end of one sentence, and capitalisation of the beginning of the next. That's already one more indicator than most other textual divisions. There's absolutely no need to add a third indicator by doubling the word space.</p>"
