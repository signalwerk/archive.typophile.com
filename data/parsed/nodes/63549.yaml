    html: |-
      <p>I was just having a look at Appendix F of Knuth's <cite>The TeXbook, Computers and Typesetting</cite> and, even if TeX "ignores spaces" in the input, TeX fonts contain a parameter that fixes the extra space added to the interword space at the end of a sentence. For the Computer Modern (10pt) font, the interword space is 3.33pt, and the extra space is 1.11pt; however, for the Computer Modern Typewriter font, the extra space is equal to the interword space, 5.25pt, giving in fact two spaces after a period. Here is how it looks with LaTeX. The inputs are essentially the same, one with \textrm (Roman font), the other with \texttt (the typewriter font):</p>
      <p>Input:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hwlatex_5207.jpg"></div><br>
      Output:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/hwlatexout_3733.jpg"></div><br>
      Michel<p></p>
      <p>[added] The number of spaces in the input is irrelevant. Many spaces give the same output as one space.</p>
