    html: <p>I agree with no extra space, but I think it is more a matter of custom, and less of principle, than I thought the first time around on this topic. For example, John, you could argue that within a sentence an abbreviation with a period can be followed by a cap, so to distinguish sentences definitively extra space helps. To me the holes it puts in the text are unattractive, so I go for keeping the current rule of no extra space between sentences. But as I say, I suspect it is more what I am used to reading, rather than a matter of principle.</p>
