    html: |-
      <p>&gt;That double space is a purely American habit</p>
      <p>The practice of double spacing after periods is in the US known variously as "English" or "French" spacing, and has been common at one time in those countries, as well as the US. It is not an American habit today, as most style guides, I believe, are against it. The one Christopher refers to is an outlier. I also can't remember ever seeing printed material like that. It used to be standard practice in typewritten material, where it has some rationale. </p>
      <p>For some of the story you can read the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Double_spacing_at_the_end_of_sentences" rel="nofollow">Wikipedia article on double spacing.</a></p>
      <p>ps I see in Harry Carter's "View of Early Typography" that a hand manuscript of 1450 has wide spacing between sentences, and the famous Berner sheet of Garamond has many sentences spaced very widely.</p>
    html_clean: |-
