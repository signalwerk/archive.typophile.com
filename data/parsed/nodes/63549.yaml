      <p>JH&gt;There’s absolutely no need to add a third indicator by doubling the word space.</p>
      <p>All depends on whether the emphasis is on reading or editing.<br>
      For reading, you're right. It's ridiculous. But for marking it up by hand during editing, it might make it easier to mark off a particular sentence without messing up the next.<br>
      That might be the thinking, as strange as it might seem.<br>
      Giving ease of editing precedence over the readability of the finished product.<br>
      APA also calls for double spacing. Also silly in the final product. But when you're editing on paper, that extra space comes in mighty handy.<br>
      (I do quite a bit of editing of APA papers.)<br>
      That said, it's not going to be enforced by anyone or anything. In spite of what v6 might say. APA-specific software doesn't enforce it and those apps don't get upgraded too often.</p>
