    html: <p>What Americans call a "period" is known in Britain as a "full stop".  In British usage a comma, being a partial stop is followed by a single space.  The full stop  takes two spaces  both to differentiate and emphasise. This was of importance when typesetting was less precise that it is now and text was set quite tight.</p>
