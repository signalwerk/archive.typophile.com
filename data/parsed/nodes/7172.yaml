    html: "<p><a href=\"https://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=LH.108056.0.0\" target=\"_blank\">Madame</a>, the ultimate circus font: <br><a href=\"https://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=LH.108056.0.0\" target=\"_blank\"><img src=\"http://www.typophile.com/forums/messages/83/51351.gif\" alt=\"\"></a> <br>Its forms are so complex it was digitized so characters are built  <br>with several keystrokes each. I'm not sure what limitations  <br>required this technique back when it was made, but I'm pretty  <br>sure it could be recreated today as a one-character-per-keystroke  <br>font and work/print fine. Get on this, Linotype!</p>"
    html_clean: "<p><a href=\"https://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=LH.108056.0.0\" target=\"_blank\" class=\"link-external\">Madame</a>, the ultimate circus font: <br><a href=\"https://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=LH.108056.0.0\" target=\"_blank\" class=\"link-external\"><img src=\"http://www.typophile.com/forums/messages/83/51351.gif\" alt=\"\"></a> <br>Its forms are so complex it was digitized so characters are built  <br>with several keystrokes each. I'm not sure what limitations  <br>required this technique back when it was made, but I'm pretty  <br>sure it could be recreated today as a one-character-per-keystroke  <br>font and work/print fine. Get on this, Linotype!</p>"
