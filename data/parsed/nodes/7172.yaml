    html: <p>Dan Solo is your man. For one, he's got a <a href="http://store.doverpublications.com/0486261557.html">book</a> listing a hundred such fonts. Many are also available in digital format, including <a href="http://www.myfonts.com/fonts/solotype/flo-barnum/">Flo Barnum</a>, <a href="http://www.myfonts.com/fonts/solotype/vanadium">Vanadium</a>, and <a href="http://www.myfonts.com/fonts/solotype/bindweed/">Bindweed</a>. Also try <a href="http://www.myfonts.com/fonts/bitstream/p-t-barnum/">P T Barnum</a> from Bitstream. <br> <br>Hope this is what you were looking for!</p>
