  html: <p>Like a font but have no idea what it's called? Then try the <a class="freelinking external" href="http://new.myfonts.com/WhatTheFont/" rel="nofollow">WhatTheFont!</a> font identifier by <a class="freelinking external" href="http://new.myfonts.com/" rel="nofollow">MyFonts</a>! Simply take a screenshot or image of the font, upload the image, choose the glyphs, and it will tell you what typeface it is!</p>
