    html: <p>Ooooh, many, but I'll restrict myself to a couple of lesser known options. <br> <br><a href="http://www.psyops.com/html/spec_oxtail.html" target="_blank"> Oxtail</a> is subtly different, a contemporary take on Clarendon. <br> <br><a href="http://www.mvbfonts.com/html/fonts/fantabular/pk_fantabular.htm" target="_blank"> Fantabular</a> is monospaced, which opens up a lot of design possibilities. <br> <br><a href="http://www.stonetypefoundry.com/html_pages/SilicaOverview.html" target="_blank"> Silica</a> is an often overlooked little gem by Sumner Stone. <br> <br><a href="http://thirstype.com/fonts.php?font=ApexSerif" target="_blank"> ApexSerif</a> is so contemporary it hurts. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><a href="http://www.t26.com/fonts/display.php?f_id=255" target="_blank"> Charifa</a> is very geometric, inspired by Bauhaus. <br> <br><a href="http://www.t26.com/fonts/display.php?f_id=789" target="_blank"> Aminta</a> is a re-interpretation of the typewriter style. <br> <br><a href="http://www.t26.com/fonts/display.php?f_id=570" target="_blank"> Barbera</a> is nice'n'quirky. <br> <br><a href="http://www.t26.com/fonts/display.php?f_id=452&amp;dw=237" target="_blank"> Aurea Ultra</a> has only one weight, but with a killer italic. <br> <br>Tell me if you need more options.</p>
