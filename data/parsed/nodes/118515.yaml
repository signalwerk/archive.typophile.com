    html: |-
      <p>There is also Tasmin by David Crosby. I don't know who copied whom.<br>
      Previous discussion <a href="http://typophile.com/node/107791" title="http://typophile.com/node/107791">http://typophile.com/node/107791</a></p>
      <p>I have no info on the origin of the pre-digital font, other than that Dan X. Solo gave the name of Tasmin to this design, which he may have purchased as metal type.</p>
      <p>This Art Nouveau design is a variation on Quaint by the Dickinson Type Foundry of Boston. Aka Desdemona by Karl Brendler &amp; Söhne of Vienna.<br>
      Desdemona <a href="http://luc.devroye.org/KarlBrendler+Soehne-Desdemona.jpg" title="http://luc.devroye.org/KarlBrendler+Soehne-Desdemona.jpg">http://luc.devroye.org/KarlBrendler+Soehne-Desdemona.jpg</a> Both are circa 1900. I don't know which came first. Several good digital versions.<br>
      Don</p>
