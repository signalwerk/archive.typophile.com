      <p>Original name should be <strong>Tasmin Bold</strong>. It should appear on Dan X Solo 1979 collection "Sans Serif Display Alphabets" (p. 96).<br>
      I know there's a freebie floating around but can't say about its legitimacy. Note it also carries the other /S (not the one of your sample).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tasminbold_5551.jpg"></div><p></p>
