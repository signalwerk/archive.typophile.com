    html: "<p>This cannot be answered in a short forum thread. There are some many variables. You may be able to find a purely technical checklist, but then again this list may not be applicable to all cases. Sometimes even discarding the technical standards may be the best and only reasonable choice. You have to consider the medium and the task at hand: a typeface suitable for H Melville's <em>Moby Dick</em> won't necessarily be a \"good\" choice for a newspaper headline or a website. And, you cannot forget that the stylistic trends change all the time. So, what makes a \"good\" or \"bad\" typeface? The answer is: \"it depends\".</p>"
