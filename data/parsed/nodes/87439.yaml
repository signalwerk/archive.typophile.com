      <p>Bad in what way?</p>
      <p>I recently used a (free) typeface which had received quite a few favorable comments here on Typophile,. It worked well aesthetically for the intended purpose, but, being curious and able to do so I took a look at in FontLab, where I found that the way it had been drawn was simply appalling. Nodes on top of nodes, radii that resemble rough-cut circular saw blades and worse. </p>
      <p>That's one way of being bad. </p>
      <p>For me, that's the only real way a typeface can be bad, aside from one for which the designer makes ridiculous, unreasonable and unsupportable "scientific" claims of superior performance in some way similar to Tiresias, that dyslexia font, or that "eco" one that saves ink. And, in the end, my objections to those fonts is moral and not aesthetic.  :o)</p>
      <p>Paraphrasing Richard, <cite>There's no such thing as a 'bad' font. Just a font that you haven't found a good use for yet..</cite>. </p>
      <p>R</p>
