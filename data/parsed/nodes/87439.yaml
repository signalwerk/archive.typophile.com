      <p>A story:</p>
      <p>Many years ago, in a galaxy far away called New York City, I took a course in sound recording through the New School.<br>
      We met at a small recording studio in the Village that did a lot of jazz recording.</p>
      <p>The engineer there said this: "There's no such thing as a 'bad' microphone. Just a microphone that you haven't found a good use for yet. Each has it's strengths and weaknesses and it's just a question of what sound quality you want."</p>
      <p>With that, he turned and opened up a big cabinet filled with microphones - some of them dating back a lot of years. He <em>never</em> threw out a working microphone.</p>
      <p>Same with fonts, IMHO.</p>
      <p><a href="http://www.facebook.com/richard.fink">Richard Fink</a><br>
      Blog: <a href="http://readableweb.com">Readable Web</a><br>
      Type Director: <a href="http://kernest.com">Kernest</a></p>
