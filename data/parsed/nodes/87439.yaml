      <p><em>What makes a bad typeface?<br>
      What makes a good typeface?</em></p>
      <p>That is not a very productive question.<br>
      It will lead into semantics, which is not really what you should be learning about typefaces.<br>
      I suggest you qualify it with respect to a design piece you have produced, discussing why you chose the typeface you went with, as opposed to others, and what perceived qualities you exploited in it, and its strengths and weaknesses you discovered in experimenting with it. And/or do the same with the work of another designer—either a peer, or a practising professional.</p>
      <p>Design is practical and experimental, not academic and theoretical.<br>
      Nonetheless, in an academic context, practical work may be analyzed to reveal important principles.</p>
