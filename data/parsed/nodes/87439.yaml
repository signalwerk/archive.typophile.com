      <p>This thread exemplifies why I love reading this forum: dude/dudette comes in, asks question and gets an edumacation.</p>
      <p>Like most here I’d guess, there are faces that I find monkey-butt ugly and that is one way of defining bad, but obviously that’s largely an aesthetic response, ergo an opinion and someone could be found who’d disagree (q.v. discussions on the overuse of Helvetica). </p>
      <p>A face that is poorly done technically as Russell mentions, that’s one good definition of bad in this context and one of the only ways a typeface can be objectively bad; the other main one I can think of is the most obvious perhaps - poor legibility. Obviously some designers would not agree but IMB type has one main job to do and if it doesn’t do that well what purpose does it serve?</p>
