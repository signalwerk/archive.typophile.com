  html: |-
    <p>When working on a font, I like to increment my source files with a two-digit version number (foobar 02.vfb, foobar 03.vfb) so I can generate test OTFs with a version number.</p>
    <p>The annoyance is that after I generate, I always have to drag the new version into Font Book and delete the old versions manually (because Font Book resolves duplicates erratically, usually preferring older files).</p>
    <p>In the past, I've tried to set up a Folder Action to process new fonts, but it takes too long for Folder Action to notice that I made a new file.</p>
    <p>No more. Now I've discovered Hazel, which is a little $20 program (preference pane) that's basically a much more attentive version of Folder Actions. Which makes it actually useful.</p>
    <p>I generate my test OTF to the desktop. (Because it's the easiest destination to navigate to from the FL generate-font dialog.) My Hazel script watches for OTF files to drop onto the desktop. If it sees one that was created in the last minute (and it will grab them within a few seconds of their appearance), it deletes the older versions of that font from my ~/Library/Fonts, and moves the newest version there. If Font Book is running, it will automatically notice the change.</p>
    <p>What's cool about Hazel is that you can embed shell scripts in your sequence of folder actions. So in this case, to do the "delete older versions" magic, I made a little perl script that looks at my new font &amp; deletes anything in my font folder with the same filename prefix.</p>
    <p>You would want to adjust this for your naming scheme. (And as usual, be careful of any script with an rm in it.)</p>
    <p><code><br>
    #!/usr/bin/perl</code></p>
    <p>use warnings;<br>
    use strict;<br>
    use File::Basename;</p>
    <p># extract the filename from the pathname Hazel passes in<br>
    my $filename = basename($ARGV[0]);</p>
    <p># this matches a filename of the form:<br>
    # prefix version number (optional version suffix).otf<br>
    # like foobar 02a.otf<br>
    ($filename =~ m/(.+?)(\d{2,3})(.*?)\.otf/);</p>
    <p># get the family name if it matched<br>
    my $familyname = $1;</p>
    <p># if there's no $familyname, abort<br>
    exit(0) unless $familyname;</p>
    <p># remove the fonts that have the same family name prefix<br>
    my $output = `rm ~/Library/Fonts/'$familyname'*`;</p>
    <p># Hazel continues after this, moving the new font into the directory</p>
    <p>exit(0);<br>
    </p>
