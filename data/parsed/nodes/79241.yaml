      <p>Scott-Martin:<br>
      &gt;&gt;  Israel, did the original cutting of Frank-Ruehl have elongated letters?<br>
      &gt;&gt;  I don't recall seeing them in the Berthold specimen.<br>
      &gt;&gt;  Perhaps that was the origin of the problem.</p>
      <p>No, Frank-Ruehl is a relative recent design. Mr. Frank designed it with a short ascender (ie. the lamed) and short descenders (ie. the kuf and the 4 final forms) clearing for practical purposes.</p>
      <p>Prior to the lamed and the descenders were very long. This was done both in type and by scribes. The reason is unclear.</p>
      <p>According to kabbalistic teaching these extremes did have significance.</p>
      <p>When the very popular Vilna type was introduced and heavily used at the beginning of the 19th century, it became necessary to address the impracticality of the height of the lamed. So, a "curly" lamed was introduced in the middle of the century. Later, a truncated version, like you created, was used. At first, the top was simply broke off. After all, it was a long trip from Lithuania to Italy for one letter.</p>
      <p>I believe Bodoni's students cut the Romm Vilna letters, as Frederick Goudy attests. I know that you contend that it's a load of bunk, from mouth of a drunken sailor.</p>
      <p>Did Goudy know the salute, "l'chayim"?</p>
