    html: <p>i agree with gohebrew - fonts with high lamed create big problems in typesetting. nowadays it's simple though, to use the shortened lamed as a default, AND add a hightened lamed glyph using the openype features. i love the fact that you chose to preserve the shape of the lamed, instead of bending (or "curling" like GOhebrew mentioned) the ascender backwards. bent lameds seems quite un-natural..</p>
