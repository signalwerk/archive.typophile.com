      <p>Lamed means learned.<br>
      Like the lulav onn the holiday of Sukkot is supposed by very tall, the learned Jewish person, not in science or math, is high above the rest. Hence, the lamed is very tall.</p>
      <p>When Frank-Reuhl was introduced at the beginning of the 20th century, the height of the lamed was shortened in most Hebrew typefaces from then on, for practical issues.</p>
      <p>I think the lamed should have three heights: very tall, curled, and shortened or truncated. I regret that we didn't do that long ago and far away.</p>
