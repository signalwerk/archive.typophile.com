      <p>Thank you, everyone!</p>
      <p>Bill, I did indeed keep the tall lamed, as well as the two variants of the elongated forms--everything that survives in the punches and mats. You'll notice that the largest change I made from the original was the design of the nikkud and taamim, which I believe wouldn't fly with modern readers of Hebrew texts. The task now is to convince a Bible publisher to allow the use of the elongated forms. Since the introduction of mechanical typesetting, readers of Hebrew have suffered with huge word spaces in justified texts, especially those set in short lines. Nowadays there are many readers who are unaware of elongated forms, except in calligraphy.</p>
      <p>Israel, did the original cutting of Frank-Ruehl have elongated letters? I don't recall seeing them in the Berthold specimen. Perhaps that was the origin of the problem.</p>
      <p>The very tall lamed didn't do much good for Plantin, as you can find many that became bent (they were cast as kerned letters, of course) under the pressure of the form lockup and the press. A long lamed in any font used with diacriticals runs the risk of bumping up against nikkud and taamim in the line above--a serious problem, in my view. I don't think my shortened lamed here is really all that short, anyway. Had I not mentioned it, I wonder if anyone would have remarked on it.</p>
