      <p>In creating the revivals for the set of Romm family Vilnas and Rashis, I tried to create exact copies of thee typefaces. This was extremely hard to do, because the original artwork was but a handful or two points high, and smudged and blurred.</p>
      <p>In my opinion, it is near impossible for an artist, a creative type designer, to stifle his or her creativity, and to be extremely subservient to the design that he or she is trying to revive.</p>
      <p>The purpose in my case was to recreate the ancient Romm Talmud in the very same look-and-feel, so I could claim that ones great-grandfather studied the new revival edition. See <a href="http://www.GoTalmud.com" title="www.GoTalmud.com">www.GoTalmud.com</a> for details.</p>
      <p>Scott-Martin was aiming to do this with La Be. He wanted to create a rendition of La Be, very close to the original, so Hebrew poetry, prayer, and Scripture, would feel sacred like the La Be design expresses.</p>
      <p>I think that he did a superb job.</p>
