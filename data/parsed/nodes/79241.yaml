      <p>Raphael Freeman says:<br>
      Feb 17, 2011 at 9:06 AM<br>
      Interesting decision to shorten the lamed. The lamed was drawn high in many typefaces because it is created by a yod/vav on top which represents God. Therefore since God is always above us the lamed is tall and never bent.</p>
      <p>Of course it makes it a nightmare to typeset with a tall lamed since it collides with the nikud on the line before.</p>
      <p>Israel says:<br>
      Feb 20, 2011 at 8:54 AM<br>
      Raphael,</p>
      <p>You made a good point about the top of the lamed being a special kind of yud, and representing G-d in kabbalah.</p>
      <p>Actually, this is not diminished by shortening the height of the lammed, for the right upper part of the aleph too represents a yud, and G-d in kabballah.</p>
      <p>The height of the lamed, like a lamdan or talmid chacham, stands tall and proud. For this reason, the height of the lamed is tall.</p>
      <p>Historically, an alternative form of the lamed was invented, so typesetting with a tall lamed was possible. This was achieved by the “curled lamed”, where the ascending segment was wrapped to parallel the upper horizontal stroke.</p>
      <p>This was first done successfully with the Romm family version of the classic Vilna font in the Talmud.</p>
      <p>This posed a problem for Biblical diacritic text for upper taamim that needed to occupy that space. To address this, the lamed ascender was not bent or curled, but rather truncated. This is what Scott-Martin has done.</p>
