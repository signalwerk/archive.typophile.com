      <p>Bert, after I moved from the US to Germany, my overall income (if you'd convert dollars up to euros) stayed about the same. My income taxes went up (but not by much), and my monthly health insurance payments went way up (but I got way better coverage).</p>
      <p>Overall, public transit got cheaper. I don't drive a car, so I didn't have to worry about gas. Yes, goods cost more because of higher VAT, but food prices were a lot cheaper, as was rent. So I came out rather ok in the long run.</p>
      <p>Now I'm in England, where rent, transit, and food are much much much higher than in either Germany or the US. Health care though costs me nothing, but that might just be because of my current student status. Again, I've got no car here, but I could never afford one with the prices on everything around it here. But I don't need one, since I'll be going back to Germany in September.</p>
