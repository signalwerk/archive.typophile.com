      <p>So I'm to be greatful that European typographers/designers are better off than those in the rest of the world and stump up the extra (equivalent) $47 without question then? To be honest, I am neither convinced of the truth of that idea or the prescribed reaction. I am more convinced that Europeans complain less and buy artificially expensive goods more readily and FontShop are just taking advantage of that. Or that we're consistently offered no other option but to pay the arbitrary premium here in Europe.</p>
      <p>I certainly agree that the bottom line has no emotion, so <em>Mean, mean FontShop</em> should probably be replaced by <em>Cynical, cynical FontShop</em>. (I'm tempted by <em>Profiteering, profiteering...</em>, but that would probably be going a little too far.)</p>
      <p>And yes, a FontShop font - say FF Meta Book - is similarly priced at €229 or $240. A realistic conversion of $240 would be €162 making it a substantial 71% more expensive in Europe. Am I 71% better off than an American? I doubt it.</p>
      <p>Perhaps some of you are right and there's little to be said about the price difference. It is after all a free market and FontShop are far from the only people who mark up their products so much for the European market. And do I have to buy it? Well, no, of course I don't. And nor will I. </p>
      <p>I think more than the mere fact that they do this, it's the fact they're so blatant about it which makes it look so bad. Reputations are undone over matters like this and I can't be the only one who's noticed it. Worse, and I'm sticking my neck out here I admit, (and no, I'm not in any way justifying or advocating theft) won't such seeming unfairness make the moral distaste of copying/taking a font rather than buying it seem just that little bit more easily forgotten if its legitimate sale looks like it's part of a racket?</p>
