    html: <p>I know that I sound like a broken record, but I think that prices aren't priced-up for Europeans, but rather priced-down for Americans. By not jacking up the prices to equal the exchange rate, European businesses are trying to do Americans a favor ;-) Many Americans do not realise yet that their currency has lost quite a bit of its value in recent years. If Americans had to suddenly pay real market value for imported goods, they'd have a lot less money to spend, and a lot less things to buy, and then they might go into shock.</p>
