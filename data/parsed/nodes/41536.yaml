    <p>I notice that here in Europe FontShop's FontBook is €99 whereas it's only $99 for customers in the rest of the world. That makes it about 50% more expensive in Europe.</p>
    <p>So, why the difference? The meanies! Are we Europeans richer? A bit stupid? Are we more generous with our cash? It's not an unfamiliar scenario: directly changing a dollar sign to a Euro or Pound sign and keeping the numbers the same, so I thought I'd ask them to see why. It's actually quite a difference. Below is my email thread with FontShop. I've given Theresa the whole weekend and yesterday to reply to my last (cheeky) message, but I don't think she'll bother, so I thought I'd share it here.</p>
    <p>If not mean, it does seem a bit unfair. Do you think we can lobby them to fairly convert the $99?</p>
    <p><em>On Jan 25, 2008, at 6:12 AM, Mark Russell wrote:</em></p>
    <p>Just a quick question to see why Fontbook is €99 in Europe and $99 everywhere else. This makes the book a third more expensive in Europe. [I was wrong. It's more than a third.]</p>
    <p><em>Maybe it's a mistake on the website? Or is shipping included? I can't believe it is because 'All other countries' is just $99 and shipping, say to Japan, would be as costly as shipping to London surely.</em></p>
    <p>Mark.</p>
    <p>On Jan 25, 2008, at 7:21PM, theresa dela cruz wrote:</p>
    <p>Hello Mark,</p>
    <p>Thank you for your email. Unfortunately, the price of the FontBook is correct and does not included shipping. It is set at a value that does not change and therefore the cost of the book is higher than it would be if purchased in the US because the Euro is stronger than the US dollar. Sorry for the inconvenience. If there is anything else that I can help you with then please let me know.</p>
    <p>Regards,<br>
    Theresa</p>
    <p>-----------------------------------<br>
    Sales &amp; Support<br>
    fontshop.com / fontfont.com</p>
    <p>On Jan 25, 2008, at 8:48 PM, Mark Russell wrote:</p>
    <p>Thanks, Theresa, for your prompt reply.</p>
    <p>I do indeed understand that the US Dollar and Euro have different values. To cope with this we use a thing called an 'exchange rate'. At today's rate $99 is equal to €67.</p>
    <p>You don't explain why Fontbook is so much more expensive in Europe than it is in the rest of the world, or why you don't fairly calculate the cost into Euros for the European market.</p>
    <p>It'd be lovely if you could.</p>
    <p>Mark.</p>
