    <p>Hey, I'm a new dad!</p>
    <p>My wife was looking around for a t-shirt to give me on Father's Day. Something like "#1 Dad" or "World's Greatest Dad" or something. But she knows I won't wear it unless the type looks really good. Haha.</p>
    <p>Have you seen any "Dad" t-shirts that look good? (Printed on American Apparel would be a major bonus.)</p>
    <p>Thanks!</p>
