    <p>I'm getting ready to tackle a redesign of a newsletter for a development meant to be a lake escape for wealthy people. The title of the newsletter is "The Porch and Breeze," and the name lets you know mostly everything they're going for in the look and feel.</p>
    <p>I'm leaning towards Garamond for the body text, but I think the headers will really be setting the mood of the piece. I've considered Mrs. Eaves and Feijoa, but I wanted to hear any other suggestion you kind folks might have for a face that harkens "the good ole days" without being kitschy.</p>
    <p>Thanks in advance!</p>
  html_clean: |-
