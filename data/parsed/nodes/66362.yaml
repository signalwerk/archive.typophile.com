    html: |-
      <p>You mustn't turn off hyphenation when you set narrow columns justified. And <em>please</em> don't use fake small caps. Adobe Garamond has real ones. It also has old style numerals, which would be the right choice here.<br>
      Also, Mrs. Eaves <em>always</em> needs manual kerning help. It's one of the poorest spaced and kerned non-free typefaces around. Spot the holes, and fix them.</p>
