    html: <p>Yves, I, too, have always liked the GE logo. I hate what they're doing to it. <br> <br>To me, the punch line is that GE is reportedly spending 1/10 of a billion dollars on this makeover. You don't need to have taste to spend big bucks. The whole thing seems like a bad joke. <br> <br>I'm really disappointed that they've dropped Baskerville. I always thought it added a lot of class to their materials, plus there were things like small caps and oldstyle figures available. I design some of the trade show graphics for one of GE's businesses, so I'm really depressed with the changes they're implementing.</p>
