      <p>Here's an image to see what I mean for color specs:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typeProof_3895.jpg"></div><p></p>
      <p>The left is to spec, the right is 100% white or black (255, 255, 255, or 0, 0, 0). True whites and black should be avoided for everything on-screen, especially text. It's akin to avoiding a rich black for text on the printed page. I think Lucida Fax looks good at larger sizes (24 pt. in my example). The T serifs especially get muddy when smaller.</p>
      <p>The colors are all pulled down to work with the background image - so that'll depend on what you are doing. I also added a very soft, centered drop-shadow to the first word in the Do list to give the type a little contrast to the back but keep it well within the numbers and gave all the words +10 tracking. The contrast will be exaggerated on most televisions so things will look bright and clear but there won't be any buzzing or fighting for clarity. I tend to go for softer contrasts for just that reason, so everything will work and be crisp and quiet. </p>
      <p>Michael</p>
