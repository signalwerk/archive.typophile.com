    <p>:)</p>
    <p>If you thought the differences between print and computer screens were difficult, then type for television would make you cry.</p>
    <p>Television pixels are rectangular rather than square. Furthermore, the colour pallet is constrained by legacy broadcast technologies and the type must appear smooth on even old low resolution television screens.</p>
    <p>It may have been in the 1950s when the BBC designed their rounded font for broadcast subtitles. Does anyone know where to acquire a copy of BBC fonts for use on a PC?</p>
    <p>Alternatively, can anyone suggest an excellent font for use on low contrast transmission with rather big rectangular pixels?</p>
