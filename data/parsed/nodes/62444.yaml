      <p>Gill Sans (and the like) is great for television in my opinion - clear, legible, and holds up well when it finally hits your TV at home. Generally sans serifs tend to work better for a greater volume of words at a smaller point size, but serifs can be sharp too.</p>
      <p>I've had a great many discussions, read many specs about proper and effective use of type on-screen, and done a lot of design for broadcast over the years, from main titles, to lower-thirds, to DVD menus, and my simplified guide-line is (for standard-definition): 18 pt. minimum, 230 for each R, G, and B value maximum, and watch the contrast of the type color/luminance to whatever the background values are. Television both is and isn't forgiving that way. And, designs properly prepped for broadcast look fairly awful on a computer (too murky and dull).</p>
      <p>As for square pixels, designs all start out square (or should start square - that's a whole other discussion), get cropped, squeezed down to the desired output ratio (NTSC, PAL, whatever), and eventually get spat out to your TV screen essentially looking square. Yes, resolution is lost in the squeeze, but things get pulled back to a more proper proportion when you see it on your TV. Circles are circles again, squares look square, type isn't crushed any more. </p>
      <p>So, it's less about the font chosen and more about the treatment and handling of the font in the design that will make or break its usage.</p>
      <p>Michael</p>
