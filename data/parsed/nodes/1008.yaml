    date_raw: 22 Aug 2003 — 5:17pm
    votes: null
    html: "<p>Well. I'll join this party. The logos I'm about to show you ... well, the client was great. He's an endodontist that managed to find excuses to go golfing all of the time. He had a good sense of humor and realized that what he does for a living scares some people to death. We went through many wild rounds of ideas. These I think are the best. <br> <br>First. He showed me the negative of one of the roots. They file them in separate sleeves with information. That is from whence came this concept: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14613.gif\" alt=\"\"> <br> <br>And then there was the \"old-time\" dentist, but a little on the morbid side: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14614.gif\" alt=\"\"> <br> <br>But in the end...after the family had there vote :wink: the only thing that seemed to stay constant was Perpetua.  <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14615.gif\" alt=\"\"></p>"
    html_clean: "<p>Well. I'll join this party. The logos I'm about to show you ... well, the client was great. He's an endodontist that managed to find excuses to go golfing all of the time. He had a good sense of humor and realized that what he does for a living scares some people to death. We went through many wild rounds of ideas. These I think are the best. <br> <br>First. He showed me the negative of one of the roots. They file them in separate sleeves with information. That is from whence came this concept: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14613.gif\" alt=\"\"> <br> <br>And then there was the \"old-time\" dentist, but a little on the morbid side: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14614.gif\" alt=\"\"> <br> <br>But in the end...after the family had there vote :wink: the only thing that seemed to stay constant was Perpetua.  <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14615.gif\" alt=\"\"></p>"
