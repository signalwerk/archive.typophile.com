    html: <p>Yes. The fear that is put into all designer's is that the family will get involved. However, it is a reality. I make a point of always talking very openly about who will be involved in the decision making from the beginning. I ask about there likes and dislikes. We discuss why this is good or bad. Etc. Being open from the beginning helps everyone. Even with bigger companies. Granted I'm not sure it works that way with corporations, but I'm sure within the larger realmn (so to speak) you still have an equivalent with which you have to deal. <br> <br>BJ, the sans is Cholla. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
