    html: <p>Is there a unicode assignment for the commaaccent?</p>
    html_clean: <p>Is there a unicode assignment for the commaaccent?</p>
  - id: 54878
    user: 1262
    date: 2004-12-27T15:11:00
    date_raw: 27 Dec 2004 — 3:11pm
    votes: null
    html: "<p>Yes, but only as a combining mark (i.e. zero-width): U+0326. If you want to display a spacing commaaccent, the correct character sequence is space+commaaccent, although how well this actually renders depends on the font. <br> <br>Note that when applied to the lowercase g, the commaaccent is rotated 180 degrees and placed above the letter: <br><img src=\"http://www.typophile.com/forums/messages/4100/56674.gif\" alt=\"Nyala 'commaaccent' diacritics\"></p>"
    html_clean: "<p>Yes, but only as a combining mark (i.e. zero-width): U+0326. If you want to display a spacing commaaccent, the correct character sequence is space+commaaccent, although how well this actually renders depends on the font. <br> <br>Note that when applied to the lowercase g, the commaaccent is rotated 180 degrees and placed above the letter: <br><img src=\"http://www.typophile.com/forums/messages/4100/56674.gif\" alt=\"Nyala 'commaaccent' diacritics\"></p>"
