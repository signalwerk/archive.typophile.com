    html: '<p>Charles,  <br> <br>This has been discussed numerous times: Adobe got it right, the name used in the Unicode standard is confusing. Please read <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065" target="_blank">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065</a>  <br> <br>Paul,  <br> <br>you should use the localized substitution for both Romanian and Moldavian. For the abbreviations, please look into the References section at <a href="http://www.microsoft.com/typography/SpecificationsOverview.mspx" target="_blank">http://www.microsoft.com/typography/SpecificationsOverview.mspx</a>  <br> <br>Regards, <br>Adam</p>'
    html_clean: '<p>Charles,  <br> <br>This has been discussed numerous times: Adobe got it right, the name used in the Unicode standard is confusing. Please read <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065" target="_blank" class="link-external">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065</a>  <br> <br>Paul,  <br> <br>you should use the localized substitution for both Romanian and Moldavian. For the abbreviations, please look into the References section at <a href="http://www.microsoft.com/typography/SpecificationsOverview.mspx" target="_blank" class="link-external">http://www.microsoft.com/typography/SpecificationsOverview.mspx</a>  <br> <br>Regards, <br>Adam</p>'
