    html: <p>hey Adam, glad you chimed in. I just had another question about this subject. I'm looking at Minion Pro's OT definition file and in the locl feature it substitutes Scedilla with Scommaaccent in Moldavian but everything I've read says that this should be for Romanian. Is it the same for both languages? where can i find a list of language abreviations used in opentype scripting? and lastly are there any other localized substitutions i should know of for latin script? thanks again for your time and help. i really appreciate it.</p>
