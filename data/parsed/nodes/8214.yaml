    html: '<p>It definitely is NOT the same as comma.  <br> <br><a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065" target="_blank">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065</a> <br><a href="http://www.magtypo.cz/download/TYPO_2004_10.pdf" target="_blank">http://www.magtypo.cz/download/TYPO_2004_10.pdf</a> <br><a href="http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm" target="_blank">http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm</a> <br> <br>Also look at well-designed fonts: Helvetica Linotype (the new OpenType TT version), Palatino Linotype, Maiola, Minion Pro.  <br> <br>Regards, <br>Adam</p>'
