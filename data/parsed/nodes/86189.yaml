      <p>I agree with you Bill, with regards to the built-in kerning ("metrics") of fonts, which is optimized for small ("text") size settings.</p>
      <p>But if one is going to concentrate this hard on kerning a word of display type, then manual kerning is the order of the day, and there are several different aesthetic models which one may follow, including the classic "tight but not touching":<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Type_5555.png"></div><p></p>
      <p>Rather than one button for "correct" kerning, it would be interesting to have several buttons, showing different kerning methods, or how particular typographers would kern the word in question.</p>
      <p>Furthermore, without reference to a specific document, it's really not possible to be precise about what kind of kerning is appropriate, because there are very few one word documents. For this document (the game page), the tracking, or letterspacing, is way too open, making it impossible to do proper kerning. For the one word "Type" in this layout, I would space the word as shown above.</p>
      <p>BTW, this is Adobe Garamond, redesigned by Robert Slimbach, published in 1988, if I'm not mistaken. So it would be better to credit the original publisher <em>and</em> the redesigner, as in the FontBook.</p>
