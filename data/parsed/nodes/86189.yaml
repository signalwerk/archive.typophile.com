      <p>It's beautifully made, Mark. Well done.</p>
      <p>Kerning is a measure of the space between a specific pair of letters.<br>
      Tracking is a measure of the overall tightness or looseness of a word, line, or paragraph.</p>
      <p>Like others have said, this is more aptly named SpaceType or FitType because the player adjusts the sidebearings of each letter to get an evenly spaced word.</p>
