    html: |-
      <p>Stephen, the concept is indeed to get even color, an even density of gray. </p>
      <p>However, when you test kerning of caps and lowercase in extended text, it becomes clear that it is not possible to get the same density of gray with caps and lower case. The caps have more open space in them, and also a different structure as they are more closed above the x-height. </p>
      <p>Color is not only the space between letters, but also within letters. So you can shove a cap next to a lower case latter, with the same space as between two lower case letters, but you still aren't going to have even color. In fact, the color between the cap and lower case is going to be more uneven, compared to the cap itself if you kern it tighter. So it makes sense to do something between what you'd do for an all caps setting, and what you'd do between two lower case letters.    </p>
      <p>The reality is that you can't completely cover up the origin of caps and lower case as different alphabets, with different structure and color. And in facing this you realize that in fact that there is an advantage to caps to be a little different in color to serve their function of marking sentence beginnings, proper names, and so on. So it is not a matter of being stuck with metal standards, it is a matter of being stuck with—or taking advantage of—a script that mixes two different alphabets. </p>
      <p>The history that created this problem was pre-printing, in the humanist scribes of the early 15th century. You had people like Bayer who wanted to revert to unicase, which would enable you to get more even color. But it never caught on, probably because the signaling function of caps is in fact useful for communication. So the reality is that you either have to go the direction of Bayer, or accept the fact that kerning will always involve compromise. </p>
      <p>Now this question is complicated by the fact that if you have smaller, narrower, lighter caps, you can kern them closer, and get more overall even color. But you also lose something in having the caps not so prominent, as they become a little less functional as markers. So the question of how best to kern is bound up with the overall design concept of the typeface.  </p>
      <p>In any case, you really only get very similar color from caps and lower case when they are small caps. In fact, sameness of color is one of the purposes of making small caps in the first place. That reality of the function of small caps I think clinches the case that you just aren't going to be able to get the same color in words that mix full caps and lower case. </p>
      <p>So I would say that noticeable caps are, within limits (it can be overdone, like everything), not "distracting," but usefully signaling information to the reader.</p>
      <p>Now as Nick, who agrees with me on kerning for running text, points out, what you do in display is a different question. There it becomes a question of what works with that combination of letters, in that font, in that situation on the page. And there are different ways you can go.  </p>
      <p>This brings up another issue, but related, which is that you can't kern for every situation when designing a font. Essentially, all you can do is kern for all caps, and caps to lower case for extended text. I think the sensitive typographer is always going to need to kern titles for best effect—and redraw the letters for a wordmark, as Doyald Young was a master of. It just can't be built into the font. </p>
      <p>To illustrate the futility of trying to get completely even color in kerning caps to lower case, consider trying to get the whole of the following sentence to have even color: </p>
      <p>In the early 20th century, P. G. Woodhouse and W. Somerset Maughm were successful playwrights.   </p>
      <p>See what I mean?</p>
