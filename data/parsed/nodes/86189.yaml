    <p>Hi there,</p>
    <p>I created an html5 kerning game, works great on Chrome, Firefox 3+, Safari, Opera, IE9. I'm a designer with some front-end skills, but I must admit my typography expertise might not be up to par with what I'm trying to achieve here.</p>
    <p>What I need from you: perform the kerning, compare it to my version, and if you think that your version is better than mine, click on the yellow link and a popup will be displayed with a code that will help me correct it. Post it here and I will be eternally grateful. Using the keyboard is the fastest way of getting the job done, if you are short on time.</p>
    <p>Note to type designers: I'd be honored to showcase your work. Just send me an .ai file with your properly kerned word converted to curves. Just send me an e-mail to <a href="mailto:mark@duopixel.com">mark@duopixel.com</a> with the file and the name, author, year of release and the corresponding links.</p>
    <p>The link is:<br>
    <a class="freelinking external" href="http://type.method.ac" rel="nofollow">http://type.method.ac</a></p>
    <p>Sidenote: I'm not sure KernType is the right name, perhaps TrackType would be a more appropriate term?</p>
