    html: |-
      <p>I've been playing with this and enjoying it. The one issue I have as far as what is ideal concerns kerning the caps to lower case. Because caps are bigger and have more internal white space, I feel that it is better to give a little more white space between the caps and lower case than between two lower case letters. The game seems to go more toward equalizing all the spaces, so that the caps to lower case is tighter than what I would do. I realize that this is debatable, but I remember noting that Igino Marini of iKern also mentioned that he came to the same conclusion, and modified his program in this respect. </p>
      <p>I'd be interested in what others think about this issue. </p>
      <p>I realize there also might be a difference on what is ideal, depending on whether one is dealing with a one or two word title, or the goal is caps with lower case for running text.</p>
