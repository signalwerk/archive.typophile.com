    html: <p>On the g, I think the top can be small as in the first posting. <a href="http://www.myfonts.com/fonts/linotype/charlotte-sans/bold/testdrive.html?s=abcdefghiijklmnopqrstuvwxyz&amp;p=48" target="_blank">Charlotte Sans</a> has a small eye, and looks very good. Also it will give you more space to develop the loop, so it doesn't have to descend so much. The way you join the arches to the stems of hmn is interesting, but I would need to see a text setting to see how the letters work together.</p>
