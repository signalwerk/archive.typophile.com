    html: <p>I think the top bowl of the g is a mite too small, especially in comparison to the lower bowl. It's also a bit skewed, not really upright; tutn it a degree or so clockwise... <br>The e is a bit flat on the left side. Should be more like o. <br>You also should normalise the bits where bowls meet verticals (eg b is too much unlike a and u -- I mean the lower parts). <br>All in all I think this is a very mature effort. Wish I could have done this!</p>
