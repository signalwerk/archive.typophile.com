    html: <p>I agree about not understanding irregularity of descender length.  <br> <br>As for the y, do the different strokes need to be such different weights. Maybe this is why it's reading weaker/thinner to you. I think the weight of the right stroke relates more to the other characters.  <br> <br>The s is the character that feels like least at home to me. Perhaps you could flatten the angle of the diagonal a little, and that would open up the transition into the curves.  <br> <br>The e also feels a little rounded out in comparison to the o,b,c,d,p,q. <br> <br>since we are speaking about the ear of the g, i feel the angle of it's end should relate better to the angle of r, a, c. Maybe not; maybe the ear exists more in the world of the cross of the f and t and t, and the end cut should remain vertical.</p>
