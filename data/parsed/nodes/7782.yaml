  - id: 52693
    user: 1250
    date: 2004-11-24T08:42:00
    date_raw: 24 Nov 2004 — 8:42am
    votes: null
    html: "<p>At first I didn't like this, but now it seems to be clicking for me. That \"g\" is quite nice for one thing. Speaking of which though, the descender depth for it is much greater than the rest - even greater than the ascenders. <br> <br>I guess the main thing about this design is that the stroke contrast is funny - it looks like it was mechanically squished in Illustrator or something. But I guess you want that as a feature, and that could very well be an interesting angle. Just know that when a type designer sees it in actual use he'll probably blame the setter and think: \"Another case of squishing, yuk!\"  :-) <br> <br>BTW, it seems to me that the \"s\" doesn't have enough of that effect. <br> <br>hhp</p>"
    html_clean: "<p>At first I didn't like this, but now it seems to be clicking for me. That \"g\" is quite nice for one thing. Speaking of which though, the descender depth for it is much greater than the rest - even greater than the ascenders. <br> <br>I guess the main thing about this design is that the stroke contrast is funny - it looks like it was mechanically squished in Illustrator or something. But I guess you want that as a feature, and that could very well be an interesting angle. Just know that when a type designer sees it in actual use he'll probably blame the setter and think: \"Another case of squishing, yuk!\"  :-) <br> <br>BTW, it seems to me that the \"s\" doesn't have enough of that effect. <br> <br>hhp</p>"
