    html: "<p>I agree with Jared's comment about the positioning of the 'bubble'. It's lovely when it bulges inside a bowl, but when it disturbs the outer form of the letter it is too destructive. The J is a particular problem in this regard: the bubble really interrupts the form of the letter. You could fix this letter by shifting the bubble so that the outer curve of the J is maintain, as you have for B, D, etc. I would consider leaving the bubble off the X and Z altogether, and instead give these letters treatment similar to Y. The top of Z could be treated like E and F. <br> <br>There doesn't seem to be any logic to where you are using the double-stroke.</p>"
    html_clean: "<p>I agree with Jared's comment about the positioning of the 'bubble'. It's lovely when it bulges inside a bowl, but when it disturbs the outer form of the letter it is too destructive. The J is a particular problem in this regard: the bubble really interrupts the form of the letter. You could fix this letter by shifting the bubble so that the outer curve of the J is maintain, as you have for B, D, etc. I would consider leaving the bubble off the X and Z altogether, and instead give these letters treatment similar to Y. The top of Z could be treated like E and F. <br> <br>There doesn't seem to be any logic to where you are using the double-stroke.</p>"
