    html: <p>I would keep the "x-height" consistent. This makes a typeface solid, even if you use ascenders and descenders in an all-caps design. <br>So I would do the b, h and d bowls, the i and j height (dot exluded) and the t crossbar, at the same caps height of the other letters. The ascenders of course will exceed the caps height. <br> <br>Also, I would keep a certain consistency of the terminals. Tha A is very nice and balanced. Keep it as a basis and use the A's bolder terminal to make the other terminals behave like it (quite like you did in W). <br>The inconsistency is more evident in letters like the new F. The old F and G were better. <br>T and Y are very good and balanced indeed. <br>Shorten also the L horizontal stroke and keep the "ascender" part the same you will do with b, d etc. <br> <br>I think stroke consistency will help, no matter if the approach is more calligraphic or more geometric.</p>
    html_clean: <p>I would keep the "x-height" consistent. This makes a typeface solid, even if you use ascenders and descenders in an all-caps design. <br>So I would do the b, h and d bowls, the i and j height (dot exluded) and the t crossbar, at the same caps height of the other letters. The ascenders of course will exceed the caps height. <br> <br>Also, I would keep a certain consistency of the terminals. Tha A is very nice and balanced. Keep it as a basis and use the A's bolder terminal to make the other terminals behave like it (quite like you did in W). <br>The inconsistency is more evident in letters like the new F. The old F and G were better. <br>T and Y are very good and balanced indeed. <br>Shorten also the L horizontal stroke and keep the "ascender" part the same you will do with b, d etc. <br> <br>I think stroke consistency will help, no matter if the approach is more calligraphic or more geometric.</p>
