    <p>Thierry Blancpain said:”…why not try to collect them here? start a thread where everyone can throw in sentences in his mother tongue with as many glyphs as possible (different glyphs).” (see previous thread):</p>
    <p><a href="http://typophile.com/node/18983">http://typophile.com/node/18983</a></p>
    <p>If anyone can put together a few paragraphs of agreeable text in a different language that contains all the glyphs that language uses, that would be most appreciated. Hopefully there are enough native speakers of the worlds languages on Typophile that we can end up with a good sample.</p>
    <p>Thank you Thierry for coming up with the idea!</p>
    <p>ChrisL</p>
