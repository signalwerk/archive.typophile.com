      <p>&gt; <em>Hello I was wondering what typeface this is based off of even though it is customized.</em></p>
      <p>Not all lettering is based off of existing typefaces, Quite on the contrary. This is definitely not based on anything.</p>
      <p><a href="/wiki/Jason%20Walcott" class="freelinking" rel="nofollow">Jason Walcott</a> sure knows how to handle curly stuff, so maybe check his <a href="http://www.veer.com/products/vendor.aspx?vendor=jbt" rel="nofollow">Jukebox Type</a> faces.</p>
