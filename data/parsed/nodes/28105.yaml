    <p>What do we think of Joshua Darden's new serif family Corundum, his re-working of Fournier? I remember trying to sell him on doing this in two conversations some time ago, so I'm delighted to see he bit. Though there are lots of subtle differences versus Monotype Fournier, as there would have to be (including his tail on the cap Q that just isn't salacious enough!), nevertheless the Fournier feel and overall look are there. I do wonder, however, whether Josh considered incorporating the Tall Caps--in Monotype you had a choice of two kinds of caps, and I remember when Penguin Books used Fournier, it was always with Tall Caps, a type choice I grew up quite fascinated by...</p>
    <p><a href="http://www.joshuadarden.com/shop/corundumtext.php" title="http://www.joshuadarden.com/shop/corundumtext.php">http://www.joshuadarden.com/shop/corundumtext.php</a></p>
