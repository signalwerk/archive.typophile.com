    html: <p>We know Josh went back to original source material to re-think the Fournier look...somebody had to at some point and Josh was the designer worth waiting for, it seems...If Monotype were smart, they would recognize the need and get someone really good to carefully complete the weights of their version, offering both tall and regular caps...we still get new type families released every month with no bold or bold italic...how many years before Hoefler finishes bold and bold italic for Requiem? Do they mind restricting their market so much on the initial release? Can't understand that...</p>
