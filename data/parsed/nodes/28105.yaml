      <p><em>Do they mind restricting their market so much on the initial release?</em></p>
      <p>Bear in mind that retail is only part of their oeuvre, which is driven by custom work for periodicals. One tends to do what is requested by clients, and use that as a barometer of what is viable, therefore I suspect that no publication has commissioned them to fill out that particular family. H&amp;FJ are no slackers in creating mega families, so they have certainly not absconded that responsibility. But in one sense it seems to me they are more interested, in their retail projects, in cutting new territory, in hybrid/niche formats such as the numbers fonts, the two-part fonts, and the graded fonts. So filling out families with the usual weights is not a priority. Perhaps, after H&amp;FJ has bought Monolino, their production staff will be able to attend to such details.</p>
      <p>Sorry, this is Josh's thread. What do I think? I'm impressed by the respect for the original design, and the Pi fonts are awesome! Thumbs up for the Age of Enlightenment.</p>
