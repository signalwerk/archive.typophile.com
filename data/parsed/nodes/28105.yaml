      <p>It's an attractive font but I don't think I'd use it as a substitute for Fournier. It's heavier for one thing, and the italics lack the character of Fournier's - they are tighter, have a higher x-height, and are at less of a slant. Fournier's italics are much of why I use it, they are so beautiful and distinctive. </p>
      <p>But it does look quite complete (altho where are the fractions???), and looks solve the HUGE Fournier caps/smallcaps problem.</p>
