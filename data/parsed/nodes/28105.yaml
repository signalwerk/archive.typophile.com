    html: <p>I've been waiting for a digital "re-creation" of Fournier for some time and what little I've seen of Corundum I like a lot. Incidentally, I seem to recall that the tall capitals were part of Monotype's original hot metal version, and it was Francis Meynell of the Nonesuch Press who asked them for a version with shorter capitals.</p>
