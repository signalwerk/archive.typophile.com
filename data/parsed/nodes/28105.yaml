      <p>Well perhaps not new (being couched in history), but unusual for a digital era foundry.<br>
      Speaking of Requiem, there is the banded version with a variety of ends. Not too many fonts with that feature.<br>
      A suite of two-colour fonts? And not like the typical "outline with fill". What other foundries even have one offering like that? Well, some FontFonts. So perhaps not new territory, but a consolidation.<br>
      Numbers? Again, a "traditional sort" kind of idea, but no other digital era foundry has, AFAIK, developed new design packages in this genre.<br>
      And while the graded Mercury family may not be, strictly speaking, retail, it was developed for the news trade in general. That (grading) is an unusual idea, continuing the Poynter fonts idea. It's not the same as optical size, of course.</p>
