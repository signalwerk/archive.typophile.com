      <p>From the look of it, it's a monospaced "programmer" font, all of which have some sort of slashed zero. Monaco (shipped with Mac OS from early on, lately replaced by Menlo), for one, is similar.<br>
      Some more examples in this thread:<br>
      <a href="http://typophile.com/node/78366" title="http://typophile.com/node/78366">http://typophile.com/node/78366</a><br>
