    <p>Current <span class="caps">URL</span>:<br><a href="http://www.fontfont.com/fonts/cocon">http://www.fontfont.com/fonts/cocon</a><br><a href="http://www.fonts.com/findfonts/detail.htm?pid=418814">http://www.fonts.com/findfonts/detail.htm?pid=418814</a><br><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_cocon/">http://www.fontshop.com/fonts/downloads/fontfont/ff_cocon/</a><br><a href="http://www.itcfonts.com/fonts/detail.htm?pid=418814&amp;AID=5529319">http://www.itcfonts.com/fonts/detail.htm?pid=418814&amp;<span class="caps">AID</span>=5529319</a></p>
    <p>Designed by <a href="/node/14630" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Evert Bloemsma</a> 1998-2001</p>
    <p>Published by <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a></p>
    <p>We all know the small spurs of the lowercase letters a, b, d, g, h, m, n, p, q, r and u. They are relics of the hand-written word where a round form is attached to a straight line. Bloemsma decided to find out what the result would be if they were left off; this proved a difficult starting point for a typeface. Beginning with the lower case a, he drew a family of rounded yet rather asymmetrical forms with details reminiscent of brush-strokes. The individual letters rather neutral, but as a group make <span class="caps">FF</span> Cocon™ a typeface of spirit and&nbsp;character.</p>
