    <p>I really like building fonts, especially with lots of glyphs, and last year I built what is best described as an "extreme" OpenType/CFF font that is useful for stress-testing applications and environments that consume fonts, to include font resource editing software.</p>
    <p>I upped the proverbial ante this past week by adding a third axis of extremeness to this font, and blogged about it (and also make it available for download). See: <a class="freelinking external" href="http://blogs.adobe.com/CCJKType/2012/01/extreme-otf.html" rel="nofollow">CJK Type Blog 01/26/2012 Post: An “Extreme” OpenType Font</a></p>
    <p>Dr. Ken Lunde<br>
    CJKV Type Development, Adobe Systems Incorporated<br>
    San José, CA, USA, Earth<br>
    <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
