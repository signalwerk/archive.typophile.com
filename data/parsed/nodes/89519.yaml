    votes: null
    html: |-
      <p>Let me expand a bit on that for interested lurkers.</p>
      <p>The byte stream<br>
      <code>00 00 01 80 00 0A</code></p>
      <p>is <em>invalid</em> because <code>00</code> does not produce valid code. This one is better:<br>
      <code>FF 00 01 80 00 0A</code></p>
      <p>because the first 5 bytes translate in a floating point number: 1.5. The sixth byte translates into the opcode "callsubr", so this sequence correctly translates into<br>
      <code>1.5 callsubr</code></p>
      <p>... but a subr number must be an integer (it is a simple table based lookup). So this is still "wrong", but on a higher level. But even when we change this code into<br>
      <code>F6 0A</code></p>
      <p>which translates into<br>
      <code>-1 callsubr</code></p>
      <p>we cannot be sure if this is "correct". According to Adobe's Charstring Specification #5177, there is a limit of 10 nested callsubr calls, and there is no way we can check if this one is the eleventh without actually parsing the entire charstring.</p>
      <p>Still, these checks can be done by a fairly basic program. More insidious are syntactically correct constructs such as<br>
      <code>10 0 10 vlineto</code></p>
      <p>or indeed<br>
      <code>10 0 -10 vlineto</code></p>
      <p>(I'm <em>certain</em> that's not allowed), or self-crossing:<br>
      <code>2 1 -1 -2 hlineto</code></p>
      <p>... which is where the fun starts for me :)</p>
