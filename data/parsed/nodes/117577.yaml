      <p>Kevin, I was looking mainly at the letter-forms rather than the writing tool suggested in the digital font. My idea was that if someone wanted to make a replica of the word-mark emblem writing tool details could be blurred out for use in the 3-D printing process. I agree that they would not work properly if used "as is."<br>
      Don</p>
