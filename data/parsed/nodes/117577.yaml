      <p>I agree with the choice of Brand as a substitute. Lavender Script <a href="http://www.myfonts.com/fonts/bluevinyl/lavender-script/" title="http://www.myfonts.com/fonts/bluevinyl/lavender-script/">http://www.myfonts.com/fonts/bluevinyl/lavender-script/</a> and Shelly Script <a href="http://www.myfonts.com/fonts/linotype/shelley-script/" title="http://www.myfonts.com/fonts/linotype/shelley-script/">http://www.myfonts.com/fonts/linotype/shelley-script/</a> could also work. Balladeer Light also has a similar feel even though it is not a connected script. <a href="http://www.myfonts.com/fonts/profonts/balladeer/" title="http://www.myfonts.com/fonts/profonts/balladeer/">http://www.myfonts.com/fonts/profonts/balladeer/</a> I also like Citadel Script <a href="http://www.myfonts.com/fonts/mti/atcitadel-script/" title="http://www.myfonts.com/fonts/mti/atcitadel-script/">http://www.myfonts.com/fonts/mti/atcitadel-script/</a> if the hairline flourises on the capitals could be trimmed.<br>
      Don</p>
