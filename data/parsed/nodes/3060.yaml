    html: <p>Hmmm. Bringhurst says, 'Myriad, like Frutiger, is full of subtle and open geometric forms'. In other words, not humanist.  <br> <br>When I compare the lower case of Frutiger and Myriad, Myriad is more humanist as Yves says. It is narrower, especially the a, and its round letters more oval, and less circular. It also has more modulation - the tapering of the ends of the c and e, etc. Sort of a humanist version of Frutiger.  <br> <br>But it has the one story g. Maybe other features that lead to Bringhurst's classification? Do any of you have any ideas about this? Why does Bringhurst say 'geometric'? <br> <br>As to the appropriateness of the face, I think this depends on the goal of the logo. From what you say in the other thread, Lars, and the unfocused look of it, it looks like not enough thought has gone into what a logo for this city should look like.   </p>
    html_clean: <p>Hmmm. Bringhurst says, 'Myriad, like Frutiger, is full of subtle and open geometric forms'. In other words, not humanist.  <br> <br>When I compare the lower case of Frutiger and Myriad, Myriad is more humanist as Yves says. It is narrower, especially the a, and its round letters more oval, and less circular. It also has more modulation - the tapering of the ends of the c and e, etc. Sort of a humanist version of Frutiger.  <br> <br>But it has the one story g. Maybe other features that lead to Bringhurst's classification? Do any of you have any ideas about this? Why does Bringhurst say 'geometric'? <br> <br>As to the appropriateness of the face, I think this depends on the goal of the logo. From what you say in the other thread, Lars, and the unfocused look of it, it looks like not enough thought has gone into what a logo for this city should look like.   </p>
