    html: <p>Well, the question is not if Myriad fits Oldenburg but rather if at least they could have used small Caps and solid kerning and spacing.  <br>Anyway, Myriad is a rather humanis-looking typeface to me too, and so is Frutiger, so... both are good examples of humanist typefaces, much as Akzidenz/Helvetica are of Static and Futura and Beyer is for Geometric. I don�'t see too much geometric stuff here, they clearly stem from a dynamic humane form.  <br>Oh, and regarding wrong-type-for-a-city... I recently got a brochure of Sulzburg, a small town in Baden... and it was set in ThesisTheMix. Which is a funny typeface, allright... but not for longer texts and not for any kind of very old fashioned and serious town. This is wrong as you CAN get. </p>
