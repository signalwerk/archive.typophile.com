    <p>Hi eveybody,</p>
    <p>since blog = personal soapbox, I decided that I just have to share this:</p>
    <p><a href="http://framboise781.free.fr/Paris.htm">http://framboise781.free.fr/Paris.htm</a></p>
    <p>It is one, long 360-degree panoramic photo of Paris by night. There is a nice big surprise that hits you right in the middle that made me happy, at least.</p>
    <p>I don’t know who made this, but my mother(!) forwarded the link to me.</p>
