    <p>Hi everybody,<br>
    these are some of the fonts I am cyrillizing for my company. Most of them already have  a cyrillic version but my boss insists on doing everything from scratch. I am learning on the go.<br>
     Perhas most people will not understand the cyr letterforms, but general art aspects of the font should be plainly visible for critique.<br>
     Also, the fonts will soon be on sale for low low prices. :)</p>
    <p>First number one...<br>
    <a href="http://img297.imageshack.us/img297/4110/mistralcyr.jpg" title="http://img297.imageshack.us/img297/4110/mistralcyr.jpg">http://img297.imageshack.us/img297/4110/mistralcyr.jpg</a></p>
