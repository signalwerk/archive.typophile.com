    html: |-
      <ul>
      <li><em>my boss insists on doing everything from scratch. I am learning on the go.</em></li>
      </ul>
      <p>Dear Vasil, frankly, I find <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1007" rel="nofollow">Mistral Cyrillic</a> (part of the multilingual typeface now available from <a href="http://www.ascenderfonts.com/font/mistral-standard.aspx" rel="nofollow">Ascender Corp.)</a> quite usable; it’s pretty hard to beat. Second, depending on the prospective use, and the terms of the license, your boss may have to secure the consent of the copyright owner to get a custom version developed for him.
      </p><ul>
      <li><em>Also, the fonts will soon be on sale for low low prices. </em>:)</li>
      </ul>
      <p></p><p>Think twice before you offer your unauthorized Cyrillic versions of the existing Western typefaces for sale without proper arrangements with the copyright owners: in certain jurisdictions that is considered illegal, and could land you in jail. :-(</p>
