      <p>Calligraphic ornaments can be found in font form, digitized clip-art, etc.</p>
      <p>It also depends on what period or style of calligraphic flourish or ornament you are looking for.</p>
      <p>Try looking at <a href="http://moorstation.org/typoasis/ornaments/index.htm" target="new"><strong>Ornament fonts</strong></a> available at Typoasis.</p>
