      <p><cite>So what am I missing here?</cite></p>
      <p>These fonts date back to the early Postscript font era. Type 1 Postscript fonts had a much smaller limit for kerning pairs than TrueType and OpenType, so these pairs were not created. When the big vendors convert fonts over to newer formats they automate most of the conversion work and often do not add kerning classes where they should.</p>
