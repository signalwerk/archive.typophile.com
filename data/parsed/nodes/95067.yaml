    html: |-
      <p>I recommend you start by checking out these books. Though both written decades ago, they remain the standard references for book typography:</p>
      <p><em><a class="freelinking external" href="http://www.amazon.com/Design-Books-Adrian-Wilson/dp/081180304X" rel="nofollow">The Design of Books</a></em> by Adrian Wilson</p>
      <p><em><a class="freelinking external" href="http://www.amazon.com/Bookmaking-Editing-Design-Production-Edition/dp/0393730182" rel="nofollow"> Bookmaking</a></em> by Marshall Lee</p>
  - id: 517269
    user: 12518
    date: 2012-07-28T12:46:00
    date_raw: 28 Jul 2012 — 12:46pm
    votes: null
    html: <p>There's no formula, but some factors that are particularly important to consider are the size of the page (or width of the text column) and the x-height and width of the font. Also budget constraints, printing method and paper choice, the kind of book you want it to look like and, as Riccardo mentioned, the target readership.</p>
