    html: |-
      <p>Here is the meaning. This was written in TextEdit, saved as html 4.01 Strict, No CSS, Unicode UTF-8,&nbsp; and then massaged with an old sed script of mine.</p>
      <p>Outside, front:</p>
      <p>I skip what has already been translated.&nbsp; I used the word "stack" (ערימה) instead of קופסה for which I found no appropriate translation in the current context.</p>
      <p>Shuffle the deck and distribute 5 cards to each player. The remaining cards are put in a stack, face down. Turn the upper card and put it open in the middle of the table.. Choose the first player. The direction of play is leftwards (counter-clockwise).</p>
      <p>Inside, right.</p>
      <p>Each player, in turn, tries to discard one card and put it, face up, on top of the card that is open in the center.</p>
      <p><strong>Ordinary cards</strong>: On each of them there is one character from the Simpsons: Homer, Marge, Bart, Lisa or Maggie.</p>
      <p>Each ordinary card may be discarded</p>
      <ul>
      <li>If the card in the middle is of the <strong>same character</strong>.</li>
      <li>If&nbsp; the card in the middle is of the <strong>same colour</strong>.&nbsp;</li>
      </ul>
      <p><strong>Special cards</strong> - described here under - may be discarded according to the following rules.</p>
      <p>All the family on a coloured background: May be discarded on a regular card of the same colour. The next player may discard on top of it a regular card of the same colour.</p>
      <p>Inside, left.</p>
      <p>All the family on a white background: May be discarded on a regular card of any colour. The next player my discard on top of it a regular card of any colour.&nbsp;</p>
      <p>The typical accessory of each character (for instance Bart uses a skateboard). May be discarded on a card with the picture of the character using that accessory, of any colour. The next player may discard a card of the same character, of any colour.</p>
      <p>Dad Homer and Mom Marge: May be discarded on top of a card on which there is the picture of Homer <strong>or</strong> of Marge, of any colour. The next player may discard on it a card of one member of the couple, of any colour.</p>
      <p>Change direction: May be discarded on top of any card and then the direction of play changes. The next player may discard any card on top of it.</p>
      <p>Outside, back.</p>
      <p>Skip turn: May be discarded on top of any card and the player that discards it may choose who plays next (if there are only two players, he who discards it wins a second turn).&nbsp;</p>
      <p><strong>Notice</strong>: If a player is unable to discard when comes his turn he must take a card from the stack and that ends his turn.</p>
      <p><strong>Last card</strong>: At the moment one player is left with only one card, he must say loud: "Simpsons". If he forgets, he must take 3 cards from the stack.</p>
      <p><strong>The winner</strong> is the first who manages to discard all his cards, and he wins a token. After a series of plays, the winner is who has the largest number of tokens.</p>
      <p><strong>Play and enjoy!</strong></p>
