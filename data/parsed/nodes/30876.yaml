      <p>A company named Plastic Logic is in the news lately as having a viable product by 2008. For example:</p>
      <p><a href="http://www.vnunet.com/vnunet/news/2172127/paper-heralds-computing" title="http://www.vnunet.com/vnunet/news/2172127/paper-heralds-computing">http://www.vnunet.com/vnunet/news/2172127/paper-heralds-computing</a></p>
      <p>Some other general links:</p>
      <p><a href="http://news.zdnet.com/2110-9584_22-6134401.html" title="http://news.zdnet.com/2110-9584_22-6134401.html">http://news.zdnet.com/2110-9584_22-6134401.html</a></p>
      <p><a href="http://news.zdnet.com/2100-1040_22-5903090.html?tag=nl" title="http://news.zdnet.com/2100-1040_22-5903090.html?tag=nl">http://news.zdnet.com/2100-1040_22-5903090.html?tag=nl</a></p>
      <p>FWIW, e-books and e-newspapers aren’t the only potential uses. I looked at electronic paper several years ago for a US Navy project to replace paper onboard, umm, certain ships, but the technology wasn’t good enough then. The idea was to put all the technical data on a central server and use a wireless network to send data to tablet-sized pieces of e-paper. The e-paper would also have been enabled to talk to the equipment of interest, the ship, and other shipboard and shore databases to transfer relevant data back and forth. The whole thing would have been a way to deliver just-in-time and “just as needed” data.</p>
      <p>There’s also the whole wearable computing thing to think about, too. Imagine a piece of clothing also being a piece of network enabled e-paper... what will social networking be like then?</p>
