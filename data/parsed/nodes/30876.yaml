      <p>I’ve seen the new Sony e-book in person. The resolution on the e-book is still too low - around 100dpi - but that the surface doesn’t emit light and instead reflects light from your surroundings is a treat for your eyes and makes all the difference.</p>
      <p>While it leaves a lot to be desired in its current form, in my mind it proves the category and I don’t doubt that I’ll have an e-book reader of some kind in my bag within the next five years.</p>
