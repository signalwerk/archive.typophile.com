      <p>Apart from the display technology there isn’t much new. </p>
      <p>We’ve had e-book readers before. They haven’t taken off without becoming full featured PDAs or notebook PCs in the process. What I find interesting is that the article mentions that books will be available for 25% less than hardcover price. That’s not exactly a bargain. Paperbacks are cheaper than that and they have actual manufacturing costs involved.</p>
      <p>At least it will read text files and PDFs. Now that software manuals are rarely printed anymore, I’d like to read them away from my computer from time to time, at least to not block the limited screen space while I’m working on it.</p>
      <p>But in terms of e-ink, how fast is the display? Is it only suited to static text and images, or can the pixels be switched fast enough for smooth animation? Are the pixels binary or can they be partially rotated to produce grayscale images? These questions the article does not answer.</p>
