      <p>Once display devices can hit paper’s resolution, we’ll see huge changes in the technology.</p>
      <p>However, now that they are at the resolution of paper, it probably makes our jobs a lot easier.</p>
      <p>That said, books will never disappear. ;o)</p>
      <p>Cuttlefish...I don’t think ’e-ink’ is meant to emulate anything other than ink. While it likely can do animations and the like, I think it’s main purpose at this point is eventually emulate true in on a reflective surface. One of the benefits is that it doesn’t require a constant power source. Once the ink is ’printed’ it stays that way without a need for more power. While this is certainly a benefit for reading static text, it’s dissappears if we start talking about animations.</p>
