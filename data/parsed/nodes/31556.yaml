      <p>Italian Art Deco style, from ending 20's and 30's.<br>
      Some examples I've quickly googled :<br>
      - <a href="http://www.internationalposter.com/wdetail.cfm?ImageName=itl07311" title="http://www.internationalposter.com/wdetail.cfm?ImageName=itl07311">http://www.internationalposter.com/wdetail.cfm?ImageName=itl07311</a><br>
      - <a href="http://www.internationalposter.com/wdetail.cfm?ImageName=itl01334" title="http://www.internationalposter.com/wdetail.cfm?ImageName=itl01334">http://www.internationalposter.com/wdetail.cfm?ImageName=itl01334</a><br>
      - <a href="http://www.internationalposter.com/pimages/ITL01317s.jpg" title="http://www.internationalposter.com/pimages/ITL01317s.jpg">http://www.internationalposter.com/pimages/ITL01317s.jpg</a></p>
      <p>Remind me a the spirit of geometry of the monumental "Mostra" font.<br>
      And behind of all, the "futurism" italian movement, focused on modernity, machines and speed.</p>
      <p>Art Deco posters : <a href="http://www.enjoyart.com/art_deco4.htm" title="http://www.enjoyart.com/art_deco4.htm">http://www.enjoyart.com/art_deco4.htm</a></p>
