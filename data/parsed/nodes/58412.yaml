    html: |-
      <p>Hello,</p>
      <p>This is an interesting thread, I would have loved to be here when there was more action. I thought I'd add a technical perspective to the game:</p>
      <p>1. Clever fonts for captcha don't work. You can instruct the program to look for certain patterns in the text so as long as those don't change, it's really not complicated to break the captcha<br>
      2. Animated captchas don't work either because you can easily extract and merge all frames in a GIF.</p>
      <p>So the only valid concept thus far is to have a set of rules from which you can generate fairly different shapes so that a single program cannot deduce the rules.</p>
    html_clean: |-
