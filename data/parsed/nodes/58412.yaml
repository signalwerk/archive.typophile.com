  - id: 348831
    user: 43561
    date: 2009-05-27T12:53:00
    date_raw: 27 May 2009 — 12:53pm
    votes: null
    html: |-
      <p>Well, reCAPTCHA takes advantage of the fact that there is inherent distortion and reduction of quality of letterforms via the fact they were created before digital fonts and then scanned afterwards. In addition, they add further distortion to create variable letter forms. Now, while it is well done and puts captcha efforts to good use, there are still potentially interesting results that can be created via this contest.</p>
      <p>So, is it possible to create a font that humans can read but computers can't (or have extreme difficulty with) without the added benefits conferred via reCAPTCHA? Ultimately, nothing we create will be able to stand up to a program written specifically for that font, but there is still plenty of room for creativity and kooky concepts.</p>
    html_clean: |-
