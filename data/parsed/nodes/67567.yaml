  html: |-
    <p>I understand the usage of the tilde character for various glyphs. What I don't understand is why the asciitilde and the tilde are two different sizes. What is the point? Is there some usage for the asciitilde that is not already covered by the tilde? Sign painters sometimes use the asciitilde as a hyphen, but somehow I don't think that is it's intended usage. </p>
    <p>~~~~~~~~~~~~~~~<br>
    [[http://www.thefontry.com/|<em>from the Fontry</em></p>
