      <p>Dez: Yup -- in Symbolic Linguistics, it's the "Not" or "Inverse" operand, and <a href="http://en.wikibooks.org/wiki/Geometry/Chapter_3" rel="nofollow">apparently</a> also in mathematics.</p>
      <p>In the C programming language it represents a bitwise "not"; while the logical "not" operand "!" toggles a value between zero and non-zero, the bitwise operand toggles each of the individual bits to their opposite. (You probably have to be a programmer to appreciate the difference.)</p>
