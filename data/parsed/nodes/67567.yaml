      <p><strong>Computing Dictionary</strong></p>
      <p>tilde character<br>
      "~" ASCII character 126.</p>
      <p>Common names are: ITU-T: tilde; squiggle; twiddle; not. <strong>Rare</strong>: approx; wiggle; swung dash; enyay; INTERCAL: sqiggle (sic).</p>
      <p>Used as C's prefix bitwise negation operator; and in Unix csh, GNU Emacs, and elsewhere, to stand for the current user's home directory, or, when prefixed to a login name, for the given user's home directory.</p>
      <p>The "swung dash" or "approximation" sign is not quite the same as tilde in typeset material but the ASCII tilde serves for both (compare angle brackets).</p>
