      <p>An asciitilde is a completely different character. Its used a lot in a computing/unix/web context to signify ones 'home directory', eg. <a href="http://site.org/~randomuser" title="http://site.org/~randomuser">http://site.org/~randomuser</a>.</p>
      <p>I'm unaware of any other uses.</p>
