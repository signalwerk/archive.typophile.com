    html: |-
      <p>The regular tilde is a diacritic which is combined with other glyphs (like n to form ñ). It is sized and positioned to sit above alphabet characters.<br>
      The ascii tilde sits centered on a line in a position aligning with math symbols like the equals sign. It is sized to match well with figures. It is used as others have said, in coding and as a symbol, (perhaps in linguistics?).</p>
