  html: <p>I'm not a designer, but as my father is kind of director of a ceramics school, i submitted him ideas for a logo for his school. There isn't, and every single compagny paper they have are of very poor quality (the worse is that there's a "graphism" branch in another school of the same group). <br>So though i know my things really not deserves to be there, i guess maybe you can give me ideas to make it less miserable (in all cases, it will be better than the nothing they have). <br>There's an old first version, made with Dominican (which appears to me to fit well with ceramics) and another with tyfa (which is more modern but still make tghink of some past in my view). <br>Be hard, i really haven't any pretention. You can't hurt me.<img src="http://www.typophile.com/forums/messages/29/12086.gif" alt="logo"> <br>Only typography, it's not a brand but, let's say a "pretty name".</p>
