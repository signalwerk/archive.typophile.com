    html: <p>Guillaume, <br> <br>I have to agree with Tiffany. The vase shape seemed too contrived before. Now that it's also the C and the accent, it feels even more so. <br> <br>I like the handlettered feel of ECP2. Take out the vase and work to make the weight even as Tiffany suggested (Draw a real cap for the C and P rather than enlarging one). I like the horizontal rules in the type though. It subtly suggested a coil pot to me. This can look very elegant too if you want. Consider <a href="http://www.thomaspink.com" target="_blank">http://www.thomaspink.com</a> <br> <br> <br>Good luck <br>Randy</p>
