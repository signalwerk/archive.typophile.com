  - id: 2703
    user_id: 1977
    user_name: kakaze
    user_path: null
    user_image: null
    date_raw: 25 Jun 2003 — 3:22pm
    date: 2003-06-25T15:22:00
    votes: null
    html: "<p>\"Chris, thank you, but JFP and others were sadly right on one point : the big E doesn't mean anything. And i don't want so much a meanless design, even if it's aesthetically nice.\" <br> <br>That's the crux of the matter though. <br> <br>If people recognise what you're trying to say, even if the design is meaningless through a design standpoint, you've done your job as a designer. <br> <br>You can have perfectly good design, playing by the rules and all that, that can be aestheticly pleasing, yet more often than not, it's the breaking of the rules that actually makes a design aesthetically pleasing. <br> <br>When I see your first logo, I see right away what it says, and I look at the way you emphasize the E and think it's a novel away of dealing with the situation. <br> <br>Then I look at your updated design, and see the same type of process going on, but say to myself \"how boring\". <br> <br>Before you decide, do this:  Take both of your designs and show them to laypersons and see which design they like the best.  That is the design you should stick with. <br> <br>You're not designing your logo for designers, you're designing it for the common person, and they want something that looks nice.</p>"
  - id: 2704
    user_id: 108
    user_name: Miss Tiffany
    user_path: null
    user_image: /files/pictures/picture-108.png
    date_raw: 25 Jun 2003 — 4:37pm
    date: 2003-06-25T16:37:00
    votes: null
    html: <p>Guillaume. There is something nice about this latest version. The hand shows through. Similar to ceramics, you can often see the hand in the work. However, I think the silhouette of the vase is too tricky. I wouldn't use that.  Can you unify the weights? The widths on the strokes and interior lines change too much. <br> <br>As for the first version. Having the E large as you do, completely confuses the hierarchy of legibility. And as JFP pointed out you have too much going on. <br> <br>I would say Tyfa is of the crunchy variety. Not creamy. On the other hand, Biblon is super creamy.</p>
