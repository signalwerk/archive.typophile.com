    html: <p>Guillaume -- here's another approach. <br> <br>Looking at the name of the school...i noticed <br>a typographic anomaly... <br> <br>each word has two Es. <br> <br>Anyway, as we sometimes do here at typophile, <br>I took the liberty of messing around with <br>your work, just for kicks. <br> <br>I tried A, which wasn't working. <br> <br>"B" might be a step in a decent direction, but <br>it needs something (flourishes to the left and <br>right of de Provence?) to make <br>it into a real logo, er, trademark. <br> <br> <br>Anyway, you might explore this concept further with <br>some other typefaces, Tyfa?, and some different <br>E treatments. <br> <br>You might also follow the advice of the experts, but <br>remember, hrant is NOT a graphic designer. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>This is Ellington slightly modified...ITC new baskerville <br>is the italic typeface. :0 <br> <br>good luck <br> <br>bj <br><img src="http://www.typophile.com/forums/messages/29/12125.jpg" alt="ecole.jpg"></p>
