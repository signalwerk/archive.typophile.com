    date: 2003-06-24T00:46:00
    votes: null
    html: "<p>Rules: <br>1. don't play with a common letter (here the big E) for two words, not the best legibility. And not very interesting, conceptually. Generally done by people who have no \"ideas.\" <br> <br>The main letter will be C here I think. <br> <br>2. don't play with caps then lowercases for hierachy (levels: 1, 2, 3, 4), more with \"size\" or color: all caps or caps+lowercases. <br> <br></p>"
