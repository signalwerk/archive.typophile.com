    <p>Recently I came across a delicate Art Deco lettering at a prominent building in the city of Leipzig, which has been re-constructed:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RIMG0487_1sw_6033.jpg"></div><p></p>
    <p>“Untergrundmesshalle” means Underground Trade Fair Hall. It is from 1924, appearently it was the world’s first underground building of this kind.<br>
    _</p>
    <p>I couldn’t resist.</p>
    <p>I think this may be coming out soon:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild-grund-5_3768.png"></div><p></p>
