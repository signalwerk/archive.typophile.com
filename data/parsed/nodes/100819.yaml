    html: "<p>Wait, didn’t I post a comment here about how Danish cheques are formatted in the Swedish style of cardinal numbers? Or was that on twitter? I can find it neither place, so let me put it up here again for posterity’s sake: On Danish cheques, when writing out the cardinal, eg. kr. 768,32 you would write <em>syvhundredesekstiottekronerogtretitoøre</em> (like in Swedish common use), and not <em>syvhundredeottetredskronerogtoogtrediveøre</em> (like in Danish common use).</p>"
