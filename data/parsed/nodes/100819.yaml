  html: |-
    <p>I wonder, could OpenType automatically convert regular numerals to <em>spelled-out</em> Danish numerals without a crazy number of ligatures? Can OT do one-to-many and many-to-many?</p>
    <p>More on the Danish counting system: <a href="http://www.olestig.dk/dansk/numbers.html" title="http://www.olestig.dk/dansk/numbers.html">http://www.olestig.dk/dansk/numbers.html</a></p>
