    html: |-
      <p>OT does one-to-many (type 2 GSUB lookup) easily enough. In theory, it can be made to do many-to-many, but in fact this is nowhere supported in either tools or apps. So you'd probably have to do some clever contextual one-to-many substitutions. In other words, you would have to analyse the decimal positions in the number, and substitute the appropriate word for the letters in each position. So, for an English example you might have a number '625', and you would need context to isolate the initial numeral and capture that it is in the hundreds position (followed by two integers), then substitute</p>
      <p><code>six -&gt; s i x space h u n d r e d space a n d</code></p>
      <p>then you would capture the 2 in the tens position:</p>
      <p><code>two -&gt; t w e n t y hyphen</code></p>
      <p>and finally the five in the ones position:</p>
      <p><code>five -&gt; f i v e</code></p>
      <p>The biggest risk in this kind of approach is failure of context, which means you need to carefully think through all the permutations of situations in which a number might occur. I think the feature would need to be like the 'frac' feature, i.e. explicitly applied by a user to a selected string of characters, and not the sort of feature one could safely turn on for an entire document.</p>
