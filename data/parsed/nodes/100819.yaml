    html: |-
      <p>Reordering glyphs using GSUB is a bit tricky. I do it sometimes in order to be able to ligate reordered characters in Indic fonts, but I'm never entirely comfortable doing so. You have to do it in two steps: contextually insert the new glyph where you want it, and then contextually delete the old glyph from the unwanted location. Since there are no insert/delete GSUB lookup types per se, what you need to do is first use a one-to-many lookup, and then a many-to-one lookups. So, for example, let's say I want to reorder the glyphs in the sequence ABC so that they are BAC, I would first have a lookup (VOLT syntax; sorry the Adobe stuff makes no sense to me).</p>
      <p><code>A -&gt; B A<br>
      |C</code></p>
      <p>which would result in BABC; then a second lookup something like</p>
      <p><code>A B -&gt; A<br>
      B|</code></p>
      <p>resulting in BAC.</p>
