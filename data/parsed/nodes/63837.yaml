  html: <p>Hello everyone, I've working on personal project. I'm attempting to create a logo for concept I have in mind. The idea is quite simple. You have talent in graphic design, copy writing, photography, art direction...etc. UC exist to help create a working live network for all creatives new and experienced. You create your network based on your desired goals. You create your own team of qualified professionals. The concept is in it's infant stage. Below is what I have in mind. The general idea is to create a sense of togetherness, workmanship, bonding, team. With that in mind, gloves off, bring it, but be constructive. Much appreciated.</p><div class="imageWrap"><img src="http://typophile.com/files/unified_4706.jpg"></div><p></p>
