    html: |-
      <p>The top line is definitely better — keeping the height of the 'i' the same as the other. I think the context of the ligature will quash all misinterpretations of it as an 'h'. Alone it might get confused, but where it is, I think it will be fine though you might extend the height of the stem of the 'f' above the crossbar.</p>
      <p>You might also play around with other connections between the 'fi' ligature, more along the lines of your first go (just not descending so far with the top arm of the 'f').</p>
      <p>--<br>
      <em>penn</em></p>
