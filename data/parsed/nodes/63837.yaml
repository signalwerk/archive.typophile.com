    html: |-
      <p>Hm... what's the smallest this will appear? I'm thinking the fi ligature may get lost at small sizes, and together appear as a single capital A. I do think having the entire crossbar of the f is better for clarity.</p>
      <p>Perhaps if you returned to the design before the ligature, and simply terminate the top of the f before it curves downward? If you really want a ligature there, you could also lift the ascenders one "block" up and link the crossbar of the f to the top of the i. But I think an f that doesn't curve down is much nicer.</p>
    html_clean: |-
