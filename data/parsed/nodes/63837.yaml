      <p>U feels too heavy around the bends. Not sure what can be done about except for reducing the horizontal stroke:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/unified_5441.png"></div><p></p>
      <p>Also, I'm trying to understand if there's a system to using curved vs. straight inner corners. There's one radius used in U and N; E and D use smaller one and there are some straight ones sprinkled all over. I am guessing the straight corner is where two strokes meet (as opposed to a rounded corner where the stroke merely bends to change its path). But in this case E appears to consist of 4 strokes - L shaped one, two horizontals and one vertical... not sure if I am explaining it clearly, but I can elaborate. With pictures :)</p>
