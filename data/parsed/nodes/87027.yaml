  html: |-
    <p>Benton Sans Regular OT is offered up by several web type companies inc Webtype, Fontshop &amp; Fonts.com but I am yet to be able to find out the level of clear type hinting which has been applied by the foundry. We require it to be hand hinted rather than auto hinted as the result are far better.</p>
    <p>I wondered if anyone could help me with some info on this, here are a few links to the sources:</p>
    <p><a href="http://www.webtype.com/font/bentonsans-regular-family/">http://www.webtype.com/font/bentonsans-regular-family/</a><br><a href="http://www.fonts.com/font/font-bureau/benton-sans">http://www.fonts.com/font/font-bureau/benton-sans</a><br><a href="http://www.fontshop.com/fonts/singles/font_bureau/benton_sans_ot/">http://www.fontshop.com/fonts/singles/font_bureau/benton_sans_ot/</a></p>
    <p>Thanks</p>
    <p>Matt</p>
