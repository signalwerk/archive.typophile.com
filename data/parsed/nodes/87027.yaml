    html: <p>Currently, the hand-hinted webfont versions of <a href="http://www.webtype.com/font/bentonsans-complete-family-1" rel="nofollow">Benton Sans</a> are only offered for web licensing from Webtype. If you're planning to set smaller body type online, you may also be interested in <a href="http://www.webtype.com/font/bentonsansre-family" rel="nofollow">Benton Sans RE</a>, as Frode mentioned. The RE ("Reading Edge") fonts were designed from scratch and hand-hinted specifically for use at smaller sizes on the screen.</p>
