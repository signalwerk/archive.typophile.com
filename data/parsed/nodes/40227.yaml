      <p>Folks have asked similar questions before throughout the forums.<br>
      While I don’t wish to cause the Fontlab people any grief, but do consider <a class="freelinking-external" href="https://web.archive.org/web/20080907050204/http://fontforge.sf.net/">FontForge</a>.<br>
      It’s a little awkward and messy in some respects, notably that you have to get it working in X11 or Cygwin rather than native operating environments (unless you’re on a Linux box), but the features are more than good enough and it’s not going to cost you anything for trying.</p>
