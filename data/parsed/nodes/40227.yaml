    <p>I bought Fontographer in the 90s, did some type design, then moved on to other things, and haven’t touched FOG since. I want to get back into type design, so I’m wondering which makes more sense: upgrading to FOG 4.7 or getting TypeTool. Either option would cost me $99, and since it’s been so long since I’ve used FOG, I’m not concerned about having to re-learn anything by moving to TypeTool. I know FOG should have some more features than TT, but after looking at the product comparison chart, they look really equal (with TT ahead in some features).</p>
    <p>Since I’m more or less a beginner at this point, I don’t need super advanced features, and TT seems like a more modern program, and  maybe a bit easier to use, and if I ever decided to upgrade to Fontlab, I’d already know how to use the program.</p>
    <p>Anyone have any recommendations?</p>
    <p>thanks!</p>
    <p>Jonathan</p>
