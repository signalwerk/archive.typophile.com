      <p>It’s a tough call because you already know Fontographer a bit, but you say you’re not concerned about learning, so I’d pick TypeTool. It is a good stepping-stone to FontLab, which is the primary tool used by professionals these days, including us at Adobe.</p>
      <p>Cheers,</p>
      <p>T</p>
