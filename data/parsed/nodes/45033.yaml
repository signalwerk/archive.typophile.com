      <p>Seravek is damn close to Martin Majoor's <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_sans_ot/" rel="nofollow">FF Scala Sans</a>, although I don't believe either complement Locator. There's just not enough contrast (which is not to say they look alike, they just don't have enough contrast).</p>
      <p>Good luck!</p>
