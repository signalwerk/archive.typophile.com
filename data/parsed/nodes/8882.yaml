    html: "<p>Itay, I was skimming through Taylor &amp; Taylor's \"The Psychology of Reading\" (which contains a great explanation of Hangul, btw), and there's some stuff on Hebrew. Specifically, there's a reference to a study by D Navon &amp; J Shimron (in issue #20 of the \"Journal of Verbal Learning and Verbal Behavior\", 1981, pp 97-109) which apparently found that \"for adults ... the presence or absence of the vowel signs does not seem to affect the latency for pronunciation\". On the other hand, there's certainly a difference between deliberative reading (the case when pronouncing things outloud) versus immersive reading (where vocalization -even silent vocalization- is tangential, and speeds are much higher, fixations much shorter). <br> <br>hhp <br></p>"
