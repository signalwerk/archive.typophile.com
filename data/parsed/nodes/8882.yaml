    html: <p>I encourage you to continue to think about it, but I worry that proposing a solution (replace existing vocalisation with three marks) is jumping the gun. You should never begin with a solution, but always with a thorough analysis of the problem, beginning with the question 'Is there, in fact, a problem?' There are lots of solutions floating around out there looking for a problem. You should try to avoid any prejudgements or hasty conclusions that will impose a teleological programme on your investigation.</p>
