    html: "<p>Punctuation is entirely the wrong term for the <i>nikud</i> points. These are vocalisation marks, i.e. vowels. <br> <br>You say that the 'current Hebrew punctuation system is a simplified system of an even more big system' and note that in the original system 'the text looked like a mess, each word was surrounded by many marks'. Surely you know that not all of those marks are vocalisation marks, the <i>teamin</i> are cantillation marks used pretty much exclusively for religious texts to assist the cantor during recitation. So the 'simplified system' to which you refer is not really simplified at all: it is the use of vocalisation without cantillation, as has been done for non-religious texts for many centuries. <br> <br>I'm not saying your idea is without merit, only that you need to be much more sure of your facts before developing the proposal any further. Sadly, many proposals for reforming writing systems come from people who do not adequately understand the existing system.</p>"
    html_clean: "<p>Punctuation is entirely the wrong term for the <i>nikud</i> points. These are vocalisation marks, i.e. vowels. <br> <br>You say that the 'current Hebrew punctuation system is a simplified system of an even more big system' and note that in the original system 'the text looked like a mess, each word was surrounded by many marks'. Surely you know that not all of those marks are vocalisation marks, the <i>teamin</i> are cantillation marks used pretty much exclusively for religious texts to assist the cantor during recitation. So the 'simplified system' to which you refer is not really simplified at all: it is the use of vocalisation without cantillation, as has been done for non-religious texts for many centuries. <br> <br>I'm not saying your idea is without merit, only that you need to be much more sure of your facts before developing the proposal any further. Sadly, many proposals for reforming writing systems come from people who do not adequately understand the existing system.</p>"
