    html: "<p>&gt; it far less revolutionary <br> <br>Let me ask: would a reader automatically understand your system, with no \"learning\"? In a society where a top-down implementation would be nearly impossible, the key is not requiring any active conscious effort. This limits ambitiousness, but at least it's realistic. <br> <br>&gt; this happens in english too <br> <br>With the huge difference that English is an Indo-eurpean language, where vowels play a pivotal role, while Hebrew is a Semitic one, where vowels only serve to differentiate between things like \"dig\" and \"digger\", which are very rarely confusable in context. <br> <br>&gt; it could increase readability. <br> <br>It's possible (although not to the extent of an Indo-european language). I guess the core question is, how often does the absense of points cause a reading stutter in an adult? <br> <br>&gt; Punctuation is entirely the wrong term <br> <br>You're right, it's confusing. Although maybe <i>technically</i> it's OK, since \"punct\" just means \"point\"! <br> <br>&gt; many proposals for reforming writing systems come from people who do not adequately understand the existing system. <br> <br>Very true, and this includes the great majority of people who never acquire even a cursory understanding of how humans actually read, as well as people who have misguided or circumstancial motivation - for example Bradbury Thompson was motived to create his unicase alphabet basically because his son had trouble reading. <br> <br>On the other hand, I would say that too much reverence for a writing system (including its history) can be a psychological barrier towards improvement. I'm sure the Romans would have hated lowercase (even Cassandre did), even though it's so much more readable than UC. <br> <br>hhp <br></p>"
