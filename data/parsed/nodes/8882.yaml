    html: <p>i heard you talk about Hangul in some other part of the forum. it sounded incredible indeed. yet this change im proposing is not in that scale. it far less revolutionary then the new alphabet of Wim Crouwel, or the CH glyph in some bauhaus fonts. <br>thats why i feel it has more potential to survive then those attempts. <br> <br>well, currently some of the letters are partially used as vowels. the letter Vav for example, sometimes stands for the same sound as V, and sometimes it stands for O. there's nothing that points out its use other then the context it is used in. the word im currently looking at could be read 'reforma' or 'refverma'. i could even go farther when reading this word because there isnt any punctuation to the letters. its like reading the word 'rforma'. the only way to know exactly how to read it is to know the word allready.  <br>this happens in english too, when sometimes words look diffrent then they sound. but here it happens all the time, since we sliced the whole punctuation off the language.  <br>im just not sure thats a good place for a language to be in. <br> <br>&gt; what benefits does using any punctuation have in Hebrew?  <br>i think it could increase readability.  <br></p>
