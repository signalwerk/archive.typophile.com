    html: "<p>This is very interesting. But any formal reform like this is a monumental task, nearly impossible to carry out in a democracy, due the fossilizing effect of that social system. The Koreans would never have gained their resplendent Hangul -which puts all other scripts of the world to shame- without their dedicated Monarch. <br> <br>But playing along... <br>What I would ask is: what benefits does using <i>any</i> punctuation have in Hebrew? Does the potential disambiguation bring any de facto benefit to adult readers? (Learning readers already have the full system.) <br> <br>hhp <br></p>"
