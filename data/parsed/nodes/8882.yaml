  html: "<p>Hebrew currently has a system of 8 punctuation marks. mainly, they arent used. even books hardly use punctuation. it's specifily used for making the meaning of a word clear, in case its spelling allows multiple meanings (for example, God and To looks the same without punctuation).  <br>and I have been thinking to myself - maybe there is a place for a simplified punctuation system. i have made sketchs for a system that uses only 3 marks, which are a line [A sound], a dot [I sound], and two dots [E sounds]. (the O sound is has a letter in hebrew.) <br>so basicly, i choose 3 punctuation marks that are enough to be used today. all the other punctuation marks are variants of those simple sounds. they are learnt in high-school, but after that nobody really pays attention to them.  <br> <br>i can see the pro and cons in such a punctuation system: <br>pros- <br>* not many people use the current punctuation system, the new one is much more usable and simple. it could be used more then the old system. <br>* it suits the way we speak hebrew nowadays. <br>* this has been done before. the current hebrew punctuation system is a simplified system of an even more big system. in the original system, the text looked like a mess, each word was surronded by many marks. <br> <br>cons- <br>* because 3 punctuation marks will be simplified into one, when someone will punctuate a word with this system, it will look like a punctuation mistake.  <br>* people probably wont like the idea because its a change too big to make. <br> <br>well. please tell me what you think. im very unsure about it.</p>"
