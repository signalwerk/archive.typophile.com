    <p>Hi everyone,</p>
    <p>I'm looking for a typeface with the stroke contrast typical to Didot, but with the letterforms typical to Garamond -- particularly the overhanging lowercase f. Every transitional/modern serif I can find has this scrawny, squashed f. It makes me cry.</p>
