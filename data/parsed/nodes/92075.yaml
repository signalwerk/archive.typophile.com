    html: |-
      <p>That roman looks a good deal like Garamond Premiere Pro, which I already have. (The italic is neat, though.) I'm looking for something with even greater stroke contrast... something close to Didot in stroke design, really.</p>
      <p>Oh, and preferably (let's make this even more difficult!), I need something that works at text sizes. Billtroop's comment <a class="freelinking external" href="http://typophile.com/node/10167" rel="nofollow">here</a> (about a third of the way down) names the few Didot recreations that are based on text designs, not display designs. All of them have that <em>stupid lowercase f</em>.</p>
