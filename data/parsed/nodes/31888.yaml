    html: <p>I generally use this model (in green on my avatar, known as the Villard diagram) to draw my text frame, then round out the margins to whole numbers, raise the top margin a bit, lower the bottom margin somewhat, and, finally, shift the frame 1pica towards the outside edge to account for the binding.</p>
