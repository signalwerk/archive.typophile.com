    html: <p>Tiffany, I'd agree that probably in Cummings's poetry, and certainly in that of the even more concrete poets that followed him, most typographic choices were likely made with a very conscious <strong>eye</strong> towards the look of the printed poem. However, a lot of poetry is also written with a conscious <strong>ear</strong> towards the sound of the poem recited. And, although this may very well be veering towards an entirely different conversation, I think that typography, especially in the context of poetry, 'and' vs '&amp;' vs '+' for example, can affect, even if only minutely, the way something is read aloud.</p>
