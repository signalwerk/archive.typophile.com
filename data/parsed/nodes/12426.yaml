    <p>I’ve got a question for all you typographers:<br><strong>When is it, and when is it not, appropriate to use the <a href="/node/12521" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ampersand</a> character (&amp;) instead of the actual word “and”?</strong></p>
