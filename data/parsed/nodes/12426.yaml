      Nick, I have. I guess we have different thresholds of acceptability. FWIW, I do use tracking differences of a few 1/1000s when it's really unavoidable (as it sometimes just is); but I don't subscribe to distorting type.</p>
      <p><cite>"I stress that this process is for discerning typographers"</cite><br>
