      <p>In the book Finer Points in the Spacing &amp; Arrangement of Type there is a good argument for the use of the ampersand in text, based on traditional practices. But it is more a British tradition.</p>
      <p>Interestingly, when Hartley &amp; Marks reprinted the book, and added a new preface, they used ampersands ad nauseum and their setting was awful as a result because they ignored the rationale for the use of the ampersand. It allows for tighter word spacing (which they ignored). And there are usage rules (where they should be placed or not placed, how many to use in a line, etc.). In the context of British typesetting (mid-century) the use of the ampersand is not an aesthetic decision in and of itself, but a technical one, as it facilitates a better looking page.</p>
