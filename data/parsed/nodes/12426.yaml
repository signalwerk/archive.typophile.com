      <p>There are some publications that deal with railroads which have a guideline to always use an ampersand within the name of a railroad, even if the company name officially uses <em>and</em> That is because those publications tend to run strings of railroad names together, and the ampersand helps distinguish between them.</p>
      <p>For example, consider the sentence:</p>
      <p><em>Some classic railroads of the past included the Atchison, Topeka &amp; Santa Fe; the New York, New Haven &amp; Hartford; the Delaware &amp; Hudson, and the Chicago, Milwaukee, St. Paul &amp; Pacific.</em></p>
