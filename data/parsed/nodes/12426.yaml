    html: |-
      <p>Nina, varying letter spacing and glyph spacing by two or three percentage points (to improve justification) is a perfectly acceptable "cheat", that isn't noticeable as such. You should try it some time.</p>
      <p>**</p>
      <p>Note that I advocate stroking for faking small caps primarily for regular sans serif fonts.</p>
      <p>BTW, when faking small caps, it may be useful to increase horizontal scaling and tracking as well.</p>
      <p>I stress that this process is for discerning typographers, because it requires subtle massage and a good eye.</p>
      <p>**</p>
      <p>These transformations (adding weight, adjusting scaling and spacing) are the same ones used by type designers when we make small caps -- although we have more subtle tools (allowing different additions of weight to the x and y axis) and also add further manual tweaking. I would imagine that the vast majority of true small caps are created by type designers by thus modifying upper case glyphs. At least, that's the way I always work, and I can't imagine why one would make them from scratch, rather than modifying upper case glyphs.</p>
