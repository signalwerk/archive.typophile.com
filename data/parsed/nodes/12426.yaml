    html: <p>For me, and this is completely unscientific, when 'and' is spelled out and used in extensive repetition, it begins to feel heavy, to the point where, if I was reading aloud, I would begin to pause before each occurrence, treating the conjunction as an implied comma. The ampersand on the other hand, being a single character, provides a continuous flow between the linked words or phrases. This is possibly a construct entirely of my own—logic would imply that the ampersand, as punctuation would be the more likely to cause one to pause slightly, and not the other way around.</p>
