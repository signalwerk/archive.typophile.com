      <p>I think the ampersand is underused (although frankly not by much). Some people (often amateur designers) use it too much, frivolously; but some people want to outlaw its use based on some strange linguistic purism, or worse still, based on Modernism, e.g. "as few distractions as possible". Information is not a distraction; information is useful. So if you use the ampersand in a way that helps convey more information (like through disambiguation), that's a good thing.</p>
      <p>Examples from my own writing:</p>
      <p>"The most obvious way that Latinization affects a non-Latin script is in the imposition of 'foreign' formal elements such as certain serif structures, stroke contrast &amp; stress, modularity, etc."</p>
      <p>"Letters made to look like animals or nuts &amp; bolts are not uncommon."</p>
      <p>"Because of its high level of modularity and reliance on the basic line &amp; circle, Futura presents us with much more uniform –therefore ambiguous– word shapes than Gill Sans."</p>
      <p>But the argument for saving space doesn't seem very sensical to me, except in rare cases where the ampersand can avoid an ungainly linebreak (while not being too intrusive itself).</p>
      <p>hhp</p>
