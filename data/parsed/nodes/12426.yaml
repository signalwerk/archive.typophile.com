      <p>"Letters made to look like animals or nuts &amp; bolts are not uncommon."</p>
      <p>"Because of its high level of modularity and reliance on the basic line &amp; circle, Futura presents us with much more uniform –therefore ambiguous– word shapes than Gill Sans."</p>
      <p>But the argument for saving space doesn't seem very sensical to me, except in rare cases where the ampersand can avoid an ungainly linebreak (while not being too intrusive itself).</p>
