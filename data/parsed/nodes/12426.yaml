      <p>Peter, I've always avoided the ampersand, in spite of my affection for its appearance, except in titling where a bond was being implied between two proper nouns or between two things spoken of as a unit. I like the ampersand, but I find it jarring outside of certain contexts. It's faster, more eye-catching, and more space-efficient, which makes it good for headlines, and particularly in ads.</p>
      <p>I've always associated ampersands with advertising/commerce for those reasons, particularly when they're over-used. In fact, I read a book where ampersands were intentionally inserted into the copy when the author wanted to emphasize something he was speaking about and give it a crass, commercialized edge (a sort of sarcastic marker, in a way, that references advertising copy). It would read something like this:</p>
      <p>He was walking down the street in his blazer &amp; loafers, showing us all how he had wealth &amp; power now. But it was obvious he had just come into some cash and had no real class whatsoever.</p>
      <p>I can't remember who did it, though. David Foster Wallace, maybe?</p>
