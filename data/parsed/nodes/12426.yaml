      <p>If you believe that text should have as few distractions along the way as possible - that it should flow nicely you would:</p>
      <p>a) Use an en dash buffered by two spaces on either side – like that. The alternative—em dash—is huge and distracting.</p>
      <p>b) Use small caps instead of regular capitals so as to not call too much attention to them. People in the US and in the former USSR can both agree. It allows the reader to flow along the line.</p>
      <p>c) The argument that it saves space could also be applied to the percent symbol, as the origin of it came from truncating the fraction 1/100. I would argue that a big fraction is more distraction than the percent symbol and would opt for it 99% of the time.</p>
      <p>d) Finally, I would certainly not put an ampersand in the middle of a line &amp; I would certainly not put an ampersand in the middle of a line.</p>
