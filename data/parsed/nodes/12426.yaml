    html: <p>It’s funny to see the ampersand creeping into the <em>Russian</em> usage... Apparently, it is being associated with things ‘Western’, ‘capitalist’, &amp;c. And it looks so chic in the Cyrillic context. Some ad agencies just love it. Incidentally, the Russian for ‘and’ is the <strong>i</strong> (yes, that ‘inverted N’, U+0418 and U+0438), and the meaning of the ampersand (&amp; = <em>et</em>) is completely lost on the Russians. But who cares? It is so cute.</p>
