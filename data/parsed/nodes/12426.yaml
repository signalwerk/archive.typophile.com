      <p>Well, I arrived at this thread because I'm handsetting a colophon in lead type, Caslon Italic No. 540, and as I was counting the sorts to see if I had enough, the ampersands got my attention. They're very flamboyant and begged to be used. There are only two occurrences of "and" in the colophon, but I wasn't sure if it was right to use ampersands in what actually was a paragraph of running text.</p>
      <p>I looked in Geoffrey Dowding's <em>Finer Points in the Spacing &amp; Arrangement of Type</em> and was happy to find an entire section on the use of the ampersand (pages 23 through 29 of the paperback edition). He begins the discussion by saying that, in hand composition, "The judicious use of the short ‘and’ invariably improves the appearance and readability of a setting" by providing an additional option in word spacing. But what rang truer to me were some thoughts he passed on from George D. Painter of the British Museum's Department of Printed Books: "[the ampersand] is or can be a beautiful object in its own right, and was dwelt upon more lovingly by scribes and type-designers than any other sort except Qu, I should say."</p>
      <p>I should say. I decided to use the ampersands in the colophon but not in the main text, which is a poem and doesn't need word spacing to justify lines, and which will be set in Caslon Oldstyle No. 471, whose ampersands are stodgy by comparison. Now I just have to decide whether to use one in the title, which I would like to set in some sort of casual script. It would fall at the beginning of the second of two lines. Mr. Puckett above says that "starting a line with an ampersand would be quite dreadful," but Dowding says, "It should be remembered that while the (&amp;) looks quite happy at the beginning of a line it may not do so at the extreme end of a line...". I suppose I'll have to see it before forming an opinion.</p>
    html_clean: |-
