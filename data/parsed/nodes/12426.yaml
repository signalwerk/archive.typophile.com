      <p>I had a surprisingly big arguement with a pal of mine about the use ofg '&amp;'. I had used it a lot in the text on my website &amp; he thought it was a big mistake. - Like in that last sentance. He is an english major. More on that later.</p>
      <p>I had read a very convincing article that made the point that '&amp;' saves space, &amp; that really, like anything cultural the decision to use 'and' not '&amp;' is just a matter of habit or dogma - or put another way - it's use or lack of it is what what people are used to at the time. </p>
      <p>The article further argued that culture changes &amp; that really people could be used to using '&amp;' instead of 'and' if we decided that that was what we wanted. Still more, there were aesthetic &amp; economic benefits! I bought that idea. </p>
      <p>I like '&amp;'. I like to see it. I like all the variatons in form it offers. The character is one of the most doted on by type designers &amp; is sometimes - often - the most beautiful glyph in a font as a result. </p>
      <p>So my view of '&amp;' is nuanced. I want to see it more but I know it isn't widely accepted as a substitude for 'and'. I am in the minority &amp; I know it. </p>
      <p>I also know that my opinion is just culture and could change - again. Still, I think in English we just have a body of english majors who have bought the dogma that '&amp;' should not be used in body text &amp; parrot that idea without looking or thinking or feeling anthing much about it. They are just stupidly rigid. Goddam Chicago manual. Fpppht.</p>
      <p>BTW - I like '&amp;c' too.</p>
