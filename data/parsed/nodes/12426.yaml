      <p>There is one specific use of the ampersand for disambiguation that I like. In American movies (and many foreign ones that follow US conventions), the Writers Guild requires deliberate use of "and" vs "&amp;" to distinguish the relationship of the writers.</p>
      <p>For example, screenplay by "Elba Matzoff and Chris Sobrino &amp; Pat Roberts" means that Chris and Pat actually worked together on a version of the screenplay, whereas Elba did a treatment or rewrite on her own.</p>
