      <p>To me it seems to be a balance of the undeniable jarring effect of the "&amp;" glyph versus its -also undeniable- semantic usefulness in adding structural information to a sentence. The big question is, how fast can a person get used to seeing it in text? Like how far into Gill's "Essay" does the typical reader (not at all the same as the typical type designer) stop noticing the glyph and just absorb the content?</p>
      <p>Lacking strong insight into Familiarity (a pervasive issue in type design), hyperconservative people will totally shun the ampersand (since it constitutes a deviation from the status quo), while iconoclasts will overdose on it. The people in the middle are -as always- in the most difficult position, since they actually feel compelled to think about it, to try it out and objectively gauge the effects on the ground.</p>
      <p>hhp</p>
