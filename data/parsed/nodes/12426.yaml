    <p>I’ve got a question for all you typographers:<br>
    <strong>When is it, and when is it not, appropriate to use the <a href="/wiki/Ampersand" class="freelinking" rel="nofollow">ampersand</a> character (&amp;) instead of the actual word “and”?</strong></p>
    <p>{Moderator: Wiki link added.}</p>
  html_clean: |-
