      <p>I think that this depends on the language. German might have actual rule forbiding it running text, I think. Many old Italian books used it all the time, every "and" instance; "etc." is also written "&amp;c."</p>
      <p>I think that in English, it could safely be used in headlines and other display applications, and in proper business names, i.e., "We decided to take our case to the firm of Reynolds &amp; Reynolds Attorneys, instead of the cheap storefront team around the corner." Otherwise, I would leave it out of <em>text</em>.</p>
      <p>Also, I belive that common practice is to remove spaces when initals are used, e.g., "Research &amp; Development, Inc." but "R&amp;D, Inc."</p>
