    <p>Anyone have any recommendations on what software/file format combination works best, when developing type specimens for the web? Will one get better results from Photoshop CS compared with Photoshop 5.5 or 7? More specifically, does Photoshop / ImageReady CS do a better job of compression than the older versions? I'm assuming that it does. PNG or GIF? <br> <br>I want nice, smooth, lovely, type specimens, that load quickly. And I'm seeking some typophile wisdom</p>
