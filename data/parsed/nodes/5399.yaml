    html: "<p>For the new version of <a href=\"http://www.typofonderie.com/alphabets/\" target=\"_blank\">http://www.typofonderie.com/alphabets/</a> <br>I have built the gifs that way: <br>-Indesign setting <br>-created pdf of the pages <br>-screen capture of the pdf (before adjust the screen display setting in Acrobat) <br>-resized in Photoshop 7, then export as colored gifs <br> <br>This method give the best results i know, because of the use of CoolType and such things that creating a simple gif don't offer. <br> <br>(don't tried Photoshop CS)</p>"
    html_clean: "<p>For the new version of <a href=\"http://www.typofonderie.com/alphabets/\" target=\"_blank\" class=\"link-external\">http://www.typofonderie.com/alphabets/</a> <br>I have built the gifs that way: <br>-Indesign setting <br>-created pdf of the pages <br>-screen capture of the pdf (before adjust the screen display setting in Acrobat) <br>-resized in Photoshop 7, then export as colored gifs <br> <br>This method give the best results i know, because of the use of CoolType and such things that creating a simple gif don't offer. <br> <br>(don't tried Photoshop CS)</p>"
