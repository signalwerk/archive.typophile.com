    <li>“A Boy and His Type (on <a href="/node/add/wiki?edit%5Btitle%5D=Christopher%20Stern" title="Create node &quot;Christopher Stern&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Christopher Stern</a>)” by <a href="/node/add/wiki?edit%5Btitle%5D=Amy%20REdmond" title="Create node &quot;Amy REdmond&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Amy <span class="caps">RE</span>dmond</a></li>
