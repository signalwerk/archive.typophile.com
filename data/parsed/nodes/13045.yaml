    <p><a name="interrobang_punct" id="interrobang_punct"></a><br><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Interrobang</strong></p>
    <p>A seldom-used bit of 20th-century <a href="/node/add/wiki?edit%5Btitle%5D=punctuation" title="Create node &quot;punctuation&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">punctuation</a> that combines the <a href="/node/add/wiki?edit%5Btitle%5D=question%20mark" title="Create node &quot;question mark&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">question mark</a> and the <a href="/node/add/wiki?edit%5Btitle%5D=exclamation%20point" title="Create node &quot;exclamation point&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">exclamation point</a>. </p>
    <p>Typophile threads discussing the history and usefullness of the interrobang:<br><a href="http://typophile.com/node/908">Chitty Chitty Interrobang Bang</a><br><a href="http://typophile.com/node/9086">!?: interrobang</a><br><a href="http://typophile.com/node/9795">Interrobang. Eh?</a><br><a href="http://typophile.com/node/31156">origins of question mark/exclamation mark/interrobang</a><br><a href="http://typophile.com/node/34013">Bring back the&nbsp;Interrobang</a></p>
    <p>More about the interrobang at the FontFeed:<br><a href="http://fontfeed.com/archives/the-interrobang-and-national-punctuation-day/">National Punctuation Day Reignites Interrobang&nbsp;Passion</a></p>
    <p><a name="interrobang_pub" id="interrobang_pub"></a><br><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Publications</a>&nbsp;:&nbsp;Interrobang</strong></p>
    <p>A <a href="/node/12153" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">SOTA</span></a> publication, edited by <a href="/node/12036" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephen Coles</a> and <a href="/node/14029" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tamye Riggs</a>. The magazine features writers from the type and design communities, unpublished typefaces, and&nbsp;more.</p>
    <p><em>Interrobang 1</em><br>
    Articles
    </p><ul><li>“Death to Helvetica” by <a href="/node/12442" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick&nbsp;Shinn</a></li>
    <li>“Why Joe Won’t Buy” by <a href="/node/12036" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephen&nbsp;Coles</a></li>
    </ul><p>Unexposed
    </p><ul><li>Yakuza by <a href="/node/12069" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jared&nbsp;Benson</a></li>
