    <p><a name="interrobang_punct" rel="nofollow"></a><br>
    <strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Interrobang</strong></p>
    <p>A seldom-used bit of 20th-century <a href="/wiki/punctuation" class="freelinking" rel="nofollow">punctuation</a> that combines the <a href="/wiki/question%20mark" class="freelinking" rel="nofollow">question mark</a> and the <a href="/wiki/exclamation%20point" class="freelinking" rel="nofollow">exclamation point</a>. </p>
    <p>Typophile threads discussing the history and usefullness of the interrobang:<br>
    <a href="http://typophile.com/node/908" rel="nofollow">Chitty Chitty Interrobang Bang</a><br>
    <a href="http://typophile.com/node/9086" rel="nofollow">!?: interrobang</a><br>
    <a href="http://typophile.com/node/9795" rel="nofollow">Interrobang. Eh?</a><br>
    <a href="http://typophile.com/node/31156" rel="nofollow">origins of question mark/exclamation mark/interrobang</a><br>
    <a href="http://typophile.com/node/34013" rel="nofollow">Bring back the Interrobang</a></p>
    <p>More about the interrobang at the FontFeed:<br>
    <a href="http://fontfeed.com/archives/the-interrobang-and-national-punctuation-day/" rel="nofollow">National Punctuation Day Reignites Interrobang Passion</a></p>
    <p><a name="interrobang_pub" rel="nofollow"></a><br>
    <strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : Interrobang</strong></p>
    <p>A <a href="/wiki/SOTA" class="freelinking" rel="nofollow">SOTA</a> publication, edited by <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a> and <a href="/wiki/Tamye%20Riggs" class="freelinking" rel="nofollow">Tamye Riggs</a>. The magazine features writers from the type and design communities, unpublished typefaces, and more.</p>
    <p><em>Interrobang 1</em><br>
    Articles
    </p><ul>
    <li>"Death to Helvetica" by <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a></li>
    <li>"Why Joe Won't Buy" by <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a></li>
    </ul>
    <p></p><p>Unexposed
    </p><ul>
    <li>Yakuza by <a href="/wiki/Jared%20Benson" class="freelinking" rel="nofollow">Jared Benson</a></li>
    <li>Plumpo by <a href="/wiki/Peter%20Bruhn" class="freelinking" rel="nofollow">Peter Bruhn</a></li>
    <li>Typress by <a href="/wiki/Jacques%20Le%20Bailly" class="freelinking" rel="nofollow">Jacques Le Bailly</a></li>
    <li>Enterprise by <a href="/wiki/Angus%20Shamal" class="freelinking" rel="nofollow">Angus Shamal</a></li>
    <li>Latinaires by <a href="/wiki/Alejandro%20Paul" class="freelinking" rel="nofollow">Alejandro Paul</a></li>
    </ul>
    <p></p><p>Colophon
    </p><ul>
    <li>Worldwide, Preface, and Artifact by <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a></li>
    <li>Plumpo by <a href="/wiki/Peter%20Bruhn" class="freelinking" rel="nofollow">Peter Bruhn</a></li>
    </ul>
    <p></p><p><em>Interrobang 2</em><br>
    Articles
    </p><ul>
    <li>"The Case for a User Friendly <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a>" by <a href="/wiki/Tiffany%20Wardle" class="freelinking" rel="nofollow">Tiffany Wardle</a></li>
    </ul>
    <p></p><p><em>Interrobang 3</em></p>
    <p><em>Interrobang 4</em> Special <a href="/wiki/Dwiggins" class="freelinking" rel="nofollow">Dwiggins</a> issue 2006<br>
    Articles</p>
    <ul>
    <li>"The Experimental Type Designs of W.A. Dwiggins" by <a href="/wiki/Tiffany%20Wardle" class="freelinking" rel="nofollow">Tiffany Wardle</a></li>
    <li>"The Serious Humor of Dwiggins" by <a href="/wiki/Richard%20Kegler" class="freelinking" rel="nofollow">Richard Kegler</a></li>
    <li>"The Fonts of Dwiggins" by <a href="/wiki/Tiffany%20Wardle" class="freelinking" rel="nofollow">Tiffany Wardle</a></li>
    <li>"Comment on Electra" by <a href="/wiki/W.A.%20Dwiggins" class="freelinking" rel="nofollow">W.A. Dwiggins</a></li>
    <li>"Gallery" Dwiggins' Lettering, Design, and Marionettes</li>
    <li>"An Interview with Hermann Püterschein" by <a href="/wiki/Allan%20Haley" class="freelinking" rel="nofollow">Allan Haley</a></li>
    </ul>
    <p>Type designers with work featured in the magazine include <a href="/wiki/Akira%20Kobayashi%2C%20%5B%5BCyrus%20Highsmith" class="freelinking" rel="nofollow">Akira Kobayashi, [[Cyrus Highsmith</a>, <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a>, <a href="/wiki/Sibylle%20Hagmann" class="freelinking" rel="nofollow">Sibylle Hagmann</a>, <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a>, <a href="/wiki/Jim%20Spiece" class="freelinking" rel="nofollow">Jim Spiece</a>, <a href="/wiki/Thomas%20Rickner" class="freelinking" rel="nofollow">Thomas Rickner</a>, <a href="/wiki/David%20Berlow" class="freelinking" rel="nofollow">David Berlow</a>, <a href="/wiki/Richard%20Kegler" class="freelinking" rel="nofollow">Richard Kegler</a>, <a href="/wiki/Charles%20Nix" class="freelinking" rel="nofollow">Charles Nix</a>, and <a href="/wiki/Kent%20Lew" class="freelinking" rel="nofollow">Kent Lew</a></p>
    <p><em>Interrobang 5</em> 2007<br>
    Articles</p>
    <ul>
    <li>"Tech Spotlight" the State of <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a></li>
    <li>"Neutrality in Type Design" by <a href="/wiki/Kai%20Bernau" class="freelinking" rel="nofollow">Kai Bernau</a></li>
    <li>"The Ressurection of Zebra" by <a href="/wiki/Richard%20Kegler" class="freelinking" rel="nofollow">Richard Kegler</a></li>
    <li>"Unexposed" Five Unpublished Typefaces</li>
    <li>"Art in Type Design" by <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a></li>
    <li>"The Scribe and the Silhouette" by <a href="/wiki/Mark%20Jamra" class="freelinking" rel="nofollow">Mark Jamra</a></li>
    <li>"A Boy and His Type (on <a href="/wiki/Christopher%20Stern" class="freelinking" rel="nofollow">Christopher Stern</a>)" by <a href="/wiki/Amy%20REdmond" class="freelinking" rel="nofollow">Amy REdmond</a></li>
    <li>"Happy Birthday, Helvetica"</li>
    </ul>
    <p><a href="http://www.typesociety.org" title="http://www.typesociety.org">http://www.typesociety.org</a></p>
