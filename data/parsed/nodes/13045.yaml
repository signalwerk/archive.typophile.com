    <li>Typress by <a href="/node/add/wiki?edit%5Btitle%5D=Jacques%20Le%20Bailly" title="Create node &quot;Jacques Le Bailly&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jacques Le&nbsp;Bailly</a></li>
    <li>Enterprise by <a href="/node/add/wiki?edit%5Btitle%5D=Angus%20Shamal" title="Create node &quot;Angus Shamal&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Angus&nbsp;Shamal</a></li>
    <li>Latinaires by <a href="/node/12302" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alejandro&nbsp;Paul</a></li>
    </ul><p>Colophon
    </p><ul><li>Worldwide, Preface, and Artifact by <a href="/node/12442" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick&nbsp;Shinn</a></li>
    <li>Plumpo by <a href="/node/12301" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Peter&nbsp;Bruhn</a></li>
    </ul><p><em>Interrobang 2</em><br>
    Articles
    </p><ul><li>“The Case for a User Friendly <a href="/node/13840" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">EULA</span></a>” by <a href="/node/13842" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tiffany&nbsp;Wardle</a></li>
