    </ul><p>Type designers with work featured in the magazine include <a href="/node/add/wiki?edit%5Btitle%5D=Akira%20Kobayashi%2C%20%5B%5BCyrus%20Highsmith" title="Create node &quot;Akira Kobayashi, [[Cyrus Highsmith&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Akira Kobayashi, [[Cyrus Highsmith</a>, <a href="/node/12061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jonathan Hoefler</a>, <a href="/node/44331" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sibylle Hagmann</a>, <a href="/node/12062" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tobias Frere-Jones</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Jim%20Spiece" title="Create node &quot;Jim Spiece&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jim Spiece</a>, <a href="/node/13646" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Thomas Rickner</a>, <a href="/node/13682" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">David Berlow</a>, <a href="/node/12323" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Richard Kegler</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Charles%20Nix" title="Create node &quot;Charles Nix&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Charles Nix</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Kent%20Lew" title="Create node &quot;Kent Lew&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Kent&nbsp;Lew</a></p>
    <p><em>Interrobang 5</em> 2007<br>
    Articles</p>
    <ul><li>“Tech Spotlight” the State of <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a></li>
    <li>“Neutrality in Type Design” by <a href="/node/add/wiki?edit%5Btitle%5D=Kai%20Bernau" title="Create node &quot;Kai Bernau&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Kai&nbsp;Bernau</a></li>
    <li>“The Ressurection of Zebra” by <a href="/node/12323" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Richard&nbsp;Kegler</a></li>
