      <p><cite>Also proof of this is that in some regions IJ is pronounced differently, eg ‘ie’ in the East.</cite><br>
      Actually, I think that is a remnant of the origin of the ’j’ shape itself.<br>
      Before the ’j’ was a character, it was an alternative ’i’. A way to tell a ’ii’ from a ’u’, was to make the last ’i’ longer (’ii’ became ’ij’). I believe this was used in much the same way as a ’long s’ was used, at the end of a syllable. An example of a common Dutch word, still in use, which has the ’ii’-sound, but is written with ’ij’ is <em>bijzonder</em> (translated: special).</p>
    html_clean: |-
