    html: |-
      <p>This is how I would do an 'ij' ligature in a roman text face if I were limited to making a 'true' ligature, i.e. one where the components are connected.</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150221091440im_/http://typophile.com/files/ij-lig_5813.gif"></div><p></p>
      <p>Still, my preferred 'ij' solution would simply be just 'i' and 'j' brought together in a single glyph with minor adjustments to allow them to harmonize. I'm not sure what readers unfamiliar with the 'ij' digraph will make of the above ligature.</p>
      <p>And I don't really see how one would make an uppercase 'IJ' ligature of the connecting variety in the same style. I think the components in 'IJ' really should be kept separate, either maintaining their original forms or perhaps modified to suggest an interrupted 'U' as in Florian's example above.</p>
      <p>Making the 'ij' resemble a 'y' does benefit the foreigners, whether that is intended or not. In fact, the Dutch often 'internationalize' the spellings of some proper names by replacing 'ij' with 'y', so that the footballing legend Johan Cruijff is better known as Cruyff abroad, and Feyenoord of Rotterdam were originally Feijenoord before they changed the spelling for the benefit of foreigners who trouble pronouncing the original spelling.</p>
    html_clean: |-
      <p>This is how I would do an 'ij' ligature in a roman text face if I were limited to making a 'true' ligature, i.e. one where the components are connected.</p>
      <p></p><div class="imageWrap"><img src="/files/ij-lig_5813.gif"></div><p></p>
      <p>Still, my preferred 'ij' solution would simply be just 'i' and 'j' brought together in a single glyph with minor adjustments to allow them to harmonize. I'm not sure what readers unfamiliar with the 'ij' digraph will make of the above ligature.</p>
      <p>And I don't really see how one would make an uppercase 'IJ' ligature of the connecting variety in the same style. I think the components in 'IJ' really should be kept separate, either maintaining their original forms or perhaps modified to suggest an interrupted 'U' as in Florian's example above.</p>
