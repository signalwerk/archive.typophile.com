      <p>vanblokland wrote:<br>
      <cite>When the kids learn to read, the popular vowel combinations ee aa uu oo oe ui ei ij are taught as single sounds which happen to be written with two letters.</cite></p>
      <p>But the difference between the ’ij’ and other combinations, like the ones you mentioned is that they are not capitalized together (as T mentioned earlier in this thread). Wich to me suggest that we (the Dutch) ’can’ see the ’ij’ as a single (composit) letterform. I’m not aware of any other character combination, that gets capitalized together, even if they have the same sound as an ’ij’ (’ei’).</p>
      <p>ie:<br>
      ’ijs’ becomes ’IJs’ (translated: ice)<br>
      ’eis’ becomes ’Eis’ (translated: demand)</p>
      <p>Are there other languages where this is common practice? Or other character combinations wich get capitalized together?</p>
      <p>edit:<br>
      I thought of the Spanish ’ll’ digraph, as I remember it being written capitalized together, but according to wikipedia, that was wrong.</p>
      <p><cite>This digraph is considered a single letter in Spanish orthography, called elle. From 1803 was collated after L as a separate entry, but this is no longer done: in April of 1994, a votation in the X Congress [1] of the Association of Spanish Language Academies ruled the adoption of the standard Latin alphabet collation rules, so that for purposes of collation the digraph ll is now considered a sequence of two characters. The same is now true of the Spanish-language digraph, ch. Hypercorrection leads some to wrongly capitalize it as a single letter (“LLosa” instead of the official “Llosa”) as with the Dutch IJ.</cite><br>
      source: <a href="http://en.wikipedia.org/wiki/Ll" title="http://en.wikipedia.org/wiki/Ll">http://en.wikipedia.org/wiki/Ll</a></p>
