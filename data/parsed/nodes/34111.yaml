      <p>Just something came up by expanding TazIII at fontfabrik. By reading a dutch book I was surprised to read the word fijn over and over with a ’fi’ ligature separating the ’j’ form the ’i’. I would have posted it into this <a class="freelinking-external" href="http://www.typophile.com/node/3807">treat</a>, but it seems to be closed.<br>
      My solution for this problem would be <strong>sub f j’ j’ by f ij;</strong> and <strong>sub f f ij.alt by f_f_ij.alt;</strong>. Sure including a language lookup so the Fijians still will have the f_i in front of the j.<br>
      The only page I found something about this subject so far was <a class="freelinking-external" href="http://blogs.msdn.com/michkap/archive/2006/08/14/698304.aspx">Sorting It All Out</a>.</p>
      <p></p><div class="imageWrap"><img src="/files/Tazfijn_4106.jpg"></div><p></p>
      <p>Aseptically if the dot of the ’i’ is swallowed by the ’f’ the wrong letters are bundled together :</p>
      <p></p><div class="imageWrap"><img src="/files/TheSansfijn_5290.jpg"></div><p></p>
