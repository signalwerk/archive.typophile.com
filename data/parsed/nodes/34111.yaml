      <p>Wanting to distinguish 'ij' and 'ÿ' in print is the reason why I do not advocate a true ligature for 'ij'. But that's the internationalist perspective in me speaking. Yes, of course the Unicode Consortium distinguishes the two, because it is an international standard.</p>
      <p>For Dutch use, I don't think there is reason to fear the confusion. In a lot (most?) of Dutch handwriting, 'ij' and 'ÿ' would be virtually indistinguishable precisely because there is no semantic need for distinguishing between the two. 'Y' is not used in native Dutch words, so I'm guessing 'ÿ' would be extremely rare to the point that the 'ij' or 'ÿ' confusion would be a false dilemma when applied to Dutch--the 'ÿ' is a false alternative in Dutch, and in Dutch minds perhaps even considered a variant form of 'ij'. It is nothing like the relationship between 'i' and 'j', each of which has its own independent uses distinct from the other in most modern languages using the Latin alphabet.</p>
      <p>This of course does not apply when you want your text typeface to work for languages other than Dutch, in which case 'ÿ' may very well be used.</p>
      <p>On a somewhat related note, in setting Dutch a ligated 'ij' distinct from 'i'+'j' would be a plus in that it helps distinguish between the digraph 'ij' and cases where the letters 'i' and 'j' are not part of a digraph, as in words like 'bijou' from the French. So a true 'ij' ligature, while not appropriate for most text setting, may be useful in things like dictionaries or textbooks for learners of the Dutch language.</p>
