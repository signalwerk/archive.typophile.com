      <p>I don't think automatic ligation is the best option because not every 'ij' combination in Dutch is the digraph (even if for 99% of the time it is). The 'i' and 'j' might come from different syllables, or it might be a loanword.</p>
      <p>My take: to use special 'ij' and 'IJ' ligatures for Dutch, one should manually search and replace the 'ij' and 'IJ' combinations in the text, taking care to make sure to replace only when the digraph is wanted.</p>
      <p>Cumbersome, I know. But unless one has a special reason for distinguishing the digraph and non-digraph combination of 'i' and 'j' (for specialist texts, dictionaries, language learning materials, etc.), I don't see a compelling reason to replace the lowercase digraphs with special glyphs. For the uppercase 'IJ', I can allow that for certain designs a special glyph for the digraph may be desirable.</p>
