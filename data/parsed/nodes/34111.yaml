    html: |-
      <p>Regarding the "heijmans" logo, I see it like this:</p>
      <p>The "h" is interrupted in a stencil cut fashion. This is inconsistent witt the rest of the word, but since this form is reflcted in the "ij" with a hooked foot on the "i", I, as a non-Dutch reader, interpret it as a stencil cut "y" (since the "h"" prepared me for reading through more stencil cuts), and thereby wind up pronouncing the word more correctly (hey-mans) than I would if I had attempted to through ordinary English phonics (hëzh-mans) rather awkwardly making up sounds for letter combinations usually absent in my language. I don't know if this was intentional, enabling more correct pronunciation by foreigners, but that's how it works for me.</p>
    html_clean: |-
