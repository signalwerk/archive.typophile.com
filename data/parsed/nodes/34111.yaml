      <p>Jongseong: <em>Yes, of course the Unicode Consortium distinguishes the two, because it is an international standard.</em></p>
      <p>Actually, Unicode encoded the Dutch IJ/ij digraphs as distinct characters, separate from the I+J and i+j sequences, because they were pre-existing characters inherited from a Dutch telecom standard. For the most part, Unicode does not encode digraphs. But some are encoded for backwards, roundtrip compatibility, as in this case.</p>
      <p>For the most part, Dutch users do not use the digraph characters -- although some, like Thomas Milo, certainly advocate its use -- they just type I+J and i+j. So far as I know, the IJ/ij digraph characters are not accessible via the standard Dutch keyboard.</p>
    html_clean: |-
