      <p><em>No; in immersion, neither.</em></p>
      <p>Again: language-is-language-is-language. We don’t have special areas in the brain the process language differently depending whether we are reading ’immersively’ or not. What happens before language gets to that stage, e.g. in vision and in perceptual processing, may be different, but phoneme and grapheme are terms that specifically refer to mentally abstracted units of <em>language</em>; they refer to what we recognise as units of language. Whatever else happens on the page, in the field of sight, in the eye, and in the visual receptors of the brain and the synaptic passage to those language processing areas, at some point you are dealing with phonemes. [Unless of course the phonemic model of language is incorrect, but — very ironically considering your position — the linguists who reject the phonemic model do so on the basis that they consider it a literary construct, i.e. inherently connected to writing and reading.]</p>
      <p><em>Seeing a bouma strictly as a set of graphemes is counter-productive.</em></p>
      <p>I agree. I think of bouma as one or more (usually more) features in a role architecture (to use Peter Enneson’s phrase). So a bouma may be made up of features that happen to correspond to discreet graphemes, or may be composed of fragmentary features from different graphemes. One of the implications of this is that a single grapheme may contribute to multiple boumas (although, practically, probably not more than two).</p>
      <p><em>Broken down, or built up? I’m not sure.</em></p>
      <p>You can’t build up to a phoneme because, by definition, the phoneme is the smallest recognised unit of language that contributes to the identify of a word. But if you think of boumas as package data, you could imagine phonemes being ’recompiled’ from bouma perception. So let’s imagine that the reader ’sees’ two boumas, each of which includes features from a particular phoneme. At some point in word recognition, that information has to be re-organised by the brain so that the phoneme is identified. [Phoneme identity is crucial to word recognition, because the phoneme is the smallest unit of language that contributes to word identity, i.e. if you change one phoneme in a word, you have a different word.] So whatever role boumas play in the perceptual aspect of reading, at some point in the cognition aspect they must be translated into language, either by being broken down into phonemes (in the case of boumas made up of more than one discreet phoneme) or re-compiled into phonemes (in the case of cross-bouma phonemes).</p>
      <p><em>I’m proposing that the linguistic-analysis relevance of “ij” is secondary and maybe even misleading.</em></p>
      <p>That depends on whether, in terms of overall reading speed — i.e. of the combined perceptual processing and language processing operations — there is a net benefit to boumas corresponding to discreet graphemes. There may well be, in which case linguistic analysis would be an important tool in figuring out optimal bouma divergence. And even if there is not a significant gain in correlating boumas to graphemes or grapheme clusters, there might not be any converse gain, i.e. it might not matter one way or another whether boumas correlate to graphemes.</p>
      <p>But the linguistic analysis does provide a methodology for approaching super-letter design issues, and I think this thread demonstrates that. We simply wouldn’t be talking about the ij digraph and its possible divergence in boumas if not for the fact that it represents a discreet phoneme in Dutch. And I notice, with significant irony, that all of your proposed ideas for different graphical representation of ij are made in isolation, i.e. not considered as part of larger boumas. As such, I think they’re basically arbitrary, capricious design play. In order to make a serious case for divergence, you would need to identify potentially confuseable boumas involving ij, in which varying the representation of ij would disambiguate the boumas.</p>
