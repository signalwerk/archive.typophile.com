      <p><em>a suggestion how to handle it more elegant.</em></p>
      <p>Seems to be similar to the Turkish f_i situation.<br>
      For that, a “locl” feature with the use of a special “Turkish i” — identical to the normal dotted i—has been recommended.</p>
      <p>So perhaps a “Dutch j” is needed, for use after the letters fi, to kill the ligature.</p>
      <p>In the locl feature:</p>
      <p>Language Dutch<br>
      sub f i j’ by DUTCH_j;</p>
      <p>And later, in the liga feature:</p>
      <p>ignore sub f i DUTCH_j;</p>
      <p>Sorry if that’s not the final code, but just thought I’d mention the idea.</p>
