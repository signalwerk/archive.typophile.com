    html: |-
      <p>In "standard" fonts, ideally I make ij's — pronounced ee-yay for you non-Dutch &amp; Flemish speakers — so that the dots of the i and j components are a standard dieresis. The ij is the modern variant of the ÿ, and if you were to track a word with an ij in it, the ij would not become separated: B . A . K . K . E . R . IJ</p>
      <p>Monospace fonts should have ij and IJ, as does OCR-B.</p>
      <p>I always create ij's in my types. Sometimes some tweaking of the component forms is necessary, sometimes it's not.</p>
      <p>Huisstijl means, quite literally, "house style", which is the Dutch analogue of corporate identity. Often, a huisstijl consists of a beeldmerk — picture mark = icon —&nbsp;and a woordmerk — word mark = logotype.</p>
    html_clean: |-
