      <p>Thank you all so far.<br>
      That <strong>ij</strong> is a separate glyph in dutch and needs special handling is out of question.<br>
      By discussing the case with Luc(as) we decided that Erik suggestion for using<br>
      <strong>f ij n</strong> rather than <strong>fij n</strong> makes totally sense.</p>
      <p>As we are taking care of the glyph-order in the glyph-window in <strong>CS3</strong> which is default set on ’sorted by Unicode’ there is a new issue coming up.<br>
      If I use <strong>sub f i’ j’ by i_j</strong> (thanks Ms :) all the ligatures will not longer be placed behind the <strong>f</strong>. Just a detail but to avoid that i created a <strong>f_i_j</strong> and <strong>f_f_i_j</strong> ligature without connection to be used in Dutch, as long <strong>ij.alt</strong> is not applied.</p>
      <p>I would be really interested if someone has a better approach for this problem or a suggestion how to handle it more elegant.</p>
