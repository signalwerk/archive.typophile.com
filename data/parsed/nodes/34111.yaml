    html: <p>Personally I don’t think the <em>fi j n</em> looks good. The <em>f i j n</em>option is better, or the <em>f ij n</em> in which the f does not ligate with the ij. When the kids learn to read, the popular vowel combinations <em>ee aa uu oo oe ui ei ij</em> are taught as single sounds which happen to be written with two letters. The <em>ij</em> ligature would be better, a u with a long j tail and a dieresis.</p>
