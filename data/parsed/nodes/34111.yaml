      <p>We might actually be getting somewhere.</p>
      <p>As I wrote earlier, I think the terms phoneme and grapheme are exchangeable, and the latter term is probably redundant, since both refer to perceptual units in language processing. In the same way that phoneme is used to refer to the mental abstraction of units of both vocal and sign language, so it may be used to refer to the same abstractions in textual language. To the language processing areas of the brain, language-is-language-is-language. But for the purposes of this discussion, let’s stick with grapheme for now, so long as we’re clear that a grapheme is something in the mind and not something on the page.</p>
      <p>Now, if we flesh out the notion of bouma and relate it to graphemes in the way that Hrant suggests, i.e. a bouma is made up of graphemes, then it’s clear that we’re looking at a different kind of perceptual unit, a unit in visual processing on its way to being broken down into units of language processing. The bouma, like the grapheme, is something in the mind, not on the page, but it’s being handled by the parts of the brain that deal with visual perception not language cognition. Is this a reasonable statement, Hrant?</p>
      <p>So I begin to see how you might make a distinction between e.g. the ij in two different Dutch words based on bouma divergence, but only in terms of adjacent letters, i.e. as part of a larger bouma of more than the single grapheme represented by the ij digraph. Is that the point?</p>
