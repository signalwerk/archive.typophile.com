      <p><em>Readability (via divergence).</em></p>
      <p>I hadn't noticed that Dutch people had a problem reading. They have one, very regular digraph in their orthography. English has many, very irregular digraphs, and a couple of trigraphs. Digraphs are a feature of many alphabetic writing systems. Rather than assuming that visual divergence of digraphs assists readability -- really a kind of spelling reform, in which you invent new letters or diacritics based on merging or ligating digraphs --, it seems to me that we should try to understand just what it says about the reading process, and the flexibility of that process, that so many cultures and linguistic groups have adopted digraphs, trigraphs and even tetragraphs as part of their reading systems. The idea that sequences of letters can function equivalently to single letters in the representation of sounds is remarkable. It indicates that unitisation happens quite comfortably in the mind, relative to language and memory, independent of unitisation of written marks. Since unitisation of written marks is so easily achieved -- either through the invention/importation of new letters, ligation or use of diacritic marks -- it is notable that so many different orthographies should have instead adopted the use of sequences of existing letters to represent individual sounds.</p>
    html_clean: |-
