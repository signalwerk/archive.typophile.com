      <p>Hrant, you're right; 'true ligature' is a problematic term. I just wanted to refer to forms where there are joins between (the black parts of) the components. Yours would be true ligatures in the sense that I was using the term--they are certainly distinct from 'i' and 'j' next to each other.</p>
      <p>I wanted to introduce the distinction because the term 'ligature' is ambiguous (although I probably caused more confusion in the process). Was T, in his original question, referring to fonts that simply have glyphs for the 'ij' digraph? Lots of fonts do, but most use forms indistinguishable from 'i' and 'j' next to each other. I surmised he wanted to know about fonts that do more than that.</p>
      <p>The 'virtual' ligation you speak of is just another name for the harmonious fitting of the black and white letters, which good designs should be doing anyway between any pair of letters.</p>
      <p>&gt;there’s even less reason to revere history.</p>
      <p>History? I was basing my suggestion on current handwritten forms. I don't even know if the resemblance between 'ij' and 'ÿ' has a historical basis, and I suspect they really don't--it's probably a chance convergence. I just wanted a form that makes the most sense to the modern Dutch speaker.</p>
