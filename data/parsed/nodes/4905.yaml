    html: <p>These issues go all over the map. Obviously there is need for "good book faces", old, or new. We have an abundance of the rest. <br> <br>Still the real question remains. What makes for good book design? Is it as Nick suggests, type decision, and type decision only. Otherwise he asks, "why not use default grids?" <br> <br>(not exact wording, to lazy to find the archives) <br> <br>Clearly questionable logic. One (1) good book face is more important than quantity. The work of Aldus Manutius demonstrates not only one (1) good book face, and take further note, in one (1) point size only. Aldus Manutius is a name you should all know. <br> <br>A good book designer can certainly produce beautiful books with "a single type face for their entire working career." <br> <br>I say to "those that disbelieve" that they know nothing of the history of book design. In fact, contrary to arguments type designers offer, just examine the plethora of typographical book design failures in spite of "accidental good type face decisions". <br> <br>Type face choice is an important ingredient in book design, as is paper, paper size, colours, margins, illustrations, text page to sheet size ratios, point size, spacing, line length, table of contents, character count, binding etc. etc. <br> <br>Easily comparable to cooking. Without quality ingredients it is impossible to make the finest of foods. However, that said, "a bad chef" can not make a culinary masterpiece from the finest of ingredients.  <br> <br>The "cook for the book" is the designer, not the ink saleman, type salesman or the "green grocer".  <br> <br>Remember what your mothers said, "too many cooks spoil the broth". <br> <br>Type design is not the Eiffle Tower of typography. What is so badly needed in the type manufacturing industry is a broader appreciation and understanding of the industry at large. Navel gazing should be kept to a minimum. <br> <br>The "type designers and manufacturers of 90,000 digital fonts doe not dictate taste".  <br> <br>"Good taste" is a sophistication of refinements. Like it or not. <br> <br> <br> <br> <br></p>
