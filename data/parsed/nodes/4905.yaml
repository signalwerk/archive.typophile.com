    html: <p>William, my perspective is more Marx than Hegel. <br> <br>The appearance and function of fonts are important -- they have to do the job -- but appearance and function are not absolutes, but culturally specific. <br> <br>I think it is important to express the zeitgeist, but not for reasons to do with historical time. Like Tiffany, I am neither for or against tradition or fashion. What concerns me is that people today should contribute to their culture in a meaningful way (hopefully paid as well).  <br> <br>What I object to is that in many ways Helvetica, and the "Adobe Original" are our zeitgeist. The Adobe Original is, with perfect Newspeak, a revival. Now matter how "good" such a typeface is, it represents the way that trans national corporations have come to dominate the cultural landscape, restricting opportunity for content creators. <br> <br>Helvetica, Adobe Garamond, and Minion are good typefaces, but they would not occupy their present position of popularity had their free distribution not been part of a strategy used by companies whose primary business is to sell other, more lucrative products such as computers, operating systems, and major applications. <br> <br>On the upside, there is a thriving, diverse industry in script fonts (with a growing prosumer market), and, to a lesser extent, pixel fonts (for Flash). <br> <br></p>
