    html: <p>I greatly admire innovative work in type design, including Nick's, but I do not think his - your - view  <br>on this is quite right in the case of type. <br> <br>For computers, better ones have made past ones more or less obsolete.  <br>As a general rule, there is no point in using the last generation of computers. <br> <br>With type, I think the analogy is more to architecture than computers. <br> <br>I live in the Washington DC area, and two of the best monumental buildings in the area are the <a href="http://www.nps.gov/linc/" target="_blank">Lincoln memorial</a> and <a href="http://www.greatbuildings.com/buildings/Dulles_Airport.html" target="_blank">Dulles Airport</a>.  <br>The Lincoln Memorial is more or less a copy of a Greek temple, with the fabulous statue of Lincoln in the middle.  <br>Dulles, designed by Eero Saarinan, is an icon of modern design, with its sweeping wing-like roof. <br> <br>Was it a mistake to copy an Greek temple in the late 19th century?  <br>No, because of the resonance with ancient ideals of democracy, and what Lincoln stood for in extending these ideals to all Americans.  <br>Also by simply doing a copy, they didn't mess it up, but got a fabulous result. <br> <br>Saarinen's design was very much of its time, but when it came to expanding it a few years ago, they just doubled the length, not changing anything.  <br>In fact this was the original design, and Saarinen had adjusted the design so that only half could be built first.  <br> <br>Was it stupid to simply build a 60's design in 2000? I don't think so.  <br>It works beautifully. <br> <br>Now it would have been stupid in the '60s to build an airport as a Greek temple.  <br>Having a modern building was appropriate and worked well. <br> But expanding it in the 60s style - the only smart thing to do. <br> <br>I think these examples illustrate that what is appropriate in design and use in relation to history is a complicated matter,  <br>and that newer is not necessarily better.  <br>There is a place for historical revivals, and they are sometimes better than the contemporary  <br>- and sometimes not.  <br> <br>I may be wrong but I detect in Nick's arguments some buying into Hegel's idea of the 'zeitgeist', the spirit of the times.  <br>Of course, fashions are a reality, but what Hegel is claiming is that some are superior, the 'wave of the future',  <br>and that everything that doesn't go along with the Zeitgeist is backward.  <br>The same type of thinking goes is in the somewhat different idea that there is an 'avant garde',  <br>and everything else done is more or less stale and worthless.  <br> <br>Fashion is exciting in itself, and I have nothing against it.  <br>But most fashions go stale and a few turn out to be lasting.  <br>Because something is innovative doesn't mean it is necessarily good or most appropriate for every project and setting.  <br>In many cases old and good is better even than new and good.  <br>And of course the other way around is also often true. <br> <br>A new design that is good is a greater personal achievement for the designer,  <br>but it is not necessarily better than an old design, even for contemporary works.  <br> <br>I think new, excellent work that that done by some who post on this board, including Nick, is exciting and wonderful to have and use.  <br>But that doesn't mean that less innovative work is less useful or appropriate in many, if not most, contexts.   </p>
