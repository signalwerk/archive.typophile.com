    html: <p>Hmm. You know very well that I wasn't being profound. And yet you had to go for the easy smart remark. Oh well. I was simply trying to point out that I was thankful for the variety, new and old. It would be financially impossible to license all of the type to which I really would like to have access. I would hope that type designers today would want to improve or at least work toward an ideal improvement of their own thinking. Why design type if you aren't trying to improve? But, I don't think that you should throw out the old simply because there is new. <br> <br><i>Because something is innovative doesn't mean it is necessarily good or most appropriate for every project and setting.  <br>In many cases old and good is better even than new and good.  <br>And of course the other way around is also often true.</i>  <br> <br>Amen. It isn't cut and dried, nor is it black and white.</p>
