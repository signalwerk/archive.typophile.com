    html: <p>We don't know either the crap done 500 years ago or the good work that did not survive 500 years of time any more than we know what will be considered good work 500 years from now and what will be considered the crap of our time by those in the future. One thing is clear, if we do nothing now, there will be nothing to judge in the future.  Only the most arrogant among us can pretend they know what future generations will cherish.  After all, we can't (thank heaven) even agree among ourselves now on what is wheat and what is chaff.  I am sure Van Gogh didn't have a clue in his life that any one of his paintings would sell for millions of dollars after his death.   <br>   The only danger is doing nothing.  We should all design our brains out as we individually see fit.   <br></p>
