    html: <p>IMO, it's not the typeface, it's the designer who causes mischief. For every well designed book that makes the AIGA, there are scores of difficult to read solutions being OK'd by editors and publishers who should know better. If I may do so without sounding contentious, I would take exception to the comment above concerning typefaces in use in CH and D in the 50s and 60s. I was there, and I assure you that the Swiss, all over their well-ordered country, set plenty of Times New Roman better than we were doing in the USA. Ditto for Baskerville, Bodoni, Clarendon, and the lovely Diethelm, which we did not have. The output of even the smallest regional newspaper and job shop was far superior to our larger shops. Furthermore, they did it all with a dozen or so faces compared to our hundreds, most of which were just as mindless in metal as the digital of today. FWIW</p>
