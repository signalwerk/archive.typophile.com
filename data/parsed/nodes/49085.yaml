  - id: 300433
    user: 16708
    date: 2008-09-09T10:15:00
    date_raw: 9 Sep 2008 — 10:15am
    votes: null
    html: |-
      <p>Well the original one was designed to be a be-all-end-all font, and it's hard to find any fault in its designed from a math user's perspective.  All characters are easily recognizable without context from other letters, all the necessary variations, sizing concerns etc.  But it was also done after lots of research into previous font designs.  Donald Knuth, the author of the font, has an excellent write up on his design process in (<em>Computers and Typsetting</em>, vol. E).  I read it years ago and so have forgotten most of the details, but needless to say, he created a more or less definitive standard for design.</p>
      <p>And along those lines, because it is so well made and, let's be honest, a niche market, people aren't looking for variety.  When scientists can't be bothered to hire illustrators and designers to do their figures and instead leave it to Excel, do we really think they're going to go the distance and buy new fonts?  Because of that, and the large amount of work involved in creating and testing a font, it's just not something most people want to put the work into.  It falls much into the lines of what Thomas Phinney has been talking about with the new Adobe Latin charset.</p>
      <p>Remember, a math font needs to have regular, italic, bold, struck, and fraktur and combinations therewithin.  Also it needs some Hebrew and very carefully designed combining diacritics and a full set of sub/superscript variants and even better to have double-script variants.  And there is now the OpenType method of defining metrics as used by Word (which honestly seems like the more logical approach, I know, surprising that Word would take a logical approach to something) and the method I sitll need to look into for **TeX.  </p>
      <p>All in all it's a lot of work for a small market.  The only reason I'm doing it is because of my dad and I figure I can convince his department to use it (mathematicians can be surprisingly well convinced on things like this).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
