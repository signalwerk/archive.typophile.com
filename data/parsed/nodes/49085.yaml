    votes: null
    html: |-
      <p><cite>it’s hard to find any fault in its designed from a math user’s perspective</cite></p>
      <p>Yes, but from a type design point of view, many of the glyphs are a bit faulty (most lack any sort of optical correction). This is where you see the main difference between a font done by a mathematician and a font done by a real type designer (compare Computer Modern and Cambria for example).</p>
      <p><cite>people aren’t looking for variety</cite></p>
      <p>While most mathematicians don't care which font they use, in the last few years quite a few math fonts have been developed (see the <a class="freelinking external" href="http://ctan.tug.org/tex-archive/info/Free_Math_Font_Survey/survey.html" rel="nofollow">Free Math Font Survey</a> for an overview of the free ones) so those who do want to use other fonts can, although the choice is still rather limited.</p>
      <p><cite>the method I still need to look into for **TeX.</cite></p>
      <p>Math specific metrics are stored into TeX's own format, TFM (TeX File Metric). Making TFM files for math fonts is a bit technical. The first problem is that there are very few ways of generating them (the only ways I know of are metafont, fontinst, <a class="freelinking external" href="http://fontforge.sourceforge.net/PfaEdit-TeX.html" rel="nofollow">fontforge</a> and by hand). The second is that you need to test the fonts, so you must have a TeX distribution installed and have enough knowledge to install your new fonts (not so easy: there's more involved than putting the files into a directory; but once you know how to do it, it's not difficult).</p>
      <p>You can find a technical description of the TFM font format in Yannis Haralambous' book <a class="freelinking external" href="http://books.google.com/books?id=qrElYgVLDwYC" rel="nofollow">Fonts and Encodings</a> from O'Reilly.</p>
      <p>If you're really up to it and don't mind all the technical hassle of the process, I should probably be able to answer most of your questions on the subject.</p>
