      <p>Hi all,<br>
      I am currently attempting to construct a book of equations expressed typographically as well as mathematically and have been wondering about this.<br>
      Why is it that only those three / four fonts are considered maths friendly?</p>
    html_clean: |-
      <p>Hi all,<br>
