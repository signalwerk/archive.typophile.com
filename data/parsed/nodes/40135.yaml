    html: |-
      <p>Here's one opinion. The colors, type classes and layout are in my opinion inappropriate for the product. Red, black and grey do not make me feel like sitting down, a coke  perhaps. The main face is more suited for TV, being not classic, but rather tight and harsh, not unlike this opinion. The little hand written "design" signals informality and rush to be followed by illegibility in use. The layout is calling the eye to nowhere all at once. The ornament is fine, an excellent start which if centered, with one or two classic wrought typefaces (the Ironmonger family, being one of many), and nice soothing colors not too far from black, would be a less modern, more classic alternative to the logo you show.</p>
      <p>Cheers!</p>
    html_clean: |-
