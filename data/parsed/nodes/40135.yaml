    html: <p>I like that last one, James. The main text is still modern like Marosi's original, but has a more hand-wrought feel, almost as if they're fashioned from bent strips of metal, like a branding iron. The second line also has a rough hewn quality about it. The flourishes are perhaps a bit too neat and regular, possibly slightly too large, but they're well placed. All the elements together make for a logo that would work well with a wide range of product styles from very formal traditional pieces to the most contemporary designs without being horribly out of place on any of them.</p>
