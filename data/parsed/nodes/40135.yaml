    <p>i need an opinion about this logo. me and my boss had a little fight over this subject - nothing serious though :P.He said that i was hard headed and wanted to "sell" this logo to the client giving him no other alternative. whatever... i`m only curious what do you fellows have to say about this. the business is about cast iron furniture merchandising and the products go from cheap to very expensive, from bed to banisters and chairs and shelfs. Thanks :) </p>
