      <p>a bigger issue than the logo is the name. No one can spell that if they type that into google. ;o)</p>
      <p>It is a decent logo, but I agree with dberlow in that this doesn't quite fit the product's vibe...the type feels more 'automotive' design than 'traditional cast iron' design. Neither the rounded sans nor the handwriting faces really fit the subject, IMHO. The flourish is nice, though.</p>
      <p>ADDENDUM: I now notice that the product line varies quite a bit from traditional to modern, so perhaps mixing the faces up a bit isn't that bad of an idea. However, I'd still focus on a more 'ornate' main typeface that echoes traditional cast iron metalwork, and then maybe go with a more modern secondary face. I'd still probably omit the handwriting one.</p>
