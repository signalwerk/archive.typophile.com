  html: |-
    <p>I have developed an Opentype family for a client. I generated them all and produced a test document using InDesign CS3 and exported the document as a pdf to Acrobat 8. So far so good.</p>
    <p>The client sent an email last week which stated that they had done the same thing in InDesign CS4 and exported the document as a pdf to Acrobat 9. Both documents were fine. They then sent the pdf to their printer who tried to open the pdf in Acrobat 7. Using Acrobat 7 the OpenType font appears as 'notdef' symbol apart from a couple of characters.</p>
    <p>The so-called technical expert at the printers is insisting that the font is corrupt and unusable, whereas I think it is an Acrobat issue.  He knows that he can just download the latest version of Acrobat 9 for free, but for some reason insists on using Acrobat 7, making out that downloading and installing the latest version would be a major inconvenience, while insinuating my incompetence.</p>
    <p>The strange thing is that an earlier Postscript typeface (in blue) displays with no problem in both versions of Acrobat. Have I done something wrong when generating the OTF?</p>
    <p>Has anyone else had this incompatibility problem with InDesign CS4, OpenType fonts and versions below Acrobat 8?</p>
    <p>Thanks in advance for any replies.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Acrobad_5423.gif"></div><p></p>
