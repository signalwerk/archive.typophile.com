    html: <p>I think the issue is from trying to open up a newer PDF-version file with an old version of Acrobat. Try a test - save your PDF's down to Acrobat 5 level and see if the printer can open that successfully. If so, that proves that it's Acrobat 7 at fault and not the font.</p>
