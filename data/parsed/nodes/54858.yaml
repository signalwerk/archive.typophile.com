    html: |-
      <p>Somebody has been looking into this and this is their response:</p>
      <p>The font in question is broken/invalid inside the PDF (don’t know about the original, but whatever embedded and/or modified the embedding killed it).</p>
      <p>A Type 1 font’s built-in encoding shall be defined by an Encoding array that is part of the font program, not to be confused with the Encoding entry in the PDF font dictionary.</p>
      <p>The encoding array in the problematic font has only ONE ENTRY (the ‘A’, which is why it displays correctly).</p>
      <p>We have code now in CT/PDFL/Acrobat that detects this bogus case and falls back to using the Encoding from the PDF font dictionary instead of the embedded Encoding...</p>
      <p>I have no idea what this means, But I presume it relates to CS4. I do know the font does not have a standard Adobe character list, and when I generated the font window name was set to 'MacOS Roman' - maybe it should be set to 'Imported'?</p>
      <p>Where is the info for the encoding array in the font which shows only ONE ENTRY?</p>
      <p>Nick Cooke</p>
