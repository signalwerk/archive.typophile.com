      <p>&gt; <em>A Type 1 font’s built-in encoding shall be defined by an Encoding array</em></p>
      <p>This should usually be set to <strong>StandardEncoding</strong>. In FontLab this can be achieved through the Preferences. But you're generating an OpenType font from FontLab, so I'm not sure how this option affects that.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/StandardEncoding_3860.png"></div><p></p>
      <p>Nick, I have CS4. If you send me one of the fonts I'll test it along with some of our fonts.</p>
