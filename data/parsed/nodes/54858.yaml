      <p>What version of Acrobat did you select by 'Compatibility' in the PDF export options? </p>
      <p>Set it to Acrobat 5.0 (PDF 1.4). Or choose PDF/X-1a:2001 under 'Standard', which sets it even to Acrobat 4 (PDF 1.3). I don't think it has anything to do with CS4, but with compatibility settings.</p>
      <p>He should be able to open the PDF in his old Acrobat 7.0 then.</p>
