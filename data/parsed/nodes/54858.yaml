      <p>Nick,<br>
      I know this is an old question, but I've just encountered a similar problem by another means. I'm a Ventura user and have found difficulty with the interface between Ventura and Acrobat, mostly related (I believe) to the amount of RAM available. In replacing an old desktop with a new machine with 8 MB of RAM, running Ventura 10 and Acrobat X, I discovered when I tried to use Adobe's Caslon Pro in its .otf format, Ventura would display the typeface with no trouble, would print to an HP 1320 with no problem, but Acrobat would generate blank pages whereever I had the .otf font. Acrobat printed rules (e.g., crop marks) fine and rendered heads and subheads that used a .ttf font, but NO GO on the .otf. When I uninstalled the Caslon Pro set of fonts, converted the 4 weights to .ttf, and reinstalled, I was able to generate a pdf (though a request for a pdf of the entire publication elicited an error message in Acrobat). Using CorelDraw X3 for comparison, I found when I changed the text to the .otf font, the text disappeared in Draw. So the problem must be a matter of interface between .otf and some applications (notably both Acrobat and Draw).</p>
