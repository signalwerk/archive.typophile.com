      <p><em>contemporary serif</em></p>
      <p>That would be 1948. So Caledonia, Dante, Electra and Fairfield would be suitable pairings.<br>
      Of these, probably the "Scotch" Caledonia is best, as both it and Trade Gothic are revivals of 19th century genres.<br>
      Speaking of <a href="http://www.shinntype.com/scotch.html" rel="nofollow">Scotch</a>...</p>
