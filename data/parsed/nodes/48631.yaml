    date_raw: 23 Aug 2008 — 10:10am
    votes: null
    html: <p>Linotype Sabon and Monotype Garamond both go well with Trade Gothic; try them. Both are wider and slightly lower-slung than other Garamonds, like Adobe, which is why they would work better for you. Clean, not funky, almost transparent in effect--that's what you want, because that's Trade Gothic's personality.</p>
