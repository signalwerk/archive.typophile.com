    html: |-
      <p>I once did this for a book (TG was the corporate font of the organisation):</p>
      <p>- Headlines set in TG Bold No2, same optical size as reading text (need to adjust the sizes!).<br>
      - marginals, pagina, ... set in Trade Gothic Regular<br>
      - reading text set in Kepler Pro, I think it was SemiCondensed (to fit width) and Caption optical weight (to get it "darker"). But Kepler is very flexible, so you can fine tune quite well to your needs.</p>
      <p>It turned out quite beautiful in print, I would do this again.</p>
