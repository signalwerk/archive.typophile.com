    html: <p>In print I think it depends on quality; the difference between something that is merely promotional vs. something that has been created to really show off what the typeface is, how and where it could be used. <a class="freelinking external" href="http://www.underware.nl/publications/" rel="nofollow">Underware's publications</a> are a great example of the latter, I am also a big fan of <a class="freelinking external" href="http://www.houseind.com/objects/objects/catalog62collectorbundle" rel="nofollow">House Industries' promotional specimens</a> and <a class="freelinking external" href="http://www.houseind.com/objects/" rel="nofollow">associated products</a>. I think <a class="freelinking external" href="http://www.ffmark.com/" rel="nofollow">FontFont's FF Mark web site</a> is probably a good indication of what specimens have become and will continue to evolve as...</p>
