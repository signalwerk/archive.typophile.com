      <p>Paul, </p>
      <p>In case you are still searching, Part 7 and Part 8 of the <a href="http://bowfinprintworks.com/ScriptIDGuide.html" target="new">Script Font ID Guide</a> would include brush scripts. Calligraphic (pen) scripts would be in Part 4. You might find something that fits what you are after in those pages. Fonts from <a href="http://artandsignstudio.com/fonts.html" target="new">Art &amp; Sign (Signfonts.com)</a> and <a href="http://www.signdna.com/v2/index.php" target="new">Sign DNA</a>  are often overlooked, and they are good sources of hand-lettered script font styles. (Use the Script Font Reference List to look up the suppliers.)</p>
      <p>- Mike Yanega</p>
