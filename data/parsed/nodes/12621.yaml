    date_raw: 30.May.2005 10.16am
    votes: null
    html: |-
      <p>The earliest group of the SignDNA fonts do look like digitizations of some photo-lettering scripts, but there are many others too. In some cases the reason they look familiar is that the lettering was done by men who did lettering for the photo type companies, or who have done lettering commercially for years. I also think it is fair to say that there is/was a certain ’commercial sign script style’ that was widely used, in which legibility was more important than individual style, and where stroke thickness and slant were the main parameters for variation. Look through the Solotype Catalog pp.88 - 106, if you want to see what I mean.</p>
      <p>- Mike Yanega</p>
