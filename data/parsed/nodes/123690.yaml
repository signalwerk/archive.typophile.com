  html: |-
    <p>This is my first post here, but I've lurked for years without an account =) So, hi everyone!</p>
    <p>I have a question. I need a typeface for an ebook. I know the usual requirements; good hinting, high x-height, thick lines... But I don't know how to proceed after them. Neither Kindle nor Kobo renders kernings.</p>
    <p>So, which typeface offers the best performance without kerning and has the usual requirements?</p>
    <p>Thanks!</p>
