      <p>I couldn't find anything particularly similar, but the best candidate starting points I would pick are <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/keyboard-rr/" rel="nofollow">Keyboard</a> from Red Rooster, or <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/onyx-mt/" rel="nofollow">Onyx</a> from Monotype. Both have similar contrast and shape to Dollhouse, but both would need a lot of changes, particularly to the terminals. Onyx at least has some ball terminals.</p>
      <p>- Mike Yanega</p>
