    <p>Hi everyone,</p>
    <p>i'm currently doing a complete redesign for a programming and design agency starting with the logo. It's name is a composite of the german words 'netz' (means net) and 'elf' (means eleven and elf). Despite the latter has two meanings, 'elf' (the little guys with the long ears) is adequate.</p>
    <p>Thinking about how to express an elf i only could find the ear as unique for it. As the sign will be used in very small sizes (12x12px) for icons and such it has to be quite simple. So heres my try (The tag line means 'agency for good image'):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo_4404.png"></div><br>
    As this seems not "eary" enough to me i tried a little modification:<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo4_3729.png"></div><br>
    I would love to hear what you think of my attempts and if you like it :)<p></p>
    <p>Do you perhaps have some other ideas how to express an elf?</p>
    <p>Thanks a lot,<br>
    Christian</p>
