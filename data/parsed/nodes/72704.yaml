    html: |-
      <p>Thanks for your comments :)</p>
      <p>@Miss Tiffany: Is it much to tight or just a bit? What you think of this a little more wide version (t&lt;-&gt;z, t&lt;-&gt;u, r&lt;-&gt;u, t&lt;-&gt;e)?:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/logo5_5626.png"></div><p></p>
      <p>@sebastian Thank you :) I asked around a lot what people see with that and - unfortunately - almost all did not see an ear (Mostly they thought it's a 1). But at least they saw the ear when they were told that it is one.</p>
      <p>The problem with an entire isolated ear is that it's very hard to combine with an serious logo and it's shape is much more complex than just the tip what makes it complicated to optimize it for lower sizes. Also i don't have an idea of how to glue it togehther with the rest of the logo. BUT: When you have some fresh idea i would love to hear about it. </p>
      <p>Thanks for your approach above - despite it might not yet be suitable for the logo i like it :)</p>
      <p>About the flimsyness of the tag line: Its font is the Continuum Light (The logo font is Continuum Medium with the right corner of the e rounded). I find the next weight Continuum Medium to fat (At least with it the elegance from the light one is lost):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/logo6_4049.png"></div><br>
      And i'm not a very experienced type designer who could put just a little bit more weight on the light version without breaking it :(<p></p>
