    html: |-
      <p>Clever name and slogan!</p>
      <p>Unfortunately, the first thing I saw was the blue flame of a gas stove. I'd assume that giving a quasi-monochrome pointy shape a striking resemblance to the tip of an elf's intricate ear is difficult if not impossible. What's probably true though is that pointy ears are what first comes to most peoples' mind first when thinking of elves.</p>
      <p>Of course, you can always go with the entire ear:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/elfear_3978.png"></div><p></p>
      <p>Haha :P ... well at least I tried. I'll think hard and try to come up with something more useful.</p>
      <p>One thing though: on my screen, the "Agentur für guten Eindruck" looks flimsy at best. I don't mind the type, but screen display probably matters here, so maybe play around with that too.</p>
