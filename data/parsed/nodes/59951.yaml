      <p>The final step in editing a high quality image in PhotoShop should be Sharpening. And the nature of the beast being just that — a sharpened image will loose its edge if it’s overscaled in a layout program. One should try to stay in the 85—115% range, or redoing the original image is necessary.<br>
      (Thank G layeradjustment is here, making this a lot easier in practice).</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
