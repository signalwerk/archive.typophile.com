    <p>I found related threads, but they don't quite answer the questions I have.</p>
    <p>When i place a vector into an InDesign document, can i scale it (up and down) within InDesign, or do I have to scale the native file several times over until it's approximately right (which, is what I've always done...).</p>
    <p>Similarly, can I scale a placed Photoshop object down, without losing quality? I'm sure it doesn't scale up correctly.</p>
