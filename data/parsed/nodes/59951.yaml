      <p>Generally, InDesign is pretty good at scaling things (dunno about really complex Photoshop objects, though).<br>
      By the way, which version are we talking about?<br>
      A bit of advice, for optimal results:<br>
      * first enable High Quality Display<br>
      * then select the object inside the frame and scale at will<br>
      * last, choose "Fit Frame to Content"</p>
      <p>Happy scaling! :-)</p>
