    html: |-
      <p>Yes, you can scale anything up and down in InDesign. Other option is go to Ojbect/ Transform to scale % of the size that you want, or scale by x and y. </p>
      <p>For Scaling Photoshop file; If you working on couple hundred page documents in InDesign, I would suggest you export that photoshop file as tiff, or jpeg, either 150dpi or 300dpi (depends on what you need), and scale that image in photoshop to the size that you need because it would help your program (InDesign) performance work better, otherwise it would be very slow to take time load a huge photoshop file while you only display it in 1 inch box.</p>
      <p>In Photoshop, when you scale down or up by using transform, you losing quality because you squeeze the image smaller or expand it bigger. So, don't do that, go to Image/ Image Size, change the document size or Resolution. It'll help you maintain the original file better. If you worry about the resolution/ quality of the file, save it as .tiff, which is lossless quality file, with jpeg you losing quality every time you save it. You can also find this info on Wikipedia or other sources.</p>
      <p>;)</p>
