      <p>Certainly you can scale any image placed in InDesign, the difference from Quark, which might be causing the confusion, is that you can change the scale of the frame and the scale of the image separately. You can also select and (shift) drag to scale. </p>
      <p>I have never encountered a problem with scaled raster or vector files, although I do make sure I do not go below effective ppi of 250 (in the info window) in the case of raster.</p>
      <p>Tim</p>
