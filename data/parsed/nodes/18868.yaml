      <p>First, here’s something from Peter:<br>
      “<br>
      TrueType and TT-CT hinting have never been used by OSX.<br>
      Everything is anti-aliased by the Quartz 2D rendering engine.<br>
      <a href="http://www.apple.com/macosx/features/quartzextreme/" title="http://www.apple.com/macosx/features/quartzextreme/">http://www.apple.com/macosx/features/quartzextreme/</a></p>
      <p>Older QuickDraw APIs still use hinting below the user-nominated<br>
      threshold size (usually 12pt).<br>
      “</p>
      <p>I’ve asked him a follow-up question or two, and will report back.</p>
      <p>BTW, this older API business makes me wonder:<br>
      Is there a not-too-inelegant way of bypassing the OSX fuzzy<br>
      rendering so a font could get its hinting kicking in again?</p>
      <p>—</p>
      <p>And now I have another question:<br>
      How do CT fonts render out when their hints are ignored?<br>
      Do they look like “regular” AA-ed fonts, or do they come out worse?</p>
      <p>—</p>
      <p>Vincent, that was a great synopsis - a keeper.</p>
      <p>&gt; FontLab has increased the production time dramatically</p>
      <p>You mean decreased?</p>
      <p>&gt; for 1/2 the price in 1/3 of the time.</p>
      <p>Ah, leveraging some new margin in the new system, eh?  ;-)</p>
      <p>&gt; ClearType and the Mac OS-X fuzzies have eliminated the need for heavy hinting</p>
      <p>You mean heavy <cite>manual</cite> hinting, right? Because I’m<br>
      wondering how that jives with “we are hinting/creating<br>
      font files that are 3 times as big”, which confused me.</p>
      <p>hhp</p>
