    <p>Questions:</p>
    <p>1) What do ClearType-optimized fonts render out like on MacOSX?</p>
    <p>2) What exactly is the current/near-future extent<br>
    to which TT hinting is/will_be supported on OSX?</p>
    <p>3) Is there any reason why old 1-bit-style superhinting<br>
    can’t be applied in CT fonts, in Windows and/or OSX?</p>
    <p>hhp</p>
