      <p>Yes hinting time allowed and the money companies are willing to pay or invest has decreased. But FontLab has increased the speed of production dramatically by including a decent AutoHinter and Python support.</p>
      <p>I learned Python in a few hours and in less than a week I wrote enough functions to make a 250 glyph font into a 650 glyph font with extended fractions, superiors, inferiors, and accents to cover up to European Ext-A. Been able to batch process glyph names and other font info to fix or rename whole families and write out a fully localized name table all within the FontLab file. </p>
      <p>You can also hint to a similar level by using the autohinter then changing it’s hints or adding your own. </p>
      <p>So in the long run we are hinting/creating font files that are 3 times as big as we did five years ago, hinting to the same level and doing all that for 1/2 the price in 1/3 of the time. </p>
      <p>ClearType and the Mac OS-X fuzzies have eliminated the need for heavy hinting but there are still situations that require manually hinted TrueType.</p>
