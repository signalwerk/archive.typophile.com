    html: |-
      <p><em>For example note how originally y-direction hints were not included, but soon they will</em></p>
      <p>I’m not sure I understand what you mean by this Hrant. Y-direction hints, including deltas, are supported in current CT rasterisers and, as far as I know, they always have been. This makes sense, since the sampling gain is only in the x-direction. You need y direction hints to establish consistent alignment and horizontal stroke weight.</p>
      <p>What is new in the Vista CT rasteriser is gasp table controlled y-direction greyscale antialiasing.</p>
