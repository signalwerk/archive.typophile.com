      <p>You might want to ping Peter Lofting with these questions, especially #2 - he has the answer and hopefully he’ll be allowed to share it. </p>
      <p>It is however interesting that hinted TrueType, an Apple invented and Apple controlled (via their patents) technology, has been largely abandoned in their recent products (Mac OSX and iPods), but continues to gain some traction over bitmap and PS fonts in the device, rich media and OSS space.</p>
