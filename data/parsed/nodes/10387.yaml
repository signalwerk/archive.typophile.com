    html: <p>I started using Corel DRAW with version 1.2. I agree that version 9 rocks. On modern computers, it's lightning fast. I also use version 12 because it "sort of" supports Unicode, but I think version 9 is very good. If you happen to have Corel DRAW 11 or 12, check the credits in the About box, you should find my name there ;)  <br> <br>I agree with other points you make. BTW, ScanFont 4 costs $99, not $200. Since Corel DRAW supports multiple layers *and* multiple pages, you should have no problem to set it up to work in points, and use the (0,0) point as base point -- no? I've been doing it for quite some time now.  <br> <br>In fact, since Corel DRAW supports scripting, it should be possible to make a tool that automatically converts layers or pages into separate EPS files. Take a look at File Converter at <a href="http://www.oberonplace.com/draw/drawscripts/megagallery/" target="_blank">http://www.oberonplace.com/draw/drawscripts/megagallery/</a>  <br> <br>Also, do you know <a href="http://www.isocalc.com/cooltools/" target="_blank">http://www.isocalc.com/cooltools/</a> ?  <br> <br>You might contact one of the authors of these tools to write a small script for you that does some handy pre-processing for your characters, and export them into EPS.  <br> <br>Regards,  <br>Adam</p>
