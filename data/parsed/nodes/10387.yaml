    html: "<p>\"I am the only designer using FL on my computer, so it would be convenient if the program would remember my personal URL, website URL and licensing info...no biggy, but it would be convenient. \" <br> <br>The appropriate way to do this is to have a .vfb file to use as a template. In FLS5, there will be an option that will open a .vfb file of user's choice instead of a blank font when the user chooses File / New. In essence, this will work like Word templates.  <br> <br>\"However, it would also be quite convenient if there were a way (like, just pressing a button) to tie the FOND ID # to the unique PSID number (hash/add 6000 to the last 4 digits/whatever) to lessen the chance that this problem would occur.\" <br> <br>There is no way that we can come up with a numbering scheme that will please everybody. Practically everybody will want the \"hashing\" to work differently. So that's really something for a tiny little Python script. In fact, you can put any Python commands e.g. into the save.py file within your FontLab folder, and then the commands will be executed whenever a FontLab file is saved. You could put such a scriptlet that ties FOND ID to Unique ID there, and forget about running it manually.  <br> <br>Regards,  <br>Adam</p>"
    html_clean: "<p>\"I am the only designer using FL on my computer, so it would be convenient if the program would remember my personal URL, website URL and licensing info...no biggy, but it would be convenient. \" <br> <br>The appropriate way to do this is to have a .vfb file to use as a template. In FLS5, there will be an option that will open a .vfb file of user's choice instead of a blank font when the user chooses File / New. In essence, this will work like Word templates.  <br> <br>\"However, it would also be quite convenient if there were a way (like, just pressing a button) to tie the FOND ID # to the unique PSID number (hash/add 6000 to the last 4 digits/whatever) to lessen the chance that this problem would occur.\" <br> <br>There is no way that we can come up with a numbering scheme that will please everybody. Practically everybody will want the \"hashing\" to work differently. So that's really something for a tiny little Python script. In fact, you can put any Python commands e.g. into the save.py file within your FontLab folder, and then the commands will be executed whenever a FontLab file is saved. You could put such a scriptlet that ties FOND ID to Unique ID there, and forget about running it manually.  <br> <br>Regards,  <br>Adam</p>"
