    date: 2005-04-26T09:00:00
    date_raw: 26 Apr 2005 — 9:00am
    votes: null
    html: <p>In FOG 4.1.3 (Mac) art pasted in from Illustrator is scaled up to the full em square height. Holding down the command and option keys while choosing Paste from the menu scales it to the ascent. Holding just the option key causes the art to scale the same as FontLab (1 point (in Illustrator) equal to 1 em unit) with the bottom of the art resting on the baseline. These optional paste commands seem to work if you do it completely from the keyboard, you have to choose the Paste command from the menu with the mouse. This could be some peculiarity due to running FOG in Classic on OS X. I seem to recall that you used to be able to just use the keyboard. <br> <br>I used to draw in Illustrator and move art to FOG, and that workflow kept me from switching to FontLab for quite a while, even after I owned a copy. But copying and pasting from Illustrator to FL is not that hard once you realize how it works.  <br> <br>Scale your Illustrator art so that 1 point corresponds to 1 em unit (i.e., if your target cap height is 700 em units, make your caps in Illustrator 700 points tall). Move the Illustrator ruler zero point to the origin point of the character art you want to copy. Copy from Illustrator, paste in FL. Simple. <br> <br>The biggest problems are getting the clipboard preferences set correctly in Illustrator (should be AICB/Preserve Paths) and dealing with rounding-down errors (no fractional em units in fonts, despite what FOG may lead you to believe). <br> <br>Personally, I have completely switched to drawing directly in FontLab. It's much more efficient and I wish I'd starting doing it sooner. I blame FOG's (in my opinion) clumsy drawing tools for my previous reliance on Illustrator. I think I would have been better off drawing in FOG, too, in hindsight.</p>
    html_clean: <p>In FOG 4.1.3 (Mac) art pasted in from Illustrator is scaled up to the full em square height. Holding down the command and option keys while choosing Paste from the menu scales it to the ascent. Holding just the option key causes the art to scale the same as FontLab (1 point (in Illustrator) equal to 1 em unit) with the bottom of the art resting on the baseline. These optional paste commands seem to work if you do it completely from the keyboard, you have to choose the Paste command from the menu with the mouse. This could be some peculiarity due to running FOG in Classic on OS X. I seem to recall that you used to be able to just use the keyboard. <br> <br>I used to draw in Illustrator and move art to FOG, and that workflow kept me from switching to FontLab for quite a while, even after I owned a copy. But copying and pasting from Illustrator to FL is not that hard once you realize how it works.  <br> <br>Scale your Illustrator art so that 1 point corresponds to 1 em unit (i.e., if your target cap height is 700 em units, make your caps in Illustrator 700 points tall). Move the Illustrator ruler zero point to the origin point of the character art you want to copy. Copy from Illustrator, paste in FL. Simple. <br> <br>The biggest problems are getting the clipboard preferences set correctly in Illustrator (should be AICB/Preserve Paths) and dealing with rounding-down errors (no fractional em units in fonts, despite what FOG may lead you to believe). <br> <br>Personally, I have completely switched to drawing directly in FontLab. It's much more efficient and I wish I'd starting doing it sooner. I blame FOG's (in my opinion) clumsy drawing tools for my previous reliance on Illustrator. I think I would have been better off drawing in FOG, too, in hindsight.</p>
