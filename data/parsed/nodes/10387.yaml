    html: <p>'[...] the outline cleanup features in DTL's ContourMaster Light are superior to anything else out there, but ... their 15000-units-to-the-em measurement system causes some 'point shift [....]' <br> <br>The assumption that the default em-square for the BE (Bezier) format is 15000 like the default em for the IK format, is probably caused by the BE glyph database of the FM Demo Font, which is enclosed in the FM installers. The reason that this BE file has the same em as the IK version, is that this made it possible to enclose only one UFM for both formats. This underlines how versatile a separate naming and metrics file is, but I must honestly admit that it never occurred to me that this would result in the idea that everything in FM is based on 15000 units. Although very occasionally FM will convert internally the format to an em of 15000, all functions very well with whatever em. For instance DTL ContourMaster works perfectly with an em of 1000 and there is no need to do any conversion beforehand. All of the DTL glyph databases in BE format have an em of 1000. For Ikarus the default is however 15000 units and in case analog data is manually digitized (which we still often do), 100 units correspond to 1 centimeter. <br> <br>For version 2.1.3 of FM, the BE glyph database for the FM Demo Font has been set to 1000. See also &lt;<a href="http://www.typophile.com/forums/messages/4101/70410.html" target="_blank">http://www.typophile.com/forums/messages/4101/70410.html</a>&gt;.</p>
