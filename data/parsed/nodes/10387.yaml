    html: "<p>The choice of tools depends on the task at hand. Believe it or not, I still used Fontographer 3.5 for some of my tasks, for two very important reasons: (a) its AI/EPS import feature is unsurpassed (FOG 4.1 doesn't import a full em square, and FontLab's approach is beyond bizarre); and (b) all of its simple transform tools are directly accessible via keystroke combinations (both FOG 4.1 and FontLab require mousing around, which slows you down). <br> <br>One of the few things that FOG 4.1 is still good for is path clean-up although, even at its lowest setting, it's a little promiscuous deleting points. However, unlike FontLab, it does NOT see flat curves, semi-horizontal vectors and semi-vertical vectors everywhere. If you have gentle curves in your outlines, FontLab's OPTIMIZE command is likely to turn them into stick figures.</p>"
    html_clean: "<p>The choice of tools depends on the task at hand. Believe it or not, I still used Fontographer 3.5 for some of my tasks, for two very important reasons: (a) its AI/EPS import feature is unsurpassed (FOG 4.1 doesn't import a full em square, and FontLab's approach is beyond bizarre); and (b) all of its simple transform tools are directly accessible via keystroke combinations (both FOG 4.1 and FontLab require mousing around, which slows you down). <br> <br>One of the few things that FOG 4.1 is still good for is path clean-up although, even at its lowest setting, it's a little promiscuous deleting points. However, unlike FontLab, it does NOT see flat curves, semi-horizontal vectors and semi-vertical vectors everywhere. If you have gentle curves in your outlines, FontLab's OPTIMIZE command is likely to turn them into stick figures.</p>"
