    html: <p>Thomas, <br> <br>If you read my last post carefully, you'll see my suggestion was to add 6,000 to the last 4 digits of the PSID (no greater than 9,999), which would result in a number well within what I believe is the accepted range for regular encoding. And, although PSIDs may be passe, they remain handy for assigning unique SKU numbers to one's fonts. <br> <br>And...while YOU'RE on the line, has Acrobat 7 addressed the issue of Acrobat and Illustrator not being able to agree on what Times New Roman Bold should be called? I work in the prepress department of a printing company, and the unwashed public gives us LOTS of MS Word documents (most of which, unimaginatively, use the default font) that have to go into the production pipeline. PDF format is, of course, the easiest way of integrating these documents into our workflow UNTIL you exercise the "Edit Objects" option in Acrobat 6. Illustrator CS consistently does not recognize TNR Bold (Roman and Italic, yes, so go figure), and substitutes Myriad (no choice in the matter, either, another of Illustrator's irksome qualities). One would think, by this point, that Adobe's various products would have learned to play nice with each other.</p>
