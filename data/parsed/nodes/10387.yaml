    html: <p>I would respectfully suggest that you not consider Fontographer. It is like riding to the Oscars in a Pinto. Wouldn't you rather take a limousine? (That would be FontLab.) <br> <br>Fontographer has not been updated in 10 (11?) years, and is therefore stuck in the dark ages of typeface development. FontLab has an active and responsive team of programmers that make appearances on these and other forums. FontLab can be intimidating at first, but it can also be as simple as you want it to be, and the drawing tools are unmatched anywhere (including Illustrator and Freehand).</p>
