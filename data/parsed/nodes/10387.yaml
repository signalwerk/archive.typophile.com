    html: <p>No, I create all of my outlines in CorelDraw 9 (the last fully-featured release before Corel started screwing a good program up), for a few very good reasons (other than the fact I've been using CorelDraw since v.1)... <br> <br>(a) one tool and one tool only is required to add, delete, edit and align nodes, AND to convert line segments to line or curve, AND to make connections sharp, smooth or symmetrical; and (b) CorelDraw is the only program I know of that has an INTERACTIVE outline smoother, which allows simplification on a scale of 1-100 (27 seems to work best for me). And I work on a PC (Windows 2000 Professional) because (a) I am not so in love with the wallpaper on my desktop that I must see some portion of it at all times; (b) contrary to the conclusion that Steve Jobs reached over twenty years ago (and sticks to, till this day), I CAN operate a mouse with more than one button on it, and prefer to do so; and (c) love those WIndows keyboard shortcuts. I DO have an iMac running OS 9 (which I use primarily font testing Mac fonts, now that I no longer use Fontographer to generate my Mac fonts) and a Mac Mini running OS 10.3 (also for testing, but I now generate all Mac fonts with Type Tool 2). Still, my trusty Dell remains my workhorse of choice. <br> <br>Given the foregoing along with the fact that ALL of my fonts drawn on the computer, ScanFont4 is probably not my cup of tea...nor am I particuarly inclined to spend another $200 in order to get a $500 program to do what a 15-year-old 16-bit program does very well.</p>
