    html: <p>Adam, <br>for me too, the eps-import in FL is strange, to say the least. I still prefer drawing in Illustrator. To get your glyphs imported at the right size and place you need to copy a rectangle, which starts at the zero point and goes to cap height, from FL and paste it into Illustrator. It has to be at the zero-point in the Ill. document and it gets to be such an absurd size that if you draw a string of characters they soon run of the page, even if you draw on a large 'page'. In fontographer you just take care the letters you draw are between two lines, and these lines will be cap height and deschender depth, no matter how big or small the drawing in Ill. Being able to draw a string of characters (or words, if you want) is the main reason for me still using Illustrator, apart from the morre easily available drawing and editing tools. <br> <br>Best, <br>Diederik</p>
