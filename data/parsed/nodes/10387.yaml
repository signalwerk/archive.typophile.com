    html: <p>I don't think that TypeTool supports OpenType. Fontographer certainly does not support OpenType, although unicode values can be assigned, I believe. <br> <br>I would only recommend using Fontographer if you already have a copy. Spending the money to buy it would just be a total waste. If you buy TypeTool, you can upgrade to the full FontLab package later. <br> <br>Nick is severely more advanced as a type designer than I am. But I have found FontLab a dream to use. I switched from Fontographer two months ago, and have not experienced one single problem. Having a copy of Leslie Carbarga's <i>Learn FontLab Fast</i> by my side made the "learning curve" a non issue.</p>
