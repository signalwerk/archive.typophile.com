    html: <p>Nick, <br> <br>I did read your message carefully. My point is that your default behavior would only work for MacRoman encoding, and would generate defective fonts for other encodings. <br> <br>Additionally, UniqueIDs should not be arbitrary, except for limited private use. Adobe maintains a registry of UniqueIDs; people can and should get UniqueIDs assigned by Adobe if they are going to use them in retail fonts. Otherwise you're just playing Russian roulette on a larger scale. <br> <br>Using a UniqueID as the basis for a SKU does not make technical sense, unless you are never going to revise your fonts, or you'd change SKUs every time you do a bug fix or revision. <br> <br>I don't know about your Acrobat/Illustrator problem, but I can say from the description that I suspect the problem is on Illustrator's side. So I doubt that Acrobat 7 will have fixed anything. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>Nick, <br> <br>I did read your message carefully. My point is that your default behavior would only work for MacRoman encoding, and would generate defective fonts for other encodings. <br> <br>Additionally, UniqueIDs should not be arbitrary, except for limited private use. Adobe maintains a registry of UniqueIDs; people can and should get UniqueIDs assigned by Adobe if they are going to use them in retail fonts. Otherwise you're just playing Russian roulette on a larger scale. <br> <br>Using a UniqueID as the basis for a SKU does not make technical sense, unless you are never going to revise your fonts, or you'd change SKUs every time you do a bug fix or revision. <br> <br>I don't know about your Acrobat/Illustrator problem, but I can say from the description that I suspect the problem is on Illustrator's side. So I doubt that Acrobat 7 will have fixed anything. <br> <br>Regards, <br> <br>T</p>
