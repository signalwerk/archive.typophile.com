  date_raw: 18 Apr 2005 — 6:02am
  votes: null
  html: <p>This summer another student and myself will participate in a Students Partnering with Faculty Summer Research Program along with a faculty member/design professional. The program will involve researching typography, studying typefaces, typographic classification, and meeting with design professionals. Then, in late summer/early fall we will each begin work to design and create our own typeface.  <br> <br>I was wondering if those of you who have experience designing and creating typefaces can recommend the best computer program for it. Work will be done, of course, on Macs. Macromedia's Fontographer seems to be the first choice, but does FontLab seem a more appropriate choice? <br> <br>Please discuss which programs you prefer and the reasons why. Any information you can provide would be extremely helpful.</p>
  html_clean: <p>This summer another student and myself will participate in a Students Partnering with Faculty Summer Research Program along with a faculty member/design professional. The program will involve researching typography, studying typefaces, typographic classification, and meeting with design professionals. Then, in late summer/early fall we will each begin work to design and create our own typeface.  <br> <br>I was wondering if those of you who have experience designing and creating typefaces can recommend the best computer program for it. Work will be done, of course, on Macs. Macromedia's Fontographer seems to be the first choice, but does FontLab seem a more appropriate choice? <br> <br>Please discuss which programs you prefer and the reasons why. Any information you can provide would be extremely helpful.</p>
