    html: <p>Ditch the limo (more like an RV, actually). It's summer, take your bike. <br>Fontlab would be a mistake for a short program -- too complicated. <br> <br>I would recommend TypeTool or Fontographer, which has a very good Mac interface, and is a more direct design tool.  <br> <br>Many type designers still use Fontographer for creating glyphs and basic metrics/kerning. While it cannot make OpenType fonts, it's unlikely that you will get that far, and the Type 1 and TrueType fonts that Fontographer makes are perfectly serviceable.</p>
