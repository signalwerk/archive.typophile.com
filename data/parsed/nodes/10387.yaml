    html: <p>You don't need a UniqueID. They are far more trouble than they are worth. Adobe stopped putting them in our western fonts several years back, when our testing showed no significant performance differences for fonts without UniqueIDs. <br> <br>Back when printers had 8 MHz processors and data was sent to them on a 57K pipeline, the caching really did help. Today, not so much so. <br> <br>As for FOND IDs, they have their own problems, in that the ID range also indicates the encoding. So even if you want to keep UniqueIDs, tying them to the FOND IDs seems like a bad idea. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>You don't need a UniqueID. They are far more trouble than they are worth. Adobe stopped putting them in our western fonts several years back, when our testing showed no significant performance differences for fonts without UniqueIDs. <br> <br>Back when printers had 8 MHz processors and data was sent to them on a 57K pipeline, the caching really did help. Today, not so much so. <br> <br>As for FOND IDs, they have their own problems, in that the ID range also indicates the encoding. So even if you want to keep UniqueIDs, tying them to the FOND IDs seems like a bad idea. <br> <br>Regards, <br> <br>T</p>
