    date_raw: 26 Apr 2005 — 5:34am
    votes: null
    html: "<p>Adam: <br> <br>I would submit that the other responses about FL's strange EPS behavior make my point. The reason that I believe FOG 3.5's EPS import is superior is that it assumes that what you import in 1000 points high (more about this later); FOG 4.1 assumes that what you import is equal to the ascent of the font; I cannot, for the life of me, figure out WHAT FL assumes -- all that I know is that, in my experience, the manual instructions don't work, and a couple of workarounds I've seen posted elsewhere don't work either. <br> <br>When I export EPS for FOG 3.5, I place tick marks at ascent and descent on all my characters (a simple process that takes less than five minutes). Then, when I import the EPS characters into FOG 3.5, they fall exactly where they ought to, and they are correctly proportioned to one another. The only way to accomplish this in FOG 4.1 is to set the ascent at 1000, with no descent, import all your characters, reset the ascent and descent, then move all of the characters down so they sit on the new baseline. <br> <br>I took your advice about tweaking the OPTIMIZE options and the results were mixed. I could eliminate the \"stick figure\" results, but the downside was that some redundant points were NOT cleaned up. The various combination I tried of the ten available choices seemed to yield either too much or too little, and none were \"just right.\" <br> <br>One the other hand, in my humble opinion, the outline cleanup features in DTL's ContourMaster Light are superior to ANYTHING else out there, BUT...their 15000-units-to-the-em measurement system causes some \"point shift\" once you convert the outlines back to a 1000-unit em, so you still have to check every character to correct the instances where dividing by fifteen produced unsatisfactory results.</p>"
    html_clean: "<p>Adam: <br> <br>I would submit that the other responses about FL's strange EPS behavior make my point. The reason that I believe FOG 3.5's EPS import is superior is that it assumes that what you import in 1000 points high (more about this later); FOG 4.1 assumes that what you import is equal to the ascent of the font; I cannot, for the life of me, figure out WHAT FL assumes -- all that I know is that, in my experience, the manual instructions don't work, and a couple of workarounds I've seen posted elsewhere don't work either. <br> <br>When I export EPS for FOG 3.5, I place tick marks at ascent and descent on all my characters (a simple process that takes less than five minutes). Then, when I import the EPS characters into FOG 3.5, they fall exactly where they ought to, and they are correctly proportioned to one another. The only way to accomplish this in FOG 4.1 is to set the ascent at 1000, with no descent, import all your characters, reset the ascent and descent, then move all of the characters down so they sit on the new baseline. <br> <br>I took your advice about tweaking the OPTIMIZE options and the results were mixed. I could eliminate the \"stick figure\" results, but the downside was that some redundant points were NOT cleaned up. The various combination I tried of the ten available choices seemed to yield either too much or too little, and none were \"just right.\" <br> <br>One the other hand, in my humble opinion, the outline cleanup features in DTL's ContourMaster Light are superior to ANYTHING else out there, BUT...their 15000-units-to-the-em measurement system causes some \"point shift\" once you convert the outlines back to a 1000-unit em, so you still have to check every character to correct the instances where dividing by fifteen produced unsatisfactory results.</p>"
