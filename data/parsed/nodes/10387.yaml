      <p>&gt; there are big differences between drawing<br>
      &gt; in Illustrator and drawing in FontLab.<br>
      &gt; The biggest one is that Illustrator allows<br>
      &gt; practically infinite precision in point<br>
      &gt; placement, whereas FontLab constrains<br>
      &gt; you to whole em-units.</p>
      <p>I should add that this limitation is not there for arbitrary reasons. The coordinates in digital fonts (PostScript Type 1, OpenType PS, OpenType TT) must be integer units. FontLab imposes this limitation onto the designer during the entire process, so you're always WYSIWYG. Fontographer goes a different path: it allows you to draw in fractional coordinates but when you generate the font, the coordinates get rounded to the next integer coordinates. So there is no final control over what will end up where (although it is possible to "snap" the points manually before generating the font). Both methods have their supporters and opponents. </p>
      <p>Regards,<br>
      Adam</p>
