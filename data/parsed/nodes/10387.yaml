    html: "<p>Adam, <br> <br>Thanks for the links: there are a couple of tools there which should make the process of scaling and positioning much easier than they normally would be in CorelDraw. I will give them a try, and see if I can't conquer this EPS import problem and eventually retire trusty old FOG 3.5. <br> <br>While I have your attention, there are a few other FL \"problems\" I would like to bring to the fore... <br> <br>First, it would be REALLY nice to be able to set more defaults in the FONT INFO dialogue. I am the only designer using FL on my computer, so it would be convenient if the program would remember my personal URL, website URL and licensing info...no biggy, but it would be convenient. <br> <br>Second, while FL's zoom capabilities FAR exceed those of FOG, they still stop a little shy of where I'd like. Being able to zoom into, say, a 3x3 point grid would come in handy when trying to edit the curves at the end of a tiny round serif. CorelDraw can zoom to 400,000%, which is probably excessive, but a LITTLE more magnification in FL would be helpful. <br> <br>Finally, from time to time, I get reports back of Mac PS fonts on OS 9 displaying not a preview of the font in question, but of a sans-serif system font. The cause, I believe, is a FOND ID # conflict (TypeTool/FL default is 128), so the problem is easy enough to fix. However, it would also be quite convenient if there were a way (like, just pressing a button) to tie the FOND ID # to the unique PSID number (hash/add 6000 to the last 4 digits/whatever) to lessen the chance that this problem would occur. Again, no biggy, but it would be helpful.</p>"
