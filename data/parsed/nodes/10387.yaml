    html: <p>Adam, <br> <br>I tried the workaround based on the previous tip upon which the one you referenced was based, and got nowhere; however, I will try it again...maybe I missed something the last time around. <br> <br>Assuming that I will be both pleasantly surprised that this method works and terribly chagrined that I was such a dunce the last time I tried it, there is still another however to consider...the method you propose requires that the origin point be moved for EVERY character that you export, which for me typically is no fewer than 120 characters. Add to that Illustrator's page size limit of 16,383 pts AND only one page per document, and I would also have to create SEVERAL documents to handle my super-sized outlines. <br> <br>Given all the extra effort involved, I fail to see where FontLab's method is an improvement over the way FOG 3.5 did it. Don't get me wrong...I think FontLab is a GREAT program and, if I had to choose only one font creation tool to work with, FL would be it. But it ain't perfect (got more petty gripes, if you're interested).</p>
