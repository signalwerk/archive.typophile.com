    user: 1133
    date: 2005-04-26T10:04:00
    date_raw: 26 Apr 2005 — 10:04am
    votes: null
    html: "<p>Nick,  <br> <br>about importing EPS, the answer is very simple: FontLab does not assume *anything*. If in Preferences / General / Do not rescale... is deactivated, then 1 point in EPS = 1 FontLab unit. When the option is enabled, then FontLab assumes that what you import is 700 units high.  <br> <br>Also, you don't need to place any tick marks whatsoever. Just place the characters in Illustrator of Freehand so that the 0,0 point of the EPS document is on the font's origin point. In other words: you can always work in Illustrator taking points EXACTLY as if they were font units in FL. It's actually pretty simple.  <br> <br>More information is at:  <br><a href=\"http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675\" target=\"_blank\">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675</a> <br> <br>Regards,  <br>Adam</p>"
