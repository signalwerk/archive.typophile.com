    html: |-
      <p>Thomas,</p>
      <p>Resuming after the caesura...MY point is that people who generate fonts with different encodings are doubtless aware of the FOND ID # issue, and would address it accordingly. My suggestion was predicated on what I suspect are the vast majority of cases where Mac Roman encoding is desired. A default setting or procedure that generates a FOND ID number that is less likely to conflict with system fonts could, and would, be overridden if circumstances so require. I am not suggesting that one size fits all, but it would be more convenient if one size fit most.</p>
      <p>And, yes, I do obtain Unique PSIDs from Adobe, and I do use them. And using PSIDs as SKU numbers may not work for everybody in all instances (I don't believe I suggested that they would), but they do work for me.</p>
