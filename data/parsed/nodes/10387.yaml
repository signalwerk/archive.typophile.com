      <p>I switched to drawing glyphs entirely within FontLab about a year ago. Previously, for many years, I drew in Illustrator and imported into Fontographer. It took some getting used to, but now I prefer my new method. It's much faster (mainly due to fewer steps) and more controllable. I actually find it more difficult to draw in Illustrator now.</p>
      <p>You should be aware, however, that there are big differences between drawing in Illustrator and drawing in FontLab. The biggest one is that Illustrator allows practically infinite precision in point placement, whereas FontLab constrains you to whole em-units. This can be good or bad, depending on how you look at it. Being able to work in unconstrained units avoids rounding errors that can occour when scaling outlines, but it also gives you a false sense of how precisely you can place points in glyph space (which is always constrained to whole em-units). </p>
      <p>Consequently, if you work in Illustrator, you must check for rounding errors when importing the artwork into FontLab. If you draw directly in FontLab, it's essentially WYSIWYG and there's no need for that step.</p>
