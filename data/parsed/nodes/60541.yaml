    <p>I'm curious to hear your thoughts on the role of color (not typographic color—color color) as a typographic variable akin to size, leading, measure, etc.</p>
    <p>On many screens, light is projected in various combinations of red, green, and blue to produce every piece of text — even black and white text. For screens made with RGB sub-pixels (sometimes BGR), red type on a black background is one third the thickness of white type on the same black background (for red type, only the R sub-pixel is lit; for white type, R, G, and B are all lit). So on screen, color can directly affect the shape of letters and whole typeset texts.</p>
    <p>Has there ever been a print equivalent to this kind of constraint? If so, were there any interesting experents or techniques associated with it? Or, rather, is this a non-issue? On screen, on a black background, even though red type is thinner than white type, does it *look* thinner? Are individual sub-pixels even noticeable?</p>
