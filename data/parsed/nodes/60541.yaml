      <p>"Has there ever been a print equivalent to this kind of constraint?"</p>
      <p>I guess not. Usually 'text typeface' designers care mostly about the positive-negative appearance of their glyph shapes in variable sizes. They usually create a slightly altered/thinned versions of the regular weight if they intend to make their typefaces still look legible when printed on a small size, this has something to do with the ink blot on the printed surface. Ones who care about the on-screen appearance are usually type designers that designed 'pixel typefaces.'</p>
      <p>A process called 'hinting' is usually done when a type designer wanted their 'text typeface' look good when viewed on a small 'screen' size. But then again, usually hinting deals with the positive-negative appearance of the glyph shapes, in plain black and white color. Matthew Carter's Verdana and Georgia is one example of fine-hinted typeface.</p>
      <p>###</p>
      <p>"On screen, on a black background, even though red type is thinner than white type, does it *look* thinner?"</p>
      <p>I guess so, it's a basic principle in typography. The only typeface I knew that take attention about this 'screen' color is Underware's Unibody. But then again, I'm not an expert, so I definitely might be wrong. I'm aware of the font-aliasing technologies on nowadays browsers or operating systems, but I don't really have a deep understanding of them. :D</p>
      <p>PS: Please excuse my english.</p>
