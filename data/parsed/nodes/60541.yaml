    html: <p>I'd say that problems in print outnumber those caused by RGB pixels. Related to registration that Kevin mentions, there are problems associated with trapping, then different problems related to screening, and different again problems related to the printing method itself, such as inking and pressure in letterpress or water–ink balance in offset.</p>
