    html: <p>In four-color process printing, text in unusual colors would become fuzzy according to the dpi of the screen (not monitor screen, screen screen). A pure red (100%M, 100%Y) would usually be as sharp as black, but something like a bright green, a brown, a lilac, or even just 50% grey would lose a lot of quality, especially if there is more than one color in it and the registration isn't perfect.</p>
