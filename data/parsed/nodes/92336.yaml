    <p>A reporter wrote me on Flickr as I have a Sun Times specimen book from 1961. <a href="http://is.gd/ZVtD3X" title="http://is.gd/ZVtD3X">http://is.gd/ZVtD3X</a> </p>
    <p>The image is here <a href="http://twitpic.com/9bayzs" title="http://twitpic.com/9bayzs">http://twitpic.com/9bayzs</a></p>
    <p>I'm pretty sure the sans face is Futura bold condensed, though the lower case "a" troubles me a bit. Although the Sun Times masthead resembles a number of faces I can't find an exact match.</p>
    <p>Thanks for your help.</p>
