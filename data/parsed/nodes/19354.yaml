  html: <p>I'm curious to find out what other typophiles think of <a href="http://www.myfonts.com/fonts/agfa/bembo-mt/schlbk/" rel="nofollow">Bembo Schoolbook</a> with it's altered a, g &amp; y. I know that some people believe that these letterforms are easier for children to read. I am not among that number. But is there any good reason to make these alternates available? are there better-looking versions that what we see in Bembo Schoolbook?</p>
