    html: |-
      <p>Oh, ecch! What is that? I agree with Paul. </p>
      <p>I think the least appealing aspect is having the same shape descender on the 'g' AND the 'y'; so much for distinct letterforms. What's wrong with a diagonally-tailled 'y'?</p>
      <p>BTW, I write single-storey 'g's, (surely they're easier for cursive writing, and therefore for speed), doesn't mean you have to abandon the double storey 'g' for typefaces derived from designs created in the metal days... </p>
      <p>Having said that, we were all taught to write those single-storey 'a's as well, and at about the age of twelve I spontaneously switched to doing double-storey 'a's just because I felt they looked better. I still know they're slower for me to write than single-storey ones would be but what the heck it's a habit now...<br>
      ______________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
