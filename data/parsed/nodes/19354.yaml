      <p>I wonder if any writing teachers start their pupils out with binocular "g"s.<br>
      Surely the single storey g and q are too similar -- a fact attested by the addition of a check-mark to the q, which has to be later unlearned, a pedagogic kludge if ever there was one.<br>
      What can be so hard about drawing two circles and connecting them with a short line?</p>
