    html: |-
      <p>I think such "primary" glyphs are useful (although certainly not in such a bookish face as Bembo) but only for absolute beginner readers (and only because they form the -sad- standard of current alphabet instruction). Once they've been learned, and the child (or foreigner) can read them quickly, they should be replaced by full print forms.</p>
      <p>&gt; the addition of a check-mark to the q, which has to be later unlearned</p>
      <p>Well, I wish it didn't. (And does it really? I'd say it depends on us a bit.)<br>
      To me the best "q" for reading is the one with a single-sided bottom serif.</p>
      <p>&gt; these alternate glyphs give a juvenile feel to the design.</p>
      <p>Which however is lost on the target readership, so that's not so bad.</p>
      <p>hhp</p>
