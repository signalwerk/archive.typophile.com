    html: <p>Alternate forms don't need to have a special purpose. They can be purely aesthetic, make a typeface new. When I saw <a href="http://typographi.com/000490.php" rel="nofollow">Plantin Schoolbook used in <em>Wallpaper</em></a>, I said "Wow, that looks and reads great. What is it?" Turns out it was just the old standard with primary forms.</p>
