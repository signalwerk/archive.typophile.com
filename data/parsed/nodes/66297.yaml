    <p>This is a partial draft of a contemporary serif project I'm working on. It was initially thought as a typeface for personal use, but it could be turned into a real release if the work would reach a decent level. The family is planned to have four weights in roman and italic versions.</p>
    <p>Some ideas:</p>
    <p><strong>1.</strong> it must be suitable for books and magazines, but trying to use more contrast than one finds in most recent good typefaces (as Meta Serif, Greta Text, Tisa or Premiera). It's not a serif to very small sizes and low quality prints.</p>
    <p><strong>2.</strong> it must be clean, with a strong horizontal impression (like Utopia, Cartier, Expo Serif and the ones used in The Guardian and Hebdo newspapers redesign) and also reduced ornamental elements.</p>
    <p><strong>3.</strong> it must be highly readable when used in legal and technical texts with intensive use of numerals and acronyms (never found a typeface which suits perfectly this need). This must be reach with small caps somewhat higher than lowercases and old style numerals more aligned to baseline.</p>
    <p><strong>4.</strong> target sizes are 9 to 18pt.</p>
    <p>Actually, there is just part of the basic lc set. I hope to add the more difficult lc characters (g, k, w, z) within a week. By now, I'm not satisfied with /f/ and the /fi/ ligature. /v/ also seems no good.</p>
    <p>It's the first time I try to design a typeface and it's more difficult than I thought (these lc took almost a week to be drawn). I'm working directly in Illustrator to do a later import into FL.</p>
    <p>Any comment will be very welcome.</p><div class="imageWrap"><img src="http://typophile.com/files/Serif_draft_041_5953.gif"></div><p></p>
