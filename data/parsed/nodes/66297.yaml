      <p>Hi Ivan,</p>
      <p>It looks like you are off to a good start.  I agree with your assessment of the f; the angle at the top is too steep.  I also get the feeling that the c has a slight overbite.  But overall it has a very nice feel to it.  Good luck with this!</p>
      <p>Aric</p>
