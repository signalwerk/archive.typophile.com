    html: <p>Nick is right.  We did everything by hand in those days.  It wasn't so much that we were "groovy and doin' our thing."  There wasn't much choice.  There were no computers and the normal way of working was to draw everything.  Type was indicated by drawing it. You only had type set after the job was approved and ready for production.  There were nowhere-near the type choices we have currently.  Brush and paint, pen and ink, exacto knife and rubylith were the skills we practiced.  Today, tools of the trade are software programs and type choices are broad and very cheap.  You can digitally manipulate anything in a snap now.  In the 60's what you may perceive as type manipulation was actually drawn, Photostatted, cut&amp;pasted, retouched film-neg'd, opaqued and stripped with colors hand registered on a light box.  We sent a man to the Moon then but designers were strictly low-tech. <br> <br>ChrisL</p>
    html_clean: <p>Nick is right.  We did everything by hand in those days.  It wasn't so much that we were "groovy and doin' our thing."  There wasn't much choice.  There were no computers and the normal way of working was to draw everything.  Type was indicated by drawing it. You only had type set after the job was approved and ready for production.  There were nowhere-near the type choices we have currently.  Brush and paint, pen and ink, exacto knife and rubylith were the skills we practiced.  Today, tools of the trade are software programs and type choices are broad and very cheap.  You can digitally manipulate anything in a snap now.  In the 60's what you may perceive as type manipulation was actually drawn, Photostatted, cut&amp;pasted, retouched film-neg'd, opaqued and stripped with colors hand registered on a light box.  We sent a man to the Moon then but designers were strictly low-tech. <br> <br>ChrisL</p>
