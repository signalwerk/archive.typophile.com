    html: <p>I kind of doubt Photo-Lettering is still around but they specialized in psychedelic type (when it was "in," or most likely, shortly thereafter) and just about anything else that was popular during the photofilm years. They did go digital. I have a number of their fonts, mostly dated from the early 1990s. I recall some free fonts that imitate the psychedelic period. You can probably pick this stuff up somewhere if you look around seriously enough.</p>
