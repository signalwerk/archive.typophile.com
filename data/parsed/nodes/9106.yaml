    date_raw: 7 Feb 2005 — 11:29am
    votes: null
    html: <p>&gt;Would a bluegrass band from the 60's have a psychedelic album cover?&lt; <br> <br>No, not very likely.  The 60's had a rather broad range of design.  It was much more eclectic than some people assume.  You had everything from Ben Shahn, Herb Luballin, Seymoor Schwast more illustative style in contrast to the modernist AG Helvetica International style.  There was also, in advertising, what I used to call "The Typeface of the Month Club" style" where a typeface would become "in" and be overused for everything (Cooper Black had a longer stay than most.) and then die a quick death in disdain.  Psychedelic was actually not all that popular beyond the acid rock youth.  Peter Max posters had a fling in the late 60's but most truly psychadelic stuff was done by hand by college students. <br>A bluegrass band would have had more of a straightforward homegrown look.  Maybe with hand written title or something more country looking--anything from Clarendon caps to a wooden type look.</p>
    html_clean: <p>&gt;Would a bluegrass band from the 60's have a psychedelic album cover?&lt; <br> <br>No, not very likely.  The 60's had a rather broad range of design.  It was much more eclectic than some people assume.  You had everything from Ben Shahn, Herb Luballin, Seymoor Schwast more illustative style in contrast to the modernist AG Helvetica International style.  There was also, in advertising, what I used to call "The Typeface of the Month Club" style" where a typeface would become "in" and be overused for everything (Cooper Black had a longer stay than most.) and then die a quick death in disdain.  Psychedelic was actually not all that popular beyond the acid rock youth.  Peter Max posters had a fling in the late 60's but most truly psychadelic stuff was done by hand by college students. <br>A bluegrass band would have had more of a straightforward homegrown look.  Maybe with hand written title or something more country looking--anything from Clarendon caps to a wooden type look.</p>
