  html: |-
    <p>Schizotype is proud to announce the launch of Gaden Sans, a sleek monoline sans.  To coincide with the launch, people buying the whole family (which already represents a saving of $170 over buying the styles separately!) can choose one font (family) from 18 other Schizotypefaces to receive free of charge.</p>
    <p><a href="http://new.myfonts.com/fonts/schizotype/gaden-sans/" title="http://new.myfonts.com/fonts/schizotype/gaden-sans/">http://new.myfonts.com/fonts/schizotype/gaden-sans/</a></p>
    <p>Cheers<br>
    Dave</p>
