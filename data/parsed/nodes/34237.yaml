      <p>Thank you both!</p>
      <p>Here we go:</p>
      <p>Litera,</p>
      <p>&gt;I like the first “a” but the second one looks more part of the font.<br>
      Yes, but I think that's because it's too similar to forms used in bpdq, and that lowers the legibily of the a as it lowers differentiation.<br>
      I guess I'll have both designed, and add the second a in the opentype stylist alternate feature.</p>
      <p>&gt;The new “i” and “l” are great but be careful about kerning.<br>
      Yes, but I'll worry about kerning only in the last stages of development.</p>
      <p>&gt;Make shure you make other weights too.<br>
      Sure! This is the light weight. I plan to design Light, Regular, Bold and Black, with italic (problably oblique) forms.</p>
      <p>William,</p>
      <p>Very well noticed. The higher point of the H (with diagonal cut) should equal the overshoot of the O. I've done this on lowercases, but forgot in the uppercase. Thanks for seeing this now and prevent me to design others with wrong proportions.</p>
      <p>&gt;g - I’d change the descender because it looks distracting to me<br>
      Yes, I'll try a diagonal descender, maybe it suits best.</p>
      <p>&gt;c - I would close the aperture a bit because it looks wide open<br>
      I'm sorry but I'll have to disagree on this one. Different from Dax for example, I'd like to make the characters with aprox similar widths. I believe it looks more contemporary (different than classic proportions that has forms like c with almost half of general widths).</p>
      <p>Again, I do appreciate your help.</p>
