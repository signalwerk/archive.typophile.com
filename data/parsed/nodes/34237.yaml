      <p>I like this font very much. What you did with "e" is great.</p>
      <p>I like the first "a" but the second one looks more part of the font.</p>
      <p>The new "i" and "l" are great but be careful about kerning. "in" combination needs kerning.</p>
      <p>I would change letters:</p>
      <ul>
      <li>g - I'd change the descender because it looks distracting to me
      </li><li>c - I would close the aperture a bit because it looks wide open
      </li></ul>
      <p>Otherwise. Great font. Looks like some FF font. Very sleek and modern. I can see it used for various different applications. Make shure you make other weights too.</p>
