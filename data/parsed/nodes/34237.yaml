      <p>This has promise. Good luck with it!</p>
      <p>One comment: because of the points on the H, it should come up higher to look even with the O--maybe as high as the O or higher. Test it out and you will see what works best, but I bet it will be different than it would be with a flat H. Similarly try out varying the stem of the n, i etc. compared to the arches, the o, etc.</p>
