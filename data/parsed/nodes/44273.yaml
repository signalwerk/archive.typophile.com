    html: |-
      <p>The font is an Arts &amp; Crafts-era type, originally designed in 1916 by Elizabeth Colwell as "Colwell Handletter" and released by American Type Founders in 1923.</p>
      <p>Several free versions of the font exist, all of various quality and faithfulness to the original.</p>
      <p>Nick Curtis' <a href="http://www.myfonts.com/fonts/nicksfonts/mckenna-handletter-nf/" rel="nofollow"> McKenna Handletter NF</a> is based fairly closely on Colwell's work.</p>
      <p>Apostrophic Lab's <a href="http://www.moorstation.org/typoasis/designers/lab/lab_colwell.htm" rel="nofollow"> Colwell </a> is rougher and includes several alternate forms, but moves slightly further afield from the original.</p>
      <p>The H. P. Lovecraft Historical Society also offers a nice, if rough, version, called <a href="http://www.cthulhulives.org/toybox/PROPDOCS/PropFonts.html" rel="nofollow"> HPLHS-Colwell </a>.</p>
      <p>Other digitized versions of this type have been available in the past from several typefoundries that have apparently become defunct.</p>
      <p>Printed samples are also available in various Solotype books, so they may offer a digitized version as well, although I haven't been able to find them.</p>
      <p>David Thometz</p>
