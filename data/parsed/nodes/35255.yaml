      <p>Hey froot, there are lots of motivations for picking a style for it's weight. The color on the page is one likely motive where the design, designer and/or production methods demand one over the other. Another motive is to get an appropriate contrast between the lighter and the bolder at the same size. And this same quest for contrast is often pursued in the relationship between text and headlines, different kinds of text, and betweeen headline faces.</p>
      <p>There is no hard rule on which to select, but when a single "regular" is all that is available, one must hope that it's color beside the bold, or in relation to other fonts in a particular design or production process, is "just right".</p>
      <p>Cheers!</p>
