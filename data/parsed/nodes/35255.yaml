      <p>Those terms are now used as weights, except in this context "Roman" isn't quite right, and should be "Regular".<br>
      "Roman" is the style default for a typeface family, in opposition to Italic, whereas Regular is the weight default -- so you can see how the default font Regular Roman may become abbreviated to either Regular or Roman (which are, strictly speaking, incorrect), ignoring the possibility that what's being described might be Bold or Italic. But in practice Regular (or nothing), not Roman, is used to denote the default of a typeface: regular weight, roman style.</p>
      <p>The weight designations are actually given numbers and positions in some software schemes -- Thomas Phinney posted a link to a file which shows a chart of this, in the Build section of Typophile, some time ago. Anyway, AFAIK, certain software applications recognize a scale of weights, and this is included in FontLab, so that when type designers such as myself are making fonts, we follow the scale which includes:<br>
      300 Light<br>
      400 Regular<br>
      400 Book<br>
      500 Medium<br>
      600 DemiBold<br>
      600 SemiBold</p>
      <p>As you can see, there is some confusion there -- quite understandably, as "book" is not really an adjective and doesn't describe weight in the way the others do.</p>
      <p>"Book" has occasionally proved to be a useful typographic term, although these days it can cause problems if both Book and Regular weights are included in a font family.</p>
      <p>**</p>
      <p>The first instance of a type family member named Book that I came across was Bodoni Book, and this would be at least 25 years ago. It was a regular weight Bodoni, but with slightly heavier hairlines than Bodoni Regular from the same foundry. Presumably they named it Book because they needed a word to let people know it was different from Regular, but not a different weight, despite its extra heft. Anyway, the memorably alliterated Bodoni Book proved to be a very durable general purpose font, without some of the problems that the fine hairlines of Bodoni Regular would cause when photographically processed during production. </p>
      <p>It also had a classy tone, as it sounds upscale to be using a "book" font in a mere pamphlet or brochure.</p>
