      <p>Nick -- Bodoni Book is actually the name given to one of the Bodoni series in the 1923 ATF catalog. It is actually a lighter weight than the undesignated Bodoni cut (which is the typically heavy weight of this style at that time).</p>
      <p>-- K.</p>
