      <p>Book was used much more often in the metal type era. I don't think it was applied with a given strict standard accross foundries. This is pure speculation but it seemed to be that it was more a designation that could combine anything from fit to weight. Perhaps since books tended to be  printed at higher quality than newspaper or simple jobbing work, the refinements in "Book" weight would come through best under good printing conditions.</p>
      <p>ChrisL</p>
      <p>PS: Hi Kent!</p>
