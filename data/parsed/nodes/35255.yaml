    html: |-
      <p>Typically "book" means that the contrast is lowered compared to the regular weight. A lot of digital type came from the original display masters, etc., thereby making a beautiful typeface less usable in a long running text.</p>
      <p>Bembo is a classic example. A beautiful typeface, but something was missing when you used it for text.</p>
      <p>Enter Bembo Book, a slightly heftier, less contrasty typeface much more suitable for setting text.</p>
      <p>You see the same thing when you peer into the optical sizing of the Adobe fonts.</p>
