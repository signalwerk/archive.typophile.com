    <p>Hi. I'm trying to find a viney looking element to be used as a border. Adobe's Woodtype ornaments and Emigre's Dalliance are symmetrical and in this case, inappropriate. What I need is something that looks irregular and organic or hand drawn.</p>
    <p>Anyone have any ideas? I'd hate to have to break out a pencil and paper...</p>
    <p>Thanks.</p>
