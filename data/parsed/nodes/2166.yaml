  - id: 17217
    user: 2664
    date: 2003-11-21T12:06:00
    date_raw: 21 Nov 2003 — 12:06pm
    votes: null
    html: <p>Scott- I came across the "square theory" in my undergrad program.  My professor for Corporate Identity said that often times logos have to fit within a square for their applications (corner of letterhead, homepage, business card, t-shirt pocket.)  I don't believe, and I don't think my professor believed that this was a hard fast rule, but that it was a starting place, and to venture out meant you had a good reason.  Another way I have often heard this idea described is that "a good logo should be able to roll down hill".  So anything that fits nicely into a square, like a circle, would roll (probably much better than a square).  I think the main purpose of this kind of thinking was to encourage designers to consider the application limitations of a logo that has extreme horizontal or vertical dimensions.  But yeah, how boring would it be if all logos were square? </p>
    html_clean: <p>Scott- I came across the "square theory" in my undergrad program.  My professor for Corporate Identity said that often times logos have to fit within a square for their applications (corner of letterhead, homepage, business card, t-shirt pocket.)  I don't believe, and I don't think my professor believed that this was a hard fast rule, but that it was a starting place, and to venture out meant you had a good reason.  Another way I have often heard this idea described is that "a good logo should be able to roll down hill".  So anything that fits nicely into a square, like a circle, would roll (probably much better than a square).  I think the main purpose of this kind of thinking was to encourage designers to consider the application limitations of a logo that has extreme horizontal or vertical dimensions.  But yeah, how boring would it be if all logos were square? </p>
