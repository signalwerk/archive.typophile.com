    html: "<p>Ty: <br>I think your original idea looks cool. Also good in the blue version you have above (although I don't think it works as well in reverse). <br> <br>I like its simplicity and playfulness. I noticed both the \"TY\" letters and the face immediately, but if some people don't right away, I think that's okay too. <br> <br>It also seems like it lends itself to embellishments for the sake of self-promo pieces in the future (I'm reminded of the old constantly changing MTV logo). <br> <br>It seems sly without being silly/goofy. <br> <br>The world is so annoyingly serious that it's nice to see something with a little wit.</p>"
    html_clean: "<p>Ty: <br>I think your original idea looks cool. Also good in the blue version you have above (although I don't think it works as well in reverse). <br> <br>I like its simplicity and playfulness. I noticed both the \"TY\" letters and the face immediately, but if some people don't right away, I think that's okay too. <br> <br>It also seems like it lends itself to embellishments for the sake of self-promo pieces in the future (I'm reminded of the old constantly changing MTV logo). <br> <br>It seems sly without being silly/goofy. <br> <br>The world is so annoyingly serious that it's nice to see something with a little wit.</p>"
  - id: 17238
    user: 618
    date: 2003-12-09T05:26:00
    date_raw: 9 Dec 2003 — 5:26am
    votes: null
    html: "<p>Hi Ty, <br> <br>Thanks for posting the logos. They are nice, particularly Lucky 7 and Quote 66. After comparison, your mark does seem to be *on the money* with regards to your style, though I think possibly not as strong as the two mentioned above, but stronger than the 3rd example. <br> <br>Many people here have responded positively, so don't let me discourage you. As I said, not my favorite logo, but what you do with it now will speak volumes also: type choice, stationary layout etc. <br> <br>I just had an idea: what if you were to design your idenity around the concept of identity. You could make the top of your letterhead into a government form with a box for your thumbprint (actually print each one), lines for your name and info (hand write it in), etc. There would certainly be room for wit in a gov't form! Same for business card &amp; envelope. If you didn't want to fill in by hand, you could type them (ahhhhh. with an actual typewriter). If you are like me, you probably won't go through huge amounts of stationary so the crafty approach could save cash. This would certainly be memorable if it came across my desk. Just a thought to consider. <br> <br>Randy</p>"
