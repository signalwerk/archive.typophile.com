    html: <p>Chesh, I've always had a soft spot for this version of Futura, with its "obese x-height" (as Hrant might put it). <br> <br>Mark, I had a hunch it was the Maxi version, so I used that word in my search term. But you're right, it doesn't come up in a search of "Futura" alone. <br> <br>Also, to amend my ID, the version I linked to is from Agfa-Monotype, not E+F (although I'd swear I've seen a version from them, too).</p>
