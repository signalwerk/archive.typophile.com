    date_raw: 18.Jun.2004 11.29am
    votes: null
    html: <p>It's a dirty little secret, but that's why they call it "MyFonts." What shows up for you is often extremely different than what shows up for someone else, say, Marc. It's based on a number of factors, including shoe size, hair color, and how good you were back when you were seven years old, among others. (Frankly, I was surprised at the one regarding right-handedness, left-handedness, and ambidexterity, but all the other ones seem appropriate to me.)</p>
