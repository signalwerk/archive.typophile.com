    html: <p>Marc, you might be interested to know that I will soon be digitizing Phil Martin's Fotura Biform family, which is also based on Futura. It has an even more "obese" x-height than Futura Maxi. It also has "biform" or "commoncase" alternate caps which are like giant lowercase characters the same size as the caps. Sort of the opposite of small caps. It's going to be a lot of fun to do.</p>
