    <p>Hello!</p>
    <p>I'd like to present you my newest design project! I love movie posters and for years I've wanted to create my own versions for some of the movies I liked! But as the trend of making personal movie posters on the Internet became pretty big and it felt like almost everyone was doing it, I tried to find a way to still do it in an original way, and make them even more personal. So, the idea was to take some old photos from my family's photo-albums, and then turn them into movie posters by adding the type and making minor changes on the photos.</p>
    <p>The hardest part is to finding appropriate photo for a certain movie (or vice versa), so I dig through a lot of photo-albums. :) The project is still ongoing, and I'll update this topic as more work gets done. Here's the four posters I made so far:  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/poster_01_4213.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/poster_02_i_4658.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/poster_03_4025.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/poster_04_2_4344.jpg"></div><p></p>
    <p>I would love to hear your comments!</p>
