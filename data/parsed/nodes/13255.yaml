      <p>&gt;actually changing a default setting!</p>
      <p>Generally, unless it is a cap-only display font, I believe you have to 'custom' kern caps for display. This is because what looks good isn't linear with increasing size, and also caps have to be designed to fit the lower case, etc.</p>
      <p>So I would say, just do it. You can check your eye by posting it here and getting feedback.</p>
