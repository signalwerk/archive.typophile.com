    html: |-
      <p>Another way to categorize type trends would be by technology.<br>
      New technologies and new design genres have always gone hand in hand.</p>
      <p>For example, Baskerville’s letterforms, his smooth paper, extra black ink, and austere layouts.<br>
      It was similar in a way to neoclassical architecture, such as Nash’s terraces, where the structural material (brick or stone) was covered with white stucco, to create the perfect surface — just as Baskerville had obliterated the wove. No trace of process or hint of human scale, a machine finish — the opposite of arts and crafts. So the physical style that is termed Neoclassical may just as well be called Mechanist or Scientism (another meaning for these words).</p>
      <p>Right now, there’s the OpenType movement.</p>
      <p>Speaking of Scientism (in the established sense), that’s another contemporary movement, headquartered at Microsoft.</p>
