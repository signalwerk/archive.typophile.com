  html: |-
    <p>Dear All,</p>
    <p>We are currently looking for designers to submit some new, original and exciting typefaces for Colophon's autumn release schedule.</p>
    <p>We accept submissions through e-mail at the following address:</p>
    <p><a href="mailto:abc@colophon-foundry.org">abc@colophon-foundry.org</a></p>
    <p>You may submit as many as you like, and in any form of completion (ideally, this would be at least all major characters completed). Not technically minded? If we feel that your typeface has true potential, we can take the project on further so it can be released.</p>
    <p>Please keep e-mail submissions below 3mb, and in PDF/Jpg form is best.</p>
    <p>Warmest,</p>
    <p>Colophon Foundry</p>
