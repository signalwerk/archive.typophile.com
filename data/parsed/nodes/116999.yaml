    html: "<p>Clearly not convinced 'NEW ERA' could be a font as it, rather a custom(ized?) lettering exclusive for the company. It is actually very close to many techy fonts and freebies. Some alternatives: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fw-identikal/positec\" rel=\"nofollow\">Positec</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/canadatype/sol-pro\" rel=\"nofollow\">Sol</a> (using some alternates), <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/vox\" rel=\"nofollow\">Vox</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/aah-yes/snather\" rel=\"nofollow\">Snather</a>, <a class=\"freelinking external\" href=\"http://www.dafont.com/nemode.font\" rel=\"nofollow\">Nemode</a>, <a class=\"freelinking external\" href=\"http://www.dafont.com/adventure-subtitles.font\" rel=\"nofollow\">Adventures Subtitles</a></p>"
