    html: |-
      <p>At this stage it might be helpful to do some character set comparisons.<br>
      Here is the core English charset from ITC American Typewriter Medium:<br><img src="/sites/default/files/old-images/ITCAmericanTypewriterMed_5400.jpg"><br>
      Here is the core English charset from Paratype's Secretary Regular:<br><img src="/sites/default/files/old-images/SecretaryEng_3711.jpg"><br>
      Note that Secretary is similar but not identical to ITC American Typewriter Medium. In addition to differences in glyph outlines, the x height is lower.<br>
      Here are the Cyrillic letters from Secretary Regular:<br><img src="/sites/default/files/old-images/SecretaryCyr_3836.jpg"><br>
      Are they an exact match with the sample?<br>
      Don</p>
