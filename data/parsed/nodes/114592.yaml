      <p>Strange case … maybe this is the typeface Secretary by ParaType:<br>
      <a href="http://www.paratype.com/pstore/fonts/Secretary.htm" title="http://www.paratype.com/pstore/fonts/Secretary.htm">http://www.paratype.com/pstore/fonts/Secretary.htm</a><br>
      It is similar to ITC American Typewriter. In the 1990s ITC commissioned several designers to design Cyrillics for their library. Some typefaces were released, but others were not, but that’s another story. According to various sources ITC American Typewriter was designed by Victor Kharyk. I could not find a foundry selling it, but maybe you have more luck than I had.</p>
