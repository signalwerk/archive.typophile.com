    html: |-
      <p>At this stage it might be helpful to do some character set comparisons.<br>
      Here is the core English charset from ITC American Typewriter Medium:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ITCAmericanTypewriterMed_5400.jpg"></div><br>
      Here is the core English charset from Paratype's Secretary Regular:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/SecretaryEng_3711.jpg"></div><br>
      Note that Secretary is similar but not identical to ITC American Typewriter Medium. In addition to differences in glyph outlines, the x height is lower.<br>
      Here are the Cyrillic letters from Secretary Regular:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/SecretaryCyr_3836.jpg"></div><br>
      Are they an exact match with the sample?<br>
      Don<p></p>
