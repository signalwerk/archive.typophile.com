  html: <p>Sales representative business card for a new print brokering business I started last month. Heavy on collage illustration to show off vibrant color. <br>Logo P is modified from Peter Bilak's Fedra Text. text is set in Fedra Text. site to launch in mid May will use (soon to be released) Fedra Screen. I have a 3D logo in the works which is currently done in plastic plaster,  I am weighing its effectiveness and aesthethics before I do it in 3D and eventually in plasma cut steel. <img src="http://www.typophile.com/forums/messages/29/1129.jpg" alt="PR1.jpg"></p>
