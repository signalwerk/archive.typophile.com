      <p>That "distressed" quality is an artifact of the scanning, not the printing. You are largely seeing the pixelation resulting from the low resolution of the scans. You could easily replicate this by choosing any font you like, printing something in it, photocopying it a few times (copy the copy repeatedly), and the scan it at a low resolution. You can probably also fake it in Photoshop etc.</p>
      <p>The difference between the pages of the Jstor article is that the first page is a PDF generated directly in software with vector-based fonts, and the second is a PDF of a raster image scanned from paper. Make sense?</p>
