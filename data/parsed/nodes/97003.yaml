    <p>I'm looking for a font that emulates the text in old scholarly journals.  Here are a few examples of what I mean:</p>
    <p><a href="http://dns2.asia.edu.tw/~ysho/YSHO-English/1000%20WC/PDF/J%20Ame%20Che%20Soc60,%20309.pdf" title="http://dns2.asia.edu.tw/~ysho/YSHO-English/1000%20WC/PDF/J%20Ame%20Che%20Soc60,%20309.pdf">http://dns2.asia.edu.tw/~ysho/YSHO-English/1000%20WC/PDF/J%20Ame%20Che%2...</a><br>
    <a href="http://rieke-server.physiol.washington.edu/People/Fred/Classes/532/hodgkin_huxley_jphys52d.pdf" title="http://rieke-server.physiol.washington.edu/People/Fred/Classes/532/hodgkin_huxley_jphys52d.pdf">http://rieke-server.physiol.washington.edu/People/Fred/Classes/532/hodgk...</a><br>
    <a href="http://books.google.com/books?hl=en&amp;lr=&amp;id=wpU5AAAAMAAJ&amp;oi=fnd&amp;pg=PR3&amp;ots=Wt9EmkG6oo&amp;sig=IgvHEGIS5s12OyikoCtP_pBRyms#v=onepage&amp;q&amp;f=false" title="http://books.google.com/books?hl=en&amp;lr=&amp;id=wpU5AAAAMAAJ&amp;oi=fnd&amp;pg=PR3&amp;ots=Wt9EmkG6oo&amp;sig=IgvHEGIS5s12OyikoCtP_pBRyms#v=onepage&amp;q&amp;f=false">http://books.google.com/books?hl=en&amp;lr=&amp;id=wpU5AAAAMAAJ&amp;oi=fnd&amp;pg=PR3&amp;ot...</a><br>
    <a href="http://books.google.com/books?hl=en&amp;lr=&amp;id=pnItAAAAYAAJ&amp;oi=fnd&amp;pg=PR1&amp;ots=GeNnwWDJPf&amp;sig=18J1V3ThiMKFxUdDKNP73Un_u8A#v=onepage&amp;q&amp;f=false" title="http://books.google.com/books?hl=en&amp;lr=&amp;id=pnItAAAAYAAJ&amp;oi=fnd&amp;pg=PR1&amp;ots=GeNnwWDJPf&amp;sig=18J1V3ThiMKFxUdDKNP73Un_u8A#v=onepage&amp;q&amp;f=false">http://books.google.com/books?hl=en&amp;lr=&amp;id=pnItAAAAYAAJ&amp;oi=fnd&amp;pg=PR1&amp;ot...</a></p>
    <p>These examples are actually kind of clean; something even more rough (but still legible) would be more preferable.  It's kind of hard to explain what I'm talking about, since I'm not well versed in typography lingo, but the fonts look rough, or not crisp, especially when you're zoomed out.  Like sometimes it seems as if some of the edges are almost missing or faded out.  That's the visual I'm going for.  Something that conveys that this is text made for a scholarly article, but that it is premodern, or precomputer at least.</p>
    <p>Are there any fonts like that?</p>
