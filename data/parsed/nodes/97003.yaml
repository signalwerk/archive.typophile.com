      <p>Hrant! Way to weed out the freeloaders! You rule, dude!</p>
      <p>A simpler method.</p>
      <p>1. Rasterize the type as grayscale at 300dpi.<br>
      2. Apply a Gaussian Blur of 3 to 8 pixels (depending on the font).<br>
      3. Adjust LEVELS to pure black and white.<br>
      4. Convert to BITMAP.<br>
      5. Duplicate layer, and use DISSOLVE to add noise.<br>
      6. Flatten and print.</p>
      <p>Have fun: this method is totally free. Consider donating…</p>
      <p><a href="http:///www.nicksfonts.com/" title="http:///www.nicksfonts.com/">http:///www.nicksfonts.com/</a></p>
      <p>You cheap bastard.</p>
