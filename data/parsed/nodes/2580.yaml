    html: <p>I think the "a" form you have in your revision could make a much more e-like "e" than the one you have currently (rotated and flipped so the flat side is on the baseline and it opens to the right). <br> <br>But you would have to take great care that it looks like an "e", and not f, c, or g. <br> <br>I think the spacing on "Heilmair" could use some work as well; as it is, it gets very pale in the "eil" region, and "ma" is quite dark.</p>
