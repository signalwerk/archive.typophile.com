    html: <p>I haven't made any comments yet, but I have been following this critique. I'll have to agree with Darrel about reading Alfx. I think I'm finding the "E", but that's only because I'm looking for it as a design critic. Tanya's direction isn't a bad one to explore, although the "A" and "E" shapes aren't exactly the same. As she has illustrated it, the "l" and "E" would need to be pulled much closer together. <br> <br>Have you looked into any other designs/concepts that you'd be willing to share? <br> <br>Aloha! <br>Scott</p>
