    html: |-
      <p>@Dave:<br>
      <cite>Khaled, yes... I'm wondering, what is the upper bound on how bad the inefficiency can get? :-)</cite></p>
      <p>It can be very limiting, for example, in the font I'm about to release, I strip glyph names (not required for TTF fonts) and lookup names don't get exported either, so if someone is to alter some of the lookups in the font without my working sources it'll be a very laborious effort. Further more, I internally use kerning classes that are "exported" at build time to kerning pairs, editing thousands of kerning pairs is no fun. Even worse, for fonts built from Matafont like sources (many of GUST fonts), good luck editing 40 font files or so per family that were actually generated from a single Metafont master.</p>
      <p>So in general, I'm more with providing sources and build scripts (if any), it won't harm.</p>
