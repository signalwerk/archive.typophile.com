      <p>Sii, Adam Twardoch has talked publicly at conferences this year (I forget which one) about making FontLab files interoperable for libre font tools. I speculate that could be publishing the VFB format specification, or perhaps making a documented variant of UFO ("XFO"?) the default file format for FontLab Studio 6 and providing way to upgrade VFBs to XFOs in FL6.</p>
      <p>Khaled, I think when more tools like "Proteus" are available, the need for sources will become even more aparent. The next generation of font tools all seem to take on the parametric ideas of METAFONT, and the type design tool R&amp;D that FontLab demo'd at ATypI this year was VERY impressive, being interactive and DESIRABLE. Your points about the current tool's ability to make the installable fonts very different and annoying if interesting. I wonder if a tool could be made to deduce and reconvert 'flat' kerning pairs into a hierarchical kerning class system... and the same for OpenType lookups, that seems much much harder though. </p>
      <p>Frank, the GNU GPL does require sources to be made available to users on request, which is why its my favourite font license. However, CC-BY-SA does not, and I think its better to use the SIL OFL v1.1 instead of CC-BY-SA for fonts. Fonts are not 'content', they are much more like programs (and contain programs.)</p>
      <p>Thanks guys!</p>
