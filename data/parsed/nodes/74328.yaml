    html: <p>The lack of a requirement to release all modified source materials for derivative works is in my opinion a major drawback of the Open Font License (OFL).  The OFL lacks a major part of the open source culture, which is that someone should not need to reverse engineer or start from scratch when modifying an existing project (program, font, etc).  For future releases of my original fonts, I am looking for an alternative to the OFL.</p>
