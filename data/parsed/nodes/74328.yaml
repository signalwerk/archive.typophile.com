      <p>Dave (abattis) -</p>
      <p>This all sounds very much like a discussion you and I and others have had many times before, so I'm surprised to hear you bringing it up yet again. But for the benefit of others here...</p>
      <p>It is surprisingly difficult to define what files constitute complete 'source' for fonts. is it every file used in development, such as scanned source of drawings before optimisation? Is it every file necessary for 'building' the font, including every small Python script used to, say, work around a FontLab bug? Does it include app-specific prefs files, such as FontLab .nam and .enc files? Do they need to be in an open, non-proprietary format, so that anyone can use them? Does it do anyone any good if the files are there but without documentation on how to use them?</p>
      <p>Fonts are not like other kinds of software that can easily be compiled from a 'source' in a documented, automatic system that needs only a one-button push. We and many other foundries are working hard to get closer to this, but only a few really succeed, and I suspect that almost none of those in-house build systems could easily be reproduced by others. The build system for our Roman fonts (Gentium, Charis, etc.) is horribly complex. We've worked very hard over the past three years to make it simpler, but there is a natural complexity in such massive projects. If we were required to bundle 'source' files with these fonts (according to one strict definition of  'source' - a complete reproducible build tree) there is no way we could have done it.</p>
      <p>For most purposes, the resulting font itself can be considered sufficient 'source'. The outlines, data tables and even smart font behaviors are there and can be modified and improved. Hinting and complex smart font routines can be more opaque, so there's clearly usefulness in a richer set of source files. It can be difficult, however, to produce that richer set, and requiring us to do so would be prohibitive.</p>
      <p><em>Most importantly, if you require foundries to produce 'source' upon request, you need to produce an objective definition of what that is.</em> IMHO, there is no such definition that would be workable. We tried very hard to come up with something like this when developing the OFL, but kept finding big problems with anything we tried. In the end, the font file itself became the basic minimum standard of 'source', and we any many others felt that was sufficient to call the OFL a free/libre license.</p>
      <p>We do feel it's important that foundries share as much as they can with others. For example, although there's no way we can currently reproduce our build system on a user's computer, we do provide additional 'source' files that would be reasonably useful for people wishing to build derivatives, such as FontLab databases, OT-CFF files (PS curves in non-proprietary format), anchor definitions, Graphite code, etc. We even produce some of these (such as OT-CFF) even though they are not needed for our build systems.</p>
      <p>In your specific case, the solution lies not in codifying a source definition in law, but in developing a relationship with the guys who produced "Bob". Ask if they can share their additional work with you in a useful way. If they don't respond well, see if a mutual friend (Ted?) can talk to them on your behalf. Offer to do some extra work to help make their work more broadly useful. Keep in mind that most derivatives are produced by someone in their spare time to meet a specific purpose. They may not have the technical ability or time to produce a richer set of development files.</p>
      <p>To require complete 'source' is a dead end in many ways. It is impossible to define, might require expertise and resources many font designers don't have, and would only stifle the development of free/libre fonts.</p>
