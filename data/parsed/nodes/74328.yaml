      <p>Andrevv, </p>
      <p>that well known competitor ignored a lot of unwritten "type ethics" by modifying and selling your outlines, even if he was technically free to do so.</p>
      <p>The whole point of publishing a libre font is to encourage people to modify and sell font outlines :-)</p>
      <p>if you release "Alice" under the pretense of "Do whatever the hell you want!" then you indirectly brought the whole "Bob" situation upon yourself.</p>
      <p>No libre license says "Do whatever the hell you want!" - libre fonts come with a license that is as firm as the EULAs normally used for fonts, and it allows certain things, requires certain things and prohibits certain things. </p>
      <p>Really the main libre license is the <a href="http://scripts.sil.org/OFL_web" rel="nofollow">SIL OFL v1.1</a> - and this is the license preferred by all the big libre font projects.</p>
      <p>- - - - - </p>
      <p>Charles, thanks a really great example! Thanks for telling the story :-)</p>
      <p>"Our" Charis is not for sale. I believe the SIL license forbids this, but in any case, I wouldn't do it. I have given it to one press to use in a series they are publishing.</p>
      <p>Making something 'for sale' involves 2 separate things: offering to distribute the work to the public, and charging money for distributing it. </p>
      <p>The SIL OFL allows charging money for distributing OFL fonts when a program is included alongside the font; anyone can include a "hello world" program to sell the fonts. Indeed, anyone selling computers (like One Laptop Per Child, or Dell) with Ubuntu or any other libre operating system installed is selling the fonts. </p>
      <p>No libre license requires publication though - the private right to modification, which you are exercising - is one of the major motivations for libre licensing! :-)</p>
      <p>As I understand it, your model was that a *reasonable* font was turned into something of beauty by modification, but not all characters were offered.</p>
      <p>There is a difference between </p>
      <p>Not quite, the idea is that the first font is just as beautiful as the second, but is a particular style, and covers a lot of weights and characters. The second font is a different style, and covers less weights and characters, but retains many of the characteristics of the first one. So someone would like to fill out the second one to match the number of weights and character coverage of the first - but don't have the VFBs. </p>
      <p>How would the source files, beyond what FontLab will extract from the OTF, help with that?</p>
      <p>The interpolation masters can be quite different from the distributed installable files; they have PostScript curves, and the distributed files are TTFs with Quadratic outlines - so no on can take the regular and bold and interpolate between them, without converting outlines back to PostScript and going through and cleaning them all up to prepare them for interpolation again.... </p>
      <p>This seems really annoying and a total waste of time to me, but, its not totally impossible, anyone competent could do it in a day or so - right?</p>
      <p>So.... what I'm really wondering, Is if there is anything in a set of made-for-installation OTF or TTF files that would take weeks to recreate for convenient modification?</p>
      <p>- - - </p>
      <p>you can still extend the font but not as efficient as if you have the sources.</p>
      <p>Khaled, yes... I'm wondering, what is the upper bound on how bad the inefficiency can get? :-)</p>
      <p><strong>Would it be good to require libre font distributors to provide source on request?</strong></p>
      <p>- - - </p>
      <p>To be clear, my posts here are my personal opinion only, and do not represent the views of any of my consulting clients.</p>
