    html: |-
      <p>Ummm... probably pretty useful.<br>
      but not necessary.</p>
      <p>that well known competitor ignored a lot of unwritten "type ethics" by modifying and selling your outlines, even if he was technically free to do so.</p>
      <p>To avoid this problem, I'd restrain from publishing the source files along with the font, but make them available upon request. I'd guess that the average person who downloads a free typeface doesn't have much interest in or use for the source files. Publishing the source files is gonna mean different things to different people.</p>
      <p>for the average person it might mean<br>
      "I'm a well developed typeface, download and use me!"</p>
      <p>for the type / graphic design hobbyist it might mean<br>
      "Hey! Play around with me and make something new!"</p>
      <p>for the (shady) type / graphic design professional it might mean<br>
      "Hey! Play around with me and make something new and sell it!"</p>
      <p>and for the type design benefactor it might mean<br>
      "I'm a well developed typeface, develop me more!"</p>
      <p>So I guess what I'm trying to get at here is, yes, it would help to have those source files for "Bob". But if you release "Alice" under the pretense of "Do whatever the hell you want!" then you indirectly brought the whole "Bob" situation upon yourself. But realistically, if they modified "Alice" enough, then the question is irrelevant to the previous states of "Bob" and you're really asking "How useful would it be the have the source files when asked to expand ANY typeface family." To which the answer will most likely always be "Probably pretty useful."</p>
