      <p>May be I'm "open-source" zealot, but releasing plain TTF files is much more useful than VFB files, since the later is a proprietary, undocumented file format that only applications written by one company can read an edit.</p>
      <p>If an open source project is not gaining outside contributions, then I take that as their failure to attract contributors, opening up your project won't magically make people willing to contribute to it. Take DeJaVu font project as an example of successful open-source font project.</p>
