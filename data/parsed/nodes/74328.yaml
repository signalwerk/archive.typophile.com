      <p>Perhaps a tiny real-world example? </p>
      <p>I modified Charis SIL and used the resulting font to set several books for university presses. Modifications were: old-style numbers, character spacing (sidebearing/kerning modifications), condense the italic a trifle, and replace the mark and mkmk feature with a ccmp feature (I use FontLab only).</p>
      <p>"Our" Charis is not for sale. I believe the SIL license forbids this, but in any case, I wouldn't do it. I have given it to one press to use in a series they are publishing.</p>
      <p>Well, it wasn't Bob -- Charis was pretty good to start with; itself a modification of Mathew Carter's Charter. Another SIL font, Gentium (revised), is now in beta testing. They make the source material available. It is of no use to me; I'd write my own features anyway. And Gentium (not Gentium Book) is a touch too light for bookwork with high dpi, ctp offset printing.</p>
      <p>This doesn't directly answer your question. As I understand it, your model was that a *reasonable* font was turned into something of beauty by modification, but not all characters were offered. What would it take to get the missing characters? And of course, it would take the same skill that turned the font into a thing of beauty. How would the source files, beyond what FontLab will extract from the OTF, help with that?</p>
