    date: 2010-09-18T06:13:00
    votes: null
    html: <p>It depends on how the font were done, if the glyphs were mostly drawn by hand, OpenType stuff done manually etc., then the working sources are of limited use. But if the weights were interpolated from masters, OpenType was (semi-)automated with scripts, then the sources are pretty important, but in either cases it is not necessary, you can still extend the font but not as efficient as if you have the sources.</p>
