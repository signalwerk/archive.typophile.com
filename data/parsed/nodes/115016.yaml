      <p>Yes, I can now see Trade Gothic Bold.<br>
      Take care not to get Trade Gothic _Next_, the "Improved" version of trade Gothic <a href="http://www.myfonts.com/fonts/linotype/trade-gothic-next/" title="http://www.myfonts.com/fonts/linotype/trade-gothic-next/">http://www.myfonts.com/fonts/linotype/trade-gothic-next/</a> It rounds the side strokes on O, G etc.<br>
      Don</p>
