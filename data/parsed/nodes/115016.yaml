    html: "<p>Agree with Don on customization, not on base. Can't be Franklin Gothic to me, mainly because of /G and /O external (left) outline which looks like a straight line on your sample and curved on FG. To me, that's either <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/linotype/trade-gothic\" rel=\"nofollow\">Trade Gothic</a> (Condensed) Bold or <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/linotype/alternate-gothic-lt\" rel=\"nofollow\">Alternate Gothic</a> #3.</p>"
    html_clean: "<p>Agree with Don on customization, not on base. Can't be Franklin Gothic to me, mainly because of /G and /O external (left) outline which looks like a straight line on your sample and curved on FG. To me, that's either <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/linotype/trade-gothic\" rel=\"nofollow\">Trade Gothic</a> (Condensed) Bold or <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/linotype/alternate-gothic-lt\" rel=\"nofollow\">Alternate Gothic</a> #3.</p>"
