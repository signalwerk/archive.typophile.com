    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Allegro_6480.jpg"></div><p></p>
    <p>Hi,</p>
    <p>I need help identifying the typeface used for the word ALLEGRO in this photo. This typeface does not appear on the Allegro Coffee Roasters site as far as I can tell. It seems to be specific branding for Allegro inside Whole Foods Market. I've only seen it at the Whole Foods on 3rd and Third. I've tried Identifont and What the Font to no avail. Any help would be greatly appreciated.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Trade Gothic        </div>
            </div>
    </div>
    <div class="field field-type-userreference field-field-solvedby">
