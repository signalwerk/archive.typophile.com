    <div class="info">Submitted by <a href="/user/1688" title="View user profile.">blokland</a> : 19.Oct.2009 2.58am </div>
      <p>On the 18th of November 2009, the 4th DTL FontMaster Conference will take place at the five star Steigenberger Kurhaus Hotel in The Hague. The title is <em>Type[&amp;]Design 2009</em> and the conference is targeted on those who work professionally with type, such as graphic designers, typographers, printers, type designers and font producers. The conference will provide insight in many (technical) aspects of type (design) and font production. Especially the focus will be on OpenType and the support of this font format by operating systems such as Mac OS and Windows and by applications from leading companies, like for instance Adobe®, Microsoft®, Apple® and Quark®.</p>
    <p>Besides the OpenType format also the IKARUS system will have a central place in the conference program, especially because it is now 35 years ago that the era of the digital font production started with this invention by Dr. Peter Karow. Much of the actual font technology, like hinting and kerning, finds its origin in the still actual IKARUS system, on which for instance the DTL FontMaster modules are built.<br>
    Dr. Peter Karow will be the guest of honor during the conference and he will also present the second <em>Dr. Peter Karow Award for Font Technology &amp; Digital Typography</em>. Furthermore the new 3.0 edition of DTL FontMaster, which includes the 2.5 version of the Adobe Font Development Kit for OpenType (AFDKO), and version 1.5 of DTL OTMaster will be presented.</p>
    <p>The previous DTL FontMaster Conference took place at Castle Maurick in Vught, nearby ’s-Hertogenbosch in 2003. In the past three years the Dutch Type Library organized so called <em>FM Tracks</em> in Lisbon (2006), Brighton (2007) and St. Petersburg (2008), as part of the <em>ATypI TypeTech Forum</em> sessions. So after six years the FM Conference has returned to the Netherlands.</p>
    <p>Speakers at the conference are Dr. Peter Karow (<em>Digital Typography and Artificial Intelligence</em>), Dr. Jürgen Willrodt (<em>OpenType Status 2009</em>), Thomas Milo (<em>DecoType, ACE and Tasmeem</em>), John Hudson (<em>Scholarly Types</em>), Peter Rosenfeld (<em>Re-inventing font technology</em>) and Frank E. Blokland (<em>Automating type design processes</em>).<br>
    All talks will be held in English.</p>
    <p><a href="http://www.fontmaster.nl/pdf/Type[&amp;]Design_2009.pdf">Conference program</a><br>
    <a href="http://www.fontmaster.nl/Blogs/FMNews">More information</a></p>
