    <p>Is there a reason that FL 5 (Mac) crashes an average of 4 - 6 times a day:<br>
    - while trying to open a font<br>
    - while trying to apply any command</p>
    <p>Guides/Guidelines:</p>
    <p>I can’t convert guidelines to global. Ctrl-click I get this popup menu: “Cancel | Properties”;<br>
    sometimes  - out of the blue - the local guides with the blue color changes to green</p>
    <p>Reverse contour:</p>
    <p>also problem with this one. Ctrl-click I get this popup menu: “Cancel.... Define a stem | Properties | Macro -&gt;”</p>
