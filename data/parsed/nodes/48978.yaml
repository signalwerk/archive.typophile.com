      <p>My first freelance job was redesigning a cookie label on cellophane for a Turkish importer (to the US) of food products. The company that makes the cookies attempted to make the label in English too, but It was a lot like reading the packaging at a Chinese grocery store in the US. ("Horse Bean Snack Keep You Joyful Best!") His idea was that it needed to be "really classy".</p>
      <p>For a hundred dollars, I probably spent 6 weeks going back and forth debating on what the cookie label should look like. In the end it was probably a lot better than if he had simply said "perfect" from the start. </p>
      <p>If it is an internship, while you shouldn't fight your way around, they clearly aren't buying your silence. If they want unpaid help from someone who is studying design, they should be willing to hear your ideas in between runs for coffee at the good coffee place.</p>
      <p>The new ideas are better... but what happened to the navy?</p>
