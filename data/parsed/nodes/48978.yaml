      <p>"mirroring" seems to be some "common line" in their style.<br>
      you could try to integrate that more in your cards.</p>
      <p>And: they never have information side by side, always top to bottom and hierarchically structured (the more to the bottom, the less important).</p>
      <p>Considered to create a card in portrait orientation?</p>
      <p>Try to explain your analysis and thoughts when presenting them. Say what you saw, and explain how this results in your cards. It's at least as important to show your ideas and thoughts as the cards themselves.</p>
