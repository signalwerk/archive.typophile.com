      <p>Here are three versions. I used the the same type of information layout in the three.</p>
      <p>The first vertical: I think this one mimics their style more so...but it's my least favorite of the three.</p>
      <p>The second vertical: A bit more playful. Out of all of them, this would be my favorite. It sort of takes their style and uses it in a bit more elegant way, rather than making it look like it was done in Word.</p>
