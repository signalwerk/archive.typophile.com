    html: |-
      <p>I would go in there and tell them that their visual identity is hopelessly confused and dreary. They yearn to appear credible and authoritative but at the same time approachable and modern. The cliches have been chucked together with no real or deep thought as to what an identity is. This kind of thing depresses me.  </p>
      <p>having said that, your cards are neither here nor there. If you are attempting to replicate their style you should center the logo. You should use the correct colours. Use a gradient rather than flat. look at the space you have created - the middle one is crammed in the left and empty in the right.  The vertical spacing on the other two needs a lot of work - the name on the third one is in danger of being guillotined and the first isn't much better. And I agree with the others about the use of imagery. </p>
      <p>If you are trying to show them something new, well, you should depart much much further from where you are at the moment.</p>
      <p>I don't want to sound like an arsehole but they need a lot of work - Learn to use white space, love white space, have white space's babies and breast-feed them till they're 17.</p>
