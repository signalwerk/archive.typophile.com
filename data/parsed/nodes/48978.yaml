    <p>I am applying for an internship at my school designing misc. signage (for the most part). I am going in for an interview sometime this week, and they want to see a business card designed in their style. They sent me a a couple posters for examples of their style. </p>
    <p>Poster 1<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/shriverposter_4872.jpg"></div><p></p>
    <p>Poster 2<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cityscape3c_5615.jpg"></div><p></p>
    <p>My Business Cards<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/shrivercenter_card_5802.jpg"></div><p></p>
    <p>I am just looking for any suggestions for improvements. I am looking for things such as:</p>
    <p>Does the style match the posters?<br>
    Is the imformation easily readable?</p>
    <p>Please feel free to be picky, I can take criticism. Constructive Criticism.</p>
