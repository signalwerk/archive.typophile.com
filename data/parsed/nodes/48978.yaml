    html: |-
      <p>Thank you all for your advice! And yes, I agree with all of you that say this isn't exactly design agency professional work. BUT this is sadly the design style that curses many business' based in Microsoft word. Everyone has their own style. At the end of the day...the client is always right...what they like is what they want you to do...unless they ask for something different.</p>
      <p>In this case, they specifically picked out 2 files to send me to show me their style. I could only imagine that they are not looking to change, and that they are happy.</p>
      <p>Chris Keegan: Thanks a lot for your critique. I agree fully. That's the direction I was originally going to go...getting rid of the all the "graphics" and just use the logo and gradient reverse. I think they graphics are awful...but I was looking around campus, and at least these graphics are consistent, so they do serve as a sort of identity...sadly. I am a born minimalist...If I could get away with telling an entire story with 3 words...I would :D</p>
      <p>Aluminum: I don't need this internship to learn about design, I've been an ad designer for over 2 years now. To me, it's more for the experience to work in different places doing different things before I graduate in December. As for the business card...I don't think they are actually going to use it. I don't think they can. I think they have to use the "UMBC BUSINESS CARD" and just have their department name on a specific part. So that's what leads me to believe this is more about seeing if they can find someone to match their style...business card being the smallest, but most powerful way to see that, considering that it shows how you organize your information and how well you do with matching fonts/styles/colors.</p>
      <p>But enough talk, I will be going back to my computer tonight to rethink this. haha. I should be going in for the interview sometime this week, so we'll see.</p>
      <p>Thanks again!<br>
      courtney</p>
