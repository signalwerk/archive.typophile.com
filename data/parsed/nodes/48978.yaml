    html: <p>Although what they have is pretty bad, going in there and telling them so won't score you any points. I would take the best element from that poster, which IMO is the blue bar with the type, and use only that on the cards. Drop the clip art people and skyline photo. Keep the information clean and easy to read. Also, whatever you show them, make sure the colors match what they have now. You might also try using that blue all over the card as another option, and reverse the type. I would also suggest you take a look at some good business card designs to get an idea of layout and arrangement of type. Good luck.</p>
