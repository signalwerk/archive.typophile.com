      <p>A business card isn't a poster! It's really important to remember that when you want to design something that works. Remember to communicate the information first and foremost.</p>
      <p>Most important… Keep it simple! Trying to cram images on doesn't work. I would suggest name (logo) on one side and details on the other. If you insist on putting an image on it, try keep it only on one side maybe with the logo.</p>
      <p><em>Mirroring</em> on a business card? It probably won't come out! As a good friend once said to me. <em>Lets not jump up on the apple band wagon!!</em></p>
    html_clean: |-
