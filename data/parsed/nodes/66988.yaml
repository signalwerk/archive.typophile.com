      <p>You see, I am really ignorant. Is this code list a scheme for typographers to observe with their own designs, or are the symbols in some way official? Ah, I notice this: "The shapes of the reference glyphs used in these code charts are not prescriptive. Considerable variation is to be expected in actual fonts." Phew! ...because some of these executions are really bad. And some missing aspects and variations would have to replace other items such as the hammer and sickle.</p>
      <p>--</p>
      <p>Unicode is a standard for which character has what code, just like ASCII. ASCII just says that the number 64 stands for the uppercase letter A, not whether that A is in Courier or Times Roman. And, in fact, the Unicode document warns people against stealing the typefaces they were graciously allowed to use to print the thing as a way to create a Unicode typeface.</p>
      <p>ISO 8858-1, the 8-bit code that added accented characters to the "high bit" range, was "official", but not compulsory. One could put Japanese katakana in the high bit range instead, or different accented letters to support Hungarian and certain other languages. Even ASCII had "national use" positions.</p>
      <p>To be Unicode-compliant, you would not replace the hammer and sickle with the biquintile... instead, you would put the biquintile 'way up in the "private use area". To be usable on some older systems, you might prefer to make an 8-bit font, not a Unicode font, and replace the accented letters by the aspects instead.</p>
