      <p>riccard0: Zapf made elegant planet and sign symbols to go with Palatino. Many symbols are missing and a couple should be reworked but, anyway, I am hoping for a set that would be more consistent with a good workhorse typeface - one that could fill a heavy textbook without tiring the reader (for which Palatino is ever so slightly too mannered imo). There are beautiful and valid models in Renaissance books and even in Hellenistic manuscripts, but of course that is not what you mean.</p>
      <p>I have a workhorse or two in mind but I hesitate to start with that idea when I am asking if someone will want to work with me. There is also the question of how transferable to other contexts a set of symbols could/should be - I have no clue.</p>
      <p>cuttlefish: You are thinking of the Unicode astrological symbols listed in Wikipedia? The set is almost complete (the main lacuna is a complete and consistent set of 36-degree aspects) but the execution is ghastly and in a few cases absurd. </p>
      <p><a href="http://en.wikipedia.org/wiki/Astrological_symbols" title="http://en.wikipedia.org/wiki/Astrological_symbols">http://en.wikipedia.org/wiki/Astrological_symbols</a> </p>
      <p>(And don't take their explanations of the symbols too seriously!)</p>
      <p>By the way, the order and code assignments of astrological symbols I have seen vary from one design to the next. I suppose it doesn't matter, though it might be clever to adopt the Unicode range. At this point it's the least of my worries.</p>
