      <p>Sorry for my absence - it's been hectic (including a furnace breakdown now fixed).</p>
      <p>As for the Andron astrological characters there are two types of consideration. First, there are what I would call "substantive form" issues which have to do with preferences and taste, so there one's decisions are as good as anyone else's. For example I would prefer a Z shape for Jupiter rather than a curve for historical and symbolic reasons, but that is a personal matter. </p>
      <p>Then there are "execution" issues. For example, I find there are too many serifs, and they are too strong. Here I think one's inspiration should be numerals. The Andron digits 0 to 9 - which I like - have serifs on the 1, what might be called half-serifs on the 2, 4, 5, and 7 (only one on each), and a discreet finishing tick at the top of 3 (if I am seeing correctly). The same restraint should apply to astrological symbols. As it is there are right-angled full serifs on the Jupiter, Saturn, Uranus, Virgo, Scorpio, Sagittarius, and Capricorn glyphs, and I find them annoying. The angled half-serifs, as on the Libra glyph and the lower end of the outer vertical strokes of Uranus, are fine. The Neptune glyph has three harpoon barbs instead of serifs. I know this is a reference to Neptune's trident and it is often done that way, but to me it is sliding from typography towards illustration.</p>
      <p>All the above is "sous toute réserve" since I feel like a snail criticizing a football team. I can't comment on the weight and shading because I have not seen the astro characters blended with a block of text.</p>
      <p>The new 116-character Unicode block is good news.</p>
