      <p>Nick, I'm not aware of any standard for the zodiac symbols. I think a number of artists have added their own flair or style. I know of three different symbols for Capricorn, which tend to be regional.<br>
      Andreas, I don't see any astrological symbols in your character map. You present a nice and consistent style, rather than the one displayed by Unicode.org and others which is inconsistent with some glyphs appearing to be a rip-off of ones I created and some being butchered--I'm referring the the thick-nib pen style symbols.<br>
      A bit off-topic, but while alchemy can transform, it is akin to basic chemistry with one notable exception: Alchemists consider the life force in any cell, while chemists do not generally take this position. The original Order of the Rosicrucians use alchemy even today. The symbols used in alchemy have changed over the centuries, due mainly to certain individuals defrauding people with the use of the symbols, once they were known.</p>
