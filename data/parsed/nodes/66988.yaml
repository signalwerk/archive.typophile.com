      <p>The general point of Unicode is to assign a number to every written mark used in human language. These numbers are useful in developing fonts among many other applications. The specific design in the code charts is not prescriptive, but the meaning generally is, e.g.: the snowman at U+2603 could be drawn differently but still recognizably be a snowman; you're not supposed to put just any random symbol in that spot.</p>
      <p>You can submit a request to add glyphs that you feel necessary to complete the astrological/astronomical symbol group to the Unicode consortium, but that can be a complicated process. <a class="freelinking external" href="http://www.unicode.org/pending/proposals.html" rel="nofollow">http://www.unicode.org/pending/proposals.html</a></p>
      <p>Of course, that doesn't get you the font that you need in short order, a very different question indeed.</p>
