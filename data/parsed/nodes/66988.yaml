      <p>I honour your detailed discussion of design details!</p>
      <p>First, <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=218" rel="nofollow">on this page (scroll down a bit)</a> everyone can see an actual piece of text (by I. Newton) which contains astrological and measurement signs.</p>
      <p>This is it what we are talking about:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/andron_astro_3870.jpg"></div><p></p>
      <p>The *coining* (dt. Ausprägung) – or “execution” – of those signs is a matter which indeed raises some questions, for me too. Is it about taste only – or can justified decisions be made here?</p>
      <p><cite>I would prefer a Z shape for Jupiter rather than a curve for historical and symbolic reasons, but that is a personal matter.</cite><br>
      – if there are historical and symbolic reasons for this preference, this is certainly not a matter of mere personal taste. I know both the pointed and the rounded Jupiter sign and found the latter more appropriate to accompany a Venetian-style font, mostly from my knowlegde of old prints. But if you have deeper insights in the nature of that sign I would be obliged to learn about it. </p>
      <p><cite>… too many serifs, and they are too strong. Here I think one's inspiration should be numerals</cite><br>
      Maybe you’re right with this, maybe not. The Venus often gets serifed crossbars which I omitted. Maybe the Jupiter and the Sagittarius would do with less as well. But the Uranus and Pluto signs definitely relate to Latin Capitals and an ‘archaeological’ glyph shaping ought to make this visible, in my opinion. (You’ll notice a second Pluto glyph, I’m not entirely happy with both).</p>
      <p><cite>The Neptune glyph has three harpoon barbs instead of serifs. I know this is a reference to Neptune's trident and it is often done that way, but to me it is sliding from typography towards illustration.</cite><br>
      – the path you’re sliding on is inherent in typography! You can’t escape. – What are you then to make of the arrow point of the Mars? Also too illustrative? At least my Neptun glyphs have no serifs on the crossbars, which you can see often elsewhere.</p>
      <p>As for the Virgo I know of an interpretation as a kind of m_r ligature (“Maria”), therefore the resemblance of the Latin m. The same element in the Scorpio sign, I don’t know of any such interpretation as yet. But for reasons of visual consistency the respective parts of both glyph have to match.</p>
      <p>Twelve sixpacks of fine beer to him or her who writes a profound historical-typographical survey upon “The shapes of astrological signs”.<br>
      (– Or is it existing already??)</p>
      <p>(And good luck with your furnace! Mine one is lousy too.)<br>
      A. St.</p>
