  html: |-
    <p>Is anyone interested in collaborating on a set of astrological glyphs? I was directed to this forum by a successful young designer who did not want to undertake the project and thought I should roll my own (maybe a 30-something dynamo is not aware of how daunting learning curves can be to a 70-year-old). </p>
    <p>Although I have loved typography all my life, have several reference works on my shelves, and used to handset poetry for a small press, the discussions here have left me shorn of all confidence. At the very least 62 characters would be involved - most likely more because it would be good to provide alternatives in a few cases, particularly the tiny number in which I would insist on (I hope easily justified) departures from convention. But I am aware that the choice of glyph forms might be the smallest problem, compared to such questions as portability, which glyphs to design as both fixed- and variable-width characters, etc.</p>
    <p>There was a discussion on astrological and astronomical symbols here a while ago. The participants seemed as lost in the astro world as I am in the typographic; but I think I can be a sound bridge between the two cultures.</p>
