      <p><cite>I wonder if that license agreement allows for necessary modifications to font metrics to make it compatible with the device.</cite></p>
      <p>Here is from  <a href="http://www.adobe.com/type/browser/legal/index.html" rel="nofollow">Adobe Western font (5 seat)</a>  EULA</p>
      <p>14.7.4 You may convert and install the font software into another format for use in other environments, subject to the following conditions: A computer on which the converted font software is used or installed will be considered as one of your Permitted Number of Computers. Use of the font software you have converted will be pursuant to all the terms and conditions of this agreement. Such converted font software may be used only for your own customary internal business or personal use and may not be distributed or transferred for any purpose, except in accordance with Section 4.4 of this agreement.</p>
      <p>Michel</p>
