      <p>I think James was responding validly. You asked for other people's opinions and proceeded to rationalize your own.</p>
      <p>Honestly, piracy on the iphone is a valid concern, there are a number of font hacks on Cydia that seem to include copies of commercial fonts. I've played around with porting my own fonts onto the iphone and you'd be surprised by how very few change need to be made. </p>
      <p>If you're really into hacking and skinning your phone and actually do care about doing it "correctly" you should check your font<br>
      s EULA to see if it allows re-engineering and installing on additional devices. If it doesn't, contact the foundry, explain what you want to do, and ask for permission.</p>
