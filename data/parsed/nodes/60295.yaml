  html: <p>I am wondering if anyone has ever thought about porting fonts for jail-broken iPhones. What’s your stance on it? OK as long as you don’t sell it and you own the license? I feel like the risks for losses due to copyright infringement would be minimal, since all the metrics and UPM size are different for the iPhone, making them not viable for print or commercial use anymore.</p>
