    html: |-
      <p>Perhaps you could find a reasonably close base font -- perhaps a Clarendon -- adjust it to conform to your image, and tack on the medial spurs. A couple of candidates are: Ultra Pro <a href="http://www.myfonts.com/fonts/stiggy-sands/ultra-pro/">http://www.myfonts.com/fonts/stiggy-sands/ultra-pro/</a> Hint: shave off about 1/10 of the height from top and bottom, then compress the width and thicken the cross strokes. Cowboy Rodeo <a href="http://www.myfonts.com/fonts/fontmesa/cowboy-rodeo/">http://www.myfonts.com/fonts/fontmesa/cowboy-rodeo/</a> Hint: shave off a little less, compress width , thicken the cross strokes and tack a serif on the top of the A.<br>
      Hope this is actually a font and someone spots it for you.<br>
      Don</p>
