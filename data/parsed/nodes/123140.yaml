    html: |-
      <p>To me and even if it's not matching perfectly (mainly /T top slab serif arm pits), I probably go for a <a class="freelinking external" href="http://www.myfonts.com/search/clarendon" rel="nofollow">Clarendon</a>, customized a bit maybe like artificially emboldened and rounded. But that's probably more <a class="freelinking external" href="http://www.myfonts.com/search/Egiziano" rel="nofollow">Egiziano</a>.<br>
      So more Egyptienne alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/giza" rel="nofollow">Giza</a> (FiveFive is possibly the closest for this family), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/cowboy-rodeo" rel="nofollow">Cowboy Rodeo</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/antique-six" rel="nofollow">Antique 6</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ortizlopez/olegiziano-classic" rel="nofollow">Egiziano Classic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/belizio" rel="nofollow">Belizio</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hwt/hwt-slab" rel="nofollow">Slab</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/gold" rel="nofollow">Gold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/lockup" rel="nofollow">Lockup</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/hoosegow" rel="nofollow">Hoosegow</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/tegetype/Aldogizio" rel="nofollow">Aldogizio</a></p>
