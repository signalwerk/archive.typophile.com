      <p>I ran across this when I looked at Cheltenham:</p>
      <p><cite>Daniel Berkeley Updike seems to have stimulated the architect Bertram G. Goodhue to design the prototype in 1896 for Ingalls Kimball at the Cheltenham Press. Six years later Morris Fuller Benton at ATF developed it into the design and then the series that we know today.“Owing to certain eccentricities of form,” writes Updike, <strong>“it cannot be read comfortably for any length of time.” </strong>But he concludes: “It is, however, an exceedingly handsome letter for ephemeral printing.” Mergenthaler bought composing machine rights to the original design c.1896, but bought the Benton design in 1904.</cite></p>
      <p>just wondering are you sure about Cheltenham.  It looks good to me but, I am not an expert on such matters.</p>
      <p><cite>Here is another case where Frutiger would work. Also, consider Myriad Pro, which has multiple options. Both are easy to read and are soft to the eye.</cite></p>
