      <p>Eurostile lends better to another sans than do other sans styles only when it is extended. It doesn't do well when it is in the regular form. The biggest problem with Eurostile is that I have never found a good serifed match unless it is italic. JMO.</p>
      <p>Also check out URW Latino: <a href="http://www.myfonts.com/fonts/urw/latino/" title="http://www.myfonts.com/fonts/urw/latino/">http://www.myfonts.com/fonts/urw/latino/</a></p>
