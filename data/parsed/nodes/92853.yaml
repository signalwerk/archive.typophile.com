    <p>Hello,</p>
    <p>I'm new to this. I have searched the web and found a million pointers on how to choose a Logo &amp; typeface, so much that I'm more lost than before my research, so I decided to ask someone who knows what they're talking about. Here it is:</p>
    <p>I am starting a new small business selling personalized gift baskets, and later on, I would like to open a small concept store to sell different items created by friends and myself (custom jewelry, gift items, small revamped pieces of furniture...), all items will be ecological. The name will be "Basket Case".</p>
    <p>I would like to create a logo with a script/handwritten font, and use a Serif font for body texts (brochures, letters...). The mood has to be classy, have character, and convey the image of something personal and thoughtful. (not looney like the name suggests, more like "crazy about making your gifts special").  </p>
    <p>Would anyone kindly point me in the right direction as to the following:<br>
    -A script/handwritten font for the logo<br>
    -A Serif font that goes well with the one for the logo<br>
    -Headers and Titles (would it be good to use the logo font, the text font, or a third one).</p>
    <p>Once I get your replies, I'll design the logo and post it for your reviews.</p>
    <p>Thanks a million!!!!</p>
