      <p>Consider these:</p>
      <p><a href="https://www.fontfont.com/find#family_dynasty=dynasty_352" title="https://www.fontfont.com/find#family_dynasty=dynasty_352">https://www.fontfont.com/find#family_dynasty=dynasty_352</a></p>
      <p><a href="http://www.myfonts.com/fonts/g-type/olicana/" title="http://www.myfonts.com/fonts/g-type/olicana/">http://www.myfonts.com/fonts/g-type/olicana/</a></p>
      <p>And/or since you might end up needing Arabic (although it's Maghribi style):<br>
      <a href="http://www.rosettatype.com/Aisha" title="http://www.rosettatype.com/Aisha">http://www.rosettatype.com/Aisha</a></p>
      <p>If you're sure you want a serif face, you might need to make a total break from the "handwritten" styles above and shoot for a strong contrast. If you go this route please consider this (which BTW renders great onscreen):<br>
