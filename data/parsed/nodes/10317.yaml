    html: "<p>Oh baby! <br> <br>&gt;T: exactly ... the basis of InDesign's \"optical kerning\" [is] the sidebearings of ... cap H and O, maybe lowercase n and o as well. <br> <br>&gt;JH: But Thomas, InDesign optical kerning will almost always change the spacing of HHH or OOO or HOH etc. It does not appear to consider any spacing sacrosanct. <br> <br>&gt;T:  I did try to read the original patent, but my German isn't very good. <br> <br>So: Adobe buys a key feature of InDesign from URW, finds out six years later it doesn't work, and has to go to a German patent it can't read to try, hopefully, to find out what its product actually does? We're in worse shape than I thought. <br> <br>&gt;JH: won't affect the spacing of O or o at 12pt, <br> <br>Et voila, John seems to have discovered the one unit that InDesign/Kernus considers a designer will space correctly.  <br> <br>No wonder the program is hopeless. O/o is in my view the space that designers most frequently get wrong, although one could just as well say that designers most frequently get wrong the relationship between straights and rounds. It would be far better to take the interior space of n and H as an index, but that would only work for supremely rationally designed fonts.  <br> <br>What I think is clear from this is that no external program, yet, has the intelligence to measure stem distances. Since this is so important, one might almost think that it would be worthwhile to build the figures into the font. Yuri Yarmola has claimed that this analysis can be done in FontLab, a thousand times, but has yet to build anything based on it in all these long dark years.  <br> <br>Since it is a matter of such utter simplicity to build a rational spacing and kerning engine once you are able to determine the relative positions of stems and serifs, I can't think why such a huge amount of intellectual energy has been wasted on alternative approaches. <br> <br>John, one point. You find a significant difference between -2/-3 units, on the one hand, and +18/+24 units on the other, and indeed there is, typographically. But if you look at it mathematically, there is no difference at all: in each case there is an increase of exactly 50%.  That is yet another example that InDesign is relying on mathematical hocus-pocus that does not correspond to typographical reality.</p>"
    html_clean: "<p>Oh baby! <br> <br>&gt;T: exactly ... the basis of InDesign's \"optical kerning\" [is] the sidebearings of ... cap H and O, maybe lowercase n and o as well. <br> <br>&gt;JH: But Thomas, InDesign optical kerning will almost always change the spacing of HHH or OOO or HOH etc. It does not appear to consider any spacing sacrosanct. <br> <br>&gt;T:  I did try to read the original patent, but my German isn't very good. <br> <br>So: Adobe buys a key feature of InDesign from URW, finds out six years later it doesn't work, and has to go to a German patent it can't read to try, hopefully, to find out what its product actually does? We're in worse shape than I thought. <br> <br>&gt;JH: won't affect the spacing of O or o at 12pt, <br> <br>Et voila, John seems to have discovered the one unit that InDesign/Kernus considers a designer will space correctly.  <br> <br>No wonder the program is hopeless. O/o is in my view the space that designers most frequently get wrong, although one could just as well say that designers most frequently get wrong the relationship between straights and rounds. It would be far better to take the interior space of n and H as an index, but that would only work for supremely rationally designed fonts.  <br> <br>What I think is clear from this is that no external program, yet, has the intelligence to measure stem distances. Since this is so important, one might almost think that it would be worthwhile to build the figures into the font. Yuri Yarmola has claimed that this analysis can be done in FontLab, a thousand times, but has yet to build anything based on it in all these long dark years.  <br> <br>Since it is a matter of such utter simplicity to build a rational spacing and kerning engine once you are able to determine the relative positions of stems and serifs, I can't think why such a huge amount of intellectual energy has been wasted on alternative approaches. <br> <br>John, one point. You find a significant difference between -2/-3 units, on the one hand, and +18/+24 units on the other, and indeed there is, typographically. But if you look at it mathematically, there is no difference at all: in each case there is an increase of exactly 50%.  That is yet another example that InDesign is relying on mathematical hocus-pocus that does not correspond to typographical reality.</p>"
