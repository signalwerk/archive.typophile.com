    html: <p>So the iKern <i>is</i> in the left ... damn! If iKern can be made to work this well with any font, then there isn't much point in spending weeks going through the combinations to make a font look well spaced from an end result point of view. At least for myself, I doubt I could get those results without spending a <i>lot</i> of time adjusting values. Given that it was my first try, so I'm still learning, I'm still adjusting kerning for my Marquet (you don't want to know how long its taken ...!) <br> <br>However, I imagine that the software will end up adding kern pairs between pretty much every letter pair (kind of like those Adobe Pro fonts). Without kerning classes in larger Unicode charsets, this could result in a really huge file! Is there any way you can get this software to automatically generate efficient OT kerning classes? (ah, wishful thinking...) <br> <br>BTW, kudos on this software, the results are really oustdanding <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
