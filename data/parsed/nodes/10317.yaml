    html: "<p>&gt; There is nothing rational about spacing: it's a question of aesthetic preference. <br> <br>The matter is not to find the mathematic that lies behind vision or thinking. The practical problem, in general, is: What do I want to achieve? How can I? The first question , the harder to me, doesn't need mathematic as Nick stated,. But the second, yes!  <br> <br>&gt; Ideally an autokerning device would have a number of sliders <br> <br>We're somewhat in tune. Behind iKern there is a model very very general. My work, now, is to reduce the sliders! An example for all: one of the proprerties let you define, in a range, the distance between two capital I in a sans serif font once having set the general average width that lead to a fixed OO spacing. It's a statistically controversial question! But it's not the program to make the choice (even if it suggests one good based on my experience) but me when I set the imput. Then the program apply my choice where needed. <br> <br>&gt; Changing the sidebearings of the o did affect other lowercase-to-lowercase and uppercase-to-lowercase at all sizes. This indicates that, indeed, InDesign uses the sidebearings of the lowercase o (and presumably the uppercase O) as a key to optical kerning for the Latin script. <br> <br>Not only. If, for example, one cuts both sidebearings of a \"m\" the couple \"mm\" will be tigher even after autokerning.</p>"
    html_clean: "<p>&gt; There is nothing rational about spacing: it's a question of aesthetic preference. <br> <br>The matter is not to find the mathematic that lies behind vision or thinking. The practical problem, in general, is: What do I want to achieve? How can I? The first question , the harder to me, doesn't need mathematic as Nick stated,. But the second, yes!  <br> <br>&gt; Ideally an autokerning device would have a number of sliders <br> <br>We're somewhat in tune. Behind iKern there is a model very very general. My work, now, is to reduce the sliders! An example for all: one of the proprerties let you define, in a range, the distance between two capital I in a sans serif font once having set the general average width that lead to a fixed OO spacing. It's a statistically controversial question! But it's not the program to make the choice (even if it suggests one good based on my experience) but me when I set the imput. Then the program apply my choice where needed. <br> <br>&gt; Changing the sidebearings of the o did affect other lowercase-to-lowercase and uppercase-to-lowercase at all sizes. This indicates that, indeed, InDesign uses the sidebearings of the lowercase o (and presumably the uppercase O) as a key to optical kerning for the Latin script. <br> <br>Not only. If, for example, one cuts both sidebearings of a \"m\" the couple \"mm\" will be tigher even after autokerning.</p>"
