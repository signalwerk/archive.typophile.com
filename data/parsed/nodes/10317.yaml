    html: "<p>&gt;I'm wondering if iKern is able to accept key spacing, i.e. manually set 'correct' spacing for e.g. n and o, which would not be altered by iKern and on which subsequent autospacing would be based? This is the one thing that seems to be missing from all autospacing/kerning algorithms I have looked at: the ability to set specific key values that will control the spacing. <br> <br>Yes, it does. It can rely on sidebearings automatically generated or on the original sidebearings (becoming an only autokerning tool). <br>It can mix in any percentage new and old sidebearings, both globally and locally. It can set fixed sidebearing value by value if desired. An this is one of the features necessary as a designer. <br> <br>&gt; the one on the right has too much space after the \"a\" <br> <br>yes I know. This is beacuse I prepared the file for Ralph \"without\" any manual modification to show the tool's potential. After the \"a\" there's too much space because of its autospacing. Reducing it a little resolves. And this is something every designer does when sets the very tight \"a\" right sidebearing. <br> <br>By the way the autospacing \"style\" can be deciced by the user at any point between very tight and very loose. In the Ralph file test it was average  toward the loose.</p>"
