    html: <p>I'm Igino Marini, the developer of iKern. Please feel free to let me know any comment. The only thing I would like to tell you all is that iKern not only does autokerning but, mainly, autospacing too. It means that the sample Ralph published in the comparision .pdf would have been exactly the same even if the original font sidebearings were very very "arhythmic" (using a definition taken from another thread) or even random. This is a difference between iKern and InDesign's Optical Spacing (and any other product I know).</p>
