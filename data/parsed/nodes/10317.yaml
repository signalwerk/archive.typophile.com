    votes: null
    html: "<p>ID optical kerning varies according to text size: it won't affect the spacing of O or o at 12pt, but it will affect it at both larger (tighter) and smaller (looser) sizes. The H and n are affected at all sizes. <br> <br>As an experiment, I made a version of Minion Pro Regular with the sidebearings of the o reduced to 7 units on each side (from 37). ID optical kerning did not adjust the spacing of ooo at 12pt, but applied almost the same adjustment at 24pt as it had for the normal Minion Pro font (-2 units vs. -3 units). At 6pt, the relative adjustment was significantly differed (+18 units vs. +24 units). Changing the sidebearings of the o did affect other lowercase-to-lowercase and uppercase-to-lowercase at all sizes. This indicates that, indeed, InDesign uses the sidebearings of the lowercase o (and presumably the uppercase O) as a key to optical kerning for the Latin script.</p>"
    html_clean: "<p>ID optical kerning varies according to text size: it won't affect the spacing of O or o at 12pt, but it will affect it at both larger (tighter) and smaller (looser) sizes. The H and n are affected at all sizes. <br> <br>As an experiment, I made a version of Minion Pro Regular with the sidebearings of the o reduced to 7 units on each side (from 37). ID optical kerning did not adjust the spacing of ooo at 12pt, but applied almost the same adjustment at 24pt as it had for the normal Minion Pro font (-2 units vs. -3 units). At 6pt, the relative adjustment was significantly differed (+18 units vs. +24 units). Changing the sidebearings of the o did affect other lowercase-to-lowercase and uppercase-to-lowercase at all sizes. This indicates that, indeed, InDesign uses the sidebearings of the lowercase o (and presumably the uppercase O) as a key to optical kerning for the Latin script.</p>"
