  html: |-
    <p>In doing some Googling for the recent spacing threads, I came across an intriguing project called <a href="http://www.iginomarini.com/ikern.html">iKern</a>, by the Italian engineer Igino Marini. He claims better results than InDesign, but of course I wanted to see for myself, so I took him up on his offer to generate spacing data for fonts sent in. <br> <br></p>
    <!--attachment: ccat_ikern_a-69778.pdf*mime_pdf.gif*application/pdf*25.4*iKern+vs+Adobe+InDesign%26%2339%3bs+optical+kerning*ccat_ikern_a%2epdf --><!--attachment: ccat_ikern_a-69778.pdf*mime_pdf.gif*application/pdf*25.4*iKern+vs+Adobe+InDesign%26%2339%3bs+optical+kerning*ccat_ikern_a%2epdf --><p></p><center><br>
    <table border="1">
    <tbody><tr>
    <td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf">iKern vs Adobe InDesign's optical kerning<br><a href="http://www.typophile.com/forums/messages/30/ccat_ikern_a-69778.pdf" target="_blank"><b>ccat_ikern_a.pdf</b></a> (25.4 k)</td>
    </tr>
    </tbody></table>
    <p></p></center><p></p>
    <!--/attachment--><!--/attachment--><p> <br> <br>I am <i>extremely</i> impressed. Please see for yourself. I believe that iKern achieves the evenness of gap spacing that Hrant favored from the InDesign sample, while avoiding the stem spacing irregularites so important at text sizes. It is taut where it needs to be taut (note especially the contrast for pairs such as vi and ty), but avoids overkerning round-diagonal pairs such as ovo and ex. <br> <br>Inigo writes that there are a number of tunable parameters in iKern, which would certainly broaden the palette if made available to skilled designers. Inigo also sent me a tight version that looks like it would be very good for display settings. <br> <br>Inigo is making iKern available as a no-cost service, but I think the technology is deserving of a much wider audience. It will be interesting to see to what extent the market encourages or impedes the development and deployment of superior technology. In any case, I encourage typophiles to check it out.</p>
