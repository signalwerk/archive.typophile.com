    html: "<p>Hello, Igino. I'm wondering if iKern is able to accept key spacing, i.e. manually set 'correct' spacing for e.g. <i>n</i> and <i>o</i>, which would not be altered by iKern and on which subsequent autospacing would be based? This is the one thing that seems to be missing from all autospacing/kerning algorithms I have looked at: the ability to set specific key values that will control the spacing. <br> <br>Have you tried iKern with any non-Latin writing systems?</p>"
