    html: "<p>&gt;a matter of such utter simplicity to build a rational spacing and kerning engine <br> <br>There is nothing rational about spacing: it's a question of aesthetic preference. When creating the algorithms which determine the \"optimized\" relationships in spacing software, the programmer makes decisions about what the important elements of typographic fit are, how to measure them, how they rank against one another, and what looks best. It's taste cloaked in geekspeak.  <br> <br>Ideally an autokerning device would have a number of sliders, so that Bill could move his 'o's closer together, for instance. But I don't think that most users would go for the hassle (the problem with MM), they'd probably prefer to have some extreme pre-sets, such as \"HHP Sauce\" or \"Shinola\".</p>"
    html_clean: "<p>&gt;a matter of such utter simplicity to build a rational spacing and kerning engine <br> <br>There is nothing rational about spacing: it's a question of aesthetic preference. When creating the algorithms which determine the \"optimized\" relationships in spacing software, the programmer makes decisions about what the important elements of typographic fit are, how to measure them, how they rank against one another, and what looks best. It's taste cloaked in geekspeak.  <br> <br>Ideally an autokerning device would have a number of sliders, so that Bill could move his 'o's closer together, for instance. But I don't think that most users would go for the hassle (the problem with MM), they'd probably prefer to have some extreme pre-sets, such as \"HHP Sauce\" or \"Shinola\".</p>"
