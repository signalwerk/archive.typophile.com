      <p><strong>"... can be analyzed visually"</strong></p>
      <p>Quotation from <a href="http://www.unicode.org/versions/Unicode6.0.0/ch09.pdf" title="www.unicode.org/versions/Unicode6.0.0/ch09.pdf">www.unicode.org/versions/Unicode6.0.0/ch09.pdf</a><br>
      (PDF page 5, printed page 270)</p>
      <p>Looking at "ई" and the repha hook of e.g. "Adobe Devanagari"</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/I0.jpg" title="http://www.sanskritweb.net/temporary/I0.jpg">http://www.sanskritweb.net/temporary/I0.jpg</a></p>
      <p>it seems to me that modern Devanagari font designers and even the authors of the Unicode manual think that the hook above "ई" is identical with the repha hook; hence the expression "can be analyzed visually" and hence the identical design of the hook above "ई" and the repha hook of e.g. the Adobe Devanagari font.</p>
      <p>However, looking at the historical development of the Devanagari script from the ancient Brahmi script to the modern Devanagari script, it seems apparent that e.g. the long vowel "ई" cannot be analysed visually as consisting of the short vowel "इ" plus the repha hook:</p>
      <p><a href="http://www.sanskritweb.net/temporary/I1.jpg" title="http://www.sanskritweb.net/temporary/I1.jpg">http://www.sanskritweb.net/temporary/I1.jpg</a><br>
      <a href="http://www.sanskritweb.net/temporary/I2.jpg" title="http://www.sanskritweb.net/temporary/I2.jpg">http://www.sanskritweb.net/temporary/I2.jpg</a><br>
      <a href="http://www.sanskritweb.net/temporary/I3.jpg" title="http://www.sanskritweb.net/temporary/I3.jpg">http://www.sanskritweb.net/temporary/I3.jpg</a></p>
      <p>The scans were drawn from IndoSkript (<a href="http://userpage.fu-berlin.de/falk" title="http://userpage.fu-berlin.de/falk">http://userpage.fu-berlin.de/falk</a>)</p>
