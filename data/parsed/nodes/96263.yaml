    <p><a class="freelinking external" href="http://www.unicode.org/versions/Unicode6.0.0/ch09.pdf" rel="nofollow">This Unicode document</a> contains the following paragraph :</p>
    <p>"<cite><strong>Vowel Letters.</strong> Vowel letters are encoded atomically in Unicode, even if they can be analyzed visually as consisting of multiple parts. Table 9-1 shows the letters that can be analyzed, the single code point that should be used to represent them in text, and the sequence of code points resulting from analysis that should not be used.</cite>"</p>
    <p>What do they mean by <cite>can be analyzed visually</cite> and <cite>sequence of code points resulting from analysis that should no be used</cite> ?</p>
  html_clean: |-
    <p><a class="freelinking external link-external" href="http://www.unicode.org/versions/Unicode6.0.0/ch09.pdf" rel="nofollow">This Unicode document</a> contains the following paragraph :</p>
    <p>"<cite><strong>Vowel Letters.</strong> Vowel letters are encoded atomically in Unicode, even if they can be analyzed visually as consisting of multiple parts. Table 9-1 shows the letters that can be analyzed, the single code point that should be used to represent them in text, and the sequence of code points resulting from analysis that should not be used.</cite>"</p>
    <p>What do they mean by <cite>can be analyzed visually</cite> and <cite>sequence of code points resulting from analysis that should no be used</cite> ?</p>
