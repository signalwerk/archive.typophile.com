      <p>Let's assume you read this:</p>
      <p><strong>The Latin letter "w" is encoded atomically by Unicode, even if it can be analyzed visually as consisting of "v" + "v".</strong></p>
      <p>An Indian will answer:</p>
      <p>"w" is an akhand letter unsplittable into any components (e.g. "v" + "v"), just like "आ" is an akhand letter unsplittable into any components.</p>
      <p>Another example:</p>
      <p>"&amp;" is not split by Unicode into any components (e.g. "e" + "t"). "&amp;" is "akhand", i.e. unsplittable. The same is true for "ई", which is not split into any components. Who learns the alphabet at school, learns all this.</p>
