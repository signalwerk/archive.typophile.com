      <p>I think I've got the answer already : the paragraph says basically that, in case of the vowel आ (AA), one should use the Unicode code U+0906 instead of combining the characters अ (A) U+0905 with ा  U+093E. For instance, if you try this last alternative in MS Word, the combination of the two characters is not obtained. They are just printed one after the other.</p>
      <p>What I don't understand is why Unicode has to bother highlighting this. Isn't this an issue that should be handled by a specific font ?</p>
