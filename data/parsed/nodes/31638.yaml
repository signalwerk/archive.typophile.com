      <p>First off you may have a serious medical condition that may need to be checked by physician- Carpal Tunnel Syndrome, Tendonitis, or something worse.</p>
      <p>I would suggest to relax your grip on what ever tool you are using- mouse or otherwise. Soft click as opposed to hard ones. Make hard fists every so often. Wiggle your fingers and take stretch breaks too.</p>
      <p><a href="http://en.wikipedia.org/wiki/Repetitive_strain_injury" title="http://en.wikipedia.org/wiki/Repetitive_strain_injury">http://en.wikipedia.org/wiki/Repetitive_strain_injury</a></p>
      <p>Also you may consider consulting with an expert in office ergonomics... its a tax write off for sure and these people can help you situate your office in way that will be more productive and healthy for you..</p>
      <p>I live with chronic pain too ( not from computers ) so I can relate to how you feel. I hope you find a way to ease your symptoms.</p>
      <p>Mikey</p>
