    html: <p>I love my mouse... it’s not necessarily about a mouse per se but a holistic combo of what sort of mouse it is, how you use it, click speeds, movement speeds across the screen, how high you are relative to your desk, how straight/bent your arm is, how far you are form your screen etc. I’m left-handed but still use right handed button settings - works for me. Sorry, not very helpful.</p>
