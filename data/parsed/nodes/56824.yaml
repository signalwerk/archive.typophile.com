    <p>I need some guidance on the Avenir typeface and I guess the Frutiger System:</p>
    <p>An agency have mocked up some web designs for us using a non system standard font as a headline: Avenir Book 45.</p>
    <p>Not withstanding the issues of not being able to use it as live text, can I use '45' at variable sizes for print and if so is it a case of the layout package resizing it as obviously '45' should be of a fixed size and weight?</p>
    <p>There's no way my company will shell out for the updated whole family (Avenir Next is £850) If resizing Book 45 to big sizes for exhibition stands etc is not going to work, can anyone suggest a decent system font (apart from Helvetica and it's Knock-off Arial) that I could use instead and thus avoid all of these issues?</p>
    <p>Thanks a lot,</p>
    <p>Owen</p>
