      <p>Relax! You can use 45 for what ever size you want. The number used in a font is a concatenation of two numbers. The first set defines weight, while the second defines width and position. The 45 refers to it's weight, width and style. 4 means it's light (or book), and 5 that it is of normal width, and 5 being an odd number that it is an upright (roman) design. If the second number is even, it's a oblique style.</p>
      <p>More here: <a class="freelinking external" href="http://en.wikipedia.org/wiki/Univers" rel="nofollow">http://en.wikipedia.org/wiki/Univers</a></p>
