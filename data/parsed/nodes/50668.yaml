    date: 2008-10-19T15:08:00
    date_raw: 19 Oct 2008 — 3:08pm
    votes: null
    html: |-
      <p>Create 2 classes for your lookups. One could be called @All and include all letters including the space. The other can be called @Letters and include all letters, but no space.</p>
      <p>Sample:</p>
      <p>lookup calte_start1 {<br>
      ignore sub @All e';<br>
      sub e' @Letter by e.start;<br>
      } calte_start1;</p>
      <p>Stephen</p>
