  html: |-
    <p>Hi,<br>
    Let's say I want a substitution except after a space or at the beginning of the line.<br>
    I write something like this:</p>
    <p>lookupflag IgnoreMarks, RightToLeft;<br>
        ignore sub space A';<br>
        sub A' B by C;</p>
    <p>How do I include the beginning of the line in the 'ignores'?</p>
