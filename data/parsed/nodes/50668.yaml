      <p>Oh the font is big but it's not professional. Actually it is intended mostly for the web. It already gives a heavy workout to the CPU just by being Arabic! I try to trim down everywhere I can.<br>
      In my specific case, I think I'll use your solution but backward. I skip the 'ignore' thing and for my substitution, I create a class after which it will be applied. The list of glyphs in that class will be much much shorter than 'everything else' class.<br>
      But it's odd that OT doesn't have a specific solution for the beginning and the end of the line.<br>
      -B</p>
