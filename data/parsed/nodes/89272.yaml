    <p>I hereby fancy to announce with some little joy the release of <strong>Rosenbaum</strong>, my recent exploration of the Didone uncial blackletter genre. ;-)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rosenbaumbanner_1_4198.gif"></div><p></p>
    <p>Well, it was Christmas time and I relaxed a bit …</p>
    <p>Maybe you’ll find this a kind of<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/rosenbaumbanner_3_5536.gif"></div><p></p>
    <p>Or maybe you just find it somewhat … tasty.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rosenbaumbanner_6_4092.gif"></div><p></p>
    <p>But maybe you just find it silly and awkward, then don’t bother.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/rosenbaum/" rel="nofollow">Rosenbaum</a> at Myfonts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rosenbaum_e_6324.gif"></div><p></p>
