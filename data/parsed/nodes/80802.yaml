      <p>My hunch is that’s a customised Copperplate (or even Sackers/Engravers) Gothic.<br>
      As a starting point, both Sweet Gothic Serif and ITC Symbol have a more similar G, but the first has more contrast, while the other isn’t as wide.</p>
