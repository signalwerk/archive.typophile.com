  html: |-
    <p>I have currently updated my Helsinki typeface, expanded the character set, and also added italics. Helsinki is inspired by the Finnish traffic sign typeface. It is based on geometric shapes and quite narrow, which makes it well suited to headlines and short texts.</p>
    <p>Now Helsinki Webfonts are also available. I made this little demo page, to show the fonts in action: <a href="http://helsinki.ludwigtype.de" title="http://helsinki.ludwigtype.de">http://helsinki.ludwigtype.de</a></p>
    <p>Enjoy, Ludwig</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/helsinki_example_4001.png"></div><p></p>
