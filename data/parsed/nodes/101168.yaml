      <p><a class="freelinking external link-external" href="http://www.cl.cam.ac.uk/~mgk25/ucs/quotes.html" rel="nofollow">http://www.cl.cam.ac.uk/~mgk25/ucs/quotes.html</a></p>
      <p>but as you can see, this situation is a changed compared to long-established usage... and not just in the X Window System either, but in countless ASCII terminals.</p>
