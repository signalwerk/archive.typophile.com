      <p>Hrant: <em>Just so I'm clear: Is an apostrophe in text always encoded as a RIGHT SINGLE QUOTE MARK?</em></p>
      <p>No. Very often it is encoded as the generic U+0027. I'm guessing that's probably the most common encoding simply because that's what the keyboard makes convenient. In order to encode U+2019, whether as apostrophe or quote mark, one either needs to input it directly (ALT+0146 on Windows, custom keyboard, etc.) or rely on 'smart quote' algorithms, which work a lot of the time and provide work for proofreaders the rest of the time.</p>
      <p><em>What are the chances somebody would write a Word and/or InDesign plug-in that goes through a text and changes the "intended apostrophes" to U+02BC?</em></p>
      <p>I think you could expect such a plug-in to be about as accurate as smart quote algorithms. In other words, it would get it right almost all the time, but would get it wrong in some ambiguous circumstances. As Joe rightly points out, it is likely to get it wrong more often in British usage.</p>
