      <p>Actually it would be nice to have a proper apostrophe code point, simply because an apostrophe is not a quote! They have a different meaning. Just because writers and typographers have been too lazy to show a difference doesn't mean they never will. Remember, some people like quotes to point in a different direction than an apostrophe (not to mention the size potentially being different). I personally believe the ideal closing quotes point upward (and inward) and have in fact made a font like that (Cristaal). Nobody <em>has</em> to do that, but not having an apostrophe code point obstructs that choice.</p>
      <p>hhp</p>
