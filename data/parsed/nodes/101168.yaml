      <p>John (Q):</p>
      <blockquote><p>Back in the old days of ASCII, U+0060 was a grave accent only to the same extent as U+0022 was an umlaut and U+0027 was an acute accent. That is, one possible unconventional coding was to overstrike those characters, and have their shape altered on sophisticated systems, or their meaning recognized by humans for output fr0m unsophisticated ones, to attain accents.</p>
      <p>That this exotic coding is now claimed as the primary meaning of the character in the Unicode standard... is, I suppose, possible, but if so it does not give me great confidence in the committee responsible.</p></blockquote>
      <p>You are confusing things by referring to U+0060, U+0022, etc. and then talking about ASCII. The prefix U+ indicates a Unicode codepoint, i.e. a character in the Unicode Standard, not some other standard. So it makes no sense to talk about e.g. U+0060 'back in the old days of ASCII'. The Unicode 'C0 Controls and Basic Latin' block provides a one-to-one mapping of Unicode characters to ASCII characters, which is not the same thing as <em>being</em> the ASCII standard. As you say, the ASCII standard deliberately enabled the interpretation of some codes as representing multiple characters. A principal -- and principle -- goal of Unicode's larger character set was to avoid such confusions, so I think the UTC was eminently sensible and responsible in assigning only one meaning to the Unicode character U+0060, allowing the other interpretations of the corresponding ASCII code to have their own unique Unicode assignments. I also think they made the right choice in selecting the spacing grave as the identity of this character given that the same block includes a corresponding spacing acute character, and the single quote character is handled as deliberately direction agnostic in almost all software -- note as a 'right single quote' and as a vertical glyph in almost all fonts, and there would be in any case no corresponding 'left double quote' if U+0060 were interpreted as a 'left single quote'.</p>
      <p>I still occassionally get emails from people that are punctuated like `this'. It is so obviously a mistake, I have to wonder what combination of software and font they might be using that doesn't display it as such, or if they are blind.</p>
