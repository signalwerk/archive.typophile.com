      <p>U+0027 is a deliberately ambiguous character intended to represent a left quote, a right quote and an apostrophe. It reflects the fact that computer keyboards typically follow typewriter keyboards -- as opposed to, say, typesetter keyboards --, and these had only one ' key. I don't consider U+0027 to be a character at all in the sense of something to be displayed as a text entity; I consider it a (not very good) input mechanism for other characters.</p>
      <p>Nick: <em>Isn’t it about time the poor apostrophe had its own Unicode?</em></p>
      <p>It already has two. U+2019 is the right quote character that, following writing practice, is normally indistinguishable from the apostrophe, hence Unicode's annotation that this is the preferred apostrophe character on the grounds that, unlike U+0027, it actually looks like an apostrophe. The other apostrophe character is U+02BC, but as André notes this is properly used only in some forms of transcription where it typically indicates a glottal stop.</p>
      <p>Is there a need for an apostrophe character distinct from the right quote character? I don't think so: written and typographic practice is for these two characters to be identical, and I can't think of any behaviour distinctions. The problem is not lack of a separate codepoint for apostrophe, but the general shittiness of keyboard layouts derived from typewriters and the inability of 'smart' quote substitution to handle all the instances in which the input mechanism U+0027 needs to be displayed as U+2019.</p>
