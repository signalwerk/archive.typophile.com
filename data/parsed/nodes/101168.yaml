      <div class="comment-spam-body"><p>I reading a language like German, which does not use the apostrophe for possessive nouns,  I generally have no difficulty in understanding that when a noun ends in an _s_ I should expect it to be possessive.</p>
      <p>But, unlike English, German does not rely on the terminal _s_ to state that a noun is plural -- plural nouns are preceded by _die_ and generally have a different ending than the singular noun. However the preceding _die_ can also be confusing because the same _die_ is used for feminine nouns. This is only the tip of the iceburg in the complexity of German syntax, which is a barrier to persons attempting to learn German, although probably minor compared to the uncertainty of a run-on sentence that waits for the action verb to finally be disclosed at its conclusion. By comparison, English is a walk in the park -- nouns lack any attribute of gender and the verb usually pops up near the start of a sentence.</p>
      <p>The moral for the grammar of various languages is that there is no free lunch.  Simplification fights with complexity, formal consistency, unambiguity etc.</p>
      <p>In English, _Johns school_ means a school for Johns, i.e. a school to re-educate men who purchase the services of sex-trade workers, while _John's school_ means the school that John attends, or owns.</p>
      <p>I suppose, that in English at least, we are stuck with continuing to use the apostrophe.</p>
      <p>Don</p>
      </div>
