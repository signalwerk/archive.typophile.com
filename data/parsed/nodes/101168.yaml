      <p>Hrant: <em>Actually it would be nice to have a proper apostrophe code point, simply because an apostrophe is not a quote! They have a different meaning.</em></p>
      <p>Unicode does not encode semantics, it encodes text entities. This $ has a different meaning in various countries, despite often having the same name, but is a single character.</p>
