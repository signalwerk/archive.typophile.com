      <p>Unicode does not encode glyphs, and so each Unicode point actually does represent a "meaning". So f, f, and i can become the ffi ligature, Arabic letters appear only once, and so on.</p>
      <p>In ASCII, U+0027 is supposed to be the apostrophe and closing quote, and U+0060 is supposed to be the opening quote. In practice, though, U+0027 was available before U+0060, since that character was only added when lower-case was added to ASCII, so the practice of using U+0027 like the symmetrical symbol on a typewriter was well established.</p>
      <p>So there ought to be a <em>different</em> Unicode codepoint for the cases where one actually <em>wants</em> the typewriter-style symbol!</p>
      <p>On the other hand, U+0022 is <strong>officially</strong> a typewriter-like ambiguous double quote. So single and double quotes are handled very differently in the basic 256-character set. On the other hand, guillemets are handled properly in Unicode.</p>
      <p>This is a mess, and the response has been for each operating system and application to handle U+0027 in whatever way fits its own needs. Since the "right" Unicode character is usually one that our keyboards won't let us type, I don't know if this can be "fixed" in a way that won't just make things worse.</p>
