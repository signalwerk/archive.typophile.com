      <div class="comment-spam-body"><p>The best use of U+0027 -- the single quote -- can vary with the type of font.<br>
      For a connected script I can't think of any other use than as the apostrophe.<br>
      If one sets the character width of U+0027 to zero  it can be used for an apostrophe that does not interrupt the smooth connections between the letters of the script.<br>
      The following is a connected script, as typed, with no kerning, no contextual alternates or ligatures. </p><div class="imageWrap"><img src="http://typophile.com/files/Punctuation1_4789.jpg"></div><br>
      The idea here is to distinguish the apostrophe from both single and double quotes as much as possible and reduce the ambiguity faced by the reader when apostrophe, single and double quotes are stacked together.<br>
      Don<p></p>
      </div>
