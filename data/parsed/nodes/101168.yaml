      <p>@John Hudson:<br>
      <cite>U+0060 is a spacing grave accent</cite></p>
      <p>Back in the old days of ASCII, U+0060 was a grave accent only to the same extent as U+0022 was an umlaut and U+0027 was an acute accent. That is, one possible unconventional coding was to overstrike those characters, and have their shape altered on sophisticated systems, or their meaning recognized by humans for output fr0m unsophisticated ones, to attain accents.</p>
      <p>That this exotic coding is now claimed as the primary meaning of the character in the Unicode standard... is, I suppose, possible, but if so it does not give me great confidence in the committee responsible.</p>
      <p>On the other hand, I <em>will</em> admit that U+005E was changed from an exponentiation symbol or up-arrow to a spacing caret back when ASCII-64 gave way to ASCII-68 (and lowercase was added). So this trend could indeed have continued when Unicode came along.</p>
      <p>However, it does appear you are basically right, the story being made plain here:</p>
      <p><a class="freelinking external" href="http://www.cl.cam.ac.uk/~mgk25/ucs/quotes.html" rel="nofollow">http://www.cl.cam.ac.uk/~mgk25/ucs/quotes.html</a></p>
      <p>but as you can see, this situation is a changed compared to long-established usage... and not just in the X Window System either, but in countless ASCII terminals.</p>
