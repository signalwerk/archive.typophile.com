      <p>Just noticed this earlier comment:</p>
      <p>Hrant: <em>BTW auto-quotes also mess up the Hawai‘ian ‘okina diacritic.</em></p>
      <p>The proper character for this really should be U+02BB MODIFIED LETTER TURNED COMMA, but I'm sure it occurs encoded in many instances as either U+0027 or U+2018, and doubtless also U+2019 whether as the result of smart quote algorithms or ignorance.</p>
      <p>I wouldn't classify it as a diacritic: it represents a glottal stop, which means it is a full consonant and considered a letter in the alphabet. And to be fair to the ignorant, in other orthographies the ’ is much more commonly found as a glottal stop than the ‘ shape.</p>
