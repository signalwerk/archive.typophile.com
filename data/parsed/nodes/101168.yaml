    html: |-
      <p>Hrant: <em>Also, would German-localized versions of the quote glyphs solve the problem, or are language tags not well-supported?</em></p>
      <p>They are unevenly supported. Also, punctuation substitutions are unreliable in OpenType because there is a tendency in some software not to roll punctuation into glyph runs with adjacent text. Remember, OpenType Layout proceeds from script to language system to glyph, but the decision about what constitutes a character in a given script is made by the software, not by the font. Since a lot of punctuation is script-neutral, it can only pick up a script identity by algorithmic analysis of adjacent or surrounding text content. But that doesn't happen everywhere, while some software might simply presume common punctuation characters = Latin, which might help your German quote situation,  but is a pain in the neck when trying to e.g. kern tall Thai vowels to preceding quote marks or parentheses!</p>
      <p>With regard to the German quote issue, the desirable form of the 'left quote' U+2018, i.e. the German closing quote, is a 180 degree rotated and raised form of the opening baseline quote with which it corresponds.</p>
