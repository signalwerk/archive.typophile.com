      <div class="comment-spam-body"><p>Impressive list of the guillemet-o-sphere.<br>
      To shift emphasis from quotes back to the apostrophe, it's interesting to observe that the appropriate use of the apostrophe is moot in places like Québec where the language police prosecute and obtain convictions against businesses that use apostrophes in their signs.<br>
      Perhaps the use of the apostrophe is another anglophone exceptional case?<br>
      English certainly has picky rules about the use of the apostrophe. In the sentence above I used an apostrophe to show the contraction of "it is" but I would not have used it to show that something is possessed by "it." I would have been required to use the formula: The Sahara is hot, its climate is also dry.<br>
      Don</p>
      </div>
