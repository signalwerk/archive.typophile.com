    html: |-
      <p>I'll have to admit that the fact that the posessive "its" doesn't take an apostrophe is annoying to me, since that means the pronoun it doesn't follow the same rules as ordinary nouns.</p>
      <p>That it would happen to be spelled exactly the same as the contraction for "it is", though, doesn't bother me, as context makes it unambiguous in any case (or there would be a problem with the two words in speech).</p>
      <p>However, at one point, I proposed that a period might be used in the middle of a word to indicate where two vowels together are two separate vowel sounds instead of a dipthong - so that one didn't have to use the apostrophe for that purpose as well, as in Mont Follick's proposed phonetic spelling. So using a different unambiguous character for the possessive isn't a <em>bad</em> idea; of course, the problem is that we don't have any suitable alternate characters conveniently available.</p>
      <p>That is, something like Bill"s tricycle, or Bill,s tricycle, or Bill/s tricycle would be too jarring and too visually distracting... and Bill`s tricycle works on computer keyboards, but not on classic typewriters.</p>
      <p>Bill(s) tricycle wouldn't do either as that construction has a different, existing meaning. Of course, there are other constructs... BillS tricycle? Maybe with a small capital S in print... Bill:s tricycle? Bill-s tricycle?</p>
      <p>Of course, we could stick with Bill's tricycle in ordinary typing, and in print, where there are more character choices, do the posessive this way: Bill′s tricycle, with a prime, to indicate we're not using an apostrophe to dig into the word to remove a letter.</p>
      <p>When a word ends in s, whether or not it is a plural, an apostrophe following the s indicates the possessive, although one can omit the apostrophe if one uses the noun as an adjective - English, without case endings and a drastically simplified verb conjugation, lends itself to functional change.</p>
