      <p>Hrant: <em>John, is producing examples of precedents the only way to achieve disunification? What about if I could robustly explain the future benefits?</em></p>
      <p>Providing examples of existing use is by far the easiest means to get any character encoded in Unicode. In the case of disunifications, the bar is higher than for new characters, because stability is one of the principle goals of any technical standard. In the case of Unicode, stability can also be a strict requirement due to signed agreements with other standards organisations that rely on Unicode not changing certain things. So, for example, Unicode has agreed with the <a href="http://www.ietf.org/" rel="nofollow">IETF</a> not to introduce any more characters with canonical decompositions. Some disunifications are likely to be subject to such agreements.</p>
      <p>Really, I think your idea is likely a non-starter, because you're talking about disunifying characters that have been part of ASCII or ANSI for a heck of a long time. This is the sort of stuff that software developers consider core library stuff that no one has had to think about for decades. With regard to 'future benefits', pushback is much more likely to focus on future disruptions.</p>
