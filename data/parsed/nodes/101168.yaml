      <p><cite>For a while -thanks largely to ATF- mirrored quotes (where the left quotes point down) were quite common</cite></p>
      <p>I thought that this depended on the typeface. In Bodoni, the left quote is a mirrored right quote, but in most other typefaces the left quote points up. So we're dealing with stylistic variants of the <em>same</em> character, which</p>
      <p>a) must not be given separate Unicode codepoints (from one another), and</p>
      <p>b) means that the left quote character cannot be relied upon to be either up-pointing or mirrored down-pointing.</p>
      <p>Which, incidentally, explains why the character used for the glottal stop in Hawai‘i <strong>must</strong> have a separate code point.</p>
