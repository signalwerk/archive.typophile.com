      <p>Strictly speaking, I believe U+0027 <em>is</em> the apostrophe.  It's only typists' convention (and the limitations of ASCII) which causes most word processors to use it as a synonym for the right single quote.</p>
      <p>I see the Unicode standard describes U+2019/right single quote as also being the 'preferred' apostrophe character (goodness knows why), but it doesn't change that U+0027 is the character officially assigned as the apostrophe...</p>
