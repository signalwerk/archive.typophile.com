      <p><em>...each Unicode point actually does represent a "meaning"</em></p>
      <p>No. Meaning is semantic content of language. Writing systems capture various aspects of language as text, but outside of the Chinese ideographic system semantics are generally the least commonly captured aspect of language (English orthography only captures semantics via some punctuation, notably in the distinction between <em>its</em> and <em>it's</em>, i.e. a distinction of meaning that is phonetically absent).</p>
      <p>Unicode encodes text entities for plain text processing, which means, as you note, that it does not usually encode glyph variants (ironically, the two examples you give of ffi ligature and Arabic positional forms are exceptions, since these have encoded presentation forms for backwards compatibility). But not encoding glyph variants does not mean that what Unicode encodes is <em>meaning.</em> Even in the case of East Asian ideographs, what Unicode encodes are the text entities needed for plain text processing, not the meaning of the characters (obviously, since some characters have multiple meanings or have diverged in their meaning in different cultures).</p>
      <p><em>In ASCII, U+0027 is supposed to be the apostrophe and closing quote, and U+0060 is supposed to be the opening quote.</em></p>
      <p>U+0060 is a spacing grave accent, and is clearly identified as such in the Unicode Standard. It is not an opening quote and is not intended to be used as such. [BTW, there is no such thing as an 'opening quote' character outside of the conventions of particular punctuation systems. The 'left quote' character is a closing quote in the German system.]</p>
