      <div class="comment-spam-body"><p>Perhaps the reader who is not a typoguru does not notice any of the fine points such as whether right quotes point up or down, but merely wants to avoid being confused by a proliferation of little marks around and within the words. Bad enough in a language like English which has few accents, but a real jungle where the Latin alphabet is encrusted with accents such as Polish or Vietnamese.<br>
      As for guillemets, they meet the distinctiveness test, but to the non-francophone world may not be recognized as quotes, and could be seen -- at least by anglophone readers -- as meaning double larger and double smaller.<br>
      Well, it's time for a nap in the famous bed of the ancient Greek Procrustes.<br>
      Don</p>
