      <p>@John Hudson:<br>
      On considering the matter more, I can see that the Unicode Consortium decision probably was quite reasonable.</p>
      <p>I didn't want to start referring to Unicode ' as U+0027 and ASCII ' as X'27' as that would confuse people.</p>
      <p>Since ' was used as the only quote much more than ` and ' were used as paired quotes - ` was, and is, so little used that I kind of wish that codepoint were used for, say, the degree symbol - I can somewhat see the logic of using ` for a grave accent.</p>
      <p>But that just felt wrong, simply because accents were far to exotic to be part of the primary 7-bit ASCII set. I also felt that ^ should never have been changed from the up-arrow, so useful as an exponentiation operator.</p>
      <p>Thus, when ISO 8859-1 came along, with all those accented letters, but without desperately needed symbols such as ≤, ≥, and ≠, I could only wonder what they were thinking. (On the other hand, placing × and ÷ on codepoints obviously more suitable for Œ and œ simply further compounded the insanity in the opposite direction. After all, * and / were perfectly good for multiplication and division, unless one was writing grade school arithmetic textbooks.)</p>
      <p>Of course, the whole world doesn't speak English. So a character set like ISO 8859-1 was indeed a good idea. But it should have been the -2 set, as it were, in my opinion. There already were alternate versions of 7-bit ASCII for the major European languages; what would make sense from my perspective would have been to allow any of those to have a supplementary set of high-bit characters bolted on. (And, thus, characters likely to be replaced - @, [, \, ], ^, _, `, {, |, }, ~ - would end up being copied/moved to the high-bit side) since, in general, after all, people only use one language at a time.</p>
      <p>And people who speak different languages clearly aren't able to communicate with each other, and so having the same character coding for areas where different languages are spoken... could wait until we went to 16 bits with Unicode (although, again, a set like 8859-1 for the specialized and exotic purpose of international communication certainly would be of <em>some</em> use).</p>
      <p>Of course,  strange to relate, in Continental Europe, people don't share the view of people living in, say, North America or Australia that anyone who speaks a different language either lives thousands of miles away or is a poor immigrant who is going to be learning your language instead of the other way around - because of the disparity in the economic value of the effort required.</p>
