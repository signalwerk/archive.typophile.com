      <p>Letters:<br>
      ʹ — U+02B9 Modifier Letter Prime<br>
      ʻ — U+02BB Modifier Letter Turned Comma<br>
      ʼ — U+02BC Modifier Letter Apostrophe<br>
      ˊ — U+02CA Modifier Letter Acute Accent<br>
      ˋ — U+02CB Modifier Letter Grave Accent</p>
      <p>Puncutation:<br>
      ' — U+0027 Apostrophe<br>
      ‘ — U+2018 Left Single Quotation Mark<br>
      ’ — U+2019 Right Single Quotation Mark<br>
      ′ — U+2032 Prime<br>
      ‵ — U+2035 Reversed Prime</p>
      <p>Symbols:<br>
      ` — U+0060 Grave Accent<br>
      ´ — U+00B4 Acute Accent</p>
      <p>The Unicode standard defines these three categories according to their expected behaviours in various writing systems and other forms of written communication (math, etc.). Letters are alphabetic elements, like the use of ʻ U+02BB Modifier Letter Turned Comma in Hawaiian to represent the glottal stop /ʔ/. Punctuation is an element that is paralinguistic, used for indicating textual phenomena that are not necessarily part of the spoken language. (So e.g. commas have an associated intonation contour in English, but commas don’t always occur where this intonation is found in speech and vice versa. The previous sentence is an example.) Symbols are something else entirely, and are kind of hard to define I guess.</p>
      <p>There’s a pretty good argument to be made for the use of ʼ U+02BC Modifier Letter Apostrophe in English where we use apostrophes for contraction and possession: ‹ donʼt › and ‹ dogʼs ›. It is in essence an orthographic element that distinguishes different lexical items, and that’s what we usually think of as a “letter” even though the apostrophe doesn’t have an independent sound of its own. But it’s hard enough to get people to use ’ U+2019 Right Single Quotation Mark instead of ' U+0027 Apostrophe, so that asking people to differentiate the quotation ’ and letter-apostrophe ʼ is just tilting at windmills.</p>
      <p>As for rock ’n’ roll, I think it’s best with the two apostrophes pointing the same way. Logically they are both apostrophes and not quotation marks, and English doesn’t have an apostrophe that points in the other direction. (Actually I don’t think any LGC orthography does, but I could be wrong). Writing ‹ rock ‘n’ roll › makes me think at first that the ‹ n › is being scare-quoted.</p>
    html_clean: |-
