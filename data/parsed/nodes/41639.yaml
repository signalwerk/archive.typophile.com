    html: |-
      <p>You could probably recreate this with quarter circles and rectangles. The ID seems to be 1 unit, the OD 2 units, and the width of the rectangles 1 unit. You'd have to guess with the little connector bits. It's hard to tell if there's any optical correction where curve meets straight.</p>
      <p> - Lex</p>
