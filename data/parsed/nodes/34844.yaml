  html: <p>For an exhibit of the work Matthew has done for Microsoft over the years I’d like to collect some interesting and unusual uses of theses fonts beyond the usual web, and on-screen use. For example Tahoma in Dutch passports seems a wonderfully out of place usage given the country’s own type design heritage. Any examples you could share, or loan (pics or the real thing) would be appreciated. Heck, I’ll even throw in a prize for the most obscure!</p>
