      <p>Can't believe I forgot Del Monte!</p>
      <p>At lunch today I had a quick look around a couple of local grocery stores. Here are the ones I found:</p>
      <p>Vika crispbread (bordeline, I guess):<br><a href="http://www.vika-brod.se/Vika%20prima.jpg">http://www.vika-brod.se/Vika%20prima.jpg</a></p>
      <p>Bavaria Blu cheese:<br><a href="http://www.bergader.de/en/bavaria-blu-fitness.jpg">http://www.bergader.de/en/bavaria-blu-fitness.jpg</a></p>
      <p>Bratwurst from Scan:<br><a href="http://www.matservice.se/bilder/stora/7300206706007.jpg">http://www.matservice.se/bilder/stora/7300206706007.jpg</a></p>
      <p>Casademont, spanish meat products (C logo only):<br><a href="http://1.bp.blogspot.com/_N9ZPQXIJcCI/S7EmOP4JuzI/AAAAAAAAAKk/R4mQLKGfEy0/s1600/casademont.JPG">http://1.bp.blogspot.com/_N9ZPQXIJcCI/S7EmOP4JuzI/AAAAAAAAAKk/R4mQLKGfEy...</a></p>
      <p>Ålands Kastelholm cheese (Okay, not blackletter, but I thought it interesting to include anyway):<br><a href="http://www.aca.ax/files/kastelholm.png">http://www.aca.ax/files/kastelholm.png</a></p>
      <p>El Antiguo brand Turrón:<br><a href="http://www.oliveria.com.au/Uploads/oliveriaWebImg_0088_Layer_73.jpg">http://www.oliveria.com.au/Uploads/oliveriaWebImg_0088_Layer_73.jpg</a></p>
      <p>This one is nice - half way between a contemporary reimagining of a blackletter and a script, I wish I knew what it was; Minas Mljevena coffe:<br><a href="http://www.minas-world.de/Minas-Mljevena.png">http://www.minas-world.de/Minas-Mljevena.png</a></p>
      <p>And a brand of spirits I just thought of, Hungarian Vilmos Körte palinka:<br><a href="http://www.magyarbeszallitok.hu/images/product/vilmos-mezes-agyas-korte.jpg">http://www.magyarbeszallitok.hu/images/product/vilmos-mezes-agyas-korte.jpg</a></p>
