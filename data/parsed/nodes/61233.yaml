      <p>There are sets that offer real value (combining several swatch books at a lower cost than the combined total for separate ones). </p>
      <p>IMO the bare minimum a designer should own is:<br>
      formula guide solid uncoated<br>
      same coated<br>
      4-colour process guide coated (EURO when in Europe)<br>
      same uncoated</p>
      <p>Less imminent, but nice to have: formula guide solid matte</p>
      <p>And guess what? There is a nice case with all of these PLUS<br>
      color bridge coated — which has rgb/html/cmyk with cmyk and pms-samples<br>
      added as a bonus.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
