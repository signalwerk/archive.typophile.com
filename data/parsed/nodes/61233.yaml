    html: |-
      <p>Definitely a Solid to Process coated. It shows on one side, the solid ink, and as CMYK on the other. There is a big difference in some colors printing CMYK versus spot color. You might consider getting a uncoated too, cause ink on a uncoated paper look much darker &amp; duller, cause the ink soaks into the paper instead of laying on top of it. If you want to go all the way, get a metallic book and pastel book too. </p>
      <p>If you’re plugged in with a commercial printer you might be able to get free ones from them, especially if you send a lot of business their way. Get hold of a print salesman, they will do anything for a commission. We used to get new books every year until the economy went down the crapper. It’s recommended (by Pantone) that you get a new book every year, but lets be real...</p>
      <p>They have this new GOE system that Pantone is pushing, but I’ve not heard of anyone yet using it here in the USA. Maybe cause a lot of printers have folded, and printers in general, are resistant to change. Maybe cause of the sweatshop mentality of management from predigital? You would be surprised how many pothead printers there are still out there too, but I’m rambling on...</p>
