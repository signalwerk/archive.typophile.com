    <p>So, I’m finally going to upgrade my Pantone books—I’ve had mine for so long, I have no idea what to buy now—there are so many Pantone products. For a freelance print designer, what is the standard set these days? My current set is just the solid chips: coated and uncoated.</p>
    <p>Are there any Pantone do-it-all books that have the solid chips, as well as CMYK and RGB formula equivalents?</p>
    <p>TIA,<br>
    Jean</p>
