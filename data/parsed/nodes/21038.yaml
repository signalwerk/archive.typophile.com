    <p>Can anyone confirm that RoboFab is built into studio 5 for mac. </p>
    <p>I tried this very simple code and it errored out.</p>
    <p>from robofab.world import CurrentFont<br>
    font = CurrentFont()<br>
    print font</p>
    <p>perhaps it is left over 4.6 code that is incompatible or something. I dunno. Could really do with getting my head around this stuff.</p>
