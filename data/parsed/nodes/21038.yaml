      <p>Dux, </p>
      <p>RoboFab is not built into FontLab Studio 5. You need to download and install it from <a href="http://www.robofab.org/" title="http://www.robofab.org/">http://www.robofab.org/</a> </p>
      <p>We have plans to integrate it into a later version of FontLab Studio. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
