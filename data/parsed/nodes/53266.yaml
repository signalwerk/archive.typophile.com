    html: <p>I saw the original Gill drawings for this series in a folder in the Monotype Type Drawing Office. From what I can remember it was not very good. To say it was like Optima would be giving it too much credit, probably closer to Albertus in its design. My last view of it was over 20 years ago, perhaps someone from Monotype can tell what has become of the originals.</p>
