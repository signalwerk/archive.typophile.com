      <p>This is Stellar, from the American satirical magazine <em>Ballyhoo</em>, Feb. 1932.<br>
      Printed rotogravure with dark brown ink. Not sure how white the stock was originally.<br>
      The text is in Vogue, an American Futura clone with a less austere "a" and really big dots on the "i".<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Stellar_4130.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Stellar2_6468.jpg"></div><p></p>
      <p>Speaking of presaging, this spoof has something of the famous DDB Chivas ad (art directed by Helmut Krone) that heralded the "Creative Revolution" of 30 years later.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/chivas_4691.jpg"></div><br>
      Set in Caslon, but the type treatment is not too much different than the way he handled Futura in the VW ads.<p></p>
