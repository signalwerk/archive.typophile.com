      <p>As far as this proposed face's "looking forward" to Optima, it may also be worthwhile to look backward a few years to R. Hunter Middleton's Stellar, cut for the Ludlow Typograph.</p>
      <p>It is an interesting progression from Stellar to series 430 to Optima. The idea of the stressed sans was certainly in the air among typeface designers and manufacturers.</p>
      <p>There are a few takes on Optima available today:</p>
      <p><a href="http://new.myfonts.com/fonts/spiecegraphics/stellar-classic-sg/" title="http://new.myfonts.com/fonts/spiecegraphics/stellar-classic-sg/">http://new.myfonts.com/fonts/spiecegraphics/stellar-classic-sg/</a><br>
      <a href="http://new.myfonts.com/fonts/agfa/stellar/" title="http://new.myfonts.com/fonts/agfa/stellar/">http://new.myfonts.com/fonts/agfa/stellar/</a></p>
      <p>Thanks very much to Craig and Dan for sparking this look at the Gill project.</p>
      <p>powers</p>
