    <p>In my copy of <em>Twentieth Century Type Designers</em>, Sebastian Carter writes,</p>
    <p>"In September 1935 Gill drew for Monotype a stressed sans-serif type with many prophetic qualities: it looked forward to Hermann Zapf's 'serifless roman' Optima of nearly a quarter of a century later. Although it was given a series number (430), and a few trial sorts were cut, it was never issued to the trade."</p>
    <p>Has anybody here seen these trials or reproductions thereof?</p>
  html_clean: |-
