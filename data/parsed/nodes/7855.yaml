    html: "<p>Galin, I've been watching this critique for a while now. I think the direction you're going in is good, and your type Santa's great. <br> <br>My comments: <br> <br>1. Get rid of the red curved area at the bottom and either just have Santa on a white background, or do what Scott recommended: a typographic horizon line (possibly in a light grey). <br> <br>2. If you want to use a script I recommend you either use just the handwritten type with no effects, or use a more scripted and less handwritten one (like <a href=\"http://www.myfonts.com/fonts/linotype/linoscript/\">Linoscript</a>, for example). The glowing and shadowing remove any sense of a 'true' handwritten feel. <br> <br>By simplifying everything, you also put the emphasis on your Santa, which really deserves most of the viewer's attention.</p>"
    html_clean: "<p>Galin, I've been watching this critique for a while now. I think the direction you're going in is good, and your type Santa's great. <br> <br>My comments: <br> <br>1. Get rid of the red curved area at the bottom and either just have Santa on a white background, or do what Scott recommended: a typographic horizon line (possibly in a light grey). <br> <br>2. If you want to use a script I recommend you either use just the handwritten type with no effects, or use a more scripted and less handwritten one (like <a href=\"http://www.myfonts.com/fonts/linotype/linoscript/\" class=\"link-external\">Linoscript</a>, for example). The glowing and shadowing remove any sense of a 'true' handwritten feel. <br> <br>By simplifying everything, you also put the emphasis on your Santa, which really deserves most of the viewer's attention.</p>"
