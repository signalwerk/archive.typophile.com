    html: "<p>These are beginning to work much better, but I am still struggling a little with the type at the bottom. The words don't bother me so much, as they do Galin, but there still seems to be a style issue. You have two distinct type styles and neither of them seem to be associated in any way with the typoSanta. <br> <br>The following are some suggestions: <br> <br>1 Try creating a typographic horizon line. With this addition the all white background works better than the design with the red swash at the bottom. <br> <br>2 Try simplifying the type to involve only one face. Use a face that is as freeform as your Santa. Between the two you have already, the type used for \"merry it\" would be better suited. <br> <br>3 Galin is right about the copy being improper English, but I'm not sure that it is wrong in this application. I realize that you are saying \"merry it\" while meaning \"make it merry\". I think most others will get it also. In order to emphasize this slang terminology enough to make it obvious, you probably should change \"It is�\" to the contraction \"It's\" as Galin suggested; otherwise, the line will start off too formal. <br> <br>Aloha! <br>Scott</p>"
