    html: <p>Galin, I love the typographic Santa. It's beautifully done.  <br> <br>The tagline, however, I don't like. In English, "merry" isn't a transitive verb, so "merry it" doesn't strictly speaking work. I could see it as a playful semi-pun on "marry it", but for that to work, you have to use the contraction "It's..." instead of "It is", which sounds somewhat formal. Overall, though, I'd drop it.  <br> <br>I think the Santa is strong enough to stand on his own. If you want words, I'd go with Merry Christmas (possibly also in Bulgarian or other languages). (By the way, what's Santa called in Bulgarian? Ded Moroz, Ded Nicolas?) <br> <br>One odd idea, which may make the whole thing too cheap (or not) is that Santa's expression and pose make it look as if he's riding a surfboard. Of course, Santa is supposed to ride a sleigh, so how about putting him on a surfboard made from a sleigh?</p>
