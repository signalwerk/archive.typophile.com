    <p>G’day Philiers,</p>
    <p>I’m designing a logotype for a major organisation for the first time (well it’s the first time for a straight-faced kind of logo) and I’m a bit lost as to what steps to take. I’ve worked the idea up to a fairly high level on paper and I feel it’s getting close to the time where I take it into Illustrator and make the weights consistent and the curves even but this is where I’m a bit scared, my pen tool skills are a bit rudimentary and I tend to make things lumpy. Also I’m not aware of the conventions when it comes to what curves can be repeated, how curves should look and so on. If there any tricks or rules or ways of working that people could throw my way or links to good sites (I’m ordering Leslie Carbaga’s book soon but it won’t arrive in time to help me as I only have a week or so) or anything at all I would be very appreciative, I know the request is a bit vague but I’ve never really done this high detail formal kind of design before so I’m not even really sure what to ask. I’d love any help you can give me<br>
    thanks for reading</p>
    <p>—N</p>
