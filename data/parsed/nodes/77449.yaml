    <p>Hello, </p>
    <p>I have seen a font some time ago, but I don't have a photo and I have no idea how to find it. I remember it was used for a corporate identity of an architect. It is a font which has some kind of wavy baseline, it reminds me of water. The letters were somehow added on top of the waves. Here's an image of the wavy baseline:</p>
    <p><img src="/sites/default/files/old-images/waves_font_5109.jpg"></p>
    <p>I am looking for the name of this font. Does anybody know what font this could have been?</p>
    <p>Thanks.</p>
