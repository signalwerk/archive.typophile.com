    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : D. Stempel AG</strong></p>
    <p>David Stempel (1869-1927) founded the foundry on January 15 1895 at Frankfurt am Main.</p>
    <p>The foundry fast became one of the biggest German foundries. Shares of other foundries were bought, so the resources constandly grew.</p>
    <p>The following is a list of just a few of the designers who worked with Stempel:<br>
    <a href="/wiki/Hans%20Bohn" class="freelinking" rel="nofollow">Hans Bohn</a><br>
    <a href="/wiki/Warren%20Chappell" class="freelinking" rel="nofollow">Warren Chappell</a><br>
    <a href="/wiki/F.%20H.%20Ehmcke" class="freelinking" rel="nofollow">F. H. Ehmcke</a><br>
    <a href="/wiki/Friedrich%20Heinrichsen" class="freelinking" rel="nofollow">Friedrich Heinrichsen</a><br>
    <a href="/wiki/Hanns%20Th.%20Hoyer" class="freelinking" rel="nofollow">Hanns Th. Hoyer</a>,<br>
    <a href="/wiki/F.%20W.%20Kleukens" class="freelinking" rel="nofollow">F. W. Kleukens</a><br>
    <a href="/wiki/Erich%20Meyer" class="freelinking" rel="nofollow">Erich Meyer</a><br>
    <a href="/wiki/Hans%20M%C3%B6hring" class="freelinking" rel="nofollow">Hans Möhring</a><br>
    <a href="/wiki/Hiero%20Rhode" class="freelinking" rel="nofollow">Hiero Rhode</a><br>
    <a href="/wiki/Wilhelm%20Schwerdtner" class="freelinking" rel="nofollow">Wilhelm Schwerdtner</a><br>
    <a href="/wiki/Herbert%20Thannhaeuser" class="freelinking" rel="nofollow">Herbert Thannhaeuser</a><br>
    <a href="/wiki/Martin%20Wilke" class="freelinking" rel="nofollow">Martin Wilke</a><br>
    <a href="/wiki/Rudolf%20Wolf" class="freelinking" rel="nofollow">Rudolf Wolf</a><br>
    <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a><br>
    <a href="/wiki/Gudrun%20Zapf%20von%20Hesse" class="freelinking" rel="nofollow">Gudrun Zapf von Hesse</a> </p>
    <p>In the early 1900s, Stempel developed an exclusive relationship with Linotype, becoming one of just a few producers of matrices for the <a href="/wiki/Linotype%20Machine" class="freelinking" rel="nofollow">Linotype Machine</a> worldwide. In 1985, Stempel became part of the German Linotype AG corporation. In essence, the design department of D Stempel AG would go on to become the in-house design team of Linotype AG and the later Linotype-Hell AG. When Linotype-Hell AG was purchased by <a href="/wiki/Heidelberger%20Druckmaschinen%20AG" class="freelinking" rel="nofollow">Heidelberger Druckmaschinen AG</a> in the 1990s, many former Stempel employees would go on to work for <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a>.</p>
    <p>More info: <a href="http://www.schriftenservice-d-stempel.de" target="_blank" rel="nofollow">Schriften-Service D. Stempel GmbH</a><br>
    (Todays greatest resource of new casted original lead types.)</p>
