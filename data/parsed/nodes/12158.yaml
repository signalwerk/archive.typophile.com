    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: D. Stempel <span class="caps">AG</span></strong></p>
    <p>David Stempel (1869-1927) founded the foundry on January 15 1895 at Frankfurt am&nbsp;Main.</p>
    <p>The foundry fast became one of the biggest German foundries. Shares of other foundries were bought, so the resources constandly&nbsp;grew.</p>
    <p>The following is a list of just a few of the designers who worked with Stempel:<br><a href="/node/add/wiki?edit%5Btitle%5D=Hans%20Bohn" title="Create node &quot;Hans Bohn&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hans Bohn</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Warren%20Chappell" title="Create node &quot;Warren Chappell&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Warren Chappell</a><br><a href="/node/add/wiki?edit%5Btitle%5D=F.%20H.%20Ehmcke" title="Create node &quot;F. H. Ehmcke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">F. H.</span> Ehmcke</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Friedrich%20Heinrichsen" title="Create node &quot;Friedrich Heinrichsen&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Friedrich Heinrichsen</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Hanns%20Th.%20Hoyer" title="Create node &quot;Hanns Th. Hoyer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hanns Th. Hoyer</a>,<br><a href="/node/add/wiki?edit%5Btitle%5D=F.%20W.%20Kleukens" title="Create node &quot;F. W. Kleukens&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">F. W.</span> Kleukens</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Erich%20Meyer" title="Create node &quot;Erich Meyer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Erich Meyer</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Hans%20M%C3%B6hring" title="Create node &quot;Hans Möhring&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hans Möhring</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Hiero%20Rhode" title="Create node &quot;Hiero Rhode&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hiero Rhode</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Wilhelm%20Schwerdtner" title="Create node &quot;Wilhelm Schwerdtner&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wilhelm Schwerdtner</a><br><a href="/node/12142" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Herbert Thannhaeuser</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Martin%20Wilke" title="Create node &quot;Martin Wilke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Martin Wilke</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Rudolf%20Wolf" title="Create node &quot;Rudolf Wolf&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rudolf Wolf</a><br><a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a><br><a href="/node/12242" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gudrun Zapf von&nbsp;Hesse</a> </p>
    <p>In the early 1900s, Stempel developed an exclusive relationship with Linotype, becoming one of just a few producers of matrices for the <a href="/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a> worldwide. In 1985, Stempel became part of the German Linotype <span class="caps">AG</span> corporation. In essence, the design department of D Stempel <span class="caps">AG</span> would go on to become the in-house design team of Linotype <span class="caps">AG</span> and the later Linotype-Hell <span class="caps">AG</span>. When Linotype-Hell <span class="caps">AG</span> was purchased by <a href="/node/12233" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Heidelberger Druckmaschinen <span class="caps">AG</span></a> in the 1990s, many former Stempel employees would go on to work for <a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a>.</p>
    <p>More info: <a href="http://www.schriftenservice-d-stempel.de" target="_blank">Schriften-Service D. Stempel GmbH</a><br>
    (Todays greatest resource of new casted original lead&nbsp;types.)</p>
