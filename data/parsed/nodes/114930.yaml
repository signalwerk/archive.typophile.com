    <p>Some apps like inkpad (the great vecor drawing app) have their in-built method of installing your font through Dropbox.  But for regular iOS apps like Pages, do the following:</p>
    <p>1- Download  the "iOS Font Maker"  freeware to your Windows, Mac or Linux(?) desktop from <a href="http://thehelpful.com/iosfonts/" title="http://thehelpful.com/iosfonts/" class="link-external">http://thehelpful.com/iosfonts/</a>   (It is not to be confused with  the "iFont Maker" on the  iTunes App Store which is a mini-Fontlab of sorts).</p>
    <p>2- Install iOS Font Maker and follow the instructions to create your fontname.mobilecionfig file.  Email the file to yourself. </p>
