    html: <p>Nice Miguel, it conveys a very rustical and spontaneous feeling. <br> <br>The lines in the base of the M, a, n and k that are too straight, make them rough. <br>Uppercase M is too light.  <br>I prefer the double storey lower case a. <br> <br>This logo would benfit of some kind of musical or folk reference with a hand made sense such as chaquira, hand painting, hand engraving or something like that.</p>
