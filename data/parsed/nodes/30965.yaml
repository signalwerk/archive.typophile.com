    <p>Full name: École Supérieure Estienne des Arts et Industries Graphiques.</p>
    <p>The sole <a href="/wiki/France" class="freelinking" rel="nofollow">French</a> school having a course focused on type design: the <em>DSAA Création Typographique</em>. As a state school, Estienne has free tuition in this 2-year program.<br>
    The school is based in Paris and has other design-related programs.</p>
