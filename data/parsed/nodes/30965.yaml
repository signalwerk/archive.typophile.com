    <p>Full name: École Supérieure Estienne des Arts et Industries&nbsp;Graphiques.</p>
    <p>The sole <a href="/node/19576" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">French</a> school having a course focused on type design: the <em><span class="caps">DSAA</span> Création Typographique</em>. As a state school, Estienne has free tuition in this 2-year program.<br>
