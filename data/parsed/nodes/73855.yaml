    html: |-
      <p>If you keep the planet solid a round heavy geometric type might work very well. Depends on what kinda band it is as well. If it's a rock band you might want a type that's more aggressive then this. </p>
      <p>If the symbol is gonna be this simple I would make it a lot smaller, there's is no need for it to be this big when there is nothing more in it. I would make it slightly smaller then the type and have some nice details in the type instead.</p>
      <p>I would try making soundwaves out of the rings but this might night work so well. What riccard0  suggests with the S in the planet might work, this would diminish the blackness of the whole thing.</p>
