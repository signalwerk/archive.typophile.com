    html: |-
      <p>It is for a band called Sounds of Saturn. The name comes from the now famous audio recordings of Saturn's rings.<br>
      One of my thoughts was to cut a hole in the middle of the planet, so that it would look more like a record or CD, however that really kills any feeling of dimension created by the rings.<br>
      They wanted to keep the mark fairly simply and straightforward. Nothing specific was set about the type, so I am open to all kinds of suggestions.<br>
      Type is definitely my weakest skill, so I love to hear suggestions!</p>
