      <p>As for type, depending on the style of the band, you could try either a still more techno/sci-fi look, or trying to match the O either with the circle of the planet or the ellipse of the rings.<br>
      Also, in order to lighten the relative blackness of the planet, you could try to incorporate a S into the circle shape.</p>
