  html: |-
    <p>We're gearing up for TypeCon2008 in Buffalo (July 15-20). Right now, SOTA is accepting proposals for presentations, panel discussions, workshops, and sessions at the type and design education forum. All Typophiles are welcome to submit proposals.</p>
    <p>Even if you're not up for speaking, let us know what you'd like to see on the program at the conference. Feel free to post your ideas here.</p>
    <p>Full details of calls for submissions are at <a href="http://www.typecon.com" title="http://www.typecon.com">http://www.typecon.com</a>.</p>
