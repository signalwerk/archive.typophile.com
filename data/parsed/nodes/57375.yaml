    <p>Hi people!</p>
    <p>Just to inform about my new typeface, Exablock.<br>
    You can check it out here:<br>
    <a href="http://new.myfonts.com/fonts/fabio-martins/exablock/" title="http://new.myfonts.com/fonts/fabio-martins/exablock/">http://new.myfonts.com/fonts/fabio-martins/exablock/</a></p>
    <p>It's a modular typeface based on a six-per-six grid.<br>
    It comes in two flavours: Square and Round.</p>
