    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Grant Hutchinson</strong></p>
    <p><strong>Grant Hutchinson</strong> (b. 1963) has been designing, manipulating and marketing digital type for years. On the way to his previous gig at <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>, he created typefaces and helped keep the storefronts tidy at visual content purveyors such as <a href="/wiki/Image%20Club" class="freelinking" rel="nofollow">Image Club</a>, Adobe Studios, EyeWire, and Getty Images.</p>
    <p>He founded <a href="/wiki/Typostrophe" class="freelinking" rel="nofollow">Typostrophe</a> in 2009 as a home base for his ongoing typographic concerns.</p>
    <p>Grant resides in Calgary, Alberta — along with a basement full of vintage computers and typographic paraphernalia that his wife wishes he would store somewhere else.</p>
    <p>He occupies what little spare time is left over at the end of the day by blathering on about stuff on <a href="http://splorp.com/" rel="nofollow">his website</a>, photographing the <a href="http://flickr.com/splorp/" rel="nofollow">mundane and weathered</a> and running <a href="http://newtontalk.net/" rel="nofollow">several</a> <a href="http://newted.org/" rel="nofollow">community</a> <a href="http://npds.info/" rel="nofollow">sites</a> dedicated to the support of obsolete (but dearly loved) handheld computing platforms. He has also been known to contribute sporadically to <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a>.</p>
    <p>Typefaces by Grant include: <a href="http://www.identifont.com/show?7K7" rel="nofollow">Badloc</a>, <a href="http://www.identifont.com/show?7P9" rel="nofollow">Boca Raton</a>, <a href="http://www.identifont.com/show?7TA" rel="nofollow">Broadband</a>, <a href="http://www.identifont.com/show?7YX" rel="nofollow">Carver</a> (with <a href="/wiki/Noel%20Rubin" class="freelinking" rel="nofollow">Noel Rubin</a>), <a href="http://www.identifont.com/show?82F" rel="nofollow">East Bloc</a>, <a href="http://www.identifont.com/show?8GZ" rel="nofollow">Narrowband</a>, <a href="http://www.identifont.com/show?8LC" rel="nofollow">New Geneva Nine</a>, and the Schmutz family (<a href="http://www.identifont.com/show?8DG" rel="nofollow">Cleaned</a>, <a href="http://www.identifont.com/show?8SQ" rel="nofollow">Clogged</a>, <a href="http://www.identifont.com/show?8SR" rel="nofollow">Corroded</a>)</p>
    <p>He still gets misty-eyed recalling the hours he spent hunched over sheets of dry-transfer lettering, painstakingly ad libbing uppercase As from inverted Vs and hyphens.</p>
