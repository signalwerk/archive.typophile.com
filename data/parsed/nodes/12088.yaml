    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>: Grant&nbsp;Hutchinson</strong></p>
    <p><strong>Grant Hutchinson</strong> (b. 1963) has been designing, manipulating and marketing digital type for years. On the way to his previous gig at <a href="/node/12009" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veer</a>, he created typefaces and helped keep the storefronts tidy at visual content purveyors such as <a href="/node/12089" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Image Club</a>, Adobe Studios, EyeWire, and Getty&nbsp;Images.</p>
    <p>He founded <a href="/node/27795" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typostrophe</a> in 2009 as a home base for his ongoing typographic&nbsp;concerns.</p>
    <p>Grant resides in Calgary, Alberta — along with a basement full of vintage computers and typographic paraphernalia that his wife wishes he would store somewhere&nbsp;else.</p>
    <p>He occupies what little spare time is left over at the end of the day by blathering on about stuff on <a href="http://splorp.com/">his website</a>, photographing the <a href="http://flickr.com/splorp/">mundane and weathered</a> and running <a href="http://newtontalk.net/">several</a> <a href="http://newted.org/">community</a> <a href="http://npds.info/">sites</a> dedicated to the support of obsolete (but dearly loved) handheld computing platforms. He has also been known to contribute sporadically to <a href="/node/12035" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographica</a>.</p>
    <p>Typefaces by Grant include: <a href="http://www.identifont.com/show?7K7">Badloc</a>, <a href="http://www.identifont.com/show?7P9">Boca Raton</a>, <a href="http://www.identifont.com/show?7TA">Broadband</a>, <a href="http://www.identifont.com/show?7YX">Carver</a> (with <a href="/node/12123" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Noel Rubin</a>), <a href="http://www.identifont.com/show?82F">East Bloc</a>, <a href="http://www.identifont.com/show?8GZ">Narrowband</a>, <a href="http://www.identifont.com/show?8LC">New Geneva Nine</a>, and the Schmutz family (<a href="http://www.identifont.com/show?8DG">Cleaned</a>, <a href="http://www.identifont.com/show?8SQ">Clogged</a>, <a href="http://www.identifont.com/show?8SR">Corroded</a>)</p>
    <p>He still gets misty-eyed recalling the hours he spent hunched over sheets of dry-transfer lettering, painstakingly ad libbing uppercase As from inverted Vs and&nbsp;hyphens.</p>
