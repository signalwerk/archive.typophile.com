    <p>Hello everyone. I am brand new to this forum and hope you can help me. I am a book designer/typesetter from the Midwest who just recently moved to NYC. I am a freelancer and I need to update my prices. Does anyone have a recommendation of how much to charge for an interior book design? How about for typesetting? By the character count or by the page? I want to have competitive pricing, but I don't want to give it away! NYC is expensive, after all. ! </p>
    <p>Any suggestions would be welcome. Thanks! Janet</p>
