      <p>Actually the going rate for typesetting in NYC these days is by the word, approx 7 cents a word.</p>
      <p>For interior book design I charge $25/page for text only and between $40 and $50/page for illustrated books. This fee includes the cover design, typesetting and one round of layout correx. Additional correx billable hourly at $50/hour.</p>
