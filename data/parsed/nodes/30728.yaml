      <p>Patty, you sound like you are giving out prices for design/layout - which depending on the publisher does yield about $15 to $100 per page, depending on book, budget, etc.</p>
      <p>However, in just good old typesetting of a page - it use to average out to about $2.50 per page.</p>
      <p>Janet - the very best of luck - I use to typeset (and design) book interiors for Berkley, Simon &amp; Schuster, Avon, etc. I am no longer in the city -- and none of the major publishers seem to care for freelancers to do it anymore. One of the publishers now has a dept within the production dept -- and they are happy in a few typefaces with the same basic design for each book. When it came to the complex books that need thought, design, sense of layout, etc. -- they decided only to buy packaged goods. </p>
      <p>Good luck - it's a tough world, and yes, New York is very expensive.</p>
