    <p>In the German language, all <a href="/wiki/serif" class="freelinking" rel="nofollow">serif</a> faces are generally referred to as Antiquas.</p>
    <p>In the early 20th Century, there were three kinds of type widely available throughout German-speaking countries: <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a>, <a href="/wiki/Grotesk" class="freelinking" rel="nofollow">Grotesk</a>, and <a href="/wiki/Antiqua" class="freelinking" rel="nofollow">Antiqua</a>.</p>
