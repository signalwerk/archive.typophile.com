      <p>I think what you say about a custom(ized) font or hand-drawn is certainly possible, but a font with swash alternates could certainly have features like this 'w'. I thought it was worth searching, and I will try a bit longer, now that I'm back.</p>
      <p>- Mike Yanega</p>
