      <p>Even though 'curly' is a popular style, this doesn't look familiar. In some ways it reminds me of Rian Hughes' 'Yolanda', but that is missing the curlies. I was searching MyFonts using 'curly', but the first 150 fonts were different, and I need to leave right now. </p>
