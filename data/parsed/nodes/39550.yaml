    date: 2007-12-01T17:53:00
    votes: null
    html: <p>That appears to be a modification (simplification) of Herman Ihlenburg's Bijou (1882). One version is Fontbank's <a href="http://www.buyfonts.com/value_for_money/bangle.htm" target="_blank" rel="nofollow">Bangle</a>. The modifications are mostly trimming, except for the right side of the 'm' - although the whole thing could be a redrawing based upon Bijou.</p>
