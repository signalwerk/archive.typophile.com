    html: |-
      <p>Well, I finished the search at MyFonts. No matches, but Lambada has some similar elements, though a very different feel. Edison Swirl also has some swirly components, but also not a match.</p>
      <p>Two freebie fonts had some similar details, like <a href="http://www.dafont.com/caffe-latte.font?nb_ppp=50&amp;text=Smallflower" rel="nofollow"> Caffe Latte</a>, and <a href="http://www.dafont.com/nemo.font?nb_ppp=50&amp;text=Smallflower" rel="nofollow">Nemo</a>. However, these are much more roughly drawn. </p>
      <p>In my opinion, the Smallflower logo is a professionally drawn custom logo, which may or may not be part of a full alphabet. Since they don't use it anywhere else on their site, I'd guess maybe it's only a logo.</p>
      <p>- Mike Yanega</p>
  - id: 243664
    user_id: 3368
