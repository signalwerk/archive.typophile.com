  html: <p>If somebody wanted to convert the forms in an 80s video game pixel font to a modern smooth-contour (that is, no pixel blocks, just smooth lines) face, what kinds of techniques would you emply to translate the blocks to smooth lines?  I'm talking philosphically, not technically. <br> <br>Understand that the s, for example, in this face would look differently if interpreted by multiple designers--even though it's based on the same pixel-s.</p>
