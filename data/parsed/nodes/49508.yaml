      <p>I agree with Lex's call for the serif (at least in something digital). Mrs Eaves SC has the flat-topped 3, and the other attributes seem to match pretty well. The problem is that I don't think Mrs Eaves exists as metal type. So it's based on Baskerville, but I don't see any metal samples that have this '3'.</p>
      <p>Is there a technique to make a digital font look like letterpress?</p>
      <p>- Mike Yanega</p>
