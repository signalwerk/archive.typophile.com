      <p>The script doesn't look much like anything digital that I know, other than <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/monterey/" rel="nofollow">Mahogany/Monterey</a> Script. The lower case seems to be close to a film type that the Solotype Catalog calls Jewell Script. My notes say this was shown as Piedmont Vertical Condensed in the Photo-Lettering Catalog, but the initials for that typeface are simpler than your samples.</p>
      <p>- Mike Yanega</p>
