    html: |-
      <p><cite>Is there a technique to make a digital font look like letterpress?</cite><br>
      The embossing that is often used on book jackets, usually stamped from the back to give a raised pattern on the front, must start with a template from the same font that will be printed on the front. The three different "Great Ideas" series from Penguin Books try and get a letterpress effect by stamping the front, however often the embossing and the ink don't align exactly.</p>
