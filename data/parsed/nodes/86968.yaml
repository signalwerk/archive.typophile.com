  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TYPO-45-cover_5183.jpg"></div><br>
    With a cover photo by Molly Woodworth from New York, take a look inside the current <a href="http://www.typo.cz/en/vanishing-world-on-the-cover-of-typo-45" rel="nofollow">autumn issue</a>.<p></p>
    <p><strong>The impartial observer</strong> / <em>with David Tartakover</em><br>
    Interview with an Israeli designer whose poster art has charted the Middle East peace process and Israeli-Palestinian conflict.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TYPO-45-p-8-9_4498.jpg"></div><p></p>
    <p><strong>Type]Media 2010–2011</strong><br>
    Gallery of the results of the Type]Media course at the Royal Academy of Art in The Hague, in which twelve students scribbled, chiselled, sketched, revived, live-traced, wrote, fontlabbed, doodled, interpolated, coded and pixelled for nearly a year.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TYPO-45-p-16-17_5079.jpg"></div><p></p>
    <p><strong>Typographic categories</strong> / <em>Víctor García</em><br>
    Contemplations on typographic categories called dingbats, pi fonts, symbol fonts and non-alphabetics.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TYPO-45-p-30-31_6458.jpg"></div><p></p>
    <p><strong>Forgotten kerning</strong> / <em>Filip Blažek</em><br>
    Overview of important kerning pairs that are often lacking in fonts, making it difficult for designers to use specific fonts without running into problems.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TYPO-45-p-33-33_4229.jpg"></div><p></p>
    <p><strong>The ghost signs of Brooklyn &amp; Manhattan</strong> / <em>Molly Woodward</em><br>
    Essay on vernacular typography in New York City, where the first sign painter used brick buildings as their canvases.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TYPO-45-p-46-47_4871.jpg"></div><p></p>
    <p><strong>Whales and puffins. ATypI 2011</strong> / <em>Filip Blažek</em><br>
    A report on this year‘s ATypI conference held in Reykjavík, Iceland. The conference theme was the Icelandic letter eth, ð.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TYPO-45-p-80-81_6125.jpg"></div><p></p>
    <p><a href="http://www.typo.cz/en" rel="nofollow">www.typo.cz</a></p>
