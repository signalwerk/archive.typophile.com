      <p>1) Open font and generate Type1 font - .pfa file<br>
      2) (in FontLab) generate GlyphOrderAndAliasDB<br>
      use this script <a href="http://typophile.com/node/75834" title="http://typophile.com/node/75834">http://typophile.com/node/75834</a><br>
      remove font name in generated file name<br>
      3) Save this as FontMenuNameDB file:<br>
      <code>[PaintCans]<br>
      	f=PaintCans<br>
      	s=Regular<br>
      	c=PaintCans<br>
      	c=1,PaintCans<code></code></code></p>
      <p>All your files are in one folder with font.pfa</p>
      <p>4) Finally:<br>
      <code>makeOTF -f c:\...\font.pfa -r<code></code></code></p>
      <p>5) Your new font:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PaintCans_4217.jpg"></div><p></p>
      <p>Job done!</p>
