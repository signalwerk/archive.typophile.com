    html: |-
      <p>Ok that seems to have worked well. I think I messed up the first step but I bumbled through it easy enough.</p>
      <p>Here's the process in more detailed terms that might be easier to digest.</p>
      <p>1.) I used FontLab to create a Postscript version of the font (ASCII/UNIX Type1 ). This creates 4 files: .pfa, .pfm, .inf, .afm </p>
      <p>2.) I downloaded the scripts created by Arno Enslin here: <a href="http://typophile.com/node/75834" title="http://typophile.com/node/75834">http://typophile.com/node/75834</a></p>
      <p>3.) I removed the .txt extention from the end of the downloaded file so my mac would recognize it as a zip file then uncompressed the file &amp; moved into FontLabs standard location for macros &amp; scripts located at <code> Library/Application Support/FontLab/Studio 5/Macros </code></p>
      <p>4.) In FontLab I went to WINDOW&gt;PANELS&gt;EDIT MACROS to open the EDIT MACROS window. I dragged the "Generate_GlyphOrderAndAliasDB_file.py" file into the EDIT MACROS window. The contents of the file appeared in the window.</p>
      <p>5.) I hit the RUN MACRO button at the top of the window that looks like a "play" button. This generated the <code> GlyphOrderAndAliasDB </code> file in the folder along with the rest of the type1 font files.</p>
      <p>6.) The font in this example was called "PaintCans" so I created a plain-text file named <code> FontMenuNameDB </code> (no file extension) with the following contents and saved it to the folder with the other font files.<br>
      <code>[PaintCans]<br>
      f=PaintCans<br>
      s=Regular<br>
      c=PaintCans<br>
      c=1,PaintCans</code></p>
      <p>7.) Having the latest Adobe Font Dev Kit for OpenType installed ( <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko.html" rel="nofollow">Adobe FDKO</a> ) I ran the "makeOTF" script by opening a terminal window and entering:<br>
      <code> makeOTF -f c:\...\font.pfa -r </code></p>
      <p>This all worked like a charm and the Adobe makeOTF script spit out an OTF file into the directory with the other files.</p>
      <p>This shaved about 7kb off of the file size which is great. I'm not sure why but it's still good.</p>
      <p>I had an original font at 166kb. I removed thousands of paths and somehow wound up with a font that was 253kb (bigger when I expected smaller). This method did produce a smaller file but only by a little bit. I was hoping to understand where all this extra file size had come from &amp; to wind up with a new file under 166kb. </p>
      <p>Did I screw it up by using FontLab to create the initial Type1 file?</p>
      <p>Any thought on where I might go next?</p>
