    <p>I have an old font that I created a decade or so ago. It's an insane font created with paths that were created by an auto-trace. The glyphs have relatively insane numbers of the paths.</p>
    <p>Over the years I have cleaned it up a little here &amp; there resulting in a slowly shrinking file size and smoother performance. I've finally taken the tie to do a more thorough clean up of the font on on exporting the otf &amp; ttf files from FontLab 5.1.4 for mac I noticed that the resulting files are significantly bigger that the last revision.</p>
    <p>The newer version has 20% or so less paths &amp; no other intentional changes, no new glyphs etc…. so this should not be the case.<br>
    I've gone through the font glyph by glyph to verify that it truly does have far fewer paths. </p>
    <p>Does anyone have any ideas how I might further investigate this issue? It is a free font &amp; people like it. The clean up barely changes it's appearance at all &amp; is definitely a good thing but my goal is to make the font less computationally demanding, not more.</p>
    <p>Thanks</p>
