      <p>Sorry, that is just a stub. It is not the full script. The tool is something that can be clicked in the tools menu and requires a file in a special format (on unix, in the <code>~/.fontforge/Python</code> directory).</p>
      <p>Here is a full script usable as a script. The advantage in copying in a new font and copying back is that the operation can be undone and redone (copy can be undone). I could not get that behaviour otherwise.</p>
      <pre>import fontforge;
      ff=fontforge

      cwidth = {}                        # **
      def largeside(c):
        (xmin,ymin,xmax,ymax) = c.boundingBox()
        width = xmax-xmin
        height = ymax - ymin
        if width &gt; height: return width
        else: return height

      f = ff.activeFont()
      # f.copy()                         # **
      nf= ff.font()
      fsel = f.selection.byGlyphs;
      for g in fsel:
        nf.createChar(g.unicode,g.glyphname)
        nf.selection.select(("more",None), g)
      # nf.paste()                       # **
      for g in fsel:
        cwidth[g.glyphname] = g.width    # **
        if g.foreground and len(list(g.foreground)) != 0:
          pen=nf[g.glyphname].glyphPen()
          for c in g.foreground:
            if largeside(c)&gt;5:
              c.draw(pen)
          pen = None
      nf.copy()
      f.paste()
      for g in fsel:                     # **
        g.width = cwidth[g.glyphname]    # **
      nf.close()
      </pre><p>
      # ** Modifications according to post below</p>
