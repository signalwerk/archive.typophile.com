      <p>If it's a case of redistributing outlines taken from a commercial font, that's not OK.</p>
      <p>Many years ago I made this<br>
      <a href="http://themicrofoundry.com/ss_trajic.html" title="http://themicrofoundry.com/ss_trajic.html">http://themicrofoundry.com/ss_trajic.html</a><br>
      which re-uses Adobe Trajan's outlines (but does not include any unaltered glyphs). Over the years dozens of people have contacted me asking to buy it. I say no.</p>
      <p>hhp</p>
