    html: |-
      <p>In fact I have to say that to me Muslimah is exactly a case of thinking that matching a typestyle across scripts is a matter of formal shapes. It's not. Instead I feel what's involved is the matching of a "mood": what Arabic font evokes to Arabs what Trajan evokes to Westerners? Maybe a thulooth. But that's hard to pull off with a font... So instead a particularly traditional Nasta'leeq perhaps.</p>
      <p>BTW Aziz, where do the outlines of the Latin component of Muslimah come from?</p>
      <p>hhp</p>
