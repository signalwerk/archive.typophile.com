    html: "<p>Jim, this one is definitely not a lost cause, imo. <br>However, you might investigate similar faces <br>before proceeding. The 'technoish' rounded square shape <br>has been used quite a bit and is a fairly accessible <br>jumping off point to start a typeface. <br> <br>I'd check Identikal, WWFT, and Cape Arcona to start with. <br>Maybe also check with some of your Union Font <br>designers ... some of them may have already gone <br>down this road. <br> <br> <br>Some initial comments: <br> <br>f - perhaps extend the upper arch <br>j - perhaps extend the lower arch <br>k - the upper arm needs some work, imo <br>m - this should not be two 'n's in width <br>or it'll seem too wide. <br>w - see above <br> <br>best of luck. <br> <br>bj</p>"
    html_clean: "<p>Jim, this one is definitely not a lost cause, imo. <br>However, you might investigate similar faces <br>before proceeding. The 'technoish' rounded square shape <br>has been used quite a bit and is a fairly accessible <br>jumping off point to start a typeface. <br> <br>I'd check Identikal, WWFT, and Cape Arcona to start with. <br>Maybe also check with some of your Union Font <br>designers ... some of them may have already gone <br>down this road. <br> <br> <br>Some initial comments: <br> <br>f - perhaps extend the upper arch <br>j - perhaps extend the lower arch <br>k - the upper arm needs some work, imo <br>m - this should not be two 'n's in width <br>or it'll seem too wide. <br>w - see above <br> <br>best of luck. <br> <br>bj</p>"
