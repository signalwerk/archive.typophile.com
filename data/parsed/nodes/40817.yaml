    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Liber-Specimen-2_4212.gif"></div><p></p>
    <p>Liber©, was designed and digitized by me and launched in 1993. It was the second typeface designed in Denmark. First was Paul Søgren's Jante (1992).Until 1999 Liber© was reserved for the exclusive use of the Royal School of Library and Information Science - and was my personal font, which it remains. Since 1993 a number of books and booklets published by the school were set in Liber©. In 1999 I decided to give it wider application, and a few commercially produced books were set in Liber©. After 15 years the font can be now acquired for general use. Applications should be adresssed to me at <a href="mailto:psl@psl.dk">psl@psl.dk</a>.</p>
    <p>The font was designed as a bookface for print only, and for use in sizes between 5 and 13 pt. The enclosed GIF image displays the characters in rather crude shapes.</p>
    <p>The attached PDF-file is a poster produced for the recent ATyPi conference in Copenhagen. It shows the characters as they really look.</p>
    <p>Comments are wellcome !</p>
