    html: <p>I'd agree with Craig, those dashes could do with being more prominent, whichever way you decide to go. To my mind, if you're using double ones in the surrounding non-dialogue text, I'd say it's more consistent to stick to one variant, the double, throughout, rather than have double in text and single in dialogue.</p>
