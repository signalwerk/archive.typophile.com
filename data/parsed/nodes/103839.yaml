    html: |-
      <p>Dramatic change of perspective: We have changed <em>all</em> guillemets in the text – within direct speech or no – to single ones :)</p>
      <p>Upon further inspection of what actually is inside those quotes (thanks for this question on Twitter, Frode), we (editor + I) realized they’re all book titles, names of restaurants and other such things that can easily be quoted in single guillemets as well. Changing them to singles also makes them less loud visually (thanks for that, Craig), makes them not feel weird inside direct speech (where most readers will be used to seeing single ones) while still maintaining consistency between quoted and not quoted text (as I wanted it). </p>
      <p>Ergo, everyone happy, problem solved. Thanks, all!</p>
