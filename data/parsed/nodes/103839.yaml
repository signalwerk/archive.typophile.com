    html: |-
      <p>Thanks all so far.</p>
      <p>On the dashes, I agree (and realize) that they’re relatively short, but in this/our German/Swiss context this is actually quite welcome – em-dashes would definitely be over the top. Craig’s point on what that means for the visual hierarchy with the guillemets does give me pause though… hmm. </p>
      <p>What’s interesting is that Frode (or whoever is handling the Monokrom  account) has commented on <a href="https://twitter.com/monokromfonts/status/345271391819546624" rel="nofollow">Twitter</a> that double guillemets would be commonly used with the dashes in Norwegian (which uses both dashes and guillemets) – so there’s a precedent.</p>
      <p>I’ll see the editor today &amp; we’ll have a (presumably final) talk about it :)</p>
