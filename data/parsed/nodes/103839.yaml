    html: "<p>Thinking as an editor, I would agree with your typographic logic: single guillemets indicate nesting within guillemets, not nesting within discourse. Thinking as a typesetter, I would prefer em-dashes rather than en-dashes for the dialogue, if possible. But my opinions are very Anglophone; I don't really know how German-speakers perceive these things.</p>"
    html_clean: "<p>Thinking as an editor, I would agree with your typographic logic: single guillemets indicate nesting within guillemets, not nesting within discourse. Thinking as a typesetter, I would prefer em-dashes rather than en-dashes for the dialogue, if possible. But my opinions are very Anglophone; I don't really know how German-speakers perceive these things.</p>"
