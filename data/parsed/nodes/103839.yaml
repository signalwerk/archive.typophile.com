    html: <p>A tad more logical but more out of random preference I would probably use the singles too. There is the “semantic use” of single quotation marks for emphasize or to highlight explanations for things that aren’t quotes. But that case doesn’t really apply here, or does it? I don’t know of any “rules” for such a case. Typesetting guidelines are more about helpful conventions than rules anyway, so just do what you think will be understood most easily by the reader.</p>
