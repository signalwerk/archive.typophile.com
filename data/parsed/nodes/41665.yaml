    <p>I'm trying to figure out what the typeface is that they regularly use in the Wire magazine. It's the type that says:<br>
    SIGHTINGS<br>
    HOT CHIP<br>
    GEORGE E LEWIS</p>
    <p>Cath &amp; Phil Tyler<br>
    Warrio Queen<br>
    Wooden Shjips</p>
    <p>and then the line towards the bottom, with the lighter weight:<br>
    "What makes today's Techno so different, so appealing?"</p>
    <p>Thanks in advance, I really appreciate the help!</p>
    <p><a href="http://www.asymm.net/wire_smalltype.jpg" title="http://www.asymm.net/wire_smalltype.jpg">http://www.asymm.net/wire_smalltype.jpg</a><br>
    <a href="http://www.asymm.net/wirecover.jpg" title="http://www.asymm.net/wirecover.jpg">http://www.asymm.net/wirecover.jpg</a></p>
