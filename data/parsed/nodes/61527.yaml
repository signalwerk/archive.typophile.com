      <dl>
      <dt>Here is a couple of nice tips, from <a href="http://openlibrary.org/b/OL3702128M/complete-manual-of-typography" rel="nofollow">James Felici</a>:</dt>
      </dl>
      <dd></dd>
      <dd><strong>Point Size &amp; Measure</strong></dd>

      <dl>
      <dd></dd>
      </dl>
      <dd>Point size and measure are married to each other. Optimal line lengths, for example, are often expressed in terms of how many characters or words will fit within the measure, and this is a function of point size. You can calculate the appropriate point size for a given measure in different ways. Here are some of the more commonly proposed guidelines:
      <ul>
      <li>the optimal line length is between one and a half and two times the length of the lowercase alphabet</li>
      <li>the optimal line length is nine or ten words (figure an average of 5½ characters per word)</li>
      <li>27 characters is the minimum line length, 40 the optimum, and 70 the maximum</li>
      </ul>
      <p>A guide that I prefer compares the line length in picas with the type size in points. Because it uses simple math, you don’t have to count individual words and characters. In this scheme, a measure (in picas) three times the size of the type (in points) is the absolute outer limit, and it is too long most of the time. Thus, 10-point type shouldn’t be set over a measure exceeding 30 picas. The ideal ratio is about 2 : 1 or 2½ : 1, which translates to a measure of 20 to 25 picas for 10-point type. When the ratio approaches 1:1 (10-point type over a 10-pica measure, for example) good type composition becomes almost impossible. </p>
      <p>From: <em>The Complete Manual of Typography: A Guide to Setting Perfect Type</em>, by James Felici. (Berkley: Peachpit Press, 2003), p. 120.</p></dd>
