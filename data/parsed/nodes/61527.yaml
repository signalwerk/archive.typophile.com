    html: |-
      <p>It is difficult to appropriately define a universal set of rules for this because not another factor that needs to be put into consideration is the typeface itself and the colours used (eg.is it white type on black background). Edmund Arnold's rule only applies to newspaper publishings where there is a constant use of typeface, in which case it was Times and Bureau Grotesk during his work with newspapers such as the Boston Globe and National Observer.</p>
      <p>Although i was once told by my typography lecturer that there is a mathematical formula that is used to work this out for each typeface that takes into account the X-height, cap height and baseline. But I failed to remember it.</p>
      <p>In my opinion the best way of choosing the correct column width is by trial and error. To print variations and deciding on the best one. Or I might be wrong and rambling for no reason. =p</p>
