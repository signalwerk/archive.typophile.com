    html: <p>I not sure about any hard and fast rule. The closest one I remember is Edmund Arnold's (I think) rule that the ideal length of line could be found by using 1.5 to 2.5 lower case alphabets (39 to 65 characters in a line). The lower range was for newspapers, and many books will be set with the higher range.</p>
