    html: |-
      <p>Perhaps that letters that are still cap form (/ONS/ sticks out in hamburgefonstiv) aren't "uncialed" enough? /S/ could be wider, and I would even try a top-heavy version (as you see in some insular scripts). /N/ could have a serif-life extension of the diagonal at lower right instead of the neat angle (or what about a humped form more akin to /m/?)</p>
      <p>Maybe move the join of /T/ further right?</p>
      <p>Descending beard of /G/ could use some strengthening.</p>
      <p>I don't know enough about the other scripts to comment on specifics but they look nice!</p>
