      <div class="comment-spam-body"><p><strong>Bookstores:</strong><br>
      Buchhandlung Kunstgriff, Limmatstrasse 270, between Limmatplatz and Escher-Wyss-Platz<br>
      <a href="http://www.kunstgriff.ch/" title="http://www.kunstgriff.ch/">http://www.kunstgriff.ch/</a></p>
      <p>Sphères (combination bookstore and bar/café), Hardturmstrasse 66, west of Escher-Wyss-Platz<br>
      <a href="http://www.spheres.cc/" title="http://www.spheres.cc/">http://www.spheres.cc/</a></p>
      <p>Buchhandlung sec52, Josefstrasse 52, between train station and Limmatplatz<br>
      <a href="http://sec52.ch/" title="http://sec52.ch/">http://sec52.ch/</a></p>
      <p><strong>Culture / Clubs / Books / Art / Meals:</strong><br>
      A list of suggestions intended for students of the Zurich university of the arts:<br>
      <a href="https://www.zhdk.ch/index.php?id=38591" title="https://www.zhdk.ch/index.php?id=38591">https://www.zhdk.ch/index.php?id=38591</a></p>
      <p><strong>Museums and exhibits:</strong><br>
      The Rietberg museum has a lovely garden<br>
      <a href="http://www.rietberg.ch/en-gb/foyer.aspx" title="http://www.rietberg.ch/en-gb/foyer.aspx">http://www.rietberg.ch/en-gb/foyer.aspx</a></p>
      <p>Museum Haus Konstuktiv<br>
      <a href="http://www.hauskonstruktiv.ch/en/" title="http://www.hauskonstruktiv.ch/en/">http://www.hauskonstruktiv.ch/en/</a></p>
      <p>Poetry will be made by all<br>
      <a href="http://poetrywillbemadebyall.ch/" title="http://poetrywillbemadebyall.ch/">http://poetrywillbemadebyall.ch/</a></p>
      <p><strong>A list of second-hand stores and thrift shops in Zurich:</strong><br>
      <a href="http://www.nichtneu.ch/liste/liste/a-z" title="http://www.nichtneu.ch/liste/liste/a-z">http://www.nichtneu.ch/liste/liste/a-z</a></p>
      <p><strong>Design stores:</strong><br>
      There is a yearly design weekend in May. The website has the addresses of  stores, designers, cafés, and establishments who participate:<br>
      <a href="http://www.kreislauf4und5.ch/en/index.html" title="http://www.kreislauf4und5.ch/en/index.html">http://www.kreislauf4und5.ch/en/index.html</a></p>
      <p>Vintage furniture and accessories:<br>
      <a href="http://www.walterwalter.ch/" title="http://www.walterwalter.ch/">http://www.walterwalter.ch/</a></p>
      <p>Shop with household objects selected for design quality:<br>
      <a href="http://www.editionpopulaire.ch/" title="http://www.editionpopulaire.ch/">http://www.editionpopulaire.ch/</a></p>
      <p>Design furniture and objects:<br>
      <a href="http://bogen33.ch" title="http://bogen33.ch">http://bogen33.ch</a></p>
      <p><strong>Food:</strong><br>
      Vegetarian restaurant with buffet:<br>
      <a href="http://www.tibits.ch/" title="http://www.tibits.ch/">http://www.tibits.ch/</a></p>
      <p>Garage-style restaurant:<br>
      <a href="http://www.les-halles.ch/" title="http://www.les-halles.ch/">http://www.les-halles.ch/</a><br>
      <a href="http://www.inyourpocket.com/Switzerland/Zurich/Restaurants-and-Cafes/Mediterranean/Les-Halles_63932v" title="http://www.inyourpocket.com/Switzerland/Zurich/Restaurants-and-Cafes/Mediterranean/Les-Halles_63932v">http://www.inyourpocket.com/Switzerland/Zurich/Restaurants-and-Cafes/Med...</a></p>
      <p><strong>Markets:</strong><br>
      <a href="http://www.inyourpocket.com/Switzerland/Zurich/Sightseeing/Markets" title="http://www.inyourpocket.com/Switzerland/Zurich/Sightseeing/Markets">http://www.inyourpocket.com/Switzerland/Zurich/Sightseeing/Markets</a></p>
      </div>
