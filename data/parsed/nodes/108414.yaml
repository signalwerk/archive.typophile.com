    <p>I will be in Zurich for 2 weeks this coming Sunday and I was wondering if anyone here had any recommendations? Good book shops (1st/2nd/antique, anything) or any good galleries, just anything you think is good and worth seeing.</p>
    <p>Thanks a lot,</p>
    <p>TL</p>
