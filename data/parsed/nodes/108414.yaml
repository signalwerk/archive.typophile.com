      <p>Hrant, do you mean the <a class="freelinking external" href="http://www.nationalmuseum.ch/e/sammlung/wissenschaft_und_sammlungen/militaria_waffen.php" rel="nofollow">Arms &amp; Militeria Collection</a> at the National Museum?</p>
      <p>I enjoyed Zurich a great deal but visiting with my father we spent a great deal of time in places he had hung out in when he lived there aged 18-20, which is to say we sampled a great deal of beer and food. I did manage to get him over to the <a class="freelinking external" href="http://www.museum-gestaltung.ch/" rel="nofollow">Design Museum</a>, which was cool and does have at least <a class="freelinking external" href="http://www.museum-gestaltung.ch/en/exhibitions/annual-program-2014/weingart-typography/" rel="nofollow">one typographic exhibition</a> coming up.</p>
