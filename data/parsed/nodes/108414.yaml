      <p>If you’re interested in poster graphics, you should check out the Plakatsammlung (Poster Collection), although it seems they are in limited service these days.<br>
      <a href="http://www.museum-gestaltung.ch/en/collections/poster/" title="http://www.museum-gestaltung.ch/en/collections/poster/">http://www.museum-gestaltung.ch/en/collections/poster/</a></p>
      <p>There are some great museums and galleries in Zurich (and even more in Basel, which is an hour away).<br>
      If you want some printing/type/book-historical background I highly recommend the Swiss museum of paper, type and printing, which is in Basel: <a href="http://www.papiermuseum.ch/en/the-museum/" title="http://www.papiermuseum.ch/en/the-museum/">http://www.papiermuseum.ch/en/the-museum/</a></p>
