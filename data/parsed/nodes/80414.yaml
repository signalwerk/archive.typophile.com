      <p>Michelle, apologies for hijacking your post, and I did note that you put "corporate" in ironic quotes.</p>
      <p>How about Beton?</p>
      <p>It was the Bauer foundry's "Futura Slab Serif".</p>
      <p><a href="http://new.myfonts.com/fonts/urw/beton/t-demi/" title="http://new.myfonts.com/fonts/urw/beton/t-demi/">http://new.myfonts.com/fonts/urw/beton/t-demi/</a></p>
      <p>It actually sets very nicely as running text, not overly slabby, due to some subtle details, and I've seen it used recently as a news text face, quite successfully.</p>
      <p>It would also continue the back-to-the-future theme of Futura -- but only for those who know!<br>
      Lay folk would consider it quite contemporary and, uh, innovative, in the way that the squarish Eurostile and Bankers Gothic signify computer technology.</p>
