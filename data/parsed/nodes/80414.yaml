    html: |-
      <p>Problem is that typefaces can not speak of the future, as they are made today, or were made some time ago. A typeface can be innovative in a way, but it would be wrong to try to make the typeface (especially the body copy one) scream future, as this will result in some kind of science fiction, and we all know how dated they look after a while. Eurostyle would be my best be if you want to pursue this direction. </p>
      <p>But rather I would opt for a typeface that is fresh and new, which represents todays typeface fashion without being silly. Something like Sense by Nick Shinn, which is inspired by geometric faces like futura but updates it for today, might be a good bet. I have no idea if this would go well with futura though. But maybe there is a way to convince your client that this might be a better choice. Otherwise try to set futura is such a way that it looks fresh and new again. Many intelligent designers have made a rather common typeface work for them, giving it a new voice. I guess you are lucky to have Futura to work with, as it could have been a lot worse (Bauhaus, Eurostyle, Blippo, Digital or something as awful as that...)</p>
