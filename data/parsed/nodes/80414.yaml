    html: |-
      <p>I think Futura is way more timeless than most typefaces, actually. Futura allcaps are some of the most beautiful letters I know. Of course the are typical for an era as well, but so is helvetica or baskerville or scala. I have seen books with body copy in futura done quite succesfully actually, but it needs a fine sense of proportion. </p>
      <p>A Futura with optical sizes does seem like a great idea though, perheps with some alternates for letters like the lower case t. Then again you might also go for avenir, which is supposed to be a better futura.</p>
      <p>As for a companion. Perhaps Silica or Museo Slab would work? Or a modern serif font like Charter? I would not go for another sans-serif.</p>
