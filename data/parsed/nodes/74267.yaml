    html: |-
      <p>If you're going for this traditional look, you should probably use a slightly heavier version of Garamond (or similar old-style) for the footnotes. Sometimes called an "optical" size.</p>
      <p>Garamond Premier Pro is Adobe's latest version of the venerable style, and comes with "optical" sizes, as well as all the characters you would probably require for a thesis (including "true" superior figures for references).</p>
      <p>Once you get the page format laid out in such a face, then you can consider a titling font: it may be the Display optical font of Garamond, or something quite different -- maybe even a bold sans, which could also be used for subheadings.</p>
    html_clean: |-
