      <p>For indenting a paragraph, convention recommends "one lead" (the same value as your inter-linear spacing) or one <a href="http://en.wikipedia.org/wiki/Em_%28typography%29">em</a> (the same size as your type). I prefer one lead as it is more salient than an em. I do not use Microsoft products so I do not know how this is achieved in Word.</p>
      <p>Bringhurst, R. (2004). <em><a href="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881792063/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1245629770&amp;sr=8-1">The Elements of Typographic Style</a></em>. Point Roberts, WA. Hartley &amp; Marks, p. 40.</p>
    html_clean: |-
