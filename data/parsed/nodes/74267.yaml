    <p>Dear All - I'm new here, and looking for some advice.</p>
    <p>I'm currently writing up my phd thesis, and have decided to use garamond as the main font, but now I'd like something different as a font for the titles of the chapters, and the headers/footers.</p>
    <p>Any pointers to what might be suitable? Something more traditional, something less? I considered Bookman Old Style... </p>
    <p>I'm a natural scientist with no 'feel' for style whatsoever, and could use some help...</p>
    <p>Thank you!</p>
