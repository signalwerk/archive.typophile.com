      <p>I don't use word, but apple's Pages'09</p>
      <p>Anyway, it was quite easy - in the text inspector set the line spacing to 'exactly', and then I set it to 18pt. Then, under 'tabs', set the indent to 18pt, after you've changed the rulers to 'points' in the preference panel.</p>
      <p>It looks better now, thanks!</p>
