      <p>The purpose of small caps and old style figures is to lessen the visual overemphasis of words which must be set in all caps, and of numbers, especially years. As you have set them here, the HAMPS jump right off the page immediately. Could you try setting the acronyms in small caps, and the figures old style? That is the traditional way of working with a Garamond in text.</p>
      <p>The colour of the page as a whole is good.</p>
