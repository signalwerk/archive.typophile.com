      <p><cite>… mixing sans-serif with serif is a no-no, but don't even know if that is true anymore...</cite></p>
      <p>Nonono. This has never been true. Using a sans as a complementary font for serif bodytext is common practice. It all comes only down to the question: *which* sans?<br>
      You may do a search for “humanistic sans”, e.g. on MyFonts.com. You can make the site display all fonts found with a test word like “Hamburgefonst”. Take some time to look at it. You’ll notice that some sans faces owe certain aspects of their aesthetics to faces like Garamond - and therefor may fit the bill.</p>
