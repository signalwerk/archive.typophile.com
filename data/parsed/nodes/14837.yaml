      <p>I'm impressed by the good response I got, thanks a lot!</p>
      <p>Actually the paper is for me, I'm in a contest for a business coaching and funding program and all the papers are required to be set in Arial at 12pt, so I guess the client is going to be pleased with the change ;).</p>
      <p>Unica and Galaxie Polaris are very nice options which I would love to try but I only have Helvética and some weights of Azkidenz Grotesk so I think I'm going to stick to any of those two. </p>
      <p>Now I understand the reason behind asking such a specific setting: avoiding people to deliver business papers in 14pt Comic Sans... I even understand why the chose Arial: it's everywhere. But at 12pt? it looks huge and horrible to me. Sometimes they even ask Arial 12pt double spaced =/</p>
      <p>Unica seems to have a very tight setting, is it intended for text or display?</p>
      <p>Héctor</p>
