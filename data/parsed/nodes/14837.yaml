      <p>Héctor, I feel your pain. About once every 2 months I have to deal with an RFP that specifies "Arial 12 pt". What's worse, it will also have a page limit, and the engineers I work with consider that a challenge to cram as many words on a page as possible. The result is Arial set 12/12, on a 48 pica line. Makes me cringe, but I get a paycheck every 2 weeks.</p>
      <p>I think one option is to use arial, but use it well. Some very good typography has been done w/ grotesks. The fact that some really ugly typography has been done w/ arial shouldn't stop you from using it.</p>
      <p>Another option is to do a work-man job on a arial version, then do an excellent job on an alternate version w/ a different typeface. Use this as an opportunity to educate someone as to the joys of typography.</p>
      <p>Jay</p>
