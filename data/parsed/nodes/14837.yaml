      <p>Arial is like white bread. It's universally available, almost tasteless and nonetheless nice once in a time… I like it toasted with cream cheese and some paste of chili!</p>
      <p>OK – No joking: there is a whole history of imitation, plagiarism and so on with those ubiquitous sans serifs, BUT there is a reason why they are used so often.</p>
      <p>And being Dutch, I think you should use OUR copy (at least that's the one we had in our cases in the print shop of the academy) and that's called Folio (guess what: there are several digitized versions available, as far as I know, but so what, you process any of the others through FontLab and there is...).</p>
      <p>The latest one is an OpenType...</p>
