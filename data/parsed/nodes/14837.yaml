      <p><cite>Now I understand the reason behind asking such a specific setting: avoiding people to deliver business papers in 14pt Comic Sans… I even understand why the chose Arial</cite></p>
      <p>Héctor:</p>
      <p>It's also possible that they've asked for it in Arial 12pt to stop submitters trying to be creative with their typography so that they can concentrate on what the proposal actually says.</p>
      <p>In my experience, if they're asking so specifically for something, it's best to give it to them as asked. You may be penalised for trying to be creative :) While they may not notice the difference between your alternate choice and Arial in isolation, put next to a number of other documents all set in Arial 12pt, yours will stick out like a sore thumb.</p>
      <p>I'd just bite the bullet and go with Arial if I were you.</p>
      <p>Jordan</p>
