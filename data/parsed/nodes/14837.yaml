    <p>I have to present a business plan which is REQUIRED to be set in Arial 12pt, this made me feel sick and want to relinquish to a good business oportunity but I'm trying to figure my way out of this and I'm looking for a good Arial alternate besides Helvética which can make a good text work and not being evident to the untrained eye of the bureaucrat.</p>
    <p>Héctor</p>
