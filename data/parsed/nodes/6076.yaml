  html: <p>I've been working on a museum catalogue for an exhibition related to art from the kingdom of Ayutthaya in Thailand. The interior design is going well I think, but for some reason I'm stuck on the cover. I will post a couple of my rather uninspired versions here in two posts. The text font is Jenson, the display font, which you see here, is Industria, used on the inside in this same yellow color. I'm set with these faces for the interior. I'm also committed to this manuscript image for the cover. Can anyone help me to think more creatively about this?  <br> <br><img src="http://www.typophile.com/forums/messages/4100/42783.jpg" alt="blue"></p>
  html_clean: <p>I've been working on a museum catalogue for an exhibition related to art from the kingdom of Ayutthaya in Thailand. The interior design is going well I think, but for some reason I'm stuck on the cover. I will post a couple of my rather uninspired versions here in two posts. The text font is Jenson, the display font, which you see here, is Industria, used on the inside in this same yellow color. I'm set with these faces for the interior. I'm also committed to this manuscript image for the cover. Can anyone help me to think more creatively about this?  <br> <br><img src="http://www.typophile.com/forums/messages/4100/42783.jpg" alt="blue"></p>
