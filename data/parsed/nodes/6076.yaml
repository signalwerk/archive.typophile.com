    html: <p>Thanks, Daniel <br> <br>I was thinking about this last night, and I finally came up with some ideas to improve it, I think (starting from the first version but insetting the art and adding some rules).  <br> <br>Regarding the rounded fonts, I wanted to avoid the curvy look you see at Thai restaurants, which I think is kind of a cliche. My feedback at the museum is that this font does -- strangely -- evoke a bit of Thai quality. <br> <br>Tom</p>
