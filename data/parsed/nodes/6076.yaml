    html: <p>I prefer the first version, it's not so wishy-washy � sorry for the technical term! <br> <br>However, I've always thought that art from Thailand was characterised by amazing curves and colour. A font with rounded shapes and sharp corners may be more sensitive to the subject matter. <br> <br>The navy blue could be replaced with one of the brighter colours from the image (eg. a yellow or pink). <br> <br>Cheers <br> <br>Dan</p>
