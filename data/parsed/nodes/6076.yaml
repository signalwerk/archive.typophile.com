    votes: null
    html: "<p>Tom a couple of ideas: 1. Try making the color image smaller and offset it a bit asemtrical. Create some tension don't justify everything it looks like a text book. 2. Think matt/gloss use an aquious coating and then print a matt varnish leaving only the color image glossy. 3. Make the image smaller and instead of a solid background use a ghosted version of the color image full bleed in one color. 4. If you have it in your budjet, think in terms of embossing or stamping.</p>"
