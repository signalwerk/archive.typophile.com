      <p>So, a few months later: Are there any foundries out there that offer something like a gift card/voucher?<br>
      I'm facing another Christmas wish list where I'll probably settle for type books because for my relatives, the idea of buying me a font is… odd, and the process scary. But if there was the option for laymen to purchase a pretty gift card in a simple process (without having to think of licences, and EULAs, and all), and make a poor type-nut very happy, that'd be awesome.</p>
