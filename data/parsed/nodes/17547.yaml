      <p>Pretty pretty. The marca registrada over the I is a nice touch, IMHO.</p>
      <p>The type may want to be tracked out a bit; tightly-spaced caps carry less of an association with "elegance" and are sometimes hard to read.</p>
      <p>I am very, very glad to see there are still people who when asked to create a folk/pagan feel do not go straight to uncial lettering!</p>
