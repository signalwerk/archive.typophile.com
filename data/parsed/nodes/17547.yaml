    <p>Hi Guys,<br>
    I need help with this one! I am working on a logo for a clothing brand based in London. They are aiming at the very highest level of the streat/casual market, and selling worldwide. So the logo must work internationally. I have gone for an image to represent the pagan greenman god. The brand wanted, a folk/pagan feel but with a mix of traditional/modern style. It needs to be instatly recognisable and distinctive, and memorable.</p>
    <p>It will be used for prited catalogue, on garments, labels, stickers and web. It is still in development so colours can change.</p>
    <p>whats your thoughts?</p>
    <p>thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/merlin.jpg"></div><p></p>
