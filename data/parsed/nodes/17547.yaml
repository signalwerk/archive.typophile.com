      <p>The type is killing the potential. I love the direction of the horned man. But, scratch the type. With some illustrated like that you need to keep the type simple and the illustration separate from it. Fashion needs no explanation. Especially if this is going towards the level of high end Covent Garden or Notting Hill or wherever else is on point now. </p>
      <p>The two last versions you have posted ... the idea of the antlers and the M is interesting, but the typefaces you've chosen are too well known in other areas. I'd really keep the logo separate from the logotype.</p>
