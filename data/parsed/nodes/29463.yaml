      <p>Hi David, this is great stuff. It's got good proportions and contrast for a news face, and a groovy Italic. Though similar to the roman, the different shapes make it clearly italic in text. Will you add a bold? Especially for headlines it would be useful. Otherwise expect someone eventually to add a different, bold (probably sans) face to the layout for headlines. You could be the one to provide it! Consider making a condensed bold sans that matches the feel of this roman. </p>
      <p>I think some of the italic spacing could be opened up since the shapes are more complicated. Arches joining stems in Italic get thicker at joins; this is very nice in display but when I printed out the text, those areas fill in, making italic text look blotchy. Use this reverse tapering more in the display versions, where it is fun. The italic for text here needs more clarity in joins. Bottom center of italic w is most obvious example, h and m joins also noticeable. </p>
      <p>Contextual alternates are fun, but you don't need one for y. The y is visibly much more sloped than the rest of the italic. This shows a lot in text. You can fix it so the descender stays in it's own yard. Since there's so little room for descenders, consider cheating the bowl/arm of y up off the baseline a little as in the roman. You can also loosen up the shape by bringing the join of the tail up and right, like in d or u. To see what I mean, look at Palatino Italic. Test Q between every other capital; I bet QJ collides.</p>
      <p>Micro things: E and F too narrow, crossbar on E and F too tiny; newspaper types need clarity. E and F crossbar could have tiny vestigial serif like on s. Top and bottom bowls of g could align vertically more (looks tipping), and there should definitely be more space between the bowls; though the proportions and shapes are excellent, this is closing up and blotching in text. The outstroke on the bottom of e and c could be slightly beefier. Join of k in italic too close to stem, creates blotch. Italic f descender can be longer (but don't make it 'long' or wide). Diagonals of M, small cap M and N heavy. Tapering on diagonals of V and W too much. LC j tail pretty wide; you'd be surprised how narrow a j can be and still read well. X, x and small cap x have too much clotting in center. This is not the character to put a lot of reverse tapering into. The fi and fj ligs seem spaced looser than they would be by default. Match the regular spacing in these. They might want to join at the crossbar/serif. </p>
      <p>Finally, do some exhaustive print tests of kerning; though you never get everything, some important pairs will show up missing. </p>
      <p>This is going to be very good. Have fun in the home stretch! And please post scans of the printed newspaper when it comes out.</p>
