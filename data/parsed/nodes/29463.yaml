      <p>Hello folks,</p>
      <p>It's been a while, but I finally had the chance to take the above critiques under consideration and further develop my newspaper type family. Earlier in the month, a test version of it appeared in my college's newspaper, and so far, the response has been good. It was good to get the opportunity to see how the font held up to the printing conditions, and I'd love to hear what you think of the progress I've made.</p>
      <p>Attached at the top are PDFs containing clips from the newspaper layout (both digital and scans), a partial character set, and sample settings. Your comments on the design itself (overall and specific), how it looks in the scans, and anything else you'd like to share would be most valuable. I would be happy to mail an issue of the newspaper to anyone who'd like to see it in print.</p>
      <p>Again, thank you, and enjoy the holidays.</p>
      <p>David</p>
