      <p>Thank you all for your comments so far.</p>
      <p>Loren:</p>
      <p>I completely agree with you that the measure of the 4-column treatment is far too small for comfortable reading. However, that is the measure that columns in the newspaper are currently set at and I know that once this is out of my hands, someone will try it. I wanted to see how the type holds up. For a tabloid size newspaper (of which this would be a half page), what you loose in readability by using five columns across you gain in flexibility: our layout people want options when it comes to photo/article size and placement, and our pages tend to become static when divided into quarters. My compromise is to have the three wider columns (like the top article) for featured content, and then the thinner columns for news briefs, etc. I suppose the discussion of this layout might eventually deserve a post of its own in the typography critique section (and it will probably have one in due time), but in the mean time, any better solutions you may have are most welcome here.</p>
      <p>Carl:</p>
      <p>I've always had the intention of expanding this into a larger family (with a bold, a bold italic, display, and sans), and the comments so far make me think that it would indeed be worth it. I've actually already drawn out a sans for this, but it's rough and not digitized. I do agree with you that it needs one, though.</p>
      <p>I was worried that justification on a smaller measure might, in some cases, necessitate the slightest bit of tracking, but not necessarily enough to "break up" a ligature. With that in mind, I designed the font without ligatures, and used contextual alternates instead to avoid the collisions (or near misses) that occurred in the fi, fj (and the gy, but that y is another story). Is that a stupid reason to use contextual alternates, or does it make sense?</p>
      <p>Thank you for your careful observations on the details/micro things. As much as I really wanted that sloped italic y to work (believe it or not, it was actually more sloped in the original drawings), you're right: it's gotta go. And I'll plan on going through the entire italic and implementing some blotch control. And I'll deal with the diagonals' tapers, and…well…everything that you said.</p>
      <p>And while I have your attention, I really admire what I've seen of Beorcana.</p>
      <p>Alessandro: </p>
      <p>Thanks for pointing the kerning issue out Allessandro. Carl mentioned it too, so it looks like kerning and tweaking are going to be the focus of my efforts for the next couple weeks, seeing as I've only done basic AV-type kerns. As far as the left serifs on the m is concerned, is it something specific about that letter, or is your problem with the foot serifs seen across the font?</p>
      <p>Thanks again, and there's more to come.</p>
      <p>David</p>
