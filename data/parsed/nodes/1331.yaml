    html: "<p>&gt; Could I get them from you, Hrant? <br> <br>I think we can do this. Although the more I look at this design the more I want to do it myself! :-/ It seems to represent that \"missing link\" even more than I originally thought. I realized this in looking at the italic (for which I was happy to find a setting in English): <br> <br><a href=\"http://www.themicrofoundry.com/other/Javal_italic.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Javal_italic.gif</a> <br> <br>It's a slanted roman of the highest order - the best I've ever seen. Not a result of saving money (like the ATF slanted romans), but an ideology tempered with typographic intelligence (unlike the fanatical approach of Morison). I thought my Patria italic was progressive - this is much more so. And it was designed over a hunder years ago! <br> <br>But the roman is no slouch either. The whole seems to be what the Grandjean/Jaugeon effort was <i>supposed</i> to be, without the sterility of the Didone class. A new well of possibilities! <br> <br>-- <br> <br>The thing is, Chris, I'm not sure you even need me. There <i>must</i> be good specimens of this design. I think you should ask JFP for help in tracking those down (and in making sure nobody already has the rights to it - which I highly doubt). What you'd be looking for is Maison Deberny specimens from the late 19th century, or very early 20th. <br> <br>But let me know if you have other preferences of how to do this. Hey, maybe we should make it a Typophile collaboration? A revival might in fact be more managable for that model than an original creation - although not as intellectually challenging. <br> <br>hhp <br></p>"
