      <p>Notes accompanying my previous post:</p>
      <p>Untitled – Size 5, (Experimental typeface proposal), 1905 [Charles Dreyfuss/Émile Javal].</p>
      <p>Drefuss and Javal produced two sets of experimental letterforms embodying the principles set out in Émile Javal’s book. The following study looks at the “size 5”, the larger of the two unless direct comparisons are made. The font lacks typographic niceties, so looks unusual compared to other more refined typefaces like Fleischmann and Didot. Indeed the letters look like caricatures or cartoons of letterforms where their visual features are exaggerated. </p>
      <p>The bold nature of the design means that it will still be visible at very small sizes. Shapes are used with non reliance on the counters. Other ways have been introduced to differentiate characters from each other. The act of identification of the letters is more important than the act of reading, therefore the set of letters lack cohesion. Because the letters are made up of even width strokes and geometric forms, the tops of the characters tend to have the same appearance density. Javal himself points out that the top half of the letters are important in identifying the character, however the type developed from his ideas lacks adherence to this observation.</p>
      <p>In the type example given in the book [particulière se (fig. 68) p.229] some of the more challenging letters (in terms of structure) are omitted. These include the letters  k, j, y and z. This means that the Javal ‘Size 5’ proposal lacks a full set of characters which would have gone a long way to prove his case. Non completion of the character set possibly have contributed to a negative effect on the popularisation of his ideas.</p>
      <p>It is noted that the s looks very similar to the lowercase Didot s, which looks out of place with the other characters. The s does seem to be one of the most challenging letters when it comes to reduction and exhibiting it at a small size. The s could look to the proposed z from the smaller character set as a potential solution.</p>
      <p>Bibliography:<br>
      Javal, Émile. Physiologie de la lecture et de l'écriture. Bibliothèque scientifique internationale, 105. Paris: F. Alcan, 1905.</p>
      <p>Fleischman–Roman<br>
      Enschedé, Ch, Harry Graham Carter, Netty Hoeflake, and Lotte Hellinga. Typefoundries in the Netherlands, from the Fifteenth to the Nineteenth Century: A History Based Mainly on Material in the Collection of Joh. Enschedé En Zonen at Haarlem. Haarlem: Stichting Museum Enschedé, 1978.</p>
      <p>Didot Elder–Roman<br>
      Enschedé (Firm) type specimen</p>
      <p>_______________________________<br>
      Michael Hernan</p>
