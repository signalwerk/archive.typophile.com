    html: "<p>Volume 1 from the DP 1924 specimen has showings of the \"labeurs ordinaires\" which include all the Deberny fonts named by a series number or letter, namely 10, 11, 12, 14, 15 16, 17 or series A, E, G, K, O, X. There's no series #18 in this volume. (Incidentally this is the first book specimen to come from Deberny et Peignot as a merged company. Merger happened in 1923.) <br> <br>15, 16 &amp; 17 include the open  lower bowl design for l.c. \"g\" all in small sizes--until in 16, which goes to 30 &amp; 36 pt., then switches to a one story \"g.\" Strange! Can't tell which typeface is what you're looking for without taking some pics and looking at better ones from your book--they are all very similar. <br> <br>In this volume, #16 seems to be the most completed typeface, with more weights, from 5 pt. to 36, and even a showing of an initials font. <br> <br>What next?</p>"
    html_clean: "<p>Volume 1 from the DP 1924 specimen has showings of the \"labeurs ordinaires\" which include all the Deberny fonts named by a series number or letter, namely 10, 11, 12, 14, 15 16, 17 or series A, E, G, K, O, X. There's no series #18 in this volume. (Incidentally this is the first book specimen to come from Deberny et Peignot as a merged company. Merger happened in 1923.) <br> <br>15, 16 &amp; 17 include the open  lower bowl design for l.c. \"g\" all in small sizes--until in 16, which goes to 30 &amp; 36 pt., then switches to a one story \"g.\" Strange! Can't tell which typeface is what you're looking for without taking some pics and looking at better ones from your book--they are all very similar. <br> <br>In this volume, #16 seems to be the most completed typeface, with more weights, from 5 pt. to 36, and even a showing of an initials font. <br> <br>What next?</p>"
  - id: 10633
    user: 1250
    date: 2003-09-30T15:28:00
    date_raw: 30 Sep 2003 — 3:28pm
    votes: null
    html: "<p>Wow, Amelia, great!! (Thanks Kent.) <br>Yes, I saw that the Cary had that stuff, but wasn't expecting so much help so soon! <br> <br>As much as AMG seems fascinating, I don't need anything from it right now if you have actual Deberny specimens of the fonts in question. The fonts were made under the direction of Tuleu some time between 1878 and 1905, but I guess they were still selling them in 1923. They strike me as the sort of thing Charles Peignot wouldn't have liked, so maybe by the next specimen they got rid of them? Anyway, that's just a side question. <br> <br>&gt; switches to a one story \"g.\" <br> <br>First: switching to a monocular \"g\" for the display sizes makes perfect sense to me (it's great to see some people had already realized that and actually implemented it long ago*) because the binocular \"g\" is great for readability, but lacks harmony with the rest of the alphabet during conscious appreciation. I will be doing what Tuleu did in my own text fonts from now on. <br> <br>* I also like that old French style of old-style figures (with the 3 and 5 ascending) more than our general convention. <br> <br>That \"g\" is actually why I thought the #17 was the one I wanted. In the Javal book (which uses the #17 and the #18*) he shows a sample of the #16 at 30 point, and it has the mono \"g\". So I thought the #17 was the one I wanted. I'm still a little bit confused though because he also shows a 5 point sample of #16, and that has the mono \"g\" as well**. So I would most like to see samples of #15-#16 I guess. What do you see as the differences between them? And what are the chances you could provide a hi-res scan of the full character set? <br> <br>* Javal mentions the #18 as being a variation on the #17 (with longer descenders, bringing the 9 point forms to 10 point). Not sure where it ended up. BTW, he also mentions the 8 point #17 as being a short-descender version of its 9 point - which would make it a nice cheap method of optical scaling. <br> <br>** Could they have switched to a mono \"g\" at the bottom range as well, to cater to legibility?! That would rule even more. <br> <br>In case you're wondering why Chris and I like this design: <br>I think Chris likes it because he likes it (the best reason!), while I like it mostly because of its evolutionary singularity: it's like a \"missing\" offshoot from the Romain du Roi. I've been reading up on Fournier, Baskerville, Bodoni, Luce and Didot, and none of them are even close to it. Not even Grandjean had an italic that \"pure\". It's like an entire class of font that I'd never seen before. Both Chris and I would like to see it digitized - preferably by ourselves! BTW, do you see any legal/ethical complications with that? <br> <br>Waiting for a reply with bated breath!  :-) <br> <br>hhp <br></p>"
