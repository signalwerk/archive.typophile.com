      <p>I have been studying this work by Emile Javal, so naturally have ended up here.</p>
      <p>I should mention that the reference to page 226 makes more sence if you look on page 225 where M. Telu gets a mention as does the beginning of the turned paragraph thanks ‘La maison Deberny’.</p>
      <p>I think seeing the series 16 type as the missing link is interesting.</p>
      <p>As I try to transcribe and create a gist translation of Chapter XVII, I see that some of M. Javal talks about is a typographic missing link. He is making many observations some of which I have not specifically had related to me before, but were more inert understandings. </p>
      <p>He does have a somewhat methodical approach conducting his own experiments (apparently at home) and takes those results as a basis for his criticism.</p>
      <p>I wonder if M. Javal consulted with M. Telu at Deberney et Cie in the development of series 16 (He and M. Telu definatly communicated), or that his finding are much based on what was relayed to him by M. Telu. M. Javal taking it upon himself to push typography further. </p>
      <p>It has been good to see that kakaze continued with research and developed "Telu" - Good!</p>
      <p><a href="http://home.cfl.rr.com/kakaze/type/tuleuspecimen.pdf" title="http://home.cfl.rr.com/kakaze/type/tuleuspecimen.pdf">http://home.cfl.rr.com/kakaze/type/tuleuspecimen.pdf</a></p>
      <p>/u1</p>
