    votes: null
    html: "<p>It's interesting, isn't it? Kind of like a missing link in the evolutionary ladder between Baskerville and Didot. Some of the glyphs are superb, and rare. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16876.gif\" alt=\"Javal_detail.gif\"> <br> <br>Look at the power of the \"y\", and the functional elegance of the \"g\", and the interesting skewed \"v\", and the small x-height. It's tempting to think yet again: \"they don't make them like they used to\"... <br> <br>BTW, unlike the vast majority of legibility researchers, Javal had great typographic sensitivity (even though he recommended leading values most good contemporary typographers would see as too little - but I personally think whitespace is overrated these days). You can tell just by looking at the first page: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16877.gif\" alt=\"Javal_first1.gif\"> <br> <br>The first word of the whole book, the title \"Introduction\" has a footnote that's better than your average colophon! <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16878.gif\" alt=\"Javal_first2.gif\"> <br> <br>In the footnote he says that the typeface (in three sizes) was the work of Deberny (I guess before they joined with Peignot), but on that page 226 he doesn't add anything more about it. <br> <br>hhp <br></p>"
    html_clean: "<p>It's interesting, isn't it? Kind of like a missing link in the evolutionary ladder between Baskerville and Didot. Some of the glyphs are superb, and rare. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16876.gif\" alt=\"Javal_detail.gif\"> <br> <br>Look at the power of the \"y\", and the functional elegance of the \"g\", and the interesting skewed \"v\", and the small x-height. It's tempting to think yet again: \"they don't make them like they used to\"... <br> <br>BTW, unlike the vast majority of legibility researchers, Javal had great typographic sensitivity (even though he recommended leading values most good contemporary typographers would see as too little - but I personally think whitespace is overrated these days). You can tell just by looking at the first page: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16877.gif\" alt=\"Javal_first1.gif\"> <br> <br>The first word of the whole book, the title \"Introduction\" has a footnote that's better than your average colophon! <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16878.gif\" alt=\"Javal_first2.gif\"> <br> <br>In the footnote he says that the typeface (in three sizes) was the work of Deberny (I guess before they joined with Peignot), but on that page 226 he doesn't add anything more about it. <br> <br>hhp <br></p>"
