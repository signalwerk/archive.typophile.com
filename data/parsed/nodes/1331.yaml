    html: <p>The Dreyfus' alphabets are really interesting  <br>(the top one on your last post is quite ugly  <br>indeed, but I like the bottom one). <br>Now, why did he design them for Javal? Why is  <br>biggest size 5 pts? I suppose the size decision  <br>was very important to his research? <br> <br>And wasn't Javal blind by that time (<a href="http://www.ophthalmologytimes.com/ophthalmologytimes/article/articleDetail.jsp?id=28363" target="_blank">this article</a> <br>says he was completely blind by 1900!) ? <br></p>
