    html: "<p>This is classic: <br>\"His body was cremated with the exception of <br> his left eye, which he had promised to send <br> to Priestly Smith upon his death.\" <br> <br>Dreyfuss did the graphic work most probably because he was the illustrator (and a very good one, looking at his stuff in the book). I'm not sure when Javal evaluated Dreyfuss's alphabets, but I guess he must have still had enough of his vision, otherwise it would be pretty funny. The book must have come out some time afterwards*. On the other hand, Javal did continue to contribute greatly to science (including work on Braille) way after his blindness. He was da man. <br> <br>* <br>But he <i>must</i> have done the dedication in the book after going blind! <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16780.jpg\" alt=\"Javal_sig.jpg\"> <br> <br>That's better than my handwriting, and I have 20/15 vision! <br> <br>&gt; Why is biggest size 5 pts? <br> <br>I guess essentially because larger sizes are always legible if you give yourself enough time. Although Javal was the first to show that we read in saccades (and not in a flow), I don't think he -or anybody else- yet knew about boumas and such. Maybe he didn't realize that readability is distinct from legibility. <br> <br>Also, the chapter containing those alphabets is called <br>\"Th</p>"
