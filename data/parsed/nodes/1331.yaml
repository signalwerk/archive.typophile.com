    html: "<p>So I skimmed through Javal's book, reading some short passages, photocopying longer ones for later (who knows when...), and scanning up a few things. What might be relevant in this thread is a comparison of the two alphabets made by Dreyfuss for Javal (although it's not clear how much direct guidance he got). Except for that large sample I showed above, they're both shown reduced by a \"photoengraving\" method to very small sizes. The largest size is 5 point, and here's what they look like: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16606.gif\" alt=\"Javal_a.gif\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/16607.gif\" alt=\"Javal_b.gif\"> <br> <br>Javal concludes by saying that the first one doesn't go far enough while the second goes too far. <br> <br>-- <br> <br>Tiffany, I didn't see any explicit connections made by Javal with graphic minimalism (the Bauhaus per se didn't yet exist at his time), but I still think there's some commonality there, even though as JF says their conscious directions ended up very different. <br> <br>hhp <br></p>"
