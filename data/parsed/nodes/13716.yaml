    <p>The St Bride Printing Library is located in <a href="/node/add/wiki?edit%5Btitle%5D=London" title="Create node &quot;London&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">London</a>, <a href="/node/add/wiki?edit%5Btitle%5D=England" title="Create node &quot;England&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">England</a>. It is one of the largest libraries of printing history in the world. It’s collection particularly surveys British printing and typographic works from the 19th and 20th centuries. Its reading room is open to the general&nbsp;public. </p>
    <p>The <a href="/node/add/wiki?edit%5Btitle%5D=Friends%20of%20St%20Bride%20Printing%20Library" title="Create node &quot;Friends of St Bride Printing Library&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Friends of St Bride</a> has been organizing annual conferences in the library every autumn since 2002. These have all had a typographic focus. Past conference themes have included Hidden Typography, Bad Type and Temporary Type. 2005’s conference will be organized by Typevents on behalf of the Friends and the&nbsp;Library.</p>
