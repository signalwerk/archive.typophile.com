    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Libraries" class="freelinking" rel="nofollow">Libraries</a> : St. Bride Printing Library</strong></p>
    <p>The St Bride Printing Library is located in <a href="/wiki/London" class="freelinking" rel="nofollow">London</a>, <a href="/wiki/England" class="freelinking" rel="nofollow">England</a>. It is one of the largest libraries of printing history in the world. It’s collection particularly surveys British printing and typographic works from the 19th and 20th centuries. Its reading room is open to the general public. </p>
    <p>The <a href="/wiki/Friends%20of%20St%20Bride%20Printing%20Library" class="freelinking" rel="nofollow">Friends of St Bride</a> has been organizing annual conferences in the library every autumn since 2002. These have all had a typographic focus. Past conference themes have included Hidden Typography, Bad Type and Temporary Type. 2005’s conference will be organized by Typevents on behalf of the Friends and the Library.</p>
