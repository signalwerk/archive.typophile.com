    <div class="info">Submitted by <a href="/user/27336" title="View user profile.">Roger S. Nelsson</a> : 7.Apr.2009 1.05pm </div>
      <p>CheapProFonts is constantly growing, and we’re now spreading our wings a bit: some of our fonts are now also available on MyFonts - and more are on their way! :)<br>
    Because of this I had to spend some time preparing new files and graphics etc. so the releases of new reworked fonts has been a bit further between - but I still keep a respectable pace.</p>
    <p>In this news release I present the following 9 fonts:<br>
    - 3 from Ronna Penner<br>
    - 2 from Ray Larabie<br>
    - 1 from Nick Curtis<br>
    - 1 from Brian Kent<br>
    - 1 from Kimberly Geswein<br>
    - 1 from myself! ;)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-NEWS-09-01_450_4758.gif"></div><p></p>
    <p>Because of a recent policy change by Microsoft (and others) regarding the encoding of Romanian I have started updating all the released fonts to make them compatible with this practice. This updating will continue inbetween new releases.</p>
    <p>CheapProFonts is dedicated to supplying high-quality OpenType and TrueType fonts for setting “foreign” languages (languages requiring more than the basic A-Z characters) for professional Mac and Windows users.<br>
    Check our site for constant new releases, and see you in the next newsletter!</p>
    <p>Roger S. Nelsson<br>
    --<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
