    html: |-
      <p>How committed are you to the open bowls? b and q are pretty, but readers will stumble over the slight h-ness and y-ness of them. They would be easier to read if you closed them, or closed that end of the curve and opened the other end. Actually, I would recommend b completely closed, q open on the bottom, and p and d as they are (but fixed as Bill said). a, on the other hand, would not be hurt by an open bowl, so you could experiment with that.</p>
      <p>a has some of the same weight problem as d. The top terminal of f might be a little heavy.</p>
