      <p>At first glance, the things I notice are:</p>
      <p>d: There seems to be a lump on the bottom left of the outside curve that should be sanded off. The b looks good, so base your proportions for the d on it. It looks like the counter  of the b is a little bit wider than the d, too.</p>
      <p>f: The crossbar is too square.<br>
      t: The crossbar is too rounded. Something more like a rounded rectangle would be less obviously computer generated, but you may want to do it by hand. Look at a closeup of Garamond or Arno or anything based on metal type. They are generally rounded, but not necessarily evenly.</p>
      <p>p: Looks well proportioned.<br>
      q: Looks less well proportioned. I would take the b, flip it, and change the serif because you got it right on the b.</p>
      <p>Overall it looks nice. I think the c, b, r, and k look really good. I think the bottom serifs look a bit fat—I'd rather see them toned down a bit—but that's just my personal preference.</p>
      <p>Nice work.</p>
