    html: |-
      <p>FontShop has a managed program of font development and release, and probably other foundries plan ahead like that. After all, once one has committed to a prototype design, it can take many months to produce the full range of fonts for that face, with all the language support and OpenType features.</p>
      <p>However, I don't think the idea has occurred to anyone in this business that we should "pre-release" out type plans, to assist designers in coordinating their type choices with other aspects of design.</p>
      <p>Fear of having some other foundry steal one's thunder by rushing a cheap and nasty version of the idea to market (as happens in the fashion/clothing industry) is no doubt the reason.</p>
      <p>It's hard to say which of the trends popular in 2010 will continue.<br>
      I would say wait till all the "Best of 2010" reviews (especially Typographica) come out, then make your analysis.<br>
      Your prediction will be as good as the pros.<br>
      Besides which, you have the opportunity to lead, rather than follow.</p>
