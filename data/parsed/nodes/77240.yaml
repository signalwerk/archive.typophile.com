      <p>Hello, I was reading Computer Arts Project on editorial design which had some great insights on a change of fonts/typefaces and layout terms in magazines and newspapers. If you are more into the custom type try looking at Los Logo book. New trends on typography change depending on the materials, methods and tools you use.</p>
      <p>source:<br>
      You can buy the magazine from Future Publishing<br>
