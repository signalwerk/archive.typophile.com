      <p>Hi Jiggy,<br>
      well, my 2cents have to be taken with tweezers as I'm just web designer, not type designer so I guess you should received better answers than mine.<br>
      But I just wanted to share my thoughts with you.<br>
      If you could wait until January I think you could red some interesting articles from <a href="http://www.fontshop.com/blog/" rel="nofollow">FontFont blog</a> and John Boardley's blog "<a href="http://ilovetypography.com/" rel="nofollow">I Love typography</a>". Both have "Favourite fonts in year list" (I think it should be published at the beginning of 2011) and would probably be an interesting overview of some 2010 typefaces uses.<br>
      If you want to take a look at last year list :<br>
      FontFont : <a href="http://www.fontshop.com/blog/?cat=76" rel="nofollow">Type Trends 2010: Our Picks for the New Year</a><br>
      ILT list : <a href="http://ilovetypography.com/2010/01/21/my-favourite-fonts-of-2009/" rel="nofollow">My favourite fonts of 2009</a>.<br>
      I hope it could give you some ideas.<br>
      ++</p>
