      <p>The numerals look like <a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-next/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Akzidenz Grotesk</a>, but the rest of the letters look more like <a href="http://www.myfonts.com/fonts/urw/news-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">News Gothic</a>, slightly squooshed, although the J is not right. <a href="http://www.myfonts.com/fonts/linotype/basic-commercial-lt/light/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Basic Commercial Light</a> is a fairly close match too (based on AG, I believe).</p>
      <p>- Mike Yanega</p>
