    html: <p>I don't think that's Akkurat. Esp the numerals are quite different; also, look at the difference of the crossbar lengths in the E; and even in a squooshed version I don't think Akkurat's S would end up with such an unharmonic diagonal. I'm unsure what it could be, though.</p>
