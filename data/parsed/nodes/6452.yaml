    html: <p>Of course, I realize that. But what if the logo was for a real estate company, or a construction firm (since it does look like a house)? It gets much harder the more abstract the logo gets.  <br> <br>Darrel, you aren't really searching for the images, but rather the <i>name</i> of the image. I think there ought to be some rought pattern matching ability out there that would allow a next-generation Google to offer what I described.  <br> <br>And it's not just images. Imagine a search engine that would allow you to match "That song that goes, dun-dun-dun-dah..." Right now, you have to know the artist, or (part of) the title, or understand the lyrics enough to search for those. <br> <br>Sorry, I'm drifting off topic <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
