    html: |-
      <p>I've wondered this myself. I always thought the Y was custom, but I guess it's not.</p>
      <p>I just hate that they shut down <a href="http://en.wikipedia.org/wiki/Opryland_USA" rel="nofollow">Opryland USA</a> and turned it into "<a href="http://www.oprymills.com" rel="nofollow">Shopryland</a>" but kept the <a href="http://www.gaylordhotels.com/gaylordopryland/" rel="nofollow">Hotel</a>. Oh well, I guess the mall is pretty cool. I used to shop there a lot when I worked a couple of miles from there.</p>
      <p>At least we've still got <a href="http://www.opry.com/" rel="nofollow">The Grand Ole Opry</a>, which splits its time between the Opry House and The Ryman. (My mom was an usher there in high school, as were both of my parents in college.)</p>
      <p>Viva Nashvegas!<br>
      Anyway, to get back on topic, Augustea does look right. Nice work, Mike.</p>
