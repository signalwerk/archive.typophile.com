      <p>This was also sold by Image Club in a solid form as "Aurea Titling" (there was an Open version as well, called Aurea Inline). This was dropped between the time Image Club was acquired by Adobe and the point at which they ended up with Monotype Imaging. The only Aurea they sell now is a completely different font.</p>
      <p>- Mike Yanega</p>
