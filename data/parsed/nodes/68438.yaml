    <p>Hey Everyone,</p>
    <p>I'm stumped. Does anyone here know how to detect reversed postscript hints using Python in FontLab? </p>
    <p>Here's what I tried:<br>
    <code><br>
    font = fl.font<br>
    glyphs = font.glyphs</code><br>
    <code><br>
    for index in range(len(fl.font)):<br>
    	glyph = fl.font[index]<br>
    	vhw = glyph.vhints.width<br>
    	if len(vhw) &lt; 0:<br>
    		print glyph.name, vhw<br>
    </code></p>
    <p>I find there are two things wrong here (but I don't know how to fix them).<br>
    1. FL py reports width as not being an attribute of hhints<br>
    2. <code>len(vhw) &lt; 0</code> returns nothing even when I know those instances are present </p>
    <p>Any help is appreciated.</p>
