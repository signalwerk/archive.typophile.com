    html: <p>I'll play with the type later - but just wanted to comment - the H in the middle was "accidental" I had the structure in place when I saw it and clipped one more path then I originally had designed and the H was there. It is supposed to refer more to the structural and engineering components as well as sheets of steel being molded or manufactured the H is I guess just an easter egg. I agree that the type is somewhat lackluster, but not sure how far I can really go before it competes with the symbol - I like teuton - I also like Scotts suggestion of maybe even going smaller - I don't  really think that I want the two to really "interact" per se I want to keep them in seperate zones (rambling off the top of my head I really need to think about it) thanks for the suggestions so far guys!!!</p>
