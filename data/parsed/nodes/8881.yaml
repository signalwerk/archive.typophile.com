    html: <p>Well you certainly can't do any worse than what they had. <br> <br>Your graphic is interesting. To be honest, I didn't see the "H" for the first 10-15 sec, but now I can't see anything else. I wonder if there is a way to emphasize the "H" without ruining the sophisticated subtlety you've accomplished. It's neat, but I think 10-15 sec is a long time to figure it out. Maybe I'm just an idiot. <br> <br>I'll bet you can find more interesting logotype. Perhaps something more substantial. Those boxes (metal sheets, or whatever) create a pretty strong graphic, with a heavy "H" contained within, while that logotype seems really weak in comparison (style, weight and color). The type also seems disjointed from the logo. I would say to either make the type heavier and make it interact more with the graphic or make it much smaller, as a contrasting complimentary element to the graphic. <br> <br>Aloha! <br>Scott</p>
    html_clean: <p>Well you certainly can't do any worse than what they had. <br> <br>Your graphic is interesting. To be honest, I didn't see the "H" for the first 10-15 sec, but now I can't see anything else. I wonder if there is a way to emphasize the "H" without ruining the sophisticated subtlety you've accomplished. It's neat, but I think 10-15 sec is a long time to figure it out. Maybe I'm just an idiot. <br> <br>I'll bet you can find more interesting logotype. Perhaps something more substantial. Those boxes (metal sheets, or whatever) create a pretty strong graphic, with a heavy "H" contained within, while that logotype seems really weak in comparison (style, weight and color). The type also seems disjointed from the logo. I would say to either make the type heavier and make it interact more with the graphic or make it much smaller, as a contrasting complimentary element to the graphic. <br> <br>Aloha! <br>Scott</p>
