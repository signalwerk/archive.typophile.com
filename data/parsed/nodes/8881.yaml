  html: <p>This logo is for a local steel working/manufacturing company. They do engineering, machining, die making, yadda yadda yadda... <br> <br>All of their marketing pieces thus far are just bad. You look at it and immediately you know their office has dark brown plywood paneling just  from the look of it. anyway - we are trying to move them to a more sophisticated look. We are getting ready to produce a catalog for them and are trying to sell them on a new identity. Below is my first finished stab - will probably comp out 1 or two more... Any ideas or reactions? <br> <br>You can see the old and scary at <a href="http://www.jrhoe.com" target="_blank">www.jrhoe.com</a><img src="http://www.typophile.com/forums/messages/29/63889.jpg" alt="Hoe Logo"></p>
  html_clean: <p>This logo is for a local steel working/manufacturing company. They do engineering, machining, die making, yadda yadda yadda... <br> <br>All of their marketing pieces thus far are just bad. You look at it and immediately you know their office has dark brown plywood paneling just  from the look of it. anyway - we are trying to move them to a more sophisticated look. We are getting ready to produce a catalog for them and are trying to sell them on a new identity. Below is my first finished stab - will probably comp out 1 or two more... Any ideas or reactions? <br> <br>You can see the old and scary at <a href="http://www.jrhoe.com" target="_blank">www.jrhoe.com</a><img src="http://www.typophile.com/forums/messages/29/63889.jpg" alt="Hoe Logo"></p>
