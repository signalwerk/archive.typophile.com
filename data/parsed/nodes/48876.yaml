      <p>In 2004, Larry Oppenberg wrote the following to the ATypI mailing list:</p>
      <p>"New Baskerville was developed by John Quaranta with assistance from staff designers in the Manhattan drawing office of Mergenthaler Linotype. I can say so for sure since I worked there at the time. The "New" was primarily the development of Semi Bold and Black weights with italics to complement the pre existing Regular and Bold weights with italics which were also tweaked somewhat. Matthew Carter had no involvement with the project and if you ask him he will tell you so. The designs were later licensed to ITC. The original New Baskerville master drawings reside at the Museum of Printing in North Andover Massachusetts, complete with title block signatures of John Quaranta. If you come visit you can see them first hand. BTW, the same people/same process applies to New Caledonia."</p>
      <p>To which Matthew Carter responded:</p>
      <p>"Larry is right. I'm not sure how the confusion came about, unless perhaps because I was working on Baskerville Greek (with Tim Holloway) for Linotype at about the same time. In the interests of accuracy I have asked Linotype to remove my name from the design credit for New Baskerville on their website."</p>
