  html: <p>I recently acquired a copy of Word Perfect that was being thrown out... and got a truckload of Bitstream fonts as a result. While I know a bit about some Bitstream fonts (Aldine 721, for example, seems to be a quite well-regarded Plantin revival), I was wondering what people think of their Baskervilles (they seem to have two) I can't find uch about them online, but I figure that if anyone knows anything, they're likely to be here...</p>
