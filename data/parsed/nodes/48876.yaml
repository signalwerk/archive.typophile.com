      <p>I can't shut all the windows down now to take a serious look, and of course, I don't know just which Bitstream Baskerville you have. . . . </p>
      <p>But remember that Bitstream was started by Mike Parker (formerly of Linotype) and Matthew Carter (formerly of Linotype), and that Carter was heavily involved in the making of Linotype's New Baskerville. I'd bet new donuts to old dollars that at least one of the Bitstream Baskervilles is a slight improvement on *New Baskerville* -- except that Bitstream, at least in the early days, didn't have old-style figures &amp; small caps. You use to be able to buy the Linotype sets of just os figs &amp; small caps quite cheaply; dunno if that is still true. New Baskerville is basically a text font, &amp; text really deserves old style (aka text) figures.</p>
      <p>FWIW</p>
