      <p>Bill, somewhere in my emails I have a message from Matthew saying he wasn't involved with the Baskerville Greek fonts often attributed to him, but he didn't mention &amp; I wasn't aware he had little involvement in the New Baskerville project itself. </p>
      <p>Wouldn't surprise me too much though, a lot of the work on fonts was done by various people in the drawing rooms at Linotype &amp; Monotype, and of course by committees. A project like NB which is in some sense a *revival* would probably be attributed to a particular person only if they took an strong interest in shepherding it through, as happened with Monticello.</p>
      <p>And yes, it would be nice to have the supplemental characters for the older Bitstream fonts.</p>
