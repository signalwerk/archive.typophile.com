      <p>Charles, I think I can remember Matthew Carter telling me that New Baskerville was not his project and he couldn't imagine who first attributed it to him. As I remember it, he said that NB was basically a 'Linotype Design Studio' affair. The Bitstream cut of Baskerville I am thinking of was supposed to replicate a particular Lino metal cut. Also, it's a mistake to assume that Bitstream didn't have OSF, SC, and other glyphs. I have made the same error. What they sold does not reflect the wealth of data that was actually designed, redesigned, and digitized. </p>
      <p>There has been a desire at Bitstream to get some of this rich data out there, but it appears to be somewhat stymied, perhaps because of lack of standardization. That reflects the dreadful productization problem you face the minute you move away from a limited T1 font.</p>
