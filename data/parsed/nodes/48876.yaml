    html: <p>One of the Bitstream cuts is supposed to be very closely based on a Linotype version of Baskerville which was a favourite with book designers mid-20th century. What its precise name is, or how good it really is, I don't know, but there is a certain amount of refined buzz surrounding it.</p>
