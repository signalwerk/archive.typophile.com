      <p>I have found this information from my copy of an internal document describing Bitstream's library. The author is probably Mike Parker.</p>
      <p>Bitstream Baskerville: 'The present design is an accurate recutting, with particular attention to George W. Jones's revision from the metal of Baskerville's English (14 pt) roman and italic in 1929 . . . .'</p>
      <p>Bitstream Transitional 404, Baskerville No. 2: 'This redesign is made from proofs, rather than the metal, and so is heavier, with particular attention to the Harris and the Monotype revision, which was made from proofs of Baskerville's Great Primer (16 pt)'</p>
      <p>for what it's worth! No. 2 doesn't look that heavy to me - - certainly nothing like the fabulous Monotype metal family!</p>
