    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Font%20Retailers" class="freelinking" rel="nofollow">Font Retailers</a> : FontShop</strong></p>
    <p>FSI FontShop International (<a href="http://www.fontshop.com" rel="nofollow">www.FontShop.com</a>) was founded in Berlin in 1988 by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> and <a href="/wiki/Joan%20Spiekermann" class="freelinking" rel="nofollow">Joan Spiekermann</a>, who were then husband and wife. FontShop is the original font reseller in digital type history. There are 6 independent FontShops (licensors of the FontShop concept) in Europe, Australia, and the USA.</p>
    <p>FSI produces the <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> typeface library and publishes <em><a href="/wiki/FontBook" class="freelinking" rel="nofollow">FontBook</a></em>, the most comprehensive printed reference on digital typefaces. In 2000 FSI started a royalty free image company called <a href="/wiki/fStop" class="freelinking" rel="nofollow">fStop</a> (<a href="http://www.fstopimages.com" rel="nofollow">fStopimages.com</a>).</p>
    <p>FontShop also produces the publication <em><a href="/wiki/Font" class="freelinking" rel="nofollow">Font</a></em>.</p>
    <p>In addition to <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFonts</a>, FSI sells fonts from the following foundries: <a href="/wiki/2Rebels" class="freelinking" rel="nofollow">2Rebels</a> / <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> / <a href="/wiki/Agfa" class="freelinking" rel="nofollow">Agfa</a> / <a href="/wiki/Altered%20Ego" class="freelinking" rel="nofollow">Altered Ego</a> / <a href="/wiki/ARS%20Type" class="freelinking" rel="nofollow">ARS Type</a> / <a href="/wiki/B%2526P" class="freelinking" rel="nofollow">B&amp;P</a> / <a href="/wiki/Baseline" class="freelinking" rel="nofollow">Baseline</a> / <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a> / <a href="/wiki/Carter%20%2526%20Cone" class="freelinking" rel="nofollow">Carter &amp; Cone</a> / <a href="/wiki/Club-21" class="freelinking" rel="nofollow">Club-21</a> / <a href="/wiki/Dalton%20Maag" class="freelinking" rel="nofollow">Dalton Maag</a> / <a href="/wiki/Device%20Fonts" class="freelinking" rel="nofollow">Device Fonts</a> / <a href="/wiki/DSType" class="freelinking" rel="nofollow">DSType</a> / <a href="/wiki/Electric%20Typographer" class="freelinking" rel="nofollow">Electric Typographer</a> / <a href="/wiki/Elsner%2BFlake" class="freelinking" rel="nofollow">Elsner+Flake</a> / <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a> / <a href="/wiki/Emtype" class="freelinking" rel="nofollow">Emtype</a> / <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a> / <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> / <a href="/wiki/Fontpartners" class="freelinking" rel="nofollow">Fontpartners</a> / <a href="/wiki/Fountain" class="freelinking" rel="nofollow">Fountain</a> / <a href="/wiki/GarageFonts" class="freelinking" rel="nofollow">GarageFonts</a> / <a href="/wiki/Gestalten" class="freelinking" rel="nofollow">Gestalten</a> / <a href="/wiki/Holland%20Fonts" class="freelinking" 