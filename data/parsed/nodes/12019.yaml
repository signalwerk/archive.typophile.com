    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12066" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Retailers</a>&nbsp;:&nbsp;FontShop</strong></p>
    <p><span class="caps">FSI</span> FontShop International (<a href="http://www.fontshop.com">www.FontShop.com</a>) was founded in Berlin in 1988 by <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Joan%20Spiekermann" title="Create node &quot;Joan Spiekermann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joan Spiekermann</a>, who were then husband and wife. FontShop is the original font reseller in digital type history. There are 6 independent FontShops (licensors of the FontShop concept) in Europe, Australia, and the <span class="caps">USA</span>.</p>
    <p><span class="caps">FSI</span> produces the <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> typeface library and publishes <em><a href="/node/30367" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontBook</a></em>, the most comprehensive printed reference on digital typefaces. In 2000 <span class="caps">FSI</span> started a royalty free image company called <a href="/node/add/wiki?edit%5Btitle%5D=fStop" title="Create node &quot;fStop&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">fStop</a> (<a href="http://www.fstopimages.com">fStopimages.com</a>).</p>
    <p>FontShop also produces the publication <em><a href="/node/13544" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font</a></em>.</p>
    <p>In addition to <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFonts</a>, <span class="caps">FSI</span> sells fonts from the following foundries: <a href="/node/12031" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">2Rebels</a> / <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> / <a href="/node/add/wiki?edit%5Btitle%5D=Agfa" title="Create node &quot;Agfa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Agfa</a> / <a href="/node/add/wiki?edit%5Btitle%5D=Altered%20Ego" title="Create node &quot;Altered Ego&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Altered Ego</a> / <a href="/node/add/wiki?edit%5Btitle%5D=ARS%20Type" title="Create node &quot;ARS Type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">ARS</span> Type</a> / <a href="/node/add/wiki?edit%5Btitle%5D=B%26P" title="Create node &quot;B&amp;P&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">B&amp;P</span></a> / <a href="/node/12047" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Baseline</a> / <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream</a> / <a href="/node/add/wiki?edit%5Btitle%5D=Carter%20%26%20Cone" title="Create node &quot;Carter &amp; Cone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Carter <span class="amp">&amp;</span> Cone</a> / <a href="/node/30820" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Club-21</a> / <a href="/node/13677" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Dalton Maag</a> / <