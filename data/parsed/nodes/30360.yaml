  html: |-
    <p>I’m trying to ID a few typefaces from this website. It’s a very simple, functional layout—but completely inaccessible. I’m doing an accessible, standards compliant redesign but would like to leave the appearance intact as far as possible.</p>
    <p><a href="http://shopsinsgeneralstore.com/">http://shopsinsgeneralstore.com/</a></p>
    <p>The background image used to display most of the content is <a href="http://shopsinsgeneralstore.com/media/generalnewlayoutb.gif">http://shopsinsgeneralstore.com/media/generalnewlayoutb.gif</a></p>
    <p>Specifically, I’d appreciate help identifying the headlines, e.g. Order Blank, and the primary text. To my (very untrained) eye, it looks like the entire page uses two typefaces.</p>
    <p>Thank you for your time and assistance.</p>
