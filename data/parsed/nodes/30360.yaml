    html: |-
      <p>Judging from the italic p, I would rule out Monotype Baskerville, or URW’s Baskerville, which doesn’t even have a true italic. The W rules out any of the Old Style,or Fry’s Baskerville’s, that have a middle serif. It’s a little hard to see the details clearly enough but I would guess either ITC New Baskerville, or Baskerville No.2 from Bitstream. </p>
      <p>- Mike Yanega</p>
