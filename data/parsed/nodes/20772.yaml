      <p>OK Guys!</p>
      <p>I understand the name problem. Let's leave it because we can change that. We are not in the phase where we can't.</p>
      <p>The fill in problem. I don't think it would happen because,<br>
      1. Printing on a T-shirt - (as you know for sure) - It is a different technique. So that is another topic.<br>
      2. 300 dpi - fairly enough for even more detailed graphics-if you use black-it is a SPOT color. There are no dots-That's why we can print out 3 pt letters. :)<br>
      3. Fax/Photocopy - Let's use bigger logo and letters! :)<br>
      I use 9 pt letters even for the address...ect.</p>
      <p>But the "size" connection between the wordmark and the illustration= The word mark is too big - I agree.</p>
