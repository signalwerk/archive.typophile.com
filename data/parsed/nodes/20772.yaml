    html: <p>Even at that size, your logo (inc. Quicky) wordmark will still be large. Post it back, along with your wordmark, and you'll see that it's still big. Even in print at a smaller size, this will fill in because it's fiddly and you also have to take into consideration what it looks like when photocopied/faxed and signage/t-shirts/whatever else that is printed but not necessarily high quality. Also Tim's picked up on a big point - here in the UK, the word Quicky would carry the connotation of a quick shag - maybe the guy's bed-hopping? ;)</p>
