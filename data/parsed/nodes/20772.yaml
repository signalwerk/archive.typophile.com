    html: |-
      <p>Ear, nose, temple, hands, t-shirt sleeve, forearms, creases on both thighs are all losing detail in your smaller image, print it on newsprint or in a phone book and it will have trouble, it's not just the dpi but the absorbency of the paper, the pressure used to pass on the ink for both gravure and litho, coarse screen for screen printing etc. but if you can live with that then that is your choice. Equally important to my mind is that the figure seems to be jumping for no particular reason (unless he has just had a quicky:)<br>
      Tim</p>
