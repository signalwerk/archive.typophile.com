      <p>It wasn't the best try maybe, but my goal is to create a logo wich is not talking about the design but talking about my feelings about design.<br>
      What I think of graphic design: it's freedom but without control U R not jumping but falling...<br>
      I'm bored with minimalism and useless simplification. Most of the cases -in logodesign for xmpl- simplification comes from the lack of drawing ability.<br>
      So in my case the base -wich is drawing- very important.<br>
      So i think this way of thinkink is also OK:<br>
      "Wich firm? Ah! The jumpig guy!"<br>
      Is it really important to underline the Graphic design?<br>
      For xmpl "xy interactive"-with a jumpig guy , it is up to you what u r thinking about the illustration wich articulates freedom...</p>
