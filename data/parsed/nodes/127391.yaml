    html: <p>Bringhurst and Hochuli/Kinross were my Bibles as I learned the craft of book design. Rich Hendel's book, too. As I got more experienced, I began to see that there was an art to it as well. All of which is to say I came to mix and match things that looked attractive to my eye, taking into account what types the material called for and at what size and leading. You have to trust your instincts applied to what you've learned, without doing "cute" design that distracts the reader.</p>
