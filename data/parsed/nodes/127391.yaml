    html: |-
      <p>Steve, I agree: Richard Hendel’s books (“On Book Design” and “Aspects of Contemporary Book Design”) are great reads in addition the Bringhurst’s bible. I also enjoyed Jan Tschichold’s essays.</p>
      <p>Nick, I’m by far no expert in book design but I enjoy it very much. What helped me most was trial-and-error, which is probably what Steve is also saying. Jump into a design, print it, and look at it. Tweak it a dozen times, print them, spread them all side-by-side, and feel out which works best for you. I found that it’s not just the dimensions of the page and text block, but the interplay of typeface, letter- and line spacing (defining the “color” of the text block), text block dimensions and placement wrt. page dimensions, and so forth.</p>
      <p>Most of all… have fun :)</p>
