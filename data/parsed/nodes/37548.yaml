    html: |-
      <p>It's a problem with the hinting.<br>
      If you're making bitmap files, the answer is simple: just work larger and scale down.<br>
      Play around with different screen magnification -- with the exception of fonts which have been painstakingly hinted size-by-size for screen (and there are very few of these) most fonts have non-size-specific hinting instructions which fall victim to glitches at certain sizes.</p>
