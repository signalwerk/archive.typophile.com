    <p>Hello forum,</p>
    <p>I get vodafone invoices and really want to use the font they use for my own letters. However, I have no clue which font they use. Note that I'm not after the logo font... I'm after the font they use for everything else besides the logo. Take a look at this image to see what I mean:</p>
    <p><a href="https://my.vodafone.nl/Vodafone/Images/fact-exam-1.gif" title="https://my.vodafone.nl/Vodafone/Images/fact-exam-1.gif">https://my.vodafone.nl/Vodafone/Images/fact-exam-1.gif</a> (sorry for the inferior quality but I couldn't find anything better...)</p>
    <p>Many thx!</p>
