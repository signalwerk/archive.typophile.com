    html: |-
      <p>Beautiful lettershapes.  In the text setting, I notice<br>
      - Apart from the r, the c and o seem significantly too wide.<br>
      - n, m, h are indeed problematic. I do like the tension between the differently angled strokes, it would be great if you could make that work. I agree that increasing the the angle of the whole letter might be a good start<br>
      - The u appears too upright.</p>
      <p>Hope that helps!</p>
      <p>Tim</p>
