    html: |-
      <p><em>But what’s cool about a diagonal subpixel stripe?</em></p>
      <p>Uniform x and y direction resolution enhancement. It happens that Latin italics tend to have slant angles that benefit particularly from vertical subpixel stripes, but there are other aspects of Latin letterforms that do not benefit from that arrangement, and then of course there is the whole wide world of other writing systems in which there is a great diversity of strokes and bowls to be accomodated. Providing uniform x and y resolution enhancement accomodates more things better than x direction only. The rendering of Latin italics might not be as good — but at 200 dpi, who is going to notice? —, but many other things should be better (Arabic, for example, and other writing systems with strong horizontal features and shallow curves).</p>
