      <p>The caption to these photos reads</p>
      <p><em>Photos about typography on the 200dpi OLPC screen.</em></p>
      <p><strong>200dpi</strong></p>
      <p>This was news to me, because I guess I hadn’t been paying much attention to the display side of the OLPC story. Oh, and apparently the subpixel stripes are diagonal. Very cool.</p>
      <p>This rather supports the theory that the reason screen displays have not improved in resolution as anticipated ten years ago is that most commercial software doesn’t scale well, not because of inherent difficulty or cost in making higher resolution screens.</p>
