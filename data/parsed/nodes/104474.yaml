      <p>It must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Plantin%20Condensed%20-%20Bold&amp;fid=27a3ccec4540910d75fcecf41ccef110&amp;fsize=60&amp;text=Tillamook&amp;fit=1" rel="nofollow">Plantin Condensed (Bold)</a></strong> by Frank Hinman Pierpont (1991, available from Adobe, Monotype, Linotype)<br>
      It looks manually emboldened and the /k is probably a bit customized.</p>
