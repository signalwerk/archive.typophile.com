    <p>Hi!</p>
    <p>It's now four weeks since the launch of Village. If you hadn't heard the news, we're a type co-op; the union of ten (soon to be twelve) young type foundries who have decided to go it alone, together. vllg.com is the information channel and boutique storefront for this group of equals.</p>
    <p>The members of our group hail from Canada, Finland, Germany, Greece, Italy, The Netherlands, Portugal, Switzerland, the UK, and the US. We are Feliciano Type Foundry, Joshua Darden, Karsten Luecke Type Foundry, Lux Typographics, Orange Italic, Thirstype, Type Initiative, Underware, Village, and a soon-to-be-announced tenth member. Village is based in New York City.</p>
    <p><a href="https://web.archive.org/web/20141114132724/http://vllg.com/" title="http://vllg.com/">http://vllg.com/</a></p>
    <p>Many thanks for all of the encouragement and good wishes we have received; we are especially grateful to those who blogged about us, posted about us, and otherwise spread the word via the internets.</p>
    <p>/</p>
    <p>New release:</p>
    <p>Mavis from Chester of Village. A knowingly, purposefully, and unapologetically dumb typeface with some very smart functionality.<br>
    <a href="https://web.archive.org/web/20141114132724/http://vllg.com/Village/Mavis/mudTyper+Weights/" title="http://vllg.com/Village/Mavis/mudTyper+Weights/">http://vllg.com/Village/Mavis/mudTyper+Weights/</a></p>
    <p>Upcoming releases:</p>
    <p>Omnes by Joshua Darden. A multi-weight gestural sans serif with immense joie-de-vivre.<br>
    <a href="https://web.archive.org/web/20141114132724/http://vllg.com/JoshuaDarden/" title="http://vllg.com/JoshuaDarden/">http://vllg.com/JoshuaDarden/</a></p>
    <p>Local Gothic by Christian Schwartz of Orange Italic. The first self-published font from the great Mr Schwartz, with intelligent OpenType substitution programming.<br>
    <a href="https://web.archive.org/web/20141114132724/http://vllg.com/OrangeItalic/" title="http://vllg.com/OrangeItalic/">http://vllg.com/OrangeItalic/</a></p>
    <p>Kaas by Hugo d'Alte for Thirstype. A blackletter face for the 21st century, with Latin, Cyrillic, and Hebrew alphabets.</p>
    <p>/</p>
    <p>Huge thanks to the Society of Typographic Aficionados (aka SoTA) for this year's TypeCon in New York City; much fun was had by many. Several Village people were there: Christian Schwartz, Joshua Darden, Karsten Luecke, Mario Feliciano, Chester, and Akiem Helmling and Sami Kortemaki from Underware, who spent the entire conference locked away in a makeshift radio studio microcasting and streaming TypeRadio. Check out the Podcasts at <a href="https://web.archive.org/web/20141114132724/http://typeradio.org/" title="http://TypeRadio.org/">http://TypeRadio.org/</a></p>
    <p>/</p>
    <p>Thanks for reading.<br>
    Village</p>
