    votes: null
    html: <p>The widest wide-format printer I've worked with myself was one that could print directly onto vinyl or paper rolls 6ft wide. If I had to print billboard-sized jobs I'd probably have to print it in strips and assemble it on site. But now I've heard of grand-format printers that can print on media 16ft wide. Our jobs cost hundreds of dollars. Something that needs to be that big probably costs thousands.</p>
