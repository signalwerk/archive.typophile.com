    html: |-
      <p>all the billboards in this neck of the woods<br>
      are turning electronic.</p>
      <p>most of 'em now rotate what they display<br>
      every 15 seconds or so, cycling through<br>
      a half-dozen ads on any given occasion...</p>
      <p>this has even given rise to "billboards"<br>
      that get updated in real-time, such that<br>
      they say things like "watch the new episode<br>
      of 'lost' this wednesday night" right up until<br>
      wednesday, when it changes to "tonight"...</p>
      <p>heck, the other day, during the lakers game,<br>
      a billboard told me the _current_score,_ and<br>
      it was only 2 points behind the actual score<br>
      -- which i knew as i was listening on radio --<br>
      on a basket that was probably made _after_<br>
      the billboard was composed and displayed.</p>
      <p>and when that angels pitcher was killed in<br>
      a car accident earlier this year, the angels<br>
      had a tribute up on billboard the next day.</p>
      <p>so, exciting new times for billboards, but<br>
      billboard painters better find new work...</p>
      <p>-bowerbird</p>
