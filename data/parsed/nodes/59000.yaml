    html: |-
      <p>The large format printers are solvent based inkjet printers. The solvent ink bonds to the vinyl. The largest machines print billboards as a single piece on a heavy vinyl banner material. The banner is stretched around the framework of the sign.The newest thing is large scale LED billboards that light and are changeable similar to the rotators. Rotators are slats covered in adhesive vinyl, also digitally printed. The same material is used for vehicle wraps.</p>
      <p>My wife gets a kick out of rotators being stuck or out of sink so that part is one message and the other part is another machine.</p>
      <p>~~~~~~~~~~~~~</p>
      <p><a class="freelinking external" href="http://www.thefontry.com" rel="nofollow"><em>...from the Fontry </em></a></p>
