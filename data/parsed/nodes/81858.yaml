    <p>Hello!</p>
    <p>Recently, my friend and I started doing movie-themed book bags, mostly for students... nothing too serious or expensive.<br>
    (You can see them here: <a class="freelinking external" href="http://www.facebook.com/themebags" rel="nofollow">http://www.facebook.com/themebags</a>)</p>
    <p>We don't have a logo yet, and a website is soon to be made, so it's about time to make one! :)  Here's a version I'm pretty happy with, but would like to hear your comments/critique! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_novi_4012.jpg"></div><p></p>
    <p>Every letter of the word "theme" is from a different typeface - it's kind of a concept 'cause we'll have different themes, while the bags (apart from the illustration) will stay more or less the same.</p>
    <p>Thanks!</p>
