    html: |-
      <p>Based on the bags you've already made (and can be seen on the Facebook site it I'm not mistaken) this is my comment on your logo progression:</p>
      <ul>
      <li>I think that logo with organic shaped bag handle is complementing your bag designs very well. It's different and when done correctly it implies on a bag anyway. I like that.</li>
      <li>Of all the logos presented here I like the <a href="http://www.typophile.com/node/81858#comment-463028" rel="nofollow">older handle logo</a> as well as the latest one (a bit less)</li>
      <li>Handle-less version of the last logo isn't really working because it's too grungy and may be mistakenly related to skateboarding. /BAGS/ is also not very visible so I think it's not working.</li>
      <li>The linked older logo had the problem with /BAGS/ because letters were too big and too strong and were competing with /THEME/ too much</li>
      <li>Type in the older logo (for the word /THEME/) is also a bit more feminine which I guess is your main target group or at least major target group. Latest logo is very youthful but more masculine</li>
      <li>Type for /BAGS/ in your last logo doesn't work for me. It's too light and stylistically not complementary</li>
      </ul>
      <p>Based on all these I would say that you should progress the older logo.</p>
      <p>A completely horizontal version will probably be more in line with the original logo to be put on the label flying out of stitched handle on the bag itself.</p>
      <p>@aluminum: Even though you've made valuable experiment with word contrast (so one dominates as it should) I don't think that right alignment works.</p>
      <p>And one last thought. Since we live in approx. the same territory and share some of the same history I think that culturally and the way that things progress around here I find your logo very nice, culturally appropriate, eco-oriented and contemporary. Very nice. Like it lots.</p>
    html_clean: |-
