      <p>I agree with Mauro, looking from your perspective at the moment the handle might remind you of a handle, but for someone else it could easily represent a cherry stem or a badly designed walking legs and etc. The bag I did was merely and idea inside my head and the box next to it was a result of intended reduction and abstraction of the actual bag/book, the final could be an outline of a box. You should experiment.  </p>
      <p>I still believe that the lowercase 'e' in 'theme' must be different and preferably set in a capital, as the current 'e' looks imbalanced with the rest letter. For some reason whenever I think of DIN, it reminds of rough surfaces; hence the choice of the particular font.  </p>
      <p>SB</p>
