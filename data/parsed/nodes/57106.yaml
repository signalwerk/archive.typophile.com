      <p>New versions:</p>
      <p>Will—Created a flower out of the symbol as mentioned. Although I myself am still leaning towards the butterfly.</p>
      <p>Alaskan—I spaced the mark out a little bit as requested. I certainly had thought of making the inner circles the lighter color, here’s what it would look like.</p>
      <p>But this leads me to a conceptual question that i’m struggling with. I included in the far right of the image, the basic black film roll icon. The mark I created refers to that icon, though I admit it is no longer simply a film roll—it is now a butterfly. But in the way that the icon uses the same color for both inner and outer circle, should i do so for MY mark? Does changing the color of the inner and outer circles (as opposed to using a two color scheme in which the inner and outer are always the same color—as in the previous versions) take away from the idea that this mark has to do with photography?</p>
      <p>And in the last version I post, I almost get the read of binoculars which has to do with optics and lenses, seeing...photography. </p>
      <p>Any other opinions or input?<br>
      </p><div class="imageWrap"><img src="/files/Version2_4603.jpg"></div><div class="imageWrap"><img src="/files/Version3_4925.jpg"></div><p></p>
