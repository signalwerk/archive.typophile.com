      <p>You may be correct about rag right. I’m not sure if I can drop the caps treatment on the word Photography then... what do you guys vote for, caps or no?</p>
      <p>Ok people—I apologize for getting color crazy. But I’ve sourced some RGBs from pictures of butterflies. I don’t think the tri-color treatment works though. It looks to me as though having a diff. color for the outer circle and antennae screws with immediately recognizing the butterfly. I tried a whole range of colors, clearly, sorry... as well as a black and silver combination—of which there are 3 shades of gray.</p>
      <p>I also noticed that many butterflies are duo-tone, with black edges.<br>
      So I’m now leaning towards the two with black outer circles, and blue, then red inner, respectively. Or one of the ones below those two that feature gray inner circles (there’s something elegant about them).</p><div class="imageWrap"><img src="/files/Version4_5688.jpg"></div><p></p>
