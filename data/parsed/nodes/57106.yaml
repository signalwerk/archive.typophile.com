    <p>Ok so I’m making a logo for a photographer.<br>
    She plans to shoot anything and everything, but her own personal style<br>
    is a lot of macros of natural things like plants and insects.</p>
    <p>So I got a logo here that is using the symbol for a roll of film, creating<br>
    a butterfly. There are 2 versions which I am posting, the only thing being<br>
    different is the orientation of the butterfly’s antennae, and the spacing<br>
    of the “wings.” </p>
    <p>Any thoughts on the mark?</p>
    <p>And the typography is just kind of thrown on there,<br>
    if possible I would love some suggestions on some good<br>
    scripts and sans-serifs that are free, or that I may potentially<br>
    have in my library already. </p>
    <p>Plus any suggestions as you see fit. Thank you!<br>
    </p><div class="imageWrap"><img src="/files/Version1_4632.jpg"></div><br>
    <div class="imageWrap"><img src="/files/Version2_3487.jpg"></div><p></p>
