    html: |-
      <p>You need to have an OpenType font with the arbitrary (odd) Fraction feature.<br>
      OpenType fonts come with pdfs that list which features they support.<br>
      Not all OT fonts have the arbitrary fraction feature, but most "Pro" fonts do.<br>
      The you need to dig down in the InDesign palettes:<br>
      Character (arrow at top right of palette) &gt; OpenType &gt; Fractions.</p>
