    <p>I need some help with my personal identity logo - I know this is supposed to be the hardest thing for everyone, and I’m really feeling that. I’ve attached two file with a few variations I’ve done. I wanted to keep things simple, hence them all being text only, but if anyone has a striking idea I’d love to hear it. I’m kind of stumped. My initials aren’t the easiest letterforms to combine.</p>
    <p>Thanks for any input!</p>
    <p>Oh, and the Feel Script one was just for fun, but I thought I would include it anyway.</p>
