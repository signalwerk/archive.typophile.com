    html: |-
      <p>Most probably all custom lettering and having a look to Pavel Shevcov 'therealtakeone' <a class="freelinking external" href="http://www.shutterstock.com/gallery-468943p1.html" rel="nofollow">portfolio</a> (or <a class="freelinking external" href="http://atwork.lv/users/takeone" rel="nofollow">here</a>) could confirm it.<br>
      'Forgives' reminds me a bit of Great Lakes lettering <a class="freelinking external" href="http://www.myfonts.com/fonts/great-lakes-lettering/asterism" rel="nofollow">Asterism</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/great-lakes-lettering/feast" rel="nofollow">Feast</a>.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/sepian" rel="nofollow">Sepian</a> might work for 'I dont'.<br>
      Having a look to fonts tagged '<a class="freelinking external" href="http://www.myfonts.com/search/tag%3Atattoo" rel="nofollow">tattoo</a>' might worth a shot.</p>
