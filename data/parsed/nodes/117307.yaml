      <p>The top and bottom are calligraphy in decorative blackletter styles. They are two different different designs. Nothing really matches either one.<br>
      But here are some fancy blackletter fonts that have some similarities:<br>
      Beckinslade <a href="http://www.myfonts.com/fonts/gatf/beckinslade/" title="http://www.myfonts.com/fonts/gatf/beckinslade/">http://www.myfonts.com/fonts/gatf/beckinslade/</a><br>
      Black Swan BF <a href="http://www.myfonts.com/fonts/bomparte/black-swan/" title="http://www.myfonts.com/fonts/bomparte/black-swan/">http://www.myfonts.com/fonts/bomparte/black-swan/</a><br>
      Monkeytails <a href="http://www.myfonts.com/fonts/wiescherdesign/monkeytails/" title="http://www.myfonts.com/fonts/wiescherdesign/monkeytails/">http://www.myfonts.com/fonts/wiescherdesign/monkeytails/</a><br>
      Kingthings Spike  <a href="http://www.myfonts.com/fonts/cheapprofonts/kingthings-spike-pro/" title="http://www.myfonts.com/fonts/cheapprofonts/kingthings-spike-pro/">http://www.myfonts.com/fonts/cheapprofonts/kingthings-spike-pro/</a><br>
      KingthingsSpikeless <a href="http://www.fontsquirrel.com/fonts/Kingthings-Spikeless" title="http://www.fontsquirrel.com/fonts/Kingthings-Spikeless">http://www.fontsquirrel.com/fonts/Kingthings-Spikeless</a><br>
      Baroque Text JF <a href="http://www.myfonts.com/fonts/jawfonts/baroque-text-jf/" title="http://www.myfonts.com/fonts/jawfonts/baroque-text-jf/">http://www.myfonts.com/fonts/jawfonts/baroque-text-jf/</a><br>
      Aeronaut <a href="http://www.myfonts.com/fonts/facetype/aeronaut/" title="http://www.myfonts.com/fonts/facetype/aeronaut/">http://www.myfonts.com/fonts/facetype/aeronaut/</a><br>
      Rheingold <a href="http://www.myfonts.com/fonts/scriptorium/rheingold/" title="http://www.myfonts.com/fonts/scriptorium/rheingold/">http://www.myfonts.com/fonts/scriptorium/rheingold/</a><br>
      Carol  <a href="http://www.myfonts.com/fonts/classic/carol/" title="http://www.myfonts.com/fonts/classic/carol/">http://www.myfonts.com/fonts/classic/carol/</a><br>
      Celebration <a href="http://www.myfonts.com/fonts/rmu/celebration/" title="http://www.myfonts.com/fonts/rmu/celebration/">http://www.myfonts.com/fonts/rmu/celebration/</a><br>
      Savoy <a href="http://www.myfonts.com/fonts/classic/savoy/" title="http://www.myfonts.com/fonts/classic/savoy/">http://www.myfonts.com/fonts/classic/savoy/</a><br>
      Uthan <a href="http://www.myfonts.com/fonts/intellecta/uthan/" title="http://www.myfonts.com/fonts/intellecta/uthan/">http://www.myfonts.com/fonts/intellecta/uthan/</a><br>
      Sepian -- already suggested by Ryuk -- <a href="http://www.myfonts.com/fonts/laura-worthington/sepian/" title="http://www.myfonts.com/fonts/laura-worthington/sepian/">http://www.myfonts.com/fonts/laura-worthington/sepian/</a><br>
      Dearest <a href="http://www.fontsquirrel.com/fonts/Dearest" title="http://www.fontsquirrel.com/fonts/Dearest">http://www.fontsquirrel.com/fonts/Dearest</a><br>
      Portcullion <a href="http://www.fontsquirrel.com/fonts/Portcullion" title="http://www.fontsquirrel.com/fonts/Portcullion">http://www.fontsquirrel.com/fonts/Portcullion</a><br>
      Zenda <a href="http://www.fontsquirrel.com/fonts/Zenda" title="http://www.fontsquirrel.com/fonts/Zenda">http://www.fontsquirrel.com/fonts/Zenda</a><br>
      Kelly Ann Gothic <a href="http://www.dafont.com/kelly-ann-gothic.font" title="http://www.dafont.com/kelly-ann-gothic.font">http://www.dafont.com/kelly-ann-gothic.font</a><br>
      You might also browse through an interesting collection of free fonts by Paul Lloyd which includes some interesting fancy blacketters  <a href="http://moorstation.org/typoasis/designers/lloyd/" title="http://moorstation.org/typoasis/designers/lloyd/">http://moorstation.org/typoasis/designers/lloyd/</a><br>
      Don</p>
