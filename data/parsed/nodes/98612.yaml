      <p>Are sites designed as a series of boxes in a grid becoming a trendy new thing? Possibly inspired by iPhones and their grid of “App” buttons? I’m seeing more and more of them. They are quite useless, as they offer absolutely no information as to where you are going to end up, but gawsh they look purdy! Look at me! I’m making a grid! I almost read <a href="http://www.amazon.ca/Systems-Graphic-Systeme-Visuele-Gestaltung/dp/3721201450" rel="nofollow">a book</a>! And while we’re at it, please, stop it with the tiny, trendy, hard to read light grey type already. When the fad fades and you go back to black, I’m totally going to be there to say “I told you so.” </p>
      <p>Quitting smoking sucks.</p>
