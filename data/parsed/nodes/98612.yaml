    html: |-
      <p>Chris - I quit smoking on Feb 25 of this year and haven't had a single cigarette since. Frankly, I'm somewhat amazed by it every day.<br>
      I used a combination of Wellbutrin and hypnosis. But I probably could have done without the Wellbutrin.</p>
      <p>Two hypnosis sessions a week apart. Plus, the hypnotist had me make some changes to my usual smoking habits two weeks before the first session.  (Changing brands. Snipping the cigs in half. Smoking only in a place outside I didn't used to smoke before. That kind of thing - to begin changing the mindset.)</p>
      <p>I experienced some big emotional changes for awhile.  Mood swings, bouts of melancholia, etc.... But that's bottomed out lately.  Gained a little weight - twenty extra pounds just kind of appeared unbeknownst.  I figure I'll tackle losing the weight after my first anniversary as a non-smoker.</p>
      <p>I still have cravings on occasion. But the problem is I know I won't get the same effect unless I re-addict myself. One cigarette will just get me sick.  But re-addiction seems really f-cking stupid to me.<br>
      Frank Zappa used to call tobacco his "favorite vegetable" - I know how he felt. I liked smoking.<br>
      But the cost in every way just became too high.</p>
