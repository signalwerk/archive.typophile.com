    <p>Just noticed <a class="freelinking external" href="https://web.archive.org/web/20150124051720/http://www.tiro.nu/Articles/Cambria/Cambria_Math_Basic_Spec_V1.pdf" rel="nofollow">this</a> on the Tiro site. TWO weights of a new Fraktur, TWO new script weights, a double-struck weight with a black weight left over when the incisions are removed... remarkable stuff.</p>
    <p>Oh yeah, and two weights of a Cambria Sans as well, plus their italics. I would be surprised if they stop here and don't expand it further in the future.</p>
