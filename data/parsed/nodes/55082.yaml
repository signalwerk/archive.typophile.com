      <p>Yes, great link! Thank you, John.<br>
      Is there a clever way to access all these characters? I mean, other than via the glyph palette? </p>
      <p>The ‘new Fraktur’ is actually a variation on Wittenberger. “Based on Schelter &amp; Giesecke’s School Fraktur which was in turn based on type favored by early 16th century printers in Wittenberg” — <a href="https://web.archive.org/web/20150124051720/http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1495" rel="nofollow">Adobe</a>.<br>
      Especially the uppercase ‘K’ has been altered – I assume to distinguish it more from the ‘R’. While I’m not a fan of the original Wittenberger ‘K’ either, I must say that the new ‘K’ is my least favourite character in Cambria’s blackletter. Its head looks stretched.</p>
      <p>The script letters are absolutely lovely! I wonder what their source is. Similar charm as that of <a href="https://web.archive.org/web/20150124051720/http://www.fontshop.com/search/?q=kursivschrift" rel="nofollow">Kursivschrift</a> or <a href="https://web.archive.org/web/20150124051720/http://new.myfonts.com/fonts/brassfonts/fiona-script/" rel="nofollow">Fiona</a>.</p>
      <p>It seems Cambria is the new Lucida, in terms of style variety – and all in one single font.</p>
