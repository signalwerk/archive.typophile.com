    html: |-
      <p>Most of the mathalphanumeric characters were designed by Cambria's original designer, Jelle Bosma at Monotype. The 'ssty' optically adjusted scaleable variants used by the MS math handler for super- and subscript variants were made by Ross Mills at Tiro, as were the new math monospace letters that will be included in the new Windows 7 version (along with a lot of other non-math stuff that I made, with some help from David Brezina, including polytonic Greek and massively extended Latin and Cyrillic support).</p>
      <p>The thing to note about the math alphanumerics is that they are limited character sets, generally no more than A-Z and a-z. They are encoded using Unicode Plane 1 codepoints for math alphanumerics, and they are also spaced more for use as math symbols than for regular text.</p>
