    date: 2004-11-28T16:11:00
    votes: null
    html: <p>Maybe you should try altering the bracket, as you would alter any other letter to make a point in your logotype. Curl it up a little more at the bottom, or lose the curl at the top, or raise the center. If making any of these alterations makes it unidentifiable as a bracket, then maybe you can simply find a way to effectively superimpose an actual "K" behind the bracket (e.g. outline, screen). <br> <br>Aloha! <br>Scott</p>
