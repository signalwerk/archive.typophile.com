  - id: 52283
    user_id: 2933
    user_name: aaron_carambula
    user_path: null
    date_raw: 17 Nov 2004 — 6:22am
    date: 2004-11-17T06:22:00
    votes: null
    html: "<p>I think the reason the '{ is not reading as a letter is because it is not the same color as the rest of the letters, so it feels like a supporting mark. <br> <br>What you have now i would consider \"outside,\" so try to make it perfectly clear (inside) then work towards the middle to find something that's not bland, but not illegible.  <br> <br>I think keeping a consistent baseline is key, #1 in your 3:07 post is getting there. I think the \"cap height\" could use adjusting. Work the type like it's type, not like it's following the rules of computers, because in the end, if it reads well, we'll still get the (very clever and cool) idea behind i all. <br> <br>Rock it, it's your baby. (to quote my boss) <br> <br>Aaron</p>"
