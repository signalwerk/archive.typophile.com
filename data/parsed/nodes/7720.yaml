    html: "<p>Sergio, <br> <br>DON'T GIVE UP! <br> <br>Of your latest posting, I don't think the italic is your strongest design. The version with the two pipes reads clearly as a K but part of what I liked so much about your original (and #3 of last posting) is the ah-ha element of discovery. <br> <br>I'm curious, How will this be used? I would assume on stationary and business cards. In that case try designing the entire card or letterhead. It may give you the opportunity to further explain the logo, and not require such a clear K.</p>"
  - id: 52292
