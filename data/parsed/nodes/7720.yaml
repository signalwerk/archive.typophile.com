    user_name: shawn harris
    user_path: null
    date_raw: 22 Nov 2004 — 3:31pm
    date: 2004-11-22T15:31:00
    votes: null
    html: "<p>I would encourage you to continue your investigation of the more subtle k mark (as in #3 of your last post).  I think that Kirsten is right, the ah-ha nature of the K works with this mark.  If it was for a computer company or a lawyer, then maybe not, but no doubt it will almost always be used with the programmers contact information, Kenzen...so the connection will be made.  AND people will LOOK for the connection, which is exactly what you would want a mark like this to intiate.  I say well done. <br> <br>s.</p>"
