  html: |-
    <p>I used twitterific and an assortment of various AIR apps, etc., but I have a new favorite that isn't even Twitter Specific.</p>
    <p><a class="freelinking external" href="http://fluidapp.com/" rel="nofollow">Fluid</a> is an OSX app (Sorry PC users) that is similar to Mozilla's Prism application. It creates a site specific browser that is independent of any other browser/window you have open. Yeah, yeah, bla bla bla. </p>
    <p>But what is unique is that you can make it work as a menubar app, just like Twitterific, but is in fact a full featured browser.</p>
    <p>I now post straight into Twitter, the actual Twitter page, from my menu bar.</p>
    <p>Very Sweet.</p>
    <p>P.S.<br>
    I also plan on having a menubar app for Typophile, since I haven't been able to check it too frequently as of late.</p>
