  html: |-
    <p>Got a copy? The one I have is, maddeningly, missing page 293, which should show the full character set for Colwell Handletter Italic. I'm currently in the process of reworking my version of same (McKenna Handletter), and it would be handy to have a scan of the original to double-check my interpolations, extrapolations and wild guesses.</p>
    <p>If you have same and you believe in fair trade, I can swap scans of any items(s) you'd like from the 1912 or 1934 ATF catalogs, or Barnhart Brothers &amp; Spindler Catalog #9 (c 1907) or #25 (c 1925). If you're a capitalist, I would also be willing to trade a 600 dpi grayscale scan of same for a copy of <em>Indie Fonts 2</em> or two of my commercial fonts ($39.95 and $40 retail values, respectively).</p>
    <p>Finally, at the front of the BB&amp;S catalog #25, they previewed typeface in development at the time the catalog was released, one of which was called <strong>Trenholm Cursive</strong>. That catalog was the last that BB&amp;S produced before giving up the ghost (actually relinquishing its semi-autonomous nature and dissolving back into ATF), and it doesn't appear in the 1934 ATF catalog. I did locate at least one reference to it from a person who claimed to have the typeface in metal but, unfortunately, it was a dead link. Anybody seen it? Anybody got some paper on it? Anybody want to wheel and deal?</p>
