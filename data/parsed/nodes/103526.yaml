    <p>Hello everyone. I've been really hunkering down and designing some of my first typefaces. I got tired of seeing Copperplate Gothic everywhere, but I also got inspired by it. I was hoping to get some honest feedback about the overall design, especially the lowercase and numerals.</p>
    <p>I've attached some samples here, but you can check out everything over here. <a class="freelinking external" href="http://www.behance.net/gallery/Applewine-Typeface/5688095" rel="nofollow">http://www.behance.net/gallery/Applewine-Typeface/5688095</a></p>
