      <p>This is really a nice typeface. </p>
      <p>The crossbars of both the "f" and "t" bother me, I think they usually go the other way where the curve or slope are on the top of the letter rather than the bottom.</p>
      <p>The down stroke of the "k" is too thin, it should be the same thickness as the stem.</p>
      <p>The "3" does have an odd design to it, but I really like it.</p>
      <p>The new "2" is really nice.</p>
      <p>The "g" "p" "q" and "P" seem too wide, they slow my eyes down when I'm reading it.</p>
