      <p>Thanks for your help, Kevin.</p>
      <p>• The stems on the |b| and |d| <em>were</em> thin compared to the rest of the verticals. Fixed.<br>
      • Agreed on the |e|. The terminal has been chopped and now looks more open.<br>
      • The |2| and the |3| have been reworked. Looking at the |3|, I suspect the center needs more weight.<br>
      • I'm on the fence about the crossbar fo the |t|, but I switched it to see what it looks like. I like it down, but it doesn't appear to visually 'sag' anymore.</p>
      <p>I've been getting some inquiries about if this typeface was for sale, and I thought I'd get it into the best shape before making it available to the public. Thanks again for your help.</p>
      <p><img src="/sites/default/files/old-images/ApplewineSpec5_4700.jpg"></p>
