      <p>An august and worthwhile creation.</p>
      <p>Stems of |b| and |d| are light on the ascender as compared to inside the bowl. |p| and |q| succeed with the reverse so you may want to just copy and paste from them.<br>
      Terminal of |e| is too prominent and pinches it closed; I'd trim off the inner serif (as you have done with |5|).<br>
      Consider making the crossbar of |t| upturned instead of downturned.<br>
      |2| is unbalanced and small on top.<br>
      |3| is kind of a mess of shape and stroke weight.</p>
      <p>Keep at it, I think people are going to want this.</p>
