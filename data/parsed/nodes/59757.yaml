    <p>Hi,</p>
    <p>My first post on Typophile. Some friends and I put together an online magazine for which I - an amateur graphic designer - did the layout. A lot of my inspiration for the layout came from Intelligent Life magazine.</p>
    <p>If you have a moment, please have a look I would greatly appreciate any critique.</p>
    <p><a class="freelinking external" href="http://exhibitmag.co.za/" rel="nofollow">Exhibit Magazine</a></p>
    <p>Thanks,<br>
    Rudolf.</p>
