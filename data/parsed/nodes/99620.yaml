      <p>&gt; That a lot to pack into one little logo</p>
      <p>Logos are important, but a small non-profit organization's clients are probably going to come mostly from word-of-mouth recommendations, referrals from people and agencies, and so forth. It's not like your logo is printed on millions of product labels or featured in a huge advertising campaign. Just a nice, clean, simple logo will probably serve your non-profit well. </p>
      <p>If you're offering a good service for free, you probably won't have any trouble finding customers. :) And since it's a non-profit, maybe you could find a local graphic designer willing to donate some time to help develop the logo and advertising materials.</p>
