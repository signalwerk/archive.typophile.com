      <p>Ain't that the truth. But there's really nothing better than receiving honest crits and comments from those who have the ability to express. Peter Schjeldahl (who I absolutely respect) to name but one. And speaking of Peter Schjeldahl this is what he has said about the Chinese artist Ai Weiwei...</p>
      <blockquote><p>Not much about what he does is aesthetically novel. But his art works are always elegant, superbly crafted, and mightily theatrical, perhaps making up in splendor what they lack in fertility. *</p></blockquote>
