    <p>Some day, I will be more than happy to pay someone top-dollar for this work. Today though, I'm just glad to have internet.</p>
    <p>I own a business, changing directions and looking at going into the nonprofit sector.   I'm designing (by necessity) my own new logo.  I've pieced together a sillhouette image that I think I want to use, but an important part of the image might be too small.<br>
    My main question is, how to position the lettering? Is it ok to have the company name and website floating off to the side like this?  Any constructive criticism is welcome!<br>
    Also, I want the font to be clean and modern, "respectable", yet have some character.  This font is called "Cicle."  Oh, and the lower one is Calibri. </p><div class="imageWrap"><img src="http://typophile.com/files/good enough for now resized_5536.jpg"></div><p></p>
    <p>Thanks!</p>
