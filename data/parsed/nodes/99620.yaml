      <p>A tough thing in business is learning how to criticize or disagree without offending, and learning how to take criticism constructively. Whole books have been written on the subject. </p>
      <p>Some people are thick-skinned, of course, but others aren't. In my first full-time job after college I told the company copywriter that I disagreed with some of her editing, and she was angry at me for weeks, which was a problem since I had to work with her on a daily basis. Over the years I've seen many writers/artists/designers who were easily offended by criticism.</p>
      <p>But I agree that honesty (tempered with tact) is usually the best policy.</p>
