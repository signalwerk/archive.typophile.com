      <blockquote><p>5star, I really like what you did. That way of breaking out of my uptight little box...it's what I need.</p></blockquote>
      <p>Thx again, interesting remarks on several levels.</p>
      <p>Trying to be clever is lethal. Forcing a graphic to do tricks like it's performing in three ring circus is fine ...until the next trick comes along. And then it become used/stale. Most graphic designers try to be clever, try to find a trick. A clever twist on this on that. But the problem there is that it all becomes boringly clever. How many different ways can you merge letter shapes? How many different ways can you make words perform tricks? Until everything is nothing more than a clever little amusement ride of tricks??? And upping the trick by adding an image to the text, only adds a smirk to the cleverness.  And on it's lowest level ...clever alignment dulls the senses.</p>
      <p>That's the 'box' ...trying to be clever ...in my humble opinion of course.</p>
      <p>The above graphic works because it is honest ...nothing more than overlayed raw relationships of organic expressions. The bottom layer is of natural forms in vibrant mono-color, a tree, a human figure, a field of grass. And the rhythms thereof. A top layer of unnatural forms in non-color, white Georgia type and black text blocks. And the rhythms thereof.</p>
      <p>One dynamic organic rhythm over another. One rhythm of color, one rhythm of non-color (achromatic). And the viewer ...and that is where the rubber meets the road :) Allowing the viewer to participate... inviting the viewer to participate. Depth...</p>
      <p>No tricks.  </p>
      <p>n.</p>
