      <p>1st rule of graphic design ... personal emotions not allowed. It's not that you shouldn't develop a thick skin ... it's a matter of you don't need one.</p>
      <p>Green bg is ok, but it's to general. There's no hierarchy. And the white just knocks a hole right through it. Not every element should be all that dramatic. Drama is created by using a contrast or by using either a crescendo or decrescendo technique.</p>
      <p>For instance, as an example, a simple broad course brush stroke. The stroke imparts direction, movement, an organic aesthetic. Solid graphic design is knowing how to strip an idea down to what really matters ...removing all cheap sentiment.   </p>
      <p>Hope that helps.</p>
      <p>Even with your second rendition I still don't know what Gift of Green is all about... and proportions are all off, is that a bonsai tree? Why use the word /the/ at all? Stop cramming everything all together. Green smudge. </p>
      <p>n.</p>
