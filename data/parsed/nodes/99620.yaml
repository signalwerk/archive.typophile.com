      <p>Wayyy back, when I was really green, I was given a list of words to graphically design ...elegance was one of them. In fact it was that one word which led me down several paths of study/investigation/learning ...classical music being one of them. In the end I began to develop an understanding that I could learn from Masters in other disciplines.</p>
      <p>Elegance ...has rhythm of its own. Is that what you're after ...elegance? What to you is elegant?</p>
