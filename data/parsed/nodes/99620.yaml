      <p>[Non-designer, non-professional opinion follows]</p>
      <p>I think that the text, no matter what the font, is too small relative to the overall size of the composition.  A better balance between the size of the tree and the size of the text should be aimed for. Because the main text is adjacent to the widest part of the tree, it looks squeezed in and almost pushed off the page. Rasing it up about halfway to the top would give it more room and allow it to be bigger (unless you're ok with splitting the name into two or more lines)</p>
      <p>The url could be completely separated from the name - placing it closer to the ground would also improve the overall balance.</p>
      <p>As to the font(s) themselves, have you considered how the logo will look next to whatever font(s) you want to use for your webpages, snail-mail letters, and so forth? It's not easy, but it's best to be able to consider the organization's image and typographic identity as a whole, rather than as separate pieces.</p>
      <p> - Herb</p>
