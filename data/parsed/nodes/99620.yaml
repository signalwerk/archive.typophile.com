      <p>I agree with most of the comments above; here are a couple of other thoughts.  </p>
      <p>Consider dropping "www" from your URL. It makes the URL longer without adding anything useful. It's 2013 and everyone knows that "[name].org" is a URL. </p>
      <p>Also, why does your organization's name start with "the" but your ULR doesn't? It would be better if they were consistent. If that's not possible, consider downplaying "the" in the name; it's a weak beginning for a name anyway. Maybe put "the" in smaller type.</p>
