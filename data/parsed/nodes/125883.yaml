  html: <p>Hello, I’m wondering if anyone is familiar with the subtle nuances between Palatino and Palatino Nova which is the modernized version of Palatino. I'm using Palatino for a project and am interested in tweaking it a bit and Palatino Nova would be perfect except it seems like the letterspacing on default is way more opened up than Palatino regular in a way I'm not so sure about. Obviously I could address that separately but something just seemed slightly off and there isn't much information about the font. Does anyone know anything about this?</p>
