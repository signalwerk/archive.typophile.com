    votes: 1
    html: |-
      <p>From top:<br>
      Palatino 1950<br>
      Palatino<br>
      Palatino Nova<br>
      Aldus Roman<br>
      Aldus Roman Nova</p>
      <p>One can see what a disaster the 'Nova' fonts are. The serifs and thin strokes of 'Palatino Nova' are noticeably thinner than the predecessor version, which was already hideous enough. What an abomination!</p>
      <p>Note the capital 'E' and 'F' in all five fonts. They have been narrowed in Palatino Nova, and widened in Aldus Roman Nova. What? Also, note how the crossbars in the E and F in the original Palatino 1950 and Aldus Roman are not at the same height (the crossbar of 'F' is lower). This is to achieve a better 'balance' in the 'F'. The crossbar of 'F' in both Novas is even with that of the 'E'. What an abortion! How can these idiots put out such crap? Also, the diagonal stroke of 'Z' and 'z' should be thin (as it is in Palatino 1950 and Trajanus), not thick. The stress is nearly vertical in Palatino Nova, much like that of Aldus Roman. The ascenders of Aldus Nova are shorter than those of Aldus Roman, and the characters of Aldus Nova are all wider. </p>
      <p>Overall, the changes make Aldus and Palatino more similar. What idiocy!</p>
