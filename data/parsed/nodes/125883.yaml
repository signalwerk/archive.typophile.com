    html: |-
      <p>Could it be that the online page does not show the fonts' kerning properly? (Or possibly just in your browser of preference.)</p>
      <p>There are (at least :) three competing systems for kerning: TrueType's original <code>kern</code>, which is rather easily to implement and therefore quite well supported, Adobe's Type 1 <code>.afm</code> based kerning (rare; proper Type 1 support seems rapidly dwindling), and finally, OpenType's <code>GPOS</code> tables - hard to implement correctly.</p>
    html_clean: |-
