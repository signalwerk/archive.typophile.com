    <p>Hi,</p>
    <p>I am in the process of designing my blog (amateur designer).</p>
    <p>Was wondering if someone would be kind enough to offer some advice on font selection for the header?</p>
    <p>Trying for a simple retro theme.  Attached clip-art will feature prominently on main page.  Header will be underneath.</p>
    <p>Looking for,</p>
    <p>Retro<br>
    Slightly comical + self deprecating<br>
    A little authoritative.</p>
    <p>I have been looking for a bold sans-serif (headline) but possibly with slightly irregular lettering.</p>
    <p>Maybe something like,</p>
    <p><a href="http://new.myfonts.com/fonts/aerotype/pacifico/regular/" title="http://new.myfonts.com/fonts/aerotype/pacifico/regular/">http://new.myfonts.com/fonts/aerotype/pacifico/regular/</a></p>
    <p>or</p>
    <p><a href="http://new.myfonts.com/fonts/ortizlopez/olnewsbytes/bold/" title="http://new.myfonts.com/fonts/ortizlopez/olnewsbytes/bold/">http://new.myfonts.com/fonts/ortizlopez/olnewsbytes/bold/</a></p>
    <p>So many choices its easy to get lost !!</p>
    <p>Would appreciate any suggestions/pointers.</p>
    <p>Thanks in advance,</p>
    <p>Matt</p>
