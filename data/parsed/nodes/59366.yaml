      <p><a class="freelinking-external" href="http://www.veer.com/products/typedetail.aspx?image=FBT0100016">El Grande</a> might suit your needs. I searched in Veer’s type collection with the <a class="freelinking-external" href="http://www.veer.com/search/results.aspx?keyword=1950s%20retro%20bold%20sans&amp;producttype=TYP&amp;resulttab=vr&amp;category=Type">search terms</a> “1950s retro bold sans”.</p>
      <p>It may also be fun for you to have a rotating nameplate, sort of the way the T changes here at Typophile, or the way the banner changes over at <a class="freelinking-external" href="http://new.typographica.org/">Typophile</a>. Maybe your blog won’t be so much about type, so it’s not as appropriate, but sometimes fun should win out over propriety.</p>
