    html: <p>I agree with Patty. It doesn't look like anything familiar to me, and letters like that W seem like you would recall them. It's more likely that it was done completely by hand than that someone 'played' with a font. <br> <br>If you have some calligraphic skill, you might make your own W, b and g, which seems like the most atypical letters in this sample. However, I presume your purpose is not to re-create this, but to identify the typeface to use for other purposes. <br> <br>One that I know with at least a somewhat similar W is P22's <a href="http://www.myfonts.com/fonts/sherwood/p22-roanoke-script/p22-roanoke-script/testdrive.html?s=Williamsburg&amp;p=60" target="_blank">Roanoke Script</a>, and it even tries to reflect a style roughly from the Colonial era (or earlier).  <br> <br>You could look in Part 10 of the <a href="http://bowfinprintworks.com/Script10Pg1.html" target="_blank">Script Font ID Guide</a> for other Antique Handwriting fonts. Not sure what qualities you are looking for, but at least I know these are actually fonts.</p>
