    votes: null
    html: "<p>There are a few other earmarks indicating this is custom lettering and not a font: <br> <br>- The wide looping descender on the g (which would not work in a font after another character with a descender). <br> <br>- A similar case with the b. Both sides would collide with other tall characters. <br> <br>- The b and u connect differently than other pairs. <br> <br>- The W would be very awkward with short words or words that start with Wh (e.g., Why).</p>"
    html_clean: "<p>There are a few other earmarks indicating this is custom lettering and not a font: <br> <br>- The wide looping descender on the g (which would not work in a font after another character with a descender). <br> <br>- A similar case with the b. Both sides would collide with other tall characters. <br> <br>- The b and u connect differently than other pairs. <br> <br>- The W would be very awkward with short words or words that start with Wh (e.g., Why).</p>"
