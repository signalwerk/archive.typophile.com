    html: <p>Hi, It's Michael Clark. The Williamsburg above is a digital rendering of the Original "Colonial Williamsburg" not Historic... I was given the original logo and extrapolated the font from the two words. The letters in W'burg are digitized as they were and there are no problems with letter fit or leading as was suggested. It is a proprietary font for in house use only.</p>
