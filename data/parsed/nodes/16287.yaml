      <p>The ornament seems ambiguous to me, it could be half an orange, a moon, etc. The weight of the strokes could also be a problem, they seem too varied to work with the text at twelve point, I also think that the execution of the clock face needs to be refined.<br>
      I think you should investigate other methods to represent time, maybe with a less three dimensional appearance, hourglasses (there is one in Hoefler Ornaments) and sundials come to mind or a more conventional representation of a clock face. Hoefler Ornaments contain traditional items and styles, hedera – the ivy and plant-based ones, the printer's fist – pointing hand, sun and moon and fleur de lys.<br>
      Tim</p>
