    html: |-
      <p>Scott,<br>
      I was trying  to say that the variation of the strokes in the ornament might not represent too well at twelve points high, some being so fine they will be difficult to print/see at a small size, some of the clock face details will also be difficult to print. So it was a more technical criticism in that respect.<br>
      Looking at the Hoefler Text Ornaments, I would suggest that you wouldn't use the more detailed ornaments (sun, moon, ship etc.) or the incised uppercase hedera at the same point size as the lowercase flourishes and hedera. Whereas the incised flourishes could be used at the same point size as the lowercase flourishes. Of course, the option for using that many ornaments will not come along often.<br>
      As to how closely they should reflect characteristics of the text, I think that is a question that you can only answer by trying different sorts, sizes, position and proximity of ornament in conjunction with a piece of text, experiment, bearing in mind the effects of printing will have on text and ornament. However, I wish in the case of Hoefler's ornaments, that those flourishes weren't simply reflected, but that the emphasis of thick and thins were kept in the style of the text face.<br>
      Getting back to your design, bearing in mind that the present lack of images means I am relying on my memory, my first reaction was that it was an orange, which I take it wasn't the intention, it seems to me that a clearer representation of time would achieve your ends better than any ambiguity.<br>
      Tim</p>
