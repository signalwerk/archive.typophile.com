      <p>Thanks for your comments Tim. The ambiguity in the ornament was intentional; we were trying to suggest a few different ideas of time, so I don't mind if the ornament takes on a few different meanings, as long as they are related to the overall theme. I would really appreciate it if you could elaborate on why the variation in the strokes doesn't work with the type. The existing Hoefler text ornaments seem to vary quite a bit when it comes to stroke width, overall colour, etc. That's what I find confusing about the design of ornaments. How closely should they reflect the characteristics of the typeface?</p>
      <p>Cheers,<br>
      Scott</p>
