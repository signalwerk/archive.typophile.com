  html: |-
    <p>This is a typeface that I have been fiddling around for a long time. It has its roots in 19th century american printed ephemera, but it's not based on any particular font - it's more of a "remix" of different styles with some added twists.</p>
    <p>I have tried to make the outlines rough to get the same warm soft feeling that old ephemera has.</p>
    <p>I also have experimented in spacing the font more tightly than would have been possible with real wood type to get a more modern feel.</p>
    <p>I haven't yet really focused on spacing/kerning and even the basic character set isn't even completed yet.</p>
    <p>Any comments appreciated.</p>
