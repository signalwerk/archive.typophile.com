      <p>Considerable time is wasted in schools teaching young children cursive writing that most give up on by high school. Everyone now learns to type as a toddler and tap text on a cell phone by the time they're old enough to hold one.</p>
      <p>Cursive should be introduced as an art project and those that show a knack for it be allowed to develop the skill, but let those kids who don't spend their time learning things that matter in the modern world.</p>
