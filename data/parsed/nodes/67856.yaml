      <p>DrDoc - I think you're hitting the nail on the head. I really like your idea of applying our modern design tools in a way that links typography back to the physical, human activity of writing. </p>
      <p>I'm sure there are people out there who couldn't care less about their own handwriting, but most of the people I know personally have at least some emotional feelings about their writing. Lot's of people hate their writing. Some take a lot of care to make it look beautiful in their own eyes. Furthermore, most people have a unique emotional connection to say, their grandparent's writing on a note they have. Whether consciously or not, people seem to respond on a very personal level.</p>
      <p>We have an altogether different experience of the written word in the age of print. It reminds me of the "the medium is the message" argument (Marshal McLuhan). I believe his argument was that the Gutenberg printing press brought about the standardization of language in European countries, and the social norms that followed that technology brought about new traits such as nationalism. </p>
      <p>By its very nature, the printed word can't capture the individualism of writing, but as it's very interesting (to those of us who think a lot about typography as a communication medium along with writing and speech) to consider the differences about how we experience the two forms, and about how the two writing media subconsciously affect those who use those media.   </p>
      <p>--Kelsey</p>
