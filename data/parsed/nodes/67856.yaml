    <p>I'm very curious to hear the opinions of you insightful typophiles on the future of penmanship and the art of the cursive hand. I think there is probably consensus that the *art* of writing by hand as a practical skill is in decline. This is nothing new though--even Cicero complained that his contemporaries' handwriting was a complete mess. At the same time, it might be too narrow to judge today's handwriting by 19th century standards in which penmanship conveyed education, social status, etc. </p>
    <p>I'm also interested in cursive handwriting's influence--past, present, and future--on printed and digital media. </p>
    <p>So in a nutshell, where do you think we are headed? Has cursive died? Will it gradually evolve? </p>
    <p>--Kelsey</p>
