      <p>I'm really interested in the give-and-take between handwriting (and printing) and type. Humanist letterforms from centuries ago were made to emulate calligraphy, to an extent. Then type developed away from the written form into more modern, regular letterforms. Now we initially learn how to write (print) from geometric sans-serifs, which really haven't been around all that long, all things considered.</p>
      <p>As a thought experiment, I've been working on (and will probably never finish) an "ultra-humanist" sans, which is composed of regularized forms of my print handwriting. We learn printing from geometric sans-serifs, which are useful because the shapes are easy to reproduce, but since they're not natural our print writing relaxes over time. What happens when we base type off of handwriting that is an evolution of handwriting that is based on type that is an evolution of type that is based on handwriting? (Hint: It kind of looks like Skia and Scala Sans' love child.)</p>
      <p>Generally, I still use cursive whenever I'm hand-writing something that is directly addressed to someone else, like a thank-you note. Things that aren't intended to be seen by other people get print. Ironically enough, I use cursive in my journal, which is only meant to be seen by me.</p>
