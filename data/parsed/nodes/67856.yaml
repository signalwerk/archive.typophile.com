      <p>harsh, I can't say i agree completely.</p>
      <p>Writing will never die, pens and paper simply have better market penetration than any device. It's in decline without doubt - although I would argue only a decline back to normality.<br>
      I think there was a time in our recent history where writing became so essential we were probably using it too much - and placing too much educational emphasis on it. </p>
      <p>Thankfully devices have taken the place of the communications workhorse...personally I think most crap sent via electronic mediums isn't worth the paper it's written on. There's a quote from the boondocks which sums it up pretty well <a href="http://www.youtube.com/watch?v=OJ_qUvpyiIU" rel="nofollow">"nothing typed with someones thumbs has ever been important"</a> (excuse the casual racism...the show is quite edgy...)</p>
      <p>Regarding cursive form, again indestructible. If it was ever forgotten, someone would reinvent it the moment they were too lazy to break the stroke. You could regard txt spk as a form of cursive if you wanted to get abstract.</p>
