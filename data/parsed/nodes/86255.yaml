      <p>The proper way to reference this in your references section (according to APA):</p>
      <p>Puckett, J. (2006). Re: am i right in saying that we, as designers have a huge role to play in society. [Online forum comment]. Retrieved from <a href="http://typophile.com/node/29708#comment-170219" title="http://typophile.com/node/29708#comment-170219">http://typophile.com/node/29708#comment-170219</a></p>
      <p>Your intext citation depending on how you cite should read:</p>
      <p>Puckett (2006) said “…</p>
      <p>or</p>
      <p>…” (Puckett, 2006).</p>
      <p>And in your manuscript, do NOT make the url a clickable link. It auto does that in Word and Pages so you’ll have to disable it.</p>
