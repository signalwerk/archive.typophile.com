      <p>I have found it, through Google Books: </p>
      <p>A Spartan Bookman in his Cloister<br>
      Thought the Antique world his oyster<br>
      Times Roman were his great delight.<br>
      Italian Old Style girls the height<br>
      Of Radiant beauty. What a shame<br>
      No Wedding Text will he declaim.<br>
      Instead he’s Stymied in his Tower<br>
      Shadow like and wonder how or<br>
      When he’ll find a Lydian pal,<br>
      A Cursive Legend of a gal.<br>
      He yearns to be befriended<br>
      By Venus Bold Extended</p>
      <p>The various sources only display a few lines at a time, so the jpeg is collaged from screen grabs semi-competently in Photoshop. I have not found author info. I had some hope of resetting, but too many of the fonts have not been revived. The image is a bit blurry, but I'm guessing it was only set once. Everyone since first publication has only seen copies of copies. </p><div class="imageWrap"><img src="http://typophile.com/files/BaudyTypePoemFlat_4425.jpg"></div><p></p>
