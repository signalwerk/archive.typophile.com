    <p>I've been trying to track down a slightly bawdy typographical poem that I would guess dates to the mid-’60s. It uses the name of several typefaces, and the version I saw set the font name in the font in question (for which I will use caps): </p>
    <p>"A SPARTAN BOOKMAN in his CLOISTER thought the ANCIENT world his oyster....."</p>
    <p>and finishes: </p>
    <p>"He wants to be befriended by VENUS BOLD EXTENDED." </p>
    <p>Does anyone have this? I'd love to be able to share it with my students.</p>
    <p>jd</p>
