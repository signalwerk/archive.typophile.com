    <p>I am helping my boyfriend translate his CV into UK format, and was hoping for some advice as to font choice.</p>
    <p>He’s a computer engineer/programmer/game developer from Sweden. The jobs to which he’ll be applying are at top companies in the UK for senior programming or development positions in the games industry. In other words, everything needs to look shiny.</p>
    <p>I’m not a designer myself (but happen to be an old acquaintance of the esteemed Mr Coles; hello Stephen!) but work as a project manager for an Internet marketing consultancy.. so I’m comfortable with the layout aspects. I just want to choose a font that’s “right” for this sort of position and don’t have enough expertise myself to figure that out.</p>
    <p>Any recommendations?</p>
    <p>I should add that he’ll submit it as a PDF, with an OpenOffice accompaniment, so an alternate for the .odt part would be nice as well. Thanks!</p>
    <p>/e^10</p>
