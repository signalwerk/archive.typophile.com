      <p>Hej Erin! You’re still in the UK? Shipping the BF over?</p>
      <p>I think a professional, modern sans would be the best. Fortunuately, there’s no shortage of those. Here are a few of my favorites:</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/creative_alliance/cachet/">Cachet</a> - designed by a Brit and fairly popular among bright people over there<br>
      <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/neo_sans/">Neo Sans</a> - ditto, but more techno<br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_daxline_ot/">FF Daxline</a> - an ultra clean update to an old FontFont favorite<br>
      <a href="http://www.fontshop.com/fonts/downloads/process/klavika_ot/">Klavika</a> - Facebook’s identity typeface, can’t go wrong</p>
      <p>Don’t know what’s available in OpenOffice, but if someone can link me to a list, I’ll give you an alt.</p>
