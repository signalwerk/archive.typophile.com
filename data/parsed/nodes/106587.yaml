    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PeignotDemiModified_4826.jpg"></div><br>
      Here are your letters in the lower case of Peignot Demi -- a font designed in 1937 by A.M. Cassandre with Charles Peignot for Deberny &amp; Peignot -- with the ascenders on l, k and h clipped to the x height; the base stroke on the l extended to match the base stroke on the e; the spur on the g raised to the baseline; and all letters widened 120%.<br>
      Cassandre's "space age" design would do the job.<br>
      Don<p></p>
