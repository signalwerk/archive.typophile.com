    html: '<p>If your client is trying to create a single word, you should make it a single word. The lack of contrast in height makes it look unintentional. Try one of the following: (1) create higher ascention and just combine the words via word spacing, (2) lose the varied height completely, or (3) heighten the "A", but not the "C". <br> <br>Can you offer any explanation of what the company does? What kind of trading company? <br> <br>Aloha! <br>Scott</p>'
