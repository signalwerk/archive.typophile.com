      <p>1. Click on your username either next to your post in the thread or above the post new comment box. This brings you to your user profile page. Click the "edit" link from the control bar on that page and follow the instructions on the next page.</p>
      <p>2. Maximum dimensions for user icons are 60x60 and the maximum size is 24 kB. Inline images can be up to 599 pixels wide. Wider images will be displayed, but must be scrolled horizontally to view in full. There appears to be no limit  on image height. PNG is the preferred format, but JPG and GIF work too.</p>
      <p>3. You can attach file types other than inline images only if you are the originator of the thread. If you are the originator, you can click "edit" above the first post, and upload PDF or other file formats to the Typophile server for others to download using the features on that page. This can be done by you at the moment you originate the thread or any time after.</p>
      <p>4. If you are the originator of the thread, you can also edit the thread title through the same page where you attach a file.</p>
