      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VEB_Two_Greek_Prototype_Fon_5776.gif"></div><p></p>
      <p>My comments about your Greek characters for your Corunna typeface are the following:<br>
      Capitals<br>
      Sigma: its construction is a little unbalanced compared to the two Greek prototypes fonts.<br>
      Xi and Rho: are missing from your sample.<br>
      Phi: is too narrow.<br>
      The accent on the Greek Capital vowel letters should be moved 20-30 em to the left because they are too close to the letters.<br>
      Lower case<br>
      nu: due to its construction can be confused with upsilon.<br>
      epsilon and psi: are too narrow.<br>
      delta: is too wide.<br>
      beta: needs alternate (as shown in the prototypes that I am sending).<br>
      xi: is missing from your sample.<br>
      phi and psi: should have the same descender endings.<br>
      phi, psi and omega: should have about the same width.<br>
      omega: open up the stroke endings otherwise it will confused with the symbol of infinity or two omicron stuck together.<br>
      kappa: nowadays we use in Greek texts the Latin lower case ‘x’ instead of chi so the kappa you designed will be confused with the currently used ‘x’ as chi.<br>
      pi: the left hand side ending of the horizontal stroke of pi should be extended 30-40 em to the left, otherwise the letter looks unbalanced.<br>
      pi: the right hook (ending of the right vertical stem at the baseline) of pi should be a little bit more narrow, say the average of the hook of iota and tau.<br>
      I like your typeface very much and among its merits and most important its distinct and novel Greek classical typographic style.</p>
