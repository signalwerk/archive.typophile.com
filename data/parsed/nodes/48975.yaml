      <p>Since I also work with linguistics, I recognize the potential confusion.  But I have two seperate forms, one a bit smoother but potential more confusion and another that's got a hard straight bar that makes it quite clear which is which.</p>
      <p>Basically the idea will be for linguistics to use the a as you see here, the single bowl a, and the sharpened shchwa.  For natural languages that use the schwa, the smoother form can be used against the single bowl a.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
