    <p>I just finished working a preliminary version of Greek for Coruña.  </p>
    <p>It looks pretty good to me but I'm sure I've got a lot of mistakes so I figured a pair (or more) of fresh eyes could help me spot any problems with it.  The PDF has the modern alphabet and then all the archaic letters and most of the symbols (but not Coptic).  I'm a little unsure on some of the archaic letters but from lookin around I think I'm not the only one.  Most fonts I've seen have vastly different styles. </p>
    <p>Update: I'm almost done with a complete range of small caps (yes, even polytonic) which the base alphabet can be seen in the v 0,9b file.  I have the full polytonic range done for lowercase and 90% of uppercase so I included that.  Italic is done for modern monotonic greek but has no archaic or polytonic (yet).  Spacing is greatly improved.  </p>
    <p>December Update: Now switching gears to polishing out the italic and bold.  I THINK I might not have made the bold dark enough, but since I've only done the lowercase I figure now is the time to get the comments before I do all of the letters.</p>
