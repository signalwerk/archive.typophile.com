      <p>Here's my 2 obols' worth as a nonspecialist. I'm also not a designer, so I'll leave comment on the modern alphabet to those more competent than I am. You may want to check your outline directions, though. I think in general you've done a reasonable job of trying to make up forms that fit the logic of your modern alphabet, considering that there really isn't much to go on for a number of the characters that never existed until very recently, but in some cases the results are a little disconcerting.</p>
      <p>Sampi is a problem. While I understand the reasons that they decided to separate archaic sampi and modern sampi and then make them both have uppercase and lowercase forms, I think that in practical terms it's completely perverse. The road to hell, etc. Anyway, we're stuck with two characters that never before existed. For your uppercase modern Sampi, I'd suggest making it look a bit less like a flipped euro sign - perhaps tilt it a bit counterclockwise. Your archaic Sampi should have stronger downstrokes on the sides; at the present weight they look more like big serifs than actual strokes. The lowercase modern sampi looks like it has been squashed flat like a bug on a wall; normally there's more curvature to its spine, and the lower of the two strokes in the middle might want to have its connection moved up a bit, so it doesn't look like it's at the same angle as the upper one. For the archaic sampi, you should make up something more easily recognizable as a cursive of your uppercase form. What you have there looks kind of squashed again, and perhaps too upsilon-ish. I'd be inclined to make a single curved stroke over the top, like in some uncial forms, rather than the two curves you've got there.</p>
      <p>The uppercase San should have straight sides, like your Mu, except that the central "v" part doesn't go down to baseline. The resemblance is inconvenient, but the ancient alphabets that used San never had a Mu of Trajanic form - the sides of the Mu were diagonal and/or only the left stroke went down to baseline.</p>
      <p>The lowercase digamma is a little odd; the two horizontal strokes might want to look more visually unified. At the least, I would suggest that it needs to be brought more into the same chirographic model as your modern letters - the horizontal strokes on sigma and tau end in a slight upcurve, not a downward hook like you have on the lower horizontal stroke of the digamma. The same applies to your heta.</p>
      <p>The archaic Koppa and Stigma need longer stems, to differentiate them more clearly from Omicron and lunate Sigma.</p>
      <p>The descender on the lowercase archaic koppa looks too slanted. Normally it's either vertical or mostly vertical with a curve or flick to the right at the bottom.</p>
      <p>The lowercase modern koppa also looks a bit squashed; perhaps try curving the left stroke more to the left as it descends, and maybe not take it all the way to the baseline?</p>
      <p>The lowercase Pamphylian digamma probably shouldn't have so much descender; it looks too much like an eta.</p>
      <p>Your various lunate Sigmas look a bit anemic compared to the other uppercase letters, probably because of where you cut the ends. How are you handling the terminals on Latin C?</p>
      <p>I hope all this is at least a bit useful, and I recognize the irony of my giving design advice, when I doubt that I could do anywhere near as well as you have.</p>
