      <p>Hi Guifa, long time no see, great that you are back here again. So, you are using FontForge? I thought that you would be using FontLab instead. </p>
      <p>The ‘nu’ looks much better now and it differs from ‘upsilon’. The kappa is very distinctive and looks quite novel in design</p>
      <p>Ripping apart your typeface isn’t my style. Nymus wrote something for all those designing Oldstyle Greek typefaces and I will quote it verbatim as it is somewhat relevant.</p>
      <p>He wrote: ‘I have found out that the only Greek typefaces that are universally accepted and admired are all those that are digitized from hot metal types designed by great masters such as Bodoni, Baskerville and others... All those typefaces have certain of their letterform characteristics (hooks, blobs etc) enlarged in ways similar to the enlargement of facial characteristics in caricatures, this keeps the individual style of the typeface quite strong even at small point sizes, this is very important...’</p>
      <p>Personally I would add another point: The morphology of any novel designs of Oldstyle Greek characters should not only follow their respective and traditional Greek calligraphic forms (see Vergikios manuscripts of the Grecs du Roi) but they must also be different in concept and look than all the pre-existing Oldstyle Greek typefaces. For example TimesTen differs in quite a number of characters from TimesNewRoman and Porson, Minion Pro differs almost totally from Monotype’s Greek Upright 90.</p>
      <p>Now there are still a few of your Greek letterforms that may be enhanced a little more:</p>
      <p>LOWER CASE</p>
      <p>lambda:</p>
      <p>the ascender is too high and the letterform looks a bit like a stork, what could be done is to cheat a little and smoothen the left hand joint at the x-height. This is something that happens also with typefaces like Future that have quite small x-height in relation to the ascender height (in delta for instance) and in that case adjustments like the one that I am suggesting are made.</p>
      <p>chi:</p>
      <p>it is extremely beautiful, quite admirable.</p>
      <p>omega:</p>
      <p>the endings of the two horns should be moved 20 em upwards, and the blob in the middle 20 em downwards and it should be thickened a little also.</p>
      <p>pi:</p>
      <p>The upper horizontal stroke it would be better to be moved 20 – 30 em to the right for more balance.</p>
      <p>CAPITALS</p>
      <p>I noticed that some of your capitals are asymmetrical (Theta, Omicron, Tau, Phi, Psi and Omega) obviously it must have been done on purpose, and yet it might be better to try designing them symmetrical as well and see how it goes.</p>
      <p>Also in Kappa and Upsilon the joints in the middle are rather too low, maybe raising them higher it would look better.</p>
      <p>Epsilon:</p>
      <p>The middle bar is much thicker than the other two, it should have the same stroke thickness and its length increased by 30 – 40 em at least.</p>
      <p>Sigma:</p>
      <p>Its forms don’t balance well, some readjustments should be made.</p>
      <p>The widths of Alpha, Delta, Eta, Lambda and Pi should be readjusted to bypass certain tical illusions, for instance as Alpha, Delta and Lambda are made from the same mold so to say they end up looking dissimilar width-wise. Therefore the following alterations should be made to their width:</p>
      <p>Width_of_Delta = Width_of_Alpha minus 10 em<br>
      Width_of_Lambda = Width_of_Alpha minus 10 – 20 em</p>
      <p>Similarly:</p>
      <p>Width_of_Pi = Width_of_Eta minus 10 – 20 em</p>
      <p>For all the above I am uploading for you an image file with all the above suggestions.</p>
      <p>By the way I have also uploaded SemeleArchaicGreekLetters15N.pdf which might be of some interest to you as it contains all the Greek Archaic letterforms.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CR18_72_4359.jpg"></div><p></p>
