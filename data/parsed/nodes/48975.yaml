      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Web_AlternateOldStyle_kappa_6462.gif"></div><p></p>
      <p>Guifa hi, just now I found time to pay due attention to the design morphology of the Corruna kappa and alternate kappa as I was away for the weekend. </p>
      <p>Initially I found and Old Style Greek typeface by Compugraphic called Aztec. I am attaching a JPG with the entire alphabet.</p>
      <p>Then, replying to your question ‘Would it be best to raise or lower the kappa’s bottom stem’s connection point (eg, make it much more like a K shape or more like my alternate kappa with the И shape?’ I tried out some alternate designs and I am attaching them as well, in case they can be of any use to you.</p>
      <p>In the last line these three characters are actually another way that kappa used to designed, it wasn’t used much and yet even nowadays it is found often in contemporary Greek handwriting.</p>
      <p>By the way I just uploaded SemeleItalic to my ‘Semele’ thread at the critique forum and I am quite eager to hear your views about it</p>
