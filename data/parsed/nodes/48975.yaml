      <p>Definitely much improved, Matthew. It's hard to know what to do with some of the new characters, and I think your solutions are generally fairly sensible. The lowercase archaic sampi might benefit from having the top arched instead of flat like a tall tau: there's an uncial example at <a class="freelinking external" href="http://commons.wikimedia.org/wiki/Image:Grec_oncial_sampi.png" rel="nofollow">http://commons.wikimedia.org/wiki/Image:Grec_oncial_sampi.png</a> - you would want more curvature than that to fit with the style of your lowercase, obviously.</p>
      <p>The lowercase modern koppa and sampi are characters that are actually used, so they matter in a way that many of the Page 2 characters don't. They both look kind of squashed to me. To show you what I mean, I've used Photoshop to put them into their use context, so you can see how they look when juxtaposed with the other letters. The two numbers here are 596 using koppa and 1940 using sampi:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/coruna-596_4680.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/corunna-1940_6626.jpg"></div><p></p>
      <p>(edited to add:) I realize you've done the first and second pages at different sizes, so the letters don't really go together anyway, but I think you can still see what I mean about not being wide enough.</p>
