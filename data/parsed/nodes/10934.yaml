  html: <p><img src="http://www.typophile.com/forums/messages/30/857.gif" alt="roxyfonts"> <br>I know this message would probably be better suited in a different section but i just wanted to extend a very warm invitation for all of you to see my brand new font site. Mine is as far as i'm concerned one of the first digital type foundries in my country and this is where i'll be showing a lifetime of type ideas. I would also really appreciate any feedback on my work and any comments.  <br> <br>A blink and a smile to you all from Mexico City! <br> <br>Roxy Fonts <br>For the love of Type <br><a href="http://www.roxyfonts.com" target="_top">www.roxyfonts.com</a></p>
