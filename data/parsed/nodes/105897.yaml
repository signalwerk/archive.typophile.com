    html: <p>Have you applied appropriate vertical alignment (blue) zones in the font? Your baseline blue zone, for example, should cover both flat and overshoot shapes. Also, check that your BlueScale value setting conforms to <a href="http://typophile.com/node/42172" rel="nofollow">recommendations</a>.</p>
