    html: |-
      <p>Yes, Adobe uses its own rasteriser, which is why the results may look different between Adobe and MS apps, but both make use of hinting to arrive at those results.</p>
      <p>When creating your outlines, did you conform to PS font recommendations regarding nodes at extrema and outline efficiency? Hints interoperate with outline structure, and if you don't have nodes properly arranged the hints won't help and may produce errors.</p>
