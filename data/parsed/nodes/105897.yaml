    html: |-
      <p>I usually handle nodes at the extremas carefully. And it is easy to do with broad curves. with smaller shapes, if the extremes start messing with my outlines -- I occasionally ignore them. But not very often and not with this font.</p>
      <p>I have been messing around with the blue vertical alignment zones in the hinting layer and futzed with some of the numbers in the additional hinting parameters fields.</p>
      <p>Some results were better, some worse. It is a relief to know that Adobe doesn't ignore this stuff completely with it's proprietary rasterizer. I am hoping with a little more experimentation I can dial things in...</p>
