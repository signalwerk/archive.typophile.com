      <p>I've been messing around with the alignment zone settings trying to see if they have any effect. I'll admit the recommendations from John (above) pretty much had my head spinning.</p>
      <p>Aside from the basic hinting macro, I am wondering what is the point of dealing with it past that point if Adobe apps are going to do what they want regardless.</p>
      <p>Except my font looks ugly in many sizes and resolutions. And it's NOT a particularly ugly font. So I will need to figure something out...</p>
