    <p>I've been working on a sans serif medium weight text font -- I've been proofing it roughly in illustrator (mac platform) and been pretty happy. I'm getting close to finished now and started looking at it in InDesign. And the hinting is just crazy weird.</p>
    <p>In smaller sized, 10 and below, the overshoots on the rounded glyphs are really exaggerated, bouncing way below the baseline and way over the x height. It looks horrible on screen but still prints out just fine.</p>
    <p>I have tried both FontLab's auto hinting and The ADFKO hinting macro and pretty much have the same problem.</p>
    <p>Oddly, the hinting looks very nice in Word...</p>
    <p>How do I correct this? I have looked at the manual and hinting by hand seems awfully daunting.</p>
