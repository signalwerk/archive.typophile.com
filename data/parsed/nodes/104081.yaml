    <p>I downloaded the VSCOcam iphone app and discovered its beautiful typeface.<br>
    Honestly, i cant get it over it. Curious as to whether anyone would possibly know what typeface it is?<br>
    If you need a better look, you can head over to their website <a class="freelinking external" href="http://vsco.co" rel="nofollow">http://vsco.co</a>.</p>
    <p>I dont have a lot of knowledge on typefaces, so any help would be appreciated.<br>
    Thanks</p>
