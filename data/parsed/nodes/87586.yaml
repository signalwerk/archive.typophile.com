    <p>Hi yall, recently I'm finishing this font at Fontlab 5, I decide to add OpenType Features such as stylistic alternates and some ligatures, then when I start doing the kerning stuff, I add some kerning classes, since this, I started to have this problem when I want to test (compile) the OT features, this is what I get:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Captura-de-pantalla-2011-11-20-a-las-13_5915.13.jpg"></div><p></p>
    <p>[FATAL]  aborting because of errors:<br>
    syntax error at ","<br>
    [/Users/Rodrigo/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 1]</p>
    <p>Anyone know how can i solve this problem? I notice that when I erase all the kerning classes, OTF works normally, but when I add just one KC, this error appears, don't know why either how to solve it.<br>
    Thanks for your help!</p>
