      <p>David, you could try splitting up the font suitcase (the one with the screenfonts in it) into separate ones for each weight and just load the one for Demi, together with the corresponding printerfont.<br>
      You’ll have to do it under Classic or on an older Mac with OS 9 on it, with Font/DAMover.</p>
