    html: |-
      <p>I must say, the awful lettering of "Oregon" on the license plates is one of the things that bothered me most about moving to Oregon. Second to leaving friends and colleagues behind in Seattle, of course. On the plus side, at least a good custom license plate was available (see below)....</p>
      <p>It really does look hand lettered to me, and by an amateur. There are numerous details that suggest the  letters were customized to fit together... that "g" could interfere with adjacent descenders had there been any, the lower serifs on the "r" look like they were extended to try to fill space. But the weirdest element is the second "o" which simply doesn't match the weight of the rest.</p>
      <p>If what you want is a vector font that looks as similar as possible, it would probably be easiest to just have somebody make one, or a vector logo. It's only six letters!</p>
      <p>Regards,</p>
      <p>T</p>
      <p><img src="/sites/default/files/old-images/lic_plate_fonts_600_4397.jpg"></p>
