    html: |-
      <p>I really don't think it looks all that much like Footlight MT. None of the things that are most distinctive about the lettering are present in Footlight MT, and none of the things that are most distinctive about Footlight MT are present in that lettering.</p>
      <p>They have two things in common:<br>
      - angle of stress (seen in the capital "O")<br>
      - the lowercase g has a very wide lower counter (though quite different from each other in the two designs)</p>
