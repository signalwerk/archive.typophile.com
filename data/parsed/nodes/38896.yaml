      <p>Aside from the kerning issue—which should be dealt with—a more important one is to show a more clear hierarchy. Everything being close to the same size and color makes it less accessible and compelling. I would say: decide on three things that are most important, and make these bigger, and make the others help in a subordinate role.  Then the subordinate ones you can play with your typographic tool kit to get the right balance.  </p>
      <p>For example, the treatment of ’save the date’ doesn’t seem to have the right emotional tone. It is surrounded with something flowery, and in the same script as the name of the dinner. The emotional appeal should be in the title, I would think, and “save the date” maybe tacked on in a bold sans, maybe asymmetrically or at an angle as a matter of fact advisory. Then the later notice can be the same design without the ’save the date’ notice.</p>
    html_clean: |-
