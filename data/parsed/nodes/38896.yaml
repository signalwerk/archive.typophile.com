      <p><cite>Bert, could you be more specific about what you don’t like about the leading?</cite></p>
      <p>Close your eyes. That’s the advice my teachers gave me. Not completely, but just enough to peer through your lashes. Single letters, words and lines dissolve into cloudlike shapes. That will allow you to consider the allover colour of the piece. And you’ll be able to see where blocks of matter are uneven or too close to each other. It even helps to hold the piece upsidedown.</p>
      <p>BTW: It’s almost impossible to review something on screen. I would need a highres print.</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
