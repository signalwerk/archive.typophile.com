      <p>I think you will find that if you set the type just a bit smaller, you can accommodate much of the advice (good stuff) you’ve been given. The size of space is every bit as important as the size of the type.</p>
      <p>If you use the natural, unkerned space between, say, “R” and “Y” as the proper amount, then “kern” everything else (looser) to match that spacing, you’ll be on a good track.</p>
      <p>One general use of small caps is to not visually break up a line of type with so many full caps. But when each word begins with a cap (as with a name), you have already broken the line — or, if you prefer, established a new rhythm. Personally, I would set the “III” in full caps, and that will mean that M.D. too should be in full caps.</p>
      <p>FWIW</p>
