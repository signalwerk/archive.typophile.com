  html: <p>Hello, first post here. I did a search but couldn't find any information on my interest. <br> <br>First off let me say that I am not a type wiz and cannot name ID a font like most of you can. I just don't have the eyes or education for it. That being said I have quite a few fonts and use Suitcase to activate and browse them. And I find the process terribly limiting and time consuming. I have specific needs when looking for the font and would like the ability to sort fonts in a program by sans, serif, illustrative, script, blackletter or choose a font and have the program show me fonts in a similar style etc.  <br> <br>First question is there a system like this in place built into the font standard to tag the file with characteristics like an mp3 file? <br>Why not? (if applicable) <br> <br>Second question. What are your thoughts on this idea? Not everyone has the depth of knowledge of fonts but many people know what they are looking for and currently searching alphabetically or via foundry is not efficient. True I can go to a foundry and search their particular fonts that way but once they reach my computer they become unsorted. A user/consumer shouldn't be forced to create a filing system that should be built into the files themselves. <br> <br>Thankyou.</p>
  html_clean: <p>Hello, first post here. I did a search but couldn't find any information on my interest. <br> <br>First off let me say that I am not a type wiz and cannot name ID a font like most of you can. I just don't have the eyes or education for it. That being said I have quite a few fonts and use Suitcase to activate and browse them. And I find the process terribly limiting and time consuming. I have specific needs when looking for the font and would like the ability to sort fonts in a program by sans, serif, illustrative, script, blackletter or choose a font and have the program show me fonts in a similar style etc.  <br> <br>First question is there a system like this in place built into the font standard to tag the file with characteristics like an mp3 file? <br>Why not? (if applicable) <br> <br>Second question. What are your thoughts on this idea? Not everyone has the depth of knowledge of fonts but many people know what they are looking for and currently searching alphabetically or via foundry is not efficient. True I can go to a foundry and search their particular fonts that way but once they reach my computer they become unsorted. A user/consumer shouldn't be forced to create a filing system that should be built into the files themselves. <br> <br>Thankyou.</p>
