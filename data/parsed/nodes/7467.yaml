    html: <p>I like your idea of a tagging scheme like mp3 files.  <br> <br>There does exist something like this for fonts called the Panose System. It's rather rigorous with one of its goals to enable similar fonts to be substituted when the specified font is missing. Unfortunately, it's not well supported. I think PageMaker used it, but I don't know of other apps that do. Also, not all font vendors use it. And a Panose number by itself is not very user-friendly--2053700203 vs. Geometric Sans Serif for instance. <br> <br>In FontLab, there is something called "IBM Class" and "IBM Subclass" which would seem to be closer to what you suggest, but I don't know how much it's supported. <br> <br>The whole idea of tagging fonts with keywords is even disliked by some font vendors because it "pigeonholes" a font and might artificially limit its exposure to customers on, say, a font vending site.</p>
