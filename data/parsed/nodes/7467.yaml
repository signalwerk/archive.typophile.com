    html: <p>The main problem with Panose is that it is designed for font matching, not for the ways people think about font categories. <br> <br>Font Reserve's database is a hard-coded list of font family names and corresponding classifications, originally developed by me around 1995-96, before I went to Adobe. They have added somewhat to it over the years. I think it works reasonably well. The idea is not that it could ever be complete, but it can get probably 70-90% of the average professional user's fonts classified, and if they want to classify the rest, they can. Essentially a big "leg up" on organizing your fonts. <br> <br>Cheers, <br> <br>T</p>
