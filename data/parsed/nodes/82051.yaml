      <p>There is no clear way to evaluate the amount of time it will take to digitize these fonts if you're doing it yourself from the start. </p>
      <p>I agree that FontLab is your best bet. Like with anything though, it really depends on how much you're willing to invest in time and energy vs. what you want in outcome. Calligraphers typically write and connect letters in different ways depending on the context. To capture all the nuance and subtlety accurately would require going the longer route of learning the program well and doing the fonts in OpenType. Getting feedback from your calligrapher along the way would also be helpful. </p>
      <p>Maybe it would be worth your while to find someone in the Chicago area that does font development to work with on the project.</p>
