    <p>I'm in the process of getting a business idea in motion. I work with a very talented calligrapher. Eventually, I'd like to create an online site that would sell his fonts.</p>
    <p>Initially, in getting started, I'd like to run through the process of converting a scanned image to completed font. I'd like to get a feel for how much time will be invested into each face.</p>
    <p>The focus is going to be hand-drawn type - this brings with it the implication that these fonts might carry a lot of edge texture with them. With this in mind, what is the best route to take? </p>
    <p>Ideally, I'd like to vectorize each letter form, but I've heard their might be issues if letterforms get too detailed. I don't think I want to go the bitmap route. Is there any rule of them for determining if a typeface is too detailed to vectorize?</p>
    <p>What program would be best for accomplishing this? Fontlab? Not sure what options exist? I own photoshop and illustrator, but I'm going to have to put some money out there for obtaining a font program.</p>
    <p>To give some context to this project. I'm a graphic/web designer, been in the industry for 10 years. The guy I am working with has been at it for over 40 years. He published and known in his niche.</p>
