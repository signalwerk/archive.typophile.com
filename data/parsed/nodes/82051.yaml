      <p>James: <em>FontForge is like Fontlab, [...] the program itself seems to be twice as unstable.</em></p>
      <p>Although I don’t really see it as my task to defend FontForge, I actually think that this statement is a bit unfair. Programs may have overlapping functionality, but this does not mean by definition that the applied (quality of) technology is always identical. For instance the auto-hinter for TrueType in FontForge is one of the best I have seen so far. As you know, the program is also used for making the conversion to the Cufón format (locally or on the web). </p>
      <p>Perhaps it is not too simple to get FontForge running under X11 on the Mac or under Cygwin on the PC, but it installs very easy on, and runs solidly under Linux-distros, like for instance Ubuntu (I am actually impressed by version 11.x). Furthermore it is conveniently scriptable and it is for free (as are the Linux-distros). </p>
      <p>So far the advertisement for a competing product.</p>
      <p>Josh: <em>Ideally, I'd like to vectorize each letter form [...]</em></p>
      <p>This requires a program that converts the scanned letters into single glyph databases in batch, I reckon. In DTL’s TraceMaster one can select a (theoretically unlimited) number of tiff’s and these will be converted into one font file, as shown in this small <a href="http://www.youtube.com/watch?v=5WNDdGu9Pqg&amp;feature=mfu_in_order&amp;list=UL" rel="nofollow">YouTube movie</a>.</p>
      <p>So far the advertisement for one of our own products.</p>
      <p>FEB</p>
