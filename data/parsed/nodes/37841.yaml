    <p>It looks like I'm going to need Continuum (by Brøderbund Software) and set some text in Baltic languages with it (thankfully shortish ones). It's apparently  a free font.</p>
    <p>Is there a (commercial) version of this font with all the Baltic glyphs readily available, or do I have to make do with combinations? Which brings me to the next question, is there any better way in InDesign or Illustrator to add the tails etc to the letters than extensive kerning?</p>
    <p>Sorry for the lack of correct terms, I mean this</p>
