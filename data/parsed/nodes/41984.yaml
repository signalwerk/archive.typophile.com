  html: |-
    <p>Everybody "knows" that serif typefaces are considered to be more readable and legible for extensive text. Be we are talking about printed text. As we pass on to screen, we are confronted with new problems, because the page is not DINA4, but 1024x768px, or less. Serif text does not have the same behaviour. It is also true that new HD monitors and new processes of anti-alias have emprooved display, but still... aren´t we forcing the rules on printed text on to screen?<br>
    I guess my question is: can typography live beyond paper? I think it might, but with new rules...</p>
