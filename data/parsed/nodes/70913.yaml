  html: |-
    <p>Hey everyone,</p>
    <p>I recently started to create a serif with the "e" as the very first letter<br>
    and fell in love with the break in the upper bow.<br>
    This became the main idea of the type.</p>
    <p>Starting up with the lower cases (still not all finished) it's all a big<br>
    building site but I think it's worth it.</p>
    <p>I would really appreciate critics on my first steps on copy types<br>
    and with a little help from you, I would like to push it further!</p>
    <p>Can't wait for your input,</p>
    <p>Artur</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo_1-01_5641.png"></div><p></p>
