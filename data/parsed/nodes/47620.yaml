    html: |-
      <p>I think Yves is correct that AUSTRALIA is custom drawn. The closest I can suggest is Red Rooster's <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/radiant/" rel="nofollow">Radiant Bold Extra Condensed</a>, which includes a symmetrical U as an alternate character. A tweak to the A and added quarter circle serifs would get you pretty close.</p>
      <p>- Mike Yanega</p>
