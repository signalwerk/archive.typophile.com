    html: <p>Type founders were slow to put the sans form into metal — it had been around for many decades in signage (painted and architectural) by the time of the Caslon foundry’s type version. <br><br>Founders were also slow to add a lower case, it took decades to emerge, in fact. <br><br>So Schwartz is savvy to base his lower case on contemporary signage. Without seeing his sources, and without a knowledge of English signage of that era, it’s diﬃcult to criticize his interpretation. Do you have samples, Reminiscor? <br><br>There is another strategy for creating the lower case, which would be to derive it more closely from the serifed types of that era, which were mainly moderns. That would produce something which looked neater, and more like the English type of the era, with a less “unfolded’ curve and smaller aperture.   <br><br>But the idea that this would be more typographically authentic is false. The modern form of letter was just as developed in signage and lettering as it was in type. (This can be veriﬁed by examining gravestones.) The signwriters who developed the sans were skilled in rendering the reﬁned modern form. The diﬃculty was purely one of design — they were in terra incognita. It took a long time for a satisfactory “standard’ of the lower case sans letterform to emerge, because the task is extremely diﬃcult. (Caps much much easier.) For us today, with our tools, and knowledge and experience of the sans form, it’s relatively easy to derive a grotesque sans from the early 18th century modern serifed style, and it would work well with such type. (<span class="caps">BTW</span>, Big Caslon is not such a type, dating from almost a century earlier.) <br><br>If the lower case of Caslon’s Egyptian appears “ﬂawed”, that’s not through any lack of skill on Schwarz’s part (you won’t ﬁnd it in his other work, so why here?) but because it’s a necessary condition of his quite correct&nbsp;methodolgy.</p>
    html_clean: <p>Type founders were slow to put the sans form into metal — it had been around for many decades in signage (painted and architectural) by the time of the Caslon foundry’s type version. <br><br>Founders were also slow to add a lower case, it took decades to emerge, in fact. <br><br>So Schwartz is savvy to base his lower case on contemporary signage. Without seeing his sources, and without a knowledge of English signage of that era, it’s diﬃcult to criticize his interpretation. Do you have samples, Reminiscor? <br><br>There is another strategy for creating the lower case, which would be to derive it more closely from the serifed types of that era, which were mainly moderns. That would produce something which looked neater, and more like the English type of the era, with a less “unfolded’ curve and smaller aperture.   <br><br>But the idea that this would be more typographically authentic is false. The modern form of letter was just as developed in signage and lettering as it was in type. (This can be veriﬁed by examining gravestones.) The signwriters who developed the sans were skilled in rendering the reﬁned modern form. The diﬃculty was purely one of design — they were in terra incognita. It took a long time for a satisfactory “standard’ of the lower case sans letterform to emerge, because the task is extremely diﬃcult. (Caps much much easier.) For us today, with our tools, and knowledge and experience of the sans form, it’s relatively easy to derive a grotesque sans from the early 18th century modern serifed style, and it would work well with such type. (<span class="caps">BTW</span>, Big Caslon is not such a type, dating from almost a century earlier.) <br><br>If the lower case of Caslon’s Egyptian appears “ﬂawed”, that’s not through any lack of skill on Schwarz’s part (you won’t ﬁnd it in his other work, so why here?) but because it’s a necessary condition of his quite correct&nbsp;methodolgy.</p>
