    html: |-
      <p>Many of the artists and designers that produced posters for the psychedelic 60s were inspired by posters from the 1920s -- 1930s plus later nineteenth century "circus" types. The difference being that things become a little "liquidy" when you are <em>trippin'</em>, the result being the wonderful intertwined and melting letterforms.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/filmore1.jpg"></div><p></p>
      <p><a href="http://www.victormoscoso.com" target="new" rel="nofollow">Victor Moscoso</a> was one of the more prolific designers of the genre.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/filmore2.jpg"></div><p></p>
      <p>The <a href="http://www.sixtiesposters.com/fd36.htm" target="new" rel="nofollow">The Bindweed Press</a>, San Francisco printed the bulk of the Avalon and Filmore concert posters.</p>
      <p><a href="http://www.sixtiesposters.com/familydog1.htm" target="new" rel="nofollow">SixtiesPosters.com</a> is a great source for info on designers and posters.</p>
    html_clean: |-
