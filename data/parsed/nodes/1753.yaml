    html: '<p><b>FontLab Interpolation Tutorial</b> <br><br>Most discussions of methods to make bold letters use sans serif letters as an example. Since one of the great virtues of FontLab interpolation is that it preserves curve quality and character, I decided to use a serif example that includes curved stems and very irregular forms: Adobe Jenson Pro. <br><br>The ﬁrst thing to do is to put the original outline in the mask layer (default Ctrl+M on Windows). During interpolation, FontLab will display both the result of everything you do and the original state, but having the initial glyph shape in the mask allows you to maintain a visual reference through multiple interpolation passes. <br><br>The interpolation tool works with both <span class="caps">PS</span> and <span class="caps">TT</span> outlines. In <span class="caps">PS</span> outline mode, you can only touch on-curve nodes with the tool, but the position of oﬀ-curve control handles will be interpolated relative to touched nodes. In <span class="caps">TT</span> outline mode, you can touch both on- and oﬀ-curve points. <br><br><img src="http://www.typophile.com/forums/messages/4101/19233.gif" alt="Interpolate 1"><br>1. Here is the lowercase <i>n</i> from Adobe Jenson Pro Regular. The red arrow pointing to the toolbar above indicates the Interpolate tool. Click on this to activate the tool, or use the hotkey (default Ctrl+Alt+P on Windows). <br><br><img src="http://www.typophile.com/forums/messages/4101/19234.gif" alt="Interpolate 2"><br>2. When the tool is active, you can click and drag any point. I recommend adjusting a glyph in two passes: one x-direction and one y-direction. You can hold down Shift while dragging to constrain direction. The FontLab measurement bar will tell you how many units you are dragging and, if not constrained, at what angle. When you release a touched point, FontLab will display a preview of the result of the interpolation as a grey line. Note that when you move only one point, the grey preview shows the entire glyph shifted: this is because every untouched point has been moved relative to the ﬁrst touched point. In the illustration, you can see how I have laterally moved ﬁve points to make the stems bolder. The grey outline shows the result of these movements. You should try to touch the minimum number of points necessary to achieve your aims, this allows FontLab to interpolate all the others and to preserve curve character even when curves are stretched or compressed. <br><br><img src="http://www.typophile.com/forums/messages/4101/19235.gif" alt="Intepolate 2a"><br>3. As well as clicking and dragging points, you can specify relative or ﬁxed positions for points by opening the Set Link Destination dialogue (default Ctrl+Click on a point on Windows). I use this most of the time. <br><br><img src="http://www.typophile.com/forums/messages/4101/19236.gif" alt="Interpolate 3"><br>4. The result of the ﬁrst, x-direction pass. <br><br><img src="http://www.typophile.com/forums/messages/4101/19237.gif" alt="Interpolate 4"><br>5. In the second pass, make y-direction adjustments. In a Latin typeface, the y-direction adjustments may not be as regularised as the x-direction. For example, to increase the vertical stem weights as shown above, each touched point was moved 20 units. In the y-direction, I try to make optical compensations as I go. For example, the top of the main curve is shifted up 7 units, but the point in the crotch is raised only 3 unit, because I want the connection to the stem to remain relatively light. I’ve also used this pass to not only increase the weight of the top serif, but also to drop its tip slightly so that the diagonal is closer to that of the original outline. Note the dots with circular patterns around them, <i>e.g.</i> halfway up the left stem, these are points that have been touched but not moved. It is possible to ﬁx a point in this way, and because it has been touched other points between it and the next touched point will be interpolated. This is very useful, but you need to be very careful not to touch any point that you want to be interpolated; if you do, you will have to cancel the interpolate session and start again. <br><br><img src="http://www.typophile.com/forums/messages/4101/19238.gif" alt="Interpolate 5"><br>6. The result of the second, y-direction pass. At this point I would check the width and, if it needs adjustment, use the interpolate tool again to shift the stems further apart. I would also make any other adjustments that I have not attempted during interpolation, such as shortening the inner serifs slightly. That top serif also needs attention. <br><br>Note that you can touch a point as many times as you want within a single interpolate session, so if you are not happy with where you move it, you can move it again. All relative positioning is relative to the initial&nbsp;position.</p>'
