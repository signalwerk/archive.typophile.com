lved by looking at the other tangents on a stroke, and <br>continuing the trend. It could be visualized as a histogram of <br>thick to thin measurements. One could then adjust the relative <br>lengths of the tangents based on a variety of parameters. The <br>original curve would be altered (pushed out or in) based on the <br>tangent lines.  Incidentally, this could be applied to serifs as <br>well (they could be deﬁned by the user as part of the skeleton). <br><br>It may be possible (though diﬃcult) for the algorithm to <br>determine the appropriate skeleton strokes from the outlines, <br>which would make the operation easier on the user, but I imagine <br>that users would get better results deﬁning the skleton <br>themselves. <br><br>Does anyone else have any ideas on weight&nbsp;algorithms?</p>
