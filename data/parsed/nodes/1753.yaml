    html: <p>Peter, I work on my fonts in Illustrator then paste them into Fontographer and have found this to be a very satisfactory way of working, especially as I can scan in my pencil sketches to use as an initial guide. That said I am very familiar with Illustrator and feel its tools give me more control.   <br><br>I tried increasing my font weights in Fontographer but found the angle of diagonals would change and this is something I want to avoid. I have also found that working on the heaviest weight ﬁrst then using it as a guide for the lighter weights has been quicker than doing it the other way round.  <br><br>I must say that I agree with the comments James made about manual work helping to understanding the design rather relying on automated&nbsp;devices.</p>
