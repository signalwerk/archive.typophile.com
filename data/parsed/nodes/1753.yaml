    html: '<p>Peter, <br><br>I also like to draw glyphs in illustrator. Mainly because I can put all the glyphs on one page plus multiple weights for easy comparison. Typically though, I manually add weight to the font, point by point. For troublesome letters, print them and get out your pencil. I would not add weight in illustrator using oﬀset paths. Here’s why: <br>1. Usually doing so adds all kinds of extra and useless points, particularly in curves… so you have to go in and ﬁx them. <br>2. It adds weight uniformally ie .25pt to both sides of all curves. This isn’t good because: <br>- a. you typically add more weight to the verticals. <br>- b. this creates problems in your joins. <i>Notice in Frutiger’s drawing how little weight is added in the area where the stem and branch join.</i> <br>- c. when adding weight, your baseline stays the same but your overshoots increase a tad.<i>Again see the drawing.</i> <br><br>By the time you get rid of extraneous points and ﬁx all the problems you’ve spent more time than if you’d just added the weight manually. <br><br>About the only place this makes sense if when doing a monoline font. Even then you cannot simply draw the wireframe and make light = 1pt stroke, regular 4pt stroke, bold 7pt etc. The light weights will look ok. But they get ugly quickly as you add weight, because you need to do optical thinning and some thinning in the joins, plus baseline maintenence. Consider <a href="http://www.on-idle.com/foundry/foundry_monoline/monoline_regular.html">Foundry Monoline</a> which does those three things so subtly and masterfully, you almost cant tell they did them. But you sure as heck would have if they didn’t! Foundry Monoline used in a <a href="http://www.promecon.dk/designguide/files/visitkort.pdf"><span class="caps">PDF</span>.</a> <br><br>You can make a display font in 10 minutes with a brush and scanner. There is no free lunch if you want to make something that will pass in a text setting. It is long, and it is tedious. And in my opinion, fun. We are talking weeks, months and years. Not days, minutes, and seconds. <br><br>FontLab has better tools (as other’s described), but even then they still need tweeking. Do it manually ﬁrst so you know the do’s and don’ts. <br><br>Good Luck! <br>Randy</p>'
