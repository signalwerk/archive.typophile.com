    html: <p>I’m interested to hear about anyone’s experience writing bolding <br>algorithms. It seems like there are some pretty speciﬁc things <br>that I do over an over again when I am changing the weight of a <br>font manually. It’s almost like I am applying an algorithm, I’m <br>just doing it by hand.  I’ve been thinking about an algorithm <br>based on the relative widths of a character. I envision pulling a <br>slider to make the thicks thicker, and another to make the thins <br>thinner. Or you could do the opposite, evening out the relative <br>widths. It would be easy to manipulate weight as well as optical <br>sizes. I could even see parameters that would aﬀect how the <br>character carried the wieght, say 80% inside, 20% outside for the <br>x transformations, and 100% inside and 0% outside for the y <br>transformations. <br><br>What if I could draw a medium weight character, then push the <br>thicks wider and keep the thins. The transformations would be <br>pretty accurate for almost every character. Of course there would <br>still be manual tweaking to do, but not nearly as much. Then for a <br>lighter weight I could shrink the thicks and keep the thins, <br>evening out the weight of the strokes. While controls over x and y <br>parameters in current bolding algorithms are helpful, they really <br>mess up S’s, g’s, M’s, Z’s etc. As has been pointed out, they are <br>also insensitive to the joins. By focusing on the comparison of <br>thicks to thins, instead of x to y, most of these problems could <br>be solved. <br><br>As far as how to do this, I have envisioned a user-deﬁned <br>skeleton <a href="http://betatype.com/h1.gif" target="_blank">[image, 5k]</a>, representing various strokes. The line width at any <br>given point would be measured by looking at where the arc tangent <br>runs into the outline of the character. Some consideration would <br>have to be given to how to handle intersections, but I think this <br>could be solved by looking at the other tangents on a stroke, and <br>continuing the trend. It could be visualized as a histogram of <br>thick to thin measurements. One could then adjust the relative <br>lengths of the tangents based on a variety of parameters. The <br>original curve would be altered (pushed out or in) based on the <br>tangent lines.  Incidentally, this could be applied to serifs as <br>well (they could be deﬁned by the user as part of the skeleton). <br><br>It may be possible (though diﬃcult) for the algorithm to <br>determine the appropriate skeleton strokes from the outlines, <br>which would make the operation easier on the user, but I imagine <br>that users would get better results deﬁning the skleton <br>themselves. <br><br>Does anyone else have any ideas on weight&nbsp;algorithms?</p>
