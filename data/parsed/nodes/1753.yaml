ss in a text setting. It is long, and it is tedious. And in my opinion, fun. We are talking weeks, months and years. Not days, minutes, and seconds. <br><br>FontLab has better tools (as other’s described), but even then they still need tweeking. Do it manually ﬁrst so you know the do’s and don’ts. <br><br>Good Luck! <br>Randy</p>'
