    html: <p>Yes, extrapolation is pretty good (you can thank Adam Twardoch for that feature). You build an <span class="caps">MM</span> font, and then enter values beyond the extremes of the axis. I generally ﬁnd that one can’t go too far beyond the extreme before things start getting pretty weird — glyphs turning inside out, curves wrapping, etc. — but extrapolation is very useful for getting a head start on a light and heavy weight from a regular and a&nbsp;bold.</p>
