oint will be interpolated. This is very useful, but you need to be very careful not to touch any point that you want to be interpolated; if you do, you will have to cancel the interpolate session and start again. <br><br><img src="http://www.typophile.com/forums/messages/4101/19238.gif" alt="Interpolate 5"><br>6. The result of the second, y-direction pass. At this point I would check the width and, if it needs adjustment, use the interpolate tool again to shift the stems further apart. I would also make any other adjustments that I have not attempted during interpolation, such as shortening the inner serifs slightly. That top serif also needs attention. <br><br>Note that you can touch a point as many times as you want within a single interpolate session, so if you are not happy with where you move it, you can move it again. All relative positioning is relative to the initial&nbsp;position.</p>'
