    html: <p>The Interpolate tool in FontLab is the most eﬃcient way I have found to make bold outlines from the regular weight. This tool interpolates the position of both on and oﬀ curve points (or nodes and control handles in <span class="caps">PS</span> outlines) relative to touched points. By making two passes at a glyph, one for x-direction movements and one for y-direction movements, it is possible to increase or decrease weight while maintaining curve characteristics. Typically, the only thing that requires adjustment is transitions between stems, e.g. the crotch of the n as in Randy’s&nbsp;example.</p>
