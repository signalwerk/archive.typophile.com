    html: <p>I’ve found that FontLab 4.6 works brilliantly for extrapolation. You can also enter percentages beyond 200%, unlike Fontographer. (Though that sounds rather extreme, there were many times when I found myself wishing that that limitation could be removed from Fontographer.) <br><br>Earlier versions had a problem, but the newest one is great. <span class="caps">IIRC</span>, it also copies both source glyphs to the mask, where they stay (also unlike Fog). <br><br>Alan</p>
