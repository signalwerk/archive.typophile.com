    html: <p>The only reason for the skeleton is to deﬁne the angle at which the stroke width is to be measured. As I was trying to think of how to measure thickness at any given point, I came up with a drawing that looked a lot like the ‘e’ to the left. I just needed a mathmatical way to draw the lines based on the outline. It occurred to me that my measurement lines were all arc tangents of the average/center line. I couldn’t think of a good way to determine the center line from which I should measure the tangents, particularly where two lines intersect. One solution was a user deﬁned measurement line, separate from the ouline, which naturally (though not necessarily) would be the average of the outlining stroke. <br><br>However, the circles provide the same answer as the skeleton (thanks Randy). The appropriate angle of measurement can be determined by the points at which the diameter of the circle intersects the outline. I still need a way to translate it into appropriate movement of bezier nodes. (Idea’s anyone?). <br><br>To Hrant’s point, a stroke based system can never really work, as letterforms have evolved much further than simple lines (though their shapes are abstracty based on strokes). Apart from the bolding algorithm, I can see some usefulness in a skeleton, much like 3d animators use. The muscles and ﬂesh react to a skeleton, changing shapes according to parameters, but maintaining their integrity and form. So to Randy’s point, the skeleton would not be the basis for the design, the outlines would; the skeleton would be added after as the basis for&nbsp;transformations.</p>
