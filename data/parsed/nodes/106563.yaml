    html: <p>I was not aware Photoshop used the embedded bitmaps. (Does it use them under all sharpness modes, as well?) Yes, with fractional widths and optical kerning, you are likely to get these rounding errors. I don’t know if Adobe Photoshop listens to x-direction TrueType hints either, but those could potentially provide better control in situations like these.</p>
