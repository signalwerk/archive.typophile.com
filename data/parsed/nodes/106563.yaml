  html: |-
    <p>Hi </p>
    <p>I have made a TTF with embedded bitmaps (at 19 ppm). The font is for an editor, where you write/edit with your "normal" TTF-beziers in order to generate a bitmap-image with your embedded bitmaps.</p>
    <p>I have first made the strike and generated the .bdf in FontForge, then imported the bitmaps in Fontlab, copied them to background and then traced the pixels. Thus, the outlines are are just vectorized copies of the embedded bitmaps. I have set the spacing on each side of the glyph to one pixel:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/m_6658.jpg"></div><p></p>
    <p>However, when I test the font in Photoshop and in the editor, I get that the spacing behaves differently every time I type in the same word (the example shown is in a 96 dpi file, and the irregular spacing happens regardless if set the type in 14,25 pt or round it down to 14 pt). See attachment</p>
    <p>Now my question is; what is causing this irregular spacing of the bitmaps, and how can it be corrected? Is the problem within the font or within a setting in the applications?</p>
    <p>I am looking very much forward to getting your feedback. It will be much appreciated.</p>
    <p>Best<br>
    Elias</p>
