    html: |-
      <p>Your right. The direction does matter.</p>
      <p>The more I look the more I get ideas. I will mention them but obviously take them with a grain of salt.</p>
      <p>- I noticed ( or think I did) that you have the bottom part of the join of the bottom of the bowl in the q for Big squeeze cutting upward slightly. That looks good. I think the other q's would look better with it too. And other letters too. Like the d. The lc a in main has alternative form that is like the top of the q. It sticks out a little. I might like that even better. The top of the bowl in lc b could maybe use it too. Or be cut in &amp; down at the top join. And I am running on here... but, what about the z? What if it had a rise like you have in the lc a at the far upper left &amp; far bottom right corners? Also I wonder if the crossbar on the t needs to get slightly thicker as the face gets heavier. </p>
      <p>Many of these suggestions are a bit chirographic in nature. But the type is somewhat constructed looking. What kind of balance or impression are you going for? I don't have a very clear picture of your intentions with this face and my suggestions are comming from too many guesses about that I bet. There are probably other more abstract ways of making a balance you could be choosing too. Would you tell us about your intention a bit? What faces would it compete with do you think? Does that matter?</p>
