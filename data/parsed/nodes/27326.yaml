      <p>I have an idea about the dot. I bet you could go either way ( with the curved side orientation) if the space between the dot the rest of the letter was tighter as the letters get fatter. I should say that the narrower faces' dot looks fine to me. But I think the dots on the heavier weights are maybe breaking away from their letters - sort of breaking the grammer of the design. I am attaching an example but keep in mind I am working in whole pixel increments which are unsubtle. There is a big difference between the top &amp; bottom &amp; it's a sub pixel difference.  I think I like the top one better at this weight. Let me know what you think.</p>
