      <p>This poster: looks like <a class="freelinking external" href="http://commercialtype.com/typefaces/austin" rel="nofollow">Austin</a> for the serif (/&amp; coming from the italic style) and <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/gill-sans/" rel="nofollow">Gill Sans</a> for the sans<br>
      On website and according to css: <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/humanist-521/" rel="nofollow">Humanist 521</a> (Bitstream version fo Gill Sans), <a class="freelinking external" href="http://www.adobe.com/type/browser/landing/adobetext/adobetext.html" rel="nofollow">Adobe Text</a>, Lucida Grande, Gill Sans, Times New Roman and Austin</p>
