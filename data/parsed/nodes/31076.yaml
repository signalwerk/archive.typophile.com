      <p>Hi there:</p>
      <p>Bodoni is inherently beautiful. However if your going to choose a  'classical' Bodoni type, the Bitstream Bauer Bodoni is widely accepted one of the most elegant.</p>
      <p>For a modern spin on Bodoni, Emigre's Filosophia is a most fabulous choice.</p>
      <p>Read this article to help you make up your mind: <a href="http://www.fonthaus.com/xheight/bodoni.cfm" title="http://www.fonthaus.com/xheight/bodoni.cfm">http://www.fonthaus.com/xheight/bodoni.cfm</a></p>
