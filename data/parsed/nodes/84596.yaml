      <p>The heart is a cute idea, but it might be too much to put into this logo.  The flow is not working from f to s.  This is overall a very nice script.  I think the f and probably s need to be reworked either way.  Great start!</p>
      <p>p.s. there is a logo section of this forum where you might get better feedback.</p>
