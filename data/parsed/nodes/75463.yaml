  html: |-
    <p>Hello, </p>
    <p>Does someone know how to convert open type font to true type? I see there is a world of software online that do this, but they come with specifications and limitations that involve unfamiliar vocabulary to me. How can I be sure the software I choose is compatible with my client's proprietary font (which contains open type figure sets)?</p>
    <p>Thanks for any tips.</p>
