    html: |-
      <p>TransType, as Sii mentioned, is a popular font conversion utility, and cross-platform. There's also a newer one called <a href="http://www.macupdate.com/dev.php?id=26678" rel="nofollow">FontXChange</a> for Mac. The open source <a href="http://fontforge.sourceforge.net/" rel="nofollow">FontForge</a> editor can also convert between formats.</p>
      <p>FontXChange and FontForge both maintain OpenType features, as well as the Pro version of TransType. TransType also does automatic TrueType hinting, which the others do not (though you could add autohinting afterward with FontForge or another capable font editor).</p>
