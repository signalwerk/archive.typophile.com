    votes: null
    html: |-
      <p>I'd suggest that you either work on your calligraphy for a few weeks (at least), or try digitizing something other than your current calligraphy. At the moment you're struggling with the calligraphy and that is doubtless making the font-making part all that much harder. You don't want to try to learn both at the same time, believe me....</p>
      <p>On the calligraphy side, you're doing an italic style that is normally done with a 30 degree pen angle, but you have a much steeper pen angle that's more like 60 or 70 degrees, which is not working very well for you.</p>
      <p>Regards,</p>
      <p>T</p>
