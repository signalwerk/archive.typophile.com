    date_raw: 9 Apr 2007 — 7:24pm
    votes: null
    html: <p>I would pay particular attention to the angle of the letterforms' axes, the capital S, for example, really sticks out. The letterforms are based on calligraphy, so any intentional inconsistencies should take into account the method by which the letters would be created calligraphically.</p>
