      <p>Hi, George- have you checked out <a href="http://www.briarpress.org/"> briarpress.org?</a><br>
      It’s an online community/resource for letterpress printers and enthusiasts- definitely check it out. They have classified ads, forums, tons of info about the history of letterpress, etc. </p>
      <p>I started printing about a year ago in NYC at a place called <a href="http://www.centerforbookarts.org/newsite/">The Center for Book Arts</a> and I am hooked. It is the antidote to hours of staring at a computer screen. I’d be amazed if there wasn’t a similar Center in London... Good luck!</p>
