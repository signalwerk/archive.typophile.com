      <p>I know this is far from London, but <a href="http://www.woodtype.org/museum_information_about.shtml" title="www.woodtype.org/museum_information_about.shtml">www.woodtype.org/museum_information_about.shtml</a>. I also suggest getting a can of nice sticky, smelly ink, and a jar of kerosene. Place them open beside your computer for a few days. If you don’t mind that, then sign up!</p>
      <p>Cheers!</p>
