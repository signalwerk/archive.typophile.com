      <p>Letterpress is still viable. lots and lots of money can be made (If you are good). Get “good” when the getting is good. Masters are in short supply. Gerald might be a good place to start. There are people to visit, Jim Rimmer in Vancouver, I would certainly be willing to part with my “small wisdoms” at the same time. Richard at P22 is grounded and connected but I am not at liberty to offer his time. He is short of it, has a family and very busy at work. You could ask.</p>
      <p>Giampa</p>
