    <p>Does anyone know of or have participated in a letterpress workshop in London or around the UK? Or anyone have experience with courses in it globally? (short courses i mean, and for people who are already designers)<br>
    Im a graphic/web designer based in london (I love typography/typesetting) and have a serious itch to have a go at the traditional art of manual typesetting, wood type poster design etc<br>
    I dont know how people get into this these days as i imagine there arent any options around but having learnt all i know about design after the start of the digital age i feel like Ive totally missed out!! Not to mention i know it will inform my future work on the compooder...</p>
