    html: |-
      <p>Popular metal types were often recut by woodtype foundries. Marder's Skeleton Antique No. 2 received this treatment. The result is included in Flat-it's digital Dharma and Rama Slab families <a href="http://www.myfonts.com/fonts/flat-it/dharma-slab/" title="http://www.myfonts.com/fonts/flat-it/dharma-slab/">http://www.myfonts.com/fonts/flat-it/dharma-slab/</a> <a href="http://www.myfonts.com/fonts/flat-it/rama-slab/" title="http://www.myfonts.com/fonts/flat-it/rama-slab/">http://www.myfonts.com/fonts/flat-it/rama-slab/</a> Stroke widths, serif thicknesses and distances are more regularized than the MVB interpretation, but the condensed versions of Dharma and Rama Slab are very similar to Skeleton Antique No. 2. Dharma  Slab has seven weights. Rama Slab has six weights. Could be tinkered with to make different weights of Skeleton Antique No. 2.<br>
      Don</p>
