    html: |-
      <p>Good find! I see Holly Goldsmith based the digital font on "letterpress-printed specimens of 96-point, antique metal type." That's a really big poster size version. Note the respect the digital font shows to the differences of details between sizes in the original. For example, note the changes in the ear of the _g_. The size I posted, at 42 point, would fit between her 24 and 96.<br>
      Don</p>
