    html: |-
      <p>Thanks for the plug Riccardo.</p>
      <p>This is a very complex issue, and many people disagree even on the basics. The good news is that the dark ages of blind Latinization seem to be winding down (although we'll surely be encumbered by legacy junk for a while) and most people are now observing and thinking instead of trusting some hermetic sense of design formalism (which can result in the dysfunctional grafting of full serifs on a non-Latin script for example).</p>
      <p>I have an article entitled "Latinization: Prevention and Cure" which was published in a couple of places (with a third coming up later this year) - it might be useful to you. I can also suggest you look at my Nour&amp;Patria system which covers Armenian and Latin (and is the first ever "multilateral" multi-script typeface family) - here's a spread from a magazine that shows it:<br>
      <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a></p>
      <p>But most of all: we should all just keep talking.</p>
      <p>hhp</p>
