    <p>Got a question and wondered if someone could clear it up for me.</p>
    <p>After spacing and kerning a font to something resembling decency, I test it in a number of packages. They work fine in word processors (eg Word), fine in vector packages (eg Illustrator), and fine in other packages such as Photoshop.</p>
    <p>BUT for some reason they dont work fine in Paint Shop Pro. The spacing goes to pot, and the very basic kern feature of PSP just makes the problem even worse.</p>
    <p>One package out of ten is not overly worrying, but it is probably the most used package amoung those who would buy and use my stuff.</p>
    <p>Anyone else have similar problems, and is there something during creation that could alleviate this problem ?</p>
