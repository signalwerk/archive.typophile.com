      <p>Excellent.  Nicely done.  It is indeed.  I found out it is called Sansa Lloyds.  A custom font for Lloyd's of London.</p>
      <p><a href="http://www.lloyds.com/NR/rdonlyres/72DEA2D9-4EDC-4D8B-9946-85201D7937A5/0/Lloyds_Corporation_brand_guidelines06.pdf" rel="nofollow">Brand Guidelines for the Coorporation of Lloyd's<br>
