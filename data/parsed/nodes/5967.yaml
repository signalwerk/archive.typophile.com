  - id: 42292
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>The lower case looks exactly like Spumoni, and the upper case looks like Spumoni with added/modified serifs. I agree with Mark. <br> <br>For comparison, there are three other commercial fonts that have a strong stylistic resemblance to Spumoni (none of them match the samples): <br><a href=\"http://www.fonthaus.com/products/fonts/view.cfm?sku=SD10101\" target=\"_blank\">Elroy</a> by Christian Schwartz; <br><a href=\"http://www.fonthaus.com/products/fonts/view.cfm?sku=PN10131\" target=\"_blank\">Heatwave</a> by Panache Graphics;  <br>and Sniff by Joan Barjau of Type-O-Tones (sample follows). Sniff has the most 'embellishment', but has the same sort of casual feel that I get from Spumoni. <br> <br>The Nick Curtis font is all caps and is based (apparently) on Goudy Stout, which it resembles, with added bounce. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/42310.gif\" alt=\"Sniff sample\"></p>"
    html_clean: "<p>The lower case looks exactly like Spumoni, and the upper case looks like Spumoni with added/modified serifs. I agree with Mark. <br> <br>For comparison, there are three other commercial fonts that have a strong stylistic resemblance to Spumoni (none of them match the samples): <br><a href=\"http://www.fonthaus.com/products/fonts/view.cfm?sku=SD10101\" target=\"_blank\" class=\"link-external\">Elroy</a> by Christian Schwartz; <br><a href=\"http://www.fonthaus.com/products/fonts/view.cfm?sku=PN10131\" target=\"_blank\" class=\"link-external\">Heatwave</a> by Panache Graphics;  <br>and Sniff by Joan Barjau of Type-O-Tones (sample follows). Sniff has the most 'embellishment', but has the same sort of casual feel that I get from Spumoni. <br> <br>The Nick Curtis font is all caps and is based (apparently) on Goudy Stout, which it resembles, with added bounce. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/42310.gif\" alt=\"Sniff sample\"></p>"
