      <p>David Rakowski even got around to using it for his "Buffalo Bill" font that was distributed by Intecsas. FontFactory apparently still distributes these, but they don't show a sample. It was shown in the old Precision Type Font Reference Guide (alas, Precision type).</p>
      <p>- Mike Yanega</p>
