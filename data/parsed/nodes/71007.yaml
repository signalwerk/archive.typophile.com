      <p>The "Coffee Can" name came from the Solotype Catalog (p.36), and of course this typeface also was the inspiration for <a href="http://new.myfonts.com/fonts/adobe/rosewood/" rel="nofollow">Rosewood</a>, with its overused 'Fill' face.   The Adobe background backs up what you said Florian.</p>
      <p>- Mike Yanega</p>
