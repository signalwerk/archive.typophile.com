      <p>I think I've got a solution for you that works for adjusting an entire font's metrics or kerning at the same time in increments of your choosing.</p>
      <p>1. SAVE A COPY OF YOUR FONT AS THIS IS UNDOABLE. YOU WILL HAVE TO GO BACK TO THE OLDER VERSION IF YOU DON'T LIKE THE RESULTS AND KEEP EXPERIMENTING UNTIL YOU LIKE THE RESULT.<br>
      2. Select all glyphs with command-A.<br>
      3. Go to Tools, Transform Range<br>
      4. Under available actions:, click the arrow next to Metrics. 4-5 options come down. Click on and highlight Adjust Metrics.<br>
      5. To the right of that you will see an arrow button. You must click that button next.<br>
      6. In the window to the right that was blank, now appears "Adjust metrics (0000) by 0 units"<br>
      7. In the window at the bottom also now appears a few options you can choose from. To adjust kerning, click the box next to kerning.<br>
      8. To the right, where it says Adjust by: Click in the box and type a number like 10 or 20.<br>
      9. Click Run.<br>
      10. Keep trying until you get it the way you want. Remember to save different versions in case you change your mind later.</p>
      <p>I recommend you read "Learn Fontlab Fast". That's where I got this from.</p>
