    <p>Hi all,</p>
    <p>I'm a bit of a rookie and I hope that my question is not going to be too silly<br>
    I tried to look for something similar in your forum but I couldn't dig up anything...</p>
    <p>I'm manually kerning a typeface I designed.<br>
    Now I'm nearly finished but I realized that the kerning values I gave to the glyphs are a bit too tight<br>
    I was wondering if there was a way to automatically increase all the values by a given number (eg 20)<br>
    If possible I'd rather not touch the side bearings</p>
    <p>Thank you in advance for your time!</p>
    <p>Cheers,<br>
    mattia</p>
