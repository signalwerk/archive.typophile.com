    <p>I am designing a logo for a cafeteria in a museum. The interior space is nicely designed, simple, dark green walls. Obviously I wanted to do something relating to the courtyard, but I didn’t want to use a tree.</p>
    <p>Any thoughts?</p>
    <p>Thanks!<br>
    Lee</p>
