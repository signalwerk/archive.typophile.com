    html: <p>Are we certain that this error pertains to GPOS, and not to the 'kern' table (and I do mean kern *table*, not subtable of GPOS)? This situation would make some sense if that is the case. There is a fundamental problem with the specification of the 'kern' table, in that the length descriptor is a 16-bit unsigned integer (USHORT) with maximum capacity of 65536. But the number of pairs is also given as a USHORT, while the length of each entry is 6 bytes. So the length field will overflow whenever there are more than 10922 flat pairs (actually I think it is less than that because of some header info). Some tools, including FontLab, choke on this situation. But again, it is specifically with the 'kern' table, not GPOS kerning. I think it is possible to toggle the use of a 'kern' table when generating in FL, perhaps try playing with that and see if it makes any difference?</p>
    html_clean: <p>Are we certain that this error pertains to GPOS, and not to the 'kern' table (and I do mean kern *table*, not subtable of GPOS)? This situation would make some sense if that is the case. There is a fundamental problem with the specification of the 'kern' table, in that the length descriptor is a 16-bit unsigned integer (USHORT) with maximum capacity of 65536. But the number of pairs is also given as a USHORT, while the length of each entry is 6 bytes. So the length field will overflow whenever there are more than 10922 flat pairs (actually I think it is less than that because of some header info). Some tools, including FontLab, choke on this situation. But again, it is specifically with the 'kern' table, not GPOS kerning. I think it is possible to toggle the use of a 'kern' table when generating in FL, perhaps try playing with that and see if it makes any difference?</p>
