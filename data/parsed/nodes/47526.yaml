    html: |-
      <p>This is a pretty well-understood issue, and as Christoph pointed you towards in the first reply, you have too many classes within a single subtable, so you're breaking the 64K limit on the size of a subtable.</p>
      <p>I *think* FontLab supports the subtable break code from the AFDKO, in which case that's what you need to do (with switching over to AFDKO being more of a last resort). Christopher Slye or Miguel Sousa from my team could advise more on the detailed tactics of how to do this, if one of them stops by soon. They're both at TypeCon right now, but I expect they'll be back online in a day or two.</p>
      <p>T</p>
