    <p>Dear forum,</p>
    <p>i'm working on a really large script font with 80 ligatures and a number of alternates, so there are currently about 28.000 kerning pairs. I made a similar font before and everything worked well. Now i do not find a way to avoid the [FATAL] warning as a result of compiling the OpenType features: GPOS feature 'kern' causes overflow of offset to a subtable (0x1ce1e).</p>
    <p>Here is what i tried again and again during the last days before generating and compiling the kern feature:<br>
    - expand class kerning and reset kerning classes<br>
    - let FL automatically generate new classes with different options selected, then compressed kerning<br>
    - defined my own kerning classes<br>
    - looked up the typophile forum for similar problems</p>
    <p>I'm using FontLab Studio 5.04 for Mac.</p>
    <p>Maybe there is help out there...</p>
    <p>Hopefully,</p>
    <p>Ingo</p>
