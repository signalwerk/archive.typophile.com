      <p>The newer AFDKO didn't solve it.<br>
      Now i created new classes with  as many glyps in each class as possibe, even with glyphs whose forms that doesn't look similar at first sight. In this way i could reduce the number of kerning pairs down to 3.100 !!! Compressed to Class Kerning its only 1127 entries in the kern feature definition!!! Maybe i exaggerated it somewhat... but now there's no subtable overflow any more :-)</p>
