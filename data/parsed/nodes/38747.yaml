      <p>Off topic, but this reminds me of a common (but false) folk explanation for the Korean superstition where one is not supposed to write names in red ink—that red ink was traditionally reserved for writing the names of the dead. I remember being told by other children that writing a name in red meant that person would die.</p>
      <p>I’ve heard the actual reason for this taboo is that the First Emperor of China reserved the right to have one’s name written in red for himself and had anyone else who dared to write one’s name in red ink put to death.</p>
