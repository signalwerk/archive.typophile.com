    <p>Greetings! I am new to this site, and am glad it popped up in a search for “rules of typography.”</p>
    <p>A newspaper from my hometown has now designed their online obituaries with the person’s name set in a large, bold, sans-serif font in RED. I am aggrevated every time I read that page, and have decided that the reason goes way back to the “rule” that one never uses red type when designing for doctors, dentists, medical things, etc. The page may be viewed at:</p>
    <p><a href="http://www.dcourier.com/main.asp?SectionID=167&amp;TM=53335.12" title="http://www.dcourier.com/main.asp?SectionID=167&amp;TM=53335.12">http://www.dcourier.com/main.asp?SectionID=167&amp;TM=53335.12</a></p>
    <p> I’d like feedback on this issue, please. I appreciate it.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/38883" class="topic-previous" title="Go to previous forum topic">‹ Suitable fonts For Ladies Nite</a> <a href="/node/38676" class="topic-next" title="Go to next forum topic">Complimentary body font for Eurostile ›</a></div>
