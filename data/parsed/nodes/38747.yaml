      <p>While I’m not aware of such a rule (and it could just be that I’ve never been exposed to it), and I think I can see why this may be aggravating, the use of red for those headlines is consistent with the rest of the site’s design - all articles have headings that are red.</p>
      <p>Speaking strictly from a usability perspective, it would be bad practice to suddenly change the color of the headings/link (since those listed obituaries actually link to the individual post), because the visitors to the site would have to re-adjust the new color scheme.</p>
      <p>I’m certain this wasn’t the answer you were hoping for, but I hope it helps at least clarify what the thought process behind the decision might have been.</p>
