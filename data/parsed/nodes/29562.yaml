    html: <p>If your magazine has long articles, stick with a good serif family (Freight Text, among many other options) for text, and use Avenir instead for the sidebars, etc.</p>
    html_clean: <p>If your magazine has long articles, stick with a good serif family (Freight Text, among many other options) for text, and use Avenir instead for the sidebars, etc.</p>
  - id: 169020
    user: 3972
    date: 2006-11-17T02:11:00
    date_raw: 17 Nov 2006 — 2:11am
    votes: null
    html: |-
      <p>It's ok to use Avenir for longer text matter, I think. At least, I have done that a few times ; ). Mind that you use a fair amount of leading and that you check the basic kerning (the lighter faces need more than is built–in…). </p>
      <p>BTW You can't go wrong if you combine it with a Frutigerdesigned serif. There is something very consistent in Mr F's designs. That may have to do with his exeptional drawing skills and his great knowledge of signs (he wrote about signs — a fascinating book: Der Mensch und seine Zeichen).</p>
    html_clean: |-
