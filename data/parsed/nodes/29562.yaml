      <p>I'd say Avenir has too small of an x-height to work as text, but then again, I've never tried setting text in Avenir.</p>
      <p>Anyway, how about something like the bold weight of <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=LH.117505.0.0" target="_blank" rel="nofollow">Iridium</a> also by Adrian Frutiger?</p>
      <p>In the sans-serif category, <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=MSF.118749.0.0" target="_blank" rel="nofollow">Mostra</a> by Mark Simonson or the Titling weight of <a href="http://houseind.com/index.php?page=showfont&amp;id=18&amp;subpage=viewfonts" target="_blank" rel="nofollow">Neutraface</a> might work, depending on how bold your Avenir headings are.</p>
      <p> - Lex</p>
