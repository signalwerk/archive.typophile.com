    <p>Hello, my name is Richard, I'm a second year Graphic Communication student in the UK.  I've been making typefaces since college and have recently learnt how to put them together in Fontlabs, and this is my first completed typeface.  </p>
    <p>I started by looking at Futura and Universal, and I liked the simple geometric shapes that built up the letter-forms.  I tried to keep aspects of circles in the forms when possible.  </p>
    <p>Please excuse the arrogant title, I wasn't in a creative mood when I named it.  </p><div class="imageWrap"><img src="http://typophile.com/files/preview1_3494.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/preview2_3754.png"></div><p></p>
