    html: <p>good start. although many of your curves need refinement and the letter thickness is not consistent. for instance, the d and o in dog feel thicker than the g, and the z in lazy feels thicker than the la and y. one problem is that you are using a varied line thickness on some letters and not on others. so, if you're going to make your lowercase g vary in thickness, you need to also give the round part of your d and o a similar variation - that's where the discrepancy in visual weight is coming from. you should knock out the letters arq&amp;s and get them ABSOLUTELY PERFECT before moving on to the rest of the letters, otherwise you waste a lot of time going back and adjusting each letter. once you get those letters nailed, you can use those forms to create the majority of the rest of the letterforms.</p>
