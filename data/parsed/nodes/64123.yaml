    html: "<p>There are good things but IMVHO, it needs a bit more love before anyone can really comment constructively. Decide which glyphs/characters you are happiest with and try to emulate the thickness of the strokes on that one. Say you think h is the benchmark because you want a stressed font: perfect the h (here the junction is too thick at the top for the glyph to be homogenous); then go through the letters you think are closest to that h benchmark, put them side by side (e.g. hah) and work on the a until you match the strokes visually; then move on letter by letters. Work with a pen next to you, just so you see what the ductus is and where there would be variations in the stroke.</p>"
