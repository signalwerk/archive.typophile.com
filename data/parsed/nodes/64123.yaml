      <p>Well I think perhaps there isn't enough refinement in it. For instance, Futura really isn't so geometrically formed as it looks at first. The o's are actually somewhat condensed, and the horizontals are about 70 or 80 percent the thickness of the verticals. The rounded areas in many fonts tend to be somewhat thicker too.</p>
      <p>Some of the forms are a bit wobbly aside from that. I think the A is also definitely too condensed. The widths might also need refining.</p>
      <p>Anyway, I'm a beginner with this stuff, someone else probably knows better than I. Like the lowercase g, though. This would be interesting in a bolder weight.</p>
      <p>Briän</p>
