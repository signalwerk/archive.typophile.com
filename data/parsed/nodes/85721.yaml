    <p>Hi, I'm envisaging a syllabus-cum-research project in art history and need some suggestions about good/deep/critical introductions to Chinese and Arabic calligraphy, in a comparative perspective,and also about the relationship between calligraphy and typography in the West. So far I have only found one book in a comparative perspective (dealing with the three traditions).</p>
    <p>Any ideas?</p>
