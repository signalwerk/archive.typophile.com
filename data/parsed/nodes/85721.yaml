      <p>There are a <em>lot</em> of books on Arabic calligraphy. [Note that ‘Islamic calligraphy’ is a better term, since many of the greatest works belong to the Persian and Ottoman traditions, and the culture of calligraphy in Islam covers a much larger ethnic base than just the Arabs, although Arabic is the language of much of the text for religious reasons.]</p>
      <p>Mohamed Zakariya's monograph <em>The Calligraphy of Islam: reflections on the state of the art</em> is the only work I know of on Arabic calligraphy, in English, that accurately identifies all the classical styles (including the less common ones). Other books either have at least some errors or omit or conflate styles.</p>
      <p>Sheila Blair's <em>Islamic Calligraphy</em> is the most thorough scholarly work in English, I believe.</p>
