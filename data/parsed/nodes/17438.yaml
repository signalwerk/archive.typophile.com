    html: |-
      <p>Some good, provacative questioning here. Thank you for your time, first of all.</p>
      <p>Please don’t let my rationale lead your reaction to the design, but here’s a little more meat.  The full system incorporates a heraldic design that has been smartly modernized (and I solemnly swear I did this without gradients and 3D effects). Beginning with our name, the identity is hinged on executing the traditional model of a “guild” in a modern, relevant, even forward-looking manner.</p>
      <p>Other design impulses: a little mystique, gravitas, craft/quality/integrity, initiative/passion.</p>
      <p>So details like the angled terminals are designed to create a particular movement through the word that relates to an angle used in the shield design. I wanted this to be deliberate, and lose the visual impact in applying it globally.</p>
      <p>I placed the serifs through a reductive process, and stopped when I felt like the survivors each needed to be there.</p>
      <p>In the end, I might have been to precious about the E. You’re both right that it falls right out of line. I’ll post a revision soon.</p>
      <p>&gt; Are the horizontal strokes the same width as the verticals?</p>
      <p>No, the horizontal strokes are about 92% of the verticals (77:71 units exactly). Essentially, I want to achieve optical harmony without tipping over into an overly calligraphic stroke, for very good reasons. As the identity system incorporates a heraldic design, the goal is to avoid going too medieval with the type. All said, what do you think of the relationship in the larger sample? Am I tiptoeing too gently with the contrast?</p>
      <p>I did have a hard time developing the G, but was <em>just</em> starting to be happy with it. Can you please elaborate on “just a little trouble”? Here’s a larger drawing of it:</p>
      <p></p><div class="imageWrap"><img src="files/theguild_g.png"></div><p></p>
      <p>I was working with two versions at the time of this image, opting for the second one in the end. The question here was to thin it out for appearance, or bulk it up to create a little more emphasis on the character’s main feature. Another design aspect, such as the height of the top-left stroke’s arc, is to make the counter as roomy and “open” as possible.</p>
      <p>I have to run my dog to the vet now but will return with more versions. Please continue with this excellent feedback (I can see all you lurkers out there).</p>
