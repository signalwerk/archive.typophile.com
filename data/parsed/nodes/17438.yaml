      <p>I think that your choice of G was probably correct, however the strokes seem to flatten out slightly on the right, especially before the spur, it is difficult with screen representations to  really be certain, but I think that a slight increase in roundness might be required. The transistion from vertical to curve on the left of the U seems abrupt inside the counter. I would be concerned about reproduction at small sizes in the areas around the TH where the angle (of the T) almost seems like a serif. The horizontals on the E and L also represent as slightly too heavy.<br>
      Tim</p>
