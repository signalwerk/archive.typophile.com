      <p>I fixed my e-mail settings, it should allow private messaging now.</p>
      <p>Dan, no need to apologize. I just popped into fontlab and created alternate H, I glyphs to see what happens when I try utter consistancy. I feel pretty strongly that it’s a mistake:</p>
      <p></p><div class="imageWrap"><img src="files/theguild_typophile_dw.png"></div><br>
      <em>(not happening for me)</em><p></p>
      <p>In my earlier design, I find the spurs and angles very complimentary, both in form and through their balanced placement throughout the mark. That’s to say I don’t find it all too inconsistent, but rather integral. Especially so now that I’ve worked on the E (in part because of your initial remarks, Dan).</p>
      <p>I truly believe that people “other than in the know” will respond more to <em>qualities</em> such as “considered” and “elegant” than if it was overly ornamented (“busy” and “a font”); that audience isn’t attentive enough to those details to <em>quantify</em> them as a mistakes.</p>
      <p>Thank you again for your feedback.</p>
