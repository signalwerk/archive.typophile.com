      The serifettes in the H, G, L, and D.<br>
      You are having just a little trouble with the curves in the G.<br>
      Are the horizontal strokes the same width as the verticals? The horizontals should be a bit thinner to look the same as the verticals.<br>
      To reiterate and expand on Dan’s comment: why are some terminals angled, but not all? What’s the reasoning?<br>
      Again, I like this, but I’m left with questions.</p>
