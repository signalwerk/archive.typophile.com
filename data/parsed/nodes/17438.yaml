      <p>Thank you all for your guidance. I’m feeling much more confident in the result, having pulled my outlines into FontLab (previously in Illustrator, from inkings) and addressing the finer curves. The spur of the G especially made a difference, I think. </p>
      <p>The E has been brought into line with the overall design, balancing nicely against the U.</p>
      <p>A few of the rasterizations could use a touch of hinting (the worst ist probably the right-middle) but for the most part it reduces smartly. Quite pleased aspect, as we’ll have our share of screen applications. </p>
      <p>Again, thank you for your insights. Please e-mail me if you’re interested in the resulting identity system, or a PDF of this revision.</p>
      <p>-Nicholas</p>
