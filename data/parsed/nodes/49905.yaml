    html: |-
      <p>James, the problem is that most users will not be using a browser that supports web embedding. So far, afaik, it is only safari that supports it, with firefox coming soon.<br>
      You could try specifying century gothic, as it is a quite common win font (85% of windows users, according to <a href="http://www.codestyle.org/css/font-family/sampler-WindowsResults.shtml" rel="nofollow">this survey</a>)</p>
