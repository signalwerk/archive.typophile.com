      <p>I recommend using <a class="freelinking external" href="http://www.mikeindustries.com/sifr" rel="nofollow">sIFR (or Scalable Inman Flash Replacement)</a> for the headlines with the Futura. For body text, i guess Trebuchet is the closest option.<br>
      But check for yourself <a class="freelinking external" href="http://www.typetester.org/" rel="nofollow">here.</a></p>
      <p>Seb</p>
