  html: |-
    <p>Hi,</p>
    <p>My new client has Futura Condensed Light as corporate typeface. They use it for the body text and some headings. Can anybody recommend a technique to emulate this font with a browser-safe font? I was thinking of Arial but I am not sure if it's the best solution. Any ideas?</p>
    <p>Thanks for any help!</p>
  html_clean: |-
