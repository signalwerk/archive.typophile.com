      <p><cite>James, the problem is that most users will not be using a browser that supports web embedding.</cite></p>
      <p>The last time I checked a very healthy majority of web users are still using Internet Explorer 6.0 or later which supports Embedded OpenType. So most users would be, in fact, using a browser that supports web embedding.</p>
