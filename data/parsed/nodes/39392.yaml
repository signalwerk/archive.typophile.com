    html: |-
      <p>what I like:<br>
      - white space, correlates conceptually with outer space<br>
      - the upside/down, reverse idea in the titles<br>
      - mrs eaves for main text</p>
      <p>recommendations:<br>
      - too much white space, it gets to boring all along, try to alternate it with full/half size color/photo pages (or clipped elements)<br>
      - the elements on most of the spreads look cluttered, try to compose them in groups, and handle them consequently (for example the chapter titles are not on the same height)<br>
      - that the title on spread 55/56 is crossing the photograph in an unelegant manner<br>
      - mix of justified and unjustified setting in the main text, try to handle the main text only in one form of setting<br>
      - mix of main text sizes, try to get along only with one size, same for paragraph length<br>
      - mrs eaves for the titles, maybe you can find another font for the titles, which could be more related to ufos/outer space etc. ( maybe a sans serif with a slightly technic/constructed character)</p>
