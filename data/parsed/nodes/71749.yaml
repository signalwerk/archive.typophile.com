    <p>I'm typesetting a schedule of events for a client. </p>
    <p>The schedule table is made up of three columns of information: the time range, the event name, and the location. My question is about how best to set the ranges of time in the first column. </p>
    <p>Should the numerals in the ranges of time align vertically? Or is vertical alignment not a desirable goal because the information isn't meant to be compared or contrasted? </p>
    <p>I've attached two samples. In the first, I've aligned the numerals vertically because I think it makes it a bit more readable. In the second, however, it's more challenging to achieve a vertical alignment. I think the only way to do so would be to add more white space following the en dashes in all of the time ranges except for the one with "11:00 am." And I think that added white space looks bad.</p>
    <p>Any thoughts or suggestions? Would you not worry about vertical alignment with this type of information?</p>
