    html: |-
      <p>I'd probably set 3 tabs -- 1) an "align on" tab set to align the colons in the first column, 2) a tab for the dash, and 3) another "align on" tab to align the colons in the second column. </p>
      <p>&gt; And I think that added white space looks bad</p>
      <p>Tighten the kerning between the first two digits of "11:00". That will make the 2-digit hour closer in width to the one-digit hours.</p>
