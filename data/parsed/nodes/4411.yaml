  html: <p>Ok. I'm hoping that I get Thomas' attention. But I'm betting my boss is crazy. I know that for Adobe specifically you can transfer the license, but not sure if you can transfer the platform. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Does anyone know if it is possible to transfer licenses for software from MAC to PC? I'm specifically curious about Adobe, but anything would be interesting. Media 100 too.</p>
