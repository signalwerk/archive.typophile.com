      <p>It’s likely they used <a href="http://www.dafont.com/font.php?file=kravitz&amp;page=1&amp;nb_ppp_old=50&amp;text=everbloom&amp;nb_ppp=50&amp;classt=alpha">Kravitz Thermal</a> by Ben Belvanz which I’ll bet is based on some custom lettering from a Kravtiz album.</p>
      <p>The font isn’t one of Ben’s better attempts. That m is a mess. An alternative is <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=4&amp;displayfontid=C.106298.0.0&amp;fontRendererText=everbloom">Futura Maxi</a> whose super high x-height should make the unicasing an easier task.</p>
