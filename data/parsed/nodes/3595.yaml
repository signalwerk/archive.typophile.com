  html: <p>Okay, I know this is probably just some random condensed sans serif, but I was curious if anyone knew what typeface is used for the blue and green street signage you see all over Paris is. You can see a photo of one here -&gt; <br> <br><a href="http://www.urban75.org/paris/paris007.html" target="_top">http://www.urban75.org/paris/paris007.html</a> <br> <br>A condensed Helvetica would probably do just fine, but I'm curious nonetheless.</p>
