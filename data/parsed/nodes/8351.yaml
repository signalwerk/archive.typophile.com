    html: "<p><i>...representing a font as a data structure containing bezier control points is almost certainly not copyrightable.</i> <br> <br>Raph, if you are going to hold forth on such matters, at least do your homework. Some of us have spent many long hours studying the decisions of the US Copyright Office and specific cases. <br> <br>There was indeed a judicial decision in the Adobe, Emigre etc. vs. SSi case: a summary judgement on the basis of which SSi decided to settle since it was clear that Judge White had determined that the plaintiffs' arguments had merit. In the summary judgement, Judge White specifically determined that the placing of outline points was non-arbitrary and constituted an authorial act that was properly subject to copyright. He made this decision within the framework of the 1992 Copyright Office decision on the protectability of font software, noting that the interaction of outline definition and hinting to produce a specific result met the requirements of software copyright.</p>"
