    html: <p><i>Raph, if you are going to hold forth on such matters, at least do your homework.</i> <br> <br>But isn't people spouting off about things they know little about the primary discoursive mode of this board? If not, maybe I've misunderstood. <br> <br>Seriously, thanks for the clarification on the Adobe, Emigre vs. SSi case. Most of my info comes from this <a href="http://www-personal.umich.edu/~pfs/essay2.html">excellent review</a> by Paul Schaffner. Now that I look more closely, that review is almost 10 years old, and while I don't believe the law has changed much since then, I can certainly see how more recent decisions such as SSi can change its interpretation.</p>
