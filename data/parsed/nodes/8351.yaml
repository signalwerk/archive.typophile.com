    html: "<p>Here's my take. The law is clear that typefaces themselves cannot be copyrighted in the US. I have heard suggestions that some European countries differ. Bitmap images of fonts are absolutely not copyrightable, and representing a font as a data structure containing bezier control points is almost certainly not copyrightable. This state of affairs seems to be the desire of the typesetter industry. If one were cynical, one might suggest that they simply want to avoid having to pay any sorts of royalties to font designers. <br> <br>The trick that font distributors have used to get around this quirk of copyright law is to treat the digital representation of fonts not as pure data, but as a <i>computer program</i> which, when executed, draws the actual glyphs. <br> <br>For most popular font formats today, this legal fiction has some basis in reality. Metafont fonts and TrueType instructions unarguably have many of the characteristics of computer programs. I consider PostScript Type1 to be a bit cloudier. Originally, this font format was mostly treated as a (somewhat trivial) PostScript program and typically rendered by executing it in a PostScript interpreter. However, in practice the programming features are so restricted that it is arguably a data structure rather than a true programming language, and many Type1 renderers simply extract the charstrings and skip over any real PostScript code that happens to be embedded. <br> <br>But, for legal purposes, good enough. Type1 fonts are programs, sure. And, fast-forwarding to today, the \"features\" in OpenType (even the PS outline variants) are arguably complex and sophisticated enough to be software rather than just data. <br> <br>So how did Adobe and Emigre win? First, keep in mind that they settled, so there's still no real judicial decision. Second, from what I can see the \"infringing\" fonts were not new outlines of the same basic shapes, but were generated by extracting the Bezier outlines. This gets you into the murky waters of what constitutes a \"derivative work\". <br> <br>Quick summary, then: typefaces are not copyrightable, but for all practical purposes large corporations with teams of highly-paid lawyers can pretend they are.</p>"
    html_clean: "<p>Here's my take. The law is clear that typefaces themselves cannot be copyrighted in the US. I have heard suggestions that some European countries differ. Bitmap images of fonts are absolutely not copyrightable, and representing a font as a data structure containing bezier control points is almost certainly not copyrightable. This state of affairs seems to be the desire of the typesetter industry. If one were cynical, one might suggest that they simply want to avoid having to pay any sorts of royalties to font designers. <br> <br>The trick that font distributors have used to get around this quirk of copyright law is to treat the digital representation of fonts not as pure data, but as a <i>computer program</i> which, when executed, draws the actual glyphs. <br> <br>For most popular font formats today, this legal fiction has some basis in reality. Metafont fonts and TrueType instructions unarguably have many of the characteristics of computer programs. I consider PostScript Type1 to be a bit cloudier. Originally, this font format was mostly treated as a (somewhat trivial) PostScript program and typically rendered by executing it in a PostScript interpreter. However, in practice the programming features are so restricted that it is arguably a data structure rather than a true programming language, and many Type1 renderers simply extract the charstrings and skip over any real PostScript code that happens to be embedded. <br> <br>But, for legal purposes, good enough. Type1 fonts are programs, sure. And, fast-forwarding to today, the \"features\" in OpenType (even the PS outline variants) are arguably complex and sophisticated enough to be software rather than just data. <br> <br>So how did Adobe and Emigre win? First, keep in mind that they settled, so there's still no real judicial decision. Second, from what I can see the \"infringing\" fonts were not new outlines of the same basic shapes, but were generated by extracting the Bezier outlines. This gets you into the murky waters of what constitutes a \"derivative work\". <br> <br>Quick summary, then: typefaces are not copyrightable, but for all practical purposes large corporations with teams of highly-paid lawyers can pretend they are.</p>"
