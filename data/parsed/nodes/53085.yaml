      <p>Just found this on <a class="freelinking external" href="http://typefoundry.blogspot.com/2006/01/materials-of-typefounding.html " rel="nofollow"> James Mosley’s blog</a>:</p>
      <p>¶ Johannes Wagner, Ingolstadt *<br>
      Also known as ‘Letternservice Ingolstadt’. The foundry incorporates several firms which originated in Wagner &amp; Schmidt, matrix makers, established in Leipzig in 1875. Johannes Wagner (1888–1965) transferred his foundry from Berlin to Ingolstadt in 1949. In 1971 it acquired a large part of the materials of C. E. Weber, Stuttgart. In 1978 the foundry took over the current production of H. Berthold, Berlin, casting types from ori ginal matrices which are held in the foundry.<br>
      The foundry is reported to have ceased casting type for sale: an account of its current status and that of its materials would be welcome.<br>
      Einhundert Jahre Wagner-Schriften (Die Handsatzletter, Heft 8), Ingolstadt, November 1975.</p>
