    <p>I was looking for some information about the German type designer Johannes Wagner and his typefaces, in particular in Aurora Grotesk (released by the C.E. Weber foundry around 1912 or earlier).<br>
    If there is some resource I'd like to know more about the C.E. Weber foundry, and the whereabouts of Wagner's work.</p>
    <p>I have checked most of what's available on the web but I haven't found so much, apart from the informations provided by Linotype on their site:<br>
    <a href="http://www.linotype.com/630/johanneswagnerfoundry.html" title="http://www.linotype.com/630/johanneswagnerfoundry.html">http://www.linotype.com/630/johanneswagnerfoundry.html</a></p>
    <p>Unfortunately I do not understand German, but I would be grateful for any suggestion or indication of offline resources.</p>
