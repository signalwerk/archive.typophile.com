      <p><em>type designer Johannes Wagner </em></p>
      <p>That is not the name of a typedesigner, but of a foundry. Johannes was the son of Ludwig Wagner. One of Wagner’s companies folded in 1942 and some of their materials were taken over by C.E. Weber in Stuttgart. Johannes Wagner moved his foundry from Leipzig in East Germany to Ingolstadt in the West, shortly after World War II. (Ingolstadt is a town in Bavaria, today also the home of Audi). The company existed as Letternservice Ingolstadt until 2002. The remaining equipment is now in the Museum für Druckkunst in Leipzig.</p>
      <p>I don’t know much else of the top of my head, but if you search for Letternservice etc, you’ll find stuff. Perhaps all in German, but that is what we speak over here.</p>
