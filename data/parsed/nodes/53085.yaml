      <p>Erik, thank you so much. I appreciate a lot!</p>
      <p>I have already found most of the things on the web, including Mosley, but I'll check also for "Letternservice Ingolstadt".</p>
      <p>Now, main questions:</p>
      <p>- Who is the actual designer of Aurora Grotesk? I understand Wagner and family run the Schriftgießerei, which bear their name, but Aurora is credited to him, and seems to be a C.E. Weber release from 1912 (but I have strong reasons to believe it came out earlier, and it's a key point in my research, which is related to Italian type designs).</p>
      <p>- There is also Romana, a typeface which is credited to Gustav F. Schroeder, and the date reported is 1892, but it is also credited as a Wagner face from 1930. May it be that the Wagners re-cast it and added weights to the family?</p>
      <p>EDIT: I also wrote to the Museum and I am waiting for a reply.</p>
      <p>Many thanks again!</p>
