      <p>Incorporate an arrow at the end of the last R if you want a graffiti reference, and try a reverse with a burgundy background and white type. I agree with James on the thicker stroke. Perhaps vary the density of the stroke to emulate spray-paint as opposed to marker, or, change the stroke to emulate the giant grease markers taggers use when they go bombing.</p>
      <p>For a great watch, check out <a href="http://www.bombit-themovie.com/" rel="nofollow">the graffiti documentary “Bomb It.”</a></p>
