    html: |-
      <p>Awesome comments ... thanks! </p>
      <p>That squiggle/stick figure is my name/tag. The feet (and parts of the lower legs),form the shape of an N (for the first letter of my first name etc. up from there) and the head is in the 'shape' of a C (for the first letter of my surname etc. down from there), still a work in progress. I should focus some serious time on it but I don't know, it ain't perfect and neither am I.</p>
      <p>I always - well not always always - try to incorporate that signature/tag/squiggle/stick figure thing into my more important stuff. Few other examples I've posted <a href="http://typophile.com/node/89277" rel="nofollow">here</a> ... and <a href="http://typophile.com/node/42386" rel="nofollow">here</a> on Typophile.</p>
      <p>It all started when DONDI, Haring and SAMO did theirs ... I just had to get one up of my very own.</p>
      <p> :)</p>
    html_clean: |-
