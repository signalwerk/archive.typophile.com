    <p>Bottle front label for a micro winery (my own) that produces wines from concentrates.</p>
    <p>I wanted to keep the label's vibe crude street level and have it play off several innuendos.</p>
    <p>Comments and crits always appreciated.</p>
    <p>Thanks in advance.</p>
    <p>n.</p>
