  html: |-
    <p>Looking for the font used on the main page (and logo) of:</p>
    <p><a href="http://www.goforthinstitute.com/" title="http://www.goforthinstitute.com/">http://www.goforthinstitute.com/</a></p>
    <p>Looks like a Garamond, feels like a Garamond, but has a few differences. </p>
    <p>Things to look for:</p>
    <p>- Upper case 'J' is tapered at the end (like Granjon)<br>
    - Lower case 't' doesn't have a cusp in the northwest corner<br>
    - Ball terminal on lower case 'r' and 'a'<br>
    - Flattened top on left side of upper case 'A'<br>
    - Squiggly '?'</p>
    <p>It's almost like the lower case of Byington mixed with the upper case of Adobe Garamond, but not quite. Any ideas?</p>
    <p> - Lex</p>
