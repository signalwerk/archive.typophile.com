  html: |-
    <p>In illustrator, you can choose a key object to alight everything else selected around.</p>
    <p>Can't seem to do this in indesign though.  All I find is align with page and margins, otherwise it always alights with the upper left object in a group selected.</p>
    <p>Am I missing something.</p>
    <p>thanks!</p>
