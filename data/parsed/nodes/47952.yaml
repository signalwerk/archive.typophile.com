    <p>Here is just an experimental type called “self-square”.</p>
    <p></p><div class="imageWrap"><img src="/web/20081013103205im_/http://www.typophile.com/files/selfsquare01_6560.jpg"></div><br>
    The “self-square” develops an interaction with the user. It is just a simple grid (2x2 + diagonals) according to which the user draws freely each characters and define its weight by the choice of his tool (pen, marker, etc). The “self-square” could be printed on a tape, and then, the width of the tape determines the basic leading.<p></p>
    <p></p><div class="imageWrap"><img src="/web/20081013103205im_/http://www.typophile.com/files/selfsquare02_4391.jpg"></div><p></p>
    <p>And here, you can see that’s too easy to get a condensed version.</p>
