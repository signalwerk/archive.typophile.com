    <p>Reading Berkson's article on his Caslon Text over at ILT, I came across this fascinating image.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fourier_3724.png"></div><p></p>
    <p>"Here the white bands show the frequency of the black running across the page, with the distance between the whites I believe being about the width of the n. (Thanks to Peter Enneson for the graphic.)"</p>
    <p>Apparently this was generated from a font using Fourier transforms, but I can't seem to find much about exactly how this was done.  I have been interested in images that convey information about type faces in an abstract and non-text way for some time now.</p>
