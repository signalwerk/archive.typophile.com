      <p>[Ryan] “Ultimately I’d like to figure out some way of using this analysis method to provide qualitative feedback to a font designer while they are working on their font. I wonder if it could be used to identify ”poorer” type design, and “better” type design?”</p>
      <p>I think this is possible, but we need to establish what the benchmarks are. This might require a large comparative database, good theories about cortical integrational mechanics, and some sensitive tests for readability that go beyond basic reading speed. I think I have a decent handle on extracting spacing benchmarks from fourier transforms.</p>
      <p>I discussed fourier transforms in a presentation I did some years ago.  See:<br>
      <a href="http://www.enneson.com/public_downloads/fourier_suite/uqam_ge+eitvc+design_slides.pdf" title="http://www.enneson.com/public_downloads/fourier_suite/uqam_ge+eitvc+design_slides.pdf">http://www.enneson.com/public_downloads/fourier_suite/uqam_ge+eitvc+desi...</a><br>
      starting on page 20<br>
      <a href="http://www.enneson.com/public_downloads/fourier_suite/uqam_ge+eitvc+design_script.pdf" title="http://www.enneson.com/public_downloads/fourier_suite/uqam_ge+eitvc+design_script.pdf">http://www.enneson.com/public_downloads/fourier_suite/uqam_ge+eitvc+desi...</a><br>
      starting on page 6</p>
      <p>The incentive for doing these was a discussion on typophile initiated by Raph Levien I believe, about typographical spacing systems currently in use based on different spacing algorithms implemented in page makeup software like InDesign and QuarkXPress. I believe this was in 2005 or earlier and led to:<br>
      <a href="http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_protocols.pdf" title="http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_protocols.pdf">http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_protoco...</a><br>
      What I was looking at was the amount of “phase alignment” of  the vertical parts of strokes, as signaled by the structure of the  brightest sections on the x-axis of the transforms. White means ‘lots.’ Phase alignment has to do with proportionality in the width-of-letters dimension and spacing combined. Well-set type by typographic standards typically results in a narrow phase alignment without strong competing harmonics (such as one should find in grating patterns, where auto-correlation is ubiquitous and the phase-alignment is absolute). If the phase-alignment is so narrow it causes competing harmonics, there is a picket-fence effect.</p>
      <p>Phase alignment differs from type to type, but in all well-set type (by typographic standards), follows the same pattern:<br>
      <a href="http://www.enneson.com/public_downloads/fourier_suite/fs_font_comparison.pdf" title="http://www.enneson.com/public_downloads/fourier_suite/fs_font_comparison.pdf">http://www.enneson.com/public_downloads/fourier_suite/fs_font_comparison...</a></p>
      <p>It's characteristics also vary with weight (or boldness) and polarity:<br>
      <a href="http://www.enneson.com/public_downloads/fourier_suite/fs_blk_versus_wht.pdf" title="http://www.enneson.com/public_downloads/fourier_suite/fs_blk_versus_wht.pdf">http://www.enneson.com/public_downloads/fourier_suite/fs_blk_versus_wht.pdf</a><br>
      I haven't isolated the issue of serifs / sans serifs or contrast (traditional, eg. garamond versus modern, eg. bodoni)</p>
      <p>Here are more that relate to spacing:<br>
      <a href="http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_mendoza_coarse.pdf" title="http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_mendoza_coarse.pdf">http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_mendoza...</a><br>
      Changing spacing causes a horizontal shift in phase, and effects how diffuse or sharp the phase alignment is. Presumably these values can be quantified. This is explored further here:<br>
      <a href="http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_mendoza_fine.pdf" title="http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_mendoza_fine.pdf">http://www.enneson.com/public_downloads/fourier_suite/fs_spacing_mendoza...</a><br>
      The choice of Mendoza in these test is somewhat arbitrary — I was using the face in one of my projects.</p>
      <p>I concentrated on the information in the horizontal axis. Luciano Perondi (Italy) did some work with fourier transforms surrounding the question of even colour and irregularities in fonts for ATypI Helsinki in 2005. These factors would probably relate to other parts of the transforms than just the horizontal or vertical axis.</p>
      <p>The black in the transforms is noise. I couldn't find a more sophisticated way to highlight the aspect I was looking for.</p>
      <p>The work I did was in the frequency domain. Fourier transforms also put amplitude results in a separate channel. I tried to look at amplitude results for letters, words and extended text, but couldn't determine how amplitude results could be of use.</p>
      <p>I hope these are of use.<br>
      Peter</p>
