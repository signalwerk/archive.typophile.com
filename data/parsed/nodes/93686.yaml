      <p>Looking forward to this, thanks Peter!</p>
      <p>Ultimately I'd like to figure out some way of using this analysis method to provide qualitative feedback to a font designer while they are working on their font.  I wonder if it could be used to identify "poorer" type design, and "better" type design?</p>
      <p>Here are 2 images made from the same text.  I attempted to make them as square as possible.  The first uses a typeface I think most of us find "better" -- Gill Sans Medium.  The second uses a typeface I think most of us find "poorer" -- Comic Sans.</p>
      <p>I wonder how the resulting FFT derived and posterized images would be different between the two?</p>
      <p>Note: In an attempt to make the 2 images as close as possible, I had to adjust the scale of the Comic Sans version both in width and height, as well as its' letter and word spacing.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aeneas_Text_Gill_Sans_Medium_6146.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aeneas_Text_Comic_Sans_3896.png"></div><p></p>
