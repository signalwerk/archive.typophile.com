    html: |-
      <p>This is a proprietary variation of Fette Gotisch designed by Friedrich Wilhelm Bauer between 1860 and 1875. Versions of Fette Gotisch with highlighting similar to the Detroit Free Press, to suggest raised letters, were adopted by many newspapers for their logo.<br>
      Fette Gotisch, with minor variations, is available from <a href="http://www.myfonts.com/fonts/linotype/fette-gotisch/" rel="nofollow">Linotype</a>, <a href="http://www.myfonts.com/fonts/linotype/fette-gotisch/alternate_cuts.html" rel="nofollow">URW+++, Elsner + Flake, and Scangraphic</a>, and <a href="http://www.identifont.com/show?DWU" rel="nofollow">Mecanorma</a>.<br>
      The Detroit Free Press logo was created many years ago. I doubt that it was ever expanded to serve as a font.<br>
      In the late 19th century foundries sold highlighted blackletter  type that was somewhat similar to this logo, but I have not seen an exact match.<br>
      Don</p>
