      <p>Quite the reverse: after extensive protests from traditionalists who constantly fought to undermine it, the teaching of cursive went back to 19th-century forms. When I was a child in the mid-eighties that's what we learnt and the SÖ style was purged from history. (The SÖ style was also apparently impractical to teach and hard to write for small children. But it *looks* nice.) :)</p>
      <p>Okay, hijack over. The Renner (or whoever) primer lettering is lovely, someone sould digitize indeed.</p>
