    html: |-
      <p>I've got a great fondness for school primer lettering. In trying to teach children what, exactly, a letter looks like we're in effect attempting to reduce it to its platonic essence as a great, didactic project of modernism. It's a handwriting-based approach that's quite the opposite of the chirographic one: instead of trying to fill type with the ductus of a professional lettering artist, it's trying to instil perfect regularity in the most childlike of simple writing styles.</p>
      <p>Often it can be naive and clumsy, granted, but the best stuff is brilliant. For instance: The <a class="freelinking external" href="http://4.bp.blogspot.com/-E8ckEeMgiOU/UJpGarpLiYI/AAAAAAAAFRg/Rioer39LlmY/s400/3401114503_457fdb835c.jpg" rel="nofollow">"SÖ-style"</a> of semi-connected script taught in Sweden for about a decade in the 70s (as designed by lettering artist Kerstin Anckers) is marvellously legible.</p>
