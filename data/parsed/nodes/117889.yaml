    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pristine white 1_4947.jpeg"></div><p></p>
    <p>We found this image in a book about Paul Renner, the caption reads 'Sütterlin-Schrift, a model for children's handwriting in use in Germany in the early 1920s.' We found out Sütterlin-Schrift is a handwriting style rather than the name of the typeface. </p>
    <p>Does anyone know what the name of the typeface is? Has it ever been digitalised? Is there a similar font in existence? </p>
    <p>Many thanks in advance.</p>
  html_clean: |-
