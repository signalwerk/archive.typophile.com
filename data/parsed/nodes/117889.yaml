      <div class="comment-spam-body"><p>I note some distinctive Renner touches such as the squared bottom on _t_. The _R_ has beautiful balance and is easy to hand write. Same goes for the numbers. BTW note the _1_ which resembles a _7_ to modern typeface conditioned eyes. This is the common way the number was hand written and was not used in standard typefaces.<br>
      Don</p>
      </div>
