      <div class="comment-spam-body"><p>Johan, I don't want to encourage an extended discussion of issues that are unrelated to the [presumably] Renner letters, but I can't help but ask for a brief explanation of why, if the  "SÖ-style" of semi-connected script was so good, it was used only for a decade in the 1970's. Was it because of a wish to purge cursive writing from the teaching model? New focus on keyboarding?<br>
      Don</p>
      </div>
