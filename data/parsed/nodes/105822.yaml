    html: |-
      <p>Can't find a match and actually doubt there's one, commercially available speaking. The man behind Editions 205 is <a class="freelinking external" href="http://www.bureau205.fr" rel="nofollow">Damien Gautier of Bureau 205</a>, some of his typefaces are <a class="freelinking external" href="http://www.myfonts.com/foundry/Damien_Gautier" rel="nofollow">commercially available</a>. This one may be a bespoke typeface he created for the occasion. He may have started for instance with his <a class="freelinking external" href="http://www.bureau205.fr/colonel_article_f.html" rel="nofollow">Colonel</a> and created a light rounded weight, some sort of DIN rounded stencil light. Try asking him, he may answer.<br>
      Some alternatives, out-of-the-box: <strong><a class="freelinking external" href="http://www.hypefortype.com/browse-fonts/what-s-hot/argn.html" rel="nofollow">ARGN</a></strong>, <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-din-stencil" rel="nofollow">DIN Stencil PF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/vacant" rel="nofollow">Vacant</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/scape" rel="nofollow">Scape</a></strong> (may be the closest), <a class="freelinking external" href="http://www.myfonts.com/fonts/coreyholms/ne10" rel="nofollow">Ne10</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/club21/skye_ot" rel="nofollow">Skye</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/words-pictures/flute" rel="nofollow">Flute</a>, <a class="freelinking external" href="http://www.cataloguestudio.fr/filter/all/Signo" rel="nofollow">Signo</a></p>
