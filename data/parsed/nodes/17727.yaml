  html: |-
    <p>This new screen-based keyboard is ingenius. It’s fully contextual for each application, but more importantly allows the user to set the language on the fly, as there is a small screen behind every key. Curious what you multi-lingual designers think of this. It doesn’t hurt that it’s beautiful.</p>
    <p>As an observation, it’s interesting that this came from a Russian firm where they’re probably tired of a Latin-centric QWERTY world.</p>
    <p>I wonder what the possibilities are for languages like Chinese with enormous character sets.</p>
    <p><a href="http://www.artlebedev.com/portfolio/optimus/">http://www.artlebedev.com/portfolio/optimus/</a></p>
    <p>Thanks Jen Panasik for the link.</p>
