    html: |-
      <p>I love their site, especially their “Answers” page:</p>
      <p>“It’s in the initial stage of production.<br>
      We hope it will be released in 2006.<br>
      It will cost less than a good mobile phone.<br>
      It will be real.<br>
      It will be OS-independent (at least it’s going to be able to work in some default state with any OS).<br>
      It will support any language or layout.<br>
      Moscow is the capital of Russia.<br>
      Each key could be programmed to produce any sequence.<br>
      It will be an open-source keyboard, SDK will be available.<br>
      Some day it will be split (and made “ergonomic”).<br>
      It will most likely use the OLED technology (e-paper is sooo slow).<br>
      Our studio is located two blocks from the Kremlin.<br>
      It will feature a key-saver.<br>
      Keys could be animated when needed.<br>
      It has a numeric keypad because we love it.<br>
      There’s no snow in Moscow in summer.<br>
      It will be available worldwide (why not?) “</p>
      <p>ChrisL</p>
