      <p>I still don’t think that even if they ruled in favor of adopting copyright law into Halachahic Jewish Law that we could say that the current Orthodox law is such. This is because all Jewish law after the loss of a unified governing body -  which we had even until after the Babylonian talmud era - Is is left to the discretion of the rabbis in each community. Only something which they would all agree upon and except without exception, could be considered binding to all jews. But there are a lot of things which all rabbis agree upon and those meeting points would of-course define what is kosher or not, for those out side of that particular rabbi’s community. </p>
      <p>I just do not think that we have excepted copyright law into the Halachic framework. When a law is excepted as halachah it has a lot more at stake then a parking meter violation. Jewish Law has as much to do with ones relationship to his creator as it does with encroaching on another citizen’s right to make money, and in-fact they are one in the same. If Copyright law is part of jewish law, then by violating it I am severing my self from my creator and life-source. I am in a sense violating my very self, and the core of my being by copying someone’s fonts. I began to feel that way, and although as a teenager I had amassed a load of pirated stuff I began the painful process of removing everything that I had which was “free and easy”. But although I don’t want to copy somebody’s work, I do this not because of a religious or moral or ethical obligation but as courtesy to the one who made this program. I am affording him the rights he wishes to have. But do I think that a musician has some sort of existential right over a series of cords, or a typographer over the angle of an octothorp, no.</p>
