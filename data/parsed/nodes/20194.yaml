      <p>The Saying: WHEN IN ROME, DO AS THE ROMANS DO.</p>
      <p>Who Said It: St. Ambrose</p>
      <p>When: 387 A.D.</p>
      <p>The Story behind It: When St. Augustine arrived in Milan, he observed that the Church did not fast on Saturday as did the Church at Rome. He consulted St. Ambrose, bishop of Milan, who replied: “When I am at Rome, I fast on a Saturday; when I am at Milan, I do not. Follow the custom of the Church where you are.” The comment was changed to “When they are at Rome, they do there as they see done” by Robert Burton in his Anatomy of Melancholy. Eventually it became “When in Rome, do as the Romans do.”</p>
      <p><a href="http://www.trivia-library.com/b/origins-of-sayings-when-in-rome-do-as-the-romans-do.htm" title="http://www.trivia-library.com/b/origins-of-sayings-when-in-rome-do-as-the-romans-do.htm">http://www.trivia-library.com/b/origins-of-sayings-when-in-rome-do-as-th...</a></p>
