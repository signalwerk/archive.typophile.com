      <p>Psachya, you are getting here into complicated questions about Jewish law and ethics, which I doubt that many here are interested in. </p>
      <p>Just briefly my point of view. As a practical matter, I think Jewish law as such has radically shrunk down to ritual matters, and for the orthodox community family law. So I think the application of Jewish values to issues such as copyright is more a matter of ethical guidelines than law. These are, however extremely important because, as you say, this involves being a spiritually whole person. </p>
      <p>I do think that we have to acknowledge that there is something new under the sun, and that includes the scientific, technical and artistic innovation that characterize the modern world. Ethically, intellectual property rights are absolute key to this world. The US founding fathers recognized this as the first law passed was the patent act. They were thinking about the future and how to ensure a good one. Maimonides said that all the ethical mitzvot are to insure the ’yishuv ha-olam’, the settlement of the world. As the world changes, so the impact of ethical values changes. Copyright and patents and trademarks has to do with preserving the ability of the creator of a product to profit from it. Viewed this way, if the creation of copyright is justified in the modern world to enhance and protect creators of intellectual products, then copying something with out paying the owner is just theft. </p>
      <p>The issue is really the justification of copyrights and patents. Once you accept that—and I think the case for it is overwhelming—then copying copyright material is definitely not kosher, by my reading of Jewish ethics.</p>
