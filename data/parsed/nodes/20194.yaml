      <p>Psachya, I know there is no unified body to decide what is Jewish law—the Sanhedrin hasn’t met for quite a while!—so what is accepted often takes a generation at least for a clear majority view to arise. </p>
      <p>I thought this was a review article representing the current state of the debate, but I may well be wrong, as you say. Do you have other links—in English? </p>
      <p>The basic thing is that in the traditional context, there was no concept of intellectual innovation as something that needed protection and promotion for the sake of the general welfare of the society. But the idea that the general welfare should be promoted is central in Jewish law, so frankly I would think that in a modern context it’s a no-brainer to support copyrights and patents. Since this is an area where in general the rabbis have no power, I wouldn’t suppose it has been focused on that much. </p>
      <p>The exception is the issue of when photocopying of articles for education becomes unethical. Here there are arguments on both sides, as the article mentions. However, I think that where US courts came down is clearly right. If you wholesale photocopy articles for classes, you are depriving authors of deserved income—and doing that is against principles of Jewish law, as the article notes.</p>
      <p>Thanks for the background on ’When in Rome’. I had the feeling that it might have an earlier source than Burton, a Christian one—as Rome was their center—but I didn’t see anything.</p>
