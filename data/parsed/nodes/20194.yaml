      <p>william,<br>
      “the Sanhedrin hasn’t met for quite a while!”</p>
      <p>“In October 2004 (Tishrei 5765), a group of rabbis claiming to represent varied communities in Israel undertook a ceremony in Tiberias, where the original Sanhedrin was disbanded, which they claim re-establishes the body. The nascent Sanhedrin was established by Rabbi Dov Levanoni, who received ordination from Rabbi Moshe Halberstam, a leader of the Eda Haredis’ Beis Din Zedek religious court. Rabbi Levanoni ordained Rabbi Tzvi Idan as temporary Nasi, but he soon stepped aside in favour of well-known Jewish author Rabbi Adin Steinsaltz.”</p>
      <p>The Sanhedrin and its importance has gained a lot of respect since its re-establicshment. Probobly because of Rabbi Adin Steinsaltz.</p>
