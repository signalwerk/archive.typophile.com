      <p>Pattyfab,<br>
      As far as it being kosher. “Kosherness” takes two things into consideration.<br>
      1. Copying software (this would include fonts) is a hotly debated topic amongst contemporary Rabbis. Since there are now copyright laws in the Torah (Bible) we look for a precedence in the law. According to the original law there would be nothing wrong with copying anything. Nobody owns ideas. The Jewish People’s open-source platform and creativity produced some of the greatest stories and wisdom of the world. What could be not kosher is if you where copying and distributing intellectual property not for free but for sale, and therefore stealing the authors ability to make money.<br>
      2.  When the jews found themselves exiled and living in rome they asked themselves “do we have the moral obligation to follow roman laws?” the answer was “When in Rome... do as the romans do” which is the source for that famous quote (from the jewish talmud.) therefore even if it is “kosher” it may not be kosher if the law of the land says it is illegal. That being said, the law must be a law which is of the land, meaning the people accept and follow it as law. For example stopping a full three seconds at the stop sign has never been accepted or followed as the law of the land. Therefore it is not binding.</p>
      <p>As you can imagine, there are a lot of questions on this subject and I don’t think the western world or the rabbis have settled the debate on the ethical implications of copying intellectual property. Questions like what is ownership? what is property? what is intellectual? what is a copy? Do people think it is unethical? the people that do not copy why do they not do it ? ethics? getting caught? who loses money? </p>
      <p>By the way I think this is a lot of fun. And I keep Kosher.</p>
