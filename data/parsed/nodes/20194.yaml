      <p>I believe that Grant Hutcheson of Veer.com was once involved with Image Club, so he probably could tell you the status of these fonts. </p>
      <p>In <a href="http://www.jlaw.com/Articles/copyright1.html">this interesting article</a> it is clear that according to current Orthodox Jewish religious law copyright should be respected. (I am not Orthodox.) In fact, soon after the invention of printing, a kind of copyright protection for printers of editions of traditional works was developed. Original works are another matter, and the article makes clear that the copyright of these is also respected, and not only on the grounds of  “Dina De’Malchuta Dina”—the law of the governing authorities is the law—but also ethical grounds.</p>
      <p>By the way Psachyah, according to my ’Bartlet’s Quotations’ the ’When in Rome’ quote comes from Robert Burton (1577-1640). I don’t think it’s in the Talmud. And even “Dina De’Malchuta Dina” has its limits, according to the above article.</p>
