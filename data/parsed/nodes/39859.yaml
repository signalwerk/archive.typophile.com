    html: <p>I agree with most of what you're saying. I totally understand the down-arrow commment on the t, as well as the comment about the stories on the a vs. g, but in both cases I have to say I just personally like the look as-is, even though I can't really defend it on any rational level. :) I'll have an update soon.</p>
