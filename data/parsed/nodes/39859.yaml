      <p>I really like a lot of what I see here, although it reminds me more of Eric Gill than Paul Renner. But I take issue with some uses of the exterior only serifs. I’m not entirely sure it’s that they’re exterior only as it is that they’re symmetrical, both horizontally and vertically. The serifs just seem tacked on at the top of <strong>a</strong> and as the ear of <strong>g</strong>. I think that playing with them would really make this a strong face and add in the idiosyncrasies you speak of.</p>
      <p>Other things:</p>
      <p>•Using the serifs as the crossbar on <strong>t</strong> creates a down arrow, and it’s a distraction.<br>
      •A two-story <strong>a</strong> would go better with the three-story g.</p>
