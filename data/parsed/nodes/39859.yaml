    <p>I'm still working on <a href="http://www.typophile.com/node/39383" rel="nofollow">Shadowcliffe</a>, but had a sudden idea I wanted to play with.</p>
    <p>I've been working for two days now on <em>Metraux</em>, a display typeface based on the following requirements:</p>
    <p>- Starts with a geometric basis similar to Futura<br>
    - Low crossbars on the caps<br>
    - Wedge serifs (exterior only)<br>
    - Noitcably low x-height<br>
    - A few other idiosyncrasies here and there</p>
    <p>There's still some work to be done on the overall color, and I have quite a bit of work ahead of me in terms of kerning and such (which is HIDEOUSLY hacked at this point, so pay it no mind), but the stylistic idea is definitely there.</p>
