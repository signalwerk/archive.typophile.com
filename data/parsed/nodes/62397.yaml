    <p>Allan Haley, Director of Words and Letters at Monotype Imaging, will crown the "Typophile of the Year" here in Memphis in a couple of weeks. I’ve linked a blurb from Fast Company mentioning this. I’m looking forward to seeing some of you in this funky little town.</p>
    <p><a class="freelinking external" href="http://www.fastcompany.com/blog/fast-company-calendar/fast-company-now-blog/aiga-design-conference" rel="nofollow">Fast Company: AIGA Design Conference/Typographic Quiz</a></p>
    <p><a class="freelinking external" href="http://designconference2009.aiga.org/content.cfm/mojo" rel="nofollow">http://designconference2009.aiga.org/content.cfm/mojo</a></p>
    <p>For what it's worth, I think Elvis was far more Akzidenz-Grotesk than Rockwell, which is a little too Nashville for Elvis. TCB.</p>
