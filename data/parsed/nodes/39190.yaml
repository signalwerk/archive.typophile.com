    <p>I’m curious of the perspective on building Stylistic Alternates into a font. I have a typeface that I would like to have an alternate ’O’ that wouldn’t have a corresponding spot in my font glyph window in the way that ’Oslash’, as an alternate does.</p>
    <p>I’m new to this, but in this situation is the way to go about it to just create a new glyph and name it something unique that relates to my alternate character?, since, in this situation this is a completely original character that I want to be accessed as an open type feature just to change up the style of the font if desired.</p>
    <p>I have other fonts that I would like to do this with in the future containing multiple sylistic characters?</p>
    <p>I’m curious how this is done since what I’m doing isn’t an alternate in terms of being small caps or swash characters just creatively a unique variation on one particular character and in the future multiple characters with unique variations.</p>
    <p>Thanks for your input.</p>
    <p>Mike</p>
