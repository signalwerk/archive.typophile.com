      <p>ophello, <em>the idea of light breaking through the surface is a good concept. Your experiments with the four light rays was promising and didnt require a recognizable symbol: they were spots radiating outward.</em></p>
      <p>I appreciate your thoughts on this. My intention was to stay away from any recognizable symbol on that one as Arno said, the word is already a metaphor.</p>
      <p>However, in trying to break the direction of the previous concept, with the CB I wanted something totally different. The stars aren't anything unique; you're right. I was, however, trying to form a capital "B" with the stars. A frail attempt, but it helped break my feel for the direction and adopt a new direction. </p>
      <p>Arno, thank you for your comments. I think this sums it up best: <em>The problem with those names like baselight is, that they provoke making a matching illustration. While it can be senseful to use a matching illustration for a lamps shop, it is a risk to use such an illustration for an advertising agency, because the word already is the metaphor.</em></p>
      <p>This has really helped me to think about how "baselight" should be interpreted. I have many more paper sketches that may or may not work, too many to post here. I'm still trying to nail it down. </p>
      <p>Since this hasn't been broadcast completely, I was also thinking about discarding the name as well. You said it is plumb and uncool, and I agree to some point. However, considering the target audience, it has potential to function. I originally was going for just "bright creative" but noticed that it was taken already. </p>
      <p>I also appreciate both the explanation and clarification for the universal rule on lower case spacing of letters. Thank you. Are there any other suggestions, recommendations, or thoughts you could share? I really appreciate the time and thought put into the comments.</p>
