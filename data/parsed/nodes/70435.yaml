      <p>I like the idea of a light source spitting out magic.</p>
      <p>stars are a universal symbol: everyone knows what a star is. I recommend avoiding that symbol because it's terribly predictable. Unless you push the design, you won't surprise your audience. And the placement of the stars in your design is very condensed, clustered, orderly. those concepts are contrary to what you've talked about.</p>
      <p>the idea of light breaking through the surface is a good concept. Your experiments with the four light rays was promising and didnt require a recognizable symbol: they were spots radiating outward.</p>
      <p>I might also mention: there's a universal rule in typography (somewhat unspoken, but steadfast) that states: never letterspace lowercase letters.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br>
      I&nbsp;&nbsp;t&nbsp;&nbsp;&nbsp;d&nbsp;&nbsp;o&nbsp;&nbsp;e&nbsp;&nbsp;s&nbsp;&nbsp;n&nbsp;&nbsp;'&nbsp;&nbsp;t&nbsp;&nbsp;&nbsp;f&nbsp;&nbsp;&nbsp;l&nbsp;&nbsp;o&nbsp;&nbsp;w...it's really a legibility issue. If you want to space out your letters, always go with an uppercase. Try that and post the results!</p>
