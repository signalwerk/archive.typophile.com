      <p>The first example won me over (top left). It's simple, no frills, clear, effective. The mark you've created does not need any adornment, circles, etc. It stands perfectly well on its own. All the other treatments detract from its simplicity.</p>
      <p>I'd look at experimenting with the letter spacing amount on that example -- it looks a little too open to me.</p>
      <p>I might mention this: it looks like a fist holding a light bulb. I really like the effect (someone's grabbed an idea and is thrusting it towards me.) If that isn't what you're going for, I'd make the spiral effect of the bulb look less like a little cartoon hand. :D</p>
      <p>None of your other examples quite do it for me -- they seem like weaker, divergent derivatives of the catchyness, clarity and energy of example 1.</p>
      <p>Also, I kind of prefer the typeface you've evolved into on the bottom. The mark, however, became stale and mechanical and lacks the character of example 1. I'm not convinced that the "CB" needs to be tilted...i think thats about all I can think of.</p>
