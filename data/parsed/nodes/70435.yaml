    <p>Hello. I've been working on some logo concepts and posted it on Logopond for some feedback. However, I'd like a bit more feedback on how things are going. </p>
    <p>I'm not a logo designer but I mainly do layouts for final production. I would like to feature some of my work online or have a portfolio put together. I would really appreciate any feedback that can be offered in critiquing the concepts to build some type of direction. </p>
    <p>My original intention is to keep the logo fun, youthful, and able to reach several areas of business rather than look to industrial. The name is Baselight Creative. I'm hoping to form a small agency in the near future. Thank you for your time, I look forward to reading replies and I'll post any updates/revisions here. </p>
    <p>Feel free to view the logo in question at the following link, this is my first try so I thank you for your patience and time <a class="freelinking external" href="http://logopond.com/forum/viewtopic.php?pid=24165" rel="nofollow">Baselight Creative</a></p>
    <p>Thanks!</p>
