      <p>gillo, thanks for your comments. You're right, it is the base of the bulb, the screw part. I can see how it would resemble a compact fluorescent bulb as well. However, in my initial post way at the top in the first picture, you'll see the first concept I had. I was trying to combine the letters B,L,C into the concept which looked a bit cartoonish. Now with this concept, I get a feeling that it might be too industrial. It's not bad, but it's not what my initial intention was. </p>
      <p>I was aiming for something fun, clean and simply. Youthful and without trying to display the words "base" and "light" in the logo mark.  </p>
      <p>Arno made a good point earlier in the post by saying, <em>"The problem with those names like baselight is, that they provoke making a matching illustration. While it can be senseful to use a matching illustration for a lamps shop, it is a risk to use such an illustration for an advertising agency, because the word already is the metaphor.</em></p>
