      <p><cite>I might also mention: there's a universal rule in typography (somewhat unspoken, but steadfast) that states: never letterspace lowercase letters.</cite></p>
      <p>The rule is primary valid for distinction in body text. And it is always topped by the following rule: Good is, what works. And sometimes letterspaced lowercase letters look fine. But not here.</p>
      <p>@ zerimar3</p>
      <p>I don’t like the stars, especially not, that you have turned the three stars on the top.</p>
      <p>A candle is one of the most basic illuminants. But I would not make a candle of the i.</p>
      <p>The problem with those names like baselight is, that they provoke making a matching illustration. While it can be senseful to use a matching illustration for a lamps shop, it is a risk to use such an illustration for an advertising agency, because the word already is the metaphor. Baselight as a name for an agency is a bit plumb or uncool in my opinion, at least, if you don’t want to open a copy shop.</p>
      <p>In the two-line-examples from your second image you need edge compensation. The line "CREATIVE" is too long, because of the capital T with its white space in "BASELIGHT".</p>
