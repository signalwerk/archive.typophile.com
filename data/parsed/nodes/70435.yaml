      <p>Thank you for your comments once again. This is a personal project for a business venture I'm looking to go in. As I stated in my first post, I don't do logo designs, primarily layouts and some work in photoshop for photos. I layout brochures, catalogs and such but primarily work in brand packaging. Most work is turned over to me just to lay it. </p>
      <p>However, I've wanted to post some of my work online and possibly do a bit of freelancing, therefore I felt a logo would be best for an online portfolio and a mark for trade shows. </p>
      <p>The first questions you've asked are ones I've asked myself. I would like to keep it youthful, fun, and energetic with some longevity. I would like to be able to have a logo that adapts to say, the auto industry as well as the food industry, education, and so on. A very broad logo. </p>
      <p>When I think of a light bulb or fixture I do not want people to think we're a lighting or electrical company. This is why I threw in the logo with the dot rays (in blue and yellow). I wanted to go with a more abstract feel and something that did not relate to the word "baselight" but kept it very open. </p>
      <p>I would like to keep working on the dot ray logo and haven't discarded it because it is abstract but may need a different treatment. Regarding the "L" you don't see, it's in the more cartoonish logo on the screw part. It's a small "L" connected to the "B" without the spine. </p>
      <p>You are right in that the logo to the right shows a CB backwards but I don't mind it too much. Let me know of any other suggestions you may have regarding the dot ray logo. I'm interested in hearing them. Right now I'd like to just get as much feedback as possible from as many people, since this is my first shot at a logo design. </p>
      <p>Thank you.</p>
