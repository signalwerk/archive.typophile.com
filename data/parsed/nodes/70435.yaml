      <p>The question really comes down to this: is Baselight Creative a fun, energetic powerhouse or a serious, sophisticated, engineering firm?</p>
      <p>These two examples convey very different emotions.</p>
      <p>I understand the intellectual need you feel to cleverly combine the CB and L into one single form (I don't see the "L" yet). But you also have to ask if that kind of communication is appropriate for your client. Aside from that, the letter monogram says "CB" which is, of course, out of order...though that may not matter.</p>
      <p>I really know nothing about this company so take my comments lightly -- it's really your call. I'm sure the client will feel which of these directions is best.</p>
      <p>Overall, I'd say you've converged towards two very strong solutions. I have nothing more to add with regard to your typeface choice -- it works for me.</p>
      <p>I forgot to mention: your abstract treatment (the dot rays in blue and yellow) caught my eye but it didn't stand out enough. Don't discard that one. I think a more abstract concept might work. You have two very literal translations of "baselight" but a third more abstract idea may be the answer. I'd play with that one as well.</p>
      <p>I was just thinking...the example on the right only shows us the screw part of the bulb. what if it has some more fire and energy that the left one had?</p>
