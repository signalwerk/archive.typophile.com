      <p>&gt; for most typefaces that will have all four kinds,<br>
      &gt; proportional oldstyle figs are the best choice<br>
      &gt; for most usage.</p>
      <p>My angle is that people who need columns of numbers to line up are more likely to be people who don’t know to choose between different number styles; and people who mind badly spaced (read: tabular) numerals are more likely to be people who do know about alternates. So tabular is more fool-proof as a default; but there’s no reason to make them lining; plus making them lining makes the spacing even worse; ergo: tabular oldstyle is the best default (for a typical text face at least), assuming other styles are available. Oh, and hybrid. If other styles are not available, I would probably go for the stinky old standard, tabular lining. But: 3/4 height (except if the caps happen to be unusually short).</p>
      <p>—</p>
      <p>Paul, I’m pretty definite now that the survey results are largely meaningless because we don’t know to assume alternate availability or not. So I think we need twin surveys, one asking what an only-available num style should be, and another asking what the default would be in a full-regalia alternate scenario.</p>
      <p>hhp</p>
