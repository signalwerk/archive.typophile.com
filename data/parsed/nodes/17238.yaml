    html: |-
      <p>There are a lot people in the world who crunch numbers and are interested in the bottom line. So, for me, the default would always be tabular, which is largely the case in the fonts I have used. As Chester suggests, old style vs lining is surely a matter of which style suits the font better. </p>
      <p>An issue that really used to bug me when I worked for a corporate was that Verdana’s roman and bold numerals, while being tabular within weights, were not tabular across the whole family. If you wanted to pick out a line of a financial table in bold it threw the columns out completely. Neither Arial, nor Times suffer like this. Not sure about Comic Sans!</p>
