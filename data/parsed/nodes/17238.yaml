      <p>“I am guessing that you mean the poll to be about serif/text faces. Or do you mean the poll to include things like NOW( the sans) ?”</p>
      <p>I mean the poll to be about ALL text faces, not just serif (and not just my own). My personal belief is that the face and intended use would determine which would be best default figures. I hope apps can become smart enough to self select the instances where tabular figures are needed (any figure following a tab for starters or within a table). I avoid using Word and don’t need it except when I get files from clients.  I do use Excel and assume it would default all figures to tabular. The apps have not caught up to the OTF types yet.<br>
      My hope is that people will get to know about selecting figures in the OpenType menu and that they would be able to set their own defaults.</p>
      <p>ChrisL</p>
    html_clean: |-
