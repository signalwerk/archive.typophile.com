      <p>Of course it depends on the typeface. But for most typefaces that will have all four kinds, proportional oldstyle figs are the best choice for most usage. OTOH, when you require tabular figs you often absolutely require them…. I dunno.</p>
      <p>If they’re OpenType fonts, and you’re using OT-savvy applications, the user can just set their defaults to whatever they want, regardless of the defaults in the font. For example, I have proportional oldstyle figures on by default in InDesign. I can always change it if needed.</p>
      <p>T</p>
