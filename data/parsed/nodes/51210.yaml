  html: |-
    <p>THIS FORUM WILL SPECIALISE IN THE PROBLEMS OF iNDIC FONTS.<br>
    INDIAN SCRIPTS ARE COMPLEX AND THE COMPLEXITY IS FURTHER ENHANCED BY THE FACT THAT THERE ARE NO FIXED STANDARDS FOR DISPLAYING CONJUNCT SHAPES AS WELL AS LIGATURES.<br>
    MOREOVER THE FORUM WILL ALLOW FONTOGRAPHERS AND CALLIGRAPHERS TO PUT UP LINKS TO THEIR SITES FOR STUDYING FONTS WHICH THEY HAVE DESIGNED.<br>
    FINALLY UNICODE AND OPEN TYPE FONT DESIGN WHICH ARE CLOSELY TIED UP WILL ALSO BE STUDIED</p>
