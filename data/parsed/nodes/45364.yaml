    html: |-
      <p>I am finding the bulb at the right bottom of the e distracts me. I would reduce it. The upper right of the e seems too light. The gap produced by the very long arm of the r is also distracting. The c seems to closed. I think the tail of the y might benefit from having a more substantial and definitive finnish such as a bulb end. The same advice for the g.  The dot on the i is too light. The s is a nice design but for a different font. I don't think it works here. The ends of the z are too light and disappear. I would look at a deeper join for your n and m. Why are the strokes of the n,m,u having on the first vertical stroke be heavy and lighter afterwards? The u should not be a rotated n. </p>
      <p>Overall look at the characters and notice that some are far heavier than the others. Look at how other fonts are not like this and how they achieve and even emphasis from letter to letter. Example w vs, x </p>
      <p>I hope this is helpful.</p>
    html_clean: |-
