    <p>Thought I'd better say hello, having just joined Typophile, and introduce myself briefly-by saying that I'm Paul Lloyd, and that some of you may have come across my past efforts on the Typoasis site.  </p>
    <p>When I look back at them some are better than others but we all learn over time.  Anyway, I'm trying to get a bit more serious about things these days, and I'd be interested to hear people's thoughts on my latest project, a modern serif face called 'Fleete'.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fleete_6410.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FLEETE2_4821.jpg"></div><p></p>
    <p>All comments and criticism gratefully received!</p>
    <p>Paul.</p>
