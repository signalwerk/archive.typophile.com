    html: |-
      <p>Hello, I like the general feel to it, also I did like your book-like specimen in the beginning (though it's definitely not a face for a whole novel, for one or two pages, even in bread it could be nice). It definitely has a 19th century feel to it.</p>
      <p>I disliked the m,n,u, as it was noted by Eben already. I disliked the original g, missing the upper part of the right stem. It looks like an old "con-" or "-us" abbreviature instead of a g. I preferred the original g to the one with the bulb ending the stroke.</p>
      <p>I really like the "t"! I always wished to design a high-t, but most of the time failed to get it to harmonise with the other letters, due to the top serif issue. Nice!</p>
    html_clean: |-
