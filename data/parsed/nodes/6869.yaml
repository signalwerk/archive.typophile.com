    html: <p>The Brooklyn Dodgers logo is custom lettered, you won’t  <br>ﬁnd anything like it as a digital font. However, I noticed the  <br>T-shirt advertised on that same page uses <a href="http://www.myfonts.com/fonts/bitstream/brush-script/brush-script/testdrive.html?s=Brooklyn&amp;p=48" target="_blank"> Brush Script</a>. <br><br>There are some scripts that have a swash like that, notably  <br>Letterhead Fonts’ <a href="http://www.letterheadfonts.com/contributors/tomkennedy/ballpark.shtml" target="_blank"> Ballpark Script</a> <i>(The Font Formerly Known  <br>As Pilsner Script)</i> and Nick Curtis’ free <a href="http://www.getfreefonts.com/fonts/431.html" target="_blank"> Teamspirit</a>.</p>
