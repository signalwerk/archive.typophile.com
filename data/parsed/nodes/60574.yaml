      <p>This looks like a bunch of fonts that are out there already, but some of the angles you've chosen for the bowls (for ex. a, g) are rather nice. I like the bolder weights more.</p>
      <p>I'd consider rounding the outside corners of the sharp-angled letters like N,W, etc.</p>
