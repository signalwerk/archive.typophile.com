  html: <p>I considered putting this under "Display" but I hope to also show you guys a non-stencil Sans version in the near future. <br> <br>Why stencil? Because I figure everyone needs a stencil typeface in their library and I'd rather make my own rather than use someone else's creation. <br> <br><img src="http://www.typophile.com/forums/messages/29/1079.jpg" alt="Equanimity Stencil "></p>
