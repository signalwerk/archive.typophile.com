    html: <p> John, very likable face.  <br> <br>The new letters appear to change what made this different -- the stencil gaps were all vertical. However, the changes are more pleasing. <br> <br>If you are going to make this change througout, then the 7 and Z are also candidates. <br> <br>Also, the R might look better if it follows from the B form. <br> <br>The only other thing is the H. The small stubs almost disappear. <br> <br>good job <br>bj </p>
