    html: <p> I agree. The way those letters ended up is a result of having such a narrow width. When diagonals come together separated by the stencil support (whatever they're called) it looks like it's one big geometric shape with a line through it, rather than a couple of bars coming together. <br> <br>The way other stencils have solved this is to have the support diagonal rather than vertical. When I first created the typeface, however, I was hoping to avoid that because I wanted it to be more uniform... I may have to reconsider that. <br> <br>Any comments on the "Q"? It gave me some trouble and I'm not sure I like how it turned out. </p>
