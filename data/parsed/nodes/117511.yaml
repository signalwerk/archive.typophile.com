    html: <p>Have you tried comparing your typeface with a regular arabic typeface in your operating system? Because the sample you are showing here seems a bit illegible to me. I can read arabic script but not the arabic language just farsi. Contrast is reversed in arabic script so horizontal lines are thicker. This is not a universal rule but this could make your design ugly or beautiful in eyes of many designers. I can't point to some of the glyphs here but the last letter in the fifth line should be similar to the second letter in the seventh line and the difference is only in the dots. But in your design shape of the base character is also different which in the fifth line looks better. Any way you are better off showing the character set view of the font.</p>
    html_clean: <p>Have you tried comparing your typeface with a regular arabic typeface in your operating system? Because the sample you are showing here seems a bit illegible to me. I can read arabic script but not the arabic language just farsi. Contrast is reversed in arabic script so horizontal lines are thicker. This is not a universal rule but this could make your design ugly or beautiful in eyes of many designers. I can't point to some of the glyphs here but the last letter in the fifth line should be similar to the second letter in the seventh line and the difference is only in the dots. But in your design shape of the base character is also different which in the fifth line looks better. Any way you are better off showing the character set view of the font.</p>
