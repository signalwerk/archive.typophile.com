    html: "<p><i>16. There are no bonus points awarded for correctly answering  <br>two or more questions in a row, [..] the honour is reward enough.</i> <br> <br>Then the quizmaster should create a Type Quiz Hall of Fame, where <br>people would be inducted after a certain number of correct answers. <br>This will also give them the right to sport a Type Quiz Hall of <br>Fame badge, perhaps in the form of an icon included into their  <br>typophile pic. ;)  If you're anal, you'll create a \"tiered\" hall of  <br>fame, with different levels of \"honour\".  ;) <br> <br> <br><i>Rodolfo, are you sure it's 19th century, and not late 18th?</i> <br> <br>19th. Well, I realize that this is difficult - the connection to <br>typographic mainstream, apart from the legibility research, is <br>tenuous. Tips, tips, tips: the gentleman in question was financed <br>in his endeavours by a <b>lovely</b> lady, the daughter of a famous  <br>poet, who for his part died far from home, in a country for which  <br>independence he had fought. <br> <br>If no one gets it now, I'll post an easy one (I won't be able to  <br>stay online all the time!).</p>"
