    html: |-
      <p>After seeing it working, I'm pretty sure I could find a use for it in ID. I notice TextEdit pastes the selections on separate lines after a copy -- pretty neat.</p>
      <p>A related feature I occasionally miss from my old PageMaker dayz is selecting columns of text. With PageMaker, you could select any text <em>vertically</em>, right out of the middle of running paragraphs, and cut, copy, or format at will.</p>
      <p>The thing is, these sort of things are not built-in behaviour. A programmer has to physically work around the "single-selection" paradigm that has been a part of GUIs for ages.</p>
