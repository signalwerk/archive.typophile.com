    html: |-
      <p>I can’t see why anyone would list membership in most graphic design organizations on business cards or a resume. Unlike architectural, industrial, and interior design associations, most graphic design organizations aren’t accrediting organizations, there are no qualifications to join them, they don’t regulate anything or intercede in matters on behalf of designers and clients, and in the case of NAPP, it’s really just an overpriced magazine subscription. Unless you’re just sucking up to someone who is a very active member of an organization and unlikely to hire nonmembers, it’s just window dressing.</p>
      <p>And as for Typophile, the last time I was helping someone review resumes, people who added stuff like blogging and web forum activity to their resumes went right into the trash. Who wants to hire someone who spends so much time on web forums that he puts it on a resume?</p>
