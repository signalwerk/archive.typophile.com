    <p>Where does Typophile rank among other design associations/instituations, like NAPP or AIGA? Is it considered a design association at all?</p>
    <p>I’m considering adding Typophile to my resume’ as one of my design memberships. I figure the amount of knowledge I’ve accumulated over the years posting on Typophile would qualify this.</p>
    <p>How do the rest of you feel about that? Is that a bit much? Would this be noticed/respected by potential employers (I’m betting yes myself)?</p>
