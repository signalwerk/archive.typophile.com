  html: |-
    <p>I’ve always been interested to see how (type) designers succeed in incorporating historical models in contemporary graphic design. Case in point, uncial typefaces do nothing for me, but the solution Janno Hahn came up with is very interesting and beautifully designed (yes, the outlines are indeed a bit rugged as they were truly hand drawn). As <a href="https://web.archive.org/web/20080830095101/http://www.typographer.org/">David</a> puts it: <em>“It really is lovely to see such letterforms being updated and used in a modern context, (...)”.</em></p>
    <p>You can see it in <a href="https://web.archive.org/web/20080830095101/http://www.fontshop.be/details.php?entry=235">my Unzipped blog</a>, complete with sketches and production images. I’m curious to find out what some of you think of it.</p>
