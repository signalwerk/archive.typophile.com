    html: <p>This is clearly some type of <a href="http://www.myfonts.com/fonts/bitstream/engravers-gothic/" target="_blank"> Engravers' Gothic</a>. If you remove  <br>the shade line on <a href="http://www.myfonts.com/fonts/redrooster/steelplate-gothic-rr/" target="_blank"> Steelplate Gothic RR</a> or Aboutype's <a href="http://www.myfonts.com/fonts/aboutype/bitters/" target="_blank"> Bitters</a>  <br>you get pretty close. Storm's <a href="http://www.myfonts.com/fonts/storm/zeppelin/" target="_blank"> Zeppelin</a> is simply too wide.</p>
