    <p>Can anyone identify this script?  Victoria's Secret has been using it extensively for their holiday marketing.  At first, it appeared to be actual handwriting...  But after a closer look, this seems to be a font with alternates and ligatures. </p>
    <p>Any help would be greatly appreciated!  Thank you.</p>
