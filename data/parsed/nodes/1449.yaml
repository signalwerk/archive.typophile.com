    html: "<p>I hate to start w/ a negative, but the worst thing for me at the conference were the name tags! I found them difficult to read further than 2-3 feet away. I'm naturally shy and intimidated by crowds, and I find it very difficult to walk up to people and say: \"Hi! Who are you?\" I would have liked to have met more people from the on-line forums ... oh, well. Next time. <br> <br>For me, the best talk was the Kevin Larson/Gerald Unger combination re: Word Recognition &amp; Legibility. Lots of good information, I'm just sorry hhp wasn't there to cross swords w/ Kevin :o) I also thought the font business series was good. <br> <br>Vancouver is beautiful, and the weather was fantastic. It was very difficult to stay indoors; more than once I was tempted to steal a sailboat, head West &amp; keep on going. <br> <br> <br> <br></p>"
    html_clean: "<p>I hate to start w/ a negative, but the worst thing for me at the conference were the name tags! I found them difficult to read further than 2-3 feet away. I'm naturally shy and intimidated by crowds, and I find it very difficult to walk up to people and say: \"Hi! Who are you?\" I would have liked to have met more people from the on-line forums ... oh, well. Next time. <br> <br>For me, the best talk was the Kevin Larson/Gerald Unger combination re: Word Recognition &amp; Legibility. Lots of good information, I'm just sorry hhp wasn't there to cross swords w/ Kevin :o) I also thought the font business series was good. <br> <br>Vancouver is beautiful, and the weather was fantastic. It was very difficult to stay indoors; more than once I was tempted to steal a sailboat, head West &amp; keep on going. <br> <br> <br> <br></p>"
