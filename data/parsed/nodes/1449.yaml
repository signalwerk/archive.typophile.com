    html: <p>I rather enjoyed Gerry Leonidas' talk, John Hudson's new Hebrew face, Gerald Cinamon's Koch slides (lots of stuff not in the book), the House of Downer demo, everything really. I only regret not being able to be in three places at once for some of those presentations. I really wanted to see more. That's probably the best complaint they can get. <br> <br>The food, well... I guess I understand now why I've never heard of one going out to a Canadian restaurant. I preferred Leipzig. If I weren't allergic to seafood, I might have enjoyed the food more. <br> <br>So now that it's Monday, check out the announcement from <a href="http://www.adobe.com/">Adobe</a>.</p>
