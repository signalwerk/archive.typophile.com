    html: <p>1. best talk ? Unger on reading. <br>2. worst thing ? Deciding not to go for broke on the volume of French Revolution newspapers in the auction. <br>3. best dancer ? Ms Weissman, of course.  <br>4. best dresser ? Nothing of note.  <br>5. most ironic ? Well, more of a coincidence, actually. Over sushi with Cyrus, I was complaining (as is my wont) of the stale state of typography in mass market magazines available at airports, but mentioned that there was one exception, but I couldn't remember the magazine name or identify the headline font, so I drew him a couple of characters. "Oh, was that Natural Health?" says Cyrus, "That's the first issue and a new face I just designed." <br> <br>6. Best quote? "The choice of type is based on reputation and trends, rather than any kind of logic." - Roger Black</p>
    html_clean: <p>1. best talk ? Unger on reading. <br>2. worst thing ? Deciding not to go for broke on the volume of French Revolution newspapers in the auction. <br>3. best dancer ? Ms Weissman, of course.  <br>4. best dresser ? Nothing of note.  <br>5. most ironic ? Well, more of a coincidence, actually. Over sushi with Cyrus, I was complaining (as is my wont) of the stale state of typography in mass market magazines available at airports, but mentioned that there was one exception, but I couldn't remember the magazine name or identify the headline font, so I drew him a couple of characters. "Oh, was that Natural Health?" says Cyrus, "That's the first issue and a new face I just designed." <br> <br>6. Best quote? "The choice of type is based on reputation and trends, rather than any kind of logic." - Roger Black</p>
