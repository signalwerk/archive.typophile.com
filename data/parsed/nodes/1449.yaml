    html: <p>PowerPoint is actually a great program to write and put together a presentation as a structured document. It's how people use it that makes it a bad thing. The slide sorter view is really good, as well as the outline mode. InDesign doesn't compare when it comes to this. Try organizing your pages in the pages palette. It's a nightmere. <br> <br>Though I still do my presentations in InDesign and present in Acrobat. That's what I did for mine at ATypI. Can't do without the typographic sophistication. No kerning? Forget it! I'm tempted to try Keynote. Would any of you recomment it? I've noticed a few presenters used Keynote. I love the cinematic cross-dissolve!</p>
