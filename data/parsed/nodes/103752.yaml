    <p>I'm working on a book with essays on translatability in the field of aesthetics, i.e., the question of how works of art, literature, and other forms of aesthetic expression can be transposed from one cultural context to another. Most of the texts relate in one way or another to the caribbean post-colonial writer/philosopher Édouard Glissant. I'm looking for a typeface for these texts.</p>
    <p>A tough nut to crack in terms of choosing typeface as it could easily and accidentally turn into exoticism – "illustrating" the problems of trying to convey ideas of post-colonial perspective and aesthetic expressions into typography. This is an example of  cover that shows how wrong it can go: <a href="http://books.google.se/books/about/Caribbean_Discourse.html?id=4NJkQLa2LgsC&amp;redir_esc=y" title="http://books.google.se/books/about/Caribbean_Discourse.html?id=4NJkQLa2LgsC&amp;redir_esc=y">http://books.google.se/books/about/Caribbean_Discourse.html?id=4NJkQLa2L...</a></p>
    <p>How would one approach such a problem? </p>
    <p>Cheers!</p>
