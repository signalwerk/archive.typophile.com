      <p>The King cover is an example of détournement or culture jamming.<br>
      Its design is a pastiche of 1930s travel posters, employing politically incorrect typography* and imagery, but setting up a dialectic which satirizes it, while still cashing in on its exoticism.</p>
      <p>I don’t know if that’s good or bad for the OP, which is why I asked for an opinion.</p>
      <p>The point is, you don’t have to let the typeface choice carry the freight directly. That’s a heavy load, and besides, the layout always colours the meaning of the type. So to seek a typeface which checks all the boxes is futile, unless you want to produce a dull cliché.</p>
      <p>*The Expressionist Neuland, which has become a signiﬁer of ethnic primitivism.</p>
