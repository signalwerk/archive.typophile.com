    html: <p>Simon, I don't necessarily see the point in choosing a typeface for its "ethnic" reference, just because your subject deals with a series of essays linked to post-colonial thought. I'd rather look for a typeface which works well for long text settings; if this is an Academic collection, I suppose you will have footnotes, small caps, different sizes for quotations, and even more layout issues. The point is trying to make the texts and the page structure clear and readable. I, for example, once set a book with a play by Aimé Césaire in Cycles for the text settings and in Avenir for the cover - in the latter case explicitly trying to avoid any specific cultural reference and going for a, more or less, neutral look. Just my two cents...</p>
