      <p>Just lurk around on Typophile and buy all the books people mention. </p>
      <p>Also, GO TO TYPECON. I cannot even begin to describe how much one learns from sitting around in a room full of type junkies listening to type designers talking about designing type.</p>
      <p>Edit: Someone just handed me a poster from Basel, they’re doing a type design workshop from July 7-11. Baselschoolofdesign.ch</p>
