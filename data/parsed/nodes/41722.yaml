    <p>I have recently graduated in graphic design, and i just feel like learning all about making type.</p>
    <p>The one problem is that in my country (portugal) there aren’t any graduation courses or masters on type.<br>
    Keeping in mind that my main languages are portuguese and english (i also speek a litle of spanish), were do you advise me to go in order to learn how to make type (country/university/course)?</p>
