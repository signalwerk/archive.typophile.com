      <p><em>Mark Simonson has a short article on his website about fake vs. true italics. There isn’t anything about technique, but there’s a nice example of the optical corrections that might give you some direction.</em></p>
      <p>I basically used the technique Briem describes (which William mentioned above) for Proxima Nova. I used a similar method that I worked out myself years ago when I did Proxima Sans, but I found Briem's technique to be more straightforward and reliable. I don't mean it's a no-brainer. There are always cases where you need to use your judgement. Also, because Proxima Nova was set up in FontLab as a multi-axis MM font during development, it was considerably more complicated to do the corrections. FontLab's facility for adding and deleting points has some unfortunate limitations when working with a MM font.</p>
      <p>It should be noted, this kind of optical correction is necessary when slanting characters so they don't look distorted, but it's a completely separate issue from the <em>design</em> of a set of italics. In the case of Proxima Nova's design, the italics are minimally different from the roman, essentially a slanted version of the roman, except the lowercase "a" which changes to a one-story form.</p>
