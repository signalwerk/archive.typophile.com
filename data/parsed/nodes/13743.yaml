      <p>Terry, take something like futura or helvetica (or something more similar to your face) and skew the roman by the same angle as its italic.</p>
      <p>Then paste the italic path in the template/mask layer and see what kind of bezier wrangling is necessary to get the roman, in the top layer, to conform to what's underneath.</p>
      <p>That way you will get a feel for what's involved. Either use transformations, or handle dragging, or a combination, whatever works for you.</p>
      <p>For instance, you will find that the round parts of sans italics are not skewed as much as the straight are. (Measuring skew angle between top and bottom extrema in the cap O for instance.)</p>
