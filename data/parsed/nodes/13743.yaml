      <p>"Cursiveness is a requirement for italics" is a mite too dogmatic... Italic used to be a different aproach to drawing glyphs, compared to roman, based upon the writing styles of the time (renaissance).<br>
      Using an upright orientation for the italic companion to certain roman styles has been attempted and with a certain degree of success too (Van Krimpen comes to mind), so this approach is completely feasible AND more original...<br>
      In short, tbiddy, don't let "dogma's" block you from doing your own thing!</p>
