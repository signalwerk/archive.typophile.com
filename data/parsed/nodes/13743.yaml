      <p>"what about serif? the same?"</p>
      <p>Sans is a subset of serif, with the design of the serifs  and terminals themselves, topological differences between l.c. forms, and more subleties in angle variation pose additional challenges. Depending on the classification of the face, there can be a whole degree more in the slope of the l.c. than the caps. And in general it's a lot harder to design a serif italic, but this is coming with freedom from the rather rigid constraints of sloped sans, where going bonkers on the shapes of lowercase usually ends up with grinning type suitable only for bubblegum wrappers and packaging for paper products.</p>
    html_clean: |-
