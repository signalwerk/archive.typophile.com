    html: |-
      <p>If the Roman is more "constructed" than chirographic, I would base the italic closely on a slanted form of the Roman. And I wouldn't make a chirographic Roman.  :-)</p>
      <p>When I use the term "true Italic" (in the way it's generally used in the craft) I always make sure to put the "true" in quotes; sometimes I even slap on "so-called".  :-)</p>
      <p>The main true thing about an Italic (in a contemporary text face) is that it needs to stand out enough to make the reader snap out of immersion (from the previous fixation only, not before) but affect the "mood" of the overall (i.e. Roman) as little as possible. So-called "true" italics fail at the second part, because you can't assume the emphasized snippet is associated with a more organic, informal tone; you can only assume that it's a snippet that needs extra focus. The one thing Morison was right about (in spite of himself, but certainly helped by his plagiaristic tendencies) is that cursiveness is not integral to an Italic; slant is. The persistent cursiveness of the mainstream Italic is nothing more than a circumstantial legacy, from back when type founders decided to fall back on a shotgun wedding between two separate styles.</p>
      <p>You're young, you're just starting - do the right thing.</p>
      <p>hhp</p>
