      <p>"Norbert’s mock-up made me realize what I felt uneasy about the layout in the sample sign: not enough leading for the size of type. Also I don’t know about the pentagon, at least in that orientation. Maybe a hexagon…"</p>
      <p>Believe it or not those elements are actually pretty well thought out. The leading is set to the minimum signage standards based on viewing distance specified in the book "Wayfinding: People, Signs, and Architecture" by Paul Arthur and Romedi Passini. This is not to say that there isn't room for improvement. It should also be taken into account that these signs were made to be viewed on a small platform with the viewer being usually no more than 25 ft from the sign. For Norbert's placement (which is actually a *damn* good idea for sign placement) would mean that I would have to both increase the point size of the type and the leading. </p>
      <p>As for the shape...it wasn't an arbitrary decision. What makes New York unique? It consists of 5 boroughs. The MTA operates in all 5 boroughs. Thus a 5 sided shape (pentagon) and not a circle. Since it was my thesis project, I could get a little more theoretical with the approach. I also changed the shape to solidify a firm identity within the system. There is a constant repetition of the pentagon shape in my plans. I also have a borough/station identification system that makes use of the shape. It was an attempt to tie symbols with the type for quick, clear understanding. Alas, I'm sure a lot of people are going to think that's a load of hooey, so I'm flexible in the shape eventually changing.</p>
