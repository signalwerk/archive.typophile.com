      <p>&gt; “Cursiveness is a requirement for italics” is a mite too dogmatic…</p>
      <p>Just to be clear: I agree (see above).<br>
      In fact, wait: I think it's wrong!  :-)</p>
      <p>&gt; Using an upright orientation for the italic companion<br>
      &gt; to certain roman styles has been attempted and with a<br>
      &gt; certain degree of success too</p>
      <p>I don't know of any that I myself would call successful. Which makes sense, since the essential feature of an Italic is [visible] slant (although it doesn't have to be the only feature). This is why I think "upright Italic" is a misnomer; "cursive Roman" is much better.</p>
      <p>That said, I think there are other ways to mark emphasis than an Italic; personally, I [generally] prefer a Demi weight. It's just that for cursiveness to be sufficient to make a reader snap out of immersion, it has to be so pronounced that it skews the voice of the whole composition strongly, and in an arbitrary direction.</p>
      <p>hhp</p>
