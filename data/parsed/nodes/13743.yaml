      <p>Terry,</p>
      <p>I didn't want your request for advice to dwindle down.<br>
      I think the wording of your forum topic "Tips for Constructing True Italics" is really not your primary concern.</p>
      <p>From what I gather from this and other posts you have made is that you do have a deep interest and concern about wayfinding systems, traffic and highway sign legibility/readability, and exploring the development and use of symbols for the above applications.</p>
      <p>Never have we in the USA needed more rethinking about the importance of environmental and transportation signage.</p>
      <p>The "Baby Boomers" are hitting their 50s-60s in age... eyes and reaction time are just not what they used to be, especially when you're driving you SUV at 80 mph! In addition, there are more non-English speaking/reading individuals on the road and using transportation systems today. </p>
      <p>Unless critical information is conveyed with some degree of clarity, on the road, in public transportation, for building information, us old hippies and visitors from other lands are going to cause one hell of a traffic mishap!</p>
      <p>So I guess what I'm saying is, you probably are less concerned about "so called" "true" italics than with the critical issue of readability under a myriad of circumstances... right?</p>
      <p>You may have read this already:<br>
      <a href="http://gulliver.trb.org/publications/millennium/00143.pdf" target="new" rel="nofollow"><strong>Vehicle User Characteristics: Research Needs in the New Millennium</strong></a> -- <em>Note: PDF download link.</em><br>
      It's a call to revisit transportation signage by the Committee on Vehicle User Characteristics.</p>
      <p>I honestly think that new solutions for environmental/wayfinding systems are way past due, and to me, far more important than a "true cut" italic.</p>
      <p>----------------------------------------<br>
      Yes, I'm old, and need glasses too!</p>
