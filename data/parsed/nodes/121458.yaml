      <p>Thanks for your thoughts. </p>
      <p>I tried out Avenir and Gill Sans (unfortunately Gotham is still on my wish list), explored didone and geometric styles, but nothing seemed quite right, so I think I will need to go with a different font for the menu text/headlines which is similar enough to fit with the logo's use of Lulo Clean. </p>
      <p>After playing around for a while, I decided Proxima Nova was my best option. I've done a very crude layout just to provide a rough idea of how the text could be used and would love to hear your opinions on which combination works best.</p>
      <p>Proxima Nova &amp; Open Sans<br>
      Proxima Nova &amp; Adobe Garamond Pro<br>
      Proxima Nova &amp; Calluna<br>
      Proxima Nova &amp; Merriweather</p>
      <p>Edit: Removed links as I have decided to go with varying Proxima Nova weights/styles.</p>
