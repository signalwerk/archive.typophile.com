  html: |-
    <p>I'm new to Typophile, so please forgive me (and re-direct me if you know otherwise) if this has been posted in the wrong forum topic!</p>
    <p>I've recently created a logo design for a bespoke fashion brand using the typeface Lulo Clean One Bold (see: <a href="https://www.myfonts.com/fonts/yellow-design/lulo-clean/" title="https://www.myfonts.com/fonts/yellow-design/lulo-clean/">https://www.myfonts.com/fonts/yellow-design/lulo-clean/</a>) and I'm trying to put together the rest of the brand identity. </p>
    <p>However, I'm struggling to find a font that compliments Lulo Clean for body copy. The purpose I have in mind is for short body copy - i.e. descriptions of clothing online, perhaps sub headings / tag lines in italics? Ordinarily I'd try to match up fonts by using the x-height as an indicator of if the two fonts work together - but as Lulo Clean is an all caps font I don't think I can apply this rule (please correct me if I am wrong). </p>
    <p>Here are some of the key words for the project, to give a feel of the tone/mood required: modern-classic blend, sophisticated, luxurious, glamorous, high quality. I'm thinking of using Lulo Clean One for the sub headings / menu text, and thought that Source Sans Pro Regular or Open Sans Regular might work for the body copy (I'm trying to find a complimenting serif but none seem to convey the key words as well as these so far...).</p>
    <p>I'd really appreciate any help/advice that the community here can offer. </p>
    <p>Thank you!</p>
