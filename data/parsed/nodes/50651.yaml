      <p>Hi Eric,</p>
      <p>some similar square tech sans faces (most of them of pretty rough &amp; unpolished ‘charme’): </p>
      <ul>
      <li><a href="http://www.identikalshop.com/font_ind.php?baseProductID=107" rel="nofollow">Baksheesh</a> by <a href="/wiki/Stuart%20Brown" class="freelinking" rel="nofollow">Stuart Brown</a></li>
      <li>Blender and Regular by <a href="/wiki/Nik%20Thoenen" class="freelinking" rel="nofollow">Nik Thoenen</a> via <a href="http://www.binnenland.ch/type/" rel="nofollow">Binnenland</a></li>
      <li><a href="http://www.gestalten.com/fonts/detail/?id=be0db8100998aaec010a4f5def8e0003" rel="nofollow">BDR Mono</a> by <a href="/wiki/Lopetz" class="freelinking" rel="nofollow">Lopetz</a></li>
      <li><a href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/AutoScape/" rel="nofollow">AutoScape</a> and <a href="http://www.lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Lutz+Headline/" rel="nofollow">Lutz Headline</a> by <a href="/wiki/Cornel%20Windlin" class="freelinking" rel="nofollow">Cornel Windlin</a> (also <a href="http://www.lineto.com/The+Fonts/Custom+Typefaces/Alpha+Headline/" rel="nofollow">Alpha Headline</a>, available again in 2012)</li>
      <li><a href="http://www.myfonts.com/fonts/dimitrelima/0arame/familytree.html" rel="nofollow">Arame</a> by <a href="/wiki/Dimitre%20Lima" class="freelinking" rel="nofollow">Dimitre Lima</a></li>
      <li><a href="http://www.canadatype.com/showfont.php?id=38" rel="nofollow">Screener</a> by <a href="/wiki/Patrick%20Griffin" class="freelinking" rel="nofollow">Patrick Griffin</a></li>
      <li><a href="http://www.myfonts.com/fonts/typeco/super-duty/" rel="nofollow">Super Duty</a> by <a href="/wiki/James%20Grieshaber" class="freelinking" rel="nofollow">James Grieshaber</a></li>
      <li><a href="http://www.myfonts.com/fonts/t26/carbon/" rel="nofollow">T26 Carbon</a> and <a href="http://www.myfonts.com/fonts/t26/ocrx/" rel="nofollow">T26 OCRX</a> by <a href="/wiki/Anuthin%20Wongsunkakon" class="freelinking" rel="nofollow">Anuthin Wongsunkakon</a></li>
      <li><a href="http://www.houseind.com/index.php?page=showfont&amp;id=531&amp;subpage=un_fonts_sans" rel="nofollow">United Sans</a> by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a></li>
      <li><a href="http://www.neubauladen.com/catalogue/NB-Typography/3" rel="nofollow">some of the Neubau fonts</a>.</li>
      </ul>
      <p>Also have a look at <a href="http://www.typophile.com/node/27362" rel="nofollow">License plate typography</a>.<br>
      F</p>
