    <p>I'd love to add <a href="/wiki/timelines" class="freelinking" rel="nofollow">timelines</a> to the <a href="/wiki/typowiki" class="freelinking" rel="nofollow">wiki</a>, but don't want them to be incomplete or incorrect. I also realize that something like an history about something like posteres can be subjective as you first must answer the question, "What is a Poster?" But, I thought this would make a fun exercise. A test if you will. </p>
    <p>This timeline was created in 2000 for an essay I was writing about that very question mentioned previously. Let's see how this goes.</p>
    <p>- - - - - - -</p>
    <p>The History of the Printed Poster up to 1900.</p>
    <p>Before <a href="/wiki/Gutenberg" class="freelinking" rel="nofollow">Gutenberg</a></p>
    <p>10,000 B.C. -- The Birth of Visual Communication can be traced to the cave paintings done during the Paleolithic age in Lascaux, France<br>
    105 A.D. -- Paper was discovered in China by Ts’ai Lun<br>
    79 A.D. -- The “advertisements” over the baths at Pompeii. </p>
    <p>15th Century</p>
    <p>1439 -- Johannes Gutenberg’s creates the hand-operated press in Mainz, Germany.<br>
    1461	 -- Mainz, Germany. Leaflets and Posters were printed for both sides during a feud between bishops. Supposedly the beginning of political posters and leaflets.<br>
    1470 -- First Publisher’s catalogue printed as a poster by Peter Schöffer in Mainz.<br>
    1477 -- First advertisement printed by William Caxton. It announces an edition of Pyes of Salisbury.<br>
    1482 -- In Paris for Notre Dame in Rheims a message is posted promising that the faithful would all be forgiven their sins if they were to make an offering of money in church on the day of Pope Pius’s visit. This poster was a Gothic woodcut with the Madonna as the patron of the church, the papal insignia and the coat of arms of the town of Rheims–possibly the first specimen of a text supported by illustration.</p>
    <p>16th Century</p>
    <p>1505	 -- Etching was invented in Ausburg.<br>
    1517	 -- Martin Luther posts his ninety-five theses for debate on the door of Castle Church in Wittenberg. Subsequently, his friends passed on copies to the printers to be reproduced, by December the whole of the continent knew of Luther’s beliefs.<br>
    1518 -- The first wood engraving poster was printed in Rostock<br>
    1518 -- The archibishop of Mainz set up the first board of censors to supervise printing.<br>
    1520	 -- The first playbill from a wood engraving also printed in Rostock<br>
    1539 -- 	Frances I of France found it necessary to issue an order on putting up posters.</p>
    <p>17th Century</p>
    <p>1653 -- A decree is sent out by the goverment in Paris forbidding, on pain of death, the printing and exhibition, or bill-posting, of posters without an official permit</p>
    <p>18th Century</p>
    <p>1722	 -- In Paris the goverment tries yet again to control the posters.<br>
    1742 -- A new edict is issued which requires two copies of every bill or poster to be delivered up to the Royal Library.<br>
    1760 -- The Industrial Revolution begins in England.<br>
    1780 -- James Watt introduces the ability of steam power.<br>
    1798	 -- Lithography is discovered by Alois Senefelder. </p>
    <p>19th Century</p>
    <p>1810	 -- Frederick Koenig invents the powered printing machine thus enabling the truest form of mass production for man yet.<br>
    1838 -- Charles Dickens uses the word ‘poster’ in his book <em>Nicholas Nickleby</em>. Shortly thereafter it is accepted in the the English dictionary.<br>
    1845 -- Paul Gavarni produces the black and white lithographic poster Les Français. Together with Honoré Daumier, they attempt to produce posters with artistic merit.<br>
    1850	 -- The power-operated press has been advanced enough to produce up to 10,000 sheets per hour<br>
    1867 -- Jules Chéret  produces the color lithographic poster for the play La Biche au Bois starring Sarah Bernhardt<br>
    1868	 -- Edouard Manet’s black on white lithographic poster for the book Les Chats by Champfleury.<br>
    1871	 -- Fred Walker prints the first British pictorial poster for Wilkie Collins’ play and novel Woman in White. This is what is considered to be the first British poster with any artistic merit.<br>
    1895 -- Alphons Mucha prints his first poster for Sardou’s play Gismonda.</p>
