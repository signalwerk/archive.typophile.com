      <p>Another thought about the history of posters. Both papermaking and printing were invented in China. Printing of decrees, laws, etc. permitted wide distribution across China’s vast administrative reaches, and with less possibility for scribal error.<br>
      Rubbings were the first form of printing on paper. Since c. 175 CE, important decrees, texts, scriptures, poems, and pictures were inscribed on wood, bronze, and stone. Then copies, made by rubbings and ink transfer, were distributed on paper.  Some of these transfers were certainly meant for posting in public.</p>
    html_clean: |-
