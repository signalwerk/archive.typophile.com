      <p>Tim, fin-de-siecle printers did multiple editions of eg Mucha posters, at smaller sizes.</p>
      <p>But that fit into the tradition of fine art prints (often engravings of paintings) that were kept in "portfolios", not books.</p>
      <p>It would have been hard to steal posters if they were glued to walls.</p>
      <p>Bogart's book is good on the poster-or-art issue c.1900.</p>
      <p>BTW,</p>
      <p>Calendars were a related art form.<br>
      Maxfield Parrish's paintings (1920s) were beautifully printed in special colors, distributed via calendars, but subsequently framed and mounted in homes. These same images had started life in adverts and posters (with product ID), but he kept the copyright.</p>
