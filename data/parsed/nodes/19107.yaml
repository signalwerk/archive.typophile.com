      <p>Finding information on the web isn't easy (and should be taken with a pinch of salt), I can find two urls that I can be fairly confident are accurate <a href="http://72.14.203.104/search?q=cache:qN7hfvOz3_MJ:www.findarticles.com/p/articles/mi_m1510/is_1987_Spring/ai_4806053+roman+advertising+BC&amp;hl=en&amp;ct=clnk&amp;cd=6&amp;client=safari" rel="nofollow">here</a> and <a href="http://www.classicsunveiled.com/romel/html/amphiglad.html" rel="nofollow">here</a>. Your point about at what time does a grafitto become a poster is a tricky one, much of the advertising in Rome was hand drawn in chalk directly onto walls, slaves might be sent out to write up a message on various prominent walls, rubbing out rival messages, to draw attention to the message they included borders and sometimes an image, the advertisements were for political campaigns (including games, circuses and bread), products (olives, olive oil, garum etc), more personal services (to use a euphemism) and so on <em>plus ça change</em>; also wooden boards would be used for more permanence, however, for quality control, some campaigns were copied onto paper (papyrus, I imagine vellum or parchment would be prohibitively expensive) by a scriptorium and then posted. I suppose all of these would in some way be  posters, in that they serve the same purpose and have the longevity as a more modern poster, I suggest that the medium is less important than the message on the wall in the definition of poster, especially to the patron.<br>
      Tim</p>
