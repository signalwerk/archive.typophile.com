      <p>Hi Benjamin,<br>
      not every letter comes from a font –&nbsp;this is most likely hand-lettered.<br>
      If you like the slightly concave stems, check out Formata. The ‘a’ reminds me of Steile Futura aka <a href="http://fontbureau.com/fonts/Tasse" rel="nofollow">Tasse</a>.<br>
      F</p>
