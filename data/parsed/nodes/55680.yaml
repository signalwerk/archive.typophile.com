    <p>I found this one yesterday and I am for the life of me not capable of naming that font. My specimen books did not turn up anything and neither did linotypes font-identifier.I even went through the whole sans-serif list on dafont, still nothing. Can anyone help me out with a name on this one?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Klosterfont_3500.png"></div><p></p>
