      <p>Well spoken, Florian. ^^<br>
      Normally I would agree with that theory, but as I know that this type is not part of the original logo - this is remake for a t-shirt version by a third party and they added some deliberate changes to the lok so as to avoid legal trouble - I strongly suspect this these letters do in fact come from some kind of font.<br>
      Love Formata, by the way.</p>
