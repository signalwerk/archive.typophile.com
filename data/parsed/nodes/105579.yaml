    html: |-
      <p>The image seems to be from one of the original posters for the movie, which was released in 1984.<br>
      I suspect it is lettering adapted from a monoline slab serif font such as Rockford.  The oversize bowl on the R and the ski jump leg could have been added to evoke a nostalgic retro/deco mood.<br>
      At least I have not seen the combination in a digital or pre-digital monoline slab serif font.<br>
      There is at least one digital font inspired by Rockford that has a ski jump leg on the R similar to the lettering:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/1984LetteringAndSanchezSlabWithAltR_3715.jpg"></div><br>
      The lettering is in red and the font in black.<br>
      It's <a href="http://www.myfonts.com/fonts/latinotype/sanchez-slab/" rel="nofollow">Sanchez Slab</a>, using the alt R.<br>
      Don<p></p>
