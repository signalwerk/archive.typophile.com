      <p>Mathew Carter designed a face for MS Windows 8.1 called Sitka which is very close to Delicato. Seems to be only distributed with the software.</p>
      <p>If you need an entire family of fonts (roman, italic, bold, bold italic), you may not be able to find anything more economical than Delicato. Here are a few suggestions that may work, but some only if you need a few weights:</p>
      <p>Aster comes very close:<br>
      <a href="http://www.myfonts.com/fonts/urw/aster/" title="http://www.myfonts.com/fonts/urw/aster/">http://www.myfonts.com/fonts/urw/aster/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/new-aster/" title="http://www.myfonts.com/fonts/linotype/new-aster/">http://www.myfonts.com/fonts/linotype/new-aster/</a></p>
      <p>Leksa Pro:<br>
      <a href="http://www.myfonts.com/fonts/alexandra-korolkova/leksa/" title="http://www.myfonts.com/fonts/alexandra-korolkova/leksa/">http://www.myfonts.com/fonts/alexandra-korolkova/leksa/</a></p>
      <p>Berling:<br>
      <a href="http://www.myfonts.com/fonts/linotype/berling/" title="http://www.myfonts.com/fonts/linotype/berling/">http://www.myfonts.com/fonts/linotype/berling/</a></p>
      <p>PT Serif Pro:<br>
      <a href="http://www.myfonts.com/fonts/paratype/pt-serif-pro/" title="http://www.myfonts.com/fonts/paratype/pt-serif-pro/">http://www.myfonts.com/fonts/paratype/pt-serif-pro/</a></p>
