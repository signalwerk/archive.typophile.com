      <p>It appears to me that the point is having a tree there. Oak Tree? (from the wood furniture), or is it a sort of arabesque just so it's mass has whites around and is not a massive square or circle.</p>
      <p>If you insist in this tree, you will get it - just need some hours on it. Make variations of color with a result you will get, by modifying what you already have. The clipart feel then will then puff away. The curve is to be not precise or symmetric, like hand drawn. Well, just work on it. The result can be seem at the end, many hours later. :-)</p>
