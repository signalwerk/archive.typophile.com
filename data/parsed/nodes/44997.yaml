  html: |-
    <p>I'd be interested in some critique for the following logo.<br>
    The company is a micro press for publishing small<br>
    runs of specialty volumes. The progression of ideas was<br>
    from the top left (gold), top right (silver) and bottom (green).<br>
    The name 'newrome' refers to New Rome (Constantinople).<br>
    This micro press' main purpose is to publish volumes<br>
    in the field of Byzantine Studies / Eastern Orthodoxy.</p>
    <p>Thanks for any feedback.</p>
    <p>(I managed to accidentally delete the original topic while uploading<br>
    a new version of the file per poms request!)</p>
