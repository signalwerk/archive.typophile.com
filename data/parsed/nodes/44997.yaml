  - id: 277241
    user: 30559
    date: 2008-05-07T20:22:00
    date_raw: 7 May 2008 — 8:22pm
    votes: null
    html: |-
      <p>KenBessie,</p>
      <p>Thanks for your comments. As I had mentioned above, the idea is the tension between new / old, tradition / innovation, old growth / new growth. The point of the tree is old growth / the flower new (unexpected) growth. The use of the tree / flower harkens to much that is familiar with byzantine illuminated design, though nothing specific. I was trying to avoid something that would say "byzantine" too strongly. As for the connection to publishing, well -- you definitely have a point. I was again trying to play with the ideas rather than hit you over the head with them. Again, maybe it is too vague and undefined. The word PRESS is really the only indication.</p>
      <p>AGL,</p>
      <p>Thanks as well for the comments. As for trying to not be precise / more handrawn look, the silver tree was the result of this; the leaves are not round and the curves have been edited freely. Not sure how that plays out. The point is the tree and the delicate lines that surround it.</p>
      <p>I have played around with the tree quite a bit -- below one of the results. It seems totally impractical, but....you tell me. I haven't added the flower as of yet.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tree_Design_052008_6360.jpg"></div><p></p>
