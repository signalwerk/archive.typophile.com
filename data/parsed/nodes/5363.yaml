    html: "<p>Adam: <br> <br>I guess I'm rockin' the boat here, but if  your icon says anything about your illustrative style, I think the caps (not italicized) work better than lc. Your icon does look a little \"sporty\", as Tom put it (referring to the uppercase), and I haven't heard any reason to think that \"sporty\" isn't an appropriate representation for your work. Perhaps you can clear that up by letting us know a little about what you do. Until then, my only criticism is that your curves still need to be smoothed out a little. <br> <br>Aloha! <br>Scott</p>"
