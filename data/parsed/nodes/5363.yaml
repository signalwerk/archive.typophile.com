    html: <p>Adam, <br> <br>I'm concerned about the swooshy P. The swoosh element has been over used in logos for some time now. That said, if it is representitive of your illustrative style use it. But, if you just think it looks cool, I say try something that would be more reflective of your work.  <br> <br>Where does the name Pappy come from? Is there some way to illustrate your choice in company name? </p>
