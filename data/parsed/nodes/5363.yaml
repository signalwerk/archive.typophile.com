    date: 2004-06-25T17:14:00
    date_raw: 25 Jun 2004 — 5:14pm
    votes: null
    html: <p>Hi Adam, <br> <br>I really like the icon you designed . . . just a couple of suggestions to refine it further . . . <br> <br>I think you should get rid of the border around the icon, maybe offset another color behind it to add dimension. <br> <br>I agree with Tom about offsetting the logo and using lower case, although I think something like avante garde might work better for your font. Play around with a few things and see what works -- you have a great start! <br> <br><img src="http://www.typophile.com/forums/messages/29/39251.gif" alt=""></p>
    html_clean: <p>Hi Adam, <br> <br>I really like the icon you designed . . . just a couple of suggestions to refine it further . . . <br> <br>I think you should get rid of the border around the icon, maybe offset another color behind it to add dimension. <br> <br>I agree with Tom about offsetting the logo and using lower case, although I think something like avante garde might work better for your font. Play around with a few things and see what works -- you have a great start! <br> <br><img src="http://www.typophile.com/forums/messages/29/39251.gif" alt=""></p>
