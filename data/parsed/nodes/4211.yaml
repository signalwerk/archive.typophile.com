  html: "<p>First time posting on this list but I have been lurking for months. I am also mostly a typography novice, hence my questions. <br> <br>I am a cartographer working on a re-design of a large scale topographic map (1:50k). This is a large sheet 28\" x 40\" with a 4 color CMYK tiff with type and line work printing over that in black and two spot colors: a blue and a greyish brown. Large quantities of single line small type blocks in the 5 or 6pt range and usually 4 to 6 letters long need to be placed. But some may be longer and two to three lines long. Some text may also be 8pt to 10pt in size. In the past this was set in Arial. I am looking to change this. I want to use a sans serif family for most of it, with a well matched serif or semi-sans for some place names and water bodies. I realise this may be a bit off-topic for this list but I really enjoy the tone of the discussion here and though I would solicit your informed opinions.  <br> <br>Legibility is very important, and there is a good chance text will need to be converted to paths at some point in the printing process.  <br> <br>BTW I am loathe to use Bell Centennial. <br> <br>I've been recommended Frutiger and Amasis. Anyone else with some suggestions? <br> <br>Thanks</p>"
  html_clean: "<p>First time posting on this list but I have been lurking for months. I am also mostly a typography novice, hence my questions. <br> <br>I am a cartographer working on a re-design of a large scale topographic map (1:50k). This is a large sheet 28\" x 40\" with a 4 color CMYK tiff with type and line work printing over that in black and two spot colors: a blue and a greyish brown. Large quantities of single line small type blocks in the 5 or 6pt range and usually 4 to 6 letters long need to be placed. But some may be longer and two to three lines long. Some text may also be 8pt to 10pt in size. In the past this was set in Arial. I am looking to change this. I want to use a sans serif family for most of it, with a well matched serif or semi-sans for some place names and water bodies. I realise this may be a bit off-topic for this list but I really enjoy the tone of the discussion here and though I would solicit your informed opinions.  <br> <br>Legibility is very important, and there is a good chance text will need to be converted to paths at some point in the printing process.  <br> <br>BTW I am loathe to use Bell Centennial. <br> <br>I've been recommended Frutiger and Amasis. Anyone else with some suggestions? <br> <br>Thanks</p>"
