    html: "<p>&gt; In the past this was set in Arial. <br> <br>Ouch. You can choose a replacement using <i>dice</i> and you'd still do better!  :-/ <br> <br>You should look for a font that's been designed for small sizes - and it doesn't have to be something bland. Look at the work of Chris Burke: <br><a href=\"http://www.myfonts.com/fonts/fontfont/parable/\" target=\"_blank\">http://www.myfonts.com/fonts/fontfont/parable/</a> <br><a href=\"http://www.myfonts.com/fonts/neufville/pragma-nd/\" target=\"_blank\">http://www.myfonts.com/fonts/neufville/pragma-nd/</a> <br> <br>Or if you want something more extreme maybe Tracy's Adsans: <br><a href=\"http://www.myfonts.com/fonts/linotype/adsans/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/adsans/</a> <br> <br>As for a companion semi/serif design, that would depend on the (more pivotal) small-text choice. Although Amasis -which I'd never heard about- could actually work out. <br> <br>hhp <br></p>"
