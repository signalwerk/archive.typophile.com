    date: 2004-09-01T00:49:00
    date_raw: 1 Sep 2004 — 12:49am
    votes: null
    html: <p>Hey David, nice design so far. In my opinion, the version without any letters joining was the best one you sent us. I personally find that those joinings resemble serifs, and I find it somewhat strange to have serifs only in a certain part of the letter. <br> <br>So, in my opinion, you should either keep them separated or REALLY join the letters, like using the same stroke for the right part of the "U" and the left part of the first "N" (like putting one letter INSIDE another). This second option would, of course, result in an somewhat abstract/low-legibility logo, but which I think could work, since you're working with fashion. <br> <br>My 2 cents, <br>Lucas</p>
    html_clean: <p>Hey David, nice design so far. In my opinion, the version without any letters joining was the best one you sent us. I personally find that those joinings resemble serifs, and I find it somewhat strange to have serifs only in a certain part of the letter. <br> <br>So, in my opinion, you should either keep them separated or REALLY join the letters, like using the same stroke for the right part of the "U" and the left part of the first "N" (like putting one letter INSIDE another). This second option would, of course, result in an somewhat abstract/low-legibility logo, but which I think could work, since you're working with fashion. <br> <br>My 2 cents, <br>Lucas</p>
