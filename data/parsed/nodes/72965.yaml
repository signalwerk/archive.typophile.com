    <p><strong>If you are a designer, here is a great opportunity for you to win $1200:</strong></p>
    <p>Just submit a graphic design or pencil sketch of outer cover design of PAL Robotics next generation of humanoid robots and enter a contest to win $1200, $600, and $200 as first, second, and third prize respectively. For submission and more details, visit <a class="freelinking external" href="http://www.lifeintheroboticslab.com/contests" rel="nofollow">http://www.lifeintheroboticslab.com/contests</a></p>
    <p>To know more about PAL Roboits, please visit <a class="freelinking external" href="http://www.pal-robotics.com" rel="nofollow">http://www.pal-robotics.com</a></p>
