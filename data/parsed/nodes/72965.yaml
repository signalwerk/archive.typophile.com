    html: |-
      <p>Ujrail,</p>
      <p>This is called "working on speculation" and is considered by many to be highly irresponsible, unprofessional and even disrespectful to the practice. It takes advantage of young designers trying to enter the field and devalues what we do as professionals. If you want a quality product, find the right person for the job, and pay them their fee. As you would a doctor or lawyer.</p>
      <p>I cannot speak for others, and I do not fully understand what social media "strategy" is, but from my experience here, I do not think this is the place one goes to create a profile to announce logo contests and hope to get a good deal. On top of that, I am fairly certain isn't the place to advertise your new robot company.</p>
      <p>You will however find hundreds, if not thousands or people with a very keen and diverse set of interests around the field of <a href="http://en.wikipedia.org/wiki/Typography" rel="nofollow">typography</a> who will be more than willing to provide you with advice, consultation &amp;c which may even lead to a lasting professional relationship.</p>
      <p>For more reading on spec-work and design ethics:</p>
      <p><a href="http://www.no-spec.com/design-organisations-their-stance/gdc/" title="http://www.no-spec.com/design-organisations-their-stance/gdc/">http://www.no-spec.com/design-organisations-their-stance/gdc/</a><br>
      <a href="http://www.aiga.org/content.cfm/position-spec-work" title="http://www.aiga.org/content.cfm/position-spec-work">http://www.aiga.org/content.cfm/position-spec-work</a><br>
      <a href="http://www.designertoday.com/Articles/4533/Spec.Work.and.Creative.Professionals.aspx" title="http://www.designertoday.com/Articles/4533/Spec.Work.and.Creative.Professionals.aspx">http://www.designertoday.com/Articles/4533/Spec.Work.and.Creative.Profes...</a></p>
      <p>And many professional design association such as <a href="http://www.rgdontario.com/" rel="nofollow">The Association of Registered Graphic Designers of Ontario</a>, <a href="http://www.aiga.org/" rel="nofollow">American Institute of Graphic Arts</a> and the <a href="http://www.gdc.net/" rel="nofollow">Graphic Designers of Canada</a> will have job posting boards and resources to help you find the right client for the job.</p>
