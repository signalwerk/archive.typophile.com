    html: |-
      <p>That Pages screenshot shows that it should support the most common typographic OT layout features. Certainly seems adequate to me, on the face of it. Can’t vouch for the implementation, since I don’t have the software.</p>
      <p>It is interesting to me to see that the {cpsp} is independently selected, as opposed to being activated by all-caps formatting.</p>
      <p>SciTech — If you highlight a figure and select Vertical Position: Superiors/Superscript, I would expect you to get a proper reference superior. Note, however, that in Garamond Premier Pro, the superscripted alphabetic glyphs are positioned in what I would call ordinal position, not reference superior.</p>
      <p>Can’t say why you wouldn’t get fractions to work, other than to note that the Adobe implementation of {frac} feature is not suitable for global activation, as it first converts every figure to a numerator, indiscriminately. You must apply it on an ad hoc basis.</p>
