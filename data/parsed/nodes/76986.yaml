      <p>Funny, recently 2 Krogh actually set a whole large-print Bible in Hypatia Sans: <a href="http://2krogh.dk/bibles/#/il-bibbja" title="http://2krogh.dk/bibles/#/il-bibbja">http://2krogh.dk/bibles/#/il-bibbja</a>. I was surprised by how well it worked. I think Hypatia is a great choice for religious material, actually.</p>
      <p>As for what Hypatia Sans goes with, I agree that it depends on context. I probably wouldn't pair it with a serif body face that was too aggressively modern (Bodoni, Walbaum, Melior). But other than that, it's fairly flexible. I think it tends to go well with oldstyle typefaces and have used it with Arno several times.</p>
      <p>Regards,</p>
      <p>T</p>
