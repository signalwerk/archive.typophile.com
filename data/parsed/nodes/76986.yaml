      <p>Another question came up which I couldn't clarify reading some articles about it: </p>
      <p>Does Apple's Pages fully support the use of all the features OpenType Fonts have to offer? Until now I used pages and the cmd+T option from MacOSX 10.6.5 to get access to the different stylesets of Hypatia Sans for instance. Now I am wondering if this way is too limited and finally maybe even too complicated to take full advantage of the OTF features and if it were better to buy InDesign or QuarkExpress. </p>
      <p>What I could find out is that Mellel is a word processor which allows to take full advantage of OTF but has its own limitations too. However, this might be an option in case Pages is too limited. What do you think?</p>
      <p>Your advice is highly welcomed. (I worked so far mainly in the domain of websites, posters and flyers, so I am not used to set long texts, hence InDesign or QuarkExpress haven't come to my attention so far.)</p>
      <p>Thank you for your input and patience!</p>
