      <p>Thank your very much so far for your time and advice. I will check Alright Sans—which came to my attention already but I didn't investigate this font closer. I will also check Sensibility.</p>
      <p>The audience is usually in the context of either religious texts or academic analysis in the context of religion. There is no business behind it all is done or given for free, but this should be no excuse to not setting the texts as best as possible. At the moment I am working on a prayer book. Sometimes the text is an academic analysis or a summery of a specific tricky topic which might be interesting for a broader public to be read. </p>
      <p>So far with respect to the subject matter and audience. It should be good enough for academics/researcher and religious people and the fonts should support the credit or quality the texts are felt to possess. In future a project like a small magazine might be an option too.</p>
      <p>When Sanskrit Fonts are needed I found a solution. There is a nice Palatino Font which is offered for free: <a href="http://www.columbia.edu/~ph2046/RnD/Hackett/Sanskritfonts.html" title="http://www.columbia.edu/~ph2046/RnD/Hackett/Sanskritfonts.html">http://www.columbia.edu/~ph2046/RnD/Hackett/Sanskritfonts.html</a></p>
      <p>In one context I combined Whitman with Avenir and Benton Sans which appeared to be a good choice. The Franklin/AG question is rather if there is one font to be taken for future purposes which font would be the better choice or if Franklin from URW is similar good in quality than ITC or FB's / Adobe's version of it. </p>
      <p>The Alright Sans Font font seems to be quite what I think I could use very much in the contexts I work and for future projects. Franklin and AG were options so far rather because they are classics, and Franklin was suggested to be used with Whitman; but now having had a closer look on Alright Sans, this font appears to be more suited and also more warm to my eye than AG or Franklin.</p>
