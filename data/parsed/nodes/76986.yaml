      <p>Mick — </p>
      <p>For discussion about other sans serif complements for Whitman not already mentioned, see this comment from years ago (perhaps you already saw it?):</p>
      <p><a href="http://typophile.com/node/4403#comment-32562" title="http://typophile.com/node/4403#comment-32562">http://typophile.com/node/4403#comment-32562</a></p>
      <p>I’m all for mixing and matching and seeing what you can bring out in faces (as Nina so eloquently expressed above). I will say, however, I can’t really imagine AG working so well with Whitman. But that’s probably my personal dislike.</p>
      <p>FWIW, I have designed proper superiors, inferiors, fractions, et al., for Whitman Roman (some years ago), including a full set of l.c. alphabetic sups/ordn/sinfs as well, but I don’t know if/when this will ever be ready for retail. Contact me offline, if you want to discuss an individual arrangement.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Whitm-supssinf_5713.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Whitm-sups_4113.gif"></div><p></p>
      <p>&nbsp;<br>
      And for Devanāgarī, you might take a look at Dan Reynolds’s Malabar Devanāgarī (although, I’m not sure this component has been released . . . Dan?). I think it would be stylistically compatible with Whitman, although there might be challenges matching color and metrics, since the Malabar Latin is overall darker and larger.</p>
      <p>— Kent.</p>
