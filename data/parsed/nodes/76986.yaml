      <p>What Stephen said. I've personally paired Whitman with sansserifs as varied as Bureau Grot and Fedra Sans; it's a fascinating, multi-faceted typeface, and different pairings can also bring out different ones of its aspects / character traits. So if you can tell us more about where you're trying to take this, that'd help.</p>
      <p>As for Franklin, the ITC version (assuming we're talking about <a href="http://www.fontbureau.com/fonts/ITCFranklin/" rel="nofollow">the rather new one also available from Font Bureau</a>) is actually not as bloated in the x-height region as many ITC fonts are, and I must say I wouldn't know any reason to not recommend it.</p>
