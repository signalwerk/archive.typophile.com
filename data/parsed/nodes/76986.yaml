    <p>Hi there,<br>
    I hope some of you might be able to help me. I have read so far most of the related discussions related to what I am asking here, so I hope it is not a repetition of some already asked questions.</p>
    <p>1. I am asking myself if there is any difference in quality between the Franklin Gothic Fonts by URW Foundry and ITC. The former you can get rather for a low price and the latter for the standard prize. After having bought some basic professional fonts, I can only invest in one more Gothic font and if the quality of the URW Fonts are not much of a difference to the ITC Fonts, I could afford also the compressed and extra compressed fonts. However, if the quality is too low, than for me it would be better to have few good quality fonts than a lot of low quality fonts. (I am no professional but have to do with some minor publications (and websites which sometimes require texts (PDF Files)), and I want to set these texts with quality fonts.</p>
    <p>2. I am looking for companions for Whitman—a very nice typeface which I bought based mainly on the specimen made by the designer and the discussion here. (Initially I had in mind to buy either Arno or Warnock.)  As far as I can see Franklin Gothic and Benton Sans are recommended companions, there was one argument that Verlag might be compatible but no real recommendation to use it. Are there any other combinations which could work with Whitman except those three? What about Gotham or Akzidenz Grotesk? I was thinking it might be better to buy Akzidenz Grotesk instead of Franklin Gothic but if it could not combined with Whitman it would reduce my desire to buy it. On the other hand AG is so much praised, if it is by far better than Franklin Gothic, this would again increase my wish to buy AG. I am doubting what is the right choice...</p>
    <p>3. Do you have any recommendation with what fonts Hypatia Sans could be paired? It is a very nice typeface but appears so unique that it is hard for me to be sure with what serif or sans fonts it could be combined. Any suggestions?</p>
    <p>Thanks a lot for your input,<br>
    mick</p>
