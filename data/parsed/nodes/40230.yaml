      <p>The first two examples are of halftone dots blown up to huge proportions. But basically, yes, a screen was used to photograph a continuous-tone image and <a href="http://en.wikipedia.org/wiki/Halftone" rel="nofollow">prepare it for the printing process</a>. Whereas the term <a href="http://en.wikipedia.org/wiki/Raster_graphics" rel="nofollow">raster</a> has to do with imaging on a video screen or computer monitor.</p>
      <p>In the third example, perhaps there was some work done by hand.</p>
    html_clean: |-
