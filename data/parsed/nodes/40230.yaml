      <p>Play around with 2 things in Photoshop:</p>
      <p>The Half Tone filter</p>
      <p>Printing with a wacked out screen - in the print dialogue you can specify a screen - try this for starters: 35lpi with 45 degree lines - I've used different screens a lot, printed them and then resampled with a scanner. It's not going to go through a good RIP this way but works on most lasers that have Postcript - haven't tried it on an ink jet but now that I'm thinking about it I probably will.</p>
      <p>pbc</p>
