      <p><em>Also, why is the online software program called The Rasterbator if you still get kinda the same effects as the images attached?</em></p>
      <p>Hi, Wesley. I wasn't clear, sorry: the effects of both processes are indeed the same, or sufficiently similar. I was just splitting hairs to point out the different origins and uses of both methods: one from the print world, the other from the television/onscreen world.</p>
      <p>Not sure what the ads from the German company are for, or if they used the term "raster" for both print and screen.</p>
      <p>Neat fact I found out last night: "raster" comes from the Latin word rastrum, which means "rake," as in: "Screen images are made up of a pattern of several hundred parallel lines created by an electron beam 'raking' the screen from top to bottom at a speed of about one sixtieth of a second." (from <em>The Mac Designer's Handbook</em>, 1992 edition, by Alastair Campbell.)</p>
