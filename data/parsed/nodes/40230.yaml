      <p>Take a greyscale image in photoshop and convert to bitmap. Specify custom halftone and you can choose the dot/line etc and rate. Start with an upsampled 1200 dpi image and you will get good results. </p>
      <p>Used to be done on a stat camera as mentioned. You would lay a screen over your 100% image and impose the dot.</p>
