    html: <p>The third image (the sheep) was likely created using pattern sheets (Zipatone, Letraset, etc.). The sheets were adhesive-backed translucent film with halftone patterns printed on them in various sizes. They were used by illustrators and comic book artists a lot. You could cut out shapes with an X-acto knife and burnish it onto the art board, for instance. In the sheep illustration, it appears that several pattern sheets were overlaid at slightly different angles to get a moiré effect and shading.</p>
