      <p>I was looking through an old issue of Graphis Issue No. 92, and there was an old advertisement that offered services for 'Spezial-Raster' of images (German Company). They offer various catagories you could have it at, such as '40er Spezial-Raster' &amp; '20er Spezial-Raster'. What does this mean, and is there any other process of doing it without that insane machine :O. </p>
      <p>Also, why is the online software program called <a class="freelinking external" href="http://homokaasu.org/rasterbator/" rel="nofollow">The Rasterbator</a> if you still get kinda the same effects as the images attached?</p>
      <p>Thanks Ricardo. I appreciate talking to people who used the archaic machinery, really fascinating!</p>
