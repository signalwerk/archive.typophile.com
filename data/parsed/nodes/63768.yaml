      <p>Mad Kings and Englishmen: a month dedicated to Charles Dickens<br>
    ==============================================================</p>
    <p>These lunchtime events with a Dickensian flavour partner the St Bride Foundation Lunchbox Theatre production Mad Kings and Englishmen, written and directed by Jessica Swale and presented by Red Handed Theatre Company. The show runs Tuesday–Friday, 27 October–20 November 2009.</p>
    <p>Dickens paper and print treasures<br>
    ————————————————-<br>
    * Dates Friday 30 October and Fridays 6, 13, 20 November 2009<br>
    * Time noon to 2.30pm<br>
    * Where St Bride Library, St Bride Foundation<br>
    * Admission free</p>
    <p>See rare printed materials written by Charles Dickens in this exhibition of selected pieces from the St Bride Library collection. Highlights include complete sets of the original weekly editions of All the Year Round and Household Words dating back to 1859. There’s also a chance to read about Dickens’s stormy relationship with his publishers Chapman and Hall and their furious spat over the much loved story of goodwill to all men, A Christmas Carol.</p>
    <p>Printing in action<br>
    —————————<br>
    Printer Richard Lawrence will demonstrate how the historic Albion printing press in the collection of the St Bride Library works. See it in action and collect a memento of our month dedicated to Charles Dickens.</p>
    <p>* Date Friday 6 November 2009<br>
    * Time 2pm<br>
    * Where St Bride Library Exhibition Room, St Bride Foundation<br>
    * Admission free; voluntary donation welcomed</p>
    <p>We apologise that this notice goes out after the first dates have passed.</p>
    <p><a href="http://stbride.org/events/madkingsandenglishmen" title="http://stbride.org/events/madkingsandenglishmen">http://stbride.org/events/madkingsandenglishmen</a></p>
