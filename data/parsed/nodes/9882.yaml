    html: "<p>Well, the obvious recommendation may be House Industries' '<a href=\"http://www.houseindustries.com/index.php?page=showfont&amp;id=4\" target=\"_blank\">Chalet</a>'.? <br><i>Some more fabulous 'Bauhaus' alternates.: '<a href=\"http://www.t26.com/fonts/display.php?f_id=487&amp;dw=256\" target=\"_blank\">Baby Mine</a>', by Mauro Carichini; '<a href=\"http://www.processtypefoundry.com/typefaces/bryant/\" target=\"_blank\">Bryant</a>', by Eric Olson..</i> <br> <br><i>( You could even try to see '<a href=\"http://www.myfonts.com/fonts/itc/horatio/morelikethis.html\" target=\"_blank\">More Fonts Like Horatio</a>', or '<a href=\"http://www.myfonts.com/browse/keyword/bauhaus/\" target=\"_blank\">Browse by Keyword : Bauhaus</a>', but you may have already done that.. )</i></p>"
