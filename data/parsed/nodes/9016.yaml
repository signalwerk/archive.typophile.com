  html: "<p>Hi, <br> <br>I'm working on a logo for a design house in Hamburg, Germany. The name of the company is \"Funkbüro\", which roughly translates as \"Broadcast Bureau\" and is both a reference to their location in the vicinity of a major radio station as well as a hint about the nature of design as something you send out into the world. <br> <br>The company wants to position itself in the \"quality sector\" of this, highly competitive market. Thus, the subtitle is \"Manufaktur für Gestaltung\", which translates as \"Manufacture of Formgiving\" (well, in fact it doesn't, because Gestaltung is one of those wonderful German words, that just don't translate into English without loss. Suffice it to say that it sounds better in German...). Anyway, here it is: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/64457.gif\" alt=\"Logo\"> <br> <br>The logo is a simple custom \"fb\" ligature loosely based on Futura lower-case, combined with a series of quarter-circles to represent radiowaves and the name of the company in upper-case Futura. The subtitle is FF Seria Sans Italic. <br> <br>The color (dark red) is loosely in the right ballpark, but at this stage I'm not too concerned about that, as I believe that a logo must work in its most simple 2-color state. <br> <br>Anyway, I'd be grateful for some feedback and especially whether you perceive the fb ligature as letters or as part of some weird abstract shape. <br> <br>Thanks.</p>"
  html_clean: "<p>Hi, <br> <br>I'm working on a logo for a design house in Hamburg, Germany. The name of the company is \"Funkbüro\", which roughly translates as \"Broadcast Bureau\" and is both a reference to their location in the vicinity of a major radio station as well as a hint about the nature of design as something you send out into the world. <br> <br>The company wants to position itself in the \"quality sector\" of this, highly competitive market. Thus, the subtitle is \"Manufaktur für Gestaltung\", which translates as \"Manufacture of Formgiving\" (well, in fact it doesn't, because Gestaltung is one of those wonderful German words, that just don't translate into English without loss. Suffice it to say that it sounds better in German...). Anyway, here it is: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/64457.gif\" alt=\"Logo\"> <br> <br>The logo is a simple custom \"fb\" ligature loosely based on Futura lower-case, combined with a series of quarter-circles to represent radiowaves and the name of the company in upper-case Futura. The subtitle is FF Seria Sans Italic. <br> <br>The color (dark red) is loosely in the right ballpark, but at this stage I'm not too concerned about that, as I believe that a logo must work in its most simple 2-color state. <br> <br>Anyway, I'd be grateful for some feedback and especially whether you perceive the fb ligature as letters or as part of some weird abstract shape. <br> <br>Thanks.</p>"
