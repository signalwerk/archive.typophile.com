    html: <p>I like it! <br> <br>There are 3 things that bug me/may need tweaking, in my opinion. They are all pretty minor. <br> <br>1. I realize that it's because of the interaction of the box, the type, and the 'waves', but the waves and the 'K' in 'FUNK' seem a bit close to the edge, but this is also because my eyes keep seeing the box, and ignoring the 'BüRO'. Is there a plan to use just the square part? This isn't such a big deal, really. <br> <br>2. The terminal on the 'f' looks too much like a 'j' to me. I see the 'fb', but perhaps you should cleave off half of the bowl, or break the curve between the 'f' and the 'b' to strengthen the letters? <br> <br>3. The tagline feels odd to me. I don't know if it's the typeface, or the placement, or both. It just feels like the odd man out. It may be the 'close but not quite' feeling of the Futura and the Seria Sans (though I like both faces individually). However, I don't think I have a better solution for you. <br> <br>Again, I really like it, but somthing feels 'not quite right' about it. Like it's just a bit too busy/complex/sectioned for the bold, simple concept and aesthetic. However, it's still a strong solution in its current form.</p>
