    <p>Hi guy,</p>
    <p>This is my first time here. </p>
    <p>I made a logo a while ago for a friend. Now he want's to make a french version of his logo. Since I outlined the text on the logo, I need to find what's the font I used. Any idea?</p>
    <p>I already tried WhatTheFont and WhatFontis without success. So don't waste your time there.</p>
    <p>Thanks!!!!!</p>
