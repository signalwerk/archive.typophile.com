    html: |-
      <div class="comment-spam-body"><p>As far as I can determine the OPTI NovaAugustea -- without facets and including Nebiolo's lower case -- is one of the few original fonts produced by the long defunct OPTI company. Unfortunately, there is no legitimate way in which it can be acquired for commercial use.<br>
      I have no information on the legal status of the Augustus font at dafont.<br>
      Don</p>
      </div>
