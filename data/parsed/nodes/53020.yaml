    <p>Greater Albion Typefounders is now approaching the end of its second month selling through Myfonts.com.  We've taken the next big step-setting up a web presence.  For the moment this takes the form of a Wordpress Blog where new releases will be announced-and the odd sneak preview given...</p>
    <p>We can be found at <a href="http://gatf.wordpress.com/" title="http://gatf.wordpress.com/">http://gatf.wordpress.com/</a></p>
    <p>We hope to develop a full website soon, but for the moment we're all tied up working on the next couple new new releases...</p>
