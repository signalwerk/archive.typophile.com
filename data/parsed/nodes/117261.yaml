    <p>I read that some excellent fonts for making your own <em>The</em>'s include OPTI Sport Script, MVB Mascot, Metroscript, Machiarge, Fenway Park, Univers, and Trade Gothic (Links on <a href="http://fontsinuse.com/uses/15/the-chop-shop" target="new53" rel="nofollow" class="link-external">this page</a>) but I'm a sucker for the embellishments, sometimes even just simple lines above and below, that are characteristic of these ornaments, and if I try to make them myself and tailor them to the style, my results vary.</p>
    <p>So my question is, <strong>Do you know of any other fonts out there with prefab THE &amp; AND ornaments, like <a href="http://www.myfonts.com/fonts/emigre/brothers-ot/word-logos" target="new52" rel="nofollow" class="link-external">Brothers Word Logos</a>, and can you help a brother out?</strong> Also, what are your favorite type ornament fonts? (I'm indebted to <a href="http://www.dafont.com/old-foundry-prints-tfb.font?fpp=100" target="new54" rel="nofollow" class="link-external">Old Foundry Prints TFB</a>) Thanks so much for your time!</p>
