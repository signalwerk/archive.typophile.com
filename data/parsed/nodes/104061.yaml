  html: |-
    <p>Hi, </p>
    <p>Does anyone have any suggestions for a display, headline and/or body text typeface(s) or font(s) to use to for a web ad to advertise a business on Acupuncture Today online:</p>
    <p><a href="http://www.acupuncturetoday.com/mpacms/at/home.php" title="http://www.acupuncturetoday.com/mpacms/at/home.php">http://www.acupuncturetoday.com/mpacms/at/home.php</a></p>
    <p>It's an ad to incentivize Acupuncturists to click on it for a free marketing session. I'm looking for faces that are bold and or interesting enough that they get attention but not so much that they stick out like a sore thumb or look obnoxious on what is a fairly relaxed feeling website. Anything that has a an Asian flair,  and or sense of growth (Grow may be one of the words in the ad) or healing would be great as well. They also have to be readable at a very small size because the ad is 125 px x 125 px. </p>
    <p>Thanks for any suggestions!</p>
