    html: |-
      <p>Kerning and tracking are two related and frequently confused typographical terms. Both refer to the adjustment of space between characters of type. </p>
      <p>Kerning is Selective Letter spacing.</p>
      <p>Tracking is Overall Letterspacing.</p>
