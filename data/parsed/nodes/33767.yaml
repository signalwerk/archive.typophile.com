    <p>Hi Typos!</p>
    <p>I'm working on an identity for a e-commerce-site with the purpose of selling children’s clothes. Age 0-8 years.</p>
    <p>Anyway, I need some inspiration/suggestions for a feminine font. The product is called "botop.dk" so the font needs to be a bit characteristic and girly ;-)</p>
    <p>Thanks in advance!</p>
    <p>/Henriko</p>
