    <p>Now, I'm normally rather against typefaces that try to emulate the writing style of other languages or seek to imbue a "culture" into a font (for example: <a href="http://www.dafont.com/theme.php?cat=201" title="Chinese &amp; Japanese Style Type" class="link-external">Chinese &amp; Japanese Style</a>), but the work done on Abu Dhabi's official font is rather impressive:</p>
    <p><a href="http:// Abu Dhabi&amp;#039;s New Font" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">http:// Abu Dhabi's New Font</a></p>
    <p>Most impressively, it manages to avoid the cheesy look <a href="http://www.dafont.com/theme.php?cat=202&amp;page=1" title="Other Arabic fonts" class="link-external">most Arabic-styled fonts</a> managed to trudge into and fits the brand rather well. I like the loops on the 'g' and 'y,' though I have to wonder what would happen if they tried to write any word that had a 'gy' together, like 'clingy.'</p>
    <p>What do you all think?</p>
