    html: |-
      <p>It is definitely not designed as a body typeface. Words like "moment" in their example become a bit laborious to read and as hashimpm says, reading long strings would be terrible, so I'd imagine that they will be pairing it with a more legible typeface of some sort, but the site doesn't make that clear. </p>
      <p>While I do agree that fonts should live in their own cultures (the pages I linked to on dafont seem to exemplify that), this one does seem to have some good qualities. Especially, as James points out, if it had some lighter options and maybe a bit less arabian nights feel (the extended connectors could definitely be shorter), it could be more elegantly presented.  Ultimately, the biggest issue I see with the font is that it precludes the ability for them to put both arabic and english versions on the same page. I like how, if you squint, the Abu Dhabi font presents a similar feel to the arabic one they've paired it with, but it tends toward being too similar, to the detriment of legibility when combined. </p>
      <p>The other thing I noticed was that the numerals on the font were stolen directly from Nazanin, which probably didn't help when weighting the english version. You don't usually see such direct "borrowing" and I'm a bit surprised.</p>
