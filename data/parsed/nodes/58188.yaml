      <p>I don't think it does avoid the cheesy look of other pseudo-Arabic fonts. And the use of extended connecting strokes with random dots above and below impedes readability by disrupting English words.</p>
      <p>I quite like the brand mark, though.</p>
      <p>The choice of Nazanin as a companion Arab font is competent, but not inspired.</p>
