      <p>The brand strategy sounds good, but typeface? Trying to please English and Arabic reading audience seems short-sighted. Reading long paragraphs in that typeface will be a nightmare. Why not try and match a no-frills accepted Roman typeface with a contemporay Arabic typeface like many have succesfully done before. </p>
      <p>We in India with its many languages have often tried to design a local-flavoured Roman typeface, rather unsuccessfully. Even at the cost of being called a pessimist, Rudyard Kipling's verse "The East is East and the West is West/ The twain shall never meet" comes to my mind immediately.</p>
