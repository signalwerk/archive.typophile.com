    votes: null
    html: |-
      <p>Yes a scan with some editing. Would take a lot of work to make it look crisp and finished at high resolution. This may be one of the ones that Dieter did himself, instead of "improving" a existing font.<br>
      The general style of ornamentation is from about the 1820's to 40's. The kind of thing Joseph Gillé would have done in Paris, or perhaps by a German designer of the era. Somewhat similar leaves are shown in Gray's 19th Century Ornamented Typefaces with the label "German Text ornamented" by Thorowgood, and the note "copied from the German of the early thirties."<br>
      We have identified a digital source but know nothing about it.<br>
      Don</p>
