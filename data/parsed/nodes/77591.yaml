  html: |-
    <p>I've been considering possibly using either in my personal branding for both print and online use, and was curious to know how well the webfont versions of the FF Scala and FF Scala Sans work? I've been trying to dig up examples of their use online, but I am unfortunately coming up a bit short. </p>
    <p>FF has a few examples on it's Flickr page, but does anybody know of any better examples?</p>
    <p>Any help would be appreciated!</p>
