      <p>It would be helpful if you gave a little more detail about your intended usage, such as -- is this for the development of a word mark (logo) or publication which requires multiple weights (medium, bold, italic, bold italic, etc.).</p>
      <p>Some aspects of Frutiger Next are similar, but then again, there are only two weights, Frutiger Next Light and Light Italic.</p>
