  html: |-
    <p>I am looking for a font that is similar to Gill Sans, but doesn't have all the overlapping extensions that Gill Sans has in it's italic forms (mainly the lower case "p" and it's little upper right tail thing) does anyone have a suggestion for a similar font?</p>
    <p>Thanks in advance!</p>
    <p>Beau</p>
