    html: "<p>I wrote: <br>&gt; the degree of optical compensation depends very much on the scale of application. <br> <br>This was admittedly a bit of (educated?) \"theoretical\" guesswork (as opposed to something gleaned from practice, since I've yet to make any optically corrected type), but I just found some great backup: <br> <br>In Harry Carter's translation of Fournier's landmark \"Manuel Typographique\", a note at the beginning of chapter XIX (\"Alignment\") says: <br> <br>\" <br>To satisfy the eye at 6-pt. o has to be about one-eighth taller than the x, a 12-pt. one-twelfth, a 36-pt. one-fifteenth, and a 72-pt. one-eighteenth. The amount of difference required varies with the degree of extension of the type and the shape of the shading*. <br>\" <br> <br>(BTW, \"shading\" here means stroke stress, I think.) <br> <br>It sure is great to have the old guys confirm your hunches! <br> <br>hhp <br></p>"
    html_clean: "<p>I wrote: <br>&gt; the degree of optical compensation depends very much on the scale of application. <br> <br>This was admittedly a bit of (educated?) \"theoretical\" guesswork (as opposed to something gleaned from practice, since I've yet to make any optically corrected type), but I just found some great backup: <br> <br>In Harry Carter's translation of Fournier's landmark \"Manuel Typographique\", a note at the beginning of chapter XIX (\"Alignment\") says: <br> <br>\" <br>To satisfy the eye at 6-pt. o has to be about one-eighth taller than the x, a 12-pt. one-twelfth, a 36-pt. one-fifteenth, and a 72-pt. one-eighteenth. The amount of difference required varies with the degree of extension of the type and the shape of the shading*. <br>\" <br> <br>(BTW, \"shading\" here means stroke stress, I think.) <br> <br>It sure is great to have the old guys confirm your hunches! <br> <br>hhp <br></p>"
