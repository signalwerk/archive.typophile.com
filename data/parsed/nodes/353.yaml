    html: "<p>Randy, <br> <br>thanks to help me on my comment! <br> <br>To learn what value optically you need to adjust between horizontal and vertical: <br> <br>Draw a rectangle, multiply it by 2, one horizontal, one vertical, then adjust the one you want to achieve booth in same \"color.\" Then, you will know what kind of value you can start to do such corrections in your future jobs. <br> <br>I really don't think that the \"using size\" change something, its more how you see it, nobody see it in same way. In my case, I found 80% of serif typefaces have too thinner vertical in N and  V, etc.!!!!</p>"
    html_clean: "<p>Randy, <br> <br>thanks to help me on my comment! <br> <br>To learn what value optically you need to adjust between horizontal and vertical: <br> <br>Draw a rectangle, multiply it by 2, one horizontal, one vertical, then adjust the one you want to achieve booth in same \"color.\" Then, you will know what kind of value you can start to do such corrections in your future jobs. <br> <br>I really don't think that the \"using size\" change something, its more how you see it, nobody see it in same way. In my case, I found 80% of serif typefaces have too thinner vertical in N and  V, etc.!!!!</p>"
