    html: "<p>Peter, <br> <br>I think what he's getting at is this: <br>It looks like you've made this by drawing a line in  <br>illustrator, then adding weight to it (with rounded corners,  <br>and ends). This means that all parts of the characters are  <br>the same width. However optically, verticals look skinny  <br>compared to horizontals of exactly the same size. So you  <br>have two options, 1) make all the horizontals fatter or 2)  <br>make the verticals skinnier. JFP's suggestion is a good one,  <br>fix the verticals because there's only three of them, the f  <br>and the left and right parts of the u. <br> <br>You can go crazy here, because in reality optical  <br>adjustments arent just for horizontals and verticals. What  <br>about diagonals? Think of a circle. Thinnest at top, thicker,  <br>thicker thicker thicker Thickest at the middle and thinner  <br>again on the bottom. So diagonals should also fall  <br>somewhere in between. Hope that made some sense. It  <br>won't need much to make it look optically right.  <br>Just a pinch. <br> <br>Randy</p>"
    html_clean: "<p>Peter, <br> <br>I think what he's getting at is this: <br>It looks like you've made this by drawing a line in  <br>illustrator, then adding weight to it (with rounded corners,  <br>and ends). This means that all parts of the characters are  <br>the same width. However optically, verticals look skinny  <br>compared to horizontals of exactly the same size. So you  <br>have two options, 1) make all the horizontals fatter or 2)  <br>make the verticals skinnier. JFP's suggestion is a good one,  <br>fix the verticals because there's only three of them, the f  <br>and the left and right parts of the u. <br> <br>You can go crazy here, because in reality optical  <br>adjustments arent just for horizontals and verticals. What  <br>about diagonals? Think of a circle. Thinnest at top, thicker,  <br>thicker thicker thicker Thickest at the middle and thinner  <br>again on the bottom. So diagonals should also fall  <br>somewhere in between. Hope that made some sense. It  <br>won't need much to make it look optically right.  <br>Just a pinch. <br> <br>Randy</p>"
