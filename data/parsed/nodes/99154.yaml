  - id: 535157
    user: 1250
    date: 2012-12-26T15:48:00
    date_raw: 26 Dec 2012 — 3:48pm
    votes: null
    html: |-
      <blockquote><p>She gives me a quite pitiful look</p></blockquote>
      <p>Welcome to the club! Just one thing: you can't leave.</p>
      <p>It's actually quite nice I think, especially considering you've only been doing type design for half a year! However it will be hard making it stand out in this crowded genre...</p>
      <p>I agree with Alex about the "g" - it's the only big sore spot. It's trying too hard. Simplify it, especially the bottom-left terminal. You might even try a Danish "g" or a Koch "g". Also, the "x" is too geometric - try staggering at least one pair of opposing arms. Capitals: The "C" seems too wide; the "K" is too bland. BTW, that's one of the nicest "5"s I've seen.</p>
      <p>The term "Book": People use it to mean both lighter than Regular, and heavier! So label the weight you think is best for text Regular, and the other one Book.</p>
      <p>Overshoots: You do indeed need more (and don't judge it by the screen... unless it's a screen font, in which case however there's a whole different mindframe to factor in). There's no formula for ideal overshoot, since it depends on a number of things; I use 10-16 for text. BTW darker weights need more overshoot (otherwise they look short); try a difference of 4 between each weight.</p>
      <p>Weight separations: As Craig said, think in pairings. Looking casually I would say that the darkest two (especially the Bold) need to be darker.</p>
      <p>Trapping: Do do it, but not for any display-centric styles. BTW:<br>
      <a href="http://www.themicrofoundry.com/ss_trapping1.html" title="http://www.themicrofoundry.com/ss_trapping1.html">http://www.themicrofoundry.com/ss_trapping1.html</a></p>
      <p>Italics: Please don't make a boring traditional one; in fact that could be where this stands out from the crowd.</p>
      <p>Lastly, the name... Something nicely cold. What about Alpina?</p>
      <p>Oh, and whatever you do, keep it up! One day your girl will be proud.</p>
      <p>hhp</p>
