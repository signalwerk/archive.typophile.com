      <p>I played around with it and think that 10-12 would be right. Otherwise at large sizes the "o" will be to tall and the "b" and "p" will look like they have hanging bellies. It would certainly help if it worked reasonably good in a browser, but I'll see if I want to take the extra steps to make this work.</p>
      <p>Could anyone tell me if this behavior is "normal" or how to correct it? All overshoots are in alignment zones yet the type is distorted at 100% zoom in InDesign and in an exported PDF.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto 2012-12-27 um 18_6260.31.36.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto 2012-12-27 um 19_4495.23.07.png"></div><p></p>
      <blockquote><p>Italics: Please don't make a boring traditional one; in fact that could be where this stands out from the crowd.</p></blockquote>
      <p>Could you specify what you mean if you say "traditional"? I thought along the lines of a dynamic oblique one which really pushes forward. This picture shows the direction I'm leaning to. It's not refined by any means, only automatically skewed and played with a bit.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto 2012-12-27 um 20_5493.00.06.png"></div><p></p>
      <blockquote><p>Lastly, the name... Something nicely cold. What about Alpina?</p></blockquote>
      <p>As a German, <em>Alpina</em> reminds me too much of swiss chocolate (there's a brand called <em>Alpia</em> here) and bavarian folklore. But mabye this is different for the rest of the world. I thought about something feminine yet rational. Task: A typographically good-looking word that evokes the picture of a beautfiul <em>and</em> loving woman in a lab coat. As this is almost impossible, I'll have to settle for something else, but this is not my top priotrity yet. ;)</p>
      <blockquote><p>Oh, and whatever you do, keep it up! One day your girl will be proud.</p></blockquote>
      <p>Either that or she will send me to a psychiatrist. But I'll take your advice and the chance anyway. ;)</p>
      <p>Sorry for writing too much, folks!<br>
      One question left: Is there any way to attach files to followup posts?</p>
