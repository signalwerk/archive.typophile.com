      <p>BTW your italic /g looks much better than the regular one.  I think it's because the sharp angle of the original has been replaced by a curve, which reduces the crowding effect.  </p>
      <p>The suggested replacement /g you linked to is OK, but looks a bit top-heavy.  I don't think you need to shift it quite that far back in the direction of orthodoxy.  Might I suggest taking your first /g and replacing that sharp angle with a more gentle curve that joins the top a bit further to the left?</p>
