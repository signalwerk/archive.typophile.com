      <p>That's nice!  At first glance, my only reservation is the default /g, which doesn't quite convince me.  I think the join with the upper circle could be a bit farther to the left... that area looks a bit crowded as it is.  OTOH, I do like the alternate /g, which I think works better.</p>
      <p>In the Heavy weight, you might investigate more use of ink traps and/or subtle tapering of strokes leading in to the acute intersections.  Otherwise it looks fine to me.</p>
      <p>I'm not a professional (yet, anyway), so take that with a grain of salt...</p>
