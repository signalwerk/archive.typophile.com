    html: |-
      <blockquote><p>Welcome to the club! Just one thing: you can't leave.</p></blockquote>
      <p>I don't indent to leave. Yet.</p>
      <blockquote><p>However it will be hard making it stand out in this crowded genre...</p></blockquote>
      <p>I know. It was more excentric when I started. With a kind of broken-script look. But then I wanted to really learn something doing my first typeface. I thought I should learn from what to abstract before doing anything too fancy. Then I find that there aren't <em>that</em> many geometric sans text faces with decent language support and matching italics apart from the classics. When I began I never thought about selling this. After studying the Myfonts <em>New Fonts</em> lists for some time I think I'll try to offer it there at a reasonable price and see how it works out.</p>
      <blockquote><p>I agree with Alex about the "g" - it's the only big sore spot. It's trying too hard. Simplify it, especially the bottom-left terminal. You might even try a Danish "g" or a Koch "g".</p></blockquote>
      <p>It's a pity, I quite liked it. But then, if two persons tell me on first sight that something's not right about it, you are propably right. I changed it to a more classic type (<a href="https://docs.google.com/open?id=0B8upnx-TIQeYdWczd1cyX25hVHc" rel="nofollow">Click here for a new specimen</a>). Maybe I'll include a revised version of the old one as a variant, along with a more "contemporary" symmetric "K", because I like the current "K" in it's blandness. As for Koch and Danish "g"s: I had to look them up first. I consider the Danish one, but personally don't like the Koch one too much. In my own design work, I have more than once encountered great fonts in which single characters were deal breakers for deviating too much from "standard" letterforms. Therefore I rather go on the side of boredom in the default stylistic sets and include everything else as alternates. </p>
      <blockquote><p>BTW, that's one of the nicest "5"s I've seen.</p></blockquote>
      <p>Thank you!</p>
      <blockquote><p>Overshoots: You do indeed need more (and don't judge it by the screen... unless it's a screen font, in which case however there's a whole different mindframe to factor in). There's no formula for ideal overshoot, since it depends on a number of things; I use 10-16 for text. BTW darker weights need more overshoot (otherwise they look short); try a difference of 4 between each weight.</p></blockquote>
      <p>I played around with it and think that 10-12 would be right. Otherwise at large sizes the "o" will be to tall and the "b" and "p" will look like they have hanging bellies. It would certainly help if it worked reasonably good in a browser, but I'll see if I want to take the extra steps to make this work.</p>
      <p>Could anyone tell me if this behavior is "normal" or how to correct it? All overshoots are in alignment zones yet the type is distorted at 100% zoom in InDesign and in an exported PDF.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto 2012-12-27 um 18_6260.31.36.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto 2012-12-27 um 19_4495.23.07.png"></div><p></p>
      <blockquote><p>Italics: Please don't make a boring traditional one; in fact that could be where this stands out from the crowd.</p></blockquote>
      <p>Could you specify what you mean if you say "traditional"? I thought along the lines of a dynamic oblique one which really pushes forward. This picture shows the direction I'm leaning to. It's not refined by any means, only automatically skewed and played with a bit.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto 2012-12-27 um 20_5493.00.06.png"></div><p></p>
      <blockquote><p>Lastly, the name... Something nicely cold. What about Alpina?</p></blockquote>
      <p>As a German, <em>Alpina</em> reminds me too much of swiss chocolate (there's a brand called <em>Alpia</em> here) and bavarian folklore. But mabye this is different for the rest of the world. I thought about something feminine yet rational. Task: A typographically good-looking word that evokes the picture of a beautfiul <em>and</em> loving woman in a lab coat. As this is almost impossible, I'll have to settle for something else, but this is not my top priotrity yet. ;)</p>
      <blockquote><p>Oh, and whatever you do, keep it up! One day your girl will be proud.</p></blockquote>
      <p>Either that or she will send me to a psychiatrist. But I'll take your advice and the chance anyway. ;)</p>
      <p>Sorry for writing too much, folks!<br>
      One question left: Is there any way to attach files to followup posts?</p>
