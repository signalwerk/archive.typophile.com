      <p>Thanks for your first comments.</p>
      <blockquote><p> That's nice! At first glance, my only reservation is the default /g, which doesn't quite convince me. I think the join with the upper circle could be a bit farther to the left... that area looks a bit crowded as it is. OTOH, I do like the alternate /g, which I think works better.</p></blockquote>
      <p>Yes, you are certainly right. I prefer a two-storey g to the single-storey one, so I will see into this and try to make it a bit lighter in the middle part.</p>
      <blockquote><p>In the Heavy weight, you might investigate more use of ink traps and/or subtle tapering of strokes leading in to the acute intersections. Otherwise it looks fine to me.</p></blockquote>
      <p>I have thought about ink traps. Tapering may help, but I didn't want to move away too far from the more uniform look of the lighter weights' lines. But then the Heavy one would probably only be used in display applications like headlines. I personally don't like the whole "ink traps as design features in display sizes"-craze. Maybe I am going to add ink traps to the Regular version and call it "Text" for print applications.</p>
      <blockquote><p>You need more overshoot on curves and sharp angles.</p></blockquote>
      <p>This was something I really wasn't sure about. The type was a bit "squarisher" some time ago and I did never change the overshoot. I had 5 units of overshoot on round characters (the x-height is 500, so it's 1%). Is there any rule of thumb in which region overshoot would be unit-wise?</p>
      <blockquote><p>Is the bold intended to serve when emboldening regular text? It might be too close. In other words, consider pairings of weights when sorting out weights.</p></blockquote>
      <p>It was indeed thought to serve as a weight for highlighting body text. I'll see how to proceed with that. Maybe I'll just add a bit of weight to the bold. Or throwing out the regular alltogether and bolden the Book version a bit. But then the regular is one of the three the interpolation is based upon, so it would be a bit of a waste...</p>
