      <p>Hi folks and thank for your critique. I let the font design rest some days and now went back fixing some things before starting the italics. I think of a slanted/oblique one with only slight reminiscence to "real" italics.</p>
      <p>Concerning hinting, I already looked into it and will decide later if manual hinting really is neccessary and worth the time it costs. </p>
      <p>I put together a new Specimen (nothing final yet) and changed the working title from <em>Handgloves</em> to <em>Spacechild</em>, because it sounds cooler. ;)</p>
      <p>I'd like to ask you alle what do you think of the spacing, in general? I know it's far from perfect, but I'm not too shure if it's too loose over all. If I space the type optically in InDesign, letters are much closer, but it looks a bit unbalanced, especially in the thinner weights. I roughly followed the spacing advice in Karen Cheng's <em>Designing Type</em>.</p>
      <p>Also, what is the best practice spacing the lowercase |i| with diacritics? Are there any languages where a combination like |ïî| occurs and do they have to be kerned to avoid collision?</p>
      <p><a href="https://docs.google.com/open?id=0B8upnx-TIQeYX19BbUZhTHRpanM" rel="nofollow">The new Specimen is here.</a> I added a page with words to test spacing in all the weights. </p>
      <p>I think I am going to start on the oblique version once I am sure about the spacing and if nobody has any major objections about the design.</p>
