      <blockquote><p>It was more excentric when I started. With a kind of broken-script look.</p></blockquote>
      <p>That sounds tantalizing actually.</p>
      <blockquote><p>personally don't like the Koch one too much.</p></blockquote>
      <p>This is a typical reaction. It was actually my own reaction many years ago - but slowly I realized it has an important role to play under certain circumstances. And when Nina Stössinger started developing Ernestine* she balked at the idea** when I suggested it. But guess what Ernestine's "g" ended up looking like...  :-)</p>
      <p>* <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a></p>
      <p>** <a href="http://typophile.com/node/50670#comment-307172" title="http://typophile.com/node/50670#comment-307172">http://typophile.com/node/50670#comment-307172</a></p>
      <blockquote><p>Could anyone tell me if this behavior is "normal" or how to correct it?</p></blockquote>
      <p>There's something called "hinting", which is a pain but is required for good onscreen rendering.</p>
      <blockquote><p>A typographically good-looking word that evokes the picture of a beautfiul and loving woman in a lab coat.</p></blockquote>
      <p>Nice. Reminds me of a very cool song:<br>
      <a href="http://www.youtube.com/watch?v=u7aDstrDMf0" title="http://www.youtube.com/watch?v=u7aDstrDMf0">http://www.youtube.com/watch?v=u7aDstrDMf0</a><br>
      OK, what about "Audit me baby"?  :-&gt;<br>
      Or maybe "Georgina".</p>
      <p>Lastly, concerning "non-traditional" Italics:<br>
      I guess my stance is more relevant to serif fonts, where I value the slanted-Roman concept (albeit with more sensitivity than is typical) much more than most; in sans designs it's harder to stand apart without being too unorthodox. So I'm not sure specifically what to recommend... Just follow your own original logic instead of repeating bad precedents.</p>
      <p>hhp</p>
