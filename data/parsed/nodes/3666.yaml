    html: <p>They are both LetterPerfect fonts. Adobe just had the single weight, Agfa has  both weights. As you know Adobe and Agfa often sell fonts that originate in other foundries. It's possible LetterPerfect also sells the same fonts. In fact, they do, as <a href="http://www.letterspace.com/LETTERPERFECT_FONTS/spring.htm" target="_blank">this page </a>shows. They sell both weights too.</p>
