  html: |-
    <p>I don’t think this really belong in the ID Forum as it’s a source I’m after rather than an ID.</p>
    <p>I’d like to find a Windows font of the official Norwegian traffic sign font shown in this page from the sign design manual<br>
    </p><div class="imageWrap"><img src="/files/TRAFIKKALFABETET_5403.jpg"></div><br>
    there are further showings from page 39 onwards of this <a href="http://www.vegvesen.no/cs/Satellite?blobcol=urlpdf&amp;blobheader=application%2Fpdf&amp;blobkey=id&amp;blobtable=SVVvedlegg&amp;blobwhere=1174979504101&amp;ssbinary=true" target="new">PDF</a><p></p>
    <p>It’s very similar to various DIN type fonts, but is (of course) not the same.</p>
    <p>I found the sign designs (downloadable in a variety of formats), but with my non-existant Norwegian I can’t find the font anywhere on the site.</p>
    <p>I have tried mailing the department, but I’ve not had a reply yet.</p>
    <p>All help gratefully received.</p>
    <p>Richard</p>
