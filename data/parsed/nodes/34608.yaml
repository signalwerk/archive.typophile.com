    html: '<p>It’s rather similiar — though not identical, the “a” is quite different — to the face used on US freeway signs. Check out a pretty good emulation of it here: <a href="http://www.fontbureau.com/fonts/Interstate" title="http://www.fontbureau.com/fonts/Interstate">http://www.fontbureau.com/fonts/Interstate</a></p>'
