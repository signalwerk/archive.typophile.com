    <p>Please be gentle with me as this is my first time posting.  I am trying to identify the font of my logo Cossé Designs and thought it was Caligula but its not—but close.  I can’t upload an image because my logo image is to complex and large.  I have had this logo for quite some time and am unable to figure out how strip out the background to just leave the font.  If someone would kindly go to my website <a href="https://web.archive.org/web/20080829143926/http://www.cossedesigns.com/" title="http://www.CosseDesigns.com">http://www.CosseDesigns.com</a> and look at my Logo and identify the font I will be so ever grateful.  I’ve spent hours looking through internet sites trying to identify but no luck.  Thank you one and all at Typophile for your help.</p>
    <p>Mona</p>
