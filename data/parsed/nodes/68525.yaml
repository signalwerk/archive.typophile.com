      <p>I was in Chester just before Christmas and the first thing that struck me was that appalling font - it's everywhere and it's an eyesore; it is so badly done. That pseudo medieval feel is just totally amateurish. I seem to remember the Ww's are back to front.</p>
      <p>You'd be better off using anything else in a similar vein.</p>
