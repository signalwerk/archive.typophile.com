  html: |-
    <p>&nbsp;<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MP-M_1_6171.jpg"></div><br>
    During my talk at the <a href="http://fontfeed.com/archives/expert-class-type-design-graduation-and-exhibition/" rel="nofollow">graduation ceremony</a> of the <em>Plantin Institute of Typography</em> on the 10th of September, I mentioned that it is rather strange that visitors of the Museum Plantin-Moretus are allowed to keep their shoes on. One would expect that in this Holy Temple of Typography visitors are requested to take their shoes off. On the other hand, this could have a negative effect on the substance and quality of the atmosphere in the museum, and hence on the precious collection.<br>
    &nbsp;<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Plantoffels_1_4059.jpg"></div><br>
    So, my suggestion was that future visitors of the museum should wear <em>Plantoffels</em>™. ‘Pantoffel’ is the Dutch word for indoor slipper and the brand name <em>Plantoffels</em>™ ﬁnds its origin in the surname and name of Chris<strong>toffel</strong> <strong>Plan</strong>tin. I can imagine though that also outside the museum there will be a lot of interest in <em>Plantoffels</em>™, so these will become available online shortly (exclusively from DTL, of course). The shoe sizes will be deﬁned in several mutually incomparable systems, as in the best typographic tradition.<br>
    &nbsp;<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Plantoffels_2_5855.jpg"></div><br>
    FEB<p></p>
