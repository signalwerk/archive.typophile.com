      <p>It’s called Borealis and is a custom design by Grandpeople...</p>
      <p>A FONT NAMED BOREALIS<br>
      “What’s the font in the festival magazine and on your posters called? I’ve never seen it before”. The question we’ve had to answer several times the last weeks and the answer is rather simple: The font is called “Borealis” and is designed for the festival by the eminent designers in the local design collective Grandpeople. More about Grandpeople at <a href="http://www.grandpeople.org/" title="http://www.grandpeople.org/">http://www.grandpeople.org/</a>.</p>
      <p><a href="http://www.typophile.com/node/37782" title="http://www.typophile.com/node/37782">http://www.typophile.com/node/37782</a></p>
