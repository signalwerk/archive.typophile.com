    html: <p>Hello Per <br> <br>Beyond the details (as you said) i think the main problem is the size of the title comparing to the whole image.  <br> <br>I suggest that you may not keep the real analogies and exaggerate with the size of dress. Making bigger the dress will make the title clearer, it will add motion in the design and also exaggeration fits well with the mediterranean concept. <br> <br>Hope i was helpfull.  <br> <br>christos</p>
