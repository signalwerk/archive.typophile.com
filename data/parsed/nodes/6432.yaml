  html: <p>This is a first rough attemt to form the logotype for "Compania Danza Flamenca", an neaerly newstarted flamencodancing-crew with base in Stockholm. <br> <br> If we skip the details in both the illustrative part and the roughly sketched typeface for a while, I want some comments on the composition i general, and some feedback about the fact that I let the text be involved in her dress like that. <br> <br><img src="http://www.typophile.com/forums/messages/29/47822.jpg" alt="Compania Danza Flamenca-logo"></p>
