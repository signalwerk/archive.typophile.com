    html: <p>You have a great concept, Per. It just needs more work. I would concentrate on simplifying the illustration and then work in the type. It need not be spelled out completely in the dress. One can't determine that without exploring lots of possibilities. I like it even if you do no more than this. <br> <br>PG <br> <br><a href="http://giam.typepad.com/the_branding_of_polaroid_/" target="_blank">http://giam.typepad.com/the_branding_of_polaroid_/</a></p>
