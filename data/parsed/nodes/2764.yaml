    html: "<p>Regarding Romanian: <br> <br>There is a fiddle with Romanian diacritics. Earlier versions of Unicode unified the Romanian S/s with 'comma' accent below to the Turkish S/s with cedilla (U+015E/U+015F). Later, Unicode disunified these, and separately encoded the S/s with 'comma' accent (U+0218/U+0219). However, the old Windows 8-bit codepage 1255 that covers Romanian, uses the older Unicode encoding. This means that in such fonts you should use the S/s with 'comma' accent glyph in the S/s with cedilla codepoints. <br> <br>If you are making a multilingual OT font that needs to support both Turkish and Romanian, and also provide backwards compatibility support with the old 8-bit codepage, you need to include a Localised Forms &lt;locl&gt; OT layout feature for the Romanian &lt;rom&gt; language system tag that maps the S/s with cedilla glyphs to the S/s with 'comma' accent glyphs. Note that this substitution is not supported in currently shipping apps, but will be supported in future versions of Windows, so it is a good idea to get it in your fonts now. <br> <br>Unicode also previously unified T/t with 'comma' accent and T/t with cedilla (U+0162/U+0163), but later disunified these and separately encoded T/e with 'comma' accent (U+021A/U+021B). However, I have yet to locate a single language that actually uses T/t with cedilla, so the best thing to do is to include only glyphs for T/t with 'comma' accent, and <i>double encode</i> them to both the T/t with 'comma' accent codepoints and the T/t with cedilla codepoints (the latter are used in the old 8-bit codepage). <br> <br>Hope all this makes sense <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
    html_clean: "<p>Regarding Romanian: <br> <br>There is a fiddle with Romanian diacritics. Earlier versions of Unicode unified the Romanian S/s with 'comma' accent below to the Turkish S/s with cedilla (U+015E/U+015F). Later, Unicode disunified these, and separately encoded the S/s with 'comma' accent (U+0218/U+0219). However, the old Windows 8-bit codepage 1255 that covers Romanian, uses the older Unicode encoding. This means that in such fonts you should use the S/s with 'comma' accent glyph in the S/s with cedilla codepoints. <br> <br>If you are making a multilingual OT font that needs to support both Turkish and Romanian, and also provide backwards compatibility support with the old 8-bit codepage, you need to include a Localised Forms &lt;locl&gt; OT layout feature for the Romanian &lt;rom&gt; language system tag that maps the S/s with cedilla glyphs to the S/s with 'comma' accent glyphs. Note that this substitution is not supported in currently shipping apps, but will be supported in future versions of Windows, so it is a good idea to get it in your fonts now. <br> <br>Unicode also previously unified T/t with 'comma' accent and T/t with cedilla (U+0162/U+0163), but later disunified these and separately encoded T/e with 'comma' accent (U+021A/U+021B). However, I have yet to locate a single language that actually uses T/t with cedilla, so the best thing to do is to include only glyphs for T/t with 'comma' accent, and <i>double encode</i> them to both the T/t with 'comma' accent codepoints and the T/t with cedilla codepoints (the latter are used in the old 8-bit codepage). <br> <br>Hope all this makes sense <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
