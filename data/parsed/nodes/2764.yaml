    html: |-
      <p>You would use the 'ccmp' feature for this kind of substitution (but note that the combining acute should follow the base letter).</p>
      <p>Alternatively, you could use GPOS mark positioning, which would be much more flexible. In this case, you would need to have a dotless j glyph in the font and use a 'calt' feature lookup to substitute this for the regular j whenever the letter is followed by a combining mark glyphs.</p>
