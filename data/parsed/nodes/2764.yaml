    html: "<p>Hrant writes: \"I've read this about Dutch too. What other languages have this wonderful feature?\"  <br> <br>In grammar books (for foreigners) and in dictionaries for Russian, acute over vowels is used to indicate syllable stress (so-called \"oodarenye\"). In Russian, the syllable stress is quite arbitrary. For example, when a verb is declinated, the stress can move from the first syllable in singular forms to last syllable in plural forms etc. The stress is very prominently pronounced: for example, an unstressed \"o\" sounds almost like a short \"a\" (something like shwa), while stressed \"o\" is a very round and clear \"o\". Therefore, one needs to learn the proper stress for each word. When I was in school, we usually read Russian texts from textbooks where the stress was marked. Later, when we switched to reading unmarked normal texts (in newspapers etc.) it turned out to be a very difficult task <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>For comparison: in Polish, the syllable stress is almost exclusively at second-last syllable. There are relativerly few words, many of them of foreign origin, which have a different stress (e.g. third-last syllable), and many people still put it the stress to second-last syllable in these words.  <br> <br>This may be the reason why spoken Russian sounds quite lively while spoken Polish sounds rather dull (an opinion that I actally agree with <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Adam</p>"
