    html: <p>/aringacute/ is a Danish letter (along with the equally obscure with /aeacute/ and /oslashacute/). It is not often found in modern texts, other than dictionaries and grammars, because it was not available in the standard 8-bit character sets intended for Danish and many people got out of the habit of marking stress in Danish. Any Danish vowel can be marked as stressed, hence the need for these characters. <br> <br>I'm afraid I'm somewhat to blame for the Adobe Pro set not containing this character. Adobe asked me about the /aringacute/ when they were defining their set, and I told them that it wasn't used anymore except in dictionaries and grammars. Since the height of the uppercase form causes vertical metric problems, they decided not to include it, although my advice is now that it should be included because it is still an official character in the Danish orthography. Also, I didn't really realise that Adobe were asking only about the /aringacute/ and not about the other Danish diacritics /aeacute/ and /oslashacute/, so the Adobe Pro set contains the latter but not the /aringacutre/.</p>
    html_clean: <p>/aringacute/ is a Danish letter (along with the equally obscure with /aeacute/ and /oslashacute/). It is not often found in modern texts, other than dictionaries and grammars, because it was not available in the standard 8-bit character sets intended for Danish and many people got out of the habit of marking stress in Danish. Any Danish vowel can be marked as stressed, hence the need for these characters. <br> <br>I'm afraid I'm somewhat to blame for the Adobe Pro set not containing this character. Adobe asked me about the /aringacute/ when they were defining their set, and I told them that it wasn't used anymore except in dictionaries and grammars. Since the height of the uppercase form causes vertical metric problems, they decided not to include it, although my advice is now that it should be included because it is still an official character in the Danish orthography. Also, I didn't really realise that Adobe were asking only about the /aringacute/ and not about the other Danish diacritics /aeacute/ and /oslashacute/, so the Adobe Pro set contains the latter but not the /aringacutre/.</p>
