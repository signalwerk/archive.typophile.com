    html: |-
      <p>It should be noted that ‘Eastern European’ is a misnomer, since most of the languages that we’re discussing are properly considered Central European. Also, Microsoft have separate codepages for ‘Eastern European’ (<span class="caps">CP</span> 1250) and ‘Baltic’ (<span class="caps">CP</span> 1257), while Apple combines support for the Baltic languages with Central European languages in a single ‘MacOS CentralEurope’ codepage. Conversely, Windows <span class="caps">CP</span> 1250 supports Romanian and Croatian, while Apple has separate codepage for each of these.  <br><br>There is a small number of characters for Central, Baltic or South European languages that are not included in the Unicode Latin Extended A block. Here is a zip ﬁle that contains a FontLab .enc ﬁle that covers all the major languages of Europe, and most minority languages*, that use the Latin script. The zip also contains a .map ﬁle that maps from <span class="caps">AGL1</span>.0 and uniXXXX form names to correct Unicode characters; this can be used with the FontLab ‘Assign Unicode’ function. The .enc ﬁle should be placed in your FontLab\Encoding folder; the .map ﬁle should be placed in your Fontlab\Mapping folder. <br><br></p>
      <!--attachment: EuroLatinEnc_Map-33741.zip*mime_zip.gif*application/x-zip-compressed*177.9*Tiro+Euro+Latin+Basic+%2eenc+and+%2emap*EuroLatinEnc%26%2343%3bMap%2ezip --><p></p><center><br><table border="1"><tbody><tr><td><img src="https://web.archive.org/web/20190805110120im_/http://www.typophile.com/forums/icons/mime_zip.gif" align="left" alt="application/x-zip-compressed">Tiro Euro Latin Basic .enc and .map<br><a href="https://web.archive.org/web/20190805110120/http://www.typophile.com/forums/messages/4101/EuroLatinEnc_Map-33741.zip" target="_blank"><b>EuroLatinEnc+Map.zip</b></a> (177.9 k)</td>
      </tr></tbody></table><p></p></center>
      <!--/attachment--><p> <br><br>Note that the .enc ﬁle is what we internally consider ‘Basic’, i.e. it does not contain smallcaps and glyphs for some other extended typographic features, but it does contain glyphs for case-sensitive punctuation, e.g. /hyphen.cap/ for use with the OpenType &lt;case&gt; feature. These can easily be removed from the .enc in a text editor, or simply ignored if not desired. Note also that this set contains support for some obsolete characters that are found in the Microsoft <span class="caps">WGL4</span> set, e.g. /kgreenlandic/, which are included only for compatibility reasons. <br><br>* I can’t claim total support for all European minority languages using the Latin script, because there are some about which I do not have adequate information, and others are in a state of orthographic&nbsp;uncertainty.</p>
