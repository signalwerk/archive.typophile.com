    html: <p>FontLab 4.5 does not have 'fixed' codepages. Codepages are standards defined by national, or international standards bodies or by corporations. Windows CP 1250, for example, is defined by Microsoft, and they have not updated it to map the new Unicode character codes, since they don't like changing their codepages because of backwards compatibility issues. Since Microsoft's operating system in now 100% Unicode, they are less concerned altogether with 8-bit codepages, and support them only as compatibility formats (e.g. if you open a Cp 1250 encoded document in Word on Windows 2000+, it will be saved as a Unicode encoded document).</p>
