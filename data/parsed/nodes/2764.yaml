    html: <p>FontLab 4.5 does not have ‘ﬁxed’ codepages. Codepages are standards deﬁned by national, or international standards bodies or by corporations. Windows <span class="caps">CP</span> 1250, for example, is deﬁned by Microsoft, and they have not updated it to map the new Unicode character codes, since they don’t like changing their codepages because of backwards compatibility issues. Since Microsoft’s operating system in now 100% Unicode, they are less concerned altogether with 8-bit codepages, and support them only as compatibility formats (e.g. if you open a Cp 1250 encoded document in Word on Windows 2000+, it will be saved as a Unicode encoded&nbsp;document).</p>
    html_clean: <p>FontLab 4.5 does not have ‘ﬁxed’ codepages. Codepages are standards deﬁned by national, or international standards bodies or by corporations. Windows <span class="caps">CP</span> 1250, for example, is deﬁned by Microsoft, and they have not updated it to map the new Unicode character codes, since they don’t like changing their codepages because of backwards compatibility issues. Since Microsoft’s operating system in now 100% Unicode, they are less concerned altogether with 8-bit codepages, and support them only as compatibility formats (e.g. if you open a Cp 1250 encoded document in Word on Windows 2000+, it will be saved as a Unicode encoded&nbsp;document).</p>
