    html: <p>The most valuable tool for combatting unruly fonties is Font Doctor. You can pick the bitmap size you wish to keep in the suitcase too.</p>
    html_clean: <p>The most valuable tool for combatting unruly fonties is Font Doctor. You can pick the bitmap size you wish to keep in the suitcase too.</p>
  - id: 140830
    user: 103
    date: 2004-02-25T10:41:00
    date_raw: 25.Feb.2004 10.41am
    votes: null
    html: "<p>The official reply from Peter Lofting at Apple: <br> <br>There are no built-in supports in OSX at present, i.e. nothing  <br>equivalent to the double-click on a font suitcase that exists in OS9. <br> <br>However most classic font tools will run in Classic emulation  <br>mode. e.g. you can run ResEdit and delete the NFNTs with that.</p>"
    html_clean: "<p>The official reply from Peter Lofting at Apple: <br> <br>There are no built-in supports in OSX at present, i.e. nothing  <br>equivalent to the double-click on a font suitcase that exists in OS9. <br> <br>However most classic font tools will run in Classic emulation  <br>mode. e.g. you can run ResEdit and delete the NFNTs with that.</p>"
