    <p>hello everybody.<br>
    i am in a middle of working on identity to a magazine and need your opinions to a font i am trying to create. it is a first draft of the font. i know it is in hebrew, and most of you dont read it, but i still hope i can learn from your comments. it is my first intent to make a complete alphabet.<br>
