    html: <p>Are you saying that there shouldn't be Hebrew font designs that are made of angles? Then should there be no Russian fonts that have curves in them, or no Chinese fonts without stroke contrast? You can make any sort of design for any sort of language, as long as it's readable. I think this is quite good; I like the round-cornered counters inside square shapes. However, other than to respond to Prakash Nair's post, I'm not really going to be able to offer you anything. (Sorry to get your hopes up for a good critique)</p>
