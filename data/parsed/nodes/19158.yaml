      <p>dear david<br>
      thanks for the comment, and for the questiones:<br>
      1. it is a quote from somebody that gave me inspiration to that font (personal joke) i hope you were not ofended.<br>
      2.whats going on with that is that i decided that i want two headlines font runing and not one.<br>
      3. i think miriam is a grate font (and old doesn't mean that it's no good). this version of miriam (renewed by michal sahar) althogh heaving problems is a grate text font.</p>
      <p>i think that those decisiones of typography are helping giving the magazine more charactar (though i know we had some problems with that, but i think those problems can be fixed while the magazine will grow a little bit and adjust itself.<br>
      dani</p>
