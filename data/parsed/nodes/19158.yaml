    html: |-
      <p>deshvil,</p>
      <p>My main critique is that while the majority of letters are quite<br>
      conventional, there are a few that are bizarre (peh, quf &amp; lamed).<br>
      I don't think that you can create a style by changing a few letters.</p>
      <p>The features that create the style should be applied to the<br>
      majority of the letters.<br>
      This is rough critism for sure because it goes down to basics but<br>
      I don't want to discourage you.</p>
      <p>Much depends of the subject of the magazine. What kind of "atitude"<br>
      will the magazine have?<br>
      (Back in the sixties, many trendy magazines were almost impossible<br>
      to read because of the desire of the font designer to be different)<br>
      Keep at it!</p>
      <p>Mike<br>
      cunliffethompson.com/font</p>
