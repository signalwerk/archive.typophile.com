      <p>I thought about this topic for a little while after it went by so quickly with only one suggested response. There may have been other threads in Typophile that brought this up, and I didn't want to start a new topic, but I wanted to pay a little homage to the lettering artists of pop culture.</p>
      <p>Having spent many, many hours early in my career hand lettering headlines, and using lettering devices (Varigraph Headwriter, Leroy Pantograph) to create ads, I've always admired lettering artists who had such a facility and love for the craft. Many never created a "typeface" nor had to, since their task was focused on specific context, while type designers generally look towards broader context usage.</p>
      <p>Without getting to deep into explanation, here are several links from the ridiculous to the sublime: (note -- each link opens in it's own new window, so don't forget to close them)</p>
      <p><a href="http://www.supermanartists.comics.org/batman/Sprang.htm" target="new" rel="nofollow">Dick Sprang's Batman "WHAM"</a> 1944 (bottom right frame of strip)</p>
      <p><a href="http://www.comics.org/graphics/covers/541/400/541_4_004.jpg" target="new" rel="nofollow">Bud Sagendorf's Popeye "SPLAT"</a></p>
      <p>Opening film title for <a href="http://flashgordon.ws/trip_to_mars.htm" target="new" rel="nofollow">Flash Gordon</a> plus early posters</p>
      <p><a href="http://www.olsenart.com/bg029.html" target="new" rel="nofollow">Wes Wilson Filmore poster 1966</a> "Far out, man!"</p>
      <p><a href="http://www.photo-lettering.com" target="new" rel="nofollow">Photo-lettering, Inc.</a> collage of early sample books<br>
      <a href="http://www.myfonts.com/foundry/photolettering/" target="new" rel="nofollow">and a few lettering artists that became legends</a></p>
      <p><a href="http://www.balloontales.com/articles/index.html" target="new" rel="nofollow">Balloon Tales articles on current comic lettering field</a></p>
      <p><a href="http://www.typedesign.com/logos/esqu.html" target="new" rel="nofollow">Jim Parkinson</a>, lettering artist, logo designer and type designer extraodinaire</p>
      <p>The sublime work of <a href="http://www.grupoerre-rousselot.com" target="new" rel="nofollow">Ricardo Rousselot</a></p>
      <p>-------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
