    <p>I'm sure that the creators of the original Batman series did a lot of customization on their art cards for the fight scenes.  Any idea on which font they might have used as a starting point for those art cards whenever Batman would fight someone?   BIFF, BOOM!!!</p>
    <p>Here's an image I found to look at in case you haven't seen the show in 40 years.</p>
    <p><a href="http://www.tvacres.com/images/batman_kapow.jpg" rel="nofollow">Tv Acres</a></p>
    <p>joey</p>
