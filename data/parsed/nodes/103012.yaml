      <p>I found this /S/ only in <strong>Aurora Script</strong> by Ivan Zeifert &amp; Alexandra Gophmann (2005) but I'm not at all sure this is an original work.</p>
      <p>Take a look at what Luc Devroy says about Alexandra Gophmann:</p>
      <blockquote><p>Russian designer of typefaces who collaborates with Ivan Zeifert and specializes in revivals, cyrillizations and beautiful digitizations, some of them done with Anatole Gophmann. There have been complaints about her practice of borrowing fonts from type designers without asking. One typophile writes: I have cracked open fonts she claims as hers, Bolero, Bickham and others, she has copied and pasted glyphs, copyright data, added Cyrillic and changed the copyright string.</p></blockquote>
      <p>More info: <a class="freelinking external" href="http://luc.devroye.org/fonts-43962.html" rel="nofollow">http://luc.devroye.org/fonts-43962.html</a></p>
      <p>If you need to license the font for a project, I recommend to be extra careful and try to find if this is a rip-off of another commercial font before using it.</p>
      <p>------------------<br>
      I found it using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
