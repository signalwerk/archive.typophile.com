    <p>Designers:</p>
    <p>The 'Bringhurst' offers four examples of modular scales, including the Whole and Half Pica modulars used be Le Corbusier and a Medieval Interval Scale.</p>
    <p>The first is easy to understand.  The second and third are baffling.  My question regards the third: how does it work?</p>
    <p>After a certain point, the values on the left side of the stick are doubles of those on the right.  Easy enough.  But even though one of the two ratios (2:3 and 1:2) suggests doubling (1:2), this is not consistent from one side to the next.  Doubling '1' does not yield '4'. The values on the right side of the stick don't seem at a glance to have anything to do with the (2:3) ratio (e.g. 1, 3, 4.5, 7, 10).</p>
    <p>My goal is to understand this so as to be able to construct such scales generally.  Basic mathematical competence, I am sure, is all that is required.</p>
    <p>All help welcome.</p>
    <p>Thanks.</p>
