      <p>I think I've got it.  After a day and a half the verdict seems to be: Bringhurst rounds the values off and, in many cases, arbitrarily.</p>
      <p>I'll show you what I have so far.</p>
      <p>Starting off with the assumption that each side of the stick is distinct and occupied by a single series of numbers, and also assuming that the 1:2 ratio is not responsible for a number line of its own but is rather a function of the starting-point, as in the Half Pica Modular Scale, we start with this series from '1':</p>
      <p>1  1.5  2.25  3.375  5.0625  7.59375  11.39  17.08</p>
      <p>On the right side of the stick what we see though is:</p>
      <p>1 (2)  3  4.5  7  10  15</p>
      <p>There's a line marker where (2) should be on the right side.  It may be safe to assume that (2) is part of the series.</p>
      <p>Well the ratio is 2:3, or re-written, 1:1.5.</p>
      <p>1 X 1.5 = 1.5    1.5 X 1.5 = 2.25    2.25 X 1.5 = 3.375  etc.</p>
      <p>What Bringhurst seems to do is ignore the decimals unless it is an even .5:</p>
      <p>1  1.5  2  3  4.5  6  9</p>
      <p>This breaks down at 13.5 which is not on the stick.  '14' however is.  Also, 1.5 is on the left side here, something we didn't want.</p>
      <p>If you look at Bringhurst's values on the right side by themselves:</p>
      <p>1  2  3  4.5  7  10  15  22.5</p>
      <p>Each is more or less separated by a multiplier of 1.5:</p>
      <p>1 X 1.5 = 1.5 (2).  2 X 1.5 = 3.  3 X 1.5 = 4.5  4.5 X 1.555 = 7  7 X 1.4285 = 10</p>
      <p>On the left side:</p>
      <p>1.5 X 1.5 = 2.25 (above the 2 on the stick)  2.25 X 1.5 = 3.75 (4);  4 X 1.5 = 6  6 X 1.5 = 9  9 X 1.5 = 13.5 (14)  13.5 X 1.5 = 20.25 (20)  20 X 1.5 = 30</p>
      <p>What all these numbers designate is a rounding off of the values whenever it seems fitting to balance the 2:3 and 1:2 ratios.  In the line just above where 9 X 1.5 = 13.5 is shown, notice how 14 is used on the stick since it's a double of 7, but 13.5 is used in the next calculation, since 20 is a double of 10.</p>
      <p>It looks like these modular sticks are all likely approximations only as good as the starting ratios and the finesse with which you preserve those ratios in rounding off.</p>
