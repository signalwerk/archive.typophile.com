      <p>This is a tricky question. Volume One of B.S. Naik's <em>Typography of Devanagari</em> has a few pages of specimen of old metal Devanagari faces, but this is probably not what you are looking for. I am guessing that you want digital fonts. I am not aware of a published book that can help you. There are a few PDFs from University of Reading graduates that could help you out (including my own) but these aren't published anywhere yet.</p>
      <p>Indic font foundries have PDF catalogs that you can download. Here is one listing C-DAC's Devanagari typefaces – <a href="http://www.cdac.in/html/gist/down/type/Devanagari.pdf" title="http://www.cdac.in/html/gist/down/type/Devanagari.pdf">http://www.cdac.in/html/gist/down/type/Devanagari.pdf</a></p>
      <p>(More on this page… <a href="http://www.cdac.in/html/gist/down/typeface.asp" title="http://www.cdac.in/html/gist/down/typeface.asp">http://www.cdac.in/html/gist/down/typeface.asp</a>)</p>
      <p>Then there is Modular Infotech. <a href="http://www.modular-infotech.com/downloads/fonts/Devratna.pdf" title="http://www.modular-infotech.com/downloads/fonts/Devratna.pdf">http://www.modular-infotech.com/downloads/fonts/Devratna.pdf</a></p>
      <p>(More on them here… <a href="http://www.modular-infotech.com/html/fonts.html" title="http://www.modular-infotech.com/html/fonts.html">http://www.modular-infotech.com/html/fonts.html</a>)</p>
      <p>Lastly, they haven't published any books yet, but I hope that they will – <a href="http://www.indiantypefoundry.com/site/index.php" title="http://www.indiantypefoundry.com/site/index.php">http://www.indiantypefoundry.com/site/index.php</a></p>
