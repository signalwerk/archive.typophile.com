    html: |-
      <p>I guess my ’scene’ is somewhere in the middle of serious and rave. Maybe art gallery? The application is ’proposal project’ on signage and environmental design, Rem Koolhaus / Bruce Mau style mockups; I’ve got a good stable of classic and sophisticated sans and serifs, and am looking for something with a bit more contemporary relevance and energy to complement. Reason: the ’client’ is an organization that is founded on the bleeding edge of technological and academic advance. Hopefully that gives a bit more context. </p>
      <p>Cheers.<br>
      -Ryan</p>
