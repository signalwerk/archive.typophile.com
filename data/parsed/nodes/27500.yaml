    <p>I’m sort of new on the scene, and so I’m wanting to get up to speed on where the good contemporary fonts are coming from. There are enough books written about the past that I think I’m covered there.</p>
    <p>So ... it’s probably a matter of opinion, but is anyone willing to voice their opinion on, let’s say, their top 5? </p>
    <p>It’d be a huge help.</p>
