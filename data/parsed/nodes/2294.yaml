    date_raw: 5 Aug 2005 — 12:24pm
    votes: null
    html: |-
      <p>This got me wondering how most other well known logos have been chosen. How do they get the nod of approval from the typical target audience of design unsavy higher-ups (usually CEOs, partners and probably their family members)? How did logos like Lucent, NASA (worm), bp, etc. make the committee say "aha!"? </p>
      <p>I think was just circumstance that Nancy was employed at the time that VH1 was taking submissions for a new logo, the same time other firms were submitting. And the comets aligned and that select group of decision makers selected Nancy's because it hit a vein with most of them; not necessarily everyone in the world, but the only decisions that mattered were that of the committees. Which is also the reason why we have logo's like Verizon, UPS, Gateway... no one knows the reasons except for the people that decided. </p>
      <p>Personally I like the logo for reasons only my gut knows. I like it for the abstract symbol that it is, I like the vibrant colors, I like that it doesn't scream out "We're a music channel!" Overall, I like the new brand of VH1 in general. If I were on that committee, I can imagine the amount generic, corporate, overly-thought out, expertly crafted, letterspaced submissions and seeing Nancy's and feel a bit of freshness because of it's purely "I put these elements together because it instinctively felt right".</p>
    html_clean: |-
      <p>This got me wondering how most other well known logos have been chosen. How do they get the nod of approval from the typical target audience of design unsavy higher-ups (usually CEOs, partners and probably their family members)? How did logos like Lucent, NASA (worm), bp, etc. make the committee say "aha!"? </p>
      <p>I think was just circumstance that Nancy was employed at the time that VH1 was taking submissions for a new logo, the same time other firms were submitting. And the comets aligned and that select group of decision makers selected Nancy's because it hit a vein with most of them; not necessarily everyone in the world, but the only decisions that mattered were that of the committees. Which is also the reason why we have logo's like Verizon, UPS, Gateway... no one knows the reasons except for the people that decided. </p>
      <p>Personally I like the logo for reasons only my gut knows. I like it for the abstract symbol that it is, I like the vibrant colors, I like that it doesn't scream out "We're a music channel!" Overall, I like the new brand of VH1 in general. If I were on that committee, I can imagine the amount generic, corporate, overly-thought out, expertly crafted, letterspaced submissions and seeing Nancy's and feel a bit of freshness because of it's purely "I put these elements together because it instinctively felt right".</p>
