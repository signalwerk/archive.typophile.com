    html: <p>Okay, let me phrase it differently, and with a lot more words. "VH1" originally stood for "Video Hits 1," but nobody remembers that. The old logo emphasized the "1," which ties into the slogan "Music First" -- probably an attempt to differentiate VH1 from sister station MTV, who were showing fewer videos and more non-music programming. The new logo emphasizes the Vh, with the backwards 1 disappearing into the h. Maybe there's something obvious I'm missing (wouldn't be the first time), but what does this new logo represent?</p>
