    html: <p>This topic has come up on other boards. Forgive me if I repeat what I've said elsewhere.) <br> <br>Why hang on to the old logo? Sure, nothing was wrong with it, but nothing was great about it either. It was stagnant, symmetrical and vanilla. That's why I appreciate their need to move on. <br> <br>I'm not sure what to think of the new logo. The leaf, the hacked h and flipped 1 feel fresh. But overall it seems kind of slapped together. The stroke weights of the V h and 1 don't fit and Helvetica just seems tired here... <br> <br>But the net takeaway is a needed change in that it lets the  VH1 mark grow up. <br> <br>The broadcast work is rock solid. The whole play on pop culture is fun and the original scoring is great. Finally, to beat the MTV comparison to death -- you can tell they're not deifying the logo like MTV did. See the VH1 reel at <a href="http://www.weworkforthem.com" target="_blank">WeWorkForThem</a>. <br> <br>(WWFT did not design the logo. It was done in-house at VH1 by Nancy Mazzei.)</p>
