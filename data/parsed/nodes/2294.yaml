    html: <p>Well, now I've read the designer's explanation, such as it is, in the Speak Up thread. So, it's just... deliberately nonsensical, meant to look "unfinished" by doing a number of meaningless and unattractive things. <br> <br><b>I</b> wanted to give them more credit than <b>that.</b> I saw how the shapes in "h1" were smooshed together to make a sort of T, and how the V extended off the side of the block, and said to myself, "At least someone was trying to do something even if they may have failed. I can respect that." <br> <br>Instead it's the free verse philosophy. "There's no right or wrong way to do anything, so if I create something at random and you think it's ugly, that's a fault in you, not it." Bleah.</p>
