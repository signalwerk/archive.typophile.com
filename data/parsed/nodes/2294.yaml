  - id: 18364
    user: 2731
    date: 2003-12-05T07:27:00
    date_raw: 5 Dec 2003 — 7:27am
    votes: null
    html: <p>I have no problem with non-representational logos, and perhaps if the VH1 logo were just the type treatment I wou'dve bought that argument. My issue is it looks like it's trying to symbolize something, but is really meaningless. Why a box? Why a leaf? Why is the type crammed onto one side with a big empty panel to the right? The designer's explanation can be summed up as "why not?"  <br> <br>Sure, music and pop-culture industry logotypes have to change with the times, but to build something clunky and not worry about it because it's just going to get changed again anyway seems pretty lazy to me, and would tend to reinforce the notion that VH1 stands for nothing and will more than likely change directions when the next trend rolls along. Maybe that's the truth, but it's hardly the thing you want to emphasize in your corporate identity.</p>
