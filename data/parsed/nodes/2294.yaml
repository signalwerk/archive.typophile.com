    html: <p>There is alot of graphic design being done now that isn't interested in craft - just effect.  <br> <br>The thing is I don't think it is wrong per se. If it works it works. I don't 'like' the vh1 logo but it is interesting &amp; flexible &amp; a bit irritating which makes me look at it- perfect for them.  <br> <br>Another thing is that creating a classic logo that will stand the test of time may not be needed by every client or suit their purposes in fact. VH1 could be gone in 2 years - probably not - but you never know. So why make something classic &amp; sturdy when a something flimsy &amp; fun will do? </p>
