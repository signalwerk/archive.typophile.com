    date_raw: 4 Dec 2003 — 11:28am
    votes: null
    html: "<p>What difference does it make if it's a V folding on itself or a leaf or just an abstract organic shape? Should a logo always be a literal representation? I don't think so. I'm not necessarily going to defend this logo to the death, but I don't think it should be dismissed because we don't immediately get it. <br> <br>And Kevin, you don't really think they have MTV envy do you? I can't imagine them sitting in a conference room saying, \"what can we do to evoke the MTV logo?\" At least I want to give them more credit than that. <br> <br>That said, I think the execution is lacking. (As I've said before in this thread.) <br> <br>Mike, your original logo may have worked well at the time, just like the second logo worked for them through the last decade. I see this third logo as simply more of the same. Not stylistically the same but it's an adequate logo that will serve them well for a time but need to be replaced or evolved sooner than later. <br> <br>Couldn't we argue that identities for these kind of ephemeral brands (fashion, music, extreme sports, etc.) need to change more often to stay relevant or interesting? (Food thought, not necessarily words to design by.) <br> <br>I think this is why this particular logo redesign is interesting. Because it's not for an airline or a telecom or something that needs to convey stability, longevity, timelessness, etc. It almost demands to be redone regularly. <br> <br>Re: Speak Up <br>True, Grant. That's where you can see my earlier comments in context. As much as I like some of the dialogue at Speak Up, the acidic tones (attitude) over there are hard to take in large doses.</p>"
