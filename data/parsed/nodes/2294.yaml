    date: 2005-02-20T01:22:00
    date_raw: 20 Feb 2005 — 1:22am
    votes: null
    html: <p>Sorry, but I still don't like it. While the old one had a boldness, claiming to be the No. 1 music channel even though it was perceived as MTV's li'l sister, this new logo just isn't memorable, isn't modern, isn't unique and, worse, doesn't tell me anything at all about the channel. The same holds true for the original MTV-logo, sure, but that at least has the power of nostalgia and a certain (s)punky flair that I dig. The redesign for VH1 cold just as well be for some health-care organisation or some wellness product. Frankly, I'd rather have seen VH-1 all done in Helvetica and be done with it :-D.  <br>Nancy, great to see you defend your work and if it really was picked from 25 designs, all the more power to you and your work. But, alas... a pitch with TWENTYFIVE new logos, in my opinion, is a grave mistake in itself. I'm completely against pitches these days, and maybe that is the problem with the logo.</p>
