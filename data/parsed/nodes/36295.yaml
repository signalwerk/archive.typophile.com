      <p>I agree with Ken, don't alter the S, unless it is breathtakingly cool/beautiful/informative/creative. Which it is not.</p>
      <p>The reason for this: you are a designer. Either you have a design that is non-design ("I don't waste my time doing my own logo, because I save my creativity for my clients") ... or you make something that will make everyone drop dead with envy.</p>
      <p>Check out the identity of the top ten design firms of the world ...</p>
