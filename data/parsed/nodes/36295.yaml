      <p>The type weights you are using do not feel like they are harmonizing together. I feel like the word DESIGN is eventually going to give out to the massive weight of SUGO. Maybe the word SUGO can come down in type size, while keeping it bold. </p>
      <p>Plus the letter spacing feels really tight. Words in all upper caps always need a little extra space between them. </p>
      <p>Hope that helps.</p>
      <p>-Joe</p>
