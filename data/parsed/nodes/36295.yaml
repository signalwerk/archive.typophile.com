    date_raw: 22 Aug 2007 — 3:43am
    date: 2007-08-22T03:43:00
    votes: null
    html: <p>Hi Sugo - I think the 'S' should be the same too. Nice considered choice of typeface - v good. I don't know if you saw my post earlier but we are also updating our logo (Profile1). We are stuck between using pure Avant Garde or modifying it with one or two tweaks. I change my mind between the two at least three times every fifteen minutes! I have always loved Avant Garde - the KING of the geometric sans. I think you have to be extremely careful when you are tweaking such a fine piece of work. The amount of consideration and time that has gone into our tweaked version is huge - but i'm still not sure it's even close to looking as good as the original set type. It so easy to do toooooo much.</p>
