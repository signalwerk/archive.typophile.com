    html: <p>Thanks for everyone's comments.  I will be using all the advice and see what I come up with.  November I understand what you're saying.  But I don't think a firm like Pentagram "just" chose anything.  I believe everything was thought out, tracked out and chosen to perfection.  My "twist" had a concept behind it in the beginning.  But by overworking it, I have strayed and lost it. Let's see what I get in round 2 (more like 12 :)</p>
