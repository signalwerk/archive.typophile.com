    html: |-
      <p>You need multiple tools to test fonts. Unfortunately, you also need to develop a lot of expertise in reading the output, as each of the font testing tools has been developed to meet the needs of the particular company that made it.</p>
      <p>The Adobe CompareFamily tool from the AFDKO is indispensable, and one of very few tools that checks how various metadata is coordinated across a family, as well as performing a variety of single-font level tests.</p>
      <p>Microsoft's Font Validator can be useful, especially for TTF.</p>
      <p>Coming up with some way to run fonts against the Windows version of the OpenType Sanitizer used by WebKit is handy, if you are going to release web font versions of your fonts. We had to do a bunch of work to wire it up, though.</p>
