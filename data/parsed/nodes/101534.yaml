  html: |-
    <p>One of the hardest parts of font production for me has always been testing and quality assurance. So I am trying to establish a formal process that will at least cover all the major bases. I know I want to check outlines, integrity of the font file tables, metrics and kerning, and OpenType feature functionality.</p>
    <p>I am curious what others do -- strategies, processes, tools, etc. Anyone willing to share?</p>
    <p>Thanks!</p>
    <p>-t.</p>
