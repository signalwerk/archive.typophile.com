    <p>Anyone inspired by Typecon2007 to start a new typeface? There was so much on display to take in and enjoy.</p>
    <p>Perhaps after seeing the Veer presentation, you are inspired to do a massive display script project ALA <a href="/web/20081007160643/http://www.typophile.com/wiki/Alejandro%252BPaul" class="wiki">Alejandro Paul</a>? Or was it the next gen text faces coming out of Mexico that really rocked your boat?</p>
    <p>I do know one thing, for some reason I don’t think I’m too interested in doing a “grunge” typeface anytime soon...</p>
    <p>After speaking with <a href="/web/20081007160643/http://www.typophile.com/wiki/Eben%252BSorkin" class="wiki">Eben Sorkin</a>, <a href="/web/20081007160643/http://www.typophile.com/wiki/Nick%252BShinn" class="wiki">Nick Shinn</a>, <a href="/web/20081007160643/http://www.typophile.com/wiki/Kent%252BLew" class="wiki-create">Kent Lew</a> and others, I finally decided to sit down last night to start fleshing out the drawings I’ve had about an upright semi-italic text face I’ve been doodling about for the past two years.</p>
    <p>What’s your inspiration and/or new project?</p>
