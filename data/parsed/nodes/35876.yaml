    html: |-
      <p>I combined my love of type and Boeing projects to start on a new slanted, rounded sans face called Skyliner, which I drew a big chunk of on the plane, and I’ve already started building it in TypeTool. I’ve also been inspired to selling my extra iPod (they’re giving them away with laptops again) and my Intuos 3 (I never use it) so I can buy FontLab. And of course talking to everyone—especially Nick and Delve—gave me food for thought regarding my thesis. </p>
      <p>But what was really inspiring was coming back to town and finding out that my awful type professor quit and been replaced by one of my favorite professors. I have quite literally been dreaming about that happening, so these events coinciding with Typecon is so awesome that I’m tempted to find religion.</p>
