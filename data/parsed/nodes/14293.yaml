    <p>I'm currently rounding up the design of a custom font I've been working on, called <a href="http://www.characters.nl" rel="nofollow">Siventi</a>. I want to go and set up a licence agreement for the usage of the font. The client wants to have the licence forever, but will not pay that much for it. I will keep all the rights on distributing the font. In the future it might be so that other companies working for Siventi will need to have the font. They will then buy it from me and that money is mine to have. But that is Mickey Mouse-money, really.</p>
    <p>Since I've never did this before or licenced a font myself, I would like to ask if there is anyone willing to share a licence agreement with me. Since this is a custom licence I guess the standard EULA is not enough.<br>
    I don't know if this is something you wish to keep a secret. I hope not. You would really help me a lot with this.<br>
    I don't need to know anything on pricing, but just want to get the contract in order.</p>
    <p>We can make a trade? I'll give you one of my fonts for free. Just pick any you want... </p>
    <p>Regards,<br>
    ®ené</p>
