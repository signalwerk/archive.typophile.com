      <p><em>This is very basic, but it works...</em></p>
      <p>Agreement made this _____ day of ____, 2005, by __________________("Proprietor") and _____________, a __________ corporation/partnership/sole proprietor. ("Partner").</p>
      <p>In consideration of payment of the sum of __________________, the Proprietor in perpetuity hereby assigns and conveys to Partner all of the rights, title and interest in and to the alphabet artwork described _________________ ("the Font"), and the digital data, trademarks and trade names, if any, relating to that alphabet artwork including, but not limited to, the exclusive right to secure protection for same in whatever manner the law allows, and the right to exclusively exploit the Font and said digital data, trademarks and trade names in any manner whatsoever. </p>
      <p>The Proprietor hereby represents and warrants that the Proprietor is the creator of the Font, its trademarks and trade names, including all rights, free and clear of any liens or security interests whatsoever; that the Font is an original design or original recreation of an existing design created by the Proprietor; and the Proprietor has the full right to enter into this Agreement and to transfer absolute unencumbered title and all rights to the Font.</p>
      <p>Partner shall have the sole and unrestricted right to use the Font in any way it deems suitable, for any purpose whatsoever, and to sell, lease, license or otherwise dispose of them in any manner without requiring the Proprietor's consent and without any additional payment whatsoever.</p>
      <p>The Proprietor agrees that neither he nor his successors in interest will at any time prepare, produce, sell, assign, convey or otherwise dispose of the Font or any font similar to it to any other person or entity.</p>
      <p>This Agreement constitutes the sole understanding between the parties. </p>
      <p>IN WITNESS WHEREOF, this Agreement has been executed by the parties thereto as of the date first written above. </p>
      <p><em>...followed by signatures, titles and date. Hope this helps.</em></p>
