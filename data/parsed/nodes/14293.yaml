      <p>I don't know if you would be at least "safe" by adopting Lino's EULA. That EULA would have to represent in some way, your philosophy of doing business. Only you can decide that.</p>
      <p>Remember that a license or contract is written for three entities, the foundry, the end user and the court (again thank you Frank Martinez). The court being the most important one. In US law, any unclear statements in a contract are the responsibility of the contract writer. So if your license fails to explain clearly what all the terms are, you, the foundry will be the one penalized in any legal decision.</p>
      <p>On a separate matter, I'd like to see you drop the advertising signature from your posts here. But perhaps that is part of your business plan.</p>
