      <p>James, I definitely have not that kinda money to have an attorney draft a proper license for me. I don't even have the paying customers yet that makes it worth while having a good license made.<br>
      I just thought these kind of contracts were 'standard' and most people use them like that. I would also not go to a attorney to have him set up a EULA for me, because they are almost all the same. You can personalise and finetune it, but to have an attorny make it from scratch?</p>
      <p>The trade was just a trigger to see if anyone would react to my question. I've realised that on Typophile everyone is very willing to help out when it comes to the actual technical construction of the fonts. But when it comes to more commercial questions, the willingness to be open and helpfull becomes smaller.<br>
      I can understand that you should be carefull with giving out prices to potential competition, so I don't ask for that. This also depends on the clients demands, speed, quality, service, etc. of the typographer in question.<br>
      But helping eachother to get set up with finding the right foundries, contracts &amp; licenses, copyrights, etc, are for me just as important then to get that particular glyph right. </p>
      <p>I've made a similar experience at the Art Academy where I studied. They teach you everything you want to know about design, but nothing that you need when you want to work outside their ivory walls. Businesswise they didn't teach us anything.<br>
      Me and a friend started even while studying at the academy with our own studio. I can't tell you how many mistakes we made, because we just didn't know. Over 75% of these mistakes were unnccesairy if someone had just helped us out. The studio is now 10 years old and we're doing really well. But it could have been a lot easier.</p>
      <p>Regards,<br>
      ®ené</p>
