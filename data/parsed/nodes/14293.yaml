      <p>I appreciate that you don't have the funds for an attorney to draft your license, but I have to disagree that all licenses are more or less standard. At TypeCon in NY, Frank Martinez (a lawyer specializing in licensing, contracts and IP) made the case that EULAs and any type of font license are really a intergral component of the type makers business plan. I don't think every type make has the same business model, so I don't think every license will be standard.</p>
      <p>At TypeCon NY, Bruno Steinert of Linotype offered anyone who wanted to, the freedon to copy LinoType's EULA, perhaps there is where you should start.</p>
