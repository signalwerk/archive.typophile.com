    <p></p><div class="imageWrap"><img src="http://typophile.com/files/steel-die-to-send_5085.jpg"></div><p></p>
    <p>Engraving is the highest form of printmaking known, some of the shapes in letterforms today originated with the restrictions and idiosyncrasies of engraved lines.  The contemporary font "Burin" is based on engraver's lettering styles.</p>
    <p>But what has become of this noble art, now relegated to museums, art history books and sometimes, wedding invitations.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_5492.1.jpg"></div><p></p>
    <p>This is the story of a 5-year journey in search of an engraving proofing press.  These presses have not been made since before the 1950s.  Once ubiquitous as the many small print shops in any decent-size town, these little presses proofed engraving dies or were used for deep impressions in blind embossing work.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_6659.embossing.jpg"></div><p></p>
    <p>(For the complete story, download the .pdf file attached to this article.) </p>
    <p>In a nutshell, two presses were finally located in New Haven, CT.  Grant funding was secured but between the time the grant was written and the funds were awarded, gas prices had sky-rocketed, making the trucking charges exceed the grants.  Also, by the time we were ready to ship, the original trucker had closed operations in Louisiana, which is where the presses were to go.  The presses were trucked from New Haven to Conway, AR where we went to pick them up in our truck.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_6380.4.jpg"></div><p></p>
    <p>They were delivered on a busted palette which was loaded to the bed of our vehicle.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_4373.6.jpg"></div><p></p>
    <p>Together the presses weigh about 500 pounds.  Individually the components consist of the press containing the "force" which is like a big screw and a cross bar with two heavy metal balls, one on each end.  Through the sadly mangled shrink-wrap, the manufacturer was almost readable.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_4758.5.jpg"></div><p></p>
    <p>It is 400 miles from Conway, AR to where we live in south Louisiana.  The presses were moved from the truck bed to our garage by a 2-ton shop crane.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_4654.7.jpg"></div><p></p>
    <p>Here the presses are assembled, the tall one is 28 inches in height and the cross bar is 34 inches wide.  Each ball is approximately 5 inches diameter.  Most of the presses are steel but the fitting on the top of the force is brass.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_6248.8.jpg"></div><p></p>
    <p><a class="freelinking external" href="http://nancysharoncollinsstationer.wordpress.com/" rel="nofollow">http://nancysharoncollinsstationer.wordpress.com/</a></p>
