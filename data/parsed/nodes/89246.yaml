      <p>In Chicago:</p>
      <p>The MCA bookstore is the best place to go for art and design books. </p>
      <p>The Powell's locations are all pretty great for design/type/booksonbooks.</p>
      <p>There's Prairie Avenue Books, oh wait, they just closed. Crap. Anyway, they were awesome. <a href="http://www.pabook.com/" title="http://www.pabook.com/">http://www.pabook.com/</a> </p>
      <p>That's all I can think of off-hand.</p>
