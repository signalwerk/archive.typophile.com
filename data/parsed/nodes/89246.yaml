      <p>Nothing can replace the late, great Untitled on Prince Street in NYC.  The last I heard of Bevan Davies, its sainted owner, he was trying his hand at farming in Maine.  But St. Marks Books, though not a design bookstore per se, has a great selection.  It's now round the corner from St. Marks Place on Stuyvesant Street, though its mailing address for some reason is 31 3rd Avenue.</p>
      <p>And, though I'll be flamed for this, many of the big Barnes &amp; Nobles in Manhattan are actually quite strong on both graphic design books and magazines.  They're not a pleasure to browse, but they've got the goods, and that does count.</p>
