    <p>Hi all, </p>
    <p>I am from the UK and I am looking to put a list together of good design bookstores across the USA. Mainly looking in the big cities, New York, LA, Chicago etc. but if anyone knows of any really great ones dotted around it would be cool to hear about them.</p>
    <p>I hope someone can help.</p>
    <p>Many thanks,<br>
    Sam</p>
