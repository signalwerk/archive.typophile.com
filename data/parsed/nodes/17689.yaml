      <p><em>And please share your opinion about the proper setting of the cent sign.</em></p>
      <p>I usually make it slightly shorter than the lowercase c, and usually quite a lot lighter, but aligned within the x-height, with the bar extending above and below what seems an optically pleasing amount. This seems to me the best way to produce a single cent glyph that works reasonably well with lining numerals as well as oldstyle numerals.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/JHcent.gif"></div><br>
      Since the cent sign is so seldom used, I'm not inclined to spend time making variant versions for use with different kinds of numerals, but if I were to make a version specifically for use in e.g. all-caps settings with lining numerals, then I might make something like in your Adobe Minion example.<p></p>
