      <p>Andreas, that isn't a florin in the maths setting, it's the MATHEMATICAL ITALIC SMALL F character (U+1D453).</p>
      <p>The florin, very unfortunately, is unified with LATIN SMALL LETTER F WITH HOOK (U+0192) which is a letter in the orthographies of a sizeable number of African languages. It is very difficult to support both these languages and the (until recent) European use of this character as a currency symbol. The currency symbol was almost always slanted, even in roman typefaces, and conformed to the proportions (including, often, tabular numeral width) of other currency symbols. The actual letter, of course, needs to conform to the overal style of the typeface and to fit to the other letters. An added challenge is designing an italic typeface in which one needs to distinguish between the letter <em>f,</em> often stylistically drawn with a descending hook, and the letter ƒ.</p>
    html_clean: |-
