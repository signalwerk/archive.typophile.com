    <p>MS recommends two positions for a proper placed <a href="/wiki/cent" class="freelinking" rel="nofollow">cent</a> sign.<br>
    <a href="http://www.microsoft.com/typography/developers/fdsspec/monetary.htm" title="http://www.microsoft.com/typography/developers/fdsspec/monetary.htm">http://www.microsoft.com/typography/developers/fdsspec/monetary.htm</a></p>
    <p>baseline: c</p>
    <p>middle: b</p>
    <p>I have checked my only native American specimen book, the big ATF 1924, and most of the cent signs seems to sit on the baseline. But the signs on page 595 and 616 shows the cent sign on position a, with a long strike to the baseline like a fraction.</p>
    <p>To my eyes I would always prefer placing on top like example a. But most text fonts I have checked now use position c and b. The baseline placement seems to me most uncomfortable.</p>
    <p>So my question as font developer: Speeks anything against the top placment (a) as default position for the cent sign in a typeface? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cent.png"></div><p></p>
    <p>example font: Minion</p>
