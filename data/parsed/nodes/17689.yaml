      <p>In my humble and personal opinion, the type designer's own intent for the use of the typeface should take precedence over conventional presets or attempts at standardization. Not that standardization is to be avoided, but character design and their placement should be guided by the overall intent or personality of the type family.</p>
      <p>Take for instance the identical treatment and placement of the cent sign in <a href="http://www.myfonts.com/fonts/agfa/bell-mt/regular/" target="new" rel="nofollow">Monotype Bell</a> (though Linotype version illustrated) and Futura. Note that the Bell numerals are based on the original lining numerals of Richard Austin's late eighteenth century design which are smaller than the caps and larger than the lowercase.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bell-numerals.png"></div><br>
      Both cent signs are equal to the x-height and sit on the baseline.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Futura-numerals.png"></div><br>
      Though I don't have a copy of Paul Renner's original placement of the cent sign at hand, I personally would have placed it higher. The cent sign in Bell has the privilege of being used with unique sized lining figures, and looks quite comfortable where it is.<p></p>
      <p>As a typographer, I have developed certain personal "style guide" preferences, and would almost never use regular dollar or cent signs juxtaposed to old style numerals. For me, lining figures are for expressing math, money and measurements (temperature, inches, cm, gals., etc.) and old style figures are used for dates, and numeric expressions within text (<em>The detective was looking for Rm. 38</em>).<br>
      Of course, I'm always willing to break my own rules for good reason.</p>
