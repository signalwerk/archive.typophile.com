    html: |-
      <p>Finishing up on the hooked f:</p>
      <p><em>The UC “florin” is called? (unicode?)</em></p>
      <p>U+0191</p>
      <p><em>So you think its good to see florin no more as currency sign, since its has no usage anymore and design it for African typesetting? Makes this sense for a simple Latin standard “Std” character set?</em></p>
      <p>No, in the context of the Latin 1 charset, it should be treated as a florin symbol. (Note that some people have taken to using it as a abbreviation for 'folder'.)</p>
      <p>It is only in larger fonts aimed at more international markets that one should consider whether to include both upper and lowercase (and smallcap) forms and to treat it as a letter rather than a currency symbol. Really, the letter and the currency sign should never have been unified.</p>
    html_clean: |-
