  html: |-
    <p>Founded by Slobodan Jelesijević and Dušan Jelesijević in May 2009 as an independent boutique font foundry that is the only one of it’s kind in Serbia, Tour de Force Font Foundry has produced high quality original typefaces that are in use&nbsp;globally.</p>
    <p>From our glyph laboratory in a small town of Gornji Milanovac, Central Serbia, we have anchored our craftsmanship and reputation on providing the classic European standards of stellar personalised service with our clients across the&nbsp;world.</p>
    <p>This is a service that believes in taking care of the little things – and perfecting little details that can make all the difference. Thus, by weaving our experience across different design environments and cultural spaces, we provide an intricate and instinctive approach to producing fonts that have the ability to bring out the best in your company’s advertising and branding&nbsp;campaigns.</p>
    <p>* Tour de Force Font Foundry is project based digital&nbsp;foundry.</p>
    <p><a href="http://www.tourdefonts.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tour de Force Font&nbsp;Foundry</a></p>
    <p><img src="/sites/default/files/old-images/Tour_De_Force_LOGO_smaller_6038.png"></p>
