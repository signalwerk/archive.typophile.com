    html: |-
      <p>Oh yes, it is strange that the quotes and the apostrophe are not on the keyboard, instead of inch and foot marks which often are.<br>
      I guess it is just the preference of the type house?<br>
      Option/shift/] is the mac access for the single quote/apostrophe.<br>
      Or you could use a comma with minus lead.</p>
