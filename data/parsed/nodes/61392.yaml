    <p>Can anyone point at some interesting reference material upon <a href="/wiki/Cyrillic" class="wiki">Cyrillic</a> lettering in <a href="/wiki/Serbia" class="wiki-create">Serbia</a> (and perhaps Montenegro)?<br>
    Apart from <a class="freelinking-external" href="http://jankojs.tripod.com/SerbianCyr.htm">that instructive discussion</a> regarding mainly Italics I’m interested in possible other special customs which differ from standard (Russian) practice.<br>
    Any images of old type, street lettering, shop signs etc. known?</p>
