    html: <p>I think that the images in your mock-ups all look rather violent or scary.  <br> <br>Anyway - Besides stock imagery - you can probably acquire images from your newspapers - which will have tons of protests and union marches archived as they happened on that day in history in that city - you can search them in the periodicals at the library first. <br> <br>As for the typography it might be suitable to have the cover mimic a protest sign - rather then a book cover.  Condensed fonts like Trade Gothic's remind me of signs, but that might just be me.</p>
