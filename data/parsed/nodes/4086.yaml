    html: <p>Dan — Obviously I would not limit myself to never using a new face should an occasion arise, but I think an argument can be made that a proliferation of bad faces now created digitally makes more trouble for designers than it helps them. There’s a whole other dimension to typographic design which has to do with how a line of copy is set for comprehension as well as aesthetics. Do your instructors at the school get into&nbsp;that?</p>
