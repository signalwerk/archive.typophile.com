    html: <p>I really like that first photo (what is it of)? <br> <br>Actually my initial brief came with the request for the use of the Tienanmen Square photo, as this is one of 23 diverse case studies from the last century (ranging from Russia in 1905, to Guatemala in 1944, the Philippines in 1986, to Serbia in 2000) used in the book. There has been some internal debate as to whether T. Sq is the best example of nonviolent struggle...not to mention acquiring photographic rights.  <br> <br>My concern with using a single photograph is that it becomes too focused on one event rather than capturing the overall proactive 'emotions' or 'strategies'. Hence the reason for some of the simpler graphics which are more open to interpretation (but at the risk of being boring!). <br> <br></p>
