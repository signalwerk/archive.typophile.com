    html: <p>Yes! My instructors have gotten into that, I'd say� I've been to several different schools now, though. Some are better at passing this thing along. <br> <br>Aside from this, I actually don't believe that there is <i>really</i> all that much of a proliferation of bad typefaces due to digital technology. I remember an interesting interview with Jonathan Hoefler (?), in which he refered to a type specimen book for the 19th Century that was jam-packed with crazy fonts, just like what we see today. People will most likely always experiment with these grunge (for lack of a better word) forms, and that makes me happy. </p>
