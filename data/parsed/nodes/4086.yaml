  html: "<p>Does anyone have any suggestions for suitable fonts for a book titled 'Waging Nonviolent Struggle: 20th Century Practice and 21st Century Potential' (the book presents nonviolent action as a powerful and effective means to wage conflict). Many book covers of a similar genre prefer to use typography rather than a graphical image to convey the message. However, I'm not sure whether the choice of fonts have been accidental. I want a font that conveys power and conflict. Any suggestions and justifications for use would be greatly appreciated...</p>"
