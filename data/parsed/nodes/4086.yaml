    html: <p>K, I would suggest you begin with sketches. Maybe you can ﬁnd a photo or design that would be appropriate. Then experiment with diﬀerent faces superimposed on the images. Be careful about putting the cart before the horse. That doesn’t work. Suppose we say Gill Sans Bold. How will your copy break? That’s crucial to comprehension. But where will the copy be in relation to the elements in the photo, design, illo, whatever? Nail down your imagery ﬁrst, then think about typefaces. They are interconnected and one size doesn’t ﬁt&nbsp;all.</p>
