    html: <p>Type can BE the illustration, too. Paul is right. It would be cool to see your sketches/ideas. We could comment on those. Despite my type-loving nature, I think that I agree that the typeface selection is not the <i>first</i> question that someone should ask when they begin a project like this one. <br> <br>Some designers think that there are only a handfull of faces that anyone should ever use. Thankfully, I don't think that any of them are frequent visitors here. (Although, it would be tremendous fun to spar with them!)</p>
