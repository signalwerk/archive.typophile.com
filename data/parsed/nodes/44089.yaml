    <p>BBT font </p>
    <p>A Free Font that replaces the k / K english &amp; european alphabets for<br>
    another shape for spiritual / philosophical reasons. When you press k /<br>
    K .....you get a different shape!</p>
    <p>This is for users and developers bundling the font on their software applications.</p>
    <p>Downloads:</p>
    <p><a href="http://savannah.gnu.org/submissions_uploads/BBT_Download.zip" title="http://savannah.gnu.org/submissions_uploads/BBT_Download.zip">http://savannah.gnu.org/submissions_uploads/BBT_Download.zip</a></p>
