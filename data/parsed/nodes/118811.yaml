    <p>For those who miss old-fashioned typewriters, actor Tom Hanks has created the iPad app Hanx Writer. It recreates the sound, carriage returns, and other aspects of typewriters. Text can be copied and pasted. It's rather nice.</p>
    <p>The app is free, but you can make optional in-app purchases of other typewriter fonts, different colored ribbons, etc.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hanx_3481.jpg"></div><p></p>
