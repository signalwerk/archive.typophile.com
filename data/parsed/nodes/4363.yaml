  html: "<p>I believe everyone faces this issue when choosing type for a magazine or for the corporate identity system of a client or, basically, for any design job that involves type. <br> <br>How do you match the personality of the chosen type with the personality of the organization/magazine/etc? <br> <br>The only details I've seen discussed were extremely basic... that is serif goes for serious, traditional corporations and sans serif fits like a glove on modern ones. Of course, this is a superficial approach. <br> <br>I found this article, but it's a little too academic for my taste: <br><a href=\"http://www.plainlanguagenetwork.org/type/utbo412.htm\" target=\"_blank\">http://www.plainlanguagenetwork.org/type/utbo412.htm</a> <br> <br>Any other resources that discuss this topic? <br> <br>Regards, <br> <br>Marius <br> <br> <br> <br></p>"
  html_clean: "<p>I believe everyone faces this issue when choosing type for a magazine or for the corporate identity system of a client or, basically, for any design job that involves type. <br> <br>How do you match the personality of the chosen type with the personality of the organization/magazine/etc? <br> <br>The only details I've seen discussed were extremely basic... that is serif goes for serious, traditional corporations and sans serif fits like a glove on modern ones. Of course, this is a superficial approach. <br> <br>I found this article, but it's a little too academic for my taste: <br><a href=\"http://www.plainlanguagenetwork.org/type/utbo412.htm\" target=\"_blank\" class=\"link-external\">http://www.plainlanguagenetwork.org/type/utbo412.htm</a> <br> <br>Any other resources that discuss this topic? <br> <br>Regards, <br> <br>Marius <br> <br> <br> <br></p>"
