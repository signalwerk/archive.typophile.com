    <p>Here's the other thing I've been working on recently. It's a decorative humanist display font based on a small x-height, a cap height equal to the x-height, and extravagant ascenders/descenders that reach beyond that core space by 2 x-heights on either side.</p>
    <p>I intend to add a number of swash alternates for both upper- and lowercase, easily accessible by way of "ligatures" with the rarely-used, yet easily-typed "grave" and "asciitilde" characters.</p>
    <p>I'll be calling the font "Maestrale", which is an Italian name for one of the eight cardinal winds, and happens to mean "masterly" as well.</p>
    <p>Here's a little preview:</p>
    <p><img src="/sites/default/files/old-images/maestrale_4327.png"><br><img src="/sites/default/files/old-images/catharsis_5647.png"><br><img src="/sites/default/files/old-images/quaestor_5205.png"><br><img src="/sites/default/files/old-images/alfa_4768.png"></p>
