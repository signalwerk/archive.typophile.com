      <p>I've gotten some persistent feedback (mostly from my parents ;o) that the tiny capitals look weird. Now, I wanted the caps to be freely interspersable with the lowercase to make mixed-case texts, but in principle I could use the small caps for that functionality... </p>
      <p>So as an experiment, I moved all my previous caps from Maestrale Baby into small-caps slots and enlarged all my caps by 25%. I rather like the new proportions, and they really do feel more like caps now.  However, all the stroke weights also scaled up by 25% in the process. I know caps are supposed to be drawn heavier than LC to compensate for their greater space requirements, but perhaps this is too much? I feel that the caps currently stand out rather distinctly by their blackness. Then again, it's not unusual for caps in calligraphy to be eye-catching.</p>
      <p>What do you think? Should I lighten them up a little?</p>
