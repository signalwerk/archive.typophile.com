      <p>After some feedback from the TypeDrawers forum, I'm thinking of releasing Baby in two cuts, one of which contains the calligraphic elements inherited from Maestrale (such as the curved |d|) whereas the other sticks to more consistent serif forms:</p>
      <p><img src="/sites/default/files/old-images/versiona_3898.png"><br><img src="/sites/default/files/old-images/versionb_6522.png"></p>
      <p>As you can see, I also made some changes that apply to both cuts, such as giving consistent terminals to |f c r y roman-s|.</p>
      <p>Maybe the "sober" version would also profit from a serif-bottomed |l|?</p>
      <p>Oh, and if I'm to release this in two versions, perhaps Misurina is a better choice of names after all; I wouldn't want to have to use a three-word name.</p>
