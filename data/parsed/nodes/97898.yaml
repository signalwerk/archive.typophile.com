      <p>I don't think the size of use matters - my issue with the capital small counters is not that they would fill in or anything--just that they looks small <em>relative to those of the lowercase</em> (a proportional mismatch that would exist no matter what size), so they look a bit, as you said, "finicky." </p>
      <p>Caps and lowercase do often receive different treatment weight-wise, but my sense is that, at least in recent designs, that will more often take the form like differing stem weights <em>precisely to minimize the gray-values difference</em>. At any rate, I think in your equal-height type design, and certainly if you want to entertain the possibility of mixing case throughout the letter, you should do what you can to get similar counter sizes and gray values.</p>
