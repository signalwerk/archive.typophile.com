      <p>@ Eliason: I'm trying to make as few decisions for the user as possible. In my ligature-based encoding, for example, I don't currently have any automatic ligatures for f_f_i and the likes, since those interfere with the user's ability to change individual letter shapes. Maybe the "typographically savvy" encoding should have such ligatures enabled and assume the user knows how to switch them off if they don't like them.</p>
      <p>Also, I kinda like the script |s| even at the beginning of words, as in the following image (which also shows off an f_f_i quasi-ligature). I'm not familiar with script fonts; is it very uncommon to allow script-|s| at the beginning of words?</p>
      <p><img src="/sites/default/files/old-images/suffix_5363.png"></p>
      <p>@ Dave: Yeah, I'm having lots of fun with character alternates, especially ones that interact with other characters. I haven't even been through all lowercase letters yet, so I certainly can't call it a day anytime soon, but it's going to be hard to stop.  ;o)</p>
      <p>Is this |S| better?</p>
      <p><img src="/sites/default/files/old-images/s_6528.png"></p>
