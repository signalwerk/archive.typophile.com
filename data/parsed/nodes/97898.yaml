    html: |-
      <p>Hallo Andreas,</p>
      <p>that particular umlaut recalls the Sütterlin |e|, which is the origin of the umlaut. </p>
      <p>Onstroke of the |m|: I currently only have a set of four offstrokes that I compose with letters by simple juxtaposition and overlapping.  I didn't use an upper-level onstroke for |m| because the one I have is designed for crossbars (like on |t|, or on the family of letter variants designed to ligate with a crossbar), so it wouldn't fit the slanted top.  I suppose I should make a set of slanted on/offstrokes for that purpose...  though unlike the horizontal ones, they're going to be very sensitive to spacing. So far, I only have glyphs with built-in on/offstrokes for |a|, |e|, and accented variants thereof.</p>
      <p>(That said, I still rather like the |m| above. The upward swash is a welcome counterpart to the downward one at the end of the word. And calligraphy does involve a lot of pen-lifting after all.)</p>
