      <p>I just don't know how much free fonts actually publicise the paid versions. Especially on MyFonts, customers are finding the free fonts by just searching for free fonts, probably downloading everything they find, and ignoring the few paid equivalents (I have two fonts that are free, and they get downloaded loads. One of them is just a shadow addition to another paid font, and on its own is virtually unusable. It still gets downloaded. And many, many times, I see the same 'customer' downloading them over and over again. This is why I think they're just downloading everything free on the site, not even looking particularly at what they're getting). I think Jos is an exception, but I still wonder if Museo is successful because of, rather than in spite of, the free weights. One thing I do know - you can test the waters by offering both as paid fonts, and if you get little response, make Baby free, and see what happens. If you start with Baby free, you'll never know if you could have had the same response (or better) if it was paid.<br>
      I know the frustration of slow selling fonts, and the temptation to make them free just so they get used is there, but I think selling one license is better than giving away thousands. For all the use your free fonts get, how much of that would you say is good design? I personally would rather a few people, who really wanted my font, bought it and used it well, than a few thousand, who only wanted it in the first place because it was free, used it at all. Ultimately, though, it's up to each individual designer how they approach this issue. This is just my opinion, and I haven't got enough experience to know anything with certainty!</p>
