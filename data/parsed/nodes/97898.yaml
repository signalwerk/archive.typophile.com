    html: <p>In my opinion, releasing it for free is a bad idea. While it may well generate interest in the commercial version, I think it's far more likely users will just use the free version and not feel the need for the paid one. Both fonts look great, and they will find their market. Just give it time! I personally like Maestrale Baby as a name, it's cute! I don't think it's different enough from Maestrale to warrant a different name, and if the two fonts are sold together, with a discount for getting both, it would add to the value in the minds of potential buyers. I think if you get the price point right, you'll have a big hit on your hands. How about 40$ each, $50 for both, half price introductory discount? It's a balancing act, but selling too cheap (and especially giving away for free) gives the impression that you're not as proud of it as you should be. Under $20 and I'd be thinking there must be something wrong with it for it to be that cheap!</p>
