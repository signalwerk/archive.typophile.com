    html: |-
      <p>Alright, I've finally managed to wrap up my work on Maestrale and submit it to MyFonts. It should be available for purchase by the end of the week.</p>
      <p><img src="/sites/default/files/old-images/Mposter02_small_4569.png"><br><img src="/sites/default/files/old-images/Mposter03_small_6361.png"></p>
      <p>Aside from the default version that uses ligatures with rarely-used but easily-typed characters to render stylistic alternates accessible, I've also made a "Pro" version in which the same glyphs are stored as stylistic sets (.ssXX). The Pro version also includes a lot of contextual alternates and proper ligatures that aim to resolve any collisions in plain text, thus it doubles as the "beginner version" of Maestrale.</p>
      <p>I'm furthermore offering two cuts of Maestrale Baby for free. Maestrale Baby Boy aims for a "roman serif" look whereas Girl has an "upright italic" flavor.</p>
      <p><img src="/sites/default/files/old-images/Mposter09_small_3760.png"></p>
      <p>Cheers</p>
