    date: 2011-04-11T17:52:00
    date_raw: 11 Apr 2011 — 5:52pm
    votes: null
    html: |-
      <p>For more detailed information (font size for instance) I use Tools &gt; Advanced editing &gt; Touch up text tools, then select the characters and choose "Properties"</p>
      <p>And to get the copyright, I need to use FontForge:  Copyright BVG und MetaDesign 1996, published by FontShop International for FontFont release 21.</p>
      <p>Any better way?</p>
      <p>Michel</p>
