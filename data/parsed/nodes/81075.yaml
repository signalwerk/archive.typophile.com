    <p>Hi all</p>
    <p>I'm really interesting to find out what font this is. For a document which has such a small print it is so easy to read. i've tried various font identifiers but im not convinced. I attached a pdf because any image or scan i made distorted the font. I would like to know what size they are using in this document too. Any help would be much appriciated as i would like to purchase this asap.</p>
    <p>cheers<br>
    Paul</p>
