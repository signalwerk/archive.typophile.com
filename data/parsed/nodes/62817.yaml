      <p>Rich, I think the fact that WOFF is designed, as Mozilla's own notes indicate, to include ‘metadata and private-use data structures, including predefined fields allowing foundries and vendors to provide license information if desired’ is a good indication that the font developers that advised on and encouraged the development of the format are interested in things like serialisation of web fonts. The format is also designed to fit pretty seamlessly into automated compiling, customisation and shipping workflows, and as well as serialisation I anticipate things like custom subsetting for customer language requirements.</p>
      <p>Sure, there are going to be some TTF/OTF licenses that permit you to create WOFF files from desktop fonts, but those are more likely to be free font licenses rather than commercial licenses.</p>
