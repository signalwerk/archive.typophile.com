      <p>David, you wrote in that other thread: <em>If the W3C accepts a format that requires we mark out fonts as “embeddable” in order to be linkable, we will be on them like a virus that loves stupidity.</em></p>
      <p>Interpretation of the OS/2 embedding bits relative to web font linking is identified as an issue that needs to be resolved. I've made my recommendation, which is that the OS/2 embedding bits be completely ignored for web font purposes, and that this made clear in the WOFF and CWT specs. This is what Firefox and Opera are already doing when serving naked fonts, so it shouldn't make any difference if the same fonts are in a wrapper format.</p>
      <p>Ideally, I'd like to see the meanings of ‘embedded', ‘embeddable', ‘linked' and ‘linkable’ given clear, unambiguous and commonly accepted definitions, reflected in all specs including the OT spec. Even if that were the case, there are still situations that remain unclear, e.g. Adam Twardoch's example in which a font is actually embedded in a web page rather than dynamically linked:<br>
      <a href="https://web.archive.org/web/20150123214711/http://www.twardoch.com/webfonts/completelyembedded/" title="http://www.twardoch.com/webfonts/completelyembedded/">http://www.twardoch.com/webfonts/completelyembedded/</a></p>
