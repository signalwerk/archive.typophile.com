    <p>First announced informally by Mozilla developer Jonathan Kew on the W3C Web Fonts Mailing list, it is now official.<br>
    <a href="https://web.archive.org/web/20150123214711/http://readableweb.com/mozilla-announces-support-for-web-open-font-format-woff-in-firefox-3-6/" rel="nofollow">Mozilla Announces Support For Web Open Font Format (WOFF) In Firefox 3.6</a><br>
    I don't think it's hyperbole to say this is one of the most significant developments affecting the <em>business</em> of font design since the marketing of fonts first moved to the web as a mode of delivery.</p>
    <p>Thoughts? Comments? Questions?</p>
    <p>And, please, it's time to answer the BIG question:</p>
    <p>If you are a commercial producer of fonts, will you be licensing for use with WOFF and EOTL insofar as those formats differentiate themselves from "raw" or "desktop" OTF and TTF files?</p>
