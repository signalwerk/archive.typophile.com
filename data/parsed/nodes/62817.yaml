      <p>@Richard<br>
      <em>Monotype has just made it absolutely clear that they will not license to anyone who is not willing to enforce same origin restriction.<br>
      <a href="https://web.archive.org/web/20150123214711/http://lists.w3.org/Archives/Public/www-font/2009OctDec/0111.html" title="http://lists.w3.org/Archives/Public/www-font/2009OctDec/0111.html">http://lists.w3.org/Archives/Public/www-font/2009OctDec/0111.html</a><br>
      </em></p>
      <p>Richard, I hope you do understand that Monotype (and any other font vendor) has the obligation to protect our IP, and that the EULA is the only legal remedy we have. If you read my message carefully (and I would like to thank John Hudson for pointing this out before I had a chance to do it) you would see that I said Monotype would require "some kind of protection mechanism be in place" giving the reasonable choice of a particular tool to web authors.</p>
      <p>Based on your comment (quoted above), I also feel I need to clarify what same-origin restriction is, and most importantly what it is <strong>not</strong>! Same-origin restriction (a.k.a. <a href="https://web.archive.org/web/20150123214711/http://www.w3.org/TR/access-control/" rel="nofollow">Cross-Origin Resource Sharing</a> or CORS) is the technology being developed by W3C and implemented by Mozilla Firefox (and, hopefully, soon by all other browsers). It is applied by a browser by default, which means that the font (or any other resource linked in your CSS or HTML page) will only allowed to be used if it comes from the same origin (i.e. both font and HTML page are located on your server). The key here is that you, as a web author, do not have to do *anything* to enforce same-origin restriction, you only need to do *something* <strong>if</strong> you want to relax this restriction and allow HTML pages from other website link to the fonts hosted on your server.</p>
      <p>What I do want to see happened is to have other browsers supporting same-origin restriction sooner rather than later, and this was the essence of my message I tried to convey on W3C font list. You took the message out of context and completely misinterpreted its meaning. </p>
      <p>I'd like to make an offer- any time you feel like you need to vent an anger directed to either me personally, or my company - please feel free to contact me directly first - I do think that I could've helped address many of your concerns.</p>
      <p>Regards,<br>
      Vlad</p>
