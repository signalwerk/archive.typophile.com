      <p>@davidmarshall</p>
      <p>Thanks for posting, truly.<br>
      The response has been a bit underwhelming, as you can see.<br>
      I'd love to know more about what "user limits" you're thinking of and how that's going to work.<br>
      A lot of server side software licenses - components and such - work similarly, on a kind of an honor system, usually. Insofar as, unless you get quite intrusive, it's tough to know how many visitors a site is servicing.</p>
      <p>@johnhudson<br>
      My feeling at this point is that standardization of WOFF or CWT is dead in the water despite best efforts. I can't see how it changes much, either. It was going to be a three format game for at least the next (Richard reaches down and...) ahhhh, you can choose however many number of years you think it will go on.<br>
      And, of course, one of the three is off the table because you won't license raw, naked, steamy formats like TTF and OTF.<br>
      So prudish.<br>
      Looks like TTF only, encoded in CWT (EOTL) or WOFF.<br>
      If this is the way it goes, the ball is now really in Apple's court. If they don't support WOFF, retail font vendors are in limbo. Or so it would seem, depending upon one's point of view.<br>
      We shall see.</p>
