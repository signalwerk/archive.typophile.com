      <p>@dberlow,</p>
      <p>David, it think it's fair to say at this point that you're just plain hostile? opposed? to the use of fonts in web pages unless it is on terms that are totally acceptable to you. If I take in total what you've said and written on the subject (which is quite a bit) an educated guess is that nothing short of a required permissions table <strong>strongly enforced</strong> by software user-agents will satisfy.<br>
      This hasn't and won't happen. Doing so would involve huge cost and delay and put the makers of user-agents in an untenable legal position. Sorry, but your fonts aren't that important to anybody else but you. If those are the conditions, you can keep them.<br>
      Either you are willing to adjust your business methods to the nature of the technology and the work-flow of those who work with it every day or you aren't.<br>
      My belief is that if the right marketing steps are taken, this can be done profitably but you have obviously come to a different conclusion.<br>
      I'm tired of the same veiled criticism over and over.<br>
      I'd love to discuss all kinds of issues with you, but on this one, I'm done. Too much else to do.<br>
      Good luck to you, really. And I hope we can constructively communicate about other aspects of fonts.</p>
      <p>Cheers, Rich</p>
