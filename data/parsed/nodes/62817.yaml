      <p><cite> &gt; If you are a commercial producer of fonts, will you be licensing for use with WOFF and EOTL insofar as those formats differentiate themselves from “raw” or “desktop” OTF and TTF files?</cite></p>
      <p>Rich -- I find the wording of your question to be interesting. The phrase "licensing for use with WOFF" suggests that you expect the route to the new world to come via web developers "rolling their own."</p>
      <p>I would actually expect that most foundries will choose to license WOFF fonts directly. (No "for use with" necessary.) </p>
      <p>When a new font format gets established and achieves widespread implementation, then foundries will start making fonts in that format and providing them for license. This is what they do -- make fonts, not provide material for users to make their own.</p>
      <p>What remains to be seen is the licensing and pricing models that will emerge. What will be offered to those who want fonts only for web use? At what price point? What about both print and web versions? What about upgrading from one format to another? </p>
      <p>I don't mean to rub you the wrong way with my comment. I agree, this is a potentially significant crossroads. After all the hullabaloo, font producers better get on board quickly and figure out how they want to leverage this development. And they'd better get product to market in a timely fashion.</p>
      <p>Is there an estimated timeline for the FF3.6 release?</p>
