      <p>Look, I get it. It took me long enough but I get it. Somebody thoroughly familiar with the retail font business was open enough to step outside the PR crap and fill me in.</p>
      <p>I now understand the disconnect between what gets said by those in the retail font business and the actions of the people in the retail font business.</p>
      <p>Just so we understand each other, an example: Vlad Levantovsky posted on another thread that Monotype "supports" the WOFF format. I shot back that Monotype's EULA doesn't license for it. Sii shot back that this wasn't fair. (Still can't figure out why not.)<br>
      Two days ago there was a posting on Typotheque's web site saying they "endorse" WOFF.<br>
      *And they will license for it soon* But not right now.</p>
      <p>Saying you "support" or "endorse" something and then not licensing for it in a meaningful way is sort of like saying that, in the last election, I supported John McCain but I voted for Barack Obama.<br>
