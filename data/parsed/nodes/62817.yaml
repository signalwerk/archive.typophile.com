      <p>&gt; If you are a commercial producer of fonts, will you be licensing for use with WOFF and EOTL insofar as those formats differentiate themselves from “raw” or “desktop” OTF and TTF files?</p>
      <p>While we're disappointed that Mozilla didn't get behind EOTL (given that the world *really* doesn't need yet another file format), we will be allowing, and promoting, the use of WOFF for our library fonts.</p>
      <p>We want to keep things simple, so will probably be including "online users" in the user limit, defining the number of online users as the maximum number of simultaneous requesters of information from a server on which the fonts are installed.</p>
      <p>We think that's reasonable and realistic - most websites will barely poke above 1 online user, but larger sites will need larger licences.</p>
      <p>We're interested to know how other foundries will be approaching the same issue.</p>
      <p>Dave</p>
