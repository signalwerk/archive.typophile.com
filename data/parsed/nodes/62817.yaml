      <p><em>While we’re disappointed that Mozilla didn’t get behind EOTL</em>, i.e. CWT...</p>
      <p>They may yet. As I wrote today on the W3C font list, the arguments in favour of CWT (EOTL as was) are market arguments based on the backwards compatibility benefits of the format. If those benefits are considered important by web authors and designers and their clients, then there should be market pressure on both browser makers and font vendors to support CWT, and that pressure may be strong enough to overcome the political and technical baggage of the EOT-derived format. But given that the technical baggage includes the fact that CFF OpenType fonts are excluded from the backwards compatibility benefits, the market pressure would need to be substantial to interest a lot of font vendors.</p>
      <p>WOFF is in a bit of a different situation, in that it has been developed collaboratively and specifically with a web font standardisation process in mind, not a market driven process. Unlike either CWT or naked font linking, WOFF is uncontentious and doesn't come with any baggage attached, so provides a good basis for consensus and voluntary interoperability.</p>
