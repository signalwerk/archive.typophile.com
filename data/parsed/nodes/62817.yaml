      <p>@davidmarshall</p>
      <p>I was just curious about what the specifics of the arrangement might be. </p>
      <p>@john hudson<br>
      <em>"You ’feel’ this despite the fact that the W3C have now put forward a draft charter for a working group with the specific intention of standardising those two formats?"</em></p>
      <p>Pessimism seems the most realistic position at this point. The divides to be crossed seem very great. And too many unspoken, hidden agendas.<br>
      But it is only a feeling.</p>
      <p>I ask, who will be helped by it all, and how? The only thing a W3C recommendation will do is force, we assume, any hold-outs to support either WOFF or CWT (EOTL). And I really don't know if, in actual practice, that makes much of a difference one way or the other at this point.<br>
      First, there are thousands and thousands of freely licensed fonts to choose from.<br>
      Second, AFAIK, the only major font vendor that has made any kind of an effort to hang a sign saying, "Web Designers Welcome", is Ascender. They relaxed restrictions with EOTL. They started the fontembedding.com web site. They've got demo pages. I can't say I'm absolutely thrilled with their current EULA and marketing approach - which is also a "meet me by the back door" affair at the moment, but at least there's been a clear willingness to market to web customers on terms that are in step with the way web customers are used to working. I mean, you can hope and hope and hope, but you're not going to convince working moms to stop in with the kids at the end of the day for a five course meal.<br>
      Monotype has just made it absolutely clear that they will not license to anyone who is not willing to enforce same origin restriction.<br>
      <a href="https://web.archive.org/web/20150123214711/http://lists.w3.org/Archives/Public/www-font/2009OctDec/0111.html" title="http://lists.w3.org/Archives/Public/www-font/2009OctDec/0111.html">http://lists.w3.org/Archives/Public/www-font/2009OctDec/0111.html</a><br>
      I cannot conceive of a situation that would entice me or anybody to choose one of their typefaces - when so many others are available - with that requirement attached. So they can keep their fonts, keep their EULAs, and have a nice day. (Oh, and don't forget your embedding bits on the way out.)<br>
      Font Bureau has made it clear their fonts will be available for web licensing if and when an unused alternate universe becomes available in which to do so. (Unless my official DB decoder ring is malfunctioning. Maybe I'm wrong.)</p>
      <p>But then again, the changes that have already taken place have been positive and very unexpected. Back in when, May? June?, any kind of movement seemed out of the question. There was no EOT "Lite", no WOFF, just an impasse.<br>
      At least technologically, I do have more choices today than I did just a few months ago.<br>
      Things *have* been bleaker.<br>
      So I guess we'll pour some tequila on it, and see what happens.</p>
