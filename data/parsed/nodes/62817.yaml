      <p>hrant,</p>
      <p>I've covered web fonts extensively on my blog <a href="https://web.archive.org/web/20150123214711/http://readableweb.com/" rel="nofollow">Readable Web</a>.<br>
      <a href="https://web.archive.org/web/20150123214711/http://readableweb.com/category/fonts/" rel="nofollow">This</a> will give you listing of all the font related articles.<br>
      Key in on:<br>
      <a href="https://web.archive.org/web/20150123214711/http://readableweb.com/web-fonts-panorama-september-2009/" rel="nofollow">Web Fonts Panorama  - Sept 2009</a><br>
      <a href="https://web.archive.org/web/20150123214711/http://readableweb.com/jeffrey-zeldman-questions-the-eot-lite-web-font-format/" rel="nofollow">Jeffrey Zeldman Questions The EOT lite Web Font Format</a></p>
      <p>Many links in my stuff to take you where you need to go to get your head around this.<br>
      In a few sentences:<br>
      Font-linking is now supported in the latest version of every major browser with the differences amounting mostly to the kind of font file format(s) each supports. (This is aside from the usual implementation differences and bugs which will get smoothed out over time.)<br>
      We now await as the latest versions of non-IE browsers propagate out to users. At the present rate - this is a guesstimate based on past behavior- this should be a done deal no later than eighteen months from now on the outside. I'm deliberately being conservative.</p>
      <p>Browser breakdown:<br>
      IE - EOT and EOTL (EOTL as of late redubbed CWT Compatible Web Type)<br>
      Firefox - as of ver 3.5 OTF/TTF<br>
      Firefox - as of ver 3.6 OTF/TTF WOFF (see my article)<br>
      Opera - as of ver 10 OTF/TTF SVG<br>
      Safari - for quite awhile now, OTF/TTF</p>
