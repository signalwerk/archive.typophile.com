    html: |-
      <p>@tphinney and chris dean:</p>
      <p>I've seen the term FAAS - Fonts As A Service used by Paul Irish who also writes quite a bit about this.<br>
      FAAS is much better (IMHO) than @font-face provider. More accurately describes the relationship. Paul Irish keeps beating me in the name game and I'm pissed. ;)<br>
      I think Thomas mentioned them all. Except Typekit is still in Beta (fill out a form to try) and Fontdeck has not, AFAIK, gone operational yet in any way.<br>
      Is this what you meant, Chris?</p>
      <p>@hrant<br>
      Font-linking is, simply, an accurate way of describing the relationship between the web page and the font. Embedding is misleading. The mechanism by which fonts are integrated into a web page is not equivalent to the way fonts are integrated into pdf's or Flash.<br>
      There is an actual link within the stylesheet of the web page - stylesheets being written in the language of CSS (Cascading Style Sheets) - and so, the web page "calls" the font file using the link the same way it calls, say, an image.<br>
      The link contains a source: "src:"<br>
      Plus an URL ("http://thissite/fonts/somefont.ttf")<br>
      It's a link. And perfectly visible if you go looking for it.<br>
      (However, there is no law that says you have to use the font the page contains a link to. So I suppose one could be picky and say font-linking is one thing and the act of actually using the font on the page consitutes "embedding" but that's sophistry, really. Why link if you're not going to use? One implies the other.)<br>
      So, font-linking just says it more plainly and accurately.<br>
      Straight?</p>
