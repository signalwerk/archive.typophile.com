      <p>Richard, re. Monotype: <em>I cannot conceive of a situation that would entice me or anybody to choose one of their typefaces - when so many others are available - with that requirement attached.</em></p>
      <p>So how many commercial font licenses have you purchased in the past? What you seem to be forgetting, again, is that you probably are not the market for commercial font licensing, and nor are the vast majority of web authors. The market for commercial font licensing has always been, and will remain, a market of professional designers and their clients. Sure, there will be a minor market for font licensing to amateurs for web use, just as desktop publishing created such a market for print use. But the major market will remain a professional market, and decisions in such a market about what fonts to use are driven by a number of factors that you don't have to worry about, e.g. consistency with existing print media brand identity.</p>
      <p>Note also that, contrary to what you write here, Vlad did <em>not</em> say that Monotype ‘will not license to anyone who is not willing to enforce same origin restriction’. What he said was:</p>
      <p><em>Speaking on behalf of Monotype - our license does and will require some kind of protection mechanism be in place for our fonts to be used on the web - either same-origin restrictions or root strings or referrer checking or by another means (e.g. JS) that web authors would find appropriate to satisfy the license conditions.</em></p>
      <p>So same-origin restriction is only one possible mechanism that will satisfy Monotype's license conditions, and the key is that the mechanism will be one that web authors find appropriate. This strikes me as similar to Ascender's 'reasonable measures', recognising that not all web authors have access to the same mechanisms and that some mechanisms are not scaleable, i.e. they might be appropriate to a large company with a dedicated IT department and their own servers but not to Joe Blogger.</p>
      <p>Richard, you seem to be wanting fully formed web font delivery systems in place yesterday, and are feeling pessimistic because this isn't the case. This is just plain silly. We're feeling our way, collectively, into new ways of doing business for a new medium. Font makers and vendors are testing the waters in various ways -- Typotheque, Typekit, Kernest, CWT, WOFF -- and, most importantly, looking to see what the browser makers are doing. To me, having watched the type business struggling to follow the lead of software companies for the better part of two decades, I'm actually feeling pretty positive about the degree of upfront engagement from font makers on the web font issue.</p>
