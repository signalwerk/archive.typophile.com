      <p>Richard, don't worry about insulting me, just leave momma out of it, and we're fine. </p>
      <p>&gt;Saying you “support” or “endorse” something and then not licensing for it in a meaningful way is sort of like saying that, in the last election...</p>
      <p>My sincerest advice is to stop with the analogies. They crowd the true picture's details out of your thoughts. </p>
      <p>Clients are not at all likely to follow the format drama unfolded before us, are they? So <strong>support</strong> of them, by us, means we supply the client's design choice via whatever web font format(s) we need to serve to meet the client's users' UA/OS demands. </p>
      <p><strong>Endorsement</strong> to us means we think that more than one format is good, so we don't do much of that. Clients don't care what we endorse as long as what we support is what they need to meet their users' UA/OS demands. </p>
      <p>The typical web font <strong>license</strong> involves the client's selection of a style, and the coverage they wish for (one browser on one platform, or all browsers on all platforms are the current choices), because that's all they want to license, the style. </p>
      <p>Thus, we support WOFF, OT and EOTL, endorse only OT, and do not license any of them.</p>
      <p>Cheers!</p>
