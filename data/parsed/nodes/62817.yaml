      <p>I don't understand the question, David. By ‘free font license’, I mean fonts with deliberately open licensing permitting users to distribute, modify, convert, etc.</p>
      <p>My point to Rich was that commercially licensed fonts are more likely to be delivered in the final use format, rather than delivered in one format with a permission to convert to the final use format. That's the case whether the final use format is WOFF, CWT (EOTL as was), EOT, or TTF/OTF with a permissions and recommendations table.</p>
