    html: |-
      <p>I'll certainly be recommending WOFF to my customers as a format for use of their custom fonts on the Web. Its a smart format: easy to support, nicely compressed, preserves digital signatures and custom font data, isn't installable as a desktop font. </p>
      <p>EOTL (or CWT as we should probably start calling it) is more problematic because in a couple of significant ways @font-face support doesn't really work in Internet Explorer, so the backwards compatibility benefits of the CWT format are hobbled. Some of my customers are commissioning CFF OpenType fonts, so obviously I can't recommend CWT because it is limited to TTF. The style linking bug in Internet Explorer means that web developers will need to hack their way around this, if possible, in their CSS code, and that looks pretty painful to me. So if a customer with a TTF font were specifically needing backwards compatibility on IE, then I'd have to point them at CWT with caveats, but otherwise I'll be putting my energy into pushing MS to support WOFF a.s.a.p.</p>
