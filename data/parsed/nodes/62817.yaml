    html: |-
      <p>@john hudson</p>
      <p>In that WOFF and EOTL are on a par in providing the "garden fence" that many font designers felt was a bare minimum of a barrier to instant installability, my assumption, and I'd guess yours, too, is that we can expect to see WOFF in the next version of Internet Explorer.<br>
      Personally, I'd be shocked not to see it. And I, among others, will be all over them about it on the IE Blog and monthly chats and knockin' on SG's door if I have to. ;)<br>
      I'm familiar with the CSS issues and, as workarounds go, they are just not all that painful. To some, IE can do nothing right and every little thing is a big thing. (Or at least an occasion for a snide comment or two.)<br>
      Ironically, Opera 10's font-linking implementation is - unlike IE - buggy as in quirky and unpredictable. Plus it deviates from the standard in much the same way as IE. But outside of my blog, I've yet to see a word of criticism. And the spin on Opera's development blog makes the workarounds for it sound like best practice! (And the even funnier thing is: it just might be best practice. The web community is still figuring out the most coherent and sensible way to make the CSS work. But until we had real implementations to test against, it was pointless.)<br>
      Also, Apple has yet to weigh in on support for WOFF in Safari, and until they do, we're largely on hold.<br>
      But it's time to get the conversion tools working, surely. Thanks for the input.</p>
