      <p>"why do you feel that way, david?" </p>
      <p>Well...here's a example of a short definition, and my analysis of it as an example:</p>
      <p>"TrueType is a type rendering technology created by Apple to compete with Adobe’s PostScript based Type 1 fonts. TrueType differs from Type 1 in that it uses quadratic as opposed to cubic bezier curves. TrueType excels at on screen rendering with sophisticated hinting allowing for customized bitmaps at a variety of sizes. TrueType rendering technologies have found their way into new OpenType standards."</p>
      <p>&gt;TrueType is a type rendering technology<br>
      No. There is a tt rasterizer but TT is not a rendering technology. It is a type technology, but since that has not been defined, i.e. what constitutes a type technology, either in the -pedia or in the authors definition, it's easy to understand nothing :)</p>
      <p>&gt;created by Apple to compete with Adobe’s PostScript based Type 1 fonts.<br>
      That may have been the effect, but it was definitely not the cause!</p>
      <p>&gt; TrueType differs from Type 1 in that it uses quadratic as opposed to cubic bezier curves.<br>
      True, but so what? What's the difference between the two?</p>
      <p>&gt; TrueType excels at on screen rendering<br>
      Grammar no count?  </p>
      <p>&gt;with sophisticated hinting allowing for customized bitmaps at a variety of sizes.<br>
      Okay, so where is the "custom bitmap" utility? and besides that, how many TT fonts have ever had customized bitmaps in them? The point being that "customized bitmaps" is a wholly different thing than "sophisticated hinting allowing for bitmaps of the highest possible quality, at all sizes", no variety involved.</p>
      <p>&gt;TrueType rendering technologies have found their way into new OpenType standards.<br>
      This is mis or dis information. Seeing as the rendering technology is not the point, or the definition of TT, so it couldn't be plural. If one bothered to create a generic definition of "type technology", one'd see the opposite is actually true of the back end of the sentence, namely, that the contours, hints, 90% of the tables, kerning and composite technologies of OT are all 99.99% pure Apple TT, and but 1.01% was added to become OT. Right!?</p>
      <p>So, I don't mean to pick on one thing or an author, but making -pedias that spread this erroneous information is in my opinion much, much worse than no -pedia at all.</p>
      <p>History though usually written by the winners, is always edited by someone. Magazines have em! Newspapers have 'em. Books have 'em. Even the little bios in our font database has an editor who looks at the stuff, checks spelling grammar, facts, opinions, and makes suggestion to/demands of the author. Somewhere in the history of reporting on internet innovations, someone thought an unedited database of definitions would be a great idea. They were, in my opinion, wrong. Let's not let our knowledge become trivialized by laziness. </p>
      <p>I have to go take a Wikipedia, and then get on to work, but I look forward to what others think, (I at least am easily editable ;)</p>
