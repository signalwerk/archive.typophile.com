      <p>So, the Wikipedia entry on <a href="http://en.wikipedia.org/wiki/Truetype" rel="nofollow">TrueType</a> is pretty damn good. It has detailed history, including both the Apple and Microsoft connections, and the all-important credit to <a href="/wiki/Sampo%20Kaasila" class="freelinking" rel="nofollow">Sampo Kaasila</a>. The technical bits are also good.</p>
      <p><cite>I’d just like to see the entirety of the Typowiki linked with or imposed upon the type/design portions of Wikipedia perhaps a year from now once our own site is a bit more complete.</cite></p>
      <p>When jlt writes this, the immediate question that comes to mind is whether the copyright licenses between the two wikis are compatible. Certainly, the Wikipedia side is open to such linking or integration, but I have no idea about the Typowiki. Simply declaring that all content in the Typowiki is licensed under the <a href="http://en.wikipedia.org/wiki/Wikipedia:Text_of_the_GNU_Free_Documentation_License" rel="nofollow">GFDL</a> would solve the problem. Is that a practical step? Or do we really want to maintain a barrier so that text cannot flow freely between the two wikis?</p>
