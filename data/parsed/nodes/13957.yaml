      <p>Ah, the drama. This is what it's all about. It's true that when you read a wiki, you have to take it with a grain of salt. That being said, I happen to know that 'editorial' content can be a little wobbly itself, but who can correct it? Of course, the TrueType article you pointed out has been tweaked since you wrote about it. Thanks for the feedback :)</p>
      <p>Of course, there is always the possibility that someone could correct the wiki incorrectly, but that being said, the real power of the wiki is in the edit history, which is yet to be exposed in our case, but it's there. Different viewpoints on controversial topics are quickly exposed as edits are made. If you look closely, you will be able to figure out which authors/edits can be trusted. If nothing else, you know what the different viewpoints are, and can make up your own mind. Equally valuable is the discussion surrounding the article.</p>
      <p>The death of a wiki is a lack of passion from it's audience (or lack of audience alltogether). Then there truly is "no one to clean up". Fortunately, there is no lack of passion in this community, and plenty of people who are either desperate or bored. :)</p>
      <p>&gt;True, but so what? What’s the difference between the two?</p>
      <p>Click on the wiki links :)</p>
