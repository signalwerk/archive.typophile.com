    <p>One of the subjects for the History of Graphic Design in South Louisiana project is James Gabour, 96, who still goes every day to his printing plant in Pineville, Louisiana. </p>
    <p></p><div class="imageWrap"><img src="/web/20081015211546im_/http://www.typophile.com/files/linotype-territory-map_3826.jpg"></div><p></p>
    <p>For a while he was the local Linotype sales and service rep, his region around here was quite large.</p>
    <p>James’ son, Jim Gabour, Artist in Residence and Professor of Video Technology, Loyola University New Orleans told me about his dad and we have been corresponding about him ever since.</p>
    <p>Following is the text from some of that correspondence while setting up my appointment to take James oral history:</p>
    <p>“Sent: Date: Jun 21, 2008 9:43 AM<br>
    To: nancy sharon collins<br>
    Subject: Re: dad</p>
    <p>Thanks, Nancy.</p>
    <p>Dad loves the attention.  The Smithsonian was talking to him about a print museum a couple of years back, right before Bush destroyed their funding.  We have been trying to get him to safeguard this huge amount of material for years.  Maybe your attention will make him value them more.</p>
    <p>My first interview was just to get him to demo the operation and function of all the machines, graphic and type formats before they decayed or that old place burns down.  Later this summer i am going to talk to him more on-camera about history.  </p>
    <p>He has a lot of that:</p>
    <p>he was heavily into Indian motorcycles</p>
    <p>he was a mess sergeant in the army, stationed in panama during WWII</p>
    <p>he went to linotype school in brooklyn for a year or so, then more study in Chicago</p>
    <p>he was shop steward for the printer’s union at the daily where he and my mom met (she was a cub reporter), and when the national union called a strike and the daily replaced everybody with scabs he started up a rival daily that lasted a couple of years</p>
    <p>his linotype territory include northern Mexico</p>
    <p>When he and Mom got those weekly papers, as the eldest i worked three minimum ten-hour days a week after school from age 8 until i left for university at 18 on a press association scholarship.  We started typesetting MON, laid out ads and pages TUE, and worked until midnight or later WED with the press run and printing and affixing mailing labels.</p>
    <p>It was a good experience, and i watched him make it work</p>
    <p>jg</p>
    <p>—</p>
    <p>Sent: Jun 23, 2008 7:11 AM<br>
    To: nancy sharon collins<br>
    Subject: Re: linotype</p>
    <p>when i ride my bike to the gym today i will try and shoot a few pix of the linotype bldg and send them along.  i  will send them to Dad too, as he remembers working in the bldg well</p>
    <p>funny, every time i hold one of those 108-point wood letters in my hand i think of the human energy invested in its existence.  and the metal 2-point no less</p>
    <p>did you see that odd “machine” for hand-setting type on the diagonal?  pretty cool.  i forget what he called it, but i don’t remember it being there in my decade of residence as a child.  he has continued picking up odd bits of print shops that have gone under over the years, and even though he no longer uses them he keeps them in shape and treasures them</p>
    <p>jg</p>
    <p>—</p>
    <p>To: nancy sharon collins<br>
    Subject: empty space<br>
    Date: Jun 25, 2008 2:06 PM<br>
    Attachments: linotype space.jpg<br>
    ﻿<br>
    this is where the linotype bldg stood until very recently, at the corner of Union &amp; Baronne — i went to a few great art-opening parties in its new lobby prior to the storm, and it was a wonderful space.  must have taken a Katrina hit, like many others</p>
    <p>as you can see, when they tore it down they painted where it adjoined the other buildings</p>
    <p>just got its first burst of grafitti</p>
    <p>the passage of time is marked in many ways</p>
    <p></p><div class="imageWrap"><img src="/web/20081015211546im_/http://www.typophile.com/files/linotype-space_4049.1.jpg"></div><p></p>
