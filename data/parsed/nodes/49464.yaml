      <p>Eurostile is one of the few typefaces that I remember giving me this strange, uncomfortable certainty of looking at something exceptionally bulky and misshapen - back in the days when I was a kid and didn’t consciously care about these things.<br>
      I’ve never seen a good logo using eurostile, it always seemed of the day before yesterday to me and - even worse - incredibly cheap. And I’m just talking about logos here.</p>
      <p>I really feel with you my friend, I was forced once to use E.S. for a project. After that, I drove away 2 or 3 clients because I refused to use E.S.</p>
      <p>But I think the best way to use it anyway is to keep it as small as possible with a generously increased tracking.</p>
      <p>Cheers,</p>
      <p>Günni</p>
