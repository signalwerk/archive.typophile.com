    <p>I'm working on some websites for a customer who uses Eurostile. They want to look modern, and have been using Eurostile for 6 months... aside for my general dislike of eurostile, I', just not very good at using it. just as I'm not very good at playing soccer.</p>
    <p>Do you know of corporate/finance sites who use eurostile successfully? Think ge.com, but with eutrostile.</p>
    <p>thanks!</p>
    <p>alex</p>
