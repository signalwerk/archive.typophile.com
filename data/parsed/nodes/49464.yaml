      <p>Eurostile is best in all caps, indeed began it's life as a caps only face.</p>
      <p>I will third the use of Foundry Monoline for text. Call it the text version of Eurostile. I first became aware of Foundry Monoline after visiting MoMA:QNS and viewing their way-finding program. It was, I though, the best looking use of Eurostile I'd ever seen. Turns out it was FM. I couldn't find any decent images of the interior signage at MoMA:QNS since it's now closed (it was the temporary home of MoMA). However, you can see some of it at the portfolio site of the designers: <a href="http://www.twotwelve.com/flash/" title="http://www.twotwelve.com/flash/">http://www.twotwelve.com/flash/</a> &gt;&gt; Projects &gt;&gt; MoMA QNS &gt;&gt; Images 2&amp;3. FM was used for the QNS Matisse Picasso exhibit -- the program used it for text.</p>
