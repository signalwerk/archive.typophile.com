      <p>Context is everything. This maxim was never truer than for logotypes and work marks.</p>
      <p>What baffles me most about some typophilers is their black &amp; white, cut 'n dried view of fonts and typography. Some people here are saying Eurostyle always looks bad, no matter what the context, while others insist it always looks good or is at least an inherently good typeface design.</p>
      <p>In actuality, it all depends on context, yet if the word content / image is sufficiently demanding, certain fonts don't measure up, pack it in early, show their lack of range and teeth. Microgramma / Eurostile is one such font.</p>
      <p>The bold version is partly redeemed from such embarrassment in much the same way as bold Helvetica and Arial.</p>
      <p>Ya know't ah mean? Know't ah mean? Eh? Reet! Reet! Erm. . .well actually erm. . .</p>
      <p>j a m e s</p>
