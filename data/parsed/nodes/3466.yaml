    html: <p>If the list of magazines I had designed was as long as <br><a href="http://www.uniteddesigners.com/" target="_blank">Erik's</a> I might feel entitled (or at least inclined) to write an <br>axiom (or two) about word spaces.  (All I'm saying is he <br>has the luxury of lots (and lots) of experience with both <br>the design <i>and</i> use of type.) <br> <br>In the end, I'm sure you're best off knowing that most <br>people (designers and otherwise) are going to use your <br>fonts as they come, right out of the can.</p>
