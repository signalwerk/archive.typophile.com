  html: <p>Hello Steph, and Typophiles around here. <br> <br> I am searching for some Ligatures ideas for some fonts that i am working on, searching on the web, i cant find a complete (i mean all the posibilities) spec book or something like that. <br> <br> Any Information links about it are wellcome, or pdf files. Ok? Thanks a lot. <br> <br>MH <br> </p>
