    date: 2003-01-22T00:22:00
    date_raw: 22 Jan 2003 — 12:22am
    votes: null
    html: "<p>Basically, there is no \"complete listing\": you can take it as far as you want to. The ct, st, and sp for example are not in use anymore because, due to changing in tastes, most people today find them disruptive in the flow of reading. The sz has been thrown out of modern German, and I haven't seen many examples using the ft and fft-ligatures in Petr van Blokland's Proforma yet. <br> <br>I'll try to post a couple of examples later on.</p>"
