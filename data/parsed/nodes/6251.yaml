    html: "<p>I don't know of a complete listing. I think there isn't yet a <br>font that explores <i>every</i> ligature possibility. <br> <br><a href=\"http://www.myfonts.com/fonts/fontbureau/mantinia/mantiniacc/charmap.html\" target=\"_blank\">Mantinia</a> has some nice cap <a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=10432214612728759&amp;fontname=Mantinia\" target=\"_blank\">examples</a>. <br> <br><a href=\"http://www.myfonts.com/fonts/emigre/mrs-eaves/\" target=\"_blank\">Mrs. Eaves</a> sports so many ligatures they are housed in  <br>seperate sets and sold with a <a href=\"http://www.emigre.com/EFfeature.php?sp=142\" target=\"_blank\">Ligature Maker</a> app. <br> <br>And for an unconventional method of connecting letterforms  <br>see the inventive <a href=\"http://typography.net/type/b_island.htm\" target=\"_blank\">Blue Island</a>. <br> <br>Most common ligatures (off the top of my head): fl, ff, fi, ffl, ffi</p>"
    html_clean: "<p>I don't know of a complete listing. I think there isn't yet a <br>font that explores <i>every</i> ligature possibility. <br> <br><a href=\"http://www.myfonts.com/fonts/fontbureau/mantinia/mantiniacc/charmap.html\" target=\"_blank\" class=\"link-external\">Mantinia</a> has some nice cap <a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=10432214612728759&amp;fontname=Mantinia\" target=\"_blank\" class=\"link-external\">examples</a>. <br> <br><a href=\"http://www.myfonts.com/fonts/emigre/mrs-eaves/\" target=\"_blank\" class=\"link-external\">Mrs. Eaves</a> sports so many ligatures they are housed in  <br>seperate sets and sold with a <a href=\"http://www.emigre.com/EFfeature.php?sp=142\" target=\"_blank\" class=\"link-external\">Ligature Maker</a> app. <br> <br>And for an unconventional method of connecting letterforms  <br>see the inventive <a href=\"http://typography.net/type/b_island.htm\" target=\"_blank\" class=\"link-external\">Blue Island</a>. <br> <br>Most common ligatures (off the top of my head): fl, ff, fi, ffl, ffi</p>"
