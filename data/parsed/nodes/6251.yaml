    html: "<p>Coincidence: I was about to start a thread in general discussions on this very topic. <br> <br>I purchased a license to Mrs. Eaves almost as soon as it came out, and I haven't regretted it for one second. There are some <a href=\"http://www.emigre.com/EF.php?fid=142\"> beautifully inventive ligatures</a> in there (the \"g\" combinations are wicked!). And it works both in display and text settings. <br> <br><a href=\"http://www.emigre.com/dp/getfontpage.php?PChoUL.html\"> Cholla Unicase</a> is a fine example of ligatures in a very contemporary setting, and understandably also ships with <a href=\"http://www.emigre.com/dp/getfontpage.php?PChoUL.html\"> Just van Rossum</a>'s LigatureMaker.</p>"
    html_clean: "<p>Coincidence: I was about to start a thread in general discussions on this very topic. <br> <br>I purchased a license to Mrs. Eaves almost as soon as it came out, and I haven't regretted it for one second. There are some <a href=\"http://www.emigre.com/EF.php?fid=142\" class=\"link-external\"> beautifully inventive ligatures</a> in there (the \"g\" combinations are wicked!). And it works both in display and text settings. <br> <br><a href=\"http://www.emigre.com/dp/getfontpage.php?PChoUL.html\" class=\"link-external\"> Cholla Unicase</a> is a fine example of ligatures in a very contemporary setting, and understandably also ships with <a href=\"http://www.emigre.com/dp/getfontpage.php?PChoUL.html\" class=\"link-external\"> Just van Rossum</a>'s LigatureMaker.</p>"
  - id: 44076
