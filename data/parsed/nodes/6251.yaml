  - id: 44081
    user: 110
    date: 2003-01-22T13:29:00
    date_raw: 22 Jan 2003 — 1:29pm
    votes: null
    html: "<p>Jonathan is right: go over all possibilities with the f overhang and other \"clashing characters\". For example, what's the use of making <b>fl</b> if you don't include <b>fb</b>, <b>fh</b> etc. Really, now the technical constraints are gone, it's all up to you.</p>"
