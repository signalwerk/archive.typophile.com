    html: "<p>Glad you like my site - it looks clean but there are a lot of cobwebs backstage... <br> <br>The parameters of the Flower depend on many things, including personal taste and technical issues (like how bad the paper is). The Aperture ring and the Multiplier depend on how big you want the traps. The Minimum ring (or actually its relation to the Aperture ring) is determined by: how \"trap-heavy\" you want your font to be; and how much work you want to do! <br> <br>Determining the parameters is really trial and error, but the method provides for a lot of flexibility (incliding some things that I haven't shown on that page), and with the right settings can reproduce even the trapping on Bell Centennial to within ~90%, with no imprecise and slow \"creative\" decisions necessary - trapping is one of the few things in type design that can be automated like this, so why not take advantage! <br> <br>hhp <br></p>"
    html_clean: "<p>Glad you like my site - it looks clean but there are a lot of cobwebs backstage... <br> <br>The parameters of the Flower depend on many things, including personal taste and technical issues (like how bad the paper is). The Aperture ring and the Multiplier depend on how big you want the traps. The Minimum ring (or actually its relation to the Aperture ring) is determined by: how \"trap-heavy\" you want your font to be; and how much work you want to do! <br> <br>Determining the parameters is really trial and error, but the method provides for a lot of flexibility (incliding some things that I haven't shown on that page), and with the right settings can reproduce even the trapping on Bell Centennial to within ~90%, with no imprecise and slow \"creative\" decisions necessary - trapping is one of the few things in type design that can be automated like this, so why not take advantage! <br> <br>hhp <br></p>"
