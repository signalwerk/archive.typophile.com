    html: <p>Well, in terms of "amplitude" photo traps are generally bigger, yes* - but I haven't yet developed an appreciation for any <i>structural</i> differences they might have. <br> <br>* In fact photo had so much gain that they would also often put "thorns" at corners, to prevent rounding-off. <br> <br>The traps in the first sample are pretty classic. <br>But that "4" is strange. Besides being very small, those traps are asymmetrical - maybe it was an aesthetic decision in case of use at large sizes? <br> <br>hhp <br></p>
