    html: <p>I think the severe gain in photo was simply a result of imprecise focus, but I could be wrong. <br> <br>But gain really happens any time ink hits trees. <br> <br>Only the best printing from offset can avoid "mechanical" gain - but even then letterforms are subject to optical effects (that trapping can help alleviate). <br> <br>My feeling is that the depth of a trap depends on many factors, but the shape of a trap in any technology is optimally the inverse of a circle - although aesthetics (in case it's printed large) makes itself felt too. <br> <br>Centennials Bold would have to be printed *very* small for those monster traps to be purely optical - my feeling is they're mostly to fight mechanical gain- remember that it was designed for printing on crappy phone-book paper. <br> <br>hhp <br></p>
