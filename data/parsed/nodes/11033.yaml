    html: "<p>Traps aren't just for photosetting. They were used  a <i>lot</i> in the metal days (even stuff done by pantograph), and they're done today by the best digital designers. Some people will tell you traps are unnecessary, but that's really only true if you're just after \"efficiency\", with less regards for quality - that mentality can also be applied to smallcaps, since almost nobody actually uses them! In actuality traps help whenever you set small type and/or use \"lo-fidelity\" printing like in a newspaper - and not just by fighting gain, but also by counteracting optical effects. <br> <br>You don't want trapping to show in large sizes (unless you like that effect - for example Christian Schwartz has been doing that a lot - to good effect), but since digital type favors single masters (no distinction between different sizes), it becomes a trickier decision...  <br> <br>Here's something you might want to check out: <br><a href=\"http://www.themicrofoundry.com/ss_trapping1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_trapping1.html</a> <br> <br>Also, soon you will be able to put trapping into your fonts with the click of a button (if you have FontLab), for free. <br> <br>hhp <br></p>"
