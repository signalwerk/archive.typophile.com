      <p>I think peace-through-force is absurd in China and all failed states where armies point guns at the people to stay in power. Internet censoring is a form of this, a restriction on people's freedom and I don't like it. What I'd like to say is that censoring the internet is one malconceived policy of the Chinese government, without making any wider judgment about Chinese tradition or culture.</p>
      <p>&gt;you were willing to say that East and West are equally valuable--even though they contradict each other at points</p>
      <p>Of course, that's equality and diversity. Having spent a good many years in Asia (not China), I can see good and bad things about both East and West, and in my experience neither comes out on top. In fact there are things about which I hold contradictory opinions, yet Western rationalism disallows that. True or false, right or wrong, good or bad. In my experience, Eastern philosophy does a better job of being non-dogmatic than Western philosophy, which I've also studied for many years. Sometimes that's a useful thing, sometimes it isn't.</p>
