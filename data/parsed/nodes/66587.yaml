  html: |-
    <p>Typophile is a discussion forum, but you’d never know it from the <a href="http://typophile.com/" title="Typophile.com" rel="nofollow">homepage</a>, a baffling and angering display of Flashturbation from a junior Web designer with a point to make that even he can’t articulate properly.</p>
    <p>Seriously: Safari 4 takes 28 seconds to load <em>just the Flash component</em> of the homepage. (I paused my stopwatch when the animated logotype, another useless and unwanted fillip, stopped moving.) You are then presented with an interface, using custom scrollbars and jammed into a little rectangle, to what appears to be the actual purpose of the site – discussion. Select an item and whaddya know – you’re sent away to the actual forum, built mostly around HTML. (Actually, it should be entirely HTML, CSS, and JavaScript; there is no cause for Flash, save perhaps for sIFR.)</p>
    <p>What should the new homepage look like? It should look like the homepage of a site whose owners aren’t trying to show off and who actually want visitors to understand and use the site. The homepage should <em>be</em> <a href="http://typophile.com/forum/" title="/forum/" rel="nofollow">the Forums page</a>. Hire somebody like Jason Santa Maria or Zeldman or Andy Clarke or Simplebits to work on it. But nearly anything would be better than the Flash monstrosity we’re stuck with now.</p>
