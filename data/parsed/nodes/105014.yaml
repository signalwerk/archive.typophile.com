      <p>I think, Dumpling, you've answered your own question. Many, many years ago I was required each year to hand-set in 6-line wood letter the kind of wall calendars I'm sure you are referring to. We produced them for a number of local companies who handed them out to their customers. They were created on a seven by five grid and printed on a Heidelberg 10x15 platen press. A seven by six grid would, as you state, mean that the sixth row would be only partially used.</p>
      <p>Although these calendars didn't have note-making space, our customers liked them for the large numerals; six rows would have meant smaller numerals.</p>
      <p>As to why the doubling is on the last week rather than the first, JamesM's explanation is a good as any. Also, maybe, the 1/8 solution you suggest is similar to 18 whereas a 23/30 (as would occur this September) is much more obvious as two dates. </p>
      <p>It is, as you say yourself, the convention. It's what we're used to and so needs a good reason to change. I recognise that you ask where did it come from and why and I suspect it was simply a straightforward compromise which is now the custom and practice through continued use.</p>
