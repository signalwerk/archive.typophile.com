      <p>I assume you're talking about printed calendars, as I think computer calendars generally have 6 rows when appropriate. At least the one I use (iCal) does.</p>
      <p>I've designed a few printed calendars and have always used 5 rows max because if you had 6 rows the top and bottom rows would be mostly blank, plus all the rows become smaller in height, leaving less room for people to write notes.  </p>
      <p>I've never had a client complain about doubling some dates, but they'll complain if the cells are too small.</p>
      <p>Not sure why the tradition is to double up on the last row (such as "24/31"), but I assume it's because doubling would often occur just on a Sunday when people probably have fewer appointments to jot down, plus (and maybe this is the main reason) it's less obvious than doubling on the top row.</p>
