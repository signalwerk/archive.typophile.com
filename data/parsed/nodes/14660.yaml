      <p><em>We can even test the result sometimes. I'm with Hrant this time: sure this is not a laboratory, but this uses a very similar process, don't you agree?</em></p>
      <p>Certainly, if you’re designing for special needs readers, it helps to know something about those needs, which can be quite varied.</p>
      <p>Nonetheless, I consider the marketplace to be an empirical proving ground for what is functional. It’s true, as Hrant points out, that a lot of garbage gets foisted on the public, but ultimately people will read what works best for them, and publishers facilitate that or they are out of business—although well-meaning governments can provide a bad skew by ﬁnancing wishful thinking.</p>
      <p>**</p>
      <p>Pedro, I put it to you that even your most basic “scientiﬁcally-proven” precept is incorrect. Do you really think that the Old Nicks of this world (of whom I am one) will take kindly to reading books set in sans serif, when we have been reading them set in serifed fonts all our lives? I’m not familiar with libararies in Portugal, but those I have been into elsewhere have large print sections where all the books are set in classic serifed faces. Doesn’t this suggest there is some merit in the practice?</p>
      <p>What happens when you age is that you have to view the text from further away, because you can no longer focus as close as you once could. This reduces type size to below the optimum arc of vision, therefore it needs to be bigger to compensate. It’s that simple! Many people slide their glasses down their nose to bring the type into focus (it’s human nature to “make do” rather than get new glasses)—but that makes the type smaller, again, not enough arc of vision. </p>
      <p>There is also some loss of contrast due to yellowing of the lens.</p>
      <p>I’m talking about the normal deterioration of vision brought about by aging.</p>
