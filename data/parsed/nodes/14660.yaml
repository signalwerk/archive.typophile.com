      <p>Hello everyone:</p>
      <p>I am also interested in finding out a bit more on this subject, more specifically about typefaces for older adults (seniors 65+). Which are more appropriate? What sizes? How much leading? Column width?... These are some of the questions that are arising...</p>
      <p>After a somewhat extensive search online, I couldn't find any relevant information, or resources... I mean, from the type design perspective...</p>
      <p>Tiresias (<a href="http://www.tiresias.org/" title="http://www.tiresias.org/">http://www.tiresias.org/</a>) and APH (<a href="http://www.aph.org/" title="http://www.aph.org/">http://www.aph.org/</a>) both have typefaces they say are appropriate for low vision readers, but I find the overall quality pretty doubtful. Also, I don't know who their designers were, and I haven't seen any credible results published...</p>
      <p>W3C (<a href="http://www.w3.org/" title="http://www.w3.org/">http://www.w3.org/</a>), AARP (<a href="http://www.aarp.org/" title="http://www.aarp.org/">http://www.aarp.org/</a>) and AGElight (<a href="http://www.agelight.com/" title="http://www.agelight.com/">http://www.agelight.com/</a>) have all published some guidelines, but only agree on the use of sans serif typefaces, from ~12 pt upwards...</p>
      <p>Irene Strizver (2004) also recommends some type settings, but doesn't provide any definitive answer. </p>
      <p>Can someone help me find more information, or fonts with enough documentation on this?</p>
