      <p>Let me try to compile a starters list with the recommendations based on the literature below (for seniors/older adults): </p>
      <ol>
      <li> Typeface:<br>
        1a) sans serif;<br>
        1b) legible: high x-height, wide horizontal proportions, pronounced extenders, pronounced/disctinct finishing strokes and crossbars, open counters, consistent low modulation strokes, distinct glyph set (*1);<br>
        1c) large body (*2);<br>
        1d) use the minimum number of fonts possible;<br>
        1e) roman-regular type style (*8);<br>
        1f) avoid decoration (*6);<br>
        1g) Use of Sentence or Mixed Case forms;
      </li><li> Spacing and alignment (in comparison to normal vision reader materials);<br>
        2a) wider letter spacing;<br>
        2b) increased line height;<br>
        2c) increased spacing on images, graphics and page layout elements (gutters, margins, etc) (*3);<br>
        2d) Left-hand alignment;
      </li><li> Structure of the text:<br>
        3a)  clear contrast between structure/functions like headings, subheadings, lead, body, captions, etc (*7);<br>
        3b) smaller, or more separated units of text (*4) (*8);<br>
        3c) use structures like bullet lists, or boxes to highlight, or separate (*8);
      </li><li> Color:<br>
        4a) bright, avoiding low saturation, or vibrant (*5);<br>
        4b) dark on light (AKA, black type on white backgrounds);<br>
        4c) avoid reverse outs and background patterns;
      </li></ol>
      <p>The problem is that this is an interdependent variable system... Some of these are really simple science/lab tested result based decisions (like 1a). Others... well... </p>
      <p>——<br>
      Notes:</p>
      <p>(*1) We know what is constitutes a legible typeface (see the literature here, or start with this one: <a href="http://www.aiga.org/typography-and-the-aging-eye/" title="http://www.aiga.org/typography-and-the-aging-eye/">http://www.aiga.org/typography-and-the-aging-eye/</a>. But what should we use and how to test the different selected options on a screen prototype? APHont, or Tiresias seem like viable candidates, but really, Verdana is a time tested, master designed typeface.</p>
      <p>(*2) For print sizes, recommendations vary a bit, but seem to be between 12 and 14 pt for body size. On screen, what should we use?</p>
      <p>(*3) Agelight proposes: "It is suggested you leave a wide margin of 1 1⁄2 or more inches on the right side of the page to maximize usability with different monitor types, window sizes and display resolutions."<br>
      It's a bit outdated...</p>
      <p>(*4) Agelight proposes: "Short pages, those containing one or two screens of text, work well for the homepage and menu pages when users are scanning for informational links. Longer pages, although they require more scrolling, may work well for destination pages where related content can be printed and read/scanned together. Avoid creating large pages with multiple articles and links. Break topics down into succinct pages for usability and printing."</p>
      <p>(*5) Agelight proposes: "bright, fluorescence or vibrant can have edges that appear to blur and create after-images,which fatigue the eye [...] the safest colors to use are black, white, blue and yellow where as red, green brown, grey and purple can be troublesome.</p>
      <p>(*6) From Agelight: "Drop shadows on text, often used to give words the appearance of depth, can be difficult to decipher."</p>
      <p>(*7) Agelight &amp; Strizver recommend body size between 12 and 14 pt. Agelight recommends titles two points larger, but I disagree. Type should be CLEARLY contrasting in size, using a rule of thumb to have a 4 pt difference step, or a 10-20% difference in size (depending on typeface and body selected).</p>
      <p>(*8) From Agelight: "Limiting the use of bold to emphasize a title or a key word is recommended.". Condensed / expanded are also not recommendable. Strivzer also adds: "Use boldface to emphasize a word or a small group of words. Keep use of italics to a minimum; research indicates that italic type is 18 percent more difficult to read than Roman (upright) letters."</p>
      <p>——<br>
      References:<br>
      2001 - AGELIGHT - Interface design guidelines for users of all ages<br>
      2001 - Bernard - Liao - Mills - font type size affect reading time<br>
      2004 - Strizver - 26FYTIDesigningforSeniorsITC<br>
      2004 - University of Washington - Low Vision FAQ<br>
      2005 - AARP - Designing Web Sites for Older Adults - Heuristics<br>
      2005 - Arditi - Serifs and font legibility<br>
      2006 - Nini - AIGA - Typography and the Aging Eye- Typeface Legibility for Older Viewers with Vision Problems<br>
      2007 - Russell-Minda et al. - The legibility of typefaces for readers with low vision - a research review<br>
      2007 - Yaffa - The Road to Clarity<br>
      2008 - W3C - Web Accessibility for Older Users - A Literature Review<br>
      2009 - Tiresias - Fonts checklist<br>
      2009 - Tiresias - How to make fonts and typefaces accessible for people with disabilities<br>
      2009 - Tiresias - Typefaces and legibility<br>
      2010 - ADA Standards (Chapter 7)</p>
      <p>P..S.: Sorry Christopher... still haven't gone through your reference list, but will soon!</p>
