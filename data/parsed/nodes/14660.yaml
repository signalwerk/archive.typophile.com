    html: |-
      <p>@JamesM:<br>
      <cite>All caps is harder to read. If it's just a few words it's not a big deal, but setting sentences in all caps reduces readability.</cite></p>
      <p>I'm aware of that. The term "low vision" has a specific meaning, and I have taken it to refer to people with so profoundly impared vision that it is no longer practical to concern oneself with readability, and even achieving legibility will require every resource at our command.</p>
      <p>@riccard0:<br>
      <cite>informaton ≠ ink</cite></p>
      <p>Yes. You'll note I said 50% and not, say, 80%.</p>
      <p>The information content of a page at any given level of maximum resolution, assuming only the two colors of black and white may be used, indeed does reach a maximum when ink coverage is at 50%.</p>
      <p>This is basically for the same reason that if you have identical checkers of two colors, and you arrange them in a row, there are more possible arrangements of nine red checkers and nine black checkers than there are of six red checkers and twelve black checkers.</p>
      <p>Information does not equal ink. In this context, it equals the difference between where the ink is and where the ink is not.</p>
