      <p>I think "low-vision" and visual acuity of aging adults (ouch!) are issues that can be clearly (ouch again) addressed with research and studies related to type sizes and letterform, as you are involved with.</p>
      <p>I believe your mention of learning disabilities (inclusive of dyslexia, dyscalculia, dysgraphia, dyspraxia, and visual processing  disorder) involves a completely different area of research not fully dependent on character recognition itself.</p>
      <p>By no means do I understand the issues related to such disorders, but one of my business partners is heavily involved with <a href="http://www.edvocacy.org/prob2.htm" target="new" rel="nofollow">Edvocacy.org</a>, a not-for-profit organization dedicated to establishing a national early recognition program for children with dyslexia. (Visit the link and take the little decoding test to give you a sense of what dyslexic readers go through.)</p>
      <p>My wife also happens to work for <a href="http://www.landmarkoutreach.org/res_e_faq.htm" target="new" rel="nofollow">The Landmark School</a> which is one of the best known private educational facilities for children with reading and learning disorders. Of what I know of their mission is that they are training the students to decode and reprocess information encountered in their daily lives.</p>
      <p>Through my wife, I have recently contacted Landmark to see if I could participate in or contribute to the school's art program (all of their teachers are required to have Masters in Special Education). I have been toying with the idea of letterform collages, innovative calligraphy and found object alphabets (inspired by both Nick Shinn and <a href="http://www.dorpdal.com/lettered/pebble1.html" target="new" rel="nofollow">Clotilde Olyff</a>). In that way it would just be the joy of shapes and recognized individual forms as art, and not for reading comprehension.</p>
      <p>So many ideas, so little time... (at least another 50 years I hope).</p>
