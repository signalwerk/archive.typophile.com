      <p>Sadly, there hasn't been a lot of good research into which typefaces and sizes are best for low vision. However, the research that does exist suggests that type size and text design choices are more critical than the typeface choice. Considering issues of colour contrast, line length, leading, and —because this is an exhibition— placement of text in the environment will make a larger difference to a reader than choosing Plantin over Minion. </p>
      <p>Granted, one should use a reasonable typeface for the job. Here the research that is available suggests choosing a typeface that is well spaced and on the slightly heavier side. The ADA and SEGD guidelines can help here to weed out typefaces that are too light. Doing some informal user testing will also help, especially when choosing a type-size and colour combinations.</p>
      <p>There aren't a lot of good studies to recommend on this subject: I've looked at a lot of the research (I can give you my bibliography if you're interested) and have concluded that a lot more research needs to be done, especially research geared to giving good guidelines to working designers. </p>
      <p>I can suggest reading Alison Shaw's <em>Print for partial sight</em>. It is getting dated, but it is the best study of typeface and type size for low vision. This isn't to say that it is perfect, but it is the most comprehensive study to date. You could also look at the research of the <a href="http://vision.psych.umn.edu/~gellab/" rel="nofollow">Minnesota Laboratory for Low-Vision Research</a>. It's some of the best work being done currently, but it is aimed at optometrists. Lastly, <a href="http://www.chip.uconn.edu/people/profile%20pages/pe_zoestrickler.htm" rel="nofollow">Zoe L. Strickler</a> has done some interesting research (published in <em>Visible Language</em>) in designing interactive systems for older adults and low vision. Though it is about interaction design, it does say a lot about design in general for low vision and older adults.</p>
      <p>Hope that helps, and isn't too much.</p>
      <p><strong>References</strong><br>
      Shaw, A. (1969). <em>Print for partial sight: a report to the Library Association Sub-Committee on Books for Readers with Defective Sight</em>. London, Library Association.</p>
      <p>Strickler, Z., &amp; Neafsey, P. J. (2002) Visual design of interactive software for older adults: Preventing drug interactions in older adults. <em>Visible Language</em>. 36(1), 4-28.</p>
