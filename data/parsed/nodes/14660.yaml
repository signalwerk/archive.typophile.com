      <p>Choosing a typeface and designing a page layout with type spec has very little to do with science.</p>
      <p>The best way to find what’s appropriate for a particular market, demographic, tranche or whatever of the population is to study the present practice in that area, or, if you are not the designer, hire someone with the appropriate experience.</p>
      <p>For low vision readers, the trick is to make the type large while retaining a certain amount of grace in the layout.</p>
