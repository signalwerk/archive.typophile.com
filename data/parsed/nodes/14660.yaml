      <p>Finally found some more information on Clearview Type System: <a href="http://clearviewhwy.com/ResearchAndDesign/researchWhitepapers.php" title="http://clearviewhwy.com/ResearchAndDesign/researchWhitepapers.php">http://clearviewhwy.com/ResearchAndDesign/researchWhitepapers.php</a></p>
      <p>It seems to have been designed by Donald Meeker and James Montalbano. Of the three typefaces I've encountered, designed specifically for low vision conditions (Tiresias, APHont) and stress conditions (Clearview), this is the only one to have been designed by professional Designers and improved/finished by a Type Designer, and to have been properly (and scientifically?) tested.</p>
      <p>There is no information about the Tiresias typefaces' designer, and the development team claims to have tested the Tiresias Typeface.  But they only provide (an useful) checklist: <a href="http://www.tiresias.org/research/guidelines/checklists/fonts_checklist.htm" title="http://www.tiresias.org/research/guidelines/checklists/fonts_checklist.htm">http://www.tiresias.org/research/guidelines/checklists/fonts_checklist.htm</a>. Neverthless, I can't seem to find any published results.</p>
      <p>As with Russel-Minda et al. (<a href="http://findarticles.com/p/articles/mi_6836/is_7_101/ai_n28446295/pg_8/" title="http://findarticles.com/p/articles/mi_6836/is_7_101/ai_n28446295/pg_8/">http://findarticles.com/p/articles/mi_6836/is_7_101/ai_n28446295/pg_8/</a>) I couldn't find any published results for APHont's use, although they do publish some guidelines online... Once again, no information about the designer...</p>
      <p>It seems that legibility (and readability) is still a very confusing and an ill documented area of Graphic and Type Design. Especially regarding user testing... Most of the more interesting papers published (at least regarding the testing methodology) are from people who really don't seem to have a clue about well designed type shapes.</p>
      <p>I encourage you to take a look at one of the most relevant (?) authors I found as an example: <a href="http://www.ncbi.nlm.nih.gov/pubmed/16099015" title="http://www.ncbi.nlm.nih.gov/pubmed/16099015">http://www.ncbi.nlm.nih.gov/pubmed/16099015</a>.</p>
      <p>Tell me what you think of this...</p>
