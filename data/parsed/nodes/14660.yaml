      <p>@Thomas Phinney:<br>
      <cite>Why would you have made each of those assumptions?</cite></p>
      <p>A fair question.</p>
      <p>I'll start with the one that's the easiest to defend.</p>
      <p><em>Very</em> bold.</p>
      <p>For printing to be legible at the lowest possible optical resolution, you have to maximize the total information content relative to feature size.</p>
      <p>Which leads to the conclusion that, on average, approximately 50% of the paper should be covered by ink.</p>
      <p>Bulging stems, flared corners, otherwise weird-looking?</p>
      <p>I'm assuming this font, to be usable for people with a severe visual impairment, is going to be designed so that it would be legible to people with normal vision <em>in a two-point size</em>.</p>
      <p>So I'm envisaging that somehow it is going to be designed to compensate for being blurred. The techniques I'm thinking of are similar to ones used in the design of masks for the photolithography of integrated circuits so that features appear to be neater and more rectangular than seems to be possible given diffraction-limited resolution of the wavelength of light used.</p>
