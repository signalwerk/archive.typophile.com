    user: 1250
    date: 2012-05-06T07:45:00
    date_raw: 6 May 2012 — 7:45am
    votes: null
    html: |-
      <blockquote><p>The best way to find what’s appropriate for a particular market, demographic, tranche or whatever of the population is to study the present practice in that area</p></blockquote>
      <p>But then all you're doing is further entrenching the status quo (which too often is based on other people's -often bad- taste). Although it's not enough by itself, science can play a role in anything (even mixing paint for abstract art). And it's great at dispelling intuitive assumptions like "the type should be large"; there are many flavors of "low-vision" and one needs to learn the science behind them to be a good designer.</p>
      <p>Science is not about universities or lab equipment. Science is about an attitude - an attitude central to Design.</p>
      <p>hhp</p>
