      <p>If someone's vision is so bad that they must decipher one character at a time, they'll probably stop reading except perhaps for things that are extremely short, like a label or a note consisting of a few words.</p>
      <p>A friend of mine went virtually blind from macular degeneration. In the early stages she could get by with large-type books, magnifying lenses, etc., but after a certain point it became impractical and started using books on tape or asking a relative to read to her.</p>
