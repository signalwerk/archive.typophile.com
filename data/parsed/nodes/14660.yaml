      <p>David: </p>
      <p>I also don't know which or how to apply the "large format" factors... It seems to me that common sense and much testing is needed. But how to do it?.</p>
      <p>For seniors (older adults) current recommendations vary... The common denominator seems to be to recommend the use sans serif typefaces in large sizes (e.g.: type for reading on screen ~14pt).  I can't imagine what to do in large format graphic panels (and here ADA can provide some guidelines). Although it seems to contradict the maxim of "we read best what we read more", I think the sans serif recommendation is due to the fact that sans serif typefaces may help increase the white space and avoid unnecessary visual clutter (without dismissing the serifs' function, though). </p>
      <p>Although older adults aren't necessarily people with disabilities, low vision, speed of reading and cognition problems come with age (and yes... many of us will suffer from most of these!):</p>
      <blockquote><p>"Of people aged ≥ 70 years, 18% report blindness in 1 or both eyes or some other trouble seeing, 33.2% report problems with hearing, and 8.6% report problems with both hearing and seeing.1 Precisely because these experiences are so common, they are often overlooked or dismissed.2 Moreover, normal age-related changes in hearing and vision may be con- fused with abnormal sensory changes that can compromise function. Likewise, abnormal changes due to eye and ear pathology may be confused with normal age-related sensory changes."<br>
      <a href="http://ajph.aphapublications.org/doi/pdf/10.2105/AJPH.94.5.823" title="http://ajph.aphapublications.org/doi/pdf/10.2105/AJPH.94.5.823">http://ajph.aphapublications.org/doi/pdf/10.2105/AJPH.94.5.823</a></p></blockquote>
      <p>And it's not exclusive to US Older Adults. It's more or less the same everywhere.</p>
      <p>I couldn't find much information on the Clearview Typeface specification/reports/Designer(s) (other than Wikipedia: <a href="http://en.wikipedia.org/wiki/Clearview_%28typeface%29" title="http://en.wikipedia.org/wiki/Clearview_%28typeface%29">http://en.wikipedia.org/wiki/Clearview_%28typeface%29</a>), but I found an interesting read on Chpater 7 of ADA's 2010 Specifications: <a href="http://www.ada.gov/regs2010/2010ADAStandards/2010ADAStandards.pdf" title="http://www.ada.gov/regs2010/2010ADAStandards/2010ADAStandards.pdf">http://www.ada.gov/regs2010/2010ADAStandards/2010ADAStandards.pdf</a> </p>
      <blockquote><p>"703 Signs<br>
      703.1 General. Signs shall comply with 703. Where both visual and tactile characters are required,<br>
      either one sign with both visual and tactile characters, or two separate signs, one with visual, and one<br>
      with tactile characters, shall be provided.<br>
      703.2 Raised Characters. Raised characters shall comply with 703.2 and shall be duplicated in braille<br>
      complying with 703.3. Raised characters shall be installed in accordance with 703.4.<br>
      703.2.1 Depth. Raised characters shall be 1/32 inch (0.8 mm) minimum above their background.<br>
      703.2.2 Case. Characters shall be uppercase.<br>
      703.2.3 Style. Characters shall be sans serif. Characters shall not be italic, oblique, script, highly<br>
      decorative, or of other unusual forms.<br>
      703.2.4 Character Proportions. Characters shall be selected from fonts where the width of the<br>
      uppercase letter “O” is 55 percent minimum and 110 percent maximum of the height of the<br>
      uppercase letter “I”.<br>
      703.2.5 Character Height. Character height measured vertically from the baseline of the character<br>
      shall be 5/8 inch (16 mm) minimum and 2 inches (51 mm) maximum based on the height of the<br>
      uppercase letter “I”<br>
      703.2.6 Stroke Thickness. Stroke thickness of the uppercase letter “I” shall be 15 percent<br>
      maximum of the height of the character.<br>
      703.2.7 Character Spacing. Character spacing shall be measured between the two closest points<br>
      of adjacent raised characters within a message, excluding word spaces. Where characters have<br>
      rectangular cross sections, spacing between individual raised characters shall be 1/8 inch (3.2 mm)<br>
      minimum and 4 times the raised character stroke width maximum. Where characters have other<br>
      cross sections, spacing between individual raised characters shall be 1/16 inch (1.6 mm) minimum<br>
      and 4 times the raised character stroke width maximum at the base of the cross sections, and 1/8<br>
      inch (3.2 mm) minimum and 4 times the raised character stroke width maximum at the top of the<br>
      cross sections. Characters shall be separated from raised borders and decorative elements 3/8 inch<br>
      (9.5 mm) minimum.<br>
      703.2.8 Line Spacing. Spacing between the baselines of separate lines of raised characters within<br>
      a message shall be 135 percent minimum and 170 percent maximum of the raised character height."
      </p></blockquote>
      <p>Ok. Once again, sans serif is the type selection of choice.</p>
      <p>Although I find hard to agree, ADA even provides character proportions, body size, line height and different spacing settings. but wait a second... uppercase characters? And doesn't different character drawings of structure/stroke/modulation/contrast imply different settings?...</p>
      <p>This is all starting to look like a huge mess to me... So I agree with you... Maybe the .gov is "too narrow" of a selection for a more general purpose group... Maybe we should try to evaluate what the readability and legibility is for each situation? How to do it?</p>
      <p>BTW: Where can I find out more on Clearview?</p>
