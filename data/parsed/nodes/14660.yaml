      <p>Placement, type sizes, lighting, distances, are all variables that need as much attention as typeface choice in an exhibit design. I assume the type is used at display sizes? </p>
      <p>Since the lighting in a traveling exhibit is an uncontrolled variable, you'll need to ensure contrast between type and background. Choose colors for both with plenty of contrast. </p>
      <p>Terry B. recommended to me the fine book "Wayfinding: People, Signs and Architecture", which deals with more general issues of clear wayfinding. Those ideas are useful in an exhibit context, I think.</p>
