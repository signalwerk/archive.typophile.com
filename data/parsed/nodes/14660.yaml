      <p>See also:</p>
      <p>Canadian Department of Heritage (1994). <em>Access series: design guidelines for media accessibility</em>. (Cat. No. R64-182/5-1993E)</p>
      <p>Mansfield, S., Legge, G. E. and Bane, M. C. (1996).  Psychophysics of Reading. XV: Font Effects in Normal and Low Vision. <em>Investigative Ophthalmology &amp; Visual Science, (37)</em>8. 1492–1501.</p>
      <p>And if you are interested in reading and dyslexia, my past supervisor wrote the book on it:</p>
      <p>Klein, R. &amp; McMullen, P. (1999). <em>Converging Methods for Understanding Reading and Dyslexia</em>. Cambridge. MIT Press</p>
      <p>A quick database search through my university gave me a tremendous amount of results, but you’d need database access to get at the the articles. At the bottom of the abstract page of the Mansfield (1996) article there some good references that cite it. I haven’t read Mansfield, so I can’t tell you if the science sucks or not, but it has been my experience that in science and typography research land, the work that has been done is thin, and mostly crappy.</p>
      <p>You might find a few interesting references in the literature section of my website:</p>
      <p><a href="http://readthetype.com/literature/" title="http://readthetype.com/literature/">http://readthetype.com/literature/</a></p>
