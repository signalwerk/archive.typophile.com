    html: <p>And another trick to help you in your lit-review is to start with a new article, preferably from a relevant journal with a high impact factor, go to its references section, and see what articles it references and go from there (back in time). Conversely, if you use Web of Science as your database of choice, there is a link on bottom to create forward and backward citation maps (which tend to be somewhat flaky) and a “times cited” link at the top of the article which will give you a complete list of all articles that have cited the one you are looking at since its time of publication (forward in time). By using this method, you can attack your subject from two sides at once.</p>
