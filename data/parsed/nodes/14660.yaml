      <p>&gt; more specifically about typefaces for older adults<br>
      &gt; (seniors 65+). Which are more appropriate? What sizes? </p>
      <p>Seems to me that you're lumping together a very broad range of users. Vision obviously changes as we get older, but it's still extremely variable. My 90-year-old mother still reads standard books and magazines without difficulty, but she has a friend in her 70s with macular degeneration who is almost blind. There's not going to be a point size recommendation that's appropriate for everyone over 65.</p>
      <p>I'm all for research in this area, although I think many of the findings are largely common sense (use an easy-to-read font, bump up the point size, etc.).</p>
      <p>Not sure if this will be of any help to you, but some computer companies may have done some research on readability on monitors for folks with disabilities. For example, Apple has a page discussing some special computer settings for users with poor eyesight. Not a lot of info, but it's interesting that they have settings for making the screen high contrast and the option to reverse black and white. (I'm not even sure why reversed type would be easier for some with impaired vision to read, but apparently it is in some cases.)<br>
      <a href="http://www.apple.com/accessibility/macosx/vision.html" title="http://www.apple.com/accessibility/macosx/vision.html">http://www.apple.com/accessibility/macosx/vision.html</a></p>
