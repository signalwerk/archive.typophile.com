      <blockquote><p>people will read what works best for them</p></blockquote>
      <p>People will read the <em>content</em> they either <em>want</em> to or <em>have</em> to read. The degree of motivation is inversely proportional to how good the typography needs to be to enable the completion of the reading task. Our job is to make the typography functional whether we can get away with doing a crappy job or not (and from all appearances frankly we can get away with quite a bit). I <em>wish</em> poor typography was a good predictor of failure!</p>
