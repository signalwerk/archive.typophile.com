      ——</p>
      <p>Nick:<br>
      Let me agree and disagree. When you have a design brief, sure you have to make and educated, aesthetic-based decision. We do it all the time. We evaluate the client and research the target audience, we evaluate and research the contents and we prototype the design.  We can even test the result sometimes. I'm with Hrant this time: sure this is not a laboratory, but this uses a very similar process, don't you agree?</p>
      <p>Many, many factors taken into account in this process are also some kind of science. You know that choosing a typeface will change the reading speed, the white space, the copy structure/hierarchy, etc... If you do it more intuitively, or more scientifically... well I thinks its up to each one of us. </p>
      <blockquote><p>For low vision readers, the trick is to make the type large while retaining a certain amount of grace in the layout.</p></blockquote>
      <p>Couldn't agree more!  See below my first attempt to try to compile a recommendation list.</p>
      <p>——<br>
      About these papers/researches, I keep struggling with some things like the methods and results they provide. Some are really contradictory to my experience/design education. For example, quoting the abstract from Psychophysics of Reading: </p>
      <blockquote><p>Data were collected using versions of the MNREAD Acuity Chart printed with the Times (proportionally spaced) and Courier (fixed-width) fonts.</p></blockquote>
      <p>With this, they cant test vision acuity (AKA legibility?) regarding the selected typeface (no doubt here). But they provide reading speed results... also with a MNREAD chart? Of course they found something we already know for users with normal vision:</p>
      <blockquote><p>Maximum reading speeds for normal subjects were 5% faster with Times than with Courier (P &lt; 0.001), but for subjects with low vision, maximum reading speeds were 10% slower with Times than with Courier (P &lt; 0.05). [...] For normal subjects, the differences are slighter, with an advantage in reading speed for Times. However, for print sizes close to the acuity limit, choice of font could make a significant difference in both normal and low-vision reading performance. </p></blockquote>
      <p>My problem with these is that they fail to present the samples used for testing. This is a matter also raised by Albert Jan-Pool at ATypI in Dublin during one presentation. </p>
      <p>And, whenever they provide them, the testing materials are poorly designed. No wonder the results are what they are... remember this one: <a href="http://web.princeton.edu/sites/opplab/papers/Diemand-Yauman_Oppenheimer_2010.pdf" title="http://web.princeton.edu/sites/opplab/papers/Diemand-Yauman_Oppenheimer_2010.pdf">http://web.princeton.edu/sites/opplab/papers/Diemand-Yauman_Oppenheimer_...</a></p>
