    html: |-
      <p>Sudtipos calligraphic fonts are packed with this kind of stuff. iStock has tons of stuff, and there are stock packs of ornaments like this that you can buy. </p>
      <p>If you want to do this in illustrator the calligraphic brushes don’t cut it, you really need to draw custom art brushes from paths that taper and keep applying them to the stroke to get what you want. Another option is to draw unstroked paths in Illustrator, print them, trace them with calligraphy markers, and then scan those to retrace digitally.</p>
