    html: <p>Illustrator (or vector artwork program of your choice) is your friend. You make 'em. Or you can buy dingbat fonts that have such elements (or even regular fonts that have them), but really it's very easy to do on your own. Set up some custom illustrator brushes and have a go. The ones that are worth keeping, save in an illustrator file that you can then load as a Illustrator brush set for future projects.</p>
