    html: |-
      <p>Nice example, Oprion!</p>
      <p>There are a number of pre-fab font and stock options for this, such as Aridi Printers Ornaments or Bickham Script ornaments.</p>
      <p>But I have found that a pre-fab ornament rarely works. And while I'm no master swoosh illustrator. I definitely agree that drawing, even a simple rudimentary ornament, is the way to go if possible.</p>
      <p>Oprion's brush trick is a good one. In addition to drawing shapes by hand, you can also use the spiral tool and the blend tool to create smooth shapes. But if you have difficulty using the pen tool, the only substitute is additive/subtractive combining of paths using Pathfinder.</p>
      <p>Also, if you can draw by hand, you can scan and trace ornaments. A lot of people use this method because it frees you up to try lots of different ornament arrangements.</p>
