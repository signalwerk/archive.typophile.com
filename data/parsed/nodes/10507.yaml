  html: "<p>This question seems basic but I am not able of including one space character between two words in Fontlab when I make tests of kearning (Preview / Metrics). I follow the Mr. Carbaga manual (Learn Fontlab Fast)&nbsp;: <i>see page 72&nbsp;: To add the Space character to a string, type\\0020 (then a space…</i>. I did but nothing happen. <br><br>Help please!&nbsp;Thanks</p>"
