    html: |-
      <p>It's a typeface by Hal Fiedler, developed for Photo-Lettering, Inc.  </p>
      <p>Not sure what it's called exactly, but it can be found in one of Photo-Lettering's Alphabet Thesauruses.  No digital version exists.  </p>
      <p>The closest digital types are Fielder Gothic and California Grotesk Medium.  Both can be found at <a href="/wiki/myfonts.com" class="freelinking" rel="nofollow">myfonts.com</a>.</p>
