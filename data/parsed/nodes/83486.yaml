      <p>The newest version of InDesign can create publications for the iPad using the new .issue format. Wired Magazine and several other publications use it to create their iPad magazines.</p>
      <p><a href="http://layersmagazine.com/using-indesign-to-publish-your-ipad-magazine.html" title="http://layersmagazine.com/using-indesign-to-publish-your-ipad-magazine.html">http://layersmagazine.com/using-indesign-to-publish-your-ipad-magazine.html</a></p>
      <p>If you want to try it, you can download a free trial version of InDesign 5.5 at Adobe's site. It's fully functional but will only work for 30 days unless you buy it.</p>
    html_clean: |-
