    html: |-
      <p>Does the .issue format vector support vector graphics and/or embedded fonts? </p>
      <p>Your app/method of choice dependes on a lot of things: How big is your budget? How are you going to make money on this? Are you going to make money on this? Is the current paginated app style the best model (read some of iA's musings on that one -- swiping vs. scrolling)? Do you have a budget for font licenses (embeddable tends to be expensive)? What level of user interaction do you need? Do you want people to be able to read your magazine offline? Have you considered other platforms?</p>
      <p>I went through a process like this a while back and found the best solution for my clients needs was a website custom tailored to the iPad's resolution, orientation modes and "touchability".</p>
