  html: |-
    <p>Looking for the letters/ numbers on the key caps - special characters on the key-pad will have to be reproduced separately.</p>
    <p>This keyboard was made before the days of "computer fonts" and the font may have been created by Apple just for this keyboard. I am looking for the closest I can get - Thanks for your help!</p>
