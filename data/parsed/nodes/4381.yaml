    html: "<p>Chinese fonts r divided into 2 sets: traditional chinese (for TW, HK markets), and Simplified chinese (for PRC, S'pore). Esssentially, the origin is the same, the former having more complicated strokes. <br> <br>Each version then breeds 2 very diff sets of font characteristics. I pefer the TC, they look more modern, cleaner and take away the offending serifs from the sans serif group. <br> <br>to look at it another way, each chinese character not only has a meaning but itself is an unique  graphical icon. There r 26 roman alphabets, but more than 20,000 chinese words. it's madness though the use of it in design is almost unlimited. <br> <br>Monotype has nice Chinese fonts (both TC and SC), diversifying into Chinese serifs and sans serifs, plus decor, round-edge fonts. <br> <br>variety is limited, due to the ardous task involving the design of the typeface which has just too many characters to consider. </p>"
    html_clean: "<p>Chinese fonts r divided into 2 sets: traditional chinese (for TW, HK markets), and Simplified chinese (for PRC, S'pore). Esssentially, the origin is the same, the former having more complicated strokes. <br> <br>Each version then breeds 2 very diff sets of font characteristics. I pefer the TC, they look more modern, cleaner and take away the offending serifs from the sans serif group. <br> <br>to look at it another way, each chinese character not only has a meaning but itself is an unique  graphical icon. There r 26 roman alphabets, but more than 20,000 chinese words. it's madness though the use of it in design is almost unlimited. <br> <br>Monotype has nice Chinese fonts (both TC and SC), diversifying into Chinese serifs and sans serifs, plus decor, round-edge fonts. <br> <br>variety is limited, due to the ardous task involving the design of the typeface which has just too many characters to consider. </p>"
