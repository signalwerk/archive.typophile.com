    html: <p>I know a very little bit of chinese (one doesn't learn so much in three semesters), and I know even less about chinese fonts. <br> <br>However, I do work with them occasionally. OpenType together with InDesign sets them very nicely. I've taken text out from Word of PDF files that were typed on chinese PCs without any problems. <br> <br>Still, I'm limited to what ships standard with Adobe, Apple, or MS products. I wouldn't know how to tell a quality face. Most of the time, I pick whichever of the faces resembles the latin-based face that I'm using at the moment, since the documents that I make with chinese are always at least 50% english or german.</p>
