    html: <p>Traditional and simplified characters do not have the same "origins" at all! Traditional characters have been in use for thousands of years, while simplified characters were a product of Mao's reforms during the 1950s. I heard a great lecture once by Chris Vermaas, in which he talked about the birth of simplified characters. <br> <br>Imagine, he said, if Bill Clinton* were to announce that, as of tomorrow, the US would no longer permit the use of the horizontal strokes within the Roman Alphabet. He said that Mao attacked the ancient chinese writing system, "like a madman with scissors." <br> <br>Unfortunately, almost the entire PRC (and Singapore!) use SC, while only Taiwan and HK use the traditional characters. So, the days of traditional characters are probably over. <br> <br>I was surprise to hear you say that the TCs appear more modern to you, since they are older, but hey. They look good. <br> <br> <br>*Bill Clinton was still US president at the time of the lecture.</p>
    html_clean: <p>Traditional and simplified characters do not have the same "origins" at all! Traditional characters have been in use for thousands of years, while simplified characters were a product of Mao's reforms during the 1950s. I heard a great lecture once by Chris Vermaas, in which he talked about the birth of simplified characters. <br> <br>Imagine, he said, if Bill Clinton* were to announce that, as of tomorrow, the US would no longer permit the use of the horizontal strokes within the Roman Alphabet. He said that Mao attacked the ancient chinese writing system, "like a madman with scissors." <br> <br>Unfortunately, almost the entire PRC (and Singapore!) use SC, while only Taiwan and HK use the traditional characters. So, the days of traditional characters are probably over. <br> <br>I was surprise to hear you say that the TCs appear more modern to you, since they are older, but hey. They look good. <br> <br> <br>*Bill Clinton was still US president at the time of the lecture.</p>
