    <p>Hello.<br>
    I am currently half way through my honours in Graphic Design.<br>
    After my graduation, I need to do another 1year course in design related area.</p>
    <p>I was doing some research and looking at some 1year web-design courses, and having some trouble finding a programme to suit me (ideally want some interactive flash with a big emphasis on Advanced Action Script) So i started thinking what else I would like to do.</p>
    <p>Though I very much doubt there is a professional type design course, I thought I’d ask here to make sure. So if anyone knows of a type design programme in Melbourne, please let me know.</p>
    <p>Alternatively if per chance any of you have suggestions about a good 1year flash/interactive design course, that would be good also.</p>
    <p>thanks, </p>
    <p>Victor</p>
