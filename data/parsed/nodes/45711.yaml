    <p>Hello,</p>
    <p>Yesterday, I watched the delicious <a class="freelinking external" href="http://www.imdb.com/title/tt0838221/ " rel="nofollow">  Darjeeling limited</a>.</p>
    <p>At the end of the film, I thought the typeface was perfect for the titles (even if the yellow was unreadable) but hey, whatthefont ?<br>
    I googled it quickly, to see if someone on earth already asked himself the same question. </p>
    <p>The <a class="freelinking external" href="http://typophile.com/node/36831 " rel="nofollow"> answer was here</a>, on typophile.</p>
    <p>I'm not alone, thanks.</p>
