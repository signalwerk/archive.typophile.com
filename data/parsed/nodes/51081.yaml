      <p>It looks as if the bottom bowl of the 8 comes in too high. The trick is to make the offset essentially disappear at text sizes. </p>
      <p>Actually, I meant ch (I don't see a ct in the sample, but it needs to be treated the same way). The long-s+t is fine, and the ß is fine for weight, but I've never really liked the style with a large upper bowl. It might help if you make the transition from the lower "s" shape to the upper curve point more northeast, if that makes sense. (If not, I'll draw a picture.)</p>
      <p>Opening up the spacing will really help at text sizes. (You might want to have Caligrot Text and Caligrot Titling vel sim. to account for different optical needs.)</p>
