    html: |-
      <p>The middle one is best but I think it should be slightly nearer to the right hand one. Can you interpolate between 2 and 3 about 20%?</p>
      <p>I've just checked the latest pdf. It really suits Scandinavian languages somehow! I like the horizontal terminals and semicircular endings. Perhaps Ø and ø need horizontal stroke endings too? And perhaps you could design a Q with somehow a semicircular tail?</p>
      <p>I'd take the loop of J up a bit more to echo the f and j loops. x looks wide. The arches on n and u look slightly unresolved. The corners on N don't match. z looks dark.</p>
      <p>Generally the straight stems are a hair too light for the bowls, which seem darker to me. Look at the word 'noite' and it seems the o and e are darker than the others. I'd make the 'hat' of the 1 much more generous.</p>
      <p>Middle two strokes of w could be a few units narrower. k's lower leg is much steeper than the capital version and looks like it could start lower.</p>
      <p>I'm not sure whether you want detailed crit or general stylistic impressions, and the next bit might be more about the very fine-tuning which you are going to come to anyway next...</p>
      <p>The overall colour of the text blocks seems a bit spotty and I'm not sure if it's the spacing or the stroke weight. I think perhaps there's a bit of both. For example, the inner contour of the roof of the a could be nudged up 2 or 3 units, the valley between the two curves of the m could be pushed a few units to the right, the joins of arches to stems makes some glyphs a bit heavy (r and u for example), and inner counters are not quite following the same ductus as the outer contours like on a, e and u.</p>
      <p>If that's the next level of detail from where you are now, sorry!</p>
      <p>Can you set a block in CAPS so we can see how that looks?</p>
      <p>These are just opinions and I'm still a learner about these things so see what others think too... :)</p>
