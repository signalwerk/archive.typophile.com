      <p>In my experimentation to get interpollation working, I managed to totally screw up the spacing. It needed to be redone anyway. I also extended the descenders 50 ems (typical stem width of the light version is 60), because the hooks were getting too tight for comfort on the bold, distorting the curves. This still needs a lot of work, in no small part to correct the damage I caused by stretching the descenders.</p>
