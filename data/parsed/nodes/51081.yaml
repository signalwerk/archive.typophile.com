    html: |-
      <p>I'm glad you picked up on that. I was trying to get something a little retro feel in this without tying it to a too specific era. Maybe I got inspired by everyone else who's been inspired by Saul Bass movie titles.</p>
      <p>The punctuation dots (period, &amp;al.) were derived from the square tittle with auto-curvature activated to turn it into a slightly larger circle, and the comma and quotation marks derived from that with an added tail, Would a straight cut tail rather than the pointed one make them fit better, or should I go further and make them square like the tittle?</p>
      <p>I do have an alternate straight legged question mark. I'll make that the preferred and the serpentine one the alternate. It seemed too skinny at first glance, though, and a twisty one was good enough for Futura to annoy people with for nearly a century.</p>
      <p>The stem of the 7 is a bit thick. That's always a hard one to balance. I didn't want to curve it, and making it the standard stroke weight of the font makes it look too skinny among other numbers on screen, but seeing it in print it does stand out a bit.</p>
      <p>All the lc accents are too low, i and j dots included. It's nice that the program can reset them higher for me. I don't want to put them all the way at cap-height though, that's just too much air.</p>
      <p>OK, off to do an update...</p>
