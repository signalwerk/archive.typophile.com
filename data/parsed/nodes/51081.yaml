      <p>I think you're overstating the neutrality of this - to my eyes it has a pleasing, bouncy personality, like ad copy in the Eisenhower/Kennedy era. I think the tight curls of f, t, and y, f and t's long crossbar, and the high crossbar of e give it that. The t is interesting - its balance on its little umbrella handle is precarious, but "normalizing" that might sacrifice some of this character. I would look at its overshoot (seems to ride high), and I would reconsider its top shear - seems too sharp to me.</p>
      <p>V and v fall apart at the vertex - top of N, too. Some uneven weights, esp. in the figures: 7's diagonal and 5's bowl are too dark, for example. 9 looks topheavy. z looks too dark and too sharp.</p>
      <p>I think i's dot is too low (turns into a short l at small sizes), and the apostrophe may be too high. I'm not sure the curly question mark fits in with the font.</p>
