    html: |-
      <p>Some light from this <a class="freelinking external" href="http://typophile.com/node/117181" rel="nofollow">previous discussion</a> by Mike F...</p>
      <blockquote><p>[...]<a class="freelinking external" href="http://www.linotype.com/155164/mccollough-family.html" rel="nofollow">McCollough</a> for me, Don.<br>
      Designed about 1898 by Gustav F Schroeder for ATF and - according to <a class="freelinking external" href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Schroeder/GustavFSchroeder.pdf" rel="nofollow">this Klingspor Museum PDF</a> - originally spelled McCullagh.</p></blockquote>
      <p>... and Don </p>
      <blockquote><p>Matamoros NF is based on a similar but different font -- note for example the lazy s counters in _O_ and _Q_, similar to Inland Foundry's _Inland_ -- from circa 1900 called Jason Wood by Dan X. Solo and sold by him in digital form with one of the Dover Books. Used for the title of the Solotype catalog.</p></blockquote>
      <p>So probably in your case McCullagh at its origin.</p>
    html_clean: |-
