      <p>I think I found a pre-digital sample of this very typeface (on Typophile, no less!). Check this image out. It was called Akzidenz-Grotesk halbfett:</p>
      <p><a href="http://typophile.com/files/AG5.jpg" title="http://typophile.com/files/AG5.jpg">http://typophile.com/files/AG5.jpg</a></p>
      <p>This specimen was posted here in the forums, and it's worth reading the fascinating <a href="http://typophile.com/node/17643" rel="nofollow">discussion of Akzidenz</a> that surrounds it. </p>
      <p>This still doesn't answer the question of where the digital version is coming from.</p>
