  html: |-
    <p>Hi,</p>
    <p>I was hoping to use Hoefler's Chronicle Display Condensed for website headlines. Unfortunately it seems that their license doesn't allow that with font-face. So I am looking for an alternative. As I mentioned, it will be for headlines, should be web embeddable through font-face, it has to have a certain old style, classical look to it, look good in uppercase even at large sizes and preferably condensed. The most important feature would be that it has to have a very well balanced Q, as in I'd prefer the Q tail to be a base that the letter's body rests upon.</p>
    <p>Many thanks in advance!</p>
