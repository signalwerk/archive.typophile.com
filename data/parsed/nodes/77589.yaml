    html: |-
      <p>Thanks for that! While Miller seems to be a perfect font for the job, unfortunately the Q is very important, as it will be the first letter in the main headline and possibly made into a favicon. So it has to be able to also "stand" on its own. That's why I'd prefer its tail to be some kind of base, in a serpent/ recumbent 'S' shape that only touches the body. So that would leave out the long vertical tails and even the 'Z' shaped tail like the 'Q' in Baskerville.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/q_4087.jpg"></div><p></p>
      <p>So this is just to show you what I'm talking about. I think the Q from Chronicle would have been perfect(first in the image), alas it's not going to happen. I found two other fonts and are somewhat close, however in the second one(Elisabeth), the Q tail seems overwhelming and in the last one, from Bitstream, the letter seems too weak.</p>
      <p>Any further help would be really appreciated.</p>
