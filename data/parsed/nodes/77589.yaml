    html: <p>Don’t know if the ‘Q’ will meet your objectives, but you could consider <a href="http://www.webtype.com/font/millerheadline-light-family/" rel="nofollow">Miller Headline</a> for @font-face from Webtype. Same genre as Chronicle. Not as narrow as the Condensed.</p>
