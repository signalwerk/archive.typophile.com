    html: <p>Ah, hi there Kris. <br> <br>I managed to find myself a 20" iMac amidst big waiting lists all over the place. Told them to hold it, then they got six calls and 2 customers wanting to buy it, within few hours. <br> <br>I've been sketching a few things recently; i'll find myself some web space and perhaps put up a few pages. After seeing the "A Ghost is Born" I saw the modest mouse things coming a mile away! I like the "the good times are killing me" one. <br> <br>My brother has finished a basic version of this pixel font composition. It has the ability to add ligatures (which is essential with the troublesome spacing associated with pixel fonts). More on this later, especially since I've only made a lower case font for it. Caps is on the way. -- I just had a suggestion for him regarding ligatures...  <br> <br>Hrant, <br>I think you are right about the skeleton thing; if I am going to design in a conventional manner then I should most likely "keep it real" and put pencil to paper. I think I just get a real kick out of pixel-pushing. Er, rock on. Or something. <br> <br>- on another note <br>Does anyone know of a free alternative to suitcase? I cant stand it moving my fonts to those giant communual system font folders. I shoudl find a font previewer perhaps... <br> <br>- Chris</p>
