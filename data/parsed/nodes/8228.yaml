    html: <p>Steve, <br>Thankyou very much for those links! I've felt absolutely paralysed having no means of designing anything.  There seems to be a shortage of the G5 I want; I'm stuck on my Dad's PC. Well, back to the drawing board with a vengeance! <br> <br>John, <br>Just this evening I began work on another pixel font, with a few greys for added precision. Spacing pixel fonts properly (even when you are making them in phoshop itself) is damn-near impossible :-S.   Quite fun, though. <br> <br>Me and my little brother are working on some HTML compositing ideas. He has made up a system where you type a word and it will set that word using the font. However, the future of this seems grim where the typeface is not monospaced. hmm. more on this later. Watch this space. Or, well the pixel threads, perhaps.</p>
