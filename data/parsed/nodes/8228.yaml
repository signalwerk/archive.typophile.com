    html: <p>You need not have Linux to run the open-source programs Jon mentioned, though. <a href="http://www.inkscape.org">Inkscape</a> and <a href="http://www.sodipodi.com">SodiPodi</a> both run on Windows and in the X environment on Mac OS X. FontForge will run in the X environment of Mac OS X and under Cygwin on Windows, too.</p>
