  html: <p>Hello, <br> <br>The forums have been acting quite strangely in the last few days. I'm certain I've already posted this thread. <br> <br>Anyway, not having illustrator or and equivalent has me trying to create fonts using pixels for now. Until I get a computer (soon, hopefully) this is what it has to be. Unless, someone knows of a workable and free alternative to illustrator (or freehand for that matter) for drawing outlines. <br> <br>So, here is what I have been working on until I can turn it into a conventional font using a program such as illustrator. <br> <br>I guess try to imagine it as not being a bitmap. I suppose that using paths will totally change its appearance, however. Well, this is it for now. <br> <br><img src="http://www.typophile.com/forums/messages/29/56124.gif" alt=""> <br> <br>Thanks, <br> <br>- Chris</p>
  html_clean: <p>Hello, <br> <br>The forums have been acting quite strangely in the last few days. I'm certain I've already posted this thread. <br> <br>Anyway, not having illustrator or and equivalent has me trying to create fonts using pixels for now. Until I get a computer (soon, hopefully) this is what it has to be. Unless, someone knows of a workable and free alternative to illustrator (or freehand for that matter) for drawing outlines. <br> <br>So, here is what I have been working on until I can turn it into a conventional font using a program such as illustrator. <br> <br>I guess try to imagine it as not being a bitmap. I suppose that using paths will totally change its appearance, however. Well, this is it for now. <br> <br><img src="http://www.typophile.com/forums/messages/29/56124.gif" alt=""> <br> <br>Thanks, <br> <br>- Chris</p>
