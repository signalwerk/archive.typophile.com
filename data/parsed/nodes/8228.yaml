    html: "<p>&gt; I guess try to imagine it as not being a bitmap. <br> <br>Are you sure you really want that?  :-) <br> <br>It seems to me that if this is really just a placeholder for an outline font, you're effectively drawing skeletons or something. Or at least you're imposing some quite peculiar (but possible nicely exploratory) restrictions on the results... Hmmm. <br> <br>Spacing bitmaps: <br>It's a very discrete (and sometimes discreat!) exercise, where some global \"on-off\" type decisions have to be made before you do much actualy work. And grays don't alleviate the \"problem\", they just spin it into a third dimension... or something. Damned if I know what that means... Hmmm, just do it dude! <br> <br>hhp</p>"
