    html: <p>Christopher, if you have access to a machine running Linux then Inkscape and SodiPodi and Skencil some to mind. These are vector drawing prgrams. To me Inkcape is the most comfortable (I'm an Illustartor user for most of my regualr workaday employment). If you don't have access to a computer then none of these will really help. Also on linux for free is Font Forge for drawing and making fonts. <br> <br>But really, what with the other stuff you have shown here and in the other categories, I'd keep going down the bitmap road and feel good about it. <br> <br>Jon</p>
