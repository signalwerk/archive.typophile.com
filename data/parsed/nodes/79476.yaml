      <p>I know little about academic book publishing, marketing or selling. Nor am I up-to date on architectural books. Nor do I know the target audience here.  So what I say may not apply to this book. And now that I have seen the original poster's second message, it definitely doesn't apply to this book. But I'm going to post it anyway.</p>
      <p>For books which will not be sold in bookstores, but rather on the internet including Amazon, the whole point of the book cover is to look good as a postage-stamp-and-a-half sized icon on Amazon or on any other website. Sadly,<br>
       the complicated and intricate book cover, which looks beautiful in the bookstore, is going away. For the Amazon-sized icon you need wide readable letters for the title and author's name, along with a simple graphic. This is the way we live now.</p>
      <p>Re: the font on the cover, the author's perspective does not matter. What is the reader/customer's perspective here?</p>
