      <p>There's not enough white space in the drawing to allow a headline to get the attention it needs. Your options are to make the illustration smaller and put the head outside of it, or to put the headline in a box (or other shape) the overlays part of the illustration. </p>
      <p>What size is the cover, what is the binding method, and on which edge is it bound? Can you use color?</p>
      <p>I probably wouldn't use the typewriter face. It looks dated and your report is an analysis, not an attempt to replicate a retro look.</p>
