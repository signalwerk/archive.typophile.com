      <p>I would cheat to get space at the top: reduce the size of the drawing and clone out the poles, wires and tarmac.<br>
      You might even consider removing the horizontal telephone wires (but not the TV aerial!)</p>
      <p>The typewriter face would be OK, but it would have to be display size.</p>
