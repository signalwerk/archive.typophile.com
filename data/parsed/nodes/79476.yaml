    <p>Dear friends, my research (Mphil) has come to an end. It seems now that the writing of 200 pages was nothing compared to the difficulty of designing a decent cover. I’m a graduated graphic designer but I haven’t practiced for a long time. Can you please advise me? Here’s the spread. The image I choose is a drawing by the great Gordon Cullen (1950s) which is one of the architects I investigate. It shows a very cluttered “subtopian” landscape, the problem is that there’s not much white space left for the information I have to provide (my name, title and possibly EESC USP Universidade de São Paulo). I chose this typeface because many of the texts I analyse in the research were typewritten...silly? thanks everyone.</p><div class="imageWrap"><img src="http://typophile.com/files/cov_3675.jpg"></div><p></p>
