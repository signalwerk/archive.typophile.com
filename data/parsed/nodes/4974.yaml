    html: "<p>Found it! It's a font called <a href=\"http://www.dafont.com/en/search.php?nb_ppp=40&amp;texte=canoe%2Bsurfing&amp;nq=1&amp;q=goodgirl\" target=\"_blank\"> Good Girl</a> by Cathy Davies, who states in <br>the copyright area, \"GoodGirl was inspired by a font in 1960 Modern <br>Teen magazine.\" and \"No copyright; use as you wish\". <br> <br>Ms. Davies also created several <a href=\"http://moorstation.org/typoasis/designers/davies/cathy.htm\" target=\"_blank\"> other retro fonts</a>. <br> <br>Oh, and a bit from her bio: \"In 1997, Cathy Davies casually put some <br>fonts she designed on a website as a free download. Within two years, <br>these fonts had been used in graphic designs from TV commercials <br>to mainstream rap albums to riot girl zines.\" <br><br></p>"
