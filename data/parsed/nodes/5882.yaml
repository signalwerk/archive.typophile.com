  html: <p>Thank you all for the helpful info re. the 'Mysterious Pixel Font - Supermonomarket or Stansharp' post. <br><a href="http://www.typophile.com/forums/messages/83/41476.html?1091054886" target="_blank">http://www.typophile.com/forums/messages/83/41476.html?1091054886</a> <br> <br>Alas the font was not one of the  Sven Stüber 'Superlooper' pixel fonts (every other 'super' but no Supermonomarket), and as Yves mentioned 'Stansharp'  is a no go on google? <br> <br>I have tried contacting Group 94 (<a href="http://www.group94.com/" target="_blank">http://www.group94.com/</a>) but have heard nothing back (can you blame them really), so my guess is it is a custom design by them. <br> <br>So after all that I have come to the conclusion Verdana is not such a bad screen font after all! <br> <br>Cheers.</p>
  html_clean: <p>Thank you all for the helpful info re. the 'Mysterious Pixel Font - Supermonomarket or Stansharp' post. <br><a href="http://www.typophile.com/forums/messages/83/41476.html?1091054886" target="_blank" class="link-lost">http://www.typophile.com/forums/messages/83/41476.html?1091054886</a> <br> <br>Alas the font was not one of the  Sven Stüber 'Superlooper' pixel fonts (every other 'super' but no Supermonomarket), and as Yves mentioned 'Stansharp'  is a no go on google? <br> <br>I have tried contacting Group 94 (<a href="http://www.group94.com/" target="_blank" class="link-external">http://www.group94.com/</a>) but have heard nothing back (can you blame them really), so my guess is it is a custom design by them. <br> <br>So after all that I have come to the conclusion Verdana is not such a bad screen font after all! <br> <br>Cheers.</p>
