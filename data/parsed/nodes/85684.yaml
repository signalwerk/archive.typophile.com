  html: |-
    <p>Hi, everyone,</p>
    <p>I'm working on understand the terrible and heavy world of some (and just some of them) Opentype features. And the most disturbance thing which I haven't understand already is the exception that makes possible to the "end" feature (in some of the Stylistic set) to work only in the last character, not in the middle of the word. After that, I discovered the *fina feature, I don't understand how it works, but it does what I was looking for. But at Myfonts.com there are just eight fonts with that feature, is not very common. Isn't it? Why?</p>
    <p>So, looking inside other fonts, like Minion. I've seen that it doesn't use the fina feature. It uses a combination between classes. Just that? The "space" character is included in the class, but how it works? Where's the script that allows that?</p>
    <p>In basic script some options would be (without classes)</p>
    <p>This is what it would not work:</p>
    <p>feature ss01 {<br>
         sub e by e.end;<br>
    } ss01;</p>
    <p>The way that I've thought to work with some characters:</p>
    <p>feature ss01 {<br>
        sub e space by e.end;<br>
        sub e period by e.end;<br>
        etc.<br>
    } ss01;</p>
    <p>Obviosusly I'm sure that it's not the way to do it. (It would be a lot of unnecesary work) </p>
    <p>Any idea?<br>
    Thanks!</p>
