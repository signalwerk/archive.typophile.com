    html: <p>I wouldn’t bother with stylistic sets for the purpose of compatibility because they are also poorly supported. And end users are usually clueless about how stylistic sets work. I dealt with this in a recent font by calling all positional forms from AALT so that they can be accessed in any application with a glyph palette. Of course, that does not solve the problem in crap software like Photoshop that has no glyph palette for using AALT, but it’s all I can really do.</p>
