    html: <p>End is not an OpenType feature, it is just an suffix used in whatever example you saw. Minion probably uses CALT rather than FINA because <a href="http://www.typotheque.com/fonts/opentype_feature_support" rel="nofollow">only five applications even support FINA.</a> Doing this with CALT checks to see if any glyph in (class of glyphs with terminal forms) is to the left of (class of glyphs that are spaces or certain punctuation marks) and if so, swap in the .end form of the letter.</p>
