    html: |-
      <p>Thank you guys!</p>
      <p>After taking a look to the Adobe OT feature spec:<br>
      <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html</a></p>
      <p>I made classes for every alternate characters, and then use the ignore script.</p>
      <p>Something like this with the swashes feature:<br>
      For example M has a swash for beginnings on the left. To avoid the cross with the right swash of Q in uppercase words and also to make M.swsh only shown in beginnings, I wrote:</p>
      <p>feature swsh { # Swashes<br>
           ignore sub @allswsh @swshl01';<br>
           sub @swshr01' by @swshr02;<br>
           sub @swshl01' by @swshl02;<br>
      } swsh;</p>
      <p>Q is in swshr01 / Q.swsh is in swshr02<br>
      M is in swshl.01 / M.swsh is in swshl.02</p>
      <p>While uppercase, lowercase, numbers and other characters are in allswsh class.</p>
      <p>It works fine for me, some better ideas?</p>
      <p>Thanks again</p>
