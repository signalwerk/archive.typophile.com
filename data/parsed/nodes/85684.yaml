    html: |-
      <p><code>fina</code> feature is generally used in Arabic and similar scripts and the Engines does the word analysis needed to determine where to apply it (in Arabic final forms can occur in the middle of the word), so it is implemented in the font as simple substitution lookup.</p>
      <p>Some engines (Adobe's only, I think) support in other scripts to mean end of the word, and the engine still have to do the word analysis. Some consider this an abuse as you can't then use it to mean end of word in Arabic which have it legitimate uses apart from the current use of <code>fina</code> in Arabic script, a different feature should have been added for that.</p>
      <p>Since the use of <code>fina</code> in Latin script not supported by most engines, fonts do use a bit more complex <code>calt</code> rules to implement it, searching typophile you should find several threads discussing this.</p>
