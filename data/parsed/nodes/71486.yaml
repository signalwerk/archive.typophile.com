  html: |-
    <p>I was invited to visit the Tandem Press where, by coincidence, Robert Cottingham's "American Alphabet" is being produced. </p>
    <p>Here you can see a proof of the work ongoing on the "Y"<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ClearTypeArt_6742.JPG"></div><p></p>
    <p>Below is a closeup, you can see how the artist uses a not uncommon technique in image manipulation, tiny slivers of color, to defocus background objects, giving them a feeling of atmospheric depth.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ClearTypeArtClose_4035.JPG"></div><p></p>
    <p>Let's just hope no one uses this technique on text type, eh!? ;)</p>
    <p>Cheers!</p>
