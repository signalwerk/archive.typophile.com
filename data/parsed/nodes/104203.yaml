    html: |-
      <p>A quick visit to the website revealed the font name: <a href="http://www.myfonts.com/fonts/type-together/adelle/" rel="nofollow">Adelle</a>.</p>
      <p>However, there is something strange going on. For some reason I cannot find a variant with the alternate one-storied /g -- its default /g is double-storied. The superior and inferior /g, on the other hand, <em>is</em> one-storied. It strikes me as odd if the designer purposely selected an inferior /g and scaled &amp; moved it into position ... But perhaps he did. Or perhaps there is a version of Adelle with this alternate as a selectable option.</p>
    html_clean: |-
