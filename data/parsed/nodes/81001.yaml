  html: |-
    <p>Hello Everyone,<br>
    This font<br>
    <a href="http://allmyfonts.com/index.php?op=details&amp;id=97634" title="http://allmyfonts.com/index.php?op=details&amp;id=97634">http://allmyfonts.com/index.php?op=details&amp;id=97634</a><br>
    is giving me a big headache :)</p>
    <p>As you can see on the image in the website the font is not working (looks like it is writing over and over again on the same line as you see on that image). I am using a mac and, after converting it in .otf it works shows up fine in fontbook BUT it works only on mail and not on word, pages and others.</p>
    <p>This is very weird as I never found a font working in some programmes and not on others. Is there any way to fix this ?<br>
    I am very thankful for your kind help</p>
    <p>Regards<br>
    David</p>
