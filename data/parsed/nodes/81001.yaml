    date: 2011-04-09T13:12:00
    date_raw: 9 Apr 2011 — 1:12pm
    votes: null
    html: |-
      <p>The problem is broken vertical metrics data in the font. Specifically, the hhea table has ascender, descender and linegap all set to zero.</p>
      <p>This is easily fixed by opening it in FontLab, then overriding the "custom metrics" with automatically calculated ones, and regenerating the TTF.</p>
      <p>Now, I would not want to bet on the font working in other respects; given it being badly broken in this regard, other problems seem likely.</p>
      <p>Cheers,</p>
      <p>T</p>
