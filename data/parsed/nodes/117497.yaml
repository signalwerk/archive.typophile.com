    html: |-
      <p>&gt; but at this point I'm not sure Simoncini Garamond from Adobe has kerning</p>
      <p>It does. Not vast amounts, but it has kerning. You can look at some specific combinations that usually involve substantial kerning to check, such as:<br>
      To Te<br>
      LTAVA</p>
      <p>&gt; Is the Simoncini Garamond from Linotype different?</p>
      <p>It may be. Adobe originally supplied all their versions of fonts they licensed from Linotype back to Linotype, both originally in Type 1 and later in OpenType conversion. But Linotype has since updated some/many (all?) of them. You would have to ask Linotype. Perhaps one of their folks will comment.</p>
