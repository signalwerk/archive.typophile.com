    html: |-
      <p>I assume you are using the font properties menu that you get when you right click on some selected text. Go to the character spacing tab. Next to the the box that you check to request kerning, you will note a box where you specify the the point size at which Word 2007 starts to apply kerning. Did you choose a size small enough to include the point size you are using? If this does not work are you certain that your Simoncini Garamond from Adobe has kerning?<br>
      Don</p>
