  html: <p>Goran's post about the note just brought a question for me. I'm working on a titling font that has Caps and smallcaps, the smallcaps taking the place of lowercase. What would the proper height be for the exclamdown character. I wondered if it should just be at the same cap level as the regular exclamation point. The smallcaps are a bit taller than what a lowercase would likely be. I suppose it would be possible to have one for before small caps and one before caps, but that might look awkward if both were seen in proximity.</p>
  html_clean: <p>Goran's post about the note just brought a question for me. I'm working on a titling font that has Caps and smallcaps, the smallcaps taking the place of lowercase. What would the proper height be for the exclamdown character. I wondered if it should just be at the same cap level as the regular exclamation point. The smallcaps are a bit taller than what a lowercase would likely be. I suppose it would be possible to have one for before small caps and one before caps, but that might look awkward if both were seen in proximity.</p>
