      <p>Spanish-speaking friends (well, editors) of mine say that preceding a capital letter, the exclamdown and questiondown should align at what you &amp; Microsoft are calling the "uppercase" position. Preceding a lowercase letter, the "x-height" position can be used.</p>
      <p>As Christoph says, I would have two for a Cap/smallcap display font. There will be people who will use only the small caps for a heading, and people who use Cap/smallcap.</p>
