    html: |-
      <p>The exclamdown should be (almost) exactly the height of the exclam. So, if you are going to make a special exclam and question for "all small caps," you need small cap "downs" as well. You will need the regular sized ones for cap-smallcap settings.</p>
      <p>As we discussed on the Design Forum recently, the question of how to work the OT features depends on the applications programs capabilities, and how you expect the font to be used. But I would think that for a titling font, you can expect any reasonable comp to take some pains getting things right, so the toggling of features is less important.</p>
