    html: |-
      <p>Sorry Charles,<br>
      I think I worded that wrong. I think the size should be the same. I was referring more to positioning. On the Microsoft standards site it say there are 2 ways.</p>
      <p>"The inverted question and inverted exclamation have two possible alignments."</p>
      <p>"X-height alignment : In most text fonts the inverted question and inverted exclamation tops align with the lowercase x-height. In a round design the lowercase x-height's overshoot. The bottom should not exceed the lowercase descender value. In this case many type designers use an uppercase alignment method or shorten and redesign the glyphs."</p>
      <p>"Uppercase alignment : This is a simple 180 degree rotation with no vertical offset from the position of the question and exclamation. Used very commonly in display fonts and modern designs."</p>
      <p>It doesn't mention Smallcaps, but I'm inclined towards using the Uppercase alignment throughout.</p>
