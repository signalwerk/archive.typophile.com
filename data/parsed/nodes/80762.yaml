      <p>Karsten, </p>
      <p>FontLab has a good history of using .5 version numbers. There was FontLab 4.0, FontLab 4.5, FontLab Studio 5.0, now we'll have FontLab Studio 5.5. It could be also 5.0.7 or 7.0 -- I mean, the version number doesn't really mean anything :)</p>
      <p>But if it does indeed mean something, then: the 5.5 version number primarily should indicate that the users of current FontLab Studio 5 will feel instantly at home with the new version. There won't be any radical changes, but some important and useful new features, bugfixes and Mac OS X Intel compatibility.</p>
