  html: <p>This is my first post. I'm a graphic designer, or at least that's what the guy calls me who gives me money. <br>Anyway, he's getting into book publishing and I helped him with a name and then it was a matter of designing a logo. <br>I suppose I won't give any background, as I'm interested in first impressions. I think it conveys an idea. Comments and critiques greatly appreciated. <br><img src="http://www.typophile.com/forums/messages/29/49678.jpg" alt="Scapegoat Logo"></p>
