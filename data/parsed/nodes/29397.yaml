    html: <p>I'm not really familiar with BELLO, but how are you attempting to access the ornaments - and do you actually mean ornaments, or the various "words" built into the font? Going through the Glyph palette in InDesign you should have access to every individual glyph, but I'd guess that the auto-replacements are either discretionary ligatures or contextual alternates, both of which can be "turned on" in the Character palette.</p>
