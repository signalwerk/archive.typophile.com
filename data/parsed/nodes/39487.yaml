    html: |-
      <p>Microsoft is primarily interested in implementing language support for complex scripts in their applications, and mostly targets office users. So dingbat, agate-numerals-only, fractions-only etc. fonts are not their concern. Adobe is more design-savvy and tries to address the community of graphic designers, typographic designers, publication designers. Here, uses of fonts outside of a strong language context are more likely, so Adobe wanted a solution for that and proposed the DFLT script tag. The DFLT script tag is a "new thing" and Microsoft does not think they need it, since they did not feel a need for it from the beginning. </p>
      <p>A.</p>
