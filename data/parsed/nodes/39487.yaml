      <p>&gt; The (FLS) font’s feature definition lacks<br>
      &gt; (some of) the initial languagesystem statements. </p>
      <p>I'd like to emphasize the importance of this -- whenever you are using ANY language-specific OpenType substitutions (e.g. in the "liga" or "locl" features) or whenever your font contains letters from more than just the Latin script (e.g. Cyrillic or alphabetic Greek), you need to enumerate all the languagesystems as I explained <a href="http://typophile.com/node/17787" rel="nofollow">here</a>. This is not any limitation of FontLab Studio, simply a prerequisite of the format. FontLab Studio does not do it magically for you, but it does not automatically generate any OpenType code either (except the example code for Type 1 Standard-encoded fonts, but that is Latin only, anyway). </p>
      <p>Also, I'd like to point out that there is no *obligation* whatsoever to include the DFLT script tag in OpenType fonts. Adobe does this in their newest fonts but did not in the older fonts, and Microsoft does not use the DFLT script tag at all (and as far as I can tell, they have no intention to). </p>
      <p>Adam</p>
