      <p>This is my Terminal setup.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Terminal_6413.png"></div><p></p>
      <p>Try this:<br>
      1. Open a Terminal window</p>
      <p>2. Type <code><strong>pwd</strong></code> and hit 'return'. This prints the working directory you're in. If this is not <code><strong>/Users/nick</strong></code>, type <code><strong>cd /Users/nick</strong></code> and hit 'return', otherwise go to the next step.</p>
      <p>3. Type <code><strong>ls -al</strong></code> and hit 'return'. This prints the list of files and folders in the current directory. You should see a file named <code><strong>.login</strong></code> and another named <code><strong>.profile</strong></code> . Even if you don't have one or both of these files, proceed to the next step.</p>
      <p>4. Type <code><strong>pico .login</strong></code> and hit 'return'. This opens up the .login file in pico, a Unix text editor. You should have 3 lines that look like this:<br>
      <code><strong># Initialization for FDK command line tools.<br>
      setenv FDK_EXE "/Users/nick/bin/FDK/Tools/osx"<br>
      setenv PATH ${PATH}:"/Users/nick/bin/FDK/Tools/osx"</strong></code><br>
      If you don't, just copy&amp;paste them, WriteOut the file (Ctrl+O) and Exit (Ctrl+W).</p>
      <p>5. Type <code><strong>pico .profile</strong></code> and hit 'return'. You should see these lines:<br>
      <code><strong>PS1="\W\$ "<br>
      set -a # automatically export all variables.<br>
      # Initialization for FDK command line tools.<br>
      FDK_EXE="/Users/nick/bin/FDK/Tools/osx"<br>
      PATH=${PATH}:"/Users/nick/bin/FDK/Tools/osx"</strong></code><br>
      If the .profile file does not have the lines above, paste them in, write out the file and exit pico.</p>
      <p>6. Close the Terminal window</p>
      <p>That should be it. Let us know if it's finally working.</p>
