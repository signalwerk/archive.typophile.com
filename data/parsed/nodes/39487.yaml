      <p>In FontLab Studio, you put the <code>languagesystem</code> declarations in the bottom-right portion of the OpenType panel. The <code>languagesystem</code> declarations apply to all features EXCEPT those that have explicitly defined <code>script</code> and <code>language</code> declarations inside of feature definitions. In other words, the <code>languagesystem</code> list sets up the rules for all features while <code>script</code> and <code>language</code> set up exceptions for single features. </p>
      <p>If your font only contains text letters from the Latin alphabet plus analphabetics, and it does not use any language exceptions, then you can omit the <code>languagesystem</code> declaration. If you use any exceptions (e.g. for Turkish f-ligatures) or if your font has Cyrillic or Greek text letters (or letters from other scripts), then you have to specify all necessary <code>languagesystem</code> entries. Otherwise, your font won't work properly in InDesign CS3 (although it may have worked OK in InDesign CS and CS2). </p>
      <p>Adam</p>
