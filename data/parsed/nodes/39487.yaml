      <p>&gt; <em>Does it mean I have to specify the scripts for every feature</em></p>
      <p>If you want a feature to have the same behavior in all the scripts and languages, just put plain/naked 'sub' commands in that feature. See 'hist' above.</p>
      <p>If you want a language to have a different behavior in particular feature, you'll need to declare which languages do what*. In the example above, all languages have the same behavior in 'dlig' — described in the DLIG_DFLT lookup—, except German. German will inherit all the substitutions from the DLIG_DFLT lookup, but will have 2 additional substitutions.</p>
      <p>If you test such font in InDesign CS3 you'll see that the c_h and c_k ligatures will only kick-in when the language is German and Discretionary Ligatures is turned on.</p>
      <p>* Big warning: whenever you specify a particular behavior for one language, you'll have to specify the behavior for *all* the other languages declared upstream in the 'languagesystem' lines. Failing to do so will result in a crippled feature where only that one language will have lookups implemented.</p>
