      <p>I suspect that ...</p>
      <p>It is a font problem.<br>
      The (FLS) font's feature definition lacks (some of) the initial languagesystem statements. But in 'liga' (and possibly in 'smcp') however, certain lookups are registered for specific languages (e.g. 'DEU' and 'TRK'). This has the effect that after feature compilation only 'liga' (and possibly 'smcp') are registered e.g. for the German language ('DEU').<br>
      Default numerals in the font are lining numerals.<br>
      While InDesign CS2 and earlier ignored script and language tags, InDesign CS3 does read them. If a user applies the German dictionary, InDesign CS3 will look for features registered for German and only find the 'liga' feature: as an effect, 'Ligatures' will work, but 'Proportional Oldstyle' numerals won't have any effect, hence the (default) lining numerals.</p>
      <p>Solution:</p>
      <p>Adam Twardoch described what to do:<br>
      <a href="http://typophile.com/node/17787" target="_blank" rel="nofollow">http://typophile.com/node/17787</a><br>
      (See the three "discussion" links, especially the <a href="http://typophile.com/node/28277#comment-160533" target="_blank" rel="nofollow">AFDKO thread</a>!)</p>
      <p>A must-read is this:<br>
      Christopher Slye's presentation for the ATypI Lisbon Conference. Download "OpenType feature files" from Thomas Phinney's <a href="http://blogs.adobe.com/typblography/2006/10/atypi_2006_pres.html" target="_blank" rel="nofollow">Typblography</a>. (Direct link to <a href="http://blogs.adobe.com/typblography/atypi2006/slye_lisbon-05.pdf" rel="nofollow">the PDF</a>.)</p>
      <p>If fonts with the additional languagesystem statements in the feature code are generated with AFDKO2, all is fine.<br>
      If you generate such fonts in FontLab Studio 5, there will be an error message. You can ignore this, but you need to run the generated .otf fonts through Adam Twardoch's Fix DFLT Script Tag script which can be downloaded here:<br>
      <a href="http://www.silesian.com/software/FixDFLTScriptTagSL.zip" title="http://www.silesian.com/software/FixDFLTScriptTagSL.zip">http://www.silesian.com/software/FixDFLTScriptTagSL.zip</a><br>
      (Requires TTX, see the README.TXT.)</p>
      <p>[My impression is that there are many fonts out there which share the defect described above.]</p>
      <p>Karsten</p>
