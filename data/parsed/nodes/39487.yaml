      <p>Charles &amp; others, </p>
      <p>the OpenType specification prescribes that the text is dissected into "runs", i.e. portions that contain characters in a certain script (writing system, alphabet). OpenType Layout features are always registered in specific scripts (Latin, Cyrillic, Greek, Arabic, Hebrew etc., there is also a more recent "default script" registered by Adobe). </p>
      <p>The mechanism has been described by John Hudson in his seminal article "Windows Glyph Processing: an OpenType Primer" as early as seven years ago. It is the first article mentioned in the "Developing fonts" section on the Microsoft Typography website, so it's hard to think of a more prominent placement -- see [1].</p>
      <p>In a complete implementation of OpenType Layout, the features registered under the Latin script are applied to Latin letters, the features registered under the Cyrillic script are applied to Cyrillic letters etc. For non-alphabetic characters, the features that are applied to them need to be registered under all scripts that the font supports. In addition, they may be registered under the DFLT script so e.g. oldstyle numbers of a certain font can be used with Arabic text even though the font does not support Arabic. </p>
      <p>Microsoft Uniscribe is a quite complete implementation of OpenType Layout, and has been for many years. In Windows Notepad, if complex script processing is enabled on the system, certain OpenType Layout features are applied by default to scripts such as Latin, Cyrillic or Greek (ccmp, liga, clig, mark, mkmk, kern -- see [2] -- also also calt). Cyrillic ligatures will be applied only if they are registered under the cyrl script. </p>
      <p>Adobe InDesign CS3 is also a quite complete implementation of OpenType Layout, and follows the same principles. Unlike Uniscribe, it does not offer support for complex scripts, but on the other hand it offers support for non-default languages for the standard scripts (e.g. you can use the Turkish language exclusions for the Latin script), something that Uniscribe only offers in theory (as there are no Microsoft applications that use that for the standard scripts). </p>
      <p>Adobe InDesign CS2 and earlier versions had a SIMPLISTIC implementation of OpenType Layout, which did not dissect the text into runs but instead, it blindly applied OpenType Layout features registered to the Latin script on all text, regardless of the actual script of the text. It was unfortunate that Adobe chose this path at the beginning, but this problem has been discussed frequently on Typophile as well as on the OpenType list. Another side-effect of Adobe's simplification policy was that if you don't specify any languagesystems (i.e. scripts and optionally languages) for the OpenType font in the AFDKO feature syntax (used by AFDKO, FontLab Studio and DTL FontMaster), all features will be by default registered under Latin script, default language. This is explicitly specified -- see [3] -- but I guess some people have implied from this that they don't need to worry about languagesystems at all. Well, actually, they DO, if their fonts have any alphabetic characters from scripts other than Latin (I say "alphabetic characters" because there are many fonts that don't have real Greek alphabetic characters but have a handful of Greek symbols -- these do not fall under the considerations described here as they are treated as "common script" analphabetics). </p>
      <p>So, if an OpenType font has Cyrillic or Greek letters but its OpenType Layout code registered the features only in the Latin script, then the basic functionality of the font will still work (e.g. you will be able to type letters) but no OpenType Layout features will work (not even kerning). </p>
      <p>There are OpenType font technology consultants out there (wink wink ;) ) who are able to help you out in details, you know. </p>
      <p>Regards,<br>
      Adam</p>
      <p>[1] <a href="http://www.microsoft.com/typography/DevArticles.mspx" title="http://www.microsoft.com/typography/DevArticles.mspx">http://www.microsoft.com/typography/DevArticles.mspx</a><br>
      [2] <a href="http://www.microsoft.com/typography/OpenType%20Dev/standard/intro.mspx" title="http://www.microsoft.com/typography/OpenType%20Dev/standard/intro.mspx">http://www.microsoft.com/typography/OpenType%20Dev/standard/intro.mspx</a><br>
      [3] <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html</a></p>
