    <p>Anyone encountered following situation:<br>
    I am using an OT-font in InDesign CS3 with the OT-feature Proportional Oldstyle. When i turn Ligatures on, the numerals will change to the standard ones (which i don’t want to happen, of course)<br>
    This does not occur in InDesign CS2. Is this a bug of CS3 or maybe some misleading OT-feature in the font itself?</p>
    <p>Any help greatly appreciated.</p>
