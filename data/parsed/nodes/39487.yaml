    html: |-
      <p>Nick -- <cite>So will the language features in a font work properly without the line:</cite><br>
      &nbsp;&nbsp;&nbsp;&nbsp;<cite>languagesystem DFLT dflt;</cite></p>
      <p>Yes. This is what Adam meant when he wrote this:<br>
      <cite>Also, I'd like to point out that there is no *obligation* whatsoever to include the DFLT script tag in OpenType fonts. Adobe does this in their newest fonts but did not in the older fonts, and Microsoft does not use the DFLT script tag at all (and as far as I can tell, they have no intention to).</cite> [Quote from Adam's post above.]</p>
      <p>Nick --<cite>Unless I can figure out how to use AFDKO and Python scripting, would I be better off to make features language-specific the old way, feature, by feature?</cite></p>
      <p>I am not sure what you mean by "the old way". If you mean: "without using any languagesystem statements", then no since this would produce mal-functioning fonts. If you mean: "as described in Read Roberts' / Adam Twardoch's posts [links in earlier post] but without the DFLT script tag", then yes. With or without 'DFLT', it is important that your feature definitions are preceded by statements like<br>
      &nbsp;&nbsp;&nbsp;&nbsp;languagesystem latn dflt;<br>
      Put a bit differently: Go though all your features and pick all script and language tags you have used, and add according languagesystem statements (by this pattern: "languagesystem" + script tag + language tag + ";") at the top of your feature definitions (in FLS: into the bottom right text field in the OT Panel).<br>
      You do not need to add scripts/languages that you did not mention in any feature.</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;* * *</p>
      <p>Mr Davidson: In the AFDKO's installation readme file, it seems that for Windows, only the bulleted paragraph starting "Under Windows, move ..." is of interest. And for installing the FLS Macros, the one starting "To install the FontLab Macros ..."<br>
      I am an ignorant when it comes to Windows, but with this description even managed to set the environment variables.&nbsp;&nbsp;:)</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;* * *</p>
      <p>I was reminded that the 'Generate Kern Feature' script requires RoboFab. Some updated links: <a href="/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a></p>
