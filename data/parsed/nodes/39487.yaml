      <p>Ah, I see. Indeed it's a confusing with all these ifs.</p>
      <p>When generating fonts directly from FLS, there are these two options:<br>
      (1) You completely omit the line "languagesystem DFLT dflt;".<br>
      (2) You include this line (and ignore FontLab Studio's error message) <em>and also</em> run the generated font through Adam's script. This means: you accept the error <em>only because</em> you are going to correct it.</p>
      <p>When generating fonts via AFDKO 2 (which also means that your features are in external files) you can include this line without any extra work because AFDKO 2 can deal with it.</p>
      <p>Karsten</p>
