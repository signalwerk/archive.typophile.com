      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c k by c_k;</p>
      <p>&nbsp;&nbsp;&nbsp;script cyrl;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language SRB include_dflt;</p>
      <p>&nbsp;&nbsp;&nbsp;script grek;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT;<br>
      } dlig;</p>
      <p>feature hist {<br>
      &nbsp;&nbsp;&nbsp;sub s by longs;<br>
      } hist;</p>
