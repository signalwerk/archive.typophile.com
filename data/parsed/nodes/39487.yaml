      <p>Nick, if you omit the line <code>languagesystem DFLT dflt;</code> the fonts will still work. The difference is that the DFLT/dflt combo will no longer be the default languagesystem. The default languagesystem will be <code>latn/dflt</code> instead. Below is a portion of code written with and without DFLT/dflt.</p>
      <p><code>#####################<br>
      ###### NEW WAY ######</code></p>
      <p>languagesystem DFLT dflt;</p>
      <p>languagesystem latn dflt;<br>
      &nbsp;&nbsp;&nbsp;languagesystem latn DEU;<br>
      &nbsp;&nbsp;&nbsp;languagesystem latn TRK;</p>
      <p>languagesystem cyrl dflt;<br>
      &nbsp;&nbsp;&nbsp;languagesystem cyrl SRB;</p>
      <p>languagesystem grek dflt;</p>
      <p>feature dlig {<br>
      &nbsp;&nbsp;&nbsp;script DFLT;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c t by c_t;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub s p by s_p;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub s t by s_t;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} DLIG_DFLT;</p>
      <p>&nbsp;&nbsp;&nbsp;script latn;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language TRK include_dflt;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language DEU include_dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c h by c_h;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c k by c_k;</p>
      <p>&nbsp;&nbsp;&nbsp;script cyrl;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language SRB include_dflt;</p>
      <p>&nbsp;&nbsp;&nbsp;script grek;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT;<br>
      } dlig;</p>
      <p>feature hist {<br>
      &nbsp;&nbsp;&nbsp;sub s by longs;<br>
      } hist;</p>
      <p>#####################<br>
      ###### OLD WAY ######</p>
      <p>languagesystem latn dflt;<br>
      &nbsp;&nbsp;&nbsp;languagesystem latn DEU;<br>
      &nbsp;&nbsp;&nbsp;languagesystem latn TRK;</p>
      <p>languagesystem cyrl dflt;<br>
      &nbsp;&nbsp;&nbsp;languagesystem cyrl SRB;</p>
      <p>languagesystem grek dflt;</p>
      <p>feature dlig {<br>
      &nbsp;&nbsp;&nbsp;script latn;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c t by c_t;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub s p by s_p;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub s t by s_t;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} DLIG_DFLT;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language TRK include_dflt;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language DEU include_dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c h by c_h;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c k by c_k;</p>
      <p>&nbsp;&nbsp;&nbsp;script cyrl;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language SRB include_dflt;</p>
      <p>&nbsp;&nbsp;&nbsp;script grek;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup DLIG_DFLT;<br>
      } dlig;</p>
      <p>feature hist {<br>
      &nbsp;&nbsp;&nbsp;sub s by longs;<br>
      } hist;</p>
