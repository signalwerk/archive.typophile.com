      <p>Nick,</p>
      <p>i am also quite ignorant of the Python thing, but after reading the ’CommandLineHowTo.pdf’i managed to get a step further. Important is the following procedure as described in the PDF:</p>
      <p>To change the prompt, you need to edit an obscure file that sets parameters for the Terminal program when it starts up. Unfortunately, the way the Terminal program works depends on which Unix command line program it is setup to use. There are several, and each one uses a different name for its startup file, and requires a different line of text added to change the prompt. To see which one you have, under the Terminal menu option, choose “Preferences…”, and note the line of text in the top text field.<br>
      Program name Startup file name Line to add<br>
      csh .cshrc set prompt="%c$ "<br>
      tcsh .cshrc set prompt="%c$ "<br>
      sh .profile PS1='\W $ '<br>
      zsh .profile PS1='\W $ '<br>
      bash .bash_profile PS1='\W $ '</p>
      <p>Notes: the quotes need to be included, and must be either both single or both double quotes. For sh, zsh, and bash, there must be no spaces on either side of the equals sign. You can use any character string you want for the final prompt characters instead of "$ ". I like to have a space at the end of the prompt.<br>
      Look in your home directory. Unfortunately, files that begin with a period are hidden in the Finder.<br>
      To make them visible, open a Terminal window and type the following command:<br>
      defaults write com.apple.finder AppleShowAllFiles TRUE<br>
      Close all Finder windows, switch to another program, and then switch back to the Finder, and you will be able to see the hidden files. To hide the files once you are done, enter the command line:<br>
      defaults write com.apple.finder AppleShowAllFiles FALSE<br>
      If there is no file with the name you need, use a text editor to create it. Add the appropriate line (right column), and save it in your home directory. Close the Terminal window and open a new one.<br>
      Now the prompt should just show your current directory and a dollar sign, rather than the full path to the current directory.</p>
      <p>After creating a file .bash_profile/PS1='\W $ ' i was able to install AFDKO and it appears in FontLab’s Menue Tools/External Tools.<br>
      Hope that helps a bit.</p>
