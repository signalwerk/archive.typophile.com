  html: |-
    <p>Hello I was happy to see a Christmas card where the letters were made by Japanese school children out of folded origami paper.<br>
    A photo of the card (heavily photoshopped) was the basis for my own Christmas card.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/VladimirXmas2009_5666.jpg"></div><p></p>
    <p>There are online instructions on how to construct such letters, although the card I saw followed other patterns. Origami paper is square, colored on one side and usually white on the other. Have fun!<br>
     <a href="http://www.origami-club.com/en/abc/index.html" title="http://www.origami-club.com/en/abc/index.html">http://www.origami-club.com/en/abc/index.html</a></p>
