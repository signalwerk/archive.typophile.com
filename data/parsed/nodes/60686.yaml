    html: |-
      <p>"You can run it at the command line."</p>
      <p>But probably not on a native Windows.</p>
      <p>My batch scripts (Windows):</p>
      <p><code>@echo off<br>
      call FDKvars<br>
      copy Input\*.* Output<br>
      cd %FDK%<br>
      for %%f in (%~dp0Output\*.otf; %~dp0Output\*.pfb; %~dp0Output\*.pfa) do %autohintCom% -q -a "%%f"</code></p>
      <p>While FDKvars.bat is:</p>
      <p><code>@echo off<br>
      set "FDK=C:\FDK_25_21898\Tools\win"<br>
      set "autohintCom=autohint.cmd"<br>
      </code></p>
      <p>The folder, that contains the two batch files, must also contain the folders "Input" and "Output".</p>
      <p>I have created the FDKvars.bat, because now I only have to make slight corrections in that file, when Adobe updates the FDK. And I renamed the folder FDK to FDK_25_21898, because I am using three versions of the FDK at the moment.</p>
      <p><strong>paragraph</strong></p>
      <p>Remember to deactivate the FLS option "Use subroutines to compress outlines in CFF table".</p>
      <p>"Also, should I always run it with the -a switch to replace the FLS5 hints altogether?"</p>
      <p>Well, I prefer to remove all hints in FLS, before I autohint a font, but if you don’t remove them, it should be the -r option, shouldn’t it? I am not sure at the moment, because the autohint help says "has effect only, if the history file is being used."</p>
