    <p>Hello all.</p>
    <p>I am doing some research on the typeface Haas Unica and was wondering if anyone here might have some information on it.</p>
    <p>Currently what I have is basic information about Team 77, and the typeface's inception there. Followed by it being digitized by Scangraphic, but not how the rights were acquired or any of that info. Then I get to E+F buying the Scangraphic catalog, but due to legal issues, Haas Unica is no longer distributed.</p>
    <p>If anyone can fill in the sketchy details I have above, I would really appreciate it. Thanks in advance.</p>
  html_clean: |-
