      <blockquote><p>With regards to versions - there WERE 2 versions by Scangraphic 1 for body text and one for headlines which was kerned really close. (I dont know if there were any other modificartions)</p>
      <p>SB = Scangraphic Body<br>
      SH = Scangraphic Headline</p>
      <p>hernan</p></blockquote>
      <p>Scangraphic's SH was letter-spaced tightly (like Hernan says "really close", it is indeed really close; a bit too much for today's taste). Apart from this letter-spacing difference, the SB bears those little notches/adjustment (खाचाखळगा)... I'm forgetting what they're called in English... ink-traps ??</p>
      <p>RG</p>
