      <p>So after a little more digging, I have run into a bit of a snag. Two reputable sources have given me conflicting reports. </p>
      <p>I originally heard that it was Scangraphic who digitized and released the typeface, and when E+F bought their catalog, E+F ran into some legal problems that have lead to the typeface being discontinued. Then from another source, I have heard that URW digitized it (but never released it) only to have it distributed by The Font Company, with no explanation to why it is no longer available.</p>
      <p>Does anyone know the correct story?</p>
