      <p>Uli, have you examined the 'fair use' doctrine, a part of the US legal code? </p>
      <p>"Notwithstanding the provisions ... the fair use of a copyrighted work... for purposes such as criticism, comment, news reporting, teaching (including multiple copies for classroom use), scholarship, or research, is not an infringement of copyright. </p>
      <p>In determining whether the use made of a work in any particular case is a fair use the factors to be considered shall include:</p>
      <p>       1. the purpose and character of the use, including whether such use is of a commercial nature or is for nonprofit educational purposes;<br>
             2. the nature of the copyrighted work;<br>
             3. the amount and substantiality of the portion used in relation to the copyrighted work as a whole; and<br>
             4. the effect of the use upon the potential market for or value of the copyrighted work."</p>
      <p>Because this work was a short promotional piece, never made for sale [reason 1] and because its dissemination can only help sell Haas Unica, if it is ever revived [reason 4], and because this posting is not for sale but for educational purposes, there is a solid case for it being "fair use".  </p>
      <p>I don't know how a court would rule--and it will never be an issue--but your name-calling is not called for.</p>
