      <p>Scangraphic, URW and Elsner+Flake are all based in Hamburg and frequently collaborated and exchanged data. They all worked in Ikarus. Given the vast amount of typefaces that needed to be digitized in the early 1990s, I kind of doubt that these companies produced two separate digital versions from scratch. It's more likely that the same Ikarus data was used but perhaps converted separately into the Type 1 format. </p>
      <p>A.</p>
