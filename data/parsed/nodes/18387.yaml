      <p>When people have spoken to me about it they generally refer to it as a Hybrid between Helvetica and Frutiger. Or maybe I am misrecalling. But in either event, the idea that it a Frutiger-like letter is maybe providing inspiration has been said before. I do love how much better it sets massed on the page. And i love that you can go through and consider what might be helping with that. It's always possible they left something out in the provided list. Or that the change listed isn't helping that much or is a kind of indifferent change, so stay critical. But in general I am grateful that they made such a lovely and useful promotional document. Although it seems obvious to me that it is clearly better in massed text, I am not sure that Haas Unica would be better in display. </p>
      <p>The other thing is that I wonder if anybody ever made optical-size specific shapes in the Metal days for Helvetica. I have an idea that That Haas Unica had no such thing because I think they would have had film based typesetting in mind. Haas Unica is listed as releasing in 1980. Adobe Postscript is introduce in 1984.</p>
