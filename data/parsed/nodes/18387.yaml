      <p>Long before the Unica document appeared on Flickr, I had been trying to think of any possible party or individual that I would harm by this display. It is SUCH a beautiful reference to the meticulous care and thought behind the development of this type. To me, it is too lush an educational/inspirational resource to hoard to myself. I come from a long line of hoarders, so this was a big deal for me.</p>
      <p>I will, of course, remove the document if any relevant legal body says the word, or if I discover someone that I AM presently harming by this. That is very much a concern of mine.</p>
      <p>I do have to commend you, Uli, on your rabid advocacy. Perhaps it is naive, but I do find a sizable difference between making this near-thirty-year-old extinct document readable for the internet community, versus setting up a download of the potentially-commercially-viable Unica font files. If I discover ANY applicable individuals that I am harming by doing what I am doing, I will most CERTAINLY remove the display. </p>
      <p>I'm not trying to be a dirty pirate to get the attention I never got in junior high. I don't want "atta-boy" credit for this. My intentions are of the purest. I just want type lovers to have the chance to breathe in the mastery and impressively shrewd attention that went into this imprisoned face. This was to be a sort-of Helvetica 2, and that feat just BEGS to be recognized... ESPECIALLY in light of Unica's hibernation.</p>
      <p>Thanks to all for your support.</p>
      <p>Joe "Sybil"  Bauldoff</p>
