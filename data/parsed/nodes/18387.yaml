      <p>Mr. Berkson:</p>
      <p><cite>"Uli, have you examined the ’fair use’ doctrine, a part of the US legal code?"</cite></p>
      <p>Yes, I did.</p>
      <p>I reread the US copyright Law sections quoted by you (and also checked other legal sources), and I came to the conclusion that Mr. Joe Bauldoff (NOT Mr. Sorkin, of course, as Mr. Sorkin only made the link to Bauldoff's flickr site) committed a copyright infringement.</p>
      <p>1)</p>
      <p>Mr. Bauldoff, who uploaded the copyrighted monograph, gave the following explanation here:</p>
      <p><a href="http://www.flickr.com/photos/bauldoff/sets/72157604393470536/" title="http://www.flickr.com/photos/bauldoff/sets/72157604393470536/">http://www.flickr.com/photos/bauldoff/sets/72157604393470536/</a></p>
      <p><cite>"After holding onto this <strong>report</strong> for some time, I feel it should be available to everyone. I am no typographer, but this accomplishment and the methodical thought that went into it fascinates me."</cite></p>
      <p>This is Mr. Joe Bauldoff's excuse for uploading a copyrighted work. Obviously, this excuse is neither criticism, nor comment, nor news reporting, nor teaching, nor scholarship, nor research, as specified by section § 107 of the US Copyright Law, and hence his upload of the copyrighted literary work was no fair use, but an unfair copyright infringement.</p>
      <p>Those who downloaded the copyrighted monograph offered by Mr. Bauldoff, made short comments such as these:</p>
      <p><cite>"Thanks for sharing!"</cite></p>
      <p>"Thanks for uploading this, Bauldoff."</p>
      <p>Such notes are neither criticism, nor comment, nor news reporting, nor teaching, nor scholarship, etc. etc., and hence such "thanks" comments do not legalize the illegal upload made by Mr. Bauldoff.</p>
      <p>2)</p>
      <p>If uploading an entire copyrighted work for download would be fair use, then uploading the Haas Unica font itself for download would be fair use too.</p>
      <p>For instance, at a Russian website (I do not mention the link, because Mr. Sorkin would remove it), I have just read:</p>
      <p>Question: <cite>"Does anyone have Haas Unica? It used to be available from Scangraphic (pre 2004), but it is no longer. Thanks."</cite></p>
      <p>Reply: <cite>"Here is Haas Unica (original, 8 weights, Type1)"</cite></p>
      <p>The uploader could have added the same explanation, as was given by Mr. Bauldoff, after replacing the word "report" by the word "font":</p>
      <p><cite>"After holding onto this <strong>font</strong> for some time, I feel it should be available to everyone. I am no typographer, but this accomplishment and the methodical thought that went into it fascinates me."</cite></p>
