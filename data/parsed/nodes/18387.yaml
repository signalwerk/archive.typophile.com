      <p>This would be futile, since other internet users grapped the copyrighted monograph uploaded by Mr. Bauldoff and have already made it available for download at other websites. And e.g. a certain Mr. Philip Sterne now offers the copyrighted monograph as a PDF file made on the basis of Mr. Bauldoff's scans. See here:</p>
