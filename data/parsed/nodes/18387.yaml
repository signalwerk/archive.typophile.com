      <p>I called Elsner+Flake to see if I could buy font/get a Licence. They said that it was not available due to a naming copyright issue. (big shame)</p>
      <p>I was looking to buy it in the mid 90's but was put off by the (what I thought was an irregular) Cap R. More recently I have rediscovered the font and its power is strong. So much so I decided to redraw Light lowercase for a logotype I am working on. Because I drew up 16 letters, I thought I would go the whole way. This was good as it makes to re-look at the work you have already done.</p>
      <p>My feeling is that it embodies "form is function" absolutly - and this is its beauty.</p>
      <p>You can see my effort here:<br>
      with a couple of interesting links regarding André Gürtler and rasterizing/beziers.</p>
      <p><a href="http://www.flickr.com/photos/ekusupo/192527000/">Unica Deux Light Lowercase</a></p>
      <p>hernan</p>
