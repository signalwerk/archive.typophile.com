      <p>Thanks for hazarding a guess. In my case the digital font's creator, I suspect, was contacted by the creator of the original pre-digital type and the font was taken off the market because of some conflict or misunderstanding. I had used the font in an identity—before it was removed from the market. It was for a friend, and is a rather small business. I’ve been thinking about it though. Not only have I sold an identity and several rounds of printed matter, I could possibly have put my client in a legal situation, and in turn myself in regards to the foundry that digitized and sold the font.</p>
      <p>A not so funny turn on the usual font piracy issue. Maybe I should hike my prices on other jobs to compensate for the potential legal liability until the selling foundry clears its legal claim to the face and puts it on the market again. I’m sort of laughing as I type…</p>
