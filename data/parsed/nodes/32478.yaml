    <p>Hello friends.</p>
    <p>I've been using Garamond Premier Pro quite a bit lately - a wonderful face, I love having the whole set consolidated, and while the Greek has not yet been helpful, the Cyrillic has been.</p>
    <p>However, I just noticed that for some odd reason the titling face that is part of our old Adobe Garamond set is not part of Premier Pro. Is there a reason for this? I would think that the very fact that "titling alternates" is an opentype choice in Indesign would be reason enough to include it, since the titling caps were, after all, an Adobe face (weren't they?) ... Or am I missing something?</p>
    <p>What is the story, Adobe? I was hoping to replace my entire Adobe Garamond with the new face, but now I see I have to have two versions on my system, which is kind of a pain in the butt. Will there be a 2.0 release which will integrate the titling face?</p>
    <p>Your friend and mine,</p>
    <p>JLT</p>
