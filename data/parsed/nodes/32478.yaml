      <p>Joshua,</p>
      <p>The "titling set" is included in the Garamond Premier Pro family. The Display fonts form the "titling set" you're looking for. This optical size is an adaptation of Garamond's (the metal type) <em>Gros Canon</em>.</p>
      <p>As for Adobe Garamond, this typeface was designed many years ago (1989) under significant technological restrictions (e.g. at the time there was a limit to the number of nodes that each glyph could contain, before crashing a printer, for example). The whole family was modeled on Garamond's <em>Parangonne</em> and Granjon's <em>St Augustin</em>. The titling set you see on this family is the result of Robert's first take (Minion is the another example) at making optical size designs.</p>
      <p>The whole story is in Garamond Premier Pro's printed specimen. Can you get a hold of it?</p>
