    html: "<p>Mike: to my eyes, the Poggio is a most excellent match. I'd like to throw out <a href=\"http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=BRVEGEL&amp;search%5Btext%5D=codex\">Codex</a>, another one of Georg Trump's, as conveying some of the same flavor, if a bit more playfully than the literal script interpretations you posted.</p>"
