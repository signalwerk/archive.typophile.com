    votes: null
    html: "<p>There are a few pen scripts that Font Book puts in the Blackletter category that have some similar features: <br> <br><a href=\"http://www.myfonts.com/search?search%5Btext%5D=Carus\" target=\"_blank\">Carus</a> by Jurgen Brinckmann; <br><a href=\"http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=BREUGEL&amp;search%5Btext%5D=Madonna\" target=\"_blank\">FF Madonna</a> by Jurgen Brinckmann; <br><a href=\"http://www.fonts.com/findfonts/detail.asp?pid=203306\" target=\"_blank\">Poggio Bookhand</a> by Philip Bouwsma; and <br><a href=\"http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=BREUGEL&amp;search%5Btext%5D=Pompeijana\" target=\"_blank\">Pompeijana</a> by Adrian Frutiger. <br> <br>I would say that these are somewhat 'like' Bruegel's signature.</p>"
    html_clean: "<p>There are a few pen scripts that Font Book puts in the Blackletter category that have some similar features: <br> <br><a href=\"http://www.myfonts.com/search?search%5Btext%5D=Carus\" target=\"_blank\" class=\"link-external\">Carus</a> by Jurgen Brinckmann; <br><a href=\"http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=BREUGEL&amp;search%5Btext%5D=Madonna\" target=\"_blank\" class=\"link-external\">FF Madonna</a> by Jurgen Brinckmann; <br><a href=\"http://www.fonts.com/findfonts/detail.asp?pid=203306\" target=\"_blank\" class=\"link-external\">Poggio Bookhand</a> by Philip Bouwsma; and <br><a href=\"http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=BREUGEL&amp;search%5Btext%5D=Pompeijana\" target=\"_blank\" class=\"link-external\">Pompeijana</a> by Adrian Frutiger. <br> <br>I would say that these are somewhat 'like' Bruegel's signature.</p>"
