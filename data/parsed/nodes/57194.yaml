      <p>Don't use Arial just because it is popular (this isn't actually true for the most part - it is a "default") and recognizable (Actually I doubt it is recognized by anyone other than typographers), actually that would be a very bad design decision.</p>
      <p>There are many resources available for finding out information about <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> online, and many more in books. You might consider actually using the face so that you can include an informed opinion about how well it works or doesn't work for you.</p>
      <p>Start here:<br>
      <a href="http://typophile.com/node/13514" title="http://typophile.com/node/13514">http://typophile.com/node/13514</a>?<br>
      <a href="http://en.wikipedia.org/wiki/Helvetica" title="http://en.wikipedia.org/wiki/Helvetica">http://en.wikipedia.org/wiki/Helvetica</a></p>
      <p>Then consult your local library or bookshop.</p>
