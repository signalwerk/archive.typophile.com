    <p>hi, i am design student. On my "Digital Type" assignment we have been asked to to do a research on the font "Helvetica". I have seen the movie "helvetica".<br>
    So, if anyone have any interesting facts on the font and its history, it will be a valuable information for me.</p>
    <p>Cheers</p>
