      <p>Maybe I'm missing something, but when I checked I found nothing in those sites even resembling this font.</p>
      <p>And it looks like an actual font that's just been warped in Photoshop with an outline on it, and not really a custom design. The repeated characters look very much alike (though of course they could still be "hand made" and just duplicated).</p>
      <p>No one knows this one? Really? ;-)</p>
      <p>m.</p>
