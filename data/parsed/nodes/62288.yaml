    <p></p><div class="imageWrap"><img src="http://typophile.com/files/thesingingdetective_logo_6126.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/thesingingdetective_ste_5476.png"></div><p></p>
    <p>Anyone know what font was used in this logo? The warping screws things up a bit of course, but certain characters are quite distinctive, like S T and E (above).</p>
    <p>What the Font and Identifont both fails miserably. I have found two fairly similar fonts, but they're both too quirky compared to this rather straight one. So I hope someone here can crack this one.</p>
    <p>Cheers!</p>
    <p>m.</p>
