  html: "<p>FOR IMEDIATE RELEASE <br> <br>Typeco releases it's second font family - Chunkfeeder. <br> <br>Chunkfeeder was inspired by the vernacular forms of lettering created for high speed printing and electronic displays. These letters are seen all around us in such things as postal packing slips, airline tickets and informational video displays. Many of these fonts are designed by engineers and interface designers who presumably do not have a background in letterform design. Consequently these glyphs have many idiosyncrasies. <br> <br>In keeping with it's mechanical inspiration, Chunkfeeder is monospaced, much like an Optical Character Recognition (OCR) font. Chunkfeeder has a rather ridged  modularity but it incorporates some typographic nuance into the letterforms than most other fonts of this style, while exploiting some of the quirky visual artefacts of high speed printing. <br> <br>Chunkfeeder is a versatile family of 6 fonts -- 3 weights, each with an accompanying oblique. <br> <br>Typeco is an electronic type foundry for the designs of principal, James Grieshaber, as well as a provider of typographic services and solutions. Services offered by Typeco include font identification, signature fonts, logo fonts and handwriting fonts. Solutions include custom designed typefaces, logos and trademarks, branding and graphic design.  <br> <br>James Grieshaber has been active in the typographic community for several years now. Grieshaber most recently was on staff of P22 Type Foundry and helped establish International House of Fonts. He has been honored with an award of Excellence in Type Design from Association Typographique International (ATypI) for his Gothic Gothic type design. He has now struck out on his own to offer his services to those in typographic need and showcase his typographic vision. <br> <br>Contact info: <br>Typeco <br>PO Box 10661 <br>Rochester, NY 14610 <br>Phone: 585.230.1674 <br>Email: <a href=\"mailto:contact@typeco.com\">contact@typeco.com</a> <br>Web: <a href=\"http://www.typeco.com\" target=\"_top\">http://www.typeco.com</a></p>"
