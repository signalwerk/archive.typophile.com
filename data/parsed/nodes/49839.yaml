    <p></p><div class="imageWrap"><img src="/files/indy_4244.jpeg"></div><p></p>
    <p>This typeface been used by the Independent Truck Company since at least 1978.</p>
    <p>I always figured it was hand-done because I had only seen it used in their logo, but I just noticed it in use on some of their packaging as well, which led me to believe it’s a typeface.</p>
    <p>I’ve only seen it used in all-caps.</p>
    <p>Any ideas?</p>
