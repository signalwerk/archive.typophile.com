      <p>How extraordinary, Uli - - who made the changes, and why? And for an important German book, why on earth didn't they use Walbaum [Standard] or Prillwitz? </p>
      <p>Kepler MM (Multiple Master) remains remarkable for being the most ambitiously flexible text typeface ever released. It is an entire foundry in one font! The range and depth of the axes is a stunning technical achievement.</p>
      <p>Unfortunately, Kepler also illustrates the inadvisability of updating classics when the philosophy seems to have been, 'let's take 75% Walbaum but throw in a couple of distinctive ideas from Baskerville, a couple of inimitable Claude Garamond touches, a bit of Fournier, a bit of Didot' etc. etc. The result is a deracinated aesthetic that is not altogether persuasive.</p>
