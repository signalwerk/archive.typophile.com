    <p>Dear Typophiles, </p>
    <p>For a publication about Robert Slimbach, I'm looking for digital samples  (PDF, high-resolution bitmaps, high-quality photos) showing his typefaces in action. These might be book spreads, posters, newspapers, corporate identities or other quality typographic works. </p>
    <p>I'm looking for samples in all languages (not just English), both older (using the old Type 1 fonts) and newer (showing the OpenType versions), exhibiting both "classical" and "original/inventive" use of his typefaces, in particular his less known typefaces (i.e. not necessarily Minion). High-profile work, well-known brands etc. are also welcome. </p>
    <p>And, of course, I'm looking for works that I would be permitted to use in the publication (both print and web). </p>
    <p>As a reminder, below is a list of Robert's typefaces. </p>
    <p>Please contact me directly at <a href="mailto:adam@twardoch.com">adam@twardoch.com</a> with the subject line "Slimbach". </p>
    <p>Many thanks in advance! </p>
    <p>Regards,<br>
    Adam</p>
