    html: |-
      <p>&gt;The false assumption is that everybody<br>
      likes Slimbach’s type design perspective.</p>
      <p>Not at all, Hrant; as far as I know, nobody particularly likes Robert's perspective, but it is inarguably worth investigating. He has great technical skills, and has produced a large body of disparate work, albeit of scant originality. But you could say some of the same things about Goudy. Just because Goudy now seems fussy and dated doesn't mean that he isn't worth thinking about. </p>
      <p>&gt;BTW, interestingly Evert Bloemsma also had<br>
      high respect for Times. Which is not to say that<br>
      Morison, Lardent and/or Burgess could ever<br>
      have made something as sublime as Legato.&lt;</p>
      <p>Yes, but that's got nothing to do with what Morison was trying to do: he was trying to make a practical typeface that was as compressed (space-saving, green) as possible without offending the reader. In this he succeeded where everyone else has failed except Robert.</p>
      <p>Times wasn't about the sublime, it was about the purely functional, and amply demonstrated Morison's versatility. For Morison truly was interested in the sublime, and directly engendered the printing of more sublime books than any other single figure in the 20th and 21st century combined. </p>
      <p>Who was it who said more pragma, less dogma?</p>
