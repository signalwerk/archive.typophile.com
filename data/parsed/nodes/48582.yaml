    html: <p>Perhaps the best example of Minion MM on glossy paper is its use over several years in National Geographic magazine. A very nice example of Minion and Minion Expert on heavy paper, showing desirable ink gain (which also makes the face seem less narrow, to its advantage) is in the first American edition of Gitta Sereny's book on Speer. The book shows adept use of all ligatures, small caps, and osf, and is also notable for the designer's decision to turn the kerning off. A detailed description of the many modifications that have been made to the face over the years would be helpful.</p>
