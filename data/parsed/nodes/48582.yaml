    html: <p>I don't like Utopia at all, but the redoubtable Kathleen Tinkel found it very useful and always set one of her UNESCO magazines in it. I was going to make the same comment about William's original note - - of course he is right, you have to see the font in mass. Also consider that the old, inferior optical instances of MinionMM have been substantially revised and improved in the OT 'Opticals' series. The overriding weakness of the font for me is the italic - - it seems clumsy set next to the cool, practical elegance of the roman. The overwhelming importance of Minion for me is the degree to which we can tolerate its slight compression. I don't know of any design, other than Times, that does compression so comfortably. And all Times-haters would be are advised to remember that it is Robert's favourite font. By comparison, I find Stone Print just a trifle too compressed, though I think its expanded cousin Cycles is one of the top two or three text faces of the PostScript period.</p>
