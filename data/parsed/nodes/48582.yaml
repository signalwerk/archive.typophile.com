      <p>Bill, my point was that you can like or not like Slimbach's work, but still not subscribe to his valuation of Times. Your (inherited) logic was making a false assumption.</p>
      <p>BTW, I think Warnock is very nice.</p>
      <p>&gt; But you could say some of the same things about Goudy. </p>
      <p>Who says everybody likes Goudy? I don't.</p>
      <p>&gt; he was trying to make a practical typeface</p>
      <p>1) So was Evert. And he succeeded. He just wasn't in a position to force-feed it on people. On top of that, Legato is something New, which is extremely rare and helpful.<br>
      2) Times was fine when it was created (mostly because of ink gain), but it hasn't been fine for a long time. And Times was never sublime. And sublime (which to me has mostly functional and very little stylistic relevance) is a Good Thing.</p>
      <p>hhp</p>
