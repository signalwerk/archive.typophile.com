      <p>I think Tim and David are right. I messed with love... </p>
      <p>Actually I wanted to say:<br>
      "Love is a beutifull thing which can be a hell when we abuse it.".</p>
      <p>We may start from pure love, but then we lose the way<br>
      (we don't have a way to express it or we express it violently)<br>
      it can become monsterous. </p>
      <p>As demons are fallen angels.</p>
      <p>―christos</p>
