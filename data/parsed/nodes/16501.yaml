      <p>Tim, David, don't take this the wrong way, but I think you're being too Anglo. I think it's wonderful to counter sexual abuse with a positive option instead of with melodrama or a large stick. In fact note that the title of the competition included "the Way towards Healthy Sexuality" - that got my attention most. And you would never see that in the US. I think this is nicely Greek, and the approach that could actually work.</p>
      <p>hhp</p>
