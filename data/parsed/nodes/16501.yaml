    <p>Hello everybody </p>
    <p>There are 5 posters for a competition I took part in.<br>
    It was organised for the 2nd Panhellenic Conference<br>
    on Sexual Abuse. The theme was:<br>
    "No Longer a Secret: Dealing with Sexual Abuse<br>
    and the Way towards Healthy Sexuality". </p>
    <p>The competition is over (no, I didn't win)<br>
    and so now I can show my proposals. </p>
    <p>Any comments? (I already know that I overused the heart symbol...)</p>
