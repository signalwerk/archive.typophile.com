      <p>I think people are genuinely trying to help you with good branding.  Here are some perhaps provocative questions for you.  No need to answer them here, but you will probably have to answer them as you develop your business:</p>
      <p>"I don't really want to invest too much energy into this"<br>
      Why not invest some time and money into something as essential to the success of your business as branding?</p>
      <p>"it won't be used anywhere other than the website header"<br>
      Why even have a website when it doesn't relate to any other part of your business brand?</p>
      <p>"I'd really appreciate it if you could put the higher standards aside for a moment"<br>
      Why would you approach your business this way, do you want to communicate that sentiment to your customers?</p>
      <p>Waiting until you make enough to invest in a good identity and branding solution is like a computer programmer waiting to get a computer until they are a successful programmer.  In other words, you will likely never get there until you invest in consistent and effective communication with your potential customers.  That could be a logo, or it could be word of mouth, but you need to focus on the plan for communicating the value and benefits of your business to your customers.  Copying graphics is a waste of time that you could be spending working out the foundation of the business you are trying to create.  I do hope your business is a big success, and wish you all the best as you move forward with this challenging task.</p>
