    <p>I've fallen in love with a <a class="freelinking external" href="http://www.istockphoto.com/file-view/display/8000/13358/" rel="nofollow">banner over at iStockPhoto</a> and now I want to create something similar for my own logo, even using the same image.</p>
    <p>Thanks to the great support in the Type ID board, I could find out the font is RNS Camelia, so I could come up with this:</p>
    <p>...</p>
    <p>I don't really know, do you think the font is too thin?<br>
    It looks good it in the subtitle, though.</p>
    <p>I gave it a second shot using Segoe UI:</p>
    <p>...</p>
    <p>This doesn't look as professional by far...<br>
    I'm also unsure whether to use the Gaussian blur or not.</p>
    <p>Perhaps you could recommend a different font?<br>
