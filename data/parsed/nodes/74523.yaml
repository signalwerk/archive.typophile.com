      <p>&gt; not a single suggestion concerning the logo itself?</p>
      <p>I realize you're just looking for a quickie solution, but you're going about this the wrong way.</p>
      <p>You don't design a logo with a big promotional photo behind it. You first design a logo by itself; one that will work well on your letterhead, business card, etc, and that will work in black-and-white as well as color, and one that will work well in tiny sizes, and most importantly which does a good job of representing your business.</p>
      <p>Once you've designed the logo, then you can start thinking about applying it to web banners.  </p>
      <p>So put the photo aside and give your logo some careful thought and post some logo ideas by themselves, and I'm sure you'll get some advice.</p>
