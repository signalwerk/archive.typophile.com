    <p>Hello everybody,</p>
    <p>I’m in the process of designing a personal logo for my 6 month old baby boy. I’m planning to use the logo for his baptismal invitation.</p>
    <p>I’m attaching a JPG file with my initial direction for the logo.Please disregard kerning/tracking and other similar issues, I still have to clean up the type.</p>
    <p>1. Which do you think is the better design that I should focus on?<br>
    2. What do you think of pairing geometric shapes with Emigre Dalliance? (as in design [a])  Though I think I still have to adjust the weight of the geometric shape to better match the weight of Dalliance.</p>
    <p>Thanks in advance for your feedback.</p>
    <p>Joseph</p>
