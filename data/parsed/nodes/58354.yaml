    <p>Hey everyone,</p>
    <p>Working on a this proposal for new EeePC logotype.</p>
    <p>The typeface is Microsofts Consolas.</p>
    <p>It has been cut - subtle..</p>
    <p>Attached is the original logotype and my designs.</p>
    <p>I am liking 3.1 and 4 most. I've added perspective to 3.3 and 3.4</p>
    <p>I would like feedback on:</p>
    <p>• the cut directions (3.1 has variations - 4s cuts are all in the same direction),</p>
    <p>• if you think adding perspective looks good, and</p>
    <p>• anything else you want to add</p>
    <p>I appreciate your help, thank you in advance.</p>
    <p>With kind regards,</p>
    <p>Victor</p><div class="imageWrap"><img src="http://typophile.com/files/EeePC_logotype_1_3964.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/EeePC_logotype_2_3600.jpg"></div><p></p>
