    <p>I have to do a work about a typeface. The work consists of a small book about the typeface and the designer. My problem is, that I have to choose from a selection of typefaces where I (A) find the the typeface boring, or (B) I don’t find any background information.</p>
    <p>Some of the “better” typefaces from this list:</p>
    <p>Futura<br>
    Gill Sans<br>
    Univers<br>
    Meta</p>
    <p>Avantgarde Gothic<br>
    American Typewriter<br>
    City<br>
    Chicken Plain<br>
    OCR-A<br>
    Trixie</p>
    <p>I would love to do a work about OCR-A (can be interesting in terms of graphics), but i can’t find anything about it...<br>
    Which typefaces would you consider interesting to work on?   And in case you have any information about any of these typefaces (beside of links to websites), please let me know..</p>
    <p>Thanks in advance, Michi</p>
