      <p>Jesus,</p>
      <p>Are you sure you do not find none interesting?<br>
      Cosider Meta. Amazing font from an incredible designer.<br>
      Not talking about Futura, I mean, Paul Renner and geometric fonts,<br>
      more histoy to dive in than ... whatever. Fascinating subject of study</p>
      <p>Forget Avant Garde, too many posting on typophiles.<br>
      I love City, maybe because slab serif drive me crazzy</p>
      <p>Universe and Gill Sans... well great fonts and tons of info everywhere.<br>
      Came on make a choice you like! theres great stuff in your list,<br>
      and then start your research and you will be surprised how much info you find...</p>
      <p>let us now your choice if other than OCR-A</p>
      <p>G.</p>
