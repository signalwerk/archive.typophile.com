  html: <p>What does the “Create Opentype” command in Fontlab do? I get the impression that it generates tabular oldstyle figures, fake titling letters and figures, fake smallcaps, and the appropriate scripts, and that I can go adjust all of the outlines to make it work right. But it doesn’t appear to be documented, so maybe I’m wrong. What’s going on here?</p>
