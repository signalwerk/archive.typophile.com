    html: |-
      <p>James, </p>
      <p>it's one of the macros that ships with FontLab Studio. The main purpose of the macros is to show off some Python scripting. They are certainly not all "production ready", and haven't been updated in a while. I'm pretty sure the one you're referring to generates bad glyph names which would need to be fixed. </p>
      <p>Adam</p>
