      <p>I have to disagree with Tiffany on that, I think the R gives the logotype a little more character. However, I think the leg could be moved out a little further and the swoosh extended a bit. </p>
      <p>The curve of the C seems a little stiff and is it shorter than the d? </p>
      <p>Also the a's strokes are too thick and looks larger than the other letters (both taller and wider), especially on the back stroke. Plus that weird wedge... I'd maybe mimic the stroke of the n and even the R more.</p>
      <p>I don't know, but I want to see some of those strokes end in a point, even if it's just a the swoosh of the R. They way the end abruptly seems a little strange. </p>
      <p>You also might want to vary the extra strokes along the right side of the R and n, even if it's just moving one down so that they're not exactly the same. Same with the connecting strokes of the first 2 o's.</p>
      <p>All in all, this is very well done. I will agree with Tiffany, it is fun.</p>
