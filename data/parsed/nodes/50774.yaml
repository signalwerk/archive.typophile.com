    html: |-
      <p>I like it. (Where's the restaurant located? I'm in LA myself.)</p>
      <p>The one thing that might make it a bit less busy and more focused is taming the two "loop-backs" at the bottom-lefts of the "r" and "n", by making them not fully reconnect to their stems; and maybe disjoin the "C" from the rest. And while you're at it you might disjoin the bowl &amp; leg from the stem in the "r" (like you had in the original thread); for one thing that would reduce the possible confusion with a "p".</p>
      <p>&gt; I think the leg could be moved out a little<br>
      &gt; further and the swoosh extended a bit.</p>
      <p>I know this will sound cheesy (and done too explicitly it will most certainly be totally cloying) but I'm seeing the potential for hinting at a smiling face in there: the "ona" is the eyes and nose, and the swoosh of course is the mouth. But "hinting" is the operative word - it should barely be noticeable, something that somebody might eventually point out to a friend, yielding an "Aha!" moment. The desirability of this sort of thing does depend on the intended clientele however.</p>
      <p>One other thing: some of the curves are malformed (like the left side of the "C", and the bottom of the "s"). Now, this being a -presumably somewhat populist- Mexican joint, the so-called "vernacular" flavor of such wobbles might be a welcome touch of character. But if not, you might want to pay extra attention to the curve quality.</p>
      <p>hhp</p>
