      <p><em>Thuraya's baseline-shift trick is cool.</em></p>
      <p>You mean the unitisation of the baseline shift, or the cursive attachment mechanism in general. The latter is not new, and has been implemented in other OT fonts, but the unitisation in Thuraya is interesting because unlike various historical forms of type unitisation it isn't a technical requirement or limitation but a positive feature of the design.</p>
