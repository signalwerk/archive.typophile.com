      <p>For lettering of that nature, you’re unlikely to find a font that fully suits your needs as-is.  You might start with the letter shapes from a font, but they will have to be customized to fit the curves.</p>
      <p>If it isn’t too much trouble, could you share a rough sketch of your tattoo, lettering only for positioning and not style? Also, please translate what the words mean. This should give us more to go on in thinking up suggestions.</p>
