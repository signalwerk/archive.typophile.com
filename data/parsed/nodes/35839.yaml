    <p>Greetings all. For several months I have been searching for a proper font to ink onto my skin. My intent is to tattoo text int he form of a triskelion (<a href="http://commons.wikimedia.org/wiki/Image:Wheeled-Triskelion-basic.svg" title="http://commons.wikimedia.org/wiki/Image:Wheeled-Triskelion-basic.svg">http://commons.wikimedia.org/wiki/Image:Wheeled-Triskelion-basic.svg</a>) (or something very close to it. I can not seem to find a font that flows well when in a circle or a curve. I am looking for guidance as tot he types of fonts I should inquire about as well as specific font suggestions if you have them. The text will be written in Albanian, which uses a modified Latin alphabet. Thank you in advance for your help.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/1332" class="topic-previous" title="Go to previous forum topic">‹ Heavy Metal Typography</a> <a href="/node/35924" class="topic-next" title="Go to next forum topic">Alternative to/information about LinoLetter ›</a></div>
