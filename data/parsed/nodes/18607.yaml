      <p>Thanks for your comments. I quickly drew a few test glyphs in Korean, so now you have a rough mixed script text sample to look at. I agree that the Latin letters are too light, so that's something I'll have to deal with. But if you look at the Korean text in the sample, I don't think that's too light by Korean typography standards, although I can't be too sure before I have a printed proof to look at.</p>
      <p>The main problem with setting multilingual texts with Korean and Latin alphabets is that the Korean font is much, much lighter next to the Latin alphabet font (unless you use the Latin letters that come with the Korean font, but those are so poorly designed that they are practically unusable). So I tried to strike a balance between making the Korean font too dark and the Latin font too light, but I'll have to go through some trial and error on this one.</p>
      <p>Sebilar, thanks for pointing me to ITC Weidemann. It's illuminating to see how it deals with the problems I've been facing.</p>
