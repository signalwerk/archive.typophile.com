      <p>I doubt I'm a type design genius. Heh. But more importantly, there's no way I'll find the time to finish the project. This is really a theoretical excercise to satisfy my own curiosity about what is feasible. I didn't make this clear, but I do not expect to finish the font, at least in the grand form I envision it. Designing Korean fonts is full-time work taking many months at least, not something for an amateur like me to tackle in his spare time. </p>
      <p>The Non-Latin section of the MicroFoundry page is excellent, by the way. I always wondered how one goes about producing typefaces in a foreign writing system. Then again, I guess that's what I'm doing designing a Latin alphabet typeface, and I'm probably missing a lot of nuances and mixing styles.</p>
      <p>Anyway, the Hangul sample on the page is in a style known as 'sinmun batang', or 'newspaper batang' ('batang' describes the style analogous to serifs in Korean typography). Because of its wide and squarish letterforms, it lends itself well to multilingual setting, as the image sample shows. But as it's suited for small sizes, it's used exclusively in newspapers, or in other contexts (such as in advertising) to evoke newspaper texts. It is stylistically inappropriate for books and magazine articles.</p>
      <p>In the Hangul style I am going for, as the quickly-drawn sample glyphs indicate, the letterforms are higher than wide and the baseline is irregular. I gues I was trying to force-fit the Latin into proportions that would agree with these.</p>
