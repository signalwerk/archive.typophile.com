      <p>I think you should draw some test Korean and Cyrillic fonts concurrently. You need to get all the scripts to work with each other from the get go. I could give you tips on how to improve the Latin, but you might have to throw all those changes out for another round once you get to the other scripts. So, do yourself a long-run favor, and make this more difficult now by showing us mixed script text!</p>
      <p>In general, I think that your letters are a bit too light. Since this typeface is intended for use in text, I think that the forms need to be a little more robust.</p>
