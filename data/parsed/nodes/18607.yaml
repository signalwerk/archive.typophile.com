      <p>Brian, thanks for the kind words.</p>
      <p>&gt; This is really a theoretical excercise</p>
      <p>Oh.<br>
      Which is nonetheless something with its own sort of usefulness.</p>
      <p>&gt; I always wondered how one goes about producing<br>
      &gt; typefaces in a foreign writing system.</p>
      <p>A central issue to me is that of "nativity": an intuitive, subconscious grasp of something, preferably gained at a very early age (otherwise it can take many years of deep immersion). When making a font in a script in which you don't have nativity, it's possible to make funky display fonts*, or highly derivative text fonts, but not progressive text fonts.</p>
      <p>* Which is what I did with my Georgian design for example.</p>
      <p>&gt; ‘newspaper batang’ ... wide and squarish letterforms</p>
      <p>Which nicely parallels [good] Latin news face design.</p>
      <p>&gt; It is stylistically inappropriate for books and magazine articles.</p>
      <p>Very useful to know - thank you.</p>
      <p>What struck me most about that example is how amazingly well the serifs<br>
      in the Latin echo the stroke terminals in the Hangul! Really Good Design.</p>
      <p>&gt; I was trying to force-fit the Latin into proportions that would agree with these.</p>
      <p>Well, as you probably already realize, the "force" bit can't really work. And going back to your "I can’t seem to satisfy all these demands", I would say "don't worry, nobody can", and would suggest that good design of any kind, especially design of multiscript typefaces, is about a sensitive balancing of compromises, not absolutes. This is easier said than done though! And it can get very tricky depending on the particular combination of scripts covered.</p>
      <p>And a broader tricky thing is figuring out if <cite>any</cite> kind of compromising is going to work. In some cases it's possible that the decision will not become one of finding a balance, but instead will "snap" to a "no way", meaning that the two scripts agree to disagree so to speak. The Latin/Arabic combination is perhaps the most prominent one: as usual, it's tempting to try to equalize their apparent sizes, but even a small effort in this direction either makes the Arabic inauthentic or the Latin unreadable. In such a case the most one can hope for is even color between the scripts, and hopefully a compatible overall atmosphere.</p>
      <p>Whether Latin/Hangul is this sort of conundrum is unclear to me, but I actually think -based on things I've seen and other script combinations I've thought through*- that it's not. So I would definitely keep trying.</p>
      <p>* A good comparison being Latin/Hebrew, since the latter also has glyphs of uniform height.</p>
      <p>--</p>
      <p>BTW, it struck me that -in both style and proportions- your Latin design is not unlike Gentium, which happens to be a font that's: free; and has or will have a Greek, and probably a Cyrillic as well. So I'm thinking you should simply make a Hangul that's compatible with Gentium! And that might allow you to actually end up with something in addition to your "theoretical excercise".</p>
      <p>hhp</p>
