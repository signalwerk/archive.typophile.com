      <p>Hrant, thanks for your detailed comments. I've been looking through information about Gentium on the Internet, and I'm intrigued by the open source nature of the font. It looks like it has some really exciting collaborative work potential. Developing a version of Gentrium that supports Hangul really might be a worthy project.</p>
      <p>As a side note, I don't think the main releases of Gentium should include Korean support, because it would mean increasing the size of the font tenfold for a feature that probably the majority of Gentium users won't need. But a companion font that has Hangul support in addition to the main Gentium glyphs could be very useful to Korean users handling multilingual documents, and would fit in nicely with Gentium's stated goal of serving a variety of languages.</p>
      <p>I don't think my first-time efforts will produce a Hangul font worthy of being a companion to Gentium, which I'm really impressed with, but I'll give it a shot anyway, because I think someone should and I don't think there are too many amateur Hangul font designers out there. Because of the time and expense, I don't think the professional typographers would be willing to release fonts with a Gentium-type of open license.</p>
      <p>So I am working on the Hangul glyphs now, setting aside the Latin alphabet for the moment, and I'm trying to get it to harmonize with Gentium. I have no doubt that Hangul/Latin combinations can work beautifully; the newspaper typefaces are a great example. The Latin components of Korean fonts generally work well enough together with the Hangul, ugly as most of them are. In most cases, the Latin components are subservient to the Hangul (to borrow the term from the MicroFoundry website), which is one reason they don't work well as stand-alone Latin fonts. If we had a Hangul font that worked well on its own in addition to harmonizing well with Gentium, it would be a great improvement. Even though Gentium could be a bit too wide to be a perfect match for a narrower Hangul font, it won't be a problem that cannot be solved by tighter tracking, the usual solution to getting Latin fonts to work in a Hangul setting.</p>
      <p>I didn't think that I would actually complete a Hangul font, but I'm not so sure anymore. Maybe it's foolish optimism, but if I figure out a way of speeding up my design process, perhaps I'll be able to complete a makeshift version of the font in about two weeks, which is the amount of time I have before I begin my military service next month. Here's hoping I'll be able to make good progress...</p>
