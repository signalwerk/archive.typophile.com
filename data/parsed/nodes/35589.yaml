    html: |-
      <p>Your problems may also come from the options when you generate the font (but I would remove all kerning pairs anyway). For instance I just downloaded the [public domain]* icon font <a href="http://www.marvosym.de/download.html" rel="nofollow">marvosym.ttf</a> (Für Puristen) and installed it on my mac. TextEdit would'nt even see the font. So I uninstaled it, opened marvosym.ttf with fontforge, clicked "File &gt; Generate fonts", then clicked "Options" and unchecked "Apple", "Opentype" and "Old style kern" and then generated a new ttf font that I installed; everything seems to work nicely (always better to check the file with "Font Book" before installing, of course).</p>
      <p>[edit] * I meant Freeware; here is the copyright: <em>Martin Vogel's Symbols are freeware - look for information and new versions at <a href="http://www.marvosym.com" title="http://www.marvosym.com">http://www.marvosym.com</a> - Neue Versionen und Informationen finden Sie auf <a href="http://www.marvosym.de" title="http://www.marvosym.de">http://www.marvosym.de</a> </em></p>
    html_clean: |-
