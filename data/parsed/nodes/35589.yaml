    html: <p>Here is a modified <a href="http://www.iro.umontreal.ca/~boyer/typophile/symbols2.sfd" rel="nofollow">sfd file</a> and the resulting <a href="http://www.iro.umontreal.ca/~boyer/typophile/Untitled2.ttf" rel="nofollow">Untitled2.ttf</a> file. The fact that the space character was undefined caused some problems and I just added it. The name of the font (independently of the filename) is, as you chose, "Untitled2" and when I select it in Word, Photoshop or Inkscape, I do not experience any of your problems. Maybe I should add that I am a LaTeX user and, for my very limited needs, fontforge has so far proven enough. This implies nothing for use in more sophisticated environments.</p>
