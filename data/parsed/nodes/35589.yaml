    html: <p>The glyph that occupies the "s" needs to have the contours merged. The contours are currently overlapping. Spacing alone should be able to handle the shapes of your symbols, so I'm not sure why there are kerning features and other kerning pairs added. Between the coffee cup and the wheelchair, there is a positive kern of 3075. It seems if you need a specific space between those two characters, you could put them together as a single glyph.</p>
