    <p>I'm trying to put a few symbols together in FontForge to use as a font, but it turns out to be tricky.</p>
    <p>In Illustrator, it seems that the last Symbol always doesn't show. In TextEdit there is hardly any line spacing. Quark crashes...</p>
    <p>I've uploaded the resulting TrueType font and would be grateful if someone could have a look at this, maybe with FontForge and tell me what on earth I have to do differently.</p>
    <p><a href="http://nullsieben.co.uk/ArtFund-Symbol-A1.ttf" title="http://nullsieben.co.uk/ArtFund-Symbol-A1.ttf">http://nullsieben.co.uk/ArtFund-Symbol-A1.ttf</a></p>
    <p>Maaaaaaaany thanks!</p>
