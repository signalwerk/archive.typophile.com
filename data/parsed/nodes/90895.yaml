    <p>Hello, I am new to this forum. I am not at all experienced in design or typography, so I apologize in advance.</p>
    <p>I noticed the version of Akzidenz-Grotesk used on Josef Müller-Brockmann's posters (<a href="http://www.blanka.co.uk/supersize?product=1301" title="http://www.blanka.co.uk/supersize?product=1301">http://www.blanka.co.uk/supersize?product=1301</a>) is different from the digital versions currently available from Berthold. To me it looks like the bowl lowercase 'a' is more curved at the top, as it is in Helvetica. Also, the foot (what do you call that?) is much smaller, almost gone. It actually looks a lot like the 'a' in the logo at the top of the website that says "Blanka." Is this not Akzidenz-Grotesk? If so, why are the newer versions different? Is there currently a typeface available that more closely resembles that of the poster?</p>
    <p>Thank you for your time!</p>
    <p>Regards,<br>
    trough</p>
    <p><em>EDIT:</em> I just found <a href="http://typophile.com/node/41683" title="http://typophile.com/node/41683">http://typophile.com/node/41683</a>, which has mostly answered my question. But I still have not found a version that has that nice lowercase 'a.'</p>
