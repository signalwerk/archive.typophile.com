    <p>I'm thinking about matching <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/utopia/black/" rel="nofollow">Utopia Black</a> as a headline with <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/mark_simonson_studio/proxima_nova_condensed_thin_set_ot/" rel="nofollow">Proxima Nova Condensed</a> as a subhead...it's for a university student newspaper I'm redesigning. I wonder, are there any other alternatives to Proxima Nova Condensed that I could test out? I really love the contrast between the two but I am not 100%  sold on Proxima Nova.  </p>
    <p>Appreciate the help!<br>
    Vikki</p>
