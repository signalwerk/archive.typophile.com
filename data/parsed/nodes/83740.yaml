    html: "<p>This all boils down to what it is you like about Proxima Nova. Sindre Bremnes' Telefon has a light cut in the works and a lot of similarities in structure. There's no condensed style though. Other geometric sans serifs with condensed styles: Graphik, Gotham and VF Sans.</p>"
