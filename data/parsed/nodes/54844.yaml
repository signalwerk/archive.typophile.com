    html: |-
      <p>You can get this kind of book printing from an online service such as <a class="freelinking external" href="http://www.lulu.com/" rel="nofollow">Lulu.com</a>. <a class="freelinking external" href="http://www.acmebook.com/" rel="nofollow">Acme Bookbinding</a> near Boston will give more personalized service.<br>
      Both can ship internationally, but to a book printer, anything under 1000 copies is a very short run. If you plan to print several hundred copies, you may prefer to print them in Europe to avoid a very slow and/or expensive delivery. <a class="freelinking external" href="http://www.integratedbook.com/index1.html" rel="nofollow">IBT Global</a> has a facility in London.</p>
