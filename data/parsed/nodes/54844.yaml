    <p>Hello everyone at Typophile!</p>
    <p>This is my first post at Typophile. The question I´m asking it´s not typography related, but here it goes anyway.</p>
    <p>I´ve designed a small book (it was my graduation course thesis) about typeface legibility and readability, and I would like to know if anyone knows about any company that offers services on very short runs of book printing and binding? </p>
    <p>I live in Portugal, so the company must have a shipment service to Portugal.</p>
    <p>Thanks very much.</p>
