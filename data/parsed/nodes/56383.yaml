    html: |-
      <p>Hi!</p>
      <p>I was wondering if you have typography classes in you school. When I did graphic design the first thing they thought me was basic calligraphy, which was not neccesarily fun but thought me a lot about the shapes of letters, contrast, serifs, pen direction etc. This forms the basis of many classic letterforms and fonts. When I experimented with type myself, I also started with this kind of modular font, which is fun, though it's use is quite limited (A text set in this font would be quite difficult and tiresome to read)</p>
      <p>For this font I would try to include some more variation, as it is pretty static now. Try to work more with curves, as it would make the font more lively. It's probably a lot easier to do some sketching by hand to try some more flowing forms and letters, based on what you have now. You can also have a look at this font, originally deisgned by Jan <a class="freelinking external" href="http://www.fonts.info/info/en_iwan-reschniev.htm" rel="nofollow">Tschichold</a>, which is a good example of a modular typeface.</p>
      <p>For future fonts I would advise you to start with just writing and drawing letters by hand, perhaps with a broad-nip pen. This will give you a better understanding of the shapes of letters. Also study fonts you like, how are they made, make big copies of letters and imitate them. This will also help you to understand what makes a good font. After this comes kerning, letter- and wordspacing and a whole lot of stuff I won't bore you with now. Most important thing: have fun with letters, if this is the case, all the rest will follow naturally.</p>
      <p>cheerio Queneau</p>
