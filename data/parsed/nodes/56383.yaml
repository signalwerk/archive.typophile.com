      <p>Welcome!</p>
      <p>I too take inspiration from plants in a lot of my design. However, when I look at yours I see more digital than vegetable... I had the same problem in my first design, which was also modular. I think modular typefaces are a fine way to start out, but after building things based on modules, you often (always?) need to go through each letter, and add some "life" or "personality".</p>
      <p>I would try adding a little modulation, and perhaps a few curvier lines.</p>
