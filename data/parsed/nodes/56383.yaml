      <p>Care to post those first drafts here as well? Of course, it's important to listen to critiques given by your teachers, but I think you should <em>always</em> do what <em>you</em> think is best! </p>
      <p>I agree with the others that the organic feel isn't really very clear, because the typeface is so angular. I think a bit more roundness will improve the design. For example, look at <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/ff-cocon/" rel="nofollow">FF Cocon</a>. I'm not saying you should make your design like this, but you get an idea about what is possible with a given theme.</p>
      <p>I don't know what your school is like, but at my art academy they welcome a litte stubbornness. That you choose your own direction, even if they don't neccessarily agree with it. I'm sure if you tell your teacher that you have explored this direction now, but that you feel you should also explore other possibilities, that she will be ok with that. Or at least, I hope. :)</p>
