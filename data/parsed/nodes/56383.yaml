    <p>Hi guys, I'm currently in my 2nd year of Graphic Design and I have to make my own typeface. I haven't named it yet. This is my first typeface, so I'm really a newbie so please teach me guys :) I've made all the lowercase, and haven't made any of the uppercase. Sorry if my English is bad though..</p>
    <p>If anyone has any suggestion for the name, I'll gladly consider about it. This typeface is inspired by the shape of the leaf. And please don't mind the bad spacing..</p>
    <p>Thanks :)</p>
