    date: 2004-08-21T07:31:00
    date_raw: 21 Aug 2004 — 7:31am
    votes: null
    html: <p>It's very similar to a film type called Benguiat Charisma, which was once included in the Expresiv Photolettering Font Collection put out by Tiger Direct in the mid-90's. <br> <br>The intial letters are a lot like <a href="https://web.archive.org/web/20141114044229/http://www.myfonts.com/fonts/linotype/candice/" target="_blank">E+F Candice</a>, but Charisma's lower case is more like this sample.  I may have a sample of Charisma in my Script Guide, and I will post it if I do.</p>
