    <p>I just wanted to share a technique I've developed for acquiring good fonts on the cheap: Find old, cheap software at thrift stores like Goodwill or the Salvation Army. </p>
    <p>Example:</p>
    <p>I purchased Microsoft Greetings, software circa 2001, for $.50 yesterday. I pop it into my machine, and what do I find? A legit license for the Font Bureau's Hightower Text that would have otherwise cost me roughly $100 on <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/hightower/buy.html" rel="nofollow">Myfonts.com</a>. </p>
    <p>At the same time, I bought an old copy of Wordperfect for $1 that included a full family of Futura, of which I had only the default Mac set + the extra bold from Elsner+Flake.</p>
    <p>Anyone else have any good finds like this? Also, anyone take issue with this technique?</p>
