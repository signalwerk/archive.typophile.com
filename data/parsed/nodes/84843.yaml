      <p>While it may not be good for the industry in some theoretical way, as a practical matter it doesn't amount to much. </p>
      <p>Most folks who buy used software at a thrift store are not doing so to acquire new fonts; the fonts are just a side effect of their purchase. If the fonts cost extra for licensing, they'd probably just skip the purchase or chose not to license them. It's not the same thing as music piracy in which obtaining the music is the person's goal.</p>
