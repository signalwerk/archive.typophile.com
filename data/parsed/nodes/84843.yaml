    html: <p>So buying second hand records is bad too because it doesn't support the music industry?  I don't even see this as a grey area.  At the time Font Bureau licensed their font to Microsoft, they would most likely have been paid for it very reasonably.  To expect them to get paid for it again every time it changes hands is ridiculous.  I understand that the nature of fonts and software means it's likely that the font hasn't just changed hands, but has in fact been duplicated, but that's the nature of letting your fonts get into the hands of OEMs.</p>
