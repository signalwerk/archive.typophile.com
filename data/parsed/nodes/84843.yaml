      <p><em>So buying second hand records is bad too because it doesn't support the music industry?</em></p>
      <p>On the contrary; buying second hand records supports an aspect of the music industry: record stores. Are you arguing that there exists a comparable model in the type design industry: second-hand fonts?</p>
      <p>To clarify my previous position, I don't think there is anything inherently wrong with this method of acquiring type, but I do think it's a side-effect of a broken model for selling software. With the transition to more and more purely digital methods of licensing software, there will be no more boxes of second-hand software in thrift stores.</p>
