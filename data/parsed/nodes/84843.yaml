    html: <p>It's been mentioned here multiple times that Corel Draw is a particularly good buy online or at a thrift store if you can find it. I'll extend that further to Corel Office, which has an unusually large amount of type from Bitstream, as well as several Adobe knockoffs like the very un-creatively renamed Lithograph, and Charlesworth. There are some surprises as well, like Gerard Unger's Oranda &amp; Amerigo (both released by Bitstream), and an enormous selection of Scotch Moderns like DeVinne. The one thing you don't get with any of these old fonts is a workable set of figures or small caps. Still, as a reference collection, this is a fantastic deal.</p>
