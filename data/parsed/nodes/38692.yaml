    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 1.Nov.2007 6.48am </div>
      <p>Introducing P22 Chai Tea at special sale price.</p>
    <p> From Calligrapher &amp; Type Designer Stephen Rapp, designer of P22 Bramble and P22 Tai Chi, comes the new script font Chai Tea. The name is play on Rapp’s Tai Chi font, but his new font evokes exotic and relaxing lands, warm and full of unexpected flavor, like a nice cup of Chai Tea.</p>
    <p>P22 Chai Tea is unique among brush lettering scripts. Its sweeping strokes and luxurious use of horizontal space lend personality and warmth to any project. Its sturdy letterforms make it ideal for logos, stationery, titling and packaging. The Pro version is stacked with alternative characters and ligatures programmed to substitute contextually in programs that support OpenType features.<br>
    In addition, Chai Tea Pro contains Central European Language support that includes many ligatures with accented characters.</p>
    <p>For the month of November, the Chai Tea Pro set is on sale for 25% off at $29.95 (regular price $39.95) <a href="http://p22.com/ihof/chaitea.html" title="http://p22.com/ihof/chaitea.html">http://p22.com/ihof/chaitea.html</a></p>
    <p>——————————-<br>
    New Web Design</p>
    <p>October brings a new uniform look to two divisions of P22.<br>
    P22 type foundry and International House of Fonts now have a standard viewing option for selecting fonts. Each font can be seen in its full set option or as single faces. We hope you like this, because we do. <a href="http://www.p22.com/ihof" title="http://www.p22.com/ihof">http://www.p22.com/ihof</a> As always, you can try any of your own sample text out for any of our fonts with the TypeCaster:<br>
    <a href="http://www.p22.com/typecaster/master/caster.html" title="http://www.p22.com/typecaster/master/caster.html">http://www.p22.com/typecaster/master/caster.html</a></p>
    <p>——————————-</p>
    <p>Until next month...</p>
    <p>P22 type foundry<br>
    <a href="http://www.p22.com" title="http://www.p22.com">http://www.p22.com</a></p>
