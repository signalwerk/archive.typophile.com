    date: 2003-10-21T12:15:00
    votes: null
    html: <p>I guess I got too much into condensing with the guillemets. I have to open them more, and even more for the extended versions. <br> <br>&gt;An extended typeface usually should be slightly heavier than its lighter companions, for optical compensation. <br> <br>That's a good answer, Thanks</p>
