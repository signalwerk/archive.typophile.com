    html: <p>Thanks for the comment. I've tried to curl the brackets but no success, I have to work it and do some spacing. <br> <br>What's wrong with the guillemets? <br> <br>&gt;&gt; Should all glyphs compress and extend with the alphabet?  <br> <br>&gt;Yes, I think... but I'm not sure if I understand your question.  <br> <br>I mean it's kind of hard to make for example an  extended period, exept by spacing... should I just leave some glyphs identical in different widths of the face, like punctuation and math signs, if yes, which ones? <br> <br>Which ampersand?</p>
  - id: 13809
    user_id: 1353
    user_name: eomine
    user_path: null
    date_raw: 21 Oct 2003 — 11:49am
    date: 2003-10-21T11:49:00
    votes: null
    html: <p>The guillemets, I think they're too narrow and too tight. <br>The ampersands, they're all nice. But maybe the regular one (the first from left to right) is the more useful. <br> <br>&gt; should I just leave some glyphs identical in  <br>&gt; different widths of the face <br> <br>Now I understand your question. In fact it's a good question. I guess my answer to this question is no, don't make glyphs identical through different widths. <br>An extended typeface usually should be slightly heavier than its lighter companions, for optical compensation.</p>
