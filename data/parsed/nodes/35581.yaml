    html: |-
      <p>I'm a big fan of dstype -- nice selection, great prices, and good quality. I'll definitely be picking up something before August 14th.</p>
      <p>I use Priva for my own materials. It works great for display and text, and it also seems to hold up pretty well when printed at low resolutions (like inkjet). My only complaint is that the g tends to stick out a little in text blocks, but I've been very pleased with it.</p>
      <p>Cultura is also one of my favorites. The shapes are beautiful and the spacing is a little wider than normal, so it reads a little more smoothly in my opinion. I'd love to see it available in OpenType.</p>
    html_clean: |-
