      <p>I went buck-wild yesterday and bought 5 (Leitura News, Leitura Display, Estilo, Estilo Script and Volupia), for some new projects. There is also a further discount when buying full families – well worth the buy.</p>
      <p>I bought Cultura a few months ago for a job (soon to be completed) and I’m more than pleased with it. My only problem is that it would be handier in Opentype format.</p>
