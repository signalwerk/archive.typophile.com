    html: <p>Yes, teachers still require students to submit papers in MLA format, which is 12pt double-spaced, <i>x</i> number of pages, etc. etc. <br> <br>Although Berlidin looks nice enough, it seems so wide that I am sure a teacher would notice the wideness and mark points off for that. At school I have found something called Palatino on some computers, Palatino Linotype on others, and both on some. They seem identical except Palatino Linotype has more leading. Would these work for schoolwork? Also, I have found a typeface called Georgia, but the problem is that numerals are non-lining, and I do not know if my teacher would object. I unfortunately do not seem to have Palatino at home, although I do have Palatino Linotype. Is there somewhere I could get Palatino for free if it is a good typeface for homework?</p>
    html_clean: <p>Yes, teachers still require students to submit papers in MLA format, which is 12pt double-spaced, <i>x</i> number of pages, etc. etc. <br> <br>Although Berlidin looks nice enough, it seems so wide that I am sure a teacher would notice the wideness and mark points off for that. At school I have found something called Palatino on some computers, Palatino Linotype on others, and both on some. They seem identical except Palatino Linotype has more leading. Would these work for schoolwork? Also, I have found a typeface called Georgia, but the problem is that numerals are non-lining, and I do not know if my teacher would object. I unfortunately do not seem to have Palatino at home, although I do have Palatino Linotype. Is there somewhere I could get Palatino for free if it is a good typeface for homework?</p>
