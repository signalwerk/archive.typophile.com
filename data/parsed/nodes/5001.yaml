    html: <p>Great suggestions all. The only thing I do not like about Whitman (other than the price as you pointed out) is that it seems almost like a sans serif typeface with blocky serifs added on, rather than having thick and thing strokes and having serifs that curve from the text. That may be merely a matter of preference though, and it may look fine at small sizes, I do not know. <br> <br>About the Baskerville typefaces, the first one (Storm's) I question only because they basically said they were too cheap to look at all his work and copy it, they just looked at some letters and made the rest in the same style. <br> <br>On the other hand, Fountain's version has no boldface typeface. I don't use boldface, but what if I needed to for some reason? <br> <br>By the way, does anyone know if any of these typefaces are included with any Adobe software? <br> <br>Thanks, <br>Iain</p>
