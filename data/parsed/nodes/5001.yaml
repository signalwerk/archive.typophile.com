  html: "<p>I am in high school, and I type essays and other material Literature and also History. When I type essays et al., I generally use Times New Roman, because that is the default in most word processors, including MS Word at school and OpenOffice.org at home. However, I do not like this typeface, as it seems narrow and rather ugly. I am wondering what might be a good replacement typeface that would look good but not be too wacky as it would not be accepted by my teachers. I have done a little research into typography in general, and it seems that I prefer oldstyle lettering to modern (e.g. the contrast between narrow and wide, the way the thin points of an `o' are vertically aligned from each other in modern, et al.). What might I use? <br> <br>P.S.: My father has legal access to almost every version of Photoshop and Illustrator, so typefaces that come with those applications are easily accessable. Also, I am a high school student, and I would like to avoid spending $100 on a typeface, so try to suggest ones of little or no cost. <br> <br>Thank you in advance, <br>Iain</p>"
  html_clean: "<p>I am in high school, and I type essays and other material Literature and also History. When I type essays et al., I generally use Times New Roman, because that is the default in most word processors, including MS Word at school and OpenOffice.org at home. However, I do not like this typeface, as it seems narrow and rather ugly. I am wondering what might be a good replacement typeface that would look good but not be too wacky as it would not be accepted by my teachers. I have done a little research into typography in general, and it seems that I prefer oldstyle lettering to modern (e.g. the contrast between narrow and wide, the way the thin points of an `o' are vertically aligned from each other in modern, et al.). What might I use? <br> <br>P.S.: My father has legal access to almost every version of Photoshop and Illustrator, so typefaces that come with those applications are easily accessable. Also, I am a high school student, and I would like to avoid spending $100 on a typeface, so try to suggest ones of little or no cost. <br> <br>Thank you in advance, <br>Iain</p>"
