    html: '<p>Do teachers in highschool still go by the antiquated measurements of x number of pages, double spaced? <br> <br>If so, then you probably want something that comes in a wide version, or, even better, extra-wide. Will save you countless hours trying to fluff up boring papers. ;o) <br> <br>Berlidin seems to fit the bill. Alas, it only comes in one style/weight: <br> <br><a href="http://www.myfonts.com/fonts/t26/berlidin/" target="_blank">http://www.myfonts.com/fonts/t26/berlidin/</a> <br> <br></p>'
