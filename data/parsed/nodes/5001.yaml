    date_raw: 1 Jun 2004 — 12:12pm
    votes: null
    html: <p>Palatino at 12pt. actually occupies a bit more space than Times, which can be a pretty significant gain over a few page essay.  This is a Good Thing if you have page limits, but Palatino does look quite a bit different in terms of page color, so the teacher might notice. <br> <br>If you wanted something in the same vein that's just a better type, perhaps you should try a Baskerville, maybe like <a href="http://www.stormtype.com/jbasker.html">Storm's</a> or <a href="http://www.fountain.nu/catalogue/baskerville1757.asp">Fountain's</a>. <br> <br>I've also used Jenson and Garamond, and I prefer them both to Transitional types for this sort of paper. <br> </p>
