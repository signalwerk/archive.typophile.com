    <p>Hey everybody,</p>
    <p>With the summer holidays comming up, I'm starting to make some sort of  planning for what I'm gonna do. I've never been to TypeCon or one of the alikes, and I don't know if I should. I'm probably the only teenager there and (Typecon, at least) it's quite expensive. I'm willing to pay more than I should though ;-P If you got any advise about type activities from July 4 to August 19 that would be great. If possible close to the Netherlands and not too expensive.</p>
    <p>Cheers!<br>
    Jasper de Waard</p>
