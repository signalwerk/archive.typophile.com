      <p>Well, I guess you're too late for Typo Berlin (ended three days ago).<br>
      <a href="http://www.typoberlin.de/2011/index.php" title="http://www.typoberlin.de/2011/index.php">http://www.typoberlin.de/2011/index.php</a></p>
      <p>TypeCon is not terribly expensive as conferences in general go. New Orleans is not the closest possible US destination, but not the worst, either.<br>
      <a href="http://www.typecon.com/" title="http://www.typecon.com/">http://www.typecon.com/</a></p>
      <p>ATypI is more expensive, but its prices include lunches. However, we have substantial discounts for students, and I would expect airfare to Reykjavik would be reasonable (compared to New Orleans, anyway).<br>
      <a href="http://www.atypi.org/2011-reykjavik" title="http://www.atypi.org/2011-reykjavik">http://www.atypi.org/2011-reykjavik</a></p>
      <p>ATypI has not yet announced prices for this year's conference (Real Soon Now), but they will be similar to last year's:<br>
      <a href="http://old.atypi.org/30_past_conferences/03_Dublin/70_register" title="http://old.atypi.org/30_past_conferences/03_Dublin/70_register">http://old.atypi.org/30_past_conferences/03_Dublin/70_register</a></p>
      <p>Regards,</p>
      <p>T</p>
