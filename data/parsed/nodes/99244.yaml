      <p>Yes, I was entirely serious.</p>
      <p>Some of the letterforms are quite novel, but many follow an established Art Nouveau pattern; overall they are well matched and ﬁt nicely.<br>
      The theme of bowed diagonals is consistently applied, with the occasional exception, to produce full counters, and that theme is continued in letters such as /a, /e and /g.</p>
      <p>The bowed diagonals are echoed in the triangular bowls of /B, /P and /R in a manner that is used in a genre of Art Nouveau types.<br>
      The full counters work with the small serifs in the tight ﬁt, to drive white space inside letters, not between, for a controlled and individual text colour. The narrowness of /f and /t also speak to this colour.</p>
      <p>The capitals are pretty much the same width—this too is a consistent theme.<br>
      The /v and /y do not share the same shape, but that would be simplistic consistency if they were, whereas here the principle that is adhered to is “how far can this letter be bent/opened up?”—and in that respect, the /y references other /y’s that follow the “u” construction.</p>
