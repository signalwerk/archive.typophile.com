      <p>I beg to differ from Loxley’s analysis.</p>
      <p>In 1923 the original Souvenir was actually behind its time, with its art nouveau forms, which would perhaps still have been current when it was designed, before the War.<br>
      Similar vibe to Hobo, a slightly earlier Benton face.<br>
      Souvenir’s construction was somewhat based on the round-nibbed Speedball pen.<br>
      Both those types were in styles that Benton derived from lettering artists, although his Souvenir was quite typographically disciplined.</p>
      <p>Art Nouveau was popular in the late sixties and early 1970s, hence some of Souvenir’s appeal then.<br>
      With its small serifs, it was suited to tight setting, in vogue during the 1970s.<br>
      Arnold Bocklin was another art nouveau style popular then.<br>
      Souvenir also had some of the soft ﬁnish of Cooper Black, which had no weight or style range, so Souvenir kind of acted as a slicker, more contemporary Cooper Black family.<br>
      It held up well as a text type in photosetting, no hairlines or pointy serifs to disappear in less-than-perfect processing.<br>
      Good for foil stamping too, thermography and embossing.<br>
      Ed’s Souvenir was not at all informal or laid back, but rigorously stylized, very precisely drawn.</p>
      <p>Rather than informal, one could say “friendly”, and that might explain how it became cloyingly so, when overly familiar.<br>
      The Light made an interesting effect in text.<br>
      Ed Benguiat continued to mine Art Nouveau, with his original designs Benguiat, also huge in the 70s, and Barcelona, not at all popular when it came out later.</p>
      <p>I don’t see why Souvenir should be viliﬁed now, when rounded styles such as GE Sans have bowed diagonals, so Souvenir again, sure, and perhaps other original rounded serif designs. There have been some, but it’s not an easy task, and Ed aced it.</p>
      <p>The style really needs dramatic letter forms, such as art nouveau, to counteract the blandness of the soft ﬁnish, small serifs, and low contrast.</p>
