      <p>Ed Benguiat's Souvenir was enormously popular in the 1970s. It became the obvious choice for anyone who wanted a casual, contemporary look. By the mid-1980s, Souvenir had turned into a cliché, and designers joked about it the way they do now about Papyrus and Comic Sans.</p>
      <p>By the time PageMaker and QuarkXPress came on the scene, Souvenir had fallen out of popularity, so a whole generation of designers (and designer wannabees) never added it to their repertoire. Maybe it's due for a revival.</p>
      <p>Like Papyrus and Comic Sans, Souvenir is a little too soft and flabby for general use. It has its niche, and that niche is things like a menu for a restaurant that specializes in ice-cream sundaes, or a logo for baby-care products.</p>
