    <p>Hi,<br>
    I am looking at some lead typefaces of the 1910s and 1920s and I wished to ask if someone has pictures of the 1914 original version of Souvenir, by Morris Fuller Benton (I haven’t found so much online).<br>
    I have come to appreciate the new design which Ed Benguiat did for ITC, but I would like to see how the original looked in print.<br>
    Any help is really appreciated.<br>
    Many thanks in advance!  :-)</p>
