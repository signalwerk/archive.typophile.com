      <p>@Nick Shinn:<br><cite>In 1923 the original Souvenir was actually behind its time, with its art nouveau forms,</cite></p>
      <p>Indeed, that is true, which is precisely why it was unsuccessful and unfashionable at the time of its introduction. The fact that the Art Noveau style turned out, eventually, to be worthy of a revival, however, means that <em>Souvenir</em> could indeed have been ahead of its time <em>as well</em>... but while we're still dealing with an anachronism, it is not one of the kind that leads one to suspect a causality violation.</p>
      <p>@piccic:<br><cite>Papyrus is another beast, but it is a typeface.</cite></p>
      <p>Souvenir is a typeface. In the sense that Comic Sans might not be one, as it's "digitized handwriting", one could say the same of Papyrus (or some more highly regarded typefaces, such as Mistral, Dom Casual, President...) to a lesser extent. (Ondine, on the other hand, seems too formal and regular to be vulnerable to this criticism/classification, and the same is true for a lot of the older formal script typefaces.)</p>
      <p>One thing Comic Sans is not, though, is a satisfactory typeface (in the sense of the typeface vs. font distinction, which is value-free as far as where the vectors came from) for comic book/strip word balloon lettering. That may be "digitized handwriting", but it's still the product of genuine craftsmanship for its purpose - as a visit to the site</p>
      <p><a href="http://www.comicraft.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.comicraft.com/</a></p>
      <p>should abundantly demonstrate. There's a reason why these guys can charge top dollar for their products, while competitors like</p>
      <p><a href="http://www.blambot.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.blambot.com/</a><br><a href="http://canadatype.net/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://canadatype.net/</a></p>
      <p>that still produce good products struggle in their shadow.</p>
      <p>(Of course, part of the reason is that among the products of ComicCraft are very close imitations of the lettering of Artie Simek and Sam Rosen... and many of their other typefaces were designed in close collaboration with current letterers for Marvel, DC, and other major comics publishers.)</p>
      <p>Given that, whatever the failings of Comic Sans may be, I'm a little uncomfortable with saying it's "not a typeface" because of its classification - although I'm happy to acknowledge that it does belong to a class of typeface that doesn't have much to do with the Trajan Column. </p>
      <p>Oh, here, I'll just give you <a href="http://hayfamzone.blogspot.ca/2012/06/tribute-to-ben-oda.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this link</a>.</p>
      <p>Calligraphy is not typography; but because calligraphy is worthy of respect, Freehand and Goudy Mediaeval are typefaces.</p>
