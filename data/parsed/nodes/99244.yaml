      <p>Now, John (and everyone despising it), would you explain me why Souvenir is not good?<br>
      It’s not a book-aimed text typeface.</p>
      <p>I used to dislike Souvenir (and nmany other late 19th century and 20th century typefaces which had a resurgence in the 1960s), but now that I have come full circle and learned to dig deeply into the turn of the century forms, I can no longer see Souvenir as a 1960s "iconic" alphabet: I just see an amazingly well crafted typeface, despite of taste.</p>
      <p>Again, for clarity’s sake, I am not looking at it as a typeface I’d use to set a book, but you get my point, I hope.</p>
      <p>And while I am at it, I would need to know if someone could address me to the most complete, or better drawn, digital version of Windsor (I’d need the regular and bold weight). Those available on MyFonts look similar, and it seems there are glyphs missing. And "one size fits it all", of course… :-)</p>
