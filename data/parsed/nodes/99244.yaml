      <p>Given that, whatever the failings of Comic Sans may be, I'm a little uncomfortable with saying it's "not a typeface" because of its classification - although I'm happy to acknowledge that it does belong to a class of typeface that doesn't have much to do with the Trajan Column. </p>
      <p>Oh, here, I'll just give you <a href="http://hayfamzone.blogspot.ca/2012/06/tribute-to-ben-oda.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">this link</a>.</p>
      <p>Calligraphy is not typography; but because calligraphy is worthy of respect, Freehand and Goudy Mediaeval are typefaces.</p>
