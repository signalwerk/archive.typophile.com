      <p>I think my comment was enough clear, and quadibloc understood in general what I meant.<br>
      I do not feel at ease with Comic Sans simply because it is not "designed", neither by construction nor by lettering standards. I mean, with digital type design you can turn any set of letters into typeface format, but this does not mean Comic Sans is a typeface for the lettering of comic books. As quadibloc already explained, lettering for comic books is usually detailed, accurately crafted. Comic Sans was designed to work onscreen, and it does his work, but let’s not call it what is not. Namely, what is an "handwitten" face? Just use handwriting.</p>
      <p>Maybe my eyes are not yet trained enough, but I really cannot see all the problems in Souvenir, which I consider a thoroughly accomplished type design. I used to hate most of the typefaces of the turn of the century which got "revived" in the 1960s but now I see them in a more correct light.<br>
      Honestly, John, I can’t see all the "poor cordination", and Nick (Shinn) has already replied in a way better way than I could have possibly done myself. I generally go by eye, and Souvenir is harmonic, no matter if the forms are more or less decorative, or straying from "established model". Those are not, strictly speaking, the only parameters which determine an inherent quality of a typeface.</p>
