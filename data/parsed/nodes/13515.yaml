    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Max Miedinger</strong></p>
    <p>Swiss<br>
    Born 1910 in Zürich. Died 1980, also in Zürich.</p>
    <p>Max Miedinger is known a type designer, mainly for his design of the <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> type family (actually, <a href="/wiki/Haas%20Grotesk" class="freelinking" rel="nofollow">Haas Grotesk</a>). </p>
    <p>In the late 1920's Miedinger trained as a typesetter, and eventually went to work for <a href="/wiki/Edouard%20Hoffmann" class="freelinking" rel="nofollow">Edouard Hoffmann</a> who was the director of the <a href="/wiki/Haas%20Typefoundry" class="freelinking" rel="nofollow">Haas Typefoundry</a>. At the foundry, Miedinger worked primarily as a salesman. But in his spare time, at Hoffmann's behest, he designed a sans serif face, <a href="/wiki/Haas%20Grotesk" class="freelinking" rel="nofollow">Haas Grotesk</a>. Haas partners <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> and <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> expanded the design into the complete <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> family from 1957 onward. </p>
    <p>Helvetica's sucess was huge, and it put him on the map as a type designer. Linotype paid him a stipend for his contribution to their corporate success until his death in 1980—a very uncommon practice at the time.</p>
