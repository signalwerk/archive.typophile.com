    <p>Max Miedinger is known a type designer, mainly for his design of the <a href="/node/13514/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helvetica</a> type family (actually, <a href="/node/13718/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Haas Grotesk</a>). </p>
    <p>In the late 1920’s Miedinger trained as a typesetter, and eventually went to work for <a href="/node/add/wiki?edit%5Btitle%5D=Edouard%20Hoffmann" title="Create node &quot;Edouard Hoffmann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Edouard Hoffmann</a> who was the director of the <a href="/node/add/wiki?edit%5Btitle%5D=Haas%20Typefoundry" title="Create node &quot;Haas Typefoundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Haas Typefoundry</a>. At the foundry, Miedinger worked primarily as a salesman. But in his spare time, at Hoffmann’s behest, he designed a sans serif face, <a href="/node/13718/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Haas Grotesk</a>. Haas partners <a href="/node/12158/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">D. Stempel <span class="caps">AG</span></a> and <a href="/node/13697/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype</a> expanded the design into the complete <a href="/node/13514/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helvetica</a> family from 1957&nbsp;onward. </p>
