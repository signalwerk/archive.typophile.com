    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>: Max&nbsp;Miedinger</strong></p>
    <p>Swiss<br>
    Born 1910 in Zürich. Died 1980, also in&nbsp;Zürich.</p>
    <p>Max Miedinger is known a type designer, mainly for his design of the <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> type family (actually, <a href="/node/13718" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Haas Grotesk</a>). </p>
    <p>In the late 1920’s Miedinger trained as a typesetter, and eventually went to work for <a href="/node/add/wiki?edit%5Btitle%5D=Edouard%20Hoffmann" title="Create node &quot;Edouard Hoffmann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Edouard Hoffmann</a> who was the director of the <a href="/node/add/wiki?edit%5Btitle%5D=Haas%20Typefoundry" title="Create node &quot;Haas Typefoundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Haas Typefoundry</a>. At the foundry, Miedinger worked primarily as a salesman. But in his spare time, at Hoffmann’s behest, he designed a sans serif face, <a href="/node/13718" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Haas Grotesk</a>. Haas partners <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> and <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> expanded the design into the complete <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> family from 1957&nbsp;onward. </p>
    <p>Helvetica’s sucess was huge, and it put him on the map as a type designer. Linotype paid him a stipend for his contribution to their corporate success until his death in 1980—a very uncommon practice at the&nbsp;time.</p>
