      <p>Thanks Giordano. The two families I suggested were designed with history in mind. </p>
      <p>Oz is an hommage to and reflection of the work of Oz Cooper; channeling Cooper Black (and the rest of the Cooper family) in a contemporary way, and "constructed" as we are able to do with digital technology.</p>
      <p>Polaris is an unabashed capital-M Modernist family in the mould of Helvetica, Univers, and Akzidenz Grotesk which inspired those types.</p>
      <p>Some of the lesser priests of Modernism descended upon Montreal from Switzerland and Germany in the run-up to the 1976 Olympics, meanwhile Oz Cooper's work has always appealed to Montrealers, with our love-hate relationship with American corporations and popular communications. We embraced internationalism and the International Style, but couldn't help ourselves from mixing it up with some sweaty funky expressionism.</p>
