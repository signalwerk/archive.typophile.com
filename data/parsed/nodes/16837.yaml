    <p>I am working on the layout for a magazine about the Montreal music scene, called The Montreal Chord. The magazine covers everything local, from new start-ups to established acts, and shows and festivals. It also has a liberal editorial line and some serious news features. The layout uses very tightly set Century Gothic for Section Names and headlines. The editorial pages have a serious black and white design, whereas the rest adds colours and vibrant pictures. The magazine really focusses on great pictures, and the clean, modern layout accentuate this.</p>
    <p>I am now trying to decide on a good font for body text... I don't know whether to use Century Gothic all the way through, or to use a different font. If I choose to go with a different one, I would be looking for something a little retro, reminiscent of the days of 8-tracks and the October Crisis. Any suggestions?</p>
