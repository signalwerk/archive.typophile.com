      <p>Thanks again for all your suggestions, everyone. Nick, I really like Worldwide, and I will seriously consider it.</p>
      <p>“One font that ... early 90s.</p>
      <p>“Oh, and the thought of setting ... revenge.”</p>
      <p>I'm not looking for "historically relevant". Historical relevance is relevant to the past, not the present (thus the name...), and the magazine is not for consumption in 1972 but 2006. I only want to recall this city's glory days, which has nothing to do with being true to them. The point is to re-examine the past, not re-create it.</p>
      <p>As for legibility, who cares? It's a magazine, not a textbook. There is always a tradeoff between style and legibility, and as I mentioned in my original post, the image sought is stylish and graphic (therefore treating headlines as graphics rather than words makes sense).</p>
      <p>"Some of the lesser priests of Modernism descended upon Montreal from Switzerland and Germany in the run-up to the 1976 Olympics,"<br>
      "There was another migration there during the Expo 10 years earlier."</p>
      <p>That would explain why every single public sign is set in Helvetica (I'm serious—every single one).</p>
      <p>EDIT: When I said "... to recall the city's glory days", I actually meant to recall the most dramatic and interesting (culturally and politically) period in the city's history. The Glory Days (the 60s) were pretty Toronto-esque (i.e. cookie-cutter North American city, not to offend any uptight white-bread vieille-souche anglo-saxon loyalists :P)</p>
