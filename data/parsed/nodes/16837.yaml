      <p>&gt;One font that isn’t at all historically relevant is Century Gothic. </p>
      <p>Headliners International (the typositor foundry), who prefaced all their font names with "neo", did small x-height versions of most classic faces, including "Neo Mini Futura".</p>
      <p>I would also expect there to be big x-height "Futuras" from other photo-lettering foundries, going back to the 1960s.</p>
      <p>But you're right Thomas, it's not a very classy face; however, that may be its appeal here.<br>
      Similarly for the tight headline setting, I'd have to see it in context to form an opinion.</p>
