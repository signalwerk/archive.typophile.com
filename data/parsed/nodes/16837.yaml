    html: <p>I definitely would NOT use century gothic for body copy, but I am a big fan of legibility, and I don't consider body copy the appropiate place to get overly creative, or "designy." There's plenty of opportunity to get more expressive with the headlines, subheads, pull quotes, etc... There are a lot of good serif typefaces that could work with century gothic. There should be other threads on this site that would cover magazine body copy. Sounds like a great project, good luck with it...</p>
