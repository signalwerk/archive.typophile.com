      <p>It's always interesting when someone wants a "retro" look from the 60s -- 80s as most of the target audience have no frame of presonal reference.</p>
      <p>I think you are thinking about a "softer, nicer" version of retro underground scene, and as Nick said, in reality were often brutally frugal on use of quality prepress material, with re-sized xerox images for paste-ups, hack &amp; slash headlines, et al.</p>
      <p>If you mean "Mr. Black" of early Rolling Stone magazine, he was hardly considered underground since he was previously art director for New York Times Sunday magazine, and a lover of historic metal typefaces.<br>
      (edit: my mistake, NY Times was after Rolling Stone, per his bio <em>"He did a brief stint at a Texas ad agency (oddly, but importantly, he is contemptuous of commercial corporate design), went out to Los Angeles and another underground newspaper, and then to Rolling Stone, where he became one of the principal creators of the Rolling Stone look -- taking the underground mainstream."</em>)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/RollingStonecover1.jpg"></div><p></p>
