      <p>&gt;Exactly. Any ideas?</p>
      <p>For something that would be a 1970 authentic Canadian magazine text face, but not a type that is still widely used, I would recommend Bookman. It has a heft that would hold its own against the Century Gothic, and they are a good match history and style-wise. As a Linotype face, it has the period-but-modern feature of equal-width roman and italic. It also had some cachet as a display face at that time, especially the Italic with swash.</p>
      <p>Of my own faces, I would recommend <a href="http://www.myfonts.com/fonts/shinn/worldwide">Worldwide,</a> a Century revival, with the large x-height coming into vogue in the early '70s.</p>
