      <p>One font that isn't at all historically relevant is Century Gothic. I mean, it's a knockoff of one typeface (Futura) adapted to fit the metrics of another (Avant Garde). I don't think Century Gothic existed until the early 90s.</p>
      <p>Oh, and the thought of setting Century Gothic extra tightly is a bit disturbing. I mean, first use Century Gothic, and then set it tightly!? Did the person who came up with that have a personal grudge against legibility or something? Did legibility kill their parents and leave them an orphan? It must have been something pretty intense to go that far in revenge.</p>
      <p>Regards,</p>
      <p>T</p>
