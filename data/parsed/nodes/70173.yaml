    html: <p>Thank you very much for that Nicola, and I am very interested to hear your experiences Andreas and I congratulate you on your innovation. I am pleased that there is now a forum going on to discuss this approach. There is nothing new about it except the attachment of a name, and I claim no authorship what so ever as far as the idea is concerned. If it is useful to those reading this forum that is great. I am just trying to find ways to diversify my business. I also think that the role of typography as the primary material of branding in its broadest application has been undervalued. I believe more collaborations between the users of type and the type designers will benefit everyone including, of course, the client.</p>
