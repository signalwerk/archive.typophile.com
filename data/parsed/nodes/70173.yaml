      <p>Good idea Sumner, thanks to share Tiffany (via FB).</p>
      <p>I think this model of a licence by computer, as any software wasn't the best solution when started, as for any design project, illustration, photo follow each member of a team and stop to be used when the project is over. But the fonts are different and this always caused some trouble.</p>
      <p>Despite that I like this idea, I'm not sure how its easy to follow because fonts are generally handled by the computer and stay on some font folder even when a project is over (not the case for images, illustration, etc.) Perhaps with new capacities of Mac OS who activate the necessary fonts when you open a document… will be more easy?</p>
      <p>Typekit and others in fact use this method and make the all thing more easy for users. They paid a monthly fee for some uses, <strong>we</strong> as typeface designers, receive a fee based on uses and number of websites. All are happy and when our fonts stop to be used for a website, they don't stay on the computer of the designer of this website. So its really by project or by use. <a href="http://typekit.com/foundries/porchez-typofonderie" title="http://typekit.com/foundries/porchez-typofonderie">http://typekit.com/foundries/porchez-typofonderie</a></p>
      <p>Clearly a different way than to sell "life" license to graphic designers.</p>
      <p>Last but not least, I have recently updated my end user licence on same way as House Industries to take a common example requesting various things such logo use and I request now that my fonts be credited on the colophon (note that this last thing is in fact on French authors rights law…) <a href="http://www.typofonderie.com/alphabets/licence/" title="http://www.typofonderie.com/alphabets/licence/">http://www.typofonderie.com/alphabets/licence/</a></p>
