      <p>A really interesting idea, and certainly worth trying.</p>
      <p>That said, however, I would not buy type licensed this way. I buy tools and use the tools - I don't rent them and pay per-use.</p>
      <p>If I had to add the additional layer of deciding what, among the 400-some-odd families I own licenses to, could be used for which project ... I would simply not use that type, and move onto something that respected the purchaser and user - because I don't see that as exclusive of respecting the maker.</p>
      <p>In fact, I'd just go ahead and delete any files I had that were that difficult to use, period, and I'd do the same in the office I manage. Too complicated, too much room for error. We've spent a lot of time making sure we never use any type we're not entitled to use; I can't add to that burden, unfortunately.</p>
      <p>Like Juliet, I absorb the cost of type and spread it into my invoicing. I don't bill clients specifically for type - it wouldn't be ethical to do that if I were going on to use the type for other projects.</p>
      <p>But Sumner should be congratulated for trying something new, and I'm certain there will be situations where this will make sense for clients and designers. Just because it doesn't work for me doesn't mean it won't work for some folks.</p>
