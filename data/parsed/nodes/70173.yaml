      <p>When a type designer has a new and original font, being able to license it at a higher price for a use such as a logotype does seem fair.</p>
      <p>Only a few type designers, though, would be in a position to use such a licensing model; those whose typefaces are the most highly sought after. Thus, until you are a renowned type designer like Sumner Stone, it's likely not a licensing model you could get away with.</p>
      <p>Also, of course, corporate customers that are serious about their logotypes probably will want to commission fonts for their exclusive use in any event.</p>
