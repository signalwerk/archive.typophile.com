    html: <p>The link on the website doesn't explain things (unless I'm clicking on the wrong one), but it sounds as though if you license the font once, use it in a book, and then decide to use it again in another book, you've got to relicense it? That seems like a lot of work for everyone. And when it's hard enough to get designers to license fonts once, it seems like it will be very difficult to get them multiple times. Yes, I know that should be billed to the client, but what if you're an in-house designer? Do I have to relicense the font for each project? Getting one's non-designer boss to agree to that would probably be pretty tough.</p>
