      <p>Obviously if I want to licence a particular typeface, I must accept whatever licensing model and conditions the vendor offers. That said, I can choose to avoid models that aren't convenient for me, and buy from someone else. And certainly, unless a client was demanding a certain typeface in a project (and I generally avoid clients who tell me how they want something designed), I would tend to avoid typefaces licences with the use-based model. Betty covers the salient issues well. </p>
      <p>I think typeface designers who want to go to a use-based model should consider continuing to offer the standard "royalty-free" licence as well. I haven't seen any examples of pricing myself yet, but I would expect to pay less to licence a typeface to, for example, set one book, than I would for the "use it for anything, any time" licence. I prefer to pay more for the latter for its flexibility and ease of management.</p>
