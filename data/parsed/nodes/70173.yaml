      <p><cite>If a designer really finds dealing with case-by-case font licensing terribly challenging he probably needs to find a line of work that is not so intellectually trying.</cite></p>
      <p>If they don't like case-by-case licensing, they just won't buy your fonts. No need for them to go find another line of work, unless and until case-by-case licensing becomes the norm.</p>
      <p>Designers who can handle today's existing EULAs well may very well be able to deal with case-by-case licensing well, too. The already-existing and larger problem, IMO, is that most designers do not in fact deal with the differences in today's licenses very well. Most just pay the license fee and then do with the fonts whatever they think is covered by the license, or ought to be.</p>
      <p>Therefore, I don't think this majority of today's users/buyers are going to both license and pay on a case-by-case basis. To me the question is, will they just license other fonts in the first place, or license and neglect to pay for future use?</p>
      <p>Of course, if the licensors of *your* particular fonts are a specialized elite who "get" font licensing and have no problems with this stuff, then maybe it will work fine as a business model. But I don't expect this model to take over the font world in a hurry.</p>
      <p>Cheers,</p>
      <p>T</p>
