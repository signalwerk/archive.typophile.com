      <p>My impression is that the discussion so far, merely focusing on the license part and asking whether licensing typefaces per project is a good idea or not, misses the perhaps more essential part of the <a href="http://stonetypefoundry.com/projectfontslice.html" target="_blank" rel="nofollow">announcement</a> which is customization of the typefaces for a given project:</p>
      <p><cite>Custom characters, hand-lettering or calligraphy, special weights, and even alphabets in related writing systems are all possible additions.</cite></p>
      <p>And this is an idea which I like pretty much. It is not about just handing over some fonts, it is about integrating a typeface into a project.</p>
