      <p>Rubbish. Stock photo designers have been selling their work on a per-use basis for decades and the buyers have often had no clue who stood behind the camera. When the people who sell design tools treat said tools as if they have value as more than a cheap commodity there are plenty of users who respond in kind.</p>
      <p><cite>I view this as a step in establishing typography as almost always a significant part of the branding aspect of graphic design and publishing.</cite></p>
      <p>I hope this works well for you Sumner. When I started Dunwich Type Founders I followed the lead of House Industries and Typetrust; putting <a href="http://www.dunwichtype.com/?page_id=1025" rel="nofollow"> licensing restrictions on my own designs</a> regarding use in logos, identity systems, and stock graphics. I have stated on Typophile many times that type licensing needs to be more than the one-license-fits-all-uses model, and I am happy to see a designer of your stature has similar opinions.</p>
