    html: "<p>Here's my little contribution to the thread. I've been licensing few fonts in the last years, mainly for books projects, and the relationship with the type designers, besides the fonts quality, has always been an important issue for me. Sumner Stone (nice to see him here, by the way) has always been very supportive and collaborative when asked, via e-mail, about particular features of some of his fonts - Cycles and Magma, specifically; and even when asked about other, more generic typographical matters. Kent Lew, whose Whitman I regulary and happily use as a book cover type, even gave me interesting and insightful layout advices. I will also mention Jurgen Weltin and Veronika Bunian as very collaborative designers. Other type designers, who I will not mention here, and to whom I sent physical copies of the books set with their types, didn't even answered to my e-mails (maybe they didn't like the result). That is to say: the relation with the type designer is very important, at least for someone, like me, working in a independent, amateurish graphic environment (at home, when kids are sleeping), but with a appassionate and genuine approach. But yes, I agree that not every type designer can afford such a use-based kind of licensing; thought I also also believe that licensing font famlies for hundreds of euros or dollars via big font sellers (as I have seen) could not be the best way to sell fonts - not to big graphic studio, who can afford those prices, but to single users.</p>"
    html_clean: "<p>Here's my little contribution to the thread. I've been licensing few fonts in the last years, mainly for books projects, and the relationship with the type designers, besides the fonts quality, has always been an important issue for me. Sumner Stone (nice to see him here, by the way) has always been very supportive and collaborative when asked, via e-mail, about particular features of some of his fonts - Cycles and Magma, specifically; and even when asked about other, more generic typographical matters. Kent Lew, whose Whitman I regulary and happily use as a book cover type, even gave me interesting and insightful layout advices. I will also mention Jurgen Weltin and Veronika Bunian as very collaborative designers. Other type designers, who I will not mention here, and to whom I sent physical copies of the books set with their types, didn't even answered to my e-mails (maybe they didn't like the result). That is to say: the relation with the type designer is very important, at least for someone, like me, working in a independent, amateurish graphic environment (at home, when kids are sleeping), but with a appassionate and genuine approach. But yes, I agree that not every type designer can afford such a use-based kind of licensing; thought I also also believe that licensing font famlies for hundreds of euros or dollars via big font sellers (as I have seen) could not be the best way to sell fonts - not to big graphic studio, who can afford those prices, but to single users.</p>"
