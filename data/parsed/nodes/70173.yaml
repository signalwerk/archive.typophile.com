    html: <p>Thank you all for the feedback. Very interesting. I do not necessarily think that this kind of licensing is good for everyone. I believe it fills some niches and I think it will be useful for both independent type designers and graphic designers, and will give them a platform on which to collaborate in a win-win scenario. In my case, I am happy to set trial samples for presentations to clients or internal presentations to management. We are also willing to work with clients, and if appropriate their clients, to facilitate the optimum use of typography in their product(s). I view this as a step in establishing typography as almost always a significant part of the branding aspect of graphic design and publishing.</p>
