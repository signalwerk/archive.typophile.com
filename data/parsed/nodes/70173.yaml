    <p>This morning I received an email from <a href="http://www.stonetypefoundry.com/" rel="nofollow">Stone Type Foundry</a> announcing their new licensing model to be rolled out on June 1st. My first thought was, "Sounds like a lot of more work." But then I thought, "well I have been telling designers to work directly with foundries for years." So I emailed Sumner and asked him for a little more information. He replied saying: </p>
    <p><em>"The license will be tailored to each project, and the fee will depend on the intended use of the fonts. Each use or category of use will be licensed separately. The licensing fee is intended to be realistic in terms of the value it the font adds to the product. A logotype is one thing, a book, or book title another."</em></p>
    <p>In my opinion this makes a lot of sense. And is much more user-friendly. I can see how it might be a lot more work for the larger foundry, but for a boutique/smaller it makes good sense.</p>
