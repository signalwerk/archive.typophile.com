      <p><cite> think that has a lot to do with today’s licenses mostly being simple variations on the same all-you-can-eat formula. There’s a great deal of language being recycled between different foundry licenses and they all look a lot alike.</cite></p>
      <p>I've had occasion to carefully read several dozen different font licenses in the recent past, and I disagree rather strongly.</p>
      <p><cite>If font licenses start to vary more, and if the licenses are comprehensible, I think designers will adapt.</cite></p>
      <p>Again, I disagree: the variance is half the problem, and not a solution.</p>
      <p>However, if you are saying that the wording/language of the licenses is part of the problem, then I agree: that's the other half of the problem, IMO. But given that the purpose of the licenses is to be legal contracts, and that they are generally written by lawyers, I don't see that problem going away.</p>
      <p>So, to sum up: the fact that licenses vary wildly is half the problem, and that the licenses are in legalese the average person can't understand is the other half of the problem.</p>
      <p>Cheers,</p>
