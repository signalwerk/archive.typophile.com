    html: <p>Juliet, you, and other designers in your situation are fortunate to have many good fonts available at relatively low cost. That is the reason you have been able to pursue your business as related to fonts in the way you have. This seems quite a good fit with your clients, evidently. I do not believe use-based licensing to be the solution for everyone. It is a niche and it diversifies my business. It is still possible to license very useful text and display fonts in the old manner from Stone Type Foundry. They cover a wide range of uses and include the recently released ITC Stone Sans II. There are therefore now three tiers of fonts in my library. 1) Those that have been licensed in the usual fashion and are licensed also for distribution by other foundries. 2) Those that have been licensed more recently but with a much narrower distribution than 1 and will only be licensed on the use-based model as of June 1, 2010. 3) Those that have never been licensed to anyone for anything. Cost and exclusivity go together. I simply want the fonts to earn their living.</p>
