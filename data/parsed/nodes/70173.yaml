      <p>As a designer who works with a variety of clients (including some large corporations), I would not license a font with use-based licensing. Sometimes one project will be used in the future as the basis for another project, and I might not know up front that that will be the case. The second project may not come for months or years. I simply don't want to have to worry about accidentally using a font against the EULA, and I don't want my client to have the perception that I am nickel-and-diming them by raising my price to cover extra licensing when they already licensed a font once.</p>
      <p>I usually license fonts for myself without charging the client (especially if it is a font I can use again). However, use-based licensing would mean I would have to charge the client since the font could only be used on that one project. My projects are not usually big enough to absorb an extra licensing fee.</p>
      <p>If the client made a special request for a font I wouldn't turn them down, but I'd make sure they understood the licensing ramifications. Same with Rights Managed images. These days, I rarely recommend a rights managed image to a client, and if I do (or they request one) I make sure they understand exactly what that means. I've had some unpleasant conversations when a client asks to use an image in a second piece, and I have to remind them that they will need to pay to license the image again.</p>
      <p>I do feel the same way about EULAs that forbid pdf embedding. I never know when a client will say, "Oh, yes, and please also make a pdf we can post on the web." or "We decided that we'll be putting that print ad in our email newsletter."</p>
