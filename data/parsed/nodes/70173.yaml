      <p><cite>Despite that I like this idea, I'm not sure how its easy to follow because fonts are generally handled by the computer and stay on some font folder even when a project is over (not the case for images, illustration, etc.) Perhaps with new capacities of Mac OS who activate the necessary fonts when you open a document… will be more easy?</cite></p>
      <p>I do not consider ease to be especially important. In a this context fonts are a tool handled by professional designers. Professional designers are by definition an intelligent class of workers. Given some of the complex tasks designers handle I do not think it too much to expect them to sort the particulars of font licensing before finalizing a design. If a designer really finds dealing with case-by-case font licensing terribly challenging he probably needs to find a line of work that is not so intellectually trying. In larger design shops whomever signs off on production should have no more trouble dealing with font licenses than he would with stock photo licenses, paper choices, special ink mixes, web hosting, etc.. In short: yes this licensing is more complicated for designers but dealing with it is their job.</p>
