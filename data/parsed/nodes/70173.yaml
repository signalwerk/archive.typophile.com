    html: <p>I've been an independent graphic designer for 21 years and now I design typefaces too, but my experience has been the same as its_betty, above. I've never charged a client for a font purchase. I've absorbed it as a business cost and added the font(s) to my library. I have an open mind about this whole business model, but since just about all my clients are nonprofits I know they will balk at the idea of paying a license fee to use a font family. The average client does not realize that a piece looks good because of the fonts you chose, whereas it's easy for them to imagine what it would look like without that stock photo. I may be very particular about the fonts I use, but if the client thinks another font would do just as well I can't pass on the cost of using the font I select. So I fear that usage licensing will raise my overhead. It will definitely be easier for larger design firms to pass on these costs, just like they charge for copies, faxes, etc.</p>
