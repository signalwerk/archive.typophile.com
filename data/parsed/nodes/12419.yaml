      <p>I'm a newbie working on a blackletter-related project of my own right now, so maybe my insights will be of some use to you. Before I say anything else, though, I have to say one letter's not much to go on. You probably knew that already, though, right?</p>
      <p>Remember that the German name for blackletter translates as "broken letter", which means that the calligraphic articulation in the letter forms is very strong, and stroke changes are often dramatic and irregular. Right now, there's some sort of conceptual breakdown happening between the left side of your h, which reflects this understanding, and the right, which is more like a traditional antiqua. The foot on the right stem makes the entire stroke feel a lot heavier than the stroke on the right, because it's so stolidly planted and the serif is so heavily bracketed. Also, having the calligraphic tail on the left pointing up conflicts with the flat orientation of the serif. You might be able to resolve this conflict by slimming the right stem, but that might unbalance the whole letter.</p>
      <p>I think the real solution is to figure out how to get the two feet to work together, either by making them more similar, or by making it clear in the design that they're supposed to be so dramatically different (the way that some of those postmodern remix fonts use obvious discontinuities to show you, the viewer, that they know they're a bizarre mixture of Bodoni and Helvetica, or whatever). What you have right now is kind of a camel, and needs refinement.</p>
