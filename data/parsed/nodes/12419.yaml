    <p>This is the very first stage, about 7 or so hours, of my senior project. I would appreciate any feedback. My inspiration for has been blackletter. It is roman semi-serif though. I didn't want it to have the characteristics of blackletter or even the feeling of it, just used as inspiration.</p>
    <p>1&gt;  this is a miniscule h. I've only done a partial uppercase roman alphabet before. ( if it sucks, tell me )<br>
    2&gt;  this is very preliminary, please excuse any dirty edges<br>
    3&gt;  specifically, i'm not sold on the upper serif on the stem ( work or no )<br>
           Sometimes I think it works, other times the part of me that is never happy with my own work says no.<br>
    4&gt;  intended to be a text face, thinking about a display version, too early to do that.<br>
    5&gt;  also, advice on how to develop my other weights. should i do one entire weight set, and then do italic and bold/light/small<br>
    caps from that, or should they be developed side-by-side?</p>
    <p>Thanks</p>
