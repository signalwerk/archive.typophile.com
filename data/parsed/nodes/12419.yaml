      <p>I want you to do a good job too ;-). Almost any form can work in combination with other "imaginary" forms that don't yet exist. Its the getting the combination to work right that is the magic. Try it out. You don't need to make a complete lowercase. Try a word with lots of different "parts" in it, like "adhesion" or "absicht" (or anything, really…)</p>
