      <p>I agree with Forrest that there's a detachment between the two halves of that "h" - that's the first thing I thought of when I looked at it. And yes, one thing you could do is reduce that, either by changing the terminals (which might however tame the original concept too much), but also possibly by changing the connection from the arch to the stem - like making it flow into the stem instead of having such an abrupt join.</p>
      <p>But I can see another approach too: make a font that looks intentionally "hybrid". This might make extra sense here because your source of inspiration (blackletter) is looking largely absent now to be honest - and if it DID inspire you somehow it might be smart to make its presence stronger*. But if you try this route, be careful of one thing: that the result doesn't look like it was made in the 90s!</p>
      <p>* Look at the Fraktur subcategory of blackletter to see an old-school hybrid in action.</p>
      <p>As for the funky head serif, I think it could work, but maybe try to make it more like the bottom-right foot serif (which might also help tie the two halves together better, if you decide to go that way).</p>
      <p>And yeah, make more glyphs! Although a single glyph can be a firestarter, a font is like a little machine, a car engine, and you need a lot more than a spark to get it going places!</p>
      <p>hhp</p>
