    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hungingnumeral_4386.gif"></div><p></p>
    <p>OK, So I am a huge fan of Hanging Figures (or lowercase figures, or old style, whatever). I know that some sans faces have them, but many don't.</p>
    <p>I have altered the numerals for the Trade Gothic Condensed to make the numerals look better with the all lowercase text. Still, I know better than to alter a typeface.</p>
    <p>I would like to know if this is just dead wrong, is it okay? I didn't squish any letterforms.. I actually manipulated some of the anchor points. Part of me is ticked with myself for thinking about it, and another part likes the way it looks.</p>
    <p>Please tell me what you think?</p>
    <p>Thanks,</p>
    <p>evan</p>
