      <p>i'm more of a self taught novice than most folks here, but here's my two cents:</p>
      <p>in general, i'm all for customizing - font designers may cringe, but sometimes you just have to tweak something a little. it can be tricky but the challenge is the fun. i'm also a big fan of hanging figures and have customized a few non-hangers in my day.</p>
      <p>in your example, however, i'm not sure the font supports it. in particular, the top curve of the 2 in its unaltered state doesn't seem to match the altered curves of the others (5,3,8,6). i suspect that the integrity of these numerals in their unaltered state is strong enough to resist modification. </p>
      <p>since you're mixing fonts, perhaps there is a sans with hanging figures ?</p>
      <p>a quick search found these examples:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hangers_5397.png"></div><p></p>
