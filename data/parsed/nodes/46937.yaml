      <p>FWIW, I think these old-style numerals tend to look nicer in styles where the ascender of the 6 and the descender of the 9 are just gentle sweeps (as in most of Chris' suggestions above), and not so good in those where they curl back inwards – as in the Trade Gothic Cond that you've been working with.<br>
