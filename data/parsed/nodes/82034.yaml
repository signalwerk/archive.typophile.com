  html: |-
    <p>I really like the free titillum font <a href="http://www.fontsquirrel.com/fonts/TitilliumText" title="http://www.fontsquirrel.com/fonts/TitilliumText">http://www.fontsquirrel.com/fonts/TitilliumText</a>. I would love to find an alternative font which has italic versions to be used for a commercial magazine.</p>
    <p>Does anyone know of any font? Something fairly quirky for headlines but would be suitable for small sizes and lengthy body copy? </p>
    <p>I am about to start trawling font libraries myself, but would really be interested if any of you have suggestions.</p>
    <p>Many thanks!</p>
