      <p>On the HP ads, they may have used a few "real" photos on group shots, but they probably did a lot of "empty white frames" and did most in post filming production.</p>
      <p>Here's a link to the studio that did it <a href="http://www.toolofna.com/index_flash.html" target="new" rel="nofollow">"Paranoid Projects" :Tools of North America</a> out of Santa Monica.</p>
      <p>Here's a link to their latest <a href="http://www.boardsmag.com/screeningroom/commercials/2255/" target="new" rel="nofollow">HP "Cafe Society"</a> commercial, viewable in Quicktime, with a complete list of credits... I think they pride themselves on their "picture-in-picture" trickery and not about to give away all their trade secrets.</p>
