    <p>Clearly these people have too much time on their hands...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/83524092_6c47988273.jpg"></div><p></p>
    <p>No, it's not a Photoshop gimmick, it's much cooler than that...<br>
    a) photograph your work area, minus your computer<br>
    b) carefully crop the image of your work area<br>
    c) set the cropped image as your desktop background (or "wallpaper")<br>
    d) amaze your friends</p>
    <p><a href="http://www.flickr.com/groups/transparentscreens/pool/" title="http://www.flickr.com/groups/transparentscreens/pool/">http://www.flickr.com/groups/transparentscreens/pool/</a></p>
