      <p>Back to the original question about the height of superior numbers and letters... Late night trivia and/or pedantry for folks looking to make the next Grande font.</p>
      <p>Linguists use a very long list of superior small cap and superior miniscule letters (a smorgasbord of forms derived from Latin, Greek, Cyrillic, and the IPA) to indicate various phonetics. Most, but not all, of these are in Unicode (as "modifier letters").</p>
      <p>I would characterize them as meeting Adam Twardoch's category "c" -- their x-height generally aligns with the font's overall ascender height. The superior small caps are drawn to be visually identical in height to the superior miniscules. (This same x-height sizing rule also  is true for the non-superior/non-modifier small cap letters in phonetic use.)</p>
      <p>Brent Sleeper</p>
