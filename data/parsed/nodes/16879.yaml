    html: |-
      <p><em>After a digit, all alphas are superscripts...</em></p>
      <p>But that should only occur in ordinal situations.<br>
      Consider, for instance, an address like 221b Baker St.<br>
      Or an era like the 1960s.<br>
      Or 50k (either a sum of money or a race distance).<br>
      Those would have superscripted alphas if your feature were applied as a paragraph style sheet.</p>
      <p>I suspect there may be yet other kinds of letter-number sequence that occur in text where ordinals would not be appropriate.</p>
