      <p>From a practical point of view, I think this situation would seem to push fonts in two different directions.</p>
      <p>Firstly, I think that what Adam has proposed is spot on, and I have found myself heading in that direction, as I added more and more characters to superior and inferior sets.</p>
      <p>But it is horribly messy to proliferate like this when you also have four different sets of figures!</p>
      <p>So I believe that a sensible course would be to provide two kinds of mega font, one which proliferates the superior/inferior alphanumerics, and one which proliferates the figure categories. </p>
      <p>Really, shouldn't a scientific font have only one set of figures: tabular lining?</p>
      <p>Or can we expect to see the typical Pro font of the future, as bundled by MS and Adobe, containing tends of thousands of glyphs supporting full figure variants, full superior/inferior variants, with full language support (poly Greek + Cyrillic), with small caps and swash features -- and all this in a range of optical sizes and several weights. Yes, Minion Pro 2009!</p>
