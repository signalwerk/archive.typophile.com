      <p>I concur with John - math typesetting is remarkably complex, and most of it is beyond what is reasonably going to be handled in the font infrastructure.</p>
      <p>Another way of thinking about this is to consider math typesetting as a "complex script" kind of language that is much more complicated than any other. The layout engine needs to know all about this language in order to deal with it correctly, and what the font supplies is only a small part of this.</p>
      <p>Now, that being said, there are certainly issues of what characters a hard-core math font should have, and how they should be designed, etc. Johannes Kuester has given some interesting talks on this at various conferences. Some of his presentations and others are saved here:<br>
      <a href="http://www.tug.org/twg/mfg/" title="http://www.tug.org/twg/mfg/">http://www.tug.org/twg/mfg/</a> (one suspects that some of the content on this site might be TeX-specific, but a lot of it looks pretty broadly useful at first blush)</p>
      <p>Regards,</p>
      <p>T</p>
