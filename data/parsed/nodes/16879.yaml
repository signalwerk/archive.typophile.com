    html: |-
      <p>Nick: <em>If one is going to have an Ordinals feature, it should at least be different than the Superiors feature, or else it is redundant, so why bother?</em></p>
      <p>Two reasons:</p>
      <p>1. So that feature tagged text created in a font that supports the ordinals feature displays with appropriate ordinal forms in your font, even if these forms are identical to the superscript feature forms and are even referenced from the same lookups;</p>
      <p>2. Users working with tagged text (e.g. XML) might have have defined a distinction between superscript and ordinals, and it is convenient for them if these are mapped to corresponding features in style sheets, again independent of how the results are either displayed or arrived at in a particular font.</p>
    html_clean: |-
