      <p><em>the nut fractions are activated by the fraction feature (making them the default, not the “afrc” alternative), made from superiors and inferiors. The “regular” fractions are activated using numerators and denominators.</em></p>
      <p>Meaning that the 'regular' fractions may never be seen in many applications. The 'numr' and 'dnom' features only exist because Adobe originally designed a large and cumbersome three-feature implementation for making fractions. I showed them how to do it with one feature instead, but by that time they had chosen to reveal the 'numr' and 'dnom' features in their application UI (bizarrely, considering the original intent of these features, which did not require user interaction). But I doubt if many other developers will follow suit: the features look obsolete, and the existing description does not suggest that they needed to be exposed to the user anyway. Only someone copying Adobe's implementation is likedly to expose them.</p>
