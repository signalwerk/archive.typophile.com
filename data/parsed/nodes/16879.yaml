      <p>I'm glad you found my summary useful. No claims for absolute correctness of course, just an attempt to clean the stuff up. </p>
      <p>As for the scientific superiors feature ("ssup"), it is a good thought. You may have noticed that I used a terminological distinction "text superscript/subscript" and "scientific superscript/subscript" in my summary. Currently, we have four features (sups, subs, sinf, ordn) but of course the ordn feature isn't *really* an appropriate complement to the other ones. A clean pairing sups-subs, ssup-sinf would be useful. </p>
