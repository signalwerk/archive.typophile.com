      <p>I found that it is very easy to add a GPOS lookup for subscripts. Using the same glyphs that I added for the Ordinals feature, I added a Subscript feature with gpos lookup to move the glyphs down to bisect the baseline.</p>
      <p><code>feature Subscript subs {<br>
          lookup Subscript;<br>
      }  lookup Subscript {<br>
          pos [uni00B9 uni00B2 uni00B3 uni2070 - uni207E uniEAA1 - uniEADA] -&gt; ,-990;<br>
      }</code></p>
      <p>I then added an almost identical feature to move the superscripts down to align with the baseline.</p>
      <p><code>feature Shillings shll {<br>
          lookup Shillings;<br>
      }  lookup Shillings {<br>
          pos [uni00B9 uni00B2 uni00B3 uni2070 - uni207E uniEAA1 - uniEADA] -&gt; ,-534;<br>
      }<code><br>
      This seems like an efficient solution. The user types 123 abc etc., and applies the superscript feature to get superscripts, then also applies the subscript or shilling feature to get subscripts or baseline subscripts. </code></code></p>
      <p>A similar feature could be applied to move lowercase ordinals higher than the uppercase ordinals.</p>
