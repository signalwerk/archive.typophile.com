      <p>But what is the outcome of this thread?</p>
      <p>I think A.T.'s suggestion for four small-sized alphabets of different vertical placement makes sense. It is a formal distinction first of all &amp; does not specify whether a particular set of alphabets is for text or mathematical use.<br>
      However, Mr Twardoch wrote: "The denotations “superior figures” and “superior letters” are vague. The designers of the OpenType spec failed to recognize that the typesetting practice needs both figures and letters is the “d” set form (placed above the the ascender/caps height line), which are used to denote footnotes, [...]"<br>
      Personally I prefer the "c" set (top aligning with caps height) to denote footnotes. Obviously, typographic preferences matter. So it is to be decided whether these features should be distinguished by "semantics" (what are they to be used for, what is their meaning?) or by "form" (what is their vertical alignment like?). I opt for the latter, but would welcome any solution if it is only systematic. The feature names should reflect this. Remains the question if existing features should be merely redefined (esp. numr and dnom) for there already is some consensus as to vertical alignment, or new ones be defined.<br>
      That there is a need for clarification is out of question for me.</p>
      <p>frac &amp; afrc -- In case afrc will be supported at all in future, a more specific feature description were welcome. (E.g. what about nut fractions like 1/12? Is distribution of space in the numerator handled by layout engine or by feature?) If feature tag definitions would show another entry: feature is supported, features is likely to be supported, &amp;c, many requests would be obsolete.</p>
      <p>The real problem with OpenType features -- what are they to do, what is the layout engine to do -- seem to be communication. This bothers me. </p>
      <p>On the other hand what we do is "just fonts". </p>
      <p>Cheers,<br>
      Karsten</p>
