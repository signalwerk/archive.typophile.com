      <p>It's too bad we're off on this dumb tangent, because the original thread was pretty interesting and useful.</p>
      <p>But lest anybody be taken in by Nick and Brent's specious logic, it's not "<em>my</em> truth" - it's in the OpenType spec in black and white.</p>
      <p>Yes, both forms of fractions are stylistic variants of the general concept of fraction. And, despite the bias in the spec's names for the two kinds of fractions, each is an independent layout feature. Which style goes with which feature is defined in the OT spec. I pointed out how Nick could make things work the way he wants completely within the OpenType spec. If a couple of vendors want to make broken fonts, that's their problem. Too bad they'll be making it their customers' problem, too.</p>
      <p>This feels as silly as saying that because you want to make the default figures in your font oldstyle figures, you're going to reverse the coding of the oldstyle and lining features, so people will get the figures you want instead of the figures they want, when they invoke a specific figure style.</p>
      <p>If people want to change the spec, that's cool. Get involved with the ISO process and you can have as much say as anybody else in the new Open Font Format, the ISO equivalent of OpenType, which is starting from OpenType 1.4.</p>
      <p>I'm especially entertained by the argument that boils down to "features are confusing, and it's all Adobe and Microsoft's fault for making them, so we might as well use them for whatever they want because it's confusing anyway."</p>
      <p>Oh, and if you feel you must lower the level of the argument by using phrases like "MicroDobia mindset that seeks to button down the whole planet," feel free. it won't stop me from trying to deal with actual issues. I'll continue to bite my tongue when witty counter-insults spring to mind.</p>
      <p>Sigh,</p>
      <p>T</p>
