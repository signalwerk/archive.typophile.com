      <p>I have also run into this conundrum when redesigning my font to add Ordinal and Superscript features. I see there is no consensus on this, and plenty of scope for proliferation. These are my conclusions so far for superscript glyphs to include in the font:</p>
      <p>1. Numbers should align with top of caps (with some overshoot for 0, 8, etc.)<br>
      2. Include uppercase superscript glyphs A-Z.<br>
      3. Letters (and ordinals) should use the baseline of superior ¹<br>
      4. Include basic punctuation: !%&amp;(),-./;:?@[\]“” ‘’<br>
      5. Include at least Èè and Úú for ordinals if not a full set for superscript text.<br>
      6. A vertical scale factor of 60-65% seems to be about right.<br>
      7. Stacking fractions should align with top and bottom of lining figures.</p>
      <p>I don't like the idea of including more than one set of small glyphs in the font — it is far too much work — I already have Petite Caps and OldStyle Figures. </p>
      <p>I think it should be possible to define features using GPOS if one wants numerators, denominators, or subscripts (as well as scientific inferiors).</p>
      <p>This is how I designed the ordinals feature (the Ordinals group includes A-Z, a-z, èÈúÚ, and OldStyle Figures):</p>
      <p><code>feature Ordinals ordn {<br>
          lookup Ordinals;<br>
      }<br>
          group @Ordinals [zero-nine uniE2C0-uniE2C9 uniEAA1 - uniEABA uniEAC1 - uniEADA uniEB28 uniEB3A uniEB48 uniEB5A];<br>
          group @Alphas [A-Z a-z Egrave Uacute egrave uacute];</code></p>
      <p>    lookup Ordinals{<br>
          context (@Ordinals) @Alphas;<br>
          sub 0 Super;<br>
      }  lookup Super {<br>
          sub [A-Z] -&gt; [uniEAA1 - uniEABA];<br>
          sub [a-z] -&gt; [uniEAC1 - uniEADA];<br>
          sub Egrave -&gt; uniEB28;<br>
          sub Uacute -&gt; uniEB3A;<br>
          sub egrave -&gt; uniEB48;<br>
          sub uacute -&gt; uniEB5A;<br>
      }</p>
