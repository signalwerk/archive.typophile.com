      <p>I've included superiors in a variety of types, and find it hard to generalize a set of principles that works for every kind of typeface.<br>
      In particular, x-height and whether ascenders are taller than cap-height have a lot of bearing on the matter.</p>
      <p>Am presently doing a slab serif face, and noticing that the superiors need to be quite large.</p>
      <p>This highlights a key issue for superiors/inferiors: finding the sweet spot of weight and scale that makes them look like they belong in the same font as the normal glyphs, and do not seem to be either faux (shrunken) or a bolder style.</p>
