      <p>Since our shop mainly sets type -- but also modifies fonts (when the EULA allows of course), I've run into the conflicting needs for superiors with differing heights above the baseline.</p>
      <p>As John recommends, if there is to be a full set of alpha-numerics, they should all have the same baseline. And I agree that aligning with the top of the ascender of a lower-case letter is the right height.</p>
      <p>But rather than proliferating the font with repeated glyphs, when we encounter a use requiring a different height, we create another *character style* in the layout program and shift the baseline in that style. You can also scale them a bit in that character style, should that be needed.</p>
      <p>I understand the argument that not all text editors/layout programs permit this. But failing Unicode's desire to proliferate sets of superiors, or the OT spec proliferating features (neither of which I'd like to see), this seems the best way to work.</p>
      <p>Put simply, if the font designer can give a good set of superiors, having a common baseline, those of us who use type are well served. If the superiors have a different baselines, or are of a different nominal size, you make our life quite difficult -- enough so that I'll go into the font and fix it.</p>
