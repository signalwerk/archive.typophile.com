      <p>The ordinals feature works for me — have you tried the font?</p>
      <p>After a digit, all alphas are superscripts until a non alpha character is typed — that is any punctuation, space, or digit (other than A-Z, a-z, Èè or Úú). </p>
      <p>Works for 1st, 2nd 3rd, 1ST: 2ND; 3RD; 1èm, 2o, 3ú, or 7/16ths 31/32nds etc.</p>
