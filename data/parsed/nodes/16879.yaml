    html: <p>Sergey Malkin (Microsoft Typography) and I have been discussing the need for a mathematical or scientific superiors feature. When used for exponent values, superior numerals should be higher than superior letters (hence what you observe in some fonts); however, there is a need also for aligning superior letters and numerals (which is why I do not raise my 'sups' numerals so high). The distinction is exactly the same as that between 'subs' and 'sinf', and we need a superior feature that corresponds to the latter.</p>
