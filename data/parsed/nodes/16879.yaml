      <p>I suppose one could limit the ordinals group to only s, t, h, r, n, d, o, è, ú,  and S, T, H, R, N, D, O, È, Ú, but that seems far less flexible. As you say in the linked thread, "This works for English," but what about other languages, and what about text set in all capitals or small capitals, e.g. 4TH JULY? </p>
      <p>Calibri, Constantia, etc., just apply superscripts to all text with the ordinals attribute, regardless of whether it follows a digit or not. </p>
      <p>In PagePlus it is easy to enable or disable the Ordinal feature from the <a class="freelinking external" href="http://homepage.ntlworld.com/pesala/Home/html/pageplus.html#OpenType" rel="nofollow">text context toolbar</a>.</p>
    html_clean: |-
