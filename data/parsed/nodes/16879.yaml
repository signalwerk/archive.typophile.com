      <p><em>...but don’t lie about your features. Everybody hacking features in crazy ways will tend to create chaos.</em></p>
      <p>Don't mistake what seems obvious to you for the truth.<br>
      It is not my intention to mislead people.<br>
      When I release the face, it will come with a PDF, and perhaps a printed piece for purchasers, which will list and explains the features.</p>
      <p>As for chaos, think of my nutty fraction as one small antidote to the MicroDobia mindset that seeks to button down the whole planet -- standards are good, but one can have too much of a good thing. Besides, methinks it somewhat disingenuous of you to protest about chaos after enabling the foundry community with such a sprawling toolbox of OT features!  </p>
      <p>To me, the choice of fraction style is no different than, say, the choice of "a" or "g" variant -- who is to say that one form is standard and relegate the other to a stylistic set? I believe that the foundry should choose the variant that it thinks is appropriate to the typeface.</p>
      <p>Albany is a very close revival of a specific face from an 1869 scientific work. All the fractions in the book are nut fractions, and what is now the "standard" fraction would quite simply be "slack" and entirely inappropriate to this sort of modern typeface.</p>
