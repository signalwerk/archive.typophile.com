    html: |-
      <p>If one is going to have an Ordinals feature, it should at least be different than the Superiors feature, or else it is redundant, so why bother?</p>
      <p>So your code, which discontinues the feature after a non-alpha character is OK, as is mine, which is English-specific.</p>
      <p>The reason my code doesn't cover superior capitals is because I have yet to produce a font with those glyphs!<br>
      However, I have considered it; I particularly like the idea of superior capitals with dots underneath them, a style which was used in the 19th century for abbreviations.</p>
      <p>As for other languages, I haven't gotten around to that just yet.</p>
