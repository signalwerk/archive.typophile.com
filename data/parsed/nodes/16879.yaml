    html: |-
      <p>&gt; Superior numbers are used to annotate text, while<br>
      &gt; superior letters—as in your examples for Monsieur,<br>
      &gt; Mademoiselle and Saint—are used as abbreviations<br>
      &gt; with a stylistic flair.</p>
      <p>This is a very simplistic and naiive view. I have just returned from Warsaw where I spoke with some typesetters who hate the fact that superscript letters and superscript figures have different baselines because in scientific publishing, both letters and figures are used to reference footnotes. In more complex scientific books, you often have two parallel kinds of footnotes, one being referenced with superscript numbers, the other being references with superscript letters. </p>
      <p>I strongly believe that one needs four kinds of small-sized "alphabets" in a font:<br>
      a) bottom visibly below baseline<br>
      b) bottom equal with baseline<br>
      c) top equal with caps height or ascender line<br>
      d) top visibly above the caps height or ascender line</p>
      <p>These small-sized alphabets should ideally include complete sets of figures, letters and puncuation. </p>
      <p>Unfortunately, the OpenType specification is extremely messy. It provides two features for small-sized characters that are located at the bottom ("sinf" for the "a" set and "subs" for the "b" set) but only one, extremely ambiguous feature for small-sized characters that are located at the top ("sups"). The "sups" feature tries to unifies glyphs that are used for completely different purpose. Its description reads: </p>
      <p>"Replaces lining or oldstyle figures with superior figures (primarily for footnote indication), and replaces lowercase letters with superior letters (primarily for abbreviated French titles)."</p>
      <p>The denotations "superior figures" and "superior letters" are vague. The designers of the OpenType spec failed to recognize that the typesetting practice needs both figures and letters is the "d" set form (placed above the the ascender/caps height line), which are used to denote footnotes, and also needs letters in the "c" set that are aligned at the top of caps height/ascender line, or sometimes even located below. </p>
      <p>In addition, the OpenType spec defines the "ordn", "numr" and "dnom" features that have somewhat similar purposes. </p>
      <p>French, Spanish and Latin languages often makes use of elevated small-sized glyphs within the text. The French titles (Mssr), the Latin ordinals (2o for secundo), the French ordinals (7éme) all require for elevanted small-sized glyphs that visibly belong to the text, so they are located at the top or even slightly below the caps height. This has NOTHING to do with the small-sized superscript glyphs (both figures and letters) used in footnote references or mathematical expressions. It escapes me why there is a "sups/subs" feature pair intended for textual use but there is only one "sinf" feature intended for scientific use. A "ssup" feature paired with "sinf" and representing the "d" set should have been be defined in the OpenType spec years ago instead of overloading the "sups" feature with two distinctly different-purpose uses. The problem that Dan touched on is clearly an exemplification of that. </p>
      <p>I think the textual use of the "sups" feature should be deprecated and moved to a separate feature. Either a new feature should be registered, or the use should be moved to another feature, e.g. the "ordn" feature that should be implemented in a simplified way.  </p>
      <p>Below is the recommendation that I can make to the font developers: </p>
      <p>1. Scientific subscript glyphs ("a" set)</p>
      <p>1.1. Design a full set of small-sized glyphs (figures, uppercase and lowercase English letters, punctuation, even accented letters) that are placed below the baseline (e.g. so that the vertical centre of the scientific inferior "x" is just above the the baseline). Use the glyph name suffix ".sinf" for them, e.g. "one.sinf", "a.sinf" etc.</p>
      <p>1.2. Define a class "sinf1" with the basic forms that correspond to these glyphs (i.e. "one", "a" etc.) and a class "sinf2" with the  .sinf glyphs. </p>
      <p>1.3. Define the "sinf" feature: </p>
      <p>feature sinf {<br>
      sub @sinf1 by @sinf2;<br>
      } sinf; </p>
      <p>These glyphs can be also used as part of the afrc ("nut fraction") feature. </p>
      <p>2. Text subscript glyphs ("b" set)</p>
      <p>2.1. Design a full set of small-sized glyphs (figures, uppercase and lowercase English letters, punctuation, even accented letters) that are placed ON the baseline. Use the glyph name suffix ".subs" for them, e.g. "one.subs", "a.subs" etc. These glyphs may be slightly larger than the scientific subscript glyphs. </p>
      <p>2.2. Define a class "subs1" with the basic forms that correspond to these glyphs (i.e. "one", "a" etc.) and a class "subs2" with the  .subs glyphs. </p>
      <p>2.3. Define the "subs" feature: </p>
      <p>feature subs {<br>
      lookup subs1 {<br>
      sub @subs1 by @subs2;<br>
      } subs1;<br>
      } subs; </p>
      <p>These glyphs can be also used as denominators in the dnom feature</p>
      <p>feature dnom {<br>
      lookup subs1;<br>
      } dnom; </p>
      <p>and as part of the frac feature. </p>
      <p>3. Text superscript glyphs ("c" set)</p>
      <p>3.1. Design a full set of small-sized glyphs (figures, uppercase and lowercase English letters, punctuation, even accented letters) that are of the same size as the text subscript glyphs, placed so that the top of the "h" is at the the ascender line or the caps height. Use the glyph name suffix ".ordn" for them, e.g. "one.ordn", "a.ordn" etc. </p>
      <p>3.2. Define a class "ordn1" with the basic forms that correspond to these glyphs (i.e. "one", "a" etc.) and a class "ordn2" with the  .sinf glyphs. </p>
      <p>3.3. Define the "ordn" feature without using any contextual lookups: </p>
      <p>feature ordn {<br>
      lookup ordn1 {<br>
      sub @ordn1 by @ordn2;<br>
      } ordn1;<br>
      } ordn; </p>
      <p>These glyphs can be also used as numerators in the numr feature</p>
      <p>feature numr {<br>
      lookup ordn1;<br>
      } numr; </p>
      <p>and in the frac feature. </p>
      <p>4. Scientific superscript glyphs ("d" set)</p>
      <p>3.1. Design a full set of small-sized glyphs (figures, uppercase and lowercase English letters, punctuation, even accented letters) of the same size as the sinf glyphs, placed so that the vertical centre of the scientific superior "h" is slightly below the caps height. Use the glyph name suffix ".sups" for them, e.g. "one.sups", "a.sups" etc. </p>
      <p>3.2. Define a class "sups1" with the basic forms that correspond to these glyphs (i.e. "one", "a" etc.) and a class "sups2" with the  .sups glyphs. </p>
      <p>3.3. Define the "sups" feature: </p>
      <p>feature sups {<br>
      sub @sups1 by @sups2;<br>
      } sups; </p>
      <p>These glyphs can also be used in the afrc feature. </p>
      <p>5. Map the text and scientific variants as stylistic alternates and sets for each other: </p>
      <p>feature ss01 {<br>
      sub @sups2 by @ordn2;<br>
      sub @subs2 by @sinf2;<br>
      } ss01; </p>
      <p>feature ss02 {<br>
      sub @ordn2 by @sups2;<br>
      sub @sinf2 by @subs2;<br>
      } ss02; </p>
      <p>feature salt {<br>
      sub @sups2 by @ordn2;<br>
      sub @subs2 by @sinf2;<br>
      sub @ordn2 by @sups2;<br>
      sub @sinf2 by @subs2;<br>
      } salt; </p>
      <p>-- Adam</p>
