      <p><em>I’m having difficulty coming up with an approach to contextual programming that would be at all manageable. </em></p>
      <p>Here's my hack:<br>
      I set my sights quite low, restricting the range for numerator and denominator to 1-99, and assuming that there would be no "greater than one" fractions. It required making two horizontal "nut dash" glyphs, one for single digit denominators, and one for double digit denominators. I also made an alternate set of numerators with extra sidebearings (@numr2), for use in situations such as 7/16. Some kerning was required to prevent the composite fraction from being too close to the adjacent full size figure.</p>
      <p>I fine-tuned the size and y position of the superior figures and scientific inferior figures to work in this feature; that's also a good size for them in other uses. And I co-ordinated the position of the em and en dashes, and math symbols, to centre vertically on the nut dash.</p>
      <p>For fractions with more than two-digit numerators or denominators (such as are used to represent ratios) rather than use the fraction feature, typographers are advised to "composit" the fractions themselves, from sups, em dash (horizontally scaled) and sinfs, suitably kerned. You'd have to do that anyway, but at least with this system the component parts are all the right size and vertical position.</p>
      <p>feature frac {</p>
      <p>sub @FIGURES' slash by @numr2;<br>
      sub slash' @FIGURES @FIGURES by nut2;<br>
      sub @FIGURES @numr2' nut2 by @sups;<br>
      sub slash by nut;<br>
      sub [nut2 nut] @FIGURES' by @sinf;<br>
      sub @numr2' nut by @sups;<br>
      sub @FIGURES' @numr2 by @sups;<br>
      sub @sinf @FIGURES' by @sinf;<br>
      sub @sups @numr2' by @sups;</p>
      <p>} frac;</p>
      <p>I didn't mind doing this extra figure work as I only have one set of figures in the typeface, tabular lining.</p>
