    html: |-
      <p><em>Superior numbers have a higher baseline than superior letters. Why?</em></p>
      <p>Superior numbers are used to annotate text, while superior letters--as in your examples for Monsieur, Mademoiselle and Saint--are used as abbreviations with a stylistic flair. Superior text should line up at the tops of the letters with uppercase letters. Superior numbers are placed higher, I suspect, so that they can be more readily seen, since their function is not to continue the text, but to mark it.</p>
      <p>The misplaced period, however is a mystery to me...someone didn't have their thinking cap on when they did this.</p>
