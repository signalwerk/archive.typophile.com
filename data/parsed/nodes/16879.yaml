      <p>You're right, Thomas -- Dan Reynold's original question really is the interesting part of this thread, so I hope the discussion about the typography itself (rather than the OpenType tangent) continues.</p>
      <p>On completely red-herring-flavored note, the Unicode spec makes clear that all of the precomposed fractions (0x00BC-0x00BE and 0x2153-0x215F) can take either the nut or vulgar form, without affecting their semantic value. I add this only to note that the actual glyphs in a font can take whichever form the designer wants, regardless of whether or not it also is appropriate to misapply the frac/afrc features.</p>
      <p>Cheers,<br>
