      <p>I whole-heartedly agree with Adam Twardoch's suggested implementation, and it is consistent with my own practices in using type in designing papers. Although not semantically precise, the 'ordn' glyphs seem to share size, baseline, and some intuitive overlap with the letter forms used in abbrevations such as Mlle. Compare to the numero character or Nr. in German.</p>
      <p>Nick Shinn's point that frac/afrc should be considered stylistic variants is also on the mark, and his example of Albany makes that point very clearly -- the form the designer chooses for the three fraction characters that are standard in the Latin-1 range (as well as the others in the Unicode 0x2150 range, if used) should determine which style goes in which feature. Even if standard slashed, rather than nut, fractions are considered normative, which form of the fraction should be implemented in the default 'frac' function depends entirely upon the face in question, not an arbitrary dictat by the specification authors. Let's not forget that type ultimately is design, not software.</p>
      <p>OK, off my high horse, I have what is perhaps a naive question: besides its potential equivalence to the 'dnom' set, for what typographic purposes are the small, baseline-level 'subs' alphabet generally used?</p>
      <p>Cheers,<br>
      Brent Sleeper</p>
