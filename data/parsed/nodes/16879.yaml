      <p>If your font is just for yourself, your trick for inferiors will get the ink on the paper in the right place. </p>
      <p>However, if the font is for general use, you have to check that the text exported from, say, InDesign or any other text editor/layout program, doesn't have the wrong character. Depending on how the font is made, I could write the substitution code along the lines you suggest, where the 2 in H2O would set as an inferior with your font, but would, in a subsequent text file, be a superior.</p>
      <p>In short, repositioning a character to look like another character which has a different Unicode number is not nice.</p>
