      <p><em>...if you feel you must lower the level of the argument </em></p>
      <p>Sorry if I over-reacted Thomas, but I was upset at being accused of lying about my features. I'm just an indie font guy working on his first full-featured OpenType font, trying to make useful, unusual fonts, and trying to understand the complexities of the format.</p>
      <p>I've explained the typographic reason behind my choice of nut fractions as default.<br>
      Perhaps I have made a mistake and misunderstood the way things work. But I am not attempting to deceive and create chaos. </p>
      <p><em>If people want to change the spec, that’s cool. Get involved with the ISO process and you can have as much say as anybody else in the new Open Font Format, the ISO equivalent of OpenType, which is starting from OpenType 1.4.</em></p>
      <p>I don't know how the ISO process works, but I think all that would be necessary would be to get the feature names changed to "diaf" (diagonal fractin) and "nutf", as that's what they really are, and that's probably not worth the effort. </p>
      <p>Anyway, I don't think I'd want to get involved in that process. And if I don't, does that mean I have to make my fonts conform to it on every single spec? As I said, the non-conformity of the feature would be explained in the accompanying pdf/specimen. </p>
      <p>However, the spec might not be where my problem really is, as I will try to explain in the bottom paragraph below. </p>
      <p><em>This feels as silly as saying that because you want to make the default figures in your font oldstyle figures, you’re going to reverse the coding of the oldstyle and lining features, so people will get the figures you want instead of the figures they want, when they invoke a specific figure style. </em></p>
      <p>Your simile is silly, because a figure style (either oldstyle or lining) is on by default, whereas a fraction style has to be applied -- the situation is quite different.</p>
      <p>There are no oldstyle figures in Albany. It is a modern face, and moderns do not usually have oldstyle figures. I'm making the same kind of distinction with its fractions.</p>
      <p>It wouldn't matter so much, if there were two fraction choices in the OpenType menu palette: Diagonal Fraction (corresponding to "frac"), and Nut Fraction ("afrc"), then the user could choose, and in Albany the "Diagonal fraction" menu item would be "braced" (not available).<br>
      If that was the case with CS InDesign, on which I base my font usability, then I would not be considering reversed coding.</p>
