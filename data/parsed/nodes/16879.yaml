      <p>I can second Thomas' recommendation of the TUG Math Font Group and Johannes Küster as good places to start. Küster's presentations are targeted at designers and touch on a lot of key design issues, such as clear differentation among significant glyphs, relative sizes and forms of operators, etc. (BTW, the archival source of the documents is at <a href="http://www.typoma.com/en/publications.html" rel="nofollow">Typoma</a>.)</p>
      <p>Also, check out the American Mathematical Society. Working with the TeX community (which is predominantly mathematicians), AMS has established well-defined character repertoire. The set of <a href="http://www.ams.org/tex/type1-fonts.html" rel="nofollow">official AMS math fonts</a> might be useful to study for illustrative purposes. An interesting piece of the AMS set is the Euler family, designed and donated by the indomitable Hermann Zapf. Donald Knuth writes about working with Zapf on this project in his book <a href="http://www.amazon.com/exec/obidos/redirect?path=ASIN/1575860104&amp;tag=bsleeper" rel="nofollow">Digital Typography</a>.</p>
      <p>Another well-regarded math family is Charles Bigelow and Kris Holmes' Lucida series; TeX-compatible extensions to both Lucida serif and Lucida Bright are available. I believe Adobe sells the former, but the Bright math extensions have gone through a series of distributors. I think <a href="http://www.ascendercorp.com/" rel="nofollow">Ascender</a> may be the current commercial distributor, but TUG also recently became a source for non-commercial licenses.</p>
      <p>Beyond the typography, the predominant technology issue for the past decade has been converting and integrating a complex set of legacy TeX encodings to Unicode. The Unicode Consortium has a <a href="http://www.unicode.org/reports/tr25/tr25-7.html" rel="nofollow">technical memo</a> on their site that talks about some of the very basic issues. The TUG math working group has several much more detailed papers as well.</p>
      <p>John's observations about Office 12's math engine are interesting -- TeX has been the predominant approach to typesetting math papers for more than a decade. TeX is crufty but wonderful, too. Thomas' comparison of math layout to a complex, non-Latin script is very apt.</p>
      <p>Cheers,<br>
      Brent Sleeper</p>
