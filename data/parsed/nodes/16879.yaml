      <p>But the superior numbers might need punctuation, too. What if a word references more that one footnote (e.g., success ¹,²), or has  decimal footnotes (e.g., success ¹.²)? Both situations are typographically common, and should be available, shouldn't they? </p>
      <p>What if the numbers came down to the letters' baseline? Would they lose their readily-seeable quality? </p>
      <p>Or could the letters' baseline be raised up in this function, so that they could be used in footnotes (e.g., "1a" as a footnote). Could abbreviations be referenced by another feature, so that both numbers and letters could have proper punctuation?</p>
