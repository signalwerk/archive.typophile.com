      <p>Charles said: </p>
      <p>“I agree that aligning with the top of the ascender of a lower-case letter is the right height.” </p>
      <p>I initially inclined towards using this alignment too, but decided that since my fonts include capital ordinals for setting with All Caps text, that top of caps alignment (and therefore top of figure alignment), works best. </p>
      <p>Deciding on just how many glyphs to support is hard as my fonts include full support for Latin Extended Additional. Thus far I have decided on most of Latin 1 Supplement, and a few from Latin Extended A and Additional that I need for Pali/Sanskrit. Including the full set of Latin (and Greek) glyphs for Superscripts/Ordinals would be way too much work. </p>
      <p><a class="freelinking external" href="http://homepage.ntlworld.com/pesala/clipboard/Garava%20Ordinals.png" rel="nofollow">Garava Ordinals</a></p>
