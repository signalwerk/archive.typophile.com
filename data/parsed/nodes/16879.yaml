      <p>Thanks John. I guess the under part of my question is what should I do as a type designer to make type usable to people. I realize the real math intense stuff is a very specialized (perhaps small?) segment of type users. I still want to be sure that type I produce will be usable by not only ordinary publishing software, but specialized math software as well.  I at least I don't want to make problems. That is why the math issue seems important. I don't know who was involved in setting up the opentype standards.  I assume some math type users must have had a say. Did what came out of it all seem to solve the problem?  Is it an issue of just using the standards in their simplest way or should we look for more creative solutions within the standards?</p>
      <p>ChrisL</p>
