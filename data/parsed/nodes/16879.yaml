      <p><em>Meaning that the ‘regular’ fractions may never be seen in many applications.</em></p>
      <p>Yes, it's a choice on my part that when you use this font, you get nut fractions as standard.<br>
      The three pre-built fraction glyphs are that way too.<br>
      Given that it's more complicated for users to make numerator+denominator fractions (two 3rd-level menu clicks in InD, rather than one), I wanted to make it easier for them to get the nuts.</p>
      <p>I didn't know the story. I'm just working with the basic features that show in InD, in CS1, as my benchmark. Lacking the presence of the "afrc" feature in the InD OpenType menu, it makes sense to me to use the "numr" and "dnom" features to give users access to an alternate fraction form.</p>
      <p><em>...you don’t want a generic ‘Mathematic Forms’ features displaying the variable as × when trying to get the exponent value to be the right size and position.</em></p>
      <p>Good point. I guess I was thinking more of a "math forms lite", for simple access to the basic math operators, like when you're doing a lumber catalog and you have product dimensions of 2" x 4". It's always struck me as a self-indulgence of the computer industry that Minus and Multiply are not on the North American keyboard -- but the ASCII tilde and ASCII circumflex are.</p>
