      <p>I agree with you Jong, logically humanist should refer to serif faces, however if you go to a font website and search for humanist I am sure that 90% of the returned fonts will be sans. There also seems to be a flood of new sans serifs at the moment, most of which claim to have humanist 'touches'. I wonder if perhaps it has become a cool buzzword that is used to sell new fonts? Or maybe the humanist sans is more versatile (than grotesque &amp; geometric) and therefore more in demand?</p>
      <p>By the way does anyone know if it's possible to get a copy of Craig Eliason's presentation? (thanks Kent)</p>
