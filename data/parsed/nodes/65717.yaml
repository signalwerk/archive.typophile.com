      <p>I'm a bit surprised people haven't heard the term used for serif faces. Maybe it's because of my interest in serif faces in general, or maybe it's the particular terminology used in the type classification I first learned from, but when I hear the term "humanist" in connection with type, I always think of serif faces first.</p>
      <p>I know exactly what a humanist serif is; I refer you to the <a class="freelinking external" href="http://ilovetypography.com/2007/11/06/type-terminology-humanist-2/" rel="nofollow">I Love Typography article</a>. By contrast, I'm still not quite sure what is meant by a humanist sans. I can see that sans designs obviously based on oldstyle forms are humanist, but I hesitate when I see something like Frutiger, even though I've often heard it refered to as a humanist design.</p>
      <p>My guess is that the use of the term for sans designs is not necessarily connected with humanist serif faces. Perhaps all that is meant is that the shapes are not constructed as in geometric sans or grotesques, but have a "human" touch.</p>
      <p>To add another wrinkle, I sometimes use "humanist" to describe a much larger category of type including most Latin serif faces used for text today (humanist, oldstyle, transitional, modern, etc.) that is based on the first humanist forms, as opposed to something like blackletter. I don't know how appropriate this use is.</p>
