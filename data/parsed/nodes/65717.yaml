  html: |-
    <p>It seems that the term 'Humanist' in typography is used solely to describe a certain type of sans serif. But is this really a reference to the renaissance Humanist scribe hands? If so why is the term not used for serifed typefaces that are directly related to this humanist hand?<br>
    Does anyone know when the history of when term was first 'coined' in regards to sans serif. Was it just an attempt to categorise, or maybe a commercial reason, to set a typeface design as different from the rest by giving it an saleable tag, one that gave it a mystique, esteem or historical cogitation.<br>
    Humanism also has many non-typographic meanings. What does this tag imply to you as  designers?</p>
