      <p>Here is a thread on this topic that Craig started a few years ago:</p>
      <p><a class="freelinking external" href="http://www.typophile.com/node/35213" rel="nofollow">http://www.typophile.com/node/35213</a></p>
      <p>I looked up "humanist" on MyFonts, and the first several results were the Bitstream fonts, like Humanist 521 (Gill Sans), Humanist 531 (Syntax), Humanist 777 (Frutiger), and Humanist 970 (Doric). It may be Bitstream that popularized the use of the term for non-geometric, non-grotesque sans designs. Bitstream uses "Venetian" for humanist serifs, as in Venetian 301 (Centaur). The availability of this alternative and unambiguous term for humanist serifs probably contributed to the semantic shift of "humanist" to cover sans designs primarily.</p>
