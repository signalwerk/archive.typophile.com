      <p>This is in fact the very subject of lengthy study by typophile <a class="freelinking external" href="http://typophile.com/user/3254" rel="nofollow">Craig Eliason</a>. He gave a presentation of his research so far at last year's <a class="freelinking external" href="http://www.typecon.com" rel="nofollow">TypeCon</a>. </p>
      <p>From the conference description:</p>
      <p><cite>This presentation traces the twentieth-century emergence of the term “humanist” as a classification of types. “Humanist” has been commonly applied to many (in some cases, rather different) typefaces. How and why has “humanist” persisted as a label? Craig Eliason’s presentation argues that the term emerged in the context of a surge of interest in the Italian Renaissance among Western historians, and that this interest, in turn, was fed by a sense of crisis of civilization coming from the turbulent political and cultural history of the mid-twentieth-century.</cite></p>
      <p>If you're lucky, Craig will stop by this thread to share some of his knowledge.</p>
