    html: <p>Loosely speaking, I think humanistic is the opposite of geometric. In a humanist font, the curves were not created using a rule, square and compasses but with a 'free' hand (as per the scribe hands that you mention). Of course, beziers and quadratic splines are hardly humanistic but are now used to create most fonts so I guess its now purely an appearance thing rather than how the font was actually made. When I think archetypal Humanist, I think Frutiger. I couldn't tell you if the tag was being used before that though. Maybe 'humanist' is a catch all for sans serifs that just don't fit into the grotesk or geometric category. Happy to be put straight.</p>
