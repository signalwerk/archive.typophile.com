      <p><em>(David) I suppose the point I'm trying to get at is; to what extent is this humanist tag a form of branding? Although the name does make sense considering the influences that conceived it, is it not just as probable that there is a commercial aspect to it?</em></p>
      <p>Oh certainly, schemes of this sort are set up by commercial interests (who else would care enough to bother?) But I don't assume that something with commercial intent can't also be an expression of the culture in which it appears.</p>
      <p>(I should say that my TypeCon talk departed a bit in emphasis from what appeared in the abstract. I'm developing it and hope to publish it as an article some time soon.)</p>
      <p><em>(Bill) Is BSI 1967 the first English reference to a humanist typeface?</em></p>
      <p>No, I should clarify that that is the earliest reference I have found thus far to a "humanist <em>sans</em>." </p>
      <p><em>Is the first non-English reference Vox's humanes? This appears to be an illegitimate Latin coinage. Was it not translated earlier than 1967? I don't see why Vox should be given any particular weight.</em></p>
      <p>Vox's scheme was translated and disseminated soon after he conceived of it in the fifties, and it included "humanes" as a class of seriffed type, but all sans types were lumped together as "lineales." </p>
      <p>Vox should be given particular weight (by me as a historian) because his scheme served as the basis for the major national and international classifications of the sixties, and still serves as the basis for many discussions of type classification in our present century.</p>
      <p><em>Not the least problem with 'humanes' is that there is no way to learn what it meant without interrogating the presumably now extinct Herr Vox. That is not the way a word's pedigree should work.</em></p>
      <p>But if Monsieur Vox tried to explain it in writings that still exist, and if we know he was familiar with the use of similar words contemporaneously, isn't it better to venture an undertanding of that meaning from those sources than to accept that dead men can tell no tales to us?</p>
