      <p>Here I am. I think many of the suspicions that have been put forward in the thread already are sound.</p>
      <p>I think the arrival of new sans designs around the turn of the 1960s (Optima and Pascal within the subcategory, Helvetica and Univers outside of it) were what provoked a more official sorting out of sans types and the consequent invention of the "humanist sans" label.</p>
      <p>The earliest published use of the term I have traced so far is the British Standards Institution guide to type nomenclature and classification that was published in 1967. (Thus this predates Syntax, which was proposed in my earlier thread as a possible first.) If anyone finds anything earlier please let me know!</p>
      <p>One interesting bit I found from my research (which I didn't have time to go into at TypeCon) is that all of the labels in the influential type classification scheme of Maximilien Vox from the 1950s were intentially "suggestive" neologisms. Terms like "Garaldes" and "Didones" were unchanged in English publications of the scheme, so retained their invented character. But "humanes" (which suggests but is not a word in French - I'd welcome correction from anybody who knows French better than I) was turned into "humanist" in most English accounts. To be true to Vox's intentions, perhaps we should be saying "humanic" instead of "humanist" (as one or two sources I've seen have done).</p>
