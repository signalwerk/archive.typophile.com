      <p>Craig, perhaps you can clarify something for me? </p>
      <p>Is BSI 1967 the first English reference to a humanist typeface? (This is brutal for a start; as we have seen, humanist should be the noun, and humanistic the adjective.)</p>
      <p>Is the first non-English reference Vox's humanes? This appears to be an illegitimate Latin coinage. Was it not translated earlier than 1967? I don't see why Vox should be given any particular weight. 'Garalde' is both ugly and silly and to a non-typographer looks like a funny way to spell 'Gerald' - - while one of many previous terms with a long history, Aldine, does just as well. Not the least problem with 'humanes' is that there is no way to learn what it meant without interrogating the presumably now extinct Herr Vox. That is not the way a word's pedigree should work. </p>
      <p>. . . . . </p>
      <p>Reading about the 1933 Humanist Manifesto and the current 'Humanists' reveals that the current common definition of 'Humanist' seems to be someone who is non-religious but nice --- and warm, possibly fuzzy. What this has got to do with non-geometric, non-grotesque sans serifs is beyond me.</p>
      <p>One thing is critical to keep in mind: humanist type, as Morison would argue, comes not from the hand but from the punchcutter's chisel (or asp, or whatever grim thing it was). The type world today is full of minor Morison wannabes who have made, I admit, persuasive cases to the contrary. So chacun a son gout! </p>
      <p>The overwhelming sense of 'humanist' today has nothing to do with type. We need a better term and it should be devised by someone without a commercial interest in promoting the term. For example, when speaking of a sans italic that is not a slanted roman, it is better to use the term cursive, which is precisely descriptive, rather than humanist, which is not.</p>
