      <p>&gt;Although the name does make sense considering the influences that conceived it, is it not just as probable that there is a commercial aspect to it?</p>
      <p>This is spot on. No word can be defined absent context. For example, in Adobe's commercial literature, the word 'humanist' is seldom used without being preceded by the word 'warm'. What warmth has got to do with type classification, I don't know. But I do know it's got a lot to do with marketing and propaganda -- and fuzziness; and fuzzy thinking.<br>
      For example, while Robert Slimbach often describes his 'humanist sans' designs as 'warm', he describes his humanist serif typeface Minion as 'cool'. Oops! Did I say 'his' humanist sans designs? I meant Frutiger's and Küster's. It's important to be accurate in a discussion like this, where we're trying to cut through the commercial fluff.</p>
      <p>Just for the record, two definitions from the OED:</p>
      <p>humanist, noun: Literary Hist. One of the scholars who, at the Revival of Learning in the fourteenth, fifteenth, and sixteenth centuries, devoted themselves to the study of the language, literature, and antiquities of Rome, and afterwards of Greece; hence, applied to later disciples of the same culture.</p>
      <p>humanistic, adjective: Pertaining to or characteristic of the humanists or classical scholars of the Renascence; classical.</p>
      <p>N.B. There are several other OED definitions of these terms.</p>
