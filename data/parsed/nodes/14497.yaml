    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/History" class="freelinking" rel="nofollow">History</a> : Trajan's Column</strong></p>
    <p>Marcus Ulpius Traianus was born in 53 AD, and died in 117 AD. He was Roman Emperor from 98–117, during which point the Empire would reach it's greatest extent. During his reign, the Senate and People of Rome as errected a memorial to his wars, which slightly extended the Empire's frontiers even further into "barbarian" territory than they had already been.</p>
    <p>This memorial is called "Trajan's Column" today. Although the object is mostly sculptures in nature (it is a tall column, which has a frieze of relief scultures spiraling up its shaft), a small inscription above the doorway on its base has driven type-minded people mad for centuries.</p>
    <p>Contrary to the belif of some, this inscription is neither the debut of the <a href="/wiki/Roman%20Alphabet" class="freelinking" rel="nofollow">Roman Alphabet</a>, nor the first time that it had used <a href="/wiki/serifs" class="freelinking" rel="nofollow">serifs</a>. It is, however, probably the most famous example of both.</p>
    <p>While Roman handwriting was very different from Roman monumental lettering (whether hand painted, engraved, cut out of metal, or cut into stone), the letters on Trajan's Column represent one of the best examples left to us from antiquity. Trajan's Column, and samples like it, would go on to influence the development of the Roman alphabet, and later typeface design, for the next 2,000 years.</p>
    <p>What was so special about the Roman's inscriptional lettering? The Romans—who did not invent the idea of the alphabet—where the first to put serifs on their letters. It is speculated that the <a href="/wiki/serif" class="freelinking" rel="nofollow">serif</a>'s origin was a result of applying a brush to the stone before it was carved. Others speculate the serifs were purely an aesthetic addition, put there by the stone carver(s).</p>
    <p>There have been several typefaces that are direct "revivals" of the lettering on Trajan's Column. The most direct and most popular—and the only one to simply bear the name <a href="/wiki/Trajan" class="freelinking" rel="nofollow">Trajan</a>—is <a href="/wiki/Carol%20Twombly" class="freelinking" rel="nofollow">Carol Twombly</a> cut for Adobe.</p>
