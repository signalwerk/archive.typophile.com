    <p>G'day guys,</p>
    <p>I'm laying out a CD case which is entirely made of cardboard consisting of two pockets, one which contains the booklet and the other which contains a sleeve with the CD inside.</p>
    <p>My problem is that I don't know the correct sizes (I've just been measuring a whole bunch of CD cases) and I can't seem to make it so the pocket fits the sleeve without making it too big for what seems like the standard size. This is fine it itself but it would seem to make it a potential annoyance for people wanting to put it in standard CD racks etc, not to mention retailers.</p>
    <p>My question is: have you successfully made a cardboard CD case containing another sleeve which still manages to fit in standard racks? or Have you got any wisdom on sizes or Cardboard CD creation generally?<br>
    thanks</p>
    <p>--N</p>
