      <p><em>Also this CD case is non-standard.</em></p>
      <p>In that case, you've sort of answered your own question about getting it to fit into a standard rack.  A survey of my collection for cardboard sleeve cases shows they are all just a light bristol board stock that match the height of a standard plastic case, and are otherwise square (with gluing tabs, of course). </p>
      <p>Have you looked at setting it up with a thicker spine to accommodate the brochure with a sleeve for the CD (open at either the spine or the fore edge)? Back in the good old days, Adobe used to ship out software in some really elegant all-cardboard constructions....</p>
    html_clean: |-
