    html: |-
      <p>One alternative, if you can spare some $$, is to buy a CD with a cardboard sleeve and then take it apart -- you'll get better measurements that way, if you're using a ruler. The first pressings of Cat Power's "You Are Free" had a cardboard sleeve like the one you want to make. It might be easier to find Sleater Kinney's "The Woods," though. Aimee Mann's "Bachelor No. 2" has just a half-pocket for the booklet, but you can use the measurements of the other half.</p>
      <p>Cheaper alternative: <a href="http://www.sleevetown.com/cardboard-cd-sleeve.shtml" rel="nofollow">Sleeve City</a> will send you a sample of their cardboard sleeves for just a penny. They also state that their pocket measures 5 in. x 4-7/8 in.</p>
      <p>I'll try to post more later -- right now I have to go to work.  :-)</p>
