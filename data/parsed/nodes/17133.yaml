      <p>"they look like they’ll be dated in only a decade (or less?). "</p>
      <p>We call that "Built in obsolescence". This is the trouble with designing a logo based on current "style" rather than communications need.  A well designed logo should last for many years.  The hardest part about a new logo is the time it takes for your audience to make the new association. If you think about the CocaCola logo (which I feel is pretty awful but would not change), you have brand identity that is extremely strong and shouldn't be tampered with.  A few years back, they did a new "Coke" swoosh logo which was an abysmal failure but not because it looked bad.  It looked fine enough. It failed because it screwed up the existing brand identity and the customers were really bent out of shape about it. Now CocaCola is not in any sort of midlife crisis like Kodak and have nothing to gain.<br>
      Back to "Built in obsolescence". IMHO, there are SOME marketing/Branding firms about who would love to sell you a new logo or Brand even if you don't need one or even if it might do more harm than good.<br>
      A couple of years ago Nike flirted with dumping the “Swoosh” in favor of plain lowercase italic serif type. I don’t know who got the bright idea that Nike had a branding problem that required jerking the most successful logo on Earth and replacing it with ho-hum nuttin’ but I am glad to see they went back to the swoosh shortly there after.  Ya see, the Swoosh was not “obsolete,” it was just “built in”</p>
      <p>ChrisL</p>
