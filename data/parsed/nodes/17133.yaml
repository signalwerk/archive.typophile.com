      <p>"Kodak is trying pretty hard to turn into a digital company, and the old image is the last thing to go. I hope the rebrand works for them."</p>
      <p>I don't know what "trying pretty hard" means but a rebrand should have something new in the business model to reflect, not just a hope that if you "Look like a Duck" people will assume that you can quack. The problem is the new logo looks like it was made by a quack.<br>
      My philosophical 2 cents worth (or 2 points worth):<br>
      1. Rebrand if you must but have something tangible going on in your company worthy of a second look. (Not just a smoke-and-mirrors job!)<br>
      2. When you redesign a logo, make it at least as good as the one you are replacing. A brand is a precious thing to waste.</p>
      <p>I wish Kodak well with repositioning themselves and becoming a viable player but the logo just plain ain't makin' it.</p>
      <p>ChrisL</p>
