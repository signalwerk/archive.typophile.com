      <p>I think Kodak is running scared. The film and processing business made billions for them but they are bit players in the new digital world. Photo CDs are old hat with web sources dominating the stock image market.  Where is their niche? They don't know. They don't have a new vision to go to so they make a nondescript logo which distances them from their past but gives them no future. Rebranding is fine if you have something to rebrand to. What is Kodak's go-to spot in the market? I sure don't know. Does anyone else see where they can travel?</p>
      <p>ChrisL</p>
