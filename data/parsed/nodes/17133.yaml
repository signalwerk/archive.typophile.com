      <p>William - you make a good point here. The thing you have to keep in mind is that distictiveness &amp; memorability can run counter to what is classically good and certainly orthodox type design. Making a company name/logo take slightly longer to resolve can aid in it's memorability a very desirable feature - but the distictiveness has to be done well. And it hasn't been done well in this case I think. </p>
      <p>By making the a into an upsidedown e ( as I read it ) they were looking to slow down the eye &amp; make is easier to recall the shape later. Same thing with the vague looking d. I think there was a method to the madness. </p>
      <p>&gt;  the bottom right of curve on the d is wrong </p>
      <p>But I also think the variation was poorly judged. I agree with Gary that the logo almost reads as 'Koolak' now. I think that the abruptness of the curve as Joe says, makes it misread. </p>
      <p>I have seen the logo a bit larger &amp; more clearly now &amp; it is better that way - but the basic problem set is the same. Moreover it needs to work well at low rez! Especially now.</p>
    html_clean: |-
