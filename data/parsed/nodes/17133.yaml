      <p>I come late in the discussion. Firstly, hello everyone! I subscribed to Typophile a while ago and this is my first venture out of lurkland. I just wanted to post here something I said in another forum:</p>
      <p>The old Kodak's logo has always looked more than just a logo, to me. It was a symbol. Recognisable everywhere in whatever form (on paper, on a package, in the form of a sticker attached to a shop window or door, or of an neon sign, and so on). Moreover, like someone else pointed out, recognisable at a distance, thanks to the graphics+colour mixture (which in some old logo variations are enough to identify "Kodak" even without the type). A powerful, ageless logo, if I may add.</p>
      <p>I agree with those who wondered about the need to change it altogether. My humble, perhaps naïve opinion: with such a strong logo, Kodak could have done whatever it wanted and still be recognisable. I can't really see any such equation as</p>
      <p>old logo = "analog"; new logo = "digital".</p>
      <p>What I do see, as a customer, as a man-of-the-street, is</p>
      <p>old logo = "recognizability"; new logo = "anonymity"</p>
      <p>If Kodak wants to "start over" and is looking for some kind of anonymity to start with, then the new logo is absolutely successful.</p>
      <p>Just my visual feelings and my $0.02</p>
      <p>R.</p>
      <p>[Edited to add: I think the "a" in the new logo is awful. It sorts of scream "wrong" when I look at it. Perhaps it's its purpose, who knows...]</p>
    html_clean: |-
