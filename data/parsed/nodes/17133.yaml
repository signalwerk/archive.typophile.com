      <p>What they did wrong was introduce a logo without application. It is all well and good to go... "This is us now &amp; here's our logo". </p>
      <p>Changing a logo isn't the whole story to updating brand. When I look at the logo, yes it doesn't strike me as amazing or progressive, but I'm not completely going to write it off until I see it in application. How does it affect packaging, paper ads, TV ads, and web pages? </p>
      <p>What does this new brand stand for, what are its core elements? (Colours, photographic styles, variations for products and services)</p>
      <p>Or is it simply putting a skin over what Kodak means to millions of people.</p>
      <p>When I think Kodak the brand has previously built up in my mind from childhood that if I want to capture something great, unique or happy in my life, I should capture it as a "Kodak Moment" use their products &amp; services to do this. </p>
      <p>If the whole application of this new brand overtime reveals it to feel sterile and soulless isolating people from that original concept of the “Kodak moment” ideology. Then yes, this branding exercise fails and at its core would be a very boring logo.</p>
    html_clean: |-
