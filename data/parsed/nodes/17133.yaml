    <p>Feels like a lot of companies new years resolutions were to rebrand themselfs. Kodak is newest one that has done just that.</p>
    <p>"In another break with the past, Eastman Kodak Co. is introducing a new corporate logo designed to help the company forge a new image as a cutting-edge, 21st century innovator. </p>
    <p>Kodak's new corporate symbol retains the company's distinctive red and yellow colors, but does away with the boxes that have contained the word "Kodak" for the past 70 years." </p>
    <p>I think the new logo doesn't say anything about the company. They left out the red box which was the the only original thing they had going for them. I don't know about this one, what do you guys think?</p>
