      <p>Kodak definitely needs an update... they got into the digital game late, believing, like many photographers 8 years ago that digital couldn't hold the quality of film. They built their empire on cheap distribution of film and film processing (paper) and kiosks. Old, old and um, old.</p>
      <p>The photography companies that are players now are the ones coming from either the quality camera optics realm, like Nikon or Canon or the ones that have always been more in the consumer technology realm, Sony and Panasonic. Look at the top cameras for consumers and HP is in the game, which nobody could've guessed 5 years ago. </p>
      <p>Kodak is trying pretty hard to turn into a digital company, and the old image is the last thing to go. I hope the rebrand works for them.</p>
