  html: <p>Number 1 is not a typeface. It appears to be some kind of  <br>carved letters. <br> <br>Number 3 looks like Devinne Italic or, since it's in German,  <br>it could be Lateinisch, H. Berthold's Devinne look-alike.  <br>Neither of these is available digitally that I know of, but  <br>Bitstream's <a href="http://www.myfonts.com/fonts/bitstream/romana/">Romana</a> is very close. No italic unfortunately. <br> <br>Couldn't find the script in any of my books. Troubador has  <br>some similarities (such as the uppercase M).</p>
