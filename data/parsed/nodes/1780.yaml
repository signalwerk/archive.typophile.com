    html: '<p>As Mark Simonson said, #3 it looks like Lateinisch from Berthold. <br> <br>I want to add that this font was digitized by a Russian foundry, ParaType (<a href="http://www.paratype.com" target="_blank">www.paratype.com</a>). They named it Literaturnaya. <br> <br>The font was donated to public domain, but only for use in TeX applications. It can be found in various russian TeX archives, both PFB and metrics, but the encoding is for TeX. Be sure to read the licence, cause it is not quite a free font.</p>'
