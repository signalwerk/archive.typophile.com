  html: <p> In your experience as type designers, how important is the practice of hinting, especially for a PostScript or TrueType font intended for print applications? <br> <br>Further, can you offer suggestions on good systematic ways to accomplish effective hinting? <br> <br>The reason I ask is that I have noticed that some of my own fonts print perfectly well when I send them to a service bureau, but they can jump and bounce when I print them in small sizes on my 600 d.p.i. laser printer -- sometimes producing jarring results. I'd really like to solve this problem before I begin marketing them. <br> <br>Any help, suggestions or references would be most appreciated! <br> <br>David </p>
  html_clean: <p> In your experience as type designers, how important is the practice of hinting, especially for a PostScript or TrueType font intended for print applications? <br> <br>Further, can you offer suggestions on good systematic ways to accomplish effective hinting? <br> <br>The reason I ask is that I have noticed that some of my own fonts print perfectly well when I send them to a service bureau, but they can jump and bounce when I print them in small sizes on my 600 d.p.i. laser printer -- sometimes producing jarring results. I'd really like to solve this problem before I begin marketing them. <br> <br>Any help, suggestions or references would be most appreciated! <br> <br>David </p>
