    html: "<p> I'm no expert on hinting (I've just finished my first serious project with VTT), but hinting is very important for ensuring quality on medium-res output. By medium-res I mean like between 200 to 1000 dpi. As you say, in hi-res it's not important. Where I disagree with most hinting people is in the area of low-res (below ~200 dpi): I'm yet to be convinced that good old-fashioned bitmaps don't make more sense for text (if not display) at those resolutions. Basically, the only way to get good results at like 12-20 PPEM using hinting is to resort to delta hints, and that makes no sense at all. And then there's the area of grayscale rendering, and at that point delta hinting totally falls apart, in terms of cost-effectiveness. <br> <br>So, to me, \"global\" hinting (like to make the stems of a lc \"n\" equal across the range of PPEM sizes) is very important (and it will be for another few years), but pixel-specific hinting (like for screen display) is just backwards. <br> <br>BTW, take note that the auto-hinting in Fog4 is flawed. <br> <br>hhp </p>"
