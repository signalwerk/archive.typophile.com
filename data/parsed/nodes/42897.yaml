      <p>Musical taste is never suspect since it is completely subjective. As far as I'm concerned the opinion of a 12 year old that likes Hannah Montana/Miley Cyrus is just as valid as Leonard Feather's. I would definitely rather read his writing though. -:)</p>
      <p>The fact that you're a music fan is wonderful. I am not per se, because once I started playing instead of practicing I was interested in my own music too much to be a fan anymore. </p>
      <p>There's music I like but I am not passionate about it and I rarely listen.</p>
      <p>One of my criteria for judging music is whether I think that the artist wants to be a star or not. So I don't listen to popular music or radio. I have a large collection of gypsy music from around the world and I like it both musically and theoretically because in these societies musicians are no more important than bread bakers, which is how it should be in my opinion. I also like the fact that the gypsies are another class of scorned people, who have always had the best music because that's one of the only things that couldn't be taken from them.</p>
      <p>My last musical "hero" was Fred Frith, who I think is still one of the finest instrumentalists in the improvisational world.</p>
      <p>My collection ranges from Mauricio Kagel to Romica Puceanu, the gypsy siren of Romania. I have more CDs of sound effects than anything else.</p>
      <p>My favorite series of covers are for Faust.</p>
      <p>So it's a complicated mix…</p>
      <p>pbc</p>
