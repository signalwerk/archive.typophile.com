      <p>I agree with Paul about the authenticity of bold condensed sans (grot or square--pre Univers/Helevetica), but that might be a bit too clean and structured for the social memory of improvised jazz. So perhaps a little looseness/distress might work, e.g. my <a href="http://www.shinntype.com/brown.html" rel="nofollow">Brown,</a> say Extra Bold Condensed, and paired with a gestural cursive script (Mistral comes to mind) to really capture the free flow.</p>
      <p>The line illustrations sounds like a nice idea.</p>
      <p>IMO, Daddy-O is a bit crazy and lacks gravitas, those were serious dudes and very laid back. I never got to see Bird play, but I love on the youtube videos it's like he's so cool he's completely motionless, and yet there's this amazing stream of melody.</p>
