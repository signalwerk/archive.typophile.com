      <p>I saw Miles during the electric phase - I believe the album was "Bitches Brew". He was definitely not an entertainer, but he could blow. He could also smoke - I saw him take a drag on a cigarette that was probably half of it - blew out an enormous cloud and then continued playing.</p>
      <p>I don't think anything defines that period graphically better than Blue Note. Really moody design in muted blues and purples, occasional splashes of color, progressive typography using the tools of the day, and very interesting photo treatments. Love it.</p>
      <p>pbc</p>
