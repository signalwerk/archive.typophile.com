      <p>If you take a look at the most influential graphic works on jazz - blue note records covers by reid miles - you'll understand that the standard he created uses a quite limited amount of typefaces, which you can use today without fear of schocking. these "helvetica of jazz types" would be clarendon, franklin gothic / news gothic / akzidenz condensed. now of course nothing holds you from using something else and create your own mood about it, but if i had a go on a project like this, i would definitely (at least) use a clarendon-like among my choices, and it would actually most probably be clarendon itself.</p>
      <p>dr</p>
