  html: <p>Designing a series of Jazz book covers. They will have line art illustrations that reflect the bebop Jazz era. The three books will cover Charlie Parker, Miles Davis, and Dizzy Gillespie. I wanted to bring a little influence of the jazz records but since it is a 3 book series I need to bring them together with 1 or 2 typeface. One typeface for the headline or name of the Jazz player and the second typeface for the standard name of the book series that will be placed on all three books (author name, series name, publisher, etc). Any suggestions on typefaces and combination would help out. I'm out of ideas.</p>
  html_clean: <p>Designing a series of Jazz book covers. They will have line art illustrations that reflect the bebop Jazz era. The three books will cover Charlie Parker, Miles Davis, and Dizzy Gillespie. I wanted to bring a little influence of the jazz records but since it is a 3 book series I need to bring them together with 1 or 2 typeface. One typeface for the headline or name of the Jazz player and the second typeface for the standard name of the book series that will be placed on all three books (author name, series name, publisher, etc). Any suggestions on typefaces and combination would help out. I'm out of ideas.</p>
