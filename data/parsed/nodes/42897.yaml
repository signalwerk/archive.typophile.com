      <p>I am not saying that jazz hasn't been very well engineered for many years - the Miles / Gil Evans collaborations come to mind. But there is a sheeniness that most of the ECM recordings have that doesn't stand the test of time for me. I loved it when I first heard it, that's when I was a record producer and engineer and that was definitely a leap forward, especially the cymbals, which had a sparkle that I hadn't heard before. I will assume (although I could be very wrong) that some of those first engineers for ECM had cut their teeth on classical music, perhaps at  Deutsche Gramophone, since classical music was the laboratory for recording acoustic instruments and DG LPs were the gold standard.<br>
      It was a quantum leap in separation of sound, really amazing acoustic engineering, but for me the cleanness is antithetical to what I love about jazz.</p>
      <p>pbc</p>
