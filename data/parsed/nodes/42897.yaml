      <p>This is a photo of the packaging we did when we released "below the level of observation" by International Metal Supply. That was the last group I formed after finally quitting rock for good. The other player was a classically trained percussionist who had worked with Kagel and John Cage, among many others. We designed and built our own instruments, all metal with contact microphones. He is still one of my good friends and that was a really fun period of my life. The pinnacle of our performances was performing soundtracks to silent films. Really fun. I remember leaving my body during one of the performances.</p>
      <p>pbc</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cd2_3791.jpg"></div><p></p>
