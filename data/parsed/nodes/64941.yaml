      <p>Did you find the 'Kerning' options?</p>
      <p>Try generating a font with the ‘Export old-style non-OpenType "kern" table’ option selected <em>instead</em> of the ‘Generate OpenType "kern" feature...’ option, i.e. uncheck the latter option and turn on only the first. This will create a font with a kern table, which Office should be able to handle.</p>
