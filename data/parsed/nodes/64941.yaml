      <p>EDIT: Oh, I'm sorry, I didn't read your post carefully enough. I'll leave what I wrote in case it's different from how you've been turning kerning on and off.</p>
      <p>Kerning is, remarkably, off in Word by default. Under the font menu (typically Ctrl-D), click on character spacing, then check the box for kerning and type in a minimal point size at which kerning appears (1 pt seems to be the smallest).</p>
