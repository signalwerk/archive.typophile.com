  - id: 418981
    user: 4926
    date: 2010-07-06T05:26:00
    date_raw: 6 Jul 2010 — 5:26am
    votes: null
    html: |-
      <p>This is an old topic but I have learned what causes the problem and decided to share with you guys.<br>
      Just to remind: the problem is that MS Word 2003 and 2007 refuses to show kerning defined in plain 'kern' table in TTFs even if you turn kerning on in the Character Spacing dialog.<br>
      This only happens if you have at least one kerning pair defined for a glyph without a Unicode index. MS Word ignores the whole 'kern' table in this case.</p>
      <p>Regards,<br>
      Johnych</p>
