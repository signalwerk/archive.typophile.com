    <p>When I generate .ttf from FontLab the custom kerning I built works in Adobe software but not in MS Word. Anyone know why? I have been trying to figure this out for a few days with no success. Best I have found is how to turn Kerning on and off in Word, but turning this option on has no effect.</p>
    <p>Any advice is appreciated. Thank you.</p>
