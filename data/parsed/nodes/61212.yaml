    <p>I’m currently trying to rework my school paper’s nameplate.<br>
    This is what I came up with very quickly. I figured some better trained eyes might be able to help me steer in the right direction before I get too far.<br>
    At this point I’m looking at the arms of the “E” and “C” and how they compare... I gave the c some added weight on the bottom to maybe compensate for the lack of weight that the e has in the middle? I’m not sure if that’s wise, but I also don’t want them to look cloned. (I’m also not liking that wedge on the e, which I attempted for the same purpose).</p>
    <p>Tear it apart!</p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="/files/Echo_3602.gif"></div><p></p>
