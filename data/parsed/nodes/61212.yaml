    html: |-
      <p>This latest version looks really nice. I’d pick up that paper for sure. </p>
      <p>The left shadow works better not only because it’s not blurred, but because it’s less complex. See how many fewer bits are involved in the ’E’, for example? This is a good example of how we can learn from signpainters. They rarely do shadows on the right, for just that reason.</p>
      <p>Good tip from Tiff. Also, now that you’ve lightened everything the crossbars on the ’H’ and ’E’ are probably a bit too light. From a distance you see TIIC or THC.</p>
    html_clean: |-
