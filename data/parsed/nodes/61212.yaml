    html: |-
      <p>Stephen Coles: <em>This is a good example of how we can learn from signpainters. They rarely do shadows on the right, for just that reason.</em></p>
      <p>Although I can understand the reasoning of this (the left sides of the characters are simpler). I’ve always understood is was more ’natural’ to have the light come from the left side. The shadow cast on the right side will then make the characters ’pop’ against the reading direction, towards the viewer (instead of away from the viewer).</p>
