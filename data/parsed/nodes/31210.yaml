    <p>Hey, I'm a complete newbie to typophile, so bear with me.<br>
    I have completed a design education recently<br>
    (not graphic, but industrial, so I'm not going to claim that I am a graphic designer)</p>
    <p>anyways, my family has a dairy farm, and thus as typical, a sign stands at the end of the lane with the farm name etc.</p>
    <p>the sign was old, needing a repaint (at the bare minimum)i of course volunteered to give it something of a freshen up</p>
    <p>posted first is the sign before hand (very typical or cliché for the scenario)</p>
    <p>so i felt like giving it a change, giving the farm something of a brand identity kinda thing,</p>
    <p>i searched the net for some inspiration, and posted is a pic for a horse farm that i kinda used as the basis for the design<br>
    thus comes the design i came up with and the after picture of the sign</p>
    <p>please critique or comment as you see fit</p>
    <p>thanks</p>
