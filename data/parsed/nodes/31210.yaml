      <p>In terms of production don't have bleeds on both the top and the bottom. You push the cost of printing up, that is if you are going to print. </p>
      <p>I would review your design based on what the industry is doing. Your design is light and airy like a boutique selling clothing but is that the image you want to present to your target audience. Do they want arty design or bold, productive, safe qualities. Its not a bad design but maybe not the right one for your industry.</p>
    html_clean: |-
