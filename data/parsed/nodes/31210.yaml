      <p>So, since the old one was destroyed, we are going to have the new one done with vinyl cut letters on a white acrylic board, hopefully helping it last longer and not having to worry about repainting.<br>
      Also, since, the farm no longer has exclusively Holstein cows, but now Brown Swiss too, so I have been told that the sign should only read the farm name: Wellsfarm</p>
      <p>This reduction from “Wellsfarm Holsteins” to “Wellsfarm” has left me not sure how I feel about the balance of the look, so help and ideas are welcome.<br>
      Also, since the sign is going to be done on a white acrylic board, I think colour matching to the frame and posts might be difficult, so I’m thinking that they would be better in black, and would help to punch the sign out better.<br>
      Thoughts???</p>
