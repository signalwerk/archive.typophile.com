    html: <p>Trajan is far from the right type, but that particular setup, with the tight leading bringing the word "Holsteins" off of the cow's back, helps with the balance. Right now the composition is far too heavy on the right. In other words, if you set this logo down on the ground, everything would tip over and fall back on the cow's hindquarters. Perhaps if the apex/fulcrum of the tail curled up rather than dow, or if the type set in some way to bring physical weight back over to the left.</p>
