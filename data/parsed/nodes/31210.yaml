    html: |-
      <p>The back of the cow this way IS intentional, within the dairy industry, where cow "type" is pushed, a level (like a ruler) back is pushed as ideal, regardless of how unrealistic this might seem. I did use a picture of a 'show cow' for guidelines when doing the logo, I think I actually used a picture for an underlay to get it going.  I believe that I might have actually shortened the back to make it fit better with the sign.<br>
      <a href="http://www.comestar.qc.ca/lautamie.html" title="http://www.comestar.qc.ca/lautamie.html">http://www.comestar.qc.ca/lautamie.html</a><br>
      This link shows an example of what you see typically in photographed show cows. So there you can see, flat back, and long proportions lend to the 'Dairy' character of the cow.</p>
    html_clean: |-
