    html: |-
      <p>"Missing glyph" means that your class definitions refer to glyphs that aren't in the font. </p>
      <p>The "kern" feature definition shouldn't be empty. You can just omit it. In Preferences, make sure the "Generate 'kern' feature if it is undefined or outdated" is enabled.</p>
