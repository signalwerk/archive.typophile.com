    user: 1133
    date: 2011-07-15T03:59:00
    date_raw: 15 Jul 2011 — 3:59am
    votes: null
    html: |-
      <p>Do you have "Generate 'kern' feature if it is undefined or outdated" enabled in Preferences / Generating OpenType &amp; TrueType / Kerning?</p>
      <p>If so, when you compile the features, FLS will automatically convert your Metrics Window + Classes panel kerning into an OT "kern" feature.</p>
    html_clean: |-
