    html: |-
      <p>Fedra Serif is part of the <a href="/wiki/https%3A/%252Fwww.typotheque.com/fonts/fedra_serif_a" class="freelinking" rel="nofollow">Typotheque</a> font collection. It's not available elsewhere (moreover freely) nor included in any Operating System font package or software bundle, to my knowledge at least.<br>
      Here are some resources you might find useful: <a class="freelinking external" href="http://www.identifont.com/similar?GIC" rel="nofollow">list</a> of similar to Fedra Serif A compiled at Identifont, "<a class="freelinking external" href="http://www.myfonts.com/morelike/38719/" rel="nofollow">More like</a>" at MF, <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/list/style/Serif" rel="nofollow">Serif Fonts</a> section at Fontsquirrel and <a class="freelinking external" href="http://www.google.com/fonts" rel="nofollow">Google Web Fonts</a> directory.</p>
