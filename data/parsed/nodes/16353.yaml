      <p>Thank you both for the criticism and suggestions.</p>
      <p>Maybe shouldn't have used the difference in weight of the strokes.</p>
      <p>I took the greek capital letter α and δ. I looked for the for a couple of weeks and one of my idea's was that when they where combined they look a little like an eye. The α looked more like an eye than the δ. It symbolized looking (for me) at the arts.</p>
      <p>The name of the association was chosen because of the term in art history.</p>
      <p>I hoped to avoid a star of david, because it was turned and the strokes where of different weights (to draw attention to the α and δ).</p>
      <p>I chose for Lithos because of the greek connection it has and because it is a playful typeface, but can still be used on official documents (the Faculty and the entire university use 'minion') and I have a license for it.</p>
      <p>Most of the people (I could only test it on 2 , recognized the α and δ, but one was a board-member and one was the head of communications. So they might have been bias and the first person I told about the design of the logo and a few days later he saw it (he has a good memory).</p>
      <p>I shall try playing with the weight at first and the contemplate if the meaning is clear enough.</p>
      <p>Thanks you both for your reaction and I will post changes soon.</p>
      <p>I like logo 2. I slimed it down, but i think it is still clear wich letters are ment.</p>
      <p>logo 3 and 4 I have tried to change the shape a little to prevent the davidsstar connection.</p>
