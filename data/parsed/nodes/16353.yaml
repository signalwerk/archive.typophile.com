    <p>hello,</p>
    <p>This is my first post. I’ve been playing with this logo for a few weeks. This is for the students study association of the Faculty of Creative and Performing Arts. The first logo was horible, so I offerd to change it. Here you can see what the current logo is.</p>
    <p><a href="http://www.kunstenenwetenschappen.nl/index.php3?m=32&amp;c=33&amp;garb=0.1448401879036696&amp;session=" title="http://www.kunstenenwetenschappen.nl/index.php3?m=32&amp;c=33&amp;garb=0.1448401879036696&amp;session=">http://www.kunstenenwetenschappen.nl/index.php3?m=32&amp;c=33&amp;garb=0.1448401...</a></p>
    <p>Something is wrong with the eye and I don't know what. I tried to but the pupil in the middle, but that didn't work.</p>
    <p>I have also made a .pdf so you can look how I think the logo can work as a letterhead.</p>
    <p>Any help or critique is appreciated</p>
    <p>Thanks</p>
