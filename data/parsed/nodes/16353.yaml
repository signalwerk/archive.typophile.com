      <p><em>Apollo popularly (e.g., in literary criticism) represents harmony, order, and reason - characteristics contrasted by those of Dionysus, god of wine, who popularly represents emotion and chaos. The contrast between the roles of these gods is reflected in the adjectives Apollonian and Dionysian. However, Greeks thought of the two qualities as complementary: the two gods are brothers, and when Apollo at winter left for Hyperborea he would leave the Delphi Oracle to Dionysus.</em> from Wikipedia<br>
      I would suggest that Alpha is always going to be confused with A, which would then result in Delta being seen as a triangle. I recommend that you either pursue your eye using the lowercase forms, or take a different approach, the quote from wikipedia gives a direction you could take of contrasting yet complementary areas.<br>
      Tim</p>
