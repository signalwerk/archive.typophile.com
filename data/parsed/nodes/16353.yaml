      <p>Although my last <a href="http://typophile.com/node/16248" rel="nofollow">post</a> to this sort of thread seems to have killed it, I'm going to give this a shot. I often say to my students that design should answer questions, not raise them. Yet this design leaves me with all kinds of questions. First off, what is the actual logo getting at? I mean this very simply; I don't know what you're getting at. I know a bit about Dionysus, a bit about Apollo, but I have no idea what the vector shapes are trying to tell me. What's the pupil about? Why the left pointing triangle? Why a combined shape that resembles a rotated star of David? Why such a harsh contrast between the stoke thicknesses? Why centred over the ampersand? Question, question, question...</p>
      <p>Also, Lithos is too easy for the font. It's the Copperplate Gothic or Trajan of Greek; both great fonts, but used to death for quite a while now.</p>
      <p>Again, I might be out of the loop, but I just don't know what this logo is getting at, and therefore it seems a bit weak.</p>
