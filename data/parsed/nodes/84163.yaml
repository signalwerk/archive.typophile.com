      <p>imo it is too curvy and sexual. the downward stroke on the minoscule n has been re-used on too many of the other letters. I suggest you design a secondary way to give the curved strokes to the glyphs, such as m or x or whatnot, so that this large downward stroke on the n and in some other places is not recuced in value and beauty.</p>
