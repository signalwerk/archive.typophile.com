  - id: 538624
    user: 10615
    date: 2013-01-17T12:41:00
    date_raw: 17 Jan 2013 — 12:41pm
    votes: null
    html: <p>Agree with others - the spacing is uneven. The word spacing in your sample is much too large and the letter spacing too small. Hand-written forms need to have a strong rhythm, and that means considering the spacing of verticals as well as balancing the open counters. Agree with others that the repetition of the inner tendril is too obvious, needs more variation. But then I think you'll have something very interesting and worth-while.</p>
