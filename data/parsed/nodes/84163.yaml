    html: <p>The /u/ and /y/ are the only glyphs that loop. The /y/ looks like 'er' or 'ej' or 'ejr' and the /u/ looks like 'ei'. I think it would be more consistent and more easily interpreted if they both had solid decorative tips instead of the open loops. Some of the confusion may be due to the very tight spacing that butts both of these letters up against their predecessor.</p>
