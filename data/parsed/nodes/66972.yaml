    <p>For Immediate Release:<br>
    Buffalo, NY- February 3rd, 2010</p>
    <p>P22 Type Foundry and the International House of Fonts announce 3 new font families for February designed by Norwegian type designer Torleiv Sverdrup for IHOF.</p>
    <p>P22 Kirkwall is an unusual and elegant design. The upper case letters have a slightly curved stem that ends in a small serif and wedge crossbars. The lower case letters have a fluid and easy design with end-hooks and long leading serifs. Kirkwall Trim and Bold Trim styles contain an alternate set of lower case characters without the long leading serifs and end-hooks. P22 Kirkwall is appealing for display work and appropriate for short texts and headlines.</p>
    <p>"The type design is inspired by my meeting with the people of Orkney Island and their culture, and it's my tribute to the St. Magnus Cathedral in Kirkwall."<br>
    -Torleiv Sverdup</p>
    <p><a href="http://p22.com/ihof/kirkwall.html" title="http://p22.com/ihof/kirkwall.html">http://p22.com/ihof/kirkwall.html</a></p>
    <p>P22 Ornes is inspired by the runic alphabet with ornamentation based on the woodcarvings of the Urnes Stave Church (Norway), an old wooden church from approximately 1150 CE. The woodcarvings and their symbolism reach back to the pre-Christian era. The Ornes Pro styles each contain the runic alphabet, ornamented caps, small caps, ornamented small caps and other pro OpenType features. Ornes Ornamented Rustic Pro features a subtle uneven lowercase with ornamented caps.</p>
    <p><a href="http://p22.com/ihof/ornes.html" title="http://p22.com/ihof/ornes.html">http://p22.com/ihof/ornes.html</a></p>
    <p>P22 Speyside is a round, curved and controlled sans serif with an additional set of decorated uppercase letters, initials and small caps. It's appropriate for text, titling and display. The origin of the name is taken from a small location in Tobago. The font is inspired by the local handicraft, the batik in particular. Each pro font style includes small caps and decorative initials as well as several OpenType features.</p>
    <p><a href="http://p22.com/ihof/speyside.html" title="http://p22.com/ihof/speyside.html">http://p22.com/ihof/speyside.html</a></p>
    <p>Introductory offers available for all three families, purchased separately or in one pack, through February 28th.<br>
    <a href="http://p22.com/ihof/torleiv.html" title="http://p22.com/ihof/torleiv.html">http://p22.com/ihof/torleiv.html</a><br>
