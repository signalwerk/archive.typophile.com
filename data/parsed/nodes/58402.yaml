  html: |-
    <p>I'm looking for some advice, tutorial, or methods for hinting.</p>
    <p>I'm producing Post Script Opentype fonts and using this process at the moment to hint.</p>
    <p>1. Set the Alignment Zones - Not using auto zones which doesn't seem to do a great job.<br>
    2. Auto Hint the fonts with either FontLabs Auto Hinting or Adobe's AFDKO - I've tried both to compare results. I then adjust hints that don't seem to work.<br>
    3. Set the Standard Stems  - Again not using auto stems but the method described <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=NotesOnHintingWithFL" target="_blank">here</a></p>
    <p>After using this process and changing lots of different parameters I'm still getting hints that don't seem to be working.</p>
    <p>This image shows the Sub/Superscript, the Superscript on the right is jumping all over the place at small sizes.</p>
    <p>Is there anything else I can try to improve the hinting ?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sub_6709.png"></div><p></p>
