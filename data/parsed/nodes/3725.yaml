  html: <p>I am attempting to import spacing info from a finished font to <br>a font that has no sidebearings at all. The kerning info imports <br>just fine, but sidebearings are only added to the right side (and <br>in strange large values, at that). I've tried importing the .met,  <br>.afm, and the bitmap file. What up? <br> <br>Fontographer 4.1.4, Mac</p>
