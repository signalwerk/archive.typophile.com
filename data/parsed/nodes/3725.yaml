    html: <p>Coles, going PC? <br>You must really be in a pinch. <br> <br>Here's what you do (in Fontlab) <br>1.) Open both files. <br>2.) Select the characters from <br>from the file whose sidebearings you want to copy. <br>3.) Then Edit &gt; Copy <br>4.) Switch to the open file to which you'd like <br>to apply the sidebearings and select the same <br>characters (this is key). <br>5.) Then Edit &gt; Paste Special <br>6.) Select the left and right sidebearing options <br>and hit ok. <br> <br>This should do the trick. <br>There are others ways to do this but this <br>is the fastest and smoothest.</p>
