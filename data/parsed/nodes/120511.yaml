      <p>Thanks everyone for your valuable feedback!<br>
      I guess another trick to lighten the "m" could be to widen the grid slightly for that character, making the glyph a little wider, but keeping the character spacing? I was thinking about making this into an old school CAD font in the .shx format. In that case I would not be able to vary line thickness for individual characters or strokes.</p>
