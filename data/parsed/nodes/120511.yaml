      <blockquote><p>I always assumed you can compensate for dark areas like these</p></blockquote>
      <p>Yes, of course, but given the modularity and adherence to a very small grid of this design, I think it could be right to look for solutions used in pixel and similarly strictly constructed typefaces.</p>
