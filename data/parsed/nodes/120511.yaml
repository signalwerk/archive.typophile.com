    html: <p>If you widen all letters enough, indeed the dark spots should mostly disappear, but I think you will have to wide the characters too much to remove the dark spots completely. If you widen the characters just a little, characters like /m will still look relatively too dark even though on an individual basis you've lightened the /m. It's worth a try though. Your characters are quite condensed, so you do have some space to work with.</p>
