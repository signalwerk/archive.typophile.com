  html: |-
    <p>The »Holzlettern Manufaktur Hamburg« (Wood Type Manufacture)  is a part of the <a href="/wiki/Museum%20der%20Arbeit" class="freelinking" rel="nofollow">Museum der Arbeit</a> (Museum of Work) in Hamburg. It is a project by Daniel Janssen from <a href="/wiki/B%C3%BCro%20f%C3%BCr%20Gestaltung%20Janssen" class="freelinking" rel="nofollow">Büro für Gestaltung Janssen</a>.<br>
    The »Holzlettern Manufaktur Hamburg« is now the last existing collection of Wood Type from <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> and other foundries in Germany. And it is not also a museum, you can also print there with the wood types.<br>
    <a href="http://www.holzlettern-manufaktur.de" title="http://www.holzlettern-manufaktur.de">http://www.holzlettern-manufaktur.de</a> (Website is only in German)</p>
