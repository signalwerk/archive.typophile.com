    <p>I was just wondering what you good people thought of this typography / branding on these:<br>
    the kerning seems to leave the type like broken tombstones in long forgotten graveyard..</p>
    <p><a class="freelinking external" href="http://www.light-bikes.de/website/new/wp-content/uploads/2008/03/cipo2.jpg" rel="nofollow">http://www.light-bikes.de/website/new/wp-content/uploads/2008/03/cipo2.jpg</a></p>
    <p><a class="freelinking external" href="http://www.roadcycling.com/artman/uploads/lightweight_1_002.jpg" rel="nofollow">http://www.roadcycling.com/artman/uploads/lightweight_1_002.jpg</a></p>
    <p><a class="freelinking external" href="http://www.zweiradpool.de/u/53aPic1B23508168_zz_LightweightStandardIII.jpg" rel="nofollow">http://www.zweiradpool.de/u/53aPic1B23508168_zz_LightweightStandardIII.jpg</a></p>
    <p>(myself; i think it's completely dreadful, unique but terrible)</p>
    <p>it seems to me they are trying to go hand drawn script but they don't really know where to start. so they chose something 'scripty' and 'typed it in'</p>
    <p><a class="freelinking external" href="http://bikerepairman.com/campagnolo_logo.gif" rel="nofollow">http://bikerepairman.com/campagnolo_logo.gif</a></p>
    <p><a class="freelinking external" href="http://home.pacbell.net/trh-arch/alfa/script.jpg" rel="nofollow">http://home.pacbell.net/trh-arch/alfa/script.jpg</a></p>
    <p>oh and these are not cheap wheels either.</p>
