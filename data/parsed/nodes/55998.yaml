    html: |-
      <p>Hi,<br>
      I am a big cyclist myself and as much as i would want to have a pair of Lightweights, this branding with Apple Chancery would make me so slow. A shame because these wheels cost a fortune (for the prize of one pair you would get a good complete bike). As for Campagnolo: this is a rather old logo and not a retro one. This was the style in the Fifties. But Lightweight is poor. It tries to mimick the grandness and reputation of brands and products like Campagnolo. The ›Lighties‹ at current state are the best wheels you can have. But the wordmark really looks like a cheap inscription on a cheap tombstone, i agree. And it is not unique at all. Why? It is just typed Apple Chancery with loose spacing. The outcome of an engineer who knows how to build high-performance wheels and who therefor thinks he can make a good logo, too. As a matter of fact, many many professional cycling teams are equipped with those wheels, so success is on his side.</p>
