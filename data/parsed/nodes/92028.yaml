  html: |-
    <p>Hello All</p>
    <p>I am working on a couple of projects at the moment.  One is a children's DVD design. I am really happy with that, I chose Chaparral Pro as the typeface and did not once have any second thoughts about my choice, it just felt right.  As it is a piece of coursework, I can choose my own typeface.</p>
    <p>However, my second piece of work is different.  It is a piece of poetry and I have looked at many different typefaces, including Arno, Goudy Oldstyle and Feijoa.  </p>
    <p>My finished piece of work is set in Arno Pro.  This is great in that it has a great range of weights, swashes and so on, but I feel a real tug towards Feijoa.  I didn't realise one could get so involved in typefaces, to the extent where they are nagging at you at the back of your mind.</p>
    <p>I am really interested to know if others get this when choosing a typeface, and to know which typefaces "call" you the most</p>
    <p>Thanks</p>
