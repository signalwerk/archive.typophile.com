    <p>I need to identify this font for a client and have been struggling for quite some time now. The trick with this one is that it seems to be custom in that the serifs are cut off on one side throughout the title. </p>
    <p>I'm also pretty sure that the R's are custom on the ends. The thicker end of the large A and the pointed bottom right corner of the N's could be tell tale signs?</p>
    <p>Please help!</p>
    <p><a href="http://www.dailyfreegames.com/wallpaperfiles/size2/Rise_of_the_argonauts_wallpaper01_1024x768.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Here's a large copy</a></p>
