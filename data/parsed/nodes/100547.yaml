      <p>i’ve got only a very faint clue of what i hacked here, but your input worked for me as well [aalt]:<br><code><br>
      @zero_target = [<br>
      #<br>
      zero.zero ];<br>
      languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br></code><br>
      thanks!</p>
