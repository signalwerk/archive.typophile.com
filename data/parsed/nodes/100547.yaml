    votes: 0
    html: |-
      <p>In that lower right part of the OT Panel, you need to add at least this:</p>
      <p>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;</p>
      <p>Add others if your font support other language systems.</p>
      <p>This is all related to the fact that the more recent versions of FontLab include a more recent version of the Adobe Font Development Kit for OpenType (AFDKO), which requires these language systems to be declared. It used to be optional. </p>
      <p>Anything you type in the lower right portion of the OT Panel in FontLab gets inserted at the beginning of all your OT code when it is compiled, and that's where you put the language system declarations.</p>
