    <p>This warning always appears when I generate an otf in FL 5.1. It never appeared in FL5.0.4.</p>
    <p>[WARNING]  [internal] Feature block seen before any language system statement.  You should place languagesystem statements before any feature definition [/Users/nickcooke/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 6]</p>
    <p>How do I place the languagesystem statements before any feature definition?</p>
    <p>Thanks.</p>
