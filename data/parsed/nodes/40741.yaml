    html: |-
      <p>When you find a candidate, be sure to go to the foundry's web site (or write them) and make sure the license allows you do use the fonts as you need. Some foundries, for example, won't let you embed the fonts in a PDF file to send to the printer (rare, but it happens). Some won't let you embed the fonts in a PDF file that will appear on line (quite common). Some foundries have different pricing depending on how the fonts will be used (e.g. on line, print only, etc. etc.).</p>
      <p>In passing I can't imagine using Paperback for an "stylish, arty photography magazine"; maybe that's just my lack of imagination.</p>
