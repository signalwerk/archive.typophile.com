    <p>I've been searching font libraries for what seems like years, trying to find a 'perfect' font for a magazine redesign. I thought I'd finally settled with Chronice and Verlag but now not sure. My company is buying the fonts in and I don't want to get them in, and then find out that they are no good!</p>
    <p>I'm looking for a contempory serif font for body text and sans for the headline/captions etc. The mag is very stylish, b&amp;w photography mag  </p>
    <p>My shortlist includes: freight, proxima nova, paperback, thorndale, alfon, breuer text, camingo, klavika...</p>
    <p>I'm so confused!!! Not asking you to do my job for me, but any suggestions/guidence would be great!</p>
