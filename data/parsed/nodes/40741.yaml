      <p>During the past several months, <a href="http://www.fontbureau.com/fonts/Whitman" target="new" rel="nofollow">Whitman</a> has been expanded for a couple magazines, including <cite>The Knot</cite> and the recent <cite>Fortune</cite> redesign. The newer fonts are not available via FB's retail site just yet, but they are available for license through the Font Bureau. You'll need to contact them directly if you're interested. I could also send you some PDF samples, if you want to contact me directly via my Typophile contact.</p>
      <p>Some examples can be seen at <a href="http://www.kentlew.com" title="www.kentlew.com">www.kentlew.com</a>, but many of the <cite>Fortune</cite> commissions aren't shown yet. </p>
      <p>-- K.</p>
