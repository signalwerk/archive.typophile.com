    <p>Greetings.</p>
    <p>I'm trying to use Anchor Attachments to position marks to base glyphs for an Indic font I'm creating with FontLab+VOLT.</p>
    <p>The positioning of the mark works well and VOLT does provide a really nice interface to tune this perfectly well.</p>
    <p>However, when I run the feature through the Proofing Tool, there is a space after the base, presumably by the mark that is now attached to the base.</p>
    <p>I've tried this with 'Below-Base Mark Positioning' and 'Mark Positioning' features - the result is thesame.</p>
    <p>The attached screen shot may help illustrate the problem.</p>
    <p>Appreciate any help or pointer.</p>
    <p>~ MUTHU</p>
