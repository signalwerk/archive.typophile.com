    <p>I'm looking for some examples of very well designed GOTH graphics for a student of mine who is doing a design project on Goth fashion labels. Can anyone offer some names of designers or links to their work that I can show her?</p>
    <p>Frankly, I'm at a loss. It's a genre I know very little about, past its typical penchant for using Blackletter (mostly due to Nazi appropriation). And honestly, all the typical band posters and skateboarder fashions I've seen in the Goth genre fall squarely into the cheesy category.....poor layout, muddy hierarchy, bad legibility, overly dramatic or contrasty color palettes....just bad design in general.</p>
    <p>Have any serious and skilled designers or firms taken up goth graphics and produced any exemplary bodies of work?</p>
    <p>Thanks for reading</p>
