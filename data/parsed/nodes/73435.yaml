      <p>I agree that you'll need to clarify what you mean by goth. Since you mentioned fashion labels, you're probably thinking of something more recent. But when I think of the gothic subculture, the first thing that comes to mind is Bauhaus's <em>Bela Lugosi's Dead</em> from 1979. The single looks like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Bela_Lugosi's_Dead_Cover_4912.jpg"></div><br>
      You can't get any more gothic, but the type alone doesn't say that.<p></p>
      <p>In 1982, Christian Death was doing something more obvious:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Christian_Death_-_Only_Theatre_Of_Pain_5460.jpg"></div><br>
      I suspect this is related to <a href="http://welovetypography.com/post/1322/" rel="nofollow">black metal lettering</a>. Maybe that's more like what passes for goth these days.<p></p>
      <p>This is from Southern Death Cult in 1983, and it was too lovely not to include:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BEGA46_4208.jpg"></div><p></p>
      <p>Dunno, maybe that information will give you starting point?</p>
