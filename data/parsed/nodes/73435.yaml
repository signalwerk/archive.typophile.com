    html: <p>What you call goth design looks that way on purpose. It’s a manufactured counterculture created in the late 90s and early 00s by record companies and stores like Hot Topic for the purpose of reinforcing the us-vs-them mentality of social cliques. You won’t find examples that look good from the mindset of a design teacher hung up on traditional notions of good design because the entire point of this aesthetic is to be condemned as ugly by people who are not part of the group that identified with it, thus allowing that group to wallow in their self-identification as outsiders. If the design started too look professional then it gets associated with mainstream pop culture and would no longer be commercially viable.</p>
