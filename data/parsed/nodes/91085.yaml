    <p>Hi,<br>
    I've been thinking a lot lately on why there isn't a ligature for the combination of letters: f and ü?<br>
    There seems to be a bunch of words in german language containing these. (Im do not speak the german language myself, but im working on a multi-language book at the moment and reacted when i saw it for the first time.) </p>
    <p>Does anyone know if such a ligature exists? Or if not, perhaps why it doesn't? Just curious.</p>
