    <p>Hi,</p>
    <p>I am new to this site. I am a designer working on a poster for Jordan. I need to set the font in Arabic. So far I have it sent to me via e-mail.<br>
    This one is simple, it is just one sentence! Can anyone please help?</p>
    <p>I started learning Arabic, but I am not good enough to figure it out.</p>
    <p>  شركة زارا لتجارة الآليات الثقيلة</p>
