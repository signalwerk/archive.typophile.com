      <p>Are you looking for a typeface that provides Arabic glyphs? Then <a href="http://ilovetypography.com/2009/12/04/neue-helvetica-arabic-wishing-on-a-typeface/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this article</a> might help you with a few links, or <a href="http://www.lucasfonts.com/fonts/thesansarabic/thesansarabic/overview/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> is another Arabic font. Or take a look at <a href="http://www.arab-fonts.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this site</a> too.</p>
      <p>I was curious. The <a href="http://translate.google.com/#ar/en/شركة%20زارا%20لتجارة%20الآليات%20الثقيلة" title="Click to visit an external URL." class="freelink freelink-external freelink-external">automagic English translation</a> seems to come close to “Zara for Heavy Duty vehicles Co.” according to a friend, but apparently ought not to be used in a trading layout.</p>
