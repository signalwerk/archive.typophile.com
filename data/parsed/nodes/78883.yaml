    html: |-
      <p>If you use the version with lower case, instead of capitals and small capitals, it is legible and beautiful... but I still would not recommend it, from the sound of your question. If the brochure is to be very readable even by elderly people with poor vision under poor lighting in a hurry - perhaps it is a booklet of instructions of what to do and who to call in an emergency - then something bolder would be required.</p>
      <p>If you want to take no chances, use Century Schoolbook.</p>
