      <p>Incidentally, my quip about Century Schoolbook reminded me of something... recently, but I can't remember where to find it again, in some specimen book or other, in addition to Century Expanded (and, presumably, some other members of the Century family, like Century or Century Roman itself, Century Oldstyle, Century Catalogue, and Century Schoolbook) there was an example of a typeface named Century Wide.</p>
      <p>I thought it might have been in one of the earlier ATF specimen books where the Century series appeared - or perhaps in something from Linotype when they licensed the trademark, but so far my search hasn't turned up what I thought I saw.</p>
      <p>Century Wide had much the same proportions as Century Schoolbook, not being a bit narrow like Century Expanded... but not Century Schoolbook's heavier weight, or serifs tending towards Clarendon.</p>
