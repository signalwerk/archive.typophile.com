      <p>I think the main problem here is that the Book version is way too thin for larger amounts of text (at what is usually understood by ‘text sizes’). Something between the ‘Book’ and the ‘Bold’ (probably closer to the Bold) could work.</p>
      <p>Edit:<br>
      Have a look at these two:<br>
      <a href="http://www.linotype.com/43186/barbedor-family.html" title="http://www.linotype.com/43186/barbedor-family.html">http://www.linotype.com/43186/barbedor-family.html</a><br>
      <a href="http://www.linotype.com/56467/alcuin-family.html" title="http://www.linotype.com/56467/alcuin-family.html">http://www.linotype.com/56467/alcuin-family.html</a></p>
      <p>(however, I wouldn’t recommend to use Barbedor on bright white paper – the darker, the better!)</p>
