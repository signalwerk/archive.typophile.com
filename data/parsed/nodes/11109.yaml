    html: "<p> I don't know why I thought of Blackadder, but this discussion reminded me of an interchange between Dr, Samuel Johnson (compiler of the first English dictionary) and George (IV) Prince Regent. <br> <br>Dr. Johnson has come to ask the royal for patronage of his dictionary... <br> <br>George: \"So, Dr. Johnson. Sit ye down. Now, this book of yours...tell me, what's it all about?\" <br> <br>Dr. Johnson: \"It is a book about the English language, sir.\" <br> <br>George: \"I see! And the hero's name is what?\" <br> <br>...later on in the discussion... <br> <br>Dr. Johnson: \"...No-one gets murdered, or married, or in a tricky situation over a pound note!\" <br> <br>George: \"Well, now, look, Dr. Johnson, I may be as thick as a whale omelette, but even *I* know a book's got to have a *plot*.\" <br> <br>Dr. Johnson: \"Not this one, sir. It is a book that tells you what English words *mean*.\" <br> <br>George: \"I *know* what English words mean -- I *speak* English! You must be a bit of a thicko.\" <br> <br>Anyhow - I know it's not exactly the right metaphor - but it seems to me like trying to define the essence of a letter is a little bit like a dog chasing it's own tail. <br>And maybe that's not the right comparison either.  <br>I guess there could be a reductionist, engineering specification for each letter, but how does that really help us? I'm not an anti-academic, but with all due respect the exercise seems like intellectual twaddle. In advance - sorry.  <br> <br>And yes, Blackadder was utterly anachronistic as the above scenario could never have happened. </p>"
    html_clean: "<p> I don't know why I thought of Blackadder, but this discussion reminded me of an interchange between Dr, Samuel Johnson (compiler of the first English dictionary) and George (IV) Prince Regent. <br> <br>Dr. Johnson has come to ask the royal for patronage of his dictionary... <br> <br>George: \"So, Dr. Johnson. Sit ye down. Now, this book of yours...tell me, what's it all about?\" <br> <br>Dr. Johnson: \"It is a book about the English language, sir.\" <br> <br>George: \"I see! And the hero's name is what?\" <br> <br>...later on in the discussion... <br> <br>Dr. Johnson: \"...No-one gets murdered, or married, or in a tricky situation over a pound note!\" <br> <br>George: \"Well, now, look, Dr. Johnson, I may be as thick as a whale omelette, but even *I* know a book's got to have a *plot*.\" <br> <br>Dr. Johnson: \"Not this one, sir. It is a book that tells you what English words *mean*.\" <br> <br>George: \"I *know* what English words mean -- I *speak* English! You must be a bit of a thicko.\" <br> <br>Anyhow - I know it's not exactly the right metaphor - but it seems to me like trying to define the essence of a letter is a little bit like a dog chasing it's own tail. <br>And maybe that's not the right comparison either.  <br>I guess there could be a reductionist, engineering specification for each letter, but how does that really help us? I'm not an anti-academic, but with all due respect the exercise seems like intellectual twaddle. In advance - sorry.  <br> <br>And yes, Blackadder was utterly anachronistic as the above scenario could never have happened. </p>"
