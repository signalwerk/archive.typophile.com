    html: "<p>&gt; I guess there could be a reductionist, engineering specification for each letter, but how does that really help us? <br> <br>Although \"reductionist\" is probably a good term here, I don't think we're on the same wavelength otherwise. I can't be sure about anybody else, but what I myself have in mind I think can be very useful for anybody interested in pushing the boundaries of type, as opposed to just churning out variations on the conventional theme - a senile theme. <br> <br>If we can define (not necessarily absolutely, but just as much as possible) for a given writing system what makes each of its characters decipherable (note: in the context of the whole), and more importantly (at least for a text face) what makes each character contribute to the decipherability of boumas, then we've created some firm ground to walk on: we can push the structure -and subsequently the finish- of each character to the limit (not that this limit is static, though). This approach is the main guidepost of my Alphabet Reform efforts. <br> <br>Let me try to give a quick, specific example: <br>As much as I like Tarzana* overall, its UC \"Q\" is flawed, because the tail seems part of the left curve, instead of being independent. By ignoring the acrocracy of the tail of the \"Q\", Licko pushed too far, or more accurately, in the wrong direction. <br> <br>* <a href=\"http://www.emigre.com/dp/getfontpage.php?PTarNR.html\" target=\"_top\">http://www.emigre.com/dp/getfontpage.php?PTarNR.html</a> <br> <br>The foundation for creating good fonts is the understanding of each character's functionalities, and in terms of the act of reading, the essences of the characters play the central role. <br> <br>hhp</p>"
