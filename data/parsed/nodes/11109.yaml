    html: "<p>This is not a great topic. This is *THE* topic. <br>To me it's really the foundation of typography. <br> <br>I've thought about this myself for a while, and it's actually part of what motivated my Alphabet Reform work. One thing to not lose sight of here is that writing and reading are separate things, especially these days when we read typeset text almost exclusively. For example, David's example of the \"D\" is actually very telling! It's a very ambiguous letter, not least because efficient writing makes its corners softer, as a result making *reading* harder; look at the \"D\" in OCR-B for an effort to counter this ambiguity*. BTW, amazing but true: many Japanese people actually put a crossbar on the stem of the \"D\" when writing in English, specifically to disambiguate it! And I can bring many other examples of how writing has reduced readability. <br> <br>* http://www.myfonts.com/CharacterInStyle0044-62668.html <br> <br>Familiarity is one of the two foundations of reading. But it's just as misunderstood (or actually, just as ignored) as the other foundation: human physiology. It doesn't matter how familiar you are with the UC \"I\", lc \"el\" and numeral \"1\", they're *still* unnecessarily ambiguous. And it's not just a matter of the type design making them less ambiguous - they have a *structural* problem. On top of all this, there's the fact that we [generally] read boumas (word shapes) as opposed to individual letters. <br> <br>\"Essence\" is a great word to use, even though it might erroneously convey that the letters have a static nature. The truth is, the essence of a letter is different for each one of us, depending on our personal realities, and it even changes over time! The main thing to realize about the essence is that it depends on what's been called \"acrocratic\" features, or features that stand out and differentiate each character. For example, the UC \"Q\"'s acrocratic feature is its tail. When a letter has weak acrocracy (like the \"P\", specifically with respect to the \"B\" and \"R\") then it's less decipherable. <br> <br>The issues of gender is another *very* interesting topic (at least to me) - although I'm not sure how deep its relevance is in decipherment/reading. <br> <br>BTW, here's a shameless plug: <br>I've tried to deal with these issues in some depth in my article (called \"Improving the Tool\") in a recent book called Graphic Design &amp; Reading, edited by Gunnar Swanson: <br> <br><a href=\"http://gunnarswanson.com/GDandR/GDandR_Book.html\" target=\"_top\">http://gunnarswanson.com/GDandR/GDandR_Book.html</a> <br> <br>hhp</p>"
