    html: '<p> Wow -- what a great topic! <br> <br>I remember the point of realization when I was very young, noticing that a typeset double-storeyed lc "a" and "g" looked quite different from the handwritten single-storeyed "a" and "g" that I had been taught to write in school. Further, I could recognize either instantly as the letters they represented. This realization might have been a sign of the first inklings of my developing love of type. <br> <br>To answer the question, the "Emigré" standard of familiarity ("We read best what we read most") seems too simplistic, but I suspect it holds part of the answer, in any case. <br> <br>Consider the old-style "long s" (which gave way to the "ß" [eszett] ligature): In colonial America, Europe (and still much of the modern world, particularly readers of German), it was recognized easily as an "s", as in "WHEN in the Cour?e of human Events</p>'
