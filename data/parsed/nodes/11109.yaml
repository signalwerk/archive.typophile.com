the answer. If that were the whole answer, I suspect that our alphabet might have shed all of its counters centuries ago, relying instead only on outlines of words. Or, perhaps, individual letter glyphs might have been dropped long before typwriters or even typesetting made them a now-necessary staple, and we would have instead evolved toward a system not unlike Chinese or Japanese pictoglyphs. But of course we haven't, and we manage to recognize varied forms of the same intended letter glyphs just fine, thank you very much. Spiral's question is, if I read her question correctly: why? </p>"
