    html: "<p> As much as I agree with and admire Hrant's arguments on the subject of readability (and I think Hrant would agree with this), I'm pretty sure that readability is only a part of the equation. <br> <br>Similarly, Martin's analogy from Black Adder (which I also love <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) is flawed for almost the same reason. George's problem was in his definition of \"book\". A book CAN be a narrative, with a hero, plot, conflict, etc., but that is not the ENTIRE definition of the word book. A book can also be a book of reference (as a dictionary), a book of stamps or even a bankbook. <br> <br>Similarly, readability is not the only element of typography or design. It is an important element in many (perhaps even most) contexts, but it is not the only consideration -- and may not even be the most important consideration. <br> <br>If we learned anything from the grunge and deconstructionist experiments of the '80s and '90s, it is that very good typography, design and letterforms can be not very readable at all -- and still be considered \"good\" or successful solutions. It all depends upon the context and even more, on the design problems that are to be addressed. <br> <br>The point of my previous post is that MANY things influenced the letterforms we have today: language, phonics, iconography/symbology, tools of writing, writing surface, community education, vernacular, popularity/familiarity, printing technology, style, experimentation, and yes, readability. I have probably left a few out of my list as well. <br> <br>We may be getting a bit off-topic, however; as I interpreted Spiral's original question, it was \"What is the essence of a letterform?\" In other words, why do we recognize an 'a' as that letter, and not as a stunted \"d\" or \"q\", for example? <br> <br>I think Hrant is on to something when he mentions boumas (the gestalt of word contours), but again, I think that is only part of the answer. If that were the whole answer, I suspect that our alphabet might have shed all of its counters centuries ago, relying instead only on outlines of words. Or, perhaps, individual letter glyphs might have been dropped long before typwriters or even typesetting made them a now-necessary staple, and we would have instead evolved toward a system not unlike Chinese or Japanese pictoglyphs. But of course we haven't, and we manage to recognize varied forms of the same intended letter glyphs just fine, thank you very much. Spiral's question is, if I read her question correctly: why? </p>"
