    html: "<p> &gt; readability is only a part of the equation. <br> <br>Well, yes, I do agree. And I don't think the essence of a letter is restricted to some dry skeleton that one might be tempted to draw. For one thing, I might expound on what Phil wrote and say that many letters might have actual physical associations (noting that humans *are* physical beings who live in Nature, after all) - and these associations tie in to the essence. But how much of that pertains directly to decipherment, a very low-level function of the human mind? I think some of it does, but it's very hard to grasp things buried so deeply. Not to mention this bummer of a philosophical truth: \"A system can never understand itself.\" <br> <br>BTW, Alfred Kallir has a book called \"Sign and Design\" where he explains how the Latin alphabet as a whole and each letter in particular are derived directly from our psychosexual reality! He refutes the classic \"A = Ox\" bullshit (pun intended :-), and although his premise might sound far-fetched, many of the points he makes have the unmistakable smell of truth to them. <br> <br>In focusing on readability I was trying address one -important- aspect Spiral's question, and to me it's important because it's possible to improve the Latin alphabet (or any other writing system), *if* you first understand how the thing really works! <br> <br>&gt; If [boumas] were the whole answer, I suspect that our alphabet might have shed all of its counters centuries ago, relying instead only on outlines of words. Or, perhaps, .... <br> <br>Well, just because these things didn't happen doesn't mean that they *shouldn't* have, and it also doesn't mean such things shouldn't happen in the *future*. Social inertia is always a thing to consider, and very often to fight against. <br> <br>&gt; we manage to recognize varied forms of the same intended letter glyphs just fine <br> <br>In the same way that I managed to live out my adolescence in Beirut with electrical current only about half the time?  :-) <br> <br>The deeper functionalities of writing are hidden from casual observation - and this is directly related to the difference between legibility and readability. Furthermore, the reason change is slow/difficult is largely because it's hard to convince people something needs improving when that thing is virtually invisible. <br> <br>&gt; Spiral's question is, if I read her question correctly: why?  <br> <br>I think you lost me. <br> <br>hhp </p>"
