    html: <p> yeah, sickle. Had it in the back of my head (well... then I would be dead.) <br>It does read as Politikat, already stated that in the first post... And I hate Garfield, so maybe I should just change it <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>The Naziness is indeed intended. I wanted a political design that was strong and controversial, and the swastika flag design suited it really well. I'm definitly not a nazist, so that's not the reason. I have always thought of this typeface as a "dictatorship styled" one, pick anyone you "like", cuba, russia, germany - they all have great graphic design (especially communist russia and nazi germany) <br>and that's what I'm mimicking.  <br> <br>As for Kevin's suggestion, I'm (as previously stated) staying away from bitmapped stuff. It would be unworkable on my computer. (If I had a choice I would make it in Illustrator and run it over in Painter with some clonebrushes, it does wonders) </p>
