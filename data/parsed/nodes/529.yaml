    votes: null
    html: "<p>Ok, thanks for the criticism. The K seems odd because it's mirrored, it was a last minute design decision (which indeed might be changed) because I wanted to have the cyrillic influence more apparent. It's not in the original typeface though, so it might seem odd.  <br> <br>As for the @, I wanted to have a connection to the flag, I thought of the @ symbol as the the \"party symbol\"... Like a swastika or the hammer &amp; the I don't know what the other is called... cutter? (erm...)I can agree that it's a bit over the top though, I might remove it. <br> <br>This was in fact semi traced from a photograph,  <br>even though I didn't use streamline... (can't trust that damn program...) And I was after this look: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1256.jpg\" alt=\"soviet\"> <br> <br>There's slightly more shading to it, something that the above miss, but still, I think it's fairly decent.  <br> <br>One thing I see in the original portrait is that it's a bit more \"angular\" or choppy if you like. As for the use of a b&amp;w photo with high grain, yes, that would be nice, but it would kill my computer.  <br> <br>This is going to be printed at a huge size, about 2,5 - 3 meters wide (and then there's the typeface below...), so anything but native illustrator curves are out of the game. <br> <br>Also, the type will be applied (where there's alot of white space) if it doesn't look cluttered, with mock up revolutionary political messages. Sort of like the soviet poster. <br> <br>One thing I've noticed in most russian propaganda is the strong diagonals and 45 degree rotated text... I'll try that. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Thanx again.</p>"
