    date: 2002-05-01T05:38:00
    votes: null
    html: <p>Yes... As the precursor to the Nazi Party, Hitler joined the right-wing Deutsche Arbeiterpartei (DAP) in 1919. The party espoused national pride, militarism, a commitment to the Volk, and a racially "pure" Germany. He later gained leadership and changed the name of the party to the National Socialist German Workers' Party, called for short, the Nazi Party (or NSDAP. Maybe not your everyday definition of a socialist party, but still...a worker's party. <br> <br>As for fraktur typefaces and "ghetto"-culture... It's damn interesting. I want to know more.</p>
