    html: <p> This is irrelevant, but the Nazis considered themselves socialists, so they might be considered akin to communists -- it's not like Joe Stalin didn't happy utilize many of Hitler's methods against his own people. Although I think everyone would rather be considered the Nazis diametrical opposite. <br> <br>Another good story about fraktur typefaces is their appropriation by ghetto (especially Latino) culture! There is a jacked-up Prelude outside my apartment that says CHI-TOWN in blackletter on its side. The rapper Tupac had THUG LIFE tattooed in blackletter on his belly. <br> <br>(Sorry for the segue, Richard) </p>
