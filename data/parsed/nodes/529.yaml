    date: 2002-05-01T10:20:00
    votes: null
    html: <p> John, you must be somewhere in my region... Southern California? blackletter has been huge with the rather troublesome Latino gang culture down here for over a decade (I'm not sure when the trend began).  <br> <br>one of the more mainstream evidences of this is all of the LA Raiders (football team) paraphenalia floating around with blackletter type. this stuff was almost a marker for gang activity when I was growing up. in fact, numerous schools in the LA region banned Raiders clothing on campus because of the problems surrounding the hordes wearing the stuff. I'm not sure how the Raiders logo came to use blackletter as it has virtually nothing to do with Los Angeles -- but it sold some serious volume! </p>
