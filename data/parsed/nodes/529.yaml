    html: <p> John, <br>Although I personally don't appreciate your political jab about Palestinians (I grew up as a Christian in the Lebanese civil war, so please trust me when I say that the situation is much more complex than anybody west of Athens can easily comprehend), I do remember your participation during the Q&amp;A in Leipzig very well, and thought you were right on (along with GMM), and I'm glad to see there are others who thought YSS view was way too negative (in spite of her superb presentation and great erudition). <br> <br>The shapes are the shapes, and as much as it's our duty to learn from the past, it's also our duty not to let it ruin our future. <br> <br>More blackletter, yes! <br> <br>hhp </p>
