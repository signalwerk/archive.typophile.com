    html: <p> Why would I care what hitler wanted? I'm not sure he would want a black person as the leader of the party either... so, again, it's supposed to be a mockup political poster with inspiration from both right and left.  <br> <br>A side note, I've heard Hitler had a such a love for fraktur (don't know in english... sorry) typefaces that he forbid the use of anything else in official german propaganda, this might be bollocks, but it is sure interesting from a readability view. <br> <br>as for the @, congratulations Tiffany, you get to be the final voice for the removal... I'm doing it as I type. <br> <br>Thanks again. </p>
