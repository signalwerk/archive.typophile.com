    html: <p>Wow -- very <a href="http://www.obeygiant.com" target="_top">Shepherd Fairey</a>. <br> <br>My personal opinion is that a little cyrillic influence goes a long way. For instance, is the backwards "K" necessary? The font already looks very soviet. <br> <br>The problem for me in using the portrait is that it doesn't really look like Russian propaganda art. It looks like a photo that someone hit with Adobe Streamline. <br> <br>One thing the Constructivists did (Klutsis and El Lissitsky come to mind right now) was add design elements to photographs. That might be another angle -- have an illustrated background with the typography, but smack a B&amp;W photo -- the granier the better -- in place of the illustration.</p>
