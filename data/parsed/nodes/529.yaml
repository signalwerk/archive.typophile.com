    date_raw: 2 May 2002 — 8:36am
    date: 2002-05-02T08:36:00
    votes: null
    html: "<p>Below is basically how I remember it from the Peter Bain, Paul Shaw book on Blackletter. Although this word \"Kurrent\" isn't familiar. <br> <br><a href=\"http://www.germanscript.com/history.htm\" target=\"_top\">http://www.germanscript.com/history.htm</a> <br> <br>\"Why the German script disappeared: After the <br>turn of the century, Kurrent, much like its <br>printed counterpart Fraktur, declined in <br>popularity. As German society became more <br>cosmopolitan, the national style of writing was <br>viewed as antiquated and ugly. Consequently, the <br>humanist Antiqua, both in its printed and written <br>form became more and more fashionable. This, of <br>course, changed with the rise of the Third Reich. <br>Antiqua and Latin script were declared <br>\"Un-German\" and \"non-Aryan\". Only the Fraktur and <br>Gothic typefaces were to be considered \"German\". <br>The result of this policy was that during the <br>following eight years many perverted forms of <br>Gothic and Fraktur were designed, some of them <br>contemptuously known as \"Schaftstiefel Grotesk\".</p>"
  - id: 3917
    user_id: 851
    user_name: johnbutler
    user_path: null
    date_raw: 8 May 2002 — 11:14pm
    date: 2002-05-08T23:14:00
    votes: null
    html: <p>I attended that discussion in Leipzig, and will repeat my comments here, because I feel it is very important. <br> <br>It is wrong to let some pathological subculture or political movement appropriate a style of lettering that developed over centuries. The fact that Christian Death or Storm Front choose to enlist someone else's hard work (e,g. a type design) in the service of their own cause or beliefs should not soil the type itself, especially when the original designer died over a century ago!! Yvonne Schwemer-Scheddin's analysis as it appeared in the Bain/Shaw monograph, while a good compendium of illustrations, is in my opinion way off. Those designs should be celebrated and judged on their aesthetic and technical merit and not on what some 25-year-old bigot in an Oi band still living with his parents does with them. The increasingly neurotic impulse to suppress "dangerous ideas" so common in Germany today serves only to give those ideas more power. <br> <br>People speak of a "Nazi aesthetic." THERE IS NO NAZI AESTHETIC. They plundered the aesthetic of the times just the same as they plundered Jewish property. To insist any differently is to give them credit they never deserved. <br> <br>There are, however, a number of "Constructivist"-looking textura-grotesk hybrids that were inspired heavily by the aesthetics of the early Nazi and pre-Nazi era, mainly Tannenberg and Element, and whose advertisements leveraged the prevailing Nazi sentiment of the times, appropriately labeled "Schaftstiefelgrotesk." They are used today mainly for satirical purposes when someone wants to paint someone else as a Nazi (enter Godwin's Law.) And yet, all the anti-Nazi paranoia in Europe isn't enough to stop the EU giving money to The Amazing Exploding Palestinians in their effort to once again "protect" the world from <i>der ewige Jude</i>. Full circle in just sixty years. <br> <br>You can get the black weight of Tannenberg from Dieter Steffmann's site www.steffmann.de for free, and you can buy the lighter and bold weights from www.fraktur.com, Delbanco Frakturschriften. Again, I presume any use would be for sharply critical/satirical purposes. <br> <br>The best selection of blackletters available in one place is Dipl.-Ing. Gerhard Helzel's site www.romana-hamburg.de. In addition to his impressively cerebral list of hobbies (Latin, oil painting, electrical engineering, and writing erotic novellas) he offers over 300 digitized blackletters for sale, many unavailable elsewhere, with lots of ligatures and alternates including the important but oft-forgotten half-r. He puts a ch ligature in the c slot, so have your FontLab handy if you choose to buy. <br> <br>Another source is FVL GbR, www.fraktur.de, from whom I recently bought the narrow alternates from Koch's Wilhelm Klingspor-Schrift and a few others. The exact relationships between these companies and the large foundries like Linotype and Berthold are not always clear, but from conversations that I've had with the one larger foundry, they're not that interested in reviving more old blackletters, because they simply don't sell enough to justify the investment required to digitize them, so these companies are generally not a concern to them, and in some cases they have reached an understanding. I hope to get a better handle on just who is and who isn't considered a pirate in these four cases, since there are some overlaps with commercial fonts on the glyph level if not on the font level. <br> <br>On my own site, I have a growing directory of commercial blackletter designs offered by several foundries, large and small. Visit <br> <br>http://eccentrifuge.com/Fonts/blackletter.html <br> <br>The page will get a formatting upgrade in the next month or so. Anyone here with a commercial blackletter design who wants to be listed can mail me at john@eccentrifuge.com. The point of the site is to introduce font consumers to the lesser-known blackletter designs out there. Opinions are appreciated. <br> <br>Finally, in regard to your design, my impression is that you disapprove of (pardon my ignorance) whatever group it is that you're depicting. If that's your intent, than the execution is flawless.</p>
