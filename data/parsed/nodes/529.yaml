  html: <p>Hello, a while ago I posted a typeface for critique in the display section, it was named Bastian Gothic Condensed http://www.typophile.com/forums/messages/29/868.html?1015663740 <br> <br>Anyway, I've been asked to display this typeface at a museum during an exhibition (strange indeed)along with an illustration and I decided to rename the typeface... I thought it looked sort of political in a 30's kind of way, communist or nazist/facist typeface, and I worked from that. <br> <br>This is what I have got currently (I'm still working on it, this is just the illustration and the name of the typeface as you can see), and I'm wondering if I might get away spelling "politikal" like that, not entirely correct, but then there's a connection with the "party symbol" and the typeface name... even though politikat sounds strange <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br><img src="http://www.typophile.com/forums/messages/29/1254.gif" alt="politikal"> <br> <br>Any suggestions/criticism welcome, also on the illustration. I was going for the look of russian propaganda posters.</p>
