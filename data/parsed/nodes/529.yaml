    votes: null
    html: "<p>I'm reading it the same as the others:  POLITIKAT  <br>why not just have it be POLITIK and use the symbol  <br>as you have intended. It seems a bit redundant to  <br>have it twice in the same space. <br> <br>Another concern is the appropriateness of the appropriation.  <br>Hummm... Does that make sense? I highly doubt  <br>the German Nazi party would want (would have  <br>wanted) to be bundled together with the Russian <br>Constructivists or the Italian Futurists. If I remember <br>correctly they may have seemed to have similar goals, but <br>weren't their <br>goals as political parties intrinsically much <br>more divergent? (Sorry off-topic) I think the <br>idea of a photo is great, if only to avoid <br>mimicing too closely the other poster shown. <br> <br>Maybe this article is off-topic as well. Oh well, <br>I do that all the time. \"Design and <br>Appropriation: The Transformation Of Meaning in a <br>Global Market\" by Enid Schildkrout: <br> <br><a href=\"http://www.idca.org/2000/essaysE2000.html\" target=\"_top\">http://www.idca.org/2000/essaysE2000.html</a> <br> <br>I've typed this. It might be wrong. But I'll send it anyway. <br> <br>perhaps, with the fat boiled off, i'm simply agreeing <br>with Joe.</p>"
