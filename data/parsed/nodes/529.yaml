    html: "<p>&gt; appropriation by ghetto (especially Latino) culture! <br> <br>Yup. And actually by some straight-laced designers in Mexico City even! At the ATypI Leipzig conference, during a panel discussion about the future of fraktur, Gabriel Martinez Meave* indicated his bewilderment at the social (read: anti-social) baggage that germans ascribe to fraktur by saying something to the effect of: \"Hey, we do a lot of blackletter lettering in Mexico, and we don't even know where it comes from, we just like the way it looks.\" <br> <br>* A fantastic designer, BTW: <br>  <a href=\"http://www.myfonts.com/Person886.html\" target=\"_top\">http://www.myfonts.com/Person886.html</a> <br> <br>hhp</p>"
