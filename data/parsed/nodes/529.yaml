    html: <p> Another thing... the bit about Hitler not reading Antiqua is incorrect. It was actually Bismarck who said that, one war prior. "Deutsche Bücher in Antiquaschriften lese ich nicht," I believe is how it went. The Nazis killed blackletter. If we're to be consistent, we should not associate Nazis with blackletter but rather with its absence. More blackletter, please. </p>
