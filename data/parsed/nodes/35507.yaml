      <p>Seattle has a good public transit system, too.  There are regular buses from the airport to downtown.  Here's Google Transit's view of it:</p>
      <p>    <a href="http://www.google.com/transit?ie=UTF8&amp;f=d&amp;saddr=sea&amp;daddr=1113+6th+Ave,+seattle&amp;ttype=dep&amp;date=7%2F31&amp;time=1:18pm&amp;z=11&amp;om=1" title="http://www.google.com/transit?ie=UTF8&amp;f=d&amp;saddr=sea&amp;daddr=1113+6th+Ave,+seattle&amp;ttype=dep&amp;date=7%2F31&amp;time=1:18pm&amp;z=11&amp;om=1">http://www.google.com/transit?ie=UTF8&amp;f=d&amp;saddr=sea&amp;daddr=1113+6th+Ave,+...</a></p>
