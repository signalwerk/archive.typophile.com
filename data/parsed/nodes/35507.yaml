      <p><cite>Seattle has a good public transit system, too</cite><br>
      I just about choked on my mocha. Have you ever used Seattle's public transport?</p>
      <p>In any case, I work at a hotel downtown. Here are your options:</p>
      <p>Metro bus: As above. You get to ride next to the hobos, and the drivers have little patience for lots of luggage.</p>
      <p>Greyline bus: It's basically a charter bus that stops at various locations. </p>
      <p>Misc. Shuttles: There are 2 dozen handfuls of different companies. They're all the same, and they're all mediocre.</p>
      <p>Taxi: Screw those guys.</p>
      <p>Towncar: My preferred method. We can arrange to have a car meet you, drive you downtown, and you won't have to put up with a lot of baloney from the driver. If you call your hotel, or preferably me since they pay commission, we can get anything from a limo to a suburban to a minivan to a towncar to ride you into town in style.</p>
      <p>I have my preference, but the greyline/shuttle services work fine. Not very comfortable, and slower than molasses, but they'll get you there eventually and they're almost decently priced. </p>
      <p>The towncars are fast and comfortable, and cost less than a cab because they're a flat rate, not on the meter.</p>
    html_clean: |-
