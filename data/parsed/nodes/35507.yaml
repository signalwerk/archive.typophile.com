    html: |-
      <p>The 194 is pretty speedy half an hour and cheap (maybe $2.50). Schedule is here... <a href="http://transit.metrokc.gov/tops/bus/schedules/s194_0_.html" title="http://transit.metrokc.gov/tops/bus/schedules/s194_0_.html">http://transit.metrokc.gov/tops/bus/schedules/s194_0_.html</a> </p>
      <p>The 4th and University stop sounds like the closest to the hotel. Head up hill a few blocks and then north to get to the hotel.</p>
      <p>The 194 doesn't really accomodate people with lots of bags or a huge suitcase (say one full of Froggy flyers). If you have either of these you might want to sit towards the back where you can find room to stash your gear. </p>
      <p>My guess is the gray shuttle maybe athe Grey-line bus that serves downtown airports. </p>
      <p>Cheers, Si</p>
