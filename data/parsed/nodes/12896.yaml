      <p>If you are designing an old style typeface, it depends on what your intent is and what applications the face is more suitable for.</p>
      <p>If the design is primarily for book publication and lengthy text, you might try a more traditional approach. It always helps to do a little research on how some of the best type designers resolved the same problem.</p>
      <p>For traditional book face examples, review these famous versions of Garamond:</p>
      <p>Stempel Garamond™ from Linotype<br>
      <a href="http://www.linotype.com/1500/stempelgaramond-family.html" title="http://www.linotype.com/1500/stempelgaramond-family.html">http://www.linotype.com/1500/stempelgaramond-family.html</a><br>
      Please make sure to read the descriptive text below the samples as it illustrates how many source specimens and how many iterations a design can go through.</p>
      <p>Berthold Garamond<br>
      <a href="http://www.bertholdtypes.com/bq_library/90076.html" title="http://www.bertholdtypes.com/bq_library/90076.html">http://www.bertholdtypes.com/bq_library/90076.html</a><br>
      If you want to review the full character complement and text samples, download the Old Style pdf samples from their home page: <a href="http://www.bertholdtypes.com/home.html" title="http://www.bertholdtypes.com/home.html">http://www.bertholdtypes.com/home.html</a></p>
      <p>These specimens will clearly illustrate how the italic cuts can differ and how the character shapes and widths complement the roman.</p>
      <p>If you are taking a more contemporay approach and feel your design is better suited for advertising, brochures, medium to short text applications, try looking at ITC Garamond.</p>
      <p>ITC Garamond (from Linotype)<br>
      <a href="http://www.linotype.com/664/itcgaramond-family.html" title="http://www.linotype.com/664/itcgaramond-family.html">http://www.linotype.com/664/itcgaramond-family.html</a><br>
      Again, read the descriptive material below the samples. It illustrates how intended use will greatly affect your design decisions.</p>
      <p>Of course the final decision on how to approach the italics is up to you. You may be able to take a more innovative approach and perhaps give the type world something fresh and exciting.<br>
      Good luck.</p>
      <p>Yes, I’m old, but I’m back in style!</p>
