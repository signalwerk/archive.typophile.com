      <p>Actually, there are no general rules for roman and italic.<br>
      Many historic typefaces had no italics and either italics created later or the roman was matched with an existing italic.</p>
      <p>The general trend for the last fifty years is to design a complementary italic for each roman weight.</p>
      <p>If your design is a true text type, then you have some options based on the nature of the design. You neglected to mention a type classification for our reference.</p>
      <p>Sometimes the italic weights can rival the roman version. I always felt Matthew Carter’s ITC Galliard italics were truly outstanding.</p>
      <p>Just some thoughts to ponder.</p>
      <p>Yes, I’m old, but I’m back in style!</p>
