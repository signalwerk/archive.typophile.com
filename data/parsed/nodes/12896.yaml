      <p>It also depends on whether you wish your face to be informed by writing and typographic tradition or just a variant to be used for emphasis. In this situation, you can theoretically invent anything you want, provided it has visual consistence with the “Roman”.<br>
      This could go for any language’s Script, I think, as long as you are willing to experiment instead of applying common rules.</p>
      <p>If you are interested in serious text type, just post a sample and follow David Berlow’s advice. Don’t lose the opportunity.</p>
