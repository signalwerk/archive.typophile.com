  html: |-
    <p>Maxim Zhukov posted this New York Times story on ATypI.<br>
    <a href="http://www.enneson.com/public_downloads/pe/typophile/armenians_celebarate.html">www.enneson.com/public_downloads/pe/typophile/armenians_celebarate.html</a></p>
    <p>There are several interesting remarks about the history and characteristic of the armenian script. In relation to one of them Maxim remarked: “I am not sure of that ‘Eastern letters horizontal / Western letters vertical’ bit, though.” This remark relates I guess to the thread here about cartesian space, as well as some of the diiscussion in the bouma as bounded map thread.</p><div class="imageWrap"><img src="system/files?file="></div><p></p>
