  html: |-
    <p>Interesting that the London Passenger Transport Board once used the typeface Kabel for its informational material. Later on Edward Johnston created the Railway Underground typeface with its diamond shaped i-dots. Did Johnston intend to refer to Kabel, not only by the dot, but also to the geometric approach of Kabel or is that pure coincidence?<br>
    See: <a href="http://www.creativereview.co.uk/cr-blog/2013/february/logo-that-almost-killed-roundel" title="http://www.creativereview.co.uk/cr-blog/2013/february/logo-that-almost-killed-roundel">http://www.creativereview.co.uk/cr-blog/2013/february/logo-that-almost-k...</a></p>
