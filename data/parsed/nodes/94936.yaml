      <p>Hey: all I know is, when I get to bifurcating too much, the neighbors call the cops.</p>
      <p>Also, hey: what you got so far looks good but, if it only works at 256 point, you are not going to get a lot of sales. Which, of course, is only important if eating on a regular basis is important. You gotta prioritize.</p>
      <p>Take the same approach and make it work at 72pt, and you got a sure winner…which, in my experience, is a hell of a lot better than a sure loser. But, that's just me…</p>
