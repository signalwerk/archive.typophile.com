    <p>Hello All<br>
    I've been designing a Mono-line Tuscan version of Aldine Expanded.<br>
    <a href="http://www.flickr.com/photos/14402206@N08/7618824462/" title="1 by jmiramon2002, on Flickr" rel="nofollow"><img src="http://farm9.staticflickr.com/8015/7618824462_9c8a7836f9.jpg" width="500" height="169" alt="1"></a><br>
    Here is the link to a larger image:<br>
    <a href="http://www.flickr.com/photos/14402206@N08/7618824462/in/photostream/lightbox/" title="http://www.flickr.com/photos/14402206@N08/7618824462/in/photostream/lightbox/">http://www.flickr.com/photos/14402206@N08/7618824462/in/photostream/ligh...</a></p>
    <p> I've done my drawings and I've run into some technical hurdles beyond my knowledge. If I can guess correctly, I have some horrible hinting nightmares ahead of me. I want to believe I don't.  The image below is what it looks like at post script  size 72 pt.<br>
    <a href="http://www.flickr.com/photos/14402206@N08/7618824426/" title="Screen shot 2012-07-21 at 8.12.39 PM by jmiramon2002, on Flickr" rel="nofollow"><img src="http://farm8.staticflickr.com/7127/7618824426_85df19e9e5_z.jpg" width="559" height="144" alt="Screen shot 2012-07-21 at 8.12.39 PM"></a></p>
    <p>Here is the same font seen through the preview panel of Fontlab.<br>
    <a href="http://www.flickr.com/photos/14402206@N08/7618824370/" title="Screen shot 2012-07-21 at 8.18.55 PM by jmiramon2002, on Flickr" rel="nofollow"><img src="http://farm9.staticflickr.com/8014/7618824370_47243bab93.jpg" width="284" height="109" alt="Screen shot 2012-07-21 at 8.18.55 PM"></a></p>
    <p>This is what shows up when you access the hinting window.<br>
    <a href="http://www.flickr.com/photos/14402206@N08/7618824568/" title="Screen shot 2012-07-21 at 8.21.20 PM by jmiramon2002, on Flickr" rel="nofollow"><img src="http://farm9.staticflickr.com/8288/7618824568_91b41bed52.jpg" width="500" height="319" alt="Screen shot 2012-07-21 at 8.21.20 PM"></a></p>
    <p>Is this a matter of using the dark arts of font hinting? Thank you for your help. Also, does there exist literature on hinting?</p>
    <p>A handshake in thought.</p>
