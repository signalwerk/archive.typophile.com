      <p>I strongly suspect that you’ll have great difficulty finding any inkjet printer that can handle art/handmade paper (though probably easier than finding a laser printer to do the same). IF you could find one, you’d find that the absorbency characteristics of art/handmade paper would be truly awful for inkjet printing - the bleed would be just enormous.</p>
