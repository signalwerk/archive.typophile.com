    <p>I make handmade books. I make the paper and do all the binding by hand. I do not do this professionally, and I have figured out ways around investing in expensive equipment to letter the spines. I need advice on purchasing an inkjet printer so I can print, mostly text and line illustrations, on my handmade paper. I will be printing PDF files, so as I understand it, crisp text will not be a problem with higher-resolution (1200 dpi) printers. I don’t want to use a laser printer because ink lasts longer.</p>
    <p>Here are my requirements:</p>
    <p>1200 dpi or higher<br>
    Reasonably high-quality text<br>
    Decent speed (1 or 2 pages a minute is fine)<br>
    Prints on custom paper sizes up to 11x17 (or 12x18)<br>
    Prints on art/handmade paper<br>
    Prints 4-color, though I will mostly be printing black or brown text, and some secondary colors (like red or green)<br>
    Costs under $500 (but will spend more if someone thinks it is necessary or worth it to do so)</p>
    <p>Thanks for any advice you can give!</p>
