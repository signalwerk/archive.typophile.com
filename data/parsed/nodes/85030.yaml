      <p>Makes me a happy panda :)</p>
      <p>Now I'm wondering about serifs. Initial idea was to have them only inwards, like /A/.<br>
      But then all the other thick stem letters looked boring /E H I L M etc./ So I gave them "proper" serifs.<br>
      And now /U/ falls out. But if I add serifs at the thick top (like /I/), it will be closed and less legible.<br>
      On the other hand, I can pretend it comes from /V W Y/ group.</p>
    html_clean: |-
      <p>Makes me a happy panda :)</p>
