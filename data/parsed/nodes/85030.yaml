    <p>*** Images are from 1 version earlier. /T is now wider and /S straighter. ***</p>
    <p>Still haven't decided about title.<br>
    What started as quick, for-fun, only-caps font, is turning out to be a multilingual family of 2 weights that could be counted as 6 fonts. Because there are small caps, swashed style and alternates for both of them. That's even not counting ligatures (for Cyrillic too!).<br>
    Plus manual T1 hinting.</p>
    <p>Update 4 (2012/V/30)<br>
    pdf's:<br>
    <a href="http://cl.ly/H06i" title="http://cl.ly/H06i">http://cl.ly/H06i</a> (Light)<br>
    <a href="http://cl.ly/H03z" title="http://cl.ly/H03z">http://cl.ly/H03z</a> (Dark)</p>
