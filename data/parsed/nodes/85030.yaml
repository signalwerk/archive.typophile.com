    html: |-
      <p>This is progressing pretty nice!</p>
      <p>Have you considered making the /O/ and /Q/ in similar fashion as you are now doing with /B D, P/ and /R/? Asymmetrical that is? Im saying because I kinda agree with Bendy, there seem to be two systems in use within the font right now for using thin or thick strokes.</p>
      <p>The other option would be to use the thin strokes only as horizontals/bars and as serifs, and make everything else thick. So stick with the original /K/ (you could also add serifs on the right side ad you did with the new /K/) and alter /B, D/ etc? That said, the thick/thin contrast is probably what makes the latest version so interesting - so you might want to stick with the current route.</p>
      <p>Also, have you considered using a thin stroke for the tail of the /Q/ instead of a thick one?</p>
      <p>Love the /E/ and /K/ by the way, nicely shaped!</p>
