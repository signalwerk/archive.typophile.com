      <p>&gt; which logo is the best fit </p>
      <p>My opinion is that the eye symbol, although not very original (I've seen an eye used many times to represent graphic design), is more interesting and representational than a rectangle. Don't care for the way the eye reflections are drawn, though, or the squared-off left edge.</p>
      <p>But you should use your own judgement, your own style, and then listen to the feedback from your professor.</p>
