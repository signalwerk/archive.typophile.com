    <p>Hi, we got a brief to rebrand our graphic design course. We have to make a new logo for the course, as well as make an advertising campaign strategy to promote to new and current students, also make to make a brochure and radio ad.</p>
    <p>Can you guys choose which logo is the best fit for my campaign poster/brochure?, also any comments on improvements on them will be much appreciated.</p>
    <p>'Enmore brochure 2' is what goes on the back of the 'Enmore brochure'. The brochure is 3 fold.</p>
    <p>Oh and these attachments are very low quality, because my files were too big. The real color should be more red/pink instead of purple.</p>
    <p>background info on my course: <a href="http://www.sydneytafe.edu.au/enmore/dce/?page_id=35" title="http://www.sydneytafe.edu.au/enmore/dce/?page_id=35">http://www.sydneytafe.edu.au/enmore/dce/?page_id=35</a></p>
