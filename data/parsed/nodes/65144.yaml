      <p>@ flooce,</p>
      <p>I hadn't thought about that connection... It just helped me to make up my mind. I had tried Warnock before, there is a book by Hamid Dabashi "Iran, a people interrupted" which looked great on Warnock, but when printed I guess paper and printer I used (average laser + a4 paper) didn't make a good impression. My two other options, Minion and Sabon, though great, didn't look as sharp (if that's the proper typographical term). I was one in love with Sabon, but now it seems rather cozy, too "round", and Minion looks a bit "squared". By contrast, the "coldness" of the sharp and slim forms of Arno, perhaps due to the fact that it was based on handwriting (a mix of Brioso and Minion), somehow makes me remember swords or metalblades, which is great, specially my subject(s).</p>
