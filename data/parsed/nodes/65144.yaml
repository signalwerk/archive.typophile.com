    html: |-
      <p>Ok, I would like to change discussion a bit towards another direction. Thank you so much for your input here, I think I will look for a first typeface to buy, and since this is a special thing, especially with limited funds, I would be interested in your input.</p>
      <p>I read the "Choosing a font for book design?" thread, so I am aware of the fonts there.</p>
      <p>I would prefer a font which was created for the digital time already in mind... if that plays a role. Something classic looking, easy to ready, serif, but still somehow new, fresh and a bit warm. Serif of course.<br>
      I need a roman and a italic version, and it shouldn't be too expensive.<br>
      OpenType would be good, so I can use the Small Caps function of my Wordeditor program.<br>
      The font would be needed for longer texts, essays, PDFs (and this must be possible with the EULA - sorry MVB Verdigris), basically everything I would write and print or distribute otherwise. </p>
      <p>Are there any suggestions besides what I would consider so far, which is:</p>
      <li>Sabon – maybe a tad to traditional, but very homogeneous in appearance, my favorite Garamond.
      </li><li>Janson Text – looks good, but is it really well digitalized? After W and Y there are big gaps, aren't there?
      </li><li>Minon – Really like it, has the right mix of everything, though maybe a bit to narrow?
      </li><li>Andron – I like it more than Arno ;) :D Though maybe a tad to classic
      </li><li>Eudald News, Edita, Whitman, Farnham – Anybody any experience with it? How do they compare with Minon and Janson? Would be interested in all these rather new fonts.
      <p>Basically I guess I would be looking for something in between Minion and Janson, if that makes sense. I like about Minion that the letters seem all to match very nicely, everything flows into each other, the x-height is somehow right, but it looks a bit to dark maybe and to narrow.<br>
      Janson looks quite nice, somehow it is not a too far strech from Sabon for my eyes (don't know about their tradition), but less old-school. However I feel that with Janson Text the relationship of the space between the letters are not really perfect.</p>
      <p>I hope you see what I would be looking for?<br>
      And any experience with the latter four would be interesting to hear.</p>
      <p>thanks!</p>
      </li>
