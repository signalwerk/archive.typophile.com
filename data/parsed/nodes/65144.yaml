    <p>Hi everybody!</p>
    <p>I would need a font for my thesis, I don't need to use Times but the qualifications need to be: "similar" to Times: traditional serif, classic, high legibility.</p>
    <p>It is an social science thesis, but it deals with more technical climate issues as well, so it can't be too playful. Italics are a must. </p>
    <p>Built-in fonts on Mac OS X:<br>
    Baskerville, Hoefler Text, Palatino, Times (&amp;NR),  Georgia, Garamond (not as tall as Adobe Garamond or other cuts)</p>
    <p>Freeware fonts I like:<br>
    Bergamo. Day Roman (italics and bold then in Garamond), Lido, Efont Serif, Gentium, Calluna (+ paying for italics)<br>
    <a href="http://img132.imageshack.us/img132/4862/screenshot20091208at100.jpg" rel="nofollow"><br>
    <strong>Overview table</strong> for comparison, rendered by Mac PDF function (Quartz?)</a></p>
    <p>Out of the presented I think I <strong>Calluna</strong> most, but would it be suitable for a thesis?</p>
    <li>Which of these fonts provides the best balance between seriousness, legibility and a warmer touch? How does it work in a long printed text?
    </li><li> Do you think I should rule out a font with Old Style Figures? I will have a lot of quotes (Harvard System, 1984 p.999) within the text body. I prefer proportional Lining Figures.
    </li><li> Which sans (neo-grotestk or humansit) would go with the serif you suggest? I have the system fonts (Helvetica, Geneva, Gill Sans, Futura) and some free ones (Aller, Museo, DejaVu Sans, Quicksand, Fontin, Delicious, Segeo UI – MS Frutiger Copy).<br>
    .
    <p>I would love to use Sabon or Arno, but well... to expensive for me.</p>
    <p>I know this is a somehow tiring question, but I hope for your help anyhow. :)<br>
    Thank you very much for reading and commenting.</p>
    <p>Florian</p>
    </li>
