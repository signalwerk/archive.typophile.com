    html: <p>today, a few month later, I found out that there is such a thing as Apple Advanced Typography and Hoefler Text is one of the very few fonts supporting this feature. The only reason why I did not chose Hoefler Text was because of the old style figures it has as default. In Apple Pages one can though activate lining figures for Hoefler Text. So basically if I knew this earlier, I wouldn't need to go that much into the details of typography and different serifs. Well, I am more informed now. On the other hand writing a thesis with Apple Pages is not fun either.</p>
