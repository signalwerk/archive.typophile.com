      <p>Arno is only $35 per weight, Sabon even less. You don’t need the full family for a thesis. </p>
      <p>Old style figures are designed to be used with running text, lining figures are designed to be used with capitals. </p>
      <p>If you want to pair a sans serif with a serif I suggest having a look at <a href="http://typophile.com/node/32056?" rel="nofollow">this link</a>.</p>
