    html: |-
      <p>@ ycherem:<br>
      It is not really established in general knowledge how big the influence of the near&amp;middle east area was during the middle ages for Europe. In math to medicine to philosophy there was a lot of research and a rich culture of literature, while in Europe a lot of knowledge was not lost bot somehow sleeping and it was a lot due to this influence that Europe started off again. No wonder the Renaissance draws on the antique, because this was exactly the knowledge brought back from Byzantine to Europe.  </p>
      <p>@ Andres:<br>
      Sound like a good idea, let's see. </p>
      <p>Since you say for you as a type designer it is interesting what the type loving customers think I will tell my criteria in this special search. </p>
      <p>I was mostly comparing the overall look of the textbody and how easy it is to cut through the text. The individual shapes matter in so far, as they contribute to a round and harmonic image of the textbody and are in balance with the other ones and of course as well look somehow nice by themselves. But I didn't inspect any letter close up or anything.</p>
      <p>If anybody is interested in my totally amateurish thoughts on individual fonts:</p>
      <li> Minion: close to perfect, a bit to narrow, dense, and it could be a bit rounder, but I would like to have this font later. Great to read.
      </li><li> Sabon: Totally different from Minion, but as well almost perfect, coming form the other, the softer side. This font made me fall in love with type though and I think is one of the most beautiful fonts and the best Garamond. I am not sure if the spaces between letters is always balanced, maybe SabonNext is better here.
      </li><li> Andron: I think it is somehow between (rounder than) Minion and (less traditional maybe... than) Arno and I like it better than Arno. It is less dark, a bit milder, looks very nice and sophisticated, should definitely be a serious consideration. Maybe update the website or make a parallel international one, just focus on the font? I like the sites of <a href="http://www.josbuivenga.demon.nl/index.html" rel="nofollow">Jos</a> and <a href="http://www.type-together.com/index.php" rel="nofollow">type together</a> a lot. Maybe they are to "pop" for Andron, but I hope this font gains more recognition. A free roman font is a good thing. :)
      </li><li> Calluna: I like it a lot, it is sweet and modern, somehow a bit radical and still graceful. I think Jos Buivenga produces good typos like crazy ;)
      </li><li> I like as well Baskerville and Hoefler Text, but those coming with mac are for my purposes either to limited (I need OSF and LF) or are not the best cuts for body text, in my personal opinion. A closer look on Whitman and Eudald News might be interesting.<br>
      –––<br>
      Alright, so much about it. I an overview table might follow. :)
      </li>
