    html: |-
      <p>Ok, paypal was loaded and charged, so yes, I got my first font ;)</p>
      <p>I made two comparison tables, the first with a list of good serifs I have access too, and every student should be interested in, and the second one with the specimen of Arno from Adobe. </p>
      <p><a href="http://img64.imageshack.us/img64/6104/comparison2.jpg" rel="nofollow"><img src="http://img64.imageshack.us/img64/6104/comparison2.jpg"><strong>Baskerville, Cycles, Calluna, Times, Andron and Hoefler</strong></a></p>
      <p>Arno, Cycles and Andron in comparison. **edited out link**</p>
      <p>a complete Family for 69 $ or some 45€. Now this is a bargain every student should be able to afford ;)</p>
      <p>I have to say though it is impressive what both Calluna and Andron are able to do. Calluna is beautiful as well, not far away actually from Cycles. One thing I notice about Calluna is that the top curves of round small letters (a, b, c, e, g, h, m, n, o, p, r) is very similar and regular, which is even more obvious because of the "direction" Jos put there. This is not a good or bad thing, I don't know, I guess it has two effects: the image of the text becomes more homogenic, but maybe there is less for the eye to hold onto. I don't know, was just an interesting observation for me. Anyhow I think the comparison to Cycles shows that Calluna is a very high quality font. As the comparison Andron/Arno gives a similar results about Andron. </p>
      <p>At least for my unprofessional eye. ;)</p>
      <p>Congrats to the good designers here on the board. I am happy so far, hope others are interested in this thread. :)</p>
      <p>Flo</p>
