    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Latin</strong></p>
    <p>1. A language first spoken by the Latins in ancient Italy. Associated with the rise of the city of Rome and its later empire.</p>
    <p>2. A reference to peoples of Central and South America, their languages, and their cultures.</p>
    <p>3. A term for languages that use the <a href="/wiki/Roman%20Alphabet" class="freelinking" rel="nofollow">Roman Alphabet</a>.</p>
    <p>4. A style of <a href="/wiki/serif" class="freelinking" rel="nofollow">serif</a>, namely, ones of the triangular, pointed variety.</p>
