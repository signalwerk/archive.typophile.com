    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;:&nbsp;Latin</strong></p>
    <p>1. A language first spoken by the Latins in ancient Italy. Associated with the rise of the city of Rome and its later&nbsp;empire.</p>
    <p>2. A reference to peoples of Central and South America, their languages, and their&nbsp;cultures.</p>
    <p>3. A term for languages that use the <a href="/node/14499" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman Alphabet</a>.</p>
    <p>4. A style of <a href="/node/13702" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Serif</a>, namely, ones of the triangular, pointed&nbsp;variety.</p>
