    html: |-
      <p>I mentioned Ryoichi Tsunekawa's Design System A 700 in a previous post and suggested a recipe for using it's corners to make stovepipe elbows to approximate the letters.<br>
      Unfortunately the result is very approximate. The curves are too gradual and the weight is too light.<br>
      I created my own stovepipe elbows from scratch and constructed these letters and the rest of an alphabet based on my conjecture as to what I thought might work with this concept. I have no idea how the the designer of the Knopf cover would have made the rest of the alphabet. So here is a Tsar Poutine alphabet in use<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/TTSS_SM2_6621.jpg"></div><br>
      The picture of poutine was contributed by Jonathunder to Wikipedia <a href="http://en.wikipedia.org/wiki/Poutine#mediaviewer/File:Poutine.JPG" title="http://en.wikipedia.org/wiki/Poutine#mediaviewer/File:Poutine.JPG">http://en.wikipedia.org/wiki/Poutine#mediaviewer/File:Poutine.JPG</a><br>
      The letters might be hard to digest and are definitely not part of a healthy diet.<br>
      I might release Tsar Poutine as a font someday, but it does not seem like a very remunerative project.<br>
      Don<p></p>
