      <p>She's beautiful, Don! You've captured the essence of the original design perfectly!</p>
      <p>My thought is that every digital typographer's overall goal should be to give designers the freedom of having options. The more options there are, the more freedom designers have. Something as inventive and idiosyncratic as the original design/Tsar Poutine should definitely have a cushy spot in any designer's tool-shed!</p>
