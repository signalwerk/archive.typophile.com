      <p>The key to this lettering is the "gaspipe" or "stovepipe" corners. Start with a font with about the right height to width ratio and similar weight that has fairly tight curves outside AND inside, such as Ryoichi Tsunekawa's Design System A 700<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/DesignSystemA700InUse1_6471.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/DesignSystemA700InUse2_5322.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/DesignSystemA700InUse3_5194.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/DesignSystemA700InUse4_3549.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/DesignSystemA700InUse5_6690.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/flat-it/design-system/" title="http://www.myfonts.com/fonts/flat-it/design-system/">http://www.myfonts.com/fonts/flat-it/design-system/</a><br>
      Clip and paste stovepipe elbows as required.<br>
      Note the final row. These are the glyphs  _3_, _4_ and _l_. For _E_ you could start by flipping _3_. For _Y_ you could start with _4_. For _I_ you could start with _l_.<br>
      For _N_ ignore the round-top version and make a simple straight line _N_.<br>
      Only the lhs of _A_ will take some curve-bending.<br>
      Don<p></p>
