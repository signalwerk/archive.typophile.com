    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12443" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type and Lettering Styles</a>&nbsp;:&nbsp;Venetian</strong></p>
    <p>Early <a href="/node/add/wiki?edit%5Btitle%5D=Old%20Style" title="Create node &quot;Old Style&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Old Style</a> of the Renaissance period, also called <a href="/node/79593" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Humanist</a>. Letterforms are based on calligraphic principles, including modulated <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a>, humanist axis, <a href="/node/14545" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">lachrymal</a> terminals, large <a href="/node/13969" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aperture</a>. The single most distinctive letter to distinguish Venetians from their cousins is the slanted crossbar in the miniscule ‘e’. The Venetian <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">italics</a> were designed separately from <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> fonts and were used&nbsp;independently.</p>
    <p>The archetypal Venetian font is that of <a href="/node/13706" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nicholas Jenson</a>, as used in the 1470 <em>Evangelica Praeparatione</em> by <a href="/node/add/wiki?edit%5Btitle%5D=Eusebius" title="Create node &quot;Eusebius&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Eusebius</a>. In fact, it is Jenson’s city, Venice, that gives this family its name. The Eusebius was an absolute masterwork of printing, and is widely considered to be the first appearance of our entirely modern Roman&nbsp;letterforms.</p>
    <p>Many Venetian fonts are adaptations of the Eusebius, with varying levels of literalness. “Nicolas Jenson <span class="caps">SG</span>”, (metal) Monotype Eusebius, Abrams Venetian, and Adobe Jenson are all fairly faithful adaptations. <a href="/node/add/wiki?edit%5Btitle%5D=Centaur" title="Create node &quot;Centaur&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Centaur</a> is a reinterpretation based on the calligraphic structure that <a href="/node/16736" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bruce Rogers</a> saw from his study of photographic enlargements of the Eusebius. <span class="caps">ATF</span> <a href="/node/add/wiki?edit%5Btitle%5D=Cloister" title="Create node &quot;Cloister&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cloister</a> falls somewhere between the literal and calligraphic categories, as does the similar <a href="/node/add/wiki?edit%5Btitle%5D=Doves%20Press" title="Create node &quot;Doves Press&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Doves Press</a> font. <a href="/node/add/wiki?edit%5Btitle%5D=Goodchild" title="Create node &quot;Goodchild&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Goodchild</a>, by <a href="/node/12442" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick Shinn</a>, and its headline companion <a href="/node/add/wiki?edit%5Btitle%5D=Nicholas" title="Create node &quot;Nicholas&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Nicholas</a>, is a modern update of the calligraphic approach, with a large <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a> and tight <a href="/node/add/wiki?edit%5Btitle%5D=letterspacing" title="Create node &quot;letterspacing&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">letterspacing</a>.</p>
    <p>The Zeno type of <a href="/node/12227" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Giovanni Mardersteig</a> can also be classified as a Venetian, and bears many similarities, while also displaying the master craftsmanship and distinctive style of Mardersteig’s hand, working in collaboration with punchcutter <a href="/node/add/wiki?edit%5Btitle%5D=Charles%20Malin" title="Create node &quot;Charles Malin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Charles Malin</a>.</p>
    <p>One branch of the Venetian family tree caricatures the relatively heavy serifs compared with the later movement to hairlines, culminating in the <a href="/node/30993" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Didones</a>. The <a href="/node/add/wiki?edit%5Btitle%5D=Kelmscott%20Press" title="Create node &quot;Kelmscott Press&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Kelmscott Press</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Golden%20types" title="Create node &quot;Golden types&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Golden types</a> of <a href="/node/12139" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">William Morris</a> are the best known examples, both exhibiting heavy slablike <a href="/node/14498" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">serifs</a> bearing little resemblence to the Eusebius original, which was impressively refined not only for its day but for several centuries afterwards. <span class="caps">ITC</span> released its revival of the Golden type in 1989. <span class="caps">ITC</span> Italia also shows clear influence from the Golden tradition, but also mixes in elements of <a href="/node/14230" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Souvenir</a> and the slab&nbsp;serifs.</p>
    <p>In an even more radical interpretation, Monotype’s <a href="/node/add/wiki?edit%5Btitle%5D=Legacy%20Sans" title="Create node &quot;Legacy Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Legacy Sans</a> claims to be a sans serif based on the skeletal structure of the&nbsp;Eusebius.</p>
    <p>Venetian was a brilliant and highly readable advance in the design of letterforms. The <a href="/node/29235" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Garalde</a> style was clearly an incremental evolution of the standard set by Jenson, and its differences are primarily in small details such as the crossbar of the ‘e’. Designers continue to draw inspiration from this landmark font, and new designs in the Venetian tradition are still going&nbsp;strong.</p>
