    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Type%20and%20Lettering%20Styles" class="freelinking" rel="nofollow">Type and Lettering Styles</a> : Venetian</strong></p>
    <p>Early <a href="/wiki/Old%20Style" class="freelinking" rel="nofollow">Old Style</a> of the Renaissance period, also called <a href="/wiki/Humanist" class="freelinking" rel="nofollow">Humanist</a>. Letterforms are based on calligraphic principles, including modulated <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a>, humanist axis, <a href="/wiki/lachrymal%20terminal" class="freelinking" rel="nofollow">lachrymal</a> terminals, large <a href="/wiki/aperture" class="freelinking" rel="nofollow">aperture</a>. The single most distinctive letter to distinguish Venetians from their cousins is the slanted crossbar in the miniscule 'e'. The Venetian <a href="/wiki/italic" class="freelinking" rel="nofollow">italics</a> were designed separately from <a href="/wiki/roman" class="freelinking" rel="nofollow">roman</a> fonts and were used independently.</p>
    <p>The archetypal Venetian font is that of <a href="/wiki/Nicholas%20Jenson" class="freelinking" rel="nofollow">Nicholas Jenson</a>, as used in the 1470 <em>Evangelica Praeparatione</em> by <a href="/wiki/Eusebius" class="freelinking" rel="nofollow">Eusebius</a>. In fact, it is Jenson's city, Venice, that gives this family its name. The Eusebius was an absolute masterwork of printing, and is widely considered to be the first appearance of our entirely modern Roman letterforms.</p>
    <p>Many Venetian fonts are adaptations of the Eusebius, with varying levels of literalness. "Nicolas Jenson SG", (metal) Monotype Eusebius, Abrams Venetian, and Adobe Jenson are all fairly faithful adaptations. <a href="/wiki/Centaur" class="freelinking" rel="nofollow">Centaur</a> is a reinterpretation based on the calligraphic structure that <a href="/wiki/Bruce%20Rogers" class="freelinking" rel="nofollow">Bruce Rogers</a> saw from his study of photographic enlargements of the Eusebius. ATF <a href="/wiki/Cloister" class="freelinking" rel="nofollow">Cloister</a> falls somewhere between the literal and calligraphic categories, as does the similar <a href="/wiki/Doves%20Press" class="freelinking" rel="nofollow">Doves Press</a> font. <a href="/wiki/Goodchild" class="freelinking" rel="nofollow">Goodchild</a>, by <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a>, and its headline companion <a href="/wiki/Nicholas" class="freelinking" rel="nofollow">Nicholas</a>, is a modern update of the calligraphic approach, with a large <a href="/wiki/x-height" class="freelinking" rel="nofollow">x-height</a> and tight <a href="/wiki/letterspacing" class="freelinking" rel="nofollow">letterspacing</a>.</p>
    <p>The Zeno type of <a href="/wiki/Giovanni%20Mardersteig" class="freelinking" rel="nofollow">Giovanni Mardersteig</a> can also be classified as a Venetian, and bears many similarities, while also displaying the master craftsmanship and distinctive style of Mardersteig's hand, working in collaboration with punchcutter <a href="/wiki/Charles%20Malin" class="freelinking" rel="nofollow">Charles Malin</a>.</p>
    <p>One branch of the Venetian family tree caricatures the relatively heavy serifs compared with the later movement to hairlines, culminating in the <a href="/wiki/Didone" class="freelinking" rel="nofollow">Didones</a>. The <a href="/wiki/Kelmscott%20Press" class="freelinking" rel="nofollow">Kelmscott Press</a> and <a href="/wiki/Golden%20types" class="freelinking" rel="nofollow">Golden types</a> of <a href="/wiki/William%20Morris" class="freelinking" rel="nofollow">William Morris</a> are the best known examples, both exhibiting heavy slablike <a href="/wiki/serifs" class="freelinking" rel="nofollow">serifs</a> bearing little resemblence to the Eusebius original, which was impressively refined not only for its day but for several centuries afterwards. ITC released its revival of the Golden type in 1989. ITC Italia also shows clear influence from the Golden tradition, but also mixes in elements of <a href="/wiki/Souvenir" class="freelinking" rel="nofollow">Souvenir</a> and the slab serifs.</p>
    <p>In an even more radical interpretation, Monotype's <a href="/wiki/Legacy%20Sans" class="freelinking" rel="nofollow">Legacy Sans</a> claims to be a sans serif based on the skeletal structure of the Eusebius.</p>
    <p>Venetian was a brilliant and highly readable advance in the design of letterforms. The <a href="/wiki/Garalde" class="freelinking" rel="nofollow">Garalde</a> style was clearly an incremental evolution of the standard set by Jenson, and its differences are primarily in small details such as the crossbar of the 'e'. Designers continue to draw inspiration from this landmark font, and new designs in the Venetian tradition are still going strong.</p>
