    <p>Please join me at University of Texas at Austin for the most recent rendition of this evolving presentation about American commercial engraving.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/UTAustin_Facebook_Image_3953.gif"></div><p></p>
    <p>Tuesday September 22, 6:00pm–7:30pm<br>
    Art Building, Room ART 1.120</p>
    <p>This lecture will include images from recent research and sources of commercial engraving and specifications for engraving types never before shown in public or discussed.</p>
