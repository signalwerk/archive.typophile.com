  html: |-
    <p>Hello there,</p>
    <p>I always like working on mixing type, it might be frustrating, in the end you always find something nice. However, this time around, it seems really hard. I am looking for a serif typeface that fits Knockout's JuniorFlyWeight, it shouldn't be as compressed as Knockout itself but a little more condensed than your normal Garamond or Chronicle. I am working on an editorial design and I'm trying to achieve a little bit more elegance with the fonts' thin and high letterforms.</p>
    <p>Looking forward to your recommendations and thank you in advance!</p>
