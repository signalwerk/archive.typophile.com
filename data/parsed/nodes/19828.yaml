    <p>Hi,</p>
    <p>Is there anybody who has worked with a font that needs a few hundred points per letter to get a transparancy effects, or maybe worked with a "trashy" looking font?</p>
    <p>My problem is that I made the letters look like I wanted them to look - but when using the font in InDesign, the document got very, very slow, so I had to strip it down and try again all the time. I guess the number of points has a whole lot to do with this.</p>
    <p>Maybe someone have similar experiences and could give some useful tips?</p>
    <p>Thanks in advance!</p>
