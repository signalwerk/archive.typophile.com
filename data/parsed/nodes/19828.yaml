    html: <p>I had a student this year with the same problem Hrant mentioned. We "solved" the issue by making the text into a raster image at 600 dpi and saving it as a one bit diffusion dither. This is a technique I use all the time to print screen shots on my class handouts and they print quickly. On type it works best on grunge and distressed type or something with fuzzy edges</p>
