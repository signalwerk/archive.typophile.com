      <p>Here's what I mean by splitting a long path into two shorter paths.<br>
      I've "exploded" the view to show how it works -- the two short paths that cut the stem would actually superimpose (not a problem). I don't know if this technique would speed up rendering, but it allows smaller-memory printers to RIP fonts that would otherwise freeze them.</p>
