      <p>Hmm, I guess there is no straight answer for this one and experiment is the best way to maybe solve it, and I maybe a look at the "FontLab limitations-post" there aswell.</p>
      <p>The thing is that I am doing the font in Fontographer, and it seems that between 200-300 points there is no problem (other than it sometimes slows down InDesign when zooming). At first when the letters carried about 600-700 points it even made InDesign crash....</p>
      <p>But the less points, the less transparent the letters look like.</p>
      <p>For those who are interested, I am trying to make a font that looks like fluff... ;-)</p>
      <p>I think maybe 200-300 points is far to less points to get that effect?</p>
