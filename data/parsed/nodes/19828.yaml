    html: |-
      <p>I think Nick is alluding to the old postScript 1 errors that were frequent early on in complex paths.  The solution, as he has shown, was to butt segments together of shorter paths.  In effect, two paths of 20 points ripped far easier than one path of 40 points.</p>
      <p>ChrisL</p>
