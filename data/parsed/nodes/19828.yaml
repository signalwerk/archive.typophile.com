    date: 2006-05-09T14:23:00
    date_raw: 9 May 2006 — 2:23pm
    votes: null
    html: <p>You can also set the metrics in Fontographer to overlap glyph elements and make one letter out of several  character pieces, each with a smaller number of points. This will limit the number of letterforms in a font but each one you did could be more complex. This was mentioned in the early Fontographer tutorials as a way to do complex logo fonts.</p>
