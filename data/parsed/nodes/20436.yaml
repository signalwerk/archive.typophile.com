      <p>well it is very poor actually... it seems that they focused only on developing tools for easily creating gray pixels and nothing more...</p>
      <p>But it's a nice step in making such a tool in the market, i don't think there is any other that can easily create gray pixels with percentage control... maybe in version 3 they will add more options on editing font's data and easy addition of multiple unicode ranges, as TypeTool / Fontlab can do.</p>
