    html: <p>I'm afraid that I see an evil eye rather than a dandelion, and the individual seeds have a devilish, trident look. A different colour might help, however I think in this context a dandelion could be seen as a bit morbid. It is the end of the flower's life and the fragile head disintegrates in the wind. I think this aspect is the more likely response to a dandelion than the possibility that the seeds might grow again.</p>
