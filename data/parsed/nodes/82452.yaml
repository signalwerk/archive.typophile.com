    <p>Hi there,</p>
    <p>I've been designing a logo for a Social Enterprise and I would really appreciate any feedback people might be willing to give. I'm a graphic designer but am fairly new to identity design.</p>
    <p>The Organisation train and then send volunteers into care homes to engage in one-to-one educational activities with care home residents. It is funded partly through the care homes, who pay a small fee, and through grants. Each volunteer brings their own set of skills to the Organisation and they are then matched with residents who might be interested in engaging in that activity - for example an arts student might visit a care home to teach watercolours to people interested in learning watercolour painting. </p>
    <p>I picked the dandelion as an icon as the florets, when composed together create the larger dandelion structure and symbolically this could be applied to the volunteers which work for the Organisation. When they work together under the Orangisation's stewardship they achieve a joint goal. The dandelion seeds also represent new life, and a number of the residents are often learning new skills that they wouldn''t have necessarily had the opportunity to in the past. </p>
    <p>Any feedback or suggestions would be most welcomed and appreciated.</p>
    <p>Many thanks</p>
