    html: <p>I don't have the same negative feeling about dandelion seeds that Justin mentions (I associate them with kids blowing the seeds off) but I do agree with his comments about your drawing. If you want to stick with the dandelion theme, I'd redraw it from scratch. Try a more naturalistic stroke - the monoline approach looks weird and conflicts with the font you chose. And try some other colors. It might look better with a few less seeds, and the trident tip looks strange.</p>
