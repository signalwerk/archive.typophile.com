    html: <p>Verlag borrowed some inspiration from Metro by W.A. Dwiggins. You might have luck with something like Electra, Caledonia, or Whitman (also inspired by Dwiggins) from Font Bureau. And while the x-height might be a touch larger, you might do well using Chronicle from Hoefler+Frere-Jones.</p>
