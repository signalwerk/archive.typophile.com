      <p>When I design a logo for a public place ( or a place that is going to be visited by people) I like to give a flavour of what people are going to find inside (decoration, artefacts etc.).<br>
      I am quite convinced that water is a good association...a detail of the Fontana di Trevi in Rome or any other water feature maybe? </p>
      <p>I saw a few beautiful Roman Amphoras (pottery) on the net and I thought it could be a nice idea. Amphoras or any terracotta pot with a nice shape...and I won't hold a grudge if you pick a Greek amphora and it'll keep Chris and Tim quite for a while!<br>
      I guess water amphoras is the kind of things you could find in Roman baths (I wasn't born at the time but I'm pretty sure I've seen that in Asterix!)</p>
      <p>A beautiful amphora with water coming out of it? Ok, maybe not a genius idea but with clients you never know!<br>
      I think shape is important...I've read somewhere (not in Asterix) that the brain aknowledges and remembers shapes first...as far as fonts are concerned I really like the Garda one too.</p>
