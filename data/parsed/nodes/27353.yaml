      <p>"The location will be decorated with Greek columns, Plaster Wall textures, Italian wall murals, dark textured concrete floors, fish tanks, and a circular relaxation room. Some additional visual imagery: Art Deco, Fancy/Floral, crown molding, little details, rich looking, drapery, olive branch, fruit theme/ Adam &amp; Eve"</p>
      <p>The short version: kitsch. Is the spa in Las Vegas?</p>
      <p>Fancy floral , little details, rich looking (whatever that means) is more art nouveau (800s/900s) than art deco (1920s). Art Deco and Art Nouveau are two different things and if you really want to be accurate you should make some research because Art Deco is more associated with geometric elements (see Charles Rennie Mackintosh etc.) and very stylised florals.</p>
      <p>La Dolce Vita literally means "the sweet life" (or the good life) but it's also strictly associated with Fellini's film which is set in Rome in the sixties. </p>
