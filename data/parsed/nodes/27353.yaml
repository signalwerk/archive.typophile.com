    html: |-
      <p><a href="http://louisefili.com/flash.html" rel="nofollow">Louise Fili</a> is, in my opinion, a very thoughtful collector of italian (amongst other locale) typography. She designed a small book, <em>A Designer's Guide to Italy</em> which was beautifully produced by <a href="http://www.darbylitho.com/" rel="nofollow">Darby LItho</a> focussing on some of her collections. It is a little pricey, but for someone who collects I thougth it was worth it. Seeing pictures of this little book isn't the same as holding as you miss out on all of the tactile qualities from the production. There was a small article written about it in <a href="http://www.stepinsidedesign.com/STEPMagazine/Article/28461" rel="nofollow">STEPInside</a> in 2005 which is now online.</p>
      <p>Equally you can't miss out on her book <em>Italian Art Deco: Graphic Design between the wars</em> and <em>Deco Type: Stylish Alphabets from the '20s and '30s</em>, among many others, which features all of her collections. <a href="http://www.amazon.com/s/ref=br_ss_hs/002-3027848-3844840?platform=gurupa&amp;url=index%3Dblended&amp;keywords=%22louise+fili%22&amp;Go.x=0&amp;Go.y=0&amp;Go=Go" rel="nofollow">Available at Amazon.</a></p>
      <p>Also, you can't miss <a href="http://www.travelbrochuregraphics.com/Top_Level_Pages/Italy/Italy_Main.htm" rel="nofollow">Travel Brochure Graphics</a> with there section on Italy.</p>
