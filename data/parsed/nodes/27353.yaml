      <p>Old Italian style is a bit too plain and literal lol. Lithos is probably a bit too greek/Oscan/Etruscan or whatever it is lol. </p>
      <p>The imagery of the spa will be old italy but the type doesn't so much have to be "Old Italian Type" as much as it should appear to have the qualities representing the period.</p>
      <p>The main visual imagery is Old Italian, and Expensive/Sheik. here's my little brief about it:</p>
      <p>Dolce Vita is an Italian Day Spa with expensive services marketed towards the wealthy. Dolce Vita should represent Old Italy and/or Sheik/Expensive. The logo must have an unforgettable quality, can be overly extravagant, and should be directed at men as well as women. The location will be decorated with Greek columns, Plaster Wall textures, Italian wall murals, dark textured concrete floors, fish tanks, and a circular relaxation room. Some additional visual imagery: Art Deco, Fancy/Floral, crown molding, little details, rich looking, drapery, olive branch, fruit theme/ Adam &amp; Eve (dolce vita means "sweet life").</p>
