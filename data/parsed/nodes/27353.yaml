      <p>"Old italy is centuries of history, but i only need to represent the feel of what people think is old italy"</p>
      <p>Yes, you're right. Probably it makes more sense to ask local people what they perceive as old Italy than to ask an Italian, after all your audience is American. I personally take historical issues very seriously and spend a lot of time in research. I am not a heavy weight designer, not even a medium weight, but it does bother me a lot when people can't distinguish ancient Rome from Greece from 17th century from 1920s...</p>
      <p>but back to your brainstorming (if you are still interested in my opinion!) I find art deco such a good idea (even if it probably doesn't reflect the interior design which sounds kind of heavy and, I insist, not very chic). </p>
      <p>I love the elegance and sophistication of art deco, It's not about luxury you see, it's about elegance and grace and lightness. That's chic (to me). </p>
      <p>Luxury could be anything: it could be heavy velvet stuff, rococo, golden frames and neo classic sculptures...none of these are necesserally chic. I would go with art deco (even if it wasn't really embraced very much by the Italian as far as I know, more France and Austria I think...). </p>
      <p>Also may I ask you which sort of murals are we talking about here? And which sort of greek columns (are you sure they are Greek?), I'm just curious now, it would help to have a more accurate description of the place to understand what goes on in your boss (sick) mind (joke...). </p>
      <p>Tim: you almost got me with the farm fishing argument here ; )</p>
