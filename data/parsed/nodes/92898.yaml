    html: |-
      <p>@hrant:<br>
      <cite>First thought: Why do you have to use the same typeface?</cite></p>
      <p>Presumably, avoiding the need for font commands avoids the need for specialized software for preparing the blog - the text can just be typed in, changing to a Hebrew or Greek keyboard as necessary.</p>
      <p>I thought there was an <em>obvious</em> solution: TeX Gyre Termes. This supports not just Latin, Hebrew, and Greek, but also Cyrillic, Armenian and such languages as Thai, Burmese, Gurmukhi...</p>
      <p>I know it's just a dull old Times Roman clone, but because it's an open-source font, there's no issue with using it as a web font, and so it fills the bill ideally for the original poster's issue as stated.</p>
      <p><em>However,</em> since the OP's issue involves Biblical Greek and not Modern Greek, there may be a requirement for typing <em>polytonic</em> Greek. In this case, the available options may be considerably more limited, and considering a separate typeface for Greek may be required.</p>
      <p>This, of course, is also the case if it is desired to type Hebrew with vowel points and perhaps even cantillation marks. However, while TeX Gyre Termes lacks polytonic Greek, it does have at least the basic vowel points for Hebrew.</p>
