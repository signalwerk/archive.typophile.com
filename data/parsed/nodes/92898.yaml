  html: |-
    <p>I'm designing a blog for a theologian, which means he'll be occasionally writing in (biblical) Hebrew and Greek. If possible I'd like to steer off the beaten path and use a webfont. Do you know of any webfonts that offer this kind of language support? </p>
    <p>[I initially thought of Gentium, which would be a great choice, but the webfont version only includes the Latin alphabet.]</p>
    <p>Thanks in advance for your help.</p>
    <p>EDIT: just noticed Gentium does indeed include WOFF files for Gentium Plus, but I'm trying my best to avoid self-hosting the files. Still, I guess there's my first typeface for the list. Any others?</p>
