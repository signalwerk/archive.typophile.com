    html: |-
      <p>When you go outside the Big Three (Latin, Cyrillic, Greek)* you're severely limiting your stylistic choices by demanding that a single font handle everything. You might be lucky to find <em>one</em> typeface that has all the scripts you need, and it probably won't be the style you want. And anyway, especially if you get into the more exotic NB3 scripts trying to match the style can become more damaging than useful.</p>
      <p>* OK, new term suggestion: NB3 (non-Big_Three). Use it or lose it.  :-)</p>
      <p>Here's an approach that I think works: start with the NB3 script, which will have the fewest fonts; find one that works; find a B3 typeface that harmonizes; but if the NB3 is too distant from the B3 it's better to split up the B3 (so it's not like the B3 is a clique). And if you have to support more than one NB3 script then: you might need to compromise both choices a little bit; and it's much more likely you'll have to split the B3 choices.</p>
      <p>Then there's the issue of hierarchy: quite often the various scripts aren't supposed to be equally important, and one (or more) could be subordinate in style. Ideally you want a "multilateral" system with both parallel and hierarchic branches. Of which there's still only one...  :-)<br>
      <a href="http://www.granshan.org/works/2008/hrant.pdf" title="http://www.granshan.org/works/2008/hrant.pdf">http://www.granshan.org/works/2008/hrant.pdf</a></p>
      <p>hhp</p>
