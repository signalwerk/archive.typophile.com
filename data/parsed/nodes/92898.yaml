    html: |-
      <p>Ladoga from WebINK supports extended Latin, Hebrew and polytonic Greek. (Also Cyrillic.)<br>
      <a href="http://www.webink.com/font/ladoga" title="http://www.webink.com/font/ladoga">http://www.webink.com/font/ladoga</a></p>
      <p>But I agree that it is perfectly reasonable to use separate fonts in one's fallback stack. However, using a single typeface will create a more stylistically consistent look.</p>
      <p>Whatever is used, be careful about minimum size on Windows. Most fonts are not hand-hinted and many will not do so well at text sizes on screen, especially on Windows XP systems with default rendering settings.</p>
      <p>Cheers,</p>
      <p>T</p>
