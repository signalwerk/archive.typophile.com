    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Barber_3766.gif"></div><br>
    The Drawn Letter<br>
    Ken Barber<br>
    *Places are still available on both weekends as of October 14th<p></p>
    <p>2 sessions<br>
    Saturday, October 23 &amp; Sunday, October 24<br>
    9 am–4 pm</p>
    <p>Due to high demand, this workshop will be repeated:<br>
    2 sessions<br>
    Saturday, November 6 &amp; Sunday, November 7<br>
    9 am–4 pm<br>
    Lettering is a unique discipline, offering a distinctive means of visual expression not possible with writing or conventional typography. Among the drawn letter’s characteristic advantages is its potential not simply to communicate content, but to become content itself. This workshop will investigate recent historical approaches to lettering, in addition to exploring various production techniques. Participants will refer to familiar typographic models and helpful specimens as they create their own hand-drawn wordmarks. Comprehensive slide presen­tations and drawing demonstrations will provide further guidance as students acquire a practical foundation for implementing one-of-a-kind lettering in various design contexts.</p>
