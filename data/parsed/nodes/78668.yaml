    html: |-
      <p>Exactly. This chart was posted in an article in FontShop’s help section under ‘<a href="http://help.fontshop.com/entries/208895-fontfont-opentype-formats-explained" rel="nofollow">FontFont OpenType Formats Explained</a>’.</p>
      <p>‘Style-linking not available’ in this regard means, that the webfonts are not originally style-linked the same way Offc FontFonts are style-linked (like grouped under a single item in the font menu and the user has to use the key commands and toolbars to switch between Regular, Bold, Italic, and Bold Italic.) Style-linking for both WOFF and EOT fonts is of course possible, as explained in the <a href="http://issuu.com/fontfont/docs/web_fontfont_user_guide" rel="nofollow">Web FontFont User Guide</a>.</p>
