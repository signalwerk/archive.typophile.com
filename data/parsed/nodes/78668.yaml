    html: "<p>Put differently: The equations .otf = OT/Pro, .ttf = Offc/OffcPro, .woff/eot = Web/WebPro and definitions are FontShop-specific. Different foundries may use same or similar terms to mean different things. Or different terms to mean same or similar things. There are no standards here. Linotype, for example, has labels like Std, Pro, Com, etc for character set plus XSF for hinted TTFs. So the above chart is of little use except for shopping FontShop's FontFont fonts.</p>"
    html_clean: "<p>Put differently: The equations .otf = OT/Pro, .ttf = Offc/OffcPro, .woff/eot = Web/WebPro and definitions are FontShop-specific. Different foundries may use same or similar terms to mean different things. Or different terms to mean same or similar things. There are no standards here. Linotype, for example, has labels like Std, Pro, Com, etc for character set plus XSF for hinted TTFs. So the above chart is of little use except for shopping FontShop's FontFont fonts.</p>"
