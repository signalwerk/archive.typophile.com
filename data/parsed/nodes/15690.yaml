    <p>Blog site of <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>'s Type Development team. This blog content covers a wide range of typographic topics from the pros and cons of different type <a href="/wiki/conferences" class="freelinking" rel="nofollow">conferences</a> to the technological issues of <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> Type 1 and <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts. This blog was named in <a href="http://typophile.com/node/15321" rel="nofollow">a contest</a> right here on <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>.</p>
    <p><em>URL: <a href="http://blogs.adobe.com/typblography" rel="nofollow">http://blogs.adobe.com/typblography</a></em></p>
