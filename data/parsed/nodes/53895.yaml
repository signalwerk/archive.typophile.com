      <p>TypeCon2009 Update - 1/21/09 - Call for Submissions</p>
    <p>TypeCon2009: Rhythm<br>
    July 14-19, 2009<br>
    Grand Hyatt Atlanta at Buckhead<br>
    Atlanta, Georgia</p>
    <p>presented by The Society of Typographic Aficionados (SOTA)</p>
    <p>————————————————————————————————-<br>
    CALL FOR SUBMISSIONS FOR PROGRAM CONTENT FOR TYPECON2009<br>
    ————————————————————————————————-</p>
    <p>The Society of Typographic Aficionados (SOTA) is currently reviewing proposals for contemporary and historical presentations and panel discussions, as well as focused hands-on workshops in both the digital and non-digital realms. Topics at TypeCon cover a broad range of interests, including typography, type design, font production, graphic design, new media, printing history, calligraphy and hand lettering, the book arts, advertising, type in motion, literacy, type sales and marketing, legal issues, type and design education, and other related areas.</p>
    <p>Standard programming formats are as follows:</p>
    <p>Full-length presentation - 40 minutes, including time for audience Q+A</p>
    <p>Type in 20 presentation - 20 minutes, including time for audience Q+A (if any)</p>
    <p>Type and Design Education Forum - see separate call below</p>
    <p>Panel discussion - a minimum of 3 panelists that represent a range of experience and expertise in a given topic. An experienced moderator is required for all panels. A moderator may also serve as a panelist where appropriate. Panel discussions range from 45-60 minutes, depending on the topic.</p>
    <p>Full-day workshop - 7 hours (with break for lunch at midday)</p>
    <p>Half-day workshop - 3.5 hours (no break)</p>
    <p>The main program of presentations and panels will run Friday-Sunday, July 17-19. Pre-conference workshops will take place Wednesday-Thursday, July 15-16, with tours running throughout the week.</p>
    <p>You may submit multiple proposals.</p>
    <p>In order to consider your proposal, we will need the following:</p>
    <p>- presentation/workshop/tour title<br>
    - a concise one-paragraph description of your topic (up to 100 words)<br>
    - complete supporting materials for review - visuals, theses, articles, abstracts - the more details you provide, the better<br>
    - your biography (100 words maximum)<br>
    - speaking references (if you have not previously presented at TypeCon)<br>
    - a print quality headshot in TIFF or JPEG format - must be a minimum of 300 dpi at 2 inches wide<br>
    - any other material that supports your proposal</p>
    <p>Please use PDF, RTF, or ASCII text for text. Compress all files in a single ZIP archive labeled with your name (example: TC09_LastNameFirstName). If your ZIP archive is larger than 20 mbs, please send a link for downloading instead of transmitting through email.</p>
    <p>Email proposals to <a href="mailto:info@typesociety.org">info@typesociety.org</a> by Febuary 20, 2009. The programming committee will review all proposals for possible inclusion in the conference schedule.</p>
    <p>————————————————————————————————-<br>
    CALL FOR SPEAKERS FOR THE TYPECON2009 TYPE AND DESIGN EDUCATION FORUM<br>
    ————————————————————————————————-</p>
    <p>The Society of Typographic Aficionados (SOTA) will present its fourth Type and Design Education Forum as part of TypeCon2009. This special program will be held on Thursday, July 16, at the Grand Hyatt Atlanta in Buckhead. The forum will be devoted to addressing issues faced by type educators and the institutions they represent. The program will feature presentations in conjunction with breakout sessions dedicated to the open exchange of ideas and experiences.</p>
    <p>We are looking for presenters in the following areas:</p>
    <p>Assignment Presentations<br>
    15-minute presentations of effective and stimulating assignments that generate a passion for type:<br>
    - Basic skill sets/foundations of type/typography<br>
    - Basic lettering/letterform design<br>
    - Type history/typographic history<br>
    - Experimentation with type</p>
    <p>We are looking for facilitators for:</p>
    <p>Breakout Sessions<br>
    There will be a general session consisting of small breakout discussions. We are looking for people to facilitate discussions on the following topics:<br>
    - Curriculum development for junior/community colleges<br>
    - Curriculum development for schools with 1–2 type classes<br>
    - Curriculum development for design programs with 3–4 type classes<br>
    - Curriculum development for liberal arts programs with 3–4 type classes<br>
    - Teaching type/typography basics<br>
    - Teaching letterform design<br>
    - Font selection: how to teach students to do font explorations, and make appropriate choices<br>
    - Strategies for more effective critiques<br>
    - Teaching calligraphy as a means to developing an appreciation of letterforms<br>
    - Experimentation in typography<br>
    - Type in motion<br>
    - Interactive/web type<br>
    - Multi-lingual typography</p>
    <p>We are considering adding a new component to the Education Forum this year - a series of hands-on workshops designed specifically for educators. Workshops will run approximately 3 hours, and should be geared toward smaller groups (15-25 participants per session). If you have an idea for a workshop for educators and would like to lead your peers, please submit a proposal with supporting documentation. We are open to all ideas for this exciting new opportunity.</p>
    <p>Submissions<br>
    Proposals should contain your biography/resume/CV, your area(s) of interest/specialty, a description of your proposed presentation and/or breakout session, and a statement about why you’d like to participate. Please include a speaking reference if you have not previously presented at a TypeCon event.</p>
    <p>Please send all submissions to Ilene Strizver and Nancy Rorabaugh, SOTA Education Committee chairs, at <a href="mailto:education@typecon.com">education@typecon.com</a>. Deadline for submissions is February 20, 2009.</p>
    <p>————————————————————————————————-<br>
    ABOUT TYPECON AND SOTA<br>
    ————————————————————————————————-<br>
    TypeCon2009 is the annual conference of SOTA, an international non-profit organization dedicated to the promotion, study, and support of type design, typography, and the related arts. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" title="http://www.typesociety.org">http://www.typesociety.org</a>.</p>
    <p>Have questions, need answers? Send us an email! <a href="mailto:info@typesociety.org" title="mailto:info@typesociety.org">mailto:info@typesociety.org</a>.</p>
    <p>See you in Atlanta!<br>
    _________________________________________________________________</p>
