    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Nancys_Mourning_Stationery4feltwire-2_5540.jpg"></div><p></p>
    <p>This just in from Mohawk Fine Papers, Felt &amp; Wire:</p>
    <p>"[Tom Biederbeck] Nancy Sharon Collins thinks the time has come to revive a useful asset for our letter library: mourning stationery. Collins, a designer, researcher and writer about paper and print, says mourning stationery was intended to help the bereaved adapt to a new role in society. I asked her about her interest, how mourning stationery functioned graphically, and how it might have relevance for our time."</p>
