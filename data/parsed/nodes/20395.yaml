    <p>Hi there,</p>
    <p>This is my first post on this forum, but i've been reading it for some time now. I'm not a very good typographer, so therfor my post.<br>
    Currently i'm - pro bono - doing a design on a a logo (+ID) for a charity non-profit organisation. They were called GNSI which stands for Ghana Netherlands Schoolfeeding Initiative. I've already convinced them changing the name in SIGN. </p>
    <p>The Identity should:</p>
    <p>a. Reflect what they're doing<br>
    b. Have a professional (non activism) appearance / and be positive</p>
    <p>SIGN's main activities are:<br>
    1. nutrition<br>
    2. education<br>
    3. (economical) developement</p>
    <p>I've tried to capture this in the ID by creating a iconic alphabet. The style is referring to schools (and cutout / potato stamps).<br>
    The logo is not a fixed logo, but a constantly changing combination of icons and a 'wordmark' (for eg different on letterheads and businesscards). This is because I feel that the icons themself should not represent the organisation. (added two examples of possible logo). </p>
    <p>I would appreciate some pointers and critique.<br>
    Thanks...</p>
