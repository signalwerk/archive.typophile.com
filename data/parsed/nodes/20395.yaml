      <p>For me I think it's the wordmark that's not quite working yet. I realize that in choosing a typeface for a charitable organization you're looking for something that isn't too cold, however I think something a little slicker would seem more professional and instill more confidence.</p>
      <p>Just my thoughts.</p>
