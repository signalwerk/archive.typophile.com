    html: <p>With your explanation I see what you have done &amp; it makes sense. I even like to look of it.  But without the explanation I would be quite confused. Making icons to work in this way is something that rarely works well. Many many ideas resist iconization or rely on cutural factors that change. The idea of econmomic developemet strikes me as falling strongly into this category or 'resitive' ideas. So I don't recommend the icon route. What about making letters out of many symbols like the univelier logo - then you could include much more.  What about A sigbn that says 'sign'? It would be confusing but also create an oportunity to talk about what it is. I am sure there are many many other possibilities. Keep going.</p>
