    html: |-
      <p>@ rebeccas:</p>
      <p>As far as the eBook is concerned use 'Bauer Bodoni Italic' in your professional layout. Once complete print to 'Postscript' and use Adobe Distiller to create a PDF with the setting of 'Standard'. If you click on the 'Settings' menu, pick 'Edit Adobe PDF Settings' and click on the 'Fonts' tab you'll discover that it is set to embed and create a subset of any font used. Everything will display and print perfectly when anyone opens it because their machine will pull the embedded fonts from the PDF file. For added security you can 'lock' the eBook from being modified, printed, etc.</p>
