    <p>Hi,<br>
    I are finalizing our logo which has been created based on the Bauer Bodoni Italic font. The closest match to this font which all users have by default is Georgia.</p>
    <p>I am a little stuck on a few things for the website and e-book PDF (all digital/on-screen and not print):</p>
    <p>1) For the website, if I use Georgia for headings, would Verdana be the ideal choice for body content? If not, what other combinations would go well?</p>
    <p>2) For the e-book PDF, I have used Georgia for headings and Myriad Pro for body content (Verdana did not flow well for the PDF compared to how it looks on the web), but I'm still not sure Georgia and Myriad Pro are the best for the e-book. Any suggestions please?</p>
    <p>My main problem is that I want the logo, e-book PDF and website, to all flow consistently with little variation in their presentation. This may sound silly, but I don't want to use "generic" fonts in the e-book PDF (Georgia, Verdana, etc.) as I have always felt that a professional e-book would use "better" fonts.</p>
    <p>Thanks for your help,</p>
    <p>Bec</p>
