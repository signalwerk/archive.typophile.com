      <p>Not sure why you're concerned about the eBook as fonts can easily be embedded and will display correct on any machine. The web is a tough one but I use 'Georgia' for headlines and 'Arial' for body and it looks good.</p>
      <p>Have you ever tried <a href="http://www.typetester.org/" rel="nofollow">Typetester</a> for comparing online screen fonts? Pretty sweet and it will even generate your CSS. :)</p>
      <p>You might also want to check out <a href="http://www.mikeindustries.com/blog/sifr/" rel="nofollow">SifR</a>. It is an option for getting an expanded set of fonts on your site. Another group is also working on <a href="http://typekit.com/" rel="nofollow">TypeKit</a>.</p>
