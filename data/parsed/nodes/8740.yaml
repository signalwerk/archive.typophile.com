    html: <p>Usually a logo will symbolizes or represents something about the given company for which it stands for. I am just wondering what the logo you have designed stands for. If it is purely for looks than I can't help you. If there is meaning behind it, than it will be  easier to critique. In my personal opinion the better logos out there reflect something about the personality and meaning behind the particular company for which they stand for. <br>Anyway, only an opinion.</p>
