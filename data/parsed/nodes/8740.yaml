    html: "<p>IRT Daniel: <br>i did that 'db' thing once and it reminded me too much of a penis, so i let it go. <br>i didn't mean to offend anyone here, it just did! sorry . . . <br>as for the first part of you suggestion, i'm afraid i don't understand what you are trying to say, as i said before, english isn't my mother tongue. :-( <br>  <br>IRT Scott: <br>i get you once again. <br>i thought too the curve is too 'mellow' now. <br>as this conversation is going, i was thinking about it and i came to a conclusion that a logo really doesn't have to represent anything at all, but even in that case it WILL represent something - NOTHING(if that is your attitude), if you can understand what i'm saying . . . <br>well what i am trying to say here doesn't neccessarilly has to reflect this design in particular, i am talking on the subject of the logo being the true symbol that will represent the core of the company or an individual. <br>so, it can be taken for a l'art pour l'art kind of thing, you know . . . <br>i consider myself a kind of a nihilist in some ways even, so. . . <br>anyways it is something to think about. :-) <br>  <br>tomorrow i'll redo some things, i just hope no one got uset over this whole thing, or even worse get angry at someone. and i hope that this issue of mine isn't a burden to anyone, if that is the case, please be assured it was not my intention and you have my deepest appologies for me posting it here.</p>"
