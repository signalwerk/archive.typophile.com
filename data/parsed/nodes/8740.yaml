    html: <p>I feel that one of our jobs as designers is to visually educate people with meaningful thoughtful sensitive design. One way to NOT do this is to remove the meaning all together. If there is no meaning you aren't educating anyone. <br> <br>For me it makes it difficult on the viewer to try to figure out why you combined the letterforms. Especially if there is no reason.</p>
