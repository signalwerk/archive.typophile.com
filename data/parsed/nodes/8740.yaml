    html: <p>Wow! We're starting to get really philosophical over this. <br> <br>To David's point, an entity's logo should be purposeful. It should represent the entity that it is being designed for. <br> <br>In Dragan's defense, this logo's purpose is to represent his design business, possibly, but not necessarily,  in a way that reflects his design style; hence, it is successful in that it is his initials (representing his business just as well as any business that is represented by names or initials) and it is designed by him (must show his style). I think his concept is solid, so it is his execution that will determine whether or not this is a successful logo in the end. <br> <br>Your concept in post 6 looks like a bed's footboard on its side. Of the concepts in the last post (7), I like the direction on the bottom, but now (your going to kill me for this) it's a little too subtle. Rather than reading a "B", I'm seeing a big pimple or mosquito bite. Try bringing back a little more of the stroke in that area so that the bump isn't so abrupt. Also, the terminal is a little too rounded. I think there's a good shape in there, it's just hiding in between a couple of your executions. <br> <br>Aloha! <br>Scott</p>
