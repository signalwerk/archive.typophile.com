    html: <p>You could theoretically combine a "d" and a "b" all day long in a million different ways.  Which way is the right way? <br>I ask myself  simple question about the logos presented here.  <br> <br>How do these logos visually represent that you are a graphic designer? <br> <br>To Darrel; <br>Don't you think a logo is more memorable if it has some underlying metaphor or meaning in it? I'm not talking about a literal meaning like you mentioned. I am talking more simplified, timeless and abstract. <br> <br>Here comes my sobering point of the day. <br>Graphic design firms with logos are limiting themselves. Why would you design a logo for a logo designing company? This might be to heady to talk about on this forum. Look at the logos of some the greatest design firms in the world. You will find that there is nothing tricky or contrived or forced about any of them. In fact, they have a certain consistency about them for a simple reason. They do to many different tasks as design firms to try and represent themselves with a single mark. Most of there logos are more like logotypes that just read simply and smoothly , no bells and whistles man. <br>  <br>Again...only my opinion.</p>
