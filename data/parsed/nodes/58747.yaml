      <p>I'm interested to know what this one is. The most similar I found based on these letters was <a class="freelinking external" href="http://new.myfonts.com/fonts/emigre/eidetic-neo/?testdrive=dock%3Dfalse%26size%3D34%26w%3D600%26src%3Dcustom%26text%3DCiencia.%2520Inovacao%25202010%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D26" rel="nofollow">Eidetic Neo</a>. I searched mainly keying on the C and a, using my <a class="freelinking external" href="http://www.bowfinprintworks.com/SerifGuide/intro.php" rel="nofollow">Serif ID Guide</a>. If there were more letters the search may have been more fruitful, but I tried every 'a' that might have been roughly similar. Other fonts that were close structurally, but not as similar by eyeball, were Fiona Serif, Rebecca Samuels and Veljovic.</p>
      <p>- Mike Yanega</p>
