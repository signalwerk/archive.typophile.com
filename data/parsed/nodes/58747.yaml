      <p>I downloaded the pdf from <a href="http://www.poci2010.mctes.pt/info_publicidade/downloads/" title="http://www.poci2010.mctes.pt/info_publicidade/downloads/">http://www.poci2010.mctes.pt/info_publicidade/downloads/</a> and looked  at it with Inkscape. Letters come in two layers. Here I separated the layers for the "c cedilla" and made it clear that the cedilla was never merged into the "c". Is a normal font likely to have such a free cedilla?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ccedilla_4650.jpg"></div><p></p>
