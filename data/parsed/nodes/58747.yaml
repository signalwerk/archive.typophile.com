    html: <p>The whole thing looks rather lame to me. The /1/ especially needs a bigger head serif. My conclusion would be that the designer had to create the /ccedilla/ from the /c/ and the /cedilla/ because there wasn't a /ccedilla/ already in the font. To me this indicates a non-commercial font.</p>
