      <p>To add to what Don has said, the flame shape was also called ‘cyma ’. It widely used in sign painting and lettering from 1900 to 1930 aprox.</p>
      <p>Here is a short paragraph from a old book on sign painting:<br>
      “... a short pen or brush stroke termed the cyma, on account of its resemblance to the curve of the Greek moldings of that name. The purpose of the cyma in lettering is to fill the space between the slanting parts of the letters, or extremities of letters where wide openings are likely to appear where the letters are placed together. It is also used as an integral part of some letters... ”</p>
      <p>This is from another book:<br>
      “... Note the frequent use of the cyma in this alphabet as in A, for its cross-bar ; in C, to fill space and add grace ; between M and L, again to fill up excess of space; in Q, where it properly belongs, as in the Roman Q; in W, again to fill space, this time serving to take away the appearance of too great width in that letter; finally in &amp;, where it makes a most graceful part of the ampersand.... ”</p>
