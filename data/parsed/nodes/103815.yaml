      <p>Letterhead has a great collection of fonts inspired by pre-WWI signs and lettering.<br>
      The tilde shaped feature in the middle of the O is sometimes called a flame. The feature seems to have been invented by a book cover letterer, Henry Thayler, in the 1890s. In addition to the center of the O, flames sometimes appeared above the serif at the end of the arm in L, running leftward from the apex of the A, replacing the crossbar in E, F, H and A, and elsewhere. Some fonts of the era included flames. They were more common in hand painted signs and in book covers. Unfortunately, I don't recall offhand another digital font with the flame feature in O.<br>
      Don</p>
