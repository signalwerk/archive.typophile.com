      <p>Yes, Mike, a tilde/flame dingbat under the O was a part of an Arts &amp; Crafts style. A representative fancy book cover from about 1896:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Violin1896ca_5850.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Violin1896caDetail_4739.jpg"></div><br>
      Retablo catches some of the style, but the addition of spurs is something the Arts &amp; Crafts letterers  would have rejected as old fashioned and un-cool. For that reason I see Retablo as a modern fusion design.<br>
      In addition to the tilde/flame dingbats, this Arts &amp; Crafts style often had the cross bars pushed to the top,  a  graceful R, and the diagonal part of the N intersecting the right hand stroke above the bottom corner.<br>
      IMO this is a good style to exploit for some new fonts.<br>
      Don<p></p>
