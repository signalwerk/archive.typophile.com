      <p>Found this info on a <a href="http://www.woodworkinghistory.com/glossary_cyma_curve.htm" rel="nofollow"> woodworking site</a>:<br>
      ----start quote----<br>
      cyma: Cyma comes from the Greek word meaning wave. A molding in common use, with a simple waved line concave at one end and convex at the other end, similar in form to an italic I. When the concave part is uppermost the molding is called cyma recta, but if the convexity appears above and the concavity below the molding is known as cyma reversa.</p>
      <p>(Another term for cyma curve is "S-curve" Some cyma curves were small, like those at the top of many cabriole legs; others were large, like that of the leg itself. See for example, chapter one of Norman Vandal's book on Queen Anne, in sources</p>
      <p>In 1906, a Princeton professor, Allan Marquand exhaustively traced the history of both these terms in the English language -- box below.)</p>
      <p>    "... [F]rom current European terminlogy ... the words cyma recta and cyma reversa represent a usage practically confined to Britain and the English speaking people. How then id these terms come to be adopted in Britain? ... [I]t came this way. In 1715 an Italian name Giacomo Leoni was brought over to Britain by Lord Burlington to assist in the translation of the architectural works of Palladio, published in that year. This English edition of Palladio, subsequently republished with annotations of Inigo Jones, had no little influence on Englsih architects and architectural terminology")<br>
      ----end quote---<br>
      This seems to explain the use of the terms in the books Pablo cited.<br>
      Don</p>
