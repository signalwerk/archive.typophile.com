      <p>Found what I believe may be the is the earliest font with the O containing the tilde/flame/cyma ornament. It was called Pluto and was sold by the Cleveland Type Foundry in 1895. The Art Nouveau/Arts &amp; Craft era in florid expression! Not digitized AFAIK.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Pluto@Cleveland1895__6396.jpg"></div><br>
      Don<p></p>
