  html: |-
    <p>Maax is a sans serif font with 3 sets of alternatives glyphes; standard, geometrical, grotesque<br>
    Created by Damien Gautier and Quentin Margat (bureau 205)<br>
    Maax contains 4 cuts (Regular, Medium, Bold and Black) and 3 italics (Italic, Medium Italic and Bold Italic).<br>
    Maax will be available on february 2012 on <a href="http://www.editions205.fr" title="www.editions205.fr">www.editions205.fr</a></p>
    <p>Soon...</p><div class="imageWrap"><img src="http://typophile.com/files/Maax001reduc_5301.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Maax002reduc_4021.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Maax003reduc_4588.jpg"></div><p></p>
