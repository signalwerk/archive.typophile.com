      <p>Cześć Jan,<br>
      this is one of those special typefaces for cartography. They used to have pretty generic names, like ‘Kartenschrift’ [map type]. Hard to find samples.<br>
      Your best option might be <a href="http://www.fontshop.com/fonts/singles/linotype/roemisch_com_stehend/?&amp;sample_text=Jungfrau&amp;sample_size=74&amp;update=0">Römisch Stehend</a>. Karten-Augustea is also very close, but it seems to be unavailable.</p>
      <p>By the way, you might enjoy <a href="http://www.flickr.com/photos/hardwig/2524903281/">this g</a> aswell.<br>
      F</p>
