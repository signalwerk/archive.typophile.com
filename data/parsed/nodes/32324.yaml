      <p>I guess Apollinaire's "Il Pleut" had words “crashing letter by letter down the page and onto the end of the page”. 3 versions at:<br>
      <a href="http://perso.univ-lyon2.fr/~edbreuil/litterature/Apollinaire/La-pluie/pluies.html" title="http://perso.univ-lyon2.fr/~edbreuil/litterature/Apollinaire/La-pluie/pluies.html">http://perso.univ-lyon2.fr/~edbreuil/litterature/Apollinaire/La-pluie/pl...</a></p>
      <p>and Stéphane Mallarmé’s "Un coup de Dés" does something similar:<br>
      <a href="http://www.math.dartmouth.edu/~doyle/docs/coup/scan/coup.pdf" title="http://www.math.dartmouth.edu/~doyle/docs/coup/scan/coup.pdf">http://www.math.dartmouth.edu/~doyle/docs/coup/scan/coup.pdf</a></p>
      <p>also check out "Early Visual Poetry 1506-1726" at:<br>
      <a href="http://www.ubu.com/historical" title="http://www.ubu.com/historical">http://www.ubu.com/historical</a></p>
      <p>Filippo Marinetti’s “freed words”<br>
      <a href="http://colophon.com/gallery/futurism/7.html" title="http://colophon.com/gallery/futurism/7.html">http://colophon.com/gallery/futurism/7.html</a></p>
      <p>and Massin’s layout for Ionesco’s "la Cantatrice Chauve"<br>
      <a href="http://paris.blog.lemonde.fr/?name=2006_03_massin_la_canta" title="http://paris.blog.lemonde.fr/?name=2006_03_massin_la_canta">http://paris.blog.lemonde.fr/?name=2006_03_massin_la_canta</a></p>
