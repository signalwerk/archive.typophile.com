      <p>Nothing's up Duncan. The majority of Peter Bilak's essay that you refer to is about experimental <em> type design</em>. Miss G's question is about experimental<em> typographic layout</em>. </p>
      <p>If you have deduced the idea that 'all typography is an experiment' from Hamish Muir's quote then I think you should re-read the essay; it is used in the text as an illustration of diversity of opinion – it is really not the main thrust of the essay – and it is immediately balanced by a counter statement from Melle Hammer (which I think is probably nearer the truth).</p>
      <p>Semantics!? How about the difference between 'through' and 'threw'?</p>
    html_clean: |-
