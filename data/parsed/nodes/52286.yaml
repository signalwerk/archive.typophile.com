    <p>Any ideas as to what typeface this is?<br>
    <a href="http://typophile.com/files/Picture" title="http://typophile.com/files/Picture">http://typophile.com/files/Picture</a> 3_66.png</p>
    <p>Looks very similar to what Adobe Caslon Pro semibold would be if it was an open face version, but for obvious reasons it's not what I need.</p>
    <p>This is another similar font, but again not quite it.<br>
    <a href="http://www.myfonts.com/fonts/typefolio/adriane-lux/" title="http://www.myfonts.com/fonts/typefolio/adriane-lux/">http://www.myfonts.com/fonts/typefolio/adriane-lux/</a></p>
    <p>Anybody want to take a crack at it?</p>
    <p>Thanks in advance.</p>
