      <p>I say this speaking from the point of view of a graphic designer - I think what made matrix so popular in it's day was it's energy openess &amp; brightness. It's has a can-do feeling. It's very california. Optomistic in character. I really like Mark's most recent effort because it maintains these qualities. In some ways his new g fits better than the old one! My only quibble/crit would be that the left side of the bottom bowl feels a tiny bit wonky. </p>
      <p>&gt; To me, Matrix is what it is. If you go changing it, it’s not quite Matrix anymore.</p>
      <p>Yes, I agree. But your 'g' make for a better matrix than matrix! At least for texts. Advertising might be another issue. And Matrix, to be fair, wobbles between text &amp; display  - no?</p>
      <p>Sim (Andr) , Your g's, while excellent in their way, don't seem to fit as well as mark's to my eye. I feel as if I am seeing a 'g' from a page of a pulp novel. It's too scotch-ish I think... Maybe that last part is wrong. The angled terminal is part of the reason I think this. It has no similar feature to draw on in the face so it jumps out. But the real reason I like it it less is the slanted angle of the lower bowl. I think if it were straight I would like it better. Still, they are impressive! </p>
      <p>Just my usual 35 cents...</p>
