    html: |-
      <p>Well, somebody might say "I think this is the best one", and then we can see who agrees/objects, and then the person with that design might become encouraged enough to finish it, and maybe even put out a one-glyph font. BTW, there's really no reason to limit it to one choice. The only thing I personally think people should mind would be to draw the glyph from scratch and not cannibalize contours from the original.</p>
      <p>Personally, I think Kris's is the best so far (considering it fits so well with the rest of the font). The main thing I would change is make the connection between the top bowl and the join a bit thicker.</p>
      <p>hhp</p>
