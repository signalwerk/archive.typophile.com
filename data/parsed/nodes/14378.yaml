      <p>I know she is (or at least used to be) your biggest idol, but that doesn't make her infallible. But anyway, this isn't about her, it's about how to improve a font, in this case how to fix the Achilles Heel of an otherwise wonderful design. Designers do that all the time to existing fonts, even to those by people who are not dead yet. Of course you don't have to participate (just like you never help out in the critiques - and I know exactly why, don't you doubt it - I'm just playing nice) but please don't discourage others; those of us who are here to learn can gain a lot from such an exercise. Heck, with some fancy coding an end-user could conceivably get a much more usable font out of the process even!  :-)</p>
      <p>A font is not a painting.</p>
      <p>hhp</p>
