      <p>A lot of good stuff - I'll try to catch up for real tomorrow.</p>
      <p>But if a second challenge is desired, there's always my post<br>
      of "2005-08-25 22:34" concerning a certain infamous "d"...</p>
      <p>Yet another one might be the lc "f" in the original metal Sabon<br>
      Italic - one of the worst glyphs ever made in any parallel universe.</p>
      <p>And then there's the "a" and "r" in Stone, with their sickly, cloying<br>
      terminals. Those deserve a public flogging with a looong composing stick.</p>
      <p>Or somebody can suggest something else.</p>
      <p>hhp</p>
