    html: |-
      <p>To me, Matrix is what it is. If you go changing it, it's not quite Matrix anymore. But if you want to engage in revisionist type design, I'm game. André asked me to comment on his solution. It's a nice looking g and does pick up on Matrix's design elements, but loses some of its essential mechanical quality. I would redo it more like this:</p>
      <p><a href="http://www.marksimonson.com/matrix-redux.gif" title="http://www.marksimonson.com/matrix-redux.gif">http://www.marksimonson.com/matrix-redux.gif</a> (before on left; after on right)</p>
      <p>I've tried to keep the basic design similar to the original, but I've shifted the proportions and weight around a bit. In doing so, I think it feels more comfortable in its surroundings, but has lost some of its iconoclasm.</p>
    html_clean: |-
      <p>To me, Matrix is what it is. If you go changing it, it's not quite Matrix anymore. But if you want to engage in revisionist type design, I'm game. André asked me to comment on his solution. It's a nice looking g and does pick up on Matrix's design elements, but loses some of its essential mechanical quality. I would redo it more like this:</p>
      <p><a href="http://www.marksimonson.com/matrix-redux.gif" title="http://www.marksimonson.com/matrix-redux.gif">http://www.marksimonson.com/matrix-redux.gif</a> (before on left; after on right)</p>
      <p>I've tried to keep the basic design similar to the original, but I've shifted the proportions and weight around a bit. In doing so, I think it feels more comfortable in its surroundings, but has lost some of its iconoclasm.</p>
