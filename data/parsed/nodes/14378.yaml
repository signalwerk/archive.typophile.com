      <p>(The following was actually posted on August 15 of 2005, but when I tried to edit a typo just now it got bumped to current time. So I'm adding this note to avoid certain confusion. For the record. Etc, etc, etc. As you were.)</p>
      <p>--------</p>
      <p>I'm not a Vendetta kind of guy. Don't scare people away with your self-serving imagination. In fact, ever since RvL graciously apologized to me for what some people associated with Emigre tried -and failed- to do to me, I've actually been helping them out more than pointing out their flaws. When I see something good (like Tarzana) I freely point it out. When I see something bad (like the "Q" in Tarzana) same thing.</p>
      <p>&gt; you jump down my throat.</p>
      <p>I'm not giving you any special treatment. But I used to.<br>
      (I sincerely hope you can figure out what I just wrote.)</p>
      <p>--</p>
      <p>I chose Matrix because the contrast between its overall merits and that ludicrous "g" is greater than any other case that comes to my mind. The idea for this thread popped into my head when somebody in another thread trashed Matrix outright. But I'm not fixated on Matrix, I really do just want to teach/learn. So feel free to suggest another font that's marred by a single (or two) horrid glyphs. And I don't mean you in particular, because anybody who refuses to crit fonts -for the reason I believe you harbor, the same reason you're defending Matrix, and the same reason you turned frigid when Eben suggested you provide some Eunoia glyphs for public modification- is unlikely to participate in this thread... except of course to sabotage it. Who's jumping down whose throat again?</p>
      <p>hhp</p>
