    votes: null
    html: |-
      <p>&gt; People are into it.</p>
      <p>I think about half -Les Grandes Artistes de Notre Ere- are frothing and<br>
      fuming though... :-/  It's a good thing anonymous posting is off now.</p>
      <p>&gt; Like this?</p>
      <p>Looking great.<br>
      I'd just make the right side of the link totally vertical.<br>
      BTW, that ear is genial - I would've never thought of it.</p>
      <p>Also:<br>
      I was going to suggest that you loosen the right sidebearing, but then I realized another dimension to this: ideally we want any replacement glyph to be uniwidth with the original. Can you work with that?</p>
      <p>&gt; I don’t see anything fundamentally wrong with the Perpetua ‘d’.</p>
      <p>Well, chirographers hate it. But of course that is -or at least should be- moot. I however do have a problem with it myself: I think it causes a too-prominent spike in texture. I've actually caught myself stumbling on it during reading. On the other hand, it's certainly an "inspiring" glyph, and has played a role in Patria's "d".</p>
      <p>&gt; What about changing other glyphs to match, like the ‘a’?</p>
      <p>Heyyyy, now that's an idea. That might result in: a more display-like cut; or actually making the "d" no longer ruin the texture! Go with it man.</p>
      <p>hhp</p>
