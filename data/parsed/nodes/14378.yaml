    <p>Take a font with a defective glyph, and fix it.</p>
    <p>First challenge: the "g" in Matrix.</p>
    <p>Let's see what you got guys! And girls. The winner<br>
    gets a free license to some font. Or something.</p>
    <p>But of course just show the new glyph (maybe in<br>
    a word) don't go passing around derivative fonts!!<br>
    And if you don't have the font, use a rendering<br>
    from MyFonts or something.</p>
    <p>hhp</p>
