    <p>Hi everybody, this is my first post here, I became a member to get some critique. (and inspiration!)</p>
    <p>I'm currently designing a, more or less, thematic font that I started 2 years ago but picked up recently again. My question is: What implication do rounded corners have on a font, I just got the idea to make the corners a little softer but i am not sure if it works or what is better or what fits better.</p>
    <p>I included a pdf to show you the differenc, which is only noticable at large corpses now I guess. I do think softer corners do look better on screen</p>
    <p>Any advice anyone?</p>
    <p>(P.S- this is the light weight of my font)</p>
