      <p>hi, thnx for the reply!</p>
      <p>The whole font is basically my own font to use on business cards and other expressions of my own 'corporate identity' shall I say... or just for fun, no specific purpose (shame shame, that's not what i learned in school)</p>
      <p>There will be: </p>
      <p>-lowercase, capitals, smallcaps, ligatures, oldstyle numerals, numerals, etc.<br>
      -3 weights, light, medium &amp; bold<br>
      -roman version &amp; cursive version of every weight.</p>
      <p>(then maybe stylistic alternates like swash... maybe a 'black' weight)</p>
      <p>Maybe I take consistency too serious? I think it's very important, but the terminals are actually different from the serifs. Look at the left top serif of the M, the terminal of the K, and the terminals of the T (or is that a seriph?) They are all different from the regular serif (look at the bottom of the F)</p>
