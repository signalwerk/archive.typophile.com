      <p>Hm, I'm not sure exactly what the implications are, aside from making it less sharp/angular on the page...</p>
      <p>I haven't printed your PDF, but the effect does seem to be extremely subtle... I think that whatever you're more comfortable with is fine.</p>
      <p>As far as the face itself, it's hard to comment on; so far it seems very consistent—perhaps even a little too much so (if there is such a thing). That is, all of the terminals and serifs are identical; I think it would be nice to introduce some variation, so that each character would appear to be a unique drawing made by the same "pen." If nothing else, I think some alternates couldn't hurt.</p>
      <p>Also, what is the intent of the font? I presume this is for display purposes; will there be a lower case?</p>
