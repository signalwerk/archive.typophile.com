      <p>A couple of upright scripts  from Filmotype with similar character strokes: Filmotype Havana <a href="http://www.myfonts.com/fonts/filmotype/havana/" title="http://www.myfonts.com/fonts/filmotype/havana/">http://www.myfonts.com/fonts/filmotype/havana/</a> and Filmotype Horizon <a href="http://www.myfonts.com/fonts/filmotype/horizon/" title="http://www.myfonts.com/fonts/filmotype/horizon/">http://www.myfonts.com/fonts/filmotype/horizon/</a><br>
      Also Brophy Script <a href="http://www.myfonts.com/fonts/mti/brophy-script/" title="http://www.myfonts.com/fonts/mti/brophy-script/">http://www.myfonts.com/fonts/mti/brophy-script/</a> Brody <a href="http://www.myfonts.com/fonts/linotype/brody/" title="http://www.myfonts.com/fonts/linotype/brody/">http://www.myfonts.com/fonts/linotype/brody/</a>  <a href="http://www.myfonts.com/fonts/urw/brody/" title="http://www.myfonts.com/fonts/urw/brody/">http://www.myfonts.com/fonts/urw/brody/</a><br>
      Don</p>
