      <p>No offense, but if you admit you don't know what you're doing, if basic coding &amp; behavioural implementation is out of your reach, if the quality of the graphics is very (very) low and the the overall "development" gives a less-than-solid impression, are you really doing your friend any favours?</p>
      <p>If the skills are out of reach to build from scratch, why not just create a blog-site using a (free) pre-built template? Sure, not much in the way of distinction, but, quite frankly, if the budget is zero, this route at least gives you a well built, functional and standards-compliant web page that does what it's needed to do.</p>
      <p>The web seems to be dangerously tempting for folks to forget the basic principle of "just because you can doesn't mean you should."</p>
