      <p>I have to admit from the outset that web design (and even more the mechanics) is a black art to me, so please ignore any comments which are impossible.<br>
      Ragging is the uneven margin of a text setting, on your home page there are some short (copy light) paragraphs that would probably be better if the measure was narrower, you are trying to achieve a smooth (not dead straight) righthand margin rather than zig-zagging. It isn't easy but is worth looking for, as it will improve not only the first impressions of the site and will make the reading process more pleasant. The term comes from a description of setting, for example, ranged left, ragged right would describe the setting on your (and this) site.<br>
      As a general observation screen graphics tend to look a lot better when there is a neutral background rather than white.<br>
      I also get a heading in my tab saying “Your heading goes here”, this could be something to do with browser software.<br>
      Tim</p>
