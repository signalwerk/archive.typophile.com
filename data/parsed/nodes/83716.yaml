  html: |-
    <p>I'm going to get a tattoo this summer of quotation marks on my hips—something that looks like this (vaguely NSFW) <a href="https://skitch.com/lauramwebster/fjte6/img-2610" title="https://skitch.com/lauramwebster/fjte6/img-2610">https://skitch.com/lauramwebster/fjte6/img-2610</a>. (That's me, they're just drawn on at the moment. And that image is flipped horizontally, which is to say that my mole fits as punctuation—I drew those on in the mirror without realizing they were backwards.)</p>
    <p>However, as a writer and someone who appreciates beautiful type, I feel that the typeface I end up selecting should be something specific. I love the look of rounded quotation marks, which generally seem to belong to the serif family of things... Quotation marks which are simply slanted lines aren't going to cut it.</p>
    <p>Suggestions?</p>
    <p>Thanks in advance.</p>
    <p>P.S. I hope this is in the right forum... let me know if not and I'll move it.</p>
