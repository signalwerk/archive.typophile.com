      <p>I'm voting for the arrow tree. Nice an abstract, but still retains a bit of a literal vibe to it (the houseware industry, for better or worse, tends to use literal identities). (d'oh! Just read that the company doesn't do hardwood...as such, this mark doesn't work.)</p>
      <p>I like the footprint concept a lot, but I agree, it's going to be hard to pull off without it feeling like a dance studio or, perhaps worse, dirty floors. Perhaps a 'shoeless' foot print might work? Pitch the idea of 'floors so nice people go barefoot'? (and to echo my d'oh comment above, I think the footprints are actually more applicable to industrial/commercial flooring...so I think this mark has the most potential...perhaps play off the 'commercial' aspect and really go overboard with the footprints...use a dozen or more of them to emphasis 'long wearing' or 'heavy traffic' or the like)</p>
      <p>The pyramid is likely a 'safe' route to go. Doesn't carry much baggage. Nice and abstract.</p>
      <p>The 'mound', to me, looks like a warped floor. Probably a bad connotation.</p>
      <p>I like your last mark, but I see a TeePee more so than a Pyramid.</p>
