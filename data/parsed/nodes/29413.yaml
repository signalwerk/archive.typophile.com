      <p>Some thoughts on my ideas. Apparently haven't been successful at my attempts. </p>
      <p>The client rejected any kind of cliché like using a carpet, a floor tile, a shield or a crown. So then I thought of the many logos I see every day and not many of them tell me right away what it is, its the icon or the color or the type treatment that lets me identify it as a brand. Then you may learn what the logo is trying to say. I never knew there was an arrow on the Fedex logo until I studied the brand.<br>
      Some examples:<br>
      apple, bp, chase, cingular, city bank and one case study i just read on a logo created by Christopher Simmons for a company called "Paradox Media" were he took a very conceptual metaphor:<br>
      <a href="http://www.gdusa.com/feature/4_03/paradox.jpg" title="http://www.gdusa.com/feature/4_03/paradox.jpg">http://www.gdusa.com/feature/4_03/paradox.jpg</a></p>
      <p>"The classic Paradox. Which came first, the chicken or the egg? This solution takes a multi layer approach, representing the world and conveying a sense of ongoing success. The enigmatic egg--the nascent talent--both confounds and compels the nurturing hen" (words from his book "Logo:Lab")</p>
      <p>Not that this is the best logo in the world, but my point is that there's no techy graphics saying is a media company. I see a pyramid in a couple of my logos that represent an empire in a way and force. I see a world getting covered showing power again empire etc...</p>
      <p>Does someone agree?<br>
      by the way please I replaced the image and removed the first draft type treatments as they were done quickly just to get the idea.</p>
      <p>Thanks</p>
      <p>Kco</p>
