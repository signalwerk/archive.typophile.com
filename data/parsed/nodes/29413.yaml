      <p>&gt;not many of them tell me right away what it is</p>
      <p>I think that is why I liked the footprint option, especially the tilted version, after you have read the text it becomes clear that these are the tracks left by walking on the solutions* – the product is illustrated by its absence. The pyramid concept doesn't give me that revelation, it is a pyramid but I cannot link that with flooring so I am left wondering if the mark has a deeper meaning or no meaning, as Lex says the handrawn version appears to be a tree but the company doesn't do hardwood flooring so that also leaves me wondering. I think the world domination might be too ambitious a concept to represent in an icon while still remaining usable as a logo.<br>
      You are trying a literal approach to the logo which for my taste is better than ending up with a meaningless swoosh or pattern, on the other hand the nature of the product does lend itself to a pattern. I think the problem you are facing is that you are trying to include Imperial as well as flooring solution, as you say, you don't want to emphasise the Imperial part of the name maybe you should concentrate on what flooring solution means and leave the type to announce the Imperial part. I can't offer an answer but I do like the idea of showing something that isn't there.<br>
      Tim</p>
      <p>*a term btw which has become so hugely overused in the UK that its use parodied in a satirical magazine Private Eye</p>
