    <p>The alphabet used by the Romans. Sometimes called <a href="/node/14508" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Latin</a>, the <a href="/node/add/wiki?edit%5Btitle%5D=Latin%20Alphabet" title="Create node &quot;Latin Alphabet&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Latin Alphabet</a>, or <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> (see <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alphabets</a>).</p>
    <p>The Roman’s picked up the concept of an alphabet either, directly or indirectly, from the Greeks during the eigth century <span class="caps">BC</span>. Over time, they would evolve it into what we now think of as <a href="/node/13762" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">capital</a> or <a href="/node/14510" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uppercase</a> letters. The Roman alphabet reached its final form sometime during the Republican era, although <a href="/node/14498" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">serifs</a> would be added a bit&nbsp;later.</p>
    <p>By the reign of the Emperor <a href="/node/14496" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Trajan</a> in the second century <span class="caps">AD</span>, the alphabet had certainly long been “finished”. Nethertheless, letters would later be added to it during the Middle Ages (W and Z, for&nbsp;instance).</p>
    <p>Roman handwriting differed significantly from inscriptional lettering. Over time, handwriting styles evolved into what we think of as various <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a> styles, which later influenced the <a href="/node/13704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carolingian Minuscule</a> around the year 800. These letterforms would be paired with Roman inscriptional forms—”<a href="/node/13807" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lowercase</a>” the the older “uppercase”—during the&nbsp;Renaissance.</p>
    <p>Roman, and later Christian, conquests spread the Roman alphabet far outward from Italy. Today, it is one of the most-used writing systems in the&nbsp;world.</p>
