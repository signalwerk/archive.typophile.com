    html: |-
      <p>I assume a kiosk would still use some sort of embedding - maybe. Depends what they're building it in.</p>
      <p>Check Emigre's site. They have a licensing portion that deals with embedding fonts. At the moment, it's $150 extra to license up to 30 fonts for embedding in flash + the cost of the standard font license.</p>
      <p>As far as I can tell the rules and fees vary a lot! You may need to call the font company to talk them through what you want to do.</p>
      <p>I would think the Adobe font library would be a very good choice if you need to worry about cost and legal issues. I'm sure they're very sympathetic to embedding their fonts in their own products! As far as I can tell they don't require any special licensing - though I may be wrong. I just haven't seen anything on their site about it.</p>
