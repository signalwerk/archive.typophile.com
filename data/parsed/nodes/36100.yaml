      <p>If Emigre says that's the licensing terms, then that's the licensing terms. However, I'd like to think they'd consider some sort of site/bulk licensing for a project like this. You might want to call them and ask.</p>
      <p>If you're are willing to stay within the ballpark style-wise, there is a great free typeface called Kontrapunkt (named after the firm that designed it) though, of course, it isn't nearly as large of a family as Cholla is.</p>
