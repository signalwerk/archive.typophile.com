      <p>There’s a big difference between a Flash file (where font embedding is generally accepted even if it often goes beyond many font EULAs or the embedding permissions encoded within the fonts) and installing the font on a bunch of kiosks. Would you consider it acceptable to stick unlicensed OS’s,  music, video and images on the kiosk? Why is installing unlicensed fonts okay?</p>
      <p>As for Georgia, that would need to be licensed as well, unless each kiosk had a licensed copy of Windows or Mac OS.</p>
