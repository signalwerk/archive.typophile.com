    <p>I'm currently working on a project for an interactive kiosk that is intended to be in shopping malls, airports, etc. The project uses the Emigre Cholla Slab Bold font to display dynamic text in some of the fields. My client just sent me a super panicky email that we shouldn't use the font due to Emigre charging a licensing fee for every computer kiosk it's on and it would drastically blow up the price of the project and we should go with a freebee font like Georgia instead. I've been working with fonts for decades and have never heard of this and while there is licensing info on Emigre's site, I wonder how serious this is and much it is enforced? While I've never done a kiosk before, I've done a bunch of Flash projects using embedded fonts to display dynamic text fields and I've never had the font police come out to get me.</p>
    <p>So has anyone had experience like this? And if we do have to switch fonts does anyone know of a font like Cholla I can use without these licensing issues?</p>
