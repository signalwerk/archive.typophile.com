    html: "<p>Andy's advice is good. <br> <br>I'm not sure exactly what you mean by automatic 'mapping'. <br> <br>As for keeping your style sheets organized, I use a variety of techniques: <br> <br> - I use multiple style sheets when appropriate <br> - I comment like crazy. I typically group my styles into logical, commented groups. ie masthead styles, body content styles, navigation styles, etc.</p>"
