    html: "<p>Chris, <br> <br>I've heard of some who use OmniGraffle or other wireframing software to set up such a tree to help visual a site's style(s). <br> <br>However, unless you need the boxes and arrows, you can accomplish the same thing by structuring your CSS file in a heirarchial fashion with commenting. <br> <br>For example, say you have a calendar in your sidebar on an archives page. <br> <br>You could reference the &lt;p&gt; tags in this heirarchially in your stylesheet as so ('----' used for tab space): <br> <br> <br>.archives #sidebar #calendar p { <br>----font-size:70%; <br>} <br> <br>It's a bit wordy and of course you could simply write \"#calendar p\", but it doesn't hurt and gives you several levels with which to organize, indent and heirarchitize your styles, e.g.: <br> <br>.archives #sidebar  { <br>----width:150px; <br>} <br>----.archives #sidebar #calendar  { <br>--------background:#fefded; <br>----} <br>--------.archives #sidebar #calendar p { <br>------------font-size:70%; <br>--------}</p>"
    html_clean: "<p>Chris, <br> <br>I've heard of some who use OmniGraffle or other wireframing software to set up such a tree to help visual a site's style(s). <br> <br>However, unless you need the boxes and arrows, you can accomplish the same thing by structuring your CSS file in a heirarchial fashion with commenting. <br> <br>For example, say you have a calendar in your sidebar on an archives page. <br> <br>You could reference the &lt;p&gt; tags in this heirarchially in your stylesheet as so ('----' used for tab space): <br> <br> <br>.archives #sidebar #calendar p { <br>----font-size:70%; <br>} <br> <br>It's a bit wordy and of course you could simply write \"#calendar p\", but it doesn't hurt and gives you several levels with which to organize, indent and heirarchitize your styles, e.g.: <br> <br>.archives #sidebar  { <br>----width:150px; <br>} <br>----.archives #sidebar #calendar  { <br>--------background:#fefded; <br>----} <br>--------.archives #sidebar #calendar p { <br>------------font-size:70%; <br>--------}</p>"
