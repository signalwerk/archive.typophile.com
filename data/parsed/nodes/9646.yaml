    votes: null
    html: "<p>Sorry, a few addenda: <br> <br>+ Use id and class names that have meaning. It adds semantic value and makes it easier for you to remember what the style rule is supposed to do/affect. <br>+ Try to use as many of the given elements (h1, h2, h3, p, etc) before resorting to 'classitis'</p>"
