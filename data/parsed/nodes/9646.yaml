    votes: null
    html: "<p>Chris, there are as many different methods as there are folks that use them. There hasn't been a standard that has surfaced, but here are a few things I like to do: <br> <br>+ Separate typographical styles from structural styles <br>+ Group variations of a style together (indented below the main style) <br>+ Be consistent in the way you write your rules, i.e. if you use shorthand, always use shorthand. Makes it easier to find in search/replaces. <br>+ Comment as much as you need to remind yourself of what you did and why</p>"
    html_clean: "<p>Chris, there are as many different methods as there are folks that use them. There hasn't been a standard that has surfaced, but here are a few things I like to do: <br> <br>+ Separate typographical styles from structural styles <br>+ Group variations of a style together (indented below the main style) <br>+ Be consistent in the way you write your rules, i.e. if you use shorthand, always use shorthand. Makes it easier to find in search/replaces. <br>+ Comment as much as you need to remind yourself of what you did and why</p>"
  - id: 61583
