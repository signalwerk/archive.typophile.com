    html: <p><i>I'm not sure exactly what you mean by automatic 'mapping'. </i> <br> <br>Now that I think about it, it's not something that could be mapped automatically. I guess I was looking for a way to create a 'style hierarchy tree' that I could use to quickly see what attributes are controlled at what 'level'. But, since you create that hierarchy only in your naming and use, it's probably not realistic. Really, from what Andy's said, I just need to figure that out for myself. <br> <br>Thank you for the suggestions. If you have any more, keep them coming. I'm going to dive in tonight, so any guidance is great!</p>
