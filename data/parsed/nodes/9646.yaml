  html: "<p>Does anyone know of a standard method for mapping a sites CSS classes, etc.? I'm looking for a way to manage my style sheets in a more user-friendly manner than just a big list. I've been haphazardly messing with the default Movable Type templates and now I need to un-screw them a bit. <br> <br>Related: are there apps that can map this stuff automatically? I do my web stuff straight to the code, so I don't have much knowledge of apps like GoLive, even though I have it.</p>"
  html_clean: "<p>Does anyone know of a standard method for mapping a sites CSS classes, etc.? I'm looking for a way to manage my style sheets in a more user-friendly manner than just a big list. I've been haphazardly messing with the default Movable Type templates and now I need to un-screw them a bit. <br> <br>Related: are there apps that can map this stuff automatically? I do my web stuff straight to the code, so I don't have much knowledge of apps like GoLive, even though I have it.</p>"
