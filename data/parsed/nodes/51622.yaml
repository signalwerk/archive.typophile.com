    <p>Hi, I'm setting a newsletter in Minion and it contains a high proportion of abbreviations, repeated throughout the text in columns. I started with regular capital letters for the abbreviations (such as INGOs, USAID and DFID) but the size of the capitals seems to interrupt the smooth reading of the sentences. I tried small caps but their size does the same, and looks out of place to my eye in running text.<br>
    I read somewhere that it was common to use normal caps reduced by 1 point size or small caps increased by one point. What are others' preferences here?<br>
    I got to wondering about Medium caps, but Minion Pro doesn't have them...is this a common feature? Even Google didn't turn up much about Medium caps.</p>
