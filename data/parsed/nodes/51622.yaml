    html: |-
      <p>You could jump up to a medium weight if you are currently using the regular weight and then reduce the normal caps by a point or so. Increasing the weight keeps the overall color the same. Use your eye; it will tell you what is right.</p>
      <p>(And no, medium caps are not common.)</p>
  - id: 312053
    user: 20652
    date: 2008-11-13T12:14:00
    date_raw: 13 Nov 2008 — 12:14pm
    votes: null
    html: |-
      <p>Yes; the colour does go a bit off when the sizes change, but I think that's less noticeable than full-size abbreviations jarring the eye.</p>
      <p>Not sure I have the medium weight, there was certainly a semibold at work; I'll have to check. Thanks.</p>
      <p>I'll consider putting Medium caps in any text fonts I design. I'd say they'd be more useful than small caps for certain type styles.</p>
  - id: 313206
