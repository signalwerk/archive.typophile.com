    html: |-
      <p>Yes, that solution works very well. In 11 pt regular, 10pt medium caps worked ok for those abbreviations, which were an appropriate size and kept the colour almost exactly right.</p>
      <p>I suspect there are no rules on mid caps above what fits with a particular typeface? Three questions:</p>
      <p>- Has anyone here ever needed/used mid caps? For what?</p>
      <p>- Would it be a benefit to have small AND mid caps in a font? Or just small caps of a nice height (more than lowercase x-height)</p>
      <p>- Would mid caps be halfway between the height of small and full caps? Or nearer full height?</p>
      <p>Thanks ;)</p>
  - id: 313252
    user: 12009
    date: 2008-11-18T18:08:00
