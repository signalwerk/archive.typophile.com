    html: |-
      <p><a href="http://www.fontshop.com/features/fontmag/002/02_atma/" rel="nofollow">FF Atma</a> is one example of a typeface with multiple small cap sizes.</p>
      <p>A number of designs also feature petite caps in addition to small caps; in this case, the small caps are noticeably larger than lowercase x-height, while the petite caps are x-height.</p>
      <p>I can see that different small cap sizes may be preferable for different uses the small caps are put into (acronyms in running text, caps with small caps, all small caps...), but I generally prefer small caps that are significantly larger than x-height.</p>
