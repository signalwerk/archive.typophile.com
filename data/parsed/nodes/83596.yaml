      <p>Not much other than Canterbury has quite such a small x-height.<br>
      Other mid-century modern small-x geometric faces that aren't Futura or Kabel:<br>
      Drescher<br>
      Supergrotesk<br>
      Nobel<br>
      Metro<br>
      Bernhard Gothic</p>
      <p>Updating the concept: Brandon Grotesque, Verlag</p>
      <p>Klingspor produced an ultra-small x-height version of Koch Antiqua (not available in digital?), but AFAIK, did not do the same for its sans sister Kabel.</p>
      <p>I sense a market opportunity for ultra-small x-height faces.</p>
