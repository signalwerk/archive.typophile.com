    html: |-
      <p>it's a long shot, but it could be also a Greek Letter "ν" (pronounced 'n'), horizontally mirrored...<br>
      See for example the /ν/ of <strong>Rider Widest (Ultra-expanded Bold)</strong>:<br>
      <a href="http://myfonts.us/td-tV37hD" title="http://myfonts.us/td-tV37hD">http://myfonts.us/td-tV37hD</a></p>
      <p>Rider Widest is not an exact match off course, because after mirroring the right leg will be much thicker than the left, but you can get the overall idea...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/greek_n_mirrored_5646.jpg"></div><p></p>
