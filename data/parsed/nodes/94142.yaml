    <p>This is part of a logo I'm re-creating, I doubt it was modified, however, I can't find a V that has a serif on the left and not a full serif on the right, that goes to the right. I see some that go to the left.</p>
    <p>Please excuse the choppiness on the sides of the v, this is where there were graphics ... the actual font is not distressed.</p>
    <p>Thank you, I'm thinking this is something obvious and I'm looking too hard!</p>
