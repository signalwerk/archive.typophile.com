    html: <p>I had a situation recently where Veer had a vendor wanting to license a set of fonts for online use. This was the kind of thing like a greeting card where customers choose fonts among other things from a list for their product. Nothing as complicated as customers getting to download copies. So Veer drew up a special Eula for them that was obviously way more than regular license fees. I think they based the price (which I approved) on the scale of the vendors operation.</p>
