      <p>Thank you guys for all your responses, it has been very helpful. Does anyone know roughly how much server-based licensing fees might be? </p>
      <p>Also, would it be risky to use free fonts like the ones found on FontSquirrel.com that have no licenses? (For example: <a href="http://www.fontsquirrel.com/license/Windsong" title="http://www.fontsquirrel.com/license/Windsong">http://www.fontsquirrel.com/license/Windsong</a>)</p>
