    <p>My apologies for being somewhat off topic, but i urgently need the separation values for Pantone 186 C, since the Pantone Process Guide is nowhere to be found in the studio :-(<br>
    Your help is very much appreciated, we're going in print on monday morning…</p>
    <p>P.S. Just found C0, M100, Y100, K10 as the appropriate value on the web, and could of course make up my own, but my gut feeling tells me there's got to be Cyan involved? I want to double check with the Guide as I'm sure you'll understand… Many many thanks in advance.</p>
