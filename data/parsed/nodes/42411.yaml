      <p><em>Just found C0, M100, Y100, K10 as the appropriate value on the web, and could of course make up my own, but my gut feeling tells me there’s got to be Cyan involved?</em></p>
      <p>Indeed, if you combine 100% of magenta with 100% of yellow and 10% of Black, the result will be closer to red than blue.</p>
      <p>Do you have Adobe Photoshop or Illustrator at hand? Or Adobe InDesign, or QuarkXPress? Because their color palettes will allow you to select a Pantone color and then break it up into CMYK values... And the results will be true blue! (Pardon the pun... I couldn't help myself.)</p>
