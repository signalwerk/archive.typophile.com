    html: <p>Fashion fonts - what’s that? Also how do you define “free license?” You could argue that the freely licensed Microsoft Web Core Fonts are amongst the most widely used fonts on the planet. More recently the DejaVu (AKA Bitstream Prima or Bitstream Vera) fonts have found their way into many devices where the makers have wanted to avoid paying license fees. Gentium may have been used in a few places, but the lack of available styles has prevented serious commercial exploitation.</p>
