    html: <p>Yep, site-license rights are typically very similar to those found in end-user license agreements - but with an unlimited or effectively unlimited number of users - limits may include not posting the font on a Web server, limited modification and embedding rights - just as you’d find in a typical EULA. Of course with enough money you can loosen some of these restrictions. The cost of custom type is often comparable to the cost of broad licenses to some fonts.</p>
