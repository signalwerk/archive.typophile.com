      <p>Fashion fonts are fonts which commercial fashion businesses use in all their marketing and communications.  For example, in their promotion literature such as on their websites, posters, leaflets, etc.  For some fashion businesses the font is incorporated into their logo such as Chanel or Calvin Klein. I would assume that Chanel and Calvin Klein have their fonts specially designed for them.  However are there any similar businesses who use free license fonts and if so what other free license fonts are there.</p>
      <p>I would define a commercial “free license” as the permission to use a particular font by a business without any restrictions at all.  But just as with software various conditions on use may exist.</p>
