    html: |-
      <p>“Free” is a loaded term in English, having several meanings. It can mean something provided at no cost, something that can be used without limitation, or a number of other things. Seeing the terms “free” and “commercial” next to each other causes cognitive dissonance.</p>
      <p>What you’re describing is what most would term a “site” license or in larger applications an “enterprise” license. Such a license allows a piece of software to be used at any device in a location or throughout an entire corporation (freely), respectively, without <em>additional</em> charge after the initial license is paid (not free). This may be time-limited, depending on the terms of the license.</p>
      <p>Fonts specified for corporate identity integration are often bought on enterprise license terms (or at least they should be). </p>
      <p>Sometimes there is an exclusivity agreement as part of an enterprise license, especially in the case of custom fonts.</p>
