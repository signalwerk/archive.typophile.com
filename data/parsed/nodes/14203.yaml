    html: |-
      <p>Don't use Freehand as a benchmark for anything -- experience has taught me that Macromedia has its own way of doing things which don't always play nice with other applications.</p>
      <p>Make sure your character set is correctly identified and, if you're exporting as TrueType, try using Unicode mode, instead of names.</p>
