  html: <p>hello, we got a problem in fontlab 4.5. we work on mac os x panther and we kerned a font that we just build. after creating a tt-font the letters äüö don\'t work in indesign or textedit or some characters or not on the correct keys. freehand works. anybody help? thanks</p>
