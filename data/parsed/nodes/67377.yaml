      <a href="http://www.stormtype.com/typefaces-fonts-shop/families-22-baskerville-original" rel="nofollow">Storm</a> and <a href="http://fountaintype.com/typefaces/baskerville-1757" rel="nofollow">Fountain</a> both have interesting and fresh renditions – the former being way more versatile than the latter.</p>
