    html: |-
      <p>Also check for kerning. Some foundries have lousy metrics.</p>
      <p>If you deal with European customers frequently and elect to purchase an OpenType font, check the effectiveness of the Context Sensitive Layout functions with a text sequence such as this:</p>
      <p>‹abc› ‹ABC›<br>
      «abc» «ABC»<br>
      ¡abc! ¡ABC!<br>
      ¿abc? ¿ABC?</p>
      <p>also, </p>
      <p>[abc] [ABC] {abc} {ABC} (abc) (ABC)<br>
      a-b–c—d A-B–C—D</p>
      <p>Don’t settle for a font that does not have small caps either. You might not use it this job, but it will come in handy for the next.</p>
      <p>Mikey :-)</p>
