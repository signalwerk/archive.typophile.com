  html: |-
    <p>This looks very odd to me and I'd like an expert opinion on exactly what is wrong. I'm not great at recognising serif faces but I think the lower-case is a Caslon or perhaps a Garamond. However the upper-case seems to be a different face &amp; possibly manually slanted rather than a true italic. The weight is a bit heavier.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ItalicsR_4438.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ItalicsC_3865.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Italics_5746.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ItalicsB_5125.jpg"></div><p></p>
    <p>The more I look at it I wonder if the lower-case is a mixture or has been tweaked in some way too. The angle of the ascenders of l and d in "Children's" is a bit different.</p>
