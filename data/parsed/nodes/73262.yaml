    html: <p>That’s <a href="http://new.myfonts.com/fonts/urw/garamond-no-5/" rel="nofollow">Garamond No. 5</a>, based on <a href="/wiki/Herbert%20Thannhaeuser" class="freelinking" rel="nofollow">Herbert Thannhaeuser</a>’s <a href="http://www.typografie.info/typowiki/index.php?title=Typoart_Garamond" rel="nofollow">Typoart Garamond</a>. Yes, the uppercase/lowercase relation is supposed to look like that.</p>
