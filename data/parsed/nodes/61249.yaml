  html: <p>At Greater Alion Typefounders we've nearly finished work on our Crewekerne -our arts and crafts inspired Roman project, and will  be releasing it very soon.  Along the way it's grown into three related families and 21 faces!  We've just uploaded a preview of near to release versions of all 21 to our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
