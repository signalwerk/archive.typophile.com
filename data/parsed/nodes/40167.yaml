    <p>Font Software Tutor Required</p>
    <p>We are looking for a font software tutor to provide tuition in one of the main software packages such as Fontlab.</p>
    <p>We would like to design a font and have a very strong idea on how it should look but are not very competent with the various technical rules of font design or the use of the software.</p>
    <p>We are both students based in London and can pay around £6 per hour for the tuition.  We are flexible in terms of the tuition time and place.</p>
    <p>Please contact us if you can help.</p>
