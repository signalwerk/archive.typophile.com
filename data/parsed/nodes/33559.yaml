    <p>I have a question for this esteemed panel:</p>
    <p>If you were asked to teach someone AS MUCH AS POSSIBLE about typography in a single one-hour lecture, what would be the most important issues you would cover? Type terms? History? Families? Or something completely different? </p>
    <p>(While I’m aware this question sounds somewhat akin to “what would you grab to save from a burning house,”  I’m seriously interested in your responses.)</p>
