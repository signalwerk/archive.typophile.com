    html: |-
      <p>I’d spend the hour just <em>looking</em> at typography, and trying to break down a page into all its elements.  I’d talk about the choices that were made in a given example, and other choices that could be made if it was designed differently. And I’d try to emphasize the spatial organization of the page, perhaps even over details of typeface design.  Hopefully the time would be enough to convey the essence of typographical design.</p>
      <p>I’d avoid much talk of technology, history, or jargon — unless you’re asked.</p>
      <p>—John</p>
