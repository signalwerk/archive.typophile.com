    html: <p>What is the purpose of teaching them? Is this informative or practical? History is interesting but not nearly as essential as, say, the fundamentals of using and setting type, kerning, what fonts are appropriate for what type of usage, type terms, etc. I never studied typography but learned it on the job. I am blown away by the knowledge of some of the members of this forum. But I do feel like I could give a quickie lecture on type based on my experience using it.</p>
