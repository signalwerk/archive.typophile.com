    <p>Hello everyone, I'm new here at Typophile.</p>
    <p>Microsoft products (MS Windows &amp; MS Office) come with a variety of serif fonts. If you were limited to use Microsoft serif fonts only (for printed text), which would be your favourites to use?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MS serif fonts_4575.PNG"></div><p></p>
    <p>I like Century Schoolbook, Goudy Old Style and Book Antiqua (Palatino Linotype has a wider line spacing by default).</p>
    <p>Thank you.</p>
  html_clean: |-
