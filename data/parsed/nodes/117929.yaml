    html: <p>Georgia looks good. But don't you think Georgia is a bit too bold for print? It's an often heard criticism... Which line spacing do you use when using Georgia?</p>
    html_clean: <p>Georgia looks good. But don't you think Georgia is a bit too bold for print? It's an often heard criticism... Which line spacing do you use when using Georgia?</p>
  - id: 582758
    user: 41133
    date: 2014-07-13T15:29:00
    date_raw: 13 Jul 2014 — 3:29pm
    votes: null
    html: |-
      <p><em>too bold for print</em><br>
      If I'm going to print something, I don't need to concern myself with whether my reader has the same fonts installed on the device they're reading on. Therefore, I don't need to limit myself to MS system fonts.<br>
      When I do use Georgia, I use leading about 1/4 of the point size (12/15, 24/30, etc ), if space permits.</p>
