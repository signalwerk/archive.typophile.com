    date: 2014-07-13T13:00:00
    date_raw: 13 Jul 2014 — 1:00pm
    votes: null
    html: <p>Like Hrant, I choose Georgia. Matthew Carter has a remarkable ability to apply the master craftsman's touch to mass-produced workhorse typefaces. When I'm writing letters or reports that only have to look professional, not capital-D Designed, I always use Georgia. And when it's necessary for business reasons to work in PowerPoint, I prefer to use Georgia, because it'll look like a grownup did it, but it won't default to Courier on my client's screen.</p>
