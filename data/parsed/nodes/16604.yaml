      <p>from Jens Gelhaar:</p>
      <p>One Ioda was designed by Sue/Susan LaPorte at CalArts in 1991/2 or so. The best way to find her – apart from googling – would be to contact the Alumni department at CalArts, at <a href="mailto:alumni@calarts.edu">alumni@calarts.edu</a>.</p>
      <p>LaPorte is now at the College for Creative Studies. <a href="http://www.ccscad.edu/">CCS</a></p>
