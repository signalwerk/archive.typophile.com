    html: |-
      <p>According to <a class="freelinking external" href="http://www.larcobaleno.com" rel="nofollow">their website</a>, they use '205 Maax Medium LAB' ('LAB' standing for L'ArcoBaleno) which happens to be a custom version (how much?) of <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax" rel="nofollow">Maax</a> 205 by Damien Gautier. The main difference is /a which looks to be a mix between of the top of regular /<a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax/medium/glyphs.html?render=old#glyphs/556267/93" rel="nofollow">a</a> and bottom of <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax/medium/glyphs.html?render=old#glyphs/556267/426" rel="nofollow">alternate</a>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4102.png"></div><p></p>
