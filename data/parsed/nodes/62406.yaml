    <p>I’m a senior in college and I’m about to graduate with my BFA in graphic design. This semester I’m taking portfolio prep and we have to brand ourselves. I’m by far my own worst customer. I cannot find a font that suits me. Here is what I’d like to convey:</p>
    <p>-Sophistication<br>
    -Yet light-hearted and a bit sweet<br>
    -Simple</p>
    <p>I want to be a textile designer so I was thinking that the font probably needs to contrast with the potentially overwhelming designs. It will probably need to be a little bold and really simple. </p>
    <p>One of the main problems is that my name (Mikelle Williams) has so many of the same letters and the “e”s and the “i”s next to the “l”s look weird. Any suggestions?</p>
    <p>Thanks a million,</p>
    <p>Mikelle</p>
