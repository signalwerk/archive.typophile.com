      <p><cite>I’m by far my own worst customer ...</cite></p>
      <p>Yeah I know what you mean :-P</p>
      <p>Your three rules are really a good starting point. It rules out neutral fonts (Helvetica, Calibri, Minion, Palatino), all sans (Myriad <em>et al.</em>) and a good deal of serifs (Times, Jenson, all Garamonds). Why not try a few sturdy, bold script fonts? <a class="freelinking-external" href="http://new.myfonts.com/fonts/linotype/brody/">Brody</a> came to mind, as it has well-defined, thick curves, nice capital ’M’s and ’W’s, and big loopy ’l’s, which are clearly different from the ’i’. I’m just not wild about its ’s’. Perhaps you could change it to a real one, with a huge end flourish.</p>
