      <p>Sorry to disagree, I would agree with Jan, I also think it's a Bodoni for ZEN AND JAPANESE CULTURE - look at the J and the R and the C for that matter too.</p>
      <p>Possibly Bulmer for the Italic.</p>
      <p>If this was originally published in 1959 it could well have been decided by what fonts the typesetter had available.</p>
      <p>The publisher's credit at the bottom is an entirely different serif of a small caps proportion.</p>
