    <p>Hello,</p>
    <p>I'm trying to match this family, specifically the italic for the author's name. I figured it's Bodoni, but the swashes in the italic capital 'T' and the italic lowercase 'k' are really throwing me for a loop.</p>
    <p>Since this is a reprint of a book that was originally published in 1959 with multiple printing through the 70s and 90s it may very well be something that wasn't digitized. That makes things difficult for a publisher who wants to add copy to the beautiful title page spread.</p>
    <p>Help? Someone, please? Thanks!</p>
