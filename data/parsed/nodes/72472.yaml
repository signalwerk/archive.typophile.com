      <p>I assume this is primarily a matter of display, in which case being more "typographic" is not necessarily the thing. </p>
      <p>If you want it too look like Wright's lettering on architectural drawings, then I suppose all caps of Eagle Feather will work. </p>
      <p>If you want hand writing, then the eccentric and period Midway may work in giving it a unique flavor. </p>
      <p>The low contrast all caps may be authentic, but they don't say "Frank Lloyd Wright" to me.</p>
      <p>Incidentally, I don't think Wright's decoration and writing were his strong suit in any case. In general it's his awesome interior spaces. For decoration, I much prefer his teacher, Louis Sullivan.</p>
