      <p>Bert — To be fair, we can’t be sure whether the type for <em>The House Beautiful</em> was spec’ed by FLW or by his partner in this venture, William Herman Winslow, who owned the private press. FLW designed the page schemes and ornamentation, obviously. But he may not have been directly involved in the composition of the text. And the all-caps was not out of keeping with the small, private, vanity press style of the day (ca. 1896–7).</p>
      <p>Nick — I don’t know that we [I did some of the research on this for DB, including those photos] ever positively nailed the type. Without any lowercase, it’s a little tricky. But my conclusion was either Custer from Western Type Foundry (out of Chicago, near to where this was printed) or Cushing No. 2 from ATF (which also had a Chicago office). </p>
      <p>MacGrew states that Custer was a copy of Cushing No. 2 (not to be confused with Cushing Oldstyle or Cushing Antique). Both were precursors to some of the later Bookman series.</p>
