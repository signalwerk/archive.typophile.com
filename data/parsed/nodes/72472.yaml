    <p>Hello everyone,</p>
    <p>I'm designing a two-pocket folder for a Hotel whose architecture is based on the designs of <a href="http://en.wikipedia.org/wiki/Frank_Lloyd_Wright">Frank Lloyd Wright.</a> I'm looking for a typeface that can appropriately harmonize or allude to his work and organic architecture in general.</p>
    <p>For better or worse, this design is to highlight the wedding and reception services that the hotel (and adjacent mansion) facilitate. So a straight up typeface emblematic of Wright's work may or may not fit the bill. That said,</p>
    <p>I'm curious of:<br>
    • if anything comes to mind immediately, and<br>
    • if you can think of a script typeface that still embodies Wright.</p>
    <p>That last one is a tall order but maybe there's hope.</p>
    <p>Thanks all!</p>
