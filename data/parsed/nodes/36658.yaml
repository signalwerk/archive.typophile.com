    <p>Hi there, </p>
    <p>I am writing my first article in a monthly column for a popular Japanese design portal/blog called CBC-NET.</p>
    <p>My article is basically a call for Japanese designers to consider contemporary typefaces for their designs, basically a continuation of the theme for my interview series on <a href="http://www.aqworks.com/blog" rel="nofollow">my own site</a>. </p>
    <p>One of my arguments is that recent typefaces are more likely to work better on the screen, thanks to lower-contrast strokes, larger x-heights, more open forms. I know this isn't always the case, there is plenty of old type that is suitable for the screen and plenty of new type that isn't, but I suppose that typography for the web has become a consideration for many type designers during the design process. </p>
    <p>So my question: </p>
    <p>Can you recommend some typefaces that I can introduce in my article where screen use was a consideration? I'm not really looking for OS system fonts, pixel fonts or anything that specific designed for the screen, but something that was designed for general use, but for which screen use was *one* consideration. </p>
    <p>I'm hoping to introduce a few serifs and a maybe one sans, the serifs because they traditionally have more trouble on the screen. Some low-contrast serif faces I was considering: Dolly, Fedra, Jenny. </p>
    <p>thanks for your help!</p>
