    html: |-
      <p>tittle |ˈtitl| noun [in sing. ] a tiny amount or part of something : <cite>the rules have not been altered one jot or tittle since.</cite></p>
      <p>• archaic :  a small written or printed stroke or dot, indicating omitted letters in a word. </p>
      <p>ORIGIN late Middle English : from Latin titulus (see title ), in medieval Latin ‘small stroke, accent’ ; the phrase jot or tittle is from Matt. 5:18.</p>
