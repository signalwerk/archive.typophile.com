    html: |-
      <p>The dot over the »i«  or  »j« is called a <a href="/wiki/tittle" class="freelinking" rel="nofollow">tittle</a>.<br>
      The dots of the lowercase »j« have a slightly larger dot compared to the »i« to compensate for its form.<br>
      (not neccessory in all typefaces)</p>
