    html: <p>I intend to! The project for which I am doing research is purely handmade. I like to study the type, lettering, and penmanship of a period together as they often inform one another. I'd really like to learn how the principles of Post Impressionism, balancing natural perception with its expressive or investigative distortion, shaped letters cut, drawn, and written.</p>
