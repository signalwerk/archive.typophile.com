    html: <p>The lettering that I would associate with Post-Impressionism would be that which appears on the poster art by artists like Henri de Toulouse-Lautrec and Théophile-Alexandre Steinlen (and maybe some other Art Nouveau folks like Alphonse Mucha). These were color lithographs, and thus not made with type, strictly speaking. So you may find some people referring to Post-Impressionist type with these posters in mind, but people who know what they are talking about (like Bringhurst) know that this is lettering, not typography.</p>
