    <p>Hello all. I'm researching Post-Impressionist type and typography but finding a dearth of literature and online articles concerning design spawned by this very painterly movement. Bringhurst is mum on the subject other than to say that the style "raised waves in the typographic world". I've been amassing historic posters for shows by relevant artists (Cézanne, Gauguin, Matisse, early Picasso, etc.) to see what typographers were doing at the time but it would be great to read a retrospective analysis of how these typefaces and designs relate to their concurrent artistic movement.</p>
    <p>Has anyone read anything like this?</p>
