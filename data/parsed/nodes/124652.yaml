  html: |-
    <p>I'm looking into designing a font which would be most suitable for reading on a projector screen in reverse contrast (white on black). It will be generally for large screens (10 - 50 feet wide) and read at a distance. It will usually be small blocks of prose, rather than single words or short phrases.</p>
    <p>What attributes should such a font have? I'm guessing it should have clearly formed counters (to make the reverse contrast easier to read) and strong horizontal strokes to prevent the eye from skipping lines, but I don't really know. Or are there any existing fonts which you know will be suitable, which I can either learn from or use?</p>
