    html: |-
      <p>The stroke width will appear differently for positive and negative contrast, but that doesn’t mean that you would choose a specific design for a certain type of contrast.</p>
      <p>And regarding the design: It would heavily depend on the perceived font size and the resolution of the projector. If the perceived font size and the resolution of the monitor are large enough, you might be able to go with almost any kind of type design. But if the font size gets too small, you need to get low contrast (regarding stroke width changes, x-height, counters, serifs …). If the resolution gets too small, you would need to consider screen-specific effects, which fonts like the already mentioned Georgia and Verdana master quite well. The operating system or app and their render engine also heavily effect the outcome when very few pixels are used for each character.</p>
