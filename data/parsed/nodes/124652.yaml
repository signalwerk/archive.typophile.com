      <p>Verdana and Georgia are designed for screen use and have lower cases -- unlike most of the fonts in the reverse tag list above. I don't know if a reverse/negative version is available. The Bodoni on the list has a lower case, but it is very high contrast and might be difficult to read.<br>
      Don</p>
