      <p>Mike, what do you know of the geniune origins of Pretoria? The more I think about this paint scheme, the odder it seems.</p>
      <p>Motor racing in general, and particularly the Porsche 917 in its various guises has long been a fascination of mine.</p>
      <p>It undoubtedly was created in 1971, and the popular version of the story is that the pig "joints" and names were done as a bit of fun when the body came back from the aerodynamicists 5 inches wider (7ft 3in!) and generally much bulkier than its sleeker cousins.</p>
      <p>There's a lot of letters on the car and it seems an odd font to choose in the days before computer plotters.</p>
      <p>Unless perhaps it was in general use in butcher's shops around Stuttgart in the late 60s.</p>
      <p>My (early 80s) Letraset catalogue doesn't offer anything helpful.</p>
      <p>PS I can't believe I couldn't ID thisfirst time around :-{</p>
      <p>Anyway, just for fun, here's another image, from Le Mans 1971 (with just a glimpse of one of it's Martini liveried siblings on the right)<img src="/web/20180928102328im_/http://www.typophile.com/sites/default/files/old-images/917_20_4137.jpg">Picture credit unknown, copied from Porsche 917, The winning Formula by Peter Morgan</p>
    html_clean: |-
      <p>Mike, what do you know of the geniune origins of Pretoria? The more I think about this paint scheme, the odder it seems.</p>
      <p>Motor racing in general, and particularly the Porsche 917 in its various guises has long been a fascination of mine.</p>
      <p>It undoubtedly was created in 1971, and the popular version of the story is that the pig "joints" and names were done as a bit of fun when the body came back from the aerodynamicists 5 inches wider (7ft 3in!) and generally much bulkier than its sleeker cousins.</p>
      <p>There's a lot of letters on the car and it seems an odd font to choose in the days before computer plotters.</p>
      <p>Unless perhaps it was in general use in butcher's shops around Stuttgart in the late 60s.</p>
      <p>My (early 80s) Letraset catalogue doesn't offer anything helpful.</p>
      <p>PS I can't believe I couldn't ID thisfirst time around :-{</p>
