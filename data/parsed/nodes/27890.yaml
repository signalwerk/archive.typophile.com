      <p>It does look pretty similar doesn't Si?</p>
      <p>I can't help thinking that the ProSpeed Competition rather missed the point though.</p>
      <p>In 1971 Porsche commissioned SERA (a French aerospace consultancy) to refine the aerodynamics of Porsche 917k <img src="/web/20180928102328im_/http://www.typophile.com/sites/default/files/old-images/917k_4921.jpg] for the Le Mans race, they evolved the shape into the 917/20[img:sites/default/files/old-images/91720_4673.jpg"> The people back at Porsche decided that it looked like a pig and lettered it with the names of the various cuts in German. The car was entered in the race by Porsche Austria whose sponspors Martini refused to allow any Martini branding on the car, which retired during the night, crashing because of brake failure.</p>
