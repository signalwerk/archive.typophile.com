    html: <p>Careful. Back in the Seventies, when <em>National Lampoon</em> magazine switched from boring fonts (Century Schoolbook for text and Times Extra Bold for headlines) to "funny" fonts (Cooper Oldstyle for text and Gill Sans Extra Bold for headlines), it became less funny. It's like when a comedian laughs at their own jokes. I think the deadpan approach is usually better, though I suppose it depends on the type of humor.</p>
