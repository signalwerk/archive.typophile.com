    <p>Ok, I am looking for the most fun font in the world for a new magazine. I'm talking body font, I have already found the funnest headline font. It needs to be legible, versatile and FUN [did I mention that already?].</p>
    <p>Here are some that I have turned down:</p>
    <p>American Typewriter: Already used by Butt magazine.</p>
    <p>Comic Sans: No italic version. </p>
    <p>Any suggestions? </p>
    <p>Come on people, let's find the funnest font out there. Best suggestion wins a whole load of fun; don't ask me how.</p>
