      <p>I couldn't agree more with Mr. Simonson. Fonts designed to be fun are completely annoying:</p>
      <p><cite>It’s like when a comedian laughs at their own jokes. </cite></p>
      <p>The only designed-to-be-fun font that's half-way fun is Comic Sans because it epitomizes the whole stupid notion of a fun font, so much so that you can't help but laugh at it. And I feel a little bit like a broken record on this one, because I've stood up for it many times before here on Typophile: Dr. Suess singlehandedly made Century Schoolbook the funnest font of all time.</p>
      <p>And if you <strong>really</strong> want fun, you don't go the font route. <a class="freelinking external" href="http://www.heavydutypress.com/sphere/3.4_9/sphere/3.4_10" rel="nofollow">You write it out by hand</a>, comic book style.</p>
    html_clean: |-
