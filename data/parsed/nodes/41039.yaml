    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 17.Jan.2008 11.15am </div>
      <p>B&amp;P is proud to present the new annual IdPure Special Type Issue. This<br>
    year, IdPure asked B&amp;P to conceive, direct and design it. The IdPure<br>
    Special Type Issue 07 features exclusive interviews with: Nikola  Djurek,<br>
    Kai Bernau, Anton Koovit, Pascal Zoghbi, Christian Schwartz, Frederik<br>
    Berlaen, Xavier Dupré. It also features special reports on the teaching<br>
    of contemporary typedesign in switzerland (ECAL, HGKZ), all this<br>
    punctuated by stunning photographs of the swiss mountains by Tonatuh<br>
    Abrosetti.</p>
    <p>For more informations, please visit the B&amp;P Typefoundry website's<br>
    "Publications" section: http://www.bpfoundry.com/</p>
