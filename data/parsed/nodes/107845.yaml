    html: <p>I should also mention that the f is driving me nuts. So far I've tried four different variants and don't seem to be 100% happy with any of them. The example above is a compromise. I wanted to keep the ascenders and descenders fairly constrained, 20% of cap height, and as you see the lowest points of the p, g, y, j etc. all align. The top of the f aligns then with the h, l etc. but begins to look too constrained. And I've had to exceed that height when it comes to the fi and fl ligatures.</p>
