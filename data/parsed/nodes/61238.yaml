    html: <p>No disrespect, but I've got to mention that someone has misinformed you about the origin of the neighborhood name. SODO is short for "South of the Dome," not "South of Downtown." The name was contrived by boosters of the warehouse district south of the since-demolished Kingdome Stadium. Although Starbucks Headquarters is definitely within SODO, the Showbox Theater is in downtown Seattle right across the street from Pike Place Market, which is miles north of the SODO area.</p>
    html_clean: <p>No disrespect, but I've got to mention that someone has misinformed you about the origin of the neighborhood name. SODO is short for "South of the Dome," not "South of Downtown." The name was contrived by boosters of the warehouse district south of the since-demolished Kingdome Stadium. Although Starbucks Headquarters is definitely within SODO, the Showbox Theater is in downtown Seattle right across the street from Pike Place Market, which is miles north of the SODO area.</p>
