    <p>Feedback please, cause I've been looking at this too long. Thanks in advance!</p>
    <p>I was asked to design a logo for an Seattle neighborhood blog to be called "Around SODO" - short for "south of downtown". It's a gritty urban hood known for a sports stadium, light industry &amp; warehouses, Starbucks &amp; Tully's HQ, light rail and freight rail, low-rent artists' studios, and a nightclub or two. </p>
    <p>I was going for an industrial yet eccentric, lively look. It's designed for screen resolution. I'm using grayscale so I won't be distracted by color at this stage. </p>
    <p>I have tried two stencil fonts for the letters SODO, one angular, one circular. I've tried angular and round fonts for "around" - lower case for informality. The graphics suggest travelin' around or city blocks, buildings, train tracks. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/around-sodo-logo-ideas1_4145.gif"></div><p></p>
