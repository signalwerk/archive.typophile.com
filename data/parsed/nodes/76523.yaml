    <p>Hello,</p>
    <p>So I am starting a book project for which I am using a very complete and well designed typeface, the files are .otf. I thought .otf meant OpenType and that's it, I just discovered the different OpenType flavored types, which I don't quite understand yet, anyway, not the point...</p>
    <p>So I checked and my typeface is an OpenType (Postscript Flavored).</p>
    <p>Now... I am using the Book weight, which contains all the basic characters, but not the ligatures. For the ligatures, there is the Book Alt version, which contains all the nice ligatures that I would like to use in my text treatment...</p>
    <p>From what I understand, OpenType would contain everything in one font file, these flavored things do not, because of the 256 glyphs limit, right?</p>
    <p>Anyway, so how would I go about setting InDesign (CS5) to automatically recognize "st ct ff fi fl" etc etc., and replace them with the ligatures from the Book Alt font file?</p>
    <p>I know OpenTypes discussions are all over the place, but I couldn't find an answer for that specific case.</p>
    <p>Please anyone, any help will be greatly appreciated.</p>
    <p>Thank You.</p>
    <p>:)</p>
