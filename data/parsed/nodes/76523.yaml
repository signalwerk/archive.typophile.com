    html: |-
      <p><cite>From what I understand, OpenType would contain everything in one font file, these flavored things do not, because of the 256 glyphs limit, right?</cite></p>
      <p>Both OpenType "flavours" does support 16,384 glyphs and thus must include all features (ligatures, alternates, small caps, tabular figures, etc.) in one single file. The problem here is your font file, which does not include all glyph it would contain. Maybe they are just converted Type1 files, without any additional OpenType resources.</p>
      <p>To workaround this, you can use GREP styles and substitutions, as Clauses said. If you don't know about GREP, take a look on InDesign Help and on articles about GREP at <a class="freelinking external" href="http://www.bing.com/search?cp=1252&amp;FORM=FREESS&amp;q=GREP&amp;q1=site%3Aindesignsecrets.com" rel="nofollow">InDesign Secrets</a>.</p>
