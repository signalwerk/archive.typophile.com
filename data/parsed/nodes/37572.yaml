      <p>Using quasi-botanical and quasi-anatomical similes lead to confusion, I would imagine that there are various overlapping terms that could be applied to many typographic terms; join (rather than joint) has the benefit of not falling in either camp. To my mind branch refers to the stroke including the join but more to the stroke, the join itself could be (and is) referred to as a bowl join, neither is wrong.</p>
      <p>Tim</p>
