      <p><em>...branching is an acceptable extension too – but they aren’t the only terms.</em></p>
      <p>I’m not saying they are the only terms, but that “branching” has desirable qualities over “join” or “joint”.</p>
      <p><em>Did he suggest that or would it be impolite to suggest you read the posts?</em></p>
      <p>Mitchell Bills borrowed “join” from calligraphy. I read the posts but misremembered who said it. I don’t think you’re being impolite. Gee whiz.</p>
      <p><em>...I am confused why the Futura h has ‘topology answering to a “joint”’ but the area in Pablo’s post is ‘branching’</em></p>
      <p>I wrote: “...in faces with geometric topology eg: Futura and Bodoni, h, n, m, b, d, p, q, u <strong>are more branch-like than joint-like.</strong>”</p>
      <p>I also made a mistake: “A star denotes topology answering to a “joint”. A dot denotes topology resembling the branching of a tree.”</p>
      <p>Strike that, reverse it. Other way around. A star denotes topology resembling the branching of a tree, and a dot denotes topology answering to a joint.</p>
      <p>Sorry about that. I had a double brain anyeurism at the end of January this year which nearly killed me, and my logic functions are not as agile as they used to be due to the brain trauma caused by bleeding and fluid pressure during the sub arachnoid haemorrhage part. I can still think very clearly but am prone to making clerical errors.</p>
      <p>In my first post I offered “branching” as the general term for the joining of stroke to stem. Pablo’s example is more like a join than a branch. If he wants to call it a join that’s fine with me. I’m suggesting “branching” as an umbrella or meta term.</p>
      <p>j a m e s</p>
