  - id: 230594
    user: 9349
    date: 2007-09-29T00:48:00
    date_raw: 29.Sep.2007 12.48am
    votes: null
    html: |-
      <p><em>I am not aware of any more specific terms.</em></p>
      <p>That was true until now.</p>
      <p><em>Where are the images from you are showing? Or did you make the terms up yourself?</em></p>
      <p>I did not make up the terms “branch” and “branching” myself. See below. The images I’m showing are samples I put together using common typefaces to illustrate what I’m talking about. Is there some kind of problem with that?</p>
      <p><em>Can you provide any reference for that? Has any renowned typographer ever used the term in this way? Or did you make that up?</em></p>
      <p>I improvised. I did say “could be applied”, rather than stipulating it as standard terminology.</p>
      <p><em>The question is not what they should be called but what they are called.</em></p>
      <p>See below.</p>
      <p>Why am I supposedly “in no position to define terminology”? Because I live in Australia, have only  produced a few good typefaces, and lack formal studies? None of that counts because my specialty is philology and lexicography. Australia is certainly a cultural backwater, but I am as far from the average Australian as you can get in terms of culture, reading, intellect and erudition.</p>
      <p>TimD,<br>
      if “branch” and “branching” are so confusing because of their quasi-botanical, quasi-anatomical nature, why is “stem” a widely-accepted typographic term? Few people if any complain about “type<em>face</em>” either. What about “arm”, “beak”, “body”, “ding<em>bat</em>”, “ear”, “eye”, “<em>hair</em>line”, “leg”, “occulus”, “spine”, “tail”, and “teardrop terminal”? All of these except “leg”, “occulus” and “spine” appear in the glossary of Indie Fonts 1 as well as other type glossaries, and are routinely pressed into service in discussions at Typophile. “Leg”, “occulus” and “spine” show up on threads here too.</p>
      <p>Are you going to opine that these terms are quasi-anatomical? </p>
      <p>“Beard” as an alternative to “spur” on a capital G does not appear in the Indie Fonts gloassary either, but some type designers I correspond call it a “beard”.</p>
      <p>“Bar” is an abbreviated form of “crossbar”. It shows up as “bar” in the <a href="http://www.microsoft.com/typography/glossary/ch2.htm">Microsoft glossary</a>.</p>
      <p>Quote: “BARS<br>
      are where you go to drown your sorrows. They are also the horizontal strokes that run into verticals in H and A. </p>
      <p>e also has a bar, even if it is oblique, sloping slightly upwards, as in Venetian faces like Centaur. In that case you might call this a cross stroke, because people would know what you mean, but you shouldn’t, because a </p>
      <p>CROSS STROKE<br>
      is really open on at least one end as on t and f and Ð.”</p>
      <p>End quote.</p>
      <p>If you think the Microsoft glossary lacks credence, what makes you think your opinions are any more credible? Typophile’s typowiki gloassary is quite good but omits “spine” and “occulus”.<br>
      /TimD</p>
      <p>Why do we speak of typeface structure and topology as “anatomy”? Because it makes sense and is useful in analogy. It’s figurative use of language. If you don’t understand the philiogical meaning of “figurative”, please look it up in a good dictionary. Typographers, type designers and type historians aren’t the only people who borrow and adapt terminology from human anatomy and other disciplines. Architects and industrial designers do it too.</p>
      <p>If you find “branch” and “branching” objectionable terms it may be because you’re encountering them for the first time now. Owen Jones uses the term in The Grammar of Ornament, and Alexander Nesbitt uses it in The History and Technique of Lettering. I can’t recall if Bringhurst uses it. If not that’s a disappointing omission.</p>
      <p>I don’t have time to locate specific instances in the printed books referred to above because I’m very busy.</p>
      <p><a href="http://www.google.com/search?hl=en&amp;q=calligraphy+%2Bbranching&amp;btnG=Search&amp;meta=">Google search for <strong>calligraphy +branching</strong></a>:</p>
      <p>From The Calligraphy Glossary at <a href="http://www.callig.ru/misc/glossary.pdf:" title="www.callig.ru/misc/glossary.pdf:">www.callig.ru/misc/glossary.pdf:</a> “Branching stroke: The stroke which connects an arch to the downstroke of a letter.”</p>
      <p>From <a href="http://www.sharonzeugin.com/pdf/Coursedescriptions2.pdf:" title="www.sharonzeugin.com/pdf/Coursedescriptions2.pdf:">www.sharonzeugin.com/pdf/Coursedescriptions2.pdf:</a> “We will then modify Italic characteristics such as x-height, slope, arches and branching in creating our own personalized variations of the lettering.”  </p>
      <p>Branching is in widespread use by calligraphers:<br>
      <a href="http://www.roehampton.ac.uk/pdp/cc/cc.html" title="http://www.roehampton.ac.uk/pdp/cc/cc.html">http://www.roehampton.ac.uk/pdp/cc/cc.html</a><br>
      <a href="http://www.reuels.com/reuels/Calligraphy_Glossary.html" title="http://www.reuels.com/reuels/Calligraphy_Glossary.html">http://www.reuels.com/reuels/Calligraphy_Glossary.html</a><br>
      <a href="http://www.letteringdesign.com/debbyclasses.html" title="http://www.letteringdesign.com/debbyclasses.html">http://www.letteringdesign.com/debbyclasses.html</a><br>
      <a href="http://www.scarletstarstudios.com/blog/archives/calligraphy/" title="http://www.scarletstarstudios.com/blog/archives/calligraphy/">http://www.scarletstarstudios.com/blog/archives/calligraphy/</a><br>
      <a href="http://www.designingletters.com/html/arrghi/struggling.html" title="http://www.designingletters.com/html/arrghi/struggling.html">http://www.designingletters.com/html/arrghi/struggling.html</a></p>
      <p>That has to give the term some credence. Tim Ahrens suggests borrowing “join” or “joint” from calligraphy. I must have erred by not suggesting you guys needs to read more calligraphy manuals as well. </p>
      <p>What I am trying to do here is raise the bar. “Join” or “joint” seem inadequate. “branch” and “branching” are more specific, and linguistically richer, just like “ear”, “beak” and “leg”. But apparently typographers here aren’t hip to it, so bugger it, let’s just call it a “joint”.</p>
      <p>“Branching” may not be the accepted typographic term (I concede happily), but typography is an evolving art subject to additions, change and development.</p>
      <p>j a m e s</p>
