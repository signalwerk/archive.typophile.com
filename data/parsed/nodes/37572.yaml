    html: <p>There is very little in type where there is a broad consensus and even when there is there are holdouts and even legitimate exceptions. It’s not a matter of getting to know &amp; memorize a cannon so much as it is a matter of learning multiple ways of doing &amp; describing. That’s why something that really does seem universal or to have a consensus is such a big deal. Terms for ’type anatomy’ are often multiple in English - partly because we have a lot of terms to play with. Think of bowl, aperture, opening, hole. I bet there are a few more. I don’t have a problem with avoiding a state of ’orthodoxy’ in this case. I even think it’s healthy.</p>
