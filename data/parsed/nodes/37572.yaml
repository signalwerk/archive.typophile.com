      <p><a href="http://www.linotype.com/38/newsletter.html" title="http://www.linotype.com/38/newsletter.html">http://www.linotype.com/38/newsletter.html</a> “The deep <strong>branching</strong> of curves from main strokes helps this humanist sans to be very readable at smaller sizes.</p>
      <p><a href="http://www.paratype.com/fstore/fonts/Linotype-Ergo_CE.htm" title="http://www.paratype.com/fstore/fonts/Linotype-Ergo_CE.htm">http://www.paratype.com/fstore/fonts/Linotype-Ergo_CE.htm</a> “The deep <strong>branching</strong> of curves from main strokes helps this humanist sans to be very readable at smaller sizes.” </p>
      <p><a href="http://www.stonetypefoundry.com/Resources/ITC%20Stone%20Specimen%20Book.pdf" title="http://www.stonetypefoundry.com/Resources/ITC%20Stone%20Specimen%20Book.pdf">http://www.stonetypefoundry.com/Resources/ITC%20Stone%20Specimen%20Book....</a> “The <strong>branching</strong> in the lowercase letters abdgpqhmn is one such cursive characteristic.”</p>
      <p><a href="http://www.aiga.org/content.cfm/the-digital-past-when-typefaces-were-experimental" title="http://www.aiga.org/content.cfm/the-digital-past-when-typefaces-were-experimental">http://www.aiga.org/content.cfm/the-digital-past-when-typefaces-were-exp...</a> “ITC Charter...in its wedge-like serifs and abrupt <strong>branching</strong>...”</p>
      <p><a href="http://blogs.msdn.com/jensenh/rss_tag_Fonts.xml" title="http://blogs.msdn.com/jensenh/rss_tag_Fonts.xml">http://blogs.msdn.com/jensenh/rss_tag_Fonts.xml</a> “Candara is a casual humanist sans with verticals showing a graceful entasis on stems, high-<strong>branching</strong> arcades in the lowercase...”</p>
      <p><a href="http://typographica.org/001105.php" title="http://typographica.org/001105.php">http://typographica.org/001105.php</a> “...the bowl shapes, stressing, <strong>branching</strong> from stems, serif design and serif mating...”</p>
      <p><a href="http://en.wikipedia.org/wiki/History_of_western_typography" title="http://en.wikipedia.org/wiki/History_of_western_typography">http://en.wikipedia.org/wiki/History_of_western_typography</a> “...Fell italic types were distinguished by high contrast matching the Fell romans; wider ovals; a <strong>split-branching</strong> stroke from the stems of m n r and u...”</p>
      <p><a href="http://www.magtypo.cz/buxus/generate_page.php?page_id=393&amp;buxus_typo=5ea8e53c4a67bae215f0a61478dd685e" title="http://www.magtypo.cz/buxus/generate_page.php?page_id=393&amp;buxus_typo=5ea8e53c4a67bae215f0a61478dd685e">http://www.magtypo.cz/buxus/generate_page.php?page_id=393&amp;buxus_typo=5ea...</a> “A humanist sans with verticals showing a graceful entasis on stems, high-<strong>branching</strong> arcades in the lowercase.” —- Gary Munch</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/syntax-letter/familytree.html" title="http://www.myfonts.com/fonts/linotype/syntax-letter/familytree.html">http://www.myfonts.com/fonts/linotype/syntax-letter/familytree.html</a> “Linotype Syntax Letter...lead-in and exiting terminals, and the organic <strong>branching</strong> of round strokes from main stems.”</p>
      <p><a href="http://www.digital-web.com/articles/elements_of_design/" title="http://www.digital-web.com/articles/elements_of_design/">http://www.digital-web.com/articles/elements_of_design/</a> “Typography...Branching: A <strong>branching</strong> pattern is the repetition of forking lines, or patterns of deviation.”</p>
      <p>It’s hard to glean from the interwebs how widespread the term is. If it is not widepsread then that is a pity.</p>
      <p>j a m e s</p>
