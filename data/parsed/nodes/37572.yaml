      <p>Consider how these terms came about, are they specific to language, to nation, to area, to foundry, to typographer, to college, are they from the same source or several, which is correct?</p>
      <p>&gt;why is “stem”…on threads here too.</p>
      <p>Essentially what I wrote was that borrowing terms from other areas of classification could be confusing, I didn’t write that it was wrong or rare (I wrote that “branch” wasn’t wrong). Yes, I am going to opine that some of the terms are quasi-anatomical – where else do you think they come from?</p>
      <p>&gt;…what makes you think your opinions are any more credible?</p>
      <p>I don’t, it’s not a question of credence but of description, if referring to a crossbar helps a correspondent identify a part of a character, then, as the glossary suggests, it has achieved its purpose, the fact that there are alternative descriptions, some that are clearer or more defined, doesn’t mean one is <em>correct</em> and others <em>wrong</em>. Microsoft’s glossary describes the leg of a K as a tail; is that more accurate or clearer than leg (especially when the top diagonal stroke is described as an arm)?</p>
      <p>If any Typophile members think a typowiki’s entries are inaccurate or insufficient they have the opportunity to amend, add or create.</p>
      <p>&gt;Why do we speak of typeface structure and topology as “anatomy”? Because it makes sense and is useful in analogy.</p>
      <p>Yes, it does. Why have you assumed I disagree? I am open to other descriptions though.</p>
      <p>&gt;If you don’t understand the philiogical meaning of “figurative”, please look it up in a good dictionary</p>
      <p>Do you mean philological? Or is that insulting?</p>
      <p>&gt;If you find “branch”…objectionable terms it may be because you’re encountering them for the first time now.</p>
      <p>I don’t and it isn’t, otherwise I wouldn’t have been able to partially define what I understand by the term, branching is an acceptable extension too – but they aren’t the only terms.</p>
      <p>&gt;Tim Ahrens suggests borrowing “join” or “joint” from calligraphy. I must have erred by not suggesting you guys needs to read more calligraphy manuals as well.</p>
      <p>Did he suggest that or would it be impolite to suggest you read the posts? Join, while not so linguistically rich, does describe the area that Pablo asked about, so does bowl join and so does branch (although I am confused why the Futura h has ‘topology answering to a “joint”’ but the area in Pablo’s post is ‘branching’).</p>
      <p>Bye,<br>
      Tim</p>
