      <p>Two whole people agree with you so that settles it and you must be right? (much laughter) You guys need to read a lot more type history.</p>
      <p>“Joint” has the problem of being applicable to several different areas of typeface anatomy. It could be applied to the area where the bar of an e joins the stroke, and where the bar of a t crosses the stem, as well as the junction of the stroke and stem of h, n, m, b, d, p, q, u. </p>
      <p>“Branching” is analogous to the trunk (stem) and branches of a tree. It’s an intuitive, literate term, much narrower in scope than “joint” and specific to letters with stems.</p>
      <p></p><div class="imageWrap"><img src="/files/branch_joint_4394.gif"></div><p></p>
      <p>A star denotes topology answering to a “joint”. A dot denotes topology resembling the branching of a tree.</p>
      <p></p><div class="imageWrap"><img src="/files/brancho_rancho_6099.gif"></div><p></p>
      <p>Tellingly, in faces with geometric topology eg: Futura and Bodoni, h, n, m, b, d, p, q, u  are more branch-like than joint-like. Fonts styled after handwriting, eg: Pristina, are markedly branch-like in structure. You could call the junction of the stroke and stem on Pristina’s h a “joint” <em>if you really want to</em>, but to my mind “branch” describes that one with far more relevance.</p>
      <p>You wouldn’t call the crossover point of an x “branching” because the topology is a four way intersection, and because there’s no stem on an x, so “joint” is more appropriate. </p>
      <p>j a m e s</p>
