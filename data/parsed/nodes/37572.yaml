      <p>“Is there a term for where a horizontal and vertical stem, meet? Particularly where the bowl meets the vertical stem in letters like p,q,a,d,b.” (asked while pointing to the...crotch of a...p).</p>
      <p>As far as I know, the whole thing (in the direction of the arrow to the next white space, in the pit of the counter), is a join of the branching type, you’d reach just before the round head or reaching the shoulder further on the right-hand branch, as opposed to the square head you’d reach if you took a left at the branch instead. It’s all clear if you start with the roots at the feet and follow the trunk up the body through the legs, past tails and arms, bowls and ears. Gill probably had other ideas.</p>
      <p>Cheers!</p>
