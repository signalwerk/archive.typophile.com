      <p>Raphael seems to be sitting a smudge too low. I would try and placing it on a baseline of immediately above "Raphael Kroencke". </p>
      <p>Raphael might also be a bit too large IMO, that's unless you are going to letterpress these cards. Its size looks OK on the screen, but on the paper it may be come out over dominating.</p>
      <p>Last comment is that I would consider eliminating separate line for a web address. It's a pet peeve of mine, have a look at <a class="freelinking external" href="http://typophile.com/node/75579" rel="nofollow">this thread</a> for the rationale. Alternatively, consider moving the www line elsewhere - either under Visual Communications, or even setting it on its own below the phone number. At the very least try and have email and www addresses farther apart so not to create this blotch of duplicated letters.</p>
