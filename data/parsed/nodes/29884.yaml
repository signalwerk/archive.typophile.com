    <p>Hey people,</p>
    <p>I need some help identifying one of the woodtype faces I recently obtained. I’m in the process of organizing them, and printing specimen, either to trace or to use later on when I want to print something with it.</p>
    <p>Anyway, I have several typefaces, and traced only a couple of letters of one face, very quickly (of off hi-res photos of the woodtype itself) to post it here. When I have a proper print, I will scan it and post it, and the other faces too, when I have printed them.</p>
    <p>I only know the typefaces were bought from someone, I guess a printer, about 20 odd years ago, but the faces are obviously older than that. And I’m (and thus the faces too) situated in the Netherlands.</p>
    <p>Hopefully there are some woodtype connaisseurs on this board.. ;)</p>
    <p></p><div class="imageWrap"><img src="/web/20080516050546im_/http://www.typophile.com/files/woodtype_6672.jpg"></div><p></p>
