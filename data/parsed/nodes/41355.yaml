    <p>Part of: <strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <a href="/node/41317" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rounded&nbsp;Typefaces</a></strong></p>
    <p>Current <span class="caps">URL</span>:<br><a href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/">http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/</a></p>
    <p>Designed by <a href="/node/add/wiki?edit%5Btitle%5D=Philippe%20Desarzens" title="Create node &quot;Philippe Desarzens&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Philippe Desarzens</a> <span class="amp">&amp;</span> <a href="/node/add/wiki?edit%5Btitle%5D=Elektrosmog" title="Create node &quot;Elektrosmog&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Elektrosmog</a> 1999-2006</p>
    <p>Published by <a href="/node/14102" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lineto</a></p>
    <p><a href="http://www.lineto.com/Lineto.com/Frontpages/2006/14+Dec+2006/">http://www.lineto.com/Lineto.com/Frontpages/2006/14+Dec+2006/</a><br>
    Talking about the development of the «Brauer» typeface, its originator<br>
    Pierre Miedinger (a nephew of the designer of Helvetica, the legendary Max Miedinger) cryptically said: «As we all know, beer contains alcohol, an intoxicant with all its known side effects, it blurs the vision and obliterates any sharp edges. That’s why we continuously squinted when checking the shapes of the developing letters while drawing the typeface. The resulting negative drawing of the font is both sharp and rounded - as if you didn’t have clear vision&nbsp;anymore.»</p>
    <p>Today, we can only guess what role the actual consumption of Hürlimann Sternbräu played in the genesis of the typeface in the&nbsp;mid-seventies.</p>
    <p>In the meantime, the Hürlimann brewery has been bought up by Carlsberg and the typeface was discarded many years ago. The beautiful factory buildings were recently transformed into a complex of offices, shops and restaurants; Google will soon open their largest offices outside the <span class="caps">US</span> on exactly the premises where the «Brauer» font found its first modest&nbsp;manifestations.</p>
    <p>Designers Marco Walser of Elektrosmog and Philippe Desarzens very soberly went about the task of further developing Miedinger’s alcoholically challenged Helvetica variant into a full family of six weights. <span class="caps">LL</span> Brauer Neue, as it is now called, features a Regular, a Bold, and a Black cut, all with matching Italics. The Black cut replaces the existing version of «Brauer» which has been available from Lineto since&nbsp;1999.</p>
    <p>With its new weights and italics forming a comprehensive family of fonts, <span class="caps">LL</span> Brauer Neue is now ready for much wider use – going well beyond its previous status as a headline font, something many customers have continuously been asking&nbsp;for.</p>
    <p>We raise our glass to Messrs Miedinger, Walser and Desarzens whose fonts promise to reach the parts other fonts cannot&nbsp;reach!</p>
