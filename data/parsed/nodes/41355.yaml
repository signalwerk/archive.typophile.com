  html: "<p>Part of: <strong><a href=\"/wiki/Indices\" class=\"freelinking\" rel=\"nofollow\">Indices</a> : <a href=\"/wiki/Typefaces\" class=\"freelinking\" rel=\"nofollow\">Typefaces</a> : <a href=\"/wiki/Rounded%20Typefaces\" class=\"freelinking\" rel=\"nofollow\">Rounded Typefaces</a></strong></p>

    <p>Current URL:<br>

    <a href=\"http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/\" title=\"http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/\">http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/</a></p>

    <p>Designed by <a href=\"/wiki/Philippe%20Desarzens\" class=\"freelinking\" rel=\"nofollow\">Philippe Desarzens</a> &amp; <a href=\"/wiki/Elektrosmog\" class=\"freelinking\" rel=\"nofollow\">Elektrosmog</a> 1999-2006</p>

    <p>Published by <a href=\"/wiki/Lineto\" class=\"freelinking\" rel=\"nofollow\">Lineto</a></p>

    <p><a href=\"http://www.lineto.com/Lineto.com/Frontpages/2006/14+Dec+2006/\" title=\"http://www.lineto.com/Lineto.com/Frontpages/2006/14+Dec+2006/\">http://www.lineto.com/Lineto.com/Frontpages/2006/14+Dec+2006/</a><br>

    Talking about the development of the «Brauer» typeface, its originator<br>

    Pierre Miedinger (a nephew of the designer of Helvetica, the legendary Max Miedinger) cryptically said: «As we all know, beer contains alcohol, an intoxicant with all its known side effects, it blurs the vision and obliterates any sharp edges. That’s why we continuously squinted when checking the shapes of the developing letters while drawing the typeface. The resulting negative drawing of the font is both sharp and rounded - as if you didn’t have clear vision anymore.»</p>

    <p>Today, we can only guess what role the actual consumption of Hürlimann Sternbräu played in the genesis of the typeface in the mid-seventies.</p>

    <p>In the meantime, the Hürlimann brewery has been bought up by Carlsberg and the typeface was discarded many years ago. The beautiful factory buildings were recently transformed into a complex of offices, shops and restaurants; Google will soon open their largest offices outside the US on exactly the premises where the «Brauer» font found its first modest manifestations.</p>

    <p>Designers Marco Walser of Elektrosmog and Philippe Desarzens very soberly went about the task of further developing Miedinger\x1d\x1d’s alcoholically challenged Helvetica variant into a full family of six weights. LL Brauer Neue, as it is now called, features a Regular, a Bold, and a Black cut, all with matching Italics. The Black cut replaces the existing version of «Brauer» which has been available from Lineto since 1999.</p>

    <p>With its new weights and italics forming a comprehensive family of fonts, LL Brauer Neue is now ready for much wider use – going well beyond its previous status as a headline font, something many customers have continuously been asking for.</p>

    <p>We raise our glass to Messrs Miedinger, Walser and Desarzens whose fonts promise to reach the parts other fonts cannot reach!</p>"
