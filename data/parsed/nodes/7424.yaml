  html: "<p>Hi, <br> <br>I’ve wondered for a while about typeface families that are particularly suited for use by non-designers or computer novices. <br> <br>Requirements might be something like: <br> <br>• decent looking prime marks when used instead of quotes <br>• good spacing and height when capitals are used together instead of small-caps <br>• perhaps a low-height set of numerals, that work decently well in both lining and text situations <br>• a well-matched readable italic <br>• good performance in home laser or inkjet printing <br>• this may be too much to ask of the user, but perhaps a couple weights or optical sizes. <br> <br>Does anyone have suggestions? I don't want to read anymore Arial! ;) <br> <br>Thanks</p>"
