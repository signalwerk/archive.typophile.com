    <p><strong>As inspiration back when I was a student, I printed every glyph from</strong> Hoefler Text<strong> at a fairly big size. Looking through them, I discovered the then </strong>Hoefler Type Foundry<strong> logo mirrored in one of the letter slots, as I assumed a wink to previous printing techniques.</strong></p><strong>
    <p>I’m curious if any of You have designed or found hidden logos, licence numbers, messages or any such like in your work or others, subversive or not.</p>
    <p>Also, with OpenType and coding the possibilities of hiding things that suddenly, like a Trojan horse. I don’t know how to code obviously, but imagine if someone wants to write <cite>NELSON MANDELA MUST DIE</cite> and contextual ligatures turns it into <cite>I WANT TO HUG KOALA BEARS</cite>.</p>
    </strong><p><strong>Any thoughts?<br>
    </strong></p>
    <p>ƒ</p>
