  html: |-
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Font%20Development%20Software" class="freelinking" rel="nofollow">Font Development Software</a> : AFDKO</strong></p>
    <p>Adobe Font Development Kit for OpenType (AFDKO) is a freely-distributed set of libraries and <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a> bindings by <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> for working with <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts. Available for Windows and Mac OS. Comes with a suite of command-line tools, and is also used by <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> and <a href="/wiki/TypeTool" class="freelinking" rel="nofollow">TypeTool</a>, among others, for supporting some of OpenType's more sophisticated features.</p>
    <p><strong>URL</strong><br>
    <a href="http://www.adobe.com/devnet/opentype/afdko/" title="http://www.adobe.com/devnet/opentype/afdko/">http://www.adobe.com/devnet/opentype/afdko/</a></p>
    <p><strong>Presentation at Robothon'09</strong><br>
    <a href="http://blip.tv/file/1908888" title="http://blip.tv/file/1908888">http://blip.tv/file/1908888</a></p>
    <p>-------------------------------------------------</p>
    <p><strong>INSTALLATION</strong><br>
    <em>Both the command-line tools and the FontLab macros are self-contained and run independently of each other.</em></p>
    <p><strong>AFDKO command-line tools</strong> <em>on Mac OS X</em><br>
    <strong><code>1.</code></strong> Download and decompress the AFDKO package.<br>
    <strong><code>2.</code></strong> You should now have a folder named 'FDK'. Move it to where you want.<br>
    <strong><code>3.</code></strong> Open a Terminal window (Terminal is located in <code>/Applications/Utilities/Terminal.app</code>)<br>
    <strong><code>4.</code></strong> Open the 'FDK' folder and locate the file named 'FinishInstallOSX'<br>
    <strong><code>5.</code></strong> Select the 'FinishInstallOSX' file, drag &amp; drop it on the Terminal window, and press the 'Return' key.<br>
    If FinishInstallOSX complains that it does not have permission to make the changes, type 'sudo ' (no quotes and keep the final space) before doing step&nbsp;5. This command will prompt you for the system administrator password, which will allow FinishInstallOSX to complete its work.<br>
    <strong><code>6.</code></strong> Close the Terminal window (Command+W).</p>
    <p>If all went well the FDK should now be ready to run. To test it, do the following:<br>
    <strong><code>A.</code></strong> Open a Terminal window.<br>
    <strong><code>B.</code></strong> Type 'autohint -h' (no quotes) and hit 'Return'. This should give you the Help information about the Autohint tool.</p>
    <p>If you get an '<code>OSError: [Errno 17] File exists</code>', go to <code>/Users/(your_username)/bin</code>, delete the symbolic link named 'FDK', and run FinishInstallOSX again.</p>
    <p>If you get a message saying '<code>-bash: autohint: command not found</code>', do the following additional steps:<br>
    <strong><code>+1.</code></strong> Open a new Terminal window and type <code>pico .profile</code><br>
    <strong><code>+2.</code></strong> You should now have the '.profile' file opened in pico, and see some lines that look like this: <code>PATH=${PATH}:"/Users/your_username/bin/"</code><br>
    <strong><code>+3.</code></strong> Select those lines, copy them, and close the file (Ctrl+X).<br>
    <strong><code>+4.</code></strong> Type <code>pico .bash_profile</code><br>
    <strong><code>+5.</code></strong> Paste the lines copied in step +3.<br>
    <strong><code>+6.</code></strong> Close the file (Ctrl+X), answering “Y” to save the changes.<br>
    <strong><code>+7.</code></strong> Close the Terminal window.<br>
    <strong><code>+8.</code></strong> Open a new Terminal window. Typing 'autohint -h' should now work, as well as all the other AFDKO command line tools.</p>
    <p>-------------------------------------------------</p>
    <p><strong>AFDKO FontLab macros</strong> <em>on Mac OS X</em><br>
    <strong><code>0.</code></strong> Quit FontLab, in case it is running.<br>
    <strong><code>1.</code></strong> Locate the 'Macros' folder in your FontLab installation. The path to it should be something like<br>
    <code>/Users/(your_username)/Library/Application&nbsp;Support/FontLab/Studio&nbsp;5/Macros</code><br>
    If there is no 'Macros' folder, create one on that location.<br>
    <strong><code>2.</code></strong> Download and decompress the AFDKO package.<br>
    <strong><code>3.</code></strong> You should now have a folder named 'FDK'.<br>
    <strong><code>4.</code></strong> Open a Terminal window (Terminal is located in <code>/Applications/Utilities/Terminal.app</code>), and type 'cd ' (no quotes and keep the final space).<br>
    <strong><code>5.</code></strong> Select the 'FDK' folder, drag &amp; drop it on the Terminal window, and press the 'Return' key.<br>
    <strong><code>6.</code></strong> Type 'cd Tools/FontLab' (no quotes) and hit 'Return'.<br>
    <strong><code>7.</code></strong> Still in the Terminal window, type 'python installFontLabMacros.py ' (no quotes and keep the final space).<br>
    <strong><code>8.</code></strong> Select the 'Macros' folder from step 1, drag &amp; drop it on the Terminal window, and press the 'Return' key.</p>
    <p>If all went well, you should see a bunch of lines in the Terminal window that start with '<code>Copied:</code>'. The AFDKO FontLab macros are now installed, and the 'FDK' folder can be deleted.</p>
    <p>If you get lines that say '<code>Failed to copy file (...) IOError: [Errno 13] Permission denied: (...)</code>', it's because the AFDKO FontLab macros were previously installed. To install them again you'll need to remove the old files.</p>
    <p>-------------------------------------------------</p>
    <p><strong>AFDKO command-line tools</strong> <em>on Windows XP</em><br>
    <strong><code>1.</code></strong> Download and decompress the AFDKO package.<br>
    <strong><code>2.</code></strong> You should now have a folder named 'FDK'. Move it to where you want (e.g. <code>C:\FDK</code>). <em>In case you put the FDK folder inside another folder, make sure that the folder name does *not* have spaces. Therefore, don't put it inside the 'Program Files' folder, for example.</em><br>
    <strong><code>3.</code></strong> Open the 'FDK' folder, proceed to the 'Tools' folder and continue to the 'win' folder. The Address field should contain something like '<code>C:\FDK\Tools\win</code>' (assuming the 'FDK' folder was moved to the location suggested in step 2).<br>
    <strong><code>4.</code></strong> Select and copy the contents of the Address field.<br>
    <strong><code>5.</code></strong> Open the Control Panel (Start Menu &gt; Settings &gt; Control Panel)<br>
    <strong><code>6.</code></strong> Locate 'System' and open it. You should now have a new window named 'System Properties'.<br>
    <strong><code>7.</code></strong> Select the tab named 'Advanced'.<br>
    <strong><code>8.</code></strong> Press the 'Environment Variables' button.<br>
    <strong><code>9.</code></strong> In the 'User variables for <em>your_username</em>' field, scroll down until you see one entry named 'PATH' (or 'Path' or 'path'). If you find one, go to step&nbsp;A1, otherwise go to step&nbsp;B1.</p>
    <p>&nbsp;&nbsp;&nbsp;<strong><code>A1.</code></strong> Select the entry named 'PATH' and click on the 'Edit' button below that area. You should now have a new window named 'Edit User Variable'.<br>
    &nbsp;&nbsp;&nbsp;<strong><code>A2.</code></strong> Select the 'Variable value' field and move the cursor all the way to the end, i.e. all the way to the right. (Beware that the contents of the 'Variable value' might be too long and appear trimmed)<br>
    &nbsp;&nbsp;&nbsp;<strong><code>A3.</code></strong> Once at the end, type a semicolon (;) and paste-in the contents from step&nbsp;4.<br>
    &nbsp;&nbsp;&nbsp;<strong><code>A4.</code></strong> Click on the 'OK' button.</p>
    <p>&nbsp;&nbsp;&nbsp;<strong><code>B1.</code></strong> Click on the 'New' button (top one). You should now have a new window named 'New User Variable'.<br>
    &nbsp;&nbsp;&nbsp;<strong><code>B2.</code></strong> In the 'Variable name' field, type 'PATH'. (no quotes)<br>
    &nbsp;&nbsp;&nbsp;<strong><code>B3.</code></strong> In the 'Variable value' filed, paste-in the contents from step&nbsp;4.<br>
    &nbsp;&nbsp;&nbsp;<strong><code>B4.</code></strong> Click on the 'OK' button.</p>
    <p><strong><code>10.</code></strong> Click on the 'OK' button again. ('Environment Variables' window)<br>
    <strong><code>11.</code></strong> Click on the 'OK' button once more. ('System Properties' window)</p>
    <p>If all went well the FDK should now be ready to run. To test it, do the following:<br>
    <strong><code>A.</code></strong> Open a Command Prompt window. (Start Menu &gt; Run... &gt; cmd.exe)<br>
    <strong><code>B.</code></strong> Type 'autohint -h' (no quotes) and hit 'Return'. This should give you the Help information about the Autohint tool.</p>
    <p>-------------------------------------------------</p>
    <p><strong>AFDKO FontLab macros</strong> <em>on Windows XP</em><br>
    <em>You must have Python installed before you proceed. For information on how to install Python, go to the <a href="http://www.fontlab.com/python/" rel="nofollow">FontLab Python page</a>.</em><br>
    <strong><code>0.</code></strong> Quit FontLab, in case it is running.<br>
    <strong><code>1.</code></strong> Locate the 'Macros' folder in your FontLab installation. The path to it should look something like<br>
    <code>C:\Documents and Settings\your_username\My&nbsp;Documents\FontLab\Studio5\Macros</code><br>
    If there is no 'Macros' folder, create one on that location.<br>
    <strong><code>2.</code></strong> Download and decompress the AFDKO package.<br>
    <strong><code>3.</code></strong> You should now have a folder named 'FDK'.<br>
    <strong><code>4.</code></strong> Open a Command Prompt window (Start Menu &gt; Run... &gt; cmd.exe), and type 'cd ' (no quotes and keep the final space).<br>
    <strong><code>5.</code></strong> Select the 'FDK' folder, drag &amp; drop it on the Command Prompt window, and press the 'Return' key.<br>
    <strong><code>6.</code></strong> Type 'cd Tools/FontLab' (no quotes) and hit 'Return'.<br>
    <strong><code>7.</code></strong> Still in the Command Prompt window, type 'python installFontLabMacros.py ' (no quotes and keep the final space).<br>
    <strong><code>8.</code></strong> Select the 'Macros' folder from step 1, drag &amp; drop it on the Command Prompt window, and press the 'Return' key.</p>
    <p>If all went well, you should see a bunch of lines in the Command Prompt window that start with '<code>Copied:</code>'. The AFDKO FontLab macros are now installed, and the 'FDK' folder can be deleted.</p>
    <p>On step 7, if you have Python installed but still get a message that says '<code>'python' is not recognized as an internal or external command, operable program or batch file.</code>', locate the folder where Python is installed, and add that folder's path to the 'PATH' User Variable.</p>
    <p>-------------------------------------------------</p>
