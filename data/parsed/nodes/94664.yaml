      <p>Neil,</p>
      <p>Yes, yes, yes! That was VERY helpful. "Illustrator brushes" was getting me nowhere but annoyed, but "vector packs" gave me a <em>very</em> good idea of what semi-comparable products are available, and how much they cost.</p>
      <p>For instance, if a pack of 11 brush patterns is selling for $8.50, a set of 132 instant borders <em>ought to go</em> for $102.00, if there is no quantity discount—which is <em><strong>way more</strong></em> than I was ever considering charging.</p>
      <p>Now, all I need to figure is where is the precise Vito Corleone point that makes the offer so tempting that few reasonable people would refuse it? $39.95, maybe? Too much? Could ask more?</p>
      <p>Any votes? Anyone interested in taking the set out for a spin?</p>
