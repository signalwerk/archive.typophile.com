      <p>Neil,</p>
      <p>Excellent suggestions. As it happens, I have built a pretty good relationship with a European publishing group by providing them with free stuff, which helps us both out. As luck would have it—or whoever is in charge of serendipity-doo—they are launching a NEW magazine which JUST SO HAPPENS to be directed at my target audience.</p>
      <p>You see where this is going? Win-win-win: the magazine has a BRAND NEW product; I provide a free sample of my stuff; the magazine provides the info to the new subscribers on where to get more, and the incentive to buy is FREE; and, maybe, I offer a special discount code to REALLY sweeten the deal.</p>
      <p>What else could go right? So far, everything. Or, at least, everything I am aware of. But, what the hey—if you're going to be surprised, the good surprises are the ones you want coming your way.</p>
      <p>Serendipity-doo…</p>
      <p>On another note: ANYONE have any experience with the subject of the post? I have a demo of the program, but it won't let me save the results; and, if I don't know if the changes will actually stick, all I MAY be accomplishing is screwing something up.</p>
