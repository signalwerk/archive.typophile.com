  html: |-
    <p>I have created 131 Illustrator pattern brushes to create period borders, following advice given—and much appreciated—about maintaining proper placement when one or more elements do not fill the em square—which was, to use zero width line segments as spacers.</p>
    <p>AI affords the opportunity of customizing the borders—scaling, color, and stroke—but, if the end-user does add strokes, then the elegant spacing solution becomes a problem.  As far as I can tell, Artlandia Live Presets would allow me to edit the swatches used to create the borders, but I am not sure that the program won't rewrite the Postscript and relocated the 0,0 origin point.</p>
    <p>Any clues?</p>
    <p>Also, anyone PC or Mac users (both needed) interested in pre-release testing the complete set?</p>
