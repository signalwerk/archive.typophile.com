      <p>Good find Rob. I agree Charter Oak looks like a match for the Quick sign in the movie. The newer signs I posted must be also based on Quick. The only noticeable differences are the lighter weight and increased length of the tail on _Q_, and a change in upper diagonal of _k_ to a short horizontal section.<br>
      Don</p>
