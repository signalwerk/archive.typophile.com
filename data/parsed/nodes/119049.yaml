    html: |-
      <p>Thanks Rob. Black Grotesk is the closest I have seen so far. It's interesting to compare it's italic with Charter Oak and by looking at Black Grotesk's upright imagine how it would pair with Charter Oak. The weight and high contrast are reasonably comparable. Most letters don't clash too much. The main exceptions are  _S_, _s_ and r. Clearly in the ballpark as a possible out of the box upright sans/grotesk  to pair with Charter Oak.<br>
      Don</p>
