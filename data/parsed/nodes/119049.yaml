      <p>Charter Oak is a puzzle to me. URW gives no info on source, designer or date of design. It's not in Jaspert's Type Encyclopaedia.<br>
      Charter Oak is a high contrast heavy sans serif. What non-sloped font would match? I thought about Geoffry Lee's Impact of 1965 but it's too fat, too narrow and has less contrast.<img src="/sites/default/files/old-images/CharterOak_5517.jpg"><br>
      Don</p>
    html_clean: |-
