    date: 2014-08-29T07:26:00
    date_raw: 29 August 2014 - 7:26am
    votes: null
    html: |-
      <p>I was able to solve the first part of the puzzle, the source of the URW Charter Oak. It was originally produced by the Keystone Type Foundry, which operated in Philadelphia from 1888-1917. Charter Oak is shown on in their 1906 specimen book <a href="https://archive.org/details/abridgedspecimen00keysrich">https://archive.org/details/abridgedspecimen00keysrich</a> at pages 143 to 145.<br>
      But I have found noting that would serve as an upright match to Charter Oak.<br>
      Any suggestions?<br>
      Don</p>
    html_clean: |-
