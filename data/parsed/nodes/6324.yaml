  html: <p>Can't find an image anywhere, so you'll have to watch the Olympics on NBC tonight. ;) <br> <br>I'm trying to identify the transitional font used in their splashes and graphics mattes. I believe they also use it during Bob Costas'  commentating for the on-screen graphics. <br> <br>My initial impression is Officina Serif, but I'm sure you guys can nail it exactly.</p>
