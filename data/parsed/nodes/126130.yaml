    html: |-
      <p>No one who has ever had to do a substantial amount of typesetting would want to have to stop to turn on or turn off kerning just for numbers.<br>
      For display faces or non-tabular numbers it might be appropriate in some cases.<br>
      If you really want kern pairs for numbers, don't ever try and use the font to typeset an annual report or other document that uses columnar (tabular) numbers. It would look like shit to anyone who appreciates typography.</p>
