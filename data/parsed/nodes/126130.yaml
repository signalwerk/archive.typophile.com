      <p>It's possible to design a font to work this way. I had a client who required proportional and tabular numerals in a legacy application that didn't support OpenType features. I created tabular numerals and kerned every numeral and period combination. That way the client, in this specific application, could activate tabular numerals by disabling kerning. It's not the "proper" way to do it but it worked in that case.</p>
      <p>One big problem with this technique is the decimal point. If you want it to be tabular, you end up a huge gap around the period in your text, which will need to be kerned against almost everything else in the font. It sucks.</p>
    html_clean: |-
