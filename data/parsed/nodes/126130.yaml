    html: <p>Andreas, what you're misunderstanding is that the numerals aren't just not kerned, they're not even proportionally spaced. This means that the sidebearings are especially wide on 1, for example. Simply turning off kerning on numbers that are still proportionally spaced still won't make them line up in a table. The fonts that you're using are probably TrueType or PostScript, which only has one type of numerals built into each font. Often these font families would have multiple versions, one for each type of numeral, but when Microsoft or whoever licensed them for bundling, they only licensed the font with tabular figures because their business customers use their computers for spreadsheets and such. The newer Opentype format allows several kinds of numbers to be bundled into the same font file.</p>
