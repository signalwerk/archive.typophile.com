    html: |-
      <p>"The combination 74 seems particularly in need of kerning." What, and anything else containing a '1' does not?</p>
      <p>George nails it. Per (sensible) default, digits are usually designed as "tabular lining", so there are no jarring differences in width between "11" and "22". A very simple example is that of two phone numbers above each other.</p>
      <p>I had a nasty experience once with a Univers, as the version I had <em>did</em> have a lot of kerning in the digits, and suddenly all of my tables were off.<br>
      The reverse is also true: even <em>with</em> added kerning, these digits are no match for properly designed real "proportional" digits. A "1", for example, is typically designed to fit in the center of the width of digits, which means that it ought to be kerned both left and right against <em>all other characters</em>.</p>
      <p>Proportional digits are explicitly designed to be used in contexts where horizontal spacing trumps vertical alignment, such as in running text. That also includes kerning: Robert Slimbach's Minion Pro contains "tabular" digits without any kerning, as well as "proportional" digits, which <em>do</em> contain proper kerning for your "74" example.</p>
