      <p>Look at the attached image. All of these examples are from the same typeface, Minion Pro, which has multiple types of numerals built into its OpenType features. If you want the digits to always line up, you use tabular numerals ("unkerned", in your parlance), but if you're setting them in text, you use proportional numerals ("kerned"). I also included proportional numerals with the kerning turned off, to demonstrate that simply turning off the kerning isn't enough to get them to line up.</p>
