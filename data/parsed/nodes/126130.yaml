  html: <p>I was curious about kerning numerals. I discovered that Palatino, Times, and various Garamonds do not kern numerals. This seems odd. The combination 74 seems particularly in need of kerning.  I did find that URW Palladio has kerned numerals. Why does Palladio have them, but neither Palatino nor Aldus have them?</p>
