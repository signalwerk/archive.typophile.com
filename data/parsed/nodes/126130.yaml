    html: <p>Yep. And they you need an alternate comma too, for stuff like 1,000,000. You'll need a monospaced slash, space, brackets etc. But then its no longer a simpler solution than using the accepted OpenType numeral feature. OpenType numeral features have been around for about 20 years. Maybe it's not that well supported but it works in applications that professional designers use and they're most likely who needs tabular. If you come up with a variety of solutions for the problem, you practically need to read an owner's manual every time you switch fonts. Like, this one font has an alternate decimal, this other one contextually swaps for another decimal and this other one uses OpenType. With the standard OpenType numeral features, a designer should be able to switch fonts and the tabular/proportion aspect will stay intact. If you think proportional lining figures should be the default, I totally agree but only because it makes the previews look better on font vendor sites.</p>
