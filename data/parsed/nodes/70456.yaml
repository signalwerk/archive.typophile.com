      <p>After seeing these choices I'm starting to feel that we are seeing a mix here. The Upper case seems to be from a Didot-style font, and the lower case, may be a blend of Jeanne Moderno and Architype Bayer-Type. I think the designer picked and chose to achieve an odd new combination. When this many of us can not get closer than we have, I suspect either custom or customized, and I include blending a mix of fonts as a customizing technique.</p>
      <p>- Mike Yanega</p>
