    <p><img src="/sites/default/files/old-images/Jabana-NilsThomsen-2015_1_3579.jpg"></p>
    <p>Jabana &amp; Jabana Alt &amp; Jabana Extras — 52 fonts for coffee and more</p>
    <p>In 2014 Jabana was released as just a single font. One year later, after some hard work Nils Thomsen rounded it  up to a very useful and complex typeface system. Inspired by having a “Schorle” at Hamburgs bars. Super compressed to extended letter shapes in 5 widths and 4 weights – smooth handwritten marker curves and especially a wide range of opentype features define the large character set of Jabana. </p>
    <p>Each letter and punctuation got three simple varieties of alternates. This gives a nice looking handwritten nature to the font. They will be randomly chosen by the contextual alternates feature or even by hand via stylistic set (ss01, ss02).</p>
    <p>The whole characters for serious western european typography comes along Jabana.<br>
    Beside the standard accented letters, fractions, mathematical glyphs, superiors and inferiors you will find alternates, extra bullets, different arrows, negative figures and roman numerals.</p>
    <p>Another reason for the amount of 1530 glyphs are the numerator and denominator letters which came from A-Z, punctuation and the extra bullets (ss09-16). They are meant to be used for decoration or distinction. Especially an opentype stylistic set gives an extra touch to it while putting a dot/line above denominators or underneath numerators (ss03+numr/dnom).</p>
    <p>Jabana Alt is a much more standardized alternate version of Jabana.<br>
    The Jabana Alt fonts got normal uppercase proportions and a larger x-height for the lowercase.<br>
    Just in case ... If Jabana is too unique for your purpose take: Jabana Alt !</p>
    <p>Extras! … If you need some awesome specials ... Jabana Extras will help you to realize a fast and good looking modern design ... You’ll get crazy about it, because the Extras are combinable and flexibel in width. Just switch on the ligature feature (opentype) and type from 'a' to 'z' or 'A' to 'Z'.</p>
    <p>Arrows, Banners, Lines, Ornaments, Divider and Web or Coffee Icons … Try it, learn it, love it!<br>
    Banner: Combine for example ‘h‘ and ‘m'. Continue to type, it will get wider! Switch to uppercase it will get black! Type another letter, e.g. 'g', it changes … A good thing! It also looks nice with all other handmade fonts!</p>
    <p>Opentype: Yes it's true! … Nils used all 20 stylistic sets to put more specials into Jabana! But no worries, the PDF shows each feature and it's effect ... There are for example options to center the 'small caps' or 'lowercase' ... choose different bullets ... get lined numerator or denominator ... But if this is too complicated, the font is still nice enough! </p>
    <p>Naming: Jabana/Jebena is a container used to brew coffee in the Ethiopian, Eritrean and Eastern Sudanese traditional coffee ceremony. It is usually made of pottery and has a spherical base, a neck and pouring spout and a handle where the neck connects with the base. (<a href="http://en.wikipedia.org/wiki/Jebena">http://en.wikipedia.org/wiki/Jebena</a>)</p>
