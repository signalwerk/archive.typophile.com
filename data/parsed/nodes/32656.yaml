    html: <p>Saw a lecture by one of the most 'professional sources' on readability, Gerard Unger, at the London Typographic Circle a few years ago. In the context of work for a Dutch newspaper he compared Helvetica letterforms (closed shapes) and Frutiger (open shapes) to guests at a party who hadn't been introduced properly. Helvetica was an awkward "Hey, do you think we should join together and form words?", "I don't know shall we? Maybe we should, maybe we shouldn't, I don't really know." and with Frutiger it was "Yes, let's all get together and form words! That would be great!". So if your client is insisting on a sans maybe get them to compare reading Arial with reading the same thing in Frutiger or anything else with a 'open' shapes.</p>
