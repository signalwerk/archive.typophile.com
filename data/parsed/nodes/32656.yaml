      <p>David, I'm sorry you find Sheedy's research inadequate. I think his work is excellent. My team has sponsored much of his work and we provide him with research, engineering, and typographic consulting.</p>
      <p>I ask that you reread his work for I think you missed a few points. Table 1, which takes up much of page 801, shows the conversion between point size and the number of pixels of lowercase height and uppercase height for each of 6 fonts. He presents data both in terms of nominal size and pixels used.</p>
      <p>Page 803: "Results calibrated to font size (FS in Figure 2) show Verdana has the best legibility for both capital letters and for words, Times New Roman (TNR) has the worst, and the other two are in between. When the results are normalized for letter size (LS in Figure 2), Verdana continues to have the best capital letter and lowercase word legibility."</p>
      <p>This work is much more interesting than a comparison between typefaces. Sheedy demonstrates that letter legibility is greater than word legibility (named the letter superiority effect). Lateral inhibition in the retina is the likely cause for this - essentially that neighboring letters makes letter feature recognition more difficult.</p>
      <p>Cheers, Kevin</p>
