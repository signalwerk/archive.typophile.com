      <p>&gt;I don’t believe that they would give the recommendation based on no evidence whether or not it has any genuine research behind it</p>
      <p>Tim, I wish I could say that I am being unreasonably cynical here. But my experience is whereever there is evidence to support their viewpoint, people will make a point of quoting it. Indeed people often even claim support from evidence when there is none.</p>
      <p>I commend you for contacting the RNIB about the issue. If you involve others, such as those teaching typography at Reading, I suspect they will be more forthcoming. The fact that they did not reply reinforces my suspicion that they are expressing an opinion not backed by any kind of testing, scientific or not.  </p>
      <p>I find it very plausible that they would jump to the conclusion that because sans are simpler they are more readable, because I have seen it often, such as the case of the friend I mentioned.  </p>
      <p>The 'text matters' guidelines are puzzling because they contradict the RNIB guidelines while refering the them as an authority. Also they do not mention the critical importance of large--generally greater than 12 pt--type for the visually impaired. Large type size seems to be the only thing that is really well established as important for the visually impaired. I say this not because of any scientific paper, but simply that large print books are evidently very widely used by the visually impaired. If type size weren't important for this population they wouldn't use the large-print books.</p>
