      <p>Unfortunately, this is a subject of much controversy and claims of a research basis, when no decisive research exists. </p>
      <p>I think you can take two tacks on this. The first is to refer to actual large print books published for adults with visions problems. </p>
      <p>According to <a href="http://www.gale.com/thorndike/about.htm" rel="nofollow">this</a>, the world's leading publisher of large print books publishes their books in 16 point Plantin type with black ink on high opacity paper. In my view, the responsiveness of the market is probably the best test that exists now, and may influence your client.   </p>
      <p><a href="http://www.galeschools.com/thorndike/research.htm" rel="nofollow">Here</a> is a reference to some research on large print. This is a biassed source, as they are selling large print books to kids, but still it is worth something. They also prefer seriffed fonts. </p>
      <p>The 'research' on Tiresias claims the people self-report san serifs as being more legible. This 'research' is <a href="http://screenfont.ca/fonts/today/Tiresias/" rel="nofollow">very controversial</a> and personally I think is completely unreliable as relates to print.</p>
      <p>The other tack to take on this is to report the way typographers and type designers approach this, and their distinctions. Many distinguish between legibility and readability generally. Legibility is the ability to distinguish one letter from another. This is critical for signage. </p>
      <p>Reabability has to do with ease of absorbing the message in extended text. The reality is that a very small amount of extended text is done in san-serif fonts, even though they are extensively used in titles and short copy. Hence by the test of what is actually done in print Ariel doesn't hold up. </p>
      <p>Typographers and type designers also distinguish between display and text fonts, and between fonts for screen and fonts for print. Arial can work as a display font and as a screen font. As a screen font it has been heavily 'hinted' so that its apprearance is actually very different from in print. </p>
      <p>The best way to show that Arial is a bad text font--and I think it's just awful--is to put say Plantin or any other classic text font and Arial at the same copy in the same space. </p>
      <p>I recently had the following experience. Someone showed me a report in Arial. I said it would be better in Georgia. So I printed it out in the same format. She said, 'Arial looks more clear to me.' (It's what she always used.) Then I said, "Try reading it." She said something like: "Oh, yeah, it is smoother." </p>
      <p>To me your main convincers are 1. What is actually done today with large print books, and 2. To do two or more settings of the same material, and actually have the client try to read it--not just look at it. If that doesn't convince then I think you're out of luck.</p>
