      <p>The "font of choice" is a factual question, and I think that the links I give above show clearly that Arial is not the font of choice for those with eyesight problems. You can ask your client where he heard this, and give him the links. The large print movement I believe started in England, and you can probably find links there. Or just go to any library and pick the large print books off the shelf. I doubt you'll find a one in Arial.  </p>
      <p>Whether there is a significant difference between Myriad and Arial for a form, I don't know. If the texts are very short, the questions of layout may be much more important. </p>
      <p>But on the 'font of choice' for print for those with vision difficulties your client is just misinformed.</p>
