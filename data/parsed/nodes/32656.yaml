      <p>To add to my post above, Sheedy et. al., draws conclusions that appear generalize his results concerning thresholds to legibility, readability  and reading as such.</p>
      <p>In terms of the curve mentioned above (rises steeply from a threshold and than hits a laterally extended plateau), this is like applying the results calculated at the base of the steep rise for one task (letter identification under two conditions) to what happens on the plateau for another (visual wordform resolution)! </p>
      <p>Sheedy of course admits his generalizations require confirmation.</p>
      <p>Note: I encountered the steep rise / extended plateau scheme in Denis Pelli's paper "Reading is crowded" but I don't think it originates with him.</p>
