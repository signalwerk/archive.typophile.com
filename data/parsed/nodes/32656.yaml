      <p>Si, I found an outright recommendation:</p>
      <p>"reproduced in a clear sans-serif typeface, such as Arial or Helvetica, 	with a font size of at least 14 points (i.e. the same size as this text) " </p>
      <p>This is in a document called "Accessible formats for older people with sight problems." </p>
      <p>Again, so far as I know this is a myth. </p>
      <p>&gt;Sans vs Serif is not the issue</p>
      <p>Chris, I do think this is part of the issue. The legend of the readability of Arial is because it has been the most accessible sans on most people's computers for a long time. </p>
      <p>There does seem to be good evidence that large print is helpful to the visually impaired, but none as far as sans vs serif. And certainly not as to whether Arial in particular is good.  </p>
      <p>I tend toward the view that serifs are generally better for print text, but the fact is that research hasn't decided the issue. </p>
      <p>For the RNIB to propagate this is not responsible, in my opinion, and maybe some of you Brits can set them straight as to the state of the research--and the fact that large-print books are generally in seriffed type, it seems by popular demand.</p>
