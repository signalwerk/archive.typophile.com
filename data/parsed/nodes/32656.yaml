      <p>Great responses - </p>
      <p>I'd just like to add one more point for this argument...</p>
      <p>This of course, based on why we study typography to begin with.</p>
      <p>When we were in school, learning how to read with our primers, we learned to recognize the printed LETTER. Most primers from Uncle Remus to Dick and Jane were set in Century Schoolbook - with yes, slab serifs -- to help our little eyes grow more accustomed to the set word.</p>
      <p>As we grow older - we find it is still EASIER for reading large paragraphs (body text) in a serif typeface.</p>
      <p>My favorite example of this was in a type book - where the same headline - set in both San Serif and Serif - were cut in half - and only the top half of the letters shown. 10 out of 10 people had no problem figuring out what the words were from the Serif typeface -- can't say that about the san serif.</p>
      <p>Oh yes, and Arial is definitely a San Serif!!! LOL</p>
      <p>Case closed. :)</p>
