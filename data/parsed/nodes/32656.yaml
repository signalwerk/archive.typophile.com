      <p>The critical point of this thread seems to me to be is Arial or Myriad, at 6 or 7 point respectively, capable of working in the situation of a form? I am inclined to think that although the difference might be significant the overall effect would be the same – that some readers will find it difficult to read and complete the form. Perhaps the most significant area to advise a change of typeface at this size is the similar forms of some numerals, if they are required in the form.</p>
      <p>William, I found the conclusion (that many people believed Arial was endowed with some special readability quality) that you drew, joined too few dots for me to agree. I agree that the effect of RNIB’s advice is wrong, which is why I mentioned it, following a similar thread I wrote to RNIB asking about the sources for their advice, I did not receive a reply, however I don’t believe that they would give the recommendation based on no evidence whether or not it has any genuine research behind it. There are situations where a sans performs better than a serif and for people with some kinds of impairment there is belief and user-evidence that serifs hinder the reader, I believe that the effect is that a lowest common denominator (even if it is inaccurate) has been applied. As I said before the typefaces mentioned by RNIB seem restricted to bundled system fonts and the advice is aimed at giving non-designers best practice guidelines to produce letters, communications etc. unfortunately non-designers insist that this advice is followed in print and without contrary evidence (or even a respected national organisation offering opposing advice) there is sometimes no alternative but to follow their instructions.</p>
      <p>I cannot find any authoratitive information that Aleksander can show his client, maybe this will offer some help.<br>
