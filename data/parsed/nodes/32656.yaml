      <p>Chris, as David notes, one of the problems of scientific research is that funding sources tend to prejudice goals and results.</p>
      <p>In the Microsoft video on ClearType, it was revealed that the project was greenlighted by Bill Gates on the proviso that measurable results be obtained. That's understandable, the boss is an engineer; but it leads to a situation that ties font development to reading research in a way where each channels the other, resulting in "go faster" fonts and the privileging of the contextually-divorced notion of speed as the main criterion of readability.</p>
