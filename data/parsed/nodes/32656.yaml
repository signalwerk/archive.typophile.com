      <p>&gt;recommended</p>
      <p>Here is what they say:</p>
      <p>"As a general rule, stick to typefaces that people are familiar with and will recognise easily, like Arial. Avoid italic, simulated handwriting and ornate typefaces as these can be difficult to read."</p>
      <p>That is not a special endorsement of Arial, but a recommendation of anything familiar and not too ornate, like italic and handwriting fonts. </p>
      <p>It is unfortunate that they mention only Arial. While it is, as you say, Si, a relatively good screen font, there is no evidence that it is better as printed text. And the market place in large print books for those with limited vision goes for serif fonts. </p>
      <p>On the RNIB site they mention several teachers producing their own large print books in Arial. It is clear that many people in the UK think Arial has some special readability in print. This is unfortunate as there is zero evidence as to this. </p>
      <p>Si, do you think that Arial is significantly better for printed text than Plantin? Significantly worse? No difference?</p>
