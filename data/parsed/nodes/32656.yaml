    html: |-
      <p>"Sheedy demonstrates that letter legibility is greater than word legibility (named the letter superiority effect)."</p>
      <p>Legibility in the Sheedy study amounts to discrimination affordance at thresholds of size. Sheedy demonstrates that discrimination affordance at threshold sizes is greater for isolated letters than for letters in words. If reading performance is a curve that rises steeply from a threshold and than hits a plateau, then these tests say something about letter identification at threshold sizes, but nothing about the height of the plateau, and it's extent. It might be argued that the plateau is the domain of readability and visual wordform resolution affordance.</p>
      <p>This means that the comparison of the four fonts used, Arial, Verdana, Times New Roman and Georgia is in terms of relative discrimination affordance at thresholds of size in terms of letter identification when letters stand alone and when letters are in the context of words.</p>
      <p>It could be argued that the task (to identify at thresholds) forces the subject to revert to a letter by letter processing routine, thus bringing into play the inhibitory force of contour interference. (Contour here means somthing more like 'adjacent stroke of flanking letter' than what is meant by contour in a vector description environment.)</p>
      <p>If lateral inhibition or contour interaction is the likely cause of the poorer performance on words, then the results suggest there is an interaction of font and amount of lateral inhibition or contour interaction. And this is different when fonts are compared by assigned font size versus absolute letter size in pixels!</p>
      <p>Also, uppercase was used in the isolated conditions and lower case was used in the letters in words condition, but the cap height was normalized to the height of the lower case x-height in the letter size comparisons.</p>
