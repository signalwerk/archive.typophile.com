      <p>The Lighthough guidelines, unlike the RNIB ones, make excellent sense to me. </p>
      <p>Even that small sans are better for deciphering (slowly) than small serifs makes sense. But as they say, the key thing is large letters and high contrast. Once the letters are large enough to read, rather than simply decipher, I would suspect that the same preference for serifed faces in extended text holds as in the normally sighted world. </p>
      <p>The best testing on legibility that I know of has been for <a href="http://clearviewhwy.com/ResearchAndDesign/index.php" rel="nofollow">James Montalbano's Clearview Highway font</a>. It went beyond the photoshop blur test, and did testing under highway conditions. It does confirm the idea that open counters are a plus for legibility, at least for signage.</p>
