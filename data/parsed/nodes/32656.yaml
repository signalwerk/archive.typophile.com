      <p>&gt;Gerard Unger ...Helvetica letterforms (closed shapes) and Frutiger (open shapes)</p>
      <p>Here you are getting into subtleties that typographers and type designers find quite important. But none of this has been scientifically tested, that I am aware of. </p>
      <p>Personally, my take on the relative unreadablity of Arial and Helvetica as text vs the better readability of Unger's sans faces is not only the openness, but also that they are oval rather than round. This changes the way they can space together. </p>
      <p>I very much look forward to reading Unger's book on readability, which is about to come out in English. </p>
      <p>But at the same time we have public institutions like the RNIB ignorant of both the state of the science and the practitioners' lore. And not only do they not know about these things, but they propagate what is very likely false information :(</p>
