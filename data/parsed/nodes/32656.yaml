      <p>What I am about to say is not science but a lay mere observation  of but two people. I have two longtime friends who developed macular degeneration (they don’t know each other). I knew them when they both had healthy vision as well. One of them is almost totally blind now and the other is severely limited. At some point along there loss of vision path, both of them began needing large-print to be able to read. One was an editor and the other an illustrator/graphic designer. The graphics person was more cognizant of type than the editor and was able to communicate more specifically about it to me. She mentioned specifically liking sans serif more as her vision got worse. The editor was less specific. She said “plainer” type was easier for her. Both said they liked more letterspacing than before and larger size was a must.<br>
      Again, this is not scientific evidence and only addresses observations by two people with only one form of visual impairment. I am hoping that some real research is done by trained scientists in this area so that the laymen does not make assumptions which may seem logical to them but are not in evidence.</p>
      <p>ChrisL</p>
