      <p>I´ve messed around with it quite a bit, changed some proportions, like in the uppercase S, tried to flesh out as many characters as I could (many looking pretty horrible at the moment, you will see).</p>
      <p>Do check the new PDF (Board 2) on the first post.</p>
      <p>One big question I have, regarding the design of the letter s. How do you people go about the spine of it, how exactly does the 2 nodes (sometimes 4) happen in there? So far I don´t have them at all, but notice it in every respectable typeface I can remember.</p>
      <p>Thanks!<br>
      Rodrigo</p>
