      <p>Hey... I like a bit of detective work now and then!  :-D</p>
      <p>I have a book on Goudy that does not mention anybody named Schiller, but look at what Google turned up at the University of Delaware, in their <a href="http://www.lib.udel.edu/ud/spec/findaids/goudy.htm">Frederic W. Goudy Collection</a>:</p>
      <p><strong><em>Frederic W. Goudy: A Memorial</em> by Albert Schiller. Printed by Advertising Agencies’ Service Company, Inc., 1947.  Signed by Schiller. 1 item (1 p.).</strong></p>
