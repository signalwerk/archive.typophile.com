      <p>The book <em>Typography: When Who How</em> has an entry for a <strong>Walter Schiller</strong>, born in Hamburg, 1920. Could that be your man?</p>
      <p>And according to <em>An A-Z of Type Designers</em>, Walter Schiller co-authored a book with Albert Kapr: <em>Gestalt und Funktion der Typografie</em> (1977, 1983). Both men taught at the Hochschule für Graphik und Buchkunst (HGB) in Leipzig.</p>
      <p>(By the way, no entries for an Arthur Schiller in either book, or others I consulted.)</p>
