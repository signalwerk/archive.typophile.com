      <p>Nick Shinn, I've noticed that some of the Victoria line platform signs at King's Cross still use that particular S. I managed to do a rubbing as the lettering is ever so slightly raised - there are bones in the middle of the S - it is indeed two arcs. Perhaps the whole sign wasn't Johnston per se, but I wasn't able to tell the difference at the time. Only at King's Cross though…</p>
      <p>I'd upload the rubbing but unfortunately can't find it.</p>
