    html: |-
      <p>I'm assuming that much of the Underground signage would have been hand lettered, not produced from type.<br>
      I wonder to what extent that informs the shapes of the letters in this early example of comprehensive, controlled branding.<br>
      It might be worth investigating manuals of sign-writing/lettering/trade cards from the same era.<br>
      This from 1933. Note the two "S"s in the title, different, but both constructed from arcs of circle.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/33(8)_3792.jpg"></div><p></p>
