      <p>I wonder if SING (Smart Independent Glyphlets) technology will help, depending on which applications you are using.</p>
      <p>I trust your Korean office will be able to handle any requests to Yoon Design. But it might help to tell them that supplying missing glyphs upon request of clients is part of the 'global standard'. Let me know in case you need help with translation.</p>
      <p>Are you pairing Yoon Gothic with another font for the Latin or are you just using the default Latin provided with it? In the case of the former, you would just use the ® in the Latin font. If the font will be used for bilingual text, not just the occasional Latin acronyms thrown in a mostly Korean text, then it will be worth considering using a Latin-specific font compatible with Yoon Gothic anyway.</p>
      <p>By the way, what 'version' of Yoon Gothic are you using? The latest is the 500 range, and though I haven't used it, it's possible that they have added some character support. But admittedly, character support has not been Yoon Design's strong suit compared to rival Korean foundries (8700 characters means no Chinese character support and only the most commonly-used modern Korean characters).</p>
