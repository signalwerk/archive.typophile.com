      <p>If you want to work on a font that big you will need to use Fontlab’s Asia Font studio. Fontforge (a free/open-source font editor) might also be able to handle a font of that size.</p>
      <p>But if you’ve bought 35 licenses of what I imagine was a very expensive typeface I think you should call up the vendor and ask them to do it.</p>
