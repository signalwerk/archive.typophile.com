      <p>I second James's comment: If your agency has made a substantial investment in a professional font, then I think you should contact the original foundry and request that they add the ® for you. Like you say, probably should have been in there from the beginning. I think it's a reasonable request. </p>
      <p>It certainly can't hurt to ask, and might be the most effective way to get this done.</p>
