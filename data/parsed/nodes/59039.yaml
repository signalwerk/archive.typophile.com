    <p>Hi All...</p>
    <p>Does anyone know if it's possibly to open and edit a protected font??</p>
    <p>I am not trying to ruin anything or stealing any fonts, but i am working on a major global Agency and at our Korean office they have been so smart to buy a otherwise great font called YoonGothic..</p>
    <p>My problem and the reason why i need to edit it is it simply don't contain ® (Registreded R)<br>
    Which is quiet a big problem since we are doing work on an strongly legal controlled client..</p>
    <p>I have change designed and changed font's with Typetool3 and Fontlab Studio before, but this font i am not able to open up and re-design...</p>
    <p>I know a lot of people might think that what i am doing is wrong but consider this, how can a professional font design company make a font with roughly 8700 characters not not design a ®... especially when thinking of the Korean office have bought 35 licenses at a pretty hefty price..</p>
    <p>Thanks in Advance<br>
    Nicklas</p>
