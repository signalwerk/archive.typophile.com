    html: '<p>Lund, I have to agree with Scott &amp; bj. It might be better to develop a pure typographic logo.  <br> <br>Even if you insist to use a pictorial elements, than they probably should be more logo-like. (There is a functional point as well: imagine this photo on a fax or photocopy). <br> <br>Maybe you should also try to make the type more compact. Right now it seems that those letters have just been typed, not really "designed".  <br> <br>Maybe the feeling of this logo is too "Clinic" and not enough "Weight Loss". Honestly, it is not just about health, is it?</p>'
