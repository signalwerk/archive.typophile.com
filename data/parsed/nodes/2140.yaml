    html: <p>I think BJs concept of heavy and thin weights in the type is perfect. Lose the map and tape measure and create a clever typographical logo. As BJ suggested, work the type using bold and light. Maybe it's a progression (or maybe more appropriately regression) from Black to Heavy/Bold to Regular/Roman to Thin/Light, etc. Maybe the distinction is within the letters of "Connecticut" or maybe it is made from word to word. Or maybe the effect is only present in the words "Weight Loss". Try it and see what you come up with. <br> <br>Aloha! <br>Scott</p>
