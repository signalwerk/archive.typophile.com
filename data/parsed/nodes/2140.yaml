    html: "<p>Lund, welcome to typophile. <br> <br>The main issue seems to be cohesion (or lack of cohesion). <br>Something about the arrangement leaves me feeling like <br>it could improved. <br> <br>Some things that you might consider: <br> <br>* a weight change between Connecticut (bold) <br>and Weight Loss Clinic (reg), pun at random. <br> <br>* all caps for Connecticut. <br> <br>* maybe set the name underneath the state. <br> <br>* why not try some sketches of some other ideas <br>or other typefaces. <br> <br>also, it's 4;30 a.m. so the typo on connecticut <br>would be easy to overlook. <br> <br>good luck ...<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br></p>"
