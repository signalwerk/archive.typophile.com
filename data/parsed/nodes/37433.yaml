    html: |-
      <p>Think of mass having gravitation in the opposite direction. The large mass of straight sided glyphs like H repells and needs more sidebearing. The small mass of circular O sides needs less sidebearing. It is kinda' like balancing a heavy weight on a teeter board with a light weight by extending the fulcrun of the small wiegt to ballance.</p>
      <p>ChrisL</p>
