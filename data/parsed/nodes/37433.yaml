    html: <p>There is indeed a purely circular arc on the O (and such). At this point the sidebearings are equal to the counter width. I hadn't considered mass vs. distance. I know we are referring to a perceived "mass", but I wonder if it isn't just like physical engineering where linear dimensions and mass don't scale together. If so, there may be no solution for  under and over 1" usage? I will experiment with it a bit to see how metrics alter things.</p>
