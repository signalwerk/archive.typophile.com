      <p>Choz, it is a ying and yang thing to me. I just go back and forth with a few key glyphs in a test word until the thing binds itself together. There is nothing absolute enough about type design for me to be able to set up a step-by-step procedure. Everything stays plastic and nothing is imune from change until it lets you know by seeing. Of course, that may be why I never get anything finished :-)</p>
      <p>ChrisL</p>
