      <p>Overshoot with perfect circle O is trickier than overshoot with a more flat bottom O. You are trying to ballance the perceived mass and distance of that mass from neighboring glyphs. It may be more an issue of font metricks. Try your problematic sizes with tighter and looser sidebearings and see what happens. </p>
      <p>ChrisL</p>
