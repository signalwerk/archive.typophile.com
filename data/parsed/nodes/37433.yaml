    <p>A current project involves a geometric, fairly black poster face. When printing waterfall specimens, it seems that the overshoot becomes increasingly inadequate at larger sizes. When I get it too look right at 1-2 inch height, it then looks over-overshot at .33 -.75 sizes.  Is this just a nature of typefaces intended for larger sizes? Does weight play a factor I hadn't anticipated? I'm curious to hear what others have observed. If anyone here has developed different optical sizes, did they overshoot them each uniquely? How?</p>
    <p>Oddly, the overshoot, or lack of, seems to matter least, at .25 inch and smaller. This only seems to be true on paper, so it may be a printing artifact.  Due to the geometric nature, I expected this to be truer at larger sizes, not the reverse.</p>
