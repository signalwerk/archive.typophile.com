      <p>Obviously, it’s not a font, but handpainted.<br>
      You will find similar shapes in Copperplate Gothic (<a href="http://new.myfonts.com/search/copperplate+gothic/" title="http://new.myfonts.com/search/copperplate+gothic/">http://new.myfonts.com/search/copperplate+gothic/</a>) and probably in some of the Letterhead Fonts (<a href="http://www.letterheadfonts.com/" title="http://www.letterheadfonts.com/">http://www.letterheadfonts.com/</a>) offerings.</p>
