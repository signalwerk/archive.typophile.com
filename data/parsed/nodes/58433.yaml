      <p>@ Thomas: Sounds like an interesting study. This could make a great thread. Can you tell us a little more about yourself and your experimental design?</p>
      <p>1. How are you operationalizing the term "authority"<br>
      2. How are you asking participants (Ss) to rate authority?<br>
      3. Your independent variables (IV's) are typeface (serif and sans). Have you selected any? If so, which ones and why?<br>
      4. What text are you having Ss read?<br>
      5. What school do you go to?<br>
      6. Who is supervising your study?<br>
      7. Do you have any background in cognitive/experimental psychology?</p>
      <p>As far as research goes, you need to get access to science journals and databases. PsychINFO and Web of Science are probably going to be of most use. If your school does not have access to them, I would strongly ask your supervisor/department head to find someone who does and put you in touch with them. Conducting a lit search without access to such databases &amp;c is asking you to operate with a significant disadvantage. It is a <em>very</em> important skill to develop in the field of experimental psychology.</p>
