      <p>@paragraph: Interesting demonstration. You hardly ever see serif fonts being used for government agencies, or law enforcement for that matter. But is the typeface itself communicating that authority, or are we conditioned to respond to that font in such a way because, through repeated exposure, we now associate it with the qualities and values represented by the Federal Bureau of Investigation? In other words, are those qualities imparted on the typeface by the context in which it is used, or is there something innate about that font that lends itself to communicate authority?</p>
      <p>I would venture to guess that government agencies choose sans serif fonts not because they communicate authority, but because many of them tend to be colder and less personal than many serif fonts. However, I may be way off.</p>
      <p>It's going to be very difficult to generalize the findings of this study across all applications. If you will be using law firms, for example, I think that your conclusions, however significant, will only be applicable to law firms.</p>
