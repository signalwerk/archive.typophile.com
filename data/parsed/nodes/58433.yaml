      <p>Thanks for engaging in the discussion and in doing so, providing me with things to consider.</p>
      <p>I've decided on defining authority/status as a construct made up of believability (not credible/credible, not convincing/convincing, etc.), expertise (unskilled/skilled, unknowledgeable/knowledgeable, etc.), and trustworthiness (unreliable/reliable, untrustworthy/trustworthy, etc.). Participants will be questioned on their perception of the author of the text, one group receiving a serif version, the other a sans serif. I haven't decided on the content of the text itself, but it will be about half a page in length, as opposed to my earlier idea of doing law firms, etc.</p>
