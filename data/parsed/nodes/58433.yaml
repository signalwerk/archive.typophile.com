      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/Observer-expectancy_effect" rel="nofollow">Observer expectancy effect</a>. This is why it's risky to start with a bias. Solution = have a research assistant who does not know what your hypothesis is run Ss.</p>
      <p>In order to conduct research like this you will probably need support from a supervisor with a strong background in experimental psychology to help you, and the equivalent of a second year psychology course (usually called Psych 2000), some stats and a few labs. If you plan on being published in a peer-review journal as opposed to a design magazine &amp;c you may need to go through ethics approval (nightmare) as you're using human Ss. </p>
      <p>@ Thomas: I encourage you to explore this as I believe scientific research of this nature is an important part of the future of our professions.</p>
      <p>@ chimerical: <em>What happens if your research suggests the opposite?</em>. You raise a good point. A <a class="freelinking external" href="http://en.wikipedia.org/wiki/Null-hypothesis" rel="nofollow">null hypothesis</a>. This is where the math starts to get tricky.</p>
