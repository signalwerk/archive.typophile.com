      <p>Both the FBI and Stop sign examples were what I thought of first as well. Type as voice is important, but as Nick points out: context is everything.</p>
      <p>I think that the comparison of serif vs sans would work best with words that are out of context or are perhaps not even words. Would "glakbp" be more authoritative in Times or Arial? But then we run into the other big problem: which serif and which sans? Perhaps a family with both, such as Meta and Meta Serif or Scala and Scala Sans (to name two), would help to minimize the problem? Unfortunately, serif type and sans serif type both come in 1,000s of variations. So, really, your study would be dealing with one serif style vs. one sans serif style. I don't think you can make a definitive distinction with such broad terms.</p>
      <p>I suspect, as I think many others here do, that this study is subject to so many fluid cultural factors that the data would only really be valuable as a continuum of samples taken regularly over an extended period of time and in multiple geographic locations. Many of us here are designers and we all have robust toolkits for manipulating perception that could probably subvert the outcomes of the study pretty easily. In eliminating the variables designers use to inject meaning and provide context to content, you would be removing the study so far from the reality of type as it's used, that I'm not sure if the data would yield information of much value beyond an extremely narrow case.</p>
      <p>I'm happy to hear that you're interested in examining type's effects, but I think a further refinement of the study's parameters is in order. I recommend that you educate yourself about type, then pick the aspects you want to study. I believe serif vs. sans is simultaneously too granular and too broad to allow for conclusive and meaningful results, because type performs such a unique role in the world.</p>
