      <p>My main approach will be to present the participants with four names (in different fonts) of lawyer firms, museums, or dictionaries, and have them rate them on authority. Of course, I will rotate the fonts used, in order to eliminate the possibility that one firm/museum/dictionary will have a better-sounding name.</p>
