      <p><cite>First we would have to define what kind of authority we refer to.</cite></p>
      <p>This is why I suggested that the experiments explore how typeface choice affects the credibility of a message perceived to have authority rather than assume that a typeface imparts authority directly. To further your example, a stop sign is both authoritative and a warning that one obeys for the sake of self-preservation. Using a wispy serif, or even comic sans, probably has no more impact on the credibility of the message than a heavy sans, because most people still don’t desire to blow through an intersection and get sideswiped by a truck. But I’m not sure that this would be the case with highway signs restricting carpool lanes to a car with three occupants—in that case drivers are already resentful of the authority behind the sign and its policies, and a break with the sans norm might discredit the message and lead to it being ignored. And of course this is all culturally relative!</p>
