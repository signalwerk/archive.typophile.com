      <p><cite>So, by having the participants rate texts on authority, I intend to establish that serifs are more authoritative than sans serifs.</cite></p>
      <p>Maybe I’m just unfamiliar with the grammar of psych academia, but shouldn’t you intend to determine whether or not a typeface with serifs can enhance the authoritative tone of text? And isn’t authoritativeness a product of the nature of the text? Serifs may be able to enhance the credibility of an authoritative piece of writing in the context of a society where figures perceived as authorities tend to use serifs, but serifs are not able to, for example, impart authority to a comedy that is intended to have none.</p>
