      <p><em>...my focus is on providing graphic designers with info on typographic decisions only.</em></p>
      <p>Readers can't tell you that.<br>
      As Dave notes, the "authority" of a typeface will change with the way it's set.<br>
      Depending on what a company symbol and page layout looks like, the same typeface may look dignified or silly, progressive or conservative.</p>
      <p>Symbolic forms such as letters and type have no absolute meaning, but only have meaning in relation to other symbols.<br>
      For the reader, these other symbols are the rest of the document at hand.<br>
      However, for the designer, the realm of typographic significance is more abstract, and encompasses our knowledge of type culture: it is this meta-language we work with to create meaning for readers.</p>
