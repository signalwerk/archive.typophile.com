      <p>I recall c.1980 working on various accounts.<br>
      Some were industrial business-to-business advertisers, and for those one used Helvetica, Futura, Univers, Franklin Gothic...<br>
      On the other hand, for the National Ballet of Canada, classic serifed faces such as Bodoni, Garamond, Goudy, and the then new Pontifex.<br>
      Now, the corporate face of the National Ballet is Helvetica 55.</p>
      <p>Also back then, typeface choice was considered to be an important element of brand differentiation, so at the typical small-town intersection there would be a bank on each corner, each with a different corporate face: Century Oldstyle (National Trust), Palatino (CIBC), Plantin (Scotiabank), etc. Now all the banks here apparently use Frutiger/Myriad.</p>
      <p>So, as a cultural study (rather than an ill-conceived quiz posing as meaningful research), it appears that this is a complex issue involving time and place.</p>
      <p>Why is it that 30 years ago art directors considered a variety of serifed faces suitable for bank advertising, and now a homogenous sans?<br>
      Is type choice a decision of clients, creative directors (with an eye on status/awards within the creative metaculture), or an accurate reflection of what consumers best respond to?</p>
      <p>All of the above, in a dynamically evolving system with multiple feedback loops, an element of chance and perhaps some technological determinism.</p>
      <p>This proposed research may be useful as a snapshot, to compare with future snapshots, but IMO a cultural study should study culture, not masquerade as science, because the only way behavioral science is of any use to creative design is in product development.</p>
