  html: |-
    <p>I'm doing my Bachelor Thesis in English Language and Culture on the perception of typefaces. I intend to establish the existence and extent of the phenomenon that authority is transferred upon the reader through reading the font. So, by having the participants rate texts on authority, I intend to establish that serifs are more authoritative than sans serifs.</p>
    <p>So, my question is, have you perhaps come across past research dealing with the subject of fonts and perception? Currently, I'm looking for any info I can get. Any websites, papers, journals... I'd love to hear from you.</p>
    <p>Thanks,</p>
    <p>Thomas</p>
  html_clean: |-
