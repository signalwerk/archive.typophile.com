    html: <p>Well, this is a problem not with the /tracker or the noise or new users posting into whatever default section, but with the lack of basic usability provisions on the forum. The /tracker should allow subscriptions to the forums you are interested in. It should allow subscribing to new posts of the users you are interested in. It should allow subscribing to the new comments in the posts you are interested in. This is trivial to implement. Like "few hours of poking around the code" trivial. The fact none of this has been done in - what? - 10 years of Typophile's existence just shows that it is not likely to be ever done at all. Making members' lives on the forum more comfortable is clearly not a priority for Typophile's admins.</p>
