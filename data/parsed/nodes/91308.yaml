    <p><a href="http://typophile.com/node/91144" title="http://typophile.com/node/91144">http://typophile.com/node/91144</a><br>
    (Original post was edited to remove "for free".)</p>
    <p>Providing a service is useful. But not if it drains<br>
    too much energy/focus. On the other hand, when<br>
    you provide one service people might stick around<br>
    for another, and even start helping others.</p>
    <p>Especially if there will not be a way to filter the<br>
    browsing experience on Typophile, I suggest that<br>
    Punchcut conduct a quick statistical analysis that<br>
    aims to find out: what proportion of people who ask<br>
    for type IDs never do anything else here. If we find<br>
    that most people who get IDs here only use this site<br>
    for that purpose, I propose that we start charging<br>
    US$1 per ID request.</p>
    <p>Although this might raise a modest sum over time,<br>
    the main goal is to discourage ID parasitism. But that's<br>
    assuming ID requesters don't hang around for much<br>
    else; if they do, I for one wouldn't mind keeping it free,<br>
    but then filtering would be needed after all.</p>
    <p>hhp</p>
