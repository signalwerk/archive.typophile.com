    <p>needing to make wooden nameplates, so trying to stick as close to original font as possible.<br>
    I am far from being a pro at this, so of course I be looking for something free to use.<br>
    my humble guess of closeness is comic sans for the one and freestyle for the other, but neither is really close.<br>
    already tried whatthefont, identifont, etc, got nothing even close.<br>
    stumbled across here, and joined in the hopes someone knows what these are.<br>
    Thanks very much in advance for any and all suggestions.<br>
      Thanks.</p>
