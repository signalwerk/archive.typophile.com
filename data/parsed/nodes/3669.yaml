    html: <p>The John Deere logo was probably based on <a href="http://www.myfonts.com/fonts/linotype/trade-gothic/lh-bold-extended/testdrive.html?s=JOHN%20DEERE&amp;p=36" target="_blank"> Trade Gothic Extended</a>.  <br>All the characters match, but of course you can tell it's adapted because  <br>of the heavier weight and small caps.</p>
