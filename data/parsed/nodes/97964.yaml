    <p>Hello everyone!<br>
    I'm Francesco Panatta, an italian student of gaphic design.<br>
    I'm doing research for my graduation thesis, about the relationship between lettering and politics and I need suggestions and bibliographical information on the theme.<br>
    Some of the most important cases I found are:<br>
    Roman epigraphy;<br>
    Carlo Magno;<br>
    Romain du Roi;<br>
    the use and disuse of fraktur in germany;<br>
    Could you please help me with your tips?<br>
    Thank you very much for your attention.</p>
    <p>Best Regards :)</p>
    <p>—F</p>
