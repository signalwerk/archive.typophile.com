    <p>At Greater Albion we’re still putting the finishing touches to our next major release, ‘Crewekerne’-in the meantime we’ve been having some fun trying it out in ‘real-world’ applications and we'd be greatful for any feedback or suggestions.</p>
    <p>Crewekerne offers a hand drawn Roman family intended to be in the best traditions of the ‘Arts and Crafts’ movement of the early 20th century.  Here are two specimens of Crewekerne in action:</p>
