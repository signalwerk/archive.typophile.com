  html: |-
    <p>Hi Colleagues,</p>
    <p>I need a help to find the source of a font. I will be very grateful with yours wisdom, helping me to find the source of this font. The font is part of my graduate academic thesis, where I write about font revival and need, as part of the thesis, create my own revival.</p>
    <p>The font is attached. I am working since many years in this revival and, unfortunatelly, the original source is actually lost and I cant<br>
    remember where it comes from. Maybe the original name is signet, but I am not sure.</p>
    <p>I need a help to fill the blanks. Is it possible?</p>
    <p>Chyrllene K,<br>
    Intellecta Design<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Image_4117.jpg"></div><p></p>
