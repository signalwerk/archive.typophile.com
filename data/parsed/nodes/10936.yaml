    html: <p>Thanks for your input. <br> <br>Maybe I should have said brutally honest? Was your first statement brutally honest or just brutal? <br> <br>Anyway, assuming there is some hope left for this design, below are ammendments I have made based on your comments. Top is the original, second is a removal of all the terminals (its hard to see, but both caps and non-caps have little up-turned terminals in the original which softens them a little), the third one is an attempt to compensate the terminals by making the Caps terminals less pronounced but still upturned and the last one is the same as the third but with the caps horizontally scaled even more. I'm reluctant to do this because I wanted the letters based on the logo I had designed but maybe I'm just clinging on to a bad idea...<img src="http://www.typophile.com/forums/messages/29/8572.jpg" alt="iterations"></p>
