  html: <p>Hello, please be brutal. <br> <br>It's for the company I work for. We primarily have past experience doing entertainment work (club/theatre promotions etc.) but are moving into corporate design and a new office with it. <br> <br>The idea of this logo is to show the company as being made up of two cells of the same genus, with a different logo for both departments. The typeface is based on the cell motif and if successful I will make a full set for the smaller type and other promo material etc. (at the moment I have used Eurostile as it is superifically similar).<img src="http://www.typophile.com/forums/messages/29/8565.jpg" alt="Logo departmental variants and b/w alternative"></p>
