    html: "<p>Good typographic suggestions from JFP. Yeah, I'm not real fond of it either. I think my main objection is the amount of stuff happening. You've got the icon, there's the word century, and 23 and a scentence.  IMHO 4 is rather a lot of elements for a logo. <br> <br>There are several things you might try.  <br> <br>1) Try it without the mark, and focusing on the words Century 23 and the tags. <br>I'm just not buying the 2 cells of the same genus business. I guess I understand the motivation with two business focuses, but in practice I don't know that your logo is communicating that, or even needs to. <br> <br>2) Maybe eliminate the space between Century and 23 -&gt; Century23. Either that or make the 23 your mark and really go for it. <br> <br>3) The scentences. The placement is off. It looks like the tail of the y was giving you fits :-) I would take these out too (if possible) and let the color differentiate. Are you talking two different companies, or just two aspects of your business? If the latter, I'd fight to drop the words all together and at most differentiate with color. <br> <br>I've made alot of assumptions about your business, so feel free to tell me to take a walk. In closing though, (and you're talking to type nuts) since you're designing your own type for this logo (and possibly a corporate font) make this your focus. Take JFP's suggestions and really work the type over until it shines.  <br> <br>For ideas look at Oban and Metron in these forum for some inspiration. I think they lend themselves to a logo like yours: <br><a href=\"http://www.typophile.com/forums/messages/29/962.html?1016189501\" target=\"_blank\">http://www.typophile.com/forums/messages/29/962.html?1016189501</a> <br><a href=\"http://www.typophile.com/forums/messages/29/3079.html?1040120666\" target=\"_blank\">http://www.typophile.com/forums/messages/29/3079.html?1040120666</a> <br> <br>BTW, your project also reminds me of an ID that Duffy Design did for MYND using different colors for differend depts. In was in some annuals and also at <a href=\"http://www.duffy.com\" target=\"_blank\">www.duffy.com</a>. <br> <br>Regards, <br>Randy</p>"
