    html: <p>Kristin,  <br> <br>I have had a similiar problem. I am running Mac OS 10.3.3 Extensis Suitcase X1 and am creating fonts in Fontlab 4.6.  <br> <br>My problem has been specifically with creating OT fonts. I am not yet developing any OT features to these fonts, but just for the cross platform feature. Suitcase doesn't seem to acknowledge them when I try to add them to a set. <br> <br>The OS, however does recognize them when I place them in the fonts folder in my library. I've just been confused up til now, thinking it was my rookie practice of namimg or generating my fonts wrong but it seems as though there must also being something quirky with Suitcase. <br></p>
