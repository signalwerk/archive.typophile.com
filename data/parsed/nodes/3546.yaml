  html: <p>Hello, <br> <br>We created a font in Fontographer and tested it on Suitcase 11 in OS10.3.2. The font does not appear in the preview pane of Suitcase 11 and the activation of the font is very slow (about 10 seconds rather than immediate loading). <br> <br>We also tried Suitcase 10 in OS9.2 with the same results. The font views and prints fine in Quark. <br> <br>Anyone have similar problems or ideas for a fix? <br> <br>kristin <br></p>
