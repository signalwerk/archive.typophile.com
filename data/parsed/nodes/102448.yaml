    date_raw: 23 Apr 2013 — 5:18am
    votes: null
    html: <p>I wonder why it needs serifs at all. They look like an add-on. This work reminds me of the nineties, when it was utterly cool to chop off the serifs from serifed fonts. Look at David Carson’s layouts for Ray Gun. I see the different approach here in Mixtra. The type could do well without the additional serifs. However, me thinks the S and s are too light weighted at the top and the R’s head should be bigger.</p>
