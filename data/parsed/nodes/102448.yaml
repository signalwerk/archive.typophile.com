    html: |-
      <p>I essentially agree with you guys.</p>
      <p>This is a style that's hard to pull off - but I don't think its impossible. Maybe angling the serif-less terminals would help. For example in the "fl" ligature in Patria (where instead of fusing the letters I removed the head half-serif of the "el") I think that makes a big difference.</p>
      <p>hhp</p>
