    <p>I hope the group doesn't mind too much, my continuing this thread a little longer. <br> <br>I've grouped several replies to comments in the end zone of the original thread, below.... <br> <br>Hopefully, it's informative and helpful. <br> <br> <br>darrel said <br> <br>(re my conjecturing about  <br>the probable future of fighting  <br>font software piracy,  <br>compared to recent  <br>Recording Industry Association of America  <br>legal actions/inroads against  <br>audio recording piracy) <br> <br>&gt;The solution we can use is called copyright law. <br>&gt;It's not ideal, but it's what we have.  <br> <br> <br>Yes, that's right. And, related: trademark and patent laws, where they apply (in the case of fonts). <br> <br> <br>&gt;If you  <br>&gt;truly are loosing a large amount of sales to a  <br>&gt;pirate, then you call up the lawyers and act. Yes,  <br>&gt;this favors the Adobes and RIAAs of the world... <br>&gt;not the guy sitting in the basement making fonts.  <br> <br> <br> <br>True, they're more likely to act fastest. But you do what you can. If you're a type designer being wronged, you have to act in some way proportional to what your business can tolerate and potentially succeed with. After all, it's your art. Your craft. <br> <br> <br>&gt;I still stand behind my belief that the best  <br>&gt;solution is simply to cater to your honest  <br>&gt;consumers. <br> <br> <br>Yes, I believe that you are exactly right about that. <br> <br> <br>&gt;Educate people on piracy issues the best you can,  <br>&gt;and hope that your product is good enough to  <br>&gt;encourage enough to purchase.  <br> <br> <br>True. <br> <br> <br>&gt;This is where the RIAA is failing.  <br>&gt;They are neither providing very good product  <br>&gt;these days, and they aren't even willing to  <br>&gt;let me purchase what I want  <br> <br> <br>This is where I think that you're confusing things.  <br> <br>Not giving the public what it wants (granted, often that's something of an amoeba; hard to pin down) is nothing more than a major, possibly widespread, catastrophic failing of the marketing departments at the record companies to understand their market and how the market will react to a given talent in release.  <br> <br>I guess the point could be made that the failings of the marketing departments at the record companies have been going on now for perhaps a decade or two, as they have insisted (according to published reports) on continuing to move everything onto the compiled album as their central sales vehicle. <br> <br> <br>Earlier providing music buyers with the opportunities to buy individual cuts and mix-and-match custom compilations - by about 1993 - would certainly have solved the problem of user frustration over buying options and cost.  <br> <br>And well before the popularization of the internet and the resusitation of peer-to-peer node networking to try to fill the lowest-common-denominator product availability gap. <br> <br> <br>That availability of being able to buy right down to the individual font certainly works in the font industry very well.  <br> <br>It would seem the models in the type industry were there for the recording industry to mimic. <br> <br>(And let's face it, the model of selling the creative product in the type industry, right down to the font, right down to buying a single letter, has existed for the world to see for how many centuries now?) <br> <br>;-) <br> <br>&gt;(and, on top of  <br>&gt;that, they sue their own consumers).  <br> <br> <br>That's simply because of the documented violations of copyright law stacking up. In bulk. Massive, massive bulk quantities.  <br> <br>Surely you don't believe that they are suing their customers for the sport of it?  <br> <br>These undertakings are all major, and all major pains in the neck to managements, employees and to shareholders. If pirates backed off, and if ISPs had been more cooperative and did not seek to mask and protect obvious thievery, it would not have come to this, I'd bet, based on what I've read of it. <br> <br>If music lovers have been so concerned over the want of more buying options, why haven't we seen grassroots groups petitioning the record companies with plans outlined as to how their surveyed customer groups wanted to buy? I don't recall seeing any such effort reported, but of course, I might've missed it. <br> <br>The recording companies, nonetheless, undoubtedly do their own focus group testing and other surveying, to determine customer desire. It's a natural part of marketing, especially where the total revenues at stake go into the realm of what's annually spent on CDs, concert performances, etc. <br> <br>Still, the record companies have a right to run their businesses as they see fit. It is their business. They have a right to market as they determine is best for them. After all, they're the ones who have invested in bringing the talent to market, or to broader audiences, than the talent might've otherwise ever enjoyed on short schedule. <br> <br>If the market doesn't like the way they run their business, or how they package the works by artists they enjoy, then **don't buy the products**. <br> <br>(No, I don't mean steal them instead. I mean, just walk away. Ignore them and their artists. Simply find something else to listen to. Yes, even if it means listening to free radio. Horrors!) <br> <br>Also, write them and tell them you decided to walk away, to not buy. And why you made that decision. <br> <br>Otherwise, things never change for the better. <br> <br> <br>&gt;They need to learn a basic premise of  <br>&gt;capitalism...give the consumer what they  <br>&gt;want at a sellable price...not what you,  <br>&gt;as the vendor, wants. <br> <br>Agreed, wholeheartedly. <br> <br>But again, that they don't is not an argument to steal their property (as defined under applicable copyright law).  <br> <br>Until you take over the recording company with a hostile buyout, etc., it is their business, and their properties. <br> <br>(Again, apologies to the group for the length of this, but I think the comparisons to the type business are worth the ether. And believe me, after this, I'm on ether. And I think I've got the vapors, too. Whatever that is....) <br> <br> <br>Hrant H Papazian said <br> <br>&gt;Joe, they're right. <br> <br>You mean the aliens who took our Elvis away?  <br> <br>;-) <br> <br>I respect your opinion, but I personally don't think they're right. I think they're mixing unrelated arguments into a witches' brew, muddling it. Which is why I'm bothering to spend time helping to sort this out. <br> <br>(Yes, I'm done now. Believe me, I'm not trying to win any marathons.) <br> <br>... <br> <br>And to my <br> <br>&gt; And we're all very lucky we don't live in such barbaric times.  <br> <br>Hrant said <br> <br>&gt;Joe, I'm sorry, but: are you nuts?  <br>&gt;Where do you get your news, the Disney channel?  <br>&gt;And where have you travelled to recently, <br>&gt;Legoland? <br> <br> <br>:-)  I was being sarcastic, momentarily. <br> <br>(I would like to visit Legoland sometime. The various installations of Lego I've seen, and the pictures and video of Legoland, look fun.)                                    <br>                                     <br>                                     <br>Keith Tam said <br> <br>&gt;...Typeface design is such a thankless job. Graphic designers rarely even give credit to the typeface used, never mind the type designer. Why would they even reveal the name of the typeface they used when they didn't even pay for it?! Honestly, I don't see any cut-and-dry way to solve the font piracy problem. Only education can solve it, I think. I really shouldn't tell you this, but I've had an instructor who made a Zip disk full of fonts available for us to use/copy. Now that's really unethical, and it is terribly damaging to the type business. It makes it normal for designers to copy and pass around fonts. Most people here (I assume) won't even dream of pirating fonts. Why? We are just conscientious? We simply appreciate the beauty of typefaces, respect the talents of those who designed them, and understand how much work it takes to design and produce a great typeface. Only when the these values and artistic appreciation abilities are imparted to the students would they stop pirating fonts. These are acquired skills, and can be learnt. Students have to understand that they don't need every single typeface in the world at their fingertips to do great designs. They have to understand a good type library has to be built gradually, over time. <br>                                     <br>                                     <br> <br>Keith, thanks very much for your insights. They add a lot to the discussion. <br> <br>That an instructor would actually do that in 2003 is not just surprising. It's horrifying for all involved. <br> <br>And a good indicator of just how confused the market still is about font piracy. Even amongst people like educators who one would think would know better. <br> <br>Thanks so much for adding what you wrote. <br> <br>Joe <br> <br></p>
