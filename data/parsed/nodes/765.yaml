    html: "<p>&gt;They need to learn a basic premise of  <br>&gt;capitalism...give the consumer what they  <br>&gt;want at a sellable price...not what you,  <br>&gt;as the vendor, wants.  <br> <br>Or, use all of the mass communication channels at your disposal to make the consumer want what you have <br>That makes it much easier to give them what they want <br> <br>&gt;&gt;I don't pirate songs <br>Neither do I, but I have paid 2 or 3 times for much of the music I own. <br>If I already own a vinyl LP, then I buy the CD version of the same album, surely I should only have to pay for the physical production and distribution of the CD - I've already paid for the artist for their talents and time, as well as for the initial recording of the music. <br>Does this argument apply to fonts too? <br>Should I be able to buy all formats of a font for a lower price than: <br>(number of formats X price of individual format - bulk buying discount)  <br>(By format I mean true type, type 1, Mac/PC versions etc) <br></p>"
