  - id: 5405
    user: 1976
    date: 2003-07-30T04:23:00
    date_raw: 30.Jul.2003 4.23am
    votes: null
    html: "<p>steve paxton said <br> <br>&gt;Does this argument apply to fonts too?  <br>Should I be able to buy all formats of a font for a lower price than: (number of formats X price of individual format - bulk buying discount)  <br>(By format I mean true type, type 1, Mac/PC versions etc) <br> <br>Yes, I think that you should. In fact, we do that, and have for years.  <br> <br>We don't give away the second, third or fourth formats (for reasons that have nothing to do with greed). But we do provide them at 50% off the price of the first version, when ordered in the same transaction or within the same month.  <br> <br>So for instance, ordering four from us, one receives: Family volume discount which lops off about 16% on a purchase of four fonts, then the second version discount taking off the next 50%.  <br> <br>If you're a student or educator, you receive 50% off of all of the above. If you quote the current discount code on our home page, another discount applies.  <br> <br>Is that enough multiformat discounting? <br> <br>:-) <br> <br>Joe <br> <br></p>"
    html_clean: "<p>steve paxton said <br> <br>&gt;Does this argument apply to fonts too?  <br>Should I be able to buy all formats of a font for a lower price than: (number of formats X price of individual format - bulk buying discount)  <br>(By format I mean true type, type 1, Mac/PC versions etc) <br> <br>Yes, I think that you should. In fact, we do that, and have for years.  <br> <br>We don't give away the second, third or fourth formats (for reasons that have nothing to do with greed). But we do provide them at 50% off the price of the first version, when ordered in the same transaction or within the same month.  <br> <br>So for instance, ordering four from us, one receives: Family volume discount which lops off about 16% on a purchase of four fonts, then the second version discount taking off the next 50%.  <br> <br>If you're a student or educator, you receive 50% off of all of the above. If you quote the current discount code on our home page, another discount applies.  <br> <br>Is that enough multiformat discounting? <br> <br>:-) <br> <br>Joe <br> <br></p>"
  - id: 5406
    user: 1976
    date: 2003-07-30T04:31:00
    date_raw: 30.Jul.2003 4.31am
    votes: null
    html: <p>david hamuel said <br> <br>&gt;i don't understand why the design of  <br>&gt;a typeface is not protected - like in  <br>&gt;many european countries.  <br> <br> <br>Protection for at least the data description of an outline letter has gotten better in recent years. <br> <br>The reason why the USA has lagged so far behind other nations on this in many ways boils down to the significant amounts of lobbying and lying to the courts over the decades, effectively fooling the lawmakers into believing that font letterforms are more or less generic carriers, with no intrinsic unique value. <br> <br>As with the glazing over that your family and friends do when you start to describe what you do as a designer, so have the judges trying cases against pirates in earlier decades.  <br> <br>It's not unusual for the judges to fall asleep when the exposition turns to comparing two blowups of the letter A, for instance, with callouts showing similarities.... <br> <br>Joe <br> <br></p>
