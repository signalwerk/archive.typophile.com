    html: |-
      <p><cite>your ¢ terminals are different from those of c.</cite></p>
      <p>It's based on petite cap C. I made monetary symbols using small caps or petite caps, except dong, livre-tournois, cent and mill. But there are corrections to do here: Euro terminals need to be stronger and dong is still a bit heavy.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cur_4190.gif"></div><p></p>
      <p><em>Currency symbols.</em></p>
      <p>Again, I agree with you: a parallel bar (to left side of A) surely produces the best result. There is a font using this, Linux Libertine I guess. But unhappily these characters are used in the same languages and the conflict between slopes become very ugly.</p>
      <p>Here is another try for slashed A, C, E and T. Closed counterspace is still problematic in A. But if bar is moved to the right, the left base appear very thick. So only acceptable possibilities are to coincide with left base or to stand far from it:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slashes_6400.gif"></div><p></p>
      <p><em>Slashed ACET with an Ø-like bar.</em></p>
