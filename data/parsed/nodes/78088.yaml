    <p>Slash as a diacritic is almost only known to produce Øø. For these glyphs, there are specific design recommendations (slash would be centered and its extremes would match or be near the O extremes). Here are the Øø from the font I'm preparing:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/slash01_3567.gif"></div><p></p>
    <p><em>Slashed Oo.</em></p>
    <p>Although much less common, there are other characters with the diacritic slash, as A, C, E and T. But in all fonts I verify, slash applied to these letters is clearly different than the Øø. It is usually steeper and goes well beyond baseline/caps height.</p>
    <p>You can find a list of fonts with these characters here: <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/23a/fontsupport.htm" rel="nofollow">A</a>, <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/23B/fontsupport.htm" rel="nofollow">C</a>, <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/246/fontsupport.htm" rel="nofollow">E</a>, and <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/23E/fontsupport.htm" rel="nofollow">T</a>.</p>
    <p>Maybe this is due to the angle of Øø slash, which produces bad results for AaEeTt, whose widths are smaller than Oo. It also cannot be centered exactly without causing some undesired overlaps.</p>
    <p>I made some tests and decided to also use a different slash for these letters, as found in other fonts. But I'm quite unsure if this is the better solution:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/slash02_5237.gif"></div><p></p>
    <p><em>Slashed letters.</em></p>
    <p>What is your opinion?</p>
