    html: |-
      <p>I think it's fair to give a feedback about how the issue was concluded. I decided to adopt the same slash from Ø, with small adjusts. For example: slash for E is thinner than for C due to optical illusion.</p>
      <p>Lowercase also follows this criteria. For t, I extended the bar a bit to the right, so it glues to slash.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slashes_6366.gif"></div><p></p>
      <p><em> Slashed uppercase and lowercase sets.</em></p>
      <p>I must thanks Frode Frank once more. His tip is really useful and I'm using it in many situations aside Øø. This gives an idea about how I used it to correct optical illusions:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/optical_5506.gif"></div><p></p>
      <p><em>Optical correction for slash and stroke.</em></p>
