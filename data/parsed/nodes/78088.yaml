      <p>To me, the most glaring difference is that Ø and ø appear to be actual letters, where constant use developed proper design guidelines. While the others appear to be just constructions, where the juxtaposition of a slash bears no connection either with handwriting nor with the shape of the letter. This is most evident on A-slash.<br>
      That’s not a problem with your solution (which works) but with the glyphs themselves.<br>
      Out of curiosity, how different is your ¢ from c-slash?</p>
