    html: |-
      <p>OK, I checked everything. Nick, I think you nailed it. Apart from the narrower UC 'D', <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.8295.0.1&amp;attributes.sampleSize=60&amp;sampleText=Destricted&amp;sampleSize=74" rel="nofollow">Times Modern</a> is indeed a perfect match.</p>
      <p>Stephen, why do you think this is ITC Bookman? The sample has sharp, pointy serifs, while ITC Bookman's got <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=M.125939.0.3&amp;attributes.sampleSize=60&amp;sampleText=Destricted&amp;sampleSize=48" rel="nofollow">chunky rectangular ones</a>. Any amount of <a href="/wiki/squooshed" class="freelinking" rel="nofollow">squooshing</a> the type will never get you anywhere close.</p>
    html_clean: |-
