    html: <p>In most cases one cannot interpolate well between two fonts with extreme differences in contrast such as a very light weight and a bold weight. Using anisotropic interpolation (in Superpolator or UFOstretch) will give you a regular weight that’s a good starting point but will need a great deal of cleanup work before the design is finished. Once the regular master is done you can then interpolate between the three masters to get everything you need.</p>
