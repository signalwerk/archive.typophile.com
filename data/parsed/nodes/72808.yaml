  html: |-
    <p><strong>Hello everyone,</strong></p>
    <p>I'm currently doing a 3 weight typeface (light, regular &amp; bold), I've almost finished the regular version and I have the ligh's &amp; bold's without the accents and some other glyphs.</p>
    <p>Which, do you think, is the best way of building a typeface of several weights without using Multiple Master*? </p>
    <p>*I've used it, making a weight axis (light &amp; bold) but the regular strokes and curves doesen't quite convince me, and it takes me a lot of work to design the glyphs in ligh and bold to be able to see the regular version...</p>
    <p>Thanks!</p>
