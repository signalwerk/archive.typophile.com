    html: <p>I do not really know whether it is good or not. I would just say, I do not really like it because the proportion is not "balanced" as if very thin elves. They are a little too narrow. I do not mind the huge x-height, but it does not help with the legibility. I do not know. They just feel weird to me. My suggestion is, pick an existing typeface that is similar to your goal, and then basing on that typeface you innovate a new one. By doing that, getting the "correct" proportion should be no problem.</p>
