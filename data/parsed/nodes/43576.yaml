    <p>I was working on this typeface awhile back for my logo.  I am wondering if it is even worth it to continue on this project.  I'm not too experienced with typography.  This is somewhat the first time I have even attempted something like this.</p>
    <p>Another thing, I used two fonts for this, and I don't even remember the second one.  The first is Times.  If you can identify the other, that would be amazing!</p><div class="imageWrap"><img src="http://typophile.com/files/MikleBanks_3883.jpg"></div><p></p>
