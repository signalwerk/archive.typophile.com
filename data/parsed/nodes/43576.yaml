    html: <p>As a concept it could work but there are some problems with the letterforms in shape spacing &amp; so on. If you keep going I would reconsider making the top of the i under the dot take the same shape as the l and/or I would let the letter be less tall. The k needs to be redrawn with the weight distributed more like Times. Part of the trouble is that you have an italic weight distribution for your loop but the letter is upright. Some tweaks you made are distracting like the way the bowl joins the upright on the a. The logo has to be unified. This pulls in too many directions. I can't tell you if you should keep going. You could explain the context more fully...</p>
