    date: 2013-05-09T15:40:00
    date_raw: 9 May 2013 — 3:40pm
    votes: null
    html: <p>Yes. I'm not sure why the problem was only visible in the Italic (might have something to do with Indesign) but the smcp feature (the opentype classes it involved, to be precise) contained a few glyph names which were not actually in the fontfile. I had created the smcp feature before I deleted the glyphs, and forgot to remove them from the opentype class. When I deleted them, everything worked again :)</p>
    html_clean: <p>Yes. I'm not sure why the problem was only visible in the Italic (might have something to do with Indesign) but the smcp feature (the opentype classes it involved, to be precise) contained a few glyph names which were not actually in the fontfile. I had created the smcp feature before I deleted the glyphs, and forgot to remove them from the opentype class. When I deleted them, everything worked again :)</p>
