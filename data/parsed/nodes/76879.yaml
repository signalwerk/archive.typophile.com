  html: |-
    <p>Hi everyone,</p>
    <p>I'm looking for typefaces that were designed / created by a collaboration between a group of people. </p>
    <p>The most prominent project that comes to my mind is <a href="http://www.typesociety.org/fontaid" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Font Aid</a>, but are there any projects like this where a functional typeface was created?</p>
    <p>Whether it's an open source project or perhaps even just a collaboration between a small group of typographers, both old and new, I'm really interested to find out about them - if they exist.</p>
    <p>Thanks amigos.</p>
    <p>Jordan</p>
