      <p>On the side, why are you creating your initial outlines in an SVG file?</p>
      <p>Of course, sometimes you will have outlines in some other format and need to bring them into your font editor. But if that's not the case, and you are drawing them from scratch right now, you may have a MUCH easier time of it drawing the outlines in your font editor instead. Just a thought!</p>
