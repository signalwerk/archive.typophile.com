      <p>I think you may need more info about ascender and descender settings. Hint: descender is always a negative number in normal fonts.</p>
      <p>There is an image here <a class="freelinking external" href="http://fontforge.org/overview.html " rel="nofollow"> FontForge Documentation</a> that should give you a lot of insight on Baseline, Ascender and Descender.</p>
