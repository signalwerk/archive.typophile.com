      <p>Sorry to ramble on but what would be nice is if I could always set my ascender at y=20 and decender at y=980 and then set the baseline, xheight, and cap-height somewhere in-between.</p>
      <p>That would allow all my glyphs to have a bounding box within 1000 x 1000 even if a glyph or two has legitimate need to exceed the ascender/decender a tad.</p>
      <p>Some kind of xml metadata tag in the SVG file to define where the ascender,decender, and baseline are to fontforge on import would be in my mind the easiest way to do that.</p>
