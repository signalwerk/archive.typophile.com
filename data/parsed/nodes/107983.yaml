      <p>OK - it does look like I need to set the baseline at y=800 in the SVG file and it looks like the initial M command in an SVG path, assuming that I start drawing the glyph in the left most position, should be left side bearing.</p>
      <p>I have to read more about left side bearing, I always assumed spacing between letters was done a different way, I guess the left and right side bearing are initial spacing before justification?</p>
      <p>I need to read more about that.</p>
      <p>And it looks like the width of the SVG file needs to be left-side-bearing + bounding box width + right side bearing.</p>
      <p>I'm still trying to figure out how to get the ascender and descender properly identified by FontForge.</p>
