    votes: null
    html: |-
      <p>Each additional weight and style will require its own unique font file. Ideally you would then connect them through the naming metadata, which when set up correctly will build the relationship in different operating systems and applications.</p>
      <p>The guides from <a class="freelinking external" href="http://forum.fontlab.com/index.php?topic=313.0" rel="nofollow">Adam Twardoch</a> and <a class="freelinking external" href="http://www.kltf.de/downloads/FontNaming-kltf.pdf" rel="nofollow">Karsten Luecke</a> are invaluable resources for how to set up this metadata in the most stable way across as many environments as possible.</p>
      <p>Additionally the FontLab manual is an incredible resource, not only relating to the software but to more general principals of digital type design as well.</p>
