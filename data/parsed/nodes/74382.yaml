    <p><strong>New from TypeDNA</strong> is the unique and powerful <strong>standalone Font Manager</strong> and the unique <strong>Plugged-in® solution for Adobe's CS</strong>.</p>
    <p>The TypeDNA Font Manager and TypeDNA Plugged-in® solution help you find the font you want to use fast. TypeDNA includes tools that offer sophisticated character analysis. During installation each font is analyzed, characteristics are determined and from this data a unique font signature is generated. The easy to use interface provides several unique tools that will really like your fonts. Each tool can be used independently or combined for extremely powerful browsing and font selection, direct within your CS5 design applications.</p>
    <p>Tools include: Similar Fonts, Font Harmony, Attribute Filters and  SmartChoice.</p>
    <p><a href="http://www.typedna.com" title="www.typedna.com">www.typedna.com</a></p>
    <p>Note: The Font Manager is fully operational <strong>without</strong> Adobe CS5, having CS5 will allow you to also run the Font Manager and its tools within Photoshop CS5, Illustrator CS5 and InDesign CS5.</p>
