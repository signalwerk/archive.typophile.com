    html: <p>Chris L has obviously no idea what ot takes to produce a commercial font collection.  The Expresiv Series was introduced at a time when a reasonable font package cost $1,000.  The Ornate collection, and 3 of the 6 collections were value font packages.  No excuses made about quality either - though most were intended for desktop users, they were extensively reviewed and praised at the time.  The products are not currently available.  And, yes, I was the publisher!  Regards, Tim McGuinness, Ph.D. - McGuinnessDesigns.com</p>
