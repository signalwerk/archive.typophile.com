    html: <p>My concern is for the original designers as well. Many of these fonts look very similar to existing fonts by other designers. I would like to know whether the original font designers (or the current owners of the drawings) were contacted or compensated in some way. <br> <br>I tracked down the person who originally purchased the Expresiv font disk. The sense she got was that large font collections such as Expresiv simply weren't available at the time this collection was sold. Perhaps Thomas or someone else can confirm or deny this claim. Was there a lag time in the early years of desktop publishing in acquiring an extensive library of fonts? <br> <br>Thanks for speaking up, Tim. I'm sure that assembling this collection was not an easy task at the time. Can you address our concerns about the original font designers that your collection is copying? <br> <br></p>
