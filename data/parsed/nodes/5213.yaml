    html: "<p>Well, it seems someone has an axe to grind or two. <br> <br>FACTS: <br> <br>We aquired full rights and ownership for several major type houses, and published original designs.  We also published sets from other font houses under license, such as Monotype.  We also published under the original publisher's name as well ( a total of 99 unique products we published by us ) The Expresiv series of 19 products included type for over a dozen type houses (names changed to protect their brands, but they still made their piece) We simply had a different marketing model, oriented to expanding the market, as opposed to marketing to elitists.  As a result, we sold 100,000's, as opposed to simply 100's. <br> <br>We also sold significant clipart collections as well - in all cases original work, under license, paying the designers/owners royalties (as we did with the fonts too).  It's easy to take cheap shots when you haven't a clue. <br> <br>It would also be interesting to look up the copyright laws on fonts.  Type houses have been \"knocking\" each other off for 100 years, because it is legal.  In general, we went after original and interesting collections.  We simply out marketed most others. <br> <br>Why are the collections not available now?  Simple.  The primary sales tool was my Graphics Express Catalog, which was the nations leading graphics product catalog.  It won numerous publishing industry awards for design quality.  Tacky only to an elitist.  It had a subscriber based of 500,000 per issue.  Our list came from companies like Monotype, Adobe, Corel, and others.  The catalog was discontinued in 1997 after the parent company was aquired by Global DirectMail, and I was turned towards moving the company's 16 domestic divisions, and 13 european divisions onto the web.  Thus, when the catalog was closed (not because of profitability - but because of a change in focus), the product line (Expresiv &amp; ProVektor, and the others) were also discontinued.  They may be brought back fairly soon however. <br> <br>Reviewed:  The various products were reviewed by a variety of publications.  Including: Adobe Magazine, Aldus Magazine, Arts&amp;Letters Magazine, Corel Magazine, Desktop Publishing Magazine, Artworx Magazine, PC Magazine, PC World Magazine, and about 50 others.  As always, if you want to pay the price, your welcome to, most did not. <br> <br>I make no apologies about these products.  They enabled vast numbers of customers to produce exceptional designs.  There was variety in quality, such as the Ornate collection which was intended for lower level users.  But we also produced products equal to the best in the market, for a 20th the price.  And yes, there were other large collections in the market from MonoType, Adobe, and others; with prices of $1,000 or more!  Sometimes you make more selling for $29 than a $1,000 <br> <br>FYI, I also happen to be the co-inventor and co-designer of the worlds best selling low and high end forms design applications (which has been in continuous distribution for 18 years!), as well as several major graphics apps.  I do understand the difference between the levels of the publishing industry.  My focus has always been on expanding the market by bringing quality at a lower price, as well as creating new product categories.  It's easy to rag on someone when you haven't produced yourself, but some of us actually create the products you use! <br> <br>Apologize to the list for the rant!</p>"
