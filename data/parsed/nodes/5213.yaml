    html: <p>I notice that Mr. McGuiness made no comment regarding the "knockoff" statements made by other posters. Curious. <br> <br>  I know what it takes to produce a professional font collection including fair payment to the designers of the original fonts. I don't mean just the skilled technicians who made the knock-offs.  Then again you said "commercial font collection" implying the profit margin being large enough to support providing cheap type�basically the business of selling as opposed to designing type.  The two are NOT mutually exclusive.  There are font houses who pay designers for the products they profit from. I wonder if that is the case here? Tim? Did you pay the original designers of the fonts you "based your collection on" or did you just make the type just a tad different knowing how pathetic the IP and copyrights laws were then? <br> <br>The truth is Tom, my comments were aimed at the presentaion I saw in the catalogues which came in the mail, not at the actual fonts which (seeing the tacky catalogues) I never purchased.  I am sure your font producers did a bang-up job of copying.  <br>  <br>You did give yourself an out.  You said the type was aimed at the "Desktop Publishing" market and you probably hit that right on the tacky target.  But, I was not part of the DTP crowd, no maroon polyester pants with white belt and matching shoes in my closet.  <br> <br>I wonder who reviewed and praised those knock-off beauties? I am sure they were top type designers of the eighties. I am sure Tim will name names of the deserving design masters who reviewed the work and make me look like a fool�at least I hope he does. <br> <br>ChrisL</p>
