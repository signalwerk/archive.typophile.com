  html: |-
    <p>A sharp geometric font. Horizontal strokes that are normally around x-height are lowered. Used in context with a 60s themed television show "Masters of Sex."</p>
    <p>I think it almost 100% matches Neutraface but the /t/ in the picture doesn't have as tall an ascender as the sample text on the website (Neutra Display Bold):<br>
    <a href="http://www.houseind.com/fonts/neutraface" title="http://www.houseind.com/fonts/neutraface">http://www.houseind.com/fonts/neutraface</a></p>
    <p>Thanks in advance</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/x_5716.jpg"></div><p></p>
