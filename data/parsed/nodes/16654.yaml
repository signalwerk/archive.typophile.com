    html: |-
      <p>Wow, I like this one.<br>
      The main thing I would point is that you should try to (eventually) make multiple cuts of this design -with varying "gap" widths- for use at different sizes. This is because the gaps will either look too big when the font is used large or too small (to the point of clotting) when it's used small. The appropriate "delicateness" of features (in this case the gaps) depends very heavily on size.</p>
      <p>hhp</p>
