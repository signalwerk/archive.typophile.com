    html: |-
      <p>Wai Har,<br>
      the type you have drawn is dynamic, to say the least. It will find a purpose I am shure although I wouldn't know where to use it. It looks fun though. The basic lettershapes, the skeleton so to speak, look very familiar, although I cannot put my finger on it where I could know them from.<br>
      A couple of things caught my eye:<br>
      – I like the idiosyncrasy of th 'J'<br>
      – The 'N' looks very tight<br>
      – The 'W' appears very wide and resisting the italic slant<br>
      - The 'a' seems to move to the left whereas all (italic) shapes are leaning to the right, this might look bad when set in words.<br>
      - The bowls of the 'g' and 'q' are different from, say, 'a' or 'p'</p>
      <p>I hope this doesn't put you of but helps you make your own decisions and create something that gets better &amp; better.</p>
      <p>Look after Goodness &amp; Truth<br>
      &amp; Beauty will look after itself</p>
