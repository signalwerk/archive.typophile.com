  html: <p>What if the J. Crew catalogue still showed all their stone-washed jeans from the 80s. You know, just in case someone wanted them. <br> <br>I don't want my last post in the <a href="http://www.typophile.com/forums/messages/30/22787.html">Beginning a Font Collection</a> thread to leave a negative tone, (it's the holidays for cryin' out loud.) So, I have a recommendation for the shepherds of the big, old collections at Bitstream, Linotype, Adobe, ITC, etc. (Nick, you won't mind me piggybacking off your earlier observation?) <br> <br><b>1</b> Weed out the duds / oldies immediately. (Come on, you know which ones, they match those tweed jackets with the elbow patches.) <br> <br><b>2</b> In 12 years re-release them as a retro pack. You're just sitting on a gold mine that just has to age for a while. In the meantime you'll be helping keep Hobo off our streets (pun fully intended). <br> <br>What foundries already do this? I know the good stock photo agencies do. They have to for their own credibility. (Oh, and Getty, if you're listening, Photodisc is ripe for the "archive" bin.)</p>
