    html: "<p>A woman pressing Chianti with her feet, haha. <br> <br>Buy an ACTUAL Jenson?! I'd give my firstborn child (if I had one, which I don't) for one. I suggested to the University of Liverpool that they should make and market a digital copy of theirs, but they apparently have only one staff photographer, and she is busy with other projects at the moment. <br> <br>\"there's an article that might interest you: it's called \"Photographic Enlargements of Type Forms\" by Philip Gaskell, in the Journal of the Printing Historical Society, #7, 1971, pp 51-53, with 12 plates. One of the plates is from the De Evangelica of 1470; it shows about 60 letters, at just over 1\" em height. Want a scan? \" <br> <br>Do you have a scan available? I'd love to see that, but I don't want to put you out.</p>"
