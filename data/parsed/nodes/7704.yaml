  html: <p>I'm working on an impressionist interpretation of Nicolas Jenson's roman from his version of Pliny's Historia Naturalis. Unfortunately, I don't have the complete character set. <br> <br>So far, two universities (Liverpool &amp; Glasgow) with copies of the Jenson Pliny have let me down regarding requests for high-resolution photographs. Does anyone know of an institution that might be more helpful? I fully expect to pay through the nose. I just don't want to be fobbed off with excuses.</p>
