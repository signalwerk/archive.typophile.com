    html: |-
      <p>Actually if you don't recall then you must be over it!<br>
      Anyway, it wasn't a big deal. Plus I was actually on your side.</p>
      <p>My parents' case, originally a gift to me from my brother's mother-in-law-to-be, is from/in Lebanon, and did have variance in compartment size, but it seems to me not as much as the letter frequencies of Latinate scripts would require. I'm guessing it was for Arabic type because Arabic has four cases per letter (for most of its letters) and that "flattens" the required sort frequencies - but it's just a guess.</p>
      <p>&gt; however, you see what happens when you remove<br>
      &gt; cases from their native environment/raison d’etre. </p>
      <p>Yes, and more than the valuation issue of the case I mind that the <cite>font</cite> could be affected negatively: it might become sort of a circus act, losing its dignified standing as a useful thing. BUT that really depends on the customer/user - sort of like how a kitchen knife could be used to cook or kill.</p>
      <p>The fact that I agree with you on this to some extent is why:<br>
      1) It was very important to me to make the case as easy to pull out as it would be from a typecase stand/cabinet. Ideally I see this table being placed inside a printing studio/shop, although for people -like me- who own a metal (or wood!) font but not a press, or maybe own a font so valuable (to them) that they actually avoid using it for fear of wear, I think it can still house the font in a way that maintains dignity. Again, it depends on the customer: he can choose to see/show the font as a freak, or as a living tool.<br>
      2) I decided not to include a case or type with the table (although like I've said I can help the customer locate either or both).</p>
      <p>hhp</p>
