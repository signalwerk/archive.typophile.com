    <p>Based on an idea by master printer Gerald Lange, The MicroFoundry<br>
    has designed and arranged for the manufacture of a unique piece of<br>
    special-interest furniture: the TypeTable.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1s_4623.jpg"></div><p></p>
    <p>Essentially a glass-top coffee table that gracefully accommodates a drawer<br>
    of letterpress type, the TypeTable nicely exhibits an instance of high craft<br>
    for discernment by the typographic aficionado, and is itself crafted to high<br>
    standards: sturdy but elegant construction, to a tolerance of 1/32 of an inch;<br>
    1/2-inch beveled glass; and easy movement of the type drawer into and out<br>
    of the framework, ensuring that the font is not converted into a "museum<br>
    piece" but instead remains a dignified, usable resource. <cite>Note that the purchase<br>
    of the TypeTable does not include a drawer of type; this must be provided by<br>
    the customer, although The MicroFoundry would gladly help in procuring a drawer.</cite></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2s_5146.jpg"></div><p></p>
    <p>With the drawer of type removed, the table reveals its attractive lattice<br>
    midboard, which can be used to exhibit other items (up to 1-1/2 inches in<br>
    height) making this piece of "typographic furniture" highly versatile.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/7s_4870.jpg"></div><p></p>
    <p>The TypeTable has dimensions of 36×18×18 inches, and is offered for sale at<br>
    US$555 (plus delivery costs). It is manufactured on a first-come, first-served<br>
    basis. Please direct all inquiries (including interest in tables that accommodate<br>
    more than one drawer) to Hrant Papazian: hpapazian_at_gmail_dot_com</p>
