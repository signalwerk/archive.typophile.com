  html: |-
    <p><strong><a href="/web/20190925232012/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20190925232012/http://www.typophile.com/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">“How To” Section</a>&nbsp;: Setting Cross-Platform Vertical&nbsp;Metrics</strong></p>
    <p>Originally written by <a href="/web/20190925232012/http://www.typophile.com/node/12151" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Hudson</a> in a thread on <a href="/web/20190925232012/http://www.typophile.com/node/12022" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typophile</a>:</p>
    <p><em>[Note that the descender values in the hhea table and the <span class="caps">OS</span>/2 sTypoDescender field are properly expressed as negative integer (presuming the descender goes below the baseline), while the <span class="caps">OS</span>/2 usWinDescent value is expressed as a positive integer. For the purpose of the discussion below, all values are treated as if they were positive integers, since what matters is the sum of the&nbsp;values.]</em></p>
    <p><strong>The&nbsp;Discrepancy</strong></p>
    <p>Apple originally spec’d the hhea table as part of the TrueType spec. This includes three values for vertical metrics (despite the fact that the full name of the table is ‘Horizontal&nbsp;Header’):</p>
    <p>- Ascender<br>
    - Descender<br>
    -&nbsp;LineGap</p>
    <p>Together, these values determine the default linespacing in Mac applications that use system font metrics. [This is typical of word processing apps, text editors, and other apps that that do not , as a default, handle leading independently of font size. Page layout apps and other professional graphics software will typically not use the font metrics to determine linespacing, but will expect the user to set leading values or will calculate ‘auto’ leading as a percentage of the font&nbsp;size.]</p>
    <p>When Microsoft licensed TrueType, and began the extensions of the sfnt table format that would lead eventually to OpenType, they decided to spec their own vertical metrics values in the grab-all <span class="caps">OS</span>/2 table. One of the reasons for this was the need to be able to create fonts that had backwards compatible metrics with existing Windows bitmap fonts. This led to the <span class="caps">OS</span>/2 table containing two different sets of vertical metrics&nbsp;data:</p>
    <p>- sTypoAscender<br>
    - sTypoDescender<br>
    -&nbsp;sTypoLineGap</p>
    <p>and</p>
    <p>- usWinAscent<br>
    -&nbsp;usWinDescent</p>
    <p>As originally intended by Microsoft, the ‘Typo’ values were intended to be used by apps to calculate default linespacing, in exactly the same way as the corresponding hhea table values on the Mac. The ‘usWin’ values were intended to define clipping zones for the font, and as such were expected to correspond to the actual vertical extremes of the tallest and deepest glyphs in a font, to ensure that these would not be clipped (i.e. have pixels chopped off on&nbsp;screen).</p>
    <p>If this intent were followed, one could obtain reliable cross-platform default linespacing by making the hhea vertical metrics values equal to the corresponding <span class="caps">OS</span>/2 ‘Typo’&nbsp;values.</p>
    <p>However, almost every Windows app developer – including Microsoft’s own app teams – have incorrectly calculated default linespacing based on the <span class="caps">OS</span>/2 ‘usWin’ values instead of the correct, ‘Typo’ values. It seems likely that this is the result of some application developers noting that using the ‘usWin’ values ensured that all glyphs in most fonts avoidec contact with any glyphs on lines above or below, while this was not always the case with the ‘Typo’&nbsp;values.</p>
    <p>So we’re now in a complicated situation in&nbsp;which:</p>
    <p>a) the specification clearly indicates that the correct way to produce cross-platform linespacing is to make the <span class="caps">OS</span>/2 ‘Typo’ and hhea vertical metrics&nbsp;equivalent;</p>
    <p>b) basically all Windows apps calculate linespacing&nbsp;incorrectly;</p>
    <p>c) therefore, the only way to get reliable cross-platform linespacing is by deliberately ignoring the specification, and by making the hhea table values equivalent to the <span class="caps">OS</span>/2 ‘usWin’&nbsp;values.</p>
    <p>One can sidestep the issue by making the sum of the <span class="caps">OS</span>/2 ‘Typo’ and ‘usWin’ values equivalent, so that all three sets of values produce equivalent results. In my experience, this approach – as outlined below – will produce good results for most text faces and probably the majority of display faces. But display faces with abnormally long extenders can be a problem, because one must either clip the extenders or set all the values to provide clearance, which produces abnormally large linespacing. We hit this issue when we were making the <span class="caps">AAT</span> version of Zapfino that ships with Mac <span class="caps">OS</span>&nbsp;X.</p>
    <p><strong>Best&nbsp;Practices</strong></p>
    <p>Leaving aside the for-now unsolveable issue of such display faces, here are my recommendations for setting the <span class="caps">OS</span>/2 and hhea font&nbsp;metrics.</p>
    <p>1. <span class="caps">OS</span>/2 usWin values:<br>
    These should be set to determine the default linespacing, since this is what almost all Windows apps will actually use. For most designs, this will also ensure that glyphs are not clipped, since default linespacing typically includes enough ‘leading’ to provide clearance. If non-clipping is vital, you simply have to ensure that these values serve double-duty. If you have no very tall or deep glyphs that you want to avoid clipping, a good basic setting for these values will equal the <span class="caps">UPM</span> value of the font multiplied by 1.20 or 1.25, as this is a reasonable default leading. The actual value of the two fields should reflect the design. In Latin faces this will typically mean than a larger value is assigned to the usWinAscent field, while in some Arabic fonts the values might favour the descender. For the purpose of this explanation, let’s assume a Latin text face with typical <span class="caps">TT</span> <span class="caps">UPM</span> of 2048, which we’ll multiply by 1.25 (=2560) and assign like&nbsp;this:</p>
    <p>- usWinAscent = 1836<br>
    - usWinDescent =&nbsp;724</p>
    <p>2. Os/2 ‘Typo’ values<br>
    We want to make the sum of these values equivalent to the usWin values, i.e. to add up to 2560. My recommendation here is to make the sum of the sTypoAscender and sTypoDescender equal to the font <span class="caps">UPM</span> value (2048), and to assign the different between this and 2560 to the sTypoLineGap field. Again this should correspond to the design, and you should begin by measuring your typical ascender height and descender depth, e.g. measuring the lowercase d and p. Then, if the combined height of these is shorter than 2048, add the difference in equal amounts to the sTypoAscender and sTypoDescender. So let’s assume that the typical height of the ascender in our example font is 1430 and the typical descender depth is 550, i.e. a total height of&nbsp;1980.</p>
    <p>2048 - 1980 = 68 and 68 /2 =&nbsp;34</p>
    <p>So this gives&nbsp;us</p>
    <p>- sTypoAscender = 1464<br>
    - sTypoDescender = 584 (actually&nbsp;-584)</p>
    <p>and the difference between 2048 and the combined usWin values of 2560 gives&nbsp;us</p>
    <p>- sTypoLineGap =&nbsp;512</p>
    <p>3. hhea values<br>
    Now setting the hhea values and obtaining cross-platform linespacing is easy, because you can simply make these values match the corresponding <span class="caps">OS</span>/2 ‘Typo’&nbsp;values:</p>
    <p>- Ascender = 1464<br>
    - Descender = 584 (actually -584)<br>
    - LineGap =&nbsp;512</p>
    <p><strong>Update</strong></p>
    <p>Until recently, I was&nbsp;recommending</p>
    <p>    <span class="caps">OS</span>/2 TypoAscent == hhea Ascender<br>
        <span class="caps">OS</span>/2 TypoDescent == hhea Descender<br>
        <span class="caps">OS</span>/2 TypoLineGap == hhea&nbsp;LinaGap</p>
    <p>and</p>
    <p>    (<span class="caps">OS</span>/2 TypoAscent + <span class="caps">OS</span>/2 TypoDescent + <span class="caps">OS</span>/2 TypoLineGap) ==<br>
           (<span class="caps">OS</span>/2 WinAscent + <span class="caps">OS</span>/2&nbsp;WinDescent)</p>
    <p>ergo</p>
    <p>    (hhea Ascender + hhea Descender + hhea LinaGap) =<br>
           (<span class="caps">OS</span>/2 WinAscent + <span class="caps">OS</span>/2&nbsp;WinDescent)</p>
    <p>But Read Roberts at Adobe has been conducting tests on different Mac apps, and has found out that different apps calculate the baseline-to-baseline distance using different combinations of the hhea metrics,&nbsp;e.g.:</p>
    <p>    Mac FontBook<br>
        baseline-to-baseline == hhea.Ascender + hhea.lineGap +&nbsp;hhea.Descender</p>
    <p>    Mac TextEdit, <span class="caps">BB</span>edit<br>
        baseline-to-baseline == hhea.Ascender + hhea.lineGap +&nbsp;hhea.Descender</p>
    <p>    Mac <span class="caps">MS</span> Word for <span class="caps">OSX</span><br>
        baseline-to-baseline == hhea.Ascender +&nbsp;hhea.Descender</p>
    <p>In addition, clipping is handled differently in different applications, and different methods are used to calculate the distance from the top of the text frame to the first&nbsp;baseline.</p>
    <p>Based on this analysis, Read’s recommendation, with which I reluctantly have to agree, is that cross-platform compatibility requires, the hhea metrics to be set as&nbsp;follows:</p>
    <p>    hhea.Ascender == <span class="caps">OS</span>/2.winAscender<br>
        hhea.Descender == <span class="caps">OS</span>/2.winDescender<br>
        hhea.lineGap =&nbsp;0</p>
    <p>Which is actually what I was recommending a few years ago, and what the <span class="caps">MS</span> Font Validator recommends, even though it is contrary to the <span class="caps">OT</span>&nbsp;spec.</p>
    <p><strong>Update to the&nbsp;update</strong></p>
    <p>The question of how best to set the hhea metrics is under discussion again. Microsoft have specified an fsSelection bit setting to force applications to use <span class="caps">OS</span>/2 Typo metrics instead of Win metrics, in which case it would seem best to leave the hhea metrics equivalent to the <span class="caps">OS</span>/2 Typo metrics as originally&nbsp;recommended.</p>
    <p><strong>Update to the update to the update</strong> (7 June&nbsp;2003)</p>
    <p>Microsoft have specified fsSelection bit 7 as an instruction to applications to use the <span class="caps">OS</span>/2 Typo metrics to calculate linespacing (in preference to the Win metrics). However, the implementation of this in Office 2007 (the first applications to respect the bit) is less than one would hope. The clean separation of linespacing from clipping is only implemented in the new math mode (used for typesetting math equations); elsewhere in e.g. Word, the bit is respected and the linespacing is calculated according to the Typo metrics, but an assumption is made that clipping is still constraine by line height. In effect, instead of determining the linespacing according to the clipping zone of the Win values, Office is now determining the clipping zone according to the linespacing of the Typo values. [Insert ‘irony mark’&nbsp;here.]</p>
    <p>So what is my current recommendation for setting metrics? There’s no easy answer to that other than try to set all three sets of metrics to sum to the same total if at all possible, in which case it won’t matter much, in terms of cross-platform compatibility, whether the hhea metrics mirror the <span class="caps">OS</span>/2 Typo metrics or the <span class="caps">OS</span>/2 Win&nbsp;metrics.</p>
    <p><strong>Discussion:</strong><br><a href="https://web.archive.org/web/20190925232012/http://typophile.com/node/7571">Line Height Info</a><br><a href="https://web.archive.org/web/20190925232012/http://typophile.com/node/29662">Font Dimensions - Generate Problem</a><br><a href="https://web.archive.org/web/20190925232012/http://typophile.com/node/30788"><span class="caps">FL</span> Vertical Spacing</a><br><a href="https://web.archive.org/web/20190925232012/http://typophile.com/node/39172">WinAscent… LineGap… Font <span class="caps">BB</span>ox?</a><br><a href="https://web.archive.org/web/20190925232012/http://typophile.com/node/45635">Ascenders Cut Off in <span class="caps">MS</span> Word</a><br><a href="https://web.archive.org/web/20190925232012/http://typophile.com/node/34287">Question about Vertical&nbsp;Metrics</a></p>
    <p><strong>Additional Articles:</strong><br><a href="https://web.archive.org/web/20190925232012/http://www.kltf.de/downloads/FontMetrics-kltf.pdf">Font Metrics</a> (<span class="caps">PDF</span>) by <a href="/web/20190925232012/http://www.typophile.com/node/19920" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Karsten&nbsp;Luecke</a></p>
