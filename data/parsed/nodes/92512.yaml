      <p>Thanks Eliason, it sounds very interesting but I don't think I can have anything on the deadline. This is just a draft idea.</p>
      <p>This taxonomy would not be very useful for the end user of typefaces but rather to the people studiyng or designing type. The value of categorization is that it enables systematic analysis and eases discussion.</p>
      <p>By graphic construction systems I try to point out the different graphic techniques or styles that can be used to create letterforms. Each technique has an inner logic that will manifest in the final letter shape. The central problem would be to create a vocabulary to describe very abstract categories such as different stroke modulation styles in sans serifs. Other categories would be easy do describe when they follow primitive graphic principles.</p>
      <p>Maybe it was too soon to post the idea, I'm having troubles to come up with appropriate categories for fonts like Neo Sans or Cholla Sans.</p>
