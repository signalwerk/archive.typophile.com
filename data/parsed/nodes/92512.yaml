      <p>It depends on what you ask of it.  The whole picture seems too broad for 3 months work. I would approach from a user stand point and ask yourself what this taxonomy would do to be of help to the user?  I get easily bored of endless discussions on what pigeon hole to put things in. If all you do is put things in to categories, what value comes out of it.  If you have 100 random people and put them in an order by shoe size, it is easy to measure.  After you are done with this accurate system, what do you do with it?.<br>
      Type is far more complex than shoe size but after you put everything in a category, what do you do with it?  Does it matter?<br>
      The current taxonomy is very roughly based on history and what came before what.  Several years back, this was much easier.  Today, where every old face has 10 revivals and knock-offs, it is much tougher.  Again, if you do it, what will it do for you for the trouble. If when you finish, all you get is a bunch of argument about the result, what have you gained?</p>
