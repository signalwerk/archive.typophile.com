      <p>Each approach has its pros and cons. But we still don't have a good ahistoric/form-based one, so I hope you go for it - you can certainly make some progress in three months (although maybe not enough to pass some kind of formal academic evaluation).</p>
      <p>I think the key to avoiding an overwhelming complexity is somehow layering or grouping the various form-based concepts for people to navigate through, as deeply as they feel like.</p>
      <p>hhp</p>
