    <p>When I was fresh out of school I wanted to do a grandiose thesis to prove myself and ended up working for 8 years without my diploma. Now I just want to do a simple thesis project to be able to teach a couple of classes.</p>
    <p>I am aiming to propose a new type taxonomy system for latin alphabet typefaces and I would like your valuable opinion to help me decide if this is reasonable and achievable.</p>
    <p>I know typophiles are not fond of type classifications because they tend to misrepresent the universe of the typographic inventory. My aim is no to try to create a new definitive or better system but to explore a different perspective.</p>
    <p>The criteria for this new taxonomy would be the graphic construction system behind the typeface rather than the historical or stylistic approach. Some advantages of this taxonomic criteria would be more and better categories to classify all non serif typefaces and the creation of a wider vocabulary to study or discuss different constructive approaches in type design.</p>
    <p>A system like this would require much more categories than the traditional ones and as a consequence a wide vocabulary to describe different graphic construction systems. </p>
    <p>I  am aware of <a href="http://www.stbride.org/friends/conference/twentiethcenturygraphiccommunication/TypefaceClassification.html" target="blank" rel="nofollow">Catherine Dixon’s </a>work and I think this classification criteria would fit into the construction or modelling formal attributes of her <a href="http://www.stbride.org/friends/conference/twentiethcenturygraphiccommunication/VisualOverview.pdf" target="blank" rel="nofollow">Description Framework</a></p>
    <p>What do you think of it? Is this nonsense? Is this too complicated for three months of work?</p>
