  - id: 9894
    user: 1946
    date: 2003-09-15T13:23:00
    date_raw: 15 Sep 2003 — 1:23pm
    votes: null
    html: "<p>Hi David, <br> <br>it also reminds me in a good way to House Gothic, a very nice type. <br>I totally agree with Paul. I have some personal things to add too: <br>- Try thickening the diagonal in the UC 'S' <br>- The '+' and '#' signs are a little heavy <br>- The 'z's bother me a little. It's the round foot. <br>- Try making the bars on the '$' thicker. I think they are to thin. <br>- Although I like it, the * doesn't seem to fit. Hmm... maybe it's me. <br>- Try moving the diagonal in the '?' down. Perhaps that opens it up a little more. <br>- Shouldn't the downscore be a little more down? <br> <br>But nevertheless it's a very nice type. I see good potential for it. Good work in only three days. <br> <br>I'd like to use it. <br> <br>Regards, <br>Ren</p>"
    html_clean: "<p>Hi David, <br> <br>it also reminds me in a good way to House Gothic, a very nice type. <br>I totally agree with Paul. I have some personal things to add too: <br>- Try thickening the diagonal in the UC 'S' <br>- The '+' and '#' signs are a little heavy <br>- The 'z's bother me a little. It's the round foot. <br>- Try making the bars on the '$' thicker. I think they are to thin. <br>- Although I like it, the * doesn't seem to fit. Hmm... maybe it's me. <br>- Try moving the diagonal in the '?' down. Perhaps that opens it up a little more. <br>- Shouldn't the downscore be a little more down? <br> <br>But nevertheless it's a very nice type. I see good potential for it. Good work in only three days. <br> <br>I'd like to use it. <br> <br>Regards, <br>Ren</p>"
