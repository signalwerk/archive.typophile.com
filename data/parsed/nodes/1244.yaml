    date_raw: 11 Sep 2003 — 6:24pm
    votes: null
    html: "<p>Looks like a great corporate ID font. Let me know when it's for sale. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>A few comments: <br>- The V's and Q's bother me. I don't have any suggestion for the V's, I hate drawing that letter myself. <br> <br>- Consider adding a curve to the stem of the 7. <br> <br>- Consider lengthening the bar of the E (but not the F). <br> <br>- Something about the at-sign doesn't seem right. <br> <br>- The pound and percent signs are really wide! <br> <br>Paul</p>"
    html_clean: "<p>Looks like a great corporate ID font. Let me know when it's for sale. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>A few comments: <br>- The V's and Q's bother me. I don't have any suggestion for the V's, I hate drawing that letter myself. <br> <br>- Consider adding a curve to the stem of the 7. <br> <br>- Consider lengthening the bar of the E (but not the F). <br> <br>- Something about the at-sign doesn't seem right. <br> <br>- The pound and percent signs are really wide! <br> <br>Paul</p>"
