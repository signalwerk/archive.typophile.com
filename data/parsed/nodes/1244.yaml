    html: "<p>Hi David, <br> <br>Some things that catch my eye: <br>- the lc 'k' should be wider <br>- the 'v' and 'w' are not my favorite. I think the UC 'W' is wide or has at least to much white in it <br>- try changing the curve in the '2' and 'z'. It's strange and destroys the balance <br>- move the bar of the lc 'f' a little up. That's no problem <br>the belly of the UC'Y' could go a little bit down. It feels now not heavy enough at the bottom. <br>- the 'o' in the %-sign could be a little less wide if you ask me. <br> <br>These are just the things that personally bothered me. It's up to you as the designer how you want your type to look. I think making the changes would make the type more homogenious. <br> <br>Regards, <br>Ren</p>"
    html_clean: "<p>Hi David, <br> <br>Some things that catch my eye: <br>- the lc 'k' should be wider <br>- the 'v' and 'w' are not my favorite. I think the UC 'W' is wide or has at least to much white in it <br>- try changing the curve in the '2' and 'z'. It's strange and destroys the balance <br>- move the bar of the lc 'f' a little up. That's no problem <br>the belly of the UC'Y' could go a little bit down. It feels now not heavy enough at the bottom. <br>- the 'o' in the %-sign could be a little less wide if you ask me. <br> <br>These are just the things that personally bothered me. It's up to you as the designer how you want your type to look. I think making the changes would make the type more homogenious. <br> <br>Regards, <br>Ren</p>"
