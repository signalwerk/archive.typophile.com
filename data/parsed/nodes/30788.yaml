    html: |-
      <p>The link William posted is the best one to look at. "TypoLineGap" is the item but each software package that you use to output may have a different notion of what to do with it. Twenty-percent is a good rule of thumb but when you have ascenders and decenders pushing beyond, you get some weird stuff to deal with. Compare a script flourished like Kunstler or Bickham with Helvetica Neue and see the difference.<br>
      Users who regularly use the "Auto" leading are not the most typography savvy. Most often, experienced typographers will set leading exactly to the quantity that suits their job at hand. Line length and H&amp;J are factors too. Longer lines tend to need more leading. Auto rarely fits the bill. There is no magic bullet to test. I set up a file with assorted leadings, line lengths, and sizes to test a typeface.  After setting up the file, I change the typeface to whatever I am testing and reprint it every time I make a revision to the font. You can compare the effect of your modifications this way.</p>
      <p>ChrisL</p>
