    html: |-
      <p>Depends how your typeface looks like. Does it have extremely long ascenders and descenders, or modest ones?</p>
      <p>All is said in John Hudson's "How To" (Paul Hunt's link), but I'll emphasize two things:</p>
      <p>You should define [OS/2] usWinAscent and usWinDescent such that the values equal or exceed the longest ascender (or accent) in the font, and the longest descender (or accent) in the font.<br>
      Same for [hhea] Ascender and Descender.<br>
      [Footnote to Thomas Phinney's post: BBox holds information about longest ascending and longest descending of glyph outlines found in the entire font.]<br>
      This because: If the former values are too small, parts of glyphs that are larger than that may be clipped in some applications. If the latter values are too small, glyphs may be squashed in some older Mac applications -- funny effect but not desired.</p>
      <p>[OS/2] TypoAscender and TypoDescender should, together, make the UPM value. (This is not a must, though.)<br>
      This also means: if you begin designing/digitizing a typeface, you should <cite>at first</cite> measure its glyphs carefully, and make sure that <cite>average</cite> ascenders and descenders (as of "h", "l", "j", "p") fit, with a little additional space, into the UPM. Which usually but not necessarily equals 1000 in PS-outline fonts.<br>
      For the few apps which calculate line spacing based on TypoAscender and TypoDescender, you now have defined the minimum line spacing.</p>
      <p>One more note: If you deal with a family, you should calculate values based on the style with the largest ascendings/descendings, and use these values for all family members. In case someone relies on default line spacing, you would not want that this changes if some lines are set in Bold only and others in Italics only ...</p>
      <p>Another description is <a href="http://www.kltf.de/downloads/FontMetrics-kltf.pdf" rel="nofollow">here</a>, slightly different but in the essence it's the same as John Hudson's. The example on page 3 may demonstrate that it is not that complicated.</p>
