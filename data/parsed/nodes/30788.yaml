      <p>Manual control of the default leading (I prefer the term line-spacing in digital work) is prepared for various operating systems' font renderers by the font itself, through the the *ascent, *descent, and similar font tables. As near as I can tell, there's a seperate set of figures for Windows, Mac, and OpenType. Which are all calculated differently. Its a backward-compatability induced pain. </p>
      <p>If anyone knows otherwise, feel free to correct the above guess.</p>
      <p><a href="http://en.wikipedia.org/wiki/Leading" title="http://en.wikipedia.org/wiki/Leading">http://en.wikipedia.org/wiki/Leading</a></p>
      <p>[edit] According to this, I'm looking for a way to visually adjust line height, not leading.</p>
