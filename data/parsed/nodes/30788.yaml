    html: |-
      <p>&gt;can’t you just increase the body size</p>
      <p>You can always rescale the glyphs relative to the em, but that's only part of the story. InDesign, things are clear: it will scale em to the size specified, put the top of the ascenders at the top of the text box, and the next line below that exactly at the body size plus the leading you have specified--with a default of 20% of em leading. In Word and other word processing programs there are different defaults, and I understand these are based partly on the line gap information you specify. </p>
      <p>Here the problem is of setting a default--a default that won't cut off the extenders or diacritics, but will also not give too much leading, and across different platforms and applications. And the problem is that you don't have full control because the application will take your information and do with it what it wants. --And then the user can vary that. So you just want a default that a. people won't find weird and b. makes sense for your font. </p>
      <p>For information on best practices for getting a good default across platforms and applications--oh and font formats too--take John Hudson's fun vertical metrics hell ride on the typowiki.  </p>
      <p>Edit: I just saw David's post, which tells you how to look at the default with zero leading in FontLab. (\n makes a new line) The technical complications have to do with the 'line gap' stuff, and the impact of that on defaults in word processors, and on different platforms etc.</p>
    html_clean: |-
