    html: |-
      <p>Word doesn't care what line gap information you put in; it uses the font BBox as represented by usWinAscent and usWinDescent (which you need to make equal to the BBox if you don't want clipping in GDI applications).</p>
      <p>There are a bunch of different vertical metrics, and a bunch of different ways applications use them. It is literally not possible to get consistent and desirable line spacing across all common applications across platforms. So you have to decide what compromises you want to make. :(</p>
      <p>Cheers,</p>
      <p>T</p>
