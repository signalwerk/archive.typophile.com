      <p>I'm not positive, but I think Chos is asking about setting the default leading value within the font itself (hence "FL" = FontLab). I'm curious about this myself as I'm not sure if the default leading is built into the font, or if InD/Quark simply uses a standard leading for any given type size. It seems to me it would be the former, as I've used fonts that seem to have insanely generous leading settings which need to be over-riden in InD.</p>
