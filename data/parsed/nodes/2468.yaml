    votes: null
    html: "<p>Stigmata: The roman is <a href=\"http://www.philsfonts.com/detail.html?sku=AD00031301P1\">Octavian</a>, and the quasi-blackletter is <a href=\"http://www.identifont.com/show?1EI\">FF Koberger</a>, but some of the characters (the A and I) are from a different font, or they've been redrawn.</p>"
    html_clean: "<p>Stigmata: The roman is <a href=\"http://www.philsfonts.com/detail.html?sku=AD00031301P1\" class=\"link-external\">Octavian</a>, and the quasi-blackletter is <a href=\"http://www.identifont.com/show?1EI\" class=\"link-external\">FF Koberger</a>, but some of the characters (the A and I) are from a different font, or they've been redrawn.</p>"
  - id: 19921
