    date: 2003-12-19T14:17:00
    date_raw: 19 Dec 2003 — 2:17pm
    votes: null
    html: <p>The O, E, and Q are definitely Koberger. The T is also  <br>Koberger, but the curved stroke has been chewed on. The I  <br>looks like they took the one from Koberger but cut it in half  <br>and flipped a copy of the top half for the bottom. The A  <br>just looks made up, maybe from parts of other characters,  <br>but it's hard to tell.</p>
