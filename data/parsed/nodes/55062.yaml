    <p>Hi everyone.</p>
    <p>This is a logo design for a local radio station which also broadcasts live streaming through the web.</p>
    <p>Please comment on the legibility of the design. </p>
    <p>The client likes the direction where we're going with the logo. I'm just concerned with legibility.</p>
    <p>The radio station name is Y101 FM.</p>
    <p>Thanks very much.</p>
    <p>Joseph</p>
