  html: <p>Hello <br> <br>OK, I deverse to get the piss taken out of me for this one, but any advice would be most useful. <br> <br>I have used Trajan for an identity project. The client loves it, all is good, except... <br> <br>Now I have come to set the companies stationery, there is no lowercase... can someone suggest a similar typeface with a lowercase? <br> <br>Thanks <br> <br>Jim <br>===</p>
