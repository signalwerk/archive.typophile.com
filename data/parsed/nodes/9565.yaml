    html: <p>The only actual Trajan lower case attempted digitally (and commencially available) that I can think of is <a href="http://www.myfonts.com/fonts/letraset/la-gioconda/">La Gioconda</a>. It's based on Giovanni Francesco Cresci's work, the first guy to break his head over this problem. Although La Gioconda was drawn by talented hands, I don't care for it as a lower case to Trajan. <br> <br>Can you show the logo? I think you'll want to stear way clear of things that *look* like trajan. Go for contrast instead. <br> <br>R</p>
    html_clean: <p>The only actual Trajan lower case attempted digitally (and commencially available) that I can think of is <a href="http://www.myfonts.com/fonts/letraset/la-gioconda/">La Gioconda</a>. It's based on Giovanni Francesco Cresci's work, the first guy to break his head over this problem. Although La Gioconda was drawn by talented hands, I don't care for it as a lower case to Trajan. <br> <br>Can you show the logo? I think you'll want to stear way clear of things that *look* like trajan. Go for contrast instead. <br> <br>R</p>
