    html: "<p>Hmm, so this isn't exaclty taking my own advice. <br>Try <a href=\"http://www.typography.com/catalog/requiem/testdriver/index.html\">HTF Requiem</a>  <br> <br>Perhaps Berkley? <br>Or maybe Electra? <br> <br>Comments on the logo: <br>What will it look like at 1cm?  [box] ABERCROMBIES? <br>The box seems a little off balance, though maybe for a reason. Maybe try the pattern with each spikey thing positioned the same way in it's box. Or ratating 90 degrees each time. <br>Just thinking. <br> <br>Good luck!</p>"
