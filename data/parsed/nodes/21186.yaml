  - id: 133722
    user: 10530
    date: 2006-07-11T10:34:00
    date_raw: 11 Jul 2006 — 10:34am
    votes: null
    html: <p>Its true good design does last longer. However, nothing exists in a vacuum. I try to avoid fonts which have been overused so as to avoid the negative associations which a reader may form in their mind. That is, if someone is bombarded with a font again and again eventually that font is something they notice rather than the work itself. As much as i love type - i always hope the viewers of my work see past the font to the message.</p>
