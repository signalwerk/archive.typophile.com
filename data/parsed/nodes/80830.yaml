    html: |-
      <p>As the dotted font appears to be built on a grid you might find it on <a href="/wiki/www.fontstruct.com" class="freelinking" rel="nofollow">Fontstruct</a>, or you could build your own version there.</p>
      <p>I think the other might be collaged from photos of an actual LED display. The botched, bitmap over-drawing on "landing March" makes me think it was an image that didn't scale down clearly rather than a font. Also the large E and T look like they were drawn to match the letters in Katy Perry rather than being the same letters scaled up. </p>
      <p>Have you searched under LED yet?</p>
