    html: |-
      <p>Activate the ruler tool. Hold control, drag a ruler between the points, release the mouse button, and use the resulting pop-up window to create a guide 50% between the two points. Place the point on the guide and then delete the guide.</p>
      <p>Or just write a robofab script that measures the selected path segment and inserts a point along the way.</p>
