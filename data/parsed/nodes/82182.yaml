  html: |-
    <p>Well, the title says it all.<br>
    Illustrator has this function that equally distributes space between selected nodes.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Illustrator_3839.JPG"></div><br>
    And I can't seem to find one in FL5. Searched in the manual, in the internets - no luck.<br>
    That would save me lots of time without needing to measure space between nodes, divide it by 2 and then position third node in the middle manually.<p></p>
