      <p>The closest I have is <a class="freelinking external" href="http://moorstation.org/typoasis/designers/steffmann/samples/g/grussgot.htm" rel="nofollow">Grusskarten Gotisch</a> by Dieter Steffmann, mainly cleaning up /T from flourishes (keeping skeleton) and recreating this swashy /Th flourish/ligature.<br>
