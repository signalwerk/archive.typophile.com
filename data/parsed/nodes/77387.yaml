    html: |-
      <p><cite>Does 'hinting' have to do with letterspacing, or does it affect how type renders?</cite></p>
      <p>Hinting affects how type is scaled to fit on a raster grid, including spacing.</p>
      <p><cite>If the Armitage font isn't hinted for TrueType…</cite></p>
      <p>Well, technically it is hinted for TrueType. But the hinting is Fontspring’s particular application of automated hinting. It’s not the size-specific manual hinting found in fonts like the Microsoft core web fonts or Font Bureau’s Reading Edge fonts. </p>
      <p><cite>…what's the potential damage?</cite></p>
      <p>The potential damage is that Windows XP users can disable anti-aliasing entirely and just see black-and-white text. Without manual TrueType hinting the black-and-white rendering is just gross. The number of users in this situation seems to be relatively small but they’re often office workers whose computer settings are completely out of their control.</p>
      <p>I see this situation as being similar to the implementation of USB. Around 1999 Apple decided to drop parallel, serial, SCSI and its proprietary hardware interfaces in favor of USB and Firewire. People claimed it was a disastrous move that would be one more nails in Apple’s coffin. Meanwhile PC makers kept using parallel, serial, SCSI, and PS/2 ports on everything just to satisfy the occasional user who refused to get a new scanner/printer/etc. Apple told people to suck it up and get new hardware. Guess which computer maker has the higher market capitalization today?</p>
