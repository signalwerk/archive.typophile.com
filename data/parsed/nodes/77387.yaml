    html: |-
      <p><cite>…Windows standard greyscale rendering, which - unless blurring at small sizes is specified in the font - is just b&amp;w pixels.</cite></p>
      <p><a href="http://blog.fontslive.com/2010/11/web-fonts-quality.html" rel="nofollow">Windows greyscale rendering is not just black and white; it’s got shades of gray to provide some antialiasing.</a> To be just black and white a user has to disable all font smoothing, not many users actually do that. The Fontspring autohinting works well for Windows grayscale until you get below 12 pixels which is too small for many fonts to render well anyway.</p>
