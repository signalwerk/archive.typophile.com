      <p>I agree, Nick. To date, I've been using Arial Bold with my raster Akzidenz Medium heads. I was hoping to replace all type images with a web font, but Akzidenz is unavailable. I also want to use sizes in the 14-24px range, and the bigger Arial starts to looks too different.</p>
