      <p><cite>If it doesn't hold up, why on earth would you sell web licenses?</cite></p>
      <p>For the same reason I license heavy fonts that can’t hold up at small sizes in print: most people won’t use those fonts at such small sizes. Further, I don’t have  much sympathy for people who still run Windows XP with anti-aliasing disabled. I’m not going to be held back by people who insist that their desktop experience should not move beyond the 1990s. I stopped using X Windows on Solaris in 2005; they can stop running Windows XP without Cleartype.</p>
