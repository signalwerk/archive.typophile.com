      <p>Eric Gill was a bit of an eccentric, and was not as experienced in producing actual typeface as some other type designers of his day would have been. So, I think that his comments about the Drawing Office should be taken with a grain of salt. I also doubt, for instance, that Gill Sans would have ever turned out nearly as well as it did in small sizes without the excellent work of the Drawing Office. Of course, this is something of a counterfactual, because without Morison and Monotype's interest, there would not have been a sans serif typeface from Gill anyway, just some larger-sized lettering pieces in this style. </p>
      <p>I think that the Drawing Office was better than they often get credit for. Some of the details of their reputation may have also come from Morison's writings, especially his later writings, as he famously did not get on so well with Frank H. Pierpont, the Works manager for many years. Pierpont and his team were capable of producing quality typefaces without any input from Morison at all, as can be seen in the typefaces they produced in the decade before Morison's appointment as typographical adviser (Imprint, Plantin, and maybe Monotype Garamond, too, depending on whose timeline you believe).</p>
