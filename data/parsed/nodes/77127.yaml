      <p>I know there is a titling typeface from 1967 to accompany Ehrhardt. The Monotype Corporation named it Fleet Titling (Series 632) and it was designed by British designer John Peters (1917- 1989). He also designed Angelus 1953, Castellar 1957 and Traveller 1964. Fleet Titling also includes the same curved crossbar in the A, like in Ehrhardt.</p>
      <p>I don't know why it was called Fleet. Maybe because in 1904 Monotype took offices at 43 Fetter Lane, off Fleet Street in London. But some 20 years ago I also saw a picture of a van that Monotype used to conduct their business. The lettering on these vans (the fleet, there you are) was done in Fleet Titling.</p>
      <p>There must be someone who knows more about Fleet Titling.</p>
