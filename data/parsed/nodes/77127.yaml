      <p>Thanks, everyone.  Martin, thanks in particular for that reference to Fleet Titling.  Can't find it in any of my old metal specimen books, but since they're mostly American, I'm not that surprised.</p>
      <p>Dan, I certainly don't assume that all typefaces have single designers.  But the old Monotype Drawing Office was famously uptight--Eric Gill used to complain that they'd replace his waisted stems with ruler-straight ones because straight lines are neater--and I just can't see one of those good soldiers curving that crossbar on his/her own.  Nor have I ever seen an old sample of Kis/Janson with a detail like that.  </p>
