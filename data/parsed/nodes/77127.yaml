      <p>Fred Goudy had the exact same complaint, about the workers straightening out his curves, as Gill.<br>
      (In <em>Goudy's Type Designs</em> about Garamont.)<br>
      But Goudy was an experienced type designer at the time, with Kennerley under his belt, and the company was Lanston Monotype, which IIRC had a U.S. drawing office.</p>
      <p>That would tend to support  Max's observation that the assembly line was inherently conservative and unimaginative. Given the hierarchical structure of industrial production, one would expect every letter drawn by a worker to be signed off by a lower-level manager (a sergeant major, following the R&amp;R to a T), and that more general design direction be provided by senior management.</p>
      <p>Although punch cutters worked in anonymity in the 19th century (e.g. the mysterious "man in black"), before the era of the pantograph and engineering drawings, even at the larger foundries they had some autonomy to introduce personality quirks into typefaces, and one can see this in the variation of letter form between different sizes of the same typeface.</p>
