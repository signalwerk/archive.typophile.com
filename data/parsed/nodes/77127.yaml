    <p>Does anyone know who designed Monotype Ehrhardt?  The Monotype site simply credits "Monotype Design Studio".  Sebastian Carter's _Twentieth Century Type Designers_ says that Stanley Morison directed the Monotype Drawing Office to tweak up a proprietary version of Janson, but Ehrhardt has certain idiosyncratic details--most notably the curved crossbar of the A--which seem out of character for Morison.  It does seem like a particular designer with a particular personality worked on this one.  Anyone know who?</p>
    <p>Many thanks,</p>
    <p>Max</p>
  html_clean: |-
