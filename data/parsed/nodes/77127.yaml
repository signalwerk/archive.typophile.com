    html: <p>There's an interesting essay on Monotype Ehrhardt by Harry Carter in a reprint of Stanley Morison's "A Tally of Types"; there, Carter tells the story of that typeface revival, stating, among other things, that the "Nonesuch Press had a case or two of the 14-point (Didot) [Ehrhardt] in its cellar and set a few small books in it from 1927 onwards. Some of the Nonesuch fount eventually found its way to Cambridge [to Monotype] ... The type was favoured enough to make the American Linotype and Monotype companies cut it for their machines ... Both completed their series in 1937". Carter doesn't quote any specific designer or punch-cutters, but adds that in 1937 Morison started working on a "different treatment" of the type, named "Series 453", which in the ned, in Carter's words, resulted in "an exercise in making a Fleischman out of a Kis". Again, there's no mention of any cutter. So it seems that the first Monotype version was faithfully based on the Nonesuch Press cut, while the second one was more an interpretation given by Morison? Anyway, I suggest to everyone to get copy of "A Tally of Types", it is a wonderfully written and beautifully typeset book, even if one doesn't agree with Morison's vision or statements.</p>
