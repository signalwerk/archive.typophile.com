      <p><em>all I remember is he was Hungarian</em></p>
      <p>This is almost certainly a reference to Miklós (Nicholas) Tótfalusi Kis, the 17th Century Hungarian punchcutter who studied and worked for a time in Amsterdam. Erhardt is inspired by Kis' types, but it is not a direct revival of any one of them.</p>
