    date_raw: null
    votes: null
    html: <p>My work is all print at the moment and I want to continue with some print projects. I have some business cards , letterheads already so I want to move away from that and give my portfolio a better range of work. <br>I have done some work for the National Aids trust, It was for a competition, Ill look up some charities but I dont want to just produce posters. Im looking for something that will deal with alot of type. I was thinking about a cd + booklet but am afraid alot of places I will try to get a job with will not have alot of experience with cd's themselves. So something that future employers have dealt with. I know I should be able to think of something, Its just difficult to set your own project and create a brief. But Im thinking along of a theatre production program. <br> <br>Thanks for any help, <br>David.</p>
    html_clean: <p>My work is all print at the moment and I want to continue with some print projects. I have some business cards , letterheads already so I want to move away from that and give my portfolio a better range of work. <br>I have done some work for the National Aids trust, It was for a competition, Ill look up some charities but I dont want to just produce posters. Im looking for something that will deal with alot of type. I was thinking about a cd + booklet but am afraid alot of places I will try to get a job with will not have alot of experience with cd's themselves. So something that future employers have dealt with. I know I should be able to think of something, Its just difficult to set your own project and create a brief. But Im thinking along of a theatre production program. <br> <br>Thanks for any help, <br>David.</p>
