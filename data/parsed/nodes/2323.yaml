  html: <p>Hi, <br>Im aware this may be a silly request but I am not working at the moment and want to produce some work while I have the time. The problem is setting myself a project.  <br>Im asking for ideas on what I could do. Nothing too wacky but a project that would be beneficial to my portfolio. <br>Thanks for any ideas, <br>David.</p>
