    html: "<p>This reminds me of a student project that the Underware guys described during their ATypI presentation. A bunch of their students went out and found a small cafe with really bad signage: the project was to redesign the signage for the cafe, and then take the redesign to the owners and see if they want to implement it. The last bit didn't go too well: the owners of the cafe were immigrants who didn't speak the local language well enough to understand what the students were asking; they thought the students were from the immigration police <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"></p>"
