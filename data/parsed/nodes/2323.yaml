    html: <p>Hey. <br> <br>No-profits will definitely give you a lotta work. And they're a great learning experience for students, like myself. <br> <br>Learn How To Work Under A Deadline! <br>Experience Approval By Committee! <br>Deal With Tight Budgets And Kinkos Level Output! <br>Variety! Postcards! Newsletters! Posters! T-Shirts! <br> <br>And something I plan on doing one of these days is some guerilla show-flyering. Find an upcoming show that appeals, create a kick-••• poster for it and cover the town with it. No pay and some out-of-pocket expense, but it'd be fun and might get ya noticed (if ya include contact info for the designer). <br> <br>David Roughs</p>
