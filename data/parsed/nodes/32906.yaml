    html: |-
      <p>Tupper: thanks!</p>
      <p>Not an exact match, but LTC Jenson is pretty close — and it, I learn, is based on William Morris’s “Golden Type” of 1890, also a close match. This makes perfect sense, as Austria looked to England for much of its progressive design at the time. The Poppelbaum “ver sacrum” type was certainly just a local variation based on the Kelmscott original. I agree that the “G” is its distinguishing mark; I’m curious where that little spur came from — I can’t recall seeing anything like it.</p>
