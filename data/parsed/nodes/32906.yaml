    <p>I am trying to find information on a Roman type used by the publisher Philip &amp; Kramer for the Austrian Secessionist magazine “Ver Sacrum.” It may have been produced by Poppelbaum — at least Poppelbaum had a font called “ver sacrum”: it was either the same type or a close copy. Is anyone familiar with it? Does anyone make a digital version?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/32990" class="topic-previous" title="Go to previous forum topic">‹ Font ID Help</a> <a href="/node/32978" class="topic-next" title="Go to next forum topic">Heavy Italized Font ›</a></div>
