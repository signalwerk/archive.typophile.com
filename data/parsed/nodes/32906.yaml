    html: '<p>Although it obviously isn’t what is being used here, <a href="http://www.myfonts.com/fonts/parkinson/benicia/">Parkinson’s Benicia</a> is similar. The blurb at the MyFonts page just linked includes some research hints. Not sure if they’re of much use. From them, I came across <a href="http://www.myfonts.com/fonts/lanston/ltc-jenson/">LTC Jenson</a>. Neither of these match the ’W’ from your scan. (The short tail of the ’Q’ also distinguishes your face from others. Edit: the ’G’ seems even more distinctive.)</p>'
    html_clean: '<p>Although it obviously isn’t what is being used here, <a href="http://www.myfonts.com/fonts/parkinson/benicia/" class="link-external">Parkinson’s Benicia</a> is similar. The blurb at the MyFonts page just linked includes some research hints. Not sure if they’re of much use. From them, I came across <a href="http://www.myfonts.com/fonts/lanston/ltc-jenson/" class="link-external">LTC Jenson</a>. Neither of these match the ’W’ from your scan. (The short tail of the ’Q’ also distinguishes your face from others. Edit: the ’G’ seems even more distinctive.)</p>'
