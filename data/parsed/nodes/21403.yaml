    html: |-
      <p>I find the Mrs Eaves versions have an exaggerated ascender and descender also there is a kerning issue around the er, ect and ol. I also feel that the ct ligature is a bit limp compared to, for example, <a href="http://www.myfonts.com/fonts/linotype/adobe-caslon/" rel="nofollow">Adobe Caslon's</a>.<br>
      I think that the spacing should be consistent, it needn't be a full word space, once you have finalised(ish) the kerning for the other characters you could try a number of spaces, my guess would be that you could use quite a thin space and still achieve separation of the words, (I also don't object to your initial separators although the baseline needs raising for the dot).<br>
      The dusty red you have chosen seems a little lacking in comparison to the rich dark red of a cherry, however, screen quality could be contributing to that.<br>
      Tim</p>
