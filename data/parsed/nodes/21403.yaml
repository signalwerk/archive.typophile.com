    html: |-
      <p><strong>gabssnake</strong>: Good call about the y -- it does look a little anaemic.</p>
      <p><strong>timd</strong>: The exaggerated asc/desc's of Mrs Eaves is what I like about it most. I agree about the lack of flair in the ct lig, but I've tried Caslon/Jensen and aside from the x-height being too large, I think they lack the personality of Mrs Eaves. Excellent spots with the kerning issues, you're absolutely right.</p>
      <p>I also agree about the shade of red -- I've found it very difficult trying to come up with a shade of red that seems cherry-ish: with anything from almost black to a pale crimson being appropriate. I think it could definitely do with a little more vibrancy though -- if for no other reason than to give more contrast between it and the black.</p>
      <p>I've tweaked the kerning, reduced the space between the words, fattened out the y descender, and given the shade of red a kick up the backside. Thoughts:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-01d_4032.gif"></div><p></p>
      <p>Thanks, as ever, Jordan</p>
