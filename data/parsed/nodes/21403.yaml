    <p>Hi all.</p>
    <p>I've been charged with designing the logo/branding for an online company whose aim it is to help sell independant art products for designers and artists worldwide. The idea is that artists can set up their own online store selling their wares -- so it must be quite a versatile brand.</p>
    <p>My first three ideas are below -- any and all comments would be most appreciated.</p>
