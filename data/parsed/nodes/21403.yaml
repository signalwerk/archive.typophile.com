    html: |-
      <p>I like the first one's style (with the "ct" ligature) but I'm not a big fan of Mrs. Eaves. She's been a little overused recently. I see where you're going with the red cherry-like dot, but to me it doesn't quite work.</p>
      <p>That little ligature looks almost like a cherry stem, and the ball terminal of the 'c' would make an excellent red cherry. Maybe another one hanging off the 't' in another direction would also work (you might be able to cut it off the "it" ligature). These are just suggestions. They might not work as well as I hope.</p>
      <p>I think you definitely need to hide a cherry or two in the logo somewhere. To me a cherry has a distinctive heart shape and a stem.</p>
      <p> - Lex</p>
