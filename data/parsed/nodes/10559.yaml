    html: "<p>Hi Conna, <br> <br>I actually don't think you are a cheapskate or think less of you. I also am not intending to make a big deal out of nothing, but I have found myself in the same quandry when running my small business.  <br> <br>In your reply you suggest the cost of the fonts should be footed by: <br>1: You (One: I only get paid 6 an hour) <br>or <br>2: Your Fledgling Company (Two: Our sign company is only three weeks old, and can't really throw money around/I can't justify begging my boss to fork over 20 here and 12 there) <br> <br>I have to remind myself that the person who should pay for the font license is my client. Certainly a painter passes on the cost of their paint. My fear is always that I will lose business because my estimates will go up, but this hasn't been the case. <br> <br>My two cents, which in this case is a moot point since Mike has miraculously produced a two cent verson with the correct g. <br> <br>Cheers, <br>Randy</p>"
