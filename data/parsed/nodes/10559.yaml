  - id: 66502
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>I know you all think me a cheapskate for wanting a free font, but there's a good reason. One: I only get paid 6 an hour. Two: Our sign company is only three weeks old, and can't really throw money around. We don't know if we'll ever even use the font again (probably not), so I can't justify begging my boss to fork over 20 here and 12 there every time we need a font for a one-time use. <br> <br>Right now I don't care what *my* time is worth, I just want to get the job done. So please don't think less of me, I'm trying to be economical.</p>"
