      <p>This is not what you wanted:</p>
      <p>Trying to tie this to typefaces, I would say that if the Thorn and the Eth letterforms are one day re-introduced to English, I hope they take on their original -and much needed- sounds instead of newly invented ones. (Not that we don't need more symbols for poorly supported sounds.)</p>
      <p>Concepts don't go extinct, they just go dormant.<br>
      Make entirely new words!<br>
      <a href="http://www.typophile.com/node/81709" title="http://www.typophile.com/node/81709">http://www.typophile.com/node/81709</a></p>
      <p>That said, it's always nice to see a preoccupation with language.</p>
      <p>hhp</p>
