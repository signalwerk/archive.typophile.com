      <p><strong>Eftsoons</strong>, adv.<br>
      <em>Original Meaning:</em> Soon after<br>
      <em>New Meaning:</em> What happens in most porno films.</p>
      <p><strong>Embrangelement</strong>, n.<br>
      <em>Original Meaning</em>: Perplexity<br>
      <em>New Meaning</em>: An inordinate interest in Mr Pitt and Ms Jolie.</p>
      <p><strong>Janglesome</strong>, adj.<br>
      <em>Original Meaning</em>: Quarrelsome<br>
      <em>New Meaning:</em> To be overburdened with bling.</p>
      <p><strong>Spuddle</strong>, v.i.<br>
      <em>Original Meaning</em>: To make a big fuss over a trivial job.<br>
      <em>New Meaning</em>: To ask “You want fries with that?”</p>
