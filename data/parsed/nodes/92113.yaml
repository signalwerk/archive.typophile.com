    <p>Hello!</p>
    <p>My name is Alice and I am currently organising a community design/language project called Make A Meaning. Make A Meaning is a growing collection of postcards communicating new meanings for extinct English words. Anybody and everybody can take part, from children to designers to grannies. The project offers obsolete but expressive, brilliant-sounding words to people who coin new definitions for them on one side of a postcard – they may describe a pet hate, a particular habit, situation, smell, etc.</p>
    <p>I am still working on the website, but if anyone on Typophile would like to take part and make a meaning, please email <a href="mailto:abelgrove@gmail.com">abelgrove@gmail.com</a> for a word and instructions!</p>
    <p><a href="http://make_a_meaning.prosite.com/" title="http://make_a_meaning.prosite.com/">http://make_a_meaning.prosite.com/</a></p>
    <p>Thanks!</p>
