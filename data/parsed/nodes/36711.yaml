      <p>This is BistroScript,<em> “(...) a contemporary calligraphic script inspired by promotional art in the 1960s. Thanks to OpenType features, a variety of ligatures and alternative glyphs allow the user to create more authentic and varied connections between letters. Used thoughtfully, BistroScript is guaranteed to enhance any print job.”</em></p>
      <p>I know, I helped Tomas with the English text for his catalogue. This is from my version of the text document that’s still on my hard drive. ;^)</p>
