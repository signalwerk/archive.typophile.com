    <p></p><div class="imageWrap"><img src="/files/script_3511.jpg"></div><p></p>
    <p>Does anyone recognize this wonderful script? This image was taken from the <em>Suitcase Type Foundry Open Type Collection Catalogue</em> designed by Tomáš Brousil. Unfortunately, <a href="http://www.suitcasetype.com/" title="Suitcase Type Foundry">Suitcase</a> doesn’t seem to offer the script on their website—at least not currently. If it helps, I found the image <a href="http://www.typosemestr.cz/suitcase-type-foundry-open-type-collection-catalogue">here</a>.</p>
    <p>Thanks in advance,<br>
    Ken</p>
  html_clean: |-
