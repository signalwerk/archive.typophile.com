  html: |-
    <p>Any recommendations for a body copy typeface to go with my display type of Antique Olive Compact? It's for a student project on a book on John Coltrane. The display type is never on the same page as the body copy but I tried Helvetica Neue and it's not working well.</p>
    <p>Thanks for any help!</p>
