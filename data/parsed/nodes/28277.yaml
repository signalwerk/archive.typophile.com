      <p>hi Tim, no FDK2 training on the TypeTech week?</p>
      <p>Yes, the format have changed.</p>
      <p>makeotf -fp bla.fpr<br>
      <code><br>
      FeaturePath Std\_Reg\features.txt<br>
      FontMenuDBPath FontMenuNameDB.txt<br>
      GlyphAliasDBPath GOA.txt<br>
      InputFontPath Std\_Reg\yourfont.pfa<br>
      OutputFontPath ready\yourfont.otf<br>
      DoAliasAndOrder true<br>
      DoSubroutinization true<br>
      ReleaseMode true<br>
      </code><br>
      Don't try to set something above to "false", just let the line out.</p>
      <p>Or you should try a batch file<br>
      <code><br>
      makeotf -f yourfont.pfa -o yourfont.otf -ff features.txt -mf FontMenuName.txt -gf GOA.txt -S -ga<br>
      </code></p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
