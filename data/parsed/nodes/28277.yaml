    html: |-
      <p>Both the Windows XP and Mac OSX operating systems have things called "environment variables", which have a name and a text value. compareFamily looks for two environment variables with the names shown in the error messages that you saw. If present, it uses the values to compare with values in the font, and complains if  font values and the environment variable values are not the same. </p>
      <p>To read how to set environment variables  in Windows, see::<br>
      <a href="http://www.microsoft.com/resources/documentation/windows/xp/all/proddocs/en-us/environment_variables.mspx?mfr=true" title="http://www.microsoft.com/resources/documentation/windows/xp/all/proddocs/en-us/environment_variables.mspx?mfr=true">http://www.microsoft.com/resources/documentation/windows/xp/all/proddocs...</a></p>
      <p>For Mac OSX,  open a command-line window (aka the Terminal program) and first try the command:<br>
      CF_DEFAULT_FOUNDRY_CODE="ADBE"<br>
      If this works , you then enter the command<br>
      "export CF_DEFAULT_FOUNDRY_CODE"<br>
      and it is set for any programs that you run by entering commands in this window. To make the setting permanent, create/edit the file in your home directory named ".profile", and add in the file the same two  commands that you tried.</p>
      <p>If the first command produced the response "Command not found", then the Terminal window is using the tcsh shell program to process the command lines, and the commands to set the variable are:<br>
      setenv  CF_DEFAULT_FOUNDRY_CODE "ADBE"<br>
      export CF_DEFAULT_FOUNDRY_CODE</p>
      <p>and to make the settings pemanent, you shoud certate or edit the file in your home directory named ".cshrc", and add these commands.</p>
      <p>Of course, you should use your values for the 4 letter foundry code and for the name ID 11 fondry URL, rather than the values for Adobe.</p>
