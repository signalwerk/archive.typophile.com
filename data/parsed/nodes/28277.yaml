      <p>Hi Andreas,</p>
      <p>As Miguel has noted, the correct feature file keywords are described in the file "FDK/Technical Documentation/OT Feature File Syntax.html"</p>
      <p>The "fontinfo" file is no longer required, and when used, makeotf pays attention to only a few parameters. The way things work now is that makeotf will llook , in order, in three sources for parameters settings:<br>
       - the fontinfo file, if there is one<br>
       - the project file<br>
       - the command line<br>
      If the different sources specify different settings, the last one seen wins.</p>
      <p>If you use a project file, you have no need to use a fontinfo file at all, and would do better to not have one, in order to avoid possible conflicting options.  I agree that if you *do* use a fontinfo file, it would be better to be abel to specify a path - I will add this to makeotf with the next bug fix release.</p>
      <p>I am pleased to hear that you do use the project files. I thought it would be useful to have this option, but no one at Adobe uses them, and your e-mail is the first evidence that I have seen that anyone else does, either. I wil llook into the '-nr' problem under Windows.</p>
      <p>The easiest way to supress the complain about use of the 'except' clause in in the feature file is to change from using "except' to 'ignore".</p>
      <p>- Read Roberts</p>
