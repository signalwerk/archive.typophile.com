    html: |-
      <p>Problems with the FDK 2.0  and FontLab on Windows.</p>
      <p>Some people have seen that when they add the FDK executable directory "FDK/Tools/win" to their PATH variable, that FontLab starts behaving badly - macros disappear, and other odd things. If this happens to you, remove the FDK directory from the PATH variable, and don't install the FDK. The next release in a few weeks will fix this.</p>
      <p>The problem is that the PATH variable is used by Windows as the list of directories to search for not only programs, but also libraries. 'FDK/Tools/win" contains Python and system libraries that may conflict with what FontLab uses. Thanks to John Hudson, who put up with a lot of e-mails and tests to help figure out what was wrong.</p>
      <p>- Read Roberts</p>
    html_clean: |-
      <p>Problems with the FDK 2.0  and FontLab on Windows.</p>
      <p>Some people have seen that when they add the FDK executable directory "FDK/Tools/win" to their PATH variable, that FontLab starts behaving badly - macros disappear, and other odd things. If this happens to you, remove the FDK directory from the PATH variable, and don't install the FDK. The next release in a few weeks will fix this.</p>
      <p>The problem is that the PATH variable is used by Windows as the list of directories to search for not only programs, but also libraries. 'FDK/Tools/win" contains Python and system libraries that may conflict with what FontLab uses. Thanks to John Hudson, who put up with a lot of e-mails and tests to help figure out what was wrong.</p>
      <p>- Read Roberts</p>
