    html: |-
      <p>About Andreas' post.</p>
      <p>1) 'adds bug. Yes, I can duplicate this bug. You can work around it for the moment by supplying a target weight value after the 'adds' option, e.i. '-adds 500". The next build wil fix this bug, so you will not have to specify a value. Without a value, MakeOTF makes a guess as to the target weight.</p>
      <p>2)  Anon block.<br>
      This is indeed not supported in MakeOTF, and never has been. It is meant for someone who is developing their own version of MakeOTF, and who wants to support feature file syntax not supported by the undelrlying MakeOTF library. What it does is to just pass the "anon" block text from the feature file from the library to the top-level program. MakeOTF does receive this data, but does nothing with it.</p>
      <p>3) Missing complaints about unhinted glyphs.<br>
      The missing hints reports came from the 'tx' tool, which MakeOTF uses to convert fonts from *otf  to *pfa (Type 1) for input into the makeOTF library. I supressed its output, as several users didn't like seeing its output in this context. However, you can still see the same unhinted glyphs report by running compareFamily, whcih will complain about unhinted glyphs, or more quickly, by using the command-line  'tx -cff inputFontPath temp.cff'.  This will incidentally make a CFF version of the input font file, but will also report all the unhinted glyph. On the Mac you can avoid the temp file by saying "tx fontPath &gt; /dev/null". Piping output to /dev/null is the  standard Unix way of saying 'throw out all the output", but I don;'t know how to do this in Windows.</p>
      <p>4) Missing complaints about not defined glyphs.<br>
      I don't understand this. MakeOTF will still fail if your feature file references glyph names not in the font.  Do you want reports when 1) glyph aliasing is turned on and 2) the source  font contains glyphs not named in the glyph alias file as source or final names?  I could add this, although probaby not for the next build. I would assume that glyphs whose base name ( the part before the suffix, if any) look like "uniXXX" or "uXXXX" should not be reported,.</p>
      <p>- Read</p>
