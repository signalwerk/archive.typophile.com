      <p>Re: [OpenType migration] OpenType Feature Files</p>
      <p>Hi George;</p>
      <p>About your May 10th posting on opentype-migration-list@indx.co.uk:</p>
      <p>The syntax you suggest could be implemented, but I don't immediately  see the advantage.  I do see that you can represent in one statement what would otherwise require many statements, but to do so you need to refer to a lookup that has to be defined elsewhere, and this lookup will require just as many statements.</p>
      <p>For your questions from your posting on Monday May 7th:</p>
      <p>- there is no std extension, but lots of people use '.fea"</p>
      <p>- the next FDK update, due out soon, has only bug fixes and minor extensions. The next major release, which will add GDEF table and anchor support but probably not device tables, is due out summer 2008.</p>
      <p>- In a single contextual chain positioning statement, you can specify only one value per input position, just as you can only specify a single value for a class pair. To apply different values for different glyphs at the same position, you must use different statements.</p>
      <p> - Contextual ligature statements are in fact more limited than Tom Phinney's reply shows. In the case of the contextual ligature rule, the substitution cannot be a class. Contextual positioning statements provide context for a particular lookup type. To figure out what you can do, strip off the context, and then consider whether it would work as a non-contextual positioning statement. The underlying  GSUB and GPOS table structure does allow much more flexibility than this, but we chose to limit flexibility in favor of simplicity of expression.</p>
      <p>- Read</p>
