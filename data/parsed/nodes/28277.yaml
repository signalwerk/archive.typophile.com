      <p>The FDK for Windows is missing the module plist.py. This is part of the standard Mac Python installation. It is used by the AutoHint script. See fi you can get someone with a  Mac to send it to you, else wait  two to four weeks for the next update for the FDK to fix the various installation issues.</p>
      <p> If you then have the problem "importError: No module named PyACDebug", there is a deeper problem on Windows where the FDK can conflict with the the Ptyhon associated witth FontLab. The solution for this is to wait for the next FDK build : it will fix this, and support both Python 2.3 and 2.4 with FontLab.</p>
