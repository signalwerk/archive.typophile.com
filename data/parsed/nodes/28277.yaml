      <p>(I recommend reading the documentation inside the module 'WriteFeaturesKern.py' which is located in 'Macros / System / Modules' after installation. It expects that names of leftside-only and rightside-only kern classes either include a tag '_LEFT' and '_RIGHT'. Alternatively, these default tags can be changed in the first few lines of the module. Additional tags -- '_LAT', '_GRK', '_CYR' -- help the script to set subtable breaks correctly. It even allows for class-based exception kerning.)</p>
