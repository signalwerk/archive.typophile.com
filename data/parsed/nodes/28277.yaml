    html: |-
      <p>One current problem with Python extension modules is that they work only with the version of Python for which they were built. It is possible that your win32api module doesn't match your Python. Another possibility is that the win32api module may have dependencies on other modules. I will echo Adam Twardoch's good advice and recommend that you download the entire win32 package. However, I will add that you need to pick the right one that works with the version of Python that you have. I actually used "pywin32-205.win32-py2.3.exe"  to install the win32 package for my co-workers at Adobe.  This translates as "build 205 of the win32 package, built for Python 2.3". The newer builds of win32 ought to work, as long as they are built for the Python you are using. These can be found at:<br>
        <a href="http://sourceforge.net/project/showfiles.php?group_id=78018" title="http://sourceforge.net/project/showfiles.php?group_id=78018">http://sourceforge.net/project/showfiles.php?group_id=78018</a></p>
      <p>Note that the AFDK0 FontLab scripts are built to work with Python 2.3. Autohint and CheckOutlines in particular use extension modules that are tied to specifically to Python 2.3; the others assume in some places support for operations that exist only in 2.3 and later.</p>
      <p>- Read</p>
