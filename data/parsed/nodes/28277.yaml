    html: |-
      <p>Hi preusss,</p>
      <p>This happens because makeotf is compiled with debug libraries, and will show a dialog like this whenver a low-level assetion that checks data integrity fails. The problem here is most llikely one of encoding, that one of the input files has characer codes above low ASCII, like an umlaut. I suggest checking:<br>
      the feature file "_features.txt"<br>
      the menu name file ""FMNDB_Prillwitz.txt"<br>
      the GOADB file "GOA_GTF.txt"<br>
      by cutting them down to just a stub with only some safe text, and then adding the original text back in a section at a time, to find the problem. It is not legal to use high-ASCII characters in glyph names. It is legal in some of the name table names, but you must represent these character codes as hex codes in the feature file. For example, the char code for  the "copyright"  glyph is "\00a9" for Windows menu names, and "\a9" for Mac menu names; you can see this in the "features.name" exampel file in the "Example Font Sources". The character codes for the Windows platofrm names are Unicode values, for the Mac they are Mac Roman ecnodign values.</p>
      <p>- Read Roberts</p>
