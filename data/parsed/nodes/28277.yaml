      <p>The OpenType Layout feature definition statements such as 'languagesystem DFLT dflt;' or 'script DFLT;' errorneously produce a script tag '    ' instead of the intended 'DFLT' inside of the font file -- if the font is produced using Adobe FDK for OpenType (AFDKO) version 1.6, FontLab 4.x, or FontLab Studio 5, including the recent version 5.0.2. </p>
      <p>This situation is resolved in AFDKO 2.0. I have written a small free Python script that will fix the errorneous entries in your existing fonts, without the need to rebuild the font in AFDKO 2. This way, you can continue building your fonts in FLS5 until a version of FontLab Studio is released that incorporates AFDKO 2. </p>
      <p>The information about the little tool can be found in this thread: <a href="http://typophile.com/node/29469" title="http://typophile.com/node/29469">http://typophile.com/node/29469</a> </p>
      <p>Adam</p>
