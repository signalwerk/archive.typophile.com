    html: |-
      <p>Mr. Hudson:</p>
      <p>I already deleted the test font faultily hinted by Fontlab 4.6.</p>
      <p>But you can most easily repeat my experiment as follows:</p>
      <p>1) Open Adobe's <strong>OpenType</strong> font SerifaStd-Roman.otf with Fontlab 4.6.</p>
      <p>2) Remove all hints (e.g. by key shortcut shift F7) via Fontlab 4.6</p>
      <p>3) Autohint all glyphs (e.g. by key shortcut F7) via Fontlab 4.6</p>
      <p>4) Generate <strong>PostScript Type 1</strong> font SerifaStd-Roman.pfb with Fontlab 4.6</p>
      <p>5) Also generate the PFA version SerifaStd-Roman.pfa with Fontlab 4.6</p>
      <p>This PS Type 1 font SerifaStd-Roman.pfb will contain the faulty vertical stem hints faultily hinted by Fontlab 4.6. I do not know, whether later versions of Fontlab have the same problem. Using Adobe's FDK autohint function on the PFA version SerifaStd-Roman.pfa will remedy the faulty stem hints.</p>
