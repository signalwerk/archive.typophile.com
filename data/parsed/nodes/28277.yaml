    votes: null
    html: |-
      <p>Anyone using FDK 1.6 feature files needs to read the following</p>
      <p>David Agg asked why his FDK 1.6 feature file was failing at the lines:<br>
      &gt; feature kern {<br>
      &gt;   language ROM;</p>
      <p>Answer:</p>
      <p>This works in the FDK 1.6, because the default script is ‘latn’; you get the same effect is if you had written<br>
       script latn;<br>
       language ROM;</p>
      <p>However, in the FDK 2.0, the default script is “DFLT”, so the effect is saying:<br>
       script DFLT;<br>
       language ROM;</p>
      <p> and the only legal language tag for the DFLT script is the ‘dflt’ language.</p>
      <p>To get what you want, you should put the lines:<br>
       languagesystem DFLT dflt;<br>
       languagesystem latn dflt;<br>
       languagesystem latn ROM;</p>
      <p>at  the beginning of the feature file; all features not registered under a specific language will then be registered under these three script/language pairs.</p>
      <p>In features where you specify any language or script, you need to spell out all  the script language combinations, and explicitly include the appropriate features under each, e.g<br>
       script DFLT;<br>
      language dflt;<br>
      lookup LOOKUP_1 {<br>
         ... lots of rules<br>
      } LOOKUP_1;</p>
      <p>script latn;<br>
       language ROM;<br>
      lookup LOOKUP_1; # reference to the previously defined LOOKUP_1,<br>
                                   # so that it will be included under latn-ROM as well as DFLT-dflt.</p>
      <p>The compareFamily tool now dumps a table of script/languages vs  sets of lookups, so you can see what’s actually in the font.<br>
       You should look at this when you are working out new script/language settings in the feature file.</p>
      <p>- Read Roberts</p>
