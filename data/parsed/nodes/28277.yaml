      <p>Im gonna try to write a dummy's guide to install 'with success' AFDKO 2.0 in Fontlab Studio5.0.2.</p>
      <p>First, as mentioned before, your Fontlab Folder must not have any spaces or number in them. I had to uninstall my copy and install it in the folder "C:\FLStudio\". Just that, not two folders as default Fontlab installation does. Then I unzipped the "FDK2.0-WIN.zip" in "C:\" creating the path "C:\FDK".<br>
      Now install the phyton program, version 2.3.5 "Python-2.3.5.exe" and the win32all "pywin32-210.win32-py2.3.exe". If anyone is unable to locate any of this files, drop me a PM.<br>
      With that done, run the command prompt. Get to the drive root where you installed fontlab.(In my case "C:\") Then type "cd fdk/tools/fontlab". Now type "installfontlabmacros.py /../../../flstudio/macros" (Change "flstudio" for the name of your FontLab Folder). You're gonna see it copying the files to the Fontlab Macro folder. This python script also creates a file named "FDK.pth" in the python folder. As default is in "C:\Phyton23\Lib\site-packages\". This file, if open in the Notepad has the line "C:\FDK\Tools\SharedData\FDKScripts". This is the folder where FDK scripts are located. If you want to change the location of your "SharedData" folder, just rewrite the location in the "FDK.pth" file.<br>
      If done as above, your FontLab macros are ready to use. The only one that still generates error is "Auto-Hint". It gives the following:<br>
      'Failed to import either version of auto-hinting library<br>
      Current list of search paths for modules:<br>
      ['C:\\',<br>
       'C:\\WINDOWS\\system32\\python23.zip',<br>
       'C:\\PHYTON~1.5\\Lib',<br>
       'C:\\PHYTON~1.5\\DLLs',<br>
       'C:\\PHYTON~1.5\\Lib\\lib-tk',<br>
       'C:\\',<br>
       'C:\\FLStudio',<br>
      .....................<br>
      Traceback (most recent call last):<br>
        File "", line 105, in ?<br>
      ImportError: No module named PyACDebug'.<br>
      Any suggestions?</p>
      <p>Emiliano Amadei</p>
