      <p><strong>Some remarks on the Autohint function of Adobe's FDK 2.0</strong></p>
      <p>Here are a few tech notes, which may (or may not) be useful for typophiles:</p>
      <p>1) The first version, i.e. FDK v2.0 Aug 31 2006 <strong>build 21</strong> (FDK2.0-WIN.zip, file size ca. 14.4 MB), was faulty. It did not work on my Windowx XP machine.</p>
      <p>2) Yesterday, I installed the current version, i.e. FDK v2.0 May 5 2007 <strong>build 26</strong> (FDK2.0-WIN.zip, file size only 9.8 MB).</p>
      <p>3) The current versions runs in the DOS box of Windows XP (but not in the DOS box of Windows 98, which I also tested).</p>
      <p>4) After unpacking the zip file FDK2.0-WIN.zip into the folder <strong>c:\fdk</strong>, I switch to the DOS box (i.e. cmd.exe) and select the FDK folder via <strong>cd c:\fdk</strong> and then set the FDK program folder via <strong>path=c:\fdk\tools\win</strong>.</p>
      <p>5) After copying the font to be autohinted into the FDK folder under the name <strong>c:\fdk\font.pfa</strong>, I start autohint by <strong>autohint -a font.pfa</strong>, which results in the hinted font saved under the same name font.pfa.</p>
      <p>Now a few remarks on the Autohint function:</p>
      <p>Adobe's FDK autohint function is of very high quality, but it seems to be geared to Latin fonts only, for the autohinting quality heavily depends on the x-height, ascender etc. alignment zones (which do not exist in most non-Latin fonts, e.g. in Indic fonts, so that it is unclear, how such non-Latin fonts could be hinted with FDK).</p>
      <p>I compared the autohint function of Fontlab 4.6 with the autohint function of Adobe's FDK. It is astonishing that exactly the same font with exactly the same alignment zones and exactly the same vertical and horizontal stem widths has entirely different autohinting results in Fontlab, as compared with Adobe's FDK. Especially, Fontlab 4.6 does not seem to handle vertical stem widths properly:</p>
      <p>a) The screenshot <a href="http://www.sanskritweb.net/temporary/fdk.jpg" title="http://www.sanskritweb.net/temporary/fdk.jpg">http://www.sanskritweb.net/temporary/fdk.jpg</a> shows that Fontlab makes some vertical stems too thick, wheareas Adobe's FDK autohint function streamlines all vertical stems. This screenshot was made without font smoothing.</p>
      <p>b) The PDF <a href="http://www.sanskritweb.net/temporary/fdk.pdf" title="http://www.sanskritweb.net/temporary/fdk.pdf">http://www.sanskritweb.net/temporary/fdk.pdf</a> can be used for testing font smoothing, which, if switched on e.g. in Adobe Acrobat Reader, alleviates the Type 1 autohint deficiencies of Fontlab 4.6, which may (or may not) have been remedied by a later release of Fontlab.</p>
