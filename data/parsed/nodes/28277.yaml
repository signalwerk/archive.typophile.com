      <p>Hi,</p>
      <p>My apologies - I see that the dependency on the  win32api and win32com.py modules in the Windows version is not documented. I will fix this in the next release. Note that they have to be installed in one of the directories which is in the sys.path list of your Python. The only directory under FontLab's Macros directory which is in this list is in Macros/System/Modules.  Did you put both these modules in one of the directories in sys.path?</p>
      <p>Another limitation is that the AutoHint and CheckOutlines modules use C extension modules that are linked for use with Python 2.3 ( aka FontLab 5) and won't work with Python 2.2 ( aka FontLab 2.2).</p>
      <p>- Read Roberts</p>
