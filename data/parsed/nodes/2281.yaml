    html: |-
      <p>Some other methods ... <br> <br>In Illustrator, create outlines on your type, then go to  <br> <br>Object &gt; Path &gt; Simplify <br> <br>Type in a value of 90-95 percent. This will <br>strip your type of points and give it a more <br>beat up look. <br> <br>Then also mix in <br> <br>Filter &gt; Distort &gt; Roughen <br> <br>size, 1 to 2 percent <br>detail, 10 to 20 <br> <br>This will add more points. <br> <br>You can then go back to simplify. <br> <br>This will just affect the perimeter, however. <br> <br>To get inside, i use one of these templates below ... <br> <br>I made a bunch of them a couple of years ago. <br> <br>In Photoshop, select the black with the Magic Wand, then <br>select Similar. Fill with White. <br> <br>Overlay the white distressed file on top of your black type.  <br>Blur some. Then Flatten and go <br> <br>Mode &gt; Bitmap &gt; 50 percent threshold. <br> <br>Then back up to Grayscale, blur some more, <br>maybe overlay the file again rotated differently, <br>than back down to Bitmap, etc. etc. <br> <br>Also, you can mix in the airbrush tool on DISSOLVE setting. <br> <br>If these don't give you the effect you're after,  <br>you can contact me offline. <br> <br>a not-so-professional tutorial but maybe it'll help. <br> <br>bj <br> <br> <br> <br></p>
