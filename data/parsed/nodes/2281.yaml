    html: '<p>i do a lot of my work using a photocopier, sandpaper, an exacto knife and scotch tape. I basically xerox many times ... enlarge, reduce,, sand the outputs, cut them up, tape them back together, recopy,... etc. I have a lot of fun <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  Get some cool results too.  Heres a typographic poster i did using this method: <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/21655.jpg" alt=""></p>'
