  html: <p>Hey, I was wondering if anybody knew how to create distressed/faded/word/grungy looking text on either photoshop and or illustrator.  I am doing a project for someone and I plan on having large and bold arial type, but I wanted it to be distressed and I was wondering how to go about it.  Suggestions are wanted, thanks much.</p>
