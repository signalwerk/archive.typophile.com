    html: "<p>Here's a few links to follow: <br> <br>Bicerebral's <a href=\"http://www.bicerebral.com/pshoptuts/corrodetut.html\">Corroded Text</a> <br> <br>Mac Design Magazine's <a href=\"http://www.macdesignonline.com/tutorials/photoshop/marapr03_texture.html\">Grunge Type</a> (scroll down page) <br> <br>The <a href=\"http://www.thewebmachine.com/\">Web Machine</a> site has several good tutorials, but because of their stupid dynamic frame-based site structure, I can't link directly to any of them. Click on the Photoshop tab, and then scroll through the list of tips on the left-hand side of the page. Of note are the Grunge Type, Worn Out Type, and Quick Grunge tips. <br> <br>Hope this helps you get started.</p>"
    html_clean: "<p>Here's a few links to follow: <br> <br>Bicerebral's <a href=\"http://www.bicerebral.com/pshoptuts/corrodetut.html\" class=\"link-external\">Corroded Text</a> <br> <br>Mac Design Magazine's <a href=\"http://www.macdesignonline.com/tutorials/photoshop/marapr03_texture.html\" class=\"link-external\">Grunge Type</a> (scroll down page) <br> <br>The <a href=\"http://www.thewebmachine.com/\" class=\"link-external\">Web Machine</a> site has several good tutorials, but because of their stupid dynamic frame-based site structure, I can't link directly to any of them. Click on the Photoshop tab, and then scroll through the list of tips on the left-hand side of the page. Of note are the Grunge Type, Worn Out Type, and Quick Grunge tips. <br> <br>Hope this helps you get started.</p>"
