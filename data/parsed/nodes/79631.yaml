      <p>You've got quite a challenge, Evan! I'd start looking at one of my favorite swashy foundries - <a href="http://new.myfonts.com/foundry/Sudtipos/">Suditpos</a> in Argentina. (They have a great <a href="http://www.sudtipos.com">website,</a> but MyFonts is faster to load samples.) </p>
