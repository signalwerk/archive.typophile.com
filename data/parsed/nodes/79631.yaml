    <p>La MEME being French for "The Same," or "same," the M and E letterforms are supposed to have similarity with one another.</p>
    <p>I realize it's somewhat Russian in style but that is intended and an acceptable association.</p>
    <p>However, I think I'm looking for a swash "La," but haven't found a nice enough balance between the inherent elegance of a swash and a heavier form to match the letterforms shown here.</p>
    <p>Am I looking for a hybrid-style swash? In any case, some suggestions for a "La" face?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Green_ColorMockUp_5683.jpg"></div><p></p>
    <p>But I suppose I should mention--some of you enjoy kerning so if it's off might as well let me know!</p>
    <p>Thanks all</p>
