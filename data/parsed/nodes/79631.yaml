      <p>I'm sure I do make these things tough on the crowd, because I don't like to give anything away--being somewhat wary about the stealing of work or ideas. </p>
      <p>I mean really it'll end up on my online portfolio but I'll try and minimize the places one might be able to grab this or that. Plus it doesn't say much about me as a designer if I ask about every little decision. It's more fun to come to the solution through trial and error til you're happy. Right?</p>
      <p>Anyways, after seeing some examples I'm thinking the La really does need to exude some elegance--it just needs to be weighty and elegant. Which still might be difficult to find. But hairlines don't hold up against these monoliths.</p>
      <p>Thanks for the compliment Riccardo. I like the kerning at the large scale so maybe I'll create a size-specific version for the small. I'll see if adjusting the counter works as well.</p>
