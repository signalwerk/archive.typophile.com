    <p>From a great Berlin exhibition that revolves around the Whole Earth Catalog and its impact. It looks a lot like Nick Shinn's Figgins Sans to me, but it's different in some (obvious) details: ascender-to-cap ratio, the t, the, r, the f... Maybe custom modifications?</p>
    <p><img src="http://geoarchitecture.files.wordpress.com/2013/04/2013-04-26-11-00-07.jpg?w=960"></p>
    <p><img src="http://www.mottodistribution.com/site/wp-content/uploads/2013/07/The-Whole-Earth_01.jpg"></p>
