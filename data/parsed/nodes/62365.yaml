    <p></p><div class="imageWrap"><img src="http://typophile.com/files/P9220037_6500.jpg"></div><p></p>
    <p>Here's a new card designed by me, for me!<br>
    We've changed the trade-name of out website to "slowprint.com" so it's time to roll out a card to replace the "Exquisite Letterpress" design which has been in use for the past couple of years.</p>
    <p>This design is printed in four colors, with extremely tight register.<br>
    I figured I should make a point of printing a tough job for my own cards, since I'm telling all you designers that we can handle whatever you through our way ;-)</p>
    <p>Although it started as a representation of the CMYK registration mark, I now think of the colors as being more in line with the traditional seasonal directions like the Native American 'mandala' or 'medicine wheel' I've included both positive and negative glyphs in the design, allowing the dimension of the impression full play. The very fine white lines are about .5 point.</p>
    <p>The type is Carol Twombly's Nueva from Adobe Systems.</p>
    <p>We'd be happy to send a couple of cards (limited availability, however) and maybe some other goodies to anyone who would care to drop us a note through the website (do include your mailing address, and note that you read about it on typophile.com!)</p>
    <p><a href="http://slowprint.com/contact-us" title="http://slowprint.com/contact-us">http://slowprint.com/contact-us</a></p>
