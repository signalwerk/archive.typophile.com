      <p>All I know is that _The Economist_ has a long history of bespoke typefaces. Some such as the Officina Display used on the cover were under limited term exclusive license. Others, such as this one seems to be, may not have been released for public sale. You might ask _The Economist_ for information on the ad series typeface.<br>
      Don</p>
