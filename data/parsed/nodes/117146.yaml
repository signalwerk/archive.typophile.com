  html: |-
    <p>Bold mutant typography. Retro-futuristic. Sixties meets 1990’s comic book inspired, superfast for your superhero? The pencil tissue was dragged out from the very back of the file cabinet, stuck in the metal rail, it was lost then found- to bring a unique look to your project. A companion font to astroluxtype’s Spacepod, both fine ways to mark and identify your spacecraft. Note the lowercase letterforms that make connectors such as g, j, y, b, d and g. See the posters at myfonts.com for examples of how to you might use this feature. Redrail Superfast is a minimal glyph set which can be used at various sizes, we consider it a headline/display font and best applied larger than 36 points in size. Available at myfonts.com. Link: <a href="http://www.myfonts.com/fonts/astrolux/redrail-superfast/" title="http://www.myfonts.com/fonts/astrolux/redrail-superfast/">http://www.myfonts.com/fonts/astrolux/redrail-superfast/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/redrail_6690.post8.png"></div><p></p>
