  html: |-
    <p>Hello everyone, I'd love to hear your comments regarding a brand logo I made for a company that sell special anti-stick coatings created using nanotechnology that protects different surfaces from dirt and corrosion and decreases cleaning time.</p>
    <p>It's called QuickNano because the idea is that you can use latest nanotechnology quickly in your own house.</p>
    <p>I'm not sure what typeface to use. On the picture is Myriad Pro. Maybe you can suggest an alternative typeface?</p>
    <p>Does the basic concept work? Any feedback is much appreciated. Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Qnano-2_4696.jpg"></div><p></p>
