      <p>Worry about color later in the process. Get the mark where it needs to be first.</p>
      <p>Something is just off--the letterform is close to being a Q but for whatever reason I don't find that it's right.</p>
      <p>It could be a number of things, like the size of the droplet itself, its angle, etc. The droplet gives me the feeling that its separate from the oval behind it. As if its the letter O with something coming out of it, instead of saying to me that both elements are incorporated together to make one letter.</p>
      <p>Perhaps trying flipping the droplet on its vertical axis so it spills down to the right.</p>
