    html: |-
      <p>I also am not a fan of the gradient used in the mark.</p>
      <p>And nope we can't tell you precisely what to do, but I'll attempt to offer you one direction of inspiration:</p>
      <p>If it were me designing the logo, the one thing I would take note of are that the company's final product (the whole) is created by many small things (the parts, the nano molecules if you will), coming together as one. So I could envision some sort of logo in which smaller components come together to form a larger mark.</p>
      <p>But if you're not a designer this is probably out of your league--and at the very least for now you've made it look more like a Q.</p>
