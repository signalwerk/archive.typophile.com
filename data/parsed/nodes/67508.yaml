      <p>Thank you for your comments!</p>
      <p>First we tried to make a scientific logo, that'll say "science", "nano":</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quicknano-logotypes_6244.jpg"></div><p></p>
      <p>But then we thought that we need a friendly logo, since the product is for home use and it is not a scientific company logo.</p>
      <p>Then we started working with all these water droplets, because the effect of the product makes water bead up on the treated surface and roll off in droplets. So I figured that this logo answers to friendlyness and to main effect (water rolls off the protected surface).</p>
      <p>I agree that the typeface could be more technological. Here are some typefaces I tried:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/QNfonts_4388.jpg"></div><p></p>
      <p>I also switched the colours so the word "nano" will be more bright.</p>
      <p>Looking forward for your comments! Thanks!</p>
