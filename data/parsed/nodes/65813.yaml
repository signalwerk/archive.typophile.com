    <p>I'm working on a collection of dingbats to go with my <a class="freelinking external" href="http://new.myfonts.com/fonts/fontry-west/jls-over-kill-bloque/"> OverKill</a> fonts. This collection will be designed to go with most extra bold or black weight fonts, not just OverKill. I've researched other dingbat fonts and there is a lot of stuff that is useless (in my opinion). I wanted ask what dingbat glyphs other folks find useful and how they might be used. For instance, I saw a cool one the other day. On the side of a service van, there was a computer mouse at the front of the web address. I'm certain that it isn't new, I just hadn't noticed it.  </p>
    <p>Thanks<br>
    James</p>
    <p>~~~~~~~~~~~~~</p>
    <p><a class="freelinking external" href="http://www.thefontry.com"><em>...from the Fontry </em></a></p>
