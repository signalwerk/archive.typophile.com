      <p>That's a interesting project: ultra-bold dingbats, I like it! :-)<br>
      The problem with dingbats, as I see it, is that is difficult to strike the right balance between specificity/specialisation (and, thus, usefulness) and a broader scope (thus a broader audience).<br>
      One thing I would find useful, for example, would be a set of dingbats that can be used to mark the different entries of a business card/contact form (address, telephone number, fax number, e-mail, etc.).<br>
      I noticed also that often dingbats in the same collection have a difficult time sharing a common distinctive style.</p>
