    html: |-
      <p>A common mistake when formatting "by hand" is to forget to include the final hard return. It's possible the hard return has another size or leading than the regular text (possible also combined with Align to Baseline grid), which makes the next line jump down more than you'd expect.</p>
      <p>Triple-click one of the paragraphs -- this will <em>include</em> the final hard return -- and check if all text has the same size and leading.</p>
