  html: |-
    <p>I am having trouble adjusting the spacing between paragraphs in InDesign. It allows me to make the spacing bigger, however going into the negative introduces an error. Does anyone know how to make the spacing tighter without tightening the line spacing? Thanks in advance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile_6030.jpg"></div><p></p>
comments:
  - id: 442659
    user: 34359
    date: 2010-12-07T04:57:00
    date_raw: 7 Dec 2010 — 4:57am
    votes: null
    html: <p>Do you have an extra return where each green block is? You only need to push return once to go to the next line and use the paragraph spacing to make the space larger than the normal leading. If the paragraph spacing is at 0 then the space between lines shouldn't be any more than the normal leading.</p>
  - id: 442705
    user: 58010
    date: 2010-12-07T11:26:00
    date_raw: 7 Dec 2010 — 11:26am
    votes: null
    html: |-
      <p>Don't put blank lines between paragraphs as spacers, it makes it harder to control spacing and also you could end up with a blank line at the top of a column or page.</p>
      <p>As Penn mentioned, use paragraph spacing instead. You can access it 3 ways -- the Paragraphs palette, or the control bar (shown below) at the top of the window (be sure the P is selected so it shows paragraph attributes), or via a style sheet applied to those paragraphs. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/spacing_4339.jpg"></div><p></p>
