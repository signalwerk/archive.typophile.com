  html: "<p>The following was passed along to me by a couple of different people, which made me decide to go public with it - I'm thinking the designers represented at Mindcandy might want to see this - assuming they don't already know and that's not \"integrated\" as a marketing trick or something: <br> <br>\" <br>For a limited time, you can buy EVERY FONT WE CARRY - THAT IS 450 FONTS on <br>CD-rom FOR ONLY $450!!! (plus shipping) <br> <br>If this is beyond your budget right now, I am willing to give you any 20 <br>fonts for only $99!!!  (plus shipping) <br> <br>We will soon get out of the FONT business, once and for all!!  We have been <br>designing and selling fonts since 1995!  We have watched this industry go <br>from bad to worse to simply unprofitable!!! <br> <br>This means that all this wonderful type at www.mindcandy.com will NO LONGER <br>be available - singles or Font Kits!!  As a matter of fact, as soon as some <br>of my type designers find out I am \"giving away\" their fonts - the shit is <br>sure to hit the fan.   I am giving these fonts away at rock-bottom prices <br>ONLY in an attempt to pay my designers their past due royalties!! <br> <br>If you have ever designed a font, I mean the ENTIRE font family, you know <br>how much work it can be - sometimes it takes months to complete and properly <br>kern just one font.  If you have been in the graphic design business for <br>very long, you know that the market is simply FLOODED with fonts, many of <br>them very poorly designed and produced, and many of these \"fly-by-night\" <br>type designers are just giving them away for free.  This has made a mockery <br>of the entire type industry.  In addition, intellectual property laws in the <br>United States are a f#cking joke - allowing pirates to upload peoples hard <br>work and intellectual property for ALL TO STEAL!!  (thanx for nothin' Fraud <br>Nader!)   <br> <br>Many of my type designers refuse to lower their prices to allow for these <br>tragic circumstances!!  While I agree that fonts should be priced around $40 <br>per font, they simply DO NOT SELL at that price.  Here is where the conflict <br>lies between myself, the distributor, and my designers!  I cannot tell you <br>how long this special offer will last!!  Take advantage of it while you <br>can!!!!    <br> <br>THIS IS A ONCE-IN-A-LIFETIME OPPORTUNITY to get a phenominal font collection <br>for next to nothing!!! <br> <br>THIS PROMOTION IS NOT ADVERTISED ON MINDCANDY.COM - YOU are receiving it <br>ONLY because you have ordered from us in the past. <br> <br>PLEASE EMAIL ME THE FOLLOWING CODE [XOXO7667-TYPO] in the subject field to <br>take advantage of this special offer! <br> <br>To view the fonts, please go to: <br> <br><a href=\"http://www.mindcandy.com/fonts/fonts.html\" target=\"_top\">http://www.mindcandy.com/fonts/fonts.html</a> <br> <br>Peace!  <br> <br>Jeff Gillen - El Presidenté - Mindcandy.com <br>\" <br> <br>Sans commentaires. <br> <br>hhp</p>"
