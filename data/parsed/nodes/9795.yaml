    html: <p>Hey, is there precedent for calling an exclamation mark a  <br>"bang"? Is that the etymology of "interrobang"?</p>
    html_clean: <p>Hey, is there precedent for calling an exclamation mark a  <br>"bang"? Is that the etymology of "interrobang"?</p>
  - id: 62485
    user: 5157
    date: 2005-03-17T02:18:00
    date_raw: 17.Mar.2005 2.18am
    votes: null
    html: "<p>Apparently... <br> <br> 'Interrogatio' is Latin for 'question' or 'query'; 'bang' is printers' slang for 'exclamation point'. <br> <br>From: <a href=\"http://en.wikipedia.org/wiki/Interrobang#History\" target=\"_blank\">http://en.wikipedia.org/wiki/Interrobang#History</a> <br> <br>Ed</p>"
    html_clean: "<p>Apparently... <br> <br> 'Interrogatio' is Latin for 'question' or 'query'; 'bang' is printers' slang for 'exclamation point'. <br> <br>From: <a href=\"http://en.wikipedia.org/wiki/Interrobang#History\" target=\"_blank\" class=\"link-external\">http://en.wikipedia.org/wiki/Interrobang#History</a> <br> <br>Ed</p>"
  - id: 62486
