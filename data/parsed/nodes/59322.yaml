      <p><em>the designer may choose to try to make the terminals of the c,e,s all match for ideological or style reasons, but the type may suffer in letter fit, or color, or legibility</em><br>
      Because letters in this style are so very reduced, after basic proportional issues are settled, arm terminals of curved strokes remain one of the most important aspects of the resulting face. In your sample, the word "necessary" contains a nice sequence of letters by which to judge the effect of different angles -- birdcages would be another one. </p>
      <p>In an aesthetic sense, the ideal shape of each should emerge without regard to possible orthographic or programmatic issues. In that light, I feel that the reduced "heel" of the b needs some work. I can see how it is derived from the a, which you indicated was a component of the original design brief. Although I can understand its origin, to my eye it introduces a disturbance of the line, like a chipped character on a proof.</p>
