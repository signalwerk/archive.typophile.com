    <p>I'm in the midst of a client project where I've been asked to tinker with Futura. Here is a sample that examine the bold and what is needed (IMO) to fix it. I think Lucas DeGroot has redone Futura for VW for many of the same reasons, but I haven't taken a close look at his results. Not sure what is so satisfying about shooting botox into an aging font, but it sure is fun! (and instructive)</p>
    <p>Spot the fixes:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fix_futura_4294.gif"></div><p></p>
