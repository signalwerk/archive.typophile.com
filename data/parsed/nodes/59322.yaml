    html: |-
      <p>The shortened ascenders -- and thereby relatively increased x-height -- certainly make it much more in keeping with grotesque conventions, and correspondingly more distant from Renner's vision of Futura as a letter style appropriate for extended text settings. </p>
      <p>What really moves this away from the idea of a serif-less roman and into the grotesque camp are tail on the t -- well done -- and the oblique arm terminations on the lower case c -- less so. The need for the vertical cuts, which are shared with Gill Sans, is less obvious in English than in German where c is frequently followed by h or k. This issue was discussed about a year ago at:<br>
      <a href="/wiki/RE%3A%20ch%20%2526%20ck%20in%20German%20%3A%20please%20enlighten%20me%21" class="freelinking" rel="nofollow">RE: ch &amp; ck in German : please enlighten me!</a></p>
      <p>I suspect Renner would have disliked your changes, but they would have been embraced by Tschichold.</p>
