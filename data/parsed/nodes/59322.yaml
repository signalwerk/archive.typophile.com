    user: 7783
    date: 2009-08-15T10:36:00
    date_raw: 15 Aug 2009 — 10:36am
    votes: null
    html: |-
      <p>1985: try searching google with... site:vw.com filetype:pdf  it turned up lots of examples such as: <a href="http://www.vw.com/downloads/pdf/VW_CareFree_Maintenance.pdf" title="www.vw.com/downloads/pdf/VW_CareFree_Maintenance.pdf">www.vw.com/downloads/pdf/VW_CareFree_Maintenance.pdf</a> </p>
      <p>jfp: thank you for your feedback! Next time around, I will post a pdf or larger image.</p>
      <p>Regarding the small point on the a,g,q:<br>
      I was introducing a different formula to try and solve the problem where I feel Futura's formula breaks down. This problem is in the bolder weights where the round bowls join the straight stem. In futura, the optical correction for me is too extreme resulting in round counters that are not round, and an ugly pinched curve to let more air into the join. So I opted to allow the curve to flow further into the stem and introduced a thin "element" to the font. I had hoped this would also relate thematically to the thin crossbar on the e, to solve a different problem in the neufville futura. I chose not to use this element at the baseline p/d because it seemed too weak as a "support" for the letter, but seemed ok at the x-height/top of the letters (a/g/q). Also, I think this adds "recognition" to this geometric sans. People can say immediately: ah that is Randy's geo-sans with the little "a" thingy. :-)</p>
      <p>Regarding the c:<br>
      Yes I should try something more like Futura. It seems the vertical sheer is good for spacing, but also the fully closed version (spacing similar to the "o"). It is the open version similar sheer to the e and s that is sometimes hard to space (for me). As it is, there are no other horizontal sheers, so my "c" solution may not be a good idea!</p>
      <p>Regarding the s/e:<br>
      These are the two letters that cause the most problems in the alphabet when it gets bold, so you have to play games. One thing that has guided my thinking here, and elsewhere is to try and keep interior counters about the same height. If they are too different, then it's distracting (as in the neufville e). So I've tried to keep the interior counter of the e, n, o, c, etc ending at about the same height. It cannot be exactly the same, but I'm trying to keep it visually close. This means for the s/e that the black must come out of the middle to balance color. I wonder what you think of this idea counter height consistency? You're comments seem to say I'm following this "rule" to closely!</p>
      <p>Thank you again for your comments! I appreciate you taking the time to lend your experienced eyes to my effort, and will try your suggestions.</p>
