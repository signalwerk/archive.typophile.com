      <p>This is not fixing Futura, this is designing a geometric sans. The result starts looking like Gotham, because that was also a solution for the same issue that Renner faced: designing a sans that is as neutral as can be. Renner wisely chose the Roman caps for his caps, as can still be seen in the protruding tips on the diagonals up to the Medium weight.<br>
      BTW: when we did the Futura work for VW at MetaDesign in 1995, we worked from a Bauer letterpress specimen, so the VW version (called VW Headline as it was only intended for headlines, text was and is Utopia) is very close to large-size foundry Futura. Neufville, of course, worked from the same originals, seeing that they own the license to the Bauer library.</p>
