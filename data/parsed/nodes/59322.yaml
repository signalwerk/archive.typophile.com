      <p>Hi JFP, yes definitely. The thing that is both great and difficult with such a reduced letter is the design considerations are so visible. For example the designer may choose to try to make the terminals of the c,e,s all match for ideological or style reasons, but the type may suffer in letter fit, or color, or legibility, or..</p>
      <p>Now, when I look at this genre of type, it is easier to see the compromises that were made, and which variables the designer felt were most important.</p>
      <p>To answer your curiosity and solicit your further opinion, a complete lowercase. Oh, and my apologies. I did not notice the mangling of "mont blanc" to "ont bslanc" in the sample. So much for cultural sensitivity :-)</p>
