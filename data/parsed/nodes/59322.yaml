    html: |-
      <p>The lower case of Futura was never as completely successful as the great, timeless upper case. </p>
      <p>If you are redoing the whole thing I think a key challenge is making lower and upper case relate. The original long extenders on the lower case I think work, and help readability. The single story a, as you and others have noted, is problematic, though it does harmonize well with the upper case. </p>
      <p>Of course Frutiger's Avenir ("future" in French) is an effort--quite successful--to modernize Futura with short extenders and a double story a. </p>
      <p>To me your "a" doesn't go so well with the look of the rest of the classic Futura, but you might rework the whole thing into something different and good.</p>
