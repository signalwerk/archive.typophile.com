      <p>There is a definite grotesquification going on here: the letter relationships of Helvetica or AG, applied to Futura. (See the c/e)</p>
      <p><em>Renner’s vision of Futura as a letter style appropriate for extended text settings</em><br>
      I've never been able to make Futura work for extended text. Not sure I've ever seen it done well either. Seems like the vertical stress and geometric/repeated forms create a problem no amount of ascender can surmount. Someone will no doubt say Futura in metal is much better for text than the anemic digital versions!</p>
      <p><em>The need for the vertical cuts, which are shared with Gill Sans, is less obvious in English than in German where c is frequently followed by h or k. This issue was discussed about a year ago</em><br>
      Thanks for that thread (<a href="http://typophile.com/node/43911" title="http://typophile.com/node/43911">http://typophile.com/node/43911</a>), I'd only seen reference to it in Bringhurst. Is this a need as much as an older convention? Else why not a similar solution for c_l? I will explore a solution for the c that is closer to Futura, but I tend to dislike a vertical sheer as the weight gets bold, and prefer the e and c to relate more closely as above. Perhaps there is a middle ground for an optional alternate.</p>
      <p>As usual, Ive grown to appreciate Renner and Futura much more as a result of this experiment. Thanks for your thoughtful comments Charles!</p>
