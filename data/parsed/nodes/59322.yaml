      <p><em>Is this a need as much as an older convention? Else why not a similar solution for c_l?</em><br>
      It is really a linguistic artifact. Just for fun I picked a page at random from <em>Die Kunst der Typographie,</em> Renner's most successful use of his own face. On the page, 95, there were roughly 40 pairs of ch or ck and not a single cl, and that's out of approx. 2400 characters.</p>
      <p>The point I am making is that Futura has particular aspects of style that are historically and culturally contingent. We are not — or at least I am not German — and don't compose in the language, but Renner did, and at its heart Futura is a German face. Adaptive use, and modification of those contingent aspects produces a derivative of Futura, and in this case what appears to be a good one.</p>
      <p>One more suggestion. In looking at your sample again the test word "maim" sort of jumped out at me. The addition of weight to the "bactrian" humps of the m throws the balance of that particular character too much to the right for my taste.<br>
      Bon Chance.</p>
