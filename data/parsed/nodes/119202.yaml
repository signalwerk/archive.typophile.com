  html: |-
    <p>I'm considering a Brandon G./Arial combination for a project I am working on. It works for <a class="freelinking external" href="http://www.spacex.com/" rel="nofollow">http://www.spacex.com/</a>. However, I'm not quite convinced about Arial (which has been reinforced by this <a class="freelinking external" href="http://typophile.com/node/119103" rel="nofollow">http://typophile.com/node/119103</a> interesting discussion). </p>
    <p>What I think works pro-Arial is that the font is so neutral that the Brandon headlines are empahised, but that's about it.</p>
    <p>For some specific parts of text I'm using Brandon as well, but the major part will be another font. I've considered a Google workhorse like Open Sans or Source Sans Pro, but as they are less "clean" than Arial, the contrast with the headlines is somewhat softened.</p>
    <p>Any suggestions?</p>
