    <p>The serif:</p><div class="imageWrap"><img src="http://typophile.com/files/Pano_serif_4008.PNG"></div><div class="imageWrap"><img src="http://typophile.com/files/Pano_serif2_3715.PNG"></div><div class="imageWrap"><img src="http://typophile.com/files/Pano_serif3_4442.PNG"></div><p></p>
