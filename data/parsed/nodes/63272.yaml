      <p>palatino looks good and clean with futura. i've been using that pair for years and the readers of the magazine have to digest large amounts of technical and somewhat dry info, but it provides good page contrast without being too exotic.</p>
      <p>i also partner it with rockwell for infographics. still readable but the styles are limited, you may have to force the bold (.25 to .5 stroke of same color) and italic (10% slant) as a menu style in indesign.</p>
