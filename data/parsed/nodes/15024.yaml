      <p>My old high school, Brooklyn Tech. had a large central hall which was covered on all sides by a grand <a href="http://www.bthsalum.org/mural.htm" rel="nofollow">WPA mural</a> done in 1934 by Maxwell B. Starr.</p>
      <p>Even my town post office has a great WPA mural painted in the lobby. Many states list there WPA murals as this <a href="http://www.wpamurals.com/Massachu.html" rel="nofollow">WPA Art in Massachusetts site.</a></p>
      <p>Here's the <a href="http://www.wpamurals.com" rel="nofollow">WPA murals by US states</a> link.</p>
      <p>Yes, I'm old, but I'm back in style!</p>
