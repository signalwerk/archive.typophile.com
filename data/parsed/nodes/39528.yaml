    html: |-
      <p>”...he always told me that a logotype should have a name and a symbol. I don’t know if he was right...”</p>
      <p>I’m quite cetain he wasn’t. It’s entirely dictated by your needs. Don’t do a symbol just because you feel you have to. There are lots and lots of examples of successful identities that are little more than unadorned typefaces. You might like to take a look at this:</p>
      <p><a href="http://www.identityworks.com/issues/issues3.htm" title="http://www.identityworks.com/issues/issues3.htm">http://www.identityworks.com/issues/issues3.htm</a></p>
      <p>“Why I want a G as a symbol is because it’s a family company. The name’s starts on G and the symbol should have something with a G in it I think”</p>
      <p>You may or may not have noticed, but the lowercase ’g’ is one of the interesting characters in typography. While almost all other letters of the alphabet have fairly fixed forms, the ’g’ is allowed quite a lot of freedom. If you run through a typeface catalogue, you’ll see a delightful variety of g’s. Also the two-storeyed g’s, often look a bit like a person with glasses on! What could be more rebellious with a piece of typography than not following the convention of starting a proper noun with an uppercase ’G’?</p>
      <p>Like Trump’s empire. He has a “T” as the symbol”<br>
      I don’t know if Trump is a good reference for a PR consultancy. I’d magine your business values would be discreteness and efficiency, and not flamboyance. Your clients might find an elegant and restrained identity more reassuring. After all your job is to make them seen and heard, not yourself ;)</p>
