      <p>I don’t think you guys are being nearly mean enough... ( he said sarcastically ). :-(</p>
      <p>Fernando, I think that the pacing on the letters is not even enough and they spacing is too tight overall. The curl at the bottom of the g is a bit lumpy. The space between the G and the lowercase is too large for the tightness in the rest of the setting. If you have been at this for a while you could just have mental fatigue or it might be that you don’t have the skills you need. I suggest that if you don’t have the experience to space the letters well yet you hire somebody to help with these problems, or ask for help doing it from a pal. You could also take my suggestions and those of others ( assuming others speak up) and see if you can learn by showing your progress and getting feedback here on Typophile.</p>
      <p>By the way what is the context for this project? Is it a school thing or a job? If it’s a job what kind of Org or Company is having it done? Why? What’s the intent?</p>
      <p>Cheers!</p>
