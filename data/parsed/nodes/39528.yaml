    html: |-
      <p>Thanks for your all commments! Really appriciating them!</p>
      <p>Concerning “kerning” I used ALT+(Down arrow) in Illustrator and fine tuned in the character menu. I will try to adjust the space between the capital G and the u and using more space between the other letters.</p>
      <p>About the concept for the logotype. It’s an PR / Event firm which I’ve started my self. It’s nothing big - 12 hours a week job at the moment. I’m using purple as my main color. A bit rebellious as everyone else is using light blue / light green / black&amp;white. I’m targeting companies that I’ve worked for in the past. I’ve got an magician part time employed which I will use for upcoming events. So the logotype should be simple/elegant with a touch of rebellious.</p>
      <p>As you all say: the font isn’t a master piece. I’ve struggled with the font for a long time now. I was inspired by the advertising firm “Deutsch Inc” wich use some kind of variation of Times as their logotype. I’ve tried everything from Helvetica Neue to Lourdes and nothing seems to fit. Any tips?</p>
      <p>When I had a advertising firm with a designer two years ago (he made all the design work) he always told me that a logotype should have a name and a symbol. I don’t know if he was right, but I will follow that unless I find a font which is as good as a symbol (for example IBM’s logotype). Why I want a G as a symbol is because it’s a family company. The name’s starts on G and the symbol should have something with a G in it I think. Like Trump’s empire. He has a “T” as the symbol.</p>
      <p>Thanks again for all comments.</p>
      <p>PS. Unfortunately, my designer friend isn’t available. So I can’t get any free help.</p>
