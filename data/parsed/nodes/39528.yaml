      <p><em>When I had a advertising firm with a designer two years ago (he made all the design work) he always told me that a logotype should have a name and a symbol. I don’t know if he was right...</em></p>
      <p>I think that, first and foremost, a logo should be memorable. As others have already said, don’t follow rules or recipes blindly. Whatever solution you come up with has to be in response to the needs of this particular design problem (<em>i.e.</em>, a logotype or wordmark for your PR/events firm).</p>
