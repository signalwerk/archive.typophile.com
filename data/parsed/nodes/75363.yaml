      <p>Re. Juliet's essay:</p>
      <p>People often describe movements in typography borrowing terms and concepts from the history of art, but this circumscribes categorization, omitting that which is unique to typography. Juliet describes Century Schoolbook as ATF's original "legibility" face; Cheltenham was also informed by knowledge of reading research (the lesser role of descenders in character recognition), as was Clearface, of course and the Linotype news faces of the Legibility program (Ionic, Excelsior, &amp;c.). The design movement such faces represent, Legibility, is an important characteristic of the early 20th century.</p>
      <p>Despite the dominance of historicism at that time, the Legibility movement was an expression of the progressive, socially-minded forces at work in North American society, and just as the simplicity of Arts and Crafts was germane to the emergence of Modernist minimalism, so the Legibility movement contributed to its functionalism.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Excelsior_5527.png"></div><p></p>
      <p>Centre spread of trade brochure launching Excelsior, 1931.</p>
