    html: <p>New Century Schoolbook was made around the same time as Helvetica Neue and several other recuttings by Linotype. The biggest difference that I can recall, compared to "old" Century Schoolbook, was that the family was expanded to four weights. Ironically, only the two weights it shares with the old version are available currently.</p>
