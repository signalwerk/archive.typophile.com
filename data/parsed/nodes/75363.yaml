      <p>You will probably be interested to read <a class="freelinking external" href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_53.pdf" rel="nofollow">Juliette Shen's analysis of Century Schoolbook</a>. She has scans of the originals there, so you can judge for yourself what is most like the original, if that is what you are looking for. </p>
      <p>Century Schoolbook looks best large, where it looks very strong and rather attractive. For normally small adult text, Century Expanded I believe has been used more often.</p>
