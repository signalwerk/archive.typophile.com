    html: <p>Not to disrespect you in any way, but why is any of this important? Bitstream's version is a truer reproduction of original Morris Fuller Benton-designed foundry type; the Linotype and Monotype versions were probably originally developed for linecasting machines. However, if one version looks better than another to your eye, then all the rationale in the world shouldn't affect your judgment.</p>
