      <p>James, don't forget what normal MM inter/extrapolation in FL can do. Some of the things you describe can simply be done with FontLab's "Generate Instance" or "Assign Mask" commands.</p>
      <p>Of course, Superpolator and Remix Tools have their special superpowers but for ordinary (global, isotropic) inter/extrapolation the results of MM/FontLab's tools will be identical.</p>
