    <p>I’m trying to plan a workflow that will allow me to build out a mega family leveraging interpolation and macros. My plan would use Superpolator to interpolate and Font Remix to generate additional masters that can be fed into Superpolator. Does the following workflow makes sense?</p>
    <p>• Design the ultralight, regular and bold weights<br>
    •&nbsp;Use Superpolator to interpolate light and semibold and extrapolate super<br>
    • Manually tweak the regular into a book weight<br>
    • Create an MM font and tweak it into a black weight with Remix<br>
    • After working out the design of condensed and extended widths, create masters by using Remix to do the heavy lifting, finish the work manually, then use Superpolator to interpolate the additional weights</p>
