    votes: null
    html: <p>I'd say, worry first about getting your g right. Making a superfamily is a pointless exercise in complexity until you've got A-z perfect. All you'll be doing is proliferating errors. Here you've got the classic problem of a glyph design that, light, just might print well at 8 points, but that, bold, will certainly clog. Do you redesign the character to something that interpolates more successfully, or do you change the design more radically, and uninterpolably, as weight progresses? Use a lot of paper!</p>
