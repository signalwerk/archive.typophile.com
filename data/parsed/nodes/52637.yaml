      <p>How functional linear interpolation will be, will depend a lot on the nature of the design, and how extreme your heaviest weight is. Is this serif or sans? In what general style? What kind of thick/thin contrast?</p>
      <p>If you're using Superpolator, why build an MM *afterwards*? Or, if you're building an MM, why use Superpolator for interpolation first?</p>
      <p>Note that I've never used Superpolator, just seen it demonstrated, so my questions may reflect my own ignorance of how it interacts with MM tech.</p>
      <p>Cheers,</p>
      <p>T</p>
