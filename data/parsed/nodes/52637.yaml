      <p>"...the progression of changes in size and shape across weights is not linear. Then again, maybe it should be…"<br>
      I do everything you list, to a subset of the complete glyph set, in FontLab. I think maybe you should let go of your feelings for tools and let the force be with you. Translated that means: Draw your thin, regular and fat, extra compressed thin, regular and fat, extra extended thin, regular and fat —&nbsp;until each of those nine works using whatever tools help your eyes. Then find the common point structure, if you have not already, then make more styles.</p>
      <p>Cheers!</p>
