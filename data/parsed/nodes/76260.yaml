    <p>I'm interested in Baskerville's typeface revival produced in the first half of 20th century. There seems to be at least two other versions besides Monotype's. I'm quoting Tipowiki here:</p>
    <p>"Interest in Baskerville seems to have revived in the early 20th century, with Bruce Rogers among others taking an interest in him. (...) Not surprisingly, therefore, the type was revived for mechanical composition in the 20th century. ATF was first, followed by English Monotype in 1923, and thereafter other manufacturers (notably linotype) followed suit. Monotype Baskerville (Series 169), perhaps the best-known of these revivals was a commercially successful type despite (or perhaps because) it was heavily "cleaned up" by the Monotype drawing office Monotype's was based on a font designed for use at a fairly large size in an edition of Terence's comedies published in 1772. ATF and Linotype used strikes from genuine punches of a smaller size type; it is not therefore surprising that different versions of Baskerville look noticeably different: they are (or may) still be 'authentic'".</p>
    <p>So the questions are:<br>
    1. Did Bruce Rogers ever made a revival himself or he just "suggested" to make one?<br>
    2. Since Monotype's version was based on a large size and was "cleaned up", how were, if anybody ever saw them printed in books or in specimens, ATF and Linotype cuts?<br>
    3. More specifically, is there any way to have a look at some ATF or Linotype Baskerville specimens?</p>
