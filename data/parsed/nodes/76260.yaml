      <p>Thanks everyone for their inputs; it would be helpful to see some samples posted here. It is curious that the Monotype version of Baskerville, based on a large size, thus - presumabily - a "lighter" typeface, has somehow come to define the "standard" Baskerville text type in the digital era (the fact that it is pre-installed on many machines didn't help either). It would be nice to see other metal reinterpretations also because nowadays there are half a dozen digital versions of Baskerville available, and they all look different; much different, I would say:</p>
