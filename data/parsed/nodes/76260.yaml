      <p>I'm surprised, though, that Monotype Baskerville is referred to as "heavily cleaned up". Because of the press techniques Baskerville himself used, and the care he took in making his type, the original Baskerville type was already "slick" and at least approached the modern standards of mechanical perfection that the use of the pantograph later established.</p>
      <p>So, while I don't dispute that Monotype's Baskerville did not leave in any humanizing imperfections... that would still have been a light cleanup, because in the case of Baskerville, there wasn't much <em>there</em> to clean up. (And, of course, I am inclined to go even further, and express doubt that the cleanup really contravened Baskerville's intentions either.)</p>
