      <p>For more on the original types &amp; punches, I recommend John Dreyfus' book <em>The Survival of Baskerville's Punches.</em> It's not only very informative, and includes a full-sized fascimile of a 1777 Baskerville specimen put out by Baskerville's widow (photo below), but it's a very entertaining book as well.</p>
      <p>On the contemporary front, Russell Maret has recently designed and printed (from polymer) a new take on Baskerville. It can be seen in his latest Swan &amp; Hoop book, <em>A Roman Inscription.</em><img src="/sites/default/files/old-images/B_4260.jpg"></p>
