      <p>Nicola —</p>
      <p>Regarding your first question:</p>
      <p><cite> &gt; 1. Did Bruce Rogers ever made a revival himself or he just "suggested" to make one?</cite></p>
      <p>Bruce Rogers was more a book designer and typographer than a type designer. He has only two type designs to his credit: Centaur, and the obscure Montaigne. He certainly never attempted a revival of Baskerville.</p>
      <p>And it’s not even a case of him “suggesting” one. </p>
      <p>But Bruce Rogers did take a strong interest in Baskervilles types at that time, and he did make a discovery which may have encouraged at least one of the revivals.</p>
      <p>In 1920, before he left England to return to America, Rogers happened upon an original Baskerville specimen in a Cambridge bookstall. From that, he was able to identify some types then currently offered by Fonderie Bertrand in France as being actually cast from the original Baskerville matrices.  </p>
      <p>He had a font of these “original” Baskerville types, in 14-point size, shipped to America, where he used them in several books he designed for the Harvard University Press.</p>
      <p>At this time, however, ATF had already produced its Baskerville, based on material from Stephenson, Blake &amp; Co., which in turn was derived from Fry’s imitations of Baskerville’s types. So, it’s not like there weren’t contemporary Baskervilles already on the market.</p>
      <p>The revival of a Baskerville by English Monotype came about in the early 1920s, about the time of Rogers’s discovery of the French Baskervilles. It’s possible that Rogers was in some direct communication with Stanley Morison about this, as they had some relationship. But I haven’t seen any direct evidence that he suggested or consulted on their Baskerville or any other.</p>
      <p>Here is an image taken from a facsimile of one of BR’s books printed in those 14-point types cast from the original Baskerville matrices.</p>
      <p><img src="/sites/default/files/old-images/BR-Medallion_crop_3414.jpg"></p>
      <p>&nbsp;<br>
      This image (along with much of my information above) was taken from Joseph Blumenthal’s excellent biography: <cite>Bruce Rogers: A Life in Letters</cite> [Austin: W. Thomas Taylor, 1989].</p>
