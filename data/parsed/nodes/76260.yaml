      <p>Thanks everyone for their inputs; it would be helpful to see some samples posted here. It is curious that the Monotype version of Baskerville, based on a large size, thus - presumabily - a "lighter" typeface, has somehow come to define the "standard" Baskerville text type in the digital era (the fact that it is pre-installed on many machines didn't help either). It would be nice to see other metal reinterpretations also because nowadays there are half a dozen digital versions of Baskerville available, and they all look different; much different, I would say:</p>
      <p><img src="/sites/default/files/old-images/berthold_3606.jpg"><br><img src="/sites/default/files/old-images/classico_3418.jpg"><br><img src="/sites/default/files/old-images/fountain_5036.jpg"><br><img src="/sites/default/files/old-images/ITC_5120.jpg"><br><img src="/sites/default/files/old-images/monotype_5122.jpg"><br><img src="/sites/default/files/old-images/scangraphic_3726.jpg"><br><img src="/sites/default/files/old-images/storm_5216.jpg"></p>
      <p>From top to bottom: Berthold, Classico (Franko Luin), Fountain, ITC New Baskerville, Monotype, Scangraphic/Elsner &amp; Flake, Storm.</p>
      <p>Apart from ITC and Monotype, it seems like each of these typefaces was cut from a very different source.</p>
