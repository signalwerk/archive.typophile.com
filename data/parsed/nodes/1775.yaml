    html: <p> Hey, pretty nice. <br>A little bit of Licko in there (Dogma, plus some Tarzana in the lc), but still very original and workable. You've made some interesting choices, but most of them work for me. Some of the caps need taming (like the "G"), but the [more important] lc seems to have great balance, overall. (And I agree with Marc's views.) <br> <br>BTW, I think you need a lighter weight (or two). And the numerals are nice. <br> <br>Oh, and nice quote too!  ;-) <br> <br>hhp </p>
