    html: <p> Ramiro, <br> <br>It's lovely. I like the way you've used a consistent set of techniques in a loose, organic way. <br> <br>The only characters I'm not crazy about are the lower case t and the upper case V. I think the t needs a stronger (wider? thicker?) crossbar, positioned closer to the x-height. And the V is too straightforward -- it would benefit from a curved terminal. <br> <br>Nice work! </p>
