    html: <p>Ramiro -- <br> <br>I agree, this <i>is</i> nice. (Funny, I've got a sketch in a drawer somewhere with some similar concepts.) You've done a nice job with it. I agree with most of the specific character comments -- the t, V, G.  <br> <br>In addition, I think the S and s could benefit from a less rigid, less steep spine. Your capital X could be a little wider and less clotted in the center (the lc x, also, to a lesser extent). The lc z might like to be a little wider as well. I'm not crazy about that bump in the O and o; it interrupts the counter and looks like a glitch. The ear on the lc r could maybe be a little more pronounced. <br> <br>But there are some really nice things going on here. Keep it up. <br> <br>-- K.</p>
