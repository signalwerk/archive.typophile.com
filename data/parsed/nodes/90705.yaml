    <p>Saw this beautiful old thermometer on the wall at White Grass XC ski lodge in West Virginia:</p>
    <p><a href="http://db.tt/nod1nwOX" title="http://db.tt/nod1nwOX">http://db.tt/nod1nwOX</a></p>
    <p>I love the typography on the face. It's vaguely architectural, and has an almost Scandinavian quality (appropriate for an XC ski lodge). I have no idea how old it is, but I'd guess it's at least 40-50 years old, maybe more. The typography looks handwritten, with a thicker stroke near intersecting lines. And I love the triangular zeros! Finally, the thermometer was made in the US.</p>
    <p>I have no clue if this is an actual font or a one-of-a-kind hand lettering job. If anyone has any ideas, please post up!</p>
    <p>Thanks,<br>
    Scott</p>
