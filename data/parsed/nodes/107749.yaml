      <p>Hello Kristian,</p>
      <p>I had the same problem, month, maybe a year ago. But as far as I can remember thas was not a problem bound to FontLab. I remember TextEdit had the same strange problem.</p>
      <p>The bad news, I’m not 100% sure how I resolved the problem. Don’t let me say something wrong, but I think, when I installed a newer driver version for Intuos (I have a 4) the problem was still there. But when I installed an older driver it worked again.</p>
      <p>Have you installed the newest driver for Intuos?<br>
      It sounds crazy, but try to install an older driver.</p>
      <p>Thomas</p>
