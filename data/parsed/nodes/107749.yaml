  html: |-
    <p>Fontlab behaves funny when I use my tablet in glyph window mode.<br>
    Every time when I put my pen-hand or mouse on the tablet, Fontlab scrolls down a couple of rows. What’s happening? Oh, and yes ”Enable touch input is turned off”.</p>
    <p>Has any one else had a similar experience?</p>
    <p>Thanks,<br>
    Kristian</p>
