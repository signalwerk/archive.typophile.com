  html: <p>I have recently been requested to regenerate a handful of my fonts from Font Lab for a client who insists <span class="caps">FOG</span> generated fonts are problematic for them on X and <span class="caps">XP</span>. I have built them all in <span class="caps">FOG</span> historically and usually do all the generation from <span class="caps">FOG</span>. <br><br>So, I thought I’d pitch this to the group and see what you suggest… <br><br>I know Font Lab cannot open <span class="caps">FOG</span> ﬁles so I am using my Mac <span class="caps">PS</span> <span class="caps">FOG</span>-generated ﬁles and open the <span class="caps">PS</span> ﬁle then import all the suitcase data ala “replace all information in this font” <br><br>From there I haven’t ever “really” generated ﬁle from Font Lab. I usually just do the save as Windows <span class="caps">PS</span> but haven’t generated any Mac formats. <br><br>Also, do I need to edit the <span class="caps">TT</span> setting to 2048 or does it automatically generate <span class="caps">TT</span> fonts at that em? <br><br>Otherwise Do I need to specify encodings, etc?  <br><br>Also, how much of that data in the font info box needs to be ﬁlled out? And does it include all of that data in the generated font or just in <span class="caps">OT</span> fonts? <br><br>Sorry for the littany of questions, but I am mostly concerned about missing any biggies that would cause problems later down the line. <br><br>Any help would be appreciated, <br>Stuart&nbsp;:D</p>
