    <p>I have new software, called CR8tracer (freeware) available at my website: <a href="http://www.cr8software.net" title="http://www.cr8software.net">http://www.cr8software.net</a></p>
    <p>It is a GUI for Potrace, and allows export of .gfs files for creating True Type fonts from scanned images of handwriting etc.</p>
    <p>Allan Murray<br>
    CR8 Software Solutions</p>
