      <p>Eike Dingler has implemented an interesting underlining feature in his type]media graduation typeface ‘Mexa’, using stylistic sets. Unfortunately, no images of this can be found online, but I guess you can just get in touch with him.</p>
      <p>The underline values to be set in FontLab only control how the underline looks in word processing applications like MS Word (possibly also TextEdit etc). InDesign allows much finer-tuned control, as illustrated above.</p>
