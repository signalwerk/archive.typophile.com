  html: |-
    <p>I was reading "How to be a graphic designer without losing your soul" and I was noticing that they used a type of underlining in the book where the line was stopped when it reached letters with descenders. Does anyone know how to this - and is it possible to make in FontLab?</p>
    <p>I've attached an image to explain it visually.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/whereitsgoing_6568.png"></div><p></p>
