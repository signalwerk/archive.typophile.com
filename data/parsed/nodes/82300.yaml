    html: |-
      <p>Why not using GREP styles in Indesign?</p>
      <p>1. Set up a Paragraph style for your text.<br>
      2. Create a new character style for the underlining.<br>
      3. In your paragraph style add a nested style and call the created character style.<br>
      4. Click on GREP style in your paragraph style and add a new GREP style.<br>
      5. Enter the character you want to change (p or g etc).<br>
      6. Where it says Apply Style create a new character style with underline turned off (or stroke around text).<br>
      7. Apply paragraph style to text.</p>
      <p>I'm sure there is an easier way, but can't think of anything else without testing it.</p>
      <p>Jörg</p>
