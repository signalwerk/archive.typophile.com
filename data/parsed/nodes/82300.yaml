    html: <p>If you want to do it in Fontlab, you'll need to have a typeface with underlines built in. In InDesign you can apply character styles with a underline, defining its offset, stroke weight, colour etc. For the gaps you just omit the style for that specific character. You can also play with adding a thin white stroke to the font to make gaps.</p>
