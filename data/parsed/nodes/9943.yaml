  html: <p>This kind of question is always tricky, because our idea of 'resemble' may be very different, but I would suggest looking at Lucida Sans, ITC Symbol (which is almost a sans) and ITC Eras which has a similar clean feel, and large x-height. <br> <br>See if one of those is close enough to what you want.</p>
