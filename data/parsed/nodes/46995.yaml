    <p>I am trying to find a grotesque sans serif that could be very similar to <a class="freelinking-external" href="https://web.archive.org/web/20081013110211/http://www.fontshop.com/fonts/singles/process/maple_regular/">Maple</a>. I have looked at <a class="freelinking-external" href="https://web.archive.org/web/20081013110211/http://typophile.com/node/18671">all of these grotesque sans serifs</a> but it seems that none of them are close.  Are there other typefaces which are based on Stephenson Blake that are very similar to Maple?</p>
