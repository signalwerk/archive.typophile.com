      <p>I wonder if Stanley Kubrick chose Mona Lisa? The digital font was released in 1991. He died in 1999. The hard edges and formal structure of this Art Deco serif design -- tall, thin and very regular -- suggest a futuristic cold spirituality rather than joy or human warmth. A good fit for this rather depressing movie.<br>
      Don</p>
