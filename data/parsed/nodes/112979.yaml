      <p>Two comments:</p>
      <p>1. That poem is incorrect; the line is "to the waters <em>and</em> the wild"; "faery" is misspelled; the last two lines should be one; and the first line ends in an exclamation point. (William Butler Yeats, "The Stolen Child")</p>
      <p>2. The font is Mona Lisa.</p>
