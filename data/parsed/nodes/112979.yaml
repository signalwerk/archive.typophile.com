    html: |-
      <p>Some fonts do not age well.  Technology changes. LCD was great for a 1980s movie to show the cutting edge of technology. Today it is beginning to look increasingly quaint. Same for OCR shaped fonts -- so 70s. For a movie maker who wants a film to continue to communicate with people for many years into the future tried and tested works well. Consider Windsor in Woody Allen's movies, or Bernhard Modern in Downton Abby. Might be something of interest in <a href="http://fontmeme.com/movie-fonts/" title="http://fontmeme.com/movie-fonts/">http://fontmeme.com/movie-fonts/</a><br>
      Apologies Victoria,  for having strayed from fonts in scenes to fonts in titling, but the thread was already drifting in that direction :( Perhaps a typophile is prepared to put us back on track.<br>
      Don</p>
