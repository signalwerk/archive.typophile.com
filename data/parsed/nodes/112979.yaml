      <p>My guess is they wanted a contemporary spelling for "fairy", and the line break was changed to make lines similar lengths, but no idea why "and" was changed to "of".  </p>
      <p>This was originally a Stanley Kubrick project, but after Kubrick died it was taken over by Spielberg (Kubrick had previously talked about letting Spielberg direct it). Perhaps "of" was a typo in the script and Spielberg didn't want to correct it in case it a deliberate change by Kubrick.</p>
      <p>Thanks for the font ID; I wondered what it was.</p>
