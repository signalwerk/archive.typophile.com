    html: |-
      <p>Also supporting these codepages would give your font a more complete latin glyph set:</p>
      <p>MS Windows 1250 Central European<br>
      MS Windows 1254 Turkish<br>
      MS Windows 1257 Baltic</p>
      <p>These ranges along with 1252 seems to be becoming the default character set for OT fonts.<br>
      (at least that is the way we are looking at it)</p>
