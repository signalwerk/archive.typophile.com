    html: <p>If by "average, commercially useful font" you mean one adequate for setting "western" languages in an office setting, then the Mac Roman/Windows 1252 would do for a minimum. Whether you need additional ligatures such as ffi and ffl would depend on the font design. And then of course there are old style figures, lining figures, small caps, scientific inferiors and superiors . . . all kinds of additional glyphs that can extand the usefulness of the font, not even considering additional language support.</p>
