    <p>Hi all,<br>
    I'm in the beginning phases of designing a logo for a community website that allows subscribers to create their own website within, a sort of mixture between geocities, myspace, hubpages and squarespace - if you can imagine what that might look like. I've had little time to think hard about this but this is what I've come up with so far:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo 1_4525.1.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/logo 1_6593.2.png"></div><p></p>
    <p>This logo (as presented here) forms the top bar (look at facebook or myspace to see what I'm getting at). That top bar will span the entire width of the web browser and then below will begin the actual website of the subscriber.</p>
    <p>Any initial thoughts? </p>
    <p>Thanks</p>
