    html: "<p>Thanks Riccardo. I like the second one but you're right, Arial Rounded has been used by many internet brands like Skype. The first is called Berlin Sans, I like it because it isn't one you see online. Which leads me to another question, in case there are any typography historians out there: who created Berlin Sans? what for? what are its connotations? what is its normal context? Any other font recommendations that capture the internet brand feel but still unique and fresh? possibly friendly and not too expensive looking? (our members will pay a small annual fee)</p>"
