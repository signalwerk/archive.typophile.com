  html: <p>Just FYI, registered members of typophile are allowed to submit news stories. There is a link on <a href="news" rel="nofollow">the news page</a> in the right-hand column that allows you do this. However, once you post an item, it is stuck in moderation until approved by a moderator. So, after posting news items, please <a href="readme#help" rel="nofollow">contact a moderator</a> to approve your posting for you. Thanks for reading!</p>
