    <p>Does anyone know of a list of the fonts shipped with Adobe’s CS2 suite that are necessary to keep the software working? I’ve disabled some of them, but apparently the software (Specifically Illustrator and Photoshop) depends on being able access fonts it never displays to do important stuff like save files or edit text without displaying error messages.</p>
