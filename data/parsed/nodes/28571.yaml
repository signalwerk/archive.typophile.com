    html: |-
      <p>“Why don’t you just leave them? – you may have a long font menu, but so what?”</p>
      <p>Because having to go sifting through that font menu annoys me. It’s more annoying when other fonts get dumped into the system fonts directory by applications, as those fonts sometimes have screwed up names that Indesign and Illustrator will jump to when I’m typing in font names.</p>
      <p>It would be nice if Adobe would add an option to just not display any system fonts inside of their apps. FontExplorer X has no trouble picking out the system fonts, so maybe if I ask nicely I might be able to get them to make a nice fix for me.</p>
