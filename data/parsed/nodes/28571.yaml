      <p>I’ve actually found that most of the nasty display fonts that come with Mac OS can be disabled without trouble: Papyrus, Chalkboard, Impact, etc. This is especially important to me, because when I stay awake too long I start hallucinating and all type turns into Papyrus, wich is really nasty when one is standing in a long passport control line at the Milan airport). </p>
      <p>But the text fonts have to stay untouched; I think my problems were a result of shutting off Gill Sans, Hoefler Text, and New York. Which is odd, because I’ve never seen them used for anything.</p>
