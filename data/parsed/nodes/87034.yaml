    <p>Mija<br>
    Designed by Miguel Hernández<br>
    Mija is a grotesk vernacular handmade typeface whose imperfections make it perfect. It is a fresh hand-painted display face with a warm and organic feel. This full-of-ink-traps typeface is inspired by local vernacular signs. Mija looks good at both large and small sizes. The family is available in a 4-font combo package, suited for solving most common text hierarchy problems in graphic design; Roman, Bold, Italic and Small Caps.</p>
    <p>Mija is derived from the words ‘mi hija’, which literally translated means ‘my daughter’. Mija is a Latin American Spanish term of endearment most of the time used by an older person to a younger girl or woman.</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/mija/" title="http://new.myfonts.com/fonts/latinotype/mija/">http://new.myfonts.com/fonts/latinotype/mija/</a></p>
    <p>Dulce<br>
    Designed by Paula Nazal Selaive</p>
    <p>Dulce is a swash typeface with an elegant and romantic touch. It is thin, but it becomes thick where two terminals meet and it also has swelling at terminals. Its wide range of ligatures makes it a versatile typeface, suitable for headlines and short phrases. You will see all of these ligatures on the screen, enabling “standard ligatures” and “discretionary ligatures” options. Ornaments are also included, which can be very useful for designing. Dulce is ideal for magazines, logotypes, advertising, etc. Use it for whatever you want and enjoy!</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/dulce/" title="http://new.myfonts.com/fonts/latinotype/dulce/">http://new.myfonts.com/fonts/latinotype/dulce/</a></p>
    <p>Printa<br>
    Desined by Guisela Mendoza (Coto)</p>
    <p>It is inspired by mandalic structures. Its visual language is based on misregister and flaws in textiles printed by serigraph technique in the ‘70s.</p>
    <p>This typeface allows you to combine two characters (front/uppercase; back/lowercase) into a single one to create print repeat patterns. This way you can get many different combinations. Printa is ideal for those who seek handmade designs.</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/printa/" title="http://new.myfonts.com/fonts/latinotype/printa/">http://new.myfonts.com/fonts/latinotype/printa/</a></p>
