    html: <p>As for seeing the complete character set in print, many headline font specimen catalogs from the Seventies would have it. The kind to look for are ones produced by typesetting houses for their customers, rather than the ones produced by the film font manufacturers, such as VGC, which would usually only show one-line specimens.</p>
