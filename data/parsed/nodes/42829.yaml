    html: |-
      <p>Just as a point of interest -- I could not find L&amp;C Hairline listed in the 1980 <em>ITC Typeface Collection</em> big black book, though ITC L&amp;C Stymie Hairline is.</p>
      <p>I found a one-liner sample of L&amp;C Hairline in the 1972 VGC Typeface Collection catalog showing a very unique ampersand (classic lowercase <em>et</em> with oblique swash and ball terminal extended from the bar of lowercase <em>e</em>.</p>
      <p>According to Incipit's notes, Lubalin and Carnase's design (c 1965) is owned by their estates, which makes me wonder if L&amp;C Hairline was ever part of the ITC Collection.<br>
      If anyone can shed some light on this it would help tie up loose ends.</p>
    html_clean: |-
