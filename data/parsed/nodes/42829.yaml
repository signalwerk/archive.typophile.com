  html: |-
    <p>Does anyone know if the complete character set of L &amp; C Hairline (ITC L &amp; C Hairline) typeface is printed in any reference work (whether in print or out of print) and the name of any such reference works? I understand that this typeface is not currently available in digitized form. I am aware of two web sites with complete and partial character set appearing in low quality images, but prefer to see the complete character set of this typeface in print. Thanks.<br>
     Ray</p>
