      <p>"Admittedly, that can work in the United States, where the students (or the parents) can afford it. But not every school in the world can demand to their students to buy a laptop. And we must not forget that it is not only about buying the computer, but about licensing the required software."</p>
      <p>Thing is, the price difference is $430. Cost for a basic but functional Windows laptop with 4 GB of RAM: $400. TypeTool is $100. Total, $500. So, it's hard to justify the course-in-the-lab pricing from a student perspective, really. (Not that I'm denying all the expenses the school has in running the lab, which add up.)</p>
      <p>Cheers,</p>
