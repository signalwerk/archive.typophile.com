    html: <p>In many colleges in the USA, laptops are required just like text books--and this is for all majors. There is a sort of quiet, behind-the-scenes thing that happens where students who show a great financial need, are given loaners by either the school or charitable minded corporate sponsors. I remember, what seemed to me to be an incredible financial burden in 1962, when I had to come up with the money to buy a Yashica-D for a freshman photography class at CMU. At least I was not in engineering where they not only had to buy a slide rule but books of log tables.</p>
