    <p>Cooper Union's new typeface design program, organized in conjunction with the Type Directors Club was just recently announced. It is currently a certificate program offered through Cooper's continuing education department. The new website has all the info on curriculum, faculty bios, and application details:<br>
    <a href="http://coopertype.org/" title="http://coopertype.org/">http://coopertype.org/</a></p>
    <p>While there have been many type design workshops and classes offered in North America before, this is the first program of its kind to take place on the continent. Having moved to New York not too long ago myself, I must say I can't think of a better city to hold such a program in – if for nothing else than to have access to such a vast pool of talented type folks living in the area.</p>
    <p>Furthermore, Cooper Union and the Type Directors Club couldn't be much better organizations to have involved. Among other things, Cooper has made typography a priority with their Herb Lubalin Study Center of Design and Typography, and the TDC's annual typeface awards are among the most notable in the industry. Plus it goes without saying that both have long typographic histories that include some of the greats of American type, lettering, and design.</p>
    <p>The <a href="http://coopertype.org/curriculum" rel="nofollow">course list</a> and <a href="http://coopertype.org/faculty" rel="nofollow">roster of people involved</a> for the first term alone is quite impressive (not to mention surprisingly diverse), and I'm sure the second and third terms will be just as good. More information will be posted on the site as it becomes available.</p>
    <p>I apologize for shamelessly tooting the horn of a project I'm obviously involved with, but I'm really excited about it and thought some of you might be as well. As always, I'm appreciative of any feedback – critical or otherwise – and am happy to answer any questions.</p>
