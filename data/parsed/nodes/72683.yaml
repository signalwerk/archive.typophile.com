      <p>&gt;Computer labs are money pits for schools. The costs of space, hardware, software, printers, toner, networking, cooling, staff...</p>
      <p>This is quite accurate. There is a trade off of luxury and efficiency vs. cost effectiveness.  </p>
      <p>Running a type design class in a computer lab allows students to scan and print and to use other applications to test a font in a layout), reliable access the Internet, and file sharing. Access to networked printers allows students to inspect their work on high quality print outs quickly and throughout class time and to get ready for critiques on the fly. Of course, there is a cost for this luxury. </p>
      <p>Obviously, many serious design students already own a laptop and if money is an issue would better spend those funds on a laptop and legal licensing of software so they can obsess over BCPs at home.</p>
      <p>For Type@Cooper, we're doing something in-between...we'll have dedicated equipment and AV support without the full lab environment.</p>
