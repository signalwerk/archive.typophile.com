      <p>Concerning foreign students and visas, here is what I can say. </p>
      <p>No one needs to have a special visa to apply to or attend Type@Cooper, immigration status is not a factor at all. </p>
      <p>Cooper Union cannot help to get a student visa to study (which is good news and a little bit bad news) because the program doesn't require enough contact hours to qualify. This is only bad if you come from a country who's citizens must jump through hoops to get a tourist visa to the US. It's good because thanks to Homeland Security, schools now have to charge enormous fees to foreign students to offset the expense of doing the ten years of follow-up paperwork per student. </p>
      <p>I am told that there are quite a few Brazilians who have come repeatedly to do the Architecture Certificate program in Green Building courses here at Cooper. They have all come on tourist visas. </p>
      <p>The only difficulty is that a tourist visa limits you to a certain number of months visit. Still, the fees that get charged to foreign students are more than just about any round trip airfare in the world.</p>
