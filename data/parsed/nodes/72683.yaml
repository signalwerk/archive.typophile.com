      <p>I think you can teach basic principles and skills with any style of letter. It has been my experience teaching this that the best result comes from allowing the student to explore any style letter they choose (With some guidance). </p>
      <p>Most people come to a type design course with an idea they are interested in exploring. Having different styles being developed in class adds to a certain visual richness, and allows the instructor to point out issues that emerge from the different styles. </p>
      <p>I've had students start with blackletter, handwriting, sans serif, serif, historical revival, carnival/circus type, tombstone lettering, western lettering, various styles of formal calligraphy, and more. All of those styles, and the problems they presented to the student designers were great teaching opportunities for the entire class.</p>
