      <p>Jesse, it may be better to start with making a simple sans serif, to teach basic skills and principles, rather than a revival.</p>
      <p>There are too many issues involving subtle drawing in a revival, especially, as is likely the case, if you are reviving a serifed face.</p>
      <p>The fundamental principles are sidebearings, alignment zones/overshoot, vertical proportions and stem widths, and these are easiest to grasp in a plain sans serif.</p>
      <p>Besides, starting with a revival sets a prosaic tone for a type design course.<br>
      It's overly academic, like art school in the 19th century, where the subject of drawing classes was a plaster cast of an old statue.</p>
