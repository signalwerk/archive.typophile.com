      <p>Thank you, Nick and James, for sharing the benefit of your teaching experiences. </p>
      <p>That's a good point, Nick, but I tend to agree more with James's sentiments. The basic principles can be taught with almost any style of letter, and the diversity of classmates' projects will be instructive to students. </p>
      <p>Over the years in my undergraduate typeface design class at Pratt, I've let students choose between revivals and original designs. The most important thing is that students choose projects that can maintain their enthusiasm through many, many hours of potentially tedious work. But I've found that most beginner students reach better results when working from some kind of source material. Sources have ranged from a few words on a WPA poster to a full alphabet in a Deberny &amp; Peignot specimen (with permission, of course), and interpretations have ranged from "recuttings" to "reconsiderations" (<a class="freelinking external" href="http://www.emigre.com/Editorial.php?sect=2&amp;id=1" rel="nofollow">John Downer's terms</a>). I encourage students to work on designs that fit their skill levels and interests, and a simple sans serif may be just the thing for some of them.</p>
      <p>For students who are less familiar with type anatomy, working from a source provides the opportunity to learn, through critical observation and meticulous reconstruction, key principles like letter proportion, weight distribution, and maintaining/breaking a system. And since many variables have already been established in the sources, students are able to focus more attention on the fundamental principles Nick mentions. </p>
      <p>It's true that a beginning designer may not be fully prepared to handle a revival with the nuance and care that it deserves. But the goal in the first term is to learn, not to produce the best possible product. (How many designers' first attempts at typefaces have been masterpieces, anyway?) We have the luxury of three terms, and the larger project in the second and third terms will provide the opportunity to design a more finessed finished project.</p>
      <p>And James, I certainly hope Type@Cooper won't detract from your SVA CE enrollment. I expect the difference in time commitment makes your class far more feasible for some students. Let's hope there's room for both!</p>
