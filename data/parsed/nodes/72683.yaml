      <p>Ken Barber's "The Drawn Letter" elective workshop is going to be repeated on November 6th and 7th and places are available for anyone outside the program to sign up. Ken has graciously agreed to come back to do a repeat performance in November since so many people expressed interest in the October dates. This workshop will be some mix of hand drawing and digitizing (optional). </p>
      <p>"This workshop will investigate recent historical approaches to lettering, in addition to exploring various production techniques. Participants will refer to familiar typographic models and helpful specimens as they create their own hand-drawn wordmarks"</p>
      <p>For a full course description look at coopertype.org. To register you can go to <a href="http://cooperunion.augusoft.net/index.cfm?method=ClassListing.ClassListingDisplay&amp;int_category_id=4&amp;int_sub_category_id=33" title="http://cooperunion.augusoft.net/index.cfm?method=ClassListing.ClassListingDisplay&amp;int_category_id=4&amp;int_sub_category_id=33">http://cooperunion.augusoft.net/index.cfm?method=ClassListing.ClassListi...</a> or call the Continuing Education office if you're a TDC member to get your 20% discount: (212) 353-4195</p>
      <p>The lecture series begins on October 18th at 6:30 pm in the Rose Auditorium in the New Academic Building at 41 Cooper Square.<br>
      Stephen Saxe will talk about design and production of 19th Century American Type. You can register online or by phone.</p>
