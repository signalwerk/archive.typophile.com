      <p>I wouldn't necessarily be seeking an MA in type design to further my career. It'd be more for the immersive learning environment and the experience. To dedicate an entire year or so to type design is a pretty big undertaking with not too much reward. But the undertaking would be considerably less of a burden if the States had an MA program of its own.</p>
      <p>Granted, you don't need an MA to be a successful type designer, but I don't think many people go into it with the impression it will make them one of the best.</p>
