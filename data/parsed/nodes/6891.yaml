    html: <p>Look for a book this Summer by Leslie Cabarga that explores the best techniques for glyph drawing and orthagonal points.  Better yet, ask him yourself at Typecon! <br> <br>Bring your glyph into FOG and add points to extema. You'll see that points are added to the furthest areas that define the shape of the glyph. <br> <br>The key is to create all your glyphs using these points almost exclusively. See ugly drawing below! <br> <br>Stuart :D <br> <br><img src="http://www.typophile.com/forums/messages/4101/5022.gif" alt=""></p>
    html_clean: <p>Look for a book this Summer by Leslie Cabarga that explores the best techniques for glyph drawing and orthagonal points.  Better yet, ask him yourself at Typecon! <br> <br>Bring your glyph into FOG and add points to extema. You'll see that points are added to the furthest areas that define the shape of the glyph. <br> <br>The key is to create all your glyphs using these points almost exclusively. See ugly drawing below! <br> <br>Stuart :D <br> <br><img src="http://www.typophile.com/forums/messages/4101/5022.gif" alt=""></p>
  - id: 48034
    user: 1250
    date: 2003-01-29T15:00:00
    date_raw: 29 Jan 2003 — 3:00pm
    votes: null
    html: <p>And don't forget to explicitly define inflection points! Like on the spines of the "S"/"s". It makes editing harder (so you leave it 'till the end), but it can save you rendering bug headaches, as well as occasionally serious fidelity issues if you output to TT from cubic (PS-style) data, as well as for Flash display. <br> <br>hhp <br></p>
