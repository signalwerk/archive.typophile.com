  html: <p>I was recently told by someone that when designing a glyph a bezier point shouldn't represent a full corner. rather there should be two bezier points defining a curve. i opened an emigre font that i own, and found this to be the case. could someone explain this reasoning to me, i heard it deals with rasterization.</p>
