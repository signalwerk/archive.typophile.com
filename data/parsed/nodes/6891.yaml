    html: <p>If you're looking for an introductory book on creating outlines and other aspects of simple type manufacture, Michael Harvey's <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1558214534/qid=1044000693/sr=1-10/ref=sr_1_10/102-2699481-5964141?v=glance&amp;s=books"><i>Creative Lettering Today</i></a> is quite good. It is also probably the only book ever that will teach you the basics of calligraphy, lettering, using fontographer <i>and</i> cutting letters in stone and wood. Michael's done a number of fonts for Adobe, so he has a good grasp of the technical requirements for clean outlines, nodes at extremes, etc.</p>
    html_clean: <p>If you're looking for an introductory book on creating outlines and other aspects of simple type manufacture, Michael Harvey's <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1558214534/qid=1044000693/sr=1-10/ref=sr_1_10/102-2699481-5964141?v=glance&amp;s=books" class="link-external"><i>Creative Lettering Today</i></a> is quite good. It is also probably the only book ever that will teach you the basics of calligraphy, lettering, using fontographer <i>and</i> cutting letters in stone and wood. Michael's done a number of fonts for Adobe, so he has a good grasp of the technical requirements for clean outlines, nodes at extremes, etc.</p>
