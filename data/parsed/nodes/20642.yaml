    votes: null
    html: |-
      <p>I'm not a type designer, but rather a typographer/graphic<br>
      designer, but I will try and help you out.</p>
      <p>I'm not too sure about the dark areas either. Although I think<br>
      it does work in certain letters such as 'u' 'q' 'y' and 'g'. For me<br>
      it definately doesn't work in 'm' 'k' 'e' 'a' 'r' and 'h'. Try and<br>
      think where such clotting might occur more naturally within<br>
      the letters, as it does seem over forced.</p>
      <p>I don't like the shape of the 'w', 'x' or 'k'.  Perhaps look at more<br>
      conventional shapes. It seems like you're trying too hard to<br>
      make it stand out and seem original, probably because it's your<br>
      first design. Don't be scared of really nice, but simple letters. I<br>
      think that a lot of peoples first type designs are quite gimmicky. </p>
      <p>The bar on the 't' and 'f' needs to be stronger I feel. </p>
      <p>The 'z' looks like it's leaning to the right. Perhaps extend he<br>
      baseline stroke to the right a little to balance it out more. </p>
      <p>The 's' looks upside down. </p>
      <p>The 'a' doesn't look right. Perhaps avoid the completely flat base.<br>
      The bowl also seems a little small and squashed vertically.</p>
      <p>The 'e' looks a little awkward to me. Try extending the bottom<br>
      stroke and making that left side more curved. </p>
      <p>A good start though, and good luck!</p>
      <p>Phil</p>
