    html: |-
      <p>RE: cropped ‘n’</p>
      <p>Totally. </p>
      <p>I would loose those dark spots. They mess with the flow of the face &amp; I don't think they are fun enough as is to keep.</p>
      <p>Think about that e again. It should feel more different from your a - maybe grab a curce from the upper left side of your o.</p>
      <p>For this face to look even it can't be litterally even. There are illusions at work. The problem becomes more &amp; more obvious as the weight gets heavier. See it? If you do some searching on the web you will find references as to the why &amp; how of this.</p>
