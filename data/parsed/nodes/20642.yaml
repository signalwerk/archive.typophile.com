    <p>I'm new to type design but not typography. I'm a designer based in the UK and have always wanted to design a typeface. My first effort is for my company Distil hence Distil Sans. So far I've only done the light version and the lowercase letters using a combination of Iluustrator CS2 and Fontlab Studio 4.6. The other weights are mocked up using a stroke in illustrator but are close to  what I would like the finished weights to be.</p>
    <p>I'd be grateful for any feedback at this point</p>
