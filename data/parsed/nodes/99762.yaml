      <p>Looks more like Charles Rennie Macintosh for the double bar A. Art Nouveau R and E. Couldn't find much more.</p>
      <p>No back slanted A -- no Italics to speak of. The Slant bar N and Ampersand were not found. </p>
      <p>Here's as couple of links anyway: <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/rennie-mackintosh/" rel="nofollow">http://www.myfonts.com/fonts/itc/rennie-mackintosh/</a><br>
      --<a class="freelinking external" href="http://www.myfonts.com/foundry/CRMFontCo/" rel="nofollow">http://www.myfonts.com/foundry/CRMFontCo/</a><br>
      --<a class="freelinking external" href="http://www.crmackintosh.net/product_details.html" rel="nofollow">http://www.crmackintosh.net/product_details.html</a></p>
      <p>This font is called CRMacintosh.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/live1_5903.jpg"></div><br>
      The /L aren't exact copies on the original as well as having a short arm vis a vis the /E, so could be handiwork.<p></p>
