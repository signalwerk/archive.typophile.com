  html: |-
    <p>I was wondering is it possible to have several weights and their italics of a particular typeface built into one .otf file. In the same manner that stylistic sets are used to have alternative characters for certain glyphs could this be used to house an entire family?</p>
    <p>Cheers</p>
    <p>SM</p>
