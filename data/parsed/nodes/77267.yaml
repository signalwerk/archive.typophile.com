      <p>There can be use for such a thing. An educational publisher in the Netherlands has a special writing system. In the example you can see different kind of 'i-j' ligatures, The so called IJ of ij in Dutch. Depending on the position, ij.begin, ij.alt1-3 or ij.end is used. In this way al characters can be connected.<br>
      In this writing method, there is also an example showing how a character should be written. These characters (and the 2 thin ones) could have been placed into another font, but that font wouldn't have the joining character. That might cause some confusion.<br>
      With this font the designer doesn't have to switch between typefaces. If they want to show a single character, the normal version is selected (ij). By choosing the appropriate stylistic set, they can have the version with the arrows (ij.arr) or the thin version (ij,thin or ij.thin.arr). The font also contains special symbols in other stylistic sets.<br>
      The feedback from the people using the font was that this system worked much easier and with hardly any mistakes, when compared to all the different fonts they used in the past.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/zwij_6574.jpg"></div><p></p>
