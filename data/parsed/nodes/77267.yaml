      <p><em>Just for the record:</em><br>
      &nbsp;<br>
      The ij-variants shown here are part of <em>Pennenstreken</em>, a writing method for primary schools. More than fifteen years ago –when we still did work for third parties– this system was digitized at the Dutch Type Library for the publisher Zwijsen.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Pennenstreken_1_small_6506.jpg"></div><br>
      Until that time the instruction books, cards and games for <em>Pennenstreken</em> were handwritten and during digitizing I found out that there were many inconsistencies in the method that were circumvented by the calligrapher, who did this work for a long time then (I am not sure if she was pleased with the stuff going digital). So, I had to define a range of medial variants to make any combination of letters possible. The number of variants furthermore increased by the isolated, initial and final versions and the thinner versions for larger point sizes and the ones that contained info about the writing direction, instruction/practicing shapes, and so on.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Pennenstreken_4_small_5406.jpg"></div><br>
      The letters that formed the basis in the initial instruction books were enlarged and we manually digitized these in the IKARUS format. Further enhancements and refinements were applied in the Bezier format. As one can imagine, we ended up with an enormous amount of glyphs, which had to be placed in single byte PS Type1 fonts. I made a system for this and used for instance style linking for switching between the different variants. Of course, this resulted in a comprehensive manual that I wrote for the people working in Quark XPress on the instruction books and other stuff. The whole project asked for a perfect administration and organization, but it was complex still for the designers to apply the correct glyph variants.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Pennenstreken_2_small_6731.jpg"></div><br>
      When the Dutch Type Library stopped working for third parties at the end of the 1990’s (from that time on we only focus on the DTL typefaces and software), I transferred the copyright on the digital <em>Pennestreken</em> types to the publisher. As far as I know the first OpenType fonts were developed at a later stage internally at Zwijsen using FontLab Studio.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Pennenstreken_3_small_6737.jpg"></div><br>
      Let me underline here that I was not responsible in any way for the method itself. I tried to discuss the ideas and principles behind the system, but these methods are developed in an obviously closed environment of all kinds of educational experts. Anyway, as I wrote, this project was done a long time ago.<br>
      &nbsp;<br>
      FEB<p></p>
