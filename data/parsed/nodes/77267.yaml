    html: |-
      <p>Technically it is possible to include weights and italics inside the regular font as stylistic sets. But if the software that uses the font doesn’t recognize OT features, you’ll have a normal typeface with no access to anything else. </p>
      <p>If you use the font in a software that does recognize OT features, then your weights and italics could be lost if at some point you decide to switch to any other font.</p>
