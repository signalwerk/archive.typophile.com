      <p>I agree with Don's suggestion of Eagle, as an Art Deco type that has a similar look. Mark Simonson also has a font family that includes much of the Art Deco vocabulary in the form of alternates for his <a href="http://Mostra Nuova" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Mostra Nuova</a> family. See the Bold Alt D variant for the closest match.</p>
      <p>- Mike Yanega</p>
