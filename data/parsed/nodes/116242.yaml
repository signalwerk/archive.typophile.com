      <p>Looks like Eagle Bold <a href="http://www.myfonts.com/fonts/fontbureau/eagle/">http://www.myfonts.com/fonts/fontbureau/eagle/</a> except for the _G_. Eagle Bold was the signature font for the US WPA/NRA of the 1930s. It has been the inspiration for several similar fonts including Naked Power Black by Typodermic <a href="http://www.myfonts.com/fonts/typodermic/naked-power/">http://www.myfonts.com/fonts/typodermic/naked-power/</a> which has a _G_ in the Futura style of the image. Still looking for an exact match. Failing that, Eagle Bold would work as an approximation if the _G_ was edited.<br>
      A little lighter weight , but also worth trying, Hurme Geometric Sans Black <a href="http://www.myfonts.com/fonts/hurme-design/hurme-geometric-sans/">http://www.myfonts.com/fonts/hurme-design/hurme-geometric-sans/</a> <a href="http://www.myfonts.com/fonts/hurme-design/hurme-geometric-sans-2/">http://www.myfonts.com/fonts/hurme-design/hurme-geometric-sans-2/</a><br>
      Dark enough, but misses the mark on several counts Telefon Black <a href="http://www.identifont.com/find?font=telefon+black&amp;q=Go">http://www.identifont.com/find?font=telefon+black&amp;q=Go</a><br>
      Don</p>
