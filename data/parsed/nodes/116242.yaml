    html: <p>I really thought it was <a href="http://www.houseind.com/fonts/neutraface2" title="Click to visit an external URL." class="freelink freelink-external freelink-external">HI Neutraface No.2</a> Display Titling but even if some letters look pretty spot on (/A, /S, /R, /N...) they are obviously some off (/M centre vertex even with the alternate, /G crossbar transition...). After some diggin', I finally found the origin of these samples. It comes from <a href="http://www.starwoodhotels.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">(Star)W(ood) Hotels</a> identity and it's actually their (new) corporate typeface called 'W Sans New'. I'm still convinced it's based on Neutraface No. 2 Display Titling though.</p>
