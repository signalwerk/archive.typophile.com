    <p>Hey Everyone!</p>
    <p>I'm currently working on business cards for a client, and in their indentity currently includes Vectora LT Std 45 Light. How small can I go with this before its print quality starts to get questionable? I've never worked with small/light fonts before when going to press.</p>
    <p>Thanks!<br>
    Mike</p>
