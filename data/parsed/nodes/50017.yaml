    html: |-
      <p>How are you printing? Matched Pantone colors or black (which will all come out pretty crisp) or CMYK? (which will have to be screened to achieve the color)<br>
      Neenah Classic Crest is a nice paper to print on, but the process will affect the outcome.</p>
      <p>If you're printing dark on light you can go smaller/lighter than if you're printing in reverse (ie knocking out white on a dark background etc, where dotgain will affect the type weight)</p>
      <p>In addition to that - what is the smallest typesize you're contemplating right now?</p>
      <p>As to printing small - make sure that someone over 40 can read it! (You'd be amazed how much people will struggle with small type, and you don't want important info such as the email address or phone number to be too small to read by the person who's getting the card).</p>
      <p>Good luck!</p>
    html_clean: |-
