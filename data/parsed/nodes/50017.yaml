    html: |-
      <p>Looks fine to me. 7pt type on business cards is pretty common. Sure some of us might need glasses to read it, but it’s not like this requires long periods of continuous reading.</p>
      <p>On a related note, “5th Floor” with the superscript “th” is totally Microsoft Word and doesn’t belong on a business card, especially not an executive-level card. And at that size the fake superscript letters just disappear. Either write out “Fith” or just use 5.</p>
    html_clean: |-
