  html: <p>Does anyone know how the term text "<a href="/wiki/color" class="freelinking" rel="nofollow">color</a>," describing the relative grayness of text, came about ? My half-baked theory is that back in the seventeenth century and before, when the norm for text type was black ink on white paper, the term "color" was used as a metaphor because no one of any consequence would actually mistake text "color” as being text hue.</p>
  html_clean: <p>Does anyone know how the term text "<a href="/wiki/color" class="freelinking link-lost" rel="nofollow">color</a>," describing the relative grayness of text, came about ? My half-baked theory is that back in the seventeenth century and before, when the norm for text type was black ink on white paper, the term "color" was used as a metaphor because no one of any consequence would actually mistake text "color” as being text hue.</p>
