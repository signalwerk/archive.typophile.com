      <p>I was at first very apprehensive about that. All the fonts I've made as"!Exclamachine" have a "!" at the beginning, even though it sometimes isn't included when others refer to them. And it's invalaid in some early specs, but I <em>believe</em> it degrades gracefully.</p>
      <p>If you, or anybody, has any technical problems with the fonts please bring it to my attention immediately. <a href="mailto:chozcunningham@exclamachine.com">chozcunningham@exclamachine.com</a> If you can tell me what OS, application or printing hardware this has happened on, I will offer all the support I can.</p>
      <p>From my testing, or from feedback, things seem to function correctly  under Win98/NT4/2K/XP/Server 2003, Mac OSX and 3 distros of Linux, Redhat, Ubuntu and Debian. All contemporary Adobe products seem to be okay as well, when bypassing the OS's font management. I've also had good luck with several Windows free/shareware type managers. At this time I am unable, to experiment more in Linux, or Pre-X Macintoshes.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br><a href="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
