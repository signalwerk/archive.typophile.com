    <p>The naming debacle is resolved, and I even found inspiration in something <a href="http://en.wikipedia.org/wiki/Square_engine">a bit more mechanical</a>. With a name like !Exclamachine, there should be at least a few industrial-flavored fonts. I  now present <strong>!Square Engine</strong>, a font family.</p>
    <p>!Square Engine 050<em> Defex</em><br>
    !Square Engine 150<em> Simplex</em><br>
    !Square Engine 250<em> Reflex</em><br>
    !Square Engine 350<em> Latex</em></p>
    <p>144 characters x 4 Styles x 2 weights in each. Includes Euro, Irony Mark, lc accents and more.</p>
    <p>The family is inspired by the European tradition of using model numbers to describe the body &amp; motor combination of a car or bike(and sometimes a name). These four fully-interchangeable monospaced fonts have different wrappers or "bodies" ("0xx"-"3xx"), and share character design, or "engine"(the "x50").</p>
    <p>Future additions to the !Square Engine family will be numbered similarly, and spaced/scaled to also interchange.<br><img src="/sites/default/files/old-images/promo-on-burg_3710.jpg"><br>
    (Apologies to Daft Punk ;) )</p>
