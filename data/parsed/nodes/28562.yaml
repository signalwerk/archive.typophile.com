      <p>Thank you! Really, thank you very much! I appreciate the feedback because every font I make is both an experiment and  an education. I often get frustrated and estatic several times over, because the vision in my head might look nothing like what I had in mind (sometimes better, sometimes not.)</p>
      <p>I already have a few sketches for a sister series in the !Square Engine line, give me a few weeks, and I'll post a prototype.</p>
      <p>I like to think of my fonts as an open invitation to an artistic collaboration, waiting for whoever might pick it up and use it in a page. The hand off of a baton can be an anxious moment. </p>
      <p>On !Zugwang; Thank you again. ( I peeked at your website: pretty, cool, hip. )Oddly, this is my least favorite font! I'm fairly happy with the letters' shapes, but I find it impossible to really use anywhere. I may revisit it another day. Tonight, I will sleep.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      |\/|O D Z 4 L 3 T T 0 R Z</p>
