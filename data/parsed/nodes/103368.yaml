      <p>Good call Mike.<br>
      I can see this woodtype as a descendent of the Stempel typeface. Leaving aside the degree of being condensed and other points, the lower case is bang-on for the unique a, b, d, g, q &amp; p. Not unexpectedly Stemple's Hanseatic did not have harmonizing numbers. These seem to be a later addition by whomever did further work on the design. The woodtype R is consistent with a cleanup. The Woodtype Q would work as a solution of having none of the Capitals descend below the base line -- but this is just speculation on the difference. </p>
      <p>Jaspert's description of Hanseatic, as sold by Linotype Frankfurt is "A condensed lineale with short descenders."  Jaspert notes that "lineales" is the description applied by Maximillan Vox to types without serifs.</p>
      <p>Klingspor footnotes its listing of Hanseatic, designed at Linotype in 1964,  with the comment "Aus der eng fetten [bold condensed] information entwickelt [developed] von A. Ritzel. " Not clear if Rizel is for 1964 Linotype or Stempel 189o's.</p>
      <p>So if we can't find out anything more about this wood type you might go with a label like Hanseatic Inspired Lineale.</p>
      <p>Don</p>
