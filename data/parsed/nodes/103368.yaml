    html: <p>Suggestions, I'm afraid not. Thought I'd mention, though, that Hanseatic (BT's <a href="http://old.myfonts.com/fonts/bitstream/swiss-924/" target="_blank" rel="nofollow">Swiss 924</a>) was an 1890's Stempel typeface that shared those unique, sharper-than-usual "curved corners" on letters like a, b, d, etc. It also had a straight-legged R. Too condensed and lots of differences, though.</p>
