      <p>Straight leg R might help eliminate 19th century designs.  I did not see any as wood type. But that is not to say they did not exist.</p>
      <p>BTW, numbers often sold separately in old fonts. This one seems to have integral numbers. Compare 6&amp;9 with b, d, g, q &amp; p.</p>
      <p>Looks sort of Germanic, So you might try a careful review of fonts tagged <a href="//www.myfonts.com/search/tag%3Agrotesk/fonts/<br />
      " rel="nofollow">"grotesk" at MyFonts</a>.</p>
      <p>A real challenge.<br>
      Any suggestions to help earthache?<br>
      Don</p>
