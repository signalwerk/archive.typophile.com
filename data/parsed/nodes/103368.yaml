      <p>Easy to recreate this woodtype's a, b, d, g, h, m, n, q &amp; p by opening the condensed whitespace in Hanseatic  (BT's Swiss 924).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/WoodtypeHanseaticInspiredRecreated_3732.jpg"></div><br>
      Pretty close!<br>
      This confirms  Stemplel's 1890s Hanseatic as the origin of the design.<br>
      Don<p></p>
