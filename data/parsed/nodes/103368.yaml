      <p>From the Canada Type info on Wagner Grotesk:<br>
      "This is the elaborate digital version of Edel Grotesque Bold Condensed (also known as Lessing, Reichgrotesk, and Wotan Bold Condensed) a 1914 typeface by Johannes Wagner, which was later adopted by pretty much every European type foundry, exported into the Americas, and used on war propaganda posters on either side of the Atlantic."<br>
      Your wooden type is almost certainly Johannes Wagner's 1914 design. Presumably it is by an Italian foundry. I don't know whether they used one of the German names or created an Italian one. Take your pick for a name from the suggestions by CT and Ryuk or use an appropriate Italian term.<br>
      Don</p>
