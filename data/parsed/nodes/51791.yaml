      <p>I would suggest that this is the flip side of the coin of how  experimental he was. Not every experiment yields fruit, or at least the fruit we expect. That's how I reconcile it or, more properly, explain it. He explored some hypotheses and found them incorrect.</p>
      <p>In the case you cite, he wondered if Uncial forms would be more "natural" for the reading of English, thinking that the Latin forms would be better suited for, well, Latin presumably, and I guess the romance languages..  So he experimented to see if Winchester Uncial would yield revolutionary results in legibility in setting English. It didn't and he said so, but Winchester without the uncial forms is actually a really charming face and he did some great work in Hingham with it. I don't think the digital versions really do it justice.</p>
      <p>Truly, Hrant, WAD was a kindred soul to you. He worried about and was involved in every step of type production; he took careful consideration of legibility AND readability; he wasn't afraid to explore radical ideas (including the abandonment of many chirographic forms). </p>
      <p>[As an aside, weren't uncial forms originally Roman anyway and brought to the British Isles during the Roman occupation? They may have then hit an artistic peak as Insular majascule etc,... but it seems like WAD was really off base on that one.]</p>
    html_clean: |-
