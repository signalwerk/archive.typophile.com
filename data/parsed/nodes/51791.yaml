      <p>My goodness, seven more comments since I started my last post. I can't keep up with you guys.</p>
      <p>Christian, I think it's overstating the case to say that Griffith "struggled to pull him back." WAD was always concerned about the commercial viability of what he did. That didn't stop him from experimenting at all. But he was also always saying to Griff -- You tell me if there's any value in continuing this, or just put it "in the attic" (as he would say).</p>
      <p>Thing is, as evidenced by the Charter and Winchester examples you mentioned, he was always pulling things back out of the attic and dusting off pet ideas, revisiting them again and again. You know . . . so many ideas, so little time.</p>
      <p>But hey, it's a good thing he didn't have to draw every size and style and cast everything all himself, right? Or it might have taken him four years to release one family too ;-)</p>
      <p>-- K.</p>
