      <p>Christian -- Agreed. </p>
      <p>And I think it's fair to say that Griff respected both aspects of Dwiggins equally. He obviously admired WAD's talent and creative impulses. He also respected WAD's analyses and theories. He was often asking WAD's opinion about other faces in production or sending him articles to comment on.</p>
      <p>He did not always agree with all of WAD's theories. (I'm thinking about the long debate regarding approaches to fitting that I alluded to in another thread.) And I think CHG undoubtedly felt that some of WAD's design experiments were pretty outlandish, being a pretty practical man himself. But clearly, he felt that there was great value in having someone relatively unfettered in the MLCo camp doing the equivalent of "R&amp;D." In this regard, I think Griff deserves a lot of credit for being quite visionary.</p>
      <p>-- K.</p>
