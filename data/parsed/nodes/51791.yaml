      <p>Dan (BlueStreak) -- When asked what style I thought should be used here, I had originally thought one of the heavier condensed [newspaper headline] styles. I also thought maybe one of the heavier italics, which get funky and chunky (Cyrus called them "tasty"). But after that rich, chewy Beorcana, I thought in the end that something light and airy might be a nice change, and so I suggested the Light Italic.</p>
      <p>Hrant -- I was being only half-serious (and taking you only half-seriously), thus the smiley. No worries.</p>
      <p>Regarding WAD, I think I would agree with that he was very instinctive in his work. And at the same time, he was very thoughtful. I think his thinking tended to follow his instincts. He could indeed be very right in his instincts and at the same time amazingly off-base in some of his ideas. But that is part of being a great thinker. </p>
      <p>Dwiggins was a complicated mix of thinking and feeling, contemporary urges and historical respect. He even makes fun of himself in this regard through his alter-ego, H. Püterschein. In the Caledonia specimen, in "Notes on the Designer" Dwiggins-as-Püterschein writes about Dwiggins-the-designer, protesting that he is not really very "modern" at all: </p>
      <p>"He creates an illusion of machines. But his machines are a masquerade. There are men inside of them. [. . .] Dwiggins pretends to love steel. He deceives nobody who <em>thinks</em> steel. He deceives his friends -- Victorians like himself. He does not deceive <em>me</em>. . . . Dwiggins loves the forms of his youth -- split-rail fences, the dust of the road, shady farm-lanes, hills, clouds, sunshine, rain, a simple breed of semi-barbaric rural morons -- all the sentimental hogwash of the days when he was young."</p>
      <p>He was a complicated and contradictory man.</p>
