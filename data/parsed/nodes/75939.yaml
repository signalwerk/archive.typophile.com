    <p>Not sure if this has been posted here yet, but Lynda.com has recently put up a video profile of Doyald Young (about 38 minutes long). It's pretty good, and includes a segment shot at TypeCon in L.A. this year when Doyald received the SOTA award. I saw quite a few familiar faces in the background. Unfortunately, you need a Lynda.com account to view it (except for the intro segment). Here's a link:</p>
