    votes: null
    html: |-
      <p>@typodermic</p>
      <p>A lot of <a href="http://fontspring.com" rel="nofollow">Fontspring</a> grew out of and was predicted by my article <a href="http://readableweb.com/an-open-letter-to-retail-font-vendors/" rel="nofollow"><strong>An Open Letter To Retail Font Vendors</strong></a>. Right down to the obfuscated specimen pages.<br>
      (I know this also because Ethan Dunham told me so, essentially. And I've actually gotten emails from others assuming I'm involved with the site!)<br>
      Fontspring is a first generation peek into the future of retail fonts on and for the web. I've got quibbles about presentation, but the raw materials are all there.</p>
      <p>Some thoughts:</p>
      <p><em>But the remote rendering aspect of FLIR concerns me.</em></p>
      <p>On FLIR:</p>
      <p>1) I believe it can be set up so the font file is *not* exposed. In fact, that's my impression of how it's usually done. The font file is protected from calls outside the server. Invisible to the outside. I'm a lot busy right now, but I'll look soon and get a definitive answer. It's all open source. Anybody else have that info?<br>
      2) FLIR looks too good to be true and so it mostly isn't. Text-as-images are almost always static content. There's no point in having the server thrash around creating text-as-images on the fly. It's too costly and, except in special circumstances, plain dumb. The technology's been around quite awhile now without a massive outbreak of sites designed with FLIR. And there won't be. But it *is* yet another fallback mechanism and there's too few tools available to summarily dismiss any of them.</p>
      <p>Bottom line: I would permit FLIR under the condition that the font files are inaccessible. Or, as you put it, "not directly linkable". No URL to bring it to you on a silver platter. (Since they're installable TTFs and OTFs and that's the big bugaboo.)</p>
      <p><em>I'll let the users determine whether or not a particular embedding scheme should live or die. Cufon doesn't put my fonts at any more risk than EOT did so it stays.</em></p>
      <p>Absolutely. I understand Ralf's point but I don't think EULA's are about telling customers what's a good web design practice and what isn't.</p>
      <p>Lastly, as John Hudson suggested on another thread, I would seriously consider re-naming fonts being offered for use with @font-face with a suffix of some kind. "Web" or "Screen" or somesuch to carve them out and away from those fonts designed and marketed for print. Good for consumers, good for type designers, too, I think.<br>
      Separate (yet related) products for separate purposes.</p>
      <p>rich</p>
