    html: |-
      <p>Hello everyone.  A friend pointed me to this thread because you are discussing FLIR pretty heavily here, and being the author of FLIR, I wanted to chime in.</p>
      <p>First, @typodermic<br>
      <em>I checked out a bunch of sites in the FLIR forum's showcase section. I won't say exactly what I did but with many sites I was easily able to download the default fonts which are included with FLIR.</em></p>
      <p>The fonts can be placed anywhere on your server (including outside of the web root).   This is a single line change in the config.  The only reason you were able to download these fonts is because you already knew they existed (and knew the filenames).  These fonts are *NOT* the fonts the user uploaded themselves with their folder.  Just to clear this up, you were not able to get a directory listing of all the fonts that a user has uploaded unless the server was configured to ignore index.html.  </p>
      <p>To say this a different way, if I uploaded my-font289.otf to my fonts directory (in my web root), you would have to be able to guess that the file is named my-font289.otf in order to be able to download it.</p>
      <p>Access to this folder can also be limited with .htaccess which I will be including in a future release for those that don't have the skill set to move the folder outside their web root or write their own.</p>
      <p>===</p>
      <p>@All the foundries and typeface designers out there, in this thread and beyond:</p>
      <p>I apologize in advance. Some may consider this off-topic from the OP, but I figured this was as good a place as any to speak directly to you guys.  If any mod as a problem, feel free to fork it onto a new thread.  (Also, please ignore any ramblings or things that don't make sense, I've been up all night working on some random thing ;] )</p>
      <p>With the development of font-face, I thought that we, as a community of web and typeface designers, were finally on our way to getting this whole mess of web fonts settled.  After reading this thread, it is obvious that I was wrong, and that is what prompted me to write this.</p>
      <p>So let's call this my personal plea to you.  </p>
      <p>I'm not a web browser manufacturer or anyone else all that important.  I've only made a script that I found useful, and then gave it to other people to use.  I'm really just someone who wants to be able to use your products.  I need to use your products.  I like your products.  And I am willing purchase what you are selling, if only you would sell it to me.</p>
      <p>Please, please get rid of these costly "font-face" and "embedding" licenses.  I am on me hands and knees begging you to stop demanding all sorts of pointless encryption schemes that only serve to make using your artwork more difficult.  </p>
      <p>The web is not your enemy. It is an ENORMOUS new market for you to break into. Sure, your font will get downloaded by some college kid somewhere and used on their flyer, or maybe it would even be outright pirated by greedy people for personal gain.  There is no way to prevent this from happening even now.</p>
      <p>Just like the music, movie, stock photography, and book industries (and many others) have already found out:  </p>
      <p>The web is scary at first -- it is different -- it might even require a change to the way things are done.  But, as these industries have already demonstrated, it can become very profitable once the fighting stops and the leap is finally made.  The same mistake being made in the typeface industry has already been made by so many other industries -- looking at a pirated font file as a lost sale.  This is not the case.  That person who is stealing your font file probably wouldn't have paid for it in the first place and in trying to keep them from doing so is being done to the detriment of countless potential customers.  </p>
      <p>I want to keep this short (I've already failed), so just to summarize: Let us (web designers and developers), have easy access to buy and implement fonts -- at the same price as we would otherwise pay to purchase and Photoshop all the headers on our sites.  Let us have this ability and we will use it.  I promise you, we will in numbers that will make you -- and your industry -- very happy. </p>
      <p>Please stop fighting us.  We are not your enemy.  We would like to be your customer.</p>
      <p>I welcome any kind of comments to my email -- <a href="mailto:cory.mawhorter@ephective.com">cory.mawhorter@ephective.com</a> -- and would be happy to discuss the subject with any foundries or anyone else.</p>
    html_clean: |-
