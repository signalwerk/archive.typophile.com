      <p>@typodermic</p>
      <p><em>I'm supposed to get behind every half-baked font embedding scheme that gets slapped together?</em></p>
      <p>Not saying that. (Actually I was just testing to see if you knew what Nancy Reagan's famous tagline was.) ;)</p>
      <p>What I would like you and every font designer to do is try to see things from the point of view of the guy on the other side of the "Buy Now" button.<br>
      He's got a job to do. You can either let him do it without FUD or not.</p>
      <p>For instance, the license on the new <a href="http://fontspring.com" rel="nofollow">Fontspring</a> site allows @font-face linking but not Cufón. This is nuts. In many instances, Cufón is a perfect fallback for platforms and user agents that don't support @font-face. It's particularly adept with headings and logotype.<br>
      The JavaScript data in the Cufón file with the font outlines is, if anything, far more secure than the linked font file. (In that it doesn't have its own URL, and reconstituting it back into anything resembling an installable font is beyond the capabilities of anyone but an expert. Certainly not worth the time.)</p>
      <p>but anyway, that said, I find all this, right now, a little beside the point. I don't know how anybody looking to buy a font for web use can do so unless they're shown an in-browser  specimen sheet that allows them to accurately assess the look and overall behavior of the font. (Tracking, kerning, etc, at each pixel size.)<br>
      I have yet to see that and Fontspring's in-browser specimens miss that mark, too.</p>
      <p><a href="http://readableweb.com" rel="nofollow">rich</a></p>
