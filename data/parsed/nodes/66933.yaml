    html: |-
      <p><cite>The only reason you were able to download these fonts is because you already knew they existed (and knew the filenames).</cite></p>
      <p>It didn't take a lot of figuring out. If someone can identify a font, they don't need to take a lot of guesses to figure out the filename. For example: I sell a font called Soap. Not surprisingly, it's either soap.otf or soap.ttf. Just about every site I checked kept their fonts in a rather obviously named subfolder. The quickstart guide doesn't recommend that the fonts be kept out the the HTML tree. Almost everyone called the main folder somethign very obvious . . . I did too when I was testing. Regardless, the parent to the fonder containing the fonts is plainly shown in the page source as well. As for the sub-subfolder, I could only find one site that didn't use the default folder name. Yes, someone could add their own security but most people do the default . . . apparently.</p>
      <p>My embedding/linking requirement is that fonts can't easily be downloaded from a URL. It's not that crazy of a requirement. FLIR qualifies as "easily" because I tried it and it was very easy. I'm not technically adept . . . it took me an hour and a half just to install FLIR, but it only took seconds to figure out the folder path.</p>
      <p>It's not just a matter of people taking the font for free. There are lots of ways to do that. It's having honest site owners, installing FLIR and unknowingly posting fonts which can be directly downloaded with an easily guessed URL.</p>
      <p>All it really takes is a few spare minutes correct guess at a font file name. Not only do you get a free font but you also get an URL you can share or even remotely @font-face link to. All because the creator of said embedding scheme didn't consider adding any security whatsoever.</p>
      <p>One of Fontspring's services is to generate @font-face ready typefaces which, among a few other things generates a random filename. I tested one of my fonts which had been run through Fontspring's  @font-face system and it worked with FLIR: no problem. So there you go. My solution will be to require that the obfuscated font be used for FLIR. The price for use on a single domain is exactly the same price as a regular font license so it should be okay.</p>
      <p>I like font hacks and admire anyone who tries to innovate. I wish that those who write font hacks had the foresight to make an attempt at keeping the fonts at least a little bit safer from direct downloading. At least safer than setting the default to an easily guessable subfolder of a folder which is shown in the page source.</p>
