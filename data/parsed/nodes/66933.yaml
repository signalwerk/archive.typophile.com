      <p><cite> How's WOFF for security?</cite></p>
      <p>It's got a different wrapper, so a WOFF font isn't directly usable as a desktop font without first being converted.</p>
      <p>It also has some optional metadata fields so people can spell out what is okay to do with the font. But there's nothing that actually stops somebody else from just re-using the same WOFF font somewhere else; the spec specifically says no user agent is required to do anything differently baesd on metadata, it's purely informative. Informational, but not enforecement.</p>
      <p>Regards,</p>
      <p>T</p>
