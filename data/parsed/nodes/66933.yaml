      <p>Rich, it seems to me that what you have done is to produce an EOT-creation tool that is easier to use that WEFT. Now, for sure, the relative complexity of WEFT is one reason why EOT never took off in the decade in which it has existed as the @font-face implementation in IE, but it's hardly the most significant reason.</p>
      <p>I don't understand why you have made a tool that avoids the (to other browsers) contentious URL-binding aspect of EOT while implementing the equally contentious patented compression. The latter, as well as your commentary, makes it clear that EOTFAST targets IE only, since only IE supports this compression. But IE also supports URL binding, so why have you disabled that?</p>
