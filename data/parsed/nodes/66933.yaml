    html: |-
      <p>@dberlow</p>
      <p>&gt;Rich, what does EOTFast do when it meets a font with an embedding bit IE does not like?<br>
      In version 1.0, it converts the font into an EOT and then that EOT does not work in IE because IE itself declines to load it. This will happen if the embedding is set to "restricted". Whether the EOT is working can be immediately confirmed using the EOT Test page that's a part of the package. Although the test page will not tell you what the nature of the problem is.<br>
      In version 2.0 (in Beta), there are user alerts as the conversions take place, telling you exactly what potential problem(s) there might be and restricted embedding is one of them. This is a stop error. No conversion. No point in allowing it to go forward - IE won't load the file.<br>
      I considered the idea of checking for a vendor ID of "FBI" and then changing the permissions to allow for embedding but decided against it. Instead there's just a pop up saying, "Google: 'Fonts NBC'". (Just teasing, David.)</p>
      <p>EOTFAST is about assisting in the creation of working EOT files. No more, no less.</p>
      <p>That answer your question?</p>
      <p>rich</p>
