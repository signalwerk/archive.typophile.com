      <p>I've been looking into FLIR. It violates <a href="http://www.typodermic.com/license.html" rel="nofollow">my EULA</a> and probably most others.</p>
      <p>"You may not provide the font or make it accessible to any other third parties."</p>
      <p>FLIR, by default has fonts in a subfolder called "fonts". It wouldn't take much imagination to go to a site that used FLIR, figure out the font names and take a few guesses at the filename. If your first guess is whatever.com/fonts/fontname.ttf you've got a font. So, until by default, the fonts are protected from direct downloading, I'm recommending not allowing FLIR use. Perhaps users could use set up a protected folder or something but unless it's done by default in FLIR, I'll assume that few people will.</p>
      <p>Another problem with FLIR is that it's easy to copy a line from the page source render the font to another site. Let's say you find a site that's using a font you like. You can have that site render headlines for your own site. It's not a nice thing to do and it's a drain on the host site's CPU and bandwidth but it can be done.</p>
      <p>I'm saying no to FLIR unless they can fix both of these concerns. As it is now, it's just as insecure as bare @font-face linking.</p>
