      <p>Cory, the key benefit of WOFF (or any wrapper format for web fonts) is that it makes a distinction at the licensing and deliverable level between a desktop font and a web font.</p>
      <p><em>...with a bit of easily breakable DRM thrown in to make you guys feel good.</em></p>
      <p>If you'd followed the W3C font list discussion, you'd know that there is explicitly <em>no</em> DRM at all in WOFF, so talking about WOFF in terms of DRM makes no sense at all. What there is in WOFF is optional metadata. There is no obligation on browser agents to do anything with this data; hence, it doesn't constitute anything like DRM. You would also know that none of the font makers who support WOFF have ever imagined that this wrapper protected their IP against deliberate theft and unlicensed exploitation. Rather, the wrapper protects against <em>casual misuse</em> of web fonts as desktop fonts and provides mechanisms, including use of metadata, to help font vendors and their customers who do want to respect licenses.</p>
