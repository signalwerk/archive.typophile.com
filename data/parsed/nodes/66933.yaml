    html: |-
      <p>The site is  up and the product available for download: <a href="http://eotfast.com" rel="nofollow">EOTFAST</a><br>
      EOTFAST is a utility for creating natively compressed EOT files for use with any domain. There are no root string restrictions, as with Microsoft WEFT.<br>
      Utilities like Microsoft WEFT, ttf2eot, the Font Squirrel EOT generator, and Ascender's tool for EOT "Lite" are now obsolete.<br>
      Savings in file size typically range from 45% to 70%.<br>
      For example, a first-rate screen font like Droid Serif starts out at 169kb as a TTF with the full character set but as an EOTFAST file it weighs in at only 80kb. With still the full character set. Compression is <em>lossless</em>.<br>
      Please stop by the site to check it out. Further announcements will appear in various forums in the coming days.<br>
      The documentation contains very useful information for font designers looking to prepare their fonts for use on the web.</p>
      <p>The download package also contains a HTML "EOT File Integrity Test" page and a helpful "fallback" test font. </p>
      <p><a href="http://eotfast.com" rel="nofollow">EOTFAST</a> is a must-have for anyone looking to use @font-face web fonts today or for years to come - for as long as Internet Explorer has a substantial user-base.<br>
      Version 2.0 is already in work. I'm using a Beta of it right now. And as soon as certain technical issues are scoped out, conversion from TTF to EOT using EOTFAST will probably appear as an online service, as well.</p>
      <p>EOTFAST works to deliver web fonts to half a billion IE users today - not in some distant the future.<br>
      I like the WOFF format but it has a bit of catching up to do now, with EOTFAST.</p>
      <p>Rich</p>
