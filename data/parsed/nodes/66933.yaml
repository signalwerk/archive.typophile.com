      <p>Richard wrote: <em>... Ascender's tool for EOT "Lite" are now obsolete.</em></p>
      <p>This may be just marketing-speak, but in case it's not: Are you sure you understood the purpose of the EOT Lite proposal? It didn't leave out compression because it couldn't be implemented, but to allow other browser vendors to implement EOT support without any patent issues.</p>
