      <p>Sorry, I don't follow. </p>
      <p>To elaborate - I buy a one-seat license, I take the .otf and stick it on a server (assuming I have one, or I buy a five-seat license and copy .otf to five servers), then I start one process and make it service trivial FIFO queue of rendering requests from the web server. That's it. Unless there is a licensing clause that prohibits this specific setup, I am well within licensing requirements. The font file is never used by more than one CPU at any given moment.</p>
