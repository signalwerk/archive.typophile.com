      <p><cite>Can you elaborate what you mean by "work with font designers" exactly…</cite></p>
      <p>That means developing and using technology that works with licensing that font designers find acceptable instead of cooking up hacks designed to exploit perceived loopholes in licensing.</p>
      <p><cite>…and why existing fees are suddenly not "appropriate"?</cite></p>
      <p>Because they are my fonts any I want more money. </p>
      <p>Designers are not entitled to cheap fonts any more than they are to stock art, web hosting, software, etc.. Paying for the materials used in commercial work is not a new concept. Designers have literally been doing this for thousands of years. Your client is making money off their site. You are making money by creating the site. I should be able to make money when my work gets used in the site. There is no reason a professional web designer/developer charging a hefty hourly fee cannot license a font and pass that cost on to the client so that the designer who created the font can afford to eat. Instead of wasting your time trying to cook up the web font systems that do not require any spending just buy a license and charge it to the client with a markup or a time charge; <em>just like you would do for every other aspect of your job.</em></p>
