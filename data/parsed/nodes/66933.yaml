      <p>@davidberlow<br>
      <em>...an interesting question from someone publishing a DMCA-violating "product".</em></p>
      <p>You must have me confused with the Mozilla Foundation, or Apple, or Google. Can't you keep us titans of the industry straight?</p>
      <p>@johnhudson</p>
      <p>Here's the sales copy from Fontshop - anybody tuning in can use their own built-in BS detector and judge for themselves:</p>
      <p><em>They work on most major browsers. Web FontFonts are delivered in EOT Lite and WOFF, the two formats supported by the most commonly used browsers: Internet Explorer® and Firefox®, covering more than 90% of all web visitors. We expect other browsers to join in implementing WOFF soon. A free Typekit hosting option extends compatibility to Safari® and Chrome® users.</em></p>
      <p>Nice weasels. Couldn't do better myself. Now, if this isn't meant to create the impression that Fontshop is providing, with those two files, a solution that covers 90% of all web visitors, well I'll be darned. Caveat emptor.</p>
      <p>As has been noted already - even at a stretch - one in four "web visitors" will not get the fonts using those two files. If their copy read "most web visitors", I would have nothing to say. But they know 90% is innacurate. And that the true number is unacceptable to prospective customers. This leaves Typekit as the product. (Unless they're hoping to do a Berlow and waiting to see if the customer will convert the WOFF into a TTF and then put the screws to them.)</p>
      <p>The notion that those two formats are a complete solution is bolstered by the following on the 'how it works' page:<br>
      <em>Both formats are delivered with every Web FontFont purchase and can be used without relying on any third-party service.</em></p>
      <p>Is it a bait and switch? Absolutely.</p>
      <p>In the final analysis, there's no getting around one thing: they're selling a product - meaning the EOT and WOFF files - that don't meet any ordinary customer's expectations.</p>
      <p>If you want to parse sentences and make excuses, go ahead.</p>
      <p>There's more I could point out, but I'm past the point where it's interesting.<br>
      Besides, some of it is technical, and I'll deal with that elsewhere.</p>
