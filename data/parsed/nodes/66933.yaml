      <p>I checked out a bunch of sites in the FLIR forum's <a href="http://forums.mawhorter.net/viewforum.php?id=15" rel="nofollow">showcase</a> section. I won't say exactly what I did but with many sites I was easily able to download the default fonts which are included with FLIR. At almost every site I was able to download the README.txt file from the fonts folder. That means I'd be able to download specific fonts if I could guess the correct filename.</p>
      <p>What I still don't know is: is it possible to read the config-flir.php file to figure out the font file name? I tried my own test and I wasn't able to get at the contents of my own php file. I don't need to know how to do it, but is reading the contents of a php, if you know the path and filename from someone else's site a really involved thing or it is kind of hard core? I really have no idea.</p>
      <p>What I'm probably going to do is allow the modified @font-face Fontspring versions to be used with FLIR. That way they'll at least have random filenames. But if the php file can be read, then it'd be easy to figure out the path to the font anyway.</p>
