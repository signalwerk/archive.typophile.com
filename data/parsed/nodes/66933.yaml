      <p>Before you do that, let me release an updated version that prevents direct access to the fonts folder with an .htaccess file.  This will mean that no file will be able to be downloaded from anything in that folder (even if you can guess the filename).  The user will receive a "Forbidden" message when trying.  Let me know if this is not satisfactory, because I'd be happy to change to make it so.</p>
      <p>I'm not sure why a randomly generated filename for font-face is a better solution.  I can just parse the stylesheet and find out the exact filename?  Unless I'm missing something?</p>
      <p>&gt; The price for use on a single domain is exactly the same price as a regular font license so it should be okay.</p>
      <p>I applaud this.  Thank you.</p>
      <p>===</p>
      <p>What is the point of WOFF?  It really seems like a joke from where I'm standing.  It looks like a fancy gzip compression library with a bit of easily breakable DRM thrown in to make you guys feel good.</p>
      <p>WOFF is to the web font world, what taking your shoes off while passing through airport security does for making flights more secure here in the states.  It makes for good theater and gives you a warm feeling inside, but it doesn't actually do anything.</p>
      <p>Anyone who is determined enough to get a font will be able to break WOFF, just like they'd be able to break any other method.  The problem is that at some point, the font has to return to a font to be used by the OS, and it is at this point that it can be grabbed, saved, and reused -- whether it be from a cache file, RAM, or specially crafted software.</p>
      <p>If typeface designers are looking to WOFF, EOT or any other of these technologies as being the holy grail for getting their fonts embedded in a safe way on the web, then they are sadly mistaken.</p>
      <p>If history has taught us anything, DRM is pointless.  Someone is going to break it, and then release a program to make it easy for others to do the same.  The only thing DRM does is make it more difficult for legit users to use your product.  This is the inherent problem with DRM.  In order for the enduser to use it, some bit of software has to turn it from DRM'd file -&gt; Regular file, and if one program can do it, some other program can and save the data locally in the process.  Even the movie industries with all their might cannot release a DVD with DRM that isn't easily broken.</p>
      <p>I am going to say with a certainty -- right now, and forever -- that there is absolutely no way to protect your IP from theft.  Period.  The only thing you are doing by pursuing these technologies is making it more difficult for legit users to implement your fonts.  And the more difficult it is, the less likely it is that I am going to do it -- and I'm happy to not buy your fonts, and make my life easier.</p>
