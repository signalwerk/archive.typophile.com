    html: |-
      <p>Something else I want to point out here is the power of something like FLIR to be applied to numerous web sites. In the case of an individual user and a single site, you’re right in that it’s not really big deal. In fact, the way I license type as of today, I would make more money selling you that FLIR server license than I would selling you a single domain @font-face license. </p>
      <p>But you aren’t the guy who makes it a problem. The problem is that at some point someone who hosts 1,000 web sites on one big server realizes that he can install my fonts, and FLIR or SiFR, and make it available to all 1,000 web sites at no additional charge. Suddenly I’m missing out on a lot of licensing fees no matter how it works out. And maybe it makes more sense for me to write a provision into my EULA that allows something like FLIR or SiFR when limited to single domains. But if I have to tweak my EULA for everything like this that come along, I end up with a big ugly hydra of a EULA. Or I have to just stop using resellers and make all these different options available in an online store. Right now I’m inclined to just keep things real simple and tell people to buy an @font-face license.</p>
