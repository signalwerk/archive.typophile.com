      <p>@typodermic</p>
      <p>WOFF - AFAIK, the quickest and easiest way to create a WOFF file is with the generator on Font Squirrel. However, the WOFF spec allows you to add some labeling data which the generator makes no provision for. There's source code for WOFF and the spec is published, but as yet, no comprehensive desktop tool I'm aware of for going from a fontfile-&gt;WOFF and then from WOFF-&gt;fontfile, and manipulating the discretionary data in between. I'm sure a few font designers have home-grown code for it.<br>
      However, WOFF is only supported in Firefox 3.6 which was just released and it will take some time for users to upgrade and 3.6 to propagate. (I still can't move to it and get all my add-ons to update to my satisfaction.)<br>
      That said, I know for a certainty that desktop tool(s) for working with WOFF are in the queue, it won't be long. Others might know about other options.<br>
      There's links <a href="http://readableweb.com" rel="nofollow" class="link-external">here</a>.</p>
      <p>In a vein similar to WOFF, there's one other valuable tool I'd like you to be aware of, it's a couple of weeks away from release, but I can get you an advance copy and you can begin using it right away. (Dunham knows about it.)<br>
      It's something you and your customers can benefit from immediately.<br>
      I'll send an email to the gmail account listed on your site.</p>
      <p>@dberlow</p>
      <p>&gt;Ain't rocket science<br>
      Manipulating font files ain't rocket science. Tables, some code, anything else?<br>
      Everything has a learning curve, but provided that decent educational materials exist, it usually doesn't take long for you to get the essentials clear enough in your head to, at least, make intelligent choices. To get to the place where you at least know what you don't know. Of course, as in any field, there are those with exceptional talent for it. But the basics are well within the grasp of the average web designer.</p>
      <p>With <em>creating</em> fonts, there is an element reminiscent of ballistics involved. There is the "co-efficient" that still must be provided by the human eye.<br>
      Still no substitute. </p>
      <p>rich</p>
