      <p>@sii</p>
      <p>You don't know what to make of this post and I don't know what to make of your comment.</p>
      <p>&gt;It’s kind of like writing a letter to the SciFi channel asking them<br>
      &gt;not to cancel Battlestar Galactica.</p>
      <p>This means what? If it means that the people commenting here are out of touch, I find that offensive - although I don't believe you mean it to be - and, considering your position and who you work for, rather disturbing. Really.</p>
      <p>&gt;The war is over. The browser makers and the font makers have voted,<br>
      &gt;and in five or six years we will hopefully see the majority of installed<br>
      &gt;browsers supporting WOFF.</p>
      <p>This vote took place when? Must have missed it. And what does the majority of browsers supporting WOFF have to do with anything? Please explain.</p>
      <p>&gt;Between now and then there will be interim solutions, best served by<br>
      &gt;folks like Typekit who provide “fonts as a service” rather than the<br>
      &gt;random, often hack-like, solutions currently being promoted.</p>
      <p>Says you. If you really believe this, you're scaring me. Have you been watching <em>Caprica</em>?</p>
      <p>&gt;As to font pricing and web specific licenses, I don’t think any level<br>
      &gt;of pleading from web designers (or the companies, large and small<br>
      &gt;who will end up paying for the font licenses) will really make<br>
      &gt;much difference – the market will decide.</p>
      <p>There doesn't seem to any "pleading" necessary. If someone doesn't want to license to me under terms that I can live with, I just go elsewhere, that's all. Do you think I won't find what I need?<br>
      And Sii, it's "the companies, large and small who will end up paying for the font licenses" that comprise the "market" that you say "will decide". You're running around in circles. The browser makers and font makers have decided but the market will decide on their decision. Huh?</p>
      <p>I'm glad you like Typekit. I like them, too. Both the guys behind it personally and as a service. But everything has its advantages and disadvantages. One disadvantage to Typekit is that it provides an avenue whereby font makers can say proudly that they are "licensing" for use on the web without really licensing for use on the web. As you can see from the comments here and a quick visit to Fontspring where, (at last count - it's more every day) Ethan Dunham has twenty one font makers who seem to be casting their votes some other way.<br>
      Therefore, as of right now, I am formally demanding a recount.<br>
      It seems Battlestar is back on.</p>
      <p>The other downside to Typekit is that it postpones, among web designers, the learning about fonts and the way browsers utilize them, that must eventually take place.<br>
      There's no way around it. Web designers will have to learn some things they don't currently know about fonts. Ain't rocket science.</p>
      <p>rich</p>
