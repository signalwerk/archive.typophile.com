      <p>Rich: <em>Unless I've missed something fundamental, you'll see I'm right.</em></p>
      <p>I know that you're wrong, so you must have missed something fundamental. Actually, I'm having a hard time keeping track of how many fundamental things you missed. How about this for starters: we're at a transitional moment in which new licensing businesses are coming along in the midst of inconsistent format support. There is absolutely no obligation on any vendor to provide their fonts in all supported formats in all browsers, and if, in light of the inconsistent support, companies try to provide temporary alternatives to customers who feel they <em>need</em> to implement their designs across more browsers than support the formats offered by those vendors -- any my own customers have indicated that they feel no such need --, that shouldn't be grounds for suggesting that such companies are affecting a con. Frankly, if I were FontShop, I'd be asking my lawyers to review your last post for a possible libel suit, since you have accused them of something that you acknowledge is ‘generally illegal’.</p>
      <p>Not long ago, you were jumping up and down demanding that font vendors start licensing fonts for the web and to make clear in what formats they intended to do so, despite the fact that I, for one, thought ‘What's the rush? The browser support isn't where it needs to be yet.’ Now, one of the most respected and successful font vendors is doing just what you demanded, and you are accusing them of doing something both else and nefarious.</p>
      <p>This seems to me a grossly unfair detraction.</p>
