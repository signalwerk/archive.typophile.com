      <p><cite>Cufon is just an awkward JavaScript hack.</cite></p>
      <p>There may be cases where that's exactly what's needed; supporting older or low tech browsers . . . or a use you haven't thought of. Is your dislike of Cufon really a good reason to tell a customer "no you can't use my font for that"? There's a difference between not recommending Cufon and forbidding people from using it.</p>
      <p>I'll let the users determine whether or not a particular embedding scheme should live or die. Cufon doesn't put my fonts at any more risk than EOT did so it stays.</p>
      <p>As long as my "not directly linkable" requirement is met they can create a new web embedding scheme every week. Bring 'em on.</p>
      <p>But the remote rendering aspect of FLIR concerns me. Even if someone doesn't take a copy of the font, they can have another server render the data and send it to their site. AS far as I know it's the only embedding scheme with that particular problem.</p>
