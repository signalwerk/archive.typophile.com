    html: |-
      <p>&gt; <em>It’s you building a machine that does the same thing, over and over, much faster than you could ever hope to.</em></p>
      <p>It is not doing it over and over again. It renders every image exactly once, when it is first requested; and not once per client request.</p>
      <p>&gt; <em>And if my font is part of it, I want my cut.</em></p>
      <p>By all means. I just think that the expectation is that it should be included in a standard licensing fee.</p>
      <p>--</p>
      <p>Just try and understand where all these "hack" technologies came from. Think 6-9-12 months back from today.</p>
      <p>Designer buys the font, it uses it to set a handful of headers on a website. Then he wants to use it more widely, say, for subheaders and blog entry titles or something like that. So he emails the foundry and asks what it would take to use their typeface in an online context. The standard reply is "NOOOOOOO", a more contemporary response is "we are thinking about it" as in "check back in a year". </p>
      <p>Designer still wants to use the font, but he is also respectful of the type designers (remember how he actually <em>bought</em> it and he <em>asked</em> for a web license ?). He understands that foundries are afraid of the Internet and their fonts leaking onto it in their native formats. So he sits down and considers his options. </p>
      <p>First is to render on the server (best option really, the font file stays private, the file usage is tightly controlled and falls under simultaneous usage restrictions), second is to render on the client, but with the font data obscured, stripped down or made unfit for copying in some other way.  Former translates to FLIR, latter - to Cufon. </p>
      <p>Note how the driving factor here is the conservatism and rigidness of the foundries and nothing else. There is exactly one type of license available to the designer and he is forced to get creative within its confines. It has very little to do with unwillingness to pay more money to the foundry, and far more with foundry's own lack of interest in collecting these money.</p>
