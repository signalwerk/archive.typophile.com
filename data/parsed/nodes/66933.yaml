    html: |-
      <p>Great idea, Josef. I went through Ralff's page few months ago and I found it to be quite light on information, so I ended up emailing a handful of foundries and individual type designers asking about Cufon licensing. </p>
      <p>I don't remember the exact list, but Exljbris, Darden Studio, Process Type Foundry, Paragraph, H&amp;FJ, Dalton-Maag, Linotype and Wilton Type Foundry were on it. Note that I was asking only what the licensing conditions for the Cufon use would be, and not with sIFR or other options.</p>
      <p>Process and H&amp;FJ were a no-go. Or rather like "La-la-la... we can't hear you... strictly forbidden, STRICTLY !".</p>
      <p>Paragraph, Wilton were a no-go as well, but said they were "considering it".</p>
      <p>Exljbris and Darden Studio are OK with no additional strings attached.</p>
      <p>Dalton-Maag are OK, but you need to ask for it explicitly. Their existing license does not allow for Cufon, and there are additional requirements for high-traffic websites.</p>
      <p>Linotype <em>appears</em> to be OK, but requires an additional paid license. I had a really odd conversation with their support, which is in fact still ongoing. In first reply they merely said "we offer web licenses which offer this usage", "this" referring to Cufon. That's it. And asked for a mailing (!) address to send me an invoice. No mention of the fees, restrictions, etc. I replied asking for a balpark estimate of fees, and they replied that they needed to know the exact typeface and asked for mailing address again... you guessed it... for an invoice. I really don't know what is wrong with them.</p>
      <p>--</p>
      <p>Another interesting list to build would be the typefaces seen used with sIFR/Cufon/FLIRin the wild, on high-profile and presumably properly licensed websites. I know I've seen Avenir, Gotham (!) and Akkurat.</p>
      <p>--</p>
      <p>Lastly, can I ask why you have FLIR listed as No in several lines in your table? How the heck can it be prohibited if the font use by the FLIR's server component falls squarely under a typical EULA?</p>
