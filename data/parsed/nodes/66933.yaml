      <p>@Richard: It may have been a simple mistake as well. I agree it's misleading, but it could be easily corrected.</p>
      <p>Like John, I don't assume that offering Web FontFont licensing directly (from which FontShop gets all the revenue, and owns the customer relationship) is intended by FontShop as a bait-and-switch to get customers to sign up in a paying relationship with TypeKit (in which FontShop gets some smaller cut of revenue, and somebody else owns the customer relationship).</p>
      <p>The direct Web licensing of fonts, with a one-time fee and a sliding scale of that fee based on volume, is simply a different model than web font service rental. The web font biz is in a wild west frontier mode right now, where people are trying to set up new settlements all over the place, and we don't know which ones will attract settlers. In 50 internet years (7 real years), will it be Deadwood, Los Angeles or San Francisco that becomes the thriving metropolis? Quite probably multiple things will succeed, and almost certainly not all of them will.</p>
      <p>Cheers,</p>
      <p>T</p>
