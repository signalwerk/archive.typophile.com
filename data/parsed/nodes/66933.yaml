    html: |-
      <p>&gt;My solution will be to require that the obfuscated font be used for FLIR.</p>
      <p>Renaming!<br>
      q4r-Tc81G.ttf<br>
      What a concept. Works for me, Ray. And if I was using FLIR, I wouldn't want anybody using up my server resources and bandwidth and taking fonts I've payed good money for and, in some cases, spent considerable time sub-setting and improving and converting.<br>
      No reasonable site owner or webmaster is going to argue with the logic of this - it goes beyond "protect my font from unlicensed distribution".<br>
      It's win/win and should be presented that way.</p>
      <p>Just some thoughts regarding the change we're just beginning to go through for whatever bearing it might have on licensing:</p>
      <p>For the past fifteen years web designers have been in prison, typographically speaking. Prison "Web Safe". Their meals have been cooked for them, their clothes cleaned for them, every aspect regulated. No thought required.<br>
      Soon, they'll have to deal with freedom. It *will* bring a change of consciousness about fonts. Fonts will be seen differently than they are today - as resources that you need to know something about to use effectively.<br>
      Today, fonts are this black-box thing you access by writing: "font-family: verdana, sans-serif;"<br>
      Today, the average web designer has no concept of "font-family". Font-family is synonymous with "the name of the font". The idea that italic and bold reside in different files doesn't even occur to anybody - why should it? It's been taken care of for them by the OS, out of view, for fifteen years. When it suddenly becomes <em>their</em> responsibility, it's completely different.<br>
      I could go on and on in this vein.<br>
      It's going to be very interesting to see how designers deal with the responsibility.<br>
      And when it *is* their responsibility, they won't treat those resources casually.</p>
      <p>rich</p>
