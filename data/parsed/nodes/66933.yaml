      <p>First, more technical news:<br>
      Garrick Van Buren has converted Kernest's entire font library using <a href="http://eotfast.com" rel="nofollow">EOTFAST</a> plus - and this one has *me* amazed and astounded - he reports having found an answer to the problems of reliable gzip delivery for fonts of any kind.<br>
      <a href="http://blog.kernest.com/archive/kernest-hosted-fonts-now-even-more-gzippy-er/" rel="nofollow">More Gzipper Than Ever</a><br>
      Problems with gzip discussed here:<br>
      <a href="http://www.stevesouders.com/blog/2009/11/11/whos-not-getting-gzip/" rel="nofollow">Who's Not Getting Gzip</a></p>
      <p>@jens<br>
      &gt;This may be just marketing-speak<br>
      No. I'll write sales puffery like anybody else, of course, but something quite that bold, no.<br>
      They're obsolete.<br>
      &gt;to allow other browser vendors to implement EOT support without any patent issues<br>
      Correct as regards EOT Lite. But frankly, EOT Lite seems dead in the water as part of a W3C standard. It's mentioned as an aside in the current web fonts charter proposal.<br>
      EOT is the old soldier that we'll have to care for until quietly fading away.<br>
      I do not know exactly what is planned for IE9 other than continued support for EOT as a backwards-compatibility legacy thing.<br>
      "Don't break the web", meaning, as far as possible, continuing to provide support for existing web pages is an article of faith for the IE devs. People can bitch about conditional comments and versioning strings as much as they want but there'd be a lot more bitching if IE didn't have them. If Firefox pushes out an upgrade and there's a regression in the code, what's the problem? Not a lot. If it was IE, you might not be able to make a withdrawal from your bank. There's a huge disparity in the level of responsibility required which, unfortunately, a lot of people in the web community don't get. I'm interested in seeing if there's any unwanted side effects in the European market in the short term. Interesting.<br>
      &gt;Where can I find the source code?<br>
      It will be posted but I can't tell you exactly when. On Github or Sourceforge or somewhere. The source for Version 2 will hold much more opportunity for collaboration and I'd rather wait until then. I do feel a responsibility to make sure that the basics are solid, first. I don't know of anybody who's done as much hard research as me and there's a lot more to do, too.<br>
      There will be an announcement and a mailing when that happens.<br>
      In the meantime, the executable is there for the asking. You're welcome. Will you be using WEFT again in the near future?<br>
      &gt;Why? Tools for web font conversion have already existed for some time,<br>
      &gt;for both WOFF and EOT.<br>
      Implementations, man, implementations. Half a billion or more users can benefit from EOT in IE now, today. FF 3.6 was just released so the pool of users who can benefit today from WOFF is indeed small.</p>
      <p>@johnhudson<br>
      &gt;one reason why EOT never took off in the decade in which it has existed as the @font-&gt;face implementation in IE, but it's hardly the most significant reason.<br>
      Oh geez, you've got me singing the song "Turn, Turn, Turn" in my head, now. (Go ahead, all together, now - I'll give you minute...)<br>
      Bandwidth, bandwidth, bandwidth. At the time of what I call "Pax IE" when IE6 ruled the roost with no competition whatsoever, it was still largely a dial-up world. Let's not forget how much has happened in the last five years. In this case IE was ahead of the curve. It happens. Even in Redmond. I know it sounds simplistic, but it was just a case of other web development techniques having a greater priority.<br>
      As far as URL binding etc.... you're leaving me wondering what on earth we were all gnashing our teeth about last year. Was it a dream? ;) Your questions are reasonable, but let me get back to them.</p>
      <p>@stephencoles<br>
      &gt;the future of the web will be seen on many browsers. Support for only IE won't cut it.<br>
      It sure won't. And you can't cut it without IE, either.<br>
      Bottom line: Both EOT and WOFF offer a way to wrap a font file without the encumbrance of root strings and with highly effective compression. In effect, there isn't a whole lot of difference now between the two.<br>
      I have gotten the distinct impression that a case was being made that IE's @font-face implementation was in some way fatally flawed, and that the font design community therefore had no choice but to wait until IE caught up before offering licenses under WOFF while avoiding EOT and the huge user-base that can benefit from it.<br>
      Now, in light of EOTFAST, what's the diff?<br>
      There will be convenient, easy to use tools for both formats.</p>
