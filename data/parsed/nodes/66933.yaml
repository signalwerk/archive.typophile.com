      <p>&gt;<em>Not sure I fully understand what FLIR is. Looks like fonts are installed on a server. A Typical EULA allows 5 users. That seems a little limited if you view each Web page visitor a user.</em></p>
      <p>You are forgetting that every image returned by FLIR server at client's request needs to be rendered only once and then it can be served from the server-side image cache. Under this arrangement even a 1 user limit is quite practical. The only requirement is to ensure that no more than 5 images are <em>rendered</em> at the same time, which is trivial to do and not limiting at all.</p>
