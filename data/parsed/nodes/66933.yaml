      <p>So Procol Harum is bumped from the top of the charts by the old union song "Which Are You On" ;)</p>
      <p>But what's the point of CFF? I note that none of the examples, except for the "Daring Fireball", are intended for reading on screen, being either too big or the type selection is too weird. Is someone out to improve wysiwyg performance?</p>
      <p>The readable "Daring Fireball" is most assuredly <strong>not</strong> a comparison of CFF being rendered, is it? The left is way too good for CFF, it looks like a live web site. The right is 1/2 way from the left side towards Quartz, (i.e. wilderness training for readers). </p>
      <p>Is there a place in the machine I can kick the side and get it a little darker?</p>
      <p>Also, not just rendering changes are hap'nin, in John's blowups of Sergey's, there is a huge difference between the forms of m in the regular on either side. Different fonts. Is this the same data, the same size and untampered? Also note, the left's word "dolore" the conflict between l.c. o's vs. between the two o's on the right. This signals the need for a White Paper on it's hinting interpretation, or is it just y hints now?</p>
      <p>It's probably waaaaaay too late for scientific testing, but if you want to see what it'll look like, you've got a browser, are willing to set de browser to Actual Size, forsaking html scaling for my neat little buttons — you can always bounce it off <a href="http://www.fontbureau.com/test/franky/" rel="nofollow">perfection</a> in all possible weights to the 1/2 pixel ;)</p>
      <p>Cheers!</p>
