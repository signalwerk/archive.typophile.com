      <p>Jeez, have you got one too many espresso shots this morning? This is not about "loopholes in licensing". </p>
      <p>The state of affairs is that I pay $40 per weight, get the font, render an image in Photoshop and stick it on a website. I assume you do not have a problem with this.</p>
      <p>FLIR does the exact same thing. It does not add any value to the website, it does not generate more money to the site's owner. All it does is it simplifies the life of a web designer. And not by much mind you, it saves may be... what?... 2 hours of work. If that.</p>
      <p>The designer is not sitting there and thinking how to <em>pay</em> less. He is thinking how to <em>do</em> less. That's what FLIR &amp; Co. are about.</p>
      <p>I doubt many designers are cheap enough to be against web-only licensing. The biggest issue at the moment is that @font-face is not quite there yet. Its rendering quality varies too greatly between the browsers and OSes to be satisfactory. That's one. Hosted solutions like TypeKit are not a feasible option in many cases, because they create external dependencies. That's two. All this is going to be sorted out, but it will take time. </p>
      <p>Meanwhile "hacks" are the practical option. They work, and they work well. If you feel like charging a fee to allow FLIR/Cufon/etc usage - do it then, but I personally feel it is unreasonable.</p>
