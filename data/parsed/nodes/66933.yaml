    html: <p>I’m not really sure what to make of this post. It’s kind of like writing a letter to the SciFi channel asking them not to cancel Battlestar Galactica. The war is over. The browser makers and the font makers have voted, and in five or six years we will hopefully see the majority of installed browsers supporting WOFF. Between now and then there will be interim solutions, best served by folks like Typekit who provide “fonts as a service” rather than the random, often hack-like, solutions currently being promoted. As to font pricing and web specific licenses, I don’t think any level of pleading from web designers (or the companies, large and small who will end up paying for the font licenses) will really make much difference – the market will decide.</p>
