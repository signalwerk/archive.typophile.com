      <p>@thomasphinney</p>
      <p>In keeping with your observations - what Fontshop is doing with the Web FontFonts initiative is called a "bait and switch".<br>
      I've studied the advertising styles of the early to mid 20th century closely and in so doing developed a soft spot for hucksterism like this.<br>
      (It is today, however, generally illegal. <em>If</em> the customer is "baited" to sign on using false claims and then "switched" to something that's going to cost more. I'd have to look closer to see if that's the case here. But I really don't care.)</p>
      <p>Works like this:</p>
      <p>1) First, you suck the customer in with what seems like a perfectly reasonable, even juicy offer. 90% of browsers supported! Specially optimized fonts! (Not sure if there's anywhere to actually preview what they look like in the browser on Fontshop - I couldn't find it.) Anyway, at first, everything looks great.</p>
      <p>2) Turns out there's a catch that was not immediately apparent - in this case its that fonts formatted in EOT and WOFF won't show up in Safari or Chrome. (You mean I can't post the TTF?) Of course, no web designer is going to want that and so the customer is steered to the "free" Typekit hosting option as a solution. (A solution to a problem that was created by the nature of the sales offering in the first place, of course. Wink. Wink.)</p>
      <p>The Typekit hosting service is what's being sold.<br>
      The "Web FontFonts" is just a way to steer the customers to it.<br>
      (Check close and think about it. Unless I've missed something fundamental, you'll see I'm right.)</p>
      <p>Of course, the more trustworthy the source of the offer - Fontshop! - the less likely the customer will be on the lookout for gotchas, so the better it works.</p>
      <p>Slick! If Bryan Mason thought of this - Bryan my hat is off.<br>
      I thought this kind of marketing went out with the aluminimum siding salesmen characterized in Barry Levinson's classic 1987 comedy "Tin Men" but I guess there's a revival going on.</p>
      <p>I'm really starting to like the font business a lot.</p>
      <p>Rich</p>
