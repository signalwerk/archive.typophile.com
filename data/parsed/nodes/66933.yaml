      <p><em>1) I believe it can be set up so the font file is *not* exposed. In fact, that's my impression of how it's usually done. The font file is protected from calls outside the server. [snip] Anybody else have that info?</em></p>
      <p>Of course it is doable. It is a one-line change even if there is no corresponding <em>configuration</em> setting. If FLIR requires fonts to sit in a website document tree, that's just sloppy implementation on their side, and not a fundamental FLIR requirement.</p>
      <p><em>There's no point in having the server thrash around creating text-as-images on the fly. It's too costly and, except in special circumstances, plain dumb.</em></p>
      <p>Caching, Richard. Server-side image caching :-) Do not re-generate what has been generated already, just serve it from the image cache.</p>
    html_clean: |-
      <p><em>1) I believe it can be set up so the font file is *not* exposed. In fact, that's my impression of how it's usually done. The font file is protected from calls outside the server. [snip] Anybody else have that info?</em></p>
