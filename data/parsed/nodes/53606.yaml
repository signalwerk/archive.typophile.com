    <p>CheapProFonts offers a wide selection of mainly display-fonts with a large character set supporting 65 languages requiring more that the basic A-Z.<br>
    (Check out the long list of supported languages here: <a href="http://www.cheapprofonts.com/Languages" title="http://www.cheapprofonts.com/Languages">http://www.cheapprofonts.com/Languages</a> )</p>
    <p>What I have done is to team up with several well-known freefont designers (like Ray Larabie, Nick Curtis, Brian Kent and Derek Vogelpohl), and use their fonts as a starting point to make updated professional quality multilingual Unicode fonts - and then offer them at a very low price and with very generous licensing terms.<br>
    (Check out the license here: <a href="http://www.cheapprofonts.com/License" title="http://www.cheapprofonts.com/License">http://www.cheapprofonts.com/License</a> )</p>
    <p>I started building the library one year ago, and have managed to rework and release one new font almost every week through 2008! The library is continually expanded with new releases, and new designers. All the reworking is done under agreement with the original designers, and they receive royalties from the sales.<br>
    (Check out a complete overview of the fonts here: <a href="http://www.cheapprofonts.com/ALL_Fonts" title="http://www.cheapprofonts.com/ALL_Fonts">http://www.cheapprofonts.com/ALL_Fonts</a> )</p>
    <p>I hope many "foreign language" users find CheapProFonts a valuable resource for cheap and cheerful display fonts supporting their specific language needs.<br>
    Welcome! :)</p>
    <p>Kind regards</p>
    <p>Roger S. Nelsson<br>
    --<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-1-year_3650.jpg"></div><p></p>
