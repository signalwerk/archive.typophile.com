      <p>Nice one, Florian. Glory, Nimbus Sans is a dead ringer for Helvetica! I don't know anything about the history of Nimbus Sans. Is it an Arial-esque "interpretation" of Helvetica or something? </p>
      <p>As for whether the sample better matches Helvetica or Helvetica Neue, the roundness of the characters and the very shallow descender on the G all say Neue to me.</p>
