    html: |-
      <p>Rather the original Helvetica (not Neue). URW has a Poster version that –&nbsp;regarding proportions and details – appears to be a slightly better match than others; <a href="http://new.myfonts.com/fonts/urw/nimbus-sans/bold/?refby=mfde">Nimbus Sans P Bold</a>.<br>
      In case you need to reproduce the soft edges and don’t want to do it manually, you might like Alte Haas Grotesk. Although I generally  try to avoid such knock-off freebies, it might serve valuably in this particular case.</p>
      <p>Back to the Garamond: again, URW’s <a href="http://new.myfonts.com/fonts/urw/amsterdamer-garamont/?testdrive=custom%3D0%26dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dcustom%26text%3DThe%2520ragazzi%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D32?refby=mfde">Amsterdamer P(oster)</a> seems to be digitized from the same cut.</p>
