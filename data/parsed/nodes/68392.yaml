    votes: null
    html: |-
      <p>Stephen, unlike Arial, Nimbus Sans actually <em>is</em> Helvetica. When digital type was still in its swaddling clothes, URW digitized typefaces for other companies. In return, they obtained the rights to use this data and license these fonts to others. As the original names were trademarked, they only had to come up with pseudonyms – like Nimbus Sans.</p>
      <p>Here’s more information:<br>
      <a href="http://www.typophile.com/node/4573">Deja Vu Helvetica (Research + Identification)</a><br>
      <a href="http://typophile.com/node/49127">Are there differences between Nimbus sans and Helvetica?</a></p>
      <p><cite>all say Neue to me</cite><br>
      … but this is a book cover from 1968, and Neue Helvetica was born in 1983. :-)</p>
