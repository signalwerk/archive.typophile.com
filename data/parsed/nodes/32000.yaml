    html: |-
      <p>To be more specific…</p>
      <p>For example: I want the word ‘shit’ to be replaced by ‘excrement’.</p>
      <p>feature ss02 {<br>
      lookup ss02.pri1 {<br>
      sub [shit] by [excrement];<br>
      } ss02.pri1;<br>
      } ss02;</p>
      <p>This is obvious not the way to go – since Fonlab want me to create two new glyphs ‘shit’ and ‘excrement’. Is there a simple way to make this work?</p>
      <p>Help me please!<br>
      KTKM</p>
      <p>Btw. It didn’t occur to me (until now) that Typophile is performing censorship! Anglo-saxon-american bullshit! Pathetic!</p>
