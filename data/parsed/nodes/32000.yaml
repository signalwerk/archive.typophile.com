    <p>I’m currently working on a typeface in OT-format. Making glyph substitutions for ligatures is easy – but how (if possible) can I make substitutions with entire words that don’t have the same amount of letters? </p>
    <p>I bet there is ‘Python’ mastermind out there!</p>
    <p>Best regards<br>
    KTKM</p>
