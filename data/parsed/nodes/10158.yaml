    date: 2002-01-28T10:37:00
    date_raw: 28 Jan 2002 — 10:37am
    votes: null
    html: "<p>Today Sans is amazing. Somewhat mannered, but still extremely capable. <br> <br>I personally wouldn't call Cronos a copy, but I think it does \"rip off\" some significant innovations from Today. And it doesn't make me happier to see Adobe get a TDC award for it, not to mention a *patent* on it. (But they also got a patent on *Garamond*, so...) <br> <br>Here's something too: <br><a href=\"http://cgm.cs.mcgill.ca/~luc/cronos.html\" target=\"_top\">http://cgm.cs.mcgill.ca/~luc/cronos.html</a> <br> <br>&gt; Slimbach &amp; Co.'s Myriad always seemed like a Frutiger \"appropriation\" to me <br> <br>And to Frutiger, from what I understand. <br> <br>&gt; Today is the most tightly-spaced sans I've ever worked with. <br> <br>That's actually a good thing, even -no, especially- in text setting. The letters have to meld into words (they have to become less letters). <br> <br>I've come to believe that contemporary standards of spacing are too loose. The metal boys couldn't space much tighter than they did - but we can. There is certainly such a thing as too-tight spacing, but Today I feel is just right. <br> <br>And I'll note here that the good readability of Times is due to its very tight spacing - overcoming its deficiencies (which could be attributed to its unintelligent conversion to digital) in terms of lightness and contrastiness. <br> <br>Tight tracking in headlines is largely a matter of taste - but in headlines, largely function. <br> <br>hhp</p>"
    html_clean: "<p>Today Sans is amazing. Somewhat mannered, but still extremely capable. <br> <br>I personally wouldn't call Cronos a copy, but I think it does \"rip off\" some significant innovations from Today. And it doesn't make me happier to see Adobe get a TDC award for it, not to mention a *patent* on it. (But they also got a patent on *Garamond*, so...) <br> <br>Here's something too: <br><a href=\"http://cgm.cs.mcgill.ca/~luc/cronos.html\" target=\"_top\" class=\"link-external\">http://cgm.cs.mcgill.ca/~luc/cronos.html</a> <br> <br>&gt; Slimbach &amp; Co.'s Myriad always seemed like a Frutiger \"appropriation\" to me <br> <br>And to Frutiger, from what I understand. <br> <br>&gt; Today is the most tightly-spaced sans I've ever worked with. <br> <br>That's actually a good thing, even -no, especially- in text setting. The letters have to meld into words (they have to become less letters). <br> <br>I've come to believe that contemporary standards of spacing are too loose. The metal boys couldn't space much tighter than they did - but we can. There is certainly such a thing as too-tight spacing, but Today I feel is just right. <br> <br>And I'll note here that the good readability of Times is due to its very tight spacing - overcoming its deficiencies (which could be attributed to its unintelligent conversion to digital) in terms of lightness and contrastiness. <br> <br>Tight tracking in headlines is largely a matter of taste - but in headlines, largely function. <br> <br>hhp</p>"
