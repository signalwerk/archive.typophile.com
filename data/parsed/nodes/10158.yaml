    html: <p> I agree that something just doesn't feel right. I think that the problem may be in the terminals. Seeing the s with its beaks still intact, for example makes the d etc. look like they need their serifs. Another example would be the c, with its ball. Right now these characters, which basically have escaped modification do make the face feel closer to the serifs than other sans-romans, which is part of the charm of the face. I do think they could be toned back to match the other characters, though. I would definitely try to keep a two story g, for example, but the terminal on the top of the f could be sheared off, or treated differently. </p>
