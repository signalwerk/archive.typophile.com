    html: <p> Thanks to everybody for the hints and tips. <br> <br>There are still no Uppercase and there will not be any until I can make the lowercase look ok, I'll be posting something soon, let me fix a couple of things. <br> <br>The font was born to be a semi version of Caslon, based on many different interpretations of caslon and caslon buch (adobe, Berthold, ITC). <br> <br>The "mission" is making a modern/readable font for (short) body text. Hrant, thanks for the support, I'll sure make sure color and size will fit with caslon's. <br> <br>Thanks also for the links and similarities with other fonts, it helps me check for errors. <br> <br>Marco </p>
