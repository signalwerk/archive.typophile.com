  html: |-
    <p>So I received these .PFB and .AFM format file when I purchase a font family.<br>
    Then what should I do with these unfamiliar format file?</p>
  html_clean: |-
    <p>So I received these .PFB and .AFM format file when I purchase a font family.<br>
    Then what should I do with these unfamiliar format file?</p>
comments:
  - id: 184192
    user: null
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>Those are Type 1 fonts for Windows. You need the .PFB, plus either the .PFM, or .AFM + .INF to on Windows. If you just have the .PFB and .AFM, then you probably have these fonts configured for Linux/Unix.</p>
      <p>Assuming you have Windows 2000, XP or Vista, and the right bits, you can look up instructions all over - e.g. <a href="http://desktoppub.about.com/cs/fixfonts/ht/psfonts_winxp.htm">http://desktoppub.about.com/cs/fixfonts/ht/psfonts_winxp.htm</a></p>
      <p>Cheers,</p>
      <p>T</p>
