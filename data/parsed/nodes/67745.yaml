  html: |-
    <p>What is a good procedure for re-sizing characters that have been imported into Fontographer?  My entire font needs to be enlarged by 149% to meet the publisher's technical requirements.  I find that I can enlarge one character at a time using Fontographer's Transform function, but when I select multiple characters they not only enlarge, but turn upside down.</p>
    <p>There must surely be a simpler solution to this problem.  Any ideas?</p>
    <p>Tom Lincoln</p>
