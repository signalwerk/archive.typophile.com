    html: |-
      <p>That will work, Mark, but I think there's an easier way:</p>
      <p>1. In the main window press Ctrl-a to mark all glyphs.<br>
      2. In the menu, choose Element/transform.<br>
      3. In the popup window choose<br>
         a) Center transformations around: Character origin<br>
         b) First transformation: Scale uniformly 149 (or whatever) percent.<br>
         c) then: do nothing<br>
         d) click on the button "transform".</p>
      <p>Step 3 a) is important, otherwise the smaller characters will sit somewhere in mid-air if you choose Center of selection instead.</p>
      <p>Andreas</p>
