    html: |-
      <p>It's been years since I've used Fontographer, but here's a trick I figured out way back when for scaling an entire font:</p>
      <p>(Be sure to Save first in case you make a mistake.)</p>
      <p>1. Choose "Element &gt; Font Info..."</p>
      <p>2. The "Font Info" dialog box is displayed. There are two checkboxes near the bottom, "Retain path coordinates..." and "Automatically compute...". Make sure both of these are <strong>unchecked.</strong></p>
      <p>3. Note the current "Em Square:" value and multiply it by your scaling amount. For example, if the Em Square value is 1000 and the scaling amount is 149%, then 1000 x 1.49 = 1490. Enter the calculated value in the "Em Square:" field and hit "OK".</p>
      <p>At this point, the paths are all scaled up, but the Em Square value is wrong. So,</p>
      <p>5. Choose "Element &gt; Font Info..."</p>
      <p>6. <strong>Check</strong> the box next to "Retain path coordinates..."</p>
      <p>7. Enter the original Em Square value (in the example above it would be 1000) and hit "OK".</p>
      <p>Your font is now scaled.</p>
