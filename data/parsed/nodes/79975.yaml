    html: |-
      <p>Every style by every lettering artist had/has its own idiosyncrasies, and very few of these myriad personal styles were/have been turned into fonts. </p>
      <p>And the lettering artists would also modify their styles all the time, they weren't robots.</p>
      <p>So it's probably better to narrow down your selection to a few fonts that are close in feeling, and choose the one that best fits the particular project you are working on, considering, for instance, the issues of x-height and line-breaks as they relate to the copy you have to work with in the document format.</p>
      <p>But if you are really in love with this particular lettering, why not digitize it? The "Speedball" style is quite easy to render—draw a path and stroke it.</p>
    html_clean: |-
