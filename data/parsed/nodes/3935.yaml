    html: <p>Brian, don't get discouraged by a lack of meaningful feedback, or sarcasm from Ole. Everybody has a starting point. <br> <br>It appears that you started off with a "bitmap grid" and blurred the letters in Photoshop a bit. Perhaps go back to the original grid and refine some of the shapes, and especially, the numbers. If you are going to bring it in to Photoshop, maybe you could experiment with the bitmap halftone screens to come up with something off the wall. <br> <br>If you need some suggestions about methods of creating scratch fonts in Illustrator, feel free to email me at <a href="mailto:bjharvey@apollo26.com">bjharvey@apollo26.com</a>. <br> <br>When you're new to this, sometimes you just need a method to the madness. <br> <br>bj</p>
