    <p>Hi everyone,</p>
    <p>First post and so on - but I’ve been lurking around as a guest for a little while now. I love the site, the design and the ideas discussed - hope I can add something to the discussion where appropriate, but warning now, self taught know-nothing in most respects... </p>
    <p>So - the question - I was wondering if there was a respectable open source or free-to-use (for non-commercial applications even) win32 or OSX program that people are using to build fonts with?</p>
    <p>What kind of programs are used to make fonts for linux distributions too? Is there a gpl tool which is used... or are people using commercial applications to build things which are then donated to the distirbutions..?</p>
    <p>Thanking kindly!</p>
    <p>Dan</p>
