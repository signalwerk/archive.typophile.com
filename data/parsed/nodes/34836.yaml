    html: |-
      <p>The most established such tool is FontForge. It started out as something of a Fontographer clone for Type1 fonts only, but has grown considerable sophistication for TT and OpenType as well.</p>
      <p>My own fonts, including Inconsolata, are developed using my <a href="http://levien.com/spiro/">Spiro</a> tools. The underlying math is quite sophisticated, but the polish and packaging to make it a smooth, easy-to-use app is absolutely not there yet. I will continue to chip at the code in support of those goals, but I expect progress to be very slow unless considerable new energy comes into the project from other collaborators.</p>
      <p>See also Dave Crossland’s talk at <a href="http://www.libregraphicsmeeting.org/2007/program.html">LGM</a> (audio and video links of the presentation inside that link). There is a bit of information about less mainstream tools on the <a href="http://openfontlibrary.org/wiki/index.php/Tools">OFLib Wiki</a> as well.</p>
      <p>Best of luck!</p>
