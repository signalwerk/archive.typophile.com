    html: <p>FontForge <a class="freelinking-external" href="http://fontforge.sourceforge.net/">http://fontforge.sourceforge.net/</a> (that what Raph mentioned) is a tool for developing fonts, free to use and modify under “essentially the revised BSD license”. It is a UNIX type of program, but has builds that work under X11 on MacOSX and Cygwin on Windows.</p>
