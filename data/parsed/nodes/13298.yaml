      <p>Yes, 3000+ pairs for basic Latin stuff is excessive... especially since you say your spacing is still not good enough! Some people say that "too many pairs" is a sign that your base spacing is not good, but actually even a font with good base spacing can suffer from it. So what is "too many" anyway? It seems to me that between 1000-2000 is good (for basic Latin) but of course that depends on the design: something like Impact will need way less pairs than something like Zapfino. Also note that, really, a few hundred pairs is enough for 95% of text.</p>
      <p>hhp</p>
