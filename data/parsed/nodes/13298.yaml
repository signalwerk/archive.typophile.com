      <p>I must admit it was not a good idea, Hrant. It would be something to consider though, if we had technical limitations to the number of kerning pairs allowed/supported in a font. But now we have class-kerning in OpenType (<a href="http://www.typophile.com/node/8459#comment-56064" rel="nofollow">this comment</a> by T Phinney is relevant).</p>
      <p>So, comparing the total number of kerning pairs in PS T1 fonts can be misleading. A possible 'ao' pair in a font results in more or less 50 additional pairs for the accentuated letters. For a quantitative comparison, it should be better to disregard the pairs with accentuated letters.</p>
