    <p>Recently I've made my first text font family of 5 weights. I've noticed that each weight of my font includes aproximatedly 3000-3500 kerning pairs (assuming that pairs like v+a, v+à, v+á, v+ã, v+ä, v+â, v+å count as one kerning pair each). I've used class-based kerning in Fontlab.   </p>
    <p>Then, I've opened a few text fonts that I have in Fontlab, and I've noticed that in most of them the number of kerning pairs reaches something like 1000 pairs or a little more. But also, I've noticed that in most of them, for example, there are not kerning pairs for all diacritical variations of letter "a" (such as à, á, â, ã, ä, å etc).</p>
    <p>I know that a lot of kerning pairs is a problem of spacing, and certainly my font still has problems. But I'm wondering if there are kerning pairs missing in those fonts with aproximatedly 1000 kerning pairs.</p>
    <p>Fernando</p>
