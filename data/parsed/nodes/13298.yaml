      <p>I have posted a topic on General Discussions about bloated kerning tables when there are many accented glyphs. I should have looked here first.</p>
      <p>I agree with Hrant that good letter spacing can eliminate many kern pairs. However, even if this is done, you can still end up with thousands of kern pairs, because of the number of possible combinations of accented letters. The kerning table rapidly expands if you have a bigger character set, that covers Latin Extended A as well as Latin1, for example.</p>
      <p>Using kerning by classes on font of mine that implements the first three Unicode blocks produced around 4500 kern pairs. This certainly looked excessive to me. I use Fontforge on Linux, by the way, rather than Fontlab, but it sounds like kerning by classes in Fontforge does similar things to Fontlab.</p>
      <p>My point from the other post is that there are many feasible accented letter pairs that never actually occur in any real text, because no alphabet uses all possible glyphs for native words. I proposed a method for filtering a bloated kerning table, using a programme that scans spelling dictionaries in multiple languages for actual letter pairs.</p>
      <p>I have also looked at existing fonts, to get an idea of which letter pairs typically need kerning, and how big the kerning table would normally be. Many of these fonts (which are probably not of the best quality) did not have a kern pair for accented letters corresponding to the unaccented letter pair. For example, there would be a pair for T+e, but no T+eacute. T+eacute occurs at the start of quite a number of French words, and it looked like this pair wanted kerning, though not as much as T+e. I presume that there are many fonts that are kerned mainly for English, and so they have fewer kern pairs than they should have, given the glyphs that are implemented.</p>
