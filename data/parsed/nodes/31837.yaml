      <p>A couple more:</p>
      <p>Updike, D. B. “Printing Types, their history, form, and uses”. (the standard reference for pre-twentieth century)</p>
      <p>Carter, H. “The Le Bé Memorandum” (history of 16th century French typefounding).</p>
      <p>Haley, Allan. “Typographic Milestones”</p>
      <p>Gray, N. “Nineteenth Century Ornamented Typefaces” (the Nash version has American as well as English)</p>
      <p>Most everything else you can find in the bibliographies of what’s already been mentioned.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
