      <p>One author that could be added to the existing list of books on graphic design history is Richard Hollis:</p>
      <p><strong><a href="http://www.amazon.com/Graphic-Design-Concise-History-Second/dp/0500203474/sr=1-3/qid=1172626048/ref=sr_1_3/102-2355574-4800156?ie=UTF8&amp;s=books" target="_blank">Graphic Design, A Concise History</a></strong> (Second edition)</p>
      <p><strong><a href="http://www.amazon.com/Swiss-Graphic-Design-International-1920-1965/dp/0300106769/sr=1-1/qid=1172626048/ref=sr_1_1/102-2355574-4800156?ie=UTF8&amp;s=books" target="_blank">Swiss Graphic Design: The Origins and Growth of an International Style, 1920-1965</a></strong></p>
      <p><strong><a href="http://www.amazon.com/Avant-Garde-Graphics-1918-1934-Merrill-Collection/dp/1853322385/sr=1-8/qid=1172626048/ref=sr_1_8/102-2355574-4800156?ie=UTF8&amp;s=books" target="_blank">Avant Garde Graphics 1918-1934: From the Merrill C. Berman Collection</a></strong> (with Lutz Becker)</p>
