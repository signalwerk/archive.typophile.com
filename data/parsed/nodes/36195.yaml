      <p>My experience of the Tiresias PC font so far, is that it is very good for menu’s, buttons etc. For most of Windows though, software is hard coded to use MS Sans Serif or Tahoma, so it’s of limited use. IE 7 is a classic example. The menus and tabs are Tiresias, the address bar and tool bars are not.</p>
      <p>For web pages which haven’t been specifically coded for a font in CSS, it comes out very large compared to leaving Windows in its default state. Where the CSS has been coded well and IE switches over to Tiresias it is easier for me to read. The web system I use to monitors my clients applications was written about 10 years ago and thus doesn’t do anything fancy with fonts. Tiresias on that is very readable.</p>
      <p>And thanks Joe for the suggestions about monospaced fonts. My searches have tended to be for ’monospaced font legible’ or ’monospaced font partially sighted’.</p>
