      <p>Linda,</p>
      <p>I think you keep having a discussion with yourself. What I am saying sounds uncannily like what you are saying, except in reverse: There is no scientific evidence (as has been claimed) that Tiresias provides any benefit over a variety of other typefaces for the same exact purposes. What Joe has been saying is that the alleged science that supposedly established the superiority of Tiresias for these special purposes, is bunk. I have to agree; the documented tests fall far short of anything one would have to do to make a claim such as has been made. It’s smoke and mirrors. It’s insufficient, unscientific, specious nonsense. Defending it is not wise. </p>
      <p>Having decided that the use of Tiresias has helped people does not prove that it is superior or even proficient at providing benefits. That is also bad science. </p>
      <p>All Crows are Birds. Are all Birds Crows? You can decide what you want to see, and then see it. That doesn’t make it empirically true. You could also use logic to reach a very different conclusion. </p>
      <p>I am also saying that Tiresias is not well-designed, and that with the help of someone with experience in type design, Tiresias itself would be much better, and could actually confer the benefits that are claimed for it. This can be said for several other typefaces which can obviously be considered “working” to use your word. Is that the standard we should adopt if we want to assist people? A go-kart will roll down the road. But are you willing to drive one from LA to NYC in wintertime? </p>
      <p>”...certified type designer who isn’t worshipped here on Typophile can’t design a typeface”</p>
      <p>Snotty remarks like this indicate that you are missing the point. It has nothing to do with any particular designer and everything to do with good science. Please go back and look carefully at what has been claimed, and what I am saying. The ’science’ is bad. You have failed, in the same way, to use rigorous deductive reasoning in your remarks.</p>
