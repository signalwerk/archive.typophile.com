      <p><em>There is no scientific evidence (as has been claimed) that Tiresias provides any benefit over a variety of other typefaces for the same exact purposes.</em></p>
      <p>Aye, there’s the rub. It isn’t that Tiresias is not useful for people with impaired vision, but that the ’science’ claiming that it is significantly <em>more</em> useful than other typefaces is unsound. For all we know, what makes Tiresias useful might be what it has in common with dozens of other sans serif typefaces, rather than its very few distinctive features.</p>
      <p>Is it better for people with impaired vision than Helvetica? Well, we don’t probably don’t need science to accurately predict the answer to that question, but we would need good science to <em>know</em> with any certainty what the answer is.</p>
      <p>Is it better for people with impaired vision than, say, TheSans? I wouldn’t want to make a prediction on that, nor for a great many other typefaces. And whether one wants to make a prediction or not, one still needs good science to find out.</p>
      <p>You can’t just make a typeface based on your ideas (your hypothesis) about what will be most helpful to people with impaired vision, and then declare that you have succeeded in making the best typeface for the purpose without testing that hypothesis.</p>
