      <p>As I’ve pointed out repeated, both publicly and privately, there is <strong>no scientific evidence that Tiresias is “bad”</strong>, and <strong>significant (including my own) research shows that it is useful in practice by those who use it.</strong></p>
      <p>While others (Joe, Carl, et al) may protest excessively, <strong>there is no concrete proof that Tiresias is not useful to people with diminished vision.</strong></p>
      <p>That we keep having this discussion (and no, Carl, saying that anyone other than a certified type designer who isn’t worshipped here on Typophile can’t design a typeface), is testament to the fact that science can actually design a working typeface.</p>
