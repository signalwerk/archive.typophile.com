      <p>The story of Clearview might be instructive here. In fact, Clearview might serve your purposes, having been developed for road signage. There are several widths available as well, answering your need for economy. </p>
      <p>The designers of the initial versions of Clearview were graphic designers, which Tiresias never benefitted from, and the further development was handled by an experienced type designer (fontographer is the name of a product, btw). Clearview is interesting here because the designer was consulted during the process of typeface development, and test results were available to the type designer, making further modification and improvement organic and meaningful. That involvement isn’t an ego stroke to type designers, it’s essential expertise required to deliver meaningful results; the brief with Clearview was to improve recognition of words on highway signage, and they clearly achieved that in a quantifiable way. One of the major reasons for this success is that the original US Highway signage typeface was designed by engineers..... See the connection? </p>
      <p>It’s not entirely true what Elaine Kitchel told you in her reply; they did not have to make the typeface themselves. Any number of experienced and knowledgeable type designers would have been willing to give advice, critique, and possibly work for free to such a project, had they heard about it in advance. </p>
      <p>She also wants to discount the opinions of those with normal vision, but the intended users of APHont are “readers who use large print.” Fonts that work well for those with low vision are the same ones everyone uses. They are just set larger. Different factors than mere letterform design affect reading ability. </p>
      <p>I’ve looked at APHont. It has some useful properties and also some major flaws. It misses opportunities to further differentiate letters and ignores some basic concepts of type design, specifically concepts that would be useful in tailoring a typeface to low-vision readers. It also appears to be a rough modification of Verdana. </p>
      <p>I’ve also looked at Tiresias. It’s ok, but not at all unique in offering superior performance. I could thumb through a type catalog and point out several other typefaces that would perform better in the intended setting for Tiresias (television screen captions, a narrow and specialized application). But it, too fails in several critical areas. Screen captioning fonts, and any type intended for reverse display, need unusually wide spacing and careful attention to joins and interior angles. This is clearly not part of Tiresias’ development. It would have improved the resulting typeface immensely had a qualified type designer been involved. And when you propose to assist those with a disability, it seems to me you don’t skimp on the expertise. </p>
      <p>The design schools are lousy with kids eager to invent a cruelty-free defibrillator or ergonomic hammer, and while the impulse is admirable, in the case of type design it’s misguided. There is a tendency to ascribe some magical healing or reparative abilities to typefaces. They want to design a special typeface for a specific disabled group, but without the benefit of any experience in type design. The possible benefits here are very slim.</p>
      <p>There actually are skills and perceptive abilities that type designers have that can’t be approximated by scientists with no design training or experience. Any research that ignores that is flawed and impoverished. Type design is a very delicate operation, and the results achievable by an expert are very delicately balanced. Lots of people, even those with design backgrounds, have discovered how easily well-designed typefaces can be mangled in a drawing program by pulling and stretching on parts of the letters. </p>
      <p>My standard metaphor is: It’s like asking a car mechanic to improve a flower.</p>
      <p>Short answer: Joe may be abrasive, but he’s right.</p>
