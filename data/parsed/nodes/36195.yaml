      <p><cite>My experience of the Tiresias PC font so far, is that it is very good for menu’s, buttons etc. For most of Windows though, software is hard coded to use MS Sans Serif or Tahoma, so it’s of limited use.</cite></p>
      <p>You can override that.</p>
      <p>First, make sure that you’ve gone into the Display properties in the Control Panel and used the Advanced settings to customize every single item to use Tiresias PCfont.</p>
      <p>Now, copy the following text (six lines, including the blank second line):</p>
      <p><code>Windows Registry Editor Version 5.00</code><br>
      <code></code><br>
      <code>[HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\FontSubstitutes]</code><br>
      <code>"MS Shell Dlg"="Tiresias PCfont"</code><br>
      <code>"MS Shell Dlg 2"="Tiresias PCfont"</code><br>
      <code>"MS Sans Serif"="Tiresias PCfont"</code></p>
      <p>Paste the copied text into Notepad and save the file as <code>"Tiresias.reg"</code> — <em>including</em> the double quotation marks (this is important!).</p>
      <p>Double-click the file you just saved to import it into the registry. When asked, confirm the operation.</p>
      <p>Restart Windows, and you should start seeing Tiresias PCfont everywhere.</p>
