    date_raw: 8.Apr.2008 7.03am
    votes: null
    html: |-
      <p>I’ve been playing with it for a while now, and it’s definitely fun. It’s also more robust than I expected. However, it’s a modular font builder, so you have to think on a grid. Fontstruct’s font exporting is very easy, so you could whip up a simple all caps font in a few days and then wrap it into a project (which is nice for those of us without FontLab).</p>
      <p>I’m playing with a blackletter for fun. It’s called <a href="https://web.archive.org/web/20080706172244/http://fontstruct.fontshop.com/fontstructions/show/faketur">Faketur</a>. Very much a work-in-progress, but I’m getting a kick out of working within the constraints of the grid. The only thing I haven’t figured out yet is controlling the spacing.</p>
    html_clean: |-
