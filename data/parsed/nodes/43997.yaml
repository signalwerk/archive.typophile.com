  - id: 271422
    user: 1043
    date: 2008-04-08T15:34:00
    date_raw: 8.Apr.2008 3.34pm
    votes: null
    html: <p>I played around with Fontstruct when it was in beta and did <a href="https://web.archive.org/web/20080706172244/http://fontstruct.fontshop.com/fontstructions/show/162">Boxy 1</a> and <a href="https://web.archive.org/web/20080706172244/http://fontstruct.fontshop.com/fontstructions/show/171">Boxy 2</a>, which are both based on “fonts” I designed in college (about 1975) on graph paper. It’s really a lot of fun. Reminds me of making bitmap fonts with Altsys’ Fontastic, but with the twist that the bits don’t have to be squares or fill the grid spaces.</p>
    html_clean: <p>I played around with Fontstruct when it was in beta and did <a href="https://web.archive.org/web/20080706172244/http://fontstruct.fontshop.com/fontstructions/show/162" class="link-external">Boxy 1</a> and <a href="https://web.archive.org/web/20080706172244/http://fontstruct.fontshop.com/fontstructions/show/171" class="link-external">Boxy 2</a>, which are both based on “fonts” I designed in college (about 1975) on graph paper. It’s really a lot of fun. Reminds me of making bitmap fonts with Altsys’ Fontastic, but with the twist that the bits don’t have to be squares or fill the grid spaces.</p>
