    html: |-
      <p>For such a task, I use <a href="http://www.lcdf.org/type/otfinfo.1.html" rel="nofollow"><strong>otfinfo</strong></a> which comes installed with <a href="http://www.tug.org/texlive/" rel="nofollow"><strong>TeX Live</strong></a> (available free for Windows, Linux and the Mac).</p>
      <p>I simply call otfinfo -i fontname in a terminal window (or I use a script for batch processing).</p>
      <p>Here it a trace with CAMBRIAZ.TTF</p>
      <p>% otfinfo -i CAMBRIAZ.TTF<br>
      Family:              Cambria<br>
      Subfamily:           Bold Italic<br>
      Full name:           Cambria Bold Italic<br>
      PostScript name:     Cambria-BoldItalic<br>
      Version:             Version 1.01<br>
      Unique ID:           Microsoft: Cambria Bold Italic: 2005<br>
      Description:         Cambria has been designed for on-screen reading and to look good when printed at small sizes. It has very even spacing and proportions. Diagonal and vertical hairlines and serifs are relatively strong, while horizontal serifs are small and intend to emphasize stroke endings rather than stand out themselves. This principle is most noticeable in the italics where the lowercase characters are subdued in style to be at their best as elements of word-images. When Cambria is used for captions at sizes over 20 point, the  inter-character spacing should be slightly reduced for best results. The design isn't just intended for business documents: The regular weight has been extended with a large set of math and science symbols. The Greek and Cyrillic has been designed under close supervision of an international team of experts, who aimed to set a historical new standard in multi-script type design.<br>
      Designer:            Agfa Monotype Corporation<br>
      Designer URL:        <a href="http://www.fonts.com" title="http://www.fonts.com">http://www.fonts.com</a><br>
      Manufacturer:        Microsoft Corporation<br>
      Vendor URL:          <a href="http://www.microsoft.com/typography/ctfonts" title="http://www.microsoft.com/typography/ctfonts">http://www.microsoft.com/typography/ctfonts</a><br>
      Trademark:           Cambria is either a registered trademark or a trademark of Microsoft Corporation in the United States and/or other countries.<br>
