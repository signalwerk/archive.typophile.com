    <p>We are happy to announce start of our new website section called "WebSpecimen". </p>
    <p>It should collect typefaces that we think they could be fully useful as webfonts. The idea is to show how an typeface acts in different layout situations, from body text to big titles.</p>
    <p><a href="http://webspecimen.tourdefonts.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">TDF WebSpecimen</a></p>
