    <p>RIT Future of Reading Symposium<br>
    Rochester Institute of Technology<br>
    June 9 –12, 2010</p>
    <p>A symposium with keynotes by<br>
    Margaret Atwood, award-winning author<br>
    Chris Anderson, editor-in-chief, “Wired” Magazine</p>
    <p>Join us in Rochester, New York for provocative and challenging presentations by world-class authors and experts in writing systems, content creation, linguistics, vision and cognition, typography, and visual media that all seek to answer the question: “How will reading change?”</p>
    <p>Register now! $295, includes meals.</p>
    <p><a href="http://futureofreading.cias.rit.edu/" title="http://futureofreading.cias.rit.edu/">http://futureofreading.cias.rit.edu/</a></p>
    <p>Speakers and panelists include:</p>
    <p>Margaret Atwood - internationally acclaimed author of speculative fiction<br>
    Chris Anderson - editor of Wired magazine<br>
    Robert Bringhurst - book designer, typographer, and author of "The Elements of Typographic Style"<br>
    Johanna Drucker - book artist and author of "The Visible Word: Experimental Typography and Modern Art, 1909-1923"<br>
    Katherine Hayles - scholar of literacy and author of "Writing Machines"<br>
    Kris Holmes - designer of Lucida for Mac OSX and Microsoft Windows, as well as Isadora, Apple Chancery, and 100 other fonts<br>
    Richard Lanham - author of "The Electronic Word: Democracy, Technology, and the Arts"<br>
    Jon Orwant - engineer and manager of Google Books search<br>
    Denis Pelli - vision scientist focused on reading and recognition<br>
    Amit Ray - RIT professor and scholar of authorship and textuality in the modern digital world<br>
    Dennis Tedlock - anthropologist, folklorist, translator, and author of "2000 Years of Mayan Literature"<br>
    Massimo Vignelli - world renowned designer who has shaped the look of the modern world<br>
    David Berlow - designer of more than 100 fonts for America's leading magazines and newspapers<br>
    Charles Bigelow -typographic scholar, designer, and RIT Cary Professor of Graphic Arts<br>
    Kevin Larson - cognitive psychologist focused on advanced reading technology at Microsoft<br>
    Steve Matteson - designer of fonts for Google Android OS, Barnes &amp; Noble nook, Microsoft Xbox, and other devices<br>
    Roger Remington - RIT Vignelli Distinguished Professor, scholar and author on modern design<br>
    Tom Rickner - designer and font engineer for Ascender, Apple, Microsoft, HP, and other firms</p>
    <p>Additional speakers and panelists will be announced on the RIT Future of Reading website.</p>
