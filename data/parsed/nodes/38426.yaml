    html: |-
      <p>You have to create your logo in any vector based program and not in Photoshop. You do need size versatility.</p>
      <p>But for your scratch I would suggest you draw your own logo without any font, because you’ll have to tweak it’s vectors anyway and I can see the subtleties of these letters that give it a special character.</p>
      <p>And it shouldn’t be too complicated. Based on your sketch. Quite squarish style with a bit “fat” strokes that look a bit pumped up.</p>
      <p>If you know how to use Photoshop I suggest you try learning Illustrator for its similar UI. But before that read about the differences between bitmap and vector graphics to justify why you need to make it in vector based program.</p>
