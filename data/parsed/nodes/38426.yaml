    <p>Hello,</p>
    <p>I had a flash of inspiration last night and quickly sketched a new logo for my web design company “DesignBits”. I am relatively new to logo and type design though, so I am not entirely sure how to take this design to the next step. I used to work in Photoshop a lot, but people keep telling me that Illustrator is actually better for designing logos and type. What would you suggest?</p>
    <p>The most important thing is the actual typeface though. I need a font that resembles the one I sketched on paper. Has anybody ever seen such a font anywhere? </p>
    <p>Any help is much appreciated...</p>
