    html: |-
      <p>m-ga, I've used both of those approaches.</p>
      <p>I guess it depends on how far you need to extend the corporate identity already in use to extend to these kind of documents. But in short you can't expect to maintain exact appearance of Word-originated docs outside your organisation. If you absolutely need to, you convert them into PDFs first! Aside from fonts, other aspects of a document such as margins and use of half-point sizes depend to some extent on the currectly selected printer.</p>
      <p>Note re Option 1 -- you can embed TrueType fonts in the document fonts, but I don't think it's 100% reliable; there's a suspicious lack of documentation on exactly how the different levels of embedding permissions are implemented for example.</p>
      <p>Substitution is built into Truetype but I personally have no idea how replacement of a given font is determined. I do know that in Word, a user without the correct font will see the text in the substituted font, but it will be described as using the originally specified font in the font dropdown box etc - this makes it a bit difficult to see what font is actually being subsituted in.</p>
