      <p>&gt; meanings of symbols or ornaments?</p>
      <p>History?</p>
      <p>This style is around 3084 B.C. — Porti</p>
      <p>The divisions of a circle are by 4 in Egypt and early Crete; by 6 in Greece, Assyria, Syria, Italy. </p>
      <p>But you need to be more specific with your search.</p>
