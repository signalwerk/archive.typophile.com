    html: |-
      <p>It reminds me of the Hopi tribal symbol, or World Symbol.<br>
      <a href="http://www.mc.maricopa.edu/~ladelia/Music%20files/native_american/images/Hopi%20tribal%20symbol.jpg">Here</a>, and <a href="http://www.whats-your-sign.com/images/NAWorldHopi.jpg">here</a>.<br>
      Which represents the world, with the four bars being north/east/south/west,  the outermost points on the horizon where the sun passes through the year, the solstice/equinox points. The circles represent the “four nations, which came to the world to keep balance”.</p>
      <p>But then again, your symbol might mean something else or nothing specific. :)</p>
    html_clean: |-
