    <p>1949-</p>
    <p>Hans Reichel is a musician/inventor/composer as well as being a type designer. For more than 30 years he’s made a name for himself as an accomplished acoustic and electric guitar player. He’s also the inventor of the Daxophone, an instrument where thin strips of wood are played with a bow to mimic animal sounds and human voices.</p>
