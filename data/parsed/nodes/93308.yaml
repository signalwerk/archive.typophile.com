    html: |-
      <p>Note that CSS 'px' is not a true device pixel. CSS px is an absolute value measurement of 1/96 inch, i.e 1 1/3 pts.</p>
      <p>I believe what happens for text spec'd in px is exactly the same as text spec'd in any other size unit: it gets scaled to logical units, rounded and displayed at the nearest whole ppem size.</p>
    html_clean: |-
