    <p>Below is a logo I designed for a homemade cookie company called “Love &amp; Enjoy”.<br>
    The company is quite small-time so the logo would be applied by rubber stamp on the packaging and stationary to further emphasis the homemade nature of the products they supply.<br>
    I’m still unsure whether the logo or the concept is there or not and would appreciate some constructive criticism as to the direction it could be taken.</p>
    <p>Thanks </p>
    <p>Seán</p>
