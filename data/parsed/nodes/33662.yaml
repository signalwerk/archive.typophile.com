    <p>Spring issue of the <a href="http://www.planet-typography.com/news/" rel="nofollow"><strong>Typographic Times</strong></a><br>
    (with a new logo designed with the Le Monde typeface):</p>
    <p><a href="http://www.planet-typography.com/news/designer/simonson.html" rel="nofollow">Interview of Mark Simonson</a><br>
    “I doodle a lot, and usually I am doodling letters. Sometimes typeface ideas come out of this doodling.”</p>
    <p><a href="http://www.planet-typography.com/news/typeface/coquette.html" rel="nofollow">Portrait of his Coquette typeface</a><br>
    “(...) a sort of European style sans serif script reminiscent of the French script style.”</p>
    <p><a href="http://www.planet-typography.com/news/typo/plantin-moretus.html" rel="nofollow">Visit of the Plantin-Moretus museum of printing</a><br>
    One of the most famous museum of printing: the Plantin-Moretus Museum, in Antverp (Belgium). A unique collection of printing presses, typefaces &amp; punches and books.</p>
    <p><a href="http://www.planet-typography.com/news/typo/inuit-arjo-wiggins.html" rel="nofollow">Inuit typeface (by Jeremy Tankard): the customer point of view</a><br>
    Another perspective on typography: why ArjoWiggins has commissionned a corporate typeface to Jeremy Tankard for branding a new product ?</p>
    <p><a href="http://www.planet-typography.com/news/typo/steve-jobs.html" rel="nofollow">The tribute of typography to Steve Jobs</a><br>
    If Steve Jobs didn't take calligraphy classes at the university, “the Mac would have never had multiple typefaces or proportionally spaced fonts. And since Windows just copied the Mac, its likely that no personal computer would have them”.</p>
    <p>+</p>
    <p>in the <a href="http://www.planet-typography.com/download/index.html" rel="nofollow">shareware download section</a>:<br>
    Intro to Roughtrad by Christophe Feray</p>
