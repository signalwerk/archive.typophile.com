    <div class="info">Submitted by <a href="/user/1085" title="View user profile.">dan_reynolds</a> : 11.Oct.2005 8.16am </div>
      <p>In the October 2005 LinoLetter from Linotype — Holiday Planning and East Asian Font Shopping! Check out the full version at Linotype’s website: <a href="http://www.linotype.com/8-38-8-18953/issue200510.html" title="http://www.linotype.com/8-38-8-18953/issue200510.html">http://www.linotype.com/8-38-8-18953/issue200510.html</a>.</p>
    <p>Content Preview:<br>
    This month, we would like to help you get ready for the holidays by presenting two products that can’t help but aid creativity — our new Xmas™ Com Fonts series, and the Kids Value Pack. Another new favorite of ours that we’d like to acquaint you with is the Bodebeck™ typeface, a re-cutting of timeless English lettering styles. Additionally this month, we are proud to introduce over 250 new East Asian fonts that have entered our library; these include fonts for the Chinese, Japanese, and Korean languages/writing systems. Rounding out this month’s report is information about our new magazine; published from time to time, the Linotype Matrix will keep you informed about the most up-to-date design trends, and how typefaces fit into them…</p>
    <p>Have fonts of fun; view the complete LinoLetter <a href="http://www.linotype.com/8-38-8-18953/issue200510.html">here</a>!</p>
