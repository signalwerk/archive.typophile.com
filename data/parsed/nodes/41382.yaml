  html: |-
    <p>As the title says...<br>
    Let me explain what I mean: I need the elegance of a serif font that will be used for titling on very large formats. So I want to have some innovative elements, to add more personality.<br>
    Take a look at the attached image. Is the Didot Elder by Optimo. I was tempted to use this one, just because the small "g" and some caps are very interesting, but some serifs are a litte "diabolic" (look at the "s" and "z").<br>
    Maybe can you suggest me another serif typeface with cool personality?</p>
    <p><img src="/sites/default/files/old-images/didotelder_5003.gif"></p>
