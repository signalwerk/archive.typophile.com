      <p>I work on GM Canada.</p>
      <p>Buick = Delta - but you've got an old logo there. They just released a new one.<br>
      Chevrolet = Klavika<br>
      Pontiac = Univers - I'm not sure what the States does but in Canada we use Univers<br>
      GMC = Aachen - ugh.<br>
      Hummer = Franklin Gothic<br>
      Cadillac = Franklin Gothic or Delta - I don't remember as I don't really do much Cadillac stuff<br>
      Saturn = Univers<br>
      Goodwrench = Myriad<br>
      General Corporate = TheSans or GMSans as it's labeled on my computer. Probably a custom version.</p>
