      <p>Chevrolet recently use the Klavika, extensively...<br><a href="http://www.processtypefoundry.com/typefaces/klavika/index.html">http://www.processtypefoundry.com/typefaces/klavika/index.html</a></p>
      <p>In the GM.COM the TheSans Family is used in everywhere...<br><a href="http://www.lucasfonts.com/lucasfnt/thesans/sans-.html">http://www.lucasfonts.com/lucasfnt/thesans/sans-.html</a></p>
      <p>Cadillac, maybe the News Gothic or Franklin Gothic like the GMC,<br>
      in their sites...</p>
      <p>Pontiac uses the Frutiger and Griffith Gothic<br><a href="http://www.fontbureau.com/fonts/sans/GriffithGothic">http://www.fontbureau.com/fonts/sans/GriffithGothic</a></p>
      <p>Opel use the Opel Sans, custom by Monotype!<br><a href="http://www.customfonts.co.uk/csview.asp?cs=Opel">http://www.customfonts.co.uk/csview.asp?cs=Opel</a></p>
      <p>Saturn go with Univers....</p>
      <p>As well, Helvetica for "secondary type" Obvious!!!</p>
      <p>IMHO... Maybe, you need be more specific... ;D</p>
