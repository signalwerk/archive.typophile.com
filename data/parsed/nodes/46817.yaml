    html: <p>Okay... off the top of my head I can think of the fonts for Buick and Pontiac. The current font they use isn't just custom lettering for their logo. I've actually seen it in use in a magazine ad from a few years back. See <a href="http://www.chromespinners.com/images/buick_logo.gif">this</a> image. As for Pontiac, it's the font they use for their <a href="http://www.usatf.org/events/2001/USAIndoorChampionships/images/indoorChamp01.jpg">Grand Prix</a>. I'm sure there's a freeware version of this out there.</p>
