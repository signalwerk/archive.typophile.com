      <p>ok, so i just started working for GM, i'm a designer, but working in R&amp;D at the tech center.  all the original signage around the place has this futura-ish typeface that's really nice, but i can't find any documentation about it.  it may just be a pre-digital futura, or something original for the tech center when it was made.  I don't have any good pictures of it yet, as cameras are technically not allowed in the building.  </p>
