    html: <p>I was totally confused by this thread until I went back and saw the title, which I had missed. So now I get the whole typo/pedo attempt at malapropian humor.  <br><br>There actually is something funny about the this shirt — not about pedophilia, Joe, but about ignorance. As in, “What the hell is a typophile? Isn’t that someone who likes little kids?” The fact that the suﬃx phile (or the sound “ophile”) most immediately elicits a correlation with the most depraved philia is more an indictment of our literacy as a culture than  an endoresment of <span class="caps">NAMBLA</span>. I think we all know many more people who enjoy a good book, their iPod, and a decent Merlot than the company of a young child, but how often are the terms biblio-, audio-, or enophile uttered in mainstream media (or in conversation)? <br><br>On a seperate note involving humour involving lowercase letters, did anyone see the Saturday Night Live Weekend Update bit on Verne Troyer’s (Mini Me in Austin Powers) drinking problem? They said he had checked into a lowercase “a.a.” group. Now <span class="caps">THAT’S</span> funny. <br><br><br><span class="caps">CCHS</span> <br><br><br><span class="caps">P.S.</span> There is nothing funny about Alcoholism. <br><span class="caps">P.P.S.</span> There is nothing funny about little people&nbsp;either.</p>
