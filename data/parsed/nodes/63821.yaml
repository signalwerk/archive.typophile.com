    <p>Hi, upcoming saturday is Museumnacht in Amsterdam. All the museums and galleries will be open late and have event.  I am going to be part of a team of stylists, make-up artists, and so on, who will let visitors get proper make-up, a photo shoot, and be put in a classic record cover of their choice. I will be the graphic designer, which means I have to find out which typefaces were used in these covers, so I can put it all together on the spot. So, I need some extra eyes to find the right ones. I would never hear the end of it if I used the wrong ones, Amsterdam is pretty crowded with Typo/Popular Culture-people.</p>
    <p>Ok, here they are:</p>
