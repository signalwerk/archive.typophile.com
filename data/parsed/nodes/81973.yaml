    <p>i think Comic Sans is an ordinary-famous font in the whole world. Why do some people (especially typographer and type design) hate that font?</p>
    <p>Its just a font. I think the hater just have bit of envy of that font's popularity beside that's 'un-good' work. I think the worth of a font is reflected by people response instead the type designer. Because the consumer of the font is people, not the type design. People ignore design that ignores people.</p>
