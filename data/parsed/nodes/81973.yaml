      <p>A few years ago (c. 2003?) at the Subtle Technologies ("where art and science meet") conference in Toronto, it was observed with irony that the artists had the slickest, high-tech presentations but the scientists—who invented the devices used for such presentations—were more disposed to good old-fashioned blackboard and chalk.</p>
