  html: "<p>Ouch. If typefaces could kill. I know I know, this one isn't going anywhere in a hurry. It hurts my eyes too! It is more messing around with shapes and caps -- top half rounded, lower half daggered. I continue to be fascinated by faux-japanese type, or SE Asian type, or Asian Fusion Type, or whatever the moniker of the moment is. The crossing posts and the curves just slay me. Any input will be appreciated. <br> <br>bj <br> <br><!---Attachment: eurmama.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/attachment_icon.gif\" align=\"LEFT\" alt=\"application/x-macbinary\">eurmama.swf<br><a href=\"http://www.typophile.com/forums/messages/29/eurmama.swf\"><b>eurmama.swf</b></a> (17 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
