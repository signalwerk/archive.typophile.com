    html: |-
      <p>Run the FontQA macro and see what it tells you.<br>
      <a href="http://www.fontqa.com/" title="http://www.fontqa.com/">http://www.fontqa.com/</a></p>
      <p>Sometimes, if there are any problem of any kind (contour direction, glyphs naming, whatever..) the OT features fail to work on some windows programs.</p>
      <p>That's happened to me on the Lobster betas, but once fixed all errors and warnings, the OT features started working again, like magic.</p>
      <p>Now I always run the FontQA and test everything twice before releasing</p>
