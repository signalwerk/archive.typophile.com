    html: "<p>Proposal: Destroy your outlines by using an effect action and upload your font (the VFB file, if you are using FontLab). That’s the easiest way to detect the problem. I don’t know, if I find the time to check it, but I have Indesign CS2 and CS3 parallel installed on my Not-Mac.</p>"
