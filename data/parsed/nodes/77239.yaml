  html: |-
    <p>A national newspaper client of mine has a problem with a font I created for them. I created an OpenType Ps flavored typeface that they were happily using on Macs for a few years, then recently some genius decided that everything should be switched to PC's, (presumably the IT department didn't have enough work to keep themselves busy ;^)).</p>
    <p>They are all using InDesign CS2 (I know, update the system, but not the software - brilliant). Anyway, now the kerning doesn't show up when setting the type. I thought OT fonts of either flavor are supposed to be cross-platform, so why the kern problem?</p>
    <p>Anybody have any ideas? Thanks.</p>
