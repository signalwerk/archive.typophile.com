    html: |-
      <p>I have just received a reply from the client:</p>
      <p><em>Happy New Year.<br>
      Excuse the delay, bit of a lull over christmas.<br>
      I'm afraid I owe you an apology. We have found what the problem was, and it was never your font.<br>
      When my colleague carried out the test with the old and new versions, he found they were exactly the same -- and very nicely kerned.<br>
      We went back to the tests I sent you in the first place, and the difference was that mine were created with our headline paragraph style, which was all over the place as you saw. The error was in a style which was nested within the main headline style, which actually turned kerning off. Why that should have been done, I cannot fathom.<br>
      So I owe you a big apology for wasting your time, not to mention casting aspersions on your typography. It wasn't the horrid PCs, or even our obscure software, but a traditional human cock up. Good thing we had someone else do the tests.</em></p>
      <p>I had suggested that kerning may be turned off at the outset, and so that proved to be.</p>
      <p>Thanks to Arno and Pablo and Karsten for your suggestions.</p>
