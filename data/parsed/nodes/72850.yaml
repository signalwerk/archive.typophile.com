    html: <p>The latest release is 2010-05-01, but George no longer provide pre-built binaries, you have to either get binaries from third parties (e.g. any Linux distribution, <a class="freelinking external" href="http://www.apple.com/downloads/macosx/unix_open_source/macports.html" rel="nofollow">MacPorts</a> on Mac) or build it on your own (that is what I do myself). I just checked MacPorts and they list the latest version on their <a class="freelinking external" href="http://www.macports.org/ports.php?by=category&amp;substr=fonts" rel="nofollow">website</a>.</p>
