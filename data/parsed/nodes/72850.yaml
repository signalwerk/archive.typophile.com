    html: |-
      <p>The old version shouldn't pose any problems, although that depends on where your building from.<br>
      If your compiling from source (and it builds correctly - watch for warnings in the terminal window) it will write over your existing versions. You've given it <code>sudo</code> privileges so you won't get/see any feedback on this happening.</p>
      <p>I'd stay away from the pre-compiled versions. The dev guy doesn't seem to support mac as a priority, and the last time i checked he doesn't test his releases on many flavours of mac. The source versions work just fine though.</p>
      <p>My assumption is that the build takes all those libraries in the hidden folders (<code>usr</code>, <code>lib</code> etc) which your populating via macport and and dumps the finished build into applications (don't ask me how it knows!).<br>
      For the record, i've had to do this on four macs ranging from 10.4 to snow leopard. it works.</p>
