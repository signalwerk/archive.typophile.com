      <p>Okay, I installed MacPorts and did the things required to install FontForge via this page: <a href="http://openfontlibrary.org/wiki/How_to_install_FontForge" title="http://openfontlibrary.org/wiki/How_to_install_FontForge">http://openfontlibrary.org/wiki/How_to_install_FontForge</a></p>
      <p>I can tell that FontForge has been updated, it now has little icons in the menus, but when I select Help/About, I am informed that the installed build is Version 02:34 GMT 8-Sep-2009 (20090908) and the library is 13:17 GMT 5-Sep-2009.</p>
      <p>If this is correct, this is not the latest 2010-05-01 build.</p>
