    <p>Hi all,<br>
    I was wondering if it were possible to use FontForge's AutoKern feature to kern only one character.</p>
    <p>My problem is that I have set up the kerning for most of the characters I have and recently introduced a new one. I don't want to run AutoKern and remove the custom kerning that I have done on those.</p>
    <p>Thanks<br>
    Cale</p>
