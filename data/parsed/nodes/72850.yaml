      <p>Fontforge always causes me grief, it's worth it for spiro though.</p>
      <p>My technique from source goes:<br>
      Install XCode from apple<br>
      Install macports and fontforges required libraries (pango, freetype etc) via their app<br>
      Fire up terminal and go to the fontforge source folder<br>
      <code>configure</code><br>
      <code>make</code><br>
      <code>install</code></p>
      <p>and then i have a fresh fontforge app, after a few minutes of hardcore terminal output.</p>
