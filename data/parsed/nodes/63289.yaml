    <p>Hey,<br>
    I'm wondering what these textrolls that you often see in emblems and such are "officially" called, for example: <a href="http://img40.imageshack.us/img40/5485/textrol.jpg" title="http://img40.imageshack.us/img40/5485/textrol.jpg">http://img40.imageshack.us/img40/5485/textrol.jpg</a></p>
    <p>Second part of my question is, do you know of any site that provides good, untoched templates for this? I found a font that contains these textrolls, but they wasn't what I was looking for really.</p>
    <p>Thanks in advance.</p>
