      <p>I'm on a Mac to...</p>
      <p>Ctrl-arrow (in Glyph window with a node selected): selects other node.<br>
      Command-arrow (in Glyph window): moves selection 100 em units.<br>
      Command (in Glyph window): switches between arrow (selection tool) and previous tool.</p>
