    html: |-
      <p>Sigh. All shortcuts should be documented in the manual or in the 'help' section, or both. </p>
      <p>One I use constantly is holding down + which changes the tool to a magnifier in the glyph window. Then dragging the mouse, button down, you can zoom in on one part of the character. If you let go of the + first, before the mouse button, the tool goes back to the arrow. If you let up the mouse first, then it stays on magnification. This is not documented anywhere. </p>
      <p>Control-0 restores the glyph to 'fit' in the window, when you want to look at the whole glyph.</p>
    html_clean: |-
