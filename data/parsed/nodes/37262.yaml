    <p>Hello Typophiles.</p>
    <p>We all have our own ways of working on the <a href="/wiki/fontlab" class="freelinking" rel="nofollow">fontlab</a> and we all use lots of shortcuts as well. Some of them are universal but, there are some shortcuts which are not their in the list of "Fontlab official shortcuts" and we discover them while working. </p>
    <p>I would like you guys to share those secret shortcuts which you think others might don't know. </p>
    <p>Just one shortcut per Typophile would be enough.</p>
    <p>:)</p>
    <p>Thank you so much,<br>
    Satya</p>
