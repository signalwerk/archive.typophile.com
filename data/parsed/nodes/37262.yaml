    html: |-
      <p>Here are some I use a lot (I use the Mac version, so for Windows opt = alt; command = ctrl):</p>
      <p>Double-click on a node to change it from smooth to sharp or sharp to smooth.</p>
      <p>Hold down the shift key while moving anything with the arrow keys to move 10 em units at a time (you can change the amount in Preferences). This works in the metrics window, too, with kerning.</p>
      <p>Right-click on a "neighbor" to choose a different "neighbor".</p>
      <p>Hit the 1, 3, 5, or 6 keys to switch to the arrow, knife, corner point, or curve point tools respectively. (There are others, too, but these I use most often.) Opt-4 selects the measurement tool. (I think I am going to change this.)</p>
      <p>Speaking of changing short cuts (which you can easily do)... I often switch to 100% zoom in the glyph window, but I didn't like the short cut (command-5) so I changed it to command-1, which is the same as a lot of other programs I use.</p>
      <p>It's been mentioned, but I also really like using the tilde key to get a quick preview of the glyph I'm working on.</p>
      <p>Double-clicking on a glyph in the metrics or preview window will open the glyph window for that glyph.</p>
      <p>If you've got a lot of windows open, the Fonts palette gives you a handy list of all windows in outline form, and you can jump to a specific window by double-clicking on it in the list.</p>
      <p>I think this is Mac-only: In the font window, you can command-click on the the little icon next to the window title to see the path to the current open font file as a pop-up menu. If you select one of the locations in the menu, it will appear in the Finder. (This works with most other programs, too, not just FontLab, but I use it fairly often in FontLab, usually after opening a font from the recent files listed in its File menu.)</p>
