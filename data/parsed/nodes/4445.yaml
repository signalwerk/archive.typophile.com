  html: <p>Hey all, <br> <br>First real critique post for me... Can I get your opinions on this? It stands for "Robert Sainte-Marie". He's an interior designer friend of mine. I thought of including the hyphen but it made the S look somewhat like a F. Do you think I should raise the "m" a little? It looks a bit like it's falling to the right to me, I'm not sure. Any other comments? <br> <br>Thanks! <br>Em <br> <br><img src="http://www.typophile.com/forums/messages/29/34225.gif" alt="Monogram"></p>
