    html: <p>What you have is well executed, but I think the r will be problematic for you. This form doesn't serve as much of a lead in since it relies on another letter to even begin! The lowercase script is also the source of trouble with the S vs f. These letters have tons of potential. If you have a copy of Fonts &amp; Logos take a look at pages 108/109 and 234/235 for monogram ideas. If not I will pull a scan in the next few days if you like. <br> <br>Randy</p>
