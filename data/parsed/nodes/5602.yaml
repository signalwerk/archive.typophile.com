    html: "<p>It seems like you've built the black weight as a style-linked bold to the regular. Windows can only have four-member font families, with only two weights plus italics in a single family. So for example, you might have the following Windows Family, Style (PostScript FontName) combos: <br> <br>Variable Light, Regular (Variable-Light) <br>Variable, Regular (Variable-Regular) <br>Variable Light, Bold (Variable-Semibold) <br>Variable, Bold (Variable-Bold) <br>Variable Black, Regular (Variable-Black) <br> <br>Also, although this couldn't cause the problem at hand, you ought to have a hyphen between the family name and the style in the PostScript FontName. <br> <br>Cheers, <br> <br>T</p>"
    html_clean: "<p>It seems like you've built the black weight as a style-linked bold to the regular. Windows can only have four-member font families, with only two weights plus italics in a single family. So for example, you might have the following Windows Family, Style (PostScript FontName) combos: <br> <br>Variable Light, Regular (Variable-Light) <br>Variable, Regular (Variable-Regular) <br>Variable Light, Bold (Variable-Semibold) <br>Variable, Bold (Variable-Bold) <br>Variable Black, Regular (Variable-Black) <br> <br>Also, although this couldn't cause the problem at hand, you ought to have a hyphen between the family name and the style in the PostScript FontName. <br> <br>Cheers, <br> <br>T</p>"
