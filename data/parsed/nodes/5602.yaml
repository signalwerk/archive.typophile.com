    html: "<p>My two cents: I'm using FL4.6 to generate several language versions of a typeface. The base names (AfishaGrotesk) are the same, then I put the language ID, say \"C\" for Cyrillic or \"E\" for CE. If I separate such suffix with a space (AfishaGrotesk C), a weird error occurs: under MacOS X, Fontbook shows font sample with rearranged alphabet. If I eliminate the space in the name, everything is fine: the sample shows alphabet in the correct order. Seems like a definite bug either in FL, or in MacOS 10.3.4/Fontbook</p>"
