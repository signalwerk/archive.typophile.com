  html: "<p>I'm having an issue with a family of windows postscript fonts that I've generated from Fontographer on the PC. When you go into ATM, only the regular and bold weights show up in the window.  <br> <br>When dragging and dropping the files onto the fonts folder, it says the .PFB is invalid or damaged for each font, but it still installs and I can use the fonts in any application. <br> <br>Question: What encoding option should I be choosing when I generate the fonts (Windows 95, Windows 3.1, Adobe Standard?). Would that make a difference? <br> <br>The fonts are named normally like Bold, BoldItalic, Black, BlackItalic etc. So I don't think it's a naming issue. <br> <br>Any help is appreciated.</p>"
  html_clean: "<p>I'm having an issue with a family of windows postscript fonts that I've generated from Fontographer on the PC. When you go into ATM, only the regular and bold weights show up in the window.  <br> <br>When dragging and dropping the files onto the fonts folder, it says the .PFB is invalid or damaged for each font, but it still installs and I can use the fonts in any application. <br> <br>Question: What encoding option should I be choosing when I generate the fonts (Windows 95, Windows 3.1, Adobe Standard?). Would that make a difference? <br> <br>The fonts are named normally like Bold, BoldItalic, Black, BlackItalic etc. So I don't think it's a naming issue. <br> <br>Any help is appreciated.</p>"
