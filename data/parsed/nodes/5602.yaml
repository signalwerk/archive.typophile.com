    html: <p>No, the family name should precede the dash. <br> <br>Remember, the PostScript FontName is a completely separate issue from the Windows family name stuff. <br> <br>Family Name, Style (PostScript FontName) <br> <br>Variable Black, Regular (Variable-Black) <br>Variable Black, Italic (Variable-BlackOblique) <br> <br>I should have pointed you at Adam's font naming thingie. It distills most everything he and I know about this stuff. <br> <br>Cheers, <br> <br>T</p>
