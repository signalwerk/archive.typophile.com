      <p>I just went there but there's not much going on. Personally I don't see why a chatchannel is neccesary, but that's just my opinion. You never know who is hanging around there. My fear would be to get in contact with someone I can't verify in the right context.<br>
      I think Typophile is a good place to get to know the right people and than, if both see the need for it, exchange an ICQ, MSN, .MAC or any other account. With the right software you can than also join a multi-user conversation. </p>
