    html: <p> I was pretty surprised at this. I was sure they would revise the spacing, but no. That said, the spacing really isn't bad as lots of people have made it out to be.  <br> <br>But worrying about the spacing might be useless, since I think Mrs Eaves could never be a book typeface in the first place. Too exaggerated. <br> <br>There is mention of an upcoming OpenType version. </p>
