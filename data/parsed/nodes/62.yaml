  - id: 126
    user: 108
    date: 2002-04-05T12:32:00
    date_raw: 5 Apr 2002 — 12:32pm
    votes: null
    html: <p> I have a lot of learning to do still. I love that, I don't consider that a burden but a true pleasure.  <br> <br>Sometimes the spacing on fonts, yes even I can tell, it is horrible. But, I like to think that I'm not such a bad designer that I can't set some type into paragraphs. I like to work with the text and finesse it into what I deem to be a *rocking set of lines made of type.*  <br> <br>That said, is there anyway to educate those of us (whom obviously have much more to learn) who do not understand the finer points of a well-spaced face? (By means both visual and textual?) Instead of just saying "it's pretty bad"? (no insult, just curiousity. ;-) Hi Hrant!) </p>
