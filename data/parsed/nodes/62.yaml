    html: <p> &gt; the spacing really isn't bad <br> <br>I don't know, man - to me it's pretty bad. <br>It sure is pretty, though - especially the italics. <br> <br>&gt; Mrs Eaves could never be a book typeface <br> <br>Well, I tend to agree, but -except for the wonderful Eidetic- it's the only "texty" face in the Emigre library. <br> <br>The good news is that with InDesign's "optical spacing" feature badly-spaced fonts get fixed automatically, with pretty good results - although it's not a 100% substitute for doing a good job in the font itself. <br> <br>hhp </p>
