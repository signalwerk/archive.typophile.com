    html: <p> They have re-aligned the punctuation with the petite and small caps for one. They did this with Filosofia as well (I believe). They have also added ranging &amp; non-ranging figures (numerals). I haven't had an opportunity to completely look through the changes. They discussed it in their latest issue of their magazine. (which by the way has amazing music to boot!) </p>
