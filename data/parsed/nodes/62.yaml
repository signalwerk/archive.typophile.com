    html: <p> I'm no expert, but spacing being one of the few things in type design which is mostly -but not entirely- "analytical", and me being a computer programmer by nature, I'm probably too anal about it, that's for sure. <br> <br>But I don't want to bash Mrs Eaves too much at the moment - not least because I probably won't be seen as being objective. Maybe in another place/time. <br> <br>hhp </p>
