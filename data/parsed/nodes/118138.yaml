      <p>Heroic Condensed is close but that's not it. Should be one of the condensed versions of <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/graphik" class="freelinking" rel="nofollow">Graphik</a>, <a class="freelinking external" href="http://commercialtype.com/news/updates/new_widths_of_graphik_for_iesquirei_and_ibon_appeacutetiti" rel="nofollow">exclusive for Esquire</a> and not commercially available.<br>
      As alternative, from the same foundry, <a class="freelinking external" href="http://commercialtype.com/typefaces/giorgio/sans/heavy" rel="nofollow">Giorgio Sans Heavy</a> using the alternate un-spurred /G might work pretty well.</p>
