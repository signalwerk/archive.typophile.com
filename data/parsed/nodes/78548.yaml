    html: |-
      <p>This native speaker agrees.</p>
      <p>The tendency is to pronounce the syllable "zij" as "zay", which is much to close to "aye" -- you should aim towards something like "zey".</p>
      <p>Or listen to <a href="http://www.youtube.com/watch?v=583p49lm3CE" title="http://www.youtube.com/watch?v=583p49lm3CE">http://www.youtube.com/watch?v=583p49lm3CE</a> ("Radio Noordzij"; unrelated the typographer!), and be sure to close your eyes for the tacky more-than-a-hint-of-that-old Amiga video editing software from the '80s :0)</p>
