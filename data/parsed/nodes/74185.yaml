      <p>I was a little surprised when someone pointed me to this thread this morning. I don't need to get into the details of our one short phone conversation, but there was no contract or agreement. I did, however, explain that Stephen could have anyone make modifications to the fonts under Betatype's EULA. For the record, the Betatype license is extremely liberal with font modifications. It basically says, make any modifications you want, as long as you use the modified font under the terms of the original license. </p>
      <p>Kudos to the folks at FontShop for taking an ethical stance on Font mods. I'm sure they will do a great job with any required changes. Again, this is an odd conversation for a public forum, but if you have any additional questions, feel free to email or direct message through Typophile, Betatype or Twitter @bttp. At any rate, I'm glad that this could get sorted out, and thanks for using Pill Gothic. I'm interested to see the results.</p>
