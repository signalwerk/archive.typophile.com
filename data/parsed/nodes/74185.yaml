      <p>The BetaType's EULA offered at MyFonts says:<br>
      " You may modify the Fonts for Your own purposes, but the copyright remains with Betatype, and any modified Fonts may only be uses on those computers for which You have purchased a license. You may not commission a third party to modify the Fonts without first gaining written permission from Betatype."</p>
      <p>However, the Veer EULA prohibits mods, directing you to contact VEER if mods are required.</p>
      <p>So, one question is, where did you purchase it? Did you save your EULA?</p>
