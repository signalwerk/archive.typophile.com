    <p>I've been trying to get in touch with Christian Robertson of Betatype for the last 2 months. Long story short I purchased multiple cuts of the font Pill Gothic for a large scale project. I work in the broadcast industry in Canada and need some modifications made to the font. They are as follows:</p>
    <p>1. Convert the Open type to true type<br>
    2. Tweak the kerning on a number of character sets<br>
    3. Replace the lowercase "a" with the alternate a</p>
    <p>Chris agreed to make these modifications but has been missing in action for the last two months. I've sent numerous emails with no response. Our deadlines are fast approaching and I need to get in contact with him. If anyone can provide me with any help or direction it would be much appreciated.</p>
