      <p>&gt;Chris agreed to make these modifications but has been missing in action for the last two months. </p>
      <p>I guess the obvious thing to do would be to bypass the designer if you can legally. Did the designer sign an agreement with you to make these mods? If he did you might want to check the contract section on breach of contract and see if it allows you to source these modifications through a third party. If it does I might be inclined to hire a professional type designer to make these modifications. </p>
      <p>If there's no formal agreement, check the EULA and see if that allows end-user modifications. If it doesn't I would find a different font. You don't want to risk violating the EULA to which you agreed on a high profile broadcast project... <a href="http://www.huffingtonpost.com/2009/10/08/nbc-sued-over-fonts_n_314394.html" title="http://www.huffingtonpost.com/2009/10/08/nbc-sued-over-fonts_n_314394.html">http://www.huffingtonpost.com/2009/10/08/nbc-sued-over-fonts_n_314394.html</a></p>
