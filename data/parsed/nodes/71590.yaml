    html: |-
      <p>From the Quark forums:</p>
      <p>When you launch QuarkXPress, some conflicting components may prevent the application from loading properly. The XPress Preferences file, fonts, XTensions, printer descriptions or other supporting files may be damaged or incompatible.</p>
      <p>Solution: Rebuild a new set of Preferences in the local QuarkXPress folder. To do so:</p>
      <p>For Mac OS 10.3.x - 10.5.x:<br>
      1.       If the application crashes, Force Quit out of QuarkXPress.</p>
      <p>2.       On the Finder level, go to the Hard Drive &gt; Applications &gt; QuarkXPress folder.</p>
      <p>3.       Inside the QuarkXPress folder, create a new folder by going to File &gt; New Folder</p>
      <p>4.       Label the new folder Preferences (use an upper case P - It is important that “Preferences” be spelled correctly).</p>
      <p>5.       Launch QuarkXPress from the QuarkXPress folder.</p>
      <p>Also check here:</p>
      <p><a href="http://forums.quark.com/t/20831.aspx" title="http://forums.quark.com/t/20831.aspx">http://forums.quark.com/t/20831.aspx</a></p>
