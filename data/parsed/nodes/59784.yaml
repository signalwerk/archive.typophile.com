      <p>Ah, now it works. See, she made me use a script font, weh. I think the rr's interfere with the dog ears now, and it's not in one line anymore. Also had to change the numbers to match the name. It kind of looks like a spa now. What do you do when you have to change your work to an aesthetic that's not necessarily your preference? Do you revert back to your original idea when you put it in your portfolio or keep as is?</p>
      <p>Also, I would love any critique you could give me regarding the type placement. Thanks very much!</p>
