    date_raw: 12 Jul 2009 — 8:28am
    votes: null
    html: |-
      <p>Actually, to me I think the font you've chosen works nicely - especially with the puppy ears. Before they looked stuck on and I wasn't sure what they were. I like that the stroke modulates from thick to thin, it has more of a drawing feel to it which compliments the hydrants, bones and paw prints on the back of the card. Since you find the r's distracting you may want to alter them slightly. The doggrrl.com seems close to the bottom, I would prefer to see the whole block of copy moved up just a bit.</p>
      <p>As for using the final work or an earlier version in your portfolio, I'm a purest I suppose. To me part of the challenge of being a designer is working with the client. I do have a few self promotion pieces in my portfolio but they are unique to themselves and not a rejected proposal. I guess I'm concerned that in showing earlier versions of a project that I prefer over the final to a new client I'm saying (unintentionally) this client was an idiot and I may think you are an idiot too. So either it's in or it's out. I'm sure there are plenty of others who will argue the reverse, that's my 2¢.</p>
