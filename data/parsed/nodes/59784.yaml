    <p>Hi, I can't seem to figure out where I should put the list of services on here. It all just seems bottom heavy. Argh! Also, The girl wants me to change the typeface to something more "girly". I made a list of other typefaces she can choose from but I really don't know what constitutes being "girly" without using an ugly, gimmicky font.</p>
    <p>I'd love any help you could give me, especially for the composition of the type in relation to the logo and number. Thanks so much!</p>
