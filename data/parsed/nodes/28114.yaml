    html: |-
      <p>Miss Tiffany, I don't think that E&amp;F CBC is really too close, but Keith, Jamie Reid designed all the Pistols stuff and he did a lot of it with Letterpress work too. I think more than font matching in this instance, what you need is the ability to transform the idea to your situation and that is why it worked for Mr. Reid. Jamie Reid allegedly wrote most of the Lyrics for them too!<br>
      My goodness 30 years and I am no longer who I was then, thank God(:!<br>
      The best song they ever did was "Satalite", which did not make it on that album, but I had the bootleg for years!</p>
      <p>The Truth shall set you free</p>
