      <p>Thanks you so much for your reply, Hrant.</p>
      <p>Yes, I definitely do nor want to offend by going to the extreme in either direction. Luckily, all I need to typeset is the name of the company and a small tagline. So no need to dive in to an entire typeface. True that I am not at liberty to go into too much detail. But to give you the general idea, I would like to convey the same feel that Helvetica Neue conveys here. Which is, in my view, traditional, clean, classy, slightly conservative and corporate...something a financial institution, lawyer, power company or high-end retailer may use. By no means cutting edge, but not overly official and stuffy either.</p>
