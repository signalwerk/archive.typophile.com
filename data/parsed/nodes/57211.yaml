    html: |-
      <p>Martĳn, </p>
      <p>if you want, you can duplicate your AE and OE glyphs as "A_E" and "O_E" for uppercase, and "a_e" and "o_e" for lowercase, and then include a "dlig" substitution for them. I'd also include them in "hlig" (historical ligatures). There are indeed cases (such as in English) where one might want to use a ligature in ae and oe. For example, in contemporary English, the word "aesthetically" is spelled with "ae" and not "æ" but in some cases, designers may want to use them to evoke a historical or more stylized spelling of the word, which would look like "æsthetically" then, but typing in the "æ" letter from the keyboard is not what they would usually want. </p>
      <p>Cheers,<br>
      Adam</p>
