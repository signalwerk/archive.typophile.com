    html: |-
      <p><cite>some pairs may never be accessed</cite></p>
      <p>You have the same side of a pair controlled by more than one class. </p>
      <p><cite>“Do you want to rebuild the kern OpenType feature?”</cite></p>
      <p>Just click no. I think you might be able disable automatically doing this in the Fontlab preferences.</p>
      <p><cite>“UPM size is not 1000 which is not recommended for OpenType.”</cite></p>
      <p>There are dozens of threads about whether or not UPM sizes other than 1000 work. The consensus seems to be that it might work, but probably isn’t a good idea.</p>
      <p><cite>The feature file OS/2 overrides TypoAscender and TypoDescender do not sum to the font bbox size</cite></p>
      <p><a href="http://www.kltf.de/downloads/FontMetrics-kltf.pdf">Read this</a>, understand it, do what it says.</p>
      <p><cite>no Help library is supplied</cite></p>
      <p>Go to Fontlab.com and download the manual.</p>
