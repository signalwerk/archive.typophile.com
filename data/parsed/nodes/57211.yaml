    <p>Hi,</p>
    <p>I'm now adding OpenType features (for the first time :D ) to my Geometro typeface.<br>
    I have merged "ae" and "oe" glyphs, but where should I put my OT code "sub A E by AE;", etc?<br>
    Currently I've put them at Discrete Ligatures (dlig).</p>
    <p>My FontLab problems:</p>
    <p>I'm getting this error when compiling OT features:<br>
    -"[WARNING]  Start of new pair positioning subtable; some pairs may never be accessed: [question P T V W Y Z z ...] [four six A J a c d ...] [C:/Documents and Settings/Martijn van Berkel/Mijn documenten/FontLab/Studio5/fontlab.fea 126]"</p>
    <p>These warnings when saving font:<br>
    - "Do you want to rebuild the kern OpenType feature?" (Clicking Yes removes my kern code. I compiled it before saving, so nothing is changed.)<br>
    - "UPM size is not 1000 which is not recommended for OpenType."</p>
    <p>And this warning after saving:<br>
    - "[WARNING]  The feature file OS/2 overrides TypoAscender and TypoDescender do not sum to the font bbox size!"</p>
    <p>Could someone explain these errors?</p>
    <p>I find it unfortunate that no Help library is supplied and accessible through Help or F1.</p>
    <p>Thanks in advance!</p>
    <p>Kind regards,<br>
    Martijn</p>
