      <p>Why would you need an opentype feature for the (french) Œ and (scandinavian) Æ in the first place?<br>
      They are (AFAIK) considered separate and unique glyphs and are never typed in as OE and AE - always as a separate glyph on the keyboard.<br>
      Unless your font is just for setting old, archaic text where you want to force OE into Œ and EA into Æ you don't need to program this in OpenType - all those who need these glyphs should know how to type them in directly...</p>
