    html: |-
      <p><a class="freelinking external" href="http://www.fontbureau.com/fonts/Giza" rel="nofollow">Giza</a> provides a very versatile Egyptian for this sort of thing.</p>
      <p><a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100002" rel="nofollow">Champion Gothic</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100013" rel="nofollow">Knockout</a>, and <a class="freelinking external" href="http://www.fontbureau.com/fonts/BureauGrot" rel="nofollow">Bureau Grot</a> are good for covering the Industrial Sans styles.</p>
      <p>The members of the <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100019" rel="nofollow">Proteus Project</a> offer some additional stylistic options, but aren't as versatile in terms of widths.</p>
