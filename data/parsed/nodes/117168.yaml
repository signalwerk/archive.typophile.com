      <p>As for _BATES_ I share your opinion that the lettering looks somewhat like a Caslon. If you are attempting to replicate it you could use a Calson Italic and edit as required. But Caslon is too light for the letters. You might also consider sloping ITC Grouch or Grumpy and editing. <a href="http://www.myfonts.com/fonts/bitstream/itc-grouch/" title="http://www.myfonts.com/fonts/bitstream/itc-grouch/">http://www.myfonts.com/fonts/bitstream/itc-grouch/</a> <a href="http://www.myfonts.com/fonts/suomi/grumpy/" title="http://www.myfonts.com/fonts/suomi/grumpy/">http://www.myfonts.com/fonts/suomi/grumpy/</a><br>
      Don</p>
