    <p>Been digging around for hours trying to figure these out. Looking to identify both top and bottom fonts. They look so familiar and yet I haven't been able to figure them out.</p>
    <p>This was created sometime between the 40's and 60's. I don't know exactly when though. The Bates type seems to be related to Caslon, based on the A. But I'm not sure what other fonts were used in the era that would have similar characteristics.</p>
    <p>Any feedback or direction would be appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bates_4943.jpg"></div><p></p>
