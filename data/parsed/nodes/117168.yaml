      <p>As for the second one, note the variation in repeating letters. For example the width of the counters in _PP_  are obviously different.<br>
      The creator of this lettering would probably have known about Eden </p><div class="imageWrap"><img src="http://typophile.com/files/EdenInUse_6550.jpg"></div> which was designed, in light and bold weights by Robert H. Middleton 1934. <a href="http://www.myfonts.com/fonts/castletype/eden-ct/" title="http://www.myfonts.com/fonts/castletype/eden-ct/">http://www.myfonts.com/fonts/castletype/eden-ct/</a><br>
      The kinked leg on the R is a design idea -- source unknown -- adopted in a 2004 font called Concrete <div class="imageWrap"><img src="http://typophile.com/files/ConcreteInUse_3711.jpg"></div> <a href="http://www.myfonts.com/fonts/transkrypt/concrete/" title="http://www.myfonts.com/fonts/transkrypt/concrete/">http://www.myfonts.com/fonts/transkrypt/concrete/</a> and in some other futuristic constructed fonts.<br>
      Don<p></p>
