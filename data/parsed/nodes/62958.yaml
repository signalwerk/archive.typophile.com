      <p>I think Rick Mueller's <a class="freelinking external" href="https://web.archive.org/web/20141113201135/http://moorstation.org/typoasis/designers/mueller/g_q.htm" rel="nofollow">Parchment</a> at TypOasis may be undistressed, and Scriptorium has a Papyrus-like font called Ereshkigal (may be distressed) and 3 Islands Press has Fidelma, a similar, undistressed style.</p>
      <p>- Mike Yanega</p>
