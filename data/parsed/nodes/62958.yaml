      <p>Here is David Nalle's <a href="https://web.archive.org/web/20190927062425/http://new.myfonts.com/fonts/scriptorium/ereshkigal/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ereshkigal</a>, a somewhat modified take on Papyrus (the A is different at least), complete with similar erosions to look like it was written on its original's namesake writing material.</p>
