      <p>Here is David Nalle's <a class="freelinking external" href="https://web.archive.org/web/20141113201135/http://new.myfonts.com/fonts/scriptorium/ereshkigal/" rel="nofollow">Ereshkigal</a>, a somewhat modified take on Papyrus (the A is different at least), complete with similar erosions to look like it was written on its original's namesake writing material.</p>
