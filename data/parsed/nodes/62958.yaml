      <p>I think Rick Mueller's <a href="https://web.archive.org/web/20190927062425/http://moorstation.org/typoasis/designers/mueller/g_q.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Parchment</a> at TypOasis may be undistressed, and Scriptorium has a Papyrus-like font called Ereshkigal (may be distressed) and 3 Islands Press has Fidelma, a similar, undistressed style.</p>
      <p>- Mike Yanega</p>
