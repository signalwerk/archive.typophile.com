  html: <p>First of all, I apologize in advance if I put this in the wrong forum. I am searching for a font in the same style as the font Papyrus, that is not distressed. Can anyone give me words of wise guidance on where something like this might live? Thanks!</p><div class="imageWrap"><img src="https://web.archive.org/web/20141113201135im_/http://typophile.com/files/Papyrus_4494.gif"></div><p></p>
