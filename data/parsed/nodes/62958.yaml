  html: <p>First of all, I apologize in advance if I put this in the wrong forum. I am searching for a font in the same style as the font Papyrus, that is not distressed. Can anyone give me words of wise guidance on where something like this might live? Thanks!<img src="/web/20190927062425im_/http://www.typophile.com/sites/default/files/old-images/Papyrus_4494.gif"></p>
