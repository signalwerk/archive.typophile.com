      <p>For me the section summarizing scientific research on type size and reading speed is the most informative survey I've seen since <a class="freelinking external" href="http://www.microsoft.com/typography/ctfonts/wordrecognition.aspx" rel="nofollow">Kevin Larson's paper on word recognition</a>. It is, I'm afraid tough sledding, and I think I will have to study some of the linked papers to really understand it. Larson's essay was easier to get through. But on the other hand, I think Larson,'s conclusion—that we always identify letters before we read words—is probably wrong, and the conclusions in Legge and Bigelow are probably right!</p>
      <p>I agree with Peter that we could use a lot more strong research like this, using other measures than reading speed, such as Luckiesh's visibility and readability (fatigue) measures. But personally I am grateful for such a summary. To me much of the "legibility" research is poor, and what is summarized here is some excellent and informative work. </p>
      <p>Nick, I can understand not wanting to plow through the scientific section, but your idea of "pure science" seems to me off. When science gets it right, it describes and understands reality correctly. So it's up to us then to make use of that understanding. And "us" includes practitioners as well as applied scientists.</p>
