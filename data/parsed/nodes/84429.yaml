      <p>You want an autobiography?</p>
      <p>Having followed the science of reading from way back (Cyril Burt!) I presume it's had some slight effect on my work, but really, David Ogilvy's two how-to books were probably the biggest theoretical influence, and my mentor Raymond Lee, from whom I learned how to lay out copy. </p>
      <p>I work like most designers — keep an eye on what's happening, follow my interests, engage in some professional development, please the client, target the work according to reader demographics, take account of the medium, try different approaches to a brief and see what works best. Occasionally there is feedback from focus groups.</p>
      <p>I don't think there is any way that scientific knowledge of how reading works can add anything useful to what we, as typographers and type designers, already know through centuries of empirical practice and the culture, institutions and traditions we've developed.</p>
