      <p>It's not hubris, it is just an observation based on long experience. I spent a lot of years studying history and philosophy of science, got a PhD on the subject in the process, and have taught it and published books and articles about it. It doesn't make me right about anything in particular, but it does mean I have some familiarity with the subject. </p>
      <p>The objection of "too many variables" in my experience shows ignorance of the history of science, as that could have been said of any field before its breakthrough ideas or discoveries. And some aspects of visual perception are in fact already well understood by science, contrary to what you seem to think. For example, the fact that the visual nervous system has a process that is structured to pick out edges is well established in spite of "many variables." And we already have distinguished individual type faces under specified conditions—NOT JUST INDIVIDUAL DOCUMENTS—so as I have said the "too many variables" objection is already refuted in numerous ways.  </p>
      <p>—And the point of my saying that the Clearview tests have a level of generality is just that they go beyond individual documents, and apply to conditions with potentially unlimited instances—unlimited numbers of signs. --Not bound to specific documents.</p>
      <p>More to the point this very article that we would be better discussing has a robust result showing that critical print size is twice the threshold for visibility under the same light. That's another example of an interesting finding, in spite of "many variables."</p>
