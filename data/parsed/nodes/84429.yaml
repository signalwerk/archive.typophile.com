      <p>@Nick Shinn:<br>
      <cite>Typography is visual and practical, not academic—why must it meet its science on science's home turf?</cite></p>
      <p>When a scientist submits a paper for publication, a number of things are taking place.</p>
      <p>One of them is that he would normally submit his manuscript according to the standards of the journal which is receiving it, and they will typeset it in their standard form. Which will be dull and boring, since it's bad enough that academic papers tend to be full of such "penalty copy" as mathematical formulas.</p>
      <p>I've seen, of course, many exceptions to that rule - in conference proceedings where each paper is usually "typeset" in double columns by the submitter. So most papers are done on a typewriter or a line printer with a lower-case print train, and one or two lucky submitters have some exotic equipment like a 200 dpi electrostatic printer.</p>
      <p>Of course, that was back in the old days. Today everyone and his dog has a laser printer and desktop publishing software. But they don't know how to use it. <em>At least few scientific papers make use of Comic Sans and Papyrus.</em></p>
      <p>The other is that these papers are basically intended for reference by other scientists in the same field. Even review papers, although an entrance into the literature of a field, aren't intended for laypeople or undergraduates.</p>
      <p>If, someday, the psychovisual study of typography got to the stage of producing monographs... well, that's an exaggeration - it has reached that stage on occasion - as Legros and Grant (<cite>Typographical Printing-Surfaces</cite>, Longmans, Green 1916) attests - let alone textbooks, I expect they will receive decent typography.</p>
      <p>Likely dull and workmanlike instead of flashy and spectacular, though. Better not to attempt too much in someone else's field than make a fool of oneself. Scientists, unlike cosmetics companies, don't have the budget to hire graphic designers.</p>
