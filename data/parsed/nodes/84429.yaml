      <p>Though I have great respect for Nick Shinn's understanding of graphic design, including both history and type design, I am distressed to have spent so much time controverting his concerns, because I think they are groundless. Efforts to understand readability, including of particular typefaces, pose no threat to type design or graphic design, but will help it as the science gets more and more informative and robust results.</p>
      <p>And this paper in fact has a lot to teach us as a very valuable review of the scientific research and type history. Let me start with just one fact. Legge defines "critical print size" as "the smallest character size for which reading is possible at maximum speed." Critical print size is something quite different from the smallest size that a person can distinguish letters, which is the "visual acuity" threshold, similar to what we all have been tested for by eye doctors. The striking finding here is that "critical print size is at least two times larger than acuity letters for normally sighted subjects, and the difference is often much larger for people with low vision." (p. 6-7) </p>
      <p>This is a very significant finding, because it says that other factors than the ability to identify separate letters are crucial to fluent reading. What this says is that even by the standard of reading speed, there is a huge difference between legibility, defined as the ability to distinguish letters in isolation, and readability. </p>
      <p>Those "other factors" are what I and others working on text type have long labored on in trying to make our typefaces readable, and it is encouraging that however much we succeeded, at least our quest has had a point to it. </p>
      <p>And the specific research using gratings with fixed, regular spatial frequencies, and crowding in the parafovea, do seem to tell us something about these "other factors" in critical print size being twice the acuity size.</p>
      <p>One of the aspects that is intriguing to me is that the critical print size is very close to the ideal print size, as measured by reading speed. In other words, the smaller type, just above the threshold, is the best for reading. This is not discussed in the paper, but my feeling is that at these small sizes, optical effects are quite strong, and need to be compensated for. This is one of the things I did in my <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text.</a> My feeling was that some of the things done for very small text, typically for readability of type 8 point and below, for ideal readability should be done to some extent at 10 or 11 point sizes. In particular this involves not having too fine hairlines, which visually seem to disappear more quickly, in a non-linear way, as you make type smaller. There is a lot more to it than this, as I have discussed in my <a class="freelinking external" href="http://ilovetypography.com/2010/11/02/reviving-caslon-part-2-readability-affability-authority/" rel="nofollow">ilovetypography article</a> and most recently in the current issue of <a class="freelinking external" href="http://www.printinghistory.org/publications/printing-history.php" rel="nofollow">Printing History</a>.</p>
      <p>Overall, I think the appropriate response to this article is not resentment at science "poking its nose" into typography, but gratitude for good work that can help us in the field of type. </p>
      <p>Incidentally, Bigelow is the co-creator of the Lucida type family, winner of the MacArthur Prize and Goudy awards, and head of RIT's School of Print Media. The idea that he is in this paper with scientist Legge "poking his nose" into something he doesn't know about is laughable.</p>
