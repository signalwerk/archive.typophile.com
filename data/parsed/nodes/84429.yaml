      <p>Nick, the point is that because there is difference among practitioners, research may shed light on which solution is best for a given usage. So contrary to your haughty dismissal of scientific research as inherently having nothing to teach experienced practitioners, it has in fact taught them. </p>
      <p>I think the tests on Clearview Highway are a clear example of that. Not everyone would have agreed that the somewhat lighter weight would be better. Research succeeded in finding an empirically demonstrated superior result. And that is also one that can be experienced by viewers. And by the way that is always true when the science is right.</p>
      <p>As far as "product testing in a limited environment", of course testing is always limited. You have general theories and specific tests. That's the way it always works. You find out how far the general theories hold by further testing. Unfortunately, the theory has been so poorly articulated in reading, that the research has not been very informative. This is not an inherent problem of scientific method, but a weakness of legibility and readability research in particular. </p>
      <p>I'll post later on the role of typography, which is an important question.</p>
