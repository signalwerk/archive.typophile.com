      <p>The reading speed differences between roman lower case and italic are discussed in Miles Tinker and Donal Paterson's very first study in their STUDIES OF TYPOGRAPHICAL FACTORS INFLUENCING SPEED OF READING [1928] using the Chapman Cook Speed of Reding test. The study is titled INFLUENCE OF TYPE FORM ON SPEED OF READING.</p>
      <p>SUMMARY AND CONCLUSIONS<br>
      1. A speed of reading record was obtained for texts set up in roman lower case, italic, and all capital letters. Comparisons were made between all capital versus lower case text, and between italic versus lower case text. There were 640 subjects used in the experiment.<br>
      2. The text in lower case letters was read 13.4 per cent faster than that in all capitals. The difference in favor of the lower case text is highly significant. There were 4.74 words read per second of the all capitals and 5.38 words per second of the lower case text.<br>
      3. The text in lower case letters was read 2.8 per cent faster than the italics. The direction of the difference was consistent for all sub-groups. The subjects read 5.08 words per second of the italics and 5.22 words per second of the lower case text.<br>
      4. The following conclusions seem justified by these data: (a) Text printed in all capitals is less legible than material in lower case letters and slows down speed of reading to a very marked degree. (6) Text printed in italics is slightly less legible than material in lower case letters and decreases speed of reading somewhat.</p>
      <p>In their discussion Tinker and Paterson state:</p>
      <p>Lower case text was read only 2.8 per cent faster than italic text. Reasons for this difference being so small are found when we compare the two texts: (1) The material in italics covered exactly the same space as that in lower case letters. Therefore no extra space is present to produce a probable increase in total number of fixations. (2) Word form in italic printing is very similar to word form in lower case text. However, we, must bear in mind that the difference between means in each sub-group was always in favor of the lower case text. This indicates that italic text is actually harder to read than lower case text. It is possible that greater effort was expended in reading the italics. This increased effort may have reduced differences between italic text and lower case text and thus obscured true legibility differences. Greater eye strain may have been involved in the reading of the italic material.</p>
      <p>Luckiesh and Moss didn't do a comparable study using visibility and blink rate.</p>
      <p>It would be interesting to determine if all capitals, roman uper and lower case and italics have different critical sizes and fluent ranges.</p>
