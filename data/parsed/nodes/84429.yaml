      <p>@Peter: <em>This perspective might counteract the tendency prevalent among design clients to rely on sources claiming 12 point is the most legible size and Times New Roman the most legible font.</em></p>
      <p>Good point. But hence rather ironic to observe the typography of this paper!<br>
      Which leads me to the following—</p>
      <p>Bill, my comments about pure science relate to Peter's "where the science of reading and typography meet", i.e. more about the visual presentation of this paper than its text content.</p>
      <p>I'm no more interested in pure science than scientists are interested in pure typography.<br>
      However, I suspect I know more about science (a couple of A levels) than most scientists know about art, design, and typography. Part of this is because art is dropped as a compulsory subject in high school, while one is forced to continue with maths and science.</p>
      <p>The science I keep up with is mediated: <em>New Scientist</em> magazine, and books like <em>Guns, Germs, and Steel, The Invention of Clouds, This is Your Brain on Music, Awakenings</em>, and the totally awesome <em>The Physics Of Consciousness: The Quantum Mind And The Meaning Of Life</em> (Evan Harris Walker).</p>
      <p>As Peter observes, the "ecological" approach of the content is a step in the right direction, but the design of the document indicates that the paper is targeted at scientists, not typographers.</p>
      <p><em>So it's up to us then to make use of that understanding.</em></p>
      <p>No, I suggest it's the responsibility of scientists to make sure their research is properly presented and understood by the profession into which they're poking their noses, and by the general public of font users, bearing in mind that the press will mangle their findings horribly.</p>
      <p>This is particularly germane as they are presenting their work in the medium which they are investigating.</p>
