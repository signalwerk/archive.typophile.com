      <p>In climate change, I agree, but if the only choice available to prevent catastrophic global warming is a drastic cut in energy use, with all the economic consequences that entails, I'm not surprised at the preference for wishful thinking.</p>
      <p>The thing is, I believe that we have an option that both solves global warming and gives us secure and plentiful energy supplies. Nuclear power.</p>
      <p>In economics, while there is much about economics that is scientific, the discipline as it exists at present has, in my opinion, blind spots.</p>
      <p>Marxism may be to scientific economics as astrology and alchemy are to astronomy and chemistry; but the rich and powerful of free-enterprise societies have managed to partially corrupt the discipline of economics as it is practiced here as well, I fear. Although the history of George III and the American Revolution may be part of the problem.</p>
      <p>Here's a simple example.</p>
      <p>Let's say it takes you three hours to mow your lawn. It would cost $30.00 to have a professional lawn care company come in and mow it fore you. At your regular job, you are paid $15.00 per hour.</p>
      <p>Now then: your local city council passes a law that says it's illegal to mow your own lawn, and you <em>must</em> hire a lawn care company to do it.</p>
      <p>Have they just saved you $15.00?</p>
      <p>The answer is, not necessarily. Maybe things are slow where you work, and so you're on a three-day work week. So you don't have the option of working an extra two hours at your regular job to earn an extra $30.00 to have your lawn mowed.</p>
      <p>Therefore, you would be better off if you could transform an additional three hours of your labor into additional wealth, even if less efficiently, by mowing your own lawn.</p>
      <p>But if you go to a conventional economist, and suggest that the country would benefit if tariffs were raised, so that unemployed people could produce things that are currently bought with (scarce! - we keep having to fight with other countries to get them to lower their trade barriers) foreign exchange as cheap imports... he will tell you you're crazy, and Adam Smith proved that this is all a load of bunk, and so on.</p>
      <p>Now, quantum mechanics and special relativity do tell us that when a scientific discipline contradicts "common sense", it's not <em>necessarily</em> wrong. But Adam Smith's arguments were presented in plain English (and they're applicable to some cases; India's ban on gold imports are an example) not differential equations. So we're not dealing with stratospheric heights of reason far beyond a layperson's understanding.</p>
      <p>Of course, when other economists are right, they're ignored - I suppose you may have been referring to the repeal of Glass-Steagall and things like that. But there were economists who said it was safe to do that.</p>
      <p>As "The Adventures of Unemployed Man" recounts, only one renegade Economalien warned of the danger...</p>
