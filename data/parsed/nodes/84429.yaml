      <p><em>And here you are just flat wrong: there are sound conclusions from research saying "font A is more readable than font B," under a specified set of conditions, with a particular measure.</em></p>
      <p>Bill, that's what I said, but drew a different conclusion.<br>
      It doesn't prove that font A is more readable than font B, except in a very specific set of circumstances.<br>
      How many asterisks should one add for circumstances other than highway signage?<br>
      This is product testing. What scientific hypothesis does it address?</p>
      <p>**</p>
      <p>I am being quite specific about readability.<br>
      It's the document that is being measured, not the typeface.</p>
      <p>In the first place, a typeface is not a physical object the performance of which can be measured like a machine or a biological organism, or chemicals in a test tube.<br>
      It is a set of abstract shapes which exist in the collective and individual conscious.<br>
      Fonts, which scientists purport to measure, are another matter.<br>
      But they are under the impression that fonts are a set of hard and fast shapes.<br>
      They are not.<br>
      Fonts are instruments which are used by typographers (or whomever) to create documents.</p>
      <p>What is being measured is not the readability of typefaces or fonts, but the readability of the handiwork of people using these tools, as well as the reading ability of the test subjects.<br>
      The measurement tool is not a direct inanimate gauge, but the response of a select cultural group, filtering the instrumentality through the medium of language.</p>
      <p>What is being measured, the readers or the document?<br>
      It is certainly not the typeface, at anything other than a vast remove.<br>
      This cultural complexity is what makes the scientific concept of "typeface readability" so soft.</p>
      <p>It's pointless to compare the readability of anything so general as typefaces, when their functionality is so specific to media — just look at the way that hinting methods and browsers produce an array of readability from the same typeface.</p>
      <p>Compare font as instrument with musical instrument.<br>
      What is the playability of a musical instrument?<br>
      Different musicians can play the same notes and produce quite different effects.<br>
      The listening environment has some effect.<br>
      And one can hear the same music and be moved to tears, later, to boredom.</p>
      <p>Another set of playable instruments: golf clubs.<br>
      I don't believe science can tell you whether to use the wood or the iron, to chip or pitch with your wedge, and so on.</p>
      <p>The paradox of type is that that part of the instrument appears to be part of the output.<br>
      But it never is—the process always transforms the font.<br>
      Just is there is no homunculus within one's brain, representing one's ego, there are no letter shapes in digital fonts, they are pure data.</p>
      <p>Bill, I am no reactionary luddite.<br>
      I'm a debunker of bad science, and I would have thought that an advocate of science and typophile such as yourself would support rather than admonish me.</p>
