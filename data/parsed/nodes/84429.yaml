      <p>Nick, I tend to see the paper’s greatest strength where you see it’s most outstanding weakness — in showing convincingly that legibility (the fluent range / the zone of robust affordance) is not a narrow ledge but a wide plateau. I suspect this can be generalized to include factors other than size. </p>
      <p>This perspective might counteract the tendency prevalent among design clients to rely on sources claiming 12 point is the most legible size and Times New Roman the most legible font.</p>
      <p>Yes designers and typographers tend to stay within the fluent range. But designers also know there are optimums within this range whose impacts are not effectively measured by reading speed. These optimums exist in the realms of boldness, spacing, configuration, and have to do with visibility and readability as explored by Matthew Luckiesh and Frank Moss. Optimums are niche-sensitive, and subject to countervailing pressures. These pressures include issues of gestural-atmospheric thrust (‘personality’). Type professionals are expert at managing the pressures in relation to the niche. Visibility and readability constraints appear to differ for signage and way finding (including way-finding on screen and in publications), as opposed to continuous reading for extended periods of time.</p>
      <p>So for me the paper is excellent in what it tries to do, but doesn't go far enough.</p>
