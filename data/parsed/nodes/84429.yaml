      <p>Nick you don't seem to be aware that there is already research showing that different typefaces have different readability. Even by the reading speed standard, I believe that italic faces are shown to be slower in reading text than roman. I believe this is a very robust result, but I'd have to check on the studies. </p>
      <p>And as I have reported, Luckiesh distinguished readability of text by reading fatigue as indicated by blink rate, and did get differences not only on different typefaces, but also on light, medium, bold, and extra bold. </p>
      <p>And using a distance test on signs, the testers of Clearview type found the medium Clearview weight to be readable at a greater distance than the federal standard Highway Gothic Bold.</p>
      <p>There are different aspects to readability, but on reading speed, blink rate, and distance, all different measures, differences in typefaces have show up. </p>
      <p>Also you see to think—absurdly on Typophile!—that practitioners *agree* on craft, which is far from the case. For example, Theodore Low de Vinne in 1885 strongly attacked Scotch moderns for their high contrast, arguing that they were less readable than old styles. And he influenced the design of Century, which thickened hair lines. You have revived and defended the readability of Scotch modern. </p>
      <p>There is lots of disagreement about craft—just look at the hinting threads!—and tests have indeed distinguished the readability of different type faces. Wake up and smell the coffee.</p>
