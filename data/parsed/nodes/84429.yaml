      <p>Nick, one of the things I found notable about this article -- I've only read in detail the section dealing with spatial frequency, since I've read earlier papers on that subject and believe it provides insight into the how and why of type design for different sizes -- is that it directly references the writings of typographers such as Harry Carter and Bigelow himself (Caslon, Dreyfus, Frutiger, Fry and others appear in the bibliography and are similarly referenced elsewhere in the article), and seeks to reconcile the findings of the study to the craft description provided by those writers.</p>
      <p>So, for example, the authors cite Carter:</p>
      <blockquote><p>“Legibility is all that matters in 6- to 12-point types; so that their successful design is a technical, and not in the ordinary sense an artistic achievement. In the design of founts from 20- to 72-point the artist comes into his element.”</p></blockquote>
      <p>And then attempt to express an understanding of this statement in terms of their findings with regard to spatial frequency. In what way is that showing 'absolutely no outreach to typographers'?</p>
