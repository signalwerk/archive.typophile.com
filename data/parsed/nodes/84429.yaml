      <p>Nick you are equivocating about the meaning of "science", and how general something has to be to count as science. But in any case you originally were talking about sound "conclusions from research." This is empirical research, and scientifically valid because it is testable through observation and experiment, and is repeatable. And it is valid in spite of the many variables involved. They controlled the other variables and got a scientifically valid comparison. That is what is at issue, not how universal the theory is. Again, a red herring. </p>
      <p>You are also simply repeating that there are too many variables, begging the question. And again, this just shows an ignorance of science. There are a myriad of variables involved in biological processes in the body, but this hasn't stopped science from testing the influence of particular processes, such as red blood cells in respiration or insulin in sugar use. </p>
      <p>At any rate, I have concluded that it is futile to try to shake you from your certainty that you will never have anything to learn from science about the readability of typefaces, and I'll stop here. </p>
      <p>I am very interested in hearing more about the content of this paper though.</p>
