      <p>Nick, my last was cross posted with yours. </p>
      <p>The test of Clearview vs Highway Gothic were NOT just a test of documents, they were a test of typefaces against each other for highway signage. </p>
      <p>What is being tested is the hypothesis of what is most readable at a distance when taking up a comparable size of sign. This is a test of typefaces in a given CONDITION, not a given document, and thus they do refute your statement, and your false claim that science can't ever compare typefaces, only particular documents. They can test for typefaces under given conditions, that is, broad CLASSES of documents (unlimited in actual number), such as highway signs.</p>
      <p>The hypothesis being tested is not of the generality as would be an hypothesis say about the ideal combination of stroke weight and width of character. But it still has generality because it applies to a broad class of events, and predicts that Clearview Highway will be consistently readable as greater distances. This has some universality and so is a scientific hypothesis. </p>
      <p>Nick I don't know what exactly your views are about science, but your declarations on what science can't research seem to me not only anti-scientific, but demonstrably wrong. You don't seem to understand how controls work in science, and how these can be used to test particular variables in particular conditions, even when other factors that normally influence the results are present. You control those other variables—such as size and distance—and test the impact of one variable—typeface in the case of Clearview vs Highway Gothic.</p>
