      <p>[Nick] “Nonetheless, I don't believe that the integral effect is a straight sum, as it were, of the the components of a layout—which is holistic.”</p>
      <p>What do you suppose “integral effect” means?</p>
      <p>“… readability / too soft … [s]cientists may think otherwise …”</p>
      <p>Ease of rapid automatic visual word-form resolution for a particular type of a particular weight in a specific setting is in principle quantifiable. Luckiesh’s work with blink rate suggests that this is so. It seems to be a matter of the efficiency — or signal-to-noise ratios — in the cortical integrational routines. These routines comprise the gathering of statistics about the prototypical identity, local combinations and global distribution of the role-units spread across the word. The gathering of statistics about prototypical identity, a process I call quantization, relies on what is known today as feature-binding. To arrive at the knowledge that component x is an ascender, the visual system must bind statistics about length to statistics about aspect; similarly, to arrive at the knowledge that component y is a b or p-type bowl, the visual system must bind statistics about closure to statistics about curvature. Feature binding, local combination detection and global distribution discrimination are arguably — and presumably measurably — less efficient under crowding or with noise, or under conditions of non-optimal phase-alignment.</p>
      <p>Ease of moving along the line for a particular type at a given size, leading, line length and inter-letter spacing is tractable as well, by studying ocular mechanics.</p>
      <p>Your idea of readability involves more than ease, but (if I've got your usage right) embraces it. That”s okay, but saying readability is to soft is to hard and fast.</p>
