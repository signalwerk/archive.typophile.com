      <p>One more piece of science that confirms the obvious.</p>
      <p>So "sub-fluent" sizes are used for pocket bibles, footnotes and stock tables? Well, yeah.<br>
      And at the other end, 20% of headlines outside the range have very few words. Uh-huh.</p>
      <p><em>…where typography and the science of reading meet…</em></p>
      <p>They are still far apart. They would be a little closer if studies like this showed specimens (at actual size), and were set in a manner that typographers might find more appealing.</p>
      <p>This study looks just like any other study written for scientists, and shows absolutely no outreach to typographers.</p>
