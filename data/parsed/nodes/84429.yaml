      Why has no-one thought of this? After all, Don Knuth is a star.</p>
      <p>John, up until 1960 <em>The Penrose Annual</em> separated its content into General Articles and Technical Articles, which always had exemplary design and typography of charts and graphs. </p>
      <p>Edward Tufte has opened the eyes of a lot of designers to the possibilities of The Visual Display of Quantitative Information, as have exhibitions at the Design Museum in London.</p>
