      <p><em>…is confirmation or refinement of accumulated craft knowledge of use?…</em></p>
      <p>It banalizes. The privileging of speed as the measure of readability says it all—the hammer is the only tool in the box.<br>
      Other measures, e.g. whether the reader remembered the message or responded to it, are so much softer, but these are what really matter to the practitioner.</p>
      <p><em>Is it not of interest to you that — as the Legge / Bigelow paper explains — at text-letter sizes the spatial frequency channel used by the visual system filters information at the density of 3 cycles per letter?</em></p>
      <p>Yes, it's fascinating. But the importance of designing white space is not a scientific discovery. I was taught it in first year Foundation at art school, according to Itten, and subsequently by my calligraphy teacher who started us off doing pages of "o"s and "n"s. It appears to be self-evident to most designers and artists, appearing in patterns since the early days of human culture. I would assume that we were inspired by Mother Nature's patterns in animal and insect markings, so figure-ground relationships may be a quality of fractal-growth shapes.</p>
      <p>PostScript language, as a means of defining letter shape, places emphasis on vector edge lines rather than solid shape, but at the same time, FontLab offers one the option to draw glyphs in either solid or outline mode, and view "clean" by hitting the grave key. Following this <em>line</em> of thought, drawing type glyphs rather than punching them would seem to be the paradigm shift, implemented by pantographic router (woodtype) and LB Benton's device.</p>
