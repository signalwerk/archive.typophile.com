      <p>I totally think science should not be above criticism, especially as criticism from observation and experiment is the heart of scientific method. And of course it should not be above ethical scrutiny either. My presentation at TypeCon had plenty of criticism of science and scientists, both about method and ethics—especially of Tinker, but also of Luckiesh. </p>
      <p>But typographers and graphic designers also shouldn't be immune from criticism. "Poking their nose" into typography implies that it is somehow illegitimate or improper for science to do research in this field. Typographers are so superior that they can tell scientists to keep away. That's where I think Nick's complaint is pompous and wrong.</p>
