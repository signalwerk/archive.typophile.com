      <p>@Nick Shinn:<br>
      <cite>John, up until 1960 <strong>The Penrose Annual</strong> separated its content into General Articles and Technical Articles, which always had exemplary design and typography of charts and graphs.</cite></p>
      <p><cite>Edward Tufte has opened the eyes of a lot of designers to the possibilities of The Visual Display of Quantitative Information, as have exhibitions at the Design Museum in London.</cite></p>
      <p>Good visual communication and layout is a very desirable thing, and I don't mean to suggest otherwise. But the <em>Penrose Annual</em> is a place where designers are published, and it isn't reasonable to expect psychologists to be designers <em>even</em> when they're attempting to study design.</p>
      <p>Readability, as opposed to legibility, is a subject that at least seemed to be soft enough to be difficult to study. Recently, in these forums, it was noted that an early method used to test readability by measuring how often a reader blinked as a measurement of the effort made in reading had been rediscovered after a period of neglect.</p>
      <p>I consider that to be very good news, since it seems to mean to me that there is finally some hope of there being some useful valid scientific input on readability.</p>
      <p>But I will admit that we can't expect too much. If one looks at science news about, say, discoveries about human behavior and society through observation of primates or other scientific studies, what one will often find is scientific evidence of things everyone knew about human nature - on the level of platitudes.</p>
      <p>So typographers aren't likely to learn a lot of things they didn't already know from readability research. Having a "scientific" basis for what they already did know isn't usually going to be directly useful; we're past the point where a designer needs "scientific <em>proof</em>" in order to convince a client that six-point type is not optimal for readability.</p>
      <p>Eventually, though, working in their own way from a solid foundation, instead of taking what "everyone knows" for granted, I think that psychovisual researchers will find occasional unexpected nuggets of information that will enrich typography.</p>
      <p>But it won't be much or soon - yes, they are in their own little world, as it were, with only limited relevance to the practising typographer. That's not something to worry about, it's just the way it is.</p>
