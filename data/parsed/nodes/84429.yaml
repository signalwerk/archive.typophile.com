      <p>Ok here is about the issue of layout and readability, which you Nick, asked about. </p>
      <p>For a start, I think it is important to realize that there are different measures of readability, reflecting different aspects, and they may not agree. For example there are threshold measures regarding contrast, Luckiesh's "visibility". And there is of course reading speed, a performance measure. There is also the performance measure of ability to read at a distance. </p>
      <p>In addition there are fatigue measures, such as Luckiesh's measure of increase in blink rate over time. If we take this supra-threshold idea of "ease of reading," meaning low effort or low fatigue, then there are obviously many factors affecting readability. </p>
      <p>For starters, there are huge factors that don't involve visual features, once you are above visual threshold levels. The research on fatigue, such as that discussed in the book Cognitive Fatigue, edited by Phillip L. Ackerman, shows that interest and skill of a person makes a huge difference to time-on-task fatigue. If the subject is boring or too difficult for the reader, he or she will find it extremely fatiguing to try to read. Similarly, how well written the text is, from the point of view of rhetoric, will also have an impact on reading fatigue, as whether it is enjoyable to read will affect reader fatigue.  </p>
      <p>Above visual threshold levels, these non-visual aspects I suspect are in general more important than the visual ones—either layout or typeface—to reading ease or fatigue.</p>
      <p>However, both layout and typeface have an impact, as Luckiesh found. Luckiesh found that both leading and line length for a given typeface affects reading fatigue. Luckiesh did not test this very broadly but his results seem pretty good.</p>
      <p>Luckiesh did get somewhat surprising results here, finding that shorter lines than normal typographic practice in books are less fatiguing. Here I think there needs to be more research on fatigue vs reading speed. It may be that there is some gain in reading speed with longer lines even if they are less fatiguing. Also Luckiesh's blink tests generally need to be reproduced using his guidelines, which nobody has attempted yet.   </p>
      <p>Tinker tested leading and line length, but on these issues I don't think his Chapman-Cook reading speed is reliable, because it involved a search task as well as a reading task. Also his results run too contrary to typographic wisdom, and also lack any smooth curve. Frankly on this issue I dismiss Tinker's results as unreliable. </p>
      <p>I believe that other researchers have duplicated Tinker's finding on italic, and I wouldn't buy it from Tinker alone, though the search task may not have had such an impact. </p>
      <p>Luckiesh did find a difference between typefaces, and most notably between different weights of the slab face Memphis, with the medium weight being more readable than the bold or the light. </p>
      <p>And yes, Nick, even different versions of Caslon might be expected to have different readability. Luckiesh found Caslon Old Face less readable measured by blink rate, though not by reading speed. However, judging by his book, this was Caslon Old Face printed on coated paper, which is thin and spidery. It had "low visibility" as measured by Luckiesh's visability meter, because of its lightness. Caslon Old Face when printed by letter press on rough paper was a much more dark and robust face at text sizes—really a different face. For this reason both Monotype and Linotype showed their Caslons on both rough and smooth paper. </p>
      <p>My own Caslon follows the weight of Linotype Caslon Old Face printed on rough paper. Particularly at 10 point, I think it looks more robust than Adobe Caslon, and I would expect mine to be better, though the differences may be small. </p>
      <p>Overall, different typefaces call for different settings to be at their best, and I expect that traditional text faces will not have great differences when set at their best. But I do expect differences. </p>
      <p>Now because how inviting the overall layout is, and aesthetics influence readability in terms of fatigue, I expect for good text faces the differences will be a smaller part of the pie, so to speak, compared to good writing and good aesthetics. </p>
      <p>But typeface being a small part of the pie on issues of fatigue doesn't mean that it can't be tested. By rigorously controlling other factors, including interest of reading material, illumination and distance to reading material, Luckiesh was able to get results that I think should be reproducible. </p>
      <p>Finally, let me say that I expect that some of the most boring and most difficult materials are likely to benefit most from good typography. Thus timetables and phone book and other similar reference material most benefit in readability from good typography. Similarly text books, which are often demanding and sometimes not the most interesting material I think are helped greatly by good layout. </p>
      <p>Overall, I think the fatigue measure is most likely validate a lot of typographic layout practice that reading speed alone doesn't do a good job of differentiating.</p>
