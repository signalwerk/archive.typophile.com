      <p>[Nick] “I don't think there is any way that scientific knowledge of how reading works can add anything useful to what we, as typographers and type designers, already know […]”</p>
      <p>Nick, is confirmation or refinement of accumulated craft knowledge of use? Does it help or add something to have explicit empirical confirmation (in the realm of establishing statistical significance), and a graphic visualization, for the tacit knowledge of designers that, from the point of view of general legibility, there is a fluent range?</p>
      <p>Is it not of interest to you that — as the Legge / Bigelow paper explains — at text-letter sizes the spatial frequency channel used by the visual system filters information at the density of 3 cycles per letter? In a typical letter this corresponds to the stroke on the left hand side of the letter, the counter adjacent to it, and the stroke on the right. I take this to confirm the fact that in reading at normal text sizes, cues to the identity of the words are drawn from all three areas (as well as perhaps, the between-letter spaces), so designing the white (or what happens in the counter ‘domain’) in conjunction with the black has a real significance.</p>
      <p>I know, you’re allergic to certain types of claims, but I think your negativity about this paper is warranted. It’s a step in the right direction, though I might have questions about some of the assumptions made in the explanations section.</p>
