      <p>@Nick Shinn:<br>
      Clearview is superior to Highway Gothic in most respects. However, I can see <em>one</em> advantage Highway Gothic has: it is bolder.</p>
      <p>So, under one set of poor viewing conditions, the Highway Gothic characters might become white blobs. Under another, the Clearview characters might become invisible. At least it is possible to see the shape of a blob.</p>
      <p>This is not to say that I think Highway Gothic is better; it clearly isn't. Just that it seems as if it should be possible to do even better than Clearview - if it were made slightly bolder, its superiority over Highway Gothic (if that's its main competition) would be made more obvious and indisputable to even the most typographically unsophisticated individual.</p>
      <p>Ah, but after a short search, I see that it was deliberately made significantly lighter because at night, when there legibility is usually the most serious problem, signs hit by headlights and seen by drivers with vision problems will likely have the white area appear to expand, and so the design was intended to deal with that specific problem. And the adoption of Clearview as the replacement for Highway Gothic is proceeding apace, and so there's no problem with acceptance by state road authorities.</p>
