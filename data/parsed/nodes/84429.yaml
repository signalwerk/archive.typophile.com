      <p>I already know that x-height is the main effect on functional type size, and that newspaper types have a larger x-height than book types, and am not surprised that Times Roman falls bang in between.</p>
      <p>The conclusions as to type size in the different genres are of course common knowledge to typographers, as we are the ones who determine those sizes!</p>
      <p>I'm very impressed that type size is discussed in terms of visual angle, and that cultural categories of publications are analyzed en masse, statistically.</p>
      <p>The documentation of historical trends is not interesting per se, as again, this is well-known to me as a typographer with some knowledge of type history. However, I do find the hypotheses presented to explain these trends interesting, although this is not really the realm of science, as I don't need science to tell me that, for instance, Incunabula type was quite large.</p>
      <p>Statistical analysis of type history is fascinating, but it's about social culture, not human visual processing.</p>
      <p>For instance, the paper notes that subfluent sizes proliferated in the 16th-18th centuries, and hypothesizes that economic reasons restricted type size. But I would argue that while that may have been the case, the sizes themselves were not subfluent, because people would have just held the books closer to get the angle up to 0.2°.</p>
      <p>The paper's historical analysis of historical types is, IMO, flawed in the frequent manner of relying on extant type specimens, rather than type in use. Robert Thorne, for instance, issued no type specimens during his foundry's most prolific years; too busy. I have published type specimens, but the amount of usage of the types, based on sales or volume of readership cannot be construed from the specimens. </p>
      <p>I theorize that hardcover books have larger type because they are heavier, so people are less likely to hold them close, which is tiring, so they rest them on their laps, further away.</p>
      <p>I'm not impressed that fluency is assessed by speed in lab tests.<br>
      Of course, that can;t be done for history.</p>
      <p>I find it particularly meaningless to typographers that the paper comes to the conclusion that almost all running text and most display text falls within the "fluent" range of 8 to 80 points.</p>
      <p>Do we really need scientific confirmation of a theory that most type is set in a convenient size to read, which is 8 to 80 pts?</p>
      <p>I don't therefore believe that the concept of "fluent reading range" is of any scientific use.</p>
      <p>You might just as well say that people generally wear shoes that fit them.</p>
      <p>I'm afraid I'm not really interested in this kind of material in the guise of science, because I'm not interested in pure science, and only read this paper reluctantly, as it was recommended by Peter. But I would be interested in it if it were in the form of a well-illustrated, well designed book <em>A History of Type Size</em>, viewing type history through the prism of size, with all the facets of the ecological approach of which this paper speaks, one of which might be sidebars with its charts and graphs, but not too much else in the way of science. I don't think such an "anecdotal" cultural study would suffer from a lack of significance.</p>
