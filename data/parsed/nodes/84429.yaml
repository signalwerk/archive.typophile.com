      <p>Russell is right about what the research seems to indicate: that the boldness is a problem. The concept is that the increased counter space (white space) helps readability at a distance. By the way, I think it would be interesting to see whether this holds for visual acuity, or it is mainly for whole words. In other words, testing letters on their own vs several words. </p>
      <p>Incidentally this result aligns with Luckiesh's finding that it was less fatiguing, measured by blink rate, to read the medium weight of the slab serif Memphis, compared to the light and bold weights. Frutiger has also argued that there is a "right" normal weight, and the concept goes back to scribal practice, with an ideal ratio of nib width to height of strokes.</p>
