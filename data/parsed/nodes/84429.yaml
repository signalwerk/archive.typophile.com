      <p>Nick, this is your claim that I was contesting by pointing out both the case of italic vs roman, and the specific test of Highway Gothic vs Clearview Highway. As I said what you can test and give results about is a comparison of fonts under similar conditions, with the same measure. And here you are just flat wrong: there are sound conclusions from research saying "font A is more readable than font B," under a specified set of conditions, with a particular measure. </p>
