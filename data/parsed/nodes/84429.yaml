      <p>[Nick] “It's the <em>document</em> [my contrastive emphasis throughout] that is being measured, not the typeface.”</p>
      <p>I think this statement needs to be refined.</p>
      <p>Strictly speaking, <em>response patterns</em> to <em>specific settings</em> under controlled environmental conditions <em>using</em> manufactured <em>documents containing type</em> are being measured. This is to make claims about affordances of a specific typeface at a certain size, line length and leading, or to make comparative claims about affordances at different sizes, leadings, etc for different types or settings. The focus of attention can also be on types of types.</p>
      <p>Since affordances change at different sizes, etc., any claims about the legibility of the letters in the font or the readability of the type in use will have to be conditional, not absolute.</p>
