      <p>@Bill: <em>The hypothesis being tested is not of the generality as would be an hypothesis say about the ideal combination of stroke weight and width of character. But it still has generality because it applies to a broad class of events, and predicts that Clearview Highway will be consistently readable as greater distances. This has some universality and so is a scientific hypothesis.</em></p>
      <p>That's not a broad class of events, when considering the huge variety of media and documents in which fonts can be used.</p>
      <p>This is a font product test of Highway Gothic vs. Clearview, for a very specific kind of document (a certain kind of highway sign), and has very little universality or generality. Highway signs are a tiny, odd niche of typography.</p>
      <p>Bill, do you seriously believe that the hypothesis "ClearviewHwy 5-W  is a better US highway sign font than Highway Gothic E(m)" is hard science, and not merely font product comparison? The extreme conditionality (to use the term introduced by Peter) of such "research" (with a dose of product marketing) is what makes the science so soft if any universality is to be claimed. </p>
      <p>Highway signs are designed, as are driving conditions (by highway engineers and legislators), and therefore it is wrong to even assume that the US results today would be applicable elsewhere or in the future, although they probably are, given the crudeness of Highway Gothic fonts, and the top-notch design of James Montalbano.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rd_fig2_4264.png"></div><p></p>
      <p>I hypothesize that 99% of graphic designers would choose Clearview.<br>
      How could anyone with a modicum of typographic acumen not pick Clearview, with its larger x-height and more open counters, to be the better face for this job?</p>
      <p>However, it is wrong to see the Clearview vs. Highway Gothic font tests as a refutation of Highway Gothic as a typeface—Interstate, a version of Highway Gothic with comparable sophistication, weights, and styles to Clearview, would no doubt give it a run for the money.</p>
      <p><em>You don't seem to understand how controls work in science</em></p>
      <p>I have consistently stated, in the many Typophile posts in which I dismiss typeface readability as a scientific notion, that the multiplicity of variables involved in typography, and the elusive quality of many them (hard to control), makes this aspect of reading research so soft it's bunk. </p>
      <p><em>Incidentally, Bigelow is the co-creator of the Lucida type family, winner of the MacArthur Prize and Goudy awards, and head of RIT's School of Print Media. The idea that he is in this paper with scientist Legge "poking his nose" into something he doesn't know about is laughable.</em></p>
      <p>Yes it is Bill, and I would never suggest that. If you review what I said, I criticized the scientific profession in general for poking their noses, and Mr Bigelow is not a scientist AFAIK, so you are twisting my words.<br>
      Bully for him for getting involved in this inter-disciplinary project, and including design literature sources in the review.<br>
      Now let's see him finish the job and present this work to his own profession in an appropriate manner.</p>
