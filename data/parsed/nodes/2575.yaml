    votes: null
    html: <p>I think it's fairly clear that this was a custom lettering job.  <br>The letterforms have typical modern characteristics, but I  <br>doubt you will find an exact match among existing fonts.  <br> <br>The distortions you're seeing have to do with the fact that it  <br>was drawn as an italic, not simply slanted from upright  <br>artwork. When you slant ovals, you get an unnatural looking  <br>south-west to north-east diagonal stress. Correctly drawn  <br>italics are designed to compensate for this distortion. (You  <br>can see the compenstaion if you back-slant them to  <br>upright.) In this case, there appears to be a bit of over- <br>compensation.</p>
