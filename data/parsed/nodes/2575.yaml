    html: <p>I was fooling around with Photoshop, trying out various Century variations, applying strokes etc. <br> <br>When I tried to match my creations on the top of the original "Concorde", I noticed some strange irregularity. <br> <br>Finally I decided to skew the sample straight (straight "r" and "d") to really see what was going on and this is the result. The original sample is also distorted quite a bit (looks almost like every character was rotated separately, maybe it's an italic after all?:-o), It's difficult to say why because we don't have any info where the sample is from. <br> <br>Yves, I thik it might still be some version of Century, like Expanded Bold (it has a different r) <br> <br><img src="http://www.typophile.com/forums/messages/83/23345.gif" alt=""></p>
