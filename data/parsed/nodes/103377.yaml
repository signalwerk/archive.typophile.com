    <p>Hello everyone.</p>
    <p>Here I am to present you this Riviera, my first attempt to design a font. The project started in the late 2005, when I hand-designed some capital letters to present a project.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/13-05-29_09-29_RivieraReg1_6705.jpg"></div><br>
    Now I'd like to complete it. In my mind it should be a display font inspired and recalling the modern movement, '50 etc. Until now I designed a to z lower and uppercase. Numbers are just sketched, I need some time to fix the thicknessess; punctuation and glyphs are not yet drafted. Maybe in future I'll develope different weights versions, but now I want to define this medium weight one.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/13-05-29_09-29_RivieraReg2_4401.jpg"></div><br>
    Here there is a little test page:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/13-05-29_09-29_RivieraReg3_3623.jpg"></div><br>
    I know there are some problems. /S/ is quite ugly, although /s/ satisfies me more but not at all; /r/ is not so good, the cut seems sharp; and many more things that probably now I can't see. Expecially I'd like to ask you an opinion about the general rythm and the relation between letter width. I think there's something that doesn't work but I can't understand what.<p></p>
    <p>Thank you in advance<br>
    Best regards<br>
    Stefano</p>
    <p>Pdf is attached to take a closer look</p>
