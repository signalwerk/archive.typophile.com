    html: |-
      <p>I took a close look and i really like the shapes. Especially the K’s are beautiful. So i started to wonder what thicknesses you where referring to. IMO the thicknesses are fine.</p>
      <p>Trying to write about potential to improve i would say:<br>
      The /g’s and /e’s lower curve may be a bit to small for my taste but as a monitor font it will certainly work well i think. The optical baseline is a bit bumpy because there are no down-/upstrokes on /u /r ect.</p>
      <p>i hope this helps</p>
      <p>best regards</p>
