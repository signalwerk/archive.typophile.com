  html: |-
    <p>Mobile devices are not just for consuming information, increasingly smartphones are letting users create content. This is certainly more of an entertainment app than a professional design tool, but for a buck, why not?</p>
    <p>The <a href="http://itunes.apple.com/WebObjects/MZStore.woa/wa/viewSoftware?id=314072879&amp;mt=8" rel="nofollow">TypeDrawing</a> app ($1 USD) for iPhone is a good, interesting example. </p>
    <p><a href="http://itunes.apple.com/WebObjects/MZStore.woa/wa/viewSoftware?id=314072879&amp;mt=8" rel="nofollow"></a></p><div class="imageWrap"><a href="http://itunes.apple.com/WebObjects/MZStore.woa/wa/viewSoftware?id=314072879&amp;mt=8" rel="nofollow"><img src="http://typophile.com/files/typedrawing_iphone_3908.png"></a></div><p></p>
    <p>Check out the <a href="http://www.flickr.com/groups/typedrawing" rel="nofollow">TypeDrawing Flickr Pool</a>.</p>
