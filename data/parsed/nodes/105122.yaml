  html: |-
    <p>Please excuse the off-topic post, but if anyone here is using the Bento database application (by Filemaker) in your business, they've just announced that it'll be discontinued. </p>
    <p>Bento was far from perfect, but was great for someone who just needed a simple database. I've kept my business records on it for 5 years. </p>
    <p>Filemaker is offering a discount until Oct. 30 for registered Bento users who want to upgrade to Filemaker Pro.<br>
    <a href="http://info.filemaker.com/FMP_overview.html" title="http://info.filemaker.com/FMP_overview.html">http://info.filemaker.com/FMP_overview.html</a></p>
