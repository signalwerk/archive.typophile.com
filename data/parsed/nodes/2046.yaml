    html: <p>Obviously there are not that many Ikarus users amongst the Typophile attendees (anymore). Ikarus was developed by Dr. Peter Karow in the early 1970s and was for a long time the de facto program for professional font production. In time versions of Ikarus were developed by URW in Hamburg for all kinds of operating systems, including Solaris, Sun OS, DOS and Mac OS. The versions for DOS (Ikarus B/D) and Mac OS (Ikarus M) were more or less stripped end user editions which lacked most of the enhanced batch functionality of the 'bigger' Ikarus systems running under Unix.  <br> <br>The Ikarus algorithm has been developed for the conversion of analog material to digital descriptions. In the Ikarus system all points are placed on the contour, which for instance is not the case with B</p>
