    html: <p>In the preliminary drawing for the roman of DTL Fell two lines are used to indicate the thickness of horizontal serifs. The third line is a guideline for the overshoot but not more than that. The curves of the h, m and n do not touch the overshoot for the more rounded letters like the o. I would like to underline here that this is a very early drawing from a small series that was used by several people at DTL to make more definite versions. Basically the work on the typeface has almost been finished now; the character sets are complete but we still have to do some fine tuning here and there, especially the spacing needs some extra attention. I have included here a low res illustration to give you some idea of the work we have been doing since 1997.<img src="http://www.typophile.com/forums/messages/4101/22173.gif" alt="DTL Fell_trial"></p>
