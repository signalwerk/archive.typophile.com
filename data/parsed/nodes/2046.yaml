      <p><em>A little</em> IKARUS <em>trivia</em> </p>
      <p>-- IKARUS is (and has always been) spelled in all caps by URW, and to my knowledge is neither an acronym nor an initialism of any expression.</p>
      <p>-- Ever since I was introduced (1981) to the IKARUS System, I personally took issue with the name and foolishly argued the point with Dr. Peter Karow and Peter Rosenfeld. (Yes, I was, and forever will be foolish.) <a href="http://www.loggia.com/myth/daedalus.html" target="new" rel="nofollow"><em>My argument</em></a> was that in Greek mythology, Icarus was the foolish son of Daedalus, who once given mechanical wings by his father, ignored the warning of flying to close to the sun, and thereby fell to his death. Not a great person to name anything after, as Daedalus was the smart innovator and Icarus was the fool.</p>
      <p>-- <a href="http://www.myfonts.com/fonts/linotype/marconi/" target="new" rel="nofollow"><strong>Marconi</strong></a>, designed by Hermann in 1976, was the first type family developed for typesetting by the IKARUS System.</p><div class="imageWrap"><img src="http://typophile.com/files/Marconi-Zapf-URW.png"></div><p></p>
      <p>-- Because of this topic thread, I reopened my copy of Dr. Karow's book, <em>Digital Formats for Typefaces</em> (1987), and rediscovered several interesting visual excersises and references that would still be viable for graphic design students (<em>clothoids</em>, circle/square/triangle visual perception survey, etc.).</p>
