      <p>For those interested still in the Ikarus format, it might be interesting to know that a new edition (2.5) of DTL FontMaster will be released soon. IkarusMaster (like BezierMaster) includes several new options, including the possibility to import and export fonts directly. This functionality is the same as in DataMaster, but only for one font at the time instead of batching like in DM.<br>
      Programming has been finished recently and currently I am working on the update of the supporting files (Character Layout, Features, Kern[class], et cetera).</p>
      <p>Version 2.5 of DTL FontMaster will be the last released also for Classic besides Windows. Later in 2006 the first range of FM batch modules for OS X will be made available.</p>
