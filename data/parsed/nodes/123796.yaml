    <p>I am trying to generate diacritic glyphs like agrave, etc. but for some reason when I click generate glyph from the anchors preview window it is only generating for instance the a glyph and not the full agrave with the diacritcal mark. My anchors are named correctly and everything is perfectly fine within the anchors preview window...Never had this happen so Im kinda of confused. Tried generating the glyphs a few other ways same solution(or lack there of really.)</p>
    <p>Any ideas?</p>
    <p>Thanks,<br>
    David</p>
