    <p>Hello guys </p>
    <p>Would you be so kind, and have a look into that font collection please, and help me figure out how to get it to work?</p>
    <p>I bought tyepface call; "summit", from  <a href="http://lisidesign.com/font/summit" title="http://lisidesign.com/font/summit">http://lisidesign.com/font/summit</a></p>
    <p>"Summit contains 10 styles available in 5 weights. The styles One, Two and Three for both Solid and Inline versions<br>
    (as seen above) are designed to be used in conjunction with one another. This layering system offers an incredible<br>
    array of combinations and effects."</p>
    <p>For some reason the 5 weights display just fine, but their respective styles won't list. Only fraction of it.<br>
    I did talk to the author, and I was informed that he is aware of the issue happening to PC users. But yet to<br>
    find way to fix it. </p>
    <p>Here is the font in question:<br>
    <a href="https://www.dropbox.com/s/f9ezlc9ivb3zq7c/Summit.zip" title="https://www.dropbox.com/s/f9ezlc9ivb3zq7c/Summit.zip">https://www.dropbox.com/s/f9ezlc9ivb3zq7c/Summit.zip</a></p>
    <p>Could you please tell me what is wrong with it, and is there any way to fix it? I bought it for specific project, and the idea<br>
    is to use various styles of mix and match for building number, metal boxed up letters. But I can't move on, not being able<br>
    to use it. </p>
    <p>I will sincerely appreciate your expertise. </p>
    <p>Best regards</p>
    <p>Seba</p>
