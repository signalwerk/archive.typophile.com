    html: |-
      <p>Well, the reason it won't work is because the styles aren't named in a way which adheres to window's 4-styles-per-family rule. This could be fixed using FontLab or FontForge provided you understand proper font-naming conventions.</p>
      <p>The license is a bit vague on whether modification is allowed, but my reading is that fixing the name table would be allowed. On the other hand, the license does explicitly prohibit redistribution of the font so I'd strongly recommend that you remove this file from dropbox.com.</p>
      <p>André</p>
