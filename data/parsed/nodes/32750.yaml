    html: |-
      <p>Hi guys!<br>
      The client loved the direction! This is it! Now we'll go crazy in the refinement. Andrew, thanks for the positive feedback. I agree with you and I hope to correct the terminals real soon (I like C's ball terminal best too). I'm also not sure what to do with the serif on the J... it might need to be on both sides to sort of balance it (like a normal serifed capital J). Lowercase e might need more personality and I'll fiddle with that too.</p>
      <p>Paul, what interested me about the T was the fact that the arms (can't remember the typographic term for it now) are sort of bending up a little making it more triumphant. I saw a little bit of a female (with a moustache though heheheh) now (small head up the middle) and that'll be another card we can play if it comes up on the discussions...</p>
      <p>All in all, we're very excited on how this is coming along, and the process of posting stuff up here is really helping us! Thanks to everyone participating in the discussion! Be back soon with more stuff!</p>
      <p>P.S.: It'd be fun to hear Marian Bantje's comments on this... I think we would all learn a lot! If you are out there, we are big fans of your work :D!</p>
