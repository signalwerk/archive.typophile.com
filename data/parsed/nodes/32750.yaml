      <p>You could reinforce the serif of the i by treating the k in a less calligraphic way, instead of the loop you could use a straight line with a serif, keeping the swashy leg, it's a shame because I like the loop, but currently I cannot think of a better way to bring the i into the design. To add to the expensive (and hair) look you could combine one of the features in your sketches, the double line, a bit like Delphian, see if it is possible to keep the thin look though.<br>
