      <p>Hey guys, thanks a lot! Lex, thanks for the sketch, now I got what you meant and I think you're right. As for the ornament, it's still a work in progress, and this is one of other paths we're trying (I do tend to go simple and I need to work that out). Also, we still have to work out the "T" in Jackie T and we could go crazy on that (We've been researching a lot of ornamental designs, old and contemporary in order to get the ornaments just right). But you're definitely right when you say I have to add more flair to it. Will do! Check back soon with changes and hopefully new stuff!</p>
      <p>Tim, I like that bowl too, let's how it looks without it and if it's better, than I still have a bowled k to make an alternate for Jackie T's typeface :D Also the Delphian feature is a nice suggestion, but I'd say I'd still need more flair. Maybe some Marian Bantjes' stuff (<a href="http://www.bantjes.com" title="www.bantjes.com">www.bantjes.com</a>) would come in handy for the logo (though I'm not sure I could pull that off lol). Let's see how it goes</p>
