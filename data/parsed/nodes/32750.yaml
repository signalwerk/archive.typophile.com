      <p>Here is an evolution on the Jackie Type. I did some research on Bodoni's  swash letters which helped improve a little on the Capital J. The J on the middle one ended up with too small a terminal so I kept the old one. I rounded the J's curve a little more (it was sort of squarish). Also made some adjustments on the lowercase "k" (the curve leading to the terminal looks weird) and "e". Still a lot of work to do but it's an improvement.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jackie_revisions_4277.gif"></div><p></p>
      <p>Cheers!<br>
      Rodrigo</p>
