    html: |-
      <p>This is sort of off the question a bit ...</p>
      <p>Here's sort of something I do with my students when talking about setting type for books. I have them play around with what is available on the computers. Then when critiquing what they've come up with, I bring them into a detailed discussion that leads to: </p>
      <p>'Would you want to read this for, oh, 1,000 pages or so?'</p>
      <p>Once put in that context, it really narrows the field of type choices - Times New Roman suddenly gets really heavy, any Sans seem to fall away (except for the Most Determined of the Bunch to make Futura Book actually work) and display faces are shown the door (sometimes) ;)</p>
      <p>We seem to settle on faces that are traditional, but take into account Offset printing - the adaptations of Adobe's faces - Garamond, Jenson, Caslon - where thin strokes (which worked great in letterpress) have been modified to work well using current printing technologies - seem to hold up overall.</p>
      <p>At least, after searching everywhere for a good Shakespeare collection for my wife, we settled on The Pelican Shakespeare because (1) it was the most legible complete set we could find and we after purchasing, the colophon noted (2) it was set in Adobe Garamond. :)</p>
      <p>That doesn't really answer the question - but does lead to students exploring on their own what may constitute a good book face. </p>
      <p>Sometimes they get it, sometimes they don't. But they start taking it apart on their own and its fun to see where they go with it. </p>
      <p>And I get to get to say things like: 'Courier? No.'</p>
      <p>s.<br>
      mehallo.com</p>
