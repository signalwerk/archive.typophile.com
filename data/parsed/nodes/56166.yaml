      <p>&gt; <em>We seem to settle on faces that are traditional, but take into account Offset printing - the adaptations of Adobe’s faces - Garamond, Jenson, Caslon - where thin strokes (which worked great in letterpress) have been modified to work well using current printing technologies - seem to hold up overall.</em></p>
      <p>I was more looking for short (generalizing) factoids that make those hold up overall, like; relatively long asc/descenders, relatively wide spacing, maybe slightly heavier captials, prominent interpuntion, etc.</p>
      <p>For newspaper typefaces the demands are -- I think -- a bit more clear. Like every weight having more than one grade (to counter different presses / paper / dot-gain), large x-height (to be able to use small pointsize) and very prominent detailing and inktraps (so the inkspread is countered), etc. I was wondering if people here keep such things in mind when designing a typeface that is more for book usage. </p>
      <p>I understand the question was kind of silly, but I think such aspects make it clear for people to understand what kind of details a type designer might pay specific attention to when designing a typeface for certain kinds of use. :)</p>
