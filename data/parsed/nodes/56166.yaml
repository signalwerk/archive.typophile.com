    <p>I was wondering if you guys can help me compile a little list of things to keep in mind when designing a book typeface. For example, newspaper types have certain demands, which are usually much more clear, like relatively large x-height, short ascenders/descenders, different grades, very prominent details, etc.</p>
    <p>Are there such aspects you would pay attention to when designing a typeface for books? Or what makes a book typeface a book typeface.</p>
