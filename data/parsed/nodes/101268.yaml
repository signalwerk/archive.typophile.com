    html: |-
      <p>“every time [a] customer wanted to use this photograph, the original photographer got a little bit of money.”</p>
      <p>Everytime a customer wants to use most fonts we license, the original type designer gets a little bit of money, or more.</p>
      <p>Many type licensing companies also follow this "royalty" model for print and web fonts. </p>
      <p>There is another model where the type licensing company owns the font without royalties to any designer.</p>
      <p>The model in use depends on the font, in some type licensing companies, while others only license fonts without designer royalties involved.</p>
