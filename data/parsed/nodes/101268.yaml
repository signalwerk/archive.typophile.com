    <p>Keeping in mind I am not a type designer (AKA this might sound like a stupid question), and this may have been discussed in a previous thread…<br>
     ~~~~<br>
    Over dinner with an (ex)photographer friend of mine we got to talking about the various pricing models of stock photography companies — <em>that existed at the time he got out of the industry c 2004</em> — and one of them was to the effect of “every time a customer wanted to use this photograph, the original photographer got a little bit of money.”</p>
    <p><strong>Questions</strong>:<br>
    1. Does such a pricing model exist for typefaces companies?<br>
    2. What other pricing models are there? (not including web fonts)?<br>
    3. Who uses which model(s)?</p>
    <p>With this info, it should be fairly simple to create an informative matrix.</p>
    <p>This is just out of personal interest. Not for research, professional, &amp;c.</p>
