    html: <p>INK and PAPER were statements <em>and</em> PRINT modifiers. As statements, they set fg/bg for all following screen-affecting statements. As modifiers, they changed the colours temporarily. Look for a <a class="freelinking external" href="http://en.wikipedia.org/wiki/ZX_Spectrum" rel="nofollow">Sinclair ZX Spectrum</a> emulator if you want to play with this stuff.</p>
