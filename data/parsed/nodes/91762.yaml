    html: |-
      <p>FYI, FWIW — The machine used for the film’s titles is the Linotype. Those are the mats being assembled for casting, and the letters you see are the references stamped on the back so you can confirm your work as you key it in. (These reference letters are basically generic and not representative of the face and style being set.)</p>
      <p>There’s also a passing shot, early on, of an operator at the Linotype keyboard.</p>
      <p>On the other hand, the machine demonstrated at length — the one used for casting “George Lucas” — is a Ludlow, I’m pretty sure.</p>
