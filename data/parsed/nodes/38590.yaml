    <p>hey ppls. just found this site. working on a school project, and we’re doing a proposal for a monument in downtown halifax. A memorial piece for fallen peace officers. 17 names have to go on our structure, and am wondering about the history of type. What would be an appropriate typeface to be engraved? cartier book? trajan? not sure about the application as well. thoughts? much appreciated.</p>
    <p>k</p>
