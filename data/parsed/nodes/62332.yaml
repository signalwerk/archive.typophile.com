      <p>1. I don’t believe so, but would love to be told otherwise.<br>
      2. Either use index mode in the glyph window or create an encoding file that orders things as you want them ordered. You can always use one encoding file to develop a font and another to generate the final fonts.<br>
      3. Kerning classes are the answer. Yes you have to make a class for each key glyph.<br>
      4. Select everything in the font window (cmd+a) and run Contour &gt;&gt; Paths &gt;&gt; Set PS Direction. This might break a few glyphs if you have stuff running in too many directions, but usually it works fine.<br>
      5. If you don’t remove overlaps glyphs some programs will render the overlaps incorrectly. Likewise, not all software handles composites properly. <a href="http://benkiel.com/typeDesign/" rel="nofollow">Get Ben Kiel’s font generator script to do this automatically.</a><br>
      6. No.<br>
      7. Usually it means that you ran some kind of batch function on a bunch of glyphs and it failed on that one, marking it as red. If you got a VFB file from someone else, that designer may have marked it red as a reminder.</p>
