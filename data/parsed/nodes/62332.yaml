    <p>I've been improving with the Fontlab learning curve, and have encountered some issues/questions along the way. These questions might expose my inefficient amateur workflow, so I welcome any suggestions. Especially now, before I get too stuck in my wrong ways. Since I won't bother to bombard the board with multiple posts, I'll just list them out here:</p>
    <p>1. If I move the anchor of, let's say e, how can I get it to automatically update the positioning of é without deleting the glyph (slot still there, but cleared) and double-clicking it again? Also, when I try this with a character that doesn't exist in the current codepage, it deletes the entire glyph and I have to generate it. Any shortcut to that? </p>
    <p>2. Is there any way I can sort my glyphs so that scaron, scommaaccent, sacute, etc are next to each other?</p>
    <p>3. If I kern Nu, can I apply the kerning value automatically to Nú, Nù, Nû etc? If the answer's kerning classes, will I end up making a class for each base composite? </p>
    <p>4. With a few hundred glyphs, is there anyway to quickly check if all my contours are in the right direction?</p>
    <p>5. How come I must decompose each glyph and merge the contours before I generate a font? Why would anyone want to NOT merge/decompose? I'm curious.</p>
    <p>6. Is there an automatic centering feature? e.g. Placing an anchor exactly in the horizontal center of an O without checking with rulers each time.</p>
    <p>7. What does it mean when a glyph slot is bright red?</p>
    <p>Hope that's not too overwhelming. Feel free to answer one or just some, I need all the help I can get. Thanks in advance!</p>
