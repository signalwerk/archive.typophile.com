    html: |-
      <p><em>Is there any circumstance where one would NOT want to decompose and merge?</em></p>
      <p>For fonts with TrueType outlines, it's not necessary to decompose composites in the final fonts. It may actually be desireable to keep accented glyphs as components because that way you only have to hint the accent and base glyph once and can use additional hinting in the composite glyph e.g. to keep the base glyph and accent from touching. If you decompose, these stacked hints would break.</p>
      <p>To be on the safe side, don't use scaled or flipped components if you plan to keep composites in your fonts.</p>
    html_clean: |-
