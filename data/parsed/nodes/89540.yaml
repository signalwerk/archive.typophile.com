    <p>Hi All,</p>
    <p>I'm a complete Fontlab Virgin and have designed a typeface in Illustrator and imported it into Fontlab.</p>
    <p>I knew that my monoline type was probably a bit on the light side but thought I would be able to embolden and generate a couple of weights from this base artwork without re-drawing.</p>
    <p>I am finding the multiple master stuff really confusing from the manual and can't seem to get anything to happen.</p>
    <p>As said basically I just want to give what is essentially a hairline typeface a bit more weight.</p>
    <p>could anyone advise on the best way to do this?</p>
    <p>Thanks<br>
    Matt</p>
