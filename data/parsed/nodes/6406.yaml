  html: <p>First off, lemme start with a disclaimer. This font is not mine, I did not create it. Just so you know from the outset. <br> <br>That said, I've been thinking I'd like to digitize this one or at least use it as basis for something else. The reason I wouldn't do a straightforward digitization is that this face seems a bit too quirky still, perhaps the original auther would have benefited from a critique board like this. (I think this is another of Hermann Ihlenburg's faces, I seem to have a thing for his work) <br> <br>Anyhow the biggest problem, as i see it, and what bothers me most is that the capitals C, D, G, E, O, Q, and maybe even P don't really seem to fit (too round) and then the 8 gives me troubles too (too square). I mean maybe Hermann was trying to mix blackletter with the modern style, but i don't think they meshed too well in this example. <br> <br>So i guess my basic question is, if you could change anything about the following face, what would it be and why? <br><img src="http://www.typophile.com/forums/messages/29/47748.gif" alt="sample"></p>
  html_clean: <p>First off, lemme start with a disclaimer. This font is not mine, I did not create it. Just so you know from the outset. <br> <br>That said, I've been thinking I'd like to digitize this one or at least use it as basis for something else. The reason I wouldn't do a straightforward digitization is that this face seems a bit too quirky still, perhaps the original auther would have benefited from a critique board like this. (I think this is another of Hermann Ihlenburg's faces, I seem to have a thing for his work) <br> <br>Anyhow the biggest problem, as i see it, and what bothers me most is that the capitals C, D, G, E, O, Q, and maybe even P don't really seem to fit (too round) and then the 8 gives me troubles too (too square). I mean maybe Hermann was trying to mix blackletter with the modern style, but i don't think they meshed too well in this example. <br> <br>So i guess my basic question is, if you could change anything about the following face, what would it be and why? <br><img src="http://www.typophile.com/forums/messages/29/47748.gif" alt="sample"></p>
