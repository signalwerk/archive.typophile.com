    html: <p>i was looking at this one again last night and i think i figgered out what Hermann was doing.... maybe... <br>He was not mixing blackletter and modern, he was pulling from blackletter and Lombardic cap forms. I don't think the two mix very well. So maybe i'll do two versions (if i actually do any at all) one more blackletter and one more lombardic. There are actually several old faces that look a lot like this one, i wonder if this style wasn't actually in vogue at one time. imagine that!</p>
