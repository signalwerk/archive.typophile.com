    html: |-
      <p>This Bradley was used for the american company Firestone.<br>
      And in the very early 1900 it was licensed to Bauersche Giesserei in Frankfurt am Main, Germany. They offered it under the name "American Alt-Gotisch". There are only a very few fonts from out of Germany which where accepted by the german foundries - and if so, most of it came out of Europe, e.g. Lettergieterij Amsterdam, Netherlands. So the Bradley must have been a very fine designed and a very succesful font:</p>
      <p><a href="http://www.bleisetzer.de/index.php?target=shop/shop_details&amp;artikel_id=481&amp;b=0004&amp;pic=a" title="http://www.bleisetzer.de/index.php?target=shop/shop_details&amp;artikel_id=481&amp;b=0004&amp;pic=a">http://www.bleisetzer.de/index.php?target=shop/shop_details&amp;artikel_id=4...</a></p>
      <p>Georg</p>
      <p><a class="link" rel="nofollow">Preußisches Bleisatz-Magazin</a></p>
