  - id: 45163
    user: 2438
    date: 2005-02-28T17:22:00
    date_raw: 28 Feb 2005 — 5:22pm
    votes: null
    html: <p>Looking inside the Flash file on the Ketel website reveals the font as "KetelOne" -- suggesting a custom job. It would still appear to be derived from Bradley.  <br> <br>There's a blurb about Bradley in the book "American Type Design &amp; Designers," which credits the typeface to Joseph Phinney, based on lettering by Henry William Bradley. <br> <br>Finally, the reason I happened to have that scan of Bradley in the first place was because I had been intending to turn it into a font myself. I got as far as digitizing the letters in the sample, at which point I must have lost interest. I'm happy to provide the unfinished work to anyone who wants to make use of it.</p>
    html_clean: <p>Looking inside the Flash file on the Ketel website reveals the font as "KetelOne" -- suggesting a custom job. It would still appear to be derived from Bradley.  <br> <br>There's a blurb about Bradley in the book "American Type Design &amp; Designers," which credits the typeface to Joseph Phinney, based on lettering by Henry William Bradley. <br> <br>Finally, the reason I happened to have that scan of Bradley in the first place was because I had been intending to turn it into a font myself. I got as far as digitizing the letters in the sample, at which point I must have lost interest. I'm happy to provide the unfinished work to anyone who wants to make use of it.</p>
