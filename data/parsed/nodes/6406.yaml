    html: <p>I think Dan X. Solo digitized this for one of his Dover font CD-ROMs. Aside from the inclusion of some particularly gorgeous designs unavailable elsewhere (Durer Gothic, King's Cross, Church Text) I remember his versions being rather hastily digitized. I haven't bought any of his newer work, so it may have improved, but there were all kinds of stroke weight inconsistencies that made the 24-fonts-for-$15 approach fall short. <br> <br>And I've developed a soft spot for Art Nouveau stuff, especially the earlier, more Teutonic &amp; William Morris-sey lettering. So if you're going to revive and refine this one, I salute you. Just be sure to dig around and find some of the original alternates, if they exist.</p>
