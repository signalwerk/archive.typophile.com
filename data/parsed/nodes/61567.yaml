    <p>I know Comic Sans is reviled. I know it has been reviled for years.<br>
    Two questions: Why is it disliked so much?<br>
    And is there any other font that, through the ages or at present, comes close to this level of loathing?<br>
    Thanks,<br>
    Bernard</p><div class="imageWrap"><img src="http://typophile.com/files/IMG_0540_6652.JPG"></div><p></p>
