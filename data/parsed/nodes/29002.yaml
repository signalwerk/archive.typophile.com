    <p>Hi Guys!</p>
    <p>I have been a long time reader and just joined the community so this is my first post!  </p>
    <p>I am designing a logo for a golf tip website and am a little stuck on the font choice and overall design.  I have attached a mockup of the different options I have at this point with the respective font choices I have narrowed it down to.  I was hoping you guys could give me feedback on which design you like the most at this early stage. </p>
    <p>If you have any suggestions for another font choice please let me know.  I would like to use the same font for the logo as the headlines and navigation within the site itself. </p>
    <p>Also, there are several alternate layouts which I included.  Since the domain name is three words, I am struggling to create a logo to incorporate the three words while maintaining continuity.  Thus, if you have any input on a better way to layout the logo please let me know.  </p>
    <p>Along those same lines, as you can see most if not all of the fonts were used in their black or extra black weight.  If you have any other suggestions as to a font or a font weight please let me know.  </p>
    <p>Moreover, since I have already expanded the scope of the inquiry, if you have any other suggestions on the color scheme of the logo or as well as the golfer logo itself please let me know.  My goal was simplicity, and thus I did not add any gradients or the like to the golfer logo but if anyone thinks it would help it would me much appreciated.   </p>
    <p>Thanks for all your input and help in advance!</p>
