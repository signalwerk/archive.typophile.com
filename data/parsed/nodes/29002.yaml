      <p>I think layout B2 is the most dynamic of the various options. Futura XBk Condensed or Glasgow Black are my favourites of the options you’ve given.</p>
      <p>I think that any of the variations you’ve created will work. The only thing I would suggest is that the kerning is a little off in some places. This could be due to the resolution of the .jpg, so I’d want to see a .pdf to give proper critique.</p>
      <p> - Lex</p>
