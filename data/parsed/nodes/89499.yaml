  html: |-
    <p>Every Friday we give away a free t-shirt at <a class="freelinking external" href="http://www.typographyshop.com" rel="nofollow">TypographyShop</a>, but this week I'm giving away a free hoodie in celebration of our Hoodie Restocking Sale. The winner will choose from <a class="freelinking external" href="http://typographyshop.com/sans-unisex-hoodie.html" rel="nofollow">Sans</a>, <a class="freelinking external" href="http://typographyshop.com/ilovetypography-a-z-unisex-hoodie.html" rel="nofollow">ilovetypography a-z</a> or <a class="freelinking external" href="http://typographyshop.com/helvetica-unisex-hoodie.html" rel="nofollow">Helvetica Neue Descending a Hoodie</a>.</p>
    <p>To be eligible simply link to <a class="freelinking external" href="http://www.typographyshop.com" rel="nofollow">TypographyShop</a> via a tweet, blog post, Facebook post, leave a note at your favorite design blog or anywhere else on the web and you'll be eligible to win. </p>
    <p>Simply fill out the form <a class="freelinking external" href="http://typographyshop.com/win_a_free_shirt.html" rel="nofollow">here </a> and provide us with the full link to where you've mentioned us in the message field.  Good luck!</p>
