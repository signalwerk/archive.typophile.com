  html: <p>Hi, I was wondering if anyone knows why on many 19th century type specimen prints they are often produced in black and red ink. Often they are black typefaces with a red border or decorative elements and sometimes both black and red typefaces. Just wondering if there is a reason for this use of colors. Thanks in advance.</p>
  html_clean: <p>Hi, I was wondering if anyone knows why on many 19th century type specimen prints they are often produced in black and red ink. Often they are black typefaces with a red border or decorative elements and sometimes both black and red typefaces. Just wondering if there is a reason for this use of colors. Thanks in advance.</p>
