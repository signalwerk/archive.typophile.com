      <p>FWIW I think you may have narrowed the 'a' a touch too much.</p>
      <p>New letters look great. The serifless bowls of 'b' and 'q' work well with your 'g' in style, I think.</p>
      <p>I like the reasoning behind the new angles on the insides of those serifs. Perhaps the angle could be hair more upright; you're approaching a thinness that makes those serifs look like they could break off. Or alternatively perhaps keeping the angle but just sliding that line a touch away from the serif (of course it has to align well with the stem on the other side of the join).</p>
      <p>Salt to taste!</p>
