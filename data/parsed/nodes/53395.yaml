      <p>Wow, thanks for the detailed comments guys!</p>
      <p>Since you both mentioned the "Q", here are some previous variants, which I found less fitting than the one that's in there now:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Qs_3932.gif"></div><br>
      #1 is too strict and uninspired, #2 is trying too hard and is too much like Lubalin Graph (sorry, I really don't like its "Q"), #3 is a bit too soft/lyrical, #4 is definitely too much, #5 is too oldstyle, and #6 looks like one of those hooks on suction cups that you can hang kitchen towels on. But, #6 (combined with some of Dwiggins's "Q"s) was the basis for the current one, and I do like the current concept a lot.<br>
      I will fiddle with the join of its tail, though – thanks for pointing that out.<p></p>
      <p>*</p>
      <p>Craig:</p>
      <p><cite>"did you try some kind of taper on the base stroke of tabular one?"</cite><br>
      I did try to make it sort of an extended serif. It looked positively weird (since it got so long that the angle got really close to horizontal so it looked like a mistake); though the taperless bar does too. Hm.</p>
      <p><cite>"I’d try a serif (maybe an upward slab) at the top terminal of your fives"</cite><br>
      An upward serif! Wicked idea. I'll so try this.</p>
      <p><cite>"ft combination (in “Fifty”) is just utterly lovely!"</cite><br>
      Thanks! It's my favorite glyph combination so far. I've tried ligating it (see <a href="http://typophile.com/node/57136" rel="nofollow">here</a>), but I'm not sure that makes it better.</p>
      <p>Ben:</p>
      <p><cite>"I think G could have a longer crossbar"</cite><br>
      That might just be what's wrong with the thing. I couldn't put my finger on why it's looking so strange.</p>
      <p><cite>"Did you try ball terminals on 6 and 9?"</cite><br>
      Hm, no, I was worried they'd get too congested. But I'll see if it might work.</p>
      <p><cite>"0 [zero] looks eggy."</cite><br>
      That's intended. Does it look stupid?<br>
      Weird story: I got that idea from the Swiss licence number plates. I've always liked that zero (example from <a href="http://en.wikipedia.org/wiki/File:Swiss_registration_3179.jpg" rel="nofollow">Wikipedia</a>):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/kontrollschild_6299.jpg"></div><br>
      On a practical level, I like the egg shape for extra disambiguation besides the differing proportions of the zero(es). Somehow those eggs just *can't* be "oh"s – or is that just me?<br>
      <div class="imageWrap"><img src="http://typophile.com/files/os-and-zeroes_6028.jpg"></div><p></p>
      <p>*</p>
      <p>Thanks again, this is very helpful. I'll be feeding the to-do list and let little E rest for a few days.</p>
