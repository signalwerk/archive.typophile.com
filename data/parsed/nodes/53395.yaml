      <p>Great to see this. Here are some thoughts. (Keep in mind I'm only about one awkward set of caps ahead of you in type-design experience, so take with a grain of salt.)</p>
      <p>This is a personable font that is already working well both small and big. </p>
      <p>I prefer g #1 as far as fit with the character of the font goes.</p>
      <p>There's something I very much like about the b.</p>
      <p>The blunt terminals at the bottom of c, e, s, and t seem too crude. I wonder if there are other solutions.</p>
      <p>Least successful are k and s: k because the mismatch of a structural straight arm and an unfurling curve (something sort of Cyrillic looking to this), and s because it's a bit lumpy and struggling to be wide.</p>
      <p>In some cases the ball terminals seem too tacked-on, rather than developing gracefully out of a curve. This is particularly true where the curve leading to it is flattening out to reach horizontally, as in c, f, and s most noticeably. </p>
      <p>The top join of q seems odd to me - it has no analogues in the other letters that I could find. Did you try it with an intersection like the bottom of b has?</p>
      <p>Something about the thickness of the arm of the r doesn't look right to me.</p>
      <p>The serifs at the tops of v, w, x, and y seem too heavy. I never thought about it before, but I suppose if you adjust diagonals for optical balance you might have to adjust slab serifs at the ends of them. v and w may be a bit too spread at the bottom, and thus light (topheavy).</p>
      <p>I might consider raising the intersection of the y, and maybe bringing the top-right vertex of the z leftward a touch.</p>
      <p>Seems to me like this has a great deal of both charm and function - very impressively so for a first font!</p>
