      <p>Thanks, Hrant! I'm very glad to hear you say that. Figuring out darkness and vertical proportions has seemed especially hard to figure out, so it's great to hear this may work. (There is no "talus" however. So I guess I should scale the whole thing down. :-/)</p>
      <p>I wasn't *consciously* trying to make it more contemporary-looking; that kind of happened, and I like it. But, I love your idea about the "old" and "new" sort of "family"! It's a pretty exciting thought to come back to this later and try to play a subtle variation with a slightly more "historical" feel. Though of course right now I'd have no idea how to go about it; that sort of subtlety is way beyond me. But I'll definitely keep this in mind for when I've done another twenty fonts or so. ;-)</p>
      <p><em>"you’ve made the tittle a hair “too” dark? Is that a Patria influence?"</em><br>
      Really, would that be considered *too* dark? I realize it is rather large, but it looks good to me that way. Not sure if it's directly influenced by Patria – I've been partial to larger tittles for a while :-&gt; – but Patria has certainly strengthened my conviction that they can look dam good.<br>
      Anyway, I've been seeing a lot of Patria lately, so I won't be surprised to see some elements of it crop up in Ernestine. One thing that is consciously informed by Patria is the ear of the "g", although rather subtly so. (And I do see what you mean about its height.)</p>
      <p><em>"Be prepared for the flack from other type designers."</em><br>
      With that "q" and that "k" (and maybe the "a"), I'm not expecting to be taken down over the tittle. What's the problem – does it just look bad to some, or is there one of those underlying minefields I'm not seeing?</p>
