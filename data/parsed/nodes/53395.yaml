      <p>So the lowercase is somewhat complete now. New PDF attached up top: <a href="//typophile.com/files/ernestine_lc_v3.pdf" rel="nofollow">ernestine_lc_v3.pdf</a>. </p>
      <p>Apart from a bunch of new glyphs ("f", "k", "r", "t", vwxyz, plus some diacritics and such), I've been doing a lot of tweaking: mostly things previously discussed here, such as figuring out the weights of rounds vs. straights, and the overshoots on the descenders. I think it looks more balanced now, although the spacing is still raw. </p>
      <p>**</p>
      <p>There are some glyphs that I know are still somewhere between slightly problematic and totally not working.<br>
      "s" I think is most problematic in terms of being bumpy and probably top-heavy?<br>
      The single-balled one kept looking strange, so I exchanged it for the double-balled one. I still think this is slightly too cute and slightly too busy, but it looks more like an "s" somehow; it's a bit less distracting. But if anyone can advise me on its width, that'd be greatly appreciated. I haven't really understood yet how the "s" is really narrow in some fonts and pretty wide in others, and most of all, how wide mine should be.<br>
      "k": Not sure if it's too cute/strange, although I still like it.<br>
      "i"/"j": Does the tittle need to be higher?<br>
      "t": Does this work? Still not sure what matters in a "t", but I do kinda like this one.<br>
      I'll be happy to hear your opinions and feed-back!</p>
      <p>**</p>
      <p>So after this, next up is: seriously working out spacing (which I expect will necessitate re-tweaking some of the glyphs), and setting up the caps. I'm really looking forward to those, as well as the numerals.</p>
