      <p>I'm glad the tapering clicked. Although I think you've lost some of the "butch" character of where you used to be. Maybe pull the tapering back just a bit? On the other hand, other glyphs have a fair amount of modulation too now. Dunno. Is the modulation ruining things? I'm not sure, but I think maybe the old monoline look had more character (although it was less versatile/readable).</p>
      <p>&gt; I am shooting for 8–10 with this</p>
      <p>Great - go for it. But you need more weight.</p>
      <p>BTW, 600dpi is indeed misleading (especially for smaller<br>
      sizes) but if you get a 1200dpi printer you're 90% there.</p>
      <p>The "q": love it.<br>
      The "u": don't sweat it - do your thing.</p>
      <p>Looking at the PDF:<br>
      - Some of your ball terminals are malformed (like the "r").<br>
      - I'd make the "g" narrower, and pull in the rightward bulge of the descender. And that ear isn't working.  :-(<br>
      - The dot of the "j" is slightly right.<br>
      - The spine of the "s" is bumpy and unorthodox. I would go traditional and have the most weight towards the middle.<br>
      - The "t": the head is confused, and the bottom curl needs work.<br>
      - The "w": you need more weight in the middle "v".<br>
      - I think the "x" has too much stroke contrast.</p>
      <p>Keep at it - this is going to end well!</p>
      <p>hhp</p>
