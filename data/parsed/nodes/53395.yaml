      <p>I was all excited about the left hand shape at first, but chucked out the ball terminal after looking at this in text size. Somehow I felt it was mannered and a bit too "pretty"; most of all, it seems to stand in the way of readability, especially in smaller sizes. Closes up the counter too much (and looks too dark, given that the "a" is a pretty dam busy character already). Also, I wouldn't want to make the bowl of the "a" *much* smaller, since it'd then lose all reasonable proportion, as well as any connection with the eye of the "e".</p>
