    html: <p>I think the right-trending dot also keeps things moving forward along the line. When printing, for example, I write the stem first, then the dot, then the following letter. As my hand approaches uniform motion along the line, the dot will likely be between the stem and the following letter. (By this I don't intend that type should be or always is an emulation of writing, but I think some of the dynamics are parallel.)</p>
