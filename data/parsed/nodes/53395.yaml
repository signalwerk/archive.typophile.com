      <p>Evangeline is nice, but sounds too Christian for me. I'd see an Evangeline as chanting stuff and floating mid-air, rather than being honest and down-to-earth. </p>
      <p>"Sincerity" is a good word, Hrant – I agree pretty much completely with your perspective.<br>
      I like "Ernestine" because while the name is feminine, it derives more or less directly from "earnest". Both of those sides seem to match the font well – in relative terms; I think it <em>is</em> more of a "she" than a "he", although definitely not "girly" – and yes it's meant to be serious in a, well, earnest kind of way, which doesn't mean it can't be quirky here and there and have its own mind about things. It's just not whimsical.<br>
      Plus, I like the "bridge" between the old-fashioned name and the newish design.<br>
      (And I can definitely see Leonard Cohen as a slab. Just not Archer. :-D )</p>
      <p>Actually, the more I think of it, I think I'm quite married to the name. Guess I'll just have to live without a "g" in there! But questioning it was worth it.</p>
