      <p>OK. I got immersed in the "s", and it has opened up a little can of worms. :-)<br>
      (The changes discussed earlier are still coming up; just got quite caught up in this.)</p>
      <p>To recap, the "s" I originally intended has one ball terminal on top and no ball/serif on the bottom (like #2 below). I like the concept, but it kept looking pretty lopsided/contorted/unnatural. So just to open up the field again, I did some thinking about my options; this is what I came up with:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/s-nebeneinander_6524.gif"></div><p></p>
      <p>Options I'm definitely unhappy with in grey.<br>
      Also, I know the curves still need some work; but I'm hoping not to do the serious tweaking six times! So I hope these are worked out enough to tell if the respective concepts could work.</p>
      <p>Some notes/comments –<br>
      <strong>1</strong>: Works, but probably looks too naked in the context of a slab serif font. Also makes me queasy when I think about the caps.<br>
      <strong>2</strong>: Still my favorite, but still a bit awkward; I'm hoping it's only a matter of execution. Would nicely match the "c" while not clashing with the "a".<br>
      <strong>3</strong>: Seems like the obvious solution, but looks too cute and too cluttered/busy to me. Also makes the weak-topped "a" look like a mistake.<br>
      <strong>4</strong>: This struck me after looking at my old typewriter again – typewriter fonts tend to have ball terminals on things like the "a", "c", "j", &amp;c., but outwards-pointing serifs on the "s" (as well as on many caps). I'm not at all happy with it, and don't think it works for Ernestine (see the "q"), but happy I tried it.<br>
      <strong>5</strong>: Tried to combine #2 and #4 in an effort to make #2 less top-heavy. Looks like a zombie up close, and is probably too distracting in text, but was interesting to try.<br>
      <strong>6</strong>: Variation on #4, moving the serifs inside the curves. I like this better than #4, and think it works okay, but doesn't click with too much in the font (except the "z", which isn't there yet).</p>
      <p>I'm not quite sure. I think, I think, I'd probably most like to continue on the #2 route; but I'm wondering if you guys think it's actually possible to make it look truly good and balanced (I'm finding it tough). Also, when I think ahead to the terminals on the caps, I'd probably feel most at ease with #2 or maybe #3; though I'm wondering about #6 as well, and any thoughts on the "permissibleness" of #1. </p>
      <p>So here's a PDF with all 6 variants tested in a short paragraph at 9pt:<br>
      <a href="http://www.altaira.de/posted/ernestine-s-6variants.pdf" title="http://www.altaira.de/posted/ernestine-s-6variants.pdf">http://www.altaira.de/posted/ernestine-s-6variants.pdf</a></p>
    html_clean: |-
