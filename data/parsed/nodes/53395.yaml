      <p>Many, many thanks to all those (here and elsewhere) who have lent their sharp eye and alerted me to things to look at! I'd [finally] like to address a few points here (Ben, sorry for doing that soo late!).</p>
      <p>*</p>
      <p>One thing that's often criticized is the shortness of vertical serifs in the caps. There's a reason for that: My caps are very short; and if I make the vertical serifs any longer, subsequent lowercase letters will start crashing into things like the "T". Kerning things under those serifs is already pushing it now; so I'm reluctant to make them longer, although I'm wondering if this might be another nice application of contextual alternates.</p>
      <p><cite>"At large sizes, G looks like the crossbar should be wider"</cite><br>
      How about at small sizes?* I'm not sure about that thing – when I make the crossbar longer it looks stupid too. I'm beginning to think it's good the way it is.<br>
      (* Ben, you can check that in the specimen, on the page that has the large lowercase alphabet, there's a "G" in the bottom right.)</p>
      <p>My numerals deliberately follow a "romanized" contrast scheme, hence the foot serif on the "7" – and the heavy downstroke. But, I did thin its top join a little.</p>
      <p>*</p>
      <p>I officially suck at making tildes, commas, and curly braces. The tilde I'm still procrastinating on, and the comma's being worked, but here's a new attempt at braces:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/curly_5587.png"></div><br>
      Do you think these are headed in a better direction? (I know they're not done – but I'm not sure what to do with them.)<br>
      -<br>
      Oh, and how's this Pound? Still too narrow?<br>
      <div class="imageWrap"><img src="http://typophile.com/files/four-at-pound_6612.png"></div><br>
      (BTW tweaked the curve of the "4", which is becoming one of my favorite glyphs; "@" is also slightly more polished)<br>
      -<br>
      And here's a first go at my new "unorthodox" "j" (obviously not polished yet):<br>
      <div class="imageWrap"><img src="http://typophile.com/files/jungle_6594.png"></div><br>
      Thinking about a "Q" with a tail in the vein of the "j" and "g". But that's still being incubated.<br>
      -<br>
      What do people think about an eszett like this? It has been my secret favorite and an alternate, but now it's been voted up by a bunch of people whose opinions I value. I like the shape, but is it too quaint?<br>
      <div class="imageWrap"><img src="http://typophile.com/files/fussball_4425.png"></div><br>
      -<br>
      Ben, for the localized forms (in case that question still stands):<br>
      <div class="imageWrap"><img src="http://typophile.com/files/locl_6578.png"></div><br>
      And then you need to list all the referenced languages in the bottom part of the window (see here: <a href="http://typophile.com/node/58617" title="http://typophile.com/node/58617">http://typophile.com/node/58617</a> )<p></p>
