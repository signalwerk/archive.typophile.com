      <p>re: c/s/t terminals, I can see why a little added weight serves you well. Could you just soften those corners a little? </p>
      <p>I do think, if you're going to stick with the ball terminals, that you should have one on the head of the a, too. (I confess that my printout on US Letter paper cut off half that letter so I didn't catch its absence at first.)</p>
      <p>One new comment: on the central intersection of the x. It looks like you've offset the / stroke but not the \ stroke. In a contrast face I think that would work well but here where the strokes are even I'd expect the intersection to be more symmetrical, too. As it is, you get a little clockwise torque to that crossing.</p>
