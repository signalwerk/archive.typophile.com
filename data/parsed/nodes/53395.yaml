      <p>Nina, this might be counter to your nature, but it's a technique that I've used and heard of others using: at a certain point it might be highly fruitful to put this away, for at least a month but probably longer, and then pick it up again; you might be surprised at how much more objectively and effectively you will then approach the various issues. The design process becomes less emotional and more "big-picture"; it becomes almost like critiquing somebody else's work (which for me at least is easier to get right).</p>
