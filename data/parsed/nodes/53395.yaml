      <p>Numerals: also still rough, irregularities in weights.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ernestine_tnum_3665.gif"></div><br>
      The lining figs are best for tabular use I think (I'm not sure how much sense the proportional lining figs make, but they're there). I tried to give them a similar feel as the letters; that's why they're rather wide.<br>
      A couple of detail notes:<br>
      "4": the convex curve is a direct Patria influence and seemed (a) helpful for making the "4" reach a good apparent width; and (b) looking good.<br>
      "7": I've never understood why these aren't more commonly given a foot serif, at least in lining figures where they would seem to need something to stand on just like the "1" does. Rockwell &amp; Patria gave me the final push to try it. I like it a lot.<br>
      "8": the "S" shape with the rather strong offset isn't just something I find sexy (which I admit I do, like in Museo [Sans] or Designal), but also helps the "8" reach this sort of width without looking like an obese snowman. :-&gt;<p></p>
      <p>*<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ernestine_hnum_4044.gif"></div><br>
      Hybrids: the idea to make these was mainly inspired by my old typewriter, which has interesting "cap-height-slightly-ranging figs"; I like the concept, but full cap height *plus* little extenders was too massive in Ernestine. On the other hand, oldstyle figures seemed too "classical". So these hybrids seem to be a great middle ground; and I really like them in other fonts (like Fontin).<br>
      I'd be very curious to hear what you think of them – both the concept and the execution. I ended up changing the shapes a lot from the lining versions, the idea being to have the parts that ascend and descend feel more like "bits that are sticking up or hanging down" (which explains the lack of serif on the "7", since it's not standing anymore but hanging; I tried a half serif, like the sexy one in Fairplex, but that didn't work). I'm not sure if that was too much, and I wonder if the 3, 5, 6, and 9 in particular still fit the font. For some reason, they remind me a bit of Thesis now (which I haven't been looking at), and I wonder if I can't have more serifs/balls in there.<p></p>
      <p>***</p>
      <p>Some minor tweaks done to the lc too. Craig, thanks for pointing me to the arm of the "k"! I've made it less droopy, and it seems much better. I also made the "w" narrower, and I think I'm getting close to figuring out the "s" (which does involve slightly smaller ball terminals, and a more symmetrical curve).<br>
      Don't look at the germandbls – that one's still under heavy construction.<br>
      Oh, and spacing is *still* rough. :-\</p>
      <p>***</p>
      <p>BTW, Ernestine is nearing its first public use on a <a href="http://typophile.com/node/57136" rel="nofollow">book cover</a>. It's pretty scary!</p>
      <p>Anyway: As always, I'd be most happy for feed-back. I'm looking forward to pushing this further.</p>
      <p>-Nina</p>
