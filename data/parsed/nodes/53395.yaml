      <p>A hiatus has been a good idea (thank you, Hrant). And it's not over.</p>
      <p>Little interim musing: I'm beginning to think I've tried to cram too much into this one (and first) font. Too many ideas – and concepts too complex, of which I'm honestly just beginning to grasp some nebulous contours.<br>
      Thinking about going back to more basic principles, I can see that modulation die. Mostly because I don't truly understand modulation. And I can't help feeling like an impostor when I try to make this font speak in tones that aren't mine, or that I can't master, or that I don't understand. In fact, being on a Beginner's Steep Learning Curve makes this process pretty crazy – many ideas that give me the warm buzz of accomplishment one week seem plainly deficient the next.</p>
      <p>It'll be at least two weeks until I'll resume work on this!<br>
      In a way, I can't wait; but I will. :-)</p>
