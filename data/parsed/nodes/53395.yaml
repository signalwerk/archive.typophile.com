      <p>When I saw your first entry, I thought Ernestine was a beautiful hit. Nevertheless, there was a lot of space for improvement I'd never imagined then. Definitely, don't touch the width of your straights.</p>
      <p><em>Marcelo, why will PS hate me for that?</em><br>
      Just kidding. That's coz the way PostScript manages printing: when near to vertical or horizontal, but not exactly, the interpreter has to make a lot of decisions about what to do, that is, if inking or not; the digital world is discrete, while the analogous is not; aliansing is the gap where noise comes in. Nevermind. Programmers must work for human –not machine– efficiency. As the German aircraft designer Willy Messerschmidt used to  say: <em>"You can have any combination of features the Air Ministry desires, so long as you do not also require that the resulting airplane fly"</em>. Nevermind. It makes me remind the hateful discussion with that guy of the iPhone –he would surely uppercase the "i"– and his ego.</p>
