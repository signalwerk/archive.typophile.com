      <p><em>"I never realized how many ball-terminal fonts don’t use ball terminals on ’s’"</em><br>
      Same here, Craig! I was pretty surprised. </p>
      <p>Re #4 above, here's the acs treatment in<br>
      - my old typewriter (a 1958 <a href="http://mytypewriter.com/hermes3000of1958.aspx" rel="nofollow">Hermes 3000</a>),<br>
      - Fine Line, a typewriter font from IBM,<br>
      - Alphabet Centre Georges Pompidou (1976) by Frutiger, based on Fine Line.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/acs-examples_6403.gif"></div><p></p>
      <p>With the need to accommodate a serif on the outside, the curves definitely get a different character. I tried to bend them in as gently as I could, and I suspect you're right that I'd have to do it more strongly to make the shape work; but closing up counters and making curves less flat/open is precisely one thing I'm reluctant to do in Ernestine (which is also why I gave up on putting a spike on top of the "q"). It seems out of character somehow; and this treatment in particular makes a lot less practical sense to me than it seems to add noise. Though maybe I'm not seeing something.</p>
      <p><em>"ball on the bottom and nothing on top"</em><br>
      Hrant, good point. I did try that previously, but it seemed even more lopsided than the top-balled one, so it didn't make it into this round. Looking at it again, I probably ruled it out too quickly. (Please forgive bumpiness of curves.)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/s-new-bottomball_3728.gif"></div><br>
      I won't put balls on both ends unless there's good reason to believe I should.<br>
      But this might really be a good alternative to the top-balled one. I especially enjoy how it relates to the "c".<p></p>
