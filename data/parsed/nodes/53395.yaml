      <p>Salt ready?</p>
      <p>Your strategy of getting right to a target size design is sound, and the helpful side-by-side comparison demonstrates at a glance how well the revised design is fulfilling that function. Even on my likewise low-res printer's version, it's impressive to see that the charming character comes through at small sizes while remaining perfectly legible.</p>
      <p>Here are the things I would (or might) take another look at:</p>
      <p>c/e/s : I sung the praises of this taper before, but I wonder if starting the taper a little later (letting the bottoms of these letters stay thick a little longer) would serve you well. At small sizes the c and e lose that end and look like they have an overbite. s actually winds up looking inverted: maybe reconsider the relative width of the counters as well as shortening the taper? (All that said, s's curves have picked up a lot of grace since v.1.)</p>
      <p>g : might be a little too prominent. Does the tail reach around too far? Maybe also consider reducing the scale of the entire upper bowl by lifting it up off the baseline? (I'm not sure but I think that the bottom of that bowl need not align with b, q, etc.)</p>
      <p>q : yes, it's quirky, but if you're going to let the foppish k into the party, maybe you can't say no to the nice bald guy, too!</p>
      <p>v/w/x/y : relative stroke weights on these diagonal letters need work. In general these don't have near the same confidence as the rest of the alphabet. I wonder if w might be a touch too wide. The / stroke of x is too thin, and the optical offset isn't lining up for me (but obviously fix the former first).</p>
      <p>I'm impressed with your patience on this, getting one thing right before moving on to the next.</p>
      <p>(and jealous of the hanging space!)</p>
