      <p>Thanks, guys! I'm glad to hear this terminal works for people other than me too;<br>
      I am quite happy with the way it seems to unify the letterform to appear like more of a consciously designed whole, if that makes any sense (though I know that bowl is still lumpy).<br>
      Also, I honestly wasn't expecting it to work.  :-&gt;</p>
      <p>It's going to be an interesting process to work the different offending terminals in such a fashion; without the added weight of a flaring terminal, I expect quite a few letters to fall apart (like the "s" and the "t"), which is probably a good thing because it'll show me how they don't work.</p>
      <p>Ben: Thanks for your comments!<br>
      Re the "a", I'm finding it pretty difficult not to make the shapes too angular &amp;<br>
      still make them fit into these wide proportions. I would indeed rather keep this kind of curvy.</p>
      <p><em>"The k doesn’t work for me, but it’s not the curl, it’s the crossbar...for me it’s too wide and I’d bring the knee in a notch or two."</em><br>
      Interesting. To be honest, I was actually wondering if I had to make it wider.<br>
      Need to look at this in context / some more / seriously / … :-)</p>
      <p><em>"Would that do odd things to the angle of the arm and leg?"</em><br>
      It probably would, though I'd have to test. As it stands, at least the angle of the arm corresponds (roughly) to the "x".</p>
      <p><em>"I’m also a beginner so"</em><br>
      Wow… did you fall asleep mid-sentence? :-)</p>
