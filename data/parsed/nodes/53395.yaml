      <p>Thanks for your feed-back guys! Much appreciated.</p>
      <p>The ball terminals are one of my big "question marks" about this. I had a lot more of them at one point (like on the head of the "a", and both ends of the "s") but realized they close up the shapes too much. Now I don't know if they are too few and far between to still make sense as a principle. Also, it's true they don't work equally well in all their instances – thanks for pointing this out.</p>
      <p>Jesse,</p>
      <p><em>"I prefer the third ’g’ as well."</em><br>
      It seems to come down to the first or the third. While I do heart the second one, I agree it doesn't work very well in text; I'll probably keep it as an alternate for the display cut though. The first is the one most closely following the metal face I was (partly) working off. Only beef I have with the third really is that it keeps reminding me of Souvenir. :-|</p>
      <p>Craig,</p>
      <p><em>"The blunt terminals at the bottom of c, e, s, and t seem too crude"</em><br>
      Oh … I wonder what could be done about this. I was actually quite happy to come up with this solution; as noted above, I had more ball terminals before, but that was getting too much. Also I felt I needed to add a little weight / "determination" to the terminal at least in the "s", otherwise it was starting to feel top-heavy (and the "t" keeps toppling over anyway). Hmm.</p>
      <p><em>"Least successful are k and s"</em><br>
      Yeah, touch me where it hurts! :-)<br>
      Those were the ones I was struggling with most. I had no idea how difficult it is to make a "k" (especially at this kind of width). With the "s", I was at least expecting it (which of course didn't make it easier). In any case, I agree those aren't done yet.</p>
      <p><em>"The top join of q seems odd to me"</em><br>
      That's actually one of the details that carried over from said metal face I was working off; I must say I like that little corner that doesn't say where it's coming from :-). Although I guess I should also try a "b"-like smooth intersection &amp; compare.</p>
      <p><em>"The serifs at the tops of v, w, x, and y seem too heavy"</em><br>
      I was noticing some weirdness there too, but must say I feel quite insecure generally with all of those "diagonal" lettershapes.<br>
      I wonder how much of the impression of excessive serif weight is due to the diagonals, and how much to the fact that they're on the x-height; they're the same weight as the ones sitting on the baseline, but I guess they also look heavier when they're up there. I wonder if I should thin them overall (throughout vwxy) or maybe just on the insides or something? </p>
      <p>Sebastian,</p>
      <p>Hope you don't mind if I reply in English to "tie in" your comments with the rest :-).</p>
      <p><em>"- die jeweils rechten Teile von y und v, vielleicht auch bei w und x, stechen im PDF in den kleinen Punktgrößen dezent heraus, sind zu dunkel"</em><br>
      Do you think this excessive weight on the right hand side of yv/wx might have something to do with the serif weight discussed above? Or is it just the stem weight that's off? (There's something fundamentally wrong with the "y" in particular that I'm still looking to pinpoint. Is it weight?)</p>
      <p><em>"Vielleicht braucht das “k” eine gerade Serife, keinen Tropfen?"</em><br>
      Hm – I had a version with a straight serif on the "k" and it looked like an industrial clamp or something ;-) – although the ball terminal may be too cute (if it works at all).</p>
      <p><em>"[q] Die Serife gehört für mich rein gefühlsmäßig genau in die andere Richtung"</em><br>
      Interesting. While it may well be unbalanced yet, the <em>principle</em> of having the serif of the "q" face rightwards feels right to me, and seems to make a lot of sense too*. Does it look very confusing/weird? (Does it look weird to others too?)<br>
      * Readability, stressing of reading direction, disambiguation with "p"/"g". To give credit where credit is due, most of the thought that went into the "q" serif comes from reading about Hrant's alphabet reform work – and I then kept finding "q"s with rightwards-facing terminals/serifs in "real life" too, and felt they work/read nicely.</p>
      <p>-- </p>
      <p>Thanks again! This is extremely helpful. Keep'em coming. :-)<br>
      —Nina</p>
