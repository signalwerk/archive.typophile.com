    html: |-
      <p>This is VERY exciting to see! :)<br>
      It's looking wonderful and neat already.<br>
      I'm going to be picky!<br>
      The caps are really nice. I think I mentioned before the ERY being my favourites. I think G could have a longer crossbar. J is pleasant. The curly arm of K looks slightly weak somehow, like it's not quite sure it should be curling like that. I think it needs more weight on the NW corner of the terminal?<br>
      On M, I think the centre vertex should have a narrower bevel, bringing the bottom of the join down a few units. N seems maybe wide a little.<br>
      I agree with Craig about Q. Is the tail past 6 o'clock? I actually think a tail like on Lubalin Graph might work well.<br>
      S works well. The arms of T look like the serifs need more, but appreciate they might start interfering with other letters. On X the offset looks a bit too great.<br>
      LF: I like the goofy 1! The 2 and 3 work nicely. 4 I'm not sure. The crossbar looks maybe a bit high. Try a serif on the top of 5. Did you try ball terminals on 6 and 9? They're nice shapes but maybe balls would fit well too. I like 7 and 8. The foot serif on 7 works nicely. 0 looks eggy. I'm wondering if your brackets are too roundy...but would have to see in context to be sure. The diacritics look good to me.<br>
      I really like the OSF, they work especially nicely in text. The stem of 7 looks maybe a bit heavy. It could taper slightly towards the top. Otherwise I can't fault them!<br>
      ACtually I haven't been able to print today so these comments are based on the large sizes on screen, so perhaps they aren't so relevant for small text sizes.</p>
