      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ernestine_v2_3793.gif"></div><br>
      (Also, new PDF up top: ernestine_lc_v2.)<p></p>
      <p>--</p>
      <p>I've found that trying to work out a cut that isn't supposed (or capable)<br>
      to do anything by itself is too abstract for me to figure out (and also started feeling kind of pointless). So, I am shooting for 8–10 with this – which seemed<br>
      to necessitate some rather deep changes. (I'm keeping the old contours, though,<br>
      as a possible starting point for an eventual small size cut.)</p>
      <p>Since this starts off in a bit of a new/refined direction, which also seems a bit scary, I'd love some feed-back before diving into all the detail refinements that I'm aware this needs.<br>
      I have done quite a bit of detail work, but most of that was <em>before</em> re-thinking proportions, darkness, and contrast. So I concede the old version has more even color than the new, but I'm hoping that's just due to the fact I haven't done nearly as much detail tweaking on the new one yet. Also, spacing is still quite basic.<br>
      I'm also aware that the weights are still kind of all over the place, and they seem to behave pretty unpredictably when printed small-ish. I guess this isn't a project I can pull off with my 600 dpi laser printer; I'm hoping to be able to buy a better one soon (which is one reason why I'd rather not start out with the small size cut yet).</p>
      <p>So I guess the most important question is: Does this make sense?<br>
      (= Does it read better, or at least promise to do so after further tweakage?)</p>
      <p>I'm sure this new direction runs me into a slew of new problems I'm not even seeing yet (yay! and I mean that). Don't hold back. I'm really trying to learn and understand what makes a text face work; and I'm up for redoing &amp; changing this until it can do what I need it to (as long as I can sometimes still find time to sleep, and do the work that feeds me).</p>
      <p>-- </p>
      <p>Some detail notes:</p>
      <p>"q": I couldn't make it work with a vertical serif on top. That thing kept looking tacked on, kept messing with the bowl in ways I didn't appreciate, and I couldn't really see why it'd <em>need</em> to be there. So, here's a "q" with a join like in the "b",<br>
      and it's actually one of my very favorite glyphs! So, I'm officially challenging<br>
      all of you (except for Hrant I guess) to go "uuugh", and then tell me why.</p>
      <p>"g": The other one has not been voted off the show, I just haven't adapted it yet.</p>
      <p>Hrant:<br>
      <em>"I think I would make the 'u' serifs like the ones in the 'v'."</em><br>
      I officially don't get this.&nbsp;&nbsp;:-{&nbsp;&nbsp;I tried making them flat on top and angled on the bottom, and that looked positively weird, especially next to glyphs like "i" or "n" where I'd expect the same serif shape. It kind of makes the "u" look like a flipped "n", or like it's hanging from the x-height rather than standing solidly. Or did you mean something else? I'm confused.</p>
      <p>--</p>
      <p>I'm very grateful for any pointers, opinions and crits. I'll let this hang around* for a few days – and am looking forward to then resuming work on it in full blast. :-)</p>
      <p>—Nina</p>
      <p>* <a href="http://altaira.de/posted/ernestine-wall.jpg" rel="nofollow">I like the way my office wall looks.</a></p>
