      <p>Medium-sized update.</p>
      <p>First, more work on the "a" and "m":<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/naming-a-m_5056.gif"></div><br>
      I think I like the new widths/proportions, although I'm not sure the new "a" isn't disappearing a bit between all those wide glyphs. That'll surely be easier to judge once I have things like the "s", "f", and "t".<p></p>
      <p>Btw, going back to Industria, I realized I really like the foot terminal on its "a":<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/industria-a-terminal_5790.jpg"></div><br>
      …so I spent some time playing around with an alternate "a" that would have a "curved" terminal that would still be perceived as serifed (kind of like in Patria); but I couldn't get that to work with the overall serif size/weight. And a plain curve, like say in National, seemed too soft and cute in this context. I guess the idea might be moot in a slab (and it's not like I actively dislike the current foot serif on the "a").<p></p>
      <p>What I did do was transfer the more slanted inside angle of the "a" foot serif to the top-left of "m" and "n",* which I think works well – this way I need to taper the curves less as they're approaching the join, which helps the monoline look.<br>
      * You can see that in the topmost image of this post, though only in the "m".</p>
      <p>--</p>
      <p>Also, I have a first "postable" version of "b"/"d"/"p"/"q":<br>
      (Please ignore the ugly "u", it's not supposed to be here yet.)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ernestine-bdpq1_4331.gif"></div><p></p>
      <p>--</p>
      <p>PDF with the current state of things:<br>
      <a href="http://www.altaira.de/posted/ernestine_090306.pdf" title="http://www.altaira.de/posted/ernestine_090306.pdf">http://www.altaira.de/posted/ernestine_090306.pdf</a><br>
      (I'll attach an "official" one to the top of this thread once this third incarnation of Ernestine has a complete lc alphabet.)</p>
      <p>Any comments muchly welcome of course. :-)</p>
