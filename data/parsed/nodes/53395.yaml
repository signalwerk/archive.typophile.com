      <p>&gt; I can’t really tell how much of Ernestine<br>
      &gt; is influenced by which other fonts.</p>
      <p>I think that's ideal. As long as that's "font<strong>s</strong>", plural, for two reasons: the more numerous your influences the better your results; and you're less likely to offend a single source's author. In my case however the latter does not apply at all - to me it's mostly very flattering.</p>
      <p>FWIW, some people say "Hey, Cheltenham!" when they see Patria's caps. The first time I heard that I was taken aback - but I shouldn't have been: although I didn't reference ol' Chelt consciously, it is in fact one of the fonts I fell in love with early on (although now I've mostly moved on).</p>
      <p>That Ezzo "e" style is quite nice - and nothing like Patria's BTW: my "e" has a very hard nose, with a totally straight vertical segment at the tip - I got that (partly) from Jens Gehlhaar (who once produced an extreme incarnation of that structure).</p>
      <p>hhp</p>
