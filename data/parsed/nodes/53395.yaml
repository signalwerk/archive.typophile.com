      <p>sorry for writing german, i wrote this for german typografie.info, then deciding to add it here for more coherence:</p>
      <p>ganz kurz, spontan und unvollständig, und mit Bedacht zu genießen:</p>
      <p>das sieht schon sehr sehr ausgewogen und ruhig aus, spitze! Ich wünschte ich hätte den Nerv, so lange am Grundalphabet zu bleiben, bevor ich mich aus Neugierde und Langeweile in Zeichensatz- und Schnitt-Orgien verliere :)</p>
      <p>- die jeweils rechten Teile von y und v, vielleicht auch bei w und x, stechen im PDF in den kleinen Punktgrößen dezent heraus, sind zu dunkel. Das mag am Rendering liegen (PDF-Vorschau von OSX) oder wirklich ein Problemchen sein.<br>
      - der obere Teil vom "k" wirkt mir eine Spur zu verspielt. Ich sehe dass das mit dem "r" korrespondiert, aber dort ist es irgendwie weniger "curly". Vielleicht braucht das "k" eine gerade Serife, keinen Tropfen? Tropfen hängen bei dir sonst immer nur an Rundungen, der Tropfen beim "k" macht das auch "rund", auch wenn's das eigentlich nicht ist.<br>
      - das "s" ist mir links oben und rechts unten eine Spur zu eckig. Auch links unten macht es einen recht abrupten Schwenk nach oben. Vielleicht mal neben ein "a" stellen und wirken lassen. Außerdem ist es oben zu schwer, und/oder in den senkrechten Teilen etwas zu leicht. Für mich (neben dem verfluchten "d" und den Schrägen) der schwierigste Buchstabe.<br>
      - das "z" hat einen leichten Hang nach links.<br>
      - das "u" hat im rechten Teil seines Bogens einen leichten Knick, es geht eine Spur zu gerade nach oben.</p>
      <p>Dinge die vielleicht mit der Industria zu tun haben, die ich natürlich nicht wie du aus dem FF kenne:<br>
      - ich bevorzuge #1 der drei "g" (ggf. mit etwas weniger gekräuseltem Ohr), wenn das nicht, dann #3. Das mittlere steht in den vertikalen Proportionen zwischen den Stühlen und könnte durch das "Schmuckelement sogar fleckig werden. Hier kann man aber sicher auch zwischen Display und kleinem Text streiten ...<br>
      - das "q" sieht mir noch am unfertigsten aus. Oben ist es mir eine Spur zu rund, d.h. die Rundung geht rechts eine Spur zu weit nach unten. Die Serife gehört für mich rein gefühlsmäßig genau in die andere Richtung.</p>
