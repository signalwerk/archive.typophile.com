  - id: 322841
    user: 1250
    date: 2009-01-15T12:59:00
    date_raw: 15 Jan 2009 — 12:59pm
    votes: null
    html: |-
      <p>(I was worried, but I'm happy to see that Typophile is<br>
      still a good place to get a type crit - keep it up guys!)</p>
      <p>Nina, are you sure this is your first font? :-) Because it's coming together quite well, and has much more depth than a beginner usually shows. Heck, many old-timers just play on the surface their whole careers. It's certainly frightening jumping into that dark, luscious jungle.</p>
      <p>For example, the decision of putting a ball on the "a" or not, of how to do the top-right of the "q", these are things that you can either just formally mimic precedent, or really think about first. When I was making Patria I tried to make the letters be what they needed to be in terms of reading, as opposed to just something that other type designers would applaud. I like to leave the terminal of the "a" pretty "weak" because I believe it helps readability (without looking ugly - in fact it can look quite elegant and graceful). I think your "q" however is going in the wrong direction, it's neither attractive nor harmonious. Not the descender mind you - that's wonderful! I mean the top-right. I would try giving it a vertical spike/serif, like in the "z". If that doesn't work I might try making it like the "b" (even though many type design will definitely go "uuugh"). Divergence is extremely important in a text face, it's just very easy to go too far, and too tempting to do it semi-randomly. You need some method (and you seem to be good at that).</p>
      <p>Craig says that the "terminals at the bottom of c, e, s, and t seem too crude". I agree, and I think it's because they're gently flaring (in the "a" as well). If you make them totally monoline, or maybe even taper gently, I think that might fix it.</p>
      <p>The first "g" is more harmonious, but the third one might be just what the font needs in terms of making its mark. I would make the third one the default and the first the alternate. Don't worry about any Souvenir connection. Oh, and dump the second one.  :-)</p>
      <p>The "k" I actually like very much! And like Spiekermann has said, a love/hate glyph can be a veritable gold-mine! You might need to tweak it later, but I would let it live until there's reason to believe there's a problem.</p>
      <p>The ball of the "r" needs to be larger.</p>
      <p>The head of the "s" is recoiling. You might pull it to the right a hair.</p>
      <p>The very top of the "t" is boring. Not sure how to best fix it though.<br>
      And I would make the leftward bar flat on the bottom, slanted on the top.</p>
      <p>I think I would make the "u" serifs like the ones in the "v". That's one convention that seems to make sense (even though it seems counter-intuitive).</p>
      <p>I would make the "z" serifs longer.</p>
      <p>The exclamation mark is way too blah.</p>
      <p>--</p>
      <p>I also have some macro crits:<br>
      If this is really a text-size cut, and you're planning on making a small-size cut, the problem is this cut is already very wide and large on the body*. If this will be used small, it needs to be darker. If there will be another smaller cut, what's THAT going to look like?! :-)  I'm not sure what to recommend, because the large width of this design is part of its charm and character... Normally I would recommend making a bit narrower. Another way is to shoot for small text with this (and probably give up on making a smaller cut) and make it darker.</p>
      <p>* Like Jesse said, it's happy at 8 (and maybe even 7).</p>
      <p>In any case, the vertical proportions are a bit off. Assuming the x-height will stay this size, if this is shooting for small text I would shorten the descenders; if it's shooting for 9-10 point I would lengthen the ascenders.</p>
      <p>Nina, this is great stuff - please keep it up!<br>
      (But don't forget to eat and breathe.)</p>
      <p>hhp</p>
