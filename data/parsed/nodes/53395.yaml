      <p>***</p>
      <p>Caps: Still rather rough, so I'm all ears for proportions and weights that are off, etc.<br>
      I think I've pretty much settled for the short and wide overall proportions, I think it fits the font quite nicely.</p>
      <p>"A": I've decided for the head-serif-less one at least for now; it does seem to be more "usable" / less problematic.<br>
      "L", "T": Ben, I made the vertical serifs a hair longer. I think I did. But the ones on the "T" quickly run me into collision problems (tittles, x-height stuff).<br>
      "M", "N" etc.: I've found that I'm having to do a lot of optical corrections (trapping, thinning of strokes, &amp;c.) on some glyphs. Please let me know if this works for you; I don't quite trust my printer.</p>
