      <p>Wow, thank you! You know you didn't *have* to do this – but I greatly appreciate it. I hope I'll have time soon to continue working on this. Then I can get back in more detail.</p>
      <p>Just these 2 things for now:</p>
      <p>The "l" in "fl" is a contextual alternate at the moment (like in "fb", "fh", and "fk"). This is mostly for German where these can't always be physically ligated (there are grammatical rules). That said, I may well make an additional "fl" lig that's similar to the "fi" in concept.</p>
      <p><cite>[Q] "I think this is the glyph most needing work."</cite><br>
