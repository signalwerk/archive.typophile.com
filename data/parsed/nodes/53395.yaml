    html: |-
      <p>Hi Nina. Ok, so I finally got around to giving some crit on the specimen booklet you sent (thank you again!) and here are my opinions. I think I've said some of these things previously and you may have investigated my suggestions before, I don't know. Remember the salt!</p>
      <p>At large sizes, G looks like the crossbar should be wider, extending more into the counterspace. The bowl of J looks like something pulled its SW curve outwards a little. I wonder whether the vertical serifs on L and T should be longer; I think usually these are more pronounced than horizontal serifs. Q...you know what I'd do with its tail. I think this is the glyph most needing work. I love R (and BDP)...somehow I find these shapes really hard to draw and yours have a nice poise and tautness. V...the contrast works really well, it's almost unnoticeable. Y as well. Did you try a higher midpoint on the W? Z: longer serifs? Looks like the lc z has larger serifs than the uc. </p>
      <p>Lowercase. These are really beautiful. I really admire them. I like the way there's the balance between quite rigid shapes (a, d, h, x) and unique elements (g, k, s, y). I like the way the a and c have slight tapering towards the terminals...the curves are nicely placed so as to be not too curly and cute but not too sharp and straight. I'd like to see similar inflection on the hood of the f, which perhaps looks a bit too curved before the ball terminal. I wonder if that might also resolve the s in a more satisfying way, I know you weren't quite happy with the s. I think the descender of j could need a tweak. Now, with k, I'm afraid there's something distracting at small sizes where the eye notices there's something going on but can't quite tell when reading. I'd make the bar shorter so as to not be noticeable so much when small but can be a feature at large sizes, perhaps. The join might also benefit from being lower down the stem. The letters I haven't mentioned I think are actually very good, lovely.</p>
      <p>Numerals. 7 usually has a heavy top stroke and less weight on the diagonal, doesn't it? Or a thinner part near the top widening out to the baseline. I think there may be slightly too much weight on your downstroke, only a hair. And I'd make the hanging-down serif longer. I find 4 a bit pinched at the apex. It looks like it starts with a lovely curve at the crossbar then turns a bit flatter as it approaches the apex and the overall shape (counter) is a bit narrow looking. Maybe this is just my taste. Should lf 3 have a lower midpoint? The egg-shaped zero puzzles me.</p>
      <p>I originally thought 10pt was the best, now I'm seeing it works very well at 8pt too, perhaps best. The general colour, spacing and proportions all look marvellous. The remarks above don't apply so much, though I'd still make the vertical serifs longer. It looks good in all caps. I like the fi lig, the fl one sticks out a bit slightly perhaps (is that a contextual alternate or a discretionary lig?)</p>
      <p>Diacritics...I'm no expert at all at all but tilde looks a little shy and flat. I like the idea of the Polish acute as a language alternate...how do you write the feature code to do that?</p>
      <p>@ is very nice. I like the cover!</p>
      <p>Dagger might be too detailed/too small. Is there a double dagger? Quotation marks seem to be right handed or straight but no left handed? Curly brackets...maybe curve more round at the top...seems there's not enough 'backbone' compared with the tautness of the alphabetic glyphs...get a shape that harmonises with a perhaps. </p>
      <p>£ could have a wider hood, looks a bit mean and overbitey. # and Yen are very nice.</p>
      <p>Spacing. a needs a notch less on the left. r_t lig is a bit tight. lbar_y looks great. There's something very odd with ak and nk. rn might be a bit close, see in 'Ernestine'. Other than that, I'm afraid I'm space-blind, so I won't comment. It's a hard, hard thing, good luck!</p>
      <p>Hope this has been useful...as you always say, it's good not just for the person who drew the type but for others who are learning how to look for things and how they work. Thanks! :)</p>
    html_clean: |-
