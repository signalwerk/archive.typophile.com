      <p>Hi Nina<br>
      I saw this one starting off on your blog and like the direction you're taking.<br>
      The tapered hood of your a looks great; not too noticeable but keeps the lightness and openness you want. My solution would have probably been to raise the terminal up more horizontal, to keep the line thickness even, but that would have destroyed the shape of the glyph completely. The tapering will really help your s.<br>
      I prefer the souvenir g, but do see what happens when you mix it with the first one, with the tail starting between those two versions.<br>
      The k doesn't work for me, but it's not the curl, it's the crossbar...for me it's too wide and I'd bring the knee in a notch or two. Would that do odd things to the angle of the arm and leg?<br>
      You're right about monolines being the most difficult! I haven't ventured into them yet. Good luck! :)<br>
      I'm also a beginner so</p>
