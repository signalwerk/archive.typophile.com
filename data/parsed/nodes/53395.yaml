      <p>A friendly and jolly face, this! I see great potential for expansion here. I think you have to work more on most of the curves, though, especially the c, s, u, n, m, f and e, and the y and j descender hooks look quite wobbly and uneven to me, making them look kind of bent iron-ish. The r looks a little weak, too. Is that u a little too wide? I'd try a ball terminal on the a once more, and try compensating by making the bowl smaller. </p>
      <p>Your b, p and k are truly beautiful! Definitely keep that k.</p>
      <p>That first g is my favourite. I'm looking forward to see this revised. </p>
