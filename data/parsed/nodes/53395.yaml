      <p>So. Young Ernestine was a bit large, a bit butch, loud, and jolly; then she suddenly got a serious office job and ended up buying stiff waisted clothes she never really got comfortable in (and couldn't afford, either)… :-/<br>
      Font psychology aside: A little temporal distance really seems to make v.2 look pretty cramped.</p>
      <p>This time, before I spend forty hours cooking up an whole new alphabet, and derail somewhere along the way without noticing, I'd like to throw a few preliminary new glyphs out there that show the changes I've been thinking about. Those are mainly<br>
      - making it monoline<br>
      - making it heavier (&amp; with thicker serifs too)<br>
      - and a little bit wider again (but not so wide as to be uncomfortable at text sizes – still aiming for let's say 8–11 with this).<br>
      There is also a new attempt at a "g", and I must say I dig this one!<br>
      - vertical metrics aren't quite sorted out yet.</p>
      <p>What do you guys think?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/honigmohn_5879.gif"></div><p></p>
