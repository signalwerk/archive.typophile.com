      <p>Nina, this is looking great. The color and vertical proportions* seem very good. And that "g" is da bomb! Definitely a keeper, with little need for an alternate. The only thing I <em>might</em> tweak is the ear: it seems possibly too close to the x-line half-serifs; I'd try making it higher.</p>
      <p>* Here you've moved from ~8 to 9-10 point size.</p>
      <p>I would give this warning however: you've moved pretty firmly into the "contemporary" sphere (even with that "g") whereas before it had a distinct and arguably nicely anachronistic flavor. This move will make the font more versatile, but also perhaps less memorable. Considering this is only your... second :-) outline font I actually think this is a very good move. You can revert to a more old-school version later - and in fact having the two (daughter and mother?) would make for a nice subtle contrast, the sort we don't have enough of in type.</p>
      <p>BTW, am I noticing that you've made the tittle a hair "too" dark? Is that<br>
      a Patria influence? :-)  Be prepared for the flack from other type designers.</p>
      <p>hhp</p>
