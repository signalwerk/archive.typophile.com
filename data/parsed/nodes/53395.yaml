      <p>Exciting progress!<br>
      Some notes from my once-over:</p>
      <p>- ft combination (in "Fifty") is just utterly lovely!<br>
      - exclamation point is nice<br>
      - center vertex of M is too fragile.<br>
      - placement of Q's tail seems somewhat arbitrary, "tacked-on." Would starting it more vertically as it comes off the bowl mesh with the "perpendicularity" of the slab serifs better? (Or would that sap it of energy?)<br>
      - I know there are encroaching neighbors to consider but could you give yet another hair to the vertical serifs of E/F/T/L/Z? (perhaps 2/3/7 too)<br>
      - too much contrast in arms of Y, and maybe X too. Or are my eyes playing tricks on me?<br>
      - inconsistent stroke widths: (cap) Z's diagonal seems slimmer while (lc) z's diagonal is thicker<br>
      - maybe enlarge the counter of the ring diacritic<br>
      - strengthen the middle arm-and-serif (the one at the right, at e-crossbar height) of the ampersand<br>
      - the overhang of proportional one's flag over the bottom serif looks goofy to me in the big specimen, but in the text context not so much.<br>
      - did you try some kind of taper on the base stroke of tabular one?<br>
      - I might lower the middle vertex of all the threes<br>
      - I'd try a serif (maybe an upward slab) at the top terminal of your fives<br>
      - I'm totally on-board with your foot-seriffed sevens<br>
      - wide, offset form of eight looks good - maybe make the bottom bowl a touch rounder (less squarish)<br>
      - I agree that you should consider your k fixed! :-)</p>
