    html: |-
      <p>Hrant, thanks for your critique; it's much appreciated.</p>
      <p>Depth: I'm glad to hear the thought that is behind at least some of this is showing. I generally can hardly do any work without a semi-solid concept. And actually,<br>
      many of the things you criticize are those I hadn't really thought about, but rather "assumed" as sort of a starting point – like the vertical metrics, for instance.</p>
      <p><em>"Divergence is extremely important in a text face, it’s just very easy to go too far, and too tempting to do it semi-randomly."</em><br>
      Yes! And I find it very hard to tell how much irregularity is OK in terms of doing<br>
      what feels right, or what seems to work; and how much *must* be standardized.<br>
      Like serif size: most of them are slightly longer on the right-hand side, those in<br>
      the more symmetrical and/or busy glyphs are symmetrical, and I have made them significantly longer on the right-hand side of the "f" and "r" because I felt these glyphs got stronger / more stable this way – and I have no clue if it's a good idea (theoretically) to work them like this.<br>
      The mysterious convergence of Brain and Gut makes this a very interesting process. :-)</p>
      <p>--</p>
      <p>Selected details: the others aren't forgotten, but on the checklist for the next round.</p>
      <p><em>"I like to leave the terminal of the “a” pretty “weak”…"</em><br>
      I didn't consciously realize this before, but I like Patria's "a" a lot.<br>
      As well as the one in Constantia (which is also "weak").</p>
      <p>"g": It's awful, but I've realized I don't *like* the third one. We're just not friends.<br>
      I'll search for this shape some more. Maybe something between the first and the third one, with the join of the descender at an intermediate angle, might be interesting.</p>
      <p>"k": I'm glad to hear you like this one! Because I've decided I do like it,<br>
      and hope to be daring enough to keep it (or something conceptually close to it). :-)</p>
      <p><em>"The very top of the “t” is boring. Not sure how to best fix it though."</em><br>
      Maybe something like this? (Please try to ignore the ugly bottom.)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/taper-t_4747.png"></div><p></p>
      <p><em>"I think I would make the “u” serifs like the ones in the “v”. That’s one convention that seems to make sense (even though it seems counter-intuitive)."</em><br>
      Huh. Extremely counter-intuitive. I'll have to play around with that.</p>
      <p>--</p>
      <p>On the macro level: You know, I have no idea what this cut should do. In fact,<br>
      I don't really think of it as doing something, more as being the "master design"<br>
      of sorts; like a cell that hasn't differentiated, &amp; can still grow into something really small, or something really large. But that may not make that much sense as a plan.</p>
      <p>I don't know. I guess it's definitely not for standard text sizes (I just honestly can't picture anyone using this at 11 or 12pt, and yes I'm reluctant to make it narrower). I agree it feels quite happy at around 8; so how about I make this the base cut for say 7–10, and then derive one for 3–6 (I do want to see how low I can go with this). Does that make sense?<br>
      (Because the "tiny" cut needs traps, and if there's something I loathe in type,<br>
      it's visible ink traps at larger point sizes. And the traps I've experimented with<br>
      are visible at 10.)</p>
      <p><em>"If there will be another smaller cut, what’s THAT going to look like?! :-)"</em><br>
      Hey, remember the downright absurd proportions (I called them "funky" back then!) of <a href="http://typophile.com/node/50670" rel="nofollow">that metal face</a>? :-)<br>
      Seriously though: I'd like the "tiny" cut not to look substantially wider than this, just slightly heavier. Though I don't know yet if I can make that work.</p>
      <p>--</p>
      <p>I'm letting this rest for a couple more days, as I'm currently facing a heap<br>
      of (other) work; I'm planning to get back to working on it in the weekend,<br>
      and hoping to post a revision maybe next week. No worries: This is my project<br>
      for the Zurich course after all, so I'll need to finish *something* by June! </p>
      <p>I'm not that petrified of the jungle anymore. After all, I'm armed with coffee,<br>
      chocolate, and beer. And I feel like I'm at least beginning to see a path.<br>
      And it's great to have Typophile! (Especially now that school's on spring break.)</p>
      <p>—Nina</p>
