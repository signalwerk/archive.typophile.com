      <p>Thanks for your feed-back, Craig &amp; Hrant!</p>
      <p>Regarding the tapers: I'm glad I put them in, but I might be overdoing that.<br>
      As well as this:<br>
      "<em>Is the modulation ruining things?</em>"<br>
      I hope not. Though I've been wondering too.<br>
      But while I'm working out the weight, I'll try out different degrees of modulation<br>
      as well. I guess I will eventually have to make a decision to push either practicality at the expense of character, or the other way round. (I'm slowly beginning to understand your <a href="http://typophile.com/node/50153?page=1" rel="nofollow">statement</a>, Hrant, a few months ago that "trying to make a font some sort of 'ultimate' always ends in tears.")</p>
      <p>I'm glad nobody has objected to the narrower proportions (yet). They do seem to read better (plus make it a *hint* less *impossible* to make certain glyphs work, which is also nice).</p>
      <p>I'll be working on the details / individual glyphs both of you mentioned, most of which is touching me right where it hurts :-). I'm quite uncomfortable with all those diagonals (vwxyz), the "s" is driving me nuts from a technical perspective<br>
      (I was actually trying to make the spine heaviest in the middle!), and the "t" is just confusing me – I can't seem to figure out what matters in that strange little letter, &amp; how it relates to others (most significantly the top).</p>
      <p>The ball of the "r" was sort of an experiment to make it clog less at smaller sizes (well, and on my printer) and still have it be kind of pronounced – though I admit it looks quite silly.&nbsp;&nbsp;:-)</p>
      <p><em>"I’m impressed with your patience on this, getting one thing right before moving on to the next."</em><br>
      Craig, that ain't patience. But you may call me obsessive, or a control freak.<br>
      Both of which feel rather futile in the face of this!</p>
      <p>Hanging space: Magnetic wall paint rocks for flexibility. It's not like Ernestine is always allowed to take up <em>all</em> that space.&nbsp;&nbsp;;-)</p>
      <p>Cheers!</p>
