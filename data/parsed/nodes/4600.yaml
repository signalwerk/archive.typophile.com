    html: <p>Hey, all. Abbey's a friend of mine, and when she asked about this particular issue I heartily recommended that she post her questions on Typophile, bragging about the immense intellect found here... Can anyone offer her some direction on this? (see her link for more information). <br> <br>Thanks!</p>
