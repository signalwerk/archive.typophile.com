    date_raw: 5 May 2004 — 7:36am
    votes: null
    html: "<p>This is a bit heavy for me. <br>Certainly Arial's 2692 is suspicious; could it be a value for the absolute maximum vertical span of the font? Meaning the highest a glyph in the font goes plus the lower another glyph goes? So this value might not be the same as the nominal em height, used for setting your typical line. <br> <br>Also: would it matter if Arial is a TT font while Amazon in a PS? <br> <br>hhp <br></p>"
  - id: 33955
    user: 1026
    date: 2004-05-06T12:28:00
    date_raw: 6 May 2004 — 12:28pm
    votes: null
    html: "<p>I'm way outta my league here, but I noticed this: <br> <br>When I look at the metrics of Arial, my Descent and CapHeight are -434 and 1466 -- based on a 2048 UPM grid. Those are exactly propotional with yours (-212 and 716), assuming translation to a 1000 UPM grid. However, the Ascent is off (905 translates to 1853 on a 2048 UPM, while the value in Arial is 1491). <br> <br>The character widths listed in your data also translate spot on to a 1000 UPM grid. (E.g., the width of J is 500 as opposed to 1024.) <br> <br>However, when I add up the WinAscent, WinDescent, and LineGap values, I get 2595. Kinda close to the wierd 2692 value, but no cigar.  <br> <br>Perhaps the font's UPM is being converted, but there are some funky glitches? <br> <br>Now that I've offered no real help, I'm outta here ;-) <br> <br></p>"
