    html: |-
      <p>In an educational context, I would say that the ﬁrst fat faces (early 19th century) and the “Ultra Bodonis” of the early 20th century are worth studying, because the designers of these were pushing the limit of form experimentally. Commercial’s Austin is more about the nuances of style—targeting fashion magazines while alluding to the 1970s (e.g. Lubalin/Carnese’s Fat Face).</p>
      <p>Has anybody designed a “Klimax with serifs” yet?<br>
      If not, it may be what you should try (emulating the principle, not the artefact).</p>
