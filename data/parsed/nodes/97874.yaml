  html: |-
    <p>Hi. I'm design some type with the following concept:<br>
    i want to get the glyphs as bold/heavy as possible, but also having high contrast between the thicks and thins. its kind of an experiment testing the relationship of the black and white. the serifs will be very thin, i want the glyphs to have a sexy fashionable look to it. so far, i have not found any project that matches this description. if you know of a certain typeface that is similar to what i'm describing, please share, so i may study it. thank you.</p>
