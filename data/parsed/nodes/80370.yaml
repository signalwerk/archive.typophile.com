    <p>LATINOTYPE NEWS! | MARCH 2011 | MAZÚRQUICA &amp; REGIA SANS PRO</p>
    <p>Mazúrquica designed by Javier Quintana.</p>
    <p>Mazúrquica is an extra condensed sans-serif typeface, ideal for titles and headlines looking for impact and style. Designed in three weights: Ligera (light), Media (medium), Pesada (heavy), allowing its use for many applications. Its capitals features a set of ligatures, giving a particular look to upper case text.</p>
    <p>Mazúrquica is an excellent choice for magazines, books, posters, brochures, flyers, etc..</p>
    <p>Available now at: <a href="http://new.myfonts.com/fonts/latinotype/mazurquica/" rel="nofollow">new.myfonts.com/fonts/latinotype/mazurquica/</a></p>
    <p>---------------------------------------------------</p>
    <p>Regia Sans Pro designed by Luciano Vergara.</p>
    <p>Regia Sans is a typeface that began in 2008, in Concepción, Chile, and was first released for sale to see Latinotype.</p>
    <p>This new version includes more than 1,300 characters in Opentype format, many ligatures (including diacritical marks and numbers), two groups of alternate characters, and some swash characters.</p>
    <p>Available now at: <a href="http://new.myfonts.com/fonts/latinotype/regia-sans-pro/" rel="nofollow">new.myfonts.com/fonts/latinotype/regia-sans-pro/</a></p>
    <p>Enjoy it!</p>
    <p>LatinoType </p><div class="imageWrap"><img src="http://typophile.com/files/news_march_590_6650.jpg"></div>l<p></p>
