      <p>I want to understand a couple of things clearly as I don't want to put the proverbial foot in my mouth again.(Thomas you were right)<br>
      1) Windows 8 Metro interface(the start screen and all the metro apps) use grayscale subpixel rendering. They are using this as RGB subpixel rendering is not optimized for both Portrait and Landscape mode and moving text during animations<br>
      2) Windows 8 desktop environment still uses the subpixel RGB rendering though desktop IE10 uses greyscale subpixel rendering.<br>
      3) Some applications can still access the the old GDI rendering</p>
      <p>Okay I hope I am right in all the above cases<br>
      and now coming back to the experiment. I compared the text rendering of small text on all the three browsers in  desktop mode of windows 8. You can clearly see the grayscale rendering of IE10 vs the RGB rendering of FFand Chrome<br>
      <a href="http://img4.imagetitan.com/img.php?image=5_grayscalevssubpixelrendering.jpg" target="_blank" rel="nofollow"><img src="http://img4.imagetitan.com/img4/small/5/5_grayscalevssubpixelrendering.jpg" border="0" alt="Image Hosted by ImageTitan.com"></a><br>
      The rendering of text looks fuzzy and the shapes are not very clear because of the greyscale subpixel rendering.<br>
      <a href="http://img4.imagetitan.com/img.php?image=5_ievsffvschrome.png" target="_blank" rel="nofollow"><img src="http://img4.imagetitan.com/img4/small/5/5_ievsffvschrome.png" border="0" alt="Image Hosted by ImageTitan.com"></a><br>
      <a href="http://img4.imagetitan.com/img.php?image=5_ievsffvschromettwt.png" target="_blank" rel="nofollow"><img src="http://img4.imagetitan.com/img4/small/5/5_ievsffvschromettwt.png" border="0" alt="Image Hosted by ImageTitan.com"></a><br>
      That being said, i do like the subpixel grayscale rendering as it reduces jaggedness at the larger sizes.<br>
      IE10 uses grayscale rendering  and the antialising is very good when compared chrome's and firefox's RGB rendering which is poor.<br>
      <a href="http://img4.imagetitan.com/img.php?image=5_kerncomapre.png" target="_blank" rel="nofollow"><img src="http://img4.imagetitan.com/img4/small/5/5_kerncomapre.png" border="0" alt="Image Hosted by ImageTitan.com"></a><br>
      @John FF17 by default uses Hardware acceleration and hence directwrite.</p>
