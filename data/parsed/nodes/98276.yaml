      IE10 uses grayscale rendering  and the antialising is very good when compared chrome's and firefox's RGB rendering which is poor.<br>
      <a href="http://img4.imagetitan.com/img.php?image=5_kerncomapre.png" target="_blank" rel="nofollow" class="link-external"><img src="http://img4.imagetitan.com/img4/small/5/5_kerncomapre.png" border="0" alt="Image Hosted by ImageTitan.com"></a><br>
