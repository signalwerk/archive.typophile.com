    html: |-
      <p>Typogruffer: I believe your points 1, 2, and 3 above are all correct.</p>
      <p>However, it's important to note with regard to (2) that there is not just "the" subpixel RGB rendering. There is GDI ClearType, and DirectWrite ClearType. DirectWrite ClearType is much better than GDI ClearType.</p>
      <p>The screenshot you posted shows Metro's Grayscale ClearType in IE 10. But the FF17 and Chrome23 samples are definitely showing GDI ClearType, and not DirectWrite ClearType. One can tell by the lack of Y-direction anti-aliasing, visible as jagginess on curves just as they come off the horizontal.</p>
      <p>Side note, my opinion: Metro's so-called Grayscale ClearType is often preferable to GDI ClearType for font rendering at larger sizes, and inferior to it with most fonts at smaller body text sizes. It is certainly better than the old GDI Grayscale rendering. But none of these are as good as DirectWrite ClearType, especially at small sizes.</p>
