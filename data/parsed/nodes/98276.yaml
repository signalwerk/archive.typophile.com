      <p>Chaitanya, in your comparison image, all three browsers are using some form of colour subpixel rendering, so none of these is the new Win8 greyscale rendering. It looks like two different versions of ClearType: the two on the left are consistent, but the one on the right is lighter. I used a zoom tool to examine the pixel colouring.</p>
      <p>As I recall, when FireFox introduced DWrite support, it was not on by default, but needed to be set in preferences. I don't know whether they changed this in more recent builds. Unless one knows enough to be able to spot the differences between GDI and DWrite versions of ClearType, the best way to determine which is in use is to look at CFF PostScript fonts: under GDI these will have crappy greyscale rendering, under DWrite they will have ClearType rendering.</p>
