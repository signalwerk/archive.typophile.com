      <p>Firefox switched to DirectWrite during version 4 and they said the results were pretty good. If IE10 is also using Dwrite, then it should be decent and I just checked it. I took Ellen L's thinking with type website as my example as it contains awfully small text(I am in my early 20s and both my eyes and head hurt if I read that website for some time &amp; god knows about elders) I compared the same text in both the web browsers and as you can clearly see*, IE10's rendering is far superior than Firefox's( I am assuming that FF uses Dwrite and not GDI <a href="http://blog.mozilla.org/nattokirai/2011/08/11/directwrite-text-rendering-in-firefox-6/" title="http://blog.mozilla.org/nattokirai/2011/08/11/directwrite-text-rendering-in-firefox-6/">http://blog.mozilla.org/nattokirai/2011/08/11/directwrite-text-rendering...</a>).<br>
