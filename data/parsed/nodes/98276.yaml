      *<a href="http://postimage.org/image/ubwhdckmt/" rel="nofollow">The comparison Image</a><br>
      UPDATE: I did read at some forums that after enabling directwrite, the fonts look fuzzy and light. Google Chrome 22 doesn't use DirectWrite and I have compared it with both Frefox17 and IE10 which uses DirectWrite. I observed that IE10s rendering beats both firefox and chrome while firefox is slightly better(almost negligibly) than chrome. I am attaching the images here but the difference is not really noticeable. You have to check it for yourself.<br>
      <a href="http://www.freeimagehosting.net/fltfi" rel="nofollow"><img src="http://www.freeimagehosting.net/t/fltfi.jpg"></a></p>
