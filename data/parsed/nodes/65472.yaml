    <p>Hi all. I would appreciate your opinions on this typeface under construction. I want to create a monoline slab serif with a "DIN" feel to it, and to also be readable at text sizes. I have only given the letter spacing a cursory adjusting, so go easy there. But in the end I do see this having generous "air" between everything. Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/slab_specimen_01_6584.gif"></div><p></p>
