      <p>So I've been hard at work on this, expanding it into a small family. (now "Frusta") Just when I think I'm about done, there are some details that I feel could improve. Could I get your opinion on the terminal changes in the S,c,e, and s below? I can't objectively tell if this would be an improvement or not. I feel like it would make the characters more open and steady on the baseline. What do you think?</p>
