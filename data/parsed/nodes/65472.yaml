    html: |-
      <p>Thanks. Good calls on the "æ" and "d." Didn't even see that. Your accent comments got me thinking about punctuation and diacritics altogether. I made some adjustments to get them more "in line" with the warmth that you pointed out. (rounding and tapering...new ones in black) Those extras are so open to interpretation, yet at the same time bound by some strict guidelines. It's a great challenge.</p>
      <p>Do you think the comma/semicolon should be curved like the quote marks?</p>
