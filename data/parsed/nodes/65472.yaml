  - id: 384666
    user: 36737
    date: 2009-12-18T06:34:00
    date_raw: 18 Dec 2009 — 6:34am
    votes: null
    html: |-
      <p>I too like the tapered serifs. They give a certain warmth to the characters that I really enjoy. And I also agree with cerulean in that the bottom a-join of æ looks a bit too thin. Your hyphens jump out at me really quick, too. I think they are too thick, by about 20 or 25%.</p>
      <p>Perhaps there is more work to be done with the acute accent (´). I find it a bit too slanted and squished down. I think pulling back on the angle a bit and giving it just a bit of height will greatly improve them. Right now, it feels as though the acute accent has really nothing to relate to in the rest of the typeface design, and I think the angle makes it look somewhat thinner than other strokes in the design.</p>
      <p>Finally, and this is probably a question of personal taste: I’d love to see an apostrophe with some curvature. It may help consolidate the overall warmth that I mentioned at the beginning. Or maybe not, but I’d try it anyway.</p>
      <p>Thanks for sharing!</p>
    html_clean: |-
