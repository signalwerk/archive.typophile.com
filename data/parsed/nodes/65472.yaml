    html: <p>I like it. I like all the tapered ends. The daggers, if you're ready to care about things like daggers, could use some of those. The top serif of the "d" is distracting and would probably be better turned back the other way. I think the bottom a-join of "ae" should  not thin as much as in the regular "a", because there's no stem there.</p>
