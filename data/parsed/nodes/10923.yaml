    html: <p>I am very sorry to announce that Roxy Fonts will have to change it's name. The six fonts scheduled for a march release (Kofika, Zarza, Polara, Exboy, Weirdiac and Moneyca Boulevard) will find a new home in a few days. For now, I'm doing my best to find not a font, but a COMPANY name that's not taken and that's at least a bit catchy... plus a new domain name.  <br>Names, names, names...  <br>watch this space or look up soon at MyFonts.com <br> <br><img src="http://www.typophile.com/forums/messages/72/860.gif" alt="moneyca boulevard medium"> <br><img src="http://www.typophile.com/forums/messages/72/861.gif" alt="zarza lite"> <br><img src="http://www.typophile.com/forums/messages/72/862.gif" alt="kofika bold"></p>
