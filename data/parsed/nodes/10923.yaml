  date_raw: 25 Feb 2002 — 3:28am
  votes: null
  html: "<p>After almost one year in the making, Roxy Fonts, the first mexican digital type foundry is here with a monthly offering of six new fonts designed in and with love by Victor Yb Delgado. <br> <br>For our inaugural issue of March 2002 we have selected some of our most original work : the elongated but strange elegance of <a href=\"http://www.roxyfonts.com/fontshop/moneyk/mny.htm\" target=\"_top\">Moneyca Boulevard</a>, a huggy bear feeling with <a href=\"http://www.roxyfonts.com/fontshop/polara/pol.htm\" target=\"_top\">Polara</a>, the fun and rhythm of <a href=\"http://www.roxyfonts.com/fontshop/kofika/kfk.htm\" target=\"_top\">Kofika</a>, plus the sheer novelty of <a href=\"http://www.roxyfonts.com/fontshop/zarza/zrz.htm\" target=\"_top\">Zarza</a> and <a href=\"http://www.roxyfonts.com/fontshop/exboy/exb.htm\" target=\"_top\">Exboy</a> families. <br> <br>And don't miss our free download of the month, <a href=\"http://www.roxyfonts.com/fontshop/weirdiac/wei.htm\" target=\"_top\">Weirdiac</a>, a manic drugressive dingbat font! <br> <br>Roxy Fonts is an indie space where words like repetitive, derivative and, most of all, expensive are never spoken. <br> <br>...a little type corner you will definitely want to bookmark. <br> <br>Roxy Fonts, for the love of type <br><a href=\"http://www.roxyfonts.com\" target=\"_top\">www.roxyfonts.com</a></p>"
  html_clean: "<p>After almost one year in the making, Roxy Fonts, the first mexican digital type foundry is here with a monthly offering of six new fonts designed in and with love by Victor Yb Delgado. <br> <br>For our inaugural issue of March 2002 we have selected some of our most original work : the elongated but strange elegance of <a href=\"http://www.roxyfonts.com/fontshop/moneyk/mny.htm\" target=\"_top\" class=\"link-external\">Moneyca Boulevard</a>, a huggy bear feeling with <a href=\"http://www.roxyfonts.com/fontshop/polara/pol.htm\" target=\"_top\" class=\"link-external\">Polara</a>, the fun and rhythm of <a href=\"http://www.roxyfonts.com/fontshop/kofika/kfk.htm\" target=\"_top\" class=\"link-external\">Kofika</a>, plus the sheer novelty of <a href=\"http://www.roxyfonts.com/fontshop/zarza/zrz.htm\" target=\"_top\" class=\"link-external\">Zarza</a> and <a href=\"http://www.roxyfonts.com/fontshop/exboy/exb.htm\" target=\"_top\" class=\"link-external\">Exboy</a> families. <br> <br>And don't miss our free download of the month, <a href=\"http://www.roxyfonts.com/fontshop/weirdiac/wei.htm\" target=\"_top\" class=\"link-external\">Weirdiac</a>, a manic drugressive dingbat font! <br> <br>Roxy Fonts is an indie space where words like repetitive, derivative and, most of all, expensive are never spoken. <br> <br>...a little type corner you will definitely want to bookmark. <br> <br>Roxy Fonts, for the love of type <br><a href=\"http://www.roxyfonts.com\" target=\"_top\" class=\"link-external\">www.roxyfonts.com</a></p>"
