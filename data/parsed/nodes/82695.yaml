      <p>When I want to know what font is used to render some text, I copy it and paste it in TextEdit. That seems to give reliable information. Here is what I get:</p>
      <p><img src="/sites/default/files/old-images/mshtakan_5701.jpg"></p>
      <p>On the other hand, if I paste the very same text in Pages (on OS X 10.5), the look remains the same, but Pages tells me the font is Helvetica. I thus guess that Pages on the iPad would not be more useful to learn the font.</p>
