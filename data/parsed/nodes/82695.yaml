      <p>There is only one font in iOS that provides Armenian glyphs. It's called .PhoneFallback:</p>
      <p><img src="/sites/default/files/old-images/iphone-armenian_6668.png"></p>
      <p>The description reads:</p>
      <p>»The .PhoneFallback font is used by the operating system to display Unicode data when the font requested does not have the capability to handle the requested Unicode. PhoneFallback is based upon the Open Source font Bitstream Vera and the public domain font Deja Vu. Bitstream Vera is a trademark of Bitstream, Inc., designed by Jim Lyles. See complete license details at <a href="http://dejavu-fonts.org/wiki/index.php?title=License">http://dejavu-fonts.org/wiki/index.php?title=License</a>«</p>
      <p>Indeed the Armenian in .PhoneFallback is identical to that in DejaVu Sans.</p>
    html_clean: |-
