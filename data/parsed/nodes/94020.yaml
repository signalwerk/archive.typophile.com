      <p>The font is described by its creator, Benn Coifman, as follows:</p>
      <p>"Compare to the lettering used by the Union Pacific Railroad on its freight and passenger trains since the late 1930's. Also once used by the Milwaukee Road for their passenger trains. The font is versatile enough to use in documents or on models. Includes small caps, accents and full punctuation."</p>
      <p>The font NAME was probably based on "The City of New Orleans". The City of New Orleans was a passenger train of the Illinois Central line, and was celebrated in a song sung and recorded  by Arlo Guthrie and later, Willie Nelson.</p>
      <p> - Herb</p>
