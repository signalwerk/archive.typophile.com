      <p>Our gallery will be selling original art, but our major focus will be generating a diverse collection of prints we want to sell from a large variety of artists.  Try to make art &amp; design that we like more widely available to those who can’t really spend $4000 on a painting, and artists who can’t afford to purchase 100 prints of their work up front.</p>
