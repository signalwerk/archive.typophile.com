      <p>Greetings. You are on the right track with the design you have so far. It appears very clean and modern…but I don’t know if the typeface alone reads as “European”. Do the dots above the “o” help in pronunciation, or are they simply there to create the feeling of a European name? Have you tried any fonts as common as “Helvetica” or “Helvetica Neue” bold? Both offer a “t” with a flat terminal. I was a little unclear on what you meant by a uniform ear on the “r”. Best of luck on your next stage in the creative process.</p>
      <p>-Ben</p>
