      <p>I don’t get the point of the pill. Before you introduced it, you were on your way to a nicely abstract logo. The pill makes it so much more figurative that a) you lose the European feel and b) you risk stirring associations you might not want.</p>
      <p>If by European you mean highly simplified and sober, I’d go back to the first image. Using the pill makes me think much more of American  than European logo’s.</p>
      <p>Something else: have you tried scaling the image slight up? I think the subtly round edges should aline with the round tops of the o and e. Optically round forms need to extend slightly over the top and bottom of the x-height to create the illusion of eveness.</p>
      <p>It is promising, though — keep at it!</p>
      <p>——————————————————————————<br>
      My work is a game. A very serious game [M.C. Escher]</p>
