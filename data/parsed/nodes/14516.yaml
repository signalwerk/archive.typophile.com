    <p>My goals for the design are modern, european, clean.  This is for a gallery space I will be opening next month but I can’t seem to find exactly the right typeface, and I don’t have the skills to create my own.</p>
    <p>In the current design I like the forms of the “e” and “o” although the dots above the “o” were put in by me and I don’t like the size or position yet.  I was hoping someone would know of a font that was very close to this but a more uniform ear on the “r” and a flat terminal on the “t”.</p>
    <p>I hope I said all of that correctly without sounding like a complete neophyte.</p>
    <p>Any help would be GREATLY appreciated since I’m on a very rushed deadline now that I am able to move in a month early than I was previously able to.</p>
