      <p>I don’t understand.</p>
      <p>It isn’t always appropriate to include such a 1 to 1 relationship<br>
      between the logo subject matter and the company/organization it<br>
      represents.</p>
      <p>I’m not sure how you could make this mark “European” nor if visually<br>
      it has to be.</p>
      <p>As for it being modern and for an art gallery, the trademark<br>
      you have created, while simple, fails to be memorable and/or unique.</p>
      <p>And I think that is because conceptually it isn’t as refined.</p>
      <p>What does a pill have to do with a gallery?</p>
      <p>I’m not trying to be a smartass, however the point of having a logo<br>
      mark is to have it surplant a written name.  Nike is Nike without<br>
      saying its name, just the swoosh.  At the very least have this ability.</p>
      <p>At this stage, I highly recommend concentrating on defining the<br>
      visual mark before going on to the type.</p>
      <p>Or</p>
      <p>You don’t need a visual mark and should just focus on the type as<br>
      the mark.</p>
