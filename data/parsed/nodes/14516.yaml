      <p>The umlaut softens the pronunciation so Tötre should be read as Toetre, so if the pronunciation is different you might consider losing it. Helvetica is the nearest to your sample, you might also look at Futura for a more geometric look or <a href="wiki/Jeremy Tankard’s" class="wiki-create">Jeremy Tankard’s</a> <a href="http://www.typography.net/type/aspect.htm">Aspect</a> as a modern example. I like the image (someone looking at a picture was my interpretation, but only after I read that this for a gallery). Also töt(re) could be roughly translated from German to English as kill(er) or tot(re) as dead(er) if that is something you need to consider.<br>
      Tim</p>
