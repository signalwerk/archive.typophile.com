      <p>The business model isn’t like deviant art where an artist can create and upload anything they want to sell.  This is run more like an art gallery, where different pieces are selected by us, and offered for sale on the site and in the physical gallery space.  However we will be able to create prints of different work we offer in house, making it cheaper for us and the artists we will represent.</p>
      <p>I guess I’m really not sure how to explain the brand I am trying to create.  If someone sees a pill and a name I guess their first impression will be a drug company.  Just like if I created an image of an easel before the text you would think art gallery, maybe.  Although seeing the design in an advertisement, business card or in our gallery space (which is in a building with 20 other galleries) people would read more into the choice of using the pill.</p>
      <p>The whole “European” thing was more about the typeface than the symbol.  So I guess that’s really not that intregal part of the over all design.</p>
      <p>I think what I’m going to do is do a little market research with some fellow design students and get their impressions before going further with this to see how much confusion there is.</p>
      <p>Thanks again for everyones advice.</p>
