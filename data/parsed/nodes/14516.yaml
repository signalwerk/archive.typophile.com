      <p>Thanks for everyones comments.</p>
      <p>I’ve tried changes with the typefaces everyone had suggested, but there is something about “Akkurat” that I like so I think I’m going to use it. Although I tightened up the kerning a bit, and now it feels more like an identity to me.  Any thoughts?</p>
      <p><a href="http://www.totre.com/totre-version-2.jpg">http://www.totre.com/totre-version-2.jpg</a></p>
      <p>The umlaut is necessary for the pronuciation, plus it adds a bit of a european feel I want.  Kind of cheesy I know, but I’m building this brand from scratch and don’t have a huge marketing budget to throw at it yet.</p>
      <p>Originally when I search for totre I came up with a meaning in sanskrit “whip in the right hand” which I thought was mildly amusing.  However I really like the idea it being similar to “killer”, not sure how I can use that to my advantage yet but it will be fun trying.</p>
      <p>As far as the mark goes I’m still working on that.  Orginally it was supposed to be a commentary on ultra simplified modern art (ie one circle on a canvas) and at the same time creating a clean simple mark.    I’m going to work on it some more today and tomorrow and see what I can come up with.</p>
