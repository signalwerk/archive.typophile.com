  html: <p>I suspect this is hand drawn, because the  i's are not exactly identical, but I think you could come pretty close to simulating this using <a href="http://www.myfonts.com/search?search%5Btext%5D=Arnova" target="_blank">ITC Arnova</a>. It would take little more than rotating some of the letters to match the slope of the original, and perhaps adding a serif to the 'c'. <br> <br>I admit I didn't hunt very long for this, and there may be better matches, but as I said, I doubt this is a font.</p>
  html_clean: <p>I suspect this is hand drawn, because the  i's are not exactly identical, but I think you could come pretty close to simulating this using <a href="http://www.myfonts.com/search?search%5Btext%5D=Arnova" target="_blank" class="link-external">ITC Arnova</a>. It would take little more than rotating some of the letters to match the slope of the original, and perhaps adding a serif to the 'c'. <br> <br>I admit I didn't hunt very long for this, and there may be better matches, but as I said, I doubt this is a font.</p>
