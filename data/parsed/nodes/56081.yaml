      <p>Hi Thomas, Jan,</p>
      <p>I tried Illustrator and Flash CS3, and both did the same thing. Photoshop (CS3) does it fine... Maybe a vector rendering issue?</p>
      <p>And sorry Jan, my english is not that good, so maybe I do not got exactly what you wrote. Do you think that because it retains the width between words/characters but drops it at the end of line, it's not a bug? Definitively it is a different behavior, but I think that, if the software is "educated" to "see" the space always as a blank space between characters, it's obvious that at the end of line it'll be "dropped", because it do not has any character at its left... :-)</p>
      <p>The question -- I think -- is: these softwares take care of the content of the glyph space or they just get its width to do the thing? But maybe I'm completely wrong and it's all my fault with a dumb misconfiguration... Anyway, I'm "attaching" a new file (<a href="http://www.fictilia.org/stuff/SpaceIssue.otf" rel="nofollow">SpaceIssue.otf</a>) to this post, in case someone want to do a quick test and share the experience... I suggest to write some words with spaces -- it will show as circles between the squares -- and then break it into curves to see if the circles (space) remains...</p>
