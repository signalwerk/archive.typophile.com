    html: |-
      <p>Dear God... As I said before, I used liga{} to substitute 'space' by my shaded space. But I have two spaces with different lengths, one 'half' and one 'full', and when I have two 'halfs' in a row, I want it to substitute by one 'full', so I did this:</p>
      <p><code><br>
      liga {<br>
        sub space by space.alt;<br>
        sub space.alt space.alt by space_space;<br>
      } liga<br>
      </code></p>
      <p>It worked, but just for four spaces in a row. When I hit the fifth, it don't works, and when I hit the sixth, it still shows just two 'fulls', and there it goes, showing just two 'fulls'...</p>
      <p>So I decided to stop the fight, leave the space empty and use endash and emdash as my 'half' and 'full' shaded spaces... :-)</p>
    html_clean: |-
      <p>Dear God... As I said before, I used liga{} to substitute 'space' by my shaded space. But I have two spaces with different lengths, one 'half' and one 'full', and when I have two 'halfs' in a row, I want it to substitute by one 'full', so I did this:</p>
      <p><code><br>
