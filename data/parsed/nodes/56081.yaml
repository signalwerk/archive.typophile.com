    html: |-
      <p>Interesting. I suspect that applications are making assumptions about /space/ being an empty, invisible glyph. They're not making the same assumptions, but they are making assumptions, and you are seeing the symptoms of these assumptions.</p>
      <p>Since these assumptions are almost certainly character-level, not glyph-level, there is probably nothing you can do about this on the font end.</p>
      <p>You might try encoding your shaded space glyph as something other than the space character (e.g. U+2592, medium shade), and inform users that if they want this shaded space, then they should search-and-replace for the space character.</p>
