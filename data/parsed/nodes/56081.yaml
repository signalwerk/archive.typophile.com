    <p>Hi,</p>
    <p>I'm redesigning <a href="http://www.flickr.com/photos/fca_/tags/chumbitos/" rel="nofollow">Chumbitos</a> and I want to "fill" its glyph "space", as another character. The problem is: When I test an .otf on Adobe software, it looks ok, but when I break the text into curves, the glyph "space" simply disappears. The curious thing is that on Corel the glyph appears only when I break the text into curves. And in Office, it looks ok...</p>
    <p>I thought that was happening because of a bad/poor draw of the glyph, but it happens with anything I put there...</p>
    <p>Anyone have any idea on what happens with this glyph?! :-/</p>
    <p>I'm on a PC (Windows XP) using FontLab with the "FreeFont" encoding...</p>
    <p>By the way, I'm attaching a preview image to show what I want from the glyph "space", just to illustrate my sad story... ;-)</p>
    <p>Thanks,<br>
    Anderson</p>
