      <p>It was originally a designed logo - not a font. Since then, <a class="freelinking external" href="http://cruztypedesign.com/" rel="nofollow">Ray Cruz</a>  created a proprietary customized outline font for the company or its advertiser, Young and Rubicam - I think it was named "CamelFont". There have also been a number of fonts unoficially created using the Camel logo as a guide. The only one I can find right now is  <a class="freelinking external" href="http://www.nerfect.com/typecof.html" rel="nofollow">Coffin Nails (2001, Nerfect)</a></p>
      <p> - Herb</p>
