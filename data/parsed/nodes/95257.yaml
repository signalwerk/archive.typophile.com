      <p>This font is part a logo totally unrelated with the famous cigarettes brand. The easiest way to find it out would probably be to ask directly to <a class="freelinking external" href="http://logopond.com/members/profile/35527" rel="nofollow">Gal</a>.<br>
      Part of the /C, makes me thinking to a <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/serpentine/" rel="nofollow">Serpentine</a> (Oblique Bold) customized.</p>
      <p>Edit: finally, got it! <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/konabold.php" rel="nofollow">Kona Bold</a>, manually slanted.</p>
