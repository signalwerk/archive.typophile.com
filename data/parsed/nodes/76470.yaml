      <p>Courtesy of Google...</p>
      <p>HPGL (Hewlett-Packard Graphics Language) is the standard print format for HP plotters, i.e., the data stream sent to HP (and compatible) plotters.  If you are now plotting to a Hewlett-Packard plotter, you are using HPGL!.  Most CAD programs output HPGL directly because they can print on HP plotters.</p>
      <p>HPGL is a an open language vector graphics file format (as opposed to raster or bit-map), assuring optimal file size with very fast and 100% accurate rendering.  HPGL/RTL can be output by all CAD/CAM/CAE systems.   All HP printers starting with the LaserJet 3 include HPGL as an integral part of PCL support.  RTL (raster transfer language) is a raster-based specification and a subset of standalone HPGL (but not within PCL). SwiftView supports standalone HPGL, HPGL2 and monochrome RTL, and HPGL in PCL.</p>
