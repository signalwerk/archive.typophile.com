    html: |-
      <p>It looks like DST is mainly used in embroidery equipment. It's not a font file format, but a graphics file format (in the same way that HPGL is), so you can't convert a ps1/otf to dst, you'd need to set the type and convert the image to dst. </p>
      <p>Jason C</p>
