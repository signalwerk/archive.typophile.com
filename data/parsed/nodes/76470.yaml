    <p>Hello Everyone,</p>
    <p>I have a client (a wine company) which has a printer that is able to print/burn letter on wine woodbox. It looks like the printer has arial as the default embedded font. So they want their custom type to be print also and want their own font to be embedded in the printer's memory.</p>
    <p>I contacted the printer distributor who told me that the font need to be converted in postscript DST. O_o<br>
    I have no idea and never heard of this DST format. Anybody might know about it and is it an easy way to convert a PS1/OTF font into this DST format ?</p>
    <p>The printer also accept HPGL format… I recall that it is a Corel format. Also anyone knows how to convert OTF font to HPGL without too much assle ?</p>
    <p>thanks in advance,</p>
    <p>Julien</p>
