  html: |-
    <p>Hello,<br>
    First of all sorry for my English, I'll try to be clear.</p>
    <p>I'm looking for a way to insert code (programme) into a type file (into a .otf or .ttf file).<br>
    Some language I could use to write algorythm which could substitutes glyphs to others (based on complex rules, algorythmes)</p>
    <p>I can not use ligatures because the substitution rules are far too complex.<br>
    If I would like to define them one by one I'll have to do it for every words.</p>
    <p>Which language (C, C++, Python...) ?<br>
    Which soft ?</p>
    <p>Thank you very much,<br>
    Patrice</p>
