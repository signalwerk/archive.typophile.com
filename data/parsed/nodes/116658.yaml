    html: <p>None of them. The closest things to programs in a font is the TrueType hinting/instructing code. Everything else is done with data tables compiled from a feature description language.</p>
    html_clean: <p>None of them. The closest things to programs in a font is the TrueType hinting/instructing code. Everything else is done with data tables compiled from a feature description language.</p>
  - id: 578618
    user: 29994
    date: 2014-05-19T15:22:00
    date_raw: 19 May 2014 — 3:22pm
    votes: null
    html: |-
      <p>Anything more complicated than the glyph-to-glyph translations offered by OpenType is usually done in a text layout engine. Examples are: Uniscribe (Microsoft Windows), Core Text (Apple), Harfbuzz/Pango (open source), and LaTEX.</p>
      <p>Also, software for special purposes such as equations (LaTEX again; MathType) and music (Guido) use additional routines, not linked to data available from font files only.</p>
