  html: |-
    <p>Hello, everyone!</p>
    <p>I need help identifying this type used on The September Issue. It was used for the names during the movie and on the end credits. I thought it was a really nice serif font with a bit of a nice odd touch with the capital 'C', which had like a small bulb hanging by the top end instead of a serif. They also appear on the ends of the capital 'S'.</p>
    <p>I did a search already but wasn't able to find an existing post.</p>
    <p>Thanks in advance.</p>
    <p>Here's a sample picture.</p>
