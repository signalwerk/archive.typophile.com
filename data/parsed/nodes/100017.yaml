    html: |-
      <p>A rendering of a font is not the font. There can't remotely be any copyright issues.</p>
      <p>Now, some EULAs do place usage restrictions - but that's rare. And unless your publication is something like "The Crappiest Fonts of the Past Decade" they're gonna to play along real nice like.</p>
      <p>The thing is, practically speaking the way this sort of thing often works is that you get the sample setting from the foundry. So: no need to actually have the fonts (gets very expensive very fast); implicit permission; and less work for you.</p>
      <p>I think a good person to ask for more advice is our very own Stephen Coles.<br>
      <a href="http://tinyurl.com/ahykbb5" title="http://tinyurl.com/ahykbb5">http://tinyurl.com/ahykbb5</a></p>
      <p>BTW, what's going to make your book special?</p>
      <p>hhp</p>
