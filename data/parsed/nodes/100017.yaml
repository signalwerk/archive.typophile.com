    html: |-
      <p>Typefaces in the US cannot be copyrighted, so it is highly unlikely you would have a problem. Typefaces can, however, receive a design patent but protection under that would only come into play if you were making fonts and making them available to the public.</p>
      <p>You might, if you so wish and have the time to do so, notify the designer that you are including it in the book but it is highly unlikely you need to.</p>
      <p>All that being said, I am not a lawyer.</p>
