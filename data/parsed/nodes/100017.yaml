    <p>Hi, I´m wondering about using images of type in books/magazines.<br>
    I´m thinking of making a book on type, but I´m not sure to what extent I can include images and/or type specimens of contemporary type (living designers). Do I have to ask every designer for permission first?<br>
    Does anyone knows about the copyright in this concern? Thank you..!</p>
  html_clean: |-
