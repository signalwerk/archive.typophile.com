    html: |-
      <p>Well, serif fonts are generally the conservative ones!</p>
      <p>I think your resume looks nice - but it depends a lot who's going to be looking at it. If it falls into the lap of somebody who is both typographically aware and heavily involved in multimedia production (so presumably "expressive") then you <em>might</em> get a negative reaction.</p>
      <p>If you want to add some flair I might do it in the body face itself, and use a darker weight of the same face as the secondary font. If you want to do it in the secondary, maybe this:<br>
      <a href="http://new.typographica.org/2009/typeface-reviews/fp-head-pro/" title="http://new.typographica.org/2009/typeface-reviews/fp-head-pro/">http://new.typographica.org/2009/typeface-reviews/fp-head-pro/</a></p>
      <p>What might be ideal is finding a secondary<br>
      font that's reminiscent of your "Ea" logo.</p>
      <p>hhp</p>
