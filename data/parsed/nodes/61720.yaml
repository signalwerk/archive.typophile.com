      <p>I'm actually an Aquarius, which originally had me leaning towards Museo for a typeface. Structured and contained, but with the nice flow to the serifs. Actually, National kind of reminds me of Museo (without sacrificing as many of those elements as with Museo Sans).</p>
      <p>I really like that mirrored idea. Purposeful and simple, but it's playful and suggests broad perspective. </p>
      <p>I'll come up with some ideas.</p>
