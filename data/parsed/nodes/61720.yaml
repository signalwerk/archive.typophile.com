  html: |-
    <p>I'm redesigning my resume, and I've settled on Galaxie Polaris as the main body text font. I'm feeling, however, that without a paired serif font, the resume comes off as a bit static or conservative, especially so considering I'm involved in interactive design and animation. </p>
    <p>I know there's Galaxie Copernicus, but I think a slab serif would add a more bold and playful contrast to the Polaris. Lookin around, but not sure if anyone has opinions on this. I've attached what I have so far, so any suggestions in general are great!</p>
