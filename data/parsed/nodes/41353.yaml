    <p>The logo of a <a href="http://www.raygil.ch" rel="nofollow" class="link-external">RAYGIL</a> coffee machine was the starting point for this caps-only <a href="/wiki/stencil" class="freelinking link-lost" rel="nofollow">stencil</a> font. The designer of the logo probably used a variant of <a href="/wiki/Frankfurter" class="freelinking link-lost" rel="nofollow">Frankfurter</a> and made a stencil version of the 6 characters he needed. KADA was drawn from scratch without further reference to <a href="/wiki/Frankfurter" class="freelinking link-lost" rel="nofollow">Frankfurter</a> and the result now serves well as a very bold and graphic headline typeface, offering 2 alternate character sets on the upper case and lower case within the same font.</p>
