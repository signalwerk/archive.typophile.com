    <p>Part of: <strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Rounded Typefaces</strong></p>
    <p>Current URL:<br>
    <a href="http://www.lineto.com/The+Fonts/Font+Categories/Graphic+Fonts/Kada/" title="http://www.lineto.com/The+Fonts/Font+Categories/Graphic+Fonts/Kada/">http://www.lineto.com/The+Fonts/Font+Categories/Graphic+Fonts/Kada/</a></p>
    <p>Designed by <a href="/wiki/Joel%20Nordstr%C3%B6m" class="freelinking" rel="nofollow">Joel Nordström</a> 2002</p>
    <p>Published by <a href="/wiki/Lineto" class="freelinking" rel="nofollow">Lineto</a></p>
    <p>The logo of a <a href="http://www.raygil.ch" rel="nofollow">RAYGIL</a> coffee machine was the starting point for this caps-only <a href="/wiki/stencil" class="freelinking" rel="nofollow">stencil</a> font. The designer of the logo probably used a variant of <a href="/wiki/Frankfurter" class="freelinking" rel="nofollow">Frankfurter</a> and made a stencil version of the 6 characters he needed. KADA was drawn from scratch without further reference to <a href="/wiki/Frankfurter" class="freelinking" rel="nofollow">Frankfurter</a> and the result now serves well as a very bold and graphic headline typeface, offering 2 alternate character sets on the upper case and lower case within the same font.</p>
