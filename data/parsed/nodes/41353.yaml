    <p>Part of: <strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Rounded&nbsp;Typefaces</strong></p>
    <p>Current <span class="caps">URL</span>:<br><a href="http://www.lineto.com/The+Fonts/Font+Categories/Graphic+Fonts/Kada/">http://www.lineto.com/The+Fonts/Font+Categories/Graphic+Fonts/Kada/</a></p>
    <p>Designed by <a href="/node/add/wiki?edit%5Btitle%5D=Joel%20Nordstr%C3%B6m" title="Create node &quot;Joel Nordström&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joel Nordström</a> 2002</p>
    <p>Published by <a href="/node/14102" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lineto</a></p>
    <p>The logo of a <a href="http://www.raygil.ch"><span class="caps">RAYGIL</span></a> coffee machine was the starting point for this caps-only <a href="/node/add/wiki?edit%5Btitle%5D=stencil" title="Create node &quot;stencil&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stencil</a> font. The designer of the logo probably used a variant of <a href="/node/41337" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frankfurter</a> and made a stencil version of the 6 characters he needed. <span class="caps">KADA</span> was drawn from scratch without further reference to <a href="/node/41337" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frankfurter</a> and the result now serves well as a very bold and graphic headline typeface, offering 2 alternate character sets on the upper case and lower case within the same&nbsp;font.</p>
