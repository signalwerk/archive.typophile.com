    <p>Hi,<br>
    Would someone mind throwing a few examples and suggestions of good web design that incoporate a lot of text.  I’ve done a lot of minimal design but I’ve never quite gotten the hang of dealing with text for the web.</p>
    <p>Here is the site</p>
    <p><a href="https://web.archive.org/web/20080907004409/http://www.gordonbasichis.com/index.html">http://www.gordonbasichis.com/index.html</a></p>
    <p>I really appreciate it.  I’m not much of designer these days but I really want to do a decent job for him.</p>
    <p>Thanks,<br>
    Casey</p>
