  - id: 62526
    user: 5959
    date: 2005-03-16T12:24:00
    date_raw: 16.Mar.2005 12.24pm
    votes: null
    html: "<p>Obviously, a different letter in a different culture, but Gunnlaugur Briem suggests that for the lower case eth, shortening or omitting the bar can be done as a last resort when designing heavy versions of the glyph. See the last paragraph at: &lt;<a href=\"https://web.archive.org/web/20080905074201/http://briem.ismennt.is/2/2.1a/2.1.4.eth.htm\" target=\"_blank\">http://briem.ismennt.is/2/2.1a/2.1.4.eth.htm</a>&gt;. <br> <br>Whether or not this also applies to the Croatian dyet is an interesting question. I do like John Hudson's mock-up a better solution than the URW sample, though.</p>"
    html_clean: "<p>Obviously, a different letter in a different culture, but Gunnlaugur Briem suggests that for the lower case eth, shortening or omitting the bar can be done as a last resort when designing heavy versions of the glyph. See the last paragraph at: &lt;<a href=\"https://web.archive.org/web/20080905074201/http://briem.ismennt.is/2/2.1a/2.1.4.eth.htm\" target=\"_blank\" class=\"link-external\">http://briem.ismennt.is/2/2.1a/2.1.4.eth.htm</a>&gt;. <br> <br>Whether or not this also applies to the Croatian dyet is an interesting question. I do like John Hudson's mock-up a better solution than the URW sample, though.</p>"
