    html: <p>FWIW, here's how URW dealt with it in its version of Cooper Black (essentially, putting the bar on the ascender only to the right). <br> <br><img src="https://web.archive.org/web/20080905074201im_/http://www.typophile.com/forums/messages/4100/67532.png" alt="dyet glyph in URW Cooper Black"> <br> <br>&lt;<a href="https://web.archive.org/web/20080905074201/http://www.myfonts.com/fonts/urw/cooper/black-d/opentype-ps/260370/charmap.html?vid=260370&amp;cpselect=uni3" target="_blank">http://www.myfonts.com/fonts/urw/cooper/black-d/opentype-ps/260370/charmap.html?vid=260370&amp;cpselect=uni3</a>&gt;</p>
    html_clean: <p>FWIW, here's how URW dealt with it in its version of Cooper Black (essentially, putting the bar on the ascender only to the right). <br> <br><img src="https://web.archive.org/web/20080905074201im_/http://www.typophile.com/forums/messages/4100/67532.png" alt="dyet glyph in URW Cooper Black"> <br> <br>&lt;<a href="https://web.archive.org/web/20080905074201/http://www.myfonts.com/fonts/urw/cooper/black-d/opentype-ps/260370/charmap.html?vid=260370&amp;cpselect=uni3" target="_blank" class="link-external">http://www.myfonts.com/fonts/urw/cooper/black-d/opentype-ps/260370/charmap.html?vid=260370&amp;cpselect=uni3</a>&gt;</p>
  - id: 62524
    user: 1262
    date: 2005-03-16T11:10:00
    date_raw: 16.Mar.2005 11.10am
    votes: null
    html: "<p>I don't think the URW solution is very convincing. In such an extreme case, I would a) remove the top serif and straighten that side of the stem, and b) lower the top of the bowl as much as possible without distorting the form too much, in order to create space for the crossbar. Something like this (hacked in Photoshop, so not very tidy): <br> <br><img src=\"https://web.archive.org/web/20080905074201im_/http://www.typophile.com/forums/messages/4100/67539.gif\" alt=\"Suggestions for Cooper Black /dcroat/\"> <br> <br>It is more important in designing diacritic letters for languages to preserve the particular identity of those letters than it is to preserve the particular details of a serif. This means being aware of the primary distinguishing features of the letter, in this case a bar that crosses through the ascender, and coming up with a way to preserve those features while preserving as much as <i>possible</i> of the characteristic details of the typeface design.</p>"
    html_clean: "<p>I don't think the URW solution is very convincing. In such an extreme case, I would a) remove the top serif and straighten that side of the stem, and b) lower the top of the bowl as much as possible without distorting the form too much, in order to create space for the crossbar. Something like this (hacked in Photoshop, so not very tidy): <br> <br><img src=\"https://web.archive.org/web/20080905074201im_/http://www.typophile.com/forums/messages/4100/67539.gif\" alt=\"Suggestions for Cooper Black /dcroat/\"> <br> <br>It is more important in designing diacritic letters for languages to preserve the particular identity of those letters than it is to preserve the particular details of a serif. This means being aware of the primary distinguishing features of the letter, in this case a bar that crosses through the ascender, and coming up with a way to preserve those features while preserving as much as <i>possible</i> of the characteristic details of the typeface design.</p>"
  - id: 62525
