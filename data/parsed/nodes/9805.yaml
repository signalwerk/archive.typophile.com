    date_raw: 16.Mar.2005 11.23am
    votes: null
    html: <p>interesting... <br>i had read in Typo 10 that "In extra bold characters, the part of the slash inside of the character may be omitted." So i wasn't particularly shocked to see the URW example (I just hadn't seen anything like it before). I personally think John's is a better solution; but not being a native reader of any language that uses  this character, i don't know which is the "preferred" design.</p>
