    html: <p>Type ID's belong in the <a href="http://www.typophile.com/forums/messages/83/83.html?1081251674">Type ID</a> section in future. Also make use of the <a href="http://www.typophile.com/cgibin/search.pl">advanced search</a> feature. It may turn up your answer. The fridge fonts I know are from Font Bureau and are by <a href="http://fontbureau.com/people/person.tpl?cart=1081252195699118&amp;designer=Leslie%20Cabarga">Leslie Cabarga</a>. Also Bullet/Global from House Industries. <br> <br>Randy</p>
