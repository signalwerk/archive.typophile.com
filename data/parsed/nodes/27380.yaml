      <p>We should indeed be curious about other typefaces.  The problem is, are they all film material? Do they have the recognition and broad exposure to make film the medium of choice or is a book or magazine or Journal article the best place to portray type?</p>
      <p>We type lovers would all rush out to see any film about type (since there have been SO many) but the cost and time to make a film means you have to find a broader audience.  You can argue the case for a few other typefaces as well but Helvetica is certainly on the list for either the love or hate kinds of interest which would entice film viewing.</p>
      <p>ChrisL</p>
