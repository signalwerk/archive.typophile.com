      <p>My question is: shouldn't we be a bit more curious about other typefaces?</p>
      <p>I'm quite a bit tired - personally - to see so much stuff (and now a film) made on the most generic typeface of all times. I understand of course it's importance in the context of the modernist movement and that it's a well crafted piece of design. </p>
      <p>Shouldn't we be over this font, especially when we can all agree of it's very limited use in contemporary typography? (no italics, small caps, old style figures, ... and not very good for signage and very poor for reading enjoyment, ...)?</p>
      <p>Do we, subconsciously, long for the “generic/inexpressive“ in design?</p>
    html_clean: |-
