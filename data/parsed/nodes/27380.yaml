      <p>Georg, you keep quoting that 1937 number, which is totaly false! Someone made a typing errror on the internet; Max Medinger was not working on any typeface design that woule become Helvetica, or anything else, in 1937. I've mentioned this before on other forums. Why do you believe it anyway?</p>
      <p>William, Hoffmann was Miedinger's boss, and he commissioned the work. Miedinger drew the key characters of one or two weights for Hoffmann's approval. These typefaces were then produced by Haas. I don't know who in their design offices worked on completing the sketches. After a few years, Stempel and Linotype in Frankfurt took over the typeface, developing it into the super family that we now know as Helvetica.</p>
