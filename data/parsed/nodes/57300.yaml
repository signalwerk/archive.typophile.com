    <p><a href="http://www.flickr.com/photos/fontfont/3404247766/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.flickr.com/photos/fontfont/3404247766/" rel="nofollow"><img src="http://typophile.com/files/ff-milo-showing-500_4058.png"></a></div><p></p>
    <p><a class="freelinking external" href="http://www.fontshop.com/fonts/designer/michael_abbink/" rel="nofollow">Mike Abbink</a> explained that his goal with <a class="freelinking external" href="http://www.fontshop.com/fontcase/super_families/ff_milo_ff_milo_serif/" rel="nofollow">FF Milo</a>® was to create a robust workhorse family ideally suited for the complex requirements of magazine and newspaper typography. In order to achieve this goal the graphic designer living in New York outfitted his typeface with comparatively very short ascenders and descenders, and lent it – specifically in the italics – an individual character without letting it become too unusual.</p>
    <p>A good contemporary text face is characterised by the fact that it is inconspicuous, yet very personal in its details, and before all perfectly readable. This already made Abbink’s FF Milo not just a rising, but a shining star in the <a class="freelinking external" href="http://www.fontfont.com" rel="nofollow">FontFont library</a>.</p>
    <p><a href="http://www.fontshop.com/fontcase/super_families/ff_milo_ff_milo_serif/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontshop.com/fontcase/super_families/ff_milo_ff_milo_serif/" rel="nofollow"><img src="http://typophile.com/files/ff-milo_485_5326.gif"></a></div><p></p>
    <p>With the recent addition of <strong><a class="freelinking external" href="http://www.fontshop.com/fontcase/families/ff_milo_serif/" rel="nofollow">FF Milo Serif</a></strong> the newly created super family is outfitted to tackle the most demanding typographic tasks, and rejoins the major sans/serif families that serve as beacons for users in the typographic landscape. Aided by <a class="freelinking external" href="http://www.fontshop.com/fonts/designer/paul_van_der_laan/" rel="nofollow">Paul van der Laan</a>, who assisted with spacing and kerning, as well as the more technical aspects of font production, Abbink not only created the perfect harmonious counterpart for his popular 18-style type family, but also an independently successful serif face, which works perfectly well on its own as well as in combination with other sans serifs. The design strikes a chord with the current zeitgeist without renouncing its historical roots. An elegant balancing act that requires not only a lot of talent, but also a lot of experience. Mike Abbink has proven this again with the new FF Milo Serif. FSI FontShop International is very happy to be able to offer this new release as a part of their yellow-black type collection.</p>
