      <p>I can vaguely see the logic in i + acutecomb producing iacute, because that's a sort of semantically logical way to think about it in some languages, e.g. Hungarian: the acute accent is the long-vowel mark, so semantically an i with an accent is thought of in the same way as an o or a with an accent. No-one thinks "o-with-an- accent, a-with-an-accent, i-without-a-tittle-but-with-an-accent...".</p>
      <p>(Of course, then ő should just be ö + acutecomb as well. For Hungarian. And it all breaks down when other character systems are introduced... :D)</p>
