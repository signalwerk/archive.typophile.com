      <p>Wow! Here is my count in that small text:</p>
      <pre>    1   A acutecomb
          7   u acutecomb
         17   a acutecomb
         22   i acutecomb
          3   y acutecomb
          9   o acutecomb
          1   e acutecomb
      </pre><p>for a total of 60 occurrences of acutecomb. Since acutecomb is coded on two bytes, that means that each of these accented characters requires three bytes in utf-8 instead of two (the utf-8 characters in latin-1 supplement being coded on two bytes). Is that standard for Islandic?</p>
