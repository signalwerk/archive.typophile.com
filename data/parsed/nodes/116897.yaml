      <p>According to this proposal to the Unicode consortium: <a href="http://std.dkuug.dk/JTC1/SC2/WG2/docs/n4191.pdf" title="http://std.dkuug.dk/JTC1/SC2/WG2/docs/n4191.pdf">http://std.dkuug.dk/JTC1/SC2/WG2/docs/n4191.pdf</a><br>
      there are still 35 accented Lithuanian characters that are waiting to be added to the charts.</p>
      <p>That file suggests a decomposition. For instance the latin capital letter u with macron and tilde would have decomposition U+016A, U+0303. I guess you can rely on that for your choices and you do as Charles suggested.</p>
      <p>If you already have text files, you then recode them using those decompositions.</p>
