      <p>Probably, since Lituanian uses free accents, if one were starting with a fresh sheet, the best way to handle the accents would be to use the <strong>mark</strong> and <strong>mkmk</strong> features of OpenType. You can read the OpenType spec or do a Google search for the specifics of the technique. This strategy implements a feature of OpenType, the only aspect affected by Unicode is that the accents need to be in the font, properly encoded as combining diacritics (most of which are found in the 0300 to 036F range).</p>
      <p>see <a href="http://www.unicode.org/charts/PDF/U0300.pdf" title="http://www.unicode.org/charts/PDF/U0300.pdf">http://www.unicode.org/charts/PDF/U0300.pdf</a></p>
      <p>The positioning of the accents is left to mark and mkmk.</p>
      <p>But mark and mkmk do not take advantage of precomposed characters, that is, a glyph that already exists in a font. What you're describing in the old font seems to be exactly that, one where the accented characters are already "built." With this approach, you use the ccmp feature of OpenType. Once again, the accents need to exist in the font as proper combining diacritics, but they are "positioned," if you want, by having a character already composed. This character will have a *name*, but no Unicode number. However, it's *name* will specify the Unicode-character components.</p>
      <p>For example: an m with a tilde will have, as its name,<br>
      uni006D0303</p>
      <p>The components have meaning: "uni" indicates that a Unicode number is being used for the name, 006D is the Unicode number for the Latin lowercase m, and 0303 is the Unicode number for  the tilde combining diacritic. When encountered in a text stream, any Unicode-savvy program or application knows exactly what is going on, namely, there is an m with a tilde accent over it.</p>
      <p>To point to the characters, you need a ccmp feature -- again, you can look this up in the OpenType spec. The particular ccmp statement that will cause this precomposed character to be used with any application program that supports OpenType would be</p>
      <p>   sub m tildecomb by uni006D0303;</p>
      <p>and with the feature statement</p>
      <p>feature ccmp { # Glyph Composition/Decomposition<br>
       # DEFAULT<br>
         ...;<br>
         ...;<br>
         sub m tildecomb by uni006D0303;<br>
         ...;<br>
         ...;<br>
      } ccmp;</p>
      <p>It all sounds harder than it actually is, primarily, I suppose, because one has to get into OpenType and OT features.</p>
      <p>To use the such characters from a keyboard, however, is dirt simple. In either case (whether a mark or a ccmp strategy has been used), you simply type in the characters in sequence, the "font" does the rest. And Unicode preserves syntactic meaning for any future use of the text file. </p>
      <p>Do bear in mind that the combining diacritic tildecomb at U+0303 is a <strong>different character</strong> from the (now) spacing modifier tilde found in so many old PostScript Type 1 fonts. That one, which has width, maps in Unicode to 02DC -- a different character.</p>
      <p>Hope this helps...</p>
