      <p>Here are the required code points for Lithuanian as listed in </p>
      <p><a href="http://github.com/Extensis/lang/blob/master/languages.xml" title="http://github.com/Extensis/lang/blob/master/languages.xml">http://github.com/Extensis/lang/blob/master/languages.xml</a></p>
      <p>from Thomas Phinney's link <a href="http://blog.webink.com/custom-font-subsetting-for-faster-websites/" title="http://blog.webink.com/custom-font-subsetting-for-faster-websites/">http://blog.webink.com/custom-font-subsetting-for-faster-websites/</a> </p>
      <pre>U+0104  Ą   latin capital letter a with ogonek
      U+0105  ą   latin small letter a with ogonek
      U+010C  Č   latin capital letter c with caron
      U+010D  č   latin small letter c with caron
      U+0116  Ė   latin capital letter e with dot above
      U+0117  ė   latin small letter e with dot above
      U+0118  Ę   latin capital letter e with ogonek
      U+0119  ę   latin small letter e with ogonek
      U+012E  Į   latin capital letter i with ogonek
      U+012F  į   latin small letter i with ogonek
      U+0160  Š   latin capital letter s with caron
      U+0161  š   latin small letter s with caron
      U+016A  Ū   latin capital letter u with macron
      U+016B  ū   latin small letter u with macron
      U+0172  Ų   latin capital letter u with ogonek
      U+0173  ų   latin small letter u with ogonek
      U+017D  Ž   latin capital letter z with caron
      U+017E  ž   latin small letter z with caron
      U+201E  „   double low-9 quotation mark
      </pre><p>From the Lithuanian keyboard I have on my Mac, I guess there are other useful code points (there is for instance a dead key for a grave accent).</p>
      <p>Hmm. I just checked and the dead key simply seems to serve to enter digits that don't figure where we would expect.<br>
      <img src="/files/lithuanian_4582.png" width="100%"></p>
