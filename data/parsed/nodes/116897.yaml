    <p>Greetings! I'm a real newbie here.<br>
    I've got a homegrown font (which I didn't make), but need to modify. It was developed before unicode and UTF-8 allowed the millions of character possibilities for foreign languages. Specifically, Lithuanian. The Lithuanian letters were placed in un-needed places, like certain mathematical symbols, currency symbols, etc.</p>
    <p>It's easy enough to take the letters and put them in their correct unicode places. HOWEVER, there are no unicode-defined characters for the Lithuanian letters with accents. How does one go about making this happen? I know it's possible because there are other fonts that can do it. If someone can help, I can explain why using these other fonts aren't a good option.</p>
    <p>If anyone's confused, here's an example of something we need to do. There is the "normal" ligature OE for French and Latin. It's a great example, because there is no unicode definition for an accented OE. For the AE ligature, there is!! How do you go about adding an accent mark such as     ´ to an oe ligature? Getting the keyboard to display it another thing. But that part I can handle. I just don't know how to make a font produce the needed glyph.</p>
    <p>Any chance of getting some help? Would be MOST MOST appreciated.<br>
    Thanks!</p>
