      <p>Yes but...<br>
      Michel, this isn't Unicode's problem. That there are application programs that will not correctly render characters is the problem of those programs, not Unicode. It would be different if NO program could properly render them. Unicode, in the end, is a standard, just like ASCII was.</p>
      <p>I'll allow there may be some confusion with the i. Maybe the answer is there, &amp; I've missed it. Suppose you have an "i" with a macron below, a macron above, and an acute above that. Should the tittle (dot) show? (And isn't that a function of the language, not the Standard?) But given that, should the name used to deconstruct the glyph use, for its base character, the dotless i or the basic i? Or should it vary, depending on what you want the deconstructed text stream to represent? (I've put in spaces to make reading clearer, No spaces in the name when actually used, of course).</p>
      <p>That is, be named<br>
      uni0069 0331 0304 0301, or<br>
      uni0131 0331 0304 0301 </p>
      <p>Or if the tittle is wanted, should it need to be explicit, i.e.,<br>
      uni 0069 0331 0307 0304 0301 or maybe?<br>
      uni 0131 0331 0307 0304 0301, where uni 0131 (whatever) 0307 is somehow further deconstructed to uni0069?</p>
      <p>Anyway, that's the kind of thing the Standard is responsible for, and for all I know, it is there &amp; I just missed it.</p>
      <p>Nor, for that matter, does Unicode proscribe preconstructed glyphs -- just giving them a code point. </p>
      <p>Finally, even if they were given a codepoint, wouldn't the browser folk then complain about a different problem -- all the glyphs they now have to support, and the attending file size of each font?</p>
