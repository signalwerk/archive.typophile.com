      <p>And back to the topic of the thread... or maybe a secondary topic:</p>
      <p>A Standard should preseve syntactic integrity of a file for all users. It doesn't matter if it is a kid on the African plains using a free, basic computer (or China or anywhere, but they don't use the Latin alphabet), or the most sophisticated New York Advertising Agency with high-dollar hardware and software.</p>
      <p>And practical things get in the way. The dotless i is in Latin extended A, and for ASCII, was surely <strong>not</strong> in the fixed portion 0-127. What was in the 8th bit was always up for grabs.</p>
      <p>So the point is, an "i" with a tittle is better than no i at all. Whether or not the Unicode Consortium should assume the dotless i in all operating systems and type formats, I don't know. AFAIK, the only language that uses it is Turkish, for all the other, it is just assumed that should any accent appear over an i, the tittle is not used. So, getting back to the kid in Africa with the hand-out computer, what's important, in terms of the standard, is that he/she knows it is an "i" being used, not that it is rendered beautifully.</p>
      <p>The beautiful rendering, as had been suggested, is the work of the various application programs and browsers. When there is a fault, it is there. However, before the people who write those programs can do their work, they do need to know what the standard is, and I'm not sure the Unicode Consortium has made that clear. Anyone know that information?</p>
