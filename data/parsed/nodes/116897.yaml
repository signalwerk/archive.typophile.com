      <p>Charles: “how to remove a "mark" anchor in FontLab?”<br>
      Right-click or control-click on it, and select "delete" from the pop-up menu.</p>
      <p>Michel (&amp; Charles): Perhaps Michel is right that Unicode could or should have made the canonical comp/decomp use the dotless forms of the letters i and j. But they didn’t, and there is no changing it now. In which case, it is incumbent upon Unicode-processing systems (fonts and system-level support) to deal with the problem. Basically, for combining marks on i and j that do not have precomposed forms, some part of the machinery needs to strip the dot.</p>
      <p>I would not be surprised if the responsibility was already understood to lie in one court or the other between the fonts and the engines, but I don’t happen to know which.</p>
