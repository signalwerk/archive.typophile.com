      <p>Michel, the real question would be the need to encode for the diphthongs. Unless every occurrence of a letterpair is the diphthong in a language -- as far as I can tell, OpenType doesn't provide for a way to substitute "just some."</p>
      <p><a href="http://en.wikipedia.org/wiki/Lithuanian_language#Diphthongs" title="http://en.wikipedia.org/wiki/Lithuanian_language#Diphthongs">http://en.wikipedia.org/wiki/Lithuanian_language#Diphthongs</a></p>
      <p>As for new accents over Latin letters goes, I believe Unicode is on record as saying "no more." That the font publishers do not populate the combining diacritics is not Unicode's fault; they have provided a mechanism within the Standard where syntactic meaning can be easily and always be preserved. The "accenting" mechanism itself can be done in several ways -- in the font, or à la TeX, etc. Not Unicode's responsibility.</p>
      <p>In fact, I now think Unicode has gone too far. People have come to expect new codepoints just to provide for accented Latin letters. I use to be one of them until I began working with Native American languages. One begins to realize just how many new characters would have to be added, if each accented or multiple accented vowel was given it's own codepoint.</p>
      <p>For example, I've been working on Kiowa lately. There would need to be over 100 new codepoints if all the accented vowels for just Kiowa (McKenzie orthography) were added as single characters...</p>
      <p> If you think on it, fully half of Latin Extended Additional isn't needed. Pretty much all of Latin Extended A, except for "legacy" reasons.</p>
