      <p>Charles</p>
      <p>Is there anyone on this planet of ours that types an i followed by an acutecomb to get the character iacute? So far as I know, there is always a keyboard layout available such that, after keying the right combination, the character iacute is input and displayed; the input is a single character, not two, even if there were two strokes on the keyboard to get it. The decomposition has nothing to do with it. Kids need only learn to use the keyboard. Why should the decomposition in the file UnicodeData.txt be of any concern for kids in Africa? That decomposition is used, so far as I know, only by software people and font designers, and I think it is giving them troubles; to prove me wrong, please don't use an argument of authority.</p>
      <p>By the way in TeX (and consequently LaTeX etc) \i is dotless i and to get an idieresis  (i tréma, ï) we (used to) type <code>\"\i</code> which asks for a dieresis on a dotless i. Similarly for i circumflex. That was one of the first things we had to learn so as to be able to type text in French with TeX (and I know at least one colleague that still codes her input latex files that way, without using the package inputenc that allows for latin1 or utf-8 input).</p>
