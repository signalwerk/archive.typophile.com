      <p>I just checked on Maverick (my grab above had been made on OS X 10.6) and the dot disappears on the j and the iogonek in most fonts (but not with Georgia, that appears to be an exception).</p>
      <p>The decompositions that work fine with Brill,  Charis SIL, Gentium Plus (I checked with TextEdit and XeLaTeX on Maverick, and InDesign on OX 10.6) are</p>
      <pre>0131 0328 0307 0301   ı̨̇́ idotogonekacute
      0131 0328 0307 0303   ı̨̇̃ idotogonektilde
      0237 0307 0303        ȷ̇̃ jdottilde

      Where the components are:
      0131    latin small letter dotless i
      0237    latin small letter dotless j
      0301    combining acute accent
      0303    combining tilde
      0307    combining dot above
      0328    combining ogonek
      </pre><p>The other decompositions (for idotacute, idotgrave, idottilde) still work fine.</p>
      <p>I also checked that those are NFD and NFKD decompositions. That implies, I think, that they should pose no problem when transmitted on the internet. If I copy the "composite characters" above from the typophile page and paste them in MorxTester, I get back the string of characters. Making a keyboard for the Macintosh that outputs those strings of characters when you hit a key can easily be done with Ukelele. </p>
      <p>I am far from being convinced (that is a euphemism)  that giving "0069 0301" i.e. "i acutecomb" as decomposition for iacute (etc) in <a href="ftp://ftp.unicode.org/Public/UNIDATA/UnicodeData.txt" rel="nofollow">UnicodeData.txt</a> was a good idea; in terms of components (and that is what is relevant with decompositions), iacute  should have been  given the decomposition "0131 0301" i.e. dotless i acutecomb" etc.</p>
