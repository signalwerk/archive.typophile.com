      <p>And concerning the character oe with an acute, that does not exist in unicode, that glyph cannot be found in the font Gentium either. That does not prevent Gentium to render decently the glyph oe followed by the character acutecomb (the combining diacritic). Here is how it works; the grabs are  of Gentium Basic Bold seen through the eyes of FontForge; the text behind with the 35 "missing" characters is simply from TextEdit with the regular font:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/oeacute_4846.png"></div><br>
      On top of the character oe there is a mark, here denoted <code>Anchor-0</code>. For the glyph acutecomb, there is also a corresponding anchor. When the acutecomb follows the oe, the acutecomb is positioned on the oe so that the anchors be on top of each other.<p></p>
      <p>Those anchors can be moved, copied and pasted in FontForge so as to take care of diacritics for which you do not intend to make precomposed characters.</p>
