      <p>A few things:<br>
      • If you can avoid it, don’t use FontExplorer for testing fonts unless it really is the final version. Just drop the fonts into the Adobe fonts directory. That way if something goes wrong you don’t have to consider FEX as a variable.<br>
      • Clear the application and system caches and reboot<br>
      • Make sure that your regular weight is named correctly. If the regular weight of a font has misconfigured name information, the Adobe apps can freak out and not load fonts from the family properly until a correctly named regular weight has been installed.</p>
