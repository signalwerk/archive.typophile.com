      <p>I use FontXplorer too and have no problems exchanging old fonts for newer ones. My flow isn't that different btw.</p>
      <p>&gt; Generate the first font<br>
      &gt; Drag in (new) set<br>
      &gt; Activate font(!)</p>
      <p>++++</p>
      <p>&gt; Generate new font<br>
      &gt; Cmd+Shift Delete &gt; click "Move to Trash"<br>
      &gt; Drag new file* in set<br>
      &gt; activate font</p>
      <p>* I number my files in progress so a new font file has a different name.</p>
