    html: <p>The notorious font caching under Mac OS X makes the testing of fonts quite tricky. I don't like testing on production machines and we had some problems on Macs after using for instance FontFinagler for cleaning the caches (which could have been caused by other factors). So, I was very pleased when both VMware Fusion and Parallels Desktop started to support the server version of Leopard. From that moment on we could test our fonts (and software) at least for Mac OS 10.5.x on clean images (sometimes in combination with cache cleaners), like we did for many years with the different Windows editions already. It seems that Snow Leopard will be supported by VMWare and Parallels too, which is nice.</p>
