  html: |-
    <p>I suspect the Thomson Reuter's font is custom, but would be excited to be able to license it for myself if it is available.<br>
    As for the font they have in their OneSource logo. This seems so very close to various fonts I already have but can't quite<br>
    nail it down as it seems the O has a bit more complexity and shape to it over a standard circle or ellipse, the S is very open<br>
    and the R is very geometric and wide compared to most fonts I looked that fit with the rest of the letter shapes.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ONESOURCE_Reuters_combo_4168.jpg"></div><p></p>
