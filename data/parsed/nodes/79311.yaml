    <p><a href="http://shadycharacters.co.uk" rel="nofollow">Shady Characters</a> is go!</p>
    <p>I've just launched a website called Shady Characters looking at the stories behind some unusual marks of punctuation such as the pilcrow and the interrobang.</p>
    <p>The first long post (about the early history of the pilcrow) has just gone up at <a href="http://www.shadycharacters.co.uk" title="http://www.shadycharacters.co.uk">http://www.shadycharacters.co.uk</a>. You can follow the site on Facebook (<a href="http://www.facebook.com/pages/Shady-Characters/135325489866494" title="http://www.facebook.com/pages/Shady-Characters/135325489866494">http://www.facebook.com/pages/Shady-Characters/135325489866494</a>) or Twitter (<a href="http://twitter.com/shadychars" title="http://twitter.com/shadychars">http://twitter.com/shadychars</a>). The plan is to update it every week or two with new material, time permitting.</p>
    <p>Please take a look, and don't hesitate to get in touch with comments, criticism or anything else!</p>
