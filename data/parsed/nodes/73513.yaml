    html: |-
      <p>I also get the gay theme to the poster with the rainbow, if it is so then keep it.</p>
      <p>I would agree that if you are keeping the rainbows then either full width (might come off worse) or think about having them smaller and centered under the first two words.</p>
      <p>One last thing that could just be me, the counterless type on the bottom gives me the impression of something else that might clash if you are working a gay theme, also more space around your work and at the begining and end of your counterless words if you are to keep them.</p>
      <p>Great vintage feel to it as already stated.</p>
      <p>Mat.</p>
