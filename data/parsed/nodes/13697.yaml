    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;:&nbsp;Linotype</strong></p>
    <p>Founded in 1997, Linotype GmbH is a wholly-owned subsidiary of <a href="/node/12126" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Monotype Imaging Inc.</a>. Linotype is the current member of a long line of Linotype corporations. Previous Linotype corporations had purchased or merged with many of their competitors, including <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a>, <a href="/node/add/wiki?edit%5Btitle%5D=Deberny%20and%20Peignot" title="Create node &quot;Deberny and Peignot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Deberny and Peignot</a>, <a href="/node/14100" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Haas</a>, and the <a href="/node/add/wiki?edit%5Btitle%5D=Dr.-Ing%20Rudolf%20Hell%20GmbH" title="Create node &quot;Dr.-Ing Rudolf Hell GmbH&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Dr.-Ing Rudolf Hell GmbH</a>.</p>
    <p>The first Linotype entity (<a href="/node/13676" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mergenthaler Linotype</a>) was founded in New York in 1890 by a German immigrant to the United States, <a href="/node/12246" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ottmar Mergenthaler</a>, who had invented the first commercially viable typsetting machine in 1886, the <a href="/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a>.</p>
    <p>Located today in Bad Homburg, Germany, Linotype’s website is <a href="http://www.linotype.com">Linotype.com</a>. The digital foundry distributes over 6,000 fonts, including most of the typefaces designed by <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a> and <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>. Other popular typefaces include <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a>, <a href="/node/15603" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Syntax</a>, <a href="/node/15602" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sabon</a>, <a href="/node/15661" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Compatil</a>, and <a href="/node/13670" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Vialog</a>.</p>
    <p>Linotype’s Managing Director  is <a href="/node/add/wiki?edit%5Btitle%5D=Frank%20Wildenberg" title="Create node &quot;Frank Wildenberg&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frank Wildenberg</a>; the Type Director is <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a>.</p>
    <p>From 1997–2006, Linotype GmbH (1997–2005 under the name “Linotype Library GmbH”) was a wholly-owned subsidiary of <a href="/node/12233" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Heidelberger Druckmaschinen <span class="caps">AG</span></a>.</p>
