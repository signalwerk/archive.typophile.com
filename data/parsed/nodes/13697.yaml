    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Linotype</strong></p>
    <p>Founded in 1997, Linotype GmbH is a wholly-owned subsidiary of <a href="/wiki/Monotype%20Imaging%20Inc." class="freelinking" rel="nofollow">Monotype Imaging Inc.</a>. Linotype is the current member of a long line of Linotype corporations. Previous Linotype corporations had purchased or merged with many of their competitors, including <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>, <a href="/wiki/Deberny%20and%20Peignot" class="freelinking" rel="nofollow">Deberny and Peignot</a>, <a href="/wiki/Haas" class="freelinking" rel="nofollow">Haas</a>, and the <a href="/wiki/Dr.-Ing%20Rudolf%20Hell%20GmbH" class="freelinking" rel="nofollow">Dr.-Ing Rudolf Hell GmbH</a>.</p>
    <p>The first Linotype entity (<a href="/wiki/Mergenthaler%20Linotype" class="freelinking" rel="nofollow">Mergenthaler Linotype</a>) was founded in New York in 1890 by a German immigrant to the United States, <a href="/wiki/Ottmar%20Mergenthaler" class="freelinking" rel="nofollow">Ottmar Mergenthaler</a>, who had invented the first commercially viable typsetting machine in 1886, the <a href="/wiki/Linotype%20Machine" class="freelinking" rel="nofollow">Linotype Machine</a>.</p>
    <p>Located today in Bad Homburg, Germany, Linotype's website is <a href="http://www.linotype.com" rel="nofollow">Linotype.com</a>. The digital foundry distributes over 6,000 fonts, including most of the typefaces designed by <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> and <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>. Other popular typefaces include <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>, <a href="/wiki/Syntax" class="freelinking" rel="nofollow">Syntax</a>, <a href="/wiki/Sabon" class="freelinking" rel="nofollow">Sabon</a>, <a href="/wiki/Compatil" class="freelinking" rel="nofollow">Compatil</a>, and <a href="/wiki/Vialog" class="freelinking" rel="nofollow">Vialog</a>.</p>
    <p>Linotype's Managing Director  is <a href="/wiki/Frank%20Wildenberg" class="freelinking" rel="nofollow">Frank Wildenberg</a>; the Type Director is <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a>.</p>
    <p>From 1997–2006, Linotype GmbH (1997–2005 under the name "Linotype Library GmbH") was a wholly-owned subsidiary of <a href="/wiki/Heidelberger%20Druckmaschinen%20AG" class="freelinking" rel="nofollow">Heidelberger Druckmaschinen AG</a>.</p>
