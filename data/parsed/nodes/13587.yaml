    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Fred Smeijers</strong></p>
    <p>Fred Smeijers is a type designer born in the <a href="/wiki/Netherlands" class="freelinking" rel="nofollow">Netherlands</a>. He has designed typefaces for <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>, <a href="/wiki/TEFF" class="freelinking" rel="nofollow">TEFF</a>, <a href="/wiki/DTL" class="freelinking" rel="nofollow">DTL</a> and for his own foundry, <a href="/wiki/OurType" class="freelinking" rel="nofollow">OurType</a>. Apart from his retail-design work, Smeijers designs custom typefaces for clients like Philips and Canon-Europe. Fred Smeijers also published various written works, among them <a href="/wiki/Counterpunch" class="freelinking" rel="nofollow">Counterpunch</a> and <a href="/wiki/Type%20Now" class="freelinking" rel="nofollow">Type Now</a>, both at <a href="/wiki/HypenPress" class="freelinking" rel="nofollow">HypenPress</a>, London.</p>
    <p>Among his typefaces are:<br>
    FF Quadraat<br>
    TEFF Renard<br>
    DTL Nobel<br>
    OT Arnhem<br>
    OT Fresco<br>
    OT Sansa<br>
    OT Custodia<br>
    OT Ludwig</p>
    <p>Fred Smeijers is currently Professor for type design and digital media at the <a href="/wiki/Hochschule%20fuer%20Grafik%20und%20Buchkunst%20" class="freelinking" rel="nofollow"> Hochschule für Grafik und Buchkunst</a> in Leipzig, Germany and visiting professor at Type and Media <a href="/wiki/KABK" class="freelinking" rel="nofollow">KABK</a>, in The Hague, the <a href="/wiki/Netherlands" class="freelinking" rel="nofollow">Netherlands</a>.</p>
    <p>Next to his type design practice and teaching, Smeijers has a particular interest type history and is currently involved in several research projects.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/fonts/designer/fred_smeijers/" rel="nofollow">Fred Smeijers</a> at FontShop<br>
    <a href="http://www.teff.nl/designers/fred_smeijers.html/" rel="nofollow">Fred Smeijers</a> at TEFF<br>
    <a href="http://www.ourtype.com/" rel="nofollow">OurType</a></p>
