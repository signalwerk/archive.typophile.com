    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Fred&nbsp;Smeijers</strong></p>
    <p>Fred Smeijers is a type designer born in the <a href="/node/19575" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Netherlands</a>. He has designed typefaces for <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a>, <a href="/node/add/wiki?edit%5Btitle%5D=TEFF" title="Create node &quot;TEFF&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">TEFF</span></a>, <a href="/node/30363" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">DTL</span></a> and for his own foundry, <a href="/node/13640" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OurType</a>. Apart from his retail-design work, Smeijers designs custom typefaces for clients like Philips and Canon-Europe. Fred Smeijers also published various written works, among them <a href="/node/add/wiki?edit%5Btitle%5D=Counterpunch" title="Create node &quot;Counterpunch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Counterpunch</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Type%20Now" title="Create node &quot;Type Now&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type Now</a>, both at <a href="/node/add/wiki?edit%5Btitle%5D=HypenPress" title="Create node &quot;HypenPress&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">HypenPress</a>,&nbsp;London.</p>
    <p>Among his typefaces are:<br>
    <span class="caps">FF</span> Quadraat<br>
    <span class="caps">TEFF</span> Renard<br>
    <span class="caps">DTL</span> Nobel<br>
    <span class="caps">OT</span> Arnhem<br>
    <span class="caps">OT</span> Fresco<br>
    <span class="caps">OT</span> Sansa<br>
    <span class="caps">OT</span> Custodia<br>
    <span class="caps">OT</span>&nbsp;Ludwig</p>
    <p>Fred Smeijers is currently Professor for type design and digital media at the <a href="/node/13589" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"> Hochschule für Grafik und Buchkunst</a> in Leipzig, Germany and visiting professor at Type and Media <a href="/node/37600" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">KABK</span></a>, in The Hague, the <a href="/node/19575" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Netherlands</a>.</p>
    <p>Next to his type design practice and teaching, Smeijers has a particular interest type history and is currently involved in several research&nbsp;projects.</p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/fonts/designer/fred_smeijers/">Fred Smeijers</a> at FontShop<br><a href="http://www.teff.nl/designers/fred_smeijers.html/">Fred Smeijers</a> at <span class="caps">TEFF</span><br><a href="http://www.ourtype.com/">OurType</a></p>
