  - id: 442638
    user: 7642
    date: 2010-12-07T00:56:00
    date_raw: 7 Dec 2010 — 12:56am
    votes: null
    html: <p>It reminds me a bit of <a class="freelinking external" href="http://typophile.com/node/28862" rel="nofollow">Agamemnon</a>, by Typophile <em>cuttlefish</em>, but still fairly different. You might also look at the very distantly similar Schneidler. But I don't think you're going to find a font that matches it. It honestly looks like the work of a fairly amateur letterer, whereas someone who'd make an entire font, one that you could find, would probably be a bit more advanced. If you need to match the style, you'll probably have to hand-draw it, or find someone who can. But someone besides me may have an idea of a font that's close.</p>
