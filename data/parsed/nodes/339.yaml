    html: <p> to my great displeasure, I'm working in-house -- in order to finish my degree, i need the flexible schedule and relatively short hours they provide. the relevance of this is that here this guy is considered a creative god. no matter how many times we have to repackage, deal with consumer complaints, etc. he's always the greatest! funny thing is, everything he has done for the past two years to _save_ the company image has been a *direct* rip-off from some other similar company who has had some level of success. the worst thing is, since he is such a hap-hazard designer, he always ends up with a very sloppy translation of something that was less than inspiring in the first place (he never chooses to rip-off spectacular work). <br> <br>oh well! this place is certainly alot better than strict production work. certainly, when the degree is done, I can start checking out some more inspiring workplaces. for now, I just don't have the time or energy. </p>
