  html: <p> I just had to tell someone who would understand my pain. my art director handles (clutches onto) nearly all of our packaging projects. the problem with this is that he is really quite terrible with type. every time he creates a new package, I squirm and argue a bit--to no avail. I'm able to do something to salvage much of the other material we produce, but with packaging, he wants it all to himself. <br> <br>the straw that has snapped my spine in two is his using Adobe Garamond *Titling* at 6pt on a re-packaging that was just completed. when I brought up the intended use of such a design early on, he simply informed me that he liked the fine detail of this font and thought it was absolutely appropriate for the job at hand. of course, the silk-screened version of this face on the clear plastic bottles that just came in looks like crap at 6pt (and the other various small sizes he used it at). sometimes it's really hard to work with this guy! </p>
