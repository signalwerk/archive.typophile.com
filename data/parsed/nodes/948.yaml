    html: <p>Some little-know facts about the Castaways. <br> <br>* The Professor was a mean Linotype operator... <br>before being shipwrecked. <br> <br>* Mary Ann was one of the original Alphabettys. <br> <br>* Ginger was Pierre Bezier's model for his first bezier curves. <br> <br>* Gilligan was an intern at Photo Lettering. <br> <br>* The Skipper worked at ITC and released more than 100 <br>typefaces with obese x-heights, before that was fashionable. <br> <br>* The Howells, they were rich, and had no connection <br>to the type industry. <br> <br> <br>file this in the "sorry, I couldn't resist, I'll regret it later" category. <br> <br> <br>bj <br> <br></p>
