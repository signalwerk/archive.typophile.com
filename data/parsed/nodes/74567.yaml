  html: |-
    <p>I'm pretty sure this will have been mooted before but is it just me or is anyone else fed up with nearly every thread in the <em>Newest</em> section on the home page asking for type ID's (currently 7/10 entries are asking for ID's)? Is it time to take font ID's off the home page or is that too controversial?</p>
    <p>I need convincing that ID's <em>deserve</em> to be on the home page. Is this website the de facto online resource for having a font identified? If so is it time to hive off the font ID part and stick it somewhere else or will that make everyone very sad?</p>
