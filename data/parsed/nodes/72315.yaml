  html: |-
    <p>Hello guys,</p>
    <p>I'm again looking for a calligrapher to help us out on writing a small word for a wine bottle (important: it's variety name, not the brand).<br>
    We are looking for some things similar to the images attached.</p>
    <p>If you're interested, please send me your website, or samples of your work to:<br>
    nuno AT lateralbranding DOT com &amp; hellonuno AT gmail DOT com (we are having problems with the studios server)</p>
    <p>If you for some reason don't have any sample of your work similar to the sample I'm asking for, you can also e-mail me the word "Jiarez". Don't worry this is not the word we need, it's just similar in form.</p>
    <p>Don't forget to say proximately how much you would charge for this work, if you are selected, we will give you every detail about the project.</p>
    <p>Thanks in advance :)</p>
