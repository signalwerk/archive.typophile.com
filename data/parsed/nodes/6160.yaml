    votes: null
    html: "<p>  - PageMaker (being replaced by InDesign, useful for database <br>publishing) <br>  - InDesign (new kid on the block, nice for design-intensive stuff, <br>lacking in long-document features) <br>  - FrameMaker (on life support, development moved to India, <br>discontinuation of Mac version may be death knell, limited <br>typographically --- ask me if you want to see my rant on its <br>limitations) <br>  - Corel Ventura (nifty program, Windows only, Corel support often <br>haphazard) <br>  - Quark XPress (development moved to India --- questions about font <br>support have been made to the OpenType list by at least one person with <br>a quark.in e-mail address) <br>  - RagTime (versatile program, freely available for non-commercial use) <br>  - Calamus (still hanging on) <br>  - SoftMagic's Project M (nifty program for magazines / newspapers with <br>an emphasis on workflow and XML) <br>  - Ready-Set-Go (this has been taken over by the foreign distributor <br>Diwan International --- still pretty cool, and with excellent Arabic <br>support, and the best guide / grid system for a graphical program) <br>  - Creator (mostly shifted over towards advertising layout) <br>  - Serif PagePlus (competing for the low-end against Microsoft <br>Publisher) <br>  - Scribus (new, opensource program, looks promising) <br>  - Impress (page layout using TCL - interesting, but sparse <br>feature-wise) <br>  - PageStream (mostly found on the Amiga) <br>  - VivaPress (interesting --- just came across this, they promise to <br>pay for imaging errors and are aggressively marketing a competitive <br>upgrade) <br>  - Typographicus (German program, being marketed as shareware) <br> <br>Drawing programs usable for page layout <br> <br>  - Macromedia FreeHand / Altsys Virtuoso (works quite well ;) <br>  - Adobe Illustrator (wants a multi-page plug-in) <br>  - Stone Design's Create (interesting 'cause it'll also do a web <br>page/site) <br>  - Canvas (will also do web publishing) <br> <br>all of which are still available. Things vanished forever include: <br> <br>  - PasteUp.app <br>  - Uniqorn (or whatever the QuickDraw/GX program was called) <br>  - Pages by Pages (nifty NeXTstep app which never got the visual <br>template design tool it needed) <br> <br>Long document batch composition systems: <br> <br>  - Interleaf (now pitched to library services) <br>  - Miles 33 (moving towards SGML publishing) <br>  - Penta (esp. good for math) <br>  - 3B2 (essentially a TeX implementation oriented towards SGML <br>publishing in an interactive fashion) <br>  - XyVision (esp. notable for the related XyWrite word processor / text <br>editor --- the latter was used by Robert Bringhurst to make the nifty <br>``letterfall'' frontispiece in the first edition of _Elements of <br>Typographical Style_) <br> <br>Weird things sort of related: <br> <br>  - Cerilica's Truism (mostly pre-press oriented) <br>  - Enfocus Tailor (graphical, interactive editing of PostScript files - <br>they now do PitStop) <br> <br>Other things which people use which I'd rather not think about: <br> <br>  - Microsoft Word <br>  - Microsoft Publisher <br> <br> <br>Courtesy of William F. Adams, <br>publishing specialist, <a href=\"http://www.atlis.com\" target=\"_blank\">www.atlis.com</a> <br></p>"
