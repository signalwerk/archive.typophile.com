g) <br> <br>all of which are still available. Things vanished forever include: <br> <br>  - PasteUp.app <br>  - Uniqorn (or whatever the QuickDraw/GX program was called) <br>  - Pages by Pages (nifty NeXTstep app which never got the visual <br>template design tool it needed) <br> <br>Long document batch composition systems: <br> <br>  - Interleaf (now pitched to library services) <br>  - Miles 33 (moving towards SGML publishing) <br>  - Penta (esp. good for math) <br>  - 3B2 (essentially a TeX implementation oriented towards SGML <br>publishing in an interactive fashion) <br>  - XyVision (esp. notable for the related XyWrite word processor / text <br>editor --- the latter was used by Robert Bringhurst to make the nifty <br>``letterfall'' frontispiece in the first edition of _Elements of <br>Typographical Style_) <br> <br>Weird things sort of related: <br> <br>  - Cerilica's Truism (mostly pre-press oriented) <br>  - Enfocus Tailor (graphical, interactive editing of PostScript files - <br>they now do PitStop) <br> <br>Other things which people use which I'd rather not think about: <br> <br>  - Microsoft Word <br>  - Microsoft Publisher <br> <br> <br>Courtesy of William F. Adams, <br>publishing specialist, <a href=\"http://www.atlis.com\" target=\"_blank\" class=\"link-external\">www.atlis.com</a> <br></p>"
