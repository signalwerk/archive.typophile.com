    html: <p>The problem I have with putting ornaments in fonts and hacking text encoding to enter them from the keyboard is precisely that you end up with something like AACAACAAGAACAACAA encoded as a text string in an application rather than something that actually relates to the pattern elements. I do not think that ornaments should be mapped to text characters. This is not to say that ornaments can't be accessed via the keyboard, if that's what the user wants to do (although having a visual drag and drop pattern composer should also be an option), but it shouldn't be necessary to enable this by assigning character codes to ornaments and storing them as text. I can imagine an input system in which the user a) builds a suite of pattern elements, b) assigns pattern elements to keys if he wants to use the keyboard, and c) saves both the suite and the keyboard assignments as a project file. <br> <br>By the way, I think I saw your old car on the street a couple of days ago.</p>
