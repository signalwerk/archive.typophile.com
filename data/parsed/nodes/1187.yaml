    date_raw: 7 Sep 2003 — 10:53pm
    date: 2003-09-07T22:53:00
    votes: null
    html: '<p>John, <br> <br>The problems with fleurons, or pattern making programs remains the same whether you use the font format or not. <br> <br>Advantage of font format. <br>1.)	The images are stored under the key caps. <br> <br>Disadvantage of font format. <br>2.)	It is difficult to know where the image is 	stored under the keycaps. (Interface) <br> <br>Naturally you could locate any images under keycaps. The question is, would you want to?  <br> <br>The interface is one of the biggest problems. <br> <br>So no matter what you do the problems remain identical. <br> <br>Your idea however has great merits, the dynamics of your thought enlivens the possibility of the program outside the traditional typographical usage. Expanding usage into other industries. And possibly exporting some traditional typographical materials into other products. <br> <br>My principal usage of fleurons has been on the printed page. I have, however, worked on other projects outside that industry. Rugs, scarves and china for instance. Quite the scarf by the way! The scarf would have really suited you. It was understated but striking. <br> <br>Fleurons are historically part of printing history, they are beautiful, they belong more often on the printed page. I fear for their loss. I worry that they will never become included again.  I have had such great enjoyment with printers fleurons. Bruce Rogers said if he ever got stuck on a remote island he would  wish to have printers fleurons and a proof press. <br> <br>Small Note:  <br> <br>Printers fleurons were "rightly cast as types". The similarities between fleurons and type is greater than the difference. <br> <br>More on that later. <br> <br>Lastly, some have mentioned I have an "advantage" of using a computer in my "fleuron design work". You should know the very opposite is true. Hot metal design was far easier. <br> <br>Gerald Giampa <br> <br></p>'
