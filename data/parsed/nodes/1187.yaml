    html: <p>John, <br> <br>I have been pondering your thoughts. Why keep fleurons stored by way of keymaps? Macros and collections are a bigger issue than storage. The keys could be the source of many macros. Or, temporary collections. What I am saying is that storage could also be in groups, under keys, or suites of fleurons, under keys instead of a single image. They keys would be free of their usual enslavement. Perhaps a small group of keys could be reserved for assembly. Usually only four positions to a single character. So maybe normal keyboard function could be reserved for number 1-4 for instance. This turns them in all usual positions. Even then, that is a macro function! <br> <br>It would relieve the keys to perform many duties instead of storing singular design elements. I am just thinking out loud <br> <br>You are most helpful, thank you. <br> <br>My car. <br> <br><a href="http://www.lanstontype.com/BuickIvy.html" target="_blank">http://www.lanstontype.com/BuickIvy.html</a> <br> <br>Did I tell you how I lost a sale for that car. Francesco, remember my son, he removed his shoes climbed into my car and sat down in the drivers seat. The prospective buyers wife got into the car, sat down beside Francesco testing out her "proposed" new seat. Francesco looked at her and said "you are breaking my fathers heart." <br> <br>Quickly she got out, told her husband they were not buying the car, and under his great protest she dragged her husband home. <br> <br>Gerald Giampa <br>Lanston Type Company <br> </p>
