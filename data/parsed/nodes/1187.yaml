    html: "<p>Actually, it's a glyph map in InDesign, not a character map. Do you really think that makes designing fleuron borders easy: hunting and pecking? Sure, it makes it as easy as finding metal sorts in a type case, but wasn't the whole idea of computers to find new and more efficient ways of doing things, or to make it possible to do things that used to be impossible or at least too difficult to consider? I'm thinking of a parametric system that would allow you to lay out something with the size and complexity of a Persian carpet in minutes, not painstakingly clicking on individual glyphs to make a design.</p>"
