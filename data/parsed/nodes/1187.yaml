  html: <p>Fleurons, the rich cousins of type designs are neglected? Why! <br> <br>Is the poor too snobbish?</p>
comments:
  - id: 9371
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 7 Sep 2003 — 10:09am
    date: 2003-09-07T10:09:00
    votes: null
    html: "<p>Because there is nothing essentially typographic about them? <br> <br>I'm a huge fan of the work you have done with fleurons, as you know, but I really wonder to what degree the fact that the fleurons existed on the end of a bit of metal makes them type. Of course, it was convenient for letterpress printers to have them in that format, and the metal carried the fine detail better than wood, but what about today? Is there any particular convenience in having fleurons in <i>fonts</i>? Consider the kind of work you have done with fleurons: filing down parts of the pattern to create new patterns. With fleurons in digital fonts, you would either need to edit the font to achieve the same results or convert the type to outlines in something like Illustrator. This makes me think that fleurons would have a richer digital life separate from type, in dedicated pattern making plug-ins for design applications. I imagine such a plug in have suites of pattern elements, which could be edited and saved as new suites, and patterns could be expressed via a set of parameters and, unlike typographic patterns, could be build very quickly just by clicking the 'Build Pattern' button after setting the parameters. What's convenient in metal isn't necessarily the most convenient way to do things in digital.</p>"
