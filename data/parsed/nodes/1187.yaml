    html: <p>John, <br> <br>Are you suggesting something like this? <br> <br><a href="http://www.lanstontype.com/GiampaJugendsali.html" target="_blank">http://www.lanstontype.com/GiampaJugendsali.html</a> <br> <br>So you could do something like this! <br> <br><a href="http://www.lanstontype.com/LanstonPriceList.html" target="_blank">http://www.lanstontype.com/LanstonPriceList.html</a> <br> <br>Do you suspect anyone would buy it?  <br> <br>Some of that hot metal work is built into these arrangements. Maybe I should build some illustrations. <br> <br>My solution is still in "font format", (ever heard of Open Type?) not with illustrator, or an art management program. As you suggest, it was intended as a plug in. <br> <br>It seems to work for me. It is not a sellable product however, not yet anyway. I don't have resources to hire anyone to work on it. Finland is beautiful but expensive. <br> <br>The problem I am having is time. I might be running out of it. You probably have heard I have a publishing offer from a New York firm for a book of about my work with printers' fleurons. <br> <br>Gerald Giampa <br>Lanston Type Company <br> <br> <br> <br></p>
  - id: 9373
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 7 Sep 2003 — 7:03pm
    date: 2003-09-07T19:03:00
    votes: null
    html: "<p>I had not heard about the book offer. That sounds great. <br> <br>I'm now intrigued by the thought of a non-font approach to pattern making -- more than fleurons, per se: fleurons would represent one kind of pattern element. Heck, just about anything could be turned into pattern elements: letters, pictures (incl. photographs), abstract shapes, etc. I think fonts are much too limited a format for digital pattern making. Digital fonts are built around text processing: pattern making has nothing to do with text. It's a kind of historical, technical accident that ornaments ended up as type: it was a convenient of storing and reproducing little pictures and designs, but I suspect the only reason that we have digital ornament fonts is that no one has yet taken the time to invent a better and more convenient digital format for storing and manipulating pattern elements.</p>"
  - id: 9374
    user_id: 2094
    user_name: gerald_giampa
    user_path: null
