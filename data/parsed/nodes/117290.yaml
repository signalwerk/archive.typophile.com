      <p>While Clarendon is generally thought of as a display face, and it is also bolder than normal for a text face, it isn't completely unsuitable for such use.</p>
      <p>Century Schoolbook, a very legible text face, is sometimes referred to as being related to a Clarendon. Also, the Diplomat typestyle for the IBM Selectric typewriter (not generally available in North America, but used in the U.K., for example) is Clarendon-based, and an appealing style for general typing.</p>
      <p>Sentinel seems to be entirely suitable for text use, given that it comes in a range of weights.</p>
