      <p>Not only have people used typefaces similar to Clarendon for body text, but even typefaces of the kind to which Stymie, Cairo, and Memphis belong, with unbracketed serifs and uniform stroke weight have been used for body copy, with reasonable success.</p>
      <p>But that still is something not recommended; one can use Futura or Helvetica for body copy, and people can read it, but that doesn't mean those faces are optimal for that purpose. Compared to Futura, however, the Egyptians have both humanistic shapes and serifs of a sort, and the complete lack of stroke contrast is not nearly the problem that the extreme stroke contrast of Bodoni would be.</p>
      <p>What I've seen in Stymie and similar faces are local newsletters and the like, not major publications or long novels. But they didn't seem to have serious issues.</p>
