    <p>Hi friends, I am using Whitney font for headlines and I am thinking of using Sentinel for body text.  Wondering if anybody has any comments about this choice since its a slab serif like Clarendon and so I am not sure if those fonts are meant more to be used for headlines reather than body text. So if you have any insights about this they would be greatly appreciated. Cheers</p>
    <p>And here is a link to the Sentinel font:</p>
    <p><a href="http://www.typography.com/fonts/sentinel/styles/screensmart/" title="http://www.typography.com/fonts/sentinel/styles/screensmart/">http://www.typography.com/fonts/sentinel/styles/screensmart/</a></p>
