  html: |-
    <p>Exquisite Letterpress is happy to present "Almost Free" small card letterpress services.<br>
    Useful for business cards, tags, labels, etc, we work with your press ready PDF.</p>
    <p>We've got a project estimator on our site at:</p>
    <p><a href="http://slowprint.com/almostfreelp" title="http://slowprint.com/almostfreelp">http://slowprint.com/almostfreelp</a></p>
    <p>We're also very happy to work with designers, typographers, and consultants on any project requiring fine papers with a perfect impression.</p>
    <p>Please visit us online, or if you're in the midwest, stop in at the studio in Dubuque's historic Millwork District, along the mighty Mississippi!</p>
