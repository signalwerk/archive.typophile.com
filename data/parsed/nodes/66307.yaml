      <p>Wow, sorry, I thought the "Quarter Caps" were the smaller ones. Misleading indeed.</p>
      <p>I personally think 2 sets of smallcaps is very nice to have, 3 gets harder to manage, and 4 is really overkill for all but the most exotic applications. BTW it's also worth considering that small caps and petite caps have their own OT features, while more additional cap sizes need to be put into stylistic sets.</p>
