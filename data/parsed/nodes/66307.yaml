  html: |-
    <p>From the new Sherlock Holmes movie:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/baker_street_6231.jpg"></div><p></p>
    <p>My first question is, is there a typographic term for this kind of slightly smaller caps (or larger small caps, if you will)?</p>
    <p>I've seen it in some books before, mostly for proper names. Presumably it's used because the font doesn't have a set of small caps, and scaling regular caps down 5% or 10% obviously doesn't look so bad as scaling them down to x-height.</p>
    <p>So my second questions is, are there fonts with a set of those slightly smaller caps -- maybe in addition to a set of regular small caps?</p>
