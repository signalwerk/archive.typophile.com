    html: |-
      <p>Thanks! Apparently, those caps in the Baker Street sign above is called three-quarter caps -- or quarter caps (QC) in short. Between them and small caps (SC), there is mid caps (MC). Also, there is petite caps (PC) which are even smaller than SC. I assume these are all the commonly known sizes of small caps?</p>
      <p>Atma has SC, MC and QC, but does any font have all four?</p>
