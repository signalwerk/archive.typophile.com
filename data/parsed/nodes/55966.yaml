    html: |-
      <p>Business is business.<br>
      When a supplier signs up with a distributor, the rate is established in the contract, and either party can renegotiate the terms.</p>
      <p>So a distributor-driven plan that signs up suppliers at rates favorable to them will help get the distributor established, and build a customer-base for the supplier. Suppliers have to worry about that distributor then cornering the market and reducing their payout, distributors have to worry about suppliers selling direct.</p>
      <p>MyFonts has built up a lot of traffic, but its market is different than FontShop, Veer, and Monotype, the other big multi-foundry retailers, so there are alternative distributors available to foundries. But those retailers don't take anyone who knocks on the door (no need for purging!).</p>
      <p>So there may be a place for a no-frills all-come all-served distributor, along the lines of the original, Makambo. At Makambo, suppliers uploaded font files, price information, and gif specimens -- all automated. Makambo returned 81% of retail price to suppliers. Was that too much to keep it in business? It's hard to say, as it was closed by Flashline (the parent company) during the dotcom bust, so that company could concentrate on its core business.</p>
      <p>Alex, this could be your big opportunity...</p>
