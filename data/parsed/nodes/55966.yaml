      <p>Not to put too fine a point on it, but if you don't need Nick's, my &amp; Jan's endless, tireless work on behalf of MyFonts designers - each of us spends a fair amount of time ever single day writing copy, editing press releases, conducting interviews, designing specimens for all of our designers ... well, then go with a distributor who doesn't do those things for you. MyFonts may begin to decrease commissions, but we are increasing the level of service - and the truly massive amount of PR we give to our designers - every single day.</p>
      <p>And that's not all of it. There are a several other people who work endlessly - weekends, holidays, Jewish holidays and on our kids' birthdays - to make sure that those regular newsletters and other mailings actually get to the tens of thousands of people who want to see them. We all answer emails, field criticism - always addressing whatever we can - and do everything we can to make sure that our designers are getting their due.</p>
      <p>We're doing this because we feel that all independent designers deserve at least a shot at the kind of massive PR that large corporate foundries give their new releases. In fact, I think if you look closely you'll find that we are giving far more targeted press to the folks who sign with us than ITC or Linotype or Agfa are offering their designers.</p>
