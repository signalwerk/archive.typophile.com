    html: <p>MyFonts has a selection of Arabic fonts, and the neat OT display shows the text you type in any number of sizes using a slider, and various colors. Unfortunately the text is displayed from left to right, inverting the natural order of the letters. In this image the test text (the name of the font المستقبل لنا shown correctly in green) is displayed back to front in the orange, which of course disconnects the letters as well as makes the text unreadable. I wonder if this can be corrected? Thanks Adam!</p><div class="imageWrap"><img src="http://typophile.com/files/myfontsarabic_4059.jpg"></div><p></p>
