      <p>Hrant, </p>
      <p>&gt; BTW, do search results depend on popularity?</p>
      <p>The first two sorting modes for search results (relevance and best selling) take popularity into account. Best selling is a straight popularity sort while relevance combines popularity with other factors (for example if a designer name is used as the search term, the fonts designed by that designer score higher than those for which the designer's name is only mentioned in the accompanying article). </p>
      <p>We'll take your suggestions into consideration! </p>
      <p>Cheers,<br>
      Adam</p>
