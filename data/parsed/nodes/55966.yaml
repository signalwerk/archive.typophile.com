      <p>Adam, pardon me while I get anal:</p>
      <p>In the "Origins" section, first paragraph: you need an "and" or an "or" before "sent", here: "different channels: they accepted phone orders, offered postal delivery of floppy disks and CD-ROMs, sent font files to customers by e-mail."</p>
      <p>Same section, third paragraph: in "decided to close down Makambo and redirected all their customers" it would be better to say "redirect" or "started redirecting".</p>
      <p>A couple of places in that section you have "80-20%", which would be better without the "%"; in fact you have "50-50" further up.</p>
      <p>Last paragraph of that section: in "cover the operational and development cost, and left some", "costs" is better.</p>
      <p>Same paragraph: "It was still a deal that was way better than the industry standard, and has remained so to this day." Well, now that you're going to "50-50", that "has" has to go!  :-)</p>
      <p>In the "The things as they are" section, first paragraph: "in" or "with" instead of "into", here: "It was a wise choice for MyFonts not to get involved into extensive print activities"</p>
      <p>Same paragraph, further down: "Today, it is no longer sufficient to have an online “presence”. It is necessary to put up some competition efforts in the online world." 1) A semicolon instead of that period would be nice; 2) "some competition efforts" sounds... Polish? ;-) Try "a competitive effort".</p>
      <p>Immediately following: "Having just a sales platform is no longer sufficient, we need an effective platform for both sales and promotion." Here a semicolon is de rigueur.</p>
      <p>Second paragraph: in "The visual fidelity of the online media has vastly improved", cut the "the".</p>
      <p>Same paragraph: in "the online channels benefits much more", singular for "benefit" of course.</p>
      <p>Third paragraph: in "So at least it is not unreasonable to assume that the online distributor will spend the extra money well." I don't really get that "at least"; you might just ax it.</p>
      <p>Fifth paragraph: "better instructions and explanations to the users — this will automatically benefit all participating foundries." 1) "for user" instead of "to the user"; 2) the second part is phrased a bit like Eastern European military propaganda... Just replacing the "this" with a "which" should do it.</p>
      <p>Sixth paragraph: in "The automatic WhatTheFont identification system backed by the WhatTheFont Forum where", you forgot the "is".</p>
      <p>Eighth paragraph: in "We developed “More fonts like this”, introduced", say "the “More fonts like this” feature" instead.</p>
      <p>Last paragraph: in "immediate font downloads are industry standard now", either hyphenate "industry-standard" or say "an industry standard".</p>
      <p>Immediately following: in "and less and less distributors actively promote", since you can count distributors it should be "increasingly fewer".</p>
      <p>In the "So, what now?" section, first paragraph: in "But the work is not finished, we have great plans.", that comma doesn't work; adding an "and" is probably best.</p>
      <p>Same paragraph: "With our new design and editorial content, we have indicated the direction." is a bit stilted; maybe "shown our future plans" is good enough.</p>
      <p>Last paragraph: in "some foundries that had the intention of signing up but “haven’t gotten around to doing it”, we have decided that they still have the chance to sign up with the old rate", 1) "have had the intention" is better; 2) instead of "they", say "foundries"; 3) "at the old rate" is better.</p>
      <p>There are also some small things but nobody will notice those.  :-)</p>
      <p>hhp</p>
