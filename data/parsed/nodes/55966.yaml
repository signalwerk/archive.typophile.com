      <p>Alex, </p>
      <p>I'm completely with you on the wish that the type designers should receive the best possible financial conditions. Having worked with hundreds of professional type designers over the last ten years — be it in my FontLab or MyFonts positions, or as an independent consultant — I know very well how challenging it is to make a living on type design. </p>
      <p>However, I cannot agree with the use of the word "scam". I think there is a fundamental difference between general software distribution models and fonts. First of all, software applications are relatively short-lived as they are. One committed and successful type designer designs numerous, sometimes dozens, families — overall, dozens or even hundreds of fonts,  over the path of their career. But do you know any individual software developer who has developed dozens or hundreds of software applications? No, this does not work that way. </p>
      <p>Software applications need constant maintenance, one and the same software application needs to be constantly updated with bugfixes or adjusted to new operating systems, new features need to be added. Otherwise, the software product will "die of natural causes" after two or three years. The higher "royalty" that may flow back to the developer is not really pure royalty — a significant part of that is simply money that goes into maintenance and continued development of the same product, in order to keep it afloat. In the software application business, it is the software developer who is mostly concerned with the maintenance of the product — while the distributors "merely sell it". More often than not, it is also the software developer whose task it is to promote the software, while the distributor — at least those distributors who take low commissions — basically provide an e-commerce platform, take transactions and process orders. And in such case, a typical commission is, indeed, between 20% and 30%. </p>
      <p>The money a type designer, or a foundry, receives, is much more of a pure royalty. Once the designer has completed a font family, it is "final". Of course, not entirely, because there may be cases where an update is needed. Some are fairly minor, such as adding the Euro character or converting into a different format. Some are more extensive, such as expanding the character set. But I don't think there really are many cases when the same font family needs to be updated and revisited every year or two, "forever". </p>
      <p>I hope it's clear that I'm not trying to downplay the type designer's role — I'm merely indicating that the product lifecycles for those product types are inherently different. After having worked both in font development and distribution as well as in software development and distribution (for FontLab), I think I can safely say that _after_ a product is released, one needs to spend FAR more time to maintain it in the software business than in the font business. </p>
      <p>Of course, both the software developers and type designers can use their royalties to fund the development of new products — but they can also choose not to make any new products and undertake other things. Fortunately enough, if a font family proves to be interesting to the market, the royalties WILL continue to flow in a year's time, in two years, three and further. Some of the seasoned type designers have been receiving royalties for font families that they have designed ten or fifteen years ago, without ever having revisited that particular family — which I believe is hardly possible in the software application business. </p>
      <p>As I've written above, MyFonts started as a "mere e-commerce provider" for type designers, and for that it rightly accepted a 20% commission. But, while the type designer can "sit back and relax", or — much more likely :) — spend his or her time designing new typefaces, it is much more up to the distributor to constantly "remain in the game" and make sure that potential customers get the fonts they need. Every online font distributor needs to heavily invest in the online platform, fix bugs, adopt the platform to new browsers and operating systems, add new features, come up with innovative ways to present the typeface catalog and allow customers to find the font they want as quickly as possible — and perhaps convince the customer to buy a few more fonts than they originally intended ;) </p>
      <p>Does this sound familiar? Yes, in fact, in the font market, it is the font distributors that need to do lots of the very same heavy-lifting that the original software developers, and not the software distributors, do in the software application market. </p>
      <p>In order to remain fresh and attractive, it is very important for the font distributors to take care of the whole maintenance process. In other words, part of what the software vendors do for software needs to be done by the distributors for fonts. </p>
      <p>And this is the reason why I believe it is sensible that a comparably larger part of the money stays with the font distributor — namely the expenses that go into maintenance and upgrading the software. When it comes to what should count as actual royalty, I don't think there are many differences. </p>
      <p>And as I said earlier, we at MyFonts have serious plans to make our platform even much better than it is now. With the redesign and the new newsletters, I think we've indicated the direction, and I think the participating foundries like it where we are heading. </p>
      <p>Or have you seen an online software distributor that has developed a system that allows the user to "testdrive" the software applications online before purchase? If there are such vendors, I doubt they charge just a 20% commission. </p>
      <p>Oh, wait. :) Actually, I really wish such an online testdrive platform existed in the Apple AppStore. This would certainly have spared me the purchase of a couple of iPhone apps that had promised but did not deliver, so the only option I had was to grind my teeth, delete the app and forget about the money (since AppStore does not accept returns). </p>
      <p>Sure, some developers may be thrilled with the "opportunity to sell your iPhone apps under the Apple brand" (not that there is any other option, because the Apple AppStore is the ONLY option to sell iPhone apps, when you forget about illegal hacking). </p>
      <p>But I'm rather confident that for the end-user (and, ultimately, the vendor), MyFonts or FontShop offer a much better discovery and shopping experience than the AppStore. (Have you ever tried to print out your purchase history at AppStore? I have. I had to take 20 screenshots as this was the only option). </p>
      <p>Cheers,<br>
      Adam</p>
