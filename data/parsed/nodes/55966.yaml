    <p>MyFonts had been giving type designers 65% of the retail price of their fonts since its inception. I just went to their page and saw that they now proudly claim they give a 50% share:<br>
    "MyFonts is a highly efficient and high-volume vehicle for selling fonts. As a result, you will receive an unusually high 50% of the actual price paid by a customer for your fonts!"</p>
    <p>I am really depressed. Say it isn't so!</p>
    <p>ChrisL</p>
