      <p>I'm not sure what you mean by we "do good ID hounds on your roll". If you refer to the WhatTheFont forum, all users there are volunteers, so they're not "on MyFonts' roll". </p>
      <p>But we certainly have the right to remove fonts that infringe on people's intellectual property, and we rigorously make use of this right — if we are notified by the rights owners *or* by any users. I would really like to encourage users to report such things directly to MyFonts.</p>
      <p>It's like with bugs in software applications: many users assume that the ominous "they" will "take care of it". And then bugs get propagated from version to version because, as it happens, nobody reports those (as everyone assumes that someone else will have done so). </p>
      <p>Seriously. We have removed offending fonts in the past, and will in future. I have myself reviewed the outlines of such fonts and compared them in order to determine if portions of the outlines have been reused of if a font is an independent digitization of the same design. Unfortunately, some shady doers simply go undetected for some time. On the other hand, fortunately, such cases occur rarely. </p>
      <p>Quite a few fonts submitted to MyFonts are poor designs — but that is another issue. With MyFonts being a <a target="_blank" href="http://en.wikipedia.org/wiki/Meritocracy" rel="nofollow" class="link-external"><em>meritocracy</em></a>, we believe that it will be our users who will ultimately judge on whether a font becomes commercially successful or not. Many of the poor designs never will. To some surprise of traditionalists such as myself, some fonts that are do not meet our æsthetic standards still find a large number of followers. But that is, again, a completely different discussion: should any appointed panel of judges serve as the authority that denies the right of existence to the Comic Sanses of this world? </p>
      <p>Regards,<br>
      Adam</p>
