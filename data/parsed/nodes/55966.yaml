      <p>Alex, markets sort themselves out.<br>
      Whatever the market pays is justified, fair or not.<br>
      For fonts, the price the end-user pays, the retailer fee, the publisher fee, and the designer royalty are all related, and have evolved through several generations of digital commerce. No doubt shrinkage (i.e. bundling, piracy and free fonts) fits into the equation too.</p>
      <p>If distributors kept 75%, the font market would be quite different.</p>
      <p>The MyFonts business model has certainly been successful for that company, and has been the driving force in creating a retail font market with hundreds of independent foundries worldwide; and done it by paying suppliers considerably more than App Store, with a really wack branding to boot.</p>
