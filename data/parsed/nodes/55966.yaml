      <p>Hi Chris (and others),</p>
      <p>We at MyFonts made the choice recently to switch to a 50/50 percentage agreement for several reasons, but the most notable is the simple fact—which Dan already pointed out—that MyFonts does a heck of a lot more to help sell fonts now than when the old 65% rate was put in place, back in 2003.</p>
      <p>Consider, for example, my personal employment as a full-time designer for the company. Before I was hired by MyFonts, they didn't have ANY full-time designers (and many of you would agree that the fact was painfully evident). I like to think that since I've started, the design level for the company has improved noticeably and, in turn, helps to sell more fonts.</p>
      <p>Another huge factor is the new website. We started work on a completely rebuilt version of the site as soon as I was hired, so the version which is now up in beta mode represents more than 2 years of design and development time. And it isn't just re-skinning work; as Nick Shinn points out, the new site offers new OpenType testing functionality and a slew of other technical advancements (with more still in the works). Again, all the work we've put into (and continue to put into) the new site helps sell more fonts.</p>
      <p>Also worth consideration is the increase in exposure that now is associated with our marketing campaigns. The MyFonts newsletters currently go out to more than half a million registered users (!). That beats the hell out of the number of people subscribed back in 2003, which was about a tenth of that. To add to that, we've also just started a blog which will take time and effort to maintain. Again, all of these things help sell more fonts.</p>
      <p>For the foundries already signed up with MyFonts, we have no intention of changing their contracts. That is our way of thanking them for signing up in the earlier stages of the game. Having said that, we aren't planning on fully instituting the 50/50 contracts until the end of this month (so, cuttlefish, if you want to still get the 65% deal, get on it before April :)</p>
      <p>We do take an equal opportunity stance on which fonts to sell through MyFonts. As long as the fonts are technically and legally sound, we let the customers decide what is worthy of buying or not. Since the fonts are just digital files, carrying that many more of them has little to no affect on our cost of operation. Anyone familiar with the "<a href="http://en.wikipedia.org/wiki/The_Long_Tail" rel="nofollow">long tail</a>" business model understands how this works.</p>
      <p>I am one of the first to agree that we carry some less-than-desirable fonts on our site; however, the way our promotion system works, anything that doesn't prove itself as desirable pretty quickly settles to the bottom of the barrel, and the more successful stuff bubbles to the top.</p>
      <p>Anyhow, to summarize, MyFonts is a totally different product/service now than it was back in 2003, and that change is the result of a lot of work and building over time. Considering all the new benefits that we now offer, we're still more than confident that the 50/50 agreement is a great deal for people looking to promote and sell their fonts.</p>
