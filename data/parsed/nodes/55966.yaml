    html: <p>What do designers get for the extra 15%? For foundries 50% is still more than they get reselling their back catalogs through some of the other big vendors. But to a new font designer I don’t see much reason to go right to MyFonts at 50%—there of foundries that pay 50% and will go out of their way to help with the final design, production, and testing of the fonts. MyFonts marketing is good, but I don’t see it as being worth another 15% now that Twitter, Facebook, and YouTube have made online marketing much easier and less expensive than it used to me.</p>
