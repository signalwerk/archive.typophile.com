    html: |-
      <p>Chris, the most important thing in a distribution agreement isn't the percentage that you get, but the number of transactions that your fonts have.</p>
      <p>If you sell 100 fonts at $30 a piece on a site that gives you 65%, then you get $1950. But if you sell 300 fonts at $30 a piece on another site that gives you 50%, then you get $4500. And zero font sales at $30 a piece on a site that gives you as much as 85% of each sale will only net you $0. You shouldn't assume that any two sites will sell the same number of your fonts.</p>
      <p>In fact, I'd go so far as to say that the MyFonts today is more likely to sell more of your fonts than say, the MyFonts of two years ago (or any arbitrary figure…). Look at MyFonts.com as a full package. They have a new site, with features that Nick already pointed out. Look at their newsletters. They didn't do as much promo a few years ago as they do now. They have regular content being written by (at least) Jan Middendorp, JLT, and Nick Sherman, at least that is how it looks to an outsider like me.</p>
      <p>Ask not what you can do for the site; ask what the site can do for you.</p>
      <p>Of course, I don't have any direct info to back it up, but I'll bet a good beer and donut that it is those newsletters (and other marketing and list activities) that sell fonts on MyFonts more than any other factor. If I were a designer considering whether or not to list my fonts there, those are the sorts of things that I would look at. Not the exact cut that you get.</p>
      <p>After you get a good look at what you'll really get at MyFonts, compare that with other options. Stephen Coles' Typographica article is a good start. Fill in the gaps with offline discussions with designers you know who have chosen different options. Many people aren't going to be able to talk about their contracts (or royalty figures) on a public forum. The internet is great, but it is not for everything :)</p>
      <p>In the end, maybe MyFonts would be the best bet for you. Or maybe your research will point to better chances via another route. You won't be able to come to that conclusion just by comparing royalty rates.</p>
