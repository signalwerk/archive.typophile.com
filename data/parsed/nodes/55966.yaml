      <p>Hrant, I greatly appreciate your thought and consideration!</p>
      <p>In a sense, we do have a team of people checking all incoming fonts for plagiarism (and then some). Other than running new submissions through WhatTheFont, there are at least 3 of us that watch the new font RSS feed. As no one is perfect (and plagiarists can be sneaky), every once in a great while things do slip through the cracks. But so far the method has worked well enough that developing a whole new system for reporting issues would probably take away from time that could be better spent helping our foundries to make money in other ways.</p>
      <p>Like Adam said though, if we get notification of a sketchy font from an outside source—be it from a foundry or from a random user—we'll take the font down until we've had a chance to investigate and proceed accordingly. In that sense, using the "black mark" system for comparison, we take down anything that's received even one black mark.</p>
      <p>With that in mind, I'll repeat Adam by encouraging anyone to report to us anything they see that they think infringes on others' intellectual property. A quick email is all that's needed :)</p>
