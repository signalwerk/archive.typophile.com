      <p>Adam,</p>
      <p>&gt; However, I cannot agree with the use of the word “scam”.</p>
      <p>I'll take "scam" back. It's indeed more of a rip-off if I were to use a catchy description.</p>
      <p>&gt;<em> More often than not, it is also the software developer whose task it is to promote the software, while the distributor — at least those distributors who take low commissions — basically provide an e-commerce platform, take transactions and process orders. And in such case, a typical commission is, indeed, between 20% and 30%.</em></p>
      <p><a class="freelinking external" href="http://regnow.com/software_publisher2.html#06" rel="nofollow">Here</a> is the pricing for a well-establish ecomm provider - 6.9% + $1 - and this is considered "really-pushing-it" expensive.</p>
      <p>20% in the software world buys you not just the payment processing services (shopping cart, invoicing and what not), but also the promotion support, the retail packaging when needed <em>as well as</em> the frontline technical support. Latter is a really big deal because it's an actual expense that grows with the sales volume.</p>
      <p>&gt;<em>The money a type designer, or a foundry, receives, is much more of a pure royalty.</em> </p>
      <p>I don't see how this justifies paying the font designers less.</p>
      <p>And I'm sorry I don't buy the argument about the huge expenses you are routinely encountering while "fixing bugs, adopting the platform to new browsers and operating systems, adding new features, coming up with innovative ways to present the typeface catalog, etc". If this does in fact force you to drop royalties from 80% to 50%, then it means you are not doing a good job in controlling your operational expenses or these expenses are not applied most effeciently.</p>
      <p>&gt;<em>Or have you seen an online software distributor that has developed a system that allows the user to “testdrive” the software applications online before purchase?</em></p>
      <p>You and I both know that an online "testdrive" of a downloadable application is an oxymoron. Please don't compare apples to oranges.</p>
      <p>However, adding an option of "testdriving" a typeface to a website, even the one that works in an interactive manner, is few man-months worth of work for any professional developer. It is also essentially a one-time expense if it's designed properly. </p>
      <p>If you are to tell me that you need more than that, then you are living a luxurious development life <em>at an expense of your fellow font developers</em>. The fact that you <em>can</em> hire a dozen developers to write a Flash applet, another 10 to add an Ajax support, and few managers to manage them all doesn't mean that it should be done. </p>
      <p>All in all, I'm still in awe over the commission rates. That's just unbelievable. It really makes me wonder if an expense-conscious font distribution start-up would be worth a shot.</p>
