      <p>Hrant - As one of the original WTF moderators I can definitely say that you overstate the frequency of plagiaristic fonts appearing on MyFonts.</p>
      <p>Prior to being asked to become a moderator (on the roll? ,,, I wish!), I reported a couple of cases of clear font cloning. MyFonts responded promptly with a thank you and the offenders were kicked out.</p>
      <p>As a group of moderators, we have been known to jump all over an illicit clone that shows up. We don't see them very often, though.</p>
      <p>As to that font that "... was basically Industria with parts randomly chopped off the bottoms.", ever since the appearance of Industria there have been lots of freebie and some commercial similars available. A key word in what you wrote is 'basically'. Unless a font IS Industria with parts lopped off it may be ethically and typographically undesirable but it's not legally wrong or, I suspect, from MyFonts view - actionable.</p>
      <p>Edit: I missed that there was a page 2 to this popular thread, so please excuse the even-tardier-than-I-thought post to you, Hrant.</p>
