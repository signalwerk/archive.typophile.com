      <p>From 2000 to 2003, MyFonts gave 80% to the foundry and collected a 20% commission. It was a deal that it was unheard of in the industry, and it was clear from the day one for both MyFonts and the participating foundries that this was a sort of an "introductory deal". And indeed, in 2003, MyFonts changed the commission to 35%, which meant that 65% of the retail price went to the foundry. This was a realistic split that allowed MyFonts to cover the operational and development cost, and left some moderate means for some promotional activities — and it was still the best deal in the industry. </p>
      <p>Ten years from MyFonts' inception, things have changed.</p>
      <p>With "Web 2.0", the role of the internet has changed. More and more users can be effectively reached through various online promotional channels such as online ads, blogs or social networks. The visual fidelity of the online media has vastly improved, reducing the gap between online and print. Very few will remember that five years ago, the MyFonts newsletters (and most other e-mail newsletters) were plain-text-only, without any images or an actual layout! </p>
      <p>But unlike print promotion, the online channels benefits much more from a solid technological background and the online-specialized know-how that a foundry might not necessarily have, but an online distributor should. For example, MyFonts does not host the website on one server but on a few dozens (!) separate machines connected by sophisticated load-balancing systems, so the website runs fast despite the heavy traffic, and the risk of the service not being available is minimal. </p>
      <p>As MyFonts is well-rooted in font technology, things like online previewing of OpenType Layout features are not only possible but are also fast and reliable. </p>
      <p>Larger websites are more discoverable through search engines — just think of how much more likely is it to find the entry for a book at Amazon than it is on its publisher's website.</p>
      <p>Thanks to sophisticated statistics, an online distributor such as MyFonts can detect trends, effectively position ads in search engines (larger clients can negotiate better rates when buying ads), and use various online communication channels to do good promotion in a more cost-effective way than an individual, small foundry. So at least it is not unreasonable to assume that the online distributor will spend the extra money well. </p>
      <p>James writes: <em>I think MyFonts “take all comers” approach may have finally caught up with them, and they are lowering their royalty payments due to the expense of carrying all of that “dead wood”.</em> I think that James will be glad and relieved to hear that there is little, if any, expense of “carrying the dead wood.” With the highly automated infrastructure that MyFonts had, the marginal cost of adding new fonts is low, and the transaction cost is also independent of the overall number of products on sale. As Nick points out, MyFonts operates by the “long tail” principle (also known as the “80-20 rule”): roughly 80% of the expense is generated by 20% of the products, and 20% of the expense is generated by the 80% of the products. Indeed, this means that cutting off all those unpopular products wouldn't really have much influence on the costs. </p>
      <p>Also, it is important to point out that the new standard contract rate to 50% applies to new foundries. <strong>Existing contracts will keep the existing terms</strong> and will not be automatically changed to the new scheme. </p>
      <p>Because there seem to be some foundries that had the intention of signing up but "haven't gotten around to doing it", we have decided that they still have the chance to sign up <strong>with the old rate of 65%</strong> if they contact <em>foundry@myfonts.com</em> by the end of this month (i.e. by March 31, 2009). So in a sense, the “early early birds” who have signed up with MyFonts 8–9 years ago were rewarded by the extraordinarily attractive rate of 80%, and a number of foundries that have joined so far, the “before lunch birds”, have profited from the attractive 65% rate. And this offer is now prolonged until lunch is over :) </p>
      <p>But — why the change the rate at all? James rightly points out that it is desirable if distributors “keep their royalty at the current level”. But one way of looking at this is to ask: just how much MyFonts has achieved with the unusually low commission rate? Rather than being just a simple click-and-buy anonymous site, the MyFonts website has been in constant development for the last years. </p>
      <p>We have collected excellent editorial content in form of articles, blog entries, interviews and newsletters — originally written by Laurence Penney, and more recently, by Jan Middendorp, Joshua Lurie-Terrell and Nick Sherman. We plan on continuing and expanding these activities. Better content, better educational materials, better instructions and explanations to the users — this will automatically benefit all participating foundries. </p>
      <p>We have developed WhatTheFont, a massively popular online font recognition tool — which recently has been extended by the addition of an iPhone version, which has remained one of AppStore’s top 10 free applications in the “Reference” category. If you sign up with MyFonts and submit your fonts, they will automatically be searchable using WhatTheFont. </p>
      <p>We have spent months and months tweaking the purchase process and the buying experience, in order to simplify the encoding and format selection and adjust to various licensing schemes required by the foundries. One example: after purchase, the customer can download the fonts as a ZIP archive or as a simple wizard-based installer for Mac OS X or Windows — which greatly simplifies the font installation process and reduces tech support calls. </p>
      <p>We have invented various ways for customers to discover new fonts and quickly find the fonts they are looking for. We developed “More fonts like this”, introduced tags/keywords, flags and other concepts — and we were more than happy to find out that other font distributors have adopted these solutions. These concepts are industry standards now. We have a slew of great new ideas that, I'm certain, will benefit font vendors and customers. </p>
      <p>We have invested two years of our time to design a new website from the ground up, bringing together great design talent (Nick), excellent web programming skills (Chris Lewis and Kevin Woodward), online marketing expertise, solid linguistic, typographic and font technology know-how, high-quality content as well as, simply, innovation. We have been rewarded with very positive feedback from both foundries and customers — and we are constantly working on “ironing out” some weak spots. </p>
      <p>But the work is not finished, we have great plans. The extra money that will come from the increased commission on new foundries will certainly help further improving the MyFonts online platform. With our new design and editorial content, we have merely indicated the direction. Design and content is not everything, so our future activities will concentrate on online promotion and marketing. We will do some of the work ourselves. But more importantly, very much in-sync with our approach so far, we will develop new innovative easy-to-use online tools that will help foundries direct the marketing activities themselves. </p>
      <p>Until this date, we have done all that work at a commission rate that <em>for years was way more attractive than anybody other's</em>. So I believe, so far, the participating foundries can safely say that the money (the commission) was, indeed, well spent — simply because they have been enjoying steadily increasing income from us since MyFonts' inception. </p>
      <p>And that money will continue to be well spent — for the existing foundries whose contracts we of course honor, for the new foundries that manage to snatch the old commission rate if they sign up by the end of this month, and also for the future foundries which will not enjoy the “early bird” privilege, but will nonetheless benefit from all the innovation and effectiveness that MyFonts has to offer.  </p>
      <p>OK, everyone in the first row can wake up now. ;)</p>
