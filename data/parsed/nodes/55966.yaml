      <p>&gt; all users there are volunteers, so they’re not “on MyFonts’ roll”.</p>
      <p>Could you pay some of them a stipend to screen all incoming fonts? Not for design quality, but simply for plagiarism. That sort of thing would add even more value to MyFonts (most of all for scrupulous font designers). You might even pay for them to [gradually] go through all the fonts you already have. This isn't as time-consuming as it might sound, because a good hound can very quickly get a vibe with a quick glance at a pangram; then the potential offender would be moved to "level 2" for closer inspection.</p>
      <p>&gt; I would really like to encourage users to<br>
      &gt; report such things directly to MyFonts.</p>
      <p>Cool.<br>
      Assuming there isn't one already, it would be nice to have an official channel to go through specifically for this, and announce its availability on various fora.</p>
      <p>&gt; With MyFonts being a meritocracy, we believe that it will be<br>
