      <p>hrant said:<br>
      &gt;   a few dozens</p>
      <p>great catch!</p>
      <p>are there more?</p>
      <p>because i count 10300+ characters, 1700+ words, 185+ lines,<br>
      70+ sentences, and 50+ paragraphs, so if there's only 1 error,<br>
      then that's a whole lot closer to "polished" than to "tarnished"...</p>
      <p>in fact, if that's all there is, and we fixed that, we are "finished"...</p>
      <p>moreover, when we get that level of cleanliness from an author,<br>
      outtadabox, we don't call it "polished", we call it "well-polished".</p>
      <p>if you can find more mistakes, though, it would sway the score.<br>
      (but probably have to find many more to end up at "tarnished".)</p>
      <p>anyway, i will use this fantastic content as the textual matter for<br>
      some more of the research experiments that i'll be doing here...</p>
      <p>here are the opening paragraphs, our header the 2.5 alphabets<br>
      which is typically recommended as a most desireable measure...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/myfonts-001_6715.png"></div><p></p>
      <p>-bowerbird</p>
      <p>p.s.  as you can see in the screenshot, i found two errors there.<br>
      in the rest of the piece, i got another 8, so 10 total.  very clean.<br>
      (not counting 15-20 times when we disagree on serial comma.)<br>
      i'd be interested in any other edits that anyone has done on this.<br>
      and, of course, anything that the author might want to rewrite...        ;+)</p>
