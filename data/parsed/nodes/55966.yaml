      <p>Sixth paragraph: in "The automatic WhatTheFont identification system backed by the WhatTheFont Forum where", you forgot the "is".</p>
      <p>Eighth paragraph: in "We developed “More fonts like this”, introduced", say "the “More fonts like this” feature" instead.</p>
      <p>Last paragraph: in "immediate font downloads are industry standard now", either hyphenate "industry-standard" or say "an industry standard".</p>
      <p>Immediately following: in "and less and less distributors actively promote", since you can count distributors it should be "increasingly fewer".</p>
      <p>In the "So, what now?" section, first paragraph: in "But the work is not finished, we have great plans.", that comma doesn't work; adding an "and" is probably best.</p>
      <p>Same paragraph: "With our new design and editorial content, we have indicated the direction." is a bit stilted; maybe "shown our future plans" is good enough.</p>
      <p>Last paragraph: in "some foundries that had the intention of signing up but “haven’t gotten around to doing it”, we have decided that they still have the chance to sign up with the old rate", 1) "have had the intention" is better; 2) instead of "they", say "foundries"; 3) "at the old rate" is better.</p>
      <p>There are also some small things but nobody will notice those.  :-)</p>
      <p>hhp</p>
