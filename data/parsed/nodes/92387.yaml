      <p>I'm amazed that nobody has said boo in that:</p>
      <p>1) The creator of the font freely admits to accessing the outlines of all of the fonts on his PC - and thereby breaking the license terms (presumably) for almost all of them.</p>
      <p>2) Does not give credit to his sources.</p>
      <p>Why no list of fonts? Why no credit where credit is due? </p>
      <p>BTW - I haven't looked yet, but who's listed as the designer?</p>
      <p>What a world.</p>
