      <p>Interesting that you mention old letterpress.<br>
      When I developed Paradigm, which was based on the really awful (by later standards) printed quality of a “blobby” Sweynham &amp; Paanartz' 15th century face, I decided to rationalize/stylize the serif treatment, with convex ﬂares, but giving them a slight sharpness.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ns2_4720.png"></div><p></p>
