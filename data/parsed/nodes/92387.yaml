    html: <p>The thing is, the average font is never going to be rounded and blobby at the joins. Since he's modified the letter shapes anyway from the rendering, wouldn't an interesting and possibly fruitful avenue be to look at the result and try to create regular font outlines based on the proportions and shapes? The font would be far from average (the cut-and-curve a, for instance, would be interesting!), but perhaps fun.</p>
