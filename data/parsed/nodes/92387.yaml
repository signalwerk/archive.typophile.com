    html: |-
      <p>Whatever the rationale, the end product is pleasing at least to my eye. Its soft edges and loose spacing convey a feeling of warmth and sincerity, and are a simple joy to read.</p>
      <p>Whether or not my perception is clouded by reading too many old letterpress-printed books—where such rounding occurs through wear and ink accumulation—or that the forms themselves are simply more optically inviting is a question I will leave to those far more knowledgeable than me on such subjects.</p>
