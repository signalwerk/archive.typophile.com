    <p>Just something I did out of boredom...<br>
    Inspired by Joseph Yap who made a logo for his son (<a href="http://typophile.com/node/34024" title="http://typophile.com/node/34024">http://typophile.com/node/34024</a>), I made a logo for myself. As you can (hopefully) see it's inspired by heavy metal logo's like Judas Priest &amp; Iron Maiden. Not necessarely my kind of thing, but I've always liked the look of it, it's sòòò cheesy ;-)<br>
    Just so you know, I'm not actually planning on using this. At least not until I've grown a Hogan Hulk moustache, a David Bowie (Ziggy Stardust period) mullet, expanded my wardrobe with some bandana's &amp; start using make-up to accentuate my eyes ;-p</p>
