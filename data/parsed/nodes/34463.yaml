      <p>I've adjusted my k to "fit" into the t (and I made the stroke of the t a little longer to align with the ascender of the k again).. I'm not too sure whether the "triangular gaps" of the k are not too big now though. I kind of liked the smaller gaps, but I'll have to give myself a little time before I can compare the two results objectively (as far as that's possible ofcourse) ;-)<br>
      I've made the gradient a little lighter as well which -I think- is definitely an improvement.</p>
