      <p>Probably everybody has some problems reading it. It's not the top of the readable type anyway. :) Jokes aside. I can read it. Not as normal body text, but for logo it's fine. I was just struggling with the "cs" ending because to me that was a weird combination of letters. Checking your profile, I saw it is normal in your language.</p>
      <p>Did you try to make the ascender on "k" a bit higher to make the gap between "t" and "k" the same as it is with other letters?</p>
      <p>Gradient is almost not visible. To me that means: discard or correct.</p>
      <p>Bottom line: nice play on type.</p>
