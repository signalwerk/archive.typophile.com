    html: |-
      <p>I did have some problems with the gap between the k &amp; t, but they don't line up well to make the ascender of the k higher. I gave preference to aligning the rest of the letters (o with u, m with c &amp; s). I did think about adding a "dirty splatter/spot" (or maybe a star for that glamorous look) in the corner of the t &amp; k to camouflage the gap, but I haven't found the right "splatter" yet ;-)<br>
      The gradient did look brighter in Illustrator, but I'm still playing with that for now. If I end up using it as a "signature logo", I'll probably adjust the colours to each design.<br>
      The cs-ending is actually not usual... Trust me, I always have to spell out my name about 50 times before people get it right ;-)<br>
      The name actually originates from Croatia, but has been "butchered" in the past (the rest of my family still spells it Lu'kac with a reversed ^ on the c).</p>
