    html: <p>The /S here is very distinctive, along with the upper terminal on the /f. These are flavours found in the 19th century grothesques. I'd suggest a close modern alternative might be <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/bureau-grot/" rel="nofollow">Bureau Grot</a> from Font Bureau.</p>
