  html: |-
    <p>I was wondering, if a foundry demands to buy my font I'm going to be like, "Hell no."<br>
    I want to own the copyright. But why will they want to work with me to finalize the development of the font, if they will only have the right to sell it for a few years? They must figure that I will be taking my font with me and leaving at some point if I am only licensing the font to them. Is there really a lot in it for them to put their resources and energy into helping me finish it, if they figure (and figure right most likely) that I will leave them and take it with me at some point, if I can - Jeremy Tankard style?</p>
    <p>I've heard some designers who say they sold the copyright to a foundry and regretted this because it could have made them more money if they hadn't, over a period of 10, 15, 20 years or more. Especially as they gain notoriety. </p>
    <p>If they want to own my font I'm saying no. I will only license it.</p>
