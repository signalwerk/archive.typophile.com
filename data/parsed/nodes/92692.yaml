      <p>"I want to own the copyright"<br>
      This really depends on whether or not you (yourself) are legally and financially, (to begin with), prepared to defend the copyright. Also, if the font software is evolving over time, the copyright can be complicated. </p>
      <p>The trademark, which is where long-term value accrues in successful design and marketing, is what I think you want ownership of.</p>
