      <p>In general, I agree with Hrant. (Checks Bible against signs of the apocalypse, nope, it‘s not on the list. Whew!)</p>
      <p>However, fundamentally, if you want to really "own" the font(s), then you do <strong>not</strong> want your distributor or foundry partner to own the trademark. You may think of it as “just” the name, but if the typeface does well, then there will be equity (value) in that name. It’s what people mostly refer to the typeface by. Taking your outlines elsewhere will become of less value to you and future partners if the name doesn’t come with them.</p>
