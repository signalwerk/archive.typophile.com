      <p>Thanks for all your advice everyone. I'm starting to shy away from foundries now and think I may go the reseller route instead. I'm looking at a contract right now for distribution through a distributor. Essentially I would be licensing it to them for a certain period of time, and when that is up I would like the ability to take the font away from them if I want to. I'm trying to keep as much control as possible. It seems like they are trying to take as much control away from me as they can. They have a lot of things in it that I don't like that I've told them I want to change or remove.</p>
      <p>@dberlow - If I sign a contract with a foundry or reseller and it says that during the term of the contract I'm licensing the font to them, they may trademark the name of the font in their name, do you know if they can they use this to take ownership of the font from me? The trademark is just the name of the font, but how much power will this give them over me?</p>
