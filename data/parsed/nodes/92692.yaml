    html: |-
      <p>If you don't have the knowledge and skills to polish a typeface yourself, then it is probably worth selling to a major foundry, *if* they will really hold your hand and help you.</p>
      <p>They also likely have better distribution and so forth, and will get you a lot more exposure. Which will help the sales of your subsequent fonts.</p>
      <p>That being said, the tradeoff is taking a significantly lower percentage than if, for example, you went through MyFonts.</p>
      <p>Then again, it may be a bit presumptuous to assume that a major foundry will *want* to go that route if you can't submit a really polished piece of work. Adobe for example, apart from typefaces they commissioned for language support goals or other specialized purposes, only bought one outside design in the last five years I worked there.</p>
      <p>Regards,</p>
      <p>T</p>
