  html: <p>This is my first attempt at designing a typeface from the ground  <br>up, any and all comments are appreciated. Be brutal -- I want  <br>to learn! <br> <br>I wasn't entirely sure whether to post this here or in the display  <br>section, since I only really intended it to be used in large sizes.  <br>A couple of people have told me they like it in smaller sizes, but  <br>I think it's too heavy. I may make a lighter (and better spaced <br>for text) weight if this one turns out OK. <br> <br>Thanks in advance, <br> <br>Jordan <br> <br><img src="http://www.typophile.com/forums/messages/29/21589.gif" alt="Lowercase only I'm afraid"> <br><img src="http://www.typophile.com/forums/messages/29/21590.gif" alt="Sample words"> <br><img src="http://www.typophile.com/forums/messages/29/21591.gif" alt="Sample sizes"></p>
