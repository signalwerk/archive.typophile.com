    html: |-
      <p>I think that timeless is something that happens over time, not something which can be predicted 100% of the time. So you, it is possible to develop a timeless typeface. But I doubt one would be able to sit down and say, “today, I will design a timeless typeface,” and then do it. You see what I mean?</p>
      <p>Timeless really comes about because of application, I think. If you are living in 1930, and you design a new face for the Times of London, it is a good bet it’ll become a timeless face, just because the most significant newspaper of the day will use it. What’s a 2006 equivalent? A face like Verdana that a company like Microsoft will put on ever machine so it’ll be all over the internet?</p>
