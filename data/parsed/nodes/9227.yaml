    html: "<p>Are you talking about kerning existing fonts in graphics apps or fonts you are developing in a font editor? <br> <br>Assuming it's more likely the latter, here's what a lot of type designers do, briefly: <br> <br>Once you have your basic spacing set and things are looking good with unproblematic glyph combinations, you go through and find pairs of glyphs with problematic right and/or left sides (A, L, T, etc.) and then put these in your kerning/metrics editor amongst \"normal\" or \"control\" glyphs (usually runs of H and O) and add kerning until you get even spacing or a reasonable facsimile. As a reality check, generate and install the font and set some words, sentences, paragraphs, etc. in a graphics program and go back to the kerning editor if necessary. <br> <br>It's a pretty tedious task, so it's good to be as systematic about it as you can (e.g., make lists or tables of possible pairs, etc.) and take advantage of tools and shortcuts available (e.g., Kerning Assistance in FontLab and FOG, class kerning, etc.). The thing NOT to do is just dive in and start kerning pairs at random or to attempt to do kerning before the basic spacing is worked out. I also don't recommend auto-kerning.</p>"
