  html: <p>I want to find out how you guys kern. what do you think makes for good kerning? Do you look for specific problematic pairs of letters, or do you try to make the entire words themselves have even "coloring" or weight? Do you treat words first, and then their relationship within sentences? <br> <br>I need some experienced advice as how to best approach this. <br> <br>thanks!</p>
