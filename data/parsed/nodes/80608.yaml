    <p>Hello Everyone,</p>
    <p>I am a student pursuing masters in Graphic Branding and Identity. I am writing a discourse on the usage of typographic terminology. I asked this question to my professors and they had different opinions. </p>
    <p>What I have understood is that a ‘typeface’ is the design of the alphabet-the shape of the letters that make up the typestyle. The letters, numbers, and symbols that make up a design of the type. So Times New Roman Regular is a typeface.</p>
    <p>‘Font’ is the digital file that contains/describes the typeface. Its name is derived from the word ‘fount’ and it is a collection or a family of all the different styles and sizes of a typeface. So, Times New Roman (Italic, Regular, Bold and Bold Italic) would be a font.</p>
    <p>Any help will do, and is really appreciated.<br>
    Thanks.</p>
