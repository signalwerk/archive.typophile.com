      <p>I stayed in Sherfield when I was at Reading (2003) and I highly recommend it. The rooms are large by student halls standards and you get to have a private bathroom which is quite an important thing. There’s also a cleaning lady that fixes up the kitchen every day and the room once a week. This is quite a treat as the only bit of housework you’ll do is the dishes.</p>
      <p>The hall is 5-6 minutes off from Queens’ drive but you’ll need a total of around 25 minutes to get to the department as it is on the other side of campus. Still, it’s a wonderful campus and if you get a bicycle it’ll be quite ok.</p>
      <p>I was lucky to have very nice flatmates and in a way was a good thing to have my course friends and a seperate group of “normal” people. It makes you able to switch off from type design (i need that sometimes).</p>
      <p>The hall organises some parties, pub crawls, and pub quizes. It also has the JCR which is quite handy if you feel like going out but can’t be bothered to get to town. The computer room and laundry are quite ok as well.</p>
      <p>We had some fire drills. I actually accidentally caused the fire alarm to go off (at 10 pm) because i was boiling pasta and 2 other pots of vegetables and had the kitchen windows closed. It was cold outside and we actually thought it was really as we were the only house that got evacuated. It’s one of those things you laugh about afterwards.</p>
      <p>There is a downside though. You can never know who you get as flatmates. One of mine finished in June and we got a series of unfortunate flatmates afterwards:<br>
      - a guy who would walk around in very brief boxers (it was difficult to have conversations with him...)<br>
      - a guy who cooked salmon in the oven and invited all his friends but did not clean up afterwards. The whole building stank of fish.<br>
      - a guy who had loud sex<br>
      - a guy who was just weird<br>
      - we also had a girl who caused a racket every time she was on the phone</p>
      <p>Still, it was a wonderfull experience and Sherfield is a great place. As far as I know, they usually place postgraduates together so you might be able to escape the noise.</p>
      <p>I hope this helps. Enjoy Reading!</p>
