    html: <p>At this moment I study in Reading and live in St. George’s Hall. The accomodation is very small, but I am lucky that the people I share the unit with are quiet and serious, sometimes there are parties, but they never last longer than 01.00. Besides, I have very nice classmates who invited me regularly in their ’normal’ houses. And then there are the firedrills, there not very nice especially the one’s in the night. It is a good second option to live in a Hall. The only nasty thing is the cooking, when everyone is in it can be very busy and if you are not the first you have to wait.</p>
