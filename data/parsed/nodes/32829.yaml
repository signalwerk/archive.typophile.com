      <p>I’d check out <a href="http://www.rdg.ac.uk/Wantage/">Wantage Hall</a>. They tend to put mature students in the ’Old Court’, which has spacious rooms and is very quiet compared to St. Georges etc. It’s also considered the most ’elegant’ of the residences here.</p>
      <p>The same also applies to St. Patricks but i can’t say the food there was any good!</p>
      <p>The en suite rooms here tend to be small and miles away from the department. Bulmershe campus has nice accomodation but it’s a small trek away from the main campus. Student village is also decent and tends to be occupied by international students. Stay away from Bridges, Childs &amp; Wessex halls!</p>
      <p>Oh, i almost forgot... Whiteknights hall is also another good possibility, some en-suite rooms, located on campus and relatively modern!</p>
      <p>Hope this helps...</p>
