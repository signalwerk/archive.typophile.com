    <p>Hi,</p>
    <p>I have been offered a place at the MA Theory &amp; History at University of Reading and I’ve decided to accept the offer - and so it is time to think about accommodation.</p>
    <p>I have already gone through a thread here on Typophile where some great pointers are found - but it is a couple of years old (outdated?) and it doesn’t answer all my questions. So I’m hoping some of you might be able to help me pick the right place.</p>
    <p>I am looking for a quiet and relaxed hall - ideally en suite room but it is not crucial. I’ve been looking at Hillside Court and Sherfield Hall based on tips on previously mentioned Typophile thread. I’ve seen no mention of Wesex hall even though it is in close proximity of the department. How would you describe these (and also Bridges Hall)? Should I be considering other halls?</p>
    <p>What would you, students of Reading, suggest for me?</p>
    <p>Thanks!</p>
