      <p>Halls aren’t the only option for more affordable places to stay. You can also find houses off campus that have single rooms to rent (for example, a landlord with a four bedroom house who rents the rooms individually or a group looking for a house-mate). The University accommodation office has listings like these or you might be able to find them in classifieds. </p>
