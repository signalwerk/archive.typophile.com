      <p>When I studied at Reading I experienced three kinds of accommodation: in-hall fully-catered (<a href="http://www.rdg.ac.uk/childsweb/">Childs hall</a>), in-hall self-catered (<a href="http://www.rdg.ac.uk/UnivRead/Halls/hall_bridges.htm">Bridges hall</a>), and in private house (<a href="http://flickr.com/photos/gerryleonidas/sets/608423/">Gerry’s at Oaklands</a>). I recommend the latter.</p>
      <p>In-hall fully-catered is definitely NOT a good option. The food is bad (lots of deep fried stuff, like fish and chips), the meal times are restrictive (plus you have to wait in a line, and, if I remember correctly, dinner is not served on weekends), it’s way expensive (you pay double just because of the food), and you’ll be disturbed by obnoxious undergrads.</p>
      <p>In-hall self-catered can be OK, depending on the people you share the unit with. If someone decides to throw a booze-party in the pantry, you’ll have a difficult time cooking your meal. And if they don’t clean up afterwards, or if somethings gets broken, everyone in the unit will be held responsible and fees may apply. Apart from that, you get to have/cook your meals at your discretion, and the units tend to be quite because they’re mainly filled with postgrad students.</p>
      <p>In private house tends to be the best, but it’s good to know in advance the people you’ll be sharing the house with. It requires a fair amount of discipline, community sense, and organization, to keep life running smoothly and everyone happy. It can be the most enjoyable and least restrictive accommodation option, as long as everyone is responsible and respects each other. And, in general, you won’t have to worry about keeping everything locked (room, belongings, food), unlike in the halls.</p>
