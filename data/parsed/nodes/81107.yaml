      <p>Welcome!</p>
      <p>Centaur is a beautiful typeface, as is Avenir in my opinion, but Centaur is very much rooted in old Roman type by Nicolas Jenson.  It has a very low x-height, fairly calligraphic/incised letterforms, whereas Avenir is a very friendly, open, 'modern' geometric sans serif.  Maybe choosing a more contemporary, open serif would serve you well - something like Sabon.</p>
