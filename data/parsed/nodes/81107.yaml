      <p>OK here's what I've learned so far:</p>
      <p>"I like them both, and they both look old-fashioned" doesn't make them harmonious. (With the Avenir, I was keying in to how a geometric sans had been nicely humanized. Avant Garde but not so avant-garde-y. With the Centaur - well, the source of the old-fashioned-ness is obvious.) The fact that Centaur is calligraphic and Avenir is slightly humanized doesn't make 'em a match in your book. </p>
      <p>If I want that vibe and I'm more attached to the hint of Art Deco I see in Avenir (again, am I off-base?), I'm supposing that I ought to seek a body-text serif font that is more of a modern homage to Centaur/Kennerley than a faithful revival of it. Something with a more stylish x-height. Possibly something with a touch of Art Deco lineage.</p>
      <p>I'll look into the Sabon and the Jenson, just for my education. While I'm at it: are either of those closer to what I've just described?</p>
      <p>And I do want to circle this back around to my question about Avenir vs Museo Sans. Do I err to see the former's lineage in the latter? Centaur vs Goudy Bookletter 1911, same question. Guess I'd better type out the characters and get to studyin' them.</p>
      <p>Nobody has brought up "typographic color" yet, and I'm glad... I don't yet really have the discernment to see what's being referred to by the phrase.</p>
      <p>Thanks for your responses.</p>
