    <p>&lt; / l u r k &gt;</p>
    <p>Hi, all. Long-time listener, first-time caller.</p>
    <p>Just learned the difference between a typographer and a type designer; thrilled to learn that I may, in fact, be a budding typographer. I’ve no illusions about ever being a type designer; to you types (ha!), I tip my hat in admiration.</p>
    <p>SO! Been reading articles and blogs, and “Thinking With Type,” and <a class="freelinking external" href="http://www.peachpit.com/store/product.aspx?isbn=0321534042" rel="nofollow">The Non-Designer’s Design Book</a> and others, and I think I’ve got a good start. I’m developing tastes. I’m driving my wife nuts pointing out typefaces I recognize and typological (is that the word?) errors I see in the wild. </p>
    <p>Now I bring you a typeface pairing to see whether something I’ve somewhat latched on to might pass the acid test of your expert opinions:</p>
    <p>Avenir for titles/headings/captioning, Centaur for body text.</p>
    <p>Weird? Discordant? If so, why? Help me learn.</p>
    <p>Also, am I on the right track to be seeing similarities between Avenir and Museo Sans? Same question with Centaur and Kennerley Old Style (a.k.a. Goudy Bookletter 1911). Set me straight!</p>
    <p>Last question: why does this forum NOT change "straight quotes" into “curly quotes?”</p>
