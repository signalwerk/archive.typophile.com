      <p><cite>Nobody has brought up "typographic color" </cite></p>
      <p>Yes, I did. The "too light" in my characterisation of Centaur is about colour. The concept is quite easy to grasp: Have a look at a page of continuous text from a distance. Centaur will look light grey. Jenson set at similar size will look much darker grey. </p>
      <p>You're right, Museo Sans shares a lot of DNA with Avenir.</p>
