      <p>Ah, dying thread re-awakens without my intervention. How nice.</p>
      <p>My particular, ahem, <em>challenge</em> for this particular application (which would be, types for personal marking/branding) is, I gravitate toward things that have <em>just a little bit too much</em> character/personality/quirks in order to be quite appropriate for the use I put them to. When it's for me.</p>
      <p>Not "florid," but certainly not "reserved."</p>
      <p>You've pointed me towards tons of options. I'll go do my homework. </p>
      <p>While I'm at it, are there any Venetians that evince anything of the Art Deco aesthetic? I know that they're from two different worlds, but sometimes interesting stuff happens when worlds collide.</p>
