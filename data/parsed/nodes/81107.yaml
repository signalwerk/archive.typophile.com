    html: <p>Bruce Rogers' Centaur is not intended for small sizes, originally it was cut in 14 points. It has too low x-height, and is just too thin and too light for body text. I'd use Adobe Jenson instead, which is made in four optical sizes. Centaur really shines at larger sizes, though.</p>
