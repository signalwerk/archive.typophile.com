      <p>I read nicc?<br>
      You should work first in black &amp; white, and add colour later.<br>
      Also, working with geometric and/or stencil visuals, n appears out of place. Adding a gap in it could resolve both problems.<br>
      Finally, you should revise spacing.</p>
