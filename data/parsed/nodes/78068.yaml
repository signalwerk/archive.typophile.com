      <p>Once you make all the changes mentioned so far...maybe, just maybe, apply the same treatment to the tittle? Perhaps just add the break without a counter? Shrug. It might add interest and continuity, it might not. Worth checking out at least, IMO. </p>
      <p>I also recommend printing your work in progress, in multiple sizes from an inch upward. It may seem counter intuitive since you can zoom on a computer, but it's amazing what you see on paper that you miss on a monitor. Oh, and I agree with Riccard0 that working in black and white is an absolute must until the design is finished. Add color last.</p>
