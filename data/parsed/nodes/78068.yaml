    <p>Hey there fellow typophiles, I am a design student in need of some help. I need to create a logotype/brandmark for myself. My name is Nico and I think I have settled on a design I like that utilizes Gill Sans regular with some illustator work added. I want to know what professionals think about it just to see where I am or if I'm just kidding myself. Absolutely any critique or question you have is welcomed, good or bad. thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5948.jpg"></div><p></p>
