    html: |-
      <p>\i\ – \c\ needs some more space. It looks like you messed up the stencil-o — it’s not symmetrical. Start with the proper o and use a gap that has a relationship with the thin part of the \n\. To complete the look and maintain logic you should also cut the \n\.<br>
      Reposition the dot on \i\ - it should be centered on the stem!</p>
      <p>Coulourwise: there is too much contrast between the olive-shade and the dirty blue. Up the olive.</p>
