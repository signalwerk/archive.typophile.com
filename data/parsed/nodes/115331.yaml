      <p>I have been asked to make a copy of this clasp. Before I draw up all the text, I wondered if there was a regular font close to it. It's a little like a clarendon but with squarish serifs and a different leg on the R.<br>
      anybody know?<br>
      Thanks very much,<br>
      Matt.</p>
