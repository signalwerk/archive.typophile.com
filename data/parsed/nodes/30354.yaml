    <p>Keith Tam was born and raised in Hong Kong and has lived in the UK and Canada. He is a communication designer who specializes in typography. </p>
    <p>He is currently a lecturer of Visual Communication at the School of Design, The Hong Kong Polytechnic University, with a focus on typographic and publication design. He formerly taught at The Emily Carr Institute of Art, Design and Media in the Communication Design program.</p>
    <p>His type design includes Arrival, a legible and humane sanserif typeface designed for directional signing, currently used by the campus wayfinding system of the University of Reading, UK. </p>
    <p>Keith co-founded Type Initiative with Greek type designer Michail Semoglou in 2005, and their typefaces are on sale at the type co-op Village. Keith holds a B Des in Communication Design from the Emily Carr Institute in Vancouver, Canada and an MA in Typeface Design from the  Department of Typography &amp; Graphic Communication at the University of Reading, UK.</p>
