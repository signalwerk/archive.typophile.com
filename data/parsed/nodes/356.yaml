    html: <p>Make diagonals endings of S, C, E, less diagonal and it will work better. <br> <br>Correct optically horizontal/vertical weight. <br> <br>Make the A bar lower, make P more bigger, so more lower for middel bar. <br> <br>Correct the middle joint of the K to avoid "black hole" at connection. <br> <br>Et voil</p>
