    votes: null
    html: <p>Hey Ben- <br> <br>The A + P crossbars should not be the same height. The bar in A ought to be distinctly lower.  <br> <br>The E + P are the best letters thusfar.  <br> <br>The way you've snipped the corners from the S doesn't make sense with the rest of your font. It results in a distinctly backwards slant in relation to the other letters.  <br> <br>The K is so clunky, and it feels like a chank rip-off. Fix the join and (IMHO) lose the 90</p>
    html_clean: <p>Hey Ben- <br> <br>The A + P crossbars should not be the same height. The bar in A ought to be distinctly lower.  <br> <br>The E + P are the best letters thusfar.  <br> <br>The way you've snipped the corners from the S doesn't make sense with the rest of your font. It results in a distinctly backwards slant in relation to the other letters.  <br> <br>The K is so clunky, and it feels like a chank rip-off. Fix the join and (IMHO) lose the 90</p>
