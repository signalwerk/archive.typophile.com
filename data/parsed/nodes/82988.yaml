    <p>Just wondering if anybody could help me identify this retro multiline font from the 70's.<br>
    It came from the "Handbook Of Freestyle Skateboard Tricks"</p><div class="imageWrap"><img src="http://typophile.com/files/freestyle_4677.jpg"></div><p></p>
    <p>I noticed it also shares similar characteristics of the typeface on the Letraset catalog cover, only the "Freestyle" typeface has fewer lines.</p><div class="imageWrap"><img src="http://typophile.com/files/letra_6587.jpg"></div><p></p>
