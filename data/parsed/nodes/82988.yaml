    <p>Just wondering if anybody could help me identify this retro multiline font from the 70's.<br>
    It came from the "Handbook Of Freestyle Skateboard Tricks"<img src="/sites/default/files/old-images/freestyle_4677.jpg"></p>
    <p>I noticed it also shares similar characteristics of the typeface on the Letraset catalog cover, only the "Freestyle" typeface has fewer lines.<img src="/sites/default/files/old-images/letra_6587.jpg"></p>
