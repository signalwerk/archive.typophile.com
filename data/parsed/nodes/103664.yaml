    html: |-
      <p>You might try using the serifs to your advantage to make fill in the space and make a more even color. Perhaps more than you are now depending on the letter.  While you do on the |f| and |t|, I think it's lacking in the |r|. On some letters you may want to drop serifs entirely in parts. The |m| and |w| could really do without the serifs, I would venture to say. They are already crowded without them.</p>
      <p>The |z| seems a little off to me with the angle of the serifs. But the feature is nice, if you use similar angle for some of the other serifs, that may be cool.</p>
      <p>Looks interesting, love to see where you go with it.</p>
