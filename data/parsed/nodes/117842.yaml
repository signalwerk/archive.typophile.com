    <p>Hi,</p>
    <p>I've designed a font in one of my classes at design school, the idea was to have the font feel as if it had been folded out of a sheet. And then I also made tehe font from a sheet, folded it and fotographed it so I had a Clean and a real version.</p>
    <p>Now I am working with a fiend to make the letters in 3D and stick it in an Augmented Reality app so that you can see how the font is only realy visible from one perspective.</p>
    <p>It's still work in progress but I was wonderin how you would react, if we could get any tips, maybe where to drop this idea or which type of people might be interested in this so we have an idea wehere to take this project.</p>
    <p>Thanks!</p>
    <p>Coen.</p>
    <p>what were planning in AR: <a href="http://vimeo.com/99744592">http://vimeo.com/99744592</a></p>
    <p>My project at school: <a href="http://coendekoning.com/folding_fraktur.html">http://coendekoning.com/folding_fraktur.html</a></p>
