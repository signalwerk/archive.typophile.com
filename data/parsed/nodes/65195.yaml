    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gerusa_typophile_3445.jpg"></div><p></p>
    <p>Hello!</p>
    <p>Gerusa Type Family will be released today!</p>
    <p>Gerusa is a technical sans-serif typeface family by Loligovulgaris.com.</p>
    <p>It features a 1000+ glyph set per cut, with (almost) monospaced uppercase and text-suitable lowercase characters, a very complete set of diacritics, math glyphs, greek and a full range of OpenType features.</p>
    <p>This family is OCR and ISO inspired, with an engineering/architectural feel, robust and pragmatic, with the usual technical ugliness chopped away.</p>
    <p><strong>Gerusa Medium and Gerusa Medium Italic are available for free!</strong></p>
    <p>You can check it here:<br>
    <a class="freelinking external" href="http://loligovulgaris.com/?p=357" rel="nofollow">Gerusa at Loligovulgaris</a><br>
    <a class="freelinking external" href="http://www.behance.net/Gallery/Gerusa-Type-Family/284676" rel="nofollow">Gerusa at Behance Network</a><br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/fabio-martins/gerusa/" rel="nofollow">Gerusa at MyFonts</a></p>
    <p>Cheers!</p>
