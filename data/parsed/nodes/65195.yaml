    <p><img src="/sites/default/files/old-images/gerusa_typophile_3445.jpg"></p>
    <p>Hello!</p>
    <p>Gerusa Type Family will be released today!</p>
    <p>Gerusa is a technical sans-serif typeface family by Loligovulgaris.com.</p>
    <p>It features a 1000+ glyph set per cut, with (almost) monospaced uppercase and text-suitable lowercase characters, a very complete set of diacritics, math glyphs, greek and a full range of OpenType features.</p>
    <p>This family is OCR and ISO inspired, with an engineering/architectural feel, robust and pragmatic, with the usual technical ugliness chopped away.</p>
    <p><strong>Gerusa Medium and Gerusa Medium Italic are available for free!</strong></p>
    <p>You can check it here:<br><a href="http://Gerusa at Loligovulgaris" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Gerusa at Loligovulgaris</a><br><a href="http://www.behance.net/Gallery/Gerusa-Type-Family/284676" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gerusa at Behance Network</a><br><a href="http://new.myfonts.com/fonts/fabio-martins/gerusa/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gerusa at MyFonts</a></p>
    <p>Cheers!</p>
