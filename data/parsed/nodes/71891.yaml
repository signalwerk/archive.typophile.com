      <p>@typodermic I was thinking that as well but I couldn't understand why. I don't know much about how they worked with type at that time and whether or not they would have access to similar typefaces. They could have seen Akzidenz and redrew/modified it. But again, I don't know much about their process.</p>
      <p>@gillo I thought that originally as well but I chalked the spurs up to the quality of the photo.</p>
      <p>@johnnova That looks really close but the only difference I am seeing is that the crossbar of the A is lower than the terminal in the K</p>
      <p>I might get the clock in my hand and take a closer look at it. This is all mute because I don't need the typeface for anything but my father (a camera collector) is curious. Either way, still fun.</p>
