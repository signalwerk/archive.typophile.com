    <p>Have some trouble figuring out this typeface. The part of the image that says Kodak Timer. The timer is probably circa 1920s—1930s.</p>
    <p>My best guess was Akzidenz-Grotesk Extended but the E doesn't match with the short crossbar and the Ks are not quite right. I'm also not sure if the extended version of Akzidenz was around in the 1920s or if that was added later on.</p>
    <p>Image attached. Larger image can be found here <a href="http://www.flickr.com/photos/kb1awv/4728792494/sizes/o/in/photostream/" title="http://www.flickr.com/photos/kb1awv/4728792494/sizes/o/in/photostream/">http://www.flickr.com/photos/kb1awv/4728792494/sizes/o/in/photostream/</a></p>
