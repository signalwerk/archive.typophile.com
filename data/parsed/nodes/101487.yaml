    <p>Hi,</p>
    <p>Am in the process of designing a series of fonts for personal use (6 weights with associated italics, OTF-CFF, 2048em) . I am wondering, what effect does PS hinting have on printing? Does it make the final product sharper on digital print I am looking at printing at 1200dpi - 2400 dpi on both commercial and non-commercial printing services. There is mixed discussion related to Type1 fonts but nothing on OTF. Also, I have tried using Adobe Font Development Kit for OpenType to make autohints for my font - on Mac OSX (Mountain Lion) the glyphs look fine on-screen, bit haphazard on PC (Win7).</p>
    <p>Any comments/suggestions are welcome.</p>
  html_clean: |-
