      <p><em>...no one explained to this poster that he had a crossed-spec, asking for hinting advice on a 2048 PS font.</em></p>
      <p>A 2048 UPM is perfectly within spec for a CFF OpenType font. The 1000 unit limitation was specific to Type 1 fonts. At least one third party PDF-creator assumes a 1000 UPM for all PS fonts, causing spacing problems if this is not the case, but other than that and a problem with cursor scaling in the first version of InDesign, long since fixed, I've not encountered any problem with a non-1000 UPM in CFF fonts. Indeed, we've even made 2048 unit CFF fonts for Adobe.<br>
      _____</p>
      <p>I don't think I am saying that horizontal bars are the be-all-and-end-all and that everything else can go to hell. I merely point out that this is a consistent problem in Apple text rendering at what you've spent years reminding me are still important resolutions. I also pointed out what I think are other problems with the Apple rendering as shown in your example: greatly inconsistent weights across different glyphs and an overall lack of sharpness.</p>
      <p>Nor am I saying that I think the Microsoft rendering is perfect. In terms of PS rendering, though, its a heck of a lot better than what Adobe's black box produced for GDI. And it has <em>some</em> qualities, despite its lightness, that I think are better -- i.e. better for reading -- than what Apple produce for the same font at the same size and resolution. Do I wish it were possible to marry those qualities to a better representation of the true weight of a given type? Yes. Do I think achieving that better representation is worth throwing out those qualities? No. That's where you and I seem to differ in opinion, and it is at that point a matter of opinion.</p>
      <p>I use a terminology that might be different from what you use because I've thought about it carefully and determined that we should be able to talk about stroke density as a quality of text independent of particular technology. Drop-out control is a particular technical mechanism that plays a role in stroke density in particular environments. I originally settled on the term stroke density because various people -- including Kevin Larson and other cognitive psychology folk -- were talking about 'stroke contrast', which is a confusable term since typographers use the same phrase to talk about the relationship of thick and thin strokes in a letter (what I call stroke modulation pattern when I'm seeking to be precise, which is most of the time).</p>
