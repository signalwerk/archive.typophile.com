      <p>At 2400 dpi hinting won't improve rasterisation. Which, note, is not the same thing as saying that hinted and unhinted glyph will rasterise <em>exactly</em> the same at 2400 dpi. But you're unlikely to be able to tell the difference without a lot of magnification.</p>
      <p>At 1200 dpi, I would still expect hinting to improve things in terms of stem weight consistency and alignment at some sizes.</p>
      <blockquote><p>...on Mac OSX (Mountain Lion) the glyphs look fine on-screen, bit haphazard on PC (Win7).</p></blockquote>
      <p>In Windows, you will get different results with PostScript (CFF) OpenType fonts depending on whether a given piece of software is using the GDI renderer (crap) or the DWrite rendered (excellent). Most software is still using the older GDI renderer; newer software, especially that aimed at Win8, is more likely to use DWrite and -- best news in recent weeks -- the new Office 2013 uses DWrite (note, however, that means the end of Type 1 font support in Office).</p>
