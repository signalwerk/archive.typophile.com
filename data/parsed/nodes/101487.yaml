    html: |-
      <p><em>So DWrite will appear more like Mac in that it doesn't pay that much attention to hints and uses the outlines of the font?</em></p>
      <p>GDI used a rather ancient and not very good PS black box rasteriser that Adobe provided to Microsoft back in the late 1990s. I'm not sure if it was ever updated. It displayed both Type 1 PS and CFF OpenType fonts.</p>
      <p>DWrite applies its ClearType rendering model to both TT and CFF OpenType fonts. This is x-direction subpixel colour rendering combined with y-direction greyscale rendering and subpixel horizontal positioning. It does not support Type 1 PS fonts.</p>
      <p>With regard to hinting, I'm not entirely sure how DWrite makes use of PS hinting, but I suspect it does since Microsoft have always been more concerned about maintaining stroke density than Apple. DWrite rendering of TrueType makes use of basically the same subset of TT hint instructions as previous versions of ClearType, but uses y-direction greyscale and subpixel positioning.</p>
      <p>Then there's the new Metro greyscale subpixel rendering in Windows 8, which applies to some new applications and to the Metro UI. I'm not sure what this does if it encounters PS fonts, but my guess is that it applies the same model, since this renderer is an offshoot of the DWrite ClearType development.</p>
    html_clean: |-
