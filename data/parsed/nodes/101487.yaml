      <p><cite>At 1200 dpi, I would still expect hinting to improve things in terms of stem weight consistency and alignment at some sizes.</cite></p>
      <p>It is an interesting question, John. While not exactly the same technology, the old Linotron 202 was 960 "lines" per inch.  Stem weight &amp; alignment  was, in my eye, good enough.</p>
      <p>When imagesetters first came along, Dick Angstadt (one of the authors of the <cite>Glossary of Typesetting Terms</cite>) did some experimenting with various dpi outputs -- and in some cases, found that  1260 was "better" than 2400 dpi (<cite>GTS</cite>, page 76). This in terms of fattening up the fine lines of, say, Bembo.</p>
      <p>Not particularly to disagree, but to remind everyone that at some level, we get down to ink on paper -- what shows, what doesn't. And in evaluating what shows, at some level, what's "better" should be judged, in its entirety, by the human eye.</p>
