      <p>I'm sorry you don't understand, David. Let me explain. :)</p>
      <p>Stroke density refers to the intensity of blackness (presuming nominally black text) independent of stroke thickness. In good quality print and in b/w pixel rendering, stroke density is consistent, i.e. it doesn't matter whether one is looking at a thick stem or a hairline stoke, the density of the black is the same. And since one of the few things we know absolutely about reading is that strong contrast between figure and ground is important, it follows that stroke density is important to reading. If strokes are greying out, then contrast is being lost, and hence reading conditions are suboptimal.</p>
      <p>From your comments here and elsewhere, you appear to be judging how good fonts 'look' on different platforms relative to how closely they match the colour (heaviness of texture) of print, which is a reasonable criterion if one of the things you are trying to achieve is a kind of parity between print and web editions of a publication. It's a criterion that is independent of and may be at odds with criteria related to readability on screen, given that comparative text colour doesn't imply anything about stroke density of bits and pieces of individual glyphs.</p>
