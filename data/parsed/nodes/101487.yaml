      <p>I'm sorry you don't understand, David. Let me explain. :)</p>
      <p>Stroke density refers to the intensity of blackness (presuming nominally black text) independent of stroke thickness. In good quality print and in b/w pixel rendering, stroke density is consistent, i.e. it doesn't matter whether one is looking at a thick stem or a hairline stoke, the density of the black is the same. And since one of the few things we know absolutely about reading is that strong contrast between figure and ground is important, it follows that stroke density is important to reading. If strokes are greying out, then contrast is being lost, and hence reading conditions are suboptimal.</p>
      <p>From your comments here and elsewhere, you appear to be judging how good fonts 'look' on different platforms relative to how closely they match the colour (heaviness of texture) of print, which is a reasonable criterion if one of the things you are trying to achieve is a kind of parity between print and web editions of a publication. It's a criterion that is independent of and may be at odds with criteria related to readability on screen, given that comparative text colour doesn't imply anything about stroke density of bits and pieces of individual glyphs.</p>
      <p>I say Microsoft are more concerned about stroke density than Apple because they have deliberately made their ClearType rendering model retain intensity where Apple allows theirs to grey out. This is simply an observation: in Apple rendering horizontal bars regularly grey out, while in Microsoft rendering they remain good and dark.</p>
      <p>Now, with regard to stroke density vs hinting, these are not necessarily directly related, since it would be possible to manage stroke density at the rendering level without hinting if one had a sufficiently good means of analysing glyph shape. For example, Apple have demonstrated that they are able to get pretty good stroke density at key alignment zones (baseline, x-height and cap height), but they fail when horizontals do not fall at these alignments, and after many years they show no sign of caring to solve this problem. [Note that I am not even bothering to get into the effect of Apple rendering on a variety of non-Latin scripts that involve many horizontal strokes at non-standard heights. The claim that 'All fonts look better on the Mac' doesn't stand up to non-Latin scrutiny.] While stroke density needn't rely on hinting, Microsoft decided that they would make use of hinting information to help them retain stroke density, and this is demonstrated by what happens in DWrite's y-direction antialiasing if one compares fonts with hinting and fonts without.</p>
      <p>Finally, here is the Brill PS font rendered with DWrite in Internet Explorer at the same size as in your comparison above. I agree that the comparative-to-print colour of the Mac rendering is overall closer -- although terribly inconsistent at the level of individual glyphs --, but I don't think that is an important criterion when it comes to reading on screen. The DWrite rendering is sharper and the letter shapes more clearly defined (less fuzz) -- note this also reflects my personal CT tuning preference, which is for sharper glyphs rather than heavier ones --; while lighter than the Mac rendering and hence less close to the print image it is more internally consistent in weight, and crucially, in my opinion, it is more consistent in stroke density (see enlargement).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DWriteMac_5029.png"></div><p></p>
      <p>If you have a nice long corridor leading away from your screen, try walking backwards and note how long the enlargement on the left continues to look like an <em>e</em> and the point at which the one on the right starts to look like a <em>c</em>.</p>
      <p>There are a few aspects of the DWrite rendering that I would expect to be different and better if the font were TrueType, notably the height of the middle horizontal of the uppercase B.</p>
