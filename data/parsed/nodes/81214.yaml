    <p>We are proud to announce the release of <strong><a href="http://sudtipos.com/fonts/147" rel="nofollow">Aventura</a></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophileaventura_6266.jpg"></div><p></p>
    <p><strong><a href="http://sudtipos.com/fonts/147" rel="nofollow">Aventura</a></strong> is burlesquely round, stylishly seductive, eternally sugar-fixed, and loving to a fault. Plenty of stylistic alternates are included to heighten the mood or soften it. Either way you look at it, there's a lot of love in the air.</p>
