    <p>I came across this sans a while back and haven't really been able to find it.<br>
    It's used for headlines in swedish Bon Magazine.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_6588.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/2_4388.png"></div><p></p>
    <p>It looks a bit like Neuzeit, as well as a Drescher Grotesk, but it's not quite there.<br>
    I'm sorry about the horrid picture quality, I'll try to pick up a copy and get some scans asap.</p>
    <p>Any ideas?</p>
    <p>Thanks in advance!</p>
    <p>-s</p>
