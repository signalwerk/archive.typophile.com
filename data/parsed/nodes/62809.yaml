      <p>Paul Flora published similar drawings in the 1970s in the German ZEIT magazine. They were published under the title "Vergebliche Worte": <a href="http://lccn.loc.gov/81201219" title="http://lccn.loc.gov/81201219">http://lccn.loc.gov/81201219</a><br>
      Here is one of the drawings, p.87: <a href="http://www.daily-ivy.de/2009/05/paul-flora/" title="http://www.daily-ivy.de/2009/05/paul-flora/">http://www.daily-ivy.de/2009/05/paul-flora/</a><br>
      The soil is made up of small block printing, which you can't see due to the poor quality.</p>
