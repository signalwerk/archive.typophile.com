  html: |-
    <p>Hi,</p>
    <p>I'm an artist and design student. I am currently showing a piece that explores the issue of language, using type to do so:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Erin_Kendig_Alphabet_Pile_web_5194.jpg"></div><p></p>
    <p>(details)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/word-pile-newer-LRG-detail_3687.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/word-pile-mountains_newer_4337.jpg"></div><p></p>
    <p>Thought some of you might enjoy this.</p>
    <p>I'm showing the piece at Soil (<a href="http://www.soilart.org" title="http://www.soilart.org">http://www.soilart.org</a>) an artist-run gallery in Seattle, Washington. If you are in the Seattle area, stop on by.</p>
    <p>And thanks to all of you for all the wonderful knowledge you bring to this great resource!</p>
    <p>Erin Kendig<br>
    <a href="http://www.littleredgirl.com" title="www.littleredgirl.com">www.littleredgirl.com</a></p>
