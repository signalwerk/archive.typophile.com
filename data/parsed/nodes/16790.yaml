  html: |-
    <p>Hi everyone@typophile,</p>
    <p>I was asked recently by a good friend of mine to determine the typeface in 'christian Dior' (see attached image).</p>
    <p>And I couldn't find it. I searched in my typefinder, and online but nowhere I could find it.</p>
    <p>I've got the impression that it might be a recent design or custom made; But it is a beautiful face; notice the strange 'a'.</p>
    <p>I found something that came nearby like 'cochin'&amp;'sabon'. </p>
    <p>Has anybody an idea who designed this font, or where to find it for purchase.</p>
    <p>thanks!!!</p>
    <p>;-)  Zoë</p>
