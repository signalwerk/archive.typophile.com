  html: |-
    <p>I'm trying to code my opentype features in the most efficient way, but not sure about what order they need to go in.</p>
    <p>Here's what I'm trying to achieve using dlig and salt.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/opentypeligs_6336.jpg"></div><p></p>
    <p>The first line is what appears by default, using just <code>liga</code>. The f has a slightly shorter hood.</p>
    <p>Second, the only difference is the descender, this should be a stylistic set.</p>
    <p>Third, using <code>dlig</code>, the crossbar or hood joins onto the next glyph.</p>
    <p>Fourth, if we want descending and joining ligatures, we can apply the stylistic set and the <code>dlig</code> feature.</p>
    <p>Codewise:</p>
    <p><code>liga</code><br>
    #something like<br>
    sub f'f' by ff; #where ff is a tweaked composite of two fs.<br>
    #etc for other ligs</p>
    <p><code>ss01</code><br>
    #sub f' [b f h i j k l t] by f.alt; #where f.alt is the descending version.<br>
    #plus some other substition to fix the double f ligs.</p>
    <p><code>dlig</code><br>
    sub f' f' by f_f; #where f_f is the connected variant<br>
    #etc for other ligs</p>
    <p>Now where do I stick the code that applies when both ss01 and dlig are applied? In both features? Is my code really messy?</p>
