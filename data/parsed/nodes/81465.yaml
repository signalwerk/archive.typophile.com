      <p>Sure Cristobal. Here we go. It's messy tho' ;)</p>
      <p>feature liga {#this tweaks glyphs for better fit. Should perhaps be calt rather than liga<br>
         sub f f f by fff;<br>
         sub f' f' [igrave icircumflex idieresis itilde imacron ibreve jcircumflex uni0209 uni020B uni01D0 uni1E2F uni1EC9] by f_f.short;<br>
         sub f' [igrave icircumflex idieresis itilde imacron ibreve jcircumflex uni0209 uni020B uni01D0 uni1E2F uni1EC9] by f.short;<br>
         sub f f by ff; #standard ligs for backward compatability. Small tweaks to shapes<br>
         sub f i by fi;<br>
         sub f l by fl;<br>
         } liga;</p>
      <p>feature dlig {#this joins up the ligatures and there are lots of them. I may move some to hlig<br>
        sub c b by c_b;<br>
        sub c h by c_h;<br>
        sub c i by c_i;<br>
        sub c k by c_k;<br>
        sub c l by c_l;<br>
        sub c t by c_t;<br>
        sub f f b by f_f_b;<br>
