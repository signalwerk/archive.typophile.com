    html: |-
      <p>For something like this, my inclination is usually to do the stylistic variation first, and then the ligation. Since your ligatures seem to be all variants on the common f-ligature, I don't think 'dlig' is appropriate. I would use 'ss01' and 'liga', in that order. In other words, the input for the 'liga' feature will include output forms from the 'ss01' feature, e.g.</p>
      <p>'ss01'<br>
      f -&gt; f.ss01<br>
      ...</p>
      <p>'liga'<br>
      f f -&gt; f_f<br>
      f.ss01 f.ss01 -&gt; f_f.ss01<br>
      ...</p>
      <p>What you should consider is what behaviour would be appropriate if a user has turned on 'ss01' for only part of a ligating sequence, i.e. what should happen in 'liga' if the input sequence is</p>
      <p>f f.ss01</p>
      <p>or</p>
      <p>f.ss01 f</p>
