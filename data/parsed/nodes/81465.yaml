        sub f f i by f_f_i;<br>
        sub ff i by f_f_i;<br>
        sub f f j by f_f_j;<br>
        sub ff j by f_f_j;<br>
        sub f f k by f_f_k;<br>
        sub ff k by f_f_k;<br>
        sub f f l by f_f_l;<br>
        sub ff l by f_f_l;<br>
        sub f f t by f_f_t;<br>
        sub ff t by f_f_t;<br>
        sub f b by f_b;<br>
        sub ff by f_f.alt;<br>
        sub f f by f_f.alt;<br>
        sub f h by f_h;<br>
        sub f i by f_i.alt;<br>
        sub fi by f_i.alt;<br>
        sub f j by f_j;<br>
        sub f k by f_k;<br>
        sub f l by f_l.alt;<br>
        sub fl by f_l.alt;<br>
        sub f thorn by f_thorn;<br>
        sub f t by f_t;<br>
        sub g h by g_h;<br>
        sub g i by g_i;<br>
        sub g j by g_j;<br>
        sub g l by g_l;<br>
        sub g thorn by g_thorn;<br>
        sub i t by i_t;<br>
        sub j t by j_t;<br>
        sub o h by o_h;<br>
        sub o k by o_k;<br>
        sub o l by o_l;<br>
        sub p h by p_h;<br>
        sub p i by p_i;<br>
        sub p l by p_l;<br>
        sub p p by p_p;<br>
        sub s b by s_b;<br>
        sub s h by s_h;<br>
        sub s i by s_i;<br>
        sub s k by s_k;<br>
        sub s l by s_l;<br>
        sub s p l by s_p_l;<br>
        sub s p by s_p;<br>
        sub s thorn by s_thorn;<br>
        sub s t by s_t;<br>
        sub T h by T_h;<br>
        sub t t by t_t;<br>
        } dlig;</p>
      <p>feature ss02 {#descending f<br>
        #non connected<br>
         sub f f f by fff.001;<br>
         sub fff by fff.001;<br>
         sub f' f' [igrave icircumflex idieresis itilde imacron ibreve jcircumflex uni0209 uni020B uni01D0 uni1E2F uni1EC9] by f_f.short.001;<br>
         sub f' f' [b f h i j k l t thorn] by ff.001;<br>
         sub f' [igrave icircumflex idieresis itilde imacron ibreve jcircumflex uni0209 uni020B uni01D0 uni1E2F uni1EC9] by f.short.001;<br>
         sub f' [b h i j k l t thorn] by f.alt;<br>
         sub ff by ff.001;<br>
         sub fi by fi.001;<br>
         sub fl by fl.001;<br>
         sub f f by ff.001;<br>
        #and for the connected ligatures<br>
         sub f_b by f_b.001;<br>
         sub f_f.alt by f_f.001;<br>
         sub f_f_b by f_f_b.001;<br>
         sub f_f_f by f_f_f.001;<br>
         sub f_f_h by f_f_h.001;<br>
         sub f_f_i by f_f_i.001;<br>
         sub f_f_j by f_f_j.001;<br>
         sub f_f_k by f_f_k.001;<br>
