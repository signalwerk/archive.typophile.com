    <p>Hello all,</p>
    <p>I am wondering whether there is a good way to access "Stylistic Sets" in Illustrator when using OT fonts? As of now, i have to manually replace characters using the Glyph palette or use Indesign to set the text and then import into Illustrator. Not ideal.</p>
    <p>Thanks in advance,</p>
    <p>Seb</p>
