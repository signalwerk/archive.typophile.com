      <div class="comment-spam-body"><p>This version of Madame is well made but I find it awkward to use.<br>
      It seems to have been designed for the era when printers had severe memory limitations.<br>
      Out of curiosity I assembled the parts into complete letters about a decade ago and tested them on a basic laser printer. Worked fine.<br>
      BTW, Madame has far fewer points than any of the ornamented fonts mentioned in this thread.<br>
      Don</p>
      </div>
