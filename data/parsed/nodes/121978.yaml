      <p>There are a few digitalisation of the genre, mostly “free fonts”, usually not of the best quality, as you already noticed.<br>
      <a href="http://moorstation.org/typoasis/designers/steffmann/samples/l/lettres.htm" title="http://moorstation.org/typoasis/designers/steffmann/samples/l/lettres.htm">http://moorstation.org/typoasis/designers/steffmann/samples/l/lettres.htm</a><br>
      <a href="http://moorstation.org/typoasis/designers/westwind/exotica.htm" title="http://moorstation.org/typoasis/designers/westwind/exotica.htm">http://moorstation.org/typoasis/designers/westwind/exotica.htm</a><br>
      (I can’t find an oblique version)</p>
      <p>Looking at past threads (<a href="http://typophile.com/node/67020" title="http://typophile.com/node/67020">http://typophile.com/node/67020</a> <a href="http://typophile.com/node/42149" title="http://typophile.com/node/42149">http://typophile.com/node/42149</a> <a href="http://typophile.com/node/73447" title="http://typophile.com/node/73447">http://typophile.com/node/73447</a> <a href="http://www.typophile.com/node/106599" title="http://www.typophile.com/node/106599">http://www.typophile.com/node/106599</a>) it seems that one still can acquire it in metal and there are at least two commercial releases:<br>
      <a href="http://www.myfonts.com/fonts/celebrity/parisian-ornamentals/" title="http://www.myfonts.com/fonts/celebrity/parisian-ornamentals/">http://www.myfonts.com/fonts/celebrity/parisian-ornamentals/</a><br>
      <a href="http://www.myfonts.com/fonts/wiescherdesign/fleurons-initials/" title="http://www.myfonts.com/fonts/wiescherdesign/fleurons-initials/">http://www.myfonts.com/fonts/wiescherdesign/fleurons-initials/</a> (this one is a less textured version)<br>
      The fact that they’re commercial doesn’t automatically guarantee a better quality.</p>
      <p>With the recent popularity of chromatic fonts and the efforts to fill the gaps in the Dan X. Solo’s collections, there could be some new offering somewhere too.</p>
