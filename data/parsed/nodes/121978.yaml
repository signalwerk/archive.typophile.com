      <p>That's interesting. I can see why there hasn't been a better version of these ornate fonts available yet.<br>
      I guess these type of fonts would be best to be done as layered typefaces? These would probably split the type into several fonts but the point would probably be a lot lower in this case?</p>
      <p>I am not a typeface designer so I am not sure all the technical details but it seems layered fonts are popular nowadays?....</p>
