    html: |-
      <div class="comment-spam-body"><p>Too many points is the problem with making any of these elaborate ornamented fonts.<br>
      About half a decade ago I took a stab at making a well engineered version of Lettres Ornées with the minimum number of points. I got as far as doing part of the letter _E_<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LettresOrnées1_6253.jpg"></div> <div class="imageWrap"><img src="http://typophile.com/files/LettresOrnées3_6382.jpg"></div><br>
      At the rate I was going it would have taken an incredible amount of time to do the full alphabet!<br>
      So I threw in the towel. A project for somebody with lots of time on their hands!<br>
      Which probably explains why we are stuck with mega-point digital versions that sometimes seize up during viewing and fail in printing.<br>
      Don<p></p>
      </div>
