    html: <p>I'm torn Miguel. This bold is very nice. I really like it, but if I were to use it in conjunction with Garadot, I'd like it to have a few more of the same quirks. Maybe you can solve that with alternates. Or a different face Sans Old and Sans Bold Old. Haha. Sorry bad joke. Anyway. The -- a b d e f q t v w y -- seem too soft, too round.  The eye on the -- e -- seems too large, and the eye on the -- a -- seems too small. The changes you did make, however, I do like those chars more. But, the -- X Y -- seem to have long necks or something. I still think you need oldstyle figs too. I wouldn't necessarily get rid of the chars I would give alternates though. The -- R -- you could give it a florentine or etruscan tail to solve the tail sticking out too far?? Or just reduce the angle a hair. The -- W -- seems too wide. Maybe you ... hmm ... in your roman sans you don't have a crossed -- W -- well somehow these two shapes should correspond, no? I can't choose between color. I like them both.  But again, Miguel, I think you are on to something. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
