  date_raw: 15 Jan 2003 — 10:25pm
  votes: null
  html: <p>This new Typeface is based on Garamond and his respective versions, so my proposal is to make a text font who keep the feeling of the Universal Roman Classics more than make another revival (I am thinking in made this font to my portfolio website) because the limit of the minimal size on this roman fonts are blured on screen.  <br> <br>Please Critique this kind of revival, and the size of the pixel em square, the idea is that works on a high resolution screens, i guess that in standard 800 x 600 is too big for been a text face, so it works better as a title/display font. <br> <br>MH <br> <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/4452.gif" alt=""></p>
  html_clean: <p>This new Typeface is based on Garamond and his respective versions, so my proposal is to make a text font who keep the feeling of the Universal Roman Classics more than make another revival (I am thinking in made this font to my portfolio website) because the limit of the minimal size on this roman fonts are blured on screen.  <br> <br>Please Critique this kind of revival, and the size of the pixel em square, the idea is that works on a high resolution screens, i guess that in standard 800 x 600 is too big for been a text face, so it works better as a title/display font. <br> <br>MH <br> <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/4452.gif" alt=""></p>
