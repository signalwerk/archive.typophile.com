    date_raw: 16 Jan 2003 — 8:54pm
    votes: null
    html: <p>The bowl on the UC 'R' is too large. I hate to be a broken record and I beg your forgiveness, but the serif is still too exaggerated on the lc 'a' --- look at <a href="http://www.psymon.com/incunabula/masterpieces/fine1.html" target="_blank"> this!</a> A couple years late, but still right in the middle of it. It isn't a very good reproduction either. Check <a href="http://www.bium.univ-paris5.fr/expo/table_ill_chro1.htm" target="_blank"> these</a> out too. The Ruel, Hery, the Galien. Look at the UC 'R', the way the leg extends and curves, like your 'Q'. Also notice that the cap height is below that of the ascenders, thus exaggerating the length.   <br>  <br>The double r, well though odd, I have to say it is only thus because (a) I don't use them and (b) I'm so tired.</p>
    html_clean: <p>The bowl on the UC 'R' is too large. I hate to be a broken record and I beg your forgiveness, but the serif is still too exaggerated on the lc 'a' --- look at <a href="http://www.psymon.com/incunabula/masterpieces/fine1.html" target="_blank" class="link-external"> this!</a> A couple years late, but still right in the middle of it. It isn't a very good reproduction either. Check <a href="http://www.bium.univ-paris5.fr/expo/table_ill_chro1.htm" target="_blank" class="link-external"> these</a> out too. The Ruel, Hery, the Galien. Look at the UC 'R', the way the leg extends and curves, like your 'Q'. Also notice that the cap height is below that of the ascenders, thus exaggerating the length.   <br>  <br>The double r, well though odd, I have to say it is only thus because (a) I don't use them and (b) I'm so tired.</p>
