  html: |-
    <p>Has someone of you ever heard about an old lead type called Renaissance-Grotesk?<br>
    Its a condensed Grotesk.<br>
    This was the name on the label of the case.<br>
    I’m not sure if its right.<br>
    For my opinion, better: feeling, there is a logical break between Rennaissance and a Grotesk font, isn’t it?</p>
    <p>Georg</p>
