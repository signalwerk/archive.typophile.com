      <p>As for your sans, there are several fonts that were available in 1970 that might fit. For example Monotype Grotesque, available since 1926. Digital as Classic Grotesque <a href="http://www.myfonts.com/fonts/linotype/classic-grotesque-pro/" title="http://www.myfonts.com/fonts/linotype/classic-grotesque-pro/">http://www.myfonts.com/fonts/linotype/classic-grotesque-pro/</a><br>
      Don</p>
