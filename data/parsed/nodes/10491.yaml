    date_raw: null
    votes: null
    html: <p>Helvetica and Times both significant glyph variations between the normal and bold weights; the former in particular glyphs most notably 'a', the latter in the entire oldstyle vs modern shape category. This kind of thing wreaks havoc with simple linear interpolation. It will be interesting to see how, ahem, Macromedia (right?) deals with this. <br> <br>Another possible interpretation (cue spooky music) is that putting renewed emphasis (npi) on MM fonts is a symbol of independence from Microsoft. My understanding is that MM is effectively an optional part of the OT spec, and that MS's renderer doesn't deal with it.</p>
