    html: <p>MM technology is not an optional of the OT spec. It was removed from the spec over the objections of Adobe and most designers. <br> <br>MS's renderer doesn't deal with MMs? Just drop one into your Windows font folder and see the instances appear in your menu. <br> <br>I agree that it is unfruitful to MM-ify either Times or Helvetica unless they are substantially redesigned. Nevertheless, we will see someone's interpretation in a surprising place quite soon.</p>
