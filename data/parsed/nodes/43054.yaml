    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 11.Mar.2008 3.03pm </div>
      <p>Redmond, WA - 11 March 2008</p>
    <p>The Business of Type</p>
    <p>The Microsoft Typography group is pleased to host the first Font Business Summit organized by the <a href="http://www.fdrc.org/">Font Designers Rights Coalition</a>. The event takes place on the 3rd and 4th of April at Microsoft’s campus in Redmond, WA.</p>
    <p>The event is open to type designers and foundries (by invitation). If you have not been contacted about the event and would like to attend please contact Janet [at] fdrc [dot] org as soon as possible as there are only a handful of open slots available.</p>
    <p>The program includes in-depth analysis of font related law from noted attorney <a href="http://www.stackfilpi.com/attorneyprofiles.htm">Paul Stack</a> who has represented Monotype for many years.</p>
    <p>In addition there will be panel discussion regarding font IP protection, analysis of the state of font embedding, font EULAs and an exploration of new font related technologies, with participation from Adobe, Bitstream, Monotype Imaging, Microsoft and others.</p>
    <p>Details… <a href="http://www.microsoft.com/typography/links/news.aspx?NID=6121" title="http://www.microsoft.com/typography/links/news.aspx?NID=6121">http://www.microsoft.com/typography/links/news.aspx?NID=6121</a></p>
    <p>Contact Janet for more information<br>
    janet [at] fdrc [dot] org</p>
