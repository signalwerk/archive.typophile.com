    html: |-
      <p>Hi Hrant, </p>
      <p>Here's a link to a document showing the original:<br>
      <a href="http://rpgcharacters.files.wordpress.com/2010/12/dysons_delve.pdf" title="http://rpgcharacters.files.wordpress.com/2010/12/dysons_delve.pdf">http://rpgcharacters.files.wordpress.com/2010/12/dysons_delve.pdf</a><br>
      The font in question is the one used for the title and section headers. </p>
      <p>The font that's "so close" is shiver_me_timbers, created by Nick Curtis.<br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/shiver-me-timbers-nf/" title="http://www.myfonts.com/fonts/nicksfonts/shiver-me-timbers-nf/">http://www.myfonts.com/fonts/nicksfonts/shiver-me-timbers-nf/</a></p>
      <p>As you can probably see, the "T" in the pdf document is in line with the rest of the characters and has a drop on the right side of the glyph.  In the SMT font, the "T" is taller than the other characters and flips upwards on the right hand side of the crossbar.  </p>
      <p>Thanks in advance,<br>
      Brennan</p>
