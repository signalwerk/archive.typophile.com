    date: 2012-04-04T08:45:00
    date_raw: 4 Apr 2012 — 8:45am
    votes: null
    html: <p>For a one-off project, the easiest way to accomplish what you want is to convert the font to outlines in a drawing program and fiddle with the T until it looks like you want. If you attempt to modify the font itself—which, under my EULA is permitted if the modification is solely for your personal use—you will also have to modify the kerning for the font, which is based on the T looking exactly as it does.</p>
