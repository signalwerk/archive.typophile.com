    <p>Hi all, </p>
    <p>I'm working on a personal project for a role playing game.  The work isn't going to be resold, but I want a specific look and feel.  I found a font I like a lot, and was able to purchase a font that's very very similar in all but one (annoying) way.  The "T" in the font I purchased is larger than "T" in the original font.  </p>
    <p>I'm comfortable (though no expert) in several drawing programs, so I found a 30 day trial of Glyph for my mac and tried to make the modifications -- but frankly the software isn't something I'm comfortable with.  I tried (unsuccessfully) to find a contact method for the font's creator, but struck out there too.  I was wondering if someone could help me out by making the modifications for me?  I don't want to violate copyrights or anything like that -- I just know what I want and this is so close, but for this one thing.  I can provide an image of what I would like it to look like, and I'd be happy to buy you a copy of the font for your own collection.  Is this something someone could help me with? </p>
    <p>Thanks so much in advance,<br>
    Brennan</p>
