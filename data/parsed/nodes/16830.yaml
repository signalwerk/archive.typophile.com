    <p>I'm currently writing up my PhD thesis in LaTeX, and I'm trying to get away from the almost clichéd, boring academic look that always makes my eyes glaze over; I've tried to develop an interesting style for the layout.  I'd like to know if you think that the overall style works or if there are any aspects that could be improved:</p>
    <p><a href="http://www.cis.strath.ac.uk/~jg/extr.pdf" rel="nofollow">Click for PDF extract (ignore the half-written content!)</a></p>
    <p>Thanks</p>
