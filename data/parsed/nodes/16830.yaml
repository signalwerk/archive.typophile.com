      <p>I think you're pretty much there. The only comment I have concerns your figures; specifically, the text on the figures. I'm not certain how they were created, but it appears that they may have been scaled to different degrees. For example, the caption "occurrences" in figure 6.2 is significantly smaller than the fonts in figure 6.4.</p>
      <p>From examining your pdf file, it looks like you're usiing a DVI-&gt; PS-&gt; PDF workflow, so I'll guess you're using .eps files for the figures. You might want to check out the PSfrag package, which allows you to easily replace the text in your figures with LaTeX-generated text. It's an easy way to make the fonts in the figures consistent with each other. You can find PSfrag <a href="http://www.ctan.org/tex-archive/macros/latex/contrib/psfrag" rel="nofollow">here</a>.</p>
      <p>Steven</p>
