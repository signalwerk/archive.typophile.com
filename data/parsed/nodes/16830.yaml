      <p>I'm now coming to the end of my thesis writeup and I thought I'd give you an update on how the design is coming along.  It's evolved a lot in the past few months, hopefully for the better.  The latest version can be seen below:</p>
      <ul>
      <li><a href="http://www.cis.strath.ac.uk/~jg/thesis/extract-chapter6-tp.pdf" rel="nofollow">Revision 5</a></li>
      <li><a href="http://www.cis.strath.ac.uk/~jg/thesis/toc-tp.pdf" rel="nofollow">Table of Contents</a></li>
      </ul>
      <p>I've given up on trying to get a new typeface for the headings.  I had planned on using <a href="http://www.myfonts.com/fonts/bitstream/humanist-521/" rel="nofollow">Humanist 521</a> in LaTeX, but I spent about 15 hours in total trying to get it to work and just could not do it.  I've read so many guides and tried so many scripts and have not found a method that works.</p>
      <p>If there are any comments on these new revisions then I'd be very interested in hearing them.  The generous help I've had so far has been superb, and definitely deserves a mention in the acknowledgements section of my thesis.</p>
      <p>Once again, many thanks for your help,</p>
      <p>Jonathan</p>
