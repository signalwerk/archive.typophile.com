    html: |-
      <p>Still better! Converting and preparing fonts for use with LaTeX is not the easiest thing to do, although you could use fontinst from the command line (depending on your TeX distribution). The crucial point in using correct small caps are the .map and .fd files for the fonts you are using. But the Avantgarde Demi that is published with teTeX does not have proper small caps (see adobe.map somewhere in your TeX tree). So probably it's best to stick to the current status.<br>
      One thing that I personally would reconsider is using a line under the header. Perhaps it would be enough to have the Header typeset in a different font style and size than the main text. Do you need the rule? Using the fancyhdr package that would be: <code>\pagestyle{fancy}<br>
      \renewcommand{\headrulewidth}{0pt}</code><br>
      Ad hardcopy: Take a printout of your sample pages and stick it into a similar PhD thesis from the next university library to get an impression! ;)<br>
      Good luck!</p>
    html_clean: |-
