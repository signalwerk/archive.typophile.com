      <p>Yes, I've now come to hate LaTeX and installing fonts.  It really does not seem the most intuitive thing for LaTeX non-experts like me.  I have tried several guides on how to convert a TTF file to use in LaTeX, but I get halfway through and then something doesn't work, or a file is not created or something else.  It seems that many of the guides (and the tools) were written many years ago, and are no longer applicable.  Another factor is that I don't have write access to the systemwide TeX tree (and haven't really got the time to figure out how to do a custom one and adapt the guides to install into it).  I would probably go mad if I were to persue it further...  Suffice it to say that I'm actually growing more fond of it in normal caps now.</p>
      <p>I'll experiment and try it without the header rule.  I actually added it because I preferred it with an older version that I had - Maybe things have changed now though after all the helpful advice I've received.</p>
      <p>Thanks,</p>
      <p>Jonathan</p>
