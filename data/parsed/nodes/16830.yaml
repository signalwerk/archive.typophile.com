    html: <p>Overall, I think your layout is good, nice and clean. I would probably move the page numbers down to the lower right hand corner (for right hand pages, left corner for left pages), or maybe put them up above, with the page title? That would give you a bit more room at the bottom of the page. I think some "fresher" type choices would help a lot. Are you using Futura and Times? I did notice that the Futura you used is not a true small caps (don't know if there's a Futura that has true small caps...) So, that is one thing that looks odd to me, because the "small cap" characters are thinner. I think there are a number of other people that have asked for type suggestions for their thesis, just do a search and you'll find some good options...</p>
