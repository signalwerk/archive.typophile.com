      <p>There lies much work in customizing a LaTeX document to that extent. One question, though: Why are the headers so far to the right – why not stick to the margin of the main text? Perhaps they would also look clearer if they wouldn't be using CAPS. I think the fancyhdr package or something similar offers options for that.<br>
      Regarding the page number issue: an empty page on the left side when the thesis is printed and bound may also balance a non-centered pagemark.<br>
      The overall appearance is clear and much better than average layouts for academic stuff I have seen so far. Good luck!</p>
