      <p>One of the problems is the very specific guidelines that are laid down for the layout.  There must be a 40mm margin at the bottom of the page, so that space looks very odd if the page number isn't there.  I've tried moving the page number to the bottom-right, but I feel that it looks unbalanced - pages must be printed right-side only, and there are no left pages to balance it out.</p>
      <p>It's actually Avante Garde Demi, not Futura.  You're right though, the small caps do look a bit odd now you mention it.  I'll try to either find a typeface with true small caps or use normal text.  Getting typefaces (other than the default) to work in LaTeX is not an easy task though, hence the use of Times (as opposed to Computer Modern).  If you do happen to have any suggestions for typefaces for body text in a technical document then let me know.</p>
