    <div class="imageWrap"><img src="http://typophile.com/files/Neris-18_3829.png"></div><p></p>
    <p>Not so long ago I made a thread asking to identify something like <a class="freelinking external" href="http://cl.ly/MHfV" rel="nofollow">this</a>. But it was just me looking for analogues early in the work progress. Although recently I've found very similar <a class="freelinking external" href="http://www.myfonts.com/fonts/moretype/rehn/" rel="nofollow">one</a>, but it was already too late to quit.</p>
    <p>I intended this for a paragraph-length copy. Quotes, openings etc. Originally it was an upright italic, but everything changed except /e slanted crossbar.  2 Masters, (prob.) 5 weights, Multilatin, Expanded Cyrillic. My first font being made with Glyphs. It's awesome.  Won't be going back to FontLab. </p>
    <p>Neris is a name of a river that goes through my city.</p>
