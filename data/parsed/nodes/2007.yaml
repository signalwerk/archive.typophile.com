    html: <p>Judging from the number of replies (1 private, but on the wrong track) I conclude that this is not a common problem. After several days of trying everything I could think of, I was finally able to generate the fonts from FL without getting errors in Font Reserve. <br> <br>Although I don't fully understand why, it has something to do with using a non-standard UPM (1008), importing such fonts from FOG-generated Mac PostScript Type 1 format into FL and then exporting as Mac TrueType. On import, FL scales the font down to a UPM of 1000 (and no way that I could find to tell it to do otherwise). Somehow, this affects the resulting Mac TT font in a way that in certain cases causes Font Reserve to freak out, even though the fonts work otherwise (and even get a clean bill of health from Font Doctor!). <br> <br>The method that works is to import FOG-generated Mac TrueType fonts instead of Type 1. For some reason, the kerning tables are missing from the FOG TT fonts (perhaps explaining the problem between them and Adobe apps), so those have to be imported separately. <br> <br>The resulting Mac TT fonts generated by FL work beautifully now and play nice with both Font Reserve and Adobe apps.</p>
