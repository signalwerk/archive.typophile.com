      <div class="comment-spam-body"><p>For a substitute I would use Ambassador Script </p><div class="imageWrap"><img src="http://typophile.com/files/AmbasadorScriptAsEnza_3676.jpg"></div> <a href="http://www.myfonts.com/fonts/canadatype/ambassador-script/" title="http://www.myfonts.com/fonts/canadatype/ambassador-script/">http://www.myfonts.com/fonts/canadatype/ambassador-script/</a> a digital version of Aldo Novarese's “tipo inglese” Juliet typeface. Note the more upright stance is a better match than the inclination of the other scripts mentioned. Clip off some of the flourishing and its fairly close to your card. It even has the crossed _z_ used in your presumably Italian -- based on the phrase _Enza e Franco_ and the word _Via_ -- Business card.<br>
      Don<p></p>
      </div>
