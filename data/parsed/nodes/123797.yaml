    html: |-
      <div class="comment-spam-body"><p>I should have mentioned that most of the old business and other cards I see in this forum are engraved or lithographed rather than a typeface.<br>
      Looking at the lack of connecting lines, which are easy to do in engraving and lithography, I believe that this is probably a metal jobbing font for letterpress work on cards.<br>
      In my opinion it is either a simplified Juliet or a font created with the same idea of making a version of English script that would be robust enough to stand up to letterpress printing of cards. Typefaces with hairline connections were notoriously fragile and it made sense to omit them whenever possible.<br>
      Don</p>
      </div>
