      <p>Where do you see the difficulties in 10pt? Print of web? Interstate isn’t all too bad in print, e.g. the normal light should work alright. <a href="http://www.fontbureau.com/media/pdf/Interstate.pdf" title="http://www.fontbureau.com/media/pdf/Interstate.pdf">http://www.fontbureau.com/media/pdf/Interstate.pdf</a></p>
      <p>Combining two sans serif typefaces is always difficult. Could look a little itchy if you paired Interstate with a humanist sans, but maybe Frutiger works, try it. Those are supposed to be the the most readable. If you need a typeface which works well on the web, too, try Benton Sans. There is a special version called Benton Sans RE especially designed for small sizes.<br>
      <a href="http://www.webtype.com/catalog/?tssans=693&amp;wssmall=829&amp;wsmedium=866&amp;foundryfb=35" title="http://www.webtype.com/catalog/?tssans=693&amp;wssmall=829&amp;wsmedium=866&amp;foundryfb=35">http://www.webtype.com/catalog/?tssans=693&amp;wssmall=829&amp;wsmedium=866&amp;foun...</a></p>
    html_clean: |-
