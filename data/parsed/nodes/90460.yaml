  html: |-
    <p>Hello Typophiles!</p>
    <p>Can anyone out there recommend a complimentary san-serif that will work as copy text alongside headings(Interstate). Suitable for print &amp; web.</p>
    <p>Interstate is also the typeface used in the logotype(related to this project) however I'm having some legibility issues with the typeface used as copy at small sizes (10pt) </p>
    <p>I love interstate however think it loses it's character at small sizes</p>
    <p>Thanking you in advance.</p>
