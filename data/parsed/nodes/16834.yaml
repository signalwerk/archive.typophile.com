    <p>Lions Gate Films has replaced their old ugly stacked LGF logo with a new logo that looks to be a Frankenstein mishmash of Gill Sans and Avant Garde (and what's up with that E?). How hard would it have been to stick with one font?</p>
    <p>Old:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lgf_old.jpg"></div><p></p>
    <p>New:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lg_new.jpg"></div><p></p>
