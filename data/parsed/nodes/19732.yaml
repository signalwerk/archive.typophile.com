    html: <p>The original was a predigital VGC typeface called Ingrid (by Markus J Low, I believe). I have Chaucer and I think that it is a copy of the old Fontbank (defunct) version of Ingrid, which they called <a href="http://www.buyfonts.com/value_for_money/ingenius.htm" target="_blank" rel="nofollow">Ingenius</a> - but with much better letterspacing.</p>
