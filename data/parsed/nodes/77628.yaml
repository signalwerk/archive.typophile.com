      <p>AFAIK it can’t be done, but there are some nice tricks that can fake it pretty well. It is a recurring question here on Typophile (seems that a lot of people wants to do something like that, myself included). You can start your search by googling something like</p>
      <p><code>site:typophile.com random opentype</code></p>
      <p>Good luck!</p>
