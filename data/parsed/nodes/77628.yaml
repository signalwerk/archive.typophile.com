  html: |-
    <p>I´m working on my first typeface. It is supposed to look as if cut out of paper. In order to improve the "handmade" look, I designed several  glyphs for each charakter. (You can see it on the example .png I uploaded. I searched a few days but didn´t find an answer to my question: is there a script that makes the font choose different glyphs for each charakter incidentally?<br>
    Until now, I have to pick every alternative glyph in the glyphs window in indesign, which is too time consuming, of course.<br>
    Any suggestions? If somebody doesn´t know the answer but knows where I could improve my knowledge about open type and python in general, this might help, too.<br>
    Thank you!</p>
