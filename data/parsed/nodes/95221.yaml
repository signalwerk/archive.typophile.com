    html: |-
      <p>People have used 4 1/2 points at times, but that type size is very small and hard to read. Where space is very much at a premium, one might consider 6 points, but even that is very small.</p>
      <p>But I don't see 8 points, or even 7 points, as overly small for certain elements of the design that properly should be in small printing. Those sizes are readable if printed normally.</p>
      <p>However, since 12 point type on a computer is usually 10 point type with generous leading, as what I've just said applies to actual physical lead type (remember it?) perhaps 9 point type - or 8 point - is the absolute minimum in your situation.</p>
