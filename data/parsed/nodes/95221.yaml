    html: |-
      <p>Courier is too thin for 6pt.<br>
      It’s thin, even at typewriter size.<br>
      You may want to increase tracking slightly with AG at 6 pt.</p>
      <p>You can go with smaller type size on a business card than other documents, because the type will be read in proportion to the document. However, “optical” size is still an issue.</p>
      <p>You can also go with smaller type size on stationery, because it’s the secondary matter on envelopes and letters. But again, optical size is an issue—the design should look as if it’s scaled for the real world, not something that was created by a designer working at 300% on a monitor.</p>
