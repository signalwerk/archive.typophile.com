    html: |-
      <p>@Nick Shinn:<br>
      <cite>Why are you even asking this question?</cite></p>
      <p>To me, it seems obvious why he is asking this question. He might produce a business card with six-point type on it, and it might look all right to him - but <em>other people</em> might find the small print impossible to read.</p>
      <p>So, either he tests his layout on a large number of other people - some who have vision problems or are elderly - or he tries to find out if there is an acknowledged standard in the industry that covers this concern.</p>
      <p>"I can read this" is not the same as "Nearly everyone will be able to read this".</p>
