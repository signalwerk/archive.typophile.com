      <p>Courier New has stems widths similar to Helvetica 35.<br>
      Mac Courier has stem widths between Helvetica 45 and 55, and would probably have enough heft at 7 pt, but you might be concerned about the counters of /m.</p>
      <p>Why are you even asking this question?<br>
      Why not just do a few layouts with your preferred typefaces at different sizes, and see which works best?</p>
