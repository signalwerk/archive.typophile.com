  html: |-
    <p>I'm interested in a combo that includes a basic set of pens or whatever, and a text that will take me from beginners' exercises to working on some serious letterforms before sending me out on my own. I've decided I want to get that sense of how the strokes go from thin to thick and vice versa.</p>
    <p>Oh, something I've been meaning to ask about ... I'm a lefty. Do I have to jump thru hoops figuring out the reverse of instructions from one of these books? Or is it just the same moves with the other hand?</p>
