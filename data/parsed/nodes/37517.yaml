      <p>Pilot Parallel are good starter pens (in fact pretty good full stop) since the nibs are created with two parallel plates, rather than a more recognisable nib, I would imagine they would suit a lefty as much as a righty.<br>
      <a href="http://www.studioartshop.com/acatalog/info_672_1.html" title="http://www.studioartshop.com/acatalog/info_672_1.html">http://www.studioartshop.com/acatalog/info_672_1.html</a></p>
      <p>It seems Rotring have dropped their lefthanded range, but there maybe something on ebay or in a dusty stockroom somewhere, the righthanded versions are lovely to use but a little sterile in the quality of their line, depends what you want from your calligraphy.<br>
      <a href="http://www.blotspens.co.uk/acatalog/Calligraphy_Rotring_Art_Pens_22.html" title="http://www.blotspens.co.uk/acatalog/Calligraphy_Rotring_Art_Pens_22.html">http://www.blotspens.co.uk/acatalog/Calligraphy_Rotring_Art_Pens_22.html</a></p>
      <p>Or there are specialist lefthanded sites – I don’t know about the quality of instruction and pens but they are written with the lefthanded in mind.<br>
      <a href="http://www.anythingleft-handed.co.uk/acatalog/master_class_calligraphy_set.html" title="http://www.anythingleft-handed.co.uk/acatalog/master_class_calligraphy_set.html">http://www.anythingleft-handed.co.uk/acatalog/master_class_calligraphy_s...</a></p>
      <p><a href="http://www.anythingleft-handed.co.uk/acatalog/left_hand_calligraphy.html" title="http://www.anythingleft-handed.co.uk/acatalog/left_hand_calligraphy.html">http://www.anythingleft-handed.co.uk/acatalog/left_hand_calligraphy.html</a></p>
      <p><a href="http://www.clas.co.uk/lefthanders.html" title="http://www.clas.co.uk/lefthanders.html">http://www.clas.co.uk/lefthanders.html</a></p>
      <p>By the way has anyone used a Yoropen? They look like fun, I am sure I saw a similar product designed for a competition by Seymour Powell.<br>
      <a href="http://www.yoropen.com/" title="http://www.yoropen.com/">http://www.yoropen.com/</a></p>
      <p>Tim</p>
