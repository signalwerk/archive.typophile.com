      <p>&gt; I would like to offer my customers the best information I can muster so that I can effectively design their signage with better knowledge.</p>
      <p>The best advice I can give is to look at what's used in your area for highway signage - then cite a study (a fictitious one works just as well as a real one) commissioned by the highway agency in researching the most legible solution. You could also quote the exorbitant cost of the study, the tab of which was picked up by the local tax-payers - ie. your customers.</p>
