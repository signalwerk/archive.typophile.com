  html: <p>Can you tell me if you've ever come across a definite design rule, that states whether CAPITAL  letters are more legible from a distance as opposed to Upper and Lower Case letters used in conjunction with each other? A lot of the time I believe capital letters have been used with false understanding, just because they are all larger in height, yet they are all square in shape basically. I'm wondering, by contrast, if the diversity in shape of Upper and lower case letters produces more clarity?  Do you know if there has in fact been any studies done on this?  I hoping you can set me straight. I would like to offer my customers the best information I can muster so that I can effectively design their signage with better knowledge. I hope to hear your side of this, and perhaps you might even know of a 'source' of literature or web site to refer to on this question.</p>
  html_clean: <p>Can you tell me if you've ever come across a definite design rule, that states whether CAPITAL  letters are more legible from a distance as opposed to Upper and Lower Case letters used in conjunction with each other? A lot of the time I believe capital letters have been used with false understanding, just because they are all larger in height, yet they are all square in shape basically. I'm wondering, by contrast, if the diversity in shape of Upper and lower case letters produces more clarity?  Do you know if there has in fact been any studies done on this?  I hoping you can set me straight. I would like to offer my customers the best information I can muster so that I can effectively design their signage with better knowledge. I hope to hear your side of this, and perhaps you might even know of a 'source' of literature or web site to refer to on this question.</p>
