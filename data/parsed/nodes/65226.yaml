      <p>When designing signs I find that lateral space is usually at more of a premium than vertical space for text.</p>
      <p>All-caps, at the same nominal size might well be more legible, but U/C characters are generally wider and, excepting ascenders, taller and therefore occupy more area per glyph. </p>
      <p>Try setting your text in upper and lower case, then all-caps at the same nominal size, then in upper and lower case, increasing the size until it is the same length as the upper case sample. Then walk away from your samples and see which one becomes unreadable first. </p>
      <p>…<br>
      -=®=-</p>
