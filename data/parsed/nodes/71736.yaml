  html: |-
    <p>Hi all,</p>
    <p>I'm currently working on a book of short fiction using Underware's splendid <a href="http://www.underware.nl/site2/index.php?id1=dolly&amp;id2=styles" rel="nofollow">Dolly</a> as the main typeface. While I don't mind it at larger sizes, I'm after something to compliment it for both story titles, and the book title as used on the cover. </p>
    <p>I've got no real requirements other than something with plenty of character, and perhaps some stronger/harsher lines to contrast with Dolly's multitude of curves.</p>
    <p>All thoughts/suggestions welcome!</p>
    <p>Jez</p>
