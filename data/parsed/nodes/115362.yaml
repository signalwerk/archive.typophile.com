    html: <p>In FontLab, you can control the order when you're in the Font view (the main window, showing all the glyphs). Choose "Sort Glyphs &gt; By Unicode" from the Glyph menu. You can also fine tune the order in the Index view of the Font window by dragging glyphs around.</p>
