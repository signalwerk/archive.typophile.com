    html: |-
      <p>The script you linked to does not work that way. It <em>only</em> writes out glyphs, unaware of the associated Unicodes -- if any! As it happily outputs glyphs with no Unicode as well; it was written for exactly that purpose.</p>
      <p>To get an output sorted on Unicode, you need to know which glyph in the font has which UC associated with it. Re-associating the glyphs with their Unicode code points is no easy task: it requires reading, parsing, and sorting the <code>cmap</code> entry in the original font file, all in Javascript.</p>
