  html: |-
    <p>Spaces need kerning too. I realize this fact from reading about it but have trouble eyeballing/judging it. In fact if I hadn't read this to alert me to the task, I probably would have forgotten this important step in font design, because I don't see anything overtly wrong in the spaces of my new font, except for about 3 places. When I do a google search, I can't find any help on this subject. I would really appreciate it if anyone could give me a few suggestions on what letters usually need kerning between the spaces that follow them, and/or whatever tips they could point me towards or supply me with. Any suggestions at all would help!</p>
    <p>Thanks in advance!</p>
