    html: <p>I kern spaces to even out the optical appearance of the space at the midpoint of the letters using the strings “HH HH X HH HH” and “nn nn x nn nn”. Just be careful to not kern away too much space with wide versions of overhanging letters; I've seen text fonts where the space character almost disappears next to F or T.</p>
