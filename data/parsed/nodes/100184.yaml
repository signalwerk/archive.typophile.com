      <p>Well, I'm not really a graphic designer (I just make fonts) so I was just keeping quiet, hoping from input from the pros (which I think you'll probably get, eventually). But I <em>do</em> enjoy giving my opinion :-) so here it goes:</p>
      <p>I think it's very nice. It's simple without being boring, and the shapes seem to nicely fit what the company does. Of those four fonts (all of which make sense actually) I like NeoSans the most and Bourgeois the least.</p>
      <p>Colors: I don't do colors.  :-)</p>
