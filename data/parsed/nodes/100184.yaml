    <p>Hello there,<br>
    The company works in the field of facilities management, which is defined as:</p>
    <p>"a profession that encompasses multiple disciplines to ensure functionality of the built environment by integrating people, place, processes and technology."</p>
    <p>and</p>
    <p>"(the) integration of processes within an organisation to maintain and develop the agreed services which support and improve the effectiveness of its primary activities."</p>
    <p>Please check out the link and let me what you think of the logo, font choice, and colors (gradients vs. flat):</p>
    <p><a class="freelinking external" href="http://25.media.tumblr.com/ee00a84abd5baf65f0d7d72533223dc7/tumblr_mhf05gcI121qe5ukfo1_1280.jpg" rel="nofollow">Logo table</a></p>
