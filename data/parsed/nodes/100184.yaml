    html: |-
      <p>Check <strong><a href="http://24.media.tumblr.com/f23c1ead0820738cc564443204d8bc52/tumblr_mhh4kjWxed1reid4go1_1280.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this</a></strong> and <strong><a href="http://25.media.tumblr.com/d964aa3f57f255e1f8b10e3bb60240f3/tumblr_mhh4kjWxed1reid4go2_1280.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this</a></strong>.</p>
      <p>- You're right, gradients shouldn't be an essential part of the brand (I think the one-color version of the logo works without a gradient though, no?).<br>
      I like the blue version too because it works well on light/dark backgrounds (I feel yellow looks less elegant on light backgrounds).</p>
      <p>- I tried the lighter weight <strong>Klavika</strong> and it doesn't look bad. The way I see it, <strong>Trade Gothic</strong> and <strong>DIN</strong> was too dry with no personality, <strong>Bourgeois</strong> seems fitting and has personality but there is something unsettling about it (it gives a "1984 Big Brother" type of vibe), <strong>Benton Sans</strong> has more personality than the usual generic corporate fonts, but it feels too "deja-vu", and <strong>Klavika</strong> sends a subtle "Facebook vibe" that says “hello I’m here!” a little too loud. Moreover, I feel that square sans-serifs in the vein of Klavika are very commonplace in the corporate arena. <strong>Neo Sans</strong> feels futuristic and clean without being too angular, and its curves contrast with the 90 degree angles in the logo directly above it, hopefully creating a nice tension:</p>
      <p>- Do you have any tips on how I can further tweak the flag?</p>
