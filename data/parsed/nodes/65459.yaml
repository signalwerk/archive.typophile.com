    <p>I'm designing my first typeface, I was hoping to get some constructive criticism. I call it Pateo, I'm aiming for a staple sans-serif kind of design, something similar to Helvetica, Akzidenz Grotesk, Univers and the like. I know its a lot to live up to, but I plan on having many, many drafts. This is my lowercase.</p>
    <p>Have at'er boys!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pateo_4927.gif"></div><p></p>
