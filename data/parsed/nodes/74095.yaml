    <p>Hi everyone,</p>
    <p>i need to make a letter template to go with the logo i designed, first i did the entire layout in Indesign but the company also needs editable word documents where the employees just have to fill in the fields.</p>
    <p>I did determine where everything should come like "date, department, contact, name...etc"</p>
    <p>What i would like to do is that the people whom open the template just have to put there cursor in the field and type the date, hit tab and go to the next field, so that every letter that is being send out of the office has the exact layout and type used. </p>
    <p>something like:<br>
    Date: "Type todays date here"<br>
    Name: "Type your name here"<br>
    Department: "type the departments name here"</p>
    <p>Also whats the best format for a logo to be placed in word.</p>
    <p>Hope you guys can help me out as its actually my first time i'm doing something like this, if someone could find the time to tell me how to do this from step one it would really be appreciated.</p>
    <p>i did try looking for some kind of tutorial on the net but don't quite know how these actions are called</p>
    <p>Cheers!</p>
