    html: |-
      <p>Yeah. Here's what to do in Word 2003. Word 2000 will probably be similar. Later versions will need as bit more searching for the commands :^) </p>
      <p>Draw a table (you will probably want to format it with no borders as Nick says) and populate it with form fields for the layout of the templatey bits. Bring up the "Forms" toolbar for quick access to the text-box and other form fields. After the table, insert a section Break (set to "Continuous"). Then go to "Protect document...", and from the "Editing restrictions" dropdown, choose "Filling in forms". Click the "Select sections..." option and tick Section 1 but leave Section 2 unchecked. Then hit the "Yes, Start Enforcing Protection" button.</p>
      <p>Add a password if you want one.</p>
      <p>Then users should be able to type what they want in the botton bit (under the table), but only fill in the fields in the top bit.</p>
      <p>Is that what you wanted?</p>
      <p>-Oh, and as Forrest says, EPS works for the logo, but may look crap onscreen because it'll only show the low-res bitmap header. EMFs are just as good for letterhead purposes...</p>
