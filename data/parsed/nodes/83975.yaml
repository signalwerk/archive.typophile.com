      <p>Oh, liking this Dave!</p>
      <p>I agree with eliason that the /i/ and /j/ are optically a bit too thick. </p>
      <p>While I love the /s/ and /c/ with the circles, it's the top of those three scrips's that I think will work best for actual use. that first /s/ could use a bit of extra whitespace in its stencil cut though? Same for the /y/'s - I would go with the leftmost one.</p>
      <p>On second though that /s/ is tricky though isn't it? Not using dots makes it stand out, but using dots there can't be done in the same way. Maybe what Luma Vine suggested might work?</p>
      <p>In any case, I find the test text very readable so far!</p>
