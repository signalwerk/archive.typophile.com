    html: |-
      <p>Should the tittles be more circular to rhyme with the free-floating ball terminals?<br>
      I wonder of the breaks in /s/ should be further away from the serifs.<br>
      r looks heavy and wide (some weight balancing needed throughout, actually)<br>
      Does /c/'s ball hang a little low?<br>
      /f/ and /j/ seem like they hint more obviously at the connection to the ball terminals than, say, /y/g/r/.<br>
      /p/m/n/ look weak at the midline.</p>
      <p>letters working best to my eyes: /y/a/z/k/o/</p>
