  - id: 471905
    user: 44740
    date: 2011-07-22T11:43:00
    date_raw: 22 Jul 2011 — 11:43am
    votes: null
    html: |-
      <p>Thanks, Craig.<br>
      I thought it could be a quick one I could just pop into every now and then between work on (provisionally titled) Freshscript. Given that it's mostly drawn already and spacing and kerning are already in place, it should just be a matter of chopping bits out.  WRONG!  Optical adjustments are needed all over the place, though strangely not where I'd expect.  The holes in the o, c and e I thought would mean I'd need to extend them to correct the overshoot, but by my eyes they look ok.  Almost as if my brain is filling in the holes in the stencil.  Or am I wrong?<br>
      Agreed on tittles, r and c, but what do you mean by the midline in p m and n?<br>
      s I was already planning on changing.  Putting the breaks in there made it look italic, or at least rotated slightly.  I'd shifted the bottom bowl a bit to the right to compensate but they still look bad, so I'll have to move the cutouts more optically centre.</p>
    html_clean: |-
