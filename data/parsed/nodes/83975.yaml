    html: |-
      <p>It's 'finished' now and about to go live.  I've tidied it up a bit since the samples above, and have taken a bit of weight out of the verticals and made the tittles on i and j smaller to give the glyphs a bit more white space.  I think it works well now.  The s with circles is different to the above (stem goes closer to balls) and, as with the alternate y, they are stylistic alternates, not defaults.  Anyway, it will be up within the next few hours so fingers crossed everything has come together and it's useful to people.<br>
      Cheers for all the critique, now on to the next one....</p>
