      <p>Here's my pick for your dream team: <a href="http://www.myfonts.com/fonts/jnlevine/return-pass/" rel="nofollow">Return Pass JNL Regular</a>. For an exact match you need to reduce the width slightly while retaining the stroke thickness. There are several inline fonts that are otherwise good matches, Princetown by Letraset, Linotype, and Scangraphic, Campus by Mecanorma.<br>
      Don</p>
