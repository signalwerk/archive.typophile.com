    <p>Hi All,</p>
    <p>I working on a project which requires me to recreate the 'with compliments' text and address seen in the top sample. The font used here is Akzidenz Grotesk Extended. I don't currently have this font and the company were not willing to pay the just under £350 for the two weights required for this small job so I am trying to create something similar using fonts I already have. </p>
    <p>As seen in the image below, the second sample from the top is using Helvetica Neue, which I have manually extended to make it look similar. There are a few subtle differences though, such as the numbers and the letter R. </p>
    <p>I then tried using ITC Blair, as seen in the third sample. This is all with the medium weight, however I may purchase the light weight if I decide to go ahead with this option. This is also different, but in some ways is more similar than the Helvetica Neue sample.</p>
    <p>Which do you think looks most similar to the original image, and do you have any suggestions?</p>
    <p>Thanks for your help!</p>
