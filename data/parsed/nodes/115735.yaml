    date_raw: 14 Apr 2014 — 9:06am
    votes: null
    html: "<p>At ATypI Amsterdam, Sofie Beier presented her Neutral typeface design. She designed it for legibility research projects that investigated the effect of styles such as light — bold, regular — italic and condensed — extended on legibility. For Sofie Beier, Neutral is something in between Neo-Grotesque / Modern Sans (Univers, Helvetica, Unica, Folio and Akzidenz Grotesk except for the ‘e’ ;–) and Humanist Sans (Gill, Frutiger, Syntax, Verdana). This resulted in a typeface that looks like Trade Gothic, News Gothic, Franklin Gothic, Arial, Venus, Scheltersche Grotesk etc. Quite something else than what Modernists like to think of as something neutral. My point is that I think that, when it comes to legibility, Sofie Beier has a better clue of that what is neutral than the advocators of the Modern Sans. On the other hand: “Mediocrity is always the correct weight, except its scales are not true”, <em>Anselm Feuerbach</em>, 1829–1880, German philosopher.</p>"
