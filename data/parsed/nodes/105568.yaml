    html: |-
      <p>The line ends (some rounded, some square) indicate that the underline font - if any - is modified, and if your intention is to recreate the logo I suppose the simplest way is to recreate this simple geometry using e.g. Adobe Illustrator.<br>
      If  you want to use an existing font as a starting point, I suggest <strong>Eloquence</strong> by Sadalmelik Fontorium (1996, 1998) or <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Entangled%20Plain%20%28BRK%29%20-%20Normal&amp;fid=27ad8b4f69b3ce8ed7d9e59355ededab&amp;fsize=60&amp;text=exec&amp;fit=1" rel="nofollow">Entangled Plain</a></strong> free font by Ænigma Fonts</p>
