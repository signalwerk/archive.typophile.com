      <p>Random Thoughts:</p>
      <p>Perpetua had its birth, of sorts, in the signage Gill did for a facia. I'd argue that Perpetua Titling was born before Perpetua proper. </p>
      <p>Perpetua might have been used as a text face, it might still be, but it wasn't and still isn't a workhorse textface, it is more of a show pony. </p>
      <p>Both Gill Sans and Perpetua have their roots in the stone carving of Eric Gill. Which is, more or less, display type.</p>
