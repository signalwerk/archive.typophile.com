      <p>I agree with Maurice! Just because two (or more) typefaces were not marketed as belonging to the same family, doesn't mean that they can't be paired or that they, in fact, weren't thought out as serif/sans counterparts.</p>
      <p>That said, I think that several typefaces by <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> follow the same structure/skeleton, and so they can easily be paired and could even be part of the same family. Example <a href="http://www.myfonts.com/fonts/linotype/univers/familytree.html" rel="nofollow">Univers</a> and <a href="http://www.myfonts.com/fonts/linotype/glypha/familytree.html" rel="nofollow">Glypha</a>.</p>
      <p>The same is true for some <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>'s typefaces: <a href="http://www.myfonts.com/fonts/linotype/optima/familytree.html" rel="nofollow">Optima</a> and <a href="http://www.myfonts.com/fonts/linotype/palatino/familytree.html" rel="nofollow">Palatino</a>.</p>
      <p>But, hey Ben, don't get upset. Here are two examples of super duper type families:<br>
      <a href="http://www.myfonts.com/search?search%5Btext%5D=Corporate+ASE" rel="nofollow">Corporate</a> (A, S, E), and <a href="http://www.linotype.com/94405/compatilfontfamilygroup-clan.html" rel="nofollow">Compatil</a> (Exquisit, Fact, Letter, Text).</p>
      <p>(BTW, would you have paired the Compatil typefaces, had they been marketed separately? ;^)</p>
