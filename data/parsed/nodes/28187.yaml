      <p>Hey Miguel why would I be upset? I've never said that one couldn't pair <em>(two or more) typefaces that were not marketed as belonging to the same family.</em> Indeed, I've paired Gill Sans and Perpetua together in book design myself... had they been designed as a related family, you might have less idea about which of the two I used as a text face, but I think you can guess.</p>
      <p>As you'll know, the design motive is to pair them for their structural differences. I think Bringhurst says something about it, but you can see it in practice all around.</p>
      <p>In point of fact, what Majoor says is supposition. <em>Had Eric Gill planned Joanna and Gill Sans as one family he would have been the first in history to design a family of serif and sans, <strong>but he made them as separate designs with separate names.</strong></em> And, I might add, at separate times for separate reasons.</p>
      <p>Reading the Essay on Typography (which is set in Joanna but details the design of Gill Sans) gives one an idea of what Gill would have said about the very idea of a hybrid typeface, and it wouldn't have been complimentary. Gill Sans and Joanna had very different origins; one in signage and the other as a text face. One was an external commission and the other a self-initiated project. Some similarities arise because the same man designed them, but it is ridiculous to claim that they were conceived as sans/serif counterparts of the same type family.</p>
