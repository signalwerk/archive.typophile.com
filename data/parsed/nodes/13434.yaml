    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Linnea Lundquist</strong></p>
    <p>Founding partner of <a href="/wiki/TypoBrand" class="freelinking" rel="nofollow">TypoBrand</a>, Linnea is an expert in font production and worked for twelve years at <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>. During that period she worked on <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>, <a href="/wiki/Sabon" class="freelinking" rel="nofollow">Sabon</a>, <a href="/wiki/Adobe%20Caslon" class="freelinking" rel="nofollow">Adobe Caslon</a>, <a href="/wiki/Chaparral" class="freelinking" rel="nofollow">Chaparral</a>, <a href="/wiki/Tekton" class="freelinking" rel="nofollow">Tekton</a>, and others.</p>
    <p>Linnea runs <a href="/wiki/Atelier%20Gargoyle" class="freelinking" rel="nofollow">Atelier Gargoyle</a> with partner <a href="/wiki/Ward%20Dunham" class="freelinking" rel="nofollow">Ward Dunham</a>.</p>
    <p><a href="http://www.typobrand.com/experience/lundquist.html" rel="nofollow">Bio at TypoBrand.com</a></p>
