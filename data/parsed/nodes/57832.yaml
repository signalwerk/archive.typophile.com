    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writing%20Systems" class="freelinking" rel="nofollow">Writing Systems</a> : <a href="/wiki/Arabic" class="freelinking" rel="nofollow">Arabic</a> : Nastaliq, scholarly transcribed as <cite>nastaʿlîq</cite></strong></p>
    <p>The name is a contraction of the Persian <cite>naskh-i taʿlîq</cite> which contains the element <cite>naskh</cite> "to copy a manuscript" and <cite>taʿlîq</cite> "to slant", connected by the conjunction <cite>-i</cite>. The name could be paraphrased as "cursive for manuscripts".</p>
    <p>Nastaliq is a simplified derivative of historical, pre-typographic naskh. It retains all the connection rules characteristic of pre-typographic Arabic, be it that they are considerably less complex than those of pre-typographic naskh.</p>
    <p>From a purely Western typographical perspective, nastaliq is considered to be "very complex". Ironically and apparently paradoxically, the first accurate metal typeface produced in the Arabic-scripted world - using Western typographic technology - was based on nastaliq.  </p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/34937" rel="nofollow">Handwritten Indian Newspapers</a><br>
