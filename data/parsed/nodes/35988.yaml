      <p>Here’s a list of changes.</p>
      <p>1. Kern the D and the Y tighter, the T and Y a little more loosely.<br>
      2. Add more spacing between the Y and S (the words bleed together way too much).\<br>
      3. Sporting Goods is tracked out way to much (I agree with Maxwell’s reply.)<br>
      4. More contrast between font choices. Maybe select a serif for Sporting Goods.<br>
      5. The 2 lines are too thick, set them at half the stroke weight used.</p>
      <p>All in all, this would be a great logo if this was a line of apparel, but I don’t really see it working as well as logo for store. Considering the logo would have to work at sizes and in wide variety of applications. It’s almost too clean, and equally lifeless. </p>
      <p>Get more clever, it’s called Dynasty Sport, create a Crown logo with various sporting goods. Make a mark that would be easily remembered and recognized (think the bent staple in Staples.)</p>
