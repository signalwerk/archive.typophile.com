    <p>I have been trying to come up with ideas for this logo and was wondering if I have chosen the right concept for a company that wants to be a full line sporting goods store that provides a broad assortment of brand name sporting goods equipment, apparel, and footwear.  I was trying to make it look corporate and sporty at the same time.  Any suggestions as to what I should change?</p>
