      <p>I know you have only shown us 3 examples, but it seems like you don’t have a concept. It seems like you are just trying to decide on a typeface. I would suggest stepping away from the computer and doing a lot of sketches with a pencil and paper. Also, do a lot of research of competitor’s logos.</p>
      <p>A resource is the Logo Design Workbook.</p>
      <p>Be aware of the image the company wants to portray—energetic, fun, sophisticated, expensive, discount. Also be aware that the logo will be used on exterior signage on the side of the building and in newspaper ads. Right now your concepts would not work effectively as signage.</p>
