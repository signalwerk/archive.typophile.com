      <p>Hmm. I’m not loving the cap/small cap look - even tho I realize they aren’t exactly the same (the “small caps” being extended). The caps  look squooshed and the weights don’t match. You also have a problem with those two G’s and the awkward space under the cap S. I think a rule between the two lines might help. Something just looks off-balance here. Your kerning/tracking on the second line isn’t good either, especially in “goods”. Maybe there’s some sort of symbol you can use between the G’s that will relate somehow to the S above them? I’d also suggest not tracking the second line to the width of the top line, let it be shorter and centered.</p>
      <p>I like your first logo better, even tho it does remind me of other existing logos.</p>
