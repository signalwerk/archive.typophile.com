      <p>This makes me think of two other brands: Paul Mitchell for the design &amp; typeface and Nautica for the color.</p>
      <p>I’d modify something, even the Paul Mitchell logo is a modified version of Eurostile. It’s almost a stencil font now, and the “A” is actually built from an upside-down “U.”</p>
      <p></p><div class="imageWrap"><img src="/files/pm_logo_5707.png"></div><p></p>
      <p>Do something to make it unique and stand out from everything else, some kind of distinguishing mark. The Microsoft logo isn’t all that amazing but it does have that little wedge taken out of the “o,” and that’s something you remember.</p>
      <p>“Sporting Goods” does need to be a different font... it needs to be either the same face (or at least the same family) as “DynastySports” or a serif face.<br>
      You’ve got a good foundation; you just need to tweak it further. Have fun!</p>
