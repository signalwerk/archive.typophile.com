    <p>hello! since last year im designing a text typography with the help from a typographer of my University. Now i went a few days ago to the streets to search ideas and i found one lettering from a paint car shop. there wasnt the all alphabeth but i try to design it completely and this was my result.(i think its like a modular system)<br>
    bye<br>
    Matias Nahrwold<br>
    Chile</p>
