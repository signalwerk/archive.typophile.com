    <p>I'm creating a logo for a bike shop named Bike Rx.  I've been using various pharmaceutical images and have somewhat settled with the pill. I've used mostly Helvetica for the text because of its presence on many prescription bottles and medications.  I plan to use the theme throughout the store with mock prescription forms for price tags and prescription bottles for business cards.  The logo is what I'm having trouble with.  Here are some examples.</p>
    <p>Thanks for the feedback</p><div class="imageWrap"><img src="http://typophile.com/files/Logospillvariations_6038.jpg"></div><p></p>
