    html: |-
      <p>The H&amp;FJ fonts identified in the link that Chris provided include 'Exchange', which is the body type they designed for the Wall Street Journal. I would suggest <a href="http://www.myfonts.com/fonts/linotype/berling/" rel="nofollow">Berling</a> as an alternative to Exchange. It has many of the same structural attributes in certain key letters.</p>
      <p>I thought Myriad could be fairly close to the heading Sans type, but you might need to tweak the width. At least it's something you might be likely to have already.</p>
      <p>- Mike Yanega</p>
