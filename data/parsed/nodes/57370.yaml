      <p>re: kentlew:<br>
      What I was getting at with 'original' No. 2 was the first version of No. 2.</p>
      <p>Looking at this more carefully I'm realizing that my reasoning has been a bit flawed.  I'm going off of this old sheet of Linotype-printed fonts which may be falsely named (Metrolight &amp; Metrolite being listed--where No. 2 has the 2-story a).  On top of that I'm looking at samples of old 45s that use a Futura-like font that I've somehow concluded to be Metrolite solely due to the 2-story 'a'.  However, said labels have that Futura-like lowercase t.</p>
      <p>Ultimately, I'm trying to find the font used on these labels.  It's used with high enough frequency to make me believe it is something major and likely obvious, but I haven't ever encountered it in the digital domain, and I don't have any old type books or sheets that have it.  The closest thing I have to it is Metrolite.</p>
      <p>I'm also trying to print labels like this the exact way they were printed 40 years ago, and I bet you're right in that it was metal rather than film.  Here's a specimen:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/not-metrolite_3734.jpg"></div><p></p>
      <p>Excuse my reasoning and lack of knowledge.  I'm still trying to piece together how things were done before my time, how it all came to be, and so on.</p>
