      <p>According to McGrew, Tempo was produced in the following styles: Light, Light Italic, Medium, Medium Italic, Medium Condensed, Bold, Bold Italic, Bold Condensed, Bold Condensed Italic, Bold Extended, Heavy, and Heavy Italic.</p>
      <p>Yes, McGrew is a oft-consulted reference in my library for just these sorts of questions. I find it useful and valuable.</p>
      <p>-- K.</p>
