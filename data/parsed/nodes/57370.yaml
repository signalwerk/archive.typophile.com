      <p><cite> &gt; true-to-the-original version of Metrolite (No. 2 Comdensed) with that classic lowercase a, </cite></p>
      <p>I'm not sure what the "No. 2 Condensed" is doing in your statement. There was never a Condensed style in the original Metro series. And No. 2 is not the "original."</p>
      <p>As Karsten points out. The two-story a and g were substituted by single-story versions for the release of "No. 2" in order to make it more directly competitive with the newly popular geometric sans serifs coming from Europe at the time (Futura, et al.).</p>
      <p>In addition to replacing the a and g, the A G J M N V W v w comma semicolon and apostrophe were all replaced with more "Futura-like" versions as well. There were also Kabel-esque versions of W and e available as special orders.</p>
      <p>AFAIK, however, there was never a Futura-like t.</p>
      <p>If you're going to kick it old school, then don't go photo -- find someone with a Linotype and a font of Metrolite matrices and get the truly "true-to-the-original."</p>
