    <p>Hello type community!</p>
    <p>Does such a thing exist?  I'm looking for a more true-to-the-original version of Metrolite (No. 2 Comdensed) with that classic lowercase a, or at least one with the alternate a.  I have this old type specimen that has both a's represented.  The 2 story one is actually on there under Metrolight, rather than Metrolite.  Was there an old knock-off? I always dismissed it as a typo, as the sheet was what seems to be a personal reference for a Linotype (that metal stuff) printer.</p>
    <p>I think I've asked this before, but the search function is revealing nil for me right now.<br>
    Any help appreciated.</p>
    <p>-David</p>
