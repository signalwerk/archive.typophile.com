    html: <p>According to McGrew's <em>American Metal Typefaces of the Twentieth Century</em>, pp. 216-7, the original version had two-storey a/g but in No.2 were replaced by one-storey a/g, with previous ones available as extras. <em>[edit]</em> Linotype's normal version follows No.2 but there's <a href="http://www.linotype.com/de/135960/metrooffice-schriftfamilie.html" target="_blank" rel="nofollow">Metro Office</a> which has the two-storey forms.</p>
