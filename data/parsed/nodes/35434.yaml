    user_path: null
    date_raw: 26 Jul 2007 — 9:21am
    date: 2007-07-26T09:21:00
    votes: null
    html: <p>I see what you mean and I do agree. However, the lighter face is only readable at 20+ points. In the sample, I had to set it much bigger than the new version so as to appear roughly the same size. (I'm sorry I left this information out.) Hmm. I should aim for a thickness middle ground. Thanks, popluhv.</p>
