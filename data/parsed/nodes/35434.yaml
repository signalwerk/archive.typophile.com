    html: |-
      <p>I like it;  I like the juxtaposition between the thick stroke and the very thin trailing lines.  That said, I would be curious how it looked when the think trails were three-quarters of their current lengt -- it might look better and it might look worse. </p>
      <p>The lowercase s is too tall, I think -- it should descend way less and ascend just a bit less.</p>
