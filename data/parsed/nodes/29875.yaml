      <p>Designing anything that is meant to be read is necessarily conservative. The reading public has little tolerance for innovation, and besides historically most innovations have owed as much to changes in technology as to the desires of type designers to express their personality, if not more.</p>
      <p>Different type styles, different letterforms, or different writing systems altogether may be vastly superior in readability, but the reading public comes with a strongly built-in bias towards what it is accustomed to.</p>
      <p>So if serif faces have been used in setting Roman text for centuries, the question to ask is not why is it still used today, but why innovations are introduced at all. The history of type for immersive reading really is about these little innovations that somehow defy the staticity and inertia of the reading public's preferences, whatever the reasons behind them might be.</p>
      <p>So in short, it is not that people have worked hard to keep the serif alive all this time. It would have been much, much harder to force people to abandon the serif.</p>
