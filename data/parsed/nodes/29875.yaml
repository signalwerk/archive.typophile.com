      <p>I think this is a terrific and fundamental topic. It’s incurious to dismiss it.</p>
      <p>I agree with others that the Catich’s The Origin of the Serif is a worthwhile book. He makes a compelling argument that serifs did not come from stone cutting. My two sentence summary is that serifs are a result of reed writing. The reeds were cut at a slant to allow a writer to have vertical stems that were thicker than horizontal stems (to compensate for a visual perception illusion). Serifs on the left side of a letter were necessary for even ink distribution across the reed while the right side serifs were needed to keep the ink from smudging.</p>
      <p>No matter what the origin of the serif, I think it’s an interesting question to ask why it’s around today. Some propose that it improves word recognition, though I have not seen compelling evidence that serifs help or hinder word recognition. Some claim that the serifs help draw the reader’s eye across a line of text. I agree with Nick that the most plausible explanation is to convey personality differences.</p>
      <p>Cheers, Kevin</p>
