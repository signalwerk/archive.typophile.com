      <p>"Some claim that the serifs help draw the reader’s eye across a line of text."</p>
      <p>This is what I'm calling logicalistic; It sounds like it's logical but it's only a convenient supposition that is generally accepted in place of an explanation. It isn't an explanation at all. </p>
      <p>Has it occurred to you that the line of text itself, the alignment of the typeface and its spacing draw your eye across? Look at a page of text. The letters aren't all in a jumble, equidistant from each other in every direction. They're in lines already. What about your lifetime habit of reading left to right? Could that help "guide the eye"? Or Notan, gelling letters into words? Could any of these obviously functional realities have any more bearing on reading than this fantasy rightward momentum? Finally, How about the fact (!!) that we read in saccades? If that's true, and we have space between lines of text, and the typeface is well-spaced, then why would we need serifs to "guide" our eyes? </p>
      <p>This is too much like the persistent human tendency to anthropomorphize animal behavior, because it's convenient. Since an ostrich can't tell you their real motivations and impulses, you can conveniently project your own neuroses and blindnesses on it. Since there isn't a dazzling scientific factoid to replace it, we can continue to chant this silliness about serifs guiding the eye. </p>
      <p>"With a sans, you tend to have to tighten the spacing to get even color—to the point that it hurts readability, expecially in faces with wide counters, like Helvetica."</p>
      <p>Bill, Helvetica is badly spaced. Other grotesque sans designs are not. Then there are the other categories of sans. The lack of serifs doesn't compel a type designer to space a typeface tightly. This is more paralogic, something to say that fills the space where a real explanation should go. When you design a sans typeface you can revisit this idea.  </p>
      <p>"With serifs, it’s possible to also incorporate stroke variation in a type design, without getting excessive sparkle"</p>
      <p>Hogwash. Optima isn't the only sans with contrast. Another logicalistic leap. </p>
      <p>I am perfectly willing to believe that serifs have a function, but hearing people parrot the same, logicalistic idea is just more hot air at this point. Kevin, who is a reading scientist, has already pointed out that nothing supports these theories. If he's not convinced, why are you?  I'm sorry if this sounds harsh, but people need to think harder about this.</p>
