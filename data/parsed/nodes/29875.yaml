      <p><a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> makes some interesting associations regarding the development and acceptance of sans serif designs in his article, <em><a href="http://www.linotype.com/2258-16893/thelosspart1.html" target="new" rel="nofollow">The History of Linear, Sans Serif Typefaces</a></em>:</p>
      <p><em>It was not until the birth of modernism that architects ventured to introduce a naked column, made of concrete. The fear that a line without boundaries might flow on forever gave way to a worldview defined by rationality – heralding the beginning of widespread use of sans serif typefaces</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/feet_serifs_6284.jpg"></div><br>
      But for my part, I believe the sustained use (and further development) of serif and script designs have more to do about humanistic sensibilities much in the same way we relate to "practical" versus "fashionable" choices in clothing (or as Hrant would point out, shoe styles).<br>
