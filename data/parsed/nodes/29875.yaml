      <p>I don't actually get from miss g. that she wants the serif gone. They are questions. It sounds like she wants to understand why the tradition is so strong. </p>
      <p>So, Miss G, here are some clues: Tradition?, "Who Kept Them Alive", and "For What Purpose".... Those are your best questions to ask. Unfortunately none of us can rattle off textbook answers. It's easier to explain where they came from and how they changed over the centuries, but this question of "why" is kind of unanswerable. </p>
      <p>Worth noting: there were those in the early 20th century who predicted it would be the century of the sans serif. They were correct. Look at the type from 1900-2000. However, if they also said or implied that the serif would go away forever, they were wrong. Look at the type of 1950-2006. </p>
      <p>The pluralism of graphic options could be seen as biodiversity; users of type tend to want a lot of variety once they realize they can have choices. Even if we can't explain the purpose of serifs, they seem to satisfy something very basic for us; you'd have a revolution on your hands if you tried to ban serifed type. Clearly they are not "vestigial" or unnecessary as some have proposed. If they are, then it's tradition keeping them alive. </p>
      <p>Expecting only the "most functional" type to survive is probably misguided.</p>
