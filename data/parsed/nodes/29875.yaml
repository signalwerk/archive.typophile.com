      <p>There is more detail in each character in a serif face than in a san serif face -- and that is why we teach our school children in "Century Schoolbook" as they learn to recognize the alphabet as they read.</p>
      <p>Amazingly, as we age and still read -- it is so instilled in us, we have no problem recognizing letter formations. Go back to Type 101 and remember - cut your serif type in half - and you can still read the sentences easily.</p>
      <p>We use it for ease of recognition -- and therefore, we shall continue using serif faces for reading purposes. (Help you get through many manuscripts, books, newspapers, etc.)</p>
      <p>P.S. It doesn't matter what level you are on. History is important, and this is part of the history of typefaces. My all-time favorite face is still Goudy Old Style. Each letter is beautiful -- every bit of punctuation was well thought out. (I hate what digitized typefonts did to those "diamonds.") Personally, I wouldn't want to lose that sense of style, design or history.</p>
