      <p>Quoting Eben:<br>
      "My pet logicalistic theory is that serifs provide extra data for the brain to use when recognizing either letters or word shapes as the case may be. The shape of a letter with serifs is more complex and there fore data rich. With a relative surplus of data perhaps recognition may be be accomplished slightly faster."</p>
      <p>Just my personal experience leads me to trust Eben. I find that I can read even blackletter better than sans.<br>
      (No, we were not trained to read blackletter at school, and yes, I love grotesque and hope to see the day when it is politically correct to buy Akzidenz.)</p>
