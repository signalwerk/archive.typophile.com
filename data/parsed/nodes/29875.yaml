      <p>Like all other languages written with the Latin writing system (including English), Spanish is written and read left to right.</p>
      <p>It's interesting that the non-native readers made this mistake, given that their native language is read in the same direction and has the same property of having verb conjugations that change the ending of the word (-ed, -ing, -s).</p>
      <p>It would be much less surprising/interesting to learn that people made equivalently basic errors if there was a larger difference between their native language and the new language - as would be the case with Spanish vs Arabic or English vs Arabic.</p>
      <p>Cheers,</p>
      <p>T</p>
