      <p>It's not really that it's a mistake.  The students in the study were only just learning Spanish, so they weren't anywhere near a fluency level, just trying to make sense of it (the idea was to see how students were reading and adjust education materials accordingly).  They weren't reading it backwards, just separating the two units and interpreting them internally out of order. </p>
      <p>By reading the second half of the word first, it shows they're still latching on to the English "I need a person before I can interpret a verb" approach, where as in Spanish it's flexible and can be other SV or VS.  When you mix in object pronouns, a sentence can end up SOV, SVO, VOS, or OVS.  </p>
      <p>It was just done on Spanish because the Unievrsity had an ample supply of L1 English students learning Spanish :)  It would, of course be interesting on seeing it with Arabic.  I know the students at my school (kids 3-8) do get veritably confused when they are learning both Latin and Arabic script at the same time, they can't separate the written, but spoken they speak both Spanish and Arabic (well, I assume on the second) perfectly and are the best English students in the school.</p>
      <p>But I would really be interested to see how our reading of texts changes based on a variety of factors, serif size, degree of contrast, size of text, spacing and kerning, etc.  Take a sample of 100 people an analyze how each changes their reading of things, how they move their eyes, what they focus on, etc.  Much like the highway font experiment but instead of for long-distance reading, for short distance and both for long and short term reading (eg, display words/titles v body text).  </p>
      <p>Perhaps in doing so we might find that the eye seems to track along a the base line in a serif font, giving weight to the idea that serifs guide the reader and make it easier, or we might find that they distract to an extent.  Or we might find they really don't make much of a difference.  Anyone wanna set up an experiment?  :)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
