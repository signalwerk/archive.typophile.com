      <p>For your purpose question I would suggest that you try carving some characters in stone, explore in a physical way why serifs might be practical to a carver, you don't have to be skilled to reach some conclusions. You also can't discard the aesthetic, it needn't be entirely practical that a character is shaped the way it is, despite the base shape having an established form. Also don't assume that all Roman writing used serifs, stone is not indestructible but it has longevity advantages over other mediums.</p>
      <p>Perhaps you should look at your question from another direction, why did sans come about; what purpose did it serve; were there any technological advances that might have contributed to it; also why, if you have a choice, would you remove one of your options &amp;c. &amp;c.</p>
