      <p>"There is no scientific evidence that there are two kinds of reading, immersive and non-immersive..." [ Nick ]</p>
      <p>You're right, no, there isn't. </p>
      <p>There is, or might be, however, an agreement--or social contract--to call the engaged, motivated reading of long texts by experienced readers 'immersive reading', and the deliberative process the reader engages in during immersive reading when an unfamiliar word or phrase of acronym is encountered, 'letterwise decipherment.' The perceptual processing routine that is the norm for each of these is hypothesized to be different, and there are perceptual processing reasons to think this is a sustainable hypothesis: when we meet an unfamiliar word during immersion we do something different, often involving a regressive saccade and a prolonged (in microsecond terms) visual search within the bounded map, as well as a deliberative sequential sounding out on the basis of our learned knowledge of symbol to sound rules, before moving on. </p>
      <p>Both processing routines are learned, and become to various degrees automatic.</p>
      <p>What happens in captions, headlines, decks and way-finding? We connect with these kinds of texts in browsing or way-finding, or 'referential-frame establishing' situations. We automatically resort to the same two processing routines (sub-routines) used in immersive reading, but without as large a benefit perhaps of the preview and semantic context advantages that are maximized at text sizes with longer texts. The response biases of the perceptual system retain their skew to a processing routine not premised on letter-wise slot-processing, or so I believe. </p>
      <p>The perceptual processing impact of serifs at display sizes is a different story. At display sizes their gestural-atmospheric import perhaps plays a more imortant role than their optical-grammatical function in inhibiting slot-processing.</p>
      <p>What doesn't make sense, to me at least, is aligning the binaries immersive / deliberative directly along the reference axis text / display. A processing routine learned (sub-attentively) during the aquisition of 'fluency in immersive reading' becomes the preferred line of attack whenever and wherever text is encountered in the life-world of the reader.</p>
      <p>Bill, I agree that eye-fatigue is not what you are after. I think the premise of your 'sustainability of immersion with robust comprehension' test is that there might be additional 'computation costs,' (or at least, costly pitfuls) in the visual cortex associated with the sans serif when used at text sizes. And that the force of these costs is such that they disturb the most effective allocation of neuronal resources for comprehension, so that is one area where there force is expressed.</p>
