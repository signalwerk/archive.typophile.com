      <p>Miss Giggles that is such a broad question! Simple answer: the serif still alive because people like it and it's easy to read. And appropriate, visually, to a broad range of applications. Sometimes the sans is simply too hard edged, cold, or modern to work properly. Why overthink?</p>
      <p>Not to mention that design - like everything else - is cyclical. Things fall out of fashion, get revived and dusted off and have a new life. The trends that endure are those that are timeless and not too tied to a specific era or movement. Like the good pair of boots that you wear year after year because they are comfortable and durable and go with everything.</p>
      <p>But of course there's also room for a pair of pink sparkly pumps to liven things up on occasion.</p>
