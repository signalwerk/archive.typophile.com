      <p><em>Hogwash. Optima isn’t the only sans with contrast. Another logicalistic leap.</em></p>
      <p>Not at all. Perhaps I should have qualified "incorporate" by "easily", though.  </p>
      <p>Why there are so few sans faces with contrast, compared to the masses of serifed faces with contrast? The fact is, the combination of serifs with contrasted strokes provides a huge canvas for creating all kinds of stylistic variety.<br>
      Sure, contrasted sans faces are possible, and can be effective (as you have demonstrated with Beorcana), but the genre is small because it is problematic. It is difficult to make an effective contrasted sans, but just add serifs, and it makes things a lot easier. There is nothing "logicalistic" about this line of reasoning, and it has nothing to do with reading science, as sparkle is a phenomenon which predates that considerably (going back at least to Ben Franklin's Caslon-Baskerville prank). My observation is "practicalistic" and based on typology and type culture.</p>
      <p>The smallness of the slab serif genre also bears this out: there is not so much design room in the genre for stroke contrast between the main stems and the serifs, because the serifs are already substantial. So again, lack of stroke contrast = small genre.</p>
