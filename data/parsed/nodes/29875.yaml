      <p>Okay I know this is an old thread that was randomly resurrected, but I wasn't around for the original and do have something to add :)</p>
      <p>About a year and half or two ago, I attended a dinner featuring a second language education researcher from Florida State University (I think it was FSU, might have been UF, one of the two heh).  One of the parts of his research involved understanding how foreign language learners read and understand texts, in this case, specifically L1 English students learning Spanish.  While conventional wisdom would have it that students are most confused in Spanish by the conjugations, they found actually that students tend to focus the majority of their effort on word stems.  They did this by studying how the did various worksheets/tests/etc while in some mechanism that allowed eye tracking, so they could see exactly where and for how long students were studying different parts of the words.  IIRC, the students would read words backwards, that is, read the conjugation quickly, and then backtrack to study the base word, eg, in "acaeciésemos", they would focus on "-iésemos" (1st Pl. Past Subj. -se form) and then later spend time on "acaec-" (acaecer, to happen) figuring out what it means, rather than the other way around was would native speakers.</p>
      <p>It would seem to me that a similar approach could be used to judge reading texts between serif and sans serif.  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
