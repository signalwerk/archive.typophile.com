      <p>&gt;from the Romans to the Renaissance and beyond to this day</p>
      <p>&gt;“Who Kept Them Alive”, and “For What Purpose”</p>
      <p>Maybe there is a textbook answer, if there can be such a thing outside of the existence of said textbook. </p>
      <p>It's not just the *serifs*, but the forms of serif designs which bring a unique thing to type. This unique thing comes from the details of designs of the serif -ed type which allow the differentiation of features between characters more broadly than most sans serif designs are capable of, (without looking like you just cut serifs off;). And thus, it is thought by this uniqueness in detail that  serif designs aid the reading process for some people in some documents. </p>
      <p>The serifs in particular, and for the most part, are part of our familiarity with the rest of the serif forms they are attached to, so, for the most part, we *kept* them for reading purposes. But then, as time went by, broader uses of the serif style came along as signage and book work sought timeless and classical appearances.</p>
      <p>&gt;Renaissance and beyond to this day<br>
      My milestones are:<br>
      1. Design of Romans suited for letterpress.<br>
      2. Design of Romans for mass and personal mechanical composition.<br>
      3. Legibility Series by Linotype.<br>
      4. Democratization of the Romans by PostScript/Fontographer.</p>
      <p>Er@least that's what I think. Cheers!</p>
