      <p>regarding: serifs creating a neat crisp effect  [Nick] as the <em>reason</em> for their introduction / assimilation into type design</p>
      <p>my view: the serif in roman lower case types is, or represents, (factor#1) the formalization--in a new  (non-scriptorial) technology or ecology of text production, namely punchcutting--of scriptorial conventions of stroke termination, within (factor#2) a humanistic classicistic cultural sphere dispositionally oriented to the carolinian miniscule and its pairing with the Roman inscriptional capital. (With the formalization being subject to, or under, (factor#3) the countervailing pressures of constraints introduced by the technical requirements of sidebearings,  the trueness of the resultant impression, and the necessity of preserving the integrity of the word image.)</p>
