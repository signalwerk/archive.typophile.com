      <p>One thing about a Miss Giggles question is that it brings out all my favorite folks to answer that question. I like that a lot. </p>
      <p>Carl your points about logicalistic arguments are spot on. </p>
      <p>Personally the serifs leading the eye is a theory I don't buy. It's a little too much like the idea that horses are pulling the sun across the sky.</p>
      <p>Nick, I don't agree with your idea that using the word "immersive" leading. When you read, just like when you watch a film you enter the processing of that media by degrees. In both cases you can forget anything else is going on and thus become "immersed" in the media. In film this is called suspension of disbelief. I don't think there is anything wrong with the idea that reading in an immersed state may be different from reading prior to that state might differ perhaps subtle but meaningful ways. Nick's magazine example is false I think because I don't know that I would become immersed in such a short text- and if I did I would be jolted out of it by the question headers. </p>
      <p>The idea that the serif is not of our time or that the sans is more modern is bunk. Sheer unmitigated nonsense. If you read about this subject on Typophile or do any research into western letter history you will find abundant reasons as to why.</p>
      <p>My pet logicalistic theory is that serifs provide extra data for the brain to use when recognizing either letters or word shapes as the case may be. The shape of a letter with serifs is more complex and there fore data rich. With a relative surplus of data perhaps recognition may be be accomplished slightly faster. If brains were really slow like a very old computer chip it would take longer - but that isn't the case. The mere presence of a serif is not enough however - it's a a matrix of factors that combine to make a text easy or hard to read. There are plenty of serif fonts that would be a nightmare to read long texts in. Maybe this idea is equivalent to but a more mushy way of saying serifs enhance "slot processing".</p>
