      <p><em> ...type designers to express their personality...</em></p>
      <p>What I meant was the personality of the typeface, eg its individuality.</p>
      <p>With serifs, it's possible to also incorporate stroke variation in a type design, without getting excessive sparkle. Stroke variation, not necessarily for reading functionality, but as a means of providing variety of personality in at typeface.</p>
      <p>So, serif faces have more personality than sans serifs, more options for variety -- which can be use by typographers to match the variety of uses, the different personalities of products, of typographers, and of different media.</p>
      <p>Of course, if you're a really good graphic designer, you can use Helvetica for everything and make it look brilliant all the time.~</p>
