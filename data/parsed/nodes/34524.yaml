      <p>Well, for one thing text setting is about subtlety. A feature of the font doesn't have to be "emphasized" (in fact some would say it <cite>shouldn't</cite> be emphasized) for the text to work.</p>
      <p>Will some people think "it's a mistake"? Yes, but Maria has to factor in what percentage of her readers that will be - and chances are it's very small.* If it's done right, I think most people will either not notice consciously or they'll think something along the lines of "Hey, this printing is artsy". :-)  And some graphic designers are likely to actualy like it consciously. Also, the fact that some people will think "it's a mistake" could be a conversation piece, especially if/when they end up finding out that it wasn't! For example maybe by reading a carefully-composed colophon.</p>
      <p>* And if somebody is savvy enough to think such a thing, he might be savvy enough to realize that that couldn't have been what was subbed in for a missing font (unless Maria's choice is very generic-looking).</p>
      <p>That said, I do think that the "resolution" of the pixelfont has to be chosen very carefully, and not least based on the repro quality.</p>
      <p>Maybe we need to see a PDF?</p>
      <p>hhp</p>
