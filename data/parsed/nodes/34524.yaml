      <p>Ah, I guess it was an ant! Haven't looked for it yet though.</p>
      <p>The difference in the "a" is one good reason to use the 12. A bigger reason would be a general increase in readability, since the bitmaps will have more fidelity to "expected" letterforms. But, as you imply, a critical element of deciding how coarse the bitmap font should be is the balance between "flavor" and readability, and that will only reveal itself through some good actual testing. It's possible the 12 will be too subtle at 10pt (although I doubt it).</p>
      <p>&gt; In what ways do you think this can have a bad influence on legibility?</p>
      <p>Good question. I guess it comes down to deviating from "ideal" bitmaps simply to preserve the abstract character of the original (a character that does not necessarily promote readability of its own). I do think this sort of thing has value within a bitmap font family of multiple sizes, but trying to maintain it too much between bitmaps and outlines tends to backfire.</p>
      <p>hhp</p>
