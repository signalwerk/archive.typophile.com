    <p>Hi!</p>
    <p>I need to set text (for print/10pt) on a pixel font, but I don´t want to compromise legibility. </p>
    <p>What do you think about using the typeface Lo-Res 9 (Narrow &amp; Small Caps) by Zuzana Licko for setting text on paper?</p>
    <p>Or maybe, Fedra Bitmap designed by Peter Bilak (I really like Fedra Big Family!)</p>
    <p>If you remember good examples of a pixel font well set on print, I'd like to see them.</p>
    <p>It would be nice if a type designer would design a pixel font to work good on paper.  </p>
    <p>About setting the text: problably I'll need to give a little more space between the lines, anything else?</p>
    <p>Thanks in advance.</p>
