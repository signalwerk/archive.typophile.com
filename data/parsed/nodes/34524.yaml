      <p>One place where bitmaps suffer a great deal through a linking with outlines is width: often you will see a bitmap letter that could have been much nicer if it were one pixel wider or narrower, but its width was dictated by a quantization of its width in the outline width. This can affect all kinds of things in a bitmap, even when done by a master: look at the "v" in 12ppem Georgia...</p>
      <p>hhp</p>
