      <p>Why would you use a bitmap face for print at 10pt? At that size, the pixels wouldn't be emphasized and I have a hunch it'd just look like bad printing. The only time I see pixel faces working well on paper is when they are heavily stylized letterforms and used as display faces.</p>
      <p>For a while my personal logo was a very enlarged small bitmap typeface (early 2000...I was a web designer...heavy concept, eh? ;o)</p>
      <p>Alas, I think at least half of the people I'd present my work do would invariably point out 'I think your printer is missing this font' as they just saw it as a printing error.</p>
