    html: |-
      <p>Looking better and better!</p>
      <p>I like the new join on the /b, definite improvement. New /a is also very nice.</p>
      <p>The /t is a bit narrow for my taste, but it might suit the font like that. In any case, though, it seems a bit low-contrast compared to the other letters.</p>
      <p>Maybe it's just me, but the tail of the /g still looks a bit gooey to me. I'm wondering whether it might improve if the thin neck were more upright (to match the perceived pen angle) and the curve of the tail were more like the /s, i.e., expanding in a single motion after the pinch, and ending in a rather vertical cut rather than a foxtail.</p>
      <p>Yes, first /2.</p>
