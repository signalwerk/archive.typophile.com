    html: <p>I would continue working on this your second already pdf looks nicer -  and I like the squarish o counter. Looking at the letters in a half-focused way the  o's seemed to have a small pinch in the upper left corner of the counter. You can experiment with such a design idea, exaggerate it perhaps make a half or complete cut there, and start the letter as if it were made with a calligraphic rounded brush.  Or end the stroke with a little flourish? Whatever you do carry on the new style to the other letters in a uniform way- now the the b for example looks too sedate and incongruent next to the o.</p>
