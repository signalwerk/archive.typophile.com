      <p>I preferred the original shoulders as well.  I've reverted back.  The stem divergence is an issue I might take a look at again later.  I originally had the flares set up in the way I believe you would expect - on the /u/, the both stems flared to the right at the top.  The problem was that this wholly right-leaning tendency made the glyph looked a bit 'drunk'.</p>
      <p>Anyway, the latest version has a revised /ß/, /&amp;/ and /g/.</p>
      <p><a href="http://freepdfhosting.com/5ef9071c61.pdf" title="http://freepdfhosting.com/5ef9071c61.pdf">http://freepdfhosting.com/5ef9071c61.pdf</a></p>
      <p>The /ß/ is essentially as you suggested and the /&amp;/ has a slightly longer stroke extending into the empty space.  </p>
      <p>The /g/ has had quite a facelift!  The bowl is 5% larger to compensate for the space created by a wider opening at the loop.  The middle bar is flatter and lower, and the tail of the loop is more closely modelled on the /s/.</p>
