    html: |-
      <p>I personally love the steep accents (but then I am Hungarian), but Riccardo is right: Using the classic "optically centered" method is less ideal when they're as steep at this, because it can look as if they are misplaced, sliding off to the left. This is especially noticeable with narrow letters like i and with the double acute. (Remember, the í and the double-acute letters in hungarian are "long versions" of letters that otherwise bear tittles/umlauts, and a positional relationship makes sense.) So carefully moving them right (without leaning the whole letter too much) can be a good idea.</p>
      <p>Note: This is not a generally standard way of doing it, so feel free to disregard. Btw, much more harmonious umlaut. :)</p>
