      <p>Vladimir and hrant - thank you both for sharing your thoughts.  </p>
      <p>I have been experimenting this evening - the latest version is at:</p>
      <p><a href="http://freepdfhosting.com/146fbf183e.pdf" title="http://freepdfhosting.com/146fbf183e.pdf">http://freepdfhosting.com/146fbf183e.pdf</a></p>
      <p>Vladimir - I pulled the outer contour in a little on the /o/ and changed the counter in the /b/, /d/, /p/ and /q/ as you suggested.  I've also edited a number of other letters to try to get some design consistency, but I can't help feeling as if I'm reverse-engineering a design philosophy instead of being led by one.  Thoughts?</p>
      <p>hrant - I will expand upon the broad-nib pen characteristics, but I don't want to lose too much of the ruggedness.  I've grown to really enjoy the unpredictable shapes and quirky features, and I don't want to sacrifice them.  If that means the font ends up with a bit of an identity crisis, I'll chalk it up to experience and move on.</p>
      <p>I think I will attempt the caps. The /C/, /O/ and /S/ draw themselves and I like your idea of looking to uncial for inspiration.  </p>
      <p>Cheers, Steve</p>
