      <p>The latest update - two links with different /g/</p>
      <p><a href="http://freepdfhosting.com/b1d980c7c7.pdf" title="http://freepdfhosting.com/b1d980c7c7.pdf">http://freepdfhosting.com/b1d980c7c7.pdf</a></p>
      <p><a href="http://freepdfhosting.com/21745dffa2.pdf" title="http://freepdfhosting.com/21745dffa2.pdf">http://freepdfhosting.com/21745dffa2.pdf</a></p>
      <p>Both files include the following:</p>
      <p>- revised hood of /f/<br>
      - revised tail of /t/<br>
      - smaller tittles, lowered slightly<br>
      - revised /g/ - the first link shows a variation on the established shape; the second is based on the lower case /s/ - this relationship can be seen most clearly in the word /legs/ (10th line down).</p>
      <p>I don't think either /g/ is quite there yet, but which is the better style to refine?</p>
      <p>I have to say (and, maybe this is because of what hrant referred to as the '<em>outsider</em>' in me), I prefer the single storey /g/.  It may need tweaking, but the style fits perfectly and I believe everyone can agree on this.  The double storey /g/, on the other hand, is like pulling teeth and I'm not at all confident of finding a solution that everyone will agree upon.</p>
      <p>@Vladimir - this font has certainly evolved into something approaching a 'no-straight-lines' policy.  It started out a little aimlessly, but I really like its current 'windswept' appearance, even if it isn't 'correct' in every way.</p>
