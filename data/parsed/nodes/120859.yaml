      <p>Steve, life is funny, isn't it.</p>
      <p>Although you arrived at the peculiar countershape via a happy accident, to me the most notable thing is that it looks like a reflection of the traditional, calligraphic way of making letterforms via a broad-nib pen. So I think the main decision you need to first take is whether to revert to that construction and have a much easier time completing a font that presumably you and certainly many others would find attractive, or to instead try to avoid that reference and make something truly fresh, which however would be a greater challenge.</p>
      <p>As for the caps, that's actually another tricky fork in the road. You can make caps that essentially look like a separate alphabet (the conventional way) or you can try to innovate and make caps that look like they belong with the lowercase (for which you might look to uncial).</p>
      <p>hhp</p>
