  html: |-
    <p>Hi All,</p>
    <p>Like many first-time posters, I'm not entirely new to the site, having lurked in the shadows for a while.</p>
    <p>I won't give you a full biography now, but will tell you that I've developed an unhealthy interest in type design since being forced to reinvent myself due to illness.  My background is technology sales, not design, so my efforts have tended towards the simple.  Which is why I find myself in need of some opinions about my latest font.</p>
    <p>Let me try to set the scene.</p>
    <p>Imagine walking a well-known street.  Every so often, you check out an unknown side street , but you don't walk too far down it, because your instincts are to stick with what you are familiar with.  However, on one occasion, you find yourself in one of these side streets by accident and walk a bit further down it.  You're not comfortable - you keep turning, about to retrace your steps, but an inner voice tells you to keep exploring this strange street.  </p>
    <p>You get to a point where you have to make a decision: return or keep going?   This is where I am with this design.</p>
    <p>I was editing the internal contour of an 'O' in a geometric sans I'd been drawing when I accidentally changed a smooth node to a corner node.  There was something about this 'pinched' contour I liked, even though I didn't (and still don't) understand why, and I ended up creating a set of lower case glyphs based on this idea.  I've created a TTF file and you can see the output in the linked PDF below.</p>
    <p><a href="http://freepdfhosting.com/e290ad9e0c.pdf" title="http://freepdfhosting.com/e290ad9e0c.pdf">http://freepdfhosting.com/e290ad9e0c.pdf</a></p>
    <p>I'm incredibly conflicted about what I have and have held back on designing the upper case glyphs until I can resolve the way I feel about it.  Sometimes I look at individual letterforms and hate them; sometimes, I look at the same letterforms and love their quirkiness.  The only time I consistently like what I have so far is when I see a segment of body text at around 36pt and it's for this reason I'm asking for the community's view.</p>
    <p>Does this design have promise (and, if so, any thoughts about refining the characters I have) or, should I turn back to my well-known street?</p>
    <p>Thanks in advance, Steve</p>
