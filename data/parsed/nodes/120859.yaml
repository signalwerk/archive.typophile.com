      <p>Can't say I like the French-style figures. The old-style ones are certainly workable. I would maybe try out less strongly curved (more "diagonal") extenders for /6/9 and maybe also /3/5. The crossbar of the /4 looks too low. Something weird seems to be going on in the neck of the /6. I'd suggest a somewhat rounder /0 and more spacing around the /1.</p>
      <p>As for lining figures: The reason why capitals need stronger strokes is not that they're tall, but that they have large interior and exterior spaces. Lining figures are tall but compact with relatively small counters, so they need less help.</p>
      <blockquote><p>I'm so easily led! :)</p></blockquote>
      <p>Why, yes you are. *gives biscuit*</p>
