      <p>I've widened the small caps a little and adjusted the bowl of the sc. /R/.  This image shows two sentences in three formats for comparison: all caps, small caps and normal.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gravenstein test2_3716.jpg"></div><p></p>
      <p>The caps, small caps and lower case have the following approximate relationships:</p>
      <ul>Size</ul>
      <p>Caps - 100%<br>
      Small Caps - 80% Cap height<br>
      Lower Case - 73% Cap height; 91.5% Small Cap height</p>
      <ul>Stroke weight</ul>
