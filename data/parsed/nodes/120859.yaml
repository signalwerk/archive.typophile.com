      <p>Chris Lozos:</p>
      <blockquote><p>My opinion is that Greek text should dance more than say Times Roman Latin. Many Latin faces have glyphs which appear as a single gestalt on the page and group together as words with a single gestalt. I feel Greek text swings together as a flowing, undulating tango rather than marching lockstep in very even time.</p></blockquote>
