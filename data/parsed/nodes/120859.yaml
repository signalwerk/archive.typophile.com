      <p>As for the thin /P/ and /R/ counters... as you say, this thinning is standard (and I've tried to implement it as consistently as possible throughout the font), but I'll go back and have a close look at them.  If necessary, I'm sure I can make a subtle change to these two characters without the need to apply the change elsewhere.</p>
      <p>Thanks for all your suggestions so far.  My time is split working on the Greek and small caps at the moment; if you have any thoughts on the Greek, I'd love to hear them - <a href="http://typophile.com/node/121394" title="http://typophile.com/node/121394">http://typophile.com/node/121394</a>.  When these are complete, I plan to add Cyrillic into the mix.  And, though I've never attempted it before, possibly Arabic... there's something about the style of this font that makes me think it might adapt well.  Maybe you could share your expertise when the time comes? :)</p>
