      <p>Hi riccard0 - I think the slant on the top bar is due to 'flipping' the flare so it opens above the bar rather than below it.  I also see the SW/NE feel, but isn't this quite typical of old style /5/'s?</p>
      <p>As for the finials, I did experiment with different ways of solving the problem eliason pointed out.  My choices (as I saw them) were to either thicken them along their original path, which all but eliminates contrast, or else make the curve tighter, which demands a kink for harmony with the font style.  Here's a link to two PDFs showing the alternative thicker version in text and separately.</p>
      <p><a href="http://freepdfhosting.com/86a0dede62.pdf" title="http://freepdfhosting.com/86a0dede62.pdf">http://freepdfhosting.com/86a0dede62.pdf</a><br>
