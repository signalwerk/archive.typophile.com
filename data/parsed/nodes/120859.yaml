      <p>@eliason - I've increased the letterspacing and it definitely looks better.  Thanks.</p>
      <p>@riccard0 - I agree with the /x/ weight - I'll take a look at that today.  As for the top-right curve, this is something I've already started experimenting with, not just on the /x/, but also on the /v/, /w/ and /y/.  I originally designed these glyphs with a curve because the standard form looked horribly plain in context.  The same was true of the /z/, which I dealt with by adding a kink around 1/3 of way down.</p>
      <p>I hadn't considered an alternative form the the /g/, but I really like the idea of trying an open bowl.</p>
      <p>@Vladimir - the alley remains unfamiliar, but it's reassuring to have such good company! :)</p>
