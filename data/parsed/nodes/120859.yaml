      <p>- stroke modulation on the /2/ has been increased very slightly.  </p>
      <p>- some weight has been taken off of the stem of the /7/.  I haven't changed the weight of the top bar for now.  It is the same weight as the base of the /2/, the top of the /5/ and the bars of the /z/.  Hopefully, the change in stem weight gives a better balance to the glyph.</p>
