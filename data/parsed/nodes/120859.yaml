    html: <p>Steve. Yes the latest pdf shines. Alas Greek is Greek to me, but I  certainly agree with the sentiment against Latinizing Arabic. Can you please point me to the Greek discussion you read? All scripts turning to print need to undergo  a certain kind of adaptation to account for  modern needs on screen, print, signage etc. I call it the Sans Serification whether the 'serifs' are ragged brush endings in Japanese script or pen strokes in Arabic. Anyway yes if you have the gumption do a Greek set. From my experience however unless you are really knowledgeable about the nuances of a script the font will appear 'strange' to native users who grew up with the letters. This is true of the Latin I designed for my Arabic  as well as of  the Arabic one Mexican  typophile user designed !  The thing I found about kerning is that it is not that difficult, and that it really helps a font.</p>
    html_clean: <p>Steve. Yes the latest pdf shines. Alas Greek is Greek to me, but I  certainly agree with the sentiment against Latinizing Arabic. Can you please point me to the Greek discussion you read? All scripts turning to print need to undergo  a certain kind of adaptation to account for  modern needs on screen, print, signage etc. I call it the Sans Serification whether the 'serifs' are ragged brush endings in Japanese script or pen strokes in Arabic. Anyway yes if you have the gumption do a Greek set. From my experience however unless you are really knowledgeable about the nuances of a script the font will appear 'strange' to native users who grew up with the letters. This is true of the Latin I designed for my Arabic  as well as of  the Arabic one Mexican  typophile user designed !  The thing I found about kerning is that it is not that difficult, and that it really helps a font.</p>
