    html: |-
      <p>@Catharsis</p>
      <p>I think you're right about the /e/.  It needs to be a bit darker at that pinch point.  On review, I think I need the lighten the /g/ just a little bit in the same area.</p>
      <p>The /b/ &amp; /q/ corners were shaved to solve a weight issue I had at that juncture.  The curve of the stroke naturally thickens at that point.  With the /p/ and /d/, I could get away with thinning the stroke because the descender gave balance, but a thinner stroke on the /b/ looked wrong absent a descender.  I also looked at simply flipping the /d/ to create a /b/ but, aside from seeming a lazy solution, it left the pinch points on the opposite side to where they should be.  I hope that makes sense, as I don't have time right now to post an image.  </p>
      <p>Any ideas on an alternative solution?</p>
      <p>I'm similarly stumped for a solution to my /Y/ problem.  Virtually all stems flare asymmetrically.  Single-stemmed glyphs flare to the left at the base; double-stemmed glyphs flare to the left on the left stem and to the right on the right stem.  In the case of the /m/ - the only, but logical, exception - the middle stem flares both left and right.</p>
      <p>I treated the /Y/ in the same way as, for example, the /f/ - a single flare to the left.  But, because the /Y/ stem isn't long enough for the flare to even out, the original version had a horribly unbalanced look, which I tried to address by shifting the arms to the left.  If your view is that this remains a problem, the only solution I can think of is to remove the flare altogether, since going the other way and creating a symmetrical flare makes the stem too dark. </p>
      <p>Do you think a flare-less /Y/ would be acceptable as an illogical exception?  Or, do you have any other ideas I could experiment with? </p>
      <p>Thanks for the name suggestion.   What is your thinking behind that name?</p>
