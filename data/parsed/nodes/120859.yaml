      <p>Thanks everyone.</p>
      <p>Here are the revised numerals ('old style' for now, hrant - we'll tackle the French style next, if you want).</p>
      <p><a href="http://freepdfhosting.com/86a0dede62.pdf" title="http://freepdfhosting.com/86a0dede62.pdf">http://freepdfhosting.com/86a0dede62.pdf</a></p>
      <p>Changes include:</p>
      <p>-stronger tails on /3/ and /5/ - this tightening of the curve forced the inclusion of the kink.  Whilst this is consistent with the letters, it contrasts with the smoother tails of the /6/ and /9/ (and, to a lesser extent, the stem of the /2/).  This seems to me to make sense, because the tails of the /6/ and /9/ remain 'open', but does this look odd?  Should I increase the curve on the /6/ and /9/ tails so that they also kink?</p>
      <p>- the /5/ has also been calmed down a bit.  The curves angles are less pronounced and the flare extends up instead of down.</p>
      <p>- stroke modulation on the /2/ has been increased very slightly.  </p>
      <p>- some weight has been taken off of the stem of the /7/.  I haven't changed the weight of the top bar for now.  It is the same weight as the base of the /2/, the top of the /5/ and the bars of the /z/.  Hopefully, the change in stem weight gives a better balance to the glyph.</p>
      <p>- /8/ changed as recommended</p>
