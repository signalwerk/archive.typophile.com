      <p>Changes include:</p>
      <p>-stronger tails on /3/ and /5/ - this tightening of the curve forced the inclusion of the kink.  Whilst this is consistent with the letters, it contrasts with the smoother tails of the /6/ and /9/ (and, to a lesser extent, the stem of the /2/).  This seems to me to make sense, because the tails of the /6/ and /9/ remain 'open', but does this look odd?  Should I increase the curve on the /6/ and /9/ tails so that they also kink?</p>
