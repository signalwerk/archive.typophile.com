      <p>@Vladimir &amp; @Birdseeding - this font has come a long way, that's for sure.  I appreciate all the support you guys have offered.  </p>
      <p>I haven't started kerning yet, but I have made quite a few changes since my last update.  These include a stronger hood on the /f/; taller ascenders; variations to the acute, grave, circumflex and caron for the caps (not visible in the PDF, since it's lower case only); and, as a result of Birdseeding's observations, a slightly smaller and looser umlaut.  There have been a couple of other small changes too, but I forget what they are! :)</p>
      <p><a href="http://freepdfhosting.com/0ff63ba208.pdf" title="http://freepdfhosting.com/0ff63ba208.pdf">http://freepdfhosting.com/0ff63ba208.pdf</a></p>
      <p>Vladimir, I should have been busy completing the character set and kerning, but I got distracted.  I was reading another Typophile thread about the tendency to 'Latinise' non-Latin scripts, such as Greek, Cyrillic and Arabic.  One Greek contributor to that conversation contrasted Latin and Greek by saying Greek was akin to a tango across the page whilst Latin was more regimented.   This got me thinking about the way you  described this font a couple of weeks ago:</p>
      <blockquote><p>...as if a breeze is blowing through the letters.</p></blockquote>
      <p>So, I wondered if it would be possible to create a Greek character set for this 'breezy' font that captured the energy of the Greek script without Latinising it.  I've nearly completed the lower case characters and will post them here, probably in a new thread, since I want to attract native Greek-speakers to comment.</p>
      <p>Then I'll get back to kerning! :)</p>
