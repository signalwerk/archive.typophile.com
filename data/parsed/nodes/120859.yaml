      <p>@Catharsis - thanks for your suggestions.</p>
      <p>I've redrawn the /a/ so that it is consistent with the rest of the font.  Having 'shaved' so much weight off of this font in an attempt to apply more calligraphic principles, it's nice to be able to put a bit of weight back in! </p>
      <p>I also rotated the tittles (and, in the case of the /j/, repositioned it).  The latest version is at:<br>
      <a href="http://freepdfhosting.com/d5e47c0c2d.pdf" title="http://freepdfhosting.com/d5e47c0c2d.pdf">http://freepdfhosting.com/d5e47c0c2d.pdf</a></p>
      <p>The /t/ has been a recurring issue for me.  The very first draft of the font, which preceded the first upload here, had a more conventional round foot, but I didn't like it.  I have actually tried a couple more times to introduce it since discussing the font here, but I always end up preferring the straighter style.  Do you think this font is desperately crying out for a rounded /t/?</p>
      <p>As for the stroke endings, I've experimented a little here as well.  Again, going back to my first 'pre-Typophile' version, the stroke endings you mentioned terminated with a curl, similar to the right sides of the /v/, /w/, /x/ and /y/ found in earlier versions (such as <a href="http://freepdfhosting.com/e290ad9e0c.pdf" title="http://freepdfhosting.com/e290ad9e0c.pdf">http://freepdfhosting.com/e290ad9e0c.pdf</a>).  They've since been 'iterated' out, but do you think the font would now work better if I reintroduced them, or some variation on that theme?</p>
      <p>I have to say that  really like the asymmetrical crossbars and the serifs, which use the same shape.  That doesn't mean to say I opposed to change and I'll certainly experiment with other ideas.</p>
      <p>@hrant - you said earlier in this thread that you thought "<em>...the main decision [I] need to first take is whether to revert to [a calligraphic] construction...</em>".  I think you were right and, though my interpretation might be a little loose, the /a/ does work better without that 'pinch'.</p>
    html_clean: |-
