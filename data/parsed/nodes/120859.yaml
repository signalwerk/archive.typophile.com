      <p>Don't take this personally, but that /ß is oogly.  ;o)  It looks like your font didn't have it and a glyph from another font got subtituted. Lose the spur, make it as tall as the /l, and de-cramp it horizontally. Your font has this nice clean, no-frills look to it, and this /ß spoils it.</p>
      <p>I don't have any useful experience with the Icelandic glyphs, but the /ð looks a bit dark where all the strokes cross — maybe you can make the junction of the bowl and stem a bit lighter?</p>
      <p>I have trouble parsing the /Þ as a capital. I know it's difficult to make it work without serifs... maybe just try a slightly taller and wider bowl?</p>
      <p>I'm not too fond of the /&amp; yet. Its serif feels to finicky, and I have an inkling that a less closed design would work better with the font's many open apertures (which is also why I like the idea of a semi-open /g).</p>
      <p>Is the /r a bit too narrow?</p>
