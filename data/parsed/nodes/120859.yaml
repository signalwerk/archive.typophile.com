      <p>I found the numbers a bit dark in the very first iteration. Now they look fine to me, but, of course they will need to be seen in a simulation of a "real life" setting to be properly judged.<br>
      As for the "french" numerals, the advantage would be more variation in ascenders and descenders (your |4| could be a bit shorter, I think). Outside running text, if not done properly, they could look a bit off, but so do "regular" OSN, especially in a sans (and I'm not sure I ever saw a sans with "french" ones, but here's a Baskerville: <a href="http://www.myfonts.com/fonts/glc/1785-glc-baskerville/" title="http://www.myfonts.com/fonts/glc/1785-glc-baskerville/">http://www.myfonts.com/fonts/glc/1785-glc-baskerville/</a>).<br>
      You could always try hybrid (AKA ¾) numerals.<br>
      In any case, a proper critic for numerals (especially OS) could be done only seeing them along some letters.</p>
    html_clean: |-
