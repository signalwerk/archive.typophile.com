      <p>Hey Steve,</p>
      <p>/ß is <em>much</em> better now. It could probably still profit from a bit more space between the stem and the near-contact points, though. I feel like your design is characterized by open, springy forms, and this closed and aggressive double curve won't quite fit.</p>
      <p>/ð is definitely better now! Can't say I noticed a change in /Þ, but you might as well leave it like that; it's pretty much impossible to make look right in a sans (except maybe in a very blocky one where you can exaggerate the bowl).</p>
      <p>I rather like your open /&amp;, but you should pick the one <em>you</em> like best for your default, obviously. If you want to tweak the open one some more, maybe try a slightly longer outstroke on the rising diagonal in order to balance out that large whitespace?</p>
      <p>As for your /g...  I feel like I've already meddled in your design choices far more than I should have, but I think the current one is a step backward. It's trying to revert to the Baskerville/Meta shape that it originally had, and I don't think it's a good match for your font (or for Baskerville and Meta, for that matter). The vertical upturn and tiny aperture clash with the "natural spline" feeling of the similar finials in /a and /s. I'd try to match that feeling by keeping the /g's tail low and with relatively little curvature towards the end, much like the /s's lower half. If you find that this leaves too large an aperture, maybe lower the middle part of the /g a bit to redistribute the weight.</p>
    html_clean: |-
