      <p>@Catharsis - thanks for your feedback and the great support you've offered throughout.</p>
      <p>I'll revisit the /t/ - maybe widen the crossbar and/or the tail?</p>
      <p>More importantly, I'll go back and see if I can rework the /g/.  I do quite like it as it is - and it is a great deal better than my very first draft - but I've had this nagging sense it could be better.  I think your suggestion is spot on.  I'll post an update sometime tomorrow, which will also include new sidebearings.</p>
      <p>I like 'Gravensteiner' as a name and I like the idea that this variety of apple, like this font, was discovered by chance.  If I hadn't inadvertently turned a mid-curved node into a corner node, I still be refining a plain old geometric face... on my own!</p>
      <p>I'm not sure if or how this font will reach a wider audience but, if it does, I'll be sure to credit you.  Same applies to everyone who has been kind enough to offer their thoughts.</p>
