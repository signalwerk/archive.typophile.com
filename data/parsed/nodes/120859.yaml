      <p>I don't like the version with the /n-like tops on ascenders much.</p>
      <p>I do like the slightly flaring stems on /i and /f, for example, but I'd make the flaring a little bit stronger on the ascenders and descenders. The stem on the /b also looks a bit unnatural to me, maybe it's that "pinch" you mentioned? Make sure the left and right edges of the stem work together well; I think that might involve making the bottom of the stem a bit wider into the bowl.</p>
      <p>The tittles don't quite sit well yet to my eye.</p>
      <p>The break in /z looks like a fracture. Maybe a curve would work better?</p>
      <p>The /g has a wood-carved, choppy character that feels a bit out of place among the smoother other characters. Maybe you could smooth out some of the kinks and give the tail a bit more flow? I know it's a hard one to draw, but it also has the potential to be particularly noteworthy if done right. Maybe also allow the eye region of /g to have slightly lighter strokes than the /o, since they're so close to each other?</p>
      <p>Just an idea: What would the font look like if there were no serifs on /a and /z, just some flaring?</p>
