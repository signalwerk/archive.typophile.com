    html: |-
      <p>To sum up: </p>
      <p>If you use the "Standard Table" as your default Unicode-Name mapping table in FLS5, your font should have three glyphs, each of them having two Unicode codepoints assigned:<br>
      U+2206 U+0394 "Delta"<br>
      U+2126 U+03A9 "Omega"<br>
      U+00B5 U+03BC "mu"</p>
      <p>If you use the "AGLFN 1.6 (new) strict" as the default Unicode-Name mapping table, your font should have six glyphs, each having just one Unicode codepoint assigned; three of these glyphs can be composites of the other three:<br>
      U+2206 "uni2206", U+0394 "Delta"<br>
      U+2126 "uni2126", U+03A9 "Omega"<br>
      U+00B5 "uni00B5", U+03BC "mu"</p>
      <p>For new multilingual "Pro"-type of OpenType fonts, use of "AGLFN 1.6 (new) strict" (aglfn16.nam) is recommended. For other font work (such as fonts converted from older formats etc., plain/simple OpenType fonts without large character sets), "Standard Table" (standard.nam) is recommended. </p>
      <p>To set your default Unicode-Name mapping table, go to the General Options / Unicode and OpenType section of FontLab Studio's Preferences (on Mac) or Options (on Windows). </p>
      <p>Adam</p>
