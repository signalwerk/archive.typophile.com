      <p>Fontlab Ltd. recommends using both the "old" and the "new" codes for these glyphs, i.e. double-mapping them. This is what STANDARD.NAM is programmed to do in FontLab Studio 5, but you can also choose just the "old" or the "new" Adobe mapping by choosing a different Unicode-to-glyphname mapping file in FontLab Studio's preferences. </p>
      <p>A.</p>
