    <p>I ran the FontQA-test on a new typeface.</p>
    <p>There was this error:</p>
    <p>Some glyphs have Unicode-Double-Mapping.<br>
    mu: 00B5, 03BC, Delta: 0394, 2206, Omega: 03A9, 2126<br>
    Now, this is actually FontLab that creates two Unicode values, not me.</p>
    <p>Then I looked at the Unicode charts, and there IS two codes available for the same glyph according to <a href="http://www.unicode.org/charts" title="www.unicode.org/charts">www.unicode.org/charts</a></p>
    <p>What should I do — take away one number or just let it be?<br>
    Thanks in advance, Font Maestro’s</p>
