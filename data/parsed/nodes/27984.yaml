    html: |-
      <p>Eigi, </p>
      <p>perhaps you could demote the error to something like warning. </p>
      <p>FontLab Studio 5.0.2 includes three glyphname-to-Unicode mapping tables: Standard Table, AGLFN 1.4 (old) strict and AGLFN 1.6 (new) strict. The AGLFN 1.4 (old) table maps the human-readable glyphnames to the mathematical/scientifical Unicodes, while presuming that the Greek text glyphs would carry uniXXXX glyphnames. The AGLFN 1.6 (new) table reverses the logic: the human-readable glyphnames are mapped only to the Greek text Unicodes while the mathematical/scientifical glyphs would carry uniXXXX names. The Standard Table double-maps the human-readable glyphnames so there is no need to include the uniXXXX glyph names. </p>
      <p>If you want to include both Greek text glyphs and scientific glyphs that differ in design, or would like to make sure that Acrobat always precisely guesses the Unicode of a glyph (i.e. it will never confuse the Greek text Unicodes with the scientific Unicodes when doing searches or text extraction in a PDF), I'd use the AGLFN 1.6 (new) strict table. But this will mean that you will need to provide two glyphs for each of the characters. </p>
      <p>Otherwise, if you only want to design one set of glyphs, double-encode them (using the Standard Table). </p>
      <p>BTW, there some additional explanations in the .NAM files themselves. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
