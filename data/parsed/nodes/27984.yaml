    html: |-
      <p>The FontQA test tool represents FontShop's workflow and approach, so it flags a couple of things as errors which are not technically errors at all but simply reflect things that FontShop don't do in their own fonts (or at least think should be checked). This error message suggests that FontShop follows Adobe's practice of not double-encoding glyphs, so that there is an unambiguous path back from the glyph ID to a single Unicode characters (which Acrobat sometimes needs, in order to be able to restore character strings from a PDF created from a print stream).</p>
      <p>It is, however, perfectly permissable to map a single glyph to multiple Unicode codepoints. It is a workflow decision not a font error.</p>
    html_clean: |-
