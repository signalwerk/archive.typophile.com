    html: <p>I bought the book about a month ago and read it right after finishing "Alpha Beta" (a contrast in style).  Alessio's book is a scream yet very good information.  It is a very quick read and will make your day with a broad smile.  It is sort of like having Father Guido Sarducci (old SNL character) teaching history of letterforms.  Alessio is a guy I just have to meet.  I at least owe him an email for writing such a fun book. <br> <br>ChrisL</p>
