      <p>Psychological researchers have picked up on how the crude comparison of type settings can produce laboratory results. </p>
      <p>News media are interested in the “hidden persuaders” aspect of this.</p>
      <p>In turn, mini-memes circulate within the design community.</p>
      <p>Readability and disﬂuency are interesting theories, but they have no practical value for typography.</p>
