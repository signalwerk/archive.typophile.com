    html: |-
      <p>On further reflection, this scientific knowledge could be misused to help convince people of the truth of a dishonest argument, in political or other fields.</p>
      <p>Just sort your arguments by their nature...</p>
      <p>Where part of your argument is logically sound, but goes against the existing prejudices of the audience, use a hard-to-read type;</p>
      <p>Where another part of your argument is concordant with the prejudices of the audience, but has a logical flaw, use an easy-to-read type.</p>
      <p>Thus, you would stand a chance of changing the existing opinions of your readers, even though your argument was not valid, because the good parts of your argument, at each point, would be the ones that got traction, while the bad parts got missed or the difficult parts overwhelmed.</p>
