    <p>I really enjoy spending time in here, educating my self with the knowledge and guidance from you guys. I have used many hours reading threads and replies, and commented a few my self.</p>
    <p>I have made web design all of my life, starting 10-years old. First in 2000 I tried Photoshop, soon to be followed by all the other Adobe products. It was here I started my passion for corporate ID design. </p>
    <p></p><div class="imageWrap"><img src="/web/20080905121930im_/http://www.typophile.com/files/logos_4832.jpg"></div><br>
    <strong>1. Magventure</strong><br>
    	Magnetic stimulation.<p></p>
    <p><strong>2. Advanseed</strong><br>
    	Sells special seeds like Rucula.</p>
    <p><strong>3. Regnskabets time</strong><br>
    	Auditor. The name is on Danish and is a saying like, “The 11th hour” but with a more threatening meaning. Like “Let’s settle the score” sort of. It meant to be humorous.</p>
    <p><strong>4. Kongens Lyngby haveservice</strong><br>
    	“Kongens Lyngby” is a city in Denmark. A part of Lyngby. Translated to English it would be: “The Kings Lyngby”. “Haveservice” means “Garden Service”. So “The Kings Lyngby Garden Service”.</p>
    <p><strong>5. Daren</strong><br>
    	Darén is a cleaning business. The idea was that the white stuff is like when you sweep.</p>
    <p><strong>6. InOffice</strong><br>
    	Office hotel in Copenhagen.</p>
    <p><strong>7. Advanseed</strong><br>
    	Sells special seeds like Rucula.</p>
    <p><strong>8. AktieFokus</strong><br>
    	A financial stock news firm that monitors stocks and brings the news to the newspapers.</p>
    <p><strong>9. Giantmedia</strong><br>
    	An advertising agency.</p>
    <p><strong>10. Intramedia</strong><br>
    	A CMS IT comany</p>
    <p>I don’t know why i post it - it’s way too late to change any of them... well ... maby just because we all love logos... :-)</p>
    <p>Please be free to say your opinion, whether it’s good or bad... :-)</p>
