    html: |-
      <p>As for the sans, the match should be easy but I didn't see it. I ran across problems similar to those encountered in <a href="http://typophile.com/node/115128" title="http://typophile.com/node/115128">http://typophile.com/node/115128</a>.  The serifed I on a sans font is relatively rare. The following fonts have it, together with a matching G: Lettera, FF Fago, Elsa, ITC Officina Sans, Droid Sans, FF Info, FS Albert, Ubik, and FS Me. However every one of these fonts has mismatches for other letters. Perhaps the closest of this lot is FS Me <a href="http://www.identifont.com/find?font=FS+Me&amp;q=Go" title="http://www.identifont.com/find?font=FS+Me&amp;q=Go">http://www.identifont.com/find?font=FS+Me&amp;q=Go</a> It's the only one with the right style of Q.<br>
      Anyone else prepared to take a stab at this?<br>
      Don</p>
    html_clean: |-
      <p>As for the sans, the match should be easy but I didn't see it. I ran across problems similar to those encountered in <a href="http://typophile.com/node/115128" title="http://typophile.com/node/115128" class="link-lost">http://typophile.com/node/115128</a>.  The serifed I on a sans font is relatively rare. The following fonts have it, together with a matching G: Lettera, FF Fago, Elsa, ITC Officina Sans, Droid Sans, FF Info, FS Albert, Ubik, and FS Me. However every one of these fonts has mismatches for other letters. Perhaps the closest of this lot is FS Me <a href="http://www.identifont.com/find?font=FS+Me&amp;q=Go" title="http://www.identifont.com/find?font=FS+Me&amp;q=Go" class="link-external">http://www.identifont.com/find?font=FS+Me&amp;q=Go</a> It's the only one with the right style of Q.<br>
      Anyone else prepared to take a stab at this?<br>
      Don</p>
