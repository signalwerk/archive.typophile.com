      <p>I have been searching Garalde typefaces looking for similar k structure (ignoring the flip leg), and it seems that Zapf and Goudy have used similar leg placement in some of their typefaces. The lower leg of the k connects close to the stem, but on the upper leg. Zapf’s Aldus and Zapf Renaissance look pretty close to the k used in the logo.</p>
      <p>The initial f looks very customized, and it surprises me that a hair salon would have a custom logo, unless this is a large chain of shops.</p>
      <p>- Mike Yanega</p>
