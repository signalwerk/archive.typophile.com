      <p>It certainly did, because it had a professional look to it. Thinking that this must have been a franchise hair salon operation I looked for, but could not find, this hair salon on the web, so if this is a one-off shop I am really surprised they would have gone to the trouble (and presumed expense) of having a custom logo designed. Two things occurred to me: 1) It is cheaper than I think to have a logo made; or, 2) This lettering comes from a font I haven’t found yet. </p>
      <p>The f has some attributes of an italic f, but it is vertical. I think if I see that f anywhere I hope I can remember this thread.</p>
      <p>- Mike Yanega</p>
