      <p>I guess my conclusion is that this is certainly a custom logo. If I had to pick a starting point, I would use <a class="freelinking-external" href="http://new.myfonts.com/fonts/efscangraphic/zapf-renaissance-antiqua-sh/">Zapf Renaissance Antiqua</a>, and I would shorten the l so that the serifs on top of the l and k are stepped, such that the top edges of the serifs form a straight line. Then I would clip off the leg of the italic k and transplant it on the Roman k (and then probably tweak it a lot). The f would be a challenge for me, because I have no skill at this (obviously), but I know this would be relatively simple work for any one of the font designers who hang out here.</p>
      <p>Your original question was whether this was a font or custom, and I vote the latter.</p>
      <p>- Mike Yanega</p>
