      <p>It may come from a Garamond, but I don’t think it’s ITC Garamond. The relative height of the l and k isn’t right, and even the k leg position is different, assuming you accept that the end of the k leg was modified. It seems that too much would have had to change, although I know anything is possible.</p>
      <p>- Mike Yanega</p>
