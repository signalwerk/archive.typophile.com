      <p>I did an extensive search for legible serif fonts yesterday and stumbled upon a few likely suspects that could have been used as a starting point.  Although each one would need specific unlogical customisation to achieve the exact result (not considering the f), i think Valfieris by Insigne comes quite close.</p>
      <p><a href="http://www.myfonts.com/fonts/insigne/valfieris/regular/" title="http://www.myfonts.com/fonts/insigne/valfieris/regular/">http://www.myfonts.com/fonts/insigne/valfieris/regular/</a></p>
      <p>The serif details would need to be straightened and skewed a little on the ascenders, and its not as condensed as the logo but still the k is remarkably similar.</p>
      <p>As for the mystery of custom font logo, I think the answer lies in the fact that hairdressers may have friends who are doing graphic design, and therefor can have a nice logo done for cheap. </p>
      <p>I wish I could remember where i found this image though..could shed more light onto the whereabouts of the salon itself or the designers..</p>
