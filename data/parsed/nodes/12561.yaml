    <p>I had been working on a logo for a personal project for about 2 months, but just couldn't get out of my own way. I started cruising the net looking for inspiration and ran into <a href="http://www.ms-studio.com" title="www.ms-studio.com">www.ms-studio.com</a>. Mark's work blew me away and I begged him to help me on my gig... The end result just blew me away...</p>
