  html: <p> Ok, I had this problem with FL3 and now it's back again with FL4. I'm running OS X. In Fog4, when you're flipping through glyphs, the left side-bearing stays put. This is a good way of judging the relative positions of different characters without drawing a bunch of guides. <br> <br>In FL3, and again in FL4, I flip through the glyphs, and each glyph gets centered in the glyph window. This is good/bad. However, I've noticed that *sometimes* the left side-bearing does stay put between glyphs! I noticed that there is a tiny lock icon in the ruler at the top of the side-bearings and at the end of the baseline. Does this have something to do with it? <br> <br>I emailed Pyrus, haven't gotten an answer yet. I know, I know, rtfm. I did (skimmed really fast looking for screenshots of that little lock). Anyone have any ideas? (now preparing to feel really stupid) </p>
