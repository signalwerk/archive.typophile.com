    votes: null
    html: |-
      <p>Duncan, </p>
      <p>I recommend running: </p>
      <ol>
      <li> <a href="http://www.microsoft.com/typography/FontValidator.mspx" rel="nofollow">Microsoft Font Validator</a>, a free Microsoft tool for Windows.
      </li><li> <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic.html" rel="nofollow">Adobe CompareFamily</a>, which is part of the free Adobe FDK for OpenType toolkit for Mac or Windows.
      </li><li> <a href="http://developer.apple.com/textfonts/Fonttools/" rel="nofollow">Apple ftxvalidator</a>, which is part of the free Apple Font Tools suite for Mac OS X.
      </li><li> <a href="http://www.fontqa.com/" rel="nofollow">FontQA</a>, developed at FontShop, which is a free tool written in Python, working within FontLab Studio.
      </li><li> <a href="http://www.font.org/software/ttx/" rel="nofollow">FontTools/TTX</a>, developed by Just van Rossum, which is a free tool written in Python that converts OpenType and TrueType fonts into XML and back.
      </li></ol>
      <p>Adam</p>
    html_clean: |-
