    <p>Everybody tells me to check my fonts on a PC aswell by using the MS Font Validator.</p>
    <p>OK.</p>
    <p>The only problem is that it seems like this Microsoft MSN Group is sort of ”dead” – and this is the ONLY place you gould get it (of course).</p>
    <p>It’s this usual b*** – one applies for membership, and then the all mighty moderator, administrator or whatever she or he is called, is suppose to ”approve” me, descide if I’m worthy or not just by knowing my e-mail adress ;-)</p>
    <p>Anyway, I guess this person is maybe on vacation on a small Island without an Internet connection, good for him – but wouldnt it be easier if Microsoft just put it on their website, since they do claim that they are there to support type delevopers.</p>
    <p>Could it be found some where else perhaps? :)</p>
