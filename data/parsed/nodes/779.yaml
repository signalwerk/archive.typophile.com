  html: <p>This font isn't exactly the most original or exciting typeface ever; I'm mainly working on it for fun. I wanted to create an "industrial" face and somehow or other it ended up shadowed. <br> <br>While I love the proportions of the font, I am very dissatisfied in how the diagonal strokes' shadows ended up. <br> <br>Is there anything I can do without ruining the perspective? I thought of widening the diagonals' shadows so they were the same width as the horizontal and vertical strokes' shadows, but I wondered if that might not look odd... suggestions? <br> <br><img src="http://www.typophile.com/forums/messages/29/1354.jpg" alt="girder"></p>
  html_clean: <p>This font isn't exactly the most original or exciting typeface ever; I'm mainly working on it for fun. I wanted to create an "industrial" face and somehow or other it ended up shadowed. <br> <br>While I love the proportions of the font, I am very dissatisfied in how the diagonal strokes' shadows ended up. <br> <br>Is there anything I can do without ruining the perspective? I thought of widening the diagonals' shadows so they were the same width as the horizontal and vertical strokes' shadows, but I wondered if that might not look odd... suggestions? <br> <br><img src="http://www.typophile.com/forums/messages/29/1354.jpg" alt="girder"></p>
