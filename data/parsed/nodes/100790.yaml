    <p>Dear Typophiles,</p>
    <p>I started to happily benefit from the great Metrics Machine, yet there are some things I don’t really understand. I thought I might post those questions here and see whether more experienced users can help!</p>
    <p><strong>1) Pair List workflow</strong><br>
    I created my groups and a pair list which basically includes all different kind of kerning (A-Z against A-Z, A-Z against punctation etc.) at once. Here the question whether you guys create separate pair lists which you import and kern subsequently? Is the pair list something you keep re-compiling again and again, until all kerning is done? I assume I wrongly regard the pair list as something fixed, a single "master file" which must be updated and reshaped according to new problems that arise during kerning. Wrong?</p>
    <p><strong>2) Add and subtract from a pair list:</strong><br>
    Among my groups O and Oslash are part of the same O-group, and I compiled a pair list which kerns all groups against each other. What are the right steps if I later on notice the need for Oslash to have its own treatment across all kerning?<br>
    I can easily delete Oslash from my O-group and update (apply) my groups, but: Oslash logically does not appear as "own instance" in my previously created pair list. Is there the possibility to "add" new groups to my previously generated pair list and kern them against all already existing ones (basically giving the new group the same behavior like the others), without having to create the pair list completely new?</p>
    <p><strong>3) The nature of the pair list:</strong><br>
    I generated a huge pair list but skipped some parts during the kerning, like kept them for later. I save my UFO-file and call it the day. The next time I open the UFO, the kerning-window only shows the pairs which have kerning-values added, the skipped ones (every combination which I left with a zero value) are not visible anymore. Is it correct to now simply import my pairlist.txt again, hit "use" and continue with the kerning?</p>
    <p><strong>4) Naming of the pairs</strong><br>
    In the group editor my group called "hyphen" contains  emdash, endash, hypen and also the asciitilde. However, after compiling the pairs this pair is listed as "asciitilde" in my kerning. I always get confused when going through the kerning and it reads "Y kerns agains asciitilde". Is there a way to change the name of the pair?</p>
    <p><strong>5) Kerning in collaboration</strong><br>
    Whats the best way to synchronize/update data in case two people split the amount of work during kerning? Just as example: In case I start kerning from the top, and my colleague from the botton of the same pair list. If I would simply import his part of kerning into my .UFO file, the kerning I would have done until that point would be overwritten – is that correct?</p>
    <p>Okay, thats the troubles I’m having for now. I hope I described the scenario in an understandable way.<br>
    Would be great if someone could put some things right for me :-) Thank you a lot!</p>
    <p>Best wishes from Amsterdam<br>
    HAN</p>
