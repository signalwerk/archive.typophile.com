    <p>ok, i guess it’s time for me to brush up on some scripting…</p>
    <p>first of all, is there a macro for a group of .vfb files that will:<br>
    -Switch to “codepages”<br>
    -View by Name<br>
    -select MacOS Roman (and a variant to select MS windows 1252 Latin 1) -generate names -and lastly copy the currency (euro) to the Euro glyph position?</p>
    <p>if not, how hard would it be for a beginner to write something that will do these for me in a batch? can anyone point me in the right direction? any help would be appreciated!!!</p>
