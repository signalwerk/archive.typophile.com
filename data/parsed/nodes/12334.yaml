      <p>Ah, no the “Learn Python for FontLab Fast” doesn’t exist. However, here are the links that I’m always referring to when I’m working on a script:</p>
      <p><a href="http://dev.fontlab.net/flpydoc/">FontLab Python</a><br>
      <a href="http://www.python.org/doc/2.3.5/">Python 2.3 documentation</a><br>
      <a href="http://www.letterror.com/code/robofab/objects/model.html">RoboFab Object Model</a><br>
      <a href="http://mail.letterror.com/pipermail/fontlab-scripting/">FontLab Scripting Archive</a></p>
      <p>and lastly, the <a href="wiki/RoboFab" class="wiki">RoboFab</a> documentation which will be in your RoboFab folder (if you have it installed) here: Documentation/robofabDocs/robofab.html</p>
      <p>A quick plug for <a href="wiki/Typgraphica" class="wiki-create">Typgraphica</a>, there is a quick <a href="http://typographi.com/000978.php">article</a> up there now, which I wrote, that details an introduction to RoboFab. </p>
      <p>Quickly, however. There are two things here. The first is a need to know something (and only a little something) about programming. O’Reilly is a good source of books on programming languages and theory. They have several good python books to get you up to speed. The second is the fontlab specific python. Personally, I find that using RoboFab can help speed things up a great, great deal. The FontLab python interface isn’t as clean or intuitive as the RoboFab one.</p>
      <p>Example. Today I wanted to copy only the side-bearings from one of my fonts to another. Sounds simple, but trying to do it by exporting AFM files and the like doesn’t work, as you import widths that you don’t want. So in about 15 minutes I wrote this:</p>
      <p><code><br>
      #FLM: Copy Font Side-bearing</code></p><code>
      <p>#Imports<br>
      from robofab.world import OpenFont, CurrentFont<br>
      from robofab.interface.all.dialogs import Message</p>
      <p>fontToChange = CurrentFont()<br>
      orignalMetricsFont = OpenFont(None, "Which font's sidebearings do you want?")<br>
      orignalMetrics = {}</p>
      <p>for glyph in orignalMetricsFont:<br>
      [tab]orignalMetrics[glyph.name] = [glyph.leftMargin, glyph.rightMargin]<br>
      [tab]print orignalMetrics[glyph.name]<br>
      orignalMetricsFont.close()</p>
      </code><p><code>for name, metrics in orignalMetrics.iteritems():<br>
      [tab]if fontToChange[name]:<br>
      [tab][tab]fontToChange[name].leftMargin = metrics[0]<br>
      [tab][tab]fontToChange[name].rightMargin = metrics[1]<br>
      fontToChange.update()<br>
      Message('Done changing side-bearings')<br>
      </code><br>
      <strong><em>Replace [tab] with an actual tab</em></strong></p>
      <p>Much, much easier to do this in RoboFab than it is through FontLab’s python. Or by hand.</p>
