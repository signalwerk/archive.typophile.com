  - id: 363938
    user: 1215
    date: 2009-08-25T13:43:00
    date_raw: 25 Aug 2009 — 1:43pm
    votes: null
    html: |-
      <p>"@fontface" is a declaration in CSS* that allows a specific font which may not be on a viewer's machine to be loaded along with the web page and thus allow a web page to display text rendered in something other than "web-safe" default fonts -- as a font, not as an image.</p>
      <p>Different browsers have different implementations of this @fontface declaration, supporting different font formats, etc.</p>
      <p>Web designers find it cumbersome and a nuisance to keep track of all the different variations in code and formats to address the idiosyncrasies of different browsers that their viewers may be using. It is also confusing and frustrating for well-intentioned designers to understand which, if any, of the fonts they have or want will allow such a use as part of a font vendor's End User License Agreement (EULA).</p>
      <p>On the other side of the equation, most vendors do not have licensing models for allowing use of their fonts for this kind of web "embedding." Most are reluctant to allow this use because some of the current browsers only support @fontface with "naked" fonts (i.e., the same OpenType or TrueType font format that can be installed directly on a desktop machine and used for any other purpose) and the security against these fonts being rather inadvertently or innocently acquired and used elsewhere is minimal.</p>
      <p>Enter TypeKit (among others) as a service. They arrange with foundries to offer typefaces for use as web fonts (taking advantage of @fontface to serve up fonts to the web page). They host the font files on their own server and take pains to obfuscate the location and the contents of those files in various ways, to add a layer of security against misappropriation that their partner foundries accept. </p>
      <p>Web designers who subscribe to the service select from the fonts on offer and are provided with copy-and-paste code that allows them to utilize these fonts in their web pages via CSS stylesheets, without having to worry about the details of the evolving technology and with confidence that they are correctly licensed. Typekit takes care of making sure that various browsers are served the appropriate formats in such a way that maximum compatibility and consistency is provided for the design.</p>
      <p>Essentially TypeKit is building a bridge between web designers and font vendors by taking care of the messy muddle in the middle in terms of both technology and licensing ins and outs.</p>
      <p>I hope I've stated this clearly for you and that my understanding does an adequate job of representing the essence of the situation.</p>
      <p>Others can correct any oversimplifications or add any essential elements that I've skipped.</p>
      <p>-- Kent.</p>
      <p>[Edit]: * Sorry, I forgot to explain: CSS stands for Cascading Style Sheets and is used hand-in-hand with HTML for formatting and styling web pages.</p>
