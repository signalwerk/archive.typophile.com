      <p>@david berlow<br>
      "<em>But I didn’t realize hinting was an issue, EOT’s users rely entirely on ignoring most TrueType Instructions, don’t they?</em>"</p>
      <p>No. Untrue. EOT is just a wrapper around a TT file. When the browser receives the font data, it's processed exactly the same as if it had come from a font installed in the operating system. No instructions lost, none added. No visual difference in rendering at all. </p>
      <p>@all<br>
      In an earlier post on this thread I mentioned Cufón text replacement. I've been revisiting it, playing around with sub-setting and trying to solve the problem of making the replaced text selectable, cross-browser. (With some good results,too.)<br>
      <strong>Factoid:</strong> Cufón works quite well with CFF fonts. Unlike EOT, Cufón ignores, because it doesn't rely on, hinting instructions in TT files.</p>
