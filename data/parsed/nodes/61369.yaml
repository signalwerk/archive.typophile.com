      <p>JH&gt; ...reliance on hinting is significantly reduced — and in Apple’s Quartz rendering is, literally, removed completely.</p>
      <p>This is because Quartz <em>does</em> (ahem), match the color that the type would normally print very closely. This does not mean however, that the screen matches the 'readability' of that print. Something's going to happen to help that though, because Apple now thinks people do read, after all. </p>
      <p>JH&gt;If it were a sans serif, or perhaps a slab serif, you might approach 85-90%. Otherwise I would put it closer to 60-70%, overall (italics, or something like Gabriola more in the range of &lt;50%). </p>
      <p>And what if your library contained 50% fonts not close to 'normal' width <em>or</em> 'normal' weight?  Sounds a lot like your library could use at least Electronic (PA) Recommendations, even if only 'you' can read them, they'll be informing to 'sales' and to the better gasps on the planet;).</p>
      <p>JH&gt;... <strong> this is not always or even mostly a good thing, and I’d like to have more hinting control not less.</strong></p>
      <p>More? lol<em>Trust me, you'd like to have total hinting control and decide what parts of a 'complete interoperable standard' you need to apply for a particular specification, narrow or broad. </em></p>
      <p>DB&gt;Oh? “regular” in what way?<br>
      RF&gt;OK. Point taken.</p>
      <p>But how deep? ;)</p>
      <p>To bring us back to the topic, we hope this is not Typekit's job alone. ;)</p>
      <p>Cheers!</p>
