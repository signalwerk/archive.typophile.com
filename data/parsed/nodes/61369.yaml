      <p>Oh, call me on my hyperbole, why don't you, David. Fair enough.</p>
      <p>We, in this case, is Ross, who actually does the hinting and, sensibly and non-hyperbolically, estimates:</p>
      <p><em>If it were a sans serif, or perhaps a slab serif, you might approach 85-90%. Otherwise I would put it closer to 60-70%, overall (italics, or something like Gabriola more in the range of &lt;50%). This accounts for simple glyphs which may need no further instructions added in VTT as well as those in which FL is simply unable to isolate features of anatomy that do require more instructions, or indeed fixing instructions that FL adds that make no sense, or that are redundant/conflicting etc.</em></p>
      <p>These is based on an FL -&gt; VTT conversion workflow we developed a couple of years ago that allows us to either leverage FL auto stem hinting or manual PS hints in VTT, avoiding much of the drudge work of drawing spaghetti in VTT.</p>
      <p>The larger point I was making was that, in subpixel rendering environments, the reliance on hinting is significantly reduced -- and in Apple's Quartz rendering is, literally, removed completely --, to such a degree that autohinting even on the FL PS-&gt;TT model can be effectively leveraged for a lot of purposes. And let me be completely clear about this: <strong><em>this is not always or even mostly a good thing, and I'd like to have more hinting control not less.</em></strong></p>
      <p>But given that people are talking about, apparently without humour, about using CFF OpenType fonts on the web, I think it is entirely valid to point out that half-decent autohinting of those same fonts converted to TTF is going to look better than the CFF versions, at least with today's system PS rasterisers. Will these fonts look as good as carefully designed and hinted native TTFs intended for reading on screen? No. But they will still look better on screen than CFF fonts.</p>
