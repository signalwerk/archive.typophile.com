      <p>The triple play!</p>
      <p>&gt;Simon, come over here to the ’sidelines’ and let me know when you all can get to ’tomorrow’, where I will be waiting ’patiently’ and will then explain to you why there are no ’custom fonts’ for the web.</p>
      <p>In terms of delivery mechanism it seems as if there's some convergence around the Let-Tal-Error proposal as a long term solution and a compatibility format based on EOT. </p>
      <p>Rendering consistency, the strength of Flash, seems to be the Achilles-heel, perhaps the long term solution here might be a property in the font that makes recommendations about how the font should be rendered, or perhaps CSS properties that define rendering style?</p>
      <p>&gt;So where is the OpenType in eot?</p>
      <p>If you mean CFF, then the answer is Windows 7, and with a bit of luck in a service pack for older versions of Windows.</p>
