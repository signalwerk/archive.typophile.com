      <p>David: <em>Trust me, you’d like to have total hinting control and decide what parts of a ’complete interoperable standard’ you need to apply for a particular specification, narrow or broad.</em></p>
      <p>Yes, sometimes I'd like to have total hinting control. Other times I look at the same typeface printed on two different paper stocks, or from two different laser printers claiming the same resolution, and think that the lack of control that we face in different screen rendering technologies isn't anything new. Then I go back to this</p>
      <p><a href="http://www.tiro.com/John/Baskerville-a.jpg" title="http://www.tiro.com/John/Baskerville-a.jpg">http://www.tiro.com/John/Baskerville-a.jpg</a></p>
      <p>(all taken from a single page) and ask myself whether there is any such thing as a typeface except as a source of limited but uncontrolled variation.</p>
