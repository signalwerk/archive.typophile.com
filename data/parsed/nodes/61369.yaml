      <p>David: <em>So where is the OpenType in eot?</em></p>
      <p>In a TTF-flavoured OT font? In a TTF with optional OTL tables? In a TTF that contains table versions and fields that are not part of any format spec except OT?</p>
      <p>One might also ask where's the OpenType in CFF?</p>
      <p><em>Duh!!! as if TT wasn’t invented for a reason!?</em></p>
      <p>TT was invented for a number of reasons, but I presume you are referring to why the TT hinting model was designed to be different from the PS model. Very good reasons c.1990. Very good reasons in black and white pixel display. But when we're spending weeks producing VTT hint sources for fonts targeted at ClearType, whose results in ClearType are &gt;95% identical to FontLab autohinting, and in WPF are almost identical to no hinting at all, how relevant are those reasons?</p>
