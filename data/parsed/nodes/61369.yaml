    html: |-
      <p>TypeKit is one of many web-sites-as-a-service that allows you to put some javascript on your page that, in turn, will automatically load the appropriate javascript and/or css files necessary for you to load typefaces onto your page for use in standard HTML.</p>
      <p>They have arisen for a few reasons (IMHO, of course):</p>
      <p> - convenience for the web designer...we just add one line to our HTML to set it all up<br>
       - perceived protection for the type designer (there's a certain level of obfuscation that many foundries find acceptable over directly uploading fonts to your own server)<br>
       - pricing options. It appears that, at least with typekit, there will be a buffet-type pricing scheme.</p>
