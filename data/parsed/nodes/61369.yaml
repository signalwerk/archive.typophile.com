      <p>&gt; This is a big problem </p>
      <p>Actually I think it's the *biggest* problem - once you get the whole licensing thing out of the way.</p>
      <p>In Windows CFF fonts are generally rendered using a separate "black-box" PostScript rasterizer licensed from Adobe. </p>
      <p>For the Web, what's cool about services like Webkit is that they can serve different fonts to different browsers running on different platforms depending on the rendering style of the browser, type of display etc., Something that's incredibly hard to do on a case-by-case basis for the average web site owner, unless they are working side by side with a font vendor who can provide a set of custom fonts - people like Font Bureau or Ascender.</p>
