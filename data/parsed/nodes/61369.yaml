      <p>@john hudson, sii, karsten, et al...</p>
      <p>Love these threads that veer off unexpectedly into the heart of the matter. There is much to mull over here and assertions to confirm (including my own). John - I'll try to get clarification on the capabilities of the IE8 rendering engine.</p>
      <p>And Christopher, I hope you now understand what Typekit is!</p>
      <p>@sii<br>
      "<em>Rendering consistency, the strength of Flash, seems to be the Achilles-heel, perhaps the long term solution here might be a property in the font that makes recommendations about how the font should be rendered, or perhaps CSS properties that define rendering style?</em>"</p>
      <p>Yeah, there's got to be a switch to flip somewhere along the line.<br>
      Some people participating in this thread might be familiar with an alternative font-linking technique called Cufón. In Windows, Cufón renders headline-sized text beautifully. With Flash-like antialiasing and features. You can get gradients, shadows - very nice stuff. It relies on JavaScript alone.<br>
      In IE, Cufón uses VML (Vector Markup Language) and in Firefox and Safari is uses the Canvas tag.<br>
      It has drawbacks, problems with text-selection and such, but based solely on the way the text looks, it begs the question, "Why can't I just specify that a block of text be rendered this way and have the browser take it from there?" After all, if you can get smooth, good looking curves with VML, it's obvious the browser is capable of it. It can be done, period.<br>
      A CSS property perhaps, like visibility:vector or somesuch.</p>
      <p>@davidberlow</p>
      <p>&gt;You think you don’t know what “I’m talking about” and need a course in Berlow-speak</p>
      <p>There is a big difference between my "not knowing what you're talking about" due to your inimitable writing style, and my thinking that you don't know what you're talking about.<br>
