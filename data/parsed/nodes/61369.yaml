      it's the former, not the latter, and I assume that anyone who writes as uniquely as you do is quite aware of what he's doing and is fully prepared for some good-natured ribbing, which is all I intend. Plus, telling anybody "you don't know what you're talking about" is rude and counter-productive. If I have offended you, I apologize.</p>
