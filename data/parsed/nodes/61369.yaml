      <p>JH&gt;Yes, sometimes I’d like to have total hinting control. Other times I look at the same typeface printed... [] and think that the lack of control that we face in different screen rendering technologies isn’t anything new.</p>
      <p>Well, it is something new, if not by percentage of error per feature, then certainly you can imagine a parallel situation in Baskerville's world, where the clients of his type were somehow enabled to reheat type from a letter to whole pages, and let 'whatever' loose on his types, (except perhaps pure ink of any color, and especially not Black)... while the "Baskerville" label remained prominently displayable, and unchanged for all to see?</p>
      <p>As many unfounders confirmed to my ears in <a href="http://www.flickr.com/search/?q=atypi+mexico"> Mexico </a>, there is a 'rendering problem" on the web as a result of there being a difference between hot metal's inadvertent glyph variation spectrum, and the web's, (ahem) glyph variation spectrum at the bottom of the resolution spectrum. </p>
      <p>Imagine all of our surprise, to maintain thread integrity, including of course Typekit,;)</p>
      <p>Cheers!</p>
