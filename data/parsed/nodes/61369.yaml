    html: |-
      <p>@christopher dean</p>
      <p>"<em>So it lets a web designer use a font that s/he owns, and a user can see it even if that don’t have it installed?</em>"</p>
      <p>Almost. It lets a web designer use a font that s/he licenses for use from the font service, like Typekit, even though the user doesn't have it installed in their operating system.</p>
      <p>On a technical level, it works similarly to the way block ads - like the ones for Font Bureau here at Typophile - are included in the page. Similar principal except instead of including a link to block ad images, the link is to font data. Both are handled by Javascript that creates the HTML and CSS necessary to link to the correct resource on the fly as the page loads in the browser.</p>
