      <p>Ignorant of the history of the face as a youth, I never missed the relation between lowercased blackletter and insuated violence. I think pointed bottoms are intentionally exploited to that end.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Megadeth_logo_chrome_5913.png"></div> <div class="imageWrap"><img src="http://typophile.com/files/unleashed_logo_4912.jpg"></div><br>
      The same could be said of select grunge, theme or abstract fonts, or any where strong downward points will appear in some of the fonts. Curves, swirls and softly rounded edges appear peaceful, while barbed, jagged and pointy don't. In the relatively minor section of metal bands that do use blackletter in logos, they always pick the sharpest ones, like the hatebreed example up above.<p></p>
      <p>When I was designing and naming !The Black Bloc, I was specifically looking to create a softer, or more ambigous version of blackletter, to challenge its datedness and screw with its violent reputation.</p>
      <p>Turns out, it's been popular with 'tough girls'. Guess I didn't go far enough.~</p>
      <p>On gangs, Cuttlefish nailed it. In America, today's youth are pretty far removed from the Nazi-era fashion (&amp; not too apt to study type history. But the observation of the "officialness" of ornate blackletter caps has lent them a sense of melodrama that gangs, and other melodramatic teens/young adults enjoy. </p><div class="imageWrap"><img src="http://typophile.com/files/sublime_4361.jpg"></div><br>
      I've observed tattooist and patrons mixing blackletter caps with latin lowercase, immediately after some newspapers began doing the same thing in the 1990's. And in those body-mod circles, it is referred to nearly exclusively as "Old English", even if it pulled directly from a German source.<p></p>
