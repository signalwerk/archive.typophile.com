      <p>"I would be interested in the story of why within Germany itself they avoided blackletter after WWII. Was there any association by Germans of fraktur with the Nazi era? Was it a product of the occupation by the Allies? Was it an extension of the Nazi ban on blackletter? A combination?"</p>
      <p>One thing before:<br>
      There was a strikt order from Deutsche Wehrmacht for signs and posters in all occupied east european countries, Poland, Russia, to use only Antiqua or Grotesk fonts. The reason was: The people in these countries could not read "Fraktur"-Fonts (Blackletter). So it made no sense to hang up posters in blackletter.</p>
      <p>After World War II.. its is difficult to explain for me, as a german, to you guys. I'll try to be honest and do not want to offend anyone, okay?</p>
      <p>The "normal" german was lucky to survive the war. That's all. Everything was "kaputt" and everyone was missing husband or wife, children, brother or whomever. Lots of their beloved were dead. Winter '46 and '47 were very hard and most of the houses in the cities were bombed. The people wanted to eat, to sleep and to find their families. Nobody was interested in fonts.</p>
      <p>I can only speak for the people in West Germany, I guess in East Germany it was worse. From end of the 40ies it became better. And the Allies in each zone of Germany set the standard: Music, newspapers, culture, and fonts. 12 years nobody was allowed to have his own suggestions. Now they believed in becoming freedom and a better life. Yes, I am sure that - for a while - the germans worked out a kind of mimikry "Let's look to the americans/english soldiers to know what is good music, fashion and culture."</p>
      <p>The use of blackletter was old fashion. That's why it was not used anymore. But that's all. I do not think anyone in Germany thought blackletters are Nazi stuff. It was as old as "Deutsche Gemutlichkeit" (you know that "typical german having fun? argghh..)</p>
      <p>Okay, I did my very best. Hang me.</p>
      <p>Georg</p>
      <p><a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a></p>
