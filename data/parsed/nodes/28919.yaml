      <p>Here's what I know about the association between blackletter and Nazis in the US. Prior to WW2 blackletter was used regularly in specific contexts: newspaper nameplates, headings for church documents, headings in diplomas, beer names and anything trying to appear 'olde English' or German. </p>
      <p>These connections remained after WWII, but for most people the additional Nazi connection was added. This is because outside these very specific traditional contexts blackletter was rare. And so the films from and about the Nazi era were the main place Americans saw blackletter, particularly used as text. Hence the new connection. </p>
      <p>Those who knew German--such as refugees, Jewish and non-Jewish--were of course aware that blackletter was far more general and historical. Hence Jewish organizations knew better than to have any bias against blackletter as a special Nazi invention. </p>
      <p>As to inherent feel, I don't think blackletter is inherently agressive. It depends on how it is treated. Terminals can be made dagger-like, but so can roman fonts.</p>
      <p>I would be interested in the story of why within Germany itself they avoided blackletter after WWII. Was there any association by Germans of fraktur with the Nazi era? Was it a product of the occupation by the Allies? Was it an extension of the Nazi ban on blackletter? A combination?</p>
