      <p>@ Thord</p>
      <p>Oh no, I am not offended, why should I?</p>
      <p>What I see again and again in discussions like the one Tim Ahrens postet:<br>
      <a href="http://www.fontblog.de/fraktur-ist-auch-eine-nazi-schrift" title="http://www.fontblog.de/fraktur-ist-auch-eine-nazi-schrift">http://www.fontblog.de/fraktur-ist-auch-eine-nazi-schrift</a></p>
      <p>is that lots of the typography professionals in Germany (its a german forum discussion, what Tim listed above) are not familiar with their own history.</p>
      <p>Example:<br>
      Just the start of the discussion shows two pictures:<br>
      Picture two (right side) is showing a poster for a 1. Mai "meeting". Its from 1938, when the Nazi government was established since 5 years. So it was not a 1. Mai demonstration of the workers, it was a Nazi demonstration and to go there was a duty.</p>
      <p>The left picture has nothing to do with the Nazi. "Luftschutz" means proctection against air attack. These organisations were organized in all european nations since approx. 1923. Of course there was a german army "Reichswehr" before 1933. But this was not a Nazi organisation.</p>
      <p>And of course the font for the word "Luftschutz" was a blackletter. Because this was the common font in the 20ies. I am sure no one of the discussion members know these details. But its typical. Exactly in this way the bridge from blackletter fonts to Nazism was built.</p>
      <p>Blackletters in Germany were used since 16th century - 400 years. But only 12 years from 1933 up to 1945 the Nazi dictatur was present.</p>
      <p>Georg</p>
      <p><a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a></p>
