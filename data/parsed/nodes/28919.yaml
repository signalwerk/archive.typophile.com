      <p>Thord, I think it's very difficult to generalize, and that each instance of "type specification" has its own multiplex cultural determinants, the combination of which is often quite whimsical and serendipitous.  For instance, consider this:</p>
      <p>Blackletter newspaper nameplates originated with the 1712 introduction of newspaper taxes in Britain, when the sudden increase in paper costs forced publishers to economize on the amount of space alloted to the title line, minimizing its type size and choosing the darkest type then available, which was blackletter. (John E . Allen, Newspaper Designing, Harper, 1947). </p>
      <p>Quite by coincidence, when newspapers became a mass phenomenon around 1900 (due to various factors, notably the Linotype), the trendy style in typography was Kelmscott-inspired (William Morris) mediaevalist Arts and Crafts. Many papers which had Roman mastheads switched to Blackletter at that time, for instance the Birmingham News (Alabama), and have stuck with it to this day.</p>
