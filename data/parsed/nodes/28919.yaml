      <p>Dear Franz Heidl,<br>
      yes, I understand what you mean.<br>
      Of course I accept your opinion as you do with mine.</p>
      <p>"Luftschutz":<br>
      I did not say that this organisation had nothing to do with the Nazi party. Of course they had from 1933, because all organisations were overtaken by them.</p>
      <p>What I said is:<br>
      After World War I, which ended 1918, it was forbidden for Germany to have an army with more than 100,000 men. They were not allowed to build up an air force. The so called "Reichswehr" re-organized the army in a more or less tricky way. It was and it is no question that a nation is allowed to have an army? So Germany had one after 1918. And one part of it was an organisation for flight bomb attacks. This was organized long before Hermann Göring became Flight Marshall in 1933. And long before Germany spend more and more for arming up.</p>
      <p>Back to the picture we speak about:<br>
      Every german soldier after 1933 was wearing a Nazi symbol from any organisation. This is exakt what is ment by "overtaking" (or, in german: Gleichschaltung). This soldier on the poster does not. His helmet is a model M 18:</p>
      <p>From 1933 it was a model M 35:</p>
      <p>----- This was too much with the pictures. Its easy to find it by Google. ------------</p>
      <p>I know it is difficult, but this are the facts.<br>
      It shows how easy it is to think in cliches - for everyone, including myself.<br>
      Georg</p>
