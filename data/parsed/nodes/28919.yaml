      <p>No problem Alex. What you are talking of is the mentioned “Bormann Decree”. I also found a quote that might cast some light on your question about why it was abandoned.Although I suspect not everyone here will agree with the statements:</p>
      <p>"The Nazi resurrection of Fraktur type offers another historically important example of ideology in typography. Fraktur, a typeface initially prized by the Nazis for its "German-ness," symbolized a totalitarian politics that valued style over content. Not surprisingly, once early victories "encouraged them to look beyond Germany's borders, the Nazis, quickly recognized the usefulness of a plainer, more 'European' style, banned Fraktur on 3 January 1941 as a 'Jewish invention."<br>
      Surrogate multiplicities: Typography in the age of invisibility<br>
      Visible Language,  2001  by Salen, Katie</p>
      <p>Thord</p>
