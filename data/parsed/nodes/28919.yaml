      <p>&gt;But there is’nt one.<br>
      &gt;Its not the fonts’ guilty but the people ones.</p>
      <p>Of course, the typeface is not 'guilty' or innocent for that matter. But the reality is that typefaces have emotional associations, deserved or not. In the US there are a number of associations of blackletter, one of them being with the Nazi party. </p>
      <p>1. Church uses. Here there is no association with violence. </p>
      <p>2. Newspaper Nameplates. Again no association. </p>
      <p>3. Beer names. Here the association is with Germany, but not with the Nazi party. </p>
      <p>4. Nazi party. Since, as Tim's link explains, the Nazis identified Fraktur in particular as the 'true German script' and used it in their propaganda until 1941--and post-war Germany largely abandoned black letter--this is one association. </p>
      <p>5. Heavy metal bands. Here perhaps starting with the AC/DC logo heavy metal bands have used blackletter. This music tends to be angry or despairing, so there may be some emotional link with Naziism. Not with the AC/DC logo itself, I should note. However, a sub-genre of heavy metal are the 'skinhead' or neo-Nazi bands, so there is an association with both Naziism and violence here.</p>
      <p>I'm sure there are other associations as well, but these are the first that come to mind.</p>
