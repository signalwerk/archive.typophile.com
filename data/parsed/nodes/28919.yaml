      <p>Complaints of absolutism are irrelevant and simplistly ill-tempered. It also doesn't matter if William was grossly oversimplifying things. It is wiser to err in descriptions of WW2 on the side of horrorific, until it makes one externalize it. There were enough witness; "a good number" of the Jewish were persecuted, and their businesses were confiscated and destroyed. Existential doubts of existence beyond one's mind aside, arguing with that pretty much suggest a need for new medicine. Regardless, business prospects were poor for known Jews. If the name 'Chadim' was indeed obviously Jewish, it woulda gotten "some quantity" of grief. Of course, what we don't know is if:</p>
      <p>It's been around since 1905, minus the war years<br>
      Same business, with a revised name sometime post-war<br>
      It was temporarily called Moe's Tavern for a tense era in the 40's<br>
