      <p>To Chris. I have of course no intentions of writing a normative thesis. You seem to imply that I am suggesting graphic designers should not be able to choose whichever tools they wish. This couldn’t be further from the truth. </p>
      <p>There can be little doubt that there are many good examples of use of blakletter where there are no associations to violence or danger. But sticking to your analogy of tools, the same could be said of the knife. Most knives are designed for and used for peacefull purposes and I’m certainly not afraid when I open my kitchen drawer. But this does not change the fact that a part of the nature of knives is that they are sometimes misused as a tool of violence. </p>
      <p>Good graphic design is good communication. When working with it you need to take into consideration how the public interprets the work. If not you will have no understanding of the effects of the tools that you use. This is why an understanding of peoples interpretations should be interesting to any graphic designer, no matter how mislead and ignorant they are. If my work, as a graphic designer, is misunderstood by the public I have failed, no matter how right my intentions are.</p>
