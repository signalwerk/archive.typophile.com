      <p>And we know the policy was ruthlessly and efficiently enforced by the Nazis, directed by Adolph Eichmann. It was also enforced by Nazi gangs who regularly went around beating Jews and destroying businesses. Then subsequently during the war Jews were systematically hunted down and killed. Hence it is inconceivable that any openly Jewish retail business could have operated in Vienna throughout the war. The 1000 out of 200,000 Jews who were still alive and in Austria at the end of the war didn't survive by being openly Jewish. They were either hiding or hiding their Jewishness. They certainly weren't openly running a retail business in Vienna during the war.</p>
