      <p>Skimming through, I read someone suggested that Fraktur was associated with facist Germany, but I don't believe this to be the case. In fact, the Nazi's rejected fraktur because of it's "fractured" appearance and what it represented; a break from the true German blackletter.</p>
      <p>Taken from <a href="http://en.wikipedia.org/wiki/Antiqua-Fraktur_dispute" rel="nofollow">wikipedia</a>:</p>
      <p><strong>The “Normalschrifterlass”</strong><br>
      <em><br>
      The Fraktur typefaces reached a particularly strong use during the time of the Nazism. After it had been initially publicised as being the only true “German script”, they were banned in a Schrifterlass (edict on script) as alleged Schwabacher Judenlettern (“Schwabacher Jewish script”).</em></p>
      <p>It is supposed that the reason for this change of mind was that Antiqua would be more legible to those living in the occupied areas, since the Fraktur typefaces were no longer well known outside the countries of German language. This hypothesis is contested by the fact that the Nazis had been printing books, newspapers and miscellaneous texts destined for abroad in Antiqua for a long time. Therefore, they would have been able to print everything for the occupied areas in Antiqua without the need to change the use of typefaces in the German-speaking areas.</p>
      <p>It is more likely that Adolf Hitler was the reason for the ban. He appeared to have a dislike for the Fraktur typeface, as demonstrated by a declaration made in the Reichstag in 1934...</p>
