      <p>&gt;when they discovered it had jewish roots or so.</p>
      <p>No, the story has been related here before. As I remember the story, at some point the Nazis realized to administer their conquered territories they had to use roman, which was also the only thing available in local printing plants. So they made the ridiculous 'discovery' that blackletter was Jewish. This was just one of the piles of Nazi lies. Except for the original Roman caps, all the latin letter forms in the 15th century, when printing came in,had been of course developed by Christian scribes.</p>
      <p>Here's a <a href="http://german.about.com/library/gallery/blfoto_fraktur06.htm" rel="nofollow">link to the 'Bormann Decree'</a>, which rejected blackletter.</p>
