      <p>To Alessandro: Thank you for your feedback. I had actually already ordered the book from Amazon, so I hope that will be helpful for my essay. And the previous discussion here at typophile has also been helpful. No to mention the Eye article which seems to be very in tune with what I am trying to say. They often are…</p>
      <p>And to Bleisetzer: I hope I have not offended you. I am as fond of blackletter as you seem to be. I am aware of the history of this style, at least to some degree, and that there is no relationship between the origins of blackletter and violence. But most people will not have that knowledge about the history of typography. As you point out I will need to explain why, and if, there is a conection between the two.</p>
      <p>In my opinion it all comes down to the thing that is so frustrating and intriguing about type-design. That you are seldom able to control or predict what the type will be used for, and so the meaning of it evolves and changes through time. As it is pointed out in said Eye article.</p>
