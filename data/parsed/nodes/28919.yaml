      <p>How it is used is the key for usetoday.  Blackletter shouldcrtainly be available as a typgraphic tool just like any other type style. When it is used with evil images as seen in horror films, it gets the evil devil look. When used in religious material it gets the old church look. When used on white supremicist skin-head propaganda, it gets the nazi look.</p>
      <p>There is much more to typography than choosing a typeface.  Content and context matter. Let's give graphic designers and typographers the option of using the tool in a good way.  There was a great deal of typewriter text used by hate groips a few decades back when there were few options. Nobody stopped using typewriter for everything else.</p>
