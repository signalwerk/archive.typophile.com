      <p>"You seem to imply that I am suggesting graphic designers should not be able to choose whichever tools they wish."</p>
      <p>I did not mean to imply that at all. I was just trying to ask that you be sure to include blackletter work that did not fall into the nazi/hate mould. This would tell more of the whole story and allow designers to choose type without being fearful of accusations of pro-nazi beliefs. There is a fine line between honest scholarly reporting of events and historical interpretations and feeding the conclusion more credence than it may deserve. I am only asking that you remain objective. That is all.<br>
