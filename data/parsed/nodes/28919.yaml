      <p>Dear Thord,<br>
      what are the results of your essay? I´m working on a quite related topic, i.e. the renaissance of blackletter in popular culture like fashion, design etc. My thesis is that this violant image has originally raised from its image as a Nazi Type, and that it is exactly this generally violant, extreme connotation which caused the notable comeback of black letters in mass culture (H&amp;M T-shirts, MANGO shopping windows, etc.). I will argue that this phenomenon is to be seen in context with the commercialization of subcultural styles and symbols, for example tatoos or piercing ("H&amp;M-Punk" or "The end of Subculture"). So this denazification of black letter (as some German typographs call it) or in the broader sense "deradikalisation", is not the cause but the effect of overstraining the very radikal connotation. </p>
      <p>I would like to read your essay, if you allow me to. Could you send it per email?</p>
      <p>Kindly regards, Corinna</p>
