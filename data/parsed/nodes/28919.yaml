      <p>While I don't associate blackletter with Nazism (or even the NSDAP) at all, it is really silly to assume that others don't. I think that it can also border on the offensive to state that other people's opinions, especially on matters of life, death, interpretation, and even history do not matter or count. Debate people you disagree with, but please do not dismiss their views offhand.</p>
      <p>At least in my opinion, I doubt that Judaism as a religion, or modern-day Jews as a group, automatically associate blackletter with violence. Below is an image from the new synagogue in Worms. Worms has a particularly sad history when it comes to Christian–Jewish relations. Jews were slaughtered repeatedly over a millenium there, from the First Crusade (where they were some of the first victims) through to the 1940s. Yet, as you can see on this stone, they clearly don't have a problem with blackletter (or German either…). Maybe they picked this gothic-style lettering because its forms, of all possible Latin variants, match Hebrew the best. This could be a good starting point for Hrant's blackletter history of Yiddish…</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Worms-Synagogue-Inside_6295.png"></div><p></p>
