      <p>Complaints of absolutism are irrelevant and simplistly ill-tempered. It also doesn't matter if William was grossly oversimplifying things. It is wiser to err in descriptions of WW2 on the side of horrorific, until it makes one externalize it. There were enough witness; "a good number" of the Jewish were persecuted, and their businesses were confiscated and destroyed. Existential doubts of existence beyond one's mind aside, arguing with that pretty much suggest a need for new medicine. Regardless, business prospects were poor for known Jews. If the name 'Chadim' was indeed obviously Jewish, it woulda gotten "some quantity" of grief. Of course, what we don't know is if:</p>
      <p>It's been around since 1905, minus the war years<br>
      Same business, with a revised name sometime post-war<br>
      It was temporarily called Moe's Tavern for a tense era in the 40's<br>
      It was one of the few that somehow, through an odd quirck of fate, survived and stayed open, openly Jewish-owned</p>
      <p>or, and this is why the parts you nit-picked are void,</p>
      <p>Maybe it isn't a Jewish surname. Of course, no one found the answer, so what difference do attacks on that sub-thread make? And we can't presume an answer, for if it was indeed a Jewish surname, it would have likely have been trashed, but then, if it survived that, they would be very likely to subtlely advertise that today. The odds weigh against each other.</p>
      <p>Okay, sorry everyone for taking the childish trollbait. I'm done.</p>
      <p>Back to the topic at hand. I'd have to say that if there was a Nazification of Blackletter, it all happened so fast that that there certainly had to betons of Germans, including Jews that had been using it since the 19th century's end. Fonts were enduring, governments were not. What would they care if another government used the same font the last few had? If America were to change governments twice in our lives, then be taken over by an oppressive extremist party, and they started their regime endorsing Times New Roman (before dropping it), would that mean anything at all to even a typographer, or would there possibly be more pressing issues?</p>
      <p>I would love to hear more about Thord's 3rd conjecture, regarding legibility, and clique adoption. It puts Blackletter forward as a sort of slang or jargon for creating exclusivity. Are there parallel examples with other faces?</p>
