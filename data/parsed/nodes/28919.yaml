      <p>Lately I have avoided responding to Hrant's provocations as it just results in a torrent of insult and invective with little relation to the facts. However, here I did not want to let his attempt to minimise the holocaust pass. The result has, of course, been a stream of false and malicious insult and invective. </p>
      <p>&gt;Of course, what we don’t know is if: ...It was one of the few that somehow, through an odd quirck of fate, survived and stayed open, openly Jewish-owned</p>
      <p>Choz, we do know. First of all, as I wrote, all Jews in Austria were officially dispossessed of retail business--by <a href="http://www.nizkor.org/ftp.cgi/places/germany/ftp.py?places/germany//kristallnacht/documents.007" rel="nofollow">Goering's decree of 12 November 1938</a>. Officially no Jew could own a business, and this is not my 'absolutism' but simply the absolutism of Nazi policy.</p>
      <p>And we know the policy was ruthlessly and efficiently enforced by the Nazis, directed by Adolph Eichmann. It was also enforced by Nazi gangs who regularly went around beating Jews and destroying businesses. Then subsequently during the war Jews were systematically hunted down and killed. Hence it is inconceivable that any openly Jewish retail business could have operated in Vienna throughout the war. The 1000 out of 200,000 Jews who were still alive and in Austria at the end of the war didn't survive by being openly Jewish. They were either hiding or hiding their Jewishness. They certainly weren't openly running a retail business in Vienna during the war.</p>
      <p>In any case, as the <a href="http://web.utanet.at/chadim63/geschichte.htm" rel="nofollow">history of the Chadim shoe and leather repair business</a> makes clear, it has only been called 'Chadim' since 1980; I don't know whether that is a Jewish name--it is certainly not a common one.</p>
