      The war may be long gone but its presence in popular culture is still strong, through countless movies, computer games, books, comics, TV-series and endless documentaries. Thus people are subjected to the symbols of this era all the time, and although the taboo of these may be fading, the knowledge is still present. If anything I suppose one could argue that the associations to the Third Reich has been affirmed by the use of it in popular culture.<br>
