      <p>BTW- The impression I have had a about mexico ( &amp; south america ) and black letter is that  it has been seen as just another style for a long time. Lot's of stuff is set in it &amp; it means more &amp; more just 'mexican' or 'local' to them. </p>
      <p>Check out this bus in Ecuador </p>
      <p><a href="http://www.flickr.com/photos/jono01/23542795/" title="http://www.flickr.com/photos/jono01/23542795/">http://www.flickr.com/photos/jono01/23542795/</a></p>
      <p>Maybe it started with beer halls started by Bavarian immigrants. If so they were probably meaning this beer is 'German'. I don't know for sure. But blackletter became normal &amp; after a while contrasted with US type culture. I think that's why gangs in LA took up the blackletter. I don't think they had coolness or hardness envy for the hells angels or whatever. I think they were attempting to be seen as more Mexican. And then there is CA surf culture which adopted blackletter. Maybe because they were going to Mexico to surf. Betwteen the two cultural sources blackletter made it into Hawaiian graphic design where it's meaning seems to be again: local pride. The Hawaiian graphic designers are not being neo-nazi's. And where I live in Alaska we have big 4x4 trucks owned by native alaskans that have stickers in the back window that say 'native pride' in black letter. I can't say that this doesn't look a little odd to me. But that isn't the point. The point is how they read the meaning in the letter style. BTW - don't take my history too seriously. It's just my guesswork. One day I will get a shot of the sticker.</p>
      <p>Also has anybody metioned the work of Cristina Paoli?</p>
      <p><a href="http://typophile.com/node/17496" title="http://typophile.com/node/17496">http://typophile.com/node/17496</a></p>
