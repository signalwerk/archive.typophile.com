      <p>Nick, I think you’re right. I am starting to understand that my theme may be more complex than I had initially thought. </p>
      <p>The university course I am taking is called visual rhetorics, and it deals mainly with pictures. Most of my fellow students are not that familiar with typography and the idea that a typeface communicates was quite new to them. This is partly why I chose this theme. When I presented samples of Fette Fraktur they all had different connotations to the style, and they had strong opinions about its use. I suspect that I would not have gotten the same reactions had I shown them a sample of for instance “Trajan capitals”, as Solipsism pointed out. Their interpretations may be based on prejudice and ignorance, but it is still the way they perceived it, and I suspect that many other perceive it in the same way. It seems like blackletter types have stronger emotional connotations than most.</p>
      <p>As many of you have pointed out, there are a number of examples were the use of blackletter has nothing to do with violent or aggressive subcultures. But many of them seem to connect to a well-established custom. Beer labels, newspapers, churches and so on.</p>
    html_clean: |-
