      <p>Hi Corinna,<br>
      Interesting topic for your thesis. I didn’t go very much into the renaissance of blackletter. It seems like the fashion industry in particular has a healthy appetite for any cultural signs with a hint of danger. My impression is that the revival of blackletter has been a quite ephemeral one. Where I come from the blackletter-fashion is already over and fellow graphic designers will deny that they ever jumped on that bandwagon. It’s a bit sad that such an important part of our culture should end up as a “fashion victim”.</p>
      <p>My thesis was written in Norwegian, but I could sum up a few of my points, that might be relevant to you. The history of blackletter is described pretty well in Blackletter: type and national identity. It gives you some insight into why blackletter ended up being “nazi type”:</p>
      <p>From the outset, the opposition between blackletter and roman has been coloured by more momentous polarities: medievalism vs. modernity, Protestantism vs. Catholicism, Lutheran Pietism vs. Italian Humanism, German Romanticism vs. the French Enlightenment, the authority of the state vs. personal liberty and popular, nationalism vs. cosmopolitanism, mysticism vs. rationality. (Bain &amp; Shaw 1998 : 11)</p>
      <p>The formal qualities should also be considered. The sharp angular impression of some types of blackletter has aggressive connotations. I haven’t been able to find scientific research on how this is perceived in typography but there are several examples on research conducted on more simple geometric shapes, for instance in Reading Images:</p>
      <p>The triangle is angular, like the square – an element of the mechanical, technological order. But, unlike the square, the triangle especially when tilted is (a fused structure of) a participant and a vector, because it can convey directionality, point at things. (…) Not surprisingly, glosses of the meanings of triangles in visual dictionaries reflect the dynamic quality. Triangles are a symbol of generative power and represent action, conflict, tension. (Kress &amp; van Leeuwen 1996 : 236)</p>
      <p>As many have pointed out in this thread there are several examples of use that has no apparent connection to the nazi associations affiliated with blackletter. There is however a more general characteristic with much of its use. Blackletter often seems to be seen as a sign of authority. This may be explained by its heritage from times when written language and print was reserved for people and institutions with power. As someone mentioned here earlier it seems like much of the use of blackletter in modern subcultures comes from an intention to gain or imply some sort of power, importance or “official-ness” of some sort. But it is a washed-out discourse. Black-metal fans and rappers may want to seem dangerous and important, but the real institutions of power and authority in our society – the corporations and governments – have aesthetic preferences that reflects modern ideals of objectivity and rationality, so they choose Helvetica or similar neutral typefaces.</p>
      <p>It was hard to get my thesis down to 20 pages, so it’s impossible to break it down to a short post here. But I hope this was to some help to you.</p>
    html_clean: |-
