      <p>The German and Austrian Jewish community was the most assimilated in the world at the time, I believe. Vienna in particular was a magnet for converted Jews. For example, the parents of my own teacher, the late Karl Popper, were Jews who converted to Christianity. And he was one of those who had to flee Vienna. That he was nominally Christian  made no difference to the Nazis. According to the Encyclopedia Judaica, the Jewish community of Vienna in 1938 said that Austria had about 180,000 Jews, 90% in Vienna. Himmler's lists had 220,000 people targeted as Jews for persecution. In other words the numbers of converts and those of mixed descent numbered an additional 20% over the number of religiously identified Jews.</p>
