      <p>The original typeface is an Art Nouveau face from Bauer &amp; Co called "Alexandra", and in Petzendorfer's book (p.35) it is only upper case. The Solotype catalog calls it Washington Antique, with a solid and open version (p.21), also U.C. only. The one Dick found may have been graphically widened to produce the posted sample.</p>
      <p>- Mike Yanega</p>
