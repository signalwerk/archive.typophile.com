      <p>Yes, indeed!<br>
      And thank you again!</p>
      <p>So, summarizing, the answers are:</p>
      <ol>
      <li>Linotype <strong>Grafiko</strong> Regular.</li>
      <li><strong>Belwe</strong>, designed by Georg Belwe in 1907.</li>
      <li>ATF <strong>Washington</strong>, inspired from <strong>Alexandra</strong> from Bauer &amp; Co.</li>
      </ol>
