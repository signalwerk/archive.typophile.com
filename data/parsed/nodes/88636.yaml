      <p>Thank you both very much! And congratulations for your preparation!<br>
      Mike: the sample I gave is from 1936 and the catalog seems to be from this 1900 book: <a href="http://www.flickr.com/photos/fountaineer/408623158/in/set-72157594566933925/" title="http://www.flickr.com/photos/fountaineer/408623158/in/set-72157594566933925/">http://www.flickr.com/photos/fountaineer/408623158/in/set-72157594566933...</a> so maybe lower cases are an addition, but it's hard to say: follow your ideas, I found this font (called Gable Antique Condensed), also from Bauer and condensed (lower cases r and m look different): <a href="http://www.myfonts.com/fonts/spiecegraphics/gable-antique-condensed-sg/" title="http://www.myfonts.com/fonts/spiecegraphics/gable-antique-condensed-sg/">http://www.myfonts.com/fonts/spiecegraphics/gable-antique-condensed-sg/</a><br>
      Later I found American Type Founders Company 1885 catalogue (<a href="http://archive.org/details/specimensofprint00amerrich" title="http://archive.org/details/specimensofprint00amerrich">http://archive.org/details/specimensofprint00amerrich</a>) where we can see:<br>
      - Webster at pag. 263<br>
      - Washington at pag. 280 (I think it match my sample)<br>
      - Jefferson at pag. 281<br>
      - Lafayette at pag. 282</p>
