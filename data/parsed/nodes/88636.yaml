    date_raw: 14 Oct 2012 — 9:59am
    votes: null
    html: |-
      <p>I searched MyFonts for the Solotype fonts, suspecting that if he wanted to include this font he would need to change the name, since 'Lafayette', with a different design, is a Font Bureau font these days. It's not exact, but look at <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/webster/" rel="nofollow">Webster</a>. If you add stroke to make it bolder, it matches the sample pretty well except for the 'r', which could be modified easily enough. Solo says 'Webster' came from the Keystone Foundry in 1888, but he mentions that numerous other foundries had versions. My guess is they were 'inspired' by "Alexandra" from the German Bauer foundry. The practice was apparently common for foundries to copy popular typefaces and rename them, maybe with minor design variations.</p>
      <p>- Mike Yanega</p>
