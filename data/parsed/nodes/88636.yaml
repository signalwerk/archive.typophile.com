      <p>Looking at the showing of Lafayette in Dan Solo's "Victorian Display Alphabets" book, it's hard to see how you can get to this sample, because the u (for example) looks so much more closed in the actual typeface. I see that this was digitized for the Victorian font collection that Solo did for Dover Books. I'd guess the online copies are unauthorized ripoffs. </p>
