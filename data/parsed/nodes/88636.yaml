    html: |-
      <p>That is a great site and I agree that Washington looks like the right width. I think that is your answer, but I think it's clear that the American versions added the lower case, as an expansion of the older design. The Petzendorfer book does not give a year for the "Alexandra" design, but it would be interesting to confirm that it is older than the American versions in the ATF book. 1885 is in the Art Nouveau period, so there may not have been a big difference in years. Maybe this is too academic for your question?</p>
      <p>That was fun.</p>
      <p>- Mike Yanega</p>
