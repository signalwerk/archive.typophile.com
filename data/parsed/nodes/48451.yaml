    <p>This is an old project, started 3 years ago, but I have never had time to finish it. Eomer at the beginning meant to be capitals only. Later, however, as I added lc characters, I realised I liked them very much. Still, it was intented to be a bold display face, for short snippets of text, maybe titles, but certainly not for lengthy passages of small text. It features over 95% of the Western glyphs set plus a selected few Central European ones. Metrics has not been finalised, and Kerning is yet to be done.</p>
    <p>All comments are welcome.</p>
    <p>Tybor</p>
