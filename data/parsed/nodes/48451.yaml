      <p>T-shirts, yes! A friend of mine liked it so much, he used the prototype for stencil graffiti.</p>
      <p>Fontstruct is great. The people there have created some outstanding works. The only problem lies in the inherent limitations what comes with ease of use. Yes, Eomer is a good case for Fontstruct because its modular and geometric. But once you get to the accented characters you need more control over precise positioning. This is my first font to include such characters, and I spent long hours just to get them right. See new attachment.</p>
      <p>I am happy you liked the K and X. I have to admit I am quite comfortable with V, because it is unusual and it refers to B. But yes, it is a compromise. However, I am less sure about the K. It looks a bit imbalanced. I might have to change that.</p>
