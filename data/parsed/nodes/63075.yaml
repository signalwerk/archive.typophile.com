      <p>I find the golden section interesting, but in the end not so useful as a goal. </p>
      <p>The problem is that one proportion is in the context of many others, and the relationship among all is more important than the one proportion. For example, on a typical book page you have the text block, four margins, and the proportions of the page itself, and how it relates to the other page in the spread. Then running heads and page numbers are additional factors, which may or may not be counted as 'text block'. Only the text and page blocks are likely to be golden in proportion, and then only one of those. To my eyes the way they all fit together is more important than any one being "golden". </p>
      <p>Also the economic demands of not wasting paper often militates against very large margins, which make it easier to get the golden proportions on the text block.</p>
