    <p>Hi All,</p>
    <p>I realise  this subject has been previously discussed but i still cant seem to find the answer to my question. </p>
    <p>How do we actually use the GS?<br>
    My tutors at college never actually explained it properly ( to be honest i dont even think they got it!) so its a matter that always baffled me.</p>
    <p>I know how to construct it, depending on the chosen page dimensions etc, but when i get all the proportions right how do i implement it?<br>
    Sorry this might sound silly, but i cant seem to find anything online with a good amount of examples.</p>
    <p>Also, do people actually use it? I have been reading mixed reviews. </p>
    <p>When i get a design brief i usually analyze the content and let that guide the layout. The reason why i want to implement the GS is because  i feel that it would improve my compositions/layout and provide more of a cohesive direction.</p>
    <p>Many thanx in advance.</p>
