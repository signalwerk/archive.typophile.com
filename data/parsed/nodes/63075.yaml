      <p>I remember reading that article by Jason.</p>
      <p>I guess I occasionally apply an intuitive "Rule of Thirds" (ROT) approach, but with a variable central space.</p>
      <p>The great things about GR, is that it is so perfect, and yet has so much tension. It's dynamic. ROT would seem to have a static tendency. Of course, static can be good sometimes.</p>
      <p>With photography, I am definitely mindful of ratios, but not ROT. It seems static and absolute, whereas I try to stay loose and flexible. </p>
      <p>I think I draw imaginary lines during composition, but they can be diagonal, curved, asymetrical. I think a lot of great photographers unconsciously "break the grid". There are several good books on this subject, including <a href="http://www.amazon.com/Making-Breaking-Grid-Graphic-Workshop/dp/1592531253">Making and Breaking the Grid: A Graphic Design Layout Workshop</a> by Timothy Samara.</p>
