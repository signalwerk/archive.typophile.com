      <p>In my own work, I find that I get the best results when I consider the grid AFTER the initial craetive impulse. I find it most useful in understanding what I have created and occasionally in fine tuning.</p>
      <p>If your layout has many elements, there may be several overlapping or even competing grid/ratio relationships.</p>
      <p>Some layouts call for balance, while others call for tension.</p>
      <p>But I agree with your conclusion about eyeballing. Ultiamtely that is what one should strive for. Of course, some of us must learn to eyeball it. Not everyone is blessed with perfect ratio pitch.</p>
      <p>I recently started learning photography and I have noticed that the ratio plays a huge role. When I first started taking shots, I often needed to crop my photos in Photoshop. But now I rarely need to crop them because I got a better feel for cropping ratios on the spot.</p>
