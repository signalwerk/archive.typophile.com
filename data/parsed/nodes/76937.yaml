    <p>I need someone to design and do the layout for my album sleeve. My artist name is Slow Medicine and the artwork is as per my photo on this site.</p>
    <p>As you'll see,the front cover still needs some work. But as the design is for a wallet format for a CD, there are three more pages to lay out (we have additional art work). So there's a tracklisting on the back page, a page of info on the inside left, and then the third page is where the CD itself is housed. </p>
    <p>Oh and I have a - very small - budget. </p>
    <p>Anyone interested? Email me on <a href="mailto:toby.manning@blueyonder.co.uk">toby.manning@blueyonder.co.uk</a></p>
    <p>BTW: the music is art rock (I can send anyone who's interested some examples).</p>
