    html: <p>I think this looks very cool. Definitly usable.  <br>In general I think the uppercase should follow the lowercase more when it is possible. <br>I would make the bottom of the "E" like in "C", to get it more fluent.  <br>I would find another solution for the "S", it looks a bit affected...  <br>Try connecting the "K". <br>You could try something like in "Z" on the "Y".  <br>And maybe make the whole thing a bit bolder... <br> <br>Cheers!</p>
