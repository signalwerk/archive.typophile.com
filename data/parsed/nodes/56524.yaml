    html: |-
      <p>Nick: <em>Ergo, all award winners are crap.</em></p>
      <p>Award competitions are judged on the basis of looking at type, not reading it.</p>
      <p>But John Berry has made the now common error of saying 'invisible' when he should say 'transparent'. A crystal goblet, to use Beatrice Warde's famous metaphor, isn't invisible, only transparant. Like good typography, it doesn't obscure the contents, but it can also delight with its own shape.</p>
    html_clean: |-
