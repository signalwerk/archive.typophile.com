    html: |-
      <p>I have sometimes used the 'Belgian beer glass' explanation of typography: it's transparent, but the shape of the glass tells you what kind of beer is in it.</p>
      <p>This is also, of course, true of wine glasses if one takes the care to serve wine in an appropriately shaped glass. In this case, the shape not only tells you what kind of wine you are about the drink, but also affects the bouquet and flavour.</p>
