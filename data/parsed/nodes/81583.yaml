    html: <p>I just saw the official trailer of the English version. I like the pictures, but the sound … My first impression is, that the sound is in contradiction to the images much more modern than in the old Disney movies – but in a simple and kitschy way. The sound of the trailer (song and partly the voices) did not touch me. If there wouldn’t be the sound, I mainly would recognize the technical progress of trick techniques but not a change of the typical Disney style, although I did not see the English versions of most Disney movies. What do you think about the sound of that movie?</p>
