  html: <p>Hi there, just went to see the new "Winnie the Pooh" Disney movie. Besides the fact that it has been completely drawn by hand, it features a very fine and pleasing use of typography. Well, the story is set *inside* the pages of a book, with the characters jumping up and down the paragraphs. And, for once, the use of book layout and typeface is *very* nice and pleasing, with Adobe Caslon Pro - with ligatures turned on! - giving a nice rendition of "old time" fairy tale books. I strongly suggest everyone to go and see the movie - in addition, there's a thrilling, psychedelic sequence set inside a blackboard which is, by itself, worth looking at the entire picture.</p>
