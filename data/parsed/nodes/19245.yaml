    html: |-
      <p>Let's rattle off all the humanist sans that are somewhat close to Scala Sans:</p>
      <p>Gill Sans<br>
      Syntax<br>
      Today<br>
      Bliss<br>
      Mundo<br>
      Agenda<br>
      Charlotte<br>
      Legato<br>
      Freight Sans<br>
      Kievit</p>
      <p>etc..... I've excluded any that really aren't close, like Cronos, Frutiger, Formata, and Chianti. </p>
      <p>Your problem isn't that you need an alternative, it's that you need a budget. If they don't want to pay, you could:</p>
      <p> - Buy yourself the best Humanist Sans family for your general needs, and use that, since it will have to be close enough</p>
      <p> - Buy Scala Sans for yourself and use it for this job, and every other job you can get away with it since it's so trendy and desirable</p>
      <p> - institute a policy that you will always keep a healthy budget for type in future jobs as part of your expenses</p>
