    <p>I've been looking and not really finding lettering from the 1930-1950 - real lettering, not remakes of.<br>
    The "Vespa" style is what I'd really like to find more of. Car logos have been my best resource so far,<br>
    but industrial style product  or company logos would really be good.  Attached is some of what I've found.<br>
    Any help would be much appreciated.<br>
    Thanks,<br>
    Dan Cotton</p>
