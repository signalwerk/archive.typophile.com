  html: <p>Heinrich Wieynck's magnificent Kanzlei is embedded <a href="http://www.systemarchitektur.de/stempel/ChronikStempel.pdf">here</a> (page 8) and <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Wieynck/HWieynck.pdf">here</a> (top), but neither gives any info as to who's selling the digital version today. I've checked all the usual suspects, and none of them seem to have it. I wrote the both the Stempel guy and the Klingspor Museum but got no response from either. In both PDFs it's embedded simply as "Wieynckanz." <br> <br>Any information about who sells it would be appreciated.</p>
