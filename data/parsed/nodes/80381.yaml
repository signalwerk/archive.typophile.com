    html: |-
      <p><cite>I see a lot of places people saying Indesign sucks for web, I don't understand that statement.</cite></p>
      <p>InDesign was not primarily (or even secondary) designed to create web pages with. It's primary function is <em>document design</em>, and the typical end-product would be a PDF.</p>
      <p>The very inclusion of "pixels" as a measurement unit in InDesign CS5 made my skin crawl. Every other measurement unit in InDesign is an existing one, with real physical dimensions (which is kind of important for printing and stuff).</p>
      <p>If you want to make web pages, use a web design program. Your other example, Photoshop, is not one either.</p>
