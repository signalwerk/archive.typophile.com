    html: |-
      <p>inDesign is great software for what it was designed for: print production page layout. </p>
      <p>Web design, unlike print design, has no fixed canvas. Designing in print is dictating the visuals. Designing for the web is suggesting the visuals, but willing to allow for variations and variables, along with interactions, time, movement, etc.</p>
      <p>As such, inDesign is simply the wrong tool for this.</p>
      <p>DreamWeaver is slightly better, but even then, it's not a great tool for doing the visual design. </p>
      <p>The best tool is an understanding of how HTML, CSS, and JS work. Once you start learning that, you can jump into your tool of choice to make visuals as needed, adding them to the mix.</p>
      <p>If you have no ambition to learn any of that, that's OK. But then realize you're not going to be the one building the web sites. You're going to want to team up with a skilled UI designer/developer who can work with you to get you what you want.</p>
