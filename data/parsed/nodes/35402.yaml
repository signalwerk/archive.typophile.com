      <p>Your logo has a very boutique feel to it. The human figure is great. However you have to work out just how much this little person fits into your brand. Will he work on business cards, on your site and in your marketing materials? I'm often frustrated when brands or a logo changes through different collateral. That being said, the little guy gives a whole different feeling to the logo in each representation. Go with your gut.</p>
      <p> I find many design shops and even large ad firms take a far too simplistic approach to their own brand (think DRAFTFCB). You're showing the fun and creativity behind your work. That's something I really like to see when looking for suppliers, especially in design. </p>
      <p>James</p>
