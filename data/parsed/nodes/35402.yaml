      <p>i saw your post and had a few thoughts. first, i love the name of the shop, very cool. but with the logo, it seems very "see and say". the name is red monolith, so show me a red monolith. i think there are some other ideas and metaphors out there that may be more pleasing. how can you say HUGE without showing me two things? maybe you cannot. how about a looming shadow. an ant's eye view. 3-dimensional going WAY up. maybe more exaggerated so we can get the idea of monolith. monolith is HUGE, not just big.</p>
