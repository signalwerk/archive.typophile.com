      <p>Red, cheers I'm glad you like Rhodaelian. Koppa's rationale about the large rectangle next to the small type illustrating huge scale is true in a general sense. Some observers, however, may reason that if the type is only a few inches high the rectangle, while much taller, must be only a few feet tall and hardly giant-scale. Depends on reproduction size and how philosophical you want to be about this. Adding an element of readily-recognized size, such as a human figure, would make the scale of things indisputable, but that's an intellectual conceit and there's a lot to be said for keeping things simple. It was just a passing thought.</p>
