      <p>Lex, that approach is sometimes used by large companies and corporations with a marketing budget large enough to establish their name and identity with mult-media, typically supplementing a non-descript image with the use of sound, for example, by speaking the company's name aloud in radio and television ads. Even so most examples still include an acronym with the visual element.</p>
      <p>For a small design shop a graphic logo with no text at all, not even an acronym, might be too obscure. Keeping it simple generally produces good design, but given how minimal this one is, getting rid of the text altogether would make it reductive, and for clients, incomprehensible.</p>
      <p>j a m e s</p>
