      <p>A, but with the text on the right side of the monolith, left-aligned/ragged right---like B but with the text set as two lines.</p>
      <p>Then place a tiny white human figure inside (in front of?) the monolith to give a sense of gigantic scale.</p>
      <p>DIN is an okay choice of font but <a href="http://www.myfonts.com/fonts/sentinel/rhodaelian/" rel="nofollow">there exists another type</a> that was designed with exactly this sort of subject in mind---its capitals are meant to evoke monolithic or monumental structures on a vast scale. At least that was what I had in mind when I designed <a href="http://www.myfonts.com/fonts/sentinel/rhodaelian/" rel="nofollow">Rhodealian</a>. Rhodie's N and M are explicitly architectural, looking just like tall buildings in silhouette.</p>
      <p><em>...how can you say HUGE without showing me two things?</em></p>
      <p>Hard to do. To demonstrate the size of a thing it's easier, more effective to show two objects.</p>
      <p>j a m e s</p>
