      <p>Lex - I'm very analytical and rational.  I love grids, I love simple geometric shapes, and I love the 1:4:9 proportions of the Clarke monolith, so combining that with print's most interesting (to me) and second most important (to me) color was a no-brainer.</p>
      <p>I chose DIN because of its visual similarity to the 4:9 ratio and modified the letterforms slightly to emphasize that.  That the word "MONOLITH" fits perfectly inside the shape while retaining the 1:4:9 proportions is, I confess, a happy coincidence.</p>
    html_clean: |-
