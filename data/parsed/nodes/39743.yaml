    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 4.Dec.2007 9.55am </div>
      <p>On Tuesday 20 November St Bride Library opened its doors again. After<br>
    six months of intensive work planning the project and finding temporary<br>
    homes for thousands of books and artifacts, the space was cleared for<br>
    contractors to move in and refurbish it in mid-October. They installed a<br>
    partition between the new reading room and the machinery room, replaced<br>
    services, and redecorated a room which has gone without improvement for<br>
    over thirty years. Shelving, including a nine-bay set of rolling shelves<br>
    giving us 508 metres of storage, was installed last week. The shelves<br>
    were filled by a band of volunteers and staff on 18 and 19 November and<br>
    all is now ready.</p>
    <p>The new Reading Room is distinctly different from its predecessor. For<br>
    the first time, about ten thousand books are within easy reach, either<br>
    on open shelving or on stacks which are near at hand. The shelving is<br>
    open, so it will be easier for visitors to use. We hope to be able to<br>
    welcome many more new people in future, making them into regular<br>
    visitors who appreciate the qualities of the material we hold and are<br>
    eager to make use of it.</p>
    <p>We’d like to thank the many people who have put time and effort into<br>
    this project. Firstly, to the project staff and contractors who worked<br>
    hard to meet our tight deadline. We’re delighted with the new<br>
    facilities. Secondly, to a band of volunteers who have given up so much<br>
    of their time to fetch and carry everything from iron handpresses to<br>
    boxes of trade cards, books to wood blocks around the building. Without<br>
    their help the new Reading Room would not be a reality.</p>
    <p>For any further information or to donate to St Bride Library please contact:</p>
    <p>* Mike Jenkins, Chief Executive – MikeJenkins [at] stbridefoundation.org<br>
    * Nigel Roche, Librarian – NigelRoche [at] stbridefoundation.org<br>
    * Kanak Chhatralia, Fundraising Officer –<br>
    KanakChhatralia [at] stbridefoundation.org / 0207 353 3331</p>
