    <p>Ex "Politica ExtraLight"<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Politica Extra Light PNG Show_4556.png"></div><p></p>
    <p>a WIP of a new weight for "Politica" family font. The "Politics" concept is based on a politician broke moment, called "State strike", playing with the oposite between curves and broken strokes, like a comparison between politicians forms, their formal words and acid messages always exchange between them.</p>
    <p>Critiques and Comments always welcomed.<br>
    =)<br>
    Pedro (PeGGO)</p>
