      <p>Hi Pedro,</p>
      <p>It's a very nice job, I like it's very subtle but still conserves its personality, the sharped serifs make me think on how poignants and mordacious can be the politics.<br>
      I suggest to make the upper counter of the "S" narrower for avoiding the slopped effect and making "R" wider. I wonder why is the ampersand so small.</p>
      <p>Greetings<br>
      Sergio</p>
