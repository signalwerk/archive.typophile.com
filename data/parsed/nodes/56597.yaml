    html: |-
      <p>iPhone - Helvetica<br>
      WM - Nina, Tahoma, Segoe Condensed - substitute Myriad Condensed<br>
      Nokia - Nokia Sans - substitute Rotis ;-)<br>
      Motorola - the most horrible bitmap fonts you can find on dafonts :-(<br>
      G1 / Android - Ascender Droid fonts</p>
