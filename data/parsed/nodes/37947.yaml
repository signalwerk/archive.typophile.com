      <p>I'm with Ricardo on the switching to Suitcase...but must add another quick point.</p>
      <p>I installed FEX (WinXP Pro), decided it wasn't for me and resolved to remain with Suitcase despite a few issues I have with it. </p>
      <p>Uninstalling FEX trashed the majority of older programs on the system (seemingly random fonts for apps making them all but unusable). After much hair tearing (and I don't have much anyway) and silence on Linotype's behalf, a last ditch attempt to rebuild this (system restore failed) was to change my visual theme. Reboot, then change it back to what it was. Amazingly this "so obvious you'd miss it" idea worked.</p>
      <p>My personal experience of FEX - on XP at least - is that it doesn't seem to be quite ready yet. Maybe a reminder to try again in a few months or so.. ;)</p>
      <p>Cheers,</p>
      <p>simon</p>
