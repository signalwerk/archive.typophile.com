      <p><cite>That is one thing which I hope Font Explorer comes to have ... that being the ability to save your sets somehow.</cite></p>
      <p>I've slowly sorted all my fonts into folders based on my stylistic designations. I then use FontExplorer's smart sets to create sets based on the path to the font. it has been working very well for me, and I have a nicely organized backup of all my fonts.</p>
      <p>as for Suitcase, I dumped it myself. I had nothing but trouble in both QXP and InD with it. the primary problem I've noticed was auto-activation, but even without it I experienced much more frequent crashes in InD. I prefer to manually activate things any way so I know what's going on when I open a doc.</p>
