    html: |-
      <p><cite>I never liked the “vault” concept in Font Reserve and it looks like that is preserved in Suitcase, I don’t understand the purpose of having your fonts in more than one place.</cite></p>
      <p>I think all the font managers do this now (they used to give you the option to NOT do it)... it's primarily for two reasons: </p>
      <p>1) Speed -- if they know where the fonts are and how they're organized, it's faster to find/load 'em</p>
      <p>2) Safety -- By making copies of fonts, they aren't going to corrupt your originals; every time your system cashes for some reason, there's a chance of corrupting any open font files.</p>
