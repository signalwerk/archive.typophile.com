    user_path: null
    user_image: /files/pictures/picture-8415.jpg
    date_raw: 10 Oct 2007 — 3:34pm
    date: 2007-10-10T15:34:00
    votes: null
    html: |-
      <p>There is a file called<br>
      <code>/Users/username/Library/Application\ Support/Linotype/FontExplorer\ X/FontDatabase.db</code><br>
      where the actual font database and sets live.<br>
      Also, FEX offers the possibility to export/backup the current setup and later to re-import those, see Files &gt; Configurations &gt; Load/Save. This might also be good to know when (or even better: before!) doing major changes in FEX setup.<br>
      Some more information can be found <a href="http://www.fontexplorerx-board.com/viewtopic.php?t=63" rel="nofollow">here</a> and <a href="http://www.fontexplorerx-board.com/viewtopic.php?t=709" rel="nofollow">here</a>.</p>
