    <p>For some reason, every time I open FontExplorer X - or restart my computer - it takes me through the setup assistant all over again. Furthermore I no longer have my sets, which took me hours to set up. It also no longer starts up automatically, nor does it load my fonts when I open a file (I now have to do this manually).</p>
    <p>I tried re-downloading the software and re-installing it, but the problem persists. I've emailed Linotype but not heard back. Has anybody else had this problem? Or any suggestions? If this persists I may have to try another font management software, which is a shame because I really like FontExplorer.</p>
