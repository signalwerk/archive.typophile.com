    <p>Hi,</p>
    <p>I have in my head an idea for a typeface, which I feel sure someone has already designed, but it's a case of tracking it down.I am looking for a readable typeface, that has decorative alt fonts, and a friendly feel.</p>
    <p>The first part, without the friendliness, can be done by typefaces such as Barnbrook's Priori Sans, and Priori Sans Alt.</p>
    <p><a href="http://new.myfonts.com/fonts/emigre/priori-sans-ot/regular/" title="http://new.myfonts.com/fonts/emigre/priori-sans-ot/regular/">http://new.myfonts.com/fonts/emigre/priori-sans-ot/regular/</a><br>
    <a href="http://new.myfonts.com/fonts/emigre/priori-sans/regular-alt/" title="http://new.myfonts.com/fonts/emigre/priori-sans/regular-alt/">http://new.myfonts.com/fonts/emigre/priori-sans/regular-alt/</a></p>
    <p>But I need something that's a little more friendly, but achieving the same affect.</p>
    <p>Some typefaces I've looked at so far, which are creative and friendly, but too informal:</p>
    <p><a href="http://www.fontshop.com/fonts/singles/linotype/party_time/" title="http://www.fontshop.com/fonts/singles/linotype/party_time/">http://www.fontshop.com/fonts/singles/linotype/party_time/</a><br>
    <a href="http://www.fontshop.com/fonts/singles/itc/itc_jambalaya_com/" title="http://www.fontshop.com/fonts/singles/itc/itc_jambalaya_com/">http://www.fontshop.com/fonts/singles/itc/itc_jambalaya_com/</a></p>
    <p>One typeface I've come across that's heading in the right direction, but has no legible interchangeable font:</p>
    <p><a href="http://www.fontshop.com/fonts/singles/fontfont/ff_yokkmokk_ot_regular/" title="http://www.fontshop.com/fonts/singles/fontfont/ff_yokkmokk_ot_regular/">http://www.fontshop.com/fonts/singles/fontfont/ff_yokkmokk_ot_regular/</a></p>
    <p>Or equally: <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_polymorph_ot/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_polymorph_ot/">http://www.fontshop.com/fonts/downloads/fontfont/ff_polymorph_ot/</a>, combined with Polymorph North, but it's still not quite there.</p>
    <p>Any help or suggestions would be fantastic.</p>
    <p>Thanks in advance</p>
