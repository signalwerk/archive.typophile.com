      <p>Another great design, Jean Paul. I second other's opinion, it surely must be developed. Simple, clean and handsome. And Nick's idea is excellent. I'd like to think about this (to begin with thin/black weights) a few months ago.</p>
      <p>Some points: (1) your parenthesis are very far away from usual shape. Maybe a simple curve would be better. (2) zero could be more curve on top/bottom parts. (3) W is somewhat heavy. Do you tried to do it with two unlinked pieces? (I mean, a kind of U with inclined stems and a small v inside).</p>
      <p>About the ultra black, I also agree with Eliason, you 3rd PDF is much better.</p>
