      <p>I prefer the contours of the 's' very much. I also enjoy the subtle curves in the 'v' and 'w'. I'm not a fan of the open 'p,q,b,d and e' or at least they feel a little too open</p>
      <p>The rest of the letters feel a little curmudgeon where their curves terminate into straight verticals. It feels forced/stubborn. There has to be a more natural solution for that.</p>
      <p>It has potential to be very excellent. I'd love to see what this looks like EXTRA BOLD.</p>
