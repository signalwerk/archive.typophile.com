    <p>Greetings all,</p>
    <p>I made this design last week, for a friend of mine who's in e-commerce and web shops. I got the idea from some free font which was really terribly constructed, but now it's turned into something completely different. He likes it very much, and so do I. Yet I wonder if it is worth persuing? I know there are so many lookalikes out there...</p>
    <p>What do you think?</p><div class="imageWrap"><img src="http://typophile.com/files/Rensz_3818.png"></div><p></p>
