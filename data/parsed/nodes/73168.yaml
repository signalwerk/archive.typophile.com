    html: |-
      <p>So far it's been pretty easy.<br>
      Now I suggest you do the ultra bold.<br>
      That will be quite hard (most people who do this kind of face don't get heavier than a medium-weight bold), but it will resolve a lot of issues, ultimately save you a lot of hassle, and set the face apart from the crowd.<br>
      If you are serious about developing the face, it's best to tackle the ultra now, and interpolate between that and this.</p>
