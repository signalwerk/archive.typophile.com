    <p>So without giving any information about the project this logo is for, I’m looking for some feedback.<br>
    -What would you guess this logo represents?<br>
    -How does it make you feel?<br>
    -List some adjectives to describe it</p>
    <p>The logo is still far from finished but we’re struggling with a font choice. Once I get some idea of how other people are viewing it I’ll let you know what feeling I’m aiming for and hopefully some of you will have some more font suggestions.</p>
    <p>Thanks so much!</p>
    <p>EDIT: Before I get comments about the typesetting...I don’t own this font yet so these are mockups using screen captures. The type needs a lot of work that will come later.</p>
