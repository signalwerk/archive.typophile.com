    html: |-
      <p>I do have some difficulty with the whole and a few elements, but I understand you need feedback on the ’feeling’ departement.</p>
      <p>I just can’t get past the fight that is being fought between the ’T’ (the stem) and the rest of the tree (leaves. Why not one color?).<br>
      They both are fighting for attention, they both don’t get what the deserve. Besides that the stem is very wide and bold, the hands - however - are tiny. I don’t like this.<br>
      The hands are lost.</p>
      <p>The whole is a bit dull, not vivid.<br>
      The font doesn’t feel right.</p>
      <p>In the distant I can see somewhat of a fairytail, but not a nice one.</p>
      <p>It is dark, especially the lonely hands crying out for help.<br>
      It doesn’t give me a good feeling.</p>
      <p>But then again ... ten people ... ten opinions.<br>
      Hope this helps.</p>
