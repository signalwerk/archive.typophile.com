    html: <p>Compugraphic and Monotype were one of the few companies and this industry of type making had more woman managers than probably any other company producing machines. At CG I had a man middle manager on the second shift but the first shift it was a woman, and her boss a woman, and her boss a man. Then the late eighties it was a woman that headed the whole place. The drawing office had more men than woman and the first shift did too. The second shift it was about 50%. And not everyone was of the same race about more diverse than the general public. The more manual labour jobs were more blokey. At Microsoft and in most tech jobs it's more men in the engineering sections, more woman in the 'consumer' groups and more woman as admins. In England it's a whole new ball game. You can ask anyone even a woman to make tea for you if they are making it. Watch 'The Office' on BBC (America ?) and you'll get an earfull of culture you won't find in Springfield.. Even Lowri Turner shocked me on Shopping City (2000) at 5pm with her comment to a woman trying on a top 'look at the cleavage on you'. God bless the English (and Welsh too).</p>
