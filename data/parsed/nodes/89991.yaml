    <p>Hi Guys,</p>
    <p>I've looked over the great posts that are here for this and I think I've settled on the code below, which I grabbed from the Adobe Caslon Pro font. It's nice and compact and should suit out needs just right.</p>
    <p>It all seems to be working fine but I'm not completely clear as to how the single quote works and I don't want to end up in a "A little knowedge is a dangerous thing" situation. An Adobe page states that the single quote "Marks a glyph or glyph class for contextual substitution or positioning" but I'm still lost.</p>
    <p>Thanks for any help you can offer my feeble mind.</p>
    <p>All Best,<br>
    Ken</p>
    <p><code>@frac1regfigs=zero one two three four five six seven eight nine<br>
    @frac2numr=zero.numr one.numr two.numr three.numr four.numr five.numr six.numr seven.numr eight.numr nine.numr<br>
    @frac3dnom=zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom<br>
    @frac4fracsdnom=perthousand slash percent onehalf onethird onequarter twothirds threequarters threeeighths seveneighths one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom</code></p>
    <p><code>feature frac {<br>
    lookup frac01 {<br>
    #all to numerators<br>
    sub @frac1regfigs by @frac2numr;<br>
    } frac01;<br>
    lookup frac02 {<br>
    	#change numerators to denominators contextually<br>
    	sub zero.numr' @SLASH' zero.numr' zero.numr' by perthousand;<br>
    	sub zero.numr' @SLASH' zero.numr' by percent;<br>
    	sub one.numr' slash' two.numr' by onehalf;<br>
    	sub one.numr' slash' three.numr' by onethird;<br>
    	sub one.numr' slash' four.numr' by onequarter;<br>
    	sub two.numr' slash' three.numr' by twothirds;<br>
    	sub three.numr' slash' four.numr' by threequarters;<br>
    	sub three.numr' slash' eight.numr' by threeeighths;<br>
    	sub seven.numr' slash' eight.numr' by seveneighths;<br>
    	sub @frac4fracsdnom @frac2numr' by @frac3dnom;<br>
    } frac02;<br>
    lookup frac03 {<br>
    	#change the slash<br>
    	sub slash by fraction;<br>
    } frac03;<br>
    } frac;</code></p>
