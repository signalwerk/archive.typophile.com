      <p>Yes, when you have something <code> sub @A @B' @C by @D </code>, the apostrophe is needed to distinguish the substitution target from the substitution context.</p>
      <p>In the example you give, I can see no reason why it would have to be a single lookup. You could break it up into</p>
      <p><code>lookup frac1A { </code><br>
      <code>&nbsp;&nbsp;sub zero.numr slash zero.numr zero.numr by perthousand; </code><br>
      <code>&nbsp;&nbsp;sub zero.numr slash zero.numr by percent; </code><br>
      <code>&nbsp;&nbsp;sub one.numr slash two.numr by onehalf; </code><br>
      <code>&nbsp;&nbsp;# etc. </code><br>
      <code>} frac1A; </code></p>
      <p><code>lookup frac1B { </code><br>
      <code>&nbsp;&nbsp;sub @frac4fracsdnom @frac2numr' by @frac3dnom; </code><br>
      <code>} frac1B; </code></p>
      <p>In this case, the apostrophes can be omitted in the first lookup. They are only needed when the final line is included since you can't include both ligature and contextual substitutions in the same lookup. The apostrphes force the ligature rules to be interpreted as contextual substitutions which happen to have the same effect as ligature substitutions.</p>
      <p>André</p>
