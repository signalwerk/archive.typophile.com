    <p>I once had this font until it was lost during a hard drive meltdown several years ago. Now I can't find the name nor where to acquire this version of Breite Kanzlei ornamental. What makes it more unusual is the outline and fill-design in. Usually one can find B.K. regular as a solid fill black. Any ideas oh great Typophile community??<br>
    Thanks in advance<br>
    xo =o= xo</p>
