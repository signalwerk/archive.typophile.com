  html: |-
    <p>Dear Typophile forum,</p>
    <p>Does anyone know of a foundry that could help with internationalising a typeface (5 fonts)?<br>
    To start with, I would need all Latin based characters:<br>
    Latin Extended Additional<br>
    Latin Extended-A<br>
    Latin Extended-B<br>
    Latin Extended-C<br>
    Latin Extended-D<br>
    (= 500 new glyphs).</p>
    <p>Perhaps also Russin, Ukranian, Kazhak, Bulgarian, Macedonian, Mongolian, Uzbek, Greek, Hebrew, Kurdish, Arabic, Farsi, Korean, Chinese, Thai, Japanese, Hindi.</p>
    <p>Thanks!</p>
