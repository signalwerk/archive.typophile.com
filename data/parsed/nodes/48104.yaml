      <p>I'm not aware of one. Unlike New York, San Francisco is not quite as type-heavy a town.</p>
      <p>I do commonly associate <a href="http://www.fontshop.com/fonts/designer/w_a_dwiggins/" title="W. A. Dwiggins | Designer | FontShop" rel="nofollow">W. A. Dwiggins</a>' faces Metro and Electra with SF, as they were both used as headline type for the <em>San Francisco Chronicle</em> (albeit with adjustments to the letter forms to suit newsprint).</p>
      <p>More common in usage, though, is SF's history of being erected in the Gold-rush Victorian era, so it naturally gets associated with tuscan ("western") type, and all the gaudiness that implies. For instance, the 49ers logo set in <a href="http://www.myfonts.com/fonts/ef/quentin/" title=" MyFonts" rel="nofollow">Quentin</a>.</p>
