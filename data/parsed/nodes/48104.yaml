    <p>If H&amp;FJ Gotham represents New York, what font is quintessentially San Francisco? Where do you look? Coit Tower? Wells Fargo? Trolleys? Street names stamped into cement? </p>
    <p>What attempts have been made to capture the face of San Francisco? Perhaps this was Susan Kare's dilemma in designing <a href="http://www.kare.com/MakePortfolioPage.cgi?page=4" rel="nofollow">San Francisco</a> that shipped on the early Mac. How else to capture the Mission, Presidio, Downtown, North Beach, the Castro?</p>
