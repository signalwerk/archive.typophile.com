      <p>This is a very good question worthy of further research. While Tuscan decorative types like Quentin certainly reflect an aspect of the city's history, it is far from anything current. </p>
      <p>I would have to agree with the call on Metro being a likely candidate, but again I think it only captures a part of the city's story. Perhaps there is some need for a new typeface, an amalgam of the best of San Francisco's signage much like how Gotham was inspired by the city of New York.</p>
