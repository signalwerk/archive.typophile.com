    votes: null
    html: "<p>\"Serifity\" is just another variable to weigh against others, but for readability it is in fact <i>very</i> significant, second only to \"structural integrity\" and tight (but not too tight) letterspacing. If your text is intended* for long continuous reading, you are doing the readers a disservice (whether they realize it or not - it's actually a subconscious issue) by using a sans. <br> <br>* This \"intention\" is very important. Long text doesn't necessarily require serifs: it could be fodder in a coffeetable book... <br> <br>hhp <br></p>"
    html_clean: "<p>\"Serifity\" is just another variable to weigh against others, but for readability it is in fact <i>very</i> significant, second only to \"structural integrity\" and tight (but not too tight) letterspacing. If your text is intended* for long continuous reading, you are doing the readers a disservice (whether they realize it or not - it's actually a subconscious issue) by using a sans. <br> <br>* This \"intention\" is very important. Long text doesn't necessarily require serifs: it could be fodder in a coffeetable book... <br> <br>hhp <br></p>"
