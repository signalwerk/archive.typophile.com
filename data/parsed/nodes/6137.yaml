    html: '<p>&gt; What makes a "display serif" face unsuitable for text? <br> <br>A huge question. <br>Although "unsuitable" is relative - and there is no "ideal" text face anyway. <br> <br>Just some things that impair a serif face from serving for extended reading: <br>- Setting too loose/tight (usually the former). <br>- Color too light/dark (usually the former) <br>- Forms too far outside expectation. <br>- Forms too convergent. <br>- Bad vertical proportions, like too-long descenders. <br> <br>hhp <br></p>'
