  html: <p>The rule is that for body text and legibility use a serif font. Is this a hard and fast rule? I have seen many annual reports, books, etc that use a sans serif for their body text and they are all very clean and legible. I am doing an annual report and have been told to adhere to the "rule." But I am wondering if that rule is valid and should be a designers default for selecting and setting type. <br> <br>If you cannot answer this question can you please provide me resources on the web that could help.  <br> <br>Thank you.</p>
