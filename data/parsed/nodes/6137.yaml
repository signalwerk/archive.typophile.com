    html: |-
      <p>Would it be ridiculous to say that oblique axis types are more readable because they spread letter-differentiating information around a larger portion of the word, rather than just the x-height region? Variety of axis might do the same thing, as might designing variety into the lower half of letters as well as the upper. Fournier, in moving more frankly than was usual to the pointed pen rather than the broad pen as his apparent model, was careful to vary real axes, which is why I prefer his work to Baskerville's; and variety in the lower portion of the vowel range might be one reason why Bembo Book/Letterpress is so readable. </p>
      <p>As for Minion, Adriano, I find it unreadably constrictive over long distances. I wish it would loosen up (not literally) a bit; and strengthen bars on f and t, and sort out its e, and then reduce countersize on a and e, and get rid of the essential Times-ness of bpdq, and...</p>
