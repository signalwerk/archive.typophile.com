        ...{z$$r-cornerr}z$$r<br>
      enddef;<br>
      <code><br>
      </code><br>
      vardef arc.l(suffix $,$$) = % inside of arc<br>
       pulled_arc.l($,$$,0,0)<br>
      enddef;<br>
      <code><br>
      </code><br>
      vardef arc.r(suffix $,$$) = % outside of arc<br>
       pulled_arc.r($,$$,0,0)<br>
      enddef;<br>
      </code></p>
