    <p>When you are familiar with the TeX/METAFONT-world you have probably already seen the logos of METAFONT, METAPOST or METATYPE1. They are made of the following glyphs:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/aefmnopsty1_4274.png"></div><br>
    "AEFMNOPST" have been constructed in the METAFONT language by Donald. E. Knuth and "Y1" have been added by the METATYPE1-Team. <p></p>
    <p>I have completed the font in two ways: </p>
    <ul>
    <li>I have added many glyphs, such that the T1-encoding table is complete now (T1 is also known as the EC- or Cork-encoding)
    </li><li> I have added some variants like "light ultracondensed" or "script"
    </li></ul>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/smallspecimen_5329.png"></div><br>
    The main purpose of this font is to make future logos related to METAFONT easier (like mf2pt1, MFLua, ....). Also the old "S" will be replaced by Knuths newest version of the "S", such that the METAPOST logo will be set correctly in type1 fonts.<p></p>
    <p>Please have a look at the examples attached and tell me about inconcistencies and also spacing/kerning issues.</p>
    <p>Many thanks,</p>
    <p>fujito</p>
