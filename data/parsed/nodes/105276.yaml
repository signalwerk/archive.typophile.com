  - id: 562718
    user: 72748
    date: 2013-08-15T10:14:00
    date_raw: 15 Aug 2013 — 10:14am
    votes: null
    html: |-
      <p>There is already a global parameter ("superness") that makes the font squarer or rounder. E. g. the script styles have superness=0.75 instead of superness=0.8. After having published the sources, everyone may produce easily new font styles by just redefining the global parameters. </p>
      <p>"half" is nothing really special, it is just the concatenation of two arcs and arcs are not really special (nilus arcs are a bit more complex) as the font is penbased. Have a look at the following picture and then you may have a look at the definitions of "arc", "half" and "circle":</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arc_3463.png"></div><p></p>
      <p><code><br>
      %this is for arc, it is just the algebraic solution of<br>
      %zi+whatever*diri=zj+whatever*dirj<br>
      %but I did not want to save any variables here<br>
      def corner(expr zi,diri,zj,dirj) =<br>
       (<br>
       xpart(zi)<br>
       -xpart(diri/length(diri))/(ypart(diri/length(diri))<br>
       *xpart(dirj/length(dirj))-xpart(diri/length(diri))<br>
       *ypart(dirj/length(dirj)))*(xpart(dirj/length(dirj))<br>
       *(ypart(zi)-ypart(zj))+ypart(dirj/length(dirj))<br>
       *(xpart(zj)-xpart(zi)))<br>
       ,<br>
       ypart(zi)<br>
       -ypart(diri/length(diri))/(ypart(diri/length(diri))<br>
       *xpart(dirj/length(dirj))-xpart(diri/length(diri))<br>
       *ypart(dirj/length(dirj)))*(xpart(dirj/length(dirj))<br>
       *(ypart(zi)-ypart(zj))+ypart(dirj/length(dirj))<br>
       *(xpart(zj)-xpart(zi)))<br>
       )<br>
      enddef;<br>
      <code><br>
      </code><br>
      %a quarter of a superellipse<br>
      def arc(expr zi,diri,zj,dirj) =<br>
       zi{diri}<br>
       ...zi<br>
       +superness*(corner(zi,diri,zj,dirj)-zi)<br>
       -(1-superness)*(corner(zi,diri,zj,dirj)-zj)<br>
       ...zj{dirj}<br>
      enddef;<br>
      <code><br>
      </code><br>
      %half a superellipse<br>
      def half(expr zi,diri,zj,dirj,zk,dirk) =<br>
       arc(zi,diri,zj,dirj)<br>
       &amp; arc(zj,dirj,zk,dirk)<br>
      enddef;<br>
      <code><br>
      </code><br>
      %full superellipse<br>
      def full(expr zi,diri,zj,dirj,zk,dirk,zl,dirl) =<br>
       arc(zi,diri,zj,dirj)<br>
       &amp; arc(zj,dirj,zk,dirk)<br>
       &amp; arc(zk,dirk,zl,dirl)<br>
       &amp; arc(zl,dirl,zi,diri)<br>
      enddef;<br>
      </code></p>
      <p>The "-randup" is just like the direction "(0,-1)" but with some noise (which is only applied for the script styles). I was too lazy to define a "random down" so it is kind of "- random up".</p>
      <p>To the nilus arc: I have worked out a clearer solution of it a long time ago but never wrote it down in METAFONT. But the principle stays the same, so here is the old code snippet (and I am aware that it is ugly, sorry):</p>
      <p><code><br>
      vardef computearcpoints(suffix $,$$)(expr lsupcorr,rsupcorr) = % private definition for computations of arcpoints<br>
       pair originall,originalr,centerl,centerr,cornerl,cornerr,betweenl,betweenr,extremuml,extremumr;<br>
       if (xpart(z$$r-z$r)&gt;0)  and  (ypart(z$$r-z$r)&lt;0) 	%lower left<br>
       or (xpart(z$$r-z$r)&lt;0) and (ypart(z$$r-z$r)&gt;0): 	%upper right<br>
        originall=(1/(length(up slanted slant)))[.5[z$l,z$r],z$l]; %later there will be some slanting calculations and we redo them now<br>
        originalr=(1/(length(up slanted slant)))[.5[z$l,z$r],z$r];<br>
        %originall=z$l;<br>
        %originalr=z$r;<br>
        centerl=(x$$l,ypart(originall));<br>
        centerr=(x$$r,ypart(originalr));<br>
        cornerl=(xpart(originall),y$$l);<br>
        cornerr=(xpart(originalr),y$$r);<br>
       else: %lower right and upper left<br>
        originall=(1/(length(up slanted slant)))[.5[z$$l,z$$r],z$$l];<br>
        originalr=(1/(length(up slanted slant)))[.5[z$$l,z$$r],z$$r];<br>
        centerl=(x$l,ypart(originall));<br>
        centerr=(x$r,ypart(originalr));<br>
        cornerl=(xpart(originall),y$l);<br>
        cornerr=(xpart(originalr),y$r);<br>
       fi<br>
       betweenr=(length(((z$$r-z$r)/length((z$$r-z$r)))slanted slant)*0.5+0.5)<br>
        [((1+rsupcorr)*superness)[centerl,cornerl],<br>
        ((1+rsupcorr)*superness)[centerr,cornerr]];<br>
       betweenl=(length(((z$$l-z$l)/length((z$$l-z$l)))slanted slant)*0.5+0.5)<br>
        [((1+lsupcorr)*superness)[centerr,cornerr],<br>
        ((1+lsupcorr)*superness)[centerl,cornerl]];<br>
       %--calculate extrema for slanted bows:---<br>
       if slant&gt;0:<br>
        if (xpart(z$$r-z$r)&gt;0)  and  (ypart(z$$r-z$r)&lt;0): %lower left<br>
         extremuml=directionpoint (slant,-1) of (z$l{cornerl-z$l}...betweenl{z$$l-z$l});<br>
         extremumr=directionpoint (slant,-1) of (z$r{cornerr-z$r}...betweenr{z$$r-z$r});<br>
        elseif (xpart(z$$r-z$r)&lt;0) and (ypart(z$$r-z$r)&gt;0): %upper right<br>
         extremuml=directionpoint (-slant,1) of (z$l{cornerl-z$l}...betweenl{z$$l-z$l});<br>
         extremumr=directionpoint (-slant,1) of (z$r{cornerr-z$r}...betweenr{z$$r-z$r});<br>
       fi<br>
       else:<br>
        if (xpart(z$$r-z$r)&gt;0)  and  (ypart(z$$r-z$r)&lt;0) 	%lower left<br>
        or (xpart(z$$r-z$r)&lt;0) and (ypart(z$$r-z$r)&gt;0): 	%upper right<br>
         extremuml=z$l;<br>
         extremumr=z$r;<br>
        fi<br>
       fi<br>
      enddef;<br>
      <code><br>
      </code><br>
      vardef pulled_arc.l(suffix $,$$)(expr lsupcorr,rsupcorr) = % inside of arc<br>
       computearcpoints($,$$,lsupcorr,rsupcorr);<br>
       z$l{cornerl-z$l}...betweenl{z$$l-z$l}<br>
        ...{z$$l-cornerl}z$$l<br>
      enddef;<br>
      <code><br>
      </code><br>
      vardef pulled_arc.r(suffix $,$$)(expr lsupcorr,rsupcorr) = % outside of arc<br>
       computearcpoints($,$$,lsupcorr,rsupcorr);<br>
       z$r{cornerr-z$r}...betweenr{z$$r-z$r}<br>
        ...{z$$r-cornerr}z$$r<br>
      enddef;<br>
      <code><br>
      </code><br>
      vardef arc.l(suffix $,$$) = % inside of arc<br>
       pulled_arc.l($,$$,0,0)<br>
      enddef;<br>
      <code><br>
      </code><br>
      vardef arc.r(suffix $,$$) = % outside of arc<br>
       pulled_arc.r($,$$,0,0)<br>
      enddef;<br>
      </code></p>
