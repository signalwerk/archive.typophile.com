    html: |-
      <p>Small caps follow the design of upper case letters.</p>
      <p>I am not aware of any iota with dot accent. Where do you saw it? This may be not a distraction but a less known diacritic combination. It would be interesting to know about it.</p>
      <p>Also note iota is found in Latin, Greek and Cyrillic scripts, being a diferrent character in each one (with different Unicode codification).</p>
