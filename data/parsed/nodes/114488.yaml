    html: |-
      <p>That's a different character: in Turkish, i with dot and i without dot are different letters.<br>
      <a class="freelinking external" href="http://en.wikipedia.org/wiki/Dotted_and_dotless_I" rel="nofollow">http://en.wikipedia.org/wiki/Dotted_and_dotless_I</a></p>
      <p>If you intend your font to support the Turkish language, you need both forms. If not, it would be very confusing to use the dot above I.</p>
