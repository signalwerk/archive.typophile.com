  html: <p>Hi, is it ok to make small caps iota (I) with the dot on top? I know it is not commonly used but is a distraction?</p>
  html_clean: <p>Hi, is it ok to make small caps iota (I) with the dot on top? I know it is not commonly used but is a distraction?</p>
