    html: |-
      <p>I know some display faces include design elements from lower-case letters in their upper case.</p>
      <p>Sometimes it's traditional - an uppercase U that looks like an enlarged lowercase U is found in a number of oldstyle faces.</p>
      <p>Other times, one is dealing with faces that seek to obtain a unicase effect, analogous to the lowercase of Peignot, for example. But while that is "OK" in the sense of being accepted, it is also distracting - so it's done only in intentionally extravagant display faces.</p>
      <p>Think of <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/jazz-gothic/" rel="nofollow">Jazz Gothic</a> from Canada Type, for example.</p>
