    <p>Hi,</p>
    <p>I'm working on a simple book design. The writer requests a Times New Roman, because all previous books in the series were set in times. Is there any alternative to Times that looks a lot a like but has more subtle feel? I know they won't allow me to change the typeface drastically, but maybe they won't notice a slight difference :) It's worth the try.</p>
    <p>Thanks in advance</p>
