      <p>How about the Times New Roman that no one hardly knows about? The pre-Microsoft Times New Roman PS? If I recall, it's slightly wider with differences spread throughout.</p>
      <p>When MS commissioned the typeface for their OS, they had Monotype alter it to match the metrics of the Linotype Times that had been included in Postscript.</p>
