    html: |-
      <p>If you take a sample of Times and put some of its key letter attributes into the <a class="freelinking external" href="http://www.bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>, you will see some fonts with similar structural attributes. Some certainly won't look much like it at all, but at least some will, and you may get some ideas. You can also drop out or modify one or two attributes and see what you get. You can be the judge of how close you would like to get to Times.</p>
      <p>- Mike Yanega</p>
