  date_raw: 18 Jun 2004 — 6:10am
  votes: null
  html: <p>I am designing a logotype for a firm that plan to arrange theme dinners held in various spectacular places. Examples of food could be 'scandinavian' or '18th century menus'. Examples of places could be an old castle or a closed-down railway station. <br> <br>So the arrangements will have a 'adventurous' quality. Therefore the design elements of the identity (fonts, colour, symbols) must have a hint of exotic places, third world, globetrotter, unexplored land ... you know ... <br> <br>I know what colours to choose from and what symbols and patterns. But do any of you know a font with the desired exotic quality to it? <br> <br>-- <br>Soren O</p>
  html_clean: <p>I am designing a logotype for a firm that plan to arrange theme dinners held in various spectacular places. Examples of food could be 'scandinavian' or '18th century menus'. Examples of places could be an old castle or a closed-down railway station. <br> <br>So the arrangements will have a 'adventurous' quality. Therefore the design elements of the identity (fonts, colour, symbols) must have a hint of exotic places, third world, globetrotter, unexplored land ... you know ... <br> <br>I know what colours to choose from and what symbols and patterns. But do any of you know a font with the desired exotic quality to it? <br> <br>-- <br>Soren O</p>
