    date: 2004-06-18T06:54:00
    date_raw: 18 Jun 2004 — 6:54am
    votes: null
    html: <p>I'm wondering if -- assuming these are high end affairs -- that maybe you should brand it as high brow rather than exotic. There is a restaurant chain called <a href="http://www.rainforestcafe.com/">Rainforest Cafe</a> that attempts to provide an exotic ambience by pretending to be a jungle or rainforest. Your client sounds a lot cooler, but I wonder if trying to find exotic fonts will take you down the same cheesy road that Rainforest Cafe did. Good luck!</p>
