      <p>In my regional studies of the Mormon Church in Boston (1830-1860) I have discovered that an early Mormon named Michael Hull Barton (or just Hull Barton) after abandoning Mormonism in 1831, invented a forty-character phonetic alphabet as part of his mystical search for primitive Christianity.  I have uploaded the 1833 periodical he published called "Something New" as a PDF on my website.  Although he had left Mormonism, he continued to pretend he was a Mormon Elder until the mid-1840s.  Some of the characters bear a resemblance to the much later Deseret Alphabet and I speculate that his ideas about discovering a "perfect alphabet" may have lead to the creation of the Deseret Alphabet.</p>
      <p>Download the PDF at <a href="http://connellodonovan.com/something_new.pdf" title="http://connellodonovan.com/something_new.pdf">http://connellodonovan.com/something_new.pdf</a></p>
      <p>If you wish to discuss this further, please contact me at <a href="mailto:odonovan@ucsc.edu">odonovan@ucsc.edu</a></p>
