      <p>Re. Klingon and Unicode:</p>
      <p>The proposal to encode Klingon was rejected on the grounds that it received no support from the Klingon Language Institute. While hobbyists might make some use of the script, those who study and publish in the language overwhelmingly use a Latin transcription, and the KLI told Unicode that they didn't see any need to encode the script. That situation might change, but in the meantime we have the <a href="http://www.evertype.com/standards/csur/" rel="nofollow">ConScript Registry</a> for PUA encoding of Klingon and other scripts of imaginary origin.</p>
