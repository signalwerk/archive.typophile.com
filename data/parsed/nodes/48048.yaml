      5  And there were dwelling at Jerusalem Jews, devout men, out of every nation under heaven.<br>
      6  Now when this was noised abroad, the multitude came together, and were confounded, because that every man heard them speak in his own language. (Acts 2:4–6)</cite></p>
      <p>Concerning the Deseret Alphabet, the second section <a href="http://www.deseretalphabet.com/#born" rel="nofollow">here, (1.2)</a> is helpful. The Deseret alphabet movement from what I understand shouldn't be seen as religious at all. It borrowed a lot from Pittman, was strictly utilitarian and for use only with the English language.</p>
      <p>There are hobbyists who read and write english using the Deseret alphabet today. These folks are of course much rarer than HAM radio enthusiasts who communicate via CW, and decidedly crazier, from what I've heard.</p>
      <p>It was Emigre #52.</p>
      <p>(My apologies in advance to Deseret alphabet hobbyists who also happen to be HAM radio enthusiasts; I totally forgot about you guys.)</p>
