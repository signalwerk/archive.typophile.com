      <p>Without descending into calling early Mormonism a cult, it does seem that part of the intent on the Mormon leaders' part, or at least the intent as seen through the eyes of non-Mormons at the time, was for "the language now introduced... to make the faithful still more peculiar than anything that distinguishes them from other mortals," as The New York Herald wrote in 1859.</p>
      <p>This got me thinking about religious languages and scripts, not only as a way to isolate and control knowledge, but also as an individual's spiritual expression. The Catholic church, of course, kept the Bible in Latin for hundreds of years, probably the most used example of the downsides to controlling a sacred language. But then there's also speaking in tongues, most commonly associated with Pentecostal Christianity, which typically has no discernable structure, but is usually thought of by its practitioners as being the language of angels, or sounding like the languages of the Hebrew and Aramaic Bible. This seems to be the exact opposite of a controlled language, being entirely personal, but it goes even farther than Latin, in that rather than an elite few who can understand it, nobody except the speaker could understand it. I came across this <a class="freelinking external" href="http://realmagick.tripod.com/enochian1.jpg" rel="nofollow">Enochian alphabet</a>, which apparently is believed by those who have studied it to be derived from speaking in tongues. Does anyone know of any other scripts that have come about as a way to transcribe the experience of speaking in tongues?</p>
