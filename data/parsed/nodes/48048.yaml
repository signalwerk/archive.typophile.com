      <p>It is true that one of the stated purposes of the alphabet was to separate the Mormons from the rest of the world. That being said it also served a pragmatic purpose. The person primarily responsible for the alphabet was George D. Watt, said to be the first British convert to the church who studied shorthand under Pitman himself. When he emigrated to the States and joined the main body of the church he was immediately put to work as a scribe for the prophet. In a time where there were no voice recorders having someone that could transcribe the spoken word in real time was extremely useful, especially if you believe that the prophet is a living oracle. One of the primary reasons that so many of Brigham Young's speeches survive in full text is because of George D. Watt's shorthand ability. Compare this to the speeches of Joseph Smith that only exist in fragmented notes (though Joseph Smith's writings do persist; from what I understand Brigham Young wasn't much of a writer).</p>
      <p>It's then easy to understand why Brigham Young may have been excited about the new science (at the time) around phonetics and orthographic reform. It sounds odd now to invent a new alphabet, but there were a lot of prominent people trying just that during this time period. It just so happened that one of the only people with the political clout to make it happen was Brigham Young. As it turns out, starting a new alphabet is challenging for many reasons. The alphabet was never very widely adopted and ultimately died after the saints' isolation ended with the completion of the transcontinental railroad. (I'm writing this from memory, so I may be wrong about some of the timings)</p>
      <p>The metal type version of the alphabet is pretty ugly. However, the handwritten version can be really beautiful, particularly the cursive. It was designed to be written very quickly. Many of the vowels are contained in the upstrokes of a running script. If I remember correctly the foundry commissioned in New York to cast the type version was called Russell and Company (this was the second batch of type commissioned, which is what we mostly see today; the first casting of the alphabet was for the Deseret News, and was much rougher). They based the forms on scotch romans that were popular at the time. In my mind their typographic interpretation of the handwritten forms could have been better, though they were likely instructed by their clients on specifically how the typographic forms were to look. Most of the problems come from the dissonance between shapes created by a running hand created with a pointy nib pen and the shapes of a scotch roman which are (however distantly) based on a broad nibbed pen. Particularly problematic are the vowels, which had thin stems (because they were written with upstrokes in coursive). It's true that the characters don't have ascenders and descenders, but I see this as less of a problem than the rhythm issues caused by the odd thin stems and curly terminals.</p>
      <p>I'm remembering this from a paper I wrote about this is college. I spent a fair amount of time in the special collections section of the BYU Library. At the time I attempted a reinterpretation of the type that was more respectful of the cursive origins of the characters.</p>
    html_clean: |-
      <p>It is true that one of the stated purposes of the alphabet was to separate the Mormons from the rest of the world. That being said it also served a pragmatic purpose. The person primarily responsible for the alphabet was George D. Watt, said to be the first British convert to the church who studied shorthand under Pitman himself. When he emigrated to the States and joined the main body of the church he was immediately put to work as a scribe for the prophet. In a time where there were no voice recorders having someone that could transcribe the spoken word in real time was extremely useful, especially if you believe that the prophet is a living oracle. One of the primary reasons that so many of Brigham Young's speeches survive in full text is because of George D. Watt's shorthand ability. Compare this to the speeches of Joseph Smith that only exist in fragmented notes (though Joseph Smith's writings do persist; from what I understand Brigham Young wasn't much of a writer).</p>
      <p>It's then easy to understand why Brigham Young may have been excited about the new science (at the time) around phonetics and orthographic reform. It sounds odd now to invent a new alphabet, but there were a lot of prominent people trying just that during this time period. It just so happened that one of the only people with the political clout to make it happen was Brigham Young. As it turns out, starting a new alphabet is challenging for many reasons. The alphabet was never very widely adopted and ultimately died after the saints' isolation ended with the completion of the transcontinental railroad. (I'm writing this from memory, so I may be wrong about some of the timings)</p>
