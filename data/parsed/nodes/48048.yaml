    html: |-
      <p>Wow, I finally decide to make a typophile account, and someone is asking about the deseret alphabet.</p>
      <p>I suppose you’ve looked here: <a href="http://www.deseretalphabet.com/" title="http://www.deseretalphabet.com/">http://www.deseretalphabet.com/</a> ? I didn’t read through it, but there are some images of the books printed in the alphabet that are pretty interesting.</p>
      <p>What exactly are you interested in learning about it? At my university, one of the projects for the sophomore typography class is to redesign a number of characters in the deseret alphabet, since theoretically one of the main reasons it failed was simply very poor design. It lacked a lower case, ascenders, descenders, and any sort of consistency between characters. There are probably a few BYU grads here on typophile who have this project archived away somewhere :)</p>
      <p>From what I remember from class, there were a few theoretical premises for the development of a new alphabet or language among a body of people that included 1) an isolated location (Utah, then known as Deseret) and 2) a strong leader (Brigham Young). There were more reasons than that, but those were the two that I remember. They also felt the need for a phonetic alphabet because a large amount of people were immigrants who did not speak English, and they needed an easier way to teach it.</p>
      <p>My teacher showed us some copies of grammar books set in the alphabet and I believe someone in the class was even able to bring in a Book of Mormon from his grandfather who wrote a thesis paper on it. I remember hearing the Univeristy of Utah owns most of the remaining deseret alphabet books. They hold on to them to make people think they’re rare :)</p>
      <p>I’ll have to email my teacher and point out this thread—I'm sure he'll have a few things to add/correct in my brief recap of the project.</p>
      <p>Analisa</p>
