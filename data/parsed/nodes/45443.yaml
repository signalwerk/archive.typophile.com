    <p>(Apologies if this isn’t the right forum.  This is my first post here.)</p>
    <p>I’ve noticed some books from the 1700s, for example this one,</p>
    <p><a href="https://web.archive.org/web/20080907012456/http://books.google.com/books?id=sAoPAAAAQAAJ&amp;pg=PA3" title="http://books.google.com/books?id=sAoPAAAAQAAJ&amp;pg=PA3">http://books.google.com/books?id=sAoPAAAAQAAJ&amp;pg=PA3</a></p>
    <p>put part of the first word from the next page at the bottom of each page.  I’d never seen this before!</p>
    <p>Usually to learn more about something I type it into Google and see what pops up but I have no idea what this technique is called.</p>
    <p>What was this next-word preview for?  Something to help people who had trouble turning the page quickly?</p>
    <p>This book also has codes like A2, B etc on the last line of most pages.  What was this for?  Something help binders put the sheets together?  How did it work?</p>
