      <p>[ Press release from Font Bureau ] <br> <br><b>BENTON SANS</b> <br> <br>Font Bureau is proud to release Benton Sans. <br> <br><a href="http://www.fontbureau.com/BentonSans/" target="_blank">http://www.fontbureau.com/BentonSans/</a> <br> <br>Benton Sans is a direct descendent of America's best Gothic type. <br>This dignified workhorse family of 26 styles already fills the <br>design requirements of such diverse publications as the LA TIMES, <br>GUITAR WORLD, and BUSINESS WEEK. <br> <br>Come see the evolution of an American classic: <br> <br><a href="http://www.fontbureau.com/BentonSans/" target="_blank">http://www.fontbureau.com/BentonSans/</a> <br> <br>Best Regards, <br> <br>Harry, Samantha &amp; Robb <br><a href="mailto:typesales@fontbureau.com">typesales@fontbureau.com</a> <br>The Font Bureau, Inc. <br>326 A St., Suite #6C <br>Boston, MA  02210 <br> <br>617 423 8770 (voice) <br>617 423 8771 (fax) <br> <br><a href="http://www.fontbureau.com" target="_blank">http://www.fontbureau.com</a></p>
