      <p>Some of it is tradition - in the metal days odd-number point sizes<br>
      above 12 were very rare. Since each size had to be made individually<br>
      you had to conserve your efforts, and 12 was an important point size*,<br>
      so the evens won out. Ironically nowadays, hand-hinting being roughly<br>
      comparable in terms of effort** concerning individual point sizes, when<br>
      one decides where to conserve effort, 13 and 15 are the first to go!</p>
      <p>* Because it divides 72 evenly.</p>
      <p>** It's interesting that historically the figure of 8 hours<br>
      per glyph was sort of a benchmark, and when I finished<br>
      Mana (<a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a>)<br>
      I did the math and it came to about 8 hours per glyph!</p>
      <p>BTW, do you plan on releasing your findings?</p>
      <p>hhp</p>
