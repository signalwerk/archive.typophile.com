      <p>"Matt is perfectly fine using point size names on the web or screen."</p>
      <p>I don't think so. My evidence is that you go on to claim that px=pt, and it ain't so. Which clearly proves that there is some ambiguity there. :/</p>
      <p>Browsers say that px x 3/4 = pt. Or if you prefer, pt x 4/3 = px. This is being enshrined in CSS 3. It originates from Windows with its former assumption of 96 dpi screens. So 13 pt = ~17 px, and 15 pt = 20 px.</p>
      <p>Mac OS used to say that px=pt (assuming 72 dpi screens), but I gather that even Safari has now compromised to be consistent with the rest of the web. If there are Adobe apps that still use px=pt, they are out of sync with the rest of the world now.</p>
      <p>Cheers,</p>
      <p>T</p>
