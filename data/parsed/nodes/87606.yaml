      <p>Agreeing with Frode for the most part.</p>
      <p>Rich: "so the diff between 13pt and 14 pt might be rounding to no diff at all"</p>
      <p>Urm, no, multiplying POINTS by 4/3 then rounding will always result in at least a one px difference, and occasionally a two px difference (one time in three), between consecutive point sizes. Going the other direction, two consecutive PIXEL sizes will round to no difference at all 1/4 of the time.</p>
