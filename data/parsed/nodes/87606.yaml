    <p>I've been doing a hell a lot of research on how web typefaces work and render to the point where my boss now believe us as a graphics agency are the most knowledgeable people in London if not the UK.</p>
    <p>(I'll give you a hint, there are very few web typefaces that truly are web fonts.)</p>
    <p>Anyway I've been testing hand hinted typefaces at the sizes we use in the coded website (13pt and 15pt) and even these hand hinted typefaces have rendering issues at this size. However if I render them at say 14pt they seem to improve.</p>
    <p>Can anyone (possibly someone who hints fonts for a living) rationalise this for me? Is there some reason im not seeing that could explain why fonts seem to render better in even numbers over odd numbers?</p>
    <p>Matt Noble<br>
    Scheybeler+company</p>
