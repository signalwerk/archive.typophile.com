    html: |-
      <p>@Richard - I would not bet against the Keef playing Mozart. Or Beethoven.</p>
      <p>Re the Sabrina reference... the key is 'a whole different X' or, rather, 'a completely different $NAME' where NAME can be just about any proper name or unit noun that makes sense to you.</p>
      <p>Anyway, IMAO (when is my opinion not arrogant anyway?), a well-designed web site is or will be different from a well-designed book because the media are different. The book has potentially a fixed, very high dpi resolution and very precise placement of elements. The web site has neither. It doesn't even have a guaranteed form of user interface. A user may be viewing it on a large colour screen, a small monochrome screen or a VT102, or not viewing at all, but using a text-to-speech or text-to-Morse synth. For all I know, there might even be someone with an RJ45 Cat.6 jack in the skull.</p>
