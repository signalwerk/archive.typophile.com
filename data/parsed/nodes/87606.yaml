      <p>@noblematt</p>
      <p>First, I don't understand why you are using CSS 'pt' units for font-size.</p>
      <p>I can understand using 'pt' for print style sheets, but for web pages, it runs overwhelmingly counter to current practice which is to use 'px'. (There are some layout techniques which use ems and percents but that's the exception.)</p>
      <p>What pixel sizes are we talking about? </p>
      <p>I produce fonts for the web. I only test fonts in web browers. I do not use a "hand-hinting" program like VTT (Virtual True Type). I spend, probably, about 15 hours a week on hinting.  I have a test suite of web pages made for examining the results of hinting and other important measures of a font's qualities.</p>
      <p>(BTW - I have no idea what Hrant is talking about. [Sorry, Hrant. I can't make head or tail out of what you've written or it's relevance to screen rendering. To the point where I think you may have missed the point of the guy's question.] Being able to divide evenly into 72 has nothing to do with screen rendering.)</p>
      <p>I DO know what you are talking about, however. Although it certainly doesn't happen with every font or even most fonts. When it happens, my guess is that the scale of the font - the way it's "quantized" - is coinciding in some way with the natural divisions imposed by the pixel grid, which causes irregularities that cause an on-again, off-again effect as you move up (or down) in pixel sizes. I HAVE seen it, and it's an interesting question.<br>
      For me, by the time I'm finished processing the font, the problem disappears so I haven't thought about the cause much.</p>
      <p>What fonts are you looking at? Do you have any screenshots? If it's more convenient, feel free to contact me via email, FB, or leave a post on my blog.</p>
