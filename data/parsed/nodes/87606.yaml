      <p>The pixel vs point naming of type sizes has gone the way of 72 points equal an inch.  In metal type, it just ain't so but it is so damn close that software developers just rounded it to align with the inch ruler. There was a fuss about this early on but the number of metal type purists has shrunk quite a bit since then.  Adobe software sizes a point as equaling a pixel.  This is not a problem because pixel sizes vary with whatever set-up you are looking at. Matt is perfectly fine using point size names on the web or screen.  It only really matters when you try to use "pixel" sizes when doing print work.  Since pixel size is variable,it can be a real problem using the term for print purposes. The other way is no problem with a wink and a nod.</p>
      <p>Hrant is correct in his first post about metal type sizes and even numbers. Since this is a moot point in todays technology, it does not matter much.  What DOES matter is how a typeface is fitted to the grid that a screen uses to show type.  Where does the x-height hit,the sidebearings, crossbars, spaces, punctuation, etc..  </p>
      <p>Matthew Carter's web standard fonts were meticulously fitted to the pixel grid and work quite well.  Stem widths and counters that are even multiples of the pixel grid look great at the sizes they were fit to.  If your type looks great at a 2 pixel stem with, etc., when you size up by one point size, you knock it all haywire and nothing fits very well.<br>
      Rather than standardizing your font sizes on a given point size as a firm rule, you should first try out the typefaces you will really be using and find their sweet spot size.  You may find that Font X works best at 13 px but Font Y is best at 14 px.  You will need to fix your CSS to jive with your chosen font, not just in name, but in size as well.  Hinting will certainly help but being careful to mach font to fit size to sweet-spot on screen really matters.</p>
