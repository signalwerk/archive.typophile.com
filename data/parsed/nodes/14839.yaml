      <p>IMHO the best Hebrew fonts are made by Fontbit in Israel. <a href="http://www.fontbit.co.il" title="www.fontbit.co.il">www.fontbit.co.il</a>.<br>
      If you need a font fixed up, then it depends what you need. If you need the outlines cleaned up, then you should contact Fontbit. If you have outlines and you need the font converted for Opentype (including nikud) then the expert is Arieh Marzel. If you need to contact him, then get in touch with me off-line since he doesn’t like his contact details posted online for obvious reasons.</p>
