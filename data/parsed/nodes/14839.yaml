      <p>Thanks for all the answers! Now I can pass this on if I need to for sure.</p>
      <p>I finally got the font to look at it. The font is a terrible mess because it was made from auto-tracing. In order to spare the company involved I won’t name the foundry ( if you can call it that ) or the ’designer’. In fairness, it is probably a small market. Think how hard it is to sell a font for english use? </p>
      <p>I have a couple of questions:</p>
      <p>- For future reference what Hebrew fonts are actually well made?</p>
      <p>- Some hebrew specific questions: When You have a daled with a sh’va &amp; a dagesh (dot) the sh’va should still be centered under the leg or descender of the daled right? What about the size of the sh’va? Should it become smaller when there is a daled - or stay the same size?</p>
