    html: <p>Stephen, can you post some images of Christian's interrobangs? I have not been able to navigate to any image of them via the fontshop links. Amplitude is a pretty wide and open design anyway, so I can see that in such a context it might be easier to produce an interrobang that looks reasonable and doesn't black up. In a typical text face, it is much more difficult. This is what I did, under protest, for Constantia, thereby lowering the standard of an otherwise pretty good typeface. <br><img src="http://www.typophile.com/forums/messages/30/64727.gif" alt="Constantia interrobang. Ugh!"> <br>My main objection to the interrobang isn't its ungainly form, but its grammatical nonsense. It is a 'punctuation mark' for people who don't know how to correctly punctuate. It is entirely telling that the English language persisted for hundreds of years without the need for such a sign, until some advertising executive -- a breed not known for their finely honed grammar -- came up with the idea. Meanwhile, professional copy editors continue to correct misuse of question mark and exclamation mark, because they know the difference between a question and an exclamation.</p>
