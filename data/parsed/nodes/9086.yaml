    html: <p>it is basically impossible to design an interrobang that does not turn into a dark blot at small sizes.  This is not always true. Christian Schwartz has included a version that, while fairly wide for punctuation, works as well as its individual parts at all sizes.  See it in <a href="http://www.fontshop.com/fonts/singles/font_bureau/amplitude_wide_bold/&amp;sample_text=%C3%B7&amp;sample_size=144" rel="nofollow">Amplitude</a> and <a href="http://www.fontshop.com/fonts/singles/font_bureau/fritz_robusto/&amp;sample_text=%C3%B7&amp;sample_size=144" rel="nofollow">Fritz</a>.</p>
