    html: <p>Does grammar affect our ability to successfully communicate our thoughts? Can we think ?! without having a symbol (or multiple symbols combined) to express it? The Whorfian Hypothesis suggests that language shapes our understanding of the world. If we don't have language to describe an emotion or a state of being, then that emotion or state of being doesn't exist. <br>whoa...my head hurts... <br> <br>If the use of the semi-colon (or lack of it) has to do with grammar education (or lack of it), then access to the interrobang (or lack of it) also limits the possibility of its use. Is it possible that the semicolon is no longer being taught simply because it holds less and less of an important function in our language? I'd argue that language and grammar work in a social/politcal-darwinian sense. What sticks around (and who decides to keep it around) remains functionable; what develops is based on the needs (and those that hold the power) of the language.  <br> <br>We can compare the interrobang to the evolution of the <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> or the <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0">, the emo-cons. Emo-cons are incorporated into interactive programs in order to address the needs of users by expressing specific emotions in their online conversations. What if...the interrobang worked like an emo-con or an Open Type ligature, where typing ?! would automatically change into an interrobang? How would users react?  <br> <br>hmmmm.......</p>
