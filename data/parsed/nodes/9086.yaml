    html: "<p>But Darrell, I'm not 'fighting against the interrobang'. I don't need to fight against the interrobang. In thirty or so years, this advertising gimmick has gone absolutely nowhere. I'm just explaining <i>why</i> is has gone nowhere and why it will continue to go nowhere. There are fonts that contain it. It is encoded in Unicode. People don't use it. Even in handwritten notes, where it would surely be the easiest thing in the world to employ, people simply do not use it. They use ?! or !?  <br> <br>When this subject came up on the ATypI list last year, one of our Iberian colleagues made the point that, in terms of conveying expression, there is a difference between ?! and !?, and even !?! can be independently interepreted. So even in terms of expressive typography the interrobang is a non-starter: an ambiguous mark that is incapable of conveying the subtleties of expression that misuse of existing punctuation symbols does better. <br> <br>I think the experimental stuff from the Underware workshop that Titus linked to above -- whole systems for articulating textis -- is much more interesting than the interrobang.</p>"
