    html: "<p>There is no such thing as an 'exclaimed question'. An exclamation is a specific kind of grammatical construction; it is not just any old statement with an exclamation mark stuck at the end. Adding an exclamation mark to a statement does not make it an 'exclaimed statement'. Grammar does not need an exclamation mark to distinguish a 'plain statement from an exclaimed statement'; it uses an exclamation mark to clearly distinguish an exclamation from a <i>question</i> (the most common form of exclamation begins with an interrogative): 'How lovely!' as distinct from 'How lovely?'</p>"
    html_clean: "<p>There is no such thing as an 'exclaimed question'. An exclamation is a specific kind of grammatical construction; it is not just any old statement with an exclamation mark stuck at the end. Adding an exclamation mark to a statement does not make it an 'exclaimed statement'. Grammar does not need an exclamation mark to distinguish a 'plain statement from an exclaimed statement'; it uses an exclamation mark to clearly distinguish an exclamation from a <i>question</i> (the most common form of exclamation begins with an interrogative): 'How lovely!' as distinct from 'How lovely?'</p>"
