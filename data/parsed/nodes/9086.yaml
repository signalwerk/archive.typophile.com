    html: "<p><i>As language evolves, it omits the parts it doesn't need anymore (so if the semi-colon isn't being used too often, it *could* drop off altogether...</i> <br> <br>George Orwell was convinced in the 1940s that the semicolon was obsolete. I use the semicolon almost every day. This isn't because I'm a 'purist', but because I frequently construct thoughts in a way that calls for that punctuation. I could separate the thought into two completely distinct sentences. I could use a period instead of a semicolon. But that isn't quite the same thing. <br> <br>The semicolon has fallen out of widespread use simply because it is not taught. People don't know how to use it, so they avoid it. But everyone I've met who does know how to use a semicolon does use it. Not surprisingly, a knowledge of grammar extends the ways in which you can express your ideas. This used to be taught; indeed, grammar and rhetoric are the foundation of classical education. It isn't about rules: it's about tools.</p>"
