    date: 2005-02-07T00:59:00
    date_raw: 7 Feb 2005 — 12:59am
    votes: null
    html: "<p>Grammar is the system by which a language operates. The system is extensible, but if something is <i>contrary</i> to what is already established in the system, it is unlikely to catch on. So people have been asking for years 'Why hasn't the interrobang caught on?' And I'm answering: because it is contrary to our system of grammar, which makes a clear distinction between a question and an exclamation. Language is complex, but it is anything but arbitrary: it is the strongest evidence we have of the intensely structured nature of the human brain. Yes, languages develop, but they develop along specific lines. Capricious inventions by advertising executives are ever unlikely to catch on. The really remarkable thing about the interrobang is not that it didn't catch on -- that should have been predictable --, but that all these years later people are still asking why it didn't catch on. <br> <br>Changes in pronunciation -- which may be based on error or confusion, as in your 'expresso' example -- have nothing to do with grammar. Pronunciation is conventional and essentially arbitrary. Grammar is systematic. <br> <br>Here is a more precise analogy. Millions of people use semicolons incorrectly; this does not mean that we are developing new usages for the semi-colon. There is one grammatical construction -- one grammatical circumstance -- in which we need a punctuation mark that does what the semicolon does. Any other use of the semicolon is simply pointless: a use of the mark where a different mark is appropriate. The same is true of the interrobang. In every situation where one might be tempted to use an interrobang, there is another mark -- usually a question mark -- that is intended to be used in that circumstance.</p>"
