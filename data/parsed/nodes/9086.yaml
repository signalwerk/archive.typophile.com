    html: "<p>From <i>American Metal Typefaces of the Twentieth Century,</i> by Mac McGrew, in the entry about Americana (p. 13): <br> <br>\"The interrobang, the first new puctuation mark to have been introduced in three hundred years and the only one invented by an American, is also featured in Americana. The interrobang, combining exclamation and question marks, was originated in 1962 by Martin K. Speckter, New York advertising executive and printing hobbyist. It was incorporated into all versions of Americana (ATF calling it 'interabang'), but although it got considerable response at the time, it was not included in other type families.\" <br> <br>Americana Bold was the last new typeface produced by ATF. There is probably no causal relation between these two facts, however.</p>"
