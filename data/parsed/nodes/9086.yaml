    html: "<p>I have, under duress, included the interrobang in a family of fonts (Constantia) because the client requested it. My approach to the design was, I believe, novel, but basically this symbol is utter crap: it was poorly thought out, and it is basically impossible to design an interrobang that does not turn into a dark blot at small sizes. The construction of the symbol is illogical and counter to the organic evolution of written forms. <br> <br>The interrobang is not essential to rhetorical questions'. It is a grammatically nonsensical mark, of possible interest only to someone who doesn't know the difference between a question and an exclamation. A rhetorical question is still a question, and should be terminated with a question mark. An exclamation is a statement that begins with an interrogative (typically what or how) but does not take the form of a question. The interrobang? How foolish!</p>"
