    html: "<p>Yet another case of some people clinging to the status quo to preserve their standing. <br> <br>All languages have deficiencies, and it would be nice to address them. English is missing all kinds of important things. Think of how nicely the opening exclamation and question marks work in Spanish*; or how powerful the floating exclamation, question, emphasis and elongation marks are in Armenian. Another thing missing in English (and in fact all languages I know of): a mark for rhetorical questions**, which actually existed in the past, if I'm not mistaken. Rulemongers (and Modernists) often rob us of such nice tools. <br> <br>* They save a lot of regression. <br> <br>** Which could actually be right up the interrobang's alley! <br> <br>hhp</p>"
