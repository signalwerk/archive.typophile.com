  html: <p>I am currently working on a thesis project based upon the interrobang. The project revolves around re-introducing the interrobang back into our vernacular. I am having issues with finding plentiful information on this subject. If anyone has any information about the interrobang or any tid bits of facts. <br>Some of the questions that I am trying to answers are fairly simple. <br> <br>Why has the interrobang been included in only times new roman as part of the international character palette if it is copyrighted, when this is one of the most common typefaces distributed world wide? <br> <br>How come this quirky piece of punctuation has been over looked by most designers? <br> <br>How have we forgotten something that is essential to those wonderful rhetorical questions? <br> <br>So if any one has any ideas or opinions about the interrobang i'd like to here what everyone has to say.</p>
