    votes: null
    html: "<p><i>We can compare the interrobang to the evolution of the :-) or the :-(, the emo-cons.</i> <br> <br>Indeed. That is exactly what we can compare it to. I believe the interrobang <i>is</i> what we would now call an emoticon (I'm not familiar with the variant emo-con). That is, it is an extra-grammatical sign that provides a cue to emotive articulation of text. This is exactly the point I made earlier when I acknowledged that there is an <i>ungrammatical</i> use for the interrobang. What I object to is the oft-repeated statement that the interrobang is a <i>punctuation</i> mark. It seems to me that this is an assumption based solely on the fact that it looks like a punctuation mark, rather than on any attempt to analyse the use of the mark. Punctuation marks are a class of signs that correspond to the division of utterances into phrases and into classes (statement, question, exclamation, etc.) that are products of syntax and morphology. This division is grammar, and it is something that happens at a much lower level of language than emotive articulation. Some punctuation marks, especially the question mark, are particularly useful because of our habit of abbreviation, which can make syntactical constructions ambiguous. So, for example, if someone tells us 'Dinner will be ready soon' we might abbreviate the question 'How soon will dinner be ready?' to simply 'How soon?' In this case, the syntax of the utterance 'How soon' doesn't clearly indicate that this is a question, so the punctuation mark which performs only a supporting role to the full construction 'How soon will dinner be ready' becomes essential to understanding. This is the sort of thing that punctuation marks do. They do not signal emotional articulation. They belong to a different class of signs from <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> and <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> etc.. So I maintain that the interrobang is not a punctuation mark and has no grammatical function, because its purpose is to articulate something extra-grammatical, e.g. questioning suprise or disbelief. <br> <br>I think it is very telling that of all the many writing systems in the world, none have developed a primary system of emotive articulation, while almost all have developed or adopted some level of punctuation (beginning with a space or marker to separate words or, in the case of written languages like Thai and Burmese, phrases). But there are many <i>secondary</i> systems of emotive articulation, which are not grammatical but are used by specific communities as a layer on top of grammar. The point about specific communities is very important in this regard because, while all symbols are conventional, punctuation marks correspond to describable aspects of the structure of language, while things like emoticons correspond to extra-linguistic, social conventions and are often identifiers of specific groups or 'tribes'. The systems of secondary articulation of writing employed by Japanese schoolgirls are only partly intuitively understandable by readers outside that community. The system of emoticons employed on Typophile and many other forums, along with their plain text equivalents, are understood by a much larger and more international community, but this does not make them primary signs of any written language. They remain a level above grammar. They are also much more subject to fashion than punctuation, since they are primarily used in ephemeral utterances, while more formal written language is intended to communicate not only among a members of a particular community at a particular time, but between writers and readers from different communities living hundreds of years apart from each other. Secondary systems seldom last that long, while punctuation tends to evolve only very slowly and, once a language has developed a consistent system that works, it is more likely to solidify than to change. <br> <br>An interesting case of secondary articulation is the non-vowel markings of the Hebrew Bible. Some of these secondary marks -- accent or cantillation marks -- have continued to be understood, or at least systematically interpreted within specific communities, for many centuries because of their musical significance. But there are some secondary marks in ancient Hebrew manuscripts, the puncta extraordinaria for instance, whose original meaning is lost and which we can only guess at. Hundreds of years from now, scholars might look at the handwritten notes of Japanese schoolgirls from the early years of the 21st century and ponder what the little hearts and cat faces meant to that community. The same researchers will be able to determine what the punctuation marks in the documents mean by analysing the structures of the language and how these marks relate to them. This is the difference between primary (grammatical) and secondary (extra-grammatical) notation of language: the former is tied to the structures of language, while the latter applied like a layer and can be easily disassociated. <br> <br>So what is the interrobang? It looks like a primary mark, because it references the form of two primary marks. But one of those two marks, the exclamation mark, is itself used by many people as an emotive articulation sign! (as I just did there, for emphasis, even though grammatically that was not an exclamation). Indeed, this <i>secondary use</i> of the exclamation mark is much more common today than its primary use as a punctuation mark properly understood. So the interrobang hijacks this secondary, emotive articulating use of the exclamation mark and marries it to the question mark, which is still primarily a punctuation mark and only seldom used in a secondary way (usually in isolation, as a kind of abbreviation). So it is neither one thing nor the other, but relies for what functionality it does have on a secondary use of the exclamation mark, and there seems to be general agreement throughout this thread that it is used to express something about the <i>way</i> a question is asked, which indicates to me that it is a kind of emoticon. Typically for a secondary mark, it has been subject to fashion. It was briefly in fashion in the 1970s, and one could pay to have one's typewriter modified to include it. It may come back into fashion. But it will never be a punctuation mark because there is no grammatical construct with which it is associated, which is the defining characteristic of all other punctuation marks. It tells us something extra-grammatical about an utterance, but even this is doesn't seem to do very clearly or well, especially if you care about a distinction between ?! and !? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
    html_clean: "<p><i>We can compare the interrobang to the evolution of the :-) or the :-(, the emo-cons.</i> <br> <br>Indeed. That is exactly what we can compare it to. I believe the interrobang <i>is</i> what we would now call an emoticon (I'm not familiar with the variant emo-con). That is, it is an extra-grammatical sign that provides a cue to emotive articulation of text. This is exactly the point I made earlier when I acknowledged that there is an <i>ungrammatical</i> use for the interrobang. What I object to is the oft-repeated statement that the interrobang is a <i>punctuation</i> mark. It seems to me that this is an assumption based solely on the fact that it looks like a punctuation mark, rather than on any attempt to analyse the use of the mark. Punctuation marks are a class of signs that correspond to the division of utterances into phrases and into classes (statement, question, exclamation, etc.) that are products of syntax and morphology. This division is grammar, and it is something that happens at a much lower level of language than emotive articulation. Some punctuation marks, especially the question mark, are particularly useful because of our habit of abbreviation, which can make syntactical constructions ambiguous. So, for example, if someone tells us 'Dinner will be ready soon' we might abbreviate the question 'How soon will dinner be ready?' to simply 'How soon?' In this case, the syntax of the utterance 'How soon' doesn't clearly indicate that this is a question, so the punctuation mark which performs only a supporting role to the full construction 'How soon will dinner be ready' becomes essential to understanding. This is the sort of thing that punctuation marks do. They do not signal emotional articulation. They belong to a different class of signs from <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> and <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> etc.. So I maintain that the interrobang is not a punctuation mark and has no grammatical function, because its purpose is to articulate something extra-grammatical, e.g. questioning suprise or disbelief. <br> <br>I think it is very telling that of all the many writing systems in the world, none have developed a primary system of emotive articulation, while almost all have developed or adopted some level of punctuation (beginning with a space or marker to separate words or, in the case of written languages like Thai and Burmese, phrases). But there are many <i>secondary</i> systems of emotive articulation, which are not grammatical but are used by specific communities as a layer on top of grammar. The point about specific communities is very important in this regard because, while all symbols are conventional, punctuation marks correspond to describable aspects of the structure of language, while things like emoticons correspond to extra-linguistic, social conventions and are often identifiers of specific groups or 'tribes'. The systems of secondary articulation of writing employed by Japanese schoolgirls are only partly intuitively understandable by readers outside that community. The system of emoticons employed on Typophile and many other forums, along with their plain text equivalents, are understood by a much larger and more international community, but this does not make them primary signs of any written language. They remain a level above grammar. They are also much more subject to fashion than punctuation, since they are primarily used in ephemeral utterances, while more formal written language is intended to communicate not only among a members of a particular community at a particular time, but between writers and readers from different communities living hundreds of years apart from each other. Secondary systems seldom last that long, while punctuation tends to evolve only very slowly and, once a language has developed a consistent system that works, it is more likely to solidify than to change. <br> <br>An interesting case of secondary articulation is the non-vowel markings of the Hebrew Bible. Some of these secondary marks -- accent or cantillation marks -- have continued to be understood, or at least systematically interpreted within specific communities, for many centuries because of their musical significance. But there are some secondary marks in ancient Hebrew manuscripts, the puncta extraordinaria for instance, whose original meaning is lost and which we can only guess at. Hundreds of years from now, scholars might look at the handwritten notes of Japanese schoolgirls from the early years of the 21st century and ponder what the little hearts and cat faces meant to that community. The same researchers will be able to determine what the punctuation marks in the documents mean by analysing the structures of the language and how these marks relate to them. This is the difference between primary (grammatical) and secondary (extra-grammatical) notation of language: the former is tied to the structures of language, while the latter applied like a layer and can be easily disassociated. <br> <br>So what is the interrobang? It looks like a primary mark, because it references the form of two primary marks. But one of those two marks, the exclamation mark, is itself used by many people as an emotive articulation sign! (as I just did there, for emphasis, even though grammatically that was not an exclamation). Indeed, this <i>secondary use</i> of the exclamation mark is much more common today than its primary use as a punctuation mark properly understood. So the interrobang hijacks this secondary, emotive articulating use of the exclamation mark and marries it to the question mark, which is still primarily a punctuation mark and only seldom used in a secondary way (usually in isolation, as a kind of abbreviation). So it is neither one thing nor the other, but relies for what functionality it does have on a secondary use of the exclamation mark, and there seems to be general agreement throughout this thread that it is used to express something about the <i>way</i> a question is asked, which indicates to me that it is a kind of emoticon. Typically for a secondary mark, it has been subject to fashion. It was briefly in fashion in the 1970s, and one could pay to have one's typewriter modified to include it. It may come back into fashion. But it will never be a punctuation mark because there is no grammatical construct with which it is associated, which is the defining characteristic of all other punctuation marks. It tells us something extra-grammatical about an utterance, but even this is doesn't seem to do very clearly or well, especially if you care about a distinction between ?! and !? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
