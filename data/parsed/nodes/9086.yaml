    html: <p>The interrobang raises many questions (ha!) regarding the visualization of language, especially at a time when we are relying more and more on writing (or typing, that is) to express emotion within conversation (like we're doing right now).  <br> <br>If the keyboard was supplied with an interrobang key, I'd bet more people would use it, especially in conversations like this one.  <br> <br>Sociolinguists would question the idea that grammar is a closed system that doesn't change. In fact, grammar does shift and change, albeit at a much slower pace than pronunciation. For example, if we read Chaucerian English now, it hardly sounds grammatically correct. AAVE (African American Vernacular English), a well-documented dialect of Standard English, has developed its own grammar system that is as systematic as standard English. <br> <br>The interrobang hasn't been around long enough, nor is it very accessible to most people to necessarily omit the possibility that it could catch on. As language evolves, it omits the parts it doesn't need anymore (so if the semi-colon isn't being used too often, it *could* drop off altogether - purists, attack!!!) and creates new modes of expression. <br> <br>amy ;)</p>
