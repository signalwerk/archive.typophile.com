    html: "<p><i>I do feel it's actually gramatically useful.</i> <br> <br>Perhaps you'll think I'm less of a 'purist' if I acknowledge that it is <i>ungrammatically</i> useful? Yes, it is useful to people who do not express themselves grammatically. But then so is <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> , and I don't consider that punctuation. <br> <br>I'm afraid there is simply no argument to be made for the interrobang being grammatically useful, because grammar distinguishes a question from an exclamation and assigns a specific, individual punctuation mark to each. There is no ambiguous case in which one cannot determine whether something is a question or an exclamation. Most things that are concluded ?! are in fact questions, and should be concluded ?.  <br> <br>So what does ?! represent? What indeed! It might be the raised eyebrows when we question something we can scarcely believe. Or it might be the tone of indignation when we question what seems to us wrong. But neither of these are <i>grammatical.</i> They belong to a level of textual articulation above the grammatical. So, yes, one can say that the interrobang might be ungrammatically useful, or even extra-grammatically useful. But this is an argument against the notion of the interrobang as a new (and proudly American) <i>punctuation</i> mark. It may look like a punctuation mark, it may have hijacked two punctuation marks, but it functions as something other than and beyond a punctuation mark. <br> <br>The interrobang itself is a symptom of ungrammatical usage of the exclamation mark, especially beloved of ad-men like Martin Speckter, to express loudness. You know: loudness! Since, according to this usage, the exclamation mark can be added to <i>any</i> statement, regardless of whether it is grammatically an exclamation or not, it is assumed that it can be added to what is grammatically a question. Correct use of the exclamation mark is one of the least taught aspects of English grammar, even more poorly understood by most people than the semi-colon and apostrophe.</p>"
