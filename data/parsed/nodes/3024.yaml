  html: "<p>I have been looking for this font for the past few years.  The most distinguishable characthers are the \"S\" and \"R\" which make them look different from the many look-a-likes. <br> <br>The font is NOT: <br>Compacta <br>Haettenschwiller <br>Impact <br>Soft Hits <br>Gogo Big <br>Gogo Squat <br>California Grotesk <br> <br> <br> <br>Here are the links:  They are a bit embarassing, but, oh well <br> <br><a href=\"http://www.lonestarspice.com/albums/swjapback.jpg\" target=\"_blank\">http://www.lonestarspice.com/albums/swjapback.jpg</a> <br> <br><a href=\"http://www.lonestarspice.com/videos/istanbulvcd.jpg\" target=\"_blank\">http://www.lonestarspice.com/videos/istanbulvcd.jpg</a> <br> <br><a href=\"http://www.lonestarspice.com/videos/istanbulcd1.JPG\" target=\"_blank\">http://www.lonestarspice.com/videos/istanbulcd1.JPG</a> <br> <br><a href=\"http://www.lonestarspice.com/videos/wembley1cd.JPG\" target=\"_blank\">http://www.lonestarspice.com/videos/wembley1cd.JPG</a> <br> <br>The font was also used on the Johnny English movie poster. Like the previous pictures, it's the text in the grey and red on this link: <br> <br><a href=\"http://images.art.com/images/products/regular/10104000/10104782.jpg\" target=\"_blank\">http://images.art.com/images/products/regular/10104000/10104782.jpg</a>  <br>  <br></p>"
