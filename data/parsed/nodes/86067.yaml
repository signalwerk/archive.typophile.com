    <p>Hello Typophyles!</p>
    <p>      I Am currently working on an Arabic Font. I want to know is it possible in Microsoft Volt (preferably) or in FontLab to use the same glyph for alternate Ijam (Dots) placement? I have attached an Image explaining my query. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Graphic1_6056.jpg"></div><p></p>
    <p>      For example I made a ligature in the font as the one on the right side of the image "hahhahisolated". Then I have to make eight more glyphs with the same shape but only Ijam (Dots) difference as shown in the Image. So In the font I have to assign the same shape to nine glyphs instead of one. As a result the number of glyphs increases too much in the font while I want to keep them less. How can I use only one glyph with Ijam variation on the same glyph in Microsoft Volt? If it is not possible in Volt than how can I do it in FontLab?</p>
    <p>Please Help me.............</p>
