      <p>In my <a class="freelinking external" href="http://www.amirifont.org" rel="nofollow">Amiri</a> font I used to have dots separated from base of the glyph, the idea is simple:</p>
      <p>* first you have a ccmp feature that decomposes the glyphs, something like (using feature file syntax):</p>
      <pre>feature ccmp {
        sub haa  by haa.base;
        sub khaa by haa.base dot.above;
        sub jeem by haa.base dot.below;
        ...
      } ccmp;
      </pre><p>
      Where <code>haa.base</code> is the dotless glyph, and <code>dot.above</code> and <code>dot.below</code> are zerowidth glyphs with mark glyph class.</p>
      <p>* from now on all glyph substitution is done on base glyphs, e.g.:</p>
      <pre>feature init {
       lookupflag IgnoreMarks;
        sub haa.base by haa.base.init;
        ...
      } init;

      feature liga {
       lookupflag IgnoreMarks;
        sub haa.base.init haa.base.fina by haahaa.isol.liga;
        ...
      } liga;
      </pre><p>
      The <code>IgnoreMarks</code> flag is very important, else the dots will interfere with the substitution.</p>
      <p>* lastly, you use anchor marks for placing dots just like tashkil marks.</p>
      <p>* some characters have different dot placement depending on their form, e.g. farsi yeh have dots only in final/isolated forms, for these characters you are better doing decomposition in init, medi etc. features, e.g.:</p>
      <pre>feature init {
        sub farsiyeh by yeh.base.init twodots.below;
        ...
      } init;

      feature fina {
        sub farsiyeh by yeh.base.fina;
        ...
      } fina;
      </pre><p>
      However, this has some side effects, e.g. sometimes you need different kerning for glyphs with dots below than glyphs with dots above, sometimes certain dotted combinations don't go well together and you need to avoid ligatures in these combinations and this becomes tricky because the dots are treated as combining marks so you can't use them as context until you remove the <code>IgnoreMarks</code> flag and I ended up abandoning the idea.</p>
      <p>* A different strategy to decrease the number of glyphs is to avoid ligatures at all and use contextual forms instead. e.g. instead of the haahaa ligature above you "cut" the ligature into two parts:</p>
      <pre>@clsHaaInit = [haa.init khaa.init jeem.init ...];
      @clsHaaFina = [haa.fina khaa.fina jeem.fina ...];
      @clsHaaInit.HaaHaa = [haa.init.haahaa khaa.init.haahaa jeem.init.haahaa ...];
      @clsHaaFina.HaaHaa = [haa.fina.haahaa khaa.fina.haahaa jeem.fina.haahaa ...];

      lookup haahaa.isol {
        sub @clsHaaInit by @clsHaaInit.HaaHaa;
        sub @clsHaaFina by @clsHaaFina.HaaHaa;
      } hhaahaa.isol;

      feature calt {
        sub @clsHaaInit' lookup haahaa.isol @clsHaaFina' lookup haahaa.isol;
      } calt;
      </pre><p>
      Since we have 15 haa-like characters in Unicode, this cuts the number of glyph needed for this ligature from 15×15=225 (number of all possible combinations) to 15+15=30 (number of components).</p>
      <p>(PS. the names used above are arbitrary, you can use whatever glyph names you like).</p>
