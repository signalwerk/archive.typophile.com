    html: <p>Yes, this is possible, as Khaled describes. One thing to consider, though, is that this will break with Microsoft Office's options to display marks in different colours or not to display marks, since it has no way to distinguish dots treated in this way from other marks. This shouldn't necessarily stop you from doing this approach -- and for some styles of Arabic such as nastaliq it is the only sensible approach --, but it is something to be aware of and may result in some support contact from confused users.</p>
