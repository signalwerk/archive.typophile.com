      <p>*Edited for idiocy*<br>
      There's nothing out there just like *HFJ Didot* in terms of contrast and those beautiful s-curves, but some cousins include Linotype Gianotten Light, Paratype Bodoni, Andrade, and for the numbers Bodoni Classic Bold Swashes by Wiescher Design.</p>
      <p>Obviously, I had a nice tour of type looking for this one, but when I found it and refreshed, the answer was there. At least I have some more knowledge of this little corner of the world.</p>
      <p>Horton<br>
      Founder, <a href="http://www.thisdayintype.com" target="_blank" rel="nofollow">This Day in Type</a></p>
