    html: |-
      <p>Hi Stephan,</p>
      <p>Thank you for the reply. Actually the typeface is called Deloitte Script - part of a brand and unfortunately not available to the public. I found out the name through a PDF it was used in.</p>
      <p>Yes MVB Calliope is very close - might need thinning out a bit and straightened slightly. There is also Wiesbaden Swing which is sort of similar.</p>
      <p>Thanks again though.<br>
      Mukhtar</p>
