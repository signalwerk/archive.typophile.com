  html: |-
    <p>Bitmaps are used to describe graphics on computers. They consist of a grid of colored squares. Each of these squares is called a <a href="/wiki/Pixel" class="freelinking" rel="nofollow">Pixel</a> from 'picture element'. The simplest bitmaps consist of pixels that are either black or white. Bitmap graphics are also called <a href="/wiki/Raster" class="freelinking" rel="nofollow">Raster</a> graphics.</p>
    <p>A bitmap font is a font comprised of characters rendered with bitmaps. While most bitmap fonts are designed with black and white pixels, some contain grey pixels or are full color. Full color bitmap fonts are also called <a href="/wiki/Photofonts" class="freelinking" rel="nofollow">Photofonts</a>. The application <a href="/wiki/Bitfonter" class="freelinking" rel="nofollow">Bitfonter</a> is designed specifically for authoring bitmap fonts.</p>
