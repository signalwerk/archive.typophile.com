  html: |-
    <p>Bitmaps are used to describe graphics on computers. They consist of a grid of colored squares. Each of these squares is called a <a href="/node/add/wiki?edit%5Btitle%5D=Pixel" title="Create node &quot;Pixel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Pixel</a> from ‘picture element’. The simplest bitmaps consist of pixels that are either black or white. Bitmap graphics are also called <a href="/node/add/wiki?edit%5Btitle%5D=Raster" title="Create node &quot;Raster&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Raster</a> graphics.</p>
    <p>A bitmap font is a font comprised of characters rendered with bitmaps. While most bitmap fonts are designed with black and white pixels, some contain grey pixels or are full color. Full color bitmap fonts are also called <a href="/node/add/wiki?edit%5Btitle%5D=Photofonts" title="Create node &quot;Photofonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Photofonts</a>. The application <a href="/node/12765" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitfonter</a> is designed specifically for authoring bitmap&nbsp;fonts.</p>
