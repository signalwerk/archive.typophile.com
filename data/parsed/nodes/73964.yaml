    html: |-
      <p>According to the Hoefler &amp; Frere-Jones <a class="freelinking external" href="http://www.typography.com/ask/faq.php?faqID=107#Faq_107" rel="nofollow">website</a> in the FAQ section:</p>
      <p>What font is used in the "H&amp;FJ" logo? The ornate "H&amp;FJ" in the background of our logo isn't a typeface, it's a piece of lettering created by Jonathan Hoefler. The words "Hoefler &amp; Frere-Jones" in the foreground are set in Tobias Frere-Jones' Gotham Bold typeface.</p>
      <p>Although what you posted isn't the logo, I would assume the response might still apply.</p>
