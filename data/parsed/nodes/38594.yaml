    html: <p>Logos are often hand drawn, particularly those based on calligraphy. So I'll bet this is not a font, but <a href="http://www.fontshop.com/fonts/singles/linotype/shelley_script_lt_std_ot/?sample_text=Gordons&amp;sample_size=144&amp;acs_ss=-1&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Shelley</a> will get you close.</p>
