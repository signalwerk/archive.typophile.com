    <p>Pistilli Roman has been released by Veer.</p>
    <p><a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000118" title="http://www.veer.com/products/typedetail.aspx?image=JBT0000118">http://www.veer.com/products/typedetail.aspx?image=JBT0000118</a></p>
