  html: <p>Im designing a logo for a night club for a very difficult client that doesnt like to give me any sort of info on the thing im designing. Anyway, he basically wants it to be completely simple and ultra chic. I did a mock up for him doing a very simple mark and logotype (straight out of the can helvetica neue ultra light.. which he LOVES). I am wondering what other typefaces are out there that would give me that ultra modern look, with very very thin strokes. Thanks!</p>
  html_clean: <p>Im designing a logo for a night club for a very difficult client that doesnt like to give me any sort of info on the thing im designing. Anyway, he basically wants it to be completely simple and ultra chic. I did a mock up for him doing a very simple mark and logotype (straight out of the can helvetica neue ultra light.. which he LOVES). I am wondering what other typefaces are out there that would give me that ultra modern look, with very very thin strokes. Thanks!</p>
