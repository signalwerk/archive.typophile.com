    votes: null
    html: "<p>But you'd have to be drunk to <i>start</i> with Helvetica!  :-) <br>Unless this club happens to have a Barbarella theme. <br> <br>Jason, before you choose a font, think of what it should look like. There are so many choices (many of them nominally good) that you can easily get distracted from a choice that will <i>really</i> click - so narrowing things down helps. <br> <br>I would say you need something narrow, thin, but also somewhat rigid. And if it's lc, maybe something with a small x-height (unless visibility is a serious issue). <br> <br>And the most important thing: <br>What's the <i>name</i>? Different glyphs sing in different ways, especially in chorus. <br> <br>hhp</p>"
    html_clean: "<p>But you'd have to be drunk to <i>start</i> with Helvetica!  :-) <br>Unless this club happens to have a Barbarella theme. <br> <br>Jason, before you choose a font, think of what it should look like. There are so many choices (many of them nominally good) that you can easily get distracted from a choice that will <i>really</i> click - so narrowing things down helps. <br> <br>I would say you need something narrow, thin, but also somewhat rigid. And if it's lc, maybe something with a small x-height (unless visibility is a serious issue). <br> <br>And the most important thing: <br>What's the <i>name</i>? Different glyphs sing in different ways, especially in chorus. <br> <br>hhp</p>"
