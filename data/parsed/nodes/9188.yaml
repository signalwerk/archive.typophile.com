    html: "<p>I think element is a great name. And thinking about how the letters might fit into a whole, I had an idea: make it unicase, with cap-form \"L\" and the second \"e\" nestled into its hole - that would amplify the \"element\" idea too. I guess it might go against the client's stated wish for \"simplicity\", but clients don't always really know what they want as much as they sound they do. <br> <br>hhp</p>"
