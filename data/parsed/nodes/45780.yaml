      <p>I like how you've handled the wording, but the main logo seems lacking.</p>
      <p>It looks half-way inbetween a blackletter 'r' and a house, and the ° symbol looks like a sun?</p>
      <p>I think you either need to make it a house with a ° symbol, or else make it an 'R'.</p>
      <p>The thought of that symbol though, a house or R with a ° is a wonderful and genius idea, take it right to the bank, that's the money-maker right there.</p>
      <p>I wanna see more work on it and have it resolved better because it's not that often that a concept with that potential comes along.</p>
      <p>EDIT: it's very ‘paul rand’ in it's simplicity and clarity of message</p>
