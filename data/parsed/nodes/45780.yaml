      <p>I'd make it the same 'R' as you have in the logotype, whatever you choose that to be.</p>
      <p>Right now if I just saw the house/R I wouldn't recognize it as either an 'r' or a house.</p>
      <p>If you have a red R° I think people will see R....red degrees hot?  oh, Redhot!  of course!</p>
      <p>I think once they know the name there's enough information in R° to convey that whole thought.</p>
      <p>Just for fun though, had you at any point tried red° or Red°?  I know it's close to that stupid retard(red) campaign, but I think it could work as a viable alternative to help you keep some options open - and who knows, maybe you can develop that too and see if that does allow you any freedom R°doesn't (although it might be more limited too, you never know)</p>
      <p>I wanna see more!</p>
