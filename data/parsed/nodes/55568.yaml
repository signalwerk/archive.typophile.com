      <p>I don't think so ... also what effect would that have on a line that has multiple languages?</p>
      <p>I guess it could just go with the max line height, but I that might be pretty visually jarring if it's just for one or two words.  I'd set the default for single-accented text, and at most suggest to the user a preferred line height for different languages. </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
