  html: |-
    <p>Is it possible to specify in OpenType features a change in line height for specific languages? </p>
    <p>This is especially useful for languages that have stacked diacritics like Vietnamese where those accents might frequently interfere with the line above, but might also help optically with languages that use frequent capitals like German, or that are entirely of majiscule form, like Cherokee. </p>
    <p>I've finally learned how to change the default line height so my font won't show up as if it's always set for Vietnamese, but should I rely on the end user to adjust the leading themselves or would it be prudent to provide it as a feature in the font?</p>
