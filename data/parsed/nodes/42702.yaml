      <p>To me they’re still brutal, and just like your first go ’round, they’re trying to be too damn clever.</p>
      <p>Try using different weights, or even different fonts to rep your first and last initials. Play one initial off the other - use one to highlight the other,instead of trying to merge/force one into the other (and all the effort that needs). And use the j’s tittle as a playful element.</p>
      <p>That way you’ll honor your family name, whilst adding your own vibe...</p>
