    html: |-
      <p>I respond so negatively to the gold/grey combo (reminds me of high school football) that I think I’m biased when I say I definitely prefer #1 - I think it’s mostly because I love the b/w you posted.  :)</p>
      <p>I’d advise you to think more about your context, your *brand*.  If you want a logo so you can show a sample logo, instead design logomarks for fake entities, non-profits, or some other entity that needs a logo.   If you want a logo only for your business card, then design the whole card.  If you want it for your website, too, sketch out how you might incorporate a logo into your website.  I recommend questioning your desire for a logo, and your answers will probably help you design one if you decide to go for it.  </p>
      <p>For conceptual branding stuff: “Johnny Can’t Brand” is great, and your library probably has it.</p>
      <p>Good luck!</p>
      <p>Beth</p>
      <p>—-<br>
