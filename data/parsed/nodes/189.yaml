    html: <p>Mark's FOG fantasy picture brings up some interesting points. Most font design time is spent drawing, tuning and spacing. Sure kerning and hinting take some serious time, but wouldn't it be amazing to have a minimal and simple program similar to Mark's faked FOG image for just the basics. I don't mean Type Tool either. Just drawing tools and a window like Mark's for spacing. With smoothing, of course.</p>
