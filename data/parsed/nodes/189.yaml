  html: <p>My curiousity has gotten the better of me and I've decided to peek behind the curtain to find out what level of programming skill is required to build a working font editor. <br> <br>There is too much I rely on Fontographer and too steep of a transition curve for me to use Font Lab. So I figure it's worth looking into building my own. <br> <br>Since I'm already a hard core FOG user, I can't help but want to base my origins on this application and improve it as I have always wanted to see it improved. <br> <br>However due to my own technical limitations, I have always assumed making a font editor is heavy business until I found out about RealBasic. I have only dabbled in this program a few times and I'm not sure what it's capabilites are but I'd be interested in finding out if it has the ability to cobble something like this together. <br> <br>Are there any programmer types on the list that have any insight? <br> <br>Stuart :D</p>
  html_clean: <p>My curiousity has gotten the better of me and I've decided to peek behind the curtain to find out what level of programming skill is required to build a working font editor. <br> <br>There is too much I rely on Fontographer and too steep of a transition curve for me to use Font Lab. So I figure it's worth looking into building my own. <br> <br>Since I'm already a hard core FOG user, I can't help but want to base my origins on this application and improve it as I have always wanted to see it improved. <br> <br>However due to my own technical limitations, I have always assumed making a font editor is heavy business until I found out about RealBasic. I have only dabbled in this program a few times and I'm not sure what it's capabilites are but I'd be interested in finding out if it has the ability to cobble something like this together. <br> <br>Are there any programmer types on the list that have any insight? <br> <br>Stuart :D</p>
