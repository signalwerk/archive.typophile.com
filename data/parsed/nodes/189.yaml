    html: <p>The gist of that mockup is the idea that you should be able to see the effect of the glyph designs in context as you draw.  <br> <br>Imagine being able to drag parts of glyphs from one to another in a single window, for instance. It just seems like it would streamline the process. This is one of the reasons I like doing my glyph design work in Illustrator. I can see everything in context.  <br> <br>Aaron's suggestion of keeping two windows open is a good one, but I think it would be even better if the two could be consolodated. It reminds me of the early versions of Illustrator where you couldn't draw and preview at the same time in the same window, so you would have two windows open--one to draw in and one to see what it looked like.  <br> <br>I think this "one glyph--one window" idea is just something that's been around so long that it's never been questioned. Imagine if drawing programs worked like this. Each object would be stored in a library and could only be edited in its own window and could only be seen in context in a "layout" mode. It would be a real impediment. <br> <br>I'm not going to stop making fonts just because the tools could be better. The tools we have are light-years beyond what people used to create metal or photo type. But they could be better.</p>
