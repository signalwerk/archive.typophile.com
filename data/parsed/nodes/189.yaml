    html: <p>Thomas, I don't know if you realize, but most of the above discussion was from about a year ago.  <br> <br>Anyway, it looks like Yuri is working something along the same lines as my "fantasy" suggestion for FontLab (see <a href="http://www.typophile.com/forums/messages/4101/36980.html?1085974314" target="_blank">here</a>). <br> <br>BTW, I totally agree with you about the impracticality of making a new font editor from scratch. Especially if all you want to do is make fonts. I gave up on that idea myself when FOG was released in 1985. :-)  <br> <br>After finishing my most recent batch of fonts last Fall, I switched cold-turkey to FontLab and I'm getting very used to it now. I really like the fact that they listen to customer suggestions and keep improving it. I have no doubt that it will just keep getting better (and it's already very good). It just takes some getting used to after working with FOG for so many years.</p>
