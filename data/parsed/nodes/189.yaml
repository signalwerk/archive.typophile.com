    votes: null
    html: <p>I think too many of the folks involved in this discussion don't quite understand the number of person-hours required to develop good software. If your goal is to make fonts, I'd focus on either that, or incremental improvements to existing tools (FontLab or FontForge). If you want to get into the font editor business, then be prepared to spend a huge portion of your time for the next few years to do it. <br> <br>That being said, FontLab's drawing capabilities are fully exposed to Python. That means that you can do additional drawing tools yourself and add them to FontLab. They already added FOG-like tools to FL 4.6 by doing this. If you don't like the way they did it, why not start by modifying their Python code? <br> <br>It would be easier to change the drawing UI of FontLab than to get Fontographer up to FontLab's level of capabilities, IMO. <br> <br>My two cents. <br> <br>T <br> <br>P.S. Jim Gallagher is back at Macromedia, apparently.</p>
