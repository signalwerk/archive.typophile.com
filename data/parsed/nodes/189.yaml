    html: "<p>Mark, I work in roughly the manner you've illustrated, using FontLab, by working with the preview panel open. I can set words using the glyph I'm editing and see how my changes work in context. I can edit the side bearings in the outline editing window. If I decide that I need to edit another glyph in the sample word, a double click in the preview window makes it the current glyph in the frontmost editing window. <br> <br>WRT building a font editor from scratch - I've spent enough time writing code to know a bit about estimating the possibility of a project. My heuristic is such: <br> <br>A) If I think the project is going to be a piece of cake, then it's going to take a very long time. <br>B) If I don't know how hard the project will be, then it's far beyond my abilities at this point. <br> <br>The \"build a boat only if you want to build a boat\" comment is dead on. I can guarantee that the learning curve for productive use of FontLab is miniscule compared to the learning curve for comfortable exercise of UI programming skills. You just have to attack FontLab with the same enthusiasm which I'm sure you had on first contact with FOG.</p>"
