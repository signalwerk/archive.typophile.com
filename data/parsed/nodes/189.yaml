    html: "<p>Hi, I'm a typophile newbie with a problem (other than the fact that i can't find the 'new thread' button): <br>I have got several PC-originated fonts that are encoded all wrongly. For instance 'Cyrillic ' fonts with the Cyrillic characters being mapped to ABC..abc.. instead of U+0400 to U+04FF, ligatures not being correctly marked and so ae doesn't become � automatically, fonts with annoying names (\"Font ITC TT-MedIta\" instead of \"Font Medium Italic\") that I want to rename, glyph variants not being available in the typography palette, etc. <br> <br>I want to create a piece of software (Mac OS X) to fix things like this. How much need is there for something like this? <br>As far as I can see there are no GUI tools for editing AAT fonts. I am currently using ftxdumperfuser to edit tables from the command line. <br> <br>Could all you Mac users post a wish list of things you want to be able to edit (Zapf tables?) and give some idea as to whether such a project would be worthwhile investment of time for me? (i.e. how much would you pay, and how many of you want these things?) <br> <br>- Nicholas Shanks <br> <br>p.s. can anyone tell me how to start a new thread instead of hijacking a similar-themed one?</p>"
