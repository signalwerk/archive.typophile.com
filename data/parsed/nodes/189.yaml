    html: "<p>It's not really possible to change the behavior of FOG using ResEdit, just the surface appearance (and even that only in a limited way). ResEdit was created mainly as a way to separate the \"look\" of an application from the code to facilitate localization. The CODE resources that you can see in there are in a form that's not practical to modify--it's already compiled and linked. Making even the tiniest change in one of those could totally hose FOG.  <br> <br>My ideal font editing program: The basic interface would be like FOG's metrics window, but you would be able to edit the outline too. Having a separate window to edit each glyph has always seemed rather limiting to me, and that they're done this way because that's the way it's alway been done. Apple's old bitmap font editor (FontEdit) was an exception. It would be especially handy for scripts.</p>"
