    html: "<p>GUI programming is hard. Creating custom GUI controls like Bezier curves and handles is even harder. Using RealBASIC to build a font editor is purely insane. <br> <br>My suggestion: learn Python, start playing with TTX, and slowly move into FontLab scripting. By the time you have these things down, contact me privately. Avoid RealBASIC at all costs. Learn Python and/or Objective C.</p>"
