    html: <p>I assume you're talking about building one for the Mac platform.  <br> <br>There is a great shareware font creation program called 'The Font Creator Program' by a guy named Erwin Denissen from the Netherlands. His website is <a href="http://www.high-logic.com" target="_blank">http://www.high-logic.com</a>. This software is for pc's only right now and costs about fifty bucks.  <br> <br>I use it at work here because I only do very rudimentary font creation and this software is cheaper than fontographer. But it is quite hefty for shareware. As a matter of fact, as far as shareware goes it is one of the best in any category.   <br> <br>I would love to see it 'ported' to OS X so I would have an inexpensive (did someone say cheap) alternative to stretch my puny typographic wings on. <br> <br>Anyways, I think he would be a great resource to start with even though it is a different platform. <br> <br>Tom</p>
