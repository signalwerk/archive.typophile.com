    html: <p>I am currently engaged in about 4 open ended discussions with folks I'm wanting to build a font editor with and unfortunately there has been no progress. Jim is one of the first folks I spoke with but hasn't revealed any plans of this nature. There has also been no progress trying to convince the Font Lab guys that they need to revise the interface of the application. <br> <br>Jay, I think you may be right and thank you for the nice analogy . . . I think my visitors would prefer I spend more time making new fonts than building a font editor. <br> <br>In the interim, I've at least begun opening up FOG in ResEdit to see what sort of hacks I can impart to the application to affect the gui somewhat. If anybody has any nice hacks not already shown in the manual or the obvious starting screen hack/dialog boxes hack, I'd love to get in there and change the icons, edit my toolbar, and "alias" the application to have a smooth look. <br> <br>Stuart :D</p>
