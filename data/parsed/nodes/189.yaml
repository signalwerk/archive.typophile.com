    html: <p>Thanks for the tips John! <br> <br>Last evening I opened up FOG in ResEdit on the mac and looked for ways to "hack" away at this baby but even after spending some time playing with the app, I was unable to do little more than change some dialog boxes and a few images. I thought I made big changes and then ran the app and no different or little different. <br> <br>I was hoping to get deep enough into the application to figure out how to alias all the cursors and just see how much I could do with it - Like soupin' up my old bike. Let me know if you have found any good hacks for it. <br> <br>Otherwise, perhaps RealBasic isn't the best editor for this type of project, but with little serious programming experience other than HTML I truly wonder how difficult it really is to create an application that can do what FOG can. It's surprising how very basic it is and I would imagine some folks already have a good start on vector apps from RealBasic. <br> <br>The thing that frustates me is that it would seem there is a way to build applications but because I don't have the knowledge, I am severly stuck with what's our there vs. what I can create. It's alot like font creation but in a different industry. <br> <br>Anyhow, thanks for the insight, <br>Stuart :D</p>
