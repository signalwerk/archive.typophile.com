      <p>Ciao Alessandro,</p>
      <p>I’m not sure I understand your question, but I’ll try.</p>
      <p>Usually a database (which is where stuff is stored) is editable via a Web application (which is the program that actually takes the input from the database, presents it to the user and sends it back to the database once it’s been edited) that is written in a programming language (in the case of pages ending with .php, that language is called PHP, but theoretically any programming language could do it). A Web application is made of dynamic pages in the sense that you usually write a generic page that can edit/display content items of the same kind.</p>
      <p>So the page were you edit stuff is actually a part of the Web application that lets you edit data stored in a database. It’s called Web application because you do this through HTML forms in your browser, visiting a Web page, instead of a graphical user interface (GUI) on your own machine.</p>
      <p>I’m sorry if it sounds convoluted, I can clarify further aspects if needed. Does this help in any way?</p>
      <p>Cheers.</p>
