      <p>Even if I can't get out of my head it could be a manipulated <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">Gotham</a> (starting from Bold weight, adding outline stroke to artificially embolden it and reworking it outlines to create facets), I guess you could start with <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United Sans Regular Black</a> and rounding it by adding an outline stroke. I'm convinced this should work pretty well.<br>
      Alternative: <a class="freelinking external" href="http://www.myfonts.com/fonts/millertype/nikaia/" rel="nofollow">Nikaia</a></p>
