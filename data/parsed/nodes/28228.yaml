    <p>Hello all! I’m looking for a nice, ornate serif typeface. Here’s specifically what I’m looking for. I want a typeface that has:</p>
    <p>1) The swashes, ligatures and other ornate fun of <a href="http://www.linotype.com/webshop/view.linotype?viewmode=search&amp;searchFields%5B%5D=0&amp;searchFields%5B%5D=2&amp;PHPSESSID=92d321831a12bdc82e2dd30cb35ad975&amp;ACT=quicksearch&amp;searchLogic=and&amp;searchContent=true&amp;wildcard=1&amp;searchType=as_families&amp;GROUP=&amp;DISPLAYC=full&amp;searchTerm=sabon+next">Sabon Next</a>...</p>
    <p>2) ...but the personality and feel of <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=quadraat">Quadraat </a> or <a href="http://www.underware.nl/site2/index.php3?id1=dolly&amp;id2=overview">Dolly</a>. </p>
    <p>Am I asking too much? Do I want to have my cake and eat it too? (Note: while I very much like <a href="http://www.underware.nl/site2/index.php3?id1=sauna&amp;id2=overview">Sauna</a>, I’m looking for a true serif typeface.) Any suggestions?</p>
