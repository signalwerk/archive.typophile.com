    html: |-
      <p>Cut and paste one by one is the only way I could get characters into Fontographer from Illustrator 10 files, more than that, you need to have a box for each glyph of the height, or slightly more, of the combined height of your tallest ascender and lowest descender so that you keep the scale of each glyph and then once pasted in, delete the box (if you don't use the box everything will be the same height). You can vary the width of the box to set your sidebearings as well.<br>
      Tim</p>
