    <p>Hello.</p>
    <p>Just want to know how you guys go from type to font.</p>
    <p>I'm drawing my type outlines in <a href="/wiki/Adobe%20Illustrator" class="freelinking" rel="nofollow">Illustrator</a> (cs).<br>
    So how do I get to <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a> (4.1) from there?<br>
    I can't seem to import the ai or eps files.<br>
    It keeps saying Syntax error in file.<br>
    I've tryed saving in older formats, but that dos'nt seem to help.</p>
    <p>So what I've been doing so far is pasting a bitmap into Scanfont... but that just screws up the type totaly.</p>
    <p>OR, should I just get used to drawing it all in Fontographer?!<br>
    Man I'd hate to do that, since I work really quick and effectively in Illustrator.<br>
    (I've seen someone using TypeTool, but it seems like you have to import the characters in eps one by one.)</p>
    <p>Anybody got a solution? How do you guys work?</p>
    <p>Thanks<br>
    - Lasse</p>
