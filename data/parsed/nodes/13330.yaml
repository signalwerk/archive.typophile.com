    html: |-
      <p>Illustrator Experts: correct me if I'm wrong, but...</p>
      <p>Illustrator CS format is not backwards compatible, so you will have to export your drawings as Legacy AI or EPS files. But first, you'll have to copy and paste each individual character into a new document (reusing the same one will work), because Illustrator does not give you the option of exporting only selected elements on a page. Exporting as Illustrator 3 ought to work. In Fontographer, select File, Import, EPS, then import your glyphs one by one.</p>
      <p>Creating a "bounding box" as <strong>timd</strong> describes is important, so that all of your imported glyphs retain their size relative to each other. Also, before you begin, set your font's ascent at 1000 and descent at 0. AFTER you have imported all of your glyphs, you can reset the baseline where it should be.</p>
