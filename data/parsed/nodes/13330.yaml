      <p>Chank still has on his site the how-to creation of a font from Illustrator to Fontographer. Whether or not you can still use the newer version of Illustrator is a question. See the guide at<br>
      <a href="http://www.chank.com/howto/index.php" title="http://www.chank.com/howto/index.php">http://www.chank.com/howto/index.php</a></p>
      <p>Chank may be a bit goofy, but this is still a good guide, especially on the importance of drawing a bounding box next to the letters for consistent height. I have exported eps files created in Illustrator to Fontographer, but with Illustrator 8 (I think?). Cut and paste is probably the best method. With Chank and the above comments and help, something should work. Also, look for the updates on Fontographer from the new owners of the program, the FontLab folks.</p>
