      <p>To me the h is too wide and the stroke contrast is too great. The top right quadrant of the a looks a bit light. The d seems to have a shorter ascender than the h. As Dav says, the stems are creating dark areas, which is making the o look lighter than the other characters. I think that overall you can reduce the stroke contrast and reduce the angle of the stems or adjust the counters to compensate for the weight and angle of the stems.<br>
      Tim</p>
