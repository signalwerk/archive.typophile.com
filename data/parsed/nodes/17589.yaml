      <p>Without knowing what the logo has to do, the nature of the company/product etc. I think item 7 is a good starting point, the change of case aids pronounciation. I am not keen on the tails of the 'lit' group they are too contrasted and uniform and I wonder if they are all necessary, if you amended them to a heavier stroke and more of a geometric shape to match the characteristics of the others, the 'l' tail should be shorter than that of the 't', you might even be able to lose it on the 'i' (which seems too tall and looks better with the round dot). The 'n' needs some work on the inside of its counter and I think you should look at the relation of vertical element and counter in the 'p' and 'a'. Finally, Photopolitan has some of the properties of the OHOHO kerning exercise, the kerning will have to be loosened a touch, especially for small use.<br>
      Hope this of some use.<br>
      Tim</p>
