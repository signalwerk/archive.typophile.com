      <p>dav,</p>
      <p>you are the master of the style i'm shooting for here. your letterforms in many cases strike me as barren in their origin, mathematical. but by the time you are done sculpting them, they strike the perfect balance between algorithm and poem.</p>
      <p>just my opinion, of course, there are many here on these boards who are more in tune with our work than i, no doubt. regardless, i am glad to have your feedback.</p>
      <p>*</p>
      <p>i'm thinking that photopolitan might be both too long and perhaps a little to clever (or maybe not clever enough) to work as i'd like it to. so as of now, i'm changing the name to 'phoda'. two syllables, and a little better symmetry within the word.</p>
      <p>of the designs on the latest post, i think i like 1a the best. it's funky (the stems), impersonal (outer bowls), and yet, still curvaceous in the inner bowls.</p>
      <p>i'm looking for the suggestion of individuality through an otherwise faceless environment.</p>
