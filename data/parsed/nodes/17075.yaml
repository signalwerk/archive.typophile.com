    html: |-
      <p>"as for e-mail, that was ALWAYS an odd one to me. Doesn’t seem to follow any established english language rules."</p>
      <p>Well, it does follow the compound rules where two words aren't easily joined. Spaceship is the one side of that where they grow towards each other, e-mail is the other. Because "e-mail" has an inherent defined pronunciation, it has my preference. In Dutch, it's mandatory because the pronunciation changes an awful lot without the hyphen. I won't be one to tell English people how to do it on this topic, however. I'm still foreign ;)</p>
