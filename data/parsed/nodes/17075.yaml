    html: |-
      <p>The general tendency in English seems to be for these compounds to close up over time (so 'space ship' became 'space-ship' became 'spaceship') except where the closed-up versions would cause potential confusion - looking like an existing word for example. At the moment, Oxford's <em>Dictionary for Writers and Editors</em> suggests 'website' (and, by the way, accepts both 'email' and 'e-mail' but prefers the former).</p>
      <p>______________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
