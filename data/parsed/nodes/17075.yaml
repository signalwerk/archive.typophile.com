      <p><em>Many style guides still capitalize the Web and Web sites, like it’s some sort of brand name.</em></p>
      <p>Web is an abbreviation of 'World Wide Web', which is a proper noun, so it should be capitalised. As for being a brand name, I'm not sure what the status of the full name is, but I wouldn't be at all surprised if it has been trademarked for protective purposes by the W3 Consortium.</p>
    html_clean: |-
