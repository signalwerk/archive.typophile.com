    html: |-
      <p>Yves is very authoritative, but still fallible, and so, even, is David Lemon.</p>
      <p>I think there's a misunderstanding here. <em>Some</em> fonts are restricted by Adobe's EULA for use with the app; see:</p>
      <p><a href="http://www.adobe.com/type/browser/legal/restricted_fonts.html" title="http://www.adobe.com/type/browser/legal/restricted_fonts.html">http://www.adobe.com/type/browser/legal/restricted_fonts.html</a></p>
      <p>These are governed by clause 16.4.6 in the EULA (I'm citing the one for InD CS5, and I quote some other clauses in the font section, because the modification and embedding rights in the Adobe EULA are notably liberal.)</p>
      <p><cite>16.4 Font Software. If the Software includes font software:<br>
      16.4.1 You may use the font software with the Software on Computers as described in Section 2 and output the font software to any output device(s) connected to such Computer(s).<br>
      ...<br>
      16.4.4 You may convert the font software into another format and install it for use in other environments, subject to the following conditions: A Computer on which the converted font software is used or installed will be considered as one of your Permitted Number of Computers. Use of the font software you have converted will be pursuant to all the terms and conditions of this agreement. Such converted font software may be used only for your own customary internal business or personal use and may not be distributed or transferred for any purpose, except in accordance with Section 4.6 of this agreement.</cite></p>
      <p><cite>16.4.5 You may embed copies of the font software into your electronic documents for the purpose of printing and viewing the document. If the font software you are embedding is identified as “licensed for editable embedding” on Adobe’s Web Site at <a href="http://www.adobe.com/go/embedding_eula_ae" title="http://www.adobe.com/go/embedding_eula_ae">http://www.adobe.com/go/embedding_eula_ae</a>, you may also embed copies of that font software for the additional purpose of editing your electronic documents. No other embedding rights are implied or permitted under this license.</cite></p>
      <p>And, the clause that I think causes some confusion:</p>
      <p><cite>16.4.6 As an exception to the above, the fonts listed at <a href="http://www.adobe.com/go/restricted_fonts_ae" title="http://www.adobe.com/go/restricted_fonts_ae">http://www.adobe.com/go/restricted_fonts_ae</a> are included with the Software only for purposes of operation of the Software user interface and not for inclusion within any Output Files. Such listed fonts are not licensed under Sections 16.4.1 through 16.4.5 above. You agree that you will not copy, move, activate, or use, or allow any font management tool to copy, move, activate, or use such listed fonts in or with any software application, program, or file other than the Software.</cite></p>
      <p>Clause 4.5 of the EULA discusses "unbundling", at first it seems to support Yves contention:</p>
      <p><cite>4.5 No Unbundling. The Software may include various applications, utilities, and components, may support multiple platforms and languages, and may be provided to you on multiple media or in multiple copies. Nonetheless, the Software is designed and provided to you as a single product to be used as a single product on Computers as permitted by Sections 2 and 16.</cite></p>
      <p><strong>Bu:t</strong></p>
      <p><cite><strong>You are not required to install all component parts of the Software,</strong>(emphasis added) but you may not unbundle the component parts of the Software for use on different Computers. You may not unbundle or repackage the Software for distribution, transfer or resale. See Section 16 for specific exceptions to this Section 4.5.</cite></p>
      <p>So, you can't consider the font to have a license separate from the app, but if you hold a valid license, deleting some of the package doesn't void that license... otherwise we'd be required to keep all the sample file installed!</p>
      <p>And, furthermore:<br>
      <cite>2.8 Content Files. Unless stated otherwise in the “Read-Me” files or other license(s) associated with the Content Files, which may include specific rights and restrictions with respect to such materials, you may use, display, modify, reproduce and distribute any of the Content Files. However, you may not distribute the Content Files on a stand-alone basis (i.e., in circumstances in which the Content Files constitute the primary value of the product being distributed), and you may not claim any trademark rights in the Content Files or derivative works thereof.</cite></p>
      <p>So, I think you <em>can</em> use the Adobe fonts without having the app  installed. What can you do with other fonts in other bundles? Well, one would have to read <em>those</em> EULAs.</p>
      <p>That's what I think.</p>
