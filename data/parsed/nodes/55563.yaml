      <p><cite>…good affordable font packages…</cite></p>
      <p>Museo/Museo Sans are quite affordable. </p>
      <p>Watch eBay for old copies of Corel Draw, which comes with 1000+ Bitstream/ITC fonts. Prices run from $50 to $500 depending on what version is selling and how many copies are available. Or drop $1500 at once to get the complete Bitstream Type Odyssey 2 which will get you through school and well into your professional career.</p>
      <p><cite>…fontbook…</cite></p>
      <p>If you can’t afford fonts, there’s really no reason to buy a $100 font catalog.</p>
