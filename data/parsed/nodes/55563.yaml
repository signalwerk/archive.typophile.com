    html: |-
      <p>URW's typefaces are not of questionable authority. </p>
      <p>In the early days of font digitizing URW was one of the only digitizing games in town. It offered two price structures. The lower price delivered the digital data to the original company, but allowed URW the right to use the digital data.The more expensive option was to deliver the digital data to the source company with no reuse rights. Most companies chose the less expensive option which is why URW markets look-alike fonts under different names. All perfectly legal.</p>
      <p>And their Nimbus Sans Novus is the best digital Helvetica around.</p>
      <p>When I was still doing graphic design n the early 90s I advised all my clients to buy URW's Fontworks CDs to get themselves a high quality digital library at a reasonable cost.</p>
