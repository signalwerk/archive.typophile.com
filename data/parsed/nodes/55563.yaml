    <p>Hello There!</p>
    <p>I am a student and I was wondering if anyone knows of any good affordable font packages? Or perhaps an option to buy 1 font instead of the whole set? Just have a limited budget and I'm really getting bored of what I have and the free fonts are starting to disgust me.<br>
    Also does anyone have this book?  <a href="http://www.fontshop.com/products/fontbook/" title="http://www.fontshop.com/products/fontbook/">http://www.fontshop.com/products/fontbook/</a><br>
    Is it useful? I so want it. It looks like it could be very helpful!!<br>
    I am drooling... mmmmm.......fontbook....</p>
