      <p>Just a couple of quick notes.<br>
      Yes to make the two columns equal in width.<br>
      No need to align the title inside the columns.<br>
      In general, margins should be wide enough to frame text and pictures, but narrow enough to keep all together. Also consistency is a good thing.<br>
      You should also check text alignment (and revise body copy in order to consistently use proper typographic elements such as apostrophes, en-dashes, etc.).</p>
