      <p>I know you didn't ask for advice regarding this, but your layout is full of misalignments, inconsistent capitalization and punctuation, etc. Most readers won't care if a margin is a few points off, but these kinds of mistakes will be immediately obvious to everyone. </p>
      <p>Plus the type in the lower right is totally unreadable on my monitor.</p>
      <p>To paraphrase what I said in an earlier post, I think you're focusing on the wrong things. For a small layout like this, instead of worrying about grids and the exact width of a column or margin, focus on making it an attractive, easy-to-read layout.</p>
