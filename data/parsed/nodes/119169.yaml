      <p>Make it black type on white, because people will want to print it.</p>
      <p>Saying "computer" graphic design is unnecessary; who does graphic design any other way these days?</p>
      <p>I would put your software skills at the bottom, not the top.</p>
      <p>Proofread! You have many misspelled words and incorrect or misplaced punctuation marks. Get a friend to read over it for you.</p>
      <p>How about putting your name somewhere prominent?</p>
      <p>You can do better than Helvetica. Helvetica may be many things, but unique it is not. You want to stand out.</p>
      <p>The dark grey type is hard to read.</p>
      <p>For bullet lists, align runover lines with the first line of the bulleted paragraph.</p>
      <p>Make it a standard paper size.</p>
      <p>Many people have a hard time taking "Hotmail" addresses seriously. Some e-mail services are widely seen as more professional than others. Gmail is a safe bet.</p>
      <p>Organize the document with subheads: Work Experience / Education / Special Skills etc.</p>
