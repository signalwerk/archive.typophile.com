      <p>Hmm, the best way to manage fonts without spending a dime is with AMP Font Viewer. I have used the old font manager from Adobe to others and nothing tops this program to me. The best feature I like is the install temporary fonts. I can load and unload a font on a need to use basis without loading up 2000 fonts slowing down my PhotoShop. This is a Windows only program though.</p>
