    html: |-
      <p>Unfortunately, Bitstream FN does not allow you to preview multiple fonts.  This is a REALLY desireable feature, too, because it makes it easier to compare fonts, and to find specific typefaces.</p>
      <p>In fact, it's the #1 reason I've yet to find any font navigator I can call perfect.  My ideal font navigator would:</p>
      <p>1) Build a database of all fonts (installed &amp; uninstalled) on a given system, so it doesn't have to "read" the font files each time it's run. Of course, from time-to-time you'd have to manually update it.<br>
      2) Allow you to show as many, or few fonts on screen at a time, by file name, font name, or group, etc.<br>
      3) Allow you to set the display text and size to anything you want.<br>
      4) Display the full file location, no matter how long the directory nest.</p>
      <p>#1) is the most important because when you have large libraries of fonts, you want to be able to get access quickly.</p>
      <p>Bitstream FN does 1) fairly well, parts of 3) &amp; 4) and 2) not at all.  I used to like HP's Fontsmart (discontinued), but it wasn't perfect either.</p>
