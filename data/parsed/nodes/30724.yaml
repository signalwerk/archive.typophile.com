      <p>Bitsteam Font Navigator for the PC is great.  It will build a catalog of all fonts on your drive (ONCE, not every time it opens) and then present you with four, logical panes: Uninstalled, Installed, Groups and a preview pane.  From there it's all drag &amp; drop.  It handles truetype, Type 1 and Opentype.</p>
      <p>Now here's the trick... you get it for free with CorelDraw.  If you want to TRY it, you can download the CorelDraw 12 thirty day tryout from Corel's website, and by carefully selecting features install ONLY Font Navigator. Unlike CorelDraw, Font navigator does not disable itself after 30 days, so it's up to you to remove it when you're done trying it out.</p>
