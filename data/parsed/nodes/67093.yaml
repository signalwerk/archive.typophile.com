  html: |-
    <p>Hello,</p>
    <p>I want to do something to give back to my hometown, so i've come up with an idea for a pasty cook off. This would be an interface to strengthen and further bond Marquette, Michigan. Through pasties I hope to strengthen, facilitate and connect the community, as well as stimulate the local businesses.</p>
    <p>The National Pasty Cookoff<br>
    2010 Marquette, Michigan</p>
    <p>I want to make a website and a poster series to begin the promotional process.</p>
    <p>I am breaking a few "type rules" using too many typefaces, but I want this to have a retro/vintage feel.<br>
    Any feedback about typography or ideation for the event itself would be greatly appreciated.</p>
    <p>Thank you,</p>
    <p>Derrick</p>
