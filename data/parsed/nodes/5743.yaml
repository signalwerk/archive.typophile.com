    html: <p>Doug, The reason I picked Modern was the very long tail on the 'a', but I can see Bodoni is also very similar. It is the sort of font that T-26 or maybe Psy-Ops could have, but I couldn't find one. I like the simple approaches for making 'one of a kind' titles, and blocking out parts of letters is easier than modifying letter outlines, or designing a new font. <br> <br>Sometimes it's even easier than finding an obscure font that might not exist.</p>
