    html: <p>Here is a simulation of this, compared to the original. I used ITC Modern No. 216 in Light weight. I can see I should have used heavier, but this demonstrates the idea. I made blank white squares/rectangles to block off parts of the top serifs and most of the foot serifs. I think this is how it was done. <br><img src="http://www.typophile.com/forums/messages/83/41336.gif" alt="One of a Kind sim"></p>
