  html: |-
    <p>I am also working on Project of an open type character based unicode Font, named "Mher Urdu Naskh Font", that has complete support of Urdu characters.<br>
    This font is consist of My fathers Calligraphy, and I had made this font with the complete consensus with my father. Who is a famous and Internationally award holder Calligrapher of Pakistan.</p>
    <p>I made especial work for the Urdu Letter ے "Bari yeh". The letters ends on Bari Yeh are commonly not correctly typed in any font. I made work in this regard and in my font all words ending of Bari yeh are typed correctly. TIts Positioning, shape and dot/nuqta below placement is according to International standards of Naskh Calligraphy. </p>
    <p>Now I working on kashida support for this font..<br>
    Some work of calligraphy is also pending in this font because I put most concentration of Volt work other than the shapes of characters, I tried to make this font as base for all other Urdu Fonts. </p>
    <p>Here you can see the sample of my Naskh font.<br><img src="/sites/default/files/old-images/quran arabic_4344.jpg"><br><img src="/sites/default/files/old-images/mher_4481.jpg"><br><img src="/sites/default/files/old-images/mher urdu naskh_5975.jpg"></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/quran%20arabic.jpg" width="1412" height="1600" alt="">
