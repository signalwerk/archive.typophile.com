      <p>Neutrality, by its nature, is in a grey area. The use of AG and later Helvetica and Univers, was described as being neutral.  At the time (50's-60s) perhaps it was so to some degree. Today, we look back and affix the dreaded "Modernist" label to it. Times Roman kinda sorta was for a while but got the DTP label. It may be more possible to assume only temporary neutrality status to a face. Several years back, their were very few choices in type and the "standard" faces got used because that is what the printer had. There was no intent to make the typeface the carrier of the message beyond readability. Readers didn't read anything into a face on a cognitive level. Readers accepted type as just "normal" and therefore not meant to convey. Newspaper headlines for the "Attack on Pearl Harbor", "Marilyn Marries DiMaggio", or "Yankees Win World Series" were all set in the same type. There was no purposive attempt to color the message with the type.  To that end, we could say the type was neutral.  Today, we look back at those same vintage headlines and perhaps see "Old News Style" or some such label.<br>
      Today, there are so many type choices and you can search them and purchase them instantly.  There is no such thing as "This is what the printer had mats for." We SEE many more types in use and EXPECT to see meaning hinted at by choice of font. There is no time for a type to become "normal" because it is replaced by the next one so soon.</p>
      <p>ChrisL</p>
