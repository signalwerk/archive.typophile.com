    <p>The St. Louis Post-Dispatch (newspaper) recently went through a redesign. It felt uncomfortable to me from the start, and the more I thought about it, I believe it's because they chose <a href="http://www.myfonts.com/fonts/fontbureau/amplitude/"> Amplitude </a> for the headline/display face. This choice seems very inappropriate to me, and I was wondering if anyone else had a thought about the face.<br>
    Examining the letters, you can see that crotches and apexes are heavily notched, which I take as an attempt to keep them from "closing up" at text settings. This works well when you're using a face like this at 12pt or below, but strikes me as clumsy and out of place as a display face.</p>
    <p>Anyone else out there using Amplitude? Other thoughts on the subject?</p>
    <p><a href="http://www.newsdesigner.com/archives/002255.php">http://www.newsdesigner.com/archives/002255.php</a></p>
