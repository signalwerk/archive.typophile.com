      <p>&gt; People who like forming their own opinions etc.</p>
      <p>Agreed. Really!</p>
      <p>But that doesn't mean that it's ever possible to shed a point of view completely. The only way to persue that calling journalistically speaking is to admit that you have a point of view &amp; own it. Typographically speaking even Helvetica ( or Ariel ) or really pick any typeface you think is 'Neutral' has a history,cultural associations and most of all assumptions built into it. </p>
      <p>I am not giving a US neo-con style license to shirk duty here a la Fox news. Instead I am saying there is a more precise kind of duty. Admitting imperfection doesn't imply a license to go wild. </p>
      <p>But to keep the post semi relevant - I have to admit that while I agree with Chuck about Amplitude being maybe a bit beyond where news headlines are concerned. On the other hand Tif's point about making the paper more hip might be a good one too. Certainly the headlines will grab the eye more than they would with some other face. But it might hurt the eyes after a while.</p>
      <p>Oddly her idea that Amplitude is hip, seems in total contrast to her statement  "I’m not so sure that the use of Amplitude implies anything."  I can't agree with that idea. A face like that definitely means more than the average news/headline face. It has too much flavor to not mean anything. Tif, what did you mean when you said this?</p>
