      <p>This is what I was looking for, and frankly, what I'm not sure went on in the newsroom at the P-D. What's the typeface say? In what voice does it say it? Who, in the end, are we talking to?<br>
      I don't aim to dis the face Amplitude -- I've already said what I think are real strengths of the font. I think I wanted to open up a conversation about newspaper design. I don't believe it's an out-of-date medium. And I'm not convinced it needs to reinvent itself. I DO believe that a publication has to know itself, speak with its own voice and go from there.</p>
