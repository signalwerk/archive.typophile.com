      <p>&gt; just me</p>
      <p>Even if you belong to a majority view today that will shift over time. After all in 1450 the most 'neutral' face in Germany would have been a textura - no? To me that suggests that what we mean by 'neutral' is something beyond what seems to be aesthetically implied by the term. Or a set of something else/s.</p>
      <p>I think what are referring to when we say neutral is a combination of ubiquity or lack of cultural novelty which is a question of use, a typicality of glyph shapes which is a question of form &amp; finally (maybe) visual simplicity in the design of the gyphs themselves. I think that their importance is really in that order. When David is saying Pizzaz, I wonder which of these three he means. </p>
      <p>What I am not convinced of is whether seeking a 'neutral' face is a goal worth having at per se since to my mind the idea of 'neutrality' obscures as much as it reveals.  </p>
      <p>Maybe thinking about the character and associations of the face is better, along with it's history, it's technical qualities, it's fit with the length of text and so on. All of which is a way to consider a face's fit with the intent. Rather than say 'Neutral' perhaps we should say we don't want to draw attentiuon to the face or something more specific or precise.</p>
      <p>&gt; F Kievit is the most neutral</p>
      <p>To me FF Kievit has a distictly European feel about it.</p>
