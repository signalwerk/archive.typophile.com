      <p>No type is ever neutral. There is always some kind of message put across. The more visually litterate you are the more effectiev that message is &amp; because we are all bombarded by non-stop media we arte all increasingly saavy. But Culture plays a role too. And even sub &amp; sub sub culture etc.</p>
      <p>Of course journalism can never be neutral either. The best it can do is wear it's stripes. This does not contradict the idea that there is such a thing is jornalistic integrity. Likewise, admitting that all type has style &amp; sends messages does not mean that there is no such thing as design integrity.</p>
      <p>Personally I think Amplitude says 'action', as in fast paced. It also has a whiff of the dot.com about it. And I think it is a banker's face ( finance ) more than a neo-con or liberal one.</p>
