    <p>The Crafting Type collective is bringing its intro type design workshop to Seattle! I will be teaching type design to beginners, with Vern Adams and Eben Sorkin (pending sufficient registrations).</p>
    <p>Seattle Central Community College<br>
    Thu–Sat Sep 19–21</p>
    <p>Full details on the Crafting Type site, but feel free to ask questions here as well.<br>
    <a href="http://craftingtype.com/" title="http://craftingtype.com/">http://craftingtype.com/</a></p>
    <p>Seattle details and registration:<br>
    <a href="http://craftingtype.com/2013/9/register-2013-09-seattle.html" title="http://craftingtype.com/2013/9/register-2013-09-seattle.html">http://craftingtype.com/2013/9/register-2013-09-seattle.html</a></p>
