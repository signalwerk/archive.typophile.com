      <p>MakeOTF that is part of the free Adobe FDK for OpenType will do this:<br>
      <a href="http://www.adobe.com/devnet/opentype/afdko/" title="http://www.adobe.com/devnet/opentype/afdko/">http://www.adobe.com/devnet/opentype/afdko/</a></p>
      <p>TransType, TypeTool or FontLab Studio (commercial, use the Adobe FDK libraries):<br>
      <a href="http://www.fontlab.com/" title="http://www.fontlab.com/">http://www.fontlab.com/</a></p>
      <p>FontForge (open source, does not use the Adobe libraries):<br>
      <a href="http://fontforge.sourceforge.net/" title="http://fontforge.sourceforge.net/">http://fontforge.sourceforge.net/</a></p>
      <p>Most of the commercial OpenType PS (.otf) fonts are made using the Adobe FDK library -- either using MakeOTF or one of FontLab's applications. </p>
      <p>Adam</p>
