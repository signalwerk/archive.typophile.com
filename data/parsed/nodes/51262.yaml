    html: |-
      <p>I'm not Adam, and have never even played him on TV, but let me take a shot.</p>
      <p>I've converted a number of Type 1 fonts to .otf. The way I look at it is that .otf are just Type 1 fonts with an OpenType wrapper. I don't know any "conversion" software that writes good enough features, so you have to understand how to write features. Usually, the foundry kerning is inadequate, so you have to re-write the kerning, but you had to do that with Type 1 fonts anyway.</p>
      <p>Potential naming and linespacing problems are ones I can't speak to, as we only use converted fonts with InDesign &amp; it is quite forgiving about names &amp; we don't use any built-into-the-font linespace values. But the question comes up: if you aren't going to use the "features" (advantages) of OpenType, why convert? The only answer I can think of is to get everything in Unicode; that the *file* is more important than the *document*. If you are using, say, Word, and the file isn't what's important, why convert?</p>
    html_clean: |-
