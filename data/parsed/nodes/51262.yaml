      <p>Adam - By listing tools that can be used to convert to OTF, are you now saying that it's OK to convert fonts from Truetype or Type 1 to Open Type? Three months ago (to the day, in fact) in the Adobe OpenType Developers forum, you spelled out in some detail a number of things that don't necessarily convert transparently. The areas included kerning, linespacing values, and styles and fontnames, while noting that this was not a complete list. You ended with:</p>
      <p>"In my experience, a fully automated successful conversion from Type 1 to OpenType is quite difficult and requires technical knowledge of the OpenType specification beyond an average user's skills."</p>
      <p>From a technical (rather than legal) standpoint, under what circumstances would you recommend or be tolerant of such conversions ... and when NOT?</p>
      <p> - HVB</p>
