      <p>&gt; By listing tools that can be used to convert to OTF,<br>
      &gt; are you now saying that it’s OK to convert fonts<br>
      &gt; from Truetype or Type 1 to Open Type?</p>
      <p>Well, if one has a PC Type 1 font that he or she has to use on Mac OS X or vice versa, then a simple conversion to OTF may be helpful. But such fonts will not stand any comparison to profesionally-mastered fonts. Unless you really know what you're doing, the self-made OpenType fonts may work fine in one app but not in another, may have different linespacing depending between different systems and applications, the kerning may not work, the automatic ligatures may not work, some styles from the family may be missing etc. </p>
      <p>But if you really need to get done something badly for a one-off publication, it's still better than nothing. But I wouldn't build a regular publication schedule or a corporate identity around such a conversion. </p>
      <p>It's like when you need to insert some company's logo into a poster quickly, you'll autotrace it from a bitmap or insert an RGB variant and rely on the prepress software to deal with the color conversion. It'll be done quickly but you risk that the result may actually be wrong. On the other hand, if you care about the quality, you'll find a high-quality vector version of the logo with the official PANOSE or CMYK color definitions and usage guidelines. </p>
      <p>A.</p>
