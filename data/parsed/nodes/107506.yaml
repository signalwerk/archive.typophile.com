    html: |-
      <p>The lettering looks like it was done with a flat pen as a softened version of a Textura design with Anglicized capitals. The repeating letters seem pretty much the same, so I suspect this was a font from the photo lettering era that, as far as I can find out has not been digitized.<br>
      I can offer substitutes that have some of the flavor of the lettering, mainly for the lower case, but are not all that close:<br>
      Kingthings Petrock Pro<br>
      <a href="http://www.myfonts.com/fonts/cheapprofonts/kingthings-petrock-pro/" title="http://www.myfonts.com/fonts/cheapprofonts/kingthings-petrock-pro/">http://www.myfonts.com/fonts/cheapprofonts/kingthings-petrock-pro/</a><br>
      Claudius<br>
      <a href="http://www.myfonts.com/fonts/rmu/claudius/" title="http://www.myfonts.com/fonts/rmu/claudius/">http://www.myfonts.com/fonts/rmu/claudius/</a><br>
      Fine Gothic<br>
      <a href="http://www.myfonts.com/fonts/finefonts/fine-gothic/" title="http://www.myfonts.com/fonts/finefonts/fine-gothic/">http://www.myfonts.com/fonts/finefonts/fine-gothic/</a><br>
      Clairvaux<br>
      <a href="http://www.myfonts.com/fonts/adobe/clairvaux/" title="http://www.myfonts.com/fonts/adobe/clairvaux/">http://www.myfonts.com/fonts/adobe/clairvaux/</a><br>
      Goudy Text<br>
      <a href="http://www.myfonts.com/fonts/adobe/goudy-text/" title="http://www.myfonts.com/fonts/adobe/goudy-text/">http://www.myfonts.com/fonts/adobe/goudy-text/</a><br>
      Perhaps there is something closer?<br>
      Don</p>
