  html: |-
    <p>We have a project with an existing hand-painted logotype.</p>
    <p>This is a moderately decortive bodoni-esque swash two word logotype.</p>
    <p>We need to refine the letterforms and create a final digitized version.<br>
    You would be working from a high-resolution scan of the logotype.</p>
    <p>This is not a pure digitization job, but more a refinement and correction of the painted letter forms.</p>
    <p>Please contact me directly if you are interested in the project.</p>
    <p><strong>Kyle Hildebrant</strong><br>
    <a href="mailto:kyle@brandsbyovo.com">kyle@brandsbyovo.com</a></p>
    <p><strong>Please email examples of (or links to) similar work, or work that would give us faith in your capabilities.</strong></p>
    <p>This would be a ’Work for Hire’ situation. You would be given proper credit, and would be granted limited rights to use the work for your own personal/promotional use.</p>
    <p>Thanks guys!</p>
    <p><em>(Please, serious professional inquiries only)</em></p>
