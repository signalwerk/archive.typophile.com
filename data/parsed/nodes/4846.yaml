    html: <p>&gt;fondling machinery <br> <br>Just be careful Hrant. I'm not sure how BC stands on same-sex marriages, but I almost started looking for clergyman who'd unite me with Jim's Weibking.</p>
  - id: 35355
    user: 1026
    date: 2004-05-20T11:06:00
    date_raw: 20 May 2004 — 11:06am
    votes: null
    html: <p>Oh yeah. One more thing about the workshop. I got to use Ikarus for the first time to digitize the drawing I brought. I can definitely see why folks would prefer it to drawing in FOG and FLAB. Or working in Illustrator or Freehand. I suppose you end up with more points than are necessary, but it gives you a working outline in a matter of seconds. Pretty amazing.</p>
