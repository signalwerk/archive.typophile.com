    html: <p>Hrant <br> <br>Next year at this time there's a spot for you at the bench if you can break away from the work-a-day world. <br> <br>Nathan <br> <br>I thought that Gerald would be in town on the Friday, and it would have been fun to have him drop in. (He is now located in Victoria on Vancouver Island). <br> <br>Glad you got home and through the metal detector with no problem. <br> <br>Jim</p>
