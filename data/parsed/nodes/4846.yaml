    html: <p>Jim, <br> <br>I have been in Sooke with Ross. I don't know if you met him. He used to build boats. Now he just builds. Also he is an Easthope buff. But I might go up and see Ian on Gabriola. I am looking for some space to work on a boat. <br> <br></p>
