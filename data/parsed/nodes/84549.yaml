    <p>Hi, I need some help identifying this font.</p>
    <p>The font is used on the website <a href="http://foto-exclusive.com" rel="nofollow">www.foto-exclusive.com</a>. I have been approached to design a billboard for the company, but haven't been able to get in touch with their original designer.</p>
    <p>At first I thought it was Century Gothic, which is very similar but has some vital differences (like, for example, the letter 'e').</p>
    <p>Anyways, thanks for your help, and here is the example image:</p>
    <p><img src="http://stupidpixel.com/files/font_ident.jpg" alt="Font to identify"></p>
