      <p>FYI - Suitcase also allows manual classification via a pretty easy to use drag-and-drop 'drawer' which gets a bit tedious for large font libraries. Here's a <a class="freelinking external" href="http://www.designfad.com/random/suitcase.jpg" rel="nofollow">screenshot</a>. Is Font Agent Pro something similar? (I've yet to try it out - probably do that this weekend.) For me it would be easier to do this if I had a relatively easy way to search for those classifications that I wasn't quite sure about. It's easy to classify Helvetica or Garamond, but for a lot of faces that I never use it's a little more difficult for me.</p>
      <p>Also, does organizing by foundry allow you to find a font that you didn't already know about? It's one thing to look at a project and know what font you think would fit and then search by foundry but another if you have no idea what you're looking for other than a general thought that it should be a serif face.</p>
