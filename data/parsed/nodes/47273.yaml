    <p>Hey all-</p>
    <p>I'm trying to reorganize my font library and I'm wondering what systems of organization people around here use. As you might expect, I have thousands of fonts in various formats. Often there are multiple iterations of the same font in Post script, Open type, etc. I use Extensis Suitcase Fusion 12 for management so really my question is threefold:</p>
    <p>1) How should I organize the physical font directories on my hard drive?</p>
    <p>  1.1) Is there a comprehensive list of fonts by category/class out there somewhere that's easy to read or search that I could reference to build a logical directory structure? (i.e. Hard Drive &gt; Shared User &gt; My Fonts &gt; Sans &gt; Grotesque sans &gt; Helvetica)</p>
    <p>2) What's the best way to organize Suitcase to exploit this logical system so that I don't have to manually add categories and classifications to every file using the drag-and-drop functionality from the classification drawer?</p>
    <p>Thanks, y'all. Looking forward to your input!<br>
    -Jordachio</p>
