      <p>First, trash all the ones that you didn't actually choose to licence.<br>
      (Because how much do you really, badly, need, know or even like them?)<br>
      So out goes all the spam that came bundled with your operating system and software applications, as well as unlicensed stuff that people who should know better sent you*, and you haven't got around to deleting.</p>
      <p>This will make life simpler, and your creative process more focused and purposeful.</p>
      <p>***</p>
      <p>*e.g. At the moment I'm refining a wordmark for a major brand consultant, and along with their Illustrator file they emailed the entire font family for the tag line.</p>
