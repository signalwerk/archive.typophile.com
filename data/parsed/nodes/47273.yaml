      <p>Jayy:  I suck, and don't have suitcase.  So, I do use fontbook out of necessity.  In all honesty, it's not that spectacular.  You can crudely "classify" fonts by putting them into secondary "collections" in the left-hand sidebar (much like making a playlist in itunes).  Problem is that it takes *forever* to go through all of the fonts individually and place them manually into a collection.  Not to mention the previously addressed problem of not knowing what to classify things as.  Currently, I have them classified by sans, serif, serif oldstyle, slab serif, handwritten, script, and novelty (which I plan on overhauling soon, as this hasnt worked well for me).</p>
      <p>If Suitcase really has these organizational features, im going to have to just buy it already.</p>
