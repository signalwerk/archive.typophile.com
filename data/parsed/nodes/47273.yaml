      <p><strong>To Scott:</strong> I did read through a forum thread (3 years in the making! &gt; <a href="http://typophile.com/node/5563" title="http://typophile.com/node/5563">http://typophile.com/node/5563</a>) that supports Font Agent Pro as well. Suitcase has similar search functions and classifications and although I'm more familiar with it, I'd be willing to make the switch to something even easier. I'll check it out - thanks.</p>
      <p><strong>To Nick:</strong> You're absolutely right about eliminating excess fonts from my library. As Scott, above you, points out the real kicker there is the TIME to do that. I've collected so much garbage over the years that what I need to do is exactly what you suggest and sit down to eliminate surplus nonsense. That's part of what I want to accomplish in organizing. Something that would be helpful in this respect would be a database of sorts, that allows me to search fonts and outputs a classification so that I don't have to cruise my memory banks (and/or type books) to assign classes to every font. Do you know of any such thing?</p>
