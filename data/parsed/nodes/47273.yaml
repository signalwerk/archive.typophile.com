      <p>Jordan, I don't think there are too many short cuts.<br>
      Problem is, classification is very subjective, beyond sans, serif, and script.<br>
      There are various classification schemes, so perhaps what you should do is pick one you feel comfortable with, and go through your collection, classifying accordingly.<br>
      Or make up your own!</p>
      <p>Or make it multi-dimensional, using keywords, so you could sort by:<br>
      -foundry<br>
      -date<br>
      -usage (eg text or display)<br>
      -features (eg does it have small caps, lining/osf?0<br>
      -historical style<br>
      -genre (eg girly script, upscale, techno, etc.)<br>
      -etc</p>
      <p>As for usable, I have Type Odyssey 2 on CD, but none installed.<br>
      If I'm searching for a typeface I think might be on there, I wade through the booklet.</p>
      <p>I tend to think that if one is looking for the right type for a particular job, it's worth the effort to spend several hours looking for it.</p>
