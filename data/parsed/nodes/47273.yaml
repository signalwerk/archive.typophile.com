      <p>Font Agent Pro has taken a first, albeit small, step forward in this regard... the current version (4) of FAPro has a "classify" feature built-in. In their words:</p>
      <p>"New Font Classification capabilities allow browsing by font category and style, as well as manual entry of classification."</p>
      <p>...the upshot is that many of the "major" label fonts have been categorized already, and you can manually assign existing or new categories of your own. FAPro also includes nice search capabilities, letting you search by just about any factor - including foundry.</p>
      <p>I thought this would be a godsend, as I've been meaning to do what you're attempting for years - organize my library(s). Of course, this implies that i have the TIME to do this, which I never seem to have.</p>
