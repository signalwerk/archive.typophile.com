      <p>I wrote an iPhone app to try and come up with answers to this very question (sans to sans) among a few others:</p>
      <p><a href="http://bonfx.com/font-combinations-app/" title="http://bonfx.com/font-combinations-app/">http://bonfx.com/font-combinations-app/</a></p>
      <p>There are 45 of the most popular fonts in the app, set up as headline and body. You just swipe left or right to change the headline or body. You can create a couple thousand variations. </p>
      <p>For instance, you can set News Gothic Bold as headline and Franklin Gothic as the body and see how it looks. Then you can flip it around and set Franklin Gothic Demi as the header and News Gothic as the body. They both work nice, though I didn't know the history about those two typefaces until I read this article! </p>
      <p>There are quite a few classic serifs in the app to play with (Avenir, Centurty, Helvetica, Din, Eurostyle, etc.).</p>
      <p>Take a look. There is a resource book coming out too that showcases a lot more variety per example.</p>
