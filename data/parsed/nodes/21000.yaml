      <p>&gt;News and Franklin Gothic, eh? The very idea of pairing two gothic faces together shudders me.</p>
      <p>News and Franklin Gothic were designed by Morris Fuller Benton to go together, as <a href="http://fontbureau.com/fonts/BentonSans/more" rel="nofollow">this explains</a>. Were it today, News Gothic, Franklin Gothic and Alternative Gothic would be regarded as part of the same family. Tobias Frere-Jones and Cyrus Highsmith actually did work them all into a more consistent single family, called <a href="http://fontbureau.com/fonts/BentonSans" rel="nofollow">Benton Sans</a>.</p>
