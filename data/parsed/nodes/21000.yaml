      <p>A challenge indeed.</p>
      <p>Paul's suggestion of News and Franklin is a good suggestion. Franklin is good for big headline type, News is good for space-saving. You can also throw in Trade Gothic for text.</p>
      <p>I have had success mixing 19th-century grotesques, though the appearance is more specialized. Grotesque MT, Gothic 13, Alternate Gothic #2 all mix nicely and create a living texture on the page. Additionally Champion can be thrown in with discretion, but it looks more 'designed' so it tends to leech away some of the quaintness.</p>
