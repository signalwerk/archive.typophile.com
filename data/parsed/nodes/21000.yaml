      <p>News and Franklin Gothic, eh? The very idea of pairing two gothic faces together shudders me.</p>
      <p>I would just suggest pairing the many variants within a font. If you feel that weight emphasis isn't enough, go width-wise. I find that pairing a light extended grotesk (say, Univers 43) with a body copy of its regular variant (Univers 55) works very well. Or pair a regular with a condensed (Univers condensed is surprisingly readable!) Or a thin ultra condensed with a regular. From here on, the possibilities are endless, as long as you make the two face widths and/or weights <em>different enough.</em></p>
    html_clean: |-
