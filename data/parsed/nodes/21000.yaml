  html: <p>Long have I obeyed the maxim of <a href="/wiki/typeface%20pairing" class="freelinking" rel="nofollow">pairing serifs with sans</a> but I'm designing a workbook where the client prefers the more informal appearance of sans serif type faces.  I've been told that it's more about choosing two very different fonts.  If I'm using something like Futura for my title font, should I really stick to a serifed typeface?  Would something like Helvetica Neue Light look sloppy?  Thanks for the help.</p>
  html_clean: <p>Long have I obeyed the maxim of <a href="/wiki/typeface%20pairing" class="freelinking link-lost" rel="nofollow">pairing serifs with sans</a> but I'm designing a workbook where the client prefers the more informal appearance of sans serif type faces.  I've been told that it's more about choosing two very different fonts.  If I'm using something like Futura for my title font, should I really stick to a serifed typeface?  Would something like Helvetica Neue Light look sloppy?  Thanks for the help.</p>
