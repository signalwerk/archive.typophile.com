    html: |-
      <p>It's tough to pair two sans-serif typefaces in normal corporate design situations. Very hard – the situation where they are supposed to harmonize, furthermore with sufficient contrast. Imagine you have to pair two of them in one line of text …</p>
      <p>The normal situation where you can find two or more Sans Serif typefaces working together are packagings. Some mixtures are good, some not …<br>
      Or ads, if the document size is large and the (say two) different sans serifs have plenty of whitespace to make differentiation possible, sometimes I've seen nice solutions. </p>
      <p>To put it in a nutshell. Searching for a suitable serif is under normal circumstances  much more easier and time efficient.</p>
