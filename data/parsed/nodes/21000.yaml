      <p>Frutiger's univers is a big family with a touch of humanist and geometric character with a sans. Maybe choose a stronger humanist-sans like frutiger or gill sans for whismsical and warm text without the serifs. Basically pick a sans with a large family AND the personality you want. I love franklin but it's heavy, cold and dark compared to the humanist-sans... might be what you want. Have fun with this challenge!</p>
