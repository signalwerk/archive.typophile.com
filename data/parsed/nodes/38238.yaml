  html: |-
    <p>Yes, there have been many, many posts concerning this issue. I have 'Learn Fontlab Fast'/the MSN page on how to export illus. into Fontlab. But, I can't believe it's impossible to export illus. into Fontlab without changing the shapes of the characters drawn in illus?<br>
    It snaps to point, which is very annoying. Can anybody please ease my pain? Yes, it's boring one.</p>
