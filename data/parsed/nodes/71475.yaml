  html: <p>Join me, Sara Soskolne (senior designer, H&amp;FJ) for "Turning Letters Into Type," a whirlwind introduction to digital typeface design, taking place July 12–16 at New York's School of Visual Arts. Details and registration for this 5-day workshop — during which students will embark on a project of their own choosing, with lots of guidance and introductory schooling from me — are <a class="freelinking external" href="http://www.schoolofvisualarts.edu/ceCourseFinder/app?sDay=0&amp;sTime=0&amp;sLoc=&amp;sDept=&amp;sCourse=GDC-4458-A+&amp;sInstructor=&amp;sKeyword=" rel="nofollow">here</a>. There are only a few spaces left, so click away... hope to see you there!</p>
