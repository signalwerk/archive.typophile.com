      <p>Well, first off, I believe that was hand-written and probably my MJ himself.</p>
      <p>Secondly, I'm not familiar with this style you're talking about, unless you're referring to graffiti style which was very promonient in the 80's rise of hip-hop and rap. </p>
      <p>If you're just looking for a hand-written looking script, check out The Bluemlein<br>
