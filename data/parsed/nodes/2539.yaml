    html: "<p>This is an essay's topic. (No, none is coming up right now.) <br> <br>In general the quote says nothing wrong. If you don't have to say anything important: \"shut up\". <br> <br>My bakery never told me someting intelligent, so their logo wouldn't tell me anything else (ignoring that they don't really have one, since it's times not even arial) <br> <br>But even me doesn't really care nor do the hundreds of people that also buy their bread there, if the CI of the bakery is good or not. <br>as long as the bread is OK. <br> <br>To propose some philosophic thoughts: \"Do you really need need to design public space? Would you really like a totally designed world and public space arround you?  <br> <br>I know the thougts jump arround a lot, but I hope you understand the point I am aiming at. <br> <br>Servus <br> <br>Dominik <br> <br>P.S.: I agree that the variation in the field of using different typefaces could increase, but only if it fits to the company and its suroundings. <br>(Might be a bit idealistic, but there have to be some of those folks, too.) <br> <br>P.P.S.: No this is no neglection of graphic design but not everone needs it, because most people would lie if they had a perfect image (I couldn't deal with being approached nicely by the women working at my bakery (this might by different in the USA). <br> <br></p>"
