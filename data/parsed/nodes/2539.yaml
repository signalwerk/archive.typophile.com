    html: <p>For clarity's sake, let's define a "mark" as a non-type graphic with or without accompanying logo type, "type" as a written/typed out name without a graphic, and ignore the merging element of a "typemark" (i.e. monogram) to avoid confusion. <br> <br>I believe the type or size of a business or industry is irrelevant to whether or not a "mark" (vs. type) should be used to identify it. The process of designing an identity includes discovering a party's unique characteristics, relative to their industry and their goals/objectives, then capturing your findings in a mark or typographical logo. How can you assume one will work better than another without applying the design process to the individual project. <br> <br>I have only been pursuing self employment for about five months now, after spending seven years working for in-house corporate design groups. One of the greatest benefits I have found working on my own is that I have enough control over my projects to individualize each one of them, instead of regurgitating portions of old projects. In the corporate world, the statement "don't reinvent the wheel" is practically a chant. I understand the concept of not throwing out everything you have learned, but I believe the statement is often used as a copout to avoid going through the design grinder (here design is used in its most general sense, as almost every discipline requires some form of design...see dictionary definition). It irritates me to hear or read that some designers are promoting what in my opinion is an unsubstantiated limitation to my control over individual design projects. <br> <br>Aloha! <br>Scott</p>
    html_clean: <p>For clarity's sake, let's define a "mark" as a non-type graphic with or without accompanying logo type, "type" as a written/typed out name without a graphic, and ignore the merging element of a "typemark" (i.e. monogram) to avoid confusion. <br> <br>I believe the type or size of a business or industry is irrelevant to whether or not a "mark" (vs. type) should be used to identify it. The process of designing an identity includes discovering a party's unique characteristics, relative to their industry and their goals/objectives, then capturing your findings in a mark or typographical logo. How can you assume one will work better than another without applying the design process to the individual project. <br> <br>I have only been pursuing self employment for about five months now, after spending seven years working for in-house corporate design groups. One of the greatest benefits I have found working on my own is that I have enough control over my projects to individualize each one of them, instead of regurgitating portions of old projects. In the corporate world, the statement "don't reinvent the wheel" is practically a chant. I understand the concept of not throwing out everything you have learned, but I believe the statement is often used as a copout to avoid going through the design grinder (here design is used in its most general sense, as almost every discipline requires some form of design...see dictionary definition). It irritates me to hear or read that some designers are promoting what in my opinion is an unsubstantiated limitation to my control over individual design projects. <br> <br>Aloha! <br>Scott</p>
