    html: <p>I agree, in general, with Zato and HD there. Most small/medium clients know they need a unique identity but only know how to ask for a "logo." <br> <br>But when it comes to the actual design process I agree with Scott. I wouldn't rule either out without judging the merits of each, against the requirements of the project. <br></p>
