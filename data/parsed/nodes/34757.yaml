      <p>Dan</p>
      <p>When I worked at the Weyburn (Sask) Review, I once leafed through the archives, and found that during the WWII years, many articles were circled in pencil with the words "Propaganda" written over them. The publisher of the time (who was of the journalist type, not the businessman type) had gone through and marked them as such so that future generations would not mistake these for "real news". Apparently the propaganda machine was quite active then.</p>
      <p>It is the times, no doubt. That may be why the men of that generation have so much trouble with war protestors of the 60s and today. (Of course, while I am a pacifist myself, I think that WWII is the one war since Waterloo that "needed" to be fought.)</p>
