    html: <p> I am thinking of making this specially hinted truetype font freeware, but with a sort of free license so I could see who was using my font. Is this practical? I have already started using the font on my webpage and in my flash applications, but I would like to see it used more. However, I would not like to see it go the way of some of my flash games which have (for want of a better word) been stolen and used on other sites without my permission (I have learnt to safe-guard my flash work, but fonts are not so easy). <br>Comments welcome. <br>Matthew Brown </p>
