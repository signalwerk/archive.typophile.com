    html: <p> The double-el is actually a part of the Spanish alphabet. The only other letter to double in Spanish is the "r" - but that doesn't get its own slot for some reason - maybe because the double-el is (or at least can be) pronounced quite differently that just two els. The third very common letter-pair in Spanish is the "ch" (which normally gets its own slot in most dictionaries and such, I believe), and that also has its own sound, but maybe doesn't get an alphabetic slot because it's made up of two different letters? Language is like women. <br> <br>hhp </p>
