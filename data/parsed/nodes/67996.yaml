      <p>BTW Mike mentioned Robert Arnow's font called Mustang (TM)<br>
      Reiner Imre (1900-1987) designed Mustang and D. Stempel, Frankfurt a/Main produced it since 1956. "a brush script revived in 2005 by Canada Type as Hunter"<br>
      Mustang is now Hunter...<br>
      something is now Mustang...<br>
      Is this situation normal?</p>
