    html: |-
      <p>_MASTERS OF SEX_ is a fairly close match to the similarly named "Lust" <a href="https://www.myfonts.com/fonts/positype/lust/" title="https://www.myfonts.com/fonts/positype/lust/">https://www.myfonts.com/fonts/positype/lust/</a> _R_ seems pretty well spot on. Use the leg from _R_ for the strokes on _M_ and _A_. Use the Didone version of Lust.<br>
      I suspect that _MASTERS OF SEX_  is not a specific font as such, but rather is yet another attempt to make a sexy set of Didone letters.<br>
      Don</p>
    html_clean: |-
