    html: |-
      <p>Rhetorica sounds pretty good. I'll go over to the critique section and see what the type looks like.</p>
      <p>The word Rhetoric, at least in North America, has shifted meaning. You will often read or hear pundits saying things like: "Enough with the rhetoric, we need action."</p>
      <p>So there is some confusion or meaning-drift that equates rhetoric with sophistry -- ie: that rhetoric is deceptive word-play that is either without value (at best) or designed to fool the audience (at worst).</p>
      <p>Of course, that's not the real definition of rhetoric. I think Rhetorica is enough removed from this misuse of the term rhetoric that it will be just fine.</p>
