  html: |-
    <p>Hi Typophiles,</p>
    <p>I'm determining the name of a typeface I've almost finished, but need advice. (As the Critique section has been a bit desolate lately, I'm posting this here to catalyse the discussion for the sake of finishing my typeface before New Year.)</p>
    <p>To what extent is <em>Rhetorica</em> a good name for a text typeface?</p>
    <p>I chose the name mainly because of it's meaning in Spanish:</p>
    <p><em>"f. Arte de bien decir, de dar al lenguaje escrito o hablado eficacia bastante para deleitar, persuadir o conmover." (Real Academia Española)</em></p>
    <p>Nevertheless, I can't forget it's etymology, which is the art of public speech. I like the way the term has been generalized to the written language in Spanish-speaking countries, but I don't know if this has happened elsewhere. I was aiming at rhetorical device rather than rhetoric per se. </p>
    <p>Do you think the majority of people will misinterpret <em>Rhetorica</em> in relation to the interpretation I'm aiming for?</p>
    <p>***</p>
    <p>For those who feel they need to see my typeface to tell better, it's in the Critique section (I already inferred it :-) ). I'm not doing any advertising here.</p>
