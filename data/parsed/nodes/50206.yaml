    <p>Hey everyone!</p>
    <p>A couple of months ago a friend of mine had the chance to intern with one of India's best  graphic designer, Mahindra Bhai Patel in Bombay. He had conducted a workshop where he had taught her (and the rest of the group) something called the LCM grid. From what i can gather, its one that requires quite a bit of mathematical calculation but works on the LCM of the page size rather than the Golden ratio. </p>
    <p>Thats all i could "extract" from my friend and its going to be a while till i meet mr Patel once again...</p>
    <p>Soooo, does anyone know what this LCM grid is all about?</p>
