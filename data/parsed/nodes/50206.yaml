      <p>Hy Arjun, first of all its really good to hear Patel Sir's name here, he is really a great mentor, fortunately i got a chance to work on some projects with him. </p>
      <p>Well LCM grid is a technique to find out no. of columns and their optimum width suitable for a particular page size, so you get the consistent divisons and there wont be any extra space left after drawing columns.</p>
      <p> The most commonly used LCM is 12, because its a divisible for both even and odd, so you get a flexibility of working with 2,3 and 4 column chunks. </p>
      <p>Previously designers had to use a formula for manually calculating the column widths accordingly to desired LCM, but now with InDesign you can directly define it easily.</p><div class="imageWrap"><img src="http://typophile.com/files/12-LCM-Grid_5114.gif"></div><p></p>
      <p>See the image, above its a 12 column LCM grid, might make clear.</p>
