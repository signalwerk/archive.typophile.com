    html: |-
      <blockquote><p>Scheherazade seems to use the possibility of OT 1.6 to assign descriptive names to its cv__ features. </p></blockquote>
      <p>Correct that Scheherazade uses the FeatureParams field of the cv__ features to provide descriptive names. This facility was part of the original cv__ feature definition.</p>
      <blockquote><p>It’s also possible for ss__, </p></blockquote>
      <p>as of OT 1.6, yes.</p>
      <blockquote><p>Does any font editor and GUI DTP software support named features?<br>
      Do many fonts contain names?</p></blockquote>
      <p>I think we've had a chicken-and-egg problem: Font developers are waiting for apps to support these UI strings, and app developers are waiting for fonts to contain them. That is one reason SIL has started including them.</p>
      <blockquote><p>I believe font vendors should soon start to include CSS files with fonts that are intended to be used on the Web as part of the documentation.</p></blockquote>
      <p>I had that same thought when I read your original post. Thanks for providing an example -- hopefully you won't mind if SIL uses it (or something derived from it) in future releases?</p>
