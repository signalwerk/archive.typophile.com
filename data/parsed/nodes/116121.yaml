      <p>Please, use and adapt the code as suits your needs. I just hope browsers will soon implement the high-level parts of CSS Fonts 3 instead of just the low-level <code>font-feature-settings</code>.</p>
      <p>JFTR, here are the proposals to add support for named features to <a class="freelinking external" href="http://lists.w3.org/Archives/Public/www-style/2014Feb/0509.html" rel="nofollow"><code>character-variant()</code> and <code>styleset()</code></a> as well as to <a class="freelinking external" href="http://lists.w3.org/Archives/Public/www-style/2014Apr/0450.html" rel="nofollow"><code>@font-feature-values</code></a>.</p>
