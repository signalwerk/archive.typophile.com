      <blockquote><p>Alternatively, has someone conducted a survey what actual typefaces put in these features?</p></blockquote>
      <p>Not a survey, but a data point: SIL's <a class="freelinking external" href="http://scripts.sil.org/scheherazade" rel="nofollow">Scheherazade</a> implements a number cvXX features. </p>
      <p>As for choosing a particular ssXX or cvXX to use, just remember that once users begin to use your fonts with character variant or stylistic set features, you can't change the your mind about which feature to use without breaking user's documents.</p>
