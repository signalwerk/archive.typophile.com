      <p>Scheherazade seems to use the possibility of OT 1.6 to assign descriptive names to its <code>cv__</code> features. It’s also possible for <code>ss__</code>, and AAT always was more verbose. According to the Scheherazade documentation, XeTeX seems to support that (LuaTeX probably too). CSS does not, although it has been proposed already.<br>
      Does any font editor and GUI DTP software support named features?<br>
      Do many fonts contain names? </p>
      <p>I believe font vendors should soon start to include CSS files with fonts that are intended to be used on the Web as part of the documentation. They may look something like this:</p>
      <pre><code>@font-feature-values <strong>Scheherazade</strong> {
        @character-variant {
          /* <strong>Dal</strong> U+062F, 0630, 0688, 0689, 068A, 068B, 068C, 068D, 068E, 068F, 0690, 06EE, 0759, 075A, 08AE */
          standard-dal: 12 0; alternate-dal: 12 1;
          /* <strong>Meem</strong> U+0645, 0765, 0766, 08A7 */
          standard-meem: 44 0; sindhi-meem: 44 1;
          /* <strong>Heh</strong> U+0647 */
          standard-heh: 48 0; sindhi-heh: 48 1; urdu-heh: 48 2; kurdish-heh: 48 3;
          /* <strong>Arabic U</strong> U+0677, 06C7 */
          standard-u: 50 0; filled-u: 50 1;
          /* <strong>Maddah</strong> U+0622, 0627+0653, 0653 */
          small-maddah: 60 0; large-maddah: 60 1;
          /* <strong>Shadda+Kasra Positioning</strong> U+064D, 0650+0651 */
          raised-shadda-kasra: 62 0; lowered-shadda-kasra: 62 1;
          /* <strong>Damma</strong> U+064F */
          standard-damma: 70 0; filled-damma: 70 1; short-damma: 70 2;
          /* <strong>Dammatan</strong> U+064C */
          standard-dammatan: 72 0; six-nine-dammatan: 72 1;
          /* <strong>Inverted Damma</strong> U+0657 */
          standard-inverted-damma: 74 0; hollow-inverted-damma: 74 1;
          /* <strong>Superscript Alef</strong> U+0670+…, 0649, 064A, 06D0, 06D1, 0777, 06CC, 0635, 0636, 069D, 069E, 06FB, 08AF, 0633, 0634, 069A, 069B, 069C, 06FA, 075C, 076D, 0770, 077D, 077E */
          small-superscript-alef: 76 0; large-superscript-alef: 76 1;
          /* <strong>Sukun</strong> U+0652 */
          closed-sukun: 78 0; open-down-sukun: 78 1; open-left-sukun: 78 2;
          /* <strong>End of Ayah</strong> U+06DD */
          standard-ayah-end: 80 0; circle-ayah-end: 80 1; rectangle-ayah-end: 80 2;
          /* <strong>Eastern Digits</strong> U+06F4, 06F6, 06F7 */
          standard-eastern-digits: 82 0; sindhi-eastern-digits: 82 1; urdu-eastern-digits: 82 2; rohingya-eastern-digits: 82 4;
          /* <strong>Comma</strong> U+060C, 061B */
          upward-comma: 84 0; downward-comma: 84 1;
          /* <strong>Jeh Hack</strong> U+0698 */
          standard-jeh: 90 0; dot-hat-jeh: 90 1;
          /* <strong>Dotless Head of Khah Hack</strong> U+06E1 */
          standard-khah-dotless-head: 92 0; jazm-khah-dotless-head: 92 1;
        }
      }</code></pre><p>Combining cv features into a virtual styleset only worked in an older draft I think.<br>
      This font activates them by language, but they should probably also be available as ss01–ss04.</p>
      <pre><code> /* sindhi-style:   44 1   48 1   82 1;
          urdu-style:            48 2   82 2;
          kurdish-style:         48 3;
          rohingya-style:               82 4;
        */
        @styleset {
          sindhi:   1;
          urdu:     2;
          kurdish:  3;
          rohingya: 4;
        }</code></pre>
