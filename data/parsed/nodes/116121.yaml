  html: |-
    <p>Is there any informal standard on how to choose which character variant (<code>cv01</code> through <code>cv99</code>) or stylistic set (<code>cv01</code> through <code>cv20</code>) a certain glyph or group of glyphs should go into?<br>
    Alternatively, has someone conducted a survey what actual typefaces put in these features?</p>
    <p>With <a class="freelinking external" href="http://www.w3.org/TR/css-fonts-3/#font-feature-values" rel="nofollow">CSS Fonts 3</a>, there is a higher-level language to add mnemonics for these enumerated features (and some more) when used with the <code>font-variant-alternates</code> property.</p>
    <pre><code>@font-feature-values FontFamilyName {
      @styleset {insular: 1; uncial: 2; unicase: 3;} /* ssXY */
      @character-variant {initial: 1; medial: 2; final: 3;} /* cvXY */
      @stylistic {cute: 1;} /* salt index */
      @swash {curly: 1; longish: 2; playful: 3;} /* swsh or cswh index */
      @ornaments {ugly: 1; floral: 2; techy: 3;} /* ornm index */
      @annotation {circled: 1; disced: 2; squared: 3; inverse: 4} /* nalt index */
      /* identifiers in front of colon are user defined and can be shared by fonts */
      /* numbers after the colon are font-dependent */
    }</code></pre>
