  html: "<p>I'm trying to test a TrueType font, shows up on screen, but when I print, this is what comes out on the paper: <br> <br>PCL XL error <br>    Subsystem:  TEXT <br>    Error:  InternalError 0x50 <br>    Operator:  ReadChar <br>    Position:  73 <br> <br>Anybody know what it means?</p>"
