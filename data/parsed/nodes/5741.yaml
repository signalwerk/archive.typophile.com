    html: <p>It's an HP LaserJet 1200 (w/ HCL 6 driver).  I found that the problem is directly based in the HCL 6 driver (a problem that could be easily repaired if only I were allowed to install the fix, but alas it's a work printer, so only the official IT guys are allowed to go foolin' around with such things)--the whole thing gave me quite a scare, thinking I had done something stupid.</p>
