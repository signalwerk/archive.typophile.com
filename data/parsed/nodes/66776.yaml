      <p>As I design both the interiors and covers for all the books I do, I try to match the cover to the interior as much as possible in all of them. This can mean I use the same typefaces, but not necessarily so. However, I cannot see the cover of a book separate from its interior, which is why I pretty much never like books that have a cover that wasn't designed by the person who did the interior. They are usually completely disconnected from each other. It often looks like someone grabbed an interior and folded some random cover around it. The design nearly always fails this way. As I mentioned earlier, the cover doesn't necessarily need the same typefaces, but I usually try to apply similar type, color and grid treatments as applied in the interior, so you really pull both of them together.</p>
      <p>Luckily I have been working for a publisher that is small to medium in size, so I do not have to deal with marketing departments. They usually give me complete freedom.</p>
