      <p>Tschichold's thoughts as outlined in "The Form of the Book" don't have many contemporary adherents (particularly the dust jacket as cigarette package analogy), but I've always admired the tenacity and intelligence of this passage:</p>
      <p>"Only the book jacket offers the opportunity to let formal fantasy reign for a time. But it is no mistake to strive for an approximation between the typography of the jacket and that of the book. The jacket is first and foremost a small poster, an eye-catcher, where much is allowed that would be unseemly within the pages of the book itself. It is a pity that the cover, the true garb of a book, is so frequently neglected in favor of today’s multicolor jacket. Perhaps for this reason many people have fallen into the bad habit of placing books on the shelf while still in their jackets. I could understand this if the cover were poorly designed or even repulsive. But as a rule, book jackets belong in the waste paper basket, like empty cigarette packages."</p>
    html_clean: |-
