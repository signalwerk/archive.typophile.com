      <p>Well, I will argue tho, that the bulk of an interior can be done without the display font for the CTs and the frontmatter. I just had to do that, throwing up a Hail Mary that the cover fonts wouldn't clash horribly with the font I chose for the text (in this case Arno, which plays well with others). I got lucky this time and it's all meshing well. </p>
