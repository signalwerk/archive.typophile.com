    html: |-
      <p>I like them to match, or at least work together. But most of the books I do are art books, cookbooks, where the cover is of a piece with the design of the interior. Not a "poster". God I hate the idea that the cover is a sales tool. </p>
      <p>It's different in trade publishing where, as was pointed out, they are often done not by the same designer, not even the same department. I used to work on trade covers and it was like a little death each time I opened my book and the interior was completely off. OTOH, the cover can change a zillion times and if the interior is on a deadline sometimes it can't wait for the marketing geniuses to make up their minds.</p>
      <p>I once did an interior for a cookbook. They sent me the cover for reference but said it didn't have to match. The cover was HIDEOUS. Then (because I had suggested it) they decided I should match the cover fonts, which by that time had changed, still awful. So I incorporated their fonts, reluctantly, and then when I got the book the cover had gone back to the ugly original, I had done an equally ugly interior, and they didn't work at all together.</p>
      <p>Oh and yes, the relationship is the same if it's a paperback. On a HC, the cover, or case, should match the jacket.</p>
