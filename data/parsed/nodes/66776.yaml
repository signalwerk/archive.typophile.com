      <p>I think that it partly depends upon the nature of the book and its niche or category. Fine books tend to want to be more traditionally harmonious from outside to inside. General trade and mass-market, not so much.</p>
      <p>As a designer, I started out idealistic about covers and interiors. When I became creative director at a publisher, I had to learn to adopt a more pragmatic approach. As has been mentioned, very often the interior and the cover end up being handled by different designers.</p>
      <p>I think that going into it with a requirement that cover and interior typography be the same is an unnecessary (and perhaps ill-advised) constraint. The two situations frequently have different needs and demands. Today’s book cover is mostly advertising/poster. The cover must entice; the interior must communicate. </p>
      <p>Sometimes the same type palette can serve both needs. Often not.</p>
      <p>Emerson’s oft-quoted quip from <em>Self-Reliance</em> comes to mind: “A foolish consistency is the hobgoblin of little minds.&nbsp;.&nbsp;.”</p>
      <p>Since the two aspects were handled by different teams, I always took it as my job as creative director to make sure that the elements would come together and harmonize in the end — from directing the initial concepts to working with transition elements (like title page or back cover) to make sure that the overall object felt like it made perfect sense in the end.</p>
    html_clean: |-
