      <p>Orhan Pamuk is a very special case. He was devoted to painting throughout his childhood, and then went to architecture school. In his interview with Charlie Rose, he said he views his writing as very painterly, and teaches a course at Columbia about the connections between visual arts and literature. He is a member of Columbia U.'s art department, as well as middle eastern literature.</p>
      <p>Patty, I think everyone who writes about Tschichold these days—and there is a lot of recent stuff—acknowledges that he was maddeningly dogmatic. If that were the only thing about him, he would be totally ignorable. But he was also a fantastic typographer, both in his modernist and traditionalist phases. It is just amazing how he was able to change his opinions 180 degrees and be dogmatic and brilliant in both phases!</p>
      <p>I always find his views interesting and thought provoking even when he is full of shit, as in the line about throwing away dust jackets.</p>
      <p>Maybe a few of us here can match Tschichold for dogmatism, but not many, so I think that's a bit of a bum rap. </p>
      <p>If we only could match him in brilliance!</p>
