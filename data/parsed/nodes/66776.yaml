    <p>Must the fonts used in the body of a book (sans for headings, serif for the text) also be the exact same ones used on the cover for the title, subtitle, and author information?</p>
    <p>For example, if I was doing the book text in <a class="freelinking external" href="http://vllg.com/Klim/Feijoa" rel="nofollow">Feijoa</a> (<a class="freelinking external" href="http://www.fontshop.com/fontlist/families/ff_milo/" rel="nofollow">FF Milo</a> for the headings), would using <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/arno/italic-display/" rel="nofollow">Arno Pro Display Italic</a> for the title and FF Milo for the author info work on the cover?</p>
    <p>Thanks in advance for your book design advice.</p>
    <p>Rahim</p>
