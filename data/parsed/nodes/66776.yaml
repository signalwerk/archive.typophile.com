      <p>To expand a little on what Jason said, some designers feel the jacket is an extension of the interior. I once had an interior design (almost) rejected because the art director, who was doing the jacket, didn't have the fonts I was proposing for the text. She felt strongly about maintaining the look of the interior. Others feel the function of a jacket is like a poster.</p>
      <p>Not an argument you can win, whichever side you pick. </p>
