  html: |-
    <p>I was seeking a web-embeddable alternative to Knockout and was thrilled to find League Gothic in all its awesomeness.  However, it’s a touch too thick.  I’m looking to be closer to Junior Bantamweight version of Knockout. </p>
    <p>Do any alternatives/options exist?  Does League Gothic come in different weights?  Thanks in advance for the help.</p>
