  html: <p>Hidden Typography <br>================= <br> <br>We are pleased to announce details of the second Friends of St Bride Annual Conference, 'Hidden Typography', on 20 + 21 October 2003. <br> <br>The 2003 Conference has a terrific lineup of 22 speakers from around <br>the world talking on a wide range of typographic topics. <br> <br>The event includes the annual Beatrice Warde memorial lecture, which <br>this year will be delivered by Lawrence Wallis in St Bride Church. <br> <br>In addition to the formal proceedings there will be exhibitions <br>of lettering by members of the South London Lettering Association and a <br>display of printmaking by students of Morley College, London. All <br>material is for sale as well as display. <br> <br>There will be other chances to spend your money with a number of <br>stallholders selling a range of goods, including specialist books. <br> <br>The conference will host a reception on 20 October and delegates will <br>be sent home with a goody-bag par excellence! <br> <br>The conference fee is </p>
