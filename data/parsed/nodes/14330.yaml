    html: |-
      <p>I’ve become completely enamoured with Underware’s work, particularly Dolly, Sauna, and Bello. I got my hands on their Dolly and Sauna specimen books w/ free trial versions of the fonts (what a great idea) and 5 pts at TypeCon. I opened up my laptop on the way home and started playing with the fonts. Underware just seem to be genuinely enjoying and loving what they do and having mischievous fun, while still doing great work. On top of that, they’re teaching students how to do the same thing. Their font specimens are full of funny and interesting writing, not just strings of meaningless words, another reason I like getting my hands on their stuff.</p>
      <p>My appreciation of their work has a lot to do with what I know of Undeware as a whole, not just how much I like the fonts. Their work has been instrumental in getting my ass in gear on a font, as well.</p>
      <p>So, yeah. I like Underware.</p>
