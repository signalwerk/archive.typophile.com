    html: <p>Underware’s work is definitely amazing. If you haven’t seen their workshop stuff you should totally check it out. The projects provide a good insight into the way they approach type. <a href="https://web.archive.org/web/20080828000542/http://www.typeworkshop.com/" title="www.typeworkshop.com">www.typeworkshop.com</a>  They also published a little booklet called five point that is a good read, I think you can still order it.</p>
