  html: |-
    <p>Hi to all,</p>
    <p>I wish to hear your opinions about one of the newest type foundries who follows the same direction of humanist emotional connotations who inspired me everyday on my latino vernacular handpainted neighbourhood signage.<br>
    I think that the sense of humor and the emotional relation of his products samples design to his customers its a great strategy.<br>
    The Logo brand its a handpainted swashy lettering who is very similar to some humoristic comercial signage here in Chile..<br>
    I think that Sauna and Dolly are the better works from Underware until now, because they are very versatile. Auto its a great work too but its ductos is maybe too much squared and geometrical. Bello pro its a nice Display font but i think that its very hard to read..maybe they can do a better version keeping the same flavour but adding more functionality as a type. I wish to add some critique to his display works because i feel that i am in the same way or direction to this guys and i like to see more and more type designs like Dolly and Sauna from independent designers.</p>
    <p>BTW, i like to know which method use Underware to design fonts, they work in group right?<br>
    Personally i wish to be oriented to get sucessful finished fonts with a similar way of work..</p>
    <p>Best,</p>
    <p>mh.</p>
