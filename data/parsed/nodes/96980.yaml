    html: |-
      <p>Yep, but the inspirational font is <em>Semplicità</em> by Alessandro Butti.<br>
      Paul Shaw has only partly right: "Semplicità was the most popular sans serif in Italy" until the seventies (not only "during the Fascist era"), when it was abandoned and practically forgotten.</p>
