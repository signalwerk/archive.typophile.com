  html: |-
    <p>Hi, I`m looking for the font used in the CELINE logo : <a href="http://www.celine.com/" title="http://www.celine.com/">http://www.celine.com/</a> .<br>
    I only found out that: "The logo itself consists of the name in a digital font, inspired by a mid-20th-century Italian one found in an old type specimen book. ". Looks like the whole CELINE website uses that font. Any ideas what it may be?</p>
