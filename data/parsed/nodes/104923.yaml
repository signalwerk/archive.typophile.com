      <p>There are 3 fonts actually:<br>
      "ALLPAK" is <strong>Arctic</strong>, a (free?) font by Daryl L. Houston<br>
      "BMUN" looks like <strong>BN Police</strong> by Ben Nathan (1999)<br>
      "2012" must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Amerika%20Sans%20-%20Regular&amp;fid=5d726d565876da172810bea71e2ee3ad&amp;fsize=60&amp;text=2012&amp;wrap=2" rel="nofollow">Amerika Sans</a></strong> by Apostrophic Labs (2001)</p>
      <p>------------------<br>
      I found them using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
