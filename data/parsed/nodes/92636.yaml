    <p>The May edition of the Metal Type newsletter is now out.</p>
    <p>I have revived the "vehicles" feature on this month's video - pictures and details of the 1950s UK workhorse, the Austin A40 van are at the end of the video.</p>
    <p>To take a look click this link:<br>
    <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>To subscribe to the Metal Type monthly newsletter (now in woderful HTML) click here: <a href="http://j.mp/n3wkjc" title="http://j.mp/n3wkjc">http://j.mp/n3wkjc</a></p>
    <p>Metal Type Printing has some fantastic new business card designs, featuring swash initials. We now ship world-wide. Take a look: <a href="http://j.mp/AbvBTc" title="http://j.mp/AbvBTc">http://j.mp/AbvBTc</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
