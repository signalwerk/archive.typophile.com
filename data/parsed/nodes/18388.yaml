      <p>James: full-on reply! Thanks for taking the time.</p>
      <p>Yeah, I know it could be worse. They could have used the colour palette for the <a href="http://www.melbourne2006.com.au" rel="nofollow">Commonwealth Games</a>. As I said before: I like the colours and I don’t really mind the star; I’m mostly concerned with the lowercase text.</p>
      <p><cite>How is it that those forms are at odds with the bold color scheme? Give it a break.</cite></p>
      <p>I think the strong colours and the gleaming star create a look and feel that is almost militant. Can I scoot around Godwin’s Law by saying a certain well-known political party selected those colours for a reason? ;-) Then you glance down and there’s this informal, hello!, da de da, bit of text that - for me - just doesn’t quite fit. It’s too casual in contrast to the other elements.</p>
      <p><cite>3D—-what 3D?</cite></p>
      <p>Sure, it’s not all singing, all dancing 3D, but it still has a bevelled effect. Maybe I’m wrong, but I feel like it should be one style or the other. Render both or neither. </p>
      <p>I don’t think I’m being cynical or projecting too much, but if I’m the only person who double-takes at ‘nab’, well, good luck to them. Many happy banking returns, etc, etc. :-)</p>
      <p>So it’s not The Mix. Is it a custom job then?</p>
