      <p>I emailed that address, and was told that they get a lot of questions about this, but that they didn’t actually do the rebranding – it was the principles in Sydney who handled it. I asked if they knew anyone in Sydney I could ask, but they didn’t. They did however do some good ol' googling on my behalf, and directed me to The Age article Geoff linked to above. Which, now that I reread it, says:</p>
      <p><cite> The seven-pointed red star remains, but its two lines, originally intended to mark the merger of Commercial Bank and National Bank of Australasia, have been tapered to look more "dynamic".</cite></p>
      <p>Aah, dynamism. Is there anything it can’t do? :-) So there I go.</p>
