      <p>National Bank of Australia -&gt; National Australia Bank -&gt; National -&gt; nab</p>
      <p>I live in Australia and I was not even aware "nab" was the National Australia Bank. It just goes to prove that the logo retouch seems to be an impatient upgrade. </p>
      <p>Take for example the Shell and Ontario Trillium upgrades. Slow, decade and generational changes. When you fidget too much with your identity too much, especially for a Bank (stable, secure, professional), it obviously signifies trepidation amongst its upper ranks.</p>
      <p>As for the lower case phenomena. THANK GOD!</p>
      <p>Lower case feels balanced in this case. Why should there need to be a hierarchy suggested in the logo? </p>
      <p>Not that I mind upper case in logos. But their absense does not painfully harm a good branding.</p>
      <p>As for the use of the acronym NAB. Sounds like a very comical choice. Perhaps the designer knew he could get away with providing a diservice for the client.</p>
      <p>Viva le Revolucion!</p>
