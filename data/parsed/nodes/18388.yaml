      <p>Yves, I'm curious what fault you find with the type? How is The Mix better?<br>
      It seems well constructed to me. I might add a little contrast, but it seems like preference.</p>
      <p>In gereral I think it's nice. The disadvantage I see is that they've lost their grid. Before, the star's parallel sides framed the N (never noticed that about a 7 point star). Now it's balanced, but not as tight. They still use it horizontal (<a href="http://www.national.com.au/About_Us/0,,175,00.html?ncID=ZBA" title="http://www.national.com.au/About_Us/0,,175,00.html?ncID=ZBA">http://www.national.com.au/About_Us/0,,175,00.html?ncID=ZBA</a>) but the proportions feel a little too equal between mark and type in this format. But overall ... workable. No reason for outcry IMO.</p>
      <p>R</p>
