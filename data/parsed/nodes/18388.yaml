    html: <p>I think it looks okaaay. It is easier on the eye than the old one. The eye takes it in faster ( recognizes it ) too. Thats a major consideration. I think that it might have been smarter or cooler to use a warmer red to play up the australianess (sp?) - but then I am a yank &amp; I don't know how aussies feel about colors. Also, having to color match all the time might be too expensive. As far as 'nab' goes - I think people are getting more &amp; more used to acronym-homonyms of in media. For instance for me, 'CIA' brings 3 organizations to mind readlily. The US gov arm, Culinary Institute of America, and the Cleveland Institute of Art ( <a href="http://www.cia.edu" title="http://www.cia.edu">http://www.cia.edu</a> ), if I was Canadian the list would no doubt be longer. Now, is the design wonderful? No. It isn't. But It will probably serve the company better than the old logo which was was a pig's breakfast. Also, if they decide to reverse black &amp; white later it will be easy &amp; no one will notice very much.</p>
