      <p>I like this new National Australia Bank logo.</p>
      <p><em>It could be much, much worse.</em></p>
      <p>Exactly. It really isn't that bad.</p>
      <p>The font is Lucas De Groot's <a href="http://www.fonts.com/FindFonts/detail.htm?pid=413733" target="_new" rel="nofollow">The Mix</a>. I've been waiting about five years for this variety of progressive type design to graduate to mainstream use with major corporations. All power to Lucas.</p>
      <p>3D---what 3D?</p>
      <p>I think you're overeacting to something new, simply because it is new and not the same as its predecessor. Try not being so cynical. Accept things at face value and avoid projecting your personal values onto them.</p>
      <p>People who work inside the corporation and industry insiders refer to it as "nab", but that phraseology does not---has not---filtered into common parlance, so the perjorative meaning of "nab" isn't a big issue. Certainly the new ad campagne on television does not call it "nab".</p>
      <p><em>I’ve never heard anyone say ‘nab’, only ‘National’ or ‘N.A.B’...</em></p>
      <p>This is what I mean.</p>
      <p><em>...the ‘friendly’ type seems at odds with the strong, bold colours...</em></p>
      <p>I don't see how. How is it that those forms are at odds with the bold color scheme? Give it a break.</p>
      <p><em>I think combining nab and red/white on black is a bad idea, it looks absolutely criminal.</em></p>
      <p>How does it evoke "criminal"? I think you guys just don't want to like it, without coming up with good reasons why its bad.</p>
      <p><em>All l/c seems to be the first stop for convincing people you’re ‘friendly and approachable’ these days. Or has it always been that way? What is it about lowercase that’s so friendly? Is it just the variations in character height creating a looser feel, in the same way that ragged text creates a less formal look than justified text?</em></p>
      <p>Partly, yes. But fundamentally, Latin capitals are synonymous with iron-fisted authority, officialdom and rigid social formality. They're an invention of the ancient Romans, who too often valued pompousness and grandeur above human concerns. The roman Latin capital forms draw on the formal, constructed, component-based nature of classical architecture---Roman &amp; Greek temples and official public buildings. They're based on circles, squares, triangles, straight lines and right angles---perfect Euclidian geometry the ancients assumed was indelible and unalterable, imune to any fault or criticism.</p>
      <p>All of that stuff was deeply concerned with authority, and an even more inflexible idea---the all-powerful will of the ancient gods who supposedly ruled people's lives. Latin capitals have been employed ever since by people in positions of power to assert their dominance and authority.</p>
      <p>In the present political atmosphere where corporations and govenments are held accountable, scutinized for corruption and abuses of power, even the tiniest failure to account for their liabilities, a typographic depiction of authority is the last thing a powerful corporation like a bank wants as its public face. So yes, it is a determined effort at appearing human and freindly. For a large bank that's paradoxical, since large banks are extremely powerful and noted for their inflexibility towards customers. But that's marketing.</p>
      <p>Start with the assumption that all advertising is a big fat lie. Too bad the intention is phoney. Expect nothing and you can't be disappointed. Nevermind the insincere will of those who fabricate these lies. Separate politics from design. I know, I know, they're related---the first causes the second. But it is possible to ignore that aspect and appreciate art &amp; design, however commercial, for its own sake, for what it is rather than the company it represents.</p>
      <p>There is much more to typographic design and this logo design than may be first realized. It isn't just a matter of lower case versus caps. Significantly, the lower case forms in this logo are of a humanist design. Humanism started in the Renaissance period; the movement symbolized the rejection by scholars and artists of the oppressive empirical governance of the Holy Roman Empire and the Church, and the rise of the independent city states in Europe, the exemplary model being the very first---Florence.</p>
      <p>With the rediscovery of ancient knowledge, in particular Aristotle's <em>Organon</em> "The tool" (a philosophical device that allowed ordinary people to demystify all that baffled them), along with the architect Brunelleschi's discovery of central perspective (in painting), the seven liberal arts and with the study of nature became separated for the first time from state and church, prompting the humanists to place man at the center of the world, in place of God, man as determiner of his life as an individual and of his own destiny.</p>
      <p>The creators of the new N.A.B logo may not have had all that in mind when they chose The Mix as the font. But humanist cultural values are ingrained in the letter forms regardless, and they do carry specific meaning thru their visual sense. This humanist aesthetic is not present in Latin capitals or geometric sans serifs. The Mix has serifs too---a reference to the humanist antiqua type model. That is the kind of rationale I would use to select The Mix instead of a traditional book roman or a geometric face. You want good public relations? Avoid industrial art &amp; design as well.</p>
      <p>j a m e s</p>
