  html: <p>Hi together, <br> <br>I have a problem. I build a typeface and generate it as Opentype (Postscript) on MacOSX with fontlab 4.6. <br>the problem is, that the standard ligatures (fi, fl) doesnt apear in InDesignCS. I checked everything, export options, UNICODE, indesign, etc. i have no problem with other fonts generated with fontlab, they (the standard ligatures) all work. but not in that font.  <br>the strange thing is, if i make a new font and copy all letters from the problem font to the new font and generate it again as opentype i got the same problem, that the fi and fl ligatures are not used by indesign (or textedit) under osx. so, my theory is that there is something in the font itself that surpress the use of ligatures in such programs. <br> <br>has anyone an idea where the problem could be? <br> <br>again, I do not changed the unicode or added new ligatures into fontlab. i just used the 2 standard ligatures in fontlab (fi, fl).  <br> <br>thanks <br>Thomas <br>Cape-Arcona.com</p>
  html_clean: <p>Hi together, <br> <br>I have a problem. I build a typeface and generate it as Opentype (Postscript) on MacOSX with fontlab 4.6. <br>the problem is, that the standard ligatures (fi, fl) doesnt apear in InDesignCS. I checked everything, export options, UNICODE, indesign, etc. i have no problem with other fonts generated with fontlab, they (the standard ligatures) all work. but not in that font.  <br>the strange thing is, if i make a new font and copy all letters from the problem font to the new font and generate it again as opentype i got the same problem, that the fi and fl ligatures are not used by indesign (or textedit) under osx. so, my theory is that there is something in the font itself that surpress the use of ligatures in such programs. <br> <br>has anyone an idea where the problem could be? <br> <br>again, I do not changed the unicode or added new ligatures into fontlab. i just used the 2 standard ligatures in fontlab (fi, fl).  <br> <br>thanks <br>Thomas <br>Cape-Arcona.com</p>
