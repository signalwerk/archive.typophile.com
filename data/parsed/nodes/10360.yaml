    html: |-
      <p>I'm sure InDesign (and Quark) use the fi and fl ligatures automatically if they are included in POSTSCRIPT TYPE 1 fonts.<br>
      But in OpenType fonts I guess you HAVE TO define the liga feature and include the ligatures there.<br>
      FontLab does this automatically when importing Postscript Type 1 fonts as default - which may be the reason some of your fonts have this feature, but a font you've made all by yourself from scratch doesn't have it.<br>
      Copying the glyphs from one font to another does not copy the OpenType features, so that explains why this doesn't work...<br>
      So make sure you make the liga feature before you export your OpenType font.</p>
