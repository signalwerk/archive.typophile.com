    votes: null
    html: |-
      <p>The visual cue is the continuous extending line (also rounding the white triangle helps).<br>
      You don’t “need” to see the pencil (just like you don’t need to see the arrow in the FedEx logo) and certainly you don’t want to see a broom.<br>
      Keep it simple and subtle.<br>
      If someone don’t see the pencil at first, they will feel a sense of discovery when they did.</p>
    html_clean: |-
