    html: <p>When I first saw it I was confused because I thought the light was on in apt. 4 as well (apt. 32 being the top rightmost room), So i changed the logo to put the light where apt. 32 seemed like it should be, and it didnt seem to do good things graphically. I'd suggest you keep the light on the bottom. It seems like metaphorically it works either way, and your office is on the bottom. Plus, having the light on the bottom makes it easy to notice (2nd window, 3rd floor is really confusing to look for), and grounds the whole logo. If you put it in the far upper right it makes the building look like its going to tip over. (to me at least).</p>
