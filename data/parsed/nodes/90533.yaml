      <p>Yeah, in terms of proportions Ernestine might be a bit much of a contrast in this case...</p>
      <p>In case you weren't aware: for prototyping/previewing purposes, there are a bunch of webfont preview sites out there that let you quickly preview what your site would look like with other fonts.<br>
      You can try Ernestine and others from FontFont at <a href="http://fontfonter.com/" title="http://fontfonter.com/">http://fontfonter.com/</a><br>
