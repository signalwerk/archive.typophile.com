      <p>I don't know if you think this is stylistically right, but in terms of<br>
      onscreen rendering performance and readability it's hard to beat:<br>
      <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a><br>
      Plus the ample width makes for a nice contrast with your headings.</p>
      <p>hhp</p>
