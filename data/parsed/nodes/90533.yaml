  html: |-
    <p>Hello all, I am currently designing  a site and am at a loss as to find the 'right' typeface for my body text.<br>
    The logo and the type used in the menu is Matchbook and the whole site has a late Art Deco-ish feel to it.<br>
    Currently I am using Gudea for the body. But it feels absolutely wrong in combination with Matchbook.<br>
    After looking at fonts for 4 days now my eye's are getting crossed. So I was hoping someone would have a suggestion as to which type would fit nicely within this design?<br>
    Thanks in advance.</p>
    <p>PS: I am getting an HTTP error trying to upload an attachment so I dropped it in my dropbox here: <a href="http://dl.dropbox.com/u/44628980/Capture.PNG" title="http://dl.dropbox.com/u/44628980/Capture.PNG">http://dl.dropbox.com/u/44628980/Capture.PNG</a></p>
