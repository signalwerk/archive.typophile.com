      <p>How about starting with the idea of animated typography, ie type that physically moves.<br>
      You would need a type with variants, such as Reliq, with Active/Calm axis.<br>
      You could have animated gifs online, for the logo and/or headlines.<br>
      Dont' suggest movement, show it.</p>
