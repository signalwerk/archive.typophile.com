    <p>Hi, </p>
    <p>I've developed a new type of physical game and I'd appreciate any ideas concerning a  font, that I could use as a logo, for the game. I'd like the font to be, easy to read,  energetic, and to have a smidgeon of quirkiness. I don't mind paying, for the right font, as long as the price isn't too excessive. </p>
    <p>Thanks<br>
    Don</p>
