    <p>After the revolution the government has taken down the official site of the President and put up a "coming soon" page.</p>
    <p>Unfortunately, they had a once-in-a-lifetime opportunity to legitimately use "Papyrus" and they blew it. Instead it's "Algerian." Could have at the very least been Adrian Frutiger's "Egyptienne" too as a non-comedy option.</p>
    <p><a href="http://www.presidency.gov.eg/">http://www.presidency.gov.eg/</a></p>
