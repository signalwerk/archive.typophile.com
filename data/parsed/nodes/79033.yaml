      <p>Indeed, I didn't mean it jingoistically. What I should have somehow clarified is this:</p>
      <p>Of course people whose native script is the Arabic script could still be excellent judges of typographical taste for Latin-script typography. But they wouldn't have been born that way. They would have to get the information on which such an ability is based from the outside.</p>
      <p>Thus, I wasn't trying to accuse Egyptians of an inherent incapacity.</p>
      <p>What, instead, I was noting was this: people living in Egypt are not necessarily surrounded by contemporary examples of Western languages typeset according to Western norms, fashions, and aesthetics.</p>
      <p>Thus, I can't assume that a random man in the street in Egypt is going to know that Algerian looks funny and out-of-date to most Americans and most Frenchmen and so on.</p>
      <p>Now, one might say, though, that I ought to expect that people would realize that typography is an important part of web design, and thus, unless I thought Egyptians were stupid or something, an Egyptian called upon to make an English-language web page would make it his business to find out about Latin-script typography.</p>
      <p>There are <em>two</em> answers to this.</p>
      <p>One is to simply point to the many typographic horrors perpetrated on web sites by people who can plead no language barrier in their defense. I can expect someone who sets up a web site to know HTML, or how to use Dreamweaver or a similar tool. Beyond that, nothing can be taken for granted.</p>
      <p>The other is to note that Egypt is a non-Western country. Not only isn't it the United States, it isn't Israel or Japan either. While you can definitely find fonts of Arabic display typefaces on the Web, it is also true that the aesthetic of Arabic typography is largely based on manuscript hands that have remained static for hundreds of years.</p>
      <p>So many people in Egypt, for cultural reasons, simply would not have the in-built assumption that fashions in typography change every 50 years or so, and the availability of a font for a typeface does not automatically mean that it is generally usable without inviting ridicule.</p>
      <p>I figure that whoever picked Algerian did so because it looked nice to him.</p>
      <p>Different culture, different aesthetics - and a lack of a cosmopolitan mentality to lead to automatically thinking, "Gee, I better check, to see what these people currently think is fashionable".</p>
      <p>So, while it's all right to have a chuckle at the quaint and inappropriate choice of a typeface - I suspect that there's a lot in the way of extenuating circumstances that reduce blame. Not to nonexistence. Just enough to say - one shouldn't be surprised if this sort of thing occasionally happens when people in sufficiently remote parts are trying to communicate to a culture they may not understand well in places.</p>
