    html: |-
      <p>I think the idea of one group's appropriation and modification of another's symbols and expressions is extremely interesting, but then I am an ethnomusicology student by day. In my field there are countless examples of this kind of "transculturation" - one geographically distinct group trying to emulate another and constructing something new in the process. For example, a lot of African popular music from the 60s-90s bears a strong connection to a "bad" version of Cuban rumba made in Zaire in the 50s - except of course it's not bad at all, in fact highly creative and interesting, because of the complete reinterpretation of the music and the injection of lots of new elements. It's only "bad" by Cuban rumba standards!</p>
      <p>So I'm wondering whether there's not a value (at the very least an anthropological interest!) in a lot of colloquial reinterpretations of latin writing by users of other writing systems. The fact that many of those who've learned Arabic script as their first writing system have a certain relation to handwriting in Latin script (just look at Arabic and Persian-language protest signs and their relatively uniform "mistakes") I find extremely interesting. I wonder if there's not something of aesthetic value to be taken from there as well?</p>
