      <p>@david hamuel:<br><cite>???</cite></p>
      <p>Yes, I should be more specific. Many people, whose native language is Arabic, also understand English or French - and even without that, but an interest in typography as a subject, there's no inherent reason why they couldn't have the judgment to choose popular and tasteful typefaces.</p>
      <p>The widespread use of Comic Sans and Papyrus over here shows, however, that being a native speaker of English is no guarantee of typographic taste when it comes to one's own script. Given that, I think someone from another script tradition has... farther to fall... if he stumbles around unaided.</p>
      <p>I mean, really. <strong>Why</strong> would someone use Algerian for such a heading? Given that he wasn't deliberately trying to be silly, like someone over here would almost have to be, but really, genuinely, and sincerely, didn't know any better?</p>
      <p>My guess is that he wanted to achieve the kind of effect that one would get from, say, Albertus or Trajanus.</p>
      <p>But he was unaware of Western <em>fashions</em>, and used an aesthetic informed by Arabic artwork in Egypt. So he probably sincerely thought that Algerian would have impressed people favorably as a dignified typestyle suitable for the web site of an important personage or department.</p>
      <p>We can laugh, because the result is so jarring to our eyes - but in an absolute sense, the choice wasn't inherently wrong, any more than, say, the typography on the front of 19th century sheet music is wrong. They did what looked good in the eyes of people then, given the fashions of the time.</p>
      <p>So, a man from Mars, with only 19th-century examples of English display text to guide him, might do as badly.</p>
      <p>Also, my own participation in the forum on Hebrew typography might make it seem odd that I would make such a statement.</p>
      <p>But I don't see myself as an expert; instead, I have questions and want to learn.</p>
      <p>To my eyes, using an aesthetic informed by fashions in the Latin alphabet world, there are things that seem strange in the Hebrew script world.</p>
      <p>Frank-Ruhl seems to me to be horribly dated, while Siddur-type typefaces look like the timeless canonical forms of the letters. But it's Frank-Ruhl that is the "Times Roman" of Israel.</p>
      <p>Calligraphic faces are just about <em>never</em> used for body copy in the Latin script. Particularly - but not exclusively - for religious texts, they're commonly used for Hebrew.</p>
      <p>These differences in fashions between script communities are fascinating to me... but they're also evidence that typeface aesthetics can differ widely between script communities. I can't assume that in China, Korea, and Japan... or in Israel... or in Egypt, the visual language of typography will be the same - presumably set down for all the world for a given year (as opposed to it being something significantly different as much as ten years ago) by the typographical equivalent of a few Paris coutouriers.</p>
