      <p>I'd think a successful concept for a font publisher (like fonts.com or myfonts.com) would be to create a strong static logo image (I'm seeing a printing press or even a piece of lead type) to associate with the site, and then have a dynamic name (the beauty of the internet) that changes to showcase a different font each time the site is loaded/reloaded.</p>
      <p>As for the foundries, wouldn't it be better to use actual fonts developed by the designer of the foundry? Much like Village, H&amp;FJ and Emigre have done. Present the talents of the staff because a foundry can create custom type and it would be effective to showcase that in their logoface.</p>
