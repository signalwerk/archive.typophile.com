      <p>i actually would like to politely disagree. </p>
      <p>type design is based on the principles of figure-ground relationships, harmony, legibility and individuality (amongst others). which is why I would anticipate that a type designer would have a pretty good understanding of layout and the context in which type has to work, and how they need to create a point of differentiation. even though i understand the difference between a graphic and a type designer, i refuse to believe that their influences are isolated, and therefore I cannot accept the fact that a type designer would literally throw away the "skill and knowledge" invested in their (or anybody else's) type design as it has been done in the examples that originated this thread.</p>
