      <p>The Typophile logo after the pixel flips is a <a href="http://en.wikipedia.org/wiki/Glider_(Conway's_Life)">Glider from Conway's Game of Life</a>. I always thought it was <em>meant</em> to be that (it's a somewhat popular logo in geeky circles) but I did wonder why Typophile chose it.</p>
      <p>Conway's Game of Life is a cellular automaton: a 2-d grid of squares, each one either "alive" or "dead" (black or white), with rules governing the birth, death and survival of a "cell" each timestep, based on the population surrounding it. If you start with a live cells in the configuration of the logo, four timesteps later you have the same configuration one cell north-east of the starting position.</p>
    html_clean: |-
