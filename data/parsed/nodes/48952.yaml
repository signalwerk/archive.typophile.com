      <p>I'm happy this was posted.  I've often felt the same when visiting some of the most respected foundries' sites. I wonder if they ever gave a moment's thought to the fact that the majority of their visitors and hence potential customers are designers.</p>
      <p>ITC's site especially is shockingly poor. While ITC may never reach the popularity they enjoyed when they ruled the 70's, they still have some good faces.  Anyone over 45 in this business will remember the depth of brand loyalty they inspired by publishing the ever beautiful U&amp;LC magazine. </p>
      <p>Their current site is the exact opposite in terms of ambition. You've got to wonder about the marketing directors of all these outfits. Then again, 95% of marketing people know nothing about design, though they certainly love directing designers.</p>
      <p>Conversely I think the most beautiful type specimen display examples can be found at <a href="http://fontbureau.com/fonts/">http://fontbureau.com/fonts/</a>  It reminds me of the best of the old type books. I captured about 40 screen grabs from the site, just to look and drool.</p>
      <p><a href="http://typographyshop.com">http://typographyshop.com</a><br><img src="/sites/default/files/old-images/fbsm_4751.jpg"></p>
