    <p>I’m setting the Lady Macbeth ‘Unsex me’ speech and have been reading about the story (I didn’t have the goodluck to study it at school) and getting a basic background before embarking on starting a full on project. I know this story was written in the 17th century and thought to remain true to the history would try to find a font relevant. I’ve looked at English Gothic fonts and though I’ve not done a hugely indepth search, the ones I’ve been looking at tend to come up as Blackletter which is not the route I wanted to go down, as I still want the speech to be fairly legible so thought a serif would be a better choice?  </p>
    <p>So does anyone have any ideas that spring to mind? I’ve looked through typowiki at the history of the fonts listed there and Garamond and Bembo were two that had undergone changes but were around at the time (or so the numbers say :-))</p>
    <p>This is more of a side project to my main project of documenting and mapping people using type so I’m trying to use the font and the way its set to give a voice to Lady Macbeth so her personality of ambition and hunger for power come through. I just need pointing in some direction as I feel like I’ve lost a wheel and I’m going around in circles :) </p>
    <p>Anyway help is greatly appreciated.</p>
    <p>Bec</p>
