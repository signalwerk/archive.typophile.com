      <p>If you want to evoke the time in which the play was first performed or published, then types like Caslon or a Fleischmann revival are all much too late and in completely the wrong style. Shakespeare’s plays date from the very early years of the 17th century, and the typography of the first folio edition is essentially late renaissance or mannerist. See, for example, this <a href="http://www.amazon.com/gp/reader/0393039854/ref=sib_rdr_zmin/002-4794442-0124013?p=S01G&amp;j=1#reader-page">facsimile page</a>.</p>
      <p>Ferguson’s <em>Pica Roman Type in Elizabethan England</em> is worth consulting to get an idea of the kind of generic type popular in England during Shakespeare’s lifetime. The elaborateness of style and quality of printing had advanced by the time of the first editions of Shakespeare’s work, but Caslon’s types are too close to the baroque to really substitute.</p>
      <p>All that said, I think you could have much more fun responding typographically to the content of Lady M’s soliloquy rather than to the historical period of its composition.</p>
