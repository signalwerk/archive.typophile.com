    votes: null
    html: |-
      <p><cite>Shouldn't it display an error message in such a case?</cite></p>
      <p>I guess so. Here are two lines I grepped somewhere in the sources that should generate some message:<br>
      <code><br>
      ff_post_error(_("WOFF not supported"), _("This version of fontforge cannot handle WOFF files. You need to recompile it with libpng and zlib") );<br>
      ff_post_error(_("WOFF not supported"), _("Could not find the zlib library which is needed to understand WOFF") );<br>
      </code></p>
      <p>Michel</p>
