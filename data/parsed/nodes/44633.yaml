  html: |-
    <p>Hi all, I am brand new here and have a question for you seasoned typographers about punctuation. When setting type in a paragraph that has a ™ or ® symbol followed by punctuation, do you:</p>
    <p>A) Tuck the punctuation beneath the trademark symbol, while trying to avoid making the punctuation appear to be part of the trademark; or</p>
    <p>B) Set the punctuation AFTER the ™ or ®?</p>
    <p>I have heard of it done both ways and want to settle this bit of arcanery once and for all! Thanks in advance for any/all input.</p>
    <p>Cheers,<br>
    M@</p>
