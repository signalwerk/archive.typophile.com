  html: |-
    <p>Yesterday's ten-hour drive from Philly to Boston afforded me ample time to check out the billboards that spangle I-95. Probably the most interesting thing I happened upon was the redesign of the sort-of-familiar Sleepy's Mattress mascot. </p>
    <p>Before:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo_4031.gif"></div><br>
    After:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/I8G66J6DX81PYJPJS8P_5698.gif"></div><p></p>
    <p>My wife and I only saw one billboard (out of about a dozen) that still sported the old character. A simple case of <a class="freelinking external" href="http://www.usatoday.com/money/advertising/2003-10-22-brawny_x.htm" rel="nofollow">the Brawnies</a>, or am I reading too far into this?</p>
