    <p></p><div class="imageWrap"><img src="http://typophile.com/files/notthatintoyou_5722.png"></div><p></p>
    <p>I was staring at a poster for this movie while waiting for the subway, and was struck by the odd lowercase g, y and the slightly-off serifs on the cap C and S. Identifont and Whatthefont weren't much help, but I did learn that those lowercase oddities suggest a Vibert-influenced Didot. The closest I can find is <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/Ambroise" rel="nofollow">Ambroise</a>, but there are some definite differences (t, K, and j to name a few). </p>
    <p>Any clues? Is this perhaps a custom mash-up of Didones?</p>
    <p>Thanks!</p>
    <p>—Noam</p>
