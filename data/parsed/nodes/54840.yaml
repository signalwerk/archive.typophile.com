      <p>Is it? I don' see it in the PDF specimen. It's not just the s. The cap K and lc k, f in Ambroise are funky in ways that this poster is not. The lc t has a different top, the Ambroise cap G has a downward-pointing spur, and all the ball terminals in the poster feel a tad more lachrymal than your average Didone. I'm going to try getting a photo of the poster next time I take the train.</p>
      <p>—Noam</p>
