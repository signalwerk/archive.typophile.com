      <p>@Cubic_DS, good call! Didot Elder accounts for those arrowhead serifs on the cap C and S. However, in the poster the lc s has lachrymal terminals on both ends, instead of an arrowhead at the top. I'm guessing the lc s is an alternate glyph. Thanks for the help, folks!</p>
      <p>—Noam</p>
