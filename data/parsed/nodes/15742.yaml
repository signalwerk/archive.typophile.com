      <p>When you say different, how different do you mean?</p>
      <p>American Airlines use AA.com as their primary web address but as far as I know (I’m not American) is not known as AA.</p>
      <p>It’s complicated by redirection from multiple addresses, e.g. British Airways promote ba.com but it just redirects to britishairways.com.</p>
      <p>continental.com belongs to Continental Airlines not the tyre company (who use conti-online.com).</p>
      <p>ms.com belongs to Morgan Stanley and not the more obvious software giant.</p>
