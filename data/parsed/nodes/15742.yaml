      <p>Many times major brands use alternate domain names for special promotions. </p>
      <p>http://www.camelsmokes.com<br>
      <a href="http://www.smokerswelcome.com">http://www.smokerswelcome.com</a></p>
      <p><a href="http://www.beerdrinkersagainstthemistreatmentofbeer.com">http://www.beerdrinkersagainstthemistreatmentofbeer.com</a>  (Coors Beer)<br>
      <a href="http://www.bkmasks.com">http://www.bkmasks.com</a> (Burger King - masks for Halloween)<br>
      <a href="http://www.prefergorgeous.com">http://www.prefergorgeous.com</a> (Jaguar autos)<br>
      <a href="http://wearethemudds.com">http://wearethemudds.com</a> (special site for Jeep)<br>
      <a href="http://www.goldengecko.com">http://www.goldengecko.com</a> (promo site for Geico Insurance)</p>
      <p>Also, “planet” is a frequently used prefix on some sites.<br>
      I don’t think this url is active anymore, but for years it was the key domain for Reebok: <a href="http://www.planetreebok.com">www.planetreebok.com</a> and planet.reebook.com</p>
