      <p>Hi, thanks Tim and Joel for your comments. They will be helpful, but I haven’t had time yet to update.</p>
      <p>Tim, thanks for the comments especially re: positioning. As far as pre-college’s placement in education or experience.. I think one could argue that education is experience or that experience is education. They could be placed in either category, I think, but to keep with an easier timeline I chose to put the pre-college stuff under experience. </p>
      <p>Joel, my section headings are not fake small caps! But yeah, I’ve been having a hard time aligning those things. I will play around with the word spacing as you suggested.  And I’ll see what works with the 4x5. Thank you! And.. small small world!</p>
