      <p>The red line is not precisely connected to the ear of the ’g.<br>
      The alignment of the website is “not cold not hot,” I also would suggest to letterspace both the website address and the email adress, and maybe reduce a wee bit the size of ’@’ with some positive kerning on its sides.<br>
      The titles aligned right could be all caps in smaller size and with more letterspace.</p>
