      <p>The red line still isn’t lining up, since you can’t dictate the viewer’s preferences, perhaps it would be simpler to outline the characters and pull the serif of the g out. I would look for some kind of alignment/relationship between header and copy, first I would re-position the copy slightly to the left and move it slightly down and then experiment with the positioning of your name and address details. Bearing in mind this could be printed out, the light grey used for the text might be too light/halftoned. At a closer view maybe you can work on the kerning of dashes, virgules and hyphens. Content-wise should the pre-College courses be included in education? I would remove the comma after Illustrator.</p>
      <p>Good luck with the hunt.</p>
      <p>Tim</p>
