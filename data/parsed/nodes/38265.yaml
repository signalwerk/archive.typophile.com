      <p> The baseline of the faked–small-caps section headings is inconsistently aligned with the text to its left; ‘EXPERIENCE’ shares the baseline while the others float a bit. The fontshop.com entry for Rockwell Std Light suggests the font “may include small caps, extra glyphs, and other features”, so the ‘real’ small caps might be worth hunting for. (<em>E.T.A: According to MyFonts.com, Rockwell does </em>not<em> have a small-caps version, so ignore that last bit.</em>)</p>
      <p> I know Bringhurst doesn’t like it, but in text with many capitalized words a wider space between sentences might look better, <em>e.g.</em>:<br>
         Projected graduation in May 2010 with a Bachelor of Fine Arts<br>
         in Graphic Design. Currently taking Graphic Design I,<br>
         in Graphic Design. Currently taking Graphic Design I,<br>
         in Graphic Design.&nbsp; Currently taking Graphic Design I,<br>
         Typography I, Calligraphy, and Photography I.<br>
      where I’ve shown the middle line with one space, an en space, and two spaces.</p>
      <p> Tim: When you suggest removing the comma, do you mean to use the “a, b and c” convention (rather than “a, b, and c”) or are you simply noting that it looks awkward in this context? I’d suggest keeping the comma and using an ampersand.</p>
      <p> Finally, I’m not sure what the standard camera naming convention is, but you might want to identify the camera as a 4×5 rather than 4x5—or even 4"×5". (Rockwell doesn’t have the true prime glyphs to properly display 4ʺ×5ʺ)</p>
      <p>—Joel (Cooper Union Engineering student)</p>
