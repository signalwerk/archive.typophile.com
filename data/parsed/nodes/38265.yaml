    <p>I’ve tried to give my critique on a couple of critiques and now I need advice for mine! This is my first real resume.  I am not yet using it to search for a full-time job, but will use it pretty soon to send off as a plea for an internship position this summer. </p>
    <p>I’m especially concerned about, well, the typographical aspect of the resume, as I’ve only had about  6 weeks so far of formal education in the subject.  That said, any constructive criticism would be greatly appreciated.</p>
    <p>Thanks!</p>
