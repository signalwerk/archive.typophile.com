      <p>Chanel: <a href="/wiki/https%3A/%252Fwww.google.com/search%3Fhl%3Den%2526source%3Dhp%2526q%3Dsite%253Atypophile.com%252Fnode%2Bchanel%2Blogo" class="freelinking" rel="nofollow">already discussed many times</a> and considered as "custom". Similar:  <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/blair/" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/sackers+gothic/" rel="nofollow">Sackers Gothic</a><br>
      Tom Ford: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/neue-helvetica" rel="nofollow">Helvetica Neue</a> Bold but this is not the <a class="freelinking external" href="http://www.tomford.com" rel="nofollow">official logo</a> which is also custom, somehow similar to <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a> and <a class="freelinking external" href="http://www.myfonts.com/search/avenir" rel="nofollow">Avenir</a>. You'll find more suggestions for alternatives in the <a href="/wiki/https%3A/%252Fwww.google.com/search%3Fhl%3Den%2526source%3Dhp%2526q%3Dsite%253Atypophile.com%2B%22tom%2Bford%22%2Blogo" class="freelinking" rel="nofollow">previous discussions</a>.</p>
