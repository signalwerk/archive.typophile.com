    <p>Hi all,</p>
    <p>I'm looking for the varied fonts in this poster series. I am trying to recreate them and have no idea who to come to to help ID them, but it seems this forum would provide useful help.</p>
    <p>Please if you could identify any of the following it would be greatly appreciated. All 5 of the posters can be found here: <a href="http://www.behance.net/Gallery/Battlestar-Galactica-Propaganda-Posters/495494" title="http://www.behance.net/Gallery/Battlestar-Galactica-Propaganda-Posters/495494">http://www.behance.net/Gallery/Battlestar-Galactica-Propaganda-Posters/4...</a></p>
    <p>Thanks!</p>
