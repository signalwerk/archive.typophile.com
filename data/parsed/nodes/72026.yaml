    html: |-
      <p>I've been trying to work around this problem. I don't know if there is a glitch in compatibility with Fontographer 5 (where I do my glyph creation/editing) and FontLab 5. I've found myself going back to Fog 4 to do some things. I had a really really strange crash with FontLab. I generated the font, which worked... but then the entire computer went black with only the mouse showing. I couldn't escape the program, nor go to other open aps on the computer. I had to do a manual shut down and then start the computer back up.</p>
      <p>Quick question... the new FOG 5 doesn't create bmap files for MAC PostScript. I had to go back to FOG 4 to generate the files I wanted to use. I'm not the most technically savvy person, so I'm not sure if I even NEED bmap files... but FontExplorer won't open a PostScript file without the bmap.</p>
      <p>This is complicated to get what I need/want.</p>
      <p>RL</p>
