    <p>I've been working on a new font family, using Fontographer (new version 5) to do the glyph editing (I'm more familiar with it and prefer it). I'm now ready to do OpenType programming of the fonts. I opened the fonts in FontLAB to do the final glyph alternates, etc. Before I begin with the programming, I decided to generate the fonts to test them before going further, There are two styles of Family-- Regular and Script. </p>
    <p>The Regular Style generates OTF just fine. But when I try to generate the Script style, FONTLAB crashes. Can anyone explain what I need to do to keep this from happening? The Script font is based on the Regular version, and I am guessing there is a naming/Font ID issue.</p>
    <p>I'm on a MAC OSX 10.5.8 using FL 5.0.4.</p>
