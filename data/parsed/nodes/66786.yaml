    <p>The idea behind this design was to use the WW2 aspect of 1939, but to also use something that i think would make the poster unique and in some ways original from all the other WW2 poster design out there, i wanted to use the battle of wuhan because as a designer i thought that the old japan flag during that era would be a tremendous design to bring to the poster, and give the poster a little something than just font and text, same for the american, nazi and soviet flags in the design aspect. </p>
    <p>1939, the beginning of World War 2, on the right side of the poster you will see the Japan flag with a summary of the aftermath of the wuhan battle, on the left side of that you will see the aftermath of World War 2 underneath the American Flag. Jumping out at you is the 1939 design in the central part of the poster which obviously declares the first year of the most deadliest human conflict in the history of the world. Underneath the WW2 font at the bottommost of the poster you will see the text is a brief summary of WW2.</p>
    <p>And finally on the leftmost side of the poster you will see the two streaks going up from the first w of the font, creating a perfect opportunity for me :) the designer to use it as a place to put the beginning and end date for the brutal war it was.</p>
    <p>Color choice for this was simple for me because i didn't want to use red or black because i dont want to people perceive the idea of violence that was indued in the war, however red was used slightly </p>
    <p><a href="http://www.flickr.com/photos/47008322@N03/4313222280/" title="http://www.flickr.com/photos/47008322@N03/4313222280/">http://www.flickr.com/photos/47008322@N03/4313222280/</a></p>
    <p>Thank You!</p>
