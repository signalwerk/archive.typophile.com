      <p>I might be going too deep here, so hold me back. But, I must be blunt, the poster is politically incorrect.</p>
      <p>Having the US flag next to the date year '1939' suggests that the US partook a role in the war since that time. The date for US involvement was actually from December 7th 1941. (<a href="http://en.wikipedia.org/wiki/Attack_on_Pearl_Harbor" title="http://en.wikipedia.org/wiki/Attack_on_Pearl_Harbor">http://en.wikipedia.org/wiki/Attack_on_Pearl_Harbor</a>).</p>
      <p>The references to Russia VS Germany is also incorrect. Both of these countries were allies (<a href="http://en.wikipedia.org/wiki/Invasion_of_Poland" title="http://en.wikipedia.org/wiki/Invasion_of_Poland">http://en.wikipedia.org/wiki/Invasion_of_Poland</a>).</p>
      <p>As for the design, please see anything on 'Vkhutemas' or 'Bauhaus' school of thought. Both schools had tremendous impact on propaganda in communist Russia and fascist Germany.</p>
      <p>Good climate overall.</p><div class="imageWrap"><img src="http://typophile.com/files/File-Artwork_by_El_Lissitzky_c1930_4019.jpeg"></div><p></p>
      <p>Russian Exhibition in Zurich - Poster by Eli Lissitzky.</p>
      <p>P.S. Violence during the war is not offensive, it is a fact. To disacknowledge it is offensive to those who suffered.</p>
