      <p>Biddy: You got the order wrong there. You have Jenson&gt;Minion&gt;Garamond.</p>
      <p>Making a distinction between display and body copy is very important because the purposes of both are different, like sport fishing and fishing for food. </p>
      <p>Display text is sport fishing. Catch and release. It's designed to catch the eye first, then release to the content. Body copy on the other hand is like fishing for food. You want that fish to catch on, and hold on, until you've reeled it in. You want them to read the content until the message has been communicated.</p>
      <p>So in that sense, is readability, as it concerns x-height, for display copy not as important as body copy? That's why you could get away with using Olive Antique as a headline, but never for body copy.</p>
    html_clean: |-
