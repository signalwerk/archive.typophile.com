      <p>Dave, Nick finds your post question-begging; I am just confused by it. You say that there is an x-height 'sweet spot' for reading comfort, but you also say that for readability "the [x] height may be immaterial". These seem to me to be saying opposite things.   </p>
      <p>Nick, I find your comments on ITC Garamond and on Newspaper type extremely interesting. </p>
      <p>One of the things that I have admired in metal Caslons is the way they could be set with relatively little leading, and form a lovely woven texture on the page.  </p>
      <p>You said wrote that this advantage of longer extenders is important in longer measures, such as in a book. But I am wondering whether the failure of ITC Garamond as a text type is more because of other features. </p>
      <p>Carl Crossgrove wrote in an interesting post in another thread that the problem with ITC Garamond is that it has a huge x-height suitable for a very small size, but the tight spacing, fine serifs and other details suitable for a display type. I'm wondering whether its problems in text aren't for these reasons. If Carl's analysis is correct, I would expect ITC Garamond also not to work in narrow columns for extended text. </p>
      <p>What do you think the other factors are, in addition to extender height, in making a type work for narrow columns on one hand, and broad columns on the other?</p>
      <p>My other question concerns the reducing of cap height that you pointed out in newspaper type. What is the advantage of it in your view? Have you followed this model in your own newspaper types?</p>
