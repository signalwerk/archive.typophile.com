      <p>There are two potential reasons to make caps stand out: to make it easier to pick out proper names when "scanning" (as opposed to reading) a text; and to give all-caps setting more punch (since the point of it is typically punch). Some aspects of these reasons are less relevant now, but most remain.</p>
      <p>One thing I'd like to know BTW is exactly why<br>
      Dan gave his new Morris Sans such dark caps.</p>
