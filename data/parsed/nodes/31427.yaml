      If it does, I might call that an "art brief" instead.</p>
      <p>&gt; What “control” do you prefer for comparing typefaces in text settings, Hrant?</p>
      <p>I think there are two dimensions at play: apparent-size vs. economy, and readability. The former can be controlled from one end or the other: you can equalize the apparent sizes (and apparent leadings) and see which uses up more space, or you can equalize the space used (while also minding the size/leading proportions) and see which one looks bigger. This dimension is basically about optimal legibility in the space. The latter dimension is more inexact and "unproven", but with a mature grasp of the mechanics of reading (including distinctions between deliberation and immersion, as well as optimal letterspacing) it's possible to do much better than just with the first dimension. For example a font with a very large x-height and very tight spacing will come out on top in the first dimension, but you can still say it's not good because the point size, reading environment, etc. are such that the extenders can play a greater role facilitating immersion, or because the spacing is so tight that notan is ruined, etc.</p>
      <p>Practically, I tend to do this when comparing two text faces: choose a target apparent size, often simply a sensical point size in one of the fonts; equalize the apparent sizes and minimum apparent leadings; observe the "mechanical" difference between economy; observe the "inexact" difference between vertical proportions, spacing, color, letterform divergence, etc. with the purpose of gauging "non-scalar" readability; and finally try to decide which face strikes a better balance between economy and readability.</p>
      <p>Seperate and equally important to this is the evaluation of which face has an atmosphere/mood more suitable to the subject, noting that often a face can sacrifice (sometimes, in fact preferably, quite consciously) apparent size, economy and/or readability for the sake of atmosphere (like how some glyphs in Patria are intentionally "too bulky").</p>
      <p>hhp</p>
