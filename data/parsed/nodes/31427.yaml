      <p>That graphic from deGregorio is probably the worst one in the series: to compare 2 designs with different x-heights, you don't want to scale one of them up; the apparent stem weight and serif weight are changed in his sample. Just having 2 faces with different x-heights doesn't compel you to set them the same size, with the same nominal leading. This simplistic conclusion ignores all the other factors we've been discussing. As Hrant points out, removing this from the context of a printed page voids the argument. </p>
      <p>Dan, I would say that it is specifically NOT helpful to "level out" the top half of the line of type. Once again, the ascenders and descenders perform a function in reading, and it is not insignificant. Some have argued that this effect proves the opposite, that descenders are less important.</p>
      <p>Why are people so eager to reduce this complex, interdependent process into some kind of flat, simplistic sound bite?</p>
