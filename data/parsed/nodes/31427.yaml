      <p>All the variables of typesetting/printing affect how comfortable a text is to read; not only x-height, leading, width, etc. but length of text, paper texture, ink coverage, ink color, contrast, show-through, measure, page size, etc. It is probably not worth making any generalizations (despite the constant demand for them) in this area. Within the actual typeface, I think the most important variables are these (for a general-use book face):</p>
      <p>Weight/color; is the type strong on the page, not thin and light?<br>
      Contrast: Not too high (Bodoni), not too low (Futura)<br>
      Default spacing: the sweet spot where the words knit together evenly and clearly and word spaces are "just right"<br>
      Clear, strong, differentiated character shapes; ambiguity is bad<br>
      Cap/lc/extender proportions: not aboslute numbers but a pleasing relationship</p>
      <p>Even with these variables optimized, there are the intangibles; is the type too showy, is there any movement or activity in it, or is it static, regular, dull? Some of the most comfortable, and I might even say inspiring, text faces out there have moderate x-height, low contrast or some other "flaw" but so much about them is ideal, we enjoy reading even chemistry textbooks set in them. Because of this, I think it's useless to pursue the discrete ingredients of readability. See Michael Pollan's recent articles on "nutrition" in the NYT for a parallel.</p>
