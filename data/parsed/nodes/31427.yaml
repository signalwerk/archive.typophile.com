      <p>Typographers aren't generally concerned about the issue of readability and x-height if they have some space to play with. So the statement should be taken to refer to the situation where there is copy-fitting pressure to squeeze a lot of words into a layout and not have the text look too small to read, especially to boomers and older. </p>
      <p>So in that sense, I think Stefan is pushing it a bit, and in fact has things backwards.<br>
      Many of the traditional book faces, such as Bembo, have small x-heights.<br>
      And of all the Garamonds, the one with the biggest x-height (ITC) is least suitable for book work.</p>
      <p>The reason is that books have a wide measure, and therefore need generous leading between lines. A large x-height face looks dull and flat in that kind of layout, like a lot of horizontal bars. You need the play of extenders to enliven the page.</p>
