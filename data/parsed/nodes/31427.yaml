  html: |-
    <p>Someone explain this to me:<br>
    Everywhere I look, people declare that typefaces with large <a href="/wiki/x-height" class="freelinking" rel="nofollow">x-heights</a> are more <a href="/wiki/readability" class="freelinking" rel="nofollow">readable</a> than something with small x-heights. For instance, many people don't like <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> for body copy because of the long ascenders/low x-height (aside from the sans/serif debate). They say it breaks up the color too much. Same thing for other typefaces with low x-heights like Venetians.</p>
    <p>But that doesn't make sense to me. Presumably, the larger x-height makes the letters appear larger. But that means that you need to increase the leading proportionately to compensate. If you used a typeface with a low x-height at a larger point size, wouldn't you basically have the same results?</p>
  html_clean: |-
    <p>Someone explain this to me:<br>
    Everywhere I look, people declare that typefaces with large <a href="/wiki/x-height" class="freelinking link-lost" rel="nofollow">x-heights</a> are more <a href="/wiki/readability" class="freelinking link-lost" rel="nofollow">readable</a> than something with small x-heights. For instance, many people don't like <a href="/wiki/Futura" class="freelinking link-lost" rel="nofollow">Futura</a> for body copy because of the long ascenders/low x-height (aside from the sans/serif debate). They say it breaks up the color too much. Same thing for other typefaces with low x-heights like Venetians.</p>
    <p>But that doesn't make sense to me. Presumably, the larger x-height makes the letters appear larger. But that means that you need to increase the leading proportionately to compensate. If you used a typeface with a low x-height at a larger point size, wouldn't you basically have the same results?</p>
