    html: |-
      <p><em>monumental</em></p>
      <p>Nice term.</p>
      <p>For news text trends, note that the first of Linotype's "Legibility" faces of the 1920s, Ionic, has a massive x-height -- proportions of a micro-type, blown up.<br>
      It also has caps with much bolder stems than its lower case, which was traditional and customary. I believe that it was the application of kerning tables to text setting in the early 1970s phototype, and the tight look that infatuated typographers for a couple of decades, that prompted the abandonment of monumental capital proportions, and the move to more similar stem weight between the cases -- the terrible grayness of photoset text. During the digital era, the balance is somewhere between metal and photo era.</p>
