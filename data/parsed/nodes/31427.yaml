      <p>Nearly non sequiter: Actually, it was the character Sportin' Life, a drug dealer, expressing his doubt about statements in the Bible in the song "It Ain't Necessarily So"—in the opera Porgy and Bess.</p>
      <p>Remember the vogue in the early 70s when ITC blew up the x-heights of fonts, creating such monstrosities as ITC Garamond, where the counters were so wide as to confuse letterspace with counter, strokes mashing into each other, impeding legibility. As well expressed here by others, legibility and spatial efficiency are controlled by a variety of variables.</p>
