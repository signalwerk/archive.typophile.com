      <p>William,</p>
      <p>I had a lot of trouble with ITC Garamond as a text face in the 1980s, photoset, it was too fine and fell to pieces easily during production. So I concur with your comment about its fine-ness being problematic. The same thing with Galliard. However, ITC Garamond was great in heads, and for that genre of 1980s ad with 18/16 pt text type wrapped round a close-cropped image. (Yes, it is possible to reverse-lead ITC Garamond! -- although my favorite for that kind of setting was ITC Berkeley).</p>
      <p>It's also the weight of capitals that has been reduced in news text type, as well as their height. </p>
      <p>In general, I think that solid leading has become unacceptable, across the board. It used to be a quite legitimate setting style (Morison's "Principles" was set solid in a large Bembo), but no more. Perhaps we can put the blame on Microsoft, and the 20% leading default of word processors, which, now that everyone with a computer is a typesetter, has become the norm.</p>
      <p>Also, now that designers have become typesetters, and are not a s skilled as the pros of yore, an easy way to make your text type look upscale, professional and artful, is to lead it copiously.</p>
