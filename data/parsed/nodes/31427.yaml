      <p>Interesting post, Carl. </p>
      <p>&gt;Weight/color; is the type strong on the page, not thin and light</p>
      <p>I would just add that type can be too black as well. Hitting the middle, sweet spot is the goal--and that as you say relies on the printing process as well as the type. </p>
      <p>&gt;not aboslute numbers but a pleasing relationship</p>
      <p>In this context, Walter Tracy's comment (Letters of Credit p. 51) is worth noting: </p>
      <p>"For my own taste, if x to h is a proportion of about six to ten a face will look refined and be pleasant to read. If the x height is much less than that the face may be stylish but will be unsuitable for a long text. A larger x-height conduces to dullness."</p>
      <p>The only qualifier I would add that is that for small point sizes, greater x-heights seem to be an advantage for readability.</p>
