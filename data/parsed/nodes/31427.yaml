      <p>"...I began by getting myself a fount of Roman type. And here what I wanted was letter pure in form; severe, without needless excrescences; solid, without the thickening and thinning of the line, which is the essential fault of the ordinary modern type, and which makes it difficult to read; and not compressed laterally, as all later type has grown to be owing to commercial exigencies."</p>
      <p>Aims in founding the Kelmscott Press, William Morris, 1895</p>
      <p>Interesting how the original post asked only about readability, but economy immediately crept into the discussion.</p>
      <p>In academic textbook publishing, "economy" tilts the other way. Publishers are desperate to produce a physical object that appears worthy of a $125 price tag, with no regard for the future back health of students slinging bookbags over one shoulder. Considerably down-market, technical how-to guides e.g. "Make Windows Sing" are bought by the word, sold by the pound. Economy in the sense discussed here isn't at issue.</p>
      <p>If one designs without concern for economy, there's an optimal size and leading that shows each font at its best. Then, and only then, one can ask which font provides the most comfortable long-term reading. I'd say the x-height sweet spot is clearly somewhere in the middle. For example, Lucida Bright is often used in top-drawer technical guides, but to my tastes its x-height is too large.</p>
      <p>To me, a small x-height font like Bernhard Modern screams "I'm upper crust!" I can't get past that, I wouldn't want it on anything but a concert invitation. Yet, it's surprisingly readable. Go figure.</p>
      <p>Remember that much of the world does just fine reading arabic, which at first glance looks like a flatlining EKG, with barely any x-height at all.</p>
      <p>I'd say that what goes on within the x-height strip determines much of readability. The height of that strip may be largely immaterial.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Concert_3827.jpg"></div><p></p>
