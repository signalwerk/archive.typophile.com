      <p>There are some basic things that come into play for the person designing the document and choosing the face. The text is of a finite length and pages need be added in multiples of 4. With that as a background, I can't imagine making a decision without the copyfitting component considered. You can call this some degree of efficiency and this may be of greater or lesser importance depending on the job. Newspapers pack it in much more than fine books. Fore me, it is about finding the best range of "sweet-spot" combinations in a given type and applying those to the copyfitting needs. If a given font you may choose first does not copyfit well within the respectable sweetspot range for that job, you need look mfor another typeface. For me sweetspot takes in all the variables including the character of the writing to be typeset along with the typical parameters of xheight,leading, line width, etc..<br>
      The job does not end at the microcosmos of the typeface, it takes water to float a boat, wind to move the sails, and navigation to get you to your destination.</p>
      <p>ChrisL</p>
