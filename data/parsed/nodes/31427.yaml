    html: |-
      <p>[Edit:This was cross-posted with Nick &amp; Hrant's interesting observations.]</p>
      <p>I am also interested in the relationship of readability and economy in type design. </p>
      <p>With a larger x-height, you will generally get higher legibility at smaller sizes. However, from what I've learned so far the x-height is is only one of a number of interrelated factors, and that in fact determining what is the best 'value' in terms of the combination of readability and economy is quite complex. </p>
      <p>If you normalize two faces so that their x-heights are the same on the paper, you will find the following make a difference to the readability-economy issue. </p>
      <p>1. Set width.<br>
      The length of a lower case alphabet in different fonts will be very different, even when their x-height are made the same. Eg. Baskerville is wider than Times New Roman. The narrower font would be more economical, other things being equal (which they never are). </p>
      <p>2. Ascenders and Descenders.<br>
      If you use less leading, you can get more letters on the page. The length of the ascenders and descenders will limit how tightly you can lead, as Stephen notes above. However there are other factors that also affect how tightly you can lead with good readability so this may not in fact be an advantage.  </p>
      <p>3. Darkness of the typeface. I just learned this from Mitchell &amp; Wightman's 'Book Typography'. They compare Quadraat, a dark face with a relatively large x-height and Spectrum, a light face with a relatively smaller x-height. Quadraat requires more leading to look not excessively dark on the page, and Spectrum needs to be relatively tightly leaded not to look too light. In their illustration 11/15 Quadraat and 12/14 Spectrum are about equally readable, and Spectrum ends up being more economical, even though it has a smaller-x-height.</p>
      <p>4. Optical Size. What makes this issue particularly tricky is that  the trade-offs are different at different optical sizes. For example, if you go down to 9 point, probably Spectrum will be not very readable, and Quadraat will shine. </p>
      <p>In general my feeling is that at smaller text sizes, large x-height becomes a distinct advantage, but at larger text sizes, it can be even a disadvantage. And then at display sizes it can even reverse again. So in fact this issue is really complicated. </p>
      <p>I haven't even mentioned letter spacing and sans-serifs, both of which add more wrinkles.      </p>
      <p>I would be interested in the observations and experience of others in handling this readability-economy issue.</p>
