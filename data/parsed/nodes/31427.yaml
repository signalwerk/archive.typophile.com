      <p>I only have a few observations to add to this fascinating discussion. As usual, largely those of a reader of books.</p>
      <p>My basic point, I think, is that so far as I can see <em>all</em> generalizations about readability are suspect. So much depends on the context: what measure something is set at, how it is printed, what sort of type the reader of that sort of work is used to seeing, how the book is printed. Take even ITC Garamond. Quite close to universally loathed, the acme of unreadability. But I remember having to spend quite a lot of time with the computer books published by O'Reilly, which were set in ITC Garamond, and I don't recall them as unreadable at all. For their purpose, given the overall design and the way you read that sort of book, they worked very well.</p>
      <p>So generalizations are suspect. But, having said that, let me offer one of my own. For extended reading most types that are in any way <em>extreme</em> tend to be difficult. Maybe that's because they are obtrusive. Maybe it's for some other reason. For that reason I would be suspect of statements like "larger" (or "smaller") X for greater readability ... because I would tend to think that "very average" X was likely to make, in general, for good readibility, allowing for a fairly wide variation. (This applies not just to x-height but to other features too: "very dark for good readability", "very light for good readability", "very low cap height for good readability" etc etc: all suspect.)</p>
      <p>And finally, on the topic of economy, I do think that one tends to find that a saving in one area tends to mean a loss in another. In general (I don't say always), large x-height tends to want more leading, so that the fact you can set in a small nominal point-size does not save so much space as you might at first hope. And compressed type means you can fit more letters in the line, but again tends to call for slightly more leading (or a shorter line) to prevent doubling, etc etc. From that point of view I suspect that large x-height types are most useful from the point of view of economy where neither readability over an extended period nor beauty is really a concern, but where cramming in matters. In other words, where one's concern is not so much <em>readability</em>, at least over any extended period, so much as <em>legibility</em> (e.g. dictionaries, tables, . For "classic" book-width type intended for extended reading, I suspect that large x-height letters are no great advantage.</p>
      <p>And I think they're ugly ... but maybe that's just me.</p>
