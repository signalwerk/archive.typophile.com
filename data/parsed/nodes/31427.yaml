      <p>It is quite difficult to fairly compare readability using x-height variables without the economy issue as part of the equation. Type is never set in a vacuum. there are always other factors which determine the range of useable possibilities. The old  "X-height uber alis" days of ITC proved that Porgy was right, "it ain't necessarily so".  You have to factor in usage and objective along with the physical determinates such as line length, leading, cap height, and so on. Better to query, what am I asking this setting of type to do, and seeing if it succeeds at that than to pluck one factor out and give it holy grail status.</p>
      <p>ChrisL</p>
