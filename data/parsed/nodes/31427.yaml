      <p>&gt; That’s very important for news text.</p>
      <p>I would say that the rough-and-tumble nature of newspaper reading<br>
      makes collisions more tolerable than in book typography for example.</p>
      <p>&gt; adjusted to equalize x-height.</p>
      <p>That's not a good way to do it, because:</p>
      <p>&gt; Nimrod, widely regarded as one of the best faces for immersive<br>
      &gt; reading in newspapers, has quite similar proportions to the<br>
      &gt; much derided ITC Garamond</p>
      <p>Only if you ignore half the Cartesian space. In the horizontal dimension the two are different in two huge ways: width, and spacing. Nimrod is narrower, and looser. Taking into account both dimensions prevents the comparison of fonts by a simple equalization of the x-heights; the only real way to do it is to equalize apparent sizes. For better of worse this cannot be done numerically - it has to be eyeballed - but anyway that should appeal to you, no?  :-)</p>
      <p>In fact many of us have long said that ITC Garamond (preferably a demi weight) could be used for small sizes... if it were spaced much looser. In fact smaller sizes than Nimrod, considering its massive width. It's a cornerstone of type design than all of a font's attributes have to be balanced with each other to yield a serviceable whole: a huge x-height can only work for text (and only small text) if the color is darkish, and the spacing is loose. Mrs Eaves is arguably the most prominent case of that balance thrown off: the x-height is small, which makes it ideal for somewhat large text, but the color is ideal for typical text sizes, and most of all the spacing (beside being bad - different story) is way loose, which is ideal for small sizes! The Next that we really need is Mrs Eaves, since otherwise it's such a beautiful design. Maybe call it Mr Richard.  ;-)</p>
      <p>It's tempting to think that a simple tracking adjustment in the layout app can usually correct for such an imbalance (assuming an adequate gradation of weights) but spacing boundary conditions (such as the right side of the "r") make that a half-baked solution.</p>
      <p>hhp</p>
