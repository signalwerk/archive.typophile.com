      <p>It seems we're veering in two different directions:</p>
      <p>1) X-heights for display type and<br>
      2) X-heights for extended passages of text</p>
      <p>Both I think are quite different. While I don't have as much experience as Nick (or other Typophiles) would have in this, I do know that the context for reading a headline and reading copy are very different. The headline is "scanned" more than it is read. I'm of the opinion that a "lighter" face is more difficult to read (or should I say absorb) than a darker headline display face. The eye would tend to focus more on the white space the text creates than the actual words.</p>
      <p>Carl pointed this out earlier as well...it is difficult to discuss this without discussing some of the other variables in the equation. Such as some necessities for newspaper design. For one, column widths are an important factor to consider. While this might not increase legibilty, a condensed face (at least slightly condensed with reasonably short descenders) might be ideal for narrow column widths.</p>
      <p>If you look at Nick's example, you can see that his face is certainly more condensed than that of ITC Garamond. Now for text faces...short descenders and condensed faces tend to be more difficult to read.</p>
      <p>I love Fedra Serif and Lexicon for example, but I actually think the versions with shorter ascenders and descenders are more difficult to read. The larger x-height (at least to my eyes) actually looks and feels wrong. I'm not quite the scholar that many others on Typophile are, but I know Minion Pro is much easier on the eyes than Jenson Pro. Ripping off Nick :) here's an example of Adobe Jenson Pro, Minion Pro, and Adobe Garamond Pro all Roman weights. </p><div class="imageWrap"><img src="http://typophile.com/files/text_samples_6258.gif"></div><br>
      Holy crap! Look at that x-height on Jenson Pro! Minion has a significantly larger x-height, and Garamond's width makes up for that x-height deficiency. Jenson doesn't work for me when I read text. Howeva...I do know someone who has vision problems who loves Jenson Pro. My theory is that while Minion or Garamond might be sweet for people with normal vision (because we look for letter familiarity) Jenson might work better for my friend because the character (personality/quirkiness) of the individual letters might aid in her letter recognition. <p></p>
      <p>I have no theories or research to back any of my opinions up— I just know what works for me when I read.</p>
