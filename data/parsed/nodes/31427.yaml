      <p><em>Is there a general trend for less extreme shortening of ascenders and caps in Newspapers?</em></p>
      <p>I doubt it, given the pervasive down-sizing.<br>
      I've just finished a new text face for one such redesign; we went from 9 on 10 to 9 on 9.5, which preserved the word count despite the smaller page size.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Thespy_4889.png"></div><br>
      Stems are 98 (caps) and 92 (lc).<br>
      By having the join with the main stem in h etc. cut down straightish, rather than spring out as a curve, this makes the ascender look tall, as, I think, does the difference in cap and ascender height, keeping air in the setting, despite tight leading. There are some quite light strokes in there, and the much improved (less gain) printing of newspapers today also allows for a compact setting, without an overly heavy overall effect.<p></p>
