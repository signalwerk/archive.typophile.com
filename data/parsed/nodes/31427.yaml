      <p>An interesting side issue is the question of what distance the x-height is compared to: ascender, descender, cap, or em.</p>
      <p>The trend in news faces, since Olympian, really, has been to differentiate the cap and ascender height, reaching the present extreme in faces such as H&amp;FJ's Mercury, in which the x-height is small-to-average in relation to the ascenders, but large in relation to the caps.</p>
      <p>But context is crucial, newspapers and books are poles apart.</p>
