      <p>I'm not sure where the theory leads: from my perspective, I work against the copyfitting benchmark of other news faces, and really have to see a press proof on newsprint to decide. At the begining of this project, for research I set the same piece of text to the same column depth, with the same 10 pt leading, in a variety of text faces. The sizes worked out as follows:</p>
      <p>9.0 Utopia<br>
      9.4 Mercury<br>
      8.4 Nimrod<br>
      8.9 Worldwide<br>
      9.3 Charter<br>
      9.0 Farnham<br>
      9.6 Freight</p>
      <p>Really, I think all these faces are excellent for news text, and the differences in their x-heights don't have much of a bearing. The key factor, IMO, is descender length. That's why Freight is the least flexible for the genre, as with its generous descenders it may require more leading. </p>
      <p>I don't think cap height plays too much of role: Nimrod has ascender height caps, whereas Mercury's are much shorter. But in absolute value, they come out much closer due to the 9.4 vs 8.4 difference, and if Mercury's caps are still shorter, they have ample width. </p>
      <p>**</p>
      <p>Looking at the typical big-x-height ITC faces such as ITC Garamond and ITC Cheltenham, they appear stunted because (a) we are familiar with the originals, and (b) they have relatively long descenders, so the action in the x-height -to-cap region appears relatively crammed. In absolute terms, they are not much different in proportion from the above news faces, except for their "long" descenders. They are similar in proportion to Frutiger and Helvetica, too!</p>
      <p>The really extreme "70s" faces are Usherwood, Eras and Antique Olive ('60s).</p>
      <p>**</p>
      <p>So to return to the original question, I think the comparison is really between three categories:<br>
      - Classic book faces with quite small x-heights and generous proportions all round<br>
      - Standard proportioned faces<br>
      - Extreme 60s/70s faces -- noting that the "chopped" ITC versions of the classics may actually have standard proportions.</p>
      <p>Wasn't there an article in SOTA's "Interrobang" about a system of nomenclature for this?</p>
