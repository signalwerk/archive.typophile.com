      <p>Hrant, you're right it's not just the x-height.</p>
      <p>Equalizing x-heights is just a convenient method I've often used for comparing different text typefaces.</p>
      <p>Another way is modifying point size to get them close to fitting a similar amount of copy, which is the experiment I described further above -- so what I could do for the comparative "I_thorn" diagram is to scale them according to the size ratios revealed in that test. Or maybe not--that's a bit too much maths right now.</p>
      <p>There is a similarity in both comparison techniques, as larger x-heights take up more space, but as you point out, they're not the same.</p>
      <p>So, there are three potential "controls" for comparing the differences in typographic quality between typefaces, in blocks of text:<br>
      1. Same point size<br>
      2. Same copy-fitting rate<br>
      3. Same x-height</p>
      <p>Another way would be totally subjective -- to just pick the best setting for each typeface with no measurable commonalities. Nothing wrong with that.</p>
      <p>What "control" do you prefer for comparing typefaces in text settings, Hrant?</p>
      <p><em>BTW, according to you all reading is immersive anyway, right?</em></p>
      <p>Yes. </p>
      <p><em>Am I correct in assuming that you believe that the ideal vertical proportions for a news face for example are strictly a result of habit and culture?</em></p>
      <p>Speaking as a type designer, I'd say that the ideal proportions for a particular typeface emerge during its design, so yes, that is culturally specific. </p>
      <p>As a typographer, I'd say that the design of the whole document informs the proportions of the typeface specified. The cultural circumstances surrounding the document, from the start, inform the design and typography. There's some feedback from the face along the way.</p>
