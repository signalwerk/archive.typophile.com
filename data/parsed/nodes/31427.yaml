      <p>&gt; the differences in their x-heights don’t have much of<br>
      &gt; a bearing. The key factor, IMO, is descender length.</p>
      <p>This is focusing too much on avoiding collisions between lines, which, in a properly designed face, is taken care of via the talus (internal leading)... assuming no negative leading! In reality: x-height, ascenders and descenders are best seen as one thing; and the x-height in fact has the most bearing on readability, although ignoring the rest is exactly what makes the 70s ITC junk so unpalatable.</p>
      <p>&gt; They are similar in proportion to Frutiger and Helvetica, too!</p>
      <p>Which is one reason those two are also useless for immersive reading, the other main reason being lack of serifs, plus in Helvetica's case overly tight spacing.</p>
      <p>hhp</p>
