      <p>Here's an interesting insight from <a href="http://jyanet.com/cap/003-2.htm" rel="nofollow">Jean-François Porchez</a> regarding the design of his Le Monde typefaces:</p>
      <p>"He had researched newspapers and their use of type, from The Times to Le Midi Libre and the current Le Monde. He found that the print in Le Monde - composed in Times New Roman, which The Times of London itself abandoned in 1971 - was less than ideal compared to the other papers'. The types used nowadays had greater x-heights and smaller capitals and ascenders. Because little of the text is set in capitals, there was no need to make them monumental as Stanley Morison's committee had done for Times New Roman in 1931."</p>
    html_clean: |-
