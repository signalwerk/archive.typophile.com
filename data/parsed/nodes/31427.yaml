      <p>Just a note on "economy." I don't know web presses that well; I've always assumed the paper cost on them to be higher. Anyway, on a sheet-feed press, you buy a sheet. Depending on the size of the sheet &amp; the book trim, you'll get 16- or 32- or even 64-page signatures. Paper isn't the only cost of course, so it may turn out that even with the charge for canceling 16 pages, printing, say, four 32s and a 16 is less than five 32s. But four 32, a 16, an 8 and a 4 is more expensive.</p>
      <p>If a chapter begins a new page, the facing page (usually the last page of the previous chapter can run 5 lines long or full dept. If you are setting 38 lines per page and you want to know the "savings" for running 39 lines, you would need the chapter to be at least 38 pages long to be sure of saving a page. You <cite>might</cite> save a page with just a five-page chapter (or 4, if you'll run pages long), but it would be rare. If you don't save a page, you won't certainly won't save any money. And sometimes saving a page can cost you money (that extra 8- or 4-page signature).</p>
      <p>Anyway, the point is that a lot of those people who feel type should be set smaller &amp; leading tighter for economic reasons don't know how printing is paid for.</p>
      <p>As far a <cite>legibility</cite> goes, that too is problematical. When my mother was in her late 70s, large-print books began to come out. They were far easier for her to read. Does that make them more legible, or just more legible for a specific audience?</p>
      <p>I'm afraid I have to agree with Nick: Given a certain typeface at a certain size, there will be a word-spacing, leading and margin parameters that will just "click." Sometimes this is dependent on the text to boot (that influences how many word spaces occur in an average line).</p>
