    <p>Not trying to clutter the forums with type sightings, but I couldn't pass this one up. The cover of <a href="http://www.dominomag.com/" rel="nofollow">Domino Magazine</a> features the apartment of a shoe designer, and check out what's right over her fireplace and essentially front and center on the mag's cover: a Village Type 'For Like Ever' poster. All you TypeCon '05 attendees are now even hipper...or something.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/domino_village_3565.jpg"></div><p></p>
    <p>Ah, I see that <a href="http://www.vllg.com/products/Village/Villageposter_limited/" rel="nofollow">Village has taken notice, as well</a>.</p>
