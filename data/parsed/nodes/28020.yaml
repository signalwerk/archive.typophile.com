    html: |-
      <p>we village members got this email yesterday from t &amp; c:</p>
      <p><em>Well friends, we find ourselves on the receiving end of a great deal of attention thanks to “Domino” magazine. <a href="http://www.dominomag.com/" title="http://www.dominomag.com/">http://www.dominomag.com/</a></em></p>
      <p>For those unfamiliar with Domino, it is a homewares magazine which is quite popular, and has a large and devoted readership. In the September issue of the magazine our launch poster was shown in the apartment of rising star fashion designer Jessie Randall.</p>
      <p>As a result of this appearance there has been a veritable flood of orders for the poster. We had to go back on-press twice with the “For Like Ever” graphic in order to satisfy the demand. (While we were at it, we decided to go for super-high production values, and had the poster silkscreened on heavy archival stock.)</p>
      <p>So, the month of August was pretty much 90% poster-rolling and mailing tube stuffing, taping, and labeling. We got a postage meter and filled our little apartment with big boxes of mailing tubes.</p>
      <p>We thought that you’d be amused and/or interested. And some of you might have wondered why we’ve been so quiet lately. It was because we were up to our eyeballs with posters and mailing tubes.</p>
      <p>With best wishes for a great autumn from us,<br>
      Tracy &amp; chester</p>
