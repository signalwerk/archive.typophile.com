      <div class="comment-spam-body"><p>Georgia, designed by Mathew Carter, is about as close as Times New Roman and is lower contrast. It would work for the subtitles -- as shown in the top example -- and would be fairly easy to read if it was made thicker by use of a parallel lines technique -- as shown in the second example.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/GeorgiaWithParallelToBolden_3590.jpg"></div><br>
      Don<p></p>
      </div>
