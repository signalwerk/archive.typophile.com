      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TimesNewRomanInUse_5175.jpg"></div><br>
      Letterforms are similar to Times New Roman but for subtitles to work you should have a lower contrast and a thicker outline.<br>
      This is what Times NR would look like if it was made thicker by use of a parallel lines technique.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/TimesWithParallelToBolden_4680.jpg"></div><br>
      Or you could forget about matching the letter-forms with a font available in the early 1970s and look for a low contrast serifed font that would be thick enough to be easy to read on screen.<br>
      Don<p></p>
