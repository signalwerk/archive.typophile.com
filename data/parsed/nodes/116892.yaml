    <p>Hi there!</p>
    <p>This might be a bit of a toughy, since it's so old. This is from theatrical subtitles used on a movie from 1979. I'm actually working on the re-release of this movie, and we're including a restoration of these subtitles as an optional subtitle track so people can experience the movie the way it was first screened in America. While it's not 100% necessary to find the exact font, something really close to this would be nice for when we author the DVD to make it more authentic. So please don't hold back if you only have something similar but not exact!</p>
