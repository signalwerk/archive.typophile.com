  html: |-
    <p>Quick question from a newbie:</p>
    <p>Say I have a button that's 50 px tall.</p>
    <p>When vertically aligning text within a button what's the proper top and bottom padding?</p>
    <p>Should<br>
    distance from top button edge to Cap height = distance from bottom button edge to baseline?</p>
    <p>Or does it make sense to add 1-2 pixels on the bottom since centered text appears lower?</p>
    <p>Assume a 37px tall button with 12px Arial.</p>
    <p>or should some other measure be used to vertically center it?</p>
