      <p>Some great suggestions already! </p>
      <p>If you like the newer versions of the traditional gothics, you might like <a class="freelinking external" href="http://www.fontbureau.com/fonts/BentonSans " rel="nofollow"> Benton Sans</a>. It has compressed and condensed and with the black styles it can be quite masculine.</p>
      <p><a class="freelinking external" href="http://www.fontbureau.com/fonts/Antenna " rel="nofollow"> Antenna </a> could also do the trick. It's a Cyrus Highsmith font from 2007 and it seems to be the font of the moment showing up in more and more magazines every day. But if you don't like Interstate you might think this has some "ugly shapes" too.</p>
