    html: |-
      <p>Hard to fix on 70s style - annoying, cause the 70s were very diverse... How about these?<br>
      Magnifico (Daytime &amp; Nighttime),<br>
      Samarin (contour caps)<br>
      Soul Mama (ditto)<br>
      Vectroid &amp; Cosmo (stripey caps)<br>
      Static<br>
      Wavee Weekend (contour script, a logo in itself)<br>
      Tomato (wide, with alts and ligatures)<br>
      Django (decorated)</p>
      <p>These were not necessarily DESIGNED in the 70s - the vibe, though...</p>
