    html: '<p>What you read is just plain wrong. The relationship of a baseline to the bottom of the em as well as to the top is fairly arbitrary as different fonts have different stuff under the baseline. What you need to do is research how the vertical metrics of fonts work. Start with: <a href="http://kltf.de/downloads/FontMetrics-kltf.pdf" title="http://kltf.de/downloads/FontMetrics-kltf.pdf">http://kltf.de/downloads/FontMetrics-kltf.pdf</a></p>'
