      <p>The Bad News:<br>
      Fonts comes in 1000 point, and also in 2000 point, or 2048 points, or whatever the designer of each fonts has chosen.<br>
      Think of it as if JPG images comes in 72 dpi, 300 dpi or whatever "resolution".</p>
      <p>The Descenders, baseline, x-height, caps height, and ascender height can be chosen at will by the font designer within the font "resolution".<br>
      So, there is no standard on that.</p>
      <p>The Good News:<br>
      You can read those values out of the font meta-data and adjust at your will.<br>
      Modern browser do something similar via the CSS property called "font-size-adjust"<br>
      <a href="http://www.w3.org/TR/css3-fonts/#font-size-adjust" title="http://www.w3.org/TR/css3-fonts/#font-size-adjust">http://www.w3.org/TR/css3-fonts/#font-size-adjust</a><br>
      <a href="http://emdpi.com/cssfontsizeadjust.html" title="http://emdpi.com/cssfontsizeadjust.html">http://emdpi.com/cssfontsizeadjust.html</a></p>
      <p>Hope it helps!<br>
      Good Luck</p>
