    <p><strong>Fountain – A Conversation With [Ep.1]: Göran Söderström</strong></p>
    <p>The first in a series of portraits, made for the Swedish type foundry Fountain, to showcase its type designers.</p>
    <p>In March 2010 we packed our gear, and flew up to Stockholm to have a conversation with Göran about his typefaces and his thoughts on type design.</p>
