    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Trypillya_2D_720x360_00_3875.png"></div><p></p>
    <p>This ornamental font is the interpretation of ornaments of Trypillya culture. Trypillya culture, or Cucuteni-Trypillya is an archaeological culture of neolithic times. Its name derives from the name of the village of Trypillya nearby Kyiv. This culture experienced its culmination between 5500 and 2750 BC. The Trypillians lived in the territories between the Carpathian Mountains and the Dniper River of the modern Ukraine, Moldova and Romania.</p>
    <p>Many interesting ceramics decorated with original geometric ornaments survived to amaze us. Its heritage is still a little unknown to the public and therefore the patterns that are reproduced in this font have no analogues in the digital format.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Trypillya_2D_720x360_02_4346.png"></div><p></p>
