  html: <p>The font shop at <a href="http://www.kennmunk.com" target="_top">http://www.kennmunk.com</a> is now open. <br>At the moment you can buy his fonts Acetone and Contamination (dingbat system) for PC and Mac and the 9 pixel Linemap for Mac, but more, mainly experimental, fonts will come. Next up is Linemap for the PC and 'Arkudius' which is loosely based on sanskrit and segments of circles.  <br>Free fonts and dingbats are still available for download. <br>There is still the problem of making digital coffee, as the shop is of the kind that has comfy chairs for the customers.</p>
  html_clean: <p>The font shop at <a href="http://www.kennmunk.com" target="_top" class="link-external">http://www.kennmunk.com</a> is now open. <br>At the moment you can buy his fonts Acetone and Contamination (dingbat system) for PC and Mac and the 9 pixel Linemap for Mac, but more, mainly experimental, fonts will come. Next up is Linemap for the PC and 'Arkudius' which is loosely based on sanskrit and segments of circles.  <br>Free fonts and dingbats are still available for download. <br>There is still the problem of making digital coffee, as the shop is of the kind that has comfy chairs for the customers.</p>
