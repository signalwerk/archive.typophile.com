    <p>Wanted to let everyone know that I just started up a new micro foundry with Matthew Desmond, Associated Typographics. We only have one typeface right now, Ramsey which should be worth a look. We have also been working on a lot of custom work as well. Attached a screenshot of the site and thanks for looking Typophiles. </p>
