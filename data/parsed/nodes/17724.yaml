    <p>Hi, I'm trying to find an equivalent for the font used in this (attached) silent movie title card. And, ii the context of a wider search, would anyone know of the fonts used in title cards (I guess, that most of these where hand drawn)?</p>
    <p>Like in the other cards:<br>
