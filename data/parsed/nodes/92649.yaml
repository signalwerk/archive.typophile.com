    <p>We have a long-time customer that is aiming to expand their format designs for their classical literature series. They have one design that works well, using Garamond Premier Pro. Minion would work for the same reason, but I'm curious about having a Venetian -- say Bembo Book or Espinosa Nova -- available. Not just any Venetian, but one with thick enough fine lines to print well offset, with current workflows.</p>
    <p>Problem is, I can't find a Greek that I think mates well. I tried Carter's Wilson Greek, but no joy. Please don't say Porson -- it does work, but Porson's capital-lower-case sizing is a nightmare.  Anyway, Porson ... see below.</p>
    <p>A second issue is that it would be nice to have a Greek family with both a "roman" and an "italic/inclined." Not exactly the way Greek fonts are often packaged, but the presence of a bibliography in a book, with modern source material published in Greece, makes the need for a "roman" and "italic" or "inclined" very desireable.</p>
    <p>Any thoughts?</p>
    <p>TIA, </p>
    <p>charles</p>
