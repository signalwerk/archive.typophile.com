    html: <p>I suppose you've already considered Arno Pro. GFS Neohellenic has both upright and inclined styles. I'm not so sure it could be said to pair well with something like Bembo, but historically it's based on pre-Aldine Venetian Greek type. GFS Complutum is perhaps a nicer example of the style, but it doesn't have an inclined.</p>
