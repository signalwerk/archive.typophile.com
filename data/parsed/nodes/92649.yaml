      <p>The antithesis of Venetian, but my <a href="http://www.myfonts.com/fonts/shinn/scotch-modern/" rel="nofollow">Scotch Modern</a> does have a proper italic (i.e. one with a different construction to the roman, not merely slanted). Its Greek italic also has a different construction than the Latin italic†, which provides useful contrast in settings such as this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Greek1_5628.jpg"></div><br>
      Scotch Modern has a Micro size, suitable for footnotes, and all features (small caps, polytonic, swash, alternates, &amp;c.) are available in all scripts, weights and optical sizes.<p></p>
      <blockquote><p>†The idea being that italic is inherently cursive in nature, with cursivity being represented in the Latin italic by pothook serifs, and in the Greek italic by the traditional Greek organic/chirographic look with its irregular Baroque stress (Bringhurst’s terminology).</p></blockquote>
