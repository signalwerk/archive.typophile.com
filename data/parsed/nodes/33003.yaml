      <p>I wonder whether this is not a v, but a lowercase Greek <em>nu</em>?  It could be that the original page was set from a Greek or mathematics font, not from from a Latin font.  That would explain the different f, too.  Maybe the distinctions were lost over time.</p>
      <p>I found a <a href="http://en.wikipedia.org/wiki/Nu_%28letter%29" rel="nofollow">Wikipedia page for nu</a>, and a a <a href="http://www.fileformat.info/info/unicode/char/03bd/index.htm" rel="nofollow">Unicode specification</a>.</p>
      <p>--John</p>
