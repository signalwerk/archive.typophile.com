      <p><em>I wonder whether this is not a v, but a lowercase Greek nu?</em></p>
      <p>That's a reasonable guess, but the texts do show show v, u, nu, and upsilon and they are quite distinct. The nu looks like the sharp v, but the left arm is angled out instead of in.</p>
      <p>Cochin is interesting. According to Linotype's blurb, "The Paris foundry Deberny &amp; Peignot was the first to release this design in 1912...This version was created in 1977 by Matthew Carter for Linotype."</p>
      <p>The typface you see in the picture was used all through the 1800s. So, Deberny &amp; Peignot created a modification of this 19th century face, then Carter created a 1970s interpretation of that. Carter's font is definitely for display.</p>
