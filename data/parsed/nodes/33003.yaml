      <p>This is my analysis of the images:</p>
      <p>The basic italic v in this typeface is the rounded form. This fits with the conventions of the period and the style.</p>
      <p>The pointed form is a variant specifically for use in setting mathematics, where it can be used without fear of confusion with the Greek upsilon.</p>
      <p>The use of the pointed v in the word 'positives' looks to me like an accident, although I suppose if it is used consistently in this way then some other pattern is at work.</p>
