      <p>After much further delving in the stacks, I've found at least part of the info I was looking for. The usage described above was the house style of <a href="http://www.association-gauthier.org/anglais/famous/Gauthier-Villars.html" rel="nofollow"><em>Gauthier - Villars</em></a>.</p>
      <p>They employed this style from at least 1864 to 1910 and they accounted for the majority of math texts published in France during that period.</p>
      <p>You can browse online scanned books by <a href="http://historical.library.cornell.edu/cgi-bin/cul.math/docviewer?did=01280002&amp;seq=5" rel="nofollow">Boussinesq</a>, <a href="http://historical.library.cornell.edu/cgi-bin/cul.math/docviewer?did=01930001&amp;seq=9" rel="nofollow">Cahen</a>, <a href="http://historical.library.cornell.edu/cgi-bin/cul.math/docviewer?did=01490002&amp;seq=7" rel="nofollow">Lacroix</a>, and <a href="http://historical.library.cornell.edu/cgi-bin/cul.math/docviewer?did=07150001&amp;seq=7" rel="nofollow">Laurent</a>.</p>
      <p>[Edit: I have also found this usage in a Greek/French edition of Thucydides' <em>History of the Peloponnesian War</em> published by Firmin Didot in 1868.]</p>
