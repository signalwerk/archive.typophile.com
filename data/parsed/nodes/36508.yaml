  html: |-
    <p>When I am flowing placed text and automatically generating new pages in Indesign CS3, is there a reason that I would want to flow into a text frame that originally existed on the master page? Or should I just create the frame on the first real page of the document? The Indesign help sort of dances around in discussing this stuff, but keeping the text frame off the master page seems sensible to me.</p>
