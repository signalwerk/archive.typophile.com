      <p>Thank you Dave and Jasper for your comments! Unfortunately i was burgled and my laptop and the backup to my laptop were stolen. So I'm back to square one on this but thanks for your feedback, I am encouraged to give this font another go. Should be easier the second time round. Yeah would be real cool to have random alternates. I don't know if i am able to do this with TypeTool? Might have to invest in Fontlab? Will read the article and look into it. </p>
      <p>And next time round i will also play with the i dot options. I kinda don't mind the small dot but yes it is quite iconic to gill sans ultra and would be cool to see what other options i can come up with. Yes i see what you mean with the 't'. And dingbats would be fun to make. Oh, and Jasper, that beautiful font in the recipe book is 'Ludwig' by OurType.</p>
      <p>Steve</p>
