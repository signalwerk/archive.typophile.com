      <p>I hate gill sans in general, but this is seriously good. The reason (I guess) why you haven't recieved much feedback is because you don't show a simple a-z &amp; A-Z sample.</p>
      <p>The only thing that isn't working IMO is the top of the t. Make it curve the other way, so that the triangle becomes larger.</p>
      <p>The dots on i and j (tittles) are often small in Display fonts of this kind, but I'd like to see larger ones as an alternate.</p>
      <p>PLEASE DON'T STOP WORKING ON THIS. I'd say this has great commercial potential if you select the right audience.</p>
      <p>Cheers,<br>
      Jasper de Waard</p>
