      <p>Hi Steve</p>
      <p>Surprised nobody has commented on this one.  I like it a lot, which is strange considering I hate Gill Sans Ultra Bold.  I can see it being useful, and your examples in the recipe book look great.  I think as long as you haven't used a digital version of Gill Sans as a starting point and just messed around with some curves, you shouldn't expect any heat from Monotype, Adobe etc.  The name might be tempting fate though!</p>
      <p>Regarding the actual design:<br>
      1.  I like the tail on the l<br>
      2.  I prefer the single storey a, but keep the double storey as alternate<br>
      3.  lower case i - I never understood that silly little tittle in GSUltra, and changing it might be a good way to get away from comparisons - maybe have a wide oval tittle, or drop the stem hight to make room for a big circle<br>
      4.  ff looks like crashing glyphs - make a ligature with smoother connection<br>
      5.  On the subject of ligatures, either make a load of double letter ones with different wobbles or (even better) make a whole set of alternates and code them to alternate - good article about this by Nick Shinn on I Love Typography at the moment<br>
      6.  A few useful dingbats - hands, arrows, stars, borders, frames etc. in a similar style to the mouth illustration above would be a nice addition to the font</p>
      <p>Cheers<br>
      Dave</p>
