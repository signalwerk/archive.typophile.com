    html: |-
      <p>Playbill is pretty classic.<br>
      It was a retro design in the 1930s (when Westerns were popular in film), harking back to the previous century's Italiennes.<br>
      Then in the 1950s it became hip when designers started repurposing Victoriana (such as blow-ups of old engravings) in modernist layouts.<br>
      Wide letterspacing of the caps was part of that look, so blocky, kind of architectural.<br>
      There are both clean and distressed versions.<br>
      So it has a range of allusions.</p>
