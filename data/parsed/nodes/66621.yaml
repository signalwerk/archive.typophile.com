    <p>Hello,</p>
    <p>I am looking for Western-style typefaces that are not the typical saloon-hot-iron-brand typefaces. These typefaces will be used to design a contemporary magazine advertisement with a Western-style flare.</p>
    <p>Here are a few examples of what I like so far,</p>
    <p><a href="http://new.myfonts.com/fonts/aerotype/applewood/" title="http://new.myfonts.com/fonts/aerotype/applewood/">http://new.myfonts.com/fonts/aerotype/applewood/</a><br>
    <a href="http://new.myfonts.com/fonts/device/chase/" title="http://new.myfonts.com/fonts/device/chase/">http://new.myfonts.com/fonts/device/chase/</a><br>
    <a href="http://new.myfonts.com/fonts/canadatype/clarendon-text/" title="http://new.myfonts.com/fonts/canadatype/clarendon-text/">http://new.myfonts.com/fonts/canadatype/clarendon-text/</a></p>
    <p>Any research help, or advice about using these or other Western-style typefaces together, is greatly appreciated.</p>
    <p>- corey</p>
