    <p>Hi,</p>
    <p>Bare in mind that this is just an idea, nothing solid at all. Please do tell me if I'm naive, I have the tendency to be.</p>
    <p>Inspired by 'Font Aid' (designers submit designs of glyphs for free, a font is made, profit goes to specific charity <a href="http://www.myfonts.com/foundry/Font_Aid" title="http://www.myfonts.com/foundry/Font_Aid">http://www.myfonts.com/foundry/Font_Aid</a>) I've started thinking that perhaps the typedesign community is capable of even more.</p>
    <p>1. A new foundry, perhaps named Fonts For Good, perhaps named differently, is founded.<br>
    2. Fontdesigners may submit designs.<br>
    3. Fontdesigners decide on the percentage of their profit on the font that will go to an (as of yet) undefined charity. This percentage may be freely picked, but will be mentioned in the fonts' description. (Perhaps a minimum should be set? Say, 25%, or something.)<br>
    4. At the end of the year, fontdesigners may select a number of charities, and buyers and designers (other people involved?) of the fonts may vote on which charity (or charities?) the money goes to.<br>
    5. Condition for every charity is that it is documented (written about, pictures made, or best of all, a (short) documentary is made) so that buyers and designers can see what has happened to the money.</p>
    <p>Questions? Yes, certainly.</p>
    <p>1. Anyone in?<br>
    2. Who's in charge?<br>
    3. Is this in any way realistic?<br>
    4. If it is, what are we waiting for?<br>
    5. Any chance the big distributors are willing to cooperate. Hi there, Myfonts, Fontshop, Fontspring, etc.</p>
    <p>Again, just an idea. Might be naive. Or foolish. Or whatever.</p>
    <p>Cheers! jasper</p>
