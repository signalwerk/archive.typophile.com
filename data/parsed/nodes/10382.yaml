    html: <p>actually weleda hired ingrid liche to design a font which based on the philosopy of rudolf steiners anthroposophy.  <br> <br>those glyphs were carved in wood. the roots of this style came from the jugendstil/art nuveau in which steiner evolve his theory. in waldorfschools you can see many of those carved typfaces. <br> <br>nowadays weleda use a modified liant -version for all printing matters.</p>
