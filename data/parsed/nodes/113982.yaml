      <p>M &amp; P: Chevalier <a href="http://www.myfonts.com/fonts/urw/chevalier/" title="http://www.myfonts.com/fonts/urw/chevalier/">http://www.myfonts.com/fonts/urw/chevalier/</a><br>
      9.8.13: Sackers Gothic <a href="http://www.myfonts.com/fonts/mti/sackers-gothic/" title="http://www.myfonts.com/fonts/mti/sackers-gothic/">http://www.myfonts.com/fonts/mti/sackers-gothic/</a> Burin Sans <a href="http://www.myfonts.com/fonts/mti/burin-sans/" title="http://www.myfonts.com/fonts/mti/burin-sans/">http://www.myfonts.com/fonts/mti/burin-sans/</a> Sweet Sans <a href="http://www.myfonts.com/fonts/sweet/sans/" title="http://www.myfonts.com/fonts/sweet/sans/">http://www.myfonts.com/fonts/sweet/sans/</a> or several other similar fonts<br>
      Mr. and Mrs. Robinson are small and fuzzy but the letters and the ampersand seem consistent with Sackers Gothic, Burin Sans, or Sweet Sans. Don't think it makes a lot of difference which of these three you use for the these parts of the fonts.<br>
      Don</p>
