    <p>AscenderFonts.com is proud to release a wonderful set of new fonts from the <strong><a class="freelinking external" href="http://www.ascenderfonts.com/foundry/hallmark/?sort=alpha" rel="nofollow">Hallmark™ Design Collection</a></strong>. <em>And as a special introductory offer, all the new Hallmark fonts are on sale with a 25% discount now through February 9, 2011.</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hallmark_image_1_6072.png"></div><br>
    This expanding collection contains a vibrant range of script and display fonts. These new releases showcase some exciting styles that offer distinctive ways to enhance a wide variety of design projects and personal communications. All Hallmark fonts are available immediately for instant download in TrueType® and OpenType® formats, and also for use as Web Fonts at <a href="http://www.FontsLive.com" title="www.FontsLive.com">www.FontsLive.com</a>!<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fultoon_HMK_5994.png"></div><br>
    The <a class="freelinking external" href="http://www.ascenderfonts.com/font/fultoon-hmk.aspx" rel="nofollow">Fultoon™ HMK font</a> is an energetic, quirky script typeface from Hallmark. Fultoon has a fun handwritten style with the appearance of ink blobs.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Baa_Book_HMK_5041.png"></div><br>
    The <a class="freelinking external" href="http://www.ascenderfonts.com/font/baa-book-hmk-family.aspx" rel="nofollow">Baa Book™ HMK font family</a> is a clever set of fonts that comes in regular and bold weights. Baa Book HMK has a youthful appearance, with sprightly letterforms. Its hand lettering style is great for everything from scrapbooks to greeting cards.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sandy_HMK_6355.png"></div><br>
    The <a class="freelinking external" href="http://www.ascenderfonts.com/font/sandy-text-hmk-family.aspx" rel="nofollow">Sandy Text™ HMK typeface family</a> was designed by the talented lettering artists at Hallmark Cards. Sandy Text HMK is a casual script with an engaging, flowing handwriting style. It comes in both regular and bold weights for added flexibility.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Twizot_HMK_3663.png"></div><br>
    The <a class="freelinking external" href="http://www.ascenderfonts.com/font/twizot-hmk.aspx" rel="nofollow">Twizot™ HMK font</a> is an engaging, alternative roman font from Hallmark. Twizot HMK has a has an uneven baseline that gives it plenty of energy, and bouncy letterforms that make it a fun font to work with.<p></p>
    <p>For more information on the Hallmark fonts, please visit <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a></p>
