    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Overshoot</strong></p>
    <p>Applied to round characters and curved or rounded parts of characters which "over-shoot" a desired boundaries---typically the <a href="/wiki/baseline" class="freelinking" rel="nofollow">baseline</a> and <a href="/wiki/x-line" class="freelinking" rel="nofollow">x-line</a>--to compensate for the optical illusion of the curves under-shooting those boundaries. Most <a href="/wiki/O" class="freelinking" rel="nofollow">O</a>s and lowercase bowl letters have an amount of overshoot in proportion to the plot of their curve. Tight curves require more overshoot than flattened and squared curves.</p>
    <p><strong>Discussions:</strong><br>
    <a class="freelinking external" href="http://typophile.com/node/45312" rel="nofollow">per-glyph overshoots?</a></p>
