    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Overshoot</strong></p>
    <p>Applied to round characters and curved or rounded parts of characters which “over-shoot” a desired boundaries—typically the <a href="/node/12047" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Baseline</a> and <a href="/node/add/wiki?edit%5Btitle%5D=x-line" title="Create node &quot;x-line&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">x-line</a>–to compensate for the optical illusion of the curves under-shooting those boundaries. Most <a href="/node/add/wiki?edit%5Btitle%5D=O" title="Create node &quot;O&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">O</a>s and lowercase bowl letters have an amount of overshoot in proportion to the plot of their curve. Tight curves require more overshoot than flattened and squared&nbsp;curves.</p>
    <p><strong>Discussions:</strong><br><a href="http://typophile.com/node/45312" title="Click to visit an external URL." class="freelink freelink-external freelink-external">per-glyph&nbsp;overshoots?</a></p>
