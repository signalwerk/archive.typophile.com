    date: 2003-02-11T22:52:00
    votes: null
    html: <p>Another nice feature is the ability to copy and paste composite glyphs within a font leaving the composites intact. This is handy if you need to make a pile of composites using the same base glyph, e.g. agrave aacute acircumflex adieresis etc. You can make one, copy it to the other cells, and then only need to replace one component in each composite. If you've correctly spaced your diacritic marks, you won't even need to adjust any positioning. <br> <br>Note that you can't copy and paste a composite from one font to another without it decomposing. However, if you copy the composite <i>and</i> the base characters for its components, you can use the Append function to copy them to another font <i>preserving the composites.</i> [FontLab will also attempt to preserve visual TT hinting when you use the Append function to copy glyphs from one font to another. This works extremely well if you have identical CVT values (alignment zones, stem controls) in both fonts.] <br> <br>Dang, FontLab is brilliant!</p>
