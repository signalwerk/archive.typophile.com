    html: '<p><i>...you can also use the "Generate Glyphs" command to build accented characters</i> <br> <br>Yes. You can also edit the alias.dat file in the FontLab/Mapping folder, which contains the references from glyph name to components, e.g. <br> <br>Adieresis	A+dieresis <br> <br> <br>My alias.dat file even does Vietnamese smallcaps: <br> <br>uni1EC6.small	E.small+circumflex+dotbelowcomb</p>'
