    votes: null
    html: <p>The command you want is Add Component (Option-F9 on Mac OS X). <br> <br>Go first to the glyph cell where you want the reference to be. Hit Opt-F9, and a dialog will pop up asking you to specify the name of the glyph that you want to reference. This is great, because there is a preview of each glyph and a list of available glyphs that narrows down as you type more characters. Very very handy. <br> <br>Also nice is the ability to - once the component is placed - change its source. Select the component, and go Edit -&gt; Properties. You can then select what character is referenced, and numerically fudge with the component's position. <br> <br>Nicer still, right-click the component and choose "Edit Component"; this will pop up a new glyph window with the source character loaded. <br> <br>Alan</p>
  - id: 59531
    user_id: 1262
    user_name: John Hudson
    user_path: null
