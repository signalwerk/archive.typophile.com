    date: 2003-02-12T00:52:00
    votes: null
    html: <p>Amen, John, FontLab r0x0rs!! To add to your comments, you can also use the "Generate Glyphs" command to build accented characters. Just type the name of the glyphs you wish to create (agrave aacute ... ) and the glyphs are automatically created, and the accents positioned overhead. Tweaking is often needed, but it's such a great start. (This was covered very nicely by Adam Twardoch in the FL forums, iirc.) <br> <br>Stuart, I think if the glyph cell is empty, the width of the first component added is applied to the new glyph. As for metrics, you can use FontLab's collections/classes features to add any newly created accented characters to an existing glyph class. Kerning data can be tied to one "master" character in a class, and applied across the rest of the members of that class automatically. It's like Fog's kerning assistance, only way way way better. <br> <br>Alan</p>
