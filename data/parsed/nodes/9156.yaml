    html: '<p>The Copy Reference (I hope I got the name right) creates a copy of an existing glyph. For example: ü. In Fontographer you can select the lc u (that has already been created) and use the Copy Reference command which will paste your u to ü. <br> <br>If you changed the shape of your lc u glyph, any Copy References you made with the lc u, such as ü, would be changed. <br> <br>I wish I could explain this process a little bit clearer. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>tim</p>'
