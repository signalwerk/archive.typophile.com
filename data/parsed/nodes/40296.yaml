    html: <p>Well, not exactly a direct suggestion on fonts, font sizes, line spacing, spacing between different sections, &amp;c, but I suggest you look at <a class="freelinking external" href="http://theoval.sys.uea.ac.uk/~nlct/" rel="nofollow">Nicola Talbot</a>'s <a class="freelinking external" href="http://theoval.sys.uea.ac.uk/~nlct/latex/packages/index.html#flowfram" rel="nofollow">flowfram</a> package if you're comfortable with LaTeX. There's also a Java program called <a class="freelinking external" href="http://theoval.sys.uea.ac.uk/~nlct/jpgfdraw/index.html" rel="nofollow">JpgfDraw</a> that can be helpful in designing complex layouts with flowfram.</p>
