  html: <p>I am participating in a math conference in early January and need to prepare a poster on my research. The poster is to be a 3 fold, science fair style poster board. I was wondering if anybody had general design tips for fonts, font sizes, line spacing, spacing between different sections &amp;c. It's a pretty serious conference, so there isn't much room for pictures or anything but I was thinking of adding some color with a border around the sections. Thank you!!!</p>
