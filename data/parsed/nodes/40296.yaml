    html: |-
      <p>I'd suggest that you first think about how the poster will be viewed. Will you be standing next to it most of the time, or will it have to stand on its own?</p>
      <p>If you'll be close by most of the time, then consider making the type big enough that a viewer could read your abstract and conclusions without invading your personal space. I've found that conference attendees like to be able to get a sense for what you've done before having to engage you in conversation. Then include diagrams and other visual aids that you'd like to be able to refer to while explaining your work to those that are interested. This approach will lead to including less detail in the poster.</p>
      <p>If the poster is expected to stand on its own, then temptation is to write it like a mini-paper. I've had colleagues who have insisted that this is the correct approach to take in creating a poster, and they may be right. However, I'd still consider very carefully the level of detail you choose to use.</p>
      <p>I'm not sure which typeface you're using for the text, but it looks like the tex package uses computer modern for the math. I'd suggest <em>not</em> using Computer Modern in the poster. To my taste, it's too spindly.  Try to use a package that replaces both text and math font: for example mathpazo (based on Palatino) or fourier (based on Utopia) or the mathdesign fonts based on Bitstream Charter. Of those, only mathpazo gives true small caps (if you select that as an option). </p>
      <p>Finally, I'd also recommend the flowfram package for creating a poster.  But consider trying the beamer package as well (if not this time around, then in the future).  Beamer was designed for slides, but it gives very fine-grained control of many aspects of the layout once you've gotten used to it.  One of my student research teams won a poster prize for a poster created with Beamer.  You just need to tell it to create a very large slide.</p>
      <p>ST</p>
