    date: 2009-08-10T13:51:00
    date_raw: 10 Aug 2009 — 1:51pm
    votes: null
    html: |-
      <p>Do you know what, I don't know how such a neutral face can be so appealing and unique!<br>
      Ok, I'll take a break from chunking up Eternal roman into a text face and give your glyphs some attention...<br>
      As I said before, this is looking *very* polished and useable, so I'll have to go into super picky-pokey mode to give a decent crit...remember I'm a type novice too so have salt at the ready.<br>
      My favourite feature of this is the structure of the bowl and stick glyphs, which seem to have perfect rigour at a perfect midpoint between the grotesques and moderns. There's also a few hints of geometrics (ampersand, percentage and numerals) and humanists (J,K perhaps).</p>
      <p>OK...<br>
      C looks a notch too wide, perhaps also D and G (but I think G should be slightly wider than C because of the crossbar).<br>
      I find the crossbar of G a bit too low.<br>
      J is quite narrow. I like that. Its overshoot is tremendous!<br>
      Knee of K may be slightly high.<br>
      I love the trapping on M and N.<br>
      V and Y may need the join moved a hair to the right.<br>
      Z is leaning left a bit.</p>
      <p>Numerals<br>
      5 looks slightly dark all over.<br>
      6 and 9 have quite small bowls, I presume that's intentional?<br>
      That's a killer 7!<br>
      Lovely.</p>
      <p>Lowercase<br>
      abcd: wonderful. Well done.<br>
      e needs some work. Perhaps the terminal should be lower — the glyph looks a bit closed. The sides could be a hair heavier. The stress looks funny on the top half...think the BCPs on the top extrema need to go inward slightly?<br>
      f is narrow, reflecting the J, but I think here the hood needs to be longer.<br>
      Have you worked more on the lowercase? I'm struggling to find anything to say for the other letters except they're really well executed!?<br>
      z might be leaning left like its mother.</p>
      <p>Ampersand and £ may be a bit too geometric for the font. I'd like to see a £ with a hood like on f (horizontal with a vertical terminal)...also if you're sticking with its current form, I think the bar could be a bit lower. </p>
      <p>Grave accent on a needs to be more left. Acute on e should be more right. Check the ones on O/oacute and O/ograve too. Oslash and oslash are lovely!</p>
      <p>Yogh and wynn look a bit wide and need to be tauter I think (but I am not very familiar with these characters). Lowercase schwa looks rotated anticlockwise a little.</p>
      <p>Have I been unkind enough?!</p>
      <p>Looking forward to seeing more of this, but do remember to sleep! ;)</p>
