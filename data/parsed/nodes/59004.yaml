    <p>This started out as a quick contribution to the <a class="freelinking external" href="http://typophile.com/battle36" rel="nofollow">Arial Type Battle</a>. The typeface still shares the metrics of Helvetica and its impostor, and it is my first attempt at drawing a complete sans serif. That's a lot harder than drawing a serif, I think. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/neutro_3995.jpg"></div><p></p>
    <p>I'd like to release this typeface from its Arial/Helvetica metric imprisonment, and make a light, a bold and a black, and italics for the three lighter weights. Do you think it will be worth the effort? I'm very unsure if Neutrogen is but an exercise, or if it deserves to be developed and used. Please tell me what you think.</p>
