    user: 39515
    date: 2009-06-15T14:01:00
    date_raw: 15 Jun 2009 — 2:01pm
    votes: null
    html: |-
      <p>Hi, Nina, and thanks a bunch for your thorough critique. Very much appreciated, and very, very helpful. </p>
      <p>Yes, I know there are already too many clean grotesques in the world, I guess I yet again have to hide behind the I'm-just-a-beginner-trying-to-learn-the-craft-moniker. Then again, my goal with this typeface is, if anything, to rid a grotesque of much of its grotesqueness, and use geometric solutions instead. I'm not so sure that I will succeed in this, but with all the great help I'm getting here on Typophile, it might just happen. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/neutro4_6261.jpg"></div><p></p>
      <p>I've tried to make the glyphs more uniform, and have spent most of my free time since my last post fiddling with the curves of mnhu. It looks better now, I think, but I'm uncertain if it's good enough. Thanks for spotting the problem, those curves are probably the most defining of the lower case, I think.</p>
      <p>New S made, question mark fixed, f, t, y and j altered, e fixed, c, a, s and z is also tweaked.</p>
      <p>B, C, D, G, H (wider) and Q are also tweaked, most of them following suggestions. Do you think I'm closer to solving the optical problems now, Craig?</p>
      <p>Nina, I tried several other K's and k's, but I just can't make them work. I don't really like the style of the R, but since a straight legged version is the obvious route to follow, I've decided to stick with the unpopular solution. At least, it hasn't got that weird semi-serif of Helcetica.</p>
      <p>I'd really like to see that Frutiger on Mona Lisa and type proportions you mentioned. Which book should I be looking for? Or is it online somewhere? I think my e is much better now, by the way, thanks for pointing it out.</p>
      <p>The numerals: I tried to make a softer transition into the straight line of 6 and 9, but wound up with a <em>very</em> subtle difference. What do you think? I've softened the zero, but kept the roundness of 6, 8, 9. I'll try squaring them later. The 4 is extended, thanks, Craig. </p>
      <p>New pdf attached.</p>
      <p>I swear I'd never heard of the Neutrogena cosmetic products before today, I don't think they're sold here. And I thought I was somewhat clever with that name ...</p>
