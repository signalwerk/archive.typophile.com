      <p>Thanks a lot for your input, Ben!<br>
      You are absolutely right about the need for further optical correction, I've been fumbling in the dark about that, having no theoretical background at all. Type design is an infinite rabbit hole.<br>
      And yes, working on a set of given widths is a severe limitation. I'll rework every glyph.<br>
      I agree on everything else you say, and will make corrections. Those Å and å-rings (and the ø-slashes) follow Helvetica's thinness and placement. I'll fix it.<br>
      Yes, every outer corner is bevelled. I've been thinking about making curves instead, but given the small size (5x5 units), I'm not sure if the difference will be noticable except in very large sizes. I'll give it a try, though.</p>
