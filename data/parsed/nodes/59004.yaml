      <p>Thank you very much for your comments, everyone!<br>
      Frode, I chose the serifed numeral 1 to make it fit better in tabular settings. I think it is quite common for the the base serif in sans serif 1s to be slightly thinner than the base horizontal stroke. However, I've thickened and shortened it somewhat. The top is also altered. The 7 is stabilised. (Er litt agorafobisk for tida, sjukemeldt på grunn av ekstremt overarbeid og konstant migrene, så jeg er litt ute av drift. Men når jeg friskner til, kan vi gjerne møtes.)</p>
      <p>I've tried fixing the S (always a major headache), and worked out a better width relationship between B, C, D, G, O and P. I've also extended the capital overshoot slightly. Question mark fixed, open-topped 4 made, f and t fortified, comma slightly altered. I think its form suits the angularity, but I'll try some other solutions.</p>
      <p>Your input is invaluable, thanks again and keep them coming! </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/neutro3_4344.jpg"></div><p></p>
