      <p>looking great, but here's some feedback from a prospective user. </p>
      <p>AFAIK this face started life as an arial improvement/redesign and, from my point of view, that's where the value of this face lies. </p>
      <p>i, like many other millions of people around the world, am forced to both read and spec arial almost every day of my life. i would love to have a redesign that i could safely substitute for arial, with the same basic charset and without risk of document reflow. seeing neurogena in place of arial every day would improve my quality of life. that, to me, would be worth more than another neo-grot, however well-designed, in an already-crowded market.</p>
      <p>of course, i'm talking about compromising a typeface you may feel has entirely transcended arial and acquired characteristics and an independence all of its own. so here's a suggestion. the main version would be spaced and kerned with complete freedom. but alongside it could be a retrograde 'arial-compatible' version could adopt the arial metrics so it could be substituted in the way i describe.</p>
      <p>what do you think?</p>
      <p>in any case, i've anjoyed seeing this design evolve.</p>
      <p>geraint</p>
