      <p>Hi Sindre :)<br>
      This is really cool. I like the DIN-like introduction of straight-sided rounds. I think you are right, this is crying out to be let out of the Arial/Helvetica cage. I find the widths, especially in the caps, a bit uneven.<br>
      Are the corners and terminals bevelled? I wonder if small curves might be cool.<br>
      I think there's a tiny amount of optical correction needed on some of the curves e.g. o looks darker on the top left and bottom right because it's symmetrical.<br>
      I love the almost unnoticeable trapping on the M and N for example. M looks a bit narrow perhaps.<br>
      I'd move the crossbar on e down slightly. a looks wide (as of course it would being based on the metrics of Arial). w could go wider.<br>
      Bowls on 6 and 9 could be larger.<br>
      You would know much better than me but doesn't the ring on aring look a bit light and close to the base glyph?<br>
      I'd put a slab on the bottom of £ to match the 7.</p>
