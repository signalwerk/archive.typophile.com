      <p>Those cap proportions look pretty good to me.<br>
      S still looks to "Eurostile-y" for this font to me.<br>
      6 (and presumably still 9) are too abrupt going from curve to straight I think.<br>
      Relationship of the question mark stroke and its dot is weird - align them better, and maybe the stroke can thicken at the bottom so the difference in width isn't so distinct?<br>
      Relationship of inner and outer contours needs refining in some curves - for example, southeast corner of D and B looks pinched.<br>
      The open-topped four looks a little narrow.<br>
      I kinda like the comma!</p>
