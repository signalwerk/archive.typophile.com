      <p>Wow, thanks again, Nina. You already deserve a mention in the font info-section. </p>
      <p>I've had very little time for type drawing today, but I've tinkered a bit with proportions, following your suggestions. It's incredible how easy it is to see your own faults when someone points them out. While I may be fast at drawing S'es, you really have a tremendous eye for type, of which I'm envious. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/neutro5_5741.jpg"></div><p></p>
      <p>I've widened bdpq somewhat, made e slightly narrower, m a bit wider, s a little wider (with some additional tweaking), widened F quite a bit, tinkered a little with the S (it's a great trick turning difficult glyphs upside down, by the way, all bumps and faults suddenly stand out when you see it as an image instead of as a letter), narrowed the H considerably, widened the N just a hair, sliced a little off the X, and slimmed COGQ a tiny bit. To my eyes, the whole font looks much more harmonius and optically pleasing now, but I guess you'll find more faults. I hope you do!</p>
      <p>Er, the numerals. I haven't had time to work on them today. I really think I want to redraw them from scratch, as I feel they don't really match the rest of the typeface. Perhaps I'll make them cap height instead, and draw some kerned hybrid numerals as an alternative.    </p>
      <p>Thanks a lot for the Mona Lisa distortions! That's so true! Still, the hard part is probably understanding the different relationship of proportions in different type styles. A Barocque e would look slightly retarded if one were to interpret the crossbar as the eyes of a human face. </p>
      <p>It seems "Neutrogena" is actually a Swiss brand, its formula supposedly invented by a Belgian. I found several Norwegian pages where female bloggers lamented the products' non-presence here. Obviously a case of "foreign branding", just like Häagen-Dazs, which name is supposed to look Scandinavian to American customers.</p>
