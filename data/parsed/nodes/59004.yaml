    html: |-
      <p>Sindre, you're obviously playing a crowded field here, but I think this may well grow to be quite "special" enough to exist of its own right. I like how its "angularity" pulls it over a bit into the  direction of DIN. I think the character of the face still needs a bit of refining though; not all glyphs pull equally strongly into the "new" direction.</p>
      <p>For one thing, the angularity is not treated alike in all letters. I agree with Craig that the "S" is too flat on top and on the bottom. Conversely, the question mark might be too round. The "m" seems more roundy than I'd have expected, too; and maybe the "n"/"h"/"u" could also do with more "tenseness"? – also in terms of stroke modulation (that taper close to the joins looks a bit 1950s-grotesque-ish I think).</p>
      <p>The other thing is that a few glyphs look closer to existing fonts than others (kinda hard to avoid I guess). "g" and "t" are somewhere between Arial and Univers; "f", "k"/"K", and "R" seem reminiscent of Helvetica. There might be room for different treatments… dunno, maybe a "K" with a horizontal crossbar could work? Or a differently-topped "t", a wider "f", …?</p>
      <p>*</p>
      <p>Details: I think "t" might need more of a foot to stand on. Maybe also consider making its stem [more] off-vertical.</p>
      <p>"z" looks maybe a bit wide.</p>
      <p>My biggest beef is the "e" – to my eye, its vertical proportions (and to a lesser degree, maybe also those of the "G") are off. I'd make the eye larger, but if you don't want to do that, I think you need to give it less of a "jaw" (i.e. close it less in the bottom-right) and fiddle with the curves; it just looks like the crossbar is too high. (It reminded me of that illustration that Frutiger did of the proportions of lettershapes vs. human faces, with the Mona Lisa – have you seen that? It's pretty funny.)<br>
      BTW, it might also be slightly wide.</p>
      <p>Numerals: I like them!<br>
      They look a bit more Franklin-Gothic-esque than the letters though. The bowls of "6", "8", "9" are surprisingly un-square. And hmm, with a "4", a "6" and a "9" like that, I think I'd expect a "R" with a straight leg. But maybe that's just me.<br>
      I think "3" is too heavy in the bottom-left. The zero might be a bit *too* square, dunno.</p>
      <p>BTW, I dig the name, except that it keeps reminding me of hand cream. ;)</p>
      <p>I'll be curious to see where this goes – it's interesting!</p>
      <p>--<br>
      Ben, thanks for posting the link to that Mark Jamra article! That's interesting stuff.</p>
