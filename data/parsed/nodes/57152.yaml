    html: |-
      <p>Hmm ... when I look at your website, I see even more flaws with your design. The problem is your application of Britanica: just because it’s not Helvetica doesn’t mean it doesn’t carry the same issues of blandness and lack of originality that the poor use of Helvetica carries.</p>
      <p>And yes, the touching letters isn’t working for you. Again, it lends a derivative sense to the whole design.</p>
      <p>The ’A’ is much more interesting, if not in need of tweaking. If you’ve designed the ’A’ from scratch, why not match it by creating a complementary font for the name?</p>
      <p>—<br>
      Nick Hladek</p>
