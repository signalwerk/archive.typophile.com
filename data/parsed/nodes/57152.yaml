    <p>I am applying for college and I thought that it would be a good idea if I made my own website (<a href="http://www.ausste.com" title="www.ausste.com">www.ausste.com</a>)</p>
    <p>I worked on this identity for a week and this is what I came up with.</p>
    <p>Info:<br>
    I first drew some ideas in my sketch book focusing on one style; simplicity. When people see my identity, I want them to come up with an image of “modern” and a somewhat image of elegance. So I came up with putting my own font into a circle and it looked great. As for the text “Aussté Design”. I chose the font Britanica. I especially loved the shape of the “A” and “g”. I just couldn’t get my eye off it.</p>
    <p>So please tell me what you think.</p>
