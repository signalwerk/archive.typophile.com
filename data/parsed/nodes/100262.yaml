  html: |-
    <p>DocTipos - Portuguese Typeface Design Documentary is a project that aims to understand and document the reality of Typeface design made in Portugal by Portuguese designers. Were carefully selected professionals with relevance in Portuguese Typeface design panorama, that report throughout the documentary, important phases of the evolution of Typeface design in Portugal.</p>
    <p> The website of DocTipos is now available at <a href="http://www.doctiposportugues.com" title="www.doctiposportugues.com">www.doctiposportugues.com</a>. There you can find more information about the project and follow all the latest developments.</p>
    <p>The DocTipos official trailer is now available: <a href="http://doctiposportugues.com/?page_id=214&amp;lang=en" title="http://doctiposportugues.com/?page_id=214&amp;lang=en">http://doctiposportugues.com/?page_id=214&amp;lang=en</a></p>
    <p>Thank you<br>
    DocTipos</p>
