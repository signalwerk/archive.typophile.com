  html: |-
    <p>The Font Company was based in Phoenix, AZ and owned by Dan Barthel. The company scanned and digitized fronts from filmstrips as well as conversions of Alphatype faces in the late 1980s. </p>
    <p>Font Company faces were distributed by the Precision Type Company until it closed its doors in the mid-2000s.</p>
    <p>The Font Company closed in the 1990s.</p>
