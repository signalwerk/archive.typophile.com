  html: |-
    <p>The Font Company was based in Phoenix, <span class="caps">AZ</span> and owned by Dan Barthel. The company scanned and digitized fronts from filmstrips as well as conversions of Alphatype faces in the late&nbsp;1980s. </p>
    <p>Font Company faces were distributed by the Precision Type Company until it closed its doors in the&nbsp;mid-2000s.</p>
    <p>The Font Company closed in the&nbsp;1990s.</p>
