    html: "<p>Hi Guilherme, <br> <br>I think this is an ok idea, but I think you need to be careful not to over do it. It would need just the right word to make \"organic\" ligatures happen between every letter and not look contrived (this is the trouble I see with your design). If you have to resort to overlapping letters and adding little white spaces, it's probably not a natural combination like LA or rt <br> <br>Consider backing away from the ligature idea a few notches and restricting them to the places where they fit naturally which is this case is pretty much nowhere. <br> <br>I would start by adding enough space between the letters that each stands on its own, with enough balance between white and black. Then maybe consider these more subtle connections: <br>1. Bring the leg of the n to loop into the i <br>2. Bring the ear of a two story g into the top of a two story a  <br> <br>Or try a new idea intirely. There are lots of ways you could suggest organic: <br>- How about more natural and totally non-geometric? <br>- Try drawing your logo by drizzling chocolate syrup. At least you can eat the results that turn out bad. (scanning would be a problem though :-) <br>- <a href=\"http://www.chank.com/designcamp.php\" target=\"_blank\">http://www.chank.com/designcamp.php</a> <br> <br>Go exploring and have fun. <br>Randy</p>"
