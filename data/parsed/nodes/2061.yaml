    date_raw: 16 Nov 2003 — 3:20pm
    votes: null
    html: "<p><i>&gt; the skew on the title doesn't agree with me... it  <br>just looks out of place.</i> <br><i>&gt; Wow, I really like the skewed title.</i> <br>Uh guys, could you try to agree please? <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"> <br>IMO the big plus of this scenario is that it gives a sense  <br>of purpose to the whole lay-out, as I explained to  <br>Randy earlier on. It conveys the \"Through the Looking  <br>Glass\" symbolically, it creates a narrative as Alice  <br>actually looks at the title and it also parallels the  <br>whole \"skewed reality\" concept without having to do  <br>anything too literal. <br> <br><i>&gt; the text on the bottom looks really crowded now</i> <br><i>&gt; I agree with Chris, though, that the text at the bottom  <br>is too heavy. Would doing it only in the Mrs. Eaves,  <br>with caps for months work?</i> <br> <br>Well you can't win them all: the text at the bottom  <br>is organized in a calmer fashion (less type sizes,  <br>everything flush left, see HD's remark) and most  <br>importantly leaves a maximum of white space available  <br>for the thing that really needs to catch the eye of  <br>the people: the illustration and the title. Setting  <br>the dates in Gothic No. 13 allows me to control the  <br>focus points: what do people need to learn when they  <br>look from a distance? What is going on and when. Once  <br>they're interested they can come closer and read the  <br>rest of the information. I think it's difficult to do  <br>better than that on a small poster (40x60 cm). <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
    html_clean: "<p><i>&gt; the skew on the title doesn't agree with me... it  <br>just looks out of place.</i> <br><i>&gt; Wow, I really like the skewed title.</i> <br>Uh guys, could you try to agree please? <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"> <br>IMO the big plus of this scenario is that it gives a sense  <br>of purpose to the whole lay-out, as I explained to  <br>Randy earlier on. It conveys the \"Through the Looking  <br>Glass\" symbolically, it creates a narrative as Alice  <br>actually looks at the title and it also parallels the  <br>whole \"skewed reality\" concept without having to do  <br>anything too literal. <br> <br><i>&gt; the text on the bottom looks really crowded now</i> <br><i>&gt; I agree with Chris, though, that the text at the bottom  <br>is too heavy. Would doing it only in the Mrs. Eaves,  <br>with caps for months work?</i> <br> <br>Well you can't win them all: the text at the bottom  <br>is organized in a calmer fashion (less type sizes,  <br>everything flush left, see HD's remark) and most  <br>importantly leaves a maximum of white space available  <br>for the thing that really needs to catch the eye of  <br>the people: the illustration and the title. Setting  <br>the dates in Gothic No. 13 allows me to control the  <br>focus points: what do people need to learn when they  <br>look from a distance? What is going on and when. Once  <br>they're interested they can come closer and read the  <br>rest of the information. I think it's difficult to do  <br>better than that on a small poster (40x60 cm). <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
