    html: <p>Hi everyone, 's about time I responded to your remarks  <br>and corrections. I was a bit wary of the 'too many cooks  <br>spoil the broth' syndrome, but overall I'm very pleased  <br>by your comments, which I think will help me improve the  <br>end result. I'm gonna do this in bits, so please bear  <br>with me. <br> <br>First of all, the size is A2 (40 x 60 cm), which is why  <br>I was hesitant to go smaller with the type. Randy's  <br>remark and Loren's tinkering convinced me otherwise,  <br>so thank you both. Also Eduardo was spot on with the  <br>grid remark. On the other hand, it's always been my firm  <br>conviction that the grid only stays in as long as it helps.  <br>If it starts to hinder, fook it, as Noel Gallagher 'd say.</p>
