    html: "<p>Hey Yves, I think it's a bit too much information there, and I wonder if there is any way to clean it up a bit. Simplify it. There is too much screaming for my attention here.  <br> <br>Just wondering: Why is there info and tickets with different phone numbers for every event, jeez, that is not really user-friendly :-).  <br> <br>I'm wondering if the day (vrijdag) isn't a bit too close to the date and if the date per se isn't to big. Mrs. Eaves is overused, but not a bad choice for this job. (The spacing of that IS a bitch, though -- and a job like this is quite worth transferring to Indesign if it's not just that one time you work for the client.) <br> <br>If it IS contemporary classical music, though, I think you should aim for something less retro, cooler, more layered and modern. I don't know if a this kind of retro look sends the right kinda message, but then again I don't know what kind of music is played. This kind of look would be wrong for the likes of Sch</p>"
