    html: "<p>HD, I really appreciated your remarks too, very insightful,  <br>but I'm starting to get the impression I'm spending  <br>more time on this thread than actually designing the  <br>friggin' thing! In a quicky: <br> <br>Re: too much information, simplify <br> <br>I did the maximum I could, but unfortunately everything  <br>needs to be on there: three dates, three different  <br>cities, and no other promotional material where  <br>interested parties can get their information. Can't  <br>be helped. It's up to me to find a adequate solution. <br> <br>Re: Mrs Eaves is overused <br> <br>Nobody told it was going to be like that when I  <br>initially bought the license. I use it sparsely, and  <br>I'd still like to get some mileage out of that purchase. <br>I really like her. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Re: your whole style analysis <br> <br>The composer is a classical contemporary classical  <br>composer (if you catch my drift) and uses a lot of  <br>citations. I thought using period elements and  <br>recombining them in a modern way would convey that. <br> <br>Re: their homepage <br> <br>Heh. Horrible innit? That's next on my list... if they  <br>can free up some budget. <br> <br>Re: close-not-touching-feeling Gothic No. 13 <br> <br>-30/1000 Em did the trick, but it got a bit lost when  <br>I 3Ded the whole thing. <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"></p>"
