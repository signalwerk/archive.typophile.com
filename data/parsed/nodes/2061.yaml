    html: "<p>That is a lovely illustration. <br>I think the sans vs. serif is working out. <br> <br>I think the composers name and the title could be a bit smaller. 80% of what you have now. and perhaps following the grid a bit tighter. <br> <br>In general I'm looking for you to shrink things down so that you create more white space. <br> <br>Possibly smaller body type by about the same %, but I'd keep the line spacing. <br> <br>Also try de-emphasizing <i>from</i>. Maybe bring the top of the A in Alice up to the Bottom of the S in Songs. Then fit the from in the hole between the i and g? You might need to either go with a heavier weight for the \"from,\" or possibly go lighter (just so it doesn't look close, but wrong). <br> <br>Ok. Let's get nitpicky: <br>- More line spacing between the Dates (sans) and the Days. <br>- Info &amp; Tickets phone numbers should all be flush left. <br>- Are you allowed to jam all the logos together on the bottom? <br> <br>I think the layout you have going is a nice safe layout. Try something wildly asymmetrical (maybe using alice's line of vision to empasize the title in the opposite corner of the page). <br> <br>Not crazy about the colors. I'm seeing earth tones. Maybe a yellow ochre. Maybe and olive with a touch more green. <br> <br>Well. I've been staring at alphabets all day so I could be totally off base. <br> <br>Cheers, <br>Randy</p>"
