    html: |-
      <p>HELLO: hard to say with so few letters, could probably be easier with the sample origin... Anyway, found 3 similars (thin condensed sans with low middle bars): <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/mazurquica/" rel="nofollow">Mazurquica Liviana</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/pburgiel/arsinoe/" rel="nofollow">Arsinoe</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fabio-martins/catorze27-style1/" rel="nofollow">Catorze27</a><br>
      foodiecrush: most probably <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/century-725/black/" rel="nofollow">Century 725 Black</a> and possibly the same as for "LABOR DAY BARBEQUES" (forget waht I've previously said)<br>
      with: also <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/century-725/italic/" rel="nofollow">Century 725</a> but this time Italic<br>
      MANGO GASPACHO: <a class="freelinking external" href="http://www.myfonts.com/fonts/typetrust/heroic-condensed/" rel="nofollow">Heroic Condensed</a> (closer look <a class="freelinking external" href="http://www.foodiecrush.com/2012/08/thin-mint-girl-scout-cookie-smores-recipe/" rel="nofollow">here</a>)</p>
