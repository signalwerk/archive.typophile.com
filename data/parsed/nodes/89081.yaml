      <p><img src="http://media.tumblr.com/tumblr_lxuscd4qV91qdoyy0.png"> </p>
      <p>The name Tynne is somewhat evocative of the sharp “snipped” feel of the serifs, open counters and ink traps, like patterns cut from sheet metal with hand shears.</p>
      <p>The 566 glyph character set has wide ranging language support and Open Type features including over 70 standard and discretionary ligatures. three sets of figures and small caps.</p>
