    <p>Selected newly released typefaces, February ‘08: '<a href="http://www.type-together.com/ampl_font.php?idpuente=13" title="Bree" target="_blank" rel="nofollow">Bree</a>', by Veronika Burian + José Scaglione<em> (Type Together)</em>. '<a href="http://www.typedifferent.com" title="Broadband" target="_blank" rel="nofollow">Broadband</a>', by/from Büro Destruct <em>(TypeDifferent)</em>. '<a href="http://www.typodermic.com/169.html" title="Divulge" target="_blank" rel="nofollow">Divulge</a>', by Ray Larabie <em>(Typodermic)</em>. '<a href="http://www.atf.com.au/font.asp?Font_ID=94" title="Halvorsen" target="_blank" rel="nofollow">Halvorsen</a>', by Wayne Thompson <em>(Australian Type Foundry)</em>, '<a href="http://www.insignedesign.com/Typeface.aspx?FamilyName=Massif" title="Massif" target="_blank" rel="nofollow">Massif</a>', by Jeremy Dooley <em>(insigne)</em>, '<a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_rounded_ot/" title="Unit (Rounded)" target="_blank" rel="nofollow">Unit <em>(Rounded)</em></a>', by Erik Spiekermann <em>(FontFont)</em>. '<a href="http://www.canadatype.com/showfont.php?id=142" title="Ronaldson" target="_blank" rel="nofollow">Ronaldson</a>', by Alexander Kay + Rebecca Alaccari + Patrick Griffin <em>(Canada Type)</em>.</p>
    <p>Selected new free fonts: '<a href="http://www.chank.com/freefont_detail.php?sku=1106" title="Millesime" target="_blank" rel="nofollow">Millesime</a>', by Gregory W. Jacobson <em>(Chank / Dead Image Design)</em>. '<a href="http://www.fontshop.com/freefonts" title="Unit (Rounded)" target="_blank" rel="nofollow">Unit <em>(Rounded)</em></a>' <em>(Bold/Demo)</em>, by Erik Spiekermann <em>(FontFont)</em>. '<a href="http://www.justanotherfoundry.com/Zalamander/index.htm" title="Zalamander (Caps)" target="_blank" rel="nofollow">Zalamander <em>(Caps)</em></a>', by Tim Ahrens <em>(Just Another Foundry)</em>.</p>
