      <p>England? The US? You've got to be kidding. Unless you're looking for celebrity art, what you want is the "Vernissage" flea market in Yerevan, Armenia. Two pertinents things I've purchased from there are a painting of the Armenian alphabet* for $40 last Fall, and a full-size hand-carved backgammon board** (cherry or pear wood, I forget) with various motifs on one face and "Papazian" set in Armenian in my Maral font (I gave Roubik a printout) nicely carved on the other face, for $25 (although that was in 2000).</p>
      <p>* <a href="http://www.flickr.com/photos/48413419@N00/267395186/" title="http://www.flickr.com/photos/48413419@N00/267395186/">http://www.flickr.com/photos/48413419@N00/267395186/</a></p>
      <p>** Wait time: two days.</p>
      <p>hhp</p>
