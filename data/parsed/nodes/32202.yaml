    <p>Sometimes they're called alphabet carvings, alphabet tablets, or  alphabet stones. I saw one once, about a dozen years ago.</p>
    <p>Does anyone know where I can purchase one that won't cost an arm and a leg? It's not terribly important if it's wood or stone, or if it's carved, sandblasted, laser cut, engraved, etched, or whatever, as long as it's both correct and aesthetic. The sample is from England; everything else being equal, which it never is, it would probably cost less in the USA if for no other reason than shipping.</p>
    <p>Any ideas?</p>
