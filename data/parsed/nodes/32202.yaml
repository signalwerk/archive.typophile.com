      <p>This might be an idea... </p>
      <p>Search the local phone book for a headstone/memorial carver or Metal Shop that uses a water jet. You'd probably have to supply the design, but the final piece would be pretty intricate. </p>
      <p>If you want that hand-hewn look, again, a headstone carver could probably offer those services. It might be per letter.</p>
