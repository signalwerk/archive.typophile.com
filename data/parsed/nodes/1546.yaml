    html: <p>If you need a version of the logo in EPS, you can get it <a href="http://logo.nino.ru/main/?id=525&amp;query_id=51393&amp;page=1">here</a>. I'm also guessing it's custom, so you may have to do something complementary. I would strongly suggest that if you choose to do that, please don't choose a font that looks like the Acura font, but rather choose something that goes well with it without trying to copy it.</p>
