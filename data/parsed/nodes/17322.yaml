      <p><em>is this quote is correct?</em></p>
      <p>Yes. But slab serif faces were used for display settings, or as a contrast face in text, rather than the main style. Like we use a bold sans to contrast a regular serif face today.</p>
      <p>The only form of contrast that Morris tolerated was between caps and U&amp;lc -- had he addrressed typography earlier in his career, or lived longer, he might have developed a larger palette of typefaces and started to use them together.</p>
    html_clean: |-
