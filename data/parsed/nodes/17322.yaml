      <p>thanks again for all your help. thomas phinney, it seems you know a lot about his faces! i couldnt find a really high-res-version of any of his books, do you know a link by chance? i was never able to really have a good look at the body text face.</p>
      <p>i did this research because im doing a collaboration with a friend of mine. we gave a quote to each other and have to interpret it with a own font - just the glyphs you need to write the quote. i got one by william morris ("give me love and work; these two only."). i ended up with a geometrical slab serif with very thing, coltish serifs - but im totally unsure if i get two pass the gap between "industrial" and "geometrical" (i want to do a modern interpretation, and modern in an industrial sense for me means geometrical).</p>
      <p>but all the inspiration you gave me here helped me, it wasnt for nothing. thanks again! (and if anyone wants to add anything, do so! please!)</p>
