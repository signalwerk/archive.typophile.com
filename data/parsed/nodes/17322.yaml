      <p>Slab serifs as text typefaces are an end-of-the-19th-century innovation. Although Morris wouldn't have thought much of the slab serifs you name, it's arguable that his Kelmscott Chaucer typeface is a slab serif. ITC Italia is a modern slab-serif which is a reasonably direct descendant from Morris' work, btw (being based on a rip-off of Morris overseen by a distant relative of mine).</p>
      <p>T</p>
