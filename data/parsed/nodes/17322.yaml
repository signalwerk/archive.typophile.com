    <p>im looking for bold slab-serifs but with a "human" touch. caecilia is a bit too "human", while rockwell and lubalin graph are just too geometric. its just for educational purpose, research. the ones i already looked into are caecilia, rockwell, lubalin graph and clarendon.</p>
    <p>is this quote is correct?</p>
    <p><cite>The impact of the Industrial Revolution brought profound changes to printing and typography in the 19th century.[...]This was the era of Slab Serif, or Egyptian typefaces.<br>
    (<a href="http://graphicdesign.sfcc.spokane.cc.wa.us/tutorials/process/type_basics/slab_serif.htm" target="_blank" rel="nofollow">source</a>)</cite></p>
    <p>im asking this because im doing a work on william morris, english socialist and one of the first people in the "arts and crafts movement", living from 1834 - 1896. he also created 3 typefaces.</p>
    <p>were slab-serifs a normal thing while he lived? after my research i'd have to say yes, but i want to know it for sure..</p>
    <p>thanks for any help!</p>
