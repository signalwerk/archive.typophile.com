      <p>Zara, the yellow dots are the <a class="freelinking external" href="http://www.sscnet.ucla.edu/geog/gessler/collections/steg-eurion-constellation.htm" rel="nofollow">EURion Constellation</a> which feature on almost every bank note in current circulation. The idea is that when a colour photocopier senses 5 small yellow circles arranged in a pattern similar to the Orion Constellation, it will refuse to copy.</p>
      <p>Interestingly, although they have been around for a while, no country has officially admitted their existence and so they have only recently been discovered. There is also some currency detection software built into more recent scanners and imaging software which is still <a class="freelinking external" href="http://www.cl.cam.ac.uk/~sjm217/projects/currency/" rel="nofollow">not understood</a>.</p>
      <p>-Jacob</p>
