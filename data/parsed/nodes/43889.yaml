      <p>Dwiggins' 1932 "Towards a Reform of the Paper Currency"  is always worth a read on this topic and should be required reading for anyone having anything to do with currency design. The essay is sarcastic, hilarious (at times rather un-PC), but he makes some great points in addressing the problem<em> "It is not possible to discuss the designs [for the paper currency] without heat. They infuriate you because you cannot get at them. They are beyond the reach of criticism. They are safe—as an idiot is safe anywhere, in any community, savage or civilized. They are made immune by hideous deformity. . ."</em></p>
      <p>My attempts at reprinting the book were stalled with dead-ends in securing rights, but I thought an image of the cover might be appreciated:</p><div class="imageWrap"><img src="http://typophile.com/files/dwiggins-currency-cover_5943.jpg"></div><p></p>
    html_clean: |-
