      <p>If it costs 2c to make a penny, and 10c to make a nickel, someone is ripping you off. There isn't that much more metal in the nickel, and the process is essential the same.</p>
      <p>In Canada they have just started talking about getting rid of the penny (the govenment, I have been saying it for 20 years). Here we have $1 and $2 coins in circulation, not bills, so one's pocket is weighed down by all the coins. That is why Canadians appear to walk on an angle. Not to mention the problem with US based cash registers with only four or five coin slots.</p>
      <p>Inflation has devalued the dollar to at least 1/10th of its 1950s value. So why not get rid of both the penny and the nickel. Price things with one decimal point after the dollar. And don't worry that prices will only round up. You know that something now priced at $19.99 is going to go to $19.9, not $20.0. Within a year prices will average out, due to competition.</p>
