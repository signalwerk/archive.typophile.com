    <p>Hello all,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FONT_5804.jpg"></div><p></p>
    <p>I found this image in an old french book of lettres. I was wondering if it could be desaturated and made into a font somehow. I do not have the resources or the know-how to do this. If you're able to do this and don't mind, I'd be very appreciative if you could send me over the .otf or .ttf file. </p>
    <p>Thanks</p>
