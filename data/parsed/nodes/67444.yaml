    <p>A<br>
    Contemplation<br>
    upon<br>
    the Mystery of MAN's Regeneration,<br>
    In Allusion to the Mystery of<br>
    PRINTING.</p>
    <p>GREAT Blest MASTER-PRINTER, Come<br>
    Into thy Composing-Room:<br>
    Wipe away our foul Offenses;<br>
    Make, O make our Souls and Senses,<br>
    The Upper and the Lower Cases;<br>
    And thy large Alphabet of Graces<br>
    The Letter, which being ever fit;<br>
    O haste thou to Distribute it:<br>
    For there is (I make Account)<br>
    No Imperfection in the Fount.<br>
    If any Letters Face be foul,<br>
    O wash it, ere it touch the Soul;<br>
    Contrition be the Brush; the Lye,<br>
    Tears from a Penitential Eye.<br>
    	Thy Graces so Distributed,<br>
    Think not thy Work half finished:<br>
    On still, O LORD, no Time defer,<br>
    Be truly a COMPOSITOR.<br>
    Take thy Composing-Stick in Hand,<br>
    Thy Holy Word, the firmest Band;<br>
    For sure that Work can never miss,<br>
    That's truly Justify'd in this.<br>
    	The End of Grace's Distribution,<br>
    Is not a meer Dissolution;<br>
    But that from each Part being cited,<br>
    They may be again United:<br>
    Let Righteousness and Peace then meet,<br>
    Mercy and Truth each other greet;<br>
    Let these Letters make a Word,<br>
    Let these Words a Line afford,<br>
    Then of Lines a Page compose,<br>
    Which being brought unto a Close,<br>
    Be Thou the Direction, LORD;<br>
    Let Love be the fast-binding Cord.<br>
    Set, O LORD, O Set apace,<br>
    That we may grow from Grace to Grace;<br>
    Till tow'rds the Chace we nearer draw,<br>
    The Two strong Tables of Thy Law,<br>
    Of which the Two firm Crosses be,<br>
    The Love of Man, next after Thee.<br>
    The Head-Sticks are Thy Majesty;<br>
    The Foot-Sticks, Christ's Humility;<br>
    The Supplications of the Saints,<br>
    The Side-Sticks, when our Faith e'er faints;<br>
    Let the Quines be Thy sure Election,<br>
    Which admits of no rejection;<br>
    With which our Souls being join'd about,<br>
    Not the least Grace can drop out.<br>
    Thy Mercies and Allurements all;<br>
    Thy Shooting-Stick and Mallet call.<br>
    	But when all this done we see,<br>
    Who shall the CORRECTOR be?<br>
    O LORD, What Thou Set'st cann't be ill,<br>
    It needs then no CORRECTOR's skill.<br>
    	Now tho' these Graces are all Set,<br>
    Our Hearts are but White-Paper yet;<br>
    And by Adam's First Transgression,<br>
    Fit only for the worst Impression.<br>
    Thy Holy Spirit the PRESS-MAN make,<br>
    From whom we may Perfection take;<br>
    And let Him no Time defer,<br>
    To Print on us Thy Character.<br>
    Let the Ink be Black as Jet;<br>
    What though? It is comely yet,<br>
    As Courtains of King Solomon,<br>
    Or Kedars Tents to look upon.<br>
    	Be Victory the Press's Head,<br>
    That o'er Oppression it may tread.<br>
    Let Divine Contemplation be<br>
    The Skrews, to raise us up to Thee:<br>
    The Press's Two Cheeks (Unsubdu'd)<br>
    Strong Constancy and Fortitude:<br>
    Our slavish Flesh let be the Till,<br>
    Whereon lay what Trash you will:<br>
    To move the Work with Easiness:<br>
    The Platten is Affliction,<br>
    Which makes good Work, being hard set on.<br>
    The Bar, the Spirit's instrument,<br>
    To sanctifie our Punishment.<br>
    The Blankets, a Resemblance hath<br>
    Of Mercy in the midst of Wrath.<br>
    The Frisket, thy Preventing Grace,<br>
    Keeps us from many a sully'd Face.<br>
    CHRIST JESUS is the Level Stone<br>
    That our Hearts must be Wrought upon.<br>
    the Coffin, wherein it doth ly,<br>
    Is Rest to all Eternity.<br>
    The Cramp-Irons, that it moves on still,<br>
    Are the good Motions of the Will.<br>
    The Rounce, the Spirit's Inspiration,<br>
    Working an Holy Agitation.<br>
    The Girts, the Gift of Continence,<br>
    The Tether of th' Unbridled Sense.<br>
    The Winter, whereon all doth ly,<br>
    Is Patience in Adversity.<br>
    The Footstep, Humbleness of Mind,<br>
    That in it self no Worth can find.<br>
    	If there be such a Chance as this,<br>
    That any Letter batter'd is,<br>
    Being come unto thy View,<br>
    Take it out, put in a new.<br>
    Or if Satan, that foul Fiend,<br>
    Marr, with a Pretence to Mend,<br>
    And being at thy Goodness vext,<br>
    Makes Blasphemy of thy pure Text,<br>
    Find it out, O LORD, and then<br>
    Print our Hearts new o'er agen.<br>
    	O LORD, unto this Work make hast,<br>
    'Tis a Work that long will last:<br>
    And when this White-Paper's done,<br>
    Work a Reiteration.<br>
    	FINIS.</p>
