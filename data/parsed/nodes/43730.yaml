  html: |-
    <p>I would like to announce the inital release of Generika at DGV.</p>
    <p>Generika is a contemporary, rounded typewriter-style typeface in light, regular and bold including theire italics.<br>
    A monospaced version is coming soon.</p>
    <p>For more information please visit the DGV-Website:<br>
    (<a href="http://www.die-gestalten.de/fonts/detail/?id=ceaea76518bcb45f0118f02f39af0036#moreinfo" title="http://www.die-gestalten.de/fonts/detail/?id=ceaea76518bcb45f0118f02f39af0036#moreinfo">http://www.die-gestalten.de/fonts/detail/?id=ceaea76518bcb45f0118f02f39a...</a>)</p>
    <p>as I'm quite new to that business comments are verry welcom</p>
    <p>kind regards,<br>
    Alexander Meyer<br>
    xyz.ch</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Generika_Typophile_Specimen_4858.jpg"></div><p></p>
