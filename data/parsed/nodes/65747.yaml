    html: |-
      <p>This looks like a sample from TV or a film, and possibly something older than the 60's. I'm guessing that it was hand-lettering or film type. The most similar digital font I found was <a class="freelinking external" href="http://www.fontshop.com/search/?&amp;q=Waldstein&amp;x=17&amp;y=4&amp;sample_text=NOTICIARIO%20ESPANOL">Waldstein</a> from Fountain. It does not have the top serif on the A, but few fonts do. I tried to match as many letters as I could, and I think the A is the only one that would need much modification.</p>
      <p>- Mike Yanega</p>
