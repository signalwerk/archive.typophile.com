      <p>Nice job, Mike!<br>
      Just confirming: <a href="http://www.global-type.org/">Global Type</a> also credits <a href="/wiki/Karlgeorg%252BHoefer" class="wiki">Karlgeorg Hoefer</a> with being the designer of Prima.</p>
      <p>Martin Hermersdorf was a student of <a href="/wiki/Rudolf%252BKoch" class="wiki">Rudolf Koch</a>. He reworked Koch’s <a href="http://de.wikipedia.org/wiki/Offenbacher_Schrift ">Offenbacher Schrift</a>, a German Kurrentschrift to be written with the broad-nipped pen. Bavarian schools used this ‘Koch-Hermersdorf-Schrift’ as a secondary script in the 1950s. Hermersdorf also is the author of several books and was a member of the Iserlohner Schreibkreis. As far as I know, he hasn’t designed any typefaces.</p>
    html_clean: |-
