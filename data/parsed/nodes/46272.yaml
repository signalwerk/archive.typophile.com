      <p>This seems to have a strong similarity the Meier’s <a class="freelinking-external" href="http://www.fontshop.com/search/?q=Barbedor&amp;x=26&amp;y=11">“Barbedor”</a> italic, but the g is wrong, and other details don’t match, even though the feeling and style seem very similar to me. He also did “Syndor”, but it is also no more than similar. The calligraphic style also made me think of the Zapfs, but Gudrun’s “Nofret” and “Christiana” are only superficially similar.</p>
      <p>If it’s German and pre-digital it may be hard for many of us to locate good samples of typefaces from this country &amp; time. For me, Jaspert is about my only resource for this. Where is Georg?</p>
      <p>- Mike Yanega</p>
