      <p>I think I found the answer. I looked in a German book of Schreibschriften and found a font called “Prima”, which my notes showed was also included in the Jaspert book. It was a Stempel typeface from 1957, designed by Martin Hermersdorf. The text says that this “pen-drawn type was used by the Moritz Diesterweg educational publishing house in reading primers”.</p>
      <p> I overlooked it before, because it was included in the scripts, and I thought it was an italic face.</p>
      <p>- Mike Yanega</p>
