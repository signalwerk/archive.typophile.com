  html: |-
    <p>This is my first serious design, although I have been experimenting with font creators for a year or two. I would much appreciate any pointers you care to offer. At this point, I have formed all the Latin letters as well as several alternate forms for some, plus some of the punctuation and all the Latin-1 diacritics letters.<br>
    <a href="http://s1100.photobucket.com/albums/g409/pdnamateuruser/Typophile%20Images/?action=view&amp;current=Unnamed4-12-2011A.png" target="_blank" rel="nofollow"><img src="http://i1100.photobucket.com/albums/g409/pdnamateuruser/Typophile%20Images/Unnamed4-12-2011A.png" border="0" alt="Sample of unnamed typeface"></a><br>
    I have also included a complete list of the glyphs in the face thus far.</p>
    <p>It hasn't been kerned, hinted, etc. yet.</p>
    <p>EDIT: New version of PDF attached containing corrections to overshoots. I made the existing overshoot less extreme and added the ones I forgot.</p>
