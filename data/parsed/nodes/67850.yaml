  html: |-
    <p>Dear all,</p>
    <p>I tried a mark positioning feature for an arabic font with the latest FDK, but didn't succeed.<br>
    Feature looks like this (anchor positions are made up for now), as suggested in the FDK syntax definition:</p>
    <p><code>feature mark {</code></p>
    <p>	markClass [uni0651 uni064B]  @TOP_MARKS;<br>
    	position mark [uni0631]  mark @TOP_MARKS;</p>
    <p>} mark;</p>
    <p>But the marks don't position (InDesign CS3 ME 5.0.4)<br>
    Edit: the base and mark glyphs now also defined in GDEF/GlyphClassDef, but to no avail.</p>
    <p>Any ideas? Thank you in advance.</p>
