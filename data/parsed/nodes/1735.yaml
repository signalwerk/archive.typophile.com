    html: <p>Gazelle was one of those C&amp;G unique fonts. I had an SSI <br>knockoff that I adored and Mike Y. ID'd the  original as <br>Gazelle. Sort of an Arthur Bakerishly calligraphic script. <br> <br>I bought it just in the nick of time, as it turned out. Some <br>of the letter spacing could be better, but the character <br>set is fairly complete. <br> <br>It seems like when I surveyed the font offerings on the <br>website, a few of the scripts were the only faces that <br>stood out as unique. <br> <br>(What was with that Fluent Laser Fonts moniker?) <br><br></p>
    html_clean: <p>Gazelle was one of those C&amp;G unique fonts. I had an SSI <br>knockoff that I adored and Mike Y. ID'd the  original as <br>Gazelle. Sort of an Arthur Bakerishly calligraphic script. <br> <br>I bought it just in the nick of time, as it turned out. Some <br>of the letter spacing could be better, but the character <br>set is fairly complete. <br> <br>It seems like when I surveyed the font offerings on the <br>website, a few of the scripts were the only faces that <br>stood out as unique. <br> <br>(What was with that Fluent Laser Fonts moniker?) <br><br></p>
