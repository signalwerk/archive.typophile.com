    html: <p>Oops. My mistake. I was looking at faces such as <br>Sedona Script and Aurora Grotesk thinking they were <br>bundled C &amp; G fonts when in fact they are bundled <br>OPTI fonts. <br> <br>C &amp; G has a very small library it now appears, with Jott, <br>Dry Gulch and various other crud. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>bj</p>
