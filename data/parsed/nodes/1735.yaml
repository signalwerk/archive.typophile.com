    date_raw: null
    votes: null
    html: <p>I hope you don't mean their fonts. They were one of  <br>the first third-party PostScript font vendors. Their early  <br>success at selling fonts had more to do with the lack of  <br>choice than quality. They were pretty bad. Although they  <br>continued to sell them to the end, they stopped developing  <br>them long ago and went on to develop and market some  <br>very useful software--including what eventually became  <br>iTunes.</p>
