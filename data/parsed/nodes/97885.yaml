      <p>"tagline goes here": <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Dancing+Script" rel="nofollow">Dancing Script</a><br>
      Don't know the one for "Your Blog Title Here". That said, this banner looks like to be a printscreen of an online web template. These 2 texts are most probably set using (free) webfonts. It could be very easy to know the missing one , simply having a look to css/code (and even easier using <a href="/wiki/https%3A/%252Fchrome.google.com/webstore/detail/whatfont/jabopobgcpjmedljpbcaablpmlmfcogm" class="freelinking" rel="nofollow">WhatFont Chrome app</a>).</p>
      <p>EDIT: finally got it. <a class="freelinking external" href="http://www.dafont.com/-skinny-jeans.font" rel="nofollow">Skinny Jeans</a></p>
