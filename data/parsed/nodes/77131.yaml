    html: |-
      <p>In InDesign, go to File &gt; Place, find your Word document, and click "show import options" in the import window before you click OK. If you already have styles set up in Word, you can convert them directly to InDesign styles, as long as you define the InDesign styles before you import. However, if you've never designed a book in InDesign, you'll probably want a tutorial of some kind, as you mention. I'm afraid I can't think of any InDesign book design tutorials, though I would certainly recommend Bringhurst's The Elements of Typographic Style as the best basic guide to book design. Incidentally, are you the author or the designer? Or is this a self-published piece? If it's self-published, then go right ahead and design it yourself, but as you probably know, a publisher would just want the Word files so they can have their own designers design your book. Hope this helps.</p>
      <p>Josh</p>
