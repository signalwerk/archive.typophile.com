      <p><cite>What you might have to worry about are curly quotes, em dashes, and ellipses dropping out. Convert them to straight quotation marks, double hyphens, and three periods, respectively.<cite></cite></cite></p>
      <p>No publisher I know of would have trouble with these characters. The quote marks are especially best left as U+2018, 2019, 201C and 201D (e.g., "curly" quotes). There is no algorithm that can "restore" them -- try 'Twas the night before Christmas . . . And as long as the text editor at the publisher's office supports Unicode General Punctuation, it will support dashes as well. The ellipses are a different issue, some styles prefer the ellipsis character, others periods with varying spacing in between.</p>
