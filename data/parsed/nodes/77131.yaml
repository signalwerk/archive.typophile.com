  html: |-
    <p>I've recently finished a book written in Word 2010. I'm told that the final product will look far better if I use inDesign to adjust Word's somewhat clunky formatting. I now have a copy of inDesign, but no understanding of how to import Word documents and work with them. (Adobe's Help system doesn't seem geared toward importing and typesetting books.) Might anybody here be able to refer me to a suitable reference?</p>
    <p>Thanks,<br>
    Michael</p>
