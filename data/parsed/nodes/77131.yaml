      <p>If this book is your first InDesign project, I'd strongly suggest getting the assistance of someone who is proficient with InDesign to help you set up your files properly and get you started.</p>
      <p>InDesign is a complex program used primarily by graphic professionals, and there are many ways you could screw up if you make a rookie mistake. You need to properly set up master pages, auto page numbering, prepare and apply paragraph style sheets throughout &amp; character style sheets, use "space after" settings rather than blank lines to separate paragraphs, need to set hyphenation &amp; justification settings, "keep" options, maybe create a baseline grid, and on and on.</p>
      <p>I've used InDesign for years and I still screw up sometimes. Doing a book as your first project is just asking for problems unless you get some assistance.</p>
    html_clean: |-
