    html: <p>If you're intending on sending this to agents and editors, definitely don't bother with InDesign. Stick to standard manuscript format (Times or Courier, double spaced, one inch margins, single sided) and you'll be fine. What you might have to worry about are curly quotes, em dashes, and ellipses dropping out. Convert them to straight quotation marks, double hyphens, and three periods, respectively.</p>
