    <div class="info">Submitted by <a href="/user/3095" title="View user profile.">billdavis</a> : 12.Feb.2009 6.40pm </div>
      <p>Ascender is pleased to announce that enhanced versions of the Droid fonts with are now available for software &amp; hardware developers, and for creative professionals from Ascender Corp. The <a href="http://www.droidfonts.com" rel="nofollow"><strong>DroidFonts.com</strong></a> website features information about the Droid fonts which are part of Android, a complete, open mobile phone software stack.</p>
    <p>The Ascender team has continued to develop custom proprietary versions and enhanced proprietary versions of the Droid fonts for OHA members. The Droid fonts are now also available in “Pro” versions with advanced typographic features for designers and creative professionals.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/droid-fonts_4892.jpg"></div><p></p>
    <p>Steve Matteson, Ascender’s Type Director designed the original Droid fonts. They are optimized for rendering on various screen displays including user interfaces, application menus and web browsers. There are a variety of styles and weights in the Droid font family, and each font provides an extensive range of language support.</p>
    <p>“The Droidfonts.com website reflects our commitment to build the Droid font family into a complete and vibrant font collection. We are very proud that the Droid fonts have received such a positive reception” said Ira Mirochnick, president of Ascender Corp. “We will continue to work as closely as possible with the Android team and with fellow OHA members to further the development of these important UI fonts. Based on the outstanding feedback we’ve received from creative professionals, we are also happy to now offer OpenType featured “Pro” versions of the Droid fonts.”</p>
    <p>Ascender is also working on new weights, new styles, and enhanced language support (more language &amp; script coverage). The newer Droid fonts are offered by Ascender under a commercial license.</p>
    <p>The <a href="http://www.DroidFonts.com" title="www.DroidFonts.com">www.DroidFonts.com</a> website was created by Ascender to provide a comprehensive source of information about the Droid font collection. Included on the site are downloadable type specimens and an article by Steve Matteson on the making of the Droid fonts.</p>
    <p>The Droid Pro fonts consist of:</p>
    <p>    * Droid Sans Pro Regular and Bold<br>
        * Droid Sans Pro Condensed Regular and Bold (coming soon)<br>
        * Droid Sans Pro Mono Regular and Bold (coming soon)<br>
        * Droid Serif Pro Family: Regular, Italic, Bold and Bold Italic<br>
        * Droid Sans Fallback (a font with CJK support - Coming Soon)</p>
    <p>The “Pro” versions of these fonts in both OpenType and TrueType font format. These versions include Old Style Figures, which require an OpenType-saavy application such as InDesign. The Droid Pro fonts are available for purchase and instant download from either the <a href="http://www.DroidFonts.com" title="www.DroidFonts.com">www.DroidFonts.com</a> website, or the <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a> website.</p>
