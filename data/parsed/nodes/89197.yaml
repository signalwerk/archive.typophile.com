      <p>Designed by <a class="freelinking external" href="http://www.stockholmdesignlab.se/en/projects/peak-performance-2/logotype/" rel="nofollow">Stockholm Design Lab</a>. You could just ask them. </p>
      <p>There’s no date on that site for this design, but I seem to remember it going back quite a while. Peak Performance was the go-to brand for rich kids when I went to primary school in the early 90s. Perhaps what I remember was the old mark, and the new one just does its job so well I never thought about the change?</p>
