      <p>New for 2006</p>
    <p><a href="/wiki/Rimmer%252BType%252BFoundry" class="wiki">Rimmer Type Foundry</a><br>
    —————————-<br>
    <a href="/wiki/P22%252BType%252BFoundry" class="wiki">P22</a> is pleased to announce the availability of the <a href="/wiki/Jim%252BRimmer" class="wiki">Jim Rimmer</a> Collection. This digital type collection is the culmination of decades of typographic work at his <a href="/wiki/Pie%252BTree%252Bpress" class="wiki-create">Pie Tree press</a> and type foundry. This is the first time these fonts are available to the public. The brand new website shows the range of Mr. Rimmer’s work: from the Sans serif families Credo and Dokument suitable for text setting to the expressive Zigarre Script and Poster Paint display fonts. Over 150 individual fonts plus many expanded Opentype vesions which include various styles of figures, small caps and expanded language sets.<br>
    <a href="http://www.p22.com/rtf/">http://www.p22.com/rtf/</a></p>
    <p>Introductory Specials<br>
    ——————————-<br>
    For the month of January 2006, get 15% off of the Rimmer fonts in their set groupings. Single fonts such as Cadmus, Zigarre &amp; Fellowship are 15% off and full sets such as<br>
    Albertan-28 fonts, Dokument-90 fonts &amp; Elizabeth-4 fonts, are 15% off. Partial sets or single fonts that are also part of sets are regular price.</p>
    <p>Purchase the full Jim Rimmer Collection for less than 1/3 the regular price if purchased individually. The price for the collection is $906 for the month of January ’06.</p>
    <p>There is also a special offer on the new private press book “Leaves from the Pie Tree” which documents Mr. Rimmers life in Type. See more details here: <a href="http://www.p22.com/rtf/">http://www.p22.com/rtf/</a></p>
    <p>P22 Club<br>
    ————<br>
    Join the P22 Club and get 20% off everything, including sales (that means 20% off + 15% again off with the Rimmer font discount!) all year plus much more. See details:<br>
    <a href="http://www.p22.com/members/club.html">http://www.p22.com/members/club.html</a></p>
    <p>2006 Constructivist Mugs - Back in Black<br>
    ————————————————————<br>
    Our ever-popular constructivist “Better Coffee for Better Workers” Mug has just arrived in their latest incarnation. This time they are red and white on black with the year<br>
    “2006”. <a href="http://www.p22.com/products/mugs.html">http://www.p22.com/products/mugs.html</a></p>
    <p>That is all for now. Happy 2006!</p>
