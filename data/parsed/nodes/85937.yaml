  html: |-
    <p>This is not a genre of typefaces I usually spend a lot of time pondering, so I thought I would ask y'all for suggestions.</p>
    <p>Looking for a cursive, italic or possibly script font, at least moderately bold. It needs to be highly legible, warm, personal, and modern. Not too formal/frilly. Sauna Bold Italic (probably swash?) is the first thing that comes to mind.</p>
    <p>Thoughts?</p>
    <p>T</p>
    <p>[Edit: moved to General Discussions]</p>
