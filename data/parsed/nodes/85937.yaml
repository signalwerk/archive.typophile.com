      <p>Extra info point: this is for a logo design.</p>
      <p>Those are all interesting suggestions! Capucine seems close to what I had in mind, but Coline Cursive and Insouciant are intriguing directions. Andron seems almost too normal/traditional for this purpose, but one of the letters that would feature in the logo is particularly gorgeous, so maybe!</p>
      <p>It will be interesting to see what catches the fancy of the designer working with this. </p>
      <p>Thank you all for taking the time to consider my question. Further ideas still appreciated, at least for another day or so!  :)</p>
      <p>Regards,</p>
      <p>T</p>
