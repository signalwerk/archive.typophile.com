  html: |-
    <p>This is for my Dad's sidecar to show that he owns/sponsors <br>the bike. It will probably be quite large, and I think the side <br>car will be bright yellow. I want it to be simple because they <br>go quite fast, and a fancy logo will be lost. It is also a  <br>prototype of a 'stemless' typeface I am working on. <br> <br>kris <br> <br> <br></p>
