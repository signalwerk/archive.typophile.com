    <p>Hi All, (from a first time poster)</p>
    <p>Would any of you distinguished readers here have a considered opinion to offer on the following two scenarios regarding use of modern digital fonts for hot metal type.  </p>
    <p>1: A Ludlow LineCaster makes use of loose matrixes to make up lines of type that are commercially used in hot-foil stamping and in some other applications.  The font matrixes are rather complex to prepare and one needs enough letters to set a whole line of type. Each font matrix would be used with just one Ludlow for generating text line slugs for use on multiple presses.  Many matrix sets could be machined.</p>
    <p>2: A Monotype SuperCaster makes use of loose matrixes to cast loose type that can be set into copy or collected into a complete font for hand set letterpress. These matrixes are less complex to machine and only one of each character is required.  The set type would be used to print at one location but multiple complete fonts could be cast and used in multiple locations.  Again multiple matrix sets could be machined.</p>
    <p>Other than free fonts what sort of license might cover the intended use where the cast lines, fonts of type or casting matrixes are distributed?</p>
    <p>Regards</p>
