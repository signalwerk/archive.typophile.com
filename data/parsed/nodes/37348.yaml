      <p>KalleP</p>
      <p>There really is little point to this. A significantly large and growing percentage of the letterpress community already use digital type for printing, and less and less use metal type. Your conversion costs are prohibitive and the potential market is nil (if not, the metal type foundries would not have vanished like buffalo on the Great Plains). As the fellow said in The Graduate, plastic is the future. Photopolymer that is.</p>
