      <p>There is one very important point you need to clarify before you can expect and informed answer, and that is: How will the matrices be machined? If you use the font outlines (the "computer program" part of a font, which is copyrightable) to generate CNC or similar code to drive a mill, you will be running afoul of the prohibition against adapting, translating, reverse engineering, decompiling, disassembling or creating derivative works provisions in most standard End-User Licensing Agreements, and you will need to negotiate a special agreement to accommodate such use.</p>
      <p>And please do not assume that any font which is free to <em>use</em> is therefore free to adapt/translate/etc.: the code is still protected, and a special agreement for its use is also in order.</p>
