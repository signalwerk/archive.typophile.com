      <p>Kalle,</p>
      <p>I would look at it from a different angle: Invite type foundries to have their designs produced in metal. I think some would be very interested, and you could simply negotiate an arrangement for them to receive some royalties or payment for fonts sold. Then the entire operation is legitimate. Not sure how large the market will be for the fonts, though. </p>
      <p>Personally I've been thinking about how to get new type designs produced in metal, but for some reason I want to take the difficult path and cut my own punches. </p>
      <p>Good luck, and keep us posted!</p>
