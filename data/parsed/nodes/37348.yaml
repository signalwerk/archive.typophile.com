      <p>Hi oldnic, delve,</p>
      <p>Well the idea would be to use CNC machining and some derivative of the digital font description to generate the shapes (faithfully with minimum effort and errors).  I see how limitations on derivative works would restrict use of the copyrighted outlines in general. Would scanned copies of printed output (or pixel based renderings) be a way to avoid the copyright in all/most cases (requiring a name change if not sanctioned)?</p>
      <p>The hope would be to use the mats to cast lines of type on the Ludlow or fonts of type on the SuperCaster for money, for the use of those people who need and/or like letterpress but desire some modern fonts.  I agree that the independent digital font foundries would be more likely to entertain the concept even though the intended use is not real competition to anyone and might occasionally result in a marketing coup.</p>
      <p>I realise now that I should have asked my question thus:  <strong>What standard (free or for a fee) digital font license models cover (optionally marketable) analogue copies of the font?</strong></p>
      <p>The answer may turn out to be none.</p>
      <p>Regards</p>
