      <p><em>What standard (free or for a fee) digital font license models cover (optionally marketable) analogue copies of the font? </em></p>
      <p>You should look at what you are proposing as offering the font design in another format, so just as a TrueType to Opentype conversion would require licensing to market, so would a digital to analogue. Whether it is Ludow Mats or rubber stamps, even if the original bezier points are gone, the design remains a derivative product in a new format that owes its entire existence to that design. Licensing or foundry agreement would be a prudent first step.</p>
      <p>I know of at least one foundry already working on a metal/digital release.<br>
      ;^)</p>
