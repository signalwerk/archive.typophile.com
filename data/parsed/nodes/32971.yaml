    user_id: 18036
    user_name: schmuckatelly
    user_path: null
    user_image: null
    date_raw: 14 Apr 2007 — 2:47am
    date: 2007-04-14T02:47:00
    votes: null
    html: |-
      <p>I'm not 100% sure but I think he actually studied Langdon. I can't be sure until I ask him though. He searched and searched for resources on ambigrams and found very little. He worked as well as he could around what research he could find but a lot of the work was based on his own sketches. He also related his ambigrams on life experiences and real-world situations.</p>
      <p>I don't mean to be rude or anything, but your project never would have passed in the program that I'm going through. Much less, it would not have passed the proposal stage. The guy that did the ambigrams was sort of lucky. He basically stood his ground with the idea until they finally said "ok you want to do this project so you better come back with something good." Even now they tell him this project is meaningless but I encouraged him to stick with it and make it a real study of type. While his project could have been much more thorough, I think he did a good job of creating his own ambigrams. We talked about not only creating orientation reversals, but contrast situations, opposites and synonyms reversed as well as the integration of image and text. It came out quite successful. Not only that, he made the ambigrams illustrate the meanings of the words that they represented. The letterforms became the image without any support of photography.</p>
      <p>Again, not to bash your project, I'm glad you made the effort, but a large portion of that we have seen before. That's why I would have urged you to do more with manipulating the type to make it your own. It seems as if the background images are doing more than what the type is doing. I know you said there was careful deliberation in choosing the type. But where does deliberation within your font list end and creativity begin? You know well enough that choosing a typeface is not the terminal decision. You have every bit of control after the fact. The font choice is only a starting point. It's what you do with it afterward is where you make the expression. Are you passionate about type or not? If you are, then go there. Go there or don't go at all. That's what we always say.</p>
      <p>Typography is a very difficult skill to grasp within graphic design or any of the arts for that matter. You're never going to get it perfect. It's really just an exercise in getting it as close as you can. And that's really the way you have to look at it. Never get discouraged when you don't get it perfect but, at the same time, never be satisfied. You have control. Sieze it.</p>
