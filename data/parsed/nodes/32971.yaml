    <p>It's been a long hiatus from Typophile for me this past school year, I've been super busy and have not only my Thesis project, but also an award from American Corporate ID 23 for some knock down packaging design I did in the fall! It will be featured in October's hard bound annual. Just wanted to say hello and I should be frequenting the boards more often again. I'll post a seperate topic for the packaging project soon.</p>
    <p>Without further ado, I'd like to send a special thank you to the type designers (some who are members and some whom aren't) that donated faces for my project, it couldn't be what it is without your help! Michael Abbink, Paul Hunt, Ray Larabie, Mark Simonson, Richard Kegler &amp; Patrick Griffin, thank you soooo much.</p>
    <p>UPDATE:</p>
    <p>Screen res. PDF: <a href="http://www.davebailey.us/stuff/david.bailey.thesis.pdf" title="http://www.davebailey.us/stuff/david.bailey.thesis.pdf">http://www.davebailey.us/stuff/david.bailey.thesis.pdf</a></p>
    <p>Contact me if you'd like a high res. PDF for any education reason!</p>
