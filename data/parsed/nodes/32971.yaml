      <p>schmuckatelly: I'm glad you enjoyed it, but am confused by your statement "It looks like you simply chose a font and typed the words out" as there was careful deliberation over each typeface chosen for the project to integrate it with the appropriate imagery and context. The point was to use exclusively type set words and an image to convey an idea or juxtaposition. Each piece of typography was carefully considered and the overall feel of the book was to be 'fun' but nothing of the 'grunge/flourish/trendy' design thematics you see often nowadays. I'd also like to add that most of the logos had to be redrawn by hand and then digitized, quite a bit of work in itself.</p>
      <p>I'd be interested in seeing your friend's thesis, as John Langdon (<a href="http://www.johnlangdon.net" title="http://www.johnlangdon.net">http://www.johnlangdon.net</a>) is my professor/mentor/employer. I've designed ambigrams myself and have one I designed tattooed on my back.</p>
