    html: |-
      <p>Well, either could be correct -- depends on what you mean:</p>
      <p>tote (toting): to carry by hand; bear on the person.</p>
      <p>tout (touting) has lots of meanings, from "to spy out" through "to solicit bets", to "to make much of, promote."</p>
      <p>I still remember an experience in 1980 or so, when setting the <cite>South Atlantic Quarterly</cite> -- I got "Jane Austen" right on the article opening, but got the running heads as "Jane Austin." It was printed that way, fortunately caught in F&amp;Gs. I offered to pay for the reprinting, but the publisher allowed the proofs had been seen by a number of people, none of whom caught the error, so they would absorb the cost of reprinting.</p>
