      <p>Earache Records complilation recorded by Mark Smoot @ in July of 1992. As far as I know, this compilation is no longer available in the U.S. due to a lawsuit from Evian.</p>
      <p>view image: <a href="http://i68.photobucket.com/albums/i28/schmuckatelly/naive_cover_T.jpg" title="http://i68.photobucket.com/albums/i28/schmuckatelly/naive_cover_T.jpg">http://i68.photobucket.com/albums/i28/schmuckatelly/naive_cover_T.jpg</a></p>
      <p>I enjoyed looking at this project. I'd much rather see more experimentation with wordforms rather than just making a cool looking alphabet like so many tend to want to do. However, I wish there could have been more interesting or unique type used. It looks like you simply chose a font and typed the words out. Maybe you could have manipulated some of them to make them your own. I dunno. I'm not giving you a hard time. Like I said, I enjoyed the project but considering I've seen a lot of them before, I suppose more type manipulation would have made up for it. Make the words behave more like images and let the actual images recede. Make it about type! These are the kinds of things I've had to go through. My profs are never satisfied. Heh.</p>
      <p>I have a friend that is presenting his thesis on ambigrams today. Wish him luck!</p>
