    <p>Hi everybody.</p>
    <p>I'm working in a identity project, I like Dessau Pro Drei for the wordmark but is only available in a package and cannot be purchased separately.</p>
    <p>I'm looking for alternatives, nothing too expensive.</p>
    <p>Thanks in advance.</p>
