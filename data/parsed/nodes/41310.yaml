    <p>Hi,</p>
    <p>Created this typeface with FontForge after getting the bug one afternoon to finally (10 years after college) do something that I've wanted to do ever since I discovered the department's racks of lead type, and the stacks of specimen books in the graphic design lab.</p>
    <p>Anyway, the result is, I think, sort of a cross between a humanist sans-serif and a display/handwritten font.</p>
    <p>I laid out the stroke weights and shapes mostly by sight and comparison. I wanted, at larger sizes, more variety than you get with typical sans-serifs, but without verging too far into the script/hand written side of things.</p>
    <p>Anyway, let me know what you think.</p>
    <p>PS: No kerning pairs yet. Still trying to get good sidebearings.</p>
    <p>Rich</p>
