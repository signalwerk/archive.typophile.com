      <p>Here is what they state on <a href="http://www.typography.com/fonts/whitney/styles/whitneymultiscriptedition" rel="nofollow">Whitney Multiscript Edition</a>:</p>
      <blockquote><p>
      <strong>Whitney Multiscript Edition — </strong><strong>Best Value</strong><br>
      The complete Whitney collection: a single set of OpenType fonts integrating the Pro editions of all three character ranges (Latin-X™, Greek, and Cyrillic-X™). Includes Romans, Italics, plus Roman Small Caps and Italic Small Caps, each in six weights (Light, Book, Medium, Semibold, Bold, and Black), with tabular figures, fractions and extended symbols for each font style — plus the sixteen-style Whitney Index family.
      </p></blockquote>
      <p>+35 minutes...<br>
      I was wondering what "Roman smallcaps" and "Italic smallcaps" mean. Looking at their <a href="http://www.typography.com/fonts/whitney/characters/" rel="nofollow">Character set</a>, it seems there is neither Greek smallcaps, nor cyrillic smallcaps.</p>
