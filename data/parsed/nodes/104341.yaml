    votes: null
    html: |-
      <p>Nick, I don't get to pick the typeface on this one. For good or ill, the client has specified Skolar for the text, with Whitney display. I don't have the MS in hand yet. If there is polytonic Greek in the display, we'll have to figure something out. Oh well, that's what comps are for. Get the accents/breath marks from a different font, &amp; place by hand... very slowly...</p>
      <p>Hrant:</p>
      <p>Maybe. It's hard to figure out from all their advertising, but so far, it seems so. I take</p>
      <blockquote><p>In preparation for moving its library into OpenType, H&amp;FJ established the Language Research Program in 2005, in order to develop updated specifications for its Latin-based character sets. The initial product of this research is H&amp;FJ’s Latin-X™ character set, which expands the reach of a typeface to an additional 200,000,000 readers worldwide. This character set reflects not only a more accurate awareness of the political landscape of language, but the most up-to-date understanding of cultural norms.</p></blockquote>
      <p>to be an attempt to put a positive spin on the fact they aren't offering OpenType fonts yet. Just look at the pricing for "Basic" &amp; how much more adding the small caps is (and as a separate set of fonts, which means even more more handwork for use). The "multiscprit" fonts cost more than twice the "basic," a pricing I find predatory. Of course, I'm a curmudgeon...</p>
      <p>I've always taken H&amp;FJ to be in the advertising world, one which has rare overlap with books. Their pricing models seem to fit that, too. But again, I'm a curmudgeon...</p>
