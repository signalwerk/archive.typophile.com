  html: <p>Hello everybody, this is my first contact and I would like to have your critique for a font i started to work on. I applied the characters on the cliché  phrase "the brown fox..." and to a logo (the logo is fiction, just to try the types). For the moment i have designed just the lowercase, and in the future i will plus greek letters (i am from Greece). <br>I would appreciate it if you could give me your views plus I would be greatfull to receive some methodological informations on how to develop my work. <br> <br>thank you <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="sample1.gif"> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="logo.gif"></p>
