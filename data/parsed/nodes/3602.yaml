    html: <p> Thank you John for your notices, I overlooked on the letters you mentioned and i think you are right. So, i expanded a little bit the horizontal stems of "e" and I applied the diagonal cut edge on the descender of "h". The problem is still with "z" and is called "diagonal stem"...you see in none of the types i used diagonal stems, so i tried to keep a vertical stem for "z", too. To be honest, now that i used it i like it and i think it fits between the neighbooring types, but still there are no other angled stems around, so is this convinient? I tried also a "z" with descender, but maybe this is too strange and i want to know if it is legible to you, beyond any historical taboos...thanks again for your advices <br> <br>...i just read your notes Tanya, i will try them later. <br> <br>\image-(sample2) </p>
