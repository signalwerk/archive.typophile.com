    <p>Hello,<br>
    i`m doing research on typefaces used on railway stations across Europe. I found this two  examples from  beginning of 2oth century (Austro-Hungarian Empire). I wonder if these are custom made? Or does any one know for simmilar typeface from that period?<br>
    All thoughts are welcome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile_6406.jpg"></div><p></p>
