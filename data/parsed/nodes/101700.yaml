      <p>This may not be of any help to you, but I found a font similar to your top image called probel c. It was designed by <a href="http://www.letterhead.ru/Fonts/index.html" title="http://www.letterhead.ru/Fonts/index.html">http://www.letterhead.ru/Fonts/index.html</a>. However as you will see, its no longer listed among their fonts, but if it's close enough, you may be able to email them. </p>
      <p>This is the bio from myfonts, so one of the other designers may have created the font and left the company. I wasn't able to even get a google link to the font. <a href="http://www.myfonts.com/foundry/LHS-IG/" title="http://www.myfonts.com/foundry/LHS-IG/">http://www.myfonts.com/foundry/LHS-IG/</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/probel c font_3722.png"></div><p></p>
