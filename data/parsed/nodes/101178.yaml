  html: |-
    <p>I have been using the Unifraktur Maguntia font in Microsoft Word, and had this idea to use a macro to automatically insert ligatures and special characters such as the long s.  Does anyone know if this has been done before and if there is already such a tool in existence?  David Manthey used the same idea on his 18th century Caslon font:<br>
    <a href="http://www.orbitals.com/self/ligature/ligature.htm" title="http://www.orbitals.com/self/ligature/ligature.htm">http://www.orbitals.com/self/ligature/ligature.htm</a></p>
    <p>One of the nice things about Unifraktur Maguntia is that it includes all the necessary ligatures and historic characters.  Here is some more information:<br>
    <a href="http://unifraktur.sourceforge.net/maguntia.html" title="http://unifraktur.sourceforge.net/maguntia.html">http://unifraktur.sourceforge.net/maguntia.html</a></p>
