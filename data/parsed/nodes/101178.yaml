      <p>Since said macro would be nothing more than a long sequence of search and replace actions, why not just record it yourself?</p>
      <p>A much better solution would be to use an app that understands OpenType, so that it can do it for you automagically. I hear that InDesign and current versions  of Word have the necessary smarts, and I know that XeTeX does, so you have options.</p>
