      <p>I also looked in the Photo-Lettering catalogs I have and found a typeface called Niebolo Moonwalk, which is more like your sample, but still not identical. I am still leaning towards an original design, although I am sure my collection is not complete enough to be sure about that.</p>
      <p>- Mike Yanega</p>
