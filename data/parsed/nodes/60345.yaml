      <p>I have looked in all the books I have that might show this style, including a number of Dan Solo’s books for Dover. There was a typeface called Atlas which is somewhat similar, but other than Bifur (also known as Matra) and Sinaloa there wasn’t much else that was very similar. It’s possible that they used an original (custom) design for that titling. All the shading lines are straight lines, so it may have been fairly easy to create.</p>
      <p>- Mike Yanega</p>
