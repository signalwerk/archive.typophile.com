  html: "<p>July 7, 2003 Malmo, Sweden  <br> <br> <br>The Fountain catalogue has been updated with the 3 new type families: <br> <br><a href=\"http://www.fountain.nu/catalogue/alita.asp\" target=\"_blank\"> Alita</a> - a text face placed somewhere between renaissance and transitional Antiqua, designed by Peter Hoffmann. <br> <br><a href=\"http://www.fountain.nu/catalogue/paracelsus.asp\" target=\"_blank\"> Paracelsus</a> - a modern take on the old gothic type form called Schwabach, designed by Lars Bergquist. <br> <br><a href=\"http://www.fountain.nu/catalogue/waldstein.asp\" target=\"_blank\"> Waldstein</a> - a Scotch typeface named after young Beethoven's mecenat, this is also designed by Lars Bergquist.  <br> <br> <br>We have added a new section to the site called - <a href=\"http://www.fountain.nu/catalogue/catalogue_overview.asp\" target=\"_blank\"> Visual Overview</a> - where you can take a fast peek on our whole collection of typefaces. <br> <br> <br>The second release will be next week when we release 2 new fonts by Martin Fredrikson, plus an update of some of his earlier typefaces. <br> <br>You can also take a <a href=\"http://www.fountain.nu/catalogue/catalogue_overview.asp\" target=\"_blank\"> peek</a> at some of our upcoming fonts <br> <br> <br> <br>have a nice day <br> <br>Peter Bruhn, principal designer &amp; owner <br><a href=\"http://www.fountain.nu/\" target=\"_blank\">http://www.fountain.nu/</a> <br> <br> <br></p>"
  html_clean: "<p>July 7, 2003 Malmo, Sweden  <br> <br> <br>The Fountain catalogue has been updated with the 3 new type families: <br> <br><a href=\"http://www.fountain.nu/catalogue/alita.asp\" target=\"_blank\" class=\"link-external\"> Alita</a> - a text face placed somewhere between renaissance and transitional Antiqua, designed by Peter Hoffmann. <br> <br><a href=\"http://www.fountain.nu/catalogue/paracelsus.asp\" target=\"_blank\" class=\"link-external\"> Paracelsus</a> - a modern take on the old gothic type form called Schwabach, designed by Lars Bergquist. <br> <br><a href=\"http://www.fountain.nu/catalogue/waldstein.asp\" target=\"_blank\" class=\"link-external\"> Waldstein</a> - a Scotch typeface named after young Beethoven's mecenat, this is also designed by Lars Bergquist.  <br> <br> <br>We have added a new section to the site called - <a href=\"http://www.fountain.nu/catalogue/catalogue_overview.asp\" target=\"_blank\" class=\"link-external\"> Visual Overview</a> - where you can take a fast peek on our whole collection of typefaces. <br> <br> <br>The second release will be next week when we release 2 new fonts by Martin Fredrikson, plus an update of some of his earlier typefaces. <br> <br>You can also take a <a href=\"http://www.fountain.nu/catalogue/catalogue_overview.asp\" target=\"_blank\" class=\"link-external\"> peek</a> at some of our upcoming fonts <br> <br> <br> <br>have a nice day <br> <br>Peter Bruhn, principal designer &amp; owner <br><a href=\"http://www.fountain.nu/\" target=\"_blank\" class=\"link-external\">http://www.fountain.nu/</a> <br> <br> <br></p>"
