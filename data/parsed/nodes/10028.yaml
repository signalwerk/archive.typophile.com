    html: <p>There are certain fonts and also specific items that get requested over and over again (like the Bjork fonts or the Gucci logo). With the fonts, it is simply that they are popular or trendy. Or sometimes it's just a weird cluster. With the logos, it's people who don't bother to do a search before posting a request. Also the search feature isn't that good. <br> <br>It's been suggested before to make a greatest hits list  for people to check before they post a thread but who has the time???  <br> <br>Also, people who aren't in the design business don't necessarily know that a lot of corporate logos, magazine fonts, etc are custom or proprietary and therefore not available to us peons.</p>
