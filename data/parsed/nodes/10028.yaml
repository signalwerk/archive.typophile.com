    html: <p>As a frequently disappointed believer in the value of FAQ's (look at how often we get the same 'what's this font?' subject lines), I tend to agree with Franz, although an illustrated list would be much more accessible to even the most reluctant (lazy) font hunters.  <br> <br>You might say, 'They made some effort to get here, so maybe they would be willing to look through a list of common requests'. My reply would be, 'Of course no one thinks their request is 'common', so who would look at it?' (You would probably have no way of knowing that you were requesting something commonly asked about.) <br> <br>However, with so many people willing to collaborate in making the list, it's hard to argue against trying it.  <br> <br>I would add Neutraface to the list, and whatever everyone agrees is the best Boston Red Sox font these days.</p>
