      <p>I don’t know anything about Python, but I assume, that the problem with the "C sub …" is located at the following lines in TTXN.py:</p>
      <p><code>ChainINDENT = INDENT + " C "</code></p>
      <p>May it be, that not the character "C" was meant, but a control character?</p>
      <p>And the other problem may be located here, although there are more lines like that:</p>
      <p><code>rule = "sub %s %s' %s by " % (backTxt, inputTxt, lookAheadTxt)</code></p>
      <p>%s seems to be a placeholder for the variables (?) in the parentheses.</p>
      <p>In contradiction to other lines, in which anything is substituted there is no placeholder after the word by.</p>
      <p>I don’t want to try to correct anything in code, that I don’t understand. But I assume, it is not so difficult to fix these bugs. But maybe there are more bugs, which I have not yet discovered.</p>
      <p>-----------</p>
      <p>I wish, more of you would use the AFDKO instead of FontLab for generating the features. I mean, I am amateur, but there seem to be many professionals on the forum, that use FontLab for the OT features. But the AFDKO is really cool and as more people find those bugs, as easier it is, to improve the AFDKO.</p>
