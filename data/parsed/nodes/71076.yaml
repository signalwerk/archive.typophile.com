      <p>I was indeed replacing line 34 with two lines, 34 and 35, with the same indentation as old line 34, i.e. the <code>if</code> of line 35 is aligned with <code>version</code> of line 34 (which remains where it was). Here is how it looked on the screen with the proper indentation.<br>
