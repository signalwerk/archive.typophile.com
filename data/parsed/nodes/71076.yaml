    html: |-
      <p>Here is a copy-paste from <a href="http://fontforge.sourceforge.net/featurefile.html" title="http://fontforge.sourceforge.net/featurefile.html">http://fontforge.sourceforge.net/featurefile.html</a>. This is what George Williams says about it (or at least about the specs)</p>
      <p><strong>Major differences between FontForge's and Adobe's interpretation of feature files</strong></p>
      <p>Not really any, any more. Except that FontForge supports much of the syntax which adobe documents but does not support. Adobe continues to reserve the right to change the syntax of anything they do not currently support.</p>
      <p>In November 2008 Adobe made radical changes to the feature file format. This meant that my extensions were no longer needed. It also as an incompatible change from the earlier format. FontForge should (still) be able to parse files written in the earlier format, as well as files written in the new format. It will only produce files in the new format now (actually there is a compile time flag which will revert output to the old format, but I haven't tested it).</p>
