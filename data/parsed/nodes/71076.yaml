      I have an old version of Calibri with a different number of pairs. The one you get is the one John Hudson says there is. You thus got the right number. The funny thing is indeed that if you run ttx on the resulting file, it gives you back the big kerning table. You can see it with DTL OTMaster Light.<p></p>
      <p>What worries me is the specs, that I don't want to read, and I did not check either what struct.unpack actually does.</p>
