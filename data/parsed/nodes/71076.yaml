      <p>You can also generate the feature file with FontForge. PC users can use <a href="http://www.geocities.jp/meir000/fontforge" rel="nofollow"><strong>fontforge-mingw</strong></a>, a self contained  binary  (cf <a href="http://www.typophile.com/node/71038" title="http://www.typophile.com/node/71038">http://www.typophile.com/node/71038</a>). Mac users can install FontForge with <a href="http://pdb.finkproject.org/pdb/browse.php?summary=fontforge" rel="nofollow"><strong>Fink</strong></a> (binary) or  Macports (requires compiling).</p>
      <p>On the mac I dot it with a script; doing the same on the PC is more tricky and I  won't have access to that machine before wednesday and I tried just once, to check.  I'll thus just say how to do it with the graphical interface. After opening the font.</p>
      <p>You click "Element &gt; Font Info"<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fontinfo_6600.jpg"></div><p></p>
      <p>You then click "Lookups", <strong>right click</strong> on a feature and click on "Save Lookup..." to save the feature file for that lookup. You click on "Save Feature File..." to save the full feature file of that font.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/savefeatures_3773.jpg"></div><p></p>
