  html: |-
    <p>It’s from Minion Pro, dumped with TTX<strong>N</strong>:</p>
    <p>         <code>lookup frac_DFLT_dflt_2 {<br>
                sub [eight.numerator five.numerator four.numerator nine.numerator one.numerator<br>
                      seven.numerator six.numerator three.numerator two.numerator<br>
                      zero.numerator]<br>
                   [space uni00A0]' ;<br>
                    C sub space by space.frac;<br>
                    C sub uni00A0 by uni00A0.frac;<br>
             } frac_DFLT_dflt_2;</code></p>
    <p>"C sub"? (A working) TTXN would be cool, because when you have to fix a bug in the features of a font, you cannot really trust in FontLab, because it interprets the GSUB table likewise. After removing the GSUB tags, it should be possible to use the dumped table as feature file with makeotf (belongs to the AFDKO).</p>
    <p>TTXN does not seem to be able to store the classes, but puts the character lists directly into the features. That’s not a bug, but should be fixed likewise.</p>
    <p>And TTXN does sometimes not include, by which character/class something shall be replaced (End of code: "zero.numerator]' ;"):</p>
    <p><code>lookup frac_DFLT_dflt_5 {<br>
                sub [cent.denominator comma.denominator dollar.denominator eight.denominator<br>
                      five.denominator fiveeighths four.denominator fraction hyphen.denominator<br>
                      nine.denominator one.denominator oneeighth onehalf onequarter onethird<br>
                      parenleft.denominator parenright.denominator period.denominator<br>
                      seven.denominator seveneighths six.denominator slash.frac<br>
                      three.denominator threeeighths threequarters two.denominator twothirds<br>
                      uni2215 zero.denominator]<br>
                   [cent.numerator comma.numerator dollar.numerator eight.numerator<br>
                      five.numerator four.numerator hyphen.numerator nine.numerator<br>
                      one.numerator parenleft.numerator parenright.numerator period.numerator<br>
                      seven.numerator six.numerator three.numerator two.numerator<br>
                      zero.numerator]' ;</code></p>
