      <p>Arno,</p>
      <p>As was noted in the <a href="http://typophile.com/node/70841" rel="nofollow">Calibri kerning</a> thread and in <a href="http://www.typophile.com/node/71068#comment-414569" rel="nofollow">John Hudson's comment</a> in the <a href="http://www.typophile.com/node/71068" rel="nofollow">Checking Kerning Pairs in fonts</a> thread, ttx does not output all a kern subtable when it overflows.</p>
      <p>Here is a patch for the file <code>_k_e_r_n.py</code>.<br>
      <code><br>
      34c34,35<br>
      &lt; 				version, length = struct.unpack("&gt;HH", data[:4])<br>
      ---<br>
      &gt; 				version, length, coverage, nPairs = struct.unpack("&gt;HHHH", data[:8])<br>
      &gt; 				if ((self.version == 0.0) &amp; (length &lt; 14+6*nPairs)): length = 14+6*nPairs # Undocumented hack<br>
      </code><br>
      If I apply it, I get all kerning pairs of Calibri's <code>kern</code> table with ttx and ttxn. </p>
      <p>I have no time to check if this is ok or not for all possible cases. If you want to have a look at that, that would be great.</p>
