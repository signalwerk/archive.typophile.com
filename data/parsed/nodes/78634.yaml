      <p><a href="http://www.fontshop.com/fonts/singles/creative_alliance/flood_std/?&amp;sample_text=When%20Experience%20Matters&amp;sample_size=32&amp;acs_pt=32&amp;update=0" rel="nofollow">Flood</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/comicraft/dear_diary_ot/?&amp;sample_text=When%20Experience%20Matters&amp;update=0" rel="nofollow">Dear Diary</a><br>
      If you use a font like these two that doesn't have multiple glyphs for each character, make sure you modify the 'T's and 'E's to make it more like real writing.</p>
      <p>That said, real writing is probably the best way to go. Hire a lettering artist. Might not be that much more expensive than a font, and you'll get something authentic and unique to your company.</p>
