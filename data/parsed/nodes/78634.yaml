    date: 2011-02-02T11:57:00
    votes: null
    html: <p>Nick, OIWON is exceedingly cool, but I really think you should go all out to get the entry stroke into "e" smooth in every instance, and at a consistent angle, for a completely natural cursive simulation. Sure, it's a ton of work doing alternates for multiply-accented characters, but it will be worth it.</p>
