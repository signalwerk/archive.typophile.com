    votes: null
    html: <p>Old ATF type specimens tell the story of Prohibition in the US. Pre-1920 specimens use the pangram <em>Pack my box with five dozen liquor jugs.</em> Prohibition-era specimens say <em>Pack my box with five dozen jugs</em> (which isn't technically a pangram, lacking the <strong>l</strong>, <strong>q</strong>, and <strong>r</strong>).</p>
