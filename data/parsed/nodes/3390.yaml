    html: "<p>Miguel, I think the idea of \"stealing\" and <br>plagiarism in low-res bitmap fonts is elusive to <br>say the least. There's only so much one can do <br>with that few pixels. In the case in point, the <br>idea is not terribly original anyway, and as one <br>reduces the design grid, solutions naturally <br>tend to converge. Of course, there's always <br>scope for some personality: for instance, your <br>Three-Dots 'E' is rather original (and not very <br>legible ;), but it's in any case slightly similar <br>to the one in an <a href=\"http://www.typophile.com/forums/messages/30/753.html?#POST4768\" target=\"_blank\">exercise</a> done by a student <br>of mine a few years ago - and you didn't know <br>it (of course, the art-déco guys had done this <br>sort of 'E' 70 years before Gustavo or you ;). <br> <br>I'd think very hard before deciding that a low-res <br>bitmap font was \"stolen\". Having said that, I <br>should add that I didn't bother to enlarge the <br>image of Absolute Minimal to check if there's <br>any unexpected similarity to your design. <br>Cheers.</p>"
    html_clean: "<p>Miguel, I think the idea of \"stealing\" and <br>plagiarism in low-res bitmap fonts is elusive to <br>say the least. There's only so much one can do <br>with that few pixels. In the case in point, the <br>idea is not terribly original anyway, and as one <br>reduces the design grid, solutions naturally <br>tend to converge. Of course, there's always <br>scope for some personality: for instance, your <br>Three-Dots 'E' is rather original (and not very <br>legible ;), but it's in any case slightly similar <br>to the one in an <a href=\"http://www.typophile.com/forums/messages/30/753.html?#POST4768\" target=\"_blank\">exercise</a> done by a student <br>of mine a few years ago - and you didn't know <br>it (of course, the art-déco guys had done this <br>sort of 'E' 70 years before Gustavo or you ;). <br> <br>I'd think very hard before deciding that a low-res <br>bitmap font was \"stolen\". Having said that, I <br>should add that I didn't bother to enlarge the <br>image of Absolute Minimal to check if there's <br>any unexpected similarity to your design. <br>Cheers.</p>"
