    html: <p>I'd never seen any absolute minimal bitmap font before.  I'm sure I'm not the first to do one, and yeah, there's not that many ways to do a 3x3 font (I mean, there's only 512 unique 3x3 bitmaps altogether, most of which do not actually represent a letter. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>I only discovered this site very recently (yesterday, in fact) and in a cursory examination of the forums, I didn't find another minimal font.  Also, I'd like to point out that I did the tiny font <a href="http://www.kuro5hin.org/story/2002/3/12/20853/2238">way back in March</a>.  You might want to consider that before accusing me of plagiarism.</p>
