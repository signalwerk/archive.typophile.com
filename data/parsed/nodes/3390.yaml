    html: <p> Yeah.  That was just the most convenient way to deal with it in the format that I had it stored in.  Also, it was harder to read without the guidelines.  It's not intended to be a good font, anyway, it's just to show a font I did back in 1996. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>I don't want to spend more time dredging it up than absolutely necessary, I just wanted to show that these ideas weren't exactly "new" (and I know that even in 1996 I wasn't the first to do them, since when I showed it to friends, a couple of them said, "Yeah, I've done something like that too"). <br> <br>It seems to be a very common thing for people to do when bored. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Ooh, now this other font I did in 1996 (which I called 'futura' though I know that name's already taken) actually looks pretty good.  I think I'll do a proper job of organizing it for a post here... </p>
