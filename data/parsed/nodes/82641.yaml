      <p>I like the way you made the <strong>r</strong> and the <strong>a</strong> relate to each other, but I think it's too subtle. How would it look if you brought the top stroke of the <strong>a</strong> closer to the <strong>r</strong>?<br>
      The gap at the bottom of the <strong>a</strong> looks too big. I suggest you close it up a little. How would it look if you added a similar gap to the  <strong>e</strong>?<br>
      There's something about all these curves that makes the <strong>v</strong> look a little stiff and out of place. What if you curved the left side of the <strong>v</strong> to follow the curve of the <strong>a</strong>? (That last one is kind of a long shot, and it might look awful, but you never know.)</p>
