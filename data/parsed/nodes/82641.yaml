      <p>Thanks for the quick reply PublishingMojo!</p>
      <p>In the last revision of the logotype (the one I posted) I made the gap between the /r/ and the /a/ even a bit wider, because otherwise the /r/ and /a/ stick together too much in comparison to the others.</p>
      <p>When the gap in the /a/ is closed up more, it gets too bulky in the middle. And then the horizontal distribution of the spaces at the bottom is gone.</p>
      <p>I had a gap in the /e/ in previous versions, but that doesn't really do it either.</p>
      <p>Might try to add a slight curve to the /v/ but I'm afraid that the /e/ will get more lonely.</p>
