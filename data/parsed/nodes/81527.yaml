    html: |-
      <p>Basic disposition is fine, font choice works okay (Univers?) except I'd avoid using the ultracondensed type at the smaller size, it's a touch distracting and hard to read.</p>
      <p>Leading is awfully uneven, especially in the middle section, which creates a rather disrupted rhytm. Same thing when it comes to horizontal alignment - especially the top set of words seem aligned neither to the left or to the right properly. Trust your eye!</p>
      <p>Why a single extended line of the type at the beginning of "is graduating from"? Makes it look like an emergency solution, glaringly.</p>
      <p>Finally, as a sometime headline writer, I think you're way off when it comes to word emphasis in the middle section. The keywords are "Graduating" and "Bachelor's Degree" (those are the words a hypothetical newscaster reading this out would emphasise), whereas the varying size makes "California State" and "in kineseology" seem like the most important words instead. Try reading it out loud, especially emphasising the type that's bigger, and you'll see how silly it sounds.</p>
