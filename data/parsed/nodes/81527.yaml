      <p>You could use the Lens Correction filter in Photoshop to make the background's seat and center line perfectly horizontal and vertical. This is only necessary if you are as obsessive-compulsive as I am!</p>
      <p><a href="http://help.adobe.com/en_US/Photoshop/11.0/WSF65FB40F-00F5-445a-BD9A-38B3737A9A19a.html" title="http://help.adobe.com/en_US/Photoshop/11.0/WSF65FB40F-00F5-445a-BD9A-38B3737A9A19a.html">http://help.adobe.com/en_US/Photoshop/11.0/WSF65FB40F-00F5-445a-BD9A-38B...</a></p>
      <p>specifically the Straighten tool, and possibly Horizontal and Vertical Perspective, and Remove Distortion.</p>
      <p>After using those tools you will have to crop the image a bit to remove the transparent areas created at the edges of the picture.</p>
      <p>And congratulations!</p>
