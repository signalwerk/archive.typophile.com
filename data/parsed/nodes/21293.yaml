      <p>&gt; <em>but i doubt it’ll ever get implemented into any major software apps</em></p>
      <p>It is already implemented in WPF (just like Adam mentioned)<br>
      <a href="http://windowssdk.msdn.microsoft.com/en-us/library/system.windows.fontcapitals.aspx" title="http://windowssdk.msdn.microsoft.com/en-us/library/system.windows.fontcapitals.aspx">http://windowssdk.msdn.microsoft.com/en-us/library/system.windows.fontca...</a></p>
      <p>&gt; <em>feature smcp {<br>
      sub a by A.smcp;<br>
      } smcp;</em></p>
      <p>feature pcap {<br>
      sub a by A.pcap;<br>
      } pcap;</p>
      <p>Shouldn't these be</p>
      <p><code>feature smcp {<br>
      sub a by a.smcp; #a.smcp instead of A.smcp<br>
      } smcp;</code></p>
      <p>feature pcap {<br>
      sub a by a.pcap; #a.pcap instead of A.pcap<br>
      } pcap;</p>
      <p>It's a subtle difference, but you don't want your 'a' to default to 'A', right?</p>
      <p><em>Note:</em> <code>a.smcp</code> is just a copy of <code>A.smcp</code>, and both glyph would exist in the font.<br>
      The same would apply to <code>a.pcap/A.pcap</code>.</p>
