      <p>Carl, yes in principle, but the names are confusing.<br>
      IMO, a basic small cap is the one that's x-height, or just slightly taller.<br>
      However, with small x-height typefaces, room is opened up between x-height and cap height, for another "small" cap, which I would term "Middle Cap" -- ergo Full Size, Middle, and Small Caps being the nomenclature. After all, everyone's familiar with S, M, L and XL as designators of size range.</p>
      <p>But that's just my logic, obviously Emigre has different ideas.<br>
      The thing is, different foundries will interpret OT features in different ways (just as they used to interpret "expert" set content in different ways in the previous generation of technology).<br>
      So what's needed is for software applications, Adobe and Quark of course, to provide the opportunity for foundry-designated descriptors. "sso1", for instance, is really hopeless.<br>
      Not just a name, but a visual showing would help.</p>
      <p>Ideally, an application user could "mouseover" an item on the menu item, and a panel in the palette showing the U&amp;lc alphabet and figures would change accordingly.</p>
