      <p>&gt; It’s a subtle difference, but you don’t want<br>
      &gt; your ‘a’ to default to ‘A’, right?</p>
      <p>Indeed, *if* you choose to include duplicate "a.smcp" and "A.smcp", as well as "a.pcap" and "A.pcap", then the code should be as you suggest. If, however, you decide to only supply one set of small cap glyphs and one set of petite cap glyphs, then I believe it’s better for these glyphs to have uppercase names (before the prefix) so that they fall back to uppercase letters when Unicode codepoints are computed by Acrobat. The reason for this is that all-uppercase text is always correct while all-lowercase is not (i.e. "ADAM TWARDOCH" is correct text but "adam twardoch" is not). For this reason, for example, Unicode character names are set in all uppercase. </p>
      <p>A.</p>
