      <p>"If you show me at least *one* application that allows me to easily look up which OpenType fonts in the font collection on my computer have small caps (or support any other OpenType feature, for that matter), I’ll be very grateful. Seriously."</p>
      <p>InDesign's glyph palette shows only glyphs that are present. No fakes there. The OpenType menu shows features that are built into the specific font you're viewing, with non-functional fetures in brackets. </p>
      <p>On the mac, InDesign also shows in the font menu OpenType icons, which is a small clue. </p>
      <p>Though these are not what you are asking for, they do solve the problem of finding out which fonts have small caps, to some degree. Of course, it is one application, or suite of apps, and not available system-level, and not available at all without the apps. </p>
      <p>The basic complaint here is that one can't tell what capabilities lie within any given font without deeper exploration. This to me is a reason to develop the means to reveal this information, not a reason to make OpenType fonts in several parts.</p>
      <p>The thing you are asking for is a worthy project, but probably complex. Is anyone up to the challenge? It would be an interesting utility, or function of the system(s), to show something like Adobe's list of icons; they indicate at a glance (once you understand them) what features are included. </p>
      <p>I don't agree that Small caps/Petite caps use would be so odd or inadvisable. One benefit of a variety of caps in a font (think Poetica or Operina) is that they can be combined a lot of different ways, some of which allow you to mimic different weights, and which may be more appropriate for certain sizes. Versatile, not confusing.</p>
