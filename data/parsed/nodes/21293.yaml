      <p>I have followed Adam's advice for this first attempt...</p>
      <p>It seems to work. I can change the type to small caps and THEN to petite caps with the stylistic set in InDesin and the stylistic alternate in Illustrator...</p>
      <p>It works... but I am wondering  at this point if it might be easier for everybody if I just left everything as three different OpenType fonts-- regular, small caps and petite caps (I would prefer the term x-cap -- more descriptive and a little less gay sounding)</p>
      <p>With the three separate sets you could just access the set you wanted through the character pallet in one stroke and be done with it. Albeit-- that way would lose the kerning between the caps and small caps and lower case that I have  meticulously set up... but I really wonder if that stuff is so very important to most design situations anyway.</p>
      <p>And you could always hand kern, like I have learned to do, if it was a concern...</p>
