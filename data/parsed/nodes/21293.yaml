  - id: 134915
    user: 1133
    date: 2006-07-19T17:46:00
    date_raw: 19 Jul 2006 — 5:46pm
    votes: null
    html: |-
      <p>&gt; If you decide to make multiple<br>
      &gt; fonts to make access easier for<br>
      &gt; the less-OpenType-savvy part<br>
      &gt; of the universe, please also<br>
      &gt; keep them all in the main font<br>
      &gt; for those of us whose apps do<br>
      &gt; support this stuff.</p>
      <p>I agree. Indeed, the choice of whether to use the OpenType Layout features or separate fonts for small caps is not necessarily an either-or choice. It can be an "and" option. </p>
      <p>But I think my point is valid in that the small caps represent a case that is on the "verge" of what is reasonable to be supported through OpenType Layout features. </p>
      <p>For example, when making the OpenType conversion, Adobe chose to merge the character sets of Robert Slimbach's Poetica and Matthew Carter's Shelley Script into single OpenType fonts. In case of Poetica, I think that it was a completely founded decision. However, in case of Shelley Script, I'd argue that keeping these fonts as separate "Shelley Andante", "Shelley Allegro" and "Shelley Volante" fonts *might* have been a good choice *as well*, or perhaps even a better choice. </p>
      <p>In any case, *this* was an artistic choice, not technical. In some cases, decisions in what to put where in a font, are of technical nature (for example, whether to put ligatures into the "liga" feature rather than the "onum" feature). In other cases, like making decisions about stylistic sets or whether a certain ligature should be standard or discretionary, it really is an artistic choice. </p>
      <p>I'll argue that in case of small caps, the issue *is* somewhat on the junction of artistic and technical considerations. </p>
      <p>Carl writes:<br>
      &gt; I expect book designers would like very<br>
      &gt; much to be able to have small caps and<br>
      &gt; x-caps in the regular font.<br>
      &gt; Especially since implementing them is<br>
      &gt; as simple as selecting a feature from<br>
      &gt; a menu. </p>
      <p>That's a valid point. </p>
      <p>On the other hand, today's applications' font menus don't tell me which fonts support which features. If I put a small caps font as a separate font, I'll see it in the WYSIWYG font list of InDesign, Illustrator, Suitcase or Font Explorer along with the other styles. This means that as a font user, I'll be instantly aware of the fact that the particular family includes small caps. </p>
      <p>If you show me at least *one* application that allows me to easily look up which OpenType fonts in the font collection on my computer have small caps (or support any other OpenType feature, for that matter), I'll be very grateful. Seriously. </p>
      <p>In other words: these days, in order to do the "as simple as selecting a feature from a menu" thing, the font user needs to know upfront that a font supports a certain feature. It's not much of a problem for a book designer who uses 2-3 font families but for graphic designers who do avertising etc., and need to deal with large font collections, it is a problem. </p>
      <p>A.</p>
