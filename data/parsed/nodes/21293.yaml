      <p>Right. Robby's caps are Regular, middle and small. A set smaller than the x-height would be (besides strange) extra-small.... Since small caps are more generally associated/used with Caps, though, whatever names we give to additional sets of caps shouldn't really refer to the x-height, since even very conventional small caps can be larger than x-height. </p>
      <p>I would like for System software to reveal this information; in any app, both clear symbols like Adobe's, plus foundry style names should be shown, since as time goes forward, I suspect those names will become even less standardized. Given the possibilities of OT, and the different things different designers use OT for, we can't possibly predict now what all the eventual style names will be. I'm including something I call "Cartographic Caps" in my next release along with Swash Caps. If a user can't see them or the style name is meaningless, or worse, buried and meaningless, I agree, they're almost the same as not there.</p>
