    <p>Clarise is a type one font I created a couple years ago with Fontographer. It has a regular book version, a small cap book version and an x-tra small cap book version where the small caps matched the x-height.</p>
    <p>I am moving on to Open Type and FontLab 5 and was hoping to roll all these versions into one compatible fully kerned OT face.</p>
    <p>After a couple weeks of solid work, I have the small caps working, and the ligatures and the os and tabular figures... but I can't access the x-caps through anything but the glyph palettes in Illustrator and InDesign.</p>
    <p>Am I trying to do something that isn't supported? Where do you go for resources to figure this kind of thing out?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/clarise1_4726.gif"></div><p></p>
