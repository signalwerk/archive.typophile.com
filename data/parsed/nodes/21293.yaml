    html: |-
      <p>Robby, </p>
      <p>I agree that for small caps, it’s worth considering putting the designs into separate fonts. Small caps is a typographic variation that is on the verge. Small caps deviate from the basic grapheme of the letters much more than ligatures or swashes, but probably less than italic or bold. Of course you’d put italic or bold into separate fonts, and of course you’d put swashes or ligatures into the same font (in OpenType). </p>
      <p>But small caps? The makers of the OpenType specification have envisioned the appropriate features, such as "smcp", "c2sc" etc. But this does not mean that you *must* integrate your small caps into the basic font. Indeed, *if* you provide a separate small caps font, even people who use Word, Freehand, Corel Draw etc. will be able to use them. Underware puts their small caps into separate fonts, for example. </p>
      <p>Note that even if you make a separate OpenType font that has small caps in place of lowercase letters and uppercase letters on the uppercase slots, it’s still useful to include the "c2sc" feature in that font that substitutes the uppercase by the lowercase: </p>
      <p>feature c2sc {<br>
        sub [A B C ...] by [a b c ...];<br>
      } c2sc; </p>
      <p>I think it would be also useful to include a dummy "smcp" feature a la: </p>
      <p>feature smcp {<br>
        sub .notdef by .notdef;<br>
      } smcp; </p>
      <p>This will ensure that various applications will "register" the font as having small caps. </p>
      <p>Adam</p>
