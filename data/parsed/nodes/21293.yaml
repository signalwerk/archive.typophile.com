    html: |-
      <p>Within the font, there are a couple of ways you could access these smaller smallcaps, and could even employ more than one of these methods. The most obvious OTL feature to use would be the Petite Caps 'pcap' and Capitals to Petite Caps 'c2pc' features. These were specifically designed to support this kind of smaller smallcap, as implemented in Emigre's Mrs Eaves and Filosofia types. See these links:</p>
      <p><a href="http://www.microsoft.com/typography/otspec/features_pt.htm#pcap" title="http://www.microsoft.com/typography/otspec/features_pt.htm#pcap">http://www.microsoft.com/typography/otspec/features_pt.htm#pcap</a></p>
      <p><a href="http://www.microsoft.com/typography/otspec/features_ae.htm#c2pc" title="http://www.microsoft.com/typography/otspec/features_ae.htm#c2pc">http://www.microsoft.com/typography/otspec/features_ae.htm#c2pc</a></p>
      <p>In addition, you could treat the smaller smallcaps as stylistic variants of the regular smallcaps, using 'salt' and/or 'ssXX' features.</p>
      <p>In terms of present application support, your best bet would be to map the regular smallcap glyphs to the smaller smallcaps glyphs in e.g. the 'ss01' feature. This would make them accessible in Adobe CS2 apps. The Petite Caps features are not supported in any shipping apps, but are supported in the Windows Presentation Format environment and XAML, so will be more accessible in future. It is worth implementing these features now.</p>
