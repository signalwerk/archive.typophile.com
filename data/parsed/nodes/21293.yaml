      <p>I wouldn't do it. John's right that the petite caps feature should be used for this. Mapping different small caps using smcp and c2sc would be confusing to the user who rightly would expect to see the same small caps regardless of whether they typed UC or lc. Mapping the x-caps to smcp would force the user to do something to fix the text if the result wasn't what they wanted whereas using the petite caps feature would give them full control over what was happening without unexpected results. </p>
