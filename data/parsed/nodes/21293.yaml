      <p>I'll assume that your uppercase A is the "A" glyph, the lowercase a is the "a" glyph, the mid-sized smallcap A is the "A.smcp" glyph, and the tiny smallcap A is the "A.pcap" glyph. </p>
      <p>Then your feature code should look like: </p>
      <p>==</p>
      <p>feature smcp {<br>
        sub a by A.smcp;<br>
      } smcp; </p>
      <p>feature c2sc {<br>
        sub A by A.smcp;<br>
      } c2sc; </p>
      <p>feature pcap {<br>
        sub a by A.pcap;<br>
      } pcap; </p>
      <p>feature c2pc {<br>
        sub A by A.pcap;<br>
      } c2pc; </p>
      <p>feature ss01 {<br>
        sub A.smcp by A.pcap;<br>
      } ss01; </p>
      <p>feature salt {<br>
        sub A.smcp by A.pcap;<br>
      } salt; </p>
      <p>==</p>
      <p>(For salt, it might also be: </p>
      <p>feature salt {<br>
        sub A.smcp from [A.pcap ...];<br>
      } salt; </p>
      <p>if your salt code contains some one-to-one-of-many mappings.)</p>
      <p>The "ss01" feature can be used in InDesign CS2 and in Apple applications on Mac OS X 10.4 (TextEdit, Pages, Keynote). The "salt" feature can be used in Illustrator CS/CS2. </p>
      <p>The "pcap"/"c2pc" features can be used e.g. in Apple applications on Mac OS X 10.4 (TextEdit, Pages, Keynote), in Microsoft WPF applications such as the Expression Interactive Designer (<a href="http://www.microsoft.com/products/expression/en/interactive_designer/" title="http://www.microsoft.com/products/expression/en/interactive_designer/">http://www.microsoft.com/products/expression/en/interactive_designer/</a> ), in XeTeX (<a href="http://scripts.sil.org/xetex/" title="http://scripts.sil.org/xetex/">http://scripts.sil.org/xetex/</a> ). </p>
      <p>Regards,<br>
      Adam</p>
