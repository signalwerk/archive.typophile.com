      <p>If you're going to have more than one set of small caps, I'm with Adam -- put the "alternate" small caps in a separate font.</p>
      <p>One advantage is that the menu name would be quite informative, eg "Shinnface with Middle Caps" rather than "ss03". </p>
      <p>I'm working on a typeface with a small x-height, and two sizes of small caps appears to be in order. So I am putting the small caps in the standard font, and the "Middle Caps", as I term them, in the font "Shinnface with Middle Caps". </p>
      <p>Also, It's not apparent whether Petite is larger than Small, or vice versa. Or whether a Petite  "caps with small caps" setting combines Caps with Petite Caps, or Petite Caps with Small Caps. So to avoid confusion, having separate fonts avoids the possibility of a Petite with Small Caps setting, which is an unlikely usage.</p>
