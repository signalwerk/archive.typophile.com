      <p>I actually like this concept. It could work really well for Display usage, when you want the viewer to look at it a bit longer before they figure out what it says. My only suggestion would be to make the serifs a little larger. I get the point of keeping them small, but I think you're running the risk of not being legible at all.</p>
      <p>Keep going!</p>
