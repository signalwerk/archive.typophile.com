      <p>minerva ...We are myself  ( Page) and our graphic designer Lenka ; both of whom are typographically inspired. I am an architect, interior designer and urban planner by training based in Pittsburgh PA. The firm is "empty space"</p>
      <p>We have been embarking on a new Farm produce  distribution venture and wanted to develop a unique elegant typeface to complement the venture in the form of a logo text /mark.  The logo  text and mark are evolving as well.  As  soon as we can share those we will. </p>
      <p>I am glad to finally have a bit to contribute.</p>
