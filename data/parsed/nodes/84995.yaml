      <p>minerva, thanks for showing us Sensaway.  Its wonderful.  We were obviously  looking for something very light delicate airy with a lot of white space.<br>
       We have a lot of work to do yet  but this is incredibly encouraging. Our 5- 9 numbers are a bit heavy.</p>
      <p> I know we had discussions about this being  above 24 pt and not really usable at smaller sizes. We would  agree it looses its legibility at the smaller sizes.  We are also hoping to be just at that edge of legibility enough to  make you think about what you are looking  at rather than just ah yes, not quite david carson what is it but very close.<br>
      Its one of the reasons behind using a Snellen Eye Chart as a type example.  </p>
      <p> Thank you  for the feedback so far. We will post updates as we make our modifications.  We are hoping for a curious and interesting ampersand... its always the glyph that makes us  excited about particular fonts.</p>
