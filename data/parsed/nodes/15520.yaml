    <p>I have to find this font for a client: <a href="http://thermalshields.com/logo.htm" title="http://thermalshields.com/logo.htm">http://thermalshields.com/logo.htm</a></p>
    <p>Not the comic sans (thank goodness, that's getting changed) but the Hobbit font. I can't seem to find it for download anywhere. The net's all full of <a href="/wiki/Tengwar" class="freelinking" rel="nofollow">Tengwar</a> and runes instead when I search for "hobbit font."</p>
    <p>It can be a lookalike or something very similar, too.</p>
    <p>Thanks for any leads...</p>
