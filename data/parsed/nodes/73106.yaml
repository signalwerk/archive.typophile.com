  html: |-
    <p>So I've just downloaded about a hundred or so fonts in the past couple of days and my typeface selection is now looking a bit cluttered...</p>
    <p>I have noticed that when downloading non-commercial fonts, they are often not as well organised as I'd like and the various typeface variants appear as seperate entries when selecting one in illustrator for example, (e.g. "Font", "Font-Bold", "Font-Condensed", "Font-Expanded"); rather than as a single entry (e.g. "Font") with sub categories in the second menu (e.g. "Bold", "Condensed" etc.).</p>
    <p>I was simply wondering if there was a way to compile these variants into a sub-categorised form as mentioned?</p>
    <p>Hope that makes sense... Thanks :)</p>
