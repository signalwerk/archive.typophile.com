      <p></p><div class="imageWrap"><img src="http://typophile.com/files/STOP interstate copy_3819.gif"></div><p></p>
      <p>a 'catastrophe' from unraveling. </p>
      <p>The letters on STREET signs in the USA are different from Interstate signs. </p>
      <p>As you can see comparing Chris' photo of the STOP sign with this sample of Interstate. </p>
      <p>I think this has come up before and the font used by municipalities is some special font for stamping out signs. There may be imitations out there, but not Interstate or any of its cheaper cognates.</p>
