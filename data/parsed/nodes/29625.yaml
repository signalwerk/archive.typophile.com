      <p>What you're looking for is one of the FHWA Standard Alphabets for Traffic Control Devices. Popular immitators include:<br>
      <a href="http://www.myfonts.com/fonts/fontbureau/interstate/" rel="nofollow">Interstate</a><br>
      <a href="http://www.myfonts.com/fonts/typodermic/blue-highway-deluxe/" rel="nofollow">Blue Highway</a><br>
      <a href="http://www.myfonts.com/fonts/typodermic/expressway/" rel="nofollow">Expressway</a></p>
      <p>There is also the approved alternate: <a href="http://www.clearviewhwy.com/" rel="nofollow">ClearviewHwy</a></p>
