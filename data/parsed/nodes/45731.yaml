    <p>I am curious if there are any other teachers out there who teach typography?<br>
    It's an odd fact that most students don't get it. There are not really ample tools available (Helvetica, the film, was a great start) to help with creating interest in the subject. There are some great websites (here, for instance) and youtube has some wonderful videos, but are there any other films about typography? Tools? If there are any typographers in the Los Angeles area, please drop by our class.</p>
