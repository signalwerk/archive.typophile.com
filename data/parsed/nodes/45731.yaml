      <p>Eric, your typography-<em>trouvé</em> exercise reminds me of a similar assignment I used to give my book-design students. I had them bring in a book they thought was especially well-designed, or especially badly-designed, and tell the class what they thought was good or bad about it.<br>
      After I had been teaching the course for about six years, the law of averages caught up with me, and a student brought in an example of bad design which (although she didn't know it) I had designed.<br>
      To be fair, she was right. If I had that book to design over again, I would have done it differently. In the end, it was a teachable moment.</p>
