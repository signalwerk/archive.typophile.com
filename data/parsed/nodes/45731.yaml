      <p>I think I've been misunderstood. At a very basic level, typography is the visually aesthetic portion of communicating with the written word; though some would say, handwriting should be ignored. But the machines we use to form the written word have moved in so many diverse ways I'd be prone to include handwriting as well -- why not? Letters generated by machine can now rival letters generated by hand, for good &amp; ill.</p>
      <p>However, handwriting is just a wrinkle. The problem is one of *good* typography, and I think what's at play here is books are no longer the gold standard. We're letting all our currencies float. But that's hard to teach. If we generally let any form of written word in the door, what's *good* will depend on context; on purpose. Grunge is good only if your purpose is to shake people up, not if your purpose is to communicate any other idea. Are typographers then required to defend their purposes? I'd think so. Perhaps that is the other part of the teaching problem.</p>
