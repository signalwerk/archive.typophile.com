      <p>I have been teaching typography and advanced typography for 24 years. If you love type and are able to pry open the minds of your students you can fill them with excitement and a new found appreciation for this subject. You have to make it an exciting journey of exploration in each class. It really challenges you as an instructor to keep their interest. Imagine being a student and the subject for the day is kerning... As an instructor I have to train them to really look at everything and this is usually something completely new for them. Ask them to bring in examples of what they like and then retrain them with good examples so they can see quality design with a great use of type. I actually make students hand trace type so they can learn an appreciation for the subtle nuances in different fonts. They have to learn that type is one of the most important tools. Instructors have to teach students what small details in their work will set them apart in their professional life.</p>
      <p>As an instructor I have a responsibility to teach about quality, copyrights, usage, and paying for fonts. I start them early with an understanding of these concepts.</p>
      <p>Feelinggrandy - There is an amazing instructor in Los Angeles who teaches at Otis/Parsons (I think) named Joe Molloy/Mondo Typo. He is a graphic designer who opened a type service setting amazing Berthold type (back in the day). I miss his type, I still can't get my Mac to produce quality type that is as good as my photo typeset projects. Maybe that is because I am a designer and was never supposed to be a typesetter!?</p>
      <p>Honor the past, embrace the present, teach the future.</p>
