      <p>I taught typography for 4 years in a masters class in a very well ranked french school. I thought masters student in graphic design, aged 20-24, would be interested in type and carry a good knowledge. No. They just don't give a damn at, say, 90%. And the most amazing is that the last 10% are absolutely crazy about it. It's like, there is no middle class there, all or nothing. When I remember myself, I actually have to say that in art school I wasn't very much interested in it either. It came later, with experience. I think that the love and interest in typography does not come early, unless specific cases. I think it mainly comes late, and grows with experience. But it might come from the teachers too: maybe, just as Chris said above, I would have been much more crazy about type if our teachers showed us nice uses of type in magazine ads... For a sadly big amount of art students, type is just a very small detail in the job as they see it, something they have to use, like a burden. They guess they will find the right font quickly with the use of Fontbook or Typophile.com... Well, anyway, I suppose you can not ask from every student to recognize Helvetica's advantages over Univers, but that's a shame because that's how it should actually be.</p>
      <p>dr</p>
