    html: <p>Teaching typography is teaching to think. In my opinion you'll have to reach their hearts and minds by showing examples that makes clear what a powerful tool typography can be. All the other things they learn by doing and doing and doing again and again and again ... it's all about your own enthusiasm and a sort of uncompromising honesty by talking about their work, The times of simple typesetting are over. They have to know what they do and why they do it this way they do. Knowledge in typography can save their professional lives ;-) Know how to think and to visualize and verbalize the results is an advantage in times,  the tools get democratic, and every bakery can set and print out their handmade stationery themselves.</p>
