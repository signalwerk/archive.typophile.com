      <p>I'm just finishing up my first quarter of teaching a 10-week intensive introductory typography course to art direction students at an advertising portfolio school. My goals for the class are for the students to explore the expressive potential of letterforms, to understand some of the historical forces that have shaped them, and to learn how to use type as a conceptual tool. I also teach a bit of Bringhurstian textcraft, but it's honestly secondary to concept. I figure if I can get them excited about type then they'll pick up the details along the way.</p>
      <p>The curriculum's going to be ironed out more next quarter, but I realized that I unconsciously divided the class into three sections — letters, words, and text — each of which has a major multi-week project corresponding to it, in addition to several smaller exercises.</p>
      <p>Here are my major assignments, more or less:<br>
      Letters: Pick a location or a category (i.e. Home Depot, Central Park, patterns in the soles of shoes) and create a photographic found alphabet using non-alphabetic objects. Trace each letter (BY HAND!) in black-and-white. Pick one of those letters and extrapolate an entire alphabet, A-Z from that letter. Design a magazine cover that would use that typeface for its logo.</p>
      <p>Words: Design a cover for your favorite book. [This assignment was stretched out over three weeks — first they had to bring in ten rough conceptual sketches in Sharpie, followed by 10 tighter comps, followed by three very tight comps including spine &amp; back cover, followed by a final cover]</p>
      <p>Text: Pick an piece of writing with at least 1,000 words. READ THE TEXT and then design a multi-page layout (magazine, iPad, website) for it, including an introductory feature spread, pull quotes, supporting images, etc. [Like the book cover assignment this one is stretched out over several weeks]</p>
      <p>I've been really impressed with my students' work so far.</p>
