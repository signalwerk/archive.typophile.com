      <p>Thanks for the great responses.<br>
      I have thought a lot about this subject recently. I believe in many ways it is the computer, that best and worst of tools that has pushed typography to the backburner.<br>
      Many of us, of an age, grew up with Letraset and phototypositors. We had an intimate relationship with type. We rubbed it (literally) on paper, we xeroxed pages and pages of type, concepts which now must seem archaic and they are.<br>
      The computer is not just another typewriter.<br>
      It's the new television. Students are visual, they have grown up with computer monitors like many of us grew up with televisions.<br>
      I also teach first year students, which i think explains why many simply don't get it (yet). Some will. I agree Innovati: the first day of class we look out the windows and see all kinds of typography (unfortunately it's Washington Mutual, not the most fascinating font).<br>
      What is extraordinary is this site. It's a bit like joining the crazy farm. How delightful that so many people share this curious and interesting passion.</p>
