      <p>Charles, let's pray thats not true, that the best designs come from people who read. To clarify the youtube reference, there are a few videos that deal with the subject of typopgraphy. It's not easy subject to teach. Most people and students think of it as picking a font and it is hopefully way beyond that concept. I agree with the totally mesmerizing Nancy Sharon Collins (whose work is amazing) that it might be generational. I too grew up with literature, books, magazines and films that revealed some great hint of the power of typography. Teaching such an esoteric subject to students today, I  am always searching for media, books, websites, etc., that will inform, entertain and educate students. Ironically, the book that we provide students with is a history of typography, and frankly, not easy to read. I am often doubtful that knowing what a rebus is will help students better understand typography.<br>
      Searching our own past for the sources of inspiration while enjoyable is unfortunately not always pertinent to methods required and needed today. You are right, these students have been raised to "look", especially at  computer monitors, television and movies. We need to speak a common language, find inspiration in the work of others anywhere, anyway we can.</p>
