      <p>Oh, also, the very first thing I did in class was had them go out into the neighborhood for an hour and bring back ten examples of what they thought was good type, and ten examples of what they thought was bad type. I certainly didn't agree with all of their picks, but it helped get the students engaged and discussing from the outset and also taught them that type is so very rarely objectively good or objectively bad, and the real question is, what does this type set out to accomplish, and does it do that effectively?</p>
      <p>This exercise would not have been possible in the days before ubiquitous cell phone cameras.</p>
