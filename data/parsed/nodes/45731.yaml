      <p>in design school here there might be a handful of students in a class full of 40 who actually care about typography, and no I'm not talking big things like making their own typefaces, I mean only  ahandful bother to *ever* open up the glyphs palette and even see what's there.</p>
      <p>I think the sad reality is there used to be printers that dealt with type only, and designers who didn't deal much with type at all, now both have morphed into one person and most of the time that person doesn't care.</p>
      <p>What got my excited about typography wasn't typography class (which was more type layout than anything, redundant because we had a design layout class) but rather walking around and spotting typefaces around town.  Knowing the name of the designer, the year.  What fonts were influenced by it.</p>
      <p>Maybe you'd call that a knowledge of type history that turned me on to it, but now that I can confidently name typefaces similar to 'x' or know what classic typeface that new one that just came out is inspired by, that's getting me excited to think more about type!</p>
      <p>My college *did* show the Helvetica movie, with a massive turnout (people from outside of our program came because of the interest) but there was no way to channel that interest into a project or a study so it faded.</p>
