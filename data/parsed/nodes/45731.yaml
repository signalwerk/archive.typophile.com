      <p>I taught a book design class for 10 years. When I started, there was no such thing as desktop publishing. By the time I stopped, there was almost nothing else.<br>
      I was teaching people to be graphic designers, not type designers, so I wasn't teaching typography <em>per se</em>. I taught my students that if you expect people to pay you to select type for them, you have to be able to do more than look at a list and say "Papyrus looks cool, I think I'll use that," because your client/employer can do that for herself.<br>
      To help my students learn the factors that distinguish one face from another, and make one face more suitable than another for a specific purpose (weight, contrast, x-height, etc.), I had them draw a layout and render the display type by hand. "No one will ever pay you to do this, ever," I told them, "but I'm making you do this because I can show you slides and talk about bracketing all night, but it won't teach you half as much as if draw a word in Palatino and then draw the same word in Century."</p>
