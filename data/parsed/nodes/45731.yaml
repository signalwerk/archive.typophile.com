      <p>I have taught typography for four years now and participated in the TypeCon education forum last year.  Most of what I personally observed is a common frustration due to the fact that reading skills are no longer emphasized, especially in art schools, and that there are few great models for typographic inspiration.</p>
      <p>Here's what I mean; growing up I was surrounded by the American Heritage series of literature.  Judging from how worn the books are I would have to say that I spent a long, long time looking at these beautifully crafted books.  Typographically, I now know, I got my "style" from these sensitively designed volumes.  So, I never had to "learn" how to set type. I had so much good typographic form memorized that by the time I got out of school it just came naturally.  I am not sure that these great type models are common anymore–students grow up with the internet and video games, not gorgeous text.</p>
      <p>Go to Typecon, the education forum is great.</p>
