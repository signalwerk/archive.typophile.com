      <p>You have to include more uses than books. Typgraphy in ads in magazines is way more playful. Packaging has a crammed set of criteria and too many cooks but a real opportunity as well. Motion typography or new media brings a whole nother thing. We cannot keep teaching typography as if we were still doing early 20th Century books only. If typography teachers don't open their eyes to todays world, today's young students will close their eyes completely to typography.</p>
      <p>ChrisL</p>
