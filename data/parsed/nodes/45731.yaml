      <p>As I don't have a background in the arts (I work in science education and did a science degree) I found Matthew Butterick's <a href="/wiki/practicaltypography.com" class="freelinking" rel="nofollow">Practical Typography</a> website and <a class="freelinking external" href="http://www.amazon.com/Typography-Lawyers-Matthew-Butterick/dp/1598390775/ref=sr_1_1?s=gateway&amp;ie=UTF8&amp;qid=1285598465&amp;sr=8-1" rel="nofollow">book</a> an absolutely excellent textbook in learning to lay out business material. (Usual lack of commercial interest disclaimer.)</p>
      <p>It's branded as for lawyers but really it would fit in well on the bookshop of any professional which I think is an important point: most people who need education in this stuff are people like me who never have or will take a class in graphic design-and that forms a much larger market than people considering becoming font designers.</p>
