      <p>I just graduated from a school whose faculty are often obsessed with typography, and I often felt like the biggest problem was that postmodern typography and digital type created too much for many students to grasp in four years. Learning all of the little details is a year of study, figuring out what matters in the real world and whats just a quirky academic notion can suck the life out of internships. Then there’s the layer of grid knowledge, made messy by the tendency of designers to stink at math. Get that right and then comes expressive and experimental typography. Now that web/Flash experience has become a common requirement for entry-level design jobs students must also learn to make type work onscreen, both static and animated. It doesn’t surprise me in the least that many students minds aren’t elastic enough to take it all in—it literally pushed me and other students in the program to the limits of sanity. </p>
      <p>Looking back at it all, and knowing that there’s stuff I wish my school hadn’t had to leave out of the curriculum, I can’t really imagine a good solution to teaching typography in the twenty-first century. I think it likely that great design schools will become crucibles in the manner of graduate programs in law or medicine, in which the students who can’t take it all in will just crack.</p>
