    <p> The invitations to my wedding just came back from the printer, and they got me to reconsidering a point I'd made before: the dearth of formal script-y Hebrew fonts. There are some really nice text fonts, and lots of fun ones, but only two that I've seen used on invitations &amp; the like: Meiri (<em>e.g.</em>, <a class="freelinking external" href="http://www.stitchesbysue.net/id114.html" rel="nofollow">this site</a>) and Yerushalmi (like <a class="freelinking external" href="http://www.jewishshopsonline.com/media/images/Yerushalmi.htm" rel="nofollow">here</a>, or this example:</p><div class="imageWrap"><img src="http://typophile.com/files/invite_3555.png"></div>from my brother's invitations).<br>
     (Actually, that's not entirely correct; I've seen the occasional modern script or Vilna-like "standard" print or even Hadassah, but those two fonts are well-nigh universal.)<br>
     Are there real alternatives? Readable, but also more decorative than would be used in a <em>siddur</em>.<br>
     (I have my own idea I've been playing with, but I'm looking for already-available alternatives.)<br>
    —Joel<p></p>
