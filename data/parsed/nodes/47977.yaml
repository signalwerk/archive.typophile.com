      <p>&gt; and Yerushalmi (like here, or this example:</p>
      <p>JCSolomon,</p>
      <p>Your brother's invitation is truly beautiful. May you have much happiness from him.</p>
      <p>Now, let's critque. </p>
      <p>First, I agree that there is a dearth of decorative Hebrew typeface designs, although this one is beautiful.</p>
      <p>The final chof in the 3rd row, and the 14th letter from the right, is poorly designed. It is over weighted, both on the horizontal thicker top, and the vertical narrower right side. This is either a font software glitch, or a design error.</p>
      <p>After careful inspection, also in the top row, and the 15th letter from the right, the final mehm is also poorly weighted. Again, this is either a font software glitch, or a design error.</p>
      <p>I suspect that this is sloppy work at the font production level. Perhaps, the font maker/programmer poorly scanned the images of the aleph beis, and neglected to touch up these defects in the font, because he or she either lacked the "eye" or skill, or was lazy.</p>
      <p>If you look at the kerning, you will see also that there is no kerning, as certain letter combinations are closer than others. Kerning is a lot of tome consuming work, and the talent to properly kern is not woth every talented type designer. The OpenType font technology can incorporate a table of finely kerned letter pairs on the font, producing perfect work.</p>
      <p>Finally, I would strongly suggest to reduce the size (perhaps a point size) of the English text to better match the Hebrew. </p>
      <p>Unfortunately there is hardly a matching English font for Hebrew calligraphy or a pseudo-calligraphy invitation font. Notice that both the slant and the sub-conscious eye-movement goes from right-to-left in Hebrew, but in English  font for Hebrew calligraphy or a pseudo-calligraphy invitation font. Notice that both the slant and the sub-conscious eye-movement goes from left-to-right.</p>
      <p>Soon, I will create a few matching sets of well kerned OpenType Hebrew and English fonts so birthday, bar-mitzvah, and wedding invitations can be printed happily, and we can enjoys fully these simchas (milestone events).</p>
      <p>Let me conclude, we can always find fault because everything created lacks perfection. Considering the tools out there, your brother's invitation is stunning.</p>
