      <p>Bottom line, there aren't any Hebrew fonts that I know about that even come close to the calligraphic invitation fonts that we are used to in English. </p>
      <p>I think the reason for this is that the way Hebrew is written is so fundamentally different to that of English, that the creation of flourished script create a completely different result. </p>
      <p>When dealing with block letters, you can put certain fonts together relatively successfully such as David with Times (although I personally hate both of these fonts), or occassionaly you'll find a Hebrew font such as FBOptimum that matches perfect with Optima, but in general, I don't try and match any more.</p>
      <p>When creating my own wedding invitation, I had to tone down the complexity of the English font (I think I chose Brioso) so that I could find a complimentary Hebrew font.</p>
