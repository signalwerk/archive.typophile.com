      <p>Another very attractive decorative Hebrew font was "Yahalomim" or "Diamonds" offered by FontWorld (<a href="http://www.fontworld.com" title="www.fontworld.com">www.fontworld.com</a>) a number of years ago. I understand that it together with other popular Hebrew designs are being converted into the new OpenType font format from Adobe and MiscroSoft.</p>
      <p>It was marketing originally in Israel by Letraset in the eighties as a stick-down letter. As computer-based typesetting replaced the old fashioned the stick-down letter based typesetting of traditional graphic artists. I do nit know who was the designer, as often Letraset of Israel simply purchased the designs from Israeli graphic artists, and unfortunately did not acknowledge their creative contribution in their products.</p>
      <p>Another popular decorative design offered by FontWorld was the "Bar Mitzvah" Hebrew typeface design.</p>
