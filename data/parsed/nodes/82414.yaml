    <p>What about new blood in German typography?<br>
    How do students deal with typography?<br>
    What do the studies of typography in Germany and abroad look like?</p>
    <p>The book »typoversity« presents current projects from typographic training courses and universities, and hears the teachers, too. In interviews Prof. Heike Grebin, Prof. Nora Gummert-Hauser, Prof. Jürgen Huber &amp; Christian Hanke, Prof. Indra Kupferschmid, Prof. Jay Rutherford, Prof. Betina Müller, Prof. Ulrike Stoltz, Prof. Rayan Abdullah, and Dan Reynolds present their methodologies, and tell us how they manage to trigger the students’ interest in and enthusiasm for typography. »typoversity« discusses the role of typography in the designer’s work, and its social relevance. »typoversity« relies on the quality of typographic basics and an eagerness to experiment.</p>
    <p>(Texts are only in german)</p>
    <p><a href="http://www.typoversity.com/" title="http://www.typoversity.com/">http://www.typoversity.com/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typoversity1_3530.jpg"></div><p></p>
