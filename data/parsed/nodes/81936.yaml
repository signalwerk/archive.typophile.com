    <p>Hello,</p>
    <p>I began to work on a font on Fontstruct.<br>
    <a href="http://fontstruct.com/fontstructions/show/terminal_grotesque" title="http://fontstruct.com/fontstructions/show/terminal_grotesque">http://fontstruct.com/fontstructions/show/terminal_grotesque</a></p>
    <p>I know this is not a real font editor but it was adapted to my project.<br>
    Now I have kerning trouble.</p>
    <p>Fontstruct exports only .ttf format, what is the best way / software to adjust the letter spacing ?</p>
