    html: |-
      <p>FontForge, Fontographer and FontLab are the most obvious choices but there are other font editing tools available. DTL has a range of font editing tools that can be purchased separately if only specific functions are required. If you are working on a Mac then you could consider the Glyphs application developed by, Georg Seifert which is free in its current beta release. There is also the HighLogic Font Creator application which only runs on Windows.</p>
      <p>The <a href="/wiki/Font%20Editors" class="freelinking" rel="nofollow">Font Editors</a> section of the Typowiki will also lead you to additional information on these and other products.</p>
