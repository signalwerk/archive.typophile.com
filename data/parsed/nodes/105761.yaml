    <p>Hello everyone, I'm looking for the font of a Red vs Blue title season, "Out of Mind", to make a personal composition in Photoshop. I thought it would be easy, because the letter "F" is highly characteristic, but I can't even manage to find something similar.</p>
    <p>If anybody knows this font, could he tell me what it is? Thanks in advance.</p>
    <p>Sébastien C.</p>
