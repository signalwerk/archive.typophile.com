    html: |-
      <p>I just searched through my <a class="freelinking external" href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>, which has nearly 2,200 serif font families keyed for various letter attributes. There were 439 serif families with E's with no serif on the middle arm of the E, but not one that I found matching this sample.  That either means it is custom, or a font I have missed in my collecting. (Or possibly, I overlooked it in my review, but I think I was thorough.)</p>
      <p>I know that may not be a definitive answer, but it is a data point.</p>
      <p>- Mike Yanega</p>
