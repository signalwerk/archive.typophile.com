      <p>The 'a' only resembles the one from Priori Serif, and the other letters are quite different. The E is not like Times NR, nor is the 'i'. Are there any other places where this font is used, so we could see more letters? I agree with Don that there could be some customizing happening, maybe just for a logo.</p>
      <p>- Mike Yanega</p>
