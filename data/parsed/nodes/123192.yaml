    html: |-
      <div class="comment-spam-body"><p>The _a_ is very distinctive and an edited version of Priori Serif is perhaps the source of your image. The other letters resemble Times Roman. Possibly TR was edited to include an _a_ in the style of Priori Serif.<br>
      Have you checked the other fonts by the designers of Priori Serif,  Jonathan Barnbrook and Marcus Leis Allion to see if they have produced another retail font with the _a_.<br>
      At least some of their fonts are listed at at Identifont  <a href="http://www.identifont.com/show?1HU" title="http://www.identifont.com/show?1HU">http://www.identifont.com/show?1HU</a> and <a href="http://www.identifont.com/show?30W" title="http://www.identifont.com/show?30W">http://www.identifont.com/show?30W</a><br>
      I note that Jonathan Barnbrook does corporate identities. This might be worth checking as a possible source of the lettering in your image.<br>
      Don</p>
      </div>
