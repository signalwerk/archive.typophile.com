  html: <p>The <a href="http://www.friendsofthealphabet.org/">Atlanta Friends of the Alphabet</a> in Atlanta GA [USA] is a guild for calligraphers, lettering and book artists, as well as type designers and typographers (but with more of a focus on traditional calligraphy.) <br> <br>This coming Tuesday is FoTA's annual <a href="http://www.friendsofthealphabet.org/callig_sale.html">White Elephant and Calligraphy Supply Sale.</a> It is also FoTA's first meeting in our new meeting space at Atlanta First United Methodist Church in the middle of downtown Atlanta. There's even free parking under constant surveillance. <a href="http://www.friendsofthealphabet.org/afumc_directions.html">Directions can be found here</a>. Come one, come all. There will also be a second sale on the following Saturday (see site.)</p>
  html_clean: <p>The <a href="http://www.friendsofthealphabet.org/" class="link-external">Atlanta Friends of the Alphabet</a> in Atlanta GA [USA] is a guild for calligraphers, lettering and book artists, as well as type designers and typographers (but with more of a focus on traditional calligraphy.) <br> <br>This coming Tuesday is FoTA's annual <a href="http://www.friendsofthealphabet.org/callig_sale.html" class="link-external">White Elephant and Calligraphy Supply Sale.</a> It is also FoTA's first meeting in our new meeting space at Atlanta First United Methodist Church in the middle of downtown Atlanta. There's even free parking under constant surveillance. <a href="http://www.friendsofthealphabet.org/afumc_directions.html" class="link-external">Directions can be found here</a>. Come one, come all. There will also be a second sale on the following Saturday (see site.)</p>
