    html: |-
      <p>Don't have the answer and even with a <a class="freelinking external" href="http://ww1.prweb.com/prfiles/2008/03/05/747224/BWAttachment747224-3.jpg" rel="nofollow">better sample</a>. Problem is I can't get out of my head <a class="freelinking external" href="http://www.myfonts.com/search/times" rel="nofollow">Times</a>. Funny thing is I'm pretty convinced it could be quite easy with it, mainly stretching it, pulling upward /E central crossbar and reworking a bit /T top stem serifs.<br>
      My 2 cent now. If you need something in the same vein (minus the chiseled effect), <a class="freelinking external" href="http://www.myfonts.com/fonts/shinn/beaufort" rel="nofollow">Beaufort</a> Condensed (Light) might work pretty well. Less contrasted but far more elegant.</p>
