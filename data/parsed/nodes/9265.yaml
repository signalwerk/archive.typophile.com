    html: "<p>Also, a (perhaps?) little-known fact: your TrueType fonts can support both OpenType and AAT features at the same time; they each are stored in separate tables in the font file. <br> <br>Generate your font as a .ttf or .dfont with OT features from FontLab or wherever, then post-process with the ftx tools to add your desired AAT features. <br> <br>It's double the work, but until Apple adopts OpenType in its native text routines, it's a way to provide typographic functions in both InDesign and Apple apps (such as Pages).</p>"
    html_clean: "<p>Also, a (perhaps?) little-known fact: your TrueType fonts can support both OpenType and AAT features at the same time; they each are stored in separate tables in the font file. <br> <br>Generate your font as a .ttf or .dfont with OT features from FontLab or wherever, then post-process with the ftx tools to add your desired AAT features. <br> <br>It's double the work, but until Apple adopts OpenType in its native text routines, it's a way to provide typographic functions in both InDesign and Apple apps (such as Pages).</p>"
