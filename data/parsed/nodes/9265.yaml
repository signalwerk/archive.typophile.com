    html: <p>Nicholas,  <br> <br>I have run into the same problem. I'm pretty sure that the ftxenhancer application has a bug so it assignes wrong names to wrong features. It's essentially "off by one". In a font I was trying to build, it assigned the small caps feature to the standard ligatures caption, the standard ligatures feature to the discretionary ligatures caption, the discretionary ligatures to the swash caption etc.  <br> <br>You may have luck by decompiling the font using TTX (<a href="http://www.font.org/software/ttx/" target="_blank">http://www.font.org/software/ttx/</a> ) and manually correcting the "feat" and "name" tables.  <br> <br>Adam</p>
    html_clean: <p>Nicholas,  <br> <br>I have run into the same problem. I'm pretty sure that the ftxenhancer application has a bug so it assignes wrong names to wrong features. It's essentially "off by one". In a font I was trying to build, it assigned the small caps feature to the standard ligatures caption, the standard ligatures feature to the discretionary ligatures caption, the discretionary ligatures to the swash caption etc.  <br> <br>You may have luck by decompiling the font using TTX (<a href="http://www.font.org/software/ttx/" target="_blank" class="link-external">http://www.font.org/software/ttx/</a> ) and manually correcting the "feat" and "name" tables.  <br> <br>Adam</p>
  - id: 59989
