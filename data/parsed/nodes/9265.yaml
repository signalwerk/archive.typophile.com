  html: |-
    <p>More AAT troubles for you to point and laugh at, sorry for this, but I'm just a beginner. <br> <br>Anyway, I can't seem to get my Typography dialog to display the right titles for things. To see what i get, have a look at <a href="http://web.nickshanks.com/Name%20Errors.jpg" target="_blank">http://web.nickshanks.com/Name%20Errors.jpg</a> <br>In summary, the string from Setting is being used for the whole group, rather than just that setting, and for non-exclusive options, it does not appear next to the checkbox. <br>For reference, the top of the palette is supposed to look like this: <br> <br></p>
    <pre>Ligatures <br>[ ] Diphthong Ligatures <br>[ ] Icelandic Ligatures <br>----------------- <br>Letter Case <br>( ) No Change <br>( ) All Capitals <br>etc...</pre><p> <br> <br>What am i doing wrong? <br>I tried putting dummy noncontextual headers in the MIF with no content and setting code 0, but these were ignored by ftxenhancer when updating the font (I've not tried using AATFontTool under classic yet, will do so while I await a reply :-). Any suggestions?</p>
  html_clean: |-
