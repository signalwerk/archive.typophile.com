    date_raw: 15 Feb 2005 — 7:08pm
    votes: null
    html: "<p>Yes, it is a bug in ftxenhancer. It is assigning each item in the <b>feat</b> table a value from the <b>name</b> table that is one too high. For example, if it should give you item 271 from the table, it's giving you item 272 instead. I'm guessing the code incorrectly started counting items at 1 rather than 0. <br> <br>You can work around it (and I do) by dumping the <b>feat</b> table as XML, fixing the ID references, and then fusing it back into place. If you automate this with a script, it's not so bad. <br> <br>Use: <br> <br>1. <b>ftxdumperfuser -t feat -o myname.feat.xml -f 'My Font Full Name' myfont.dfont</b> <i>(or myfont.ttf or whatever)</i> <br> <br>2. Edit the table with BBEdit or whatever. You're looking for lines that start with <b>featType</b>; you'll have one for each feature type in the font. Here's an example from one of my fonts: <br> <br>&lt;featType type=\"10\" settingCount=\"4\" settingOffset=\"00000080\" flags=\"8000\" isExclusive=\"YES\" nameIndex=\"263\" name=\"Vertical Position\"&gt; <br> <br>Subtract one from the \"nameIndex\" property. In this case, 263 would become 262. <br> <br>Don't edit the <b>featSelector</b> items (which are the specific actions in your font), however!! Their indexes are correct. <br> <br>3. <b>ftxdumperfuser -t feat -d myfont.feat.xml -f 'My Font Full Name' myfont.dfont</b> <br> <br>That's it. <br> <br>Note that the only difference in the two command lines is the -o vs. -d flag. Also, if you're not using a multi-font suitcase (.dfont), you can omit the -f 'My Font Full Name' part of the command. <br> <br>Brent</p>"
    html_clean: "<p>Yes, it is a bug in ftxenhancer. It is assigning each item in the <b>feat</b> table a value from the <b>name</b> table that is one too high. For example, if it should give you item 271 from the table, it's giving you item 272 instead. I'm guessing the code incorrectly started counting items at 1 rather than 0. <br> <br>You can work around it (and I do) by dumping the <b>feat</b> table as XML, fixing the ID references, and then fusing it back into place. If you automate this with a script, it's not so bad. <br> <br>Use: <br> <br>1. <b>ftxdumperfuser -t feat -o myname.feat.xml -f 'My Font Full Name' myfont.dfont</b> <i>(or myfont.ttf or whatever)</i> <br> <br>2. Edit the table with BBEdit or whatever. You're looking for lines that start with <b>featType</b>; you'll have one for each feature type in the font. Here's an example from one of my fonts: <br> <br>&lt;featType type=\"10\" settingCount=\"4\" settingOffset=\"00000080\" flags=\"8000\" isExclusive=\"YES\" nameIndex=\"263\" name=\"Vertical Position\"&gt; <br> <br>Subtract one from the \"nameIndex\" property. In this case, 263 would become 262. <br> <br>Don't edit the <b>featSelector</b> items (which are the specific actions in your font), however!! Their indexes are correct. <br> <br>3. <b>ftxdumperfuser -t feat -d myfont.feat.xml -f 'My Font Full Name' myfont.dfont</b> <br> <br>That's it. <br> <br>Note that the only difference in the two command lines is the -o vs. -d flag. Also, if you're not using a multi-font suitcase (.dfont), you can omit the -f 'My Font Full Name' part of the command. <br> <br>Brent</p>"
