s, <br>Adam Twardoch <br>Fontlab Ltd. <br> <br>Ps. See you at TypoTechnica in London! I'm leaving to the airport in an hour <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
