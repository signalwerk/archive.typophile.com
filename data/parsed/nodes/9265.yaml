    html: "<p>Brent,  <br> <br>I will jump in here with some breaking news. We at Fontlab Ltd. have just released TransType Pro 3, a new professional font converter: <a href=\"http://www.fontlab.com/\" target=\"_blank\">http://www.fontlab.com/</a>  <br> <br>One of its very cool features includes the conversion of GX/AAT advanced typographic features into OpenType features. The converted font that TransType outputs will contain only the OpenType layout tables, but a following scenario is possible:  <br> <br>1. You use FontLab 4.6 to create a font in OpenType PS (.otf) or OpenType TT / TrueType (.ttf) format without any features.  <br> <br>2. You create a MIF file that contains GX/AAT features and add them to the font using ftxenhancer. If needed, you correct the bugs produced by ftxenhancer.  <br> <br>3. You use TransType Pro 3 to convert the OpenType font with GX/AAT features into a font with OpenType features. The conversion does not 100% of all GX/AAT features, but a quite fair number, including some contextual features. I believe you can convert directly into FontLab's VFB format as well that will include the OpenType features code in source FEA notation but have not been able to verify it now.  <br> <br>4. (Optional) You open the font in FontLab. FontLab will decompile the OpenType features into source code and you tweak them manually. You generate a new OpenType font that includes the OpenType features.  <br> <br>5. You use ftx enhancer once again (with the same MIF file) to add the GX/AAT features to the new font. The resulted font will include both OpenType and GX/AAT features.  <br> <br>If you use the process, you will end up with only needing to write the MIF file from scratch. TransType Pro 3 will generate the OpenType features for you.  <br> <br>And to answer your questions in advance: TransType Pro 3 does not do the features conversion in the other direction, i.e. from OpenType features into GX/AAT features.  <br> <br>Regards, <br>Adam Twardoch <br>Fontlab Ltd. <br> <br>Ps. See you at TypoTechnica in London! I'm leaving to the airport in an hour <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
