    html: "<p>In OS 8.6; <br>By default, the AAT Font Tool adds features for Icelandic Ligatures, Multiply glyph and Hyphen to Minus. The AAT Font Tool does not append the Dipthong Ligatures feature, but its predecessor the GXifier does. <br> <br>To add the Dipthongs feature, append this MIF;  <br> <br>Type\t\t\tLigatureList <br>Name\t\t\tLigatures <br>Namecode\t\t1 <br>Setting\t\tDipthong Ligatures <br>Settingcode\t\t10 <br>Default\t\tno <br>Orientation\t\tHV <br>Forward\t\tyes <br>Exclusive\t\tno <br> <br>List <br>\tae\t\t\ta e <br>\toe\t\t\to e <br>\tAE\t\t\tA E <br>\tOE\t\t\tO E <br> <br>Fontographer does strange things with fonts. In the test font, it deleted Multiply and y acute, but when the same font was saved as in TypeTool and AAT-enabled, the Icelandic Ligs, Multiply and Minus features worked. <br> <br>Re: FontLab <br> <br>Adam,  <br>a feature request for FontLab or TransType Pro 3;  <br>maybe it's too much to ask, but it would be very useful if an AAT font could be converted to a dual-format AAT/OT font in a single step.  <br> <br>Also, FontLab opens GX/AAT variations fonts, but can it create a variations font? If not, is there any chance of adding this? GX Variations are potentially very useful, but I</p>"
