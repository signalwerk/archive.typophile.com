    html: |-
      <p>Maybe this is a dumb question, but why is it crucial to delete them ompletely? If you remove them from the liga (or dlig) feature, they won't be accessed unless you explicitly select them from the glyph panel. So if you don't like the ligatures, why not simply remove them from the opentype layout features, but leave the glyphs intact. This has the advantage that if you change your mind later it will be much easier to restore them.</p>
      <p>André</p>
