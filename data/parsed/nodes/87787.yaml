    html: |-
      <p>Open a metrics window, switch to kern mode, open the kern pair table, set it to show pairs in order of the left glyph, and delete every instance of the ligature. Then switch to order by the right glyph and delete every instance of the ligature. That should fix it.</p>
      <p>Alternately you could generate a kern feature, copy/paste it to a text file, and strip all lines referencing the ligature with a good text editor like Textwrangler or command-line tools like sed. Then just dump the fix feature in and don’t allow Fontlab to generate a new feature later.</p>
