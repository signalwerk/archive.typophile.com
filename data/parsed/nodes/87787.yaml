    <p>Hello, can anyone tell me how I remove existing ligatures in a font completely?<br>
    I have tried to delete the relevant glyph cells and then delete the 'liga' from the OT panel. The only problem is that the font has already been kerned for use and it's as though it still sees the coding for the deleted glyphs which means it won't let me re-generate it. ANy ideas?</p>
    <p>Thank you</p>
    <p>Stimopo</p>
