    <p>Hi experts,</p>
    <p>a part from being Chanel’s webpage a masterpiece of art and elegant communication in my eyes they newly use a font with minor letters, too, as for example on:<br><a href="http://womenonly.chanel.com/it_IT#home/3">http://womenonly.chanel.com/it_IT#home/3</a></p>
    <p>Can someone tell me if it is a standard font (whichI doubt)<br>
    or if it is custom made, most of all:</p>
    <p>Who did it?<br>
    What is the studio responsible for the webpage maintaining?</p>
    <p>Thanks a lot for all informations about this theme!</p>
    <p>Stefan</p>
