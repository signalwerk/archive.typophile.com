      <p>Nobody seems interested in talking about new regular type anymore, always going to the Logo/ID section.</p>
      <p>That's OK I can critique myself.</p>
      <p>The lc a has the most character of these characters, but the lower curve needs to be smoothed out a bit.<br>
       That f is a joke, right? Just an upturned j with a cross bar. I do like those inset curled ball terminals on the f, t, and j, though. Hard to say if that feature fits in with an otherwise wide font though. Try stretching them out, like the tail on the Q.</p>
      <p>Keep working on that g. The line weights seem about right but it's still too dark.</p>
