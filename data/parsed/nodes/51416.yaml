      <p>Don't worry I'll be in to give a more in depth critique....just been busy with some non-type stuff.</p>
      <p>The firs thing I'd do though is the uc H.  While the U traditionally has two different stresses on the vertical strokes, the H does not, both are thick.</p>
      <p>I like the inset balls.  But push the ball of the r in some.  you can have skinny rs and be okay.  </p>
      <p>Also, a problem I noticed I had in Coruña the other day you have too.... the Ss look like they were made with entirely different angles and curves.  both fit the font, but they don't fit each other I don't think, if that makes sense.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
