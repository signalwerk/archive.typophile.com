      <p><cite>The lower part of B ends straight on the right side of the stem, but “E” is rounded. Is that done on purpose?</cite></p>
      <p>Yes, I found that the B looked way too heavy with all the internal corners rounded. Squaring that one kept it balanced to my eyes. </p>
