    html: |-
      <p>I've made some improvements and d most of the letters look a lot better, but when I did a test text print at 12pt it looked absolutely terrible! There is a problem of uneven color to say the very least (not that even color is a supreme goal in and of its self, but well, you'll see soon enough.) The thin parts of the high-contrast strokes frequently disappeared at that size. Clearly this isn't meant to be used so small, but it's too wide for titling. Maybe its destiny is in signage?</p>
      <p>The x-height is huge, so much that the lowercase overpowers the caps. 'm not sure how this can be repaired.Making the cap stems heavier might help.</p>
      <p>I want to give it another pass before I show a new sample, but it shouldn't be too long now.</p>
