      <p>While the first version (caps only in a day and a half) seems rushed, it was little more than a sketch. I just sketch directly in FontForge sometimes. It helps to keep my thoughts organized, though it is limiting in its way. (I sketch type on paper too but it seldom looks like this).</p>
      <p>Effluent is a pretty sounding word that is synonymous with sewage. It nicely reflects the low self-esteem of this designer, but I question whether that will impair its marketability.</p>
      <p>Likewise, the alternates I show are also largely sketches or designs I've rejected from the main line; most will likely be eliminated from the final font but they may see life in another project. I've already tossed out those inset ball terminals I had on f,j and t, and the barb on J is gone in the next version.</p>
      <p>Thank you Steve for your input. I only mentioned Jeanne Moderno as a point of comparison since it is broadly in the same genre of high-contrast modern type that has recently in everyone's face here since it became featured here on Typophile. I hadn't even been aware of it before then. Sorry about that.</p>
