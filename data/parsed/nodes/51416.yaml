    html: |-
      <p>Thought I'd weigh in, since my types have been mentioned. :)</p>
      <p>There's a lot of interesting stuff going on in your alternates. REALLY interesting stuff that's not quite syncing with your basic alphabet.</p>
      <p>Such as in your second esset, @, copyright symbol that could carry your face in a whole, cool direction.</p>
      <p>LOVE that second alternate 2 - it's very ... Eastern European.</p>
      <p>Leslie Carbarga says it in his Font/Lettering Bible (I'm paraphrasing): anything goes, even mistakes - but once you make your decision, repeat it and do it often.</p>
      <p>I see lots of little decisions here - but they're not consistent throughout.</p>
      <p>For example, consider taking your @ construction and applying the cool 3D-like strokes to your other characters. You could even build an entire alphabet from the way you structured your @! The smooth stroke on the bottom with the calligraphic flourish, really interesting treatment. What would your other letters look like if they had this treatment? Lowercase y, God, even the tail on the Q would benefit sooo much!</p>
      <p>Some other thoughts:</p>
      <p>Don't be afraid to throw a lot away (edit!) in favor of getting everything cohesive/working well together. You should see the cutting room floor on any of my fonts!</p>
      <p>When researching 19th Century Fat Faces, I've run across a lot of unusual edges and components that you could also be incorporating. With all the small foundries (that eventually made up ATF) producing very odd versions of Modern type, there's a lot to reference and build off of; just apply what you find in a consistent manner.</p>
      <p>Bodoni himself was a tinkering fool - with the money and resources to overwork his lettering ad nauseam. Octavo.com has a great digital version of his specimen book, there's a TON of stuff in there that to this day still hasn't been mined (except for a few font designers who have been building off of it). Look at Bodoni's odd numbers - and imagine all your round shapes going in that half moon direction. That would be SOOOO cool. </p>
      <p>Really, this is a display face, it doesn't have to be totally legible. (did I actually say that? That's so not me.)</p>
      <p>Stop looking at Tiffany, it seems to be holding you back (my opinion). What you're doing is different than Tiffany's approach, you could actually end up doing something better. </p>
      <p>Stop looking at my fonts, they seem to be taking you in my direction and really, you have potential to do something unique here if you just create something totally ... You. You have some incredible elements in there - you just have to focus on a few of them and go for it.</p>
      <p>The name is good. Memorable. But if you really don't like it, that's up to you. Some of the best fonts do have horrible names. </p>
      <p>Also: take your time. Focus on one letter and work that until its finished. Then work it again. Trying to do a whole alphabet at once will just drive you mad and you'll end up with some good forms and some forms that haven't been fully realized. DON'T RUSH IT and you'll have a better product!</p>
      <p>And insane as this sounds, I spent 10 years on Jeanne Moderno. Rod Cavazos saw my first sketches back in 1998 and it's been a really fun journey, I've learned a TON about modern types - and I'm no where near finished yet (there is more jeanne on the drawing board) </p>
      <p>:)</p>
      <p>s.</p>
