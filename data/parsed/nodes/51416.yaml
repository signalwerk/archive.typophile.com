      <p>Uppercase alone is wonderful, but there's something about the size and width of the lowercase that bothers me. I think it's too wide, the x-height too high, and also i think the letters are unexpectedly round. I love the lowercase "t" and "j". I'm no expert, so my critique goes at the whole concept, and it is very dependent on which direction choose.</p>
      <p>UC: The top left serif of "N" is wierd. "W" bothers me, and the left stroke on "Æ" falling from the E-shape serif as well. The lower part of B ends straight on the right side of the stem, but "E" is rounded. Is that done on purpose?</p>
      <p>Forgive my bad terminology.</p>
