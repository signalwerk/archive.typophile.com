      <p>Two English types from the 1920s: Gill Sans (two-storey) and Monotype Grotesque (one-storey).<br>
      Two German types from the 1920s: Kabel (two-storey) and Futura (one-storey).<br>
      I would say it’s up to the type designer.</p>
      <p>With regards to the Germanization of Gill Sans, that would appear to be another special case. Perhaps this pandered to the stereotype of European modernism. Or perhaps, soon after WWII (which is when I believe it was manufactured, not before), there was a feeling that Gill Sans was too ﬁrmly associated with England, and this would have negative connotations in Germany.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/GillGerman_4324.jpg"></div><p></p>
      <p>From an undated Monotype specimen (probably early 1950s), Belserdruck, Stuttgart.<br>
      "M 10, Serie 262-11, Durchschuß 2"<br>
      There is also Bold, but no Light shown.</p>
