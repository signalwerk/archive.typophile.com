    <p>I'm making a big multilingual sans serif and by default, the "a" and the "g" are double storey. I do include the single story versions available by "salt" because this feature works virtually everywhere, where there is Opentype). </p>
    <p>However, I've heard that the Germans mostly use the single story <em>g</em>. I've searched pictures of various street signs in Germany and Austria and I haven't found any double story g's. </p>
    <p>Would it be ok to include 'locl' feature for German language to substitute only the g (while leaving the "a" double story)? I do understand that the single story g has its roots in Fraktur. And is it a German-only preference or the neighbour languages like Dutch, Danish, Swedish, etc. look more natural with a single storey g?</p>
    <p>In the attachment, there's an example with single and double storey g's. To my eyes, the combination of single story g and double story a looks more "natural" in a German text. Don't look at the kerning, I didn't start polishing it yet.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/GermanG.PNG" width="853" height="657" alt="">
