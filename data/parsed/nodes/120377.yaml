      <p>Yeah, I don’t think there’s a connection there. It’s nice that you’re putting a single-story g as an alternate, but I’d see no reason to make it a locl.</p>
      <p>Samples like that Gill, I would see that rather in a historical than a geographic context (“pandered to the stereotype of European modernism” sounds right; weren’t there lots of faces that suddenly came up with Futura-esque alternates…).<br>
      Durchschuß means leading, FWIW.</p>
