  html: |-
    <p>Hello Typophiles,</p>
    <p>While shifting from the PC to Mac I have discovered that the vertical metric lines(sidebearings in the FontLab Metrics window) in Macs are different than in the PCs. On PCs its almost invisible and doesnt distract when am doing spacing or kerning but while on the Mac I really find it annoying seeing that thick dotted line.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4924.jpg"></div><p></p>
    <p>Is there a way in FontLab I can adjust the visibility of the Metric lines?</p>
    <p>Thanks for your time.<br>
    Satya</p>
