      <p>Campanile, which has a somewhat similar S to Euclid/Templar is an older font by Mackellar Smiths Jordan,  cut and patented by William Jackson in 1879.<br>
      Cymbeline appears to be an original by David F. Nalle [1993] but he gave no information as to the source of the design <a href="http://www.fontcraft.com/Merchant2/merchant.mv?Screen=PROD&amp;Product_Code=cymbeline&amp;Category_Code=" title="http://www.fontcraft.com/Merchant2/merchant.mv?Screen=PROD&amp;Product_Code=cymbeline&amp;Category_Code=">http://www.fontcraft.com/Merchant2/merchant.mv?Screen=PROD&amp;Product_Code=...</a> Steffmann's Cardinal is a pirate copy -- exact match of nodes etc -- with some added characters. Rick Mueller's Wish MF [1997] differs in detail from Nalle's font and may also be an original. Wedlock [1998] is definitely an original -- based on type purchased by Dan X. Solo. it's the best digitization of this design.<br>
      Don</p>
