      <p>RYGGERIETS: Very similar to a 19th century typeface called Fantail.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Fantail_6064.jpg"></div><br>
      There is a digital version at  <a href="http://opti.netii.net/fonts-f/index.htm" title="http://opti.netii.net/fonts-f/index.htm">http://opti.netii.net/fonts-f/index.htm</a>.<br>
      Most of the OPTIfonts are pirated clones of other foundries, but I have not found another source, and infer that this is probably an original creation.<br>
      Don<p></p>
