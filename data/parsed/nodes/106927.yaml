      <p>As far as I can determine the S font was cut by Schuenemann as Euclid for  Cleveland. No patent found. Schuenemann worked for Central before Cleveland and while at Cleveland also cut some fonts for Central. Don't know if this includes Euclid. The Cleveland version was very a creative and ambitious effort that occupied 8 pages of the 1894 specimen book and included alternate capitals with sweeping swashes.<br>
      The swash initials are captured in Ryoichi Tsunekawa's Great Victorian <a href="http://dharmatype.com/dharma-type/great-victorian.html" title="http://dharmatype.com/dharma-type/great-victorian.html">http://dharmatype.com/dharma-type/great-victorian.html</a><br>
      Another version by Claude Pelletier  <a href="http://www.dafont.com/euclidcp.font" title="http://www.dafont.com/euclidcp.font">http://www.dafont.com/euclidcp.font</a><br>
      Copying competitors typefaces and using different names is nothing new. From Euclid @ Central&amp;Cleveland and Templar @ Palmer&amp;Rey in the 1880s to the current batch found by Ryuk the practice never ends.<br>
      BTW, a link to Sophie MF that does not require downloading an exe file: <a href="http://www.fontyukle.net/en/DownLoad-Sophie+MF.ttf" title="http://www.fontyukle.net/en/DownLoad-Sophie+MF.ttf">http://www.fontyukle.net/en/DownLoad-Sophie+MF.ttf</a><br>
      Don</p>
