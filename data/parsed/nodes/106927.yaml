    html: "<p>RYGGERIETS: As far as I can determine this concept was designed by William F. Page in 1872 as a numbered type -- apparently not patented -- which later became known as Teutonic. This seems to be accurately revived by Jordan Davies. The foundry version seems to have been created at Mackellar Smiths Jordon with the name Fantail. Minor variations. OPTI might be closest to the foundry version. Edited versions are Nick Curtis' Fredericksburg and Richard Beatty's Wanted. See <a href=\"http://www.fontshop.com/fonts/singles/richard_beatty/wanted_regular_ot/opentype_cff/\" title=\"http://www.fontshop.com/fonts/singles/richard_beatty/wanted_regular_ot/opentype_cff/\">http://www.fontshop.com/fonts/singles/richard_beatty/wanted_regular_ot/o...</a></p>"
