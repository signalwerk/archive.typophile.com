  html: |-
    <p>I have a conundrum which I am sure is easily solved... Is there was using InDesign that you have a background colour (white) to the text. When I say this, I dont mean for the whole text box, but only for where the text is, so the background colour is only present when there is a character present... i have attached a very poor picture to show what i mean. </p>
    <p>And while I'm posting, any ideas for two typefaces to work together for the setting of Wagner's Der Ring Des Nibelungen??? I would like a serif for the libretti, and a sans for stage directions... I also need something for the story which will be presented in novel format........</p>
    <p>Any ideas would be great! thanks thanks!</p>
    <p>claire<br>
    &amp;8</p>
