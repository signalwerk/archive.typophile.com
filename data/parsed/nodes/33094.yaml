    html: |-
      <p>You can create that effect using the underline options in the character palette. Just highlight the text, then choose underline options in the drop down menu in the character palette. Set the underline color to white (or whichever color you want behind the text), then play with the pt size and offset until you create your desired effect.</p>
      <p>ps: my first post! :)</p>
