    html: |-
      <p>When I want color under my text I set the type and then draw boxes on a layer underneath using pre-measured blocks to ensure that all the boxes are the same size relative to the text.</p>
      <p>As for Der RIng, it should relate to the specific production if for public consumption, if for actors/singers to read, just pick something legible like you would for any text.</p>
