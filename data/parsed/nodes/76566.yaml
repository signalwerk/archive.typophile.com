      <p><strong>Thanks for the nice replies, and especially for the promotion to frontpage!</strong></p>
      <p>The last days(feels like months) have been busy. But I wanted to share the final product with everybody on Typophile, by posting some pictures of the production and of course the finished calendar!</p>
      <p>Here's the link to my Homepage with more details and background infos to the project:<br>
      <a href="http://haraldgeisler.com/2010/12/30/2011-typographic-wall-calendar/" title="http://haraldgeisler.com/2010/12/30/2011-typographic-wall-calendar/">http://haraldgeisler.com/2010/12/30/2011-typographic-wall-calendar/</a></p>
      <p><strong>Still in need for a wall calendar for next year? // Delayed Christmas/Holiday/New Year presents:</strong><br>
      <em>Since I like Typophile a lot (just like August), I would like to offer everyone who likes to get a copy of the print a <em>Typophile<em> discount.<br>
      Simply send me a mail after purchase via PayPal, saying that you've read about it on Typophile and you'll get 10% off,<br>
      + And to make it exciting: everybody who posts a picture here in this thread of the received calendar in your studio or kitchen (or where you'd like to place it) and get additional 15% (25% in total)  )</em></em></em></p>
      <p>Here is the link to order prints:<br>
      <a href="http://haraldgeisler.com/order-prints/" title="http://haraldgeisler.com/order-prints/">http://haraldgeisler.com/order-prints/</a></p>
      <p>If you have extra time and a twitter or facebook acount - it would be great if you could share the link along your followers.</p>
      <p>Thanks &amp; a happy new year!<br>
      Harald</p>
      <p>↓ final version<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/2011_TWC_986px_width_3480.jpg"></div><p></p>
