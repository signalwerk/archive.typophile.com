    <p>I thought this would be the right place to share my project:</p>
    <p>I'm working on a typographic wall calendar, made of two thousand and eleven keyboard keys. Last year I did one made of 2010 keys.(<a href="http://typophile.com/node/65810" title="http://typophile.com/node/65810">http://typophile.com/node/65810</a>)</p>
    <p>This year I turned the design into a Kickstarter project. Kickstarter is a public funding platform for design and art projects.<br>
    Here is the link to the project-website with a little video: <a href="http://kck.st/20eleven" title="http://kck.st/20eleven">http://kck.st/20eleven</a></p>
    <p>I also was invited to a lengthy interview about my design process:<br>
    <a href="http://blog.kickstarter.com/post/1360375408/creator-q-a-harald-geisler-of-typographical-calendar" title="http://blog.kickstarter.com/post/1360375408/creator-q-a-harald-geisler-of-typographical-calendar">http://blog.kickstarter.com/post/1360375408/creator-q-a-harald-geisler-o...</a></p>
    <p>On my website i wrote a bit more in depth about the piece:<br>
    <a href="http://haraldgeisler.com/2009/12/31/typographic-keyboard-wall-calendar/" title="http://haraldgeisler.com/2009/12/31/typographic-keyboard-wall-calendar/">http://haraldgeisler.com/2009/12/31/typographic-keyboard-wall-calendar/</a></p>
    <p>And there is even a concept text and picture as downloadable PDF:<br>
    <a href="http://2011.haraldgeisler.com/wp-content/uploads/2009/12/Harald-Geisler-Typographic-Keyboard-Calendar.pdf" title="http://2011.haraldgeisler.com/wp-content/uploads/2009/12/Harald-Geisler-Typographic-Keyboard-Calendar.pdf">http://2011.haraldgeisler.com/wp-content/uploads/2009/12/Harald-Geisler-...</a></p>
    <p>I hope you enjoy the work.<br>
    Typographic or non-typographic feedback either directly or through mail is welcome.<br>
    Spreading the word is appreciated (since i need to get backers to fulfill the typographic project.)</p>
    <p>Yours Sincerely,<br>
    Harald Geisler</p>
