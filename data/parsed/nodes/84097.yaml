      <p>Thank you all very much.</p>
      <p>Andreas, I drew all the letterforms from zero. All the design process was made by hand, before digitallization. The starting point were two circles inscribed in a 3:5 rectangle. The restriction I imposed myself was to keep the centres of all the curves in the typeface horizontally aligned.</p>
      <p>You'll find more images in the web:</p>
      <p><a href="http://www.angelsanchez.eu/index.php/project/stadium_font" title="http://www.angelsanchez.eu/index.php/project/stadium_font">http://www.angelsanchez.eu/index.php/project/stadium_font</a></p>
      <p>Jeremyloyd, please, let me know if you use it!</p>
