      <p>You might be best off asking the bride about her invitation design. (Or if this is a surprise gift, ask her mother or maid-of-honor, or a close friend/relative who was involved in the planning.) </p>
      <p>If it’s something they did themselves, she should be able to give you the name of the typeface. </p>
      <p>Otherwise, the company she ordered them from could have it listed in their catalog. However, some of those stationery/card companies have their own proprietary typefaces … so you might be out of luck.</p>
      <p>Mike Yanega certainly has great advice for finding a similar font, though.</p>
