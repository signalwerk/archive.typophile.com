      <p>Hi Mike,<br>
      You have a nice idea, but you picked a very tough kind of font to want to match. As it says in our FAQ pages, there are literally thousands of these hand-printed lettering fonts, and they are so easy and cheap to make that a stationer who makes invitations could have made their own one-of-a-kind fonts with printing samples of anyone on their staff.</p>
      <p>I looked through 300 fonts in the one widely-circulated CD of handwritten fonts like this, and found many similar fonts in terms of the weight and verticality, and even letterforms, but none with the cute dot on the ‘i’. I also scanned the <a href="http://www.fontgarden.com/gallery/gallery.htm" target="new">Fontgarden</a> collection of free fonts — no joy for identical match, but plenty of ‘happy’ fonts. <a href="http://www.dafont.com/en/theme.php?cat=603" target="new">DaFont’s handwritten fonts</a> have 20 pages of free hand-lettered fonts, and my <a href="http://bowfinprintworks.com/Script11Pg1.html" target="new">Script Font ID Guide, Part 11</a> shows about 24 pages of everyday hand-printed fonts. Have a look at any or all of those sites and see if you see something that you think has the same sort of feeling — I think there are many — and go with something you can put your hands on.</p>
      <p>They’ll get the idea.</p>
      <p>- Mike Yanega</p>
