      <p>&gt; But […] “Equat” […] is a potentially valid company name. In fact, <a href="http://www.equat.com" title="www.equat.com">www.equat.com</a> is a Web design page.</p>
      <p>That also doesn’t hold as an argument. Google for ‘quate’ and see what you get…</p>
      <p>Miguel,</p>
      <p>I apologize if it sounded like I was sharply criticizing your design.  Your idea was a very clever solution, and I liked it.  It was certianly (in my opinion) the best alternative submitted.  You are correct that "quate" gets more Google hits than "equat."</p>
      <p>My intent was to point out that your alternative is also not idiot-proof.  I don't see either design as a problem, but it is fair to say that each alternative has some possibility of confusion.</p>
