      <p>Still like the original.  Miguel's solution is insightful, but has its own, potentially worse, problem:<br>
      An intelligent person notices that "Quate" isn't a word, finds the "=" and says "Oh, it's "EQUATE."</p>
      <p>But, in a world with companies like "Compaq," "Equat" (pronounced "equate" or rhymes with "squat") is a potentially valid company name.  In fact, <a href="http://www.equat.com" title="www.equat.com">www.equat.com</a> is a Web design page.</p>
      <p>They might google for "equat accounting."</p>
