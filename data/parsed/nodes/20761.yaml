    user_name: liquisoft
    user_path: null
    date_raw: 20 Jun 2006 — 7:34pm
    date: 2006-06-20T19:34:00
    votes: null
    html: |-
      <p>You're going to find that we designers love the idea because visually and symbolically it's simple but clever-as-hell.</p>
      <p>You mentioned, though, that it's for an accounting agency of some sort, which causes a problem. Have they seen this concept yet? My worry simply stems from the fact that accountants are less likely to appreciate a clever logo and more likely to want some pretty typography with serifs and a few little swashes here and there.</p>
      <p>You will also continue to find that some people get the word and some people don't. If this were a night club, it'd be one thing. But since it's an accounting firm, you'll have to make sure their title is clear and 100% obvious so people can take them seriously.</p>
