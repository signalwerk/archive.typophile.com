      <p>[liquisoft]<br>
      “My worry simply stems from the fact that accountants are less likely to appreciate a clever logo and more likely to want some pretty typography with serifs and a few little swashes here and there.”</p>
      <p>I’m only posting in this thread because it discusses the perspective of non-designers.</p>
      <p>My background is electrical engineering, and engineers are considered to be almost as aesthetically retarded as accountants. I LOVE THE ORIGINAL DESIGN. I’m a bit offended at your patronizing stereotypes of non-designers.</p>
      <p>“But since it’s an accounting firm, you’ll have to make sure their title is clear and 100% obvious so people can take them seriously.”</p>
      <p>As an entrepreneur (from the Old French for “person who hires accountants”) I would take a firm with this simple and brutally clever name and logo far, far, far more seriously than I would a swashy “Mary’s Olde Tyme Accounting” or a brain-dead firm that called itself “CPAs Plus” (in Arial or Cooper Black with a big “+” sign).</p>
