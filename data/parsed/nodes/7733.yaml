    html: <p>Rob, Welcome! <br> <br>&gt; I always walked the line between the two groups.  <br> <br>Good for you. <br> <br>I think sculpture and type are strongly related! Although I do agree about the dimensional difference issue. But the bit about sculpture being unlike type in that it's a "static entity" doesn't sound right, because people put stuff in their pots, and they put those pots in rooms! <br> <br>I would recommend taking a deep look at the work of Takenobu Igarashi. <br> <br>hhp</p>
