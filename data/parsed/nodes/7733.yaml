    html: <p>Hi Rob, <br> <br>Glad your chiming in! I recall from an early Typecon that Miles Newlyn had a pension for dimensional type whereby creating type to work dimensionally. I hope he reads this post and replies with some examples of his thoughts . . . <br> <br>As for me when I read your post I instantly thought of a point in my type design career when I had spent so much time designing fonts (virtual software) that I needed to gratify my need for something tactile and built a drink machine . . . <br> <br>:D</p>
