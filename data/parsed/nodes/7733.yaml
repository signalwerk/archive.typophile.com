    html: <p>I studied both ceramics and graphic design in college and I always thought there was a very deep connection between them. I still recommend design students take a ceramics class. Throwing pots is entirely about negative space since the potter ultimately shapes the interior of the pot, not the exterior. All the force used to shape the pot is applied from the inside out. The outer form arrives only as a result of the interior form. <br> <br>As for Licko's "static"  refernce she's absolutely right. You can put stuff in pots and put pots in a room, but that's meaningless to the pots. They don't need the room or the stuff, they exist on their own. Letters, ultimately need each other in order to function. Alone they're just as "static" as the pot.  <br> <br>Alone a letter is only an aesthetic object. It may be readable as a letter, but it doesn't need to be. It's just a shape. A typeface requires that a group of letters exist as a functional unit so their shapes are determined as much by the other letters as anything else.  <br> <br>george</p>
