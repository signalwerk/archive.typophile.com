    html: "<p>ah yes, real artists and the sell outs...  <br> <br>I had a professor that could create interesting relationships out of any combination of elements. Her masters thesis dealt with Graphic Design and Japanese Tea Ceremony. <br> <br>Ceramics is my other love, along with design; seemingly completely opposite though. 3D vs 2D, hands on vs computerized, messy and emotional vs precise and rational... I see those as broad differences, yet generalizations, between the two disciplines. However, if you take one area out of context and replicate it in another environment there can be interesting results. This is nothing new, there have been nearly every kind of typeface designed: refined, proportional perfect faces, gritty, spontaneous ones, trompe l'oeil... obviously not everything though. <br> <br>Basically what I am trying to get at is this: I am hoping to discover new things about letterforms by working three dimensionally with them, and with my hands. I see this also as the perfect opportunity to help bring together artists and designers with this body of work. There should be something for everyone, both groups of audiences at least. Hopefully, ideally, it will be somewhat educational as well. <br> <br>A major difference between what I hope to do and what Zuzana is working on is that she is going somewhat farther with her comparison of pots and letters. She is finding similarities with her thrown pieces that relate to characteristics of individual letters. My focus is more literal, actual letterforms, in various incarnation, produced in clay. <br> <br>In regards to ceramics though, I had not yet thought about one of her points. She states: <br> \"not be worked and reworked for very long, as the clay becomes water logged and stressed. A piece of ceramics ultimately exists as a static entity, whereas each letter in a typeface is designed to work in conjunction with the other letters, in virtually any combination, and so, the appearance of the typeface in use will differ, depending on the particular letter combinations and typographic setting.\" <br> <br>I will have to figure out how my work of individual letters fits in with this very important concept of type design- it IS about the sum of the whole. However, in my case, I think it the individual letter ARE more important because they are what goes unnoticed so often. If I was to start stringing together letter people would look at it more for what it says than for what it is. This is about the appreciation of a well designed letter, and the subtle differences between different faces. How many peopler can identify Times, Baskerville, Caslon, Garamond, or Hoefler if you typed it out for them? Many see a serif face and call it Times New Roman.</p>"
