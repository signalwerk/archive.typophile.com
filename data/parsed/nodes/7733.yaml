  html: "<p>Hello everyone. I have will keep my introduction short because some late breaking news is prompting me to cut to the chase... I have spent months reading everything I could here, learned more than I could imagine and also became more intimidated, by type, than I could have imagined. I love typophile and am looking forward to becoming a vocal member of the community now.  <br> <br>Very briefly, I graduated from the University of Illinois Graphic Design program a year and a half ago. Since then I have been working doing design and testing my hand at type design on the side. I have recently decided to go back to school to delve into type design more full time and explore some different directions for life. <br> <br>Here is, what I see as, the interesting part... I am going back to school to work in ceramics. I am hoping to work on connections between type design and ceramic sculpture. While I was in school the \"design\" people and \"studio\"  people were polar opposites; I always walked the line between the two groups.  <br> <br>Until tonight I was convinced this was a unique idea. Then about an hour ago I received an e-mail from Emigre where Zuzana explores correlations of type and ceramics. Here is a short essay Zuzana has about this topic: <br> <br><a href=\"http://emigre.com/CType.php\" target=\"_blank\">http://emigre.com/CType.php</a> <br> <br>So I don't know where I am going with this, other than I was taken off guard by that e-mail. Completely original ideas can be hard to come by I guess.  <br> <br>clay and letters... still exciting definitely</p>"
