    html: <p>Hrant, thanks for pointing me towards Takenobu Igarashi. I have been looking around for whatever I can scrounge up on him, hopefully I can get my hands on a book or two...  <br> <br>In the process of all this I came across a couple interesting old posts. It seems like art and design seem to come together once a year. <br> <br>2002 - <a href="http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=29&amp;page=1331" target="_blank">http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=29&amp;page=1331</a> <br> <br>2003 - <a href="http://www.typophile.com/forums/messages/4100/21442.html?1070556629" target="_blank">http://www.typophile.com/forums/messages/4100/21442.html?1070556629</a> <br> <br> <br> <br>So here is the next question... How important are individual letters? What is the significance of a letterform outside the context of writing? When designing typefaces you have to create one letter at a time, and when doing so (I assume) you attempt to give it a beautiful or unique form. However, when using these beautiful or unique letters it is more important that they work together than how look alone (this is all aside from pure decoration). I have read about several typefaces that have been created solely for their legibility characteristics; I would not expect those individual letters to be the most elegant. <br> <br>this is great... <br>r.k</p>
