    html: <p>There's a strong tradition of ceramic letters being mass produced in the nineteenth century for shop signage an the like. <br>You can find some reference to them in Nicolette Gray's writings, can't remember which book though, although I like all of it. <br>I've spent a lot of time doing three dimensional letters (have you also seen the book 'dimensional typography') for logos. <br>I should be able to launch my website within the next week, you'll find reference to them there if you are interested.</p>
