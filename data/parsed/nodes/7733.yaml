    html: <p>The essay from Zuzana Licko makes a connection I have long been aware of, thanks to a late relative who was a master potter.  <br> <br>I once had the great pleasure of visiting a museum's ceramics collection with her, and the commentary was amazing. Not only could she discuss just from the pot the personality and working conditions of the potterer-sometimes hundreds of years gone-but also would comment on the curves of the sillouette, and on how it was 'weak' or proud, or whatever. And when she said it, you could see it.  <br> <br>In pottery the material and glaze is of course very important, but to a great extent pottery is, like type 'about the curves'.  <br> <br>They are so close that, as Licko says, the differences are also fascinating. On of the differences is that in type the relationships between shapes is paramount, whereas in the pot, its single shape is the thing.</p>
