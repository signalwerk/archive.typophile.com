    html: <p>Looks like Bitsumishi to me. The <a class="freelinking external" href="http://www.dafont.com/bitsumishi.font" rel="nofollow">former free for personal use version</a> would need a little bit of tweaking so may switching for the <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/bitsumishi-pro-v2" rel="nofollow">Pro version</a> and get some stylistic alternates (mainly /R) should do the job.</p>
