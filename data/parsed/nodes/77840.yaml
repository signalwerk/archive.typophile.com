      <p>&gt;&gt;&gt;I am trying, as you already guessed, to keep the widths consistent across weigths. To me, it doesn't look wrong, and it might be a good selling point.</p>
      <p>Don't do it! The fact that I noticed same widths means that it was an obvious issue for me. I'd also get a lot of other opinions on this spacing matter. Honestly, I think less people will buy it because the bold/black looks too narrow. Consider all the fonts in the world by all your favourite designers... how many are same width throughout? It may be an noble and admirable aim but it'll almost certainly spoil what has the potential to be a very beautiful face. Why would you try the impossible on your second font? Same widths may not be noticeable in some glyphs but in some like /i/k/l/v/y/ it'll give you massive headaches.</p>
      <p>Of course, if you tighten the spacing on the regular, that will give the black even more of a spacing crunch, assuming you keep the spacing uniform! Believe me, you're already squashed in this black weight. It's getting on towards a narrow cut.</p>
      <p>&gt;&gt;&gt;Does the right diagonal of the y look more horizomtal (less steep) to you?<br>
      Yes the junction and tail have to move to the right otherwise it looks like its leaning to the right (very mildly italic). It's only optical, so what I guess Craig was saying was thicken the tail at the junction by moving the outermost smooth point at the base of the right diagonal further right. I guess he'll have to confirm that.</p>
      <p>Keep going!</p>
