      <p>Thanks Lasko</p>
      <p>@Nick: Don't apologize for long feedback. The more the better, I'd say! I am trying, as you already guessed, to keep the widths consistent across weigths. To me, it doesn't look wrong, and it might be a good selling point.</p>
      <p>You're right about the o. I already changed it and I'll include it in the next update. (Caps too, hopefully.) I have also changed the a and e already, which will also be included in next update.</p>
      <p>At a second glance it's probably the regular that needs tighter spacing. </p>
      <p>I'll have another look at the tittles. I haven't changed the period yet, so it's too small indeed.</p>
      <p>The tops of ascenders in the regular are already slanted, but not updated yet.</p>
      <p>The regular k is also changed, but not updated yet.</p>
      <p>I have changed the y (looks better to me now) but not in the way craig suggested. Does the right diagonal of the y look more horizomtal (less steep) to you?</p>
      <p>I have already tried what the bold will look like and it didn't look too narrow to me. Perhaps some text tests for bold and regular will prove me wrong, but I'm confident it will work out fine. There are more good typefaces out there with consistent width across weights and some of them have been quite succesful.</p>
      <p>"The only thing I would add is that, in an ideal world, you do want your name to begin to show off the best characters (or maybe that's not as important as I think it is?)" I did pay attention to that, decided not to force it too much, as in a good typeface any combination should look good. IMO the s, a and t show off Sensato's style quite well, so also regarding the way it looks I'm pretty pleased.</p>
      <p>As you might have read, there are quite a lot of things yet to be updated. This is mainly because I want to run some good text proofs and finsih the caps before the next update. I have found a good Xante aw1200 for just €25 in the city I live in, so I'll probably be able to make some test prints soon.</p>
      <p>Cheers, Jasper</p>
