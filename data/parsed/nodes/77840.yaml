      <p>Just a broad impression:  I like the feel of your font. The curviness of the letters is nicely judged - regular and not so pronounced as to be eccentric. I think the font as a whole has a pleasing sensual effect.</p>
      <p>I think you're on the right track with the root of the name you've chosen, that is the meaning is appropriate. However, the sound isn't. The 'ato' ending is rough or staccato rather than smooth and sensual. You need a word that conveys the right impression with sound and sense both. You could even use something like 'Satin'.</p>
