    user: 8008
    date: 2011-01-09T13:17:00
    date_raw: 9 Jan 2011 — 1:17pm
    votes: null
    html: |-
      <p>Hi Jasper</p>
      <p>More time on my hands so I'll give feedback a shot today! It's long again - sorry about that.</p>
      <p>One of the things I was told to do when designing bold weights was to put the same glyphs from both regular and bold (in your case black) next to each other when you are designing them. They will both inform each other about the way each should look (I'm guessing because the regular is roughly where you want it so it's the black that will have to yield to the width principles already established on the regular). You may even find that the regular needs tweaking.</p>
      <p>Are you making the widths consistent across weights? If you do, then the black will inevitably look narrower than the regular. The light/thin end may even begin to look a little extended! It's a nice thought to have a uniform width across weights but in practice (particularly in the extreme weights) they will look like they are different widths. It's amazing how much wider you'll need to go with the black to make it look the same width optically.</p>
      <p>If you put both Regular and Black /o/s next to each other, I'm sure you'll see that the dynamism that Craig has already referred to is rather too much in the black weight (not just the /o/, although that's where it's perhaps most obvious). For me, it isn't more 'plain' that you want, it's more <em>consistent</em> across weights. Plain is fine. Workhorse typefaces can't afford to be too flamboyant.</p>
      <p>So generally, to me at least, most characters look narrow in the black. However the /a/ and /e/ look about right to me, maybe even a touch wide, but they make particularly the /b/ (and similar glyphs) and the /n/ (and similar glyphs) look very narrow indeed.</p>
      <p>The black looks much more tightly spaced than the regular (which I meant to say looks a touch loose, although it reads very well being that loose).</p>
      <p>The /i/ and /j/ dots/tittles could afford to be more circular and therefore come closer to the tops of the stems (which I'm fine with being flat BTW). The dots look a little like they are floating away in the black. Also, the dots on the /i/ and /j/ need to influence the period much more (or vice versa).</p>
      <p>As far as the tops of the /b/, /d/, /h/ etc being slanted is concerned, if they are flat tops in the regular, they should be flat in the black in the name of consistency. Slanted is fine (I prefer flat but it's your baby) but do make them slant in all or none of the weights.</p>
      <p>If the black /k/ looks right (to me it's not bad), then the regular /k/ needs to be narrower. I sound like a broken record with that regular /k/!</p>
      <p>You're right, if you make the top of the /r/ longer (CaleD), you'll get big white areas in black text (especially if this particular weight continues to be this tightly spaced). A lot of designers make their /r/ deliberately narrow to avoid this, you're in good company.</p>
      <p>&gt;&gt;&gt;I don't see what's wrong with the y. I quite like it actually.<br>
      Me too, but maybe try a bit of optical adjustment (see Craig's comment). May get even better!</p>
      <p>When you've done the caps I would make a multiple master (assuming that's the route you're going down to make your range of weights). This might help with the whole width thing.</p>
      <p>&gt;&gt;&gt;Enough about the name.<br>
      You're not kidding. I've been trying to think of a name for my latest effort and it's been impossible! If you've found one you like, happy days! At this stage, the name is relatively unimportant and may change again. The only thing I would add is that, in an ideal world, you do want your name to begin to show off the best characters (or maybe that's not as important as I think it is?)</p>
      <p>Beautifully done, hats off once again. Please take my comments with a big pinch of salt. I'm no expert, esp. in the company of some of the guys who post here.</p>
    html_clean: |-
