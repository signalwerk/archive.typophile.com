      <p>I think the /y/ does need some work. If you made the longer / stroke taper less (by letting it swing out rightward more at the baseline), you would fix what I see as weakness at the beginning of the tail. As a happy byproduct, the right contour of the letter would then be at a less steep angle, which should make spacing a bit easier.</p>
      <p>I wonder if the outer contour of /o/ is bit too "dynamic" for the rest of the face.</p>
      <p>/d/'s upper juncture seems a touch inorganic to my eye.</p>
      <p>Some nice drawing here, like /f/g/t/. The angle of the ascender terminals works well.</p>
