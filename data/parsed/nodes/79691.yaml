      <p>Not so very long ago, there was an industry that made the great bulk of its money by selling machines for setting type, and a smaller portion of its money by selling fonts of type to be set on those machines. Given the amount of time and labour necessary to manufacture the fonts, I suspect quite a lot of them served as loss leaders: the availability of an extensive library of typefaces was a selling point for the machines, even if some of those types were seldom actually purchased. Competition in the machine market took place in the areas of real or perceived quality of output, price, and typeface availability (the latter open to various forms of circumvention, from similarly styled types to outright copying of designs, and inviting the eventual development of the machine-independent typeface business model of ITC).</p>
      <p>How does this relate to the iPad discussion? It seems to me that what is missing from some of the analysis of rendering variables in the webfont market is the recognition that <em>it is still with the machines where money is to be made,</em> and where competition takes place in the area of real or perceived quality, and hence in the area of rendering. In the period of greatest predictability in text rendering, i.e. the initial years of TrueType, there was essentially only one machine, manufactured by various companies from largely interchangeable components; machine differences in device resolution and gamma had minimal impact on what one could expect from the behaviour of a given TTF. But that is very obviously no longer the case. Now there are lots of machines, and there is once again value to companies in trying to compete in terms of real or perceived quality of output, or 'user experience' as it is now reckoned, including in the area of text rendering.</p>
      <p>This competition comes with a massive support cost, of course, but it is one that the machine makers have successfully shifted onto the publishers, i.e. the cost of trying to target multiple devices with different rendering environments. So, David asks: ‘...how long can the multifacted browser/device intersection last more costly than print?’ And I suspect the answer is that it will last for as long as there is more money to be made from making and selling a machine than there is to be made from either publishing content to be read on it or making fonts to display that content.</p>
