      <p>Dunwich&gt;<em>"Which makes me wonder if web fonts will really take off for sites not targeted at hi-res phones. Because right now, even among the handful of well-designed screen fonts, few web fonts come close to Georgia and Verdana."</em></p>
      <p>Take off?<br>
      Not quite sure what hi-res phones have to do with it, but <a href="http://googlewebfonts.blogspot.com/2011/02/google-web-fonts-new-stats-new-name.html" rel="nofollow">the Google Font API now serves roughly 50 million daily requests, across roughly 800,000 unique websites.</a></p>
      <p>I started out assuming that visual quality - at least what that term means to me - would play a big role. Seems I'm wrong. And that's been obvious for awhile.<br>
      Whatever "value" is to these users, it doesn't have anything to do with comparisons to "well-designed" screen fonts like Georgia and Verdana.</p>
      <p>The web has it's own decorum. More casual and experimental than print, for sure.</p>
      <p>O would some power the gift to give us, to see a font as others see it</p>
