  html: |-
    <p>Does iPad make any use of font hinting, if available, please? I mean not just safari browser, but the device itself, e.g. in purchased apps.</p>
    <p>As far as I know, the CoreText rendering engine on Mac OS X completely ignores font hinting and rather employs subpixel antialiasing (source: <a href="http://www.typotheque.com/articles/hinting" title="http://www.typotheque.com/articles/hinting">http://www.typotheque.com/articles/hinting</a>).</p>
    <p>However, iOS devices do not use subpixel antialiasing (probably due to portrait/landscape orientation switching) and do only standard "grayscale" antialiasing, which obviously leads to less precise results. So I am wondering whether or not do they make any use of font hinting (to compensate this)?</p>
    <p>The reason why I'm asking is we want to embed Neue Helvetica in an iPad app we are developing now (the Neue Helvetica included in iOS does not have Latin Extended-A charset, unfortunately). And we are wondering whether we should invest in the hinted version offered by Linotype, labelled as XSF (more about it here <a href="http://www.linotype.com/2049-16432/xsf.html" title="http://www.linotype.com/2049-16432/xsf.html">http://www.linotype.com/2049-16432/xsf.html</a>)</p>
    <p>Any ideas, please?</p>
    <p>Thank you very much.</p>
