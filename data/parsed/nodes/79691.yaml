      <p><cite>Hmmm. First, KL, do you have a problem with the iPads current resolution?</cite></p>
      <p>Yes. After having seen the iPhone 4, every other display makes me feel like going back to Duplo after having advanced to Lego. :)</p>
      <p>For people who do (web)apps and want to target a very specific version of a specific device, sure it's nice to know there are so many pixels available. It's reliable in a way. But then, every increase of resolution will become an issue (admittedly, Apple "solved" it gracefully when introducing iPhone 4). And, as more and more such decives show up (leaving aside quality of hardware, quality of OS &amp; its UI, and such) and all of them come up with different screen sizes and resolutions (pixel count information alone is useless), people better start thinking of an approach to express design in a way more flexible than just counting pixels. Now that Apple and Microsoft, after long period of reluctance, did this step with their "big" OS's UIs, it sounds like a bad joke that people should start getting back to do pixel-based design.</p>
      <p>I thought that discussing resolution-independent design belongs to a past era. Hm.</p>
