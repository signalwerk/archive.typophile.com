      <p><cite>"Hinting" is a terrible term. Non-descriptive, opaque inside lingo.</cite></p>
      <p>Actually, I think it's an excellent term. I don't know if it was created or merely popularized for the Type 1 font format, but it's quite appropriate for that. T1 hints do not dictate how device pixels behave, but simply provide more information ("These stems should be the same", "These features should all align") about font and glyph features that a PostScript rasterizer can use to create better output.</p>
