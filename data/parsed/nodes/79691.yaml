      <p>@Richard: <em>I started out assuming that visual quality - at least what that term means to me - would play a big role.</em></p>
      <p>It will, it just never does at the first wave, when mere novelty and the cheapness thereof rules. This goes back to digital day one, when typesetter organizations decried the quality of Apple's 300 dpi typesetting, fat lot of good it did them.</p>
      <p>Then once Linotronic output resolution was high enough, and we had 600 dpi laser printers, we didn't worry about bad hinting on monitor screens for 10 years, until it became an issue with the WWW.</p>
      <p>I don't have a problem with the fuzziness of Apple's rendering—after all, as a connoisseur of letterpress printing, it reminds me of good old ink spread on a lovely high-fibre rag stock. And haven't we been decrying the emaciated quality of so many digital body types, and craving heftier fonts, for most of the digital era?</p>
