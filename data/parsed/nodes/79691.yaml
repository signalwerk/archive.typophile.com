      <p>Hmmm. First, KL, do you have a problem with the iPads current resolution?</p>
      <p>Ummm, JH, if the challenges of which you speak, had been met, as opposed to more or less faked, we would not be having this conversation.:)</p>
      <p>Rmmm, My point was not that the iPad, in it's entirety, is the only way to go. Do you have one by the way, John, Simon?</p>
      <p>The point was that key typographic ingredients are present, like browser irrelevance as far as displaying content and presentation, designer awareness of size and space, fonts that always match the device, and predictable scaleability.</p>
      <p>In the meantime, no, the fonts used on iPads don't need hints... But if you want to, you can grid-fit a font for any size below around "12 pt" and improve it. To drive the nail through the tissues, in the standard world of web publishing, one is compelled to try and make one font that can do 5 things, usually doing the web text thing unwell, (aliased, aa greyscale, aa CT, aa CTDW and Mac). In this non standard platform, one has two ways of doing the web text thing, one way well, one way perfect.</p>
      <p>Standard or not, if you are a typophile you gotta love that.</p>
