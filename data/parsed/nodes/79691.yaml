      <p><em>Hinting is done "on the fly" in a sense.</em></p>
      <p>I think that is a misleading and potentially confusing statement. What Apple do is apply some vertical gridfitting to outlines as part of their rasterisation process, and then fuzz the whole lot with antialiasing. You don't need any hinting for this.</p>
