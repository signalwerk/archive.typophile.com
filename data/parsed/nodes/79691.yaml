      <p>James: <em>In this case the machine doesn't need to be hardware...</em></p>
      <p>Right. I had originally referred to physical machines and virtual machines in my post, but removed this sentence as I thought the analysis was already getting too complicated. The point is that the bulk of money to be made is neither in the typefaces nor in the content set with the typefaces. Which puts the makers of type and the makers of content largely at the mercy of the competitive strategies of the hardware/software makers, who are playing for the really big stakes.</p>
      <p>David: <em>...the astonishing statistics showing that north of 95% of the money made on the web is made by south of 5% of web developers.</em></p>
      <p>Well, that's better than the overall distribution of wealth in the capitalist system.</p>
      <p>The interesting analysis would look how closely that 5% of web developers is tied to hardware/software developers. I don't think the disparity can be explained in terms of ‘the cost of trying to target multiple devices with different rendering environments is way too high for most all benefits’. This disparity has developed in a market in which everyone was using Verdana regardless of rendering environment. Web fonts are too new a phenomenon for their cost factor to in any way account for the failure of most web developers to make more than a pittance.</p>
    html_clean: |-
      <p>James: <em>In this case the machine doesn't need to be hardware...</em></p>
      <p>Right. I had originally referred to physical machines and virtual machines in my post, but removed this sentence as I thought the analysis was already getting too complicated. The point is that the bulk of money to be made is neither in the typefaces nor in the content set with the typefaces. Which puts the makers of type and the makers of content largely at the mercy of the competitive strategies of the hardware/software makers, who are playing for the really big stakes.</p>
      <p>David: <em>...the astonishing statistics showing that north of 95% of the money made on the web is made by south of 5% of web developers.</em></p>
      <p>Well, that's better than the overall distribution of wealth in the capitalist system.</p>
      <p>The interesting analysis would look how closely that 5% of web developers is tied to hardware/software developers. I don't think the disparity can be explained in terms of ‘the cost of trying to target multiple devices with different rendering environments is way too high for most all benefits’. This disparity has developed in a market in which everyone was using Verdana regardless of rendering environment. Web fonts are too new a phenomenon for their cost factor to in any way account for the failure of most web developers to make more than a pittance.</p>
