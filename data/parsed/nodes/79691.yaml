      <p>@JH</p>
      <p>Me:&gt;<em>Hinting is done "on the fly" in a sense.</em></p>
      <p>You:&gt;<em>I think that is a misleading and potentially confusing statement. What Apple do is apply some vertical gridfitting to outlines as part of their rasterisation process, and then fuzz the whole lot with antialiasing. You don't need any hinting for this.</em></p>
      <p>First of all, a corporation are not plural. But I give up. Uncle!<br>
      ;)<br>
      Second, it all depends upon what your definition of hinting is. Probably yours is not mine and yours may be confusing to most people trying to understand it. "Hinting" is a terrible term. Non-descriptive, opaque inside lingo. What matters to authors is the result, not what the font creator needs to do to get that result.<br>
      Something somewhere has to map the outline to pixels. Based on the outline, a pixel outerform is created onscreen. In Windows GDI and DirectWrite, this outerform is influenced by instructions inside the font. On the Mac, it isn't. It creates the outerform on the fly. How on earth is this essentially different from autohinting on the fly?<br>
      If your point is that my statement might lead someone to think that the Mac does exactly the same thing as GDI or DirectWrite but does it automatically, point taken.<br>
      But other than that, are we unconfused?</p>
      <p>But other than that:<em>"Now publishers and designers can pretend there is only one device in the world and one fixed resolution for which one can design based on Actual Size. It's as if the past two decades and never happened, and the challenges of scalable dynamic display have been met by, um, not scaling or being dynamic. :)</em></p>
      <p>Keep hanging with webbies, John! By George, you've got it!</p>
      <p>@db</p>
      <p>As is not unusual, I have no idea exactly what you're trying to say. And what is "Actual Size". (It sounds like something I'm not particularly interested in using, but what are you referring to?)</p>
