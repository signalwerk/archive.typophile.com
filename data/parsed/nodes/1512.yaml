  html: <p>Can anybody tell me if when designing a logo - does the company that the logo is for have to buy a copy of the typeface used in it's design? Or, is it just the designer who should have purchased the typeface initially?</p>
  html_clean: <p>Can anybody tell me if when designing a logo - does the company that the logo is for have to buy a copy of the typeface used in it's design? Or, is it just the designer who should have purchased the typeface initially?</p>
