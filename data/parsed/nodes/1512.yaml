    html: <p>We build the cost of purchasing any typefaces used in the design (logo, print work, signage and interactive) into the job and pass those on to the client. <br> <br>If the client needs their own license for the ongoing use of a font (i.e for a newsletter template or text settings for correspondence) we will usually negotiate the license for them but we generally ask the client to purchase the font directly. <br> <br>In the case of a logo/logotype, I also try to contact the type designer when the project is done so they can see what we did with their work (especially since the type used in logos is usually modified significantly). This is more a curtesy than anything, and it's fun to get feedback.</p>
    html_clean: <p>We build the cost of purchasing any typefaces used in the design (logo, print work, signage and interactive) into the job and pass those on to the client. <br> <br>If the client needs their own license for the ongoing use of a font (i.e for a newsletter template or text settings for correspondence) we will usually negotiate the license for them but we generally ask the client to purchase the font directly. <br> <br>In the case of a logo/logotype, I also try to contact the type designer when the project is done so they can see what we did with their work (especially since the type used in logos is usually modified significantly). This is more a curtesy than anything, and it's fun to get feedback.</p>
