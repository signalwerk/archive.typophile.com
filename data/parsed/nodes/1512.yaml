    html: <p>I've been teaching a digital lettering course, and my students who all said they were "very comfortable" in Adobe Illustrator at the begininng of the course, are realizing that rendering original work with bezier tools is a lot different than what they are use to doing in AI.  <br> <br>bj states that every designer should know how to do this, and I agree, but not every design student has been taught how, so I wonder how many designers know how to handle a bezier.</p>
