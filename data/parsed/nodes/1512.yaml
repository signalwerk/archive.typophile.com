    date: 2003-10-11T13:23:00
    date_raw: 11 Oct 2003 — 1:23pm
    votes: null
    html: <p>I agree. There are too many 'typed out' logos. I think <br>there are a lot of designers out there who are too afraid of <br>type design to try. I know a bunch who couldn't render a <br>letter to save their lives. (Oh no, my beziers are lumpy!). <br>Given, I am still trying to perfect this art, but I think there <br>should be a little more emphasis on drawing type in design <br>schools. I don't think people realize how powerfully unique <br>letter forms establish identity. <br> <br>I always smile when people ask what font I used for a logo <br>and I can say, 'No font, it's custom'. Sometimes even <br>clients are impressed. If nothing else, it makes you feel <br>macho in a nerdy designer kind of way. <br> <br>The worst are logos done in script fonts that are supposed <br>to look handwritten. It's even worse when they repeat <br>characters without using alternates or ligatures. I have a <br>hard time justifying 'hand-written' fonts anyway, let alone <br>in a logo. If you want to look like calligraphy, hire a <br>calligrapher, or learn to draw yourself. <br> <br>It's true that it's easier to make deadlines and budgets <br>with fonts, though. And we've all been there...</p>
