    html: "<p>When making the proposal on the logo include all your out of pocket costs including typefaces. If its type converted to line art its one thing but if the client wants multiple users to be able type the logo as a typeface they will have to buy a multiple user licence for that face. Don't give away your work and let the client know: you can't bake a cake without flour and you can't create his/hers logo without type.</p>"
