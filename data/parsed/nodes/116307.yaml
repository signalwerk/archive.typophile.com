    html: |-
      <div class="comment-spam-body"><p>In general I always try to make currency characters the same width as tnum figures if the design allows it. There are some that can not be done that way without distortion of their traditional appearance. The ones you show in your code usually will work well with the exception of the percent character.</p>
      <p>Percent does not need such treatment because it doesn't usually need to align with any character other than another percent in tabular typesetting. I would not force it into a width it doesn't look good in.</p>
      </div>
