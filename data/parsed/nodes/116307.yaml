    html: <p>If you take the typeface's position and not the user's, you can only guess. If you ask one user and they say what they want, the font is one more informed. Timetables point to one set, including punctuation, while size charts point to another set including fractions, (the inevitable control character of which is the percent). Monetary symbols are an obvious target for some kinds of settings, but not without proper fractions, dashes, spaces and punctuation for others. If you gather that all together, it can be quite disruptive if not properly used. Linotype developed a system based on the em, 3/4s, 1/2, and 1/4 of it, and mixed glyphs for different uses, knowing their users had secure access to all the right dashes and spaces. Today, not so much.;)</p>
