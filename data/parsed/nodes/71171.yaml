    html: |-
      <p>I’ve managed to solve my XeLaTeX issue. In fact, Windows Vista keeps a copy of the fonts each time you install a new version, and the last one is not necessarily the one with the right name. I had to manually delete each unnecessary copy from a console in administrator mode (after a system restart because some were locked for whatever reasons).</p>
      <p>What I was talking about with italic correction of the script alphabet is to change the right sidebearing of the letters in question to be able to use italic correction to position the sub and supscript. I don’t know if this would have any side-effects, but I was suggesting it because that’s the standard practice for the script letters.</p>
      <p>Now that I can use XeLaTeX to test to the fonts, I’ve done more tests and noticed a few more glitches: the fraction rule does not seem to be of the appropriate thickness, although it seems to be working in ConTeXt if I judge by your specimen.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/xits_1-005_xelatex_fraction_rule_4251.png"></div><p></p>
      <p>The problem happens with all opentype math fonts (Asana, Cambria, XITS) but not with normal math fonts (txfonts, mathdesign, etc.). Is this a known problem in XeTeX?</p>
      <p>Another thing which I noticed is that the delimiter | is far too small when used in a formula like <code>$|\{x\in\mathbb{Q}\mid x^2&lt;2\}|$</code>:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/xits_1-005_vertical_bar_size_3713.png"></div><p></p>
      <p>The problem does not appear with Cambria or Asana.</p>
      <p>Also, the italic correction you added to the P does not seem to work with XeLaTeX:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/xits_1-005_P_ic_3848.png"></div><p></p>
