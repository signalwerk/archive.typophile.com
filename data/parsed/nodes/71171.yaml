      <p><cite>On Windows (I had only access to XP machines) I always delete the old version before installing the new one, else I always get the old version.</cite></p>
      <p>Thanks, I’ll try to do that the in the future.</p>
      <p><cite>This is because, unlike Cambria and Asana, the default bar glyph is short (it doesn't descend below base line the same degree as the curly brackets. Adding explicit \left and \right will give the proper sizes (it is good idea to always do this anyway), $\left|\{x\in\mathbb{Q}\mid x^2&lt;2\}\right|$.</cite></p>
      <p>When doing inline math, you often don’t want to use <code>\left</code> and <code>\right</code> as they often produce delimiters which are too high:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/left_right_too_high_5133.png"></div><br>
      These too high delimiters are not very pretty and they may also disrupt inter-line spacing (it’s not the case here). Of course, you can always <code>\smash</code> the <code>^2</code>, but it’s a bit tedious. And you still have the problem when you use the vertical bar to denote a restriction:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/xits_1-005_restriction_symbol_6073.png"></div><br>
      I suppose something can be done at macro level (I'll have to look up the code of unicode-math), but if in the future you decide to change some glyphs in XITS, this one would be a good candidate.<p></p>
