    votes: null
    html: |-
      <p>The remaining floor and ceiling delimiters issue is a bit trickier, I may try to give it a look later, but it is a low priority now.</p>
      <p>Intermingled symbols with XeTeX are likely to be caused by presence of more than on version of the font accessible to XeTeX (e.g. one system wide copy and one installed in TEXMF tree), make sure you have only one version of the font (or identical copies), having different version of same font installed is known to lead to such issue in XeTeX.</p>
      <p>The script alphabet is a bit trickier, the glyphs are spaced as italics, so the width of the glyph equals the width of the bounding box, that is why subscripts are so far. Here italic correction will not help, we instead need to use math kerning support in OpenType math, but I'm unlikely to do this for the first "stable" version (no much time for math fonts right now). The need for math kerning is also true for the upright alphabets. The double struck alphabet can benefit from some italic correction too, I think I can do that, but not the finer math kerning.</p>
