      <p>I'm testing the current beta (1.004) in every bit of software I can, and so far I've only found a few problems.</p>
      <p>First, the delimiter issue Philippe mentioned is likely caused by the lack of extendable floor/ceiling brackets—I noticed that, unlike Cambria and Asana, there's no entry for them in the Vertical Construction part of the MATH table, so they max out at the .size4 variant.</p>
      <p>In ConTeXt/LuaTeX, using \vec with Greek letters causes the arrow to be offset to the left, possibly because none of the italic Greek math letters have Top Accent values.  This isn't an issue in XeLaTeX (using unicode-math) or Word 2007.</p>
      <p>There's also a problem with \vec and some Greek and Latin lowercase italic math letters in XeLaTeX (d,f,m,w,κ,μ,π,σ,φ (both forms),χ,ψ and ω; I haven't tested non-italic or uppercase letters yet) where adding an exponent or prime outside the \vec command causes the arrow to both drop closer to the letter and lengthen, colliding with the exponent.  This may actually be a unicode-math or XeTeX bug.</p>
    html_clean: |-
