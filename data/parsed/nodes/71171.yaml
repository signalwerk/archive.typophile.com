    <p>As you might now, the long awaited, 15+ years, version 1.0.0 of STIX fonts have been finally released. However, the release disappointed many people who want to typeset mathematics with STIX fonts, as they neither released LaTeX support files nor supplemented the fonts with the new OpenType MATH table, ruling out any quality mathematical typesetting engine.</p>
    <p>Fortunately, STIX were kind enough to release the fonts under Open Font License, so giving the community the power to scratch their itch and not wait yet another 15 years for next release.</p>
    <p>Having experimented with an OpenType MATH version of STIX beta release, it was relatively easy to supplement the final release with MATH layout features, thanks to the powerful FontForge who never let me down, and so XITS was officially born.</p>
    <p>Despite being written in all caps, XITS in not an acronym but a funny way to get around the reserved name clause if OFL, which I never liked BTW, it also hints the long term goal to enhance it with right to left mathematical typesetting capabilities.</p>
    <p>The font is still beta as regards the OpenType layout, any help or feedback is highly appreciated, especially testing with MS Office 2007 since I no longer have access to Windows machine and thus did all my testing on ConTeXt/LuaTeX.</p>
    <p>After the poring introduction, here is the download link:<br>
    <a href="http://github.com/khaledhosny/xits-math/downloads" title="http://github.com/khaledhosny/xits-math/downloads">http://github.com/khaledhosny/xits-math/downloads</a></p>
    <p>And here are some examples:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/xits-specimen_6154.png"></div><p></p>
