    html: |-
      <p>I managed to fix the wired large composited symbols issue, it turned out that Office expects all vertical components in a composition to be setting on the baseline, however STIX glyphs usually descend below the base line, this results in vertical composites being offset in this strange way. TeX engine are forgiving about this (the glyphs are stacked based on their bounding boxes).</p>
      <p>A new release will be uploaded soon.</p>
