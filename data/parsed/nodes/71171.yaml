      <p>The 1st issue is mysterious, I don't know what would be the possible cause of it, it doesn't show in either LuaTeX or XeTeX (both support OpenType MATH), can any one with more knowledge about Office implementation help tracking this down?</p>
      <p>The 4th issue is related to this too, there is something wrong with glyph assembly but I cannot identify.</p>
      <p>The 2nd issue results from the very large WinAscent/Descent values in the font, which is needed to avoid clipping large glyphs. Though the font have TypoAscent/Descent and fsSelection bit 7 set properly, they are ignored by office for reasons I don't know. Not sure what Cambria does, but it could be because of its embedded bitmaps that don't have any of the large glyphs.</p>
      <p>The 3rd issue is due to lack of italic correction for the capitals, I'm already working on it.</p>
      <p>The PDF issue is strange, could you try other PDF generators? it is like a bug in PDFCreator that got triggered by XITS.</p>
