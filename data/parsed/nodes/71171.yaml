      <p><cite><br>
      I’ve managed to solve my XeLaTeX issue. In fact, Windows Vista keeps a copy of the fonts each time you install a new version, and the last one is not necessarily the one with the right name. I had to manually delete each unnecessary copy from a console in administrator mode (after a system restart because some were locked for whatever reasons).<br>
      </cite></p>
      <p>On Windows (I had only access to XP machines) I always delete the old version before installing the new one, else I always get the old version.</p>
      <p><cite><br>
      What I was talking about with italic correction of the script alphabet is to change the right sidebearing of the letters in question to be able to use italic correction to position the sub and supscript. I don’t know if this would have any side-effects, but I was suggesting it because that’s the standard practice for the script letters.<br>
      </cite></p>
      <p>I thought about this too, but I tend not to change STIX glyph metrics unless there is a good reason, and here I'm not sure what the implications of changing the advance width on spacing and it would need more extensive testing. Math kerning can solve the sub/superscript issue without the need to change the advance width, and we need it anyway to fine tone the positioning of many base/*script combinations, but it has to wait.</p>
      <p><cite><br>
      Now that I can use XeLaTeX to test to the fonts, I’ve done more tests and noticed a few more glitches: the fraction rule does not seem to be of the appropriate thickness, although it seems to be working in ConTeXt if I judge by your specimen.</cite></p>
      <p>The problem happens with all opentype math fonts (Asana, Cambria, XITS) but not with normal math fonts (txfonts, mathdesign, etc.). Is this a known problem in XeTeX?<br>
      </p>
      <p>I didn't know about it before, but seems that XeTeX ignores FractionRuleThickness math constant, LuaTeX (either with LaTeX+unicode-math or ConTeXt works fine).</p>
      <p><cite><br>
      Another thing which I noticed is that the delimiter | is far too small when used in a formula like $|\{x\in\mathbb{Q}\mid x^2&lt;2\}|$:</cite></p>
      <p>The problem does not appear with Cambria or Asana.<br>
      </p>
      <p>This is because, unlike Cambria and Asana, the default bar glyph is short (it doesn't descend below base line the same degree as the curly brackets. Adding explicit <code>\left</code> and <code>\right</code> will give the proper sizes (it is good idea to always do this anyway), <code>$\left|\{x\in\mathbb{Q}\mid x^2&lt;2\}\right|$</code>.</p>
      <p><cite><br>
      Also, the italic correction you added to the P does not seem to work with XeLaTeX:<br>
      </cite></p>
      <p>Looks like a XeTeX issue too, fine with LuaTeX.</p>
