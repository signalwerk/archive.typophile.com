      <p>The delimiter issue can be easily fixed, I actually didn't get Philippe's issue until just now, for some reason I didn't see the text between the screenshots and though he was talking about something else. This is now fixed in git, no release yet.</p>
      <p>The \vec issue is now fixed too, almost. I added top accent position to Greek, except bold upright, it is a boring job :)</p>
      <p>The XeLaTeX issue is known, it has been reported to Jonathan Kew while ago, but I don't think it is going to be fixed any time soon. In my experience, LuaTeX has much better OpenType MATH support, but unicode-math package has incomplete LuaTeX support, so my recommondation for OpenType math in TeX is to use ConTeXt MkIV until LaTeX gets better LuaTeX support.</p>
