      <p>Since the last time, I’ve tested a little more the XITS font. The floor and ceil delimiter issue is better than in the previous version but does not seem to have been completely fixed:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/floor_size_xits_1-005_5524.png"></div><p></p>
      <p>Does the same happen when using XITS in ConTeXt? Using LaTeX, I’ve compared to how other fonts behave, and some have the same problems, like txfonts:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/floor_size_txfonts_4167.png"></div><p></p>
      <p>and some others don’t, like Computer Modern:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/floor_size_cm_6026.png"></div><p></p>
      <p>I suppose it’s due to relative heights of math delimiters, which are not always the same as Computer Modern, so the problem might not be fixable without redesigning the large delimiters.</p>
      <p>Another problem, which has not changed since version 1.004 is a few italic correction and sub/supscript kerning issues. The main problem is with Blackboard bold symbols, some of which lack italic correction; the A also lacks negative kerning for the exponent:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/xits_1-004_ic_mathbb_4617.png"></div><p></p>
      <p>I’ve marked the L with a “?” because it might not be a good idea for this character to add negative exponent kerning (I know it’s been done with Times 569 4-line Mathematics, but it was for an italic <em>L</em>).</p>
      <p>Most of the mathcal letters would also benefit from having italic correction:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/xits_1-004_ic_mathcal_4227.png"></div><p></p>
      <p>Finally, some of the upright capital letters (in all forms: roman/italic, medium/bold, serif/sans, latin/greek/nabla) would benefit from italic correction or exponent kerning:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/xits_1-004_ic_upright_5729.png"></div><p></p>
      <p>Finally, I've installed the unicode-math package under MikTeX 2.8 to try XITS Math in XeLaTeX and noticed that many symbols don’t come up correctly:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/xits_1-005_xelatex_6234.png"></div><p></p>
      <p>Do you have any idea where this is coming from? (There’s no problem with Cambria Math or Asana Math.)</p>
