    <p>Respected members,</p>
    <p>More than one year ago there was a news about first ever Omani-printed version of Quran launched, I tried to find some of its samples or print screen but failed. </p>
    <p>""The e-Quran will be available to all users from the ministry's website, so that they can benefit", (part of the news).</p>
    <p>Deco Type - linguistic experts and designers of computer-aided typography - have designed the electronic Quran. (part of the news), </p>
    <p><a href="http://gulfnews.com/news/gulf/oman/first-ever-omani-printed-version-of-quran-launched-1.130558" title="http://gulfnews.com/news/gulf/oman/first-ever-omani-printed-version-of-quran-launched-1.130558">http://gulfnews.com/news/gulf/oman/first-ever-omani-printed-version-of-q...</a><br>
    link of the news.</p>
    <p>If someone have samples or link from where to see the samples or to download, It would be highly appreciated.</p>
