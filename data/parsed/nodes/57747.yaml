      <p>Nick<br>
      <em>Just to stir the pot, I would suggest the opposite is true, that being so heavily invested in the past is likely to produce designs which are technically and aesthetically adept, but conservative at the least, if not stale.</em></p>
      <p>I am not advocating living in the past at all. I am not advocating copying the past at all. I am advocating that all type designers should study the history and development of letterform construction and to become at least familiar with, if not competent with the tools of their trade (including vector). The type designer needs two broad areas of knowledge: the knowledge of familiarity and the knowledge acquired through doing and making. The knowledge of familiarity is grounded in experiencing sensations; it is knowledge that is gained through the senses. A simple example is the smell of coffee. The only way one gets to know the smell of coffee is to smell it. No amount of description can give someone an understanding of what it is to experience the smell of roast coffee. Some would call it a connoisseurship or an aesthetic, either way, it is exceedingly valuable. I would argue it is essential. Not only in the connoisseurship of tasting food &amp; wine, or in the connoisseurship of art/craft attribution, but in connoisseurship of diagnosis. It is quite surprising just how much diagnosis depends upon connoisseurship. The engineer, mechanic or type designer has a much need to acquire the familiarity of problems through his or her senses as a doctor. The way an engine sounds or the way a mechanism responds to the touch are revealing only to the knowledgeable engineer.<br>
      The other area of knowledge needed is know how. The ability to get the job done. This is a physical process involving the physical handling of the medium. Understanding is gained through doing and making, not  through theory. Theory has over taken practical knowledge and craft knowledge has been replaced with novelty and the gimmick.</p>
      <p>Debates about ’merit’ only make sense within an agreed system of values. Some times I wonder if talking or writing about the merit of a particular typeface in the context of contemporary Western typography and type design at this stage in our history is now a meaningless exercise. There is no agreed framework of values and consequently there can be no real connoisseurship; there are just private opinions publicly expressed and jostling for attention. So much of the anti-handcraft conventions and opinions of contemporary type design are so ingrained that it takes a considerable effort to question them.<br>
      There are so many erroneous assumptions, myths and prejudices touted about craft knowledge to make any serious discussion impossible. Here on typophiles it is assumed that if you dare to pick up a pen or even acknowledge a liking to serifs you will become irresistibly, as though beguiled by Sirens into a never to be free entrapment of a souless, expressionless, conservative and stale world or archaic madness.</p>
      <p>It is my belief that the anti-craft knowledge prejudices are mistaken; that type design benefits from a traditional approach, which recognizes that process and content are interdependent; that craft knowledge itself enriches individual experience and becomes a part of the self that is expressed in the final design.</p>
      <p>If you are looking for conservative and stale, look at almost every sanserif design post Helvetica.</p>
