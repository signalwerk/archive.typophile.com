    <p>As there has been a lively and interesting discussion started by Paul on Typography &amp; Lettering, I thought I would start a more controversial topic. I will probably have to board up my windows and move the family interstate to be safe, but...</p>
    <p>Do those who have a solid and complete historical knowledge and technically skilled background in hand lettering make the best type designers? My observation would point to an answer of a very strong, yes!</p>
