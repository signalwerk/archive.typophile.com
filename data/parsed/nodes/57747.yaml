      <p>@ Graham</p>
      <p><em>Do those who have a solid and complete historical knowledge and technically skilled background in hand lettering make the best type designers? My observation would point to an answer of a very strong, yes!</em></p>
      <p>You would say yes! Your observation is bound to be at least tinged with the presumption that hand-lettered forms are the best forms, and those that design with this model are inevitably the best designers. I’m not sure you (or anyone else for that matter) are able to be objective when answering this question. All you’re doing is stating your preference.</p>
      <p><em>There are so many erroneous assumptions, myths and prejudices touted about craft knowledge to make any serious discussion impossible.</em></p>
      <p>The erroneous assumption you have made here is that everyone’s idea of the best designer is the same. (Your top 10 designers will no doubt be completely different from mine). </p>
      <p>Here’s an observation of mine: Some feel the need to fight the corner of handwriting as if it weren’t able to do so itself. Are you afraid that some people think that what you love is a bit dull and not that relevant any more, like all those 23,789,365,812,002 cuts of Helvetica, a few of which <em>I</em> quite like?</p>
