      <p>When you say “hand lettering” I assume you’re referring to natural media.<br>
      However, making letters with vector tools is every bit as much hand lettering, whether one is manipulating a stylus, mouse, trackball or trackpad.</p>
      <p>But what’s so natural about “natural” media anyway?—all media is manufactured unless it’s a sponge or a stick.<br>
      So the most natural way to work today, according to the precept of truth to materials, is to use digital tools for digital media.</p>
      <p>It might seem there’s not much truthiness in making chirographically-informed letter shapes by stringing together BCP outlines, but by the same token, the punchcutting that started this whole affair was equally removed from the brush and the quill.</p>
      <p>Nonetheless, Peter Schoeffer was a scribe before he became the first punchcutter.</p>
      <p><em>What matters is where you finish.</em></p>
      <p>Right!</p>
