      <p>Nick: “What matters is where you finish.</p>
      <p>Right!”</p>
      <p>I couldn’t agree more. I am trying to stay out of this for a little while as I don’t want to lead anymore than I already have.<br>
      I will say that hand lettering is not restricted to a particular tool. As Nick says, what matters is where you finish. However, even Nick returns to the old hand lettering is hand writing tag and slotting ’lettering’ into brush or pen made ’hand writing’. The long time and experience hand letters here will understand me when I say it doesn’t matter what the tool is; brush, pen, stick, chalk, finger, nose, stone, chisel, clay, glass, straw, sponge, cardboard, computer, etc, etc and on &amp; on for ever. Nor does it matter that the letters were originally carved, scratched, written or drawn on paper or directly on a computer screen, or pissing in the sand.</p>
      <p>The tool of choice is not the point, nor does it matter how it was constructed, nor that the type face shows a ’hand made’ look. Nor is it about exalting or damming the past. My point is that those who have well developed hand skills and a complete working knowledge of the history of letterform construction and have developed an understanding of what can be physically achieved with the tools of their craft, produce more aesthetic, functional, practical and useful type design. Its about aesthetic, knowledge and practical skill. Type design is a craft whose content is substantially dependent on practical skill, and whose intention is discovered through the process of making the object. This requires tacit knowledge, a knowledge very different to that required to learning a computer program.</p>
