      <p><em>I don’t think that’s what I said.</em></p>
      <p>Thats how I read it. Apologies if I misinterpreted. </p>
      <p><em>Isn’t your reasoning a bit circular Graham?</em></p>
      <p>Not really, but taken out of context of the whole post, possibly. I was saying that those with a sound back ground in traditional &amp; historical methods of developing &amp; constructing letterforms with traditional hand tools produce better type design than those who by-pass or merely glance at this rich history. There are many here on typophiles who denounce and ridicule the past (and the pen) and quite obviously have limited knowledge &amp; understanding of the value in acquiring such knowledge and developing traditional skills. </p>
      <p><em>Why don’t you consider the knowledge of how to create glyph outlines with vector drawing tools to be “tacit”? The process involves making shapes by manipulating a hand tool. How is this categorically different from pen or brush on paper?</em></p>
      <p>I thought I made it very clear that it doesn’t matter what the tool is, nor how the letters are constructed. Vector or pencil makes no difference to me. The point I was making is that the skills and knowledge gained through intelligent study and practical hands on making of letterforms using traditional tools and methods is a very different set of skills and knowledge than that gained from by-passing the origins of our craft and beginning with helvetica, beziers and Fontlab.</p>
      <p>Nick, do not forget what you bring to your wacom and fontlab. I have seen your work, there is informed knowledge and understanding of the craft of letter making inherent in it. You did not gain that knowledge or drawing ability via the wacom &amp; fontlab only. It was already ingrained before fontlab was created.</p>
      <p><em>Wacom and FontLab are the tools of my craft.</em><br>
      As they are mine, along with the pencil, quill, steel pen, brush, chisel, sponge, stick......</p>
