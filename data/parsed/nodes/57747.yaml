      <p>Graham; <em>...those with a sound back ground in traditional &amp; historical methods of developing &amp; constructing letterforms with traditional hand tools produce better type design than those who by-pass or merely glance at this rich history.</em></p>
      <p>Just to stir the pot, I would suggest the opposite is true, that being so heavily invested in the past is likely to produce designs which are technically and aesthetically adept, but conservative at the least, if not stale.</p>
      <p>And that’s the state of most script fonts today.<br>
      Just search “script font” at Veer, and see if you don’t end up in the 1950s.<br>
      And at FontFont, the majority of “handscripts” are rough and vernacular.</p>
      <p>The exception is graffiti styles, eg <a href="http://www.fulltimeartists.com/Fonts/FontMenu.htm">Highground</a>, where you at least make it to the ’70s. Although a spray can may not be considered a “traditional hand tool”!</p>
      <p>So, the old guys can do authentic truth-to-materials scripts, based on their drawing skills in traditional media, but they don’t have a contemporary vibe. While the young guys can draw up a storm with mad Illustrator skills (and mimic retro styles), but can’t originate new script styles of any sophistication, because they have never put in 1,000s of hours working with traditional media.</p>
      <p>House Industries and Font Diner position themselves squarely as retro outfits.</p>
      <p>Where are the new script typefaces with elegant rendering, that would be anachronistic if transported to the past?</p>
      <p>To start the ball rolling, Patrick Griffin’s <a href="http://new.myfonts.com/fonts/canadatype/memoriam/">Memoriam</a>.</p>
