      <p>“If you are looking for conservative and stale, look at almost every sanserif design post Helvetica.”</p>
      <p>I have looked and I don’t see what you see at all. What is different now is shear volume. There are thousands more faces coming out each week and many by less than stellar designers. This is only because the technology of our day allows it. Prior to the 90s, you had a much greater investment required and you had to convince a foundry to produce your design. There is a respectable percentage of very good work coming out today, however. Even if you throw out all the crap and pirated works of today, there still is more good work done now than in any other time in history. That is not to say that there is more talent around today, it just means that there is more opportunity given by digital technology—along with the chaff commeth the wheat and sometimes even the wheat germ. We have planted many more acres of seed so we have more to harvest and more trash to clean up afterwards.</p>
      <p>ChrisL</p>
