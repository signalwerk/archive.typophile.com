      <p>Good points Chris. I think a great part of the problem is that many people can not tell good from bad or innovation from novelty. It is not only the old faces that get copied. The new stuff gets reconstituted regularly as well. This, I think, is due to the lack of craft. Without craft they have no knowledge of where to look to find solutions to the problem, nor do they have a base from which to build or to experiment from. Coupled with knowledge of only one tool, they are restricted in choice, they have to copy because that is all they can do. Hence, a slightly adjusted shape becomes the latest “innovation” ergo: 23, 789, 365, 812, 002 and counting, variations of helvetica, all equally ugly as the last.<br>
      That reminds me, I have to take out the trash.</p>
