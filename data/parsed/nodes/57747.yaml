      <p><em>At the risk of flames from the calligraphers, here’s my take: as a general rule it’s not about the skill of your hand, but of the skill of your eye. If I’m not mistaken, many of our best type designers, including Matthew Carter, are not particularly skilled calligraphers.</em></p><em>
      </em><p><em>I’m sure that skill in handling a pen and brush can only be a big help. And it is probably a necessity for developing faces that are close to hand written letters, such as Michael’s excellent type faces. But there are too many great type designers who are not calligraphers to view hand skills as a necessity.</em></p>
      <p>No flames from me. I think your right in that its not about the hand (nor the tool), but about your eye, discrimination and judgement.<br>
      Matthew Carter took an internship at the Enschedé type foundry when he left secondary school. He started with punchcutting and he worked as a freelance lettering artist for several years. Although he now works on computer (like all of us) he has a knowledge base that is steeped in the history of printing, punchcutting, lettering and type design. He actually learnt these skills on the job doing real work. This acquired knowledge shows in his type design and his type faces reflect his deep understanding.<br>
      It is easy to see the obvious traits of the hand in some so called ’calligraphic fonts’, but it takes a knowledgeable and trained eye to spot them in some others. It is also possible to see in many favoured designs a lack of informed understanding.</p>
