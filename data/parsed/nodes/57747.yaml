      <p>I don’t think the variation and creativity now is any less than any comparable time in history. Frankly, much of the lack of variation today is do to copying older designs. There is a tendency for excessive nostalgia. This may be just fear of failure. There has been some quality work out of this but it has not been original work. It is very difficult to be original if you rely too much on past forms as a models. We have to be willing to accept a high degree of failure to have any chance at originality. I say fire away in any way you wish without concern for fitting into a form reference and take your chances. You will see more originality and certainly more failure but you don’t have success without risk. If you follow old forms with skill you stand a good chance of making type which most will find beautiful. You won’t, however, stand a good chance of being original. Risk is the mother of invention and fortitude to push on is the father.</p>
      <p>ChrisL</p>
