      <p>I’m late coming into this set of discussions, but thought I’d chime in a bit.</p>
      <p>I don’t think its necessarily useful to make generalizations of various peoples skills via their background. I do think the typographic criteria of anybody’s design is going to reflect their training, interests, natural talent, etc. If you’ve developed a skill with the broad-edged pen your eye will also be trained to recognize good form that is calligraphically based. Of course that works both ways. If you are a lettering artist and have reworked your letters digitally a lot, sometimes you learn to coax letters out of your pen that your hand was not ready for before. </p>
      <p>Type designers that cut their teeth on modern sans serifs or grunge type are going to have a different eye for type and will work with whatever tools get the job done even though ultimately its all digital these days (except maybe folks like Dan Carr). I look at a lot of type and handlettering, but also tend to go in directions that evolve from my own background. </p>
      <p>«Where are the new script typefaces with elegant rendering, that would be anachronistic if transported to the past?»</p>
      <p>How do you define contemporary script? Contemporary to a lot of graffiti artist these days seems to include a loose use of broad-edged lettering as well. Very rough unpolished lettering is very popular these days as handcrafted DIY movements flourish. I suppose that can make more skillfully rendered scripts seem anachronistic today, but they seem to fit segments of the market. I like some of the fifties scripts as well, but tend to not do a lot of that myself. I think we are all invested in the past to some degree. A lot of contemporary sans faces are based on older type but designed with digital use more in mind.</p>
      <p>I like that people come from all sorts of influences to type design these days. It brings a richer variety of type to the world.</p>
