    <p><cite><a href="https://web.archive.org/web/20141017103151/http://www.the-autobiography.com/" title="Official site" rel="nofollow">The Autobiography of Nicolae Ceaușescu</a></cite> is a 2010 documentary by Andrei Ujică. It’s about Nicolae Ceaușescu but uses nothing but archival footage to tell its story.</p>
    <p>And, every couple of minutes, there’s one amazing piece of public typography (signage, banners, parade floats) after another. I put together <a href="https://web.archive.org/web/20141017103151/http://www.flickr.com/photos/joeclark/sets/72157634849676232/?detail=1" title="Typography in ‘The Autobiography of Nicolae Ceaușescu’" rel="nofollow">a Flickr set of screenshots</a>.</p>
