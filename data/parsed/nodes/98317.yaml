      <p>Of course no typefaces are forbidden in Germany! :-)</p>
      <p>Still, the association of blackletter and Nazi regime remains and that’s what makes them hard to use.<br>
      Seeing an old rural tavern sign set in blackletter is no problem, as well as a fancy and colorful parfum ad or CD cover.<br>
      But if you set a regular black headline in a blackletter typeface, it's hard for a German not to make the association with radical right politics.<br>
      I am currently setting a German typography magazine with blackletter headlines. Still feels strange. Even though I and my readers know that the connection of blackletter and Nazi regime is purely artificial. I gave the headlines a blue gradient to relieve my discomfort. ;-) This way it looks less like 1930s propaganda.</p>
