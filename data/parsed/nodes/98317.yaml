      <p>You don’t think the TrueType core web fonts were totalitarian?<br>
      (And I made the point metaphorically, comparing a corporate monopoly to a political one: 10 years ago Internet Explorer had over 95% of the world market in browsers, hence the dominance of the Core TT fonts, bundled with IE.)<br>
      They were just about the only text fonts used on the Web until @fontface, and that as a result of Microsoft's market dominance, particularly with its web browser after Netscape had been put to bed.<br>
      Sure, Microsoft has done lots of good for typography, but as they say, Mussolini made the trains run on time.</p>
