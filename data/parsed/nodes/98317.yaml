      <p>I never really understood this edict anyway. After all, Hitler was a racist, and he wanted to promote everything German as being superior. Why, then, would he ban something so obviously viewed upon as German (although not true as such, as there was no Germany before 1871, and blackletter fonts were used in many countries all over Europe during the course of history), and go with something relating to Latin origin (the Romans, and therefore, from his perverted point of view, the wrong race).</p>
      <p>I mean, Stalin, who was not only a communist, but also a nationalist, would never have replaced Cyrillic with Mongolian now, would he? </p>
      <p>I heard that somehow Hitler thought that especially the Schwabacher was created by a Jew, which later turned out not to be true - can anyone enlighten me on that point?</p>
      <p>@hrant - thanks for pointing that out. I just LOVE Blackletter typefaces, as well as old German handwritings, and usually designs containing such fonts are being rejected because of "Nazi associations" :-/</p>
