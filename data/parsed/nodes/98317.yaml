      <p>"You don’t think the TrueType core web fonts were totalitarian [Microsoft's market dominance-related squat]?"</p>
      <p>Hu?</p>
      <p>In 1986, Adobe published their first PS printer boards, which at Steve Jobs insistence, contained Linotype fonts, and one they made themselves.</p>
      <p>Then in '88 or so, Apple relicensed the same designs on the same widths from Linotype, for TT development in Mac OS VII.</p>
      <p>Then in '90, or so, MS licensed the same designs on the same widths from Monotype, in TT for Windows 3.0. </p>
      <p>Then, the web was founded in '94 based on default fonts and them yoyos would have used anything. </p>
      <p>Sounds like democracy to me.</p>
