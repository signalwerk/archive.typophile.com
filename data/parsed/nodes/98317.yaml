      <p>Tschichold was a black/white kind of person throughout his life, and a pretty self-confident one.*<br>
      With this in mind, it indeed helps to not take every single word or argument too seriously (designers and arguments aren't necessarily best friends anyway) and read his comments as saying something about a certain spirit, as John said. I think there is something to it, at a more abstract level, in that New Typography and Nazism are 'movements' and as such share some common features.</p>
      <p>* Bill, appalled by what he considered as a reactionary move of Tschichold, started his attack on Tschichold by referring to him as "one of the known typography theorists". Tschichold, in his reply, was not shy to point out that he is not "one of" but "by my best knowledge the only one".<br>
      (Today I found a copy of Bosshard's <a href="http://www.amazon.de/Typografiestreit-Moderne-Bill-kontra-Tschichold/dp/3721208331/" target="_blank" rel="nofollow"><em>Bill kontra Tschichold</em></a>. Bosshard's essay and Hochuli's shorter afterword provide some information about the context, including some funny quotes from a letter of Bill to Paul Rand about the matter. Recommended.)</p>
    html_clean: |-
