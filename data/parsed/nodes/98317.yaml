      <p>Thanks, Karsten.</p>
      <p>Tschichold's comment seems to me to be really about the spirit under which the New Typography was undertaken: the radical, ideological absolutism that not only puts forward something new but feels it necessary to denigrate that which came before. I don't think this is a particularly German characteristic or necessarily linked to totalitarianism, but I can understand how the experience of the Nazi years would have made it seem so to Tschichold.</p>
      <p>It raises the question, of course, whether something like the New Typography could develop, as a set of design principles resulting in a graphic style, without this absolutism?</p>
