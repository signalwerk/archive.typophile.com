      <p><cite>I never really understood this edict anyway.</cite> [Werfer]</p>
      <p>You can find on Wikipedia a statement that Hitler would have made as early as 1934 in the Reichstag; here is the English translation from the article <a href="http://en.wikipedia.org/wiki/Antiqua–Fraktur_dispute" rel="nofollow">Antiqua Fraktur dispute</a></p>
      <blockquote><p>
      Your alleged gothic internalisation does not fit well in this age of steel and iron, glass and concrete, of womanly beauty and manly strength, of head raised high and intention defiant... In a hundred years, our language will be the European language. The nations of the east, the north and the west will, to communicate with us, learn our language. The prerequisite for this: The script called Gothic is replaced by the script we have called Latin so far...
      </p></blockquote>
      <p>For the German version, see <a href="http://de.wikipedia.org/wiki/Antiqua-Fraktur-Streit#Erlass_zur_alleinigen_Unterrichtung_der_lateinischen_Schreibschrift_als_neuer_.E2.80.9Edeutscher_Normalschrift.E2.80.9C" rel="nofollow">Erlass zur alleinigen Unterrichtung der lateinischen Schreibschrift als neuer „deutscher Normalschrift“</a>.</p>
