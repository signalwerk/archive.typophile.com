    html: |-
      <p>Curious, where did your color palette come from? I don’t see green in any of the “example” images. </p>
      <p>Also, you might want to consider at least 4 different artists, the POP ART movement was pretty big, I’m sure you can find lots of great examples from a plethora of artists. </p>
      <p>As for the layout, it seems rather stodgy and conformed. I’m assuming this is for a Design 1 class, Intro to Typography, or perhaps a Layout Techniques class. So, I’ll also assume you’re still learning value design skills such as hierarchy, balance and rhythm. Using these principles will help create focal points within your poster with clear movement for your eye to scan without hitting to many visual traps. As of now, the overall color of the poster isn’t inviting, and my eye gets trapped in your “negative” cross that’s formed between your images. I can’t focus on the text as the bottom because it’s formatted in a way that’s difficult to read, and your header text is tight, using only color to determine the breaks (which gets confusing with the negative letter forms filled with a secondary color.)</p>
      <p>This is an honest critic of what I see in your original post. I think you have room for improvement. Don’t be discouraged, it’s good to make mistakes. You learn more from them.</p>
