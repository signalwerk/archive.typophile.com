      <p><cite>«January is capital “J”, and I guess so is the location.»</cite></p>
      <p>All-lowercase seems to be a conscious stylistic choice here, in which case capitalisation becomes somewhat irrelevant.</p>
      <p>The proper apostrophe is a must, though. So is using an en dash rather than a hyphen in the two cases on your poster, since they both indicate an interval. So, “11th october 2007 – 20th january 2008” and “10.00 – 18.00”, rather than “11th october 2007 - 20th january 2008” and “10.00 - 18.00”. And if you’re going to give the dash such wide spacing as you do between the dates, you need to do the same between the opening and closing hours. It would be preferable to do it the other way around, though, and reduce the space surrounding the dash between the two dates. Don’t remove it altogether, but rather than having a space character on each side of it, type it directly between “2007” and “20th” and add a bit of kerning (and then add similar kerning between the hours).</p>
      <p>&nbsp;</p>
      <p>Did you consider filling the p, o, and a of “portraits” with the orange colour used for “pop”, rather than the green colour used for “art”? That would create a somewhat more even oppositional relationship between the words, I’d think.</p>
      <p>And the thing that boggles my mind most of all: why are you designing a poster for an exhibition that apparently ended six weeks ago?</p>
