    <p>Hey all! Been lurking here for few weeks now and I see people giving some good advice so I decided to register. :)</p>
    <p>Basicly, we had to design a poster that would promote a pop art gallery exhibition hosted by the National Portrait Gallery, so I’ll need your opinions on what’ve created.</p>
    <p></p><div class="imageWrap"><img src="/files/poster_6414.jpg"></div><p></p>
    <p>I used the type Century Gothic which I think looks nice and modern. As you can see I played around a lot with the character kerning to give that modern feel to it. I decided to use the fading dots on the background these were used a lot in pop art. I then got a few pop art examples by famous artists from the NPG’s gallery (<a href="http://www.npg.org.uk/popart/" title="http://www.npg.org.uk/popart/">http://www.npg.org.uk/popart/</a>).</p>
    <p>Cheers</p>
