    <p>I’m making a manual for a computer game called Portal and I’m using images from the trailer for the game to keep it as authentic as possible.</p>
    <p>I have a problem though.  I’m using the intro image from the trailer</p><div class="imageWrap"><img src="/web/20080907002900im_/http://www.typophile.com/files/cover_5468.jpg"></div> and am changing the word “video” to the word “Manual”<div class="imageWrap"><img src="/web/20080907002900im_/http://www.typophile.com/files/01-cover-sm_4894.jpg"></div>The problem is that I can’t seem to get the typeface right and I’m having a hard time finding out what the original typeface it.<p></p>
