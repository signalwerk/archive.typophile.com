      <p>I think that this is actually pretty subjective. I know that plenty of people would say Alejandro Paul’s scripts are contemporary because they’re some of the best and most popular new script faces being used in contemporary work. But other people would point out that Alejandro and his collaborators are excellent historians in addition to being excellent type designers, and that his work is partly revivals of script by the masters of the past.</p>
      <p>Then there are the very popular grunge scripts by designers like Eduardo Recife, with overlapping ornaments, double lines, etc. distressed, and auto-traced. Sure some of them are just rehashes of older designs, but others are new, unconventional, and absolutely gorgeous. But the argument can be made that grunge design of any sort is the echoes of postmodernism’s death rattle, and that the nostalgic scripts that get more use are still more contemporary.</p>
      <p>And it might be that technology is what defines a contemporary script, that style is irrelevant, and what really makes them contemporary is having a giant Opentype table full of CALT subs that allow it to make up for the tiny number of people who can still use a pen or brush to write legibly. But if we go there all the people who don’t like the idea of technological determinism will start to bitch…</p>
      <p>Anyway, I’m going to stop before I get really pretentious, but I think you see what I mean about it being subjective.</p>
