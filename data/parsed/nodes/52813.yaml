      <p>Duffy Script is a contemporary script font.<br>
      It is based on the lettering of a contemporary illustrator, and utilizes state-of the art OpenType technology for pseudo-randomization of 4-variants-per-glyph, offering multiple permutations of any text.</p>
      <p>You can try this effect of contextual alternates <a href="http://new.myfonts.com/fonts/shinn/duffy-script/" rel="nofollow">here</a>.</p>
