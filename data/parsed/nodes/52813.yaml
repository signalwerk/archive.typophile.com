    <p>I am in the process of designing a logo (see thread entitled Model Logo). And I have hit a stumbling block with the script. I don't use script very much and as such I have little knowledge of them.</p>
    <p>What would allow me to solve my own issue would be if I knew what made a script contemporary? </p>
    <p>It was bought up that 'simple flourishes' make a script look dated. What other characteristics make a script look 'dated'?</p>
    <p>Can anyone offer any other resources on the issue, such as web pages or books?  </p>
    <p>Answers to all or any of my questions would be useful.</p>
