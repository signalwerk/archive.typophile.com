    html: "<p>I obviously need to redraw the paw print.. ugh I meant palm tree. Thanks for the feedback. <br> <br>The customer wants the globular look. It's like an oil or water drop that is shown growing into a palm tree or person, but not a paw print. They are more interested in something esthetic and unique rather than something with obvious meaning. <br>I think I'll play around with uneven palms for my next attempt. I can't narrow the trunk otherwise it will look like a pot plant. <br> <br>I did play around with quite a few classic art deco era typefaces but their clean geometric shapes don't work well with an amorphous logo IMHO. <br>The organic feel of turn of the century arts &amp; craft or Art Nouveau (I never figured out the difference) seems to work better with oil slicks. <br>I really like Willow here. It's borderline too whimsical but the organisation helps the homeless and low income residents so it was important to make it friendly and non corporate looking. I'm almost ready to throw away the logo just to keep the typeface.  <br> <br>Scott: Could you please expand on why Willow doesn't go with a 3D shape? Surely you don't mean adding bevel or shadows. What are fonts that would fit the bill 3D wise? <br> <br>Hrant: Willow has only one weight. I wouldn't make it heavier anyway since the lettering would then stand out too much with respect to the logo. <br>I had to darken the colour of the green for that same reason (using gray for the typeface wasn't an option to keep costs down). <br>What type would you recommend instead of Trade Gothic? Associating typefaces is one area where I need more experience. I'm at the very beginning of developing a feel for it. My background is in technology, not visual design. <br> <br>Thanks all for you time. <br>New logo to follow in a few hours, that is if I can work through the F1 Grand Prix ruckus. <br></p>"
