    html: <p>Maybe my lack of graphic design senstivity is getting me here, but I really like what you have so far! Yes, it doesn't look like a palm tree, and yes, it does remind of a paw print (a good association though), but most of all it's like a really friendly -and tasty- alien plant form. Something you would squeeze to get the most delicious juice! It's not 3D is a cheesy way - it just has a nice depth and blobby dimensionality. <br> <br>I also like the A&amp;C font (just a darker weight if possible) - but the Trade Gothic has got to go. I would lose the two smaller blobs too. <br> <br>hhp <br></p>
