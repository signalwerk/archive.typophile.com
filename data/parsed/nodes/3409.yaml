  html: <p>I designed this simple logo for a non profit organisation. <br>They wanted something informal, cheap to produce and 3D looking. <br>The palm tree is their symbol and they operate in an area littered <br>with art deco buildings. <br>The logo had to be scalable, keeping the same feel from a small <br>blotch of fax ink to a wall size banner. <br> <br>I gave up on anything with gradients generated with 3D studio or <br>the likes and ended up doing the highlighs on the oily shapes manually.  <br>I used dark green since it's a palm tree. It's already abstract  <br>enough as it is. Just black and green to keep printing costs down. <br> <br>The typeface is Willow from Tony Forster. It's from 1990 but it's <br>inspired from turn of the century arts and craft in Austria. <br>Not really art deco but everyone except folks here think it is. <br>I came across this font by mistake ramdomly browsing on MyFonts. <br>It was also cheap ($21) although it seems to have doubled in price <br>this past week. <br>I think it works in this context and the customer loved it but what <br>do I know? I'm really a novice here with most of my knowledge <br>acquired this past year online and browsing books at Borders. <br>I don't want to send something to the printer which will look  <br>clich</p>
  html_clean: <p>I designed this simple logo for a non profit organisation. <br>They wanted something informal, cheap to produce and 3D looking. <br>The palm tree is their symbol and they operate in an area littered <br>with art deco buildings. <br>The logo had to be scalable, keeping the same feel from a small <br>blotch of fax ink to a wall size banner. <br> <br>I gave up on anything with gradients generated with 3D studio or <br>the likes and ended up doing the highlighs on the oily shapes manually.  <br>I used dark green since it's a palm tree. It's already abstract  <br>enough as it is. Just black and green to keep printing costs down. <br> <br>The typeface is Willow from Tony Forster. It's from 1990 but it's <br>inspired from turn of the century arts and craft in Austria. <br>Not really art deco but everyone except folks here think it is. <br>I came across this font by mistake ramdomly browsing on MyFonts. <br>It was also cheap ($21) although it seems to have doubled in price <br>this past week. <br>I think it works in this context and the customer loved it but what <br>do I know? I'm really a novice here with most of my knowledge <br>acquired this past year online and browsing books at Borders. <br>I don't want to send something to the printer which will look  <br>clich</p>
