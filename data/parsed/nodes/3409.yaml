    html: "<p>Ok, two new rough samples where I'm trying to fit the logo with the typeface. Conveniently, both long trunk and stumpy trunk palm trees cohexist here. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/27907.gif\" alt=\"\"> <br>I tried to make the trunk less static and reworked the leaves. Oily look had to go <br>due to increased details. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/27908.gif\" alt=\"\"> <br>Following a short virtual visit to <a href=\"http://www.armin-grewe.com/crm/crm-queenscross.htm\" target=\"_blank\">Queen's Cross Church</a> in Glasgow, I tried to fit everything inside a tall Art Nouveau-is/Lloyd's Wright rectangle. The tree changed specie to adapt. Weird, it reminds me of the Afrikakorp logo. <br> <br>I'll now play with keeping the oily look and changing the typeface. Any suggestions on what would work with oil slicks? <br> <br>Hrant: Miki just started testing again. 17000rpm is pretty noisy.</p>"
