    html: <p>Everyone knows that we’re stuck with Helvetica until the meteor hits, but as this is a theoretical exercise, maybe think about the directions technology is going. For example OpenType-like technology making organic, hand-rendered-like-quality, multi-colour/texture typography more accessible. Also look beyond flat rendering to what you can do on with a 3D printer. Also see where e-ink, and other low power, refreshable, large format, paper-like displays may take us.</p>
