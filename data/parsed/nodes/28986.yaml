    <p>I am an 18-year old design student taking my first steps in this field. As a part of my curriculum I have to create a futuristic visual environment. I have chosen to create/predict the future of fonts ; by which I mean which fonts will be popular for what purposes : serif or sans serif ? multiple weights of single fonts ? limited fonts ? decorative scripts and typefaces ?</p>
    <p>Also looking at the transformation of fonts into visuals in billboards and advertisements and the changed use of fonts due to the reduction of viewing time people are willing to spare to read written material.</p>
    <p>Would love to hear your thoughts on the future you foresee...</p>
    <p>Thank You !</p>
