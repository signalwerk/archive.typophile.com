    html: <p>Thanks for all your suggestions. I'm going with Melior for text type. When William suggested it, I thought he meant in place of BG. I realize now he meant pairing it with BG. (I know, my brain is fried over this typeface issue.) Unfortunately, the other suggested fonts did not fit my budget. I don't know exactly what vintage car Melior and BG make but I'm driving it. I'm using BG light condensed, which I find less objectionable than the other weights, and using it sparingly. The layout is NOT wacky. That wouldn't work. But I am trying to make it as acceptable as I can given what I have to work with. Sometimes that's all we can do.</p>
