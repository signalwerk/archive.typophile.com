    html: |-
      <p>Bank Gothic is, as its name suggests, a conservative style of sans serif.<br>
      Even though published in 1930, widely interpreted as an art deco face and oft compared with the genuinely modernist City, it is a late 19th century throwback style, as attested by the narrow centre stroke of E, the diagonally chamfered terminals of the "rounded" letters, and its lack of a lower case.<br>
      So a good text face to complete an authentic retro look would be another Benton revival of a vertically stressed "geometric" style, Bodoni, or one of his Centuries.</p>
    html_clean: |-
