    <p>Hey guys,<br>
    I want to buy 4 weights of Meta but Fontfont licesing only allows me to use it for 5 users (basic licensing). The advanced licensing (25 users) is double the cost! Thats $300+. Is there any other place that sells Meta with a much better licensing without the added costs?</p>
    <p>Thanks.</p>
