    html: <p><i>&gt;(May be the problem is, that Adobe OpenType Pro fonts simply kerns letters T+a with all possible accents.)</i> <br> <br>I believe that this is exactly why you find the kind of absurd combinations you cite. But, while this would be a disadvantage in a typical Type 1 font (because bloated kerning tables slow down processing), since Adobe OT fonts take full advantage of class-based kerning, these combinations take virtually no extra code (depending, of course, on how the classes are defined). <br> <br>So, in the case of OT fonts, I think more might be better -- i.e., better to be thorough and have a few absurd combinations, than not to have accented pairs. Also, since it takes no real overhead, casting a wide net is probably a lot more efficient than trying to analyze every conceivable language and identify only the (currently) possible combinations.  <br> <br>In OT, that is -- with class-based kerning. Not in Type 1.  Jacques's list will be useful for Type 1 kerning. <br>  <br>-- K. <br></p>
    html_clean: <p><i>&gt;(May be the problem is, that Adobe OpenType Pro fonts simply kerns letters T+a with all possible accents.)</i> <br> <br>I believe that this is exactly why you find the kind of absurd combinations you cite. But, while this would be a disadvantage in a typical Type 1 font (because bloated kerning tables slow down processing), since Adobe OT fonts take full advantage of class-based kerning, these combinations take virtually no extra code (depending, of course, on how the classes are defined). <br> <br>So, in the case of OT fonts, I think more might be better -- i.e., better to be thorough and have a few absurd combinations, than not to have accented pairs. Also, since it takes no real overhead, casting a wide net is probably a lot more efficient than trying to analyze every conceivable language and identify only the (currently) possible combinations.  <br> <br>In OT, that is -- with class-based kerning. Not in Type 1.  Jacques's list will be useful for Type 1 kerning. <br>  <br>-- K. <br></p>
  - id: 5058
