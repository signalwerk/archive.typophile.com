    html: <p>Just to expand on Kent's comment, removing those "nonsense" pairs would in fact make the font larger, when using class kerning! <br> <br>I'll explain how it works with only a little simplification. There is a matrix of left vs. right classes. Any exceptions are additional line items that must precede that matrix. If an exception is necessary to avoid a collision or because the kerning result was poor, then we'll try to do that. But suppressing "nonsense" combinations would simply add more exceptions, and bloat the font, without making it any better--it's not like they hurt anything. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>Just to expand on Kent's comment, removing those "nonsense" pairs would in fact make the font larger, when using class kerning! <br> <br>I'll explain how it works with only a little simplification. There is a matrix of left vs. right classes. Any exceptions are additional line items that must precede that matrix. If an exception is necessary to avoid a collision or because the kerning result was poor, then we'll try to do that. But suppressing "nonsense" combinations would simply add more exceptions, and bloat the font, without making it any better--it's not like they hurt anything. <br> <br>Regards, <br> <br>T</p>
