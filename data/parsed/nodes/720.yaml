    html: <p><i>&gt;Please correct me if I'm wrong, but if one works with classes, like phinney explained, isn't there a chance of becoming colliding glyphs or exaggerated kerning?</i> <br> <br>I have not delved into class kerning yet, so I speak only form a theoeretical understanding, not practical experience. But the theory is that if you have equivalent sidebearings in your base letter and the rest of the members in the class, then what's good for the base is good for the rest. There are, of course, cases where this breaks down -- for instance the kern for Va may not work for V{agrave} (depending upon the design of your grave). That's when you'd create an exception, I suppose. The other option might be to define a second class of a-like glyphs which doesn't include some accented a's specifically for kerning with overhanging capitals -- that sort of thing. But, of course, too much of this -- either exceptions or extra classes -- starts to enlarge the font and also the work, almost defeating the purpose of using classes. <br> <br>Class kerning is a powerful tool, but it requires planning and careful logic in setting up your classes, as well as designing your glyphs. It seems like it would work better with consistent, regular designs than with idiosyncratic, irregular designs. <br> <br>-- K. <br></p>
