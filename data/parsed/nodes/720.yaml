  html: <p>Hi all, <br>this forum is read by people all over the world. This gives us the opportunity of being able to combine our knowlegde. For example our knowlegde about language. <br> <br>I am speaking here about kerning. Everyone who has touched or dived into the world of kerning knows this is a very difficult theme. <br> <br>I would like to use this thread to put up a list of all usable character and sign combinations which are being used all over the world and should be incorporated into the kerning of fonts. (of course, only if the design needs it) <br> <br>Theorectically there are more than 600,000 possible combinations, which can be made with a standard font (latin 1 font encoding). Wouldn't it be nice to know what pairs don't make any sense? <br> <br>Such a list would be a big help for every font designer. <br> <br>----Jacques</p>
