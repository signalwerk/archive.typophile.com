    html: <p>Kerning in Adobe OpenType Pro fonts contains many pairs which couldn't appear in a real written text. There is a limited amount of Czech accented letters, like ccaron, scaron or uring. These characters are used in Czech word only and cannot be combined with French / Italian etc. letters. So the combinations like Tcaron+acircumflex or Lslash+Yacute are absurd. I think it would be great to create linguistic-based kerining pairs. There could be several lists of pairs - for Western, Eastern European, Cyrillic and other encodings. (May be the problem is, that Adobe OpenType Pro fonts simply kerns letters T+a with all possible accents.)</p>
