    html: <p>Jacques -- <br> <br>At one point during the development of Whitman, I spent several hours with various dictionaries -- French, German, Spanish, Italian, Portuguese, Swedish, Danish, and Dutch -- to identify accent combinations in either the first or second positions. I was looking for possible cap/lc kerns. Not being at all fluent in most of these languages, I'm not sure which words might have been completely unlikely to show up as the first word in a sentence, but I got into an obsessive mode. <br> <br>I was also interested in finding which accented characters apeared in initial or terminal positions, in which languages, to consider whether they required kerning with various quotation marks. <br> <br>It was an interesting exercise. I can try to find my list somewhere for you, when I get a chance. <br> <br>I believe John Hudson has developed some extensive kerning lists along these lines. <br> <br>-- K. <br></p>
