      <p>Hej everyone,<br>
      Thanks for the shown interest and great answers!<br>
      I guess I was beeing a bit unclear of how I see swedish typography – it's not that I don't think there are great things going on right now, I do for sure; I think what a lot of the people mentioned above do is amazing, and Farsan (oh, thats Peter Bruhn to you) has been my typographic guide in life since as long as I can remember, his stuff is of course awesome.<br>
      I guess, it's more about if these typefaces are swedish or just made by swedes.. if that is something that can be decided these days, or if that's just totally uninteresting? I guess I have compared the situation with things such as what was going on in Switzerland in the 50s-60s and the heritige coming from that (with things as the fonts at lineto.com, that in my opinion is very swiss somehow). But I am thinking more and more that in the days of modern living, with internet and all, maybe a thing as swedish typography is totally uninteresting; we pick our ways of seeing things, influences and so on from here and there, and don't follow in the traditional footsteps of other swedes (in this case). As said in my first posting, I don't really see my typographic interest coming from anything swedish, it has more been based on books &amp; internet (from everywhere) in the past and dutch typography since I moved to Amsterdam.<br>
      Well, have to go to school now... </p>
      <p>Grüsse,<br>
      peter</p>
