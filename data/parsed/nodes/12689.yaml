      <p>What a great topic!</p>
      <p>I think that Sweden is actually a hot-bed of typography. First, you have <a href="/wiki/Fountain" class="freelinking" rel="nofollow">Fountain</a> in Malmö (<a href="http://www.fountain.nu/" title="http://www.fountain.nu/">http://www.fountain.nu/</a>), run by <a href="/wiki/Peter%20Bruhn" class="freelinking" rel="nofollow">Peter Bruhn</a>.</p>
      <p>Then there is MacRhino (<a href="http://www.macrhino.com/" title="http://www.macrhino.com/">http://www.macrhino.com/</a>), whose homepage bills itslef as "a new Swedish foundry". <a href="/wiki/Stefan%20Hattenbach" class="freelinking" rel="nofollow">Stefan Hattenbach</a> is a regular here on Typophile. I think that <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a> used to work for him in Sweden. Coles could be considered an honorary Swede, at the very least.</p>
      <p>Look at Linotype's Library (in Germany) over the past few years. Since I began working there, I've begun to think more and more that we are turning into a bastion for Swedish type designers… in our library, there is work from:</p>
      <p>Anders Bodebeck (<a href="http://www.linotype.com/7-2286-7/andersbodebeck.html" title="http://www.linotype.com/7-2286-7/andersbodebeck.html">http://www.linotype.com/7-2286-7/andersbodebeck.html</a>)<br>
      Bo Berndal (<a href="http://www.linotype.com/7-1936-7/boberndal.html" title="http://www.linotype.com/7-1936-7/boberndal.html">http://www.linotype.com/7-1936-7/boberndal.html</a>)<br>
      Franko Luin (not born a Swede, but been there long enough! <a href="http://www.linotype.com/7-1527-7/frankoluin.html" title="http://www.linotype.com/7-1527-7/frankoluin.html">http://www.linotype.com/7-1527-7/frankoluin.html</a>)<br>
      Lutz Baar (<a href="http://www.linotype.com/7-1945-7/lutzbaar.html" title="http://www.linotype.com/7-1945-7/lutzbaar.html">http://www.linotype.com/7-1945-7/lutzbaar.html</a>)<br>
      and Lars Berquist (<a href="http://www.linotype.com/7-1925-7/larsberquist.html" title="http://www.linotype.com/7-1925-7/larsberquist.html">http://www.linotype.com/7-1925-7/larsberquist.html</a>)<br>
      (maybe more, sorry if I left anyone out).</p>
      <p>Plus, in Stockholm, you've got Pangea Design (<a href="http://www.pangeadesign.se/" title="http://www.pangeadesign.se/">http://www.pangeadesign.se/</a>) which looks like Sweden's coolest design studio (at least from their website). Frederick from up there is an active poster here.</p>
      <p>There are other typographic studios, too, i.e., A4 (<a href="http://www.a4.se/" title="http://www.a4.se/">http://www.a4.se/</a>)</p>
      <p>Lastly, a month ago, I saw the most fantastically illustrated book on the history of typography… and it was in Swedish (my girlfriend can speak some of the langauge… I think I had her translate half of it aloud for me just so that I could understand some of it!). I don't have a link to it, but it was new…</p>
      <p><em>The thing is, I am not really sure what I am looking for. Is it typefaces designed by swedes, used by swedes or maybe inspired by swedes/sweden? If i design a typeface based on something I found in Germany, is my typeface swedish (as me), german (as the original) or dutch (where I live and study under great influence of dutch typographers)?</em></p>
      <p>I think that your typeface would be Swedish AND German… and maybe Dutch, too. That is the great thing about moving around.</p>
      <p>Just because some experts you asked in the Netherlands did not know much about Swedish typography doesn't mean that Swedish design isn't good or well-known. I'm an American living in Germany, and I haven't even spent three days in Sweden. But the quality of the work up there has managed to filter down to me anyway.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
