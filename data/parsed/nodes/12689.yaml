    <p>Hi,<br>
    Saw the posting on American type (<a href="http://typophile.com/node/12634" title="http://typophile.com/node/12634">http://typophile.com/node/12634</a>), which reminded me of a research on swedish typography I was working on a while ago. Since I don't know of any swedish typography forums, but am sure there are lots of swedes hanging out here and others with opinions on the subject, I thought I should give my research a new try here with this posting.</p>
    <p>Beeing Swede (hej!), I feel kind of rootless when it comes to typography. We don't have a great history of punch-cutting (something I read was because of our our country beeing so small and the equipment was to expensive...) nor very many new, digital typefaces by Swedes. But still, there must be such a thing as swedish typography?<br>
    Living in Amsterdam, I asked my teachers and friends -- not beeing Swedes --  what their opinion on swedish typography is. Most of them didn't have a very strong opinion, and they are people with a great knowledge on the matter, so I take it as swedish typography isn't very "famous" or known.<br>
    There are of course typefaces by swedes - from Berling by Karl-Erik Forsberg (<a href="http://store.adobe.com/type/browser/P/P_1157.html" title="http://store.adobe.com/type/browser/P/P_1157.html">http://store.adobe.com/type/browser/P/P_1157.html</a>), the most known one, to newer fonts such as Kada (lineto.com), Peter Bruhns typefaces (fountain.nu) and such.</p>
    <p>The thing is, I am not really sure what I am looking for. Is it typefaces designed by swedes, used by swedes or maybe inspired by swedes/sweden? If i design a typeface based on something I found in Germany, is my typeface swedish (as me), german (as the original) or dutch (where I live and study under great influence of dutch typographers)?<br>
    I guess I am looking for everything; typefaces, contexts etc.</p>
    <p>Somehow I would consider Berling a "true" swedish font -- it is the only one I know of that actually has been designed for the swedish language; how we combine the letters in the swedish language and so on. But is that then the definition of a typefaces history? Did Frutiger design Univers for the french/german (sorry, I don't know what part of Switzerland he was from) language, or did he design it for all latin languages; does that have anything to do with anything?</p>
    <p>I don't know if anyone has an opinion on this but I thought I'd give it a try.</p>
    <p>Best<br>
    Peter Ström</p>
