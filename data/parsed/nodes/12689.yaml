      <p><em>Did Frutiger design Univers for the french/german (sorry, I don’t know what part of Switzerland he was from) language, or did he design it for all latin languages; does that have anything to do with anything?</em></p>
      <p>The name, <strong>Univers</strong>, says it all: that typeface was multilingual by design. Emil Ruder, the champion of the International Style, has a special section on Univers in his <em>Typographie</em> (1967). There he shows its being used to typeset various languages, and compares it with other typefaces he thinks worked better for certain languages, and worse for others. If memory serves, those were: Garamond, for French; Baskerville, for English; and Bodoni, for Italian. That sort of thing...</p>
