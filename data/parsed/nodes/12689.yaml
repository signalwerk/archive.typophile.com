      <p>Hi there Peter,</p>
      <p>I think the Swedish typographic scene is more alive and kicking than ever. I do have a great respect for older designers like Karl-Erik Forsberg, Kumlin, Bo Berndahl etc, but the younger generations are coming on strong. I am probably somewhere in between (43, but hey I feel like 25) and plan to make a hell of a lot more typefaces than the the bunch I've made so far. I have the greatest respect for older techniques and the skill and knowledge that had to be included in order to perform well. But on the other hand I thank my lucky star that I live here and now, and are able to produce so much more than a couple of hundred years back... Fountain, Pangea and some others are also very active and I find it very stimulating to be part of all this. Peter, please welcome to join the party - long live Swedish typography! </p>
      <p>Cheers</p>
