    <p>Is it possible to do ligature substitutions right to left in OpenType?</p>
    <p>I'm working on a special monospaced typeface with ligatures, you can check it out <a href="/wiki/https%3A/%252Fgithub.com/i-tu/Hasklig/" class="freelinking" rel="nofollow">here</a>.</p>
    <p>I'm trying to separate zeros in groups of three with a ligature. Examples: 1000000 -&gt; 1 000 000, and 10000 -&gt; 10 000. The substitution should be done right to left, or otherwise the 10000 becomes 1 000 0, as with the following code:<br>
    <code><br>
    feature liga {<br>
        sub zero zero zero by zero_zero_zero;<br>
    }<br>
    </code></p>
    <p>I'd also appreciate information on how one would use kerning rules in a situation like this, though I'm not sure if they would apply to a monospaced typeface.</p>
