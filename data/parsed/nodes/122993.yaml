    html: |-
      <p>You can use contextual substitutions to replace a zero, or a digit, with a variant; for instance a digit followed by three digits but not a fourth can be replaced by a digit with a larger right side bearing. Knowing that lookups are applied on the input line one after the other, that gives the impression that the processing is right to left though it is not. Here is some code that I just checked in FontForge and that groups digits in groups of three.</p>
      <p>@dgt    = [\zero \one \two \three \four<br>
                \five \six \seven \eight \nine] ;<br>
      @dgtrsp = [\zero.rsp \one.rsp \two.rsp \three.rsp<br>
                \four.rsp \five.rsp \six.rsp<br>
                \seven.rsp \eight.rsp \nine.rsp ] ; </p>
      <p>lookup addspace1 {<br>
         ignore sub @dgt' @dgt @dgt @dgt @dgt ;<br>
         sub @dgt' @dgt @dgt @dgt by @dgtrsp ;<br>
      } addspace1 ;</p>
      <p>lookup addspace2 {<br>
      	sub @dgt' @dgt @dgt @dgtrsp by @dgtrsp ;<br>
      } addspace2 ;</p>
      <p>lookup addspace3 {<br>
      	sub @dgt' @dgt @dgt @dgtrsp by @dgtrsp ;<br>
      } addspace3 ;</p>
      <p>lookup addspace4 {<br>
      	sub @dgt' @dgt @dgt @dgtrsp by @dgtrsp ;<br>
      } addspace4 ;</p>
      <p>feature calt {<br>
         script DFLT;<br>
           language dflt ;<br>
      	lookup addspace1 ;<br>
      	lookup addspace2 ;<br>
      	lookup addspace3 ;<br>
      	lookup addspace4 ;<br>
         script latn ;<br>
           language dflt;<br>
      	lookup addspace1 ;<br>
      	lookup addspace2 ;<br>
      	lookup addspace3 ;<br>
      	lookup addspace4 ;<br>
      } calt ;</p>
      <p>Of course, if you wanted to group digits after the decimal point, you would consider left contexts and use digits with a large left side bearing instead.</p>
      <p>It was assumed above that the glyph zero.rsp is the glyph zero with a right side bearing increased by some constant value and similarly for other .rsp glyphs. It is also possible to keep all .rsp digits the same width as  digits and then to add a kerning equal to that constant value (for you, the character widths) between the .rsp digits and the digits; that has the same visual effect.</p>
