    <p>Hi to all,</p>
    <p>My name is Miguel Hernández, handpainted bitmap typography designer from Ultrafonts and Atomic Media foundries.</p>
    <p>I am selling Ultrafonts Truetype Grayscale Technology feature font designs (view them in the attached sample image)<br>
    for full featured comercial use.</p>
    <p>The fonts are a total of 6. For more details regarding to Greyscale font features please visit:</p>
    <p><a href="http://www.ultrafonts.com" title="http://www.ultrafonts.com">http://www.ultrafonts.com</a></p>
    <p>The Offers will be open for all the 6 fonts in one price. The fonts for sale include both greyscale patent technology and the fonts for your full comercial use. Use this blog to share your comments about this sale.</p>
    <p>Offers and Questions:<br>
    Typographic Foundries, Mobile and Technology companies and other interesed parties, please contact to this email: <a href="mailto:screenfonts@hotmail.com">screenfonts@hotmail.com</a></p>
    <p>Best Regards,</p>
    <p>Miguel Hernández.</p>
