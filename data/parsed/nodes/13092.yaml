      <p>Miguel, the way I understand the contract*, unless Ultrafonts is involved in the licensing, I think our fonts are "stuck" at Ultrafonts... So a buyer can acquire some rights to the fonts directly from you, but he would have to keep selling them through Ultrafonts. Ultrafonts's co-ownership of the font files comes from the usage of their converter, and of course their patent. I'm talking about the TT outline fonts here; the actual bitmaps are indeed wholly owned by the individual designers.</p>
      <p>* Assuming they're all the same though - maybe they're not.</p>
      <p>In any case, I hope you sell them for a good price - it's a nice collection.</p>
      <p>hhp</p>
