      <p>Hi Guys,</p>
      <p>Hope all is well with you Hrant and Miguel. To help clarify things, all of the original Ultrafonts developers are free to sell their fonts on the open market in any form they wish and the purchaser has all rights to resell, use or whatever else is stipulated in the contract between the font developer and purchaser. </p>
      <p>The purchase however does not have any right to make their own Ultrafonts nor can they use the Ultrafonts name or trademark in the font with the exception of calling the font family purchased and Ultrafont.</p>
      <p>Hope this helps.</p>
      <p>Jose</p>
