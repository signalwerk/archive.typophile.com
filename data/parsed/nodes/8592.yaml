  html: <p>Hi all, <br> <br>I'm just currently getting started on some research for a dual branding situation... and I'm wondering if there's any 'master list' of fonts that come in both sans and serif (i.e. fedra)? either that, or maybe we can compile a list here. <br> <br>of the top of my head.. <br>fedra <br>scala <br>thesans/theserif</p>
