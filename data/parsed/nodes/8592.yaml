    html: "<p>Since Stone Sans + Serif (late '80s), foundries have often launched related sans and serif designs under one name. But at any point, before or after, there are related faces with different names. For instance, from the 1930s, Gill Sans is Perpetua Sans, and Beton is Futura with serifs.  <br> <br>Gerard Unger produced a series of typefaces for Linotype, all with a similar skeleton but different treatments. Demos and Praxis most obviously the sans/serif \"contrasting pair\". <br> <br>Clearface was the first typeface to be marketed with both sans and serif under the same name, in the 1910s. <br> <br>Following the lead of FontFonts Scala, Eureka, Quadraat, etc., I did a sans version of Fontesque. <br>It gives one a flying start. <br> <br>Would it have been easier to begin with the sans, and derive the serif from that? Does it cramp one's style to be working on both sans and serif at the same time? interesting questions. <br> <br>Generally, when a layout uses the sans + serif versions of the same typeface, I find it's a bit flat --- not sufficient contrast. But I can see how using the styles for branding might work. <br> <br>Do you know of any examples Rob, or is this a fresh idea? <br> <br>But really, sans + serif is no big deal: Panoptica has seven variants...</p>"
    html_clean: "<p>Since Stone Sans + Serif (late '80s), foundries have often launched related sans and serif designs under one name. But at any point, before or after, there are related faces with different names. For instance, from the 1930s, Gill Sans is Perpetua Sans, and Beton is Futura with serifs.  <br> <br>Gerard Unger produced a series of typefaces for Linotype, all with a similar skeleton but different treatments. Demos and Praxis most obviously the sans/serif \"contrasting pair\". <br> <br>Clearface was the first typeface to be marketed with both sans and serif under the same name, in the 1910s. <br> <br>Following the lead of FontFonts Scala, Eureka, Quadraat, etc., I did a sans version of Fontesque. <br>It gives one a flying start. <br> <br>Would it have been easier to begin with the sans, and derive the serif from that? Does it cramp one's style to be working on both sans and serif at the same time? interesting questions. <br> <br>Generally, when a layout uses the sans + serif versions of the same typeface, I find it's a bit flat --- not sufficient contrast. But I can see how using the styles for branding might work. <br> <br>Do you know of any examples Rob, or is this a fresh idea? <br> <br>But really, sans + serif is no big deal: Panoptica has seven variants...</p>"
