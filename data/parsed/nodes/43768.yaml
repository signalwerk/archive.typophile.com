  html: |-
    <p>Type 2.2 OpenType font editor (Windows only) update now available.</p>
    <p>New features are:<br>
    - open and save OpenType PostScript (.otf) fonts (not CID-keyed).<br>
    - conversion both ways between TrueType &amp; PostScript fonts.<br>
    - drawing and editing of PostScript glyphs as true cubic bezier curves.</p>
    <p><a class="freelinking external" href="http://www.cr8software.net/type.html" rel="nofollow">www.cr8software.net/type.html</a></p>
    <p>Allan Murray</p>
