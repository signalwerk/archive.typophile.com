  html: |-
    <p>I can’t find an actual specimen of this font, so I created a rough approximation. I’ve seen this ’e’ in a spa’s name, among other places. Its bar is a curve that begins to the left of the rest of the letter, like so:</p>
    <p></p><div class="imageWrap"><img src="/files/wtf_3419.png"></div><p></p>
    <p>Only it’s more elegant than that. The curve tapers to a point, and I believe the other end of the ’e’ does as well. Any ideas?</p>
