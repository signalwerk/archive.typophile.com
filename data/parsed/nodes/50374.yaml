      <p>&gt; ... + 3px accents-on-capitals works out at a nice round 16px</p>
      <p>You can float secondary parts above (or below) the Em, but the conventional way to measure a bitmap font is from the top of the lc ascenders* to the bottom of the lc descenders. So this is a 13. I've made a 13 myself, but only because it fits well in a system of three sizes, plus it's a pixelfont where you always set the point size to 8 anyway. If this will be a pixelfont too it's not such a big deal. The thing is, your descenders should ideally be shorter than the ascenders (since they're much less frequent in text) so you do have room to trim the height by 1 in the descenders (or alternatively go to 14 with the ascenders, which however would start making the font a bit small-on-the-body).</p>
      <p>* Or Cap height, if that happens to be higher (not generally recommended).</p>
      <p>That last "x" seems great.</p>
      <p>hhp</p>
