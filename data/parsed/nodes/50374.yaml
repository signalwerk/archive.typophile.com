      <p><cite>Looks pretty cool.</cite></p>
      <p>Thanks!</p>
      <p><cite>13 is a funny number...</cite></p>
      <p>Well, it was rather an accident.. 7px x-height + 3px ascenders + 3px descenders + 3px accents-on-capitals works out at a nice round 16px, but since most English text doesn't have accented capitals, most glyphs are 13px tall. I've wanted to make the space reserved for accents 4px tall rather than 3px to make it easier to distinguish carons and breves; would that help?</p>
      <p><cite>Your “j” BTW is going all the way down.<cite></cite></cite></p>
      <p>Oh, good catch! The Dutch "ij" looks a lot better when the "j" extends all the way to the bottom.</p>
      <p><cite>One other thing: the “x” is way too geometric. One thing you might try is staggering the arms.</cite></p>
      <p>I'm not sure what you mean by 'staggering the arms'. I agree that 'x' is very geometric, but so is 'o' and 'c' and 'z'. I've made it <a class="freelinking external" href="http://zork.net/~st/Transient-filled-7.png" rel="nofollow">a little more script-y, like the x we used for algebra in highschool</a>... I'll try it out for a while and see if it feels right.</p>
      <p>Again, thanks for commenting!</p>
