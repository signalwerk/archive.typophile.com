      <p>Looks pretty cool.</p>
      <p>Something about the height: 13 is a funny number, especially on Windows (where the nominal dpi is 96, not 72). I would make the descenders one pixel shorter, or the ascenders one pixel taller. Your "j" BTW is going all the way down. The "t" looks nice unusually tall though.</p>
      <p>One other thing: the "x" is way too geometric.<br>
      One thing you might try is staggering the arms.</p>
      <p>hhp</p>
