    html: "<p>Well, the \"California\" edition of 1998 contains \"A Note on the Book and it's Design\" (!) -- ... has attempted to follow the author's original page layouts and design precepts as closely as possible. Aurora Grotesk, shown in the Berthold Photoypes E1 catalog (1974), was identified as the typeface closest to that used in the original German edition; this typeface, however, had not been digitized at the time the California edition was produced. The text was set in 7.75 Image Light Extended with a 11.6 point leading. The typeface was revised by extending its overall set widths by 112 percent; character spacing was expanded to a Quark XPress tracking value of 16.\" <br>rest of fonts: Frutiger Ultra Black. <br>The \"shiny\" paper was selected to match the original edition... haha! <br>I think I have a fascimile edition of the original German edition somewhere, but don't know where. Sorry.</p>"
    html_clean: "<p>Well, the \"California\" edition of 1998 contains \"A Note on the Book and it's Design\" (!) -- ... has attempted to follow the author's original page layouts and design precepts as closely as possible. Aurora Grotesk, shown in the Berthold Photoypes E1 catalog (1974), was identified as the typeface closest to that used in the original German edition; this typeface, however, had not been digitized at the time the California edition was produced. The text was set in 7.75 Image Light Extended with a 11.6 point leading. The typeface was revised by extending its overall set widths by 112 percent; character spacing was expanded to a Quark XPress tracking value of 16.\" <br>rest of fonts: Frutiger Ultra Black. <br>The \"shiny\" paper was selected to match the original edition... haha! <br>I think I have a fascimile edition of the original German edition somewhere, but don't know where. Sorry.</p>"
