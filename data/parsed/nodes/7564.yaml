    html: "<p><img src=\"http://www.typophile.com/forums/messages/83/53072.jpg\" alt=\"Frontcover\"> <br><img src=\"http://www.typophile.com/forums/messages/83/53073.jpg\" alt=\"Inside\"> <br> <br>I only have the English version which of course is different from the original from 1928 which probably was Akzidenz Grotesk (or Bücher Grotesk or Royal Grotesk if I am not completely wrong) as Yves said. <br> <br> <br>In this case though: <br> <br>Frutiger is used on the cover. <br> <br>Inside is Frutiger for headlines. And something that isn't Univers for body but bears a resemblance to it. And since this is what you probably wanted to know I am sad to say that I don't know it.</p>"
    html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/83/53072.jpg\" alt=\"Frontcover\"> <br><img src=\"http://www.typophile.com/forums/messages/83/53073.jpg\" alt=\"Inside\"> <br> <br>I only have the English version which of course is different from the original from 1928 which probably was Akzidenz Grotesk (or Bücher Grotesk or Royal Grotesk if I am not completely wrong) as Yves said. <br> <br> <br>In this case though: <br> <br>Frutiger is used on the cover. <br> <br>Inside is Frutiger for headlines. And something that isn't Univers for body but bears a resemblance to it. And since this is what you probably wanted to know I am sad to say that I don't know it.</p>"
