    <p>Hello!<br>
    I am a student of second year of MA and Im analyzing visual elements of cookbooks from Warsaw, from the xix and xx century. </p>
    <p>One of my issues is the analysis of the cover pages, the materials from which the book was done ( paper type, bookbinding) </p>
    <p>Do you have knowledge and you can recommend me books that talk aboout such topics, for example, which materials were used in production of books (XIX and XX century)? </p>
    <p>If not, do you know someone or a place where could I ask this question? </p>
    <p>I have read some of the material how the book was made but i wanted something more specific about paper and bookbinding. </p>
    <p>i will be glad to here from you :)</p>
