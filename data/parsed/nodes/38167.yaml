      <p>One problem I see is that you are working in MS Word. Not exactly known for it's Kerning/Letterspacing efforts.</p>
      <p>If you want a Univers (and I don't remember any old Display Univers in the type shop...) I suggest you go to a Berthold version, if you can find one -- though I don't know if Berthold ever produced it for our computers (they had a version of it in good 'old typesetting days).</p>
      <p>Also, URW had made one from their drawings and named it Unitus. It was very close to the same Univers that Cardinal Typesetters in NY use to use. (When they had, I think, Harris Typesetting equipment -- after they got rid of their Alphatype equipment). Unitus is nicely drawn, works well, was digitized using their Ikarus program - and what more can I say.</p>
      <p>"Adobe's" version seems to be the same as the later released Linotype version - so, no comment.</p>
      <p>But do yourself a favor - get a real page layout program - and then you too can handle difficult kerning situations as they arise - just like the professionals.</p>
