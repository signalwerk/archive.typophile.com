    <p>My first post...:-) I am not a design professional, but I'm certainly a type slut, so maybe I qualify as a typo-PHILE.</p>
    <p>I am looking for a pre-kerned headline/display version of Univers, is anyone aware of a possible solution? Something akin to the Nimbus Sans Novus Display versions of Neue Helvetica, or Scangraphics SH versions of many popular Grotesks. Yes, I could simply manually kern and range track my Univers 75 in a DTP program, but often in my work I can only use MS Word, so I find headline versions of many sans serifs very helpful to have handy.</p>
    <p>Purpose: I am constructing a template that will use a Univers/Glypha combination for the style. Old school.</p>
