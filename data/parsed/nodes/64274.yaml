  html: |-
    <p>I was wondering if anyone knew of a website where I can find examples of different styles of type set on, say, a newspaper or poster. Something like The Book Cover Archive but for a wider range of media.</p>
    <p>Just thought I'd give it a go. Thanks for any response you can provide.</p>
