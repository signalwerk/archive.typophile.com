    html: |-
      <p>There's a great book by Tamye Riggs, called <a hreg="http://www.papress.com/html/book.details.page.tpl?isbn=9781568988108">Typeface: Classic Typography for Contemporary Design</a>, which shows many classic fonts "in action".</p>
      <p>No disrespect to Typophile, but when I want to bombard myself with type in action, I go to the "What The Font" forum over at myfonts.com. It's only logos, but that is a great way to see random fonts in action.</p>
