    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 1.Aug.2007 4.14pm </div>
      <p>For Immediate Release:<br>
    Buffalo, NY, August 1, 2007:</p>
    <p>Matador is a new calligraphic styling from prolific author and calligrapher, Arthur Baker. It is a contemporary Roman font based on the manuscript tradition. The stoic capitals add just the right touch to the slightly fanciful, and unmistakably, “Baker-style” lower case. Digitization of Matador was completed by fellow award-winning calligrapher, Michael Clark. This makes it a font truly from the Calligraphic tradition.</p>
    <p>Arthur has been drawing letters for decades and has written over 20 books on the subject. His fonts have been used on Coke and Lipton products as well as the Eddie Bauer logo and catalog. His style is admired and has been imitated by many calligraphers and type designers. In addition to his knowledge of letterforms and historic calligraphic styles, Arthur custom designs his own pens and brushes.</p>
    <p><a href="http://www.p22.com" title="http://www.p22.com">http://www.p22.com</a><br>
    <a href="http://www.p22.com/ihof/matador.html" title="http://www.p22.com/ihof/matador.html">http://www.p22.com/ihof/matador.html</a></p>
    <p>Best Regards!<br>
    P22 type foundry</p>
