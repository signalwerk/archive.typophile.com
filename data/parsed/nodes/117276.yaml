    <p>Hello,</p>
    <p>I've got a question about composite glyph creation. I'm not sure if this is a bug in FontLab or i'm doing something wrong but FontLab has just stopped generating composite glyphs for characters like á å â ä … even though there the accent glyphs and base glyphs are all there with their properly names anchors. If I delete á for example and then click on it again to create it just gives me a blank glyph, and every now and then just the base glyph. I don't understand this behaviour, it seems buggy but I don't know how to fix it. Does anyone have any ideas or has this happened to anyone before.</p>
    <p>This seems to be an issue across all fonts where this once worked, so seems to be a issue with font lab, not the font itself, but I can't work out what. I've reinstalled font lab and no luck.</p>
    <p>Thanks in advance!</p>
