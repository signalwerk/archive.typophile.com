    html: |-
      <p>Can you create the glyphs by hand, that is, double click on an empty cell, then, using  (key sequence with Windows) Alt+insert, select the character wanted -- say an "a" . This should place that character, with original sidebearings, in that cell. Then repeat the process for an accent, say "acute" (or properly, acutecomb, if you've added the combining diacriticals. In any case, alt+insert brings up a dialog window window lets you select the character you want to add.)</p>
      <p>These characters will be composites, you can decompose if you want the hard, fast glyph.</p>
      <p>If you can do that, and if *they* don't go away as you've described elsewhere, then I'd think the problem does lie with the .dat files -- something isn't getting made correctly. On the other had, if they do go away, I believe they're doing so without .dat involvement. </p>
      <p>FWIW</p>
