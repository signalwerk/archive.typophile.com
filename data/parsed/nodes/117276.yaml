    html: |-
      <p>The specifics of which combinations feed into which glyphs is in a file called "alias.dat" which should be in a shared data folder across FontLab products, FontLab/Shared Data/alias.dat ... is that file present? Do the contents correctly show the accented characters?</p>
      <p>The location of the file can be customized by Preferences &gt; General Options &gt; Folders &amp; Paths.</p>
    html_clean: |-
