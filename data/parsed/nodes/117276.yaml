    html: |-
      <p>Thank you for your answers. I did think it might be the alias.dat file (that's what I gathered from other message boards). There is an alias.dat file in /Users/me/Library/Application Support/FontLab/Data</p>
      <p>The same folder in the shared library was empty so I copied everything across there and I told Fontlab where to look for the alias.dat file through the preferences dialog (as you also suggested) but this seems to have no effect. When I try and create empty glyphs it still fails…. It's so frustrating as I cannot finish my font now and there seems to be no way of fixing it. Any other ideas on what could be wrong other than it being buggy?</p>
