      <p>Oops, sorry, I did not mean to make a dramatic announcement that goes front page. I was simply updating my profile! My point was just to say that I am not keeping a blog here because I have one elsewhere, just in case someone clicked on the link to my blog. Now that this has been automatically put front page, I might as well give explanations. (Feel free to disregard this self-indulgent post!)</p>
      <p>Davidikus is my blog. I often describe it as:</p>
      <p>Davidikus is the visual diary of an exile in London. David is almost exclusively a photoblog, in English and in French about all sorts of things happening in the life of its owner, in London, Paris, Rome, Milan, Rio de Janeiro and other places...</p>
      <p>Davidikus is not the chronicle of my life. Davidikus does not show extensively all that I do or eat (I am sure you will be grateful for that). Davidikus is about sharing photographs of what I have seen and I have like or dislike, what has shocked me, intrigued me... Davidikus is about what struck me.</p>
      <p>Davidicus means « David’s » or « of David » in Latin. There were too many Davidicusses on the web so I decided to call the blog on my work Davidikus to give more visual rhythm to the second part of the word - &amp; as an inconscient  homage to Zeiss Ikon. I was reminded later that I always complain people replace the mute c in my last name (Ranc, pronounced [rã] or /rã/) with a very loud k (Rank). Therefore, Davidikus means « David Ranc’s » or « of David Ranc ». </p>
      <p>Davidikus is not a typography blog but there are some pictures of type in use (often « vernacular » inscriptions, type sculpted in stone, cast in iron etc.), or lettering. Davidikus currently showcases a type I am working on (called Bergamote).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo davidikus5 copy_4373.png"></div><p></p>
      <p>Davidikus is on <a href="http://davidikus.blogspot.com" title="http://davidikus.blogspot.com">http://davidikus.blogspot.com</a><br>
      David Ranc’s website is on <a href="http://www.davidranc.com" title="http://www.davidranc.com">http://www.davidranc.com</a></p>
      <p>Back where I belong now: oblivion! Apologies again.</p>
