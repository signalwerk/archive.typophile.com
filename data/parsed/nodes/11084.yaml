    html: <p> Froedi - this is very classy and feminine. I can't see much about it that I'd change besides the tail on the 'y' and the 'high' crossbar on the 'f'. Nice, elegant work. <br> <br>One thing I would do is add weights. This thin of a weight...it's difficult to find uses. Oh + an uppercase. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Also, see the bezier work of Christian Robertson in this forum and Bernhard Fashion. <br> <br>If you can design an uppercase that matches the elegance of the lowercase, then you'll have something special. <br> <br> <br>bj </p>
