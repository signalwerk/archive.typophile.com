    <p>Here is a logo design I'm working on for a UK based clothing company — <strong>Moti Bili</strong>. I'm told by the client that Moti Bili translate to <em>"Fat Cat"</em> (Arabic maybe?). Since it's a clothing company the symbol must be very simple as it will be printed at very small sizes (tags, etc...)</p>
    <p>I'm working on a few concepts at the moment, this one is probably the furthest along of any. I thought it would be a good time to get some feedback and suggestions. Right now I'm open to anything from what you see when you look at the symbol, to small tweaks (add to the <em>"catness"</em>), fonts, etc...</p>
    <p>Thanks for looking!<br>
    Mike</p>
    <p><strong>UPDATED BELOW</strong></p>
