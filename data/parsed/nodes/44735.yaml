    html: |-
      <p>I think the concepts with Grover looked the best.<br>
      "I do hope my client appreciates the smooth paths, clean shapes, etc..."<br>
      I think that version had a nice correlation between mark and type.<br>
      The new font is too loose, it makes me want to see a scruffy looking cat.</p>
      <p>I was wondering though, if the mark could become a bit more fluid and elegant,<br>
      by extending the length of the negative space made by the tail. It has the added<br>
      benefit of making the tail appear to come from where it's supposed to, rather<br>
      than like it grew out of the side of the cat. </p><div class="imageWrap"><img src="http://typophile.com/files/newmotiBili_043008_6248_5513.gif"></div><p></p>
