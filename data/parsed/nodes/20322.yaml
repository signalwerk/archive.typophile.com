    <p></p><div class="imageWrap"><img src="http://typophile.com/files/letri_6706.jpg"></div><p></p>
    <p>Letritas es un blog distinto, donde se pretende discutir temas de valor, tanto para el diseño tipográfico como para que el diseñador gráfico le pierda el miedo a meterse a jugarcon las letras.<br>
    Es un blog que trata con ejemplos muy didácticos temas que no suelen salir en los libros. Todo el conocimiento está muy digerido y resumido, y cada uno de los puntos que se tocan, dan para hacer una charla en alguna universidad.<br>
    La cantidad de ejemplos claros y personalizados (diseñados para la ocasión) que aparecen en "letritas" hacen que el contenido, que muchas veces es explicado muy complejamente por algunos académicos, aparezca de la manera más simple.<br>
    Es ideal para diseñadores tipográficos que recién están empezando.</p>
    <p><a href="http://letritas.blogspot.com" title="http://letritas.blogspot.com">http://letritas.blogspot.com</a></p>
