      <p>Flash cards were always a good way to learn I think. So like personal jeapordy put a definition on one side and they gotta get the word. But you can do it with a partner so it goes quicker. </p>
      <p>Or you could have one word on one side that relates to the word on the other side and they gotta guess what the other word is. Simple would be Uppercase/lowercase, kern/letterspace, kern/leading, or kern/squooshed, etc. That way they gotta know all the possabilities to get the right one. (just don't make tests like this because then they might come looking for me :P)</p>
