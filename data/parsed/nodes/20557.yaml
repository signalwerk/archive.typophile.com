      <p>Amy Conger (at CCSF) once gave me the great bit of advice that an ice-breaker during the first class session can make a big difference. My ploy involved the strong parallel between shoe design/making and type design, and I asked the students to come up to the board and write entries in two columns: their ideal shoe; and the type of shoe they actually typically wear. The point being to distinguish between display fonts and text fonts. Plus I stepped out of the classroom as they were doing this, so they would be more comfortable, being anonymous. It worked like a charm: the apprehensive expressions at the start of the class immediately turned into involved smirks. (On the other hand, if most of the students were men it might not have worked as well. :-)</p>
      <p>hhp</p>
