      <p>I was just called yesterday by Montserrat College of Art, located north of Boston. They asked if I was interested in taking over the Typography I course and that I would have latitude in revising the existing curriculum. (That is, if I pass muster with their Dean!)</p>
      <p>Seems that previously, one of the intructors focused on technical aspects and the one before that on creative aspects of typography.</p>
      <p>I happen to believe both are integral, as it always has been historically... advancements in printing, metalurgy, photography, computers directly effect the shape and use of type, while it is up to the creatives to harness that power.</p>
      <p>Oddly enough, Montserrat is the school that invited Hrant to speak and staged his <a href="http://typophile.com/node/18990" target="new" rel="nofollow">A Line of Type</a> exhibit this past April.</p>
