    date: 2004-03-12T10:00:00
    date_raw: 12.Mar.2004 10.00am
    votes: null
    html: "<p>Claudio, thanks for all your heart warming compliments! I'm truely honored, and glad you remembered my early font experiments... <br> <br>Perhas Oded has upgraded Alechemy, because I think I recall seeing it used with Nikud. I'm sorry if my memory misleads me... From a little examination I just did, I noticed all the \"Guttman\" faces come with Nikud marks, as well as some other Monotype and Kivun (Dagesh's publisher) fonts that come with MS Windows and Office. <br> <br>Now for some more persumptions: I believe Masterfont has all of Zvi Narkis' work with Nikud, and Fontbit also claim to have full Nikud on most of their fonts (as well as kerned, hinted OpenType versions). Another worthy mention is Shmuel Sela, owner of some classic Hebrew letter designs, especially the wonderful Salit, which was put to wide use in Neville Brody's project for an Israeli newspaper site - <br><a href=\"http://www.researchstudios.com/ARCHIVE_ynet_RS.html\" target=\"_blank\">http://www.researchstudios.com/ARCHIVE_ynet_RS.html</a> <br>I believe most of his fonts come with Nikud. <br> <br>Finally, I'm almost certain I have seen Yanek's Erika Sans with Nikud once, but I guess you will have to contact him to know for sure... <br> <br>I would love to see a sample of Abbar's face. I've desperately tried to Google for it, but I only found an excerpt of the article - <br><a href=\"http://www.eyemagazine.com/feature.php?id=98&amp;fid=482\" target=\"_blank\">http://www.eyemagazine.com/feature.php?id=98&amp;fid=482</a> <br> <br>Also, I found Tarek Atrissi's \"AT Arabic\" family, especially the bitmap version, a very exciting piece of work (arabictypography.com). <br> <br>\"Westernization\" of semitic typefaces is inevitable, much like the spread of international brands such as Coca-Cola and McDonald's. It's interesting, though, to see how the local folk of each culture take those incredibly imperialistic elements and make them their own. Seldom, the result of such fusion can even do as much as redefine aesthetics, both locally and globally.</p>"
