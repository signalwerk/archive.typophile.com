    html: <p>I believe John's post has cleared up the matter almost fully, so I would simply like to answer Hrant's query from an Israeli point of view. <br> <br>Nikud (vocalization marks) is indeed rare in modern Hebrew, therefore fonts that that are not considered to be "text" faces, meaning they would not accomodate long passages of text, usually include the Hebrew letters only (05D0-05EA), no Nikud. <br> <br>A good Hebrew text face, though, has a full set of Nikud (starting 05B0) as well as the letters. <br> <br>I think new Hebrew foundries (like Oded Ezer's) add Nikud to almost all their faces, both text and display - a blessed habit. <br> <br>The Yiddish vowel pairs double-Vav, Vav-Yod and Double-Yod (05F0-05F2) are rarely included. <br> <br>Quotation marks are almost always "typewriter" style (05F3-05F4) and should be included in all Hebrew faces (there is very wide use of them, especially since the Geresh ' mark is used as an abbriviation mark for the likes of Prof. and Capt. and the Gershayim " is used for the likes of Dr and Mr). <br> <br>The hebrew hyphen used for word-connection is called Maqaf (05BE) and should also be included with every Hebrew font. <br> <br>Sof pasuq (05C3) is literally a colon (it's used in bibilical publications to note where verses end), it can be a direct link to the colon glyph. <br> <br>The Rafe (05BF) and Paseq (05C0) aren't normally used in everyday Hebrew. Also, I have no idea what the Upper Dot (05C4) means, maybe it's a version of the Holam (05B9) mark? (John? William? Anyone?) <br> <br>If you add Nikud to a Hebrew font, you should also add the Hebrew portion of the Alphabetic Presentation Forms table (the wide letters and the Yiddish and Ladino ligatures are only an option, though). Notice there's also a special Jewish "plus" sign for Hebrew (to counter the "christian", cross-like plus). <br> <br>Basic punctuation like commas, periods, and exclamation and question marks are generally the same as in Latin faces. <br> <br>Some classic designs favor the shape of a diamond for the periods and other points, but I think you have that in some English faces as well, don't you? <br> <br>I'm curious as to the identity of the Israeli type designer who thinks Hebrew should use Arabic question marks. <br> <br>Former prime minister, Yitzhak Ben-Tzvi once motioned to add two Hebrew letters (Alef-like and He-like) to replace vocalization marks. Debates continue to this very day, in various forums. <br></p>
