    html: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;<i>Also, I have no idea what the Upper Dot (05C4) means, maybe it's a version of the Holam (05B9) mark?</i> <br> <br>This I can answer authoritatively, having discussed the matter at length on the Unicode Hebrew list with a member of the Israeli standardisation body. I'd originally guessed that U+05C4 was the Hebrew number mark, but it is actually intended as the upper <i>punctum extraordinarium</i> -- sorry, I don't know what the Jewish name is -- which appears only in the Biblical text and only a very small number of times. Scholars disagree about its meaning, but it is clearly very important because it even occurs in some Torah scrolls, which do not include nikud or te'amin (excuse my Aramaic: it's what I'm used to). There is also a lower punctum, which occurs only three times in the Bible text, all on one word, in Psalm 27:13, but the Israeli standards body didn't bother to propose this for encoding because it was so rare. I'm not sure what they thought scholars were supposed to do without it! It has now been proposed for addition to the Unicode Hebrew block (along with the almost equally rare <i>nun hafukah</i>). Here is an image of the first word in the 13th verse of Psalm 27. The large dots above and below are the puncta; the form shown for U+05C4 in the Unicode book is misleading. <br><img src=\"http://www.typophile.com/forums/messages/4101/28377.gif\" alt=\"Psalm 27:13:1\"> <br> <br><i>If you add Nikud to a Hebrew font, you should also add the Hebrew portion of the Alphabetic Presentation Forms table (the wide letters and the Yiddish and Ladino ligatures are only an option, though). Notice there's also a special Jewish \"plus\" sign for Hebrew (to counter the \"christian\", cross-like plus).</i> <br> <br>The alphabetic presentation forms also include the alef-lamed ligature. This is not used for the Biblical text*, but is sometimes encountered in other religious books such prayer books, and in a variety of other Hebrew texts from the 7th century on (the earliest dated manuscript containing this ligature was found in the Cairo Genizah; sorry, I can't remember the date). I recently did some research on this ligature, and discovered its early history as record by Solomon Birnbaum in <i>The Hebrew Scripts</i>, Brill 1971, p.226. It originated among speakers of Judaeo-Arabic following the Moslem conquests. The sequence alef+lamed is incredibly common in Arabic because it is the definite article <i>'al</i>, and the ligature was originally developed specifically to write this word. It's use was later extended to every occurence of the sequence in Judaeo-Arabic, and gradually found its way into use in Hebrew. I'd be interested to know to what extent it is used in modern Israel and in what kinds of texts. <br> <br>* Although the alef-lamed ligature is not normally used for the Biblical text, whether in scroll or book form, Moses Gaster notes that one book manuscript in his collection does include 'ligatures formed by the joining of two letters', which I'm guessing refers to the alef-lamed ligature. This is part of a discussion of the relative liberality shown in the writing of Bibles (books) as opposed to the sacred Torah scrolls. [<i>The Tittled Bible.</i> Maggs Bros 1929. p.7]&lt;/font&gt;</p>"
    html_clean: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;<i>Also, I have no idea what the Upper Dot (05C4) means, maybe it's a version of the Holam (05B9) mark?</i> <br> <br>This I can answer authoritatively, having discussed the matter at length on the Unicode Hebrew list with a member of the Israeli standardisation body. I'd originally guessed that U+05C4 was the Hebrew number mark, but it is actually intended as the upper <i>punctum extraordinarium</i> -- sorry, I don't know what the Jewish name is -- which appears only in the Biblical text and only a very small number of times. Scholars disagree about its meaning, but it is clearly very important because it even occurs in some Torah scrolls, which do not include nikud or te'amin (excuse my Aramaic: it's what I'm used to). There is also a lower punctum, which occurs only three times in the Bible text, all on one word, in Psalm 27:13, but the Israeli standards body didn't bother to propose this for encoding because it was so rare. I'm not sure what they thought scholars were supposed to do without it! It has now been proposed for addition to the Unicode Hebrew block (along with the almost equally rare <i>nun hafukah</i>). Here is an image of the first word in the 13th verse of Psalm 27. The large dots above and below are the puncta; the form shown for U+05C4 in the Unicode book is misleading. <br><img src=\"http://www.typophile.com/forums/messages/4101/28377.gif\" alt=\"Psalm 27:13:1\"> <br> <br><i>If you add Nikud to a Hebrew font, you should also add the Hebrew portion of the Alphabetic Presentation Forms table (the wide letters and the Yiddish and Ladino ligatures are only an option, though). Notice there's also a special Jewish \"plus\" sign for Hebrew (to counter the \"christian\", cross-like plus).</i> <br> <br>The alphabetic presentation forms also include the alef-lamed ligature. This is not used for the Biblical text*, but is sometimes encountered in other religious books such prayer books, and in a variety of other Hebrew texts from the 7th century on (the earliest dated manuscript containing this ligature was found in the Cairo Genizah; sorry, I can't remember the date). I recently did some research on this ligature, and discovered its early history as record by Solomon Birnbaum in <i>The Hebrew Scripts</i>, Brill 1971, p.226. It originated among speakers of Judaeo-Arabic following the Moslem conquests. The sequence alef+lamed is incredibly common in Arabic because it is the definite article <i>'al</i>, and the ligature was originally developed specifically to write this word. It's use was later extended to every occurence of the sequence in Judaeo-Arabic, and gradually found its way into use in Hebrew. I'd be interested to know to what extent it is used in modern Israel and in what kinds of texts. <br> <br>* Although the alef-lamed ligature is not normally used for the Biblical text, whether in scroll or book form, Moses Gaster notes that one book manuscript in his collection does include 'ligatures formed by the joining of two letters', which I'm guessing refers to the alef-lamed ligature. This is part of a discussion of the relative liberality shown in the writing of Bibles (books) as opposed to the sacred Torah scrolls. [<i>The Tittled Bible.</i> Maggs Bros 1929. p.7]&lt;/font&gt;</p>"
