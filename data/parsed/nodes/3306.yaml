    html: <p>Hey Meir, <br>I just realized I used to download some of your early latin "experiments" when you were a teenager. Tfu Tfu was one of my favorites (I love cats), and knowing such a blackletter "revisitation" comes from Israel is just delightful. Your comments on MTV and timelessness are enlightening. <br> <br>I'm currently reading a book about the exoteric facet of Nazism (and the SS Ahnenerbe) which ties in with my work-in-progress on Nazist imagery in a modern context. I'll surely write you in the future. <br> <br>On a slightly different matter (here the audience seems in tune), the last issue of Eye magazine (n.50) includes a fantastic article by Paul Khera on Abbar, an amazing Arabic typeface which attempts, for the first time as far as I know, to detach itself from the dominating and pretty abused calligraphic models, without forgetting them. <br>The experiments Huda Abifares did with her students in 2002 were more display-oriented, and the work of synthesis Yassar Abbar has done feels really "ahead" in the text-setting field.</p>
