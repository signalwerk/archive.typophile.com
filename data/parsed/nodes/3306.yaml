    html: <p>Hopefully you will get some Israeli comment, but it really depends on the purpose to which the font will be put. I am not expert on this, but here is what I know. <br> <br>Israelis generally don't use the points or 'nikud', though they will use the 'additional' punctuation, hash marks which are attached to Hebrew letters to indicate the soft g and ch sounds in foreign names (Charlie, George). But once in a while Israelis will throw in a vowel point to resolve ambiguity, so probably it is best to have the full set of vowels.  <br> <br>The cantillation marks are only for the editions of the Bible used as a guide for chanting the text - a very specialized use.  <br> <br>The Yiddish combinations are not required in regular Hebrew [Yiddish is a German dialect written in Hebrew characters]. Yiddish is still alive, but has few speakers; you can get a keyboard mapping just for Yiddish which uses the combination letters, I believe.  <br> <br>For outside Israel you would definitely need the regular vowel points, but for inside you might get away without, though you'd have to ask Israelis. I would guess that few Hebrew fonts have cantillation marks available.  <br> <br>There is a problem with spacing the vowel points in a fully voweled text. Some of the Hebrew composition programs for use outside Israel advertise that they have special software to deal with this. </p>
