    html: <p>&gt; the first thing would be the shape of the Hebrew letter <br> <br>But there's something else. <br>It's not just the abstract structure of individual letters than must be taken into account, it's how they come together to form optimal boumas (word shapes). This is why there's a difference between display and text type. A lack of sensitivity to this is the reason 99% of non-Latin type performs worse than their Latin counterparts. You cannot enforce formal congruence (for example in modularity and vertical proportions) without a loss in functionality. <br> <br>If you look at the Cyrillic Meta sample on that page of mine, you will see that it's way too similar to the Latin. Imagine it without those (nominally extraneous) parentheses, and you'll see how it seriously confuses reading. <br> <br>&gt; <a href="http://www.exego.net/specials/type/1078.asp" target="_blank">http://www.exego.net/specials/type/1078.asp</a> <br> <br>Translation, <i>please</i>!  :-) <br> <br>-- <br> <br>BTW, there's a nice article by abi-Fares in the current issue of Baseline magazine (#43). But to me the main thing it shows is how far non-chirographic Arabic type has to go... <br> <br>hhp <br></p>
