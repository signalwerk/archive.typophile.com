    html: <p>Some of the most creative advances in civilization have come from culture clash - or so argued my late teacher Karl Popper in 'The Open Society and Its Enemies'.  <br> <br>Of course, some of the most stupid and ugly things can also come of cultural clash! So the issue is not whether there is influence, but how creatively it is done. Do you get something new and good, or worse or just ridiculous?  <br> <br>In the case of Hebrew script, it was already 'Easternized' once. The 'Hebrew' characters are not Hebrew at all, but Aramaic. In the Talmud I believe they are called 'Chaldean'. The ancient Hebrew script was gradually replaced by the Aramaic script after the Babylonian exile in the fifth century B.C.E. [Aramaic was the language of Babylon and became the common language of the whole near east.]  <br> <br>By the way, Meir, do they ever use the ancient Hebrew script on stamps or coins today in Israel? </p>
