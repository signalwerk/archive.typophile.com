    html: "<p>I found Abbar's work to be problematic (and not nearly as original as it seems), and Khera's article superficial. The main problem with Abbar's font is that it matches the vertical proportions of Univers. As if Univers weren't inappropriate for a lot of text to begin with, Arabic adapted to those proportions can only be a display face, and a servile one. True typographic harmony isn't so shallow. <br> <br>&gt; \"Westernization\" of semitic typefaces is inevitable <br> <br>I can't be so pessimistic. I think a culture can make a successful effort to resist such dilution, not 100%, but enough to maintain the pride necessary for cultural survival. You might be interested in checking out out this page of mine: <br> <br><a href=\"http://www.themicrofoundry.com/ss_rome3.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_rome3.html</a> <br> <br>hhp <br></p>"
