    html: "<p>There are basically four typical ways to write Hebrew today (I say 'typical' because one sometimes finds partially vocalised texts that include occasional nikud): <br> <br>1. Totally unmarked: letters only. <br> <br>2. Only consonant markers indicated: shin dot U+05C1; sin dot U+05C2; dagesh U+05BC; rafe U+05BF. Note that not all consonant marks may be used, or may be used only when necessary to distinguish ambiguous words. For example, one might see documents that only mark the sin dot. <br> <br>3. Full vocalisation: all nikud (vowels) and consonant markers as above. Most of the nikud are centered under the consonant or, in the case of the right-leg consonants like dalet and resh, under the right side. An important exception is the holam, which sits at the top left of the consonant in most cases. Note that the position and behaviour of holam varies in modern Hebrew and many Bible editions. In modern Hebrew typesetting the holam sits slightly to the left of the letter, between it and the next letter. In many Bible editions the holam sits above the left edge of the letter but, importantly, may contextually move further to the left in some circumstances, e.g. when followed by an unvocalised alef. The OTL lookups for Biblical holam are a pain in the neck. <br> <br>4. Full vocalisation and accentuation: all nikud and consonant markers plus all te'amin (cantillation marks). This is used only for the Biblical text; to my knowledge, te'amin never occur in any text except the Bible. Te'amin interract contextually with the nikud and with each other and this, among other things, drastically slows the rendering time of a Biblical Hebrew font. Although many Hebrew-speakers will tell you there is no significant difference between the Biblical and modern Hebrew language, there are some typographic difference (e.g. the position of holam mentioned above) and I'm inclined to ship a stripped-down version of my Biblical Hebrew font for modern Hebrew users simply so they will have something that doesn't have to go through dozens of OTL lookups for things they don't need like te'amin interraction. <br> <br>In addition to the consonant markers, nikud and te'amin, there are a few odds and ends in the Unicode Hebrew block. The paseq mark (U+05C0) is used as part of accentuation in the Biblical text, but it also appears in the Microsoft 8-bit Hebrew codepage, which suggests that it might have some use in modern Hebrew. The Yiddish digraphs that William mentioned may be encoded using the precomposed characters or sequences of regular Hebrew letters; I understand that there is actually divergent practice between different Yiddish user communities. Also, some of the precomposed alef+nikud combinations in the Unicode Alphabetic Presenation Forms block are used as vowels in Yiddish, so should probably be included in any font intended to support that language, even though they may be encoded as sequences of letter and mark. <br> <br>Modern Hebrew punctuation uses most of the typical Latin set: comma, period, semicolon, etc. including parentheses, brackets and braces. I'm not 100% sure what the standard for quotation marks is. Note that unlike Arabic, Hebrew does not use a horizontally-flipped, right-to-left question mark; I know one Israeli type designer who thinks they should, but he has not convinced his colleagues or typical users. <br> <br>My recommendation is that a font for modern Hebrew should support everything that is in the Microsoft 1255 Hebrew codepage.</p>"
