    html: |-
      <p>Fontbit’s text fonts indeed do include full nikud with correct Opentype positioning (providing the software supports it, ie Word, and the Adobe suite to-date).</p>
      <p>Masterfont has now the technology (read the programmer) to do nikud correctly and is currently converting all the fonts to have correct nikud placement.</p>
      <p>Fontbit has two fonts with teamim inside, Livorna and Hadassa, however, the problem of collisions cannot be solved within the font in a sensible way (although Adobe seems to think it can) and has to be solved by an external script. I have solved this problem with both Livorna and Hadassa and have successfully typeset perfectly positioned biblical texts in Adobe InDesign.</p>
