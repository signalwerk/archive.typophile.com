    html: <p>Those are listed as 05F3 and 05F4. If I remember right the single hash mark is put after a gimmel to get the soft g and the double hash after a tzadi to get a CH.  <br> <br>About how good Open Type and kerning deal with the problem I don't know. I believe that Israelis can't be bothered with the problem, as they rarely use the vowel points. John Hudson did an open type Hebrew font with both vowels and cantillation marks, so he will know all this very well. I think Davka (davka.com) claims their vowelling is better placed, but I don't know. You could always call them.  </p>
