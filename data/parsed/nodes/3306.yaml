    html: <p>I feel I must stress on the subject of romanized non-latin type, and I agree with you, Hrant, on the importance of this problematic issue. <br> <br>However, I believe cautiousness, rather than resistance, is the right approach. Especially in the field of language, which is so socially oriented and therefore dynamic and evolving. <br> <br>In an interview I once had with Yanek Iontef, who designed Hebrew faces which resemble the work of Spiekermann (Officina) and Gill (Gill Sans), in very professional manner IMHO, I asked him what is the first aspect he takes into consideration when "importing" Latin for Hebrew type, and he said that the first thing would be the shape of the Hebrew letter, and that it should be constantly addressed during the work process, in order for the letters to maintain their Hebrew properties when confronted against the foreign shapes (a good counter example for this is in the link you posted - the shockingly-Latinized arabic logotype image). <br> <br>I don't really know how to end this post, so I'll just include this shameless link to the aforementioned interview, it has some samples of Yanek's incredible work... Sorry in advance, It's in Hebrew... Peace out. <br> <br><a href="http://www.exego.net/specials/type/1078.asp" target="_blank">http://www.exego.net/specials/type/1078.asp</a> <br></p>
