    html: "<p>&gt;Microsoft 1255 Hebrew codepage <br> <br>Hrant, it took be a while to find the file John refers to on my PC: it is CP1255.TXT. It doesn't include the cantillation marks.  <br> <br>Incidentally, I believe the cantillation marks are referred to in modern Hebrew as \"Te'amim\", not \"Te'amin\". The 'in' plural is characteristic of Aramaic, rather than Hebrew, which uses 'im'.  <br> <br>&gt;many Hebrew-speakers will tell you there is no significant difference between the Biblical and modern Hebrew language  <br> <br>As I understand, the tense structure is significantly different. Modern Hebrew is influenced by Mishnaic Hebrew (many centuries after Biblical Hebrew), which already had a different tense structure. </p>"
