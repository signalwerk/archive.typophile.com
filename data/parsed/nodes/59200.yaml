      <p>Thierry, for what it's worth - I don't like it at all.</p>
      <p>Small arrows on the cross make it look busy (that not even getting into it looking like a game console control buttons). They are a decoration that adds nothing to the logo, and creates scalability problems. The big arrow and cross combination feels forced and geometrically unbalanced. Rather than creating a feeling of something dynamic the arrow simply "sticks out". </p>
      <p>The type looks foreign to the mark - the mark is bold and fleshy, and the type is anorexic. Also the black/white treatment is visually disturbing. The capitalization, the dot, the colors - there is just too much going on for a simple line of text.</p>
      <p>Just look at your own personal logo. It is head and shoulders above this one. Perhaps consider making just a wordmark and incorporating Swiss Cross into it ?</p>
