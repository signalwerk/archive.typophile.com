      <p>I know a thing or two about patents and what not, so a couple of off-topic comments if you don't mind. </p>
      <p>1. I assume you realize that you just made a "public disclosure" of the idea, meaning for example that you now have a year in the US/Canada to file for a patent.</p>
      <p>2. The idea itself is probably not patentable to begin with. This is because it does not include an "inventive step", i.e. something that makes the invention "non-obvious to those skilled in art". The model of control you are describing (if I understand it correctly) has been used before, both in games and professional apps. Specifically I am pretty sure the (click-hold-and-then-move-mouse-to-define-a-vector) controls were used in a game called Homeworld back in late 90s, early 00s.</p>
      <p>3. You may want to flip through Synaptics and Apple patent portfolios. Even if they don't have this specific idea patented, it might be easily added to one of their pending apps. This is a very nasty patent abuse practice called "submarine patents", and this is exactly why you shouldn't be making _any_ public disclosure of the idea before you file.</p>
