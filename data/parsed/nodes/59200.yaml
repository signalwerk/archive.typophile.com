      <p>Ok...I think you're getting closer. Have you tried thinning the strokes of the + to allow more room for a bolder arrow/triangle? Right now, it looks a lot like the red cross logo, but I suspect thinning out the + strokes would solve that problem, too. I might try some fonts that match the weight of the + sign (after thinning it down, of course.)</p>
