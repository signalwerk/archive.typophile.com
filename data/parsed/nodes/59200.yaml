      <p>Ok, cool. Great to hear that you have things under control and the patent has more flesh to it that it seems from the first glance. Looking forward to reading it ;-)</p>
      <p>Regarding the mark - I think a Swiss Cross based icon is a way to go. That really binds the name, the domain and the logo together. The sticking out arrow though doesn't seem to be working, at least not in its current thin pointy form.</p>
      <p>Regarding the type - if words are capitalized, I don't think they need to have different weights. The trailing thin part with a dot in it kind of throws the type of the balance. Basically there's just too much going on in the right part of the type.</p>
