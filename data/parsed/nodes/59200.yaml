    <p>hi everybody,</p>
    <p>theses last weeks i've been in the exausting process of make the demand of a patent about a new way to interact with touch surfaces (wich includes touch screen devices like iphone)</p>
    <p>Basically, the technology create vectors who gives a direction and a amplitude. When you touch the screen a first coordinate is computed once and when you drag a second coordinate is computed and recomputed as long as you maintain the drag.<br>
    The vector is made from the two coordinates as long as you touch the screen.</p>
    <p>With friends we made a brainstorming about the name and we got  Virtual Touch Technology. The patent will be eventually divide in two patent, one for Virtual touch Techology and one for Virtual Touch Pad (wich is a configuration of two vector for playing Doom like games or control planes)</p>
    <p>theses are some illustrations comming with the patent.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vtouchtech_6056.jpg"></div><p></p>
    <p>The goal of the logo is to try as much as possible describe the technology and the origin of the patent, Switzerland.<br>
    Theses are somes trial logos.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/virtualtouch_4918.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/virtualtouch01_6309.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/virtualtouch02_3877.jpg"></div><p></p>
    <p>What do you think (if you understand the technology) ?</p>
