    html: |-
      <p>Pattyfab, I think it's supposed to be a feature, not a fault.</p>
      <p>Elements in the Header and Footer will not be visible in Normal View. They will appear greyed in Print Layout View but will appear correctly in Print Preview.</p>
      <p>If you want imported pictures to appear correctly while editing the document you could...</p>
      <p>Insert &gt; Picture &gt; From File &gt; Then right click on the imported picture &gt; Format Picture &gt; Layout &gt; Select 'Behind Text' &gt; Advanced &gt; Picture Position &gt; Select Horizontal and Vertical 'Absolute Position' and specify distances to the right of and below 'Page'.</p>
      <p>This should stop the picture moving around with the text, but it does mean the user could move or resize it. Maybe there is a way it could be 'locked'?</p>
    html_clean: |-
      <p>Pattyfab, I think it's supposed to be a feature, not a fault.</p>
      <p>Elements in the Header and Footer will not be visible in Normal View. They will appear greyed in Print Layout View but will appear correctly in Print Preview.</p>
      <p>If you want imported pictures to appear correctly while editing the document you could...</p>
      <p>Insert &gt; Picture &gt; From File &gt; Then right click on the imported picture &gt; Format Picture &gt; Layout &gt; Select 'Behind Text' &gt; Advanced &gt; Picture Position &gt; Select Horizontal and Vertical 'Absolute Position' and specify distances to the right of and below 'Page'.</p>
      <p>This should stop the picture moving around with the text, but it does mean the user could move or resize it. Maybe there is a way it could be 'locked'?</p>
