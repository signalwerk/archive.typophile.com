    <p>Hi. </p>
    <p>I have been given a logo that uses the typeface 'Incarnatus II' in its regular weight.</p>
    <p>I have tried a google search and have talked to a major type vendor here in the UK and no trace of this face can be found. Has anybody heard of it or, even better, know where it can be found/bought?</p>
    <p>It is a roman, almost engraving style face, with pretty even weight on the strokes and very slight almost imperceptible serifs. The only example I have is in all in upper case.</p>
    <p>Thanks in anticipation</p>
    <p>Nick</p>
