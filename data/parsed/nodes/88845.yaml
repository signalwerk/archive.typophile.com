    <p>Hi there,</p>
    <p>I'm looking for a typeface which is not identical to, but has a similar “aesthetic feel” to the Budvar logotype. I've attached an image of the current logo for reference. Something which looks like it could be for a beer!</p>
    <p>Many thanks,</p>
    <p>Tabrez.</p><div class="imageWrap"><img src="http://typophile.com/files/budvar_4868.jpg"></div><p></p>
