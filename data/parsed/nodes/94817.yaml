    <p>The catalogues of FODOR museum are simply beautiful, the "fodor" typeface is really wonder.<br>
    But if you have a look on the <a href="http://www.flickr.com/photos/20745656@N00/3740798234/in/photostream/" rel="nofollow">name </a>(in this case "Gerard Höweler") that follow every catalogue, that typeface isn't worse.</p>
    <p>Does anybody know something about that "typewriter"(?) typeface?</p>
    <p>----------<br>
    Fábio Santos</p>
