      <p>I'd like to know this as well. I know Crouwel devloped a monospace font for use with typewriters, but because the technology had changed before he finished it, I don't believe it was ever released.  Plus I think it was more of his standard straight line only grid inspired designs, certainly not a badly inked courier type of thing like this.</p>
      <p>Posting a pic here, cuz who knows how long links are good for.<br>
