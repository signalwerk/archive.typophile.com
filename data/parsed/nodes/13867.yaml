    <p>Hey fellas</p>
    <p>Yesterday my wife pilled up all my old t-shirts and said - losely translated - “go polish our car with these” and I said “but honey, what am I surposed to wear then?”. “Buy new ones” was her blunt answer...so guys... help me out here. Im looking for some really cool type t-shirt to fill up my empty closet.</p>
    <p>Do you know if typophile has some or maybe some of you are seeling your designs?</p>
    <p>Thanks kindreds</p>
    <p>Mark</p>
