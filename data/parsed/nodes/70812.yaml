    html: |-
      <p>Looks like a good idea.<br>
      The counters of e and s could be a tad larger. I had problems reading "sharp" at first, as s, a and o are very similar, so you need context. Maybe the o would be better off without a connecting stroke to the right.<br>
      The spacing of de in "idea" appears too wide to me, but - almost - ok in "Tide".<br>
      I can't really imagine how your f is written with a pen.<br>
      And maybe the i-dot could have a slant to go with the penstroke.</p>
      <p>My 2p.<br>
      Andreas</p>
