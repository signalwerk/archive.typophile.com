      <p>Sorry for the late reply. I've been ill. The flew is chopping away on Holland.</p>
      <p>I've also got the feeling the basic is Verdana, but because it's not well executed it thought this might be a freeware font swirling the internet. The weight seems heavier than the Verdana Regular, the logo font is wider but the balance is off. The 'e' for instance seems to wide for me.<br>
      But seeing the fact that this is quite an old company it seems strange to me that this is a freeware font or even Verdana.<br>
      Since the company doesn't use Verdana in any publication I skipped this font. But I think I should dig a bit deaper in the companies archive. Perhaps the've got some old file on a disc somewhere.</p>
      <p>Thanks for your help!</p>
