  - id: 542205
    user: 57325
    date: 2013-02-04T17:44:00
    date_raw: 4 Feb 2013 — 5:44pm
    votes: null
    html: <p>I think this is a custom-made wordmark, not based on any existing typeface. The one who did it apparently tried to derive many forms from others. The results look somewhat off to me. ‘r’, for instance, is almost the same as the left half of ‘n’. ‘g’ and ‘b’ have virtually identical bowls. Also, rounded letters have no visible overshoot below the baseline. Maybe autotracing worsened the appearance of the logo (a look at <a href="http://www.engbers.de/uploads/pdf/Mediengestalter_HP_engbers.pdf" rel="nofollow">this</a> PDF seems to confirm that). If you aim for a similar (but more professional) look, I agree that Verdana (or Tahoma) is your best bet.</p>
    html_clean: <p>I think this is a custom-made wordmark, not based on any existing typeface. The one who did it apparently tried to derive many forms from others. The results look somewhat off to me. ‘r’, for instance, is almost the same as the left half of ‘n’. ‘g’ and ‘b’ have virtually identical bowls. Also, rounded letters have no visible overshoot below the baseline. Maybe autotracing worsened the appearance of the logo (a look at <a href="http://www.engbers.de/uploads/pdf/Mediengestalter_HP_engbers.pdf" rel="nofollow" class="link-external">this</a> PDF seems to confirm that). If you aim for a similar (but more professional) look, I agree that Verdana (or Tahoma) is your best bet.</p>
