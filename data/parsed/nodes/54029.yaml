      <p><a class="freelinking external" href="http://mikeparkerfontgod.blogspot.com/2010/10/helvetica-in-motion-kinetic-typography.html" rel="nofollow">This</a> is a page about an in-progress work on a Mike Parker biography where I found a passage on Trade Gothic if any one coming to this thread is interested:</p>
      <blockquote><p>Jackson had guarded one small corner of capacity and used it to produce our one large series for trade typesetters.  Trade Gothic is a sans serif in four widths, three weights, and ten sizes, a refined and expanded linecaster version of Morris Fenton Benton's great 1908/9 series Lightline and News Gothic.  Jackson and the company saw it as an 'American' answer to the 'European' sans serifs, headed by Univers.</p></blockquote>
