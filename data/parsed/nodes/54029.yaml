      <p>Linotype just released <a href="http://www.linotype.com/en/5737/tradegothicnext.html?utm_source=LinoLetter-0901&amp;utm_medium=email&amp;utm_term=EN&amp;utm_content=content&amp;utm_campaign=Trade+Gothic+Next+Feature" rel="nofollow">Trade Gothic Next</a> and the page I linked to provides a little information about it.</p>
      <p>IIRC there’s not a great deal about Trade Gothic out there simply because it’s not a typeface with a really remarkable design or story. I think it would be more interesting to interview Mike Parker at Font Bureau (who worked with, for, and succeeded Burke) and Akira Kobayashi (who did TG Next) and make a poster out of that.</p>
      <p>And stay away from the idiotic Wikipedia entry that begins “Trade Gothic is a typeface which mostly follows the Bitstream version of News Gothic…”</p>
