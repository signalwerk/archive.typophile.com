      <p>Saratyp, apologies for my earlier post! Google didn't really work for me either!</p>
      <p>It sounds like you are required to make the poster for college?</p>
      <p>I think if the poster is to be about the typeface itself, then you can look to the typeface itself for the content of your poster. Observe the qualities of the typeface, x-height, compression etc. These graphic qualities might make for a better poster than the history of the typeface as they will work at a distance. Perhaps you could combine these with some of the sources James mentioned for some close up reading.</p>
