      <p>Compare the letter forms and cut locations to Klim's Karbon Slab Stencil Bold:<br><img src="/sites/default/files/old-images/KarbonSlabStencilBold_3602.jpg"><br><a href="https://klim.co.nz/retail-fonts/karbon-slab-stencil/">https://klim.co.nz/retail-fonts/karbon-slab-stencil/</a><br>
      If you increase the weight of the font and fill in some of the cuts you would have a fairly good match.<br>
      Don</p>
