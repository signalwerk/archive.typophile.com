    html: <p>This lettering comes from <a href="http://www.theguardian.com/data/series/show-and-tell" title="Click to visit an external URL." class="freelink freelink-external freelink-external">The Guardian</a>. I'm pretty convinced this is a stencil version of their <a href="https://commercialtype.com/typefaces/guardian/egyptian_headline" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Egyptian Headline</a>. As alternative, you might like <a href="http://vllg.com/schwartzco/stag-stencil" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stag Stencil</a>, also designed by Christian Schwartz.</p>
