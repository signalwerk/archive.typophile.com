    html: <p>This lettering comes from <a class="freelinking external" href="http://www.theguardian.com/data/series/show-and-tell" rel="nofollow">The Guardian</a>. I'm pretty convinced this is a stencil version of their <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/guardian/egyptian_headline" class="freelinking" rel="nofollow">Egyptian Headline</a>. As alternative, you might like <a class="freelinking external" href="http://vllg.com/schwartzco/stag-stencil" rel="nofollow">Stag Stencil</a>, also designed by Christian Schwartz.</p>
    html_clean: <p>This lettering comes from <a class="freelinking external link-external" href="http://www.theguardian.com/data/series/show-and-tell" rel="nofollow">The Guardian</a>. I'm pretty convinced this is a stencil version of their <a href="https://commercialtype.com/typefaces/guardian/egyptian_headline" class="freelinking link-external" rel="nofollow">Egyptian Headline</a>. As alternative, you might like <a class="freelinking external link-external" href="http://vllg.com/schwartzco/stag-stencil" rel="nofollow">Stag Stencil</a>, also designed by Christian Schwartz.</p>
