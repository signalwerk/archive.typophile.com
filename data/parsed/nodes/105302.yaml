  html: |-
    <p>Hi guys,</p>
    <p>I'm creating a sans-serif font but as alternates the I and J have little serifs, and I want to carry over the alternates to the small caps. I'm getting a little stuck on the scripting. (Massive newbie on the scripting btw). </p>
    <p>So when Small Caps are on with alternates the small cap serif I will be displayed instead of tthe small cap I.</p>
    <p>Is this possible?</p>
    <p>Thanks in advance.</p>
  html_clean: |-
