    html: |-
      <p>Yes, it's trivially possible.</p>
      <p>feature c2sc {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub [...I J...] by [...I.sc J.sc...];<br>
      } c2sc;</p>
      <p>feature salt { # placed in 'salt' for access in Illustrator<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup alternates {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub [I J I.sc J.sc] by [I.alt J.alt I.sc.alt J.sc.alt];<br>
      &nbsp;&nbsp;&nbsp;&nbsp;} alternates;<br>
      } salt</p>
      <p>feature ss01 { # duplicated as a stylistic set for access in InDesign<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup alternates;<br>
      } ss01;</p>
      <p>André</p>
