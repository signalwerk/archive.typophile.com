    html: |-
      <p>Thank you both agisaak and eliason!!</p>
      <p>feature salt {<br>
      lookup alternates {<br>
              sub [I.sc J.sc Igrave.sc Iacute.sc Icircumflex.sc Idieresis.sc] by [I.salt.sc J.salt.sc Igrave.salt.sc Iacute.salt.sc Icircumflex.salt.sc Idieresis.salt.sc];<br>
          } alternates;<br>
      ...<br>
      }salt;</p>
      <p>which sits after the smcp feature.</p>
      <p>Legends!</p>
