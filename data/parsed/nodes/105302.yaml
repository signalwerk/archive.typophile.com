    votes: null
    html: <p>Features are applied in order. So if your small caps feature comes first, make sure your stylistic alternate code changes both caps and small caps to the alternates. And if your alternate features comes first, make sure your small caps code "small-capifies" both the standard and the alternate letters.</p>
