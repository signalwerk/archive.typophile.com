  html: |-
    <p>Okay this is my first post in the critique section so I'm not too sure <br>how people work with attachments, I'm guessing a PDF will be fine. <br> <br>This is a project I'm doing in school in a typographic experimentation <br>class. The typography itself is not really experimental but it's more <br>conceptual. The text speaks about the page (or sheet), at first in a <br>very mathematical way and in the end it becomes an excuse for <br>imaginary travel. <br> <br>I'm not sure how to say this in english but it's contained in itself, <br>at first the author writes : <br> <br>I'm writing... <br>I'm writing : I'm writing... <br>I'm writing : "I'm writing..." <br>I'm writing that I'm writing... <br> <br>For this reason, I gave a shot at Courier because it really conveys <br>that typewriter feel and also because I wanted to work the typography <br>in depth (I've already tweaked quite a bit of stuff in there). <br> <br>I'd like to have your opinions, suggestions on the spacing. (And more <br>if you want / can read the text!) <br> <br>By the way, some paragraphs are upside down because this is meant to <br>be folded. If anyone feels like giving it a shot, here are the <br>simplified translated instructions -- <br> <br>1 : Fold <br>2 : Flip <br>3 : Fold corner / <br>4 : Fold right corner too <br>5 : Fold one part <br>6 : Flip <br>7 : Fold one part <br>8 : Open and flatten <br>9 : Fold one part <br>10 : Fold one part <br>11 : Open and flatten <br>12 : Pull here. <br> <br>Emilie <br> <br></p>
