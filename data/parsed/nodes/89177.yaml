    <p>EDITION LIDU search for author’s books, graphic books, art comic strips, illustrated short stories, photo books, hand-printed books and other original book forms which haven’t been published yet or has been self-published in limited edition.</p>
    <p>The Call for Entries is open to established and emerging ARTISTS, ILLUSTRATORS, GRAPHIC DESIGNERS and TYPOGRAPHERS, PHOTOGRAPHERS, WRITERS, ART and DESIGN STUDENTS.</p>
    <p>Deadline for Submissions: 16 March 2012</p>
    <p>Submit your project here:<br>
    <a href="http://www.editionlidu.com/artbookswanted/" title="http://www.editionlidu.com/artbookswanted/">http://www.editionlidu.com/artbookswanted/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/CallForEntries01_3861.jpg"></div><p></p>
