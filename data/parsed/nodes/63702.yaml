    <p>Hi all,</p>
    <p>I really need to invest in a color printer for proof work in my graphic design/illustration/type/logo design workflow. I'd like to be able to print out a half accurate proof for any client work to give to them. </p>
    <p>About 5 years ago I had a $1000 Epson A3 Photo injet printer (can't remember the series number) but it was a real hassel to get it to print correctly and the ink very quickly dried and my overal experience was very frustrating and disappointing and stopped using the thing as a result.</p>
    <p>So I was looking at an A4 color laser. I have a black toner Hp1200 laserjet for about 9 years and it has just been terrific. Just wondering if anyone can recommend me a good A4 color laser for my situation and any specifics I should be looking out for.</p>
    <p>Not sure if I could trust Epson again after that experience although I'm sure their other products are much better.</p>
    <p>Any help would be great</p>
