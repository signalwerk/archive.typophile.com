      <p>I bought a Xerox Phaser 6130 a year ago and the quality is very good. As I recall, it worked 'out of the box'. The setup switch, which I found to be fiddly, is similar to the multi-position switches on mobile phones and cameras, so if you're familiar with those, you'll have no problem. I've not had to replace one of the 4 cartridges, but I'm a light (home) user. </p>
      <p>As to whether it's the 'best' or not, I can't say, but it does reproduce text, drawn vector shapes and solid fills extremely well and photographs look pretty good. The problem is that one person's 'excellent', is another person's 'average'. I've used standard laser/copier paper and photographic. The output is very good on both, but it's noticeably  better on the photographic paper. I've had a couple of inkjets and in every respect the Xerox is much better. It was reasonably priced, too.</p>
