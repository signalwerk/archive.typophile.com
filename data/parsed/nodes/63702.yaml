      <p>@TF22Raptor</p>
      <p>I only know a good German source for printer tests:<br>
      <a href="http://www.druckerchannel.de/ranking.php?tabelle=laser_farbe" title="http://www.druckerchannel.de/ranking.php?tabelle=laser_farbe">http://www.druckerchannel.de/ranking.php?tabelle=laser_farbe</a></p>
      <p>They take pictures from the printed letter 'a' with the help of a microscope:<br>
      <a href="http://www.druckerchannel.de/cache_bilder/std/und_beim_normaldruck_keine_veraenderung_im_treiber_ldafe0.jpg" title="http://www.druckerchannel.de/cache_bilder/std/und_beim_normaldruck_keine_veraenderung_im_treiber_ldafe0.jpg">http://www.druckerchannel.de/cache_bilder/std/und_beim_normaldruck_keine...</a></p>
      <p>It may sound theoretically, but there are big differences with regard to the precision and thickness, in which laser printers print letters. HP seems to print too thin, at least the monochrome printers.</p>
      <p>You also should care about duplex precision and the document authenticity of the toner. For example it can happen, that the toner gets off, if you fold the paper, although it is resistant against finger nails and wetness.</p>
      <p>I have heard, that the toner, that Lexmark uses, is document authentic. Samsung is not. But Lexmark tends to print thicker than Samsung, at least, if you compare the monochrome printers.</p>
      <p>Unfortunately they never tested a Xante printer.</p>
      <p>I would like to know more of those sources.</p>
