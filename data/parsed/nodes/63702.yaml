      <p>As far as I know, there’s always a border. You can specify no margin in Page Setup, but prints have a 3mm gap all round. </p>
      <p>I’ve printed on 120gsm Matt Picture paper. The manual lists various papers including Thick Card stock up to 220gsm, but it wouldn’t accept 180gsm Photo Gloss Inkjet paper. The printer is very particular about paper types; you have to specify the correct paper type in the printer’s menu. I’ll investigate.</p>
