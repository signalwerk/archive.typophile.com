      <p>And indeed I see that Part 6 is where I should have looked.</p>
      <p>There, I encountered the closest matches yet:<br>
      Trieste, Oxalis Alternate, Oz Brush;</p>
      <p>and some other faces that closely resemble what I was looking for:<br>
      Rana, Oak Wood, Malandra, FF Elegie Regular, Holly;</p>
      <p>and some others I hadn’t mentioned in my other posts about possible alternates to Papyrus, but which might also serve that purpose:<br>
      Polaris, Clichee, Gararond, Charon, Demi Tasse, Rhino (Mobil)</p>
      <p>In there were also several other faces (like Ereshkigal and Prsent) that I have already noted - or acknowledged when mentioned by others - as possible Papyrus alternatives.</p>
