      <p>The (lack of) kerning suggests that this is an amateur font, and so I looked at Dafont and Abstract Fonts in categories I thought might include this. The closest I have found so far was something called <a class="freelinking-external" href="http://www.abstractfonts.com/font/13378?text=Mercenary">pehuensito, Regular</a>.</p>
      <p>Frankly, I would consider a more skilled (professional) font, like Jubilee or <a class="freelinking-external" href="http://new.myfonts.com/fonts/berthold/post-antiqua-bq/">Post Antiqua</a>, rather than this poorly executed calligraphic font.</p>
      <p>- Mike Yanega</p>
