    <p>The quest for a substitute for Papyrus has led me to look for candidate typefaces.</p>
    <p>One that I found was on the box for a computer game - but try as I might, I could not identify it. Finally, I took a picture, and submitted that to MyFonts’ electronic match, but although that let me find Adobe Present from the Omniglot logo, it didn’t find the match for this one:</p>
    <p></p><div class="imageWrap"><img src="/files/word_4581.jpg"></div><p></p>
    <p>This seems to be a plain but calligraphic font... but I don’t think they used hand lettering. (Although the letters did have a 3-D effect, so I suppose it’s possible...)</p>
    <p></p><div class="imageWrap"><img src="/files/word4_5634.jpg"></div><p></p>
    <p>And here’s another sample. I would think this should be simple and obvious to find, but it has turned out not to be.</p>
