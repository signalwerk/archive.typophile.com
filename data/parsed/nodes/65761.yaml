      <p>Actually, though, when I looked up the candidates there, I still didn’t find a real match - for those I could find a larger illustration, it turned out they were different.</p>
      <p>But I think you are right, and this doesn’t exist as a “real” font, even if it is some obscure free font somewhere. Also, in the samples I provided, I see I failed to include one with a significant distinguishing feature of the design. The bottom right-pointing serif of the lowercase L is so big that it can be mistaken for an uppercase L. Another reason to think that it’s likely just some amateur calligraphy.</p>
      <p>But I still saw much of what I was looking for, because even if I can’t find an exact match, identifying that font was just a part of my search for alternatives to Papyrus - and I did find several of those in that area.</p>
