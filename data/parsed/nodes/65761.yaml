      <p><cite>Frankly, I would consider a more skilled (professional) font, like Jubilee or Post Antiqua, rather than this poorly executed calligraphic font.</cite></p>
      <p>I’ll agree with that, but while my previous searches had turned up Jubilee and Post Antiqua, I’ve been wishing I could find a closer match.</p>
      <p>Post Roman might be what I’m looking for, but it doesn’t seem to have been digitized, so I can’t find a more extensive sample online to compare.</p>
      <p>Jubilee is clearly a typeface, not calligraphic hand lettering.</p>
      <p>Basically, the reason I thought that this particular style of type was a good substitute for Papyrus was because it wasn’t elaborate like an uncial face, or even like Motto (compare <a class="freelinking-external" href="http://new.myfonts.com/fonts/typodermic/mikadan/">Mikadan</a> although that’s closer to Verona, also more elaborate) or Freehand (compare <a class="freelinking-external" href="http://new.myfonts.com/fonts/nicksfonts/duly-noted-nf/">Duly Noted</a>).</p>
      <p>So, basically, think of something like Lydian, but with just a minimum of pointy serifs added, just barely enough to say “calligraphy”, while avoiding tagging the font with too specific a time and place - because that’s the virtue of Papyrus.</p>
