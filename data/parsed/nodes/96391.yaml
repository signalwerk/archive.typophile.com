      <p>I used Kepler (in its multiple master form) for a book: it was <em>Answering Chief Seattle</em>, by Albert Furtwangler, which I designed (interior &amp; exterior) for the University of Washington Press in 1997. You can see a few of the interior pages by way of Amazon’s “Look inside” feature, though of course they appear crudely rendered here:</p>
      <p><a href="http://www.amazon.com/Answering-Chief-Seattle-Albert-Furtwangler/dp/0295976330" title="http://www.amazon.com/Answering-Chief-Seattle-Albert-Furtwangler/dp/0295976330">http://www.amazon.com/Answering-Chief-Seattle-Albert-Furtwangler/dp/0295...</a></p>
      <p>It’s not the easiest typeface in the world to use, but it can work very well if it’s treated right. Always give it enough space!</p>
