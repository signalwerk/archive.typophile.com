      <p>I can't really help you with your initial question, but I was at a similar point as you are, when deciding which typeface I should use for my thesis. I ended up with <a class="freelinking external" href="http://www.stonetypefoundry.com/cyclesoverview.html" rel="nofollow">Cycles</a> Eleven. However given the printing conditions one is faced as a non graphic industry professional I probably would advice Cycles Nine.<br>
      I never regretted it, and I still think it is a magnificent choice. An unobtrusive text typeface with a tamed renaissance touch, but enough character to be interesting.</p>
    html_clean: |-
