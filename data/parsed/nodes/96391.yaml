      <p>Kepler was my workhorse type before I designed my Brill family, and it remains my favourite of Robert Slimbach's designs. I don't care so much for the light and expanded styles, but once it has some meat on its bones it is a fine design.</p>
      <p>At my suggestion, it is used for the <em>Dorchester Review</em>, a Canadian high Tory journal out of Ottawa. Unfortunately, there is no sign of it on their current website, other than in photographs of the journal cover. The neoclassical aspects of the design suit the tone of the journal well, while its romantic aspects are pleasingly subversive (at least to me).</p>
    html_clean: |-
