    <p>Hello,</p>
    <p>I am looking for sources and suggestions on creating a font that demonstrates habits. For my final graphic design project, I have to design a typographical bookjacket for "The Power of Habit." Briefly, it is about how habits have the power to control and reform the success or failures of businesses, transform societies, and change our lives. The reaccuring theme is how habits work with a cue that triggers the routine, and finally what we gain from it. (Think of a continuous circle, and how habits pick up power by happening over and over again)</p>
    <p>I am trying to use a process that can guide my design solution, but am having a difficult time with representing habits in my type design. Any place to start, ideas and suggestions would be greatly appreciated!! Thank you!</p>
