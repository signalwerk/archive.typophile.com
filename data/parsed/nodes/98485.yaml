      <p>&gt; Think of a continuous circle</p>
      <p>Have you ever seen Alfred Hitchcock's "Vertigo"? It's about obsession. In the opening credits this idea isn't communicated so much in the type but instead in the visuals and music, with rotating circles and music motifs that are repeated endlessly. Perhaps it might give you some inspiration.</p>
