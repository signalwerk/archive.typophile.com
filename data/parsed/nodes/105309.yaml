    <p>We are thinking about purchasing Font Explorer Pro Server but I have a question about font licensing…</p>
    <p>If we have purchased a font on MyFonts with five licenses and we install it on Font Explorer Pro Server will it recognise the number of licenses bought? ie. if a 6th person trys to access the font will it be flagged up?</p>
    <p>Cheers</p>
    <p>Hamo</p>
