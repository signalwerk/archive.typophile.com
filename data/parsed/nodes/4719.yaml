  html: '<p><b>Veer Announces: New Jukebox Typefaces for May 2004</b> <br> <br>Veer is pleased to announce the addition of two new typefaces to our very own <a href="http://www.veer.com/jukebox/">Jukebox</a> collection. These typefaces can be found in the May edition of the <a href="http://www.veer.com/ideas/catalogs/">Veer Visual Elements Catalog</a> and on our web site. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/35646.gif" alt="Jukebox Stephanie Marie"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?Image=JBT0000067">Stephanie Marie</a> by Jason Walcott <b>{ Jukebox }</b> They say lower loops in handwriting indicate sensuality. No wonder new Stephanie Marie is so attractive. A lively, brush-style script font, named after a dear friend of the designer. Contains several alternate characters and ligatures. One weight. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/35647.gif" alt="Jukebox Fanfare"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?Image=JBT0000066">Fanfare</a> by Jason Walcott <b>{ Jukebox }</b> Drum roll please... Fanfare marches out with jubilant style. A happy, shiny headline typeface reminiscent of game show and situation comedy titles from the late 60s and early 70s. One weight. <br> <br>............................................................................................................................................ <br> <br>For more information regarding these new type products, contact: <br> <br>Jacqueline Wallace <br>403 313 4942 <br><a href="mailto:media@veer.com">media@veer.com</a></p>'
