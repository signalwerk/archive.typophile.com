      <p>I happen to quite like the new one Tin. I am a fan of simple typographic solutions, that said, I feel the name is flawed - as previously discussed in the other thread. So I would avoid any visual reference to time or clocks. I feel the last one (on the bottom) with the people in the circle is a bit overdone and confusing. I would incorporate “RECRUITMENT AGENCY” or the German equivalent into the logo and get done with it because this ain’t getting any better with a name like that :)</p>
      <p>Hope this helps.</p>
      <p>Jay</p>
