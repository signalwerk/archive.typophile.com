    <p>Hi,</p>
    <p>My client is a job agency called “TimeZeit”, a combination of the English “time” and its German equivalent “Zeit”. The client wants a slick solution that appeals to job seekers and corporate clients equally, and that will stand the test of “time” (joke).</p>
    <p>However, I am finding it very difficult to come up with any ideas. Incorporating a clock in the logo seems obvious, however having the concept of time appear three times in the logo may be too flamboyant.</p>
    <p>Since the business is essentially a people business, I also tried variations that had humans in it, for example humans forming a circle (= clock!), seen from above - with varying degrees of success.</p>
    <p>This is the latest idea I came up with and that I would like your opinion on:</p>
    <p></p><div class="imageWrap"><img src="/files/logo_B_4300.png"></div><p></p>
    <p>These would be some other concepts:</p>
    <p></p><div class="imageWrap"><img src="/files/logo2_4196.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/logo_6203.png"></div><p></p>
    <p>Thanks for any help in this matter!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/49279" class="topic-next" title="Go to next forum topic">Jewelry designer logo ›</a></div>
