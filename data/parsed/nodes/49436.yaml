    html: |-
      <p><cite>Which logo has got the most potential?</cite></p>
      <p>Definately the first one. Number two, as you said, is too much like a watchmaker and sorry but i hate number 3 - far too fussy. You are right to avoid people - too cliched.</p>
      <p>Having said that, if someone at my work was on this project I’d advise them to do further explorations. What would it look like with really tight tracking - like the Wolf Olins’ Booz&amp;co work?<br>
      </p><div class="imageWrap"><img src="/files/bac-booz_and_co-logo_3436.gif"></div><p></p>
      <p>Is it supposed to be two words or one? Might be interesting to treat it as one, how would it be pronounced? If you wanted a subtle tilt at ’people’ you could look at something with the i’s representing a person - relationship with the t representing a relevant concept. The symmetry is nice but as bobby said, take care not to look like a church. Maybe the ’me’, as in personal, could be emphasized? Does ’ze’ mean anything in German?</p>
      <p>Could also look at a far subtler nod to ’time’...dunno, something like the letters casting a shadow starting long and going to short representing the passing of time without alluding to clocks. Might be too fussy. Tracking from loose to very tight in the middle to loose again - acceleration?</p>
      <p>Just some random thoughts anyway, take them for what they are. We would get all this sort of stuff up on a wall and start exploring.</p>
      <p>I would avoid having ’recruitment agency’ as part of the name or mark - its redundant and dull.</p>
      <p>ps. that thing with the clip art in your last post is just awful.</p>
