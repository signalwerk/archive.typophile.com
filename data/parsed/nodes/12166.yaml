    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Zuzana Licko</strong></p>
    <p>Slovak, born 1961.</p>
    <p>Type designer, co-founder of <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>, and provocateur. <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a> and Licko were semi-unwitting members of the vanguard of <a href="/wiki/postmodern%20typography" class="freelinking" rel="nofollow">postmodern typography</a>, and through Emigre the foundry and <a href="/wiki/Emigre%20Magazine" class="freelinking" rel="nofollow">Emigre Magazine</a> found herself on the forefront of type design in the late 80s and early 90s.</p>
    <p>Licko's early typefaces betray a fascination with low-resolution output, being <a href="/wiki/outline%20font" class="freelinking" rel="nofollow">outline font</a> versions of the fonts then in use on dot-matrix printers. Inspiration from those sources is also evident in the "Base" typefaces, more abstract explorations of simplified typeface design. Over the the last 15 years Licko's designs have grown less extreme, although no less radical.</p>
    <p>Licko's most significant achievements to date are her two playful text families, <a href="/wiki/Filosofia" class="freelinking" rel="nofollow">Filosofia</a> and <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a>. <a href="/wiki/Filosofia" class="freelinking" rel="nofollow">Filosofia</a> is a <a href="/wiki/didone" class="freelinking" rel="nofollow">didone</a> / <a href="/wiki/Bodoni" class="freelinking" rel="nofollow">Bodoni</a> <a href="/wiki/revival" class="freelinking" rel="nofollow">revival</a> with many alternate characters and a frequently-used <a href="/wiki/unicase" class="freelinking" rel="nofollow">unicase</a> face. <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a>, named for <a href="/wiki/John%20Baskerville" class="freelinking" rel="nofollow">John Baskerville</a>'s lover, is a mildly stylized <a href="/wiki/Baskerville" class="freelinking" rel="nofollow">Baskerville</a> <a href="/wiki/revival" class="freelinking" rel="nofollow">revival</a> known for its profusion of colorful <a href="/wiki/ligatures" class="freelinking" rel="nofollow">ligatures</a> and "petite caps", a unique variation on the theme of <a href="/wiki/small%20caps" class="freelinking" rel="nofollow">small caps</a>. <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a> is a technical tour de force, formerly being accompanied by a program from <a href="/wiki/LettError" class="freelinking" rel="nofollow">LettError</a> intended to help designers manage its unwieldy set of ligatures, and recently being converted to an overwhelmingly full-featured <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> family by <a href="/wiki/John%20Butler" class="freelinking" rel="nofollow">John Butler</a>. Both type families are beloved by graphic designers and regarded with mild suspicion by typographers.</p>
