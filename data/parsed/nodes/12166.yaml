    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Zuzana&nbsp;Licko</strong></p>
    <p>Slovak, born&nbsp;1961.</p>
    <p>Type designer, co-founder of <a href="/node/12208" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre</a>, and provocateur. <a href="/node/12208" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre</a> and Licko were semi-unwitting members of the vanguard of <a href="/node/add/wiki?edit%5Btitle%5D=postmodern%20typography" title="Create node &quot;postmodern typography&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">postmodern typography</a>, and through Emigre the foundry and <a href="/node/12457" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre Magazine</a> found herself on the forefront of type design in the late 80s and early&nbsp;90s.</p>
    <p>Licko’s early typefaces betray a fascination with low-resolution output, being <a href="/node/add/wiki?edit%5Btitle%5D=outline%20font" title="Create node &quot;outline font&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">outline font</a> versions of the fonts then in use on dot-matrix printers. Inspiration from those sources is also evident in the “Base” typefaces, more abstract explorations of simplified typeface design. Over the the last 15 years Licko’s designs have grown less extreme, although no less&nbsp;radical.</p>
    <p>Licko’s most significant achievements to date are her two playful text families, <a href="/node/add/wiki?edit%5Btitle%5D=Filosofia" title="Create node &quot;Filosofia&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Filosofia</a> and <a href="/node/12210" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mrs Eaves</a>. <a href="/node/add/wiki?edit%5Btitle%5D=Filosofia" title="Create node &quot;Filosofia&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Filosofia</a> is a <a href="/node/30993" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Didone</a> / <a href="/node/33638" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bodoni</a> <a href="/node/12425" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">revival</a> with many alternate characters and a frequently-used <a href="/node/39870" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">unicase</a> face. <a href="/node/12210" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mrs Eaves</a>, named for <a href="/node/14119" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Baskerville</a>’s lover, is a mildly stylized <a href="/node/12622" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Baskerville</a> <a href="/node/12425" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">revival</a> known for its profusion of colorful <a href="/node/add/wiki?edit%5Btitle%5D=ligatures" title="Create node &quot;ligatures&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">ligatures</a> and “petite caps”, a unique variation on the theme of <a href="/node/12584" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small caps</a>. <a href="/node/12210" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mrs Eaves</a> is a technical tour de force, formerly being accompanied by a program from <a href="/node/14101" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LettError</a> intended to help designers manage its unwieldy set of ligatures, and recently being converted to an overwhelmingly full-featured <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> family by <a href="/node/12417" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Butler</a>. Both type families are beloved by graphic designers and regarded with mild suspicion by&nbsp;typographers.</p>
