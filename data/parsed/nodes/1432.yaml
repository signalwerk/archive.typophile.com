  html: <p>This logo is for my freelance design work. I will do a stationary after I complete my logo. I have had the TC icon for awhile but I haven't found type that worked. I want to keep the icon the way it is and work around it. <br> <br>On suggestions from before when I posted on here I have made the typeface more mechanical. I used Industria in all caps. I never thought I would use this typeface, but I believe it works with the icon. I would love suggestions! <br> <br><img src="http://www.typophile.com/forums/messages/29/17099.gif" alt=""> <br> <br>-Tom</p>
