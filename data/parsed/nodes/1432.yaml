    date_raw: 27 Sep 2003 — 12:03pm
    votes: null
    html: "<p>Tom: <br> <br>I like the \"CT\" mark. Your insistance to accompany the mark with the Tom Cannon Design name is wise, as the \"C\" is difficult to discover on its own. The black framed \"design\", however is not doing it for me. I think this approach is generating competition between the \"CT\" mark and the name. <br> <br>Attached are a couple of alternative suggestions using Armada (name font). There aren't any additional design elements to the type, but I think the typeface has plenty of interest in and of itself and is appropriate. <br> <br>Good luck in developing your perfect solution. <br> <br>Aloha! <br>Scott <br> <br><img src=\"http://www.typophile.com/forums/messages/29/17235.jpg\" alt=\"Tom Cannon Design Logo\"></p>"
    html_clean: "<p>Tom: <br> <br>I like the \"CT\" mark. Your insistance to accompany the mark with the Tom Cannon Design name is wise, as the \"C\" is difficult to discover on its own. The black framed \"design\", however is not doing it for me. I think this approach is generating competition between the \"CT\" mark and the name. <br> <br>Attached are a couple of alternative suggestions using Armada (name font). There aren't any additional design elements to the type, but I think the typeface has plenty of interest in and of itself and is appropriate. <br> <br>Good luck in developing your perfect solution. <br> <br>Aloha! <br>Scott <br> <br><img src=\"http://www.typophile.com/forums/messages/29/17235.jpg\" alt=\"Tom Cannon Design Logo\"></p>"
