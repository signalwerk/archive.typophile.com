    html: <p>Thanks you all for your comments! I love armada and I just purchased it =) The line around the icon took out the clunky look.  <br> <br>Before I do anymore with the stationary, I am trying to get colors I am happy with. I don't want the icon to be too bright, but I also want it to be exciting. As far as the text I Like using the Cool Grey Colors.  <br> <br>Do you all like the design being darker than "Tom Cannon"? I think it helps, but I also realize it may make it off balance. My thinking is that the white "t" aiming to the right may make it ok to have it heavy on the right. <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/17764.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/17765.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/17766.gif" alt=""> <br> <br>-Tom</p>
