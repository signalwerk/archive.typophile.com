    html: <p>Hi Tom, <br> <br>very nice icon. I see the 'C', but does everyone see it? You could always rotate it ccw so that the T is horizontal.  <br> <br>I would cancel the type with the frames. The icon is already strong, don't mess it up with other shapes and blockforms. I would go for clean type that has character. Therefor I agree with Scott. <br>Personally I would not put the text centered under the icon. Perhaps smaller beside the logo. Choose your type carefully but don't let it overshadow the icon. <br>I will look around for a type that I think could fit. <br> <br>Regards, <br>Ren</p>
