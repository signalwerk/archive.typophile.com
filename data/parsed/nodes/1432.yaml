    html: <p>I saw the site and I agree it has 3D very well done. I don't like the look of carrying all the tones of the teal on the side for my design because I need some greys in the icon to tie my text in with the logo. I also think it gives a cool effect to have only color on top and not on the sides.  <br> <br>Below I darkened all the text to the same blue-grey color. The 2 toned text didn't bother me, but I can see your point. With the sides grey (if I keep them grey) it seemed to go with it. Then again, I have looked at it too long! Thanks for your feedback. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/18388.gif" alt=""></p>
