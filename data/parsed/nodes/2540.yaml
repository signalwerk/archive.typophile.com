  html: <p>hi, <br>I was wondering if anyone is aware of David Aaker and his suggested Brand Identity Traps.  <br> <br><a href="http://groups.haas.berkeley.edu/marketing/PAPERS/AAKER/BOOKS/BUILDING/brand_traps.html" target="_blank">http://groups.haas.berkeley.edu/marketing/PAPERS/AAKER/BOOKS/BUILDING/brand_traps.html</a> <br> <br>I am currently writing an essay on the concept of them, and thought it may be of use to me to see what other people's opinions are about them. <br> <br>thanks x</p>
