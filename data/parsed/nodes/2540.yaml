    html: <p>actually all that sounds like common knowledge. I'm sure it would be at least to any marketing student or analyst.  <br> <br>All he's taking about are the four P's  Product, Price, Place, Promotion - and that's a pretty large subject really.  <br> <br>Almost everyone and their kid brother has something along these lines with which they explain their unique idea about what "branding" is.   <br> <br>From a design point of view though...what I'd find interesting might be to include brand phenomenas and study why they happened.  <br> <br>Things like kawaii (the cute-a-fying) of every corporation and product in Japan no matter what the corporation is or does....just make it cute. <br> <br>or Product Cartoons - (Smokey the Bear, Pillsbury Doughboy, Ronald McDonald, Mr Clean, The Green Giant) and what's up with deciding you need a character. <br> <br>or the swoosh-effect or a study on branding to kids and why its awful...Was it Sweden that banned any further advertising geared to children?..I forget. <br> <br> <br></p>
