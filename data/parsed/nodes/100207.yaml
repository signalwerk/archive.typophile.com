      <p>I wish to thank Hrant, for the heads-up, but I think that for the branding of an architectural firm makes more sense, and is also more economical, to license a pre-existing typeface. At least that’s my opinion, I have never done type design on commission, and I generally feel uncomforable about the idea of designing a typeface, albeit derived, on a schedule.</p>
      <p>@filoug: I don’t know how much you care about faithfulness, but Canada Type Semplicita doesn’t represent a faithful adaptation of Semplicità: there are forms – even signature forms – modified and arbitrarily straying from the original alphabet. If you have to choose an existing font family to licence, there would be Durotype Simplo, but some letters are really badly drawn (i.e. the [a], for which it seems they took a single size as a model, possibly a small one, and then redrawn it quite loosely.</p>
      <p>Rather than using either of those, I’d suggest you to look for the qualities you are looking for in a recent design. Kris Sowersby’s <a class="freelinking external" href="http://klim.co.nz/retail-fonts/karbon" rel="nofollow">Karbon</a>, for example, blends very skillfully different influences – Butti’s Semplicità being among them, and is also very well drawn and produced. May be more costly, but always less costly than commissioning a custom typeface. :)</p>
    html_clean: |-
