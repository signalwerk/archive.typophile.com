      <p>Hrant, thanks for pointing me towards <a class="freelinking external" href="http://www.typophile.com/node/79597" rel="nofollow">/node/79597</a> which I had overlooked during my search. Very interesting indeed. I do go with Piccic though and think that commissioning my own font would probably be slightly over the top in my case. </p>
      <p>Piccic, I hate to say it, but faithfulness to the original Semplicità is not on the top of my list of priorities (I'm an architect, not a typographer after all!). I've had a look at Simplo which as you say may be closer to the original; it seems slightly 'over the top' for me though (the [t] for example) - not really that 'simple' as the name suggests? </p>
      <p>Thanks for pointing me towards Karbon which I had not come across before. Looks nicely assembled and as you say well produced, but I really don't like the bold [e] which is too much of a Gill offspring, and the [m] generally doesn't work for me.</p>
      <p>In case I end up with Canada Type's Semplicita, what would in your eyes be a good complementary <em>serif</em> text font?</p>
