  html: |-
    <p>Dear Typophiles, I'm in the process of setting up my own architectural firm and contemplating about using Canada Type's Semplicita for the logo - and potentially for more. I'm intrigued by its combination of Futura geometry and the humanist shapes - somehow sits well with my ideals of modern Architecture, rooted in the modernist era of the early 20th century but less rigid and ideological.</p>
    <p>Having said that, I'm less sure about suitability of Semplicita as a text font, say for brochures, letters, certificates and the like. Any comments on that? And if not suitable in your eyes, what would a good complementary sans serif text font be?</p>
  html_clean: |-
