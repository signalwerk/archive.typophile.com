      <p>Any sans will have trouble carrying a lot of text. However one thing that helps Semplicità here is its modest x-height, since ascenders contribute a lot to immersive reading. So: you could do worse! But if you're set on using a sans, and must deliver a lot of text, do also consider Legato - see the last entry here:<br>
      <a href="http://typographica.org/on-typography/our-favorite-typefaces-of-2004/" title="http://typographica.org/on-typography/our-favorite-typefaces-of-2004/">http://typographica.org/on-typography/our-favorite-typefaces-of-2004/</a></p>
      <p>What would be ideal is if you could commission a large–x-height version of Semplicità for uses besides running text. If you could come up with a budget for that, there are a number of people here who could do that for you, including Claudio Piccinini*... and yours truly**.  :-)</p>
      <p>* <a href="http://www.typophile.com/user/1316" title="http://www.typophile.com/user/1316">http://www.typophile.com/user/1316</a></p>
