    html: |-
      <p>&gt; you’ve got a choice of whether to go more ’dazzling’ with the ball terminals, or calmer with the half balls</p>
      <p>Oh, but he doesn't have to choose — both can exist via stylistic alternates. Well, I guess he does have to decide on the default. But including both makes this a very versatile face. </p>
      <p>I think the main decision to make is whether this should pretend to be a text face. I would avoid that. Didones only succeed in text if they have <a href="http://www.fontshop.com/fonts/singles/itc/itc_bodoni_six_std_book/">significantly less contrast</a>, and extreme contrast (along with its stylized terminals) is key to Squidot's charm.</p>
    html_clean: |-
