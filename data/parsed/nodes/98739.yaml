    html: |-
      <p>I'm not especially fond of it myself, if truth be told.  As my first ever typeface, it's hardly a surprise if it's less than stellar.  Of the three fonts that I've designed over the past few years for computer UI text, this is IMHO the weakest.  </p>
      <p>But I've got people relying on it now, so I keep trying to polish it into something halfway respectable...</p>
      <p>At one point I tried creating a less blocky-looking counterpart, more in the grotesque style, called Workplace Gothic.  It was never really finished.  However, I've just dusted it off and am starting to put it through a serious overhaul.  Maybe it'll be fit for the light of day eventually.</p>
