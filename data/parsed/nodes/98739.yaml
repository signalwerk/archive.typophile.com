      <p>@J. Tillman: Which ligatures in particular? </p>
      <p>@eliason: In running text, or just taken by themselves?  I don't have a great deal of scope to widen them and still stay true to the original model; in fact, I seem to recall trying them fractionally wider at one point, but that caused them to rasterize too wide at 9 point.  (No ability to do manual hinting, alas.)</p>
