      <p>I'm attaching some comps in black and white, as requested. I tweaked the kerning somewhat, and I think (?) it helps the counters. Looking now, I think both the es's need to go smaller - or the ee's bigger?</p>
      <p>Eben - I wish I'd designed the letters!  The font is called Londonderry; but it's a knock off of a font I can't afford right now called Canterbury Old Style - one of my favorite fonts. </p>
      <p>Bram - As far as defending the non-profit angle, I guess my thoughts are that I want to APPEAL to them - not BE a non-profit.  I want the director of a women's shelter to visit the website and think "wow, I never thought we could afford this design firm. I can't believe they offer a sliding scale."  I don't want to project religion, organic superiority, grassroot-iness, corporate slicksters or clip art hell.  So what I see is arty elegance; it's what can be done on a budget.  Black and white infrared photos on taupe fibery paper with reserved text, as opposed to leaf and handshake clipart on high gloss with bullets and comic sans.  Mostly, I don't want that kind of clientel; I want to offer professional design to nonprofits that know they'll benefit from it - not spend hours trying to convince some shmoe why NOT to use WordArt to warp their logo into a arch to fit in a rainbow.  I want the logo to say arty, I guess, because that's my target market.  I guess I want WordArt rainbow guy to think it's pretentious :)</p>
      <p>I seem to be rambling. </p>
      <p>Alaskan</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/zenapse_comp_4635.jpg"></div><p></p>
