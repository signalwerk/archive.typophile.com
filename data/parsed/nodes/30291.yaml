      <p>Nicely put 'Alaskan' (E). I can sympathize readily with your reading of what Dan was saying.  It is deplorable and not helpful of descriptive to say weak &amp; femenine at the same time. It's an old trope that's hard to get rid of.</p>
      <p>But I would rephrase what I am guessing Dan probably meant. Somewhere in there he has a point. Your prospective logo is fairly complicated - it pulls in several different stylistic directions with the roccoco text and the techy tree things. It isn't focused. Your cleints will want to see that you can offer focus. What with all the disorganization ( too right about that by the way - too right) of orgs this is not a small issue. This logo looks arty not organized. This logo looks individual not organizational. Looking at this design I would have thought that zenapse was a store that sold candles jewelry and so on. In other words neato-cool clutter. I would nver have guessed it was a design studio geared towards helping 'little guys grow up' and develop a focused professional image and or message. </p>
      <p>Also, the name is ideosyncratic and individual rather that accessable and results oriented. I don't think Alaskans or anybody else will recall this name nearly so quickly as even something utterly rediculous such as 'pink poodle design'. Of course my point isn't that you should name yourself 'pink poodle' per se. You should choose something easy to recall and which resonates in the *right* way. The question is as Bram asks <cite> what are you trying to convey with the design? </cite>.</p>
      <p>I hope this doesn't sound harsh. Re-reading the thread I see that my comments are similar in direction to what jpad &amp; Bram were saying even if they were less direct or more polite. BTW I am an Alaskan too. Feel free to email me off Typophile to chat if you want.</p>
