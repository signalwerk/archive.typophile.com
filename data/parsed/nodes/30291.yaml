      <p>To define why I like the new version better, the phrase 'zen' invokes a less-is-more approach in my mind, and when there is a made up word, it needs little else around it to make it distinct. There is probably some philosophical insight that can be read into using the 3 dots, one of which is natural to the 'i', but I can't quite come up with it. Overall, it looks light, in a goodness/uplifting way.</p>
      <p>If you are using the Adobe apps, I would suggest playing with the inherent (metrics) and calculated (optical) settings, Tim has the right sense on the spacing. And with less graphic froo-froo, that becomes very important.</p>
      <p>Logo aside, about the face: Does anybody else here feel that the lower stroke of the 'g' should flow more smoothly from the bottom left of the circle? Or, that the end of that stroke should point more towards the center again? I haven't seen more of the face than this example, but it seems odd.</p>
