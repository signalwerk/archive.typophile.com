    html: <p>The thing about ORGs is that they are graphically naive as you have deduced. And that means that when they see your web page they are going to assume that you prefer that style to work in ALL the time. Which it sounds like you don't. So I think it might behoove you to build your identity &amp; web pages look around the graphic &amp; editorial values you want to offer them. If it was an ad agency or some kind of other graphically saavy entity you wanted to communicate with you would be freer to represent yourself in a way seprate from the work you want to offer.</p>
