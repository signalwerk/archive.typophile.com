      <p>Before you go back to the drawing board, make sure to define your problem and intent well enough. If done properly, the visual will not be very hard to execute.</p>
      <p>For instance:<br>
      <cite>I want to convey elegance and professionalism; not granola and tie dye.</cite><br>
      There are many kinds of elegance and professionalism. Elegance as in a graceful, refined taste? Or as in a pleasingly ingenious, often humble solution? Professional in a business/corporate sense, or in a masterfully executed project that can be done by everyone?</p>
      <p><cite>I’m thinking yoga culture, not music festival card table marketing. I want to make the little guys look grown up — to appeal to the corporations that they target for fundraising, ideally.</cite><br>
      I love these statements because you moved from the generals (x kind of marketing) to the specifics (yoga culture, not music festival). See if you can find more answers to the question: "Zenapse is x rather than y". The more you have, the better, because it'll eventually help you to see the agency and visualize its identity and personality.</p>
      <p>Of course, if you can justify the current design for Zenapse, I'll have a listen. In my opinion, you got "fashionable/elegance" down. For "non-profit", though, you have to explain it visually to me :-)</p>
      <p>Thanks!</p>
