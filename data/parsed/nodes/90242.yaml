      <p>I'm not sure I understand what you mean, but I'm certain that I wasn't particularly clear myself... If you look at, say <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U1F600.pdf" rel="nofollow">Emoticons</a>, and <a class="freelinking external" href="http://http://www.unicode.org/charts/PDF/U2600.pdf" rel="nofollow">Misc Symbols</a>... If you mean what I think you do, I don't think these tables would need to scaled-down to to facilitate a different orientation. Misc symbols is a 16x16 grid, and prints with enough detail to be referenced.</p>
