    html: <p>The Unicode Standard book is portrait format, so it made sense to organise the charts that way, especially since many writing systems or symbol sets only require a few columns.</p>
    html_clean: <p>The Unicode Standard book is portrait format, so it made sense to organise the charts that way, especially since many writing systems or symbol sets only require a few columns.</p>
