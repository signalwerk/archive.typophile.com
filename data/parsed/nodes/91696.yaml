    html: |-
      <p>Good article, and yes, he's got the gist of it. Typefaces come and go, and really, nothing is 'sacred'. It's just a 'business' after all .... And YET, type designers also know, that's not really true.  Type, as the manifestation of thought in written form, will always be with us. Distribution and 'ease of read' will demand it. </p>
      <p>Resurrecting old 'classic' fonts is now the mainstay of many 'boutique' type houses. Garamond, Times New Roman and/or Palatino have 'morphed' into numerous 'alternates' to many to mention. However, in my instance, the data matix is the SAME from 'knock-off' derivative to 'knock-off' derivative. Both E&amp;F and URW++ used the SAME matrix. They weren't creating visual 'alternatives' as such. Rather, they both capitalized on the capabilities of Peter Karow's IKARUS system. URW++ more so then E&amp;F. As example, 'Lindsay Outline' (URW++) is nothing more than an OUTLINE of the original face, yet URW was selling it as a 'stand alone' font. The proceeds of which I never saw. Rosenfeld would not 'recognize' the 'variants' as my design - which remains HOGWASH. Why then did he keep calling the faces 'Lindsay'????? He can hardly call himself 'the designer'.</p>
      <p>Today, in my opinion, there is far more worth to an artist, long term, to retain full copyright control of their own efforts. In Canada, copyright law protects an artists' artwork up until 50 years after the life of the artist, after that it falls ' into the 'public domain'.  When dealing in 'digital data', the time line is much much shorter, and also much trickier to 'govern'. As soon as 'data' is created, new legal frameworks apply, like 'patents' and 'national legislation', that no longer protect the interests or copyright of the original artist. (So, READ those CONTRACTS very very carefully. Understand what you are giving up to get  ... ) </p>
      <p>In my instance, it's not so much that the businesses were 'in the right'. None were. They just USED the data, with little consideration for the original designer. If I hadn't  'called them out' about it after finding out about the numerous digital 'Lindsay' faces, they would all be merrily producing a multitudes of 'variants' and profiting from them, without a cent to me. Does that seem Fair or Right to you?  As it is, the  'principals' know FULL WELL that they all side-stepped GOOD PRACTICE in the name of an opportunistic quick buck. The 'Lindsay' data had already been in the marketplace for a number of years before I found out about it. Thus, I was essentially forced into 'Agreements' with E&amp;F and URW++ to protect my remaining interests. As it is,  if the digital data hadn't been globally released, it is very unlikely that I would have established a 'business' connection with E&amp;F and, most definitely, I'd NEVER do business with URW++. EVER.</p>
      <p>Ergo, Let the Record Show ....</p>
