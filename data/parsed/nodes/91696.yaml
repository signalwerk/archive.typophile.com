    <p>It is with some sadness that I feel compelled to post this story today, but truly, in the name of the illustrious history of type design throughout the centuries, this 'story' MUST be told.  Many of the personal names and businesses will be VERY familiar to the current type community.  </p>
    <p>Today, April 2, 2012,  I discovered, quite by accident, yet ANOTHER 'knock-off' by URW++ of my original typeface design, 'Lindsay'.  This time the face has been renamed 'Lindsay Becker' and is readily available as a 'free True Type download' over the net, copyrighted to URW++ circa 1999.  The matrix is the SAME as the ORIGINAL digitized font of the early 1980's, and the audacity of using my name AGAIN in the font title is - well, this, for me -  is THE LAST STRAW.  </p>
    <p>Type historian &amp; archivist, Luc Devroye now has a copy of my extensive 30 year 'History of the Lindsay Typeface'  stored on his servers.  The facts and documents are all there for those who wish to know WHAT happened, WHEN it happened, WHY it happened, and with WHOM it happened. You will be shocked by the antics of some of today's 'respected' players ... </p>
    <p>I post this now as a necessary &amp; vital contribution to those interested in the lumpy history of the digitization of type. </p>
    <p>It all started, long long ago, at Letraset  ...  <a href="http://luc.devroye.org/lindsay.html" title="http://luc.devroye.org/lindsay.html">http://luc.devroye.org/lindsay.html</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/'Lindsay' Dry Transfer  with Letraset, 1980_5025.JPG"></div><p></p>
