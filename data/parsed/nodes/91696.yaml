      <p>You don't have to dig it up, I'm just curious. I wonder what will happen to digital fonts designers released today 20 years from now. Even 40 years from now. Or more. (And in some cases, less.)</p>
      <p>This paints a sad story of what might possibly happen for fonts, and their designers. <a href="http://www.hyphenpress.co.uk/journal/2006/09/26/classic_types" rel="nofollow">An article</a> by Fred Smeijers seems to also paint a somewhat similar picture, though with a bit less arrogance and impudence. (&amp; it's fictional.) Yet all of the businesses involved in your case seem to think they are in the right.</p>
