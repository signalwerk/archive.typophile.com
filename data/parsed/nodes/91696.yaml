      <p>In this instance, transferring a pencil-drawn face to rubyliths for the dry-transfer market (as Letraset did in 1980), and then using both those same drawings &amp; the rubylith as 'style' templates to demonstrate the capabilities of IKARUS, (as Letraset &amp; URW did), remains, I believe somewhat unique. That the new type 'data' then mysteriously migrated beyond the boundaries of Letraset - without my knowledge or consent - remains one of the main 'unresolved' issues of this mess. Both E&amp;F &amp; URW++ have claimed, over the years, that they had Letraset's permission  to reproduce &amp; market this face, and yet, Letraset repeatedly denies ever giving permission to either business, specifically for the use of 'Lindsay'. Letraset insist there is not, and has never been, any written 'contract'. </p>
      <p>Yet, and even so, E&amp;F and URW created &amp; marketed multiple versions of the face before I caught up to them just over two decades ago. Since then, E&amp;F have, in the main, honored a NEW Licensing Agreement established between us. As for URW++, I am posting this today because of their apparent on-going impudence &amp; arrogance. They seemingly released 'Lindsay Becker' very near the time when we were negotiating our initial Agreement. They certainly never told me about it, before or after, (as per their other now-known five  'knock-off' variants, also all discovered 'after the fact'.)  I only discovered 'Lindsay Becker' today, copyrighted to URW++ in 1999. - - Imagine that! I just never knew.</p>
      <p>Ergo, it really is time to - Let The Record Show </p>
      <p>I would have to double check the catalogue &amp; my notes to determine who Fontshop licensed from.  That entire material, in bulk, is now 'in storage'.  If you really must know, please do let me know, and I'll dig it up.</p>
