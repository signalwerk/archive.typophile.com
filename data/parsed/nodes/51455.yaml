    <p>Hi,<br>
    The PANOSE System?<br>
    Is Panose a necessity?<br>
    What implications are there for using it well and not using it properly?<br>
    A lot of the various selectable terms seem pretty general.<br>
    I'd love to hear from anyone here on this topic.<br>
    I've searched here but got generalized usage of the word.<br>
    Have been to <a href="http://www.panose.com" title="www.panose.com">www.panose.com</a> and understand what it is, but is it a necessity?<br>
    Is it up to me to select whether a font is one thing and not another, when some of the terminology break-ups are close in meaning to another word in the list. (I know some are distinct but some seem not that different)<br>
    Does getting PANOSE right matter? Does using it?</p>
    <p>Any thoughts?<br>
    Cheers In Advance<br>
    Drj</p>
