    <p>This morning I was sorting through some photos and came across this shot of the gate at Friedrich Neugebauer's house in Austria. Pretty cool, eh? He and Edith designed their house and built most of it themselves in the 50s and early 60s, and kept adding on as they had more kids -- 6 boys in all! The house is in a little farming neighborhood on the side of a mountain, above the village of Bad Goisern, in the Salzkammergut ("Sound of Music" country) of Austria.</p>
    <p>Friedrich never told me exactly when he designed this but I'm guessing it's from the 60s. He had a local welder make it up for them, and bartering something for it, i'm sure. The left side says NEUGE and the right BAUER, with the initials of their first names up on top along with the cross.</p>
    <p>(This was one of those rare times when it actually helps for on-camera flash to make the foreground brighter than the background, thus separating the metalwork from everything behind it.)</p><div class="imageWrap"><img src="http://typophile.com/files/neugebauer_gate_4086.jpg"></div><p></p>
