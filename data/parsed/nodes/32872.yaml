    html: "<p>Well you aren't far off the mark: Friedrich studied with Rudolf von Larisch in Vienna in the late 1920s/early 1930s, and RvL had been very much involved with that whole scene. Larisch taught in several important schools in the first three decades of the 20th c. and designed for the Wiener Werkstätte. He had his students make letters out of hammered metal, neon, etc. and there was always a very high emphasis on craft as well as design.</p>"
