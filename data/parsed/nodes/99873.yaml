    <p>Hey people, this is "my" (well not really mine, it's just a vectorization) first font! </p>
    <p>I decided to revive this after I saw some sketches of the 'universal alphabet' and discovered the digital versions were just cleaned versions of his wood-type printings... but as they were tests they had small imperfections (like bad curves etc) that when vectorized and look worse when we use them on bigger sizes.</p>
    <p>Here's the three wheights I made based on his prints (only the A, full character set on PDF):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/a wheight comparison_6014.jpg"></div><p></p>
    <p>Ah! I'm making this inspired by the old Multiple Masters technology so I used the same number of nodes in all characters so they are blendable to make an infinite number of wheights! No numbers yet.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/blend_6535.jpg"></div><p></p>
    <p>I don't really know if this is releasable/sellable but the most important thing is the knowledge I've acquired during the process and the perfect preservation of the letterforms digitally!</p>
    <p>Also, on the grid studies I used auto-trace on very high-res pictures I scanned and compared to my version!</p>
    <p>Please, guys, criticize specially the lighter wheights on the PDF attachment (I forgot the W but it's just an upside-down M in this haha)</p>
