      <blockquote><p>When I hear "ultra-accurate revival", I have to worry... :-)</p></blockquote>
      <p>I know what you mean and agree completely. I just decided to post this here because of what I can't see as a begginner! I don't have an 'ultra accurate revival'... yet :) so I wanted to know what do typographers think about it, because knowing different points of view is always better than working alone... In GRID STUDIES file I tried to 'retrace' the original grid from sketches of a pre-universal font featured on Ellen Lupton's 'ABCs of Bauhaus'. They fitted well (please, open the PDF with adobe reader so you can see the guidelines and the grid), his prints are on the right.</p>
      <blockquote><p>A more practical problem though is that you're trying to revive something that was constructed geometrically, with no apparent regard for some necessary subtleties. </p></blockquote>
      <p>Yes, that's a problem I've encountered already: commas and most of accents looking too heavy, dots too small, all curves appear to float a bit on the baseline on smaller sizes, 'e' and 's' too dark... Although those problems get very minimal on large display sizes &gt;48pt.</p>
      <blockquote><p>Although then I would have to ask: what's with these multiple weights?</p></blockquote>
      <p>Well I had that idea because it was easier to create the 'middle' wheight (I had drawn just the Bold and Light ones) but it appears to be useful as 'adding' things would make this more useful too and wouldn't 'change' the faithfullness! Like the italics of garamond we have today, they were added but the original romans are there more or less intact! For reference the 'Blippo Black-style S' was added by me because it produces a more even color when printing, though, it's only an alternate, the original parts won't have any alteration! (I've made another e that is better on text too but forgot to include it here).</p>
      <blockquote><p>As for distributing such fonts: I'm pretty sure you're OK. Unless maybe Bayer's estate made an exclusivity deal with The Foundry*.</p></blockquote>
      <p>I'm going to contact them after I finish this, as they've authorized this set in 1997:<br>
      <a href="http://www.myfonts.com/fonts/p22/bayer-universal/" title="http://www.myfonts.com/fonts/p22/bayer-universal/">http://www.myfonts.com/fonts/p22/bayer-universal/</a></p>
      <p>Though it falls into what I mentioned previously: wonky outlines because it's a vectorization of the wood type prints...</p>
      <blockquote><p>* See for example: <a href="http://en.wikipedia.org/wiki/Architype_Bayer" title="http://en.wikipedia.org/wiki/Architype_Bayer">http://en.wikipedia.org/wiki/Architype_Bayer</a></p></blockquote>
      <p>I know that! Where did you think I've got inspiration for that &amp; from? ...shssh!</p>
      <p>Thanks for your comments, Hrant :D</p>
