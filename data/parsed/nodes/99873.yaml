      <p>When I hear "ultra-accurate revival", I have to worry... :-)  So many things have changed since then (like paper quality) that to me at least it's impossible to have enough faith in such a process.</p>
      <p>A more practical problem though is that you're trying to revive something that was constructed geometrically, with no apparent regard for some necessary subtleties. Quick examples: vertical elements should be thicker than horizontal ones (to appear the same), curves need to be thicker than straights (to appear the same), curves need to overshoot the guidelines (otherwise they look shorter)... All kinds of stuff like that, which makes or breaks a font in terms of usability.</p>
      <p>Now, if the whole point is to play séance :-) with Bayer I guess you're doing fine. Although then I would have to ask: what's with these multiple weights?</p>
      <p>As for distributing such fonts: I'm pretty sure you're OK. Unless maybe Bayer's estate made an exclusivity deal with The Foundry*. But I doubt it.</p>
      <p>* See for example: <a href="http://en.wikipedia.org/wiki/Architype_Bayer" title="http://en.wikipedia.org/wiki/Architype_Bayer">http://en.wikipedia.org/wiki/Architype_Bayer</a></p>
      <p>hhp</p>
