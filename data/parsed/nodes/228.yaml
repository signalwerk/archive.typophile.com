    date: 2003-06-12T05:33:00
    votes: null
    html: "<p>Tracy, LOL <br> <br>Hey, this thread is spicing up unexpectedly after being  <br>dormant for, like, what? Two weeks? I think this discussion  <br>is somewhat irrelevant, as you can't argue about taste. <br>I still think DJ Anzai's entry made truckloads of sense. <br> <br>Arguments about the intrinsic artistic qualities of type designs  <br>only go as far as till you reach the point where personal  <br>taste comes into play. <i>De gustibus et coloribus</i> yadda yadda... <br> <br>Jay, if you like Helvetica: good for you. Tracy, if you  <br>dislike Helvetica, good for you too. If everybody liked the  <br>same typeface, there'd be only one, and that'd make me  <br>very unhappy (err... actually... let me think. In that case  <br>I would also only like that same typeface, so I wouldn't  <br>know any better. Which means I would <i>not</i> be unhappy,  <br>on the contrary! Ouch, head hurtz... ;) ) <br> <br>Let me finish my entry with two quotes which had a profound  <br>influence on my practice as a [typo]graphic designer: <br> <br><b>One can make a beautiful design with an ugly typeface.</b> <br>Wolfgang Weingart <br> <br><b>There are no bad typefaces, only bad typographers.</b> <br>Mr. Jeffrey Keedy <br> <br> <br>There <i>is</i> a point to be made about Comic Sans, though... =D</p>"
