    html: <p>I live in Washington DC and the local ABC television station uses Comic Sans as the typeface for their weather report graphics! Big huge maps of the U.S. with goofy, pathetic Comic Sans spelling out "RAIN" "LOW PRESSURE ZONE," the temperatures, etc. As bad as the letters look, I think the numbers look even worse. They superimpose giant numbers next to the weatherman to indicate "today's high temperature" and it looks like Comic Sans figures that are about nine feet high. Truly awful. It looks like psychotic children have taken over the place!</p>
