    html: <p>$250 package of Neue Helvetica will have 51 variations in weight and width, from narrow to extended. Unlike Helvetica, Neue Helvetica family has consistent design throughout. Helvetica had been copied and redesigned and over and over again so that it doesn't really have consistent style anymore. For example, Helvetica will probably come with Helvetica Narrow, but the design of Helvetica Narrow should really be considered different font...  <br> <br>I'm really an anti-Helvetica and anti-swiss style, but if I have to use Helvetica, I use Neue, because its elegant and refined design shows that the I care about choice of typography, and I didn't just pick Helvetica because it came with your mac. </p>
