    html: <p>Huh, I'd missed this. <br>You'll find short snippets dealing with this in various type books (like Doyald Young's "Fonts &amp; Logos"), but the one book I've found that has the most amount of juiciest stuff is "Perception and Imaging" by Richard Zakia. That's where I first learned about notan, among other things. <br> <br>hhp <br></p>
