      <p>Thanks for the feedback and suggestions. I don't know much about FontLab as you can tell, however, I have some problems with your solution.</p>
      <p>For comparison I have included two screenshots:<br>
      One from the S glyph after opening the original font (Klavika) in fontlab,<br>
      and the other from the same glyph after being outlined in illustrator and then imported into FontLab.</p>
      <p>As you can see; they both have superflous points, and none of them have points on the extremes marked by Nick (thanks for the shown example, no disrespect).<br>
      However, the points are not placed on the exact same spot. I agree that this is part of the problem, but it's not all.</p>
      <p>As mentioned above:<br>
      I made it work by opening a system font I had, and putting my vektor graphics (the logo) into one of the glyphs in the font, and then generating a postscript font. There's only some problems on the far left side of the glyph e and d, where there are two points close to eachother.</p>
      <p>And if you look at the two pictures on my first post in this topic, there has to be something more than the placement of the points for it to be that messed up.</p>
      <p><a href="http://www.viktig.no/temp/Logo.jpg" rel="nofollow">Logo</a><br>
      <a href="http://www.viktig.no/temp/OriginalFont.jpg" rel="nofollow">Original Font</a></p>
      <p>PS Nick, how do you attach images for instant view on a reply?</p>
