    html: |-
      <p>The differences between the two examples you show are utterly immaterial, because neither of them is correct Postscript, and <em>that's</em> your problem. The laws of Postscript are not as immutable as, say, the laws of physics, but, if you break them, they carry a penalty. In this case, lack of points at the extremes causes lousy output; non-smooth connections which should be smooth cause lousy output; unnecessary points can cause lousy output.</p>
      <p>If you came to this forum for advice, it would be in your best interests to TAKE THE FREAKING ADVICE, instead of arguing with it ... unless, of course, you would rather <strong>be right</strong> (at least in your own mind) than <strong>get it right</strong>. And, right below the box in which you type your comments, there's a single line of blue type which says "Insert image"...much easier than inserting a link to an image residing on a remote website.</p>
