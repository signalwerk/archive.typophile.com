    <p>Hi, I am trying to create a font for a client with the logo in it, so they can use the logo in applications that dont support eps/pdf. I have pasted the logo into a letter in fontlab, and everything looks great. But when I try to use the font (insert the logo into an application by typing the letter) the outlines look all jagged. I have attached a screenshot from fontlab and a screenshot from an application after the logo has been inserted.</p>
    <p>Any suggestions to make the logo appear as it should would be appreciated.</p>
    <p>Oystein</p>
