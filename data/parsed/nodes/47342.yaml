    <p>I guess <a href="https://web.archive.org/web/20080907172005/http://www.fontshop.be/details.php?entry=309">this Unzipped post</a> <strong>has</strong> to be shared!<br>
    <a href="https://web.archive.org/web/20080907172005/http://www.fontshop.be/details.php?entry=309" title="http://www.fontshop.be/details.php?entry=309">http://www.fontshop.be/details.php?entry=309</a></p>
    <p><cite>… the Belgian/Dutch FontShop franchise that is spearheading cutting-edge typographic research. We are proud to present to you revolutionary innovations in inflatable, wet, adhesive and edible type, and invite you to discover… FontPool.</cite></p>
    <p><a href="https://web.archive.org/web/20080907172005/http://www.fontshop.be/details.php?entry=309"></a></p><div class="imageWrap"><a href="https://web.archive.org/web/20080907172005/http://www.fontshop.be/details.php?entry=309"><img src="/web/20080907172005im_/http://typophile.com/files/A6ZRW4UJ_4055.jpg"></a></div><p></p>
    <p><cite>The FontPool concept has been thoroughly tested according to the most demanding scientific requisites – through empirical research which produced measurable and repeatable results. Both female and male test subjects were used, ranging from one to eleven years old – a representative cross section of the juvenile population. What follows is a photographic – dare we add ‘historic’? – document of FontPool. <a href="https://web.archive.org/web/20080907172005/http://www.fontshop.be/details.php?entry=309">Enjoy!</a> </cite></p>
