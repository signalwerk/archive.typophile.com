  - id: 32321
    user: 1250
    date: 2004-04-29T15:47:00
    date_raw: 29 Apr 2004 — 3:47pm
    votes: null
    html: <p>This is great stuff. And why wouldn't it work for text? You might not set a book in it, but if people use HELVETICA for text why would they balk at <i>this</i>? The half-serifs are great, and very nicely counter-balanced so it doesn't look like it's leaning backwards. And I actually like the flat stem bottoms - it gives a nice contrast and makes the design more "progressive". <br> <br>Your x-height is modest (which means large point size usage), but your color is darkish and your spacing a bit loose (both better for smaller sizes). It's hard to say which direction would be better. We don't have enough evocative fonts suitable for small sizes (here I mean about 9 point), so if you pull the extenders [back] in it might make this a more valuable contribution to type, I think. <br> <br>Whatever direction you go though, plesae take this all the way. <br> <br>hhp <br></p>
    html_clean: <p>This is great stuff. And why wouldn't it work for text? You might not set a book in it, but if people use HELVETICA for text why would they balk at <i>this</i>? The half-serifs are great, and very nicely counter-balanced so it doesn't look like it's leaning backwards. And I actually like the flat stem bottoms - it gives a nice contrast and makes the design more "progressive". <br> <br>Your x-height is modest (which means large point size usage), but your color is darkish and your spacing a bit loose (both better for smaller sizes). It's hard to say which direction would be better. We don't have enough evocative fonts suitable for small sizes (here I mean about 9 point), so if you pull the extenders [back] in it might make this a more valuable contribution to type, I think. <br> <br>Whatever direction you go though, plesae take this all the way. <br> <br>hhp <br></p>
