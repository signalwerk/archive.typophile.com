  - id: 32332
    user: 1250
    date: 2004-05-10T14:54:00
    date_raw: 10 May 2004 — 2:54pm
    votes: null
    html: "<p>&gt; I tried it with a lighter version <br> <br>Did you try it on a laser printer? Their lower resolution reduces differences (compared to imagesetter output). But if the font is meant for lasers, then that's the best test, yes. <br> <br>Interpolation: are you using FontLab? It's in the manual. But Fontographer can do it too. The main trick is to make sure the structure of the curves (number/type of points, curve direction) is identical between the two extremes. <br> <br>Your \"e\"s: there seems to be a difference in behavior on the inside of the lower stroke. Also, I'd make the horizontal bar flare more, not less, the greater the weight. <br> <br>Lastly: darker forms have to be taller to appear the same height. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; I tried it with a lighter version <br> <br>Did you try it on a laser printer? Their lower resolution reduces differences (compared to imagesetter output). But if the font is meant for lasers, then that's the best test, yes. <br> <br>Interpolation: are you using FontLab? It's in the manual. But Fontographer can do it too. The main trick is to make sure the structure of the curves (number/type of points, curve direction) is identical between the two extremes. <br> <br>Your \"e\"s: there seems to be a difference in behavior on the inside of the lower stroke. Also, I'd make the horizontal bar flare more, not less, the greater the weight. <br> <br>Lastly: darker forms have to be taller to appear the same height. <br> <br>hhp <br></p>"
