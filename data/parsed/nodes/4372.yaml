  - id: 32323
    user: 1250
    date: 2004-05-01T08:43:00
    date_raw: 1 May 2004 — 8:43am
    votes: null
    html: "<p>Cool. <br>I think this is getting pretty interesting - you've put a lot of \"expression\" which is great for small sizes, but you have some stylistic mixing too, so it's not boring. That acute accent is killer! <br> <br>Some suggestions: <br>- A slightly wider \"a\". <br>- Bigger eye in the \"e\". <br>- The \"f\" might be slightly too expressive. <br>- What do the \"f\"-\"i\" and \"f\"-el (non-ligated) sequences look like? <br>- I'd give the lower arm of the \"k\" a non-flat terminal. <br>- Maybe a stronger bar on the \"t\" (and maybe the \"f\" as well). <br>- The question mark could be more in character. <br>- I like smallish capitals, but for small point sizes I think it will backfire, especially in your classically-narrow letters like \"E\". What you can do is make them all wider. <br>- The numerals you have look nice, but too small. Try hybrid numerals. <br>- Judging form the last line (the rest are justified so I can't tell), I think your blank space needs to be a hair wider. <br> <br>hhp <br></p>"
    html_clean: "<p>Cool. <br>I think this is getting pretty interesting - you've put a lot of \"expression\" which is great for small sizes, but you have some stylistic mixing too, so it's not boring. That acute accent is killer! <br> <br>Some suggestions: <br>- A slightly wider \"a\". <br>- Bigger eye in the \"e\". <br>- The \"f\" might be slightly too expressive. <br>- What do the \"f\"-\"i\" and \"f\"-el (non-ligated) sequences look like? <br>- I'd give the lower arm of the \"k\" a non-flat terminal. <br>- Maybe a stronger bar on the \"t\" (and maybe the \"f\" as well). <br>- The question mark could be more in character. <br>- I like smallish capitals, but for small point sizes I think it will backfire, especially in your classically-narrow letters like \"E\". What you can do is make them all wider. <br>- The numerals you have look nice, but too small. Try hybrid numerals. <br>- Judging form the last line (the rest are justified so I can't tell), I think your blank space needs to be a hair wider. <br> <br>hhp <br></p>"
  - id: 32324
    user: 3307
    date: 2004-05-02T15:49:00
    date_raw: 2 May 2004 — 3:49pm
    votes: null
    html: |-
      <p>I made the capitals slightly bigger and increased the extenders a very little. The 'f' is a difficult story: on the pdf it is non-ligated. It has so much overlap that it swallows the dot on the 'i' and merges with the extender of the 'l'. I intended that in the beginning, but I'm not sure if I want that effect to happen all the time. for example 'f' 'i-accute' is where this goes wrong.  <br> <br><img src="http://www.typophile.com/forums/messages/29/34912.jpg" alt=""> <br> <br>Adapted the 'a' , 'e', '?' , 'space' and made the bar on the 't' wider. <br> <br>The hybrid numeralrs are bulls eye! A realy great concept. <br> <br>I know that it's far from perfect at the moment. Most weights and curves and forms have yet to be corrected, but after this weekends work this is status quo. <br> <br></p>
