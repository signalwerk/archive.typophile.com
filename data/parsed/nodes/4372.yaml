    html: "<p>ROMAN: <br>lc: All good, except the \"o\" and \"s\" are too narrow. <br>UC: I like the classical widths. You might make the \"L\" slightly wider. My only \"global\" complaint is that the waist (like in \"A\" and \"H\") is a bit too high. <br>Numerals: those mild hybrids are super. <br>Accents: Nice nice! I'd give the ring stroke contrast though. <br>Other: The percent/mille is too \"geo\". The \"@\" sign is really nice. The BP is too big, no? The bar thickness in the \"AE\" has to be resolved. I'd close up the double-quotes. <br> <br>The Italic looks charming, although the \"k\" (especially) and \"f\" seem distracting. <br> <br>The Bold's spacing is too tight (still assuming your color and proportions imply smaller sizes). <br> <br>hhp <br></p>"
