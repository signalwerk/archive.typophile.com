    html: |-
      <p>One of two things normally happens:</p>
      <p>1. The vertical beam of the ɑ is retained, so there’s a vertical stroke between the ɑ and the e, or the curvature of the ɑ is made uneven, so it closes up towards the top right corner, rather than being properly circular (if that explanation makes sense). But they do end up looking rather similar. (Avant Garde uses the former way, fonts like Ayuthara—first one in my list of fonts that applies—do it the second way)</p>
      <p>2. The ɑ is replaced by a two-storey a. (Futura does this)</p>
      <p>Example:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/aeoe_6584.png"></div><p></p>
