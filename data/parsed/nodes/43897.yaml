    html: |-
      <p>That sounds very odd to me.</p>
      <p>In handwriting, yes, æ is usually written very similar to œ (or rather, almost exactly like ce in joined-up writing). But I’ve never seen anyone confuse æ with œ in type. A classmate of mine who bought her computer in the US could never figure out how to type æ on her US keyboard layout, so she consistently used œ instead, but even though it was legible, everybody noticed that it looked wrong, and it slowed down reading.</p>
      <p>That a newspaper could actually mix them up sounds completely bizarre and absurd to me.</p>
