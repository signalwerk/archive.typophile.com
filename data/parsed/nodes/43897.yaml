      <p><cite>«How frequent are ‘Æ’ in ‘Œ’ in French, Danish and Norwegian?»</cite></p>
      <p>Since œ in French has already been dealt with by native French-speakers, I’ll speak only of æ in Danish and Norwegian (and also in Icelandic and Faeroese—or should that be Færœse? :-P).</p>
      <p>Æ is very common in Danish and, unlike in French, it is not thought of as an actual combination of the letters a and e in the minds of the common Dane. Whereas a French person might easily type <em>oeuvre</em>, rather than <em>œuvre</em>, without really considering it ‘un-French’, no Dane would ever type ae, but always æ. The letter is about as common as ä is in German, perhaps slightly less so, since umlauts are more common in German than in Danish. As in German, æ is pronounced as [ɛ] in Danish (and Swedish, where it’s a bit more open).</p>
      <p>In Norwegian, æ is less common than in Danish; many words where Danish uses æ (and German and Swedish use ä), Norwegian uses e instead: D <em>æbler</em>, S <em>äpplen</em>, G <em>Äpfeln</em>, but N <em>epler</em> (‘apples’). It’s pronounced [æ] in Norwegian.</p>
      <p>In Icelandic and Faeroese, it’s even less common. In Faeroese, where it’s pronounced [æ] as in Norwegian, it’s used in a number of very common words where it’s a very strange development of an old Germanic i or Scandinavian é, such as F <em>mær, tær</em>, I <em>mér, þér</em>, G <em>mir, dir</em> (dative of ‘me, thou’), but apart from that, its usage is similar to Icelandic, where it’s only used as old i-umlauts of Old Norse a and is not that common. In Icelandic, it’s pronounced [ai], a diphthong.</p>
      <p>&nbsp;</p>
      <p>As for the digraphs themselves, I’ve never liked the uppercase Œ, either. In some fonts, they manage to get away with it and make it look sort of harmonic. The <em>Cardinal Léger</em> text above is a good example of that. But most commonly, it just looks like the poor O has had its skin pulled too taut, making it all warped stretched. Not pretty. I’ve never read it as a CE, though. More commonly (due to sheer ingrained habit, I suppose), I’ll instinctively read it as an æ instead, so <em>œufs</em> becomes <em>æufs</em>, which in turn becomes complete nonsense in my head and makes me stumble in reading.</p>
    html_clean: |-
