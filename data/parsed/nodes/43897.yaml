      <p>Well, Scandinavian languages don't use œ (you might be thinking of ø or ö). French is the only prominent modern language I can think of that uses œ, as in your example <em>œuf</em>.</p>
      <p>I have no problems with the lowercase œ, but the designs of the uppercase Œ often do bother me, and I sometimes wonder if a form where an O with minimal optical distortion just touches E might work better at least for those who don't use this grapheme* on a daily basis. But we will also have to consult native French speakers on this one.</p>
      <p>* I use <em>digraph</em> to mean a two-letter combination used for writing a single sound, such as <em>th</em> and <em>ng</em> in <em>thing</em>.</p>
