    html: |-
      <p><cite>the latter just seems an odd, misplaced Frenchification more likely to cause confusion than anything.</cite></p>
      <p>The more I look the more I am puzzled. </p>
      <p>I downloaded the two Mozilla French dictionaries from <a href="https://addons.mozilla.org/en-US/thunderbird/browse/type:3" title="https://addons.mozilla.org/en-US/thunderbird/browse/type:3">https://addons.mozilla.org/en-US/thunderbird/browse/type:3</a>. The files have extension .xpi and you just unzip them to get the dictionaries, that are good old-style plain text ISO8859-15 (latin9) encoded files (one word per line); fr-FR.dic (82000 entries) would be the "pre 1990" version and  fr.dic (1990 reform, 90 000 entries) would to be the most "modern" one.  Instead of utf-8 re-encoding, I just used a unix window (on my mac) with "Window Settings &gt; Display,  Character Set Encoding &gt; Western (ISO Latin 9)" and kept the files as is to better see the bugs. </p>
      <p>I first looked at all proper names containing "oe" or "œ" in fr-FR.dic. Here is the command (I had to make a screen grab)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/egrep_6474.jpg"></div><p></p>
      <p>and I got on the output the following list (one entry per line):</p>
      <p>&nbsp;&nbsp;Coelho, Defoe, Goethe, Groenland, Hoegaerden, Hoeilaart, Koekelberg, Loewner, Noether, Oedipe/LM, OEM, Oersted/M, Piedbœuf, Schoenberg, Toeplitz, Westhoek.</p>
      <p>This proves that in foreign names, even if "oe" is not pronounced as two separate letters, French will use "oe" if necessary, and not "œ". The entry "Oedipe" looks however erroneous and the fact that Oersted is not written "Œrsted" may unfortunately be explained by... a bug.</p>
      <p>Indeed, if I look more carefully at the file fr-FR.dic (if I search for "rsted"), I realize that the character "Œ" was ill encoded; it was encoded twice 0xBE (for "Œrsted" and "Œdipe") and twice 0x8C (for "d'Œrsted" and "d'Œdipe"), instead of 0xBC. The entries "Oedipe" and "Oersted" might just be...  a patch?</p>
      <p>If I compare fr-FR.dic with fr.dic, I see that the entry "œrsted" (for the physical unit) has become "oersted", which seems to be reasonable but, on the other hand, many other "œ" are now "oe" in fr.dic, for unknown reasons. Those I have checked have not changed in the "Petit Robert" dictionary (online). Does anyone know who decided what in 1990? And do you know of more reliable plain text dictionaries?</p>
      <p>Michel</p>
