      <p>Oh, that example (Tiptoe) uses Ae-lig, Oe-lig and Ue-lig for Ä, Ö, and Ü, not actually for œ or Œ.</p>
      <p>In German typo-/ortho-graphy (alone) it's acceptable to replace umlaut with a following e; a typographic alternative is to merge those letters (see also: e.g. <a href="http://www.liechtensteinmuseum.at/de/pages/home.asp" title="http://www.liechtensteinmuseum.at/de/pages/home.asp">http://www.liechtensteinmuseum.at/de/pages/home.asp</a> 's typeface NEUE ÖFFNUNGSZEITEN SEIT 2. MÄRZ 2008 (with Ö and Ä as OE-lig, AE-lig )<br>
      It is not acceptable to use a postscript e for umlaut-dots in most other languages (compare: it's only acceptable to use apostrophe instead of caron for d, l and t in Slovak and Czech, not in any other language).</p>
      <p>Still, I understand that Tiptoe was just your _source_ of inspiration. French indeed cries for Titlecase version for that letter :-)</p>
