      <p>In French, there’s also bœuf (beef), cœur (hearth), manœuvre (operate), chef-d’œuvre (masterpiece), contrecœur (back-plate) and some others…</p>
      <p>In any case, there’s nearly no occasion where the Œ ligature (or diagraph or grapheme) will be use with lower cases (the only possibilities are «œuf» or «œuvre» as the first noun of a book title. A sentence couldn’t begin with a common noun. So, mainly, this gliph will be use in an all lower cases or an all upper cases word.</p>
      <p>As for reading CE, it’s a matter of habitude, I think. As a French reader, I would never have tought of this but have read OE by recognizing the character and the word instantly.</p>
