    html: "<p><cite> there’s nearly no occasion where the Œ ligature (or diagraph or grapheme) will be use with lower cases</cite></p>

      <p>It is used for \x11Œdipe (and may thus appear many times in some text on psychology), Œta (a mountain in Greece) and in proper names of foreign people. And I learn  from two (non recent) dictionaries of mine (Larouse and Hachette) that one  may write either Œrsted or Ørsted.</p>

      <p>In my \"Petit Larouse illustré\", I count 54 words (that are not proper names) including only one verb, \"œuvrer\" whose first letter is \"œ\". A sentence can start with a verb, for instance \"Œuvrer\", \"Œuvrons\", \"Œuvrez\" etc. The article in front of nouns may be elided in titles. So, in a title, you might get \"Œcuménisme moderne\" and, when the subject gets hot, newspaper titles may beat the statistics!</p>"
