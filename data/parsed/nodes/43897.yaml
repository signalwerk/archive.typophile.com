      <p>Ah, sorry, I completely misread that.</p>
      <p>Uppercase Æ is quite common in the Scandinavian languages. Unlike French, Scandinavian languages have no problems starting sentences with nouns (since nouns without articles are often employed, and the definite articles are all suffixes, rather than separate words before the noun they qualify).</p>
      <p>In <em>Retskrivningsordbogen</em> (the dictionary that dictates spelling in Danish), there are three pages of words beginning with the letter æ.</p>
