    html: <p> Neh boo ... I dunno if i like dat'kine. :D <br> <br>kay, now first off ... yeah i see some of your points about the text on the bottom. I thought it was a little more dynamic than putting all of the venue info on a horizontal baseline at the bottom of the page. I was looking to do something a little more creative, but i see your point about it being a bit distracting.  <br> <br>&gt;&gt;  i'm seeing a slightly agitated face (the 'a's as eyes, the flower as nose, and the type below as mouth). <br> <br>hehe not agitated, the bottom curve is the chin, and the flowers a dimple, making it a smiley butt-chin. <br> <br>anyhow, thanks for all of the comments, this was just a fun experiment for two guys from hawaii. the screens have already been burned, no going back at this point :D </p>
