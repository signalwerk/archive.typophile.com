    <p>Hello.<br>
    I have a question regarding formatting.<br>
    I’m using the revalo <a href="http://www.fontshop.com/fonts/downloads/identikal/revalo_classic/" title="http://www.fontshop.com/fonts/downloads/identikal/revalo_classic/">http://www.fontshop.com/fonts/downloads/identikal/revalo_classic/</a> family in a magazine, when i bring the word file into indesign it ditches all the italic formatting.<br>
    I have no idea how to fix this so it all comes through and i know where the italics are. Am i doing something wrong in my stylesheets? if anyone can help that would be greatly appreciated. </p>
    <p>Cheers</p>
