    html: |-
      <p>That’s how I do it:</p>
      <p>After importing Word file (see screen-capture) into InDesign and BEFORE any formatting I find/change (cmd/ctrl +F) any instance of italic/bold/bold italic (Find format settings =&gt; Format =&gt; Basic character formats =&gt; font style) and change it to relevant character style (defined berofe). Then I apply paragraph styles and all formatting from Word file are preserved.</p>
      <p></p><div class="imageWrap"><img src="/files/word_import_3522.gif"></div><p></p>
    html_clean: |-
