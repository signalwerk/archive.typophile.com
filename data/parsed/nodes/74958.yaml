    <p>Hola! amigos,</p>
    <p>I'm working on a logo for company. The company has recently reached a milestone of reaching 1 million members. They want a visual mark/logo to use on commemorative plaques, buttons and other items. I've started with a simple approach. I believe the acronym for 1 million is 1M. This is for use in the US. Please check out my sketches and let me know what you think. </p>
    <p>gracias.</p><div class="imageWrap"><img src="http://typophile.com/files/1mil_5548.jpg"></div><p></p>
