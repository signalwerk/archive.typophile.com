    html: |-
      <p>I like #5 best. It's cool and it doesn't read m&amp;m's. Minor tweak: the 1 is just a hair too thick to my eye. It's likely just an optical illusion, but the 1 looks thicker than the other two. Oh! And the top right corner of the 1 looks a teeny bit lower than the arc of the em it would hypothetically connect to (if the break wasn't there.) That imaginary line looks like it has a kink in it. </p>
      <p>I think you need to stack "MILLION MEMBERS" to make it readable at smaller sizes. Even printed at two inches high, it's just too tiny (and too frail) to read. </p>
      <p>All those repetitive tall stems in "MILLION" really don't help, either. Have you considered switching to lowercase for readability? Or choosing a heavier font weight? The block of skinny uppercase letters look very uptight - and kinda scared - under a single organic and bold lowercase em.</p>
      <p>Just my humble opinion. :)</p>
