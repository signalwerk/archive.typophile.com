    <p>Hello all. I've been working on a book, medium, and bold version of this font for some time now and I need to get some fresh eyes and opinions on it. It's sort of a hybrid of Avenir, Futura, Gotham and well, any other sans-serif you think it may look like. (the x-height is Helvetica) I've poured over this thing for a while now so if there's any changes you'd make I'd love to hear it. Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/aero_specimen_6354.gif"></div><p></p>
