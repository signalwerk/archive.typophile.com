    html: |-
      <p>Hi Galen<br>
      This looks really nice so far, with some subtle idiosyncrasies. The overall proportions are very pleasant and your optical correction is pretty good in that it appears monoline. There are a few bits that I'd polish even more, but take my words not too seriously as I'm only a beginner...<br>
      I'm looking at the book weight.<br>
      C may need a hair more weight at 9 o'clock.<br>
      Crossbar of F is usually a slight bit lower than on E (because the bottom stroke of E is not there to eat into the counter).<br>
      The straight section of G isn't quite decisive enough...looks like it's not sure whether to be straight like Gotham or round like Avant Garde. I'd go with Gotham.<br>
      J is quite wide and the curve seems maybe to need more smoothing into the stem.<br>
      M and N have noticeably different overshoots at cap line.<br>
      Bar of Q could be a gentler slope; it looks a bit too far right?<br>
      S is not quite smooth.<br>
      V and W need more overshoot at the baseline. Z and z may need a slight bit more weight on the horizontals.</p>
      <p>hm and n need the top of the arch (outer contour) moved right. m, r and ntilde need the spur to be the same as n and p.<br>
      s is falling backwards.<br>
      I like u without a spur. v and w need overshoot.</p>
      <p>Numerals are good shapes! I think 2 needs some smoothing. Counter of 4 is quote small. 5 looks a bit bottom-heavy. </p>
      <p>Asciitilde may be a bit light. ae doesn't usually have the a's spur. Placement of acute and grave accents needs checking (acutes further right, graves further left).</p>
      <p>Very nice overall, keep going! :)</p>
