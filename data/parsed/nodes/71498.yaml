    <p>Both images are of the same font (note how the 'i' and 'o' are shaped). The first image I found in a Japanese anime website, in a wallpaper. The second image I found while watching an anime fansub.</p>
    <p>I've tried Identifont and WhatTheFontFont?!, both didn't give me what I'm looking for, I guess this is a pretty rare font? Thanks in advance if any of you identify this font.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/miyoko_6654.png"></div><div class="imageWrap"><img src="http://typophile.com/files/poplardon_3695.png"></div><p></p>
