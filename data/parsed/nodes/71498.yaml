      <p>It's possible these are from Japanese fonts that also have Latin letters. P22 used to have collections of these on their site years ago, but I don't see them any more.  Maybe if we have some Japanese participants here, like Akira, they might be able to help ID these?</p>
      <p>- Mike Yanega</p>
