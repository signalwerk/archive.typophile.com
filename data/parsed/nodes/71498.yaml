    html: |-
      <p>You're right, Mike, they are Japanese fonts with Latin letters. Because with some hard searching, I finally found the font.</p>
      <p>Including variations, they are:<br>
      - DF 角POP std W5<br>
      - DF 角POP std W7<br>
      - DF 角POP std W9</p>
      <p>All are from DynaFont. (source: <a href="http://www.fontfactory.jp/index.php/catalogsearch/advanced/result/?font_category=68&amp;p=4" rel="nofollow">Here</a>)</p>
