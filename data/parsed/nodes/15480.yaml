      <p>Well moved, Paul.</p>
      <p>At a glance, it would appear that PS Type 1 is now dead in the water, BUT it's a chicken-and-egg situation; the OpenType format represents a far smaller range than what we're now used to, because the collection is still being added to ('standard' faces being coverted from the 'standard' format). </p>
      <p>At the university where I work the current debate is about which format type library we purchase next year on a pretty sizable site license; as I understand it, if we spend, say $30K, we get an OpenType library that is less than a quarter of the size of the corresponding PS Type 1 library - and the PS Type 1 library would only cost a third as much again at around $40K.</p>
      <p>In type education terms, we might not need all 32 instances of Adobe Warnock Pro OTF - but we really do need all the weights of the Univers family, so my colleagues are still keen on going with the established formats and libraries ('standard' faces in the 'standard' format).</p>
      <p>In these terms PS Type 1 still represents good value for money. However, continued sales of PS Type 1 libraries may subsequently act as a disincentive to people or foundries developing OpenType fonts, and that may mean it's taking longer to become the next established standard.</p>
