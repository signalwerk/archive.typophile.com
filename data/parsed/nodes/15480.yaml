      <p>Paul: P22 may be making the first step into a reasonable retail market, but why not provide TTFs with your PS1s, and vice versa?  At least make them available?</p>
      <p>There are handy utilities for sale out there that do a reasonable job of converting between formats.  Why leave it to third parties to potentially muck up a font file with an automated, unauthorized process?  Why create the market for these third parties?  Why not educate the user and keep them close to your heart (and merchant account) with a nice, cozy hug... a cross-platform hug?</p>
      <p>The majority of font users know what's up.  I'm talking about the design community.  (What design school grad hasn't made a font these days?)  The majority of users know how to piddle with Fontographer.  The rest have a third party font converter.  They are also the ones that will take their commission expenses elsewhere when you're not on the level.</p>
      <p>It's one thing to fleece the unwitting for another 50% of the font price (such is business), but it's clearly another to perpetuate an outmoded practice and thereby stagnate the technology and our industry.  I'm not making qualifications, but if we're treating everyone like luddites, the informed will maintain their disdain for what amounts to price gouging.  Again, I think I'm echoing Andreas's 'cynical' consideration.</p>
      <p>(...and Paul, none of this is directed at you or P22 in particular, save for the initial question.  At T26, I was just as inhibited by manhours and fiscal demands to make such a giant leap into formats and revised marketing... even through a ground-up site redesign.  Timing is perhaps everything?)</p>
