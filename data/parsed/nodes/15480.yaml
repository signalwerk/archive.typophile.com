      <p>OpenType fonts will work with current and older versions of Quark, but with some limitations. </p>
      <p>You only get the first 200 or so characters--equivalent to MacRoman or Windows Latin-1, so they will seem just like plain old PostScript Type 1 or TrueType fonts. </p>
      <p>You also get no OpenType feature support (ligatures, alternate figures, small caps, etc.). </p>
      <p>Kerning will mostly work, but there may be combinations left out. OT fonts usually use class-based kerning. In order for kerning to work in, say, Quark 6, the OS has to create a table of kerning pairs derived from the class-based kerning. There is a limit to how big such a table can be. Class-based kerning can be the equivalent of thousands or even tens of thousands of kerning pairs, much higher than the limit in many cases. So a subset is used.</p>
      <p>In most other respects, OT fonts behave the same as older font formats in Quark.</p>
    html_clean: |-
