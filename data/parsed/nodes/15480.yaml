      <p>Si writes: <em>OS and app support isn’t going to go away any time soon if ever.</em></p>
      <p>Microsoft's own Avalon graphics engines in Windows Vista does not include a Type 1 rasteriser. This means that apps written specifically for Avalon will not support Type 1 fonts. Apps that still use the older GDI engine will continue to support Type 1 fonts. That, at least, is my understanding of the current state of play.</p>
      <p>At Tiro, we now have a policy of not making Type 1 fonts even if clients request them, and have turned down work on this basis. The main reason for this is the lack of QA tools for testing Type 1 fonts, and I don't like to ship software that I can't see inside. Compare the validation, comparison and testing tools for TT and CFF OpenType freely available from Microsoft and Adobe, and font table editing tools like TTX, to the kind of blindness in which we had to work on Type 1 fonts, just trusting that tools like Fontographer and FontLab were getting everything right. We wasted too many hours of our lives trying to simply identify bugs in Type 1 fonts, let alone trying to fix them.</p>
      <p>The last time we shipped Type 1 fonts, one key output device in our client's print production workflow substituted incorrect characters, despite all other proofing devices handling the font correctly. How do you fix a problem like that? How can you assure the client that the font is made to spec when there are no validation tools to ensure conformance? Learning to interpret raw PS code didn't seem like a good use of a type designer's time.</p>
      <p>Type 1 fonts? I spit on this arsewipe, ill-documented format. Good riddance.</p>
