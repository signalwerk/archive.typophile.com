      <p>I think it likely comes down to sales. If customers are buying Type 1 then you’d be silly not to provide them. OS and app support isn’t going to go away any time soon if ever.</p>
      <p>Question for Adam - are there python scripts that make it easy to generate multiple Type 1 fonts from a given OT font for all the character-sets and expert sets you might need? </p>
      <p>If not, then best advice for a new foundry would be to advertise OpenType and put a ‘PS Type 1 available on request’ notice on the site. There will be customers who’ll ask for them even if they don’t really need them (education opportunity). And there are customers who will genuinely need the Type 1’s (antiquated hardware etc.,) </p>
      <p>Si</p>
