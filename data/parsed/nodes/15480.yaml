      <p>That's funny. I haven't been on Typophile much this week because I've been busy at work. Among other things, creating content for my blog. And one of the first articles is on exactly this topic.</p>
      <p>See <a href="http://blogs.adobe.com/typblography" title="http://blogs.adobe.com/typblography">http://blogs.adobe.com/typblography</a></p>
      <p>Meanwhile, Ben wrote something above that confused me:</p>
      <p>"At the university where I work the current debate is about which format type library we purchase next year on a pretty sizable site license; as I understand it, if we spend, say $30K, we get an OpenType library that is less than a quarter of the size of the corresponding PS Type 1 library - and the PS Type 1 library would only cost a third as much again at around $40K."</p>
      <p>If you're talking Adobe's Font Folio, then the OpenType version has every font that the last Type 1 version has, and then some. The difference is that in conversion, some fonts have been merged. Thus the OpenType version has a lower apparent "font count." But you're not missing anything that you had in Type 1. (There were about 30 fonts we didn't have the rights to convert, and those are still present in Type 1 format.)</p>
      <p>Now, the one caveat is that if you are using old-fashioned software like QuarkXPress (prior to version 7) or Word, then you won't be able to access the extended typographic goodies in the new OpenType fonts, so functionally you can get at less stuff. But if you are using, say, our Creative Suite applications, the new OpenType fonts are far more functional than the old Type 1.</p>
      <p>Cheers,</p>
      <p>T</p>
