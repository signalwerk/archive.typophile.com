      <p>I realize that there will always be PostScript fonts out there for whatever reason, but what is our role in the industry as font providers?  Should we push the technology forward?  Can we leverage the lagging software developers to catch up with the turning tide of font formats?  Why should an increasingly neglected app drag us down?  (Not to name names, but Extensis is dropping the ball, IMHO.  I am an openly evangelistic InDesign advocate.)  </p>
      <p>What features does PS1 provide that make it worth using?</p>
      <p>Si brings up the important notion of educating the consumer.  I personally think that charging extra for multiple formats is a crock, and a disservice to the market at large.  Andreas gave a wink to this issue as well.</p>
      <p>Tiffany: It's no hair off my back to generate three or even four different formats of a typeface.  Bless the magic of software.  Sure, there are some things that you can do differently across the TTF/PS divide (hinting and point placement), but again... FontLab automates all of this.  How many fontmakers take the time for this in the first place?</p>
      <p>The real matter is that the entire computer industry is becoming more and more cross-platform friendly.  HP iPods?  Intel inside the next generation of Macs?  OSX already supports "PC" formatted TTFs.  I generate TTFs for my own use on my trusty old G4.</p>
      <p>Why generate a platform-specific format in a cross-platform world?</p>
      <p>(Whew... Paul... thanks for moving the thread.  I think I open up more in the General Discussion Forum. heh)</p>
