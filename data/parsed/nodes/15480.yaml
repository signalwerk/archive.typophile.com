      <p>The initial question:<br>
      &gt; Can anyone offer any reason to release fonts in Type1 format anymore?</p>
      <p>At this point, only for clients still using old software, which is surprisingly high. Amazingly, we still get calls from people (some from well known, to remain unamed, publications) that are running Quark 4 on OS 8.6. Yikes. This is the last quarter of 2005! It's hard to fathom but my best guess is that old habits, budgets, tradition and deadlines have combined to allow this situation.</p>
      <p>And to add to the testing portion of John's post...<br>
      We have yet to experience a customer problem with any of our OT fonts. Once thoroughly<br>
      tested and generated, an OT font file is pretty bullet proof. If I had my way, I would delete<br>
      all of the T1 files from my machine and only offer OT. Still waiting on that one...</p>
