      <p><em>John, why not provide T1 fonts but with an explicit no-support warning? It seems unfair to shun the format for people who are stuck with it.</em></p>
      <p>Who is stuck with it? Some people have workflows that include software with 8-bit text encoding limitations, but almost all such software provides codepage support so can access more than 256 characters from a large font. I don't want to encourage 8-bit hack encodings for typographic features, e.g. the Adobe 'expert set' encoding, but even if this is what the user wants this is an encoding issue not a format issue. Even if a user is truly limited to 8-bit fonts, this still doesn't imply a limitation to the Type 1 font format. I would happily ship TrueType or CFF fonts with specific 8-bit character set support if a client really needed them.</p>
      <p>Are there applications in current use* -- or perhaps output devices? -- that specifically require the Type 1 font format? There may be, but I can't think of any offhand.</p>
      <p>* By this I mean both that they are being used and that there are good reasons why a later version of the software cannot be used, e.g. because it doesn't exist or because of compatibility with some other aspect of the workflow.</p>
    html_clean: |-
