      <p><em>Normative? Idiosyncratic is the adjective I would use. It may have been trying to achieve something worthwhile, but my point is that it fails.</em></p>
      <p>But it didn’t fail to be normative.<br>
      Greek versions were made of the major 20th century European sans typefaces, from Germany (Futura), Switzerland (Helvetica) and England (Gill Sans), and these were the norm in mid-century Greek typography when a sans was required, just as they were elsewhere throughout Europe. Scholderer’s New Hellenic couldn’t carry all the load.</p>
      <p>And, just as Gill was localized for Germany, so too was Futura adapted to Greece.<br>
      There was dialogue and development; the example I just posted does not have the truly idiosyncratic “beta=theta ﬂipped” of Olympia, for instance. Such variants demonstrate that the Futura style was a norm.</p>
