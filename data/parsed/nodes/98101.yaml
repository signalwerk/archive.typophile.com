      <p>&gt; Gerry Leonidas has done a spectacular job, through his work in consultation to Western foundries, speaking and writing, and through pedagogy at Reading, in establishing a certain kind of ductus as the norm for new Greek-script typeface designs.</p>
      <p>That's an odd view. I wouldn't say Gerry has 'established' the ductus. Say rather his breadth and depth of study of historic sources demonstrates that an authentically Greek idiom does not have to imitate a Latin pen angle or writing speed and should probably not appropriate typically Latin styling. Gerry fosters an awareness of that idiom but students' design choices are respected without any hint of conservatism on Gerry's part. My unresolved attempts at Greek were aiming at some kind of middle ground, something I hope to explore further some day.</p>
