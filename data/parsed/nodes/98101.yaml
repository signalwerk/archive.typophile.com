      <p>I'm quite intrigued by the cursive devanagari in Pooja Saxena's <a class="freelinking external" href="http://www.typefacedesign.org/resources/A5specimen/2012/PoojaSaxena_Cawnpore_Specimen.pdf" rel="nofollow">Cawnpore</a>. Has there been an attempt before to design a cursive companion to a regular devanagari text face, not as a display face on its own?</p>
      <p>One of the MATD typefaces in 2011, Aaron Bell's <a class="freelinking external" href="http://www.typefacedesign.org/resources/A5specimen/2011/AaronBell_Saja_specimen.pdf" rel="nofollow">Saja</a>, included an attempt at a hangul (Korean alphabet) italic. I actually tried to talk Aaron out of it since there is no tradition of pairing a slanted (or indeed any type of) cursive hangul with the regular, and I wasn't convinced that one could be successful. Seeing the result hasn't changed my mind, though I applaud the willingness to experiment.</p>
    html_clean: |-
