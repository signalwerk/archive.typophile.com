      <p><em>… what happens in typography is actually akin to evolutionary failure … </em></p>
      <p>I can’t share such a pessimisitic view.<br>
      The ecosystem that thrives is not the monoculture, but one where there is diversity to accomodate whatever manner of change it may encounter.</p>
      <p>The three-sides-of-a-rectangle pi has in fact spread to the general population of letter forms and become a norm in the Greek writing system, because writing systems in the 21st century are primarily typographic and allographic, with multiple norms of many letters, of which pi is one. This variety does not mean that the variants are trivial and the pre-typographic singularity (if there ever was such a thing) is the only real norm; it just means that there is variety, existing in forms that may be categorized according to typographic style. </p>
      <p>Despite the fact that the three-sides-of-a-rectangle pi can never achieve complete hegemony, it is not a worthless mutant but an old species of shape (capital Pi) that now thrives in the lower case sans—ecological succession, if you will.</p>
