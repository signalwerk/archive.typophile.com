      <p>The perception of text depends on context; letterforms don't exist in some formal vacuum, especially for a text face. So the Greek might not be disproportionately lively if the basic nature of Greek -and what readers of Greek are used to seeing- is more lively than Latin (which in fact it is).</p>
      <p>My favorite example is serifs in Armenian: if you put them where they would be in a Latin font you end up with something ugly and harder to read.</p>
      <p>A more accessible example is Trajan: making a formally congruent Cyrillic version cannot result in the same flavor because readers of Cyrillic don't have the same background.</p>
      <blockquote><p>If the Latin of a face is going to have Roman and Italic of markedly different construction, then so too should the Greek.</p></blockquote>
      <p>It's not so simple - it depends again on context. Just because you make a style of type for a writing system (Italic) doesn't mean it's used identically. Again using Armenian as an example: we have a floating emphasis mark that's placed on a vowel to emphasis a word, so we don't use Italic the same way as Latin does, which means making an Italic for Armenian the way you make one for Latin is just bad design.</p>
      <p>Now, if Greek does use Italic very similarly to the way it's used in Latin then I agree that the degree (or more accurately, the flavor) of divergence should be comparable.</p>
      <blockquote><p>Hellenize the Latin according to the same principle!</p></blockquote>
      <p>Ideally you go both ways, like in my Nour&amp;Patria.  :-)</p>
      <blockquote><p>To fall back on traditional conventions for the separate scripts is ultimately to shirk the design challenge.</p></blockquote>
      <p>Actually I think Latinizing is much easier than doing what Papassissa has attempted. Latinization is like a parlor game, devoid of insight and sensitivity. And I don't consider myself a traditionalist - I just believe in using ideas that work no matter where they come from.</p>
      <p>hhp</p>
