      <p>Thanks for the correction, Kent.</p>
      <p>Nick, I see the decline of the long s as orthographic reform. I think you are entirely right with regard to the influence of a publication such as <em>Lyrical Ballads</em>: it was actually exactly the same book that came to my mind as an example from the transition period. But the fact that such a reform takes place in publishing, i.e. in a typographic environment, does not mean that it is 'driven by typography'. It is driven by reformist publishers, editors and authors. As I said, the fonts they were using still included the long s, they just opted not to use it.</p>
      <p>Many of the world's writing systems contain historical letters that have fallen out of use in modern orthographies. So? Most orthographies are only subsets of a writing system.</p>
