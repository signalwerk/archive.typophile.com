      <p>Tom: <em> I don't think writing will stop evolving. Indeed, modern digital distribution and relative ease of type design means that changes can occur much more quickly.</em></p>
      <p>Change does not constitute evolution. I know there is a common usage that treats evolution as a synonym for change, but it is imprecise and doesn't allow one to say much of interest about change other than that it happens and, as you note, may happen quickly or slowly. In order for this metaphor to be interesting, let alone enlightening, I think one should first identify the functional synonym of change in the evolutionary model, which is mutation. Change = mutation. Evolution is one possible outcome of mutation: propagation of the mutation through a population, such that one can say that the species has evolved. Individuals mutate; species evolve.</p>
      <p>In order for evolution to occur, there must be a mechanism by which a mutation can propagate through a population. In biology, the mechanism is sexual reproduction. Such a mechanism is necessary but not sufficient: in order for evolution to occur the circumstances must also be conducive. It may strike one as ironic, but the more successful a species is in terms of the size and spread of its population, the less conducive its circumstances are to evolution.</p>
      <p>[This is the situation that human beings arrived at something more than 65,000 years ago. Simply put, our population is too large and widespread for any mutation to propagate to the species level; evolution is statistically impossible. This is not to say that change, i.e. mutations, do not occur, and might not even spread in some limited local way, especially in populations that live separate from their neighbours, but that as a species homo sapiens is as it was in the palaeolithic period, and isn't expected to change.]</p>
      <p>Now, if we're going to apply the metaphor to writing systems as the species-level phenomenon, which I think makes most sense in terms of a parallel to biological classification, then one should ask 'What is the mechanism of propagation of a mutation through the population?' And I think the obvious answer is pedagogical reproduction as practised by professional scribes. The notion of 'hand-writing', as something an individual does, isn't important. What is important in the evolution of a writing system is a profession of scribes, of people whose job is to manufacture texts. And it is a profession that one sees wherever one sees mature writing systems, very often existing as a specialised caste, with reproduction of existing styles being a core activity and pedagogical focus (propagation), and invention of new styles (mutation) occurring within and feeding into that activity and teaching. The Islamic <em>ijazah</em> system of certification in individual styles is a good example of such pedagogical reproduction, which enabled <em>naskh</em> an 8th Century mutation of <em>thuluth</em> by an individual scribe, to propagate to the writing system as a whole and become the dominant text style for a large part of the Islamic world for more than a thousand years. In that context, it makes sense to talk about the evolution of the writing system at the species level, and not just a synonym for change. Similarly, if one looks at the scribal culture of 18th Century England, as I have been doing for the past couple of years, one sees the same active pedagogical reproduction: the teaching of a 'body of penmanship' consisting of a repertoire of existing styles that the professional scribe is expected to master, which simultaneously provides the conducive circumstance for a new mutation, John Seddon's roman of 1695, to propagate and become one of the standard hands within forty years. That strikes me as evolution of a writing system properly understood, with visible propagation to the species-level and a recognisable mechanism by which this happens.</p>
      <p>With the decline of a professional scribal class, the mechanism of propagation degrades -- one by product of which is that handwriting becomes a personal, expressive form instead of a mastery of a body of styles --, and I believe the development of graphic design in the 20th Century further produced circumstances unconducive to such propagation. Instead, one sees fragmentation into an ever increasing number and variety of new styles, which is akin to something like a population explosion, resulting in a situation in which, as we all agree, change (mutation) happens very quickly and frequently, but no longer propagates to the species level.<br>
      ____</p>
      <p>Now, having written all that. I'm going to reverse tack somewhat and see if I can find a way to synthesise my view and Nick's, and come up with a way to accommodate the kind of design developments he observes within this evolutionary metaphor. The key, I think, is to introduce sub-species taxonomic ranks, i.e. genera, which enable us to acknowledge that the limited propagation of mutations can result in distinctive, and hence classifiable, styles that belong to the (no-longer-evolving) writing systems. That is, a limited evolution can be said to occur -- in writing and typography -- at the level of the genus, which does not significantly affect the species as a whole, but produces novel plumage, if you'll excuse the pun.</p>
