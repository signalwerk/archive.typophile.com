      <p><em>…scripts develop distinct styles that, in particular cases, inform the normative shapes of letters …</em></p>
      <p>How does one determine the norm?<br>
      Is it the statistical norm in number of published typefaces, or in published usage?<br>
      And in publications, which ones? In academia or commerce? Advertising or design? High or low end of the market? Per publication, or per sales volume? And why should the norm be immutable?</p>
      <p>Styles don’t just happen, people make them.<br>
      Gerry Leonidas has done a spectacular job, through his work in consultation to Western foundries, speaking and writing, and through pedagogy at Reading, in establishing a certain kind of ductus as the norm for new Greek-script typeface designs.</p>
      <p>However, to me that norm appears to be a conservative, somewhat academic stereotype, and not something that I, as a progressive, indie-foundry, non-Greek type designer, feel comfortable in appropriating. </p>
      <p>In these days of a plurality of type producers and an emergent culture of indigenous Greek and Cyrillic type designers, Latinization is not the issue it once was. Once, it may have been possible to consider it as a form of asymmetric internationalism—i.e. industrial neo-colonialism, but now there are plenty of diverse resources, including indigenous, to enable non-Latin-script art directors and designers to determine the shape of their own culture’s typography. That makes for some interesting options: for example, in a contemporary sans serif do they opt for the “latinized” (e.g. eta=/n, nu=/v) PF DIN by Panos Vassiliou for his Athens foundry Parachute, or Hoeﬂer and Frere-Jones’ Whitney, with its Leonidas-attested authenticity (eta with descender etc.), for a New York foundry?</p>
