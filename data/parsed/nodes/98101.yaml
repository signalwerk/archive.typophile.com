      <p>How can normative letter shapes have any shape at all, if not expressed in a widely used genre of typeface?</p>
      <p>For instance, the binocular /g is not handwritten, and its shape is too complex for simple verbal or mathematical deﬁnition. It has been primarily a typographic form for a long period of time.</p>
      <p>The letter /y has at least three topologically distinct normative shapes, which correlate broadly with genres of type—geometric, humanist, and techno:</p><div class="imageWrap"><img src="http://typophile.com/files/whys_5799.png"></div><p></p>
      <p>In focusing on the Futura or geometric style, I am identifying a genre not just of type, but of a stylistic norm which constitutes a categoric subdivision of the diversity of letter shapes within writing systems, because many individual letter shapes do not regularize down to one standard form. Futura/Olympia is not an aberration.</p>
