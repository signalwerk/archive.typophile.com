    html: "<p>It was interesting for me to read Nick's comments on the DrJ*MsH before actually looking at the specimen. I think there is a matter of perception here, in which I know my own is influenced by the fact that almost all the Greek text I encounter is either written or typeset in traditional minuscule-derived styles. When I look at Elena's Latin and Greek side by side, I don't get the same sense as Nick of the Greek being too lively by comparison. Rather, I think there is a tension within both scripts between very lively letters (Latin a and Greek lambda) and much more constrained letters (Latin g and Greek pi). The Greek looks to me simply like a fairly conventionally structured type, and its problems are not of style but of proportion: several letters are noticeably narrow and disturb the (sorry, Hrant) rhythm. The beta, gamma, pi and upsilon stand out in this regard.</p>"
