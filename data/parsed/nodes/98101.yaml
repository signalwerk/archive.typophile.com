    html: "<p>Yes, it has narrowed and mostly frozen them, such that change now only occurs within fragmentary stylistic avenues: mutations that do not spread to the general population of normative forms. I'm not describing what might happen, or proposing counterfactuals, I'm describing what has happened. The evolutionary analogy is actually very apt, because what we see in contemporary type design is an explosion of stylistic mutations that do not take hold on the writing system in anything like the way, to take this back to the original topic, the Byzantine scribal cursive took hold of the Greek writing system, or the naskh and nastaliq styles took hold of the Arabic and Persian writing systems. I don't think it is sufficient to say that writing is cultural and that it evolves with culture without examining what evolution means in this context and acknowledging that what happens in the maturation of writing systems is akin to biological evolution, whereas what happens in typography is actually akin to evolutionary failure, exciting though it may be to watch happening in the petri dish.</p>"
