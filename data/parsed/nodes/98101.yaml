      <p>If it’s forbidden to “Latinize” Greek by straightening it out and adding serifs, then why not, if one is starting with a Greek design and adding Latin, and wants to create a harmonious multi-script serifed typeface, “Hellenize” the Latin component by removing serifs and loosening it up?</p>
