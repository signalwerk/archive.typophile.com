    html: |-
      <p>The Greek of Dr &amp; Ms is rather self-indulgently lively (if this is the designer’s idea, rather than faculty’s), when the Latin is so much more disciplined.<br>
      There should be greater consistency between Latin and Greek, if one is going to follow the “Latin” principle of Regular and Italic styles—and Arabic numerals.<br>
      If the Latin of a face is going to have Roman and Italic of markedly different construction, then so too should the Greek. In for a penny, in for a pound.<br>
      This means that the traditional Greek “scriptyness” must be deployed to the Italic, because if it’s used in the Regular, unless it’s simply a slanted version of the Regular, the Italic is painted into a corner—and that’s exactly what’s happened in Dr &amp; Ms, for despite alternate forms of beta, theta, phi and (somewhat) kappa, it’s basically a slightly condensed, more evenly slanted version of the Regular. There isn’t the amount of distinction between styles that exists in the Latin. </p>
      <p>There’s no need to have the Greek Regular characters with such varied inclination, some leaning forward (omicron?!), some back. Even in the archetypically Greek Plain (Monotype 90), the diversely stressed letters have balance, and some, such as gamma, are dead upright. So there is no Greek imperative for gamma and nu in Dr &amp; Ms to be leaning to the right.<br>
      Even if the intention was to avoid Vassiliou-style modernism/internationalism/latinism, it would have been possible to maintain traditionally “scripty” Greek letter forms and stress, without being quite so baroquely slanted.<br>
      Either that, or Hellenize the Latin according to the same principle!</p>
      <p>It’s really, really hard to accomodate the traditional authenticity of Latin, Cyrillic, and Greek in the same typeface with a strong measure of formal consistency between the scripts. To fall back on traditional conventions for the separate scripts is ultimately to shirk the design challenge.</p>
      <p>Nonetheless, this is a minor quibble—it’s an awesome fun face with beautifully drawn glyphs.</p>
