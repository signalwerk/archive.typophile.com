      <p>Nick: <em>How do you account for the extinction of the long s?</em></p>
      <p>Lazy compositors. The typeface makers didn't stop including them; the compositors stopped using them. They persisted in writing, though, like most else, until the typewriter came along.</p>
      <p>I don't know whether I'd classify this as evolution of the writing system. The long s is still there in the system considered in toto, just something like the appendix or the atavistic bone structure that I have in my ankles.</p>
