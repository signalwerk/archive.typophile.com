      <p>There were certainly economic beneﬁts to dropping the long s—especially all the italic ligatures—but printer-publishers would not have exploited the productivity opportunity without aesthetic justiﬁcation. That it was expressive of a larger movement can be seen in this page from Wordsworth’s <em>Lyrical Ballads</em>, 1802 edition, which is the sort of thing that would have given cachet to the practice. </p><div class="imageWrap"><img src="http://typophile.com/files/Preface_5250.jpg"></div><br>
      Source:<br>
      <a href="http://www.jamescumminsbookseller.com/news/?p=156" title="http://www.jamescumminsbookseller.com/news/?p=156">http://www.jamescumminsbookseller.com/news/?p=156</a><p></p>
      <p>Compare this process of the normal form of /s changing to one used elsewhere (at the end of words) to that of the traditional π with “overshooting” crossbar being changed to the majuscule form in various typefaces. In both cases, typography has been the driving force in rationalizing the writing system.</p>
      <p>That is, assuming that reduction is rational.</p>
