      <p>Warning, extended metaphor ahead.</p>
      <p>I think what happens to writing systems that have been reduced to type (borrowing a construction frequently used of oral traditions when they are 'reduced to writing') is that they cease to evolve in ways that affect the whole genome of the script. Rather, like human evolution in the civilisational period, what you get are relatively minor mutations that don't spread in the population and only express themselves in fragmented gene pools, in this case genres of type. I think this is quite different from what is observed during the evolution of a writing system in the context of scribal cultures, in which periods of intense creativity produce system-wide paradigm changes that then dominate across multiple languages using the script sometimes for centuries.</p>
