      <p>Nick, I'm familiar with examples of Greek modernist design, and my opinion that this design was ill-served by mostly clumsy, Latinised types isn't something to which I've come lately. While the layout of the older record sleeve you show is better than the re-release in every respect, I think the type used was inept, not only stylistically but also technically. There are major problems with relative proportions, spacing and even basic legibility when it comes to the diacritics.</p>
      <p>As I wrote early in the thread, perception is at play. I actually find more traditionally structured Greek letters to be much more restful and less busy in blocks of text than these simplified forms, which don't seem to knit together so well. I think this is demonstrated in your last two images, in which the Greek completely lacks the calm neutrality of the English text.</p>
      <p>I spent a lot of time considering this back in 2000-2001, when I was designing the new Greek for Linotype's Helvetica World. What I sought in that design was a comparable feel to blocks of text in both scripts, which I didn't find was served by the original Helvetica Greek design of the 1970s, even though that made free use of many borrowed shapes from the Latin. It's a project that taught me a great deal about harmonising different scripts, and one of the key lessons was that, contra your assertion that 'a straight line is a straight line, whatever script it’s in', a particular arrangement of straight lines in one script has an entirely different impact on text than a similar arrangement in another script, and a result of different frequencies and different combinations of shapes arising from the letter forms.</p>
      <p>Writing systems tend to produce, over time, forms that are pleasing to the eye as well as being easily readable, simply because readers respond positively to these things. And since the reader encounters letters in text, it is in text that this pleasantness and readability expresses itself. So I think it is always worthwhile to look at blocks of text and ask what makes them pleasing, or not, and take on board what generations of scribes, typographers and readers have come up with. So when I am harmonising different scripts, even within the context of styles of type associated, through their use, with modernism, this is the basis from which I proceed.</p>
      <p>Or, to put it another way, I find the ideas of modernism unhelpful in designing successful modernist types.</p>
