      <p>Nick: <em>I don’t see why the “proper” form has to be busy and fussy, why it can’t be simpliﬁed, without losing its orthographic integrity.</em></p>
      <p>If course letters can be simplified, and the result will be a simplified style of typeface. At its extreme, one ends up with Gridnik, and I'd argue that there is a continuum of 'orthographic integrity' that ends up in something that may be decipherable but is in effect a new orthography. Your simplified Greek forms in Figgins Sans are somewhere along that continuum, and my objection to them isn't an objection to simplification per se but that they are wrong for the typeface style. You didn't simplify the Latin. The Figgins Sans lowercase a has its exit stroke, the g has its curved ear and nicely swung oldstyle form, the y has its hook. Figgins Sans is not a simplified typeface style, so the Greek simplifications simply look out of place to me.</p>
