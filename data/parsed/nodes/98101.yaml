    html: "<p>As I said earlier, we're using the concept of normative in reference to different things: you're talking about 'different genres of typeface', and I'm talking about writing systems; you're considering typefaces as representing the evolution of writing systems in a typographic ecosystem, while I consider typefaces to be essentially arbitrary stylistic mutations that, due to the nature of the ecosystem, do not represent evolution of the writing system. Both perspectives seem to me valid. I prefer mine because it seems to provide a more systemic and less general sense of evolution -- something other than just a synonym for 'change' --, and because it provides criteria other than fashionable success to make judgements about individual typefaces and genres and, indeed, to make design decisions. The problem of taking typefaces as constituting new norms is that, as with the so-called experimentation of the 1990s, there are no failed experiments.</p>"
