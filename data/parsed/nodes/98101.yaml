      <p>You’re overstating the simplicity of Figgins Sans’ Greek, and understating the simplicity of its Latin.</p>
      <p>Here is what a much more simpliﬁed Greek looks like (above, with Figgins below).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Greeks_4530.png"></div><p></p>
      <p>And here is the Latin of Figgins compared with a busier sans, Benton Sans. Figgins Sans is quite calm, due to the roundness of its curved letters, and the fact that most of its terminals are vertical or horizontal.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Sans_6114.png"></div><p></p>
      <p>Certainly, Figgins Sans has an elaborate /a, but it matches alpha; and its binocular /g matches similar shapes in beta, delta and xi.</p>
      <p>I disagree with your method of assessing the busyness of a typeface in a particular script according to its relationship with the “normative” style of that script. A straight line is a straight line, whatever script it’s in.</p>
      <p>One reason for the popularity of Olympia and similar Futura derivatives was that art directors looking for a consistent reductive geometric effect in a modernist layout appreciated that that quality appeared in both its upper and lower case. If the Futurization of U&amp;lc text was as acceptable in the middle of the previous century to Greek readers as it was to Western readers, why is it such an issue now?</p>
