      <p>To engage your metaphor:</p>
      <p>Not much biological evolution of humanity has occurred during the civilizational period.<br>
      But writing systems are entirely cultural, and evolve with culture.<br>
      There is no reason for them not to continue to evolve, as writing technology changes from clay tablet to pen and paper to foundry type to digital fonts and pixel media.</p>
      <p>Reading is an important part of writing systems, and for the past hundred years there has been near universal literacy in the West, with most of the reading being of type, and within this century most adult writing being done on a keyboard with digital fonts. That is a system-wide paradigm change as great as any that ever occurred in a scribal culture, so it is reasonable to assume that it has had a profound effect on the normative shapes of letters.</p>
