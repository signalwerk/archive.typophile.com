  date: 2012-10-23T12:19:00
  date_raw: 23 Oct 2012 — 12:19pm
  votes: null
  html: <p>It's hard for me to imagine someone only creating one typeface and no more.  It would be like someone only painting one painting, or someone writing only one song.  To gather enough passion for something to do it completely and in whole once, but at the same time not enough passion to want to even do it one more time before you die, seems like a hard spot to land on.</p>
