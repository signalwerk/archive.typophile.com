      <p>From the title, I thought this thread was about something like like the "one hit wonder" in popular music; a type designer who, unlike Frederic W. Goudy, Morris Fuller Benton,  or Hermann Zapf, only designed one <em>successful</em> face that anyone remembers.</p>
      <p>Many amateur designers might well just make one font and decide it's just too much work.</p>
