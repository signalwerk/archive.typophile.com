      <p>Yes, typecasting!  :-)</p>
      <p>Which brings me to something I've been wanting to do for a while: would it be possible/useful to make a list of type designers showing what they're best at and/or best known for*? For example Alejandro Paul would have "script fonts", James Montalbano might get "highway signage", Gerry Leonidas and Maxim Zhukov would obviously get "Greek" and "Cyrillic" respectively, etc. Although there's a risk of pigeon-holing it would also be useful to direct people to specialists. Maybe?</p>
      <p>* No snide remarks about yours truly please.  :-)</p>
      <p>hhp</p>
