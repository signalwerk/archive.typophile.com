      <p>Yes the 2 fonts are different.</p>
      <p>The first one is a (further emboldened) <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Elsner%2BFlake&amp;ffam=BallantinesScriptEF%20Heavy%20-%20Regular&amp;fid=6dac72c8b4dd7141af4b82bc09ca4f36&amp;fsize=60&amp;text=Size%20DOES%20Matter&amp;fit=1" rel="nofollow">Ballantines Script Heavy</a></strong> </p>
      <p>The 2nd one looks like an (also emboldened) <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Snell%20Roundhand%20-%20Black%20Script%20Italic%20Bold&amp;fid=0657a3782492cc6c26943d9a13fbb928&amp;fsize=60&amp;text=Size%20DOES%20Matter&amp;fit=1" rel="nofollow">Snell Roundhand (Black)</a></strong></p>
