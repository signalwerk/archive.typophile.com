      <p>FontLab is not a good choice for examining Arabic fonts, as it lacks all support for contextual alternates.</p>
      <p>Try DTL's OTMaster -- even the free Light version <a href="http://www.fonttools.org" title="Click to visit an external URL." class="freelink freelink-external freelink-external">(download)</a> is able to display the tables. It's not as readable as Adobe's OpenType script notation, but then again, that does not support context alternates either.</p>
      <p>Which makes some sense, as FontLab is built around Adobe's font tools. Arabic fonts get their smarts from Microsoft's VOLT tool (reportedly, even Adobe's fonts).</p>
      <p>OTMaster displays the OT information in a rough-and-ready format, which means you will have to know everything about OpenType substitutions. I will not even mention which of the many, many tables you must inspect, because if you don't know, you won't know what you are looking it.</p>
    html_clean: |-
