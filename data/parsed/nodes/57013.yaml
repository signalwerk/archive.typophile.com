      <p>One final observation:</p>
      <p>The idea that Urdu script is "very complex" is analogous to the idea that Nastaleeq has "any number of alternative spellings".  </p>
      <p>The preferred Arabic script variety by Pakistani's (whether they write Urdu, Pashtu, Panjabi or Kasmiri) has only ONE spelling: </p>
      <p>نستعلیق</p>
      <p>:-)</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
