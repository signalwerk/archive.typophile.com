      <p>As a user of Arabic script day in day out, I very much appreciate the fact that people like Thomas Milo and those in DectoType have invested in producing something as good for the script as Tasmeem. I think their work have served the Arabic Script and the Islamic culture very much. Currently, I am in the process of documenting the transition of the Arabic Script from calligraphy to typography. Tasmeem will obviously feature in the evolution process.</p>
      <p>However, in researching the development of Tasmeem and the Arabic Calligraphic (Composition?) Engine, ACE, I almost always came across Thomas Milo's high acclaim of Ohanis Mühendisoğlu as the real "muhendis" of Arabic Typography. I was not successful in finding any references to "Ohanis Mühendisoğlu" other than those made by Thomas Milo. All search results have directed me back to Milo.</p>
      <p>Conversely, searching under the topic of Arabic Typography in general returned numerous references to Ibrahim Müteferrika who Milo refers to in one of his articles as a Hungarian renegade with a short lived contribution to the evolution of Arabic Typography. Among the Hungarians, who Ibrahim defected, one has actually celebrated Müteferrika's contribution and provided good examples of his work on the web site:</p>
      <p><a href="http://muteferrika.mtak.hu/hu/eletrajz.htm">http://muteferrika.mtak.hu/hu/eletrajz.htm</a></p>
      <p>I will be grateful to Thomas and others who can refer me to independent sources on Ohanis Mühendisoğlu so that I can better see how he relates to the development of Arabic Typography as opposed to what Müteferrika had contributed.</p>
      <p>Best regards</p>
      <p>Khalid</p>
