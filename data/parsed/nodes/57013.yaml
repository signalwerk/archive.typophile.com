      <p>The Adobe FDK for OpenType syntax that is used in FontLab Studio is good for developing new features but it is not ideal for representing a "dump" of the features taken from the final font. Indeed, <a href="http://www.fontmaster.nl/english/OTMaster_rdrct.html" rel="nofollow">DTL OTMaster</a> or the free FontTools/TTX (which is bundled with <a href="http://www.adobe.com/devnet/opentype/afdko/" rel="nofollow">Adobe FDK for OpenType</a> and <a href="http://fonttools.sourceforge.net/" rel="nofollow">available separately</a>) are much better tools to look at how the features are defined. OTMaster provides a graphical representation while FontTools/TTX creates XML text dumps which can be viewed in any text editor. </p>
      <p>Cheers,<br>
      Adam</p>
