      <p>Hi Danny,</p>
      <p>We just completed a new nastaliq typeface. It's based on Persian, but supports the whole Arabic block in Unicode. It was designed for Urdu and to get the Pakistani "flavour" rather than the Persian one, we provide a series of typographic parameters in the Tasmeem interface.</p>
      <p>BTW, allow me to put you straight when you write: "Urdu traditionally uses a very complex variant of Arabic script called ’Nastaleeq’".</p>
      <p>Nastaliq is outrageously complicated if you are forced to reproduce with 15th century typesetting concepts, without an analysis of the internal logic of historical Arabic scripts, an aspect that I call "script grammar". That would be analogous to cloning the hand-held calculator without even suspecting that there is math involved - something that would require a massive data base with at least the outcome of all common supermarket additions and still miss the point of what calculating entails.</p>
      <p>Think again: how could nastaliq be "very complex" and at the same time be the script of choice for the majority (population wise) of the Arabic-scripted world, and why would there be a massive demand to adapt it for computer use?</p>
      <p>The truth is, that nastaliq or naskh-i taʿlīq (slanted naskh - naskh 	<em>italic</em>) is an extreme simplification of traditional, pre-typographic naskh. Efficient and elegant at the same time. It took us 300 glyphs to cover nastaliq.</p>
      <p>As a boon, for the same text well-constructed nastaliq needs only a fraction of the length required by ordinary computer typefaces of comparable size, allowing for generous line spacing to lend it elegance and legibility.</p>
      <p>We were not the first to discover the straightforward simplicity of nastaliq. The first realistic Arabic typesetting - as opposed to the uninformed caricatures produced in the West and the competent, but failing experiments in the East - was based on <em>ta'lîk</em> (taʿlīq), the Ottoman variant of nastaliq (see image, 1840's, attributed to Ohanis Mühendisoğlu). It dates from the second quarter of the 19th century and it appeared about a quarter of a century before a comparable quality of naskh typography was attained.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      www.decotype.com</p><div class="imageWrap"><img src="http://typophile.com/files/Ottoman_Taliq_Typography_close-up_5876.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Pre_muhendisyan_detail_6124.gif"></div><p></p>
