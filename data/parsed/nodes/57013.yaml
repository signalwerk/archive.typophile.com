      <p>One final illustration showing how much more efficient nastaliq is in terms of surface use. Please note that the so-called complex forms in fact enhance legibility: they are much more distinct than the monotonous repetitive shapes of the western simplified approach. It is also interesting to observe that the nastaliq tradition has proven to resistant to alien simplification attempts.</p>
      <p>In the illustration the nastaliq line is green. It is remarkably shorter than any of the other typefaces, all set in the same size.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
