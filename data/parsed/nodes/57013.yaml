    html: |-
      <p>Very interesting again. I actually didn't realize that the Arabic script is still alive in Malaysia. (Talk to an Iraqi and you will know how much exposure is important.) The geographic expanse of Arabic script sort of confirms my interest in contributing to its development.</p>
      <p>However, I'm still in the simplified Arabic approach. Based on the typography that my eyes and the eyes of most Arabic script users are accustomed to, I started designing Arabic fonts in this style some time back. My knowledge and skills are still developing in OpenType, but I think I will remain with the simplified approach for the time being. I will not religiously defend it though, but I think the available technology and standards only allow as much. And I still think there is much unrealized visual and stylistic potential that I can explore using the simplified Arabic approach.</p>
      <p>Technology accessibility is an important factor. Take ACE for example. It can do quite some nifty typography, but it is locked to InDesign. On the other hand OpenType is openly available on most, if not all, computer operating systems and it is the basis of web fonts too.</p>
      <p>On a different but related note, take a look at the sumptuous photo below of Jawi writing in Ruq'aa I found while researching Jawi (thanks to  you). Just feel that ink flowing out of the nib on the nicely colored paper. Hear the subdued click of the nib as it goes up flying out of a graceful curve. I think haptics will keep paper print and writing alive for a long time to come.</p>
      <p>I can go enjoy the weekend now.</p>
