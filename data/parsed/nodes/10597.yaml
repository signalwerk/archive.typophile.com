  html: "<p>Hello folks, <br> <br>this is a 24hr freebie job, a company called 'mineral express ltd'. They specialise in bottled water, and coporate water coolers. It needed to be modern, clean and simple without being pretentious. Didn't want any imagery. So they got this:  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/70938.gif\" alt=\"\"> <br> <br>I can show the business card if anyone is interested.</p>"
