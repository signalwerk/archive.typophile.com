    html: |-
      <p>Kris, I really, really like the letterforms in this logo, but I agree that the hierarchy seems too flat and noisy, but that may just be the size at which we're looking at it. A smaller size printed will probably calm down. I don't mind the gradient, since they're letterforms and will probably work fine in black. I'm really digging the 'mineral', specifically. The 'p' in express bugs me a bit. The vertical goes too high for my taste.</p>
      <p>All-in-all, I think it's great, particularly for the turnaround time.</p>
