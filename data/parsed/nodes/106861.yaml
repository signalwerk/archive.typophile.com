    html: "<p>Part of it has been obviously modified (artificially emboldened(?), crossbars pulled downwards, counters reworked), wasn't able to spot a perfect match. I first thought it could have been <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/franklin+gothic\" rel=\"nofollow\">Franklin Gothic</a>/<a class=\"freelinking external\" href=\"http://www.myfonts.com/search/news+gothic\" rel=\"nofollow\">News Gothic</a>/<a class=\"freelinking external\" href=\"http://www.myfonts.com/search/trade+gothic\" rel=\"nofollow\">Trade Gothic</a> but digits don't match at all. The closest I've found is <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/urw/grotesk\" rel=\"nofollow\">Grotesk URW++</a> but I can't positive if they start from it. More in the same vein: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/ef/tvnord\" rel=\"nofollow\">TV Nord EF</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/positype/aaux-next\" rel=\"nofollow\">Aaux Next</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/urw/largo\" rel=\"nofollow\">Largo URW++</a> (very close too), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-std\" rel=\"nofollow\">Akzidenz-Grotesk</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/mti/slate\" rel=\"nofollow\">Slate MTI</a></p>"
