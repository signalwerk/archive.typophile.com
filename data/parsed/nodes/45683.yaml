      <p>I don't even think I'm going out on a limb when I say that in all likelihood, the kind of typeface you're looking for does not exist. The difficulty level of assembling a faux-Korean Latin-alphabet typeface would be close to that of designing a Latin-alphabet typeface by picking flags of different nations to stand for each of the letters. To make it work, you would have to deconstruct the source material to the point that it would no longer be recognizable.</p>
      <p>Now, what you're looking for <em>might</em> work with a very simple and short combination of letters, as for logos. The hangul glyph 티 could stand for 'El', perhaps, and 애 for 'OH'. But we are talking about a really, really limited application here, and I don't see how a whole typeface could come out of this.</p>
