      <p>I assume you mean Latin-alphabet typefaces whose glyphs mimic the shapes of other scripts.</p>
      <p>I'm Korean and I find it very difficult to imagine a Latin typeface resembling the Korean script (an alphabet called hangul). At best you would merely be using elements of a typical hangul typeface such as the serif treatment, but the results would look nothing like the Korean script. Hangul has a specific look because of the way the alphabetic elements are arranged in syllabic blocks.</p>
      <p>With Chinese (especially simplified Chinese), there are certain characters that have a low stroke count that bear a resemblance to letters of the Latin alphabet, and the same goes for letters in hiragana and katakana (Japanese) and indic-derived writing such as the Thai script. (I'm not sure what you mean by Indonesian and Vietnamese, as both use the Latin alphabet.) There is no obvious way you can apply this to hangul. Demonstrating why this is so would be a bit involved, but maybe you can try to look for samples of Korean writing and figure out for yourself why.</p>
