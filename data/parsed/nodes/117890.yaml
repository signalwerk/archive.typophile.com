    <p>hi,</p>
    <p>what is the best way to kerning in Volt? changing dx? or width? I faced a problem when I kerning "pair Adjustment"for the same letter, ex: rr (in english) or Raa Raa (in arabic) when I test it and type the letter for 5 times, it shows spaces between them. anyone faced it before?</p>
