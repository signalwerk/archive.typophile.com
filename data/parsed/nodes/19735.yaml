    html: |-
      <p>My favourite way of grunging stuff up is the following:</p>
      <p>1. Find a picture of rust, dirt, concrete, etc.<br>
      2. Greyscale this picture and turn up the contrast so it's mostly white with black grunge on it.<br>
      3. Copy this onto a layer above your text and set the blending mode to "Multiply".<br>
      4. Tweak the contrast of the top layer as necessary.</p>
      <p>This lets you change the text underneath if necessary while keeping the grunge on top.</p>
      <p> - Lex</p>
    html_clean: |-
