    html: |-
      <p>I do something similar to what Lex does however I do it in such a way as to work on all backgrounds (sorry Lex ;-P). Anyway the way I do it is to get a grunge texture (rust, flaking paint etc.) and then bring the photo into the file that also contains your text. From here I click on the photo layer, press 'Control/Command A' to select all then 'Control/Command C' to copy the photo. From here I go into my Channels palette, create a new channel and then press 'Control/Command P' to paste the grunge texture into the Channel. It will automatically become black and white, from here you can alter your levels/contrast etc. until the texture is too your liking. Then I click the channel selection button at the bottom of the palette, you should have some marching ants around the whiter areas of your texture. Then go into your layers palette click on your text layer then click the create new layer mask button. Voila, one nice sexy set of grunged up text.</p>
      <p>I have not done much grunge work recently however, I sense it's going out of style. Still I found the method to be the most effective.</p>
    html_clean: |-
