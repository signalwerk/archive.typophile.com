      <p>Aha - layer mask. I knew there had to be something like that in Photoshop. I came up with this grunge effect when I was working on some video design in After Effects. We had to have animated grungy text where the video behind the text had to be visible through the grunge holes. In AE you can use one layer as a tracking matte for the one below it, which would be the equivalent to layer mask in PS.</p>
      <p> - Lex</p>
