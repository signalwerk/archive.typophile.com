  html: <p>Is there a feature in InDesign CS4 that allows you to select all objects of the same color?</p>
  html_clean: <p>Is there a feature in InDesign CS4 that allows you to select all objects of the same color?</p>
comments:
  - id: 317203
    user: 6496
    date: 2008-12-09T21:10:00
    date_raw: 9 Dec 2008 — 9:10pm
    votes: null
    html: |-
      <p>If it's a matter of changing the color of them to another, then add the new color to your swatches and then delete the old color (it'll ask for a replacement swatch to change the old color to a new color, i.e. the new swatch you just added.) </p>
      <p>As for a group selection, I don't believe you can select an object based on color.</p>
