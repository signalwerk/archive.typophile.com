    <p>As a young, budding designer soon to leave the comforts of full time employment, the time has come to wreck the ol' Visa with a massive font purchase.</p>
    <p>My plan?  To purchase FontShop's Top 100 (as well as few more esoteric choices).  So my question is; what is the best/cheapest way to buy the Top 100?  Are their any collections that will get some of the job done at a discount?</p>
