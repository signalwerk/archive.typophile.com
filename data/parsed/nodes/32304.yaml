      <p>Jeff I think I understand the economy that you're trying to achieve, but if you buy a bundle of 50 fonts, of which you end up using only 5 because the rest are all rubbish, then it's a false economy right?</p>
      <p>IMHO, bundled collections <em>always</em> contain deadwood and also-rans. How else to get rid of the inventory? Far better that you build the library of what you think is truly terrific, one face at a time if need be.</p>
      <p>(shameless plug) Fontshops version is a good one, but is not the only <a href="http://www.100types.com" rel="nofollow">list of top 100 typefaces.</a></p>
      <p>I think we'd be collectively much more interested to hear what your <em>few more esoteric choices</em> are...</p>
