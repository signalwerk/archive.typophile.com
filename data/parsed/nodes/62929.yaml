    date_raw: 10 October 2009 - 2:52am
    votes: 0
    html: <p>In the past, I have substituted Arno's small caps for Minion Greek, using the tools of cONtExt or XeLatEX. The results are unexpectedly good, although differences remain [e.g., in  "Y"]. It seems that Arno and Minion have some design similarities. Nevertheless, the absence of Minion Small Caps for Greek is a glaring omission, and I hope that Adobe does something about it.</p>
