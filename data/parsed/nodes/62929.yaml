    html: |-
      <p>A small file to make my point explicit. Greek words are typeset in Arno; the rest is in Minion. I have also replaced Minion Y's for Arno Y's, because otherwise the difference between greek and english would be annoying. Of course, the trained eye will not be fooled(notice the "E"'s, for example, and the difference between O's and Q's), but results are acceptable,  if one makes limited use of small caps...</p>
