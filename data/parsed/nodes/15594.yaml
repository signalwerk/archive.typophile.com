    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : KLIM</strong></p>
    <p><strong>Kia ora!</strong><br>
    <a href="http://www.klim.co.nz/" rel="nofollow">KLIM</a> is a typographic design studio run by <a href="/wiki/Kris%20Sowersby" class="freelinking" rel="nofollow">Kris Sowersby</a>. The KLIM studio has been set up to deal specifically with typographic issues within the realm of graphic design. If you need something that is typographic by nature, then I am at your service. </p>
    <p><strong>A thing well made…</strong><br>
    …is a song by legendary New Zealand band The Mutton Birds. ‘When a man holds a thing well made, there is a connection, there is completeness…’ This philosophy is at the very heart of my approach to typographic design—for art is long and life is short.</p>
    <p>URL: <a href="http://www.klim.co.nz/" title="http://www.klim.co.nz/">http://www.klim.co.nz/</a></p>
