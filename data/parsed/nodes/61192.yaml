      <p>Elegant and minimal is always tasty but i am not getting any feel for the style of music and i think that may be a problem.<br>
      However some of it seems incomplete or unrefined - particularly the track listings and appearance dates.<br>
      Also why is there a seemingly random switch to a serif type for some of it?</p>
      <p>Will</p>
