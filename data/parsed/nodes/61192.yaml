    <p>Hello all,</p>
    <p>I just launched a website for a musician. Rather than over-designing the site with photos, illustrations, and other elements we decided for something elegant and type-driven.</p>
    <p>Please take a look and offer your input. Constructive criticism is welcome.</p>
    <p>The site is <a class="freelinking external" href="http://hannahlindroth.org" rel="nofollow">http://hannahlindroth.org</a></p>
    <p>Thanks!</p>
    <p>Sheraz</p>
