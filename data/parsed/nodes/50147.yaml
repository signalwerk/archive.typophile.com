  html: |-
    <p>Welcome to our third newsletter! :)</p>
    <p>CheapProFonts is still growing. This quarter Derek Vogelpohl (of ShyFonts/Shyfoundry) joined the roster, as well - so now there will be some good text-fonts available in our usual large multilingual character set, too. We hope you will enjoy them!</p>
    <p>In this news release I present 12 fonts:<br>
    - 4 from Derek Vogelpohl<br>
    - 2 from Ray Larabie<br>
    - 2 from Kevin King<br>
    - 2 from Brian Kent<br>
    - 1 from Nick Curtis<br>
    - 1 from myself - and it’s free! :)</p>
    <p></p><div class="imageWrap"><img src="/files/CheapProFonts-NEWS-08-Q3.gif"></div><p></p>
    <p>I have also made a PDF Font Catalog available for download - here you can really zoom in on the details of all our fonts. I am rather proud of the (often) cleaned-up outlines, and the way I have designed and implemented some of the more demanding diacritics :)</p>
    <p>CheapProFonts is dedicated to supplying high-quality OpenType and TrueType fonts for setting “foreign” languages (languages requiring more than the basic A-Z characters) for professional Mac and Windows users.</p>
    <p>Check our site for constant new releases, and see you in the next newsletter!</p>
    <p>Roger S. Nelsson<br>
    —<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
