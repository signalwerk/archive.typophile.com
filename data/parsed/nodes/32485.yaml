    html: |-
      <p>I suspect is is something to do with fonts that were originally style-linked in suitcases, which is the way things were done in the good old days before OS X.<br>
      Perhaps new versions of Acrobat do not recognize the suitcase, within which linking was required to cause italicization to happen.<br>
      But now, the italicization happens due to other font information, however Acrobat thinks that it hasn't happened, so applies a mechanical slant as well.<br>
      Same thing for bold...<br>
      Just a theory.</p>
