    <p>Hi there. This is my first post and I'm nervous! The expertise on this forum is intimidating.</p>
    <p>I'm having a problem with the way Trade Gothic Oblique is printing from PDFs I create in InDesign CS. The Oblique is getting an extra slant, but only when I print from the PDF. The extra slant is not visible in the PDF on screen. It does not have the extra slant when I print directly from the ID file to my Epson 4000 (non-Postscript). When I set the Oblique in a Quark 6 doc and create a PDF file, it prints fine. It seems to be a problem only with the PDFs created in ID.</p>
    <p>Does anyone have any idea how to fix this problem? Thanks in advance.</p>
