  html: <p>Trying to design a logo for a web design company. I am leaning towards a typographic logo but finding it hard to find the <strong>right</strong> one. 1. <a href="http://i.imgur.com/k5RQeB6.png" title="http://i.imgur.com/k5RQeB6.png">http://i.imgur.com/k5RQeB6.png</a> 2. <a href="http://i.imgur.com/3w4l092.png" title="http://i.imgur.com/3w4l092.png">http://i.imgur.com/3w4l092.png</a> 3. <a href="http://i.imgur.com/phAsJAO.jpg" title="http://i.imgur.com/phAsJAO.jpg">http://i.imgur.com/phAsJAO.jpg</a> (This is obviously too complex for a logo but thought perhaps the text on it's own and the pixel art just as part of my branding. Appreciate your thoughts! Any awesome ideas for incorporating undead without getting too gory? Thank you.</p>
  html_clean: <p>Trying to design a logo for a web design company. I am leaning towards a typographic logo but finding it hard to find the <strong>right</strong> one. 1. <a href="http://i.imgur.com/k5RQeB6.png" title="http://i.imgur.com/k5RQeB6.png" class="link-external">http://i.imgur.com/k5RQeB6.png</a> 2. <a href="http://i.imgur.com/3w4l092.png" title="http://i.imgur.com/3w4l092.png" class="link-external">http://i.imgur.com/3w4l092.png</a> 3. <a href="http://i.imgur.com/phAsJAO.jpg" title="http://i.imgur.com/phAsJAO.jpg" class="link-external">http://i.imgur.com/phAsJAO.jpg</a> (This is obviously too complex for a logo but thought perhaps the text on it's own and the pixel art just as part of my branding. Appreciate your thoughts! Any awesome ideas for incorporating undead without getting too gory? Thank you.</p>
