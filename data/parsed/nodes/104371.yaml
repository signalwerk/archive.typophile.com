      <p>It depends on the overall positioning of the company (are they trying to look casually cute, dry professional, cool and creative, etc..), but I think the third option is not bad at all. One option to simplify would be to keep the zombie color and trim it down to a skull/skinny face kind of shape, built out of a handful of pixels. </p>
      <p>With regards to the type, here you can actually try something conventionally "boring" like Benton Sans. A naughty mark + a good traditional type may make for a good combination. At the very least you can always try bold condensed varieties, these tend to be less formal and may work for your purpose.</p>
