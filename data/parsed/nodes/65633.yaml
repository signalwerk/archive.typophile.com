    html: <p>With the exception of Metallica, which IIRC is a heavily-altered Futura, that’s all custom lettering. There are literally hundreds of free fonts in this style but they’re all pretty ugly. In the commercial realm you can get some nice Blackletters in the form of Blaktur and Fakir, but what you should really do is draw the letters.</p>
