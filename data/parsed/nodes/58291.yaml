    html: |-
      <p>Here are a couple versions of what I'm talking about:</p>
      <p>--the original badge is the all-centered version with Times New Roman italics and the bold, larger name in Verdana.</p>
      <p>--the left-justified version has been converted to a standard windows vista (i think) sans serif (in this case, Franklin Gothic--which does not match the interstate font used in logo, but just looks nicer than, say, arial). the logo has been reduced a bit, as it's not necessary to have such a large logo on the badge. i think the left-justified version in all sans is easier to read.</p>
      <p>by the way, the original file generator is a microsoft word badge insert template (3" x 4" badges). all the info is pulled from a general master list created in excel, through word's data merge manager. this is the only efficient way to prepare the badges as participant lists are not finalized until perhaps the day before, and new badges have to be created on the spot by anyone on staff (thus, microsoft word, windows platform...) </p>
      <p>the smaller type is 16 pt; the bold names are 22 pt.</p>
      <p>what do you think? i'm now looking for a standard windows sans serif font that will match the logo font, which is interstate light. ideas? thanks!</p>
