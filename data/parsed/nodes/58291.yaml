      <p>"PC" -- you are talking about <em>Windows</em> fonts.</p>
      <p>Personally, I wouldn't combine a serif italic font with a sans bold font. You could try a small Regular and larger Bold combo. Try Georgia, for example.<br>
      For a sans, if you can be relatively sure Vista is on the machines, Calibri would look nice I guess.</p>
