    html: |-
      <p>I don't think you'll find a super close match for Interstate Light among the MS fonts, but I would generally avoid using exactly the same typeface as in the logo text. Logo text should be distinct from information text.</p>
      <p>If you are using Windows Vista or have Office 2007 installed, consider Corbel for the smaller information text. It is a relatively light sans, so will look okay with the Interstate Light and also provide good contrast with the bolder name text.</p>
      <p>For the names, give Candara Bold a try. It might be too informal for your purpose. On the other hand, it is more personable than most sans, so may be appropriate for names.</p>
