    html: <p>I know I have this image somewhere in my notes but I can't seem to find it. I agree with Thomas, this is heavily bent toward Optima. I can't remember when he drew these. Can you make any dates out Paul? I don't have my copy here at work. Optima however was designed (completed) in 1958, and Dwiggins died in 1956. His hand was not so sure toward the end of his life because of his diabetes so this must be at least from the 30s early 40s. Myfonts mentions that Optima was designed to compete with Ludwig &amp; Mayers Colonia. I wonder when that face was completed. Does anyone know? Can anyone post an image of that?</p>
