    html: <p>If I remember my Caligraphy correctly (it has been 42 years), the Dwiggins sample you posted looks like a variant on Simplehand Roman.  The proportions are different though.  Simplehand was a true Roman proportioned writing.  The Dwiggins above is much more monoproportioned. The "o" and "e" are quite narrow for Roman proportion but strangely the "g" is wider. <br>Actually Thomas has a point as well since Lydian looks a lot like Simplehand as well <br> <br>ChrisL</p>
    html_clean: <p>If I remember my Caligraphy correctly (it has been 42 years), the Dwiggins sample you posted looks like a variant on Simplehand Roman.  The proportions are different though.  Simplehand was a true Roman proportioned writing.  The Dwiggins above is much more monoproportioned. The "o" and "e" are quite narrow for Roman proportion but strangely the "g" is wider. <br>Actually Thomas has a point as well since Lydian looks a lot like Simplehand as well <br> <br>ChrisL</p>
