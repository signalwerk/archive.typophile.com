  html: <p>Hello, I am sending you a typeface (unnamed so far) that I have designed. It is the first time I undergo a project such as this and I am overall quite inexperienced in the field of typeface design. Because of this, I would greatly appreciate any comments you may have; from the simplest details to the most advanced observations - all will be of great value to me at this point. <br>  <br>My intention is for this to be a modern style font, corresponding to a Demi version. I am not sure I will ever create it</p>
