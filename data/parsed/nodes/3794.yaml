    html: <p>See the little wiggle in the top of the a &amp; the bottom of the e &amp; g? What about putting that on the top of the s, the &amp; z, 2 &amp; 4? Also the crossbar of the E. I would like to see the 3 with a curve on the bottom - it might look sweeter. The cap J really bugs me. It looks comic book like where the rest of the glyphs are maybe a combination of routed-out desk nameplate &amp; something arts &amp; crafts... What about making the bottom of the 3 end abruptly?</p>
