    html: |-
      <p>I would say that reinis was very articulate in describing the problem in the Logomark. The symbol though is just beautiful. I know it's tricky here to create contrast between "Red Door" and "Design" cause it's really one big title "Red Door Design", but what bothers me the most now is that there is different stroke widths in the two sizes, one way to fix that is to use all caps on one line and "real" small caps on the second but then what the "sloppiness" reinis is mentioning will still be there.<br>
      Best solution is to ditch the word "Design" altogether or to give it far less importance in the mark.</p>
