      <p>I'm interested to hear if other people agree with you on this one. Maybe my eye is off, but I happen to think that having too much contrast within the type itself will detract from the simplicity and stability, and make it look unprofessional, not the other way around. I guess the point is moot though, since I won't be using it anyway.</p>
      <p>I tried a few different text treatments to the bottom line to create some more contrast and interest, but nothing really worked out. I didn't want to spend too much time on it. Maybe I need to abandon the Charlemagne font for something with more weights/styles.</p>
