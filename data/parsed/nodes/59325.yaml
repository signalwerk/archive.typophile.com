    <p>... your idea turns out to be not as original as you thought? I had foolishly decided to call my freelance “agency” Red Door Design. If only had I Googled it first, I would have found out just how many other people had the same idea. Shoot, I even had a logo. </p><div class="imageWrap"><img src="http://typophile.com/files/reddoor_6611.jpg"></div><p></p>
    <p>Edit: Is there a way to use curly quotes in the subject?</p>
