    date_raw: null
    votes: null
    html: |-
      <p>Perhaps he is referring to the way that turning off font-smoothing at a small size threshold and rendering tiny text as a high-contrast pixel-font bitmap will render C, for instance, as three straight lines, with no "semi-serifs" at the terminals.</p>
      <p>This is not font-specific; however the distinction for Verdana is that the small-size bitmap was designed that way, with separate size-specific forms, rather than having the pixel-font as a compromise or adjustment made to the "proper" higher-res iteration.</p>
