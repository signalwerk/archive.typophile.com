  html: |-
    <p>I'm reading Ari Davidow's essay “Computer screens are not like paper: typography on the web”, which was published in Computers and Typography 2. In his essay he writes,</p>
    <p>“...Verdana is a masterpiece of font design, a sans serif at small sizes where each pixel is critical, and a <strong>semi-serif in larger sizes</strong>.”</p>
    <p>Is there, or was there once upon a time, a semi-serif version of Verdana?</p>
