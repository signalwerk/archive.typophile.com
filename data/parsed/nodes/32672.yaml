    html: |-
      <p>I've been delving into my archives Mike. I remember doing a kern and space job on this for M&amp;C Saatchi in 1999. I think it may have been custom designed especially for Asprey and Garrard (Royal warrant jewellers). On my key map print out the copyright notice reads '1995 dtp Types Ltd', which I happen to know is run by Malcolm Wooden. I can find no mention of Livorno on their website.</p>
      <p>It's a pretty classy font with tall ascenders (or smallish x-height, depending on how you look at it) and a very long tail on both the cap and lower case y. It may be based upon an old typeface but I have no idea what it could be. It's a shame it isn't generally available.</p>
      <p>Nick Cooke</p>
