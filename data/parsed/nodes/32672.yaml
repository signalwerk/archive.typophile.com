      <p>Thanks for the information Nick. It reminded me of Colwell, which Nick Curtis has revived as <a href="http://www.myfonts.com/fonts/nicksfonts/mckenna-handletter-nf/" rel="nofollow">McKenna Handletter</a>. I have always been attracted to the antique typefaces with the low x-heights, so it was bugging me that I couldn't find a match for it. Now I know why.</p>
      <p>- Mike Yanega</p>
