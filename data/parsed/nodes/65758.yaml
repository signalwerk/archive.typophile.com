      <p>This <a class="freelinking external" href="http://developer.apple.com/textfonts/TTRefMan/RM06/Chap6glyf.html" rel="nofollow">Apple documentation</a> shows the basics, in quite short sentences ;-)</p>
      <p>Do you want to render the font data yourself as outlines? That's really hard. If you don't want to get involved into extremely low level programming, you can always use the <a class="freelinking external" href="http://www.freetype.org/" rel="nofollow">FreeType</a> libraries to load and rasterize (= convert from math outlines to a bitmapped image) fonts. FreeType can create a monochrome or grayscale image of any character, so all you have to do is write a function to put it up onto your display.</p>
