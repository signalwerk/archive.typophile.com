      <p>Ah -- okay. The <a class="freelinking external" href="http://www.microsoft.com/TRUETYPE/OTSPEC/glyf.htm" rel="nofollow">Microsoft page</a> is a little less vague on this subject.</p>
      <p>Apparently, the number of flags should be equal to the number of <em>points</em> in one glyph. However, Bit 3 specifies a "repeat" of the current flag value, and the number of repeats is in the next byte in the same array. So if you have 10 points defining the glyph, its flags may be</p>
      <p>0: <em>some flags for pt #0</em><br>
      1: <em>some flags for pt #1</em> + "repeat" bit set<br>
      2: a literal value "8"<br>
      3: <em>some flags for pt #9</em></p>
      <p>.. so the table only has 4 bytes but defines flags for all 10 points.</p>
      <p>At least, that's what it sounds like. It's not really clear from this page what the difference is in "number of contours" and "number of points" -- the number of contours is specifically declared in the first table, and the number of points could be the same.</p>
