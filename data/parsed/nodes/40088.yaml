    html: <p>I have tried sending regular newsprint paper through a small office photocopier, basically the same printing technology as a laser printer, and found that the toner won’t stick tightly to the smooth surface. This was useful for a certain transfer technique, but not for general purposes. Fortunately it didn’t jam the feed mechanisms, but I feared it would because of its light weight and limp body. I have not tried rough surfaced newsprint (such as that in artists pads), though I suspect the loose fiber in the surface might cause other problems.</p>
