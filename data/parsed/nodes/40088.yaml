    html: <p>As a former seven-year Kinko's vet., I would suggest finding a small Canon copier with a by-pass tray. Those little copiers were amazing with the types of paper that would work! I tried everything from handmade paper to tissue paper. Viola! The hard part will be to first find one and two your stock size. The copiers I am referring to had an 8.5 inx 14 in max sheet size.</p>
