    <p>Hi</p>
    <p>I have a pretty big problem. I need to find a stock that feels/looks like newsprint but can be sent through a laser printer. If anyone had any experience like this, or if you know of any paper stocks that simulate newsprint please let me know.</p>
    <p>Thanks!</p>
