      <p>"Jenson" will always be significant, because it is the definitive roman type.<br>
      A great many type designers do their version (mine is Goodchild/Nicholas), presumably because engaging the <em>fons et origo</em> provides insight into why the typographic letter is shaped the way it is.<br>
      Do art directors and graphic designers feel similarly inclined? What has prompted you to use it (or similar Venetian), Tiffany?</p>
