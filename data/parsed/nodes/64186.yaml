    date_raw: 13.Nov.2009 10.28am
    votes: null
    html: <p>Not only is Jenson the root of our Latin type, it’s the typeface used in the roots of great printed book design. Jenson’s books were exquisite; his paper, proportion, and typesetting are simply fabulous. So as long as there are books, there will be book designers who have sought out Jenson’s work and let it influence theirs.</p>
