    <p>This flower handset is a beautiful composed, highly detailed, alphabet complete with numbers and special characters like an ampersand &amp; or @ sign, designed by Novo Typo, designers from Amsterdam, The Netherlands.</p>
    <p><a href="http://www.youworkforthem.com/font/T3188/nt-fall" title="http://www.youworkforthem.com/font/T3188/nt-fall">http://www.youworkforthem.com/font/T3188/nt-fall</a></p>
    <p>NT Fall is a handset typeface collection of 43 images in high resolution RGB on a 26 x 26 cm format on 300 dpi (3072 x 3072 pixels). All images are jpeg or png documents, placed on a seperate layer, on a transparant / background.</p>
    <p>Please notice; NT Fall is not a systemfont.<br>
