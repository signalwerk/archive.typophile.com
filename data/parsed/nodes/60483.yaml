  html: |-
    <p>Hello,</p>
    <p>I'm desperate to find out if there's a digitised version of this font. It's on a Cavillini Papers poster of butterflies. Apologies for the poor quality of the photo - I tried to find the poster on the Cavallini website but without luck.</p>
    <p>I suspect it's not a font as such, as each letter looks individually handwritten, but wondered if there was a chance someone had done some kind of reproduction of it.</p>
    <p>Many thanks.</p>
