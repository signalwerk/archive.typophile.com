      <p>Thanks guys. I stared working with #1, because I can really nicely incorporate it into main material: magazine...</p>
      <p>Client also likes #2 more, so I guess I'll have to come up with something in the line of #2.</p>
      <p>@epsilicon: #2 is done using golden section, so it should be balanced. :) Your suggestion looks very nice, but reminds me of diamond. That is exactly what I don't want to achieve. As stated in the title "... not fashion". Don't you think that lines coming together into one point could be problematic? Lines normally tend to blend when tapered at very close distance...?</p>
      <p>@hola: Thanks... I like #1 as well... But as said... It's not meant to be. Maybe I'll be able to convince the client somehow.</p>
      <p>@bendy: bird association could be something I could use. Freedom. Publication will use lots of white space... So free... Nice one. Thanks.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
