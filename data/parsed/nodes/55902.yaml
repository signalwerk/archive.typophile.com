    <p>Hi.</p>
    <p>I have a special request to create a logo that should be upscale/aristocratic but shouldn't reflect fashion. I ruled out any script treatment (fashion related). I don't want to go with just some sans serif loosely spaced type, but would like to choose a font that would have nice subtleties like Phaistos from FontBoureau, but can't use this particular one.</p>
    <p>I could also use any other without those nice details and change it myself. Anyway. Do you have any suggestions for font choice and/or logo treatment.</p>
    <p>Any other suggestions welcome as well</p>
  html_clean: |-
