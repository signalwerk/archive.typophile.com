  - id: 335405
    user: 14722
    date: 2009-03-16T16:10:00
    date_raw: 16 Mar 2009 — 4:10pm
    votes: null
    html: <p>Typefaces are mostly irrelevant when it comes to projecting the concepts like upscale or luxury. A real upscale brand can use anything and get away with it because it will be printed on great stock, be advertised in great magazines, be photographed by excellent photographers, and sold in great stores with great locations. Looking upscale is the result of attitude, planning, and having lots of resources to throw at the problem. Typefaces don’t solve that kind of design problem and when people on a limited budget try to look upscale it doesn’t fool anyone who has the money for the product.</p>
    html_clean: <p>Typefaces are mostly irrelevant when it comes to projecting the concepts like upscale or luxury. A real upscale brand can use anything and get away with it because it will be printed on great stock, be advertised in great magazines, be photographed by excellent photographers, and sold in great stores with great locations. Looking upscale is the result of attitude, planning, and having lots of resources to throw at the problem. Typefaces don’t solve that kind of design problem and when people on a limited budget try to look upscale it doesn’t fool anyone who has the money for the product.</p>
