    <p>Peter Reichard is founder of the graphic bureau <a href="/wiki/Typosition" class="freelinking" rel="nofollow">Typosition</a> – embassy for typography and design in Offenbach, Germany. In 2002 he started to publish the <a href="/wiki/spatium" class="freelinking" rel="nofollow">spatium</a> magazine for typography. He is also member of the <a href="/wiki/TypeOff" class="freelinking" rel="nofollow">TypeOff</a> collective.<br>
