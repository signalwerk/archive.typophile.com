    html: |-
      <p>If you do what I do—type the kerning value in—you never see the line.</p>
      <p>I usually have ten characters in the Kerning Window at one time—e.g., AABACADAEA—so I can type and tab in rapid succession through nine pairs. Sometimes, my original guesstimates are off, but it only takes going through a few of these strings to get the hang of guessing more or less correctly.</p>
      <p>If I get it wrong, I just continue through the text string to the end, and tab back to the trouble spot to tweak. Hence, no lines and a brisker pace.</p>
