      <p>Wayne: ‘<em>I sometimes wonder whether it's better to kern at sizes closer to reading size […]</em>’<br>
      &nbsp;<br>
      In my opinion kerning is a reﬁnement <strong>relative</strong> to the spacing, irrespective whether the typeface is meant for larger or smaller point sizes. This automatically implies that kerning can be deﬁned at the highest (read: most convenient) resolution.<br>
      &nbsp;<br>
      FEB</p>
