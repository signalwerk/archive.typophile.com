  html: |-
    <p>Hi all,</p>
    <p>In FontLab Studio 5.0.4, in the metrics window, has anyone yet discovered a way to kern without seeing the kerning line between glyphs? Reason I ask is that I find the line visually interferes with my perception of the kerning pair, and it's tedious to constantly deselect the pair (for perception) then re-select in order to move to the next glyph pair.</p>
    <p>Thanks, Wayne Thompson</p>
