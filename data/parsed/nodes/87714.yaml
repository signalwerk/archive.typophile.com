  - id: 485383
    user: 1262
    date: 2011-11-28T00:17:00
    date_raw: 28 Nov 2011 — 12:17am
    votes: null
    html: <p>ATF, you can't kern at small sizes in the metrics window, because the coarse pixel grid of the screen won't display many kern values and will round others in misleading ways. The larger the type, the closer to native resolution (UPM), the fewer rounding problems and the less distortion. If you want to see the kerning at smaller sizes, back away from your screen.</p>
