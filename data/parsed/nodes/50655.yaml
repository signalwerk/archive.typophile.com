  html: <p>Hello, I am fairly new to typography and I've really developed a liking to it. From reading these forums and others I have gained a new appreciation for letter forms. Now I cannot help but bring that knowledge when I produce documents. I would like to see some samples of beautiful typesetting and document formatting from which I can learn and see as an example. Something along the lines of the Feltron Annual Report, would be a good reference.</p>
