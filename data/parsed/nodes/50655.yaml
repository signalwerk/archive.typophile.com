      <p>The boundary between design and typesetting is somewhat arbitrary. I like to think of the two as a continuum, though there is a reasonably clear demarcation. In addition to all the other elements the designer must handle well, if the designer doesn't also anticipate the difficulties the compositor will face, the piece will not succeed very well. In the same vein, the designer cannot specify every detail, the compositor has to understand the design, and his/her work has to compliment it. </p>
      <p>If that's anywhere near right, you will not get "beautiful" composition (typesetting) without equally good design. The inverse is also true.</p>
      <p>The second point is that what is beautifully done according to one audience -- e.g., those who look at annual reports -- may fall flat when viewed by a different audience -- say, those who enjoy classically made books.</p>
      <p>FWIW</p>
