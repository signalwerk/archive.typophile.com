      <p>My comment was about the academic quality and the fierce way of expression. That I would not use his work for anything academic, as there is obviously a bias and an agenda. </p>
      <p>I agree that one should not produce "inspired" work based on typeface-designs (not the font files of course), which are not in public domain yet, even if it is not illegal. Anyhow this is a question where the problem of "similarity" is a very gray area, and an ideological black&amp;white view does not do justice to this problem. </p>
      <p>One could claim Sterling is a rip-off of TNR, but since it has its unique selling point, and was genuinely crafted, not cloned, most people would see it as a legitimate product, right?</p>
