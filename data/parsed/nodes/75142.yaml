      <p>I am a little unsure, but here I tend to agree with Uli (which is rare indeed). Although I am glad to have Huckleberry, because it means I have a pretty good font ready to hand to visualize this great typeface (I wouldn't even know where to get Mark Twain), I do think that Canada Type should ask those designers still alive whether or not they would agree to having their intellectual property revived.</p>
      <p>I was always glad to have Canada Type, because they basically revive old typefaces which would otherwise, for the most part, not be available on my Mac, and then I couldn't work with them. On the other hand, it does not feel good to know I am using a font which was NOT made with the consent of the designer. There should be some more respect here. I think Rebecca and Patrick are doing good work, saving many of those typefaces I am particularly fond of - but they should really really give more credit to the original designers. It must be quite strange for Gustav Jaeger to read his name on the Myfonts website, although he never consented to have something like Huckleberry made. </p>
      <p>Hmmmmm..... my moral compass does not like it. Although I would of course not put it as rude as Uli did, because I do understand that Rebecca's and Patrick's reasons are by no means purely monetary, I daresay it is close to criminal, nevertheless. Maybe not in a legal way, but certainly in a terms of moral. *sigh*</p>
