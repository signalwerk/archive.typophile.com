      <p>Such as Helvetica and Arial. I'm currently at the beginning stage in my project where my tutor literally wants to see loads and loads of made images, to do that, I need to find typefaces that look similar other than Helvetica/Arial and Palatino/Book Antiqua. It's not about taking the typefaces and saying: This is wrong, this is right, it's about educating and giving a choice. I mean, even Helvetica and Arial have their differences, and the point of the exercise at the moment, is to create as many images as I can to show that, and hopefully be able to move my project on.</p>
      <p>My dissertation is being looked at by my tutor, and I'll be receiving it back soon to edit and rework, so he may bring up various other points anyway.</p>
      <p>I don't know if that helps at all in terms of saying what I'm trying to do, but I hope it does.</p>
