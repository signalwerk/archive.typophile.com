      <p>Knock-offs are only legal in the United States and North American.</p>
      <p>It is illegal to copy the exact design of any typeface in Europe and other parts of the world.</p>
      <p>Monotype was taken to court in Europe and Israel for Arial and the court ruled in every case that each letter was not the same as Helvetica therefore not a 'knock-off'</p>
      <p>This is a pretty good example of North American knock-offs:</p>
      <p><a href="http://www.ascenderfonts.com/foundry/canada-type/" title="http://www.ascenderfonts.com/foundry/canada-type/">http://www.ascenderfonts.com/foundry/canada-type/</a></p>
      <p>These fonts from Canada Type are knock-offs or Eric and Just's Trixie, traditional faces like University Roman and notably the Arthur Baker fonts.</p>
