    <p>(the title isn't what you immediately think, honest!!)</p>
    <p>Hello there,</p>
    <p>I've been a stalker of these forums a long time, and I'm hoping you can all help me with this request.</p>
    <p>A little while ago, I remember reading a journal or a blog someone had written that basically had a long list of "free" downloadable typefaces you could get, but then pointed out that they were exact copies of original typefaces (some of which are default on most computer systems) and this relates closely to my 8,000 word dissertation and FMP that I am researching for my Third Year of University.</p>
    <p>The problem is, I've lost the article between now and then, and only have a handful of examples to work with.</p>
    <p>What I'm asking, is what free fonts do you know of that are confirmed to be rip offs of original typefaces (is original the right word? I hope so). If you know of the article, even, that would great also!</p>
    <p>Thank you for any help you can give me here!</p>
