    html: <p>I can't agree with that statement. Just because people use the same tools and work in the same field does not make them rip-offers. A lot of designers are (at least at first) inspired by their teacher, sometimes to the degree that the works look a lot alike. This is not new, as this was the case already centuries ago, when artists were organised in guilds and transferred their knowledge in a master-student relationship. Inspiration is not the same as ripping of, especially when a lot of people are fishing in the same pond (like in typedesign). And then there is the phenomenon of the revival, working in a specific style (like geometric sansserif). Are all designers that create a new geometric sans-serif be called rip-offers of Futura? It seems silly.</p>
