      <p>"I was surprised not to find anything definitive on the web (just “use a big font”.)"</p>
      <p>That is because, in such a case as this, composition is the key, here represented by the word 'big font'. That is to say, 1,000's of fonts will work just fine... if the one chosen is thoughtfully composed. Details of stroke, serif and width are all subject to the composition of good line length, leading and, in the case of presentation, bulleting sentences where visual interruption of the reading is likely. </p>
      <p>Cheers!</p>
