      <p>I think the legibility issue is far from decided too. Saying that, one factor is certainly line-length, rather than choice of typeface or even size. Taking legibility as a factor inherent in a typeface, (certainly some faces are less legible if not the other way round) maybe something designed for screen might be useful to work out where you are at a glance, even if it looks a bit nasty printed. Big bowls, short ascenders/decenders.</p>
      <p>Mildly (un)connected, there's a story about London Transport testing whether dsetination boards in all caps or initial caps were more legible on London buses in motion and at distance. The tests were performed in the early 20th century. I think it was entirely inconclusive and neither way was more legible than the other. Factors like size and contrast were more important. Today London buses use yellow on black with initial caps. In Johnston of course. I'm not suggesting this it's good to prepare your speaking notes this way though.</p>
