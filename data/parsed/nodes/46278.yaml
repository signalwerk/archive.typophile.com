    <p>What is a good font for reading a speech from a lecturn? I am a professional speaker, and while I usually use point form for my own notes, this question came up when my wife was preparing a two minute speech.</p>
    <p>I was surprised not to find anything definitive on the web (just "use a big font".) </p>
    <p>The desired attributes are easy to read (with or without glasses), easy to find your place if you look up, and one that your eye "flows along."</p>
    <p>My own guess, from my limited (and probably dangerous) knowledge of typography would be a fairly uniform stroke with small serifs, moderate width, and ???</p>
    <p>Thanks.</p>
