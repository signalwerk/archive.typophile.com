      <p>i am increasingly convinced  by emigre's assertion that typefaces are not intrinsically legible; rather, it is the reader's familiarity with faces that accounts for their legibility... </p>
      <p>of course, there are limits to this, but if i were you, i would print out your text in a number of typefaces, sizes and line spaces, and see which ones you find the easiest to read in a 'lectern' environment</p>
      <p>general rules would be generous line spacing, not more than 9 words to a line, and clean, open type</p>
      <p>type that has proved popular when i have provided templates for friends who do a lot of public speaking include palatino, georgia, frutiger, myriad, officina and minion...</p>
