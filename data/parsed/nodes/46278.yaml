      <p>Randy, I agree with all of the above.</p>
      <p>Because of the reading method, I'm not sure that serifs are really that important as long as you choose a typeface that distinguishes confusing characters (cap I vs. lowercase l, for example) and aids quick recognition of character shapes. Signage fonts (humanist sans are often chosen for this purpose) may be a good bet. Web fonts (such as Georgia) might work well, as they are designed to be pretty simple and robust for the screen. Uniform strokes could be good, but a mono-line might not distinguish characters as well as something with a bit of stroke variation.</p>
      <p>But, as David points out, you're spoiled for choice when it comes to fonts. It's the layout that's crucial and more specific to the task. The font will fail or succeed because of it.</p>
