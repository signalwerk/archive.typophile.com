      <p>&gt; Does anyone know if this embedding works with OTF-CFF fonts as well?</p>
      <p><a class="freelinking external" href="http://support.microsoft.com/kb/908475" rel="nofollow">Word won't embed anything with an .otf extension</a>, although it will embed OpenType fonts with a .ttf extension. Also, Word won't embed TrueType fonts unless the font has the right embedding permissions.</p>
