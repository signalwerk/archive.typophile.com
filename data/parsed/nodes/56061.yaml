    <p>Hi all,</p>
    <p>I'm having a tough time finding a font for my husband's (yep-another result of our bad economy) resume. He works or worked in the financial sector. The current resume is in Times and it pains me to look at it, yet I can't find a font that is "strong" enough (his words-he wants it to look strong) to match it. Simple, sophisticated and strong-no sans. So silly, but I think I'm too close to it and afraid to choose the wrong font and sabotage potential job suitors. I'd appreciate any ideas...</p>
    <p>Thanks!</p>
