    html: |-
      <p>Some employers and recruiters require applicants to upload or email resumes as MS Word files. If you use a font the employer doesn't have, Word may default to Courier, so it's best to use a font almost everybody has. I like EK's suggestion of Georgia, because just about everybody has it, but it looks more sophisticated than Times (and the old style figures are a nice touch since your husband is a numbers guy).<br>
      If you're sending a Word file, set it up correctly. Use styles instead of manual formatting. Avoid <em>Based on Normal</em>, as the recipient may have different <em>Normal</em> settings than you do. Never use extra hard returns to create space above headings and list entries; make this an attribute of your paragraph styles. Ditto for indents. Turn on smart quotes.<br>
      And for heaven's sake, spell everything right. Your husband wouldn't <em>need</em> a job if he had a dollar for every "Principle Engineer" out there.</p>
    html_clean: |-
