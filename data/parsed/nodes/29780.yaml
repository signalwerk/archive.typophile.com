    html: |-
      <p>The classic from the 70s, which I think this is probably based on, is David West's Bubblegum. I have a digital version of it, and I'll try to track down the source.</p>
      <p>You could also try the newer <a href="http://www.k-type.com/freebies.html" rel="nofollow">Magical Mystery Tour</a> (#19, a free download), or <a href="http://www.myfonts.com/fonts/typodermic/wubble/" rel="nofollow">Wubble</a>.</p>
      <p>Skylar</p>
