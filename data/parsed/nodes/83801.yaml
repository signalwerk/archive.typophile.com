      <p>Thanks for that TylerEldredge, I did a search but nothing came up like your search results.</p>
      <p>I was given a poem to type up because the writing was so bad you could hardly read it, plus the grammar was off and so on. It was a good opportunity for me to try to make it a showcase on typography. It turned out well (IMO) but he asked me not to post it on the internet. Not for publication.</p>
      <p>Still not entirely sure where to draw the line editing his poem, should I have left it intact with all the 'errors'? Gabriola with stylistic set 5 was used, 'fancy' corners from Indesign, he was impressed. :)</p>
      <p>Cheers.</p>
