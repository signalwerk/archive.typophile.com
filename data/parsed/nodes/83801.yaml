      <p>Interesting!<br>
      Personally, I'm wondering if anyone has seen some outstanding examples of more traditional typesetting of a book of poems (By traditional I just mean "regular" as opposed to concrete poetry, where the design does not alter the meaning of the poems.). One would think that books of poetry by the top contemporary poets would all be designed especially well, but alas this is not the case.  There is a frequent lack of attention to the most basic principles, as well as plenty of "over-designing" with zillions of typefaces, random doodads, recurring clips of the same badly pixelated photo, etc.<br>
      To me one especially difficult element to design in a poetry book is the margins. Many collections have poems that are all flush left but with widely varying line lengths from poem to poem. Many designers seem to ignore this, as though they believe that the right margin setting they typed in the computer will appear as a design element even though no text or other printed element ever aligns with it. Books designed with mirror margins this way look like they have a completely random layout page to page.<br>
      So I would love to hear some nominations for the best poetry book designs out there-- doesn't need to be online examples.</p>
