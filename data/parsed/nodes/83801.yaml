      <p>Not exactly on topic, but —</p>
      <p>The original edition of "How Does a Poem Mean" by John Ciardi (don't know if there's been another edition since) has a very utilitarian, textbooky design that isn't beautiful but works surprisingly well. The edition I have was clearly set in Linotype or Monotype and printed letterpress (you can feel the impression). It's interesting to see how the typographer contends with the scansion markings, which sometimes appear to be drawn in. I wonder if the type was set and printed, the arrows added by hand, and then the sheet photographed and printed as a plate. Although there's nothing particularly nice about the plain and rather quirky design, I have a fondness for it. It does, to address silvers's comment, center each poem on its longest line.</p>
    html_clean: |-
