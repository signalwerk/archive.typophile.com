    <p>My apologies if I have placed this in the wrong place but it somewhat makes sense to place it here. Additionally my apologies as I had previously posted this in the general discussion but it only collected dust there. If some one can explain how to take down my previous post I will.</p>
    <p>Dose anyone know if Egmont Inline by Sjoerd Hendrik De Roos (S.H. de Roos), which was distributed by Typefoundry Amsterdam, was ever digitized? I believe that Linotype might have the rights to it but I can't find it on there website.</p>
    <p>I can't even find a highres sample of Egmont Inline online.</p>
    <p>Any high quality fonts that might be an adequate substitute?</p>
    <p>Thanks in advance.</p>
