  html: |-
    <p></p><div class="imageWrap"><img src="/files/timeto9fight_6213.jpg"></div><p></p>
    <p>Does anyone find it odd they used Bodoni or something similar to title this new book by Senator Jim Webb, former military man, a guy who always looks like he’s chewing bullets?<br>
    To me it sure doesn’t bring up the concept of “fight” - unless it’s a knockdown-dragout in a fashion design house or somewhere similarly elegant. </p>
    <p>I would’ve used something aggressive yet dignified. Any suggestions?</p>
