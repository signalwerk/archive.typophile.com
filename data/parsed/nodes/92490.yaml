    <p>Dear Typophiles,</p>
    <p>On 7th May, we'll make small internal celebration for our 3rd birthday since we published our first font family under our label – Tour de Force Font Foundry.</p>
    <p>We would like you to suggest one our font family that you'd like to see with discount 50% off!</p>
    <p>The list of font families can be found here:<br><a href="http://www.tourdefonts.com/font-catalog/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.tourdefonts.com/font-catalog/</a></p>
    <p>Place your vote on Twitter (<a href="https://twitter.com/#!/tourdefonts" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">https://twitter.com/#!/tourdefonts</a>) until 4th May, we'll count them all and choose the one most voted and make it available for the 7th May only. </p>
    <p>We'd like to thank all nice people we met (mostly online), experiences they shared, things we learned and all our old and new customers.</p>
    <p>Thanks all.</p>
    <p>- Dusan</p>
    <p><em>* Discount will be only available trough MyFonts, since their easy step-by-step promotion assistance.</em></p>
