    <p>Hi all,</p>
    <p>I am looking for a color laser printer that will allow me to produce high quality proofs of my work on A4 before i send off to the printer.</p>
    <p>I am looking at Dells range of laser printers, I see they all do 600x600dpi any other designers out there got any experience with their printers?</p>
    <p>Any help would be cool</p>
