      <p>If /X/ uses slanted strokes, /S/ should as well to balance it.</p>
      <p>Characters /EXO/ seem narrower than /UA/.</p>
      <p>/X/ needs 90° stroke cut at the ends or others need angles.</p>
      <p>/O/ (and probably /E/ as well) seems shorter than /U/ which seems much taller.</p>
