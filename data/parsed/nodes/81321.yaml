      <p>Hi Dunwich. Yeah it was a mess but I think I've got it under control now. Thanks for your help.</p>
      <p>Hi again Mr. Simonson!</p>
      <p>I'll repeat what I just wrote on our fontlab forum:</p>
      <p>"Yep. You're right. The problem was in my classes. They were all messed up. This is my first font, and while I was working on it, I wound up really messing some things up. The only thing that finally fixed it for me was to go back to a previous version and copy and paste glyphs from the new one into that. From now on I will be more careful. Live and learn. Now I don't get any error messages, but I'm still copying and pasting and realigning glyphs right now."</p>
      <p>Yeah it would be nice if fontlab would warn you ahead of time when you make errors in the classes panel. Especially if you're new to kerning and classes like me.</p>
      <p>Thanks again Mr. Simonson. You've really helped me out in the past too and I appreciate it.</p>
