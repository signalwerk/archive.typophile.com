    <p>When I generate my new font I get these [WARNING] messages and I don't know what I am supposed to do about them.</p>
    <p>Does anyone know what these warnings in the output Panel mean or how to fix the problems? Thanks in advance!</p>
    <p>1:<br>
    [WARNING]  Pair positioning has two different values in 'kern' feature; choosing the smaller absolute value: Abreve<br>
    [WARNING]  Pair positioning has two different values in 'kern' feature; choosing the smaller absolute value: Abreve </p>
    <p>YES, IT SAYS THIS TWICE IN A ROW for some reason.</p>
    <p>I get several of these duplicate warnings. About ten pairs or each problem glyph: Abreve, Aogonek, Emacron, Ebreve (there are 4 duplicates of that warning), Edotaccent, Eogonek, Ecaron, OE, Tcommaaccent, Tcaron, and Tbar.</p>
    <p>2:<br>
    [WARNING]  Start of new pair positioning subtable; some pairs may never be accessed: [A Agrave Aacute Acircumflex Atilde Adieresis Aring Amacron Abreve Aogonek] [S Sacute Scedilla Scaron ] [/Users/admin/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 3019]</p>
    <p>I get tons of these warnings for various glyphs.</p>
    <p>3: (This is not a warning. It's a note.)<br>
    [NOTE]  Removing duplicate glyph &lt;&gt; [/Users/admin/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 3029]</p>
    <p>I get tons of these warnings for various glyphs.</p>
