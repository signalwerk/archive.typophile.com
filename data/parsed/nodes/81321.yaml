    date: 2011-04-18T06:23:00
    date_raw: 18 Apr 2011 — 6:23am
    votes: null
    html: |-
      <p>A glyph may be placed into a left AND a right kerning class OR a kerning class that applies to both sides of a pair. Place it into any more kerning classes than that and you will get errors.</p>
      <p>It sure would be more helpful of FontLab to warn when you make the error rather than wait until you build the kern feature and try to compile, which may be long after you made the error. Short of that, the only solution is to be very careful when setting up your kerning classes.</p>
