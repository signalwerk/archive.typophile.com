    <p>I’ve been working on the MetaPhile concept off and on since November. It does not represent any sudden rush of work. In fact, I’ve mostly been putting it off, but over a great deal of time I assembled several index cards’ worth of ideas into 19 (now 20) distinct bug reports.</p>
    <p>As ever in bug reporting, we file <em>one bug per report</em> to avoid mixing apples and oranges. Check <em>any</em> bug-tracking system.</p>
    <p>I indeed did not embark on a parallel project of listing everything salutary about Typophile. This is a bug-reporting project. I’m not here to reinforce your own impressions of how fabulous Typophile is. I repeat: If you never even noticed these problems, you won’t notice when they fix them, either.</p>
    <p>As a member of this site and just as an informed member of the citizenry, I do in fact have a right to submit these bugs. The fact I don’t run the site or pay for it means nothing. The people who do and do needed a few corrections along the way. And since I am now not the only one filing MetaPhile bugs, I see I must have been on to something all along.</p>
    <p> I don’t <em>have</em> to use a tone you like. But you aren’t fooling anybody: There <em>is</em> no tone you’d like when reporting bugs or when in any way advancing the idea this place is less than perfect. There is <em>precisely no tone I could have used</em> that would have met with your approval. A lot of you have shown your true colours in the last day, resorting to personal attacks that Typophile administrators (not “moderators”) agree with and will allow to remain online. I’d say my tone isn’t the problem.</p>
    <p>It’s up to the administrators (not the “moderators”) of this site to create a separate MetaPhile forum and move these postings there.</p>
