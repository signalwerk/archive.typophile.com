      <p>Norbert</p>
      <p>The first book on printing, Mechanick Exercises on the Whole Art of Printing, by Joseph Moxon, 1683–4, mentions colour. </p>
      <p>Good Colour. Printed neither too Black or too White.</p>
      <p>Pale Colour. If there be not Blacking enough in the Inck, or the Form be Beaten with too Lean Balls, the Work will be said to have a Pale Colour.</p>
      <p>A note on some of these terms. The form would be the page of metal type. Ink balls were used to print with (rollers weren’t used until the early nineteenth century).</p>
      <p>Gerald</p>
