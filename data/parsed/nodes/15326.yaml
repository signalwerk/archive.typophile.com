    <p>My turn for a dumb question.</p>
    <p>Yes, we know that the typographic term <em><a href="/web/20081011042402/http://typophile.com/wiki/color" class="wiki">color</a></em> refers to the level of gray of a block of text.</p>
    <p>But how or why did the word “color” come to mean that in typography. Obviously the use of colored inks in printing pre-date the use of movable type, and lettering in manuscripts were also in various color inks or tempera.</p>
    <p>Was the term “color” actually derived from another word, language or term much in the same way as “font”? I am actually interested in knowing since many students don’t seem too satisfied with the conventional answer of “color” means grayness.</p>
    <p>Does anyone know of an historic reference and not just a speculative answer?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081011042402/http://typophile.com/node/15455" class="topic-previous" title="Go to previous forum topic">‹ Beauchamp: Pronounced “Rip-off”</a> <a href="/web/20081011042402/http://typophile.com/node/15437" class="topic-next" title="Go to next forum topic">Sam Welo and Fred Drake ›</a></div>
