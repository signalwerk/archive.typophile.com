      <p>“The density of texture in a written or typeset page is called its color. This has nothing to do with red or green ink; it refers only to the darkness or blackness of the letterforms in mass. Once the demands of legibilty and logical order are satisfied, eveness of color is the typographer’s normal aim. And color depends on four things: the design of the type, the spacing between the letters, the spacing between the words, and the spacing between the lines. None is independent of the others.”</p>
      <p>“Color  The darkness of the type as set in mass, which is not the same as the weight of the face itself. The spacing of words and letters, the leading of lines, and the incidence of capitals, not to mention the color (i.e., darkness) of the ink and of the paper it is printed on, all affect the color of the type.”</p>
      <p>—Robert Bringhurst<br>
      The Elements of Typographic Style</p>
