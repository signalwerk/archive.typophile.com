      <p>Very true, Chris.<br>
      Type and typography had always been part of the printer craft and guild. The mixing of inks, the eveness of printed impressions, the consistency of ink color and impressions from folio to folio, all this was controlled with great understanding of technique and technology.</p>
      <p>That’s why I find the terms “color,” Grauwert or tono off-the-mark in trying to describe the subtle yet complex levels of visual effects created by adjusting letter or linespacing, point size, column widths, selection of typeface, weight of typeface, and so on and so on...</p>
      <p>In other words, EVERYTHING that typography involves is contained within the single term <em>color</em>. It embodies more than just the <em>grayness</em> of blocks of copy, but also the texture created by the glyphs themselves, dazzle, spikeyness, flow, <em>textura</em>.</p>
      <p>It just dawned on me... maybe because the “secrets” of the Guild kept the terminology obtuse because it indeed embodied all the mysteries of typography.</p>
      <p>————————————————————-<br>
      Yes, I’m old, but I’m colorful!</p>
