      <p>I’m sorry, but you’re having the same problem they’re having: not managing to express what you mean. Texture, color, rhythm, all mish-mashed together. And although the intent is fine, I have to think that part of the problem is a failure to grasp the central role of <cite>unevenness</cite> in communication. And this is very much a symptom of Modernism (which goes way, way further back than the 20th century btw, it was just called other things, like “The Enlightenment” for example). Grandiose, misguided phrases.</p>
      <p>“Color” doesn’t have to be ambiguous or confusing - it just has to be used well.<br>
      Same goes for “even”.</p>
      <p>hhp</p>
    html_clean: |-
      <p>I’m sorry, but you’re having the same problem they’re having: not managing to express what you mean. Texture, color, rhythm, all mish-mashed together. And although the intent is fine, I have to think that part of the problem is a failure to grasp the central role of <cite>unevenness</cite> in communication. And this is very much a symptom of Modernism (which goes way, way further back than the 20th century btw, it was just called other things, like “The Enlightenment” for example). Grandiose, misguided phrases.</p>
      <p>“Color” doesn’t have to be ambiguous or confusing - it just has to be used well.<br>
      Same goes for “even”.</p>
      <p>hhp</p>
