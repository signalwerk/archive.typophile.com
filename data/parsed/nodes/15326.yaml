      <p>&gt;not managing to express what you mean</p>
      <p>I would say rather that you are not reading what I wrote, but some fantasy of an opponent. I said the term ’color’ is not very descriptive, but that it refers to something real, and the challenge is to explain it. </p>
      <p>Letter forms are diverse, and obviously deliberately, so that one letter is distinguishable from others. The H and the O don’t look alike. But when you space a string of Hs and Os for a typeface, you aim at a quality that typographers and type designers have sometimes called ’even color’. In ’Letters of Credit’ Walter Tracy uses the words ’harmony’ and ’balance’ to refer to this, rather than ’even color’. Others speak of the volume of space between the letters being uniform—though what that volume is is somewhat hard to define (how far does the volume extend into the ’c’?). What is aimed at is a visual quality that practiced typographers will have a large degree of agreement on—such on what constitutes ’good’ kerning—what, yes achieves ’even color’.  </p>
      <p>’Evenness of color’ is not a phrase that denies diversity, but rather tries to express in a not very clear phrase a visual harmony and balance in a diverse group of symbols on a page. </p>
      <p>***</p>
      <p>By the way, your view that the Enlightenment was opposed to diversity is balderdash. Before the Enlightenment Europeans were busy killing each other over which version of Christianity should be imposed on everyone. The Enlightenment supported freedom of opinion, tolerance and diversity.</p>
