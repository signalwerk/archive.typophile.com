      <p>The way Felici uses the word ’color’ it includes balance of black and white, not even gray. Here is more Felici:</p>
      <p>“If there is an essential truism in typesetting, it is that a page contains no voids, only spaces between printed elements. The essence of typesetting is regulating the size of those spaces to control the balance and rhythm between black and white. This is the key to a graphically harmonious page—one with good *type color*—as well as to text that is pleasing and easy to read.”</p>
      <p>It is an even texture, not a uniform grey that is aimed at in the idea of “even color”. </p>
      <p>I am not saying that “color” is all that satisfactory term. As Norbert points out in the beginning of this thread, it is not very descriptive or clear. But if you are saying that “even color” doesn’t refer to something real and important in type, I think you are very off base. Typographers have known what it refers to—an important quality in type and page design and composition—even though they haven’t perhaps ever explained it well. </p>
      <p>And it has nothing to do with modernism. I’m pretty sure the phrase ’evenness of color’ predates 20th century modernism.</p>
      <p>The people who have been working daily to produce evenly colored pages know what they are referring to. It is not bogus. The question is how to explain it more clearly and fully.</p>
