      <p>So, in comparison to the range, detail, descriptive and technical terminology used by type design, typography suffers from both lack and vagueness of descriptive terminology.</p>
      <p>This has been my main point, and also the reason why it is difficult to make graphic designers aware of the nuances and <em>visual refinement</em> that can be made to blocks of copy.</p>
      <p>Typographic training rarely goes beyond basic typesetting techniques. Why? Because it is easier to describe and even easier to implement nowadays. </p>
      <p>Pick the typeface, point size, linespacing, tracking (letterspacing) and column widths and you are done. OR open the leading, tighten the letterspacing, and pick a lighter weight of the typeface and “Oh my gosh!” I’ve changed the <em>color</em>.</p>
      <p>Much of typographic terminology is really just markup and proofing notation with a little bit of type design speak. The more sophisticated levels of typography use <em>warm-fuzzy/cold-prickly</em> descriptions which are difficult to describe without explicit illustrations.</p>
