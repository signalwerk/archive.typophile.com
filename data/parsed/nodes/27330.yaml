      <p>I agree with the Chalet Paris 1970 ID, particularly because of the S shape. The Chalet family was based on Bauhaus-related fonts and Avant Garde Gothic (apparently). I was thinking ’Pump light’, but it’s not this light and the S and c don’t match well.</p>
      <p>Odd that you would forget if you had Chalet, though.</p>
      <p>- Mike Yanega</p>
