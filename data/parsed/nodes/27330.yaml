    <p>I did something really stupid. I forgot to save all of my photoshop/illustrator files when moving from a PC to a Macbook Pro for design this past month.</p>
    <p>I lost a design I was working on, and the font I was using with it.</p>
    <p>Can anyone ID the font used for the logo here: <a href="http://substruct.subimage.com/" title="http://substruct.subimage.com/">http://substruct.subimage.com/</a></p>
    <p>I think it’s in the Bauhaus family, but the ITC Bauhaus isn’t a direct match. The closest thing I can find on my computer is Bauhaus93, but the weight is way too heavy. I remember having multiple weights of this font, as I also created a heavier version of the logo, but not as heavy as Bauhaus93.</p>
    <p>Notice it’s close to ITC Bauhaus, but the S is shaped differently, and the lowercase b is connected all the way through.</p>
    <p>Can anyone help???</p>
