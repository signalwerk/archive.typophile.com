    html: <p> Sure, it's a pretty common term.  It refers to relief carvings where the sculpted image (like a head or face) is cut in a layer that contrasts with the background layer - i.e. a different colour. <br> <br>It's also used to mean a small role played by a famous actor in a play or movie. <br> <br>Paul </p>
