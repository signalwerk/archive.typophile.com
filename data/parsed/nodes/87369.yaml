    <p>I have two projects right now that call for a solid Arabic font, and am having trouble finding a solution. It may be two separate fonts or one that does it all. </p>
    <p><strong>DESCRIPTION OF PROJECTS</strong></p>
    <ol>
    <li>The first project is a series of religious brochures that are text-heavy.<br>
    		The logo for this project is in decorative Thuluth calligraphy.</li>
    <li>The second is a series of Nasheed-like videos that will display Arabic text during the audio narration.<br>
    		The logo for this project is in the Ruq'a script.</li>
    </ol>
    <p><strong>TYPOGRAPHIC MATCHMAKING v.s. Traditional</strong><br>
    I don't want to create a big brouhaha here. I'm just open to either approach. My main concerns are:</p>
    <ol>
    <li>Readability<br>
    	Print project needs to be easy on the eyes at small sizes.<br>
    	Video project needs to be easy to read on screen.</li>
    <li>Traditional<br>
    	Both fonts need to harmonize with traditional Islamic or religious content. But it must appeal to progressive thinkers too, so going outside the constraints of old-school traditionalism is fine.</li>
    <li>Affordability</li>
    </ol>
    <p>All of the Matchmaking fonts I have seen so far don't seem to fit as they appear too modern. But I love how matchmaking includes the Latin counterpart.</p>
    <p><strong>TASMEEM?</strong><br>
    I have an old copy of Tasmeem and only have the Emiri font. To me, this font, while beautiful, seems a little difficult to read at small sizes. Correct me if I'm wrong. At this point, the projects cannot justify the expense of upgrading Tasmeem and InDesign. </p>
    <p><strong>MULTIPLE WEIGHTS</strong><br>
    Both projects need the ability to have multiple weights. There needs to be a medium, light, bold, etc. I would prefer to find a family that has at least four weights. If there are strong opinions against doing multiple weights with Arabic, please explain your opinion. I'm open.</p>
    <p>And perhaps I need to get a couple different fonts…one for body copy and one for titles and headings. </p>
    <p><strong>SERIF/SANS SERIF</strong><br>
    I would assume this font needs to have serifs. </p>
    <p>So far, I have only considered:<br>
    <a href="http://www.rosettatype.com/Nassim" title="http://www.rosettatype.com/Nassim">http://www.rosettatype.com/Nassim</a><br>
    It seems to fit some of these constrains, but to me it appears more editorial than traditional.</p>
    <p>Looking forward to your recommendations, wisdom, advice, and of course, bulbs and flowers.<br>
    –paul</p>
