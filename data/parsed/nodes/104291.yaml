    <p>It’s been raining heavily in New York’s Hudson Valley for what seems like weeks now. Oppressive humidity has blanketed the air with a thickness that thwarts all efforts to be a productive member of society. And the extended forecast doesn’t indicate it is going to end anytime soon.<br><img src="/sites/default/files/old-images/weather_3950.png"></p>
    <p>Today’s long-awaited announcement of <a href="http://www.typography.com/cloud/welcome/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Hoefler &amp; Frere-Jones’ Cloud.typography</a> came as a welcomed procrasti-distraction from the constant hum of desk fans, window ACs and cranky, bored offspring. </p>
    <p>Since plenty will be written by more <a href="http://typographica.org/on-typography/my-favorite-font-sources-a-shortlist-of-trusted-foundries-and-retailers/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">credible folk</a> about H&amp;FJ’s jaw-droppingly impressive webfonts, let’s talk about other sorts of Cloud Typography, during this week of cumulous typographic activity. </p>
    <p>The Cloud Appreciation Society boasts, well, an unabashed love of clouds. Member Danièle Siebenhaar offers an ambitious collection of <a href="http://cloudappreciationsociety.org/letters-in-the-sky/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">clouds that look like letterforms</a>, amongst other recognizable shapes (a sleeping baby, for example).<br><img src="/sites/default/files/old-images/a-z_of_clouds_6246.jpg"></p>
    <p>I'm digging the F and the Z but that R is a bit suspect.</p>
    <p>I bet you were just thinking to yourself, “Gee, I wonder if there are some awesome examples of ASCII art clouds?” <a href="http://ascii.co.uk/art/clouds" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Look no more</a>. </p>
    <p>This is exactly what yesterday’s thunderstorm looked like. EXACTLY.<br><img src="/sites/default/files/old-images/asciicloud_6010.png"></p>
    <p><a href="http://www.retrojunkie.com/asciiart/nature/clouds.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ASCII Art—Nature—Clouds</a>.</p>
    <p>Unicode character for ‘cloud’? U+2601. ☁</p>
    <p>Ugly typography word clouds? <a href="http://There’s plenty of those" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://There’s plenty of those</a>.</p>
    <p>Scott McCloud’s comic fonts? <a href="http://www.myfonts.com/fonts/comicraft/scott-mccloud/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sure</a>. </p>
    <p><a href="http://Bob Ross painting happy clouds" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Bob Ross painting happy clouds</a>? </p>
    <p>Ok, a little off topic there.</p>
    <p>As you can see, H&amp;FJ is clearly going to encounter an uphill battle seizing that coveted number one spot in a Google search of “cloud typography”.<br><img src="/sites/default/files/old-images/googlesearchcloud_5006.png"></p>
    <p>Nevermind.</p>
