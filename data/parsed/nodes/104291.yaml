    <p>It’s been raining heavily in New York’s Hudson Valley for what seems like weeks now. Oppressive humidity has blanketed the air with a thickness that thwarts all efforts to be a productive member of society. And the extended forecast doesn’t indicate it is going to end anytime soon.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/weather_3950.png"></div><p></p>
    <p>Today’s long-awaited announcement of <a class="freelinking external" href="http://www.typography.com/cloud/welcome/" rel="nofollow">Hoefler &amp; Frere-Jones’ Cloud.typography</a> came as a welcomed procrasti-distraction from the constant hum of desk fans, window ACs and cranky, bored offspring. </p>
    <p>Since plenty will be written by more <a class="freelinking external" href="http://typographica.org/on-typography/my-favorite-font-sources-a-shortlist-of-trusted-foundries-and-retailers/" rel="nofollow">credible folk</a> about H&amp;FJ’s jaw-droppingly impressive webfonts, let’s talk about other sorts of Cloud Typography, during this week of cumulous typographic activity. </p>
    <p>The Cloud Appreciation Society boasts, well, an unabashed love of clouds. Member Danièle Siebenhaar offers an ambitious collection of <a class="freelinking external" href="http://cloudappreciationsociety.org/letters-in-the-sky/" rel="nofollow">clouds that look like letterforms</a>, amongst other recognizable shapes (a sleeping baby, for example).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/a-z_of_clouds_6246.jpg"></div><p></p>
    <p>I'm digging the F and the Z but that R is a bit suspect.</p>
    <p>I bet you were just thinking to yourself, “Gee, I wonder if there are some awesome examples of ASCII art clouds?” <a class="freelinking external" href="http://ascii.co.uk/art/clouds" rel="nofollow">Look no more</a>. </p>
    <p>This is exactly what yesterday’s thunderstorm looked like. EXACTLY.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/asciicloud_6010.png"></div><p></p>
    <p><a class="freelinking external" href="http://www.retrojunkie.com/asciiart/nature/clouds.htm" rel="nofollow">ASCII Art—Nature—Clouds</a>.</p>
    <p>Unicode character for ‘cloud’? U+2601. ☁</p>
    <p>Ugly typography word clouds? <a class="freelinking external" href="http://www.google.com/search?q=typographic+cloud&amp;tbm=isch&amp;tbo=u&amp;source=univ&amp;sa=X&amp;ei=ZkfSUeqFO6nx0wGsjoG4Cw&amp;ved=0CDgQsAQ&amp;biw=1292&amp;bih=779" rel="nofollow">There’s plenty of those</a>.</p>
    <p>Scott McCloud’s comic fonts? <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/scott-mccloud/" rel="nofollow">Sure</a>. </p>
    <p><a class="freelinking external" href="http://www.youtube.com/watch?v=raXanYjTF18" rel="nofollow">Bob Ross painting happy clouds</a>? </p>
    <p>Ok, a little off topic there.</p>
    <p>As you can see, H&amp;FJ is clearly going to encounter an uphill battle seizing that coveted number one spot in a Google search of “cloud typography”.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/googlesearchcloud_5006.png"></div><p></p>
    <p>Nevermind.</p>
