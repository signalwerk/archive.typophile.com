      <p>Yes, I was a bit concerned that my idea was either already available, or impossible to do, thus, a stupid suggestion. But I have since spoken to a couple of people and it sounds like the feature isn't something that's possible.</p>
      <p> I hate getting warnings when I'm trying to do something that is somewhat unorthodox. And since I'm not a technical person, I don't know what my unorthodox steps would lead to with regard to problems. </p>
      <p>Having said that, here is what I wanted to do. The issue is with ascenders and descenders extending past their parameters. If you want to make a font that has very long swashes that extend past the ascender and descender lines, when you generate the font, at least in FLAB, you get a warning.</p>
      <p>My idea was to create an OPENTYPE feature that would allow you to create a glyph at half the size of the rest of the font, and then the feature would double whatever point size the user had assigned the font from within a program.</p>
      <p>Over 20 years ago, when I first started making fonts with Fontographer, I discovered my own little trick for having characters extend past the boundaries without having them chopped off in PageMaker view. For example, if I wanted a swash letter y to extend far below the descender line, I would design it that way (ignoring the boundaries). I would then select the glyph cell from the main font window, and reduce it's size 50% (making sure that the metrics also reduced by half).</p>
      <p>I'd then generate the font, and begin using that "y" in my work. Of course it was only half size, so whenever it appeared, I would simply double the point size. For example, I would have a formal script and the text would be set at 36 point. If the bottom line of text had a "y" that I wanted to be a bit swashy and extend past the descender line, I would simply type in that alternate "y", and then make it 72 point. VIOLA! It appeared as it should, perfectly— and EVEN if the font was a script with connectors, it  lined up perfectly.</p>
      <p>The feature would be called dubl (double character size). Or I suppose it could be called prct (for glyph at a percentage of size).</p>
      <p>Let's say the lower case characters will have extended ascenders/descender. I thought that to program it,  I would make two classes:<br>
      _________________________________________________________</p>
      <p>[class]<br>
      dubl01: b d h j k l p q y</p>
      <p>[class]<br>
      dubl02: b.001 d.001 h.001  j .001  k .001 l .001  p .001  q .001  y .001<br>
      _________________________________________________________</p>
      <p>Then for the OpenType Feature, it would look something like this:<br>
      _________________________________________________________</p>
      <p>feature dubl { # Double Size Forms<br>
      # Latin;</p>
      <p>    sub @dubl01 by @dubl02;<br>
      } dubl;<br>
      _________________________________________________________</p>
      <p>That was my idea... and all because I hate those silly warnings.</p>
      <p>RL</p>
