      <p>I do encourage you to discuss the idea openly. There's no IP attached to OpenType Layout features, and if you were to claim IP, e.g. a patent, you'd probably guarantee that the feature would never be supported anywhere. At most, I think you risk someone telling you that the idea is stupid, and I think that unlikely.</p>
      <p>If you're simply shy, how about if I go first? These are a couple of OTL features that have been kicking around in my head recently:</p>
      <p>1. 'dcap' -- Drop Cap Forms<br>
      GSUB feature. Accesses variant glyphs for use as drop caps. In some fonts these might be identical to 'titl' glyphs. In some fonts they might even be floriated or otherwise decorated initials. Enumerated variants (type 3 lookups) could be linked to drop caps of different sizes, e.g. two-line caps, three-line caps, etc. Feature would interact with application drop cap functions.</p>
      <p>2. 'rcxt' -- Required Contextual Alternates<br>
      GSUB feature. While may fonts include contextual alternate glyphs that are discretionary (typically on by default using the 'calt' feature but possible to turn off), there are some designs in which text is malformed if contextual alternates are not used. This feature would house contextual lookups that would be on by default and could not be turned off by the user. Obviously a font might contain a combination of 'rcxt' and 'calt' features. [I would have used this in the Gabriola font for MS if it has been available, and am working on another project for which it would be relevant.]</p>
