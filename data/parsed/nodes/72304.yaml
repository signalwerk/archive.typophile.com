    <p>Hi everyone,</p>
    <p>I've been working on a font that's soon to be released, and I was thinking about a work around with a particular issue regarding the font. I came up with a solution that in theory, I know works. It has to do with manipulating the font manually within a particular program (like InDesign or Corel). </p>
    <p>It then occurred to me that it might be possible to create an OPENTYPE feature that performs the task automatically. I realize that for a new feature to come to fruition, it may take months if not years, but I think this is a very doable thing and it would solve some issues for a lot of type designers.</p>
    <p>So, my question is, how does one go about having an OpenType Feature developed? Who should be contacted— Adobe, Microsoft?</p>
    <p>Adam Twardock— do you have an idea? I wanted to email you directly, since I thought you'd probably know the answer, but I couldn't find your email address.</p>
    <p>Thanks in advance,</p>
    <p>RL</p>
  html_clean: |-
