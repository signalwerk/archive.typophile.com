    html: <p>Hi, Paul. Yes, I've also thought that the three states of OTL — on by default and cannot be turned off (required); off by default but can be turned on (discretionary); on by default but can be turned off (standard) — could have been addressed as a flag at the lookup level, rather than requiring multiple features. But that would require a completely different feature/lookup architecture than OT provides, and its too late in the day to make a fundamental change that would be backwards compatible with existing implementations. So it will have to be new features.</p>
