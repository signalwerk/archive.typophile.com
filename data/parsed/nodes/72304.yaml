      <p>Theunis, </p>
      <p>the full-blown Multiple Master implementation was present in the OpenType specification version 1.0, and was removed in version 1.3 (in 2001). The last version of the OpenType spec that includes the MM tables is version 1.25, and it is still available from:<br>
      <a href="http://web.archive.org/web/20010204051700/www.microsoft.com/typography/tt/tt.htm" title="http://web.archive.org/web/20010204051700/www.microsoft.com/typography/tt/tt.htm">http://web.archive.org/web/20010204051700/www.microsoft.com/typography/t...</a></p>
      <p>I've seen a few OpenType MM fonts, and principally it would be possible to implement a typesetting engine based on the OpenType spec including these removed tables. FontLab Studio even has code to read and (I believe also) write those tables, though they are not exposed to the user, since no current application implements them.</p>
