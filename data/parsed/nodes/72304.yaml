      <p>@ Robert</p>
      <p>The FontLab warning is regarding to the UPM size, but not to the boundaries (the the font bbox). FontLab reports a wrong information. And the report should not be called <em>warning</em>, but <em>information</em>.</p>
      <p>If you reduce the size of the glyphs, you loose precision.</p>
      <p>I am not sure, if I understand you correctly, but it sounds like you want to catch “bugs”, that are caused by the different misinterpretations of the specifications through the developers of DTP applications by adding a feature.</p>
      <p>As I said, I am not sure, if I understood you correctly, but I have more than doubts, that your feature would be registered, even if it would be actually technically realizable.</p>
      <p><em>I hate getting warnings when I'm trying to do something that is somewhat unorthodox.</em></p>
      <p>The term “unorthodox” is absolutely neutral in my understanding. I have an unorthodox but effective method for tying up my shoes. I never was warned, that it is the wrong method, but I got the info, that it is not the usual method. If it would be dangerous, I would be grateful for becoming informed, except the person, that informs me, has the unorthodox method to bring me in the danger of becoming a victim of my unorthodox method.</p>
